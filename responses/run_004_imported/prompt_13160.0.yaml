answer: |-
  The pen hovered over the intake form, the ink bead swelling at the tip of Dr. Aris Thorne's fountain pen. Across the desk, Elias sat with his hands clasped tightly in his lap, his thumbs rubbing against each other in a rhythmic, nervous friction.

  "Describe the sensation again," Thorne said.

  "It's not a vibration, exactly," Elias said, staring at the blank space on the form where a diagnosis would eventually sit. "It's an expectation. My pocket feels heavy. Warm. Like a phone is there, but when I reach in… nothing. Just lint. But my skin remembers the weight. It remembers the buzz."

  Thorne wrote: *Subject reports phantom haptic weight. No device present.*

  He was drafting the criteria for a new entry in the clinic's internal registry. They were calling it **Somatic Notification Disorder (SND)**. At this stage, Version 1.0, the definition was loose. It was meant to capture a specific anxiety of the connected age: the body misinterpreting silence as signal. Thorne capped the definition at *involuntary tactile hallucinations correlated with communication anxiety.*

  "Does it happen at night?" Thorne asked.

  "Only when I'm waiting for a call I know won't come," Elias said. "But now that I know it has a name… I notice it more. Knowing there's a word for it makes the pocket feel heavier."

  Thorne nodded, signing the form. He didn't write down that last sentence. It wasn't clinical data. It was philosophy. But he felt the weight of it. He handed Elias a pamphlet titled *Living with SND.*

  "Read this," Thorne said. "It helps to contextualize the sensation."

  ***

  Six months later, the clinic's waiting room was fuller. The pamphlets were gone, replaced by a tablet kiosk where patients checked in by selecting their symptoms from a dropdown menu. *Somatic Notification Disorder* was the third option down.

  When Elias returned for his follow-up, he didn't rub his thumbs. He sat with his hands flat on his knees, palms up, displaying them.

  "The pamphlet helped," Elias said, before Thorne could ask. "But the description in section four was ambiguous. It says 'correlated with communication anxiety.' But sometimes I feel the buzz when I'm happy. When I'm expecting good news."

  Thorne opened Elias's file. The previous notes were highlighted in yellow. "So the anxiety marker isn't consistent?"

  "No," Elias said. "And after reading the forum you linked… I realized I wasn't just feeling weight. I was feeling *frequency.*" Elias tapped his thigh. A short burst. A pause. Two short bursts. "That's a message. That's a call. My leg knows the difference now. Before the diagnosis, it was just a buzz. Now it's a language."

  Thorne felt a cold prickle at the base of his neck. In Version 1.0, the distinction between message and call was not part of the diagnostic criteria. The patients had found it, or perhaps, created it. By giving the sensation a name, they had given it structure. They were no longer just suffering from a glitch; they were speaking a dialect of it.

  "Does the sensation persist if you leave your phone at home?" Thorne asked.

  "I tried that," Elias said. "But then I feel the absence of the phone as the signal. The lightness of the pocket is the notification. That fits the criteria, doesn't it? *Somatic interpretation of device absence.*"

  Elias used the clinical phrasing perfectly. He wasn't reciting it to impress Thorne; he was using it to make sense of his own skin. He had become a student of his own pathology. Thorne looked at the intake form. The checkbox for SND was ticked. But the box felt too small for the man sitting in front of him. Elias wasn't just exhibiting symptoms; he was refining them.

  ***

  The conference room smelled of stale coffee and ozone from the projector. Five clinicians sat around the table, staring at the projected slide: *SND Criteria: Proposed Revision 2.0.*

  "The patients are rewriting the manual," said Sarah, the lead researcher. She tossed a stack of printouts onto the table. "We have a support group in the city. They've developed a taxonomy of 'ghost vibrations.' They have names for them. *The Swipe.* *The Ping.* *The Void.*"

  "They're mimicking the interface," Thorne said.

  "They're interacting with the classification," Sarah corrected. "We told them their bodies were misfiring. They decided their bodies were upgrading. If we don't tighten the criteria, SND will encompass anyone who owns a smartphone. It becomes a lifestyle, not a disorder."

  Thorne looked at the draft on the screen. *Version 1.0* had defined the disorder by the *presence* of a false sensation. *Version 2.0* needed to define it by the *distress* caused by the inability to verify it.

  "We add a exclusionary clause," Thorne said. "Criterion D: Symptom must persist despite a seventy-two-hour analog detox. If the sensation stops when the tech is removed, it's withdrawal, not SND."

  "And if they still feel it?" Sarah asked.

  "Then it's internalized," Thorne said. "Then it's truly a disorder of the self, not the device. We shift the classification from *Environmental-Induced* to *Endogenous Somatic.*"

  He typed the change. The text on the screen shifted. The definition narrowed. The loop was being tightened. They were trying to outrun the patients, to draw a box around a moving target. Thorne knew that by publishing Version 2.0, they were essentially handing the patients a new map. They would navigate to the new borders and see if they could cross them.

  ***

  Three months later. The intake kiosk had been updated. *Somatic Notification Disorder (Endogenous Type)* was now a sub-category.

  Elias sat in the same chair. He looked thinner, his eyes darker. He wore trousers with deep pockets, but Thorne knew from the pre-appointment screening that Elias had not owned a smartphone for four weeks. He was using a landline. He had passed the detox test.

  "How is the analog life?" Thorne asked.

  "Quiet," Elias said. "But the sensation didn't leave."

  "Describe it."

  "It's not a phone anymore," Elias said. He placed his hand over his sternum, not his pocket. "The detox made me realize I wasn't missing the device. I was missing the *potential* of being reached. Now, I feel the buzz in my chest. When the landline doesn't ring, my heart skips. I feel the vibration of a world that isn't trying to touch me."

  Thorne's pen hovered over the new form, Form 44-C. The criteria for *Endogenous Type* required the sensation to be localized to the extremities, mimicking device placement. Elias's symptom had migrated to his core. It was no longer about the phone. It was about the expectation of connection itself, stripped of the hardware.

  By defining the disorder as *Endogenous*, the clinic had invited the patients to look inward. They had told Elias, *'If you still feel it without the phone, it is you.'* So Elias had made it him. He had shed the external prop to ensure he still qualified for the diagnosis. To lose the diagnosis would be to lose the community, the language, the validation of his loneliness. He had evolved to survive the classification.

  "Chest vibration," Thorne murmured. He looked at the checklist. *Extremities.* He had to leave the box unchecked.

  "Does this mean I'm cured?" Elias asked. There was a panic in his voice. "Because I still feel it. It's worse. It's deeper."

  "No," Thorne said softly. "It means the category is wrong."

  Thorne turned the page to the notes section. He didn't check a box. He began to write in longhand. *Subject exhibits migration of haptic focus from peripheral to central nervous system following removal of external stimulus. Suggests disorder is not tethered to technology, but to the architecture of anticipation.*

  He paused. He knew what would happen next. He would submit this report. The board would meet. They would draft Version 3.0. They would call it **"Anticipatory Somatic Syndrome."** They would remove the reference to technology entirely.

  And then, Elias and the others would read the new definition. They would stop checking their pockets. They would stop looking at their phones. They would start clutching their chests. They would begin to describe the rhythm of their own heartbeats as messages. They would find new ways to be ill that fit the new words.

  Thorne looked at the pen in his hand. It was an analog tool, writing on paper, trying to capture a ghost that changed shape every time the light hit it.

  "I'm going to recommend a new classification," Thorne said.

  Elias nodded, a look of relief washing over him. He was safe. He was still a kind of person that could be named. "Will it be in the manual?"

  "Eventually," Thorne said.

  "Good," Elias said. He pressed his hand harder against his chest, feeling for the rhythm, checking to see if it matched the new rules before they were even written. "As long as it's real."

  Thorne signed the form. The ink was wet, vulnerable. He knew that by tomorrow, the reality described on this paper would be obsolete, eaten by the very people it was meant to describe. He placed the form in the out-tray and reached for a fresh sheet. The loop was turning again.
