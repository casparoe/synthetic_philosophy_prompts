answer: |-
  # The Mercury Paradox: Why Old Evidence Breaks the Bayesian Spell

  For the modern rationalist, Bayes' theorem is not merely a statistical tool; it is an epistemological commandment. To be rational is to have credences, and to learn is to conditionalize. When you read through the sequences of the rationalist blogosphere, you encounter a confident narrative: scientific progress is a sequence of belief updates, driven by the friction between prediction and observation. In this worldview, Einstein's General Relativity (GR) is often cited as a victory lap for Bayesianism. GR predicted the anomalous precession of Mercury's perihelion, a known anomaly that Newtonian mechanics could not resolve. The theory fit the data, the credences shifted, and science advanced.

  But there is a profound irony lurking in this standard example. As the philosopher Clark Glymour pointed out in 1980, the Mercury case is not a triumph of Bayesian confirmation theory; it is its most famous failure. This is the "Problem of Old Evidence" (POE). If Bayesian conditionalization is the *sole* mechanism of rational belief revision, the POE suggests that the most celebrated confirmations in the history of science are, strictly speaking, illusions.

  This essay will argue that the Problem of Old Evidence is not a mere bookkeeping quirk that can be smoothed over with technical patches. While Bayesian updates are necessary for maintaining coherence, the POE demonstrates that credence-updating on empirical data cannot be the whole story of evidential support. The Mercury case reveals that what actually drives confirmation is not the probability shift caused by new data, but the *explanatory relationship* between theory and fact. Bayesianism is an excellent logic of consistency, but it is an incomplete epistemology of discovery.

  ### The Formal Blockade

  To understand why POE is a crisis rather than a quirk, we must look at the math. In standard Bayesian confirmation theory, evidence $E$ confirms hypothesis $H$ if and only if learning $E$ increases the probability of $H$. Formally, $P(H|E) > P(H)$. By Bayes' theorem, this occurs when the likelihood ratio $P(E|H) / P(E)$ is greater than 1.

  In the case of Mercury, the anomalous precession ($E$) was known decades before Einstein formulated GR ($H$). For a scientist in 1915, the credence in $E$ was already 1. It was a known fact. If $P(E) = 1$, then $P(E|H)$ must also be 1 (a hypothesis cannot make a certainty more certain). Consequently, the ratio is $1/1 = 1$. The posterior probability equals the prior probability: $P(H|E) = P(H)$.

  On strict conditionalization, the discovery that GR accounts for Mercury provides *zero* confirmation. The evidence is "screened off" by its own certainty.

  Critics might dismiss this as a technicality, but it strikes at the heart of the Bayesian project. If the paradigm case of scientific confirmation fails the model, the model is descriptively inadequate. Furthermore, this problem generalizes. Most major scientific theories are judged by how well they accommodate existing data (Newton explaining Kepler's laws, Darwin explaining biogeography). If Bayesianism cannot account for the support lent by old evidence, it cannot account for the bulk of scientific reasoning. It reduces confirmation to a game of novel prediction only, rendering the explanatory power of accommodation epistemologically inert.

  ### The Bayesian Defenses

  Philosophers have not left this problem unaddressed. There are two primary strategies to rescue Bayesianism, each with significant costs.

  **1. Relaxing Logical Omniscience (The Garber Solution)**
  The most sophisticated defense, associated with Daniel Garber, Richard Jeffrey, and Ilkka Niiniluoto, attacks the idealization that agents are logically omniscient. Standard Bayesianism assumes that if $H$ entails $E$, the agent automatically knows $P(E|H) = 1$. But Einstein did not know GR entailed the Mercury anomaly until he performed the calculations.
  The Garber solution proposes that the "new evidence" is not $E$ itself, but the logical fact *that $H$ entails $E$*. We expand the probability space to include logical relations as random variables. The agent conditionalizes on the proposition "$H \to E$," which was not previously known with certainty.
  *   **The Cost:** This saves the formalism but changes the subject. It admits that the empirical evidence $E$ did no confirmatory work. The confirmation came from a logical insight. While this matches the psychological reality of discovery, it complicates the Bayesian framework significantly. It requires treating logical truths as uncertain, which violates the standard axioms of probability. More damningly, it suggests that confirmation is sensitive to the agent's computational limitations rather than the objective relationship between theory and world.

  **2. Counterfactual Credences**
  Another approach suggests we should evaluate confirmation based on what the agent's credence in $E$ *would have been* had they not known $E$ yet. We construct a hypothetical "ur-prior" where $P(E) < 1$, calculate the update, and claim this reflects the confirmatory power.
  *   **The Cost:** This approach is deeply subjective and unstable. How do we "unlearn" a fact like Mercury's orbit without altering the rest of our web of belief? There is no unique way to strip away knowledge, meaning the degree of confirmation becomes dependent on the specific fiction we construct. It renders confirmation a matter of imaginative storytelling rather than objective assessment.

  ### The Verdict: Accounting vs. Audit

  We are left with a choice. We can accept the Garber solution and admit that confirmation comes from logical insights, not empirical data. We can accept the Counterfactual solution and admit that confirmation is partly fictional. Or we can accept the Skeptical conclusion: that Bayesian conditionalization is not the full engine of rational belief revision.

  I argue for the third option. The Problem of Old Evidence proves that **credence-updating alone cannot be the whole story about evidential support.**

  The Garber solution is the most honest of the Bayesian patches, and it inadvertently reveals the truth. By shifting the confirmatory weight from $E$ to "$H \to E$," it acknowledges that the value of the Mercury case lay in the *explanatory connection*, not the data point itself. The data was static; what changed was our understanding of how the theory *unified* that data.

  This implies that Bayesianism is a theory of **accounting**, not **auditing**. It is a rigorous system for ensuring that your beliefs remain consistent once you have decided how they relate to one another. It tells you how to update if you know the likelihoods. But it cannot tell you where the likelihoods come from. In the case of old evidence, the "likelihood" ($P(E|H)$) only becomes salient because of *abductive reasoning*—Inference to the Best Explanation. We recognize that GR provides a unified, non-ad-hoc explanation for Mercury, and *therefore* we assign a high likelihood to the connection.

  If we rely solely on conditionalization, we are stuck with $P(E)=1$ and no update. To get the update, we must first engage in a non-Bayesian evaluation of theoretical virtue (simplicity, unification, lack of fudge factors). That evaluation sets the parameters that Bayes then processes.

  Therefore, the rationalist dogma that "rational belief revision just is conditionalizing" is false. It is incomplete. Rational belief revision is a hybrid process: it involves **explanatory judgment** to determine the structural relationships between hypotheses and evidence, followed by **Bayesian updating** to maintain probabilistic coherence.

  ### Conclusion

  The rationalist community is right to champion Bayes' theorem as a bulwark against cognitive bias and magical thinking. It is the best tool we have for quantifying uncertainty. But the Problem of Old Evidence shows that it is not a "settled epistemological law." It is a constraint on rationality, not a generator of it.

  The Mercury anomaly confirmed General Relativity not because it was new data, but because it was *explained* by a theory that demanded it. That explanatory power is a feature of the relationship between mind and world that probability calculus can model only retrospectively, and only with significant patching. To treat Bayesian conditionalization as the sole mechanism of support is to mistake the ledger for the business. We must keep the ledger, but we cannot ignore the work that happens before the entry is made. Rationality requires both the math of belief and the logic of explanation.
