answer: |-
  This is a sophisticated instinct, and you are right to avoid the "separate the art from the artist" cliché. That position is defensible, but as you noted, it's the path of least resistance. Your proposed angle is much more fertile ground for a seminar paper, but it does require careful handling to avoid the pitfalls you're worried about.

  Here is an honest breakdown based on your three questions.

  ### 1. Is your summary of the "sharp boundaries" claim accurate?
  **Yes, broadly speaking, but it needs precision.**

  Frege is indeed committed to the idea that a logical concept (*Begriff*) must be "complete" or "sharp." For any object, it must be determinately true or false that the object falls under the concept. There can be no borderline cases. This is tied to his adherence to the Law of Excluded Middle. If a definition leaves it open whether an object falls under a concept, Frege considers it defective for the purposes of *science* (by which he means rigorous, logical inquiry).

  **The nuance you need:** Frege acknowledges that *natural language* is full of vague concepts. His project in the *Begriffsschrift* and *Grundgesetze* is to construct a formal language that *eliminates* this vagueness. So, the claim isn't that the world *is* sharp, but that *thought* (properly construed) must be sharp.

  **Verdict:** Your summary is solid enough for a short paper, provided you specify that this is a normative requirement for his *logical system*, not necessarily a description of everyday reality.

  ### 2. Is the move from "re-use of concept" to "philosophical relevance" too quick?
  **Yes, as currently formulated, it is a bit too quick.**

  Here is the risk: Just because Frege uses the word "definition" or "boundary" in both contexts doesn't mean the logic *caused* the politics, or that the politics *invalidate* the logic. A critic could easily say, "So what? He used a metaphor from his work. That's biographical trivia, not philosophy."

  If you argue that the diary matters *only* because he uses the phrase "sharp boundaries" in it, you risk a superficial pattern match. The fact that a logician worries about definitions in a legal context isn't shocking; that's what lawyers do, too.

  **The deeper risk:** You need to avoid the **Genetic Fallacy**. You cannot argue that his logic is *wrong* because his politics were bad. But your goal isn't to invalidate the logic; it's to argue that the diary is *philosophically relevant* to understanding the logic. To do that, you need to bridge the gap between "he used a similar term" and "this reveals something about the nature of his philosophical project."

  ### 3. Is there a more careful/interesting version of this thesis?
  **Yes. Shift from "vocabulary" to "temperament" or "structural anxiety."**

  Instead of arguing that he simply applied his logic to politics, argue that **the same philosophical anxiety drives both projects.**

  Frege's entire career is driven by a horror of ambiguity, psychologism, and relativism. He wants thoughts to be objective, public, and immutable. He hates the "murky" realm of private ideas.
  *   **In Logic:** This manifests as a demand for sharp boundaries and formal rigor to prevent misunderstanding.
  *   **In Politics (per the diary):** This manifests as a desire for social order, hierarchy, and "purity" to prevent social "confusion" or decay.

  **The Stronger Thesis:** The diary is philosophically relevant not because it taints the logic, but because it reveals the **ethical and existential stakes** of Frege's demand for precision. The suppression of the diary by his editors (because it wasn't "scientific") ironically enacts a Fregean exclusion: they purged the "vague" biographical element to protect the "sharp" scientific legacy.

  **Suggested Angle for the Paper:**
  Focus on the **exclusionary nature of Frege's conception of "Science."**
  1.  Frege defines "Science" (*Wissenschaft*) as requiring sharp boundaries and objectivity.
  2.  Anything that doesn't fit (vagueness in logic; political ranting in the *Nachlass*) gets excluded.
  3.  The diary shows that Frege's drive for logical purity was part of a broader worldview that viewed ambiguity (in language, in law, in society) as a threat to be eliminated.
  4.  Therefore, reading the diary forces us to ask: Is the demand for "sharp boundaries" a neutral logical tool, or is it an expression of a specific will-to-order that has political consequences?

  ### Practical Advice & Sources
  *   **Michael Dummett:** You must reference Dummett. He was the one who really forced the analytic community to deal with Frege's antisemitism (specifically in his book *Frege: Philosophy of Mathematics* and the essay "Frege's Politics"). Dummett argues that Frege's politics are consistent with his philosophical temperament.
  *   **Don't overclaim:** Do not argue that Concept Script is fascist. Argue that the *impulse* behind Concept Script (total clarity, no ambiguity) is kin to the impulse behind the diary (total social order, no ambiguity about identity).
  *   **The "Scientific" Excuse:** The fact that the editors hid the diary because it wasn't "scientific" is a goldmine for your paper. It proves that the "Fregean tradition" actively defines itself by excluding the political/biographical. Your paper can challenge that definition.

  **Conclusion:**
  Your instinct is good. The "sharp boundaries" connection is real, but don't treat it as a simple analogy. Treat it as a **structural homology** between his logical requirements and his political desires. That moves you from "Frege was a bigot who liked logic" to "Frege's logic and his bigotry stem from a shared conception of what Order requires." That is definitely seminar-worthy.
