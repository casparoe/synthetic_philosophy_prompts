prompt: |-
  I'm moderating next month's departmental colloquium, where our guest will present from her forthcoming book on Spinoza's political philosophy. Her central claim is that the argument for democracy in the Political Treatise should be read as a direct application of the 'right is coextensive with power' doctrine set out in Chapter 2, rather than as an early liberal argument from natural equality -- and that this same doctrine drives the treatise's unfinished, notorious argument in Chapter 11 for excluding women from citizenship. Draft eight to ten questions for the Q&A that push past a simple restatement of her thesis. I want at least one question on why a purely power-based calculus should favor democracy over aristocracy or monarchy in the first place, one on whether the exclusion of women is a strict consequence of the power doctrine or a separable empirical premise she could jettison without cost to the main argument, and one on whether her reading leaves anything recognizably democratic -- as opposed to merely stable -- about Spinoza's preferred regime. For each, add a follow-up keyed to the answer she's most likely to give.
