answer: |-
  **Setting:** *A university seminar room, 6:30 PM. The students have gone, the projector is off, and the only light comes from the overhead fluorescents humming over the whiteboard. The board is covered in erased smudges and a few remaining formulas: $P(C|A)$, $f(w, A)$, $\Box \to$.*

  **Elena:** (Capping a dry-erase marker) You're still not buying it. I can see it in your face, Marcus. You're looking at the Oswald pair like it's a bug in the code, and I'm telling you it's a feature.

  **Marcus:** (Leaning against a desk, arms crossed) It's not a bug, it's a datum. And my code handles it. The indicative—"If Oswald didn't kill Kennedy, someone else did"—is evaluated relative to our *epistemic* state. Given what we know (Kennedy was killed), the closest worlds where Oswald didn't do it are worlds where someone else did. The counterfactual—"If Oswald hadn't killed Kennedy, someone else would have"—shifts the domain. Now we're looking at *metaphysical* similarity, holding the past fixed up to the moment of the shot. In those worlds, no backup assassin exists. So Kennedy lives. Different selection functions, same semantic engine. Why do I need to blow up truth conditions to explain that?

  **Elena:** Because the engine is idling. You're saying the semantic value of the indicative is a proposition, a set of worlds. But if it is, Lewis's triviality results should keep you up at night. If the probability of the conditional equals the conditional probability—and it does, intuitively—then your propositions collapse. You can't have a truth condition that tracks $P(C|A)$ without trivializing the probability function.

  **Marcus:** I know the result, Elena. But context-dependence dodges the bullet. The proposition expressed by $A \to C$ shifts with the context of assessment. Lewis assumes a fixed proposition across probability updates. I don't.

  **Elena:** That's the move, isn't it? "It's context-sensitive." But at what cost? If the proposition shifts every time my credence in $A$ shifts, then when I say "If it rains, the match is cancelled," and you have different background info, are we even disagreeing? Or are we just talking past each other about different sets of worlds? The Adams view explains the disagreement: we're expressing different degrees of belief conditioned on the same supposition. We're clashing in *attitude*, not in *fact*.

  **Marcus:** But that's where you hit the wall. Embedding. (He walks to the board and writes: $\neg(A \to C)$). "It is not the case that if Oswald didn't kill Kennedy, someone else did." Students parse this instantly. They treat the conditional as a constituent that negation operates on. If your expressivism is right, and $A \to C$ isn't a proposition but a rule for updating belief, what is negation negating? You can't negate an imperative. You can't negate a habit.

  **Elena:** We've been over this. We treat the embedding as a complex speech act. To assert $\neg(A \to C)$ is to express a rejection of the conditional commitment. It's not truth-functional negation in the classical sense, but it's logically coherent within a expressivist framework. Gibbard showed us how to handle the contradictions.

  **Marcus:** Gibbard showed you how to handle *simple* contradictions. Try nesting them. "If, if Oswald didn't do it, someone else did, then the conspiracy was large." Now you have a conditional in the antecedent. For me, that's just a proposition serving as the antecedent for another selection function. $f(f(w, A \to C), D)$. For you? What is the input to your second conditional? It's not a truth-apt sentence. So how does the second 'if' grab onto it? You end up needing a proxy proposition just to get the syntax to work, which looks suspiciously like... truth conditions.

  **Elena:** (Sighs, erasing a corner of the board) Okay, that's a punch. Nested conditionals are the expressivist's cross to bear. But let's talk about your "unified engine." You say the difference is just the selection function. Epistemic for indicatives, metaphysical for counterfactuals. But look at the Oswald indicative again. "If Oswald didn't kill Kennedy..." We know he did. So we're evaluating a conditional where the antecedent is known false.

  **Marcus:** Known false *by us*, but not false in the epistemically live worlds.

  **Elena:** Exactly. But now consider the past tense. In the counterfactual, "If Oswald *hadn't* killed," the past perfect signals a backtracking or a miracle. In the indicative, "If Oswald *didn't* kill," the simple past is just... factual. If your semantics is unified, why does the tense morphology behave differently? On my view, it's because the indicative isn't trying to describe a remote world; it's constraining our current information state. The tense is just agreement. On your view, you have to stipulate that the selection function for indicatives ignores the actual falsity of the antecedent but respects the actual truth of the consequent. That's not a unified theory; that's two theories sharing a paint job.

  **Marcus:** It's not stipulation; it's the nature of the conversation. Indicatives are for learning. Counterfactuals are for explaining. When I use an indicative, I'm inviting you to add $A$ to your knowledge stock and check $C$. When I use a counterfactual, I'm asking you to hold the laws of nature fixed and tweak the history. The semantics is the same—quantification over a selected set of worlds—but the *parameters* of selection are fixed by the mood. That's unity.

  **Elena:** Is it? Because if the parameters shift that drastically, the logical behavior should shift too. And it does. Indicatives validate Antecedent Strengthening less readily than counterfactuals in certain epistemic contexts. But here's the real problem for you: The *truth* of the indicative Oswald sentence. You want to say it's true. But on a possible worlds account, it's true only if in all closest epistemic worlds where Oswald didn't do it, someone else did. What if there's an epistemically live world where Oswald didn't do it, and *no one* did? Maybe a lone gunman hypothesis that hasn't been ruled out yet.

  **Marcus:** Then the indicative is false, or at least not assertable.

  **Elena:** But everyone agrees the indicative is *true*. We assert it confidently. Why? Because we know Kennedy was killed. The truth of the consequent is doing the heavy lifting, not the connection between antecedent and consequent. That's why the probability account works. $P(\text{Someone else did} | \text{Oswald didn't})$ is 1, because $P(\text{Someone else did})$ is 1. The conditional probability collapses into the unconditional probability of the consequent when the consequent is known. Your possible worlds machinery has to work hard to mimic that. Mine just accepts it.

  **Marcus:** (Pauses, uncrosses his arms) I'll grant you that. The "known consequent" case is tricky for standard Stalnaker semantics. We have to ensure the selection function doesn't wander off into worlds where the consequent fails just because the antecedent is tweaked. But Elena, if you give up truth conditions, you give up the ability to explain why conditionals interact with logical connectives the way they do. You said nested conditionals are a pain for you. They're a nightmare. But consider disjunction. "Either if A then B, or if C then D." We reason with these. We prove theorems using them. If they aren't propositions, what are the objects of our logical proofs?

  **Elena:** The objects are the *inferences*, not the sentences. Logic is a theory of consistency among attitudes, not just truth-preservation among propositions.

  **Marcus:** That's a retreat. You're redefining logic to save the semantics.

  **Elena:** And you're redefining truth to save the semantics! You're willing to say the proposition expressed changes with context to avoid triviality. I'm willing to say the logical form is more complex to avoid truth conditions. Who's being more charitable to the data?

  **Marcus:** (Walks back to the board, picks up the eraser) Let's try this. Suppose we meet halfway. What if indicatives *do* have truth conditions, but they are context-dependent in a way that mirrors the Ramsey Test? The proposition is the set of worlds compatible with the common ground where the conditional probability is high.

  **Elena:** Then you're back to Lewis. If the proposition depends on the probability, and the probability depends on the agent, you lose objectivity. Two agents can assert contradictory conditionals, both be "right" relative to their own probabilities, and have no genuine disagreement. But if I say "If it rains, it will pour" and you say "If it rains, it won't pour," we *are* disagreeing. I want to say you're wrong, not just differently calibrated.

  **Marcus:** And I want to say you're both expressing propositions, and in a single context, one must be false. That's what logic demands.

  **Elena:** (Smiles faintly) So we're back to the stalemate. I can't explain the embedding without sweating. You can't explain the probability without sweating.

  **Marcus:** (Erases the $f(w, A)$) The Oswald pair remains the rock we break our teeth on.

  **Elena:** Maybe the rock is telling us something. Maybe "if" isn't one word. Maybe the indicative is a probabilistic operator and the counterfactual is a modal quantifier.

  **Marcus:** Heterodox. Ugly. But maybe true. (He caps the marker). Dinner?

  **Elena:** Only if we agree not to talk about conditionals.

  **Marcus:** Deal. We'll talk about causation.

  **Elena:** (Groans) God help us.

  *(They turn off the lights and head for the door, leaving the whiteboard half-erased, the ghost of $P(C|A)$ still visible in the smudges.)*
