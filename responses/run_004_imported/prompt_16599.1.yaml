      *   **Scene 3: The Process.** How do you manufacture respect? Studying the person. Finding the good. Ignoring the bad. It becomes a habit.
      *   **Scene 4: The Present.** Julian is in the house. He feels the respect. But he remembers the ledger. The transaction.
      *   **Scene 5: The Knot.** He tries to separate the feeling from the cause. He can't.

  4.  **Developing the Voice:**
      *   Needs to be first-person or close third-person to feel the internal conflict. Let's go with close third-person focused on Julian.
      *   Avoid judgment. Don't say "Julian felt guilty." Describe the sensation of the feeling being "hollow" yet "full."
      *   Focus on the *mechanics* of the emotion.

  5.  **Writing - Iteration 1 (Mental Outline):**
      Julian gets the house. He stands in the library. He thinks about Elias. He loves him now. But he remembers the lawyer reading the clause. "Genuine regard." He practiced it. He found Elias's good traits. Now they are his traits. But the root is money. Is the fruit poisoned?

  6.  **Writing - Iteration 2 (Focusing on Sensory Details):**
      The dust in the room. The smell of old paper. The specific way Elias drank tea. Julian mimics it. Is the mimicry now instinct?
      *Key metaphor:* Gardening. You plant a seed for harvest, but the flower blooms anyway. Does the intent matter to the flower?
