answer: |-
  The house smelled of lemon oil and dried tobacco, a scent Arthur had spent three years learning to associate with safety, with wisdom, with *home*. Now, standing in the library after the funeral, the scent triggered a tightness in his throat that was unmistakably grief.

  He knew the physiology of it. The constriction of the diaphragm, the sting behind the eyes. It was real. If he were hooked up to a polygraph right now, thinking about his uncle Silas, the needle would jump. He loved the man. He missed him.

  And that was the rot.

  Three years ago, the lawyer had laid out the codicil on this same mahogany desk. Silas was already sick then, his eyes bright and bird-like in a gaunt face. The estate was vast, enough to erase Arthur's debts and fund his life. But the money wasn't a gift; it was a wage. The condition wasn't caretaking. Silas had nurses for that. The condition was *regard*.

  "I don't want your duty, Arthur," Silas had said, tapping the paper. "Duty is cheap. I want your respect. And I want it to be true. I'll know if it's not. If you take the money while despising me, the trust dissolves. You have to mean it."

  Arthur had been desperate. He had looked at the bitter, difficult old man—a man who had alienated his own children, a man who was petty and cruel and intellectually arrogant—and calculated the odds. He decided to treat it like a job. He would mine the man for value. He would excavate reasons to admire him until the admiration stuck.

  It started as a cognitive exercise. When Silas berated the gardener for a misplaced shrub, Arthur didn't see cruelty; he reframed it as *exactitude*. When Silas lectured for an hour on the decline of modern architecture, Arthur didn't hear boredom; he listened for the *consistency of vision*.

  Arthur became an archaeologist of Silas's character. He dug. He brushed away the dust of the man's temper. He found shards of integrity. He found moments where Silas had been generous in secret. He found that the man's stubbornness was also a kind of courage.

  Arthur polished these shards. He held them up to the light. He showed them to Silas. "I see what you did there," Arthur would say. "That was principled."

  Silas would grunt, suspicious, but he would soften.

  Over time, the reframing stopped being a strategy and started being a habit. Arthur's brain rewired itself. He stopped seeing the shrub and saw the principle. He stopped hearing the lecture and heard the philosophy. The resistance he had to muster to feel respect evaporated. The muscle memory of admiration took over.

  By the second year, Arthur wasn't pretending. When Silas died, Arthur wept in the hallway. He wept for the loss of the mind, the loss of the company. He wept because the world was now dimmer without Silas in it.

  Now, standing in the silence of the library, Arthur held the deed to the house in one hand and a photograph of Silas in the other. He waited for the guilt to come, the feeling that he was a fraud. But that was the easy part. He wasn't a fraud. The love was there. It was solid. It had weight.

  The problem was the architecture of it.

  He looked at the photograph. He felt the surge of affection. But he could trace the load-bearing walls of that affection back to the foundation, and the foundation was a bank account.

  If Silas had been poor, would Arthur have bothered to look for the shards? If there had been no estate, no codicil, no threat of destitution, would he have spent the hours listening to the lectures? Would he have practiced the patience required to see the courage in the stubbornness?

  No. He wouldn't have. He would have walked away years ago. He would have dismissed Silas as a bitter old man and missed the wisdom entirely.

  So the wisdom was real. The respect was real. But the *access* to them had been purchased.

  Arthur walked to the window. He felt a profound sense of loss, but it was tangled with a cold, transactional clarity. He had bought the capacity to love his uncle. He had paid for it with three years of his life and the initial intent of greed, but the currency had converted.

  Was the feeling tainted because the door was locked until he had the key? Or was the key irrelevant now that he was inside the room?

  He touched the glass of the window. He missed Silas. He would carry that missing for the rest of his life. It was a heavy, genuine weight in his chest. But every time he felt that weight, he would also feel the ghost of the ledger. He would know that this grief was a bonus clause in a contract.

  He knew that if he told anyone, "I genuinely loved him," they would nod. They would see the tears, hear the eulogy. They wouldn't know that the love was a cultivated crop, planted for harvest, that just happened to bloom.

  Arthur turned back to the room. The lemon oil smell was comforting. It made him feel safe. He hated that it made him feel safe. He hated that the comfort was real. He stood there, holding the genuine grief and the genuine origin story in the same hand, unable to drop either, waiting for a resolution that didn't come, just a man in a room full of things he owned, loving a ghost he had paid to know.
