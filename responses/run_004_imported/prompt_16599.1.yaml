      *   *Decision:* I'll use a slightly modified version of the prompt's scenario. An aging artist and a protégé. The inheritance is the studio/archive. The condition is "understanding" the work. Or, let's go with the prompt's specific "admiration" angle but make it about a father and son. It hits harder. A father who demands love, but ties it to an inheritance.
      *   *Refinement:* Let's make it a woman caring for an aging, difficult mentor. The reward is the legacy (publishing her work under his name, or taking over his practice). The feeling is *reverence*.
      *   *Actually, let's stick to the prompt's specific "Uncle/Nephew" vibe but make it modern and psychological.* Let's call them Elias (uncle) and Julian (nephew). The estate is a house. The feeling is "respect."

