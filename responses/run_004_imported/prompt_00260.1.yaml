      *   Actually, the strongest counter-argument is that the Discursive Dilemma is a problem of *consistency*, whereas Condorcet is a problem of *transitivity*. While related, solving transitivity doesn't guarantee logical consistency across interconnected propositions if the aggregation rule isn't designed for judgment aggregation (e.g., premise-based vs. conclusion-based).
      *   Wait, let's look closer. If we treat each *consistent judgment set* as a candidate, then yes, it becomes a preference aggregation problem. But the number of candidates explodes, and the "voters" (judges) might not have preferences over judgment sets, they have judgments on propositions.
