          *   Discursive dilemma is about inconsistent *truth values* ($P, Q, \neg(P \land Q)$).
          *   You can't run Schulze on logical propositions in the same way. Even if you treat the "verdicts" as candidates, the dilemma arises from *how* you aggregate (premises vs. conclusion), not just the cycle.
