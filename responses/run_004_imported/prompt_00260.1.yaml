          *   The discursive dilemma isn't about picking a winner; it's about maintaining *logical coherence* across a set of binary judgments.
          *   Applying Schulze to the *outcomes* might pick a verdict, but it doesn't solve the premise-conclusion inconsistency if you vote on premises separately. If you vote on the conclusion directly, you avoid the dilemma but lose the "reason-based" aspect.
          *   The "solution" to the discursive dilemma usually involves changing the *agenda* (premise-based vs. conclusion-based procedures) or accepting inconsistency, not just running a better cycle-breaking algorithm on preferences.

