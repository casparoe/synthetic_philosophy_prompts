answer: |-
  This is a sophisticated question that cuts to the heart of how we understand normative obligations. You have done a great job engaging with the texts, but I believe your summary flattens a crucial distinction that both Hume and Scanlon (and the broader literature) are at pains to establish.

  The short answer is: **No, that is not a fair summary.** Your interpretation relies on viewing a promise as a *prediction* or a *report* of a mental state (which can be true or false). However, both Hume and Scanlon view a promise as a *performative act* that creates a new normative reality (an obligation), independent of the sincerity of the initial intention.

  Here is where your reading of the texts might be missing the mark, and why your intuition that you were wronged is actually supported by the philosophy you've read.

  ### 1. The Category Mistake: Prediction vs. Commitment
  Your analysis rests on the idea that a promise is a "sincere declaration of a present intention." If that were true, then breaking a promise would indeed only be wrong if that declaration was insincere (i.e., a lie).

  However, most philosophical accounts of promising distinguish between **stating an intention** and **undertaking an obligation**.
  *   **Statement:** "I intend to co-sign." (If I change my mind, I was just wrong about my future psychology, but not necessarily immoral.)
  *   **Promise:** "I promise to co-sign." (This creates a duty to co-sign *unless* released from that duty.)

  When you promise, you are not just describing your future; you are giving another person a right to expect your performance and a claim against you if you fail. Therefore, breaking a sincere promise is not "lying about the past"; it is "violating a present obligation."

  ### 2. Hume: The Artificial Virtue
  Your reading of Hume is the most vulnerable point in your summary. Hume is famously skeptical that promising stems from a natural mental act or sincerity. In the *Treatise* (Book 3, Part 2, Section 5), Hume argues explicitly **against** the idea that the obligation of a promise arises from a resolution of the mind.

  *   **The Argument:** Hume notes that we cannot simply "will" a new obligation into existence by a mental act. If I sincerely intend to do X today, but my circumstances change tomorrow, nature does not bind me to that past intention.
  *   **The Convention:** For Hume, promising is an **artificial virtue**. It is a social technology (a convention) we invented to solve coordination problems. The moral force comes from the *utility of the convention itself*, not the sincerity of the promisor.
  *   **The Wrong:** When your friend broke the agreement, she didn't necessarily prove she was a liar at $t_1$. Rather, she undermined the **convention of promising** at $t_2$. If people could exit promises whenever their sincere intentions changed, the convention would lose its utility, and social cooperation would collapse.
  *   **Application:** For Hume, your friend wronged you not because she lied, but because she violated a social convention that you both relied upon to coordinate your lives. She took the benefit of the convention (your reliance on her) without bearing the cost (holding to the agreement despite changed incentives).

  ### 3. Scanlon: Principle F and Reliance
  T.M. Scanlon's account in *What We Owe to Each Other* (Principle F) is also more robust than the "sincerity" reading. Scanlon focuses on the **expectations and reliance** created in the promisee.

  *   **Principle F:** Scanlon argues that if you intentionally lead someone to expect that you will do X, and you know they will suffer significant loss if you don't, you must do X *unless* they consent to your not doing it.
  *   **The Duty to Warn/Release:** Crucially, Scanlon's framework implies a duty to negotiate release. Even if your friend's intention changed sincerely, the wrong lies in **failing to account for the reliance she induced**.
  *   **Application:** You "scrambled to find a new co-signer." This is a reliance cost. Under Scanlon's view, your friend created an assurance that you relied upon. When her intentions changed, she incurred an obligation to ensure you were not left in the lurch (e.g., by helping you find a replacement immediately or compensating you for the trouble). Simply announcing the change and walking away ignores the normative bond created by the initial assurance.

  ### 4. The "Lying Reduction" in the Literature
  You asked if the literature generally traces the wrongness of breaking a promise back to the wrongness of lying. The consensus is actually the opposite.

  *   **Fraudulent Promising:** This is making a promise with no intention to keep it. This *is* lying.
  *   **Breach of Promise:** This is making a promise with the intention to keep it, but failing to do so later.

  If these were the same moral failing, there would be no need for distinct concepts like "excuse," "justification," or "release." The literature generally holds that you can wrong someone by breaking a sincere promise because you have violated their **right to rely** on your word.

  Philosophers like Margaret Gilbert (on "joint commitment") or Joseph Raz (on "normative powers") argue that when you promise, you change the normative landscape. You give the other person authority over your actions regarding that promise. By unilaterally changing your mind, you usurp an authority you granted to them.

  ### 5. Why Your Intuition is Philosophically Sound
  Your feeling of betrayal is not an intuition that "outruns" the philosophy; it is an intuition that grasps the **relational** nature of promising which your initial reading missed.

  *   **You feel wronged** because you were invited into a state of joint commitment. You likely turned down other potential co-signers or made financial plans based on her word.
  *   **The Philosophy supports this** because both Hume and Scanlon ground the obligation in the *social/relational context*, not the *internal mental state* of the promisor.

  **Where the philosophy might nuance your judgment:**
  While the philosophy supports the idea that you were wronged, it might also suggest looking at *how* she broke the promise.
  *   Did she offer to help find a replacement?
  *   Did she apologize for the inconvenience?
  *   Was the "cheaper studio" a genuine necessity (financial hardship) or just a preference?

  Scanlon, for instance, allows that promises can be broken if the cost to the promisor is disproportionately high compared to the reliance of the promisee. If she was facing actual financial ruin by co-signing, Scanlon might argue she was justified in breaking the promise, *provided* she handled the release correctly. But if she just found a "better deal" for herself while leaving you to scramble, that is likely a violation of Principle F.

  ### Conclusion
  You are not flattening the texts; you are reading them through a "sincerity model" that both Hume and Scanlon explicitly argue against.
  *   **Hume** says the obligation is conventional, not psychological.
  *   **Scanlon** says the obligation is based on induced reliance and assurance, not just stated intent.

  Your friend may not have lied, but under both accounts, she likely still wronged you by unilaterally dissolving a normative bond that you had relied upon to your detriment. Your philosophical friend pointed you to the right books, but the conclusion you drew from them misses the main point: **Promising isn't about telling the truth about your mind; it's about binding your will to another person.**

