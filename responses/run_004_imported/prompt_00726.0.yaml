answer: |-
  You are not missing a reconciliation, and it isn't a loose thread. You have put your finger on the exact pivot point where Tolstoy stops being an aesthetic theorist and starts being a moral preacher.

  You are absolutely right that these are two separate scales. The way to resolve them isn't to find where they merge, but to see how Tolstoy **ranks** them.

  Here is the breakdown of how Tolstoy structures the argument, which should help your piece:

  ### 1. The Definition (The "Is it Art?" Test)
  In the first half, Tolstoy is trying to distinguish **Art** from **Counterfeit Art**.
  *   **Criterion:** Infectiousness (driven by sincerity, clarity, individuality).
  *   **Verdict:** If it infects you, it is Art. If it doesn't, it is Counterfeit.
  *   **Your Propaganda Example:** A potent piece of Nazi propaganda or a brilliant but decadent poem *passes* this test. Tolstoy admits they are "Art."

  ### 2. The Evaluation (The "Is it Good Art?" Test)
  Once a work has passed the first test and been certified as "Art," he moves to the second scale to determine its **value**.
  *   **Criterion:** The "religious perception of the age" (essentially, Christian universal brotherhood/love).
  *   **Verdict:**
      *   **Good Art:** Infects the viewer with feelings that unite humanity (love, compassion).
      *   **Bad Art:** Infects the viewer with feelings that divide humanity (lust, pride, patriotism, exclusivity).
  *   **Your Propaganda Example:** That same potent propaganda *fails* this test. It is "Art," but it is "Bad Art."

  ### The Hierarchy
  Tolstoy's "contradiction" is actually a deliberate subordination. He is arguing that **aesthetics are subservient to ethics.**

  When he writes, *"The stronger the infection the better is the art, as art, speaking now apart from its subject-matter,"* he is using the phrase "as art" very specifically. He means "as a mechanism of transmission." He is conceding that a work can be technically perfect and emotionally potent (high aesthetic value) but morally repugnant (low ethical value).

  However, Tolstoy ultimately argues that the ethical value swallows the aesthetic value. He famously uses this framework to trash-can almost all the classics—including his own *War and Peace* and Shakespeare—labeling them "Bad Art" because they catered to the upper classes rather than the universal religious consciousness of the peasantry.

  ### For Your Piece
  If you are writing about emotional contagion, this distinction is gold.
  1.  **Tolstoy anticipated the mechanism:** He correctly identified that the *power* of art lies in the transmission of affect (contagion), regardless of content.
  2.  **Tolstoy feared the mechanism:** He realized that if contagion is the engine, then the *destination* matters more than the *speed*. A virus that spreads quickly (strong infection) is dangerous if it's a deadly virus (bad subject matter).

  **The Verdict:** It's not a loose thread; it's a trap he set for the aesthetes. He lures you in with a formalist definition (it's about the feeling!) only to slam the door with a moralist judgment (but only the *right* feelings count).

  So, to answer your question: You aren't missing a reconciliation. Tolstoy is telling you that a highly infectious piece of "ugly" art is still art, but it is dangerous, and therefore, in the grand scheme of human life, worthless.
