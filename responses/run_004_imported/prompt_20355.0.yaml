answer: |-
  This is an excellent question that cuts through a lot of the rhetorical fog that often surrounds the rationalist diaspora's decision theory discussions. You are right to be suspicious of the "vibes-based" equivalence often drawn between Hofstadter's 1983 columns and the modern acausal trade literature.

  While they share a common engine, there is substantive daylight between them. The short version is: **Superrationality is a claim about logical identity in symmetric games; Acausal Trade is a claim about comparative advantage across heterogeneous agents.**

  Here is the breakdown of where they diverge, why the multiverse assumption matters more for one than the other, and which one survives contact with decision-theoretic rigor.

  ### 1. The Shared Engine: Rejecting Causal Decision Theory
  First, the common ground. Both Hofstadter's superrationality and Oesterheld's acausal trade rely on the same rejection of Causal Decision Theory (CDT).

  CDT says: *My action cannot causally affect the action of a distant or disconnected agent. Therefore, I should defect.*
  Superrationality/Acausal Trade says: *My action is logically correlated with the other agent's action because we run similar reasoning algorithms. Therefore, I should choose the output that leads to the best global outcome given that correlation.*

  In modern terms (Yudkowsky/Soares), this is the core of **Functional Decision Theory (FDT)**. Both concepts argue that you should treat your decision as the output of a logical function that may be instantiated in multiple places. If you change your output, you logically change the output of all instantiations of that function.

  So, on the *mechanism* of decision-making, there is no daylight. They are using the same lever.

  ### 2. The Crucial Divergence: Coordination vs. Trade
  This is where your intuition about "gains from trade" is spot on.

  **Hofstadter's Superrationality** is fundamentally about **coordination in symmetric dilemmas**.
  In the Prisoner's Dilemma (PD) scenario Hofstadter analyzed, the agents are assumed to be relevantly identical. They have the same payoff matrix. If they reason correctly, they both Cooperate. There is no "trade" happening here in the economic sense. I am not doing something you value more than I do; we are both doing the thing that maximizes our *own* utility, relying on the fact that our utilities are aligned by the symmetry of the situation. It is a solution to the problem of *aligned incentives failing due to causal isolation*.

  **Oesterheld's Acausal Trade** is fundamentally about **exchange in asymmetric situations**.
  Oesterheld explicitly introduces agents with *different* utility functions. Agent A values paperclips; Agent B values staples. In a causal world, they ignore each other. In an acausal framework, if A knows B exists and is correlated, A can produce staples (which costs A little but helps B a lot) in exchange for B producing paperclips (which costs B little but helps A a lot).

  This requires **comparative advantage**. If the agents are identical (Hofstadter's case), there are no gains from trade, only gains from coordination. If the agents are different (Oesterheld's case), superrationality alone isn't enough; you need a bargaining solution (like the Nash Bargaining Solution or Kalai-Smorodinsky) to determine the "compromise utility function."

  **The Daylight:** Superrationality solves the "Twin PD." Acausal trade solves the "Interstellar Barter." Acausal trade *adds* the requirement of value heterogeneity and a bargaining protocol, which Hofstadter's original formulation did not address.

  ### 3. The Role of the Multiverse: Necessary vs. Amplifying
  You asked if the multiverse move is just "dressing up an inconsequential party-game observation."

  For **Superrationality**, the multiverse is **amplifying but not strictly necessary**.
  Hofstadter's argument works with just *one* twin. If you know there is exactly one other person in the universe running your exact source code, you should cooperate in the PD. The multiverse just increases the stakes (more twins = more impact), but the decision-theoretic logic holds in a single universe with one copy.

  For **Acausal Trade**, the multiverse (or a sufficiently large sample space of minds) is **structurally necessary**.
  Why? Because in a single, finite universe, the probability of encountering a sufficiently correlated agent with *complementary* values is vanishingly small.
  *   To make the EV calculation work for acausal trade, you need: $P(\text{correlation}) \times \text{Benefit to Other} > \text{Cost to Self}$.
  *   Since the Benefit to Other is weighted by *their* values (which you don't hold), you only do it if the correlation probability is high enough or the number of partners is large enough to swamp the cost.
  *   In a Tegmark Level IV multiverse (all mathematical structures exist), there are infinite agents. Even if the measure of agents correlated with you is tiny, the absolute number is infinite. This allows the EV to become significant.

  Without the multiverse assumption, acausal trade collapses into a curiosity with negligible expected value. Superrationality survives as a normative claim about rationality even in a lonely universe.

  ### 4. Decision Theoretic Robustness
  Which holds up better when you strip away the cosmology?

  **Superrationality is the more robust piece of decision theory.**
  It is a local claim about how to reason when you know your reasoning process is mirrored. It aligns closely with FDT. It doesn't require you to believe in Everett branches or infinite space; it only requires you to accept that logical facts are not causally mediated. If you accept FDT, you are a superrationalist in symmetric games, regardless of cosmology.

  **Acausal Trade is fragile.**
  It depends on three heavy assumptions:
  1.  **FDT/Superrationality is true.** (The engine works).
  2.  **The Multiverse is real and accessible via logical correlation.** (The market exists).
  3.  **We can compute/estimate the "Compromise Utility Function."** (The exchange rate is knowable).

  The third point is the killer. In Hofstadter's PD, the deal is obvious (Cooperate/Cooperate). In Oesterheld's multiverse, how much should I sacrifice of my values for yours? If I worship paperclips and you worship staples, what is the exchange rate? Oesterheld suggests a proportional compromise, but without communication, how do we converge on the *same* bargaining solution? If we pick different points on the Pareto frontier, we might both incur costs without receiving benefits (the "acausal deadlock").

  Superrationality avoids this by assuming symmetry. Acausal trade inherits all the problems of bargaining under uncertainty, multiplied by the impossibility of verification.

  ### 5. The "Luring Lottery" Context
  A quick correction on your historical framing: The **Luring Lottery** (June 1983) and **Superrationality** (December 1983) were distinct columns, though related.
  *   **The Lottery:** Showed that standard game theory breaks down when moves are unbounded (everyone writes infinity, prize becomes zero). It was a *reductio ad absurdum* of standard rationality in a specific contest.
  *   **Superrationality:** Was the positive proposal for how to handle the Prisoner's Dilemma.

  The connection you're drawing is valid: both show that "individual maximization" leads to ruin when agents are logically coupled. But the Lottery was about the failure of Nash Equilibria in unbounded games; Superrationality was about the success of logical correlation in bounded dilemmas. Acausal trade leans much harder on the Superrationality column than the Lottery one.

  ### Summary Verdict
  Is acausal trade just repackaging? **No.** It is a genuine extension of the logic into the domain of heterogeneous values.
  *   **Superrationality:** "We think alike, so we will both choose the option that is best for us *given* that we both choose it." (Coordination)
  *   **Acausal Trade:** "We think alike about how to bargain, so I will choose the option that is best for *you* (which you value highly) in exchange for you choosing the option best for *me*." (Exchange)

  However, regarding your final question on which holds up better as decision theory: **Superrationality wins.**
  It requires fewer ontological commitments. It works in a single universe. It doesn't require solving the problem of inter-utility bargaining without communication. Acausal trade is a fascinating *application* of superrationality, but it relies on cosmological speculation to make the numbers work, whereas superrationality relies only on the nature of logical implication.

  If you strip away the multiverse, superrationality remains a coherent (if controversial) normative claim about rational agency. Acausal trade becomes a ghost story.
