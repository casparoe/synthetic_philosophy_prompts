      *   Ensure the distinction between "coordination" (Superrationality) and "trade" (Oesterheld) is sharp.

  7.  **Final Polish:** Check against the user's specific questions:
      *   *Daylight vs. Repackaging?* It's an extension, not just repackaging.
      *   *Does it require real differences in value?* Yes, that's the definition of trade.
      *   *Is the multiverse just dressing?* No, it's necessary for the EV calculation in trade.
      *   *Which holds up better as DT?* Superrationality (FDT core) is more robust.

  8.  *(Self-Correction during drafting)*: Make sure to mention Functional Decision Theory (FDT). Yudkowsky/Soares formalized this later, but it's the modern name for the mechanism underlying both. It helps ground the "vibes" in formal DT.

  9.  *(Final Review of the "Luring Lottery" point)*: The user mentions the Lottery prompted the reread. The Lottery showed that if everyone maximizes individually, the prize vanishes. Superrationality says if everyone maximizes *collectively via logical correlation*, the prize is shared. Oesterheld takes this to: if everyone maximizes a *weighted collective*, everyone wins more. Okay, the thread is clear.

