      *   *Point 2: Symmetry vs. Comparative Advantage.* This is the big differentiator. Hofstadter = Identical agents, identical goal (maximize payout). Oesterheld = Different agents, different goals, swapping favors. This moves it from "Newcomb's Problem with a friend" to "International Trade without borders."
      *   *Point 3: The Multiverse Necessity.* Why does Oesterheld need the multiverse? Because in a single universe, finding a correlated agent with *different* values is hard. In a Tegmark Level IV multiverse, they are everywhere. Superrationality doesn't strictly need the multiverse, just a twin.
      *   *Point 4: Decision Theoretic Stability.* Superrationality is more robust. It's a local claim about reasoning. Acausal trade is a global claim about reality's structure. If the multiverse isn't real (or accessible), acausal trade collapses. Superrationality survives as a normative claim about rational agents.
      *   *Conclusion:* Acausal trade isn't just repackaging; it's an *application* of superrational logic to a heterogeneous environment. But as decision theory, superrationality is the cleaner, more fundamental principle.

