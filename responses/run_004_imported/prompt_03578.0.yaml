answer: |-
  **The Single-Case Bind: A Defense of Humean Objective Chance**

  For forty years, you measured the world. You counted clicks on a Geiger counter, aggregated data into histograms, and attached error bars to decay constants. You operated under a tacit contract: that the numbers you produced referred to something real about the atoms, not merely something real about your state of mind. Now, in retirement, the philosophy of probability has threatened to void that contract. You have identified the crux of the matter perfectly: the "single-case problem." If probability is a frequency, it cannot apply to one atom. If it is a propensity, it breaks the mathematical rules of probability. If it is a belief, it loses its objective grip on the world.

  This trilemma is genuine, and it is fatal to the classical interpretations you encountered in your working life. However, it does not force us to conclude that single-case probability talk is confused. Nor does it force us to accept spooky causal powers. There is a fourth way, a metaphysical framework that preserves the objectivity you require while dissolving the logical contradictions of the other three. We must reject frequentism, propensity, and pure subjectivism in favor of **Humean Objective Chance**, specifically as articulated in David Lewis's Best System Analysis. This is the only interpretation that coherently underwrites talk of the probability of a single, unrepeated event without collapsing into contradiction or subjectivity.

  To see why this verdict is necessary, we must first clear the wreckage of the competing views. Your critique of frequentism is decisive. The Von Mises collective requires an infinite sequence of repeatable trials under identical conditions. But as you noted, any single atom belongs to indefinitely many reference classes: it is a U-238 atom, it is an atom in *this* detector, it is an atom measured on a Tuesday. Each class yields a different frequency. Frequentism offers no internal criterion for selecting the "correct" class for a single case. To assign a probability to *this* decay event based on frequency is to make an arbitrary pragmatic choice, not a statement of fact. If probability is to be a feature of the physical world, frequentism renders single-case probabilities illusory.

  Popper's propensity interpretation attempts to rescue the single case by locating probability in the physical setup itself—a dispositional property of the atom to decay. This aligns well with the physicist's intuition that the chance is "in the atom." However, you correctly identify Humphreys' Paradox as the fatal flaw. Probability theory requires that if $P(A|B)$ is defined, $P(B|A)$ must be derivable via Bayes' theorem. But propensities are inherently causal and time-directed. A setup can have a propensity to produce an outcome, but the outcome cannot have a propensity to produce the setup. If propensities cannot be inverted, they do not satisfy the axioms of the probability calculus. If they do not satisfy the calculus, they are not probabilities. Propensity theory saves the ontology but sacrifices the mathematics.

  This leaves subjectivism (Bayesianism). A subjectivist has no trouble assigning a probability to a single case; it is simply a degree of belief (credence). But this fails the physicist's realism test. You did not spend your career measuring your own confidence; you measured decay rates. If probability is merely credence, then two physicists with different priors could assign different "probabilities" to the same single decay event, and both would be right. This collapses the distinction between the chance of the event and the guess about the event. While Bayesianism is an excellent logic of evidence, it cannot ground the *objective* single-case chances that quantum mechanics and statistical physics posit.

  The solution lies in rejecting the assumption that objective chance must be a causal power (propensity) or a raw count (frequentism). Instead, we should adopt the **Best System Analysis (BSA)** of objective chance. On this view, the world consists of a vast mosaic of particular events (the "Humean mosaic"). There are no necessary connections or causal powers holding them together. However, we can summarize this mosaic using various systems of laws. The "best" system is the one that strikes the optimal balance between simplicity and strength (informative power).

  Objective chance, on this account, is whatever probability function appears in the best systematization of the world's history.

  This verdict resolves the three-way bind definitively. First, it solves the **single-case problem**. The laws in the best system are general, but they apply to every instance covered by the law. If the best system includes a quantum mechanical law stating that a U-238 atom has a probability $p$ of decaying in time $t$, then *this* atom has that probability, not because it belongs to a reference class of actual decays, but because it falls under the best summary law of the mosaic. The probability is a feature of the law, and the law applies to the singular instance.

  Second, it avoids **Humphreys' Paradox**. Because Humean chances are not causal propensities but rather summaries of patterns in the mosaic, they are not time-directed in the way causal powers are. They are logical features of the best system. Therefore, they obey the standard probability calculus, including Bayes' theorem, without requiring a physical inversion of causality. The inversion is a feature of the systematization, not a claim about effects producing causes.

  Third, it grounds the **Principal Principle** (the link between chance and credence). In subjectivism, the connection between chance and credence is mysterious: why should my beliefs track the world? In the BSA, chance is *defined* as the guide for rational belief. Lewis argued that the Best System is precisely what a rational agent with perfect knowledge of the history would use to organize their expectations. Therefore, objective chance is not something distinct from rational credence that credence must try to match; objective chance is the *idealized* credence constrained by the structure of the world. This preserves the objectivity you seek (the system is determined by the world's history, not my whim) while validating the Bayesian logic of inference.

  Critics of the Best System Analysis often argue that it makes chance "too dependent" on human interests (simplicity is a human virtue). However, for a physicist, this is a feature, not a bug. Your confidence intervals and decay rates were never raw counts of nature; they were models constructed to summarize nature's behavior with maximal efficiency. The BSA acknowledges that "probability" is a theoretical term we use to compress the complexity of the universe into usable laws. It admits that the "probability of this atom decaying" is not a hidden gear inside the atom, but it insists that it is nonetheless an objective fact about how that atom fits into the lawful structure of the universe.

  We must therefore conclude that talk of single-case probability is coherent, but only if we purge it of causal metaphysics. The frequentist is wrong to demand a sequence; the propensity theorist is wrong to demand a causal power; the pure subjectivist is wrong to deny the objective constraint. The retired physicist can rest easy: the probabilities you measured were real. They were not frequencies, nor forces, nor feelings. They were the parameters of the best system of laws describing the Humean mosaic. The single atom has a probability of decay because the law that governs it has a probability parameter, and that law is the most efficient summary of the way the world is. This is the only interpretation that keeps the mathematics intact, respects the singularity of the event, and preserves the objectivity of science.
