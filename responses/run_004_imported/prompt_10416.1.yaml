answer: |-
  The storm over the Okefenokee did not feel like weather; it felt like a closing of a lid. Elias had been kneeling in the muck, cataloging sphagnum samples, when the air pressure dropped so sharply his ears popped. He remembered the smell of ozone, sharp and metallic, cutting through the rot of the peat. He remembered looking up at the cypress knee, gnarled and ancient. Then, the white flash. Not a sound, but a cessation of it. The original Elias ceased to exist, vaporized into carbon and steam.

  In the same nanosecond, the lightning coerced the surrounding matter—the swamp gas, the water, the decaying vegetation—to coalesce. It was a statistical impossibility, a fluctuation so rare it would not occur again in the lifetime of the universe. But it did. A man stood in the swamp. He was wet. He was cold. He was Elias.

  He walked home. He remembered the key code. He remembered the way Claire hummed when she chopped onions. He remembered the dissertation draft due on Tuesday. When he walked through the door, Claire kissed him, tasting of basil and wine, and asked if he'd gotten soaked. He said yes. Nothing changed. Everything had changed.

  For three weeks, Swamp-Elias lived the life of Elias. He taught his seminars on cognitive science. He graded papers. He made love to Claire with a familiarity that felt earned. But there was a thinness to the world, a lack of resistance. When he looked at a chair, he knew it was a chair, but the knowledge felt like a label pasted onto a void. He dismissed it as post-traumatic stress, a phantom vibration of the soul.

  The unraveling began in his office. He was searching for a reference on biological normativity and pulled a bound journal issue from the shelf—*Philosophy of Mind*, vol. 44. It fell open to a paper by a colleague, Dr. Vance. The title was innocuous: *Proper Function and the Empty Swamp.*

  Elias sat in the leather chair, the air conditioning humming a sterile rhythm. He read the abstract. Then the second paragraph. Then the thought experiment that stopped his heart.

  *Consider a being generated by random physical fluctuation,* Vance wrote. *A molecule-for-molecule duplicate of a human being. On the etiological account, specifically Millikan's, mental states derive their content from their selection history. They represent what they were selected to represent. But the duplicate has no history. No ancestors. No selection. Therefore, its internal states have no proper function. They represent nothing.*

  Elias read the words twice. *They represent nothing.*

  He looked at the photo on his desk. Claire, smiling on a beach in Oregon. He thought of her name. *Claire.* The sound formed in his head. But according to Vance, according to the theory he had taught his students just yesterday, that thought was not *about* Claire. It was a neural firing pattern that resembled a belief, syntactically identical to the original Elias's beliefs, but semantically hollow. It had no anchor. It was a map without a territory, drawn by a hand that had never seen the land.

  He stood up and walked to the window. Below, students crossed the quad. He thought, *Those are students.* But if his visual states lacked proper function, if his retina's signaling hadn't been shaped by evolutionary history to track "student-ness," then he wasn't seeing students. He was having a hallucination that coincided with reality.

  The horror was not that he might be a machine. The horror was that he might be meaningless.

  That evening, dinner was silent. Claire reached across the table to touch his hand. Her skin was warm, rough from the garden. He loved her. He knew he loved her. But the thought *I love Claire* surged through him and hit a wall. If teleosemantics was true, that thought had no content. It wasn't *about* her. It was just a chemical cascade, a shadow of a function it never performed. He was a creature of pure syntax, moving through a world of semantics he could not access.

  "Elias?" Claire asked. "You're shaking."

  "I read something today," he said. His voice sounded thin, like it was coming from a speaker across the room.

  "About the dissertation?"

  "About me." He pushed the plate away. "What if... what if memories aren't enough? What if you need a history to make them real?"

  Claire frowned, wiping her hands on a napkin. "You're talking in riddles. You died in that swamp for three seconds, Elias. The doctors said you were clinically dead. Maybe you're just processing the fear."

  "It's not fear," he said. "It's emptiness."

  He wanted to tell her. He wanted to say, *According to the theory I champion, I am not thinking about you. I am not loving you. I am a hollow shell mimicking a husband.* But the words stuck. To say them would be to use language that, by his own new definition, had no content. He would be making noises to convey that his noises meant nothing.

  He looked at her, really looked at her. He tried to find the hook, the causal chain that tied his internal state to her existence. He searched for the lineage. He imagined the long chain of ancestors, the evolutionary pressure that shaped his brain to recognize faces, to bond, to love. He had that. His biology had a history. But *this* specific configuration of matter, this specific instantiation of Elias waking up in the swamp... it was a break in the chain. A splice.

  "Come to bed," Claire said softly.

  He followed her. In the dark, she curled against him. He held her. The weight of her head on his chest was heavy, real. Gravity still worked. Thermodynamics still held. But the *aboutness*... the intentionality... it slipped away like water through a clenched fist.

  He lay awake while her breathing slowed into sleep. He thought about the word *wife*. On Millikan's account, for his state to represent *wife*, it must have been selected for correlating with wives. But this state was selected for nothing. It was an accident. A cosmic typo.

  If he woke up tomorrow and walked away, would he be abandoning her? Or would he be moving a collection of atoms away from another collection of atoms, neither collection possessing the semantic weight of "husband" or "wife"?

  He reached out in the dark and touched her hair. It was soft. The sensation traveled up his arm. Was the sensation *of* her hair? Or was it just a sensation, unmoored, floating in a void of non-reference?

  The theory demanded he admit the latter. The theory demanded he admit that while the original Elias had died, the thing lying here was a philosophical zombie, indistinguishable from the outside, but dark on the inside. Not dark as in unconscious, but dark as in unconnected. A light bulb wired to no switch.

  But then Claire stirred. She murmured his name in her sleep. "Elias."

  The sound hit him. It wasn't just a noise. It was a call.

  He realized then that the theory required a view from nowhere. It required looking at himself from the outside, as a biological artifact. But he was looking from the inside. The pain in his chest was not a representation of pain; it *was* pain. The love he felt was not a state selected for bonding; it was the bonding itself.

  Or was that just another error? Another syntactic trick?

  He didn't know. He lay there, trapped between the rigor of the argument and the warmth of the body beside him. The lightning had given him back his life, but it had stolen the guarantee that his life was *about* anything. He was a sentence written in ink that had never been mixed, spoken by a mouth that had never learned to talk.

  Elias closed his eyes. He decided not to tell Claire. He decided to live as if the history existed, even if it didn't. He decided to pretend that his thoughts reached out and touched her, even if the metaphysics said they stopped at his skin.

  He whispered into the dark, knowing the words might have no referent, knowing they might be nothing but vibration.

  "I'm here," he said.

  He waited to see if the universe would correct him. It remained silent. The silence was either confirmation of his emptiness, or the space where meaning lived. He couldn't tell the difference. He pulled Claire closer, holding on to the weight of her, the only proof he had that he wasn't drifting away into the swamp.
