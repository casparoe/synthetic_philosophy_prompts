answer: |-
  Here are ten interview questions designed for your podcast, tailored to a PhD-level audience in economics and decision theory. They are structured to prevent the guest from retreating solely into the "time-average vs. ensemble-average" distinction by forcing her to address normative commitments, finite horizons, and empirical divergences.

  ### 1. The "Log Utility" Isomorphism
  Standard subjective expected utility (SEU) theory is agnostic about the specific form of the utility function; it only demands consistency with axioms like completeness and transitivity. Within that framework, logarithmic utility is a perfectly admissible choice representing a relative risk aversion coefficient of one. When you claim geometric rationality is a "forced move" derived from ergodicity, are you arguing that SEU is *false*, or simply that it is *underdetermined* and you are supplying the missing physical constraint? If it's the latter, isn't "geometric rationality" just isoelastic utility with $\gamma=1$ dressed in the vocabulary of statistical mechanics?

  *   **Follow-up:** If I choose a utility function with $\gamma=2$ (square-root utility), you would say I am maximizing the wrong growth rate. But am I violating a law of physics, or simply expressing a different preference for intertemporal smoothing? If it's the latter, where does the *normative* force of ergodicity enter, rather than just a descriptive claim about wealth dynamics?

  ### 2. The Samuelson Objection (Asymptotics vs. Finitude)
  Paul Samuelson's classic critique of the Kelly criterion is that its optimality is asymptotic—it holds "in the long run" with probability one. However, no agent lives forever, and many face finite horizons (e.g., saving for retirement 20 years out). In a finite setting, the probability of underperforming a safer strategy is non-zero, and the variance of the terminal distribution matters. Why should the asymptotic limit dictate rational choice for an agent with a strictly finite lifetime?

  *   **Follow-up:** If you answer that the "long run" is a metaphor for repeated exposure, consider that the convergence rate depends on the volatility of the asset. For highly volatile assets, the "long run" might be centuries. Are you comfortable telling a finite-lived agent to ignore the variance of their terminal wealth in favor of a limit they will never actually reach?

  ### 3. The "Half-Kelly" Calibration
  Practitioners who are sympathetic to your view, including many quantitative fund managers, routinely recommend "half-Kelly" or even fractional betting to reduce drawdown risk, despite the mathematics suggesting full Kelly maximizes growth. If geometric rationality is a fundamental correction to how rational agents *must* reason about non-ergodic processes, why does the applied literature consistently hedge against the very prescription your theory derives?

  *   **Follow-up:** If you argue that "half-Kelly" accounts for parameter uncertainty or model error, doesn't that concede that the "forced move" only applies in an idealized, model-known world? And if the real world is defined by model uncertainty, isn't the ergodicity argument too brittle to serve as a general foundation for rationality?

  ### 4. The Privilege of Wealth
  Kelly's original 1956 derivation was framed in terms of information transmission rates over a noisy channel, not general practical reason. When you transpose this to economics, you treat *wealth* as the conserved quantity that must be grown geometrically. But agents ultimately care about consumption, leisure, or impact, not bankroll numbers. Why is wealth the privileged variable for defining ergodicity? If I maximize the time-average growth of my *consumption utility* rather than my wealth, do I not get a different optimal strategy?

  *   **Follow-up:** If you say wealth is the instrument for all future opportunities, doesn't that collapse back into a specific assumption about investment opportunities available to the agent? If an agent faces a liquidity constraint or a specific liability stream, doesn't the "growth optimal" portfolio become suboptimal for their actual life trajectory?

  ### 5. Normative Force of Shannon's Theorem
  There is a seductive elegance in linking economic growth to Shannon's channel capacity theorem. It suggests that violating the Kelly criterion is akin to violating a law of information theory. But is this link an isomorphism or a derivation? Does the mathematics inherit genuine normative force from its information-theoretic ancestry, or is the ancestry just packaging that makes a particular utility choice (log wealth) sound more inevitable than it is?

  *   **Follow-up:** If the link is just an isomorphism, then the "rationality" comes from the agent's goal to survive/grow, not from Shannon's math itself. If I tell you my goal is not to maximize growth but to maximize the probability of beating a specific benchmark, does the Shannon analogy still hold, or does the normative force evaporate?

  ### 6. Time Preference and Discounting
  Geometric rationality focuses on the time-average growth rate, which effectively treats the future as compounding indefinitely. However, standard decision theory includes a discount factor $\beta < 1$ to reflect impatience or mortality risk. Your framework seems to imply $\beta = 1$ (or close to it) for the wealth process itself. How does geometric rationality accommodate an agent who genuinely values present consumption over future growth, independent of the ergodicity of the wealth process?

  *   **Follow-up:** If you incorporate discounting, doesn't the optimal fraction bet drop below Kelly? And if so, isn't the "Kelly fraction" just a special case of a more general dynamic optimization problem where the discount rate happens to be zero, rather than a universal standard of rationality?

  ### 7. Restoring Ergodicity via Markets
  Your argument rests on the individual agent facing a non-ergodic process alone. But in a functioning economy, agents can trade risk, buy insurance, or sell equity in their projects. By pooling risks, agents can transform non-ergodic individual processes into ergodic ensemble processes (via the law of large numbers across agents). If markets allow me to "buy" ergodicity, doesn't that render the individual time-average argument secondary to market price equilibrium?

  *   **Follow-up:** If the market price of risk already reflects the aggregate ergodic properties of the economy, isn't an individual deviating from the market-implied growth rate simply expressing a view on alpha, rather than correcting for a fundamental error in rational choice theory?

  ### 8. Path Dependence Beyond Wealth
  You argue that wealth trajectories are path-dependent and non-ergodic. But human capital, reputation, and health are also path-dependent and often non-ergodic (e.g., a career-ending injury). If rationality requires maximizing the time-average growth of the state variable, why stop at wealth? Shouldn't a truly "geometric" rationality optimize the joint growth of a multi-dimensional state vector?

  *   **Follow-up:** If we move to a multi-dimensional vector, the simple log-optimality of Kelly often breaks down or becomes computationally intractable. Does your framework offer a tractable decision rule for this higher-dimensional case, or does the elegance of the theory rely on the simplification to a single scalar (wealth)?

  ### 9. The Dutch Book Argument
  In orthodox decision theory, if your preferences violate the axioms of expected utility, you are susceptible to a Dutch Book (a sure loss). Does geometric rationality offer a similar vulnerability? If I maximize time-average growth and you maximize ensemble expected utility, can one of us construct a sequence of trades that guarantees the other goes bankrupt, or is this merely a disagreement about which objective function describes the world?

  *   **Follow-up:** If there is no Dutch Book against the SEU agent (because they are consistent with their own axioms), then the dispute isn't about *consistency* but about *objective function selection*. Why should we call your selection "rationality" and the other "irrationality," rather than just different risk profiles?

  ### 10. The Concrete Divergence Test
  Finally, let's cash this out. Can you name one concrete decision problem, with specified probabilities and payoffs, where geometric rationality and orthodox subjective expected utility maximization (with *any* admissible utility function) actually recommend different actions to a real agent? If SEU can mimic your results by adjusting the utility function, and if your results only diverge in cases where SEU agents would go bankrupt (and thus exit the sample), is this a substantive dispute about rational choice or a disagreement about vocabulary?

  *   **Follow-up:** If you provide a case where they diverge, is it because the SEU agent is being "irrational," or because they have a different tolerance for ruin? If it's the latter, aren't you just re-labeling "risk aversion" as "ergodicity awareness"?
