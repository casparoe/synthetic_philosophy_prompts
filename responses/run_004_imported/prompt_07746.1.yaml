              *   Step 2: Conditionalization. If we conditionalize on $B$, $P_B(B) = 1$, so $P_B(B|A) = 1$. By the Equation, $P_B(A \to B) = 1$. Similarly for $\neg B$, $P_{\neg B}(A \to B) = 0$.
