      *   NP: CDT finds a stable equilibrium (Two-Box).
      *   DiD: CDT finds *no* stable equilibrium (Oscillation).
      *   Technical Term: Deliberational Instability.
      *   Verdict: DiD is worse because it breaks the machinery of decision-making, not just the payout.

  9.  (Self-Correction during drafting): Make sure to mention that in NP, CDT *wins* the argument on its own terms (causal independence), whereas in DiD, it chokes on its own terms.

