      *   **Goal:** Sell house, split proceeds.
      *   **Conflict:** Brother set an arbitrary "floor" price ($340k) *before* market analysis (comps, realtor input). He announced it publicly (to user, his wife, realtor) to lock himself in ("no backing out now").
      *   **User's Dilemma:** Feels pressured to set a counter-number to avoid looking weak/"too reasonable," but knows it's premature. Worried about torching the deal.
      *   **Underlying Dynamics:** Grief, inheritance stress, sibling rivalry, financial anxiety, commitment bias (brother dug a hole).

  2.  **Evaluate the Brother's Strategy:**
