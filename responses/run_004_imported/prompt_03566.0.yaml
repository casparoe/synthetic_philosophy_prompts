      *   *Philosophy Angle:* As a philosophy teacher, the user knows logic and ethics. This isn't a logic puzzle; it's a negotiation + emotional situation. The "wise take" isn't a counter-move, it's reframing the game.

  4.  **Determine the Best Course of Action:**
      *   **Don't mirror the behavior.** Setting an arbitrary number helps no one.
      *   **Focus on the shared goal.** Selling the house, maximizing net proceeds, minimizing conflict.
      *   **De-personalize the price.** Let the *market* decide, not the siblings.
