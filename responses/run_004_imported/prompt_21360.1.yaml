answer: |-
  **Setting:** *A timeless courtyard, paved with white stone, shaded by a cypress tree that casts no shadow. Al-Ghazālī sits on a low divan, his hands folded in his sleeves. Ibn Rushd stands near a basin of water, holding a piece of dry cotton in one hand and a flint in the other.*

  **Al-Ghazālī:** You hold the cotton and the stone as if they hold secrets within them, Averroes. But I tell you, they hold nothing but their own poverty. When you strike the flint and the spark touches the cotton, it is not the spark that burns. It is God who creates the blackness and the ash at that precise moment. The fire has no agency. It is merely the occasion.

  **Ibn Rushd:** And if I were to wrap this cotton in asbestos, or douse it in water, and the spark struck and no burning occurred? Would God then forget to create the ash?

  **Al-Ghazālī:** God does not forget. His knowledge is eternal. But His will is free. He has established a Custom (*'āda*). We observe the conjunction of fire and burning so frequently that the imagination leaps to the conclusion of necessity. But the mind cannot find a third thing—a "causal link"—between the contact and the combustion. You observe *that* it happens, not *why* it must. To say the fire *forces* the cotton to burn is to attribute a divine power to a created element.

  **Ibn Rushd:** *(Places the cotton down)* You confuse the order of knowledge with the order of being. Yes, we perceive the sequence. But the definition of "fire" is not merely "that which is hot and dry." It is "that which possesses the active power to alter combustible matter." If you strip the fire of this power, you strip it of its essence. You leave us with a word that has no referent. If fire does not burn by its nature, then what distinguishes fire from water, other than God's arbitrary choice to burn with one and cool with the other?

  **Al-Ghazālī:** Precisely. Nothing distinguishes them in themselves. They are both equally powerless before the Divine Command. This is the safeguard of Tawhid (monotheism). If fire burns by necessity of its own nature, then God could not stop it without contradiction. He would be bound by the nature of the fire. But we know He can make the fire cool for Abraham. If the burning were necessary, the miracle would be a logical impossibility. By making it customary, the miracle is merely a break in habit, not a break in logic.

  **Ibn Rushd:** You protect God's power by sacrificing His Wisdom. If the connection is merely customary, then science is not the study of natures, but the cataloging of God's habits. But consider this: Is this Custom necessary to God, or contingent?

  **Al-Ghazālī:** It is contingent. He could have made water burn and fire cool.

  **Ibn Rushd:** Then it is voluntary. God chooses this Custom. But a choice implies a reason. Why does He choose *this* Custom consistently? If there is no reason in the nature of the things themselves, then His choice is caprice. And if it is caprice, then prophecy is no more reliable than sorcery, for both rely on a God who might change His Custom tomorrow. You say you save the miracle, but you doom knowledge. For knowledge requires that the effect follows from the cause not just usually, but *per se*.

  **Al-Ghazālī:** Knowledge requires certainty, and certainty comes from God, not from the created chain. But let me turn your question back upon you. You speak of "natures" as if they are little gods nested inside things. You say fire burns by necessity. I ask you: In what does this necessity reside?

  **Ibn Rushd:** In the form of the fire.

  **Al-Ghazālī:** And is the fire necessary in its existence?

  **Ibn Rushd:** No. It is contingent (*mumkin*). It depends on God for its existence.

  **Al-Ghazālī:** There it is. You admit the fire is contingent. It exists only because God wills it to exist at this moment. If its very existence is a gift renewed at every instant, how can its *actions* be necessary? How can a thing that has no grip on its own being have a grip on the being of another? To say "Fire necessarily burns" is to say that once God creates the fire, He loses control over what it does. You make the creature a partner in Lordship. You grant the fire a sovereignty over the cotton that belongs only to the Creator.

  **Ibn Rushd:** You construct a false dichotomy, Ghazālī. You assume that if God acts, the creature cannot. This is to measure Divine Power by human power, where if I push a stone, you cannot push it simultaneously. God's causality and the fire's causality operate on different levels. God is the Primary Cause; the fire is the secondary cause. To deny the secondary cause is to deny the perfection of the Primary Cause.

  **Al-Ghazālī:** How so?

  **Ibn Rushd:** Because a perfect agent acts through wisdom. Wisdom dictates order. If God creates the burning directly at every instant, without the mediation of the fire's nature, then the fire is a mere idol we worship with our eyes. God endowed the fire with a nature precisely so that it *would* burn. To deny that the fire burns is to say God created a "fire" that does not do what fire does. It makes God a deceiver who implants in us the intuition of causality while the reality is void.

  **Al-Ghazālī:** It is not deception to teach the masses through imagery. But you, the philosopher, claim to seek the truth. And the truth is that "necessity" (*wujūb*) belongs to the Necessary Existent alone. When you say the fire *necessarily* burns, you are smuggling eternity into the temporal. You are saying that within the realm of the contingent, there are islands of necessity. But if the world is contingent, every link in the chain is fragile. If God sustains the fire, He sustains the burning. If He withdraws His support from the burning, the fire remains but the burning ceases. Where is your necessity then?

  **Ibn Rushd:** It lies in the relation of the essence to its act. Look, let us press on this "Custom" of yours. You say God acts by Custom. Does God have a will that changes?

  **Al-Ghazālī:** God's will is eternal.

  **Ibn Rushd:** Then the Custom is eternal. If the Custom is eternal, it is not arbitrary. It is fixed. If it is fixed, it is indistinguishable from a law of nature. You have not removed necessity; you have merely relocated it from the fire to the Will of God. You say, "It is not necessary that fire burns," but you immediately add, "It is necessary that God wills the burning upon contact."

  **Al-Ghazālī:** *(Leans forward)* Ah. But there is the rub. If it is necessary that God wills it, then God is bound by His own Will.

  **Ibn Rushd:** He is bound by His own Wisdom, which is His Essence. He cannot contradict Himself.

  **Al-Ghazālī:** And I say He is bound by nothing. Not even the expectation that He will not contradict His previous habit. If you anchor the burning in a necessary law—even a law of Divine Custom—you make the miracle a violation of God's nature. I make it a demonstration of His freedom.

  **Ibn Rushd:** And I make the miracle a rarity within a cosmos of intelligible order, whereas you make the cosmos a chaos of miracles where we simply pretend there is order. If there is no necessary connection, then definition is impossible. I cannot define "poison" as "that which kills," because it is not in the nature of poison to kill, but only in God's Custom. Then if a man drinks poison and lives, you say "Custom changed." If he dies, you say "Custom held." This explains nothing. It is a shield against inquiry.

  **Al-Ghazālī:** It explains the most important thing: that the world is not self-sufficient. Your "natures" make the world a closed machine, where God is the watchmaker who winds it and steps away, or perhaps a prisoner who must follow the gears He made. My "custom" keeps the world open. Every moment, the cotton cries out for a Creator. Every spark is a sermon. You want a world that runs itself; I want a world that begs for its Master at every breath.

  **Ibn Rushd:** And I want a world that reflects its Master's rationality. If God is Intellect, His creation must be intelligible. Intelligibility requires stable natures. If you sever the link between nature and act, you sever the link between the creature and the Creator's Wisdom. You leave us with Power alone. A God of pure Will without intelligible Nature is a tyrant, not a Lord. I defend the necessity of causation because I defend the reliability of God's Wisdom. You defend the contingency of causation because you fear limiting God's Power.

  **Al-Ghazālī:** I fear making the creation a rival to God.

  **Ibn Rushd:** And I fear making the creation a lie told by God.

  *(Silence settles between them. The cypress tree remains still, though no wind blows.)*

  **Al-Ghazālī:** We agree that God is the Agent.

  **Ibn Rushd:** We agree that God is the Source.

  **Al-Ghazālī:** But for you, He acts *through* the fire.

  **Ibn Rushd:** And for you, He acts *at* the fire.

  **Al-Ghazālī:** Then the cotton burns, and the ash remains. But the question of *whose* hand holds the ash...

  **Ibn Rushd:** ...Remains the divide between the theologian who sees a miracle in the ordinary, and the philosopher who sees the ordinary as the only true miracle.

  **Al-Ghazālī:** *(Stands)* Then let the cotton burn. We shall meet again when the ash cools.

  **Ibn Rushd:** *(Nods)* Provided the nature of ash allows it to cool.

  *(They turn in opposite directions. The fire in the brazier flickers, neither necessarily nor arbitrarily, but simply as it is.)*
