prompt: |-
  I chair my university's Academic Integrity Board, which hears cases of suspected AI-generated coursework based on little more than a detector's probability score and stylistic anomalies flagged by the instructor. The board is split on whether we should demand more of that evidence before finding a student responsible when the mandated sanction is severe, such as dismissal for a repeat offense, than when it is mild, such as resubmission with no notation on the transcript. Some members see this as no different from a court requiring stronger proof before a harsher verdict; others insist that whether a given student actually used AI is a fact about the world that cannot depend on what will happen to them if we rule against them, so letting the sanction shape our confidence threshold corrupts the fact-finding rather than improving it. Draft a short policy memo, to take effect next term, that states whether and how our confidence threshold should track sanction severity, and that answers the second group's objection rather than simply overriding it.
reasoning: |-
  Here's a thinking process that leads to the suggested policy memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the University's Academic Integrity Board (AIB).
      *   **Context:** Hearing cases of suspected AI-generated coursework. Evidence is currently weak (detector scores + stylistic anomalies).
      *   **Conflict:** The Board is split.
          *   *Group A:* Confidence threshold should scale with sanction severity (higher stakes = need more proof). Analogy: Criminal law (beyond reasonable doubt vs. preponderance of evidence).
          *   *Group B:* Truth is objective. Whether a student used AI doesn't change based on the punishment. Adjusting the threshold based on sanctions corrupts fact-finding.
      *   **Task:** Draft a short policy memo for next term.
      *   **Requirement:** State *whether* and *how* the confidence threshold tracks sanction severity. Answer Group B's objection (don't just override it).

  2.  **Determine the Stance:**
      *   *Option 1: No scaling.* (Risks unfair dismissals based on shaky tech).
      *   *Option 2: Scaling.* (Aligns with principles of procedural justice and risk management).
      *   *Decision:* Scaling is the ethically and legally safer path for a university, especially given the unreliability of AI detectors. However, I must address Group B's philosophical objection carefully.
      *   *Addressing Group B:* The key is to distinguish between *ontological truth* (what actually happened) and *epistemic confidence* (what we can justifiably claim to know). We aren't changing the facts of the case; we are adjusting the standard of *proof required to act* given the consequences of error. It's about risk allocation, not reality distortion.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (clarifying evidentiary standards regarding AI detection).
      *   **The Policy (The "What"):** Explicitly state that the standard of proof varies with sanction severity.
          *   Mild sanctions (resubmission): Preponderance of evidence / Moderate confidence.
          *   Severe sanctions (dismissal/expulsion): Clear and convincing / High confidence.
      *   **Addressing the Objection (The "Why"):** This is the crucial part.
          *   Acknowledge Group B's point: Truth is binary.
          *   Counter-argument: The Board isn't a truth machine; it's a decision-making body under uncertainty.
          *   Analogy: Medical diagnosis or Engineering safety. We demand more proof before amputating a limb than before prescribing aspirin, not because the disease changes, but because the cost of a false positive changes.
          *   Focus on *Error Management*: A false positive in a dismissal case is catastrophic for the student and the university's integrity. A false positive in a resubmission case is corrective.
          *   Reframe "Corruption": It's not corrupting fact-finding; it's calibrating *institutional action* to match *epistemic limits*.
      *   **Implementation:** How does this work practically?
          *   AI detectors alone are insufficient for severe sanctions.
          *   Need corroborating evidence (interviews, drafts, process data).
      *   **Closing:** Commitment to fairness.

  4.  **Refining the Tone:**
      *   Needs to be authoritative but collaborative.
      *   Needs to be philosophically precise (to satisfy Group B) but practical (to satisfy Group A).
      *   Avoid legalese where possible, but use precise terms (standard of proof, epistemic uncertainty).

  5.  **Drafting - Iteration 1 (Mental Outline):**
