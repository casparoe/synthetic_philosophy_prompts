answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board Members
  **FROM:** Chair, Academic Integrity Board
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Update: Evidentiary Standards and Sanction Severity in AI Cases
  **EFFECTIVE DATE:** Start of Next Term

  **Purpose**
  This memo establishes a revised framework for evaluating evidence in cases involving suspected AI-generated coursework. Specifically, it addresses how the Board's required confidence threshold must correlate with the severity of potential sanctions.

  **Policy Statement**
  Effective next term, the Board will adopt a **Sliding Scale of Evidentiary Confidence**. 

  1.  **Corrective Sanctions (e.g., resubmission, grade reduction):** Findings of responsibility require a *preponderance of evidence* (greater than 50% confidence). AI detection scores combined with stylistic anomalies may suffice if uncontradicted.
  2.  **Exclusionary Sanctions (e.g., suspension, dismissal):** Findings of responsibility require *clear and convincing evidence* (substantially higher confidence). AI detection scores alone are **insufficient**. These cases require corroborating evidence, such as process artifacts (drafts, version history), oral defenses of the work, or admissions.

  **Rationale: Addressing Epistemic Concerns**
  During recent deliberations, a valid concern was raised: *The truth of whether a student used AI is an objective fact; allowing the potential punishment to influence our confidence threshold conflates the sanction with the finding, potentially corrupting the fact-finding process.*

  We must distinguish between **ontological truth** (what actually happened) and **procedural justification** (when we are justified in acting). The Board does not operate with perfect information; we operate under epistemic uncertainty. 

  Adjusting our threshold based on sanction severity does not alter the facts of the case, nor does it imply that a student is "more guilty" if the punishment is harsher. Rather, it acknowledges **Error Cost Asymmetry**. 

  *   If we falsely accuse a student of minor misconduct, the harm is corrective and temporary. 
  *   If we falsely accuse a student of misconduct warranting dismissal, the harm is catastrophic and potentially irreversible.

  Requiring higher confidence for severe sanctions is not an admission that the *fact* changes based on the *consequence*. It is an admission that our *tolerance for false positives* must decrease as the cost of error increases. This is standard practice in medicine (higher certainty required before surgery than before prescribing medication) and law (higher standards for criminal vs. civil penalties). It preserves the integrity of the Board by ensuring our actions never outpace our certainty.

  **Implementation**
  Instructors presenting cases involving potential dismissal must provide evidence beyond detector outputs. Case managers will screen for evidentiary sufficiency prior to hearings. 

  We uphold academic integrity best by ensuring our processes are as rigorous as the consequences we impose.

  **[Signature]**

  Chair, Academic Integrity Board
