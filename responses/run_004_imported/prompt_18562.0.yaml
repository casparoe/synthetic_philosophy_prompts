      *   *Drafting Q4 (Science/Physics):* Classical math works in physics.
      *   *Refining Q4:* Physics uses non-constructive existence proofs (e.g., fixed point theorems) successfully. If intuitionism is the "true" logic, why does the "false" logic predict nature?
