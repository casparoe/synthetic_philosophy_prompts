          *   *Challenge:* Does this make the rejection of LEM (Law of Excluded Middle) merely pragmatic or syntactic rather than ontological?
          *   *Follow-up:* If she says "it changes meaning," push on *which* meaning and why the translation preserves theoremhood but not "truth."

      *   *Topic 2: Dummett's Manifestation Argument.*
          *   *Core Issue:* We can only understand what we can manifest (verify). Realists say we understand truth conditions beyond verification.
          *   *Challenge:* How do we explain successful communication about undecidable statements if meaning is just use/verification?
          *   *Follow-up:* If she doubles down on "grasp is ability," ask about mathematical progress on previously undecidable problems.

      *   *Topic 3: Brouwer's Weak Counterexamples.*
          *   *Core Issue:* Brouwer used open problems (like Goldbach) to show classical theorems lack constructive proof.
          *   *Challenge:* What happens when the open problem is solved (e.g., FLT)? Does the counterexample vanish? Does the classical theorem suddenly become valid?
          *   *Follow-up:* If she says "the *method* was the point," ask why the *statement* was treated as invalid before.

      *   *Topic 4: Utility/Science.*
