      *   *Ethical:* There is a duty of care to the group's enjoyment, but *not* at the expense of the DM's mental health. A burnt-out DM makes for a bad game.
      *   *Conclusion:* The user isn't "on the hook" forever, but they *do* owe the group a respectful transition because of the duration and investment involved. It's not a prison sentence, but it is a responsibility to close the loop properly.

  3.  **Address the Partner's Comment:**
      *   Partner is technically right (no formal contract) but emotionally wrong (ignores social dynamics).
      *   Need to validate the user's feeling that "something real got built."

  4.  **Address the Friends' Reaction:**
      *   They feel abandoned because their hobby depends on the user.
      *   "We're in this together" is true for players, but the DM carries a disproportionate load (labor vs. participation).
      *   Their reaction is defensive/disappointing, but understandable from their perspective (loss of hobby).

  5.  **Formulate a Plan for Stepping Back:**
      *   *Goal:* Preserve friendships, end the campaign respectfully, relieve user of burden.
      *   *Step 1: Internal Validation.* Confirm burnout is valid. DMing is work.
      *   *Step 2: Reframe the Narrative.* It's not "quitting," it's "ending a season" or "passing the torch."
      *   *Step 3: The Conversation.* Needs to be firm but kind. No ambiguity (no "maybe later" unless true).
      *   *Step 4: Options for the Group.*
          *   Hiatus (short term, risky for burnout).
          *   Find a new DM (rotation?).
          *   End the campaign (narrative wrap-up).
          *   Switch systems (lighter games).
      *   *Step 5: Boundaries.* Protecting the decision.

  6.  **Drafting the Response (Iterative Process):**

      *   *Empathy First:* Acknowledge the burnout. D&D DMing is unpaid labor. Two years is a marathon.
      *   *The "Obligation" Question:* Tackle this head-on. It's a social contract, not a legal one. The "drift" into the role is common. You owe them *respect*, not *indefinite service*.
      *   *Analyzing the Friends' Reaction:* Why are they guilt-tripping? Because they are dependent. That dependency is unhealthy for the user.
      *   *Actionable Advice:*
          *   Don't ask for permission. State the decision.
          *   Offer a transition period (e.g., "I will run 3 more sessions to reach a climax").
          *   Suggest alternatives (new DM, one-shots, break).
