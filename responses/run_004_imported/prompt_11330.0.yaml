answer: |-
  This is a incredibly common situation in the TTRPG (Tabletop Role-Playing Game) community, often called **"DM Drift."** It happens when a casual favor slowly calcifies into an unpaid second job without anyone ever formally signing the employment contract.

  Here is the breakdown of your obligation, why your friends are reacting this way, and a concrete plan to step back without burning the friendship down.

  ### 1. Are you "on the hook"?
  **Legally/Formally:** No. You never signed a contract.
  **Socially/Morally:** You owe them **respect and transition**, but you do not owe them **indefinite labor.**

  Your partner is looking at this like a binary switch (Yes/No), but your friends are looking at it like a narrative arc. To them, the campaign is a story they are living in, and you are the author. When an author stops writing, the story dies. That feels like a loss to them.

  However, the "obligation" you feel is based on the **Sunk Cost Fallacy**. Just because you have run the game for two years doesn't mean you are morally required to run it for year three. In fact, continuing while burnt out is worse for the group than stopping. A burnt-out DM leads to prep delays, flat NPCs, and resentment, which eventually kills the campaign anyway—just more painfully.

  **The Verdict:** You are not a prisoner of the campaign. You built something cool, but that doesn't mean you have to maintain it forever. You owe them a proper handoff or ending, not your mental health.

  ### 2. Why are your friends guilt-tripping you?
  When your friend said, *"We're in this together,"* they were speaking emotionally, not logically. In D&D, you are **not** in it together.
  *   **The Players** invest 4 hours a week and some character prep.
  *   **The DM** invests 4 hours running the game plus 2–10 hours of prep, world-building, rule-lawyering, and emotional labor.

  Your friends are likely experiencing **hobby dependency.** You have become the sole provider of their weekly social activity. When you say "I'm stopping," they hear "I am taking away our hangout time." Their reaction isn't necessarily malicious; it's panic. They don't want to lose the group dynamic, and they don't know how to facilitate it without you.

  ### 3. The Fair Exit Strategy
  Ghosting is definitely not the way to go. That validates their fear that you are "abandoning ship." To leave fairly, you need to treat this like a project manager handing off a critical role.

  Here is a step-by-step plan:

  **Step 1: Make the decision final internally.**
  Do not frame this as a question ("Can I take a break?"). Frame it as a decision ("I need to step down"). If you leave room for negotiation, they will try to solve your burnout with promises ("We'll play less often!", "We'll help more!"). Unless you *want* to continue, do not open this door.

  **Step 2: Offer a "Season Finale" or a Hard Stop.**
  Give them closure. You have two options:
  *   **The Soft Landing:** "I am burnt out and need to step down. I will run **three more sessions** to bring the current arc to a climax and give your characters a moment to shine. After that, I am passing the torch."
  *   **The Hard Stop:** "I can no longer DM. The campaign is effectively on indefinite hiatus. I am happy to play in a campaign run by someone else, but I cannot run."

  *Recommendation:* Given the two-year investment, the "Soft Landing" (3 sessions) is the kindest option. It allows for narrative closure.

  **Step 3: Present Options, Not Problems.**
  When you tell them, immediately offer paths forward so they don't feel abandoned.
  *   **DM Rotation:** Suggest that someone else tries running a short arc.
  *   **System Switch:** Suggest playing a lighter game (like *Lasers & Feelings* or *Honey Heist*) where the DM load is lighter, and you can be a player.
  *   **Hiatus:** Suggest the group takes a month off to regroup.

  **Step 4: The Conversation Script.**
  Say this in the group chat or, better yet, on a call before the next session.
  > "Hey everyone, I need to talk about the campaign. I've loved running this for the last two years, and seeing your characters grow has been amazing. However, the prep load has led to serious burnout for me, and I'm not having fun anymore. When I'm not having fun, I can't run a good game for you.
  >
  > I've decided I need to step back from DMing indefinitely. I don't want to leave you hanging, so I'm going to run us to [Specific Date/Session Number] to wrap up the current story arc. After that, I'm going to take a long break from DMing. I'm happy to play as a character if someone else wants to try running, or we can try some one-shots. I hope you understand that I need to do this to protect our friendship and my own headspace."

  ### 4. Handling the Pushback
  If they say "You're quitting on us":
  *   **Response:** "I'm not quitting on *you*, I'm quitting the *role*. I value our friendship too much to let resentment build up over the game."

  If they say "But we're in this together":
  *   **Response:** "We are friends together, but the DM role is a job. And I'm resigning from the job. I still want to be your friend."

  If they try to bargain ("Just one more session?"):
  *   **Response:** "I've thought about this a lot, and I need to stick to the plan so I can recover."

  ### Summary
  You built something real, which is why leaving feels hard. But a hobby is supposed to serve you, not the other way around.
  1.  **Acknowledge the investment:** Validate that the campaign was great.
  2.  **State the boundary:** You are stepping down.
  3.  **Offer closure:** Give them a defined endpoint (e.g., 3 more sessions).
  4.  **Hold the line:** Do not let guilt drag you back in.

  If they value you as a friend more than they value you as a DM, they will accept this. If they drop you because you won't run the game anymore, you haven't lost friends; you've lost customers.
