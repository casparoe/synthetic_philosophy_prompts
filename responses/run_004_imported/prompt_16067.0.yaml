answer: |-
  This is an excellent question that cuts to the heart of how we understand the history of mathematics and the sociology of scientific knowledge. It is very common for students encountering this episode for the first time to reason exactly as you and your friend have: *If the problem wasn't proven impossible until 1882, how could anyone in 1650 say definitively that Hobbes was wrong?*

  The short answer is: **Your friend's analogy is mathematically mistaken.** Wallis did not need to know that squaring the circle was globally impossible to demonstrate that Hobbes's *specific* solution was flawed. The "victory" was not purely institutional, though institutional politics certainly amplified the conflict.

  Here is a breakdown of why seventeenth-century mathematicians could (and did) adjudicate this dispute without Lindemann's proof, and how you should nuance your understanding of Jesseph's account.

  ### 1. Specific Refutation vs. General Impossibility
  The core logical error in your worry is conflating two different claims:
  1.  **Global Claim:** "It is impossible for *anyone* to square the circle using compass and straightedge." (This requires Lindemann.)
  2.  **Local Claim:** "Hobbes's specific derivation contains a logical error or an unjustified assumption." (This does *not* require Lindemann.)

  You do not need to know that perpetual motion is thermodynamically impossible to point out that a specific machine design has friction or loses energy. Similarly, Wallis did not need to prove $\pi$ was transcendental to show that Hobbes had made a mistake in his reasoning.

  Hobbes's constructions typically relied on one of several identifiable errors that were checkable by the standards of Euclidean geometry existing at the time:
  *   **Circular Reasoning:** Hobbes would often assume the truth of the conclusion within his premises.
  *   **Confusion of Magnitude and Number:** Hobbes sometimes treated geometric lines as if they were composed of finite arithmetical units, leading to category errors.
  *   **Physical vs. Ideal:** Hobbes's materialist philosophy led him to treat geometric lines as having physical width or being generated by physical motion. Wallis could point out that a "line" generated by a moving point in the physical world is an approximation, not the ideal object required for geometric demonstration.
  *   **Arithmetic Errors:** In some instances, Hobbes simply miscalculated ratios.

  When Wallis published a rebuttal, he wasn't saying, "This task is impossible." He was saying, "In step 4 of your proof, you assert that Line A equals Curve B, but you have provided no Euclidean construction to demonstrate this equality." That is a checkable mathematical error, regardless of whether a valid construction exists elsewhere.

  ### 2. Standards of Demonstration in the 17th Century
  The dispute was also about *what counted* as a proof. By the 1650s, the mathematical community (centered around figures like Viète, Descartes, and later Wallis) had developed rigorous standards for analytic geometry and algebraic symbolism.

  Hobbes was, by trade and temperament, a philosopher, not a mathematician. He viewed geometry as the study of **causes** (specifically, motion). For Hobbes, if you could describe the motion that generated a figure, you understood it. For Wallis and the emerging mathematical establishment, geometry was about **logical deduction** from axioms.

  Wallis could adjudicate Hobbes's work as flawed because Hobbes consistently violated the rules of the game. He would introduce premises that were not self-evident and not previously demonstrated. In the context of 17th-century mathematics, a proof that relies on an unjustified premise is invalid, even if the conclusion happens to be true. Wallis showed that Hobbes's "demonstrations" were actually assertions disguised as proofs.

  ### 3. The Institutional and Political Factor (Where You Are Right)
  You are not entirely wrong to suspect institutional authority played a role. Jesseph's book is partly about how the "Royal Society" style of science marginalized Hobbes.
  *   **Politics:** Hobbes was a Royalist (supporter of Charles I); Wallis was a Parliamentarian (supporter of Cromwell) and a Presbyterian. After the Restoration, one might expect Hobbes to regain favor, but his materialism was viewed as atheistic, and his mathematical claims were viewed as the ravings of an arrogant amateur.
  *   **Sociology:** Wallis was part of a network (the Oxford circle, later the Royal Society) that validated each other's work. Hobbes was an outsider who insulted everyone. When Wallis said Hobbes was wrong, the network agreed. When Hobbes said Wallis was wrong, he had no one to back him up.

  However, Jesseph argues that this institutional power **cemented** the verdict; it did not **create** it. If Hobbes had actually produced a valid Euclidean construction, Wallis would not have been able to suppress it simply by virtue of being a professor. A correct proof is hard to hide. The reason Hobbes was silenced was that his proofs were genuinely vulnerable to the specific critiques Wallis raised.

  ### 4. Why the "Conviction" Analogy Fails
  Your friend's analogy ("you cannot convict someone of botching an impossible task if nobody yet knows the task is impossible") is compelling but incorrect.

  Imagine a student turns in a calculus exam claiming to have solved an integral that we now know has no closed-form solution. The professor marks it wrong. Why? Not because the professor knows it's impossible (maybe they haven't checked that), but because the student used the Chain Rule incorrectly in line 3. The error is in the **process**, not the **outcome**.

  Wallis convicted Hobbes of "botching the process." He showed that Hobbes's logic did not support his conclusion. The fact that the conclusion was *also* impossible (though unknown at the time) was incidental to the fact that the *argument* was invalid.

  ### Summary for Your Seminar
  To synthesize this for your class discussion:

  1.  **Mathematical Validity:** Wallis's victory was primarily mathematical. He identified specific logical gaps, unjustified assumptions, and category errors in Hobbes's specific texts. This did not require knowledge of the transcendence of $\pi$.
  2.  **Epistemological Clash:** The dispute was about the nature of knowledge. Hobbes thought geometry was about causal generation (philosophy); Wallis thought it was about formal demonstration (mathematics). Wallis won because the mathematical community adopted Wallis's standards, not Hobbes's.
  3.  **Institutional Amplification:** You are correct that Hobbes's outsider status and political history made him an easy target for ridicule and exclusion. The Royal Society used Hobbes's mathematical errors to discredit his philosophy. But the errors had to exist first for that strategy to work.

  So, while Lindemann settled the **ontological** question (Can it be done?), Wallis settled the **historical** question (Did Hobbes do it?). He did so by standard mathematical adjudication available at the time.

  **Recommended follow-up:** If you want to impress the professor, mention that Jesseph actually argues Hobbes wasn't "stupid." Hobbes's errors were consistent with his broader philosophical system. He wasn't bad at math; he was doing a *different kind of math* (one grounded in materialism) that the emerging mainstream rejected. That adds the philosophical nuance back into the mathematical dispute.
