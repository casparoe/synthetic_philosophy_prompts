answer: |-
  **Setting:** *The grad student lounge, 4:30 PM. The whiteboard is still covered in deontic logic symbols from the seminar. Two empty coffee cups sit between Alex and Jamie.*

  **Alex:** (Rubbing temples) I still think you're asking the concept to do too much heavy lifting. Look, Hume gets it right. Promising is a technology. It's like currency. A piece of paper is only money because we all agree to treat it as money. Without that background convention, it's just linen and ink.

  **Jamie:** But that's exactly where the analogy breaks down. If I hand you a piece of linen on a deserted island and say "this is five dollars," you'd laugh. It has no value. But if I say "I promise to bury your body," and then I don't... I've wronged you. Even if there's no economy, no society, no one to enforce it. The obligation sticks to the act itself.

  **Alex:** Does it though? Or does it just *feel* like it sticks because you've internalized the social practice? You can't just shed the convention like a coat. When you're on that island, you're bringing the concept of "promising" with you. You're importing the social norm into a vacuum. But the norm's authority comes from the society you left behind, not from some magical moral glue in the utterance.

  **Jamie:** That feels like an evasion. Scanlon's whole point in *What We Owe to Each Other* is that we can ground this in the interpersonal reasoning itself. Principle F. If I intentionally lead you to expect I'll do X, and I want you to believe I'll do X *because* I've assured you I will... I'm bound. Not because of a social utility calculus, but because it would be unjustifiable to you to exploit the trust I invited.

  **Alex:** "Unjustifiable to you." See, that's the rub. Why is it unjustifiable? Because there's a norm that says "don't exploit invited trust." Where did that norm come from? If you say "it's just rational," I say: rational for what? For social cohesion? Then we're back to Hume. If you say it's *sui generis*, you're positing a moral fact that floats free of human practices. And I'm skeptical of ghosts.

  **Jamie:** It's not a ghost, it's about the relationship. Think about the deathbed case again. A stranger is dying. No future interaction. No reputation to lose. No social practice to uphold because no one will ever know. I promise to mail their letter. I walk away and burn it. Who is harmed? The practice? No, the practice is invisible here. The utility? Negligible. But I still violated an obligation *to them*. Scanlon captures that. You're reducing the victim to a statistic in a social utility function.

  **Alex:** Okay, fine. The deathbed case. I'll grant you that *something* is wrong there. But is it a *promissory* wrong? Or is it a wrong of general benevolence or cruelty? You're conflating "breaking a promise" with "letting someone down after manipulating their expectations." Hume can admit you shouldn't crush a dying man's hopes. That's basic humanity. But to say there's a distinct *promissory* obligation in the absence of the practice... that's like saying you can play chess alone on a desert island. You can move the pieces, but you aren't actually playing chess.

  **Jamie:** But the pieces *are* the obligation! The specific move of "assuring" changes the normative landscape. That's what Principle F is doing. It explains why the obligation is specific to the person I promised, not just a general duty to be nice.

  **Alex:** Here's where I think your view actually collapses, Jamie. And this is the objection Shiffrin and others have hinted at. If Principle F is the engine, why do we need the word "promise" at all?

  **Jamie:** What do you mean?

  **Alex:** I mean redundancy. If the obligation comes from "deliberately creating an expectation," then I create that obligation every time I speak confidently. If I say, "I'll probably be there," and you rely on me, Principle F suggests I'm bound if I led you to rely on my assurance. But we distinguish between a prediction and a promise. If your principle makes *any* induced expectation binding, then "promising" isn't a special normative power. It's just a spotlight on a general duty not to disappoint. You've dissolved the specific practice of promising into a soup of general expectations.

  **Jamie:** (Pauses, stirring cold coffee) That's the "overgeneration" objection. I know it. But Scanlon has a reply. It's about the *reason* for the expectation. In a prediction, I expect you to come because you usually do. In a promise, I expect you to come *because you gave me your word*. The obligation is self-referential. I am bound because I claimed I was bound.

  **Alex:** But *why* does claiming you're bound make you bound? If you say "because Principle F says so," then Principle F is doing all the work, and the "claim" is just theater. If you say "because the practice says so," then you're a Humean. You're trying to have it both ways. You want the objectivity of a moral principle without admitting that the principle only has grip because we all agree to live by it.

  **Jamie:** I'm not saying the principle exists in a vacuum. I'm saying it's a principle of *reasonable rejectability*. Could anyone reasonably reject a principle that allows you to invite trust and then ignore it? No. That's the ground. It's not about utility, Alex. It's about what we owe each other as rational agents.

  **Alex:** But "reasonable rejectability" is itself a convention. It's a very sophisticated, Kantian-flavored convention. You've just pushed the social agreement back one step. Instead of agreeing to "keep promises," we're agreeing to "live by principles no one could reasonably reject." It's still a human construct.

  **Jamie:** (Sighs) So, are we just fighting over labels?

  **Alex:** What do you mean?

  **Jamie:** I mean... look at the output. You say: "Don't break promises because it undermines the social practice that allows us to coordinate." I say: "Don't break promises because it violates the trust of the specific person you assured." In 99% of cases, we agree on the action. We agree the promise-breaker is wrong.
  Are we actually disagreeing about the *metaphysics* of obligation? Like, where the duty *lives*? Or are we just describing the same underlying facts—the damage to trust, the betrayal of expectation—in two different vocabularies?

  **Alex:** (Leans back) That's the scary question, isn't it? If I say the obligation is "out there" in the social fabric, and you say it's "in here" in the interpersonal reasoning... does it matter?
  Maybe... maybe I'm describing the *genealogy*. How did this concept come to have power? Evolution, society, utility. And you're describing the *phenomenology*. What it feels like from the inside of the moral agent.

  **Jamie:** But if the genealogy undermines the phenomenology... if your story is true, then my feeling of being bound is an illusion. A useful fiction.

  **Alex:** Is it an illusion? Money is a fiction. But if I don't pay my rent, I get evicted. The fiction has teeth. Maybe "moral obligation" is just the name we give to the teeth of our social fictions.

  **Jamie:** But the teeth hurt the *conscience*, Alex, not just the wallet. If I break a promise in the dark, where no social sanction touches me, I still feel guilt. Your view has to say that guilt is a mistake. A misfiring of a social heuristic.

  **Alex:** And your view has to say that guilt is a perception of a non-natural moral fact. Neither of us is in a comfortable chair here.

  **Jamie:** (Laughs softly) So, for the presentation next week... do we tell the professor we've solved it?

  **Alex:** We tell him we've identified the stalemate. You keep the island; I'll keep the city.

  **Jamie:** Deal. But I'm still mailing that letter on the desert island.

  **Alex:** And I'd expect you to. Just don't ask me *why* you have to.
