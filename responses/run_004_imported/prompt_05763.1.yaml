answer: |-
  The spectrometer hummed, a low, digital B-flat that vibrated in Elias's teeth. On the screen, two waveforms overlaid each other. The blue line was the loaned original, *Study of a Cypress*, 1889. The red line was Elias's canvas, finished three hours ago.

  The lines were indistinguishable.

  Elias leaned back in his chair, rubbing eyes that felt like they were filled with sand. He was a man of two worlds. By day, he was a senior engineer at a firm that specialized in legacy migration. By night, he was a painter obsessed with materiality. For the last seven years, he hadn't looked at a photograph of the *Cypress*. He hadn't visited the museum. Instead, he had studied the wind patterns of Provence in the late 19th century, the chemical composition of Van Gogh's zinc yellow, the specific tremor of the artist's hand during his episodes, and the tensile strength of the canvas weave available in Arles in 1889.

  He hadn't copied the painting. He had re-derived it. He had placed himself in the same causal funnel as Vincent and let gravity do the rest.

  "It's a perfect match," Elias said to the empty room.

  In his day job, this was the definition of success. Last month, his team had to rebuild a authentication module for a banking system where the original source code was lost to bit-rot. Elias had written a new implementation based solely on the API documentation and the expected behavior. When they compiled it, the binary hash matched the legacy production build. His boss had bought him champagne. *Idempotency*, he'd called it. *If the output is the same, the logic is sound. If the hash matches, it is the same object.*

  But now, staring at the two canvases, the logic felt brittle.

  The door opened. It was Mara, the appraiser from the foundation. She carried a tablet and a look of practiced neutrality. She didn't say hello. She walked straight to the easel holding Elias's work and pulled a loupe from her pocket.

  She spent twenty minutes in silence. She checked the craquelure—the network of fine cracks that forms on oil paint as it ages. Elias had engineered a drying agent to accelerate the oxidation, mimicking a century of settling. She checked the brushstroke depth with a laser profilometer.

  "Well?" Elias asked.

  Mara lowered the loupe. She looked from the canvas to him, then back to the canvas. "It's terrifying."

  "Is it him?"

  "Physically? Yes." She tapped her tablet. "The pigment distribution, the underpainting geometry, even the dust particles embedded in the varnish match the atmospheric data of the region. If I put this under carbon dating and you faked the canvas age correctly, I would certify this as the lost *Study*."

  Elias felt a surge of triumph that immediately curdled. "So it's authentic."

  Mara laughed, a short, dry sound. "No, Elias. It's a forgery."

  "I didn't copy it," Elias snapped, the developer in him bristling at the inaccuracy. "I didn't see the original. I arrived here independently. It's like two people writing the same sort algorithm. If the code is identical, it's the same function."

  "This isn't code," Mara said softly.

  "Why not? It's instructions. Pigment applied to surface. I followed the instructions of reality."

  Mara walked over to the original, the one behind the plexiglass. She rested a hand near it, not touching. "When you write your code, what are you trying to preserve?"

  "The logic. The function. The outcome."

  "Exactly. Code is a set of instructions for a future action. It doesn't matter who wrote it, or when, or if they were crying or laughing. It matters that it runs. That's... what do you call it? Allographic?"

  "I call it efficient," Elias muttered.

  "Painting isn't instructions," Mara said. "It's a record. A fossil."

  She turned to him. "When I look at this," she pointed to the Van Gogh, "I am not looking at a cypress tree. I am looking at a moment in time where a man named Vincent stood here and moved his hand this way. The value isn't in the pattern of light. It's in the provenance. The chain of custody. The signature."

  "I can sign it," Elias said.

  "Then it's a Elias Kovic painting that looks like a Van Gogh. Which makes it a pastiche. Or a trick."

  Elias walked to his computer. He opened his terminal. He pulled up the repository for the banking module he'd rewritten. He ran a `diff` command. Zero differences. He ran a `git blame`. There it was: his name, his commit hash, his timestamp.

  "In my world," Elias said, "this commit is truth. If I push this, the system accepts it. The machine doesn't care about my soul. It cares about the bytes."

  "Because the machine is a tool," Mara said. "Art isn't a tool. It's a witness."

  She walked over to his canvas. "You spent seven years trying to become a time machine. You wanted to erase the gap between you and him. But the gap is the point."

  Elias looked at the *Cypress*. He saw the violent swirl of the sky. In the original, that swirl was the product of a specific madness, a specific night, a specific despair. In his version, that swirl was the product of a wind simulation algorithm and a calculated tremor in a robotic arm he'd built to hold the brush.

  The pixels were the same. The hash was the same.

  But the *commit history* was different.

  In git, the hash is the identity. But in the museum of human experience, the hash is just the snapshot. The identity is the branch. The identity is the lineage.

  "If I sell this," Elias asked, "as a Menard-style derivation? As a conceptual piece about independent creation?"

  "Then it's an Elias Kovic," Mara said. "And it might be worth something. But it will never be the *Cypress*. Because the *Cypress* isn't the image. The *Cypress* is the event."

  Elias thought about the banking code again. He realized he had been wrong. The code *did* care about the history. That was why they used version control. That was why they signed commits. If he pushed that identical binary to production without the audit trail, without the ticket number, without the peer review hash, it would be rejected as a security risk. *Unauthorized binary.*

  The content was the same. The trust was missing.

  "It's autographic," Elias said, the word feeling strange in his mouth. He'd read it once in an aesthetics textbook. *Autographic arts* require the original hand. *Allographic arts* can be notated and reproduced. Music was allographic; if you played the notes right, it was Beethoven. Painting was autographic; if you painted the notes right, it was a fake.

  He had been treating an autographic medium as if it were allographic. He thought he was composing a symphony, but he was forging a signature.

  "So," Elias said, picking up a palette knife. "The hash doesn't matter."

  "The hash proves the state," Mara corrected. "It doesn't prove the path."

  Elias looked at his painting. It was beautiful. It was technically flawless. It was a lie.

  He took the palette knife and dragged it through the wet yellow of the cypress tree, ruining the perfect swirl. The spectrometer on the table chirped, the red line spiking into chaos, diverging from the blue.

  "What are you doing?" Mara asked.

  "Fixing the commit history," Elias said.

  He scraped the paint down to the canvas. He wasn't trying to be Vincent anymore. He was just Elias, standing in a studio in 2024, with a knife in his hand and a ruined painting in front of him.

  "Now it's mine," he said.

  Mara nodded, just once. "Now it's real."

  Elias wiped the knife. He knew that tomorrow he would go back to work. He would write code that had to be exact, where identity was content, where the hash was king. He loved that world for its clarity. But he also knew that when he went home, he would pick up a brush, and he would not try to match the hash. He would try to make a mark that could only be made by his hand, in this time, with all the noise and error that came with it.

  He looked at the spectrometer. The lines were no longer identical. The error margin was huge.

  "Save the log," Elias said.

  "For what?"

  "Proof of work."
