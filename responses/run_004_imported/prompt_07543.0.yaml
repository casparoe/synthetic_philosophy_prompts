answer: |-
  The great hall of the Rashtrakuta court smelled of sandalwood and the dry heat of anticipation. The King sat elevated on a dais, but the true throne of the moment belonged to the circle of scholars on the floor. In the center stood Vatsyayana, the Naiyayika, his ash-smeared forehead gleaming in the oil-lamp light. Opposite him sat the Jain acharya, silent, his hands folded in the lap of his saffron robe.

  Vatsyayana did not pace. He stood like a pillar, his voice low but carrying to the furthest balcony without effort.

  "Acharya," Vatsyayana began, bowing slightly. "I do not come to mock your *Anekantavada* as the vulgar do. I do not call it the philosophy of the eel, wriggling out of every grasp. I grant you this: reality is complex. A jar is, in one sense, clay; in another, a vessel; in another, a collection of atoms. To deny this complexity is blindness. But you claim more than complexity. You claim that *truth itself* is conditioned. You claim that every assertion is true only *syat*—only 'in some respect.'"

  He paused, letting the term hang in the air.

  "This is the doctrine of *Syadvada*. And it is here, in the very heart of your logic, that the blade turns. I ask you a single question, one that requires no sevenfold predication to answer. Is the proposition of *Syadvada* itself true *syat*, or is it true absolutely?"

  Vatsyayana raised a finger before the Jain could speak.

  "Do not answer yet. I will speak for both of us, for I know the paths your mind will take. If you say the doctrine is true only *syat*—only in some respect—then you admit there exists some respect in which it is *false*. If there is a standpoint from which *Syadvada* is false, then absolute truth exists, and your doctrine collapses. But if you say the doctrine is true absolutely, without condition, then you have made at least one unconditional assertion. In doing so, you have contradicted your own premise that *all* assertions are conditioned. You are like a man who shouts to a crowd, 'There is no sound!' Your very shout proves you wrong."

  A murmur rippled through the assembly. The Jain Acharya opened his mouth, but Vatsyayana continued, his voice sharpening.

  "I see you reach for your first shield: the distinction between *Naya* and *Pramana*. You will say, 'The words we speak are partial (*naya*), but they express a manifold object (*prameya*). We do not claim the *statement* is absolute, only that the *object* possesses infinite attributes.' You try to separate the map from the territory."

  Vatsyayana stepped forward, his shadow falling over the Jain texts.

  "But this distinction saves you no more than a paper umbrella saves a man from a monsoon. When you assert the theory of *Naya*, you are making a claim about *all* language. You claim that *all* verbal expression is partial. Is *that* claim partial? If the statement 'all language is partial' is itself only partially true, then there is some language that is total. If there is language that is total, then *Syadvada* is not the universal key to reality. But if the statement 'all language is partial' is totally true, then you have used total language to deny the possibility of total language. You cannot use a ladder to climb up and then kick it away while you are still standing on the rung. The proposition about propositions must stand on its own feet. And on its own feet, *Syadvada* limps."

  He turned to the King, then back to the Jain.

  "Now, I anticipate your second shield. It is the heavier one. You will say, 'Logic is for the bound soul. The validity of *Syadvada* rests on the perception of the *Kevalin*, the Omniscient One. For him, all aspects are seen simultaneously. We speak from the shadow of his light.' You ground your relativity in an absolute seer."

  Vatsyayana's voice dropped, becoming almost intimate, which made it more terrifying.

  "This removes the debate from the *Sabha* and places it in the clouds, where we cannot follow. But we are here to debate *Vada*, human discourse. If your doctrine relies on the *Kevalin*, it is not a logic for men. It is an article of faith. But let us grant you the *Kevalin*. Even he must speak to be understood by us. When the *Kevalin* teaches *Syadvada*, does he teach it as a tentative hypothesis, or as the correct description of reality?

  "If he teaches it as tentative, then his omniscience yields only tentative truths, and why should we worship a truth that might be false in some respect? If he teaches it as the correct description of reality, then he is asserting an unconditional fact about the nature of existence: namely, that existence is conditional. He is asserting an absolute about the relative.

  "Furthermore, if we need the *Kevalin* to validate *Syadvada*, how do we validate the *Kevalin*? By what *Pramana* do you know he is omniscient? By inference? Then your inference must follow the laws of logic—the very laws of non-contradiction you seek to loosen. If you say 'We know he is omniscient because he says so,' you argue in a circle. If you say 'We know by scripture,' the scripture is words, and you have already told us words are partial. You cannot build a foundation of absolute authority on a ground you have declared to be shifting sand."

  Vatsyayana stepped back, folding his hands. The silence in the hall was absolute.

  "Acharya, the law of non-contradiction is not a shackle we place on reality. It is the light by which we see reality. A thing cannot be and not be in the same respect at the same time. You say, 'The jar is, in a way; it is not, in a way.' We agree. It is clay; it is not a cloth. This is not *Syadvada*; this is simple distinction (*vibhaga*). But when you elevate this distinction into a metaphysical principle that denies the stability of truth itself, you cut the branch you sit on.

  "To save your doctrine, you must make an exception for the doctrine itself. But a universal that excludes itself is no universal. It is a contradiction. And a contradiction is not a higher truth; it is the end of thought. I yield the floor, not because your reality is small, but because your logic cannot hold it."

  Vatsyayana sat. The silence lingered, heavy and unresolved, as the Jain Acharya looked down at his hands, the sevenfold predication silent on his tongue.
