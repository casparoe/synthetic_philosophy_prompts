answer: |-
  **Setting:** *A quiet corner of a university coffee shop. **Marcus** (a metaphysical physicalist) and **Elena** (a counterfactual theorist) are grading papers. **Elena** has just finished reading a case study provided by a student—the user's situation.*

  **Elena:** This case is haunting me. The grandmother, the fall, the missed check. The facility's lawyer is arguing that because the family didn't check on her either, the family is causally responsible for the fall. It's repulsive, but logically, it hooks right into the omission problem we talked about last semester.

  **Marcus:** It's repulsive because it's a category error. But yes, it's the classic *ex nihilo* problem. If we say the nurse's *not* being there caused the fall, we are saying "nothing" caused "something." That's metaphysically spooky. How does a non-event transfer energy to a hip bone?

  **Elena:** You're stuck on the process theory again. Look, causation isn't just billiard balls hitting each other. It's about dependence. If the nurse had performed the check, the fall would not have happened. The outcome *depends* on the omission. That makes the omission a cause.

  **Marcus:** But that opens the floodgates. That's the "Explosion Problem." If the nurse's not checking is a cause, then *your* not checking is a cause. *My* not checking is a cause. The President's not checking is a cause. Literally every person on earth who didn't rush to that room to catch her is a cause of the broken hip. If omissions are causes, we are all mass murderers every time we sit on the couch.

  **Elena:** I'm not worried about the explosion. We handle it with context. Causation is contrastive. We aren't asking "Did the absence of every possible preventer cause this?" We're asking "Did the absence of the *expected* preventer cause this?" The nurse's omission is a deviation from a system designed to prevent falls. My omission isn't.

  **Marcus:** See, that's where you sneak normativity into metaphysics. "Expected"? "Designed"? Those are moral or functional labels, not physical facts. Metaphysically, the nurse's absence and your absence are identical: neither of you were there. If you say her absence is a cause but yours isn't, you aren't talking about causation anymore. You're talking about blame.

  **Elena:** I'm talking about explanation. Causation is a tool we use to explain why things happen. If I ask, "Why did the plant die?" and you say, "Because no one watered it," that is a true causal explanation. If you say, "Because the sun shone on it," that's also physically true but explanatorily useless. The "default" state of the world is that people don't water random plants. The "default" state of a nursing home is that staff check patients. When the default holds, nothing happens. When it breaks, something happens. The break is the cause.

  **Marcus:** But that makes causation subjective. It depends on what humans *expect*. Imagine an alien observing the nursing home. They see a physical system. They see gravity pulling a body down. They see a floor resisting it. They do *not* see a "nurse-shaped hole" in the universe exerting force. The alien sees the fall as caused by the grandmother's balance and the floor's hardness. The "missed check" is just background noise.

  **Elena:** The alien is missing the causal structure of the *social* system, which is just as real as the physical one. But let's look at the lawyer's argument. He says, "The family didn't check either." He's trying to equate the family's omission with the nurse's omission. Even on your view, Marcus, doesn't that fail?

  **Marcus:** Absolutely. On my view, *neither* omission is a cause. The cause is the physical instability that led to the fall. The nurse is responsible because she had a *duty* to intervene in the physical chain. The family had no duty. So the lawyer is wrong to say the family is responsible, but he's also wrong to imply the nurse's omission was a physical cause. The nurse is liable for *allowing* the cause to operate, not for *causing* the outcome.

  **Elena:** That feels like splitting hairs to let the facility off the hook. If I unplug a life-support machine, I killed the patient. If I simply fail to plug it in when it's my job to do so, I also killed the patient. The law treats them similarly. Why should metaphysics fight the intuition that failing to save someone when you're the designated saver is a form of killing?

  **Marcus:** Because if you accept that, you have to explain why the passerby who fails to save the drowning child isn't a killer.

  **Elena:** Because the passerby isn't the *assigned* cause. Think of it like a software script. The nursing home protocol is a script: `IF night THEN check_patient`. The nurse is the processor assigned to run that script. When the script fails, the processor is the bug. The family isn't in the code. They aren't part of the causal model of the facility.

  **Marcus:** But who writes the code? Morality writes the code. You're admitting it! You're saying causation is relative to a moral framework. I say we keep them separate. Metaphysics is about what exists. Ethics is about what we owe each other.
  Here's the deal: The lawyer's argument is a dodge, but for different reasons than you think. He says, "You didn't check, so you're responsible."
  My response: "Causally, neither of us did anything. But normatively, the nurse owed a duty and you didn't."
  Your response: "Causally, the nurse's omission was a cause, but yours wasn't, because her omission was abnormal."

  **Elena:** Exactly. And my view explains why we focus on the nurse without needing a separate "duty" conversation. The duty *makes* the omission salient. Salience determines causal selection.

  **Marcus:** But salience is psychological. Truth isn't. Look, if we go with your view, the lawyer can just argue about salience. He can say, "In the context of *Family Love*, the grandson's absence is the abnormal deviation!" He can shift the context to make the family look bad.
  If we go with my view, he hits a wall. "Did the grandson's physical absence exert force on the hip?" No. "Did the nurse's physical absence exert force?" No. "Okay, so neither caused it. Now, who had the contract?" The nurse. Case closed. My view actually protects your family better.

  **Elena:** That's a strong point. If causation is context-sensitive, a clever lawyer can manipulate the context. But Marcus, your view has a cost. It makes "cause" irrelevant to almost everything we care about. If causation is only energy transfer, then "smoking causes cancer" is shorthand for a billion particle interactions. We can't litigate particle interactions. We litigate omissions. We sue for negligence, which is *defined* by what you didn't do. The law *requires* omissions to be causes. If metaphysics says they can't be, metaphysics is useless to the law.

  **Marcus:** I don't say they can't be *legal* causes. I say they aren't *metaphysical* causes. We can have "legal causation" which includes duties and omissions, and "physical causation" which doesn't. The lawyer is conflating the two. He's using the metaphysical puzzle ("nothing causes nothing") to create moral confusion ("so you're all equally guilty").
  The truth is: The grandmother fell because of physics. She is suing because of ethics. The nurse's omission is the *locus* of the ethical breach. The family's omission is not. Whether you call the omission a "cause" or a "failure to interrupt a cause" doesn't change the liability.

  **Elena:** I worry that separating them lets people off the hook too easily. "I didn't cause the famine, I just didn't send money." If we teach that omissions aren't causes, we erode the sense of responsibility.
  But in this specific case... I think the distinction between "system failure" and "background condition" holds. The nursing home is a safety system. A missed check is a system failure. A family member not being there is a background condition of the world.
  The lawyer's argument tries to treat the family as part of the safety system. That's the lie.

  **Marcus:** Agreed. The lie is the equivalence.
  So, on my view: The lawyer is wrong because duty is not universal.
  On your view: The lawyer is wrong because causal relevance is not universal.
  We both agree the family isn't liable.

  **Elena:** But we disagree on why. And that matters for how you feel about it. If I'm right, the nurse's inaction *did* something to your grandma. It changed the course of history.
  If you're right, the nurse just stood aside while gravity did its work.

  **Marcus:** Does it matter? The outcome is the same. But... I will concede this. In human affairs, "cause" is a word we use to assign accountability. If the word "cause" helps us pinpoint who broke the trust, then maybe insisting on a purely physical definition is pedantic.
  However, the risk remains. If we say omissions are causes, we must have a robust way to filter them. Otherwise, the lawyer's "Why not you?" question is valid. You need a principle that says "Only duties generate causal omissions." But if you need duty to filter the causes, then duty is doing the work, not causation.

  **Elena:** Fair. Maybe causation by omission is a hybrid concept. It's a physical dependence relation *filtered* through normative expectations.
  So, to answer your student's worry: The lawyer is trying to use a metaphysical technicality to win a normative argument.
  If I'm right, the family isn't a cause because they aren't part of the relevant causal model (the care plan).
  If Marcus is right, the family isn't a cause because *nobody* is, but the nurse is the only one who breached a duty to intervene.

  **Marcus:** The lawyer's argument is a "tu quoque" fallacy wrapped in metaphysics. "You didn't prevent it either."
  The response is: "We weren't paid to."
  Whether that "prevention" is a cause or an interruption, the duty is the hinge.

  **Elena:** So, for your student... tell them the metaphysics is messy. Philosophers fight about this every day. But the *moral* logic is clear. We assign causal weight to omissions based on responsibility. The nurse had the responsibility. The family didn't. The lawyer is trying to decouple responsibility from causation to confuse the issue.

  **Marcus:** And tell them not to let the lawyer bully them with big words about "nothingness." Whether "nothing" can cause something or not, "breach of contract" is definitely a something. And that's what they're actually being sued for.

  **Elena:** *Laughs.* "Breach of contract is a something." I'll write that down.

  **Marcus:** Just make sure your student knows: if they accept the lawyer's premise that omissions are causes, they must accept the burden of explaining why *their* omission doesn't count. And the only way to do that is to appeal to duty. Which proves my point: Duty is doing the work.

  **Elena:** And if they accept your premise, they have to explain why we hold the nurse liable for "allowing" physics to happen but not the family. Which also appeals to duty.
  So, duty is the real battleground. The metaphysics is just the smoke.

  **Marcus:** Precisely. The lawyer is throwing smoke. Don't breathe it in.
