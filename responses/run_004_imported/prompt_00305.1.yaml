      *   *Leibniz's Math:* Calculus, infinite series, distinction between actual and potential infinity (mostly), syncategorematic infinite. He was wary of "completed" infinities in the physical world but accepted them in God's mind.
      *   *Infinite Ethics Problems:* The "Paradox of the Gods," "Hilbert's Hotel" style issues applied to value. If world A and World B both have infinite happiness, how is A better than B? (e.g., A has +1 utility for everyone, B has +0). Standard summing fails.
      *   *Connection:* Leibniz's "Best World" claim *presupposes* comparability. If infinities make worlds incomparable, his Theodicy collapses. Therefore, he *must* have a way to compare them.
      *   *Key Distinction:* Leibniz doesn't aggregate utility like a Benthamite. He optimizes *metaphysical perfection* (essence/existence ratio), not just hedonic sum.

  3.  **Structuring the Argument:**
