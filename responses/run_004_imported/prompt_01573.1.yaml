  ok so I got into it with my friend last night over drinks about free will (as one does) and it turned into a whole thing about Galen Strawson's "Basic Argument" against moral responsibility. She kept saying it's basically just hard determinism repackaged, and I tried to argue that the whole point is it's supposed to go through even if indeterminism is true, but I couldn't actually reconstruct why and just ended up repeating myself louder lol. At some point we also got confused about whether we were even talking about him or his dad (isn't there a P.F. Strawson who argued something like the opposite?), which didn't help. Can you lay out the actual premise-by-premise structure of the Basic Argument, be really precise about where the "causa sui" move is doing the work, and explain exactly why Strawson thinks determinism vs indeterminism doesn't matter to the conclusion? Also curious if theres actually a Nietzsche connection here or if my friend just made that up to sound smart. Bonus points if you can clarify how this is different from what his dad was arguing, since apparently thats a totally different, almost opposite, position.
