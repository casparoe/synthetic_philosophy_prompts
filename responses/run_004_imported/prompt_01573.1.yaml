answer: |-
  First off, tell your friend that arguing about free will over drinks is a rite of passage, so don't feel bad about getting stuck in the weeds. It is a notoriously slippery topic.

  You were actually right on the core distinction: Galen Strawson's **Basic Argument** is *not* just Hard Determinism repackaged. Hard Determinism says, "Determinism is true, therefore no free will." Strawson says, "Whether Determinism is true or false, you *still* don't have free will."

  Here is the precise breakdown you need to settle the bet, clarify the *causa sui* move, and sort out the Strawson family feud.

  ---

  ### 1. The Basic Argument: Premise-by-Premise

  Strawson's goal is to show that **ultimate moral responsibility** is impossible. He isn't arguing about legal responsibility or whether we should lock up murderers; he's arguing about the metaphysical condition required to *truly deserve* praise or blame.

  Here is the formal reconstruction:

  1.  **The Principle of Responsibility:** To be truly morally responsible for what you do (Action A), you must be responsible for the way you are (Mental Nature N) that led you to do it.
      *   *Why?* If you didn't choose your nature (your desires, beliefs, character), and your nature caused the action, then the credit/blame belongs to the factors that created your nature, not you.
  2.  **The Principle of Choice:** To be responsible for the way you are (N), you must have consciously chosen to be that way.
  3.  **The Regress Problem:** To make that choice (to choose N), you must have already had a prior mental nature (N-1) that guided that choice.
      *   *Why?* You can't choose "in a vacuum." You choose based on reasons, values, or preferences. Those reasons/values constitute a prior nature.
  4.  **The Implication:** Therefore, to be truly responsible for N, you must be responsible for N-1. But to be responsible for N-1, you must have chosen it based on N-2, and so on.
  5.  **The *Causa Sui* Requirement:** To stop this infinite regress and be *ultimately* responsible, you would have to be the cause of yourself (*causa sui*). You would have to exist prior to yourself to choose yourself.
  6.  **The Impossibility:** It is logically impossible to be *causa sui* (nothing can create itself).
  7.  **Conclusion:** Therefore, no one is ultimately morally responsible for their actions.

  ### 2. Where the *Causa Sui* Move Blocks Indeterminism

  This is the specific point you struggled to articulate. Your friend thinks this is Hard Determinism because they think the argument relies on the past determining the future. **It does not.**

  Strawson grants, for the sake of argument, that **Indeterminism** might be true. He admits there might be random quantum breaks in the causal chain. Here is why it doesn't save you:

  *   **If Determinism is true:** Your actions are caused by the past + laws of nature. You aren't the ultimate source. (Standard Hard Determinism).
  *   **If Indeterminism is true:** Some events in your brain are random/uncaused.
      *   Strawson asks: Does randomness give you *control*?
      *   If a choice pops into your head randomly (indeterministically), that isn't freedom; that's luck or chaos.
      *   To claim responsibility for that random choice, you still need to show that *you* shaped the probability of that choice.
      *   But to shape that probability, you need a prior nature (preferences, risk-assessment, etc.).
      *   **The Bottleneck:** You are back at Premise 3. Whether the chain is determined or random, **you** are not the author of the nature that processes that chain.

  **The *Causa Sui* point is the killer:**
  Indeterminism breaks the *causal* chain, but it doesn't break the *regress* of self-creation. Even in an indeterministic universe, you cannot pop into existence fully formed with the ability to choose your own starting parameters. You would still need to be *causa sui* to be ultimately responsible. Since *causa sui* is logically impossible, the truth value of determinism is irrelevant.

  ### 3. The Nietzsche Connection (Your Friend Was Right)

  Your friend wasn't just name-dropping. Strawson explicitly credits Nietzsche with spotting this logical impossibility centuries ago.

  In *Beyond Good and Evil* (Section 21), Nietzsche writes:

  > *"The **causa sui** is the best self-contradiction that has been conceived so far; it is a sort of rape and perversion of logic... The desire for 'freedom of the will' in the superlative metaphysical sense... is the desire to bear the entire and ultimate responsibility for one's actions oneself, and to absolve God, the world, ancestors, chance, and society... it involves nothing less than to be precisely this **causa sui** and, with more than Baron Münchhausen's audacity, to pull oneself up into existence by the hair, out of the swamps of nothingness."*

  Strawson's Basic Argument is essentially a formalization of this Nietzschean insight. If you want to cite this to your friend, tell them Nietzsche called it "pulling oneself up by the bootstraps" (or hair, in the translation).

  ### 4. Galen vs. P.F. Strawson (The Family Feud)

  This is where the confusion usually lies. They are father and son, and they hold almost diametrically opposed views on this topic.

  **P.F. Strawson (The Dad): "Freedom and Resentment" (1962)**
  *   **Position:** Compatibilist / Naturalist (often called a "Strawsonian Optimist").
  *   **Argument:** He thinks the whole debate about determinism vs. indeterminism is a distraction. We shouldn't look at metaphysics; we should look at human social practices.
  *   **Key Concept:** **Reactive Attitudes.** We naturally feel resentment, gratitude, guilt, and forgiveness. These attitudes *constitute* responsibility. As long as we are psychologically capable of these reactions, we have free will and responsibility.
  *   **Takeaway:** "Don't ask if we are metaphysically free; look at how we actually live. We hold people responsible, so they are responsible."

  **Galen Strawson (The Son): "The Basic Argument" (1986/1994)**
  *   **Position:** Hard Incompatibilist / Pessimist.
  *   **Argument:** He thinks his dad is dodging the hard question. Just because we *feel* resentment doesn't make it *justified* in the ultimate sense.
  *   **Key Concept:** **Ultimate Responsibility.** He agrees we have "reactive attitudes," but argues these are biologically programmed responses that don't track metaphysical truth.
  *   **Takeaway:** "Dad, you're ignoring the logic. Unless I created myself, I can't be ultimately responsible, no matter how much resentment I feel."

  **The Difference in a Nutshell:**
  *   **P.F. Strawson:** Responsibility is a social game we play. It's real because the game is real.
  *   **Galen Strawson:** Responsibility requires a metaphysical foundation (self-creation). Since that foundation is impossible, the game is based on an illusion.

  ### Summary for the Next Round of Drinks

  1.  **You were right:** The Basic Argument is not Hard Determinism. It works even if indeterminism is true because randomness doesn't solve the infinite regress of self-creation.
  2.  **The Engine:** The argument hinges on the impossibility of *causa sui* (self-creation). You can't choose your nature without already having a nature to choose with.
  3.  **Nietzsche:** Your friend was correct. Nietzsche identified the *causa sui* contradiction long before Galen.
  4.  **The Dad:** P.F. Strawson argued that responsibility is grounded in human emotion (reactive attitudes), not metaphysics. Galen argues that metaphysics makes responsibility impossible regardless of our emotions.

  **Who won the debate?**
  Technically, **you** won on the specific claim about indeterminism (Galen is not a hard determinist). However, **your friend** won on the conclusion (Galen agrees there is no moral responsibility). You were both half-right, which is the most frustrating outcome of all.
