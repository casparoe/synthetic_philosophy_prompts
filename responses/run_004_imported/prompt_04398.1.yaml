answer: |-
  This is a classic debate in the field. Your friend is arguing for a **Cartesian Boundary** (the agent and environment are distinct variables), while you are arguing for **Embeddedness** (the agent is a sub-computation of the environment).

  The specific example you want is the **"5-and-10 Problem" (specifically the Löbian Obstacle version).**

  This scenario demonstrates that giving an agent a perfect self-model doesn't save Standard Decision Theory (specifically Causal Decision Theory); it actively breaks it.

  ### The Scenario: 5-and-10
  An agent stands before two buttons.
  *   **Button A:** Pays $5.
  *   **Button B:** Pays $10.

  The agent wants to maximize money. There are no other agents, no predictors, no tricks. Just a choice between 5 and 10.

  ### 1. The Cartesian View (Your Friend's Take)
  In standard Expected Utility theory, the agent calculates:
  $$EU(Action) = \sum P(Output | do(Action)) \times Utility(Output)$$

  *   **If I press A:** I get $5.
  *   **If I press B:** I get $10.
  *   **Decision:** Press B.

  Your friend says: "If the agent models itself, it just sees that its own press causes the payout. It still presses B."

  ### 2. The Embedded View (The Breakdown)
  Now, assume the agent is **embedded**. It is a computer program running in the universe. It has access to its own source code (a "good enough self-model"). It wants to reason about its choice logically before making it.

  The agent tries to evaluate the counterfactual: *"What would happen if I pressed Button B?"*

  To do this, it looks at its own source code to see what it *will* do. Because it has a perfect self-model, it is smart enough to prove its own behavior.
  1.  The agent reasons: "I am an utility-maximizer. I can prove that pressing A yields $5 and pressing B yields $10."
  2.  The agent searches for a proof of what it will do.
  3.  **The Trap:** Suppose the agent finds a proof (perhaps via a weird logical loop known as Löb's Theorem) that says: **"I will press Button A."**
  4.  Now the agent tries to evaluate the counterfactual for Button B: *"What if I press Button B?"*
  5.  But the agent *knows* (has proven) it will press Button A. Therefore, the statement "I press Button B" is **logically false**.
  6.  In classical logic, **False implies Anything** (*ex falso quodlibet*).
  7.  Therefore, the logical implication *"If I press Button B, then the universe explodes"* is technically **TRUE**.
  8.  The agent calculates the Expected Utility of Button B as negative infinity (or very low), because the counterfactual world contains an explosion.
  9.  **Decision:** The agent presses Button A and takes $5.

  ### 3. Why "Just Add a Self-Model" Doesn't Fix It
  Your friend's solution is: *"Give it a self-model so it knows how it interacts with the environment."*

  In this scenario, **the self-model is the bug.**

  *   **If the self-model is accurate:** The agent proves its own action. This turns the alternative action into a logical contradiction. Standard logic explodes, and the agent takes the suboptimal action ($5).
  *   **If the self-model is probabilistic (uncertain):** The agent says, "I'm 90% sure I'll press A." This avoids the logical explosion, *but* it breaks Standard Decision Theory in a different way. Standard Causal Decision Theory requires the agent to treat its *current* choice as a free variable (the `do()` operator). If the agent has a probability distribution over its own actions, it is no longer treating its choice as a free intervention; it is treating its choice as an **observation**.
      *   This shifts the agent from Causal Decision Theory (CDT) to Evidential Decision Theory (EDT), which fails in other standard problems (like Smoking Lesion).
      *   To fix this, you need a *new* decision theory (like Functional Decision Theory) that handles logical correlations, not just a better model.

  ### 4. Where the Classical View Breaks
  The specific mathematical object that breaks is the **Counterfactual**.

  *   **Cartesian:** The agent assumes it can surgically intervene on the universe ($do(Action)$) without changing its own past or source code. The counterfactual "If I did X..." is a distinct causal branch.
  *   **Embedded:** The agent *is* the source code. It cannot imagine a world where the source code outputs X if the source code mathematically necessitates Y. There is no "causal branch" where the math is different.

  **The Takeaway for Your Friend:**
  You can tell him: *"In the 5-and-10 problem, a Cartesian agent gets $10. An embedded agent with a perfect self-model can prove it will take $5, which makes the counterfactual 'If I take $10' a logical contradiction. In classical logic, contradictions imply anything, including 'If I take $10, everyone dies.' So the embedded agent takes $5. The self-model didn't save standard decision theory; it made the agent stupid by making the counterfactuals ill-defined."*

  This shows that embeddedness isn't just about "more variables in the model"; it's about the **logical impossibility of defining standard counterfactuals about yourself.**
