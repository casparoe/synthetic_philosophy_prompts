  ### **Instructor Note (For your sanity check)**
  Since you're coming from genetics, you might feel the urge to penalize the student for implying fitness *is* a tautology. In this context, don't; the question asks for *Popper's reasoning*, and Popper genuinely believed biologists defined fitness tautologically. The mark deduction comes from Part (b): Popper's recantation was that natural selection *can* be formulated testably, not necessarily that it is "just as testable as any law of physics" (he maintained distinctions between historical and universal sciences). Also, prompt (b) asked *whether* it amounts to a full retraction; the student asserted it *did* without evaluating the nuance, which is a minor instruction miss.

