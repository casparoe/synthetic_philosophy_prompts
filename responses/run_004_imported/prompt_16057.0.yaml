answer: |-
  **Setting:** *A garden in Bellevue, late autumn, 1758. The leaves are turning, mirroring the turning of their friendship. Denis Diderot sits on a stone bench, holding a copy of Rousseau's newly published* Lettre à d'Alembert. *Jean-Jacques Rousseau paces nearby, restless.*

  **Diderot:** You strike hard, Jean-Jacques. To tell d'Alembert, and through him all of Paris, that we would be better off burning our playhouses and dancing in a circle like Swiss peasants? It is a provocation.

  **Rousseau:** It is a diagnosis, Denis. You treat the theatre as a mirror of nature. I tell you it is a mirror of artifice, and in gazing into it, the soul becomes what it beholds.

  **Diderot:** A mirror of artifice? Surely you grant that when a mother sees a stage-parent suffer, her heart swells? She identifies with the pain. She leaves the theatre with her capacity for pity expanded. Is that not moral cultivation?

  **Rousseau:** It is moral *expenditure*. That is the crux of it. In the theatre, we are praised for virtues we do not practice. We weep for Hecuba, for Merope, for the orphan on the stage. We discharge our whole capacity for compassion in those two hours. We say, "Look how sensitive I am," and we feel virtuous without the cost of virtue. Then we walk out into the street. A beggar asks for sou, and we pass him by, our pity already spent. The theatre does not inspire action; it replaces it with sentiment. It is a ledger where we credit ourselves for emotions we never intend to spend in the real world.

  **Diderot:** You reduce the human heart to a finite reservoir. I say it is a muscle. Use it, and it grows stronger. If I tremble for a fictional hero, I am practicing the reflex of sympathy. When I encounter real suffering, the reflex is quicker.

  **Rousseau:** A muscle exercised in the air, striking nothing? No. The spectator sits in the dark, passive. He is not an agent; he is a vessel. And what fills him? Not truth. Lies.

  **Diderot:** Illusion, yes. But necessary illusion.

  **Rousseau:** Let us speak of the source of that illusion. The actor. To play a part, a man must cease to be himself. He must study the gestures of passion without feeling the heat of it. He must seem what he is not. If a man spends his life practicing deception, even for "art," how does his character not rot? He becomes a creature of masks. He loses the ability to be transparent. And if the teacher of the public is a professional dissembler, what lesson does the public learn but that appearance is all that matters?

  **Diderot:** *(Leaning forward)* Here, Jean-Jacques, you mistake the craft for a vice. You assume the actor must feel to show feeling. I tell you the opposite. The great actor is not the one who weeps real tears; he is the one who calculates them. If he truly felt the rage of Othello every night, he would be dead of exhaustion in a week. He must be a cool observer of his own heat. He is a dissembler, yes, but a truthful one. He shows us the *idea* of passion, distilled.

  **Rousseau:** A cool observer of heat? That is a monster. You describe a man who lies with precision. You value the accuracy of the mask over the integrity of the face.

  **Diderot:** I value the effect on the audience! If the mask moves them to love humanity, does the face behind it matter?

  **Rousseau:** It matters because the medium is the message. You cannot teach sincerity through insincerity. Look at your Molière. You claim he corrects manners. I say he corrupts them. Take *The Misanthrope*. Alceste is the honest man. He demands truth in love and society. Philinte is the compromiser, the man who hugs the man he despises. Who does Molière make ridiculous? Alceste. Who leaves the stage vindicated? Philinte.

  **Diderot:** Alceste is a fanatic. His honesty is brutal. He lacks *sociabilité*.

  **Rousseau:** He lacks nothing but the willingness to lie! But the audience laughs at him. They learn that honesty is a social defect. They learn that to be a "good man" in society, one must be pliable, like Philinte. One must prefer politeness to truth. That is not a correction of morals; it is a lesson in corruption.

  **Diderot:** *(Pauses, tapping the book)* You press me hard on Molière. I will concede this: If the goal is strict civic virtue, *The Misanthrope* is a failure. Molière sought to please the court, and the court prefers Philinte. I have defended comedy as a school for virtue, but... *(he sighs)* ...perhaps in this specific instance, the laughter is misdirected. It teaches us to tolerate vice in the name of ease.

  **Rousseau:** Then the theatre is condemned by its own master.

  **Diderot:** No. It condemns *that* theatre. It proves we need a new genre. Not comedy that mocks the honest man, nor tragedy about kings we never see. We need the *drame bourgeois*. Drama of the middle class. Where the stakes are moral, not political. Where the father, the merchant, the son see their own domestic virtues on stage. If Alceste were a bourgeois father fighting for his family's honor, not a suitor fighting over a coquette, the audience would not laugh. They would recognize the utility of his honesty. I revise my claim: Molière's comedy may be flawed for your purpose, but that is an argument for a better drama, not no drama at all.

  **Rousseau:** You build a new tower on a foundation of sand. You think you can change the nature of the spectacle. But the problem is not the play; it is the separation. The stage separates the actor from the spectator. The lights separate the seen from the seer. It creates a hierarchy.

  **Diderot:** It creates focus.

  **Rousseau:** It creates alienation. Come with me to Geneva. We have no theatre. But on the day of the festival, we go to the square. There is no stage. There is no paid actor. The citizens stand in a circle. One moment a man sings, the next he claps for his neighbor. They are simultaneously actors and spectators to one another.

  **Diderot:** A village dance.

  **Rousseau:** A civic body. In that circle, there is no disguise. You cannot pretend to be virtuous when your neighbor is watching you dance, when you must look him in the eye. There is no "discharge" of emotion because there is no passive consumption. The joy is not represented; it is enacted. It is transparent. In Paris, you go to the theatre to hide from each other in the dark. In Geneva, we gather to see each other in the light. Which culture produces the man who helps the beggar after the show?

  **Diderot:** Geneva is a city of twenty-four thousand souls. You can know them all. Paris is a cosmos. We are strangers. We *need* the theatre to teach us how to feel for those we do not know. The stage is a laboratory of empathy. You speak of transparency, but total transparency is a tyranny. Sometimes a man needs the dark of the auditorium to let his guard down, to feel a grief he would suppress in the public square.

  **Rousseau:** And in suppressing it in the square, he remains a citizen. In the dark, he is merely a consumer of grief. You say the theatre teaches empathy for strangers. I say it teaches us that empathy is a ticket we buy. Once the curtain falls, the contract ends.

  **Diderot:** You demand an impossible purity. You want the politician to be a saint, the actor to be a truth-teller, the citizen to be constantly visible. Human nature is more complex. We need the fiction to sustain the reality. The actor's calculation allows the spectator's abandon.

  **Rousseau:** And that abandon is the death of the will. You cultivate the flower but poison the root. I would rather have a rough citizen who acts honestly than a refined spectator who weeps beautifully.

  **Diderot:** And I would rather have a refined spectator who weeps than a rough citizen who feels nothing at all. We are at an impasse, Jean-Jacques. You seek a republic of virtue, transparent as glass. I seek a society of letters, complex as a machine.

  **Rousseau:** Glass breaks, Denis. But machines... machines rust from the inside when the parts do not fit the whole.

  **Diderot:** *(Standing, placing the book on the bench)* Then let us agree on this: The *Misanthrope* may teach the wrong lesson. But I will not burn the theatre to fix it. I will write a better play.

  **Rousseau:** And I will not dance in your circle to please you. I will return to my plants. At least they do not pretend to bloom.

  **Diderot:** But they do not speak, either. Good day, Jean-Jacques.

  **Rousseau:** Good day, Denis.

  *(Diderot exits toward the house. Rousseau remains, looking at the empty bench, then up at the trees.)*
