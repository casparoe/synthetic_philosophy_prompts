answer: |-
  Good evening. For those who don't know me, I'm the novelist in the family. Which means my job is to make things up, while my sister's job is to figure out what's actually real. Usually, we don't let us in the same room, but tonight, I've been asked to bridge the gap.

  I was told that a wedding toast has certain requirements. I'm supposed to talk about how the couple has grown. I'm supposed to say that through all of life's changes, they will remain "fundamentally themselves." I'm supposed to offer you a wish for stability, for an enduring core that nothing can shake.

  But there is a problem. A professional hazard.

  My sister has spent the last decade of her life studying Einstein's Hole Argument. And for the half of the room who are philosophers of physics: yes, I know what I'm doing. For the rest of my family: don't worry, I'm not going to talk about math. I'm going to talk about what that argument *means*.

  Basically, my sister's career is built on a question about identity. When you look at the universe, is spacetime like a stage—a fixed container that exists even if the actors leave it? Or is spacetime just the web of relationships between the actors themselves?

  If the stage is real, then you have an intrinsic identity. You are "you" because you occupy a specific spot on the floor, no matter who is standing next to you. But if the relational view is correct—the view my sister has defended in her dissertation, her book, and her tenure case—then the "stage" is an illusion. A point in space has no identity at all, except for where it sits in relation to everything else. Take away the relations, and the point disappears.

  So, I found myself in a bind. How do I give a standard wedding speech to a woman who has proven, rigorously, that "standard identity" is a physical impossibility? If I tell her to "stay true to herself," I am essentially asking her to be a substantivalist. And we all know what happens to indeterminism in a Hole Argument.

  But then I realized: this isn't a bug. It's the feature.

  Because if you think about it, the standard wedding wish is actually quite lonely. "Stay fundamentally yourself." It implies that you are a finished object, a statue dropped into a room, and marriage is just placing another statue next to you. Two solid things, occupying their own coordinates, politely not overlapping.

  But my sister knows better. She knows that identity isn't something you *have*; it's something that *happens*.

  In a relational universe, you are not defined by where you are, but by what you are connected to. You are the sum of your distances, your tensions, your orbits. And that, to me, is the most romantic thing I have ever heard.

  It means that when you two met, you didn't just find someone to share your life with. You found the person who would help *constitute* your life. It means that the "you" that walks into this marriage is not the same "you" that walks out, because the web of relations has changed. The geometry of your world has shifted.

  For the family: Imagine a dance. If you stop the music and freeze the dancers, you can measure how far apart they are. But the dance isn't in the distance; it's in the hold. It's in the tension of the hand, the lean of the body. If one person lets go, the other doesn't just lose a partner; they lose their balance. They lose their position. In a very real sense, they lose their place in the dance.

  That is what my sister studies. And that is what you two are celebrating.

  So, I am not going to wish that you remain fundamentally yourselves. I hope you don't. I hope you are constantly redefined by one another. I hope that the person you are five years from now is unrecognizable to the person you are today, because the web of relations between you has grown so dense, so complex, and so strong that it creates a new reality.

  There is a fear, sometimes, that this sounds like losing yourself. That if your identity depends on another, you are vulnerable. And you are. Relationalism requires courage. It requires admitting that you are not a self-contained island. It requires admitting that if the world shifts, you shift with it.

  But look at the alternative. The alternative is a cold, empty grid. The alternative is a universe of isolated points that never truly touch.

  My sister has taught me that the "Hole" isn't a void to be feared. It's the space where the physics happens. It's the space where gravity lives. And in this room, tonight, it is the space where love lives.

  So, to the colleagues: I promise I didn't misuse the metric field.
  To the family: I promise you didn't need to understand the metric field.
  And to the couple:

  May you never be static points on a fixed grid.
  May you be the relation itself.
  May you define each other, constantly, fiercely, and without end.
  And may your universe be entirely, beautifully, determined by the love you hold between you.

  To the bride and groom.
