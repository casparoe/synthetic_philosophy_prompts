  **Justifications**

  **1. Marek (Surrogate as Dominant Strategy):** Score: 1. Marek correctly describes the local incentive structure for a leverage-maximizing threatener *assuming* the threatener takes the agent's policy as fixed. If the cost of carrying out the threat is lower for the surrogate and the concession probability is identical, the expected utility favors the surrogate. However, labeling this a "free lunch" overlooks the threatener's ability to adapt their own policy, which Iris identifies in (4).

  **2. Iris (Legibility and Bluffing):** Score: 1. Iris correctly identifies that the mechanism collapses without transparency regarding the agent's commitment. However, in the specific context of acausal threats involving simulation (as noted in 3), "bluffing" is less coherent than in causal human interactions, since the simulator inspects the policy source rather than behavioral history. Her point holds structurally but is slightly less forceful in the acausal regime than she implies.

  **3. Marek (Legibility as Standard Assumption):** Score: 2. Marek is factually correct regarding the modeling conventions of formal acausal decision theory (FDT/UDT). In these frameworks, acausal interaction presupposes sufficient logical correlation or source-code access that dispositions are effectively transparent; opacity is usually treated as a breakdown of the acausal link itself.

  **4. Iris (Commitment Races):** Score: 2. This is the decisive objection. Surrogate goals do not resolve the underlying "commitment race" problem inherent in updateless decision theory. If both parties can pre-commit, the agent adopting surrogates and the threatener ignoring them creates a contradiction that standard decision theories cannot resolve without arbitrary tie-breaking rules. Marek's model implicitly assumes the threatener does not exercise their own updateless pre-commitment power.

  **Resolvability**

  This dispute is not fully resolvable from the armchair because it hinges on the unresolved "commitment race" problem in updateless decision theory. While the game-theoretic logic is conceptual, determining who wins the race—the surrogate adopter or the meta-threatener—depends on empirical specifics about how superintelligent agents implement pre-commitment and how logical correlations are prioritized when policies clash. Until there is a canonical solution for handling contradictory pre-commitments in FDT/UDT, the efficacy of surrogate goals remains contingent on speculative assumptions about the threatener's architecture rather than pure derivation.
