          *   *Re-evaluating Move 6:* Marcus admits it's about reputation. This implicitly concedes that *in a vacuum*, his logic holds, but *in society*, Jen's pressure matters.

      *   *Decision:* I need to be careful not to just say "Marcus is right because math." Jen is right about the *social contract*. The prompt asks who has the *better argument*.
      *   *Move 1:* Jen. (Highlights the collective cost).
      *   *Move 2:* Marcus. (Highlights lack of causal link).
      *   *Move 3:* Jen. (Introduces logical correlation, valid counter to causal independence).
      *   *Move 4:* Marcus. (Preferences break the symmetry).
