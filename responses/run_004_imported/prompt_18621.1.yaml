          *   *Analysis:* This is standard Causal Decision Theory (CDT). My action $A$ does not causally influence action $B$. Therefore, I should maximize my utility based on $A$ alone, treating $B$ as fixed. In a split bill scenario, if I order \$20 more, my share goes up by \$20/8 = \$2.50. I pay \$2.50 to get \$20 worth of value. Rational self-interest says order the ribeye.
