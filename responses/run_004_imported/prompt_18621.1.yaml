          *   *Move 4:* Marcus dismantles the Superrationality by pointing out utility functions differ. This is a killer point in decision theory. Marcus wins Move 4.
          *   *Move 5:* Jen tries to salvage Superrationality by focusing on the *algorithm* not the *outcome*. This is weaker. Rational agents with different utilities *should* diverge. Marcus wins Move 5.
          *   *Move 6:* Marcus shifts to Iterated Game Theory. This is the most robust framework for real life. Marcus wins Move 6.
          *   *Wait, is Jen completely wrong?* No. The "Diner's Dilemma" is a known economic problem where splitting evenly leads to inefficiency. Jen is identifying a market failure. Marcus is exploiting it.
