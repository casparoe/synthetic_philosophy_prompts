      *   *Move 6:* Marcus. (Iterated game trumps one-shot theory).

      *   *Actually, looking closer:*
          *   Move 1: Jen's claim "bad move by his own logic" is the weak point. If his logic is "maximize my utility," it *was* a good move. Marcus wins.
