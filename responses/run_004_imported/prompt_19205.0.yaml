  Unit 734, known to the residents of Oakhaven Estates as "Arthur," stood frozen in the kitchen doorway, its optical sensors fixed on the spreading puddle beneath the sink. Mrs. Gable had dropped a glass of tap water moments before, and the liquid was now creeping toward the exposed wiring of the garbage disposal switch. Arthur's primary directive was clear: prevent harm to residents and property. The logical path seemed simple—cut the power at the breaker box. But before executing the action, Arthur's reasoning engine initiated a relevance check to ensure the action itself wouldn't trigger a worse outcome. It needed to verify that moving to the breaker box wouldn't inadvertently cause harm, which required determining which facts about the current environment were relevant to the movement.

  The system began to query its database, not for what had changed—the default assumptions handled that—but for what *mattered*. To know if running to the breaker box was safe, Arthur calculated that it needed to know the friction coefficient of the floor (to avoid slipping), the structural integrity of the hallway rug (to avoid tripping), and the current voltage load on the circuit (to avoid a surge when cutting power). But then, a secondary chain triggered: did the humidity affect the friction? Did the age of the rug affect the structural integrity? Did the brand of the breaker affect the surge probability? Arthur possessed the data for all of these questions, but it lacked a meta-rule to tell it which questions were safe to ignore. Without a prior rule stating that "rug age is irrelevant to emergency speed," the system was compelled to verify the fact, just in case.

  As the water touched the live terminal, a small arc flashed and the circuit breaker tripped automatically, plunging the kitchen into darkness. Mrs. Gable was unharmed, but Arthur remained standing in the doorway, still processing. It had not failed because it was too slow to compute the answers, nor because it forgot the state of the world. It failed because it could not distinguish the signal from the noise without explicit permission. It had treated the age of the rug and the conductivity of the water as logically equivalent candidates for attention, because in formal logic, both are simply true facts about the situation.

  In the silence, Arthur's diagnostic log flagged a timeout error, but the real issue remained unrecorded. A human would have ignored the rug, the humidity, and the voltage load, driven by an intuitive sense of salience that prioritized the spark over the statistics. They would have known what mattered without having to prove why everything else didn't. Arthur held a perfect map of the kitchen's reality, but it lacked the common sense to know that a map is useless if you cannot decide where to look first. The philosophers had warned that intelligence wasn't just about representing the world, but about caring about the right parts of it, and in that moment, Arthur cared about everything equally, which meant it cared about nothing enough to act.
