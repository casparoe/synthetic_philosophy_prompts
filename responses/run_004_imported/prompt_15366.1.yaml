answer: |-
  Frederick Douglass would almost certainly view contemporary originalism, as described in the prompt, as a **betrayal** of his interpretive method that merely borrows its language. While both Douglass and modern originalists claim fidelity to the constitutional text over evolving moral whims or the "corrupt" nature of the document, the *structural mechanics* of Douglass's hermeneutics differ fundamentally from the way originalism is applied to narrow the Reconstruction Amendments.

  Douglass would reject this form of originalism based on three specific structural pillars of his own argument: his distinction between text and private intent, his teleological reliance on the Preamble, and his understanding of the Reconstruction Amendments as transformative principles rather than historical snapshots.

  ### 1. Text vs. Private Intent (The "Secret Compromise" Argument)
  The core of Douglass's break with William Lloyd Garrison was the argument that citizens are bound by the **public text** of the Constitution, not the **private intentions** or "secret compromises" of the framers. In his 1860 speech, *"The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?"*, Douglass argued that even if the framers intended to protect slavery, their failure to write the words "slave" or "slavery" into the document meant the text itself did not sanction it. He insisted that the Constitution must be interpreted "as it reads," not as the framers whispered behind closed doors.

  Contemporary originalism, when used to narrow the Reconstruction Amendments, often relies on the **expected applications** of the ratifiers. For example, an originalist argument against affirmative action might posit that because the 39th Congress did not explicitly intend to sanction race-conscious remedies in 1868, the Equal Protection Clause cannot allow them today.

  Douglass would identify this as the very error he fought against. He would argue that binding the present to the specific expectations or prejudices of the 1868 ratifiers is analogous to being bound by the pro-slavery intentions of the 1787 framers. For Douglass, the text ("Equal Protection," "Right to Vote") establishes a **principle** that transcends the specific historical limitations of the men who wrote it. To use the historical limitations of the Reconstruction Congress to limit the textual guarantee of equality would be to prioritize "private intentions" over the "public text," violating the core structure of his argument.

  ### 2. Teleological Interpretation (The Preamble Argument)
  Douglass's interpretive method was not strictly textualist in the modern sense; it was deeply **teleological**. He consistently invoked the Preamble's stated purposes—to "secure the Blessings of Liberty" and "establish Justice"—as the lens through which specific clauses must be read. He argued that no clause should be interpreted in a way that defeats these overarching goals.

  In his view, the Constitution was a "glorious liberty document." Therefore, any interpretation that resulted in the continuation of bondage or the denial of rights was inherently suspect. Contemporary originalism, in the context of voting rights and affirmative action, often treats the Preamble as non-operative rhetoric and focuses narrowly on the specific legal meaning of clauses at the time of ratification.

  If an originalist reading leads to the conclusion that the 15th Amendment allows for the erosion of voting protections (as in *Shelby County v. Holder*) or that the 14th Amendment prohibits remedies for racial inequality, Douglass would argue this defeats the "Blessings of Liberty." Structurally, Douglass's method demands that the text be read to *effectuate* liberty, not to preserve a historical status quo. An interpretation that narrows the reach of freedom, even if historically grounded, fails Douglass's test because it contradicts the document's stated *purpose*.

  ### 3. The Transformative Nature of the Reconstruction Amendments
  Finally, Douglass viewed the Reconstruction Amendments not merely as additions to the Constitution, but as a **second founding** that fundamentally altered the relationship between the federal government and the states regarding human rights. He argued that these amendments removed the last ambiguity regarding the Constitution's commitment to equality.

  Modern originalism, when applied to these amendments, often treats them through the lens of "federalism" or "colorblindness" derived from 19th-century classical liberalism. This approach often posits that the 14th Amendment prohibits *all* racial classifications, thereby banning affirmative action.

  Douglass, however, supported specific, race-conscious measures (such as land redistribution and targeted aid) for freedmen, arguing that formal legal equality was insufficient without the material capacity to exercise it. Structurally, Douglass's argument relies on the **substance of rights** rather than the **form of neutrality**. He would likely argue that an originalist reading which forbids the government from correcting the specific injustices of slavery ignores the *cause* that necessitated the Amendments. To interpret the 14th Amendment as prohibiting the remedy for the very evil it was designed to eradicate would be, for Douglass, a logical absurdity that violates the structural integrity of the Reconstruction project.

  ### Conclusion
  Frederick Douglass would recognize contemporary originalism as a betrayal because it inverts his hermeneutic hierarchy. Douglass used the text to **liberate** the Constitution from the framers' pro-slavery intentions. Contemporary originalism, in the cases cited, uses the framers' (or ratifiers') historical limitations to **constrain** the text's liberatory potential.

  For Douglass, fidelity to the text meant fidelity to its **principles of liberty**, regardless of whether the men of 1787 or 1868 fully understood or intended those principles to apply. An interpretive method that freezes the Constitution's meaning to the historical prejudices of its ratifiers, thereby narrowing the protection of rights, would be viewed by Douglass not as fidelity to the text, but as a return to the "covenant with death" he spent his life dismantling.
