answer: |-
  Your intuition is correct, and your friend's reasoning contains a classic, subtle error that trips up many people in finance and probability. While his calculation of the **Expected Value (EV)** for a *single* bet is mathematically accurate, his recommendation for a *recurring* strategy is dangerously flawed.

  You are not suffering from irrational risk-aversion; you are correctly identifying the difference between **ensemble averages** (what happens to 1,000 people once) and **time averages** (what happens to one person 1,000 times).

  Here is the breakdown of why the "All-In" strategy will almost certainly bankrupt you, and what the actual optimal math says.

  ### 1. The Trap of the Arithmetic Mean
  Your friend is maximizing the **arithmetic mean** of your wealth. Let's look at the math for a single bet of \$100:
  *   **1/3 chance:** You have \$600.
  *   **2/3 chance:** You have \$0.
  *   **Expected Value:** $(1/3 \times 600) + (2/3 \times 0) = \$200$.

  This is a 100% return on investment. For a **one-time-only** bet, your friend is right. If you only planned to make this wager once in your life, you should bet everything.

  However, you are making this wager **repeatedly**. When you reinvest your winnings (compounding), the arithmetic mean no longer predicts your likely outcome. The **geometric mean** does.

  ### 2. The Ruin Problem (Time Average vs. Ensemble Average)
  Your friend argues that if 1,000 people bet all-in, the average payoff is enormous. This is true.
  *   After 1 round: ~333 people win (6x), ~667 lose (0). Average wealth is high.
  *   After 2 rounds: Only ~111 people win again. The rest are at 0.
  *   After 10 rounds: Only $(1/3)^{10}$ of the original group survives. That is roughly **1 in 59,000**.

  If you bet your entire bankroll every time, a single loss reduces your bankroll to zero. Since the probability of loss is 2/3 per bet, the probability of surviving $N$ bets is $(1/3)^N$. As $N$ approaches infinity, your probability of ruin approaches **100%**.

  In probability theory, this system is **non-ergodic**. The average outcome across the group (ensemble) does not equal the average outcome experienced by an individual over time. You live in one timeline, not across 1,000 parallel universes. In your timeline, "All-In" guarantees eventual ruin.

  ### 3. The Solution: The Kelly Criterion
  To maximize long-term wealth growth in a repeating wager, you should not maximize Expected Value; you should maximize the **Expected Logarithm of Wealth** (which equates to maximizing the geometric growth rate). This is solved using the **Kelly Criterion**.

  The formula for the optimal fraction ($f^*$) of your bankroll to wager is:

  $$f^* = p - \frac{q}{b}$$

  Where:
  *   $p$ = Probability of winning ($1/3$)
  *   $q$ = Probability of losing ($2/3$)
  *   $b$ = Net odds received on the wager (Profit per unit staked). Since you get 6x back total, your profit is 5x the stake. So, $b = 5$.

  Plugging in your numbers:

  $$f^* = \frac{1}{3} - \frac{2/3}{5}$$
  $$f^* = \frac{1}{3} - \frac{2}{15}$$
  $$f^* = \frac{5}{15} - \frac{2}{15} = \frac{3}{15} = \frac{1}{5}$$

  **The mathematically optimal bet size is 20% of your current bankroll.**

  ### 4. Comparing the Strategies
  Let's look at the growth factor per bet for both strategies:

  **Strategy A: All-In (100% of bankroll)**
  *   Win: Wealth $\times 6$
  *   Lose: Wealth $\times 0$
  *   Geometric Growth Rate: $(6^1 \times 0^2)^{1/3} = \mathbf{0}$
  *   **Result:** Certain Ruin.

  **Strategy B: Kelly (20% of bankroll)**
  *   Win: Wealth $\times (1 + 0.2 \times 5) = \text{Wealth} \times 2$
  *   Lose: Wealth $\times (1 - 0.2) = \text{Wealth} \times 0.8$
  *   Geometric Growth Rate: $(2^1 \times 0.8^2)^{1/3} = (1.28)^{1/3} \approx \mathbf{1.085}$
  *   **Result:** Your bankroll grows by roughly 8.5% per wager on average, compounding indefinitely without risk of ruin.

  ### 5. Why Your Friend Is Confused
  Your friend is likely thinking in terms of **Linear Utility of Money**. In quantitative finance theory, an agent with linear utility *should* bet everything on a positive EV bet. However, linear utility implies that having \$1 billion is exactly 1,000 times more useful than having \$1 million.

  In reality, humans (and rational survival strategies) operate on **Diminishing Marginal Utility**. Going from \$0 to \$100 is life-saving; going from \$100M to \$200M is a lifestyle tweak. Once you hit \$0, you are out of the game. This is why maximizing **Log Wealth** (Kelly) is considered the rational strategy for repeated investments, not maximizing **Absolute Wealth** (EV).

  ### Summary
  Your hesitation is not irrational risk-aversion; it is a correct intuition about **survival bias** and **compounding mathematics**.

  *   **Your Friend:** Correct about the EV of a *single* bet. Wrong about the strategy for *recurring* bets.
  *   **You:** Correct that "All-In" leads to ruin.
  *   **The Verdict:** Do not bet your entire bankroll. To maximize long-term growth, you should wager approximately **20%** of your current bankroll per wager. Anything more than that (over-leveraging) actually reduces your long-term growth rate and increases your risk of ruin.
