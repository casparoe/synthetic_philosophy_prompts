      *   *Key Argument (1860 Speech):*
          *   The Constitution's text does not explicitly sanction slavery (no mention of "slavery," "slave," or "negro").
          *   Euphemisms (e.g., "persons held to service") should be read literally or in the light of liberty, not assumed to mean slaves without explicit text.
          *   Intentions of the framers are irrelevant if not encoded in the text. "We must not judge the tree by its roots, but by its fruit." (Paraphrase).
          *   The Preamble ("We the People," "secure the Blessings of Liberty") sets the purpose.
          *   *Goal:* To use the Constitution as a weapon *against* slavery within the political system (voting, legislation), rather than rejecting the Union.
      *   *Methodology:* Textualism, focus on public meaning at ratification, rejection of secret intent.

  3.  **Evaluate the Friend's Claim (Living Constitutionalism):**
