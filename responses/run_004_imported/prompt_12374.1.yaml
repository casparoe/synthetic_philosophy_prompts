answer: |-
  You have spotted something very sharp here. It is a common initial reaction to Reid to think, "Wait, isn't this just Humean naturalism with a theistic coat of paint?" Both Hume and Reid agree that reason cannot justify our belief in the future (induction) or our belief in other minds (testimony). Both agree that these beliefs rest on non-rational, instinctive features of human psychology.

  However, the "bite" of Reid's argument lies not in the **psychological description** (which is indeed similar to Hume's) but in the **epistemological normative status** he assigns to that psychology.

  Here is how Reid's move functions as a specific counter to Humean reductionism about testimony, and why it is more than just "nicer language."

  ### 1. Reductionism vs. Non-Reductionism (The Default Setting)
  The core disagreement between Hume and Reid on testimony is about the **burden of proof**.

  *   **Hume (Reductionist):** For Hume, testimony is not a unique source of knowledge. It is reduced to perception, memory, and causal inference. I believe your testimony only because my *past experience* has shown a constant conjunction between your reports and the facts.
      *   *The Default:* Skepticism. I am not justified in believing you unless I have independent inductive evidence that you (and humans generally) are reliable.
      *   *The Humean Loop:* As you noted, Hume handles induction via "custom." But custom is a *brute fact* that saves us from paralysis; it does not provide *justification*. Hume remains a skeptic about whether these beliefs are truly warranted; he just admits we can't help but have them.

  *   **Reid (Non-Reductionist):** Reid argues that testimony is a *sui generis* source of knowledge, grounded in the Principle of Credulity.
      *   *The Default:* Trust. We are *prima facie* justified in believing testimony unless there is a specific defeater (evidence of lying, incompetence, etc.).
      *   *The Reidian Shift:* Reid takes the psychological mechanism (Credulity) and argues it is **truth-conducive by design**. Because the "Author of Nature" implanted it for the purpose of knowledge, the principle carries **authority**.

  **The Bite:** Reid isn't just saying "we can't help but trust." He is saying "we are *entitled* to trust." He transforms a psychological necessity (which Hume treats as a limitation of reason) into an epistemic right (which Reid treats as a foundation of reason).

  ### 2. The Argument from Language Acquisition
  In the text you quoted, Reid makes a specific move that Hume's general induction model cannot easily handle: **The problem of learning signs.**

  Reid writes: *"This reliance... is found in children long before they know what a promise is."* and *"without which we should be incapable of language, and consequently incapable of instruction."*

  *   **Hume's Problem:** To learn via induction that "Word X means Object Y," I must observe the correlation between the utterance of X and the presence of Y. But to identify that correlation, I must already understand that the utterance is *about* Y. I need to understand the testimony to verify the testimony.
  *   **Reid's Solution:** The Principle of Credulity is a precondition for language learning, not a result of it. We must trust the speaker *before* we have the experiential data to verify their reliability. If Hume were right (that trust is derived from experience of reliability), language acquisition would be impossible, because we would need language to gather the experience that justifies language.

  **The Bite:** Reid uses a transcendental-style argument here. He argues that Hume's reductionist account makes the phenomenon (language learning) impossible. Therefore, the trust must be antecedent to experience, not derived from it.

  ### 3. Custom vs. Constitution (The Normative Gap)
  You asked if Reid is just re-describing Hume's psychology. The difference is in the metaphysical grounding of that psychology.

  *   **Hume's Custom:** Custom is a mechanism of the imagination. It is useful for survival, but it has no guarantee of truth. Hume famously separates "is" (we do believe) from "ought" (we are justified). Custom explains the "is," but leaves the "ought" hanging. This is why Hume is a skeptic.
  *   **Reid's Constitution:** Reid invokes the "wise and beneficent Author of nature." For Reid, the faculties of the mind are not just survival mechanisms; they are faculties of **truth**. If God/Nature constituted us to believe via Credulity, then the world must be constituted to satisfy that belief.

  **The Bite:** This allows Reid to claim **Common Sense Realism**. For Hume, the fact that we believe in an external world or other minds is a "sophism" we can't escape. For Reid, it is a "first principle" that is self-evident. Reid uses the "original principle" to close the gap between psychology and epistemology that Hume left open.

  ### 4. Why this matters for your seminar
  When you discuss this in seminar, the key distinction to draw is between **Explanatory Naturalism** (Hume) and **Normative Naturalism** (Reid).

  *   **Hume:** "We trust testimony because we are psychologically programmed to by custom, even though reason cannot justify it." (Explanation without Justification)
  *   **Reid:** "We trust testimony because we are psychologically programmed to by God/Nature, and this programming is designed to yield truth, therefore reason accepts it as a first principle." (Explanation *as* Justification)

  ### Summary
  Reid's argument works against Hume not by denying the psychology (he agrees we rely on instinct), but by **re-valuing** it.
  1.  **Against Induction:** Reid agrees experience doesn't justify the future, but argues that "Original Principles" are superior to "Custom" because they are foundational to reason itself, not a substitute for it.
  2.  **Against Reductionism:** Reid argues that trust in testimony cannot be the *result* of inductive verification (as Hume claims) because it is the *precondition* for the verification (language learning).
  3.  **The "Bite":** It shifts the burden of proof. For the Humean, the listener must prove the speaker is reliable. For the Reidan, the speaker is presumed reliable unless proven otherwise.

  Reid isn't just using nicer language; he is trying to rescue epistemology from Hume's skepticism by arguing that our natural instincts are not just inevitable, but **authoritative**.
