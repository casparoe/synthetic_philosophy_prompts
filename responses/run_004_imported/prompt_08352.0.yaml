answer: |-
  **Shared Agency and the Normative Residue: A Comparative Analysis of Bratman and Gilbert on the Co-Authorship Case**

  **Introduction**

  The metaphysics of shared agency is often framed as a contest between parsimony and phenomenological fidelity. On one side, Michael Bratman's planning-theoretic account offers a reductive, individualist framework that explains shared intention as a web of interlocking personal intentions. On the other, Margaret Gilbert's plural subject theory posits a *sui generis* normative relation—joint commitment—that cannot be reduced to individual attitudes without remainder. This paper compares these accounts not merely to catalogue their differences, but to test them against a specific crucible: the case of informal co-authorship where collaborators feel a sense of *wronging*, rather than mere disappointment, upon abandonment.

  I argue that while Bratman's apparatus provides a superior account of the *cognitive and functional architecture* of shared agency, it fails to capture the *deontic structure* of the obligations involved. In the co-authorship case, the feeling of being wronged implies a directed obligation—a right held by one partner against the other. Bratman can explain why abandonment is irrational or uncooperative, but only Gilbert can explain why it constitutes a violation of a joint right. Therefore, on the specific question of the source of normative obligation, Gilbert's appeal to joint commitment does genuine explanatory work that individualist psychology cannot replicate.

  **1. Bratman's Planning Theory: Interlocking Intentions and Reliance**

  Bratman's project is fundamentally naturalistic. He seeks to demystify shared intention without positing new ontological entities like "group minds." For Bratman, that "we intend to J" is analyzed as a complex structure of "I-intentions." Specifically, shared intention requires:
  1.  **Interlocking Intentions:** Each agent intends that the joint action occur.
  2.  **Mutual Responsiveness:** Each intends this partly because the other does.
  3.  **Meshing Sub-plans:** The individual plans underlying the action are compatible and coordinated.
  4.  **Common Knowledge:** These conditions are open between the agents.

  The normativity in Bratman's account is derived from the norms of individual practical rationality. Agents are planning creatures who value stability and consistency. Once I form an intention, I have a rational pressure to maintain it (the norm of stability) and to take the means to my ends (means-end coherence). In the social context, this is compounded by **reliance**. When I know you intend to J with me, I rely on that intention to form my own sub-plans. If you abandon the project, you disrupt my planning economy.

  For the Bratmanian, the obligation to persist is a function of this interpersonal reliance. To quit without notice is to violate the reasonable expectations one has induced in another, creating a defeasible reason for criticism based on the harm done to the other's planning capacity.

  **2. Gilbert's Plural Subject Theory: Joint Commitment and Rights**

  Gilbert argues that Bratman's reduction leaves out the essential normative "glue." For Gilbert, shared intention constitutes a **plural subject**. This is not a metaphor; it is a metaphysical claim that two or more individuals can constitute a single unit of agency through a **joint commitment**.

  A joint commitment is not the sum of two personal commitments. It is a single commitment to which both parties are bound. It is formed when each openly expresses readiness to enter the commitment with the other, and this is common knowledge. Crucially, the normativity here is intrinsic and *sui generis*. The joint commitment creates a bundle of rights and duties. Each party has a right to demand performance from the other, and each owes performance to the other.

  For Gilbert, the normativity is not derived from individual rationality or the consequences of reliance. It is deontological. To violate a joint commitment is not merely to be irrational or to cause disappointment; it is to **wrong** the other party. The obligation is directed: it is owed *to* the partner, giving the partner the standing to rebuke the defector.

  **3. The Co-Authorship Case: Applying the Frameworks**

  The case at hand involves two colleagues who begin co-authoring via informal conversation. There is no explicit contract or promise. However, once work is invested, both feel that walking away unannounced would *wrong* the other.

  *The Bratmanian Analysis:*
  The Bratmanian must argue that the informal conversation established the interlocking web of intentions. As work progressed, sub-plans meshed (I write section A, you write section B), and common knowledge was established through the exchange of drafts. The sense of obligation arises from **reliance**. By continuing to work, I signal my intention to continue, leading you to rely on me. Walking away violates the norm of stability and betrays your reliance.
  *Verdict:* This explains why walking away is *unreasonable* and why the remaining partner feels *frustrated*. However, it struggles to explain the specific phenomenology of *wronging*. In Bratman's framework, if I rely on you, and you let me down, you have acted poorly relative to the norms of rational cooperation. But do I have a *right* to your labor? Bratman's individualism suggests I only have an interest that you rationally ought to respect.

  *The Gilbertian Analysis:*
  The Gilbertian argues that the moment the colleagues began acting as a unit (exchanging ideas, dividing labor), they implicitly expressed readiness to be jointly committed. The lack of explicit promise is irrelevant; joint commitment can be tacit through behavior. Once the joint commitment is in place, a normative bond exists independently of individual psychological states.
  *Verdict:* This explains the "wronging." Because the commitment is joint, neither can rescind it unilaterally. To walk away is to violate the joint will, infringing on the partner's right to the continuation of the project. The obligation is not just to be reliable; it is to honor the bond.

  **4. The Normative Gap: Why Individualism Fails on Obligation**

  The crux of the disagreement lies in the nature of the obligation. Is the obligation to continue the project a **reason for action** (Bratman) or a **directed duty** (Gilbert)?

  Bratman's account creates a strong *reason* for me to continue. If I quit, I am inconsistent, and I damage your planning. But this remains within the realm of individual rationality and prudence. If I decide that my own rational consistency is less important than my desire to quit, Bratman can say I am being irrational or uncooperative. But can you *claim* my continued participation as your due?

  In the co-authorship case, the remaining collaborator feels entitled to rebuke the defector ("You can't just leave me with this!"). This standing to rebuke is the hallmark of a directed obligation. Bratman attempts to capture this through reliance, but reliance generates a claim only if there is a prior norm that one must not disappoint reasonable reliance. Where does *that* norm come from? If it is just a norm of individual morality, it applies to strangers as much as partners. But the obligation in co-authorship is *special*; it applies specifically because we are *in this together*.

  Gilbert captures this specificity. The joint commitment creates a special normative relationship that does not exist between strangers. It transforms the landscape from "I have reasons to consider your interests" to "You have a right to my participation." The Bratmanian can add layers of complexity—expectations, reliance, interlocking plans—but they remain a stack of individual attitudes. As Gilbert argues, no configuration of "I-intend" adds up to "We-are-bound." The transition from individual psychology to joint normativity requires a qualitative shift, which the joint commitment provides.

  Furthermore, consider the **rescission condition**. For Bratman, since the intention is individual, I can theoretically change my mind unilaterally (though I may incur rational criticism). For Gilbert, because the commitment is joint, it can only be rescinded jointly. In the co-authorship case, the intuition is strong that one *cannot* simply quit; one must negotiate an exit. This aligns with Gilbert's condition for rescission and contradicts the Bratmanian view of intention as fundamentally under individual control.

  **5. Objections and Nuance**

  A sophisticated Bratmanian might object that positing a "joint commitment" is metaphysically occult. Why multiply entities beyond necessity? If we can explain the behavior and the criticism through reliance and rationality, why posit a *sui generis* bond?

  This objection holds weight if our goal is solely to predict behavior. However, social ontology aims to describe the *structure* of social reality. The phenomenology of the collaborators is not just "I expected you to stay"; it is "We made a commitment." To reduce this to "I expected you" is to explain away the data rather than account for it. The "normative residue"—the specific right to hold the other accountable—is data that requires explanation.

  Moreover, Bratman's account risks making the obligation too weak. If the obligation rests on reliance, what if I tell you *not* to rely on me, yet we continue working? For Gilbert, the joint commitment binds us regardless of my private caveats, provided our public behavior expresses readiness. In academic collaboration, public action (submitting drafts, listing names) often binds us even if private doubts exist. Gilbert's public, normative focus captures the social reality of the institution of co-authorship better than Bratman's focus on internal planning states.

  **6. Conclusion**

  The impasse between your students stems from a focus on different dimensions of shared agency. The Bratman-inclined student is correct that the *mechanism* of coordination is psychological and individual; there is no mystical group mind directing our limbs. However, the Gilbertian student is correct that the *normativity* of the arrangement is irreducible.

  In the co-authorship case, the feeling of being wronged is not merely the frustration of thwarted expectations. It is the recognition of a violated right. Bratman's apparatus, rooted in individual rationality and reliance, can explain why abandonment is *regrettable* or *irrational*, but it cannot fully explain why it is *illegitimate* in the eyes of the partner. Gilbert's joint commitment does the genuine explanatory work here. It accounts for the directed nature of the obligation and the inability to unilaterally rescind the partnership.

  Therefore, while we should accept Bratman's description of the *cognitive scaffolding* of shared agency, we must accept Gilbert's account of its *deontic foundation*. Shared intention is indeed built from individual intentions, but when those intentions interlock in the right way, they generate a normative bond that transcends them. To deny this is to leave the most distinctively social feature of shared agency—the mutual obligation—unexplained.

  **Verdict:** The Gilbertian account is necessary to explain the normative force of the obligation in the co-authorship case. Bratman's individualism is insufficient to account for the directed right to demand performance.
