answer: |-
  Here are two cases designed to drive a wedge between the behavioral economist's description (hyperbolic discounting) and the philosopher's description (weakness of will), followed by a verdict on their relationship.

  ### Case 1: Hyperbolic Discounting Without Weakness of Will
  **The Fickle Movie-Goer**

  On Tuesday, you plan your Friday night. You prefer to watch a dense, educational documentary because, at that distance, you value self-improvement more than relaxation. You make no vow, no resolution, and tell no one; you simply note a preference. On Friday night, as you sit on the couch with the remote in hand, the immediate prospect of relaxation spikes in value. You switch to a mindless comedy. You feel no guilt, no sense of betrayal, and you do not think you *ought* to be watching the documentary. You simply prefer the comedy now.

  *   **Why this is Hyperbolic Discounting:** Your preference ordering reversed solely due to the temporal proximity of the reward (relaxation). This fits the Ainslie/Laibson model of time-inconsistent preferences.
  *   **Why this is NOT Weakness of Will:** Following Richard Holton, weakness of will requires the violation of a **resolution**. A resolution is a distinct psychological state from a mere preference; it involves an intention to resist reconsideration. Because you never formed a resolution to watch the documentary—only a prediction of your own preference—you cannot fail to keep it. You merely changed your mind.
  *   **Distinguishing Feature:** The absence of a **normative commitment**. Hyperbolic discounting describes a shift in valuation; weakness of will describes a failure of agency regarding a standing commitment.

  ### Case 2: Weakness of Will Without Hyperbolic Discounting
  **The Zero-Delay Betrayal**

  You have a standing resolution to treat all clients equally, regardless of personal relationships. A close friend walks into your shop. In the very instant of greeting them, without a moment's hesitation or calculation of future consequences, you apply a "friends and family" discount. You violate your resolution. However, there is no intertemporal trade-off: the benefit (your friend's immediate pleasure) and the cost (the violation of fairness) occur simultaneously. There is no delay for a discount curve to steepen. Furthermore, as you hand over the discounted item, you simultaneously think, "I should not be doing this; fairness is more important."

  *   **Why this is Weakness of Will:** You acted against a resolution you still endorsed at the time of action. You failed to abide by a policy you intended to maintain.
  *   **Why this is NOT Hyperbolic Discounting:** Hyperbolic discounting requires a **preference reversal over time** (valuing $A$ over $B$ at $T_1$, but $B$ over $A$ at $T_2$). In this zero-delay scenario, there is no time for your valuation to shift. If you still judge fairness as more important *at the moment of action* yet act otherwise, your preference ordering did not reverse; your will simply failed to execute your judgment.
  *   **Distinguishing Feature:** The persistence of **better judgment at the time of action**. Hyperbolic discounting explains action by claiming the agent's judgment *changed* (the immediate reward became more valuable). Weakness of will allows that the agent's judgment *held steady* (the long-term good was still judged better), but the action diverged anyway.

  ### Verdict

  **Akrasia and hyperbolic discounting pick out genuinely distinct phenomena.**

  Your friend (the reductionist) is correct that hyperbolic discounting is a powerful *mechanism* that often *causes* weakness of will. It explains why resolutions are difficult to maintain: the near future exerts a gravitational pull that the distant future does not.

  However, you (the holist) are correct that the concepts are not identical. Hyperbolic discounting is a **descriptive, mechanistic model** of valuation that applies to rats, algorithms, and humans alike; it requires no agency, no resolution, and no normative judgment. Weakness of will is a **normative, agential concept** that applies only to beings capable of forming resolutions and judging their own actions.

  As Case 2 demonstrates, one can fail to keep a resolution even without a temporal shift in valuation (e.g., through overwhelming emotion or compulsion). As Case 1 demonstrates, one can exhibit time-inconsistent preferences without violating any commitment. Therefore, while they often overlap in the smoking addict, they are not the same thing: one is a curve on a graph, the other is a fracture in the will.
