      *   **Length:** About 5 minutes (roughly 600-800 words spoken at a moderate pace).

  2.  **Deconstruct the Core Message:**
      *   The phrase "Money doesn't have babies" is the anchor. It needs to be the punchline and the thesis.
      *   For the laypeople: It means money is static, it's a tool, it doesn't grow on trees (or in vaults). It's about helping people, not making the bank rich.
      *   For the economists/regulators: It's a direct nod to Aristotelian economics (natural vs. unnatural acquisition).
