answer: |-
  Good evening, everyone.

  For those who don't know me, I'm [Your Name], [Aunt's Name]'s niece/nephew. I've been asked to say a few words about the last thirty-nine years. That is a very long time. It is long enough to forget what the world looked like before cell phones, before the internet, and apparently, long enough to forget how money is supposed to work.

  If you talk to most people in finance, they will tell you that money is very much alive. They talk about it like it's a pet, or a crop. They say they want to "grow" it. They want it to "work." They want it to "breed."

  My aunt, however, had a different biological assessment.

  Whenever a consultant would come by, or a competitor would suggest we add some high-fee product to help the ledger look a little heavier, she would lean back in that creaky chair from the hardware store and say, "Money doesn't have babies."

  It became her mantra. If you asked why we didn't charge extra for a late payment, she'd say, "Money doesn't have babies." If you asked why we didn't push a loan on someone who clearly couldn't afford it, she'd say, "Money doesn't have babies."

  To half of you in this room, that sounds like folksy wisdom. To the other half of you—specifically the ones with economics degrees—I suspect it sounds like a very specific, very ancient argument about the unnaturalness of usury. You know the one. Money is a measure of value, not a living thing. It is a tool for exchange, not a head of livestock meant to reproduce in a pen.

  She didn't read the books to learn that. She just looked at the people walking through the door.

  This credit union started in the back of a hardware store. The air smelled like sawdust and paint thinner. People didn't come there to make an investment; they came because they needed a roof fixed, or a car to get to work, or to bridge a gap between paychecks without falling into a hole.

  She understood that there is a difference between managing a household and running a casino. One is about making sure everyone has enough to eat. The other is about making sure the house always wins. She was in the business of the first one.

  I know there were times when the numbers on the page didn't look as exciting as the bank down the street. I know there were opportunities for "expansion" that she turned down. I know there were years where the "bottom line" was thin.

  But look around this room.

  The "returns" she generated aren't sitting in an offshore account. They are sitting at these tables.

  They are in the reliable sedan that got a single mother to her nursing shifts for ten years. They are in the small business inventory that got restocked because the owner didn't have to pay a penalty fee. They are in the peace of mind of hundreds of families who knew that if they walked into this office, they would be treated like neighbors, not ATMs.

  She refused to treat money as the point of the enterprise. And because she did, the point of the enterprise remained *us*.

  To the regulators and colleagues here: You know how rare it is to find an institution that adheres to the spirit of the law so thoroughly that it barely needs to check the letter. She didn't need a compliance manual to tell her that taking advantage of desperation was wrong. She just knew.

  To the members and family here: You know that she was stubborn. You know that she would rather explain a policy to you for an hour than charge you a fee that would have solved her paperwork problem in a minute.

  And now, after thirty-nine years, she is retiring.

  I asked her what she plans to do with all this free time. I asked if she was worried about her portfolio. She looked at me like I was speaking a foreign language and said, "I plan to sit on the porch and watch the grass grow. And unlike the money, the grass actually grows."

  So, I would like to propose a toast.

  We will not toast to her net worth. We will not toast to market share. We will not toast to the size of the balance sheet.

  Instead, let us toast to the things that money cannot buy, and the things she refused to sell.

  To the neighbors who became members. To the trust that was never capitalized. To the idea that a dollar is just a dollar, and its only true value is what it does for the person holding it.

  And to [Aunt's Name], who spent a lifetime teaching us that while money may not have babies, communities do have futures.

  Cheers.
