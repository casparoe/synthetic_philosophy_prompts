answer: |-
  This is a remarkably precise framing of a complex philosophical problem. You have correctly identified the historical arc of Bentham's sexual writings (from the suppressed manuscripts to the 2014 Boon et al. edition) and pinpointed the exact friction point between classical utilitarianism and modern liberal sexual ethics.

  Your philosopher friend is right to sense a tension, but the resolution requires disentangling *foundational ethics* (why consent matters) from *prudential policy* (how we regulate sex to maximize welfare). To answer your question: Affirmative consent is a **pragmatic extension** of Bentham's reasoning but a **foundational divergence** from it. It imports a deontological notion of sovereignty that Bentham would reject as "nonsense upon stilts," yet a consistent Benthamite would likely endorse affirmative consent policies as the only reliable mechanism to secure the "security" necessary for pleasure to flourish.

  Here is a breakdown of the reasoning, structured to help you navigate the debate.

  ### 1. Instrumental vs. Intrinsic Consent
  The core divergence lies in the moral status of consent itself.

  In modern rights-based ethics (Kantian or Liberal), consent is **constitutive**. It is the magic switch that transforms a violation into a legitimate act. Without it, the act is inherently wrong because it violates bodily autonomy, regardless of the consequences. If a person is unconscious and derives pleasure from an act they did not consent to, the rights-based theorist still calls it a violation. The harm is the usurpation of agency.

  For Bentham, consent is **instrumental**. It matters only insofar as it correlates with pleasure and pain. In *Of Sexual Irregularities*, Bentham argues against the criminalization of sodomy not because men have a "right" to sodomy, but because the pleasure derived is real and the harm (to third parties) is non-existent. He opposes non-consensual sex not because it violates sovereignty, but because it produces "alarm," "fear," and "physical pain."

  Therefore, affirmative consent is not a "natural extension" of Bentham's *moral ontology*. Bentham does not believe in bodily sovereignty as a freestanding value. He believes in bodily *security* as a prerequisite for happiness. If you could prove definitively that overriding a hesitation produced net pleasure without causing psychological trauma or social alarm, a strict Act Utilitarian reading of Bentham would not find the act inherently immoral. This is the uncomfortable truth your friend is hinting at.

  ### 2. The "Security" Principle and Rule Utilitarianism
  However, to leave the analysis there is to caricature Bentham. While he is often cast as an Act Utilitarian (calculate every specific instance), his legal and political theory leans heavily toward what we now call **Rule Utilitarianism**.

  Bentham places immense weight on what he calls **Security**, specifically "security of expectation." For society to function, individuals must feel secure that their person and property will not be violated. If the law or social norm allows for exceptions where hesitation can be overridden for "net pleasure," it destroys security. People would live in constant anxiety, unsure if their boundaries would be respected.

  In this light, Bentham's calculus changes. The "pain" of a single instance of overridden hesitation might be low (or even negative, i.e., pleasure), but the **secondary mischief**—the generalized anxiety and insecurity rippling through society if such overrides were permitted—is catastrophic.

  Therefore, a sophisticated Benthamite defense of affirmative consent runs like this:
  *   We cannot reliably calculate net pleasure in the moment of sexual encounter (the "epistemic problem").
  *   Attempting to calculate it invites abuse and error.
  *   Errors (violations) cause deep, lasting pain (trauma) and social alarm.
  *   Therefore, the rule that maximizes utility is a bright-line requirement for affirmative consent.

  In this sense, affirmative consent is a **heuristic technology** for the felicific calculus. It is the most efficient algorithm for ensuring that pleasure is not purchased at the cost of pain.

  ### 3. The Edge Case: Can Utility Override Hesitation?
  You asked if a consistent Benthamite utilitarianism could end up in tension with strict consent requirements, specifically where overriding hesitation raises net pleasure.

  Theoretically, **yes**. Practically, **no**.

  *   **Theoretically:** If one adopts a pure Act Utilitarian stance ("What does this specific calculus demand right now?"), there is a logical opening. If a partner is hesitant due to irrational shame (which Bentham might view as an "ascetic" prejudice) but would genuinely enjoy the act, and if the actor can guarantee no psychological harm results, the calculus could theoretically justify proceeding. This is the "Paternalistic Pleasure" loophole.
  *   **Practically:** Bentham was a legal reformer. He understood human bias. He knew that actors are terrible judges of their own impact. He knew that "hesitation" is often a precursor to trauma. In *The Rationale of Reward*, Bentham acknowledges that the pain of insecurity is often greater than the pleasure of gratification.

  Furthermore, Bentham's specific writings on sex emphasize the removal of *ascetic* pain (shame, guilt). If a partner is hesitant, proceeding risks converting "ascetic pain" (shame about the act) into "positive pain" (trauma from coercion). Since positive pain is weightier in the calculus, the prudent Benthamite stops.

  So, while the *logic* allows for the tension, Bentham's *psychological realism* closes the gap. He would likely argue that any system allowing for "beneficial overrides" would inevitably be abused, leading to a net decrease in social happiness. Thus, the "no exceptions" consent rule is the only utilitarian stable state.

  ### 4. The Importation of Rights
  This brings us to your second point: does affirmative consent quietly import a rights-based notion of bodily sovereignty?

  **Yes.** When we argue for "Yes Means Yes" today, we often argue from the premise that individuals own themselves. We say, "It doesn't matter if they enjoyed it; they didn't agree." That is a deontological claim. It posits a boundary that utility cannot cross.

  Bentham famously rejected natural rights as "nonsense upon stilts." He would argue that "bodily sovereignty" is merely a metaphor for "legal protection against pain."
  *   **Modern View:** Consent is a moral boundary.
  *   **Benthamite View:** Consent is a safety rail.

  The danger in invoking Bentham as a "patron saint of sexual liberalism" is that it obscures this fragility. If sexual liberty is granted only because it produces pleasure, it can be revoked if a utilitarian calculation changes. (For example, if a society decided that homosexuality caused social instability that outweighed individual pleasure, a Benthamite logic *could* theoretically condemn it, whereas a rights-based logic could not).

  However, Bentham's specific analysis of "sexual irregularities" was robust enough to anticipate this. He argued that the "harm" to society was imaginary, while the harm of punishment was real. He anchored liberty in the *reality* of suffering, not the *abstraction* of rights.

  ### 5. Synthesis for Your Piece
  For your magazine piece, the nuance lies in the distinction between **convergence** and **foundation**.

  Bentham and the modern affirmative consent advocate arrive at the same destination (robust sexual liberty protected by strict consent norms), but they travel different roads.
  *   The **Rights Advocate** says: "You must not proceed because you do not own the other person."
  *   The **Benthamite** says: "You must not proceed because you cannot guarantee you won't break the other person, and if you break them, you break the trust of everyone watching."

  The tension you sensed is real: Affirmative consent *does* rely on a concept of autonomy that sits awkwardly with a purely aggregative calculus. However, Bentham's own emphasis on **security** and **expectation** bridges the gap. He would likely view affirmative consent not as a moral absolute, but as the only viable *legal technology* to prevent the massive utility-loss of sexual violence and insecurity.

  **The Verdict:**
  Affirmative consent is not a *logical necessity* of Bentham's ethics (a pure calculus could theoretically justify override), but it is a *prudential necessity*. To be a consistent Benthamite in the real world—with all its epistemic limits and risks of trauma—one must adopt the rules of bodily sovereignty as if they were absolute, even if one believes they are ultimately grounded in pleasure and pain.

  Bentham is indeed a patron saint of sexual liberalism, but he is a dangerous one if cited without the caveat that his support for liberty is contingent on its utility, not inherent in human dignity. That contingency is what makes his unpublished manuscripts so radical: he was willing to defend "irregularities" not because they were "natural rights," but because the math of suffering demanded it.
