      *   *Astronomy:* "I don't really believe in astronomy, except as a complicated description of part of the course of human and possibly animal sensation." -> This is crucial. It hints at Idealism or Pragmatism. Science describes *experiences*, not mind-independent reality that overrides human value.
      *   *Time:* "In time the world will cool and everything will die... present value at compound interest is almost nothing." -> Future heat death doesn't negate present value.
      *   *Conclusion:* "Nor is the present less valuable because the future is blank."

