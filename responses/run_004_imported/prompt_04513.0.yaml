      *   *Public Action:* The published topline number.
      *   *Herding:* Adjusting the topline to match the average (ignoring the private signal).
      *   *Consensus:* The apparent agreement among pollsters.
      *   *Implication:* The consensus isn't $N$ independent samples; it's effectively $K$ samples (where $K \ll N$).

  4.  **Identify Key Implications for the Journalist:**
      *   **Illusion of Precision:** The confidence intervals are too narrow because the samples aren't independent.
      *   **Information Loss:** Valuable data (the raw deviations) is being suppressed.
      *   **Fragility:** The consensus can flip rapidly if a credible actor breaks the cascade.
      *   **Late-Campaign Specifics:** Herding is worse late in the cycle because the "public history" (previous polls) is longer and heavier.
      *   **Methodological Opacity:** Weighting and adjustment methods hide the herding.

  5.  **Drafting the Response (Iterative Process):**

