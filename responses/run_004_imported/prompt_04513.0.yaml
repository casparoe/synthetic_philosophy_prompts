      *   *Mechanism:* At a certain point, the weight of public history outweighs the private signal. It becomes "rational" to ignore your own data and follow the crowd.
      *   *Result:* An "information cascade." Once started, new information (private signals) is *not* incorporated into the public record.
      *   *Fragility:* Because the cascade is based on limited early information, a small shock (a high-precision signal or a public revelation) can shatter it.

  3.  **Map Theory to Polling Context:**
