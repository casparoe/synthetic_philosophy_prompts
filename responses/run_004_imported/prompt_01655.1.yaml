prompt: |-
  Pascal's mugging presents a puzzle: it appears to demonstrate that expected utility theory endorses paying a mugger who threatens distant suffering. However, some philosophers argue this is not a theoretical defect in expected utility theory itself, but rather shows that rational agents must impose constraints on credences or utility assignments. Do you think Pascal's mugging reveals a genuine flaw in expected utility theory, or is the lesson instead that the theory requires reasonable constraints on rational credences and payoffs? Write an essay that articulates and defends your position on this question.
