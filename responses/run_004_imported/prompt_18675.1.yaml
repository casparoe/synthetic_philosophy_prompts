      *   *Is the "Derived Intentionality" point fair?* Yes, Searle and others argue this. Teleosemantics tries to bypass it, but AI complicates it because the "environment" includes human designers.
      *   *Mention specific philosophers?* Maybe Dennett (who likes this analogy) vs. Searle (who hates it) or Millikan herself (who has commented on AI). *Self-correction: Keep it focused on the theory first, names second.*

