answer: |-
  **SCENE START**

  **ROME. WINTER 1615. A PRIVATE CHAMBER IN THE JESUIT COLLEGE.**

  **GALILEO GALILEI**
  Your Eminence, we begin from a shared premise: God is the author of both Nature and Scripture. Two truths cannot contradict one another. If a demonstration fixes a fact of nature, that fact is as divine as any verse in Genesis. To deny the senses is to deny the God who gave them.

  **CARDINAL ROBERT BELLARMINE**
  God is indeed the author of both. But the languages differ. Scripture speaks to save souls, not to instruct in mathematics. When it says the sun rises, it speaks as a mother speaks to a child, accommodating common speech. But accommodation is not error. It is charity.

  **GALILEO**
  Charity should not bind us to falsehood. Augustine teaches that if a pagan can prove a truth about the earth by reason, and we cling to a literal reading of Scripture against it, we make our faith a laughingstock. Once a matter is demonstrated, the scriptural passage must be reinterpreted. The text yields to the truth, for the truth is God's.

  **BELLARMINE**
  Augustine is a pillar, Signor Galilei. But you skip the condition: *once a matter is demonstrated.* You propose heliocentrism as physical truth. I say it is, at present, a hypothesis. It is one thing to use a model to save the appearances, as eccentrics serve Ptolemy. It is quite another to assert the earth moves as a matter of fact.

  **GALILEO**
  Is it merely hypothesis when I see the phases of Venus? When I count four stars dancing around Jupiter? These are not calculations. They are sights. The Medicean moons prove not all centers orbit the earth. The phases prove Venus orbits the sun.

  **BELLARMINE**
  They prove the Ptolemaic arrangement is flawed. They do not prove Copernicus true. Tycho Brahe saves those same appearances with a moving sun and a stationary earth. Your tides argument—you claim the sloshing of the sea proves the earth's motion. But is this a strict demonstration? Or is it another hypothesis that fits the data?

  **GALILEO**
  When every other explanation fails, what remains is necessity. I do not deal in maybes.

  **BELLARMINE**
  Prudence requires we deal in certainties when Scripture is at stake. The Council of Trent forbids interpreting Scripture contrary to the unanimous consent of the Fathers. And on this point, the Fathers are unanimous. Chrysostom, Augustine, Aquinas—they all read Joshua as commanding the sun to stand still, implying the sun moves and the earth rests.

  **GALILEO**
  With reverence for the Fathers, they were not natural philosophers. They spoke on matters of faith and morals. Did they define the nature of the Trinity? Yes. Did they define the mechanics of the spheres? No. To bind faith to their incidental views on physics is to build a house on sand. Cardinal Baronius said it best: the Holy Spirit's business is to teach us how to go to heaven, not how heaven goes.

  **BELLARMINE**
  Barius speaks wisely. But who decides when a physical claim is fixed? If we reinterpret Joshua today based on your telescopes, and tomorrow a new instrument disproves Copernicus, we have made Scripture mutable. We stake its credibility on the shifting sands of human theory. Is that not the greater risk?

  **GALILEO**
  The greater risk is insisting the sun orbits the earth when future generations will see plainly it does not. You fear for Scripture's credibility if it adapts to proof. I fear for it if it resists proof. Nature does not change. If the earth moves, it moves. To say otherwise is to ask the Church to defend a lie.

  **BELLARMINE**
  I ask the Church to defend its authority to define truth. You argue that sense experience trumps tradition. I argue that without tradition, sense experience is interpreted by every individual according to their own light. You say the Fathers erred on physics. I say their consensus constitutes a boundary we cannot cross without genuine necessity. And I do not grant you necessity.

  **GALILEO**
  Because you demand a demonstration that excludes all other possibility. But nature rarely offers such geometry. Must we wait for a proof that God himself has not deigned to make obvious? If the evidence compels the mind, is that not God's voice as much as any council decree?

  **BELLARMINE**
  God's voice is also in the Church entrusted to keep the deposit of faith. You ask us to treat the unanimous reading of holy men as incidental. I ask you to treat your hypothesis as what it is: a tool for calculation, not a dogma of nature. Write as a mathematician. Do not preach as a theologian.

  **GALILEO**
  I cannot separate the two. To say the earth moves is not theology, but it impacts how we read the book of God's creation. If I know a thing is true, I cannot pretend it is merely useful. That would be a lie.

  **BELLARMINE**
  And if you assert it as true without strict demonstration, and you are wrong, you force the Church to choose between you and the Fathers. You force a schism over a planet.

  **GALILEO**
  I force a choice between truth and habit. You speak of prudence. I speak of conscience. If Scripture is used to silence the evidence of the senses, men will eventually stop believing Scripture.

  **BELLARMINE**
  And if Scripture is reinterpreted every time a new hypothesis saves the appearances better than the old, men will stop believing Scripture has any stable meaning at all.

  *(A pause. The fire crackles.)*

  **GALILEO**
  So we are not arguing about Venus. Or Joshua.

  **BELLARMINE**
  No. We are arguing about who holds the keys to truth when the book of Nature and the book of Scripture seem to speak different tongues.

  **GALILEO**
  I say they cannot truly differ. Therefore, the interpretation must bend to the demonstration.

  **BELLARMINE**
  I say the interpretation belongs to the Church, and demonstration requires a certainty you have not yet provided.

  **GALILEO**
  Then I must continue to look through the glass, Your Eminence.

  **BELLARMINE**
  And I must continue to guard the faith, Signor Galilei.

  **SCENE END**
