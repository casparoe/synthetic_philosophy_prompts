  7.  **Final Polish:** Check the physics/philosophy accuracy.
      *   *Mach in GR:* GR allows vacuum solutions (no matter, still spacetime). This kills strict Machism. Daniel should hit this hard.
      *   *Hole Argument:* Diffeomorphism invariance. If points have primitive identity, moving the metric field creates a distinct physical state that is empirically indistinguishable. This implies indeterminism. Ilse should hit this hard.
