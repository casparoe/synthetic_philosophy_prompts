      *   *Check:* Is Ilse getting hammered on Mach? *Fix:* Make sure she distinguishes between "Mach's Principle" (specific formulation) and "Relationism" (general ontology). She can sacrifice Mach to save Relationism.
      *   *Check:* Is Daniel getting hammered on the Hole Argument? *Fix:* Let him use the standard "sophisticated substantivalist" defense (isomorphism classes), but have Ilse question if that buys him anything real.
      *   *Check:* Is the pacing right? *Fix:* Ensure they interrupt each other or finish thoughts. It shouldn't be A-B-A-B perfectly.

  6.  **Writing - Focusing on Specific Lines:**
      *   *Daniel:* "The metric isn't just a scorecard, Ilse. It's the player."
