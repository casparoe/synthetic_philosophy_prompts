      *   *Why the resistance?* Economics already has tools for risk (utility functions). Ergodicity Economics argues these are ad-hoc fixes, whereas non-ergodicity is a structural property of the process. Economists argue utility functions are flexible enough. Also, the "refutation" claim is strong; most economists see it as a reinterpretation or a specific case of existing theory.

  3.  **Structure the Response:**
