      *   *Is the claim about "refuting" vNM accurate?* This is the contentious part. vNM utility theory allows for risk aversion. A logarithmic utility function *yields* Kelly betting. So, standard theory *can* explain the behavior, but Ergodicity Economics argues the *reasoning* is different (time averages vs. ensemble averages).
