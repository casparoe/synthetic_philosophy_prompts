      *   **Address the "Refutation" Claim:** This is the crux.
          *   *Standard Econ View:* We already handle this with Concave Utility Functions (e.g., Log Utility). If $U(w) = \ln(w)$, maximizing expected utility equals maximizing geometric growth.
          *   *Ergodicity View:* Utility functions are psychological fudge factors. The problem is physical/mathematical (non-ergodicity), not psychological.
          *   *Verdict:* It's not a mathematical refutation of vNM (vNM is consistent with Kelly), but it is a critique of the *interpretation* and *necessity* of utility functions.
      *   **Why hasn't it taken over? (The Sociology of Econ):**
          *   *Equifinality:* Standard econ gets the same answer (Kelly) via Log Utility. So why change the foundation?
