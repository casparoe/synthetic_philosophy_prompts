prompt: |-
  A close friend of mine has a three-year-old son and posts about him regularly on social media — potty-training struggles, tantrums, and, most recently, a video of a meltdown at a birthday party that ended up circulating well beyond her own followers. When I raised the issue, she said there is nothing wrong with any of it: he is far too young to be embarrassed, to object, or to have any view on the matter, and in any case she plans to delete everything long before he is old enough to go looking for it himself. I don't have children of my own, so I've hesitated to press the point, but her reasoning doesn't sit right with me. Is she doing something wrong here, and if so, to whom — given that, on her own account, no one who could ever be embarrassed by it will actually encounter it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Situation:** A friend posts detailed/embarrassing content about her 3-year-old son on social media (potty training, tantrums, meltdown video).
      *   **Conflict:** The user raised concerns; the friend dismissed them (child is too young to care, content will be deleted before he's old enough to see it).
      *   **User's Position:** Feels something is wrong but hesitates because they don't have children.
      *   **Core Question:** Is she doing something wrong? If so, to whom? (Given her argument that no one will be embarrassed because the child won't see it).

  2.  **Initial Assessment & Ethical Framework:**
      *   This is a classic "sharenting" dilemma.
      *   The friend's argument relies on *consent* and *future impact*.
      *   The user's intuition aligns with emerging ethical and legal discussions around digital footprints and child privacy.
      *   I need to validate the user's concern without being overly judgmental of the friend (who likely means well), while providing a nuanced analysis of *why* the friend's reasoning might be flawed.

  3.  **Deconstruct the Friend's Arguments:**
      *   *Argument 1: "He is too young to be embarrassed/object."*
