prompt: |-
  so in my democratic theory seminar we've been stuck on this 'boundary problem' thing for like two weeks now — basically, before any group can even hold a legitimate vote on anything, someone already had to decide who counts as part of the demos, and you can't make that decision democratically without it being circular (the demos deciding who the demos even is). can you write me an essay that actually engages with this instead of just gesturing at it: weigh goodin's all-affected-interests principle against the all-subjected-to-law view (the kind of move abizadeh makes re: border coercion), and deal with the objection that both of them technically end up enfranchising tourists and small children, which is obviously not what anyone intends. dont hedge and just conclude "both have their merits" -- actually defend one specific answer for who should belong to the demos (or at least which principle gets closest) and justify it properly.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Analyze the Request:**
      *   **Topic:** The "Boundary Problem" in democratic theory (who constitutes the *demos*?).
      *   **Key Conflict:** Robert Goodin's "All-Affected Interests" (AAI) principle vs. Arash Abizadeh's "All-Subjected to Coercion/Law" (ASC) principle.
      *   **Specific Objection to Address:** Both principles seem to over-include (e.g., tourists, small children), which contradicts intuitive democratic practice.
      *   **Constraint:** Do not hedge. Do not conclude "both have merits." Defend one specific answer/principle as superior (or closest to the truth) and justify it properly.
      *   **Tone:** Academic but engaging, suitable for a seminar context (demonstrates deep engagement, not just surface-level summary).

  2.  **Deconstruct the Arguments:**

      *   **The Boundary Problem:** Whose decision is it to decide who decides? If the *demos* decides its own boundaries, it's circular. If an external authority decides, it's undemocratic. This is the starting point.
      *   **Goodin (AAI):** Everyone affected by a decision should have a say.
          *   *Strengths:* Captures the moral intuition of democracy (protecting interests).
          *   *Weaknesses:* "Affected" is too vague. Almost everyone is affected by almost everything (butterfly effect). Leads to a "global demos" for almost every issue. Includes tourists, children, future generations.
      *   **Abizadeh (ASC):** Everyone subject to coercive law should have a say.
          *   *Strengths:* Ties democracy to legitimacy of coercion. Clearer boundary (jurisdiction). Addresses the border control paradox (you can't unilaterally close borders without the say of those excluded).
          *   *Weaknesses:* Still includes tourists (subject to local law while visiting) and children (subject to law).
      *   **The "Tourist/Child" Objection:** If AAI or ASC is true, why don't tourists vote in local elections? Why do children not vote?
          *   *Standard Reply:* Competence/Capacity. But this risks excluding marginalized groups historically.
          *   *Better Reply:* Distinguish between *membership* in the demos and *exercise* of the franchise. Or refine the principle itself.

  3.  **Choose a Side:**
      *   *Option A: Defend Goodin (AAI).* Hard to defend against the "too broad" critique without watering it down to meaninglessness.
      *   *Option B: Defend Abizadeh (ASC).* Stronger theoretical grounding in political obligation and legitimacy. The coercion argument is robust. The tourist/child objection is manageable through a distinction between *subjection* and *agency*.
      *   *Decision:* I will defend a refined version of the **All-Subjected Principle (ASC)**, specifically leaning into Abizadeh's coercion-based argument but tightening it to address the over-inclusion objection. It offers a more stable institutional basis than the fluid "interests" of Goodin.

  4.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: The circularity of the boundary problem (Whose decision is it to decide?).
          *   Stakes: Without solving this, democracy is just mob rule within arbitrary lines.
          *   Thesis: While Goodin's All-Affected Interests principle captures a moral ideal, Arash Abizadeh's All-Subjected to Coercion principle provides the only viable institutional solution. I will argue that ASC, when properly understood as a claim about *political agency* rather than mere *impact*, successfully navigates the boundary problem and handles the tourist/child objection better than AAI.

      *   **Section 1: The Trap of All-Affected Interests (Goodin):**
          *   Explain AAI.
          *   Critique: The "Butterfly Effect." If I'm affected, I vote. But *everyone* is affected by climate policy, trade, etc.
          *   Result: The *demos* becomes global and issue-specific. This destroys the stability of a political community. You can't have a different electorate for every bill.
          *   The Tourist/Child issue: Tourists are affected (by traffic laws, safety). Children are affected (by school policy). AAI has no internal mechanism to exclude them without ad-hoc criteria.

      *   **Section 2: The Case for All-Subjected to Coercion (Abizadeh):**
          *   Explain ASC. Democracy legitimizes coercion. If you are coerced, you need a voice.
          *   Why it's better: It focuses on the *state's power*, not the *causal chain of events*.
          *   Addressing the Border Paradox: Abizadeh's key move. You can't democratically close borders if those outside have no say, because border control *is* coercion over them.
          *   Stability: Jurisdiction is clearer than "interests."

      *   **Section 3: Handling the Objection (Tourists and Children):**
          *   This is the crux. If ASC includes tourists (who are subject to local law), why no vote?
          *   *Argument:* Distinguish between *subjection to law* and *membership in the coercive order*.
          *   Tourists: They are subject to law *transiently*. They retain the protection and voice of their *home* democracy. They are not enmeshed in the *ongoing* scheme of cooperation.
          *   Children: This is harder. But democracy requires *agency*. Subjection is necessary, but not sufficient. Capacity is a secondary filter. However, the *principle* of inclusion remains. (Or, argue that children *are* part of the demos but exercise rights via guardians, though that's messy).
          *   *Better move:* Focus on the *systemic* nature of coercion. Tourists are subject to specific laws, but not the *system* of coercive enforcement in the same way residents are (deportation vs. arrest, tax obligations, etc.).
          *   *Refinement:* Let's argue that ASC defines the *pool*, but practical agency defines the *franchise*. But the *boundary* of the community is set by ASC. The tourist objection fails because tourists are not subject to the *full* coercive apparatus (e.g., conscription, long-term taxation, deportation risks are different). Actually, Abizadeh argues tourists *should* have some say, but maybe not full citizenship.
          *   *Pivot:* I need to be decisive. I will argue that the tourist objection actually reveals a flaw in our *practice*, not the *principle*. But for the sake of a workable theory, we must distinguish between *temporary subjection* and *structural subjection*. Residents are structurally subjected; tourists are contingently subjected. ASC applies to structural subjection.

      *   **Conclusion:**
          *   Reiterate thesis.
          *   Goodin is morally attractive but institutionally impossible.
          *   Abizadeh provides the only non-circular way to bound the state.
          *   Final punch: Democracy isn't just about interests; it's about justifying force. Therefore, the demos must be those bound by that force.

  5.  **Review and Refine:**
      *   *Check constraints:* Did I hedge? No. Did I address tourists/children? Yes. Did I compare Goodin and Abizadeh? Yes.
      *   *Tone Check:* Is it seminar-ready? Needs to sound rigorous. Use terms like "circularity," "normative foundation," "jurisdictional scope."
      *   *Self-Correction on Children:* The prompt specifically mentions children as an objection ("obviously not what anyone intends"). I need to make sure I don't just say "kids should vote." I need to explain why ASC *can* exclude them without collapsing.
      *   *Solution:* Competence/Agency is a separate criterion from Boundary. The Boundary Problem asks *who is in the club*. The Franchise Problem asks *who gets to pull the lever*. ASC solves the Boundary. Competence solves the Franchise. Goodin fails at the Boundary because "interests" are infinite.

  6.  **Final Polish:** (Writing the essay based on these thoughts.) *Ensure the distinction between "affected" and "subjected" is sharp.* *Ensure the tourist/child objection is treated as a serious challenge, not a strawman.*

  *(Self-Correction during drafting)*: I need to be careful with Abizadeh. He actually argues that border control *requires* a global demos or open borders because those outside are coerced. I should represent this accurately but focus on the domestic implication for the seminar essay context. I will frame ASC as the superior principle for defining the *state's* legitimate electorate, acknowledging its radical implications for borders.

  Let's sharpen the "Tourist" rebuttal. Tourists are subject to criminal law, yes. But they are not subject to the *political* coercion in the same way (taxation without representation is the key). They don't pay income tax usually. They aren't subject to the *cumulative* weight of the legal order. I will use the "comprehensive subjection" angle.

  Let's sharpen the "Child" rebuttal. Children are subjects. But democracy presupposes a capacity for judgment. This isn't an exclusion from the *demos* morally, but a trusteeship arrangement. Or, simpler: The boundary problem is about *political membership*. Children are members (citizens), just non-voting members. The *demos* includes them, but the *electorate* is a subset. This solves the "circularity" without excluding them from moral consideration.

  Okay, ready to write.
answer: |-
  **Title:** The Coercive Circle: Why the All-Subjected Principle Solves the Boundary Problem

  The "boundary problem" is the original sin of democratic theory. As Robert Dahl famously noted, the democratic process presupposes a *demos*, yet the composition of that *demos* cannot itself be decided democratically without circularity. If the people decide who the people are, the decision is already biased by the initial composition. If an external authority decides, the process is undemocratic. For two weeks, your seminar has likely circled this drain, weighing Robert Goodin's "All-Affected Interests" (AAI) principle against Arash Abizadeh's "All-Subjected to Coercion" (ASC) principle. The temptation is to retreat into pluralism, suggesting both capture different truths. This is a mistake. Goodin's AAI is morally intuitive but institutionally incoherent, while Abizadeh's ASC, though radical, provides the only non-circular, normative foundation for a bounded political community. This essay argues that the All-Subjected principle is superior because it anchors democracy in the justification of force rather than the measurement of impact, and that the standard objections regarding tourists and children dissolve when one distinguishes between *structural subjection* and *temporary compliance*.

  To understand why Goodin fails, we must look at the scope of "affectedness." Goodin argues that anyone whose interests are impacted by a decision should have a say in making it. This captures the protective function of democracy: if a decision harms you, you should have a veto or a voice. However, as a boundary-setting mechanism, AAI is catastrophic. In a globalized world, almost every political decision affects almost everyone. A zoning law in Toronto affects housing markets in Vancouver; carbon emissions in the US affect flood risks in Bangladesh. If we strictly follow AAI, the *demos* for any given issue becomes potentially global. This leads to what Fred Whelan called the "fluid demos" problem: if the electorate changes for every issue based on who is affected, there is no stable political community to administer the votes. You cannot have a democracy without a stable *demos*, and AAI dissolves the *demos* into a global web of causal chains.

  Furthermore, AAI cannot internally resolve the tourist and child objections without resorting to ad-hoc exclusions. A tourist driving through a town is "affected" by local traffic laws and speed limits just as much as a resident. A child is profoundly "affected" by school funding and environmental policy. If the principle is strictly "affected interests," there is no theoretical reason within AAI to exclude them. Goodin tries to patch this by suggesting we look at "likely" effects, but this reintroduces the circularity: who decides which effects are likely? The existing *demos*. Thus, AAI collapses back into the boundary problem it was meant to solve.

  Abizadeh's All-Subjected principle avoids this trap by shifting the normative ground from *interests* to *coercion*. Abizadeh argues that democratic legitimacy is required specifically to justify coercive force. Laws are not merely suggestions; they are backed by the threat of state violence. Therefore, the right to a vote is not about protecting interests per se, but about having agency over the coercive apparatus that binds you. This creates a sharper boundary. You are either subject to the state's coercive jurisdiction or you are not.

  Critics, including your seminar peers, often pounce on ASC with the tourist and child objection. If subjection to law is the criterion, then a tourist visiting for a week is subject to local criminal and civil law, and children are subject to compulsory education and parental laws enforced by the state. Therefore, ASC seemingly demands enfranchisement for both, which seems absurd.

  This objection, however, relies on a superficial reading of "subjection." It conflates *compliance with local norms* with *membership in a coercive order*. The coercion that demands democratic justification is not the momentary application of a rule, but the ongoing, structural subjection to a system of enforcement.

  Consider the tourist. A tourist is indeed subject to traffic laws, but they are not subject to the *comprehensive* coercive order. They do not pay income tax, they are not subject to conscription, they cannot be deported (they leave voluntarily), and they retain the political protection of their home state. Their subjection is transient and partial. To claim they need a vote in the host country ignores that they are already members of a *demos* elsewhere that protects their interests. The ASC principle, properly refined, demands enfranchisement for those subject to the *cumulative* coercive structure of the state, not its incidental application. The resident is enmeshed in the web of coercion (tax, police, courts, regulation) in a way the tourist is not. Excluding the tourist is not a violation of ASC; it is a recognition that their subjection is derivative, not structural.

  The case of children is more difficult, but it reveals a distinction your seminar may be missing: the difference between the *demos* (the community of members) and the *electorate* (those who cast ballots). ASC correctly identifies that children are part of the *demos*; they are subjects of the law and deserve its protection. However, democracy presupposes a capacity for agency—the ability to deliberate and authorize coercion. Excluding children from the *franchise* is not a denial of their subjection, but a recognition of their current incapacity to exercise political agency. This is not circular, because the boundary of the *demos* (all subjects, including children) is set by ASC, while the mechanism of voting is a procedural tool for competent agents within that group. We do not say children aren't subject to the law; we say they require trusteeship until they can exercise the agency that democracy requires. Goodin's AAI struggles here because "interests" do not require agency (a tree has interests, a child has interests), whereas "coercion" implies a relationship between agents. ASC allows us to say children are *in* the community of justice (the demos) even if they don't hold the ballot, whereas AAI blurs the line between having an interest and having a political claim.

  Moreover, Abizadeh's ASC solves the boundary problem where Goodin cannot because it addresses the state's primary function. The state is a monopoly on violence. The only non-circular way to legitimize that monopoly is to require the consent of those over whom the monopoly is exercised. Goodin's focus on interests makes the state a service provider; Abizadeh's focus on coercion makes the state a legitimate authority. A service provider's customers (the affected) can be infinite and fluid. An authority's subjects (the coerced) are bounded by jurisdiction.

  There is a radical implication here that Abizadeh embraces and which strengthens his case: border control. If the *demos* is defined by those subject to coercion, then unilateral border closure is illegitimate because it coerces those outside the border (by excluding them) without their say. While this sounds extreme, it is theoretically consistent. It forces us to admit that current borders are often arbitrary artifacts of history, not democratic boundaries. Goodin's AAI leads to a global demos too quickly to be useful; Abizadeh's ASC leads to a global demos only where coercion is global (i.e., borders). This makes ASC a more precise tool for diagnosing democratic deficits.

  In conclusion, the boundary problem cannot be solved by asking "who has a stake?" because stakes are infinite and subjective. It must be solved by asking "who is bound?" Goodin's All-Affected Interests principle fails because it offers no way to bound the community without arbitrary cutoffs, leaving it vulnerable to the tourist and child objections it cannot answer internally. Abizadeh's All-Subjected principle succeeds because it ties democratic membership to the specific moral problem democracy exists to solve: the justification of coercive power. By distinguishing between structural subjection (residents) and temporary compliance (tourists), and between membership in the *demos* (children included) and the exercise of the franchise (competence required), ASC provides a robust, non-circular foundation. Democracy is not about aggregating interests; it is about authorizing force. Therefore, the *demos* must consist of those over whom that force is sovereignly exercised. Anything else is merely administration, not self-rule.
