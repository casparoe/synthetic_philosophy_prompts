      *   *Check:* Are they equally sharp? *Adjustment:* Make sure Elena doesn't strawman Marcus's "triviality" point. She needs to acknowledge the "behaviorist" critique properly. Make sure Marcus acknowledges the "selection pressure" argument.

  5.  **Final Polish:** (Self-Correction during drafting)
