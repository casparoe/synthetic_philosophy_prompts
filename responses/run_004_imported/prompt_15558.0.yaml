answer: |-
  This is a classic and sophisticated worry to encounter at the dissertation stage, and it speaks well of your philosophical instincts that you spotted the tension immediately. The short answer is: **No, Hirshleifer's result does not prove Good's theorem false.** However, your friend is correct that Hirshleifer identifies a crucial boundary condition for the *philosophical moral* you wish to draw from Good.

  Good's theorem remains mathematically valid within its own axiomatic framework, but Hirshleifer demonstrates that the framework does not cover strategic or general equilibrium contexts where the *availability* of acts depends on the information state. You do not need to drop your opening move, but you do need to qualify the scope of the "Principle of Total Evidence" to avoid overgeneralization.

  Here is a breakdown of why the two results do not contradict, where the divergence lies, and how to handle this in your dissertation.

  ### 1. The Technical Divergence: Fixed vs. Endogenous Decision Problems

  Good's theorem (building on Blackwell 1951/1953 and Savage 1954) is a result in **individual decision theory**. Its proof relies on a specific structural assumption that Hirshleifer's model violates.

  **Good's Assumption (The Fixed Action Set):**
  Good assumes a single agent facing a fixed set of acts $A$ and a fixed utility function $U(a, s)$ mapping acts and states to outcomes. The experiment (signal) changes the agent's probability distribution over states $P(s)$, but it does not change the set of available acts or the payoff structure itself.
  *   *Mathematically:* $\max_{a} \sum_s P(s|e) U(a,s) \ge \max_{a} \sum_s P(s) U(a,s)$.
  *   Because the $\max$ operator is convex, the expectation of the maximum (posterior) is always greater than or equal to the maximum of the expectation (prior).

  **Hirshleifer's Mechanism (Endogenous Payoffs):**
  In Hirshleifer's insurance model, the "acts" available to the agent (specifically, trading claims for risk-sharing) are not fixed; they are determined by a market equilibrium which is itself sensitive to the information structure.
  *   **Under Ignorance:** Uncertainty exists at the time of trading. Counterparties are willing to trade insurance. The act "buy insurance" is available and has positive expected utility.
  *   **Under Public Information:** Uncertainty is resolved *before* trading. Counterparties know the state. No one will sell insurance against a known event. The act "buy insurance" is **no longer available** (or yields zero surplus).
  *   **The Violation:** Hirshleifer's agents are worse off not because they processed the evidence incorrectly, but because the evidence **destroyed the opportunity to perform the utility-maximizing act** that was available under ignorance.

  In Good's framework, information never removes an act from the menu. In Hirshleifer's framework, information can remove acts from the menu by altering the strategic environment (the market). Therefore, Hirshleifer is not a counterexample to Good's theorem; he is a counterexample to the assumption that decision problems are insulated from the information structure.

  ### 2. The Literature on the Value of Information

  The economics literature has extensively mapped this terrain, and citing it will strengthen your chapter by showing you understand the limits of the Bayesian framework.

  The definitive reconciliation of these results is found in **Marshall, Green, and Stokey (1985)**, *"The Value of Information: Two Examples."* They explicitly analyze why Good's theorem seems to fail in general equilibrium settings. They distinguish between:
  1.  **Individual Value of Information:** Where the decision problem is exogenous (Good's domain). Here, information is always weakly valuable.
  2.  **Social/Equilibrium Value of Information:** Where the decision problem is endogenous to the information held by all agents (Hirshleifer's domain). Here, information can be harmful.

  Another key reference is **John Ledyard (1986)**, *"The Value of Information in Markets with Asymmetric Information,"* which discusses how information affects price formation and risk sharing.

  In philosophy, **Brian Skyrms** has written extensively on the interaction between epistemology and game theory. While he defends Bayesianism, he acknowledges that in strategic contexts (like the Prisoner's Dilemma or signaling games), more information can lead to equilibria that are Pareto-inferior to those reached under ignorance.

  ### 3. Advice for Your Dissertation

  You should not drop Good's theorem, as it remains the cornerstone of formal epistemology regarding evidence. However, you should refine the philosophical claim you attach to it.

  **Current Claim (Too Strong):**
  "Good's theorem proves rational agents should *always* want more evidence before acting."

  **Revised Claim (Robust):**
  "Good's theorem proves that for an individual agent facing a **stable decision problem**, acquiring cost-free evidence is never instrumentally irrational. However, as Hirshleifer (1971) and subsequent literature show, this guarantee does not extend to **strategic or equilibrium contexts** where the acquisition of information alters the feasible set of actions available to the agent or others."

  **How to frame the chapter opening:**
  1.  **State Good's Result:** Present it as the standard Bayesian justification for the Principle of Total Evidence.
  2.  **Acknowledge the Boundary:** Add a footnote or a paragraph acknowledging that this result holds for "decision problems exogenous to the information structure."
  3.  **Delimit Your Scope:** Explicitly state that your dissertation focuses on *individual epistemic rationality* or *non-strategic inquiry*, rather than *social epistemology* or *market design*.
      *   *Example phrasing:* "While Hirshleifer (1971) demonstrates that public information can degrade welfare in risk-sharing markets by collapsing the space of feasible trades, such cases involve a shift in the decision problem itself rather than a failure of conditionalization. In what follows, I restrict my analysis to contexts where the set of available cognitive and physical acts remains fixed regardless of the evidence acquired."

  ### 4. Why This Makes Your Dissertation Stronger

  Addressing this objection demonstrates to your committee that:
  1.  You are aware of the interdisciplinary literature (economics/game theory).
  2.  You understand the axiomatic underpinnings of Good's theorem (specifically the fixed action set).
  3.  You are precise about the scope of your philosophical claims.

  If you ignore Hirshleifer, a committee member from a decision theory or social science background might raise this exact objection during your defense. By preemptively qualifying your claim, you turn a potential vulnerability into a demonstration of rigor.

  ### Summary
  *   **Is Good's Theorem false?** No.
  *   **Is Hirshleifer a counterexample?** No, it's a different model (General Equilibrium vs. Individual Decision Theory).
  *   **Does it affect your chapter?** Yes, it requires you to qualify the *scope* of the Principle of Total Evidence. It applies to individual inquiry in stable environments, not necessarily to strategic interaction or market environments where information changes the rules of the game.
  *   **Action Item:** Cite Hirshleifer (1971) and Marshall, Green, & Stokey (1985) to delimit the scope of your argument. This protects you from objections while preserving the core of your Bayesian defense of intellectual curiosity.
