answer: |-
  You are not being inconsistent; you have stumbled directly into one of the most enduring and debated problems in philosophical aesthetics: **the problem of aesthetic testimony.**

  Your intuition that there is a genuine asymmetry between passing along a factual claim (35mm vs. digital) and an evaluative judgment ("the script drags") is shared by many philosophers. While the epistemic structure looks identical on paper (Expert $X$ believes $P$; I trust $X$; therefore I believe $P$), the normative stakes differ significantly.

  Here is a breakdown of why that feeling of "subtle dishonesty" arises, framed in terms you can use for your seminar.

  ### 1. The Autonomy of Taste (The Kantian View)
  The strongest argument for the asymmetry comes from Immanuel Kant. In the *Critique of Judgment*, Kant argues that aesthetic judgment is fundamentally **autonomous**.

  *   **Factual Claims:** When your friend says the film was shot on 35mm, she is reporting a mind-independent fact. You can acquire this knowledge through testimony because the property exists regardless of whether you perceive it.
  *   **Aesthetic Claims:** When she says the script drags, she is reporting on a relationship between the object and a subject's experience. For Kant, to judge something as beautiful or successful aesthetically, you must feel the pleasure or dissatisfaction yourself. You cannot outsource the *feeling*.

  If you assert "the script drags" without having felt the dragging, you are claiming a state of mind you do not possess. In this view, aesthetic knowledge isn't just about the *proposition* (that the film is good); it is about the *ground* of that proposition (your own perceptual experience). By skipping the experience, you are bypassing the only thing that actually validates the judgment.

  ### 2. The Norm of Assertion and Implicature
  Even if we set aside Kant, contemporary epistemology offers another explanation for your discomfort: **conversational implicature.**

  When you assert a factual claim like "This was shot on 35mm," the norm of assertion is generally just that you have adequate evidence (your friend's word counts as evidence).

  However, when you assert an aesthetic judgment like "The lead performance holds it together," you are implicitly communicating something more than just the truth of the proposition. You are implying:
  1.  I have seen the film.
  2.  I have processed it emotionally and intellectually.
  3.  This is *my* response to the work.

  When you haven't seen the film, you are violating the **sincerity condition** of the speech act. You aren't necessarily lying about the film's quality (the film might objectively be good), but you are lying about the *source of your conviction*. You are presenting yourself as a witness when you are actually just a messenger. This is why it feels dishonest: you are claiming authorship of a sensibility that isn't yours.

  ### 3. The "Pessimism" vs. "Optimism" Debate
  In your seminar, you will likely encounter these two camps regarding aesthetic testimony:

  *   **Aesthetic Pessimists:** Argue that aesthetic testimony cannot generate knowledge or justified belief. They align with your feeling of dishonesty. They argue that relying on testimony deprives you of the "aesthetic appreciation" which is the whole point of art. To know a film is good without seeing it is to know a hollow fact.
  *   **Aesthetic Optimists:** Argue that there is no structural difference between factual and aesthetic testimony. If your friend is a reliable judge, her word *should* be enough. They would argue your feeling of dishonesty is a social hang-up, not a philosophical necessity.

  However, even many Optimists admit there is a **normative deficit**. Even if you *know* the film is good based on her word, it is often considered inappropriate to *assert* it as your own judgment because you cannot defend it via reasons derived from experience. If a member asks, "Why did the script drag?" and you can't answer from memory, your epistemic fragility is exposed.

  ### 4. Context Matters: Curator vs. Critic
  There is one nuance that might mitigate the dishonesty: your role.
  *   **As a Critic:** You are paid (or expected) to offer your own subjective synthesis. Here, passing off another's judgment is definitely unethical.
  *   **As a Curator/Programmer:** Your role is often to select works that *others* will find valuable. In this context, saying "This is a good film" might be interpreted as "This film meets the standards of our society," rather than "I, personally, was moved."

  However, the phrasing you used ("the script drags in the second act") is phenomenological. It describes an experience. If you haven't had the experience, the claim is infelicitous.

  ### Suggested Resolution
  You aren't being inconsistent; you are correctly sensing that aesthetic judgments carry a **first-person authority** that factual claims do not.

  To resolve the tension without changing your workflow entirely, you might adjust your phrasing to reflect the actual epistemic structure. Instead of:
  > *"The script drags in the second act."* (Implies: I felt it drag.)

  Try:
  > *"The consensus among the programmers is that the second act slows down, but the lead performance compensates."*
  > *"Our programmer notes that while the script drags, the performance holds it together."*

  This preserves the utility of your friend's expertise without violating the norm of assertion. It transforms your statement from a **testimonial assertion** (which feels dishonest) to a **report on testimony** (which is factually true and honest).

  ### For Your Seminar
  This situation is a perfect case study for discussions on:
  *   **Kant's *sensus communis*:** Why we demand agreement but cannot compel it via rules.
  *   **Frank Sibley's "Aesthetic Concepts":** Whether aesthetic terms require direct perception to apply.
  *   **Aaron Meskin or Mary Mothersill:** Contemporary work on whether aesthetic testimony is possible.

  You have identified a real philosophical asymmetry. Factual claims transfer information; aesthetic claims invite shared experience. By relaying the latter without the experience, you are offering an invitation to a party you haven't attended. That is why it feels dishonest.
