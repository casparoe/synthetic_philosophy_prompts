answer: |-
  **Elena:** The distinction holds, Marcus. In the *Sentences*, Aquinas isn't endorsing tyrannicide; he's defining aggression. A usurper lacks the *ratio* of authority. He's a bandit wielding a sword, not a ruler wielding a scepter. Killing him isn't political regicide; it's self-defense against a violent aggressor. *De Regimine* addresses the harder case: the ruler with valid title who abuses power. There, private killing is forbidden. The metaphysics are consistent across both texts.

  **Marcus:** Consistent metaphysics, perhaps, but divergent political prudence. You're treating the *Sentences* as a finished political treatise rather than a theological commentary written when Aquinas was barely twenty-five. In *De Regimine*, written for a king, the priority shifts from logical categorization to social stability. He worries that any license to kill—even against usurpers—invites sedition. Who determines the title is invalid? If a private citizen decides, you invite the very chaos Aquinas seeks to avoid.

  **Elena:** But Aquinas explicitly reserves the right to resist a usurper to the community or a superior power in *De Regimine*. He doesn't retract the *Sentences* point; he contextualizes it. The usurper has no claim to obedience because he lacks jurisdiction. The later text simply emphasizes that removing him shouldn't be a private vendetta. It's not a hardening; it's a procedural clarification. The principle remains: private individuals cannot judge legitimate authority. A usurper, by definition, isn't legitimate authority.

  **Marcus:** That's the sleight of hand. In the *Sentences*, the implication is that the private person *recognizes* the lack of title and acts. In *De Regimine*, Aquinas argues that even against tyranny, we must tolerate much to avoid greater evils—scandal, schism, civil war. He says correction belongs to public authority. But if the tyrant is a usurper, there *is* no public authority currently functioning correctly. By insisting on public process even then, he effectively closes the door the *Sentences* left ajar. The later text swallows the earlier exception.

  **Elena:** You're conflating "public authority" with the incumbent ruler. If a king is a usurper, the public authority resides in the community or the superior who appointed him. Aquinas isn't saying let the usurper rule; he's saying the removal must be orderly. That doesn't contradict the *Sentences*. It just refuses to legitimize assassination as a tool for factional rivals. The distinction between tyranny of title and tyranny of exercise does real work. It prevents us from conflating a criminal aggressor with a corrupt king.

  **Marcus:** Does it? Because in practice, every rebel claims the king is a usurper. Aquinas knows this. In *De Regimine*, he seems to realize that distinguishing title from exercise isn't enough to prevent bloodshed. The later text suggests a reluctance to authorize violence that isn't present in the earlier commentary. The *Sentences* is clean, logical, abstract. *De Regimine* is messy, historical, cautious. I see a development in his thought, not just a clarification. He becomes more Augustinian, less optimistic about private judgment.

  **Elena:** But the metaphysical ground doesn't shift. An unjust law isn't a law; a usurper isn't a ruler. Aquinas can't change that without contradicting his own definition of authority. If you argue he "hardened," you imply he decided truth was less important than order. I think he simply realized order is a precondition for justice. The *Sentences* defines the ideal response to illegitimacy; *De Regimine* manages the risk of implementing it.

  **Marcus:** And if managing the risk means effectively forbidding the response, has the definition changed in all but name? If the community cannot act without a superior, and the superior is complicit, the usurper remains. The *Sentences* offers a way out; *De Regimine* builds a maze. I'm not saying he contradicts himself on the nature of authority, but on the licit response to its absence. The later Aquinas seems less willing to trust anyone but the structure itself.

  **Elena:** He trusts the structure because the structure reflects the divine order. But he never says the usurper acquires rights through time.

  **Marcus:** No, but he implies the community might acquire obligations to endure him. That's a significant shift from "violent aggressor" to "tolerated burden." We might agree on the text, but we disagree on the trajectory.

  **Elena:** Then we agree the tension remains in the application, if not the theory.

  **Marcus:** Precisely. And that's where the politics lives.
