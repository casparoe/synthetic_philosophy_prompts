          *   Normative Expectations: Bicchieri's distinction. It's not just "I expect you to," it's "I expect you to think you should."
          *   Joint Commitment: The creation of a "We."
      *   **The Verdict (The Hard Part):**
          *   Lewis explains *coordination*. Gilbert/Bicchieri explain *normativity*.
          *   Since the prompt asks about *social norms* (specifically the "ought-feeling"), Lewis fails to capture the specific phenomenon of *obligation*.
          *   *Synthesis:* Lewisian conventions are the *substrate*, but social norms are a distinct layer built on top via joint commitment.
