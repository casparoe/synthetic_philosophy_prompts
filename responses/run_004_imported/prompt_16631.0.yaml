      *   **The Core Question:** Does David Lewis's game-theoretic/evolutionary account of convention *fully* explain social norms, rendering the "ought"-feeling (normativity/obligation) as epiphenomenal? OR is there a genuine "normative residue" (joint commitment, normative expectations) that pure equilibrium models cannot capture?
      *   **Constraints:** Essay format. Go through strongest points on both sides. *Must land somewhere* (no fence-sitting). Provide a real verdict and reasoning.
