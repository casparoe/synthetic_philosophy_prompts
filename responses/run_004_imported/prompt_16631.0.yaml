      *   **Brian Skyrms (Evolutionary Game Theory):** Removes rationality and common knowledge. Conventions emerge via replicator dynamics/reinforcement learning. *Normativity:* Even thinner than Lewis. It's just stability.
      *   **Margaret Gilbert (Joint Commitment):** Conventions require a "plural subject." We are *bound* together. Deviation warrants rebuke. *Normativity:* Intrinsic to the structure of the agreement, not just instrumental.
      *   **Cristina Bicchieri (Social Norms):** Distinguishes descriptive norms (everyone does it) from social norms (everyone does it + everyone thinks one *ought* to do it). *Normativity:* Conditional on normative expectations.

  3.  **Evaluate the "MARL/Emergent Comm" Angle:**
      *   In MARL referential games, agents develop signaling systems. This is pure Lewis/Skyrms. There is no "blame." If an agent deviates, reward drops. The "language" stabilizes due to gradient descent/RL updates, not obligation.
