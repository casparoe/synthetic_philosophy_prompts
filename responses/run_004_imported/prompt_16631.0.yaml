answer: |-
  **Title:** The Equilibrium and the Ought: Why Lewis Explains the Pattern but Gilbert Explains the Glue

  **Introduction**

  Your intuition regarding the mapping between David Lewis's *Convention* (1969) and modern multi-agent reinforcement learning (MARL) is not just correct; it is foundational. When you train a population of agents in a referential game via self-play, you are effectively simulating a Lewisian coordination problem solved through evolutionary dynamics à la Brian Skyrms. The agents converge on an arbitrary signaling system (a separating equilibrium) because it maximizes reward, stabilized by the expectation that others will do the same. There is no "truth" to the signal, only utility.

  However, your reading group's pivot to Margaret Gilbert and Cristina Bicchieri highlights the exact friction point where your MARL agents diverge from human societies. The question is whether the "ought"—the feeling of obligation and the entitlement to rebuke—is merely phenomenological frosting on a cake of pure self-interest, or if it is a structural ingredient necessary for the cake to hold together.

  Here is the verdict: **Lewis's account successfully explains the emergence of *regularities*, but it fails to explain the stability of *social norms* under conditions where self-interest diverges from conformity.** The "normative residue" identified by Gilbert and Bicchieri is not an epiphenomenal add-on; it is a functional mechanism that solves second-order coordination problems that pure equilibrium models cannot. Lewis describes the *geometry* of social interaction; Gilbert describes the *physics* that keeps it from collapsing.

  **The Case for Lewis: Parsimony and the Evolutionary Substrate**

  The strongest argument for Lewis (and his evolutionary successor, Skyrms) is parsimony. In your MARL experiments, you do not program agents with a sense of duty. You program them with a loss function. Yet, they develop stable communication protocols. This suggests that the "ought" is derivative.

  Lewis defines a convention as a regularity $R$ in a population $P$ where:
  1.  Everyone conforms to $R$.
  2.  Everyone expects everyone else to conform to $R$.
  3.  Everyone prefers to conform to $R$ *on the condition* that others do (conditional preference).
  4.  There is an alternative regularity $R'$ that could have worked just as well (arbitrariness).

  In your referential game, the "language" that emerges is a Lewisian convention. If Agent A sends signal $S_1$ for object $O_1$, and Agent B interprets $S_1$ as $O_1$, both get reward. If Agent A deviates, reward drops. The "obligation" to send $S_1$ is purely hypothetical: *If* you want reward, *and* you expect the receiver to expect $S_1$, *then* you ought to send $S_1$.

  Skyrms tightens this by removing the requirement for common knowledge and high-level rationality. Using replicator dynamics or simple reinforcement learning, populations drift toward signaling systems simply because successful strategies reproduce (or get upweighted). In this view, the "norm" is just a stable equilibrium. The feeling of obligation is a post-hoc rationalization humans generate to describe a behavioral attractor. From this perspective, positing "joint commitment" is ontologically extravagant. Why posit a "plural subject" when gradient descent explains the convergence?

  **The Case for Gilbert and Bicchieri: The Function of the "Ought"**

  The counter-argument, championed by Margaret Gilbert and Cristina Bicchieri, is that Lewis's model cannot account for the *reactive attitudes* inherent in human norms, specifically the entitlement to rebuke.

  In your MARL setup, if an agent deviates from the established signaling protocol, the other agent simply receives a lower reward and updates its policy. It does not "blame" the deviator. It does not feel that the deviator *wronged* it. In human interaction, however, if you cut in line, I do not just update my prediction that "lines are unstable." I feel you violated a standard, and I feel entitled to chastise you.

  Gilbert argues that this entitlement arises from a **Joint Commitment**. A convention becomes a norm when parties jointly commit to accepting a certain rule as binding. This creates a "plural subject." The obligation is not conditional on immediate payoff (as in Lewis); it is constitutive of the relationship.

  Bicchieri refines this with her distinction between *descriptive expectations* (I think you will do X) and *normative expectations* (I think you think you *should* do X). She argues that social norms exist only when empirical expectations are coupled with normative expectations.

  Why does this matter? Why isn't the "ought" just fluff? Because the "ought" performs causal work that self-interest cannot.

  **The Verdict: The Normative Residue is Load-Bearing**

  Lewis's account fails to explain social norms because it cannot account for **costly enforcement in one-shot or low-monitoring scenarios.**

  In a pure Lewis/Skyrms framework, conformity is maintained because deviation lowers individual payoff. But in complex human societies, deviation often *increases* individual payoff (e.g., tax evasion, free-riding on public goods) while the cost of enforcement is borne by the punisher. If norms were merely Lewisian conventions based on conditional preference, rational agents would never punish deviators when punishment is costly, and anticipating this, agents would deviate. The equilibrium would collapse into defection.

  The "normative residue"—the feeling of obligation and the legitimacy of blame—solves this. When individuals internalize a norm (via Gilbert's joint commitment or Bicchieri's normative expectations), the utility function changes. Violating the norm incurs an internal psychic cost (shame/guilt), and observing a violation incurs a cost (anger/indignation) that motivates punishment even when materially costly.

  Therefore, the "ought" is not a non-load-bearing add-on. It is a **commitment device**.

  1.  **Lewis explains the *origin*:** Your MARL agents show how arbitrary signals can emerge from self-interest. This is the substrate.
  2.  **Gilbert explains the *persistence*:** Human norms persist in environments where self-interest suggests defection because the "joint commitment" alters the payoff structure via internalized sanctions and social rebuke.

  If Lewis were right, human norms would be as fragile as your agents' communication protocols when the reward function shifts or when the "temperature" of exploration increases. But human norms often resist payoff changes (e.g., people follow queueing norms even when they could sneak ahead without getting caught). This resistance indicates a structure beyond conditional preference.

  **Implications for Multi-Agent RL**

  This verdict has direct consequences for your research. If you want your agents to exhibit human-like *social norms* rather than mere *Lewisian conventions*, standard self-play on a fixed reward function is insufficient. You are currently modeling Skyrms's evolutionary signaling, not Gilbert's joint commitment.

  To bridge this gap, your architecture needs a mechanism for **normative expectation** and **costly punishment**.
  *   **Normative Expectation:** Agents need a model not just of *what* others will do, but of *what others think should be done*. This requires higher-order theory of mind or a specific loss term for violating "shared" rules.
  *   **Costly Punishment:** Agents must be able to sacrifice immediate reward to penalize deviators, driven by a mechanism analogous to "indignation" rather than direct utility maximization.

  Recent work in "inequity aversion" or "social preference" modeling in RL touches on this, but true norm emergence likely requires a mechanism for explicit commitment or contract formation between agents, not just implicit coordination.

  **Conclusion**

  David Lewis provided the game-theoretic skeleton of social interaction, and your MARL agents are the flesh on those bones. They demonstrate how arbitrary regularities stabilize through mutual expectation and self-interest. However, Lewis's account is insufficient to explain *social norms* because it cannot account for the stability of cooperation when self-interest dictates defection.

  The "ought"-feeling is not a ghost in the machine; it is the code that rewrites the machine's reward function. Margaret Gilbert and Cristina Bicchieri are correct: there is a normative residue—joint commitment and normative expectations—that is functionally distinct from equilibrium selection. Without it, human society would dissolve into a collection of opportunistic coordinators. Lewis explains why we speak the same language; Gilbert explains why we keep our promises when breaking them would pay better. For a complete model of social intelligence, your agents need both.
