  **Justification:**

  *   **Move 1 (Mira): Score 1.** Mira is instrumentally correct according to standard Causal Decision Theory; the probability of a single vote deciding an election is vanishingly small, making the expected utility negative when costs are included. However, she assumes a narrow definition of "rationality" that excludes expressive benefits or civic duty, which is why the "Paradox of Voting" remains a paradox (people vote despite this math).
  *   **Move 2 (Owen): Score 0.** Owen correctly identifies a collective action problem (if everyone abstains, democracy fails), but his logic commits a fallacy of composition in this context. An individual's reasoning does not causally determine the reasoning of millions of others; therefore, the hypothetical collapse of the system is not a direct consequence of her specific choice, weakening his rebuttal to her individual calculus.
  *   **Move 3 (Mira): Score 2.** This is the strongest logical move. Mira correctly distinguishes between a universal maxim and a causal act. In a large electorate, her decision is causally isolated from others'; thus, the counterfactual "if everyone did this" is irrelevant to the marginal utility of *her* specific ballot.
  *   **Move 4 (Owen): Score 1.** Owen successfully shifts the ground from instrumental decisiveness to fairness and public goods (legitimacy). He challenges Mira's premise that the only "benefit" is changing the winner. However, like Move 1, this still struggles with marginal impact (one vote barely affects legitimacy), making it a strong moral argument but a debatable instrumental one.

  **What Both Are Missing:**
  Both friends are trapped in a binary between **Causal Decision Theory** (Mira) and **Kantian/Rule Utilitarianism** (Owen). They miss **Evidential Decision Theory**, which suggests that if you are the kind of person who votes, others like you likely will too, making your vote evidence of a larger bloc. They also overlook **Expressive Voting**: the immediate psychological utility of affirming one's identity or values, which clears the cost/benefit hurdle regardless of the election outcome. Finally, they treat "rationality" as purely self-interested calculation, ignoring that social norms and internalized duties are often constitutive of rational agency itself.
