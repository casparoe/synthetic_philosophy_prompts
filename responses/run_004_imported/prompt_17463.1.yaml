  I have no formal training in philosophy, but I've spent the past couple of years working through the experimental philosophy literature on my own, and I now run a small monthly discussion group at my local library. Next month's guest is a philosopher who defends Joshua Knobe's own reading of his famous boardroom vignette -- the one where a chairman declares that he doesn't care at all about harming, or helping, the environment, so long as the company turns a profit -- namely, that whether a foreseen side effect counts as "intentional" is genuinely fixed by how morally good or bad we judge it to be, and that this is built into the ordinary concept itself rather than a bias distorting it. Draft eight to ten questions for our Q&A that go beyond having her simply restate the finding. I want one question on the rival "conversational pragmatics" explanation associated with Adams and Steadman, one on the Uttich-and-Lombrozo-style worry that the same asymmetry shows up even when the violated norm isn't moral at all, and one on why the same pattern reappears in judgments of causing, deciding, and wanting -- for each, include a follow-up keyed to the answer she's most likely to give. Close with a question about what pattern of results would actually convince her that she's wrong.
