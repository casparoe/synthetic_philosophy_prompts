answer: |-
  Here are ten questions drafted for your Q&A. They are designed to be accessible to your group while demonstrating a strong grasp of the literature. I have included brief context notes for you (in italics) so you know the theoretical stakes behind each question, and I have clearly marked the required follow-ups.

  ### 1. The Competence/Performance Distinction
  *Context: Critics often argue that the Knobe Effect is a "performance error" (a bug in how we process info) rather than "competence" (a feature of the concept itself).*
  "Many critics suggest that while moral judgments might *influence* our application of the word 'intentional,' they don't actually change the *concept* itself. They argue the core definition remains purely descriptive, and morality is just a bias that distorts our access to it. On your view, is the moral evaluation part of the 'source code' of folk psychology, or is it an add-on module that interacts with the code?"

  ### 2. The Conversational Pragmatics Objection (Adams & Steadman)
  *Context: Adams and Steadman argue that people know the chairman didn't literally intend the harm, but they say "intentional" as a conversational shortcut to express blame (implicature).*
  "Fred Adams and Annie Steadman have argued that participants in these vignettes are speaking loosely. They suggest people know the side effect wasn't literally intended but say it was to communicate blame efficiently. If this were just a pragmatic implicature, we would expect people to admit the literal meaning was different if pressed. But since you defend the constitutive view, how do you rule out the possibility that we are all just being polite liars in the harm condition?"

  **Follow-up (Keyed to her likely answer):**
  *She will likely cite reaction-time studies or neural data showing the judgment is automatic and not a calculated lie.*
  "If the evidence is that the judgment is automatic or neural, couldn't a pragmatic implicature become automated over time? Does finding that the process is fast really prove that the *concept* contains morality, rather than just proving that the *heuristic* for applying the concept is fast?"

  ### 3. The Normative Generalization Worry (Uttich & Lombrozo)
  *Context: Uttich and Lombrozo showed that violating statistical norms (e.g., "most printers do this") can trigger the effect even without morality.*
  "Christian Uttich and Tania Lombrozo found that this asymmetry appears even when the violated norm is purely statistical or conventional, not moral. If violating a statistical norm can make a side effect look 'intentional,' does that suggest the mechanism is actually about *normativity* in general, rather than *morality* specifically? Is 'morality' doing any real work in your explanation, or is it just the most common type of norm we encounter?"

  **Follow-up (Keyed to her likely answer):**
  *She will likely argue that moral norms are a privileged, weightier subset of norms that drive the effect more strongly.*
  "If moral norms are just a heavier weight on the same scale, does that mean if we constructed a scenario where a statistical norm was incredibly salient and the moral stakes were trivial, the statistical norm would override the moral one? Have we seen that reversal in the data?"

  ### 4. Generalization to Other Concepts (Causing, Deciding, Wanting)
  *Context: The effect isn't limited to 'intentional'; it shows up in 'caused,' 'decided,' and 'wanted.'*
  "This effect isn't isolated to intentionality; it replicates for judgments about 'causing,' 'deciding,' and even 'wanting.' Does this suggest that all our folk-psychological concepts are permeated by moral evaluation? Or do you think there is one master 'evaluative switch' in the brain that gets flipped, which then lights up all these different concepts indiscriminately?"

  **Follow-up (Keyed to her likely answer):**
  *She will likely argue for a unified underlying cognitive architecture.*
  "If it is a unified architecture, should we expect children to acquire these moralized judgments for 'cause,' 'intend,' and 'want' at the exact same developmental stage? Or do we see a staggered acquisition that might suggest these concepts are actually learned independently?"

  ### 5. The Asymmetry of the Asymmetry
  *Context: The effect is robust for harm (bad side effects are intentional) but weak or inconsistent for help (good side effects are often unintentional).*
  "The effect is famously robust in the 'harm' condition, but much weaker in the 'help' condition. People readily say the chairman *intentionally* harmed the environment, but hesitate to say he *intentionally* helped it. Why is the concept of intentional action more sensitive to badness than goodness? Is our folk psychology fundamentally pessimistic?"

  ### 6. Direction of Fit
  *Context: Does morality change intentionality, or does intentionality change morality?*
  "We talk about moral judgments shaping our concept of intentionality. But could the arrow point the other way? Is it possible that we judge the action as 'intentional' first based on some descriptive feature, and that classification is what licenses us to blame the chairman? How do you disentangle whether morality is the input or the output?"

  ### 7. Cross-Cultural Stability
  *Context: Some studies (e.g., Machery) suggest the effect varies across cultures (e.g., US vs. East Asia).*
  "Experimental philosophy has placed a heavy emphasis on cross-cultural replication. Some studies suggest the Knobe Effect is weaker or structured differently in non-Western populations. If this effect is built into the *ordinary concept* of intentional action, shouldn't we expect it to be universal across humanity, like color vision? How do you reconcile your view with cultural variation?"

  ### 8. Legal Implications (Mens Rea)
  *Context: The law relies heavily on distinguishing intention from foresight.*
  "Our legal system relies heavily on the distinction between intending a result and merely foreseeing it, particularly regarding *mens rea*. If your view is correct and ordinary people cannot separate morality from intentionality, does that suggest our legal standards are asking jurors to do something cognitively impossible? Should the law change its definitions to match folk psychology, or should folk psychology be trained to match the law?"

  ### 9. Application to Non-Human Agents
  *Context: We are increasingly interacting with AI and algorithms.*
  "As we begin to interact more with AI and algorithms, we face new questions about agency. If an algorithm is programmed to maximize profit and foresees environmental harm, does your view predict that we will increasingly attribute 'intentionality' to the software itself based on the moral outcome? Does the Knobe Effect apply to non-human agents?"

  ### 10. Falsification Conditions
  *Context: A strong theory must be falsifiable.*
  "To close, I want to ask about the limits of the theory. Philosophers sometimes worry that the 'moral constitutivism' view is compatible with almost any result. What specific pattern of experimental results would convince you that you are wrong? Is there a vignette or a data set that would force you to abandon the view that morality is built into the concept itself?"
