prompt: |-
  So my partner's dad has this ritual where before he'll fully "approve" of anyone his kids are seriously dating, he takes them out for drinks one-on-one and pays close attention to how they act once they've loosened up—his reasoning is that you cant really know someone's character from how they behave sober, since everyone's just on their best behavior then. My partner actually thinks this is a smart way to vet people. I think there's something off about judging someone that way, but Im struggling to explain exactly why, since it is kind of true that people act different after a few drinks. Is the dad onto something, or is this actually a bad way to size someone up?
