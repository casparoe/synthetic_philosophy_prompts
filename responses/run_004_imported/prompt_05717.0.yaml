answer: |-
  This is a exceptionally sharp reading of the situation. You have correctly identified a tension that often gets glossed over in introductory philosophy of physics courses: the move from Leibniz's *modal* argument about possible worlds to Earman and Norton's *dynamical* argument about determinism within a single theory.

  As a condensed matter physicist, you are used to effective field theories where the underlying lattice (or lack thereof) dictates the symmetry breaking. Here, the "lattice" is the spacetime manifold itself, and the question is whether it has physical reality independent of the fields defined on it.

  If we could summon Leibniz to a blackboard session on general covariance, here is how I suspect the dialogue would go, based on his commitments in the Leibniz-Clarke correspondence and the *Monadology*.

  ### 1. The Shift vs. The Hole: Global vs. Local
  You are right to hesitate on the "clean lineage." Leibniz's Shift Argument is global and static; the Hole Argument is local and dynamical.

  *   **Leibniz's Shift:** Takes the entire material universe and moves it 5 feet to the left in absolute space. Since all *internal relations* between bodies remain identical, PSR dictates God has no reason to choose one position over the other. Therefore, the positions are not real.
  *   **The Hole Argument:** Takes the metric field and shuffles it relative to the manifold points *inside a local region*, leaving the boundary fixed.

  **Would Leibniz recognize it?**
  Yes, but with a caveat. He would recognize the *logical form*: two mathematical descriptions that differ only in the assignment of properties to bare particulars (spacetime points) without altering the web of relations (the metric intervals, causal structure, matter distribution).

  However, Leibniz might initially be baffled by the **dynamical** nature of the Hole Argument. For Leibniz, space is an "order of coexistences." It is not a container that exists prior to the things in it. In GR, the metric field *is* the spacetime, and it evolves. Leibniz might ask: "If the metric field is the physical reality, why are you treating the manifold points as the 'substance'?"

  Earman and Norton force the substantivalist to treat the manifold points $p \in M$ as the individuals. Leibniz would argue this is a category error. He would likely view the Hole Argument not just as a vindication of his Shift Argument, but as a *reductio ad absurdum* of the very idea that manifold points are individuals. He would say: "The fact that your theory becomes indeterministic when you assume points are individuals proves that points are *not* individuals."

  For Leibniz, indeterminism is a metaphysical failure. If the physics cannot distinguish between configuration $A$ and configuration $B$, then $A$ and $B$ are not distinct possibilities. The "radical indeterminism" Earman and Norton highlight would strike Leibniz not as a physical discovery, but as a signal that the ontological premises (manifold substantivalism) are false.

  ### 2. Leibniz on "Sophisticated Substantivalism"
  This is the crux of your second question. The "sophisticated substantivalist" (often associated with philosophers like Maudlin or Pooley, though they vary) says:
  > "Spacetime points are real, mind-independent individuals. However, we deny *haecceitism*. We accept Leibniz Equivalence: diffeomorphic models represent the same physical state. Thus, we avoid indeterminism while keeping the points."

  **How would Leibniz react?**
  He would likely be unimpressed, viewing this as verbal sleight of hand. Here is why:

  **A. The Principle of Sufficient Reason (PSR)**
  If spacetime points are genuine individuals (substances), they must have a principle of individuation. In classical metaphysics, this is often *haecceity* (this-ness). If I have two points, $p_1$ and $p_2$, what makes $p_1$ distinct from $p_2$?
  *   **The Substantivalist:** They are distinct by their very identity, independent of properties.
  *   **Leibniz:** There is no distinction without a distinguishable difference.

  If the sophisticated substantivalist says, "The points are distinct individuals, but it makes no difference to the physics which point holds which metric value," Leibniz would pounce. He would argue that positing individuals that play no role in the identity conditions of physical states is a violation of PSR. Why posit $p_1$ rather than $p_2$ at a specific location in the web of relations if the answer is "no reason"? For Leibniz, "no reason" means "no distinction."

  **B. Relationalism by Another Name**
  Leibniz would likely argue that once you accept Leibniz Equivalence (that diffeomorphic models are the same physical state), you have effectively evacuated the "substance" from your substantivalism.
  If the identity of the points is entirely irrelevant to the identity of the physical state, then the physical state is constituted entirely by the *relations* (the metric field structure). The points become mere "placeholders" or logical subjects without predicates. In Leibniz's ontology, a substance without predicates is a contradiction.

  He would likely say: "You claim the points are real, but you grant that their individuality never enters into the physical description of the world. You have kept the word 'substance' but discarded the thing. This is relationalism wearing a substantivalist mask."

  ### 3. The One Place Leibniz Might Hesitate
  There is one nuance where Leibniz might find the modern debate stranger than his own.

  In the Shift Argument, the two worlds are **counterfactual**. God *could have* created the universe 5 feet to the left, but didn't, because there's no reason to.
  In the Hole Argument, the two models are presented as **future possibilities** of the *actual* world. The indeterminism is temporal.

  Leibniz is a determinist (of a sort). For him, the complete concept of a substance contains all its future predicates. If GR suggests the future is not fixed by the past *even in principle*, Leibniz might worry that the problem isn't just substantivalism, but the theory itself. However, since he prioritizes metaphysics over physics, he would likely insist that a correct metaphysical reading of GR (i.e., relationalism/Leibniz Equivalence) restores determinism.

  He would also be fascinated by the **active** nature of the diffeomorphism. In his day, space was a static stage. In GR, the "stage" is a dynamic field. He might worry that by making the metric a field, Einstein has reified space too much. If the metric field is a physical object, does it have its own "this-ness"?
  *   **Modern Resolution:** Most philosophers now lean toward **Spacetime Structural Realism**. The structure (the metric relations) is real; the points are merely nodes in the structure, defined entirely by their place in the web. This is very close to Leibniz, though Leibniz grounded his relations in monads, whereas structural realists often stop at the structure itself.

  ### 4. Summary of the Verdict
  If you briefed Leibniz:

  1.  **On the Hole Argument:** He would embrace it enthusiastically as a rigorous proof that manifold points lack independent identity. He would view the resulting indeterminism as a *reductio* of substantivalism, not a feature of nature.
  2.  **On Sophisticated Substantivalism:** He would reject it as incoherent. To say points are "real individuals" but their individuality makes no difference to the state of the world violates the Identity of Indiscernibles. He would classify this view as "confused relationalism."
  3.  **On the Lineage:** He would agree that the Hole Argument is the Shift Argument's dynamic successor, but he would note that GR complicates matters by making the "relations" (the metric) dynamical entities themselves.

  **The Condensed Matter Analogy:**
  Since you are in condensed matter, consider this analogy:
  *   **Substantivalism:** Believing the lattice sites exist even if you remove all the atoms and phonons.
  *   **Relationalism:** Believing the lattice is defined only by the equilibrium positions of the atoms.
  *   **The Hole Argument:** Showing that if you insist the empty lattice sites are real, you can't predict where a phonon will propagate in a void region, because you can permute the sites without changing the physics.
  *   **Sophisticated Substantivalism:** Saying the sites are real, but permuting them doesn't count as a different state.
  *   **Leibniz's Take:** "If permuting them doesn't change the state, the sites aren't doing any work. Stop talking about the sites and talk about the phonon field."

  Your skepticism about the "clean lineage" is well-founded because the Hole Argument relies on the specific mathematical machinery of GR (diffeomorphism invariance) to generate a problem Leibniz couldn't have foreseen (local indeterminism). However, his metaphysical toolkit (PSR/PII) is surprisingly robust enough to dismantle the substantivalist response, perhaps even more ruthlessly than the modern proponents of the Hole Argument intend. They want to save determinism; Leibniz would want to save the Principle of Sufficient Reason. Fortunately, in this case, they require the same ontology.
