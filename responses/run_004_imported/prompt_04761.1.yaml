prompt: |-
  I'm a PhD student in econ theory, and our formal epistemology reading group has a guest lined up for a recorded Q&A -- shes basically built her whole research program on the strong reading of no-trade theorems: that any trade two people knowingly make on private info (vs. liquidity/hedging needs) is itself evidence someone failed to be a good Bayesian, since common knowledge of rationality plus a shared prior should make speculative trade vanish, Milgrom-Stokey/Aumann style. Whenever someone points at how much real markets actually trade, her go-to dodge is "that's heterogeneous priors, not disagreement, so it doesn't count." Can you draft around 8 interview questions, each with a follow-up keyed to that dodge or a nearby one, pressing on: whether her own "uncommon priors need an origin story" line -- why would two equally rational people start out with different priors at all? -- doesn't just as easily rule out honest differences in risk attitude; how much volume she can wave away as "noise" before the theorem stops predicting anything falsifiable; and whether going from Aumann's result (posteriors on one event) to a no-trade result (whole allocations) sneaks in the assumption that the pre-trade allocation was already Pareto-optimal. End on a question about what trading pattern would actually get her to abandon the strong reading.
