prompt: |-
  I've followed the debates about discounting the future that recur in rationalist and effective-altruist circles, and one point that usually gets treated as settled has always puzzled me. Following Sidgwick, and echoing Frank Ramsey's remark that such discounting is merely a failure of imagination, Parfit devotes much of Reasons and Persons to arguing that pure time preference — discounting future well-being simply because it is future — is indefensible: there's no more reason to discount someone's well-being for lying fifty years ahead than for lying on the other side of the world. This is close to a consensus among philosophers and economists who have written on the ethics of discounting. Given that, I'm puzzled why economists still treat the size of the social discount rate as a live controversy, and why prominent critics of the Stern Review's very low rate, such as Nordhaus, weren't simply committing an elementary philosophical error by pushing for something substantially higher. If the argument against pure time preference is this decisive, shouldn't something close to zero simply be the correct rate for evaluating climate and existential-risk policy, with continued resistance just a sign that economics hasn't caught up with the philosophy?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Core Premise:** The user notes a strong philosophical consensus (Sidgwick, Ramsey, Parfit) that *pure time preference* (discounting future well-being just because it's in the future) is ethically indefensible.
      *   **Observation:** Despite this, economists still debate the social discount rate (SDR). Prominent economists like Nordhaus criticized the Stern Review for using a near-zero rate, arguing for a higher one.
      *   **Question:** If the philosophical argument is so decisive, why isn't the economic debate settled? Are economists like Nordhaus committing an elementary philosophical error? Shouldn't the rate be near zero for climate/existential risk policy?

  2.  **Initial Assessment & Fact-Checking:**
      *   *Philosophical Consensus:* Yes, among moral philosophers (especially utilitarian/EA circles), pure time preference is widely rejected. Parfit's *Reasons and Persons* is the key text here.
      *   *Economic Consensus:* No, there is no consensus among economists. The Ramsey Rule ($r = \delta + \eta g$) is the standard framework, but the parameters ($\delta$, $\eta$, $g$) are contested.
      *   *Stern vs. Nordhaus:* This is the classic debate. Stern used $\delta \approx 0.1\%$ (near zero pure time preference). Nordhaus used $\delta \approx 1-3\%$ (positive pure time preference).
      *   *Is Nordhaus "Wrong"?* It's too simplistic to say he's committing an "elementary philosophical error." He's operating within a different framework (descriptive vs. normative, risk, opportunity cost, etc.).

  3.  **Identify Key Reasons for the Disagreement:**
      *   *Normative vs. Descriptive:* Philosophers argue normatively (what *ought* to be). Economists often argue descriptively (what markets *do*) or pragmatically (what is politically feasible/consistent with observed behavior).
      *   *The Ramsey Equation:* $r = \delta + \eta g$.
          *   $\delta$ (Pure Time Preference): Philosophers say 0. Economists say >0 (observed behavior, uncertainty about existence).
          *   $\eta$ (Elasticity of Marginal Utility): How much less valuable an extra dollar is to a rich future person.
          *   $g$ (Growth Rate): Future people will likely be richer.
      *   *Opportunity Cost of Capital:* If we invest money now, it grows. Discounting reflects the return on alternative investments.
      *   *Uncertainty/Existential Risk:* The future might not exist. Discounting can reflect the probability of extinction (not pure time preference, but conditional existence).
      *   *Democratic Mandate/Revealed Preference:* Governments should reflect the time preferences of their citizens, who *do* discount the future.

  4.  **Structure the Response:**
      *   **Acknowledge and Validate:** Start by confirming the user's understanding of the philosophical consensus (Parfit, Ramsey, Sidgwick). It *is* strong in ethics.
      *   **The Core Distinction (Normative vs. Positive):** Explain that economists aren't just doing ethics; they are modeling behavior and policy implementation.
      *   **Deconstruct the Ramsey Rule:** Break down $r = \delta + \eta g$. Show that even if $\delta \approx 0$, $r$ can still be significant due to growth ($g$) and diminishing marginal utility ($\eta$). This is crucial. Stern and Nordhaus disagreed on $\delta$, but the *outcome* discount rate also depends on wealth assumptions.
      *   **Arguments for Positive $\delta$ (Nordhaus's side):**
          *   *Descriptive/Revealed Preference:* People actually do discount. Is it ethical to force them to save more than they want?
          *   *Uncertainty/Extinction:* We aren't sure the future exists.
          *   *Opportunity Cost:* Capital has a return.
      *   **Arguments for Near-Zero $\delta$ (Stern's side):**
          *   *Intergenerational Equity:* Future people can't vote.
          *   *Ethical Consistency:* Parfit's argument.
      *   **Why it's not an "Elementary Error":** Nordhaus isn't ignoring Parfit; he's weighing different practical and ethical considerations (e.g., paternalism vs. democracy, current sacrifice vs. future gain).
      *   **Recent Developments:** Mention declining discount rates (Weitzman), uncertainty, and the "Green Golden Rule."
      *   **Conclusion:** Summarize that it's a clash of frameworks (ideal ethics vs. policy economics), not just ignorance.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Refinement on "Pure Time Preference":* Make sure to distinguish between *pure* time preference ($\delta$) and the *overall* discount rate ($r$). Even Stern had a non-zero $r$ because of growth. The debate is specifically about $\delta$.
      *   *Refinement on Nordhaus:* Nordhaus argues that a near-zero rate implies implausibly high savings rates for the present generation. This is a "policy feasibility" argument, not just an ethical one.
      *   *Refinement on Risk:* Distinguish between "I care less about 2100 because it's 2100" (pure time preference) and "I care less about 2100 because there might be no one there" (probability of extinction). Economists often conflate these, but it's important to separate them.
      *   *Tone:* Keep it respectful to both sides. Avoid saying economists are "wrong" but explain *why* they diverge from philosophers.

  6.  **Final Review against User Query:**
      *   Did I answer why it's still a live controversy? Yes (different objectives, parameters).
      *   Did I address Nordhaus specifically? Yes (savings rate implication, revealed preference).
      *   Did I address the "elementary error" claim? Yes (it's a category error to judge policy economics solely by ideal ethics).

  7.  **Final Polish:** Ensure clear headings and logical flow. (Self-correction: Make sure to emphasize that *discounting consumption* is different from *discounting utility*. Parfit attacks discounting utility. Economists often discount consumption. This is a technical but vital distinction.)

  **(Self-Correction during drafting):** I need to be careful not to imply economists don't care about ethics. Many do. But they balance intergenerational equity against intragenerational equity (poor people today vs. rich people tomorrow).

