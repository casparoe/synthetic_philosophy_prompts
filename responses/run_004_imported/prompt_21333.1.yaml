answer: |-
  You have identified one of the most significant fault lines between moral philosophy and welfare economics. Your summary of the philosophical consensus is accurate: among ethicists working on intergenerational justice (from Sidgwick to Parfit to contemporary effective altruists), **pure time preference** (discounting future welfare simply because it occurs later) is widely regarded as ethically indefensible. It implies a form of discrimination based on temporal location, analogous to discrimination based on spatial location.

  However, characterizing economists like William Nordhaus as committing an "elementary philosophical error" misses the nuance of why the debate persists. The disagreement is not merely that economists haven't read Parfit; it is that they are operating with different objectives, constraints, and definitions of "welfare."

  Here is a breakdown of why the social discount rate (SDR) remains a live controversy despite the philosophical consensus.

  ### 1. The Ramsey Equation: Utility vs. Consumption
  The first source of confusion is technical. The standard framework for discounting is the Ramsey Rule:

  $$r = \delta + \eta \cdot g$$

  *   **$r$**: The social discount rate (the rate at which we discount future *consumption*).
  *   **$\delta$ (delta)**: The **pure time preference** rate (the rate at which we discount future *utility*).
  *   **$\eta$ (eta)**: The elasticity of marginal utility of consumption (how much less valuable an extra dollar is to a richer person).
  *   **$g$**: The expected growth rate of consumption.

  **The Philosophical Claim:** Philosophers argue $\delta$ should be zero.
  **The Economic Reality:** Even if $\delta = 0$, $r$ can still be substantial.

  If we assume future generations will be richer than us ($g > 0$) and that money matters less to rich people ($\eta > 0$), then the *value* of a dollar to them is lower than a dollar to us. Therefore, we should discount future *consumption* even if we do not discount future *utility*.

  **Where Nordhaus and Stern actually disagreed:**
  Nicholas Stern (2006) used $\delta = 0.1\%$ (near zero). William Nordhaus criticized this, using $\delta \approx 1.5\%$.
  *   **Stern's implication:** We should sacrifice a lot today to help the future, because a dollar in 2100 is almost as valuable as a dollar today.
  *   **Nordhaus's implication:** If $\delta$ is near zero, the model implies the current generation should save an implausibly high percentage of its income (sometimes calculated at >30% of global GDP) to invest for the future. Nordhaus argued this places an unfair burden on the current poor to help the future rich.

  Thus, Nordhaus isn't necessarily arguing that future lives matter less *intrinsically*; he is arguing about the **distribution of sacrifice** between generations.

  ### 2. Normative vs. Descriptive (Prescriptive vs. Positive)
  Philosophers generally take a **normative** approach: *What ought we to do?*
  Economists often take a **descriptive** or **pragmatic** approach: *What do people actually do, and what policy is implementable?*

  *   **Revealed Preference:** Economists like Nordhaus argue that the social discount rate should reflect the actual time preferences of living citizens. If people naturally discount the future (which they do), a government imposing a near-zero rate is effectively overriding the democratic will of the current population. They view this as paternalistic.
  *   **Opportunity Cost of Capital:** In cost-benefit analysis, the discount rate often represents the return on alternative investments. If the market return is 5%, and a climate project returns 2%, the project destroys value that could have been used elsewhere. This is an efficiency argument, not necessarily an ethical one about the value of future lives.

  ### 3. Uncertainty and Existential Risk
  There is a distinction between **pure time preference** and **probability of existence**.
  *   **Pure Time Preference:** "I value 2100 less because it is 2100." (Parfit says this is wrong).
  *   **Existential Risk:** "I value 2100 less because there is a chance no one will be there." (This is rational).

  Economists often bundle these together. If there is a 1% annual chance of civilizational collapse, a rational agent should discount the future by roughly 1%, not out of disrespect for future people, but out of realism about their existence. Nordhaus and others argue that a near-zero discount rate ignores the substantial risks that prevent the future from materializing.

  ### 4. Intragenerational vs. Intergenerational Equity
  This is perhaps the strongest economic counter-argument to the philosophical consensus.
  *   **Intergenerational Equity:** Treating future generations fairly (argues for low $\delta$).
  *   **Intragenerational Equity:** Treating current poor people fairly.

  If we adopt a near-zero discount rate, we justify massive current investments in climate mitigation. Where does that money come from? It comes from taxation or reduced consumption today. Since the current global population includes billions of people living in poverty, demanding high savings rates today effectively transfers resources from the **current poor** to the **future rich** (assuming economic growth continues).

  Nordhaus's critique is essentially that Stern's low discount rate prioritizes the welfare of wealthy future people over impoverished current people. This is an ethical trade-off, not a mathematical error.

  ### 5. Declining Discount Rates
  It is worth noting that economics *has* moved closer to the philosophical view in recent decades, specifically through the work of Martin Weitzman.
  *   Standard discounting is exponential (100 years out is discounted massively).
  *   Weitzman showed that if there is uncertainty about *what* the correct discount rate is, the effective rate declines over time.
  *   This means for very long-term issues (like existential risk or deep-time climate change), the discount rate should indeed approach zero, even if short-term rates are higher.

  This synthesizes the economic need for market consistency with the philosophical need for long-term fairness.

  ### Conclusion: Is it an "Elementary Error"?
  No. It is a category difference.
  *   **Parfit** is asking: "Is it morally permissible to value a life less because of when it occurs?" (Answer: No).
  *   **Nordhaus** is asking: "What savings rate maximizes welfare across all generations without imposing crushing burdens on the current generation?" (Answer: Requires a positive $\delta$).

  Economists treat the discount rate as a **policy parameter** that balances efficiency, political feasibility, current poverty, and future risk. Philosophers treat it as an **axiom of moral value**.

  The resistance you see isn't ignorance of Parfit; it is a refusal to let ideal ethics override practical constraints on resource allocation. However, for **existential risk** specifically—where the "future people" might not exist at all if we fail, and where growth assumptions break down—the economic consensus is shifting. In those specific contexts, the philosophical argument for near-zero discounting is gaining much more traction within economics than it had during the Stern-Nordhaus debates of the 2000s.
