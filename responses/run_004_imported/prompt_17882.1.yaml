answer: |-
  Here are ten interview questions designed to probe the vulnerabilities of the resolute choice defense, including the four specific thematic requirements you requested. Each includes the guest's likely reply and a sharper follow-up.

  ### 1. The Separability Worry
  **Question:** A standard objection to resolute choice is that it violates the separability principle: the idea that your choice at a later node should depend only on the options available at that node, not on how you got there. Critics argue that resolute choice only "solves" the money pump by smuggling the history of the plan into the description of the later option. Essentially, you aren't choosing $A$ over $B$; you're choosing "$A$-given-I-planned-$A$" over "$B$-given-I-planned-$A$." If the option descriptions change, haven't you just defined the preference reversal away rather than solving it?

  *   **Likely Reply:** "I'd reject the premise that options should be individuated so thinly. In a diachronic context, the *opportunity* to choose $B$ is different if it arises from a deviation versus a plan. Rationality is about evaluating plans, not isolated snapshots. By sticking to the plan, I'm not changing my preference over outcomes; I'm recognizing that the instrumental value of an option depends on the policy that generated it."
  *   **Follow-up:** "But if the instrumental value depends on the policy, doesn't that make the preference order unstable across different possible plans? If I can make any choice rational simply by embedding it in a prior plan to make that choice, doesn't resolute choice risk becoming a license for arbitrary consistency rather than a constraint on rationality?"

  ### 2. The Cost of Sophistication
  **Question:** Let's look at the alternative. A sophisticated agent anticipates the pump and refuses the first trade, even though locally they prefer to take it. This means the sophisticated agent must forgo a strictly preferred local trade purely to avoid a future loss. Doesn't this concession admit that local preferences are systematically misleading? And if local preferences are unreliable guides to choice, doesn't that reintroduce the orthodox case for transitivity under another name—suggesting we should just fix the preferences rather than patch the choice mechanism?

  *   **Likely Reply:** "It's not that local preferences are misleading; it's that they are incomplete guides. They capture immediate comparative value but miss the structural context. The sophisticated agent isn't admitting irrationality; they are acknowledging that rational choice requires looking at the whole tree. We don't need transitive local preferences; we need a global decision rule that respects the local preferences where possible but overrides them to prevent exploitation."
  *   **Follow-up:** "If the global decision rule overrides the local preferences whenever they threaten exploitation, what work are the local preferences actually doing? If the 'rational' choice is the one that contradicts the local preference to save money, aren't you effectively conceding that the local preference was irrational all along?"

  ### 3. Incomplete Preferences
  **Question:** Newer money-pump arguments target agents with incomplete preferences rather than cyclic ones. Here, the agent isn't forced to accept the first trade by a strict preference; they accept it because they lack a preference against it. Since they aren't locally compelled to trade the way a cyclic agent is, does resolute choice really apply? If I have no preference between $A$ and $B$, what rational basis do I have for resolving to stick with $A$ other than arbitrary stubbornness?

  *   **Likely Reply:** "Resoluteness provides the tie-breaking mechanism that incompleteness lacks. It's not arbitrary; it's a secondary rational norm. When preferences underdetermine choice, the agent is permitted to adopt a plan to secure a determinate outcome. The rationality comes from the benefit of avoiding the pump, which justifies the resolution to treat the incompleteness as a 'stop' signal."
  *   **Follow-up:** "But if the justification for the resolution is purely to avoid the pump, aren't you making avoidance of exploitation the *definition* of rationality rather than a consequence of it? If I encounter an incomplete preference in a one-off case where no pump is possible, does your view imply I'm still irrational for not resolving it?"

  ### 4. The Addiction Analogy
  **Question:** Your defense relies heavily on the rationality of "sticking to the plan against later temptation." But this is the exact structure of an addict resisting recovery, or a fanatic sticking to a harmful ideology. The addict resolves at $t_0$ to use drugs and sticks to it at $t_1$ despite health concerns. How do you distinguish the rational resoluteness of the money-pump avoider from the irrational resoluteness of the addict, without appealing to the very preference satisfaction criteria you're trying to bypass?

  *   **Likely Reply:** "The distinction lies in the evaluative standpoint. The addict's plan conflicts with their higher-order values or overall well-being, whereas the resolute chooser's plan aligns with their overall best interest (avoiding exploitation). Resolute choice isn't about blind commitment; it's about commitment to a plan that survives reflective scrutiny."
  *   **Follow-up:** "If we need 'reflective scrutiny' or 'higher-order values' to validate the plan, don't we just push the requirement for transitivity up a level? Presumably, those higher-order values must be consistent to avoid a higher-order money pump. So haven't you just relocated the transitivity requirement rather than eliminating it?"

  ### 5. Intrapersonal Bargaining
  **Question:** Resolute choice treats the agent as a single entity persisting through time. But if we model the agent as a sequence of temporal selves, resolute choice looks like the $t_0$ self tyrannizing the $t_1$ self. Why should the $t_1$ self, who by hypothesis prefers to defect, care about the $t_0$ self's plan? What is the normative force binding the later self to the earlier self's resolution?

  *   **Likely Reply:** "Because they are the same person. The 'temporal selves' model is a heuristic, not metaphysics. If I disown my past plans, I lose the capacity for agency over time. The normative force comes from the constitutive role of planning in human agency; to be an agent is to be bound by one's own past intentions unless there is a specific reason to revoke them."
  *   **Follow-up:** "But in the money pump case, the 'specific reason to revoke' is precisely that the $t_1$ self prefers the alternative. If the only reason to stick to the plan is to avoid a loss that the $t_1$ self doesn't fully internalize yet, aren't you asking the $t_1$ self to act against its own perceived good for the sake of a 'person' it might not feel connected to?"

  ### 6. Sensitivity to New Information
  **Question:** A key feature of rational agency is responsiveness to new information. Resolute choice seems to require a degree of insulation from new local data. If, at $t_1$, I learn something that makes the trade look even more attractive than I thought at $t_0$, does your view require me to ignore that information to stick to the plan? Where is the line between rational resoluteness and irrational dogmatism?

  *   **Likely Reply:** "Resolute choice applies to *preferences*, not beliefs. If you learn new factual information that changes the expected utility of the outcomes, you should update and potentially revise the plan. The money pump scenario holds values constant; it's purely about preference structure. Resoluteness binds you to your values, not to your ignorance."
  *   **Follow-up:** "But in many dynamic choice problems, the 'new information' is precisely the intensity of your own current desire. If I feel a much stronger preference for $B$ at $t_1$ than I anticipated at $t_0$, and I treat that feeling as data about my utility function, doesn't resolute choice forbid me from updating on that?"

  ### 7. Consequentialism without Separability
  **Question:** Edward McClennen argues that resolute choice allows us to keep consequentialism without separability. But consequentialism typically dictates choosing the best available option at the moment of choice. If resolute choice requires choosing an option that is locally suboptimal to satisfy a global plan, aren't you effectively abandoning consequentialism for a form of deontology of plans?

  *   **Likely Reply:** "Not at all. It's a broader consequentialism. The 'consequences' include the integrity of the agency that produced them. A choice is right if it flows from the best plan, and the best plan is the one with the best consequences. We are evaluating the plan consequentially, even if the specific act isn't locally optimal."
  *   **Follow-up:** "If the rightness of the act depends on the plan rather than the act's consequences, doesn't that break the link between rationality and outcome optimization? If I can justify a locally worse outcome by appealing to a plan, what stops me from justifying *any* outcome by concocting a suitable prior plan?"

  ### 8. The "Money" in Money Pump
  **Question:** Money pump arguments assume that losing money is intrinsically irrational. But for a resolute chooser, the 'loss' is the price of maintaining agency integrity. If I value my consistency highly enough, isn't paying the pump fee just a transaction cost for being the kind of agent who keeps resolutions? Why is that irrational?

  *   **Likely Reply:** "Exactly. The money pump only works if the agent values money more than consistency. But standard decision theory assumes money is a proxy for utility. If you are pumped, you end up with less money and the same outcome, which is strictly dominated. It's not about the 'price' of consistency; it's about paying for nothing."
  *   **Follow-up:** "But if the resolute agent refuses the trade, they also end up with less money than they *could* have had if preferences were transitive. Isn't the real cost here that resolute agents are permanently excluded from certain regions of the choice space that transitive agents can access? Isn't that a structural disadvantage?"

  ### 9. Learning and Evolution
  **Question:** Even if resolute choice blocks the pump, it seems like a fragile equilibrium. In an evolutionary or learning context, agents who simply update their preferences to be transitive would outperform agents who have to expend cognitive energy maintaining resoluteness. Doesn't this suggest that resoluteness is at best a second-best heuristic for agents who can't fix their preferences, rather than a fundamental norm of rationality?

  *   **Likely Reply:** "Rationality isn't about evolutionary fitness; it's about normative correctness. An agent might be biologically constrained to have cyclic preferences. Resolute choice shows that such an agent can still be rational. It expands the domain of rationality to include non-standard preference structures, rather than excluding them."
  *   **Follow-up:** "If rationality is normative correctness, and the norm is to avoid exploitation, but the most reliable way to avoid exploitation is to have transitive preferences, isn't there a derivative norm to *make* your preferences transitive? And if so, isn't resolute choice just a temporary patch while you work on that?"

  ### 10. Meta-Rationality
  **Question:** Finally, let's zoom out. The money pump argument is supposed to show that cyclic preferences are irrational. You argue they aren't, provided one chooses resolutely. But this shifts the burden from the *structure of preferences* to the *method of choice*. Does this mean that on your view, an agent with chaotic, cyclic preferences who is resolute is more rational than an agent with transitive preferences who is naive?

  *   **Likely Reply:** "In terms of vulnerability to exploitation, yes. The resolute cyclic agent keeps their money; the naive transitive agent might not (if they face other dynamic inconsistencies). Rationality is about effective agency, and resolute choice secures effectiveness where preference structure fails."
  *   **Follow-up:** "That's a striking claim. So you're saying the architecture of decision-making matters more than the content of preferences. If that's true, why does the literature focus so heavily on axioms of preference at all? Should we be teaching students about axioms of *resolution* instead?"
