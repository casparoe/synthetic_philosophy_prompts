answer: |-
  This is a classic seminar rabbit hole, and you have the dialectic mapped out correctly. The tension between Lewis's "abundant causation + pragmatic selection" and McGrath's "restricted causation + normative defaults" is the central fault line in the literature on omissions.

  Since you need a verdict for your paper (and ammunition for your roommate), I'm not going to give you the "philosophers disagree" shrug. Here is the comparative analysis and a defensible thesis you can run with.

  ### The Core Distinction: Pragmatics vs. Truth Conditions

  The fundamental difference isn't just *where* they put the normativity; it's about what they think causation *is*.

  **Lewis (The Pragmatic Move):**
  For Lewis, causation is a natural relation of counterfactual dependence between events. It is mind-independent. If the basil dies, and it counterfactually depends on the Antarctica guy not flying over to water it, then he *is* a cause. Full stop.
  *   **The Strategy:** He separates *causation* (metaphysics) from *causal explanation* (pragmatics). We don't mention the Antarctica guy not because he isn't a cause, but because citing him is uninformative, misleading, or violates conversational maxims.
  *   **The Cost:** Ontological bloat. The world is teeming with infinite negative causes. This feels like a category error. It implies the universe "knows" about your basil plant's watering schedule in the same way it knows about gravity.

  **McGrath (The Normative Move):**
  McGrath argues that omissions aren't "events" in the Lewisian sense. They are absences. An absence only becomes causally relevant when there is a **default** expectation that it should be present.
  *   **The Strategy:** She builds the norm into the *truth conditions* of the causal claim. "X caused Y by omitting Z" is false if there was no duty/default for X to do Z. The Antarctica guy is not a cause, metaphysically speaking.
  *   **The Cost:** It makes causation partially normative. It suggests that what *ought* to happen influences what *did* happen (or at least, our description of the causal structure).

  ### Does McGrath Just "Smuggle" the Judgment In?

  This is the strongest objection to McGrath, and you should address it head-on.

  **The Charge:** McGrath hasn't solved the problem; she's just moved the line. Lewis says, "He is a cause, but we ignore him." McGrath says, "He is not a cause, because we ignore him." Isn't the "ignoring" (the normative judgment) doing the same work in both?

  **The Defense (Your Verdict Material):**
  No, she isn't just smuggling it in; she is identifying a **category mistake** in Lewis's view.
  Lewis treats omissions as if they are "shadow events." He assumes the non-watering is an event just like the watering, just with a negative value. McGrath's insight is that omissions are not ontological primitives; they are *descriptions* relative to a background of expectations.

  If you accept that omissions are fundamentally different from positive events, then building norms into the analysis isn't "smuggling"—it's **necessary**. You cannot have an omission without a norm/expectation. A "lack of rain" is only an omission if rain was expected (e.g., monsoon season). If rain was never expected (desert), it's just a state of affairs. Lewis fails to distinguish between a *state of affairs* (no rain) and an *omission* (failure to rain when expected). McGrath captures this distinction metaphysically; Lewis captures it only conversationally.

  **Verdict Point 1:** McGrath buys you something real: she prevents the category error of treating absences as existing entities. Lewis's ontology is bloated because he refuses to admit that "nothing" isn't a "something."

  ### The Cost: The "Norm-Free" Problem

  You asked if causation goes silent when there are no norms. This is the weak point in McGrath's armor, and where Lewis shines.

  **The Scenario:** A wild fern in an unowned forest dies because it didn't rain. No one owned it. No one had a duty. No statistical norm (it's a dry season).
  *   **Lewis:** Easy. The lack of rain counterfactually caused the death.
  *   **McGrath:** Tricky. If there is no default/duty, is it an omission? If she says "no," then the fern died *uncaused* (or at least, not by omission). That sounds wrong.

  **How McGrath Defends This:**
  McGrath (and defenders like Hitchcock) usually broaden "norms" beyond moral duty to **statistical or functional defaults**.
  *   *Statistical:* It usually rains here in April.
  *   *Functional:* Plants function by taking in water.
  If she relies on *functional* defaults, she can handle the fern. The fern's biological function requires water; the absence of water is a deviation from the functional default of the biological system.

  **The Vulnerability:**
  If she leans too hard on "functional defaults," she risks making causation relative to the *description* of the system. Is the fern part of a "forest ecosystem" (needs rain) or a "collection of atoms" (no needs)? Lewis avoids this relativity; McGrath invites it.

  ### The Verdict: Which Strategy Wins?

  For your paper, I recommend arguing that **McGrath is right about omissions, even if Lewis is right about positive causation.**

  Here is the thesis: **Lewis's pragmatic solution fails specifically for omissions because it treats them as ontologically equivalent to positive events. McGrath is correct that omissions are inherently normative, so building norms into the metaphysics is not a bug, but a feature.**

  **Why this wins:**
  1.  **Explanatory Power:** Lewis's view implies the Antarctica guy *is* a cause. This is metaphysically absurd. Saying "it's true but we don't say it" is a dodge. It admits the theory generates falsehoods (in the ordinary sense) and relies on a patch to fix them. McGrath's theory generates the correct truth values from the start.
  2.  **The Nature of Omissions:** An omission *just is* a failure to meet an expectation. You cannot define an omission without a norm. Therefore, a theory of *omissive* causation must include norms. Lewis is trying to force omissions into a theory designed for positive events (collisions, explosions, etc.). McGrath recognizes they require a different logic.
  3.  **Responsibility:** We care about omissions almost exclusively in contexts of responsibility (law, morality, agency). Lewis severs causation from responsibility (you can be a cause without being responsible). McGrath ties them together. For omissions, this is the correct move. If the Antarctica guy isn't responsible, he shouldn't be a cause.

  **The Concession (to show nuance):**
  Admit that McGrath's view makes causation less "scientific." Physics doesn't care about duties. So, Lewis is better for *physics*, McGrath is better for *metaphysics of agency*. But since your seminar is likely focused on human-scale causation (basil plants, neighbors), McGrath is the superior framework.

  ### Ammo for the Roommate Argument

  Your roommate is likely operating on a Lewisian intuition (the "but technically..." argument). Here is how to shut it down:

  1.  **The "Nothing" Argument:** "If I don't buy you a Ferrari, and you stay poor, did my not-buying cause your poverty? Lewis says yes, technically. McGrath says no, because I had no duty to buy it. If you agree I didn't cause your poverty, you agree with McGrath. Lewis is forced to say I *did* cause it, I'm just not to blame. That splits causation from explanation in a way that makes 'cause' useless."
  2.  **The Ontology Argument:** "Lewis thinks 'non-events' exist in the world same as 'events.' That means the universe is made of things that *didn't* happen. McGrath says 'non-events' are just ways we talk about the world relative to expectations. It's cleaner."
  3.  **The Punchline:** "Lewis saves his theory by changing the subject to pragmatics. McGrath changes the theory to fit the subject. McGrath is doing better philosophy."

  ### Tips for the Response Paper

  1.  **Focus on the "Default":** Don't get bogged down in moral duty. Focus on McGrath's idea of a "default state." This helps you avoid the "Norm-Free" objection (the wild fern). Argue that biological systems have default functional states.
  2.  **Attack Lewis's "Influence":** Lewis later moved to "Causation as Influence." You can argue that even influence requires a contrast class, and contrast classes are normative. So even Lewis secretly needs norms; McGrath is just honest about it.
  3.  **Structure:**
      *   Intro: The Profligacy Problem.
      *   Section 1: Lewis's Pragmatic Fix (and why it feels like a dodge).
      *   Section 2: McGrath's Normative Fix (and why it fits the concept of 'omission').
      *   Section 3: The Cost (Normativity in Metaphysics) -> Argue this is acceptable for omissions.
      *   Conclusion: McGrath provides a more truth-conditional account of omissive causation, even if it complicates naturalistic metaphysics.

  This gives you a clear, argumentative stance that engages directly with the texts without sitting on the fence. Good luck on Friday.
