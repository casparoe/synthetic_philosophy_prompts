answer: |-
  You have hit on exactly the right nerve. Most introductory explanations gloss over the move from the **Veil of Ignorance** to the **Maximin Rule**, treating it as if it’s an automatic consequence. It isn't. It is the most technically contested moment in *A Theory of Justice*.

  You are intuitively siding with John Harsanyi (the Nobel laureate economist), who argued exactly what you are arguing: if you have no information about probabilities, the rational move is the **Principle of Insufficient Reason**. You assume every outcome is equally likely, calculate the expected utility, and maximize the average. If you do that, you land on Utilitarianism, not Rawls's Two Principles.

  Rawls knows this. He knows Maximin is not a universal rule of rational choice. In fact, he admits that in most situations (like your casino example), Maximin is irrational. If I offer you a bet where you win \$100 on heads and lose \$1 on tails, you don't focus on the loss; you take the bet.

  So, why does Rawls insist that the parties in the Original Position *must* use Maximin? He doesn't just wave a wand. In **Section 13** of *A Theory of Justice*, he lays out a specific structural argument. He claims Maximin is only rational when **three specific conditions** are met. He argues the Original Position is one of the rare scenarios where all three obtain.

  Here is the actual architecture of his argument, stripped of the "people are scared" psychological gloss.

  ### 1. Uncertainty vs. Risk (The Probability Problem)
  This is the technical hinge. In decision theory, there is a distinction between **decision under risk** and **decision under uncertainty**.
  *   **Risk:** You don't know the outcome, but you know the probabilities (e.g., a deck of cards, a roulette wheel). Here, Expected Utility Theory applies.
  *   **Uncertainty:** You don't know the outcome, *and* you have no objective basis for assigning probabilities.

  Rawls argues the Original Position is a situation of **uncertainty**, not risk. There is no "deck of cards" regarding social positions. You cannot say, "There is a 10% chance I'll be disabled," because there is no frequency data for souls being assigned to bodies.

  If you assume equal probability (as Harsanyi suggests), you are importing information you don't have. Rawls argues it is irrational to base the basic structure of society on a probabilistic assumption that has no empirical grounding. If you can't calculate the odds, you can't calculate the expected value. Therefore, the "average out the odds" strategy is mathematically unavailable. You are left with rules that don't rely on probabilities. Maximin is one of them.

  ### 2. The Conception of the Good (The Floor Matters More Than the Ceiling)
  Rawls argues that the parties in the Original Position are not trying to maximize *total* happiness; they are trying to secure **Primary Goods** (rights, liberties, opportunities, income, self-respect).

  He posits that the parties have a specific threshold of these goods below which life is not worth living, or at least below which one cannot effectively pursue any life plan at all.
  *   **The Argument:** Once you have secured a sufficient baseline of liberty and material means to pursue your ends, gaining *more* becomes less important than risking the loss of that baseline.
  *   **The Trade-off:** In a Utilitarian calculation, you might accept a chance of being a slave if it means a higher chance of being a billionaire (because the billionaire's happiness outweighs the slave's misery in the aggregate). Rawls argues the parties would reject this. They care about the **guaranteeable floor**. They are not trying to hit the jackpot; they are trying to ensure they don't land in a position where they cannot function as free citizens.

  This isn't psychological cowardice; it's a structural feature of what is at stake. If the "upside" is extra luxury but the "downside" is destitution or oppression, the rational choice is to secure the floor.

  ### 3. Unacceptable Outcomes (The "Grave Risks" Condition)
  This is the strongest part of Rawls's argument. Maximin is rational when some outcomes are **catastrophically unacceptable**.

  In a casino, if you lose, you go home broke. You can try again tomorrow. In the Original Position, the choice is **final and binding**. You are choosing the basic structure of the society you will live your entire life in.
  *   If the "worst case" scenario involves slavery, religious persecution, or starvation, that outcome is *lexically* worse than any gain in wealth.
  *   Rawls argues that no rational agent would gamble their basic liberties for a chance at higher average wealth. If the alternative to the Difference Principle is a society where the bottom 10% are crushed to make the top 10% ecstatic, the parties will reject it. Not because they are "risk-averse," but because the cost of the loss is infinite (in terms of life prospects).

  You cannot trade away your capacity to be a free citizen for a lottery ticket.

  ### The "Strains of Commitment"
  There is a second layer to this, which Rawls calls the **Strains of Commitment**. This moves from the choice itself to the stability of the agreement.

  The parties know that whatever they agree to, they must stick to it once the veil is lifted. They need to ask: *"If I end up in the worst-off position, can I still accept this agreement?"*
  *   **Utilitarianism:** If you end up as the suffering minority sacrificed for the greater good, you are being asked to accept your misery for the sake of others. Rawls argues this creates a psychological and political strain that is too high. The agreement would be unstable; the losers would revolt.
  *   **Maximin/Difference Principle:** If you end up at the bottom, you know the system is arranged to make your position as good as possible. You can look at the rich and say, "Your wealth is only permissible because it improved my lot." This makes the agreement stable.

  So, the choice of Maximin is also a choice for **stability**. A rational contractor won't sign a contract they know they might not be able to honor if the dice roll against them.

  ### Summary: Why Your Intuition Clashes with Rawls
  Your intuition (Expected Utility) works for **repeatable games with known probabilities and limited stakes.**
  Rawls's argument (Maximin) works for **non-repeatable choices with unknown probabilities and existential stakes.**

  Rawls isn't saying humans are naturally cautious. He is saying that the **structure of the Original Position** transforms the decision.
  1.  **No Probabilities:** You can't do the math for expected utility.
  2.  **High Stakes:** The downside is a life not worth living.
  3.  **Finality:** You can't quit the game.

  ### The Critique (Validating Your Doubt)
  You are right to feel that this is the weak link in the chain. Many philosophers (including Harsanyi, Sen, and later Gaus) argue Rawls stacks the deck.
  *   **The Probability Counter:** Critics argue that "no information" *should* default to equal probability. To assume otherwise is just as arbitrary.
  *   **The Risk Counter:** Critics argue Rawls builds extreme risk aversion into the description of the parties (by giving them a specific theory of Primary Goods) rather than deriving it purely from the choice situation.

  Rawls's defense is that he isn't describing a gamble; he is describing a **constitutional convention**. You don't vote on a constitution using casino logic. You vote using safety logic, because the constitution is the framework within which all future gambles will take place.

  If you view the Original Position as a bet, Utilitarianism wins. If you view it as a **social contract for a permanent union**, Rawls argues Maximin is the only rational way to ensure the union holds together. That is the "actual argument" behind the move.
