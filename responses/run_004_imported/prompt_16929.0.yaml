answer: |-
  This is one of the sharpest questions in social choice theory. You have correctly identified that the divergence between Arrow and Harsanyi is not merely a technical quirk but reflects a fundamental shift in the **informational basis** of the aggregation problem.

  To pin down the contrast for your piece, you need to focus on three specific pivots: the move from ordinal to cardinal information (via risk), the distinct roles played by the two "independence" axioms, and the precise status of interpersonal comparability in Harsanyi's result.

  ### 1. The Informational Pivot: Ordinality vs. Cardinality via Risk

  The primary reason Arrow's impossibility turns into Harsanyi's possibility is that Harsanyi enriches the input data.

  *   **Arrow's Setup (Ordinal):** Individuals provide only rank orderings ($x \succ y \succ z$). The aggregator knows that an individual prefers $x$ to $y$, but knows nothing about *how much* they prefer it. There is no unit of measurement. Consequently, there is no mathematical way to trade off a strong preference of Person A against a weak preference of Person B. Arrow's IIA effectively forbids the aggregator from looking for context clues that might reveal intensity.
  *   **Harsanyi's Setup (Cardinal via vNM):** Individuals provide preferences over **lotteries**. By observing how an individual trades off a certain outcome against a probabilistic mixture (e.g., "Are you indifferent between getting $y$ for sure and a 50% chance of $x$ vs. 50% chance of $z$?"), the aggregator can recover a **von Neumann–Morgenstern (vNM) utility function**.

  This is the mathematical engine of the difference. vNM utility is unique up to a **positive affine transformation** ($U' = aU + b, a > 0$). This introduces the concepts of "units" and "zero points" for each individual. While Arrow's ordinals have no scale, vNM utilities have a scale. This scale allows for linear aggregation. Mathematically, Arrow is trying to aggregate orderings (which form a non-convex space), while Harsanyi is aggregating vectors in a convex space (the simplex of probabilities). Linearity works in the latter; it is impossible in the former without dictatorship.

  ### 2. The Tale of Two "Independences"

  You are right to suspect that the two "independence" axioms are doing completely different work. Confusing them is a common error in popular explanations.

  *   **Arrow's Independence of Irrelevant Alternatives (IIA):** This is a constraint on the **aggregation rule**. It states that the social ranking of $x$ and $y$ must depend *only* on individual rankings of $x$ and $y$. It forbids the social planner from using information about how individuals rank a third option $z$ to decide between $x$ and $y$. This is a **locality constraint** designed to prevent manipulation and cycling, but it strips away the context needed to measure intensity.
  *   **vNM Independence (used by Harsanyi):** This is a constraint on **individual rationality**. It states that if an individual prefers lottery $A$ to lottery $B$, they must prefer a mixture of $A$ and $C$ to a mixture of $B$ and $C$ (with the same mixing probability). This axiom is what **generates the cardinal utility scale**. It forces preferences to be linear in probabilities (Expected Utility).

  **The Contrast:** Arrow's IIA restricts the *social* function to ignore certain information. vNM Independence restricts *individual* preferences to ensure they can be represented by a linear function. Harsanyi does not use Arrow's IIA. Instead, he uses a **Pareto condition over lotteries**: if every individual prefers lottery $A$ to lottery $B$, society must prefer $A$ to $B$. Because the domain is now a convex set of lotteries and preferences are linear (due to vNM Independence), the only social function that satisfies Pareto is a linear sum of individual utilities.

  ### 3. The "Smuggling" of Interpersonal Comparability

  This is the most critical nuance for your piece. Does Harsanyi's theorem deliver classical utilitarianism ($\sum U_i$) automatically? **No.**

  Harsanyi's Aggregation Theorem proves that the Social Welfare Function ($W$) must take the form:
  $$W = \sum_{i=1}^n a_i u_i + b$$
  where $u_i$ are the individual vNM utility functions and $a_i \geq 0$ are weights.

  There are two gaps between this result and "equal-weight utilitarianism":

  1.  **The Weights ($a_i$):** The theorem allows for *weighted* utilitarianism. To get equal weights ($a_i = 1$ for all $i$), you must add an **Anonymity** (or Symmetry) axiom, which states that the social ordering shouldn't change if you swap the utility functions of two individuals. Without this, the theorem is compatible with a plutocratic weighting scheme.
  2.  **The Scales (Interpersonal Comparability):** This is the deeper issue. Recall that vNM utilities are unique only up to affine transformation ($u_i' = \alpha u_i + \beta$).
      *   If I measure my utility in "dollars" and you measure yours in "cents," a simple sum gives you 100 times more weight than me.
      *   Harsanyi's theorem states that *there exist* scales for the individual utilities such that the social utility is a sum. It does **not** tell you how to fix the scales ($\alpha$ and $\beta$) across different people.

  To make the sum $\sum u_i$ ethically meaningful, you must assume **interpersonal comparability of utility units and levels**. Harsanyi often argued that this comparability is justified by an "impartial observer" thought experiment (his *Impartial Observer Theorem*, which is distinct from the *Aggregation Theorem*). In that framework, the observer imagines having an equal chance of being any person in society, which mathematically forces the weights to be equal and the scales to be normalized.

  However, strictly speaking, the **Aggregation Theorem alone** does not solve the interpersonal comparability problem. It assumes the utilities are commensurable enough to be summed, or rather, it proves that if a social preference satisfies the axioms, it *can be represented* as a sum, but the specific numerical values of that sum depend on arbitrary normalization choices.

  ### Summary for Your Piece

  To crystallize the contrast:

  1.  **Arrow** asks: "Can we aggregate **rankings** consistently?" The answer is **No**, because rankings lack the intensity information required to resolve conflicts without a dictator. Arrow's IIA prevents the system from inferring intensity from context.
  2.  **Harsanyi** asks: "Can we aggregate **risk preferences** consistently?" The answer is **Yes**, because risk preferences reveal intensity (cardinal utility). The vNM Independence axiom creates the mathematical structure (linearity) that makes aggregation possible.
  3.  **The Catch:** Harsanyi buys possibility by increasing informational demands (requiring cardinal data via risk) and by leaving the ethical calibration (weights and scales) as a separate normative step. Arrow's impossibility is a result of **informational scarcity**; Harsanyi's possibility is a result of **informational richness**, but it leaves the problem of **interpersonal comparison** formally unresolved within the aggregation theorem itself.

  In short: Arrow proves you cannot make an omelet without breaking eggs (dictatorship) if you are forbidden from measuring the eggs (ordinality). Harsanyi shows that if you are allowed to weigh the eggs (cardinality via risk), you can make the omelet (utilitarian sum), but the theorem doesn't tell you whose eggs count more (weights) or how to calibrate the scales (comparability).
