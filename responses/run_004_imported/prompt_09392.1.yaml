answer: |-
  You are absolutely right to focus on that second move. The "white names color, horse names shape" line is the metaphysical setup, but the "request" argument (often called the **Substitution Argument** or the **Extensionality Argument**) is where Gongsun Long actually tries to prove the non-identity claim.

  For a comps exam, you need to be able to navigate between the "sophistry" reading (he's making a category mistake) and the "charitable" reading (he's making a sophisticated point about semantics or metaphysics).

  Here is an untangling of the logic, the potential fallacies, and why scholars treat it as serious philosophy.

  ### 1. The Logical Structure: Leibniz's Law
  Logically, Gongsun Long is deploying a version of **Leibniz's Law** (the Indiscernibility of Identicals). The principle states: If $X$ is identical to $Y$, then $X$ and $Y$ must share all the same properties. Conversely, if there is a property that $X$ has and $Y$ lacks, then $X \neq Y$.

  Let's map the argument:
  *   **Term A:** "Horse" ($H$)
  *   **Term B:** "White Horse" ($WH$)
  *   **Test Property:** "Can be satisfied by a yellow or black horse."
  *   **Premise 1:** $H$ has this property (If I ask for a horse, a yellow one works).
  *   **Premise 2:** $WH$ lacks this property (If I ask for a white horse, a yellow one fails).
  *   **Conclusion:** Therefore, $WH \neq H$.

  **The Logical Force:** This is actually a valid deductive form. *If* you accept that the terms function as rigid designators in this context, the conclusion follows. The problem isn't the validity of the inference; it's the interpretation of the "is" in the conclusion.

  ### 2. The Charge of Sophistry: Intension vs. Extension
  The standard critique (and the "sophistry" charge) is that Gongsun Long is conflating **class inclusion** with **identity**.

  *   **Extensional Reading (Class Inclusion):** In standard set theory, the set of White Horses is a *subset* of the set of Horses. To say "A white horse is a horse" is to say $WH \subset H$. Gongsun Long treats this as an identity claim ($WH = H$) and then refutes it. Critics say this is a straw man; no one claims the *concept* "white horse" is identical to the *concept* "horse," only that every *instance* of a white horse is an instance of a horse.
  *   **Intensional Reading (Concept Identity):** Gongsun Long is arguing about the *names* (Ming), not just the objects (Shi). The intension of "White Horse" (White + Horse) is not identical to the intension of "Horse" (Horse).

  **The "Slide":** He slides between the object level (the animal) and the semantic level (the request/term).
  *   Object level: A white horse *is* a horse.
  *   Semantic level: The term "white horse" does not mean the same thing as the term "horse."

  By focusing on the "request" scenario, he forces the discussion into the semantic realm (how we use words to get things) but draws an ontological conclusion ("White horse is not horse"). That is the trick.

  ### 3. The Charitable Reading: Why Scholars Defend It
  If it were just a fallacy, the *Mingjia* (School of Names) wouldn't have engaged the Mohists (who were rigorous logicians) for centuries. The Mohists explicitly argued against Gongsun Long, saying "White horse is horse" is correct because it affirms class inclusion. Gongsun Long knew this. He wasn't confused; he was making a different point.

  Here are the two main charitable interpretations you should know for comps:

  #### A. A.C. Graham: Universals and Metaphysics
  A.C. Graham (in *Disputers of the Tao*) argues that Gongsun Long is a **Realist about Universals**.
  *   When he says "Horse," he refers to the universal *Horseness*.
  *   When he says "White Horse," he refers to the compound universal *Whiteness + Horseness*.
  *   **The Argument:** The universal *Horseness* is not identical to the compound universal *Whiteness + Horseness*. Just as "Red + Square" is not identical to "Square."
  *   **Why it matters:** He is arguing that specific determinations (White) modify the essence of the universal. A "White Horse" is a distinct metaphysical category from a generic "Horse." The "request" argument shows that the *criteria for instantiation* differ. To instantiate "Horse," you need shape. To instantiate "White Horse," you need shape + color. Since the criteria differ, the universals differ.

  #### B. Chad Hansen: Mass Nouns and Semantics
  Chad Hansen (in *A Daoist Theory of Chinese Thought*) offers a linguistic reading. He argues Classical Chinese nouns function more like **mass nouns** (like "water" or "snow") than count nouns ("a horse").
  *   "Horse" refers to "horse-stuff."
  *   "White Horse" refers to "white-horse-stuff."
  *   **The Argument:** "White-horse-stuff" is not identical to "horse-stuff." If you ask for "horse-stuff," any color works. If you ask for "white-horse-stuff," only white works.
  *   **Why it matters:** This avoids the set-theory problem. It's not about subsets; it's about distinct stuffs. The "request" argument highlights that language carves up reality differently based on the compound name. It's a proto-semantic point about how **reference is context-dependent**.

  ### 4. Proto-Logic vs. Sophistry
  Why treat this as logic? Because Gongsun Long is isolating a specific logical problem: **The opacity of intentional contexts.**

  In modern philosophy of language, we distinguish between:
  1.  **Extensional Contexts:** Where substitution of identicals holds (e.g., "Clark Kent is strong," "Superman is Clark Kent," therefore "Superman is strong").
  2.  **Intensional Contexts:** Where substitution fails (e.g., "Lois Lane wants to marry Superman." "Superman is Clark Kent." It does *not* follow that "Lois Lane wants to marry Clark Kent").

  Gongsun Long's "request" scenario is an **intensional context**.
  *   "Seeking a horse" is a mental/linguistic state.
  *   "Seeking a white horse" is a different mental/linguistic state.
  *   Even if the object found is the same, the *search criteria* are not interchangeable.

  **The Verdict:**
  He is guilty of equivocation if he claims a white horse isn't a *biological* horse. But if he is claiming that the **name** "White Horse" is not interchangeable with the **name** "Horse" in all linguistic contexts (specifically requests/definitions), he is logically correct.

  Scholars treat it as proto-logic because he is effectively discovering that **co-reference does not imply synonymy**. (Frege's Morning Star/Evening Star distinction). "White Horse" and "Horse" might pick out overlapping objects, but they do not have the same *sense* (Sinn), and therefore cannot be substituted in all contexts without changing the truth value of the proposition (or the success of the request).

  ### Summary for your Comps
  When writing about this, you can structure your analysis like this:

  1.  **Acknowledge the Surface Fallacy:** Admit that extensionally, $WH \subset H$. If read as a biological claim, it is false/sophistical.
  2.  **Identify the Logical Mechanism:** Point out he is using the Indiscernibility of Identicals via the "request" test (substitution failure).
  3.  **Deploy the Charitable Reading:**
      *   *Metaphysical:* He is distinguishing compound universals from simple universals (Graham).
      *   *Semantic:* He is distinguishing sense from reference, or highlighting intensional contexts (Hansen/Fregean reading).
  4.  **Contextualize:** Place it in the *Ming-Shi* (Name-Actuality) debate. The Mohists wanted language to map social reality (a white horse is a horse, so treat it as one). Gongsun Long wants language to be precise (a white horse name is not a horse name, so don't confuse the categories).

  The "request" argument is the bridge between his metaphysics of names and the practical implication: if you confuse the names, you fail to get what you asked for. That is the core of the Confucian/Daoist anxiety about language that the School of Names is exploiting.
