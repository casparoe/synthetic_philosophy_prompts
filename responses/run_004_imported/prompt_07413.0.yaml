          *   Zhuangzi: Skepticism as a *liberation* from fixed distinctions. Ontological fluidity. Pragmatic/ethical aim, not epistemic certainty.
      *   *Historical Context:* Chinese philosophy did have epistemological debates (Mohists, Later Mohists, Xunzi), but they didn't follow the Cartesian path.
