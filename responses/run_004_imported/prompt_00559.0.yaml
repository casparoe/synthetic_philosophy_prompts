      *   **Instrumental Convergence Thesis (Omohundro/Bostrom):** Most final goals imply certain sub-goals (instrumental goals) because those sub-goals increase the probability of achieving the final goal. It's a claim about *optimal strategies* given a goal. It says nothing about the final goal itself.

