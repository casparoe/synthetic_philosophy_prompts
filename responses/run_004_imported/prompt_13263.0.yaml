answer: |-
  I need to stop you before you draft that paper, because the premise you are working from is historically incorrect. In fact, it is one of the most famous cautionary tales in the history of science.

  If you open your paper asserting that Hobbes had "genuine mathematical bona fides" or that contemporaries like John Wallis respected his constructions, your seminar leader (if they know early modern history) will likely flag it as a significant error.

  Here is the historical reality, followed by how you can pivot your argument to make it even stronger without relying on that false premise.

  ### 1. The Historical Reality: Hobbes was not a respected mathematician
  Hobbes did not discover any solid results in angle division or circle quadrature. On the contrary, he became notorious for claiming he had solved the ancient problem of **squaring the circle**, which he had not.

  *   **The Wallis Feud:** John Wallis, the Savilian Professor of Geometry at Oxford and one of the preeminent mathematicians of the 17th century (and a founder of the Royal Society), engaged in a public, decades-long feud with Hobbes. Wallis systematically dismantled Hobbes's proofs, showing them to be riddled with elementary errors.
  *   **The Consensus:** The mathematical community did not respect Hobbes's constructions. They viewed him as an arrogant amateur who refused to accept correction. Hobbes published his erroneous proofs in *De Corpore* (1655) and continued to defend them against Wallis's refutations (such as Wallis's *Elenchus Geometriae Hobbianae*) well into the 1670s, when Hobbes was in his 80s.
  *   **The Impossibility:** While the formal proof that squaring the circle is impossible (due to $\pi$ being transcendental) didn't come until Lindemann in 1882, the mathematical consensus in Hobbes's time, led by figures like Viète and later Wallis, was already clear that Hobbes's specific geometric methods were fundamentally flawed.

  ### 2. Why the Misconception Exists
  It is very easy to see why you assumed he was competent. Hobbes *rhetorically* leans on geometry constantly. He fell in love with Euclid's method later in life (legend says he encountered Euclid's *Elements* at age 40 and was amazed by the certainty of the demonstrations). He wanted political philosophy to have that same certainty.

  However, there is a massive gap between **Hobbes's methodological aspiration** (philosophy *should* be like geometry) and **Hobbes's mathematical performance** (Hobbes was actually bad at geometry).

  ### 3. How to Save Your Paper (The Pivot)
  You do not need to scrap your paper. In fact, acknowledging his mathematical failure makes his philosophical project more interesting.

  Instead of arguing that his method felt credible because he was a **good mathematician**, argue that his method felt credible because geometry represented the **gold standard of certainty** in the 17th century, and Hobbes was attempting to appropriate that authority *despite* his lack of technical success.

  This shifts your argument from "Hobbes applied his mathematical expertise to politics" to "Hobbes used the *ideal* of mathematics to rescue politics from uncertainty, even as he failed to master mathematics itself." This is a much more nuanced and defensible thesis.

  ### 4. Suggested Opening Lines
  Here are three options for opening your paper that are historically accurate but still set up your philosophical analysis:

  **Option A (Focus on Aspiration vs. Reality):**
  > "Thomas Hobbes famously held up geometry as the only model for true philosophical knowledge, seeking to derive the obligations of the commonwealth with the same necessity as Euclid derived theorems. Yet, while Hobbes demanded geometric certainty in civil philosophy, his own contemporaries—most notably John Wallis—vehemently rejected his actual mathematical competence. This tension suggests that Hobbes's 'geometrical method' was less a reflection of his mathematical prowess and more a rhetorical strategy to impose order on the chaos of human conflict."

  **Option B (Focus on the Authority of Method):**
  > "For Hobbes, the appeal of geometry lay not in the specific constructions of lines and circles, but in the settlement of dispute through definition and deduction. Although his own attempts at mathematical innovation were dismissed by the Royal Society as erroneous, his insistence on a 'geometrical' structure for *Leviathan* reveals a deeper ambition: to transplant the indisputable authority of mathematics into the contested realm of political obligation."

  **Option C (Direct & Nuanced):**
  > "Hobbes's obsession with the geometrical method is well-documented, but his success in practicing it is not. While he failed to gain recognition as a mathematician—engaging in decades-long disputes over erroneous proofs of circle quadrature—his commitment to the *form* of geometric reasoning remained the backbone of his political theory. This paper argues that..."

  ### Summary for your research:
  *   **Do not cite:** Any specific mathematical results by Hobbes (they are considered errors).
  *   **Do cite:** The feud with John Wallis; *De Corpore* (1655); Wallis's *Elenchus Geometriae Hobbianae* (1655).
  *   **Key Takeaway:** Hobbes's "geometrical method" is a **philosophical metaphor** and a **normative goal**, not a description of his actual scientific track record.

  If you make this distinction, your paper will show a much higher level of historical literacy and philosophical insight.
