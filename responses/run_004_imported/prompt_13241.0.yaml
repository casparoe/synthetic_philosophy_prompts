      *   **Part (b):** Briefly describe one expressivist strategy in response. Key concepts needed: Consistency of attitudes, Blackburn's quasi-realism, Gibbard's norm-expressivism, or similar (need to check if the student's answer is accurate).

  3.  **Analyze the Student's Draft:**

      *   **Part (a) Analysis:**
          *   *Claim:* Expressivism = venting feeling ('Boo cruelty!'). -> *Accurate simplification.*
          *   *Claim:* In premise (1) (conditional), 'cruelty is wrong' is in an 'if' clause, not asserted/expressing disapproval. -> *Accurate.*
          *   *Claim:* For modus ponens to work, meaning must be the same (univocal) in (1) and (2). -> *Accurate.*
          *   *Claim:* Expressivism says meaning = attitude expressed. Since no attitude in (1), meaning differs (or is absent). -> *Accurate diagnosis of the problem.*
          *   *Claim:* Therefore, expressivist must admit reasoning isn't valid as ordinarily assumed. -> *Accurate conclusion of the problem.*
          *   *Critique:* This is a very strong explanation. It hits the core logical issue (univocality/embedded contexts) clearly. It identifies the threat to validity.

      *   **Part (b) Analysis:**
          *   *Claim:* Response goes back to Ayer's original emotivism. -> *Historical Inaccuracy.* Ayer was the target of Geach. Ayer didn't solve it; Geach pointed out Ayer *couldn't* solve it. The solutions came later (Blackburn, Gibbard, etc.).
