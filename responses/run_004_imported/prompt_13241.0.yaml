          *   Historical Attribution: -1 point. Attributing the solution to Ayer is wrong. Ayer is the villain in this story. The solution belongs to Blackburn (Quasi-Realism) or Gibbard. This shows a misunderstanding of the history of the debate, which is often penalized in philosophy courses even if the logic is right.
