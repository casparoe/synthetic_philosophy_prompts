          *   *Claim:* Uttering (1) expresses disapproval of the combination 'disapproving of cruelty, but not disapproving of getting your little brother to be cruel.' -> *This is the standard Blackburnian move.*
          *   *Claim:* Holding (1) and (2) without (3) is an inconsistent set of attitudes. -> *This is the core of the solution (logical consistency mapped to attitudinal consistency).*
          *   *Critique:* The *mechanism* described is correct (Blackburn's solution), but the *attribution* to Ayer is a significant historical error. Ayer's emotivism is precisely what Geach was attacking. Attributing the solution to the originator of the problem is a substantive mistake in understanding the dialectic. However, the *philosophical content* of the solution is actually quite good for an intro student.

