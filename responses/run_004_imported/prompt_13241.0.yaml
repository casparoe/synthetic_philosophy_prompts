      *   *Reasoning for (b) deduction:* In philosophy, knowing *who* argued *what* matters because it reflects understanding the dialectic. Saying Ayer solved Geach is like saying Ptolemy solved Copernicus's problems. It suggests she memorized "Ayer = Emotivism" and "Expressivism = Solution" and mashed them together.

