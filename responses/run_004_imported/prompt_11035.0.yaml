          *   In logic: "Unknown" or "Null".
          *   In Madhyamaka: Often implies the ineffability of the ultimate (*nirvāṇa*), or the collapse of the conceptual framework itself.
      *   **The Goal of the Tetralemma:** Nāgārjuna often rejects *all four* corners eventually. It's not a 4-valued truth system where you pick one; it's a tool to show *none* apply ultimately.

  5.  **Synthesize the Argument:**
