      *   **Hypothesis:** Is Nāgārjuna's doctrine of emptiness (*śūnyatā*) essentially an early anticipation of paraconsistent/many-valued logic? Does it prove reality doesn't respect classical bivalent logic?
      *   **Goal:** Understand the validity and limits of this comparison.

