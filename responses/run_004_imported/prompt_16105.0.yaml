answer: |-
  Here are nine interview questions designed to probe the structural weaknesses of the standing account without being antagonistic. They include the four specific thematic requirements you requested, plus five additional questions to round out the dialectic, ending with the falsification condition.

  Each entry includes the **Question**, the **Anticipated Reply** (based on her published work and typical defenses of this view), and a **Follow-up** designed to prevent the conversation from stalling on that reply.

  ### 1. The "Unclean Hands" Analogy (Required)
  **Question:** You lean heavily on the "unclean hands" doctrine from equity law to motivate the distinction between the *standing* to blame and the *warrant* for the blame. But in law, that doctrine is a procedural bar to relief, not a judgment on the underlying right. When you port this into morality, are you actually explaining *why* the hypocrite lacks standing, or does the legal analogy just relocate the puzzle? In other words, does "unclean hands" do any normative work, or is it just a label for the intuition you're trying to justify?

  *   **Anticipated Reply:** She will likely argue that the analogy isn't doing the justificatory heavy lifting but rather illustrates a structural feature of normative systems: that certain goods (like equitable relief or moral address) are only accessible to those who respect the system's conditions.
  *   **Follow-up:** If it's just a structural feature, though, we need to know what grounds that structure. Is it that the hypocrite's blame is *false*, or that it's *harmful*? If it's neither—if the verdict is true and the uptake is safe—what is the normative cost of allowing the hypocrite to speak?

  ### 2. The Reformed Wrongdoer (Required)
  **Question:** Consider an agent who engaged in hypocritical blame in the past but has since sincerely repudiated that conduct. They no longer claim an exemption from the norm, yet they have never made amends to those they wronged. On your view, standing relies on a commitment to equality. Does the internal shift in attitude restore their standing immediately, or does the unresolved debt to the victims keep their hands unclean indefinitely?

  *   **Anticipated Reply:** She will likely contend that standing is restored once the *claim of exemption* is withdrawn, because the barrier to moral address (the inequality) is removed, even if reparations are still owed.
  *   **Follow-up:** But if they haven't made amends, aren't they still benefiting from a position of privilege relative to the victim? If I refuse to pay a debt I acknowledge I owe, am I truly standing as an equal to the creditor when I demand they pay theirs?

  ### 3. Norm Bleeding (Required)
  **Question:** Let's test the modularity of standing. Suppose I am a chronic liar but have never been cruel. Do I lose the standing to blame you for an act of cruelty? If standing is about a general commitment to the moral community, it seems my dishonesty should bar me. But if it's about specific norms, I should be clear. Which is it, and why doesn't the attitude of superiority inherent in hypocrisy bleed across normative domains?

  *   **Anticipated Reply:** She will likely argue for a "relevance constraint": standing is lost only regarding norms the blamer has violated in a way that implies an exemption from *that* norm (or sufficiently similar ones).
  *   **Follow-up:** That relevance constraint seems to do a lot of work. But isn't the core wrong of hypocrisy the *arrogance* of exempting oneself from morality *as such*? If I treat moral rules as optional for me, why does it matter which specific rule I ignore when I try to hold you to account?

  ### 4. The Generalization Problem (Required)
  **Question:** A common worry in this literature is that if the hypocrisy condition is too demanding, it leads to a kind of moral silence. Since virtually everyone has broken some moral rule at some point, a strict reading of your view threatens to leave almost nobody with standing to blame anybody. How do you set the threshold for "clean enough" hands without making the condition arbitrary or ad hoc?

  *   **Anticipated Reply:** She will likely deny that *any* violation counts; it must be a violation that implies a *commitment* to an exemption, or a pattern of behavior that undermines the claim to equality.
  *   **Follow-up:** But who determines whether a violation implies that commitment? If the standard is "sincere commitment to the norm," doesn't that invite the hypocrite to simply lie about their commitment to regain standing, rendering the bar toothless?

  ### 5. Private Resentment vs. Public Address
  **Question:** Your account frames blame primarily as a mode of moral *address*. But what about the private reactive attitudes? If I discover you are a hypocrite, does that extinguish my private resentment toward your wrongdoing, or just my willingness to express it? If it doesn't extinguish the resentment, is standing really about blame, or just about the social performance of it?

  *   **Anticipated Reply:** She will likely distinguish between the *emotion* of resentment (which is warranted by the wrong) and the *activity* of blaming (which requires standing), arguing the constraint applies only to the latter.
  *   **Follow-up:** Yet, if I feel resentment but acknowledge I lack standing to express it, doesn't that create a fractured moral psychology? It suggests I judge you to be blameworthy but acknowledge I have no right to hold you to that judgment. Is that a stable position?

  ### 6. The "Lesser Hypocrite"
  **Question:** Consider a case of proportionality. I speed occasionally, but you commit fraud. If I blame you for the fraud, am I barred by hypocrisy? Intuitively, it seems my minor violation shouldn't grant you immunity for a major one. Does your account have the resources to explain why the magnitude of the blamer's violation matters, or is the loss of standing binary?

  *   **Anticipated Reply:** She will likely maintain that standing is binary regarding the specific norm: either you claim an exemption from the norm against fraud or you don't; your speeding is irrelevant.
  *   **Follow-up:** But if I claim an exemption from traffic laws, haven't I signaled that I view rules as constraints for *others* rather than *myself*? If that's the signal, why doesn't it undermine my authority to enforce *any* rule, regardless of magnitude?

  ### 7. Vicarious Blame
  **Question:** How does your account handle third-party blame? If I witness you harming someone else, I haven't necessarily violated the norm against harm myself. But if I am a hypocrite about honesty, do I lose the standing to blame you for cruelty on behalf of the victim? Does standing attach to the agent or the norm?

  *   **Anticipated Reply:** She will likely argue that vicarious blame draws on the community's standing, not the individual's, so personal hypocrisy matters less unless it undermines one's role as a community representative.
  *   **Follow-up:** But in informal contexts, we aren't appointed representatives; we're just peers. If my hands are unclean, doesn't my intervention look less like community enforcement and more like meddling? Why doesn't the hypocrisy condition apply with full force there?

  ### 8. Warrant and Uptake
  **Question:** You insist that standing and warrant are separate: a hypocrite can deliver a true verdict. But if the function of blame is to secure moral recognition from the blamed, doesn't the hypocrite's lack of standing guarantee a failure of uptake? If the blamed can rightly reject the blame *because* of the hypocrisy, doesn't that make the blame functionally infelicitous, regardless of its truth?

  *   **Anticipated Reply:** She will likely agree that uptake is compromised but insist that the *truth* of the accusation remains intact, preserving the objective warrant even if the communicative act fails.
  *   **Follow-up:** If the communicative act fails systematically, though, what work is the "warrant" doing? If the verdict cannot be successfully received as blame, are we really talking about a distinct normative property, or just a theoretical distinction without a practical difference?

  ### 9. Falsification Conditions (Required)
  **Question:** Finally, I want to ask about the resilience of the view. You have a robust set of replies for the standard counterexamples—the reformed wrongdoer, the lesser hypocrite, the third-party blamer. Given that flexibility, what sort of case or intuition would actually count as evidence against your view? Is there a scenario where your theory says "no standing," but the moral cost of silencing the blamer is so high that you would concede the theory needs revision?

  *   **Anticipated Reply:** (Open) She may point to a case where the hypocrite is the *only* available agent to stop a grave harm, or where the hypocrisy is entirely private and unknown.
  *   **Follow-up:** (To be improvised based on her answer, but aim here is to see if she admits any trade-off between standing and consequences).
