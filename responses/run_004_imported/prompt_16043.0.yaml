answer: |-
  1. **The Intuition of Waste**
  Zahavi's original insight was deeply counter-intuitive: he argued that natural selection favors signals *because* they are wasteful, not despite it. In your view, is the "waste" itself the message, or is the waste merely the tax required to send a message about something else, like genetic viability?

  *Follow-up:* If she argues the waste is the message: "But if the waste is the message, doesn't that imply evolution is actively selecting for reduced efficiency? How do you reconcile that with the general trend of organisms optimizing energy use in other contexts?"

  2. **The Mathematical Rescue (Grafen vs. Maynard Smith)**
  When Zahavi first proposed the principle, theoretical biologists like John Maynard Smith rejected the verbal logic as evolutionarily unstable. Alan Grafen later produced game-theoretic models showing how costly signaling could be an evolutionarily stable strategy (ESS). Do you view Grafen's mathematics as simply translating Zahavi's biological intuition into a language theorists would accept, or did the modeling actually correct a fundamental flaw in Zahavi's original reasoning?

  *Follow-up:* If she argues Grafen corrected the logic: "Does that reliance on formal modeling risk turning the principle into a tautology, where we assume honesty because the model requires it, rather than testing if the biology actually fits the equations?"

  3. **Strategic vs. Efficacy Costs**
  There is an ongoing debate about whether the cost of a signal like a peacock's tail is a "strategic cost" that actively enforces honesty by punishing low-quality liars, or merely an "efficacy cost" incurred because a signal must be large to be detectable. Which interpretation does your empirical work support, and does the distinction matter for the evolutionary outcome?

  *Follow-up:* If she argues for strategic cost: "But if the cost is purely strategic, why do we see such variation in signal efficiency across different environments? Doesn't that suggest ecological visibility (efficacy) drives the design more than the handicap mechanism itself?"

  4. **Distinguishing from Fisherian Runaway**
  A Fisherian runaway process can produce extravagant ornaments that look exactly like handicaps but carry no information about underlying quality, driven solely by a self-reinforcing preference. Beyond measuring viability correlations, what specific empirical signature would allow us to definitively rule out a runaway process in favor of the handicap principle in a wild population?

  *Follow-up:* If she suggests looking for condition-dependence: "But condition-dependence can evolve in runaway traits too. Is there a scenario where the two processes are mathematically indistinguishable in practice, meaning the debate is purely theoretical?"

  5. **Physiological Mechanisms**
  For the handicap principle to work, there must be a physiological link between the signal and the organism's quality, often hypothesized to be the immune system or stress response. In your research, have you identified a specific biochemical pathway that acts as the "tax collector" ensuring the signal remains honest?

  *Follow-up:* If she cites immunocompetence: "Given that immune function is incredibly complex and context-dependent, is it risky to anchor the whole theory on a single physiological mechanism that might vary wildly between taxa?"

  6. **The Human Extension**
  You have extended this logic to human behavior, specifically costly religious rituals like fasting or pilgrimage. In biology, the "receiver" is often a potential mate or rival. In the context of religion, who is the receiver of the signal, and how does the "honesty" of the signal benefit the group rather than just the individual signaler?

  *Follow-up:* If she argues it signals commitment to the group: "But secular groups also demand costly commitments without the supernatural element. Does the handicap principle require the religious belief itself, or just the cost of the ritual, to function?"

  7. **Cheating and Stability**
  If a signal is truly honest because it is too costly to fake, we should theoretically see very little cheating. Yet, we observe mimics in nature and hypocrites in human society. How does the handicap principle account for the persistence of low-quality individuals who successfully bluff the signal?

  *Follow-up:* If she says cheating is suppressed but inevitable: "At what threshold of cheating does the signal lose its value entirely? Is there a point where the system collapses, and do we see evidence of that collapse in any populations?"

  8. **Popular Misapplication**
  The handicap principle has become a popular meme in evolutionary psychology, sometimes used to explain everything from luxury car purchases to extreme sports. Where do you see the principle being most frequently misapplied or overstretched in discussions of human behavior?

  *Follow-up:* If she mentions luxury goods: "If luxury goods are handicaps, they should correlate with underlying quality, not just wealth. Have we seen data suggesting that high spenders actually possess better genetic or phenotypic quality, or is the signal decoupled?"

  9. **Future Frontiers**
  Most classic tests of the handicap principle focus on sexual selection in birds or insects. Where do you see the most promising frontier for testing this theory next? Is it in microbial signaling, cooperative breeding, or perhaps deeper into human cultural evolution?

  *Follow-up:* If she suggests human cultural evolution: "Is it possible to build rigorous ESS models for cultural transmission that are comparable to the genetic models Grafen built, or does the speed of cultural change break the evolutionary assumptions?"

  10. **Falsification**
  Finally, Karl Popper argued that a theory is only scientific if it can be falsified. What specific observation in nature—be it in animal signaling or human ritual—would force you to abandon the handicap principle entirely?

  *Follow-up:* If she suggests a lack of cost-quality correlation: "If such a study were conducted and showed no correlation, would proponents of the theory simply argue that we haven't yet identified the *correct* cost, thereby insulating the theory from refutation?"
