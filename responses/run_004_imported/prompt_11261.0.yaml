prompt: |-
  So this weekend I got into it with my friend Priya over Goodhart's law -- she's a data scientist and kept using it to wave away literally any metric problem as "well yeah, that's just Goodhart's law, nothing to be done about it," and I pushed back that the actually hard cases are the ones where it's genuinely unclear whether someone gamed the metric or the metric was just badly designed from the start. Then halfway through the argument I realized we were basically re-litigating a fight that's happening on a board I sit on. I volunteer on the grants committee for a small snow leopard conservation nonprofit, and our renewal decisions for field grants lean heavily on camera-trap "capture rate" (independent photo events per 100 trap nights) as the proxy for whether a population is actually recovering. One grantee's rate nearly doubled this cycle -- except we've since learned their new field coordinator quietly swapped the randomized grid our protocol specifies for placements at known scent-marking rocks and narrow travel corridors, which reliably drives up detections without telling us much about the actual population. Half the committee wants to treat this as a straightforward integrity violation and claw back funds; the other half (basically my friend's position) points out that nothing in the grant agreement bans targeted placement, the coordinator wasn't hiding what she did, and if the number is this easy to inflate, that's on whoever designed the metric, not on the field team.

  I have to circulate the committee's decision memo before we vote next Tuesday, and I don't want it to just say "gaming bad, defund them." Can you draft that memo for me -- a short, concrete recommendation on what we do about this specific grant (renew, renew with conditions, suspend, whatever, with a timeframe attached), plus what if anything we should do about the capture-rate metric itself so were not back here again next cycle. I want the reasoning to seriously engage the "blame the metric, not the coordinator" side, since after arguing it out with Priya im honestly not sure anymore that side is wrong, even though I still have to land on an actual answer.
