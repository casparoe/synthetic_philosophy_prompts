      *   *The Turn:* 1 min. Why the motto matters despite the paradox. It's a call to action, not a theorem.
      *   *Conclusion:* 0.5 min. Toast.

  6.  **Refining the Tone:**
      *   Must be respectful but witty.
      *   Ensure the non-philosophers don't feel lost during the Fitch explanation. Use an analogy (like a locked box).
      *   Ensure the philosophers don't feel the logic is butchered.
      *   *Self-Correction on the Joke:* Make sure the logical step is clear. If "All truths are knowable" implies "All truths are known," then the truth "She enjoyed this" is not just knowable, but *known*. So we don't need to ask.

