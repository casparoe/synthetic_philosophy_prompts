prompt: |-
  So I've been reading a bunch of rationalist/LessWrong-style blog posts on calibration and Bayesian updating (yes, I'm a software engineer, we can't help ourselves), and I keep running into this concept philosophers call 'epistemic akrasia' - basically believing P while also believing your evidence doesn't support P. I've got zero formal philosophy training, but I do remember 'akrasia' from a college gen-ed as the classic weakness-of-will thing, like Aristotle's guy who knows the donut is bad for him and eats it anyway. Can you properly compare the two - epistemic akrasia vs. classic Aristotelian/practical akrasia - and tell me what, if anything, makes the epistemic version special? My hunch is it's got something to do with 'higher-order evidence' (evidence about whether your own reasoning can be trusted) creating some weird rational bind that doesn't have a clean analogue on the practical side, but i can't quite articulate why, so don't just tell me their basically the same thing dressed up differently - actually dig into the disanalogies.
