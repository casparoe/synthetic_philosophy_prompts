      *   **Epistemic Akrasia:** Belief vs. Higher-Order Belief. "I believe $P$, but I believe my evidence doesn't support $P$." Involves belief formation, rationality, and truth-tracking.
      *   **The "Rationalist" Context:** LessWrong often talks about calibration (matching confidence to accuracy) and updating. Epistemic akrasia is a failure of calibration or a failure to update on higher-order evidence (e.g., "I'm tired," "I'm biased").

  3.  **Evaluate the User's Hunch (Higher-Order Evidence):**
