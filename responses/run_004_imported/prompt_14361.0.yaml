      *   *4. Resolution Mechanisms:* Practical akrasia is solved by willpower, habit, or pre-commitment. Epistemic akrasia is solved by... what? You can't just "will" yourself to stop believing $P$ if the evidence looks like $P$ to you. This is the "Uniqueness" vs. "Permissivism" debate in epistemology.
      *   *5. The "Moore's Paradox" Angle:* "It is raining, but I don't believe it." Epistemic akrasia is close to "P is true, but I shouldn't believe it." It feels absurd in a way "I'm dieting, but I'm eating" doesn't.

