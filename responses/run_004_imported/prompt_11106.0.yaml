      *   **Sober & Wilson's Position:** In *Unto Others*, they argue for Multilevel Selection (MLS). They claim that selection can operate at multiple levels simultaneously. They argue that kin selection and group selection are often mathematically equivalent (the "translation" argument) but that the *causal interpretation* matters. They specifically argue that altruism evolves via within-group selection (against altruists) and between-group selection (for altruists). They often frame kin selection as a *type* of group selection (or at least compatible with it).
