prompt: |-
  I'm the patient representative on my hospital's genomics ethics advisory committee -- they always want atleast one non-doctor in the room so it's not just clinicians talking to clinicians. We do whole-genome sequencing for a bunch of reasons, diagnostic and research both, and every so often it turns up what the geneticists call a "secondary finding" that has nothing to do with why the test was ordered in the first place. Nobody argues about the findings you can actually act on, like a BRCA mutation. The fight that's eaten our last three meetings is about the other bucket: serious, well-established findings for conditions with no treatment or prevention at all, like a variant that hugely raises your lifetime odds of something like Huntington's or early-onset Alzheimer's. Right now patients tick a box up front opting out of ever hearing about that bucket, and roughly a third of them do.

  Two of our physicians want to kill the opt-out entirely, and one of them keeps citing something he calls "Good's theorem" from decision theory. I looked it up on my own since none of this is my background -- as far as I can tell it's an old result showing that for a rational Bayesian decision-maker, cost-free information can never leave you worse off in expectation, since you can always just act like you never saw it. His argument is basically that withholding accurate information from a competent adult can't make them better off, full stop, so the opt-out is just paternalism wearing an "autonomy" costume. Our nurses and the hospital chaplain are pushing back with "right not to know" arguments -- dread, insurance and family fallout, and the fact that there's no decision left to make once nothing can be treated or prevented. I've been reading around this on my own time and I have to admit the "information can't hurt a rational person" argument sounds pretty airtight to me, but something about applying it here feels off and I can't pin down what.

  Could you write the short decision memo I'd actually bring to our next meeting? I need it to land on one concrete recommendation -- keep the opt-out, drop it, or change what it covers -- with a rough timeline for rolling whatever we pick into next year's consent forms. And it has to really engage with the Good's-theorem argument rather than just wave it off, because the doctor pushing it is sharp and will notice immediately if the memo dodges instead of showing exactly where, if anywhere, the argument stops applying to a case like this.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Patient Representative on a Hospital Genomics Ethics Advisory Committee.
      *   **Audience:** Committee members (clinicians, geneticists, nurses, chaplain, administrators). Specifically, one physician is pushing hard based on "Good's Theorem."
      *   **Issue:** Secondary findings in Whole Genome Sequencing (WGS). Specifically, the "no treatment/prevention" bucket (e.g., Huntington's, early-onset Alzheimer's).
      *   **Current Policy:** Patients can opt-out of receiving these findings (approx. 1/3 do).
      *   **Proposed Change:** Two physicians want to eliminate the opt-out, citing Good's Theorem (information is never harmful to a rational agent).
      *   **Opposition:** Nurses/Chaplain cite "Right Not to Know," psychological harm, insurance/family issues.
      *   **Task:** Write a short decision memo.
      *   **Requirements:**
          *   Land on one concrete recommendation (Keep, Drop, or Modify).
          *   Include a timeline for implementation (next year's consent forms).
          *   *Crucially:* Engage directly and rigorously with Good's Theorem. Do not wave it off. Explain *why* it might not apply here.
          *   Tone: Professional, persuasive, ethically grounded, accessible but intellectually rigorous.

  2.  **Deconstruct Good's Theorem in this Context:**
      *   *What is it?* I.J. Good (1967) proved that for a rational Bayesian agent, the expected value of free information is non-negative. You can always ignore it, so having it can't hurt your expected utility.
      *   *Why does the physician like it?* It frames information as inherently good and withholding it as paternalistic.
      *   *Why might it fail here?*
          1.  **Cost is not zero:** The theorem assumes *cost-free* information. Psychological distress, insurance discrimination, family tension, and existential dread are *costs*.
          2.  **Rationality assumptions:** Humans are not perfect Bayesian updaters. We suffer from cognitive biases, anxiety, and depression. Knowing you have a 100% chance of a horrific death *changes* your utility function, not just your probability estimates.
          3.  **Actionability:** The theorem relies on the ability to *act* on information to maximize utility. If no action is possible (no treatment/prevention), the information doesn't help optimize decisions; it only constrains the psychological state.
          4.  **Identity/autonomy:** Some philosophical arguments suggest that certain knowledge fundamentally alters the self in a way that reduces autonomy (e.g., living in the "shadow" of a disease).

  3.  **Determine the Recommendation:**
      *   *Drop the opt-out?* Too risky. Violates the "Right Not to Know" which is recognized in international bioethics (UNESCO, Council of Europe). Ignores psychological harm.
      *   *Keep status quo?* Safe, but doesn't address the physicians' valid point about autonomy and consistency.
      *   *Modify/Refine?* This is usually the best committee compromise. Strengthen the counseling process, maybe categorize findings differently, but *keep the opt-out*.
      *   *Decision:* **Keep the opt-out, but enhance the pre-test counseling.** Why? Because Good's Theorem fails on the "cost-free" assumption. The psychological and social costs are real and significant. Respecting the "Right Not to Know" is a recognized ethical standard that supersedes a theoretical decision-theory model when human welfare is at stake.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Background:** Briefly recap the conflict (Secondary findings, untreatable conditions, Good's Theorem argument).
      *   **Analysis of Good's Theorem:** This is the core requirement. I need to show I understand it but explain its limitations in a clinical/psychological context.
          *   Point 1: Information is not cost-free (psychological/social costs).
          *   Point 2: Humans aren't ideal Bayesian agents (emotional impact affects decision-making capacity).
          *   Point 3: The nature of "utility" in medicine includes psychological well-being, not just physical outcomes.
      *   **Ethical Framework:** Mention the "Right Not to Know" (UNESCO Declaration on the Human Genome and Human Rights).
      *   **Recommendation:** Retain the opt-out.
      *   **Implementation Plan:** Timeline for consent form updates and counseling protocols.

  5.  **Refining the Argument against Good's Theorem (Self-Correction/Nuance):**
      *   *Initial thought:* Just say "people get sad."
      *   *Correction:* Too weak. The doctor will crush that.
      *   *Better argument:* Good's Theorem assumes the utility function remains stable. But receiving a Huntington's diagnosis *changes* the patient's life experience (utility) immediately, regardless of physical symptoms. It introduces a "psychological cost" that violates the "cost-free" premise. Also, information asymmetry in insurance markets creates tangible financial costs.
      *   *Key phrase:* "Information is not cost-free in a psychosocial context."

  6.  **Tone Check:**
      *   Needs to be respectful to the physician (acknowledge the logic) but firm on the patient perspective.
      *   Needs to sound like a patient rep who has done their homework.
      *   Avoid jargon where possible, but use the specific terms (Bayesian, utility) correctly to show competence.

  7.  **Final Polish:**
      *   Check the timeline (next year's consent forms).
      *   Ensure the recommendation is actionable.
      *   Make sure the "Right Not to Know" is framed as an ethical counterpart to "Good's Theorem."

  8.  *(Self-Correction during drafting)*: I initially thought about suggesting a tiered system. But the prompt asks for a decision on the *opt-out*. Let's stick to keeping the opt-out but making the choice more informed. That addresses the autonomy concern without forcing information.

  9.  **Final Review against constraints:**
      *   Short decision memo? Yes.
      *   Concrete recommendation? Yes (Keep opt-out).
      *   Timeline included? Yes.
      *   Engages Good's Theorem? Yes, deeply.

  (Proceed to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Genomics Ethics Advisory Committee
  **FROM:** Patient Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Opt-Out Protocols for Untreatable Secondary Findings

  **Executive Summary**
  This memo recommends **retaining the current opt-out provision** for secondary findings related to serious, untreatable conditions (e.g., Huntington's disease, early-onset Alzheimer's), while enhancing the pre-test counseling process to ensure the choice is fully informed. While the argument based on Good's Theorem is mathematically sound in abstract decision theory, it relies on assumptions that do not hold in a clinical psychosocial context. Eliminating the opt-out risks violating the internationally recognized "Right Not to Know" and imposes non-zero psychological and social costs on patients.

  **Background**
  The Committee is currently divided on whether to remove the patient's ability to opt-out of receiving secondary genomic findings for conditions with no available treatment or prevention.
  *   **Proposal:** Two physicians propose mandating disclosure of all actionable and non-actionable serious findings.
  *   **Rationale:** This position relies heavily on **Good's Theorem** (1967), which posits that for a rational agent, free information always has non-negative expected value, as the agent can choose to ignore it. Withholding information is therefore viewed as paternalistic.
  *   **Counter-argument:** Nursing and chaplaincy staff argue that knowledge of untreatable fatal conditions causes psychological harm, affects insurability, and alters family dynamics without offering medical benefit.

  **Analysis of Good's Theorem in Clinical Context**
  We must engage directly with Good's Theorem, as it forms the backbone of the proposal to mandate disclosure. The theorem states that $E[U|Info] \geq E[U|No Info]$ provided three conditions are met. In our setting, these conditions fail:

  1.  **The "Cost-Free" Assumption:** Good's Theorem assumes information is free. In genomics, information regarding untreatable neurodegenerative conditions carries significant **psychosocial costs**. These include anticipatory grief, anxiety, potential depression, and familial strain. If the "cost" of acquiring the information ($C$) is greater than zero, the theorem's inequality no longer guarantees a net benefit. For many patients, the psychological burden constitutes a negative utility that outweighs the theoretical value of the data.
  2.  **Stability of the Utility Function:** The theorem assumes a rational agent maximizes a stable utility function. However, receiving a diagnosis for an untreatable condition fundamentally **alters the patient's lived experience** (their utility function) immediately, not just upon symptom onset. A patient living with the knowledge of inevitable early-onset Alzheimer's makes different life choices (career, family planning, savings) than they would without that knowledge. This is not "ignoring" the information; it is being transformed by it.
  3.  **Bounded Rationality:** The theorem applies to ideal Bayesian updaters. Clinical experience shows that patients do not process probabilistic risk neutrally. A high-probability variant for a devastating disease can induce cognitive states (dread, fatalism) that impair decision-making capacity regarding *other* health matters, potentially lowering overall health outcomes.

  **Ethical Framework**
  Bioethics recognizes autonomy not only as the right to know but as the **Right Not to Know**. This is codified in the *UNESCO Universal Declaration on the Human Genome and Human Rights* (1997) and the *Council of Europe's Convention on Human Rights and Biomedicine* (1997). Autonomy includes the right to protect one's own psychological integrity. Mandating disclosure treats patients as data repositories rather than moral agents with the right to curate their own life narrative.

  **Recommendation**
  **Retain the opt-out provision.**
  Removing the opt-out privileges abstract decision theory over concrete patient welfare. While we should encourage patients to receive medically relevant information, we cannot ethically mandate information that offers no clinical intervention pathway while carrying documented psychological risks.

  **Implementation Plan & Timeline**
  To address the physicians' concern that patients may be opting out due to confusion rather than genuine preference, we will strengthen the consent process.

  *   **November 2023 – January 2024:** Genetic counseling team to develop a standardized "Secondary Findings Decision Aid." This tool will explicitly clarify the difference between *treatable* findings (where opt-out is discouraged) and *untreatable* findings (where opt-out is protected).
  *   **February 2024:** Draft revised consent language. The form will require a specific initial for the "Untreatable Secondary Findings" section, ensuring the opt-out is an active choice, not a default oversight.
  *   **March 2024:** Committee review of new materials.
  *   **July 2024:** Roll out updated consent forms for the new fiscal year.
  *   **Ongoing:** Monitor opt-out rates and patient satisfaction surveys. If opt-out rates drop significantly with better counseling, we have achieved autonomy without coercion. If they remain stable, we have confirmed that the desire not to know is robust.

  **Conclusion**
  Good's Theorem is a powerful tool for information economics, but it is not a sufficient ethical framework for human genomics. By retaining the opt-out, we acknowledge that for a human being, information is not just data—it is an experience. We must respect the patient's right to decide which experiences they are prepared to endure.
