answer: |-
  First off, take a deep breath. This is a genuinely interesting rabbit hole, and unlike most procrastination spirals, it's actually within your research wheelhouse. However, since this is for a dissertation footnote, we need to move from "exciting reconstruction" to "defensible scholarly claim."

  Here is the breakdown of the textual evidence, the secondary literature, and how to cite this without inviting a brutal objection from your committee.

  ### 1. The Philosophical Substance
  Your synthesis is sharp. You are effectively reconstructing a **Gödelian Metaphysical System**:
  1.  **Gibbs Lecture (1951):** The mind is not a finite machine (anti-mechanism).
  2.  **Ontological Proof (1941/1970):** A God-like being necessarily exists (modal theism).
  3.  **Conclusion:** If the mind is non-physical and God exists (and is rational/just), the mind survives physical death.

  **The Catch:** Gödel never explicitly formalized this syllogism in a single text. He held these views concurrently, and they are consistent with his Leibnizian monadology, but treating the letter to his mother as the "layman's version of the Ontological Proof" is slightly risky. The letter (March 1961) is more about the *rationality of the world* and consolation regarding his father's death, whereas the Ontological Proof is a rigorous modal derivation.

  The link between them is **Leibniz**. Gödel viewed his Ontological Proof as a formalization of Leibniz, and his anti-mechanism as a defense of Leibnizian monads against physicalism. The afterlife is a consequence of the monad's indestructibility, guaranteed by God.

  ### 2. The Citation Strategy
  There is **no standard secondary citation** that presents this exact combination as a settled "Gödelian Argument for the Afterlife." If you cite a paper by Sobel or Anderson, they will focus strictly on the modal logic of the Ontological Proof, not the Gibbs/Afterlife synthesis.

  **You should not cite the letter alone** as if it carries the weight of the proof. Instead, you need to cite the **biographical/philosophical record** that connects these dots.

  **The Gold Standard:**
  **Hao Wang, *A Logical Journey: From Gödel to Philosophy* (1996).**
  Wang is the primary source for Gödel's informal philosophical conversations. Wang explicitly records Gödel's views on the mind/machine distinction, his theism, and his belief in an afterlife (see particularly Chapter 8 and 9). Wang is the bridge between the technical *Collected Works* and the biographical letters.

  **Recommended Footnote Structure:**
  1.  **Primary Sources:** Cite the Gibbs Lecture (*Collected Works* Vol. III) and the Ontological Proof (*Collected Works* Vol. III or IV depending on edition).
  2.  **The Synthesis:** Cite **Wang (1996)** for the connection between his anti-mechanism, his theism, and his personal belief in an afterlife.
  3.  **The Letter:** Cite the letter (found in *Collected Works* Vol. IV or via Wang) as *illustrative* of his personal conviction, not as the argument itself.

  ### 3. Dissertation Risk Management
  Since you are in a Phil Math PhD program, your committee will likely contain a Gödel skeptic or a logicist who hates metaphysical overreach. To protect yourself:

  *   **Use Hedging Language:** Do not write "Gödel's argument for an afterlife is..." Instead, write: "Gödel's informal remarks suggest a synthesis of his anti-mechanism thesis and his ontological commitments..." or "As reconstructed from his conversations with Wang..."
  *   **Distinguish Formal vs. Informal:** Make it clear that the Ontological Proof is a formal fragment, while the Afterlife claim is a metaphysical consequence he drew from his broader Leibnizian system, not a theorem of the proof itself.
  *   **Acknowledge the Gap:** Briefly acknowledge that Gödel did not publish a unified treatise on this. This shows you know the literature isn't seamless.

  ### 4. Specific References to Grab
  *   **Gibbs Lecture:** Gödel, K. (1951). "Some Basic Theorems on the Foundations of Mathematics and their Implications." *Collected Works Vol. III*.
  *   **Ontological Proof:** Gödel, K. (1995). "Ontological Proof." *Collected Works Vol. III*. (Also see Sobel 1987 for the logic).
  *   **The Synthesis/Afterlife:** Wang, H. (1996). *A Logical Journey*. MIT Press. (Specifically sections on "Gödel's Theism" and "Mind and Machine").
  *   **The Letter:** Gödel to his mother, March 1961. (Reprinted in Wang, or in *Collected Works Vol. IV* biographical section).

  ### Summary Advice
  You've got the intuition right, but don't present it as a "hidden formal proof" Gödel left behind. Present it as a **systematic reconstruction of his Leibnizian Platonism**, using Wang as your guide.

  Now, close this tab. You have a lit review to finish, and unlike Gödel's God, your deadline is contingent, not necessary. Get back to work.
