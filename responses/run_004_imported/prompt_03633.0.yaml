  **Syracuse, New York | May 1851**
  **The anteroom of the Free Church, moments after the adjournment of the American Anti-Slavery Society.**

  **William Lloyd Garrison:** Frederick, wait. Do not walk past me as if we are strangers. You stood upon that platform today and severed a bond that I thought forged in fire. You told them the Constitution is an anti-slavery document. You told them my life's work—the truth I preached while you were still in bonds—was a moral error. How can you ask this movement to trust a charter that every court in the land enforces as a slaveholder's contract?

  **Frederick Douglass:** William, I ask the movement to trust the law as it is written, not as it is whispered. For ten years I agreed with you, but I have come to see that we have been reading the Constitution through the eyes of the slaveholder, accepting his construction of it. The document never once uses the words "slave" or "slavery." It speaks of "persons," of "service," of "importation." Why must we allow the odious private intentions of men long dead to override the actual words they chose to put to paper?

  **Garrison:** Because the law is not a riddle, Frederick; it is a historical compact! We know what those men meant in Philadelphia. We know the three-fifths clause was a bargain to give the South political dominance. We know the fugitive clause was a price paid for union. What licenses you to read a founding legal text against the known intentions and historical compromises of the men who wrote it? To ignore that context is not interpretation; it is fantasy.

  **Douglass:** It is not fantasy to demand that a public law serve public ends. If a man writes a deed that says he gives his land for a school, but privately intends it for a gambling den, the law honors the deed, not the secret thought. The Preamble declares the purpose: to "secure the Blessings of Liberty." If the text is ambiguous, as you say, why must we construe it in favor of the chain rather than the liberty it promises? Why should a secret sin bind the conscience of the present?

  **Garrison:** Because the machinery of the state runs on that sin! You speak of the Preamble, but I speak of the Fugitive Slave Clause. It commands that persons "held to service" shall be delivered up. To vote for a Congressman under this system is to swear an oath to uphold that clause. What is practically gained by pretending the document is other than what it has always been enforced as? You only implicate yourself in the crime you seek to end.

  **Douglass:** What is practically gained is the ballot box, William! If we declare the Constitution a covenant with death, we abdicate our political power. We tell the colored freeman he has no weapon but moral suasion, while the slaveholder has the law, the army, and the vote. What follows practically from declaring the country's founding law permanently beyond redemption? It leaves the government wholly in the hands of the oppressor. I would rather wield the weapon than shun it.

  **Garrison:** You cannot wield a poisoned sword without cutting your own hand. The courts will not read your Preamble; they read the property rights of the master. By telling the people the Constitution is friendly to them, you soften the horror of their bondage. You make them believe they can vote away slavery within a system designed to protect it. That is not strategy; it is a dangerous delusion that will blunt the sharp edge of abolition.

  **Douglass:** The edge is blunted only if we refuse to sharpen it. I do not say slavery is legal; I say the Constitution, rightly read, makes it illegal. It is a battlefield of interpretation, William. If we concede the text to the slaveholder without a fight, we lose the moral high ground of the law itself. We must force the courts to choose between the word "slave" which is absent, and the word "Liberty" which is paramount. To refuse to fight on that ground is to surrender the field.

  **Garrison:** You fracture the unity of the cause to fight a legal battle we cannot win. The North will not rally to a constitutional technicality when their economic ties bind them to the South. I fear you are walking into a trap of compromise, where you will soon be bargaining for votes rather than demanding immediate emancipation. You were my protégé, Frederick; do not become a politician.

  **Douglass:** I am no politician, but I am a man who sees a new path. Unity is precious, William, but not if it is unity in error. If my change of mind fractures the movement, let it fracture, provided it reforms on a basis of truth and power. I cannot ask the enslaved to wait for a disunion that may never come, when there is a tool for their freedom sitting in the very hall where we stand.

  **Garrison:** Then we must part, for I cannot follow where you lead. I stand on the rock of "No Union with Slaveholders." I will not stain my soul by participating in a government that treats men as chattel. If the Constitution is a pro-slavery compact, as history proves it is, then it is, as I have said, an agreement with hell. I will not vote for hell.

  **Douglass:** And I will not abandon the hope that heaven can be built from the ruins of hell. I believe the Constitution is a glorious liberty document, if we have the courage to claim it. I respect your conscience, William, but my duty is to the slave, and if that duty requires me to vote, to hold office, and to wrest the law from the grip of the oppressor, then so I must.

  **Garrison:** God grant you do not find yourself holding a rope of sand. The day will come when you see that you cannot purify a corrupt fountain.

  **Douglass:** And God grant you find that the fountain was not corrupt, only the hands that drew from it. We seek the same end, William. But I will not stop at the threshold of the polling place.
