prompt: |-
  So I've been chipping away at a novel for about a year now, and one of the POV characters is a divorce lawyer who has this pet theory that nobody has ever actually lied to her in twenty years of practice -- they just let her assume things, then act wounded when she assumed correctly. Total shameless lift from a linguistics class I took ages ago where we spent something like three weeks on Grice -- the cooperative principle, the four maxims, the whole distinction between what a sentence literally says and what the speaker actually meant by saying it -- and its been rattling around in my head ever since as a ready-made scene. I keep meaning to actually write the scene and keep chickening out, so I'm outsourcing the first draft to you: can you write me a short story, maybe 800-1200 words, set entirely inside a deposition or cross-examination, where the witness answers every single question with something that is, strictly speaking, true, and still manages to mislead the entire room by leaning hard on one or two specific maxims (I keep assuming Quantity and Relation are the ones to abuse here but you're the expert, not me).

  The part I actually care about: nobody in the scene gets to explain Grice out loud while it's happening. The maxim violations should live entirely in the texture of the exchange itself -- what she volunteers, what she conveniently doesn't, how she answers a slightly different question than the one that got asked -- and only in the closing beat should the opposing lawyer walk the jury back through it, unpacking the gap between what the witness said and what she actually communicated, basically doing live Gricean reasoning in the voice of a sharp trial lawyer rather than a philosophy TA. Invent whatever small case you need underneath all this -- insurance fraud, a disputed will, doesn't matter, I don't need a subplot -- I mostly just want the mechanics of the misdirection to actually hold up.
