prompt: |-
  I sit on my hospital's New Procedures and Technology Committee, which has to sign off on any interventional technique before it can be offered outside a research protocol. The spine service is asking us to approve system-wide use of a minimally invasive percutaneous technique for stabilizing painful vertebral compression fractures in osteoporotic patients. There is no completed randomized trial behind it; a sham-controlled trial is enrolling but is at least two years from reporting. What we do have is momentum: the technique is now used at roughly three-quarters of the hospitals we benchmark against, up from almost none five years ago, and our own surgeons' enthusiasm rests heavily on site visits where they watched colleagues elsewhere get good results. The department chair's proposal leans on the breadth of that adoption as evidence in itself, and warns that further delay will cost us surgeons and referrals to hospitals that already offer it.

  The committee split in a way that didn't track the usual alliances. Our clinical epidemiologist pointed out that the interval between a hospital's first site visit and its decision to adopt has been shrinking with each wave of new adopters, and argued that this pattern -- convergence driven increasingly by watching what others have already decided rather than by each hospital generating its own evidence -- looks less like accumulating proof and more like an information cascade, which would look exactly as wide and confident whether or not the procedure actually works. Other members thought this was unfair to the surgeons: watching a colleague's outcomes first-hand is a form of evidence too, and three years of accumulated clinical experience shouldn't be waved away as mere imitation. We ran out of time before resolving it.

  Please draft the short written opinion I'll circulate before our next meeting in six weeks. It should recommend one concrete course of action -- full approval, approval with specific conditions, or continued restriction to the research protocol -- attached to a timeframe, and it should take the "accumulated clinical experience is itself evidence" position seriously rather than simply asserting that widespread adoption tells us nothing.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion draft:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital's New Procedures and Technology Committee.
      *   **Task:** Draft a short written opinion to circulate before the next meeting (in six weeks).
      *   **Topic:** Approval of a minimally invasive percutaneous technique for stabilizing painful vertebral compression fractures (osteoporotic patients).
      *   **Current Status:** No completed RCTs (sham-controlled trial enrolling, results 2+ years away). High adoption rate (75% of benchmark hospitals). Surgeons enthusiastic based on site visits/observational experience. Department Chair warns of losing referrals/staff if delayed.
      *   **Conflict:** Clinical epidemiologist argues this is an "information cascade" (mimicry without proof). Other members argue "accumulated clinical experience is evidence."
      *   **Requirement:** Recommend one concrete course of action (Full Approval, Conditional Approval, or Research Protocol Only) with a timeframe.
      *   **Constraint:** Must take the "accumulated clinical experience is itself evidence" position seriously (cannot just dismiss adoption as herd behavior).

  2.  **Evaluate the Options:**
      *   *Option A: Full Approval.* Risky. No RCT data. Sham-controlled trials in this area (vertebroplasty/kyphoplasty analogues) have historically shown mixed or null results compared to sham. If the procedure turns out to be ineffective, the hospital is liable, and patients are exposed to risk without benefit. Ignores the epidemiologist's valid concern about information cascades.
      *   *Option B: Research Protocol Only.* Scientifically rigorous. However, ignores the reality of market pressure (losing surgeons/referrals) and dismisses the "clinical experience" argument too harshly. If 75% of peers are doing it, staying strictly research-only might be untenable operationally.
      *   *Option C: Conditional Approval (Privileging with Registry/Outcome Tracking).* This strikes a balance. It acknowledges the surgeons' experience and the market reality (allowing the procedure) but mitigates the risk of an information cascade by mandating data collection. It treats the "clinical experience" as *hypothesis-generating* that needs verification, rather than *proof-positive*. It sets a timeframe to align with the pending RCT.

  3.  **Develop the Argument (The "Why"):**
      *   *Acknowledge the Surgeons' View:* Site visits and observational data *are* a form of real-world evidence. Dismissing them undermines clinical judgment.
      *   *Acknowledge the Epidemiologist's View:* Widespread adoption doesn't equal efficacy (history is full of popular but useless treatments). Information cascades are real.
      *   *Synthesis:* We can approve the procedure *provisionally* but must convert that "clinical experience" into *data*. If the experience is valid, the data will show it. If it's a cascade, the data will reveal the lack of benefit.
      *   *Timeframe:* The pending sham-controlled trial is 2 years away. A 24-month conditional period aligns with that.

  4.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the recommendation clearly (Conditional Approval).
      *   **Rationale - Validating Clinical Experience:** Address the requirement to take the "experience is evidence" point seriously. Acknowledge that surgeon observation is valuable but distinguish between *anecdotal* evidence and *systematic* evidence.
      *   **Rationale - Addressing the Cascade:** Acknowledge the epidemiologist's point without alienating the surgeons. The goal is to ensure the adoption is based on patient benefit, not just momentum.
      *   **The Plan (Conditions):**
          1.  Registry participation (mandatory data entry).
          2.  Defined outcomes (pain scores, functional status, complications).
          3.  Sunset clause/Re-evaluation point (align with the 2-year RCT).
      *   **Market Reality:** Acknowledge the Chair's concern but frame the conditional approval as a way to keep surgeons *and* maintain integrity.
      *   **Closing:** Call to action for the next meeting.

  5.  **Refining the Tone:**
      *   Needs to be diplomatic but firm.
      *   Needs to sound like a committee member speaking to colleagues (respectful, evidence-based).
      *   Avoid jargon where possible, but use precise terms (information cascade, sham-controlled, registry).
      *   *Self-Correction during drafting:* I initially thought about suggesting a 1-year review. But the prompt says the RCT is 2+ years away. A 24-month review makes more sense to align with external evidence. I need to make sure I don't sound like I'm accusing the surgeons of lying about their site visits. I need to frame it as "elevating" their observations to data.

  6.  **Final Review against Constraints:**
      *   Concrete course of action? Yes (Conditional Approval).
      *   Timeframe? Yes (24 months).
      *   Take "experience is evidence" seriously? Yes (explicitly validated in the text).
      *   Short written opinion? Yes (keep it concise, approx. 1-2 pages equivalent).

  7.  **Final Polish:** Check for clarity and flow. Ensure the distinction between "full approval" and "conditional approval" is clear. (The resulting draft looks good).

  *(Self-Correction Note)*: Wait, I need to make sure I don't sound *too* much like the epidemiologist. The prompt asks me to take the "accumulated clinical experience" position seriously. I need to ensure the language reflects that this experience is the *basis* for the conditional approval, not just a hurdle to overcome. I will frame the registry as a way to *validate* their experience, not police it.

  8.  **Finalizing the Draft.** (Proceeds to generate output).
answer: |-
  **TO:** New Procedures and Technology Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Percutaneous Vertebral Stabilization Technique

  **Recommendation**
  I recommend **Conditional Approval** of the minimally invasive percutaneous stabilization technique for a period of **24 months**, contingent upon mandatory participation in a prospective clinical registry. At the conclusion of this period, full approval or discontinuation will be determined by the integration of our local data with the anticipated results of the ongoing multicenter sham-controlled trial.

  **Rationale**
  We are currently stalled between two valid perspectives. On one side, the clinical epidemiologist correctly identifies the risk of an "information cascade," where adoption rates reflect momentum rather than efficacy. History teaches us that widespread use is not a proxy for safety or benefit. On the other side, our surgical colleagues argue that three years of accumulated clinical experience and direct observation during site visits constitute a form of evidence that should not be dismissed as mere imitation.

  I believe we must take the surgeons' position seriously. Direct observation of patient outcomes in peer institutions is a legitimate form of real-world evidence. To dismiss this entirely is to devalue clinical judgment and ignores the practical reality that delaying adoption further risks the retention of our spine service and patient access to care.

  However, observational experience is distinct from systematic evidence. Site visits often highlight best-case scenarios and lack the controls to account for the placebo effect, which is known to be significant in vertebral fracture interventions. Therefore, we can honor the surgeons' experience without succumbing to the information cascade by converting that experience into data.

  **Conditions for Approval**
  To bridge the gap between clinical enthusiasm and scientific rigor, the following conditions must be met:

  1.  **Mandatory Registry Enrollment:** Every patient receiving this procedure must be entered into a departmental registry. Data points must include baseline pain scores, functional status, opioid usage, and complication rates, with follow-up at 6 weeks, 6 months, and 1 year.
  2.  **Informed Consent Language:** Patients must be explicitly informed that while the technique is widely adopted, high-level evidence regarding its efficacy compared to sham procedures is pending.
  3.  **Sunset Clause:** This approval expires in 24 months. At that time, the Committee will reconvene. If the pending sham-controlled trial reports negative results, or if our local registry data fails to demonstrate clinically meaningful improvement over baseline, the privilege to perform the procedure will be revoked.

  **Conclusion**
  This approach allows us to remain competitive and respect the clinical experience of our surgeons, while acknowledging that "everyone else is doing it" is insufficient justification for system-wide adoption. By mandating data collection, we treat our own clinical experience as the hypothesis it is, rather than the conclusion. We give the technique a fair trial in the real world, but we ensure that the final verdict rests on evidence, not momentum.

  I look forward to discussing this framework at our next meeting.
