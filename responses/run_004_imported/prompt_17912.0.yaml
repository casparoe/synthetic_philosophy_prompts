      *   Bride's paper acknowledged? Yes (The "bloodless" point).
      *   Accessible? Yes (Explain terms).
      *   About the couple? Yes.
      *   No empty sentiment? Yes (Focus on "true perception").

  *(Self-Correction during drafting)*: I need to be careful not to make it sound like the Groom *only* looks at things and the Bride *only* feels. The prompt says it's a "division of labor she has not stopped pointing out." I should use that joke but subvert it. They share both.

  Let's write.

  *Opening:* Acknowledge the odd choice of speaker.
  *Middle:* The Moore mechanics. The "Bloodless" critique. The Groom/Bride dynamic.
