answer: |-
  Good evening. For those of you who don't know me, I write about science. I was asked to give this toast not because I know the couple best, but because [Bride] believes that if I can make quantum field theory sound interesting to a stranger, I can make G. E. Moore sound bearable to her uncle.

  For the two-thirds of the room not currently finishing a philosophy doctorate: [Bride]'s thesis is on Moore. Specifically, the end of *Principia Ethica*, where he argues that the two greatest goods in human life are personal affection and the contemplation of beautiful things. He argued that when you combine them, the value isn't just added; it multiplies. He called this an "organic unity." The whole is worth far more than the sum of its parts.

  Now, usually, a wedding toast is a celebration of romantic passion. And this is where it gets tricky. Moore was famously cool toward passion. He thought ordinary romantic love was a bit suspect. He preferred a calm, contemplative admiration of someone's moral character. He wanted love to be clear-eyed, not hot-blooded.

  [Bride] actually wrote a paper on this. She argues that Moore's ideal smuggles a curiously thin, bloodless theory of romantic love inside a much richer theory of affection. And she warned me she'd be listening to see if I'd read it. So, consider this my citation: You were right, [Bride]. Moore was a bit cold. He would have found this reception far too chaotic, and the dancing entirely too physical.

  But here is why [Bride] and [Groom] make Moore work, even where Moore failed.

  They have, as [Bride] likes to point out, a division of philosophical labor. [Groom] is an art historian. He is professionally trained in the contemplation of beautiful objects. [Bride] specializes in personal affection and the ethics of how we treat one another. On paper, they fit Moore's equation perfectly. One brings the Beauty, one brings the Affection.

  But if they were truly Moorean, they would just stand in separate rooms, admiring a vase and a character reference, respectively. They don't do that.

  What they have built is an organic unity that corrects Moore's error. They have kept the "true perception" Moore demanded—the clear sight of who the other person actually is, without illusion—but they have refused the "bloodlessness." They have managed to combine the contemplation of beauty with the heat of real commitment.

  Moore argued that a beautiful world nobody sees is better than an ugly one nobody sees. He cared deeply about the objective value of the good. But looking at them, I realize the value isn't just in the beauty existing, or the affection existing. It's in the *witnessing*. It's in the fact that [Groom] sees the world beautifully, and [Bride] ensures that the world he sees is one worth living in.

  Moore said that for an experience to have value, it requires both true perception and appropriate emotion. Too much emotion without perception is madness; too much perception without emotion is coldness.

  [Bride] and [Groom], you have found the balance. You have the perception to see each other clearly, flaws and all, and the appropriate emotion to cherish what you see. You have created a whole that is, as Moore promised, greater than the sum of its parts, but far warmer than he ever imagined possible.

  So, please raise your glasses. To the organic unity of [Bride] and [Groom]. May your perception remain true, your emotion remain appropriate, and may the beautiful world you build together be one you never have to see alone.

  To the couple.
