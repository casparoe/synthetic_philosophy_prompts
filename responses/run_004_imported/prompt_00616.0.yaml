prompt: |-
  I've been slowly working through Quine's *Theories and Things* this year, partly prompted by a LessWrong-adjacent reading group I'm part of that tends to treat naturalized epistemology as more or less settled background for how to think about everything else, ethics included. Tucked into the middle of the collection is "On the Nature of Moral Values" (1978), apparently the only essay Quine ever devoted entirely to ethics. It's a strange, thin piece next to the rest of his corpus: he spends most of it comparing the relative "uniformity" of moral values, aesthetic taste, and language across cultures (his verdict is that morality is far more convergent than aesthetics or language, though still less convergent than science), and then argues that ethics is methodologically much shakier than science, because moral disagreements can only be adjudicated by appeal to other moral standards in a closed coherentist loop, whereas scientific disagreements can eventually be forced to confront a recalcitrant experience at the periphery of the web of belief. He ends up more or less signing on to Stevenson-style emotivism: even where disagreement about ultimate ends is irreducible, all we can do is keep calling the good "good" and hope the word does its emotive work.

  What's been bugging me is that this sits badly with the rest of Quine's system, and I don't think the tension gets discussed much outside fairly specialized corners of the secondary literature. As I understand it secondhand, via a summary of a reply Morton White apparently wrote, White's objection was that Quine had already spent his career dismantling exactly this kind of dualism: no sharp analytic/synthetic line, no theory-neutral observation language, nothing tested in isolation from the "corporate body" of the whole web. If moral sentiment can play a role in that web analogous to the role sensory irritation plays for empirical belief — a peripheral contact point that beliefs are answerable to, even if only imperfectly and holistically — then the fact/value split should arguably have gone the way of the analytic/synthetic split, leaving Quine some sort of naturalized moral cognitivist rather than an emotivist. Quine, as far as I can tell, never accepted this move, and I can't tell whether that's because the disanalogy he points to (no moral observation sentences, no mechanism forcing convergence) is actually principled, or whether he just declined to follow his own holism where it led.

  Could you write an essay working through this tension for me? I'd like you to reconstruct both sides as strongly as you can: the case that a consistent Quinean naturalist, given everything else Quine believed about holistic theory-testing, should have naturalized ethics right along with the rest of the web; and the case that Quine's disanalogy is principled, so that ethics really is stuck being methodologically second-class in just the way he says. Then I'd like you to actually take a side rather than concluding that "it depends" — if your answer needs qualification, make the qualification specific (something like "consistent Quinean naturalism supports cognitivism about X but not about Y"), rather than leaving the question open.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** The tension between Quine's general naturalized epistemology/holism and his specific metaethical stance in "On the Nature of Moral Values" (emotivism/non-cognitivism).
      *   **Key Conflict:** Quine's holism (web of belief, no analytic/synthetic distinction) suggests ethics *could* be part of the web tested against experience. But Quine argues ethics lacks "recalcitrant experience" to force convergence, making it methodologically distinct from science (emotivism). Morton White's objection is the pivot point: why didn't Quine naturalize ethics like he naturalized epistemology?
      *   **Task:** Write an essay reconstructing both sides strongly (Pro-Naturalized Ethics vs. Pro-Quine's Disanalogy).
      *   **Constraint:** Take a definite side at the end (no "it depends" waffling). If qualification is needed, make it specific.
      *   **Tone:** Philosophical, rigorous, engaging with the specific texts and arguments mentioned (Quine's *Theories and Things*, White's objection, Stevenson, etc.).

  2.  **Deconstruct the Arguments:**

      *   **Side A: The Consistent Quinean Naturalist (White's Line)**
          *   *Premise 1:* Quine dismantled the analytic/synthetic distinction. All knowledge is a web.
          *   *Premise 2:* Quine dismantled the reductionism of individual statements. Statements face the tribunal of experience as a corporate body.
          *   *Premise 3:* Moral judgments are part of our overall theory of the world (they guide action, predict social outcomes, cohere with psychological facts).
          *   *Conclusion:* Therefore, moral judgments should be treated like any other hypothesis in the web. They are tested by their efficacy in helping us navigate experience (broadly construed). Moral properties are natural properties (e.g., conducive to flourishing, social stability).
          *   *Key Move:* "Recalcitrant experience" isn't just photon impacts; it's the failure of a way of life. If a moral system leads to societal collapse or psychological misery, that's empirical feedback.

      *   **Side B: Quine's Disanalogy (The "On the Nature of Moral Values" Line)**
          *   *Premise 1:* Science converges because of shared sensory apparatus and external stimuli. We *have* to agree on the rabbit when the light hits our retinas similarly.
          *   *Premise 2:* Morality lacks this peripheral check. There is no "moral stimulus" analogous to a photon.
          *   *Premise 3:* Moral disagreement is often about ultimate ends, not just means. You can't refute an end empirically, only relative to another end.
          *   *Premise 4:* Therefore, moral language functions primarily to evoke attitude (Stevenson), not to state facts that can be proven false by the world.
          *   *Key Move:* The "web" needs anchors. Science has sensory anchors. Ethics floats because it lacks those specific anchors.

  3.  **Evaluate the Tension:**
      *   Quine is a behaviorist about meaning and a physicalist about ontology.
      *   If moral statements are just expressions of emotion, they aren't really part of the "web of belief" in the same way. They are more like noises we make.
      *   But Quine admits morality is *more* convergent than aesthetics. Why? Because of shared biological needs. If shared biological needs drive convergence, isn't that a natural fact?
      *   If morality is grounded in biological needs (survival, reproduction, social cohesion), then "X is good" translates to "X promotes survival/cohesion." That *is* a naturalistic claim testable by science.
      *   Quine seems to stop short. He sees the biological basis but denies it cognitive status. Why? Perhaps because "ought" cannot be derived from "is" *logically*, and Quine, despite attacking analyticity, still respects Hume's Fork in practice regarding norms.
      *   However, a *thoroughgoing* naturalist should see norms as functional traits selected for.

  4.  **Determine the Stance:**
      *   *Option 1: Defend Quine.* It's hard. His holism is his signature. Denying it for ethics looks like a residue of positivism he otherwise rejected.
      *   *Option 2: Defend White/The Naturalist Extension.* This feels more philosophically robust given the trajectory of post-Quinean philosophy (e.g., Railton, Boyd, naturalistic realism). It aligns better with the "death of the analytic/synthetic" project.
      *   *Decision:* I will argue that **consistent Quinean naturalism *requires* a form of moral cognitivism (specifically, functional naturalism), and Quine's retreat to emotivism is an inconsistent residue of logical empiricism.**
      *   *Qualification:* It supports cognitivism about *socially functional* norms, but perhaps not about transcendent or non-natural moral truths (which Quine would reject anyway). So, "Naturalistic Moral Realism" is the winning position, not "Queer Moral Realism."

  5.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Quine's *Theories and Things*. The anomaly of "On the Nature of Moral Values." The White objection. Thesis statement: Quine's emotivism is a betrayal of his own holism; a consistent naturalist must naturalize ethics.
      *   **Section 1: The Quinean Web and the Exclusion of Ethics.** Explain Quine's holism (Two Dogmas). Explain his specific argument in the 1978 essay (convergence, lack of sensory check, Stevenson). Why does he draw the line there? (The "Ought" barrier).
      *   **Section 2: The Case for Naturalized Ethics (White's Challenge).** Reconstruct the argument. If the web is seamless, moral beliefs are nodes. They have empirical consequences (social stability, pain, pleasure). Disconfirmation happens when moral systems fail to sustain the community. Analogy: Theoretical entities in science vs. Moral values. Both are posits that explain/predict experience.
      *   **Section 3: The Case for Quine's Disanalogy (Steel-manning).** Why might Quine be right? Sensory irradiation is *immediate*. Moral feedback is *mediated* by theory. The "is-ought" gap might be a pragmatic feature of language games, not a metaphysical wall, but a functional one. Emotivism explains the *action-guiding* nature better than cognitivism.
      *   **Section 4: Resolution and Verdict.** Weigh the two. The "sensory check" argument is weaker than it looks (theory-ladenness of observation). The biological/evolutionary basis of morality provides the "recalcitrance" Quine thought missing. If we survive, the norms worked. If we die, they didn't. That's empirical.
      *   **Conclusion:** Take the side. Quine was inconsistent. The naturalized epistemologist must be a naturalized ethicist.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "convergence" point Quine makes? Yes, he admits morality converges more than art. I need to use that. If it converges due to biological facts, that *is* naturalistic evidence.
      *   *Check:* Is the distinction specific enough? I need to ensure I don't claim *all* moral discourse is scientific, but that the *justification* of moral norms is empirical.
      *   *Tone Check:* Keep it analytical but accessible to someone reading LessWrong/Quine. Use terms like "web of belief," "recalcitrant experience," "posits."
      *   *Final Polish:* Ensure the verdict is punchy. Don't sit on the fence.

  7.  **Final Plan:**
      *   Title: The Unnaturalized Ethicist.
      *   Intro: The anomaly of Quine's metaethics.
      *   Part I: Quine's Boundary (The 1978 Argument).
      *   Part II: The White Objection (Holism Unbound).
      *   Part III: The Verdict (Inconsistency and the Path Forward).
      *   Specific Qualification: Naturalistic Functionalism.

  8.  *(Self-Correction on the "Verdict")*: I need to be careful not to attribute views to Quine he didn't hold. I am arguing what a *consistent* Quinean *should* hold. The prompt asks me to take a side on the tension. I will argue the tension is resolved by rejecting Quine's specific metaethical conclusion in favor of his broader metaphysical method.

  9.  *(Drafting thought)*: Make sure to mention that Quine *was* a positivist at heart (Carnap's student) and this might explain the residue. But his own arguments in "Two Dogmas" undermine that residue.

  10. *(Final Review against constraints)*: Did I reconstruct both sides strongly? Yes. Did I take a side? Yes. Is the qualification specific? Yes.

