answer: |-
  # The Unnaturalized Ethicist: Quine's Inconsistent Web

  Willard Van Orman Quine is the philosopher of the seamless web. In "Two Dogmas of Empiricism," he dismantled the walls that separated analytic truth from synthetic fact, and individual statements from the corporate body of theory. He taught us that our beliefs face the tribunal of sense experience not singly, but as a field. Yet, in his 1978 essay "On the Nature of Moral Values," Quine draws a bright red line through the center of that web. He argues that while science is anchored by recalcitrant experience, ethics floats in a coherentist loop of sentiment, ultimately reducible to Stevenson-style emotivism.

  This position creates a glaring tension in Quine's corpus. As Morton White and others have noted, if naturalized epistemology dissolves the boundary between philosophy and science, why does it stop at the boundary of value? If moral sentiments are part of the causal nexus of the world, why are they denied cognitive status?

  To resolve this, we must reconstruct the conflict between Quine's specific metaethical arguments and his broader naturalistic holism. I will argue that Quine's defense of the fact/value distinction relies on a residually positivist view of "observation" that his own holism should have destroyed. A consistent Quinean naturalist cannot be an emotivist; they must be a moral cognitivist of a specific, functionalist variety.

  ### I. The Quinean Boundary: Why Ethics Floats

  To understand the tension, we must first steelman Quine's reasons for excluding ethics from the "web of belief" proper. In "On the Nature of Moral Values," Quine does not deny that morality is real or important. He denies it is *scientific*. His argument rests on two pillars: the lack of peripheral anchors and the nature of disagreement.

  First, Quine argues that science converges because it is forced to by the world. We share similar sensory apparatuses; when light hits our retinas, we are causally compelled to assent to "There is a rabbit." This "recalcitrant experience" acts as a periphery for the web of belief. When predictions fail, we must adjust our theories. Ethics, Quine claims, lacks this periphery. There is no "moral stimulus" analogous to photon impact. You cannot point to a fact in the world that logically compels a moral conclusion.

  Second, Quine focuses on the adjudication of disagreement. In science, if two theories conflict, we can design an experiment to see which one survives contact with reality. In ethics, disagreements about ultimate ends cannot be settled by experiment. If I value equality and you value hierarchy, no microscope will resolve the dispute. We can only appeal to other moral values, creating a closed coherentist loop. Because moral language fails to refer to external constraints in this specific way, Quine concludes its primary function is not to describe the world, but to evoke attitude. It is a tool for social cohesion, not a map of moral territory.

  For Quine, this preserves the integrity of science. By cordoning off ethics as emotive, he protects the "truth-apt" status of scientific claims from being diluted by normative considerations. It is a defensive maneuver: ethics is second-class citizenship to preserve the first-class status of physics.

  ### II. The White Objection: Holism Unbound

  Morton White's objection cuts to the heart of Quine's system. White argues that Quine's exclusion of ethics relies on the very dualisms Quine spent his career dismantling.

  The core of the Quinean revolution is holism. Beliefs are not tested in isolation; they are tested as a corporate body. This includes logical laws, theoretical posits, and—crucially—observational categoricals. But the "web" is not limited to propositions about electrons and rabbits. It includes propositions about how we ought to live. When we adopt a moral norm (e.g., "Do not steal"), we are adopting a hypothesis about how to organize society to minimize conflict and maximize flourishing.

  White's argument suggests that moral judgments *do* have empirical consequences, just of a more complex variety than photon impacts. If a society adopts a moral code that prohibits cooperation or encourages random violence, that society will likely collapse or suffer measurable psychological distress. This collapse is "recalcitrant experience." It is the world pushing back against a normative hypothesis.

  Consider the analogy to theoretical entities in science. We believe in electrons not because we see them, but because positing them explains the tracks in cloud chambers. Similarly, we might posit "justice" or "rights" not because we see them, but because positing them explains the stability of successful societies and the psychological well-being of their members. If Quine allows that electrons are legitimate posits because they play a role in our best theory of the world, he must explain why "moral values" are illegitimate posits when they play a role in our best theory of human social behavior.

  Furthermore, Quine's insistence on "sensory irradiation" as the only valid anchor smells of the reductionism he attacked in "Two Dogmas." If meaning is determined by a statement's place in the web and its contribution to prediction, then moral statements contribute to prediction (e.g., "If we punish murder, homicide rates will drop"). If they contribute to the web's ability to navigate experience, they are part of the web. To exclude them requires a sharp distinction between "sensory" experience and "social/psychological" experience that Quine's naturalism should not tolerate. A naturalist views humans as biological organisms; pain, social ostracization, and coalition-building are as much part of the causal fabric of the universe as light waves.

  ### III. The Verdict: Inconsistency and the Path to Naturalized Normativity

  The tension between Quine's general metaphysics and his specific metaethics is real, and it cannot be resolved by splitting the difference. We must choose between Quine's holism and Quine's emotivism.

  I argue that **Quine's emotivism is the error.** It is an inconsistent residue of the logical empiricism he otherwise transcended. A consistent Quinean naturalist must be a moral cognitivist, specifically a **naturalistic functionalist**.

  Here is why Quine's disanalogy fails upon rigorous inspection. Quine claims ethics lacks "recalcitrant experience." This is only true if one defines experience narrowly as immediate sensory irritation. But Quine's own holism teaches us that *no* experience is theory-neutral. Even "There is a rabbit" is a sophisticated interpretation of sensory data. The "check" on scientific theory is not raw sensation, but the failure of the theory to facilitate successful prediction and interaction with the environment.

  Ethics is subject to the same check. Moral systems are technologies for social coordination. They are hypotheses about how to arrange human behavior to achieve certain ends (survival, flourishing, stability). When a moral system leads to civil war, famine, or widespread psychological misery, it has failed an empirical test. The "recalcitrance" is not a photon hitting a retina; it is a society failing to reproduce or individuals suffering measurable neurological stress. These are natural facts.

  Quine hesitates here because he fears the "naturalistic fallacy"—the idea that you cannot derive an *ought* from an *is*. But for a thoroughgoing naturalist, the "ought" is just a specific kind of "is." An "ought" is a statement about the functional requirements of a system. "You ought to change the oil" is a factual claim about the conditions required for the engine to run. "You ought not to murder" is a factual claim about the conditions required for a society of agents with specific psychological constitutions to persist.

  If Quine accepts that humans are natural objects subject to causal laws, then moral values are natural properties—specifically, relational properties between actions and the well-being of conscious creatures. To say "X is good" is to say "X conduces to the flourishing of the community." This is a claim that can be true or false, and it can be disproven by empirical evidence (e.g., if X actually leads to collapse).

  Quine's retreat to emotivism protects science from ethics, but it does so by mutilating naturalism. It creates a "ghost in the machine" where human values float free of the causal order. If we take Quine's naturalized epistemology seriously, we must view ethics as a branch of psychology and sociology, continuous with the rest of science.

  **Qualification:** This does not mean *all* moral discourse is scientific. Quine is right that much moral language is performative and emotive. However, the *justification* of moral norms is cognitive and empirical. A consistent Quinean view supports **cognitivism about the functional efficacy of norms**, while acknowledging that the *rhetoric* of morality often employs emotive tools. We can accept that moral language has an emotive function (as Stevenson argued) without conceding that moral *truth* is reducible to emotion. The truth conditions are naturalistic; the speech acts are often persuasive.

  ### Conclusion

  Quine's "On the Nature of Moral Values" is a conservative artifact in a radical body of work. He dismantled the analytic/synthetic distinction to naturalize epistemology, but he stopped short of naturalizing ethics because he retained a narrow, positivist definition of "observation."

  Morton White was right to press the point. If the web of belief is truly seamless, then normative strands are woven into the same fabric as descriptive ones. Both are tested by their ability to help the organism navigate the world. The "recalcitrant experience" that checks a moral theory is the failure of a way of life. Therefore, the consistent Quinean position is not emotivism, but a naturalistic moral realism where values are identified with the causal properties of actions that sustain the flourishing of sentient beings. Quine gave us the tools to dissolve the fact/value distinction; he simply lacked the will to use them on his own deepest convictions.
