answer: |-
  Your friend's objection is not only sound; it is one of the most enduring and respected critiques of *Principia Ethica*. In fact, you are in excellent company: later philosophers like C.D. Broad and J.N. Findlay raised very similar concerns. The charge is that Moore's "Ideal Utilitarianism" is, in practice, indistinguishable from a refined Hedonism, specifically the kind espoused by Sidgwick.

  However, to say Moore is *just* a hedonist in disguise overlooks the specific architectural work done by his concepts of **organic unities** and the **intrinsic value of beauty independent of consciousness**. These are the bulwarks Moore erects to prevent the collapse you and your friend discussed.

  Here is how you can reconstruct Moore's defense against the "sleight of hand" accusation, distinguishing where your friend is right and where Moore's technical distinctions actually hold water.

  ### 1. Definition vs. Constituents (The Open Question Legacy)
  The first thing to clarify is the target of Moore's Open Question Argument (OQA). The OQA is a semantic claim, not necessarily a substantive one. Moore is arguing that the *concept* "good" is not synonymous with the *concept* "pleasant."

  *   **The Friend's View:** If Moore ends up saying the best states of affairs involve pleasure, he's a hedonist.
  *   **Moore's Defense:** Hedonism claims pleasure is the *sole* intrinsic good and that "good" *means* "pleasure." Moore agrees pleasure is *an* intrinsic good, but denies it is the *only* one, and vehemently denies it is the *definition* of good.

  For Moore, asking "Is this pleasure good?" is always an open question. For a hedonist, "Is this pleasure good?" should be a tautology (like "Is this bachelor unmarried?"). Moore's positive theory allows pleasure to be a major *constituent* of the good without conceding that it *defines* the good. This preserves the logical space for his non-naturalism, even if the extension of "good things" overlaps significantly with hedonism.

  ### 2. Organic Unities: The Whole is Not the Sum of Parts
  This is the most technical and crucial barrier against your friend's reading. Moore's doctrine of organic unities states that the value of a whole is not necessarily equal to the sum of the values of its parts.

  *   **The Hedonist Calculation:** Value = Amount of Pleasure.
  *   **Moore's Calculation:** Value = The specific relation between a conscious state and its object.

  In Moore's view of "aesthetic enjoyment" or "personal affection," there are two main parts: (1) the consciousness of a beautiful object (or a worthy person) and (2) the appropriate emotional response (which includes pleasure).

  Moore argues that the pleasure *alone* has some value, and the beautiful object *alone* has some value. But the **whole state of affairs** (taking pleasure *in* the beauty) has a value vastly greater than the sum of those two parts. Conversely, taking pleasure in something ugly (e.g., sadistic enjoyment) creates a whole that is positively evil, even though the "pleasure part" is, in isolation, good.

  **Why this blocks the hedonist reading:** If Moore were a crypto-hedonist, the object of the pleasure would be irrelevant; only the intensity of the feeling would matter. By insisting that the *object* matters essentially to the value of the whole, Moore departs from the hedonistic calculus. The value is in the *intentional relation*, not just the feeling.

  ### 3. The Two Worlds Thought Experiment
  You mentioned the thought experiment comparing a beautiful world and a heap of refuse, both unobserved. This is actually your strongest evidence *against* your friend's objection.

  In Chapter VI, Moore asks us to imagine two worlds: one exceedingly beautiful, the other utterly ugly, neither containing any conscious beings to perceive them. He asks: Is the beautiful world better than the ugly one?

  *   **The Hedonist Answer:** No. Without a mind to experience pleasure, value is zero in both cases.
  *   **Moore's Answer:** Yes. The beautiful world is intrinsically better, even if no one ever knows it.

  Moore writes: *"I do not hesitate to include in my list of things intrinsically good... the existence of what is beautiful."*

  If your friend's reading were correct, Moore would have to say the unobserved beautiful world has no value. By insisting it does, Moore proves he is not a hedonist. He believes value resides in certain states of affairs (like beauty) independently of whether they generate pleasure. He admits the value is *greater* when conscious beings appreciate it, but the baseline value exists without the pleasure. This is the "smoking gun" that distinguishes his Ideal Utilitarianism from Sidgwick's Hedonistic Utilitarianism.

  ### 4. The "Appropriateness" of Emotion
  Finally, Moore's description of the "ideal" relies heavily on the *appropriateness* of the emotion to the object.

  In personal affection, for Moore, the highest good is not just "liking someone." It is liking someone *who is actually worthy of that affection* and believing them to be so. If you love a person who is actually vicious, but you mistakenly believe they are virtuous, Moore argues the state of affairs is less valuable than if the person were actually virtuous.

  A hedonist cannot make this distinction easily. For a hedonist, the warmth of the feeling is what counts; the moral worth of the recipient is only instrumentally relevant. For Moore, the objective quality of the friend is a constituent of the intrinsic value. This again shifts the locus of value from the internal sensation (pleasure) to the external reality (the good qualities of the friend).

  ### Verdict: Where Your Friend is Right (and Wrong)
  You can concede ground to your friend without surrendering the argument.

  **Where they are right:** Moore is much closer to Sidgwick than he likes to admit. Moore concedes that pleasure is a significant component of the highest goods. He does not advocate for a stoic asceticism. In terms of practical advice ("What should I do?"), a Moorean and a Sidgwickian would often recommend the same actions (pursue art, cultivate friendships). In this sense, the "sleight of hand" charge has pragmatic merit.

  **Where they are wrong:** They are conflating *extension* with *intension*. Just because Moore's list of good things includes pleasure-laden states does not mean his *theory of value* is hedonistic.
  1.  **Non-Naturalism:** Moore maintains value is a non-natural property, not a psychological state.
  2.  **Unobserved Value:** Moore assigns value to beauty without consciousness; Sidgwick does not.
  3.  **Organic Unity:** Moore assigns value based on the fit between emotion and object; Sidgwick assigns value based on the intensity of the emotion.

  **How to answer your friend:**
  "Moore isn't trying to prove that pleasure isn't good; he's trying to prove that pleasure isn't the *definition* of good. The 'Two Worlds' argument shows he values beauty even without pleasure, and the 'Organic Unities' argument shows he values the *relationship* between the mind and the object, not just the feeling itself. He might end up in the same neighborhood as Sidgwick, but he took a completely different map to get there."

  This preserves the integrity of Moore's argument while acknowledging the intuitive force of your friend's critique.
