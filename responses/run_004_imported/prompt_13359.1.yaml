answer: |-
  This is a genuinely sharp observation. You've identified a tension that sits right at the fault line of modern Effective Altruism (EA) and longtermist thought: the conflict between **axiological scope** (what counts as valuable) and **epistemic humility** (what we can actually know).

  If we look at Ramsey's actual body of work—not just the pop-philosophy summary of it—I think the answer is nuanced. He wouldn't have been a dismissive critic, but he likely would have been a **severe methodological critic** of how longtermism is practiced today, even while agreeing with its core ethical premise.

  Here is the best-guess reasoning on why Ramsey would have been a "skeptical sympathizer."

  ### 1. The "Epilogue" Misinterpretation
  First, we have to clear up what Ramsey was actually arguing in that famous "Epilogue" (the final chapter of *The Foundations of Mathematics*).

  When Ramsey writes that the vastness of the universe doesn't diminish human significance, he isn't arguing for **proximity** (that only things near us in space/time matter). He is arguing for **phenomenology** (that only things capable of experience matter).

  His point was: *Stars are big, but they are dead. Humans are small, but they are alive. Therefore, size is the wrong metric for value.*

  Longtermism does not care about cubic lightyears; it cares about **sentient experiences**. If there are $10^{50}$ future digital minds, a longtermist doesn't value them because they fill space, but because they can suffer or flourish. Ramsey's "human-scale" argument is actually compatible with longtermism, provided the "scale" refers to the scale of *consciousness*, not the scale of *physics*. Ramsey would likely agree that a future billion years of happy consciousness matters more than a barren universe, regardless of the physical size.

  ### 2. The Smoking Gun: Ramsey on Time Discounting
  The strongest evidence that Ramsey would sympathize with the *ethical core* of longtermism comes from his 1928 paper, *"A Mathematical Theory of Saving."*

  In this paper, Ramsey tackled the question of how much a nation should save for the future. He explicitly addressed the issue of **time discounting** (valuing future utility less than present utility). His conclusion was scathing:

  > *"It is assumed that we do not discount later enjoyments in comparison with earlier ones, a practice which is ethically indefensible and arises merely from the weakness of the imagination."*

  This is the foundational ethical axiom of longtermism: that a life saved in 2100 is morally equivalent to a life saved in 2024. Most economists in Ramsey's time (and many today) apply a "pure rate of time preference." Ramsey called this ethically indefensible.

  On this specific point, Ramsey is more longtermist than most longtermists. He would likely view the neglect of the far future as a failure of imagination and ethics.

  ### 3. The Epistemic Critique: "Where are your probabilities?"
  Here is where the friction starts. Ramsey is the father of subjective probability (Bayesianism), but he was a **pragmatist** in the Cambridge tradition (heavily influenced by Keynes and Wittgenstein).

  For Ramsey, a probability judgment wasn't just a number you pulled out of a hat to plug into an expected utility equation. It had to be grounded in a logical relation to evidence or a coherent betting quotient based on *actual* knowledge.

  Longtermism often relies on what critics call "Pascal's Mugging"—accepting huge expected values based on tiny, highly speculative probabilities (e.g., "There's a 0.0001% chance we create $10^{50}$ lives, so we must prioritize this").

  Ramsey would likely have torn this apart. He would argue that when you are dealing with causal chains that stretch over centuries (AI alignment, geoengineering, existential risk), you do not have a coherent basis for assigning a probability. If you can't form a coherent betting quotient because the state space is unknown, **my decision theory doesn't apply.**

  He would likely say: *"You are using my formula to calculate the value of a lottery ticket where you don't know the numbers on the balls, or even if there is a drum."*

  ### 4. The "Human Good" vs. Abstract Utility
  Ramsey was a utilitarian, but he was part of the Cambridge circle that included G.E. Moore. They cared about "states of mind" and human goods (love, beauty, knowledge).

  There is a strain of longtermism that becomes very abstract—valuing "potential minds" or "computational substrate" in a way that might detach from human experience. Given Ramsey's "Epilogue," he might be skeptical of valuing *potential* people over *actual* people if the cost is severe deprivation in the present.

  If longtermism demands sacrificing concrete, knowable human welfare today for speculative, astronomical welfare tomorrow, Ramsey might flag that as a violation of the "human-scale" reality he defended. He argued we are "like threepenny bits" compared to the stars, yes, but we are *real* threepenny bits. He might worry that longtermism risks chasing the "stars" (abstract future potential) at the expense of the "bits" (concrete present welfare).

  ### The Verdict
  If you put Frank Ramsey in a room with Nick Bostrom and William MacAskill:

  1.  **On Ethics:** He would agree with them. The future matters. Discounting the future is ethically indefensible. The size of the universe doesn't matter, but the sum of conscious experience does.
  2.  **On Epistemology:** He would likely be their harshest critic. He would demand rigorous justification for the probabilities assigned to existential risks. He would warn against the "weakness of imagination" leading to false precision in models.
  3.  **On Action:** He would likely advocate for **robustness** over **optimization**. Instead of betting everything on a specific longtermist intervention with high variance (e.g., specific AI alignment strategies), he might prefer policies that improve human reasoning, resilience, and welfare generally—things that pay off regardless of which specific future comes to pass.

  **Summary:** Ramsey would likely view longtermism as **ethically correct but epistemically reckless.** He gave you the math to justify caring about the future, but he also gave you the warnings about when it is rational to trust your probabilities. He'd probably tell the longtermists: *"Keep the goal, but throw away your spreadsheets until you know what variables you're actually solving for."*
