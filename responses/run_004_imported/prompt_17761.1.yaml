      *   *Move 4: Callum's Popper Recantation.* Popper later changed his mind and admitted it *is* testable.
      *   *Move 5: Priti's Meta-Reply.* A recantation doesn't fix the logic. The tautology point stands on its own merits, not on Popper's opinion.

  3.  **Evaluate Each Move (Drafting the Analysis):**

