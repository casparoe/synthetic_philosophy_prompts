  Wait, I'm Player 1. I'm not moving. You are.
  If you Pass, you are betting that I will Pass at 5.
  Why would I Pass at 5? Only if I think you will Pass at 6.
  Will you Pass at 6?
  **Elara:** No.
  **Ben:** So I know you Take at 6.
  **Elara:** Yes.
  **Ben:** So I Take at 5.
  **Elara:** Yes.
  **Ben:** So you Take at 4.
  **Elara:** Yes.
  **Ben:** Then why are we arguing?
  **Elara:** Because you want to say the logic is broken because of Node 1. I'm saying the logic is local.
  **Ben:** The logic isn't local in a game of perfect information. The information sets are singletons. The history is common knowledge. The history *is* the context for the rationality claim.
  But... (Ben looks at the pot).
  If you Take, you get \$10.66.
  If you Pass... and I'm feeling spiteful because you called my Node 3 Pass "irrational"... I could Take at 5. You still get \$10.66.
  You have nothing to gain by Passing.
  **Elara:** Exactly.
  **Ben:** Unless... unless you think I might make a mistake at 5.
  **Elara:** I don't bet on mistakes.
  **Ben:** But you bet on them at Node 2! You Passed!
  **Elara:** (Smiles faintly) That was a test. To see if you'd argue this exact point.
  **Ben:** And now?
  **Elara:** Now the test is over. CKR holds. The deviation was noise. The theorem stands.

  Elara flips the "Take" card. She rakes in the \$10.66. Ben gets the remaining \$5.33.

  **Ben:** (Counting his bills) You know, in the lab, subjects get to the end of the centipede about 40% of the time.
  **Elara:** Subjects aren't common knowers of rationality. They're common knowers of... curiosity.
  **Ben:** Or maybe Aumann's definition of rationality is too thin. It captures consistency, but it misses the intersubjective glue that makes cooperation stable even in finite games.
  **Elara:** Or maybe Binmore's definition of belief revision is too thick. It lets the past hold the future hostage.
  **Ben:** (Stands up) Same time next week? I'm thinking we play the Traveler's Dilemma.
  **Elara:** Only if you promise to claim \$100.
  **Ben:** Only if you promise to believe me.

  They shake hands. The epistemic foundation remains cracked, but the money is spent.
