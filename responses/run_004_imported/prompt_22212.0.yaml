          *   *Assessment:* **This is a significant misunderstanding.**
          *   *Why?* Anscombe's argument is *not* primarily about proportionality or scale. It is about the *intention*. If you intend to kill innocents as a means, it is murder, whether it is 1 person or 100,000. If you attack a military target and *foresee* civilian death (without intending it), it might be permissible (subject to proportionality), regardless of scale (though scale affects proportionality).
