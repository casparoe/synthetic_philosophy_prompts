answer: |-
  The confusion arises from a common simplification often used in introductory physics: Bell’s theorem does not rule out *all* hidden variables; it rules out **local** hidden variables.

  While your teacher’s summary is standard for the context of a class, Bohmian mechanics survives because it explicitly sacrifices **locality** to preserve **determinism**.

  ### 1. The "Missing Word" in Bell’s Theorem
  Bell’s theorem tests whether a theory can satisfy two specific conditions simultaneously:
  *   **Realism:** Particles have definite properties (hidden variables) regardless of measurement.
  *   **Locality:** Information or influence cannot travel faster than the speed of light.

  Bell proved that any theory satisfying *both* conditions must obey a mathematical limit (Bell’s Inequality). Since quantum mechanics violates this inequality, we must conclude that nature cannot be **both** local **and** real.

  ### 2. How Bohmian Mechanics Survives
  Bohmian mechanics (pilot-wave theory) is a "live option" because it chooses a different path than standard quantum mechanics:
  *   **Standard View (Copenhagen):** Keeps **Locality** but abandons **Realism** (particles don't have definite states until measured).
  *   **Bohmian View:** Keeps **Realism** but abandons **Locality**.

  In Bohmian mechanics, every particle has a definite position (the hidden variable) and follows a specific path. However, these paths are guided by a "pilot wave" (the wavefunction). This wave is **non-local**: it exists across the entire universe and updates instantaneously. If you measure one particle in an entangled pair, the pilot wave for the other particle changes instantly, regardless of distance. Because the theory is explicitly non-local, it bypasses Bell’s restrictions.

  ### 3. Why it is Still Taken Seriously
  Physicists treat Bohmian mechanics as a serious interpretation because it is mathematically rigorous and internally consistent. It offers several advantages:
  *   **Determinism:** It removes fundamental randomness; the universe is strictly causal.
  *   **No "Collapse":** It solves the measurement problem by suggesting the wavefunction never collapses—it simply guides particles into specific configurations.

  ### 4. The "Cost" of the Theory
  Despite its consistency, many physicists prefer standard quantum mechanics because Bohmian mechanics carries significant "baggage":
  *   **Conflict with Relativity:** While it does not allow for faster-than-light *communication* (it respects the no-signaling theorem), it requires a "preferred frame of reference" for the instantaneous influence to occur. This is philosophically uncomfortable in a universe governed by Special Relativity.
  *   **Complexity:** It is often viewed as "ontologically expensive." You must accept the existence of the wavefunction *and* the particles, even though the particles are guided by the wave in a way that makes them appear random to us.

  ### Summary
  Bell’s theorem proved that the universe cannot be **Local and Real**. 
  *   **Standard QM** says: "The universe is Local, but not Real."
  *   **Bohmian Mechanics** says: "The universe is Real, but not Local."

  Both are mathematically valid ways to interpret the experimental data, which is why the debate continues.
