      *   *The Conflict:* The conflict arises if one assumes a Divine Command Theory where God's commands exhaust all moral obligations. If God commands "Love your neighbor," is there anything *left* to do beyond that?
      *   *Resolution:* They are operating in different frameworks. The Reformers are worried about *justification* (how am I saved?). Philosophers are worried about *obligation* (what should I do?).
      *   *Does it pose a problem?* Only for religious ethics that try to incorporate supererogation without addressing the "total obligation to God" premise. For secular ethics, Article XIV is irrelevant.

