          *   **Christ's Sufficiency:** Salvation is by grace through faith, not works. If we can add "extra" merit, we diminish Christ's perfect work. It implies Christ didn't do enough, so we need to top it up.
          *   **The "Unprofitable Servants" Quote:** Luke 17:10. Even if you do everything commanded, you've only done your duty. There is no surplus merit.
      *   *Historical Context:* This is a direct shot at the Roman Catholic doctrine of the "Treasury of Merit" (indulgences, saints' extra goodness available to others). The Reformers hated this because it monetized/quantified grace.

  3.  **Deconstruct the Philosophical Concept (Supererogation):**
      *   *Definition:* Acts that are good to do but not wrong to omit. (Heroism, sainthood, extreme sacrifice).
      *   *Function in Ethics:* It creates space for moral heroism without making it mandatory. It prevents morality from being too demanding (the "overdemandingness objection" to utilitarianism).
      *   *Secular Context:* Usually grounded in human well-being, social contract, or rational duty, not divine command.

  4.  **Compare and Contrast (The "Apples-to-Oranges" Test):**
