answer: |-
  You have hit on one of the most technically subtle and philosophically charged debates in the foundations of quantum mechanics. Your intuition is sharp: you are correctly identifying that the disagreement often comes down to how one defines "locality" and what one considers to be the fundamental "beables" (the stuff that actually exists) of the theory.

  Eliezer is not lying, but he is making a specific ontological commitment that standard textbook presentations do not. To understand why his claim is technically defensible (even if controversial), we need to dissect Bell's Theorem, the Jarrett Decomposition (which you recalled), and the specific machinery of Many-Worlds (MWI).

  Here is the walkthrough.

  ### 1. What Bell's Theorem Actually Rules Out

  Standard pop-sci (and many textbooks) summarize Bell's Theorem as: *"Nature is non-local."*

  This is imprecise. Bell's Theorem proves that **no theory that satisfies a specific set of assumptions can reproduce the predictions of quantum mechanics.** If QM is right (and experiments say it is), at least one assumption must be false.

  The assumptions going into the derivation of Bell's Inequality are generally:
  1.  **Measurement Independence:** The experimenter can freely choose settings.
  2.  **Local Causality:** Events here depend only on things in their past light cone.
  3.  **Single Outcome (Realism):** Measurements yield a single, definite result.

  Most interpretations (Copenhagen, GRW, Bohmian) keep **Single Outcome**. Therefore, to match experiment, they must sacrifice **Local Causality** (or Measurement Independence). This is why standard texts say "Bell rules out local theories." They implicitly assume "theory" means "theory with single outcomes."

  **Eliezer's Move:** MWI rejects assumption #3. It posits that *all* outcomes occur. Eliezer argues that if you remove the "Single Outcome" constraint, you can maintain **Local Causality** in the dynamics of the wavefunction.

  ### 2. The Jarrett Decomposition (PI vs. OI)

  You remembered correctly. Jon Jarrett (1984) showed that Bell's "Locality" condition can be mathematically decomposed into two independent conditions:

  1.  **Parameter Independence (PI):** The probability of an outcome at Alice's side does not depend on the *setting* chosen at Bob's side.
      *   *Violation implies:* Superluminal signaling is possible.
      *   *Status:* QM (and MWI) **preserves** this. No signaling theorem holds.
  2.  **Outcome Independence (OI):** The probability of an outcome at Alice's side does not depend on the *outcome* obtained at Bob's side.
      *   *Violation implies:* The results are correlated beyond what a common past cause can explain.
      *   *Status:* Standard QM **violates** this.

  In a single-world theory, violating OI looks like "spooky action at a distance." If Alice gets Spin Up, Bob *instantly* becomes Spin Down, even if they are spacelike separated.

  **In MWI:**
  There is no single outcome for Bob. There is a branch where Bob is Up and a branch where Bob is Down. Alice also splits.
  *   In the branch where Alice is Up, she is correlated with the Bob who is Down.
  *   In the branch where Alice is Down, she is correlated with the Bob who is Up.

  Crucially, **the splitting happens locally.** Alice's detector interacts with her particle locally. Bob's detector interacts with his particle locally. The correlation was encoded in the joint wavefunction at the source (the common past). When Alice measures, she doesn't "force" Bob's particle to change; she simply becomes entangled with her local particle, which is already part of the global entangled state.

  Because there is no single outcome, there is no need for a non-local mechanism to "coordinate" which single outcome Bob gets. The correlation is a structural feature of the wavefunction, which evolved locally from the past.

  ### 3. Is This Just Redefining "Local"? (The Configuration Space Problem)

  This is the strongest counter-argument to Eliezer, and where the "semantics" charge comes from.

  **The Objection:**
  Locality usually means "interactions happen at points in 3D space."
  However, the wavefunction $\Psi$ does not live in 3D space. For $N$ particles, it lives in **Configuration Space** ($3N$ dimensions).
  If the fundamental reality is a field in 3N-dimensional space, is it "local"?
  *   **Critics (e.g., David Albert):** No. A wavefunction spreading out in configuration space is inherently non-local with respect to 3D space. If reality is 3D space, MWI is non-local.
  *   **Proponents (e.g., Eliezer, David Wallace):** Yes. If the fundamental reality *is* the wavefunction (or the quantum state), then the Schrödinger equation is a **local differential equation**. Changes to the amplitude at one point in configuration space depend only on immediate neighbors in configuration space.

  Eliezer's argument is that we have a bias toward 3D space because we are macroscopic creatures. But if the math says the fundamental stuff is the wavefunction, and the wavefunction evolves locally, then the theory is local.

  ### 4. The Deutsch-Hayden Formalism (The "Actual Walkthrough")

  If you want to see the mechanics of how MWI claims locality without hand-waving, look at the **Deutsch-Hayden formalism** (2000). This is the rigorous version of Eliezer's intuition.

  In the Heisenberg picture, operators evolve while the state vector stays fixed. Deutsch and Hayden showed that in MWI, you can describe the flow of information entirely through **local operators**.

  1.  **Descriptive Locality:** The state of a system can be fully described by operators localized to that system's region.
  2.  **Information Flow:** When Alice measures her particle, the "information" about the measurement result is encoded in her local observables. It does not jump to Bob.
  3.  **Correlation:** The correlation between Alice and Bob only becomes accessible when their local information streams interact (i.e., when they meet up and compare notes in the future light cone).

  In this formalism, there is **no non-local influence**. The appearance of non-locality in Bell tests arises because observers mistakenly assume they occupy a single branch. If you track the "which-branch" information locally, everything stays within light cones.

  This supports Eliezer's claim: **MWI is locally causal in the sense that no physical influence propagates faster than light.**

  ### 5. So, Is It Semantics?

  It is not *mere* semantics, but it is **ontological**.

  *   **If you believe "Real" = "Definite outcomes in 3D space":** Then Bell's Theorem proves Non-Locality. MWI is false or "non-local" because it lacks definite outcomes in 3D space.
  *   **If you believe "Real" = "The Universal Wavefunction":** Then Bell's Theorem proves **Indefinite Outcomes**. MWI is Local because the Wavefunction evolves locally.

  Eliezer is arguing for the second ontology. He claims that "Single Outcome" is the hidden variable that Bell's theorem kills, not Locality.

  **The Verdict:**
  Eliezer is technically correct *within the context of MWI ontology*.
  1.  **Bell's Theorem:** Rules out Local + Single-Outcome.
  2.  **Copenhagen:** Keeps Single-Outcome, sacrifices Locality (or Realism).
  3.  **MWI:** Keeps Locality (of the wavefunction dynamics), sacrifices Single-Outcome.

  When textbooks say "Bell rules out Local Theories," they mean "Local Hidden Variable Theories" (which imply single outcomes). Eliezer points out that MWI is not a Hidden Variable theory; it is a "Many-Worlds" theory.

  **Does dropping Outcome Independence count as "Local"?**
  In MWI, you don't exactly "drop" Outcome Independence; you render it category-error. Outcome Independence asks: *Given Bob's outcome, what is the probability of Alice's?*
  In MWI, there is no "Bob's outcome" simpliciter. There is "Bob's outcome relative to a branch."
  Relative to a branch, the correlation exists. But the *mechanism* creating that correlation was local interaction in the past.

  ### Summary
  Eliezer isn't sneaking MWI in under the wire by redefining words arbitrarily; he is taking the mathematical formalism of QM (unitary evolution) literally.
  *   **Unitary Evolution:** Strictly Local (differential equations).
  *   **Born Rule/ Collapse:** Non-Local (instantaneous update across space).

  If you remove Collapse (MWI), you remove the only non-local mechanism in the math. The "non-locality" remaining is just the correlation of pre-existing entanglement, which is permitted by Special Relativity as long as no *signaling* occurs (which MWI respects).

  The friction you feel comes from the fact that human intuition is built on "Single World" experiences. Explaining why a "Local Many-Worlds" theory looks like a "Non-Local Single-World" theory to an observer inside it requires accepting that the observer is a subsystem of the wavefunction, not an external viewer of it.

  **Recommendation:** If you want the rigorous math backing Eliezer's claim, read David Deutsch and Patrick Hayden's *"Information Flow in Entangled Quantum Systems"* (2000). It explicitly demonstrates how locality is preserved in the Heisenberg picture under MWI, bypassing the "Outcome Independence" confusion.
