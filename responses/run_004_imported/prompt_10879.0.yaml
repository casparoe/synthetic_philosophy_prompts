          *   *Claim:* The flaw isn't in the marginal reasoning *during* the auction, but in the failure to pre-commit to a ceiling *before* entering. Distinguishes "decision to play" vs. "decision while playing."
          *   *Evaluation:* This is a standard Schelling-style move. If you can bind yourself, you should. If you can't, you are at the mercy of the sequential incentives. He's defending the coherence of marginal analysis *conditional* on being in the game without bindings.
