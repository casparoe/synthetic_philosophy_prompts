      *Missing Considerations:* I should mention *Common Knowledge of Rationality*. If both know both are rational, the auction shouldn't start. The fact it does implies one thinks the other is irrational. Also, *Resolute Choice* (McClennen) is the specific philosophical counter to Marcus's "pre-commitment" argument.

