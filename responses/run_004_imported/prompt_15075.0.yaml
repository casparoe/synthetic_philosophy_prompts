      *   *Correction:* No, not directly in the memo. It's too academic. Use the *insight* (functional integration) without the *jargon* (extended cognition). The attending can bring up Clark & Chalmers in the meeting; my memo should lay the groundwork so their point lands better without sounding like a philosophy seminar.
      *   *Critique:* How to handle the "slippery slope" (glasses/insulin)?
