      *   **Conflict:** Hospital Charter requires review for anything affecting "decision-making capacity or means of expression." Finance says it's DME. Attending (Clark & Chalmers fan) says it's part of her cognitive system (extended mind). Others say that's too philosophical/policy-unworkable (slippery slope to glasses/insulin).
      *   **Requirements:** Concrete recommendation with timeline, engage the "it's just equipment" argument seriously (not just wave it away), professional tone suitable for a hospital setting.

  2.  **Determine the Goal & Tone:**
      *   **Goal:** Persuade the committee to trigger an ethics review *before* any downgrade happens, without getting bogged down in metaphysical debates about the "extended mind."
      *   **Tone:** Professional, pragmatic, ethically rigorous but administratively feasible. It needs to bridge the gap between high-level philosophy (the user's background) and hospital policy (the committee's reality).
      *   **Strategy:** Avoid winning the "Extended Mind Thesis" (EMT) debate. Instead, focus on *functional dependency* and *risk assessment*. Even if it's "just equipment," the *consequence* of failure is unique compared to a wheelchair or glasses.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary/Recommendation:** Put the bottom line up front. We need a review. Pause the reclassification.
      *   **The Policy Question:** Address the Charter. The key phrase is "means of expression."
      *   **Engaging the "Just Equipment" Argument:** This is crucial. I can't just say "Clark & Chalmers says it's her mind." I need to show why the *functional impact* distinguishes this from glasses/insulin.
          *   *Glasses:* Correct vision, but don't generate speech/consent.
          *   *Insulin:* Regulates biology, but doesn't mediate autonomy.
          *   *Wheelchair:* Mobility is crucial, but this device mediates *moral agency* (consent, refusal, communication of pain/preferences).
          *   *Argument:* It's not about *what* it is ontologically, but *what it does* functionally regarding autonomy.
      *   **The Risk:** Downgrading support risks latency, errors, or failure. For an LIS patient, a 10-minute glitch isn't an inconvenience; it's incapacitation.
      *   **Recommendation/Timeline:**
          1.  Freeze reclassification immediately.
          2.  Convene ad-hoc subcommittee (Ethics + IT + Finance + Clinician).
          3.  Decision within 14 days (before the 30-day notice window closes).
      *   **Conclusion:** Reiterate that this protects the hospital from liability and upholds the Charter.

  4.  **Refining the Argument (Self-Correction during drafting):**
