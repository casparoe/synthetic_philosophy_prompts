answer: |-
  You have put your finger on one of the most persistent and damaging problems in contemporary meta-ethics. Your intuition is exactly right: if the Fitting-Attitude (FA) analysis defines value as "there being sufficient reasons to hold a pro-attitude toward $X$," the Tyrant (or the classic "Evil Demon") seems to prove that definition false. He provides sufficient reasons, but no value.

  The project you are describing is the attempt to save the FA analysis (often associated with T.M. Scanlon's *buck-passing account* of value) by filtering out these "wrong kind of reasons" (WKRs) without smuggling the concept of value back in through the back door.

  Here is a walkthrough of why this distinction has proven so elusive, the major proposals philosophers have made to solve it, and an evaluation of whether the project is viable or circular.

  ---

  ### 1. The First Attempt: Object-Given vs. State-Given Reasons

  The most intuitive solution, proposed early on by philosophers like Derek Parfit and John Skorupski, is to distinguish the *source* of the reason.

  *   **The Proposal:** A **Right Kind of Reason (RKR)** is "object-given." It cites a property of the object of the attitude (e.g., the Tyrant's courage, his wisdom). A **Wrong Kind of Reason (WKR)** is "state-given." It cites a property of *holding the attitude* (e.g., the safety I gain by admiring him, the reward I receive).
  *   **The Appeal:** This matches your intuition. The Tyrant's threat is about *your state* (your safety), not *his properties* (his admirability).
  *   **Why It Fails:** This distinction collapses under counterexamples.
      1.  **Object-Given WKRs:** Imagine a case where admiring a mediocre artist would save the world (perhaps a demon will destroy the earth unless you admire him). Now imagine the artist actually *is* quite talented (an object-given property), but not talented enough to warrant admiration on his own merits. The fact that he is talented is an object-given reason, but if the *sufficient* reason to admire him is saving the world, the object-given property is doing the heavy lifting in a way that still feels like a WKR scenario.
      2.  **State-Given RKRs:** Conversely, consider fear. If a cliff is dangerous, that is a property of the cliff (object-given). But if I am afraid, I am in a state of fear. Sometimes reasons that look state-given are actually legitimate. More damningly, consider the "Genuine Admiration" counterexample. If the Demon threatens to torture me unless I *genuinely* admire him, and I succeed in doing so, the reason (avoiding torture) caused the attitude. But avoiding torture is a property of the *state of admiring*, not the *object*. If the Object/State distinction were the filter, this reason would be excluded. But intuitively, this is the *paradigm* of a Wrong Kind of Reason. The distinction fails to exclude the Tyrant's threat.

  ### 2. The Second Attempt: Reasons *for* vs. Reasons *to Cultivate*

  A second strategy, championed by philosophers like Rabinowicz and Rønnow-Rasmussen, shifts focus from the reason to the **relation** the reason bears to the attitude.

  *   **The Proposal:** WKRs are not reasons *for* admiring; they are reasons *to bring it about that one admires*. The Tyrant gives me a reason to *make myself* admire him (perhaps through therapy or hypnosis), but he does not give me a reason that counts in favor of the admiration itself.
  *   **The Appeal:** It preserves the idea that value is about reasons that count in favor of the attitude's content.
  *   **Why It Fails:** This runs into the problem of **direct voluntarism**. Can I admire someone simply because I have a reason to do so?
      *   If the answer is **No** (we cannot admire at will), then the Tyrant's threat is incoherent. He can't threaten me to do something impossible. But if he threatens to torture me until I *believe* the earth is flat, and I somehow manage to convince myself, did I have a reason *for* the belief? No.
      *   If the answer is **Yes** (I can cultivate admiration directly in response to incentives), then the Tyrant *does* give me a reason for admiring. I admire him *because* of the threat. In that case, the reason *is* for the attitude, and the distinction dissolves.
      *   Furthermore, this risks circularity. To say a reason counts "in favor of the attitude itself" often just means "in favor of the attitude *being fitting*." But "fitting" is the value-laden term we were trying to define.

  ### 3. The Third Attempt: The "Fittingness" Primitive

  Facing these failures, many FA theorists have retreated from defining value in terms of *reasons* and instead define it in terms of **fittingness**.

  *   **The Proposal:** Instead of saying "$X$ is good iff there are reasons to favor $X$," they say "$X$ is good iff it is *fitting* to favor $X$." They then argue that WKRs are reasons to favor $X$ that do not make favoring $X$ *fitting*.
  *   **The Appeal:** It bypasses the reason-talk. The Tyrant gives me a reason to admire, but admiring him is *unfitting*.
  *   **The Circularity Charge:** This is where your specific worry hits home.
      *   If "fitting" means "merited" or "appropriate," aren't we just using synonyms for "valuable"?
      *   If the FA theory is meant to be **reductive** (explaining value in non-evaluative terms), this fails. To say an attitude is "fitting" is usually to say it correctly represents the value of the object. If you need to know the object is valuable to know if the attitude is fitting, you haven't explained value; you've presupposed it.
      *   **The Defense:** Proponents (like Scanlon in later work, or Justin D'Arms and Daniel Jacobson) argue that fittingness is a *sui generis* normative relation. It is primitive. We don't define it in terms of value; we define value in terms of it.
      *   **The Verdict:** This escapes *logical* circularity (A is defined by B, B is undefined), but it abandons the **reductive ambition**. It no longer explains value in terms of something else (like reasons or natural properties); it just posits a new normative primitive. For many philosophers, this is a retreat, not a solution.

  ### 4. The Fourth Attempt: The "Guise of the Good" Constraint

  A more recent line of defense relies on the psychology of the attitudes themselves.

  *   **The Proposal:** Attitudes like admiration, belief, or fear have a "constitutive aim." Belief aims at truth; admiration aims at admirability. You cannot admire something *for* a reason that contradicts the aim of admiration. The Tyrant's threat is a reason to *have* the attitude, but it cannot serve as the *basis* for the attitude without destroying the attitude. If I admire you *only* because of the threat, I am not actually admiring you; I am pretending or engaging in a strategic simulation.
  *   **The Appeal:** It grounds the distinction in the nature of the mind, not in value.
  *   **Why It Fails:** It relies on a controversial view of mental states.
      *   **Self-Fulfilling Prophecies:** I can genuinely come to admire someone because I was paid to study them closely, and in studying them, I found admirable traits. The payment (WKR) caused the admiration, but the admiration is based on traits (RKR). The WKR was the *causal* explanation, but the RKR was the *justificatory* basis.
      *   **The Demon Case:** If the Demon is powerful enough, he can force the psychological state. If I genuinely feel the warmth of admiration solely to avoid pain, have I not admired? If yes, the "constitutive aim" argument fails. If no, then the Demon's threat is logically impossible to fulfill, which changes the thought experiment.

  ### Evaluation: Is the Project Stuck?

  To answer your final question: **The reductive project is largely considered dead, but the structural insight remains alive.**

  **1. The Circularity Verdict:**
  Almost every attempt to draw the RKR/WKR distinction cleanly without presupposing value has failed.
  *   If you define RKRs as "reasons related to the object's properties," you face counterexamples (the saving-the-world artist).
  *   If you define RKRs as "reasons that make the attitude fitting," you are circular (fittingness = value).
  *   If you define RKRs as "reasons compatible with the attitude's nature," you rely on contentious philosophy of mind that doesn't fully block WKRs.

  The consensus among meta-ethicists (such as those contributing to the *Fitting Attitudes* anthologies edited by Rabinowicz and Rønnow-Rasmussen) is that you cannot filter WKRs using only non-evaluative terms. To identify a WKR, you essentially have to ask: *"Does this reason make the attitude appropriate?"* But "appropriate" is the value concept you were trying to analyze.

  **2. Is the Whole Project Stuck?**
  Not necessarily, but it has transformed.
  *   **Abandoning Reductionism:** Most contemporary FA theorists no longer claim to *reduce* value to reasons. Instead, they offer a **structural analysis**. They argue that value concepts *are* concepts about reasons/fittingness, even if "reasons/fittingness" are themselves normative primitives. This saves the theory from circularity by admitting that normativity is fundamental, but it gives up the hope of explaining normativity in naturalistic or non-normative terms.
  *   **Reasons First:** Some (like Scanlon and Schroeder) flip the script. They argue we shouldn't try to define value at all. We should accept that "Reasons" are the fundamental normative currency. Value is just a placeholder for "what we have reasons to care about." In this view, the WKR problem is a bug in the *definition* of value, not in the nature of reasons. They argue the Tyrant gives you a reason to *act* (admire), but not a reason that makes the admiration *correct*. They accept that "correctness" is a separate normative notion from "reasons."

  ### Conclusion

  Your suspicion is well-founded. The distinction between the Right and Wrong Kind of Reasons has turned out to be incredibly hard to draw cleanly because **the filter required to separate them looks suspiciously like the concept of value itself.**

  If you need to know what is "admirable" to know which reasons are the "right kind" for admiration, then you haven't explained admirability in terms of reasons; you've explained it in terms of reasons-plus-admirability.

  Consequently, the "Buck-Passing" theory in its strong, reductive form is widely viewed as failing to solve the WKR problem without circularity. However, the weaker claim—that value is *intimately connected* to fitting attitudes and reasons—remains a dominant framework in ethics. The project isn't stuck, but it has had to lower its ambitions: it can tell us how value *functions* in our reasoning, but it cannot tell us what value *is* without using normative terms. The Tyrant, unfortunately, remains at large.
