answer: |-
  The rain against the high windows of the committee room was the only sound, a rhythmic static that matched the exhaustion settling over the three jurors. On the table lay a single copy of *The Fracture Line*, the finalist manuscript. The charter of the Valerius Prize was explicit, printed on the heavy cardstock before them: *Award only if the work is demonstrably Formally Original AND Emotionally Truthful.*

  Arthur, the chair, rubbed his temples. "We have been here four hours. We agree on the rule. We agree on the book. We cannot agree on the verdict. Let us state our positions for the record, one last time."

  He looked to Elena. She was the critic, sharp-eyed and unforgiving of sentimentality.

  "Originality," Elena said, her voice crisp. "Yes. The narrative structure is fragmented in a way I haven't seen. It demands effort. But Emotional Truth? No. It is cold. It feels like an exercise, not a confession. Since both conditions are not met, my verdict is No."

  Arthur nodded and turned to Simon. Simon was the writer, prone to empathy.

  "Originality? No," Simon said, shifting in his chair. "It uses established tropes of the unreliable narrator. It's competent, but not new. However, Emotional Truth? Absolutely. I wept at the ending. It feels human. But since both conditions are not met, my verdict is also No."

  Arthur looked down at his own notes. He was the academic, the structuralist. "I find it Original. Yes. I find it Truthful. Yes. Therefore, my verdict is Yes."

  He sat back. The air in the room grew heavy, not with anger, but with a strange, logical vertigo.

  "Let us tally the verdicts," Arthur said quietly. "Elena: No. Simon: No. Arthur: Yes. The motion to award the prize fails, two to one."

  Simon exhaled, reaching for his wine glass. "Then it's done. A pity, but the bar is high."

  "Wait," Elena said. She was staring at the charter card. "We voted on the conclusion. But the charter dictates we judge based on the criteria. It says 'Award *if*...' It implies the criteria are the foundation of the verdict. Should we not tally the criteria themselves?"

  Arthur paused. He saw the trap opening, a geometric flaw in the floor of their reasoning. "Are you proposing a premise-based procedure rather than a conclusion-based one?"

  "I'm proposing we follow the charter's logic," Elena said. "Let us vote on Originality as a collective fact. I voted Yes. Simon voted No. Arthur voted Yes. That is two Yes votes. The panel finds the book Original."

  Simon frowned. "But I still think it's derivative."

  "Collectively, the panel finds it Original," Elena insisted. "Now, Emotional Truth. I voted No. Simon voted Yes. Arthur voted Yes. That is two Yes votes. The panel finds the book Truthful."

  She leaned forward, her eyes locking with Arthur's. "If the panel finds it Original, and the panel finds it Truthful, then according to the charter, the panel must award the prize. Yet, when we voted on the prize itself, the panel rejected it."

  Simon put his glass down. "That's impossible. We are the panel. If two of us say No, the prize is not awarded. How can the sum of our parts be greater than the whole?"

  Arthur stood up and walked to the whiteboard. He drew three columns, labeled with their names. He drew two rows, labeled *Original* and *Truthful*. He filled in the Yes/No grid.

  "Individually," Arthur said, marking the bottom row *Verdict*, "we are consistent. Elena and Simon, you both reasoned that if one criterion fails, the verdict must be No. I reasoned that if both pass, the verdict is Yes. We are all rational agents."

  He turned to them, marker in hand. "But collectively, we are inconsistent. The majority opinion holds that the book is Original. The majority opinion holds that the book is Truthful. But the majority opinion holds that the book should *not* win."

  "That's a contradiction," Simon said, rubbing his face. "How can we say it meets the requirements but doesn't deserve the award?"

  "We can't," Arthur said. "Not without violating either our individual integrity or the collective logic of the charter."

  Elena stood and walked to the window. "If we vote on the verdict, we ignore the fact that the majority supports both criteria. We deny the book a prize that the majority believes it qualifies for."

  "And if we vote on the criteria?" Simon countered. "Then we force a win on a majority who voted against the win. I voted No. Elena voted No. If you declare the winner based on the criteria tally, you are overriding our actual judgments on the outcome. You are saying my 'No' doesn't count because my reasons were different from Elena's."

  "It is the discursive dilemma," Arthur murmured, more to himself than them. "Kornhauser and Sager. List and Pettit. We thought we were judging literature. We are actually fighting over the architecture of reason."

  "So what do we do?" Simon asked. "We cannot submit a report that says 'The book wins' and 'The book loses' simultaneously."

  Arthur looked at the manuscript. It sat innocently on the mahogany, a vessel for their paradox. He realized the prize was not about the book anymore. The book was merely the input variable for a machine that had jammed.

  "We have to choose which inconsistency we can live with," Arthur said. "Do we privilege the integrity of the individual juror? Then the book loses. Two of you said No. To override that is to disenfranchise the minority view on the verdict, even if their reasons differ."

  "Or," Elena said, turning from the window. "Do we privilege the integrity of the institution? The charter sets the criteria. If the collective mind of the jury affirms the criteria, the institution demands the prize be awarded. To deny it is to lie about the book's qualities."

  Simon laughed, a dry, humorless sound. "So if we give the prize, we betray our votes. If we deny it, we betray our findings. We are damned if we aggregate by premise, and damned if we aggregate by conclusion."

  Arthur capped the marker. The click was final. He looked at the tally on the board. The logic was flawless, and it was useless. It proved that a group of rational people could form an irrational entity.

  "We are three humans," Arthur said softly. "Not a single mind. The charter assumes the jury is a singular agent. It is not."

  "Then the charter is wrong," Elena said.

  "Or we are," Simon replied.

  Arthur picked up the manuscript. He weighed it in his hands. It was light, paper and ink, burdened with a weight it could not carry. He thought of the press release. He thought of the logic. He thought of the silence that would follow whichever choice they made.

  "We must vote again," Arthur said. "Not on the book. On how we vote."

  Elena sat back down. Simon poured more wine. The rain continued to beat against the glass, indifferent to the paradox inside, washing over the room in a steady, illogical stream.

  "On the procedure," Arthur said. "All in favor of binding the verdict to the criteria tally?"

  Elena raised her hand. Simon kept his hand on the table. Arthur raised his.

  "One yes, one no, one abstention," Arthur said. "We cannot even agree on how to disagree."

  He placed the book back on the table. "We will submit no winner."

  "And the reason?" Elena asked.

  Arthur looked at the whiteboard, at the grid of Yeses and Nos that canceled each other out into a perfect, paralyzed zero.

  "Tell them," Arthur said, "that the book was too complex for the rules."
