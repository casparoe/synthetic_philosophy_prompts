          *   So, if the future is all Heads, the *current* chance (which depends on that future) would *not* have been 50%. It would have been higher.
          *   This is the "Undermining Future": A future that, if it happens, proves the current chance ascriptions false.
          *   *The Clash:* PP says: "Believe the future will happen to the degree of its current chance." So if chance is > 0, believe it's possible. But HS says: "If that future happens, the current chance wasn't what you said it was." So the proposition "Current Chance is X AND Undermining Future happens" is logically impossible. PP tells you to assign it positive credence. Contradiction.

