      *   *Why a Bug?* It leads to a direct contradiction in the probability calculus. $C(F | Ch(F)=x) = x$ (by PP) but $C(F | Ch(F)=x) = 0$ (by HS logic). $x$ cannot be both positive and zero.
      *   *The Fix (New Principle):* Don't condition on "The current chance is $x$." Condition on "The current chance is $x$ *given the actual history*." Or rather, condition on the proposition that *actually* assigns the chances. Rigidify the reference to the chance function.
