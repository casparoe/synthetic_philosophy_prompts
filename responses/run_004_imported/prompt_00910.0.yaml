answer: |-
  This is a wonderfully precise question about a subtle passage. You have correctly identified the tension: if the possibility of fraud is logically ineradicable for any single instance, why does multiplying instances change the epistemic situation?

  Sidgwick is making a **probabilistic, cumulative case argument** grounded in a **pragmatic demarcation of scientific discourse**. He is not arguing for Cartesian certainty (Interpretation A), but rather for a shift in the *burden of plausibility* (Interpretation B).

  Here is a reconstruction of the argumentative moves Sidgwick is making, specifically regarding the status of the fraud allegation and the function of accumulation.

  ### 1. The Status of the Fraud Allegation: Logical vs. Reasonable
  Sidgwick is distinguishing between what is *logically possible* and what is *scientifically reasonable*.

  When he writes, *"We have done all that we can when the critic has nothing left to allege except that the investigator is in the trick,"* he is establishing a **criterion of methodological exhaustion**. He is arguing that scientific inquiry can only control for error, accident, misobservation, and environmental variables. It cannot control for the moral character of the agent. To demand that science prove the investigator is *not* lying is to demand something outside the scope of empirical method.

  Therefore, the closing move—*"But when he has nothing else left to allege he will allege that"*—is not a concession that the inquiry has failed. Rather, it is a diagnosis of the skeptic's position. Sidgwick is claiming that once methodological controls are maximized, the "scientific incredulity" he mentions earlier ceases to be a scientific objection and becomes a **moral accusation** (*ad hominem*).

  Sidgwick is effectively saying: *At this point, the skeptic is no longer arguing about the evidence; they are arguing about the integrity of the witness.* Since the Society cannot scientifically prove its own honesty (only demonstrate it), this is the pragmatic limit of the inquiry. To stop here is not to admit defeat, but to recognize that further methodological refinement is useless against bad-faith skepticism.

  ### 2. Why Accumulation Helps (The Solution to Your Second Worry)
  You ask: *If the fraud-hypothesis is available against the thousandth witness as against the first, why accumulate?*

  Sidgwick's answer relies on the **independence** of the witnesses and the **complexity of the conspiracy** required to maintain the fraud hypothesis.

  *   **Single Case:** If Investigator A produces a result, the hypothesis "Investigator A is lying" is a simple, parsimonious explanation for the skeptic. It requires only one person to be morally compromised.
  *   **Accumulated Cases:** If Investigators A, B, C... through Z (all independent, with "a fair stock of credit") produce similar results, the hypothesis "Investigator A is lying" no longer suffices. The skeptic must now argue for a **conspiracy** or a **coincidence of moral failure**.

  Sidgwick hints at this with the De Morgan reference ("credit to draw upon"). "Credit" here functions as a prior probability of honesty. As you stack independent witnesses with high prior credit, the probability that *all* of them are simultaneously engaged in a trick diminishes rapidly.

  To maintain the fraud hypothesis against a "heap of facts," the skeptic must construct an increasingly elaborate and improbable narrative (e.g., "They are all in on it," or "It is a bizarre coincidence that all these reputable men were deceived in the exact same way"). Sidgwick's argument is that while the fraud hypothesis remains *logically* available for the thousandth witness, it becomes **explanatorily bankrupt**. It violates the principle of parsimony.

  Thus, accumulation does not remove the *logical possibility* of fraud; it removes the *rational warrant* for asserting it.

  ### 3. The Nature of the Argument: Probabilistic Pragmatism
  Sidgwick is applying a method similar to his ethical intuitionism and his utilitarian calculus to epistemology. He is treating credibility as a quantifiable weight.

  *   **"Scientific Incredulity" as a Prior:** He acknowledges that the "common sense of mankind" (specifically the scientific establishment) has a very strong prior belief against psychical phenomena ("strong roots").
  *   **Bayesian Updating:** A single piece of evidence, however strong, cannot overcome that massive prior. You need a "heap of facts" to shift the posterior probability enough to make belief rational.
  *   **The Limit of Proof:** Sidgwick knows that in empirical matters, especially controversial ones, absolute demonstration is impossible. He is aiming for **moral certainty** (certainty sufficient for rational belief and action), not logical necessity.

  The final sentence is therefore a **rhetorical and strategic boundary marker**. He is telling his audience (the SPR members): *Do not waste time trying to prove your honesty to a skeptic who has run out of methodological objections. Their refusal to accept the mass of evidence is no longer an intellectual problem; it is a psychological obstinacy.*

  ### Summary
  Sidgwick is not conceding that fraud can never be excluded (Interpretation A), nor is he claiming that accumulation makes fraud logically impossible.

  He is arguing that:
  1.  **Epistemic Responsibility:** Investigators discharge their responsibility when they rule out all non-moral sources of error.
  2.  **Reasonableness:** Once that is done, alleging fraud is logically possible but increasingly unreasonable as independent witnesses accumulate (due to the improbability of mass collusion/coincidence).
  3.  **Strategic Closure:** The final sentence identifies the point where the debate leaves the realm of science and enters the realm of *ad hominem* attack. At that point, the correct strategy is not to argue, but to "peg away" and add more independent facts to the heap, making the fraud hypothesis ever more implausible.

  He is making a **cumulative probabilistic argument** designed to shift the burden of proof onto the skeptic, defining the point at which the skeptic's resistance becomes dogmatic rather than scientific.
