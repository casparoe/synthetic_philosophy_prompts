      *   **(c) Synchronic Dutch-book arguments for probabilism:** Shows that if credences violate probability axioms, you can be booked for a sure loss. *Critique:* Applies to beliefs, not necessarily preferences/utility. Doesn't imply EU maximization over actions. Doesn't imply instrumental convergence.
      *   **(d) Diachronic money-pump arguments against cyclical preferences:** Shows that if preferences are intransitive/cyclical, you can be money-pumped. *Critique:* This is the core "coherence argument" for why agents *should* be coherent. However, Shah argues agents can have policy-dependent preferences that avoid pumps without being simple EU maximizers over states. Still, this is stronger than mere representation theorems because it offers a pragmatic cost to incoherence.
