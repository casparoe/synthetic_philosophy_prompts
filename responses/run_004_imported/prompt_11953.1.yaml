      *   **Conclusion:** Sufficiently capable AI -> Expected Utility (EU) Maximizer with stable utility -> Convergent Instrumental Behavior (CIB).
      *   **(a) von Neumann–Morgenstern (VNM) theorem:** Shows that if preferences satisfy axioms (Completeness, Transitivity, Independence, Continuity), they can be represented as EU maximization. *Critique:* It's a representation theorem. It doesn't say agents *must* satisfy the axioms. It doesn't imply instrumental convergence directly. It assumes preferences exist over lotteries. Rohin Shah's point: You can represent any behavior as EU maximization if you define the utility function over trajectories appropriately (triviality). So, on its own, it doesn't force goal-directedness.
