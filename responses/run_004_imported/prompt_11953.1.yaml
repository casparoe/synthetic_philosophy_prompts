      *   **(f) Wald's complete class theorem:** Every admissible decision rule is a Bayes rule. *Critique:* Often cited as support for EU maximization. However, "admissible" means "not dominated by another rule". This is closer to an evolutionary/selection argument. It suggests that if you want to be efficient, you should be Bayesian. But it doesn't force a *single* stable utility function across contexts, nor does it directly imply instrumental convergence (unless combined with other assumptions). It's strong mathematically but relies on the definition of admissibility which might not map perfectly to "capable AI".
      *   **(g) Long-run selection arguments:** Agents that fail to maximize EU get outcompeted. *Critique:* This is often seen as the strongest *physical* reason for AI to converge. However, it depends on the selection environment. If the environment doesn't select for resource accumulation or shutdown resistance, it won't happen. Also, "maximizing EU" is vague here (see Shah's triviality point). But as a mechanism for *why* AI might become goal-directed, it's often rated higher than pure math theorems because it appeals to dynamics rather than static rationality. However, recent critiques (like those regarding path-dependence vs. goal-directedness) suggest selection might not produce simple EU maximizers.

