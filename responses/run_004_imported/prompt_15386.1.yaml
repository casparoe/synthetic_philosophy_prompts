      *   *Is the Systems Reply explicitly named by Leibniz?* No, but the logic is addressed.
      *   *Make sure not to conflate Searle and Leibniz too much.* Searle is about syntax/semantics. Leibniz is about mechanism/unity. They overlap but differ.

  9.  **Final Polish:** Check against the specific questions asked in the prompt.
      *   Q1: Ignorance vs. Principle? -> Principle (Categorial).
