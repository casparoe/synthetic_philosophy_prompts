  *(Self-Correction Note: Make sure Kael doesn't sound like he's saying Elias *should* be punished personally, but rather that the moral status is different. McMahan allows for excuses based on non-culpable ignorance. Elias needs to defend why the *status* matters for the conduct of war.)*

