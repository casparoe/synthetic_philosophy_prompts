answer: |-
  **Setting:** *A half-collapsed cellar beneath a ruined farmhouse in the No-Man's-Land sector. The ceiling is shored up with timber beams. Dust motes dance in the shaft of light coming from a crack in the masonry. It is 04:30. A formal truce is in effect until 06:00 to allow medics to collect the wounded from the slope above. Two infantrymen sit on opposite sides of a rusted stove. One is ELIAS (uniform faded, insignia of the defending nation). The other is KAES (uniform darker, insignia of the invading force). They are smoking shared cigarettes.*

  **Kaes:** You know what happens at six.

  **Elias:** I know. Truce ends. We go up the ladder. You try to take the ridge; I try to hold it.

  **Kaes:** And if I put a round in your chest? Morally speaking. Right now, while the guns are quiet. Are you going to tell me I'm within my rights?

  **Elias:** You're a soldier. I'm a soldier. We're both armed. We're both wearing uniforms. As far as I'm concerned, we're equals. If you shoot me, it's war. If you shoot a medic, it's a crime. That's the line.

  **Kaes:** That's the *convention*, Elias. Not the morality. My government started this war. We crossed the border. Your side is defending homes. If I shoot you at 06:01, I am enforcing an unjust aggression. You are defending innocent life. How can we be moral equals when the reasons for our violence are opposites?

  **Elias:** Because I can't know that. Not really. I'm a private. I get a briefing, maybe a pamphlet. Your generals say you're liberating us; our generals say you're enslaving us. If you expect me to adjudicate the justice of the entire conflict before I pull a trigger, the army stops functioning. We'd be philosophers in foxholes, not soldiers.

  **Kaes:** But that's exactly the problem. You're conflating *excuse* with *justification*. Just because you *can't* know the truth doesn't change the truth. If I attack you without a just cause, I violate your right to life. You have a right to stop me. I do not have a right to kill you. I might be… excused. Maybe I'm coerced by conscription. Maybe I'm non-culpably ignorant. But that just means I'm not a monster. It doesn't mean I'm innocent. It doesn't mean my bullet is legitimate.

  **Elias:** Legitimate to whom? The court in the sky? Look, if you tell the average conscript, "You don't have the right to fight unless you're sure your cause is just," you don't get peace. You get massacre. Because the guys who *think* they're just—usually the aggressors, by the way—will fight without restraint. And the guys who doubt themselves will hesitate and die. The "Moral Equality of Combatants" isn't a metaphysical truth, Kaes. It's a firewall. It keeps *jus ad bellum* separate from *jus in bello*. It says: "Fight hard, but fight by the rules."

  **Kaes:** A firewall built on a lie. If I'm an unjust combatant, I am liable to be killed by you. You are not liable to be killed by me. That's the reality. If we admit that, then maybe soldiers think twice before following orders to invade a country that hasn't threatened them. Right now, the theory gives me a moral shield. It tells me, "As long as I don't shoot prisoners, I'm clean." It lets me off the hook for the war itself.

  **Elias:** It's not letting you off the hook. It's recognizing the reality of the profession. We are instruments of the state. Once the state decides to fight, we stand in the gap. If you strip me of my right to fight because my cause is dubious, you strip me of my protection under the Geneva Convention. Then, if you capture me, why not execute me? I'm just a criminal aggressor, right?

  **Kaes:** Because practicality matters for *processing* prisoners, not for the act of killing. I'm talking about the moment of violence. If the truce ends and I shoot you, I am doing something objectively wrong. You shooting me is objectively permissible. The symmetry is false. Your TA—sorry, your commanders—might say we're equals to keep the war from becoming total, but that's pragmatic, not moral.

  **Elias:** Pragmatics *are* morality in war, Kaes! If the convention collapses, more civilians die. More POWs die. If I believe I'm fighting a "criminal," I'm less likely to take his surrender. If you believe you're fighting a "defender with superior rights," you might feel justified in using whatever means necessary to survive. The equality of combatants is a reciprocal bargain. I acknowledge your right to fight me if you acknowledge mine. It restrains violence.

  **Kaes:** But it restrains it equally, regardless of justice. It puts the victim of aggression on the same level as the aggressor. Imagine a street fight. If a mugger attacks a pedestrian, and the pedestrian fights back, we don't say they have "equal rights" to punch each other. The mugger is liable; the pedestrian is justified. Why is war different?

  **Elias:** Because in a street fight, I know you're a mugger. In war, I know you're a guy in a uniform ten meters away. I don't know your orders. I don't know your intelligence reports. The epistemic burden is too high. McMahan—your guy, right?—he talks about liability tracking moral responsibility. But responsibility is murky here. I didn't choose the war. I chose to serve. If I follow the rules of engagement, I've done my part. If the cause is rotten, that's on the politicians, not on me.

  **Kaes:** That's the "Nuremberg Defense" lite. "I was just following the rules of engagement." Politicians pull the trigger through us. We are the bullets. A bullet doesn't have moral agency, sure, but a human being does. If I know, even vaguely, that we are the ones who crossed the border, then I bear some responsibility for the harm I cause. My ignorance might mitigate my blame—make me less culpable—but it doesn't make the harm permissible. You're defending something you have a right to. I'm taking something I have no right to.

  **Elias:** And if you're wrong? What if your intelligence was fed to you? What if your government convinced you this was preemptive self-defense? If you fight thinking you're unjust, you demoralize your own unit. You hesitate. And hesitation gets your buddy killed. The theory of Moral Equality allows you to fight with the conviction necessary to survive, provided you don't target non-combatants. It protects your conscience so you can do your job.

  **Kaes:** It anesthetizes the conscience. There's a difference. I can fight to survive, Elias. I can even fight because I'm coerced. But I shouldn't lie to myself and say I have a *right* to kill you. I don't. If I kill you, it's a tragedy that might be excused by the circumstances of coercion or confusion. But if we call it "equal," we normalize the killing of people who are doing nothing wrong but defending their homes.

  **Elias:** Normalization is what keeps you from shooting the medics who are currently crawling up that slope. If we start grading our right to kill based on the justice of the cause, then every soldier decides for himself who deserves to live. You think your side is just; I think mine is. That's how holy wars start. That's how you get no quarter given. I'd rather we agree we're both dangerous, both permitted, and both bound by the same rules.

  **Kaes:** So we agree to a code of conduct based on a falsehood?

  **Elias:** I agree to a code of conduct based on survival. You call it falsehood; I call it the only thing that stops this from becoming a slaughter of the weak by the strong. You say I'm justified in shooting you. Fine. But if you say you're *not* justified in shooting me, then why should you follow the rules when I hunt you down? If you're a criminal aggressor, why shouldn't I treat you like one?

  **Kaes:** Because I might be non-culpable. I might believe I'm just. That's where the excuse comes in. I can treat you humanely not because you have a right to kill me, but because I recognize you are acting under the same constraints I am. I can respect your humanity without accepting your bullet as morally equivalent to mine.

  **Elias:** That's a very fine distinction to make when the muzzle flash is blinding you. In the heat, "excused" and "permitted" look the same. The blood comes out either way. But the *incentive* changes. If I think you're an unjust aggressor without rights, I'm less likely to take your surrender. If you think you're morally inferior, you're less likely to lay down your arms. The symmetry keeps the door open for peace.

  **Kaes:** Or it prolongs unjust wars by making the unjust combatants feel morally clean.

  *(A silence falls between them. The light in the crack of the masonry shifts from grey to a pale, cold orange. Distant sounds of engines warming up begin to filter through the earth.)*

  **Elias:** Sun's coming up.

  **Kaes:** Yeah.

  **Elias:** So. 06:00. You're going to come up that ladder. You're going to try to kill me.

  **Kaes:** I am.

  **Elias:** And you think you're doing wrong.

  **Kaes:** I think I lack justification. I think I'm liable if you shoot me. I think I'm acting under duress. But I will do it. Because if I don't, my squad dies. And I'm not willing to sacrifice them for a philosophical point I can't prove to a tribunal.

  **Elias:** And I'll be waiting. And I'll shoot back. And I'll tell myself I'm within my rights.

  **Kaes:** You are.

  **Elias:** But you won't tell yourself that?

  **Kaes:** No. I'll tell myself I'm trapped. There's a difference, Elias. One of us sleeps clean. The other sleeps knowing he's paying a debt he didn't incur.

  **Elias:** *(Stubs out the cigarette)* Maybe. But at 06:01, we're both just men with rifles. And the convention doesn't care about your debt. It cares if you aim for the head or the heart.

  **Kaes:** *(Stands up, brushing dust from his knees)* The convention cares about order. Morality cares about truth. We're about to find out which one matters more when the shooting starts.

  **Elias:** *(Stands as well, checking his weapon)* Let's hope the convention holds. For both our sakes.

  **Kaes:** Dawn's here.

  **Elias:** Dawn's here.

  *(They do not shake hands. They move to opposite sides of the cellar, hands on their weapons, waiting for the whistle. The light fills the room, erasing the shadows, but leaving the space between them unresolved.)*
