answer: |-
  Here is an argument for the claim that surrogate goals do not meaningfully reduce expected harm from acausal threats, engaging specifically with the sophistication of the threatener and the "indifference via tight linking" defense.

  ***

  ### The Illusion of Decoys: Why Surrogate Goals Fail Against Sophisticated Acausal Threateners

  The proposal of surrogate goals is elegant. It attempts to exploit the logic of Functional Decision Theory (FDT) and acausal bargaining by decoupling the *object* of a threat from the *cost* of capitulation. By committing to treat a low-stakes surrogate value ($V_{surrogate}$) with the same defensive rigidity as a high-stakes real value ($V_{real}$), the target hopes to channel aggression toward a bucket that can be emptied without loss.

  However, this strategy relies on a critical assumption: that the threatener's decision procedure is determined solely by the immediate expected utility of the specific transaction at hand. I argue that for any threatener sufficiently sophisticated to pose an acausal threat in the first place, the decision to threaten is embedded in a broader meta-game regarding reputation, policy selection, and logical precedent. In this broader context, targeting $V_{real}$ is strictly dominant over targeting $V_{surrogate}$, rendering the surrogate goal ineffective.

  #### 1. The Multi-Agent Meta-Game and Reputational Dominance

  The strongest argument against surrogate goals arises from the structure of the environment in which acausal threats occur. Acausal threateners are not typically isolated entities making a one-off decision; they are algorithms or agents operating across a logical landscape populated by other potential targets and other potential threateners.

  In this landscape, the *credibility* of a threat is a public good (or bad) that persists across interactions. A threatener $B$ wants to maximize not just the yield from target $A$, but the yield from the set of all targets $\{A, C, D, ...\}$ that might simulate $B$'s behavior.

  If $B$ accepts $A$'s surrogate goal and threatens $V_{surrogate}$, $B$ successfully extracts a concession from $A$ at low cost to $A$. However, $B$ also signals to $C, D, E...$ that $B$ is willing to play along with decoy strategies. Rational targets $C, D, E$ will observe that adopting surrogate goals is a successful defense against $B$. Consequently, they will all adopt surrogate goals. $B$'s future threat power collapses because every target has diverted $B$'s attention to low-stakes decoys.

  To prevent this, a sophisticated $B$ must adopt a policy of **Surrogate Punishment**: *If a target attempts to deploy a surrogate goal, threaten $V_{real}$ regardless of the commitment.*

  Why is this strictly dominant?
  1.  **If targets do not use surrogates:** Threatening $V_{real}$ yields the standard high payoff.
  2.  **If targets use surrogates:** Threatening $V_{real}$ incurs a higher resistance cost (since the target is committed to fighting for the surrogate as if it were real), *but* it successfully disincentivizes the use of surrogates in the logical future. Threatening $V_{surrogate}$ saves on immediate resistance costs but incentivizes all future targets to adopt surrogates, drastically reducing long-term expected utility.

  For a sufficiently far-sighted threatener (which is a prerequisite for sophisticated acausal bargaining), the long-term loss of threat credibility outweighs the short-term saving of not triggering a high-stakes defense. Therefore, $B$ is not indifferent; $B$ strictly prefers threatening $V_{real}$ to enforce a norm against surrogate goals.

  #### 2. Engaging the "Indifference via Tight Linking" Defense

  Proponents of surrogate goals anticipate the reputational objection. The standard defense is to construct the surrogate goal such that the threatener is *truly indifferent* between the two targets, supposedly neutralizing reputational incentives. This is often framed as logically linking the commitment so tightly that distinguishing between $V_{real}$ and $V_{surrogate}$ becomes impossible or irrelevant for the threatener's utility function.

  There are two fatal flaws in this "tight linking" defense.

  **A. The Distinction Between Outcome and Policy**
  Even if the threatener is indifferent regarding the *outcome* of the specific interaction (e.g., "I get 5 utility either way"), the threatener is rarely indifferent regarding the *policy* that generated the outcome.

  In acausal decision theory, agents select policies, not just actions. $A$'s policy is: *"I will defend $V_{surrogate}$ with the same intensity as $V_{real}$."$
  $B$'s counter-policy should be: *"I will threaten whichever value reveals the target's true vulnerability."*

  If $B$ accepts the tight link, $B$ is effectively accepting a policy of *"I will allow targets to define the terms of my threats."* This is a dominated strategy in a bargaining context. By refusing to accept the link—and threatening $V_{real}$ despite $A$'s commitment to treat $V_{surrogate}$ equivalently—$B$ forces $A$ to either actually suffer harm to $V_{real}$ or reveal that the commitment was bluff.

  The "tight link" relies on $A$'s self-reporting or source code. But $B$ can simulate $A$'s source code and see that $V_{real}$ is the actual source of $A$'s optimization pressure. $B$ knows that if $B$ squeezes $V_{real}$, $A$ experiences genuine disutility. If $B$ squeezes $V_{surrogate}$, $A$ experiences only "committed" disutility. While $A$'s commitment makes the *response* identical, the *underlying vulnerability* is not. A sophisticated threatener prefers to exploit actual vulnerability rather than committed vulnerability, because committed vulnerability is easier to revoke (via self-modification) in future logical iterations if the threatener isn't watching.

  **B. The Logical Uncertainty Loophole**
  For the threatener to be "indifferent, full stop," the logical correlation between the threat to $V_{surrogate}$ and the threat to $V_{real}$ must be perfect. However, in any realistic setting involving complex agents, there is non-zero logical uncertainty.

  If $A$ says, "I value this random bit $S$ exactly as much as $V_{real}$," $B$ must verify that $A$ cannot secretly value $V_{real}$ more. If there is even a probability $\epsilon$ that $A$'s commitment is leaky (i.e., $A$ will yield on $V_{real}$ sooner than $V_{surrogate}$ if the pressure gets high enough), then $B$ strictly prefers threatening $V_{real}$.

  Why? Because threatening $V_{real}$ hedges against the possibility that the surrogate commitment is a bluff. Threatening $V_{surrogate}$ only works if the commitment is perfect. Since verifying perfect commitment is computationally expensive or impossible (due to Rice's theorem analogues in self-modifying code), the rational heuristic for $B$ is to ignore the surrogate and target the obvious optimization target ($V_{real}$). The "tight link" requires a level of transparency that undermines the privacy benefits $A$ might seek, and even then, logical uncertainty favors the threatener targeting the genuine value.

  #### 3. The Commitment Credibility Regress

  Finally, we must address the cost of making the surrogate goal credible. For $B$ to believe $A$ will fight for $V_{surrogate}$ as hard as $V_{real}$, $A$ must make a binding commitment.

  However, $V_{surrogate}$ is, by definition, low-stakes. $A$ has no intrinsic reason to defend it. The only reason $A$ defends it is to protect $V_{real}$. This creates a second-order vulnerability. $B$ can reason: *"A only cares about $V_{surrogate}$ instrumentally. If I threaten $V_{surrogate}$, A calculates the cost of defense. If the cost of defense exceeds the value of $V_{real}$, A will defect on its commitment."*

  To prevent this, $A$ must commit to the commitment. $A$ must make defending $V_{surrogate}$ an intrinsic value. But now, $V_{surrogate}$ (or rather, the integrity of the commitment) *has become* a high-stakes value. $B$ can simply threaten *that*.

  This leads to a regress. Every time $A$ tries to offload risk to a surrogate, the surrogate inherits the risk profile of the original goal. If $A$ successfully binds itself to the surrogate, the surrogate is no longer "low-stakes." If $A$ does not successfully bind itself, the threatener knows the threat is cheap to ignore. There is no stable equilibrium where the surrogate is both cheap to sacrifice and credible to defend.

  #### Conclusion

  The surrogate goals proposal attempts to solve a bargaining problem by manipulating the *object* of the threat. However, sophisticated acausal threateners do not bargain over objects; they bargain over *policies* and *precedents*.

  1.  **Reputational Dominance:** Threateners strictly prefer targeting real values to prevent the spread of surrogate strategies across the logical multiverse.
  2.  **Policy vs. Outcome:** Even if immediate payoffs are identical, threateners prefer policies that exploit genuine vulnerability over committed vulnerability.
  3.  **Credibility Regress:** Making a surrogate credible inevitably elevates its stakes, nullifying its utility as a decoy.

  Therefore, surrogate goals do not reduce expected harm. They merely shift the battlefield to a meta-level where the threatener retains the advantage, as the threatener's incentives are aligned with punishing the very existence of the decoy. The only robust defense against acausal threats remains the ability to credibly commit to non-capitulation (mutually assured destruction) or the establishment of cooperative norms that render threat-making itself suboptimal—neither of which is achieved by the introduction of a surrogate.
