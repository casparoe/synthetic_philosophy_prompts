answer: |-
  You have stumbled directly into one of the most famous and vexing problems in modern moral philosophy. Your intuition that this is a named, well-trodden dilemma is correct. The specific argument your friend articulated is known as **Total Utilitarianism**, and the extreme conclusion she reached is famously called **The Repugnant Conclusion**.

  The philosopher who formalized this problem is **Derek Parfit**, in his seminal 1984 book *Reasons and Persons*. Parfit himself found the conclusion "repugnant," yet he struggled for hundreds of pages to find a logical way to avoid it without accepting other equally unpalatable premises.

  Here is a breakdown of what is going on in your disagreement, why your friend's reasoning is philosophically respectable, why the slide to the extreme feels inevitable, and whether there is a way out.

  ### 1. The Friend's Position: Total Utilitarianism
  Your friend's initial argument rests on a view called **Total Utilitarianism**. In this framework, the moral value of a state of affairs is determined by the **sum total** of wellbeing within it.

  *   **The Math:** If you have 2 children with 100 "units" of happiness each, the total is 200. If you have 10 children with 30 "units" each, the total is 300.
  *   **The Logic:** According to Total Utilitarianism, the second scenario is morally better because $300 > 200$. It treats wellbeing as a commodity: more is better, regardless of how it is distributed or what the average is.

  **Is this defensible?** Yes. It is the standard view of classical utilitarianism (associated with Jeremy Bentham and Henry Sidgwick). It appeals to an impartial altruism: if a life is worth living, bringing it into existence is a net positive for the universe. From this perspective, your friend isn't being selfish; she is arguing that she can create more *net good* by having a larger family, even if the *average* good per child is lower.

  ### 2. The Trap: The Mere Addition Paradox
  You mentioned that every time you tried to pinpoint where her reasoning broke down, you relied on a claim that felt arbitrary. This is precisely the trap Parfit identified. He demonstrated this using something called the **Mere Addition Paradox**.

  Imagine a spectrum of populations:
  *   **Population A:** A small number of people with extremely high quality of life (Your ideal family).
  *   **Population A+:** Population A plus a new group of people who are also happy, but slightly less so than A. (Adding happy people seems good, right?)
  *   **Population B:** A larger population where everyone has a slightly lower average than A+, but inequality is reduced. (Equality seems good, right?)

  If you agree that A+ is better than A (because you added happy lives), and B is better than A+ (because of equality or total sum), you must logically agree B is better than A. If you repeat this step hundreds of times, you eventually arrive at **Population Z**: a massive population where every life is only *barely* worth living.

  Because "better than" is transitive (if A > B and B > C, then A > C), if you accept the small steps, you must accept the conclusion. This is why you couldn't find a breaking point. Parfit showed that rejecting the Repugnant Conclusion requires rejecting at least one step in the chain that *individually* seems very plausible.

  ### 3. Can You Draw a Principled Line?
  You asked if there is a principled place to draw a line. The honest answer from the literature is: **It is incredibly difficult, and perhaps impossible, to do so without incurring other costs.**

  Here are the main attempts philosophers have made to stop the slide, and the problems with each:

  *   **Average Utilitarianism:** You maximize the *average* happiness rather than the total.
      *   *The Fix:* This blocks the Repugnant Conclusion immediately. A massive population of barely-happy people would have a low average.
      *   *The Cost:* This implies that if you have a very happy child, adding another happy child (who is slightly less happy than the first) lowers the average and is therefore *bad*. It could also imply that killing unhappy people is morally good because it raises the average. Most find this worse than the Repugnant Conclusion.
  *   **Critical-Level Utilitarianism:** You only count lives that exceed a certain threshold of quality. Lives below the threshold (even if worth living) count as zero or negative.
      *   *The Fix:* This stops the slide at the "barely worth living" stage.
      *   *The Cost:* Where do you set the line? If you set it at "very happy," you imply that creating a "moderately happy" person is morally neutral or wrong. This feels arbitrary (the very problem you encountered).
  *   **The Person-Affecting View:** Morality is only about making *specific people* better off. If a child doesn't exist, you haven't harmed them by not creating them.
      *   *The Fix:* You have no obligation to create more children to boost the "total."
      *   *The Cost:* This leads to the **Non-Identity Problem**. If you make choices that result in a future person having a difficult but worth-living life, this view struggles to explain why that was wrong, since that specific person wouldn't exist otherwise.

  ### 4. Context Matters: Family vs. The Universe
  There is, however, a potential escape route that is specific to your dinner conversation. Population ethics usually assumes an **impartial** viewpoint (the "view from nowhere"). But family planning is inherently **partial**.

  Most ethical systems distinguish between:
  1.  **Impartial Duties:** What we owe humanity/the universe (e.g., don't pollute, help strangers).
  2.  **Special Obligations:** What we owe our specific kin (e.g., our children, parents).

  You can argue that while Total Utilitarianism might make sense for a god-like being deciding how many souls to create in the universe, it does not apply to human parents. As a parent, you have a special obligation to the *particular* children you bring into the world to ensure they flourish.

  If you bring a child into a resource-strained environment where they cannot flourish, you may be violating your **special obligation** to them, even if their existence adds to the **impartial total** of global happiness. This allows you to reject your friend's conclusion without needing to solve Parfit's mathematical paradox. You are simply operating under a different ethical framework (Ethics of Care or Partiality) than she is (Impartial Utilitarianism).

  ### 5. Summary of the Disagreement
  *   **Is your friend's position recognizable?** Yes, it is classical Total Utilitarianism.
  *   **Does the extreme version follow?** Logically, yes. If you accept that adding a happy life is always good, and you accept transitivity, the Repugnant Conclusion follows. This is why Parfit called it a "conclusion" rather than a "fallacy."
  *   **Is there a principled line?** In abstract population ethics, no single solution satisfies all intuitions without creating new paradoxes. This is known as the **Impossibility Theorem of Population Ethics** (formalized later by Gustaf Arrhenius).
  *   **Where does that leave you?** You are not failing to find the argument; the argument is famously unresolvable in the abstract. However, in the concrete context of family life, you can appeal to the **quality of obligations** to existing/future kin over the **quantity of wellbeing** in the abstract.

  Parfit ended his discussion by saying that we must find a solution because the Repugnant Conclusion is unacceptable, but he admitted he hadn't fully found it. You are in good company: some of the brightest minds in ethics have spent the last 40 years trying to win the exact argument you had over dinner.
