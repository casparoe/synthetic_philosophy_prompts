      *   *Clarification on "Rationality":* Deniz is using a Bayesian/Subjective definition. Mara is using an Axiomatic/Objective definition. This is the root clash.
      *   *The "Question Begging" charge:* Deniz is right that defining rationality *as* BI makes any deviation irrational by definition. But if rationality is *maximizing utility given beliefs*, then passing can be rational.

  7.  **Final Polish:** Check against the prompt requirements.
