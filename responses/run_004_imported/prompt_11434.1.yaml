          *   However, in epidemiology, "replication" often means "holds up in a different population/adjustment," where tiny effects vanish due to unmeasured confounding. So there is a link, but it's indirect (bias amplification in large $N$).
      *   **Point 3: The Remedies:**
          *   Bayes Factors: Prior sensitivity is the main critique.
          *   Effect Sizes: Mention "Smallest Effect Size of Interest" (SESOI) and Equivalence Testing (TOST). This is the frequentist equivalent of the user's intuition.
      *   **Point 4: The "Small Sample" Objection:** Validate the user's self-critique. The canonical crisis is low power. But the "Large $N$" crisis is real in genomics/epi (the "P-value glut").
