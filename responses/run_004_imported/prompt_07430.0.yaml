      *Wait, one nuance:* The "Truth Norm" camp says "all that should matter in hindsight is whether the claim turns out true." I need to push back on this hard because it discourages risk-taking if you get punished for bad luck, OR it encourages recklessness if you get rewarded for lucky guesses. I need to frame the recommendation as protecting the *process*, not just the *outcome*.

