answer: |-
  **MEMORANDUM**

  **TO:** Editorial Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal: Verification Standards & Assertion Tiers (Pilot Program)

  ### Context and Purpose

  Last month, two separate incidents highlighted a critical gap in our editorial guidelines regarding assertion. In the state senator fundraising story, we hedged heavily ("sources allege," "documents suggest") while a competitor stated flatly that the law was broken. They were right; we looked timid. Two weeks later, on the schools beat, a reporter stated flatly that a superintendent "ordered records destroyed" based on a single confident source. That source was wrong; we looked reckless.

  We are currently operating without a shared definition of when a reporter has earned the right to state something as fact ("X did Y") versus when we must attribute or hedge ("Sources say X did Y").

  This memo proposes a new house standard for assertion, concrete linguistic tiers for reporters to use, and a six-month trial period with a mandatory review.

  ### The Three Frameworks

  In defining this standard, we have effectively been debating three distinct philosophical norms. It is vital we acknowledge the strengths and weaknesses of each before selecting one.

  **1. The Knowledge Norm ("Defend Under Oath")**
  *   **The Standard:** A reporter may only assert flat fact if they are certain enough to testify to it in a legal setting.
  *   **The Strength:** This offers the highest protection against libel and reputational damage. It prioritizes accuracy above all else.
  *   **The Risk:** As seen in the senator story, this can lead to paralysis. Journalism is not a court of law; requiring legal-grade certainty on deadline often means surrendering the story to competitors who are willing to trust their reporting.

  **2. The Truth Norm ("Hindsight Verification")**
  *   **The Standard:** Assertion is permissible if the claim turns out to be true. If we get it right, the level of pre-publication verification matters less.
  *   **The Strength:** This rewards boldness and aligns with our ultimate goal: publishing the truth. It prevents punishing reporters for being right even if their path was risky.
  *   **The Risk:** This conflates luck with skill. A reckless guess that lands true is rewarded, while a responsible process that encounters an unforeseen lie (like the superintendent source) is punished. It encourages gambling with the newsroom's credibility.

  **3. The Justification Norm ("Reasonable Verification")**
  *   **The Standard:** Assertion is permissible if the reporter has done the work a reasonable professional would do to verify the claim *at that time*, regardless of whether it later turns out false.
  *   **The Strength:** This aligns with the actual labor of journalism. It protects reporters who follow process but get lied to, while discouraging recklessness.
  *   **The Risk:** It is subjective. "Reasonable" is open to interpretation, which can lead to inconsistent enforcement between desks.

  ### Recommendation

  I recommend we adopt **The Justification Norm ("Reasonable Verification")** as our house standard, with specific safeguards to mitigate subjectivity.

  We cannot adopt the Knowledge Norm without ceasing to be a competitive news organization. We cannot adopt the Truth Norm without encouraging recklessness. The Justification Norm is the only standard that evaluates the *process* rather than just the *outcome*. It acknowledges that we will occasionally be wrong despite doing our jobs, provided our verification was robust.

  However, to address the subjectivity concern, we must define what "Reasonable Verification" looks like in practice. We cannot leave it to gut feeling.

  ### Proposed Assertion Tiers

  To make this actionable, reporters and editors should categorize claims into one of three tiers. This gives reporters concrete language to reach for when they cannot meet the bar for flat assertion.

  **Tier 1: Flat Assertion (The Standard)**
  *   **Language:** "The Senator violated campaign finance law." / "The Superintendent ordered records destroyed."
  *   **Verification Bar:** Requires **two** independent forms of confirmation (e.g., documents + on-the-record source; or two unrelated sources with direct knowledge) **AND** the subject has been given a meaningful opportunity to respond.
  *   **Use Case:** When the evidence is overwhelming and the interpretation is not legally ambiguous.

  **Tier 2: Attributed Fact (The Hedge)**
  *   **Language:** "According to campaign filings reviewed by the News, the Senator violated..." / "District emails indicate the Superintendent ordered..."
  *   **Verification Bar:** Requires **one** definitive form of evidence (documents, recordings) **OR** one highly reliable on-the-record source, but lacks a second independent confirmation or involves a technical interpretation (e.g., legal analysis) where experts might disagree.
  *   **Use Case:** When the data is clear but the *implication* is debated, or when we lack a second source to corroborate the primary evidence. This shifts the burden slightly to the evidence rather than the Newsroom's voice.

  **Tier 3: Developing Claim (The Safe Harbor)**
  *   **Language:** "Sources allege the Senator violated..." / "A person with knowledge of the matter said the Superintendent ordered..."
  *   **Verification Bar:** Based on a single source or unverified documents where the stakes of error are high.
  *   **Use Case:** Breaking news, sensitive investigations where sources fear retaliation, or when the subject has not yet responded. This allows us to publish without staking the full institutional reputation on the claim's absolute veracity.

  ### Implementation and Review Period

  Standards should not be static. I propose we adopt this framework as a **six-month pilot program**, beginning November 1st.

  **The Review Mechanism:**
  On May 1st, the Standards Committee will reconvene to review:
  1.  **Correction Data:** Did errors decrease? Were corrections primarily related to Tier 1 or Tier 3 assertions?
  2.  **Competitive Audit:** In instances where we used Tier 2 or 3, did competitors assert flatly? If so, was their verification actually superior, or did they simply take more risk?
  3.  **Newsroom Feedback:** Anonymous survey of reporters and desk editors on whether the tiers feel practical on deadline.

  ### Addressing Potential Concerns

  I anticipate two main objections to this proposal.

  **To the "Under Oath" Camp:**
  You are right that credibility is our only currency. However, if we require legal-grade certainty, we will systematically under-report on corruption and misconduct, because bad actors are adept at hiding evidence that meets the "beyond a reasonable doubt" standard. This standard protects you, too: if you follow the Tier 1 verification bar, you are protected even if a source lied to you, provided that source was vetted reasonably.

  **To the "Truth Norm" Camp:**
  You are right that our goal is to publish the truth. But rewarding a lucky guess is a dangerous strategy. If we judge decisions solely by hindsight, we incentivize reporters to skip verification steps in hopes of a scoop. This standard ensures that when we are wrong, it is because the world deceived us, not because we were negligent.

  ### Next Steps

  If the committee agrees in principle to the "Reasonable Verification" standard, I will draft a one-page cheat sheet for the newsroom detailing the three tiers with specific examples from our own recent coverage.

  I look forward to discussing this on Tuesday.
