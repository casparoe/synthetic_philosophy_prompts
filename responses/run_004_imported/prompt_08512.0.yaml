          *   Distinguish between *Ultimate Truth* (Buddhist) and *Conventional Truth* (Legal). The law *must* operate in Conventional Truth to function.
          *   *Crucial Point:* While the law cannot accept *anatta* as a legal defense for past acts (otherwise no law works), it *is* highly relevant to *future risk*. A person who truly internalizes non-self is statistically/philosophically less likely to re-offend (ego-driven violence).
      *   **Retribution vs. Protection:**
