prompt: |-
  A close friend from my rationalist reading group is getting married next month, and both she and her fiancé are the sort of committed effective altruists who have spent a decade taking Peter Singer's drowning-child argument at full strength: they have told plenty of skeptical relatives that a drowning child in a shallow pond a world away has exactly the same claim on you as one drowning at your feet, and that letting proximity or personal history tip the scales is a kind of moral illusion. I have been asked to give the toast, and it strikes me that a wedding vow is about the most extreme act of moral partiality on offer: a lifelong promise to place one particular person's welfare above every stranger's. Roughly half the room will recognize the pond, enjoy a well-aimed jab at the demandingness objection, and may even expect a nod to Bernard Williams's complaint that a husband who needs an impartial principle to permit him to save his drowning wife rather than a stranger has had "one thought too many"; the other half have never heard of Peter Singer and just want a nice wedding toast. Please write me a five-minute toast that uses this tension between the ethics of the pond and the ethics of the vow as its actual engine, and that resolves it warmly in the couple's favor, without either softening Singer's argument into something milder than it really is or letting the toast collapse into a philosophy lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for a close friend from a rationalist reading group.
      *   **Audience:** Mixed. ~50% are rationalists/effective altruists (EAs) familiar with Peter Singer's "drowning child" argument, the demandingness objection, and Bernard Williams's "one thought too many." ~50% are general guests (family, non-philosophy friends) who just want a nice toast.
      *   **Core Tension:** The conflict between Effective Altruism (impartiality, saving the drowning child regardless of proximity) and Marriage (extreme partiality, prioritizing one specific person above all others).
      *   **Goal:** Resolve this tension warmly in the couple's favor.
      *   **Constraints:**
          *   Do not water down Singer's argument (acknowledge its strength).
          *   Do not turn it into a philosophy lecture (keep it accessible and emotional).
          *   Length: Approximately 5 minutes (roughly 750-900 words spoken at a moderate pace).
          *   Tone: Witty, warm, intellectually respectful, ultimately celebratory.

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Singer's Pond:* If you can prevent something bad without sacrificing anything of comparable moral importance, you ought to do it. Distance doesn't matter. Impartiality is key.
      *   *Marriage Vows:* I choose *you*. I will prioritize *your* happiness, *your* health, *your* dreams over the billions of others. This is bias. This is partiality.
      *   *Williams's Critique:* If a husband saves his wife because a principle allows it, he's thinking too much. He should save her because she's his wife.
      *   *The Resolution:* How do we justify marriage within an EA framework?
          *   *Option A:* Marriage makes you more effective at doing good (support system).
          *   *Option B:* Human psychology *needs* partiality to function; burning out helps no one.
          *   *Option C:* Love isn't a bug, it's a feature. The "universal" is built on the "particular."
          *   *Option D (The chosen path):* Acknowledge the tension, validate the EA commitment, but frame marriage not as a *retreat* from the good, but as the *ground* from which the good becomes sustainable and human. It's about "permission to be human" without guilt.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the audience split. Set the scene. Mention the "Pond."
      *   **The Conflict:** Explicitly state the tension. Marriage is institutionalized favoritism. EA is institutionalized impartiality.
      *   **The EA Validation:** Don't mock their past decade. Honor their consistency. They took the argument seriously.
      *   **The Turn (Williams):** Bring in the "one thought too many" idea gently.
      *   **The Resolution:** Why is this okay?
          *   Sustainability.
          *   The specific vs. the abstract.
          *   Love as a renewable resource for doing good.
      *   **The Toast:** Bring it back to the couple.

      *   *Self-Correction during drafting:* I need to make sure the non-philosophers don't get lost. I need to explain the "Pond" briefly but clearly so the normies get the joke. I need to ensure I don't sound like I'm telling them to stop being EAs. They are *committed* EAs. The toast must say, "You can be married *and* EAs."

  4.  **Drafting - Content & Tone:**
      *   *Voice:* Warm, slightly intellectual but not pretentious, affectionate.
      *   *Key Phrase:* "The shallow pond." "One thought too many." "Institutionalized favoritism."
      *   *Ending:* Needs to be uplifting.

  5.  **Refining the Argument (The "Resolution"):**
      *   If I just say "burnout is bad," it sounds pragmatic but cold.
      *   If I say "love is magic," it ignores the philosophy.
      *   *Better angle:* The world needs people who care deeply about the abstract, but to do that, they need a concrete anchor. The vow isn't a rejection of the world; it's a pact to face the world together. Also, Williams is right: In the moment of love (or drowning), calculation stops. The vow creates a space where calculation *doesn't* happen.

  6.  **Writing - First Pass (Mental or rough notes):**
      *   Hi everyone. For those who don't know, [Couple] are big on Effective Altruism. Peter Singer. Drowning child.
      *   Marriage is weird for them. It says "I pick you over everyone else." Singer says "Pick the one who needs help most."
