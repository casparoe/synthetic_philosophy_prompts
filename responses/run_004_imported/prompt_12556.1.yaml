answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name], and I have the privilege of knowing [Partner A] and [Partner B] through our rationalist reading group.

  Now, for about half of you, that explanation is perfectly clear. For the other half—mostly family and friends who just want to know if the open bar is unlimited—I should clarify. [Partner A] and [Partner B] are committed Effective Altruists. For the last decade, they have lived by a specific ethical challenge posed by the philosopher Peter Singer.

  Singer asks us to imagine walking past a shallow pond. You see a child drowning. You can save them, but it will ruin your shoes and make you late for work. Singer argues that if you agree it's wrong to let the child die to save your shoes, you must also agree it's wrong to spend that money on luxuries while children halfway around the world die of preventable causes. Distance, he says, is a moral illusion. A drowning child a world away has the exact same claim on you as one at your feet.

  [Partner A] and [Partner B] have taken this seriously. They have argued this at dinner tables. They have donated significantly. They have lived with the demanding knowledge that there is always more to be done.

  Which brings us to today. Because, philosophically speaking, a wedding is a bizarre event for two Effective Altruists.

  Strictly speaking, a wedding vow is an act of extreme moral partiality. It is a public contract where you say, "Out of eight billion people, I am choosing to prioritize *this* one. I promise to put their happiness, their health, and their retirement above the needs of the strangers in the pond."

  If the impartial ethic is the water, marriage is the lifeboat. And I know that for some in the room, there is a tiny, nagging question: Is this allowed? Can you sign a contract to be biased?

  The philosopher Bernard Williams once argued that if a man saves his drowning wife, and he justifies it by thinking, "Well, utilitarianism permits me to save spouses in this specific instance," he has had "one thought too many." He shouldn't save her because of a principle. He should save her because she is *his wife*.

  And that is where I want to land today.

  [Partner A] and [Partner B], you have spent ten years staring into the pond. You have refused to look away from the suffering of the world. You have resisted the comfort of moral illusions. I am not asking you to stop that. The world needs people who take the drowning child seriously.

  But the world also needs people who understand that you cannot stare into the abyss indefinitely without a place to rest your eyes.

  The vow you make today is not a retreat from the good. It is the infrastructure that makes the good sustainable. It is an acknowledgment that while the *claim* of the stranger is real, the *capacity* of the giver is finite. You are building a home base. You are creating a partnership where, when the weight of the world gets heavy, you do not have to carry it alone.

  There is a time for calculation, and there is a time for love. When you are calculating donations or career impact, be rigorous. Be impartial. Be Singerean. But when you come home to each other, when one of you is drowning in stress, or grief, or just the fatigue of caring too much... I hope you have zero thoughts. I hope you don't calculate the utility. I hope you just reach out.

  The vow is your permission to have "one thought too few." It is your agreement that in this specific, small sphere of eight billion people, you are allowed to be biased. You are allowed to be selfish with your time, your tenderness, and your Sunday mornings.

  Not because the strangers don't matter. But because you matter to each other. And if this marriage works, if this love holds, it will not subtract from the good you do in the world. It will compound it. It will ensure that twenty years from now, you are not burned out and bitter, but fueled and anchored.

  So, to the family and friends here who just want a nice toast: Do not worry. They are not abandoning their morals. They are simply acknowledging that even the most impartial heart needs a particular place to beat.

  And to [Partner A] and [Partner B]: May you always save each other from the pond. May you never calculate the cost of your love. And may your partiality be the engine that drives your good.

  Please raise your glasses. To the happy couple.
