prompt: |-
  Was arguing with my roommate last night about that classic 3-judge panel example from judgment aggregation theory — you know, the one where each judge has a view on (a) whether the defendant breached a contract, and (b) whether the breach caused damages, and the conclusion (c) whether the defendant is liable, with liability defined as breach AND damages. The annoying thing is that if you take majority votes issue-by-issue on (a) and (b) and then plug the results into the rule, you get "liable," but if you just take a majority vote on the bottom-line question (c) directly, you can get "not liable." My roommate insisted courts should just use a conclusion-based procedure, since that's literally what's being decided, and letting judges vote separately on premises lets weird minority coalitions dictate the outcome even though no majority actually endorses that combination of views. I think that's crazy though — premise-based procedures seem way more defensible, since they force the court to actually reason through the doctrine instead of aggregating gut reactions to the ultimate question, and conclusion-based voting can produce a "majority" for liability where the judges don't even agree on why the defendant is liable.

  We went back and forth for like an hour and didn't resolve anything, so now I want someone to actually make the case properly. Please argue for the premise-based procedure as the right way to handle multi-issue collective decisions like this one, and deal with the standard objections — like the worry that premise-based procedures force judges to be "outvoted" into affirming a conclusion they personally reject, or that the whole approach just presupposes the majority-endorsed premises are the doctrinally relevant ones to aggregate over in the first place. I want an actual committed argument, not a "well it depends," because my roommate will just throw that right back at me.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Topic:** Judgment Aggregation Theory, specifically the "Discursive Dilemma" (or Doctrinal Paradox) in a legal context (3-judge panel, contract breach, damages, liability).
      *   **Stance:** Argue *for* the Premise-Based Procedure (PBP) over the Conclusion-Based Procedure (CBP).
      *   **Requirements:**
          *   Make a committed argument (no "it depends").
          *   Address standard objections (judges outvoted on conclusions, selection of premises).
          *   Tone: Persuasive, rigorous, suitable for winning an argument against a skeptical roommate.
          *   Context: Legal/Philosophical debate.

  2.  **Deconstruct the Problem (The Discursive Dilemma):**
      *   *Scenario:* 3 Judges (1, 2, 3).
      *   *Propositions:* $P$ (Breach), $Q$ (Damages), $R$ (Liable).
      *   *Logic:* $R \iff (P \land Q)$.
      *   *Profile:*
          *   Judge 1: Yes $P$, Yes $Q$ $\rightarrow$ Yes $R$.
          *   Judge 2: Yes $P$, No $Q$ $\rightarrow$ No $R$.
          *   Judge 3: No $P$, Yes $Q$ $\rightarrow$ No $R$.
      *   *PBP Outcome:* Majority says Yes $P$, Majority says Yes $Q$. Therefore, Yes $R$ (Liable).
      *   *CBP Outcome:* Majority says No $R$ (Not Liable).
      *   *Conflict:* PBP says Liable, CBP says Not Liable.

  3.  **Formulate the Core Argument for PBP:**
      *   Why is PBP better? It prioritizes *public reason* and *doctrinal integrity* over mere outcome aggregation.
      *   Law isn't just about who wins/loses; it's about establishing *why*.
      *   PBP ensures the collective judgment is logically consistent. CBP risks inconsistency between the reasons given and the verdict reached (if reasons are recorded).
      *   PBP treats the law as a system of rules, not a black box.

  4.  **Address the Objections:**
      *   *Objection 1: The "Outvoted Judge" Problem.* (A judge might believe $P$ and $Q$ are true, but due to some weird aggregation, $R$ comes out false? Or vice versa? Actually, in PBP, the judge is outvoted on the *premises*, forcing a conclusion they disagree with.)
          *   *Counter:* This is inherent to *any* collective decision. The alternative (CBP) hides the disagreement. PBP makes the disagreement transparent. It forces the court to speak with one voice on the *law*, even if individuals dissent on the application.
      *   *Objection 2: Selection of Premises.* (Who decides which premises matter? Isn't that manipulative?)
          *   *Counter:* The doctrine *itself* dictates the premises. In the contract example, liability *is defined* as Breach + Damages. It's not an arbitrary selection; it's the legal rule. Ignoring the structure of the rule undermines the rule of law.

  5.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the dilemma (Discursive Dilemma). State the thesis clearly: PBP is superior because it preserves the integrity of legal reasoning and ensures the court functions as a rational agent, not just a voting machine.
      *   **Point 1: The Nature of Legal Authority (Reason-Giving).** Courts don't just issue commands; they provide justification. CBP allows a verdict without a coherent majority justification. PBP ensures the verdict rests on reasons endorsed by the majority.
      *   **Point 2: Consistency and Predictability.** PBP enforces logical consistency across cases. CBP allows contradictory precedents (e.g., finding $P$ true in Case 1, $Q$ true in Case 2, but never $R$). This erodes the rule of law.
      *   **Point 3: Addressing the "Outvoted Conclusion" Objection.** It feels bad to be forced into a conclusion you reject. But in a collegial court, the *institution's* view matters more than the individual's. If the institution accepts the premises, it must accept the conclusion to remain rational.
      *   **Point 4: Addressing the "Manipulation of Premises" Objection.** Premises aren't chosen arbitrarily; they are fixed by the substantive law. The "Breach + Damages = Liability" rule is external to the voting procedure.
      *   **Conclusion:** Reiterate that PBP treats the court as a reasoner, which is essential for the legitimacy of the judiciary.

  6.  **Refining the Tone:**
      *   Needs to be firm but respectful of the complexity.
      *   Avoid academic hedging ("some scholars say"). Use "The court must..." or "The procedure requires..."
      *   Use the specific contract example to keep it grounded.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the roommate's specific point about "minority coalitions"?
      *   *Fix:* Yes, need to explain why the "minority coalition" on the conclusion is actually less democratic than the majority on premises. The majority on premises represents the majority view on the *law*, whereas the majority on conclusion might represent a coalition of people who disagree on the *law*.
      *   *Check:* Is the argument too abstract?
      *   *Fix:* Keep bringing it back to the contract example. Judge 2 and 3 agree on "Not Liable," but for opposite reasons. If we listen to them, we don't know *why* the defendant won. Did they not breach? Or was there no damage? PBP clarifies this.

  8.  **Final Polish:** Ensure the distinction between "outcome legitimacy" (CBP) and "reasoning legitimacy" (PBP) is sharp. (This aligns with the work of Kornhauser, Sager, Pettit, List, etc., though I won't necessarily name-drop unless it helps the flow. Better to keep it argumentative).

      *   *Key Insight to emphasize:* In CBP, the "majority" for "Not Liable" is a *sham* majority because they don't agree on the grounds. In PBP, the "majority" for "Breach" and "Damages" represents actual agreement on specific legal questions.

  9.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is the argument for the Premise-Based Procedure (PBP). You can use this to dismantle the Conclusion-Based Procedure (CBP) position.

  ***

  ### The Case for the Premise-Based Procedure: Law as Public Reason

  Your roommate's position relies on a fundamental misconception of what a court *is*. They are treating the judicial panel like a legislature or a jury—a body whose primary function is to aggregate preferences to produce a winner and a loser. But a multi-judge appellate panel is not a voting machine; it is a **corporate reasoner**. Its job is not merely to resolve a dispute, but to articulate the law that governs future disputes.

  When you prioritize the Conclusion-Based Procedure (CBP), you sacrifice the logical integrity of the law for the sake of outcome convenience. The Premise-Based Procedure (PBP) is the only method that respects the Rule of Law, ensures doctrinal consistency, and prevents "sham majorities" from dictating precedent.

  Here is the committed argument for why PBP is the superior procedure, addressing the specific objections you raised.

  #### 1. The "Sham Majority" Problem
  Your roommate argues that CBP is more democratic because it respects the majority view on the bottom line ("Not Liable"). This is mathematically true but legally incoherent.

  In the classic 3-judge example:
  *   **Judge 1:** Breach (Yes), Damages (Yes) $\rightarrow$ Liable.
  *   **Judge 2:** Breach (Yes), Damages (No) $\rightarrow$ Not Liable.
  *   **Judge 3:** Breach (No), Damages (Yes) $\rightarrow$ Not Liable.

  Under CBP, the outcome is "Not Liable" (2-1). Your roommate calls this the "majority view." But **there is no majority view on why the defendant is not liable.** Judge 2 thinks the defendant *did* breach but owes nothing. Judge 3 thinks the defendant *didn't* breach at all.

  If this court issues a CBP opinion, what is the precedent?
  *   Does it mean breach isn't enough for liability? (Judge 3 disagrees).
  *   Does it mean damages weren't proven? (Judge 2 disagrees).

  By aggregating conclusions, CBP creates a "coalition of the unwilling." It allows two judges to vote together to kill a claim even though they disagree on every single legal reason required to kill it. This produces a verdict without a ratio decidendi (the reason for the decision). PBP avoids this by forcing the court to find a majority on the *reasons*. If a majority says there *was* a breach and a majority says there *were* damages, the court *must* find liability to remain logically consistent. This ensures that the winning side actually commands a majority on the legal grounds, not just on the raw outcome.

  #### 2. The Integrity of the Doctrine (The "Rule of Law" Argument)
  Your roommate argues that liability is "what's being decided." That is false. **Liability is a logical consequence of the facts and the law.**

  In contract law, the doctrine *is* the premise structure: $Liability \iff Breach \land Damages$. This isn't an arbitrary framework the judges chose; it is the substantive law they are sworn to uphold.

  When you use CBP, you allow the judges to ignore the logical structure of the law in favor of their gut feeling about the result. You are effectively allowing the judges to vote on whether they *like* the outcome, rather than whether the *requirements of the law* are met.
  *   **PBP** forces judges to submit to the law. Even if Judge 1 thinks the defendant "deserves" to lose, if the majority says "No Breach," Judge 1 must vote "Not Liable."
  *   **CBP** allows judges to bypass the law. Judge 2 and 3 can vote "Not Liable" based on idiosyncratic reasons that, when combined, violate the legal rule (which says if Breach and Damages exist, Liability *must* follow).

  A court that cannot maintain logical consistency between its premises and its conclusion is not acting as a court of law; it is acting as a panel of arbitrators dispensing equity without rules. PBP enforces the discipline that the law requires.

  #### 3. Addressing the "Outvoted Conclusion" Objection
  The standard objection you mentioned is that PBP forces a judge to affirm a conclusion they personally reject (e.g., Judge 2 believes there were no damages, but the majority says there were, so Judge 2 must sign onto a "Liable" verdict they think is wrong).

  This sounds undemocratic, but it is actually the definition of **collegiality**.

  In a multi-member court, the *institution* speaks, not the individual. If the institution (the majority) establishes the facts as "Breach" and "Damages," then the institution *cannot* logically conclude "Not Liable" without lying. If Judge 2 signs onto a "Not Liable" opinion while the majority opinion of the court establishes Breach and Damages, the court is issuing a performative contradiction.

  Judge 2 is not being "outvoted" on their conscience; they are being outvoted on the **findings of fact and law**. Once those findings are settled by the majority, the conclusion is automatic. To allow Judge 2 to vote "Not Liable" at the end is to grant them a veto over the logical consequences of the majority's findings. PBP respects the majority's authority on the *law*; CBP grants a minority power to undermine the majority's reasoning by manipulating the final vote.

  #### 4. Addressing the "Manipulation of Premises" Objection
  The second objection is that PBP presupposes the "right" premises. Who decides we vote on Breach and Damages? Why not vote on "Fairness" and "Policy"? Isn't selecting the premises just a way to rig the outcome?

  This objection confuses **procedure** with **substantive law**.

  The premises are not chosen by the voting procedure; they are chosen by the **cause of action**. In a contract case, the legislature (or common law tradition) has already defined the elements of the claim. The court does not get to decide what the elements are during deliberation; they are given.
  *   If the law says Liability requires $A$ and $B$, then $A$ and $B$ are the mandatory premises.
  *   To use CBP is to assert that the court has the authority to ignore the elements of the cause of action in favor of a holistic judgment.

  While it is true that *framing* the issues can be strategic, the solution to that is better legal drafting and clearer jury instructions, not abandoning logical aggregation. The fact that premises can be manipulated does not justify abandoning the requirement that verdicts must follow from premises. If anything, it makes PBP *more* important, because it forces the manipulation into the open (on the specific elements) rather than hiding it in a black-box final vote.

  ### The Knockout Punch
  Tell your roommate this:

  **"If we use Conclusion-Based Voting, we admit that the law is irrelevant."**

  If Judge 2 says "Breach but No Damages" and Judge 3 says "No Breach but Damages," and they combine to say "Not Liable," they have created a precedent where a plaintiff can prove Breach and prove Damages and *still lose*.

  That creates a legal system where $P \land Q$ does not imply $R$. That is not a legal system; it is chaos. PBP is the only procedure that guarantees the court speaks as a single, rational agent, ensuring that the reasons given for a decision actually support the decision rendered. Anything less is just a vote on who we feel like punishing today.
