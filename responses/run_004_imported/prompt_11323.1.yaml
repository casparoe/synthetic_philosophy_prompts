      *   *Nuance:* In RCV, you can still vote strategically (e.g., "burying" a strong competitor by ranking them last, or ranking a weak candidate first to help a strong candidate later). However, the *need* to vote insincerely (ranking a less preferred candidate higher just to stop a worst-case scenario) is significantly lower than in Plurality.
      *   *Comparison:* Top-Two Runoff also solves the majority problem but has lower turnout in the second round and takes more time/money.
