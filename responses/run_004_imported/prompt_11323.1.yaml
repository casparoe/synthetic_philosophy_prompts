answer: |-
  **MEMORANDUM**

  **TO:** Student Government Council
  **FROM:** Bylaws Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Election System Reform

  ### Executive Summary

  Following the controversy surrounding last month's presidential election, the Bylaws Committee was tasked with reviewing our voting system. The core issue was the "spoiler effect": three candidates ran, two split the majority of the vote due to similar platforms, and a candidate won with only 34% of the vote despite 66% of the student body preferring someone else.

  The Committee debated two primary solutions: a **Top-Two Runoff** system versus **Ranked-Choice Voting (RCV)**. After analyzing voter turnout implications, administrative feasibility, and the mathematical integrity of the results, **the Bylaws Committee recommends adopting Ranked-Choice Voting (Instant Runoff) for all future executive elections.**

  While RCV is not a magic bullet that eliminates *all* strategic voting, it significantly reduces the pressure to vote insincerely compared to our current system and ensures the winner commands a majority mandate without the voter fatigue of a second election.

  ### Background: The Problem with Plurality Voting

  Our current bylaws mandate a "First-Past-the-Post" (plurality) system. This works fine with two candidates. However, as seen last month, when three or more candidates run, plurality voting fails to measure majority support.

  *   **The Result:** A candidate can win while being actively opposed by two-thirds of the electorate.
  *   **The Consequence:** This creates legitimacy issues for the winner and encourages "strategic voting" in the future, where students vote for a "lesser evil" rather than their actual preference to avoid wasting their vote.

  ### Option Analysis

  #### 1. Top-Two Runoff
  This system holds a second election two weeks later if no candidate receives 50% + 1 in the first round.
  *   **Pros:** Guarantees a majority winner; easy to understand.
  *   **Cons:** Historically, runoff elections suffer from massive drops in voter turnout (often 40–60% lower than the first round). It also doubles administrative costs and extends the campaign period, which distracts from academic focus.

  #### 2. Ranked-Choice Voting (RCV)
  Voters rank candidates in order of preference (1st, 2nd, 3rd). If no one gets 50% of first-choice votes, the last-place candidate is eliminated, and their votes transfer to those voters' second choices. This repeats until a majority is reached.
  *   **Pros:** Guarantees a majority winner in a single election; maintains high turnout; eliminates the "spoiler effect."
  *   **Cons:** Slightly more complex ballot counting; requires voter education.

  ### Deep Dive: The Strategic Voting Question

  The primary point of contention in our committee was whether RCV actually solves the problem of strategic voting. Some members argued that claims about RCV allowing "honest voting" are a myth. We investigated this specifically.

  **The Claim:** *RCV allows you to vote for your favorite without worrying about them losing.*
  **The Verdict:** *Mostly True, with nuance.*

  In our current system, strategic voting is **defensive**. You don't vote for your favorite (Candidate A) because you think they can't win, so you vote for a safer option (Candidate B) to stop a candidate you hate (Candidate C). This is a structural flaw of plurality voting.

  RCV largely removes this defensive pressure. You can rank Candidate A first. If they lose, your vote transfers to Candidate B. You have not "wasted" your vote. This encourages candidates to campaign more positively, as they need to be the second choice of their opponents' supporters to win.

  **The Nuance:** *Does RCV eliminate strategy entirely?*
  No voting system is immune to strategy (a mathematical concept known as the Gibbard-Satterthwaite theorem). In RCV, sophisticated voters could still try to game the system (e.g., ranking a strong competitor last to ensure they are eliminated early). However, this requires knowing exactly how everyone else will vote, which is nearly impossible in a student election.

  **Conclusion on Strategy:** While RCV does not make strategic voting *impossible*, it makes voting *honestly* the safest strategy for 95% of voters. This is a significant improvement over the current system, where voting honestly is often a disadvantage.

  ### Recommendation

  The Bylaws Committee recommends amending the bylaws to adopt **Ranked-Choice Voting** for the President and Vice President positions.

  **Rationale:**
  1.  **Legitimacy:** It ensures the winner has broad support (a majority), preventing another 34% victory.
  2.  **Turnout:** It avoids the voter drop-off inherent in runoff elections.
  3.  **Campaign Tone:** It incentivizes candidates to seek broad support rather than attacking opponents, as they may need those opponents' supporters as second-choice backups.

  ### Implementation Plan

  To ensure a smooth transition, we propose the following:
  1.  **Bylaw Amendment:** Update Article V, Section 2 to define RCV counting procedures.
  2.  **Voter Education:** Launch a "How to Vote" campaign two weeks before nominations open, using sample ballots on social media and in homerooms.
  3.  **Software Check:** Confirm our current voting platform (e.g., Google Forms, ElectionBuddy, OpaVote) supports RCV tabulation. Most do, but we must verify before nominations open.

  ### Next Steps

  We request the Council vote on this recommendation by [Date]. If approved, the Bylaws Committee will draft the specific amendment language for final review before the next election cycle begins.

  **Respectfully submitted,**

  [Your Name]
  Chair, Bylaws Committee
