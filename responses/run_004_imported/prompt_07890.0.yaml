      *   *Nuance on Skyrms:* Skyrms emphasizes *signaling*. The act of sitting is a signal. The visitor failed to read the signal. The "cold looks" are a cost imposed on the signaler (or the violator) to reinforce the signaling system.
      *   *Nuance on Bicchieri:* Make sure to highlight "conditional preference." Students prefer to sit in their seat *because* others expect them to and will sanction them if they don't (or if someone else takes it).

  6.  **Final Polish:** Check tone (academic but engaging), ensure all parts of the prompt are answered, and verify accurate representation of the three theorists. (The prompt asks for "most important implications," "cold looks/Lewis," and "reshuffle/Skyrms".)

