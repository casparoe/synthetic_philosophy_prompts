      *   **Goal:** Avoid questions that let the guest simply restate the view. Need "cornering" questions that press on weaknesses, tensions, or implications.
      *   **Specific Requirements:**
          *   8-10 questions total.
          *   Must include 3 specific anchor topics with follow-ups:
              1.  *Agency/Reform:* If no self prior to roles, who critiques/reforms unjust roles? (Anticipated defense: *Shu*/reciprocity).
              2.  *Conflicting Roles (Shun & Gusou):* Is it just nepotism? Is there a principled ranking or just "closest relation wins"?
              3.  *Rights & Oppression:* Rosemont's rejection of rights-talk. How does a person in a bad role (e.g., oppressed wife) leverage change without rights language?
          *   Fill out the rest with sharp interviewer questions (e.g., Is it just virtue ethics? Distinct theory?).
          *   End with a falsification question (What evidence would change your mind?).
      *   **Tone:** Sharp, philosophically rigorous, but suitable for a public series (accessible but not soft).

  2.  **Deconstruct the Anchor Topics & Draft Questions:**

      *   *Anchor 1: Agency/Reform.*
          *   *Core Tension:* If I am my roles, and my roles are defined by a tradition, where does the critical distance come from to say "this tradition is wrong"?
          *   *Draft Q:* If the self is constituted by roles, where does the critical agency come from to change them?
          *   *Anticipated Answer:* It comes from within the roles themselves (reciprocity, *shu*, extending care).
          *   *Follow-up:* If *shu* is internal to the role, doesn't that mean reform is limited by the logic of the existing hierarchy? Can *shu* ever justify abolishing a role entirely?

      *   *Anchor 2: Shun & Gusou (Conflicting Roles).*
          *   *Core Tension:* Filial piety vs. Public Justice. Mencius says save the dad, quit the job. Looks like nepotism.
          *   *Draft Q:* The Shun story looks like role ethics privileges family over justice. Is there a principled way to rank roles, or is it just proximity?
          *   *Anticipated Answer:* It's not ranking, it's about the specific context and cultivating the root. Family is the root of ren.
          *   *Follow-up:* If family is always the root, does that structurally disadvantage the "stranger" or the "citizen" in a modern pluralistic state? Can role ethics handle impartial justice?

      *   *Anchor 3: Rights & Oppression.*
          *   *Core Tension:* Rights protect individuals *against* roles/communities. Role ethics says individuals are *in* roles. What protects the vulnerable?
          *   *Draft Q:* Rosemont rejects rights. But if a wife is abused, rights give her a claim independent of her husband's goodwill. Without that, isn't she trapped?
          *   *Anticipated Answer:* Rights are adversarial and atomistic. Role ethics focuses on mutual obligation. If the husband fails, the community intervenes.
          *   *Follow-up:* But community intervention often fails or sides with the patriarch. Isn't rights language a necessary "nuclear option" when role obligations break down completely?

  3.  **Brainstorming Additional "Sharp Interviewer" Questions:**
      *   *Metaphysical Status:* Is this actually ethics or just sociology/ontology?
      *   *Comparison:* Is this just Virtue Ethics with Chinese characteristics? (Annas, Van Norden debates).
      *   *Modernity:* Can this scale to a nation-state of millions of strangers?
      *   *Involuntary Roles:* I didn't choose to be a son or a citizen. How am I bound by roles I never consented to?
      *   *The "Bad Role" Problem:* What about roles that are inherently exploitative (e.g., master/slave, or rigid caste)?

  4.  **Selecting and Refining the List (Aiming for 8-10):**

      1.  *Anchor 1 (Agency/Reform).*
      2.  *Anchor 1 Follow-up (Limits of Shu).*
      3.  *Anchor 2 (Shun/Nepotism).*
      4.  *Anchor 2 Follow-up (Impartiality/Strangers).*
      5.  *Anchor 3 (Rights/Oppression).*
      6.  *Anchor 3 Follow-up (The "Nuclear Option").*
      7.  *Distinctness:* Is Role Ethics just Virtue Ethics? (Ames hates this comparison).
      8.  *Involuntariness:* What about roles we can't exit?
      9.  *Scalability:* Can this work in a modern bureaucracy/state?
      10. *Falsification:* What would change your mind?

  5.  **Drafting the Content (Iterative refinement for tone and precision):**

      *   *Refining Q1 (Agency):* Make sure to mention the "no self prior" claim explicitly.
      *   *Refining Q2 (Follow-up):* Focus on whether *shu* can break the mold or just smooth it.
      *   *Refining Q3 (Shun):* Use the specific details (Gao Yao, coast).
      *   *Refining Q4 (Follow-up):* Push on the "stranger" aspect.
      *   *Refining Q5 (Rights):* Focus on the "lever" aspect mentioned in the prompt.
      *   *Refining Q6 (Follow-up):* Focus on systemic failure.
      *   *Refining Q7 (Virtue Ethics):* Ames/Rosemont insist they are doing *process metaphysics*, not virtue ethics. Press on the practical difference.
      *   *Refining Q8 (Involuntary):* Focus on the "exit" option.
      *   *Refining Q9 (Scalability):* Focus on the "face-to-face" vs. "institutional" gap.
      *   *Refining Q10 (Falsification):* Keep it open but demanding.

  6.  **Review against Constraints:**
      *   8-10 questions? Yes (10 selected).
      *   3 Anchors included? Yes.
      *   Follow-ups included? Yes.
      *   Tone appropriate? Yes, challenging but respectful.
      *   Ending on falsification? Yes.

  7.  **Final Polish:** Check for clarity and ensure the follow-ups logically flow from the *likely* answers (as predicted in the prompt). Ensure the distinction between "individual in roles" vs "self as roles" is respected in the phrasing. (Self-correction: Make sure not to strawman the guest, but press the implications hard).

      *   *Self-Correction on Q7:* Ames/Rosemont are very specific that they aren't virtue ethicists because virtue ethics still presupposes an agent cultivating virtues. Role ethics says the agent *is* the performance. I need to phrase the question to acknowledge that distinction while asking if the *normative output* is distinguishable.
      *   *Self-Correction on Q1:* Ensure the follow-up specifically targets *shu* as the guest is likely to use it.

  8.  **Final Output Generation** (Proceed to generate the response based on these steps).
answer: |-
  Here are 10 questions designed to press the Confucian Role Ethics view without letting the guest retreat into generalities. They are structured to move from the metaphysical/agency problems to specific case tensions, then to political implications, and finally to methodological reflection.

  ### Part 1: The Problem of Agency and Reform (Anchor 1)

  **1. The Critique from Nowhere**
  "You argue that there is no 'self' standing prior to or behind the roles we occupy; we are the sum of our relationships. But ethical progress seems to require a critical distance from one's current situation. If I am constituted by my roles within a specific tradition, what is the mechanism that allows me to criticize that tradition itself? When a reformer says 'this role is unjust,' what part of them is speaking if not an individual conscience independent of that role?"

  **2. Follow-up: The Limits of *Shu* (Reciprocity)**
  "I anticipate you might say that the resources for critique come from within the roles themselves, perhaps through *shu* or reciprocity—extending one's care to see how the role feels for the other. But isn't *shu* limited by the logic of the existing relationship? If the role itself is hierarchical or exploitative, can *shu* ever justify abolishing the role entirely, or does it only allow us to perform it more gently? Can role ethics ever tell us to stop playing the game, rather than just play it better?"

  ### Part 2: Conflicting Roles and Partiality (Anchor 2)

  **3. The Case of Shun and Gusou**
  "Let's look at the classic hard case from the *Mencius*. When Shun's father commits murder, Shun allows the law to arrest him but then abandons the throne to smuggle his father away. This is often cited as proof that role ethics is just系统化 (systematized) nepotism. On your view, is Shun's decision to privilege the father-son role over the ruler-subject role a matter of principled ranking, or is it simply that the familial relation is 'thicker'?"

  **4. Follow-up: The Status of the Stranger**
  "If the answer is that familial roles are the 'root' and therefore take precedence, how does role ethics handle the demands of strangers or citizens to whom we have no specific relational tie? In a modern pluralistic state, I have obligations to people I will never meet. If my ethical weight is determined by the proximity of the role, doesn't this view structurally disadvantage the outsider? How do we get from 'family first' to 'impartial justice' without importing Western individualist assumptions?"

  ### Part 3: Rights and Vulnerability (Anchor 3)

  **5. The Oppressed Wife**
  "Henry Rosemont argues forcefully against the language of human rights, claiming it reinforces the atomistic individual. But consider a wife in a traditional, patriarchal marriage where the husband is abusive. Rights language gives her a lever to pull—a claim she can make *against* the relationship, regardless of whether the husband fulfills his role. If you remove rights-talk, doesn't she lose the only tool that works when the relationship itself has become a trap?"

  **6. Follow-up: Systemic Failure**
  "You might reply that in a healthy Confucian community, the extended family or local elders would intervene to correct the husband. But history suggests communities often side with the patriarch to preserve stability. If the internal mechanisms of role correction fail, isn't rights language the necessary 'nuclear option' for the vulnerable? Are you asking the powerless to disarm in the name of a more harmonious ontology?"

  ### Part 4: Theoretical Distinctness and Scope

  **7. Virtue Ethics in Drag?**
  "Critics like Julia Annas have suggested that Confucian Role Ethics is functionally indistinguishable from Virtue Ethics: both focus on character, habituation, and context-sensitivity rather than rules. You insist the metaphysics are different—that we are roles, not agents cultivating virtues. But normatively, does this distinction actually cash out? If I'm trying to live a good life, does it practically matter whether I think of myself as 'a self with roles' or 'a sum of roles'?"

  **8. The Problem of Involuntary Exit**
  "Western liberalism emphasizes the freedom to exit associations. In role ethics, many of our constitutive roles—son, daughter, citizen—are involuntary. We cannot quit being a son even if the parents are abusive. If the self is the sum of these roles, and some of those roles are toxic, does the self have any recourse but to endure them? Is there a concept of 'role resignation' in your framework, or are we bound for life?"

  **9. Scalability to the Modern State**
  "Confucianism developed for face-to-face communities where everyone knew their place. Modern governance relies on bureaucracy, abstract rules, and institutions where roles are functional, not relational. Can role ethics actually scale to a nation of millions? Or does it require a return to a smaller, communal scale to remain coherent? If the latter, isn't this a political non-starter for the modern world?"

  ### Part 5: Falsification

  **10. The Evidence Question**
  "Finally, a question on the status of the view itself. Philosophical positions often become immune to counter-evidence by absorbing every hard case as a 'misunderstanding of the roles.' So I want to ask: What would count as evidence against Role Ethics? Is there a specific historical example, a social outcome, or a philosophical argument that, if proven true, would compel you to abandon the view that the self is nothing but its roles?"
