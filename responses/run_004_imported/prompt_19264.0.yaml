prompt: |-
  Okay, weird one, but this is genuinely from real life: my brother told me at Thanksgiving that I'm a bad uncle because I barely visit, and I shot back that he's been totally checked out of helping with our mom for like two years, so he doesn't get to lecture me about being absent. He said "sure, but that doesn't make what you're doing okay" -- which, yeah, fair, he's not wrong about the actual facts. But it still feels off that he gets to be the one saying it to my face. I mentioned this to a friend doing a philosophy MA and apparently this is a whole subfield -- "standing to blame" -- which surprised me, because I distinctly remember learning in some intro logic class that pointing out someone's hypocrisy (tu quoque) is a textbook fallacy, since it doesn't actually touch the truth of what they're accusing you of. So now Im confused about how those two things are even supposed to fit together.

  From skimming a couple of papers (I think one was Wallace, something about hypocrisy and equal standing, and another was this older Cohen essay about "casting the first stone"?) it looks like philosophers actually agree that the hypocrite can be saying something totally true, and yet there's still a real, seperate problem with them being the one to say it -- but they don't seem to agree on why, and I can't tell how big a deal the disagreement actually is. Could you help me get an actual handle on this? Specifically: (1) what's the best way to make sense of "standing" as a thing distinct from the truth of the accusation, without smuggling the tu quoque fallacy back in through the side door, and (2) once you grant that hypocrisy costs you standing, does it fully void the blame -- like the criticism just doesn't land at all, misfire-style -- or does it just weaken it in a way that can still get outweighed if the underlying thing you did was bad enough? I don't need a comprehensive lit review, I mainly just want to understand the actual shape of the disagreement rather than vibing "hypocrisy bad," enough that I can figure out for myself whether my brother actually had a point.
