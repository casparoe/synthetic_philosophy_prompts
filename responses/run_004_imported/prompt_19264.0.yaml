answer: |-
  This is a fantastic question because it cuts right to the heart of why moral philosophy often feels disconnected from actual moral life. You have spotted the exact tension that keeps ethicists up at night: the gap between **propositional truth** (is the statement accurate?) and **normative authority** (do you have the right to make this demand?).

  Here is the handle you need on the "standing to blame" debate, broken down by your two specific questions, and then applied to your Thanksgiving dinner.

  ### 1. Standing vs. Truth: Avoiding the *Tu Quoque* Trap

  You are correct that in Intro Logic, *tu quoque* ("you also") is taught as a formal fallacy. That is because logic deals with **propositions**.
  *   **Proposition:** "Uncle visiting is a moral obligation."
  *   **Truth Value:** True or False.
  *   **Logic:** If the proposition is True, it remains True regardless of whether the person stating it visits their nieces/nephews.

  However, blame is not just a statement of fact; it is a **speech act** (specifically, a normative demand). When your brother said, "You're a bad uncle," he wasn't just describing the universe; he was trying to *hold you accountable*. He was invoking a norm to demand compliance from you.

  **The Distinction:**
  Philosophers like R. Jay Wallace (in "Hypocrisy, Agency, and Moral Standing") argue that standing is about the **presuppositions of the speech act**. To legitimately blame someone, you implicitly communicate two things:
  1.  The norm exists (Visiting is good).
  2.  **I am committed to this norm.**

  When a hypocrite blames you, they violate condition #2. They are effectively saying, "You must follow this rule that I am currently exempting myself from."

  **How this avoids the Fallacy:**
  *   **Fallacious *Tu Quoque*:** "You say smoking is bad, but you smoke. Therefore, smoking is *not bad*." (This attacks the truth of the proposition).
  *   **Valid Standing Challenge:** "You say smoking is bad, but you smoke. Therefore, *you are not the one who gets to lecture me*." (This attacks the authority of the speaker).

  Think of it like a courtroom. A random citizen can shout "You broke the law!" at a defendant. That statement is **true**. But they lack the **standing** to sentence the defendant. If they try to pass sentence, we don't say the law doesn't exist; we say *they* don't have the authority to enforce it.

  So, to answer your first question: You make sense of standing by shifting the category from **Truth** (logic) to **Authority** (ethics/politics). Your brother's facts were right, but his "warrant" to enforce them was revoked by his own conduct regarding your mom.

  ### 2. Void vs. Weaken: The Shape of the Disagreement

  This is where the literature gets messy, and it's the core of what you asked about. If someone lacks standing, what happens to the blame? There are roughly three camps:

  **Camp A: The "Misfire" (Void) View**
  *   **The Idea:** Blame without standing is null. It's like a fake cop trying to arrest you. It doesn't just carry less weight; it carries *no* normative weight.
  *   **The Reasoning:** Blame is a demand for accountability. If I am not accountable myself (because I'm violating the same norm), I cannot place you in a position of accountability. The transaction fails.
  *   **Implication:** If this is true, your brother's criticism literally "didn't land." It was noise. You owe him no apology *to him* regarding that specific interaction, because he disqualified himself from the conversation.

  **Camp B: The "Dampener" (Weaken) View**
  *   **The Idea:** The blame is still valid, but it is tainted. It creates a "defeasible" reason to feel guilty.
  *   **The Reasoning:** The moral truth (you should visit) stands on its own. The hypocrisy just makes the *delivery* annoying or unfair. It weakens the force of the blame, but if the underlying wrong is egregious enough, the blame still outweighs the hypocrisy.
  *   **Implication:** If this is true, your brother had a point, but he lost the right to be angry about it. You still did the wrong thing, but he can't claim the moral high ground.

  **Camp C: The "Invitation" View (Dialogic)**
  *   **The Idea:** Lack of standing doesn't silence the blamer, but it changes the conversation from a verdict to a dialogue.
  *   **The Reasoning:** G.A. Cohen (in "Casting the First Stone") suggests that hypocrisy reveals a shared vulnerability. When you point out his lack of help with Mom, you aren't silencing him; you are inviting him to acknowledge that *both* of you are failing the family norm.
  *   **Implication:** The blame shouldn't be "You are bad," it should be "We are both failing."

  **Where the Disagreement Lies:**
  The disagreement isn't about whether hypocrisy is bad (everyone agrees it is). The disagreement is about **what blame *is*.**
  *   If blame is a **Sanction** (punishment), then hypocrites can't administer it (Camp A).
  *   If blame is **Information** (telling someone they erred), then hypocrites can still deliver it, just rudely (Camp B).

  Most contemporary philosophers (including Wallace) lean toward a modified **Camp A**: Hypocrisy makes the *expression* of blame morally impermissible, even if the content is true. It's not that you didn't do wrong; it's that *he* can't be the one to call you on it.

  ### Applying This to Thanksgiving

  Here is how you can use this to evaluate your brother's point without just "vibing."

  **1. Did he have a point? (The Truth Condition)**
  Yes. Logic class was right. The proposition "You are a bad uncle for not visiting" is likely true independent of his behavior. If you care about being a good uncle, his hypocrisy doesn't change the fact that you haven't visited. **Do not use his hypocrisy to gaslight yourself into thinking your absence is okay.**

  **2. Did he have standing? (The Authority Condition)**
  Probably not. If the relevant norm is "Family members must support the family unit," and he has been checked out on Mom for two years, he has violated the **Commitment Condition**. By blaming you, he implied he takes the norm seriously while exempting himself. This is the "unfairness" Wallace talks about.

  **3. Did the blame "land"? (The Void/Weaken Condition)**
  This is the practical takeaway.
  *   If you accept the **Misfire View**: His criticism was normatively inert. You can dismiss his *authority* to judge you. You don't owe him an apology for the *interaction*, because he broke the rules of engagement.
  *   If you accept the **Dampener View**: His criticism was weak, but not zero.

  **The Synthesis:**
  Your brother's statement ("that doesn't make what you're doing okay") is **logically true but pragmatically infelicitous.**
  He is treating blame as a fact-report ("I am reporting that you are a bad uncle"). You are treating blame as a relationship-repair mechanism ("We need to hold each other to standards").

  Because he lacks standing, his blame functions as an attack rather than a repair. It feels "off" to you because it *is* off. It violates the norms of moral community.

  **Verdict:**
  You can concede the **fact** (I haven't visited enough) without conceding the **authority** (You don't get to be the judge).
  *   **Wrong move:** "I'm not a bad uncle because you don't help Mom." (This is the *tu quoque* fallacy; your uncle-status is independent of his help).
  *   **Right move:** "I acknowledge I haven't visited enough, and I own that. But given that you haven't helped with Mom, you don't have the standing to hold me accountable for it. We are both failing the family right now, and you calling me out doesn't fix your absence."

  This aligns with the **Commitment Account** of standing. It acknowledges the truth of the accusation (avoiding the fallacy) while rejecting the hypocrite's authority to enforce it (respecting the standing). It shifts the dynamic from "Judge vs. Defendant" to "Co-conspirators in failure," which is usually where actual family healing starts.
