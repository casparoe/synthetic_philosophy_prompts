prompt: |-
  So I've been going down a time travel rabbit hole lately, and I found out that David Lewis's famous fix for the grandfather paradox (the reason you cant kill your own grandpa is that it just wouldn't be "compossible" with the rest of history) actually borrows that word from Leibniz, who used it for his whole possible-worlds/monads thing about why not everything that's individually possible can all exist together in the same world. Now I can't stop wondering what Leibniz himself would've said about time travel and the grandfather paradox if you could somehow explain it to him, given his actual views on compossibility, sufficient reason, and monads not really being able to affect each other directly (just running on tracks that God synced up ahead of time). Would his own system just dissolve the paradox for totally different reasons then Lewis does, or would it somehow make things worse? Would love a proper in depth take on this, not just a one liner.
reasoning: |-
