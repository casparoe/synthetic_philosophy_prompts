      *   **Pre-established Harmony:** God synchronized all monads at creation. My decision to raise my hand and my hand rising are coordinated by God, not by my mind causing my hand to move.
      *   **Possible Worlds:** Infinite concepts in God's mind. Each world is a set of *compossible* individuals (individuals whose concepts don't contradict each other).
      *   **Compossibility:** Not everything possible is *compossible*. I can exist in World A, but not with a different set of physical laws or a different history that contradicts my essence.
      *   **Principle of Sufficient Reason (PSR):** Everything happens for a reason. Nothing is arbitrary.
      *   **Time:** For Leibniz, time is ideal/relational, not absolute. It's an order of succession.

  3.  **Analyze David Lewis's Position (for contrast):**
      *   Lewis is a modal realist (all possible worlds are real).
      *   Time travel is possible within a single world (the "block universe").
      *   The Grandfather Paradox is resolved by "compossibility": You *can* kill your grandfather relative to some facts (you have a gun, aim, etc.), but you *cannot* kill him relative to the full set of facts (he is your ancestor). Therefore, you won't. It's a logical constraint on the timeline.

  4.  **Simulate Leibniz's Response to Time Travel:**
