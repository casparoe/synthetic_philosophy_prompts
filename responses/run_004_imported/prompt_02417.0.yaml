          *   *Analysis:* Maybe humans are computational but just have a much larger $F$ or different resource bounds.
          *   *Effectiveness:* Low against Penrose. He argues about *in principle* limits, not resource limits.
          *   *Ranking:* D.

      *   **Rejoinder 6: The Consistency vs. Truth Distinction (McDermott, etc.).**
          *   *Analysis:* Similar to Feferman. To conclude $G$ is *true*, you need soundness. To conclude $G$ is *unprovable*, you only need consistency. Penrose needs truth.
          *   *Effectiveness:* High. Overlaps with Feferman.

