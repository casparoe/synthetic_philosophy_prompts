  8.  **Refining the Tone:**
      *   Keep it sophisticated but accessible. The user is clearly well-read ("philosophically richer," "decision theorists," "rigorously").
      *   Avoid being overly dismissive of the trader's psychology; treat it as a structural constraint.
      *   Ensure the distinction between EDT and CDT is clear but not pedantic.

  9.  **Self-Correction/Check during drafting:**
