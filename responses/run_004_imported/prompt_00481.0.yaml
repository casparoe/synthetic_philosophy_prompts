answer: |-
  This is a exquisite example of a problem that sits right at the boundary of decision theory, epistemology, and the philosophy of action. Your intuition is correct: this is not merely a psychological quirk of your friend, but a structural feature of her deliberative process.

  The specific concept you are recalling is **Ratifiability** (or the lack thereof), often discussed in the context of **Evidential Decision Theory (EDT)** and **Deliberational Instability**. The philosophers most associated with diagnosing this specific loop are **Richard Jeffrey** (who introduced ratifiability in *The Logic of Decision*) and **Brian Skyrms** (who analyzed the dynamics of deliberation in *Causal Necessity* and subsequent papers).

  Here is a diagnosis of what is going wrong, what decision theory says about it, and whether there is a principled escape.

  ### 1. The Diagnosis: Unratifiability and Evidential Feedback

  In standard decision theory, an agent chooses the act that maximizes expected utility. However, in **Evidential Decision Theory**, the expected utility of an act depends on the probability of states of the world *conditional on that act* being performed ($P(State | Act)$).

  Your friend's problem is that her own choice is **diagnostic evidence** about the state of the world, mediated by her self-knowledge of her own psychology.
  *   **If she chooses to Sell:** She conditions on the fact that she is selling. Based on her history, $P(\text{Panic} | \text{Sell})$ is high. If she is panicking, the tip is likely false. Therefore, $P(\text{Devaluation} | \text{Sell})$ drops. If devaluation is unlikely, Selling was the wrong move.
  *   **If she chooses to Hold:** She conditions on the fact that she is holding. Based on her history, $P(\text{Vanity} | \text{Hold})$ is high. If she is being vain, she is ignoring a true signal. Therefore, $P(\text{Devaluation} | \text{Hold})$ rises. If devaluation is likely, Holding was the wrong move.

  In Richard Jeffrey's terms, neither act is **ratifiable**. An act is ratifiable if, assuming you are going to do it, it remains the act with the highest expected utility. Your friend is in a state of **deliberative instability**: as she moves toward one option, the evidential probabilities shift to make the other option superior. There is no fixed point (no equilibrium) in her deliberation.

  ### 2. What Standard Theory Says

  This scenario highlights the tension between **Evidential Decision Theory (EDT)** and **Causal Decision Theory (CDT)**.

  *   **The EDT Trap:** If she follows EDT strictly, she must accept that her choice provides evidence about the world. Since her choice correlates with her psychological type (Panic vs. Vanity), and her type correlates with the market reality (False Tip vs. True Tip), EDT traps her in the loop. She can never settle, because settling changes the evidence.
  *   **The CDT Escape:** Causal Decision Theory (championed by David Lewis and Robert Nozick) argues that an agent should ignore the evidential news of their own act and look only at causal consequences. A CDT theorist would tell her: "Your decision to sell does not *cause* the tip to be false. Your psychology is already fixed. Calculate the probability of the tip being true based on the evidence *prior* to your decision, and act on that."
      *   *The Problem:* She cannot easily do this. Her assessment of the tip's validity is inextricably tangled with her assessment of her own reaction to it. She cannot access the "prior" probability without going through the deliberation that triggers the loop.

  ### 3. Is There a Principled Way Out?

  Yes, but it requires stepping outside the logic of pure acts. Decision theorists generally propose three ways to resolve unratifiability.

  #### A. The Mixed Strategy (Randomization)
  This is the most rigorous decision-theoretic solution. When no pure strategy (Sell or Hold) is ratifiable, a **mixed strategy** often is.
  If your friend flips a coin to decide whether to sell or hold, the act no longer provides evidence about her psychological type.
  *   If she sells because a coin told her to, it is not evidence of panic.
  *   If she holds because a coin told her to, it is not evidence of vanity.
  By severing the evidential link between her psychology and her action, she stabilizes the probabilities. She can then assess the tip on its external merits without her own reaction contaminating the data. While "flipping a coin" on a large currency position sounds reckless, in this specific philosophical structure, it is the only way to prevent her own deliberation from corrupting her evidence.

  #### B. The "Tickle Defense" (Screening Off)
  Some theorists (like David Lewis and Ellery Eells) suggest looking for the *cause* of the unease rather than the unease itself.
  *   Does she have the unease *because* she subconsciously processed a genuine signal?
  *   Or does she have the unease *because* she is anxious by nature?
  If she can identify the *cause* of her feeling (the "tickle"), she can condition on that rather than on the decision. If she can determine, "I feel unease because I noticed a subtle volume shift," then the feeling is evidence of devaluation regardless of what she decides to do. However, given your description ("uncertain provenance," "flavor of unease"), she may not have access to this causal data.

  #### C. The Cost of Deliberation (Meta-Rationality)
  There is a pragmatic escape hatch that standard static models often ignore: **Time**.
  You mentioned she has been in this loop for three days. In trading, delay has a cost (opportunity cost, stress, potential market movement).
  A meta-rational agent recognizes that **indefinite deliberation is itself an action with a utility value**. If the expected utility of continuing to deliberate drops below the expected utility of *any* random choice (due to stress or market exposure), the rational move is to force a closure.
  She can reason: "Since my deliberation mechanism is broken (unratifiable), I must treat my inability to decide as a signal that the evidence is perfectly balanced. Therefore, I should act based on the prior probabilities alone, or minimize exposure."
  In practice, this often means **reducing the position size** rather than closing it entirely. Selling half removes the "all-in" stakes that drive the vanity/panic dynamic, potentially breaking the psychological feedback loop.

  ### 4. How to Advise Her

  You can tell her that she is experiencing a known philosophical phenomenon called **Deliberative Instability**, where her choice acts as evidence that undermines the choice itself.

  1.  **Validate the Structure:** Confirm that she isn't crazy; the logic she is using (EDT) literally has no solution in this specific setup.
  2.  **Break the Evidential Link:** Suggest that she cannot trust her decision process *as it is currently constituted*. She needs to introduce an external element to break the loop.
  3.  **The Principled Exit:**
      *   **Option 1 (Randomization):** Flip a coin. This is theoretically sound because it makes her action independent of her psychological type.
      *   **Option 2 (Exposure Reduction):** Sell 50%. This changes the payoff structure so that neither "Panic" nor "Vanity" is catastrophic, lowering the stakes of the psychological diagnosis.
      *   **Option 3 (Pre-commitment Rule):** Acknowledge that for future cases, she needs a rule established *before* the unease arrives (e.g., "If tip + unease, always exit"). Rationality sometimes requires binding oneself to a rule to avoid deliberative traps.

  **The Verdict:**
  She is stuck because she is trying to use her decision as a tool to discover the truth, but her decision is part of the data set she is analyzing. She cannot objectively analyze a system she is currently inside. To escape, she must act in a way that removes her psychology from the equation. Randomization is the mathematically pure solution; reducing position size is the psychologically pragmatic one.

  The tragedy of her situation is that the "seasoned traders she admires" who "sit tight" likely do so not because they solved this paradox, but because they have simpler heuristics that bypass the self-referential loop entirely. She is suffering from an excess of reflective rationality.
