      *   *The Mechanism:* Explain *why* it loops. The action is evidence of the agent's type, which correlates with the world state.
      *   *Standard Theory:* Explain that CDT would say "ignore the evidence of your own act," but EDT says "condition on it." In EDT, this leads to no equilibrium.
      *   *The Way Out:*
          1.  **Ratifiability:** Acknowledge that strictly speaking, there is no ratifiable pure strategy.
          2.  **Mixed Strategies:** Randomization breaks the evidential link. (The "Decision Theoretic Coin Flip").
