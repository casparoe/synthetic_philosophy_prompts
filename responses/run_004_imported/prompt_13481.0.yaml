prompt: |-
  I'm a software engineer with no formal training in philosophy, but a couple of years ago I saw a production of Così fan tutte that left me unsettled in a way I couldn't quite articulate, and a friend pointed me toward Bernard Williams's essays on opera as a way of thinking through why. I've since read most of what's collected in "On Opera" and have started a small interview podcast as a side project, mostly talking to academics about ideas that don't get much airtime outside specialist journals. For the next episode I'm talking to a philosopher who has just finished a book arguing that Williams's writing on opera — the piece on operatic convention often called "Manifest Artifice," his reconstruction of Kierkegaard's argument about Don Giovanni, and his scattered remarks on Così — deserves to be read as continuous with his ethical work, rather than as an elegant hobby he kept walled off from it.

  I'd rather not spend the episode having her summarize positions I could already get from her book's introduction, so I'm looking for eight to ten questions that push on specific, arguable moves rather than invite restatement. I want at least one question on each of the following, plus a short follow-up for each keyed to the answer she's most likely to give: (1) whether "Manifest Artifice" — the idea that opera's virtue lies in not disguising its own absurd conventions, arias sung while dying, five characters singing different sentences at once — isn't just as easily read as a confession of opera's central flaw as a defense of it; (2) whether the actual Don Giovanni, comic servant, stone guest, and damnation scene included, really vindicates Kierkegaard's claim that music alone can render "sensuous genius," or whether Williams's own reading quietly walks that claim back; (3) whether the tension Williams wants to leave open in Così fan tutte, between a cynical plot and a score that seems to take the characters' feelings more seriously than the libretto does, can really be sustained indefinitely, or whether in performance one side always ends up winning; and (4) whether Williams's refusal to endorse any single unifying theory of what makes an opera succeed is just the same anti-systematic temperament that drives his suspicion of "the morality system" in ethics, transposed onto aesthetics, or whether that's a tidier parallel than the essays themselves support. If you see two or three additional angles worth pressing — particularly anything specific to individual operas or essays in the collection, rather than general opera-appreciation — feel free to add them, but keep everything at this level of specificity rather than drifting toward questions any well-read opera fan could answer.
