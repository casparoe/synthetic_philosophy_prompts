answer: |-
  Here are ten questions designed to press the specific philosophical claims in your guest's book, rather than inviting summary. Each includes a main question and a follow-up keyed to the defense she is most likely to offer as an advocate for Williams's continuity thesis.

  ### 1. Manifest Artifice: Virtue or Vice?
  **Question:** Williams argues that opera's virtue lies in "manifest artifice"—that singing while dying is honest in a way that realistic acting is not. But isn't it equally plausible to read this as a confession of opera's central flaw? If the medium must announce its own absurdity to be bearable, doesn't that concede that opera fails at the very thing drama attempts: to make us forget the mechanism and feel the pain?
  **Likely Answer:** She will likely argue that Williams isn't saying opera *fails* at realism, but that it *succeeds* at a different kind of truthfulness—emotional truth unburdened by the lie of naturalism.
  **Follow-up:** If that emotional truth is the goal, doesn't "manifest artifice" risk becoming a license for emotional distance? At what point does acknowledging the convention stop being honest and start being a defense mechanism against the very suffering the opera depicts?

  ### 2. Don Giovanni: Music vs. The Stone Guest
  **Question:** Kierkegaard claims music alone can render the "sensuous genius" of Don Giovanni. Williams reconstructs this but includes the comic servant and the supernatural Stone Guest. Doesn't the Stone Guest—specifically the moment of damnation—require a moral framework that music *alone* cannot provide, thereby quietly walking back Kierkegaard's claim even as Williams appears to endorse it?
  **Likely Answer:** She will likely contend that for Williams, the music *enacts* the moral collapse, so the distinction between "moral framework" and "musical rendering" is a false dichotomy.
  **Follow-up:** But if the music enacts the morality, why does the libretto need to specify a statue coming to life? If Kierkegaard is right about music's sufficiency, isn't the literal supernatural intervention a failure of the music to do the work on its own?

  ### 3. Così fan tutte: Sustaining the Tension
  **Question:** Williams wants to leave the tension in *Così* open: a cynical plot versus a score that treats the characters' feelings with sincerity. But in performance, a director or conductor must make binary choices about tempo, lighting, and acting. Is it actually possible to sustain Williams's philosophical suspension of judgment, or does every production inevitably force a victory for either irony or sincerity?
  **Likely Answer:** She will probably argue that a *great* production holds the tension, much like Williams thinks a good life holds ethical tensions without resolving them into a system.
  **Follow-up:** If that's the case, does that make Williams's ideal *Così* essentially unperformable? Are we left with a philosophical ideal of the opera that no actual night at the theater can satisfy, which seems to contradict his insistence on opera as a lived, performed experience?

  ### 4. Ethics vs. Aesthetics: The Anti-Systematic Parallel
  **Question:** You argue Williams's refusal to theorize opera success mirrors his suspicion of "the morality system" in ethics. But ethics requires action guidance, whereas aesthetics arguably does not. Is this parallel tidier than the essays support? Does rejecting a "system" of opera criticism carry the same philosophical weight as rejecting a system of moral obligation?
  **Likely Answer:** She will likely say the weight is in the *temperament*: a resistance to abstraction that obscures the particular human reality, whether in moral choices or aesthetic experiences.
  **Follow-up:** If it's just a temperament, isn't that a psychological observation rather than a philosophical continuity? Where is the structural link that prevents this from being just a case of Williams applying the same personality quirks to two different fields?

  ### 5. The Vernacular: Truthfulness or Comprehension?
  **Question:** Williams is adamant about singing in the vernacular, arguing that not understanding the words breaks the ethical contract of the performance. Is this really about linguistic comprehension, or is it a transposition of his ethical demand for "truthfulness"? Is he punishing the audience for wanting the beauty of the original language because it conflicts with his demand for radical honesty?
  **Likely Answer:** She will likely argue it is about the integration of text and music; if you don't understand the text, the music's specific intention is lost.
  **Follow-up:** But if the music conveys the emotion, as he argues in *Don Giovanni*, why is the semantic meaning of the text non-negotiable? Does this insistence on the vernacular reveal a bias toward the literary that undermines his claims about music's unique power?

  ### 6. Wagner: Myth vs. Artifice
  **Question:** Williams is notably skeptical of Wagner, often critiquing the myth-making. Given his commitment to "manifest artifice," why is Wagner's overt mythologizing a vice while Mozart's conventions are a virtue? Is Williams inconsistent here, or does Wagner's attempt to *hide* the artifice behind total immersion violate the Williamsian standard?
  **Likely Answer:** She will likely suggest Williams sees Wagner as trying to create a religion, which demands belief, whereas opera should demand only aesthetic engagement.
  **Follow-up:** If the danger is demanding belief, doesn't that apply to *Così* as well when the characters sing of undying love? Why is Wagner's myth-making treated as a philosophical error while the Enlightenment cynicism of *Così* is treated as a philosophical insight?

  ### 7. Dying in Song: Mortality and Shame
  **Question:** In his essay on death in opera, Williams notes the absurdity of singing while dying. In his ethical work, he discusses shame and mortality as things that strip away social pretense. Is the opera singer dying in song the ultimate expression of shamelessness, or is it the ultimate expression of dignity? How does this map onto his ethical view of how we should face death?
  **Likely Answer:** She will likely argue it's a form of dignity: owning the performance of one's life until the very end, refusing to be reduced to a biological cessation.
  **Follow-up:** But if it's a performance of dignity, doesn't that validate the "morality system" he hates—imposing a narrative structure on death that isn't there? Is he allowing opera to do what he forbids ethics from doing: making death meaningful?

  ### 8. Lightness as an Ethical Stance
  **Question:** Williams consistently favors Mozart's "lightness" over Verdi's or Wagner's "heaviness." Is this merely an aesthetic preference, or is he implicitly arguing that "lightness" is a more honest way to live? If so, isn't he smuggling an ethical prescription into an aesthetic judgment, which contradicts his refusal to unify the two fields?
  **Likely Answer:** She will likely say "lightness" for Williams is the capacity to acknowledge human frailty without being crushed by it, which is an ethical capacity.
  **Follow-up:** If lightness is an ethical capacity, why does he resist saying that opera *teaches* us this? Does he want the benefit of the ethical insight without the responsibility of claiming opera is moral instruction?

  ### 9. The "Hobby" Defense: Williams's Own Silence
  **Question:** If the continuity between his opera writing and his ethics is so robust, why did Williams himself keep them walled off? He never explicitly made this argument in his lifetime. Are we attributing a systematic coherence to him that he deliberately avoided, essentially systematizing the anti-systematic thinker?
  **Likely Answer:** She will likely argue that Williams was modest or that the connection was implicit in his practice, even if not explicit in his prose.
  **Follow-up:** But if the connection is only visible retrospectively, doesn't that make it a construction of the interpreter rather than a feature of the work? Are we reading Williams, or are we reading *your book* through Williams?

  ### 10. Normativity: Judging Bad Opera
  **Question:** Williams's ethics helps us navigate difficult choices. What does his opera criticism help us *do*? Does it give us tools to identify a bad production, or does it only help us enjoy a good one? If it doesn't offer normative guidance on how to judge failure, is it functioning as philosophy, or is it sophisticated appreciation?
  **Likely Answer:** She will likely argue it changes *how* we attend, making us more sensitive to the specific conditions of the performance rather than judging against an abstract ideal.
  **Follow-up:** If there is no abstract ideal, on what grounds do we criticize a production that embraces "manifest artifice" but is simply boring? Does Williams's framework leave us without the vocabulary to distinguish between profound artifice and mere incompetence?
