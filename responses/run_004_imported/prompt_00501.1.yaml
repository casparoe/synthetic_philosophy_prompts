      *   *Strategy 2: The Cost of Abandonment.* It's not just that we *can't* stop; it's that we *shouldn't* stop because the cost is too high (loss of meaningful relationships). This introduces a normative value (human flourishing/interpersonal relationships) that grounds the "ought."
