answer: |-
  This is an excellent observation. You have put your finger on the single most debated aspect of Strawson's essay. In the literature, this is often called the **"Normativity Objection"** or the challenge of **"Rational Warrant."**

  Your intuition is correct: simply stating "we are built this way" does not logically entail "this way is right." If we were naturally built to be xenophobic, that psychological fact wouldn't make xenophobia morally justified.

  Here is a precise breakdown of why this move is considered philosophically shaky, followed by how contemporary Strawsonians attempt to bridge the gap, structured to help you prepare for your seminar.

  ---

  ### Part 1: Why the Move is Considered Shaky (The Objection)

  To understand the objection precisely, we need to distinguish between **psychological inescapability** and **rational justification**.

  **1. The "Error Theory" Worry**
  Critics (like Peter van Inwagen or Galen Strawson) argue that Strawson conflates the *origin* of our beliefs with their *validity*.
  *   **The Critic's Argument:** Suppose determinism is true. If determinism is true, then no one could have done otherwise. If "could have done otherwise" is a necessary condition for moral responsibility (as incompatibilists claim), then no one is morally responsible.
  *   **The Problem:** If this metaphysical claim is true, then our reactive attitudes are based on a false belief (the belief that people could have done otherwise).
  *   **The Analogy:** Imagine humans are naturally prone to believe in invisible sky spirits (gods) because it reduces anxiety. Even if this belief is psychologically inevitable and socially useful, it doesn't make the belief *true*. Similarly, critics argue reactive attitudes might be a useful evolutionary illusion. Strawson shows we *have* the illusion, but he hasn't shown it isn't an illusion.

  **2. The Local vs. Global Exemption Inconsistency**
  Strawson admits we suspend reactive attitudes in "local" cases (e.g., if someone steps on your foot but you realize they were pushed, or they are a child, or mentally ill). In these cases, we adopt the **objective attitude**.
  *   **The Critic's Argument:** Why do we suspend attitudes in local cases? Usually, because the agent lacked control or understanding. But if determinism is true, *everyone* lacks ultimate control and understanding in the relevant sense.
  *   **The Gap:** If lack of control justifies suspending resentment in the local case, consistency demands we suspend it in the global case (determinism). Strawson says we *can't* do this globally. The critic replies: "Just because you *can't* doesn't mean you *shouldn't*. If the logic of responsibility requires control, and no one has control, then our global practice is irrational, even if unavoidable."

  **3. The Is-Ought Gap (Hume's Law)**
  This is the point you raised. Strawson argues:
  1.  We cannot abandon reactive attitudes without losing human relationships (Is).
  2.  Therefore, we are justified in keeping them (Ought).
  *   **The Gap:** This premise only works if "preserving human relationships" is the highest normative good. But the incompatibilist might argue that "aligning our practices with metaphysical truth" is a higher good. Strawson assumes the value of relationships without arguing for it against the value of truth.

  ---

  ### Part 2: How Defenders Close the Gap (The Strawsonian Defense)

  Contemporary defenders (such as **R.J. Wallace**, **Michael McKenna**, and **Jay Wallace**) do not deny the gap exists. Instead, they argue that the incompatibilist is asking for a kind of justification that is impossible and unnecessary. They close the gap by shifting the *location* of justification.

  **1. Internal vs. External Justification**
  Strawsonians argue that the critic is asking for an **external justification** (a "view from nowhere") for a practice that only makes sense **internally**.
  *   **The Argument:** You cannot step outside of human life to judge human life. The standards of "rationality" and "justification" are themselves part of the human form of life that includes reactive attitudes.
  *   **Closing the Gap:** To ask "Are reactive attitudes justified?" is like asking "Is language justified?" or "Is logic justified?" You have to use language to ask the question. Similarly, you have to use normative concepts (which are embedded in reactive attitudes) to question them. Therefore, the practice is **self-validating**. It doesn't need an external metaphysical stamp of approval.

  **2. The "Cost" Argument (Normative, not just Psychological)**
  Strawson is not merely saying "We are psychologically addicted to resentment." He is saying "Abandoning resentment would cost us something we *ought* to value."
  *   **The Argument:** The "participant stance" is constitutive of **interpersonal relationships**. To view everyone objectively is to view them as objects to be managed, not persons to be engaged with.
  *   **Closing the Gap:** The "ought" comes from the value of **human flourishing**. We are justified in holding people responsible because doing so is a necessary condition for love, friendship, and community. If determinism requires us to give up those relationships to be "metaphysically consistent," then so much the worse for that version of determinism. The justification is pragmatic and moral, not metaphysical.

  **3. R.J. Wallace's "Normative Expectations"**
  In *Responsibility and the Moral Sentiments*, R.J. Wallace refines Strawson to address the rationality worry directly.
  *   **The Move:** Wallace argues reactive attitudes aren't just blind feelings (like a flinch); they embody **normative expectations**. When I resent you, I am implicitly claiming that you violated a moral demand that I reasonably expected you to follow.
  *   **Closing the Gap:** The justification for resentment isn't "I can't help it." It is "You violated a reasonable expectation." As long as the agent had the **normative competence** (the ability to grasp and apply moral reasons), they are responsible.
  *   **Compatibilist Twist:** Wallace argues determinism does not remove normative competence. Even in a determined world, I can grasp moral reasons. Therefore, the reactive attitude is warranted by the agent's competence, not just by my psychological inability to stop feeling it. This bridges the is-ought gap by grounding the "ought" in the agent's rational capacities, not just the observer's psychology.

  **4. The "Strawsonian Dilemma" for the Critic**
  Defenders often turn the tables on the incompatibilist.
  *   **The Argument:** If the incompatibilist says, "Determinism makes responsibility impossible," we ask: "What is your alternative?"
  *   **Option A:** We keep our practices but believe they are false (Error Theory). This is psychologically unstable and alienating.
  *   **Option B:** We abandon our practices. This leads to the loss of human relationships (as Strawson argued).
  *   **The Conclusion:** Since we must choose a way to live, and the Strawsonian way allows for meaningful life while the incompatibilist way leads to alienation or self-deception, the Strawsonian view is **rationally preferable**. It is not just psychologically inevitable; it is the only *liveable* option.

  ---

  ### Part 3: Seminar Prep – How to Deploy This

  To shine in your seminar, you want to show you understand the tension and can articulate the specific terms of the debate. Here are three moves you can make:

  **1. The "Psychological vs. Rational" Distinction**
  *   *Say:* "I'm worried Strawson conflates psychological inescapability with rational warrant. He shows we *can't* stop feeling resentment, but he doesn't show that resentment *tracks truth*. If determinism means our actions are fixed by the past, isn't our resentment based on a false belief about alternative possibilities? How does Strawson prove it's not just a useful fiction?"
  *   *Why this works:* It forces the class to address the "Error Theory" objection directly.

  **2. The "Internal Justification" Pushback**
  *   *Say:* "A defender might say we can't judge our practices from outside our form of life. But doesn't that make moral responsibility immune to revision? If we discovered that reactive attitudes were caused by a specific brain parasite, Strawson seems to say we should keep them because they are 'ours.' Where is the limit? When *should* we revise our practices?"
  *   *Why this works:* It tests the limits of the "Internal Justification" defense.

  **3. Invoking R.J. Wallace (The "Normative Competence" Move)**
  *   *Say:* "It seems like R.J. Wallace improves on Strawson here. Strawson focuses on *our* feelings, but Wallace focuses on the *agent's* capacities. If we ground responsibility in the agent's ability to understand moral reasons (normative competence), rather than just our psychological need for relationships, do we avoid the naturalistic fallacy? Does that give us a better 'ought'?"
  *   *Why this works:* It shows you've done extra reading/thinking and offers a constructive solution to the problem you raised.

  ### Summary for your notes:
  *   **The Objection:** Inevitability $\neq$ Justification. (The "Useful Illusion" worry).
  *   **Strawson's Defense:** There is no "outside" perspective. Relationships are the highest good.
  *   **Wallace's Refinement:** Responsibility is about normative competence (grasping reasons), not just feelings.
  *   **The Key Question:** Is moral responsibility a metaphysical fact we discover, or a social practice we inhabit? Strawson says the latter; critics worry the latter allows for collective self-deception.

  This structure should allow you to navigate the discussion with precision. Good luck with the seminar!
