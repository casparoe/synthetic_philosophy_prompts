          *   *Correction on User's Memory:* The user said the theorem "can't distinguish flipping a fair coin... from some other... way of just handing it to one person." Actually, the objection is usually that Harsanyi *equates* them when our moral intuition says the coin flip is better (fairness). Or, conversely, that Pareto forces us to accept an unfair distribution if it maximizes expectation. Let's stick to the core: Harsanyi ignores *ex post* inequality/fairness.
