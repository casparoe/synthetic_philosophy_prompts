answer: |-
  Harsanyi's Aggregation Theorem is the holy grail for effective altruists and AI alignment researchers seeking a mathematical mandate for utilitarianism. The pitch is seductive: if individuals are rational (satisfying von Neumann-Morgenstern axioms) and society respects a weak Pareto principle (if everyone prefers A to B, society prefers A to B), then social welfare *must* be a weighted sum of individual utilities. It promises to derive "ought" from "is," turning moral philosophy into linear algebra.

  However, this proof relies on a specific, often unstated, definition of "social preference." To make the math work, Harsanyi requires that society's preferences under uncertainty mirror individual preferences under uncertainty. This forces the social welfare function to evaluate outcomes based on *expected utility* before the uncertainty resolves (ex ante), rather than the actual distribution of well-being after the fact (ex post).

  This is where Peter Diamond's 1967 objection strikes. Your recollection is largely correct, but the nuance matters. Consider a scarce life-saving drug and two identical patients. Option A is a coin flip (50% chance each survives). Option B is giving it to Patient 1 outright. If the patients are risk-neutral, their *ex ante* expected utility is identical in both scenarios (0.5 lives saved each on average). Harsanyi's theorem declares Option A and Option B morally equivalent because the sum of expectations is equal.

  Diamond argues this is morally blind. Most intuitions suggest the coin flip is superior because it offers *ex post* fairness—a fair chance—whereas Option B arbitrarily favors one person. By aggregating only *ex ante* expectations, Harsanyi's framework literally cannot see the value of fairness once the coin lands. It treats a guaranteed benefit to one person as interchangeable with a risky benefit to many, provided the mathematical expectation holds. Sen reinforced this by noting that the Pareto principle, when applied to expectations, rules out any concern for the equality of final outcomes.

  Defenders of Harsanyi, notably the late John Broome, offer a robust counter: fairness is not a free-floating metaphysical good; it is only valuable insofar as people care about it. If the patients in the example value the "fair chance," that preference should be encoded in their individual utility functions. If their utility functions already account for the anxiety of the gamble or the joy of fairness, Harsanyi's sum captures it. To impose fairness *on top* of the weighted sum is to violate the Pareto principle—overriding individual preferences for a paternalistic ideal of equity. Broome argues that if you want fairness, you should build it into the inputs, not hack the aggregator.

  This defense is logically consistent but morally costly. It reduces fairness to just another preference, like a taste for ice cream. But our moral intuition suggests fairness is a constraint on how preferences are satisfied, not a preference itself. If a majority prefers to enslave a minority, a utilitarian sum might endorse it; a fairness constraint would veto it. By insisting that social welfare is *only* a sum of individual utilities, Harsanyi assumes the conclusion he tries to prove: that only the sum matters.

  **The Verdict**

  Does the theorem succeed as an argument that rational aggregation must be utilitarian? **No. The objection sinks it.**

  Harsanyi's theorem does not prove that utilitarianism is the only rational moral system. It proves that *if* you accept that social rationality is structurally identical to individual rationality under uncertainty, *and* you prioritize *ex ante* efficiency over *ex post* equity, *then* you get utilitarianism.

  The Diamond objection demonstrates that the theorem's axioms are not neutral tools of logic; they are substantive moral claims that exclude non-utilitarian values by fiat. By defining social welfare strictly as the sum of expectations, the theorem rules out prioritarianism, egalitarianism, and sufficientarianism before the calculation begins. For AI alignment, this is critical. An AI optimizing for Harsanyi-social-welfare will maximize expected preference satisfaction, but it will be blind to whether that satisfaction is distributed fairly once the dust settles.

  The theorem is a valid mathematical derivation, but it is a moral non-starter. It doesn't tell us we *should* be utilitarians; it tells us we *would be* utilitarians if we didn't care about fairness. Since most of us do, the "end of story" claim is false. The math works, but the morality doesn't follow.
