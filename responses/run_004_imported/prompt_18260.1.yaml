answer: |-
  You have articulated one of the oldest and most difficult problems in philosophy, often called the problem of **moral responsibility under determinism.** You are not missing a simple logical step; you have walked right up to the edge of what human reason can comfortably resolve.

  Your friend's question—"At what point does one stop being merely the product of what happened to us?"—assumes there *is* a point. Your intuition, backed by your observation of your brother and yourself, suggests there might not be. If our character is formed by genetics and environment (neither of which we chose), and our actions flow from our character, then how can we be the "ultimate source" of our actions?

  There is no consensus answer to this in philosophy, but there are frameworks that might help you live with the tension without losing your moral compass or your sanity. Here are three ways to look at the "flaw" in the thinking, or rather, the limitation of the framework you are currently using.

  ### 1. The Distinction Between "Origin" and "Capacity"
  You are looking for the moment where the *origin* of an action shifts from "history" to "self." You cannot find it because, in a causal universe, that moment may not exist. Every desire you have to be dependable originates in your upbringing.

  However, many philosophers (specifically **Compatibilists**) argue that responsibility doesn't require being the *ultimate origin* of your desires. It only requires that you have the **capacity to act on your reasons.**

  *   **Your Brother:** When he cancels, is he acting on a reason? Or is he being overridden by an incapacity (anxiety, executive dysfunction, avoidance)? If his "capacity for persistence" fluctuates like the weather, he may lack the *agency* in that moment, even if he has the *intent*.
  *   **You:** You have the capacity to align your actions with your values (caring for your mother), even if those values were instilled by your parents.

  The "flaw" in the thinking is the assumption that for responsibility to be real, you must be a "prime mover" untouched by the past. A more practical view is that responsibility is about **response-ability**: the ability to respond to the demands of the present. You have a high capacity to respond; he has a low one. That difference is real, even if the *source* of that difference is historical.

  ### 2. P.F. Strawson and "Reactive Attitudes"
  The British philosopher P.F. Strawson addressed your exact dilemma in his famous essay *Freedom and Resentment*. He argued that asking whether determinism is true is irrelevant to how we live.

  Strawson distinguished between two ways of viewing people:
  1.  **Participant Stance:** We view others as moral agents. We feel anger, gratitude, resentment, and love. These are "reactive attitudes."
  2.  **Objective Stance:** We view others as objects to be managed, treated, or cured. We feel no anger, only pity or strategic calculation.

  Strawson argued that we *cannot* sustainably live in the Objective Stance toward people we love. To stop being angry at your brother is to stop viewing him as a brother and start viewing him as a patient or a broken machine.

  **Your anger is not a metaphysical error; it is a feature of the relationship.** It signals that you expect more of him because you value him as an agent. If you truly accepted he was "determined" like a rock rolling down a hill, you wouldn't feel anger; you would feel only pity. The fact that you *do* feel anger proves that, practically speaking, you still hold him in the moral community.

  The troubling realization you had is real: **You cannot ultimately justify your superiority.** You got lucky with your conditioning. But Strawson would say: *It doesn't matter.* We are built to hold each other accountable. To abandon that is to abandon human connection.

  ### 3. Moral Luck and Humility
  You touched on this when you noted your own dependability is also a product of reward. This is the concept of **Moral Luck** (articulated by Thomas Nagel). We are judged on things largely out of our control (temperament, upbringing, neural wiring).

  Recognizing this doesn't mean you stop showing up. It means you strip the **moral superiority** out of the act while keeping the **value** of the act.
  *   **Old View:** "I am good, he is bad. I deserve credit; he deserves blame."
  *   **New View:** "I am fortunate to have the capacity to care for her. He is unfortunate to lack it. The mother still needs care."

  This shifts the dynamic from a courtroom (who is guilty?) to a triage unit (who can do what?).

  ### Practical Implications for Your Situation
  So, how do you handle the caregiving and the anger?

  1.  **Accept the "Is" without endorsing the "Ought":** You can accept that your brother *cannot* currently be the person you want him to be (the "Is") without agreeing that he *should not* be held to any standard (the "Ought"). You can say, "I understand this is your pattern, but it doesn't work for Mom."
  2.  **Manage, Don't Blame:** If his unreliability is a fixed variable (like a broken leg), you stop scheduling him for critical tasks. You don't get angry at a person with a broken leg for not running, but you also don't ask them to carry the groceries. Assign him tasks where last-minute cancellation does no harm, or accept his contribution as financial only.
  3.  **Keep the Anger, Lose the Resentment:** Anger is a signal that a boundary has been crossed. Resentment is the story you tell yourself about *why* it was crossed ("He doesn't care," "He's selfish"). If you view his behavior as a limitation rather than a malice, the resentment may cool, even if the frustration remains.
  4.  **Forgive Yourself for Being "Lucky":** You feel unsettled because your virtue feels unearned. But a gift is still a gift. The world is better because you show up. Do not let the realization that your goodness is determined stop you from being good.

  ### Conclusion
  There is no flaw in your logic; you have correctly identified that the metaphysical justification for blame is shaky. But human life is not lived on a metaphysical plane; it is lived on a relational one.

  You are justified in treating your reactions as "more than a description" because **your reactions are part of the causal chain that might change the future.** Your anger might be the pressure that finally helps him find a coping mechanism. Your dependability is the safety net that keeps your mother alive.

  You cannot find the point where history ends and freedom begins because they are woven together. But you can find the point where **helpfulness begins and helplessness ends.** That is where you live.
