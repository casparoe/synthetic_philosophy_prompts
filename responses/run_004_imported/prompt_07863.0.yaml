          *   Specific Question 3: Test the view with lopsided numbers (1 vs. 1000).
          *   Specific Question 4: Is "separateness of persons" doing real work or just labeling?
          *   Specific Question 5: Apply the view to the specific helicopter scene (no hedging).
          *   Format: Question + Follow-up (keyed to likely dodge/answer).
          *   Tone: Engaging, probing, suitable for a public-facing recording (not too academic jargon-heavy, but intellectually rigorous).

  2.  **Deconstruct Taurek's Position (Mental Sandbox):**
      *   *Core Claim:* Aggregating harms across different people is mistaken. Loss is experienced individually. Losing one's life is 100% loss for that person. Saving 6 doesn't prevent "6x loss" in a single subject.
      *   *Implication:* We have no duty to save the greater number. Equal concern for each individual might imply a lottery (coin flip).
      *   *Critiques:* Parfit (Innumerate Ethics) argues this leads to absurd conclusions in large numbers. "Separateness of persons" (Rawls/Nozick context) is often used to block utilitarianism, but does it block *any* counting?
      *   *The "Dodge":* Philosophers often retreat to "ceteris paribus" (all else being equal) or shift to "supererogation" (it's good to save more, but not required) or "intuition pumps" (your intuition about 1 vs 1000 is biased).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (Parfit/Innumerate Ethics):* Need to bring up Parfit directly. Parfit argues that if we don't count numbers, we ignore the magnitude of preventable suffering.
          *   *Draft:* What about Parfit's reply?
          *   *Refinement:* Make it specific. Parfit says ignoring numbers makes us blind to the scale of tragedy. How do you answer that without just saying "individuals matter"?
          *   *Follow-up:* If she says Parfit conflates individual loss with collective loss, push on whether the *prevention* of loss isn't still a moral good regardless of who experiences it.

      *   *Question 2 (Coin Flip/Principled vs. Refusal):* Is the coin flip a solution or a cop-out?
          *   *Draft:* Is flipping a coin just refusing to decide?
          *   *Refinement:* Frame it as moral agency. Does randomizing absolve the pilot of responsibility? Is it a positive moral duty to flip, or just a way to avoid guilt?
          *   *Follow-up:* If she says it shows equal respect, ask if equal respect requires *saving* them, not just giving them odds.

      *   *Question 3 (Lopsided Numbers 1 vs 1000):* The standard reductio ad absurdum.
          *   *Draft:* What if it's 1 vs 1000?
          *   *Refinement:* Acknowledge Taurek's own hesitation here (he actually struggles with this). Ask where the threshold is. Is there a point where numbers *must* count?
          *   *Follow-up:* If she says "no threshold," challenge the sanity of the view. If she says "yes, a threshold," ask how that threshold is derived if numbers don't count intrinsically.

      *   *Question 4 (Separateness of Persons):* Is this phrase doing work?
          *   *Draft:* Is separateness of persons just a label?
          *   *Refinement:* This concept is usually used to critique Utilitarianism (sacrificing one for many). Taurek uses it to say we can't sum losses. Ask if this is a metaphysical claim or a moral one. Does it actually justify *not* saving the many?
          *   *Follow-up:* If she says it protects individual rights, ask why protecting the individual's *chance* outweighs protecting the *lives* of the group.

      *   *Question 5 (The Helicopter Scene - Application):* The "no hedging" requirement.
