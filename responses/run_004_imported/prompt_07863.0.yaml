          *   *Follow-up:* If she hedges ("it depends"), remind her of the constraints (fuel, time). Force the choice: Coin or Hikers?

      *   *Question 6 (Emotional/Moral Residue):* Need a question about the aftermath. How does the pilot feel?
          *   *Draft:* How does the pilot feel afterwards?
          *   *Refinement:* If the pilot saves the one and the six die, is there *regret* that is different than if they saved the six? Does the Taurek view allow for "agent-regret" regarding the numbers?
          *   *Follow-up:* If she says "no regret," that sounds psychopathic. If "yes," why regret the numbers if they don't count?

      *   *Question 7 (Public Policy/Institutions):* Move from individual to system.
          *   *Draft:* What about hospitals?
          *   *Refinement:* Triage. If a doctor adopts this view, do they flip a coin between one critical patient and six moderate ones? Is this view viable for public policy or only private morality?
          *   *Follow-up:* If she says "private only," ask why the pilot (a public servant) gets to act on private morality.

      *   *Question 8 (The "Why" / Intuition):* Why hold this view?
          *   *Draft:* Why do you believe this?
          *   *Refinement:* What is the core moral intuition that survives the 1 vs 1000 problem? Is it about fairness to the minority?
          *   *Follow-up:* Is fairness to the one more important than the survival of the many?

      *   *Selection:* I need to pick the best 7-8. The prompt asks for 7 or 8. I have enough ideas. I need to ensure the specific requirements (Parfit, Coin Flip, 1v1000, Separateness, Helicopter) are covered distinctly.

      *   *Refining the Follow-ups:* The prompt asks for follow-ups "keyed to the dodge or answer she's most likely to reach for." I need to anticipate standard philosophical defenses.
          *   *Dodge 1:* "It's about equal concern." -> *Push:* Does equal concern require equal *outcome* or equal *opportunity*?
          *   *Dodge 2:* "Numbers matter eventually." -> *Push:* Then numbers *do* count, you just disagree on the exchange rate.
          *   *Dodge 3:* "Separateness prevents aggregation." -> *Push:* Does it prevent *comparing* outcomes?

  4.  **Final Review against Constraints:**
