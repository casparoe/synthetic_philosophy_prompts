      *   *Nuance:* Don't say "Bayesianism is broken." Say "Idealized Bayesianism struggles here."
      *   *Specific Terminology:* Mention "Logical Omniscience" explicitly as the user recalled it. Mention "Counterfactual Credences" (Jeffrey/Garber).

