prompt: |-
  Ok, this is a total rabbit hole but I need a hand for a piece I'm writing on how scientists actually weigh evidence. I keep running into this thing called the "problem of old evidence" in Bayesian epistemology -- I think it traces back to the philosopher Clark Glymour around 1980 -- and its bugging me. The classic case: Mercury's orbit had this small extra wobble in its perihelion that astronomers had already measured decades before Einstein showed up, and everyone treats general relativity nailing that number as one of the theory's biggest points in its favor. But if Bayes' theorem says confirmation is about how much a piece of evidence shifts your credence, that wobble was already fully known -- probability 1 -- long before GR existed, so strictly there was nothing left for it to shift. So did GR get zero Bayesian credit for arguably its most famous piece of supporting evidence? Can you explain why this is a genuine bind for Bayesians and not just a technicality, then walk me through, in plain english, the main ways people have tried to wriggle out of it (something about relaxing logical omniscience, something about counterfactual credences, if I'm remembering right) -- and tell me whether any of them actually work, or if it's still an open wound.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The "Problem of Old Evidence" in Bayesian epistemology.
      *   **Context:** The user is writing a piece on how scientists weigh evidence.
      *   **Specific Example:** Einstein's General Relativity (GR) explaining Mercury's perihelion precession (already known data).
      *   **Core Conflict:** Bayes' Theorem suggests evidence $E$ confirms hypothesis $H$ if $P(H|E) > P(H)$. But if $E$ is already known, $P(E) = 1$. If $P(E) = 1$, then $P(H|E) = P(H)$. So, no confirmation occurs.
      *   **Requirements:**
          1.  Explain why this is a *genuine bind* (not just technical).
          2.  Walk through main solutions in *plain English* (relaxing logical omniscience, counterfactual credences, etc.).
          3.  Evaluate whether any solutions actually work or if it remains an open problem.
      *   **Tone:** Informative, engaging (it's a "rabbit hole"), accurate but accessible.

  2.  **Deconstruct the Problem (The "Bind"):**
      *   *Why does it matter?* It's not just math; it undermines the descriptive power of Bayesianism. Scientists *say* old evidence confirms new theories. If Bayesianism says "no," then Bayesianism fails to model actual scientific reasoning.
      *   *The Math:* $P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}$. If $P(E) = 1$, then $P(H|E) = P(E|H) \cdot P(H)$. Since $H$ entails $E$ (in the GR case), $P(E|H) = 1$. So $P(H|E) = P(H)$. No update.
      *   *The Intuition:* Einstein felt a "heart palpitation" when he realized GR fit the Mercury data. That *feels* like confirmation. Bayesianism says it shouldn't.

  3.  **Identify the Main Solutions:**
      *   *Solution 1: Counterfactual/Historical Credences (Garber, Jeffrey).* Imagine a state *before* we knew $E$ but *after* we had the theory $H$. What would our credence have been?
      *   *Solution 2: Relaxing Logical Omniscience (Garber).* Agents aren't perfect logicians. We know $E$, and we know $H$, but we don't *know* that $H$ entails $E$ until we do the math. So, for the agent, the logical relationship is new evidence.
      *   *Solution 3: The "New Implication" Approach.* It's not $E$ that confirms $H$, it's the fact *that $H$ explains $E$* ($H \to E$) that is the new evidence.
      *   *Solution 4: Temporal/Subjective Bayesianism.* Distinguish between the time of discovery and the time of justification. (Less common as a direct fix, more of a reframing).

  4.  **Evaluate the Solutions (Do they work?):**
      *   *Counterfactuals:* Hard to define. What is the "right" prior before knowing $E$ but knowing background physics? It feels subjective/arbitrary.
      *   *Logical Omniscience:* More psychologically realistic. Scientists aren't gods. But it complicates the formal math significantly.
      *   *Consensus:* It's still debated. Most Bayesians accept it's a problem for *idealized* Bayesianism but think *real-world* Bayesianism (with bounded rationality) handles it fine. It's a "scar," not necessarily a "fatal wound."

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the rabbit hole. Validate the user's understanding (Glymour, 1980, *Theory and Evidence*). Confirm the Mercury example is the canonical case.
      *   *Section 1: The Bind.* Explain the math simply. Use the "Probability 1" trap. Explain why it's not just technical: it disconnects the math from the history of science. If Bayes can't explain Einstein, can it explain science?
      *   *Section 2: The Escape Routes (Plain English).*
          *   *Route A: The "I Didn't Know the Math" Defense (Bounded Rationality).* Focus on Garber. We knew the number (Mercury), we knew the theory (GR), but we didn't know the *connection*. The new evidence is "GR entails Mercury's orbit," not "Mercury's orbit exists."
          *   *Route B: The Time Travel Defense (Counterfactuals).* Ask: "If we *didn't* know about Mercury, how much would GR predict it?" This restores the probabilistic lift.
          *   *Route C: The "Explanation" Defense.* It's about explanatory power, not just prediction. (Mention inference to the best explanation overlap).
      *   *Section 3: The Verdict.* Do they work?
          *   Bounded rationality is the most popular among naturalists.
          *   Counterfactuals are useful but fuzzy.
          *   Conclusion: It's a known limitation of *idealized* Bayesianism, but not a dealbreaker for *methodological* Bayesianism. It's an "open wound" that has scabbed over.
