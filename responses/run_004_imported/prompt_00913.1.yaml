      *   "Present value at compound discount." Use that phrase.
      *   "Picture drawn in perspective." Use that image.

  8.  **Final Review against Constraints:**
      *   Ramsey character? No.
      *   Biographical? No.
      *   Camus-style defiance? No.
      *   Tidy reassurance? No.
      *   Unsettling "I have reason" vibe? Yes.

      *(Self-Correction during drafting)*: Initially, I thought about making it about climate change. But that makes the "heat death" too literal. Let's make it about *personal* oblivion. Sarah is worried about her legacy, or the point of working hard if she dies. Elias applies the Ramsey logic. It makes him sound like a sociopath, but a happy one. That's the Ramsey vibe—cheerful logic.

      *Let's shift the setting to a University Archive.* It feels more appropriate for finding a text. Elias is a grad student. The friend is an undergrad.
      *Actually, the Financial Setting works best for "Discount Rates."* Let's stick with the Quant idea. It mirrors Ramsey's probability work.

