answer: |-
  The box of books came from the estate of Arthur Vane, a retired partner who had died quietly of a heart attack at his desk. Julian, who handled risk modeling for the firm, was tasked with clearing the office. Most of the books were dry treatises on derivatives and macroeconomic theory. But at the bottom of the third box, wrapped in brown paper, was a slim, yellowing volume: *The Foundations of Mathematics and Other Logical Essays*. 1931 edition.

  Julian didn't know why he kept it. He wasn't a reader of philosophy. He was a man of probabilities, of discount curves and tail-risk hedging. But that evening, in his apartment that overlooked a city grid glowing with indifferent electricity, he opened it. He turned to the back. He read the essay titled "Epilogue."

  It was 1925. Frank Ramsey was twenty-two. He would be dead at twenty-six.

  Julian read the passage about the picture of the world. *Drawn in perspective, not to scale.* He read the line about the heat death of the universe having a present value at compound discount that was effectively zero. He read it three times. Then he poured a drink, sat in his leather armchair, and felt a sensation he hadn't experienced in years. He felt light.

  It wasn't hope. Hope implies a wager on a positive future. This was something colder. It was an arbitrage on existence itself.

  ***

  Two days later, the office was vibrating with a low-grade panic. The news cycles were churning through the usual apocalypse menu: atmospheric carbon thresholds, regional conflicts, supply chain collapses. In the breakroom, Mara was staring into a coffee machine as if it contained the core of a reactor.

  Mara was twenty-four, brilliant, and currently paralyzed. She had come to Julian's office an hour prior, eyes red, admitting she couldn't focus on the volatility models because she couldn't see the point of optimizing a portfolio for a world that might not have a functioning banking system in thirty years.

  "I know it's irrational," she had said, her voice tight. "I know I should just do the work. But the scale of it… it's like we're rearranging deck chairs, but the ship is the size of a planet and the ocean is on fire."

  Julian had told her to take a break. Now, finding her in the breakroom, he saw she hadn't moved.

  "Still calculating the half-life of civilization?" Julian asked. His voice was even, pleasant.

  Mara didn't turn. "It's not funny, Julian. I feel like I'm lying to clients. I'm selling them security in a system that's fundamentally temporary. It feels… dishonest."

  "Dishonest to whom?"

  "To the truth."

  Julian leaned against the counter. He held the yellowing book in his hand. He hadn't meant to bring it, but it was there. "You're making a category error, Mara. You're treating the background as if it has the same weight as the foreground."

  She turned, frowning. "What?"

  "The universe," Julian said. "You're treating it like a model to scale. You think because the timeline is long and the space is big, the value is big. But value doesn't work like geometry."

  He tapped the book. "There's a argument here. From a guy named Ramsey. He says our picture of the world should be drawn in perspective. In a landscape painting, the mountains in the back are smaller than the trees in the front. Not because they *are* smaller, but because that is how they are experienced. If you paint the mountains the same size as the trees because you know they are physically larger, you aren't painting reality. You're painting a map."

  Mara blinked. "So I should just… ignore the mountains?"

  "No. You should discount them." Julian took a sip of his water. "Think about finance. A dollar ten years from now is worth less than a dollar today. You discount it. Why? Because of risk, because of time preference. Ramsey argues you apply that to existence. The heat death of the universe? The end of the species? It's a hundred million years away. At any reasonable discount rate, the present value of that tragedy is zero."

  Mara stared at him. The hum of the refrigerator seemed to grow louder. "That's… that's incredibly cold, Julian."

  "Is it?" He smiled. It was a genuine smile, untroubled. "Or is it accurate? You're suffering over a variable that, mathematically, shouldn't impact your current equation. You're letting a background pixel obscure the foreground subject."

  "The subject being what? My bonus? My career?"

  "The subject being you. Right now. The coffee. The work." Julian pushed off the counter. "Ramsey says that being cheerful isn't less 'true' than being depressed. Neither feeling corresponds to the facts, because the facts don't have feelings. But one allows you to function, and the other paralyzes you. Since neither is more 'objective,' reason dictates you choose the one that works."

  "So I should just choose to be happy?" Mara's voice was skeptical, but the tension in her shoulders had dropped. She was listening. The logic was a hook.

  "You should choose to be rational. And if the universe is indifferent, rationality suggests you align with the foreground. The stars are smaller than you, Mara. In the only picture that matters."

  She looked down at her coffee. "It feels like a trick. Like I'm gaslighting myself."

  "That's just the inertia of the old model," Julian said softly. "You're used to thinking that gravity equals importance. It doesn't."

  He watched her process it. He could see the relief washing over her, but it was a specific kind of relief. It wasn't the warmth of a hug; it was the silence of a machine turning off. The burden of the cosmos was being written off as a bad debt.

  "Okay," she said quietly. "Okay. Present value. Perspective."

  "Exactly."

  She took a sip of the coffee. She looked up at him, and her eyes were clearer, but also flatter. "You really believe that? That the end of everything is worth zero?"

  "I believe that worrying about it has a cost, and the return on investment is negative," Julian said. "So, rationally, I don't worry."

  "And if you're wrong? If the scale *does* matter?"

  "Then I'll be dead, and I won't care," Julian said. He grinned again. It was a bright, sharp expression. "And if I'm right, then I'm the only one in the room who isn't wasting energy on a ghost."

  Mara nodded slowly. She set the cup in the sink. "Thanks, Julian. I think… I think I can finish the model."

  "Good."

  She walked out of the breakroom, her step lighter. She had been given a tool, and she had used it to cut the knot of her anxiety.

  Julian stayed behind. He looked down at the yellow book in his hand. He ran his thumb over the cover. He felt a surge of triumph, a pure, crystalline satisfaction. He had solved the problem. He had the formula.

  But as the silence of the breakroom settled back in, the coldness of the logic pressed against his own ribs. He thought about Arthur Vane, dead at his desk. He thought about the discount rate. If the future is discounted to zero, then nothing accumulates. There is no legacy, no long arc, no final reckoning. There is only the foreground, forever isolated, forever small, forever bright.

  It was liberating. It was also a vacuum.

  He heard footsteps approaching down the hall. Another analyst, humming a tune. The world was continuing, indifferent and busy.

  Julian closed the book. He placed it on the counter, next to the sink. He didn't take it with him. He didn't need to read it again. He knew the argument. He had reason on his side.

  He walked out of the breakroom and back toward his desk, stepping carefully over the threshold, leaving the silence behind him, feeling perfectly, terribly sane.
