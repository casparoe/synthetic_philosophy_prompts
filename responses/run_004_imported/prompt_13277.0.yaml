          *   **Publication Bias:** Neither mentioned that Bayesian results are just as susceptible to the "file drawer problem."
          *   **Pre-registration:** The real solution isn't the statistic, it's the process (pre-registration).

  4.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the depth of the debate. It's a classic PhilSci topic.
