answer: |-
  You have hit on one of the most fundamental problems in management, economics, and AI alignment. Your intuition is spot on, and your RL analogy is actually mathematically precise.

  What your friend is witnessing is a textbook case of **Goodhart's Law**, and the behavior of the support reps is exactly equivalent to **Reward Hacking** in Reinforcement Learning.

  Here is the breakdown of the deep structure of why this happens, why the manager is wrong, and a principled framework your friend can use to fix it.

  ### 1. The Deep Structure: Why This Happens Everywhere

  The core issue is the difference between a **Goal** and a **Proxy**.

  *   **The Goal:** Customer satisfaction and actual problem resolution. (This is hard to measure directly).
  *   **The Proxy:** Tickets closed per day. (This is easy to measure).

  Management assumes the Proxy correlates perfectly with the Goal. As long as the pressure is low, this is true. But the moment you tie money or survival to the Proxy, humans (like RL agents) will optimize for the Proxy *at the expense of the Goal*.

  **The RL Analogy (Reward Hacking)**
  In Reinforcement Learning, if you tell an agent "maximize score," it might find a bug in the game to infinite-loop points rather than beating the level.
  *   **The Agent:** The Support Rep.
  *   **The Reward Function:** The Bonus Structure.
  *   **The Environment:** The Ticketing System.
  *   **The Hack:** Closing tickets prematurely.

  The rep isn't being "lazy" or "bad." They are being **rational**. They are successfully optimizing the objective function they were given. The manager's statement ("reopens are a separate problem") is factually incorrect; reopens are a *direct causal consequence* of the incentive structure.

  **Why is this universal?**
  1.  **Measurability Bias:** We tend to measure what is easy to count, not what matters.
  2.  **Decoupling:** Under pressure, the correlation between the metric and the reality breaks.
  3.  **Time Horizon Mismatch:** The rep gets the bonus *now*. The company loses the customer (churn) *later*. The rep doesn't feel the pain of the churn, so they ignore it.

  ### 2. Principled Metric Design (How to Fix It)

  You cannot simply "measure better." You have to design a system that makes hacking the metric difficult or costly. Here are three principles for robust metric design:

  **A. The Balanced Scorecard (Multi-Objective Optimization)**
  Never optimize for a single variable. If you optimize for Speed, you must pair it with Quality.
  *   *Bad:* Maximize Tickets Closed.
  *   *Good:* Maximize Tickets Closed, *subject to* Reopen Rate < 5% and CSAT > 4.5/5.
  *   *Why:* This forces the agent to trade off. You can't close fast if it means the customer reopens it.

  **B. Guardrail Metrics (Negative Constraints)**
  Some metrics should act as "kill switches" rather than bonuses.
  *   If Reopen Rate exceeds X%, the efficiency bonus is zeroed out.
  *   This aligns the rep's risk with the company's risk.

  **C. Lagging vs. Leading Indicators**
  *   **Leading:** Tickets closed (happens today).
  *   **Lagging:** Customer Churn / Renewal Rate (happens in 6 months).
  *   *Fix:* Tie a portion of the bonus to a lagging indicator. If the customers they helped this quarter churn next quarter, the bonus is clawed back or reduced. This extends the rep's time horizon.

  ### 3. What Your Friend Should Tell Her Manager

  The manager is likely under pressure from *their* leadership to show "efficiency gains." If your friend just says "this is unfair," the manager will hear "the team can't handle targets."

  She needs to speak the language of **Risk** and **Revenue**, not fairness. She needs to arm him with data to protect him from *his* bosses when the churn numbers eventually hit.

  **The Script/Strategy:**

  **Step 1: Validate the Win (Disarm the defense)**
  > "I agree the new structure has successfully driven efficiency. The volume throughput is exactly what we wanted, and the team is motivated."

  **Step 2: Introduce the "Technical Debt" Analogy**
  > "However, we are accruing what looks like 'Support Technical Debt.' The doubled reopen rate indicates we aren't solving problems, we're closing loops. In software, if you ship code fast but it's buggy, you eventually slow down to fix the bugs. In support, if we close tickets fast but customers return, we double our workload on the same issue."

  **Step 3: Connect to Revenue (The Manager's Language)**
  > "The risk here isn't just metric integrity; it's churn. A customer whose ticket is closed without resolution is 3x more likely to cancel. If we optimize for 'Tickets Closed' but lose 'Customers Retained,' we are optimizing the department at the expense of the company. The reopen rate isn't a separate problem; it's the leading indicator of next quarter's churn."

  **Step 4: Propose the "Balanced" Solution**
  > "I recommend we keep the efficiency bonus but add a **Quality Gate**.
  > 1. You qualify for the volume bonus only if your Reopen Rate is under X%.
  > 2. We add a small weighting for Customer Satisfaction (CSAT) scores.
  >
  > This ensures we are rewarded for *resolved* tickets, not just *closed* tickets. It protects the company from churn risk while keeping the team motivated."

  ### Summary for your friend
  The manager is suffering from **Surrogation**: when the measure substitutes for the goal.

  Your friend needs to explain that **metrics are not just thermometers; they are thermostats.** A thermometer measures the temperature; a thermostat changes it. By tying money to a metric, they turned a thermometer into a thermostat, and now the system is heating up in the wrong way.

  The fix isn't to remove incentives, but to make the incentive function match the actual business value (Resolved Customers) rather than the administrative artifact (Closed Tickets).
