answer: |-
  The short answer is: **Bohmian mechanics survives Bell's theorem because it is explicitly non-local.**

  The confusion you are encountering in rationalist circles stems from a common imprecision in popular science communication. The headline "Bell's Theorem Kills Hidden Variables" is shorthand for "Bell's Theorem Kills **Local** Hidden Variables."

  Bohmian mechanics (also known as De Broglie-Bohm theory or Pilot-Wave theory) is a **non-local hidden variable theory**. It does not violate Bell's theorem; rather, it sits precisely in the logical space that Bell's theorem leaves open.

  Here is the technical breakdown of why Bohmian mechanics persists, why it is taken seriously, and why it is often marginalized despite its viability.

  ### 1. What Bell Actually Proved
  To understand why Bohm survives, we must be precise about what Bell ruled out. Bell derived an inequality that any theory satisfying **Local Realism** must obey.
  *   **Realism:** Physical properties exist independently of measurement (hidden variables).
  *   **Locality:** An event at point A cannot instantaneously influence an event at point B (no faster-than-light causation).

  Experiments (Aspect, Zeilinger, Clauser, etc.) have consistently violated Bell's inequalities, matching the predictions of Quantum Mechanics (QM).
  **Conclusion:** Nature does not obey Local Realism.

  This leaves us with a menu of options. To match experiment, you must give up at least one of the two assumptions:
  1.  **Give up Realism:** Accept the orthodox Copenhagen view (properties aren't defined until measurement) or Many-Worlds (all outcomes happen).
  2.  **Give up Locality:** Accept that there is instantaneous influence across space.

  **Bohmian mechanics chooses option 2.** It retains Realism and Determinism but sacrifices Locality. Therefore, Bell's theorem does not rule it out; in fact, Bell himself was a great admirer of Bohm's theory precisely because it showed that a deterministic underpinning for QM was logically possible, provided one accepted non-locality.

  ### 2. How Bohmian Mechanics "Slips Past" Bell
  In Bohmian mechanics, particles have definite positions and trajectories at all times (the hidden variables). However, their motion is governed by a "guiding equation" derived from the universal wavefunction.

  The crucial technical detail is that the guiding equation for a specific particle depends on the instantaneous positions of **all other particles** in the universe with which it is entangled.
  *   If you measure Particle A here, the guiding equation for Particle B (light-years away) changes *instantaneously*.
  *   This is "action at a distance." It is explicitly non-local.

  Because the theory is non-local, it is not constrained by Bell's inequalities (which assume locality). It reproduces the exact same statistical predictions as standard QM, including the violations of Bell's inequalities. It doesn't contradict the data; it explains the data by admitting that the universe is fundamentally non-local.

  ### 3. Why Is It Still Taken Seriously?
  If it requires "spooky action at a distance," why do physicists and philosophers still study it? It isn't just stubbornness. It offers specific advantages over orthodoxy:

  **A. It Solves the Measurement Problem**
  Standard QM has a "measurement problem": When does the wavefunction collapse? What counts as a measurement? Is there a conscious observer involved? The math doesn't say.
  Bohmian mechanics has no collapse. The wavefunction evolves deterministically via the Schrödinger equation, and particles always have definite positions. "Measurement" is just a physical interaction like any other. It provides a clear ontology (a story about what *exists*) without the vagueness of the Copenhagen interpretation.

  **B. It Is an Existence Proof**
  Bohmian mechanics serves as a counter-example to the claim that "QM implies indeterminism." It proves that you can construct a deterministic theory that is empirically indistinguishable from standard QM (in the non-relativistic domain). This forces philosophers to admit that indeterminism is a *choice* of interpretation, not a forced conclusion of the data.

  **C. It Clarifies Quantum Weirdness**
  In orthodox QM, non-locality is often hidden behind the veil of "correlations without causation." In Bohmian mechanics, non-locality is out in the open. It forces us to confront the tension between Quantum Mechanics and Special Relativity directly, rather than sweeping it under the rug.

  ### 4. Why Is It Marginalized? (The Cost of Admission)
  If Bohmian mechanics is deterministic and solves the measurement problem, why isn't it the standard view? There are significant technical and aesthetic costs:

  **A. Tension with Special Relativity**
  This is the biggest hurdle. Bohmian mechanics requires a preferred reference frame to define "instantaneous" influences. While the theory is constructed so that you cannot *use* this non-locality to send signals faster than light (preserving causality and preventing paradoxes), the fundamental laws look different in different reference frames. This violates the spirit of Lorentz Invariance, which is central to modern physics. Making Bohmian mechanics compatible with Quantum Field Theory (QFT) is possible but difficult and often considered "clunky" compared to standard QFT.

  **B. "Empty" Waves**
  In Bohmian mechanics, the wavefunction guides the particle, but the particle only goes down one path. The rest of the wavefunction (the "empty wave") continues to exist and evolve but contains no particle. Critics argue this is ontological excess—why carry around all that mathematical baggage that has no physical effect?

  **C. Asymmetry**
  The theory treats position as the fundamental hidden variable, giving it a privileged status over momentum or spin. Some physicists find this arbitrary and inelegant.

  ### 5. The Rationalist Context
  In rationalist communities (like LessWrong), there is often a strong preference for **Many-Worlds (Everettian) Quantum Mechanics**.
  *   **Many-Worlds** is deterministic but preserves Locality (in the configuration space sense) by denying that only one outcome happens.
  *   **Bohmian Mechanics** is deterministic but denies Locality to keep only one outcome.

  Many rationalists prefer Many-Worlds because it feels more "reductionist" (no special measurement rules) and avoids the non-locality that clashes with Relativity. Consequently, Bohmian mechanics is sometimes dismissed in those circles not because it is disproven, but because it is viewed as "Many-Worlds with extra steps" (adding particles to the wavefunction without changing the predictions).

  ### Summary
  Bohmian mechanics is not a holdout against settled physics; it is a fully consistent interpretation of the *same* physics.
  *   **Bell's Theorem:** Rules out **Local** Hidden Variables.
  *   **Bohmian Mechanics:** Is a **Non-Local** Hidden Variable theory.

  It persists because it is the clearest example that **determinism is compatible with Quantum Mechanics**, provided one is willing to accept fundamental non-locality. It is taken seriously because it solves the measurement problem cleanly, even if it creates tension with Relativity. The claim that Bell settled the matter against determinism is simply incorrect; Bell settled the matter against *local* determinism.

  **References for further reading:**
  *   J.S. Bell, *Speakable and Unspeakable in Quantum Mechanics* (Specifically the essay "On the Impossible Pilot Wave").
  *   David Z. Albert, *Quantum Mechanics and Experience* (Excellent philosophical breakdown).
  *   Stanford Encyclopedia of Philosophy: "Bohmian Mechanics".
