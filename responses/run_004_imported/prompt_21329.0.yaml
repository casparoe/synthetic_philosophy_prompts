      *   *The Bohmian Escape:* How does Bohm fit? It keeps Realism (particles exist) and Determinism, but drops Locality. The "pilot wave" connects everything instantly.
      *   *Why the confusion?* "Local" is often dropped in casual conversation. Also, physicists dislike non-locality because of Relativity.
