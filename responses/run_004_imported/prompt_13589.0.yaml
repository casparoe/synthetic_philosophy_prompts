prompt: |-
  Okay so last night after our philosophy of mind reading group a few of us stayed at the bar way too long arguing about Twin Earth and I'm still kind of fired up about it, so I want to turn it into something instead of just stewing over it. We got through the standard water/XYZ setup pretty fast -- everyone agreed that one's been done to death -- and ended up spending like an hour on the Burge arthritis case instead. You know the one: a guy has a pain in his thigh and tells his doctor he thinks its his arthritis acting up, except arthritis is specifically a joint condition, so strictly speaking he's just wrong, thighs aren't joints. Burge's move is that his belief still counts as an arthritis-belief, wrong though it is, because that's how the word gets used in his speech community -- and then he has you imagine a molecule-for-molecule twin of the guy, same pain, same internal life, literally everything, except this twin is embedded in a community where the word that sounds like "arthritis" gets used a little more loosely, to cover rheumatoid pain outside the joints too. Same internal stuff going on in both heads, different belief content, purely because of how the people around each guy talk. My friend Priya kept insisting this is basically a cheat -- that all it really shows is that the guy has a fuzzy dictionary entry, not that his actual thought content depends on his community, and that Burge is just relabeling a difference in word-meaning as if it were a difference in mental content. I don't think that's right but I couldn't articulate why well enough to actually win her over, which has been bugging me all day.

  So here's what I want from you: write me a short story (a page or two, whatever length feels right, doesn't have to be sci-fi) built around a case like this one instead of the water/XYZ trope -- two people (twins, doubles, the same guy shuttled between two towns, whatever setup works for you) who are internally identical, same physical ailment and everything, where the ONLY difference between them is how their community happens to use a word, and yet that difference ends up mattering for something real and consequential in the story, not just as a semantic footnote. If it fits naturally, make it clear (even just implicitly) why this is a genuinely different kind of argument than the classic natural-kind Twin Earth case -- there's no hidden chemical difference doing any work here, it's all downstream of linguistic practice -- since that's the exact bit Priya and I never got straight last night. Take it wherever you want tonally, I just want the philosophy to actually have teeth by the end instead of just sitting there as decoration.
