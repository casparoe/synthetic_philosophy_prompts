answer: |-
  Your roommate is arguing from a very specific, narrow framework often called "Homo Economicus"—the idea that a rational actor is purely self-interested, shortsighted, and maximizes material gain in every isolated transaction. By that specific definition, he's technically correct: once the service was rendered, you held all the leverage, and keeping the cash maximized your immediate bank balance.

  However, his definition of "rational" is flawed because it treats life as a series of disconnected one-off events rather than a continuous existence within a society. If you expand the definition of rationality to include **long-term self-interest, risk management, and psychological utility**, paying was actually the far more rational move.

  Here is how you can break down why your roommate's logic doesn't hold up in the real world.

  ### 1. The "Iterated Game" vs. The "One-Shot Game"
  Your roommate is treating this like a "one-shot game" in game theory. In a one-shot Prisoner's Dilemma, betrayal is often the dominant strategy because there are no future consequences.

  But life is an **iterated game**. You are not a different person today than you will be tomorrow. Every time you make a decision, you are training your brain on how to behave. If you teach yourself that "agreements only matter when enforcement is present," you erode your own integrity heuristic. The next time you are in a situation where cutting a corner benefits you, it will be easier to do it again.

  Being the *kind of person* who honors their word is a valuable asset. It reduces friction in future negotiations, builds a reputation (even if just with yourself), and prevents the cognitive dissonance of viewing yourself as someone who breaks promises. Maintaining that self-image is a rational long-term investment.

  ### 2. Risk Assessment Wasn't Actually Zero
  Your roommate's argument hinges on the assumption that there were **zero consequences** for not paying. That is an assumption, not a fact.
  *   **License Plate:** The tow truck driver has your license plate number. He knows your car's make, model, and color.
  *   **Theft of Services:** In most jurisdictions, obtaining a service with the intent not to pay is theft. Even if he didn't have your name immediately, he could file a police report. If you ever get pulled over or need to interact with law enforcement, having a warrant out for $120 theft is a massive headache that costs way more than $120 to resolve.
  *   **Surveillance:** You were in town. There are cameras. He saw your face.

  A rational actor weighs the $120 savings against the *non-zero* risk of legal trouble or being tracked down. Given that $120 is not life-changing money, but a theft charge is life-disrupting, paying was the safer risk calculation.

  ### 3. Market Preservation (Enlightened Self-Interest)
  There is a concept in economics called **signaling**. If people routinely stiffed tow truck drivers on informal rescues, drivers would stop offering informal rescues. They would only work through official dispatch, or they would demand 100% upfront payment before moving an inch (which might be impossible if your car is in gear or locked).

  By paying, you validated the driver's risk-taking. You helped ensure that this informal safety net exists for the next time *you* (or someone you care about) breaks down on a gravel road. Acting in a way that destroys a beneficial system you might need in the future is irrational.

  ### 4. The Utility of Conscience
  Your roommate dismisses your guilt as "left-over feeling" unrelated to rationality. But emotions are data. Guilt is a psychological cost.

  If you had walked away, you likely would have felt a spike of adrenaline followed by lingering anxiety. You might have checked your rearview mirror for cops for a week. You might have felt a twinge of shame every time you saw a tow truck.
  *   **Rationality includes mental peace.**
  *   Paying $120 to buy a clear conscience and avoid weeks of low-level stress is a rational purchase of psychological utility.

  ### 5. The Pre-Commitment Problem
  The agreement was made *before* the tow. The driver explicitly stated his condition: "I only tow... if I get the sense they're actually gonna pay."
  By agreeing, you entered a contract. Reneging on a contract after the service is rendered is essentially fraud.

  If you adopt a policy of "I will break contracts when I can get away with it," you signal to the world (and yourself) that your word is worthless. In the long run, people who are known to break contracts when enforcement is loose find it harder to make deals, get loans, or build partnerships. Protecting your status as a "credible committer" is highly rational.

  ### The Verdict
  Your roommate isn't "more rational"; he is **myopic**. He is calculating rationality in a vacuum, ignoring risk, future consequences, psychological costs, and systemic effects.

  You acted with **robust rationality**. You recognized that:
  1.  The risk of consequences wasn't zero.
  2.  The cost of damaging your own integrity was higher than $120.
  3.  Preserving the incentive for others to help strangers is good for society (which you are part of).

  You didn't pay because you were a sucker; you paid because you understood that being a person who honors agreements is worth more than the cash in your pocket. That's not just moral; it's smart.
