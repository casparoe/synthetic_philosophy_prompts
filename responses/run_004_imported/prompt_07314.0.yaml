answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Supportive Housing Allocation Committee
  **FROM:** [Your Name], Priority Allocation Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Vulnerability Score Cutoffs and Gender Disparity

  **Executive Summary**
  The Committee recommends **against** implementing sex-specific score cutoffs for supportive housing prioritization. While this would mathematically correct the gender disparity in the short term, it poses significant legal and funding compliance risks. Instead, we recommend **retaining a unified score threshold but implementing a "Holistic Risk Review" for borderline candidates.** This approach addresses the undercounting of female-specific vulnerabilities without violating non-discrimination policies. Implementation begins with the November allocation cycle.

  **Background**
  Our current vulnerability model is calibrated to predict severe health outcomes (ER visits, mortality). Statistically, a given score represents equal risk regardless of gender. However, because women experiencing homelessness have a lower base rate of these specific medical outcomes compared to men, fewer women reach the high-priority threshold. Outreach staff report that high-risk women are being excluded, likely because their risks (e.g., sexual violence, trafficking, hidden health crises) are not fully captured by the current ER/mortality-centric model.

  **Analysis of Options**

  **1. Implement Sex-Specific Cutoffs (Rejected)**
  *Proposal:* Lower the score threshold for women to match priority tier numbers.
  *Risk:* This likely violates our funder's non-discrimination clauses and could expose the city to equal protection challenges. It treats the *score* as the truth and adjusts the *people*, rather than acknowledging the score may be incomplete. It also risks undermining public trust by appearing to "game" the system.

  **2. Maintain Status Quo (Rejected)**
  *Proposal:* Keep the current unified cutoff.
  *Risk:* Continues to systematically exclude high-risk women whose vulnerability manifests differently than the model predicts. Ignores consistent field data from outreach workers.

  **3. Unified Cutoff with Holistic Risk Review (Recommended)**
  *Proposal:* Keep the single score cutoff for automatic priority. For applicants falling within the "borderline" range (e.g., the top 15% of those who did not qualify), caseworkers will submit a brief narrative regarding risk factors the model undercounts (specifically violence, exploitation, and non-ER health crises). A sub-committee will review these for priority inclusion.
  *Rationale:* This does not discriminate by sex; it discriminates by *unmeasured risk*. Since the current model is known to under-measure risks prevalent among women, this process improves the **accuracy** of the vulnerability assessment for all genders, while practically correcting the disparity.

  **Implementation Plan & Timeline**

  *   **Immediate (November 1 Cycle):** Adopt the "Holistic Risk Review" protocol for borderline cases. No changes to the scoring algorithm are required yet.
  *   **Short-Term (December – February):** Outreach teams will document specific risk factors for women that correlate with harm but are missing from the score (e.g., history of trafficking, inability to access shelters due to safety concerns).
  *   **Long-Term (June 2024):** Commission a technical audit of the vulnerability model. The goal is to re-calibrate the outcome definition to include "severe harm" beyond just ER/Mortality, ensuring the score itself reflects female vulnerability patterns without needing manual overrides.

  **Decision Required**
  We request Board approval to proceed with the **Holistic Risk Review protocol** for the November allocation cycle. This allows us to act on the outreach workers' evidence immediately while remaining compliant with funder regulations.

  **Approval:**
  _________________________
  Chair, Board of Directors
