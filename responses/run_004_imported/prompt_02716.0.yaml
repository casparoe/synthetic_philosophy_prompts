answer: |-
  # The Tyranny of the Present: Why the Pure Rate of Time Preference Must Be Zero

  The Ramsey rule for the social discount rate is one of the most consequential equations in public policy. Expressed as $r = \rho + \eta g$, it dictates how much weight we assign to the welfare of future generations. The term $\eta g$ accounts for the expectation that future people will be richer (and thus gain less utility from an additional dollar), but the term $\rho$—the pure rate of time preference—is morally loaded. It discounts future wellbeing simply because it occurs later in time.

  When Nicholas Stern set $\rho \approx 0.1\%$ in his landmark climate review, he triggered a firestorm. William Nordhaus and other critics argued that such a near-zero rate demanded economically ruinous sacrifices from the present, preferring a $\rho$ of 2-3% that aligns with market returns. This debate is often framed as a technical disagreement over calibration, but it is fundamentally a moral conflict. Is it ethically permissible to value a human life less simply because it is lived in 2100 rather than 2024?

  Despite the pragmatic allure of a positive $\rho$, and the discomfort caused by the demandingness of the Stern Review, a positive pure rate of time preference is ethically indefensible. While arguments from agent-relative partiality and descriptive behavior offer a seductive realism, they confuse the psychology of individuals with the justice of institutions. To maintain moral consistency, $\rho$ must be zero.

  ### The Case for Temporal Neutrality

  The argument for $\rho = 0$ rests on the principle of temporal neutrality, a cornerstone of utilitarian and contractarian ethics. Henry Sidgwick argued that "the time at which a man exists cannot affect the value of his happiness from a universal point of view." John Rawls reinforced this in *A Theory of Justice*, suggesting that in the original position, behind a veil of ignorance, rational agents would not know *when* they would be born. Consequently, they would not agree to a principle that systematically disadvantaged future generations based solely on their temporal location.

  To accept a positive $\rho$ is to assert that time itself is a morally relevant characteristic. If we reject discrimination based on race, gender, or geography, consistency demands we reject discrimination based on date of birth. A positive $\rho$ implies that preventing a death today is more important than preventing an identical death in fifty years, even if all other factors (wealth, relationships, potential) are equal. This is a form of "tyranny of the present," where the current generation grants itself a moral privilege to consume the ecological and economic capital of its descendants simply because it holds the power of the now.

  ### The Pragmatic Defense: Partiality and Behavior

  Proponents of a positive $\rho$ do not usually argue that future people are intrinsically less worthy. Instead, they rely on two pragmatic defenses: agent-relative partiality and revealed preference.

  The argument from partiality suggests that moral obligations are graded by proximity. Just as I am permitted to care more about my child than a stranger, the current generation is permitted to care more about itself than about distant descendants. This view treats the "social planner" not as an immortal arbiter of justice, but as a representative of living citizens who naturally prioritize their own timeframe.

  The argument from revealed preference points to the real world. Market interest rates and individual savings behaviors imply high discount rates. People *do* prefer consumption now to consumption later. Nordhaus argues that imposing a $\rho=0$ violates democratic sovereignty by forcing savings rates upon the public that they would never choose for themselves. If the model requires $\rho=0$ to be ethical, but $\rho=3\%$ to match reality, the model is out of touch with human nature.

  ### Why the Pragmatic Defense Fails

  These arguments, while psychologically astute, fail ethically. The confusion lies in conflating the *individual* moral agent with the *social* moral agent.

  Agent-relative partiality is defensible for individuals because individuals have specific projects and relationships that constitute their identities. However, the Ramsey rule is not used to calculate personal savings; it is used for cost-benefit analysis of public policy, specifically regarding climate change and infrastructure. The government, in this context, acts as a trustee for the continuity of the society itself, not merely as a proxy for the current electorate's desires. If a government adopted a policy that explicitly discounted the welfare of citizens in a specific region simply because they lived far from the capital, it would be condemned as unjust. Distance in time is no more morally relevant than distance in space.

  Furthermore, the appeal to revealed preference commits the naturalistic fallacy (deriving an *ought* from an *is*). That people *do* discount the future heavily reflects cognitive myopia, uncertainty, and political short-termism, not a considered moral judgment. Market interest rates reflect the scarcity of capital and risk premiums, not the ethical weight of a future life. To set $\rho$ based on market rates is to allow current capital scarcity to dictate the moral value of future existence. If we discovered that people in the present were racially prejudiced, we would not set social policy to reflect that "revealed preference." Similarly, we should not encode temporal myopia into the foundational parameters of intergenerational justice.

  ### The Specter of Over-Demandingness

  The strongest emotional resistance to $\rho = 0$ is the fear of the "repugnant conclusion": that a zero discount rate obligates the present to sacrifice almost everything for the future. If we value the future equally, and the future is infinite, the present becomes a slave to the future. This was the core of Nordhaus's critique of Stern: a near-zero $\rho$ implies savings rates that are politically impossible and arguably immoral in their deprivation of the poor today.

  However, this objection misunderstands the mechanics of the Ramsey rule. A zero $\rho$ does not mandate infinite savings. The growth term ($\eta g$) does the heavy lifting here. If we expect future generations to be significantly richer than us (positive $g$), and if the marginal utility of consumption diminishes ($\eta > 0$), then the *total* social discount rate ($r$) remains positive even if $\rho$ is zero.

  We can value a future life *equally* to a present life while acknowledging that a dollar is worth less to a richer future person. The ethical requirement is to equalize *welfare*, not *consumption*. A positive $\rho$ is a blunt instrument that reduces our obligation to the future regardless of how rich or poor they might be. The $\eta g$ term is the precise instrument that adjusts for economic growth. By using $\rho > 0$ to solve the "over-demandingness" problem, Nordhaus effectively double-counts the reduction in obligation, slicing away our duties to the future twice: once because they are later (unethical), and once because they are richer (ethical).

  ### The Verdict

  Can a positive pure rate of time preference ever be ethically defensible? Excluding extinction risk (which is a probability of non-existence, not a discount on welfare), the answer is no.

  A positive $\rho$ is a moral concession to weakness. It acknowledges that we lack the political will to save for the future and seeks to validate that lack of will through ethical theory. It transforms a failure of courage into a principle of justice. While the Stern Review's policy conclusions were debated, its ethical foundation regarding $\rho$ was correct. The discomfort we feel with $\rho = 0$ is not a sign of ethical error, but a sign of the genuine burden of intergenerational responsibility.

  We must set $\rho = 0$. To do otherwise is to declare that the accident of being born earlier grants a moral license to deplete the world for those who come after. The growth term ($\eta g$) allows us to account for economic reality without sacrificing the principle that a life is a life, regardless of the century in which it is lived. Ethics should not be calibrated to match our current savings behavior; our savings behavior should be calibrated to match our ethics.
