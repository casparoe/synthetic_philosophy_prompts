  A metaethicist is having a quiet dinner with his wife when she puts down her fork and asks, "Be honest. Do you love me for *me*, or for the tax benefits?"

  The husband sighs. "Well, the tax benefits are a *state-given* reason. They make having the attitude of love prudent, but they don't make you a fitting object of love."

  "So," she says, "you're saying there are no *object-given* reasons? You don't love me for my qualities?"

  "Strictly speaking? No. In the classic thought experiment, the evil demon threatens you unless you value a saucer of mud. The threat is the state-given reason; the mud is the object. In this marriage, darling, you're the mud. The IRS is the demon."

  She stares at him for a long moment, then picks up her phone. "Well, I have a reason to file for divorce."

  "Is that a state-given reason?" he asks hopefully. "Like loneliness avoidance?"

  "No," she says, dialing. "That's an *object-given* reason. Because you're a saucer of mud."

  He watches her dial for a moment, then nods solemnly. "Finally. An attitude that fits."
