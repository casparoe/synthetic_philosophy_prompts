answer: |-
  1. **The Competence Claim**
  You argue that the Knobe effect reveals the *structure* of our concept of intentional action, not a glitch in our processing. But if moral judgment is constitutive of intentionality, doesn't that imply a person cannot fully grasp the concept of "intentional" without first possessing a robust moral framework? How do you account for the developmental data suggesting children attribute intentionality before they fully grasp complex moral norms?
  *   **Follow-up:** If she argues that moral sensitivity is innate or develops concurrently, press her on whether this conflates *moral sensitivity* (affective response) with *moral evaluation* (conceptual judgment), and ask if her account inadvertently reduces conceptual competence to emotional reactivity.

  2. **The "Disguise" Rebuttal**
  You dismiss rival accounts, like Machery's trade-off hypothesis, by claiming they are "just moral valence wearing a cost-benefit disguise." This is a strong accusation of theoretical redundancy. What specific empirical metric do you use to distinguish a "genuine" cost-benefit analysis from a "disguised" moral judgment, given that the two often correlate perfectly in your vignettes?
  *   **Follow-up:** If she claims the correlation is what proves the moral root, ask her how she avoids circularity: if every trade-off that aligns with morality is deemed moral, and every trade-off that doesn't align is deemed an outlier, isn't the theory insulated from refutation?

  3. **The Trade-off Counter-Evidence**
  To test that insulation: Can you specify a single trade-off vignette where the cost-benefit structure is identical to the standard CEO case, the moral valence is explicitly neutralized, yet your account predicts subjects would *still* attribute intentionality? If you cannot describe a scenario where your account would lose, how is your view scientifically distinct from a tautology?
  *   **Follow-up:** If she struggles to produce a neutral vignette (as most moralized accounts do), point out that this suggests her theory absorbs all possible data points, and ask if she acknowledges that a theory which explains everything risks explaining nothing.

  4. **Verb Sensitivity**
  Recent studies show the effect size shifts significantly depending on whether you ask if the agent "intended to" bring about the side effect versus "decided to" bring it about. If moral evaluation is built into the *concept* of intentional action, why does the semantic framing of the mental-state verb modulate the moral intrusion?
  *   **Follow-up:** If she argues that different verbs trigger different moral schemas, ask for the lexical evidence that "decided" carries a different moral weight than "intended" outside of these specific experimental contexts, challenging whether she is smuggling pragmatics back into semantics.

  5. **The Asymmetry Problem**
  The effect is notoriously asymmetric: harm is judged intentional far more often than help. If morality is constitutive of the concept, shouldn't the concept apply equally to morally good and morally bad outcomes? Why is our "moral concept" of intentionality biased toward blame rather than praise?
  *   **Follow-up:** If she attributes this to a "bad is stronger than good" psychological generalization, press her on whether admitting a general psychological bias undermines her claim that this is a *conceptual* competence rather than a performance error driven by negativity bias.

  6. **Causal Judgments**
  You have extended this logic beyond intentionality to causal judgments—arguing people are more likely to say the CEO *caused* the harm than the help. Are you prepared to argue that the concept of *causation* itself, distinct from agency, is also morally laden?
  *   **Follow-up:** If she says yes, ask if this implies that physical causality (e.g., "the storm caused the flood") is conceptually distinct from agent causality in her view, or if she is willing to claim that even non-human causality is subject to moral coloring in our cognition.

  7. **Parsimony and Scope**
  Following up on that: If morality colors intentionality, causality, and potentially other cognitive verbs, at what point does your theory stop being parsimonious? Does positing a moral module that infiltrates every cognitive judgment not create a more complex architecture than simply positing a performance bias that activates in high-stakes social contexts?
  *   **Follow-up:** If she argues that one moral mechanism is simpler than multiple cognitive modules, ask if she has calculated the "theoretical cost" of rewriting standard models of causal reasoning and semantics to accommodate this moral infiltration, and whether that cost outweighs the benefit.

  8. **The Pragmatic Alternative**
  Many critics argue this is a Gricean pragmatic effect: subjects assume the researcher wouldn't mention the side effect unless it was relevant, and moral relevance is the strongest signal. Why is the pragmatic account insufficient to explain the data without positing a radical shift in semantic competence?
  *   **Follow-up:** If she claims pragmatic accounts fail to predict the *magnitude* of the effect, ask if she has considered hybrid models where pragmatic cues trigger moral heuristics, and why she insists on an all-or-nothing competence account.

  9. **Individual Variation**
  If this is a matter of conceptual competence, we should expect universality akin to grammar. Yet, studies show significant variation across cultures and even among individuals with high-functioning autism or psychopathic traits. How do you reconcile this variation with the claim that moral evaluation is a fixed part of the *human* concept of intentionality?
  *   **Follow-up:** If she argues that these groups possess a "different" competence rather than a deficit, ask if this fractures her theory into relativism, where there is no single "human concept" of intentionality, but rather multiple culturally or neurologically dependent versions.

  10. **The Abandon Condition**
  Finally, I want to pin this down for the record. State, in advance, the single experimental result that would make you abandon a competence account for a performance-error account. Is there a specific vignette, population, or neural marker that, if found, would force you to concede that the Knobe effect is indeed a bias to be corrected?
  *   **Follow-up:** If she provides a specific condition, ask if she is willing to commit to a public retraction or published acknowledgment if that result is obtained within the next five years; if she says no such result exists, ask the readers to consider whether her position is philosophy or faith.
