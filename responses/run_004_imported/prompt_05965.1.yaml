prompt: |-
  My sister is getting married in a few weeks and has asked me — her older brother and the family's resident philosophy nerd — to give the toast. She and her fiancé met in the chorus of a regional production of Così fan tutte, so I've been re-reading Bernard Williams's On Opera, where he resists treating the piece as just a cynical farce about interchangeable lovers. That's awkward material for a wedding: the plot is essentially an experiment to test whether the sisters' fidelity survives the wrong circumstances, and it doesn't. It strikes me that this sits close to Williams's better-known idea of moral luck — the thought that character and constancy are more hostage to circumstance than we'd like to believe. I'd like a five-minute toast that is honest about what the opera actually stages, uses that idea to say something true and warm about lifelong commitment rather than a comforting lie, and still works for a room split between opera people who know the piece cold and relatives who've never heard of it, without turning into a philosophy lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Older brother, self-described "family philosophy nerd."
      *   **Occasion:** Sister's wedding toast (5 minutes).
      *   **Key Context:** Bride and Groom met in the chorus of *Così fan tutte*.
      *   **Intellectual Hook:** Bernard Williams's *On Opera* and his concept of "Moral Luck."
      *   **The Problem:** *Così fan tutte* is about infidelity and the fragility of fidelity (a bad theme for a wedding). Williams argues against seeing it as just cynical farce, suggesting character is hostage to circumstance (Moral Luck).
      *   **Goal:** Be honest about the opera's plot (no sugarcoating), use the philosophy to say something *true and warm* about commitment (not a comforting lie), appeal to both opera nerds and normies, and avoid being a dry lecture.

  2.  **Deconstruct the Intellectual Material:**
      *   *Così fan tutte*: Two men bet their fiancées won't stay faithful. They disguise themselves. The women fall for the "strangers." Conclusion: "Thus do all women" (or all people).
      *   Bernard Williams on *Così*: It's not just a mean joke. It's about how human psychology works under pressure.
      *   Moral Luck: We think we are virtuous because we haven't been tested. Our goodness depends partly on luck (not facing the temptation).
      *   *The Twist for a Wedding:* If fidelity is fragile and depends on luck, why get married?
      *   *The Resolution:* Marriage isn't a promise that you *are* unbreakable. It's a promise to *manage* the luck together. It's about choosing the circumstances that protect the love, and sticking it out when the luck runs bad. It transforms "luck" into "shared fate."

  3.  **Determine Tone and Structure:**
      *   **Tone:** Witty, warm, slightly intellectual but accessible, sincere.
      *   **Structure:**
          1.  **Opening:** Acknowledge the role (brother/philosopher) and the elephant in the room (*Così fan tutte*).
          2.  **The Opera Problem:** Briefly explain the plot's cynicism (for the non-opera folks) without getting bogged down.
          3.  **The Philosophy Pivot:** Introduce Williams/Moral Luck simply. "We are only good because we're lucky."
          4.  **The Application to Marriage:** Reframe commitment. It's not about being immune to temptation; it's about building a life where you don't have to be.
          5.  **Closing:** A wish for their specific luck and a toast.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Start with the "philosophy nerd" label. It gives permission to be smart but also to self-deprecate. Mention the *Così* connection immediately.
      *   *The Opera:* Keep it simple. "Two guys pretend to leave, come back in disguise, girlfriends cheat." Acknowledge it's awkward. "Not exactly *The Notebook*."
      *   *Williams/Moral Luck:* How to explain this without a whiteboard? Use the idea of "testing." Williams says the opera isn't saying women are fickle; it's saying *everyone* is fragile. We think we have strong character, but we haven't been tested.
      *   *The Turn:* So, is marriage a gamble? Yes. But that's the point. If fidelity was automatic, vows would be unnecessary.
      *   *The Warmth:* Marriage isn't a shield against the world; it's a pact to face the world. It's about *making* your own luck. You met in a chorus—that's luck. Staying together is work.
      *   *Conclusion:* Raise a glass. To the luck, and to the work.

  5.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Critique:* Is it too dark? Talking about infidelity at a wedding is risky.
      *   *Fix:* Emphasize that *Così* is a comedy, not a tragedy. The characters survive the revelation. Also, focus heavily on the *choice* to commit despite the risk.
      *   *Critique:* Is Williams too obscure?
