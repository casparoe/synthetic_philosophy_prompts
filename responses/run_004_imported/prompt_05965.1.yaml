answer: |-
  Good evening, everyone. For those who don't know me, I'm the older brother. I'm also the family's resident philosophy nerd, which is a polite way of saying I'm the guy who reads the footnotes for fun. So, when [Sister's Name] asked me to give this toast, I knew I had a specific lane to stay in. I can't do sentimental without overthinking it, and she knows that.

  Now, we have to address the elephant in the room. Or rather, the opera in the room. [Sister] and [Partner] met in the chorus of *Così fan tutte*. For the opera lovers here, you know the stakes. For everyone else: *Così* is not exactly *The Notebook*. It's a story where two men make a bet that their fiancées will remain faithful. To test this, the men pretend to leave, return in disguise, seduce each other's partners, and… well, the partners fall for the disguises. The title translates to "Thus Do All Women," though we like to pretend it means "Thus Do All People."

  It is, on paper, a terrible metaphor for a wedding. It's a story about fidelity failing a test.

  But I've been re-reading the philosopher Bernard Williams, specifically his writing on this opera. He argues that we shouldn't see *Così* as a cynical joke about how everyone cheats. Instead, he suggests it's a profound observation about human nature. Williams is famous for the idea of "moral luck." The theory is basically this: We like to think our character is solid, that we are good people because we choose to be. But often, we are only "good" because we haven't been unlucky enough to face a temptation we can't resist. We are faithful because the storm hasn't hit. We are honest because no one offered us enough money to lie.

  In *Così*, the storm is manufactured. The characters discover that their constancy was, in part, a matter of luck. They hadn't been tested. And when they are tested, they break.

  So, you might ask, why on earth would I bring this up at a wedding? Why start a marriage by admitting that fidelity is fragile and that character is hostage to circumstance?

  Because I think that is actually the most honest foundation for a vow there is.

  If love were a force of nature that couldn't be shaken, you wouldn't need a wedding. You wouldn't need vows. You'd just need gravity. But we know that feelings fluctuate. We know that people change. We know, as Williams points out, that we are all vulnerable to the luck of the draw.

  Marriage, to me, isn't a promise that you are immune to that luck. It's not a claim that you will never look at someone else, or never feel a moment of doubt, or never face a circumstance that makes staying together difficult.

  Marriage is the agreement to stop relying on luck.

  [Couple's Names], you met in a chorus. That was luck. A wonderful, happy accident of timing and geography. But staying together? That is the work. The insight of *Così*, and of Williams, is that we cannot control the world. We cannot control the circumstances that will test us. Illness, distance, stress, time—these are the disguises that life wears to test our commitment.

  But you can control the pact.

  A strong marriage isn't two perfect people who never get tempted. It's two people who acknowledge that the world is full of moral luck, and they decide to build a shelter against it together. It is looking at the fragility of human nature and saying, "I know the storm might come. I know we might change. But I am choosing to build a life where we protect what we have, not because it's easy, but because we decided to."

  [Sister], [Partner], the opera ends with the couples re-pairing, wiser and a bit bruised, ready to move forward. They survive the truth. That is my wish for you. Not that you will never face a test, but that when the disguises of life appear—when the luck runs hot or cold—you will recognize each other underneath them.

  Don't trust in luck. Trust in the choice you're making today to limit your luck, to bind your fortunes together so that you don't have to face the circumstances alone.

  So, if everyone could raise a glass.

  To [Sister] and [Partner]. May your love be not just a feeling that happens to you, but a thing you build. May you be wise enough to know the world is uncertain, and brave enough to commit to it anyway.

  To the bride and groom.
