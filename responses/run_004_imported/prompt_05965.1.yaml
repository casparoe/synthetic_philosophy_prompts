      *   *Audience Check:* Make sure the non-opera people don't feel lost. Explain "Così" as "a story about testing love."

  6.  **Final Review against Constraints:**
      *   5 minutes? (Approx. 700-800 words spoken at a moderate pace).
      *   Honest about opera? Yes.
      *   Warm/True about commitment? Yes (focus on active choosing).
      *   Not a lecture? Keep the jargon minimal.

  7.  **Final Polish:** (Writing the actual speech based on these thoughts.) *Make sure to include a specific nod to the chorus connection—that's where their luck started.*

