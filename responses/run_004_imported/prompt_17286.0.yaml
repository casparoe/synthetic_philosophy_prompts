      *   **Gödel's Incompleteness Theorems:** Shows that in any sufficiently complex formal system, there are true statements that cannot be proven within the system. This attacks the idea of a complete, self-contained deductive system.

  4.  **Evaluate the Impact on Hobbes:**
      *   *Would it wreck his "geometry = certainty" idea?*
