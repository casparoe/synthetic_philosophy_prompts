answer: |-
  This is a fantastic question. You have hit on exactly the right nerve in Hobbes's philosophy. Most people remember him for the "nasty, brutish, and short" line, but you've identified his real obsession: **epistemological certainty.**

  You are absolutely right about the Wallis feud. It was incredibly petty. Hobbes published *De Corpore* claiming to have squared the circle; Wallis (the Savilian Professor of Geometry at Oxford) politely pointed out the error; Hobbes accused Wallis of being a drunk priest who didn't understand logic; Wallis published a pamphlet titled *Hobbius Heauton-Timorumenos* ("Hobbes, the Self-Tormentor"); and they went back and forth for decades until Hobbes died at 91, still convinced he was right.

  But your insight into *why* he cared is the key to answering your question. Hobbes wasn't trying to be a mathematician for the sake of math. He was trying to secure a foundation for his political philosophy. He believed that because humans *construct* geometric figures (we define the circle, we draw the line), we can have certain knowledge of their consequences. He wanted to do the same with the Commonwealth: since humans *construct* the state via contract, we should be able to have certain knowledge of its properties, just like a triangle.

  So, if we drop Non-Euclidean geometry and Gödel's Incompleteness Theorems on his desk, does the *Leviathan* collapse?

  Here is the argument for why **Non-Euclidean geometry would actually make Hobbes happier, but Gödel would force him into a corner that he would likely try to bully his way out of.**

  ### 1. Non-Euclidean Geometry: A Victory for Hobbes?
  You might think that discovering geometries where parallel lines *do* meet would wreck Hobbes's faith in Euclid. I argue the opposite. It would validate his core epistemological claim.

  Hobbes was a **nominalist** and a **constructivist**. He didn't believe "triangles" existed in the sky waiting to be discovered. He believed "triangle" was a name we assigned to a concept we constructed in our minds. For Hobbes, the certainty of geometry comes from the fact that **we lay down the definitions.**

  *   **The Euclidean Shock:** Before the 19th century, people thought Euclidean geometry was the *only* truth about physical space. If Hobbes thought that, Non-Euclidean geometry would hurt him.
  *   **The Hobbesian Reality:** But Hobbes didn't care about physical space as much as he cared about the *reasoning process*. Non-Euclidean geometry proves that you can change the axioms (the definitions) and still have a consistent, certain system.

  If you showed this to Hobbes, he would likely slam the table and say, *"Exactly! Truth is not about matching the world; it is about the consistency of the consequences of our names."*

  Non-Euclidean geometry demonstrates that the "truth" of a geometric system is internal to its axioms. This aligns perfectly with Hobbes's political theory. He doesn't claim the Commonwealth is "natural"; he claims it is *artificial*. We choose the axioms (the Social Contract), and therefore we can know the consequences (the Laws). The existence of multiple valid geometries just proves that **authority lies in the choice of axioms.** In politics, who chooses the axioms? The Sovereign. So, ironically, Non-Euclidean geometry strengthens his argument for absolute sovereignty.

  ### 2. Gödel's Incompleteness Theorems: The Real Threat
  Gödel is where it gets dangerous for Hobbes.

  For those unfamiliar, Gödel essentially proved that in any formal system complex enough to do basic arithmetic, there will be statements that are **true but unprovable** within that system. You cannot have a system that is both *complete* (can prove everything true) and *consistent* (never proves anything false).

  Hobbes wanted a political science that was **complete**. He wanted to derive every necessary law and duty from his first principles of human nature. He wanted a system where, if you followed the logic, there would be no ambiguity about who should rule or what is right.

  **Why this hurts Hobbes:**
  1.  **The Limit of Deduction:** Hobbes believed that if you set up your definitions correctly (Human Nature + State of Nature), the conclusion (The Leviathan) follows necessarily. Gödel suggests that no matter how good your definitions are, there will always be "truths" about the system that you cannot derive from the rules.
  2.  **Ambiguity:** In politics, an "unprovable truth" is a civil war waiting to happen. If the Law (the system) cannot determine the outcome of a dispute (the unprovable statement), you are back in the State of Nature.

  **How Hobbes Would Try to Survive:**
  Hobbes was notoriously stubborn (see: Wallis feud). He would not accept defeat. He would likely use two counter-arguments:

  *   **Argument A: Politics isn't Arithmetic.** Gödel's theorem applies to formal systems capable of encoding arithmetic. Hobbes could argue that civil philosophy is not a number game. It is a science of "consequences of names." He might claim that the "incompleteness" only applies to abstract math, not to the physical realities of power and fear.
  *   **Argument B: The Sovereign as the "Oracle."** This is the cleverest way he could rework his logic. If the system (the written Law) is incomplete and cannot decide a case, Hobbes has a built-in escape hatch: **The Sovereign.**

  In *Leviathan*, Hobbes explicitly states that the Sovereign is the interpreter of the laws. If the law is silent or ambiguous (i.e., "incomplete"), the Sovereign's will *becomes* the truth. Hobbes could argue that Gödel just proves why we need an absolute monarch. Since no written system can be complete, you need a human authority to step in and declare the "unprovable truths" to be law by fiat.

  In this reading, Gödel doesn't wreck his political science; it just proves that **legal positivism** (law is what the sovereign says) is mathematically necessary.

  ### 3. The Weakest Link: "Science of Politics"
  While Hobbes could salvage his epistemology, the claim that politics can be *as certain as geometry* is the part that would actually crumble.

  Geometry deals with static figures. Politics deals with human passions, which Hobbes admitted were in constant motion.
  *   **In Geometry:** You define a circle, it stays a circle.
  *   **In Politics:** You define a "right," and humans immediately try to stretch it.

  Gödel implies that complexity breeds uncertainty. Human society is vastly more complex than arithmetic. If arithmetic is incomplete, a society of 7 billion humans is exponentially more so.

  Hobbes would likely have to retreat from "Politics is a certain science" to "Politics is a **constructive** science." He would have to admit that the certainty doesn't come from the *logic* itself, but from the **power enforcing the logic.**

  He would say: *"Geometry is certain because no one can disobey the lines. Politics is certain only because the Sword makes it so."*

  ### The Verdict
  If you brought Hobbes to 2024:

  1.  **Would Non-Euclidean geometry wreck him?** No. It would convince him that his "constructivist" view of truth was right all along. Truth is internal to the system we build.
  2.  **Would Gödel wreck him?** It would wound him, but he would patch the hole with the Sovereign. He would argue that incompleteness proves the necessity of absolute authority to resolve undecidable propositions.
  3.  **Would his Political Science survive?** It would survive, but it would change. He would have to admit that political certainty isn't *logical* certainty (like 2+2=4); it is *enforced* certainty.

  **The Irony:**
  The ultimate joke is on John Wallis. Hobbes was wrong about squaring the circle. But his intuition that **mathematics is about the rules we choose, not the world we find** was arguably more profound than he realized.

  However, his belief that he could replicate that certainty in politics fails not because of the math, but because of the material. In geometry, the definitions obey you. In politics, the "definitions" (the people) have their own passions. Hobbes spent 20 years fighting Wallis because he couldn't accept that the world (mathematical truth) existed independently of his definitions.

  Gödel proves the world *does* exist independently of the system. Hobbes would hate that. He would probably write a pamphlet claiming Gödel was a Platonist spy trying to undermine the Sovereign.

  So, to answer your question: **It wouldn't wreck his system, but it would force him to admit that the "certainty" of the Leviathan doesn't come from Geometry, it comes from the Gun.** And honestly, looking at *Leviathan*, he might have been okay with that conclusion anyway.
