answer: |-
  Good afternoon. For those who don't know me, I'm [Name], and I have the honor of officiating today.

  Looking out at this room, we see two distinct communities coming together. On one side, a family grounded in the Catholic faith, where marriage is a sacrament and a covenant before God. On the other, a family grounded in a secular tradition, where marriage is a moral commitment between equals.

  Usually, a wedding ceremony tries to blend these into a single story. It tries to find a common language that explains *why* this marriage matters in a way that satisfies everyone's ultimate truths. But [Couple Names] have asked us not to do that. They believe that pretending we share a single metaphysical foundation would be dishonest to both traditions.

  So, instead, this ceremony is built on a different idea. We are not here to merge your comprehensive views of the world. We are not here to agree on the ultimate source of love's authority. Whether you believe that authority comes from Grace, or from Reason, or from Human Dignity, you are welcome here exactly as you are.

  What we are building today is what political philosophers call an *overlapping consensus*. We are agreeing on the *terms* of this life together, without demanding agreement on the *reasons* for those terms. This marriage is a shared public framework—a structure of care, obligation, and promise—that is strong enough to hold the weight of your different private faiths.

  To the Catholic family: You see a sacred covenant here.
  To the secular family: You see a profound human commitment.
  You do not have to choose between those visions for this marriage to hold. In fact, the marriage relies on you *keeping* those distinct visions, while standing together on this common ground.

  [Couple Names] are not asking you to convert to a new religion of "Marriage." They are asking you to witness a promise that is political in the deepest sense: a agreement to live together justly and lovingly, despite—and indeed because of—the different truths you hold.

  So, as we begin, know that you are not being asked to leave your worldview at the door. You are being asked to bring it, and to let it support the promise we are about to make.

  Let us begin.
