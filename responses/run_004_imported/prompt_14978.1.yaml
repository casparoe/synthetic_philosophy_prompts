answer: |-
  Your intuition is sharp, and your friend is right to point you toward the economic literature. The connection between Inverse Reinforcement Learning (IRL) and Revealed Preference Theory (RPT) is not merely analogous; it is genealogical. IRL is, in essence, revealed preference theory ported from the static, discrete choice environments of mid-20th-century microeconomics into the sequential, probabilistic, high-dimensional state spaces of modern control theory.

  To answer your core question: **IRL does not escape the philosophical and identification objections that dog revealed preference theory.** It is, at bottom, in the same boat. However, it is a *more seaworthy* boat. It offers significant engineering progress in handling noise and complexity, but it makes no epistemic progress on the fundamental problem of normativity—the leap from "what is chosen" to "what is good."

  Here is the defense of that verdict.

  ### 1. The Structural Isomorphism
  At the formal level, the mapping is direct.
  *   **RPT:** Observes choices $x$ from a budget set $B$. Assumes $x = \arg\max_{y \in B} U(y)$. Infers $U$.
  *   **IRL:** Observes trajectories $\xi$ from an MDP. Assumes $\xi \approx \arg\max_{\xi'} \mathbb{E}[\sum R(s,a)]$. Infers $R$.

  Both projects rely on the **Principle of Rationality**: the assumption that the observed behavior is the output of an optimization process. Both face the same **Underdetermination Problem**: for any finite set of behaviors, there are infinite reward functions (or preference orderings) that could have generated them.

  In economics, WARP (Weak Axiom of Revealed Preference) is the consistency check. If you choose A over B today, you shouldn't choose B over A tomorrow given the same budget. If you violate WARP, RPT says you have no coherent preference function. In IRL, the Armstrong and Mindermann result is the rigorous computational analogue: behavior alone cannot distinguish between a rational agent maximizing $R$ and an anti-rational agent minimizing $R$ (or a random agent, or an agent maximizing $R$ with a specific cognitive bias).

  ### 2. Where IRL Buys Epistemic Progress
  IRL is not *just* RPT dressed up; it introduces technical apparatus that solves specific *descriptive* failures of classical RPT.

  **A. From Hard Constraints to Likelihoods**
  Classical RPT is brittle. A single violation of WARP renders the preference ordering undefined. Humans, however, are not perfectly consistent. IRL's introduction of probabilistic rationality (e.g., Boltzmann rationality in Maximum Entropy IRL) is a genuine advance. It treats deviations from optimality as noise rather than falsification.
  *   *Epistemic Gain:* This allows us to recover a "central tendency" of reward even from noisy data. It acknowledges that behavior is a stochastic signal of intent, not a deterministic proof.
  *   *Limit:* This handles *measurement error*, not *structural ambiguity*. It tells us which $R$ is *most likely* given the assumption of rationality, but it cannot validate the assumption of rationality itself.

  **B. Sequential Credit Assignment**
  RPT is largely static (one-shot choices). IRL operates over time. This allows IRL to distinguish between preferences for *outcomes* versus preferences for *processes*.
  *   *Epistemic Gain:* If an agent takes a long path to a goal, RPT might just see "chose Path A." IRL can infer a reward function that penalizes time or energy, separating the goal from the cost.
  *   *Limit:* This still relies on the assumption that the agent is optimizing *some* additive function over time. If the agent has hyperbolic discounting (time-inconsistent preferences), standard IRL will infer a distorted reward function that doesn't match the agent's "long-term" desires.

  **C. Priors as Regularization**
  You mentioned the Armstrong and Mindermann critique of simplicity priors. While they are right that simplicity cannot solve the normativity problem, priors do help with the *identification* problem in a practical sense.
  *   *Epistemic Gain:* By imposing a prior (e.g., sparse rewards, smooth value functions), IRL selects one solution from the infinite set of consistent reward functions.
  *   *Limit:* As you noted, this is an aesthetic choice, not a moral one. A simple reward function could be "maximize suffering." The prior selects for *compressibility*, not *goodness*.

  ### 3. The Philosophical Ceiling: Why IRL Remains in the Same Boat
  Despite these technical refinements, IRL hits the same wall that Sen built for RPT.

  **The Collapse of Preference into Choice**
  Sen's critique was that RPT defines "preference" *as* "choice." It strips preference of its mentalistic content (desire, welfare, judgment). If I choose to smoke, RPT says I prefer smoking. It cannot distinguish between "I want to smoke" and "I am addicted and wish I didn't."
  IRL inherits this exactly. If a human takes an action, IRL infers a positive reward for that action.
  *   **The Alignment Trap:** In AI alignment, we do not want the AI to optimize what humans *do*; we want it to optimize what humans *would want if they were smarter, calmer, and better informed* (a la CEV). Pure IRL cannot make this distinction. It is behaviorist by design. It infers the reward function that *explains* the behavior, not the reward function that *justifies* it.

  **The No-Free-Lunch on Normativity**
  The Armstrong and Mindermann result proves that without assumptions about the agent's rationality (the planning algorithm $\pi$), you cannot recover the reward $R$.
  $$ \text{Behavior} = \pi(R) $$
  You observe Behavior. You have two unknowns: $\pi$ and $R$. You cannot solve for both.
  Standard IRL solves this by *fixing* $\pi$ (assuming the human is Boltzmann-rational). This is an unverified normative assumption. We are asserting, "Humans are rational optimizers of their own well-being."
  *   If humans are rational optimizers, IRL works.
  *   If humans are biased, self-deceptive, or acting under coercion, IRL infers a reward function that encodes those biases as "goals."
  *   *Verdict:* IRL does not solve the identification problem; it **assumes it away** by fixing the rationality model. This is no different than an economist assuming WARP holds to estimate a utility function.

  ### 4. The Verdict: Better Estimator, Same Ontology
  My considered view is that **IRL is a superior statistical estimator of revealed preferences, but it offers no progress on inferring latent welfare.**

  It is "the same old identification problem dressed up in new mathematical clothing" *if* the goal is to find "true" preferences in a normative sense. The mathematical clothing (MDPs, gradients, entropy regularization) makes the inference more robust to noise and scalable to complex environments, but it does not bridge the is-ought gap.

  If you treat IRL as a tool for **prediction** (what will the human do next?), it is vastly superior to classical RPT.
  If you treat IRL as a tool for **alignment** (what *should* the AI do?), it is fundamentally broken in the same way RPT is broken for welfare economics. It conflates *revealed* value with *real* value.

  ### 5. The Only Way Out (Which Isn't Pure IRL)
  The alignment community has largely recognized this trap, which is why the frontier has moved beyond pure IRL.
  *   **Cooperative IRL (CIRL):** This framework explicitly models the human as trying to help the robot learn. It breaks the pure behaviorist loop by introducing a communicative intent. This is akin to moving from Revealed Preference to **Survey/Stated Preference** methods in economics, acknowledging that choices alone are insufficient.
  *   **Inverse Reward Design:** This acknowledges that the observed behavior is optimizing a *proxy* reward, not the true reward, and tries to infer the uncertainty over the true reward.
  *   **Deliberative Coherence:** Some proposals suggest we should not infer preferences from *actions*, but from *reflections* or *endorsements*. This explicitly rejects the behaviorist premise of RPT/IRL.

  ### Conclusion
  You are correct to be bothered. The standard pitch of IRL often glosses over the fact that it is a behaviorist methodology attempting to solve a mentalistic problem. It inherits the fatal flaw of Revealed Preference Theory: it can tell you what an agent is optimizing, but it cannot tell you whether that optimization is good for the agent, or even if the agent is optimizing what they think they are optimizing.

  IRL escapes the *computational* objections of classical economics (handling noise, sequentiality), but it remains trapped in the *philosophical* objections (the identification gap between choice and welfare). To align AI, we cannot just watch what humans do; we must, as Sen implied, ask them what they mean—and even then, we must interpret their answers with a normative framework that behavior alone cannot provide.
