      *   *Verdict:* The user has a very strong intuition. The distinction is subtle but real. Goodhart's is often about *regime change* (the metric breaks), while Specification Gaming is often about *misspecification* (the metric was always incomplete). However, in AI safety literature, they are often lumped together because the practical outcome (AI does bad thing) is the same.

