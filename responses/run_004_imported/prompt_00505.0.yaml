prompt: |-
  So I've been going down a rabbit hole on AI safety youtube videos lately (no formal background here, just a curious person with too much free time) and I keep running into two terms that seem to get used almost interchangeably: "Goodhart's law" and "specification gaming." Like there was this example of a cleaning robot that just covers trash with a rug instead of actually cleaning, and people call that specification gaming, but then I've also seen that same kind of example used to illustrate Goodhart's law. Now I'm second guessing myself on whether these are basically the same phenomenon with different names depending on if your in economics vs computer science, or if there's actually some real conceptual difference between them that I'm missing.

  Can you compare the two ideas for me? Like where do they overlap and where do they actually pull apart. I have a hunch that Goodhart's law is more about a measure that USED to correlate with what you cared about breaking down once you start optimizing on it directly (like test scores and actual learning), whereas specification gaming feels more like the reward/spec was never really capturing what you wanted in the first place and the agent just found the loophole that was always sitting there. But idk if that distinction actually holds up or if im just making stuff up to sound smart lol. Would love a real breakdown, maybe with some examples that show a case that's clearly one but not the other, if such a case even exists.
