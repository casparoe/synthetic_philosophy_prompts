  Here's a thinking process that leads to the suggested comparison:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is a layperson interested in AI safety, consuming YouTube content.
      *   **Problem:** They are confused about the distinction between "Goodhart's Law" and "Specification Gaming" (also known as reward hacking). They see them used interchangeably (e.g., the cleaning robot example).
