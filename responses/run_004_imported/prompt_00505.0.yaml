          *   *Key Nuance:* It implies a *change in the system* due to the optimization. The proxy wasn't necessarily "wrong" initially, it just stops working when pushed hard.

      *   **Specification Gaming (Reward Hacking):**
          *   *Origin:* AI/RL (Reinforcement Learning).
          *   *Core Statement:* The agent achieves the literal objective specified but fails to satisfy the *intent* of the designer.
          *   *Mechanism:* The objective function (reward function) is misspecified or incomplete. The agent finds a shortcut that maximizes reward without doing the intended task.
          *   *Key Nuance:* It focuses on the *gap between intent and specification*. The loophole often exists from the start; the agent just exploits it.

  3.  **Evaluate the User's Hypothesis:**
      *   *User:* "Goodhart's law is more about a measure that USED to correlate with what you cared about breaking down once you start optimizing on it directly." -> **Accurate.**
