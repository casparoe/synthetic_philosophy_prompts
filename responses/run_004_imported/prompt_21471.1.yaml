          *   A red apple is a common event. It provides negligible information gain.
          *   *Formula intuition:* Confirmation depends on how surprising the evidence is if the hypothesis were false.
      *   **Implication 3: Practical Advice for eBird:**
          *   Don't log apples. Focus on the target class.
          *   However, be aware of *negative evidence*. If you see a bird that looks like a raven but isn't black, that's huge disconfirmation.
          *   Selection Bias: You are looking for birds. You aren't looking at cars, shoes, or apples. Therefore, your dataset is already biased toward $R(x)$, making $\neg B(x) \rightarrow \neg R(x)$ irrelevant to your specific sampling method.
