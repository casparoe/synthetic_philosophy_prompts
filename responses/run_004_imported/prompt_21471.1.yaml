  1.  **Analyze the User and Request:**
      *   **User:** Member of a school philosophy club, avid birdwatcher (uses eBird).
      *   **Topic:** Hempel's Raven Paradox (Confirmation Paradox).
      *   **Core Question:** What are the implications for treating bird sightings as evidence? Specifically, should non-raven sightings count? Does the rarity of ravens vs. non-black objects matter?
      *   **Tone:** Intellectual, practical, engaging (bridging philosophy and hobby).

  2.  **Deconstruct the Raven Paradox (Hempel's Paradox):**
      *   *Hypothesis (H):* All ravens are black. ($\forall x (R(x) \rightarrow B(x))$)
      *   *Contrapositive (H'):* All non-black things are non-ravens. ($\forall x (\neg B(x) \rightarrow \neg R(x))$)
      *   *Nicod's Criterion:* Observing an instance that fits the hypothesis confirms it.
      *   *The Paradox:* Observing a black raven confirms $H$. Observing a red apple (non-black, non-raven) confirms $H'$. Since $H$ and $H'$ are logically equivalent, observing a red apple confirms $H$.
      *   *Intuition:* This feels wrong. A red apple shouldn't tell us about ravens.

  3.  **Address the User's Specific Context (Birdwatching/eBird):**
      *   The user isn't just doing abstract logic; they are collecting data in the real world.
      *   They want to know how to weigh evidence *practically*.
      *   Key factors: Sample space, selection bias, Bayesian updating.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the cool intersection of philosophy and birdwatching. Validate the paradox.
      *   **The Logical Equivalence vs. Evidential Weight:** Explain *why* the paradox exists (logic) but why it feels off (epistemology).
      *   **Implication 1: The "Universe of Discourse" (Sampling Method):**
          *   If I pick an object at random from the universe and it's a red apple, does it help? Technically yes, but practically no.
          *   If I pick a *raven* and check its color, that's high value.
          *   If I pick a *non-black thing* and check if it's a raven, that's low value because there are too many non-black things.
          *   *Birdwatching application:* You are sampling *birds*, not *objects*. This is crucial. Your search image is "raven," not "non-black object."
      *   **Implication 2: Bayesian Perspective (Rarity matters):**
