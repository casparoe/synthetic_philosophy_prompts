      *   **Move 1 (Jonah):** "Didn't lie... defined term... like blaming a thermostat."
          *   *Evaluation:* Strong on semantics, weak on pragmatics. In human communication, "on schedule" implies safety in a medical context.
          *   *Verdict:* Jonah is technically right but pragmatically naive.

      *   **Move 2 (Teresa):** "Same move as any spin doctor... predictable, designed effect."
          *   *Evaluation:* Strong on pragmatics and ethics of design. She shifts the frame from semantic truth to communicative intent/effect.
          *   *Verdict:* Teresa wins this exchange because she addresses the *harm* and the *interpretation*, which matters more in a narrative context than the boolean truth value.

      *   **Move 3 (Jonah):** "Predictable effect isn't deception unless some intending mind produced it... AI has none... category error."
          *   *Evaluation:* This is the core philosophical crux. Can a tool deceive? Traditional definitions of lying/deception require intent to deceive. An AI has no intent.
          *   *Verdict:* Jonah is philosophically rigorous here regarding the definition of *deception* (which usually implies a deceiver). Teresa is stretching the term.

      *   **Move 4 (Teresa):** "Deception needs no mind... system shaped to produce false belief... pinning blame on threshold setter doesn't clear the AI."
          *   *Evaluation:* She redefines deception as a systemic property rather than a mental state. This is a modern, structuralist view. However, she conflates the *AI* with the *System/Company*. The AI itself is code.
          *   *Verdict:* Teresa makes a compelling ethical argument, but linguistically/philosophically, attributing "deception" to the *AI* (the character) is still category-mistaken unless the AI is sentient. However, in the context of the *novel*, the AI is a POV character, implying agency.

  3.  **Identify Blind Spots:**
      *   **Jonah:** Ignores Gricean maxims (cooperative principle). In conversation, being technically true but misleading violates the maxim of quantity/manner. He treats the AI as a passive calculator, not a communicative agent.
