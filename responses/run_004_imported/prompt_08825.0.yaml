  ### Justifications for Scores

  **Move 1 (Marta): +2.** This is a precise summary of Anscombe's core argument in the pamphlet. She explicitly rejects consequentialist justifications (saving lives via shorter war) and centers the moral verdict on the intentional killing of innocents as a means.

  **Move 2 (Denis): +1.** Denis accurately identifies the distinction Anscombe relies on (terror bombing vs. strategic/collateral bombing). While he challenges the *application* of the label to Truman rather than interpreting Anscombe's text directly, he demonstrates a correct understanding of the conditions Anscombe sets for the charge of murder.

  **Move 3 (Marta): +2.** Marta correctly links the factual claim (targets were population centers) to Anscombe's philosophical framework regarding intention (the "means-end" account). Although *Intention* was published a year after the pamphlet, the concepts were developed concurrently, making this a faithful reconstruction of Anscombe's view.

  **Move 4 (Denis): +1.** This is a valid meta-ethical critique of Anscombe's position. He correctly notes that her moral certainty relies on specific factual descriptions of the act. While Anscombe would argue the facts are obvious, Denis accurately identifies that her "clean conceptual result" is vulnerable to empirical dispute.

  **Move 5 (Marta): +2.** Marta rightly points out that the intended/foreseen distinction is not Anscombe's only premise; it rests on a deeper absolutism about killing innocents. This captures the structure of Anscombe's ethics: the distinction explains *what* counts as killing the innocent, but the prohibition itself is non-negotiable.

  **Move 6 (Denis): +1.** Denis accurately characterizes the fundamental clash between Anscombe's absolutism and "supreme emergency" exceptions found in other just-war traditions. He acknowledges the "corrupt mind" quote is from a later text (*Modern Moral Philosophy*, 1958) but correctly uses it to illuminate the intransigent spirit of the 1956 pamphlet.

  ### What Marta and Denis Are Missing

  **Marta** treats Anscombe's argument primarily as a technical exercise in the philosophy of action (the Doctrine of Double Effect and intention descriptions). She misses the **theological and ecclesial context**: Anscombe's position is grounded in a Catholic natural law tradition where certain acts are intrinsically evil regardless of human calculation. Furthermore, she overlooks the **institutional target** of the pamphlet. Anscombe wasn't just judging Truman; she was judging *Oxford University*. Her argument is that by honoring Truman, the university becomes complicit in the murder and corrupts its own role as a guardian of truth. For Anscombe, the degree ceremony itself was a public lie.

  **Denis** treats Anscombe as a rigid deontologist participating in a standard secular just-war debate. He misses her radical **critique of consequentialism as a corruption of moral language**. For Anscombe, the problem isn't just that Truman weighed consequences wrongly; it's that the very framework of "weighing consequences" against absolute prohibitions renders moral terms like "justice" meaningless. He also misses the **rhetorical genre**: this is a polemic, not a balanced academic treatise. Anscombe is not trying to convince consequentialists; she is issuing a prophetic warning to her own community. By framing her view as merely one side of a "back-and-forth" with supreme emergency theorists, Denis domesticates a position that intends to stand outside that utilitarian calculus entirely.

  **Both** miss the significance of the **concept of "honor."** The pamphlet is about whether Truman is an *honorable* man fit for an *honorary* degree. Anscombe argues that a murderer cannot be honored without staining the honorer. The debate focuses heavily on the metaphysics of intention, but the social and performative act of the university conferring the degree is the actual locus of Anscombe's protest.
