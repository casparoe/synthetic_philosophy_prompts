answer: |-
  Good evening, everyone. For those who don't know me, I'm Sarah, the Maid of Honor and [Sister's Name]'s older sister. Which basically means I spent the first half of my life teaching her how to tie her shoes, and the second half trying to convince her that certain boys were not worth tying her shoes for.

  Standing here today, looking at her with [Fiancé's Name], I realize I don't have to worry about that anymore.

  Now, [Sister's Name] knows I'm a bit of a worrier. And when she told me she was asking me to give the toast, and then explained the specific wording they'd chosen for their vows, I'll admit… I panicked. A little. I spent the last month reading things I probably shouldn't have been reading at 2:00 AM. I went down a rabbit hole trying to answer a question that I think a lot of people in this room have been wrestling with: What actually makes a wedding vow *bind*?

  Because we have two camps here. On one side, you have the traditionalists—who love my parents-in-law, by the way, thank you for raising the man my sister gets to marry—who worry that a promise with a checkpoint isn't a promise at all. That it's just a report on your current mood dressed up in formal wear. And on the other side, you have the realists—myself included, and many of our friends—who worry that promising "till death do us part" is a lie, because none of us have a crystal ball. How can you promise how you'll feel in forty years?

  I kept looking for a philosopher to solve this for me. Someone to tell me which side was right. But then I realized that a wedding toast isn't a seminar, and marriage isn't a logic puzzle. It's a practice.

  Here is what I've come to believe. A promise isn't binding because of magic words. It isn't binding because you said "forever." A promise is binding because of the *cost* of breaking it, and the *intention* of keeping it.

  To [Fiancé's Name]'s parents, and anyone who worries that "for as long as it's true" is too easy: I want you to know that I don't think my sister and [Fiancé's Name] are taking the easy way out. I think they are actually choosing the harder path.

  It is easy to say "forever" once, on a day when you are flooded with dopamine and everyone is clapping for you. It is much harder to say, "I choose you today, and I will sit down with you next year, and the year after, and I will ask you again, and I will have to mean it again."

  A traditional vow relies on inertia. Once you say it, you're married. You coast on the momentum of that one day. But a vow to *renew*? That requires active participation. It means you can't just sleepwalk through the hard years. You have to wake up and decide, "I am still in this." That isn't a lack of commitment. That is commitment that refuses to rely on autopilot.

  And to my friends, and anyone who thinks "till death" is the only honest way: I get it. We've all seen promises broken. We've all seen the "forever" vow become a cage. But honesty isn't about predicting the future. It's about how you treat the person standing in front of you *now*.

  If I promise to walk you home, I can't guarantee a meteor won't hit us on the way. But I can guarantee that I won't abandon you just because I get tired, or because I see a shortcut that doesn't include you.

  What makes [Sister's Name] and [Fiancé's Name]'s vow binding isn't that they guarantee they won't fall out of love. It's that they've promised they won't *pretend* to be in love if they aren't. They are promising that their marriage will be built on truth, not on the fear of breaking a rule.

  There is a thinker I read who suggested that the point of a promise isn't to control the future, but to create a specific kind of trust in the present. It says: "I know you are counting on me. I know that if I walk away, it will hurt you. And because I care about that hurt, I will not walk away without a fight."

  That is what I see in them.

  [Sister's Name], I have watched you grow into a woman who values truth over comfort. I knew you wouldn't be able to stand at that altar and say words you didn't mean. And [Fiancé's Name], I have watched you love her in a way that is steady, and kind, and deeply attentive. You don't love her because you have to. You love her because you *want* to. And you want to keep wanting to.

  So, to answer the question I've been obsessing over: What makes this vow binding?

  It's binding because they are asking you to hold them to it. It's binding because they know that if they stop choosing each other, they have to say so, rather than letting the silence do the work. That takes courage.

  Marriage isn't a contract you sign once and file away. It's a conversation you have every day. Some days the conversation is "I love you." Some days it's "I'm tired." Some days it's "We need to fix the sink." And some days, years from now, it might be "Do we still choose this?"

  My wish for you is that the answer is always yes. But even more, my wish is that you never stop asking the question.

  So, if everyone could please raise a glass.

  To [Sister's Name] and [Fiancé's Name]. May your love be honest enough to survive the hard questions, and may your commitment be strong enough to renew itself, again and again, for as long as it is true.

  To the happy couple.
