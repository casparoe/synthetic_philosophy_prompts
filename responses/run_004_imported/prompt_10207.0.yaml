prompt: |-
  My younger sister is getting married in three weeks, and she has asked me, her maid of honor, to give the toast. I have no background in philosophy and no real qualification for the assignment beyond having spent most of the last month reading about it obsessively, because the situation is more delicate than a normal wedding toast. She and her fiancé have written their own vows, and rather than promise anything "till death do us part," they are going to promise to keep choosing each other "for as long as it's true," with a line about renewing the commitment deliberately every year instead of assuming it will simply last. His parents, who are quietly unhappy about this, have told me privately that a promise you can call off isn't really a promise at all, just a report of your current feelings dressed up in wedding language, and that they don't know what the two of them will actually have vowed to each other. My sister's friends, several of whom (myself included) have already watched an unconditional "forever" vow get broken anyway, think the traditional wording is the dishonest one, since nobody can truthfully promise how they'll feel in forty years.

  I keep getting stuck on the same question underneath both complaints: what actually makes a wedding vow binding in the first place, over and above however the two people happen to feel at the moment they say it? I fell down a bit of an internet rabbit hole trying to answer this myself. I found Hume arguing, if I followed him right, that the whole obligation is basically a useful convention we've all agreed to honor rather than anything built into the promise itself; a much older argument, which I think comes from Hobbes, that the entire point of a promise is to hold you to something exactly when you've stopped wanting to do it, since a promise that only counts while you still feel like keeping it isn't doing anything a mere intention wouldn't already do; and then something in a more recent writer named Scanlon about a "principle of fidelity," which seemed to be about the trust and expectations you create in the other person rather than about lifetime guarantees at all. I couldn't work out which of these, if any, would let me say that what my sister and her fiancé are doing at the altar is a real, binding promise, rather than either an empty guarantee or a nice way of describing their current mood.

  Could you write the toast for me? It needs to run five or six minutes out loud, sound like a sister and not a seminar, and actually be funny and warm in the places a wedding toast should be. But somewhere in the middle it has to take on the disagreement directly rather than steering around it: by the end, I want his parents to feel their worry about what a promise even is has been taken seriously, and I want my sister's friends to feel the same, even though I can't honestly end up agreeing with both sides. I would rather you pick a real position and make it work as a toast than have it stay neutral for six minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Maid of Honor (older sister).
      *   **Occasion:** Wedding reception toast.
      *   **Duration:** 5-6 minutes spoken (approx. 750-900 words at a moderate pace).
      *   **Tone:** Funny, warm, sisterly (not academic/seminar-like), but intellectually honest.
      *   **Core Conflict:** The couple is using non-traditional vows ("for as long as it's true," renewed annually) vs. traditional vows ("till death do us part").
      *   **Stakeholders:**
          *   *The Couple:* Believe traditional vows are dishonest/impossible.
          *   *Groom's Parents:* Believe non-traditional vows aren't real promises (just reports of current feelings).
          *   *The Couple's Friends (including MOH):* Believe traditional vows are lies because breakups happen anyway.
      *   **Philosophical Background (provided by user):** Hume (convention), Hobbes (binding against desire), Scanlon (fidelity/trust).
      *   **Requirement:** Must take a real position on what makes a vow binding, addressing the disagreement directly, not skirting it. Must validate both sides' concerns without necessarily agreeing with both conclusions.
      *   **Goal:** Reassure the parents that this is a *real* commitment, reassure the friends that honesty is better than hollow tradition, and celebrate the couple.

  2.  **Determine the Philosophical Stance:**
      *   *Hobbes* is too rigid for this couple (binding against desire).
      *   *Hume* is too cynical (just a useful convention).
      *   *Scanlon* offers the best middle ground for a toast. The "Principle of Fidelity" focuses on the *expectations created* and the *moral weight of breaking trust*, rather than the metaphysical duration.
      *   *The Argument:* A promise isn't binding because of magic words or a guarantee of the future. It's binding because of the *cost* of breaking it and the *intentionality* of keeping it. The couple's choice to renew annually isn't an "out"; it's a *higher bar*. It requires active choice rather than passive inertia. This addresses the parents (it's hard work, not just feelings) and the friends (it's honest, not a lie).

  3.  **Drafting - Section by Section:**

      *   **Opening (Warmth & Humor):** Establish the relationship. Acknowledge the pressure. Maybe a joke about the "research" mentioned in the prompt (without sounding like a lecture).
      *   **The Elephant in the Room:** Address the vows directly. Acknowledge the difference. Don't hide it.
      *   **The Philosophical Pivot (The "Meat"):** Translate the Scanlon-esque idea into sister-speak.
          *   *Parents' concern:* Is it real? *Answer:* Yes, because it requires action.
          *   *Friends' concern:* Is "forever" a lie? *Answer:* Yes, if it's passive.
          *   *The Synthesis:* A vow is binding not because it predicts the future, but because it creates a debt of honesty *now*.
      *   **The "Annual Renewal" Reframe:** Frame this not as an escape hatch, but as a marathon vs. a sprint. It's harder to choose someone every day than to say it once and coast.
      *   **Closing (Warmth & Wish):** Bring it back to love. A wish for their future.

  4.  **Drafting - Tone Check:**
      *   *Avoid:* "As David Hume said..." or "According to Scanlon..."
      *   *Use:* "I've been thinking..." or "Here's what I realized..."
      *   *Humor:* Self-deprecating about overthinking. Gentle jabs at the couple.
      *   *Emotion:* Sincere love for the sister and welcome to the fiancé.

  5.  **Drafting - Word Count & Timing:**
      *   Average speaking pace is ~130-140 words per minute.
      *   5 minutes = 650 words. 6 minutes = 840 words.
      *   Target: ~750-800 words.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is it too heavy?
      *   *Fix:* Sandwich the heavy stuff between jokes and sentimental moments.
      *   *Critique:* Will the parents feel attacked?
      *   *Fix:* Validate their desire for security. Acknowledge that "forever" is a beautiful ideal.
      *   *Critique:* Will the friends feel sold out?
      *   *Fix:* Acknowledge that "till death" can feel like a trap if it ignores reality.
      *   *Key Insight:* The binding nature of a promise isn't the *duration*, it's the *weight*. If you promise to check in every year, breaking that promise *next year* is a betrayal. That makes it binding.

  7.  **Final Polish:**
      *   Check transitions.
      *   Ensure the "philosophy" sounds like human wisdom.
      *   Make sure the ending lands emotionally.

  *(Self-Correction Note: Make sure I don't explicitly name-drop philosophers unless it's a joke about my research. The prompt says "sound like a sister and not a seminar." So, keep the concepts, lose the names.)*

  8.  **Final Review against constraints:**
      *   5-6 mins? (Looks about right).
      *   Funny/Warm? (Yes).
      *   Addresses the vow conflict directly? (Yes).
      *   Takes a position? (Yes: Active choice > Passive guarantee).

