prompt: |-
  Ok so everyone in these parts has seen the classic Knobe "CEO boosts profits, and knowingly helps/harms the environment as a side effect" case a thousand times, so lets skip that one. What I find more interesting is how far the effect generalizes once people went looking: moral valence doesn't just skew whether we call something "intentional," it apparently also skews whether we say someone "caused" an outcome (the studies where the unauthorized person taking office pens gets blamed for the shortage way more than the authorized person who took just as many), whether we say someone "knew" vs merely "believed" a side effect would happen, and, weirdly, even whether we're willing to call someone's life "happy" or say their actions express their "true self."

  Given that the same moral-valence-contaminates-your-judgment pattern keeps showing up across all these unrelated concepts, is that better evidence for Knobe's own preferred reading -- that moral evaluation is literally built into these folk concepts, so the asymmetry reflects genuine competence rather than error -- or is it better read as a debunking result, where there's really just one shallow blame/affect heuristic contaminating a pile of otherwise-separate judgments, and "the concept of X is normatively loaded" is reading way more into it than is warranted? Write an essay that actually weighs both readings and commits to one -- I don't want a wishy-washy "it's probably a bit of both" ending, give me an actual verdict and defend it.
