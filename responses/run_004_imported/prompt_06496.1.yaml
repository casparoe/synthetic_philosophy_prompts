  # The Normative Architecture of Folk Psychology: A Defense of the Competence View

  The Knobe Effect is no longer a curiosity; it is a cornerstone of experimental philosophy. We all know the CEO case: the chairman who knowingly harms the environment to boost profits is said to have done so "intentionally," while the chairman who knowingly helps the environment under the same conditions is said to have done so only as a "side effect." But as you note, the rot—or the feature—goes much deeper. The asymmetry bleeds into judgments of causation (Alicke's pen studies), epistemic states (Beebe & Buckwalter's knowledge attributions), and even the metaphysics of personal identity (Phillips & Knobe's "True Self" studies).

  The central question is how to interpret this pervasiveness. Is this evidence for Joshua Knobe's **Competence View**—that moral evaluation is constitutive of these folk concepts, meaning the asymmetry reflects how the concepts actually work? Or is it evidence for the **Performance Error View**—that these concepts are inherently descriptive and neutral, but are being systematically contaminated by a shallow blame/affect heuristic?

  While the Performance Error view offers a comforting preservation of objectivity, it ultimately fails to account for the structural specificity of the data. The Competence View is the superior explanation. The asymmetry is not a bug in human cognition; it is the operating system. The "neutral" concept is a philosopher's fiction, not a folk reality.

  ### The Case for the Heuristic (Performance Error)

  The argument for the Performance Error view rests on parsimony and the ideal of descriptivism. Proponents, such as Mark Alicke in his early work on "culpable control," suggest that human beings have a primary drive to assign blame and praise. When a negative outcome occurs, our cognitive systems light up with a demand for a target. To satisfy this demand, we stretch our descriptive concepts. We say the CEO *intentionally* harmed the environment not because our definition of "intentional" includes moral badness, but because we want to blame him, and "intentional" is the nearest linguistic tool for assigning responsibility.

  This view is attractive because it saves the phenomena of science. If "causation" is morally loaded, then physics is impossible, because physics requires neutral descriptions of antecedent conditions. The Heuristic view posits that deep down, we *know* the causal mechanisms are identical in the CEO cases; we just report them differently due to emotional interference. It treats the Knobe Effect as a cognitive illusion, akin to the Müller-Lyer illusion. Just as lines look different lengths due to context arrows despite being equal, actions look intentional due to moral context despite being structurally identical.

  Furthermore, this view gains traction from cross-cultural studies. If the moral loading were constitutive of the *concept* itself (like the concept of a "bachelor"), we would expect universality. Yet, some studies suggest the effect varies in magnitude or direction across cultures. If it varies, the argument goes, it cannot be built into the conceptual competence; it must be a contextual performance variable.

  ### The Failure of the Heuristic Explanation

  However, the Heuristic view crumbles when we examine the *scope* and *structure* of the generalization. A simple blame heuristic predicts that negative outcomes should increase the attribution of agential properties across the board. But the data is more nuanced than simple valence matching.

  Consider the "True Self" studies. When a person acts immorally, observers don't just say the person is "bad"; they say the action does not reflect who they *really* are. Conversely, moral actions are attributed to the "True Self." If this were merely a blame heuristic, we would expect a valence shift: Bad action = Bad Self. Instead, we see a metaphysical shift: Bad action = *Alien* Self. A shallow heuristic explains why we punish; it does not explain why we redefine the boundaries of personal identity to exclude the badness. This suggests that for the folk, the concept of "True Self" is *constituted* by moral goodness. It is not that we are biased in applying a neutral concept; it is that the concept itself is normative.

  Similarly, look at the causation cases. In the pen vignette, the physical causal chain of the unauthorized professor taking a pen is identical to the authorized one. If the heuristic were merely about "finding someone to blame," we should see increased blame. But we see increased attribution of *causation*. Participants literally say the unauthorized professor *caused* the shortage more than the authorized one. This is not just a desire to punish; it is a judgment about the structure of the event. The violation of the norm makes the agent salient *as a cause*. This implies that the folk concept of "cause" is not "physical antecedent," but "normatively relevant antecedent."

  Finally, the Heuristic view struggles with the stability of the judgment. Cognitive illusions usually dissipate under reflection. If you show someone the Müller-Lyer illusion and measure the lines, they admit the lines are equal. But when you present the CEO case to subjects and ask them to reflect on the symmetry, many do not concede. They dig in. They insist the harm was intentional and the help was not. If this were a performance error, reflection should correct it. The fact that it persists suggests it is not an error in performance, but a feature of competence.

  ### The Verdict: Moral Evaluation is Constitutive

  We must therefore commit to the **Competence View**. The widespread generalization of the Knobe Effect across intentionality, causation, knowledge, and identity is best explained by the hypothesis that folk psychology is fundamentally normative, not descriptive.

  The Heuristic view makes a category mistake: it assumes that folk concepts are failed scientific concepts. It assumes that when a layperson uses the word "cause" or "know," they are attempting to do what a physicist or epistemologist does, but getting distracted by their emotions. This is an uncharitable and unlikely model of human cognition. Human beings did not evolve concepts to do science; we evolved concepts to navigate a social world. In a social world, the most important distinction is not between "physical antecedent A" and "physical antecedent B," but between "acceptable behavior" and "violation."

  Therefore, our concepts are tuned to that distinction. To say someone "caused" an outcome is to say they are the appropriate target of accountability for that outcome. To say someone "knows" a proposition is to say they are licensed to assert it as a guarantee to others (a normative license). To say someone is "happy" or acting from their "True Self" is to make a judgment about the quality of their life and character, not merely their dopamine levels or behavioral consistency.

  The fact that this pattern holds across unrelated domains is not evidence of a single contaminating heuristic; it is evidence of a unified cognitive architecture. We do not have a "moral module" that occasionally leaks into our "causal module." We have a single system for understanding agency where description and prescription are inextricably linked. The "neutral" concept of causation or intentionality is a specialized tool developed by philosophers and scientists, stripped of its normative flesh for specific technical purposes. To project that specialized tool back onto the folk and declare their usage "biased" is like declaring a fish biased because it doesn't walk on land.

  ### Conclusion

  The debunking project wants to tell us that our moral emotions are clouding our judgment of the facts. The evidence suggests the opposite: our grasp of the "facts" of agency is structured by our moral emotions. The generalization of the Knobe Effect is not a sign that we are bad at being scientists; it is a sign that we are good at being humans. The Competence View wins because it takes the data at face value. It accepts that when people say the CEO intentionally harmed the environment, they are reporting a genuine feature of their conceptual landscape, not a glitch in their processing. The asymmetry is real, it is robust, and it is constitutive. We are not neutral observers contaminated by morality; we are moral observers who construct neutrality only with great effort.
