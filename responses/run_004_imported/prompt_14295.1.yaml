answer: |-
  The study at Yasnaya Polyana was stark, the walls lined with books the master had largely renounced. Leo Tolstoy, clad in his peasant blouse and boots, sat by the window where the winter light fell across his white beard. Opposite him sat Arthur Sterling, a young Oxford don, clutching a worn volume of *King Lear*.

  **Tolstoy:** You have come a long way, Mr. Sterling, to defend a poet whose work I have declared to be not merely flawed, but morally injurious. I fear you bring a lantern to show the sun that it does not shine.

  **Sterling:** I come, Count, not to blind you with fame, but to ask if your definition of light excludes the stars. You argue that art must unite men in religious consciousness; I ask if *Lear* does not unite us in the universal consciousness of suffering.

  **Tolstoy:** Suffering without the promise of redemption is not Christian art; it is a pagan spectacle. Shakespeare infects the audience with despair, not brotherhood. He asks us to weep for a king, not to love a moujik.

  **Sterling:** But the infection you speak of—is it not present when we feel Cordelia's grief? If art transmits feeling, and I feel her sorrow as my own, have we not achieved the union you demand?

  **Tolstoy:** You feel a theatrical sorrow, a luxury of the upper classes. The peasant in the field knows real hunger and real loss; he does not need inflated rhetoric to understand it. Shakespeare's language is a barrier, not a bridge.

  **Sterling:** Is it the language that bars him, or our assumption that he cannot comprehend poetry? The peasant knows the storm. He knows the betrayal of children. Shakespeare speaks the truth of the heart, not merely the literalism of the court.

  **Tolstoy:** Truth in art must be clear as a prayer. If a man must study a commentary to understand the moral, the art has failed. *Lear* is a riddle wrapped in nonsense. Why divide the kingdom? It is contrary to reason and nature.

  **Sterling:** Because men are often contrary to reason. Is art to show us the world as it should be, or as it is? If we only portray the righteous, do we not lie to the soul struggling in the dark?

  **Tolstoy:** We portray the soul struggling toward God. To linger in the dark without pointing to the dawn is to abandon the traveler. Shakespeare leaves his characters in the abyss. He offers no path out of the suffering.

  **Sterling:** And yet, Edgar survives. He says, "Speak what we feel, not what we ought to say." Is that not a sermon more honest than any homily? Is sincerity not your own highest criterion?

  **Tolstoy:** Sincerity must serve the good. A man may be sincere in his anger, but if that anger breeds violence, it is evil. Shakespeare's sincerity is in the service of pride, not humility. He glorifies the individual will.

  **Sterling:** But consider your own Pierre Bezukhov. He wandered through war and spiritual chaos before finding peace. Did you not need to write the darkness to validate the light?

  **Tolstoy:** I have renounced those novels. They are the work of a vain aristocrat seeking glory. I write now only for the salvation of the soul. I would burn *War and Peace* if it distracted a single peasant from the Gospel.

  **Sterling:** Yet the world keeps reading them. They bind the Russian count and the English clerk in a shared human frailty. Is that not a form of Christian love, to recognize our shared brokenness?

  **Tolstoy:** It is a recognition of sin, yes, but it stops there. It wallows. True art must command us to lay down the sin. Shakespeare commands us only to watch it bleed. He is a spectator of agony, not a physician of the spirit.

  **Sterling:** Perhaps the physician must first diagnose the wound before applying the balm. If we pretend the wound does not exist, is that not a greater falsehood? *Lear* tears away the pretense of authority and family.

  **Tolstoy:** It tears away the order God established. It shows a world without justice. If you teach the people that the universe is indifferent to the good man's death, you undermine the very foundation of moral life.

  **Sterling:** Or you teach them that moral life must be lived *despite* the indifference. That love is not a transaction for safety, but a sacrifice. Is Cordelia's return not an act of grace, even if it fails to save her?

  **Tolstoy:** Grace requires a Giver. Shakespeare gives us chance, not Providence. He asks us to admire the endurance of man, rather than the mercy of God. It is the worship of the creature, not the Creator.

  **Sterling:** Then we differ on where the divine resides. I find it in the human capacity to endure the unbearable. You find it only in the doctrine that explains it.

  **Tolstoy:** I find it in the commandment to love one another. Does *Lear* teach us to love? Or does it teach us to fear the storm?

  **Sterling:** It teaches us to stand together in the storm, Count. And perhaps, for some of us, that shared shelter is the only church we know.

  **Tolstoy:** Then you are content to dwell in the vestibule, shivering, when the door stands open.

  **Sterling:** And you, Count, are content to hold the door open for men who are not yet ready to walk through it.
