prompt: |-
  I'm writing a historical novel that includes a scene set at Yasnaya Polyana in Tolstoy's old age, and I've reached a passage I can't draft convincingly on my own. An earnest young Shakespearean scholar has traveled from England specifically to challenge the old man's notorious verdict that King Lear is not merely overrated but actually bad art. I want their exchange to be a genuine contest of ideas rather than a demonstration piece: Tolstoy should state the real grounds of his objection to the play, not just gesture at it, and the scholar should answer with the strongest replies available — including, if it's a fair move, turning Tolstoy's own account of what makes art good back against his verdicts on both Shakespeare and his own earlier novels. Could you draft this as a dialogue of some twelve to sixteen exchanges, formal and period-appropriate in register, in which neither man ends up with the last, unanswerable word?
