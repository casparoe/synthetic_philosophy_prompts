prompt: |-
  Random question but this has been bugging me for weeks because it's basically playing out in my apartment right now. I'm taking Contemporary Moral Problems this term (Phil 214) and we just spent like three weeks on utilitarianism vs deontology and whether you can ever rationally resolve moral disagreements, which got me thinking about this arrangement my roommate and I have had going for a few months. She and I disagree a lot about what actually counts as a serious ethical issue: I think factory farming is one of the worst things going on right now but I'm honestly pretty indifferent about fast fashion, and she's basically the opposite, she thinks buying from exploitative clothing brands is a real moral failing but doesnt see anything wrong with eating meat. A while back we half-jokingly struck a deal, she stopped buying from a list of fast fashion brands whenever we shop together, and I started cooking vegetarian for all our shared meals. Neither of us has actually changed our mind about the underlying question at all, I still don't think fast fashion is wrong and she still doesn't think eating meat is wrong, we just each gave up something we don't personally care about in order to get the other person to change on the thing we DO care about.

  I mentioned this setup to a friend from the same class and he got weirdly judgmental about it, saying the whole thing is kind of hollow or even a bit dishonest, since neither of us is actually acting from genuine moral conviction, like I'm "going vegetarian" while still believing there's nothing wrong with eating meat, so by his logic it barely even counts as a moral act on my part, and same deal for her with the clothes. His view is that real ethical progress has to come from people's beliefs actually changing, not this kind of horse-trading. But it seems to me like the world is now better by both of our own standards than before we made the deal, less factory-farmed meat AND less sweatshop-made clothing coming out of our apartment, so I don't really get what's supposed to be wrong with that. Is my friend onto a real problem here, or is our arrangement actually a legitimate way for two people who disagree about ethics to each end up doing more good? Would appreciate an actual verdict rather than a "well it depends."
