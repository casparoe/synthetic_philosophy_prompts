  **Step 1 (Dev): 2**  
  Dev nails the definition. A Ulysses contract only works if the future self *can't* easily override it, just like constitutional entrenchment requires more than a simple majority to change core rules.

  **Step 2 (Alicia): 1**  
  Alicia raises a valid practical problem (the roommate can't know Marco's true state), but she misses the theoretical point: precommitment *assumes* future judgment is compromised by passion, so distrusting it is the feature, not a bug.

  **Step 3 (Dev): 2**  
  Dev correctly clarifies that constitutions aren't immutable, just harder to change. Setting a fixed term solves Alicia's "how do we know" problem by removing discretion during the vulnerable period.

  **Step 4 (Alicia): 2**  
  Alicia hits on the "dead hand of the past" problem, a major AP Gov concept. She correctly identifies that binding future generations (or selves) raises legitimacy issues if the initial conditions weren't perfectly rational or representative.

  **What they're missing:**  
  Both ignore the role of **interpretation**. In real constitutions, courts (like a smart roommate) can interpret rules to fit new contexts without breaking the contract. Also, they assume Marco's preferences haven't *genuinely* changed; Ulysses contracts work best for willpower failures, not when someone actually outgrows their old goals.
