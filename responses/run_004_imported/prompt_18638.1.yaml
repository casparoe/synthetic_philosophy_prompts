      *   **Elena's Defense (Contextualism):** Elena needs to explain why the staff's omission counts but the family's doesn't, *without* just appealing to duty (which concedes to Marcus). She might use "Contrastive Causation" or "Normal Conditions."
      *   **Marcus's Rebuttal:** He argues that "Normal Conditions" is just a fancy way of saying "Norms/Expectations," which proves his point that it's not *metaphysical* causation.
      *   **The Synthesis/Resolution:** They shouldn't necessarily agree, but they should clarify the stakes. The lawyer is conflating moral/legal responsibility with metaphysical causation.
      *   **Closing:** Bring it back to the user's situation. What does this mean for them practically?

  5.  **Refining the Argument (Self-Correction during drafting):**
