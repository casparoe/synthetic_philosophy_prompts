          *   *View A (Omissions are Causes):* Not doing something can cause an outcome.
          *   *View B (Omissions are Not Causes):* "Nothing" cannot cause "something." Blame is based on duty/norms, not causation.
          *   *The Problem:* If omissions *are* causes, we face the "problem of profligate causation" (why isn't everyone who could have prevented it a cause?). If they *aren't*, how do we distinguish the staff's negligence from the family's lack of action in a meaningful causal way?
      *   **Format:** A dialogue between two philosophers.
      *   **Tone:** Respectful, engaging with strongest moves (no strawmanning), directly addressing the user's specific case (grandma, facility, lawyer's argument).
      *   **Goal:** Hash out the puzzle of omission causation using this specific scenario.

  2.  **Character Development:**
