answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Rain taps against the window. **Elena** (40s, wears a blazer, specializes in metaphysics of causation) stirs her tea. **Marcus** (50s, rumpled sweater, specializes in ethics and action theory) nurses a black coffee. Between them sits a printed email chain from the assisted living facility's lawyer.*

  **Elena:** I've been reading over this case your friend sent. The lawyer's argument is vile, but metaphysically? It's not incoherent. That's what worries me.

  **Marcus:** Vile is right. But you're the causation person. I'm the ethics person. My instinct is to say the staff is morally culpable because they breached a duty. But the lawyer is trying to drag this into metaphysics. He's asking, "Did the *nothing* that happened cause the fall?"

  **Elena:** Exactly. And if I take my standard view—Counterfactual Dependence—the staff's omission *is* a cause. If they had checked, she wouldn't have fallen. Therefore, the failure to check caused the fall.

  **Marcus:** But that's where the trap springs. If "failure to check" is a cause, then *any* failure to check is a cause. Why isn't the family a cause? Why isn't *me* sitting here drinking coffee a cause? I didn't check on her either. If I had, I could have prevented it. By your logic, I broke her hip.

  **Elena:** I don't accept that conclusion, Marcus. But I accept the premise that omissions can be causes. You're raising the Problem of Profligate Causation. If we count absences as causes, causation becomes ubiquitous. Everything that didn't prevent the event becomes a cause of the event.

  **Marcus:** Precisely. And that's why I hold the Skeptical View. Omissions are not events. "Nothing" has no causal powers. The staff didn't *do* anything to her hip. The fall was caused by gravity, her balance, the floor friction. The staff's "omission" is just the background canvas upon which the real causes played out. We blame them not because they *caused* it, but because they *should have acted*. It's a normative judgment, not a metaphysical one.

  **Elena:** But that lets the lawyer off the hook too easily. If omissions aren't causes, then the staff didn't cause the injury. They just... stood by? That feels like we're stripping the word "cause" of its utility in negligence cases. Look, the log gap is evidence. It proves a specific event didn't occur within a system designed to make it occur.

  **Marcus:** I agree they are negligent! I'm just saying negligence isn't causation. But look at the lawyer's move. He says, "The family didn't check either." If we stick to my view, he's still wrong, but for a different reason. The family had no duty. The staff did. So, on my view, neither the staff nor the family *caused* the fall via omission. But only the staff is *responsible* for the fall via omission.

  **Elena:** See, that creates a disconnect. In law and everyday life, we link responsibility to causation. "You broke it." If I say, "I didn't break it, I just failed to stop it," I'm splitting hairs. But let's tackle your profligacy worry. I can distinguish the staff from the family without giving up on omission causation. I use Contextualism.

  **Marcus:** Go on.

  **Elena:** Causation isn't just about counterfactuals; it's about selecting the *relevant* difference. In the context of an assisted living facility, the "normal course of events" includes scheduled checks. The staff's omission is a deviation from the system's normal functioning. The family's non-checking is *not* a deviation. It's part of the background. So, the staff's omission is a cause; the family's is not. Not because of duty, but because of causal relevance within a system.

  **Marcus:** Ah, but now you've smuggled normativity back in. What defines "normal course of events"? It's the contract! It's the expectation! You're saying the staff's omission is a cause because they were *supposed* to be there. That's exactly my point. You aren't finding a metaphysical difference between the staff's "nothing" and the family's "nothing." You're finding a moral difference.

  **Elena:** Is that a problem? Maybe metaphysics can't be completely divorced from context. Think of a life-support machine. If the power goes out, the generator is supposed to kick in. If it doesn't, we say the generator failure caused the death. We don't say "The Queen of England not sending a battery caused the death," even though counterfactually, if she had, he'd live. We select causes based on what systems are in place to handle the risk.

  **Marcus:** I grant you that we *talk* that way. But the lawyer is using the metaphysical ambiguity to create a moral equivalence. He's saying, "If 'not checking' is the cause, you guys didn't check either." He's treating all omissions as ontologically equal.

  **Elena:** And he's right that ontologically, the staff's "not checking" and the family's "not checking" look the same. They are both absences. But they function differently in the causal structure of that night. The staff was the designated safeguard. Their absence removed a barrier that was actively in place—conceptually speaking.

  **Marcus:** "Conceptually speaking." That's my cue. You're admitting it's a conceptual framework, not a physical push. Here's the strongest version of my view: The world is made of positives. Forces, movements, energies. An omission is a description we layer over the positives. When the lawyer says, "You didn't check either," he is highlighting that there are infinite true descriptions of what didn't happen.
  *   The staff didn't check.
  *   The family didn't check.
  *   The fire department didn't check.
  *   I didn't check.

  If all of these are "causes," the word loses meaning. So, we must admit that "cause" is doing two jobs here. One is physical production (the fall), and one is accountability (the check). The lawyer is conflating them to confuse your friend.

  **Elena:** I worry that if we tell people "Omissions aren't causes," it undermines accountability. It sounds like, "Well, technically, you didn't do anything."

  **Marcus:** No, we tell them: "Causation is the wrong metric for negligence." Negligence is about risk allocation. The facility sold a service: "We will mitigate fall risk via checks." They didn't deliver the service. It doesn't matter if their "not checking" physically caused the fall. It matters that they breached the contract of care. The lawyer is trying to shift the debate from *Contract/Tort* to *Metaphysics* because Metaphysics is messier.

  **Elena:** That's a strong pragmatic point. But I still think there's a metaphysical distinction available. Contrastive Causation. We don't ask, "Did the omission cause the fall?" We ask, "Did the *staff's* omission rather than the *family's* omission cause the fall?"
  When we frame it contrastively, the staff's omission wins out because it was the variable within the controlled environment. The facility is a causal bubble. Inside that bubble, the checks are part of the causal machinery. Outside the bubble (the family), they aren't.

  **Marcus:** I like the "causal bubble" idea. It acknowledges that the facility assumed control. By taking her in, they displaced the family's causal role. Before admission, if the family didn't check, that might be a cause. After admission, the family is causally inert regarding overnight checks because they *can't* check. They handed the causal lever to the staff.

  **Elena:** Yes! So the lawyer's argument fails even on the "omissions are causes" view. Because once the grandma entered the facility, the family's ability to intervene was severed. The staff became the sole agents capable of performing that specific preventative action. So, counterfactually: If the family *had* called, would it have prevented the fall? Maybe. But if the staff *had* checked, it *would* have prevented the fall according to protocol. The staff's omission is a more *direct* cause because it was the proximate safeguard.

  **Marcus:** Okay, I can concede that. The staff's omission is the *legally relevant* cause. But I maintain it's not because "nothing" has causal power. It's because the law treats specific omissions as if they were actions for the sake of liability.
  Here is where I need to warn you, though. If we win on the metaphysics, does it help your friend?
  If I say, "The staff didn't cause it, but they are liable," the lawyer says, "Aha! So you admit they didn't cause it! Then why are you suing for damages based on causation?"

  **Elena:** Right. The lawyer is using the "Nothing can't cause something" intuition to create doubt. "How can a missing log entry break a bone?" It sounds absurd.
  But if I say, "Omissions are real causes," the lawyer says, "Then your family's omission is also a cause."
  It's a Catch-22.

  **Marcus:** It is. And the way out isn't better metaphysics. It's exposing the category error. The lawyer is asking for *sufficient physical causation* in a context that requires *duty-based causation*.
  In a bar fight, if I punch you, I physically cause the injury.
  In a care home, if I don't check, I legally cause the injury *because I was paid to be the physical cause of your safety.*
  The lawyer is trying to treat a care contract like a bar fight.

  **Elena:** So, the advice for your friend? Don't get bogged down in "Did the absence cause the fall?"
  Argue that the facility inserted itself as the necessary condition for safety. By accepting payment for checks, they made the check a part of the causal chain. The family's inability to check is irrelevant because the facility contractually excluded them from that role.

  **Marcus:** Exactly. The "Profligacy Problem" is solved by the contract. The contract specifies *whose* omissions count. The Queen of England's omission doesn't count because she didn't sign a care agreement. The family's omission doesn't count because they transferred that agency. The staff's omission counts because they are the designated preventers.

  **Elena:** So, on my view (Omissions are Causes): The staff's omission is a cause because it was a deviation in the relevant causal system. The family's wasn't.
  On your view (Omissions are Not Causes): Neither caused it physically, but the staff is solely responsible normatively because they held the duty.

  **Marcus:** And in both cases, the lawyer's "You didn't check either" argument collapses.
  On your view: The family wasn't part of the causal system.
  On my view: The family didn't have the duty.
  The lawyer is trying to mix the two views to get the worst of both worlds. He wants the moral equivalence of my view (everyone could have checked) without the normative rigor (but only we had a duty).

  **Elena:** It's a sophistry. They want to treat the omission as "nothing" when it suits them (so they didn't physically hurt her), but treat it as "something" when it suits them (so your inaction is equivalent to theirs). They can't have it both ways.

  **Marcus:** Precisely. If the missed check is "nothing," then the family's missed check is "nothing," and neither is liable for "nothing."
  If the missed check is "something" (a breach of care), then the staff's is a breach, and the family's is not.
  There is no middle ground where the staff's nothing and the family's nothing are equal causes.

  **Elena:** *Takes a sip of tea.* So, the metaphysics actually clears up the mud. Whether omissions are causes or not, the distinction between the staff and the family remains robust. It's either a causal distinction (system relevance) or a normative one (duty). The lawyer is hoping the confusion between the two will make the family give up.

  **Marcus:** Tell your friend this: The lawyer isn't arguing metaphysics because he cares about truth. He's arguing metaphysics because it's expensive. He wants to force you into a debate about the nature of "nothing" so you forget to talk about the logbook.
  The logbook is the key. It proves the system failed. Whether that failure is a "cause" or a "breach," the result is the same: Liability.

  **Elena:** And if they push the "You didn't check" line again?

  **Marcus:** You say: "We paid you to be the ones who check. By taking that money, you absorbed the causal responsibility. You can't outsource the blame back to us after you outsourced the care to yourselves."

  **Elena:** *Smiles.* That's good. That's better than counterfactuals.

  **Marcus:** Philosophy is useful, sometimes. Even when the world is made of positives, contracts are made of promises. And they broke theirs.

  **Elena:** Cheers to that.

  **Marcus:** Cheers. Now, let's hope your grandma's hip heals faster than this legal mess.
