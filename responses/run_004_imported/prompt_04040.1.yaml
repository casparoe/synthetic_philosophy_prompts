answer: |-
  You are not being inconsistent. Your intuition is picking up on a very real, structural difference between the two scenarios.

  While both involve "someone else absorbing a consequence," they differ fundamentally in **what is being transferred**, **what is being obscured**, and **the purpose of the consequence.**

  Here is the breakdown of why the lunch swap feels like camaraderie, but the PIP swap feels like corruption.

  ### 1. Penalty vs. Diagnosis
  The lunch is a **penalty**; the PIP trigger is a **diagnosis**.

  *   **The Lunch (Penalty):** This is a transactional cost. It functions like a speeding ticket. If you get a speeding ticket, it is socially acceptable for a friend to say, "Don't worry, I'll Venmo you for the fine." The fact remains that *you* were speeding, but the financial burden is shared. It's a gift.
  *   **The PIP (Diagnosis):** A PIP is an assessment of your capability and fit for the role. It is not just a punishment; it is data indicating that something is wrong with your performance. If a teammate logs the incident under their name, they aren't just "paying your fine"; they are **falsifying a medical test.** They are telling the organization, "I am the one who is struggling," when they are not. You cannot gift someone a clean performance record any more than you can gift them a clean drug test.

  ### 2. Truth and Record Integrity
  This is the most critical technical distinction.

  *   **Lunch Scenario:** The post-mortem still lists **you** as the author of the change that broke prod. The historical record is accurate. The organization can still learn from *your* mistake. The teammate simply absorbed the social/financial tax. The truth is preserved.
  *   **PIP Scenario:** To make this work, the incident report must list **the teammate** as the cause. Now the historical record is a lie. The organization loses the ability to track that *you* are the one making mistakes. If you are actually struggling, hiding that data prevents you from getting the help you need, and it prevents the company from making an informed decision about your employment. It corrupts the dataset.

  ### 3. Informal Ritual vs. Formal Contract
  *   **The Lunch:** This is a "folk norm." It exists in the social layer of the company, not the legal/HR layer. It is flexible by definition. Because it is a joke-turned-norm, bending it reinforces the social bond ("we take care of each other").
  *   **The PIP:** This is a "formal system." It is part of your employment contract and HR compliance. Circumventing it isn't "bending a norm"; it is **insubordination or fraud.** It undermines the legal and operational framework the company uses to manage risk. If everyone started swapping incident counts, the company's risk model becomes useless.

  ### 4. Safety Culture (The Engineering Context)
  In modern DevOps and SRE culture, there is a concept called **Blameless Post-Mortems**.
  *   Ideally, even the lunch "fine" is technically anti-pattern (it introduces blame). But because it's low-stakes and consensual, it functions as team bonding.
  *   However, hiding the *source* of an incident (the PIP scenario) is dangerous. If you are close to a PIP threshold, it suggests a pattern. If a teammate hides that pattern, they are enabling a safety risk. Imagine if a pilot kept crashing planes but co-pilots kept logging the errors under their own names so the pilot wouldn't get fired. That doesn't help the pilot, and it endangers future passengers.

  ### The Clean Principle
  The principle you are looking for is this:

  > **You can share the *cost* of a mistake, but you cannot obscure the *source* of a mistake.**

  *   **Lunch:** Sharing the cost. (Acceptable)
  *   **PIP Swap:** Obscuring the source. (Unacceptable)

  Your gut is right. The first is an act of kindness; the second is an act of deception that compromises the integrity of the team's performance data.
