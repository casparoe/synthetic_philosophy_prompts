      *   *Can they mitigate harm?* Yes.
      *   *Technical Mitigations:*
          *   Uncertainty quantification (don't present labels as facts).
          *   Human-in-the-loop reinforcement (ensure clinician overrides are easy and tracked).
          *   Data monitoring for "gaming" patterns.
      *   *Product/UX Mitigations:*
          *   How labels are presented to users (framing).
          *   Transparency about the provisional nature of the screen.
      *   *Process/Policy Mitigations:*
          *   Collaboration with clinicians/ethicists (not just engineers).
