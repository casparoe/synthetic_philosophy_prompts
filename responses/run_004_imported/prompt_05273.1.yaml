answer: |-
  **TO:** Workshop Members
  **FROM:** Craft-and-Conduct Committee
  **RE:** Guidance for Thursday's Session and Future Critique Policy

  **Context**
  This Thursday, we will address feedback regarding recurring character patterns across three manuscripts by the same author. To align with our guideline to critique "the manuscript on the page" rather than the author's psychology, the Committee offers the following clarification on how representational patterns function as craft.

  **1. Addressing the "Dating Preference" Analogy**
  The argument that "no one owes attraction" applies to interpersonal dating, where we encounter existing people and navigate involuntary chemistry. Fiction is not discovery; it is creation. An author does not encounter characters; she constructs them. When a specific body type or race is consistently excluded from desirability across a body of work, this is not a reflection of involuntary taste, but a deliberate world-building choice. Critiquing this pattern is not policing private desire; it is analyzing the *narrative consequences* of that design. Just as we would critique a world where gravity only works for villains, we may critique a world where humanity is only granted to specific bodies.

  **2. Recommendation for Thursday's Session**
  Discussion will be permitted, but must remain framed in craft terminology.
  *   **Focus:** Feedback should address the *cumulative thematic effect* of the pattern on the narrative ecosystem, not the author's personal preferences.
  *   **Permissible Questions:** "What does this recurring alignment of virtue/beauty suggest about the story's moral universe?" or "Does limiting desire to one archetype reduce the narrative tension or realism of the world?"
  *   **Impermissible Statements:** "You should find these people attractive" or "This makes you a bad person."
  *   **Goal:** To determine if the pattern serves the story's aims or unintentionally narrows its resonance.

  **3. Standing Policy: Pattern as Craft**
  Moving forward, the Committee clarifies that "the manuscript on the page" includes **recurring textual patterns across a portfolio.**
  *   **Isolated Incidents:** A single character's description is a character choice.
  *   **Recurring Patterns:** A consistent exclusion or inclusion across multiple works constitutes a **theme** or **motif**.
  *   **Policy:** Themes are intrinsic to craft and are therefore subject to critique. Feedback on representation is permissible when it addresses how the pattern functions textually (e.g., coding, symbolism, world-building consistency) rather than speculating on the author's intent or identity.

  We enter Thursday's session with the understanding that we are analyzing the text's claims about value, not the author's right to write.

  **The Craft-and-Conduct Committee**
