prompt: |-
  I sit on the three-person craft-and-conduct committee of an invitation-only workshop for novelists I've belonged to for a decade. Across three novels-in-progress by the same member, every desirable love interest is thin, white, and conventionally attractive, while characters who are fat, disabled, or people of color stay comic or minor; several members now want the pattern itself discussed, not each book taken in isolation. The author says her characters' desires are simply hers, that nobody owes attraction to any body, and that calling this a "pattern" merely polices her taste as craft notes; she cites the standard reply in online dating debates, that no one owes anyone attraction, as proof the objection fails. Others answer that a pattern spanning an entire body of work is a public claim about who counts as desirable, not a private taste, and is exactly what craft critique is for. Our guidelines commit facilitators to feedback on "the manuscript on the page," not the author's psychology or politics, without saying where that line falls. Please draft the committee's short written guidance for Thursday's session: a concrete recommendation, a brief standing policy for future cases like it, and a genuine answer to the dating-preference analogy rather than a restatement of "craft, not politics."
reasoning: |-
  Here's a thinking process that leads to the suggested guidance:

  1.  **Analyze the Situation:**
      *   **Context:** Invitation-only novelist workshop (10 years running).
      *   **Role:** Three-person craft-and-conduct committee (facilitators).
      *   **Issue:** One member's three novels-in-progress all feature thin, white, conventionally attractive love interests. Fat, disabled, or POC characters are comic/minor.
      *   **Conflict:** Other members want to discuss the *pattern* across the body of work. The author argues this is "private taste/desire" (citing the "no one owes attraction" dating analogy) and that critiquing it polices her craft.
      *   **Constraints:** Guidelines say feedback must be on "the manuscript on the page," not author's psychology/politics. The line is blurry.
      *   **Task:** Draft short written guidance for Thursday's session.
      *   **Requirements:**
          1.  Concrete recommendation for *this* session.
          2.  Brief standing policy for future cases.
          3.  Genuine answer to the "dating preference" analogy (not just "craft, not politics").

  2.  **Deconstruct the Core Conflict:**
      *   *Author's Stance:* Desire is innate/private. Critiquing it is personal policing. "No one owes attraction."
      *   *Critics' Stance:* A published work (or workshopped work aiming for publication) is a public artifact. Repetitive exclusion creates a thematic argument about value/desirability.
      *   *Committee's Stance:* Need to uphold guidelines ("manuscript on the page") while addressing the legitimate craft concern without violating the "no psychology" rule.

  3.  **Address the "Dating Preference" Analogy:**
      *   *Why it fails here:* Dating is interpersonal/private. Fiction is constructed/public. In dating, you choose from existing people. In fiction, the author *creates* the people. Excluding certain bodies from *existence* as desirable subjects in a fictional world is a world-building choice, not a biological reflex.
      *   *Key Distinction:* Discovery vs. Creation. Attraction in life is often discovered; attraction in art is *designed*.

  4.  **Formulate the Concrete Recommendation (For Thursday):**
      *   Need to allow the discussion but frame it correctly.
      *   Don't tell the author who to desire. Tell the author to look at the *effect* of the pattern on the narrative.
      *   Focus on "World-Building" and "Thematic Consistency."
      *   Action: Allow feedback on the *cumulative effect* of character design across the three manuscripts as a single body of work (since the author is presenting them as a trajectory).
      *   Framing: Is this pattern serving the story, or is it limiting the story's resonance?

  5.  **Formulate the Standing Policy:**
      *   Need to clarify "manuscript on the page."
      *   Repetition across a body of work *is* a craft element (motif, theme).
      *   Distinguish between "who the author likes" and "who the text values."
      *   Policy: Critique of representational patterns is permissible when framed as narrative consequence, not moral judgment.

  6.  **Drafting - Section by Section:**

      *   *Header:* Clear and professional.
      *   *Introduction:* Acknowledge the tension.
      *   *The Analogy (The "Why"):* This needs to be the strongest part. Address the "no one owes attraction" argument directly.
          *   *Drafting thought:* "In life, we encounter people. In fiction, we invent them. Therefore, exclusion is a choice, not a limitation."
      *   *Recommendation for Thursday:* How to run the room.
          *   *Drafting thought:* Focus on "narrative ecosystem." Ask: What does this world say about value?
      *   *Standing Policy:* Future-proofing.
          *   *Drafting thought:* "Pattern as Craft." If it happens once, it's a character. If it happens three times, it's a theme. Themes are fair game.

  7.  **Refining the Tone:**
      *   Must be neutral but firm.
      *   Avoid accusatory language.
      *   Avoid woke-jargon that might trigger defensiveness, but don't dilute the point.
      *   Stick to *craft* terminology (world-building, thematic resonance, character function).

  8.  **Review against Constraints:**
      *   *Concrete recommendation?* Yes (focus on cumulative world-building).
      *   *Standing policy?* Yes (patterns = theme).
      *   *Answer to dating analogy?* Yes (Creation vs. Discovery).
      *   *Short?* Needs to be concise.

  9.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound like I'm taking the critics' side entirely. I need to validate the author's right to write what she wants, but clarify the *critique's* right to analyze the effect.
      *   *Adjustment:* Emphasize that the critique isn't "change your taste," it's "examine the narrative cost of this taste."
      *   *Refining the Analogy:* The dating analogy assumes attraction is passive. Writing is active. That's the crux.

  10. **Final Output Generation** (similar to the provided good response).
