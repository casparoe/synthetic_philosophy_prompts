      *   *Nuance:* It's not exactly a *reductio ad absurdum* in the logical sense (proving the premise false). It's more of a *political deterrent*. He is telling the British elite: "You want to keep the colonies? Fine, but the price is losing London as the capital. You won't like that. So, since you won't accept the union, you should grant independence."
      *   *Scholarly Consensus (Mental Check):* Most Smith scholars (e.g., Winch, Rothschild, Viner) view this as a "hypothetical concession." Smith admits the logic of the union leads to American dominance. He uses this to highlight the incompatibility of British pride and imperial reality. It supports the "let them go" argument not by proving the union impossible, but by proving it unacceptable to the British ruling class.
      *   *Synthesis:* It functions *like* a reductio in its rhetorical effect (making the union look unpalatable), but it is a *genuine theoretical prediction* based on his economic principles (wealth = power). He isn't lying about the growth rate. He is using the inevitability of the shift to scare the British into letting go.

