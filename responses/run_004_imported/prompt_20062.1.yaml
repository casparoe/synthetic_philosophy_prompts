answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal for Protocol on Probabilistic Evidence and AI Detection Scores

  **Purpose**
  As we prepare for the upcoming semester, we must address the increasing volume of cases involving AI-generated text. Currently, the Board operates under a working assumption that detector scores above a fixed threshold (e.g., 80%) function as decisive evidence of misconduct. This memo recommends adopting a new **Integrated Evidence Protocol**. This protocol rejects the use of detector scores as standalone verdicts and mandates a specific review sequence to eliminate order-dependent bias. I propose this policy take effect on **January 1, 2024**, allowing time for training before the spring term.

  **The Epistemic and Administrative Problem**
  Our current practice treats a detector's probability score (e.g., "82% likely AI") as a certainty. In formal terms, we are conditionalizing on the proposition *This essay is AI-generated* as if it were true, rather than treating the score as uncertain evidence that shifts our credence.

  This creates two specific risks:
  1.  **False Certainty:** Detector scores are fallible. Treating an 82% score as a fact ignores the 18% probability of error, which is unacceptably high for academic misconduct findings that carry permanent record implications.
  2.  **Order Sensitivity:** Evidence arrives in stages (detector score, stylometric comparison, student hearing). Our current deliberation process updates our confidence sequentially as each piece arrives. Research in decision theory demonstrates that when evidence is uncertain, the order in which it is considered influences the final conclusion. Two identical cases could yield different verdicts simply because Board A heard the student's testimony *before* seeing the detector score, while Board B saw the score *first*. This violates the principle of treating like cases alike.

  **The Threshold-Rule Defense and Its Limits**
  Proponents of the bright-line threshold argue that volunteer faculty cannot reconstruct Bayesian posteriors for hundreds of cases a year. Efficiency is a valid concern; a protocol that requires complex calculation at every hearing is unsustainable.

  However, efficiency cannot justify systematic error. A bright-line threshold is only efficient if it is accurate. If the threshold locks in false positives due to order effects or instrument error, we invite appeals, reputational damage, and unjust sanctions. The administrative burden of a slightly more rigorous review is less costly than the institutional risk of erroneous findings. We can achieve epistemic rigor without mathematical complexity by restructuring *when* we deliberate, not *how* we calculate.

  **Recommended Protocol: Integrated Evidence Review**
  I recommend the Board adopt the following three-point protocol immediately:

  **1. No Single-Source Convictions**
  A detector score, regardless of magnitude, shall never constitute sufficient evidence for a misconduct finding on its own. It must be corroborated by at least one additional independent line of evidence (e.g., stylometric analysis, draft history, or admission). The detector score is an *input* for deliberation, not a *verdict*.

  **2. Batched Evidence Deliberation (Mitigating Order Effects)**
  To eliminate order-sensitivity, the Board shall not deliberate on a case until the full file is complete.
  *   **Procedure:** The Case Officer will compile the detector score, stylometric report, and transcript of the student hearing into a single packet.
  *   **Constraint:** Board members are prohibited from discussing or voting on the case until they have reviewed the complete packet. This forces a simultaneous evaluation of all uncertain evidence, effectively bypassing the sequential updating problem that leads to inconsistent verdicts.

  **3. Final Credence Standard**
  We replace the *input* threshold (e.g., "Score > 80%") with an *output* standard. A finding of misconduct requires a Board consensus that the probability of violation meets the "Clear and Convincing" standard (operationally defined as >90% collective confidence) based on the *totality* of the batched evidence.

  **Implementation Timeline**
  *   **November 7, 2023:** Board vote on this protocol.
  *   **December 1, 2023:** Training session for Case Officers on compiling "Batched Evidence Packets."
  *   **January 1, 2024:** Protocol takes effect for all new cases.

  **Conclusion**
  This proposal respects the Board's time constraints while correcting a known epistemic vulnerability. By batching evidence, we remove the arbitrariness of presentation order. By rejecting single-source convictions, we acknowledge the fallibility of our tools. I ask that the Board vote to adopt this protocol at our meeting in two weeks.
