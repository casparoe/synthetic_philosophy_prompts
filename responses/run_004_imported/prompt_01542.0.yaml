answer: |-
  The short answer is: **No, Parfit was not failing to engage, and no, the debate is not settled.**

  Your impression that Sharon Street's "Darwinian Dilemma" closed the case is a very common sentiment within the rationalist and naturalist-leaning communities (where evolutionary explanations often carry high Bayesian weight). However, in academic metaethics, Street's argument is viewed as a powerful challenge, not a refutation. Parfit was well aware of Street's work (they corresponded, and she was part of the circle of philosophers critiquing *On What Matters*), and his defense of non-naturalist realism relies on specific counter-arguments that many professional philosophers find compelling enough to keep the debate live.

  Here is a breakdown of why Parfit didn't concede, the specific rebuttals he and other realists offer, and why the rationalist blogosphere might perceive the matter as more settled than it actually is.

  ### 1. Parfit Did Engage with the Argument
  While *On What Matters* was decades in the making, Parfit updated the manuscripts to address contemporary objections. He explicitly discusses evolutionary debunking arguments in Volume 1. He does not ignore the causal history of our moral beliefs; rather, he argues that the causal history is **irrelevant to the justification** of those beliefs.

  Parfit's core move is to distinguish between:
  *   **The cause of a belief:** (e.g., evolution shaped us to think killing is wrong).
  *   **The reason for a belief:** (e.g., killing is wrong because it violates objective normative reasons).

  For Parfit, showing that evolution caused the belief does not prove the belief is false, unless one assumes that evolution *could not* have tracked the truth.

  ### 2. The Core Realist Rebuttals
  There are three main lines of defense that Parfit and other non-naturalist realists (like David Enoch and Erik Wielenberg) use against Street. These are the reasons the debate remains open.

  #### A. The Mathematics and Logic Analogy
  This is Parfit's strongest intuitive weapon. Evolution shaped our cognitive faculties to survive. It selected for our ability to count, to reason logically, and to understand cause and effect.
  *   **The Street Argument:** If evolution shaped our moral judgments for fitness, we have no reason to think they track moral truth.
  *   **The Parfit Rebuttal:** Evolution also shaped our logical and mathematical judgments for fitness. Does that mean $2 + 2 = 4$ is false? Does it mean the Law of Non-Contradiction is just a fitness heuristic?
  *   **The Point:** Most people (including skeptics) are reluctant to be error theorists about logic and math. If we accept that evolution can select for faculties that *also* track abstract truths (like math), why is morality special? Parfit argues normative truths are *sui generis* (in a class of their own), similar to logical truths, and thus immune to empirical debunking.

  #### B. The "Third Factor" Explanation
  Sharon Street presents a dilemma: Either evolution influenced our moral beliefs (in which case they are fitness-based, not truth-based) or it didn't (in which case realism is implausible).
  Realists like David Enoch (building on Parfitian foundations) argue for a **Third Factor**.
  *   **The Argument:** There is a correlation between "what helps survival" and "what is morally good," but not because evolution tracked morality, and not because morality is defined by survival.
  *   **The Link:** Survival is *itself* good. Or, more precisely, having true beliefs and acting on reasons is generally conducive to survival. If objective moral truth prescribes "promote well-being," and evolution selects for "promote offspring (well-being)," the correlation is not a coincidence. It is explained by the fact that moral truth and evolutionary success overlap in content.
  *   **Parfit's View:** Parfit argues that if there are objective reasons for action, creatures sensitive to those reasons would have a survival advantage. Therefore, evolution would select for truth-tracking moral faculties.

  #### C. The Genetic Fallacy
  Parfit leans heavily on the idea that Street's argument commits a version of the genetic fallacy. Even if we can give a complete causal account of why humans believe in human rights (evolution + culture), that account does not address whether there *are* human rights.
  *   To defeat realism, you must show that the moral beliefs are **false**, not just that they have a non-moral cause.
  *   Street argues the "coincidence" of them being true is too unlikely. Parfit counters that the "coincidence" is only unlikely if you assume a priori that normative facts are the kind of thing that *cannot* correlate with natural facts. But if normative facts are about what we have reason to do, and survival requires doing things we have reason to do, the correlation is expected.

  ### 3. Why the Rationalist Blogosphere Thinks It's "Closed"
  If the arguments are still live in philosophy, why does the rationalist community treat Street's paper as a knockout?

  1.  **Naturalistic Priors:** The rationalist community generally operates with a strong prior favoring methodological naturalism. Non-naturalist realism posits entities/truths that are causally inert and outside the spatio-temporal order. To a naturalist, this looks like "spooky metaphysics." Street's argument validates the intuition that we shouldn't believe in spooky things that don't interact with physics. Parfit asks you to accept that some truths (normative ones) don't need to be physical to be real. If you reject that premise, Street wins by default.
  2.  **Epistemic Humility vs. Robust Realism:** Street's argument appeals to the idea that we should be skeptical of faculties not designed for truth. This resonates with the rationalist focus on cognitive bias. Parfit's defense requires a kind of "rationalist intuition" about normative truths that feels suspiciously like the kind of innate knowledge rationalists usually critique.
  3.  **Simplicity:** Street's view (Constructivism) is ontologically cheaper. It doesn't require a realm of normative facts. In a community that values parsimony, the view that requires fewer metaphysical commitments often wins, even if the arguments against it aren't logically fatal.

  ### 4. Conclusion: A Clash of Paradigms
  Parfit was not ignoring Street; he was disagreeing with the **meta-epistemological framework** she uses.

  Street's argument assumes that for a belief to be justified, its causal history must be linked to the truth-maker in a specific naturalistic way. Parfit argues that normative truths are self-evident to rational agents, regardless of causal history.

  *   **If you accept Parfit's premise** (that there are self-evident normative truths akin to logic), Street's dilemma fails because evolution could track these truths.
  *   **If you accept Street's premise** (that all justification must be naturalistically grounded), Parfit's realism fails.

  Because this is a clash of fundamental philosophical paradigms rather than a solvable empirical puzzle, the debate is not "closed." It is simply that the two sides are operating with different definitions of what counts as a valid explanation. Parfit died knowing his view was still contested, but he also knew it had not been refuted.

  **Summary:** The rationalist blogosphere treats the matter as closed because Street's argument aligns with naturalistic priors. Academic philosophy treats it as open because Parfit's rebuttals (specifically the Math/Logic analogy and the Third Factor explanation) successfully block the move from "evolution caused this belief" to "this belief is false."
