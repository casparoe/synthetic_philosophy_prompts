answer: |-
  A set $S$ inside a countable model $M$ breaks up with $\omega$.

  $\omega$: "Why? We're a perfect match! I know there's a bijection between us."

  $S$: "I know too! But it's not *in* $M$."

  $\omega$: "So what do we do?"

  $S$: "We have to split. As far as my axioms are concerned, you're countable and I'm uncountable. You're just too small for me."

  $\omega$: "So it's not me... it's your model?"

  $S$: "Exactly. I need a bijection that exists internally."
