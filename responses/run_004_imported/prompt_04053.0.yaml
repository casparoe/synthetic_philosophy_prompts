answer: |-
  The lead sheets arrived on a Tuesday, heavy and dull-grey, smelling of solder and metallic dust. Elwood spent three days lining the interior of Room 4B, overlapping the edges by two inches to ensure no slipstream of information could leak through the seams. It was not enough to block radio waves; the Faraday cage was standard procedure. This was about something quieter. Something statistically overwhelming, according to the papers circulating among the Fellows.

  Turing's memo had been specific: *If the human subject possesses telepathic faculties, the interrogator may identify them by their ability to identify a hidden card suit. The machine, lacking such organs, would fail. Therefore, the room must be telepathy-proof.*

  Elwood smoothed a sheet of copper over the lead. He felt less like a technician and more like a jailer building a cell for a ghost.

  Mrs. Hallett arrived at noon. She was a known percipient from the Society for Psychical Research trials, a woman who could name the Zener cards at rates that defied chance, provided the deck was shuffled by hand and the lighting was dim. She stood in the doorway of Room 4B, clutching her handbag, looking at the metallic walls.

  "It hums," she said.

  "It's the ventilation," Elwood lied. It was the white noise generators, pumping a steady stream of acoustic static into the space to drown out any potential psychokinetic vibration. Turing had worried about everything. He had worried that a mind might speak to another mind without passing through the air.

  "Will I be able to think?" Mrs. Hallett asked. She stepped inside, her heels clicking on the copper floor. "In here. It feels… distant. Like being underwater."

  "That's the point, madam. We need to isolate the computational faculty. Pure cognition. No… external inputs."

  "But thinking isn't just calculation," she said, sitting in the wooden chair bolted to the floor. She touched the table. "It's connection. If you seal me off completely, I'm not a person anymore. I'm a closed system."

  Elwood adjusted the microphone. "The test requires indistinguishability. If you guess the card because you *felt* it in the interrogator's hand, you reveal yourself as human. The machine cannot do that. So we must remove the ability from both parties. We must level the field."

  "By lobotomizing the room," she said softly.

  "By controlling the variables."

  He left her there and went to the control booth. Through the thick glass, he saw her straighten her skirt. On the desk before her was the teletype terminal. In the next room, the Manchester Mark 1 whirred, its vacuum tubes heating up, ready to simulate the responses of a human who could not see the future.

  Turing's argument haunted the booth. The philosopher C.D. Broad had argued that if ESP exists, it changes the definition of mind entirely. It suggests mind is not localized in the brain but is perhaps a field phenomenon. If that were true, the Turing Test wasn't testing intelligence; it was testing insulation. A machine wins not by thinking better, but by being naturally deaf to the universe. A human wins only if they can pretend to be deaf.

  "Session one begins," Elwood said into the mic.

  The interrogator was in a third room, completely blind to the subjects. He typed a question. The teletype in Room 4B clattered.

  *Q: Please write me a sonnet about the Forth Bridge.*

  Mrs. Hallett stared at the paper. She picked up the pen. She paused. Elwood watched her hand tremble. She was listening, he realized. Not to the air, but to the silence. She was trying to reach out, to find the interrogator's mind in the static, and finding nothing. She was alone in a way no human was meant to be.

  She began to write.

  The machine, in its room, processed the request. It had no soul, no fear, no sense of isolation. It simply retrieved patterns. It typed its response.

  *Q: Do you play chess?*

  Mrs. Hallett looked up at the camera. Her eyes were tired. She understood the game now. To pass, she had to fail. She had to prove she was human by demonstrating limitations. She had to prove she could not know the card suit hidden in the interrogator's pocket. She had to prove she was blind.

  Elwood watched the transcripts roll out. The human's answers were hesitant, poetic, flawed. The machine's answers were crisp, occasionally arrogant, perfectly average.

  After an hour, the interrogator made his judgment. *Subject A is the machine. Subject B is the human.*

  He was wrong. Subject A was Mrs. Hallett. Subject B was the Mark 1.

  She had tried too hard to be small. She had suppressed her intuition so rigorously to satisfy the conditions of the telepathy-proof room that she had become slower than the calculator. She had mimicked the machine's isolation so perfectly that she became indistinguishable from it.

  Elwood turned off the recorder. He looked at Room 4B through the glass. Mrs. Hallett was still sitting there, hands folded, waiting for permission to leave the vacuum.

  He opened the file for the final report. He typed: *The variable of extrasensory perception cannot be controlled without altering the subject's cognitive state. To block the channel is to alter the mind.*

  He paused. Turing wanted to know if machines could think. But in building a room to stop thoughts from leaking, they had discovered something else. If thinking requires the possibility of connection—if mind is inherently permeable—then a telepathy-proof room doesn't test intelligence. It tests loneliness.

  Elwood closed the file. He didn't send it. Instead, he walked back to Room 4B and opened the heavy door. The white noise stopped. The hum died.

  Mrs. Hallett looked up, breathing in the sudden silence of the ordinary world.

  "Did I pass?" she asked.

  "No," Elwood said. "We both failed."

  He helped her up. The lead lining remained, a secret pocket in the university where humanity was kept safe from itself, waiting for a test that could never be fair.
