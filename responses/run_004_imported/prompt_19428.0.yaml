      *   *Approve:* Too risky ethically. Ignores the valid concerns about coercion and vulnerability immediately post-surgery.
      *   *Approve with Conditions:* This is the sweet spot. It acknowledges the scientific value but imposes strict safeguards to mitigate the exploitation risk. It shows the REB is doing its job (protecting subjects) without stifling important research.

  3.  **Identify Key Ethical Concerns:**
      *   **Vulnerability:** Patients are from low-resource settings, receiving free life-changing care.
