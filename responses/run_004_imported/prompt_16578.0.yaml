answer: |-
  This is one of those "wait, what?" moments that separates the mechanical understanding of Bayes from the intuitive feel of it. Your friend is right: Jeffrey conditionalization generally does not commute.

  The reason this breaks your intuition is that you are treating Jeffrey updates like **facts**, but they are actually **state changes**.

  Here is the intuitive walkthrough, using a concrete analogy that avoids heavy algebra.

  ### 1. The Mechanism: What is actually being fixed?

  To see why order matters, we have to look at what the rule *preserves* versus what it *changes*.

  *   **Standard Conditionalization:** You learn $E$ is true. You set $P(E) = 1$. You preserve the likelihood ratios $P(E|H) / P(E|\neg H)$ (effectively infinite).
  *   **Jeffrey Conditionalization:** You don't learn $E$ is true. You learn that your confidence in $E$ should *become* $q$. The rule says: **Fix the final probability of $E$ to be $q$, but preserve the conditional probabilities $P(H|E)$ and $P(H|\neg E)$ from the prior.**

  Think of Jeffrey updating as **mixing paint**.

  Imagine your probability distribution is a bucket of paint.
  *   **Hypothesis $H$** is the color hue (say, Greenness).
  *   **Evidence $E$** is a property of the paint, like "Transparency."
  *   **Evidence $F$** is another property, like "Viscosity."

  A Jeffrey update on $E$ says: "Adjust the mixture until the Transparency is exactly 20%, but keep the Greenness-of-the-Transparent-part and Greenness-of-the-Opaque-part exactly the same as they were before."

  ### 2. The Paint Analogy (Why Order Matters)

  Let's say you start with a base coat of Grey Paint (your Prior).
  *   **Update 1:** "Adjust the mix until it is **20% Red**."
  *   **Update 2:** "Adjust the mix until it is **20% Blue**."

  **Scenario A: Red first, then Blue**
  1.  You take the Grey paint. You add Red pigment until the total mixture is 20% Red. (Now you have Pinkish-Grey).
  2.  Now you apply the second instruction: "Make it 20% Blue." To do this, you have to add Blue pigment (and likely some base to maintain volume ratios, or just dilute).
  3.  **Crucial Point:** As you add Blue to reach the 20% Blue target, you are *diluting* the Red. The Red percentage drops below 20%.
  4.  **Final State:** 20% Blue, <20% Red.

  **Scenario B: Blue first, then Red**
  1.  You take the Grey paint. You add Blue pigment until the total mixture is 20% Blue. (Now you have Bluish-Grey).
  2.  Now you apply the second instruction: "Make it 20% Red."
  3.  As you add Red to reach the 20% Red target, you *dilute* the Blue. The Blue percentage drops below 20%.
  4.  **Final State:** 20% Red, <20% Blue.

  **Result:** The final buckets are different colors. The order changed the outcome.

  In Jeffrey conditionalization, the "partitions" (Red/Not-Red and Blue/Not-Blue) overlap probabilistically. When you fix the probability of the second partition, you inevitably drag the probability of the first partition away from the value you set in step 1. Since the second step "wins" the fight over the final probability mass, the last update determines its own marginal probability accurately, but distorts the marginal probability of the earlier update.

  ### 3. The "Signal Strength" Explanation (For the Rationalist Brain)

  If the paint analogy feels too physical, here is the information-theoretic reason, which usually clicks for people coming from LessWrong.

  In Bayesian terms, an update is defined by its **Likelihood Ratio**.
  If I tell you "I saw $E$," that implies a specific Likelihood Ratio $P(E|H) / P(E|\neg H)$. This ratio is a property of the world and your sensors; it *should not* depend on what you believed beforehand.

  However, a Jeffrey update doesn't give you a Likelihood Ratio. It gives you a **Posterior Probability** ($P_{new}(E) = q$).

  To turn that Posterior into a Likelihood Ratio, you have to compare it to the **Prior**:
  $$ \text{Implied Likelihood Ratio} \approx \frac{P_{new}(E) / P_{new}(\neg E)}{P_{old}(E) / P_{old}(\neg E)} $$

  Notice the denominator? **$P_{old}(E)$**.

  *   **If you update $E$ first:** The "strength" of the evidence is calculated relative to your *original* prior.
  *   **If you update $F$ first:** Now you update $E$. But your "prior" for $E$ is no longer the original one; it's the probability of $E$ *after* you thought about $F$.

  Because $E$ and $F$ are likely correlated, thinking about $F$ changed your confidence in $E$.
  *   If $F$ made you *more* confident in $E$, then the instruction "Set $P(E)$ to 0.8" requires a *weaker* Likelihood Ratio than it would have originally (since you were already partway there).
  *   If $F$ made you *less* confident in $E$, the instruction "Set $P(E)$ to 0.8" requires a *stronger* Likelihood Ratio (you have to overcome the doubt $F$ introduced).

  So, the command "Set $P(E) = 0.8$" literally means different things depending on when you receive it. It encodes a different amount of information depending on the state of your brain when you hear it.

  ### 4. Why Standard Conditionalization Commutes

  Why doesn't this happen with normal Bayes?

  In standard conditionalization, you set $P(E) = 1$.
  Mathematically, 1 is an **absorbing boundary**.
  Once $P(E) = 1$, no amount of subsequent updating on $F$ can drag $P(E)$ away from 1 (unless $F$ logically contradicts $E$, in which case your probabilities explode to 0/0).

  When you condition on $E$, you are effectively deleting all worlds where $\neg E$ is true. When you subsequently condition on $F$, you are deleting worlds where $\neg F$ is true *from the remaining set*.
  The set of worlds where ($E$ is true AND $F$ is true) is the same regardless of which deletion you did first. Intersection is commutative ($A \cap B = B \cap A$).

  Jeffrey conditionalization doesn't delete worlds; it **re-weights** them. And as the paint analogy shows, re-weighting is path-dependent.

  ### Summary

  Your intuition that "the same info should land you in the same place" is correct for **facts** (Standard Conditionalization).

  But Jeffrey updates aren't facts. They are **instructions to adjust your confidence**.
  *   "Become 80% sure of $E$."
  *   "Become 80% sure of $F$."

  If $E$ and $F$ are related, the effort required to become 80% sure of $F$ depends on whether you already tweaked your confidence in $E$. By specifying the *destination* ($P=0.8$) rather than the *force* (Likelihood Ratio), Jeffrey conditionalization makes the "force" of the evidence dependent on the order of arrival.

  This is actually considered a major bug of Jeffrey Conditionalization by many Bayesians. It suggests that if you want to update on uncertain evidence in a commutative way, you should try to model *why* the evidence is uncertain (e.g., model the reliability of your eyes) and update on *that* using standard conditionalization, rather than using Jeffrey's rule directly. But that's a rabbit hole for another day!
