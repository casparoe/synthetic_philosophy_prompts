      *   **Scientific Reality:** This is a classic example of the *Dunning-Kruger effect* applied to fatigue, or more specifically, *sleep deprivation insight impairment*.
      *   **Key Phenomenon:** When people are sleep-deprived, their ability to self-assess their performance degrades *alongside* their actual performance. They often *think* they are doing fine when they are not.
