      *   *The "Second Wind":* Circadian rhythms can provide a temporary boost in alertness (cortisol spike) that masks underlying cognitive deficit.
      *   *Metacognition:* Fatigue impairs metacognition (thinking about thinking). You lose the ability to judge your own thinking.

  4.  **Formulate the Argument:**
