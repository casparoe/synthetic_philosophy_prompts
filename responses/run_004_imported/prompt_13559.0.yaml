          *   *Verdict:* Marcus hits a nerve. This is the tension between "Sophisticated Substantivalism" and "Haecceitism." If you reject haecceitism to save determinism, you undermine the modal robustness of points.

  3.  **Identify Missing Issues (The "Flag Anything Relevant" part):**
