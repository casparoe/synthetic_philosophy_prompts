      *(Self-Correction on Marcus's Move 3)*: Marcus claims it's "relationalism wearing a costume." This is technically incorrect. Structural realism or sophisticated substantivalism is distinct from relationalism (which denies the existence of the container). I should note that Marcus overstates the collapse into relationalism, even if he's right about the loss of haecceitistic substance.

