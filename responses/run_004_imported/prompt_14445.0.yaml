answer: |-
  The coherence arguments for expected utility (EU) theory posit that rational agency is structurally constrained by the von Neumann–Morgenstern (VNM) axioms. Among these, the Completeness axiom requires that for any two options $A$ and $B$, an agent must either prefer $A$ to $B$, prefer $B$ to $A$, or be indifferent between them. Critics of this requirement argue that agents may legitimately have incomplete preferences, finding some options genuinely incomparable rather than equally valuable. Proponents of the coherence argument reply that incompleteness invites exploitation via money pumps: sequences of trades that leave the agent worse off. A common defense for the incompleteness-tolerant agent is the adoption of a protective policy: "Never pay anything to switch away from your current option unless the alternative is strictly better." This essay argues that while this policy successfully blocks immediate financial exploitation, it does not vindicate incompleteness. Instead, it merely relocates the irrationality from incoherent preferences to an arbitrary, normatively unjustifiable dependence on the status quo. Consequently, a sufficiently reflective agent must resolve incompleteness to avoid this arbitrariness, implying a convergence toward expected utility maximization.

  To understand the defense, one must see how the money pump operates against incomplete preferences. If an agent finds $A$ and $B$ incomparable ($A \parallel B$), a standard pump might offer to switch $A$ for $B$ for a small cost $\epsilon$. If the agent accepts because $B$ is "not worse," they lose $\epsilon$. If they repeat this across a cycle of incomparable options, they bleed money. The proposed policy immunizes the agent by treating incomparability as a strict barrier to paid exchange. If $A \parallel B$, the agent refuses to pay to switch from $A$ to $B$. Since they never pay for a non-strict improvement, they cannot be pumped for profit. Superficially, this preserves the agent's financial coherence without forcing them to fabricate a preference where none exists.

  However, this immunity comes at a steep normative cost. The policy effectively completes the agent's preferences dynamically, but it does so using a criterion that rationality should reject: the accident of possession. By refusing to switch from $A$ to $B$ when $A \parallel B$, but presumably refusing to switch from $B$ to $A$ if they started with $B$, the agent reveals a preference for the status quo. This is not a principled value judgment about the options themselves, but a path-dependent bias. In decision theory, rational choice should depend on the properties of the available options, not on the history of how the agent arrived at them. The policy violates conditions of choice consistency, such as Sen's property $\alpha$ (if an option is chosen from a larger set, it should be chosen from a subset containing it), because the "chosen" option flips based entirely on the endowment.

  This relocation of irrationality manifests as a form of dynamic inconsistency and opportunity loss. Consider an agent who knows they will face a sequence of options $A, B, C$, where all are pairwise incomparable but $C$ offers a higher potential upside than $A$. Ex ante, the agent might prefer a policy that allows switching to explore higher-value options. Yet, ex post, the "never pay" policy binds them to their current holding. The agent is effectively allowing the arbitrary starting point of a trajectory to determine its终点 (endpoint). If rationality is about guiding action toward the best achievable outcomes, a policy that locks an agent into a suboptimal equilibrium simply because it was the starting point is instrumentally defective. The money pump argument is not merely about avoiding sure losses; it is about ensuring that preferences map consistently to choices. The "never pay" policy ensures consistency between choices and *current holdings*, but inconsistency between choices and *values*.

  Furthermore, a sufficiently capable and reflective agent would recognize this arbitrariness as a defect to be corrected. Reflection involves stepping back from immediate decision rules to evaluate their coherence with broader goals. An agent reflecting on the "never pay" policy would see that their final welfare is contingent on luck (what they were endowed with) rather than judgment. To eliminate this contingency, the agent must adopt a tie-breaking rule for incomparable options that is independent of the status quo. They might, for instance, flip a coin, consult a meta-preference, or assign a subjective probability to the potential value of the unknown option. Any such resolution constitutes a completion of preferences. Once preferences are completed, and assuming the agent wishes to avoid other forms of incoherence (like intransitivity), the VNM representation theorem applies. The agent's behavior becomes isomorphic to that of an expected utility maximizer.

  Therefore, the verdict is that the "never pay to switch" policy fails to defeat the money-pump argument for completeness. It succeeds only in trading financial vulnerability for normative arbitrariness. It saves the agent from being money-pumped by a predator, but it leaves them vulnerable to the "pump" of their own unprincipled inertia, where welfare is determined by history rather than value. The irrationality is not removed; it is hidden within the dynamic structure of the policy.

  This assessment implies that a sufficiently capable, reflective agent must eventually converge on maximizing expected utility. While an unreflective agent might sustain incomplete preferences using heuristic policies like status-quo protection, reflection reveals that such policies rely on normatively irrelevant factors. To achieve full coherence and autonomy from arbitrary endowments, the agent is compelled to complete their preferences. Since expected utility theory is the unique framework for representing complete, transitive, and continuous preferences over uncertainty, the drive for coherence necessitates convergence toward EU maximization. Incompleteness may be a psychological reality for bounded agents, but it is not a stable resting point for ideal rationality.
