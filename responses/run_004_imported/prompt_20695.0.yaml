      *   **Section 1: The Jarrett/Shimony Decomposition (Technical Grounding):** Briefly define Factorizability, PI, and OI. Show mathematically/conceptually why QM violates OI but keeps PI. Emphasize that PI = No-Signaling.
      *   **Section 2: Causality requires Controllability:** Define "causal influence" rigorously. If I can't use it to send a bit, is it causality? Argue that SR forbids superluminal *signaling*, not superluminal *correlation*. The "influence" narrative assumes separable local beables, which QM rejects.
