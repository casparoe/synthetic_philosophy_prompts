          *   PI: $P(A | a, b, \lambda) = P(A | a, \lambda)$. (My setting doesn't change your probability).
          *   OI: $P(A | a, b, B, \lambda) = P(A | a, b, \lambda)$. (Your outcome doesn't change my probability, given state).
          *   QM keeps PI, breaks OI.
      *   *Causality:* Why is PI the gold standard? Because of the No-Signaling Theorem. If PI holds, marginal probabilities are independent of distant settings. No information transfer. SR is about information/energy causal cones.
      *   *Holism:* Use the term "Non-separability." The system is $S_{AB}$, not $S_A + S_B$. When we measure $A$, we aren't acting on a local object; we are interacting with the global state. The "collapse" is an update of knowledge about the global constraint, not a physical wave traveling to B.
      *   *The Objection:* This is the hardest part. The objection is: "If it's not causal, what *is* it? It still looks like magic across space. And if you say it's holistic, you admit the physical reality isn't localized, which contradicts the spirit of SR."
