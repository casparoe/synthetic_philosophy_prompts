  7.  (Mental Check of the "Objection"): The objection says: "Even if you call it holism, you still have a correlation between spacelike events that isn't explained by local past factors. Relativity says spacelike events should be independent unless connected by light. You're saying they aren't independent. So Relativity is violated in spirit."
