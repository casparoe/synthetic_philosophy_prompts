answer: |-
  **The Sufficient Cause**

  Elena stood in the kitchen, her hand hovering over the kettle switch. The plastic was cool, matte white, slightly textured under her thumb. She intended to boil water. That was the story she told herself: *I want tea, so I will press the switch.*

  But as she watched her own thumb descend, a cold friction sparked in her chest. It wasn't doubt about the tea; it was doubt about the *I*.

  She had spent the morning cataloging inventory at the warehouse, tracing chains of custody. Box A moves to Shelf B because Forklift C lifted it. The logic was clean, physical, closed. Nothing moved without a push. Nothing pushed without being pushed. Now, standing in the silence of her own home, the same logic turned inward, hunting for a gap where her will might fit.

  She pressed the switch. The click was sharp. Inside the base, the circuit closed, current rushed through the resistive element, heat transferred to the water. A physical chain, unbroken.

  But what caused her thumb to press?

  She walked to the window. Below, a dog barked at a mail carrier. The carrier dropped a letter in the box. The dog lunged at the fence. Physical events triggering physical events. Light hitting retinas, signals firing down optic nerves, muscles contracting. It was a domain of matter in motion, governed by laws that didn't ask for permission.

  Elena raised her right hand. She watched the fingers extend. She felt the familiar stretch of tendons, the shift of weight in her shoulder. She had the distinct impression that she had *ordered* this movement. But she knew, with the certainty of someone who had read the manuals on logistics and flow, that the movement was the end result of a electrochemical cascade starting in her motor cortex.

  That cascade was physical. It consisted of ions crossing membranes, neurotransmitters binding to receptors. These events obeyed the laws of physics. They were sufficient to cause the arm to rise. If the ions moved, the arm moved. If the ions didn't move, the arm stayed still.

  So where was the decision?

  If the physical chain was sufficient—which it had to be, otherwise magic was real—then the mental event, the *feeling* of deciding, was left standing outside the circle. It was like a shadow cast by a walking man. The shadow moves when the man moves, but the shadow does not push the man.

  She lowered her hand. The thought *lower your hand* arose. But she knew that thought was just another pattern of neural firing, realized by the very physical state that caused the hand to drop.

  This was the squeeze. If the physical state caused the action, and the mental state was just a feature of that physical state, then the mental state didn't *do* anything. It was excluded.

  She walked to the table where her phone lay dark. She wanted to call her sister. She felt the urge, a tightness in her throat, a specific longing for a voice she knew. She reached for the phone.

  *Stop,* she thought. *Don't touch it.*

  Her hand hovered inches from the screen. She waited. She wanted to see if the hand would move without the urge. But the urge was tied to the hand. She couldn't separate them. She couldn't isolate the mental variable from the physical realization.

  If she removed the physical cause—the neural firing—the hand wouldn't move. But if she kept the physical cause and somehow removed the *meaning* of it, the hand would still move. The physics didn't care about the meaning. The ions didn't care about her sister.

  She imagined a world where she felt nothing. No urge, no decision, no *I*. Just the body, reacting to light and hunger and habit. In that world, would this hand still reach? If the physical domain was closed, if every physical effect had a sufficient physical cause, then yes. The body would reach. The neurons would fire. The history of her brain states would unfold exactly as it was now.

  The only difference was that no one would be home to narrate it.

  But she *was* home. She was here, watching the hand hover. She was the narrator. But a narrator doesn't drive the plot. A narrator describes what has already happened.

  She picked up the phone. The glass was smooth. She pressed the icon.

  The call connected. Her sister's voice answered, bright, unaware. "Hey, El. What's up?"

  Elena opened her mouth to speak. She intended to say, *I just realized I don't exist.* But the words forming in her throat were air pushed by diaphragms, shaped by tongues, triggered by Broca's area. The physics of sound waves were sufficient to carry the message.

  What work was her *meaning* doing?

  If the physical cause was sufficient, then her intention was redundant. It was overdetermination to say both the neurons and the intention caused the speech. We don't believe in systematic overdetermination. We don't believe that every action is caused twice, once by matter and once by mind. That would be a miracle, a constant coincidence.

  So one had to go. The physical couldn't go; the body was here, moving, speaking. So the mental had to go. Not out of existence, but out of the chain. Her intention was a passenger. A ghost riding in a car that drove itself.

  "I'm fine," Elena said. "Just thinking."

  "About what?"

  "About how things happen," she said.

  She listened to her sister talk about work, about a broken pipe, about the weather. Each word was a physical event. Each understanding in Elena's brain was a physical reaction. She felt sadness for the broken pipe. But the sadness was just the shape of the neural response. It didn't fix the pipe. It didn't even cause her to say "Oh no." The neural response caused the words. The sadness was just the inside view of the response.

  She looked at her reflection in the dark window. The woman in the glass moved when she moved. But if the woman in the glass was the body, and she was the mind, she was realizing she wasn't the one moving the limbs. She was the reflection.

  "El? You there?"

  "Yes," Elena said.

  She realized then that the horror wasn't that she was a machine. It was that she was the noise the machine made. The hum of the server. The heat of the engine. Real, measurable, but causally inert.

  If she decided to hang up, she would hang up. But the decision wouldn't make it happen. The physics would make it happen. The decision would just arrive, perfectly timed, to claim credit.

  "I have to go," she said.

  "Okay. Love you."

  "Love you too."

  She ended the call. She set the phone down. She watched her hand withdraw. The movement was smooth, efficient, determined by the prior state of the universe.

  Elena stood still. She waited for the next thought. It came: *I am trapped.*

  She knew that thought was determined too. She knew it changed nothing. The physical world would continue, closed and complete, with or without her understanding of it. Her understanding was just another event in the chain, a shadow falling on the wall, marking the passage of a body she did not truly drive.

  She turned back to the kettle. The water was boiling. The whistle screamed. She reached out to turn it off.

  She didn't wonder if she would do it. She knew the hand would move. She knew the switch would click. She knew the steam would cease.

  She watched her hand complete the circuit. She felt the satisfaction of a job done. She knew the satisfaction was just chemistry.

  It didn't matter. The water stopped boiling. The physical world proceeded. And she, the silent witness to her own life, went on describing the motion, mistaking the narration for the cause.
