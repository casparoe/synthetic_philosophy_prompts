answer: |-
  **Hirsch:** Let's begin with the trout-turkey. The universalist points to a trout's head and a turkey's tail and says, "There exists an object composed of these parts." The nihilist looks at the same region of spacetime and says, "No, there does not." You want to say one is wrong about the world. I say they are speaking different languages. In Universalist-English, 'exists' ranges over sums. In Nihilist-English, 'exists' ranges only over simples. Both assertions are true in their respective idiolects. Once we see this, the "dispute" evaporates. There is no further fact of the matter.

  **Sider:** You've dissolved the disagreement by dissolving the subject matter. If both are speaking truly, then ontology becomes merely lexicography. But surely, when they argue, they feel they are disagreeing about *reality*, not just dictionary definitions. If I say "there are electrons" and you say "there are no electrons," we aren't just negotiating word usage; we are tracking the world. By making existence variance so easy, you risk making *that* dispute verbal too. You save the nihilist from error only by making ontology trivial.

  **Hirsch:** Not trivial, but pragmatic. We interpret speakers charitably. If the nihilist's theory of simples explains all physical phenomena without positing composites, and the universalist's theory of sums allows for convenient mereological calculus, we should interpret both as succeeding. The "fact of the matter" you crave is a metaphysical ghost. All we have are conceptual schemes. If the nihilist's scheme is useful for physics and the universalist's for everyday talk, both are valid. There is no "God's eye" view to adjudicate between them.

  **Sider:** But there *is* a view from which we can adjudicate: the view that asks which concepts *match* the world's structure. You assume the quantifier 'there exists' is just a logical tool we can tweak. I argue it is a mirror. There is a notion of existence—call it Ontologese—that carves reality at its joints. If the world's fundamental structure includes composite objects, the universalist is right in Ontologese. If it includes only simples, the nihilist is. Variance ignores the possibility that logical structure itself is objective.

  **Hirsch:** Objective structure is a lovely metaphor, Ted, but how do you access it? You claim there is a "joint-carving" quantifier. But to identify it, you must already be using a quantifier. You're begging the question. If I ask, "Does the joint-carving quantifier range over trout-turkeys?" you must answer using *your* quantifier. If your quantifier is the joint-carving one, you've assumed what you need to prove. I offer a deflationary escape: stop looking for the One True Quantifier and look at how we successfully communicate.

  **Sider:** I'm not begging the question; I'm arguing from indispensability. If quantifier variance is unrestricted, *any* dispute becomes verbal. I could say "There are no witches" and you could say "In your language, 'exists' ranges over magical entities, so you're wrong." We could make *physics* verbal. To prevent this trivialization, we must posit that some meanings are *better* than others, not just pragmatically, but metaphysically. The joint-carving meaning is the one that allows for the simplest, most fundamental laws of nature. That is how we identify it.

  **Hirsch:** But that criterion—simplicity of laws—is itself language-relative. What counts as "simple" depends on your predicates. If I define a predicate "grue-like" that captures your nihilist simples in one term, my language looks simpler. You need a prior notion of "natural" predicates to ground your simplicity argument. But that's exactly what's in dispute! You're using naturalness to prove naturalness. My charity principle is more stable: interpret the speaker so their claims come out true, provided they aren't logically inconsistent.

  **Sider:** Charity is a principle of *interpretation*, not *metaphysics*. It tells us how to understand others, not how the world is. You conflate the two. I grant we should be charitable, but charity runs out when the speaker claims to describe fundamental reality. If a physicist says "electrons exist," charity demands we take them literally, not that we reinterpret 'exist' to mean "useful fictions." Similarly, if the metaphysician asks about composition, they are asking about the fundamental structure. To reinterpret them as talking about concepts is to change the subject.

  **Hirsch:** I am not changing the subject; I am clarifying it. The metaphysician *thinks* they are asking about fundamental structure, but they are actually asking about which conceptual scheme to adopt. You say charity runs out at fundamental reality. I say fundamental reality *is* what our best conceptual schemes deliver. There is no "Ontologese" behind the curtain. But let's turn the table: You posit "joint-carving" as a primitive. What *is* it? Is it a property of words? Of the world? If it's a relation between words and world, how do we measure the fit without already using words? It looks like magic.

  **Sider:** It is not magic; it is a theoretical primitive, like "truth" or "reference." We cannot define everything. The charge of mystery cuts both ways: your "conceptual scheme" is equally mysterious if it isn't grounded in something real. Joint-carving is the hypothesis that some ways of talking are objectively more aligned with causal powers and spatiotemporal structure. We measure the fit by explanatory power. The quantifier that appears in the fundamental laws of physics—whatever that turns out to be—is the joint-carving one. If physics quantifies over fields, fields exist fundamentally.

  **Hirsch:** And if physics is just a model? You're reifying our current best theory. But suppose future physics quantifies over wavefunctions in a high-dimensional space, not particles in 3D space. Does the 3D table cease to exist fundamentally? Your view makes existence contingent on the current state of physics. My view allows the table to exist in the "manifest image" language and the wavefunction to exist in the "scientific image" language, without forcing a showdown. We don't need to crown one king of reality.

  **Sider:** We do if we want to know what there *is*. If you say the table exists in one language and not another, you haven't told me whether I can sit on it fundamentally. You've told me about your vocabulary. I want to know if reality contains tables. If wavefunctions are fundamental, then tables are derivative. That is a substantive fact, not a linguistic one. Your variance thesis forces us to say "Tables exist-relative-to-language-L." But existence isn't relative. To be is to be the value of a bound variable in the *correct* language.

  **Hirsch:** "Correct" is the loaded term. Why is the language of fundamental physics the "correct" one for ontology? Why not the language of human experience? You privilege the scientific image without argument. I privilege the principle of charity. You call my view deflationary; I call yours inflationary metaphysics. You posit a mysterious relation of "carving" to save the idea that there is a Single True Answer. I posit linguistic diversity to save the idea that humans are reasonable. Which is the greater cost?

  **Sider:** The greater cost is losing the world. If you are right, metaphysics collapses into semantics. We stop investigating the nature of time, objects, and causation, and start investigating the history of the word 'is'. That is a betrayal of the philosophical tradition. Joint-carving is the minimal commitment required to keep metaphysics alive as a discipline that discovers rather than invents. Yes, it is a primitive. But it is a primitive that pays its rent by preventing the trivialization of every substantive claim.

  **Hirsch:** And my commitment pays its rent by preventing metaphysical mysteries that no evidence could ever resolve. How could we ever know if the universe "carves" at the joints of universalism or nihilism? It's empirically silent. You are positing a fact that makes no difference to prediction or experience. I am positing a linguistic fact that explains why smart people disagree. You want to save the world; I want to save the debate from becoming a dogmatic stalemate.

  **Sider:** It's not dogmatic to demand that reality has a structure independent of our description. If we abandon that, we abandon the idea that our theories can be *wrong* about reality, rather than just *different*. I would rather posit a mysterious structural realism than accept that the difference between a world with tables and a world without tables is merely a matter of which dictionary we open.

  **Hirsch:** And I would rather accept that the dictionary is all we have than posit a structural realism that we can never verify. We can agree on the physics, the phenomenology, and the logic. The rest is noise. Let the nihilist have their simples; let the universalist have their sums. They are building different houses with the same bricks. Why fight over which house is the "Real" one?

  **Sider:** Because we live in only one house. The bricks don't arrange themselves. If the arrangement is objective, then the quantifier that tracks that arrangement is objective. Variance is a comfortable retreat, but it leaves us homeless in reality. I'll take the risk of the primitive for the hope of the truth.

  **Hirsch:** And I'll take the comfort of clarity for the certainty of peace. We shall have to agree to disagree—substantively, or verbally, depending on which quantifier you prefer.

  **Sider:** Precisely. And that disagreement itself proves my point. We aren't just swapping dictionaries; we are fighting for the soul of ontology.

  **Hirsch:** Or, we are fighting over which dictionary to print. But the paper is the same.

  **Sider:** The paper is the world. And it has grain.

  **Hirsch:** Then let us hope our knives are sharp enough to find it. Or perhaps, that we don't need to cut it at all.

  **Sider:** We already are cutting. The question is whether we are following the grain.

  **Hirsch:** Or drawing the lines ourselves.

  **Sider:** Time will tell. Reality usually wins.

  **Hirsch:** Or we do.
