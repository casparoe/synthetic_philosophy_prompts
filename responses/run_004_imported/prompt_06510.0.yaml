answer: |-
  This is a sharp distinction to draw, and you have correctly identified the fault line where modern "geometric rationality" arguments often fracture under scrutiny. You are asking whether the *dynamical* justification for Kelly (time-averaging in a non-ergodic process) can be successfully transmuted into an *axiomatic* justification for geometric expectation in static, one-off decisions.

  Here is the comparison, the analysis of the extension, and the verdict you requested.

  ### 1. Kelly Betting vs. Geometric Rationality: The Comparison

  Mathematically, the objective function is identical: both maximize the expected value of the logarithm of the outcome ($E[\log(x)]$). However, the *ontological status* of that function differs radically between the two frameworks.

  **Kelly Criterion (The Dynamical View)**
  *   **Context:** Repeated, sequential decisions with reinvestment.
  *   **Justification:** Ergodicity. In multiplicative processes, the ensemble average (arithmetic expectation) diverges from the time average. The arithmetic mean tells you what happens to the average bettor in a parallel universe; the geometric mean (log expectation) tells you what happens to *you* over time.
  *   **Status of Log-Utility:** It is not a preference; it is a physical constraint of the system. If you maximize arithmetic expectation in a multiplicative game, you almost surely go to zero. Log-optimization is derived from the dynamics of wealth, not imposed by the agent's psyche.
  *   **Samuelson's Objection:** Samuelson conceded the math but attacked the universality. He argued that if an agent has a finite horizon or a specific utility function (e.g., a step function where they need \$X for surgery and \$X+1 is worthless), the "long-run growth" argument is irrelevant. Kelly is optimal *only if* your goal is long-run growth.

  **Geometric Rationality (The Axiomatic View)**
  *   **Context:** General decision theory, including one-off bets and interpersonal negotiations (e.g., Nash Bargaining).
  *   **Justification:** Scale Invariance and Symmetry. Proponents argue that rational agents should care about proportional changes (ratios) rather than absolute changes (differences). If your utility function should be invariant to the units of measurement (scale invariant), it must be logarithmic. In negotiations, the Nash Bargaining Solution maximizes the product of gains, which is equivalent to maximizing the sum of log-utilities.
  *   **Status of Log-Utility:** It is posited as a normative requirement for rationality itself. It claims that "thinking geometrically" is more fundamental than "thinking arithmetically," even without repetition.
  *   **Relationship:** Geometric Rationality treats Kelly betting not as a specific strategy for a specific game, but as a specific *instance* of a universal law of rationality. Kelly is the temporal special case; Geometric Rationality is the general theory.

  ### 2. The Extension Problem: Does it hold for one-off decisions?

  The Rationalist argument attempts to bridge the gap between "repeated betting" and "one-off decisions" using two main pillars: **Ergodicity Economics** (largely pioneered by Ole Peters) and **Nash Bargaining**.

  **The Ergodic Argument:**
  Modern proponents argue that almost all real-world decisions are part of a larger, implicit sequence. Even if a bet is "one-off," your wealth is part of a lifelong trajectory of multiplicative growth. Therefore, treating every decision as a step in a multiplicative process is the "correct" default.
  *   *Weakness:* This relies on the assumption that wealth is always reinvested and that the agent cares about the terminal wealth at the end of their life. If the decision is truly isolated (e.g., a dying man spending his last dollars), the multiplicative dynamic collapses.

  **The Bargaining Argument:**
  This is the stronger pillar for one-off cases. If you view a decision under uncertainty as a negotiation between your possible future selves (the "you" who wins vs. the "you" who loses), the Nash Bargaining Solution suggests splitting the "gains" fairly between these states. The Nash solution maximizes the product of utilities, which implies geometric expectation.
  *   *Weakness:* This requires accepting the "Harsanyi-Selten" style interpretation that decision-making under uncertainty is isomorphic to interpersonal bargaining. This is a controversial philosophical leap, not a mathematical necessity.

  ### 3. The Verdict

  **Verdict: The extension does not survive Samuelson's objection without smuggling in a substantive preference.**

  Here is the specific breakdown of why the Geometric Rationality claim fails as a *universal* replacement for Expected Utility Theory (EUT) in one-off decisions, even if it remains a powerful heuristic.

  **1. The "One-Off" Erases the Time-Average**
  Kelly works in repeated betting because the Law of Large Numbers turns the geometric mean into a certainty. In a truly one-off decision, the geometric mean is not a realized outcome; it is merely a weighted average of logs.
  If you face a single bet: 50% chance to multiply wealth by 0.5, 50% chance to multiply by 1.6.
  *   Arithmetic mean return: $1.05$ (Positive EV).
  *   Geometric mean return: $\sqrt{0.5 \times 1.6} \approx 0.89$ (Negative growth).
  Kelly says "reject." Arithmetic EUT says "accept" (assuming linear utility).
  In a repeated setting, Kelly is objectively right because the arithmetic path leads to ruin. In a one-off setting, there is no "ruin" via compounding. There is just one outcome. If you take the bet, you either end up with 0.5 or 1.6. You never end up with 0.89. To prefer the geometric calculation here is to assert that you *wish* the bet were repeated, or that you value the *potential* for compounding even when it cannot occur. That is a preference, not a rational necessity.

  **2. Log-Utility is Smuggled as "Rationality"**
  Geometric Rationality argues that because scale invariance is a desirable property, utility *must* be logarithmic. Samuelson would retort that scale invariance is itself a preference.
  Why should a rational agent care about doubling their wealth from \$10 to \$20 the same amount as from \$1M to \$2M?
  *   **Kelly:** Because in a repeated game, the *growth rate* is the same, and growth rate determines survival.
  *   **Geometric Rationality:** Because proportional changes are "more real."
  In a one-off context, the survival argument vanishes. If I need \$15 to save my life and I have \$10, I do not care about the geometric mean. I care about the probability of crossing the threshold. Asserting that I *should* care about the geometric mean is imposing a specific risk aversion (log utility) and labeling it "rationality" to shield it from critique. Samuelson's point was precisely that risk aversion is a parameter of the agent, not a law of logic.

  **3. The Bargaining Analogy is Normative, Not Descriptive**
  The Nash Bargaining justification is the most sophisticated defense. It suggests that maximizing geometric expectation is the only way to be "fair" to your different possible future selves.
  However, this only holds if you accept the "Veil of Ignorance" applied to probability states. If you reject the premise that decision-making is a cooperative game between probability branches, the justification collapses. Many agents are not willing to "compromise" between their winning and losing selves; they simply want to maximize the winning self's payoff. To say they are "irrational" for doing so is to change the definition of rationality from "consistency in achieving goals" to "consistency in achieving *specific* goals (proportional growth)."

  ### Conclusion

  **Kelly betting is a physical solution to a dynamical problem.** It tells you how to navigate a non-ergodic world where time matters more than ensemble averages.

  **Geometric Rationality is a philosophical solution to a normative problem.** It attempts to elevate the Kelly solution into a universal axiom of choice.

  **Samuelson wins on the one-off case.** The reasoning that makes Kelly compelling (the convergence of time-averages to geometric means) relies fundamentally on repetition and reinvestment. When you remove the repetition, you remove the mechanism that makes the geometric mean the dominant observable outcome.

  To apply Geometric Rationality to a one-off decision, you must smuggle in the assumption that **the agent's utility function is logarithmic.** While there are good evolutionary and bargaining arguments for why log-utility is a *common* and *robust* utility function, Geometric Rationality fails when it claims log-utility is the *only* rational one. It conflates "this strategy works best for growing systems" with "this is how all agents ought to think."

  **Final Judgment:** Geometric Rationality is a valid generalization of Kelly **only if** you accept the premise that all decisions are effectively part of a long-run multiplicative trajectory (implicit repetition) or that interpersonal bargaining axioms apply to intrapersonal uncertainty. If you treat the decision as truly isolated and the agent's utility as arbitrary, Samuelson's objection stands: maximizing geometric expectation in a one-off case is not a requirement of rationality, but merely the expression of a specific (logarithmic) risk preference.
