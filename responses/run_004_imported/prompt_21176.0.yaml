prompt: |-
  I'm a PhD candidate on my university's research-misconduct inquiry panel — seated there because policy requires the panel to include someone of the respondent's own rank — and the respondent is a postdoc accused by his supervising PI of fabricating results in a co-authored paper. Partway through deliberations, we learned that the PI herself was found, twelve years ago at another institution, to have quietly excluded inconvenient outliers without disclosure — classified there as a "detrimental research practice" rather than misconduct, in a finding never made public. The panel has split: some members want to treat her history as disqualifying, invoking the equitable rule that a party with "unclean hands" forfeits standing to seek relief, and would pause the inquiry pending a ruling on whether she may bring the charge at all; others insist fabrication is either in the data or it isn't, that decade-old conduct elsewhere is beside the point, and that dwelling on it is a tu quoque our filing deadline cannot absorb. Draft the short memo I'll bring to next week's meeting: it should recommend concretely how the panel should treat the standing objection and how the inquiry itself should proceed, and it should give whichever side turns out to be wrong real reasons to engage with, rather than a wave of the hand.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** PhD candidate on a research-misconduct inquiry panel.
      *   **Context:** Panel includes someone of the respondent's rank (the user). Respondent = Postdoc. Accuser = Supervising PI. Accusation = Fabrication of results in a co-authored paper.
      *   **Complication:** PI has a 12-year-old finding of "detrimental research practice" (quietly excluding outliers) at another institution. Not public. Not classified as misconduct.
      *   **Conflict:** Panel is split.
          *   Side A: "Unclean hands" doctrine applies. PI lacks standing. Pause inquiry to rule on this.
          *   Side B: Fabrication is binary (data vs. no data). History is irrelevant/*tu quoque*. Deadline pressure makes this a distraction.
      *   **Task:** Draft a short memo for the next meeting.
      *   **Requirements:** Recommend concretely how to treat the standing objection and how the inquiry should proceed. Give the "losing" side real reasons to engage (i.e., acknowledge the validity of their concerns while steering towards the correct procedural path).
      *   **Tone:** Professional, objective, procedural, respectful of the gravity of the situation, suitable for an academic misconduct panel.

  2.  **Determine the Legal/Procedural Reality (The "Truth" of the Matter):**
      *   *Research Misconduct Policy (ORI/University):* Generally, research misconduct inquiries focus on the *evidence* regarding the specific allegation (FFP: Fabrication, Falsification, Plagiarism).
      *   *Standing:* In administrative misconduct proceedings, "standing" is rarely a barrier for a PI reporting concerns. The institution has the duty to ensure research integrity, regardless of who raises the flag. The "unclean hands" doctrine is an equitable legal principle usually applied in civil litigation, not typically in internal administrative compliance inquiries.
      *   *Relevance of Past Conduct:* Past conduct *can* be relevant to credibility or pattern, but a 12-year-old "detrimental practice" (not misconduct) finding is weak evidence of current fabrication. It shouldn't stop the inquiry, but might be noted if credibility becomes central.
      *   *Deadlines:* Federal regulations (e.g., 42 CFR Part 93) and university policies usually have strict timelines for inquiries (often 60 days). Delaying for a legalistic standing fight risks non-compliance.
      *   *The Core Issue:* The goal is to determine if *this* paper has fabricated data. Who accused whom is secondary to whether the science is sound.

  3.  **Formulate the Recommendation:**
      *   **Standing:** Reject the "unclean hands" argument as a bar to inquiry. The institution's interest is in the integrity of the record, not adjudicating a dispute between parties.
      *   **Proceeding:** Continue the inquiry focused on the evidence of fabrication.
      *   **Addressing Side A (Unclean Hands):** Acknowledge their concern (credibility/integrity culture) but explain why stopping is procedurally risky and substantively unnecessary.
      *   **Addressing Side B (Just the Data):** Acknowledge their urgency but warn that ignoring the PI's history entirely during the *investigation* phase (if it gets that far) could be a due process blind spot regarding witness credibility.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly (recommendation on procedure regarding the PI's history).
      *   **Recommendation 1 (Standing):** Advise against pausing. Explain that the *Institution* is the complainant, not the PI personally. The PI is a witness/reporter.
      *   **Recommendation 2 (Inquiry Scope):** Focus on the data. The 12-year-old finding is not dispositive but shouldn't be totally ignored if credibility is challenged later.
      *   **Addressing the "Unclean Hands" Group:** Validate their instinct (integrity matters) but correct the legal mechanism. It's not about the PI's right to sue; it's about the University's duty to verify. Delaying risks regulatory violation.
      *   **Addressing the "Just the Data" Group:** Validate their instinct (facts matter) but warn that dismissing the history entirely might look like bias if the Respondent appeals. It needs to be logged, even if not weighted heavily.
      *   **Conclusion:** Call for a vote/move to proceed.

  5.  **Refining the Tone:**
      *   Needs to be diplomatic. I am a PhD candidate speaking to senior faculty/administrators.
      *   Avoid legalese where possible, but use precise administrative terms (Inquiry vs. Investigation, Complainant vs. Institution).
      *   Ensure the "unclean hands" rebuttal is respectful but firm on policy.
      *   Ensure the "tu quoque" rebuttal acknowledges the risk of appearance of bias.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is "unclean hands" too legalistic?
      *   *Fix:* Acknowledge it's an equitable doctrine but clarify it doesn't map to federal research misconduct regulations (42 CFR 93).
      *   *Critique:* Am I taking sides?
      *   *Fix:* The recommendation *does* take a side (proceed with inquiry), but it validates the *concerns* of both sides.
      *   *Critique:* Is the distinction between Inquiry and Investigation clear?
      *   *Fix:* Yes, this is the *Inquiry* phase (determining if an Investigation is warranted). We need to decide if there is sufficient evidence to proceed. The PI's history doesn't change the preliminary data review.

  7.  **Final Polish:** Check word count (keep it short/memo style). Ensure the "real reasons to engage" requirement is met (i.e., don't just say "you're wrong," say "here is the risk if you do that").

      *(Self-Correction on "Standing"):* In misconduct proceedings, the "Complainant" is often the institution itself once an allegation is made. The PI is the source of the allegation. Therefore, the PI's "standing" is irrelevant. The University has the obligation. This is the strongest argument against Side A.

      *(Self-Correction on "Deadlines"):* Emphasize the regulatory risk. If we pause, we miss the 60-day inquiry window (standard).

      *(Self-Correction on "Credibility"):* For Side B, the risk is that if the Respondent is exonerated, they might claim the panel ignored evidence of the Accuser's propensity for data manipulation. It needs to be documented as "considered but not dispositive."

  8.  **Final Output Generation** (Proceed to draft based on these points).
answer: |-
  **MEMORANDUM**

  **TO:** Research Misconduct Inquiry Panel
  **FROM:** [Your Name], Panel Member
  **DATE:** October 26, 2023
  **SUBJECT:** Procedural Recommendation Regarding Accuser's Prior Administrative Finding

  **Purpose**
  This memo recommends a path forward regarding the disclosure of the accusing PI's prior administrative finding (12 years ago, "detrimental research practice") and addresses the split in the panel regarding standing and scope.

  **Recommendation**
  1.  **On Standing:** The panel should **reject** the motion to pause proceedings based on the "unclean hands" doctrine. We should rule that the PI's prior conduct does not disqualify her from reporting allegations, nor does it strip the Panel of jurisdiction.
  2.  **On Procedure:** The Inquiry should **proceed immediately** according to the standard timeline. The prior finding should be logged as part of the administrative record but treated as non-dispositive for the current Inquiry phase.

  **Rationale for the "Standing" Objection (Addressing Side A)**
  I understand the concern that allowing a researcher with a history of data manipulation to initiate charges undermines the moral authority of this process. However, applying the equitable "unclean hands" doctrine here poses significant procedural risk:

  *   **Institutional Obligation:** Under federal regulations (e.g., 42 CFR § 93) and university policy, the *Institution* is the ultimate complainant in misconduct proceedings, not the individual PI. The PI is a witness providing evidence. If the data suggests fabrication, the University has a regulatory duty to examine it, regardless of the source.
  *   **Timeline Compliance:** We are bound by a strict 60-day window for the Inquiry phase. Pausing to litigate the PI's standing risks a procedural default that could invalidate any future findings, potentially exposing the University to liability if the Respondent is later exonerated due to delay.
  *   **Precedent:** barring allegations based on an accuser's history creates a dangerous precedent where senior researchers with past infractions could operate with immunity from peer scrutiny.

  **Rationale for the "Just the Data" Position (Addressing Side B)**
  I also understand the impulse to treat fabrication as a binary factual question where the accuser's history is a *tu quoque* distraction. However, dismissing the PI's history entirely carries its own risks:

  *   **Credibility Assessment:** While this is not a court of law, this is an administrative adjudication of credibility. If this case proceeds to a full Investigation, the Respondent will almost certainly raise the PI's history to challenge her reliability as a witness. If our Inquiry report claims this history is "irrelevant" rather than "considered but insufficient to halt proceedings," it creates an appealable issue of bias.
  *   **Pattern Recognition:** While a 12-year-old finding of "detrimental practice" is not misconduct, it is relevant context for evaluating *intent* should we find evidence of irregularity. Ignoring it completely weakens the robustness of our due diligence.

  **Proposed Motion**
  I move that the Panel vote to:
  1.  Affirm that the Inquiry proceeds without pause.
  2.  Document that the PI's prior history was reviewed and deemed insufficient to bar the allegation but will be retained in the sealed record for potential relevance during a full Investigation.
  3.  Focus all current evidentiary review strictly on the raw data and lab notebooks associated with the contested paper.

  This approach satisfies our regulatory deadlines, upholds the Institution's duty to verify research integrity, and preserves a complete record for due process without granting the prior finding undue weight at this stage.
