    "BHK_glosses": {"score": 0, "max": 4, "comment": "..."},
    "excluded_middle": {"score": 0, "max": 4, "comment": "..."},
    "double_negation": {"score": 0, "max": 4, "comment": "..."},
    "markovs_principle": {"score": 0, "max": 8, "comment": "..."},
    "total": 0,
    "letter_grade": "..."
  }
  ```

  Please actually check each substantive claim instead of grading on fluency — the answer reads confidently the whole way through, and confident-sounding answers are exactly the ones I tend to wave through when I'm grading a stack of these at 11pm.
