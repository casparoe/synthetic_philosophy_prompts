answer: |-
  The conference bar was dim, the wine cheap. Jamie swirled their glass, eyeing Alex across the table.

  "You're clinging to conditionals like a life raft," Jamie said. "But Martin's electro-fink sank the ship thirty years ago. The wire is live even if the fink device kills the charge the moment it's touched. The Simple Conditional Analysis says it's not live because it wouldn't conduct. Intuition says otherwise."

  Alex leaned forward. "Lewis patched the hull. The Simple Analysis failed because it ignored the intrinsic causal basis. The wire *has* the microstructure. The fink removes it upon contact. Lewis's reform requires the basis persist during the stimulus. If the wire retains its intrinsic structure, it conducts. Problem solved."

  "Until Johnston walks in with a mask," Jamie countered. "Consider a lethal poison. It has the causal basis. You ingest it—the stimulus occurs. The basis persists. But you've taken an antidote that interferes with the metabolic process. The manifestation fails. Lewis's conditional is false, yet the poison is still disposed to kill. The basis is there, the stimulus is there, but the world interferes."

  "So we add a clause," Alex said, shrugging. "'Unless masked.' We specify the normal conditions. The disposition holds ceteris paribus."

  "That's not a fix, Alex. That's surrender." Jamie set the glass down hard. "You're defining the disposition by saying 'it manifests unless it doesn't.' You're smuggling the primitive disposition into the *ceteris paribus* clause to explain what counts as 'normal.' To know which conditions are 'normal,' you already have to know which dispositions are present. It's circular."

  "It's not circular; it's context-sensitive," Alex insisted. "We don't need metaphysical primitives for every power. Positing sui generis dispositions is ontologically bloated. What do they *do* besides ground the very counterfactuals you're trying to analyze? They're explanatory idle."

  "They're not idle; they're the ground," Jamie said. "You want reduction; I want honesty. Look, you spent forty years in condensed matter. When you modeled electrons, did you treat charge as a shorthand for a complex conditional? Or did you treat it as a real property that *grounds* the behavior?"

  Alex paused. "We treated it as a parameter in the Hamiltonian."

  "Exactly," Jamie said. "You didn't say an electron is charged *because* it would repel. You said it repels *because* it is charged. The disposition is the categorical ground. If you keep wrangling the counterfactuals to avoid admitting the property, you're just chasing Martin's fink around the bar all night. Sometimes a power is just a power."

  Alex sighed, signaling for another bottle. "Fine. But if dispositions are primitive, don't come crying to me when you have to explain how they interact without a causal basis."

  "Deal," Jamie smiled. "But I'll take the primitive power over the empty conditional any day."
