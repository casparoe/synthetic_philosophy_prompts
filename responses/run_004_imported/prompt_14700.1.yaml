      *   *Alternative:* 6/7/7? Let's go 7/6/7 to emphasize the argument reconstruction and the Block critique which are often harder. Or keep it simple: 7, 6, 7.
      *   Actually, usually, (a) is foundational. Let's do 7 (Putnam), 6 (Functionalism), 7 (Block).
