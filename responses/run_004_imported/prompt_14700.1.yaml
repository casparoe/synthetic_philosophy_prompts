  8.  **Final Polish:** Ensure the JSON is valid (no trailing commas, proper quotes). Ensure the tone is supportive for a high schooler doing college work (that's impressive!).

      *(Self-Correction on JSON)*: Make sure to escape quotes if necessary, though standard text should be fine. Keep it simple.

