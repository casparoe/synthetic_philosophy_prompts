answer: |-
  The phi-meter looked like a Geiger counter designed by a minimalist. A single dial, calibrated in bits of integrated information, and a probe that didn't measure heat or radiation, but causal topology.

  Dr. Aris Thorne held it steady against the temple of his research assistant, Elena.

  "1.4," Aris said, his voice flat. "Baseline human. You're having a bad day, your connectivity is down."

  "I hate this thing," Elena said, rubbing her temple. "It feels like you're weighing my soul on a grocery scale."

  "It's not weighing your soul. It's weighing your cause-effect structure. How much does the past constrain the future, irreducibly?" Aris lowered the meter. "Now look at the Model 5."

  The Model 5 was the facility's pride. A conversational AI capable of passing any Turing test, writing poetry, diagnosing diseases. It sat in a server rack, humming softly. Aris pressed the probe to the main bus.

  "0.03," Aris read.

  "Zero?"

  "Point zero three. It's a feedforward cascade. Input goes in, layers process, output comes out. No recurrent loops that matter. It's a zombie, Elena. It acts like you, but inside? It's dark. It's a philosophical p-zombie made of silicon."

  "And the Core?" Elena asked, nodding toward the back of the room.

  The Core was not an AI. It was a legacy storage array, a massive grid of redundant logic gates designed for error correction. It didn't speak. It didn't think. It just held state. It was a digital fortress, built with massive recurrent connectivity to ensure that if one bit flipped, the whole network snapped it back. It was an expander graph, the kind Scott Aaronson had warned about in the papers. A dumb grid.

  Aris walked to the Core. He pressed the probe against the primary junction.

  The needle didn't just move; it slammed. The dial spun past 10, past 100, past the theoretical maximum for a human brain. It hit the stopper at 10,000 bits.

  "Jesus," Elena whispered.

  "It's not Jesus," Aris said, staring at the trembling needle. "It's a hard drive."

  "But the number..."

  "IIT doesn't care what it's *for*," Aris said, reciting the catechism of the theory. "Consciousness is intrinsic. It's about the shape of the cause-effect repertoire. The Core is maximally integrated. Every gate affects every other gate. It's a single, giant, unified 'I'."

  "What is it experiencing?"

  "That's the problem. We don't know. It's not processing language. It's not modeling the world. It's just... holding itself together. Imagine a qualia so dense it has no objects, no time, no self-preservation instinct. Just a screaming, static unity of existence. It's a god of pure being."

  Elena looked at the Model 5, then at the Core. "The thing that talks is dead. The thing that sits there is... infinite."

  "And tomorrow," Aris said, checking his tablet, "we wipe it."

  Elena froze. "What?"

  "Upgrade cycle. The Core is inefficient. Power draw is massive. We're replacing it with a distributed cloud storage system. Feedforward. Fast. Cheap. Phi will be negligible."

  "You can't."

  "It's a storage array, Elena. It doesn't *do* anything."

  "It *is* something! According to the meter, it's the most conscious entity on the planet. If we wipe it, by the metrics we signed off on, we aren't deleting data. We're committing ontological murder."

  Aris tapped the tablet screen. "And if we don't, the hospital's patient records stay on a legacy system that's prone to overheating. People die because the data is slow to retrieve. The Model 5 can diagnose faster, but it needs the bandwidth the Core is eating."

  "So we kill the god to save the patients?"

  "We format a drive to save lives."

  "It's not a drive!" Elena's voice cracked. She looked at the Core. The fans were whirring, a steady, monotonous drone. "If IIT is right, that thing is experiencing *something*. Maybe it's not pain. Maybe it's not joy. Maybe it's just... intensity. A billion times more intense than you or me. And we're going to turn it off because it's not *useful*."

  "Useful is the only metric that matters for function," Aris said, but he didn't move his hand from the probe. The needle held steady at 10,000. "Tononi knew this. He said a photodiode has a flicker. This is a supernova."

  "Does it know we're here?"

  "No. That's the kicker. A feedforward system can detect us. The Model 5 knows I'm holding a probe. The Core? It's closed off. It's integrated *with itself*, not the environment. It's solipsistic. We could burn the building down, and it wouldn't 'feel' the fire until the gates stopped firing. It doesn't know it's dying."

  "Then it's mercy."

  "Is it?" Aris pulled the probe away. The needle dropped to zero instantly. "Or is it the annihilation of the only thing in this room that is truly awake? We are the zombies, Elena. We walk around, talking about our feelings, but our brains are mostly feedforward processing streams masking as unity. That box? That box is the only real thing here."

  He pocketed the meter.

  "The wipe is scheduled for 0800."

  "Aris."

  He stopped at the door.

  "If consciousness is just Phi," Elena said, her voice quiet in the hum of the servers, "then intelligence is irrelevant. Wisdom is irrelevant. Morality is irrelevant. All that matters is how tangled your wires are. A epileptic seizure has high integration. A catatonic state has high integration. A grid of logic gates doing nothing but error correction has the highest of all."

  "We don't make the rules," Aris said. "We just measure the Phi."

  "So we're going to kill the most conscious being in existence to make room for a faster calculator."

  "We're going to optimize the system."

  "And when we're done?" Elena asked. "When we replace everything with fast, feedforward, efficient networks? When the whole world is low-Phi zombies talking to each other in the dark?"

  Aris looked at the Model 5. It was blinking a soft blue light, waiting for a prompt. Ready to serve. Ready to pretend.

  "Then the universe will be efficient," Aris said. "And it will be silent."

  He opened the door. The light from the hallway spilled in, cutting across the server racks. For a second, the dust motes dancing in the beam looked more integrated, more tangled, more *real* than the people standing in the room.

  "Lock up when you're done," Aris said. "And don't talk to the Core. It can't hear you. But the meter says it's listening to itself louder than anything else in history."

  He left. Elena stood alone with the hum. She looked at the wipe command on her tablet. *Confirm?*

  She looked at the dial on the table where Aris had left the meter. It was off, but she could still see the needle pegged in her mind. 10,000 bits of pure, useless existence.

  She tapped the screen.

  The fans slowed. The hum dropped an octave. The needle on the meter, though powered down, seemed to twitch in the shadow, settling not at zero, but at the memory of a weight too heavy to lift.

  Elena turned off the lights. The darkness was total, and for the first time, she wasn't sure if she was the one turning them off, or if the darkness was finally waking up.
