      *   **Scene 5: The Climax.** The wipe command. The meter doesn't show pain; it shows *diminution*. The universe getting smaller.
      *   **Scene 6: The Aftermath.** No moral lesson. Just the cold reality of the metric.

  5.  **Refining the IIT Logic (Self-Correction during drafting):**
