      *   IIT weirdness: High $\Phi$ exists in *dumb* systems. Low $\Phi$ exists in *smart* systems (if feedforward).
      *   *Idea 1:* A supercomputer is turned off, but a backup generator system is screaming in agony. (A bit cliché).
      *   *Idea 2:* A human brain is scanned. It's feedforward during certain tasks. Are they a "zombie" then? (Too abstract).
      *   *Idea 3:* Infrastructure. The power grid? The internet? (Too diffuse).
      *   *Idea 3 (Refined):* Error correction codes. Aaronson's point. A system designed purely to maintain state integrity could have massive $\Phi$.
