          *   The "Unfolding" objection (feedforward vs. recurrent networks behaving identically but having different $\Phi$).
          *   Scott Aaronson's "expander graph" critique (high $\Phi$ without intelligence).
      *   **Setting:** A world where a working "phi-meter" exists.
      *   **Plot Hook:** The meter reveals something morally uncomfortable based on IIT's logic.
      *   **Tone:** Unsettling, logical, avoiding tidy morals. The theory itself must be the horror.

