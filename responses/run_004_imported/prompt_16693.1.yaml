prompt: |-
  So I've fallen down a total rabbit hole this week reading Bentham's unpublished manuscripts on sexual morality -- the ones where he takes his own utilitarian framework and applies it to what he called "paederasty" (his word for consensual homosexual acts between men), concludes the laws against it are completely indefensible, and then just... sits on the whole argument for decades because he knows exactly what publishing it would do to him and to the cause of legal reform generally. Im interviewing a historian who's spent years working through this material, for a segment I do on the history of ideas, and I really don't want her to just walk me through "here's what Bentham secretly believed," which I'm sure shes answered a hundred times already. I want the questions to actually corner the position a little.

  Could you draft me 8-10 interview questions, each with a quick follow-up keyed to whatever answer she's most likely to give? I want at least one question pressing on whether Bentham can rule out disgust as grounds for punishment without quietly re-importing what he elsewhere calls the "principle of sympathy and antipathy" -- his own felicific calculus counts sympathetic and antipathetic pains as real pains, so what exactly stops a whole society's antipathy from counting as a cost, other than him just asserting it shouldn't? One on the irony that the philosopher most associated with the idea that publicity is the best cure for bad law chose total silence on the one issue where his own principles led him somewhere genuinely radical -- does that undercut how seriously we should take his public arguments for openness elsewhere? One comparing him to Mill, who gets remembered as the great champion of liberty but never went near this question in On Liberty even though it looks like a textbook case for the harm principle. And end on something that forces her to say what, if anything, this should change about how we teach Bentham -- is the "felicific calculus" caricature actually hiding a much braver thinker, or is the unpublished stuff basically irrelevant to his real influence on the law?
