      *   **Disjunctivism:** Denies the "Therefore." Veridical Perception ($V$) and Hallucination ($H$) are *fundamentally different kinds of states*, even if indistinguishable to the subject. $V$ is a relation to the world; $H$ is a mere appearance. There is no *mental* common factor, only a phenomenal indistinguishability.
      *   **Predictive Processing (PP):** The brain minimizes prediction error. Perception is "controlled hallucination." Top-down priors meet bottom-up sensory data. In hallucination, priors dominate (or data is ignored/noisy). In perception, data constrains priors. Mechanistically, it's the same *system* doing the *same computation*.

  3.  **Evaluate the Conflict (PP vs. Disjunctivism):**
      *   *User's Intuition:* Same algorithm = Common Factor = Anti-Disjunctivism.
      *   *Housemate's Intuition:* Disjunctivism is about *metaphysics of experience*, PP is about *causal mechanism*. They talk past each other.

