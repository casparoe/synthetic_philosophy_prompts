      *   **Supervaluationist (let's call him "Sam"):** Believes truth is supertruth (true on all admissible precisifications). Gaps in truth value for borderlines. Classical logic holds for supertruth, but bivalence fails for ordinary truth. Needs to handle higher-order vagueness carefully.

