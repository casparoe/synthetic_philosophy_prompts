      *   **Key Requirements:**
          *   Epistemicist must defend a real, sharp, unknowable cutoff and explain *why* it's unknowable (margin for error/inexact knowledge), distinguishing it from ordinary ignorance.
          *   Supervaluationist must defend truth as supertruth over admissible precisifications and address the higher-order vagueness objection (that sharp boundaries just reappear at the level of "definitely").
          *   **Crucial:** They must engage with each other's points, not just monologue. No strawmen. They need to press on weak points.
