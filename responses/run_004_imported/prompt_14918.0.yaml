answer: |-
  **Setting:** *A seminar room, late afternoon. The whiteboard is covered in a sequence of 100 stick figures, graduated by millimeters in height. ELENA (Epistemicist) and SAM (Supervaluationist) stand before the board, markers in hand. They are halfway through the forced march.*

  **Elena:** *(Marking figure 50)* Tall.

  **Sam:** *(Hesitating over figure 51)* I'm not marking it. Neither "tall" nor "not tall."

  **Elena:** You're stalling, Sam. We agreed to the forced march. We have to assign a truth value to every case.

  **Sam:** I'm assigning a truth value status. It's indeterminate. Look at them. 50 and 51 are perceptually identical. If 50 is tall, 51 must be tall. If you insist 50 is tall and 51 is not, you're claiming a semantic miracle happened between two millimeters of height.

  **Elena:** It's not a miracle; it's classical logic. Bivalence holds. Either 51 is tall or he isn't. There is no third option. The fact that you can't tell which one it is doesn't mean there isn't a fact of the matter.

  **Sam:** But *what* makes it the fact of the matter? Our usage? Our intentions? We use "tall" loosely. We don't use it with the precision required to single out one specific millimeter as the boundary. If usage doesn't fix the boundary, nothing does.

  **Elena:** Usage *does* fix it, just not in a way we can access. Think about the margin-for-error principle. To *know* that someone is tall, your belief has to be safe. If you believe case $n$ is tall, you shouldn't be wrong in a very similar case, $n-1$.

  **Sam:** So knowledge requires a buffer.

  **Elena:** Exactly. $K(\text{Tall}(n)) \to \text{Tall}(n-1)$. If I know $n$ is tall, $n-1$ must also be tall. But if there is a sharp cutoff—say, at 51—then 51 is tall and 50 is not. Given the margin-for-error principle, it follows that I cannot *know* 51 is tall. The boundary is sharp, but it sits in a zone where knowledge is impossible. That's why it feels like there's no boundary. It's not that the boundary doesn't exist; it's that it's unknowable.

  **Sam:** That's the epistemicist move. You're explaining away the intuition of vagueness as mere ignorance. But it's a very specific kind of ignorance. If I don't know the number of grains in a heap, I can go count them. The fact is accessible in principle. You're saying the fact of whether 51 is tall is *in principle* inaccessible.

  **Elena:** Because the concept "tall" is sensitive to usage, and usage is chaotic. The boundary is determined by the complex totality of our linguistic practices. It's like a chaotic system. A tiny shift in how we used the word fifty years ago could have moved the boundary from 51 to 48. We can't calculate that function. So, the ignorance is constitutive of the concept.

  **Sam:** But let's press on the "Definitely" operator. This is where your view cracks. You admit there's a sharp cut between "tall" and "not tall." Fine. But surely you also admit there's a sharp cut between "definitely tall" and "not definitely tall"?

  **Elena:** Yes.

  **Sam:** So there's a specific person in this line—let's say 60—where 60 is *definitely* tall, but 59 is *not definitely* tall. That means 59 is borderline. But then, where does "borderline" end and "definitely not tall" begin? You've just relocated the sharp boundary problem. You haven't dissolved vagueness; you've just pushed it up to the second order. And if you accept that, why stop? You get higher-order vagueness all the way up.

  **Elena:** I accept the sharp boundaries at every order. It's sharp boundaries all the way up. It's uncomfortable, yes, but it preserves classical logic. If you deny the sharp cut at the second order, you're denying bivalence for the operator "Definitely."

  **Sam:** Which is exactly what I do. But I don't just deny it; I offer a semantics that explains *why* we don't need it. Look, on my view, "Tall" is true if it's true on all admissible precisifications of the term. "False" if false on all. "Borderline" if true on some, false on others.

  **Elena:** And what makes a precisification "admissible"?

  **Sam:** Constraints of usage. We can't precisify "tall" to include a 4-foot person. That's inadmissible. But within the reasonable range—say, cutting off between 50 and 60—any specific cutoff is admissible.

  **Elena:** Here's the trap, Sam. Is the set of admissible precisifications sharply bounded? Is there a specific precisification $P$ such that $P$ is admissible, but $P$ shifted by one millimeter is *inadmissible*?

  **Sam:** *(Pauses)* If I say yes, I reintroduce the sharp boundary at the level of admissibility.

  **Elena:** Exactly. You're trying to smear the boundary by appealing to a set of precise boundaries. But the set itself must have a boundary. If you say the set of admissible precisifications is *itself* vague, then you need a super-set of precisifications to define that vagueness. You're either regressing infinitely or you eventually accept a sharp cut.

  **Sam:** I don't accept the regress. I argue that the relation of "admissibility" is not a binary relation. It's not that a precisification is either in or out. It's that admissibility fades. But—and here's the technical move—we can model this without abandoning classical logic for the *supertruth* predicate.

  **Elena:** But supertruth isn't ordinary truth.

  **Sam:** It's the only notion of truth that matters for valid inference. Look, Elena, think about your day job. You said you're working on a harassment classifier.

  **Elena:** I am. And it behaves exactly like an epistemicist. It draws a line. Comment 45 is "safe," Comment 46 is "harassment." They are nearly identical. The system forces a sharp cut.

  **Sam:** Right. And does the system *know* why 46 is harassment and 45 is not?

  **Elena:** No. It's a black box. But it has to make a decision. We can't have a "borderline" output for a trust-and-safety tool. If we don't ban it, it stays up. If we ban it, it's gone. The law of excluded middle is enforced by the architecture.

  **Sam:** That's a pragmatic constraint, not a semantic one. Your classifier is essentially selecting *one* admissible precisification out of many and enforcing it. It's pretending the vagueness isn't there to achieve a functional goal. But when you ask *why* 46 crossed the line, and the system says "because the score was 0.5001," that's not an explanation of meaning. That's an arbitrary stipulation.

  **Elena:** But it's not arbitrary in the context of the system's training. It's determined by the weights. Just like "tall" is determined by usage. The fact that we can't articulate the rule doesn't mean the rule isn't there. My classifier's "ignorance" of why 46 is different from 45 mirrors our ignorance of the tallness boundary. It's not that the difference doesn't exist; it's that the discriminative capacity isn't available to the explainer module.

  **Sam:** But if you change the training data slightly, the cutoff moves to 44. Or 48. The boundary floats. For an epistemicist, the boundary is fixed by actual usage. If the boundary floats when you tweak the parameters, it suggests there *wasn't* a fixed fact of the matter to begin with. It suggests the "truth" of "harassment" for comment 46 is relative to the precisification chosen by the engineer.

  **Elena:** No, it suggests the *location* of the boundary is sensitive to the supervenience base. If usage changes, the boundary moves. That doesn't mean there's no boundary at time $t$. At time $t$, with this specific model and data, there is a cutoff. It is sharp. It is unknowable to the user. That is exactly the epistemicist picture.

  **Sam:** But consider the higher-order charge again. If your classifier outputs "Harassment," and I ask, "Is it *definitely* harassment?" your system might output a probability. If you treat that probability as a measure of "definiteness," you have a smooth transition from "definitely not" to "definitely." There is no sharp cut in the probability score.

  **Elena:** Because the probability score isn't the truth value. The verdict is binary. The probability is a measure of confidence, or perhaps a measure of how close we are to the unknowable boundary.

  **Sam:** Or, it's a measure of how many admissible precisifications classify it as harassment. If 90% of reasonable definitions of harassment catch comment 46, but only 10% catch comment 45, then 46 is "supertrue" to a degree, or at least robustly true. But you insist on a binary switch.

  **Elena:** Because logic demands it. If "Harassment(46)" is not true, it is false. If it's false, then it's not harassment. You can't have "kind of harassment" in a binary legal framework.

  **Sam:** I'm not saying the *action* should be vague. I'm saying the *truth* is vague. We can act *as if* it's true for pragmatic reasons without believing there is a metaphysical fact that 46 is Harassing and 45 is not. You're conflating the decision procedure with the semantics.

  **Elena:** And you're conflating our inability to pinpoint the boundary with the non-existence of the boundary. Let's go back to the higher-order objection. You said admissibility fades. If it fades, there must be a point where it stops fading and becomes "inadmissible."

  **Sam:** Why? Imagine a spectrum of color. Red fades into orange. Is there a specific photon wavelength where "red" stops being admissible and "orange" begins?

  **Elena:** Yes, there is. We just can't see it.

  **Sam:** That's the epistemicist dogma talking. I'm saying the concept "admissible" is itself vague. There are borderline admissible precisifications.

  **Elena:** So "Borderline Admissible" is a predicate. Is there a sharp cut between "Admissible" and "Borderline Admissible"?

  **Sam:** *(Smiles)* You're trying to force me up the ladder.

  **Elena:** I'm showing you the ladder is solid.

  **Sam:** I'll grant you that in the *model*, we often represent these things with sharp sets for mathematical convenience. But the model is not the territory. The territory is our linguistic practice. Our practice doesn't support a sharp cut between "okay to use" and "not okay to use" for a definition. It's a matter of degree of acceptance.

  **Elena:** But if it's a matter of degree, then classical logic fails. You can't have $P \lor \neg P$ if $P$ is only 0.7 true.

  **Sam:** Supervaluationism saves classical logic for the sentences that *are* true or false. It just denies that all sentences are true or false. "46 is Harassment" might be neither supertrue nor superfalse. But "If 46 is Harassment, then 46 is Harassment" remains valid. I keep the logic; you keep the bivalence.

  **Elena:** You keep the logic by sacrificing the connection between truth and the world. You're saying there's no fact of the matter about 46. But when a user gets banned, there is a very real fact of the matter for them.

  **Sam:** There's a fact about the *decision*, not the *description*. The system precisified the term. It made a sharp cut. That doesn't mean the cut was there in the concept waiting to be found. It means the system forced a resolution to a semantic indecision.

  **Elena:** And I say the semantic indecision is just our ignorance of the resolution that usage has already silently enacted.

  **Sam:** *(Looks at the board, at figure 51)* You know, if you're right, Elena, then there is a specific person here who is the first tall person. And we are permanently blind to him.

  **Elena:** We are. And he's standing right there.

  **Sam:** And if I'm right, there's a cluster of people around 50 where "tall" simply doesn't apply, and any attempt to force it is a distortion of the language.

  **Elena:** But you still have to mark the board eventually. The seminar ends.

  **Sam:** *(Picks up the marker)* True. For the sake of the example, I'll mark 60 as "Definitely Tall." 50 remains unmarked.

  **Elena:** *(Marks 51 as "Tall")* And I'll mark 51. We both know my mark corresponds to reality, and yours corresponds to a set of possibilities.

  **Sam:** And we both know that for the person standing at 51, your mark feels like a verdict without a reason.

  **Elena:** A verdict with a reason that is too complex for us to compute.

  **Sam:** *(Puts the cap back on the marker)* Just like your classifier.

  **Elena:** Just like the classifier.

  **Sam:** Well. At least we agree the coffee in the hall is definitely hot.

  **Elena:** *(Pauses)* Don't start.

  **Sam:** *(Laughs)* Come on. Let's go.
