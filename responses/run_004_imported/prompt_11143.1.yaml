  7.  (Drafting the content based on these thoughts...) *Self-correction: Make sure not to get bogged down in too much jargon. Keep it focused on the Drug Case.* *Ensure the distinction between "summing pain" and "counting claims" is the pivot point.*

  8.  **Final Review against constraints:**
