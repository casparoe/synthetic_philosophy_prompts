answer: |-
  # The Arithmetic of Compassion: Why Taurek is Wrong, But Not for the Reason You Think

  You have spent a decade in the epistemic trenches of LessWrong and the Effective Altruism Forum. You have internalized the view that morality is, in a significant sense, arithmetic. Scope insensitivity is a bug in your hardware; saving five lives is better than saving one. To suggest otherwise feels like a category error, a failure of rationality akin to denying that $5 is greater than $1.

  Then comes John Taurek. In his 1977 paper *"Should the Numbers Count?"*, he doesn't just challenge the arithmetic; he challenges the existence of the ledger.

  Taurek's argument is the philosophical equivalent of a zero-day exploit against utilitarianism. It doesn't feel like a "crazy bullet" when you actually read it; it feels like a profound correction to a worldview that treats human beings as containers for utility rather than subjects of a life. However, after decades of debate involving giants like Derek Parfit, Frances Kamm, and T.M. Scanlon, the consensus among moral philosophers is not that Taurek was right, but that his challenge forces us to refine *why* numbers count.

  Here is the case against aggregation, the case for it, and the verdict on where the truth actually lies.

  ### I. The Taurekian Challenge: The Metaphysics of Loss

  To understand why Taurek is so seductive, you have to strip away the utilitarian framing. The standard EA argument is: *Death is bad. Five deaths are five times as bad as one death. Therefore, minimize badness.*

  Taurek attacks the middle premise. He argues that "five times as bad" implies a single subject who is experiencing the loss. If I lose $5, I am worse off than if I lose $1. But in the drug case, there is no "we" who loses five lives. There is Person A losing a life, and Person B losing a life, and so on.

  **1. The No Super-Entity Argument**
  Taurek insists that loss is essentially first-personal. Pain and death happen to individuals. There is no cosmic container of "badness" that fills up. When you say "saving five is better," you are implicitly positing a super-entity that suffers the aggregate loss. Since no such entity exists, the comparison is metaphysically incoherent. You cannot compare the loss of the one against the loss of the five, because there is no common currency experienced by a common subject.

  **2. The Equal Concern Argument**
  If we cannot sum the losses, how should we decide? Taurek argues from the standpoint of *equal respect*. If I am the lone individual, and you choose to save the five, you have decided that my life is worth less than theirs. You have discarded my claim entirely to satisfy theirs.
  To show equal concern for each person's fate, Taurek proposes a coin flip. Give the single person a 50% chance, and the group of five a 50% chance. This acknowledges that while there are more of them, my claim to life is not *intrinsically* weaker than any single one of theirs. To save the five automatically is to treat the one as a mere means to the greater good.

  **3. The "Each vs. All" Distinction**
  Taurek distinguishes between "worse for each" and "worse for all." It is not worse for *each* of the five to die than for the one to die (death is equally bad for each individual). And it is not worse for *all* of them collectively, because "all of them" is not a subject. Therefore, there is no moral imperative to save the greater number.

  This is the strongest version of the argument: It doesn't deny that death is bad. It denies that *badness aggregates across persons* in a way that overrides individual claims.

  ### II. The Aggregationist Counter-Attack

  The utilitarian response is usually blunt: "If you flip a coin, you are guaranteeing more death ex-post. That is irrational." But philosophers like Parfit and Kamm realized that simply asserting "utility matters" begs the question against Taurek. They had to explain *how* numbers count without relying on the "super-entity" Taurek rightly debunked.

  **1. Parfit and the "Each/We" Dilemma**
  Derek Parfit, in *Reasons and Persons*, tackles this by shifting the perspective. He argues that while there is no super-entity, there is a moral obligation to produce the best outcome. If we ask, "What should *we* do?" the answer is determined by the sum of individual outcomes. Parfit argues that Taurek confuses the *subject* of the loss with the *object* of moral concern. Morality is agent-neutral. Even if the pain isn't summed in a single mind, the *reasons* to prevent that pain sum in the moral calculus.

  **2. The Veil of Ignorance**
  The strongest intuitive pump against Taurek is Harsanyi's Veil of Ignorance. If you did not know whether you would be the single person or one of the five, which rule would you choose?
  *   **Rule A (Save the Many):** You have a 5/6 chance of living.
  *   **Rule B (Coin Flip):** You have a 1/2 chance of living (if you are in the group of five, the group only gets a 50% chance; if you are the single person, you get a 50% chance).
  Any rational agent behind the veil chooses Rule A. Taurek might reject the Veil as utilitarian smuggling, but it highlights that Taurek's coin flip actually lowers everyone's ex-ante probability of survival.

  **3. Kamm and the Balance of Claims**
  Frances Kamm offers a deontological rebuttal that avoids utilitarianism entirely. She argues that each person has a "claim" to be saved. When claims conflict, we must satisfy the most we can.
  Crucially, Kamm argues that the five do not outweigh the one because their pain sums up. They outweigh the one because there are *more claimants*. If you save the one, you violate five claims. If you save the five, you violate one claim. Morality requires minimizing the number of violated claims, not minimizing "impersonal badness." This accepts Taurek's metaphysics (no super-person) but rejects his ethics (equal chance).

  ### III. The Verdict: Numbers Count, But Claims Aggregate, Not Pain

  So, where do we land? You asked for a verdict, not a fence-sit.

  **Taurek is right about the metaphysics, but wrong about the morality.**

  There is no super-entity. "Five deaths" is not a single lump of suffering that is five times heavier than one death. Taurek wins that round. However, his conclusion that we should flip a coin does not follow from that premise.

  **The Verdict:** In cases where the stakes are identical (life vs. life), **you must save the greater number.** But the justification is not the utilitarian "shut up and multiply" of welfare; it is the deontological **aggregation of claims.**

  Here is why this distinction matters and why it leads to saving the five:

  **1. The Failure of the Coin Flip as "Respect"**
  Taurek argues the coin flip shows equal respect. But consider the perspective of the five. Each of them has a claim to life equal to the single person's. By flipping a coin, you are effectively saying that the five claims of the group are morally equivalent to the one claim of the individual.
  If I have a vote, and you have a vote, and we are deciding on a policy, "one person, one vote" is democratic. But if we are deciding who *dies*, treating five claims as equal to one claim is not neutrality; it is a discounting of the five. To give the five a 50% chance and the one a 50% chance is to treat the *group* as a single entity against the *individual*. It ironically commits the very error Taurek accuses utilitarians of: it reifies the group of five into a single unit that gets one vote.
  True respect for the separateness of persons requires counting each person's claim individually. Five claims outweigh one claim.

  **2. The Weighted Lottery Compromise (and why it fails in practice)**
  Scanlon suggested a weighted lottery: Give the five a 5/6 chance and the one a 1/6 chance. This acknowledges the numbers while maintaining a procedural respect for the individual.
  However, in the specific "Drug Case" (where the drug is indivisible or the decision must be made now), a weighted lottery collapses into saving the five. Why? Because the "lottery" is just a probabilistic way of implementing the decision procedure. If you run the weighted lottery, 83% of the time you save the five. If you institutionalize this, you save the most lives.
  More importantly, if you *can* save the five deterministically, doing so is the only way to fully honor the claims of the five. A lottery introduces a risk of violating five claims to spare one. Unless there is a specific reason to think the single person has a *stronger* claim (e.g., they are a doctor who can save others later), the sheer number of equal claims dictates the outcome.

  **3. When Taurek Might Be Right (The Nuance)**
  There is one domain where Taurek's intuition holds weight: **Small Numbers and Personal Prerogatives.**
  If the numbers are vast (save 1,000 vs. 1), aggregation is mandatory. No sane person flips a coin. But in the immediate, personal vicinity, where the agent is intimately connected to the single person (e.g., "Save my child or save five strangers"), Taurek captures a moral truth: we have agent-relative permissions to favor those close to us.
  However, in the *impersonal* drug case you described—where you are a distant allocator—agent-relative permissions vanish. You are acting as a moral agent representing the claims of all involved. In that specific context, the numbers must count.

  ### Conclusion: Keep Multiplying, But Change the Ontology

  You can stay in the EA/LW orbit, but you should update your internal justification.

  "Shut up and multiply" is heuristically correct but metaphysically sloppy. It invites Taurek's critique because it treats people as buckets of utility. If you view morality as **maximizing the satisfaction of individual claims**, Taurek's "no super-entity" objection loses its bite. You don't need a super-entity to sum the claims; you just need to acknowledge that violating five rights is worse than violating one, even if no one "feels" the five violations at once.

  **The Final Answer:**
  1.  **Taurek is correct** that there is no impersonal "badness" floating in the universe.
  2.  **Taurek is incorrect** that this implies a coin flip. A coin flip disrespects the separate claims of the five by treating them as a single bloc.
  3.  **Numbers Count.** In impersonal rescue cases with equal stakes, you are morally obligated to save the greater number.
  4.  **The Mechanism:** You save the five not because 5 deaths hurt more than 1 death in a utilitarian sum, but because **five individual vetoes outweigh one.**

  Don't abandon the arithmetic. Just recognize that you aren't counting units of pain; you are counting persons who have a right not to be ignored. The coin flip ignores the five. Saving the five ignores the one. Morality demands we ignore the fewest claims possible. Save the five.
