          *   *Nuance:* Distinguish between "Small Numbers" (where lotteries might feel okay) vs. "Large Numbers" (where aggregation is mandatory). Actually, better distinction: "Same Stakes" vs. "Different Stakes." In Taurek's drug case, stakes are equal (life vs. life). When stakes are equal, the *number of claimants* decides.
          *   *Refining the Verdict:* Taurek is wrong. Numbers *do* count. But the *reason* they count isn't utilitarian summing; it's about satisfying the maximum number of individual claims. The coin flip is actually *less* respectful because it treats the 5 claims as equal to the 1 claim.
