          *   The problem with the coin flip: It guarantees more death ex-post.
      *   **Section 3: The Synthesis/Verdict (The "Landing"):**
          *   This is the critical part. I need to move beyond "Utilitarianism wins."
          *   Argument: Taurek identifies a real constraint (individual rights/claims), but his solution (pure lottery) violates the claims of the *many* just as much as utilitarianism violates the *one*.
          *   Adopt a "Claims-Based Aggregation" view (Kamm/Scanlon hybrid).
