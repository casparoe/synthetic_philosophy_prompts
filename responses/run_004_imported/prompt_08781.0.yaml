answer: |-
  You have hit on one of the most common and sharpest critiques of Timeless Decision Theory (TDT) and Functional Decision Theory (FDT). Your intuition is not wrong: in the specific case of standard Newcomb's Problem, EDT and FDT yield the same recommendation (one-box) for very similar-looking reasons.

  However, the claim that FDT is merely "rebranded EDT" is substantively incorrect. The difference lies not in the verdict on Newcomb's Problem, but in **which correlations count as decision-relevant** and **how counterfactuals are constructed**.

  Here is the substantive difference between one-boxing via EDT and one-boxing via FDT, and why the "logical dependence" machinery is necessary rather than cosmetic.

  ### 1. The Mechanism: Conditioning on Acts vs. Algorithms
  The core mathematical divergence is what the decision theory conditions on.

  *   **EDT** calculates expected utility by conditioning on the **action**: $E[U | \text{I do } A]$. It asks, "In the set of all worlds where I observe myself taking action $A$, what is the average utility?"
  *   **FDT** calculates expected utility by conditioning on the **output of the decision algorithm**: $E[U | \text{MyAlgorithm}() = A]$. It asks, "In the set of all worlds where my source code outputs $A$, what is the average utility?"

  In Newcomb's Problem, these often converge. If you one-box, it is evidence the predictor put money in (EDT). If your algorithm outputs "one-box," the predictor's simulation of your algorithm also output "one-box," so the money is in (FDT).

  But this convergence breaks down when the correlation between your action and the outcome is **not** mediated by a logical dependency between algorithms.

  ### 2. The Divergence: The Smoking Lesion Problem
  This is the canonical case where EDT and FDT (and CDT) diverge.

  **The Setup:** There is a genetic lesion that causes both a desire to smoke and lung cancer. Smoking itself does not cause cancer; the lesion does. You enjoy smoking.
  *   **EDT Verdict:** Do not smoke.
      *   *Reasoning:* Smoking is strong evidence that you have the lesion. $P(\text{Cancer} | \text{Smoke}) \gg P(\text{Cancer} | \text{Don't Smoke})$. Even though smoking doesn't *cause* cancer, doing it is bad news.
  *   **FDT Verdict:** Smoke.
      *   *Reasoning:* There is no **subjunctive dependence** between your decision algorithm and the lesion. The lesion is a physical fact about your biology that existed before your decision. Changing the output of your decision algorithm (from "don't smoke" to "smoke") does not logically force the lesion to exist or not exist. The correlation is "screened off" by the common cause (the lesion).

  If FDT were just EDT with extra steps, it would tell you not to smoke. It doesn't. It recognizes that the correlation in Newcomb's Problem is different in kind from the correlation in the Smoking Lesion.

  ### 3. "Logical" vs. "Evidential" Correlation
  You asked if "logical dependence" is just a dodge. It is an attempt to solve the **Reference Class Problem** that plagues EDT.

  EDT struggles to define which reference class matters. Why does my action correlate with Omega's prediction, but not with the genetic lesion?
  *   **EDT's weakness:** It treats all correlations as potentially decision-relevant. It cannot distinguish between a correlation caused by a common cause (Lesion) and a correlation caused by logical identity (Omega's simulation).
  *   **FDT's solution:** It restricts decision-relevance to **subjunctive dependence**. Two processes are subjunctively dependent if they are executing the same (or similar) abstract algorithm.
      *   In Newcomb's, Omega is running *your* algorithm (or a close approximation). If your algorithm outputs $X$, Omega's simulation *must* output $X$. This is a logical necessity, not just a statistical regularity.
      *   In the Smoking Lesion, the lesion is not running your algorithm. It is a physical precursor. Your decision algorithm can vary independently of the lesion's presence (you can decide to override the urge).

  The "logical" language is not marketing; it is an attempt to formalize **counterfactuals over computations** rather than counterfactuals over physical events. CDT fails Newcomb's because it says, "The money is already there; my action can't causally reach back in time." FDT replies, "My action doesn't reach back in time, but the *logical fact* of what my algorithm outputs is timeless. If my algorithm outputs 'two-box', it was always true that it would, and Omega would have always predicted that."

  ### 4. Why Not Just Admit It's EDT?
  Yudkowsky and MIRI didn't rebrand EDT because they view EDT as fundamentally broken, not just misunderstood.

  1.  **EDT is vulnerable to manipulation:** An EDT agent can be "money-pumped" by threats that create spurious correlations. If a blackmailer says, "I will punish you if you are the type of person who pays blackmailers," an EDT agent might pay to make the proposition "I am a payer" false, even if paying doesn't causally stop the blackmail. FDT refuses to pay in many blackmail scenarios (depending on the setup) because it recognizes the blackmailer is predicting the algorithm, and the algorithm "Don't Pay" yields better utility overall, even if it triggers the threat.
  2.  **The "Tickle Defense":** EDT proponents often try to save EDT from the Smoking Lesion by arguing that the agent should condition on their *urge* to smoke (the "tickle") rather than the act. This essentially forces EDT to act like CDT. FDT proponents argue this is an ad-hoc fix. FDT provides a unified formalism that handles Newcomb (like EDT) and Smoking Lesion (like CDT) without needing to manually adjust the reference class for every problem.
  3.  **Precommitment:** FDT is designed to be **reflectively consistent**. An FDT agent does not wish it had precommitted differently before entering the problem. An EDT agent in a Parfit's Hitchhiker scenario might wish it had precommitted to pay, but once saved, EDT might reason "Paying is now bad news (I'm out of the desert, why pay?)" and renege. FDT maintains the policy.

  ### 5. Criticism and Nuance
  It is worth noting that your skepticism is shared by many outside (and inside) the MIRI sphere.
  *   **Scott Alexander (ACX)** has argued that FDT is often underspecified. Determining exactly *how similar* two algorithms must be to count as "subjunctively dependent" is an unsolved problem. (Does Omega simulate me in Python or C++? Does it simulate a simplified model?)
  *   **Jeffrey-Bolker Rotation:** Some decision theorists argue that the distinction between "evidence" and "cause" is partly a matter of how you frame the probability space, suggesting the gap between EDT and FDT might be narrower than proponents claim.

  ### Summary
  Is it rebranding? **No.**
  Is there a substantive difference? **Yes.**

  *   **EDT one-boxes** because one-boxing is *evidence* of wealth. It fails when evidence is decoupled from influence (Smoking Lesion).
  *   **FDT one-boxes** because the *logical output* of its decision function determines the predictor's simulation. It succeeds in Newcomb's but also succeeds in Smoking Lesion (by smoking) because the lesion is not logically dependent on the algorithm.

  FDT is best understood not as "EDT with better marketing," but as an attempt to build a decision theory that captures EDT's ability to see non-causal correlations (in Newcomb's) while retaining CDT's ability to ignore spurious correlations (in the Lesion). The "subjunctive dependence" machinery is the filter that attempts to distinguish between the two. Whether that machinery successfully holds up under rigorous formalization is still an open debate, but the intent is genuinely distinct from EDT.
