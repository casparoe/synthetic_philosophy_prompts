answer: |-
  The problem of logical omniscience has long haunted formal epistemology. Standard Bayesianism demands that a rational agent's credences satisfy the axioms of probability. Since probability theory is defined over logical spaces, this implies that if an agent assigns probability 1 to the axioms of arithmetic, they must assign probability 1 to every theorem derivable from those axioms. This forces bounded reasoners—humans or machines—to be treated as if they know all mathematical truths instantly, rendering the concept of "logical uncertainty" incoherent. In 2016, Scott Garrabrant and colleagues at the Machine Intelligence Research Institute (MIRI) proposed "Logical Induction" (LI) as a solution. By modeling belief formation as a market of computable traders, they constructed a system that assigns non-extreme credences to unproven conjectures while guaranteeing convergence to coherence in the limit.

  However, the philosophical community remains divided on whether LI solves the problem or merely dresses it in new mathematics. One camp views it as a breakthrough that legitimizes logical uncertainty; the other sees it as an asymptotic promise that offers no guidance to finite agents. This essay will articulate the strongest arguments for both positions before defending the verdict that Logical Induction constitutes a genuine dissolution of the *epistemological paradox* of logical omniscience, even if it fails to provide a *computational manual* for belief assignment.

  ### The Case for Dissolution: Existence and Structure

  The proponents of Logical Induction argue that its primary value is an existence proof that shattered a theoretical deadlock. Prior to 2016, there was no known computable algorithm that could assign probabilities to logical sentences without eventually violating coherence or collapsing into omniscience. The "Pro" camp emphasizes that LI satisfies three critical properties that naive probabilistic approaches cannot.

  First, LI successfully decouples coherence from omniscience. By defining rationality through the "Logical Induction Criterion"—the requirement that no polynomial-time computable trader can exploit the market for unbounded profit—the framework allows an agent to assign a probability of 0.5 to the Goldbach Conjecture without being irrational. The agent is not required to know the truth value, only to price shares such that no efficient algorithm can pump money out of them systematically.

  Second, LI demonstrates the ability to learn statistical regularities in advance of proof. A standard deductive reasoner knows nothing about the distribution of prime digits until theorems are proved. A logical inductor, however, can learn that primes (beyond 2 and 5) end in 1, 3, 7, or 9 with roughly equal frequency, assigning credences near 25% to each possibility long before the Prime Number Theorem is derived. This captures the intuitive sense in which mathematicians have "hunches" based on patterns rather than proofs.

  Third, and perhaps most technically impressive, LI handles self-reference without paradox. The framework can accommodate sentences that refer to the market's own future prices (e.g., "The price of this sentence on day $n$ will be less than 0.5"). In traditional logic, such self-reference leads to Gödelian contradictions or liar paradoxes. LI's fixed-point construction ensures the market prices these sentences consistently, avoiding collapse. For proponents, these structural victories demonstrate that logical uncertainty is not a philosophical confusion but a tractable formal domain.

  ### The Case for Skepticism: Asymptopia and Arbitrariness

  The skeptical camp, however, argues that these structural virtues are mathematically elegant but epistemologically hollow. Their critique rests on the gap between asymptotic guarantees and finite reality.

  The primary objection is the lack of convergence rates. LI guarantees that the market's credences will converge to a coherent distribution *in the limit* as time goes to infinity. It offers no bound on how fast this happens. For a time-bound reasoner facing a specific problem—say, assigning a credence to the Riemann Hypothesis today—the theorem provides no concrete guidance. The market could remain wildly miscalibrated for a billion years before correcting itself. As the skeptics note, being told "the truth will eventually out" is no more useful to a bounded agent than the original demand for omniscience. If a theory of rationality cannot distinguish between a reasonable hunch and a wild guess at any finite time $t$, it fails to guide action.

  Furthermore, skeptics argue that LI merely relocates the arbitrariness it sought to eliminate. To make the market well-defined, one must choose a countable set of traders and assign them initial wealth (weights). This is effectively a "prior" over computable strategies, akin to the universal prior in Solomonoff induction. Different weightings yield different credences at finite times. Thus, LI does not eliminate the subjectivity of the prior; it hides it inside the market construction. If the goal was to find an objective method for logical uncertainty, LI fails; it simply substitutes the problem of "choosing a probability distribution" with "choosing a distribution over traders."

  Finally, there is the issue of computational tractability. While LI is technically computable, the cost of updating the market grows rapidly with the number of sentences considered. A real-world reasoner cannot simulate the full market. If the normative standard is impossible to implement, skeptics argue it cannot serve as a genuine norm for bounded rationality.

  ### Verdict: A Dissolution of the Paradox, Not a Calculator

  The debate between these camps hinges on what we mean by the "problem of logical uncertainty." If the problem is defined as "How do I calculate the exact probability of a conjecture right now?", then the skeptics are correct: Logical Induction leaves this essentially untouched. It provides no lookup table for mathematical truth.

  However, if the problem is defined epistemologically as "What constitutes a coherent state of belief for a non-omniscient reasoner?", then Logical Induction constitutes a **genuine dissolution** of the problem. The skeptics' critique confuses *computational complexity* with *epistemological validity*.

  Standard Bayesianism suffers from similar asymptotic and computational limitations. Computing exact posterior probabilities is generally intractable, and convergence theorems (like Doob's consistency theorem) are also asymptotic with no guaranteed rates. Yet, we do not dismiss Bayesianism as "epistemologically untouched" because of this; we accept it as the normative standard for empirical uncertainty, even if we must use approximations (like MCMC) in practice. Logical Induction deserves the same status. It provides the *constitution* for rational belief in the logical domain, defining the constraints (unexploitability) that any approximated reasoner should strive to satisfy.

  The skeptics' claim that LI "relocates arbitrariness" via trader weighting is also less damaging than it appears. While the choice of traders influences finite-time beliefs, the Logical Induction Criterion ensures that *any* choice of weights (provided all computable traders are included) leads to the same limit set of coherent distributions. The arbitrariness affects the *path*, not the *destination*. More importantly, LI shows that *any* computable prior over traders avoids the logical omniscience trap. This proves that logical uncertainty is compatible with coherence, which was the core paradox.

  Therefore, Logical Induction is a genuine dissolution of the problem, conditional on accepting that **epistemological norms define the structural constraints of rationality rather than prescribing specific belief values.** It solves the impossibility result that plagued formal epistemology for decades by proving that a reasoner can be coherent without being omniscient. It transforms logical uncertainty from a logical contradiction into an engineering challenge. The skeptics are right that the engineering is hard and the finite-time guidance is weak, but this does not negate the philosophical victory: the paradox is resolved. We now know what it *means* to be rationally uncertain about logic, even if calculating that state remains difficult. Logical Induction did not just build a better machine; it proved the machine was possible, and in doing so, it dissolved the claim that such a machine could never exist.
