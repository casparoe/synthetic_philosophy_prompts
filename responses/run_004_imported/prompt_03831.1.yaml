prompt: |-
  I spent my career as an experimental physicist, and although Leibniz's mathematics was a constant background presence in that work, I never had occasion to look into his philosophy until retirement gave me the time for it. I have been working slowly through the *Discourse on Metaphysics*, and Section II has brought me up short. In full, it reads:

  "II. Against those who hold that there is in the works of God no goodness, or that the principles of goodness and beauty are arbitrary.

  Therefore I am far removed from the opinion of those who maintain that there are no principles of goodness or perfection in the nature of things, or in the ideas which God has about them, and who say that the works of God are good only through the formal reason that God has made them. If this position were true, God, knowing that he is the author of things, would not have to regard them afterwards and find them good, as the Holy Scripture witnesses. Such anthropological expressions are used only to let us know that excellence is recognized in regarding the works themselves, even if we do not consider their evident dependence on their author. This is confirmed by the fact that it is in reflecting upon the works that we are able to discover the one who wrought. They must therefore bear in themselves his character. I confess that the contrary opinion seems to me extremely dangerous and closely approaches that of recent innovators who hold that the beauty of the universe and the goodness which we attribute to the works of God are chimeras of human beings who think of God in human terms. In saying, therefore, that things are not good according to any standard of goodness, but simply by the will of God, it seems to me that one destroys, without realizing it, all the love of God and all his glory; for why praise him for what he has done, if he would be equally praiseworthy in doing the contrary? Where will be his justice and his wisdom if he has only a certain despotic power, if arbitrary will takes the place of reasonableness, and if in accord with the definition of tyrants, justice consists in that which is pleasing to the most powerful? Besides it seems that every act of willing supposes some reason for the willing and this reason, of course, must precede the act. This is why, accordingly, I find so strange those expressions of certain philosophers who say that the eternal truths of metaphysics and Geometry, and consequently the principles of goodness, of justice, and of perfection, are effects only of the will of God. To me it seems that all these follow from his understanding, which does not depend upon his will any more than does his essence."

  As I understand it, Leibniz is rejecting the view that things are good, just, or beautiful simply because God wills them so — voluntarism, if I have the term right — on the grounds that this would make praise of God's goodness empty: he would be no more praiseworthy for what he did than a tyrant is for whatever happens to please him. That much I find persuasive. His positive alternative is to say that goodness, justice, and perfection follow instead from God's understanding, which "does not depend upon his will any more than does his essence."

  What I cannot work out is whether this actually solves the problem rather than just relocating it. If goodness answers to God's understanding rather than his will, then the relevant truths seem to be things his intellect discovers rather than things it institutes — which would seem to make them hold independently of God, landing us back on something like the second horn of the Euthyphro dilemma, only one level further in. Is there anything else in Leibniz's system — his treatment of essence, perhaps, or of the eternal truths generally — that would let him keep these truths internal to God rather than external to him? Or is this simply a cost of his position that he never squarely confronts?
