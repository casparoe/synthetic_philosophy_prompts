answer: |-
  The security feed showed Silas standing in the lobby, checking his watch for the third time in a minute. Arthur watched from the mezzanine, his coffee gone cold. This was the second test, and Arthur already felt the sting of the first one failing earlier that afternoon.

  The first test had been simple. Arthur had sent a summons: *Come to the boardroom. Bring the ledger. I need you to vouch for the numbers.* It was a request for solidarity, a moment where a partner stands shoulder-to-shoulder when the auditors start circling. Silas hadn't shown up. The boardroom clock had ticked past the hour, the auditors had raised their eyebrows, and Arthur had been forced to bluff his way through the discrepancies alone. He had marked it down as a definitive data point: when the pressure came, Silas had folded. The loyalty wasn't there.

  Now, Arthur watched the lobby feed. Silas was still down there. He hadn't left, which was interesting, but he hadn't come up, which was damning. Arthur picked up his phone and dialed Silas's direct line. He watched the screen on the wall as Silas pulled his phone from his pocket, looked at the name, and then shoved it back into his pocket without answering.

  Arthur set the coffee down. He took the elevator down.

  When the doors opened, the lobby was quiet, save for the hum of the HVAC. Silas was standing by the turnstiles, staring at the glass doors of the inner sanctum. He looked tired.

  "You didn't come up," Arthur said, his voice echoing slightly off the marble floor.

  Silas turned, relief washing over his face for a split second before tightening into something guarded. "I tried, Arthur. An hour ago. The system wouldn't let me in."

  "The system?"

  "My badge flashed red. Security said my access was revoked. I've been standing here waiting for you to come down or for them to override it."

  Arthur frowned. He remembered, vaguely, a directive he'd given his IT manager weeks ago during a fit of paranoia about corporate espionage. *Lock down all non-essential executive access during audit week.* He had forgotten to whitelist Silas. The barrier hadn't been Silas's will; it had been a digital lock Arthur himself had engaged. Silas had wanted to enter. He had stood there for an hour, willing to face the auditors, willing to take the heat. The disposition had been present, intact and steady, but the manifestation had been blocked by an intervening obstacle.

  Arthur felt a flicker of guilt, quickly smothered by a colder curiosity. The first test had been flawed. The environment had interfered. He needed to know if the loyalty existed in a vacuum, without the noise of bad logistics. He needed to see the raw material of the man.

  "I revoked it," Arthur said. He didn't apologize. Apologies complicated data. "I wanted to see if you'd find another way in. If you cared enough to climb the wall."

  Silas blinked. The relief vanished, replaced by a hollow look in his eyes. "You locked me out to test me?"

  "I needed to know where you stand."

  Silas looked at the turnstile, then back at Arthur. For a moment, Arthur thought he saw the old Silas, the one who had built this company from a garage, the one who would have argued, who would have demanded to be let in, who would have proven his devotion by force of will.

  But the question itself had changed the air in the room. By demanding proof, Arthur had implied that the proof wasn't already there. By treating the loyalty as a variable to be measured, he had treated it as something contingent, something that could be lost.

  "I stand where I'm invited, Arthur," Silas said. His voice was flat. "Not where I'm trapped."

  Arthur reached into his jacket and pulled out an envelope. It was thick. Severance. A golden parachute, generous enough to buy silence, generous enough to buy a new start. It was the final stimulus. A release.

  "Then take this," Arthur said, holding it out. "And go."

  It was a test of honesty, in a way. Would Silas refuse the money and demand his partnership? Or would he take the payout and walk away, confirming that he was only ever in it for the security?

  Silas looked at the envelope. He looked at Arthur. The look of guardedness hardened into something final. The act of being offered the exit made the exit real. The suspicion inherent in the offer severed the tether that had held Silas in the lobby for the last hour. If Arthur was ready to pay him to leave, then Silas was no longer a partner; he was a liability being managed.

  Silas took the envelope. He didn't count it. He just tucked it into his coat pocket.

  "Good luck with the audit," Silas said.

  He turned and walked through the glass doors, out into the night.

  Arthur stood alone in the lobby. He watched the tail lights of Silas's car disappear into traffic. He wondered if Silas had been loyal all along, until the moment Arthur asked him to prove it. He wondered if the lockout had been the only truth, or if the payout was. He wondered if there was any way to ask a man who he was without turning him into someone else.

  Arthur turned back to the elevator. He would have to face the auditors alone tomorrow. He pressed the button, but he didn't know if he was going up to finish the work, or if he was just waiting for the building to lock him out, too.
