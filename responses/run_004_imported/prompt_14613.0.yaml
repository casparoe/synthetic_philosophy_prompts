      *   *Idea 3: Preference Revision vs. Preference Violation.* Maybe the resolute chooser isn't violating a preference; they are ranking the *plan* higher than the *local outcome*.
      *   *Idea 4: The Cost of Fragmentation.* If you can't be resolute, you aren't an agent over time; you're a series of agent-stages. If you want to be a single agent, resoluteness is a prerequisite, not an option.

