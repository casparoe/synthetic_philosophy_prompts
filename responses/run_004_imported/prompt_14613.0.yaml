answer: |-
  Here is the case for the resolute chooser, stripped of the usual hand-waving about "willpower" and grounded in a structural critique of the objection itself.

  The objection you describe—that sticking to a plan against a local preference is *pro tanto* irrational—rests on a hidden metaphysical premise: **Temporal Atomism.** It assumes that the agent at $t_2$ is the primary locus of rational evaluation, and that the agent at $t_1$ is essentially a stranger whose wishes carry no normative weight other than as predictive data.

  To defend the resolute chooser, we must argue that this atomistic view is not just unhelpful, but fundamentally mistaken about the nature of agency. Here is the strongest version of that defense.

  ### 1. The Synchronic Fallacy
  The objection claims that at the final node, the agent faces a choice between $A$ and $B$, prefers $B$, and therefore choosing $A$ is irrational. This assumes that rationality is a **synchronic property** of a choice-node.

  This is the Synchronic Fallacy. It treats a decision tree like a series of unrelated slot machines rather than a single extended game. If you evaluate a chess move solely by the material advantage it grants *in that specific turn*, ignoring the strategy required to win the game 20 turns later, you are not being "locally rational"; you are being blind to the context that gives the move meaning.

  Rationality is not the maximization of preference satisfaction at a time-slice; it is the effective governance of a life over time. If the "local preference" at $t_2$ is the very mechanism that guarantees a globally dominated outcome (the money pump), then deferring to that preference is not rationality—it is **systemic self-sabotage**. The resolute chooser is the only one treating the decision problem as a unified whole rather than a disjointed sequence. To call them irrational is to define "rationality" in a way that guarantees failure.

  ### 2. Prior Intentions as Reason-Generators
  The standard objection assumes that at $t_2$, the normative landscape consists of the immediate outcomes ($A$ vs. $B$) and the agent's current ranking of them. It treats the prior resolution as merely a *constraint* or a *prediction*.

  This is incorrect. A prior intention is not just a prediction of future behavior; it is a **reason-generating state**. When an agent forms a plan at $t_1$, they do not merely predict they will choose $A$ at $t_2$; they create a new normative fact. By committing, they have introduced a new reason for action at $t_2$: *the integrity of the agency itself.*

  At $t_2$, the choice is not "Plan vs. Preference." The choice is "Preference + Reason to Maintain Agency Integrity vs. Preference." The resolute chooser is not ignoring their local preference; they are outweighing it with the reason generated by their prior commitment. If you deny this, you are asserting that past reasoning has *zero* normative authority over present action. But if past reasoning has zero authority, you cannot have projects, relationships, or long-term goals. You are reduced to a series of momentary selves. If you accept that we are unified agents, you must accept that past intentions generate present reasons. Therefore, acting on them is rational.

  ### 3. The Constitutive Argument
  Here is the sharpest point: **Resoluteness is constitutive of diachronic agency.**

  The objection assumes the agent exists fully at $t_2$ regardless of whether they are resolute. But consider what happens if the agent knows they will *not* be resolute (the sophisticated chooser). The sophisticated chooser, foreseeing they will deviate at $t_2$, refuses to enter the plan at $t_1$. Consequently, the beneficial outcome available only via the plan is never accessed.

  If an agent cannot be resolute, they are *incapable* of accessing certain goods. They are structurally barred from any outcome that requires temporary local sub-optimization for global gain.

  If rationality is the capacity to secure the best available outcomes for oneself, the non-resolute agent is *less rational* than the resolute one. The non-resolute agent is like a calculator that refuses to carry the one because it violates the rules of the current column. The "irrationality" of the resolute chooser at $t_2$ is like the "irrationality" of a sacrifice play in sports. Viewed in isolation (taking the ball out of play), it looks like a failure to score. Viewed as part of the game (winning the match), it is the only rational move.

  To call the resolute chooser irrational is to insist that the "move" must be evaluated in isolation from the "game." But there is no game without the moves being connected. Resoluteness is the glue that connects the time-slices into a single player. Without it, there is no agent to be rational *for*.

  ### 4. The Preference Misidentification
  Finally, the objection assumes we know what the agent's preferences *are* at $t_2$. It says, "They prefer $B$ over $A$."

  But preferences are not just raw urges; they are judgments of value. If the agent judges at $t_1$ that the plan leading to $A$ is better than the plan leading to $B$, and they maintain that judgment at $t_2$ via resolution, then their *all-things-considered* preference at $t_2$ is actually for $A$.

  The urge for $B$ is a *local* preference, but the commitment to $A$ is a *global* preference. Why privilege the local preference as the "true" metric of rationality? To do so is to arbitrarily decide that the most immediate impulse trumps the most considered judgment.

  The resolute chooser is not acting against their preferences; they are acting on their **higher-order preference** to be the kind of agent who can execute plans. The objection only seems compelling if you assume that "preference" means "immediate visceral ranking." If "preference" means "what the agent has most reason to do," the resolute chooser is satisfying their preference by definition.

  ### The Bottom Line
  The objection that resolute choice is irrational at the last step is question-begging. It defines rationality as **Dynamic Consistency** (obeying the preference at the current node) rather than **Global Optimality** (securing the best outcome over the tree).

  But Dynamic Consistency is only a virtue if the agent is a sequence of strangers. If the agent is a unified entity extended over time, Global Optimality is the true standard. The resolute chooser pays a "local cost" (ignoring the immediate urge) to purchase "global coherence" (avoiding the pump). To call this irrational is to claim that paying for coherence is a waste of money. But without coherence, there is no agent left to spend it.
