      *   *Key Concept:* Agency isn't a sequence of snapshots; it's a temporally extended entity.
      *   *Analogy:* Ulysses and the Sirens. But go deeper than just pre-commitment.
      *   *Philosophical Hook:* The nature of "preference" itself. Is a preference at $t_2$ really a "preference" if it undermines the agent's overarching goals?
