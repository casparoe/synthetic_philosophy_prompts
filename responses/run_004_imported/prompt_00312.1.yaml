  8.  **Final Polish:** Check against the user's specific constraints (PhD student, cognitive science, regression context). Ensure the distinction between *epistemic humility* and *intellectual spine* is clear. (Self-correction: Make sure not to sound like I'm dismissing the labmates entirely, but also not dismissing the user's intuition.)

