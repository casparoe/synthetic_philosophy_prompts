          3.  Black's Spheres: The reduction of relations to intrinsic properties. The status of space.
          4.  Verdict: Professor is largely right on modal status; Students are right that Leibniz thinks it's necessary *given* God's nature, but Black assumes a framework Leibniz rejects.
