answer: |-
  This is a fantastic deep cut. You've stumbled onto one of the most significant epistolary clashes in early Church history (Augustine's *Epistle 82* to Jerome). It reveals the exact moment where "Biblical Inerrancy" hardens into a doctrinal system.

  To answer your core question: **No, it is not just a slippery slope fallacy.** While it *looks* like one ("If we allow X, then eventually Z will happen"), for Augustine, it is an **epistemological necessity**.

  Here is the breakdown of the logic, the connection to his ethics on lying, and how your lapsed-seminarian character can wield this argument with intellectual weight.

  ### 1. The Logic: Authority vs. Utility
  Jerome's argument was pragmatic: Paul pretended to rebuke Peter to save face for the Jewish Christians. It was a "noble lie" (an *officium mendacium*). The outcome (unity) justified the means (deception).

  Augustine's counter-argument is structural. He is arguing about the **nature of Canonical Authority**.

  *   **The Premise:** Scripture is the ultimate court of appeal for Christian truth. It is the "high sanctuary of authority."
  *   **The Problem:** If the authors of Scripture can intentionally write falsehoods for a "good cause," then the text is no longer an objective standard. It becomes subjective.
  *   **The Consequence:** If Paul can lie to help the Gentiles, then any difficult passage can be dismissed as a "helpful lie." If a doctrine is hard to believe (e.g., the Resurrection), a skeptic can say, "That was just a pious fiction to encourage the disciples."
  *   **The Logic:** It's not that society *will* inevitably slide into chaos (slippery slope); it's that the **mechanism of verification is destroyed immediately.** If the standard of truth is "what helps" rather than "what happened," the text loses its ability to judge the reader. The reader becomes the judge of what is "helpful."

  **For your character:** They should understand that Augustine isn't being pedantic; he's protecting the *system*. If you pull one brick out (the possibility of a holy lie), the arch collapses. Augustine is saying: *"You cannot build a court of ultimate appeal on a foundation of negotiated truth."*

  ### 2. The Connection to "Officious Lies"
  This connects directly to Augustine's treatises *On Lying* (*De Mendacio*) and *Against Lying* (*Contra Mendacium*).

  Augustine holds one of the hardest lines in the history of ethics: **There is no such thing as a harmless lie.**
  *   **Ontological Truth:** For Augustine, God is not just *true*; God is *Truth* itself. To lie is not just to say a false thing; it is to turn away from the nature of God.
  *   **The Three Categories:** Augustine categorizes lies, but even the "best" category (the officious lie—told to help someone, hurting no one) is still a sin. It might be a *venial* sin rather than a *mortal* one, but it is still a rupture in the soul's alignment with Reality.
  *   **The Galatians Stakes:** If Paul tells an officious lie in Galatians, he is sinning. If an Apostle sins *in the inscription of Scripture*, is that sin divinely inspired? If yes, God inspires sin. If no, the text is merely human. Both options are theological catastrophes for Augustine.

  **For your character:** They need to see that Augustine's rigidity isn't about being mean; it's about **ontological hygiene.** Augustine believes that lying damages the *liar* more than the *lied-to*. By lying to "save" the faith, Paul would actually be undermining the very Reality the faith is built on.

  ### 3. How the Character Defends This
  A lapsed-seminarian shouldn't sound like they are preaching this as "Good News." They should sound like someone who respects the **intellectual architecture** of the belief, even if they've left the building. They see the beauty in the rigidity.

  Here are three angles your character can take to defend Augustine's position without sounding like a fundamentalist:

  #### A. The "Rule of Law" Argument
  Your character can frame it as a legal or constitutional issue.
  > "Look, Jerome wanted Paul to be a good pastor. Augustine wanted the Constitution to hold. If you allow the Founders to write fictional clauses for 'public safety,' the Constitution is worthless. Augustine saw that if you let Truth bend for Charity, eventually Charity eats Truth. And then you have nothing left to be charitable *about*."

  #### B. The "Patient Trust" Argument
  This highlights the relational aspect. Augustine argues that if we can't trust the text, we can't trust God.
  > "It's about trust. If I find out my best friend lied to me, even to 'protect' me, I don't feel loved. I feel managed. Augustine was saying that God doesn't want to manage us with fictions. He wants to relate to us in reality. Even if the reality is messy. To suggest Paul faked that fight is to suggest God treats us like children who need fairy tales."

  #### C. The "Tragic Cost" Argument (Best for a Lapsed Character)
  This acknowledges the human cost of Augustine's logic. It shows the character understands the *burden* of this theology.
  > "Augustine's position is terrifyingly consistent. He'd rather admit Peter was a hypocrite and Paul was angry than admit they told a holy lie. Why? Because a hypocrite can be forgiven. A lie sanctified by Scripture is a cancer. It's a hard line. It cost him his friendship with Jerome for a while. But he knew that if you make an exception for the 'good guys,' you lose the ability to call out the bad guys later."

  ### Sample Dialogue Snippet
  *Context: Your character is explaining this to a friend who thinks Augustine was just being uptight.*

  "You think Augustine was sweating the small stuff? He wasn't. He was looking down the barrel of a gun. Jerome said, 'It's okay, Paul just pretended to be mad to keep the peace.' A nice sentiment. But Augustine replies, 'If you open that door, you never close it.'

  "Imagine you're reading a history book, and the author says, 'I invented this battle scene to inspire patriotism.' You'd throw the book away. Augustine said Scripture is the history of salvation. If Paul writes fiction there, even for a good cause, then the whole library is suspect. Every miracle, every promise—it all becomes 'potentially useful fiction.'

  "Augustine would rather believe the Apostles were flawed men arguing in real time than perfect actors staging a play. Because flawed men can be redeemed by Grace. Actors are just selling a script. He chose the messy truth over the clean lie. I can't believe the theology anymore, but god help me, I respect the integrity of that."

  ### Key Vocabulary for the Character
  If you want them to sound authentic, have them drop these concepts naturally:
  *   **Officium Mendacium:** The "officious lie" (the lie of duty/help).
  *   **Infallibility vs. Inerrancy:** Augustine is arguing for a proto-inerrancy (no errors, even in intent).
  *   **Economy of Truth:** Jerome was arguing for a "divine economy" (managing truth for the greater good). Augustine rejected this.
  *   **Scandal:** Augustine feared the "scandal" of the lie more than the "scandal" of the conflict.

  ### Summary for your Research
  Augustine's logic is tight **if** you accept his premise that Scripture is the absolute, singular authority on reality. If Scripture is *not* that, Jerome wins (it's just a letter between colleagues). If Scripture *is* that, Augustine wins (you cannot have falsehood in the ultimate standard).

  Your character, having studied this, likely sees that Augustine's "slippery slope" was actually a prophecy. Once higher criticism started treating Biblical narratives as "pious fictions" in the 19th century, they used the exact door Jerome tried to open. Augustine saw the future. That's the kind of insight that makes a lapsed-seminarian character compelling: they see the coherence of the system they left.
