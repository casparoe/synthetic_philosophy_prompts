answer: |-
  Your gut is onto something real, and in this specific context, **your gut is right and your roommate is wrong.**

  Your roommate is applying a principle from classical decision theory called the **Value of Information**. In a purely mathematical model involving a perfectly rational agent, free information always has non-negative value. The logic is: "If I get information I don't like, I can just ignore it and do what I would have done anyway. If I get information I do like, I can optimize. Therefore, I can't lose."

  However, that model assumes you are a robot with perfect self-control. It ignores **behavioral economics** and **human psychology**. Here is why your intuition is the smarter play:

  ### 1. The Problem of Dynamic Inconsistency
  In economics, this is known as *time inconsistency* or a *commitment problem*.
  *   **Now (Before you know):** You want to maximize your grade for grad school. You are motivated.
  *   **Later (After you know you passed):** Your reference point shifts. Your brain subconsciously changes the goal from "Maximize Grade" to "Maintain Pass."

  Once you know you are safe, the *marginal utility* of studying feels lower. The pain of studying remains the same, but the perceived reward drops because the "failure" state has been eliminated. Your roommate assumes you can choose to ignore the information, but you cannot choose to ignore the **psychological relief** that comes with it. That relief kills urgency.

  ### 2. Moral Hazard
  This is a classic case of **moral hazard**. When you are insulated from risk (knowing you can't fail), you are likely to take less care (study less).
  *   **Grad School Reality:** As you noted, grad schools don't just look at Pass/Fail. They look at GPA and specific course grades. A "B" when you could have gotten an "A" because you slacked off is an opportunity cost that hurts your application.
  *   **The Risk:** If you ask and the answer is "Yes," you risk trading a potential 4.0 for a 3.0. If you ask and the answer is "No," you gain motivation. You have to weigh the probability of each against your self-knowledge.

  ### 3. Strategic Ignorance
  Sometimes, **ignorance is a commitment device.**
  By *not* asking, you are forcing yourself to operate under the assumption that you might still fail. This keeps your adrenaline and work ethic high. It's the academic equivalent of a dieter not weighing themselves every day so that a temporary fluctuation doesn't discourage them, or a pitcher not looking at the scoreboard so they stay aggressive.

  ### The Verdict
  Your roommate is right in a vacuum where humans are perfectly rational computers. You are right in the real world where humans are subject to motivation fluctuations.

  **Don't ask.**

  If you are the type of person who suspects you might ease off, you *will* ease off. Protecting your future self from your present complacency is a valid strategy. Keep the uncertainty alive; let it fuel your study sessions. The potential downside of complacency (a lower GPA) outweighs the upside of relief (less stress now).

  **One exception:** If you are currently on the absolute borderline and *need* to know if you should focus entirely on this class or shift energy to other finals, the information might be worth it. But if your goal is maximizing the score, stay in the dark.
