answer: |-
  **Setting:** *A quiet corner of a university library, late afternoon. Two whiteboards are covered in stochastic calculus and decision trees. **Elena** (PhD candidate in statistical physics) is erasing a diagram of a random walk. **Marcus** (PhD candidate in economics/decision theory) is sipping cold coffee, staring at a calculation.*

  **Marcus:** So, we agree on the setup. Coin is biased. Sixty percent heads, forty percent tails. Even money payoff. We play fifty times. Starting bankroll, let's say ten thousand dollars. My move is trivial: I bet the whole ten grand on the first flip. Then I bet whatever remains on the second. I repeat until round fifty.

  **Elena:** And my move is to bet twenty percent of my current bankroll each time. The Kelly fraction. $p - q = 0.6 - 0.4$.

  **Marcus:** Exactly. And here is where the "geometric rationality" crowd loses me. Look at the expected value. If I bet everything, my expected wealth after one flip is $10,000 \times (0.6 \times 2 + 0.4 \times 0) = 12,000$. I'm gaining twenty percent in expectation per flip. Compounded over fifty flips? My expected final wealth is $10,000 \times 1.2^{50}$. That's roughly ninety-one million dollars.

  **Elena:** Ninety-one million *in expectation*. But expectation is an average across parallel universes, Marcus. In *this* universe, the one where we actually live, if you hit a single tails in those fifty flips, you have zero. The probability of fifty heads in a row is $0.6^{50}$. That's roughly $10^{-11}$. You will go broke. With probability essentially one, you walk away with nothing.

  **Marcus:** "Essentially one" isn't "one." And you're conflating the *most likely outcome* with the *expected outcome*. Yes, the median outcome of my strategy is zero. But the mean is ninety-one million. If I am an expected-value maximizer with linear utility—meaning I value every dollar equally regardless of how many I have—then betting everything is the *only* rational choice. To do otherwise is to leave money on the table.

  **Elena:** But that's the smuggling operation I'm talking about. You're claiming "linear utility" is a neutral baseline. It's not. It's a specific, bizarre preference structure that says having a billion dollars is a billion times better than having one dollar. In the real world, utility saturates. But beyond preferences, there's a deeper issue: ergodicity.

  **Marcus:** Here we go. The Peters-Gell-Mann argument.

  **Elena:** It's not just a slogan. It's about the difference between a time average and an ensemble average. Your ninety-one million figure is an ensemble average. It's calculated by imagining a billion Marcuses playing this game, most going bust, and a handful becoming trillionaires, and then averaging their wealth. But you are a single person playing through *time*. You don't get to average across the billion versions of yourself that went bust. You only get the one path. For a multiplicative process like betting, the time-average growth rate is the geometric mean, not the arithmetic mean. The geometric mean of your all-in strategy is zero.

  **Marcus:** I grant you that the time-average growth rate is zero. But why must I maximize the time-average growth rate? That's the question you keep dodging. You say Kelly is "objectively correct" because it maximizes long-run growth. But "long-run" is a preference. If I tell you, "I don't care about the long run. I care about the mathematical expectation of this specific 50-round sequence," why is that irrational?

  **Elena:** Because it ignores the physical constraint of non-recoverability. Once you hit zero, the game stops for you. You can't compound on zero. By betting everything, you are treating wealth as additive when it is fundamentally multiplicative. Log-wealth isn't just a utility function I *like*; it's the natural metric of multiplicative dynamics. If you want to maximize the actual wealth you hold in your hand at the end of a long sequence, you must maximize the expected log.

  **Marcus:** But "long sequence" is doing a lot of heavy lifting. We said fifty rounds. In fifty rounds, the probability of ruin for me is $1 - 0.6^{50}$. It's high, yes. But suppose we change the payoff. Suppose it's 10-to-1 odds on a 60% coin. Now my EV is massive. The probability of ruin is still the same—one tails kills me. But the upside is so large that even with the risk of ruin, the EV dominates. Are you telling me that for *any* positive EV bet, regardless of magnitude, I must never bet more than Kelly?

  **Elena:** I'm telling you that if you bet more than Kelly, you are voluntarily reducing your long-term growth rate. You're taking on volatility drag. Even with 10-to-1 odds, if you bet full bankroll every time, your wealth path trends to zero almost surely as $N \to \infty$.

  **Marcus:** There's the slip. "As $N \to \infty$." We don't live in the limit. We live in finite time. If I have linear utility, I am indifferent to the path. I care about the integral of the probability distribution times the payoff. If I bet all-in, I am buying a lottery ticket that costs ten thousand dollars and has an expected payout of ninety-one million. If you bet Kelly, your expected payout is also huge—actually, let's calculate it. With Kelly, your expected wealth is *also* $1.2^{50}$ times the bankroll.

  **Elena:** Wait, what?

  **Marcus:** Check the math. For a single bet, $E[W] = W_0(p(1+f) + q(1-f)) = W_0(1 + f(p-q))$. This is linear in $f$. To maximize expected wealth after one bet, you maximize $f$. So $f=1$. Since expectation is linear, the expected wealth after $N$ bets is just the product of the expected growth per bet. So for *any* fixed fraction strategy, the expected final wealth is $W_0 (1 + f(p-q))^N$. Since $p-q > 0$, this is maximized at $f=1$. My All-In strategy and your Kelly strategy have the same *expected* final wealth? No, mine is higher. Much higher.

  **Elena:** That's the paradox. The expectation is dominated by the vanishingly rare worlds where you win fifty times in a row. In ninety-nine point nine nine... percent of the possible paths, I crush you. In the median path, I have roughly $10,000 \times e^{50 \times (0.6 \ln 1.2 + 0.4 \ln 0.8)} \approx 10,000 \times e^{1} \approx 27,000$. You have zero.

  **Marcus:** Precisely! You are maximizing the *median* outcome. I am maximizing the *mean* outcome. You call the median "objective reality" because it's the typical path. I call the mean "rational value" because it accounts for the magnitude of the outliers. If I can play this game once, and I have the chance to turn 10k into 91 million in expectation, why should I cap my bet to ensure I end up with 27k? That's not physics, Elena. That's risk aversion. You're just using the word "ergodicity" to dress up a conservative utility function.

  **Elena:** It is not conservative to avoid certain ruin! Look, imagine we play this game not for dollars, but for survival tokens. You need tokens to eat. If you hit zero, you die. Does your linear utility hold then?

  **Marcus:** If the utility of zero is negative infinity, then yes, I won't bet everything. But that's because I changed the utility function, not because the betting math changed. The Kelly criterion isn't a law of nature; it's the optimal strategy for an agent with logarithmic utility. If I have linear utility, Kelly is suboptimal. The disagreement isn't about probability. It's about what we value. You value *staying in the game*. I value *maximizing the abstract expectation*.

  **Elena:** But "staying in the game" is a prerequisite for *any* value in a repeated setting! You say you value linear dollars. But dollars are only useful if you can spend them. If your strategy guarantees you end up with zero in almost every realization of the future, then the "ninety-one million expectation" is a phantom. It's a number that exists in the math but not in the world. By calling Kelly "subjective preference," you're ignoring that the math of compounding imposes a structure on reality. The geometric mean is the only growth rate that is physically accessible to a single trajectory. The arithmetic mean is a fiction of the ensemble.

  **Marcus:** I reject that the arithmetic mean is a fiction. Insurance companies use it. Casinos use it. They don't bet Kelly on every hand; they take the other side of people who do. The casino acts as an EV maximizer across many independent bets. They rely on the Law of Large Numbers across *space* (many gamblers), not just *time* (one gambler). If I can parallelize my risk—if I can find a thousand friends to each take one flip of this coin with me—then I *should* bet everything. The ensemble becomes real.

  **Elena:** But you don't have a thousand friends. You have one bankroll and one timeline. That's the human condition.

  **Marcus:** Is it? I'm entering a math competition this fall. I'm running a pick'em pool. These are finite games. In a pick'em pool, if I finish with zero points, I lose. But if I finish with the highest score, I win the pot. The utility isn't linear in dollars; it's binary based on rank. In a tournament setting, Kelly might actually be too conservative! If everyone else is betting aggressively, and I bet Kelly, I might grow steadily but never catch the leader who got lucky. In that context, maximizing the mean might be the correct strategy to win the pool, even if it risks ruin.

  **Elena:** *Pauses.* Okay. In a tournament with a fixed endpoint and a winner-take-all payout structure, the objective changes. You're no longer maximizing wealth; you're maximizing probability of being the maximum. That's a different utility function. But in the context of *wealth management*, where you want to sustain purchasing power over time, claiming EV maximization is "rational" is dangerous. It implies that a strategy leading to certain ruin is acceptable as long as the hypothetical upside is big enough.

  **Marcus:** And claiming Kelly is "objectively correct" implies that anyone who disagrees is bad at math. It isn't. They just weigh the tails differently. I'm willing to accept a 99.999% chance of zero for a 0.001% chance of ninety-one million. You aren't. Neither of us is irrational. We just have different risk tolerances. The Kelly criterion tells you how to bet *given* log utility. It doesn't prove you *must* have log utility.

  **Elena:** I'll concede that utility is subjective. But I stand by the ergodicity argument. For a single agent facing repeated multiplicative risks, the expected log-wealth is the only quantity that converges to the actual experienced wealth. The expected linear wealth diverges from experience. So, while you aren't "irrational" for having linear utility, you are deluding yourself if you think you will *realize* that expected value. You're optimizing for a ghost.

  **Marcus:** And you're optimizing for the typical case, ignoring the black swans that actually drive the value. If we play this game a billion times in parallel, I win. If we play it once through time, you win. The question is: do we live in an ensemble or a trajectory?

  **Elena:** We live in a trajectory.

  **Marcus:** But we plan using ensembles.

  *They both look at the whiteboard. The equation $E[W] = W_0(1+f(p-q))^N$ sits next to $g = p \ln(1+f) + q \ln(1-f)$.*

  **Elena:** So, for the pick'em pool?

  **Marcus:** For the pool, where the goal is to beat the other guys and the season is short... I might go above Kelly. Maybe half-bankroll.

  **Elena:** And for the long-term investment account?

  **Marcus:** *Sighs.* Kelly. Or close to it. Because I do need to eat next year.

  **Elena:** Good. Then we agree on the strategy, even if we disagree on the philosophy.

  **Marcus:** I'll take that. But I'm still keeping the ninety-one million in my expected value calculation. Just in case.

  **Elena:** Just don't bet the rent on it.

  **Marcus:** No promises.

  *Marcus picks up his marker. Elena hands him an eraser.*
