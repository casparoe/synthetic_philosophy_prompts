answer: |-
  **Conference Room B, 11:45 PM. The whiteboard is covered in red marker.**

  **Marcus (VP):** I'm not asking for a head on a spike, Elena. I'm asking for agency. Systems don't type commands. People do. If we say "the system failed," we're speaking in metaphors. If we want to prevent recurrence, we need to know which agent bypassed the check.

  **Elena (Principal Engineer):** And if we fire the person who typed the command, we'll just hire someone new to type the same command next month. You're treating this like a crime scene. It's an epidemiology study.

  **Marcus:** Epidemiology?

  **Elena:** Durkheim. Suicide rates. You can't predict which specific person will commit suicide based on their psychology, but you can predict the *rate* of suicide based on social integration. The rate is a social fact, distinct from the individuals. Our outage rate is a social fact. It's emergent. Blaming the deployer is like blaming the water molecule for drowning.

  **Marcus:** That's poetic, but it's magic. You're positing a "system" that exists independently of the people composing it. That's a promissory note nobody's ever cashed. You claim "the system" caused this, but you can't show me the mechanism without pointing to a person. If you can't reduce it to individual actions, you're saying effects happen without causes.

  **Elena:** I'm saying the causes are structural. The incentives here made skipping the test suite the rational choice for any individual. The system constrains the choice set.

  **Marcus:** Okay, let's talk constraints. Coleman's Boat. We start at the Macro—the pressure to ship. That influences the Micro—the engineer's decision. Which leads back to the Macro—the outage. I agree with the boat. But you're stuck on the top deck. You won't look at the Micro foundation. If we don't identify the specific decision point, we can't adjust the incentives. Accountability *is* the mechanism.

  **Elena:** Accountability implies choice. But when the CI/CD pipeline takes four hours and the business screams for speed, the "choice" is an illusion. The system selected for risk. You want to fix the Micro by punishing the actor? That just drives the error underground. They'll hide the failure next time.

  **Marcus:** So we do nothing? We tell the board "sociology made us lose four million dollars"?

  **Elena:** We tell them the architecture couples deployment with revenue too tightly. We decouple. We make the blast radius smaller.

  **Marcus:** And who implements that?

  **Elena:** The team.

  **Marcus:** Which is made of *individuals*. Look, I get the holism. The whole is greater than the sum of parts. But if I don't know which part cracked, I don't know where to reinforce. You say "the system" is shorthand for a million choices. Fine. Then help me find the specific choices that mattered. Don't hide behind the aggregate.

  **Elena:** And don't hide behind "accountability" to avoid fixing the infrastructure that makes failure inevitable. You want a name so you can close the ticket. I'm telling you the ticket stays open until we change the environment.

  **Marcus:** Then give me a lever. Individual or system, I need something to pull.

  **Elena:** Pull the budget. Kill the feature freeze. Let us build the safety rails.

  **Marcus:** I need a name to justify the budget.

  **Elena:** Then you're part of the system that caused the outage.

  *(Silence. Marcus caps his pen. Elena erases a section of the whiteboard.)*
