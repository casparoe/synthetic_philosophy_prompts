  **Neander's selected-effects refinement:** Selection history creates a normative standard that current failure cannot violate, offering the most precise biological account of malfunction.
  **Millikan's proper function theory:** Lineage membership grants function status regardless of individual token performance, securing the function claim through historical reproduction.
  **Wright's etiological theory:** Historical origin secures function against current incapacity, though it lacks Neander's specific rigor regarding natural selection mechanisms.
  **Boorse's biostatistical (goal-contribution) theory:** Statistical reference classes allow traits to retain function types despite abnormal performance, distinguishing function from normal function.
  **Bigelow & Pargetter's propensity theory:** Propensities attach to trait types in environments, though broken tokens lack the actual causal power to fully satisfy the propensity condition.
  **Cummins' causal-role theory:** Function is identical to current causal contribution, so a failing trait literally loses its function during the period of failure.
