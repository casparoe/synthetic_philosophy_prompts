          *   *Core Claim:* Mental illnesses are not real diseases because they lack identifiable physical lesions/pathology. They are "problems in living."
          *   *Ontology:* Strict biological realism. If it's not physical, it's not a disease.
          *   *Normative/Political:* Diagnosis is a tool of social control/oppression.
      *   **Ian Hacking:** Famous for "Making Up People" and "The Looping Effects of Human Kinds" (1980s-90s).
          *   *Core Claim:* Human kinds (classifications of people) interact with the classified. People know how they are classified and change themselves to fit (or resist) the classification. This changes the classification over time.
          *   *Ontology:* "Dynamic Nominalism." Kinds and people co-evolve.
          *   *Key Distinction:* Hacking does *not* deny the reality of the suffering or the effectiveness of the classification. He denies *indifferent realism* (the idea that the kind exists independently of the classification).
      *   **Looping Effects:** The feedback loop between classification -> self-conception/behavior -> revised classification.
      *   **Complex PTSD (C-PTSD):** A specific diagnosis (often in ICD-11, debated in DSM-5) related to prolonged trauma.

  3.  **Evaluate the User's Argument (The "Collapse"):**
      *   *User:* Looping effects $\rightarrow$ No independent objective condition $\rightarrow$ Szasz's "Myth."
      *   *Critique:* This conflates *ontological independence* with *reality/effects*.
      *   *Szasz:* Says it's a myth because it's not *biological*.
      *   *Hacking:* Says it's real *because* it interacts and changes, even if it's not biologically fixed in an indifferent way. Hacking is not an eliminativist like Szasz. Hacking thinks the kinds are *real* in a social/historical sense, just not in a natural kind (like gold or electrons) sense.
      *   *The Crucial Difference:* Szasz says "It's not real, stop treating it as disease." Hacking says "It is real, but its reality is historically dynamic and interactive." Hacking validates the *experience* and the *social reality*, whereas Szasz often dismisses the medical framework entirely.

  4.  **Formulate the Response:**
