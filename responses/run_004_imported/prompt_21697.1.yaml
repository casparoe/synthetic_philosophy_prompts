answer: |-
  Your friend is right: you are collapsing a crucial distinction. While both Ian Hacking and Thomas Szasz are critical of standard psychiatric realism, they arrive at diametrically opposed conclusions about the **reality** and **value** of diagnostic categories.

  Your argument rests on the premise that if a category is mutable and interactive, it cannot be objective, and if it is not objective, it is a "myth" (in Szasz's sense). Hacking would reject both steps of that inference.

  Here is the breakdown of why Hacking's "looping effects" do not vindicate Szasz's "myth" thesis, and why that distinction matters for your cousin's diagnosis.

  ### 1. Szasz: The Eliminativist
  Thomas Szasz's argument in *The Myth of Mental Illness* is rooted in a strict **biological realism**.
  *   **The Claim:** For a condition to be a legitimate "illness," it must have a identifiable physical lesion or pathological deviation in the body (like a virus or a tumor).
  *   **The Conclusion:** Since mental disorders lack these specific physical markers, they are not real diseases. They are "problems in living" or metaphors.
  *   **The Goal:** Szasz is an **eliminativist**. He believes we should stop using medical language for these conditions because doing so is coercive and misleading. For Szasz, if it's not biologically fixed, it's a fiction.

  ### 2. Hacking: The Dynamic Nominalist
  Ian Hacking's work on "making up people" and "looping effects" comes from a different philosophical tradition (historical ontology).
  *   **The Claim:** Human kinds (classifications of people) are different from natural kinds (like gold or electrons). Natural kinds are "indifferent"—gold doesn't care if you call it gold. Human kinds are "interactive"—people know how they are classified and change their behavior or self-conception in response.
  *   **The Conclusion:** This does not make the category a "myth." It makes it **dynamic**. The suffering, the behavior, and the social consequences are undeniably real. The feedback loop (diagnosis $\rightarrow$ self-change $\rightarrow$ revised diagnosis) is a causal mechanism, not proof of non-existence.
  *   **The Goal:** Hacking is **not an eliminativist**. He argues that these categories create new ways for people to *be*. A diagnosis like C-PTSD doesn't just describe a pre-existing state; it offers a script that allows a person to understand their pain, seek help, and join a community.

  ### 3. The Crucial Distinction: "Indifferent" vs. "Interactive" Reality
  Your argument assumes that **objectivity** requires **independence** (the thing must exist unchanged regardless of whether we label it).
  *   **Szasz agrees:** Since mental illness changes based on culture and labeling, it is not independent, therefore it is not real.
  *   **Hacking disagrees:** He argues that "independence" is the wrong metric for human beings. He distinguishes between **indifferent realism** (things exist regardless of us) and **interactive realism** (things exist *through* our interaction with them).

  For Hacking, a looping effect proves that the category has **causal power**. If a diagnosis of C-PTSD changes how your cousin understands her past, regulates her emotions, or interacts with therapists, that diagnosis is doing real work in the world. It is not tracking a static biological "thing," but it is tracking a **real, evolving historical phenomenon**.

  To Hacking, saying C-PTSD is a "myth" because it loops would be like saying "money" is a myth because its value depends on human belief and interaction. Money is socially constructed, but its effects are objectively real.

  ### 4. Why This Matters for C-PTSD
  Applying this to your cousin's diagnosis clarifies the stakes:

  *   **The Szaszian View (Your interpretation):** Because the criteria for C-PTSD might shift as patients and clinicians learn more about trauma, the diagnosis is essentially fake. It is a social construct masking a lack of biological truth. This can be invalidating to the sufferer, implying their pain is merely a "problem in living" rather than a legitimate condition.
  *   **The Hackingian View:** The fact that C-PTSD is subject to looping effects means it is a **living category**. As survivors of prolonged trauma articulate their experiences, they reshape the clinical understanding of trauma. This doesn't make the trauma less real; it makes the *understanding* of the trauma more precise. The "moving target" isn't a failure of science; it is a feature of studying human beings.

  ### Summary
  You are right that Hacking agrees with Szasz that mental illness categories are not "natural kinds" in the biological sense. However, you are wrong to conclude that Hacking thinks they are "myths."

  *   **Szasz:** Not biological = Not real = Abolish the category.
  *   **Hacking:** Not biological = Interactive = Acknowledge the historical reality and ethical weight of the category.

  Hacking vindicates the **complexity** of the diagnosis, not its non-existence. He would argue that your cousin's C-PTSD is real precisely because it participates in these looping effects: it shapes her life, her treatment shapes it back, and that interaction constitutes a genuine form of human reality, even if it isn't written in her genes. Your friend was correct to sense that you were using Hacking to support a conclusion (Szasz's eliminativism) that Hacking explicitly rejected.
