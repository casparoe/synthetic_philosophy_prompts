      *   **Context:** A dinner argument about a cousin's diagnosis of complex PTSD (C-PTSD).
      *   **User's Position:** Ian Hacking's concept of "looping effects" supports Thomas Szasz's claim that mental illness is a "myth."
      *   **User's Reasoning:** If diagnostic categories change because people absorb the label and change their behavior (which then changes the category), the category isn't tracking an independent, objective condition. It's a social construct/moving target.
