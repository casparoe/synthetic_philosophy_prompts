      *   **Explain Szasz:** Focus on his biological realism and eliminativism. Mental illness = myth because no lesion.
      *   **Explain Hacking:** Focus on "Dynamic Nominalism" and "Interactive Kinds." The reality is in the interaction, not in a static biological substrate.
      *   **The Key Distinction (Objectivity vs. Reality):**
          *   Szasz: No biology = No reality.
          *   Hacking: Interaction/Looping = A *different kind* of reality (not indifferent, but still causal and real).
          *   Hacking does not think looping makes the condition "fake." It makes it *historical*.
      *   **Apply to C-PTSD:**
