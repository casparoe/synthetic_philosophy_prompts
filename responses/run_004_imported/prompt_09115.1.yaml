answer: |-
  This is an excellent thesis. It is textually grounded, philosophically nuanced, and aligns with the dominant strand of contemporary Thomistic scholarship (championed by scholars like J.P. Torrell, John Finnis, and Anthony Lisska). Arguing for compatibility rather than retraction allows you to present Aquinas as a consistent thinker whose political realism deepened over time, rather than one who flip-flopped on a matter of life and death.

  Below is an argumentative framework designed to support your thesis, followed by a treatment of the strongest counter-argument (the "change of mind" hypothesis) and how to neutralize it.

  ### I. The Core Argument: Distinguishing the *Tyrannus ex Defectu Tituli* from the *Tyrannus ex Parte Exercitii*

  The strongest pillar of your reconciling thesis is the distinction between the **object** of the action in each text. Aquinas is not discussing the same kind of ruler in both passages.

  **1. The *Sentences* Commentary (The Usurper)**
  In *II Sent., d. 44, q. 2, a. 2*, Aquinas addresses the specific case of a ruler who holds power by **no legitimate title** (*nullum titulum habens*). In scholastic terminology, this is the *tyrannus ex defectu tituli* (tyrant by defect of title).
  *   **The Argument:** Such a ruler is not truly a "ruler" in the moral or juridical sense; he is a brigand with an army. Because he lacks the *authority* of office, he does not possess the "public personhood" that protects a legitimate magistrate.
  *   **The Implication:** Killing him is not technically "regicide" or sedition; it is an act of defense against an aggressor who has no right to command. This is why Aquinas can cite the biblical example of Ehud slaying Eglon without qualification. The private individual acts not against *authority*, but against *force*.

  **2. *De Regimine Principum* (The Legitimate Tyrant)**
  In *De Regimine* I.6, Aquinas addresses a ruler who **degenerates into tyranny** (*in tyrannidem degenerat*). This is the *tyrannus ex parte exercitii* (tyrant by exercise of power).
  *   **The Argument:** This ruler possesses a legitimate title but abuses the power entrusted to him. Because he holds a legitimate office, he possesses "public authority."
  *   **The Implication:** To kill him is to attack the *office* itself, not just the person. Since the office was instituted by a public authority (the community, the nobility, or a higher sovereign), only that same public authority can depose him. A private individual lacks the jurisdiction to judge the officeholder.

  **How this supports your thesis:**
  You can argue that there is no contradiction because the *Sentences* passage grants a license to kill **usurpers**, while *De Regimine* forbids private individuals from killing **legitimate rulers who turn bad**. The caution in *De Regimine* is not a retraction of the permission in *Sentences*; it is a clarification that the permission does not extend to legitimate kings who govern poorly.

  ### II. The Role of "Public Authority" and Order

  Your thesis hinges on the work done by the phrase "public authority." You can deepen this by appealing to Aquinas's metaphysics of order.

  **1. The Danger of Private Judgment**
  In *De Regimine*, Aquinas's shift toward caution is driven by a concern for the **common good of order**. Even if a ruler is tyrannical, the *process* of removing him matters.
  *   **The Argument:** If private individuals are licensed to judge the morality of their rulers, the result is not liberty but anarchy. As Aquinas notes, sedition often leads to a worse tyranny.
  *   **Reconciliation:** This does not contradict the *Sentences*. A usurper (*Sentences*) creates anarchy by his very existence; removing him restores order. A legitimate tyrant (*De Regimine*) exists within an order; removing him privately *destroys* order. Therefore, the *Sentences* permission is an exception for a specific disorder (usurpation), while *De Regimine* establishes the rule for maintaining political order.

  **2. Prudential Refinement, Not Doctrinal Reversal**
  You can frame the *De Regimine* passage as a **prudential expansion** of the earlier view.
  *   In the *Sentences* (an early theological work), Aquinas is answering a casuistic question about obedience: *"Am I bound to obey?"* The answer is *"No, not if he has no title."*
  *   In *De Regimine* (a later political work), he is answering a structural question: *"How do we maintain a regime?"* Here, the focus shifts to the consequences of action.
  *   **Thesis Support:** A change in context (theological casuistry vs. political science) explains the change in tone without requiring a change in moral principle. The principle remains: *Private violence against public authority is illicit.* The *Sentences* simply clarifies that a usurper holds no true public authority.

  ### III. Addressing the Strongest Counter-Argument: The "Change of Mind" Hypothesis

  The strongest reason to think Aquinas changed his mind is the **tonal shift** combined with the **chronological gap**. In the *Sentences* (c. 1256), he seems enthusiastic about liberation; in *De Regimine* (c. 1267–71), he seems fearful of sedition. Furthermore, some scholars point to the *Summa Theologiae* (II-II, q. 42, a. 2), written near the end of his life, which condemns sedition vehemently and seems to side with *De Regimine*, suggesting Aquinas "grew out of" the *Sentences* view.

  **How to Neutralize This Objection:**

  **1. The *Summa* as the Bridge, Not the Break**
  You should argue that the *Summa Theologiae* actually validates your reconciling thesis. In *Summa* II-II, q. 64, a. 3, Aquinas discusses killing sinners. He argues that only those with public authority can licitly kill. However, he makes an exception for private individuals acting in self-defense against an aggressor.
  *   **Application:** This synthesizes the two earlier texts. The usurper (*Sentences*) is an aggressor with no right to rule, so killing him is self-defense/defense of the community. The legitimate tyrant (*De Regimine*) is a public authority, so killing him is a public act, not private self-defense. The *Summa* shows the mature Aquinas holding both views simultaneously, proving they were never contradictory.

  **2. The Authorship Caveat (and how to use it)**
  A sophisticated objection is that *De Regimine* Book I is Aquinas, but Book II is by his student Tolomeo of Lucca, and even Book I may have been edited. Some skeptics argue the "cautious" passages are later interpolations.
  *   **Your Move:** Acknowledge this textual uncertainty but argue it is unnecessary to solve the problem. Even if we accept *De Regimine* I.6 as purely Aquinas, the distinction of titles (usurper vs. legitimate) remains the most charitable and textually faithful reading. To claim he "changed his mind" requires assuming he forgot the distinction he made in the *Sentences*, which is unlikely for a systematic thinker. It is more methodologically sound to assume consistency unless contradiction is unavoidable. Here, it is avoidable.

  **3. The Definition of "Sedition"**
  The "change of mind" proponents argue that *De Regimine* condemns what *Sentences* praises. You can counter this by analyzing the definition of **sedition**.
  *   In *Sentences*, killing a usurper is not sedition because a usurper is not a legitimate part of the political order.
  *   In *De Regimine*, killing a legitimate ruler *is* sedition because it fractures the unity of the multitude.
  *   Therefore, Aquinas consistently condemns sedition; he simply defines the boundaries of sedition differently based on the legitimacy of the ruler's title.

  ### IV. Recommendations for Strengthening Your Paper

  To make this thesis shine in a seminar setting, consider these nuances:

  1.  **Focus on the "Public Person":** Draw out Aquinas's idea that the King is a "public person." When a usurper rules, there is no public person, only a private man with a sword. When a legitimate king tyrannizes, he is still a public person, and thus only the "whole multitude" (or its representatives) can act against him. This metaphysical distinction does the heavy lifting in your argument.
  2.  **Historical Context:** Briefly mention the context of the Italian city-states. In the *Sentences*, Aquinas is in Paris, dealing with abstract theology. By *De Regimine*, he is advising the King of Cyprus and observing the factional violence of Italian communes. The shift in tone reflects a shift from **theoretical justice** to **political prudence**. This supports your claim that *De Regimine* is an extension, not a retraction.
  3.  **The "Worse Tyranny" Argument:** Highlight Aquinas's pragmatic insight in *De Regimine*: that tyrannicide often fails to produce liberty. This shows his political maturity. You can argue that the *Sentences* gives the *right* to kill a usurper, but *De Regimine* warns that exercising rights without regard for consequences is imprudent. This adds a layer of virtue ethics (prudence) to your political analysis.

  ### Conclusion

  Your thesis is robust. By anchoring your argument in the distinction between *tyrannus ex defectu tituli* and *tyrannus ex parte exercitii*, you demonstrate that Aquinas's apparent inconsistency is actually a sophisticated differentiation of cases. The "change of mind" hypothesis relies on flattening these two distinct political scenarios into one.

  If you write this paper, ensure you explicitly define "public authority" in both texts. In the *Sentences*, the usurper lacks it entirely; in *De Regimine*, the tyrant retains it until formally deposed. Once that definition is locked in, the compatibility of the texts becomes not just plausible, but necessary.
