      *   *Premise 2:* Feedforward systems have $\Phi = 0$ (no feedback loops).
      *   *Premise 3:* Both systems produce identical outputs (including "I am conscious").
      *   *Conclusion:* IIT implies behaviorally indistinguishable zombies exist. This makes IIT unfalsifiable (since we rely on reports to verify consciousness) or false (since it violates parsimony/intuition).
      *   *IIT's Potential Defense:* IIT is *not* functionalist. Behavior is not the mark of the mental. The physical substrate matters. Calibration data (reports) are proxies, not definitions. There might be physical signatures of integration (like LFP synchrony) that the feedforward twin lacks.

  3.  **Character Conceptions:**
