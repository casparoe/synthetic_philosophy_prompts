      *   *Classification:* He does categorize lies (8 types in *De Mendacio*), ranging from doctrinal lies to lies to save a life. Even the "beneficial" lies are sins, though venial rather than mortal in some cases.
      *   *Distinction:* He does distinguish between *lying* (asserting falsehood) and *concealing truth* (silence, ambiguity, refusing to answer).
      *   *User's Representation:* The draft accurately captures the absolutism, the two treatises, the 8 categories, and the permission for silence/ambiguity.
