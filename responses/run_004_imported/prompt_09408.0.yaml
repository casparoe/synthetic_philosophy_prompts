answer: |-
  Here is a clear, argumentative breakdown you can use to structure your paper. Per your request, I am taking a definitive side: **Douglass's textualist reading is the more defensible and politically vital position, and his interpretive principle is a legitimate method of constitutional construction, not merely motivated reasoning.**

  While Garrison was historically accurate regarding the *framers' intentions*, Douglass was legally and morally correct regarding the *document's authority*. In a constitutional republic, the text binds the citizenry, not the secret compromises of dead men.

  ### 1. The Interpretive Principle: Liberty vs. Oppression
  Your roommate argues Douglass engaged in "motivated reasoning." This confuses political motivation with legal logic. Douglass adopted a specific canon of construction: **When a legal text is ambiguous, it must be interpreted in favor of liberty rather than oppression.**

  This is not an invention of Douglass; it is a standard principle of common law and legal hermeneutics (often related to the "rule of lenity" in criminal law or the presumption against absurdity). A Constitution is a *normative* document—it sets out what the government *ought* to be. If the text allows for a reading that aligns with the Declaration of Independence's premise (natural rights), that reading must prevail over a reading that requires assuming some humans are property.

  Garrison's approach treats the Constitution as a historical contract reflecting the moral failings of 1787. Douglass treats it as a living legal instrument that derives its power from the consent of the governed *now*. If you accept that the Constitution is the supreme law, you cannot simultaneously argue it legally sanctions chattel slavery without admitting the law itself is illegitimate. Douglass chose to make the law legitimate by forcing it to conform to justice. That isn't blindness; it's statecraft.

  ### 2. Analyzing the Three Clauses
  Garrison points to specific clauses as proof of a pro-slavery compact. Douglass dismantles them by sticking strictly to the text, avoiding the word "slave" which appears nowhere in the document.

  **A. The Three-Fifths Clause (Article I, Section 2)**
  *   **Garrison's View:** This dehumanizes Black people, counting them as less than white people to boost Southern representation.
  *   **Douglass's View:** This is actually a penalty on slave states, not a boon. If enslaved people were considered full "persons" (as Douglass argued they naturally were), the South would have gained *more* representatives. By counting them as only three-fifths, the Constitution reduced the South's political power compared to a free population. Furthermore, the clause refers to "free Persons" and "all other Persons." It does not define "other Persons" as property. It is a formula for taxation and representation, not a definition of humanity.
  *   **Verdict:** Douglass wins here. The clause limits Southern power relative to a free population baseline. It is a compromise that contains the seeds of slavery's political containment.

  **B. The Fugitive Slave Clause (Article IV, Section 2)**
  *   **Garrison's View:** This mandates the return of escaped slaves, making the federal government an enforcer of bondage.
  *   **Douglass's View:** The text says "Person held to Service or Labour." It does not say "slave." Under natural law, no human can be "held" as property. Therefore, this clause legally applies only to indentured servants or apprentices (contractual labor), which existed in the North as well. To read it as sanctioning chattel slavery requires importing the *institution* of slavery into the text where the text only describes a *person*.
  *   **Verdict:** This is Douglass's strongest textual argument. By refusing to acknowledge the legal fiction that a human is property, the text remains consistent with liberty. The government is required to return a "person," but if that person is being held unlawfully (as all slaves were, by natural law), the clause doesn't apply.

  **C. The Migration/Importation Clause (Article I, Section 9)**
  *   **Garrison's View:** This protects the slave trade until 1808, legitimizing the trafficking of humans.
  *   **Douglass's View:** This clause does not *require* the trade to continue; it merely prevents Congress from *banning* it before 1808. More importantly, it gives Congress the explicit power to ban it thereafter. It is a temporary restraint on federal power, not a permanent guarantee of slavery. By setting a date, the Constitution signaled the trade's eventual extinction.
  *   **Verdict:** Douglass is correct. A document that mandates slavery would protect the trade in perpetuity. A document that allows for its termination treats it as an anomaly, not a permanent feature.

  ### 3. Why Garrison is Wrong (and Why It Matters)
  Garrison's reading is "honest" only in a historical sense. He looked at the private letters of the Framers and the political deals made in Philadelphia. But in a democracy, **secret intentions do not make law; public text makes law.**

  If Garrison is right, then the abolitionist has no recourse within the system. You must burn the Constitution and dissolve the Union. This is morally pure but politically suicidal. It leaves the slave at the mercy of the South with no federal mechanism for intervention.

  Douglass realized that to end slavery, he needed the power of the federal government. To wield that power, he needed the Constitution to be his weapon, not his enemy. This wasn't just "expediency"; it was a recognition that the Constitution belongs to the living, not the dead. By arguing the Constitution is anti-slavery, Douglass forced the nation to live up to its own laws. He made it impossible for the North to claim they were "law-abiding" while tolerating slavery.

  ### The Thesis for Your Paper
  Here is a direct thesis statement you can adapt:

  > "While William Lloyd Garrison correctly identified the pro-slavery intentions of the Constitutional Framers, Frederick Douglass's post-1851 textualist reading is the superior political and legal argument. By applying the interpretive principle that ambiguous legal language must be construed in favor of liberty, Douglass demonstrated that the Three-Fifths, Fugitive Slave, and Importation clauses do not legally sanction chattel slavery. Unlike Garrison's historical fatalism, Douglass's 'Glorious Liberty Document' argument transformed the Constitution from a barrier into a tool for emancipation, proving that in a constitutional republic, the text's potential for justice outweighs the founders' compromises."

  ### Conclusion
  Take Douglass's side. Garrison's view leads to nihilism (the law is evil, so opt out). Douglass's view leads to reconstruction (the law is good, so fix it). History vindicated Douglass: The Civil War and the Reconstruction Amendments (13th, 14th, 15th) validated the idea that the Constitution could be used to destroy slavery and expand citizenship. Douglass didn't just change his mind to fit a political strategy; he realized that **legal interpretation is itself a political act**, and he chose the one that saved the Union and freed the slaves.
