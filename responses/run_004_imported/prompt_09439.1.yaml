answer: |-
  Your gut reaction is absolutely correct: **Do not do this.** In the context of a commercial bargaining deal, revealing your complete negotiation playbook is strategically suicidal.

  The concept you are recalling comes from the **LessWrong** rationalist community and associated game theory research (specifically work by Eliezer Yudkowsky, Benja Fallenstein, and others at the Machine Intelligence Research Institute). The specific terms you're looking for are **Program Equilibrium**, **Source Code Exchange**, or **Löbian Cooperation**.

  Here is the breakdown of why the theory exists, why it doesn't apply to your situation, and why your intuition about the "loop" is spot-on.

  ### 1. The Theory: Program Equilibrium & Fairbot
  In standard Game Theory, specifically the **Prisoner's Dilemma**, two rational agents who will never meet again should theoretically defect (betray each other) because there is no future reputation to protect. This leads to a sub-optimal outcome for both.

  Around 2010–2014, rationalist theorists proposed a solution: What if, instead of choosing "Cooperate" or "Defect," you submitted a **computer program** that contained your strategy? Before the game starts, both programs get to read each other's **source code**.

  *   **The "Fairbot" Strategy:** A program might be written to say: *"I will Cooperate if and only if I can prove that the other program will Cooperate against me."*
  *   **The Result:** If both sides run compatible "Fairbot" logic, they can mathematically prove to each other that they will cooperate, locking in a mutually beneficial outcome without needing trust or repeated interactions. This is **Löbian Cooperation**.

  The vendor's rep is likely paraphrasing this idea. They are claiming that by exchanging "source code" (playbooks), you can bypass the distrust of a one-off deal and lock in a fair outcome.

  ### 2. Why It Fails for Your Import Deal
  The critical error here is confusing a **Cooperation Problem** (Prisoner's Dilemma) with a **Bargaining Problem** (Dividing the Surplus).

  *   **Prisoner's Dilemma:** The goal is to ensure the deal happens at all (Cooperate/Cooperate vs. Defect/Defect). Revealing code helps here because it commits you to cooperation.
  *   **Bargaining Problem:** The deal *can* happen, but the question is **at what price?** There is a "Zone of Possible Agreement" (ZOPA). For example, you are willing to pay up to $100, and they are willing to sell down to $60. The $40 difference is the surplus.

  In a bargaining scenario, **information asymmetry is your only leverage.**
  *   If you reveal your playbook, you are effectively revealing your **reservation price** (your walk-away point) and your **concession algorithm** (how desperate you are).
  *   If their AI sees that your playbook says, *"Accept any offer under $95,"* and their playbook says, *"Demand as much as possible,"* their AI will simply offer $94.99.
  *   You get zero surplus. They capture all the value.

  The vendor's claim that this "beats normal negotiating" is only true if your goal is simply to sign *any* contract rather than to sign a *profitable* one. Since you are in business to make a margin, this tool would likely price you out of your profit.

  ### 3. Your Intuition on the "Loop" is Correct
  You noted: *"Both playbooks are defined in terms of each other, which seems like it should loop forever."*

  You have intuitively identified the **Halting Problem** inherent in this setup.
  *   If Agent A says: *"I match Agent B unless Agent B exploits me."*
  *   And Agent B says: *"I match Agent A unless Agent A exploits me."*
  *   To decide, A must simulate B. But B is simulating A. This creates infinite recursion.

  The rationalist theorists solved this using **Gödelian logic** and **provability** (hence "Löbian Cooperation"), allowing the agents to prove the outcome without running the infinite simulation. However, this requires the agents to be running on compatible, formal logical systems. In the real world, where one AI might be a black-box neural net and the other a rules-based script, this logic breaks down, leading to errors, crashes, or unpredictable behavior.

  ### 4. The "Commitment Standoff"
  You also asked: *"Aren't we just back to the same 'who commits first' standoff?"*

  Yes. In game theory, this is related to the **Game of Chicken**. If both sides reveal their playbooks, and both playbooks contain a "hardline" clause (e.g., *"If they demand more than X, walk away"*), you risk a **disaster equilibrium** where the deal falls through unnecessarily because the algorithms locked horns before a human could intervene.

  Furthermore, since you can still walk away *after* reading the playbook, the vendor has gained a massive informational advantage for free. They see your cards; you see theirs. If their playbook is vague ("optimize for value") and yours is specific ("match within 5%"), you lose.

  ### Verdict
  The vendor's representative is likely either:
  1.  **Ideologically motivated:** They believe in the "rationalist" ideal of transparent AI cooperation and are testing it on you.
  2.  **Strategically aggressive:** They know that revealing your playbook in a bargaining context is a mistake, and they are hoping you will agree to it so they can extract maximum value.

  **Recommendation:**
  Politely decline. Stick to traditional negotiation where offers and concessions are revealed sequentially, not simultaneously. Your intuition is protecting your margin.

  **The terms you were looking for:**
  *   **Program Equilibrium** (Moshe Tennenholtz)
  *   **Fairbot / PrudentBot** (Eliezer Yudkowsky / MIRI)
  *   **Löbian Cooperation**
  *   **Source Code Exchange**
  *   **LessWrong** (The blog/community)
