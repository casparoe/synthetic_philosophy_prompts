      *   *Point 2: Paternalism as Moralism.* Limiting consent implies the state knows better than the individual what is good for them. This is a perfectionist or moralistic claim about human dignity/nature. Devlin would say this confirms the law's role in upholding a moral order.
      *   *Point 3: The Disintegration Thesis Revisited.* If Hart admits public order depends on not offending shared sensibilities, he admits social cohesion depends on *some* shared moral baseline. Devlin just argues that baseline is broader. Hart has no non-arbitrary way to say *which* morals are essential and which aren't, other than "the ones I like."
      *   *Conclusion:* Hart becomes a "moderate legal moralist" (like Moore or Kahan might define it), not a liberal neutralist.

