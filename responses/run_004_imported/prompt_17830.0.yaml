      *   **Hart:** (Millian Liberal). Law should only prevent harm to others. Shared morality isn't necessary for cohesion; only a minimal framework of rules is needed. Devlin confuses change with disintegration.
      *   **The Concessions:**
          1.  *Paternalism:* Hart accepts limits on consent regarding serious bodily harm (e.g., maiming, killing).
          2.  *Offense/Public Indecency:* Hart accepts restrictions on public acts not necessarily causing "harm" in the Millian sense but offending sensibilities.

  3.  **Brainstorming the "Collapse" Argument:**
      *   *Goal:* Show that Hart's exceptions aren't just pragmatic tweaks but rely on the same *logic* Devlin uses.
      *   *Devlin's Logic:* The law reflects the community's moral judgment. If the community feels strongly (disgust, indignation), that's evidence of a threat to the social fabric.
      *   *Hart's Logic:* The law prevents harm.
      *   *The Gap:* If Hart allows law to intervene where there is no direct "harm to others" (in the physical/economic sense) but rather "offense" or "self-harm," he is implicitly acknowledging that the *moral quality* of the act matters, not just its consequences.
      *   *The "Disintegration" Angle:* Devlin says moral divergence causes disintegration. Hart says no. But if Hart allows law to police public sensibilities (indecency), he is admitting that *shared sensibilities* are necessary for public order. If shared sensibilities are necessary, then Devlin is right that threatening them threatens society.
