      *   **Dead Donor Rule:** Organ procurement requires the patient to be dead. If brain death isn't "real" death, removing organs kills the patient.
      *   **Biological Reality:** Brain-dead bodies exhibit homeostasis (wound healing, gestation, hormonal regulation) without a brain. This challenges the "loss of integration" theory.
      *   **Legal vs. Biological:** The UDDA offers two *alternative* pathways, implying they are distinct concepts, not just time-shifted versions of the same thing.

