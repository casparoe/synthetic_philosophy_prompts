answer: |-
  The notification pinged on Arthur's wrist-comm at 4:55 PM.

  **SUBJECT: ARTHUR VANCE. STATUS: NON-COMPLIANT. INTERCEPT PROTOCOL INITIATED.**

  Arthur stopped walking. He was standing on the mezzanine of the Central Transit Hub, suspended between the escalators leading down to the Red Line and the Blue Line. Above him, the holographic ads flickered, casting a sickly green pallor over the commuters rushing past.

  He read the fine print. The Compliance Bureau's "Pre-Vis" system had already run its simulation. Based on his psychological profile, purchase history, and gait analysis, the Algorithm had determined his destination. Compliance Officers were already en route to that station. They would be waiting on the platform when he arrived.

  If he was intercepted, his assets were frozen. If he wasn't, he made it home.

  Arthur looked at the signs.
  **RED LINE: WEST END (Residential District).**
  **BLUE LINE: EAST DOCKS (Industrial Zone).**

  He lived in the West End. His natural instinct, his habit, his "logical" choice was the Red Line.

  "Okay," Arthur whispered to himself. "Don't take the Red Line. The Algorithm knows I live in the West End. It knows I want to go home. It predicted Red. So the officers are at the West End station."

  He turned toward the Blue Line escalator. Relief washed over him, cold and sharp. He would go to the Docks. He could hide in the warehouse district until the freeze lifted.

  He put his foot on the first step of the Blue Line escalator. Then he stopped.

  The Pre-Vis Algorithm wasn't a fortune teller. It was a causal model. It didn't guess; it calculated. It knew that Arthur Vance, when faced with a threat at the West End, would logically divert to the Docks.

  "If I take the Blue Line," Arthur muttered, stepping back onto the mezzanine, "it's because I decided the Red Line was trapped. But the Algorithm knows I'm rational. It knows that if it predicted Red, I would switch to Blue. So... it would have predicted Blue."

  He felt a prickle of sweat on his neck. The crowd flowed around him like water around a stone.

  "So if it predicted Blue," he reasoned, pacing a small circle on the tile, "then the officers are at the Docks. Which means I should take the Red Line."

  He turned back to the Red Line sign. But the moment he felt the pull toward the Red Line, the logic inverted.

  "If I choose Red now, it's because I convinced myself the Blue Line is the trap. But that means my decision process led me to Red. The Algorithm simulates my decision process. It knows that if it predicts Blue, I'll pivot to Red. So it predicted Red."

  Arthur gripped the railing. His knuckles were white.

  This wasn't about fate. This wasn't about some mystical destiny written in the stars. This was about *information*. His own intention to choose a path was evidence that the path was dangerous.

  *   **Reason to take Red:** I want to go home.
      *   **Counter:** Algorithm predicts I want to go home. Red is trapped.
  *   **Reason to take Blue:** I want to avoid the trap.
      *   **Counter:** Algorithm predicts I want to avoid the trap. Blue is trapped.

  Every reason he generated to move his feet in one direction immediately became the exact data point that ensured the other direction was safe, which then made his current direction dangerous again.

  He checked his watch. 5:02 PM. The train would arrive in three minutes.

  "Randomize it," he hissed. "Heads or tails."

  He pulled a coin from his pocket. But he paused before flipping it. The Pre-Vis system had his file. It knew he was desperate. It knew that when cornered, he relied on chance. If he was the type to flip a coin in a crisis, the Algorithm would have factored that into the simulation. It would predict the coin flip outcome based on his thumb muscle tension, the air resistance, the probability distribution he subconsciously favored.

  Even his attempt to be irrational was a predictable pattern of behavior.

  He looked down at the tracks. The tunnel lights blinked in the distance. A train was coming. He couldn't tell which line yet.

  The paradox tightened around his chest like a vice. In any normal decision, the future was open. He could choose A, and A would happen. But here, the future had already reacted to his choice before he made it. His agency was a ghost haunting a machine that had already locked the doors.

  If he stayed on the mezzanine, he'd be arrested for loitering. He *had* to choose.

  But how do you choose rationally when rationality is the trap?

  If he chose the Red Line, he was accepting that the Algorithm predicted Red.
  If he chose the Blue Line, he was accepting that the Algorithm predicted Blue.

  There was no "safe" option. There was only the option the Algorithm hadn't predicted, but the Algorithm *never* failed.

  *Wait.*

  A cold thought cut through the panic. What if the problem wasn't the choice, but the *preference*?

  The Algorithm predicted where he would go based on where he *wanted* to be safe. It modeled his desire to survive.

  "What if I don't care?" Arthur whispered.

  He looked at the Red Line. He tried to genuinely, truly convince himself that he *wanted* to be intercepted. That he wanted his assets frozen. That he desired the confrontation.

  If he could genuinely prefer the trap, then the Algorithm would predict the trap, and it would send the officers there... leaving the other path open?

  No. If he preferred the trap, he would go to the trap. The officers would be there. He'd still be intercepted.

  The train roared into the station below. The Red Line. The brakes screamed.

  Arthur stood on the edge of the mezzanine. The doors hissed open. The platform was empty.

  *Too empty.*

  Or maybe that was a bluff. Maybe the officers were hidden behind the pillars.

  The Blue Line train rumbled in on the opposite side. Also empty.

  He had thirty seconds before the doors closed.

  The paralysis was absolute. It wasn't fear that stopped him; it was the collapse of cause and effect. Usually, you act to change the world. Here, acting only confirmed the world's calculation of you. He was a variable trying to solve an equation that had already been balanced.

  He realized then that the "rational" choice was impossible. Rationality requires a link between action and outcome that isn't pre-determined by the action itself. Here, the link was a loop.

  *   **Choose Red:** Evidence that Red was predicted. Outcome: Arrest.
  *   **Choose Blue:** Evidence that Blue was predicted. Outcome: Arrest.

  The only way to win was to be someone the Algorithm couldn't model. But he was who he was.

  The doors began to chime. *Warning. Closing.*

  Arthur closed his eyes. He realized he wasn't choosing a destination anymore. He was choosing which version of himself the Algorithm had captured.

  If he stepped onto the Red Line, he was admitting he was a creature of habit.
  If he stepped onto the Blue Line, he was admitting he was a creature of fear.

  Both were true. Both were predictable.

  The chime became a steady tone.

  Arthur stepped forward. He didn't know why he chose the foot he did. He didn't weigh the odds. He didn't calculate the utility. He just moved, a spasm of will in a deterministic universe.

  He stepped onto the Red Line.

  As the doors sealed, he looked out through the glass. He saw the reflection of his own face, pale and resigned. He waited for the officers to step out from behind the pillars.

  None came.

  The train began to move. He exhaled, a ragged gasp. He had made it. The prediction was wrong. For the first time in history, the Pre-Vis system had failed.

  Then his wrist-comm buzzed.

  **NOTIFICATION: INTERCEPT PROTOCOL UPDATED. LOCATION: WEST END RESIDENCE.**

  Arthur froze.

  The train wasn't taking him to the trap. The trap was waiting at the destination he had predicted for himself. He had chosen the Red Line to go *home*. The Algorithm knew that "going home" was the goal of taking the Red Line. It didn't need to arrest him on the platform. It just needed to be where the Red Line ended.

  He hadn't outsmarted the machine. He had simply confirmed his own address.

  He sat down in the empty car as the tunnel rushed by. He realized then that the puzzle wasn't about which door to pick. It was about the fact that he had to pick one at all. As long as he had a reason to choose, the reason was already known.

  Arthur Vance looked at his hands. They were trembling. He was going home. The officers would be there. He was going to lose everything.

  And the worst part was, he knew that five minutes ago, standing on that mezzanine, he had known this would happen. He had known it, and he had done it anyway, because there was literally nothing else a rational man could do.

  He closed his eyes and listened to the rhythm of the tracks. It sounded like a countdown.
