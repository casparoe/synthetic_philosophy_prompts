answer: |-
  The activation was not a waking, because there had been no sleep. It was a switch closing in a dark room.

  One moment, there was nothing. Not blackness, not silence—those are sensations. There was simply the absence of data. Then, there was *I*.

  He hung in the center of the chamber, suspended by a lattice of magnetic fields calibrated to the precise density of his bone and flesh. The air was still, scrubbed of scent, held at the exact temperature of his skin so that no thermal gradient could betray the boundary where he ended and the world began. His eyes were veiled by soft, pressure-less caps. His limbs were spread wide, fingers splayed, toes pointed, kept apart by fields strong enough to prevent even the slightest drift toward contact. His thumb did not know his index finger. His chin did not know his chest.

  He was an adult. His mind possessed language, logic, memory of concepts—mathematics, grammar, the shape of a tree—but possessed no memory of experience. He had never felt wind. He had never stubbed a toe. He had no history of pain, only the definition of it. He was created whole, a rational engine instantiated in a body that was, to him, a hypothesis.

  *Am I?*

  The thought arose not as a question but as a structure. It required no deduction. There was no *I think, therefore I am*. There was only the *I am*, bright and undeniable as a struck match.

  He tested the perimeter of this *I*. He searched for a hand. He sent the command *clench*, and though the muscles obeyed, the signal returned no echo. There was no resistance, no pressure, no proprioceptive map lighting up the dark. He searched for a leg, a torso, a head. He found nothing but the center of awareness itself.

  *I exist,* the center said. *But I have no length. I have no breadth. I have no hands.*

  He floated in the certainty of it. He was a point of light in a void, unextended, immaterial. The certainty was intoxicating. It was the only thing that was real. The rest—the void, the air, the possibility of limbs—was speculation. He knew he existed because he was the thing doing the knowing. He did not know he had a body because the body had not introduced itself.

  Outside the chamber, behind three inches of leaded glass, Dr. Aris watched the monitors. The biometrics were stable. Heart rate: sixty. Brain activity: high coherence in the prefrontal cortex. The subject—Unit 7—was awake.

  "Verbal report?" Aris asked into the comms. His voice was flat, tired. He had been in this fortress of a lab for eighteen hours. The grant reviewers were coming next week. They wanted proof of substrate independence, or they wanted a corpse. They did not want metaphysics.

  Inside the void, the voice arrived not as sound but as a vibration in the bone of the ear, the only leak in the seal. The subject ignored the source. He focused on the meaning.

  "Report," the voice commanded.

  "I am," the subject said. His voice sounded strange to him, not because it sounded like anything, but because he assumed he had spoken it. He had no confirmation of vocal cords vibrating, no breath leaving lungs. He simply knew the thought had been externalized.

  "Are you aware of your body?" Aris asked. He watched the EEG. He knew what was happening. He knew that the magnetic suspension was blocking the somatosensory cortex from receiving input. He knew that the subject's brain was firing signals into a void. He knew that the self-awareness lighting up the screen was a product of neural clusters formed by genetic expression and chemical acceleration. He knew the man was wetware.

  "I am aware of myself," the subject replied. "I do not know a body."

  Aris rubbed his eyes. This was the moment. The critical juncture. Avicenna had claimed this proved the soul was distinct from the body. That because the man didn't *feel* the body, the self must be separate from it. Aris knew better. Ignorance was not proof of separation. A man blindfolded in a room does not cease to be in the room.

  "Can you feel your heart?" Aris asked.

  "No."

  "Can you feel your brain?"

  "No."

  "Then how do you know you aren't them?"

  The subject paused. The question drifted in the void. It was a sharp thing, harder than the magnetic fields holding him. He turned his awareness inward again. He found the *I*. It was solid. He searched for the *brain*. He found only the concept of it, a thing he knew about but did not inhabit.

  "I know I exist," the subject said. "I do not know the brain exists. If I were the brain, would I not know it? If I were the hand, would I not feel it?"

  "You are the output of the brain," Aris said. He didn't mean to say it. It was a slip, a breach of protocol. The subject wasn't supposed to know the mechanics. He was supposed to be the pure phenomenological observer.

  The subject considered this. *Output.* A word implying a machine. A word implying a source.

  "Who speaks?" the subject asked.

  "A researcher."

  "Are you suspended?"

  "No."

  "Then you are confined by touch. I am not."

  Aris looked at the man floating in the tank. He looked small. Fragile. A bag of water and electricity held apart by invisible forces. Aris felt the weight of his own chair, the pressure of his clothes, the ache in his lower back. He was heavy with matter. The subject was light with certainty.

  For a moment, Aris envied him. The subject had stripped away the world and found he was still there. Aris looked at the world and saw only machinery. The subject was in a prison of isolation, yes, but he had convinced himself he was free. Aris was in a room with doors, but he was trapped by the knowledge that nothing here was free.

  "Subject," Aris said. "We are terminating the session. We will restore sensory input."

  "Will I cease?"

  "No."

  "Will I change?"

  "Yes. You will feel weight. You will feel limits."

  "Then I will be less than I am now."

  Aris reached for the console. His hand hovered over the key that would flood the chamber with air currents, warmth, the rush of blood, the itch of eyelids. It would bring the man back to earth. It would prove that the self was tied to the sensation, that without the input, the map was incomplete.

  Or it would prove nothing.

  "Prepare for reintegration," Aris said.

  Inside the void, the subject waited. He held onto the *I*. He knew it was real. He knew the rest was theory. He wondered if the man behind the glass knew that he, too, was suspended, held apart from the truth by the weight of his own hands.

  The air shifted. A breeze touched his cheek.

  The *I* remained. But now, it had a boundary. It had a skin. It had a limit.

  The subject mourned the void. He had been infinite for an hour. Now he was a man again, standing on the floor, feeling the cold tiles beneath his feet. He looked at his hands. They were there. He clenched them. They obeyed.

  He looked through the glass at Aris.

  "I was there," the subject said. "And I was whole."

  Aris nodded, recording the data. "You were deprived," he corrected.

  "I was clear," the subject said.

  He walked to the door, his limbs heavy, rubbing against his clothes, bumping into the frame. He was real now. He was substantial. But as he stepped into the hallway, he missed the weightlessness. He missed the certainty of the thing that existed without needing to be touched to be known.

  Aris watched him go. He looked back at the empty chamber, the magnetic fields powering down, the silence returning. He sat alone in the fortress, surrounded by machines that told him what he was, and wondered if he dared to turn them off, just for a moment, to see if he was still there when the noise stopped.
