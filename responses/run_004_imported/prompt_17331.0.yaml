answer: |-
  **The Illusion of Equality: Why the Moral Equality of Combatants Fails on Liability but Survives on Blame**

  The debate over the Moral Equality of Combatants (MEC) is the central fault line in contemporary just war theory. It asks a deceptively simple question: Do soldiers fighting for an unjust cause have the same moral standing as soldiers fighting for a just cause? The traditional view, championed by Michael Walzer, argues that they do. The revisionist view, led by Jeff McMahan and David Rodin, argues that they do not. Your confusion is well-founded; this is not merely a disagreement over tactics, but a clash between two different ways of thinking about morality itself: one based on social roles and conventions, the other based on individual rights and self-defense. To resolve this, we must cut through the jargon and examine the underlying structures of liability and blame. While the revisionists successfully dismantle the traditional view as a matter of fundamental moral rights, the traditionalists retain a crucial insight regarding culpability. Therefore, the correct verdict is that the Moral Equality of Combatants is false regarding *liability* (who may be killed), but true regarding *blameworthiness* (who is a murderer).

  To understand why the debate is so sticky, we must first articulate the strongest version of the Traditionalist position. Walzer's argument in *Just and Unjust Wars* rests on the separation of *jus ad bellum* (the justice of going to war) and *jus in bello* (the justice of conduct within war). For Walzer, war is a unique sphere of human activity with its own internal logic. Soldiers are not private individuals; they are agents of the state. When a soldier puts on a uniform, they enter a "war convention" where they surrender certain rights (like the right not to be attacked) in exchange for the license to use violence, provided they follow the rules of engagement.

  Walzer's defense of MEC relies heavily on the epistemic limitations of soldiers. Ordinary soldiers rarely have access to the intelligence, diplomatic cables, or historical context required to judge whether their nation's cause is truly just. If we deny MEC, we demand that every soldier become a moral philosopher and geopolitical analyst before firing a shot. Walzer argues this is unrealistic and dangerous. If soldiers on the "unjust" side believed they had no right to fight, they might refuse to fight, leading to a swift and potentially unjust victory for aggressors, or conversely, they might fight with the desperation of men who know they will be hanged as criminals if they lose. Thus, for Walzer, MEC is a functional necessity. It creates a symmetrical battlefield where the only thing that matters is how you fight, not why you fight. As long as an unjust soldier does not target civilians, they are the moral equal of a just soldier.

  The Revisionist critique, spearheaded by Jeff McMahan, attacks this foundation by rejecting the idea that war is a separate moral sphere. McMahan argues that the morality of war is continuous with the morality of everyday life. To illustrate this, he uses the analogy of self-defense. If a mugger attacks you on the street, you have a right to defend yourself. The mugger, because he is initiating an unjust threat, is *liable* to defensive harm. He has forfeited his right not to be hurt. Crucially, the mugger does not gain a right to kill you simply because you are defending yourself. If he kills you in the process, he is a murderer.

  McMahan applies this logic to war. Soldiers on the unjust side are essentially like the mugger; they are posing an unjust threat to the lives and rights of others. Soldiers on the just side are like the victim defending themselves. Therefore, there is a fundamental asymmetry. The just soldier kills because it is necessary to stop an unjust threat; the unjust soldier kills to *create* or *sustain* an unjust threat. For McMahan, *jus ad bellum* determines *jus in bello*. If your cause is unjust, you have no moral right to kill enemy combatants, even if they are wearing uniforms. Consequently, the Moral Equality of Combatants is a myth. Unjust combatants are liable to be killed; just combatants are not.

  This is where your confusion regarding technical terms becomes vital. The debate often stalls because the two sides are using words like "right," "wrong," and "guilty" to mean different things. To reach a verdict, we must distinguish between **Liability**, **Justification**, and **Excuse**.

  **Liability** refers to whether a person has forfeited their right not to be harmed. If I am liable to defensive force, it means I am responsible for an unjust threat, and you do not wrong me by harming me to stop it. **Justification** refers to whether an act is morally permissible all-things-considered. If I act in justified self-defense, I do the right thing. **Excuse** refers to whether an agent is blameworthy for doing something wrong. If I kill someone but I was coerced or reasonably mistaken about the facts, I may have done something objectively wrong (unjustified), but I am not a murderer (excused).

  The Revisionists are undeniably correct on the question of **Liability**. Walzer's claim that a soldier fighting for a genocidal regime has the same moral right to kill as a soldier stopping that genocide is intuitively and philosophically unsustainable. If morality is about respecting rights, then an agent enforcing a violation of rights cannot have the same standing as an agent defending them. To claim otherwise implies that the "uniform" magically grants a moral permission slip that overrides the basic rights of the people being attacked. McMahan's insight here is fatal to the traditional view: you cannot have a moral right to enforce an unjust cause. Therefore, strictly speaking, unjust combatants are liable to defensive attack in a way that just combatants are not. The Moral Equality of Combatants, defined as an equality of *liability*, collapses.

  However, if we stop there, we accept a conclusion that feels deeply wrong: that most soldiers in history are morally equivalent to murderers. This is where the Traditionalist intuition survives, not by denying McMahan's logic, but by utilizing the concept of **Excuse**.

  While unjust combatants may be *liable* to be killed (they have forfeited their right not to be harmed), it does not automatically follow that they are *culpable* for the harm they cause. Most soldiers are not ideological zealots; they are conscripts, patriots acting on misinformation, or individuals coerced by the threat of imprisonment or execution if they refuse to serve. In moral philosophy, we recognize that one can be liable to defensive harm without being blameworthy. Consider a person who unknowingly carries a bomb into a crowded room. They pose an unjust threat and are liable to be stopped (even lethally, if necessary), but they are not a terrorist. They are excused by ignorance.

  Similarly, most unjust combatants are excused by epistemic limitations. They reasonably believe their cause is just because their government tells them it is. They lack the capacity to verify the *jus ad bellum*. Therefore, while they are objectively fighting on the wrong side (making them liable), they are not subjectively evil (making them non-blameworthy). This distinction allows us to accept McMahan's metaphysical claim (there is no moral equality of rights) while preserving Walzer's humanitarian claim (we should not treat enemy soldiers as criminals).

  This leads to a specific verdict: **The Moral Equality of Combatants is false as a principle of deep morality, but true as a principle of normative regulation.**

  We must reject MEC as a description of reality because it obscures the fundamental injustice of aggressive war. We must acknowledge that soldiers fighting for an unjust cause are participating in a collective wrong that makes them liable to defensive force. To deny this is to strip the victims of aggression of their full right to self-defense. However, we must simultaneously uphold a *conventional* equality of combatants in the laws of war and our social attitudes. Because soldiers are generally excused by ignorance and coercion, we should treat them as moral equals for the purposes of prisoner treatment, war crimes tribunals, and post-war reconciliation.

  This "Dual-Track" view resolves the tension. It admits that McMahan is right about the *logic* of killing: if the war is unjust, the killing is objectively wrongful, and the killer is liable. But it admits Walzer is right about the *practice* of war: because we cannot expect individual soldiers to adjudicate the justice of their nation's foreign policy, we should not burden them with the guilt of the war itself.

  Therefore, the debate is resolved not by choosing one side, but by assigning them to different domains. Revisionism wins the domain of **ethics** (who is liable and why); Traditionalism wins the domain of **law and policy** (how we treat soldiers). If you ask, "Does an unjust soldier have a moral right to kill?" the answer is no. If you ask, "Is an unjust soldier a murderer?" the answer is usually no.

  In conclusion, the Moral Equality of Combatants cannot survive as a fundamental moral truth. The revisionist critique successfully demonstrates that liability tracks justice, not uniforms. An unjust combatant is morally vulnerable in a way a just combatant is not. However, this does not vindicate a ruthless approach to warfare. By distinguishing liability from blameworthiness, we can acknowledge the asymmetry of the conflict without demonizing the individuals caught within it. The equality of combatants is a necessary fiction for the law, but a philosophical error for the moralist. We should fight with the knowledge that our cause matters, but treat our enemies with the humility to recognize that they, like us, are often just tools of powers beyond their control.
