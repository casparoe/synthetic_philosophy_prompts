prompt: |-
  Okay so I need a tie-breaker because my study partner Priya and I have been going back and forth on this for like two hours and neither of us budged. We're both in a formal epistemology seminar this term, and last week's reading was Lewis on the Principal Principle -- you know, the thing where your credence in some proposition, given that you know the objective chance of it is x, is supposed to just equal x, with that whole "admissible evidence" clause doing a lot of quiet work in the background. Priya's take is that this is basically just a special case of van Fraassen's Reflection Principle (defer to your own future credence the same way you'd defer to chance) with "objective chance" swapped in for "future you," and that Lewis dressed up something pretty mundane in fancy metaphysics of chance to make it sound deeper. I think that's wrong, or at least too quick, but when I tried to explain why the admissibility restriction actually earns its keep in the Principal Principle, and why Reflection runs into trouble in cases where you know you're gonna be less rational later (drugged, brainwashed, whatever) in a way that deferring to chance doesn't, I kind of talked myself in circles and Priya wasn't having it.

  Can you actually settle this for us? Compare the Principal Principle and the Reflection Principle as "defer to an expert function" style norms -- where do they genuinely overlap, and in what specific ways is the Principal Principle a distinct (maybe more defensible?) principle rather than just Reflection wearing a fancier costume for the expert. I'd love it if you dug into what admissibility is actually doing for Lewis, whether Reflection needs (or already has, in van Fraassen or later work) some analogous restriction, and whether you think one principle can be derived from the other or if they're just structurally similar but independent norms. Bonus points if you can come up with a case where the two would actually issue conflicting verdicts, since that's the part Priya and I couldn't figure out on our own.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Formal epistemology seminar, discussing David Lewis's Principal Principle (PP) vs. Bas van Fraassen's Reflection Principle (RP).
      *   **The Dispute:** Priya argues PP is just a special case of RP (defer to chance = defer to future self). The user thinks PP is distinct, specifically regarding the "admissibility" clause and cases of irrationality.
      *   **The Task:** Settle the tie-breaker. Compare PP and RP as "expert function" norms. Explain the overlap and distinctions. Analyze the role of admissibility in both. Determine if one derives from the other or if they are independent. Provide a conflicting case (where they give different advice).
      *   **Tone:** Academic but accessible (study partners, seminar context), rigorous, philosophical.

  2.  **Deconstruct the Principles:**
      *   **Principal Principle (Lewis):** $C(A | \langle Ch(A) = x \rangle \& E) = x$, provided $E$ is admissible.
          *   Core idea: Defer to objective chance.
          *   Key constraint: Admissibility (evidence shouldn't give "crystal ball" info about the outcome *beyond* what the chance gives).
      *   **Reflection Principle (van Fraassen):** $C_t(A | C_{t'}(A) = x) = x$.
          *   Core idea: Defer to your future credence.
          *   Key constraint: Usually assumes no forgetting, no irrationality, no new *inadmissible* info (though van Fraassen's original formulation was quite strong).

  3.  **Evaluate Priya's Claim (PP $\approx$ RP):**
      *   *Similarity:* Both are expert principles. Chance is an expert on truth; Future Self is an expert on truth (usually).
      *   *Difference:* Why do we defer?
          *   Chance: Because it tracks physical propensity/frequency (metaphysical link).
          *   Future Self: Because we expect to update on evidence (epistemic link).
      *   *Admissibility:* Lewis explicitly builds it in. Van Fraassen's original RP didn't have an explicit "admissibility" clause, which led to counterexamples (Christensen, Talbott). Later versions (New Reflection) add conditions.
      *   *Irrationality:* RP fails if you know you'll be irrational (drunk, biased). PP *doesn't* care if "Chance" is irrational (chance isn't an agent); it cares if *your evidence* is inadmissible.

  4.  **Analyze Admissibility:**
      *   **Lewis:** $E$ is admissible relative to $Ch(A)=x$ if $E$ doesn't give info about $A$ other than via chance. Future facts are typically inadmissible.
      *   **Van Fraassen:** Original RP implies you *must* defer even if you know you'll be irrational. This is the "Problem of Imperfect Rationality."
      *   **Connection:** Admissibility in PP blocks "crystal ball" info. In RP, the analogue is knowing your future update rule is flawed.

  5.  **Derivation/Independence:**
      *   Can PP derive RP? If Chance = Future Credence? No, chance is external, future credence is internal.
      *   Can RP derive PP? If Future Credence = Chance? Only if you are certain your future credence will match chance.
      *   *Lewis's View:* Lewis actually discussed this. He thought PP was more fundamental regarding chance. RP is about *learning*. PP is about *metaphysics meeting epistemology*.
      *   *Hall's "Two Concepts of Chance":* Distinguishes statistical vs. evidential.
      *   *Consensus:* They are structurally analogous (expert principles) but distinct in application and justification. PP is not *just* RP with "chance" swapped in.

  6.  **Develop a Conflict Case (The "Tie-Breaker"):**
      *   Need a scenario where PP says $C(A) = x$ but RP says $C(A) \neq x$ (or vice versa).
      *   *Scenario:* You know the objective chance is 0.5 (fair coin). You *also* know that tomorrow you will be brainwashed to believe the coin landed Heads with credence 0.9.
      *   *PP Verdict:* $C(Heads | Ch(Heads)=0.5) = 0.5$. (Assuming no inadmissible evidence about the outcome).
      *   *RP Verdict:* $C_t(Heads | C_{t'}(Heads) = 0.9) = 0.9$. (If you follow strict RP).
      *   *Resolution:* Most epistemologists reject strict RP here (Christensen's counterexample). You shouldn't defer to your irrational future self. But you *should* defer to chance. So PP holds, RP fails.
      *   *Refinement:* What if the future self is *better* informed? RP holds. What if chance is known but future self ignores it?
      *   *Better Conflict:* "The Self-Fulfilling Prophecy" or "The Unreliable Oracle."
      *   *Let's try this:* You know the chance of Rain is 0.3. You also know that tomorrow, due to a cognitive enhancer, you will have seen all the current barometric data and will have credence 0.8.
          *   PP says: 0.3 (based on chance).
          *   RP says: 0.8 (based on future informed self).
          *   *Wait:* If the future self has more evidence, the current self should update on *that* evidence now if possible. But if the evidence is *future* evidence, PP says chance trumps *unless* the evidence is inadmissible.
          *   *Lewis's Admissibility:* Future evidence is inadmissible for PP. So PP says stick to 0.3. RP says defer to 0.8.
          *   *Who wins?* Intuitively, if you *know* your future self has better data, you should update now (if you can describe the data). If you can't, RP suggests deferring. PP suggests sticking to chance.
          *   *Actually, the strongest conflict is the Irrationality Case.*
          *   Case: Fair Coin ($Ch=0.5$). You will take a pill that makes you believe Heads is 0.9.
          *   PP: Credence should be 0.5.
          *   RP (Strict): Credence should be 0.9.
          *   This shows they are not identical.

  7.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the depth of the debate. Validate both sides (structural similarity is real, but reduction is false).
      *   **Section 1: The Expert Function Framework.** Define both as $C(A | Expert(A)=x) = x$.
      *   **Section 2: The Admissibility Clause (The Crux).** Explain Lewis's admissibility (no crystal balls). Explain RP's lack thereof (originally) and the "Problem of Imperfect Rationality."
      *   **Section 3: Distinct Justifications.** PP is metaphysical (chance makes truth). RP is epistemic (updating on evidence).
      *   **Section 4: The Conflict Case.** Use the "Irrational Future Self vs. Known Chance" case.
      *   **Section 5: Derivation?** Lewis tried to link them but they stand apart. PP constrains RP (you shouldn't reflect to a self that violates PP).
      *   **Conclusion:** Priya is half-right (structure) but wrong (reduction). User is right (distinctness/admissibility).

  8.  **Refining the Philosophy (Self-Correction/Nuance Check):**
      *   *Check:* Did Lewis think PP derives RP? Lewis (1980) suggests RP is a consequence of PP *if* you treat future credence as a chance-like entity, but he acknowledges the admissibility difference.
      *   *Check:* Is RP defensible without restrictions? No, Christensen (1991) "Rational Reflection" is the standard fix. Need to mention "New Reflection."
      *   *Check:* Admissibility in PP. It's about evidence that bears on the outcome *otherwise than through chance*. Future truth is the classic inadmissible info.
      *   *Check:* The Conflict. If I know my future self is irrational, RP (strict) fails. PP holds. If I know my future self has more evidence, RP holds, PP might need to yield if that evidence is admissible (but future evidence is usually inadmissible for PP).
      *   *Decision:* The Irrationality case is the cleanest tie-breaker. It shows Chance $\neq$ Future Self.

  9.  **Final Polish:** Ensure the tone is collaborative ("You and Priya are both touching on...") but decisive on the technical points. Use standard notation ($C$, $Ch$, $E$). Cite key names (Lewis, van Fraassen, Christensen, Hall).

  10. (Final Review against prompt):
      *   Compare as expert norms? Yes.
      *   Overlap vs. Distinct? Yes.
      *   Admissibility role? Yes.
      *   Derivation? Yes.
      *   Conflict case? Yes.

