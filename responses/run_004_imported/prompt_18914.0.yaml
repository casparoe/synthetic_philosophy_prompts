answer: |-
  This is a classic debate in formal epistemology, and honestly, the fact that you two have been stuck on it for two hours means you're both latching onto something real. Priya is right that there is a deep *structural* isomorphism between the two principles. You are right that the *metaphysical and epistemic underpinnings* are distinct, and that the "admissibility" clause is the wedge that drives them apart.

  Here is the tie-breaker: **Priya is correct about the form, but you are correct about the substance.** The Principal Principle (PP) is not merely the Reflection Principle (RP) with "chance" swapped for "future self." They are distinct norms that can, in specific cases, issue conflicting verdicts.

  Here is the breakdown you need to settle the seminar discussion.

  ### 1. The Expert Function Framework
  You are both viewing these as "expert principles," which is the right lens. We can formalize both as follows:
  $$C(A \mid \text{Expert}(A) = x) = x$$

  *   **For Lewis (PP):** The Expert is **Objective Chance** ($Ch$).
  *   **For van Fraassen (RP):** The Expert is **Your Future Self** ($C_{t'}$).

  Priya's intuition is that "deferring to chance" and "deferring to your future rational self" feel the same because in a perfect world, your future rational self *tracks* the chance (by gathering evidence). If you are certain you will update rationally on all relevant evidence, your future credence becomes a perfect proxy for the truth, just like chance.

  However, the justification for *why* they are experts differs fundamentally:
  *   **PP (Metaphysical):** Chance is an expert because it is a truth-maker (or closely linked to it). If the chance of $A$ is $x$, the world is set up such that $A$ is true in proportion $x$.
  *   **RP (Epistemic):** Your future self is an expert because they are *better informed*. They have the evidence you currently lack.

  ### 2. The Admissibility Clause: The Wedge
  This is where your argument wins out. The "admissibility" clause in Lewis's PP isn't just decorative; it's doing heavy lifting that van Fraassen's original RP lacked.

  **Lewis's Admissibility:**
  Lewis defines evidence $E$ as admissible relative to $Ch(A)=x$ if $E$ bears on the truth of $A$ *only* via its bearing on the chance of $A$.
  *   *Inadmissible:* "A crystal ball tells me $A$ will happen." (This bypasses chance).
  *   *Inadmissible:* "Future facts." (If I know $A$ happens in the future, I know $Ch(A)$ was 1, regardless of what the current chance is).
  *   **Function:** Admissibility protects the principle from "crystal ball" information. It ensures you defer to chance *only when chance is the best guide you have.*

  **Reflection's "Admissibility" Problem:**
  Van Fraassen's original formulation ($C_t(A \mid C_{t'}(A)=x) = x$) had **no** admissibility clause. This led to the famous **Christensen (1991) counterexamples**.
  *   *Case:* You know you will be drugged tomorrow and become irrationally confident in a falsehood.
  *   *Strict RP:* You must defer to your drugged future self now.
  *   *Intuition:* That's absurd. You know your future self is compromised.

  Later iterations (like the "New Reflection Principle") added a condition: you only defer if you believe your future self is updating rationally. But notice the difference:
  *   **PP** restricts *evidence* (is it admissible?).
  *   **RP** restricts *the expert* (is the future self rational?).

  This confirms your hunch: PP handles the "bad evidence" case via admissibility. RP handles the "bad expert" case via rationality constraints. They are solving different problems.

  ### 3. Can One Be Derived from the Other?
  Lewis actually hoped PP might ground RP. The idea was: If you treat your future credence as a random variable, maybe chance governs it?

  **The Consensus View:** No, neither strictly derives from the other.
  *   **PP does not imply RP:** You can accept that you must defer to objective chance while acknowledging you might not defer to your future self (e.g., if you expect to forget evidence or become biased).
  *   **RP does not imply PP:** You can accept that you should defer to your better-informed future self without believing in objective chances (a Humean or Bayesian subjectivist could accept RP but reject PP).

  However, there is a **constraint relation**: If you accept PP, you *ought* to restrict RP. You should not reflect to a future self that you know will violate PP. If you know your future self will ignore known chances, RP demands you defer to that ignorance, but PP demands you respect the chance.

  ### 4. The Conflict Case (The Tie-Breaker)
  You asked for a case where they issue conflicting verdicts. This is the "Irrational Future vs. Known Chance" scenario.

  **The Setup:**
  1.  **Proposition $H$:** A fair coin lands Heads.
  2.  **Known Chance:** You know for a fact that $Ch(H) = 0.5$.
  3.  **Future Self:** You know that in one hour ($t'$), you will be administered a drug that causes "Head-Bias." You will not see the coin toss, but the drug will causally force your credence to $C_{t'}(H) = 0.9$.
  4.  **Evidence:** You have no inadmissible evidence about the outcome (no crystal ball).

  **The Verdicts:**
  *   **Principal Principle:**
      $$C_t(H \mid Ch(H)=0.5 \ \& \ \text{Admissible } E) = 0.5$$
      The drug affecting your *mind* is not inadmissible evidence about the *coin*. The chance is still 0.5. PP commands your current credence to be **0.5**.

  *   **Reflection Principle (Strict/van Fraassen 1984):**
      $$C_t(H \mid C_{t'}(H) = 0.9) = 0.9$$
      Strict Reflection says you must defer to your future credence function regardless of *why* it changed. It commands your current credence to be **0.9**.

  *   **Reflection Principle (Restricted/Christensen):**
      $$C_t(H \mid C_{t'}(H) = 0.9 \ \& \ \text{Rational } t') = \text{Undefined}$$
      Since you know $t'$ is irrational, the condition fails. You don't defer. You stick with your current evidence (which points to 0.5).

  **The Resolution:**
  In this case, **PP is defensible, and Strict RP is not.** Almost no contemporary epistemologist thinks you should set your credence to 0.9 just because you know you'll be brainwashed later.
  *   This proves PP $\neq$ RP.
  *   It proves Priya is wrong that PP is *just* RP with "chance" swapped in. If it were, PP would collapse when the "expert" (chance) is disconnected from the "outcome" in weird ways, or RP would hold when the expert (future self) is broken.
  *   It proves you are right that admissibility/rationality restrictions are not analogous "quiet work"—they are structurally different safeguards.

  ### 5. Summary for the Seminar
  Here is how you can frame the settlement to Priya:

  1.  **Acknowledge the Isomorphism:** "Priya, you're right that Lewis and van Fraassen are both building 'expert' norms. Mathematically, they look like siblings."
  2.  **Pin the Difference:** "But the *source* of the expertise is different. Chance is an expert because of metaphysics (propensities/frequencies). Future Self is an expert because of epistemology (evidence accumulation)."
  3.  **The Admissibility Kill-Shot:** "Lewis built admissibility into PP to block 'crystal ball' info. Van Fraassen *didn't* build it into RP, which is why RP fails in cases of known irrationality (Christensen cases). If PP were just RP, PP should fail when we know the 'chance mechanism' is disconnected from the truth, but it doesn't—it holds firm as long as evidence is admissible."
  4.  **The Conflict:** "In the 'Brainwash vs. Fair Coin' case, PP says 0.5 and Strict RP says 0.9. Since 0.5 is the rational answer, PP survives where RP fails. Therefore, PP is a distinct, more robust norm regarding external facts, while RP is a heuristic for internal updating."

  **Final Verdict:** You win the point on distinctness, but give Priya credit for spotting the structural analogy. The Principal Principle is not Reflection in disguise; it is a constraint on how subjective credence hooks onto objective reality, whereas Reflection is a constraint on how credence hooks onto *itself* over time.
