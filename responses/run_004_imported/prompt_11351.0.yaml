      *   *The Festival Point:* The goal is *transparency* and *unity*. No stage, no tickets, no separation. The spectators *are* the spectacle. It fosters *amour de soi* (healthy self-love/community bond) rather than *amour-propre* (comparative, vanity-driven self-love).
      *   *The Economic Point:* Professionalization corrupts. When art becomes a trade, the artist serves the audience's tastes, not truth or virtue.

  3.  **Evaluate Livestreaming against these Criteria:**

