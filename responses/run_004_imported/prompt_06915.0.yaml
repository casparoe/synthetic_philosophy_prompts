      *   **Setup:** Let $N$ be the total number of humans who will ever live. Let $n$ be my birth rank.
      *   **Premise:** I should regard myself as a random sample from the set of all humans.
      *   **Inference:** If $N$ is very large, it is unlikely that $n$ is very small (e.g., in the first 5%). Since $n$ is relatively small (~100 billion), $N$ is likely not much larger than $n$.
