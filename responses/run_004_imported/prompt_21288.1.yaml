answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Rain streaks the window. Two grad students, ELENA (a formal epistemologist) and DAVID (a philosopher of biology/social science), are finishing off a pot of coffee. The remains of a napkin covered in game matrices sits between them.*

  **Elena:** So, the escalator. You think the reason I stand on the right is just that my ancestors who stood on the left got elbowed more often?

  **David:** *(Laughing)* Not your literal ancestors. But yes. Behaviors that result in smooth flow get reinforced. Behaviors that cause collisions get punished. Over time, the population converges on the right-side equilibrium. You don't need to calculate anything. You just need to be a creature that learns from success.

  **Elena:** But that misses the *convention* part, David. That describes a habit. Or a traffic pattern. Lewis's point in *Convention* is that a convention is a specific kind of rational solution to a coordination problem. It requires a specific mental state. I stand on the right because I expect you to stand on the right, and I know you expect me to stand on the right.

  **David:** And where does that expectation come from?

  **Elena:** From common knowledge. We both see the regularity. We both know we're rational. We both know we prefer coordinating to not coordinating. That structure creates a reason to act.

  **David:** See, that's where I lose you. "Common knowledge." In the strict Lewisian sense, that's an infinite regress. I know that you know that I know that you know... It's psychologically unrealistic. No human brain holds that stack. If your theory of convention requires agents to perform infinite recursive logic just to ride an escalator, your theory is too expensive.

  **Elena:** It's not a conscious calculation. It's a logical condition for *rational justification*. Lewis isn't doing psychology; he's doing rational reconstruction. He's asking: "Under what conditions is this action rational?" If I just mimic you because of blind conditioning, I'm not acting on a reason. I'm acting on a cause.

  **David:** But Skyrms's whole move in *Evolution of the Social Contract* is to show you don't *need* the reason in the head to get the rational outcome. The dynamics do the work. The "reason" is externalized in the stability of the equilibrium. If the population is at a correlated equilibrium, my best response is to follow the signal. I don't need to know *why* the signal means "stop." I just need to know that following it pays off.

  **Elena:** That works for bacteria. It works for ants. But humans? When I step onto the escalator, I feel a normative pull. I don't just think, "Statistically, David will be on the right." I think, "I *ought* to be on the right, and David *expects* me to be on the right." If I stand on the left, I'm not just inefficient; I'm violating an agreement.

  **David:** "Violating an agreement." There's the rub. You're smuggling in a contract where there isn't one. The "ought" you feel is just the shadow of the payoff penalty. You feel you *should* stand right because you anticipate the glare of the person behind you. That's not normativity; that's prudential fear.

  **Elena:** No, it's distinct. Prudential fear is about consequences. Normative expectation is about *reliance*. If you stand on the left, I'm not just annoyed by the delay; I'm frustrated because you failed to hold up your end of a mutual understanding. Lewis captures that mutual understanding with the common knowledge clause. Without it, you have regularity, but you don't have *convention*. You have a mere coincidence of behavior.

  **David:** Okay, let's grant you the common knowledge. How do we get it? Lewis leans heavily on "salience." Some solution stands out. Precedent makes it salient. We did it yesterday, so we do it today. But Elena, "precedent" is just a polite word for "history." And "history" is just the track record of what worked. That's path dependence. That's evolutionary dynamics.

  **Elena:** It's not the same. Path dependence explains how we *arrived* here. Common knowledge explains why we *stay* here. Lewis is offering a constitutive account of what a convention *is* right now. Skyrms is offering an etiological account of how conventions *emerge*.

  **David:** But if the history does all the work of generating the expectation, what work is left for the common knowledge to do? If I know the history of escalator usage in London, I know you'll stand right. I don't need to know that you know that I know the history. I just need to know the history. The common knowledge machinery is decorative. It's a epicycle.

  **Elena:** It's not decorative! It solves the regress objection. If I just rely on precedent, why does precedent bind us? Why does doing something once make it rational to do again? Lewis says: because the first time creates a shared signal. It creates a "basis for common knowledge." It aligns our expectations. Without that alignment, precedent is just data. With it, precedent becomes a reason.

  **David:** *(Leans forward)* But isn't that alignment itself the result of dynamics? We evolved to treat precedent as a signal. Our brains are wired to look for focal points. Schelling points aren't magic; they're cognitive adaptations. So even the "salience" Lewis relies on is an evolutionary product.

  **Elena:** Even if the *capacity* for salience is evolved, the *operation* of the convention is rational. Look, imagine we meet in a dark room. We need to exit through the same door. We've never met. We both see one door is slightly brighter. We both go for the bright door. Why?

  **David:** Because brightness is a salient cue selected by evolution to correlate attention.

  **Elena:** Or, because we both see the brightness, and we both know the other sees it. The brightness generates the common knowledge. If you remove the common knowledge, you remove the *assurance*. I go for the bright door because I'm confident you will too. That confidence is the convention.

  **David:** I'm worried about the normativity again, Elena. You keep saying "assurance" and "reason." But if the evolutionary story is true, the normativity is an illusion. It's a user-illusion generated by the brain to make us stick to the equilibrium. We *feel* like there's an obligation because that feeling helps stabilize the coordination.

  **Elena:** That's a debunking argument. You're saying my experience of obligation is a trick.

  **David:** I'm saying it's a mechanism. Just like pain is a mechanism to avoid damage. Pain feels like "badness," but it's just neural firing. Convention feels like "obligation," but it's just stability.

  **Elena:** But if it's just stability, then a convention could be anything. If we all settled on stabbing anyone who enters the room as our coordination equilibrium, and it was stable...

  **David:** ...then it would be a convention.

  **Elena:** That's repugnant. Lewis's account allows us to say something went wrong there. A convention requires a *coordination problem* where everyone has a common interest in coordinating. Stabbing isn't a coordination equilibrium in the right sense; it's a prison.

  **David:** In game theoretic terms, if everyone prefers "all stab" to "mixed stab/no-stab," it is a coordination equilibrium. It's a terrible one, but it's an equilibrium. The evolutionary view is morally neutral. It explains how we get norms, good or bad. Lewis wants to build morality into the definition of convention.

  **Elena:** He doesn't build morality in. He builds *rationality* in. And rationality requires that we aren't just maximizing individual payoff in a vacuum, but responding to mutual expectations.

  **David:** Okay, let's step back. We've been fighting for twenty minutes. Are we actually disagreeing? Or are you defining "Convention" as the internal rational state, and I'm defining "Convention" as the external behavioral pattern?

  **Elena:** *(Pauses, stirs her coffee)* I think... I think you're right that we might be talking past each other. But it matters which one we pick. If I want to understand how to change a convention—say, the escalator rule—I need your story. I need to know how to shift the equilibrium. Telling people "it's rational to switch" won't work if the dynamics are locked in.

  **David:** And if I want to understand why people get *angry* when you stand on the left, I need your story. Dynamics explains the behavior, but it doesn't explain the resentment. The resentment comes from the violated expectation. The "common knowledge" that was broken.

  **Elena:** So, maybe Lewis explains the *synchronic* structure—what holds the convention in place for the agent at time *t*. And Skyrms explains the *diachronic* process—how the convention got to time *t*.

  **David:** I can live with that. Except for one thing. The synchronic structure depends on the diachronic process. My expectations at time *t* are formed by the history. If the history is opaque, the common knowledge is weak.

  **Elena:** And the diachronic process depends on the synchronic structure. The dynamics only work because agents are responding to expectations. If agents weren't the kind of creatures that form mutual expectations, the dynamics wouldn't converge on *conventions*; they'd just converge on reflexes.

  **David:** *(Smiles)* So we're not rivals. We're describing a loop. The history creates the expectations. The expectations stabilize the behavior. The stabilized behavior becomes new history.

  **Elena:** But the "Common Knowledge" requirement... do you still think it's decorative?

  **David:** I think it's a high-fidelity description of what it *feels* like to be in a stable equilibrium. Is it literally an infinite stack of propositions in your head? No. Is it a useful model for predicting when a convention will collapse? Yes. If common knowledge breaks down—if I start thinking you *don't* know the rule—the convention dissolves. So it has explanatory power.

  **Elena:** And do you concede that blind dynamics can't capture the normative force?

  **David:** I concede that dynamics explains the *pressure*, but your rationalism explains the *experience* of the pressure as obligation. I can explain why you get elbowed. You explain why you feel you deserved it.

  **Elena:** *(Laughs)* I'm not sure I deserved it. But I accept the distinction. So, the escalator?

  **David:** The escalator is a stable equilibrium maintained by evolutionary pressure on pedestrians.

  **Elena:** The escalator is a convention sustained by common knowledge of precedent.

  **David:** ...We're going to be here all night.

  **Elena:** *(Gathering her bag)* Tell you what. Next time we ride one, I'll stand on the right.

  **David:** Because it's rational?

  **Elena:** Because I expect you to.

  **David:** And I'll stand on the right.

  **Elena:** Because of replicator dynamics?

  **David:** Because I don't want to get elbowed.

  **Elena:** See? Common knowledge.

  **David:** *(Grinning)* See? Payoff matrix.

  *They stand up. As they walk toward the exit, they both instinctively move to the right side of the door, pause, look at each other, and laugh.*
