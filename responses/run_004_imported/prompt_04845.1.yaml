          *   Condition 2 (Conception of Good): Rawls assumes parties care primarily about primary goods and a minimum threshold. Harsanyi assumes they want to maximize overall satisfaction.
          *   Condition 3 (Stakes): Rawls emphasizes the "once-and-for-all" nature. Harsanyi says we make risky choices all the time.
      *   *Verdict:* Rawls doesn't *prove* maximin is the only rational choice; he argues it is the most *prudent* choice given the specific moral constraints of the Original Position. However, Harsanyi is right that maximin leads to counter-intuitive results in other contexts (the "zero-one rule" problem). The dispute *is* fundamentally about decision theory, but that decision theory is laden with moral assumptions.
      *   *Refinement:* The most accurate assessment is that Rawls successfully shows that EUT is not *compulsory* in this specific moral context, but he fails to prove Maximin is *compulsory*. Therefore, the disagreement relocates to the plausibility of the three conditions. It's a stalemate unless you accept Rawls's specific description of the "rational" parties (who are risk-averse regarding primary goods).

