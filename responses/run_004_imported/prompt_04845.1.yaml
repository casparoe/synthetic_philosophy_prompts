          *   *Setup:* Impartial Observer. You imagine being anyone in society with equal probability.
          *   *Decision Rule:* Bayesian Rationality / Expected Utility Maximization.
          *   *Probability:* Principle of Insufficient Reason (Laplace). If you don't know who you are, assume $1/N$ chance for each person.
          *   *Outcome:* Maximize the average utility. (Average Utilitarianism).
          *   *Critique of Rawls:* Maximin is irrational risk aversion. It implies lexicographical ordering where any gain to the worst-off trumps any gain to everyone else, regardless of magnitude.

      *   **Rawls (1971):**
          *   *Setup:* Original Position + Veil of Ignorance.
          *   *Decision Rule:* Maximin (Maximize the Minimum).
          *   *Justification for Maximin:* Three conditions (A Theory of Justice, §26):
              1.  Ignorance of probabilities (no objective basis for $1/N$).
              2.  Conception of the Good: Care only about the minimum guarantee (threshold conception).
              3.  Stakes: The choice is fundamental, irreversible, and involves basic liberties/opportunities (strains of commitment).
          *   *Outcome:* Difference Principle (inequalities allowed only if they benefit the least advantaged).
          *   *Critique of Harsanyi:* Assigning equal probabilities is arbitrary. Gambling with basic rights is irrational.

  3.  **Drafting the Comparison (The "Sidebar" Content):**
