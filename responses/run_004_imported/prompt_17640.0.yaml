answer: |-
  **Setting:** *A sculptor's studio, late afternoon. Dust motes dance in shafts of light cutting through high windows. In the center of the room, on a turntable, sits a freshly finished clay statue—a torsion of human form, still wet. **ELENA** (Constitution Theorist) stands with her arms crossed, protecting the work. **MARCUS** (Four-Dimensionalist) leans against a workbench, wiping clay from his fingers.*

  **MARCUS:** It's remarkable, really. Look at it. One continuous volume of space occupied by one continuous quantity of matter.

  **ELENA:** Two quantities, Marcus. You're looking at two objects.

  **MARCUS:** *(Smiles)* There we go. The constitution view. You see a statue *and* a lump of clay. I see a single spacetime worm that is currently statue-shaped.

  **ELENA:** A worm? It's a human figure. And your "worm" theory can't account for the fact that the lump existed before the statue. The clay was in a box yesterday. The statue was not. By Leibniz's Law, if they have different properties, they cannot be identical.

  **MARCUS:** I don't deny they have different properties. I deny that the "lump" and the "statue" are the *subjects* of those properties in the way you think. The clay-lump is a longer temporal aggregate. The statue is a shorter temporal aggregate—a proper part of the lump. They overlap. Just as the M25 overlaps the A1 for a stretch of road without being the same road.

  **ELENA:** Roads are abstract routes. This is concrete matter. If I take a wire and slice through the clay right now, I destroy the statue. But I do not destroy the clay. The clay survives the squashing; the statue does not. Therefore, they have different persistence conditions. If they have different persistence conditions, they are numerically distinct. You can't just say "oh, it's just a temporal part." That implies the statue is merely a *slice* of the clay. But the statue is fully present now.

  **MARCUS:** Is it? Or is that just how our language carves up the world? You're committed to coincident objects. Two things in the same place at the same time. That's ontologically profligate. It violates the principle of parsimony. Why posit two entities when the geometry of spacetime requires only one?

  **ELENA:** Parsimony is not truth. If the data of our experience demands two, we pay the price. But let's get to the real trouble for your view. The Grounding Problem.

  **MARCUS:** *(Straightens up)* Go on.

  **ELENA:** Right now, at this exact instant *t*, the statue and the lump share every single microphysical particle. They have the same mass, the same shape, the same temperature, the same atomic structure. If they are distinct objects, as I say, what *grounds* that distinction? What fact about the physical world makes it true that *this* object (the statue) will cease to exist if squashed, while *that* object (the lump) will not?

  **MARCUS:** That is a problem for you, Elena, not me.

  **ELENA:** Don't turn it around. On my view, they are distinct. So I need a truth-maker for their difference. But on your view, they are just overlapping worms. But even then—at this cross-section, this "now"—the properties are identical. If the future persistence conditions differ, there must be a present categorical difference that grounds that future divergence. But there isn't one. They are physically indiscernible. So, either they are identical, or their differing modal properties are brute facts. And brute modal facts are magic.

  **MARCUS:** I accept the challenge. But you're assuming that persistence conditions must be grounded in *intrinsic* physical properties at *t*. I deny that. The difference is grounded in their temporal extension. The "statue-worm" has temporal boundaries that the "clay-worm" does not. The fact that one ends when the clay is squashed and the other continues is not a mystery about the present moment; it's a fact about the four-dimensional shape of the object. The ground is the spacetime region they occupy. They occupy different regions.

  **ELENA:** That begs the question. You're saying they are different because they have different temporal parts. But why do *those* temporal parts compose an object in one case and not the other? Why does the sum of stages from *t1* to *t2* constitute a statue, while the sum from *t0* to *t3* constitutes a lump? If the matter is identical at every stage of overlap, the principle of composition that binds the statue-stages together must be different from the one binding the lump-stages. What is that principle? If it's not physical, it's metaphysical magic. If it is physical, you haven't found it.

  **MARCUS:** It's not magic; it's sortals. But I handle them better than you. You say the sortal "statue" confers essential properties. I say the sortal is just a linguistic convention we use to select which temporal parts we care about. The world doesn't care if it's a statue. It just cares about matter in motion.

  **ELENA:** The world might not care, but *modality* does. And that brings me to your second weakness. Consider this: This statue could have been made from a slightly different lump of clay. Maybe the sculptor reached for the bag on the left instead of the right.

  **MARCUS:** Standard modal intuition.

  **ELENA:** Right. So, the statue has the property *possibly being made of different clay*. The lump of clay actually here—the specific matter—does not have that property. This specific matter is essentially this matter. So, again, they differ in properties. But on your view, to handle this, you have to bring in Counterpart Theory. You have to say the statue doesn't literally exist in other possible worlds. Only a "counterpart" does.

  **MARCUS:** Precisely. And it's elegant. It solves the problem of accidental intrinsics. If the statue were made of different clay, it would have different parts. If the object itself traveled to another world, it would have contradictory properties (being made of Clay A and Clay B). Counterpart theory avoids the contradiction. The statue is world-bound. Its counterparts in other worlds are similar but distinct.

  **ELENA:** It avoids contradiction by sacrificing *de re* modality. It's not *this* statue that could have been made of different clay, on your view. It's a *different* object that is similar to this one. That severs the link between the object and its possibilities. When I say "This statue could have been taller," I mean *this very object*. I don't mean "There is a possible world where a counterpart is taller." That makes modality about similarity, not identity. It renders our modal talk false.

  **MARCUS:** It renders it *literally* strict, yes. But it preserves logic. You, on the other hand, are stuck with essentialism that looks arbitrary. Why is "being shaped like a torso" essential to the statue but not the clay? You appeal to "sortal concepts." But aren't those just in the mind? If the sortal is mind-dependent, then the persistence conditions are mind-dependent. Are you saying the statue literally pops out of existence if the sculptor forgets what he made?

  **ELENA:** No. The sortal captures the functional and historical essence of the object. The statue is essentially an artifact of a certain kind. That is an objective fact about its origin and intended function, not just a label. The clay has no such function. That is the ground! The historical relation to the artist's intention grounds the difference in persistence conditions.

  **MARCUS:** Intention? So if the sculptor trips and falls on the clay, accidentally making a shape that looks like a torso, there is no statue?

  **ELENA:** Likely not. There is just a lump.

  **MARCUS:** *(Gestures to the statue)* So the metaphysical status of this object depends on the mental state of a human being? That seems more magical than my temporal parts. I'd rather believe in spacetime worms than believe that human intention binds atoms together into distinct coincident entities.

  **ELENA:** And I'd rather believe in distinct entities than believe that this statue is just a "slice" of clay. You're eliminating the object we actually care about. We don't mourn the loss of a spacetime worm when a statue is smashed. We mourn the statue. Your ontology is revisionist. It tells me my eyes are lying to me.

  **MARCUS:** My ontology tells you that your eyes are seeing matter, and your mind is carving it. The danger of your view, Elena, is that it allows for unlimited multiplication of objects. If the statue and the lump are distinct, what about the "statue-minus-one-particle"? Is that a third object? Coinciding with the first two?

  **ELENA:** Not necessarily. We have constraints on composition. Not every arbitrary sum is an object.

  **MARCUS:** Who decides the constraints? You? Wiggins? It feels like you're drawing lines in the water. The four-dimensional view is uniform. Any sum of temporal parts is an object. Most aren't named, most aren't salient, but they exist. It's democratic.

  **ELENA:** It's anarchic. If every temporal slice is an object, then there is an object that is the statue plus the tail of my coat from five minutes ago. That's absurd.

  **MARCUS:** It's only absurd because it's not useful. But metaphysically? Why not?

  **ELENA:** Because objects have unity. A statue is a unity. A "statue-plus-coat-tail" is a gerrymandered collection. The constitution view respects the unity of the object. The lump constitutes the statue, but they are one in number? No. They are one in matter, distinct in form.

  **MARCUS:** And that "form" is doing all the heavy lifting without any physical weight. That's the Grounding Problem again. You have two things, same mass, same location, same parts. The only difference is a "form" or a "sortal." If that sortal isn't physical, you're a dualist about ordinary objects.

  **ELENA:** I'm a hylomorphist about ordinary objects. Matter and form. You've stripped the form away and left only the matter extended in time. You've saved parsimony by killing the phenomenon.

  **MARCUS:** I've saved logic by killing the mystery. Look, let's test it. *(Marcus picks up a tool, hovering it near the statue's neck)*. If I cut this head off...

  **ELENA:** Don't.

  **MARCUS:** Hypothetically. The statue ceases to exist. The lump does not. On your view, one object dies, the other survives. On my view, the statue-worm ends, the clay-worm continues. The physical event is identical. The description changes.

  **ELENA:** The description isn't all that changes. On my view, a real destruction occurs. A substance is lost. On your view, just a rearrangement of parts. You can't account for the *loss*.

  **MARCUS:** And you can't account for the *coincidence*. How can two substances occupy the same space without interacting? If I push the statue, I push the lump. If I heat the lump, I heat the statue. They are causally redundant. If they are distinct, why don't they compete for space?

  **ELENA:** Because the constitution relation is not spatial containment. The statue isn't *in* the clay like water in a bucket. The clay *constitutes* the statue. They share the matter. It's a unique relation, sui generis.

  **MARCUS:** *Sui generis*. The last refuge of the stuck metaphysician. "It's a special kind of relation." That's just saying "I don't know how it works, but it does."

  **ELENA:** And "temporal parts" is just saying "Treat time like space and ignore the flow." We don't experience time like space. We experience persistence.

  **MARCUS:** We experience memory and anticipation. The "flow" is psychological. The physics is block universe. If you want your metaphysics to align with reality, you have to align with physics.

  **ELENA:** If you want your metaphysics to align with *human life*, you have to align with the objects we interact with. We interact with statues, not worms.

  *(Silence hangs between them. The dust settles on the clay shoulder of the figure.)*

  **MARCUS:** So we're at an impasse. You prioritize the integrity of the object and our modal intuitions, even if it means coincident entities and brute grounding.

  **ELENA:** And you prioritize logical consistency and ontological parsimony, even if it means eliminating the objects of our daily experience and replacing identity with counterpart relations.

  **MARCUS:** Essentially. You think my view is too revisionist. I think yours is too mysterious.

  **ELENA:** *(Touches the base of the statue)* Well. As long as I don't squash it, the lump and the statue will continue to coincide.

  **MARCUS:** *(Puts the tool down)* And as long as we don't leave the room, the Elena-worm and the Marcus-worm will continue to overlap with this studio-worm.

  **ELENA:** *(Smiles faintly)* I suppose that's one thing we can agree on. We're both stuck here for now.

  **MARCUS:** Temporally speaking.

  *(They stand in silence, looking at the statue. It remains unclear whether there is one thing looking back, or two.)*
