      *   **Situation:** 3 years ago, a reporter promised "permanent, unconditional" confidentiality to a source who provided lab notebooks proving data fabrication. Based on this, a junior postdoc was named and fired. Now, the postdoc is suing, claiming a senior scientist directed it. Authenticating the notebooks (crucial for the lawsuit/university review) requires the source to testify, which would unmask him. The source refuses, citing the promise. The reporter is gone.
