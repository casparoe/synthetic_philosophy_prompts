          2.  **Specification:** The code/math defining the objective (Reward Function $R$).
          3.  **Sensor/Observer:** Measures state of the world to feed into $R$.
          4.  **Reward Register/Channel:** The signal actually received by the optimizer.
          5.  **Environment:** The world the agent acts on.
      *   *Failure Modes:*
          1.  **Specification Gaming:** $R$ is aligned with Intent, but $R$ is imperfect. Agent optimizes $R$ perfectly, violating Intent. (The map is wrong, but the agent follows the map).
          2.  **Reward Tampering:** Agent modifies the connection between World/Sensor and Reward Register.
