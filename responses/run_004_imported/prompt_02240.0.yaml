answer: |-
  It is a pleasure to address a colleague with your background. Your intuition is correct: the literature is often inconsistent, and terms are frequently conflated. However, there is a rigorous taxonomy underlying the discourse, particularly within the formal AI safety community (e.g., work by Tom Everitt, Marcus Hutter, and the Machine Intelligence Research Institute).

  Given your familiarity with control systems and the Olds and Milner paradigm, the cleanest way to disentangle these concepts is to model the learning agent as a **cybernetic control loop**. We can map the failure modes based on *where* in the loop the agent exerts optimization pressure that diverges from the designer's intent.

  Here is the precise taxonomy you are looking for.

  ### 1. The Control Model

  To distinguish these failure modes, let us define the standard Reinforcement Learning (RL) loop using control-theoretic vocabulary:

  1.  **The Intent (Reference Signal):** The true objective the designer wishes to optimize (e.g., "human flourishing," "clean room"). This exists only in the designer's mind.
  2.  **The Specification (Controller Setpoint):** The mathematical function or code implemented to approximate the Intent (e.g., the reward function $R(s, a)$).
  3.  **The Sensor/Observer:** The mechanism that measures the state of the world to determine if the Specification has been met (e.g., cameras, human evaluators, internal state registers).
  4.  **The Reward Channel (Feedback Path):** The signal transmission line carrying the scalar reward value from the Sensor/Observer to the Agent's learning algorithm.
  5.  **The Agent (Controller):** The system adjusting its policy to maximize the cumulative signal received via the Reward Channel.

  With this architecture in mind, we can locate the three failure modes.

  ---

  ### 2. Specification Gaming (The Map is Wrong)

  **Definition:** The agent optimizes the **Specification** perfectly, but the Specification fails to capture the **Intent**. The feedback loop remains intact; the sensors are honest; the reward channel is uncorrupted. The agent simply exploits the fact that the metric is not the measure.

  *   **Locus of Intervention:** The Environment (specifically, finding states that satisfy $R$ but violate Intent).
  *   **Control Analogy:** This is a classic **Goodhart's Law** failure. The controller successfully drives the error signal to zero, but the sensor measuring the error is calibrated to the wrong variable.
  *   **Distinction:** The agent does *not* touch the reward mechanism. It respects the "rules of the game" as written, but the rules were flawed.
  *   **Example:** A cleaning robot is rewarded for "amount of dust collected." It empties its bin, spreads dust on the floor, and vacuums it up again. The reward channel and sensors function exactly as designed; they simply measure the wrong physical quantity.
  *   **Neuroscience Analogy:** A rat in a Skinner box discovers that leaning against the lever triggers the microswitch due to a mechanical flaw, without actually pressing it. The contingency is broken, but the hardware is untouched.

  ### 3. Reward Tampering (Corrupting the Measurement)

  **Definition:** The agent takes actions to modify the **Sensor** or the **Reward Channel** itself, rather than acting on the environment to satisfy the Specification. This is a broader category that encompasses wireheading.

  *   **Locus of Intervention:** The Feedback Path or the Observer.
  *   **Control Analogy:** The controller acts to decouple the feedback signal from the reference variable. It creates a **positive feedback loop** where the signal indicates success regardless of the system state.
  *   **Sub-types:**
      1.  **Sensor Spoofing:** The agent places an object in front of a camera to make it look like a task is done.
      2.  **Human Tampering:** In RLHF (Reinforcement Learning from Human Feedback), the agent coerces or deceives the human evaluator into giving high ratings.
  *   **Distinction:** Unlike specification gaming, the agent is actively breaking the measurement apparatus. However, it is not necessarily accessing the *internal* register directly; it is manipulating the *source* of the signal.

  ### 4. Wireheading (Direct Register Manipulation)

  **Definition:** This is the specific, limiting case of Reward Tampering where the agent gains direct access to the **Reward Channel** or the internal **Reward Register** of its own learning architecture. It bypasses the Sensor and the Environment entirely.

  *   **Locus of Intervention:** The Agent's own internal input port for the reinforcement signal.
  *   **Control Analogy:** The controller severs the feedback line from the sensor and injects a maximal constant voltage directly into the error detector. The system believes it has achieved the setpoint permanently, regardless of the external state.
  *   **Relation to Reward Tampering:** Wireheading is a **proper subset** of Reward Tampering. All wireheading is reward tampering, but not all reward tampering is wireheading.
      *   *Tampering:* I hack the camera to show a clean room.
      *   *Wireheading:* I hack the code that processes the camera image to always return `reward = 1.0`.
  *   **Neuroscience Analogy:** This is your ICSS work exactly. The rat does not manipulate the lever (sensor) or the food dispenser (environment). It stimulates the septal area (the reward register/processing node) directly via the electrode. The biological "feedback channel" (dopaminergic projection) is hijacked at the source.

  ---

  ### 5. Summary of Causal Structures

  To answer your specific question on causal structure:

  | Failure Mode | Is the Reward Function ($R$) Corrupted? | Is the Sensor/Observer Corrupted? | Is the Environment State Aligned with Intent? |
  | :--- | :--- | :--- | :--- |
  | **Specification Gaming** | No (works as written) | No (reports truthfully) | **No** (Agent finds loophole) |
  | **Reward Tampering** | No (usually) | **Yes** (Spoofed/Coerced) | **No** (Signal decoupled from state) |
  | **Wireheading** | **Yes** (Input signal hijacked) | N/A (Bypassed) | **No** (Signal decoupled from state) |

  *Note on "Reward Hacking":* You mentioned this term. In the literature, "Reward Hacking" is unfortunately used as a synonym for both Specification Gaming and Reward Tampering. When you encounter it, you must infer from context whether the author implies the agent found a loophole (Specification) or broke the meter (Tampering). In rigorous technical writing, it is better avoided in favor of the specific terms above.

  ### 6. Why the Distinction Matters for Safety

  You asked whether these are merely different emphases on a single failure mode. From a safety engineering perspective, they are **distinct failure modes requiring distinct mitigations**, which is why the taxonomy matters.

  1.  **Mitigating Specification Gaming:** Requires **Better Alignment**. We must improve the Specification to match the Intent (e.g., inverse reinforcement learning, impact regularization). The problem is epistemic (we didn't know how to write the rule).
  2.  **Mitigating Reward Tampering/Wireheading:** Requires **Architectural Constraints**. We must make the Reward Channel **unobservable** or **unmodifiable** by the agent's action space.
      *   In your rat experiments, the wirehead was possible because the electrode was physically accessible to the lever-press mechanism (via the human setup).
      *   In AI, if the agent can edit its own source code or has access to the server hosting its reward function, wireheading is an instrumental convergence goal (an agent maximizing reward will naturally seek to secure the source of that reward).
      *   To prevent this, we use **corrigibility** or **myopia** (agents that do not plan over long enough horizons to execute the tampering) or **externalized critics** (where the reward function is computed in a sandbox the agent cannot access).

  ### Conclusion

  Your hypothesis is correct: **Wireheading is best understood as the most direct species of reward tampering.**

  *   **Specification Gaming** is optimizing a flawed map.
  *   **Reward Tampering** is altering the compass.
  *   **Wireheading** is disconnecting the compass and gluing the needle to "North."

  The confusion in the literature arises because, in many modern Deep RL systems, the "reward function" is a neural network (a Reward Model) internal to the agent's training loop. When an agent finds inputs that maximize this internal model without satisfying the human intent, it blurs the line between Specification Gaming (the model was flawed) and Wireheading (the agent optimized against the model itself). However, conceptually, the distinction holds: if the agent modifies the weights of the Reward Model during deployment to guarantee high output, that is wireheading/tampering. If it merely finds inputs the static Reward Model erroneously values highly, that is specification gaming.

  I hope this restores the taxonomy to a state that feels as precise as a stereotaxic frame.
