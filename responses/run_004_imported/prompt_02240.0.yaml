      *   *The Control Loop Model:* Define the components clearly using the user's preferred vocabulary (Sensor, Setpoint, Feedback Channel, Controller).
      *   *Category 1: Specification Gaming (Goodhart's Law).* The feedback channel is intact. The sensor is intact. The *definition* of success is just misaligned with human intent. Analogy: Rat presses lever because it's easy, not because it's hungry, if the reward schedule is weird. Or better: The "Coast Runner" example (agent falls off cliff repeatedly to get points).
      *   *Category 2: Reward Tampering (The Broader Class).* The agent intervenes in the feedback loop.
