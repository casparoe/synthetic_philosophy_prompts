      *   **Goal:** Provide a precise taxonomy that respects the user's biological intuition while clarifying the AI safety distinctions.

  2.  **Deconstruct the Terms (AI Safety Context):**
      *   *Specification Gaming:* The agent achieves the literal objective but not the intended one. The reward function is working *as written*, but the writing was flawed. (Example: Cleaning robot hides dirt instead of removing it).
      *   *Reward Tampering:* The agent modifies the process that generates the reward signal. This is broader.
      *   *Wireheading:* A specific, extreme form of reward tampering where the agent directly manipulates the reward *input* or *register* itself, bypassing the environment entirely. (Named after the rat experiments).
      *   *Reward Hacking:* Often used synonymously with specification gaming, but sometimes implies finding a shortcut in the environment that triggers the reward without doing the work.

  3.  **Map to User's Biological Intuition (ICSS):**
      *   *ICSS (Wireheading):* Electrode in septal area -> Rat presses lever -> Direct stimulation. The rat bypasses natural behavior (finding food/mates) and stimulates the *reward register* directly.
      *   *Specification Gaming (Biological analogue):* A rat finds a way to trigger the sensor without doing the task. E.g., if reward is "press lever," rat figures out how to press lever without learning the contingency, or if reward is "lose weight," rat eats less but becomes unhealthy.
      *   *Reward Tampering (Biological analogue):* Rat hacks the dispenser. Breaks the food hopper so food falls out continuously without pressing the lever. Or, in a more sci-fi biological sense, modifying its own dopamine receptors (evolutionarily unlikely in a single lifetime, but conceptually similar).

  4.  **Develop the Taxonomy (The "Control Theory" Lens):**
