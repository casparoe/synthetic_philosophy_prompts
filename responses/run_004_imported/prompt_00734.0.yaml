      *   *Is the curfew punishment purely punitive?* It's about safety and trust. Trust is personal. You can't transfer trust.
      *   *Key phrase:* "Fungibility." (Maybe too technical? Let's explain it simply). "Transferable vs. Non-transferable."

  8.  **Final Polish (structuring the answer):**
