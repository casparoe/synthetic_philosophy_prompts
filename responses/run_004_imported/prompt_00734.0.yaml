answer: |-
  It makes total sense why that feels inconsistent to you. On the surface, both situations look like: **Sister breaks rule $\rightarrow$ Consequence assigned $\rightarrow$ You offer to take consequence $\rightarrow$ Parents react differently.**

  However, your parents aren't necessarily making up the rules as they go. There is actually a fundamental logical difference between the two scenarios. It comes down to the difference between **restitution** (fixing a problem) and **accountability** (learning a lesson).

  Here is the breakdown of why those two situations are treated differently.

  ### 1. Money is fungible; consequences are not
  In economics, there is a concept called "fungibility." It means that one unit of something is identical to another unit. A dollar from your pocket buys the exact same amount of repair work as a dollar from your sister's pocket.
  *   **The iPad:** The goal was to fix a broken object. The screen doesn't care whose money paid for it. As long as the $80 was paid, the material problem was solved. Your parents likely prioritized fixing the family asset over the lesson of who paid for it.
  *   **The Curfew:** The goal wasn't to fix a broken object; it was to correct behavior. A consequence like grounding is *personal*. It is designed to make *her* feel the loss of privilege so that *she* associates breaking curfew with missing out on fun. If you stay home instead, she feels no loss. Therefore, the lesson isn't learned. You can't transfer the experience of missing a party to someone else.

  ### 2. Restitution vs. Punishment
  *   **The iPad (Restitution):** This was about making the family whole again. Something was broken, and it needed to be un-broken. By paying, you essentially donated to the family fund. It was generous of you, and while it arguably let your sister off the hook too easily, it solved the practical issue.
  *   **The Curfew (Punishment/Trust):** This is about trust and safety. Curfew exists to ensure safety and teach time management. When she breaks it, she violates trust. Trust is non-transferable. You cannot "serve time" for someone else's breach of trust because *she* is the one who needs to rebuild that trust with your parents.

  ### 3. The "Rescue" Dynamic
  Here is the hard truth: **The iPad situation was actually the inconsistent one, not the curfew situation.**

  In healthy discipline, the person who breaks the rule should bear the cost.
  *   **iPad:** Ideally, your sister should have paid the $80 (perhaps through chores or allowance) to learn that breaking things costs money. By paying it, you accidentally enabled her. Your parents likely accepted it because $80 is a lot of money for a kid to come up with, and they just wanted the iPad fixed.
  *   **Curfew:** Your parents are drawing a harder line here. They realize that if they let you take the punishment, your sister learns that she can break rules without personal negative outcomes, as long as someone else is willing to sacrifice for her.

  ### Summary
  It feels inconsistent because **you** are the constant variable (you offered to help both times), but the **purpose** of the consequence changed.

  *   **iPad:** The purpose was **repair**. You can help with repair.
  *   **Curfew:** The purpose was **growth**. You cannot help with growth; she has to do that herself.

  Your parents aren't being arbitrary; they are recognizing that while you can pay someone's bills, you can't live their life lessons for them. It sucks in the moment because you're trying to be kind, but in the long run, your mom is right: for behavioral issues, the consequence has to stick to the person who broke the rule.
