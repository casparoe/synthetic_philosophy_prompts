answer: |-
  This is an excellent observation, and it demonstrates exactly the kind of critical thinking that wins Ethics Bowl rounds. You have identified a tension that philosophers who work on "moral standing" or the "ethics of blame" (such as George Bell, Kyle Fritz, Daniel Miller, and R.J. Wallace) debate vigorously.

  The short answer is: **No, philosophers who defend the "standing to blame" framework do not accept the moral nihilism conclusion.** You are running two distinct concepts together: the **truth of the moral claim** and the **propriety of the moral speaker.**

  Here is a breakdown of why your inference doesn't hold, how philosophers distinguish these ideas, and how you can use this distinction in your Ethics Bowl rounds.

  ### 1. Standing vs. Truth (The Core Distinction)
  The central error in the argument is conflating the *legitimacy of the blamer* with the *validity of the blame.*

  When philosophers say a hypocrite "lacks standing," they mean the act of blaming is **inappropriate** or **unfair**, not that it is **false**.
  *   **The Fact:** The teenager sped. Speeding is dangerous and violates a moral/legal norm.
  *   **The Blame:** The parent scolds the teenager.
  *   **The Hypocrisy:** The parent also speeds.

  If the parent lacks standing, it means the parent is not the right person to deliver that scolding *in that moment*. It implies the parent is being unfair or disrespectful. However, it does not magically erase the fact that the teenager sped. The moral status of the teenager's action is independent of the moral status of the parent's history.

  **Analogy:** Imagine a corrupt judge who takes bribes presides over a trial for a murderer. The murderer is guilty. The judge is corrupt. Because the judge is corrupt, the *verdict* might be procedurally illegitimate (the judge lacks the standing to judge). But the *murder* still happened, and the murderer is still guilty. The corruption of the messenger does not negate the truth of the message.

  ### 2. The Scope of Hypocrisy (Specific vs. Global)
  Your argument relies on the premise: "Because virtually everyone is a hypocrite about something... no one is ever in a position to call any action wrong."

  Philosophers argue that standing is **topic-specific**, not global.
  *   If I am a hypocrite about *speeding*, I lose the standing to blame *you* for speeding.
  *   I do **not** lose the standing to blame you for *assault*, *theft*, or *lying*.

  Even if we accept the cynical premise that "everyone is a hypocrite about something," it does not follow that "everyone is a hypocrite about *everything*." Therefore, there are always people with clean enough hands regarding *specific* issues to hold others accountable for those specific issues.

  For moral nihilism to follow from this framework, you would need to prove that every moral agent is a hypocrite regarding *every possible moral norm simultaneously*, which is empirically false.

  ### 3. The "Tu Quoque" Fallacy
  In Ethics Bowl, you can identify this line of reasoning as a sophisticated version of the **Tu Quoque** (Latin for "you also") fallacy.

  *   **Tu Quoque:** "You say I shouldn't smoke because it's unhealthy, but you smoke too! Therefore, smoking isn't unhealthy."
  *   **Reality:** The advice is sound (smoking is unhealthy) even if the advisor is flawed.

  Philosophers who defend standing to blame agree that *Tu Quoque* is a valid objection to the *person*, but not to the *principle*. When you point out a parent's hypocrisy, you are successfully criticizing the parent's behavior, but you are not successfully defending the teenager's speeding.

  ### 4. Why Philosophers Care About Standing (Without Being Nihilists)
  If the act is still wrong, why does standing matter? Philosophers care about standing because blame is a **communicative act**, not just a verdict.

  *   **The Function of Blame:** To call someone to account, to demand justification, or to express moral disappointment.
  *   **The Hypocrite's Problem:** When a hypocrite blames, they implicitly claim a moral authority they do not possess. They say, "I am upholding the norm," while their actions say, "I reject the norm." This undermines the moral community.

  So, the philosopher says: "The parent should not scold the teen."
  *   **Not because:** The teen did nothing wrong.
  *   **But because:** The scolding will be ineffective, resentful, and unfair, damaging the relationship without upholding the norm.

  ### 5. Ethics Bowl Strategy: How to Use This
  This is a fantastic point to raise in a round, provided you wield the distinction carefully.

  **If you are arguing that the hypocrite shouldn't blame:**
  > "We argue that while the teenager's action was indeed wrong, the parent lacks the *moral standing* to enforce that norm. Hypocritical blame undermines the legitimacy of the moral community. It turns moral correction into an exercise of power rather than a shared commitment to values."

  **If you are arguing against someone who uses your nihilism argument:**
  > "My opponent suggests that because the parent is a hypocrite, the teenager's action wasn't wrong. This conflates the *messenger* with the *message*. The parent's hypocrisy makes their scolding unfair, but it does not make the speeding safe or permissible. We can acknowledge the parent's fault without absolving the teenager."

  ### Summary
  You have correctly identified that the "standing to blame" literature restricts *who* can speak. However, you incorrectly inferred that this restricts *what is true.*

  *   **Philosophers' View:** Hypocrisy disqualifies the **blamer**, not the **blame**.
  *   **Nihilism Check:** The framework does not lead to nihilism because moral wrongs exist independently of who points them out.
  *   **Your Move:** In your round, accept that the hypocrite lacks standing, but insist that the moral norm remains intact and must be upheld by someone else (or through a different mechanism).

  This shows the judges you understand the nuance of moral authority versus moral truth. Good luck with your practice!
