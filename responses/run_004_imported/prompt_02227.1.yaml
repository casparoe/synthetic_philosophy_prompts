      *   *Refining the "Corner Cutting":* Be careful not to overstate. If I lie on my timesheet, does an alien lie on theirs? Maybe. But the impact on *my* utility is small compared to the causal risk of getting fired. ECL adds a tiny "multiverse tax" to defection.
      *   *Refining the "Compromise":* This is where ECL shines. If I meet someone with weird values, standard CDT says "ignore them." ECL says "if they are rational ECL agents, we are already trading." So, don't suppress them.
