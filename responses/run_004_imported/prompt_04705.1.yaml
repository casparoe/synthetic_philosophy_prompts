      *   *Strengths:* Protects moral rationality. Prevents moral skepticism.
      *   *Weaknesses:* More abstract/logical. Might distance the agent from the feeling. If the code is consistent, one might argue the agent did "no wrong" in a logical sense, potentially undermining the rationality of guilt (though Marcus argues against this).
