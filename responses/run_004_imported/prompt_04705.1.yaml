      *   **Caveat/Nuance:** Marcus is better if the dissertation focuses on *systemic* reform (fixing the world so the code is satisfiable). Williams is better if focusing on *individual* support/validation.
      *   **Recommendation:** Go with Williams for the "rationality of guilt" argument, perhaps use Marcus to bolster the claim that the *system* isn't broken (preventing moral skepticism).

