          *   Marcus: "Here's the distinction: Transitivity constrains the *evaluation* of options. Resolution constrains the *execution* of intentions. I can value X over Z locally, but choose Z because choosing Z fulfills a plan that protects me from exploitation. The preference relation stays cyclic; the choice function doesn't map directly from the local preference relation."
