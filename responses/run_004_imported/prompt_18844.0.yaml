          *   Theorist 2 (T2): Anti-Money Pump Argument (McClennen-style). Believes exploitability is about naive sequential choice, not preference structure. Resolute choice can block the pump without changing underlying preferences.
      *   **Requirements:** Tight, natural page of back-and-forth. Equal argumentative skill. No outright concession. No strawmanning. T1 must press T2 on whether "resolute" refusal is just disguised transitivity. T2 must give an actual answer, not just restate the distinction.
      *   **Context:** Economics PhD dissertation chapter background.

  2.  **Deconstruct the Arguments:**
      *   **T1 (The Exploitability Thesis):** If you have cyclic preferences, you are vulnerable to a money pump. If you stop the pump, you are effectively acting *as if* you have transitive preferences (or a higher-order preference against being pumped). Therefore, rationality requires acyclicity. Temkin's "essentially comparative" view tries to save cyclicality but ends up requiring a transitive rule to avoid loss.
      *   **T2 (The Resolute Choice Thesis):** McClennen argues that rational agents can be resolute. They stick to a plan. If I plan not to trade Z back to X for a fee, I don't do it. My underlying preference at the moment might still be X > Z (cyclic), but my *choice* is governed by resolution. The pump exploits *naivety*, not cyclicality.
