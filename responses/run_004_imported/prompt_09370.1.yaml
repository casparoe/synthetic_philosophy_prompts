answer: |-
  The fixation point is a black cross on a white screen. That's the rule. Keep your eyes on the cross. If you move your eyes, the experiment breaks. If you move your eyes, the truth leaks from one side to the other.

  I sit in the chair, the leather cool against my back. Dr. Aris stands behind the monitor, her face obscured. She knows I know the drill. I've had the callosotomy for three years. The seizures stopped, mostly. The storms that used to wreck the whole house now stay contained in one wing. But the silence between the wings is what we're testing today.

  "Ready?" Aris asks.

  "Ready," I say. My voice comes from the left hemisphere. It's the only part of me that can really speak.

  A flash. Ten milliseconds. An image of a snowflake appears in my left visual field.

  My right hemisphere sees it. It knows the cold, the geometry, the white silence of it. But my left hemisphere, the speaker, sees only the white screen. The corpus callosum, the bridge where the signals used to commute, is severed. The news doesn't cross.

  "What did you see?" Aris asks.

  "Nothing," I say. And I mean it. I saw nothing.

  "Use your left hand. Point to what you saw."

  My left hand, heavy and deliberate, moves without my verbal consent. It reaches out and points to a card depicting a winter coat.

  "Good," Aris says. "Why did you point to the coat?"

  This is the moment. The gap. My left hemisphere sees the hand pointing at the coat. It doesn't know about the snowflake. It cannot know. But it cannot tolerate the gap. It is a machine designed for coherence, for narrative. It is the Interpreter.

  "Because it's cold," I say. My voice is confident. There is no hesitation. I feel the certainty of it in my throat. "Winter comes to mind."

  It is a lie. Not a malicious one, but a structural one. My brain invented a reason to explain an action it didn't initiate. I feel a flicker of something then—not shame, but vertigo. If I can lie to the doctor so effortlessly, so convincingly, what else am I lying about?

  Later, at home, the vertigo follows me into the kitchen. I am making tea. The kettle whistles, a sharp, singular note. I reach for the mug with my right hand. My left hand is resting on the counter, palm down.

  As I lift the mug, my left hand twitches. It slides across the laminate, fingers splaying, moving toward the sugar bowl. I didn't tell it to move. I wanted unsweetened tea. The left hand knows this; we've had this argument before. Yet it reaches for the spoon.

  I stop it with my right hand. I clamp my right fingers over the left wrist. For a second, we are locked in a stalemate. My body is fighting itself, not in spasm, but in intention. One side wants sweet; the other wants bitter.

  I force the left hand down. I pour the water. I sit.

  I think about the papers I've read late at night, the blue light of the laptop stinging my eyes. The old studies from the sixties, Sperry and Gazzaniga. They made it sound like two people trapped in one skull, strangers sharing a ribcage. The left hand unbuttoning the shirt while the right hand buttoned it. The left hand putting the groceries away while the right hand took them out.

  But then there was the 2017 paper. Pinto. I remember the title, the dry academic font. *Unity in Disconnection.* They tested patients like me with more sensitive tools. They found that in everyday life, we act unified. We walk, we talk, we eat as one entity. The split is only visible when you force the brain into a corner, when you flash an image for ten milliseconds and forbid eye movement.

  So which is it? Am I two people who learned to cooperate? Or one person whose internal wiring is just slower now?

  I lift the tea to my lips. The steam rises. I think about the Interpreter again. Before the surgery, when the cable was intact, the left hemisphere received data from the right instantly. It wove that data into the story of "me." I felt like a single continuum. I felt like I knew why I chose the blue shirt instead of the red. I felt like I knew why I turned left instead of right.

  But Gazzaniga says the Interpreter is always running. It's always constructing the reason after the fact. The difference is, when the bridge is intact, the data arrives so fast the delay is imperceptible. The story feels like truth because the evidence arrives before the explanation is finished.

  Cut the bridge, and the delay becomes visible. The hand moves, and the voice has to catch up. The voice guesses.

  I look at my left hand resting on the table. It is mine. It has the scar from when I fell off a bike at age seven. It has the wedding band I put there twenty years ago. But did *I* put it there? Or did this hand slide it on while the voice was busy saying vows?

  It's a terrifying thought, but it's not the horror of a monster. It's the horror of emptiness. If the sense of unity is just a narrative trick, a smooth story told by the left hemisphere to explain the noisy democracy of the brain, then the surgery didn't split me. It just removed the editor.

  I stand up and walk to the hallway mirror. I need to see the face. The face is usually the anchor.

  I stare into my own eyes. The pupils are equal. The expression is neutral. I raise my right hand to touch the glass. The reflection raises its left. Standard physics. Standard biology.

  But I remember the Pinto data. They argued that subcortical connections, older pathways beneath the cortex, still allow for unity. Maybe the feeling of "I" isn't in the cortex at all. Maybe it's deeper, in the brainstem, in the breath, in the heartbeat that doesn't care about hemispheres.

  Or maybe that feeling is just another story.

  I try to catch myself in a lie. I decide to scratch my nose. I watch the intention form. Where does it start? Is it a command sent from the top down, or a sensation rising from the bottom up that I claim as my own?

  My left hand rises to meet the right at my face. They meet in the middle, fingers brushing against the skin. For a moment, they hover there, symmetric, identical.

  I don't know who is looking out of these eyes. I don't know if there was ever a single captain on this ship, or if there was always a committee, with the left hemisphere just acting as the press secretary, issuing statements about decisions it didn't make.

  The surgery was supposed to stop the seizures. It did that. But it also stopped the illusion of simplicity. Before, I was a line. Now, I am a conversation. But was I ever really a line? Or was I always a conversation that had learned to speak in one voice?

  I lower my hands. The reflection lowers theirs.

  "I am here," I say to the mirror.

  The words hang in the air. They sound true. They feel true. But I know now that feeling true is the Interpreter's job description. It is its function to make me feel whole, regardless of the architecture underneath.

  I turn away from the mirror. I walk back to the kitchen. I need to wash the mug. I reach for the soap with my right hand. My left hand turns on the tap. We work together. The water runs. The foam rises.

  I don't know if "we" is the right word. I don't know if "I" is either. I just know the water is warm, and the mug is clean, and the story continues, seamless and unbroken, even if the wire beneath the surface is gone. Or maybe even if it was never there to begin with.
