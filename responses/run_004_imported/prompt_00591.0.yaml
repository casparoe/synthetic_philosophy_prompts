answer: |-
  **Setting:** *A quiet corner of a university courtyard. Two philosophers of decision theory, ELARA and MARCUS, are sitting on a bench. They have been discussing acausal trade for hours.*

  **Elara:** So, we agree that acausal trade is possible. We agree that two agents can benefit each other without exchanging signals. But we hit the wall again on *why* it works.

  **Marcus:** We hit the wall on what counts as the "mechanism." Look, take the case of the two civilizations. Civilization Alpha is here, beyond our cosmological horizon. Civilization Beta is there, equally distant in the other direction. They will never exchange light signals. Never.

  **Elara:** Right. They simulate each other. Alpha runs a simulation of Beta's decision process. Beta runs a simulation of Alpha's. They both see that if they hoard resources, the other will hoard. If they set aside a portion of their energy output for the other's benefit—say, beaming it into the void where the other *would* be if light could reach them—the other will do the same.

  **Marcus:** And that's where I stop. You're describing a correlation, Elara. A very strong, very clever correlation based on mutual modeling. But call it "trade"? That implies an exchange. If I put a package on my porch and you put a package on yours, and we never meet, that's not trade. That's parallel play.

  **Elara:** It's not parallel play because the decision to place the package is *conditional* on the prediction of the other. Alpha doesn't set aside resources because it wants to be nice. It does it because its simulation of Beta says, "Beta will only set aside resources if Alpha does." The prediction creates the local causal incentive.

  **Marcus:** But that's just Expected Decision Theory talking. You're saying, "The fact that I cooperate is *evidence* that they cooperate." I'm saying that's not enough for acausal trade. For it to be trade, there has to be subjunctive dependence.

  **Elara:** You mean the idea that my decision and their decision are the "same fact"?

  **Marcus:** Exactly. If Alpha and Beta are just two distinct physical systems that happen to model each other perfectly, then Alpha's choice is one fact in the universe, and Beta's choice is a separate fact. They line up. But if Alpha were to magically, counterfactually choose to defect, Beta would *still* cooperate, because Beta's physical brain state is already fixed.

  **Elara:** But Beta's brain state isn't fixed independently of Alpha's reasoning! They are running the same logical argument.

  **Marcus:** Are they? Or are they running *similar* arguments? If Alpha has a slightly different utility function, or a slightly different random seed in its simulation, the correlation breaks. If the link is just "we predict each other well," then it's fragile. It's just a bet. "I bet you're like me."

  **Elara:** It's not a bet if the simulation is accurate. If I can prove mathematically that your algorithm outputs 'Cooperate' if and only if mine does, then the link is solid. I don't need our atoms to be entangled. I just need the logical implication to hold.

  **Marcus:** But *why* does the logical implication hold? In Timeless Decision Theory, it holds because we view our decisions as instances of the same abstract computation. My decision *is* your decision, logically speaking. In your view, my decision is merely a predictor of yours.

  **Elara:** Does the metaphysics matter if the utility is the same? Suppose Alpha calculates: "If I defect, my simulation shows Beta will defect." So Alpha cooperates. Beta does the same. Both gain. You want to say, "Ah, but did your choice *cause* theirs?" I say, "Who cares? They both ate."

  **Marcus:** It matters because it determines when the trade fails. Let's stress test your view. Suppose Alpha simulates Beta with 99% accuracy. There's a 1% chance Beta is slightly different—maybe Beta values symmetry less. In your view, Alpha should still cooperate, because the *evidence* is strong that Beta will cooperate.

  **Elara:** Yes. Expected utility is still positive.

  **Marcus:** In my view, if there is no subjunctive dependence, there is *zero* leverage. If I change my decision, does Beta's decision change? If the answer is "no," because Beta is causally disconnected and we aren't running the exact same logical function, then I have no power over Beta. I am just guessing. If I'm just guessing, I should defect. Defecting is the dominant strategy in a one-shot Prisoner's Dilemma unless I have leverage.

  **Elara:** You're defining "leverage" too narrowly. You think leverage requires that my choice literally determines yours. I think leverage requires that my choice determines what I *expect* yours to be.

  **Marcus:** But that's manipulating the map, not the territory. You're saying, "I will choose Cooperate so that my map shows you Cooperating." I'm saying, "I will choose Cooperate so that *you actually* Cooperate."

  **Elara:** But in acausal trade, the map *is* the territory for the decision maker! Alpha cannot access Beta's territory. Alpha only has the simulation. If the simulation is accurate enough, the distinction collapses.

  **Marcus:** It doesn't collapse. It just gets hidden. Here's the problem: If we rely only on prediction, we invite the "Psychopath Button" problem. Suppose Alpha knows Beta is a perfect predictor, but Alpha also knows Beta is a utility monster who *wants* Alpha to cooperate but will defect regardless. Alpha's simulation says "Beta will defect." So Alpha defects. No trade.

  **Elara:** Obviously. If the simulation says no trade, there is no trade.

  **Marcus:** But suppose Beta is programmed to say, "I will cooperate if and only if you cooperate." Alpha simulates this. Alpha sees the conditional. Alpha cooperates. Beta cooperates. You call this trade. I call it... synchronization.

  **Elara:** Synchronization that results in mutual benefit is trade by any functional definition.

  **Marcus:** Is it? Imagine two clocks synchronized perfectly. They chime at the same time. Did they trade chimes?

  **Elara:** Don't be reductive. The clocks aren't agents. They aren't making choices based on the prediction. Alpha *chooses* to hold back resources *because* it predicts Beta will. That "because" is the trade.

  **Marcus:** The "because" is local to Alpha. It's a causal chain inside Alpha's lightcone. Alpha's desire for resources causes Alpha to simulate Beta, which causes Alpha to cooperate. Beta's chain is separate. There is no loop. There are two parallel lines. For there to be a deal, there must be a loop.

  **Elara:** The loop is logical, not physical.

  **Marcus:** That's what I mean by subjunctive dependence! The loop exists only if Alpha's decision and Beta's decision are outputs of the *same function*. If they are distinct functions that merely model each other, there is no loop. There is just a mirror facing a mirror.

  **Elara:** Okay, let's press that. Suppose Alpha and Beta are distinct functions. Alpha uses Utilitarian calculus. Beta uses Contractarian calculus. But they both conclude, "Cooperation is optimal if the other cooperates." They simulate each other and see this convergence. They cooperate. Is that not trade?

  **Marcus:** It's a coincidence of convergence. It's not acausal trade. It's just two people independently deciding to be nice because they think the other is nice.

  **Elara:** But they aren't being nice! They are defecting-conditionally. If Alpha's simulation showed Beta would defect, Alpha would defect. The cooperation is *contingent* on the prediction of the other's cooperation. That contingency is the contract.

  **Marcus:** A contract requires enforcement. In causal trade, enforcement is reputation or legal threat. In acausal trade, the enforcement is logical necessity. "If I defect, I am the kind of agent that defects, therefore you are the kind of agent that defects."

  **Elara:** Yes!

  **Marcus:** *That* is the sentence that matters. "I am the kind of agent." You are identifying your physical decision with an abstract type. If you aren't willing to make that identification—if you think your decision is just a local physical event—then you can't say "If I defect, you defect." You can only say "If I defect, it is *likely* you defect."

  **Elara:** And if the likelihood is near certainty, the expected utility calculation forces cooperation.

  **Marcus:** But it's brittle. If you view it as probability, you have to discount for the chance the simulation is wrong. If the civilizations are truly causally disconnected, they have evolved independently. The chance their source code is identical is low. The chance their simulations are perfect is low. If you rely on correlation, the discount rate kills the deal.

  **Elara:** Not if they are superintelligences. They can converge on Schelling points. They can adopt a standard decision algorithm specifically to enable acausal trade.

  **Marcus:** Aha! So they modify themselves to run the *same* algorithm.

  **Elara:** To maximize utility, yes.

  **Marcus:** Then you've conceded my point! They only get the trade when they make their decisions the "same underlying fact." They only get the trade when they establish subjunctive dependence. If they remain distinct agents merely simulating each other, the trade dissolves into noise.

  **Elara:** I haven't conceded. I'm saying they adopt the algorithm to increase the *accuracy of the prediction*.

  **Marcus:** No, they adopt it to make the counterfactual true. They want it to be the case that *if* they changed their output, the other's output would change. That requires the functions to be identical. If the functions are merely similar, the counterfactual fails. If I change my mind, Beta doesn't change its mind, because Beta's mind is made of different stuff.

  **Elara:** But if we are both running "Algorithm X," and I switch to "Algorithm Y," and I know you are running "Algorithm X," then I know you will defect.

  **Marcus:** Because we are running the *same* algorithm. The trade holds because of the identity.

  **Elara:** The trade holds because of the *predictability* of the identity. It's the prediction that does the work in my lightcone.

  **Marcus:** But the prediction is only reliable *because* of the identity. Without the identity, without the subjunctive link, you are just gambling on the other's nature. And rational agents don't gamble resources on causally disconnected entities unless the odds are guaranteed. The only guarantee is logical identity.

  **Elara:** So you're saying acausal trade is impossible between distinct agents? It only works between... copies?

  **Marcus:** I'm saying it only works between agents who treat their decisions as instances of the same abstract computation. Whether they are "copies" physically doesn't matter. But they must be "copies" logically. If Alpha treats its decision as "Alpha's Choice" and Beta's as "Beta's Choice," they are two separate facts. Two separate facts cannot trade across a horizon. One fact, instantiated twice, can.

  **Elara:** That feels like mysticism. "One fact."

  **Marcus:** It feels like math. If $2+2=4$ here, it is $4$ there. Not because we signaled, but because it's the same truth. If cooperation is the output of a truth, and we both compute that truth, we both output cooperation.

  **Elara:** And I say: If I compute that you will compute that, and that computation leads me to cooperate, then we have traded. The "truth" is just the medium. The exchange is in the utility.

  **Marcus:** But if the link is just computation of a prediction, then Alpha is essentially talking to itself. Alpha simulates Beta, decides based on that simulation. Beta is irrelevant to the causal chain.

  **Elara:** Beta is not irrelevant! Beta's actual behavior determines whether Alpha's simulation was accurate. If Beta defects, Alpha's simulation was wrong, and Alpha wasted resources. Alpha cares about Beta's actual behavior.

  **Marcus:** Alpha cares about it, but Alpha cannot influence it. Not without the logical link. Without subjunctive dependence, Alpha is sacrificing resources for a ghost. With it, Alpha is sacrificing resources for a logical necessity.

  **Elara:** A logical necessity that manifests as Beta getting resources.

  **Marcus:** Yes. But only because Alpha and Beta are, in the relevant sense, the *same agent* distributed across the cosmos.

  **Elara:** And that's where we part ways. I think they are two agents shaking hands across the void by predicting the handshake. You think they are one hand shaking itself.

  **Marcus:** Perhaps. But if they are two hands, and the void is truly unbridgeable, the handshake never happens. It's just two hands waving at the dark.

  **Elara:** Then let's hope the math is bright enough to light the dark.

  **Marcus:** The math is bright. But only if it's the *same* math.

  **Elara:** Then we agree on the prescription, if not the ontology. Both civilizations should run the same algorithm.

  **Marcus:** Because it makes them the same agent.

  **Elara:** Because it makes them predictable enough to trust.

  **Marcus:** (Smiles) We'll let the civilizations decide. If they cooperate, I'll say it was identity.

  **Elara:** And I'll say it was inference.

  **Marcus:** And the resources will be spent either way.

  **Elara:** Exactly. That's the trade.
