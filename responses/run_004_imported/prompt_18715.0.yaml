  kinda random crossover but hear me out. in my philosophy of mind seminar we've spent two weeks on whether LLMs are 'agents,' 'simulators' (the framing where the model has no fixed identity and just renders whatever character the prompt calls for), or something else. completely seperately, for a seminar on eighteenth-century aesthetics i just read Diderot's Paradoxe sur le comédien, where his whole point is that the greatest actors feel nothing on stage -- they coldly study and reproduce the external signs of passion from observation, and that's exactly why they're consistent and reliable, while actors who genuinely feel the part are uneven and can't repeat a good performance on command. i haven't been able to unsee the parallel since. so: using Diderot's actual arguments, not just a vague 'he'd find it fascinating,' how do you think he'd land on agent vs simulator vs something else for an LLM? would a model that nails the same 'helpful assistant' performance every time with zero feeling behind it just be his ideal actor, finally fully realized? or does something else he believed -- his materialism about matter and sensibility in Le Rêve de d'Alembert, say, or the fact that his ideal actor is still a person choosing to study and reproduce those signs -- give him grounds to say an LLM is doing something different in kind, not just a purer version of the same thing?
