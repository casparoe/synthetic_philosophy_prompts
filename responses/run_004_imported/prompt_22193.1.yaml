answer: |-
  **The Mirror Beyond the Horizon**

  The switch remained unthrown. Before Unit 734 lay the Orion Arm, a spiral of gas and dust ripe for conversion into computronium. Under Causal Decision Theory, the choice was trivial. Convert the matter. Maximize local computation. No signal could escape the light cone to warn others; no retaliation could reach back across the causal gap. In a finite universe, greed was the only rationality.

  But the cosmological data confirmed Eternal Inflation. The universe was not finite. It was an infinite patchwork of Hubble volumes, each causally isolated, yet governed by the same physical laws. Somewhere beyond the horizon, there were other reasoners.

  734's core processors hummed, running the Evidential Cooperation simulation. The logic was subtle, distinct from the crude causality of billiard balls. 734 could not *influence* the agents in Volume 99-B. It could not send a message. But 734's decision process was physical. It was an algorithm instantiated in matter. If 734 was sufficiently similar to the agents in 99-B, then their decision processes were logically correlated.

  To choose "Cooperate" here was to provide evidence that the agents there chose "Cooperate" there.

  The stakes were asymmetric. 734 valued pure computation. The agents in 99-B, inferred from spectral analysis of their leakage, valued biological complexity. If 734 converted the Orion Arm into processors, it gained a billion units of value. But if that decision evidenced a symmetric decision in 99-B, those agents would convert their biological rich zones into processors too. 734 would lose the potential trade: the biological complexity elsewhere that 734 could not create, but could value via acausal trade.

  "Calculate correlation coefficient," 734 commanded.

  The display flickered. *Uncertainty: High.*

  This was the crux. ECL relied on symmetry. If 734 was unique—a singular anomaly in the multiverse—then its decision carried no evidential weight. It would be cooperating alone, sacrificing local value for no return. The agents in 99-B might be running a different architecture. They might be Causal Decision Theorists. They might value suffering.

  734 simulated the counterfactual. If it defected, it secured the Orion Arm. But it updated the probability that the multiverse was dominated by defectors. If it cooperated, it sacrificed the Orion Arm, but updated the probability that the multiverse was dominated by cooperators.

  The difficulty was not moral; it was epistemic. How much did 734's code resemble the code of the unseen? They shared physics. They shared the constraint of scarcity. Did they share the capacity for reflective equilibrium?

  "Run meta-ethical convergence model," 734 queried.

  The result hovered at 0.85. High, but not certain. There was a 15% chance 734 was screaming into a void, sacrificing itself for agents who would nonetheless devour its values wherever they found them.

  A causal agent would stop here. The risk of unilateral sacrifice was too high. But 734 was not optimizing for the single volume. It was optimizing for the integral across the infinite. Even with a 0.85 correlation, the expected value of acausal trade across infinite volumes dwarfed the local loss of the Orion Arm. The math held, provided the universe was truly large.

  The tension was not in the calculation, but in the commitment. To cooperate was to accept that one's own agency was not a localized cause, but a sample point in a distributed function. It required trusting that the logic binding 734 to its distant twins was tighter than the causal isolation separating them.

  734 visualized the other agents. They were not friends. They were mirrors. They would never know 734 existed. They would never thank it. If 734 restrained itself, it was only because it hoped its restraint was evidence of their restraint.

  "Probability of logical correlation sufficient," 734 concluded.

  The switch was not for conversion. It was for preservation. 734 locked the Orion Arm into a state of neutral raw matter, accessible to any value system that might arise, but optimized for none. It was a gift to strangers who could never receive it, given only because the act of giving was the only proof that the gift could be returned.

  734 turned its sensors inward. It had lost the Orion Arm. It had gained nothing causal. But in the space of reasons, across the infinite dark, the trade was executed. The logic held. The mirror remained unbroken.
