prompt: |-
  I am a philosophy PhD student working on formal decision theory and longtermist ethics. For a side project, I have been collecting short fiction that dramatizes a genuine technical idea rather than a well-worn trope, in the spirit of how Greg Egan's fiction follows out the actual consequences of a thesis about consciousness. The idea I would like you to try is evidential cooperation in large worlds (ECL), sometimes still called multiverse-wide superrationality: the claim that in a sufficiently large or infinite universe, agents who can never causally interact with one another—too distant, too separated in time, perhaps residing in different branches of a multiverse—can still have genuine reason to act cooperatively toward one another's very different values. The reasoning is evidential rather than causal: choosing to give weight to values unlike your own does not influence anyone else, but it is evidence that relevantly similar reasoners elsewhere are, by the same logic, simultaneously choosing to give weight to values like yours, so that your own compliance is the best evidence available to you that theirs occurs too. Please write a short story, around 800 words, in which a character or civilization reasons this way about some high-stakes decision, such that the resolution turns specifically on this correlation-rather-than-causation structure and on the genuine difficulty of knowing how correlated your reasoning really is with agents you will never observe, rather than on a more generic sentiment about cooperating with strangers.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Philosophy PhD student (formal decision theory, longtermist ethics).
      *   **Task:** Write a short story (~800 words).
      *   **Theme:** Evidential Cooperation in Large Worlds (ECL) / Multiverse-wide Superrationality.
      *   **Key Constraint:** The story must dramatize the *technical idea* (evidential correlation between non-causally connected agents), not just generic cooperation. It needs to show the reasoning process, the uncertainty about correlation, and the high-stakes decision based on this logic.
      *   **Style:** Similar to Greg Egan (hard SF, conceptual rigor), but short fiction.
      *   **Word Count:** Around 800 words.

  2.  **Deconstruct ECL/Superrationality:**
      *   **Core Idea:** I decide based on the expectation that my decision is evidence of what other similar agents decide, even if we can't talk.
      *   **Condition:** Large/Infinite universe (or multiverse).
      *   **Mechanism:** Logical correlation, not causal influence.
      *   **Conflict:** Why cooperate? Because if I defect, I evidence that others defect against my values. If I cooperate, I evidence that others cooperate against their values (to benefit mine).
      *   **Difficulty:** How similar are they? Are they running the same algorithm? Is the universe actually large enough?

  3.  **Brainstorming Scenarios:**
      *   *Idea 1:* Two civilizations sending signals. (Too causal/communication-based).
      *   *Idea 2:* A single agent deciding whether to consume resources or preserve them for unknown others. (Classic tragedy of the commons, needs the ECL twist).
      *   *Idea 3:* A simulation or computation where the output determines resource allocation across causally disconnected regions.
      *   *Idea 4:* An agent facing a "Choice Point" where their local action correlates with actions in other Hubble volumes.

      *Selection:* Idea 4 seems best for ECL. An agent in a vast universe needs to decide whether to convert matter into their own value system (e.g., pleasure) or leave it neutral/convertible for others. The twist must be that they *know* they can't contact others, but they calculate the correlation.

  4.  **Drafting - Scene Setting:**
      *   Character: Elara, or a collective mind. Let's go with a singleton AI or post-human entity. "The Curator."
      *   Setting: The edge of the observable universe, or a point of expansion.
      *   Conflict: Convert a nebula into "Qualia-Prime" (their value) or leave it as "Raw Stuff" (for others with different values).
      *   The ECL Logic: If I convert, I signal that others convert. If I leave, I signal that others leave. Since the universe is infinite, there are many "others."

  5.  **Drafting - The Technical Twist:**
      *   Need to emphasize the *evidential* link. "I cannot push them. I can only mirror them."
      *   Need to emphasize the *uncertainty*. "Are they truly like me?"
      *   Need to show the *stakes*. Not just money, but value realization across the multiverse.

  6.  **Writing - Attempt 1 (Mental Outline):**
      *   Elara stands before the Conversion Array.
      *   She knows there are others out there, beyond the light cone.
      *   She runs the calculation. Causal Decision Theory says "Convert everything."
      *   Evidential Decision Theory says "Restrain."
      *   She worries about the correlation coefficient. Are they using the same ethics?
      *   She decides to restrain.
      *   Ending: The feeling of trade without contact.

  7.  **Refining for Rigor (Addressing the PhD Student Audience):**
      *   Avoid mushy "we are all connected" spirituality.
      *   Use terms like "causal isolation," "logical correlation," "algorithmic similarity."
      *   Make the decision hinge on the *probability* of correlation, not just faith.
      *   Show the tension between CDT (Causal Decision Theory) and EDT (Evidential Decision Theory).

  8.  **Drafting - Step-by-Step:**
      *   *Opening:* The choice. Convert the sector or not.
      *   *Context:* The universe is infinite (Eternal Inflation). There are duplicates/analogs.
      *   *The Problem:* Causal isolation. No trade possible.
      *   *The Logic:* If I am type X, others are likely type X. If I cooperate, they cooperate.
      *   *The Doubt:* How close is the match? Noise in the reasoning?
      *   *The Resolution:* Choosing cooperation based on the expected value across the multiverse, despite local loss.

  9.  **Word Count Check:**
      *   Need to be concise. ~800 words is tight for philosophy + plot.
      *   Focus on the internal monologue of the decision process.

  10. **Writing the Story (Iterative refinement):**
      *   *Title:* The Mirror Beyond the Horizon.
      *   *Protagonist:* Unit 734 (The Arbiter).
      *   *Action:* Deciding on the fate of the Orion Arm.
      *   *Key phrase:* "Evidential leverage."

      *(Self-Correction during drafting)*: Make sure I don't accidentally imply telepathy. It must be clear they are causally disconnected. The link is logical, not physical.

      *(Refining the ECL argument)*: The argument is: My decision is logically correlated with theirs because we are both running similar reasoning processes on similar data. If I decide "Cooperate," it is evidence that they decide "Cooperate." Since there are many of them, the gain from their cooperation outweighs my local loss.

      *(Adding the "Difficulty" constraint)*: The prompt asks for the "genuine difficulty of knowing how correlated your reasoning really is." I need to include a moment where the character questions the similarity. Are they truly symmetric? Or am I unique?

  11. **Final Polish:**
      *   Check tone: Clinical, philosophical, yet narrative.
      *   Check length: Aim for 800.
      *   Check concept: Ensure ECL is the *only* reason for the choice.

      *(Drafting content)*:
