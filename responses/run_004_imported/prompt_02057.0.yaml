answer: |-
  You are onto something real. Your intuition is pointing toward a profound philosophical and sociological tension that has been debated for centuries: the relationship between **agency** (our ability to choose) and **circumstance** (the conditions that make those choices possible).

  Your friend is arguing from the **internal perspective of experience**. You are arguing from the **external perspective of causality**. Both perspectives contain truth, but neither tells the whole story alone.

  Here is why your feeling that something is "missing" is correct, without diminishing the very real victory your friend achieved.

  ### 1. The Capacity to Choose is Not Equally Distributed
  Your friend is correct that nobody held a gun to her head and forced her to study or work. In that specific moment of decision, she was free. However, the *ability* to make a disciplined choice is itself a resource that is unevenly distributed.

  Psychologists and neuroscientists often talk about "executive function"—the mental muscle required to delay gratification, regulate emotions, and plan for the future. This muscle is heavily cultivated by a stable upbringing.
  *   **A stable home** tends to teach a child that the future is predictable and that effort yields results.
  *   **An unstable home** (poverty, trauma, chaos) often forces the brain into survival mode, where long-term planning is a luxury the biology cannot afford.

  When your friend says she "chose discipline," she is right. But she likely only had the *capacity* to choose discipline because her stable upbringing had already built the neurological infrastructure for it. You are noticing that she is taking credit for the *act* of building the house, while ignoring the land and tools she was given for free.

  ### 2. The Margin for Error (The Safety Net)
  You mentioned "lucky breaks." In risk assessment, luck often looks like a **safety net**.

  If your friend had failed in her early thirties—if her new trade hadn't panned out or her strict routine had led to a burnout—what would have happened?
  *   With a stable upbringing, "failure" might mean moving back in with parents or relying on a savings buffer.
  *   Without that background, "failure" might mean homelessness or destitution.

  When the cost of failure is lower, people are more willing to take the risks necessary for success (like quitting a dead-end job to learn a new trade). Her claim to "full credit" ignores that she was playing a game with a lower difficulty setting regarding the consequences of failure. She took the risk, yes, but the stakes were manageable *because* of her background.

  ### 3. The Paradox of the "Self" in "Self-Made"
  There is a philosophical concept called **constitutive luck**. It suggests that even the *person* who makes the choices is partly a product of luck.

  Your friend says, "I chose to become a different person." But where did the desire to change come from? Where did the confidence that she *could* change come from?
  *   If she had grown up being told she was worthless, she might not have believed change was possible.
  *   If she had grown up with no role models of success, she might not have known what a "career" looked like.

  She is claiming credit for the *architect* of her life, but she is ignoring the fact that her background supplied the *blueprints* and the *materials*. To claim "full credit" implies she created herself out of nothing, which is impossible. We all stand on the shoulders of prior advantages, whether genetic, environmental, or social.

  ### 4. Why She Needs to Believe It (And Why You Do Too)
  Despite the logical gaps in her argument, her belief is psychologically functional.
  *   **For her:** Believing she is 100% responsible is empowering. It reinforces the behavior that got her success. If she admits luck played a part, she might fear that luck could run out. Claiming total ownership creates a sense of control.
  *   **For you:** Recognizing the role of luck creates empathy. It prevents you from judging those who *didn't* pull themselves up as harshly as she might. It keeps you humble about your own successes.

  ### The Verdict
  You are right that her claim to **full** credit is factually incomplete. She did not generate the capacity for discipline, the safety to risk failure, or the opportunities she seized entirely on her own. Those were gifts of circumstance.

  However, she is right that the **effort** was hers. Luck may have dealt the hand, but she played it. Many people with stable upbringings and lucky breaks still drift through life without making the hard choices she made. That specific expenditure of will is hers alone.

  **The Synthesis:**
  The most accurate way to view it is this: **She deserves full credit for her effort, but partial credit for her success.**

  *   **Effort:** The pain of the routine, the studying, the breaking of habits. That is 100% her.
  *   **Success:** The outcome. That is a collaboration between her effort and her circumstances.

  You were sensing that she was conflating the two. She feels that because the *effort* was hers, the *outcome* must be solely hers. But the harvest depends on both the farming and the rain. She can be proud of the farming without denying it rained.

  In the future, you might tell her: *"You're right that nobody made the choices for you. That is your triumph. But don't forget that your background gave you the strength to make them. You built the house, but you didn't quarry the stone."* That honors her work without erasing the reality you both live in.
