      *   **The Friend:** Spent 20s adrift, overhauled life in early 30s (routine, new trade, cut bad habits). Successful, proud, calls herself "self-made." Claims full credit because *she* made the daily choices, regardless of upbringing or luck.
      *   **The Narrator (User):** Acknowledges the friend's agency (nobody forced her), but feels the claim to *full* credit ignores stable upbringing and lucky breaks. Feels something is missing in the friend's logic.
      *   **The Core Conflict:** Agency/Responsibility vs. Context/Privilege. Is the *act* of choosing discipline enough to claim total credit, or does the *capacity* to choose depend on external factors?
      *   **The Question:** Was the narrator onto something real, or is the friend right that choosing day-to-day is equivalent to innate discipline in terms of credit?

  2.  **Deconstruct the Philosophical Arguments:**
      *   **The Friend's Position (Libertarian/Existentialist Agency):**
