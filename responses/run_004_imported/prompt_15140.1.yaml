answer: |-
  **The Covenant or the Charter: Frederick Douglass and the Jurisprudence of Emancipation**

  In the pantheon of American abolitionists, few intellectual journeys are as dramatic as that of Frederick Douglass. For nearly a decade, Douglass stood alongside William Lloyd Garrison, denouncing the United States Constitution as a pro-slavery compact that no moral person could support. Then, in the early 1850s, he executed a profound reversal, declaring the Constitution a "GLORIOUS LIBERTY DOCUMENT" that provided the legal machinery for slavery's destruction. To the casual observer, this looks like political expediency—a shift from moral suasion to political action. But to treat this merely as a tactical pivot is to miss the depth of the jurisprudential debate at hand. This was not simply a change of heart; it was a clash between two competing theories of how a legal text derives its meaning. While the Garrisonian view captured the grim political reality of 1787, Douglass's later position offers the superior theory of constitutional law. Douglass was right: a constitution must be interpreted by its text and its moral principles, not by the secret compromises of its framers, because the legitimacy of law depends on its capacity for justice rather than its historical sins.

  To understand the weight of Douglass's reversal, one must first appreciate the strength of the position he abandoned. The Garrisonian argument, articulated fiercely by William Lloyd Garrison and Wendell Phillips, was rooted in a realist assessment of the Constitutional Convention of 1787. They argued that the Constitution was a contract among the states, and like any contract, it had to be understood in the context of the agreement reached by the parties. That agreement, they contended, was explicitly designed to protect the institution of slavery.

  The Garrisonians pointed to the specific architecture of the document. Article I, Section 2, the Three-Fifths Clause, increased the political representation of slaveholding states in Congress and the Electoral College, effectively giving the "Slave Power" a veto over federal policy. Article I, Section 9, prevented Congress from banning the importation of enslaved people for twenty years. Article IV, Section 2, the Fugitive Slave Clause, mandated that persons "held to Service or Labour" escaping to free states must be returned. Finally, Article I, Section 8, empowered the federal government to call out the militia to suppress "Insurrections," which included slave rebellions.

  For Garrison, the euphemistic language—"persons held to service" rather than "slaves"—was not a denial of slavery but a cowardly concealment of it. He famously called the document "a covenant with death, and an agreement with hell." The Garrisonian interpretive method was one of *original intent*: What did the framers mean to achieve? They meant to preserve the Union by accommodating slavery. Therefore, the federal government was structurally complicit. The moral conclusion was inescapable: if the Constitution protects slavery, then the Constitution is immoral. The only righteous path was "No Union with Slaveholders," advocating for Northern secession to wash hands of the sin. This was a historically honest reading. It acknowledged that the United States was founded as a biracial republic where white liberty was purchased at the price of black bondage.

  When Douglass broke with Garrison, he did not deny these historical facts. Instead, he adopted a different interpretive framework, heavily influenced by the legal theories of Gerrit Smith and Lysander Spooner. This was the argument for the Constitution as an antislavery charter. Douglass's new position rested on three pillars: textualism, the presumption of liberty, and federalism.

  First, Douglass argued for strict textualism. Nowhere, he noted, does the Constitution use the words "slave," "slavery," or "negro." It speaks of "persons." In a court of law, Douglass argued, you cannot enforce a property right in a human being without explicit statutory language granting that power. Since the text did not explicitly sanction slavery, the federal government had no delegated authority to uphold it. Second, he invoked the presumption of liberty. Drawing on natural law, Douglass argued that in the absence of explicit words enslaving a person, the default status of any human being under the law must be freedom. The burden of proof lay on the enslaver to show where the law authorized the bondage; since the text was silent, the presumption of liberty stood. Third, Douglass reinterpreted the federal structure. He argued that while states might have local laws regarding slavery, the federal Constitution's Preamble pledged to "secure the Blessings of Liberty." This gave the federal government the power, and indeed the duty, to prevent the expansion of slavery and ultimately legislate its end in the territories.

  For Douglass, the Constitution was not a snapshot of 1787 prejudices but a framework for a "more perfect Union." To bind the document to the racist intentions of the framers was to allow the dead to rule the living. By reading the Constitution as an antislavery document, abolitionists could seize the levers of political power rather than standing outside them in moral purity.

  So, who was right? Was the Constitution a pro-slavery compromise or an antislavery promise? To settle this, we must distinguish between the Constitution as a historical artifact and the Constitution as a source of legal authority.

  On the question of historical description, Garrison was correct. The framers *did* compromise with slavery. They *did* intend to protect the institution to secure Southern ratification. If the question is, "What was in the minds of the men at Philadelphia?" the Garrisonian view wins. However, the question for a citizen, a lawyer, or an abolitionist is not merely historical; it is jurisprudential. It is: "What authority does this text command?" On this question, Douglass is the victor.

  Douglass's reading is the legally correct one because a constitutional government is one of limited, delegated powers. In such a system, the government can only do what the text explicitly allows it to do. Nowhere does the text explicitly grant the federal government the power to establish or maintain human chattel slavery. The clauses Garrison cited were regulatory compromises, not grants of moral authority. The Three-Fifths Clause regulated representation; it did not define humanity. The Fugitive Slave Clause regulated interstate relations; it did not define property rights in humans as a universal federal principle. By insisting that the silence of the text regarding the word "slave" was legally decisive, Douglass identified a crucial mechanism of the rule of law: if the law does not speak clearly to deprive a person of liberty, liberty remains.

  Furthermore, Douglass's view is superior because it accounts for the *legitimacy* of the legal order. A constitution that is permanently bound by the immoral intentions of its drafters loses its moral claim on future generations. If we accept Garrison's view that the Constitution is irredeemably pro-slavery because of the intent of 1787, we must conclude that the American legal system had no internal capacity for self-correction. We would be forced to view the Thirteenth, Fourteenth, and Fifteenth Amendments not as the fulfillment of the Constitution, but as a revolution against it. Douglass, conversely, provided the bridge. He showed that the text contained the seeds of its own redemption. He was right because he recognized that the authority of a constitution lies not in the past intentions of its authors, but in the present principles of its text. The Preamble's promise to "secure the Blessings of Liberty" is a command to the present, not a record of the past. When the text's principles conflict with the framers' practices, the principles must prevail, or the law becomes mere tyranny.

  This dispute offers a vital lesson for how we ought to interpret legal texts when the framers' intentions clash with defensible moral principles. It suggests that we should reject a rigid "original intent" originalism when that intent codifies injustice. Law is not archaeology; we are not digging up fossils to see what the dead believed. Law is architecture; we are inhabiting a structure built to serve justice.

  When interpreting a foundational text, the "original public meaning" of the words matters more than the private hopes of the writers. If the words "We the People" and "Liberty" were written, they carry a moral weight that transcends the fact that "the People" in 1787 excluded women and enslaved men. To interpret the Constitution faithfully is to interpret it in light of its highest aspirations, not its lowest compromises. This does not mean ignoring history, as Douglass never did. It means recognizing that a legal text, once ratified, takes on a life of its own. It becomes a public trust. If the text allows for a moral reading—a reading that expands liberty rather than constricting it—that reading is not only permissible; it is obligatory.

  Frederick Douglass's journey from the "covenant with death" to the "glorious liberty document" was not a betrayal of his earlier principles, but a maturation of his legal philosophy. He realized that to reject the Constitution was to cede the power of the state to the slaveholders. By reclaiming the text, he forced the nation to confront the gap between its laws and its practices. In the end, the Civil War and the Reconstruction Amendments vindicated Douglass's constitutional vision. They proved that the text could bear the weight of universal freedom, provided there were citizens brave enough to read it not as the framers did, but as the principle of liberty requires. The Constitution was not a pro-slavery document because the law cannot legitimately speak the language of bondage without naming it. In the silence of the text, Douglass heard the call of freedom, and in doing so, he taught us that the true meaning of a law is found not in the hearts of those who wrote it, but in the justice of those who live under it.
