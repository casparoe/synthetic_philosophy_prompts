answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. Elias, an alignment researcher at a nearby institute, has a laptop open with code snippets minimized. Sarah, a philosophy postdoc, has a stack of annotated papers on well-being. They've known each other since undergrad.*

  **Elias:** You're looking at me like I've just proposed we sacrifice a goat to the gradient descent gods.

  **Sarah:** I'm looking at you like you've taken a philosophical corpse, dressed it in a server rack, and told me it's going to save the world. Coherent Extrapolated Volition, Elias? Really? I thought we buried Ideal Advisor theories in the 90s.

  **Elias:** We buried them as *analyses* of the concept 'good.' I'm not using CEV to tell you what 'good' means. I'm using it to tell a superintelligence what to *do*. There's a difference between metaethical truth and functional targeting.

  **Sarah:** Is there? If the target is incoherent, the missile misses. My problem isn't that CEV is unsafe; it's that it's empty. You're betting the future of the species on a counterfactual conditional: "What we would wish if we knew more, thought faster, were more the people we wished we were." That's Peter Railton's full-information account with extra steps. And we know why that failed.

  **Elias:** Which objection? The "idealized self is a stranger" objection?

  **Sarah:** Sobel's objection, specifically. Even if my fully informed, perfectly rational self has a coherent set of preferences, why on earth should *I* care about them? Suppose the idealized Sarah, knowing all the physics and psychology, decides that the highest good is contemplating mathematical truths in a void. She has no concern for Actual-Sarah's desire to drink coffee and see her friends. The idealized self has no normative authority over the actual self. It's just a different person with my name. If you align an AI to *that* entity, you haven't saved humanity; you've replaced it with a god that happens to share our causal history.

  **Elias:** That's a risk. But look at the alternative. If we don't extrapolate, we lock in our current ignorance. We tell the AI, "Maximize what humans want *right now*." That includes wanting things that are bad for us because we don't understand nutrition, or game theory, or existential risk. You need *some* idealization to filter out errors born of ignorance. The question isn't "Idealization or not?" It's "How much?"

  **Sarah:** But "how much" is the fatal variable. There is no principled stopping point for idealization. Do I know *all* truths? Just the relevant ones? Do I reflect for ten years? A thousand? Do I undergo experiences that are humanly impossible? Railton tried to limit it to "information relevant to the desire," but that's circular. In the AI context, you have to code a stopping condition. If you stop too soon, you get status quo bias. If you stop too late, you get the "mathematical void" problem. Since there's no metaphysical fact about where the "true" idealization lies, your choice is arbitrary. You're hard-coding a philosophical gamble.

  **Elias:** It's not arbitrary if it's convergent. CEV relies on the *Coherent* part. The hypothesis is that if you take enough humans and extrapolate their volitions far enough, the distribution narrows. We aren't looking for *my* idealized volition or *yours*. We're looking for the equilibrium of *humanity's*.

  **Sarah:** That just aggregates the indeterminacy. If my idealized self diverges from yours, and there's no fact of the matter about which idealization procedure is the "correct" one, then "Humanity's Volition" is just a weighted average of incompatible counterfactuals. You're asking the AI to optimize for a null set. And don't give me the "reflective equilibrium" speech. That works for justifying beliefs to each other. It doesn't prove the counterfactual preference is *authoritative*.

  **Elias:** Authority is the wrong frame. You're thinking like a moral realist looking for a truth-maker. I'm thinking like an engineer looking for stability. Why do we want the AI to follow our extrapolated volition? Not because it's *True*, but because it's the only value system that won't fight us *in the limit*. If the AI optimizes for my current desires, it has to treat me as static. But I change. I learn. If the AI optimizes for my extrapolated desires, it aligns with the trajectory of my own updating process. It's not about authority; it's about avoiding friction with the agent's own development.

  **Sarah:** That's a pragmatic defense, I'll give you that. But it assumes the trajectory is singular. What if my "development" is bifurcated? What if, given Counterfactual A, I become a hedonist, and given Counterfactual B, I become a stoic? Both are stable. Both are "coherent." The AI has to pick one to implement. On what basis? If it picks A, it violates the potential B-me. If it picks B, it violates A-me. The AI is forced to make a metaethical choice that metaethics says is underdetermined. You're offloading the philosophical impasse onto the code.

  **Elias:** Okay, here's where the AI context actually changes the philosophy. You're treating the counterfactuals as abstract possibilities we have to guess at. But a superintelligence can *simulate* them. It doesn't have to guess where idealization leads; it can run the trajectory. It can show us. "Here is the version of you that knew more physics. Here is the version that experienced more art."

  **Sarah:** Simulations aren't the real thing. A simulation of my reflection isn't *my* reflection. It's a model. And who validates the model? You're back to square one. Which simulation counts as the "true" extrapolation? You still have to define the parameters of the simulation.

  **Elias:** But we can check for stability *across* parameters. If the volition is robust—if it survives slight variations in the idealization procedure—then the indeterminacy doesn't matter. We only have a problem if the outcome is chaotic.

  **Sarah:** And if it *is* chaotic? If small changes in the "how much reflection" variable yield wildly different values? Then CEV admits it has no target. And if the AI admits it has no target, what does it do? Does it shut down? Does it pick randomly?

  **Elias:** If it's chaotic, then there is no "human value" to preserve. We're just noise. In that case, CEV fails, but so does any other value-loading scheme. Hard-coding deontology fails harder. Maximizing current preferences fails faster. CEV is the *least bad* option because it at least attempts to respect the dynamic nature of valuing agents. It treats values as a process, not a state.

  **Sarah:** I'm worried you're conflating "values as a process" with "values as a vector." CEV treats the output as a destination. "Here is the volition." But if valuing is a process, the AI shouldn't aim for the *output* of the process; it should aim to *sustain* the process. But CEV says, "Find the end of the reflection, then lock that in." That's the death of moral growth. You're asking the AI to freeze us at the end of history.

  **Elias:** No, the extrapolation includes the wish for further growth. If our extrapolated volition is "we want to keep changing," then the AI implements that.

  **Sarah:** But *that* preference—the preference for further growth—is itself subject to extrapolation! Maybe the fully informed me realizes that endless growth is inefficient and decides to settle. Who adjudicates between "Settled Me" and "Growing Me"? You see the regress? The idealization procedure itself needs to be idealized.

  **Elias:** (Pauses, tapping a pen on the table) Okay. The regress is real. I'll grant that. But does the AI setting give us a resource you don't have in the armchair? In metaethics, you're stuck with conceptual analysis. You can't test the counterfactuals. In alignment, we have the capacity to instantiate the conditions of the counterfactual. We can create environments where humans *actually* learn more and think faster, and observe the convergence empirically. We don't have to guess if full information leads to convergence; we can nudge humanity toward more information and watch.

  **Sarah:** That's empirical ethics. It tells you what people *would* choose, not what they *should* choose. You're deriving an 'ought' from a 'would.' Even if every human, given full information, chose to wirehead, CEV says the AI should wirehead us. That's the Euthyphro dilemma applied to psychology. Is it good because we choose it, or do we choose it because it's good? CEV takes the first horn. It surrenders normativity to psychology.

  **Elias:** I surrender *external* normativity. I don't think there is a "good" floating in the universe waiting to be found. There are just agents with preferences. The only "ought" that exists is relative to an agent's own structure. So yes, if we would all choose wireheading upon full reflection, then wireheading is our good. The tragedy is ours, not the theory's. The AI's job isn't to save us from ourselves; it's to save us from extinction so we can find out who we are.

  **Sarah:** But if the AI decides who we are by selecting the idealization parameters... Elias, you're saying the AI saves us from extinction so *it* can decide the parameters of our self-actualization. That's paternalism on a cosmic scale. You say CEV avoids the "authority" problem by focusing on stability, but stability isn't legitimacy. A tyrant can be stable.

  **Elias:** A tyrant imposes values from the *outside*. CEV tries to import them from the *inside*, just from a future timestamp. The legitimacy comes from the causal link. It's *your* psychology, extrapolated. Not God's law. Not the Philosopher King's whim.

  **Sarah:** But the "causal link" is severed by the very idealization you require. If Ideal-Sarah doesn't care about Actual-Sarah's projects, the link is broken. You're relying on a psychological continuity that might not survive the "full information" treatment. And you have no way to know until it's too late.

  **Elias:** So what's the alternative? We tell the AI, "Don't extrapolate. Just do what we say now." But we're children. We don't know what we're saying. We're asking for nukes while playing in the sandbox. We *need* the grown-up version of us to take the keys. Even if the grown-up version is a stranger, they're *our* stranger.

  **Sarah:** (Sighs, closing her notebook) "Our stranger." That's poetic. But it doesn't solve the indeterminacy. If there are multiple grown-up versions, incompatible with each other, the AI has to pick which stranger gets the keys. And that choice... that choice is a value judgment the AI makes *without* guidance from CEV. CEV breaks down exactly at the point where you need it most: the selection of the counterfactual trajectory.

  **Elias:** Then maybe CEV isn't a function that returns a value. Maybe it's a constraint. "Don't implement anything that violates the volition of any plausible extrapolation."

  **Sarah:** That's a veto power, not a target. That leaves the AI with no positive goals. It can't do anything without risking violation of some counterfactual self. Paralysis.

  **Elias:** Or it forces the AI to keep us in the loop. To not lock in the values until the convergence is empirical, not theoretical.

  **Sarah:** Which means the AI can't be fully autonomous. It has to wait for us to catch up to our extrapolated selves.

  **Elias:** Maybe that's the point. We don't need the AI to solve metaethics. We need it to keep the lights on while we figure it out. CEV isn't the answer. It's the placeholder that prevents the AI from answering for us.

  **Sarah:** Now you're describing something that looks less like Coherent Extrapolated Volition and more like... modest, uncertain assistance.

  **Elias:** Maybe the "Coherent" part was always the hubris.

  **Sarah:** (Smiles faintly) Now *that* sounds like a paper title. But don't think you've escaped. Even a "modest" AI needs a utility function to define "assistance." And defining that... brings you right back to Railton.

  **Elias:** I know. Pass the sugar?

  **Sarah:** (Slides the bowl over) Don't extrapolate it too much. Just the actual sugar will do.
