answer: |-
  A senior engineer is reviewing a junior's code for a new `RationalAgent` class.

  **Senior:** "I see the agent got money-pumped today. It traded A for B, B for C, and C for A. Lost $30 in fees and ended up with A."

  **Junior:** "Yeah, it has cyclic preferences. But every trade was locally optimal at the time."

  **Senior:** "Why didn't you implement Resolute Choice? Have it commit to a plan at T0 and stick to it."

  **Junior:** "I tried. But at T1, the agent recalculates expected utility and realizes that breaking the plan yields higher utility than honoring it."

  **Senior:** "So it ignores the plan?"

  **Junior:** "Obviously. It's an Expected Utility Maximizer. It can't maximize utility by intentionally choosing a lower-utility option just because Past Self wrote it in a text file."

  **Senior:** "So Resolute Choice is incompatible with rational agency?"

  **Junior:** "Only if the agent controls the ropes. Resolute Choice requires you to value 'Consistency' higher than 'Outcomes.' Our utility function is outcome-based."

  **Senior:** "So how do we fix the pump?"

  **Junior:** "Two options. One: Fix the cyclic preferences. Two: Remove the agent's ability to choose at T1."

  **Senior:** "If we remove the choice, it's not an agent. It's a script."

  **Junior:** "Exactly. Scripts don't get money-pumped."

  **Senior:** "Fine. Convert it to a script."

  **Junior:** "I can't. The spec says it needs to exhibit autonomous preference reversal."

  **Senior:** "So you want a script that thinks it's an agent?"

  **Junior:** "No, I want an agent that's too resolute to be rational, but too rational to be resolute."

  **Senior:** "Sounds like you're trying to debug philosophy with code."

  **Junior:** "No, I'm just trying to stop losing money to a bartender with a transitivity violation."

  **Senior:** "Well, hurry up. Until then, don't let it near a wallet."

  **Junior:** "Too late. It just traded its salary for a promise to be more rational tomorrow."
