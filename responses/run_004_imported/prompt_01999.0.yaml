      *   *Chalmers' role:* Chalmers is actually a bit distinct from Hirsch. Chalmers thinks *some* ontological disputes are substantive (e.g., nihilism vs. universalism might be verbal, but not all). But for the purpose of the user's essay, linking Chalmers to the *method* (taboo/elimination) is correct.
      *   *Hirsch's Charity:* Hirsch relies heavily on charity to ordinary language. Yudkowsky is willing to discard ordinary language if it's low-fidelity (e.g., "sound" as vibration vs. experience). So Yudkowsky isn't perfectly Hirschian either. He's more revisionist.

