      *   *Section 4: The Bookie's Strategy (Contingency).* The Bookie needs to know what evidence will arrive to set the odds. If the Bookie's bets depend on $E$, the agent must know this *ex ante* to see the sure loss. This requires a "strategy" commitment, not just single bet acceptance.
      *   *Section 5: Memory and Forgetfulness.* If I forget the first bet, I don't see the book. (Mention Arntzenius or Christensen).
