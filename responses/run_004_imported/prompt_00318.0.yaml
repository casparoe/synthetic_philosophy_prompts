      *   *Crucial distinction:* In synchronic, the inconsistency is in the *odds*. In diachronic, the inconsistency is in the *update rule*.
      *   *The "Shakiness":* It relies on the assumption that the agent maximizes expected utility over the *entire timeline* as a single unit, rather than maximizing at each node (which might lead to dynamic inconsistency, like in Newcomb or Prisoner's Dilemma contexts).

