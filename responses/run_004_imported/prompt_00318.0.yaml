answer: |-
  You are absolutely right to feel that the diachronic argument is doing more heavy lifting than the synchronic one, and your student was correct to press you on the "time is involved" hand-wave. The structural disanalogy is profound, and it turns on issues of **agency, commitment, and the ontology of the "sure loss."**

  In the literature, this distinction is often marked by calling the synchronic case a **Dutch Book** and the diachronic case a **Dutch Strategy**. That terminological shift isn't just pedantry; it signals the structural weakness you're sensing.

  Here is a breakdown of the specific structural disanalogies you can use in your seminar, moving from the economic mechanics to the philosophical assumptions.

  ### 1. The Locus of Acceptance (The "Package" Problem)

  **Synchronic (Probabilism):**
  At time $t_1$, the Bookie offers a set of bets $\{B_1, B_2, \dots B_n\}$. The agent evaluates the *entire package* simultaneously based on a single credence function $P_1$.
  *   **The Strength:** The agent accepts the *conjunction* of bets at a single decision node. The guaranteed loss is calculable *ex ante* at the moment of acceptance. The inconsistency is static: the odds themselves contradict each other logically.

  **Diachronic (Conditionalization):**
  At $t_1$, the Bookie offers Bet $A$. At $t_2$ (after evidence $E$), the Bookie offers Bet $B$.
  *   **The Weakness:** The agent never stands at a single decision node where they accept the *combined* package $\{A, B\}$. At $t_1$, they accept $A$. At $t_2$, they accept $B$.
  *   **The Problem:** To call this a "Dutch Book," we must assume the agent cares about the sum of losses across time slices. This requires the **Package Principle**: the assumption that utility is additive across time and that the agent at $t_2$ identifies their welfare with the agent at $t_1$.
  *   **Why it's contested:** If I am a "time-slice" agent (as some decision theorists argue), the loss at $t_1$ is a sunk cost. The agent at $t_2$ makes a decision that is locally rational at $t_2$, even if it contributes to a global loss. The diachronic argument smuggles in the assumption that the agent is a **persisting entity** with a unified utility function over time, whereas the synchronic argument only requires the agent to be consistent at an instant.

  ### 2. The Bookie's Knowledge (The Strategy vs. Book)

  **Synchronic:**
  The Bookie only needs to know the agent's current credences. The Bookie does not need to know anything about the world, only the agent's mind. The bets are offered *categorically*.

  **Diachronic:**
  For the Dutch Strategy to work, the Bookie must know **which evidence the agent will receive** to know which bet to offer at $t_2$.
  *   **The Weakness:** This implies the Bookie has access to the agent's future evidence schedule.
  *   **The Foreknowledge Objection:** As you noted, for the agent to be "pumped," they must recognize the strategy *in advance*. The agent must know at $t_1$: "If $E$ happens, Bookie will offer me Bet $B$."
  *   **Why it's contested:** If the agent doesn't know the Bookie's strategy at $t_1$, they don't see a sure loss at $t_1$. They just see a fair bet. Then at $t_2$, they see another fair bet. They only see the loss in hindsight. A rationality constraint shouldn't rely on the agent having foreknowledge of a hostile Bookie's strategy. This makes the argument depend on **epistemic conditions about the environment** (knowing the Bookie's plan) rather than just **internal coherence**.

  ### 3. Memory and Identity (The Hacking/van Fraassen Objection)

  This is the most "in the weeds" philosophical objection, stemming from Ian Hacking and Bas van Fraassen.

  **Synchronic:**
  Memory is irrelevant. Everything happens at once.

  **Diachronic:**
  For the losses to add up, the agent at $t_2$ must **remember** the bet made at $t_1$ and care about its outcome.
  *   **The Weakness:** If the agent suffers memory loss (even partial) regarding the betting schedule, the "sure loss" evaporates from their perspective.
  *   **Why it's contested:** Hacking argued that if an agent forgets they made the first bet, they aren't irrational for making the second bet. This suggests the Dutch Strategy argument actually proves a **Memory Principle**, not just Conditionalization. It conflates *updating* with *remembering*. If I conditionalize correctly but forget my earlier bets, I get Dutch Booked. Therefore, the argument fails to isolate conditionalization as the sole norm.

  ### 4. The Nature of the "Sure Loss" (Logical vs. Causal)

  **Synchronic:**
  The loss is **logically guaranteed** by the truth tables. Given the propositions are true/false, the math ensures a loss. It is a contradiction in terms.

  **Diachronic:**
  The loss is **causally guaranteed** by the Bookie's intervention.
  *   **The Weakness:** The loss depends on the Bookie actually *offering* the second bet. If the Bookie goes home for lunch at $t_2$, there is no Dutch Book.
  *   **Why it's contested:** In the synchronic case, the inconsistency exists even if no Bookie is present (the credences themselves are incoherent). In the diachronic case, the "incoherence" is only exploitable if an external agent intervenes at the right moment with the right counter-bet. This makes the irrationality **extrinsic** (vulnerability to others) rather than **intrinsic** (logical inconsistency).

  ### 5. Dynamic Inconsistency vs. Static Inconsistency

  To really drive the point home to your students, you can frame it using decision theory terms:

  *   **Synchronic DBA** targets **Static Inconsistency**. It shows the agent's preferences violate the axioms of probability at a single node. It's like having $A \succ B$ and $B \succ A$ simultaneously.
  *   **Diachronic DBA** targets **Dynamic Inconsistency**. It shows the agent's plan at $t_1$ is not carried out at $t_2$.
      *   However, dynamic inconsistency is not always irrational. In some decision problems (like certain Newcomb-like cases or Prisoner's Dilemmas with pre-commitment), a rational agent might *want* to bind their future self but fail to do so.
      *   The Diachronic DBA assumes that **planning consistency** is a requirement of rationality. But many philosophers argue that rationality is about making the best decision *given your current information at the time of action*. If my credences change because I got new evidence, why should my past self's betting odds bind me? The DBA assumes they should, but that is a substantive normative claim, not a logical truth.

  ### Summary for your Lecture

  If you want to move beyond "time is involved," tell your students the diachronic argument is weaker because it relies on three extra assumptions that the synchronic argument does not:

  1.  **The Intertemporal Package Principle:** That losses at $t_1$ and $t_2$ are additive for the agent (ignoring discounting and psychological separation of time-slices).
  2.  **Strategic Transparency:** That the agent knows the Bookie's future strategy in advance to recognize the "sure loss" ex ante.
  3.  **Perfect Memory:** That the agent retains access to the terms of the $t_1$ bet at $t_2$ to calculate the cumulative loss.

  The synchronic argument shows that incoherent credences are **logically contradictory**. The diachronic argument shows that non-conditionalizing agents are **economically vulnerable under specific conditions of memory and bookie knowledge**. The former is a proof of inconsistency; the latter is a proof of exploitability. And as the literature (e.g., Christensen, Maher) suggests, **exploitability does not always entail irrationality** (e.g., if the exploitability relies on external factors like a malicious Bookie's schedule).

  This distinction validates your intuition: the diachronic argument isn't just the synchronic argument "stretched" over time; it's a fundamentally different kind of normative claim that requires much more contentious scaffolding to hold up.
