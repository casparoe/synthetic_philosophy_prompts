      *   *Thomson's Argument:* It can't be on (because it was turned off after every on), and it can't be off (because it was turned on after every off). Therefore, contradiction. Therefore, supertasks are impossible.
      *   *Professor's Counter:* There is no contradiction in the *process*. The problem is asking for a state *after* the series that isn't determined by the series. The state is "undefined," not logically impossible. The impossibility lies in the expectation of a determined value, not the task itself.

