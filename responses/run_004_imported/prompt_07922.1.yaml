          *   *Effect:* Favors hypotheses with more *total* observers. Counters Doomsday (Long Future has more people, so I'm more likely to exist there). Leads to Presumptuous Philosopher (believe the theory with $10^{100}$ people over $10^{10}$ people without evidence).
          *   *Reference Class:* Less sensitive? SIA cares about "observers like me." If the reference class changes, it changes for both, but SSA breaks more easily because it relies on *proportions* within the class.
