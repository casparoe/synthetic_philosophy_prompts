          *   *Why:* Sleeping Beauty is about "centered worlds" (time + location). SSA/SIA are often framed as "uncentered" (which hypothesis is true).
          *   *Connection:* Thirders treat each awakening as a distinct "observer moment" (SIA-style counting). Halfers treat the coin toss as the primary event and awakenings as non-informative (SSA-style sampling from the coin outcome).
          *   *Verdict:* It's a useful heuristic, not an identity. One can be a Thirder without accepting full SIA (e.g., using the "halfer" SSA but defining the reference class as "awakenings"). But generally, the intuition pumps are the same.
          *   *Correction:* Actually, standard SSA *can* yield Thirding if the reference class is "awakenings." Standard SIA yields Thirding. Halving usually requires a specific "SSA + Coin-centric" view or "Double Halfer" position. So the friend is *roughly* right, but it's not a strict logical equivalence. It's better to say they share the *same intuition* about self-locating belief.

