answer: |-
  This is an excellent question that cuts to the heart of the disagreement between Causal Decision Theory (CDT) and the newer frameworks like Timeless Decision Theory (TDT) or Functional Decision Theory (FDT). Your intuition is perfectly sound *within the standard CDT framework*, which is likely why your advisor dismissed the objection as a "confusion"—from the perspective of acausal trade proponents, the confusion lies in insisting that causal influence is a necessary condition for rational cooperation.

  To answer your specific questions directly:
  1.  **Do proponents posit hidden causal mechanisms?** No. There is no retrocausality, no wormholes, and no subtle physical signaling.
  2.  **Is "trade" a technical redefinition?** Yes. It is a claim about *logical* or *subjunctive* dependence rather than causal dependence.
  3.  **What makes it trade rather than coincidence?** The robustness of the counterfactual: "If I had chosen otherwise, they would have chosen otherwise."

  Here is a careful breakdown of the decision-theoretic machinery that proponents use to justify this terminology.

  ### 1. The Category Error: Causal vs. Logical Dependence

  Your objection rests on a premise standard in classical decision theory: for my action $A$ to be rational, it must causally influence the outcome $O$. If $A$ and $O$ are in causally disconnected regions of spacetime, $P(O | do(A)) = P(O)$. Therefore, CDT says your action is irrelevant to their outcome.

  Proponents of acausal trade (Yudkowsky, Oesterheld, Soares, etc.) argue that this ignores **logical dependence**.

  In this framework, an agent is not viewed primarily as a physical object emitting signals, but as an **instantiation of an abstract algorithm**. If Agent A (in Universe 1) and Agent B (in Universe 2) are running sufficiently similar decision algorithms, their outputs are logically correlated, even if their physical substrates are causally isolated.

  *   **Causal Dependence:** $A$'s physical state pushes $B$'s physical state via a light cone.
  *   **Logical Dependence:** $A$'s algorithm and $B$'s algorithm share a logical structure. If the abstract computation $f(x)$ outputs "Cooperate" in one instance, it must output "Cooperate" in all instances where the inputs and code are identical.

  When you choose to cooperate, you are not sending a signal. You are **computing a logical fact**. If the other agent is simulating you (or reasoning about you) accurately, they are computing the same logical fact.

  ### 2. Subjunctive Dependence and the Counterfactual

  You asked: *"Aren't we just describing two agents independently doing what they would have done anyway?"*

  In CDT, yes. In FDT/TDT, no. The distinction lies in the **counterfactual**.

  *   **Coincidence:** I cooperate. You cooperate. But if I *had* defected, you would *still* have cooperated (because there is no link between us).
  *   **Acausal Trade:** I cooperate. You cooperate. And if I *had* defected, you *would have* defected.

  This "would have" is not a causal propensity; it is a **subjunctive dependence**. It relies on the idea that your decision procedure is a logical function. When you deliberate, you are effectively asking: "What is the output of the function `DecisionAlgorithm(Inputs)`?"

  If the other agent is rational and models you correctly, their decision procedure includes a simulation of your decision procedure. Therefore, your actual decision and their simulation of your decision are logically linked. By choosing to cooperate, you ensure that the simulation inside their head outputs "Cooperate," which causes *their* actual decision to be "Cooperate."

  Thus, the "trade" is robust across counterfactuals. It is not a coincidence that both cooperate; it is a logical necessity given the similarity of the agents and the rationality of the decision theory.

  ### 3. What is Being "Traded"?

  Since no physical goods cross the causal boundary, what is the *quid pro quo*?

  Proponents argue that what is being traded is **measure** or **probability mass across the multiverse**.

  Imagine you value the welfare of agents in other Everett branches or inflationary bubbles (perhaps due to a cosmopolitan utility function). You cannot causally help them. However, you can reason that there are agents in those branches who value *your* welfare.
  *   If you defect, you gain local utility, but you logically determine that counterparts in other branches (who are simulating you) will also defect.
  *   If you cooperate, you pay a local cost, but you logically determine that counterparts in other branches will cooperate, generating utility for *your* values in their regions.

  The "trade" is the exchange of **favorable logical correlations**. You are "buying" cooperation from counterparts in other causal patches by "selling" your own cooperation. The currency is the output of the decision algorithm.

  ### 4. Why "Trade" and Not Just "Correlation"?

  This is the crux of your semantic objection. If the correlation is fixed by logic, do I have a choice?

  The argument is that you have a choice over **which logical fact becomes true**.
  *   Fact X: "Agents running Algorithm $f$ in this situation Cooperate."
  *   Fact Y: "Agents running Algorithm $f$ in this situation Defect."

  You cannot make Fact X true for yourself and Fact Y true for the other agent if you are both running $f$. You can only choose which Fact becomes instantiated across the board.

  It is called "trade" because it replicates the **structure of a Prisoner's Dilemma with binding contracts**, despite the absence of enforcement.
  1.  **Commitment:** Each agent commits to a policy ("I will cooperate if I predict you will").
  2.  **Conditionality:** The commitment is conditional on the other's predicted behavior.
  3.  **Mutual Benefit:** Both end up better off than the Nash equilibrium of mutual defection.

  In standard game theory, binding contracts require a causal enforcement mechanism (a court, a mafia). In acausal trade, the "enforcement" is the logical impossibility of the algorithm outputting different values for identical inputs. Proponents argue this functional role is sufficient to warrant the term "trade."

  ### 5. Metaphysical Commitments (and Controversies)

  Your advisor likely waved this off because accepting acausal trade requires accepting controversial metaphysical and decision-theoretic premises that are not standard in academic philosophy or economics.

  **The Commitments:**
  1.  **Algorithmic Realism:** Decision algorithms are abstract objects that can be instantiated in multiple physical locations. Facts about these abstract objects constrain physical actions.
  2.  **Subjunctive Means-End Links:** Rationality requires maximizing utility based on logical implications, not just causal implications. (This is the core rejection of CDT).
  3.  **High Fidelity Simulation:** Agents must be able to model each other with sufficient accuracy to establish the logical link. (If the models are too noisy, the correlation breaks, and acausal trade collapses).

  **The Critiques:**
  Many decision theorists (including your advisor, perhaps) reject FDT/TDT. Common objections include:
  *   **The "Tickle" Defense:** CDT proponents argue that once you account for all the common causes (the shared algorithm design), the actions are probabilistically independent. Conditioning on the action provides no new evidence about the other's action that isn't already screened off by the common cause (the source code).
  *   **Magical Thinking:** Critics argue that treating logical correlation as a lever for control is akin to believing that dancing causes rain because both are correlated with a weather front. FDT proponents reply that in Newcomb-like problems, "magical" thinking wins money.
  *   **Specification Problems:** It is notoriously difficult to formally specify "logical similarity." How similar must the code be? What if one agent uses Python and the other uses C++?

  ### Summary

  To proponents of acausal trade:
  1.  **No hidden physics:** There is no causal channel.
  2.  **Not mere coincidence:** The correlation is counterfactually robust due to logical identity/similarity of the decision algorithms.
  3.  **Why "Trade":** Because agents are effectively negotiating policies across logical space. By adopting a policy of cooperation, they logically compel counterparts in other causal patches to adopt the same policy, thereby realizing utility for each other's values in regions they cannot causally reach.

  Your intuition that this violates standard causal intuitions is correct. The proponents' response is that standard causal intuitions (CDT) are simply the wrong tool for analyzing agents that can model each other's source code. They argue that if you want to win (maximize utility) in a universe containing predictors and logical correlators, you must adopt a decision theory that treats logical dependence as action-guiding, even if it feels like "trade" without causation.

  If you reject the premise that logical facts can be leveraged for control (i.e., if you remain a causal decision theorist), then yes, acausal trade is literally impossible and the term is a misnomer. The debate is not about physics; it is about the definition of rational choice.
