          *   *No, stick to the User's prompt:* "Pareto step is quietly assuming nobody should care HOW a good outcome gets produced."
          *   *Argument:* The Pareto principle is applied to *individual preferences*. If individuals are modeled as self-interested expected utility maximizers (standard economic assumption), they only care about their own payoff. They do not internalize the "fairness of the process" unless it impacts their payoff. Therefore, Pareto mandates that if no one's *payoff* changes, society shouldn't care about the process. This *defines away* process fairness.

  6.  **Refining the Concrete Case (The "Job Allocation"):**
      *   Two candidates, Alice and Bob. Equally qualified. One job.
      *   Utility = Getting the job (1) or not (0).
      *   Policy A: Give to Alice (Nepotism).
      *   Policy B: Fair Competition/Coin Flip.
      *   From an *ex-ante* perspective (behind a veil of ignorance? No, Harsanyi is not Rawls). Harsanyi uses *actual* preferences.
