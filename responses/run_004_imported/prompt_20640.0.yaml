answer: |-
  You have hit on the single most potent philosophical objection to Harsanyi's Aggregation Theorem, often called the **"Domain Exclusion"** or **"Ex-Ante Pareto"** critique.

  The strongest version of this objection argues that Harsanyi does not *derive* utilitarianism from neutral rationality axioms; rather, he **builds utilitarianism into the definition of the inputs** before the theorem even begins. By restricting the domain of "preferences" to von Neumann-Morgenstern (vNM) utilities over *final outcomes*, the theorem mathematically disqualifies any moral value that resides in *processes*, *rights*, or *histories* rather than *states of affairs*.

  Here is the breakdown of that objection, centered on the concrete case you requested.

  ### The Concrete Case: The Single Kidney
  Imagine a hospital with one available kidney and two patients, **Alice** and **Bob**.
  *   They are medically identical (same life expectancy gain, same pain levels).
  *   They are morally identical (same age, dependents, social contribution).
  *   The utility of receiving the kidney is **1** (life); the utility of not receiving it is **0** (death).

  The hospital administrator has two policies:
  1.  **Policy A (Favoritism):** Give the kidney to Alice deterministically.
  2.  **Policy B (Fair Lottery):** Flip a fair coin. 50% chance Alice gets it, 50% chance Bob gets it.

  **Applying Harsanyi's Axioms:**
  1.  **Individual Rationality:** Alice and Bob are vNM expected-utility maximizers. They care about surviving.
      *   Alice's Expected Utility (EU): Policy A = 1.0; Policy B = 0.5.
      *   Bob's Expected Utility (EU): Policy A = 0.0; Policy B = 0.5.
  2.  **Social Rationality:** Society must also satisfy vNM axioms (specifically, linearity/Independence).
  3.  **Pareto:** If everyone prefers X to Y, society must too. (Note: Here, Alice prefers A, Bob prefers B. Pareto is silent on the choice between them).
  4.  **Aggregation:** Harsanyi proves the Social Welfare Function ($W$) must be a weighted sum of individual utilities. Let's assume equal weights ($W = U_A + U_B$).

  **The Calculation:**
  *   **$W(\text{Policy A})$:** $1.0 (\text{Alice}) + 0.0 (\text{Bob}) = \mathbf{1.0}$
  *   **$W(\text{Policy B})$:** $0.5 (\text{Alice}) + 0.5 (\text{Bob}) = \mathbf{1.0}$

  **The Result:**
  Harsanyi's theorem dictates that Society must be **indifferent** between Favoritism and the Fair Lottery.

  **The Moral Failure:**
  Almost every non-utilitarian moral framework (and many intuitive utilitarian ones) argues that Policy B is *strictly better* than Policy A. Why? Because Policy B respects the **equal moral status** of Alice and Bob by giving them an equal *ex-ante* chance, whereas Policy A arbitrarily privileges one without justification.

  Harsanyi's theorem cannot capture this. It treats the *fairness of the procedure* as morally irrelevant noise because fairness does not appear in the *final outcome* utility (dead or alive).

  ### Where the "Innocent" Axioms Smuggle in the Conclusion

  The objection isn't just that the result is counter-intuitive; it's that the theorem achieves this result by **definitional fiat** disguised as mathematical necessity.

  **1. The Domain Restriction (The "Outcomes" Trap)**
  Harsanyi requires preferences to be defined over "lotteries over outcomes." In standard economic modeling (which EA-adjacent writers often import uncritically), an "outcome" is defined as a vector of *personal welfare levels* (e.g., health, wealth, happiness).
  *   **The Smuggle:** By defining the domain this way, the theorem assumes **Consequentialism** before it starts. It assumes that the *only* thing that matters is the final distribution of welfare.
  *   If "being treated fairly" or "having a right to a chance" is not encoded as a personal welfare outcome (e.g., a warm fuzzy feeling), the mathematics treats it as non-existent. The theorem doesn't prove process fairness doesn't matter; it proves that *if you define the world such that process fairness doesn't exist, then it doesn't matter.*

  **2. The Independence Axiom (The "Linearity" Trap)**
  For the aggregation to work, both individual and social preferences must satisfy the **Independence Axiom** (preferences must be linear across probabilities).
  *   **The Smuggle:** Concerns about fairness are often **non-linear**.
  *   *Example:* I might prefer a guaranteed 50/50 split of resources over a gamble that offers a 51% chance of a 100/0 split, even if the expected value is higher in the gamble. Why? Because I value the *certainty of fairness*.
  *   However, vNM utility functions cannot easily accommodate a preference for "fairness of the distribution" distinct from "my share of the distribution" without violating Independence. By insisting on the Independence Axiom, Harsanyi mathematically disqualifies any agent (individual or society) who cares about the *shape* of the distribution rather than just the *sum*.

  **3. The Pareto Principle (The "Ethical Individualism" Trap)**
  This is the specific step you hunched on. The Pareto principle says society should only care about what *individuals* care about.
  *   **The Smuggle:** This assumes **Ethical Individualism** (the view that social value is nothing over and above individual value).
  *   If there is a "social good" like *Justice* or *Procedural Integrity* that exists independently of individual satisfaction (i.e., a society is more just even if the individuals don't realize it), Pareto forbids the Social Welfare Function from counting it.
  *   In the Kidney Case, if Alice and Bob are purely self-interested, they only care about survival. Pareto forces Society to only care about survival. The "Fairness" of the coin flip is a social value that is not reducible to Alice or Bob's self-interest. Harsanyi's Pareto axiom effectively vetoes it.

  ### Summary for Your Piece
  The claim that Harsanyi "proves" utilitarianism is a category error. The theorem proves that **if** you accept:
  1.  Consequentialism (only outcomes matter),
  2.  Ethical Individualism (only individual preferences count),
  3.  And Linearity (fairness cannot be a non-linear constraint)...

  **Then** you get Utilitarianism.

  But those three assumptions *are* utilitarianism. Harsanyi hasn't derived the destination; he has simply drawn a map where no other destination is accessible. The "mathematical proof" is merely a consistency check for people who have already agreed to ignore process fairness.
