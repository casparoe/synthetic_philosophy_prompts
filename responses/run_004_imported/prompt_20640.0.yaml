      *   The "Proof" fails because it yields indifference where morality demands superiority.
      *   *Even Stronger:* What if the "Nepotism" option actually yields slightly higher total utility (maybe Alice is 1% more productive)? Harsanyi says take Nepotism. Morality might say "No, fairness trumps the 1%." Harsanyi says fairness has no weight unless it's in the utility function.
      *   *The "Smuggling":* The theorem assumes the *only* moral currency is utility. It claims to derive this, but it builds it into the definition of the preferences over which Pareto is applied.

  7.  **Finalizing the Structure:**
      *   **Headline:** The "Domain Restriction" Objection.
      *   **Core Argument:** Harsanyi doesn't prove utilitarianism; it proves that *if* you define moral value exclusively as the satisfaction of vNM preferences over outcomes, *then* you get utilitarianism. It begs the question by excluding procedural values from the domain.
