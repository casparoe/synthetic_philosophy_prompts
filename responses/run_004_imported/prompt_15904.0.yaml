          *   *Philosophical consensus:* CPA is usually viewed as an idealization. The "Agree to Disagree" literature (Aumann vs. Harsanyi) is key here. Harsanyi argued priors *should* be common. Aumann showed the consequence. Most modern epistemologists think CPA is too strong for real-world disagreement (different upbringing, etc.).
      *   *Verdict:* The high volume suggests either (a) non-informational motives (hedging) dominate, or (b) CPA is not a binding rational norm. It does *not* necessarily prove agents are irrational, but it challenges the universality of CPA.

