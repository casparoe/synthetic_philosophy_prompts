      *   **Part 2: Hobbes vs. Einstein.** This is the killer. Hobbes's materialism requires space to be a phantom of body. Curved empty space is metaphysically abhorrent to him. He would likely reject General Relativity as "incorporeal substance" mysticism.
      *   **Part 3: The Epistemological Verdict.** Does it collapse? Yes and no.
          *   *Pure Math:* Survives. We still construct it.
          *   *Natural Philosophy:* Collapses. Geometry no longer guarantees truth about the world.
          *   *The Shift:* From "Geometry is the physics" to "Geometry is a language, Physics is the test." Hobbes couldn't make that leap easily.
      *   **Conclusion:** Hobbes would probably double down. He'd claim Einstein is confused. But objectively, his project of grounding all philosophy on Euclidean construction is broken.

