answer: |-
  This is a fantastic deep cut. Most people know Hobbes for *Leviathan* and the "state of nature," but his decades-long feud with John Wallis (the Savilian Professor of Geometry at Oxford) is one of the most entertaining episodes in the history of mathematics. You're absolutely right about his motivation: Hobbes wasn't just bad at math; he had a specific *philosophical* reason for why geometry was the only path to certainty, and why Wallis's algebraic methods were "scabs of symbols" that obscured truth.

  To answer your question, we have to look at Hobbes's metaphysics. For Hobbes, **to know something is to know its cause.** In natural philosophy (physics), we see effects (motion, color, heat) and have to guess the causes. But in geometry, **we are the cause.** We define the point, we move the line, we generate the circle. Therefore, the conclusions are certain.

  Here is how Hobbes would likely wrestle with Non-Euclidean geometry and Einstein, and whether his system survives.

  ### 1. Hobbes vs. Non-Euclidean Geometry
  If you brought Hyperbolic or Elliptic geometry to Hobbes (circa 1660), his reaction would depend entirely on **construction.**

  Hobbes rejected algebra because it was symbolic manipulation without intuitive, spatial referents. He demanded that every mathematical object be generatable by motion (a point moving becomes a line, a line moving becomes a surface).

  *   **The Consistency Argument Won't Work:** If you told Hobbes, "Non-Euclidean geometry is logically consistent even if it contradicts Euclid," he wouldn't care. For Hobbes, logic without physical referents is just wordplay (which he associated with the "vain philosophy" of the Scholastics and the University of Oxford).
  *   **The Construction Test:** He would ask: *Can you construct this?* If you can show him a physical model (like a pseudosphere for hyperbolic geometry) or a mechanical method to generate the figures, he might accept it as a valid *system* of reasoning.
  *   **The Truth Claim:** However, Hobbes believed Euclidean geometry was true *of space itself.* He viewed the Parallel Postulate not as an arbitrary axiom, but as a fact about how bodies exist. If you proposed a geometry where parallel lines meet, he would likely argue you have simply defined your terms incorrectly. To Hobbes, a "line" is the trace of a moving body. If your "line" curves in a way that violates Euclid, he'd argue you aren't talking about a line anymore, or you're describing a force acting on the body, not pure geometry.

  **Verdict:** He would likely dismiss Non-Euclidean geometry as a clever logical game (like algebra) but deny it the title of "Science" because it doesn't describe the actual generation of quantity in the real world.

  ### 2. Hobbes vs. Einstein (Curved Physical Space)
  This is where Hobbes's system takes a mortal wound.

  Hobbes was a strict materialist. He believed there was no such thing as "incorporeal substance." Space, for Hobbes, was a "phantasm"—a mental idea of the extension of bodies. There is no vacuum; where there is space, there is body (or at least the potential for body).

  *   **The Metaphysical Clash:** General Relativity posits that space-time is a manifold that can curve *without* being filled with a material medium (in the Newtonian/Hobbesian sense). To Hobbes, "curved empty space" sounds dangerously like "incorporeal substance," which he spent half his life attacking as religious nonsense used to manipulate the populace.
  *   **The Loss of Certainty:** Hobbes's big claim was that geometry gives us certain knowledge of the world *because* we construct it. But if Einstein shows that the geometry we construct (Euclidean) **does not match the geometry of the universe**, then geometry is no longer the science of physical reality. It becomes merely the science of our *ideas* of reality.
  *   **The "A Priori" Problem:** Hobbes thought we could deduce the laws of nature from first principles (geometry + motion). Einstein showed that the geometry of nature is an *empirical* question. You can't sit in a chair and deduce the curvature of the universe; you have to go measure eclipses. This destroys the Hobbesian dream that philosophy can be a deductive system like geometry.

  ### 3. Does His Epistemology Collapse?
  It collapses, but there is a fascinating "save" that Hobbes *might* have attempted, though it would require betraying his materialism.

  **The Collapse:**
  Hobbes wanted to unify **Mathematical Truth** and **Physical Truth.** He wanted geometry to be the language of physics *and* the standard of certainty.
  *   Einstein separates them. Mathematical truth becomes conditional (if axioms X, then Y). Physical truth becomes empirical (which axioms fit the data?).
  *   This means we *can* be wrong about geometry in the way we can be wrong about nature. We thought space was Euclidean; we were wrong. Therefore, geometry is not immune to empirical falsification. Hobbes's core distinction (Geometry = Certain, Physics = Conjectural) evaporates.

  **The Possible "Save" (The Kantian Pivot):**
  Hobbes could have pivoted to a position similar to Kant (who came later and was influenced by Newton, not Einstein). He could argue:
  > "Euclidean geometry is still certain, because it is the structure of the *human mind's* construction of space. Einstein merely showed that the 'thing-in-itself' (external reality) doesn't match our mental construction."

  If Hobbes took this route, he saves the certainty of geometry, but he sacrifices his materialism. He has to admit that space is a feature of *us*, not the *bodies*. Given Hobbes's hatred of anything "mental" or "spiritual" overriding the material, he probably wouldn't take this deal. He would more likely insist Einstein is wrong.

  ### 4. Why Wallis Was Actually Right (and Hobbes Was Doomed)
  The irony of your rabbit hole is that Wallis represented the future, and Hobbes was the past.
  *   **Hobbes:** Math must be grounded in visualizable, mechanical construction. (Intuition-based)
  *   **Wallis:** Math can be symbolic, algebraic, and abstract. (Formalism-based)

  Non-Euclidean geometry and General Relativity are the ultimate vindication of Wallis. You cannot "construct" 4-dimensional curved space-time with a compass and straightedge. You can only handle it through symbolic algebra and tensor calculus—the very "scabs of symbols" Hobbes hated.

  ### Summary
  If you told Hobbes about Non-Euclidean geometry and Einstein:

  1.  **He would reject the physics:** He would call curved space "incorporeal nonsense" and insist space is just the phantom of existing bodies.
  2.  **He would reject the math:** He would argue that if it can't be generated by simple motion, it isn't true science, just symbolic manipulation.
  3.  **His philosophy would break:** His entire project in *De Corpore* was to build a system of philosophy where political and physical certainty rested on geometric certainty. If geometry is just one of many possible consistent systems, and none of them are guaranteed to match reality *a priori*, then his "Civil Science" loses its foundational bedrock.

  Hobbes wanted a world where truth was something you could **build** with your hands (or your mind's eye) and be guaranteed it matched the universe. Modern physics tells us the universe is under no obligation to match our constructions. Hobbes would likely view modern physics not as progress, but as a return to the obscure, confusing "darkness" he sought to illuminate with his geometric light.

  He'd probably die still trying to square the circle, insisting that Wallis and Einstein were just making it complicated to hide their ignorance.
