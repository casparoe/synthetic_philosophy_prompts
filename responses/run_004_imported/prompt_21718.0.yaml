      *   The relation "is 1 mile from" is like a method `obj1.isOneMileFrom(obj2)`. For this method to return true, `obj1` and `obj2` must be distinct instances. If they were the same instance, the method would check distance to self (0). So the method implementation *presupposes* distinct instances.

