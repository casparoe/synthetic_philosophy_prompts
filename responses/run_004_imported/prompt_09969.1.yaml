answer: |-
  **Setting:** *A university seminar room, late afternoon. The whiteboard is covered in probability trees. Two graduate students, Alex (Sharp Bayesian) and Jordan (Imprecise Credence Theorist), are packing up their bags.*

  **Alex:** I've been thinking about your defense of imprecise credences, Jordan. Specifically, the Levi-style claim that when evidence is ambiguous, a rational agent's belief state is a set of functions, $\mathcal{P}$, rather than a single $P$. It sounds humble, but I think Elga's sequential-bets argument shows it's actually incoherent.

  **Jordan:** Elga's 2010 paper? The "Subjective Probabilities Should Be Sharp" argument? I know it well. But I don't think it lands the way you think it does.

  **Alex:** It seems pretty decisive. Suppose your credence in a proposition $H$ is the interval $[0.4, 0.6]$. I offer you Bet 1: Pay \$10 to win \$25 if $H$. For the $P \in \mathcal{P}$ where $P(H)=0.4$, the expected value is zero. For the rest, it's positive. But let's tighten it. Pay \$10 to win \$22 if $H$.
  At $P(H)=0.4$, expected value is $-1.2$. At $P(H)=0.6$, it's $+3.2$.
  Under your standard decision rule—say, E-admissibility—it is *permissible* to decline this bet, because some probability functions in your set deem it unfavorable.

  **Jordan:** That's correct. If my evidence doesn't warrant ruling out $P(H)=0.4$, I shouldn't be forced to act as if $H$ is more likely than 0.4. So declining is permissible.

  **Alex:** Fine. Now, immediately after you decline, I offer you Bet 2: Pay \$10 to win \$22 if $\neg H$.
  At $P(H)=0.4$, $P(\neg H)=0.6$, so the EV is $+3.2$. At $P(H)=0.6$, $P(\neg H)=0.4$, so the EV is $-1.2$.
  Again, your rule permits you to decline, because some functions in $\mathcal{P}$ deem it unfavorable.
  So, you decline Bet 1. You decline Bet 2. You walk away with \$0. But if you had taken *both*, you would have won \$2 regardless of whether $H$ was true or false. You turned down a sure gain. That's a diachronic Dutch Book. It violates basic dominance principles.

  **Jordan:** You're presenting this as if I'm making two isolated decisions in a vacuum. But rational agents are capable of planning. If I know at time $t_1$ that Bet 2 will be offered at $t_2$, I evaluate the *sequence* of options. The strategy "Decline Both" yields \$0. The strategy "Accept Both" yields \$2. Since "Accept Both" dominates "Decline Both" across *every* $P \in \mathcal{P}$, my decision rule actually *forbids* the plan to decline both. So, if I see the sequence coming, I take the sure gain. No incoherence.

  **Alex:** But Elga anticipates that. What if you *don't* know Bet 2 is coming? What if the offers are genuinely sequential and surprising? At $t_1$, you decline Bet 1. That's permissible by your lights. At $t_2$, you're at a new node. You have no Bet 1. You face Bet 2 alone. Declining is again permissible. You end up with \$0.
  The problem is that your local permissibility rules don't aggregate to global rationality. You're vulnerable to a bookie who knows your set $\mathcal{P}$ even if you don't know his schedule. To avoid this, you'd need to assign a sharp probability to the event "Bookie offers Bet 2."

  **Jordan:** And there's the rub. You're assuming I *can* and *should* assign a sharp probability to the bookie's behavior. But why? If the evidence regarding $H$ is ambiguous, the evidence regarding the bookie's strategy might be too. If I assign a sharp credence to the bookie's move just to save myself from this theoretical money pump, I'm fabricating precision where there is none. I'd rather accept the risk of a sequential loss than commit to a sharp prior that my evidence doesn't support. The "sure gain" is only sure relative to a sharp probability space that I have no epistemic right to inhabit.

  **Alex:** But without that sharp space, you can't navigate the world. You say you'd rather accept the risk, but that implies you have a tolerance for risk. And that tolerance reveals a number. If I offer you a choice between the ambiguous urn and a known 50/50 coin flip for the same prize, and you prefer the coin, you've revealed ambiguity aversion. Savage would say you're violating the Sure Thing Principle. You're letting the *source* of the uncertainty affect your choice, not just the uncertainty itself.

  **Jordan:** Savage's Sure Thing Principle fails in cases of ambiguity. That's the lesson of the Ellsberg Urn. Look, let's turn the table. Suppose I have an urn with 100 balls, Red and Black. I know nothing about the ratio. You, the Sharp Bayesian, must assign a single number to $P(\text{Red})$. What is it?

  **Alex:** 0.5. Principle of Indifference. In the absence of evidence favoring one color over the other, symmetry dictates equality.

  **Jordan:** But there is no symmetry. The physical mechanism filling the urn is unknown. It could be a machine biased toward Red. Expert testimony is divided: half the geologists say the clay favors Red, half say Black. Your 0.5 isn't derived from the evidence; it's derived from your *ignorance*. You're treating "I don't know" as "I know it's equal." That's spurious confidence. My set $\mathcal{P} = [0, 1]$ (or perhaps $[0.2, 0.8]$ given the experts) accurately represents the state of the evidence. Your 0.5 lies about it.

  **Alex:** It's not a lie; it's a commitment to coherence. If you don't pick 0.5, what do you pick? If you pick 0.4, why not 0.6? If you refuse to pick, you can't update. If I tell you a Red ball was drawn, how do you conditionalize an interval?

  **Jordan:** We conditionalize every member of the set. $\mathcal{P}_{new} = \{ P(\cdot | \text{Red}) : P \in \mathcal{P}_{old} \}$. It works perfectly well. The issue isn't updating; it's action. You claim I can't act without a single number. But I can. I can choose options that are *admissible* across the set. If a bet on Red is good for some $P \in \mathcal{P}$ and bad for others, I might decline it. If a bet is good for *all* $P \in \mathcal{P}$, I take it. That's enough to function.

  **Alex:** Is it? Suppose you're a public health official. You have to decide whether to fund a vaccine. The efficacy is ambiguous—experts disagree on the structural model, not just the parameters. Your set $\mathcal{P}$ says the probability of success is between 0.3 and 0.7. The cost is fixed. To make a decision, you effectively have to act *as if* the probability is some specific value, say 0.5, to weigh the costs and benefits. If you say "It's admissible to fund and admissible to not fund," you've paralyzed the committee. You've outsourced the decision to a tie-breaker that isn't part of your epistemology.

  **Jordan:** Paralysis is sometimes the rational response to radical uncertainty! If the experts disagree for structural reasons, averaging their opinions into a sharp 0.5 hides the disagreement. It makes the risk look manageable when it might be catastrophic. My imprecision forces the committee to acknowledge that the decision is *value-laden*. We have to ask: "How cautious do we want to be?" rather than pretending the math dictates a single answer. Your sharp Bayesianism smuggles in a value judgment—risk neutrality—under the guise of logical coherence.

  **Alex:** I'm not smuggling in risk neutrality; I'm enforcing consistency. If you refuse to sharpen your credence, you're essentially saying your preferences are incomplete. And while incomplete preferences are fine in a textbook, they break down in the long run. If you face a thousand Ellsberg-style choices, your imprecise strategy will be dominated by a sharp one that just picks a number and sticks to it. You'll leave utility on the table, repeatedly.

  **Jordan:** And if I pick the wrong number, I'll walk off a cliff I didn't know was there. Your sharp agent is like a driver who refuses to acknowledge fog, insisting on a precise speedometer reading when they can't see the road. My agent slows down. Yes, they arrive later. But they don't crash. The "utility left on the table" is the premium I pay for not pretending to know what I don't know.

  **Alex:** But you can't quantify that premium without a sharp probability! To say "I pay this premium to avoid crash risk" requires weighing the probability of the crash against the cost of the delay. You're using sharp credences to justify your imprecise credences.

  **Jordan:** *Meta*-credences. I can have sharp credences about when it is appropriate to be imprecise. That doesn't mean my credence about the *urn* is sharp. It means I'm certain that the evidence is ambiguous.

  **Alex:** So you admit there's a level at which you're sharp.

  **Jordan:** I admit I'm certain of my uncertainty. But that doesn't collapse the uncertainty itself. Look, Alex, your Elga argument shows that imprecise agents need to be careful about sequential planning. I grant that. It's a constraint on my theory: we need robust decision rules that look ahead. But my Ellsberg argument shows that your theory requires you to pull numbers out of thin air. It's a constraint on *your* theory: you need an account of priors that doesn't rely on false symmetry.

  **Alex:** Fair. I'll concede that the "Where does the number come from?" challenge is the hardest problem for the Sharp Bayesian. We rely on idealizations—symmetry, regularity, maximum entropy—that are pragmatic, not purely evidential. But I maintain that without that idealization, you lose the ability to define rationality formally. You end up with "It depends."

  **Jordan:** And I'll concede that "It depends" is dangerous if it leads to myopic decision-making. We need to ensure our imprecise rules are diachronically stable. But I'd rather have a complex theory that tracks the evidence than a simple one that tracks the axioms.

  **Alex:** Then we're at an impasse. Coherence vs. Evidence.

  **Jordan:** Or perhaps, Precision vs. Honesty.

  **Alex:** *Laughs.* I'll see you next week. Don't take any sequential bets before then.

  **Jordan:** Only if the odds are admissible across the whole set.
