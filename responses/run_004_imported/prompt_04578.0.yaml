answer: |-
  **The FROSTA Stool**

  **Leo:** Hand me the cam lock.

  **Mara:** You mean the simples arranged cam-lock-wise. Here.

  **Leo:** You're doing the thing again. We've been at this for twenty minutes. The stool is literally right here.

  **Mara:** The particles are here. There are no stools, Leo. There are only simples arranged stool-wise. Composition never occurs. If I take a sledgehammer to this, I haven't destroyed an object; I've just rearranged the simples into debris-wise arrangements.

  **Leo:** But the simples exist, right?

  **Mara:** Obviously. I'm not a solipsist.

  **Leo:** And unrestricted composition is true. If the simples exist, their fusion exists. So the stool exists. It's just the sum of those parts.

  **Mara:** That's the begging of the question. Why think sums exist just because the parts do? There's no causal unity over and above the interactions of the parts. There's no extra glue. Positing a "stool" entity is ontologically gratuitous.

  **Leo:** It's not gratuitous, it's logical. You're drawing an arbitrary line. Why does composition happen at the boundary of the stool but not between the stool and the cat? Or the stool and the moon? If you say composition is restricted, you need a principled criterion for when it happens. Contact? Fastening? Life? Every line you draw looks gerrymandered. Universalism is clean. There is an object composed of your left ear and the Eiffel Tower. There was also an object composed of these parts before we opened the box, scattered across the warehouse and our living room.

  **Mara:** That's reductio ad absurdum, not a feature. If your ontology says there's a "scattered object" made of loose screws and a particle in Andromeda, you've stretched the word "object" until it snapped. It doesn't carve reality at the joints. It just carves the dictionary.

  **Leo:** Ah, now we're getting somewhere. You're saying my quantifier is wrong.

  **Mara:** I'm saying your quantifier is *different*. Look, maybe this is just Hirsch's point. When I say "there exists a stool," I mean something that satisfies ordinary functional unity. When you say "there exists a stool," you mean "there is a plurality of simples such that..." We're both speaking true sentences, relative to our own linguistic frameworks. You're speaking Universalish, I'm speaking Nihilish. There's no substantive disagreement about the world, just about which language to use.

  **Leo:** That's the quantifier variance cop-out. It assumes all meanings of "exists" are on equal footing. But Sider's right: structure matters. Reality has a fundamental structure. Some concepts carve at the joints better than others. If there is a fundamental language—Ontologese—there is a fact of the matter about which quantifier matches the structure of reality.

  **Mara:** And you think unrestricted composition carves better?

  **Leo:** I think it's the only one that doesn't rely on vague, human-centric notions like "functional unity" or "contact." Those are messy. The logical sum is precise.

  **Mara:** Precise doesn't mean fundamental. Maybe the fundamental structure doesn't include composite objects at all. Maybe the joints are only at the level of simples. In that case, my language is closer to Ontologese than yours. You're the one adding ghost objects to the furniture.

  **Leo:** But if you deny the stool exists, how do you explain the fact that I can sit on it?

  **Mara:** I explain it by saying simples arranged stool-wise can support simples arranged Leo-wise. I don't need a "stool" variable in the equation.

  **Leo:** So we're back to square one. You think my quantifier is too bloated; I think yours is too restrictive. And we can't appeal to reality to settle it because any appeal to reality has to be made *using* a quantifier.

  **Mara:** Exactly. So maybe we should just stop worrying about whether the stool "exists" and worry about whether it wobbles.

  **Leo:** It does wobble.

  **Mara:** See? Simples arranged wobbly-wise. Pass the Allen key.

  **Leo:** ...Here.

  **Mara:** Thanks.

  **Leo:** You know, even if you're right about the ontology, you still have to tighten that screw.

  **Mara:** Oh, absolutely. The causal powers of the simples are quite insistent.

  **Leo:** So the disagreement is...

  **Mara:** I don't know. Verbal? Substantive? Maybe we need a better dictionary.

  **Leo:** Or a better reality.

  **Mara:** Don't hold your breath. Hand me the leg.

  **Leo:** The simple arranged leg-wise?

  **Mara:** Shut up, Leo.
