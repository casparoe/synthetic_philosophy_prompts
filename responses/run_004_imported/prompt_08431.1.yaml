answer: |-
  Here are ten interview questions designed to press the specific commitments of Subject-Sensitive Invariantism (SSI), along with follow-ups tuned to anticipate the standard defenses of the view.

  **1. The Displacement Argument**
  "You argue that pragmatic encroachment shouldn't just coexist with Contextualism but should *displace* it entirely. Both theories predict the same verdicts in the classic 'Bank Cases'—that I know the bank is open on a Tuesday when the stakes are low, but not when the stakes are high. If the output is identical, why should we prefer your explanation? Specifically, what explanatory work is SSI doing that Contextualism literally *cannot* do, justifying the cost of throwing out the standard semantic model?"

  *   **Follow-up:** "You'll likely say Contextualism fails to explain why I shouldn't *act* on the belief when stakes are high. But if SSI makes knowledge depend on stakes, aren't you just relocating the problem? Does your view actually explain the action-guiding nature of knowledge, or does it just define knowledge *as* whatever guides action?"

  **2. The Semantics vs. Situation Crux**
  "I want to pin down the metaphysics here. A Contextualist says the word 'knows' is slippery—its definition shifts with the conversation. You say the definition is stable, but the *subject's situation* determines if the definition is met. Why is it theoretically preferable to bake practical stakes into the *truth conditions* of knowledge itself, rather than treating stakes as a separate constraint on when it's *appropriate to claim* knowledge?"

  *   **Follow-up:** "If you say it's about truth conditions and not just appropriateness, you're making a very strong claim. Does this mean that two people with identical evidence and identical belief states can differ on whether they 'know,' solely because one has a mortgage payment due and the other doesn't? How is that not an unacceptably relativistic view of truth?"

  **3. The Unaware Subject (The Jessica Brown Objection)**
  "Let's talk about the surgeon case that my friend argued about. Imagine a surgeon is deciding on a procedure. Objectively, the patient's life is at risk (high stakes). But the surgeon *believes* it's a routine check-up (low stakes). On your view, do they know the diagnosis is correct? If you say 'no' because the objective stakes are high, you seem to disconnect knowledge from the subject's perspective. If you say 'yes,' you seem to concede that stakes don't actually encroach on knowledge."

  *   **Follow-up:** "I suspect you'll say the stakes are objective facts, regardless of the surgeon's belief. But if knowledge can be destroyed by facts the subject is completely unaware of, doesn't that make 'knowledge' useless for the subject's own deliberation? How can I use knowledge to guide my actions if I can never be sure I have it without auditing the entire universe for hidden stakes?"

  **4. The Flickering Problem**
  "One intuitive objection to your view is the 'flickering' problem. Suppose I know the bank is open on Saturday. Then, without me finding out, a bet is placed on whether I know it. The stakes have objectively risen. On your view, did my knowledge vanish the moment the bet was made? It seems metaphysically odd that a mental state like knowledge could pop in and out of existence without any change in my evidence or cognitive processing."

  *   **Follow-up:** "Your standard reply is likely that knowledge is a tool for action, so if the job requirements change, the tool's suitability changes. But if the tool vanishes before I even know the job changed, how is it a tool *for me*? Are we talking about knowledge as a normative status for *evaluators*, rather than a cognitive state for *agents*?"

  **5. Moral Encroachment**
  "There's a growing movement in epistemology arguing that if practical stakes affect knowledge, moral stakes must too—for example, requiring stronger evidence to believe a statistical generalization about a person if acting on it could cause racial harm. Does your version of pragmatic encroachment commit you to 'moral encroachment'? If not, what is the principled line between a 'practical' cost that lowers knowledge and a 'moral' cost that doesn't?"

  *   **Follow-up:** "If you say moral stakes *are* just a subset of practical stakes, then you accept moral encroachment. But if you try to draw a line, isn't that arbitrary? If the cost of being wrong is high in both cases (financial ruin vs. social harm), why does the *type* of cost matter for the definition of knowledge?"

  **6. Assertion vs. Truth**
  "Contextualists often accuse SSI proponents of confusing *truth* with *assertability*. They argue that in high-stakes cases, I still *know* the proposition is true, but it's just irresponsible to *say* I know it. When you press me to gather more evidence in a high-stakes scenario, are you telling me my belief isn't true knowledge, or are you just telling me I'm not licensed to broadcast it?"

  *   **Follow-up:** "If you insist it's about truth and not just assertion, can you give me a case where it is *false* that I know, but it would still be *appropriate* for me to assert that I know? If those two things always travel together, how do we empirically distinguish your view from the Contextualist's?"

  **7. Third-Party Attributions**
  "Let's look at third-party reports. If I'm watching you at the bank, and I know your stakes are high, but my own stakes are low, can I truthfully say to a third person, 'She doesn't know the bank is open'? If SSI is right, my report should track *your* stakes, not mine. But intuitively, my conversation seems to run on *my* contextual standards. How does your view handle the semantics of *my* speech about *your* mind?"

  *   **Follow-up:** "If you say my report is false because I used my standards instead of yours, you're implying we make massive, systematic errors in everyday conversation about knowledge. Are you comfortable with an error theory that suggests most ordinary people are constantly misusing the word 'knows' when talking about others?"

  **8. The Threshold Problem**
  "In software, we deal with thresholds constantly. If pragmatic encroachment is real, there must be a threshold where 'enough evidence' becomes 'knowledge.' As stakes rise, that threshold moves. Is there any limit to this? If the stakes are infinite (e.g., the fate of the universe), does the evidence required for knowledge become infinite? If so, aren't you just reintroducing skepticism through the back door?"

  *   **Follow-up:** "You'll likely say the threshold scales but doesn't necessarily hit infinity. But what determines the scaling function? Is it linear? Exponential? Without a formal account of how stakes map to evidence thresholds, isn't the theory vulnerable to the charge that it's just a 'just-so story' we tell to match our intuitions?"

  **9. Cognitive Load and Effort**
  "As an engineer, I think about cost in terms of compute or effort. Your view suggests that when stakes are high, I need more evidence to know. Does this mean that 'knowing' is partially constituted by how hard I'm willing to work? If two people have the same evidence, but one is lazy and won't check further, does the lazy person fail to know something the diligent person knows, even if they currently hold the same belief?"

  *   **Follow-up:** "If you say the lazy person doesn't know, you're making knowledge dependent on *willingness to act* rather than *cognitive state*. Does this collapse the distinction between 'knowing' and 'being rational'? Why keep the word 'knowledge' at all if it just means 'rationally actionable belief'?"

  **10. The Practical Upshot**
  "Finally, let's bring this down to earth. If your view is correct and Contextualism is wrong, how should that change what we do? Does it change how we teach critical thinking, how we conduct scientific peer review, or how we handle testimony in court? If SSI is true, what is one concrete practice in our epistemic community that we are currently getting wrong?"

  *   **Follow-up:** "If you say it doesn't change much practically, why fight so hard for the theoretical displacement of Contextualism? But if it *does* change things, aren't you admitting that this isn't just semantic hair-splitting, but a claim that requires us to fundamentally restructure how we validate each other's claims?"
