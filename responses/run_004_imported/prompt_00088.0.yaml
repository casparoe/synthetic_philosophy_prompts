      *   *Combination Problem:* How do micro-conscious entities combine to form macro-conscious entities (like human minds)?
      *   *Subject-Summing Constraint (SSC):* The intuition/requirement that subjects of experience don't simply add up like numbers. If Subject A and Subject B exist, "Subject A+B" isn't automatically a new Subject C. Subjects are ontologically distinct centers of perspective.
