  8.  **Final Review of the Thesis:** The essay will argue that aesthetic value is not intrinsic to the physical object but is a relational property dependent on the work's genesis. Therefore, the perfect forgery is aesthetically impoverished because it severs the connection between form and generative intention.

      *(Wait, one nuance)*: If the forgery is *never* discovered, is it aesthetically inferior?
      *   If aesthetic value is objective: Yes.
      *   If aesthetic value is subjective/experiential: No.
      *   I need to argue for a version of aesthetic value that is objective enough to exist independent of the viewer's immediate knowledge, or argue that the *potential* for knowledge changes the status.
      *   Actually, the strongest argument is that the *category* of the object is part of its aesthetic identity. A urinal is not art unless Duchamp says so. A painting is not a "Vermeer" unless Vermeer made it. The category dictates how we perceive it. Even if we can't tell, the category is different.
