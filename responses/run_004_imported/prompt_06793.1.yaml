answer: |-
  The dinner table argument you describe is a modern reenactment of a philosophical stalemate that has persisted since the ancients. On one side sits Aesthetic Empiricism: the belief that the value of art resides entirely in the perceptual experience it affords the viewer. On the other sits Aesthetic Contextualism: the belief that art's value is inextricably bound to its history, origin, and the intentions of its maker. Your friend champions the former; you, channeling Nelson Goodman and Denis Dutton, champion the latter.

  The stakes are raised by the stipulation of the "Perfect Forgery." We are not discussing a clumsy fake that cracks under X-ray analysis. We are discussing a painting physically identical to the original in every atom, a work that defies not only current science but any future method of detection. In this scenario, the physical object offers no clue to its genesis. If the retina is the sole judge, your friend wins. If the mind is the judge, you must win.

  To settle this, we must move beyond the deadlock by defining what "aesthetic value" actually is. If aesthetic value is merely sensory pleasure—like the taste of a strawberry—then your friend is correct; a perfect synthetic strawberry tastes the same, so it is aesthetically equal. But art is not a flavor. Art is a form of communication, a symbolic act frozen in time. Because art is an act, the identity of the actor and the nature of the action are constitutive elements of the work's aesthetic reality. Therefore, even the perfect forgery is aesthetically inferior to the original. It is inferior not because it looks worse, but because it *means* less.

  The deflationary view held by your friend relies on a category error: it treats the painting as a static object rather than a dynamic event. When we stand before a Rembrandt, we are not merely processing light and color; we are witnessing a specific human confrontation with the world that occurred in the 17th century. We are engaging with the decisions Rembrandt made to solve problems of light, form, and emotion that were pressing *to him* at *that time*. The aesthetic thrill is partly in the recognition of that specific agency. We admire the boldness of a brushstroke because we understand it as a risk taken by the artist to capture a fleeting truth.

  In the case of the perfect forgery, the physical stroke may be identical, but the agency is fundamentally different. The forger is not solving the problem of "how to express this emotion" or "how to capture this light." The forger is solving the problem of "how to make this look like Rembrandt solved it." The intention is derivative. In aesthetics, intention matters because art is a language. If I say "I love you" to you, the words have a certain weight. If I read those same words from a card written by someone else, the sonic and visual properties are identical, but the aesthetic and emotional impact is hollowed out. The words are the same; the speech act is different. The forgery is a quote masquerading as an original statement. It creates a dissonance between the form (which screams originality) and the genesis (which is mimicry). This dissonance is an aesthetic flaw, even if it is undetectable by spectrometer.

  Your friend argues that the "crime" is only against the wallet and the historical record. This suggests that the artwork is a container of value that can be filled by anyone, provided the seal remains unbroken. But this reduces art to a commodity. If the value were purely in the visual arrangement, then art would be indistinguishable from interior design. We do not pay millions for a Van Gogh simply because the colors please us; we pay because that specific arrangement of colors is a testament to Van Gogh's specific struggle and vision.

  Consider the implications of the "no test ever" stipulation. It implies that the forgery is physically indistinguishable, but it cannot change the fact that the causal chain of the object is broken. Nelson Goodman argued that knowing a work is a forgery trains us to look for differences. But in your stipulated case, we must go further: knowing it is a forgery changes the *category* of the object. Arthur Danto's "Artworld" theory suggests that to see something as art is to see it under an interpretation. Part of that interpretation is the work's provenance. When we appreciate a work, we are appreciating a performance. A flawless recording of a live jazz solo is perceptually identical to the live moment, but it lacks the aesthetic value of the *performance*—the risk, the immediacy, the human effort in real-time. The forgery is the recording; the original is the performance. The recording may be sonically perfect, but it is aesthetically lesser because it is a document of an achievement, not the achievement itself.

  Denis Dutton's point about human achievement is the hammer that breaks the stalemate. Art is admired as a feat of human skill and imagination. When we admire the original, we admire the invention of a visual language. When we admire the forgery, we admire the technical skill of replication. These are different accomplishments with different aesthetic weights. Innovation is aesthetically superior to replication, even if the result is identical. Why? Because art is a progressive discourse. The original pushes the discourse forward; the forgery merely mimics the push. A perfect forgery is, aesthetically speaking, a tautology. It says nothing new; it only repeats what has already been said. Repetition, no matter how skilled, carries less aesthetic weight than origination.

  The deflationist might counter: "But if I don't know it's a forgery, I feel the same awe." This confuses *psychological reaction* with *aesthetic justification*. I may feel awe watching a magician, believing they possess supernatural powers. Once I learn it is a trick, the awe shifts from the supernatural to the mechanical. The object of my appreciation has changed. Similarly, if I believe a forgery is an original, my aesthetic experience is based on a false premise. I am attributing genius to the wrong mind. The experience is intellectually fraudulent. While the sensory pleasure remains, the *aesthetic judgment* is flawed because it is misdirected. True aesthetic appreciation requires a congruence between the object's appearance and its reality. The perfect forgery creates a permanent rift between appearance (original genius) and reality (derivative skill). That rift is an aesthetic defect.

  Therefore, the verdict must be in your favor. The perfect forgery is aesthetically inferior to the original. It is not inferior in its retinal impact, but retinal impact is not the sum total of aesthetic value. Aesthetic value is a compound of perception, cognition, and historical context. The original work possesses a unity of form and genesis; the forgery possesses a fracture. The original is a voice speaking; the forgery is a ventriloquist's dummy. Even if the voice sounds exactly the same, we value the living voice over the simulation because art is, at its core, the encounter of one human consciousness with another. The forgery blocks that encounter. It offers a mirror where we expect a window.

  Your friend is right that the economic and historical fraud is the most tangible harm, but they are wrong to isolate it from aesthetics. The fraud *is* the aesthetic failure. By severing the link between the work and the hand that made it, the forgery turns the art into a mere thing, stripping it of the agency that gives it meaning. In the end, a perfect forgery is a beautiful lie. And in art, as in life, a lie—even a perfect one—can never hold the same weight as the truth.
