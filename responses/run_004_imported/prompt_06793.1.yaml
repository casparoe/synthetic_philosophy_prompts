          *   Friend's View (Deflationary/Instrumental): If it looks exactly the same, the aesthetic value is identical. The "wrong" is moral/legal (fraud) or historical (misattribution), not aesthetic.
          *   User's View (Goodman/Dutton): Authenticity matters aesthetically. History of production matters (Goodman: training the eye to see differences eventually; Dutton: art is about human achievement/performance).
      *   **Task:** Write an essay settling the question for this specific stipulated case.
      *   **Constraint:** Do *not* end in a split decision. Defend a specific verdict (Is it aesthetically inferior or not? Why?).
      *   **Tone:** Philosophical, argumentative, nuanced, but decisive.

  2.  **Deconstruct the Arguments:**

      *   **The Deflationary View (Friend):**
          *   Premise: Aesthetic experience is rooted in perception (what is seen/felt).
          *   Premise: If $X$ and $Y$ are perceptually identical, they offer the same aesthetic experience.
          *   Conclusion: The forgery is aesthetically equal to the original. The "crime" is external (money, history).
          *   Strength: Aligns with intuition about immediate experience. If I can't tell, how can my pleasure be less?
          *   Weakness: Ignores the cognitive context of appreciation. Art isn't just retinal stimulation; it's communication.

      *   **The Goodman/Dutton View (User):**
          *   *Goodman:* "The forgery lacks the history of production." Even if we can't see the difference *now*, knowing it's a forgery changes how we look (we look for clues). In the prompt's specific case, *no test ever* can distinguish them. This weakens Goodman slightly because he relies on the *possibility* of learning to see differences. If differences are impossible, does his argument hold?
          *   *Dutton:* Art is a performance. We admire the *achievement*. A forgery is a different achievement (mimicry vs. innovation).
          *   Strength: Captures why we care about authorship. Art is a human act, not just an object.
          *   Weakness: Can feel like conflating "interest in the artist" with "beauty of the object."

  3.  **Formulate a Verdict:**
