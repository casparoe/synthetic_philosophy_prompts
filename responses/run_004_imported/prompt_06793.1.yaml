      *   *Refining the Argument:* The key is to redefine "aesthetic." If aesthetic = sensory pleasure, the friend wins. If aesthetic = appreciation of artistic meaning/intention, the user wins. I need to argue the latter is the correct definition of *artistic* aesthetic value.
      *   *The "Magic Trick" Analogy:* A magic trick known to be a trick is different from one thought to be magic. But a better analogy is a *quote* vs. an *original statement*. If I say "I love you" because I wrote it, vs. reading it from a card someone else wrote. The words are the same, the act is different.
      *   *The "Performance" Argument:* Art is an action frozen in time. The forgery is a different action.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene (the dinner argument). Define the "Perfect Forgery" (indistinguishable forever). State the thesis: The forgery is aesthetically inferior because aesthetic value is inherently historical and intentional, not merely perceptual.
      *   **The Deflationary Case (The Friend):** Give it its due. It relies on "aesthetic empiricism." If the experience is identical, the value is identical. The wrong is fraud.
      *   **The Flaw in Empiricism:** Art isn't just a visual stimulus. It's a communicative act. Reference the "Stolen Kiss" analogy (Kant/Danto-ish). A kiss given out of duty vs. love feels the same but *is* different.
      *   **Goodman & Dutton Revisited:** Adapt them for the "perfect" scenario. Goodman says we look for differences. But even if we *can't* find them, the *category* changes. Dutton says we value achievement. Mimicry is a lesser achievement than origination in the context of art history.
      *   **The Core Argument (Intentionality):** The original embodies a specific artistic problem solved for the first time. The forgery solves the problem of "copying." The aesthetic merit lies in the *solution to the artistic problem*, not just the visual result.
      *   **Counter-Counter Argument:** What if we don't know it's a forgery? (The "Secret Forgery"). Does the value drop only upon discovery? Yes, because aesthetic judgment is cognitive. We revise judgments based on new category information.
      *   **Conclusion:** Reiterate the verdict. The forgery is an aesthetic hollow. It mimics the body of the art but lacks its soul (origin).

  5.  **Refining the "Perfect" Constraint:**
      *   The prompt specifies: "no test, now or ever, could distinguish it." This kills Goodman's specific argument about "training the eye to see differences." I must pivot Goodman. It's not about *seeing* the difference physically, but seeing the work *as* different categorically.
      *   I need to make sure I don't just say "it's immoral." I must prove it's *aesthetic*.
