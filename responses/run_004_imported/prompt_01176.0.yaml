  2.  **Choose the Structure:**
      *   *Infinitism:* Hard to depict narratively. How do you show an infinite regress in a finite story? It risks feeling like "turtles all the way down" clichés.
      *   *Coherentism:* More narratively satisfying. A loop implies a connection between cause and effect that defies linear time or hierarchy. It allows for a "reveal" where the end connects to the beginning.
      *   *Decision:* I'll go with **Metaphysical Coherentism**. It allows for a tighter narrative loop and a more visceral sense of "everything holds everything else up."

  3.  **Brainstorming Settings & Characters:**
      *   *Setting:* Needs to be a place where structure matters. Architecture? A bureaucracy? A magical system? A digital simulation?
      *   *Idea 1:* An architect discovering a building supports itself. (A bit abstract).
      *   *Idea 2:* A historian finding records that reference future events which cause the past events. (Time travel-ish, maybe too sci-fi).
      *   *Idea 3:* A restoration expert working on an ancient artifact or structure.
      *   *Selection:* Let's go with an **Archivist/Restorer** in a fantastical or slightly surreal library/city. Let's make it a city built on a cliff or a spire, where "foundation" is literal and metaphorical.
      *   *Character:* Elara, a Structural Auditor. Her job is to find cracks in the foundation.

  4.  **Developing the Plot:**
