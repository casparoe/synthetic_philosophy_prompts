answer: |-
  The chain hummed. It was a low, thrumming vibration that Elara felt in her teeth more than she heard with her ears. She stood on the inspection platform, the wind from the lower abyss tugging at her coat, and clipped her harness onto the link before her.

  "Level four thousand," she whispered into her recorder. "Tension nominal. Corrosion minimal. Continuing descent."

  Elara was a Foundation Auditor for the Spire of Aethel. Everyone knew how the Spire stood. It was simple physics, simple metaphysics. The great floating city hung from the Chain of Causality. The Chain went down, link by heavy iron link, through the clouds, through the dark, until it hooked into the Bedrock. The Bedrock was the Unmoved Mover. The Fundamental. It didn't hang from anything; it just *was*. Everything above existed *in virtue of* the Bedrock holding the Chain, which held the Spire.

  If the Chain ended, the Spire fell. If the Bedrock cracked, reality dissolved.

  Elara's job was to make sure the Chain didn't rust through. She had been descending for three weeks. By all calculations, by all ancient texts, she should have hit the Bedrock ten thousand feet ago.

  She rappelled over the edge. The darkness below was absolute, but the links glowed with a faint, residual luminescence. *Clang.* Her boots hit the next link. She unclipped, moved down, clipped again.

  *Clang.*

  "Level four thousand five hundred," she said. Her voice sounded thin. "Still no terminal node."

  She checked her gauge. The tension on the line wasn't increasing as she went deeper, which was odd. Usually, the lower links bore the weight of everything above. These links felt... taut, but light. As if they were being pulled from both ends.

  She descended another thousand feet. The air grew stale, recycled. It smelled of ozone and old paper, not the damp mineral scent of deep earth.

  "Level five thousand five hundred," she said. "Atmosphere is artificial. Recalculating depth."

  Panic, cold and sharp, pricked at her neck. If the atmosphere was artificial, she wasn't in the natural world below the Spire. She was still *inside* something. But what could contain the bottom of the Chain?

  She reached a junction. A massive node where three chains converged. In a standard foundation, this would be a distribution point, spreading the weight of the Spire down into the Bedrock. But the geometry was wrong. The chains didn't angle down toward a center of gravity. They angled *up*.

  Elara shimmied across the node to the central strand. She pulled out her magnifying lens and inspected the iron. It was identical to the link she had started on three weeks ago. Same casting mark. Same hairline fracture near the weld.

  She froze.

  She knew that fracture. She had filed a report on it her first day. It was on Link Alpha-1, the very top connection point in the Spire's engine room, where the Chain attached to the city.

  "No," she breathed. "Impossible."

  She scrambled down the link, counting the rivets. One, two, three... She knew the pattern. She had memorized the top links for safety protocol. She reached a distinctive scar in the metal, a gouge from a maintenance drone fifty years ago.

  She was back at the top.

  Elara hung suspended in the dark, her harness the only thing keeping her from falling, though she no longer knew which way was down. She had descended in a straight line, following the gravity of explanation, the weight of existence, and she had arrived back at the beginning.

  The Spire wasn't hanging from the Bedrock. The Spire was hanging from itself.

  Her breath hitched. The nausea hit her like a physical blow. She doubled over, retching dryly. If there was no Bedrock, what stopped the fall? If the Chain didn't hook into something *fundamental*, something that didn't need support, then the whole structure was... groundless.

  It was a circle. A snake eating its tail. The Spire existed in virtue of the Chain, and the Chain existed in virtue of the Spire.

  "It should collapse," she whispered to the dark. "It has to collapse."

  Without a foundation, without a bottom layer of reality that just *is*, nothing should stand. A house needs a floor. A sentence needs a subject. A world needs a ground.

  She waited for the groan of metal, the snap of tension, the rush of wind as the Spire plummeted into the void.

  Nothing happened.

  The hum continued. Steady. Rhythmic.

  Elara straightened up. She looked at the link beneath her boots. It was pulling down. She looked at the link above her head. It was pulling up. But they were the same link. The tension wasn't coming from a weight below; it was coming from the curvature of the system itself.

  The realization hit her slowly, washing away the nausea, leaving a strange, vertiginous lightness in its place.

  She had spent her life believing that things were real because they rested on something else. She believed she was real because her parents existed, who were real because their parents existed, all the way back to the First Life. She believed the laws of physics held because they were grounded in the Fundamental Constants.

  But if the Chain looped... then nothing was primary. The engine room didn't hold the Chain; the Chain held the engine room. The cause and the effect were holding hands in the dark, keeping each other upright.

  She unclipped her harness.

  Protocol screamed at her. *Never detach from the Ground.*

  But there was no Ground. There was only the Loop.

  Elara floated in the center of the great iron circle. She pushed off a link and drifted. She wasn't falling. She was orbiting. The stability of the Spire didn't come from below; it came from the coherence of the whole. Every bolt, every brick, every breath was justified not by where it came from, but by where it fit.

  A laugh bubbled up in her throat, bright and jagged. She had been terrified of the abyss, of the moment the explanation would run out and she'd find nothing but void. But the void was impossible. You couldn't run out of explanation if the end fed the beginning.

  She pulled her recorder from her belt.

  "Level... undefined," she said. Her voice was steady now. "Terminal node negative. Foundation negative."

  She looked at the iron ring stretching into the infinity of the dark, curving back to meet itself.

  "Structure is self-sustaining," she said. "We are not held up. We are holding on."

  Elara clipped her harness back onto the link, not because she needed to stop herself from falling, but because she chose to be part of the tension. She began to climb, not up, not down, but *along*. The Spire hummed around her, a song with no first note, no last note, just the music itself, hanging in the air, needing nothing but its own melody to remain true.
