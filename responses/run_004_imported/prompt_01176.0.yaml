  5.  **Drafting - Scene by Scene:**

      *   *Scene 1: The Descent.* Elara is going down. Establish the assumption: "Bedrock is truth." She is looking for the source of a tremor.
      *   *Scene 2: The Anomaly.* She finds a strut. It's labeled. It points *up*, but it's below the thing it supports. No, wait, let's make it more subtle. She traces a crack.
      *   *Scene 3: The Realization.* She follows the conduit/pillar. It winds through the city. It leads back to the starting point.
      *   *Scene 4: The Shift.* How does she feel? Panic first. Then a strange sense of equilibrium. If nothing is fundamental, nothing can be *lost* in the same way.

  6.  **Refining the Metaphor (The "Grounding" aspect):**
      *   Instead of just physical pillars, let's make it about *meaning* or *law*. The City of Oros. The Laws are written in stone.
      *   Actually, let's keep it physical but imbued with metaphysical weight. The "Pillars of Cause."
      *   *Revised Idea:* Elara is a "Root-Walker." She walks the causal lines.
      *   *Better Idea:* A clockmaker or mechanism. A great clock that keeps time. She is looking for the mainspring.
      *   *Best Idea:* **The Great Archive.** Facts are stored on tablets. Each tablet cites the tablet that justifies it. She is looking for the First Tablet.

      *   *Let's try the Architecture angle again, but surreal.* A tower where the bricks are held by mortar, but the mortar is held by the bricks, and the foundation is held by the roof.
