prompt: |-
  My co-founder and I have spent the past two weeks negotiating our equity split, and the sticking point is a genuine factual disagreement: I think there's a good chance, maybe 70%, that our main technical risk is solvable within six months, while she puts it closer to 40%, and that gap is a big part of why we can't settle on a fair split. We've each walked the other through our full reasoning more than once, openly and honestly, but neither of our numbers has moved. An advisor of ours with a background in decision theory says this is itself revealing: he argues that Aumann's agreement theorem shows two honest Bayesians cannot agree to disagree once their probability estimates are common knowledge, so our continued disagreement after all this open conversation means one of us must be reasoning irrationally, and that further honest discussion should eventually force our estimates to converge. Is he interpreting the theorem correctly, and should we take his advice and keep talking until we land on the same number?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Situation:** Two co-founders are negotiating equity split.
      *   **Sticking Point:** Disagreement on the probability of solving a technical risk (70% vs. 40%).
      *   **History:** Two weeks of negotiation, multiple open/honest discussions explaining reasoning.
      *   **Advisor's Claim:** Cites Aumann's Agreement Theorem. Claims that since they are honest Bayesians with common knowledge of estimates, they *must* converge. Therefore, one is irrational, and more talking will fix it.
      *   **Questions:** Is the advisor interpreting the theorem correctly? Should they keep talking until they land on the same number?

  2.  **Evaluate Aumann's Agreement Theorem:**
      *   *What is it?* Robert Aumann (1976) proved that two agents with common priors and common knowledge of each other's posterior probabilities cannot agree to disagree.
      *   *Key Assumptions:*
          1.  **Common Priors:** Both start with the same prior probability distribution before receiving private information.
          2.  **Common Knowledge:** They know each other's estimates, they know that they know, etc. (This seems met based on the prompt).
          3.  **Bayesian Rationality:** Both update beliefs strictly according to Bayes' rule.
          4.  **Honesty:** They report true beliefs (no strategic lying).
      *   *Real-world Applicability:* Extremely low. Humans are not perfect Bayesians. Priors are rarely common (different backgrounds, experiences, risk tolerances). "Common knowledge" in the game-theoretic sense is very strong (do they *really* understand each other's evidence perfectly?).
      *   *Advisor's Interpretation:* The advisor is applying a theoretical mathematical result to a messy human psychological/business situation. The claim that "one of us must be reasoning irrationally" is technically true *if* the assumptions hold, but the assumptions almost certainly *don't* hold. Therefore, concluding that "more talking will fix it" is a leap.

  3.  **Evaluate the Specific Situation:**
      *   **Equity Split vs. Technical Risk:** Why does a technical risk probability dictate equity? Usually, equity is split based on contribution, role, opportunity cost, past track record, etc. A technical risk probability affects *valuation* or *vesting milestones*, not necessarily the *split* of ownership between founders (unless one is responsible for the tech and the other isn't). This suggests the underlying negotiation framework might be flawed.
      *   **The Disagreement:** 70% vs. 40% is significant. Why? Different technical backgrounds? Different risk tolerances? Different information?
      *   **The "Irrationality" Claim:** Labeling one founder irrational is toxic for a co-founder relationship.
      *   **The "Keep Talking" Advice:** Diminishing returns. They've talked for two weeks. Numbers haven't moved. More talking might just cause resentment.

  4.  **Formulate the Response:**

      *   **Direct Answer:** No, the advisor is not interpreting the theorem correctly *in this context*, and no, you should not just keep talking expecting convergence.
      *   **Explain Aumann's Theorem (Simplified):** Acknowledge the theorem exists but highlight the strict assumptions (Common Priors, Perfect Bayesian Rationality).
      *   **Why it Doesn't Apply Here:**
          *   *Priors:* Founders have different experiences (different priors).
          *   *Rationality:* Humans use heuristics, not pure Bayes.
          *   *Common Knowledge:* Do they truly share *all* evidence? Or just their conclusions?
      *   **The Danger of the Advisor's Advice:**
          *   Labeling a partner "irrational" is relationship poison.
          *   Diminishing returns on discussion.
          *   False hope of convergence.
      *   **Alternative Solutions (Actionable Advice):**
          *   *Decouple Equity from Risk:* Equity should reflect contribution/role. Risk affects valuation or vesting.
          *   *Milestone-Based Vesting:* Tie equity to solving the risk. If it gets solved, great. If not, adjustments happen.
          *   *Third-Party Technical Assessment:* Get an expert opinion to break the deadlock.
          *   *Bet on the Disagreement:* Structure the deal to accommodate both views (e.g., dynamic equity split).
      *   **Conclusion:** Respect the disagreement, structure around it, don't try to mathematically force consensus where human judgment differs.

  5.  **Refine the Tone:**
      *   Empathetic but firm.
      *   Respectful of the advisor's intelligence but critical of the application.
      *   Focus on preserving the co-founder relationship.

  6.  **Self-Correction/Nuance Check:**
      *   *Did I explain Aumann correctly?* Yes, emphasize "Common Priors." That's the biggest breaker.
      *   *Is the equity split logic sound?* It's weird to tie equity split directly to technical risk probability unless it's about who is taking more risk. I should point out that this might be the wrong variable to negotiate on.
      *   *Is the advisor wrong?* The advisor is theoretically right but practically wrong. I need to make that distinction clear.

  7.  **Final Polish:** Organize into clear sections: The Theorem, The Reality, The Relationship Risk, Better Approaches. (This matches the structure of the drafted response).

  **(Self-Correction during drafting):** I need to make sure I don't dismiss the advisor entirely as "stupid." Decision theory is valid, but its application here is category error. I should phrase it as "theoretically sound but practically inapplicable."

  8.  **Final Output Generation** (similar to the provided good response).
answer: |-
  Your advisor is citing a fascinating piece of mathematical theory, but **he is misapplying it to your situation.** Following his advice to "keep talking until you converge" is likely to waste more time and damage your co-founder relationship without solving the business problem.

  Here is a breakdown of why the theorem doesn't apply, why the advisor's conclusion is dangerous, and how you should actually handle the disagreement.

  ### 1. The Theory vs. Reality of Aumann's Agreement Theorem
  Robert Aumann's 1976 theorem is a rigorous mathematical result, but it relies on assumptions that almost never exist in the real world, especially between startup co-founders.

  *   **Common Priors:** The theorem assumes both parties start with the *exact same* prior probability distribution before receiving private information. In reality, you and your co-founder have different backgrounds, technical expertise, risk tolerances, and past experiences. Your "priors" are fundamentally different.
  *   **Perfect Bayesian Rationality:** The theorem assumes both agents update their beliefs strictly according to Bayes' rule without cognitive bias. Humans are not perfect Bayesians; we suffer from optimism bias, anchoring, overconfidence, and loss aversion.
  *   **Common Knowledge of Evidence:** It requires that you not only know each other's estimates but fully understand the *evidence* behind them in the same way the other person does. You mentioned you've walked each other through your reasoning, but truly internalizing another person's mental model is notoriously difficult.

  **The Verdict:** The fact that you disagree does not prove one of you is "irrational." It proves you are humans with different priors and heuristics. The theorem describes idealized mathematical agents, not startup founders.

  ### 2. The Danger of the Advisor's Advice
  Taking the advisor's suggestion carries significant risk:

  *   **Relationship Poison:** The advisor's logic implies that if you don't converge, one of you is "reasoning irrationally." Internalizing this view creates a dynamic where one founder feels superior and the other feels defective. This is toxic for a partnership that needs to survive high-stress situations.
  *   **Diminishing Returns:** You have spent two weeks discussing this openly. The low-hanging fruit of information sharing has been picked. More conversation is unlikely to reveal new data; it will likely just reinforce existing positions.
  *   **False Consensus:** If you force a number just to satisfy the theory, you might land on a compromise (e.g., 55%) that neither of you actually believes is accurate. This creates "fake alignment," which is dangerous when you need to make hard decisions later based on that risk assessment.

  ### 3. Reframing the Problem: Equity vs. Risk
  There is a deeper issue here: **You are negotiating the wrong variable.**

  A disagreement about technical risk probability should rarely dictate the **equity split**. Equity splits are typically based on:
  *   Past contributions (IP, code, network).
  *   Future roles and responsibilities.
  *   Opportunity cost (salary foregone).
  *   Commitment level.

  The probability of technical success affects the **valuation of the company** or the **vesting schedule**, not necessarily how much of the company each founder owns relative to the other.

  If the technical risk is the sticking point, it suggests you are trying to use equity to hedge against performance risk. There are better mechanisms for this.

  ### 4. Better Solutions than "More Talking"
  Instead of trying to force your probability estimates to converge, structure the deal to accommodate the disagreement.

  **A. Milestone-Based Vesting (Dynamic Equity)**
  Tie a portion of the equity to the resolution of the technical risk.
  *   *Example:* Split the equity 50/50 now, but put 20% of the total pool into a milestone bucket. If the technical risk is solved within six months, the bucket vests. If not, it returns to the option pool or shifts based on a pre-agreed formula.
  *   *Benefit:* This respects both probability estimates. If the 70% person is right, they get the equity. If the 40% person is right, the company is protected.

  **B. Third-Party Technical Audit**
  If the disagreement is purely technical, stop debating it yourselves.
  *   *Action:* Hire a trusted CTO-for-hire or technical advisor to evaluate the risk for a few hours.
  *   *Benefit:* This introduces new information (an expert prior) that can break the deadlock without either founder having to concede "irrationality."

  **C. Decision Rights**
  If one founder is the technical lead, their assessment of technical risk should carry more weight, regardless of equity split.
  *   *Action:* Agree that the CTO/Technical Lead has final say on technical feasibility timelines, while the CEO has final say on commercial strategy.
  *   *Benefit:* This aligns ownership with responsibility.

  ### Summary
  Your advisor is treating a human negotiation like a math problem. **Do not keep talking expecting to converge.** You are not Aumann agents.

  1.  **Acknowledge the disagreement:** Accept that you view the risk differently and that both views are valid given your different perspectives.
  2.  **Stop negotiating equity based on risk:** Move the risk conversation to vesting milestones or project timelines.
  3.  **Preserve the relationship:** Do not allow a theoretical framework to label your partner as irrational.

  The goal of a co-founder agreement is not to prove who is right about the future; it is to create a structure that allows the company to survive regardless of who turns out to be right.
