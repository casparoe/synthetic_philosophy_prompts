      *   **The Mixed Strategy (Coin Flip):** CDT proponents (like Harper) argue that assigning probability 0.5 to each action makes the expected utility of both actions equal, stabilizing the choice.
      *   **EDT (Evidential Decision Theory):** Focuses on conditional probability $P(State|Action)$. Since Death predicts perfectly, $P(Death=D|Stay) \approx 1$ and $P(Death=A|Flee) \approx 1$. Both actions lead to death with high probability. EDT usually recommends whatever action gives the *slightest* edge or admits indifference, but often struggles with the "why bother?" aspect. Actually, in the strict Gibbard/Harper setup, EDT also faces issues because the evidence of your choice *is* the evidence of your death.
      *   **Functional Decision Theory (FDT) / Timeless Decision Theory (TDT):** These are the "radical alternatives." They treat the decision as an output of a decision algorithm. If Death predicts based on simulating your algorithm, your decision *logically* determines Death's location. Therefore, you can't escape. But FDT argues you should act as if your decision determines the prediction.
