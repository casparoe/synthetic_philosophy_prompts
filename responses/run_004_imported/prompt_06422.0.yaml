      *   The catch (You need a distribution that spans the possibilities).

  11. (Self-Correction on "Any Distribution"): The prompt says "any distribution you want." I need to be careful. If I pick $T$ uniformly from [1, 2] and the envelopes have [100, 200], the probability $T$ falls between them is 0. So the win rate is exactly 50%. The theorem requires the support of $T$ to cover the possible values of the envelopes. I will clarify this nuance without being pedantic. The prompt implies "any *reasonable* distribution" (like exponential). I'll stick to that interpretation but add a small footnote about support.

