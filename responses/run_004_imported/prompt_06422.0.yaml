      *   Emphasize that you don't need to know $A$ and $B$. You just need a non-zero chance of landing between them.

  7.  **Addressing the "Fixed Amounts" concern:**
      *   User asked: "even if someone rigged the envelopes in advance with fixed amounts."
      *   Response: Yes, because the randomness comes from *you* (picking the envelope) and *your threshold generator*. The host's fixed amounts just define the target interval. As long as your distribution covers that interval, you win more than half the time.

  8.  **Final Polish:**
      *   Check tone: Conversational, encouraging, respecting their existing knowledge (AP Stats level).
