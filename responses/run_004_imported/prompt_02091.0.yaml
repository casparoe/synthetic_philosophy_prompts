answer: |-
  You are right to feel that something was off in your friend's argument. While your friend is technically correct about the *math* of Harsanyi's Aggregation Theorem, they are conflating **two distinct arguments** made by Harsanyi and mischaracterizing Rawls's setup in the process.

  Here is the tiebreaker breakdown you can use to settle the argument.

  ### 1. The Conflation: Aggregation Theorem vs. Equiprobability Model
  Your friend claimed that the **Aggregation Theorem** *is* the **Veil of Ignorance** move. **This is false.**

  *   **Harsanyi's Aggregation Theorem (1955):** This is a formal theorem about preference aggregation. It states that if individual preferences satisfy von Neumann-Morgenstern (vNM) rationality axioms, and social preferences satisfy vNM axioms *plus* the Pareto Principle, then the Social Welfare Function must be a **weighted sum** of individual utilities ($W = \sum a_i U_i$).
      *   **Crucial Detail:** The theorem *does not* tell you what the weights ($a_i$) should be. It allows for unequal weights. It does *not* require you to assume an "equal chance of being anyone." It is purely about structural consistency between individual and social preferences.
  *   **Harsanyi's Equiprobability Argument (1953/1975):** This is where the "Veil of Ignorance" move comes in. Harsanyi argues that to determine the *weights* in the equation above, we must make a moral assumption: we should assign an equal probability ($1/n$) to being any specific person in society.
      *   **Result:** If you maximize expected utility with equal probabilities, the weights become equal, leading to **Average Utilitarianism**.

  **Verdict:** Your friend conflated the *Aggregation Theorem* (which proves weighted utilitarianism) with the *Equiprobability Assumption* (which proves equal weights). The "equal chance" move is **not** part of the Aggregation Theorem itself; it is a separate moral axiom Harsanyi added later to fix the weights.

  ### 2. The Real Disagreement: Harsanyi vs. Rawls on the Veil
  Once we clear up the conflation above, we get to the core of your argument: Why do Harsanyi and Rawls, both using a "Veil of Ignorance" (impartiality) setup, arrive at opposite conclusions (Utilitarian Sum vs. Maximin)?

  Your friend claims Rawls is inconsistent because the setup is the same. **This is also false.** The setups differ in two critical technical ways regarding decision theory.

  #### A. Risk vs. Uncertainty (The Probability Assumption)
  *   **Harsanyi (Risk):** Harsanyi assumes that behind the veil, you **know the probabilities**. You know there are $n$ people, so you assign a $1/n$ probability to being each one. Because you have known probabilities, standard decision theory dictates you should **maximize expected utility**.
      *   *Math:* $E[U] = (1/n)U_1 + (1/n)U_2 + ...$
      *   *Outcome:* Utilitarianism.
  *   **Rawls (Uncertainty):** Rawls argues that behind the veil, you **do not know the probabilities**. You don't know the distribution of classes, talents, or wealth in the society you are designing. Because you cannot calculate expected utility (no probabilities), and the stakes are fundamental (your basic liberties and life prospects), standard expected utility maximization is irrational.
      *   *Outcome:* You must protect against the worst-case scenario.
      *   *Outcome:* Maximin.

  #### B. The Conception of the Good (Utility vs. Primary Goods)
  *   **Harsanyi:** Assumes individuals have vNM utility functions that can be cardinally measured and compared. He assumes people are risk-neutral regarding social positions.
  *   **Rawls:** Argues that behind the veil, you don't know your specific conception of the "good" (what gives you utility). Therefore, you cannot maximize utility. Instead, you maximize **Primary Goods** (rights, liberties, opportunities, wealth). Rawls argues that rational agents will be extremely risk-averse regarding primary goods because falling into the bottom tier means losing the capacity to pursue *any* conception of the good.

  ### 3. The Crux: Why Maximin isn't "Inconsistent"
  Your friend argued Rawls was inconsistent for getting Maximin out of an impartial setup. Rawls's defense (and the standard counter to Harsanyi) is that **Maximin is the rational choice under specific conditions of extreme uncertainty and high stakes.**

  Harsanyi treats the Veil of Ignorance as a **gambler's choice** (I might win the lottery of birth, I might lose; I'll bet on the average).
  Rawls treats the Veil of Ignorance as a **constitutional choice** (If I lose the lottery of birth, I might be enslaved or starve; I must ensure the floor is high enough to be free).

  Rawls explicitly lists three conditions where Maximin is rational:
  1.  **Ignorance of Probabilities:** (As mentioned above).
  2.  **Guaranteeable Minimum:** You care more about the floor than the ceiling.
  3.  **Unacceptable Outcomes:** The worst-case scenario in a Utilitarian society (e.g., being the sacrificed minority for the greater good) is intolerable.

  ### Summary for the Tiebreaker

  You can tell your friend this:

  1.  **On the Aggregation Theorem:** You are right that Harsanyi's Aggregation Theorem proves a weighted sum is required for Pareto efficiency. **However**, you are wrong that this theorem includes the "equal chance" assumption. That is a separate argument (the Equiprobability Model). The Aggregation Theorem allows for unequal weights; the moral assumption of impartiality is what forces them to be equal.
  2.  **On Rawls's Consistency:** Rawls is not inconsistent because he rejects Harsanyi's decision-theoretic premises. Harsanyi assumes **Risk** (known probabilities) $\rightarrow$ Expected Utility $\rightarrow$ Utilitarianism. Rawls assumes **Uncertainty** (unknown probabilities) + High Stakes $\rightarrow$ Maximin $\rightarrow$ Difference Principle.
  3.  **The "Bait-and-Switch":** You were right. Your friend treated Harsanyi's *mathematical* proof (Aggregation) as if it were his *moral* argument (Equiprobability), and then treated Harsanyi's *moral* argument as if it were identical to Rawls's *moral* argument. They look similar (impartiality), but they rely on different models of rationality.

  **Winner:** You win on the technical distinction. Harsanyi and Rawls are using different decision rules under the veil, not the same one. Rawls isn't inconsistent; he simply disagrees with Harsanyi about what constitutes "rational choice" when the stakes involve basic human liberty.
