answer: |-
  This is a magnificent premise. You have identified the precise fault line that runs through classical Indian epistemology (*pramāṇa-śāstra*). B. K. Matilal's *Epistemology, Logic, and Grammar in Indian Philosophical Analysis* is indeed the essential guide here, particularly his discussions on the "reduction of testimony."

  To stage this debate without caricature, you must avoid making the Buddhist a skeptic who believes nothing, or the Naiyāyika a dogmatist who believes everything. Both are realists; they disagree on the *architecture* of justification.

  Here is a breakdown of the philosophical mechanics, the handling of hard cases, and a judgment on who holds the stronger position for your narrative.

  ### 1. The Mechanism: What Does the Epistemic Work?

  **The Buddhist Logician (Dignāga/Dharmakīrti Lineage)**
  *   **The Thesis:** There are only two *pramāṇas*: *Pratyakṣa* (perception) and *Anumāna* (inference). *Śabda* (testimony) is not a third category.
  *   **The Mechanism:** When I hear you say, "There is fire on the hill," I do not know "fire" directly from your words. Words are sounds (*dhvani*). I perceive the sound. I recall the convention that this sound means "fire." Then, I perform an inference:
      1.  *Premise 1:* This speaker is competent and truthful (established by their reputation, lack of contradiction, or status as a Buddha).
      2.  *Premise 2:* A competent, truthful person would not assert X unless X were the case.
      3.  *Conclusion:* Therefore, X is the case.
  *   **The Epistemic Work:** The work is done by the *inference of the speaker's reliability*. The words are merely the *liṅga* (sign/mark) from which I infer the state of the world. If I suspect you are lying or mistaken, the knowledge collapses. Thus, testimony is parasitic on inference.

  **The Naiyāyika (Vātsyāyana/Uddyotakara Lineage)**
  *   **The Thesis:** *Śabda* is an independent *pramāṇa*. It cannot be reduced to inference.
  *   **The Mechanism:** Knowledge from testimony arises from *understanding the meaning* of the sentence, provided the speaker is reliable (*āpta*). The relation between word and meaning (*śakti* or *saṅketa*) is established by convention (or God), but once learned, it functions directly.
  *   **The Epistemic Work:** The work is done by the *syntactic and semantic connection* (*ākāṅkṣā*, *yogyatā*, *āsatti*). When I hear the sentence, I grasp the meaning immediately. I do not consciously think, "He is reliable, therefore I believe him." I simply understand. The reliability of the speaker is a *condition* for the knowledge, not the *cause* of the knowledge.
  *   **Key Distinction:** In inference, I must know the universal connection (*vyāpti*) between the sign (smoke) and the thing signified (fire) *beforehand*. In testimony, I do not know a universal connection between "your speech" and "the world." I know the connection between "your words" and "your meaning."

  ### 2. The Hard Cases: Chains and Remote History

  This is where your debate will live or die.

  **Case A: Long Chains of Relayed Testimony (Tradition/Āgama)**
  *   **The Buddhist Challenge:** If testimony is inference, every link in the chain is a new inference. $A$ tells $B$, $B$ tells $C$. $C$'s knowledge depends on inferring $B$'s reliability, which depends on $B$ inferring $A$'s reliability. Like a game of "telephone," the probability of error compounds. Therefore, ancient texts cannot yield certain knowledge, only probable belief.
  *   **The Nyāya Defense:** Nyāya distinguishes between the *psychological chain* and the *preservation of meaning*. If the tradition is maintained by those dedicated to truth (like Vedic reciters or monastic lineages), the *content* is preserved intact. The knowledge is not generated anew at every link; it is *transmitted*. The reliability attaches to the *statement*, not just the immediate speaker.
  *   **Who has the edge?** The Buddhist has the better *probabilistic* argument (chains do weaken). But the Nyāya has the better *sociological* argument (institutions exist specifically to prevent that weakening).

  **Case B: Remote History / Uncheckable Facts**
  *   **The Buddhist Challenge:** If I cannot verify a claim by perception (seeing it) or inference (seeing its causal trace), I cannot know it. If a text says, "King X performed a sacrifice 500 years ago," and I have no causal trace of that sacrifice today, I cannot infer it. Therefore, history is not knowledge (*pramā*); it is at best useful convention.
  *   **The Nyāya Defense:** We accept the testimony of a reliable person (*āpta*) regarding things beyond our senses (*atīndriya*). If the speaker has access to the truth (through perception or their own reliable testimony), and they are truthful, I know it. To demand independent verification for everything is to paralyze human action. We plant seeds based on farmers' testimony, not by inferring the harvest from the seed every time.
  *   **Who has the edge?** Nyāya. The Buddhist position here borders on a skepticism that makes daily life (and monastic lineage) impossible.

  ### 3. The "Trump Card": Language Acquisition

  This is the argument that can secure a victory in your scene. It is the strongest Nyāya counter-attack against the Buddhist reduction.

  *   **The Argument:** The Buddhist claims testimony is inference based on knowing the reliability of the speaker and the convention of words. But **how does one learn the convention of words in the first place?**
  *   **The Trap:** A child learns that "cow" means *cow* because a parent points and says "cow." This is *testimony*. If all testimony is inference, the child must *infer* the meaning of "cow" from the parent's behavior. But to make that inference, the child must already understand the parent's intention and the reliability of their speech. But they can only understand that if they already know the language.
  *   **The Conclusion:** You cannot reduce testimony to inference without falling into a vicious circle. To learn the rules of inference (including the inference of reliability), you must rely on testimony. Therefore, testimony is foundational; inference is secondary.

  ### 4. The Verdict: Who Wins?

  For the purposes of a novel that seeks intellectual authenticity rather than historical revisionism, **the Naiyāyika should win this specific round.**

  **Why?**
  While Dignāga and Dharmakīrti are logically sharper and force Nyāya to refine its definitions (which historically they did, leading to Navya-Nyāya), on the specific issue of *śabda*, the Buddhist reduction is widely considered the more vulnerable position in later Indian philosophy.

  1.  **Self-Defeat:** The Buddhist monk is relying on the texts of Dignāga and Dharmakīrti to argue that texts do not yield independent knowledge. If his own position is true, his own authority is merely an inference subject to error. The Naiyāyika can point out this performative contradiction.
  2.  **The Hard Cases:** As noted above, the Buddhist inability to account for remote history or the acquisition of language makes their epistemology too brittle for human life. The Nyāya position accommodates the social nature of knowledge.
  3.  **The Stakes:** In a monastic university, the curriculum *is* testimony (scripture, commentaries). If the Buddhist wins completely, he invalidates the education of everyone in the hall. The Naiyāyika defends the possibility of the debate itself.

  **The Nature of the Defeat:**
  Do not make the Buddhist look foolish. Make him look *too pure*. He is defeated not by a lack of logic, but by an excess of rigor that severs the branch he sits on. He is the radical skeptic who proves nothing can be known, while the Naiyāyika is the pragmatic realist who shows how we actually know things.

  ### 5. Dramatic Suggestions for the Scene

  To make this feel real rather than decorative, focus on the *rhythm* of the debate (*vāda*) and the specific metaphors used.

  **The Setup:**
  *   **The Moderator:** There should be a *Madhyastha* (referee) who ensures the rules of debate are followed (no ad hominem, no shifting definitions).
  *   **The Stakes:** It's not just abstract. If *śabda* is invalid, the Vedas (for Nyāya) or the Buddha's Sutras (for the Buddhist) lose their epistemic authority. This is soteriological.

  **Dialogue Cues & Metaphors:**

  *   **The Buddhist Metaphor (The Lamp):** The Buddhist might argue: "Words are like a lamp. A lamp reveals an object, but the knowledge comes from seeing the object, not the lamp. Similarly, words reveal the meaning, but the knowledge comes from inferring the reality."
  *   **The Nyāya Counter (The Messenger):** The Naiyāyika should reply: "No. Words are like a trusted messenger. If a messenger brings a letter from the King, I do not infer the King's order from the messenger's face. I know the order *from the letter*. The messenger is merely the vehicle."
  *   **The Climax (Language Acquisition):**
      *   *Buddhist:* "You believe the teacher because you infer he is reliable."
      *   *Naiyāyika:* "And how did I learn the word 'reliable'? Did I infer that too? If I need inference to learn the words for inference, I must have known the words before I knew the inference. But I learned the words from *you*. You are asking me to use a ladder I have not yet built to climb to the place where the ladder is kept."

  **The Moment of Defeat:**
  The Buddhist monk realizes that to defend his position, he must speak. By speaking, he demands the Naiyāyika accept his *śabda*. If the Naiyāyika accepts it, he concedes *śabda* works. If he rejects it, the debate ends. The Buddhist is trapped in the very medium he seeks to reduce.

  **A Note on Tone:**
  The Buddhist should be calm, precise, almost surgical. He cuts distinctions. The Naiyāyika should be grounded, robust, appealing to the common experience of learning and living. The Buddhist fights for *Ultimate Truth* (*paramārtha-satya*); the Naiyāyika fights for *Conventional Truth* (*vyavahāra-satya*)—and in a debate about human knowledge, the latter is harder to dislodge.

  ### Summary for Your Drafting

  *   **Nyāya Core:** Testimony is immediate understanding conditioned by reliability.
  *   **Buddhist Core:** Testimony is inference based on the speaker's trustworthiness.
  *   **Winning Argument:** The acquisition of language requires testimony prior to inference.
  *   **Winner:** The Naiyāyika (on pragmatic and coherence grounds).
  *   **Loser:** The Buddhist (on grounds of self-referential inconsistency and excessive skepticism).

  This setup honors the depth of Matilal's analysis while giving you a dramatic arc where the "winner" defends the possibility of shared human understanding against a logic that, while sharp, threatens to dissolve it.
