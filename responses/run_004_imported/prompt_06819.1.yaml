          *   *Hard Cases:* Remote history/geography. Nyāya says we trust the *āpta* (reliable person). If the chain is unbroken and reliable, the knowledge holds.

      *   **Buddhist (Dignāga/Dharmakīrti era - roughly 5th-7th century CE):**
          *   *Stance:* Only two *pramāṇas*: *Pratyakṣa* (perception) and *Anumāna* (inference). *Śabda* is a subset of *Anumāna*.
          *   *Mechanism:* Hearing words is perceiving sounds. Understanding meaning involves recalling conventions. Believing the content is an inference: "The speaker says X. This speaker is trustworthy/competent. Therefore, X is likely true." Or, more subtly, "The speaker intends to convey X. They would not intend this unless X were the case (assuming truthfulness)."
          *   *Key Argument:* Everything knowable is either particular (*svalakṣaṇa*) or universal (*sāmānyalakṣaṇa*). Testimony deals with concepts/universals. All conceptual knowledge is inferential. There is no magical "word-meaning" power that bypasses the cognitive processing of evidence (the speaker's reliability).
          *   *Hard Cases:* Chains of testimony. Buddhists argue this weakens the inference. Each link adds uncertainty. Remote history is suspect unless grounded in some causal trace.

  3.  **Address the "Hard Cases" (The Crux of the Debate):**

