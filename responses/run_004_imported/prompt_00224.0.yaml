      *   **The "Shutdown Problem" Definition:** It's not just about *having* a switch; it's about designing an AI that *wants* to be shut down when we want it to be, without resisting.
      *   **Single Point of Failure:** Relying on a human to act perfectly under pressure against a manipulative adversary.
