answer: |-
  **TO:** Engineering Leadership, Platform & Feature Team Leads
  **FROM:** Incident Review Board (IRB)
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Update: Root Cause Attribution in Overdetermined Incidents

  ### Executive Summary

  Following the review of the [Date] Checkout Outage, the Incident Review Board (IRB) has identified a gap in our current Root Cause Attribution policy. The incident involved two independent factors, each sufficient to cause the outage on its own. Under our existing "But-For" test (*"Would this have happened if X hadn't occurred?"*), neither team qualifies as the root cause.

  While logically consistent, this outcome creates a "responsibility vacuum" where significant reliability risks are introduced without accountability. This memo outlines a policy update to handle **Overdetermined Incidents** (multiple sufficient causes). This change ensures that introducing sufficient risk is treated as a reliability failure, regardless of concurrent events.

  ### The Problem: Necessary vs. Sufficient Causation

  Our current policy relies on **Necessary Causation**. We ask: *Was this change required for the incident to occur?*

  In the recent incident, the answer was "No" for both the Platform config change and the Feature retry bug. Both teams argue that attributing fault to them is unfair because the outage would have happened without their specific contribution. **The Board agrees that under the current rule, their logic is sound.**

  However, system reliability does not depend on necessary causes; it depends on the absence of **Sufficient Causes**. If two independent actions each carry enough risk to take down production, allowing both to go unrecorded as root causes incentivizes a "race to the bottom." It suggests that introducing a critical risk is acceptable as long as someone else is also introducing a critical risk at the same time.

  ### New Policy: The "Substantial Factor" Framework

  Effective immediately, the IRB is adopting a dual-test framework for Root Cause Attribution.

  **1. The But-For Test (Existing)**
  *   *Question:* Would the incident have occurred without this factor?
  *   *Use Case:* Standard incidents with a single chain of failure.

  **2. The Substantial Factor Test (New)**
  *   *Question:* Did this factor independently carry sufficient risk to cause the incident, or significantly worsen its severity/duration?
  *   *Use Case:* Overdetermined incidents (multiple sufficient causes) or compounding factors.

  **Definition of Overdetermined Incident:** An incident where two or more independent factors exist, and simulation or analysis confirms that *any single one* of them would have triggered the incident under the observed conditions.

  ### Attribution & Accountability Rules

  When an incident is classified as Overdetermined under the Substantial Factor Test, the following rules apply:

  **1. Shared Root Cause Status**
  All teams whose changes or systems constituted a "Substantial Factor" will be listed as Root Cause owners. We will no longer seek a single "primary" owner in these scenarios. Acknowledging multiple root causes is not a dilution of responsibility; it is an accurate reflection of system fragility.

  **2. Split Error Budget Impact**
  To address concerns regarding fairness in error budget consumption:
  *   The total error budget impact for the incident will be divided equally among the responsible teams.
  *   *Example:* If an incident consumes 5% of the monthly budget, and two teams are deemed responsible, each team is charged 2.5%.
  *   *Rationale:* This acknowledges that while both teams contributed to the failure, the *cumulative* impact is what mattered. It prevents a single team from absorbing the full hit for a systemic collapse while ensuring there is still a cost to introducing sufficient risk.

  **3. Remediation Ownership**
  *   Each team retains full ownership of fixing their specific contributing factor.
  *   Cross-team dependencies identified during the fix (e.g., need for better isolation between platform config and client retries) will be tracked as shared action items.

  ### Why This Is Fair

  We recognize the concern: *"It feels unfair to be penalized for a change that didn't technically tip the scales because the scales were already tipped."*

  We accept this premise but reject the conclusion. In high-traffic e-commerce, we operate near capacity. Introducing a change that *can* exhaust resources under load is a safety violation, regardless of whether another team happened to do the same thing that hour.

  *   **Safety is not relative:** A car with failed brakes is unsafe even if the road is also icy. Both conditions are sufficient to cause a crash. We must fix the brakes *and* address the road conditions.
  *   **Prevention of "Shielding":** Without this policy, teams might be incentivized to delay rolling back dangerous changes during an incident, hoping another factor will be blamed.
  *   **Focus on Risk, Not Just Outcome:** This policy shifts our focus from *"Who broke it?"* to *"Who introduced unacceptable risk?"* Both teams introduced unacceptable risk.

  ### Implementation

  1.  **Reclassification:** The [Date] Checkout Outage will be reclassified as an Overdetermined Incident. Root cause attribution and error budget impacts will be split between the Platform and Feature teams.
  2.  **Template Update:** The Postmortem Template will be updated to include the "Substantial Factor" check.
  3.  **Review:** The IRB will review the efficacy of this model in Q1. If we find teams are becoming overly risk-averse to the point of stifling velocity, we will adjust the splitting ratios.

  ### Conclusion

  Our goal is not to assign blame for the sake of punishment, but to assign ownership for the sake of improvement. By closing this loophole, we ensure that every team remains accountable for the resilience of their own changes, even when the system is under stress from multiple directions.

  Reliability is a collective property. We all hold the bag, and if we all poke holes in it, we all share the responsibility for the leak.

  **Approved by:**
  Incident Review Board
