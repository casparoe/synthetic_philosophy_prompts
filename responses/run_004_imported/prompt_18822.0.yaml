prompt: |-
  I sit on the incident review board at work -- we're a mid-size e-commerce company. We had a nasty one during a flash sale: checkout was down for about 40 minutes, and it turned out two unrelated things were happening at once -- the platform team had pushed a config change to the db connection pool that would've exhausted it under that day's traffic all by itself, and separately, a retry bug in a feature team's client library was hammering that same pool hard enough to exhaust it on its own too. We replayed that day's traffic in staging with each change reverted one at a time and confirmed either alone would've taken checkout down. Our postmortem template's root-cause test is basically 'would this still have happened if X hadn't occured,' and honestly the answer's yes for both -- so neither team clears the bar for root cause under our own policy, which matters because whoever's tagged owns the fix items and eats the error-budget hit for the quarter. Now both teams are pointing at this to say they're in the clear since 'it would've happened regardless of us,' and the board's split down the middle: half think that's a fair reading of our own rules, half think it's obviously letting two teams who both actually contributed off the hook on a technicality. A couple of us floated asking whether each factor was actually doing something at the time instead of whether it was strictly necessary, but couldn't turn that into a rule anyone trusted. Draft the memo the board should send recommending how we handle root-cause attribution in cases like this going forward -- I want something we could actually apply next time, not 'use your best judgement,' and it needs to take the 'it wasn't actually necessary so it's unfair to blame us' argument seriously instead of just brushing past it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Mid-size e-commerce company, Incident Review Board (IRB).
      *   **Incident:** Checkout down for 40 mins during a flash sale.
      *   **Cause:** Two independent factors (DB config change + Retry bug), *each* sufficient to cause the outage on its own (overdetermined causality).
      *   **Current Policy:** Root-cause test is counterfactual ("Would this have happened if X hadn't occurred?").
      *   **Problem:** Under current policy, *neither* team is at fault because the outage would have happened anyway without them. This leads to no ownership, no fix items, and no error budget impact.
      *   **Board Status:** Split 50/50. One side says "follow the rules," the other says "this is a loophole."
      *   **Goal:** Draft a memo recommending a new policy/framework for root-cause attribution in overdetermined scenarios.
      *   **Constraints:** Must be actionable (not "use best judgment"), must address the "it wasn't necessary so it's unfair" argument seriously, and needs to be suitable for an IRB to send to leadership/engineering org.

  2.  **Deconstruct the Core Problem:**
      *   The current policy relies on *necessary causation* (But-For Causation).
      *   The incident involves *sufficient causation* (Multiple Sufficient Causes).
      *   In logic/legal terms, this is the "two fires" problem. If two arsonists set fire to a house, and either fire alone would have burned it down, neither can claim "my fire wasn't necessary" to avoid liability.
      *   The engineering culture likely values blamelessness (postmortems), but accountability (error budgets/ownership) is still needed for resource allocation and prevention.
      *   The "unfairness" argument is valid: If I made a change that *would* have broken things, but someone else *also* broke things at the same time, why am I fully on the hook?
      *   *Solution Direction:* Shift from "Who broke it?" to "Who introduced risk?" or "Shared Responsibility." We need a model that acknowledges both contributed to the fragility.

  3.  **Determine the Policy Recommendation:**
      *   *Option A: Blame the first one.* (Unfair, hard to determine timing precisely).
      *   *Option B: Blame the last one.* (Unfair, encourages racing to break things).
      *   *Option C: Shared Attribution.* (Most fair for overdetermined causes).
      *   *Refinement:* We need to distinguish between *trigger* and *vulnerability*. However, in this specific case, both were vulnerabilities that became triggers due to traffic.
      *   *Best Approach:* Adopt a "Substantial Factor" test alongside the "But-For" test. If a factor was a substantial contributor to the severity or likelihood, it counts, even if not strictly necessary.
      *   *Error Budget Impact:* Split the hit. If two teams cause an outage, they share the cost. This incentivizes not being the "second match" even if the "first match" exists.
      *   *Action Items:* Both teams own fixes.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the recent incident and the specific dilemma (overdetermined causality). State the purpose: update the attribution policy.
      *   **The Problem with "But-For":** Explain *why* the current rule failed. Use the "two fires" analogy (implicitly or explicitly). Acknowledge the teams' argument (it *is* technically true it would have happened without them), but explain why that logic fails in complex systems.
      *   **New Framework:** Introduce the "Substantial Factor" test.
          *   Define it: Did this action significantly increase the probability or severity of the incident?
          *   Define Overdetermined Scenarios: When multiple independent factors are each sufficient.
      *   **Attribution Rules:**
          1.  **Shared Ownership:** In overdetermined cases, all sufficient factors share root cause status.
          2.  **Split Impact:** Error budget hits are divided (e.g., 50/50 or weighted).
          3.  **Action Items:** All parties must implement fixes.
      *   **Rationale (Addressing the "Unfairness"):** Why is this fair? Because reliability is a collective property. Introducing a sufficient risk is a failure of safety checks, regardless of what else was happening. It prevents the "race to the bottom" where teams hope someone else breaks it first.
      *   **Implementation:** How to apply this immediately.
      *   **Closing:** Commitment to system resilience over individual exoneration.

  5.  **Refining the Tone:**
      *   Needs to be authoritative but collaborative.
      *   Needs to be "Blameless" in terms of punishment (no firing), but "Accountable" in terms of process (error budgets).
      *   Avoid jargon where possible, but use precise logic terms (Necessary vs. Sufficient).
      *   *Self-Correction during drafting:* I initially thought about suggesting weighting the error budget hit based on severity. That might get messy. Let's keep it simple: Equal split unless one is clearly more egregious (which requires judgment). Let's stick to "Shared Attribution" as the default for overdetermined cases.
      *   *Crucial Point:* The prompt asks to take the "it wasn't necessary" argument seriously. I need to explicitly validate that logic before explaining why it's insufficient for system safety.

  6.  **Final Polish:**
      *   Check against constraints: Actionable? Yes. Addresses the specific argument? Yes. Suitable for IRB? Yes.
      *   Make sure the distinction between *Postmortem Learning* (Blameless) and *Error Budget Accountability* (Resource/Reliability management) is clear. This is often a point of confusion. The memo should clarify that "Root Cause" for *learning* is different than "Attribution" for *budgets*. Actually, better to keep them aligned to avoid confusion, but emphasize that attribution isn't about shame, it's about investment.

      *(Self-Correction)*: Wait, if I say "Root Cause," people hear "Blame." Let's use the term "Contributing Factor Attribution" or clarify that "Root Cause" in our policy is about *ownership of remediation*, not *punishment*. The prompt mentions error budget hits, so accountability is real. I will frame it as "Reliability Accountability."

      *Revised Plan:*
      1. Acknowledge the loophole.
      2. Validate the teams' logic (But-For is logically sound).
      3. Explain why it fails for system reliability (Risk accumulation).
      4. Propose the "Sufficient Contribution" model.
