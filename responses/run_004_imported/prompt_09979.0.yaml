          *   *Critique:* Is breathing truly the *sine qua non* of organismal life? What about pacemakers? What about the fact that the body *responds* to the ventilator (hemodynamics)?

      *   **Circulatory-Respiratory Standard (CRD):**
          *   *Definition:* Irreversible cessation of circulation and respiration.
          *   *Pros:* Clearer, historically rooted, avoids the "brain vs. body" metaphysical mess.
          *   *Cons:* The "Dead Donor Rule" (DDR) dilemma. If we wait for the heart to stop, organs degrade. If we declare death before the heart stops (as in WBD), we face the Shewmon critique. Also, the "irreversibility" clause is tricky (auto-resuscitation vs. decision not to resuscitate).

