          *   *Strength:* Aligns with legal/medical consensus and organ donation needs.
          *   *Weakness:* Shewmon's data challenges the "loss of integration" claim directly.

      *   **The President's Council on Bioethics (2008) - "Controversies in the Determination of Death":**
          *   *Shift:* Moved away from "integration" (because Shewmon showed integration persists) to "vital work" or "fundamental drive."
          *   *Criterion:* The organism must have an *internal* drive to engage the environment (paradigmatically, breathing).
