  **Tier S (Strategies 1 & 6):** These are the most defensible because they address the root causes of unfairness rather than just the symptoms. Strategy 6 (auditing labels) is foundational; in hiring, "success" labels are often noisy or biased, so validating the target variable is a prerequisite for any downstream fairness claim. Strategy 1 (Equal Opportunity) aligns best with the moral purpose of hiring—providing access to qualified candidates—and acknowledges that differing base rates often reflect historical disadvantage rather than true capability.

  **Tier A (Strategy 2):** Calibration is critical for interpretability and trust; stakeholders need to know that a risk score implies the same probability of success regardless of group membership. However, it ranks below Tier S because, given differing base rates, enforcing calibration alongside the already-met 4/5ths rule may necessitate accepting unequal error rates, which can be ethically fraught in an opportunity-allocation context.

  **Tier B (Strategy 4):** Individual fairness is theoretically appealing as it sidesteps the group-based impossibility theorems. However, it is operationally difficult to defend in practice because defining a valid "similarity metric" between applicants is subjective and can inadvertently encode protected characteristics, making it hard to audit or standardize.

  **Tier C (Strategies 5 & 7):** These introduce significant operational or legal risk. Strategy 5 (human delegation) often reintroduces the very biases automation aims to reduce and creates inconsistency liabilities. Strategy 7 (randomization) is mathematically interesting but culturally and legally perilous in hiring, where candidates expect meritocratic determinism and regulators require stable selection rates.

  **Tier D (Strategy 3):** While legally compliant, this is the least defensible given your specific charge. You explicitly sought a "principled" approach beyond the law to address known mathematical limitations; accepting the status quo ignores the validity concerns raised by the impossibility theorems and fails to leverage your team's analytical capability for ethical leadership.
