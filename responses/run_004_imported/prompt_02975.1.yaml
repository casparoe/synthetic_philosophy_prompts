answer: |-
  This is a profound observation that cuts to the heart of one of the oldest and most difficult problems in ethics: **The Argument from Marginal Cases.**

  You have identified a genuine tension. Your uncle (and the table) is applying two different moral frameworks simultaneously: a **deontological/status-based framework** for your grandmother (humans have inviolable rights regardless of capacity) and a **consequentialist/utilitarian framework** for the macaques (suffering is a negative utility that can be outweighed by greater good).

  From the perspective of the LessWrong/EA rationalist tradition, which generally seeks to ground moral status in functional capacities (sentience, sapience, agency), your uncle's position looks inconsistent. However, philosophical coherence depends on which axioms you are willing to accept.

  Here is a breakdown of whether these positions can be reconciled, the arguments that support the "kind" distinction, and where the friction remains.

  ### 1. The Core Conflict: Capacity vs. Kind
  The tension arises because the justification for moral status is shifting between the two conversations.

  *   **In the Hospice Case:** Moral status seems to be grounded in **Kind Membership** (being human). Even though your grandmother lacks current agency, self-recognition, or preference formation, she is afforded protection that precludes trading her life/comfort against the convenience of others.
  *   **In the Lab Case:** Moral status seems to be grounded in **Capacity/Interest Weighting**. The macaques' suffering is acknowledged, but it is fungible. It can be traded away for the greater good of human health.

  If moral status were based strictly on *current cognitive capacity* (the EA/Utilitarian standard), a macaque might arguably have *higher* status than a late-stage Alzheimer's patient, as macaques possess stronger working memory, self-recognition (in some tests), and capacity for suffering. If moral status were based strictly on *species*, the macaques should be off-limits for invasive research regardless of the human benefit.

  ### 2. Can the Uncle's Position Be Made Coherent?
  To hold both views without contradiction, your uncle must rely on one of three philosophical defenses. Whether these are "legitimate" depends on whether you find their premises convincing.

  #### A. The "Narrative Identity" or "Former Person" Argument
  This argument suggests that moral status isn't just about *current* capacity, but about the *trajectory* of a life.
  *   **The Logic:** Your grandmother was a person. She participated in the moral community, formed relationships, and exercised agency. We owe it to the *person she was* to treat her current body with the dignity accorded to persons. To treat her as a resource (or to let her die to save family burden) is to retroactively violate the dignity of the person she was.
  *   **Why it spares the monkeys:** The macaques never were persons. They do not have a past narrative of agency that commands respect.
  *   **Coherence Check:** This is logically consistent, but it relies on the metaphysical claim that past capacity grants current rights. Critics argue this is sentimental, but it is a standard view in bioethics (often used to explain why we treat human corpses differently than animal carcasses).

  #### B. The "Relational/Special Obligation" Argument
  This argument shifts the ground from *intrinsic moral status* to *relational duty*.
  *   **The Logic:** It isn't that your grandmother has higher *intrinsic* value than a monkey in a vacuum. It's that you have specific, non-fungible duties to your kin that you do not have to strangers or animals. The uncle isn't saying "Grandma's life is infinitely valuable"; he is saying " *We* cannot sacrifice *our* grandmother for *our* convenience."
  *   **Why it spares the monkeys:** We do not stand in a special covenantal relationship with lab macaques. Therefore, their welfare is subject to general utilitarian calculation for the public good, whereas Grandma is subject to the specific deontological duties of the family unit.
  *   **Coherence Check:** This is highly coherent sociologically. It explains why we save our own children from a burning building before strangers' children. However, it doesn't fully address the *medical* aspect: why is her medical benefit paramount over the family's burden, while the monkeys' medical burden (suffering) is subordinate to human benefit? This view essentially admits: "We are speciesist because we are human, and that is permissible."

  #### C. The "Schelling Point" or Social Stability Argument
  This is a more game-theoretic take, common in rationalist circles.
  *   **The Logic:** Drawing the line of inviolable rights at "biological human" is a bright-line rule (a Schelling point) that prevents dangerous slippery slopes. If we start making cost-benefit analyses about which humans are "worth" treating based on cognitive capacity, we risk eroding the protection of vulnerable humans (the disabled, the unconscious, the elderly).
  *   **Why it spares the monkeys:** Animals are not part of the human social contract. Including them in the "inviolable" circle might dilute the protection afforded to humans or make the rule too complex to enforce.
  *   **Coherence Check:** This is a pragmatic coherence rather than a moral truth. It admits the distinction is somewhat arbitrary but argues it is *useful*. Your uncle might be intuitively grasping that treating humans as calculable resources is socially corrosive, even if the metaphysics are shaky.

  ### 3. The EA/LessWrong Critique
  From the perspective you mentioned (EA/LW), the uncle's position is usually flagged as **Speciesism** (a term popularized by Peter Singer, who specifically uses the "marginal cases" argument you just deployed).

  *   **The Sentientist View:** If the capacity to suffer is the baseline for moral consideration, the macaques' suffering counts. If the capacity for preference is the baseline, the macaques may outrank the grandmother.
  *   **The Inconsistency:** To an EA, the uncle is engaging in motivated reasoning. He uses "human dignity" to protect his family member (which feels good and aligns with social norms) but drops "dignity" when it conflicts with human health progress (which also feels good and aligns with social norms).
  *   **The Revision:** To be consistent, an EA would argue for one of two uncomfortable positions:
      1.  **Raise the status of animals:** If the grandmother is beyond calculation, the macaques should be too (abolition of invasive research).
      2.  **Lower the status of the incapacitated:** If the macaques are subject to cost-benefit analysis, then severely incapacitated humans should theoretically be subject to similar triage logic (though EAs often argue we keep the human rule for pragmatic/social reasons, acknowledging the philosophical tension).

  ### 4. Is the "Kind" Move Legitimate?
  You asked if "she still belongs to a kind that's normally rational" is legitimate or special pleading.

  *   **It is Special Pleading if:** You believe moral status *must* supervene on individual intrinsic properties (like neurons firing, ability to feel pain). If morality is about the *experience* of the being, then species is irrelevant.
  *   **It is Legitimate if:** You believe moral status is partly constituted by social recognition, relational history, or metaphysical essence (e.g., Kantian dignity, religious ensoulment). In many ethical frameworks (Kantianism, Care Ethics, Virtue Ethics), we are not just isolated utility buckets; we are members of communities with histories.

  ### Conclusion
  Does taking one reaction seriously commit you to revising the other?

  **Logically, yes.** If you demand a single, universal metric for moral worth (like "current cognitive capacity" or "sentience intensity"), the two positions cannot stand together. One must give: either the research is impermissible, or the grandmother's treatment is subject to stricter triage.

  **Psychologically and Culturally, no.** Most human moral systems are pluralistic. We operate with a "circle of empathy" that has hard boundaries. We use deontology (rules/duties) for the inner circle (family, fellow citizens, humans) and utilitarianism (cost/benefit) for the outer circle (animals, resources, enemies).

  Your uncle is not necessarily being hypocritical in a way that *he* would recognize; he is switching moral modules. He is using **Care Ethics** for his grandmother (duty to the vulnerable kin) and **Utilitarianism** for the macaques (public health policy).

  The discomfort you feel is the friction of noticing the seam between those two modules. Reconciling them requires choosing a foundational axiom: either you accept that **species membership itself carries moral weight** (which saves both intuitions but invites the charge of speciesism), or you accept that **capacity is all that matters** (which is philosophically cleaner but requires abandoning one of your uncle's intuitions).

  Given your background, you likely suspect the latter. But it is worth noting that the "Kind" argument is not merely comfort; it is the bedrock of human rights law, which grants rights to infants and the comatose not because of what they can *do*, but because of what they *are*. The hard question is whether that "what they are" can logically exclude the macaque without relying on biological chauvinism. Most rigorous philosophical systems say no; most functioning human societies say yes.
