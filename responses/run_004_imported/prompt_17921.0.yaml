answer: |-
  This is a fantastic tangent. Your senior engineer dropped a reference that sounds like pretentious window-dressing but actually points to one of the most robust frameworks for understanding social dynamics in engineering teams. You summarized Lewis (and the evolutionary pushback) accurately.

  The short answer is: **Your coworker is right that it *is* a Lewis convention, but wrong if they're using that as a reason *not* to change it.** Lewis's framework doesn't prove conventions are immutable; it explains the *friction cost* of moving them.

  Here are the most important implications of Lewis's account (and the evolutionary critique) for your specific situation with commit messages, and for software culture generally.

  ### 1. Stickiness is a Feature, Not a Bug (The Coordination Payoff)
  Lewis's core insight is that the value of a convention is not intrinsic; it is **relational**.

  In your codebase, the "home-grown" commit format likely isn't sticky because everyone loves it. It's sticky because the payoff matrix looks like this:
  *   **Everyone uses Old Format:** High efficiency, tooling works, history is readable.
  *   **Everyone uses New Format:** High efficiency, tooling works, history is readable (potentially better).
  *   **Mixed Usage:** Chaos. Changelogs break, grep scripts fail, code review slows down because reviewers have to mentally parse two syntaxes.

  Lewis explains why "better" doesn't win automatically. If the Old Format is a stable equilibrium, moving to the New Format requires passing through a valley of **Mixed Usage** where utility drops for everyone.

  **Implication for you:** You cannot argue for the change based on the *merits* of Conventional Commits alone (e.g., "it enables semantic versioning"). You have to argue that the team can absorb the **coordination tax** of the transition period. If the team is small or the tooling is flexible, the valley is shallow. If the team is large or CI/CD is rigid, the valley is deep. The stickiness isn't inertia; it's risk aversion regarding coordination failure.

  ### 2. Common Knowledge is the Real Barrier
  You mentioned "common knowledge" (everyone knows $X$, everyone knows everyone knows $X$, etc.). This is the specific mechanism that makes conventions hard to change.

  If you send an email saying "Please use Conventional Commits starting Monday," you have created *first-order knowledge* (everyone knows the rule). You have **not** created common knowledge.
  *   Developer A wonders: "Will Developer B actually do it?"
  *   If A thinks B might forget, A will stick to the Old Format to avoid breaking the chain.
  *   Because B is thinking the same thing, B sticks to the Old Format.
  *   The convention holds, not because people are stubborn, but because they lack confidence in the *commonality* of the new expectation.

  **Implication for you:** "It's just a Lewis convention" is a bad excuse to do nothing, but it is a **good instruction manual for how to migrate.** To break a Lewis convention, you must manufacture common knowledge.
  *   **Don't:** Ask people to try it out.
  *   **Do:** Install a linter that *fails the build* on the old format. This makes the new expectation public, undeniable, and mutually known. It externalizes the "common knowledge" into the CI system.

  ### 3. Local Equilibria vs. Global Standards (Why no single standard?)
  Lewis argues that conventions are arbitrary solutions to coordination problems. It doesn't matter if we drive on the left or right, only that we agree.

  This explains why Company A uses Tabs, Company B uses Spaces, and the Linux Kernel uses its own style. Each company is a distinct population ($P$) solving a recurring coordination problem ($S$) in isolation. There is no pressure to converge globally because the coordination cost is local. I only need to coordinate with my team, not with Google's team.

  However, **Conventional Commits** represents an attempt to expand the population $P$ to the entire industry.
  *   **Home-grown format:** Coordination value is limited to your 6-year tenure. New hires have to learn it (cost).
  *   **Conventional Commits:** Coordination value extends to any developer who has worked elsewhere, plus third-party tooling (semantic-release, commitlint, etc.).

  **Implication for you:** The argument for switching isn't that Conventional Commits is "truer." It's that your team is a sub-population of a larger industry. By using a local convention, you are paying a "tax" on every new hire and every integration with external tools. Lewis's framework supports switching *if* the external coordination benefits (hiring, tooling) outweigh the internal switching costs.

  ### 4. The Evolutionary Pushback: Habits and Tooling
  You mentioned the later critique (Skyrms, evolutionary game theory) that you don't need rational reasoning for conventions; you just need reinforcement.

  In software, **linters and formatters are reinforcement machines.**
  *   For 6 years, your team has been "reinforced" for using the old format. The CI pipeline turns green when you use it. Your muscle memory types it.
  *   The "blind imitation" aspect is strong here. Junior devs copy Senior devs.

  **Implication for you:** You cannot reason your way out of an evolutionarily stable convention. You have to change the reinforcement schedule.
  *   If you rely on code review comments ("hey, fix this commit message"), the old convention will likely win because it's the path of least resistance.
  *   If you change the environment (automated linting), you change the evolutionary pressure. The "blind imitation" will eventually favor the new format because the old format gets punished by the machine, not just nagged by humans.

  ### 5. Is "It's a Lewis Convention" an Excuse for Inertia?
  Yes, but it's a sophisticated one.

  When your senior engineer said that, they likely meant: *"The value here is consistency, not correctness. Therefore, the cost of changing consistency is high, and the benefit of 'correctness' is low."*

  **Where they are right:** If the only benefit is "I like Conventional Commits better," don't do it. The disruption to the equilibrium isn't worth it.
  **Where they are wrong:** If the benefit is "We can auto-generate changelogs and semver bumps," that changes the payoff matrix. It's no longer just an arbitrary regularity; the new convention offers a functional utility the old one lacked.

  Lewis conventions *do* change. Countries switch driving sides (Sweden, 1967). Formats change (VHS to DVD). But it requires a **focal point** (Schelling point) to coordinate the switch.
  *   **The Old Way:** Focal point is "what we've done for 6 years."
  *   **The New Way:** Focal point is "the industry standard."

  ### The Verdict
  The philosophical framework validates that **consistency is more valuable than optimality** in isolation. However, it also provides the roadmap for how to successfully disrupt that consistency:

  1.  **Acknowledge the Arbitrariness:** Admit the old way wasn't "wrong," just local. This lowers defensiveness.
  2.  **Manufacture Common Knowledge:** Don't ask; enforce. Use a pre-commit hook or CI check. Everyone needs to know that *everyone else* is forced to comply.
  3.  **Highlight the External Focal Point:** Emphasize that Conventional Commits reduces cognitive load for *new* hires (who already know it) and unlocks *tools* (which expect it). This shifts the argument from "preference" to "coordination with the broader ecosystem."

  **Summary:** Your coworker used a 1969 philosophy book to defend inertia. You can use the same book to argue that **conventions are only stable as long as the coordination benefits outweigh the switching costs.** If tooling and hiring have shifted the balance, the convention *should* move. But you must treat it as a social migration, not a technical patch.
