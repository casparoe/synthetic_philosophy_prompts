answer: |-
  The debate between Michael Walzer's traditionalism and Jeff McMahan's revisionism constitutes the central fault line in contemporary just war theory. At stake is not merely an academic classification, but the fundamental moral identity of the soldier. Walzer, in *Just and Unjust Wars*, defends the Moral Equality of Combatants (MEC): the claim that soldiers on both sides of a conflict possess an equal right to kill and an equal liability to be killed, provided they adhere to the *in bello* rules of discrimination and proportionality. McMahan, in *Killing in War*, dismantles this symmetry, arguing that liability to attack tracks moral responsibility for unjustified threats; thus, soldiers fighting for an unjust cause generally lack the right to kill, even if they are blameless for their ignorance.

  After weighing the arguments regarding epistemic limitations, the distinction between excuse and justification, and the relationship between deep morality and international law, the verdict must be clear: **McMahan is correct about the moral status of combatants.** The Moral Equality of Combatants is a moral fiction. While there are pragmatic reasons to retain MEC within the strict confines of International Humanitarian Law (IHL), we must not mistake this legal convention for moral truth. To accept Walzer's view is to sever the link between killing and moral liability, thereby granting a moral license to those contributing to grave injustice. The revisionist account, though uncomfortable, is the only one that respects the agency of the individual soldier and the gravity of the harm they inflict.

  ### The Traditionalist Case: The War Convention

  Walzer's defense of MEC rests on a separation of *jus ad bellum* (justice of going to war) and *jus in bello* (justice in war). For Walzer, war is a unique, collective political practice, distinct from ordinary morality. In the "realm of necessity" that is war, soldiers are instruments of the state. They do not choose the cause; they are sent to fight. Therefore, their moral standing should not depend on the geopolitical justice of their nation's leaders, which lies beyond their knowledge and control.

  Walzer offers two primary arguments for this position. The first is epistemic. Most soldiers, particularly conscripts or those in hierarchical structures, lack the information necessary to judge the *ad bellum* status of their war. If the right to kill depended on the objective justice of the cause, soldiers would be paralyzed by uncertainty or forced to become amateur geopolitical analysts in the midst of combat.

  The second argument is pragmatic, often called the "workability" objection. Walzer contends that MEC is a functional component of the "War Convention," a set of norms designed to limit the horrors of war. If soldiers on the unjust side believed they were already criminals with no right to fight, they would have no incentive to follow *in bello* rules. Why observe proportionality or spare prisoners if you are a murderer regardless? By granting equal status, Walzer argues, we give unjust combatants a reason to fight cleanly, thereby saving lives. To abandon MEC is to risk making war more brutal.

  ### The Revisionist Case: Liability and Responsibility

  McMahan challenges the very foundation of Walzer's view by rejecting the idea that war creates a separate moral realm. He argues that the ethics of war should be continuous with the ethics of self-defense in ordinary life. In ordinary morality, you do not have the right to kill someone who is not threatening you unjustly. If a police officer lawfully attempts to arrest you, you cannot kill them in self-defense, because their threat is justified. Similarly, in war, a soldier fighting for a just cause is akin to the police officer; a soldier fighting for an unjust cause is akin to a culpable aggressor.

  For McMahan, liability to be killed is grounded in moral responsibility for an unjust threat. If a soldier contributes to an unjust war (e.g., an aggressive invasion), they are making themselves liable to defensive harm, regardless of whether they follow *in bello* rules. Conversely, a just combatant does not make themselves liable to be killed by the unjust side, because they are not posing an unjust threat. Thus, the moral symmetry is broken: unjust combatants are liable to be killed and lack the right to kill; just combatants are not liable and possess the right to kill.

  McMahan anticipates the charge that this makes monsters of ordinary soldiers. He introduces a crucial distinction between **justification** and **excuse**. An unjust combatant might be *excused* for fighting due to non-culpable ignorance (the "fog of war"). They may not be blameworthy, and thus not a "murderer" in the criminal sense. However, being excused is not the same as being justified. An excused killer still lacks the *right* to kill. They are morally permitted to refrain from punishment, but their act remains objectively wrongful, and they remain liable to defensive harm from those they threaten.

  ### Engaging the Pressure Points

  The dispute turns on three specific pressure points: the epistemic argument, the nature of moral agency, and the law-morality divide.

  **1. The Epistemic Argument**
  Walzer claims soldiers cannot know the justice of their cause. McMahan concedes that soldiers often lack full knowledge but argues this does not grant them a right to kill. Ignorance may remove *blame*, but it does not create *justification*. If I mistakenly believe you are about to attack me and I kill you in "self-defense," I may be excused due to reasonable mistake, but I have not acted permissibly, and you (if you were innocent) had the right to stop me.
  Furthermore, the epistemic barrier is not as absolute as Walzer suggests. In many modern conflicts, the aggressive nature of a war is evident (e.g., crossing a recognized border without provocation). To grant a blanket moral immunity based on potential ignorance is to treat soldiers as moral children incapable of basic ethical judgment. Revisionism respects their agency by holding that while they may be excused, they are participating in a wrongful enterprise.

  **2. Excuse vs. Justification**
  Walzer worries that the revisionist distinction collapses in the heat of battle. If a soldier is told they are "excused but not justified," does that change their behavior? Walzer fears it leads to nihilism. However, this misunderstands the function of moral theory. Moral theory's primary job is to describe the truth of our obligations, not necessarily to engineer compliance. That soldiers might behave worse if they knew the moral truth is an indictment of the soldiers or the political culture, not of the truth itself.
  Moreover, McMahan's distinction allows for a nuanced moral evaluation that Walzer's flattens. It allows us to say, "This soldier was not evil, but what they did was wrong." Walzer's view forces us to say, "What they did was permissible," which sanitizes the harm of aggressive war.

  **3. Deep Morality vs. International Law**
  This is the strongest point of resistance. Walzer argues that even if McMahan is right about "deep morality," the *law* must maintain MEC. If the Geneva Conventions adopted revisionism, unjust soldiers would be treated as criminals *during* the war, incentivizing total war.
  Here, we must distinguish the question of *moral status* from the question of *legal codification*. The prompt asks us to settle the moral status of soldiers. On this specific question, Walzer's legal pragmatism is irrelevant to the truth. The fact that we might need to lie (or employ a "noble fiction") in international law to prevent atrocity does not make the fiction morally true.
  However, even on the legal front, Walzer's pessimism may be overstated. We can maintain a revisionist morality while keeping a traditionalist legal framework, provided we are honest about the distinction. We can prosecute leaders for *ad bellum* crimes (aggression) while granting combatant immunity to rank-and-file soldiers for *in bello* compliance, without claiming the soldiers had an equal *moral right* to kill. The law can be a pragmatic compromise without dictating the underlying morality.

  ### The Verdict: Revisionism as Moral Truth

  The definitive verdict is that **Jeff McMahan's revisionist account correctly identifies the moral status of combatants, while Michael Walzer's traditionalism offers a pragmatic but morally false legal convention.**

  We must reject the Moral Equality of Combatants as a moral principle because it severs the connection between killing and liability. If morality is about how we ought to treat one another, it cannot be the case that a soldier defending their homeland against invasion and a soldier invading that homeland stand on equal moral footing simply because they both wear uniforms and follow the same rules of engagement. The invader is contributing to a wrongful harm; the defender is preventing it. To say they are morally equal is to say that the justice of the cause is irrelevant to the permissibility of killing, which contradicts the most basic tenets of self-defense and human rights.

  Walzer's fear that acknowledging this truth will lead to barbarism is a concession to cynicism. It assumes that soldiers will only follow rules if they believe their cause is morally neutral. This underestimates the power of professional ethics, camaraderie, and the fear of post-war accountability. Furthermore, maintaining the fiction of MEC comes with its own moral cost: it obscures the responsibility of unjust combatants and dilutes the stigma of aggression. It makes it too easy for societies to say, "Our boys were just following the rules," when the rules themselves were applied to an unjust enterprise.

  Therefore, while we may retain MEC in the *laws of war* for the sake of reciprocity and containment (a tragic necessity of a non-ideal world), we must be clear that this is a legal compromise, not a moral reality. In the seminar room, and in our moral judgments, we must affirm that **combatants are not morally equal.** The soldier fighting for justice acts permissibly; the soldier fighting for injustice acts wrongfully, even if they are excused from blame. To accept anything less is to surrender the moral high ground to the logic of the uniform, and to forget that war is ultimately composed of individual human beings making lethal choices for which they bear some measure of responsibility.
