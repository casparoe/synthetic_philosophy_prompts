answer: |-
  This is one of the deepest rabbit holes in formal epistemology, and your confusion is well-founded. For a long time, the LessWrong/MIRI consensus shifted from "Solomonoff Induction (SI) is the answer" to "SI is the answer *if* you ignore logical uncertainty, which you can't, so we need Logical Induction (LI)."

  Here is the concrete comparison you asked for, breaking down the overlap, the divergences, and which one holds the crown for "fundamental theory of rationality."

  ### 1. The Core Distinction: Empirical vs. Logical Uncertainty

  To understand why they differ, you have to look at what kind of "unknown" they are handling.

  *   **Solomonoff Induction (SI)** handles **empirical uncertainty**. It asks: "Given my past sensory inputs, what is the probability of the next input?" It assumes the world is generated by some computable program.
  *   **Logical Induction (LI)** handles **logical uncertainty**. It asks: "Given my axioms and past proofs, what is the probability that this sentence is provable?" It assumes the truth is fixed but computationally expensive to derive.

  **The "Same Claim" Test**
  You asked if they would assign different credences to the exact same claim. **Yes, absolutely.**

  *   **Claim:** "The 10,000th digit of $\pi$ is 7."
  *   **Solomonoff Agent:** This agent is **logically omniscient**. In the SI framework, a hypothesis is a computer program. If a program implies standard arithmetic, it *already contains* the fact of the 10,000th digit of $\pi$. The SI agent sums over all programs consistent with its data. Since math facts are tautological consequences of the programs, the SI agent assigns this probability **exactly 0 or 1** immediately (depending on whether the digit is actually 7 or not). It cannot be "unsure" about math.
  *   **Logical Inductor:** This agent is **computationally bounded**. It treats the claim as a sentence in a formal language. It has not yet found a proof or disproof. It assigns a probability (say, 0.1) based on patterns in other digits or heuristic traders. Over time, as it finds more proofs, this probability converges to 0 or 1.

  **Verdict:** On any claim requiring non-trivial deduction (math, logic, code verification), SI and LI diverge radically. SI says "I know it already." LI says "I'm still thinking."

  ### 2. Scope and Overlap: Can they do each other's jobs?

  **Can Logical Induction do Solomonoff Induction?**
  **Yes, in principle.** You can encode empirical observations as logical sentences (e.g., $Observation_t = 1$). A Logical Inductor can assign probabilities to these sentences. In fact, one of the criteria for a Logical Inductor is that it must learn to predict patterns in observations efficiently to avoid being money-pumped by traders who bet on empirical regularities.
  *   *Caveat:* LI is computable; SI is not. An LI cannot match the predictive optimality of SI on *all* computable sequences because doing so would require solving the Halting Problem. However, LI can learn to mimic SI on any pattern it has enough time to recognize.

  **Can Solomonoff Induction do Logical Induction?**
  **No.** This is the fatal flaw. SI assumes that if a hypothesis $H$ implies a sentence $\phi$, then $P(\phi | H) = 1$. It has no mechanism for "I believe $H$ is true, and $H$ probably implies $\phi$, but I haven't checked yet." SI collapses logical uncertainty into empirical uncertainty, effectively assuming deduction is free.

  ### 3. Computability: The Hard Constraint

  This is the most practical difference.

  *   **SI is Uncomputable.** You cannot build a Solomonoff Inductor. It requires summing over an infinite set of programs and solving the Halting Problem to weigh them. It is a **normative ideal** (a Platonic form of reasoning), not an algorithm you can run.
  *   **LI is Computable.** The Logical Induction algorithm (as defined by Garrabrant et al.) is computable. You can actually write the code (ignoring the astronomical constants). It produces a sequence of probabilities that is computable in the limit.

  This means SI is a theory of **what you should believe if you were a god.** LI is a theory of **what you should believe if you are a mind.**

  ### 4. Which is more fundamental?

  If you have to bet on which one is the "Full, General Theory of Ideal Rational Belief," **you should bet on Logical Induction (or its descendants), not Solomonoff Induction.**

  Here is the justification:

  **1. Logical Uncertainty is the Superset**
  Empirical uncertainty is essentially a specific case of logical uncertainty. When you wonder "Will the sun rise tomorrow?", you are really asking "Does the program governing my universe output 'sun' at timestep $t$?"
  *   SI treats the program's output as instantly known once the program is selected.
  *   LI treats the program's output as a logical consequence that must be computed.
  Since all empirical prediction ultimately rests on logical deduction (running the model of the world), a theory that cannot handle logical uncertainty (SI) is incomplete. A theory that handles logical uncertainty (LI) can *also* handle empirical uncertainty by treating observations as axioms.

  **2. The "Omniscience" Bug is Fatal for General Rationality**
  A "General Theory of Rationality" must apply to agents that exist in the physical universe. Physical agents are bounded. They cannot know all consequences of their beliefs instantly.
  If you use SI as your foundation, you have to add a "patch" to explain why you don't know the trillionth digit of pi. That patch *is* Logical Induction.
  If you use LI as your foundation, you don't need a patch for empirical data; you just add traders that bet on sensory inputs. LI is the more robust framework because it acknowledges the cost of thinking.

  **3. The Synthesis View**
  The current MIRI/alignment research view isn't that LI *replaces* SI, but that **LI is the computable approximation of the ideals SI points toward.**
  Ideally, you want a **Logical Inductor with a Solomonoff Prior.** You want the market of traders to be weighted by the simplicity of the patterns they find (Occam's Razor).
  *   SI gives you the **Prior** (Simple programs are more likely).
  *   LI gives you the **Inference Engine** (How to update probabilities on logical facts over time).

  ### Summary Verdict

  *   **Solomonoff Induction** is the gold standard for **Ideal Empirical Prediction** assuming infinite compute and logical omniscience. It is the "Physics" of information.
  *   **Logical Induction** is the gold standard for **Ideal Rational Belief** for bounded agents. It is the "Engineering" of cognition.

  **Why LI wins the "Fundamental" bet:**
  SI describes a static relationship between data and truth. LI describes a *process* of reasoning. Since rationality is a process undertaken by bounded agents, LI is the more general theory. SI is effectively a special case of LI where the "market" settles instantly and the traders have infinite power.

  If you are building an AI or trying to formalize how *you* should think, **Logical Induction is the framework.** It is the only one that admits it doesn't know the math yet, which is the first step to actually being rational about math. SI is beautiful, but it describes a mind that already knows everything deducible, which is no mind at all.
