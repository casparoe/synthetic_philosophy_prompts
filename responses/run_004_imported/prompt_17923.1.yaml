answer: |-
  The steam from their lattes curled into the air between them, a temporary bridge across the table where Dana and Priya sat. It had been three days since the reading group meeting, and the tension from the unresolved debate about your situation—and the Non-Identity Problem—had clearly simmered in both of them.

  Dana stirred her coffee, the spoon clinking softly. "I've been thinking about what you said regarding our friends and the CF screening. Specifically, about the 'bite the bullet' position. I know I defended Boonin's comparative account aggressively, but I keep hearing your hesitation. It sounds like you think if I follow that logic, I can't condemn *anything* as long as the identity of the child changes."

  Priya leaned forward, resting her chin on her hand. "Exactly. Look, I respect the logical consistency of the person-affecting view. If the choice is between Child A with Cystic Fibrosis existing or Child A never existing, and Child A's life is still worth living, then Child A isn't worse off. But Dana, if that's the only metric for wronging someone, what stops it from excusing the indefensible? Imagine a couple who knowingly conceives a child into hereditary slavery. The child's life is hard, but let's stipulate it's still 'worth living' in the bare sense that they prefer existence to non-existence. Under your view, the parents haven't wronged *that* child. That feels morally bankrupt."

  Dana nodded slowly. "That's the standard objection. The 'Slave Child' case. And you're right, if my only tool is comparative welfare—'is the child worse off than they would have been?'—then I'm stuck. But that's why I've been refining the view since Tuesday. I don't think I have to abandon the comparative account to avoid that conclusion. I just need to distinguish between *harming* a person and *violating their rights*."

  Priya raised an eyebrow. "Rights? Whose rights? The child's?"

  " Yes," Dana said. "Boonin focuses on welfare, but we can layer a deontological constraint on top. Even if the child isn't *worse off* in terms of welfare compared to non-existence, they might still be treated in a way that fails to respect them as an end in themselves. In the slavery case, the parents are using the child merely as a means to an economic end. That's a rights violation, independent of the welfare comparison."

  "But does that work for the CF case?" Priya pressed. "Your friends aren't planning to use the child as a means. They just want a family. If they conceive naturally, they aren't instrumentalizing the child. So if you drop the welfare comparison, and there's no instrumentalization, your view still says they've done nothing wrong to the child. But surely, knowingly imposing a serious, genetic limitation like CF is a failure of responsibility *to that child*, not just an impersonal bad state of affairs."

  Dana paused, tapping the rim of her mug. "Okay. That's the harder hit. If there's no instrumentalization, and the life is worth living, my strict comparative view says the child isn't wronged. But here is where I'm willing to qualify my position. I think I need to accept a *threshold* conception of harm. Not a comparison to a possible alternative child, but a comparison to a baseline of 'minimal agency.'"

  "Go on," Priya said.

  "If a condition severely restricts a person's ability to form and pursue their own conception of the good," Dana said, "then bringing them into existence with that condition might count as wronging them, even if their life is net-positive. CF is severe. It restricts breathing, digestion, lifespan. It imposes a constant burden of medical intervention. If I accept that there is a threshold of 'basic capacity for autonomy' below which we ought not to knowingly create people, then I can say the parents wrong the child by failing to meet that threshold, without needing to say the child is worse off than they would have been."

  Priya looked thoughtful. "So you're moving away from pure Boonin. You're admitting that the 'non-identity' shield isn't absolute. It protects parents in cases of minor disadvantages, but not in cases of significant impairment of basic functioning."

  "Exactly," Dana said. "I'm conceding that the comparative account fails at the extremes. If the burden is high enough, the 'gift of life' doesn't automatically outweigh the 'burden of limitation.' So, for your friends: CF is likely above that threshold of acceptable risk when a safe alternative (PGD) exists. I can agree they have a duty to use PGD, not because the CF child is worse off than a PGD child, but because the CF child is owed a baseline of physical integrity that the parents knowingly compromised."

  "Okay," Priya said, a small smile appearing. "I appreciate that concession. It brings you much closer to sanity. But now I have to defend my own flank. You've probably been thinking about the collapse problem."

  Dana chuckled. "I was. If you say it's wrong to impose a serious, avoidable burden, even if the child isn't worse off, where does it stop? I could have waited two years to conceive. I would have been more financially stable, more emotionally mature. My child would have had a 'better' life. If I don't wait, have I wronged my actual child by imposing the 'burden' of having parents who were slightly less ready? If every sub-optimal condition counts as an avoidable burden, then procreation itself becomes impossible to justify. You collapse into anti-natalism."

  Priya nodded. "That's the 'Better Child' objection. And it's why I rely on Harman and Shiffrin's distinction between *harm* and *sub-optimal benefit*. When we procreate, we are conferring a benefit—existence. We are not obligated to confer the *maximum possible* benefit. We are only obligated to avoid imposing *significant harms*."

  "But what defines 'significant'?" Dana asked. "Is having parents with $50,000 less income a significant harm? Is having a genetic predisposition to mild asthma a significant harm?"

  "It comes down to the distinction between *normal functioning* and *impairment*," Priya explained. "My view isn't that you must create the *best* possible child. It's that you must not create a child who falls below a threshold of 'sufficientarian' well-being due to your choices. Waiting two years might give the child *more* advantages, but having children now usually keeps them well above the threshold of a decent life. CF, however, is different. It's not just a lack of extra advantage; it's a pathological impairment of basic biological function."

  Priya took a sip of her coffee. "So, to answer your worry: My view doesn't collapse because it relies on a normative baseline of 'species-typical functioning' or 'basic rights,' not a maximization principle. I am not saying your friends wrong the child because a *healthier* child could have existed. I am saying they wrong the child because *this* child is being condemned to a life of medical struggle that violates their right to an open future. The alternative isn't 'a better child,' the alternative is 'this child without this specific burden.'"

  "But the non-identity problem says 'this child without this burden' is impossible," Dana pointed out. "If they use PGD, it's a different embryo. So you *are* comparing this child to a different possible child."

  Priya shook her head. "Not in the way that matters for harm. Shiffrin argues that consent is the key. We can't get a child's consent to be born. So we justify procreation by assuming they would consent to the *burdens of life* generally. But there are limits to what we can assume consent for. We can assume a child consents to the general risks of mortality or mild illness. We cannot assume a child consents to a specific, severe, preventable genetic disease. The wrong isn't that they exist instead of someone else; the wrong is that they are subjected to a burden they could not reasonably be asked to accept, even if existence itself is a net good."

  Dana leaned back, looking out the window for a moment. "So, you're grounding the duty in a hypothetical consent model based on a threshold of reasonable burden. And I'm grounding my refined duty in a threshold of minimal agency that overrides the comparative welfare calculation."

  "Right," Priya said. "And notice where we land. We both agree that for your friends, PGD is the morally required path. We both agree that the Non-Identity Problem shouldn't shield parents from responsibility for severe, foreseeable genetic conditions."

  "We do," Dana agreed. "But I think my refinement is heavier than yours. I had to admit that the comparative account—the core of the 'bite the bullet' view—actually breaks down when the burden gets too high. I can't just say 'no harm, no foul' anymore. I have to say, 'No harm in the comparative sense, but a foul in the rights sense.'"

  "And I had to clarify that my non-comparative view isn't a demand for perfection," Priya added. "It's a demand for sufficiency. If I didn't make that distinction, I'd be telling everyone they're morally prohibited from having kids until they're rich and wise. That's not helpful."

  Dana looked back at Priya. "You know, for your friends... does it matter which of us is right? If both paths lead to 'use PGD,' is the philosophical disagreement just academic?"

  "I think it matters for how we support them," Priya said softly. "If your view is right, the tragedy is impersonal. They didn't wrong the child, but they acted wrongly. If my view is right, there is a specific duty *to* the future person. It changes the emotional weight. It validates the intuition that skipping PGD feels like a betrayal of the child, even if that child wouldn't exist otherwise."

  Dana nodded slowly. "I think I have to accept that. My earlier position felt too cold. By admitting the threshold of agency, I'm acknowledging that there's something personal at stake. The child isn't just a vessel for welfare points. They are a rights-bearer."

  "And I'm acknowledging," Priya said, "that we can't let the perfect be the enemy of the good. We can't let the Non-Identity Problem paralyze us, but we can't let it excuse negligence either."

  Dana picked up her cup. "So, for the CF case: We agree that the severity of the condition breaches the threshold where identity matters less than the obligation to avoid severe impairment."

  "Agreed," Priya said, clinking her mug against Dana's. "And we agree that the philosophical work isn't to solve the paradox completely, but to ensure it doesn't erode our moral responsibilities."

  "I can drink to that," Dana said. "Now, do you think we should tell them we spent an hour debating whether their potential child has rights, or just tell them to book the IVF consult?"

  Priya laughed. "Let's just send them the number for the clinic. They've got enough to think about without our metaphysics."
