      *   *Historical Context:* Douglass's shift was strategic. He needed to empower the Republican Party. Textualism today is often used to limit judicial power. Douglass wanted to enable political action.

  9.  **Final Polish:** Ensure the tone is analytical and respectful of both legal theory and historical context. (Make sure to mention the "Rule of Lenity" as the closest textualist cousin to Douglass's canon).

