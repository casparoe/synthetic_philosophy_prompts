prompt: |-
  I've been rereading Frederick Douglass's 1860 Glasgow speech on the Constitution, where he breaks with the Garrisonians' view that the document is irredeemably pro-slavery, arguing instead that it must be interpreted according to its actual text rather than any secret intentions of the framers. He makes much of the fact that the unamended Constitution never uses the words "slave" or "slavery," speaking only of "persons," and argues further that wherever the text is genuinely ambiguous, it should be construed in favor of liberty rather than bondage. This looks like a forerunner of modern textualism — the sort of reasoning Gorsuch used in Bostock v. Clayton County to read Title VII's ban on sex discrimination as covering sexual orientation and gender identity, whatever Congress actually expected in 1964 — except that most textualists today insist that ambiguity should be resolved by ordinary linguistic and legal convention, not by asking which reading is morally preferable. Would Douglass have recognized his own method in Gorsuch's opinion, or is his liberty-favoring canon doing something that a consistent textualist would actually have to reject?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Frederick Douglass's 1860 Glasgow speech ("The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?").
      *   **Core Argument:** Douglass argues the Constitution is anti-slavery based on its text (no mention of "slave"/"slavery," use of "persons"), rejecting the Garrisonian view (pro-slavery based on intent/history). He advocates interpreting ambiguity in favor of liberty.
      *   **Comparison:** The user compares this to modern textualism, specifically Justice Gorsuch's opinion in *Bostock v. Clayton County* (Title VII sex discrimination covers LGBTQ+ based on text, not 1964 expectations).
      *   **Tension:** Modern textualists usually resolve ambiguity via linguistic/legal convention, *not* moral preference (liberty vs. bondage).
      *   **Question:** Would Douglass recognize his method in Gorsuch's *Bostock* opinion, or is his "liberty-favoring canon" something a consistent textualist must reject?

  2.  **Deconstruct Douglass's Method (Glasgow Speech):**
      *   *Premise:* The text is the law, not the secret intentions of the framers.
      *   *Observation:* The words "slave" and "slavery" are absent.
      *   *Canon of Construction:* In cases of ambiguity, choose the interpretation that aligns with the document's stated purposes (justice, liberty, general welfare) and natural law. "When a document is ambiguous, the benefit of the doubt should go to liberty."
      *   *Goal:* Political abolitionism. He needed a constitutional basis to fight slavery within the system, not outside it (like Garrison).

  3.  **Deconstruct Modern Textualism (Scalia/Gorsuch):**
      *   *Premise:* The text is the law.
      *   *Focus:* Ordinary public meaning at the time of enactment.
      *   *Handling Ambiguity:* If text is clear, that's it. If ambiguous, look to context, structure, and established canons of construction.
      *   *Moral/Policy Role:* Generally rejected. Judges shouldn't import their own moral preferences. "The law is the law."
      *   *Bostock Specifics:* Gorsuch argued that *textually*, firing someone for being gay/trans *is* firing them because of sex. It's a but-for causation test. He explicitly rejected relying on 1964 expectations (similar to Douglass rejecting 1787 intentions).

  4.  **Compare and Contrast:**
      *   *Similarity:* Both reject "intentions/expectations" in favor of "text." Both arrive at a progressive outcome (for their time) via textual analysis.
      *   *Difference:* Douglass uses a *substantive* canon (presumption of liberty). Modern textualists are skeptical of substantive canons that override ordinary meaning. They prefer *linguistic* canons (ejusdem generis, noscitur a sociis, etc.).
      *   *The Crux:* Douglass's "liberty canon" is a normative rule of construction. Modern textualism claims to be descriptive (what do the words mean?), not normative (what *should* they mean to be good?).

  5.  **Evaluate the "Would Douglass Recognize It?" Question:**
      *   *Yes:* He would see the shared rejection of original intent/expectation. He would applaud *Bostock*'s outcome and the focus on the statutory words over the 1964 Congress's head.
      *   *No:* He would notice that Gorsuch doesn't explicitly say "we choose liberty because liberty is good." Gorsuch says "we choose this because the words *mean* this." Douglass admits he is choosing liberty *because* it is liberty.

  6.  **Evaluate the "Consistent Textualist Reject?" Question:**
      *   *Scalia's View:* Scalia was open to some canons of construction, including the "rule of lenity" (ambiguity in criminal law favors defendant) and potentially a presumption against retroactivity. But a general "presumption of liberty" in civil statutes? That's trickier.
      *   *The Conflict:* A "liberty canon" risks allowing judges to impose their own values under the guise of interpretation. If "liberty" is vague, it becomes living constitutionalism by another name.
      *   *Nuance:* Some modern originalists/textualists (like Randy Barnett) argue for a "presumption of liberty" based on the 9th Amendment or the structure of limited government. So, it's not universally rejected by *all* textualists/originalists, but it is by the mainstream conservative legal movement (Federalist Society type).

  7.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the sophistication of the comparison. It's a sharp insight.
      *   *Point 1: The Shared Rejection of Intent.* Highlight the parallel between Douglass rejecting the "secret intentions" of 1787 and Gorsuch rejecting the "expectations" of 1964. This is the strongest link.
      *   *Point 2: The Divergence on Ambiguity.* Explain Douglass's "Canon of Liberty" vs. Modern Textualism's "Ordinary Meaning." Douglass uses a moral tiebreaker; Gorsuch uses a linguistic/logic tiebreaker (but-for causation).
      *   *Point 3: Would Douglass Recognize It?* He'd recognize the *spirit* (text over intent) but might be wary of the *constraint* (textualism without a moral compass). He might think Gorsuch is too timid if the text *was* ambiguous without the liberty canon.
      *   *Point 4: Would a Textualist Reject It?* Yes, generally. A "presumption of liberty" is a substantive canon. Most textualists prefer neutral principles. However, note the exception of the "Rule of Lenity" (criminal law) which is similar.
      *   *Conclusion:* Douglass was doing "political constitutionalism" (using law for moral ends), whereas Gorsuch is doing "legal constitutionalism" (interpreting law as fixed). They meet on the text but part ways on *why* the text matters.

  8.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Correction:* Did Gorsuch actually use a liberty canon in *Bostock*? No, he claimed the text *compelled* the result, leaving no ambiguity. He argued that "because of sex" logically entails sexual orientation. So *Bostock* isn't actually a perfect example of resolving ambiguity via liberty; it's a claim of *no* ambiguity. Douglass, conversely, admitted ambiguity in the Constitution (e.g., the 3/5 clause, fugitive slave clause) but argued for a liberty reading *despite* historical practice.
