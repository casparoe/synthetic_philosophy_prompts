answer: |-
  This is a remarkably sharp comparison. You have identified a genuine tension in legal theory: the gap between *textualism as a linguistic method* and *textualism as a vehicle for liberty*.

  To answer your question directly: **Douglass would likely recognize the *spirit* of Gorsuch's *Bostock* opinion (the rejection of expected outcomes in favor of written words), but he would find modern textualism's refusal to explicitly adopt a "presumption of liberty" to be a dangerous abdication of moral responsibility.** Conversely, a consistent modern textualist would likely have to reject Douglass's specific canon of construction, viewing it as a form of "substantive due process" by another name.

  Here is a breakdown of where they converge, where they diverge, and what that implies for legal theory.

  ### 1. The Convergence: Text Over Intent
  The strongest link between Douglass in 1860 and Gorsuch in 2020 is the shared rejection of **expectations** in favor of **enactment**.

  *   **Douglass:** Argued against the Garrisonians that the "secret intentions" of the framers (many of whom were slaveholders) did not bind the document. If the text did not explicitly sanction slavery, the moral stain of the framers' intentions could not infect the law.
  *   **Gorsuch (*Bostock*):** Argued that the "expectations" of the 1964 Congress (which likely did not intend to protect LGBTQ+ employees) were irrelevant. If the text of Title VII prohibits firing someone "because of sex," and logic dictates that firing a gay man entails firing him because of sex, the outcome stands regardless of 1964 expectations.

  Douglass would absolutely recognize himself in this move. Both men argue that the law is what is *written*, not what was *whispered* in the backrooms of Philadelphia or Washington. Both use the rigidity of the text to produce a progressive outcome that the original enactors might not have anticipated.

  ### 2. The Divergence: Resolving Ambiguity
  This is where your insight hits the nerve. You correctly note that Douglass employs a **substantive canon of construction**: *In dubio, pro libertate* (when in doubt, favor liberty).

  *   **Douglass's Method:** He admits the Constitution has ambiguous clauses (e.g., the Fugitive Slave Clause, the Three-Fifths Clause). He argues that because the Preamble establishes "Justice" and "Liberty" as goals, any ambiguity in the operative text must be resolved to align with those goals. He explicitly imports a moral preference into the interpretive machinery.
  *   **Modern Textualism:** Generally rejects substantive canons that rely on moral or policy preferences. A textualist asks, "What would an ordinary speaker of English in 1787 (or 1964) understand these words to mean?" They do not ask, "Which reading makes society freer?"

  In *Bostock*, Gorsuch did not actually say, "We choose this reading because it promotes liberty." He argued, "We choose this reading because it is the only logical reading of the causation standard." He framed it as a linguistic necessity, not a moral choice.

  **Would Douglass recognize this?**
  He might view Gorsuch's linguistic gymnastics as a useful disguise. Douglass was a political actor; he knew that to defeat slavery, he had to make the Constitution *look* like it prohibited slavery, even if the historical evidence was mixed. He might see Gorsuch's claim of "logical necessity" as a rhetorical strategy similar to his own: using the constraints of the text to force a moral outcome.

  However, Douglass would likely be frustrated by the textualist refusal to admit the moral engine driving the car. For Douglass, the presumption of liberty was a feature, not a bug. He would ask: *If the text is truly ambiguous, why pretend morality doesn't matter?*

  ### 3. Would a Consistent Textualist Reject Douglass's Canon?
  **Yes, mostly.** A mainstream modern textualist (in the Scalia/Gorsuch mold) would reject a general "presumption of liberty" in civil statutes for two reasons:

  1.  **Democratic Legitimacy:** Textualists argue that judges are not elected. If a judge resolves ambiguity by choosing the "more liberty-enhancing" option, they are effectively making policy. If the legislature wanted more liberty, they should have written it.
  2.  **Indeterminacy:** "Liberty" is a vague standard. One judge's "liberty" (e.g., freedom of contract) is another's "bondage" (e.g., freedom from regulation). Textualists prefer "ordinary meaning" because they claim it is more objective than "liberty."

  **The Exception: The Rule of Lenity**
  There is one area where textualists accept Douglass's logic: criminal law. The **Rule of Lenity** states that if a criminal statute is ambiguous, it must be resolved in favor of the defendant. This is essentially a "presumption of liberty" regarding bodily freedom.
  *   If Douglass were arguing about a criminal statute punishing fugitive slaves, a textualist might meet him halfway.
  *   But Douglass was arguing about the *structural* Constitution and civil status. In that realm, modern textualists generally reject substantive canons.

  ### 4. Political Constitutionalism vs. Legal Constitutionalism
  The fundamental difference is that Douglass was engaging in **political constitutionalism**, while Gorsuch is engaging in **legal constitutionalism**.

  *   **Douglass:** His goal was to empower the Republican Party to act against slavery. He needed the Constitution to be a sword. His interpretive method was instrumental: *How do we read this to save the Union and end slavery?* The "liberty canon" was a tool for political mobilization.
  *   **Gorsuch:** His goal is to constrain the judiciary. His interpretive method is restrictive: *What does the text compel me to do, regardless of my policy preferences?*

  Douglass would likely argue that Gorsuch's "neutral" textualism is an illusion. By refusing to adopt a liberty canon, the judge is implicitly accepting the status quo (which may be oppressive) as the neutral baseline. Douglass would argue that **neutrality in the face of injustice is complicity.**

  ### Conclusion
  Douglass would recognize Gorsuch's *Bostock* opinion as a kindred spirit in its refusal to bow to original expectations. He would cheer the result. But he would ultimately diagnose modern textualism as incomplete.

  He would argue that a textualism without a moral compass (the liberty canon) is vulnerable to being captured by bad actors who can write oppressive laws with clear text. Douglass's method insists that the *purpose* of the law (liberty) must inform the *reading* of the text. A consistent textualist must reject this, insisting that the text defines the purpose, not the other way around.

  In short: **Douglass used textualism to serve liberty; modern textualists use textualism to serve the text.** They look the same when the text happens to align with liberty (as in *Bostock* or Douglass's reading of the Constitution), but they would part ways the moment the text appeared clearly to restrict it. Douglass would say the text must be bent toward freedom; a textualist would say the text must be followed, and the people must amend it.
