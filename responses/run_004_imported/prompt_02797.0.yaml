answer: |-
  The observation deck hummed with the low-frequency vibration of the *USC Quine*. Below, the violet haze of the Xylos atmosphere swirled around the landing struts. Inside, Elara rubbed her temples, staring at the two holographic displays floating above the table.

  "It's not about ambiguity, Vance," Elara said, her voice tight. "Ambiguity is when a word has two meanings and context clears it up. This isn't that. This is indeterminacy."

  Commander Vance crossed his arms, looking from the displays to the silent alien figure seated in the corner. Ambassador Krel of the Xylos blinked slowly, their translucent skin shimmering. They were dying. A metabolic cascade failure. Human medicine could fix it with a simple enzymatic graft, but the procedure required incision. It required separating parts of Krel's body.

  "Explain it like I'm security, not a linguist," Vance said.

  Elara tapped the left display. "Manual Alpha. Based on six months of behavioral conditioning, assent/dissent testing, and stimulus correlation. In Alpha, the word *'Vex'* refers to the whole organism. The person. When Krel said *'Vex must remain whole,'* they meant 'I must stay alive.'"

  She tapped the right display. "Manual Beta. Uses the exact same data. Every nod, every click, every chemical signal Krel ever gave fits this model perfectly. But in Beta, *'Vex'* refers to undetached spatial parts. The limbs, the organs, the continuity of matter. When Krel said *'Vex must remain whole,'* they meant 'Do not cut me. Do not separate my parts.'"

  Vance frowned. "So one says operate, the other says don't."

  "Both say 'preserve the Vex,'" Elara corrected. "But 'preserve' means something ontologically different in each manual. And here's the kicker, Vance: There is no way to distinguish between them. Not because we lack data. We have exhausted all possible behavioral evidence. Quine's point is that there is *no fact of the matter*. Neither translation is 'true.' They are just incompatible systems that both map perfectly to reality."

  Krel shifted, a wheezing sound escaping their throat. Time was running out.

  "If we operate," Vance said, "and Manual Beta is the... I don't know, the 'real' interpretation... we violate their core cultural taboo. We mutilate them."

  "And if we don't," Elara countered, "and Manual Alpha is the 'real' one, we let them die because we were afraid of a philosophical paradox. We violate the command to preserve the life."

  "Can't we ask them?"

  "We did. They said *'Vex must remain whole.'* That's the stimulus. The response is identical for both manuals. If I point to a severed hand and ask *'Vex?'*, in Manual Alpha they say no. In Manual Beta they say yes. But we can't sever their hand to test it without potentially violating the very rule we're trying to understand. It's a closed loop."

  Vance looked at the alien ambassador. Krel's shimmering was fading to a dull gray. "What does *Arrival* say?"

  Elara sighed. "Dev would say their language changes our perception of time and we'll realize surgery is irrelevant. But this isn't Sapir-Whorf. This isn't about how they think. It's about reference. It's about what exists. Do 'people' exist, or do only 'parts' exist? Their language doesn't care. Ours does."

  "We have to choose a manual," Vance said. "For the treaty log."

  "We have to choose a manual to save a life," Elara said. "If we operate, we are committing to Manual Alpha. We are forcing an ontology onto them. We are saying 'You are a Whole.' If they are actually a Collection of Parts, we're committing assault."

  "And if we don't?"

  "We commit negligence. We say 'You are a Collection of Parts' when they might be begging us to see them as a Whole."

  The silence stretched. The hum of the ship seemed to grow louder. There was no magical insight coming. No universal translator would click into place. The indeterminacy was radical. It was foundational.

  "Probability?" Vance asked.

  "Undefined," Elara said. "It's not fifty-fifty. It's undefined. Like asking if the number blue is heavier than the number seven."

  Krel let out a sharp click. A distress signal.

  Vance made the call. "Scalpel. Manual Alpha. We treat them as a Whole."

  Elara nodded, though her stomach turned. She typed the command into the log. *Translation Manual Alpha adopted for Medical Intervention.* She knew that even as she typed it, Manual Beta remained equally valid. The data wouldn't change. The behavior wouldn't change. Only the human action would.

  As the medical team moved in, sealing the environment suit around Krel, Elara watched the alien's eyes. They didn't show fear. They didn't show relief. They just showed observation.

  Did Krel know? Did it matter to them that their saviors were operating on a philosophical gamble that could never be verified?

  The surgery began. The incision was made. The *Vex* was separated.

  Elara turned away from the window. She opened a new file on her datapad. *Addendum to Field Notes:* *Subject survived intervention. Assent given post-recovery for phrase 'Vex restored.'*

  She paused. In Manual Beta, 'Vex restored' meant 'Parts reconnected.' In Manual Alpha, it meant 'Life saved.' The phrase fit both. The evidence remained perfectly balanced.

  She closed the file. They would never know what they had actually saved. They had only saved what they could name.
