      *   *Nuance:* Make sure to distinguish between "Arian" and "Socinian." Newton is often closer to Arian (pre-existence of Son) but some argue Socinian (Son created). Snobelen usually leans toward Arian/Subordinationist. Stick to "anti-Trinitarian/Subordinationist" to be safe.
      *   *Key Insight:* The *Scholium* is about *presence*. God is present everywhere not by essence (which risks Spinozism) but by *dominion*. This protects divine transcendence while allowing immanence. This links to the Eucharist controversy too (Newton was anti-transubstantiation), but maybe keep it focused on the Trinity to avoid scope creep.
      *   *Focus:* Keep it on the *Dominion* vs. *Essence* distinction. That's the user's specific prompt.

  6.  **Final Polish:** Check tone. Ensure it sounds like advice from a knowledgeable peer/senior scholar. (e.g., "Your advisor is pointing you toward...", "The upshot is...").

