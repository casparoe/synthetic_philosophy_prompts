answer: |-
  This is a classic negotiation problem that economists and game theorists actually have a name for: **The Nash Bargaining Solution.**

  You are stuck in circles because you are trying to split the *total* pot ($150k) based on two different philosophies that don't mix well. Your sister is arguing for a split based on **leverage** (who needs whom less), while you are arguing for a split based on **effort/equity** (we are partners).

  Both have merit, but neither is the whole picture. Here is a framework to break the deadlock, calculate a "fair" number, and explain it to your sister in a way that protects your relationship.

  ### 1. The Core Concept: The "Cooperation Surplus"

  To find fairness, you have to separate the money into two buckets:
  1.  **The Baseline (BATNA):** What you each make if you walk away (Best Alternative to a Negotiated Agreement).
  2.  **The Surplus:** The *extra* money that only exists because you are working together.

  **The Math:**
  *   **Sister's Baseline:** $80k
  *   **Your Baseline:** $20k
  *   **Combined Baseline (if you split):** $100k
  *   **Joint Venture Value:** $150k
  *   **The Surplus (The "Magic"):** $50k

  That $50k is the value created *specifically* by the partnership. Without her, you don't get the volume. Without you, she doesn't get the capacity (assuming you are both needed to hit the $150k number).

  **The Fair Economic Split:**
  Standard bargaining theory suggests that **each person should get their Baseline + 50% of the Surplus.**
  *   Why? Because the Surplus only exists if *both* of you say "yes." Therefore, you have equal power over the Surplus, even if you have unequal power over the Baseline.

  **The Calculation:**
  *   **Sister:** $80k (Baseline) + $25k (Half Surplus) = **$105k**
  *   **You:** $20k (Baseline) + $25k (Half Surplus) = **$45k**

  ### 2. Why Your Sister's Logic is Flawed

  Your sister is arguing for a 4:1 split ($120k for her, $30k for you).
  *   **Her Gain:** $40k over her baseline.
  *   **Your Gain:** $10k over your baseline.

  She is claiming 80% of the *benefit of working with you*. Essentially, she is treating you like an employee she hired to help her maximize her network, rather than a co-owner of the venture.

  If you accept her deal, you are being paid for your labor, but you are not being compensated for **enabling her synergy.** You are the bottleneck that allows her $80k network to become a $150k business. If you say "no," she loses that $50k surplus entirely. You have 50% veto power over that surplus, so you deserve 50% of that surplus.

  ### 3. Why 50/50 is Also Risky

  If you split $150k evenly ($75k each):
  *   **Her Gain:** -$5k (She makes *less* than going solo).
  *   **Your Gain:** +$55k.

  This is unsustainable. She has a rational financial incentive to leave you, start her own shop, and make $80k. A deal only works if **both** parties make more than they would alone.

  ### 4. How to Pitch This to Her

  You need to move the conversation from "Who is more valuable?" to "How do we split the value we create *together*?"

  **Say something like this:**
  > "I've been thinking about the numbers. If you go solo, you make $80k. If I go solo, I make $20k. That's $100k total. But if we stay together, we make $150k. That means our partnership creates an extra $50k that wouldn't exist otherwise.
  >
  > Your proposal gives you almost all of that extra $50k. My proposal (50/50) asks you to lose money compared to going solo.
  >
  > A fair split acknowledges your connections (your baseline) and my labor (my baseline), but splits the *partnership bonus* evenly. That puts you at $105k and me at $45k. You make $25k more than going solo, and I make $25k more than going solo. We benefit equally from staying together."

  ### 5. Critical Nuances to Consider

  Before you finalize this, check these three variables. They could shift the numbers.

  **A. Asset Ownership**
  You inherited the shop *together*. You own 50% of the physical assets (tools, lease, brand).
  *   If she leaves to start her own shop, does she need to buy new equipment? If so, her "$80k solo" profit might actually be lower once she factors in capital costs you already own.
  *   If she stays, she is using *your* half of the inherited assets. You could arguably charge "rent" on your half of the equipment before profits are split. This strengthens your position.

  **B. Workload Equality**
  The math above assumes you are working equal hours.
  *   If she is making the calls (sales) and you are in the shop 60 hours a week cutting wood (production), the split needs to adjust for **labor wage** first.
  *   *Better Structure:* Pay yourselves a market-rate salary for the hours you work first. Then split the remaining *profit* according to the Baseline+Surplus model. This prevents resentment if one of you is grinding harder.

  **C. The "Family Tax"**
  Money destroys families faster than businesses do.
  *   **Transparency:** All books must be open. No "off the books" contractor deals for her.
  *   **Exit Clause:** What if one of you wants out in two years? Agree now on how a buyout works. (e.g., "If one wants out, the other has right of first refusal based on a 3-year earnings average").
  *   **Decision Making:** If you split profits 70/30 or 60/40, who makes the final call on buying a new saw? Tie profit share to voting power, or keep voting 50/50 regardless of profit share. (Recommendation: Keep voting 50/50 to prevent dictatorship).

  ### Summary Recommendation

  **Do not do 50/50.** It ignores her leverage and she will eventually resent you or leave.
  **Do not do 80/20.** It ignores your leverage and you will eventually resent her.

  **Aim for roughly 70/30 ($105k / $45k).**
  This acknowledges her superior market position while rewarding you equally for the value of the partnership itself.

  If that feels too hard a sell, propose a **Base + Profit Share** model:
  1.  You both take a guaranteed "draw" (salary) based on your baseline needs (e.g., she takes $80k, you take $20k).
  2.  The remaining $50k profit is split 50/50.
  3.  This results in the exact same numbers ($105k/$45k) but *feels* different psychologically. It frames the first chunk as "what you bring to the table" and the second chunk as "what we build together."

  This validates her connections without devaluing your contribution to the synergy.
