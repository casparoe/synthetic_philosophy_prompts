answer: |-
  **Setting:** *A quiet corner of a university common room. Through the glass wall, their friend Leo is at a desk, pen hovering over a contract. He holds Ticket C. The dealer has offered to swap it for Ticket A for a small fee. Leo prefers A to C. He is about to sign.*

  **Elias:** He's going to do it. Look at his hand. He's reaching for the pen.

  **Mara:** He doesn't see the trap anymore. He just sees a chance to upgrade. To him, right now, A is better than C. Why wouldn't he take it?

  **Elias:** Because he's a fool. Or rather, because he's naive. If he were sophisticated, he wouldn't be holding Ticket C right now. He would have looked at the first trade—A for B—and realized that accepting it was the first step on a conveyor belt back to A, only poorer. Rationality is backward induction. You look at the end of the game, see you get pumped dry, and refuse to play the first hand.

  **Mara:** That's easy to say from the sidelines. But you're describing a ghost. You're saying he should have refused the first trade *because* he knew he'd fail the third. But at the first trade, B really was better than A. By your logic, he has to let his future weakness dictate his current strength.

  **Elias:** Not weakness. Prediction. A sophisticated agent knows their future self is going to maximize utility at that future moment. At step three, C over A is a loss, but A over C is a gain. He knows he'll take it. So, at step one, he knows taking B leads to a cycle. Refusing the first trade isn't about binding his future self; it's about recognizing that the path starting with that trade leads to a cliff. You don't need willpower to not walk off a cliff. You just need to see the edge.

  **Mara:** But the edge isn't visible at step one. At step one, it looks like a straight road. You're saying he should treat his future self as an adversary, or a broken machine. I'm saying he should treat his future self as *himself*. The solution isn't to cower at the starting line because you predict you'll cave later. The solution is to make a plan—"I will not enter the cycle"—and stick to it.

  **Elias:** "Stick to it." There it is. The magic words. Mara, what mechanism do you propose? At step two, he has Ticket C. He prefers A to C. The dealer offers the trade. If he follows your plan, he must say no. But his preferences scream "yes." If he says no, he is deliberately choosing an option he ranks lower. How is that rationality and not just stubbornness?

  **Mara:** It's not stubbornness if the plan was rational when made.

  **Elias:** But plans don't have causal power. Preferences do. At step two, the only thing that exists is his preference for A over C. To ignore that is to act against his own judgment of what is good. You're asking him to be a slave to a dead intention.

  **Mara:** I'm asking him to be an agent who exists through time. You talk about rationality as if it's a snapshot. *Synchronic*, you'd call it. Is this specific choice optimal right now? But agency is *diachronic*. It's a narrative. If I can't commit to a plan because my preferences shift slightly at every node, I'm not an agent. I'm a sequence of puppets. Resolute choice isn't ignoring preferences; it's weighting the preference for integrity higher than the preference for the local upgrade.

  **Elias:** That sounds noble, but it's circular. You're saying he should stick to the plan because he made a plan. Why did he make the plan? Because he thought it was good. But now, at step two, he *doesn't* think it's good anymore. He thinks trading is good. If you say, "Ignore that, trust Past-You," you're just privileging one moment in time arbitrarily. Why is Past-You the boss of Present-You?

  **Mara:** Because Present-You is about to get money-pumped! Look, turn it back on me, Elias. You say he should have refused the first trade. Fine. At step one, he prefers B to A. It's a free upgrade. Why should he refuse it?

  **Elias:** Because taking it triggers the sequence that loses money.

  **Mara:** Exactly. He is refusing a local gain—B over A—because of a future consequence. He is binding his current action to a future outcome. That is a commitment! You claim sophistication avoids the need for "binding," but refusing that first trade *is* a binding act. You are forcing your current self to suffer a local loss (forgoing B) to satisfy a global constraint. That's no different than my resolute chooser forcing their future self to suffer a local loss (forgoing A) to satisfy a global constraint.

  **Elias:** It's different. When I refuse the first trade, I am maximizing my expected utility *at that moment*. I am accounting for all future costs. I am not binding myself; I am calculating. When you tell him to refuse the third trade, he is *not* maximizing utility at that moment. He is sacrificing utility now for the sake of... what? Consistency?

  **Mara:** For the sake of not being a pumpable mess! You say you're "calculating" at step one. But what if the calculation is hard? What if the cycle is longer? Ten steps? At step one, can he really simulate ten future preference reversals? Your sophisticated agent needs omniscience. My resolute agent just needs integrity. He says, "I have decided not to trade in cycles," and when step three comes, he doesn't re-calculate. He executes.

  **Elias:** But if he doesn't re-calculate, he's blind! If at step three, the deal actually *was* different—say, no fee—he should take it! Your resolute chooser might miss a genuine opportunity because he's married to a plan made in ignorance. The sophisticated chooser is flexible. He says, "If I know I'll be exploited, I stop. If I know I won't, I go." He responds to reasons. Your agent responds to rules.

  **Mara:** And your agent responds to reasons only as long as they fit in a single moment. Here is the crux, Elias. You say refusing the first trade is "calculation," not "commitment." But where does the force of that calculation come from? It comes from the fact that he *won't* change his mind later. If he thought, "I'll take B now, and then at step three I'll be strong and refuse the trade back to A," he wouldn't need to refuse step one. He only refuses step one because he admits he *cannot* trust himself at step three.

  **Elias:** He admits he is time-consistent in his preferences, which leads to dynamic inconsistency in his choices. Yes.

  **Mara:** No, he admits he lacks *agency*. You're saying the only rational move is to lobotomize his future options at the start. That's a pre-commitment device. That's Ulysses tying himself to the mast.

  **Elias:** It's internal pre-commitment. It's knowledge.

  **Mara:** It's the same thing! You're saying the only way to be rational is to admit you're irrational and restrict your freedom. I'm saying you can be rational by exercising the freedom to maintain a intention. You think rationality is about never having a conflict between your selves. I think rationality is about resolving that conflict in favor of the whole.

  **Elias:** But how? Physically, how does the resolution happen? At step three, the preference for A is real. The pain of losing money is abstract. The preference for A is immediate. Unless you posit some magical "will" that overrides preference, your resolute choice is just a description of a miracle. "He just... doesn't do it."

  **Mara:** And unless you posit that the agent is merely a series of temporal slices with no connection, your sophistication is just a description of defeat. "He just... can't start."

  *(Leo signs the paper. The dealer hands him Ticket A and takes the fee. Leo looks at the ticket, then at the empty wallet, then blinks. He is back where he started.)*

  **Elias:** There. He's back at A. Minus three fees. A sophisticated agent would be sitting where we are, never having stood up.

  **Mara:** And a resolute agent would be standing there holding Ticket C, having said "no" when it mattered. Instead, we have a man who thinks he's making free choices at every step, while walking in a circle.

  **Elias:** So you still think he should have ignored his preference for A over C at the last second? Even knowing he'd end up poorer?

  **Mara:** I think he should have identified with the plan, not the impulse. If rationality is just satisfying the strongest desire at time *t*, then being rational guarantees you get exploited.

  **Elias:** And if rationality is obeying a plan regardless of the desire at time *t*, then rationality is just superstition. It's believing a past thought has magic power over a present choice.

  **Mara:** It's believing the past thought belongs to the same person as the present choice.

  **Elias:** *(Sighs)* Maybe that's the disagreement. I see a chain of moments. You see a single line.

  **Mara:** And until you see the line, Elias, you'll keep telling people to cut it at the start, rather than teaching them how to hold it together.

  **Elias:** And until you see the moments, Mara, you'll keep telling people to hold on tight, without explaining what their hands are actually gripping.

  *(They watch Leo stand up, looking confused, as the dealer smiles and shuffles the tickets for the next customer.)*
