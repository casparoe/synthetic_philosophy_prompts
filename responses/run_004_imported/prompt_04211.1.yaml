answer: |-
  This is an excellent question that cuts to the heart of Peirce's mature metaphysics and its relationship to twentieth-century philosophy of probability. You have identified the precise tension that makes CP 2.664 such a rich text: the friction between the *explication* of the concept (which looks frequentist/counterfactual) and the *ontological status* of the object (which looks dispositional/propensity).

  To answer your core question directly: **Yes, there is a real difference between the two readings, and the distinction does not collapse, provided one accepts Peirce's specific metaphysical commitments.** If you strip away Peirce's Scholastic Realism, the distinction does tend to collapse into a problematic counterfactual frequentism. But Peirce does not allow you to strip that away.

  Here is a breakdown of what Peirce is committed to in this passage, why the "collapse" worry is understandable but ultimately misplaced in his system, and how this positions him relative to Popper.

  ### 1. The Metaphysical Stakes: Truth-Makers for Counterfactuals
  Your worry about the "collapse" rests on a semantic observation: if the *content* of the "would-be" is exhausted by statements about how the die *would* behave, isn't that just a modalized frequency view?

  For a **Nominalist** (like von Mises or a logical positivist), the answer is yes, and it creates a problem. If there is no actual infinite series, what makes the counterfactual statement "If thrown infinitely, the die *would* land 1/6" true? A nominalist has no truth-maker for this claim other than the physical symmetry of the die, which they usually try to reduce to logical indifference or actual finite frequencies.

  For **Peirce**, a Scholastic Realist, the answer is no. Peirce argues that generals (laws, habits, possibilities) are *real*.
  *   **The Ontology:** The "would-be" is a real property (a "habit") residing in the die. It exists in the present, regardless of whether the throws occur.
  *   **The Truth-Maker:** The counterfactual "It would land 1/6" is true *because* the die possesses this real habit. The habit grounds the counterfactual; the counterfactual does not constitute the habit.

  In CP 2.664, Peirce explicitly blocks the reductionist move: *"this statement will not of itself imply that the 'would-be' of the die consists in such behavior."* He is insisting that the disposition is ontologically prior to its manifestation. This is the hallmark of a propensity interpretation.

  ### 2. The Pragmatic Maxim: Meaning vs. Being
  The source of your confusion is likely Peirce's application of his **Pragmatic Maxim**. You note that he says "in order to define... it is necessary to say how it would lead the die to behave."

  Peirce distinguishes between the **being** of a concept and the **meaning** of a concept.
  *   **Being (Ontology):** The "would-be" is a real Thirdness (a habit). It is not identical to the actions (Secondness).
  *   **Meaning (Semantics):** We cannot conceive of the habit *except* through its potential effects. The *whole conception* of the habit is the conditional prediction of outcomes.

  So, when Peirce says we must describe the behavior to "define" the would-be, he is speaking epistemologically and semantically, not ontologically. He is saying: "You can't talk about this property without referencing what it does." But he simultaneously insists: "Do not mistake the reference for the thing itself."

  This is why the frequentism/propensity distinction doesn't collapse for Peirce. A frequentist says probability *is* the limit of the series. Peirce says probability *is* the habit that *would produce* the limit of the series if the series were run. The counterfactual frequency is the *sign* of the propensity, not the *referent*.

  ### 3. Peirce vs. Popper: Propensity with a Twist
  Commentators are right to link Peirce to Popper. Popper explicitly credited Peirce as a precursor. In this passage, Peirce anticipates Popper's central claim: probability is a physical property of the experimental arrangement (the die's shape/homogeneity), not a property of a sequence of events.

  However, there is a nuanced difference in *what kind* of property it is:
  *   **Popper's Propensity:** Tends to be physicalist and causal. It is a dispositional property of the physical setup to produce a frequency.
  *   **Peirce's "Would-Be":** Is logical and semiotic, grounded in **Thirdness**. For Peirce, a "habit" is the way a law of nature operates. It is not just a physical push; it is a normative tendency.

  In CP 2.664, Peirce compares the die's would-be to a **man's habit**. This is crucial. A man's habit is not just a physical disposition; it is a rule of action. By analogy, the die's probability is a "rule" the die follows. This aligns with Peirce's Tychism (the doctrine that absolute chance is a real factor in the universe). The "would-be" is the objective chance inherent in the object, which acts as a law-like constraint on outcomes without determining them singly.

  ### 4. What Peirce is Committed to in CP 2.664
  To summarize exactly what Peirce is committed to in this endnote, we can distinguish three layers:

  1.  **Anti-Actualism:** He rejects the 1878 view (and von Mises) that probability requires an *actual* infinite series. The "would-be" exists even if the die is never thrown.
  2.  **Dispositional Realism:** He commits to the reality of dispositions. The "would-be" is a genuine property of the individual object (the die), analogous to hardness or fragility. This earns the "propensity" label.
  3.  **Pragmatic Explication:** He commits to the view that the *cash value* of this property lies entirely in conditional predictions about long-run frequencies. We cannot access the "would-be" mystically; we access it by considering the long-run statistics it governs.

  ### Conclusion: Does the Distinction Collapse?
  You asked: *"Does the frequentism/propensity distinction simply collapse once frequentism is allowed to help itself to counterfactuals like this?"*

  **For a Nominalist: Yes.** If you don't believe in real dispositions, "counterfactual frequentism" is an empty shell. It posits a truth (the counterfactual) without a truth-maker.
  **For Peirce: No.** Because he is a Realist about dispositions, the counterfactual is grounded in a real property.

  Therefore, the passage **does earn the propensity reading**, but with a specific Peircean caveat: it is a propensity grounded in **Scholastic Realism** rather than physicalism. Peirce is arguing that probability is a real mode of being (Thirdness) that manifests phenomenally as statistical regularity.

  In your seminar, you can argue that Peirce in 1910 is effectively saving the frequentist *mathematics* (the long-run limits) from the frequentist *metaphysics* (the denial of single-case reality) by positing the "would-be" as the real ontological ground that makes the long-run mathematics applicable to single cases. He isn't retreating to 1878 frequentism; he is subsuming it under a broader metaphysics of habit.

  **Suggested Secondary Reading for Context:**
  If you need to bolster this analysis, look at **Christopher Hookway's** work on Peirce's pragmatism, or **Margaret Masterman's** discussions of Peirce and Popper. Also, **Cheryl Misak's** *The American Pragmatists* handles the shift in Peirce's realism well. Specifically, search for discussions on "Peirce's Scholastic Realism and Probability."
