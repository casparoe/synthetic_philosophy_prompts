      *   *Nuance on Regress:* Rosenthal stops the regress by making the HOT unconscious. Kriegel stops it by making the self-representation intrinsic. I need to highlight that Rosenthal's solution is often seen as ad hoc (why does an *unconscious* thought make a state conscious?), whereas Kriegel's is structural.
      *   *Nuance on Targetless HOTs:* For Rosenthal, this leads to the "problem of the missing qualia." If I have a HOT about a red experience, but no red experience exists, what is it like? Rosenthal says "nothing," but it seems like something. Kriegel says the experience *must* exist, so there is qualia. This is a strong point for Kriegel.
