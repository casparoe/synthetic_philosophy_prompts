  2.  **Deconstruct the Theories:**
      *   **Rosenthal's HOT Theory:**
          *   *Claim:* A mental state $M$ is conscious iff there is a suitable HOT about $M$.
          *   *Structure:* Extrinsic. State $M$ (first-order) + State $M^*$ (higher-order). They are numerically distinct.
          *   *Motivation:* Explains the difference between conscious and unconscious states without changing the intrinsic nature of the first-order state. Fits with empirical data (subliminal perception).
          *   *Vulnerability:* If $M^*$ must be conscious, we need $M^{**}$, leading to regress. If $M^*$ is unconscious, how does it confer consciousness? Also, targetless HOTs imply conscious states without qualitative character (the "empty" problem).
      *   **Kriegel's Self-Representationalism:**
          *   *Claim:* A mental state $M$ is conscious iff $M$ represents itself (in the right way).
          *   *Structure:* Intrinsic/Complex. One state with two contents: world-directed and self-directed.
          *   *Motivation:* Avoids the extrinsic gap. Solves regress (the state is conscious *in virtue of* representing itself, not in virtue of a *separate* state). Solves targetless HOTs (if the state exists, the target exists, because they are the same).
          *   *Vulnerability:* Is it plausible that a state can represent itself? Does it collapse into first-order representationalism? Does it just hide the extrinsic relation inside one box?

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Introduce Higher-Order Representationalism (HOR) generally.
          *   Introduce the two protagonists: Rosenthal (Extrinsic) vs. Kriegel (Intrinsic/Self-Representational).
          *   Thesis statement: While Kriegel's move to self-representationalism elegantly blocks the formal possibility of targetless errors and halts the regress, it arguably relocates the explanatory burden rather than dissolving it, raising new questions about the metaphysics of self-reference.

      *   **Rosenthal's Extrinsic HOT Theory:**
          *   Explain the core mechanism: Consciousness is a relational property.
          *   Motivation: Transitivity Principle (we are conscious of being in mental states). Explains unconscious states (same quality, no HOT).
          *   Address (a) Regress: Rosenthal bites the bullet. The HOT itself is *unconscious*. If it were conscious, regress ensues.
          *   Address (b) Targetless HOTs: Rosenthal accepts this. A targetless HOT creates a *seeming* conscious state. This is a feature, not a bug (explains illusions), but critics say it leaves the state without qualitative character (the "what it's like" problem).

      *   **Kriegel's Self-Representationalism:**
          *   Explain the core mechanism: Complex content within one state ($M$ represents $x$ and $M$ represents $M$).
          *   Motivation: Preserve the intuition that consciousness is intrinsic to the experience.
          *   Address (a) Regress: Dissolved. No second state needed. The self-representing component is intrinsic, so no infinite chain of distinct states.
          *   Address (b) Targetless HOTs: Impossible. You can't have a self-representing state that doesn't exist. If the state exists, the target exists. This secures the reality of the qualitative character.

      *   **Critical Evaluation (The Verdict):**
          *   *Does it solve Regress?* Yes, formally. But does it explain *how* a state represents itself without a homunculus or circularity? It pushes the mystery into the nature of "self-representation."
          *   *Does it solve Targetless HOTs?* Yes, it guarantees existence. But does it guarantee *accuracy*? A state could misrepresent its own properties even if it exists.
          *   *Relocation Charge:* The extrinsic relation becomes an intrinsic relation between parts of content. The metaphysical work is the same.
          *   *My Stance:* Kriegel improves on the *coherence* of the view (avoiding the weirdness of targetless HOTs), but the explanatory gap regarding *how* representation confers consciousness remains. It's a structural improvement, not necessarily a metaphysical dissolution.

