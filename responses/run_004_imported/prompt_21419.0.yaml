answer: |-
  **Seminar Paper: Extrinsic vs. Intrinsic Higher-Order Representationalism**

  **Introduction**

  Higher-Order Representationalism (HOR) has emerged as one of the dominant frameworks in the analytic philosophy of mind for explaining phenomenal consciousness. The core intuition driving HOR is the Transitivity Principle: a mental state is conscious only if the subject is, in some sense, aware of being in that state. Within this framework, two prominent variants have arisen: David Rosenthal's Higher-Order Thought (HOT) theory and Uriah Kriegel's Self-Representationalism. While both agree that consciousness involves a higher-order representation targeting a lower-order state, they diverge fundamentally on the metaphysics of that relation. Rosenthal defends an *extrinsic* model, where the higher-order state is numerically distinct from the target state. Kriegel defends an *intrinsic* model, where the state represents itself via a complex internal structure. This paper will compare these positions, focusing on how Kriegel's intrinsic turn addresses the threat of regress and the problem of targetless higher-order thoughts. I will argue that while Kriegel's self-representationalism offers a structurally superior account that avoids specific logical pitfalls of Rosenthal's view, it ultimately relocates rather than dissolves the explanatory difficulties regarding how representation confers consciousness.

  **Rosenthal's Extrinsic HOT Theory**

  David Rosenthal's theory posits that a mental state $M$ becomes conscious when it is targeted by a suitable Higher-Order Thought ($M^*$). Crucially, for Rosenthal, $M$ and $M^*$ are numerically distinct existences. $M$ is a first-order perceptual state (e.g., seeing red), and $M^*$ is a cognitive state thinking that one is in $M$.

  The primary motivation for Rosenthal's extrinsicism is empirical flexibility. By keeping the first-order state independent of the higher-order state, Rosenthal can account for unconscious mental states. A subliminal perception is simply an $M$ that lacks an accompanying $M^*$. This preserves the intuition that the qualitative character of a state is one thing, and our awareness of it is another.

  However, this extrinsic structure generates two significant difficulties:

  *(a) The Threat of Regress:* If a mental state $M$ is conscious only because it is targeted by $M^*$, what makes $M^*$ conscious? If $M^*$ must itself be conscious to confer consciousness, we require a third state $M^{**}$, launching an infinite regress. Rosenthal halts this regress by stipulating that the HOT ($M^*$) is itself *unconscious*. While this stops the regress formally, it invites a conceptual objection: How can an *unconscious* thought render another state conscious? Critics argue this renders the mechanism mysterious, positing a "magic" relation where unconscious cognition conjures phenomenology.

  *(b) Targetless HOTs:* Because $M$ and $M^*$ are distinct, it is metaphysically possible for $M^*$ to occur without $M$. Rosenthal accepts this possibility. In a case of a targetless HOT, the subject seems to have a conscious experience, but there is no actual first-order state present. Rosenthal argues this explains illusions of consciousness. However, this leads to the "problem of missing qualia." If there is no first-order state, there is no qualitative character (no redness). Yet, the subject reports a conscious experience. This implies a conscious state with no phenomenal properties, a conclusion many find incoherent. It suggests that on Rosenthal's view, consciousness is merely a matter of being *judged* to be conscious, rather than actually possessing phenomenology.

  **Kriegel's Self-Representationalism**

  Uriah Kriegel accepts the HOR framework but rejects the extrinsic architecture. For Kriegel, a conscious state is a single mental state with a complex content. It represents the world (first-order content) and, simultaneously, represents itself (higher-order content). Thus, the state is intrinsically self-representational.

  *(a) Addressing the Regress:* Kriegel's move to intrinsicness dissolves the regress problem. Since the higher-order component is not a separate state but an aspect of the very state it targets, no third state is required to make the higher-order component conscious. The state is conscious in virtue of its self-representing structure. There is no need to ask what makes the higher-order component conscious, because it is not a distinct entity that *needs* to be made conscious; it is part of the conscious whole. This avoids Rosenthal's counter-intuitive claim that unconscious thoughts generate consciousness.

  *(b) Addressing Targetless HOTs:* The intrinsic model renders targetless higher-order thoughts impossible. On Rosenthal's view, $M^*$ can exist without $M$. On Kriegel's view, the "target" is the state itself. A self-representing state cannot exist without its target, because the target *is* the state. If the state exists, the target exists. This guarantees that whenever there is a conscious experience, there is actual qualitative character present. It secures the reality of phenomenology against the threat of empty higher-order judgments.

  **Verdict: Dissolution or Relocation?**

  Does Kriegel's self-representationalism genuinely dissolve the difficulties facing Rosenthal, or does it merely relocate them within a single, more complex mental state? My verdict is that while Kriegel successfully blocks the *logical* possibilities that plague Rosenthal (specifically targetless errors), he relocates the *explanatory* burden regarding the nature of representation and consciousness.

  Regarding the **regress**, Kriegel's solution is structurally sound but metaphysically demanding. By claiming a state represents itself, Kriegel avoids an infinite chain of distinct states. However, this pushes the mystery into the nature of self-reference. How does a mental state turn its representational arrow upon itself without a homunculus or a split in the subject? Rosenthal's extrinsic model at least locates the representational relation between two clear relata. Kriegel collapses the relata. While this stops the regress, it requires a robust account of how a single entity can function as both representation and represented without circularity. If the explanatory gap lies in how representation confers consciousness, merging the states does not explain *why* self-representation succeeds where other-representation (in Rosenthal's case) requires an unconscious vehicle. The "magic" of consciousness conferral remains; it is just internalized.

  Regarding **targetless HOTs**, Kriegel undoubtedly improves on Rosenthal. Rosenthal's admission of targetless HOTs leads to the absurdity of conscious states without qualia. Kriegel's guarantee that the target exists preserves the link between consciousness and phenomenology. However, this victory comes at the cost of flexibility. Rosenthal's model explains *misrepresentation* of one's mental states easily (the HOT says "I am angry," but the first-order state is "sadness" or non-existent). Kriegel's model makes misrepresenting the *existence* of the state impossible. While this secures the reality of the experience, it struggles to account for cases where we are mistaken about the *nature* of our experience. If the state represents itself, does it represent itself accurately? If a state can misrepresent its own properties (e.g., representing a faint pain as intense), then a version of the targetless problem returns in the form of the "misrepresenting self." The state exists, but its self-representation is flawed. Thus, the problem of error is not eliminated, merely shifted from existence-conditions to accuracy-conditions.

  **Conclusion**

  Kriegel's self-representationalism is a sophisticated refinement of the higher-order approach. By making the higher-order relation intrinsic, he successfully immunizes the theory against the threat of regress and the incoherence of targetless conscious states. In this regard, it is a superior *logical* construction to Rosenthal's extrinsic HOT theory. However, it does not fully dissolve the deeper metaphysical difficulties. It relocates the problem of how representation confers consciousness from a relation between two states to a relation within one state. The mystery of how physical or functional processes generate subjective awareness is not solved by making the process self-referential. Therefore, while Kriegel saves HOR from internal inconsistency, he does not necessarily bridge the explanatory gap between representation and phenomenology any more effectively than Rosenthal. He builds a tighter ship, but it sails on the same uncertain seas.
