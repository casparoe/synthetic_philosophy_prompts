      *   **Labels:** Self-reported tags in a spreadsheet based on subjective feeling ("how the state felt from the inside").
      *   **The Conflict:** A friend (ML practitioner) argues these labels aren't "real ground truth" because of intra-rater reliability issues (can't verify consistency of the subjective feeling over time).
