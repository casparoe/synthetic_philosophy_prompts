      *   *Move-by-Move:*
          *   (1) Callum wins on logic/definition, but misses the system constraint.
          *   (2) Ines wins on empirical content. The axioms add constraints.
          *   (3) Callum wins on welfare/normative interpretation. Preference $\neq$ Prudence.
          *   (4) Ines wins on descriptive surprise. Consistency is not guaranteed by nature.
          *   (5) Callum wins on the "commitment" critique. It breaks the link between choice and personal advantage.
      *   *Overlooked Aspects:*
          *   Operationalism vs. Realism (The core philosophical divide).
          *   The "As If" methodology (Friedman).
          *   Latent Variables (Physics analogy: Utility like Temperature?).
          *   Structural vs. Reduced Form.

  5.  **Refining the Physics Analogies:**
      *   *Utility vs. Temperature:* Temperature is defined by thermometer readings (operational), but we believe it reflects mean kinetic energy (ontological). RP says Utility *is* the choice, no kinetic energy needed.
      *   *Conservation Laws:* WARP is like a conservation law. If violated, the model breaks.
