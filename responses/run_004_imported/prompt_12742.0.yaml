answer: |-
  Your friend's position is the standard "orthodox" defense among decision theorists: since the expectation integral is not absolutely convergent, the expectation is undefined, and rationality requires nothing of us. It is a clean, mathematical way to wash one's hands of the problem.

  However, you are right to feel that this is a retreat, not a solution. By declaring the Pasadena game "undefined," Expected Utility Theory (EUT) does not merely draw a boundary; it admits a structural failure that compromises its claim to be a *normative* theory of rationality. If EUT cannot handle the Pasadena game, it cannot guarantee consistency in decision-making, it violates the principle of description invariance, and it allows for "contagion" that breaks the logic of ordinary gambles.

  Here is the strongest case for your side: that the Pasadena game exposes a genuine defect in EUT, and the "undefined" defense fails to contain the damage.

  ### 1. The Violation of Description Invariance
  The most damning objection to your friend's "just use the natural order" implication is that it violates **description invariance**. A fundamental axiom of rational choice is that the value of a gamble should depend on the prospects and their probabilities, not on how the agent describes or indexes the states of the world.

  In the Pasadena game, the states of the world are "Heads on toss $n$." Mathematically, these are distinct elements of a sample space. There is no physical or metaphysical reason why state $n=3$ must be "added" to the expectation calculation before state $n=100$. The sample space is a set, not a sequence.

  However, because the series is only conditionally convergent, the sum depends entirely on the order of summation. If you index the outcomes by the toss number ($1, 2, 3...$), the value is $\ln 2$. If you reorder the outcomes (e.g., two negatives for every positive), the value changes. If EUT says the value is $\ln 2$ simply because we *habitually* count integers in ascending order, then the "Expected Value" is not a property of the gamble itself; it is a property of the *calculator's arbitrary convention*.

  A normative theory that yields different verdicts based on the arbitrary indexing of simultaneous possibilities is not a theory of objective rationality. It makes value subjective to the order of calculation. Your friend's suggestion to "move on" ignores that this subjectivity infects the core definition of expectation.

  ### 2. Decision-Theoretic Paralysis
  Normative theories are supposed to guide action. They answer the question: *What should I do?*

  Consider a simple choice: I offer you the Pasadena game for free. Should you take it?
  *   **Intuition:** The game has a positive weak expectation ($\ln 2$). Most outcomes are small, but the positive tails are heavy. It seems rationally permissible, perhaps even required, to take it.
  *   **EUT Verdict:** "Undefined."

  If the expectation is undefined, EUT cannot rank the gamble against the status quo (utility 0). It cannot tell you whether paying \$1 to play is irrational, nor whether accepting it for free is rational. It forces a state of **decision-theoretic paralysis**.

  Your friend argues this is harmless because "theory owes no verdict on every conceivable gamble." But this gamble is not conceptually incoherent. Every payoff is finite. Every probability is finite. The *combination* is coherent. If a theory of rationality falls silent in the face of a well-formed, finite-input scenario, it is not merely idealized; it is **incomplete**. Compare this to physics: if a theory of gravity worked for all planets except one that was slightly oddly shaped, we wouldn't say "gravity owes no verdict here"; we would say the theory is broken.

  ### 3. The Contagion Problem (Linearity Breakdown)
  The "undefined" defense attempts to quarantine the Pasadena game as a singular anomaly. It fails because uncertainty is additive. We rarely face gambles in isolation; we face portfolios.

  Let $P$ be the Pasadena game (expectation undefined).
  Let $G$ be a standard gamble, say, winning \$10 with probability 1 (expectation 10).

  According to the linearity of expectation (a cornerstone of EUT), $E(G + P)$ should equal $E(G) + E(P)$.
  *   If $E(P)$ is undefined, then $E(G + P)$ is undefined.
  *   This means adding a guaranteed \$10 to the Pasadena game renders the *combined package* undefined.

  This leads to absurd preferences. Imagine I offer you choice A: Game $G$ (\$10 for sure). Choice B: Game $G$ + Game $P$.
  Intuitively, Choice B dominates Choice A (since $P$ has a positive "weak" expectation, or at worst, you are adding a gamble to a sure thing). But if EUT declares the expectation of B undefined, it cannot register this dominance.

  Worse, consider the **Pasadena Pair**. You can construct two Pasadena-style games, $P_1$ and $P_2$, such that both have undefined expectations individually, but their sum $P_1 + P_2$ is a guaranteed loss or a guaranteed gain. If EUT says "I have no verdict on $P_1$" and "I have no verdict on $P_2$," it cannot prevent an agent from accepting both and suffering a sure loss. This opens the door to **Dutch Books** (sure-loss contracts). A normative theory that permits Dutch Books in well-specified scenarios is not just idealized; it is normatively bankrupt.

  ### 4. The "Idealization" Defense is a Category Error
  Your friend compares this to "shrugging off an ill-posed request," likening it to frictionless planes in physics. This is a category error.

  Frictionless planes are **counterfactual idealizations**. They describe a world that does not exist to simplify calculations for a world that does. The Pasadena game, however, describes a **logical possibility** within the actual axioms of probability and utility. The inputs (probabilities and payoffs) are physically realizable (assuming finite bankrolls for any specific run).

  The problem is not that the game is "too idealized"; the problem is that the **mathematical machinery of EUT (Lebesgue integration) requires absolute convergence to assign a unique value**, but the **philosophical justification for EUT (rational preference ordering)** demands a value be assigned to coherent preferences.

  When the math and the philosophy clash, your friend suggests sacrificing the philosophy (by accepting silence). You are arguing that we should sacrifice the math (by revising EUT). Given that EUT is a tool for *human reasoning*, not pure mathematics, the math should serve the reasoning. If the math says "undefined" for a scenario where human reason sees a clear preference (e.g., dominance), the math is the defective component.

  ### 5. Conclusion: A Structural Crack, Not a Boundary
  The "undefined" response treats the Pasadena game as a boundary case, like dividing by zero. But dividing by zero involves an operation that is logically prohibited. The Pasadena game involves operations that are all logically permitted (multiplication, addition, limits), which collectively yield instability.

  If you accept your friend's view, you must accept that **rational preference is not always representable by a utility function**, even when all outcomes are finite. This concedes the failure of the Representation Theorems (like Savage's or von Neumann-Morgenstern's) that underpin modern decision theory.

  You are correct: this is not a harmless idealization. It is a proof that Expected Utility Theory, in its standard form, is not robust enough to handle conditional convergence in probability spaces. It cannot guarantee consistency, it violates description invariance, and it creates contagion that paralyzes decision-making in compound gambles. To say "it's undefined, so ignore it" is to sweep a structural crack in the foundation under the rug and hope the house doesn't fall down. The Pasadena game shows that the house is already shaking.
