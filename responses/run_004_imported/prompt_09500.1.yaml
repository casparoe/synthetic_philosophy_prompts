      *   **The Constraint:** The speaker *cannot* out Frank publicly. It would destroy his reputation, hurt his family, and ruin the retirement dinner.
      *   **The Goal:** A 4-5 minute toast. Warm, genuinely funny, honest *to Frank* (without exposing him to the room), suitable for mixed audience (newsroom lifers + family).
      *   **The Tone:** Not hagiography (blind praise), not a "gotcha" (passive-aggressive), but nuanced. It needs to acknowledge the complexity of truth-telling without revealing the specific secret.
      *   **Philosophical Angle:** The user mentioned "standing to blame." The toast shouldn't blame, but it should reflect on the burden of truth.

