  Good evening, everyone. For those who don't know me, I'm [Your Name]. I used to be an intern here, back when Frank still believed interns could be trained rather than merely tolerated.

  Frank asked me to speak tonight, or rather, a bunch of you talked me into it, and Frank sighed heavily and said, "Fine, but keep it under five minutes and for God's sake, fact-check your anecdotes."

  Which is exactly where I want to start. Because if you work in this building, or if you're married to someone who does, you know the Legend of Frank. You know the lectures. I'm pretty sure every single person in this room has sat in Frank's office and heard the speech about the "Cardinal Sin." You know the one. It's the speech about the quote that sounds *almost* right, so you smooth out the grammar. It's the speech about the subject who *definitely* paused and looked out the window, but you didn't actually see it happen, so you can't write it down.

  Frank called it "fiction." He called it "betrayal." And if you were an intern in the 90s, he called it "the reason you won't have a career in this building."

  [Laughter]

  And honestly? It was terrifying. But looking around this room tonight, at the work you've all done, at the awards on the shelves, at the trust this community puts in this paper—I realize that fear was actually a form of care.

  Frank didn't care about rules for the sake of rules. He cared about the contract between the writer and the reader. He understood that when someone opens our paper, or clicks our link, they are trusting us to tell them what actually happened in a world that is increasingly comfortable with "good enough."

  Now, I cover science and ideas now, so I spend a lot of time thinking about observation. And one thing I've learned is that seeing the truth clearly is incredibly difficult. Memory is slippery. Deadlines are tight. And the desire to make a story *sing* is a powerful temptation.

  It is so much easier to write what *should* have happened than what *did*.

  Frank knew that. He knew how tempting it is to help the story along. And because he knew that temptation better than anyone, he built a fortress around this newsroom to keep it out. He made himself the guardian of the standard. He took the heat so that the copy didn't have to.

  There is a line in his 1988 profile—the piece that brought him to this city, the piece that started all of this—where he writes about the weight of putting words on a page that become part of the record. He wrote that a journalist's job isn't just to tell a story, but to tell it in a way that survives the morning after.

  I think about that a lot. Because standards aren't just about being right. They're about being honest when it would be easier not to be. They're about holding yourself to a measure that might be uncomfortable.

  Frank, you held us to that measure. You made us rewrite. You made us call sources back. You made us cut the beautiful sentence because it wasn't the true one. And because you did that for thirty years, this paper is better. The record is cleaner. And we are better journalists.

  To Frank's family: Thank you for sharing him with us. We know he took this work home with him. We know he worried about the commas and the quotes at the dinner table. But I hope you also know that because of that worry, because of that rigor, we told the truth more often than we would have otherwise. That is his legacy. Not perfection—none of us are perfect—but a relentless, stubborn commitment to getting it right.

  Frank, you're retiring now. You don't have to edit the copy anymore. You don't have to chase the sources. But I hope you know that the standard you set? It's still here. We're still guarding it.

  So, if everyone could raise a glass.

  To Frank. May your retirement be fact-checked, may your memories be your own, and may you never have to correct another subjunctive verb again.

  Cheers.
