prompt: |-
  For a chapter of my dissertation on the prehistory of collective intentionality, I keep returning to a comparison that the secondary literature does not seem to address. Contemporary theorists of joint action disagree over whether shared intention can be explained in purely individualistic terms. Michael Bratman holds that it reduces to a structure of interlocking individual intentions and meshing sub-plans, sustained by common knowledge and mutual responsiveness; nothing in this analysis requires that participants owe each other anything beyond what practical rationality demands, so the shared intention simply lapses if one party's own intention does. Margaret Gilbert denies this: joint action, on her view, requires a primitive "joint commitment," irreducible to any sum of individual commitments, which alone explains why participants acquire genuine obligations to one another that cannot be dissolved by a unilateral change of heart — rescinding the commitment requires the concurrence of all parties.

  Rousseau, writing more than two centuries before either position was formulated, describes the founding of a political community as an act that creates a "moral and collective body" possessing its own unity and will, and he insists that this general will is categorically distinct from the "will of all," the mere aggregate of private wills. Given his actual arguments for that distinction, which side of the Bratman/Gilbert dispute do you think Rousseau's considered position supports, and why? Point to the specific doctrines that tell for or against each attribution, and flag anything in his account of the general will that resists assimilation to either camp.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Prehistory of collective intentionality (dissertation chapter).
      *   **Core Comparison:** Rousseau's political philosophy vs. Contemporary theories of joint action (Bratman vs. Gilbert).
      *   **The Dispute:**
          *   *Bratman (Individualistic/Reductive):* Shared intention = interlocking individual intentions + meshing sub-plans + common knowledge + mutual responsiveness. No inherent obligations beyond practical rationality. Unilateral withdrawal is possible (intention lapses).
          *   *Gilbert (Non-Individualistic/Primitive):* Shared intention = Joint Commitment. Irreducible to individuals. Creates genuine obligations. Unilateral withdrawal is *not* possible (requires concurrence).
      *   **Rousseau's Position:** Founding of political community creates a "moral and collective body" (General Will vs. Will of All). General Will is categorically distinct from the aggregate of private wills.
      *   **Task:** Determine which side (Bratman or Gilbert) Rousseau supports based on his arguments. Identify specific doctrines supporting/opposing each. Flag aspects of Rousseau that resist *both* camps.

  2.  **Initial Assessment & Hypothesis Generation:**
      *   *Surface Level:* Rousseau sounds like Gilbert. He talks about a "collective body," a "general will" distinct from the sum of parts, and obligations that bind citizens. The "Social Contract" creates a new entity. This aligns with Gilbert's "plural subject" and "joint commitment."
      *   *Nuance Level:* However, Rousseau is also deeply concerned with individual freedom (*amour de soi* vs. *amour propre*). He insists that in obeying the General Will, one obeys oneself. This sounds somewhat individualistic (autonomy). But does it reduce to Bratman's interlocking intentions? Probably not, because Bratman's model is too weak for the *obligatory* force Rousseau demands (being "forced to be free").
      *   *Complication:* Rousseau's metaphysics of the "public person" might exceed Gilbert's normative account. Gilbert focuses on commitment/obligation; Rousseau focuses on ontological transformation (becoming a moral being).
      *   *Hypothesis:* Rousseau aligns much more closely with Gilbert regarding the *irreducibility* and *obligatory force* of the collective stance, but his account involves a metaphysical/ontological transformation of the agent that goes beyond Gilbert's normative phenomenology and certainly exceeds Bratman's functionalism.

  3.  **Analyzing Bratman vs. Rousseau:**
      *   *Bratman:* Shared intention is a web of "I intend." If I stop intending, the shared intention breaks (for me). No inherent obligation to the other, just rationality constraints.
      *   *Rousseau:* The Social Contract alienates rights to the whole. If a citizen tries to withdraw (follow private will against general will), they can be "forced to be free."
      *   *Conflict:* Bratman allows unilateral withdrawal (rationally). Rousseau forbids it politically/morally. For Rousseau, the commitment isn't just interlocking; it's transformative.
      *   *Verdict:* Rousseau rejects Bratman. The "Will of All" (aggregate of private wills) is explicitly distinguished from the "General Will." Bratman basically explains the "Will of All" (meshing sub-plans). Rousseau wants something *more*.

  4.  **Analyzing Gilbert vs. Rousseau:**
      *   *Gilbert:* Joint Commitment creates a "Plural Subject." Obligations are inherent. Unilateral rescission is impossible.
      *   *Rousseau:* The Social Contract creates a "public person." Obligations are absolute. One cannot unilaterally opt out without ceasing to be a citizen (or being forced back in).
      *   *Alignment:* Strong alignment on irreducibility and obligation. Both see the collective stance as creating a new normative status.
      *   *Divergence:* Gilbert's joint commitment is often formed by expression of readiness. Rousseau's is a total alienation of rights. Also, Gilbert focuses on the *structure* of the commitment; Rousseau focuses on the *content* (the common good) and the *ontological status* of the body politic.

  5.  **Identifying Specific Doctrines (Evidence Gathering):**
      *   *For Gilbert (Against Bratman):*
          *   Distinction between "Will of All" (aggregate) and "General Will" (collective). Bratman explains the former; Rousseau demands the latter.
          *   "Forced to be free": Implies obligation cannot be unilaterally dissolved (contra Bratman).
          *   "Total Alienation": Each gives themselves to all, thus to no one individually, but to the moral body. Creates the bond.
          *   The "Moral and Collective Body": Suggests a subject over and above individuals (Plural Subject).
      *   *For Bratman (Nuance):*
          *   Rousseau insists the General Will must come from all and apply to all. This requires individual participation (voting).
          *   Autonomy: Obeying the law is obeying oneself. (But this is compatible with Gilbert's idea that participants are *part* of the plural subject).
      *   *Resisting Both:*
          *   *Ontological Transformation:* Rousseau isn't just talking about intention or commitment; he's talking about changing human nature (from natural man to citizen). Gilbert/Bratman assume stable agents entering a relation. Rousseau assumes the relation *creates* a new type of agent.
          *   *Infallibility/Metaphysics:* The General Will is always right (though judgments can be misled). This adds a metaphysical/teleological layer absent in analytic philosophy of action.
          *   *The Lawgiver:* The need for an external figure to shape the *moeurs* suggests the psychological capacity for this collective intentionality isn't natural (contra Bratman's naturalized rationality and Gilbert's basic sociality).

  6.  **Structuring the Argument:**
      *   **Introduction:** Acknowledge the novelty of the comparison. State the thesis: Rousseau is fundamentally anti-Bratmanian and proto-Gilbertian regarding irreducibility and obligation, but transcends both via his ontological claims about the transformation of the agent.
      *   **The Case Against Bratman:** Focus on the "Will of All" vs. "General Will" distinction. Bratman = Will of All (meshing private intentions). Rousseau rejects this as insufficient for political legitimacy. Focus on unilateral withdrawal (Bratman allows, Rousseau punishes).
      *   **The Case For Gilbert:** Focus on "Joint Commitment" analogues (The Social Contract as total alienation). Focus on Obligations (Gilbert's core feature, Rousseau's "forced to be free"). Focus on the Plural Subject (Rousseau's "moral and collective body").
      *   **The Rousseauian Excess (Resisting Both):**
          *   Ontological vs. Normative: Rousseau changes the *being* of the agent, not just their normative standing.
          *   Teleology: The General Will aims at the common good inherently; Gilbert/Bratman are neutral on content.
          *   The Problem of Formation: The need for the Lawgiver implies this intentionality isn't a natural capacity (Bratman) or a basic social skill (Gilbert), but a historical/cultural achievement.
      *   **Conclusion:** Summarize. Rousseau provides a metaphysical grounding for what Gilbert treats normatively, making him a radical precursor to the non-reductive camp, but one whose aims (political transformation) exceed the scope of action theory.

  7.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Caution:* Don't conflate "General Will" with "Joint Intention" too simplistically. The General Will is an output of the sovereign body. The *formation* of the sovereign body is the joint act. I need to be precise: The *Social Contract* is the joint act creating the *Sovereign*, which then expresses the *General Will*.
      *   *Gilbert Nuance:* Gilbert doesn't necessarily require a "group mind," just a plural subject. Rousseau's "common self" sounds stronger, almost like a group mind. I should note this tension.
      *   *Bratman Nuance:* Bratman does account for obligations in some later work (shared policy), but the prompt specifies the "interlocking individual intentions" view where obligations are thin. Stick to the prompt's framing.
      *   *Key Text:* *Social Contract* Book I, Chapter 6 (The Social Compact) and Book II, Chapter 3 (Whether the General Will can err).

  8.  **Final Polish:** Ensure academic tone suitable for a dissertation chapter. Use specific terminology (meshing sub-plans, plural subject, total alienation, will of all).

  **(Self-Correction Note):** Make sure to emphasize *why* the secondary literature might have missed this. (Likely because political philosophy and philosophy of action developed in silos).

  9.  **Drafting the Response:** (Proceeding to generate output based on these thoughts.)
answer: |-
  This is a compelling and underexploited angle for a dissertation chapter. Placing Rousseau in dialogue with the Bratman/Gilbert dispute illuminates the metaphysical stakes of collective intentionality that analytic social ontology often brackets.

  While Rousseau lacks the technical vocabulary of contemporary action theory, his structural arguments regarding the Social Contract and the General Will align decisively with **Margaret Gilbert's non-reductive account**, while offering a trenchant critique of the **Bratmanian individualistic model**. However, Rousseau ultimately exceeds Gilbert's framework by introducing an ontological transformation of the agent that neither contemporary theorist accommodates.

  Here is an analysis of where Rousseau stands in this dispute, organized by the specific doctrines that support, oppose, or complicate these attributions.

  ### 1. The Case Against Bratman: The "Will of All" vs. Shared Intention
  Michael Bratman's model of shared intention is functionally isomorphic to what Rousseau explicitly rejects as the **"Will of All" (*volonté de tous*)**.

  *   **Bratman's Model:** Shared agency arises from interlocking individual intentions ("I intend that we J," "You intend that we J"), common knowledge, and meshing sub-plans. Crucially, the commitment remains rooted in individual practical rationality. If my intention changes, the shared intention (for me) dissolves.
  *   **Rousseau's Rejection:** In *The Social Contract* (II.3), Rousseau distinguishes the General Will from the Will of All. The Will of All is merely the sum of private interests ("what is advantageous to each"). It is an aggregate, not a unity.
  *   **The Conflict:** Bratman explains how private wills can coordinate (mesh), but he does not explain how they become *one*. For Rousseau, a political community based on Bratmanian principles would be a mere alliance of convenience, liable to dissolve whenever individual sub-plans diverge. Rousseau argues that for a state to exist, there must be a "moral and collective body" with a life and will of its own.
  *   **Unilateral Withdrawal:** The strongest evidence against a Bratmanian reading is Rousseau's stance on withdrawal. In Bratman's view, if I no longer intend to paint the house with you, our shared intention lapses. In Rousseau's view, a citizen who prioritizes their private will over the General Will is in a state of moral contradiction. They can be "forced to be free" (I.7). This coercive element implies an obligation that cannot be unilaterally rescinded by a change of heart, directly contradicting Bratman's condition that shared intention is sustained only as long as the individual intentions are sustained.

  **Verdict:** Rousseau views the Bratmanian structure as descriptive of pre-political association or factionalism, but insufficient for the constitution of a Sovereign.

  ### 2. The Case For Gilbert: Joint Commitment and the Plural Subject
  Rousseau's account of the Social Contract anticipates the core features of Gilbert's **Joint Commitment** and **Plural Subject** theory.

  *   **Irreducibility:** Gilbert argues that a joint commitment is not a sum of personal commitments; it creates a new normative entity (the plural subject). Rousseau mirrors this in *Social Contract* I.6, describing the act of association as producing a "moral and collective body" composed of as many members as the assembly has voices. This body has a "common self" (*moi commun*). This is not metaphorical for Rousseau; it is the condition of political legitimacy.
  *   **Obligation and Rescission:** Gilbert's hallmark is that joint commitment creates obligations that are not reducible to moral or rational duties independent of the group. One cannot unilaterally withdraw; rescission requires the concurrence of all parties. Rousseau's concept of **Total Alienation** (I.6) matches this. By giving oneself to all, one gives oneself to no one individually, but to the whole. Because the commitment is to the collective body (of which one is a part), one cannot opt out without destroying the condition of one's own freedom. The obligation is internal to the structure of the commitment, just as Gilbert argues.
  *   **Mutual Responsiveness vs. Joint Will:** Bratman relies on mutual responsiveness to keep sub-plans meshing. Gilbert relies on the joint commitment to ground the expectation of responsiveness. Rousseau relies on the General Will. When a citizen votes, they are not asked "Do you like this?" (private will) but "Is this in conformity with the General Will?" (collective stance). This requires the citizen to adopt the perspective of the plural subject, akin to Gilbert's requirement that parties open themselves to the joint commitment.

  **Verdict:** Rousseau is a proto-Gilbertian. He recognizes that genuine collective agency requires a normative bond that transcends the aggregate of individual psychological states.

  ### 3. The Rousseauian Excess: Where He Resists Both Camps
  While Rousseau sides with Gilbert on irreducibility and obligation, his project is metaphysical and transformative in ways that resist assimilation into contemporary analytic social ontology.

  **A. Ontological Transformation vs. Normative Status**
  Gilbert and Bratman generally take the agents as given. They ask: "How do these existing agents coordinate?"
  Rousseau asks: "How do these agents become capable of coordination?"
  For Rousseau, the Social Contract does not just create a normative bond; it effects an **ontological transformation** of the participant. In passing from the state of nature to the civil state, man undergoes a "remarkable change": instinct is replaced by justice, and physical impulse is replaced by duty (I.8).
  *   *Resistance:* Neither Bratman nor Gilbert claims that entering a shared intention changes the *nature* of the individual's psychology from natural to moral. Rousseau argues that the "collective intentionality" is not just a mode of interaction, but a mode of *being*. The "common self" is not just a plural subject; it is a new moral agent that supplants the natural self in the political sphere.

  **B. Infallibility and Teleology**
  Gilbert's joint commitment is content-neutral; a group can be jointly committed to anything (even a crime). Bratman's shared intention is similarly neutral regarding the moral worth of the goal.
  Rousseau's General Will, however, is **inherently teleological**. "The General Will is always right" (II.3). It aims necessarily at the common good.
  *   *Resistance:* This introduces a metaphysical claim about the *object* of the collective intention that analytic theories avoid. For Rousseau, if the collective wills something harmful to the community, it is not a "mistaken General Will"; it is no longer the General Will at all (it has degenerated into a Will of All or a factional will). This makes Rousseau's collective intentionality normative in a realist sense, not just a conventional sense like Gilbert's.

  **C. The Problem of Formation (The Lawgiver)**
  Both Bratman and Gilbert treat the capacity for shared intention/joint commitment as a basic feature of human rationality or sociality.
  Rousseau is skeptical. He argues that for the blind multitude to will the good, they require a **Lawgiver** (*Legislateur*) (II.7). The capacity for this specific type of high-fidelity collective intentionality is not natural; it must be cultivated through *moeurs* (customs) and civil religion.
  *   *Resistance:* This suggests that the "joint commitment" required for political sovereignty is not a default human capacity (as Gilbert might suggest) but a fragile historical achievement that requires external engineering. This adds a sociological/historical dimension to the prehistory of collective intentionality that the ahistorical analytic models lack.

  ### Conclusion for Your Chapter
  You can argue that Rousseau provides the **metaphysical grounding** for the **normative intuition** that drives Gilbert's theory.

  *   **Gilbert** says: "We need joint commitment to explain the obligation."
  *   **Rousseau** says: "We need a moral and collective body to explain the obligation."

  Rousseau supports Gilbert against Bratman on the crucial points of **irreducibility** (General Will $\neq$ Will of All) and **non-unilateral rescission** (forced to be free). However, Rousseau challenges both by suggesting that collective intentionality of this magnitude is not merely a structure of rationality or commitment, but a **constitutive act of human self-creation**.

  For your dissertation, this allows you to position Rousseau not just as a precursor to Gilbert, but as a critic of the *limits* of the analytic tradition: he suggests that without an account of how agents are transformed by the collective stance (the passage from *homme* to *citoyen*), the "obligations" of joint action remain philosophically thin.
