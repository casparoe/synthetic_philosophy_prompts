answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Bride]'s Maid of Honor and best friend.

  Now, I need to address the elephant in the room. Or rather, the metaphysics in the room. I know that about a third of you are here from the Philosophy Department. I see you nodding. You know who you are. And you know that [Groom] wrote his entire dissertation on *perdurantism*.

  For the rest of you: [Groom] believes that people aren't just wholly present in the moment. He believes we are four-dimensional "spacetime worms." Basically, the [Groom] standing here today isn't strictly the same object as the [Groom] who will be sitting in his armchair at ninety years old. They are different *temporal parts* of the same long worm.

  Now, full disclosure: I am an endurantist. I believe the person I love is wholly present, right now, all of them, in every moment. So, philosophically, we have a disagreement. But tonight, for [Bride] and [Groom], I am willing to suspend my disbelief.

  Because when I look at [Bride], I realize she has solved a problem that has puzzled philosophers for centuries. She isn't just marrying the temporal slice of [Groom] standing here in this tuxedo. She is committing to the entire worm.

  She is marrying the toddler who scraped his knees, the teenager who wrote bad poetry, the graduate student who argued about mereology until 3 AM, and yes, even the ninety-year-old temporal part who will inevitably complain that the music is too loud and the soup is too cold.

  And this actually gives a fascinating new spin on the vows. "Till death do us part."

  For an endurantist like me, that means we stay together until time stops. But for [Groom], death is just the final boundary of the worm. The parting *is* the end of the object. In a way, on his view, the whole shape of the marriage already exists. The love she's promising him today isn't just for the present moment; it's a promise that extends across every single temporal part of his life. She loved the past slices when she met him, she loves the current slice right now, and she is already committing to love the future slices that haven't even happened yet.

  So, [Groom], even though you believe you are a collection of different parts strung together across time, I want you to know one thing: [Bride] loves every single one of them. She loves the sum total.

  And to the philosophers in the back: Don't worry. I promise not to ask them to define "numerical identity" during the bouquet toss.

  [Bride] and [Groom], may your lives be long, may your temporal parts be happy, and may your love be the one thing that remains wholly present at every single moment of your existence.

  To the happy couple!
