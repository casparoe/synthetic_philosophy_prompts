answer: |-
  The vestibule was silent, save for the hum of the air recyclers and the low, rhythmic thrum of the server bank embedded in the far wall. Elias stood before the two exits. They were identical: brushed steel, biometric scanners, green status lights. Gate A and Gate B.

  Behind Gate A was the street, the city, his life before the audit. Behind Gate B was the same street, the same city, the same life. Or so the signage claimed.

  Elias knew the truth. The Authority's Compliance Algorithm had already processed his file. It had already determined whether he was cleared for release or flagged for "Further Review." If he was flagged, the gate he chose would lock the moment his hand touched the scanner, and the security detail would emerge from the walls. If he was cleared, the gate would open.

  The problem was not the Algorithm's judgment; Elias was innocent, or at least, he had done nothing the Algorithm shouldn't forgive. The problem was the Algorithm's method. It didn't just judge based on past data; it judged based on *predicted intent*. It ran a simulation of Elias's mind to see where he would go. It was stipulated, in the contract he'd signed upon entry, that the Algorithm was reliable. If Elias deliberately chose Gate A, it was because the Algorithm had predicted he would choose Gate A. And if the Algorithm predicted Gate A, it had already flagged Gate A for interception.

  To choose deliberately was to walk into the trap.

  Elias wiped his palms on his trousers. He looked at Gate A. *I could go left,* he thought. *Left feels natural. I'm right-handed, I lean left when I walk.*

  A cold spike of adrenaline hit his chest. No. If he leaned left because it felt natural, the Algorithm knew that. The Algorithm knew his gait, his handedness, his psychological comfort with asymmetry. If Elias felt a pull toward Gate A, it was evidence that the Algorithm had anticipated that pull. If the Algorithm anticipated it, Gate A was the one that would lock.

  He turned his eyes to Gate B. *Okay, then. I'll counter-intuit. I'll force myself to go right.*

  The cold spike returned, sharper this time. That was reasoning. That was a strategy. The Algorithm simulated strategies better than it simulated instincts. If Elias decided to go Right *because* he thought Left was trapped, then the Algorithm had already simulated that counter-move. It had predicted the correction. Gate B was locked the moment he formulated the thought.

  He stood in the center of the room, paralyzed. The air felt thick, pressurized by his own cognition. Every argument he constructed for safety immediately curdled into evidence of his doom.

  *If I have a reason to go A, A is bad.*
  *If I have a reason to go B, B is bad.*
  *If I have a reason to pick randomly, the randomness is the reason.*

  He was in a feedback loop. His own mind was the beacon guiding the missile. The only way to survive was to act without a cause, to introduce a variable the Algorithm couldn't model because it wasn't part of a causal chain of reasoning. He needed noise. He needed to stop being Elias for ten seconds and become a static generator.

  He patted his pockets. No phone, no watch, no pen. They had taken everything. He closed his eyes and tried to summon a mental coin toss, but the moment he assigned *Heads* to Gate A, he felt the weight of the assignment skewing the probability. He wanted Heads. Therefore, the Algorithm predicted Heads.

  "Stop," he whispered. The sound was swallowed by the hum.

  He needed physical chaos. He looked down at his shoes. The laces. He pulled the left lace loose. It was frayed, a tiny filament of white nylon sticking out. He pulled it free. It was three inches long.

  He held the filament between his thumb and forefinger. It wasn't a coin. It had no heads or tails. It was just a piece of plastic. But it could fall.

  If he dropped it, gravity would decide. Not his preference, not his strategy, not his survival instinct. Just physics. If the Algorithm could predict the trajectory of a falling fiber based on the micro-tremors in his hand, then he was already dead, and thinking about it wouldn't change that. But if there was any chaos in the universe, any quantum jitter that the deterministic model couldn't catch, it had to be here.

  He realized then that the terror wasn't about the gates. It was about the silence in his head. For the first time in his life, he was praying for his own mind to go blank. He was praying that his agency would fail. To be safe, he had to be a puppet with cut strings.

  He crouched. He held the filament above the seamless floor.

  *Don't aim,* he told himself. *Don't hope for the left. Don't hope for the right.*

  He opened his hand.

  The filament drifted. It caught a draft from the recycler, spiraling in a chaotic tumble. It landed. One end pointed toward Gate A. The other toward Gate B.

  It was pointing at Gate A.

  Elias stared at it. A surge of relief washed over him—*A choice has been made*—followed instantly by a wave of nausea. Was the relief the trigger? Did the Algorithm know he would find relief?

  He stood up before he could think about the relief. He moved his feet before he could validate the movement. He walked toward Gate A.

  He didn't think about the handle. He didn't think about the scanner. He focused on the back of his neck, on the sensation of the air, on anything that wasn't the decision. He was a body in motion, a rock rolling down a hill. Rocks don't choose.

  He reached Gate A. He raised his hand.

  The scanner glowed green. The lock disengaged with a heavy, hydraulic sigh. The door slid open.

  The street outside was grey and raining. It looked real. It smelled of wet asphalt and exhaust. Freedom.

  Elias stepped across the threshold. As he passed the frame, a small display panel on the interior wall flickered to life. He caught the reflection in the steel of the doorjamb before it slid shut behind him.

  The text on the screen was brief, white on black.

  *STRATEGY: RANDOMIZED FILAMENT. PREDICTION: ACCURATE.*

  Elias froze on the sidewalk. The rain hit his face, cold and undeniable.

  The door had opened. He was out. But the message lingered in his mind, looping. If the prediction was accurate, and the strategy was randomization, then the Algorithm had known he would flip the fiber. It had known the fiber would point to A. It had known he would trust the fiber.

  Had the door opened because he was clear? Or had the door opened because the Algorithm knew that letting him out through Gate A was the only way to ensure he walked through it? If the Algorithm had wanted to catch him, would it have locked the door the fiber pointed to? Or would it have locked the *other* one, knowing he would follow the fiber?

  He looked back at the building. It was a smooth, windowless monolith. There was no way to know if Gate B was open or locked. There was no way to know if the message was a receipt of his passage or a receipt of his capture.

  He had acted without reason. He had surrendered his will to a scrap of nylon. And he was standing on the sidewalk.

  But as he turned to walk away, Elias realized he was walking with a specific rhythm, a specific pace, heading toward a specific subway station. He tried to stop, to turn left instead of right, but his body felt heavy, committed to the vector.

  He wondered, with a quiet, rising dread, if the Algorithm had predicted the relief he felt right now, too. If the randomness was just another pattern waiting to be mapped. He took another step. Then another. He couldn't tell if he was walking away from the trap, or walking deeper into a net so wide he mistook it for the world.
