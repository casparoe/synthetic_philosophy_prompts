answer: |-
  **Setting:** *A dimly lit faculty lounge, late evening. Two coffee mugs sit on the table, one cold, one steaming. **Michael** (leaning back, hands clasped behind his head) and **Margaret** (sitting forward, pen tapping rhythmically on a notepad) have been at this for an hour.*

  **Margaret:** Let's go back to the text message. That's the crux of it. The guitarist writes, "I'm out." He treats the band arrangement as if it were a reservation at a restaurant he can cancel without penalty. But it wasn't a reservation. It was a joint commitment.

  **Michael:** It was an interlocking web of individual intentions. I intend that we play the gig. You intend that we play the gig. We know this. It's common knowledge. Our sub-plans mesh. That's the shared intention. But at no point does a metaphysical cloud descend upon the trio and create a new entity called "The Band" that holds rights over the individuals.

  **Margaret:** You're reducing the social to the psychological. When they rehearsed every week, when they told people to come, they weren't just aligning their private mental states. They were creating a *plural subject*. They became a "we." And once you form a "we" via joint commitment, you cannot unilaterally rescind it. That's the definition. If I commit *with* you to walk together, I can't just stop short without your say-so. It's not about what's in my head; it's about what I owe *you*.

  **Michael:** I agree he owes them an explanation. I agree it's a lousy move. But does he *wrong* them in the sense of violating a group obligation? Or does he simply frustrate their individual plans after inviting reliance? There's a difference. If I promise to meet you for lunch and bail, I've disrupted your planning agency. I've been unreliable. But I haven't violated a contract of the soul. The guitarist said, "Nobody signed anything." Technically, he's right.

  **Margaret:** That's exactly why that line is so insidious! It assumes obligations only arise from legal contracts or explicit promises. But social life is built on implicit joint commitments. By participating in the band, by taking the gig, he entered a pool of mutual obligations. When he bailed for a "better" gig, he treated his bandmates as mere means to his own ends, rather than co-authors of a joint action. He lacked the *standing* to quit via text. He needed their concurrence.

  **Michael:** Standing. That's your favorite word. You say the bass player has standing to rebuke him because they are co-owners of this commitment. I say the bass player has standing to rebuke him because the guitarist violated the norms of *communication* necessary for shared agency to function at all.

  **Margaret:** How is that not just a softer version of my point?

  **Michael:** Because the source of the norm is different. For you, the obligation pops into existence the moment the joint commitment is formed. It's a *sui generis* bond. For me, the obligation comes from the fact that human beings are planning creatures. We need stability. When the guitarist said, "I'm in," he invited the others to structure their lives around that intention. To withdraw without negotiation isn't just "changing a mind." It's an attack on the *trust* required for future planning.

  **Margaret:** But does that capture the anger? The user told me they felt *wronged*. Not just inconvenienced. "Inconvenienced" is if the van breaks down. "Wronged" is if the driver decides not to show up because he found a nicer car. Your view makes it sound like a pragmatic failure. My view makes it a moral failure.

  **Michael:** I'm not saying it's merely pragmatic. But I don't need a "plural subject" to explain the moral failure. Think about the feeling: "You can't just do that to us." Why does that feel so strong? Because the bass player had integrated the guitarist's intention into his *own* planning architecture. He bought the tickets, he promoted the show. The guitarist didn't just change his own mind; he destabilized the bass player's agency. The anger is the emotional recognition that the conditions for cooperation have been poisoned.

  **Margaret:** That's close, Michael, but you're still describing the *effects* of the wrong, not the *nature* of the wrong. You're saying, "You broke my plans." I'm saying, "You broke *our* bond." The difference is crucial for the remedy. On your view, what does the bass player want? An apology for the hassle? On my view, the bass player is demanding recognition that the commitment still stands until *we* dissolve it.

  **Michael:** But the commitment *can't* stand if one person leaves. You can't play a three-piece gig with two people.

  **Margaret:** Precisely! That's why he needs their permission to leave. He needs them to release him from the commitment. By texting, he acted as if he were a sovereign state seceding from a union without a vote.

  **Michael:** Okay, let's press on the "no contract" claim. He said, "I never promised you a contract." If I'm advising the bass player, do I tell him, "He's right, no contract, but he's being irrational"? Or do I tell him, "He's wrong, there was a contract of a sort"?

  **Margaret:** You tell him there was a joint commitment. It functions like a contract without the paper. The guitarist is confusing *legal* obligation with *social* obligation.

  **Michael:** I'd tell him: "There was no contract, but there was a *normative expectation* generated by your interlocking intentions." Here's the hard question for you, Peggy: If the guitarist had a family emergency, would he still need their concurrence to bail?

  **Margaret:** ...Good question. In a strict sense, yes. But joint commitments usually have implicit clauses regarding reasonable impediments. However, "a better gig" is not a reasonable impediment. It's a preference.

  **Michael:** See, I don't need the implicit clause. I just need the weight of the reliance. If your house is on fire, the norm of reliability is overridden by the norm of self-preservation. If a better gig comes along, the norm of reliability stands. The "wrong" is the disproportionate weighting of his desire over their reliance.

  **Margaret:** But *whose* desire? That's the point. On your view, it's *his* desire versus *their* reliance. Two separate scales. On my view, it's *our* goal versus *his* individual desire. The "we" outweighs the "I." That is why the bass player feels justified in being furious. He isn't just a victim of bad planning; he's a partner in a venture that was hijacked.

  **Michael:** I worry that your "we" is a mystical addition. But... I will concede this. The *feeling* the bass player describes—the sense that the guitarist did something *to them specifically*—is best explained by the depth of the interlocking. It wasn't just "I intend to play." It was "I intend that *we* play." When the guitarist bailed, he didn't just change his own intention; he rendered the bass player's intention *incoherent*. You can't intend that "we play" if you know the other guy isn't playing.

  **Margaret:** Exactly. He made their intention impossible to fulfill.

  **Michael:** But I still maintain he didn't violate a *group* obligation. He violated an *interpersonal* obligation derived from his own prior expression of intent. He led them to believe his intention was stable. It wasn't. He was, in a sense, dishonest about the stability of his own planning state.

  **Margaret:** You're twisting yourself into knots to avoid saying "obligation."

  **Michael:** I'm twisting myself to avoid saying "plural subject." But look, let's try to settle this for the bass player. Does it matter *why* he was wronged?

  **Margaret:** It matters for how they move on. If it's just a pragmatic failure (your view), they find a new guitarist and note that this guy is unreliable. If it's a moral violation of a joint commitment (my view), they are justified in feeling betrayed and perhaps expressing that betrayal strongly. They have the right to demand an account, not just an explanation.

  **Michael:** I can agree to that. Even on my view, the bass player has the right to demand an account. Why? Because the guitarist's action threatens the very possibility of future shared agency between them. If you can bail via text, we can't plan. So the "rebuke" is a social sanction to enforce the norms of planning.

  **Margaret:** So, we agree on the verdict: The guitarist was wrong. He shouldn't have bailed via text for a preference. He owed them a conversation.

  **Michael:** Agreed. He failed to respect the normative expectations generated by their interlocking intentions.

  **Margaret:** And he failed to honor the joint commitment that made them a band in the first place.

  **Michael:** Here is where I want to land, though. You say the obligation exists because of the joint commitment. I say the "joint commitment" is just a label we put on a specific, high-stakes configuration of individual intentions and mutual reliance. The reason it *feels* like a betrayal—the reason "you can't just do that to us" rings so true—is because we are social planners. We build our lives on the predictability of others. When someone removes that predictability for a trivial gain, they aren't just breaking a rule; they're undermining the infrastructure of our cooperation.

  **Margaret:** I can accept that description of the *phenomenology*. The experience is the same. The ontology is where we differ. But for the bass player?

  **Michael:** For the bass player, the ontology doesn't matter. The anger is valid either way.

  **Margaret:** Then we have a settlement. The guitarist cannot defend himself by saying "no contract." Whether you call it a joint commitment or a web of interlocking intentions with high normative stakes, he entered a relationship that required concurrence to exit. He treated a partnership as a solo act.

  **Michael:** And that's something you just don't do. Not because a contract says so, but because if everyone did that, no one would ever form a band.

  **Margaret:** *Raises her coffee mug.* To the norms of shared agency.

  **Michael:** *Clinks his mug.* And the stability of planning.

  **Margaret:** Tell the bass player he was wronged. But tell him not to waste energy on the guitarist. Find a new planner.

  **Michael:** Or a new partner. Just make sure your intentions interlock next time.

  **Margaret:** And make sure they know they're locked in.
