answer: |-
  The sensor on the basalt pillar of Te Motu's highest peak transmitted its last ping at 04:13 UTC. It was a simple message: *SUBMERGED*.

  In the glass-walled conference center in The Hague, Elias Thorne saw the notification flash on his tablet. He didn't look up. He was busy cross-referencing the tidal gauge data from 1994, the year the UN Convention on the Law of the Sea was adopted, with the current bathymetric scans. He was looking for the exact millimeter of water depth that constituted the transition from "rock" to "reef."

  Across the table, Mara Kovic was watching the live feed of the Pacific. On her screen, the blue of the ocean had swallowed the grey of the stone. There was no longer any land above the high-tide line for the Republic of Te Motu.

  "The window closes in an hour," Mara said. Her voice was calm, the tone of someone adjusting a thermostat. "The Emergency Session on Legal Personality begins at 06:00. We need a draft resolution."

  "We need a finding of fact," Elias corrected, not looking up from his spreadsheets. He highlighted a cell in red. "Article 121, Paragraph 3. Rocks which cannot sustain human habitation or economic life of their own shall have no exclusive economic zone. The question is not whether the rock is underwater. The question is when it ceased to sustain habitation. I've found the census anomaly."

  Mara sighed, closing her laptop. "Elias, the people were evacuated three years ago. The habitation ceased then. The land is just geology now."

  "The state is not the people. The state is the legal entity anchored to the territory," Elias said. He finally looked at her. His eyes were tired, rimmed with the red of too many late nights in the archives. "There is a boundary, Mara. A sharp one. Somewhere between the evacuation and this sensor ping, the legal personality of Te Motu died. If we can pinpoint the moment of death, we know who owns the fishing rights. If it died before the new treaties, the rights revert to the high seas. If it died after, they belong to the government-in-exile. It's a binary switch. We just can't see the toggle."

  Mara stood up and walked to the window. The rain blurred the Dutch skyline. "There is no switch. There is a dimmer. And right now, we are in the fade-out. You're treating 'statehood' like it's a physical constant, like the speed of light. It's not. It's a language game. It's true if it works under all reasonable interpretations of the rules."

  "It's not a game," Elias snapped. "There are forty thousand citizens waiting for passports. They need to know if they are stateless persons or citizens of a drowned nation. That is a fact of the world, not a linguistic preference."

  "If we vote to recognize them," Mara said, turning back to him, "then they are citizens. The act of recognition creates the fact. You're digging for a bone in a graveyard that we have the power to keep alive."

  "That's magic," Elias said. "You want to stipulate reality."

  "I want to prevent a humanitarian crisis," Mara countered. "You want to satisfy an ontological curiosity."

  They had been circling this drain for six months. Elias, the Tribunal's Senior Archivist, believed in the Epistemic view. He was convinced that the concept of "statehood" had a precise extension in the world, a jagged line drawn in the sand of reality, and that human ignorance was the only reason it appeared blurry. He spent his days in the bedrock of data, convinced that if he could just find the right treaty clause, the right hydrographic survey, he could locate the exact coordinate where Te Motu ceased to be.

  Mara, the Chair of the Drafting Committee, was a Supervaluationist in practice if not in name. She believed that in the borderline cases—the penumbra of the concept—there was no truth to be found. There were only better or worse ways of making the concept precise. Her job was not to discover the status of Te Motu, but to construct a framework where the status became determinate through consensus.

  "The sensor is dark, Elias," Mara said softly. "The land is gone."

  "The EEZ is defined by the baseline," Elias muttered, typing furiously. "If the baseline was fixed in 1994, the submersion doesn't matter. But only if the state existed continuously. If there was a gap... even a second..."

  "There is no gap."

  "There is a gap if the criteria weren't met!" Elias slammed his hand on the table. "Population, Territory, Government, Capacity. Territory is zero. When did it hit zero? Was it when the houses flooded? When the soil became saline? When the last tree died? I'm close, Mara. I found a municipal record from five years ago. They issued a building permit for a seawall that was never built. That implies they believed they had territory to build on. But the environmental impact study from the same week says the land was uninhabitable. Which document is the truth?"

  "Both," Mara said. "And neither. That's the point. In the borderline zone, 'Te Motu exists' is neither true nor false. It's indeterminate. Our job today is to make it true."

  The alarm on the wall chimed. 05:30. Thirty minutes to the session.

  The stakes were not abstract. The fishing fleets were already gathering on the edge of the old Te Motu zone. Chinese, American, and local vessels were circling like sharks. If Te Motu was a state, it owned the fish. If it was a shoal, it was international water. If it was a state that had ceased to exist, the rights might have devolved to the nearest neighbor, Kiribati or Tuvalu. Forty thousand people, scattered in Auckland, Suva, and Wellington, needed the status to claim climate refugee benefits that were only available to nationals of extant states.

  Elias stood up. He had a folder in his hand. "I'm submitting an Amicus Brief on the Threshold of Extinction."

  Mara blocked his path. "You can't. It's not procedural."

  "It's evidence. I've calculated the threshold. Based on the minimum viable land mass required for a permanent population in the 1933 Montevideo Convention, adjusted for the 2015 precedent on artificial islands... Te Motu ceased to be a state on November 14th, 2029, at 09:00 local time. That was when the freshwater lens collapsed. I have the hydrology reports."

  "And what happens if you submit that?" Mara asked.

  "Then the Tribunal rules based on fact. We acknowledge the death. We process the refugees as stateless. We auction the fishing rights to fund their resettlement."

  "And if you're wrong?"

  "I'm not wrong. The fact exists. I just found it."

  Mara looked at him with a mixture of pity and frustration. "Elias, if you submit that, you force a binary vote on a spectrum. You force the delegates to choose between 'Alive' and 'Dead' when the reality is 'Dissolving.' If they vote 'Dead' because of your hydrology report, you strip forty thousand people of their nationality based on a technicality about freshwater lenses. You're prioritizing the consistency of the concept over the welfare of the people."

  "I'm prioritizing the truth," Elias said. "If we lie and say they are a state when they have no land, we undermine the entire system of international law. We turn borders into fiction."

  "Borders *are* fictions!" Mara's composure cracked. "They are lines we agree to pretend are real. Te Motu is real because its people believe they are Te Motu. Because they have a government in a office block in Auckland that issues taxes and holds elections. You want to tell them that because their dirt is underwater, their community is a hallucination?"

  "I want to tell them that the world has rules," Elias said. "And we have to find where the line is."

  "There is no line!"

  "Then draw one," Elias challenged. "Don't pretend it was always there."

  Mara stared at him. For a moment, the hum of the air conditioning was the only sound. She looked at the clock. 05:45.

  "You think I'm making it up," Mara said.

  "I think you're avoiding the hard work of measurement."

  "I'm doing the hard work of governance," she replied. She walked back to her terminal. "I'm not going to stop you, Elias. Submit your brief. Submit your hydrology. Submit your exact date of death."

  She opened her own document. The Draft Resolution on Continuity of Legal Personality in the Face of Physical Loss.

  "And I," Mara said, her fingers hovering over the keys, "am going to submit a resolution that redefines 'Territory' to include 'Maritime Zone and Cultural Heritage Sites.' I am going to precisify the concept so that Te Motu survives."

  "That's cheating," Elias said.

  "It's legislation," Mara corrected. "You're looking for a fact in the past. I'm creating a fact for the future."

  05:55.

  Elias uploaded his file. It was a dense, fifty-page argument pinpointing the moment the freshwater lens failed. It was a death certificate. He felt a strange sense of relief. The uncertainty was gone. He had found the grain of sand that broke the camel's back. It was ugly, but it was true.

  Mara uploaded her resolution. It was a bold rewriting of the Montevideo criteria, decoupling statehood from dry land. It was a birth certificate for a new kind of nation. She felt a strange sense of weight. She was not finding the truth; she was shouldering the responsibility of it.

  They walked into the chamber together. The delegates were seated. The screens at the front displayed the live feed of the submerged peak of Te Motu. Just grey water, churning.

  Elias took his seat in the observer's gallery. He watched the main screen, waiting for the data to be acknowledged. He expected the President of the Tribunal to reference the hydrology report. To acknowledge the threshold had been crossed.

  Mara took her seat at the dais. She watched the delegates. She saw the uncertainty in their eyes. They wanted to do the right thing, but they were afraid of the precedent.

  The President gavelled the session to order. "We are here to determine the status of the Republic of Te Motu."

  Elias leaned forward. *Say it,* he thought. *It's gone.*

  Mara straightened her papers. *Make it stay,* she thought. *Make it matter.*

  The President looked at the docket. "The Tribunal has received two submissions. One regarding the physical thresholds of habitability. One regarding the redefinition of territorial continuity."

  The room held its breath. This was the Sorites paradox rendered in diplomatic protocol. At what point does a nation vanish? When the land is gone? Or when the recognition is withdrawn?

  "The Tribunal," the President began, "acknowledges the complexity of the situation."

  Elias gripped the railing. *Complexity is ignorance.*

  Mara folded her hands. *Complexity is the space where we choose.*

  "We will not rule on the physical status of the land," the President said.

  Elias slumped. The fact didn't matter.

  "We will, however," the President continued, "vote on Resolution 44-B, submitted by the Drafting Committee."

  Mara exhaled.

  "This resolution stipulates that for the purposes of international law, the Republic of Te Motu retains its legal personality and maritime boundaries regardless of submersion, contingent upon the maintenance of a functioning government-in-exile."

  The vote was called. It was close. But the pressure of the humanitarian crisis, the lobbying of the Pacific bloc, and the sheer utility of Mara's solution carried it. The resolution passed.

  Te Motu remained a state.

  Elias sat in the silence of the gallery. He had found the fact. He knew the exact moment the freshwater turned to salt. He knew the exact day the soil became too toxic for taro. He knew the precise coordinate where the land ended. And none of it mattered. The world had chosen to ignore the fact in favor of the stipulation. He felt a profound loneliness, the isolation of a man who sees a ghost that everyone else has agreed to call a living person. He had wanted the comfort of a sharp boundary, even if it was a grave. Instead, he got a limbo.

  Mara walked out of the chamber into the hallway. She was met by the Ambassador of Te Motu, a woman who had lost her home but kept her title. The Ambassador hugged her, weeping. "We exist," the Ambassador whispered. "We still exist."

  Mara hugged her back, but she felt the hollowness of the victory. She knew there was no fact that made this true. She had simply forced the world to agree to pretend. She had smoothed over the vagueness with a layer of legal varnish. If the government-in-exile fractured, if the funding dried up, the "fact" she created would vanish instantly. It was fragile. It was a truth without a foundation.

  They passed each other in the corridor outside the restrooms. Elias held his printed hydrology report; Mara held her signed resolution.

  "You happy?" Elias asked. His voice was flat.

  "They get their passports," Mara said. "They get their fishing rights. They keep their dignity."

  "You built a castle on water," Elias said. "And you know it. One day, someone will ask why. And the answer will be 'because we voted.'"

  "And your answer?" Mara stopped. "You have your fact. You have your date of death. Does it help anyone?"

  "It's the truth."

  "It's a number," Mara said. "Truth is what keeps the lights on."

  They stood there for a moment, the two of them, guarding the boundary between what *is* and what *ought to be*. The rain streaked the windows behind them, blurring the world outside into a watercolor of grey and green.

  "Te Motu is dead," Elias said quietly.

  "Te Motu is alive," Mara replied.

  Neither looked at the other. They turned and walked in opposite directions down the long, carpeted hall. Behind them, on the screens in the empty chamber, the live feed of the Pacific continued to loop. The waves rolled over the place where the mountain had been. The water was indifferent. It did not care if it was a sea or a border. It simply rose, grain by grain, hiding the line that neither of them could ever truly find.
