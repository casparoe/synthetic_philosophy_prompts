  2.  **Deconstruct Condorcet's Jury Theorem (CJT):**
      *   *What does it actually say?* If $n$ voters are independent, each has probability $p > 0.5$ of being correct, then the probability the majority is correct approaches 1 as $n \to \infty$.
      *   *Key Assumptions:*
          1.  Binary choice (Guilty/Not Guilty).
          2.  Common interest (everyone wants the "correct" verdict).
          3.  **Independence:** This is the big one. Votes must be statistically independent.
          4.  **Competence:** $p > 0.5$ for *every* juror.
      *   *Limitations:* If $p < 0.5$, larger groups make things *worse*. If votes are correlated (not independent), the "wisdom of crowds" effect diminishes significantly.

  3.  **Address the User's Proposal (Larger Juries + Supermajority):**
      *   *Size:* CJT does suggest larger is better *if* assumptions hold. However, diminishing returns kick in fast. Going from 12 to 50 helps, but not as much as 1 to 12.
      *   *Voting Rule:* CJT focuses on *majority* rule. Supermajorities (90%) actually reduce the probability of reaching a verdict if the group is split, and can incentivize strategic voting.
      *   *Systemic Constraints:* Cost, logistics, holdout jurors.

  4.  **Address the Cousin's Objection (Independence & Deliberation):**
      *   *The User's Counter:* "They still cast individual votes."
      *   *The Reality:* Deliberation creates *correlation*. If Juror A convinces Juror B, their votes are no longer independent. They share the same bias or error.
      *   *Impact on CJT:* Positive correlation reduces the effective sample size. If everyone hears the same lawyer argument and sways together, it's like having 1 voter, not 12.
      *   *Social Pressure:* Conformity bias (Asch experiments). People vote with the group, not their conscience.

  5.  **Address the "Unanimity Increases Wrongful Convictions" Claim:**
      *   *Source:* Likely game-theoretic models (e.g., Feddersen & Pesendorfer).
      *   *Logic:* Under unanimity, a single juror can acquit. However, if jurors vote *strategically* rather than sincerely...
      *   *The "Pivotal Voter" Logic:* If I know my vote only matters if everyone else votes guilty, I might infer they have strong evidence. Even if my private signal says "innocent," I might think "11 other people can't be wrong, I must be missing something," so I vote guilty to avoid a hung jury (if there's pressure) or because I update my belief based on others' votes.
      *   *Wait, the specific claim:* "Unanimity makes wrongful convictions MORE likely."
      *   *Explanation:* In strategic voting models, under unanimity rule, jurors anticipate that if they are pivotal, the evidence against the defendant must be strong (since everyone else is voting guilty). This can lead them to ignore their own private "innocent" signal and vote guilty. This is the "Condorcet Paradox" of strategic voting.
      *   *Contrast with CJT:* CJT assumes *sincere* voting (voting your true belief). Strategic voting breaks CJT.

  6.  **Address the "Justice System vs. Math" Conflict:**
