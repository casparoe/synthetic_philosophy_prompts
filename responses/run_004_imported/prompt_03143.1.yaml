  8.  **Final Polish:** Organize into clear sections: The Diagnosis (Psychology), The Trap (Goodhart's Law), and The Redesign (Actionable Steps). (This matches the structure of the final output).

  **(Self-Correction Note):** Make sure to mention *Incentive Salience*. The rat experiments are specifically about the "wanting" system (dopamine) vs. the "liking" system (opioids). The user *wants* the TV reward, so they hack the system to get it, even if they don't *like* the feeling of cheating. This is a nuanced psych point that fits their course level.

