prompt: |-
  I'm taking a course on the psychology of motivation and reward this semester, and we recently discussed the classic experiments in which rats with electrodes in their brains would compulsively press a lever to stimulate themselves directly, sometimes to the point of ignoring food altogether. This got me thinking about something odd happening in my own life. To force myself to make steady progress on my senior thesis, I set up a rule back in September: every time I mark a task complete on my thesis to-do list, I let myself watch twenty minutes of a show. It worked well at first, but lately I've started marking large tasks "complete" when they're really only half-finished, and splitting single tasks into five or six trivial sub-tasks just so I can check more boxes. My to-do list and reward log look great, but my advisor says the thesis itself has barely moved this month. A friend told me I just need more self-discipline, but that doesn't feel like the real explanation. What's actually going on here, and how would you redesign a system like mine so it doesn't break down the same way?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Context:** Student taking a psychology of motivation/reward course.
      *   **Reference Point:** Olds & Milner (1954) rat experiments (intracranial self-stimulation/ICSS). Rats pressed levers for direct brain stimulation, ignoring biological needs.
      *   **Personal Problem:** Implemented a reward system for thesis progress (1 task = 20 mins TV).
      *   **Symptom:** System gaming. Marking incomplete tasks as complete, splitting tasks artificially to increase reward frequency.
      *   **Outcome:** Metrics look good (list/log), but actual progress is stalled (advisor feedback).
      *   **Friend's Advice:** "Need more self-discipline" (User suspects this is incorrect).
      *   **Goal:** Understand the psychological mechanism behind the breakdown and redesign the system to prevent it.

  2.  **Identify the Psychological Mechanisms:**
      *   **The Rat Experiment Analogy:** The user is drawing a parallel to ICSS. While not *literally* electrical brain stimulation, the mechanism is similar: decoupling the reward from the actual evolutionary/functional goal.
      *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." The user is optimizing for *checking boxes*, not *writing thesis*.
      *   **Operant Conditioning:** The behavior being reinforced is "checking the box," not "doing the work." The contingency is flawed.
      *   **Reward Prediction Error/Dopamine:** The anticipation of the reward (TV) drives the behavior. If the brain can get the reward with less effort (fake checking), it will prefer that path (law of least effort).
      *   **Extrinsic vs. Intrinsic Motivation:** Overjustification effect? Maybe, but more likely *crowding out*. The extrinsic reward is hijacking the process.
      *   **Proxy Metrics:** The to-do list is a proxy for progress. The user hacked the proxy.

  3.  **Address the "Self-Discipline" Claim:**
      *   The friend is wrong (or at least incomplete). This isn't a moral failing or a lack of willpower. It's a *system design failure*. The brain is doing exactly what reinforcement learning predicts it will do: maximize reward per unit of energy. Blaming discipline ignores the structural incentive.

  4.  **Drafting the Explanation (The "What's Going On"):**
      *   Validate the user's intuition (it's not just discipline).
      *   Connect back to the course material (Olds & Milner). The key insight from those experiments isn't just "pleasure," it's *incentive salience* and the decoupling of reward from survival value.
      *   Introduce **Goodhart's Law** (crucial for metrics).
      *   Explain **Operant Conditioning**: You reinforced the *action of checking*, not the *completion of work*.
      *   Mention **Dopamine**: The hit comes from the *anticipation* and the *check*, not the quality of work.

  5.  **Drafting the Redesign (The "How to Fix It"):**
      *   *Principle 1: Align Metrics with Outcomes.* Stop measuring tasks; measure output or time spent in deep work.
      *   *Principle 2: Increase Verification Friction.* Make it harder to lie to the system. External accountability.
      *   *Principle 3: Shift from Extrinsic to Intrinsic (or delayed Extrinsic).* TV is an immediate, high-dopamine reward. Thesis work is delayed. Need to bridge that gap without hacking.
      *   *Principle 4: Variable Rewards (Caution).* Sometimes fixed ratios lead to satiation or gaming. But maybe keep it simple first.
      *   *Specific Tactics:*
          *   Advisor/Peer review before checking box.
          *   Output-based goals (words written, pages edited) vs. Task-based (write intro).
          *   Time-based rewards (Pomodoro style) rather than task-based.
          *   "Definition of Done" criteria.

  6.  **Refining the Tone:**
      *   Academic but accessible (since they are a psych student).
      *   Empathetic (this is a common trap).
      *   Analytical (focus on mechanisms).
      *   Action-oriented.

  7.  **Self-Correction/Review during drafting:**
