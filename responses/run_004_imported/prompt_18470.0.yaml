answer: |-
  This is a fantastic insight for an LD case. You have correctly identified a historical lineage that most high-school (and even many college) debaters miss. Connecting Vitoria to the Walzer/McMahan debate gives you a ton of philosophical depth and historical weight.

  Here is the breakdown of where Vitoria lands, how the drone pilot scenario tests his theory, and how you can weaponize this in your round.

  ### 1. Whose Side is Vitoria On? (The Proto-McMahan Verdict)

  **Short Answer:** Vitoria is definitely a **proto-McMahan**, not a Walzerian.

  **The Reasoning:**
  *   **Walzer (Traditionalist):** Argues for the **Moral Equality of Combatants (MEC)**. He separates *jus ad bellum* (justice of war) from *jus in bello* (justice in fighting). A soldier on the unjust side has the same right to kill as a soldier on the just side, provided they follow the rules of war. The soldier is an "instrument" of the state.
  *   **McMahan (Revisionist):** Rejects MEC. He argues that moral liability stems from the justice of the cause. Unjust combatants generally do *not* have the right to kill just combatants. However, he offers an **epistemic excuse**: if they couldn't reasonably know the war was unjust, they are blameless (though objectively wrong).
  *   **Vitoria (Scholastic):** In *De Jure Belli*, Vitoria argues that for a war to be just, there must be a genuine wrong. Crucially, he distinguishes between the **Prince** (who must be certain the cause is just) and the **Subjects/Soldiers**.
      *   Vitoria explicitly states that if subjects fight in an objectively unjust war but believe it is just due to "invincible ignorance" (they couldn't reasonably know otherwise), they are **excused from sin**.
      *   However, unlike Walzer, Vitoria does **not** say the killing becomes morally neutral. It remains objectively disordered/wrong, but the *soldier* is not culpable.

  **The LD Takeaway:** Vitoria agrees with McMahan that objective justice matters (rejecting Walzer's symmetry), but he agrees with McMahan that we need an "excuse" mechanism for soldiers who are epistemically limited.

  ### 2. The Drone Pilot Stress Test

  This is where your case can get really spicy. You asked if Vitoria's excuse survives the drone pilot scenario.

  **Vitoria's Standard: Invincible Ignorance**
  Vitoria's excuse relies on the idea that the soldier *could not have known better*. In the 16th century, a conscript had no news, no internet, and total reliance on their King and Priest. Their ignorance was often truly "invincible."

  **The Drone Pilot Context:**
  *   **Safety:** Vitoria argued that soldiers put their lives at risk for the state, which creates a duty of obedience. A drone pilot is in Nevada, not in danger. Does removing physical risk increase their moral burden to verify the order?
  *   **Information:** A drone pilot often has high-definition surveillance feeds. They might see non-combatants more clearly than a grunt on the ground.
  *   **The Verdict:** Vitoria would likely argue that the **excuse is harder to claim for a drone pilot.**
      *   If the pilot has access to intel that suggests the war is unjust (or specific strikes are illegal) and ignores it, their ignorance is **vincible** (overcomeable).
      *   Vitoria writes that if the arguments against the war are obvious, the subject *must* examine them. A drone pilot, removed from the "fog of war" and adrenaline, has a higher epistemic duty than a 16th-century pikeman.

  **McMahan Comparison:** McMahan would agree. He argues that in modern democracies, soldiers have a higher duty to inquire than in autocracies. Vitoria's framework actually supports this: as access to truth increases, the "invincible ignorance" excuse shrinks.

  ### 3. How to Use This in Your LD Round

  Here is how you structure this argument for a debate round.

  **A. The Framework (Value/Criterion)**
  *   **Value:** Moral Responsibility (or Justice).
  *   **Criterion:** Epistemic Accountability (What we can know vs. what we do).
  *   **Argument:** We cannot evaluate the morality of combatants based solely on rules of engagement (Walzer); we must evaluate based on the justice of the cause, mitigated by what the soldier could reasonably know (Vitoria/McMahan).

  **B. The "Vitoria Card" (Evidence Strategy)**
  Don't just say "Vitoria said this." Frame it as the **historical foundation of Revisionism.**
  *   *Argument:* "Walzer claims the Moral Equality of Combatants is the traditional view. However, the roots of Just War Theory in Vitoria show that the 'Traditional View' is actually a modern invention. Vitoria establishes that objective justice matters *in bello*. Therefore, the burden is on the Aff (if they are Walzerian) to explain why we abandoned the Vitorian/McMahan link between cause and conduct."

  **C. The Drone Pilot Turn (Offense)**
  If your opponent argues that soldiers are just "tools" and can't be blamed (a common Walzerian argument):
  *   *Response:* "Even Vitoria, writing in 1532, rejected the 'blind tool' argument. He argued that ignorance only excuses if it is invincible. In modern warfare, specifically with drone technology, soldiers have greater access to information and less physical coercion. Therefore, the Vitorian excuse collapses for modern combatants, making them *more* liable than historical soldiers. If Vitoria's standard applies, modern unjust combatants are *less* excusable than their predecessors."

  **D. Cross-Ex Questions to Ask**
  1.  "Do you agree that a soldier who *knows* their war is unjust is morally liable for killing?" (If they say no, they are extreme Walzerians and look bad. If they say yes, they admit MEC isn't absolute).
  2.  "Does a soldier's access to information change their moral responsibility?" (If they say yes, hit them with the Drone Pilot argument).
  3.  "Is 'following orders' a sufficient moral defense if the order is objectively criminal?" (Vitoria and McMahan say no; Walzer is more nuanced but leans toward the state's responsibility).

  ### 4. One Caveat (Watch Out for This)

  Be careful not to conflate **Sin** (Vitoria) with **Rights** (McMahan).
  *   Vitoria is a theologian. He cares about whether the soldier goes to hell.
  *   McMahan is a secular moral philosopher. He cares about whether the soldier violates the enemy's right to life.
  *   **The Fix:** Frame Vitoria's "Sin" as "Moral Wrongness." The core logic is the same: An act can be objectively wrong even if the agent is excused. This distinguishes both of them from Walzer, who says the act is *permissible* for the unjust soldier.

  ### Summary for Your Case
  You are right: Vitoria is a proto-McMahan. He rejects the symmetry of Walzer.
  *   **Use Vitoria** to prove that linking *ad bellum* and *in bello* is the *older, more established* tradition, not some radical new idea.
  *   **Use the Drone Pilot** to show that Vitoria's "excuse" is shrinking in the modern world, making soldiers *more* responsible now than in the past.

  This is a sophisticated line of argumentation that will likely out-depth most opponents on this topic. Good luck!
