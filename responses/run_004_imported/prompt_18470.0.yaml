prompt: |-
  okay so for my next LD (lincoln-douglas) debate round the topic is basically the "moral equality of combatants" thing - like is a soldier fighting on the unjust side of a war just as morally in the clear as a soldier on the just side, as long as both sides stick to the actual rules of fighting. walzer says yeah theyre equal, mcmahan says no, unjust soldiers dont actually have the right to kill just soldiers, but he still lets a lot of them off the hook as "excused" bc they couldnt have reasonably known their war was unjust. digging around for evidence i found out vitoria (the spanish guy who argued about whether conquering the americas was even just) had this idea way earlier that soldiers who had a reasonable but wrong belief their war was just werent doing anything sinful by fighting in it, which sounds definately like mcmahans excuse move to me. if vitoria somehow got dropped into the actual modern walzer vs mcmahan fight, whose side would he land on, and does his excuse idea even survive if you apply it to like a drone pilot whos never in any danger and just does whatever command tells him? kinda trying to figure out if vitoria was secretly a proto-mcmahan or if thats not really a fair comparison
