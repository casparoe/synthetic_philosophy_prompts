          *   How to frame the Vitoria evidence.
          *   Warning: Don't get bogged down in theology; focus on the *epistemic condition* (what they could know).

  6.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Wait, does Vitoria actually say unjust soldiers have no right to kill?* Yes, he says they cannot keep loot, and if they know the cause is unjust, they sin. If they don't know, they don't sin, but the act remains objectively disordered. This aligns with McMahan's "liable vs. excused" distinction.
      *   *Walzer's Counter:* Walzer would say Vitoria is too demanding on soldiers.
      *   *McMahan's Counter:* McMahan would say Vitoria is too *lenient* on the excuse (McMahan wants stricter epistemic responsibility).
      *   *Key Distinction:* Vitoria is concerned with *salvation* (sin). McMahan is concerned with *moral liability* (rights). This is a subtle but important difference for LD (Morality vs. Rights).

