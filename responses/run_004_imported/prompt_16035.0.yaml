answer: |-
  This is a fascinating epistemic puzzle, and you are right to separate it into two distinct problems. Your LessWrong-adjacent friends are correct on the conclusion (psychic powers are vanishingly unlikely) but perhaps unhelpful on the process (dismissing the anomaly without explaining it).

  Here is a principled way to untangle the two levels of your unease, using a framework that respects your friend's credibility without violating the laws of physics.

  ### Level 1: The Credibility of the Testimony
  **Question:** *Should a credible witness update my priors that "something strange happened"?*

  **Answer:** Yes, but not as much as you think.

  You are dealing with **testimonial evidence**, which is distinct from **physical evidence**. Your friend is a high-credibility witness regarding *her internal experience*. You can trust that she *felt* shocked, that she *heard* specific details, and that she *believes* the medium couldn't have known them.

  However, human memory is not a video recorder; it is a reconstruction engine. Even for actuaries. There are three specific cognitive mechanisms that can make a skeptical person swear a reading was "impossibly accurate" even when it wasn't:

  1.  **Selective Memory (The Hit/Miss Ratio):** In a typical reading, a medium throws out dozens of probes. "I'm seeing a health issue... maybe a fall? Or hands?" If the medium says "hands" and the grandpa lost a finger, that is a massive hit. The 20 misses are forgotten; the 1 hit is cemented as proof. Your friend is remembering the *hits*, not the full transcript.
  2.  **Subjective Validation:** When a statement is emotionally resonant (like details about a beloved grandfather), the brain works harder to make it fit. A vague statement like "he had a physical struggle in his youth" gets retrofitted to "the farm accident with the finger" because that is the narrative your friend holds.
  3.  **The "Last Minute" Assumption:** Your friend *believes* it was last-minute. But did she verify the medium's schedule? Did she verify her mother's phone logs? In these scenarios, the "impossible constraint" (no time to research) is almost always the weakest link. It is an assumption, not a verified fact.

  **The Update:** You should update your belief to: *"My friend had a profoundly convincing experience that felt like information transfer."* You should **not** update to: *"Information transfer occurred without a physical mechanism."* The gap between those two statements is where the cognitive bias lives.

  ### Level 2: The Inference to "Psychic Powers"
  **Question:** *Even if the account is accurate, does it imply magic?*

  **Answer:** Absolutely not. This is a classic case of **Underdetermination**. The data (accurate details were spoken) supports multiple hypotheses, not just the supernatural one.

  To move from "She knew things" to "She is psychic," you must eliminate all naturalistic explanations. Your friends shrugged because they couldn't name the mechanism, but in this specific story, there is a glaring variable that makes naturalistic explanations highly probable: **The Mother.**

  Consider the "Hot Reading" vectors that don't require internet research:

  1.  **The Town Vector:** The medium is in the mom's town. The grandfather lived in that town. Small towns operate on gossip networks. A "farm accident costing a finger" is exactly the kind of local trivia that persists in community memory for decades. If the medium is a local fixture, she may know the families.
  2.  **The Mom Vector (Crucial):** The friend went *with her mom*. The mom knew the grandfather.
      *   Did the mom book the appointment? (Even if last minute, she might have called ahead).
      *   Did the mom speak to the medium in the waiting room? ("I'm so nervous, my daughter never knew her grandpa well...")
      *   **Unconscious Signaling:** This is the most likely culprit for specific details. When the medium says, "I see an injury to the hand," the mom might gasp, lean forward, or tear up. The friend sees the mom's reaction and thinks, "Wow, she knew!" The medium sees the mom's reaction and doubles down: "It was a farm accident, wasn't it?"
      *   The friend perceives this as the medium knowing; in reality, the medium and the mom co-constructed the information in real-time.

  **The Bayesian Calculation:**
  *   **Hypothesis A (Psychic):** Requires overturning modern physics, biology, and information theory. Prior probability: $\approx 0$.
  *   **Hypothesis B (Cold/Hot Reading + Memory Bias):** Requires human deception, community gossip, or unconscious signaling. Prior probability: High (we know these things happen constantly).

  Even if you can't pinpoint *exactly* how the medium knew the nickname, $P(\text{Trickery we don't understand})$ is still orders of magnitude higher than $P(\text{Magic})$. This is the **God of the Gaps** fallacy applied to skepticism: "I can't explain how this trick was done, therefore it isn't a trick."

  ### How to Resolve the Nagging Feeling

  You are overthinking it only in the sense that you are looking for a solution that satisfies both "My friend is smart" and "Magic might be real." You need to decouple those.

  **1. Accept the "Unknown Mechanism" State**
  It is perfectly rational to say: *"I believe my friend experienced this, and I don't know exactly how the medium got that specific information. But I know that 'unknown mechanism' is not evidence for 'supernatural mechanism'."*
  Your LessWrong friends failed you here by implying the explanation is *obvious*. It isn't obvious, but it is *necessarily* mundane because the alternative is impossible.

  **2. Investigate the "Mom" Variable**
  If you want to settle this, don't ask the friend. Ask about the logistics.
  *   "Did your mom book the appointment or just show up?"
  *   "Did your mom go into the room alone first?"
  *   "Is the medium well-known in that town?"
  Often, the "last minute" constraint dissolves upon closer inspection.

  **3. Recognize the Value of the Experience**
  Your friend got closure. She felt a connection to her grandfather. Even if it was a trick, the *outcome* was positive. Sometimes, rationalists get so hung up on the *mechanism* that they miss the *function*. The medium provided a service (grief counseling via theater). Acknowledging this might help you stop turning it over as a "problem to be solved."

  ### Summary
  *   **Level 1:** Trust your friend's *feelings*, not her *forensics*. She is a good witness to her own surprise, not to the medium's information sources.
  *   **Level 2:** The presence of the mother and the local town context provides ample surface area for "Hot Reading" (insider info) even without internet research.
  *   **Principle:** The inability to immediately debunk a specific instance of magic does not increase the probability of magic; it only increases the probability of a clever trick you haven't identified yet.

  You can hold space for your friend's meaningful experience without updating your priors on the existence of ghosts.
