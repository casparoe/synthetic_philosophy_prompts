  The dust motes dancing in the shaft of light were the only things moving in the Hall of Whispers. Elias held the final tessera between his thumb and forefinger, a cube of lapis lazuli no larger than a fingernail. It was the pupil of the great eye mosaic sprawling across the floor, the only piece missing from a decade of work.

  Mara sat on the edge of the dais, her back against a pillar. She looked tired. They both were. The evacuation ships had left three days ago. They were the custodians who had stayed behind to lock the doors, the last two consciousnesses in this sector of the galaxy.

  "Put it down, Elias," Mara said. Her voice was dry, stripped of urgency. "The power grid fails at sunset. If you're still bending over when the lights die, you'll break your back for nothing."

  "It's the center," Elias said. He didn't look up. "Without it, the gaze is unfocused. It looks everywhere and nowhere."

  "It looks at nothing," Mara corrected. "We're the last ones. When we walk out of here, the locks engage. No one comes back. The sun goes out in a century. The stone crumbles in a million. To the universe, this floor is already dark."

  Elias finally looked at her. The light from the high clerestory window caught the gray in his beard. "Moore would say it matters."

  "Moore isn't here."

  "He argued that a beautiful world is better than a ugly one, even if no one sees it."

  "He also argued that seeing it is what makes it good," Mara countered, shifting her weight. "Consciousness of beauty. That was the real prize. But consciousness ends with us, Elias. If we finish this, we see it for five minutes. Then we leave. Then it sits in the dark, unperceived, until entropy eats it. Is a five-minute perception worth ten years of labor?"

  Elias turned back to the floor. The mosaic depicted a garden in bloom, rendered in semi-precious stones. It was intricate, vibrant, a testament to a species that loved color. But without the pupil, the central flower stared blankly.

  "If I leave it," Elias said, pressing the blue stone into the mortar, "I spend the rest of my life knowing it was broken. If I finish it, I spend the rest of my life knowing no one else saw it."

  "Same regret, different shape."

  "No." Elias smoothed the mortar. He sat back on his heels. "Not the same."

  He stood up and offered her his hand. Mara looked at the hand, then at the floor, then took it. He pulled her to her feet. They stood side by side at the edge of the dais, looking down.

  The completion was subtle. The eye didn't open; it simply focused. The entire pattern shifted from a collection of stones into a single image. It was undeniably beautiful. It hummed with a quiet order that contradicted the decay of the station around them.

  Elias felt a swell in his chest, a tightness that wasn't pain. He glanced at Mara. She wasn't looking at the floor anymore; she was looking at him, watching him watch the floor.

  "It's nice," she said softly.

  "It's more than nice."

  "Is it?" She stepped closer, their shoulders touching. "If I were standing here alone, would it feel like this?"

  Elias considered. If he were alone, the beauty would be sharp, lonely. It would be a monument to absence. The aesthetic appreciation would be there, but it would be cold. With Mara there, the appreciation was warm. The beauty of the mosaic mingled with the history of their friendship—the shared meals, the arguments over mortar mix, the silent understanding of why they stayed.

  "The whole is greater," Elias said.

  "The sum of the parts?"

  "The unity of them."

  Mara sighed, a sound that was half-laugh. "So we created an organic unity. A true perception of excellence combined with the emotion due to it, amplified by personal affection. We checked the boxes, Elias. We generated the highest good conceivable."

  "And yet you feel nothing?"

  "I feel tired." She squeezed his arm. "I feel that in an hour, we walk out opposite doors. I go to the North Spire, you to the South. The comms die when the power dies. I will never know if you made it to your chair. You will never know if I watched the stars go out."

  "We know this is finished."

  "We know *we* finished it. Once we part, the knowledge dies. Being the last witnesses is functionally the same as being no witnesses. If a thing exists and no mind knows it exists, does it hold value? Or is that just a story we tell ourselves to justify the labor?"

  Elias looked back at the eye. It stared up, perfect and blind. "If we hadn't finished it, the beauty would be incomplete. The value would be less."

  "Or the value was never in the stone," Mara said. "It was in the doing. Together."

  She stepped away from the dais. The dust settled around her boots. "If I look at it alone, it's just rock. If you look at it alone, it's just rock. But us looking at it... that was the art. The mosaic is just the excuse."

  Elias nodded slowly. The realization settled over him like the dust. The intrinsic value of the unperceived beauty was a theoretical comfort, a promise that the universe wasn't entirely hostile. But the actual good, the tangible weight of it, had existed only in the moments their consciousnesses overlapped upon the design. The organic unity wasn't the mosaic. It was the moment of shared recognition.

  "The power is flickering," Mara said. The light shaft dimmed, then surged.

  "Will you remember it?" Elias asked.

  "I'll remember you looking at it."

  "Is that enough?"

  "It's all we get to keep."

  The lights buzzed, a dying insect sound. The shadows lengthened, creeping toward the dais. Soon, the hall would be pitch black. The mosaic would remain, perfect and unperceived, a beautiful thing in a dead world. According to the old ethics, it would still be better than a pile of slag. But that value was abstract, distant, cold.

  The warmth was here, in the space between them.

  "Go," Elias said. "Before the locks seal."

  Mara walked to the great door. She paused with her hand on the wheel. She didn't look back at the floor. She looked at him. In that look was the affection, the shared history, the acknowledgment of the task completed. It was a final perception of excellence, not in the stone, but in the act of ending.

  "Goodbye, Elias."

  "Goodbye, Mara."

  She turned the wheel. The hydraulic hiss was loud in the silence. The door began to close.

  Elias turned back to the mosaic. The light was failing. The blue pupil was the last thing to vanish into the gray. He stood there until the darkness was absolute. The beauty remained, objectively, in the dark. But the good—the true, organic good—had walked out the door with Mara.

  He stood in the dark for a long time, not moving, holding the memory of the light. Then he turned and walked toward the South Spire, leaving the perfect, unseen thing behind. It was better than ugliness, he told himself. But it was not enough. Only the sharing had been enough. And that was gone.
