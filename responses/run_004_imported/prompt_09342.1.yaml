answer: |-
  Your intuition is not only correct; it aligns with a significant and longstanding debate within the philosophy of science. The conflation of Pierre Duhem and W.V.O. Quine into a single "Duhem-Quine thesis" is often regarded by historians and philosophers as a case of philosophical telephone, where a specific methodological observation about physics was absorbed into a radical epistemological doctrine about language and knowledge.

  Given your background, you will appreciate that the difference is not merely one of emphasis but of category. Duhem was analyzing the **logic of testing** in physical theory; Quine was analyzing the **structure of meaning and belief** in human knowledge.

  Here is an unpacking of the two positions on their own terms, addressing your three specific points of inquiry.

  ### 1. The Scope of Holism: Physics vs. The Web of Belief

  **Duhem's Modest Holism**
  In *The Aim and Structure of Physical Theory* (1906), Duhem's argument is tightly constrained to **mathematical physics**. His central claim is that a "crucial experiment" (an experiment that decisively falsifies one hypothesis while proving another) is impossible in physics.

  Why? Because a physical prediction is never derived from a single hypothesis ($H$) alone. It is derived from $H$ plus a vast array of auxiliary assumptions ($A_1, A_2, ... A_n$) regarding instrument calibration, background conditions, and prior theories. When the prediction $P$ fails ($\neg P$), logic tells us only that the conjunction ($H \land A_1 \land ... \land A_n$) is false. It does not tell us which conjunct is the culprit.

  Crucially, Duhem explicitly **excludes** other sciences from this strict holism. He suggests that in sciences like physiology or parts of chemistry, where systems can be more effectively isolated, the interdependence is not as total as in physics. Furthermore, Duhem does not view mathematics as part of the empirical web. For Duhem, mathematics is a formal language used to classify physical laws; it is not itself subject to empirical revision. His holism is about the *testing* of physical theories, not the *meaning* of all statements.

  **Quine's Radical Holism**
  Quine, in "Two Dogmas of Empiricism" (1951), explodes these boundaries. His target is not just the methodology of physics, but the distinction between **analytic truths** (true by meaning, e.g., "All bachelors are unmarried") and **synthetic truths** (true by fact, e.g., "It is raining").

  Quine argues that this distinction is untenable. Consequently, our knowledge is a "man-made fabric" or a "web of belief" that impinges upon experience only along the edges. Because statements are not verified individually but as a corporate body, *any* statement can be held true come what may, if we make drastic enough adjustments elsewhere in the system.

  For Quine, the scope is **total**. It includes not just physics, but biology, history, and crucially, logic and mathematics. Quine famously suggests that even the law of excluded middle could be revised to simplify our treatment of quantum mechanics. Where Duhem sees a logical constraint on falsification in physics, Quine sees a fluid boundary between definition and fact across all human discourse.

  ### 2. The Status of Logic and Mathematics

  **Duhem: Logic as the Scaffold**
  Duhem treats logic and mathematics as the scaffolding upon which physical theory is built, not as part of the building itself. When an experiment fails, a physicist might question the theory or the apparatus, but they do not question the logical rules used to derive the prediction. For Duhem, the "underdetermination" is a failure of *experimental leverage*, not a failure of logical or mathematical truth. He would likely view the revision of logic as a category error; logic governs the relations between propositions, it does not describe the physical world.

  **Quine: Logic as Revisable**
  Quine's holism is semantic as well as methodological. Because the meaning of a statement is determined by its place in the web, and the web is adjusted to accommodate experience, no statement is immune. Quine argues that logical laws are simply very central strands in the web. They are *less* likely to be revised because doing so would cause massive disruption (a loss of "conservatism"), but they are not *in principle* immune.

  This is the sharpest divergence. Duhem's thesis explains why you couldn't throw out Newtonian mechanics based on a single anomalous reading without checking your scope. Quine's thesis implies that if keeping Euclidean geometry makes your cosmology too complex, you are epistemologically permitted to adopt a non-Euclidean logic, provided the total system gains in pragmatic virtue.

  ### 3. Resolving Underdetermination: *Bon Sens* vs. Pragmatic Virtues

  You asked whether *bon sens* and pragmatic virtues are doing the same job. They are functionally similar (both guide theory choice when logic underdetermines it) but philosophically distinct.

  **Duhem's *Bon Sens* (Good Sense)**
  Duhem is worried that his logical point makes science look irrational. If logic cannot tell us which hypothesis to blame, what prevents science from descending into arbitrariness? His answer is *bon sens*.
  *   **Nature:** It is a cultivated judgment, akin to an Aristotelian virtue. It is not algorithmic.
  *   **Function:** It allows the scientific community to converge on a decision over time. It relies on coherence with other theories, historical continuity, and a feel for what constitutes a "natural classification."
  *   **Implication:** *Bon sens* implies there is a rational, albeit non-logical, path to the truth. Duhem believes physics aims at a "natural classification" that reflects the real relations between things, even if it cannot explain their essences. *Bon sens* is the faculty that detects this fit.

  **Quine's Pragmatic Virtues**
  Quine's criteria (simplicity, conservatism, fruitfulness, scope) are instrumental.
  *   **Nature:** They are engineering constraints on the web of belief.
  *   **Function:** They maximize the efficiency of the system in predicting future experience.
  *   **Implication:** Quine is more deflationary. He is less concerned with whether the theory matches a "natural classification" of reality and more concerned with whether the web holds together without unnecessary tension. For Quine, truth is immanent to the theory; we judge the theory from within, using our best current standards.

  **The Difference:** Duhem's *bon sens* is a bridge to reality (however modest); Quine's pragmatism is a tool for system maintenance. Duhem thinks *bon sens* helps us choose the theory that is *better*; Quine thinks pragmatism helps us choose the theory that is *more useful*.

  ### Conclusion: The Smuggled Doctrine

  To answer your ultimate question: **Yes, the composite name has smuggled a modest observation into a sweeping doctrine.**

  1.  **Duhem's Thesis (Confirmational Holism):** This is a logical reminder. It states that hypotheses cannot be tested in isolation. It explains why you, as an experimentalist, checked the calibration before abandoning the theory. It does **not** necessarily imply that all theories are equally valid or that evidence never decides between them. *Bon sens* eventually breaks the tie. Duhem gives us a reason to think falsification is logically complex, not that theory is permanently underdetermined.
  2.  **Quine's Thesis (Epistemological Holism):** This is the sweeping doctrine. It claims that evidence *radically* underdetermines theory because the "evidence" itself is theory-laden and the "theory" includes logic itself. Quine gives a genuine reason to think theory is underdetermined by evidence because he redefines evidence and theory as parts of a single, mutable system.

  **Which gives a genuine reason for underdetermination?**
  If you mean "Why can't I falsify my theory with one bad data point?", **Duhem** is your man. He provides the logical architecture of experimental practice.
  If you mean "Is it possible that two logically incompatible theories could account for all possible evidence forever?", **Quine** is your man. Duhem hopes *bon sens* resolves this; Quine accepts it as a feature of the human condition.

  Your suspicion is well-founded. Duhem described the **situation** of the physicist (entangled hypotheses); Quine prescribed an **ontology** of knowledge (the web). By running them together, the "Duhem-Quine thesis" often attributes Quine's radical skepticism to Duhem's careful methodology, or conversely, uses Duhem's uncontroversial physics to legitimize Quine's controversial views on logic. As a retired experimentalist, you were living Duhem's reality; as a philosopher, you are now grappling with Quine's expansion of it. They are related, but they are not the same.
