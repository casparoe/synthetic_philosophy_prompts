      *   *Resolution:* *Bon sens* (good sense). It's not algorithmic. It's a judgment call by the scientific community based on coherence, history, and intuition. It's conservative but not rigid.
      *   *Verdict:* Duhem is a methodological holist about *physics*, not a radical epistemological holist about *knowledge*.

  4.  **Drafting Section 2: Quine's Radical Extension:**
