      *   **Ethics/Value:** Ramsey was a pragmatist (influenced by Peirce and Wittgenstein). He cared about what works for human life. His note on "The World" (often cited in Ray Monk's biography or found in *Foundations of Mathematics*) emphasizes that value is internal to human experience, not external cosmic scale.
