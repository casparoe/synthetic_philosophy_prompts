answer: |-
  There is a major mix-up in your definitions, and it is crucial to fix this before you write your essay. If you submit an essay with these definitions reversed, you will lose significant marks on knowledge and understanding.

  You have **swapped the two theories**.

  Here is the correct breakdown:

  *   **Naturalism (e.g., Christopher Boorse):** This is the view that disease is an **objective, biological fact**. It is a deviation from normal species functioning. It tries to be value-free. (This matches the definition you gave for *Normativism*).
  *   **Normativism (e.g., Lennart Nordenfelt):** This is the view that disease involves a **value judgment**. It is not enough to be biologically abnormal; the condition must be *harmful* or prevent you from achieving your vital goals. (This matches the definition you gave for *Naturalism*).

  Once we fix the definitions, your question becomes much more interesting and actually hits on a perfect TOK tension: **"If Naturalism is more objective, why do we need Normativism?"**

  Here is why philosophers and doctors bother with the Normativist view, and how you can use this in your TOK essay.

  ### 1. The Problem of "Harmless Abnormalities"
  If we use the Naturalist (objective/statistical) view alone, we run into absurdities.
  *   **Example:** Having six fingers (polydactyly) is statistically abnormal and a deviation from standard human biology.
  *   **Naturalist Verdict:** It is a disease/disorder.
  *   **Normativist Verdict:** Unless it causes pain or prevents you from grasping things, it is **not** a disease. It is just a variation.
  *   **TOK Point:** Without the value judgment (Normativism), medicine would pathologize harmless differences. Objectivity alone cannot distinguish between a *difference* and a *defect*.

  ### 2. The Problem of "Common Harms"
  Sometimes a condition is statistically normal for a specific group, but clearly harmful.
  *   **Example:** High blood pressure (hypertension) is extremely common in older populations. In a strict statistical sense, it might be "normal" for a 70-year-old.
  *   **Naturalist Verdict:** If it's statistically common for the reference class, is it really a dysfunction? (This is a struggle for strict Naturalists).
  *   **Normativist Verdict:** It increases the risk of stroke and death; therefore, it is a disease regardless of how common it is.
  *   **TOK Point:** This shows that "statistical normality" does not always equal "health." We need values to determine what counts as a threat to well-being.

  ### 3. The Historical Danger of "Objective" Diagnosis
  This is your strongest TOK argument. When doctors claim their diagnoses are purely objective (Naturalist) but they are actually smuggling in cultural values, dangerous things happen.
  *   **Example:** In the 20th century, homosexuality was classified as a mental disorder in the DSM.
  *   **Naturalist Flaw:** It was a statistical minority behavior. A strict Naturalist might have struggled to remove it from the disease list without a change in values.
  *   **Normativist Correction:** It was removed not because we found a new biological fact, but because society decided it was not **harmful** or a **dysfunction**.
  *   **TOK Point:** Acknowledging the Normativist element makes medicine more honest. It admits that social values play a role in diagnosis, which allows us to critique those values. Pretending diagnosis is purely objective hides the bias.

  ### 4. Mental Health and Suffering
  In psychiatry, the Normativist view is almost essential.
  *   **Example:** Grief after a death vs. Clinical Depression. Biologically, they can look very similar (cortisol levels, sleep patterns, crying).
  *   **Naturalist Struggle:** How do you distinguish them biologically?
  *   **Normativist Solution:** We distinguish them based on the *context* and the *value* of the experience. Grief is a valued, appropriate response to loss. Depression is a state that impairs functioning without a proportional cause.
  *   **TOK Point:** This highlights the limits of the Natural Sciences (Biology) in the Human Sciences (Medicine/Psychology).

  ### How to frame this in your TOK Essay
  You asked: *"Why bother with the [Normativist] view... since it's basically admitting that diagnosis is subjective?"*

  In TOK, admitting subjectivity is not a weakness; it is a **refinement of knowledge**.

  *   **Knowledge Question:** *To what extent does the pursuit of objectivity limit our understanding of human health?*
  *   **Argument:** While Naturalism provides the *biological mechanism* (the "how"), Normativism provides the *justification for intervention* (the "why").
  *   **Implication:** If we rely only on the "scientific/objective" view, we risk treating people rather than illnesses (medicalizing normal life). If we rely only on the "value" view, we risk ignoring biological realities.
  *   **Conclusion:** Doctors bother with Normativism because medicine is not just about fixing biology; it is about alleviating **suffering**. Suffering is a value, not a statistic.

  ### Summary for your Essay
  1.  **Correct the definitions immediately.** (Naturalism = Objective/Bio; Normativism = Values/Harm).
  2.  **Argue that Objectivity has limits.** Statistics cannot tell us what is "good" or "bad," only what is "rare" or "common."
  3.  **Use the "Homosexuality" or "Six Fingers" example.** These are classic examples of where pure Naturalism fails.
  4.  **Conclude that Medicine is a Hybrid AOK.** It uses Natural Science methods (Naturalism) but serves Human Science goals (Normativism).

  This distinction is a goldmine for TOK. Just make sure you get the labels right!
