      *   *Application to Golem:* Golem 1 is the "Statue." The Clay is the "Lump."
      *   *The "Same Golem" Argument:* Needs to rely on continuity of *matter* or continuity of *soul/magic*. If the magic binds to the *clay*, then reassembling the clay reassembles the golem. This aligns with *Mereological Essentialism* (maybe?) or a specific view of *Constitution* where the constitution relation is tight enough to preserve identity through temporary disassembly. Or, more likely, a *Psychological/Functional Continuity* view if the "spark" returns. Actually, for "Same Golem," the best fit is often *Constitution View* (the clay constitutes the golem) combined with a belief that the *form* isn't what matters, the *matter* does. Or, conversely, a *Four-Dimensionalist (Perdurantist)* view where the golem is a space-time worm that has a gap.
      *   *The "New Golem" Argument:* Needs to rely on the break in *form*, *function*, or *consciousness*. If the golem died when smashed, putting the clay back together makes a new thing. This aligns with *Sortal Essentialism* (a golem must have a specific form to be a golem) or *Psychological Continuity* (the mind didn't survive the smash).

  3.  **Map Philosophical Positions to Character Stances:**

