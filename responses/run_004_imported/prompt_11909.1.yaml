      *   *Side 2 (It's New):* Focus on **Sortal Essentialism** and **Leibniz's Law**. The *kind* of thing it is (a golem) requires a specific organization. That organization broke.
      *   *The "Magic" Variable:* Since it's fantasy, introduce the "Spark." Does the magic stick to the atoms or the shape? This adds narrative flavor to the metaphysics.
      *   *Dialogue/Argument Tips:* Give specific lines of reasoning based on these concepts.

