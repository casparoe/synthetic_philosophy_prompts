answer: |-
  You have stumbled onto one of the most famous and contentious episodes in 20th-century philosophy of science. You are not misremembering, and you are right to be surprised: Karl Popper, the high priest of falsification, did indeed temporarily classify Darwinian natural selection as a "metaphysical research programme" rather than a testable scientific theory.

  However, the story doesn't end there. The nuance you're looking for lies in **why** he said it, the fact that **he later retracted it**, and what that specific failure tells us about the limits of falsificationism as a rigid algorithm.

  Here is the breakdown of the situation, the context you're missing, and what it implies for the rationalist canon.

  ### 1. The Timeline: Popper Changed His Mind
  The most critical piece of context often omitted in secondary summaries is that Popper recanted this view.

  *   **1974:** In a lecture titled *"Darwinism as a Metaphysical Research Programme,"* Popper argues that "survival of the fittest" is tautological. If fitness is defined solely by survival, the statement "the fittest survive" means "those who survive, survive." He concludes it is unfalsifiable.
  *   **1978:** In a follow-up piece (*"Natural Selection and the Emergence of Mind"*), Popper explicitly states: **"I have changed my mind."**

  He came to accept that natural selection is, in fact, testable. He acknowledged that biologists had demonstrated ways to measure "fitness" independently of actual survival (e.g., physiological efficiency, reproductive potential in controlled environments).

  So, if you are looking for a definitive "Popperian verdict" on evolution, it is that **evolution is a testable scientific theory.** The period where he doubted it was a specific, acknowledged error in his later career.

  ### 2. The Specific Objection: The Tautology Problem
  To understand why a genius like Popper made this "error," you have to look at the logical structure he was analyzing versus the biological reality.

  Popper was attacking the phrase "Survival of the Fittest." He argued that if you ask a biologist, "Who are the fittest?" and they answer, "Those who survive," and then you ask, "Why did they survive?" and they answer, "Because they were the fittest," you have a closed logical loop. No observation can break it.

  **Why biologists and philosophers of science reject this:**
  Fitness is not defined *post hoc* by survival. It is defined by **propensities** based on traits.
  *   *Example:* We can measure the camouflage efficiency of a moth, the enzyme efficiency of a bacteria, or the aerodynamic lift of a bird wing *before* we release them into the wild.
  *   *Falsification:* If a organism with high measured fitness (e.g., perfect camouflage) consistently dies off while a low-fitness organism (brightly colored) survives, without an external environmental shift explaining it, the theory is falsified.

  Popper, being a logician and not a biologist, initially missed the operationalization of "fitness" that biologists were already using. He treated the slogan ("survival of the fittest") as the theory, rather than the mechanism (variation + heredity + differential reproduction based on traits).

  ### 3. "Metaphysical Research Programme" ≠ Pseudoscience
  This is a crucial distinction in Popper's vocabulary that often gets lost in LessWrong/ACX summaries.

  When Popper called Darwinism a "metaphysical research programme," he was **not** equating it with astrology or Freudian psychoanalysis in terms of truth value or utility.
  *   **Pseudoscience (for Popper):** Claims to be empirical but immunizes itself against criticism (e.g., Marxists explaining away failed predictions with ad-hoc clauses).
  *   **Metaphysical Research Programme:** A framework that is not currently testable in its core axioms but **generates testable hypotheses.**

  Popper actually thought Newton's physics started as a metaphysical research programme before it became fully testable. By calling Darwinism this, he was saying, "This is a brilliant, productive framework that guides science, even if the core mechanism is logically tautological."

  It was a compliment to its utility, but a demotion in its logical status. When he retracted the view in 1978, he upgraded it back to "testable theory."

  ### 4. What This Means for Falsificationism
  Your core question is whether this reveals a flaw in falsifiability as a demarcation criterion. The answer is **yes, but not in the way creationists claim.**

  **A. Falsification is not an algorithm.**
  Popper's mistake shows that you cannot apply the falsifiability criterion in a vacuum. You need domain expertise to know *how* a theory could be falsified. Popper looked at the *sentence* "survival of the fittest" and saw a tautology. Biologists looked at the *practice* of evolutionary biology and saw measurable predictions.
  *   *Lesson:* Falsifiability is a property of how a theory is *used* and *tested*, not just its linguistic formulation.

  **B. Probabilistic and Historical Sciences are Hard to Falsify.**
  Evolution is historical and probabilistic. It doesn't predict "Event X will happen at Time Y." It predicts "Given conditions Z, we should see distribution W in the fossil record."
  Strict falsificationism struggles with probabilistic statements (e.g., "this coin is biased"). A single heads doesn't falsify it; a thousand heads might. Popper's initial hesitation reflected the difficulty of fitting historical, probabilistic sciences into a strict logical box designed largely with physics in mind.

  **C. Even the Master is Fallible.**
  The irony is deeply Popperian: Popper's own philosophy predicts that scientists (and philosophers) will make errors and that knowledge grows through correction. The fact that Popper himself had to falsify his own view on Darwinism validates his broader epistemology, even if it dents the specific "falsifiability criterion" as a perfect tool.

  ### 5. The Creationist Co-opting
  Your friend is correct that creationists love this quote. They engage in **quote mining**:
  1.  They cite the 1974 Popper.
  2.  They ignore the 1978 retraction.
  3.  They ignore Popper's explicit statement that he believed evolution occurred and was important, he was just nitpicking the logical status of natural selection.
  4.  They imply Popper thought evolution was "false," when Popper only questioned if it was "scientific" (in a specific logical sense) for a brief window.

  It is a classic case of using a philosopher's nuance as a blunt instrument.

  ### Summary: How to Update Your View
  You don't need to throw out Popper or Falsification, but you should update your understanding of them based on this episode:

  1.  **Popper was wrong about Darwin (initially).** He admitted it. It serves as a case study in why philosophers of science need to talk to actual scientists.
  2.  **Falsifiability is a heuristic, not a logic gate.** It is a rule of thumb for "are you trying to find out if you're wrong?" rather than a mathematical proof that separates Science from Non-Science cleanly.
  3.  **The Rationalist Canon is simplified.** LW/ACX often treat Popper as a monolith. Reading the primary sources (as you did) reveals that Popper was a evolving thinker who struggled with the same complexities you are.
  4.  **Evolution remains the gold standard.** The fact that Popper struggled to fit it into his box says more about the rigidity of the box than the softness of the theory. Modern philosophy of biology has largely resolved the "tautology" objection, restoring evolution's status as a highly testable theory.

  **The Verdict:** This isn't a "gotcha" that breaks falsificationism. It's a historical footnote that humanizes Popper and demonstrates that **demarcation is messy.** It suggests that instead of asking "Is this theory falsifiable?", we should ask "Is this community actively trying to falsify this theory?" In evolutionary biology, they are. In Freudian analysis, they generally aren't. That practical distinction holds up better than the logical one Popper tried to apply to Darwin.
