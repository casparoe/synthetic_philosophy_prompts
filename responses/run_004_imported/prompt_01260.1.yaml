          *   *Correction:* I need to be careful not to say Hobbes *is* Gauthier. Gauthier explicitly claims to be rescuing Hobbes, but many scholars think Gauthier projects modern decision theory onto Hobbes.
          *   *Key Distinction:* Hobbes's argument is largely *consequentialist* regarding reputation and security. Parfit/Gauthier are arguing about the *definition* of rationality itself (dispositional vs. act-based).
          *   *The "One-Shot" Issue:* Hobbes would likely deny the coherence of a true "one-shot" in the State of Nature context. If you break a covenant, you return to the State of Nature (Warre). But in the specific text provided, he emphasizes the *social exclusion*.
          *   *Biologist Analogy:* Use the vampire bat analogy. If a bat refuses to regurgitate blood when it has surplus (after receiving help), it gets ostracized. Is that "irrational"? Hobbes says yes, because long-term survival depends on the colony. Parfit says yes, because you wouldn't get help in the first place if you were *known* to be that kind of bat. Hobbes focuses on the ostracism; Parfit focuses on the initial pickup.

  5.  **Final Polish:**
      *   Ensure the 17th-century English is translated into clear modern concepts.
