          *   *Meaning:* Rationality = maximizing self-interest. If breaking a promise helps me more than keeping it, breaking it is rational. Justice is nonsense.
      *   *Segment 2 (The Setup):* "For the question is not of promises mutuall, where there is no security of performance on either side [...] But either where one of the parties has performed already; or where there is a Power to make him performe..."
          *   *Meaning:* Hobbes is narrowing the scope. He's *not* talking about the State of Nature (no trust, simultaneous exchange). He's talking about cases where (a) someone already did their part, or (b) there's a sovereign to enforce it. This is crucial. It's about *post-agreement* behavior.
      *   *Segment 3 (The Verdict):* "...there is the question whether it be against reason [...] to performe, or not. And I say it is not against reason."
          *   *Meaning:* Keeping the covenant is rational even if immediate gain suggests breaking it.
      *   *Segment 4 (The Argument - Security/Confederates):* "Secondly, that in a condition of Warre... no man can hope by his own strength... without the help of Confederates..."
          *   *Meaning:* You need allies to survive.
      *   *Segment 5 (The Reputation/Signaling Point):* "...he which declares he thinks it reason to deceive those that help him, can in reason expect no other means of safety, than what can be had from his own single Power."
