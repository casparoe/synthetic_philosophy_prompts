          *   **Terminology:** We use the name "Adam" loosely to cover the cluster of concepts sharing the same "essence" (e.g., first man), but metaphysically, they are distinct substances.
      *   **Conclusion:** Leibniz sides closer to Lewis on identity (no transworld identity), but the reconciliation lies in the pre-actual status of possible individuals as distinct concepts in the divine mind.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, does Leibniz believe in "haecceity"?* Yes, in a sense. The complete concept *is* the haecceity.
      *   *Did Kripke criticize Leibniz?* Yes, in *Naming and Necessity*, Kripke argues against the description theory of names, which targets Leibniz/Frege/Russell. Kripke thinks we can refer to Nixon without knowing all his properties. Leibniz thinks the concept *contains* all properties.
      *   *Scholarly Consensus:* Most interpreters (e.g., Robert Merrihew Adams, *Leibniz: Determinist, Theist, Idealist*) argue that Leibniz denies transworld identity. The "Sextus" talk is a manner of speaking about different possible concepts that we group under one name.
      *   *Make sure to mention:* The distinction between *absolute necessity* and *hypothetical necessity*. This is crucial for Leibniz's theodicy. Adam sins *necessarily* given that he is actualized, but his existence is not absolutely necessary.

