answer: |-
  # The Price of Openness: Truth, Time, and Prediction Markets

  The dispute on your trading floor is not merely a quibble over semantics; it is a recurrence of one of the oldest and most stubborn problems in metaphysics. When you buy a share on Polymarket that pays out if "Candidate X wins the election," you are treating the proposition *Candidate X wins* as something that can be priced today. But what is the ontological status of that proposition right now?

  One camp argues for a form of logical fatalism: the proposition is already true or false, and the price reflects our epistemic limitation. The other camp fears that admitting a present truth value collapses the future into a fixed track, negating the genuine contingency that makes the market interesting (and morally significant). Your friend is correct: this is Aristotle's sea battle. The question is whether the logic of our language forces us into a deterministic universe.

  To resolve this, we must first understand why bivalence—the principle that every proposition is either true or false—seems to threaten the openness of the future. Then we must weigh the available metaphysical frameworks. While Peirceanism, Ockhamism, and Supervaluationism each offer partial solutions, I will argue that **Assessment-Sensitive Relativism** (following John MacFarlane) provides the most robust account. It preserves the logic required for trading without conceding to fatalism, and it best explains the specific experience of holding a position in a prediction market.

  ### The Fatalist Threat

  The intuition driving the fatalist camp is seductive. Consider the proposition $P$: "Event E occurs on date D." If $P$ is true now, then E must occur. If $P$ is false now, E cannot occur. In either case, the outcome appears fixed. The argument relies on the inference from truth to necessity:

  1.  It is now true that E will occur.
  2.  If it is now true that E will occur, then E must occur.
  3.  Therefore, E must occur.

  If this argument holds, the future is closed. The price on Kalshi is not a measure of probability or propensity; it is a measure of our ignorance of a script that has already been written. This is unacceptable to anyone who believes the future is genuinely contingent—that human actions, chance, or causal indeterminacy can still influence the outcome.

  The fatalist error lies in conflating the *necessity of the consequence* with the *necessity of the consequent*. It is necessary that (if $P$ is true, then E occurs). But it does not follow that (if $P$ is true, then E occurs *necessarily*). Truth is a semantic property; necessity is a modal property. To show this, we need a metaphysics of time that allows a proposition to be true without being necessitated.

  ### The Contenders

  **1. Peirceanism (The Open Future)**
  Named after C.S. Peirce and developed by A.N. Prior, this view takes the openness of the future most seriously. It denies bivalence for future contingents. Right now, "Event E will occur" is neither true nor false. It only acquires a truth value when the event happens or fails to happen.
  *   *Verdict:* This saves openness but wrecks logic. If future contingents lack truth values, the Law of Excluded Middle ("Either E will happen or it won't") fails. For a trader, this is disastrous. A contract that is neither true nor false is incoherent; a market requires a binary resolution. Peirceanism makes the market's payout structure metaphysically mysterious.

  **2. Ockhamism (The Thin Red Line)**
  Ockhamists maintain bivalence. "Event E will occur" is true or false now. However, they deny that this truth implies necessity. They model time as branching, but posit that one branch is the "actual" future (the Thin Red Line). The proposition is true if E happens on that specific line.
  *   *Verdict:* This preserves classical logic and fits the binary nature of markets. However, it carries heavy metaphysical baggage. If the future is genuinely open, what makes one branch "actual" before it happens? Positing a privileged future looks suspiciously like determinism in disguise. It answers the fatalist by stipulation rather than explanation.

  **3. Supervaluationism (Truth Across Histories)**
  Supervaluationists (like Richmond Thomason) agree that time branches. A proposition is "super-true" only if it is true on *all* possible future branches. Since contingent events do not happen on all branches, "Event E will occur" is currently indeterminate (neither true nor false). However, tautologies like "E will occur or E will not occur" are true because they hold on all branches.
  *   *Verdict:* This is logically elegant and preserves openness. But it struggles with "actuality." In a prediction market, only one history becomes real. Supervaluationism makes it difficult to say *which* one until it happens. It treats the current truth value as a gap, which complicates the idea that a trader is buying a "true" claim.

  ### The Case for Relativism

  The most compelling solution is **Assessment-Sensitive Relativism**. This view, championed by John MacFarlane, suggests that truth is not only relative to the context of *utterance* (when the claim is made) but also to the context of *assessment* (when the claim is evaluated).

  Under relativism, the proposition "Event E will occur" does not have a monolithic truth value.
  *   Assessed from the **present** (before the event), the proposition is **indeterminate**. The future is open; no fact of the matter exists yet.
  *   Assessed from the **future** (after the event), the proposition is **determinate** (true or false).

  This dissolves the fatalist threat. The fatalist assumes that if a proposition is true *simpliciter* now, the future is fixed. Relativism denies there is such a thing as truth *simpliciter* across time. There is only truth-at-a-context. When you buy a share today, you are making a claim that is currently indeterminate. When the market resolves, you are assessing that claim from a new context where the indeterminacy has collapsed.

  **Why Relativism Wins**
  Relativism survives scrutiny where the others falter for three reasons:

  1.  **It Validates the Trader's Experience:** Traders feel genuine uncertainty. Peirceanism validates this but breaks the payout logic. Ockhamism validates the payout logic but invalidates the uncertainty (by positing a fixed actual future). Relativism captures both: the uncertainty is real *now* (indeterminate assessment), but the payout is real *later* (determinate assessment).
  2.  **It Avoids Metaphysical Excess:** Unlike Ockhamism, Relativism does not require a "Thin Red Line" or a mysterious metaphysical selector that picks the actual future before it happens. Unlike Supervaluationism, it doesn't force us to say that "E will happen" is false/indeterminate even in a world where E clearly *did* happen. It allows truth to be dynamic without being contradictory.
  3.  **It Explains Retraction:** If I say "E will happen" and E does not happen, I admit I was wrong. In Supervaluationism, I wasn't wrong; my statement was just indeterminate. In Relativism, my statement was indeterminate *then*, but false *now* (from my current context of assessment). This matches the practice of settling bets: we look back and assign a truth value based on what actually occurred.

  ### Implications for Prediction Markets

  Committing to Relativism changes how we interpret the price on Polymarket or Kalshi.

  **1. Prices Do Not Track Pre-Existing Facts**
  The fatalist camp claims the price reflects ignorance of a settled fact. Relativism says there *is* no settled fact yet. The price (e.g., 60 cents) does not represent the probability that a hidden truth is "True." Instead, it represents the market's consensus on the **likelihood that a future assessment will verify the claim.** You are not betting on what *is*; you are betting on what *will be judged to have been*.

  **2. Resolution is a Shift in Context, Not Discovery**
  When the market resolves, we do not "discover" the truth that was there all along. We undergo a shift in the context of assessment. The indeterminacy of the past is resolved by the actuality of the present. This validates the intuition of the "open future" camp: the outcome was not fixed when you bought the share. It became fixed only as history unfolded.

  **3. Logic Remains Intact**
  Unlike Peirceanism, Relativism allows traders to use classical logic within a specific context. At the moment of resolution, bivalence holds. The contract pays $1 or $0. The logical machinery of the market functions normally, but without the metaphysical commitment that the $1 outcome was inevitable at the moment of purchase.

  ### Conclusion

  The dispute on your trading floor stems from a confusion about *when* truth applies. The fatalists assume truth is timeless; the open-future proponents assume truth must be static to be real. Both are mistaken.

  The correct metaphysical stance is **Relativism**. A prediction market contract is a proposition whose truth value is sensitive to the time of assessment. Today, the proposition "Event E will occur" is indeterminate. Tomorrow, it will be true or false. This view preserves the openness of the future (denying fatalism) while preserving the binary logic required for settlement (denying Peirceanism).

  Therefore, when you trade, you are not navigating a world of fixed facts hidden by ignorance, nor are you gambling on logical gaps. You are navigating a branching timeline, placing bets on how the context of assessment will shift. The price is not a mirror of reality as it is, but a map of reality as it is *becoming*. This affirms that your trades matter: they are wagers on a future that is genuinely unwritten, waiting for your assessment to turn possibility into fact.
