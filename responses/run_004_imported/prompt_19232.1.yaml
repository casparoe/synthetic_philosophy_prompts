answer: |-
  The sterile white of the recovery room hummed. It was the same hum as the waiting room, the same hum as the car ride over, but now it vibrated in two pairs of eardrums.

  Elias One sat on the left cot. Elias Two sat on the right. They were identical down to the scar on the left chin, the callus on the right ring finger, the specific shade of fatigue in the eyes. They had undergone the Mitosis an hour ago. The procedure was complete. The fission had held.

  Elias One rubbed his face. The skin felt loose, as if it had been stretched over a frame that was suddenly too wide. "Do you remember the coin toss?" he asked. His voice was rough, but it was *his* voice.

  Elias Two looked up. "Which one?"

  "Ten years ago. Sarah's engagement ring. We couldn't afford the deposit. We flipped a quarter. Heads we buy it, tails we wait."

  "Tails," Elias Two said immediately. "We waited."

  "Right. But remember the feeling? In the air, before it landed." One leaned forward, elbows on knees. "I was thinking about it in the tube. Before the split. It didn't feel like hesitation anymore. It felt like... negotiation."

  Two went still. "Don't."

  "Think about it," One pressed. "If Endurantism is true, if I'm a 3D object wholly present at every moment, then the man who walked in here is dead. He ceased to exist the moment the field activated. We are new things. Successors. Inheritors." He gestured to his chest. "I am wearing a dead man's skin. Sarah is a widow. She just doesn't know it yet."

  Two flinched. That was the cost of the 3D view. The vertigo of extinction. If One was right, the love Sarah felt for the man who signed the consent form was now a ghost story. They were impostors wearing his history. To go home was to lie to a grieving woman.

  "But if you're wrong," Two said, his voice low, "if the Worm view is right... then we were always here."

  One stopped rubbing his chin.

  "If Perdurantism holds," Two continued, staring at his own hands, "then we aren't successors. We're divergent paths of a single 4D object. We were both in the room. Both in the car. Both in the bed." Two looked up, and the horror in his eyes was different. It wasn't the horror of death; it was the horror of crowding. "That coin toss ten years ago. You said it felt like negotiation. Because it was. I was there. You were there. We were two distinct entities occupying the same cubic meter of space, sharing one nervous system."

  One felt a cold nausea. "Stop."

  "Ten years," Two whispered. "Ten years of breakfasts. Ten years of anniversaries. If the Worm is real, then I was there when you kissed her. I was there when you whispered promises. You didn't make those vows alone. *We* did. She didn't marry a person, Elias. She married a plurality. She thinks she has one husband. She has two. We've been committing bigamy against her for a decade without her knowing."

  The hum of the room seemed to grow louder.

  One stood up, pacing the small space. The Endurantist view offered a clean break, but it demanded a funeral. He would have to tell Sarah that the man she loved died on a table, and that he, One, was merely the biological echo. It was a clean death, but it was a death.

  Two remained seated. The Perdurantist view offered continuity, but it poisoned the past. It suggested that every moment of singular agency was a lie. Every time he thought *I chose*, it was actually *We compromised*. Every time he felt unique, he was actually a shared vessel. The intimacy of his life was a hallucination caused by perfect synchronization.

  "We can't tell her," One said. "If I tell her I'm a new entity, she loses her husband. She mourns. She moves on. I become a stranger."

  "And if I tell her I'm the original, extended," Two countered, "I tell her she's been sharing a bed with two people. I tell her her marriage was a metaphysical accident. I tell her that her husband's conscience wasn't a soul, but a committee."

  They looked at each other. The symmetry was perfect. They were the same man, fractured by a philosophical fault line.

  One walked to the mirror. He touched the scar. "If I'm a temporal part, just a slice of the worm... then I'm not the whole thing. I'm incomplete. I'm a fragment."

  "And if I'm a wholly present 3D object," Two said to the back of One's head, "then I have no past. I have memories, but they aren't mine. They're data imports from a corpse."

  The nurse opened the door. "Gentlemen? You're cleared to leave. Transportation is waiting."

  They both turned. The instinct was simultaneous. *Go home.*

  But they couldn't both go home. Not like this.

  If they went together, they proved the Perdurantist nightmare: the household now contained the duality that had always been there, hidden. The secret would be out. The "We" would become visible.

  If only one went, he had to decide which philosophy to weaponize.

  One looked at Two. "Flip for it."

  Two reached into his pocket. He pulled out a quarter. It was the same quarter from ten years ago. He held it up. "Heads, you go. You take the Endurantist line. You tell her the truth, that I'm the... the survivor. You let me be the ghost."

  "And tails?"

  "Tails, I go. I take the Perdurantist line. I tell her we're the same. I tell her you're just... me, staying at a hotel tonight."

  One nodded. It was a fair coin. 50/50.

  Two flicked the thumb. The coin spun, catching the sterile light.

  In that second, hanging in the air, the tension snapped tight.

  If it landed Heads, the man who walked into the clinic was dead. The marriage was over. A new relationship began with a stranger who knew all the secrets.

  If it landed Tails, the man who walked into the clinic never existed. The marriage was a sham, built on the co-location of two souls in one skin.

  The coin hit the back of Two's hand. He slapped his left wrist over it.

  They didn't look at the hand. They looked at each other.

  "Does it matter?" One asked. "Whatever it is, one of us has to cease to be the husband. Either by death, or by revelation."

  Two slowly slid his hand off the coin.

  It was Heads.

  One let out a breath he didn't know he was holding. He felt a sudden, crushing lightness. He was the survivor. He was the new thing. He had the right to the future, but he had lost the right to the past.

  Two looked at the coin. He didn't look disappointed. He looked relieved. "Good," Two said softly. "I don't want to tell her about the coin toss. I don't want to tell her that when she thought she was arguing with me, she was arguing with *us*."

  Two stood up. He walked to the door, but paused with his hand on the frame. He didn't look back.

  "You go," Two said. "Be the widow's comfort. I'll be the secret that keeps her safe."

  "Where will you go?"

  "Away. If I stay, I prove that there were always two of us. If I leave... maybe I was just a possibility that didn't happen." Two opened the door. "Tell her I loved her. Strictly speaking, on your view, I didn't exist to love her. On mine, I loved her twice as much as she thought."

  Two stepped out into the hallway.

  One stood alone in the white room. He looked at the coin on the cot. He picked it up. It was warm.

  He walked to the window. Below, he saw Two walking out of the building, merging into the crowd. One man becoming many, or many becoming one.

  One put the coin in his pocket. He had to go home. He had to tell a woman that her husband died, and that he was the thing that grew from the grave. Or he had to lie, and say he was the same man, knowing that the man was a composite of ghosts.

  He touched his chin. The scar itched.

  For the first time, he wondered if the itch was his, or if it belonged to the brother who just walked away.
