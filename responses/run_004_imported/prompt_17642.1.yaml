answer: |-
  You have stumbled directly into one of the most famous results in social choice theory. The short answer is: **You are right, the app was wrong, and this is not a bug in that specific app—it is a fundamental mathematical limitation of almost all voting systems.**

  The field you are looking for is **Social Choice Theory**, and the specific theorem that settles this question is the **Gibbard–Satterthwaite Theorem**.

  Here is the breakdown of what happened at your dinner, why the app's marketing was misleading, and the deeper mathematical reality you're asking about.

  ### 1. The Specific System: Instant Runoff Voting (IRV)
  The app you used employed **Instant Runoff Voting** (often branded as Ranked Choice Voting or RCV). The marketing claim that "nobody has any reason to vote for anything but their honest favorite" is a common selling point for RCV, but it is mathematically false.

  RCV is excellent at solving the **"spoiler effect"** found in plurality voting (where voting for a third party helps the candidate you hate most win). However, RCV introduces its own vulnerabilities:
  *   **Non-monotonicity:** In some scenarios, ranking a candidate *higher* can cause them to *lose*, or ranking them lower can cause them to win.
  *   **Strategic Manipulability:** As you discovered, there are scenarios where voting insincerely yields a better outcome than voting honestly.

  Your specific scenario is a known IRV paradox. By ranking Pizza first (insincerely), you likely kept Pizza in the race long enough to eliminate the Burger spot, allowing Sushi to survive to the final round and beat Pizza. By voting honestly for Sushi, you might have caused Sushi to be eliminated early because Pizza and Burger split the remaining votes differently.

  ### 2. The General Impossibility: Gibbard–Satterthwaite
  You asked if there is a "cleverer counting method" that could design this away. For ranked voting systems with three or more options, the answer is **no**.

  In the early 1970s, Allan Gibbard and Mark Satterthwaite independently proved a theorem that is now a cornerstone of economics and political science. The **Gibbard–Satterthwaite Theorem** states:

  > For any voting system that selects a single winner from three or more candidates, if the system is **deterministic** (no randomness) and **not a dictatorship** (one person doesn't decide everything), then it is **manipulable**.

  In plain English: **There is no ranked voting system where it is always in every voter's best interest to vote honestly.** In every such system, there will be some configuration of preferences where a voter can get a better outcome by lying.

  This is settled science. It is as robust as the impossibility of building a perpetual motion machine.

  ### 3. Are There Any Exceptions?
  There are only three ways to "escape" the theorem, none of which are perfect solutions for a dinner party or a city election:

  1.  **Restrict Preferences (Single-Peakedness):** If everyone's preferences align on a single spectrum (e.g., Left to Right politics) and everyone prefers options closer to their ideal point, then the **Median Voter Theorem** applies, and honesty becomes the dominant strategy. However, restaurant choices (Sushi vs. Burger vs. Pizza) are not single-peaked; they are multidimensional.
  2.  **Randomness:** If you pick the winner by lottery (Random Dictator), truth-telling is optimal because you can't game the odds. But this is usually unacceptable for decision-making.
  3.  **Cardinal Voting (Score Voting):** Gibbard–Satterthwaite applies to *ordinal* systems (ranking A > B > C). *Cardinal* systems (rating A: 5 stars, B: 2 stars) are technically subject to a broader extension of the theorem (Gibbard's 1978 theorem), but proponents argue that **Score Voting** or **Star Voting** minimizes the *incentive* to strategize. In practice, it is often safer to rate candidates honestly in Score Voting than to rank them in IRV, though "min-maxing" (giving your favorite 5 stars and everyone else 0) is still a common strategy.

  ### 4. Implications for Your Writing
  Since you write explainers on this topic, this distinction is crucial for accuracy.

  *   **The Myth:** "Ranked Choice Voting eliminates strategic voting."
  *   **The Reality:** "Ranked Choice Voting changes the *type* of strategic voting required."

  In Plurality voting, the strategy is **"Vote for the lesser of two evils"** (don't waste your vote on a third party).
  In IRV/RCV, the strategy is **"Push-over" or "Burial"** (rank a weak opponent higher to eliminate a strong rival, as you accidentally discovered).

  While IRV reduces the pressure to vote strategically in *many* common scenarios (which is why cities adopt it), it does not eliminate the *possibility*. A honest explainer should acknowledge that while RCV is an improvement over Plurality regarding the spoiler effect, **no system is perfectly strategy-proof.**

  ### Summary
  You didn't miss anything. The app's promise was a marketing simplification of a complex mathematical reality. You experienced a concrete example of the **Gibbard–Satterthwaite Theorem** in action.

  It is unavoidable. Any time you have three or more options and a deterministic method to pick one, there will be situations where honesty is not the best policy. The goal of voting system design isn't to find the perfect system (which doesn't exist), but to find the system where the strategic voting is too difficult to calculate or where the incentives for honesty are strongest in *typical* scenarios.

  In your case, the math was simple enough for you to reverse-engineer on a napkin, which is why the strategy worked. In a city election with thousands of voters, that calculation is usually too hard to pull off, which is why RCV still functions "well enough" in practice, even if it isn't theoretically perfect.
