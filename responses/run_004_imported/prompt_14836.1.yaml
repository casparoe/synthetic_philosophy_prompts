      *   Callum: The success of science in other domains guarantees success here (inductive faith).

      *Begging the Question:* It's a charge of *circularity in the premise*. Devi assumes the concept's nature reveals the property's nature. Callum says that's exactly what's in dispute.

      *Novel Advice:* Focus on the *frustration* of the stalemate. The narrator sees two smart people unable to bridge the gap, reinforcing her fear that the "inner life" is ineffable/undetectable.

