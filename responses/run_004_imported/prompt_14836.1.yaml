      *   *Nuance:* In Move 3, Devi is channeling Kripke. In Move 4, Callum is channeling the "Phenomenal Concept Strategy" (David Papineau, Brian Loar, etc.). I should name-drop these implicitly or explicitly to give the user research keywords.
      *   *Fairness:* Callum's Move 4 is the strongest physicalist defense currently available, but it's also the most contentious. Devi's Move 3 is the strongest dualist defense, but relies on intuition. It's a perfect stalemate.

  8.  **Final Polish:** Check against the user's constraint: "Neither budged, and I don't want to load the scene in either character's favor." The analysis must reflect that this is a live, unresolved debate in academia.

