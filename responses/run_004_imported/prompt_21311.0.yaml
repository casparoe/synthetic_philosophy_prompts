answer: |-
  **MEMORANDUM**

  **TO:** Graduate School Academic Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Petition #23-09 (Linguistics Doctoral Candidature)

  **I. ISSUE**

  The Committee must determine whether to grant a one-year extension to a doctoral candidate in Linguistics who has reached the seven-year statutory limit for degree completion. The candidate utilized a one-year approved medical leave. While the Graduate Handbook explicitly excludes military and parental leave from the seven-year calculation, it is silent regarding medical leave. The candidate possesses written correspondence from the Dean's Office stating her "progress clock is paused," yet the Handbook's text does not support this assertion.

  **II. PRELIMINARY OBSERVATION: THE COST OF AMBIGUITY**

  Before addressing the specific equities of this case, we must confront the structural argument against granting this petition. There is a compelling, principled position that we should deny this request. It rests on the maxim *expressio unius est exclusio alterius*: the expression of one thing implies the exclusion of others.

  The drafters of the Handbook enumerated specific tolling provisions (military, parental). They did not enumerate medical leave. To read medical leave into that silence is to rewrite the code, not interpret it. The proponents of this view argue that our authority is regulatory, not legislative. If we allow "purpose" or "sympathy" to override an enumerated list, we convert a bright-line rule into a standard of "reasonable excuse."

  This concern is not merely theoretical. We have two additional petitions pending that rely on this outcome. If we rule that the Handbook's silence on medical leave is a "gap" to be filled by the Committee, we effectively invite every future petitioner to argue that their specific hardship was an "unintended omission." The certainty that the seven-year rule was designed to purchase—the assurance that time limits are objective rather than negotiable—is lost. A committee that decides cases based on the perceived fairness of the outcome rather than the stability of the rule ceases to be a standards body and becomes a tribunal of conscience. Those arguing for denial are correct that there is a genuine institutional cost to overriding the text: it signals that the Handbook is a draft subject to revision whenever a hard case arises.

  **III. THE COUNTERVAILING INTEREST: ADMINISTRATIVE RELIANCE**

  However, there is a distinct factor in this case that distinguishes it from a simple request to reinterpret the Handbook. This is not merely a student asking us to ignore the text because her situation is difficult; it is a student asking us to honor a specific representation made by the administration.

  The candidate acted on an email from the Dean's Office. She structured her dissertation timeline based on the assurance that her clock was paused. To deny the petition now is to punish the student for the administration's lack of precision. While the Committee cannot rewrite the Handbook, we also cannot sanction a process where the Dean's Office provides authoritative guidance that contradicts the Faculty-approved regulations, only for the Committee to repudiate that guidance after the student has relied upon it to her detriment.

  If we deny this petition, we uphold the text of the Handbook but undermine the authority of the Dean's Office. If we grant it solely on the basis that "medical leave should count," we uphold the student but undermine the Handbook. We must find a path that preserves the integrity of the code without sacrificing the student to administrative error.

  **IV. RECOMMENDATION**

  I recommend that the Committee **GRANT the extension with specific findings of fact.**

  Crucially, the grounds for this grant must be narrowly tailored to avoid setting the precedent that the "Deny" faction rightly fears. We should not rule that medical leave *automatically* tolls the seven-year clock. That would require a Handbook amendment, which is a legislative act for the Faculty Senate, not an adjudicative act for this Committee.

  Instead, the ruling should be grounded in **detrimental reliance on administrative representation.**

  **The Order Should Read:**
  1.  **Finding:** The Handbook, as currently written, does not automatically toll the seven-year clock for medical leave. The silence in the text is noted and respected as the governing standard for future cases.
  2.  **Exception:** In this specific instance, the candidate received written assurance from the Dean's Office that her clock would be paused. She relied on this assurance in good faith.
  3.  **Ruling:** The extension is granted to remedy the administrative inconsistency, not to reinterpret the Handbook.
  4.  **Condition:** This precedent applies *only* to cases where documented, written reliance on contradictory administrative guidance can be demonstrated. It does not establish a right to tolling for medical leave in the absence of such guidance.

  **V. IMPLICATIONS FOR PENDING PETITIONS**

  This approach directly addresses the two pending petitions in the Dean's inbox.
  *   If those petitioners also possess emails from the Dean's Office promising tolling, they qualify under the *reliance* exception, not the *medical leave* exception.
  *   If those petitioners are arguing simply that "medical leave should count" without evidence of administrative error, their petitions should be **denied** consistent with the *expressio unius* principle.

  This allows us to validate the "textualist" concern for the future while resolving the immediate injustice. It acknowledges that the "silence was deliberate" argument is legally sound regarding the *Handbook*, but legally insufficient to override the *Dean's representation* in this specific instance.

  **VI. FORWARD-LOOKING ACTION**

  Finally, I move that the Committee formally recommend a Handbook amendment to the Faculty Senate to explicitly include "Medical Leave" in the list of tolling provisions. The current ambiguity serves no one. It forces this Committee into the role of quasi-legislators and puts students at risk of conflicting guidance. We should fix the rule prospectively so that we never have to adjudicate this specific conflict again.

  **VII. CONCLUSION**

  We are tasked with upholding standards. Sometimes, upholding a standard means enforcing the text. Sometimes, it means enforcing the integrity of the administration that supports that text. In this case, the latter requires us to grant the extension, but the former requires us to limit the precedent strictly to cases of documented administrative reliance. This preserves the bright-line rule for the future while preventing a current student from bearing the cost of our own procedural ambiguity.

  I look forward to discussing this framework on Thursday.
