answer: |-
  Here is a concrete example of a moral trade that satisfies the formal conditions of acceptability but violates our moral intuition, followed by an analysis of the distinguishing feature and the principle it reveals.

  ### The Example: The "Sincere Apology" Contract

  **The Scenario:**
  Imagine two friends, **Elena** and **Marcus**. Marcus has publicly embarrassed Elena at a dinner party.
  *   **Elena's Values:** She believes that friendship requires accountability. She values a *genuine* apology (one stemming from actual remorse) more than any material compensation. However, she is currently in severe financial distress.
  *   **Marcus's Values:** He believes friendship requires harmony. He feels no genuine remorse (he thinks he was right), but he values Elena's friendship and wants the conflict resolved. He is wealthy and indifferent to the cost of money.

  **The Trade:**
  Marcus offers to pay off Elena's entire debt ($50,000). In exchange, Elena agrees to accept a "contractual apology" from Marcus. They both explicitly agree that Marcus will recite the words of an apology without feeling any remorse, and Elena will formally accept these words as sufficient to restore their standing, despite knowing he does not mean them.

  **Formal Conditions Check:**
  1.  **Voluntary:** Both enter the deal freely; no coercion is involved.
  2.  **Non-Deceptive:** There is no fraud between the traders. Both know the apology is insincere and that the money is a buyout.
  3.  **Harms No Third Party:** The embarrassment happened in the past. Assume the resolution is private, so no other friends are misled or affected by the insincerity.
  4.  **Mutually Beneficial (Ex Ante):** Elena is financially saved (which she values highly). Marcus restores the friendship without having to cultivate genuine remorse (which he finds difficult or unnecessary). By their own antecedent lights, both are better off.

  **The Intuition:**
  Despite meeting all formal criteria, most people would judge this arrangement as objectionable. It feels like a corruption of friendship, a form of moral bribery, or a debasement of the apology itself. It turns a moral repair mechanism into a market transaction.

  ***

  ### The Distinguishing Feature

  The feature that distinguishes this case from the standard Vegetarian/Pro-Life trade is **the relationship between the action's value and the agent's motive.**

  In the **Vegetarian/Pro-Life case**, the moral value of the actions is **consequentialist and external**.
  *   When the vegetarian eats meat, the moral "cost" is the suffering of the animal. This cost exists regardless of *why* the vegetarian eats the meat (whether for pleasure, hunger, or to save a fetus).
  *   When the pro-lifer stops protesting, the moral "gain" (for the vegetarian) is the reduction of harassment. This gain exists regardless of the pro-lifer's motive.
  *   The trade works because the *outcomes* are fungible, even if the *reasons* differ. The vegetarian does not need to *believe* eating meat is good to perform the action; the action's moral weight is carried by its consequences, not its intent.

  In the **Sincere Apology case**, the moral value of the action is **constitutive and internal**.
  *   An apology is not merely the utterance of specific words; conceptually, an apology *is* an expression of remorse.
  *   If the motive (remorse) is removed and replaced by a different motive (financial settlement), the action ceases to be an "apology" in the moral sense and becomes a "performance."
  *   By trading for the *behavior* without the *motive*, the agents are not trading a moral good; they are trading a simulacrum. The value of the good (reconciliation through accountability) is destroyed by the very mechanism of the trade (payment), even if the agents claim to prefer the payment.

  ***

  ### The General Principle

  This distinction points to the **Motive-Integrity Constraint**:

  > **Moral trade is legitimate only when the moral worth of the traded actions is independent of the agent's specific moral motives. Moral trade is illegitimate when the value of the action is *constitutively dependent* on a motive (such as sincerity, duty, or love) that the trade displaces.**

  **Application of the Principle:**
  *   **Legitimate Trade (Vegetarian/Pro-Life):** Dietary choices and protest behaviors are *instrumental* goods. Their value lies in what they *cause* (less suffering, less harassment). You can change the cause (the trade) without changing the nature of the act.
  *   **Illegitimate Trade (Apology Contract):** Apologies, testimony, voting, and friendship rituals are *expressive* goods. Their value lies in what they *signify* about the agent's internal state. Introducing a market motive (payment/reciprocity) "crowds out" the requisite moral motive (remorse/truth/loyalty), thereby annihilating the value of the good being traded.

  This explains why we feel the Apology Contract is bribery or commodification: it treats an expressive good (which belongs to the sphere of social/moral norms) as if it were an instrumental good (which belongs to the sphere of market norms). The Vegetarian/Pro-Life trade remains within the sphere of instrumental negotiation; the Apology Contract crosses a boundary that corrupts the practice itself.
