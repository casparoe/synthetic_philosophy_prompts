answer: |-
  You are absolutely right to trust your intuition here. This is not a factual disagreement. You both agree on the physics of what happened (she researched and outlined; you phrased and finalized). You disagree on the *ontology* of the word "wrote."

  This is a classic **verbal dispute** masking a **normative disagreement**.

  In the rationalist/ACX sphere, this is often discussed as "arguing about the definition of a word rather than the state of the world." But it goes deeper than just semantics. Here is what is actually going on beneath the surface.

  ### 1. The "Architect vs. Builder" Conflict
  You are operating under two different, equally valid models of creative labor, and this is the first time those models have collided.

  *   **Your Friend's Model (The Architect):** To her, the "work" is the intellectual heavy lifting. The value lies in the research, the selection of facts, the structure of the round, and the determination of the correct answers. The phrasing is merely the packaging. In her mind, if she handed you a blueprint, she built the house; you just poured the concrete.
  *   **Your Model (The Craftsman):** To you, the "work" is the specific articulation. In trivia, nuance is everything. A poorly phrased question can be ambiguous or give away the answer. You view the outline as raw materials and the final text as the actual product. In your mind, she bought the lumber; you built the house.

  For the previous 50 rounds, these roles were **coupled**. The person who did the research also did the phrasing. The rule worked because the boundary was never tested. This round **decoupled** the roles, revealing that your shared rule ("whoever wrote it") was actually ambiguous all along. It didn't have a "secret meaning"; it just lacked a definition for edge cases.

  ### 2. The Screenwriters Guild Problem
  This specific disagreement is so common in creative industries that unions have literally invented new categories to solve it. In Hollywood, you can get a "Story By" credit (the outline/concept) and a "Screenplay By" credit (the dialogue/scenes).

  Your friend is claiming "Story By." You are claiming "Screenplay By." The problem is that your trivia night's "union contract" (the prize rule) only has one category: "Written By."

  ### 3. Credit vs. Cash (The Real Stakes)
  You mentioned the money is trivial ($40). If it were just about the $20, one of you would have shrugged and let the other have it. The fact that you are both digging in suggests this is about **recognition**, not liquidity.

  *   **For her:** Admitting she didn't "write" it feels like erasing her two hours of research. It implies her labor was just "prep work" rather than "creation."
  *   **For you:** Admitting she "wrote" it feels like erasing your contribution to the voice and flow of the game. It implies you were just a scribe.

  This is why it feels like it could blow up a comment section. It's a debate about how we assign moral value to different kinds of cognitive labor. Is the idea the thing, or is the expression the thing?

  ### 4. Why It Feels Like a "Fact" Disagreement
  Both of you are insisting, *"Same rule as always."* This is the psychological trap. You are both trying to retroactively apply a precedent to a situation the precedent wasn't designed to cover.

  *   She thinks: "In the past, the person who did the research got the credit. I did the research. Therefore, I get the credit."
  *   You think: "In the past, the person who typed the final questions got the credit. I typed the final questions. Therefore, I get the credit."

  Since the tasks were previously bundled, you both have historical evidence to support your interpretation. Neither of you is lying about the past; you are just weighting different variables of the past tasks.

  ### How to Resolve It
  Since there is no "fact" to discover, you cannot solve this by digging deeper into the history. You have to negotiate the norm.

  1.  **Acknowledge the Ambiguity:** The most productive thing you can say is, *"I think we've discovered that our rule didn't actually cover this scenario. We both did essential work that, in the past, was done by one person."*
  2.  **Split the Round (Literally):** Since the prize is for the round, and you both contributed essential, distinct labor to this specific round, the most accurate reflection of reality is to split the prize for *this* round 50/50. This validates both the "Architect" and the "Builder" labor.
  3.  **Update the Contract:** For future rounds, decide how you want to handle split labor. Will you allow co-authorship on rounds? Or will you re-establish that "writing" means final text, and research is considered "hosting labor" (which is shared anyway)?

  **The Verdict:**
  There is no secret fact you are missing. The rule was underspecified. You are having a philosophical debate about the nature of authorship disguised as a billing dispute. Split the $20, buy yourselves a drink, and update your bylaws.
