      *   *Let's go with:* **The locus of control.** CDT says you control your muscle movements. The Engineer says you control your *algorithm*, and Death predicts the algorithm.

  4.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the quality of the argument. It's a classic debate.
      *   **Move-by-Move Analysis:**
