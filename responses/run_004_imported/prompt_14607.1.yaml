answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name], Marion's niece/nephew.

  Standing here, looking around this room, I realize I have a unique challenge. On one side, I see my family—the people who know Aunt Marion as the relative who brings excellent wine to Thanksgiving and occasionally mentions, offhand, that she'll be missing Christmas because she's serving a weekend sentence in county jail.

  On the other side, I see her colleagues, her co-counsel, and her friends from the movement. You know her as the lawyer who spent 38 years in the trenches of civil disobedience. You know the case law. You know the theory. And yes, you know the debates.

  For as long as I can remember, Marion has had one specific lesson she tried to teach me over holiday dinners. While everyone else was passing the gravy, she was explaining the moral architecture of civil disobedience. She taught me that for a protest to be truly ethical, accepting the punishment isn't just the *price* you pay for breaking the law. It's the *point*.

  To the family: I think we always heard that as her being incredibly stubborn. But to the lawyers and philosophers in the room: she was talking about fidelity to the rule of law. She believed that by willingly going to jail, you prove you aren't above the system; you're asking the system to be better. It's a Rawlsian ideal, and she held it like a religious text. She was famously, sometimes frustratingly, hardcore about it. We all heard the stories about her rolling her eyes at plea deals. To Marion, a reduced sentence wasn't a victory; it was a missed opportunity to make a statement.

  But... we also all know that Marion is not a philosophy textbook. She is a human being.

  And there is a story that some of you in this room know well. A few years back, in a case where the stakes were terrifyingly high, Marion did something that surprised everyone. She pushed her client to take a deal. She argued for the lesser sentence. She chose to keep a person out of prison rather than keep a philosophical point intact.

  I know that decision caused tension. I know it sparked arguments in offices and over coffee that I wasn't privy to. But standing here tonight, looking at her career as a whole, I don't see that moment as a contradiction. I see it as the moment her theory grew up.

  Marion spent 38 years teaching us that the law matters. But in that courtroom, she taught us something else: that *people* matter more. She realized that sometimes, the ultimate act of respecting the system is knowing when to spare someone from being crushed by it. She didn't abandon her principles that day; she weighed them against a human life, and she chose the human.

  That is the tension that defines her career. It's the balance between the ideal and the real. Between the abstract concept of Justice with a capital J, and the actual person sitting in the defendant's chair who needs to go home to their kids.

  To the activists: She gave you the fight, the theory, and the unyielding pressure on the state.
  To the family: She gave us the stories, the integrity, and the example that you have to stand for something, even if it's uncomfortable.

  And to Marion: You taught me that principles are important, but compassion is essential. You spent nearly four decades worrying about everyone else's freedom, everyone else's sentences, and everyone else's rights. You worried about whether the punishment fit the crime, and whether the crime was actually a virtue.

  Now, the docket is clear. The gavel is down. You don't have to make the hard call anymore. You don't have to choose between the theory and the person. You can just rest.

  So, if everyone could please raise a glass.

  To Aunt Marion. May your retirement be long, may your peace be quiet, and may the only sentences you have to worry about from now on be the ones you read in a good book.

  To Marion.
