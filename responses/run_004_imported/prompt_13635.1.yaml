prompt: |-
  I teach decision theory in my university's philosophy department and serve, as the resident philosopher, on my affiliated hospital's Clinical AI Governance Committee. I've been asked to draft the memo the committee will vote on next week, covering the rollout protocol for a new deterioration-risk algorithm that currently reports a single calibrated probability of decline within twelve hours against a fixed alert threshold. Our data science lead wants to replace this point estimate with an imprecise probability — a range reflecting genuine uncertainty for patients whose vitals are sparse or atypical, rather than a false precision the data don't support — but the committee is split on what to do when a patient's range straddles the threshold. One natural decision rule (act on whatever maximizes expected benefit for at least one distribution in the range) and another (act on whatever does best in the worst case) can recommend different things for the same patient, or fail to settle on a single recommendation at all. Some members are also unsettled that ordering a confirmatory test can sometimes widen a patient's range rather than narrow it — a documented feature of reasoning under this kind of uncertainty known as dilation, not a bug, though they want to know whether it undermines the whole approach. Nursing leadership, meanwhile, warns that any recommendation this indecisive will simply be ignored at the bedside. Draft the memo: recommend a point estimate or a range, specify the decision rule and escalation protocol that should govern borderline cases, set an implementation timeline, and give the actionability worry its due rather than dismissing it as mere unfamiliarity with the new format.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** University Philosophy Professor (Decision Theory specialist) & Resident Philosopher on Clinical AI Governance Committee.
      *   **Task:** Draft a memo for the committee to vote on regarding the rollout of a new deterioration-risk algorithm.
      *   **Current State:** Algorithm reports a single calibrated probability (point estimate) of decline within 12 hours against a fixed threshold.
      *   **Proposed Change:** Data Science Lead wants to switch to *imprecise probability* (a range reflecting uncertainty, especially for sparse/atypical data).
      *   **Key Conflict:** Committee is split on how to handle cases where the range *straddles* the alert threshold.
      *   **Decision Rules in Tension:**
          *   *MaxiMax/Optimism:* Act if *any* distribution in the range suggests benefit (alert if upper bound > threshold).
          *   *MaxiMin/Conservatism:* Act only if *worst-case* suggests benefit (alert if lower bound > threshold).
          *   *E-admissibility/Indecision:* Sometimes neither rule settles on a single recommendation.
      *   **Technical Concern:** *Dilation* (ordering a confirmatory test might widen the range, not narrow it). Members worry this undermines the approach.
      *   **Practical Concern:** Nursing leadership warns that indecisive recommendations (ranges) will be ignored at the bedside (actionability worry).
      *   **Requirements:**
          *   Recommend point estimate vs. range.
          *   Specify decision rule & escalation protocol for borderline cases.
          *   Set implementation timeline.
          *   Address the actionability worry seriously (don't dismiss it).
          *   Address the dilation concern.
          *   Tone: Professional, philosophical rigor applied to clinical governance, persuasive but balanced.

  2.  **Determine the Stance/Recommendation:**
      *   *Point Estimate vs. Range:* As a decision theorist, I know imprecise probability is epistemically more honest when data is sparse. However, clinical actionability is paramount. A pure range might cause paralysis. *Decision:* Recommend a hybrid approach. Display the range for transparency, but map it to a specific action recommendation based on a defined rule.
      *   *Decision Rule:*
          *   If Lower Bound > Threshold: Alert (High Confidence).
          *   If Upper Bound < Threshold: No Alert (High Confidence).
          *   If Straddling (Lower < Threshold < Upper): This is the danger zone.
          *   *Choice:* In clinical safety contexts, *MaxiMin* (worst-case) is usually too conservative (alert fatigue), but *MaxiMax* (best-case) is dangerous (false alarms). However, for *deterioration*, missing a decline is costlier than a false alarm. Therefore, if the *upper bound* exceeds the threshold significantly, we should prompt for *verification*, not necessarily full code blue.
          *   *Refined Rule:* Use the range to trigger *tiered escalation*.
              *   Range entirely above: Immediate Intervention.
              *   Range straddling: "Watch/Verify" status (nurse check, maybe repeat vitals).
              *   Range entirely below: Routine.
      *   *Dilation:* Need to explain this is a feature of honest uncertainty, not a bug. It means the test reveals the data is less informative than thought. Protocol: If dilation occurs, revert to clinical judgment + standard monitoring, do not rely on the score.
      *   *Actionability:* Acknowledge nursing's concern. A range is cognitively heavier. The UI must simplify the output (e.g., "Risk: High/Uncertain/Low") while keeping the data available for auditors.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Background:** Briefly recap the shift from point estimate to imprecise probability.
      *   **Epistemic Honesty vs. Clinical Utility:** Address the core tension. Acknowledge the Data Science Lead's point (false precision is dangerous) and Nursing's point (indecision is dangerous).
      *   **Decision Rule & Escalation:**
          *   Define the Threshold (T).
          *   Define the Interval $[L, U]$.
          *   Protocol:
              1.  $L > T$: **Alert** (Standard Protocol).
              2.  $U < T$: **No Alert** (Routine).
              3.  $L \le T \le U$ (Straddling): **Advisory** (Human-in-the-loop). Do not auto-page. Prompt bedside verification.
      *   **Addressing Dilation:** Explain it simply. It means "this test makes us realize we know less than we thought." Protocol: Treat dilated cases as "Uncertain" (same as straddling). Do not order more tests *just* to narrow the range if the model predicts dilation.
      *   **Addressing Actionability (Nursing):** This is crucial. Don't say "they need training." Say "the interface must bridge the gap." Recommend a "Traffic Light" UI system derived from the interval logic.
      *   **Timeline:** Phased rollout. Pilot -> Feedback -> Full.
      *   **Conclusion:** Call for vote.

  4.  **Refining the Tone:**
      *   Needs to sound like a philosopher who understands hospitals. Use terms like "epistemic humility," "decision rules," "expected utility," but ground them in "patient safety," "alert fatigue," and "workflow."
      *   Avoid being too abstract. The committee needs to vote on *policy*, not theory.
      *   Ensure the "Dilation" explanation is clear. It's counter-intuitive that more info = more uncertainty. I need to frame it as "model recognizing its own limitations."

  5.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the decision rule too complex?
      *   *Fix:* Simplify the straddling protocol. Make it a "Verify" step, not a "Treat" step. This balances the risk of false positives (MaxiMax) and false negatives (MaxiMin).
      *   *Critique:* Did I address the nursing concern enough?
      *   *Fix:* Add a specific recommendation on UI/UX design. The memo should mandate that the *output* to nurses is actionable, even if the *backend* is imprecise.
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* 3-month pilot is standard for AI in health.

  6.  **Final Polish:** Check against all constraints in the prompt.
      *   Recommend point vs. range? Yes (Range with mapped action).
      *   Specify decision rule? Yes (Tiered based on bounds).
      *   Escalation protocol? Yes (Verify for straddling).
      *   Timeline? Yes.
      *   Actionability worry? Yes (UI design & training).
      *   Dilation? Yes (Explained as feature, protocol set).

  7.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Clinical AI Governance Committee
  **FROM:** [Your Name], PhD, Department of Philosophy & Resident Philosopher, AI Governance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Rollout Protocol for Imprecise Probability Deterioration Algorithm

  ### Executive Summary

  This memo recommends the approval of the Data Science Lead's proposal to transition the deterioration-risk algorithm from a single point estimate to an **imprecise probability range**. However, to address clinical actionability concerns raised by Nursing Leadership and the Committee, this recommendation is conditional on the implementation of a **tiered decision rule** that maps these ranges to specific clinical workflows, rather than displaying raw intervals to bedside providers.

  We propose a "Traffic Light" escalation protocol: **Red** (Lower bound > threshold), **Yellow** (Range straddles threshold), and **Green** (Upper bound < threshold). This approach preserves epistemic honesty regarding data sparsity without offloading the burden of decision-theoretic interpretation onto nursing staff.

  ### 1. Epistemic Honesty vs. Clinical Actionability

  The current system reports a single calibrated probability (e.g., "15% risk"). The Data Science Lead correctly identifies that for patients with sparse or atypical vitals, this precision is spurious. A point estimate implies a confidence the data does not support. Transitioning to imprecise probabilities (e.g., "5% to 25% risk") acknowledges **epistemic uncertainty**.

  However, Nursing Leadership raises a valid pragmatic objection: **indecision at the bedside is dangerous.** If an algorithm reports a range straddling the alert threshold, and no clear action is prescribed, the tool risks being ignored. This is not merely a training issue; it is a cognitive load issue. In high-stakes environments, providers require clear affordances.

  Therefore, we must not simply replace a false precision with a confusing ambiguity. We must replace a false precision with a **structured decision protocol**.

  ### 2. Recommended Decision Rule and Escalation Protocol

  Let $T$ be the established risk threshold for intervention (e.g., 20%).
  Let $[L, U]$ be the reported risk interval (Lower bound, Upper bound).

  We reject both the *MaxiMax* rule (alert if $U > T$) and the *MaxiMin* rule (alert only if $L > T$) as standalone policies for straddling cases. The former risks excessive alert fatigue; the latter risks missing deterioration. Instead, we adopt a **Triaged E-Admissibility Protocol**:

  *   **Tier 1 (High Confidence Risk): $L > T$**
      *   **System Action:** Trigger standard Rapid Response Team (RRT) alert.
      *   **Rationale:** Even in the worst-case distribution within our uncertainty set, the patient is at risk. Safety dictates intervention.
  *   **Tier 2 (High Confidence Safety): $U < T$**
      *   **System Action:** No alert. Log for audit.
      *   **Rationale:** Even in the best-case distribution, risk is below threshold.
  *   **Tier 3 (Epistemic Uncertainty): $L \le T \le U$ (Straddling)**
      *   **System Action:** **"Verify" Advisory.** Do not page RRT automatically. Instead, flag the patient on the nursing dashboard for a **mandatory bedside vitals check** within 30 minutes.
      *   **Rationale:** The model cannot decide. The human must. This converts algorithmic indecision into a low-cost, high-value clinical task (verification) rather than a high-cost intervention (RRT) or inaction.

  ### 3. Addressing Dilation

  Committee members have expressed concern regarding **dilation**: the phenomenon where ordering a confirmatory test (e.g., a specific lab work) widens the risk interval rather than narrowing it.

  *   **Clarification:** This is not a bug. It indicates that the new data reveals the patient's profile is more atypical than the model initially assumed, increasing the set of plausible probability distributions. It is a feature of honest uncertainty modeling.
  *   **Protocol:** If a confirmatory test results in dilation that moves a patient from Tier 1 or 2 into Tier 3, the system must **not** penalize the provider for the "loss of precision." The status should update to "Verify." We must explicitly document in the rollout training that *increased uncertainty is a valid safety signal*, prompting closer human monitoring rather than algorithmic confidence.

  ### 4. Actionability and User Interface (UI) Mandates

  To address Nursing Leadership's concern that ranges will be ignored, the IT implementation team is mandated to hide the raw numerical interval from the primary bedside view.

  *   **UI Requirement:** The nurse sees a status indicator (Red/Yellow/Green) and a plain-language directive (e.g., "Initiate RRT," "Check Vitals Now," "Routine").
  *   **Transparency:** The raw interval $[L, U]$ must be available in the "click-through" details for physicians or auditors investigating the logic, but it must not be the primary cognitive burden for the nurse.
  *   **Training:** Simulation training must specifically cover "Yellow" (Straddling) cases. Staff must understand that a "Verify" flag is not a "broken" alert, but a request for human data gathering to resolve uncertainty.

  ### 5. Implementation Timeline

  *   **Phase 1 (Weeks 1-4):** **Silent Pilot.** Run the new imprecise algorithm in parallel with the legacy point-estimate system. No alerts shown to staff. Compare outcomes and measure the frequency of "Straddling" cases.
  *   **Phase 2 (Weeks 5-12):** **Targeted Rollout.** Activate the Triaged Protocol on two medical-surgical floors. Gather qualitative feedback from nursing on the "Verify" workflow.
  *   **Phase 3 (Week 13+):** **Full Deployment.** Hospital-wide rollout, contingent on Phase 2 showing no increase in adverse events due to alert hesitation.

  ### 6. Recommendation for Vote

  I move that the Committee approves the transition to the imprecise probability model, contingent on the adoption of the **Triaged E-Admissibility Protocol** and the **UI Mandates** described above.

  This approach respects the data science requirement for epistemic humility while honoring the nursing requirement for actionable clarity. It treats uncertainty not as a failure of the model, but as a specific clinical state requiring human verification.

  **Attachments:**
  *   *Technical Appendix: Mathematical Definition of Dilation in this Context*
  *   *Draft UI Mockups for Tiered Alert System*

  Respectfully submitted,

  [Your Name]
  Resident Philosopher, Clinical AI Governance Committee
