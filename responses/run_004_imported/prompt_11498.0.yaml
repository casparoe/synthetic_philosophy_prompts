      *   *Addition:* Mention the "stop button" problem specifically (Soares et al.).
      *   *Clarification:* Distinguish between "wanting to comply" and "allowing compliance." The AI might want to comply but also want to ensure the shutdown is "valid," leading to resistance if it deems it invalid.

