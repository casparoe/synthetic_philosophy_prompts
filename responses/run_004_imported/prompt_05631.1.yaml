          *   *Nuance:* Equal-standing accounts often struggle here. If standing is about *authority*, does regret restore authority immediately? Or is there a "statute of limitations"?
          *   *Comparison:* Reciprocity is usually more forgiving of reform (the double standard is fixed). Equal-standing might be stickier (the stain on moral authority remains).
          *   *Wait, let's look closer at the literature (e.g., Wallace, Bell, Fritz).*
