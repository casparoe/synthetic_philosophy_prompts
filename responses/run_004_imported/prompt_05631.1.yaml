answer: |-
  The problem of hypocritical blame concerns the "standing" to blame: the normative authority required to legitimately hold another person accountable. While a hypocrite's target may be genuinely guilty of a moral violation, the hypocrite often seems unable to legitimately issue that blame. To understand why, we must distinguish between two prominent explanations: the reciprocity-based account and the equal-standing account. By analyzing where each locates the defect in hypocritical blame and testing them against the case of the "reformed hypocrite," we can determine which offers a more defensible theory of moral accountability.

  ### Locating the Wrong

  The fundamental difference between these accounts lies in whether they view the defect of hypocrisy as a matter of **fairness** or a matter of **status**.

  On the **reciprocity-based account**, the wrong is located in the **unfairness of the transaction**. Blame is understood as the enforcement of a normative demand. When an agent blames another, they implicitly demand that the target comply with a specific moral rule. The reciprocity account holds that one only has the right to make this demand if one is willing to bear the same burden. The hypocrite's defect is that they enforce a double standard: they claim the right to hold others to a rule from which they exempt themselves. The wrong is not necessarily in the hypocrite's character, but in the inequity of the interaction. It is unjust to burden another with a constraint one refuses to accept.

  On the **equal-standing account**, the wrong is located in the **falsification of moral authority**. Blame is viewed not merely as a demand, but as a communicative act between moral equals. To blame someone is to claim a specific moral status: the standing to speak for the moral community or the norm in question. The hypocrite's defect is that their own conduct undermines this claim to parity. By violating the norm they are enforcing, they implicitly place themselves outside the community of those entitled to enforce it, or they assert a moral superiority they do not possess. The wrong lies in the infelicity of the address; the hypocrite claims an authority their conduct has forfeited.

  ### The Test Case: The Reformed Hypocrite

  Consider the "reformed hypocrite": an agent who previously committed the very offense they now condemn, but who has since ceased the behavior and sincerely regrets their past actions. Does this agent retain full standing, diminished standing, or none at all?

  **1. The Reciprocity Prediction: Full Standing**
  The reciprocity account predicts that the reformed hypocrite retains **full standing**.
  *   **Reasoning:** Since the defect of hypocrisy is the *current* enforcement of a double standard, the cessation of the offending behavior resolves the issue. If the agent no longer commits the offense, they are no longer exempting themselves from the demand they are making of others. The burden is now shared equally. The sincerity of their regret further cements their current commitment to the norm. Because the unfairness is eliminated, the transactional requirement for standing is satisfied. On this view, once the hypocrite reforms, the "debt" of fairness is paid, and they are as entitled to blame as a saint.

  **2. The Equal-Standing Prediction: Diminished (or Conditional) Standing**
  The equal-standing account predicts that the reformed hypocrite retains **diminished standing**, which may be restored only under specific conditions.
  *   **Reasoning:** On this view, standing is not just about current compliance, but about moral authority derived from one's relationship to the norm and the community. A history of violation tarnishes that authority. Even if the agent has reformed, their past conduct creates a presumption of self-righteousness or moral presumption. To blame without acknowledging one's own fallibility is to falsely claim a purity one does not have. Therefore, standing is not automatically restored by cessation alone. It is diminished because the agent's history complicates the claim to parity. Full standing is only regained if the act of blame is modified to acknowledge the shared struggle (e.g., "I have struggled with this too, and we should both do better"), thereby re-establishing moral equality.

  ### Evaluation: Which Account is More Defensible?

  The **equal-standing account** provides the more defensible verdict overall. While the reciprocity account offers a clear, binary metric for standing (compliant vs. non-compliant), it fails to capture the nuanced intuitions we hold regarding reformed agents.

  The primary weakness of the reciprocity account is that it cannot distinguish between a **humble reformer** and a **self-righteous reformer**. Imagine two reformed hypocrites: one who blames others while acknowledging their own past struggles, and another who blames others while acting as though they have never erred. Intuitively, the latter still lacks standing; their blame feels offensive and illegitimate, despite their current compliance. The reciprocity account cannot explain this, as both agents are currently upholding the norm and thus neither is enforcing a double standard.

  The equal-standing account, however, explains this distinction perfectly. It recognizes that standing is not merely a permit earned by compliance, but a relational status maintained through authentic communication. The self-righteous reformer lacks standing because they continue to falsify the moral parity between themselves and the target, effectively pretending their reform makes them superior. The humble reformer regains standing because their acknowledgment of past failure reaffirms the equality of the moral community.

  Furthermore, the equal-standing account better explains why we often feel uncomfortable when a reformed hypocrite blames *too* aggressively. Even if they aren't violating the norm now, their history suggests their motivation might be projection or self-exoneration rather than genuine moral concern. The reciprocity account, focused strictly on the fairness of the demand, ignores the motivational and relational context of the blame.

  In conclusion, while the reciprocity account correctly identifies that fairness is a component of blame, it reduces the practice to a contractual exchange. The equal-standing account offers a richer normative picture. By locating the wrong in the falsification of moral authority rather than mere inconsistency, it correctly predicts that reform does not automatically erase the loss of standing. Instead, it requires the reformed agent to engage in blame in a way that honors the shared fallibility of the moral community. This aligns best with our considered judgments about when blame is legitimate, making the equal-standing account the superior explanation.
