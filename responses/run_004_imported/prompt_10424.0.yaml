      *   *Critique:* Make sure Marcus doesn't sound just moralistic. He needs to cite *rationality*, not just morality. It's about what a rational agent does.
      *   *Check:* Did they address the "Rational Irrationality" point? Yes, Elena needs to explicitly claim that title. Marcus needs to attack the coherence of it.

  6.  **Drafting the Dialogue (Iterative Process):**

      *   *Scene:* ATM screen glowing. Dust on clothes. Driver idling nearby.
      *   *Elena:* "Look, the causal link is broken."
