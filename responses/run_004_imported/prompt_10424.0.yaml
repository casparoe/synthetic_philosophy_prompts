answer: |-
  The ATM hums, a sterile blue light in the heat haze. Dust coats their eyelashes. Ten yards away, the pickup truck idles, the driver watching them through the windshield.

  **Elena:** Don't do it, Marcus. Just take the cash and walk.

  **Marcus:** (Inserting his card) I'm paying him.

  **Elena:** Why? Look at the geometry of the situation. The causal lever is gone. He already drove us in. His prediction is a fossil. Whether my balance goes down or stays flat has zero impact on whether I'm standing here breathing. Paying is literally throwing away resources for no return. That's the definition of irrational.

  **Marcus:** It's not throwing it away. It's settling a debt incurred by your own nature.

  **Elena:** My nature got me the ride. That was the purchase. I bought safety with the *disposition* to pay. I didn't buy it with the actual dollars. Parfit called it: it is rational to be disposed to pay, but irrational to actually pay once you're safe. I'm happy to bite that bullet. Call it "rational irrationality." I cultivated the look of a payer to survive the desert. Now that I'm alive, I revert to the baseline of a rational actor. And a rational actor doesn't pay for sunk costs.

  **Marcus:** That split is a cop-out, Elena. You're treating yourself like a series of disconnected time-slices. "Desert Me" made a promise so "Town Me" could exist. But "Town Me" is just the continuation of "Desert Me." If the act doesn't flow from the disposition, the disposition was a lie.

  **Elena:** It wasn't a lie! It was a strategy. And it worked! I'm here. If I pay, I'm rewarding a causal magic trick. He didn't save me because I *would* pay; he saved me because he *thought* I would. He was wrong. Why should I subsidize his error?

  **Marcus:** Because if you don't pay, you prove that "Desert Me" was incapable of rational action. You're saying the version of you that made the commitment was deluded. If the act is irrational, then the disposition that necessitated it was flawed. You can't claim the rationality of the disposition while rejecting the rationality of the act. The act inherits the rationality of the source.

  **Elena:** No, the act inherits the *context* of the moment. In the desert, paying was the price of entry. Here, it's a donation. You're conflating the logic of the threat with the logic of the aftermath. Look, if I press "Cancel," I keep $500. If I press "Confirm," I lose $500. The world state is identical either way—driver's prediction is already locked in. Why are you worshipping consistency over utility?

  **Marcus:** Because utility isn't just about the cash in your pocket right now. It's about being an agent whose decisions bind across time. If you sever the link between your past commitments and your present actions, you aren't a person anymore; you're a series of opportunistic snapshots. You're saying it's rational to be the *kind of person* who pays, but irrational to *be* that person when the bill comes. That's not rationality. That's schizophrenia.

  **Elena:** It's not schizophrenia, it's optimization! It's acknowledging that sometimes the best way to win a game is to trick the other player into thinking you'll play by rules you intend to break once you're ahead. The driver knew the odds. He gambled on my character. He lost.

  **Marcus:** He didn't lose. He's watching us. Right now. If you walk away, you didn't beat him. You beat yourself. You proved you aren't the person who gets picked up. You just got lucky he misread you this once. But next time? Next time you're in the desert, you won't be able to signal that disposition genuinely, because you'll know you're a defector. You've burned your own future credibility to save five hundred bucks today.

  **Elena:** (Laughs, a dry, cracked sound) Future credibility? Marcus, I almost died six hours ago. I'm not betting my survival on the hope that I'll get stranded in the exact same spot with the exact same mind-reading driver. That's not a strategy; that's a superstition. I'm taking the win.

  **Marcus:** You're taking the money. You're losing the win. The win was surviving *as the person who deserved to survive*.

  **Elena:** Deserved? This isn't theology. It's game theory. And in this game, the payoff matrix says "Defect."

  **Marcus:** The payoff matrix includes your integrity as a variable. If you value your own agency, you pay. Because if you can't trust your future self to honor your past self's deals, you can't make any deals at all. Not with him, not with anyone.

  **Elena:** Then I'll make better deals. Ones with escrow. Ones with contracts. Not psychic handshakes with strangers in the dust.

  Marcus hits "Enter." The machine whirs. He pulls out the bills.

  **Elena:** You're paying him for a service he already rendered based on a false premise.

  **Marcus:** I'm paying him because the premise wasn't false. I'm the proof.

  **Elena:** (Shaking her head, turning to the machine) You're paying for peace of mind. I'm keeping the cash.

  **Elena** hits "Cancel." She pockets her card. She looks at the driver, then at Marcus.

  **Elena:** See? I'm still here. And I'm richer.

  **Marcus:** (Walking toward the truck) For now. But you're stranded, Elena. You just don't know it yet.

  He hands the money to the driver. Elena watches from the ATM, the dust settling on her shoulders, rich and alive and utterly alone in the logic of her own making.
