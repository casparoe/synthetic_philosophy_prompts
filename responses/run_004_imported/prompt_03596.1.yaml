  2.  **Deconstruct Hume's Argument ("Of Money"):**
      *   *Premise 1 (Long Run):* Money is a veil. If you double the money supply, prices double. Real variables (output, employment) stay the same. This is the "neutrality" claim.
      *   *Premise 2 (Short Run/Transition):* Money enters the economy at specific points, not everywhere at once. It circulates gradually.
      *   *Mechanism:* New money $\rightarrow$ Specific recipients have more cash $\rightarrow$ They spend it $\rightarrow$ Demand for specific goods rises $\rightarrow$ Producers see higher demand/prices *before* their costs (wages/input prices) rise $\rightarrow$ Producers increase output/employment to capture profit $\rightarrow$ Money spreads further $\rightarrow$ Eventually, all prices (including wages) rise $\rightarrow$ Real gains vanish.
      *   *Key Insight:* It's about *relative* prices and profit margins during the transition, not just the aggregate price level.

  3.  **Address Question 1: Consistency:**
      *   Is it contradictory? No. It's a distinction between equilibrium states (long run) and the disequilibrium adjustment process (short run).
      *   Analogy: Dropping dye in water. Eventually, it's all one color (neutrality). But while it's swirling, there are patterns and currents (real effects).
      *   Hume is consistent because he explicitly limits the neutrality claim to the final state ("at last reaches a just proportion") and the real effects claim to the "interval."

  4.  **Address Question 2: The Mechanism (Step-by-Step):**
      *   *Step 1: Injection.* New gold/silver enters via specific channels (e.g., exporters, miners, government spending).
      *   *Step 2: Asymmetric Information/Price Stickiness.* Recipients spend. Sellers of those specific goods see demand rise. They raise prices *or* just sell more. Crucially, input costs (especially wages) haven't risen yet because the money hasn't reached the workers/suppliers.
      *   *Step 3: Profit Margin Expansion.* Revenue up, costs stable = higher profits.
      *   *Step 4: Incentive to Produce.* Merchants/manufacturers see "a demand for their commodities." They hire more workers, run machines longer. "Industry" is stimulated.
      *   *Step 5: Circulation.* The new money pays the workers, who then spend it.
      *   *Step 6: General Price Rise.* Eventually, the money permeates everywhere. Wages rise. Input costs rise. Profit margins return to normal.
      *   *Step 7: Neutrality Restored.* Prices are higher, but output/employment return to natural levels.

  5.  **Address Question 3: Historians' View:**
      *   *Consensus:* It is widely regarded as a profound anticipation of modern monetary theory (Keynesian transmission mechanisms, Lucas islands, sticky prices).
      *   *Key Figures:* Milton Friedman admired Hume on this. Jacob Viner, Douglass North, and modern scholars like Humphrey or Rotwein emphasize this.
      *   *Nuance:* Some argue Hume didn't have a formal model of "sticky wages," but he observed the *phenomenon* accurately. It's not a "loose aside"; it's the core of his policy relevance. He uses it to argue against hoarding and for the benefits of a growing money supply (in a growing economy).
      *   *Distinction:* Hume isn't saying inflation is *good* permanently, but that a *growing* money supply keeps the economy in that "happy interval."

