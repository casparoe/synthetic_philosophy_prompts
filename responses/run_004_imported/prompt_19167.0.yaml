answer: |-
  1. **The Ship of Theseus and the SCQ**
      My novel centers on a family restoring a sailboat over three generations until no original timber remains. In common parlance, we ask: is it the same boat? But under your view, there strictly speaking is no boat to begin with. If there are only "particles arranged boat-wise," does the Ship of Theseus paradox dissolve for you, or does it simply relocate? If it relocates, where does the problem of identity live if not in the object itself?

  2. **The Argument from Vagueness**
      Ted Sider and David Lewis have argued that any restricted answer to the Special Composition Question forces a dilemma: either there are sharp, magical cutoffs where composition suddenly begins, or composition is vague. If composition is vague, they argue, *existence* itself becomes vague, which many find absurd. You avoid universalism, so how do you escape this argument? Specifically, how does accepting that composition is restricted to "life" avoid collapsing into the claim that existence is indeterminate?
      *   **Follow-up:** You'll likely reply that biological life is a determinate fact, not a vague one. But biologists often point to borderline cases—viruses, prions, or the exact moment of conception—as inherently fuzzy. If the *criteria* for "life" are biologically vague, doesn't your metaphysical determinacy just rest on a scientific stipulation that nature doesn't actually support?

  3. **Causal Unity vs. Arbitrary Sums**
      You argue that particles compose an object when their activity constitutes a life. The intuition seems to be that living things have a causal unity that heaps of sand or collections of planks lack. But a well-built sailboat also exhibits significant causal unity; the planks work together to keep water out and maintain structural integrity. Why is the causal unity of a metabolism metaphysically privileged over the causal unity of a hull?

  4. **The Metaphysics of Death**
      I want to press on the temporal boundaries of these objects. On your view, when an organism dies, the particles that were caught up in a life cease to compose a further thing. Metaphysically, what happens at that precise instant? Does the object literally go out of existence, or does it transform into something else? If it goes out of existence, are we committed to saying that death is a kind of ontological annihilation rather than a change of state?
      *   **Follow-up:** I anticipate you'll say the *organism* ceases, but the particles remain arranged "corpse-wise." But if the particles are numerically identical before and after, and the arrangement is largely continuous, isn't positing a total cessation of the object an ontologically expensive way to describe what looks like a simple loss of function? Why multiply *events* of annihilation just to save a theory of composition?

  5. **The "Arranged X-Wise" Paraphrase**
      To save ordinary discourse, you suggest we paraphrase talk of boats into talk of "particles arranged boat-wise." Critics worry this is a semantic sleight of hand—that the predicate "arranged boat-wise" secretly relies on the concept of a boat to define the arrangement, thereby reintroducing the very object you claim doesn't exist. Is there a way to define the arrangement without implicitly invoking the ontology you're trying to eliminate?
      *   **Follow-up:** Your likely defense is that we can define the arrangement purely in terms of spatial relations and physical properties without referencing "boats." But if a listener understands "arranged boat-wise" only by referencing their prior concept of a boat, doesn't the paraphrase fail to eliminate the ontological commitment for anyone actually using the language? Are we just hiding the commitment in the ideology rather than the ontology?

  6. **Human Persons as Organisms**
      If only living things exist, then human persons must be identical to human organisms. This seems to conflict with psychological accounts of personal identity, where *I* might survive where my biological organism does not (e.g., in certain thought experiments about brain transplants). Are you committed to saying that in those cases, the person simply dies, even if their psychology continues? How do you reconcile the biological criterion of composition with our psychological intuition about who we are?

  7. **Restoration and Continuity**
      Returning to my novel: the family replaces every plank. For a universalist, the boat persists as a sum of stages. For you, if there is no boat, there is only a succession of particle arrangements. But the *life* of the project seems to persist. Does your view allow for any sense in which the "restoration" is a single, continuous event, or is that, too, just a manner of speaking about a series of discrete particle interactions?

  8. **Symbiosis and Boundaries**
      Modern biology complicates the "life" criterion with symbiosis. We are composed of human cells and trillions of bacterial cells that have their own life cycles. Are we one organism or many? If the bacteria are caught up in *our* life, do they compose a part of us? If they are living their own lives, does your view imply that inside my skin there are thousands of distinct composite objects constantly moving and interacting? Where does one life end and another begin in a symbiotic system?

  9. **Falsifiability and Evidence**
      I'd like to close with a question about the resilience of your position. If a view can paraphrase away any counter-example—whether it's a boat, a chair, or a heap—it risks becoming unfalsifiable. Beyond a shift in linguistic intuition, what would actually count as *evidence* against organicism? Is there a metaphysical or empirical scenario you can envision that would force you to admit that some non-living things truly compose a further object, rather than just being particles arranged that way?
