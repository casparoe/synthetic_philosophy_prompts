  **MEMORANDUM**

  **TO:** Honor Council Members
  **FROM:** [Your Name], Student Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Panel Size and Voting Procedure for Expulsion Cases

  Following our recent seminar discussion on the Condorcet Jury Theorem (CJT) and the subsequent proposal to expand expulsion-case panels from three to seven members, I have evaluated the mathematical and procedural implications of this change. While the intuition behind the proposal—that more voters yield higher accuracy—is sound under specific conditions, the constraints of our actual deliberation process suggest a different approach.

  **Recommendation**
  I recommend we **retain the three-member panel size** for all cases, including those involving potential expulsion, but amend the bylaws to require a **unanimous vote** to recommend expulsion.

  **Reasoning**
  The proposal to expand to seven members relies on the Condorcet Jury Theorem, which proves that a majority vote among $n$ voters converges on the correct decision as $n$ increases, *provided* two strict conditions are met:
  1.  **Independence:** Voters decide independently (no deliberation/correlation).
  2.  **Competence:** Each voter is more likely than not to be correct ($p > 0.5$).

  Our current process violates the first condition: we deliberate openly, and as skeptics noted, votes often correlate with the chair's interpretation. More critically, in expulsion cases where evidence of intent is ambiguous, we cannot guarantee the second condition ($p > 0.5$). The CJT dictates that if average competence drops below 50%, adding voters *increases* the probability of an incorrect verdict toward certainty. In "hard cases," expanding the panel risks amplifying noise rather than signal.

  **Why Unanimity?**
  If we cannot mathematically justify expansion due to competence risks, we must address the gravity of expulsion through the voting threshold rather than panel size.
  *   **Due Process:** A unanimity requirement prioritizes the protection of the accused (minimizing false positives) over the efficiency of conviction. In high-stakes disciplinary contexts, this aligns with the Blackstone Ratio ("better that ten guilty persons escape than that one innocent suffer").
  *   **Deliberation Quality:** Unanimity forces robust discussion without relying on the flawed assumption that adding more deliberating bodies improves accuracy. It ensures that a single panelist's reasonable doubt ($p < 0.5$ for that specific voter) can prevent a life-altering sanction.

  **For Discussion**
  I invite the Council to consider the following at our next meeting:
  1.  Does the logistical burden of seven members outweigh the marginal epistemic gain, given our dependence on deliberation?
  2.  Will a unanimity rule create unacceptable gridlock, or does it properly reflect the burden of proof required for expulsion?
  3.  If we do expand, can we implement a *secret preliminary ballot* to satisfy the CJT's independence condition before deliberation begins?

  I believe retaining three members with a unanimity clause offers the most theoretically sound and procedurally just path forward.

  **Attachments:** Summary of Condorcet Jury Theorem limitations in correlated voting environments.
