      *   **Characters:** Priya (Camp 1: AAT as a normative/moral rule, convergence is expected) vs. Tomasz (Camp 2: AAT as theoretically interesting but practically inert due to violated preconditions).
      *   **Setting:** Two old friends from a rationalist meetup, having a running disagreement over a forecasting question (side bets involved).
      *   **Tone:** Intellectual, friendly but spirited, evenly matched, specific technical details (priors, common knowledge, dynamic vs. static), no clear winner.
      *   **Key Arguments to Include:**
