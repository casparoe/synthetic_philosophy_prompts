answer: |-
  The isolation chamber was white, soundproofed, and smelled faintly of ozone. Elias sat in the chair, the haptic crown humming against his temples. He wasn't supposed to feel the hum. That was first-order data—tactile input from the skin. The crown was designed to bypass that, to speak directly to the monitor.

  "Session four, subject Elias," Dr. Vane's voice came through the intercom, flat and disembodied. "We are shifting from Dispositional to Actualist protocol. Do you understand the risk?"

  "I understand," Elias said. His voice sounded thin. "Dispositional means the monitor only wakes up if I pay attention. Actualist means the monitor is forced on. Constant."

  "Correct. We want to see if consciousness persists when the Higher-Order Thought is mandatory, regardless of First-Order input."

  "Initiate," Elias said.

  At first, it was normal. He looked at the red ball on the table.
  *First-Order:* Wavelengths hit the retina.
  *Higher-Order:* The thought *I am seeing a red ball.*
  The two locked together like a key in a lock. He was conscious of the ball.

  Then, the dampeners engaged.

  Vane's team was suppressing the First-Order states. They were muting the sensory feed. But they left the Higher-Order generator running at full power.

  Elias blinked. The room was grey. He knew it was grey. But then, a spike of certainty fired in his prefrontal cortex.

  *I am feeling warmth on my left hand,* the thought announced.

  Elias looked at his left hand. It was resting on cold metal. He wiggled his fingers. No nerve signals were coming up the arm. No heat.

  "Report," Vane said.

  "There's... a thought," Elias said, frowning. "It says my hand is warm."

  "Is your hand warm?"

  "No. It's cold. Actually, it's numb. The sensors are dead."

  "But you have the thought that it is warm?"

  "Yes."

  "Describe the warmth."

  Elias paused. He reached for the memory of heat, the qualia of it. The sting of a stove, the sun on skin. He found nothing. There was no sensory texture. There was only the *assertion*.

  "It's like..." Elias swallowed. "It's like reading a label that says 'Honey' on a jar, but when you open it, there's no honey. Just the word. But the word insists it's sticky."

  "Targetless HOT confirmed," Vane muttered to someone off-mic. "Subject is reporting conscious experience of a state that does not exist."

  "Is it conscious?" Elias asked, panic rising. "If I don't feel the heat, but I *know* I feel the heat... what am I experiencing?"

  "That's what we're paying you to find out, Elias."

  The intensity ramped up. The Actualist protocol forced the monitor to fire continuously. Usually, Elias only thought about his breathing if he focused on it (Dispositional). Now, the machine forced the thought *I am breathing* into his mind every second, regardless of his attention.

  But then, the feed cut completely.

  Total sensory deprivation. No sight, no sound, no proprioception. Elias was a brain in a void. First-Order states were zero.

  But the crown kept humming.

  *I am seeing blue,* the thought commanded.

  "I'm not seeing blue," Elias whispered into the dark. "There is no blue."

  *You are seeing blue,* the thought insisted. It wasn't a voice; it was a structural certainty. A meta-cognitive stamp.

  "Subject heart rate elevating," Vane noted. "Elias, are you conscious of the blue?"

  Elias squeezed his eyes shut, but there was no difference. "I don't know! That's the problem. There's no picture. There's no color. But there is an *awareness*. It's an awareness of... a placeholder."

  He felt like he was screaming, but he couldn't tell if his throat was moving. The monitor generated the thought: *I am screaming.*

  "Am I screaming?" Elias asked.

  "Biometrics say no," Vane replied. "Your vocal cords are still."

  "Then why do I know I'm screaming?"

  "Because the Higher-Order Thought is present. The First-Order state is absent. You are experiencing the *representation* of the scream without the *scream*."

  Elias began to hyperventilate. "It feels hollow. It feels like... like being a ghost in a machine that isn't there. I have the 'I'. I have the 'Am'. But I don't have the 'Being'. It's a grammatical sentence without a referent."

  "Stay with it," Vane said, her voice hungry. "We need to know if the Targetless HOT has qualitative character. What is it like?"

  "It feels like vertigo," Elias gasped. "Mental vertigo. I'm reaching out to grab the feeling of my own arm, and my hand passes through it, but my brain tells me I'm holding it. It's a lie that feels like truth."

  "Increase gain on the monitor. Let's try an emotional state."

  The crown pulsed.

  *I am grieving,* the thought bloomed.

  Elias waited for the heaviness in the chest. The tightness in the throat. The tears.
  Nothing. His body was a flat line of chemistry.

  But the *knowledge* of grief was overwhelming. It was a heavy, black fact floating in the white void.

  "I'm grieving," Elias said, his voice trembling. "But I'm not sad. I'm just... aware of the grief. It's like watching a movie of myself crying, but the screen is blank."

  "Is it conscious?" Vane pressed. "If there is no pain, no sadness, no qualia... is it consciousness?"

  "Yes!" Elias shouted. "That's the horror! It *is* consciousness. It's pure consciousness stripped of the object. I am aware, but I am not aware *of* anything. I am just... awareing."

  He felt the boundaries of his self beginning to fray. Usually, the self was defined by its contents. *I am the one who sees red. I am the one who feels pain.* Without the red, without the pain, the *I* had no anchor.

  "Subject is dissociating," Vane said. "Pull it back. Switch to Dispositional. Let the monitor sleep unless he calls it."

  The hum dropped. The forced thoughts receded. The constant *I am, I am, I am* faded into the background, waiting to be summoned.

  Elias slumped in the chair. The silence rushed back in. He looked at his hand. He focused on it.
  *Now I am aware of my hand.*
  The thought arose naturally, triggered by the attention. The First-Order sensation of the metal chair matched the Higher-Order report. The lock clicked shut.

  "Session terminated," Vane said. "Come out, Elias."

  Elias stood up. His legs felt real. The floor was hard. He walked to the door.

  He stopped with his hand on the handle.

  He looked at the metal. He knew, logically, the metal was cold. He knew his nerves were sending signals.
  But for a split second, a phantom thought flickered. Unbidden. Unchecked.
  *I am not touching anything.*

  He looked at his hand. It was on the handle. The sensation was there. The First-Order state was present.
  But the Higher-Order Thought had misfired. A leftover glitch.

  For one terrifying heartbeat, Elias was conscious of his hand, and conscious that he wasn't touching it, simultaneously.
  He didn't know which one was the lie. He didn't know if he was a body with a ghost in it, or a ghost dreaming of a body.

  He opened the door and stepped out, but he couldn't feel the floor beneath his feet, even though he knew, with absolute certainty, that he was walking.
