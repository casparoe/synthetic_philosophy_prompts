answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late evening. The coffee is stale. Two philosophers, ELENA (Traditionalist/Walzerian) and MARCUS (Revisionist/McMahanian), are finishing a debate that started in the seminar room.*

  **ELENA:** You're asking too much of the individual soldier, Marcus. That's the core of it. When you put that conscript in the field—let's call him Ivan—he isn't a moral philosopher with a briefing paper. He's a terrified twenty-year-old with a rifle and a political commissar watching his back. If you tell Ivan that his participation makes him a moral wrongdoer, you haven't clarified the ethics; you've just loaded him with a guilt he can't carry.

  **MARCUS:** I'm not talking about guilt, Elena. I'm talking about liability. We have to distinguish between *culpability* and *liability*. Ivan might be entirely blameless. If the regime threatens to execute his family should he refuse, he has a duress excuse. He is not culpable. But that doesn't mean the soldier facing him across the trench has forfeited his right to life.

  **ELENA:** But that distinction collapses in the smoke. If Ivan isn't liable to be killed—if he hasn't forfeited his rights by virtue of being an unjust combatant—then the soldier shooting him is, strictly speaking, attempting to kill an innocent person. You're turning war into a police action against non-liable threats.

  **MARCUS:** Not necessarily. It becomes a "lesser evil" justification. The just combatant may be permitted to kill Ivan to prevent the unjust aims of the war, even if Ivan himself isn't personally liable. But we can't pretend Ivan has the *same* moral standing as the defender. If we say they are moral equals, as Walzer does, we imply that killing for aggression is morally symmetrical to killing for self-defense. That's intuitively repugnant. It suggests aggression doesn't generate a defensive right in the victim.

  **ELENA:** Intuition is cheap; consequences are expensive. Walzer's "Moral Equality of Combatants" (MEC) isn't a claim about metaphysical truth; it's a claim about the *War Convention*. It's a functional norm. If we adopt your revisionism, we break the symmetry that keeps *jus in bello* intact. Here is the hard case you're glossing over: If Ivan knows that, philosophically, he is fighting unjustly and therefore lacks the right to kill, why would he follow the rules of engagement? Why wouldn't he fight dirty? If he's already a "wrongdoer" in your book, even if excused, the incentive to restrain violence evaporates.

  **MARCUS:** That's the standard reciprocity objection. And it assumes soldiers are motivated primarily by Just War Theory rather than survival or military discipline. Ivan follows the rules because if he doesn't, the enemy won't either, and he'll die. Or because his officers will court-martial him. He doesn't need the false comfort of moral equality to obey the laws of war.

  **ELENA:** But the Law of Armed Conflict *is* built on that symmetry. Geneva doesn't ask, "Whose cause is just?" It asks, "Are you a combatant?" If we tell the international community that unjust combatants are essentially rights-violators, we undermine the legal framework that protects prisoners of war. You're trading a clean moral ledger for a bloodier battlefield.

  **MARCUS:** I'm not trading anything. Moral truth isn't negotiable based on pragmatic fears. If a man is attacking me to steal my land, he is threatening me unjustly. If I kill him, I am justified. If he kills me, he has wronged me, even if he was conscripted. To say otherwise is to say that the number of men behind an aggression can wash away the wrongness of the aggression.
  But let's look closer at your conscript, Ivan. You say he has "no real option."

  **ELENA:** Exactly. Coercion.

  **MARCUS:** Okay. But suppose Ivan *reasonably suspects* the war is unjust. He sees the borders being crossed without provocation. He hears the propaganda cracking. In Walzer's view, he is still permitted to kill. In my view, he is not permitted, though he may be excused if he fights. But here is where I push back on your reciprocity point. If we adopt the revisionist view, does it actually increase violence? Or does it make soldiers more hesitant to fight unjust wars? If Ivan knows he lacks the moral right to shoot, he might be more inclined to surrender or desert. That saves lives.

  **ELENA:** That's a beautiful hope, Marcus, but it ignores the epistemic fog. Who decides if the suspicion is "reasonable"? If we empower individual soldiers to judge *jus ad bellum*, we invite subjectivity. One side's "reasonable suspicion" is the other side's "patriotic duty." Walzer separates *ad bellum* from *in bello* precisely to stop soldiers from becoming moral vigilantes. The state bears the guilt of the war; the soldier bears the responsibility of the fight. That division of labor is the only thing that prevents total war.

  **MARCUS:** The "division of labor" is a convenient fiction for states to hide behind. It lets leaders wage unjust wars using human shields who are told they are morally clean. But let's grant your point about incentives. Even if we accept MEC for the sake of convention, we must admit it's a *convention*, not a moral reality.

  **ELENA:** In international ethics, the convention *is* the reality.

  **MARCUS:** No. If a drone operator sits in Nevada and obliterates a conscript like Ivan, and Ivan was fighting an unjust war of aggression... you're saying the drone operator and Ivan are moral mirrors?

  **ELENA:** I'm saying they are both *combatants*. They are both instruments of state policy. If we say the drone operator is "justified" but Ivan is "wrongful," we create an asymmetry that makes negotiation impossible. Peace treaties require treating the enemy as a legitimate counterpart, not a criminal gang. If Ivan is a criminal, you don't negotiate; you prosecute. And if you prosecute everyone on the losing side, they will fight to the last man.

  **MARCUS:** This is the "Last Man" argument. It carries weight. But it conflates *post-bellum* justice with *in-bello* liability. We can hold that Ivan was not liable to be killed (meaning the drone operator acts in a moral gray zone of lesser-evil justification) without necessarily demanding Ivan be hanged after the war. We can excuse him due to duress.
  But here is my hardest question for you, Elena. If Ivan is morally equal to the defender, then the defender's right to life is contingent on the uniform he wears, not the justice of his action. If Ivan attacks a just combatant, and the just combatant kills him in self-defense... on your view, has Ivan been wronged?

  **ELENA:** Ivan has been killed in war. He hasn't been "wronged" in the criminal sense. He entered a sphere of danger where death is a known risk.

  **MARCUS:** But *why* was he in danger? Because he was threatening someone. If his threat was unjust, he has done something to make himself liable to defensive force. If you deny that, you are saying that a person can threaten an innocent life without forfeiting their own right to life, provided they are wearing a uniform. That strips the "innocent" of their right to self-defense.

  **ELENA:** The innocent *have* the right to self-defense. But the soldier opposing Ivan isn't acting as a private individual; he's acting as an agent of the state. When two states clash, the rights of the individuals are subsumed by the rights of the collectives to settle the dispute.
  Look, I agree with you that aggression is wrong. I agree that Ivan's leaders are murderers. But Ivan is trapped. If you tell him he is morally prohibited from fighting, but his government will shoot him if he stops... you've put him in a double bind where every option is a sin. MEC releases him from that bind. It says, "You are not responsible for the war's justice. You are only responsible for how you fight."

  **MARCUS:** It releases him from responsibility, yes. But it does so by blinding him to the truth. It creates a form of moral ignorance.
  Let's try this: Suppose Ivan knows, *knows*, his war is unjust. Not a suspicion, but certainty. Maybe he's ordered to massacre civilians. Walzer says if he follows orders, he's still a legitimate target, morally equal to the defender, provided he follows *in bello* rules.

  **ELENA:** He is a legitimate target because he is a threat.

  **MARCUS:** But is he *liable*? If I know a man is driving a truck to run over a crowd, but he's doing it because a gunman is holding his child hostage in the back of the cab... if I shoot the driver to stop the truck, have I killed someone who forfeited his right to life? Or have I killed an innocent instrument to save the crowd?

  **ELENA:** In the fog of war, you can't know about the hostage.

  **MARCUS:** But *we* know, in this theoretical case. And morally, the driver is not liable. He is an innocent threat. The revisionist view accounts for this. The traditionalist view crushes it under the boot of "combatant status."
  My worry is that by insisting on MEC, you are prioritizing the *regulation* of war over the *morality* of killing. You want to make war manageable. I want to make war truthful.

  **ELENA:** I want to make war less horrific. If we accept your view, then every soldier on the unjust side is potentially a murderer, and every soldier on the just side is a vigilante judge. That doesn't limit war; it moralizes it. And moralized war is total war. The Crusades were moralized. The Terror was moralized.
  The War Convention is cynical, Marcus. It admits that war is hell and tries to build guardrails. It says, "We know one of you is the aggressor. We don't care right now. We care that you don't poison the wells."

  **MARCUS:** But guardrails built on a lie are fragile. If the guardrail is "You are morally equal," and the soldiers realize they aren't... the guardrail breaks.
  Better to say: "Ivan, you are in a tragic position. You are not liable to be killed, because you are coerced. But you also do not have the right to kill the defender, because the defender is innocent. However, because you are coerced, you are excused. And the defender is permitted to stop you, not because you are evil, but because it is a lesser evil than letting the unjust war succeed."
  That preserves the moral truth without necessarily condemning Ivan to hell.

  **ELENA:** It preserves the truth, but it destroys the parity needed for negotiation. If the just side believes they are fighting non-liable innocents, does that restrain them? Maybe. But if they believe they are fighting "unjust aggressors" who happen to be excused, they might feel less restraint.
  And consider the political reality. If we adopt revisionism, the victor gets to define who was "unjust." Suddenly, all defeated combatants are retroactively deemed to have lacked the right to kill. That makes post-war reconciliation impossible. Walzer's symmetry allows the German soldier and the American soldier to shake hands in 1946. Your view suggests the German soldier *should* feel a moral stain the American doesn't.

  **MARCUS:** He *should* feel a moral stain. Not culpability, but tragedy. He fought for a wrong cause. Acknowledging that is necessary for genuine reconciliation. Pretending they were moral equals is a salve, not a cure.
  But I will concede this: For the *law*, you are right. International Law must follow Walzer. It cannot adjudicate *ad bellum* justice in the moment of combat.

  **ELENA:** And I will concede this: For the *conscience*, you are right. Ivan, in his quiet moments, should wonder about the justice of his cause. If the doubt is strong enough, conscience might demand refusal, regardless of the cost.
  But as a public norm? As a rule for the battlefield? I cannot accept that we tell soldiers their moral permission to survive depends on a geopolitical assessment they are unequipped to make.

  **MARCUS:** Then we are left with a gap. The law says one thing, morality says another.

  **ELENA:** That gap is the space where tragedy lives. And maybe it's better than the alternative, where we convince ourselves that because the law says we're equal, the morality must be too.

  **MARCUS:** Agreed. But I still think Ivan deserves to know the truth, even if the truth doesn't save him.

  **ELENA:** And I think Ivan deserves to come home, even if the truth says he shouldn't have gone.

  *(They sit in silence for a moment, the weight of the conscript's choice hanging between them.)*
