      *   *Verdict:* Yes, Sartre would see this as the ultimate objectification. It denies the radical alterity of death. It pretends the husband is still a "For-itself" (conscious freedom), but it's actually a hyper-controlled "In-itself." It's a tool for the widow to control the narrative of the husband completely. He can no longer surprise her, contradict her, or leave her. He is frozen in her image of him.

