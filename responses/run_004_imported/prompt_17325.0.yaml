      *   **Death:** In *Being and Nothingness* (BN), Sartre argues against Heidegger. For Heidegger, death is *my* ultimate possibility. For Sartre, death is an *external fact*. It removes my freedom. It turns me from a Subject (For-itself) into an Object (In-itself). My life's meaning is decided by the *living* (the Others). "Death is the triumph of the Other's point of view."
      *   **The Look (Le Regard):** The Other objectifies me. When I am dead, I am purely objectified. I cannot look back.
      *   **Bad Faith (Mauvaise Foi):** Lying to oneself to escape the anguish of freedom. Pretending to be a thing (In-itself) when one is consciousness (For-itself), or pretending one has no choice when one does.
      *   **The Griefbot:** It simulates the dead husband. It makes him "speak." But it's code. It's predictable (based on past data). It's an object pretending to be a subject.

