      *   *Actually, the strongest philosophical objection to Sartre's specific view on death:* **The "Survivor's Guilt/Responsibility" argument.** Sartre says death hands us over to the Other. But he underestimates how the *living* are constituted by the dead. We aren't just free agents deciding what a dead person meant; we are *haunted*. The bot isn't just objectification; it's an acknowledgment that the dead *continue to act on us*.
