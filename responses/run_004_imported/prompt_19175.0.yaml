answer: |-
  This is a sharp observation, and you are right to be frustrated if the seminar treated them as independent variables rather than a direct dialectical engagement. The father-son dynamic isn't just biographical trivia; it represents a generational shift from ordinary language philosophy to hard-nosed metaphysical skepticism.

  Here is the breakdown of the conflict, the status of the "objective attitude," and what remains for retributivism.

  ### 1. Does Galen's Regress Universalize the Objective Attitude?

  **Yes.** If Galen Strawson's (GS) Basic Argument is sound, P.F. Strawson's (PFS) distinction between "exemptions" (the child, the psychotic) and "ordinary agents" collapses.

  PFS argues we suspend reactive attitudes (RAs) when an agent lacks the capacity for ordinary interpersonal relationships (exemptions) or when a specific action was non-voluntary (excuses). GS argues that *no one* has the capacity for "ultimate responsibility" (being *causa sui*). Therefore, on GS's view, the condition for exemption applies universally. We are all, metaphysically speaking, in the position of the child or the compulsive neurotic: acting out of a nature we did not choose.

  Consequently, consistency *does* push us toward the Objective Attitude (OA) for everyone. If the justification for suspending RAs is "lack of ultimate control," and no one has ultimate control, then the OA is the only metaphysically honest stance toward humanity.

  ### 2. Is "Psychological Incapacity" a Rebuttal or a Concession?

  This is the crux of your second question. PFS argues that a global OA is "psychologically impossible" for humans; we cannot sustain it without ceasing to be the kind of creatures who value relationships.

  **The Concession View:**
  If you view responsibility as a metaphysical property that must obtain *before* our practices can be justified, then PFS is indeed conceding. He is effectively saying: *"Galen is right that we don't deserve blame in the cosmic sense, but we are biologically hardwired to blame anyway, so we might as well pretend it's justified."*
  If this is the reading, PFS offers no moral defense of retributivism, only a pragmatic one. It reduces punishment to management (the OA) disguised as morality (RAs) because we lack the strength to be honest. This is the "hiding behind human limitations" charge.

  **The Rebuttal View (The Transcendental Move):**
  However, PFS is better read as making a transcendental argument, not a pragmatic concession. He is not saying, "We can't help but blame, so let's ignore the truth." He is arguing that **the concept of moral responsibility is constituted by these practices.**
  *   For PFS, "responsibility" does not refer to a metaphysical state of *causa sui* (which GS attacks). It refers to eligibility for reactive attitudes.
  *   If the OA is impossible for us, then the "view from nowhere" (GS's perspective) is not a valid standpoint for judging human morality.
  *   Therefore, PFS isn't hiding behind limitations; he is arguing that GS's standard of responsibility is *inhuman* and therefore irrelevant to ethics.

  **The Verdict:**
  GS wins on **metaphysics** (no one is ultimately responsible). PFS wins on **meaning** (responsibility has no meaning outside of RAs).
  Is PFS's move a rebuttal? Only if you accept that ethics is anthropology. If you believe morality must track metaphysical truth (GS), PFS is conceding. If you believe morality tracks human flourishing and interpersonal meaning (PFS), PFS is rebutting the relevance of GS's argument.

  ### 3. Traction for Retributive Punishment

  Do they wash each other out? Not entirely, but they severely constrain the *type* of retributivism you can defend.

  **Galen Strawson's Impact:**
  GS destroys **Basic Desert Retributivism**. If no one is ultimately responsible, no one *deserves* suffering in the strong sense. You cannot justify punishment on the grounds that the offender "earned" it metaphysically. This leaves only:
  *   **Consequentialism:** Deterrence, rehabilitation.
  *   **Quarantine:** Incapacitation of dangerous agents (analogous to carrying a virus), which aligns with the Objective Attitude.
  *   **Moral Luck Skepticism:** It undermines the proportionality of sentencing based on "character."

  **P.F. Strawson's Impact:**
  PFS saves **Communicative Retributivism**. If responsibility is grounded in RAs, then punishment is the institutional expression of indignation.
  *   Punishment becomes a way of taking the offender seriously as a moral agent. To *not* punish (to treat them with the OA) is to treat them as a pet or a patient, which is dehumanizing.
  *   This provides traction for punishment as a **moral dialogue**. The state punishes to affirm the norm and acknowledge the offender's agency.

  **The Synthesis (and the Problem for Law):**
  They don't wash out; they create a **dilemma of legitimacy**.
  *   **PFS** gives you the *practice* of punishment (we must blame to be human).
  *   **GS** denies the *justification* for suffering (blame is metaphysically unjust).

  For a law PhD, this creates a specific tension in punishment theory:
  1.  **If you side with PFS:** You defend punishment as a necessary human institution, but you must admit it rests on a "fiction" of ultimate responsibility (from the God's-eye view). You are defending a "human-scale justice."
  2.  **If you side with GS:** You must admit the criminal law is fundamentally unjust in its retributive elements, even if necessary for safety. You are pushed toward a public health/quarantine model of criminal justice (like the work of Vincent Solum or some strands of Dolinko).

  ### Conclusion

  To answer your specific worry: **Yes, Galen's regress universalizes the exemptions, pushing toward the Objective Attitude.**

  PFS's reply is not that the OA is *false*, but that it is **practically null**. It is not a rebuttal to the metaphysics; it is a rejection of the metaphysics' authority over ethics.

  For retributivism, this means:
  *   **GS** kills the claim that punishment is *cosmically just*.
  *   **PFS** saves the claim that punishment is *socially necessary and meaningful*.

  They don't cancel each other out; they force you to choose whether you are defending punishment as a **moral truth** (which fails under GS) or as a **human practice** (which survives under PFS). Most modern legal theorists (like R.A. Duff) try to ride the PFS line: arguing that "ultimate responsibility" is a philosopher's fantasy and that legal responsibility only requires the capacity for normative competence within a community. GS would say that without ultimate responsibility, normative competence is just a more complex form of determinism, and the "community" is just a group of determined atoms blaming each other.

  If you want to defend retributivism in that seminar, your best bet is to argue that PFS correctly identifies the *domain* of responsibility (the interpersonal), and that GS's demand for *ultimate* responsibility is a category error that demands ethics satisfy metaphysics, which it cannot do. But you have to concede that this makes retributivism "local" to human forms of life, not universally true.
