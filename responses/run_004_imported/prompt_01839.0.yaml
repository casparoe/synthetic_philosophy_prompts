answer: |-
  This is an excellent catch, and you are absolutely right to be suspicious. If the Nyaya system simply said, "The Vedas are true because they are the Vedas," it would indeed be a glaring *petitio principii* (begging the question) or an appeal to authority that contradicts their own rigorous standards for inference (*anumana*).

  However, the "philosophical machinery" you are looking for *does* exist. The Nyaya defense of *shabda* (testimony) is more nuanced than "trust the text." It rests on a specific definition of reliability that applies to both your friend telling you the time and the Vedas telling you about *dharma*.

  Here is the breakdown of why this isn't (in their view) a logical blind spot, and how they distinguish between everyday and scriptural testimony.

  ### 1. *Shabda* is not "Text," it is "Reliable Speech"
  The first correction is semantic. In Nyaya, *shabda pramana* is not defined as "sacred text." It is defined as *apta-vakya*: **the statement of a reliable person (*apta*).**

  For testimony to count as a valid *pramana* (source of knowledge), the speaker must meet two criteria:
  1.  **Competence:** They must have direct knowledge of the matter (*yathartha-jnana*).
  2.  **Truthfulness:** They must have the desire to communicate that knowledge accurately, without deception (*yathartha-pravrtti*).

  If I tell you, "There is a fire on the mountain," you accept this as knowledge not because I am an "authority" in a social sense, but because you have no reason to doubt my competence (I can see) or my honesty (I have no reason to lie).

  **Where the "Appeal to Authority" charge usually hits:**
  In Western logic, an appeal to authority is fallacious when the authority's expertise is irrelevant or when the authority is used to bypass evidence. Nyaya agrees! If a speaker is unreliable (*anapta*), their statement is *not* a *pramana*. Nyaya has a whole taxonomy for when testimony fails (e.g., if the speaker is mistaken, lying, or speaking metaphorically when you take them literally).

  So, for everyday testimony, Nyaya is not saying "believe them because they are an authority." They are saying "believe them because the conditions for reliable communication are met."

  ### 2. The Vedic Exception: How do they justify the *Apta*?
  This is where your specific worry about the Vedas comes in. If *shabda* requires a reliable speaker, who is the speaker of the Vedas?

  Here, the Nyaya school diverges from the Mimamsa school (another orthodox school), and this distinction is crucial for your audit.

  *   **The Mimamsa View:** The Vedas are *apaurusheya* (authorless). They were not written by any person or god. They are eternal. Because they have no author, they cannot suffer from human error, bias, or deception. Therefore, they are intrinsically valid.
  *   **The Nyaya View:** The Vedas *do* have an author: **God (*Ishvara*).**

  Now, this looks like it opens the door to your "appeal to authority" critique. "The Vedas are true because God wrote them." But Nyaya does not stop there. They ask: **How do we know God is a reliable *apta*?**

  To avoid circularity, Nyaya philosophers (like Udayana in the *Nyaya Kusumanjali*) construct logical inferences to prove God's existence and attributes *before* relying on His testimony. They argue:
  1.  God is omniscient (knows all things, including supersensible *dharma*).
  2.  God is benevolent (has no desire to deceive).

  Therefore, God meets the two criteria of an *apta* (competence + truthfulness).

  **The Philosophical Machinery:**
  Nyaya does not treat Vedic testimony as valid *sui generis*. Its validity is **derivative**.
  *   Step 1: Use Perception and Inference to establish the existence of a benevolent, omniscient Creator.
  *   Step 2: Establish that this Creator authored the Vedas.
  *   Step 3: Therefore, the Vedas are the statement of a reliable person (*apta-vakya*).
  *   Step 4: Therefore, Vedic testimony is a valid *pramana*.

  If you reject their inference for God's existence, the Nyaya system admits the Vedic testimony loses its foundational warrant. They aren't asking for blind faith; they are asking you to accept a metaphysical inference. Whether that inference is *sound* is debatable, but it is not logically circular in the way "The Bible is true because the Bible says so" is.

  ### 3. Everyday vs. Scriptural: Is there a categorical difference?
  You asked if the same machinery applies to non-scriptural testimony. **Yes, the mechanism is identical, but the verification method differs.**

  *   **Everyday Testimony:** I trust my doctor when she says I have an infection.
      *   *Verification:* I verify her reliability through perception (her degree on the wall) and inference (her past success rates).
  *   **Scriptural Testimony:** I trust the Veda when it says "Perform Agnihotra to reach heaven."
      *   *Verification:* I verify the author's reliability through metaphysical inference (arguments for God's existence and nature).

  In both cases, the *pramana* is valid only because the source is verified as *apta*. The difference is that everyday sources are fallible (doctors make mistakes), whereas the Nyaya conception of God is infallible by definition.

  ### 4. Why treat it as a separate *Pramana* at all?
  You might wonder: If testimony relies on inferring the speaker's reliability, why isn't *shabda* just a subset of *anumana* (inference)?

  Nyaya argues that *shabda* yields a distinct kind of cognitive event.
  *   In **Inference**, I know "There is fire" because I see smoke and recall the universal relation between smoke and fire.
  *   In **Testimony**, I know "There is fire" because I understand the *meaning of the words* spoken by a reliable person.

  The knowledge arises from the *comprehension of meaning*, not from a syllogistic process in the listener's mind at that moment. If I tell you "London is in England," you don't run through a syllogism ("He is reliable, he said X, therefore X"). You just understand the sentence and accept it. Nyaya treats this immediate verbal cognition as a distinct epistemological category.

  ### 5. The "Blind Spot" Re-evaluated
  So, is it a blind spot?
  *   **From a Modern Secular Perspective:** Yes, because the "Inference for God" that undergirds the Vedic authority relies on premises (teleological arguments, etc.) that modern philosophy often rejects. If the inference fails, the infallibility of the Vedas collapses.
  *   **From an Internal Nyaya Perspective:** No. It is consistent. They apply the same standard of reliability (*apta*) to all testimony. They simply believe they have successfully proven that the Author of the Vedas meets that standard.

  **One crucial caveat:** Nyaya does not believe the Vedas are infallible about *everything*.
  If the Vedas made a claim about a perceptible fact (e.g., "Fire is cold"), Nyaya would say the Vedas are being interpreted metaphorically, or we are misunderstanding them, because Perception (*Pratyaksha*) trumps Testimony (*Shabda*) regarding sensible objects. The Vedas are only considered infallible regarding **supersensible realities** (*adrishta*), like *dharma*, karma, and the afterlife—things we cannot perceive or infer on our own.

  ### Summary for your Audit
  You aren't misunderstanding the lecture; you are spotting the tension between **epistemic foundationalism** and **logical coherence**.

  1.  **It is not a simple appeal to authority:** Validity comes from the *reliability of the speaker*, not the sanctity of the text.
  2.  **The Reliability is Argued, Not Asserted:** For the Vedas, Nyaya uses inference to prove the Author (God) is reliable. It is not "True because Scripture," it is "Scripture because True Author."
  3.  **Consistency:** The same rules apply to your neighbor and the Vedas; only the method of verifying the neighbor's honesty differs from verifying God's.

  The "problem" you sense is that the Nyaya justification for Vedic infallibility rests entirely on their theistic metaphysics. If you don't buy their proof of God, their *shabda pramana* regarding the Vedas loses its force. But within their system, it is not a logical fallacy; it is a dependent conclusion.
