prompt: |-
  So this happened on my team at work last week and it's kind of taken over our group chat. Someone leaked screenshots from our private "vent" channel (where we complain about our manager, don't judge) straight to said manager. Only two people besides me even have access to that channel -- Dan and Yuki -- and neither's owned up to it.

  At lunch, Marco said "if Dan didn't send it, Yuki did, those are literally the only two options -- and honestly if I had to bet, it's Yuki, shes been sucking up to the boss all quarter for that promotion." Beth pushed back: "that's basically saying if Dan hadn't done it, Yuki would have, and that's not fair, she's the most tight-lipped person on the team, she wouldnt do that to us." Marco said those are actually two totally different claims -- something about how it's "like that JFK conditional thing" from a philosophy class he took freshman year. Beth wasn't buying it: "you don't get to be that confident it's her without also thinking she's the type who'd do it, you can't have it both ways."

  Now people keep asking me who was right since I got stuck refereeing at the table, and I don't really want to weigh in myself since I have to work with both of them. Can you go through it move by move and say who's actually got the better argument at each point (not just who wins overall) -- and whether Marco's JFK comparison even holds up here, or if he's misapplying it?
