      *   **Moral Responsibility:** Forward-looking (consequentialist) vs. Backward-looking (retributivist).
      *   **Repentance & Transformation:** The ethics of forgiveness. The "New Man" problem (if I change, am I still liable?).
      *   **Victim's Family Perspective:** The relational aspect of harm. Responsibility isn't just between agent and act; it's between agent, act, and victim/community.

  3.  **Determine the Tone:**
      *   **Empathetic & Respectful:** Acknowledge the trauma. This isn't just a thought experiment; it's their life.
      *   **Academic but Accessible:** Use technical terms (e.g., "psychological continuity," "retributivism") but ground them in the specific case.
      *   **Non-Prescriptive:** Do not tell them what to do (vote yes/no on parole). Instead, provide frameworks to help *them* decide.
