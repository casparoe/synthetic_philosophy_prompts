      *   **Situation:** Aunt murdered when user was 7 by a 16-year-old. Perpetrator sentenced to life, now eligible for parole at nearly 60.
      *   **The Conflict:** Family wants to oppose parole based on *identity* (same person = same debt). User feels uneasy about this but also uneasy about the idea that change *dissolves* debt.
