  # The Tyranny of the Present: Why Pure Time Preference Must Be Zero

  The Ramsey rule for the social discount rate, $r = \rho + \eta g$, is perhaps the most consequential equation in modern public policy. It determines how much we sacrifice today to prevent catastrophe tomorrow. In this formula, $\eta g$ accounts for the expectation that future generations will be richer (and thus marginal utility of consumption is lower), but $\rho$—the pure rate of time preference—is different. It measures how much we discount future wellbeing simply because it occurs later in time. Frank Ramsey famously declared a positive $\rho$ "ethically indefensible," a mere "concession to human frailty." Yet, decades later, William Nordhaus's climate models rely on a $\rho$ of around 1.5% to 3%, while Nicholas Stern's review used near-zero. The difference dictates whether we treat climate change as a manageable nuisance or an existential emergency.

  Despite the pragmatic allure of a positive $\rho$, the ethical verdict must be absolute: **A positive pure rate of time preference is ethically indefensible.** To assign a lower moral weight to a person's welfare solely based on their coordinate in time is a form of discrimination indistinguishable from racism or spatial prejudice. While arguments from behavioral psychology, agent-relative partiality, and economic feasibility attempt to justify $\rho > 0$, they confuse *what is* with *what ought to be*, or they mistake the social planner's impartial duty for an individual's private impatience. For a just intergenerational contract, $\rho$ must be zero.

  ### The Case for Temporal Neutrality

  The argument for $\rho = 0$ rests on the principle of temporal neutrality, championed by Henry Sidgwick and later John Rawls. The core intuition is that the date of a person's birth is morally arbitrary. Just as a social planner in the present would not discount the welfare of a citizen because they live in a distant province, they should not discount a citizen because they live in a distant decade.

  Rawls's "veil of ignorance" makes this explicit. If you did not know which generation you would belong to, you would not agree to a contract that allowed earlier generations to consume resources recklessly simply because they arrived first. To do so would be to allow the "tyranny of the present." If we accept the premise of equal moral worth across persons, time cannot be a valid criterion for diminishing that worth. A unit of suffering in 2100 is not intrinsically less severe than a unit of suffering in 2024. Therefore, the pure rate of time preference, which acts as a tax on the future simply for being the future, is a violation of impartiality.

  ### The Pragmatic Objections and Their Failures

  Proponents of $\rho > 0$ typically offer three lines of defense: descriptive realism, agent-relative partiality, and the overdemandingness objection. None survive ethical scrutiny.

  First, the **descriptive argument** posits that individuals reveal a positive time preference in their savings and investment behavior; therefore, the social discount rate should reflect social preferences. This is a classic naturalistic fallacy. That people *are* impatient does not mean they *ought* to be. Historical revealed preferences have justified slavery, gender discrimination, and environmental degradation. Normative economics is tasked with correcting market and moral failures, not codifying them. If individuals myopically discount their grandchildren's welfare, the role of the social planner is to correct that myopia, not to institutionalize it.

  Second, the argument from **agent-relative partiality** suggests that we have stronger duties to our contemporaries and children than to distant descendants. While true for *individual* morality, this fails for *social* discounting. The social discount rate is not an aggregation of individual savings decisions; it is the parameter for a public agent acting as a trustee for the entire continuum of humanity. As Ramsey noted, the government is not an individual with a lifespan; it is an institution meant to persist. To apply agent-relative partiality to the state is to abdicate its duty as an impartial arbiter between generations.

  Third, and most seriously, is the **overdemandingness objection**. Critics argue that if $\rho = 0$, the implied savings rate becomes absurdly high, potentially paralyzing the present generation to benefit a future that may be vastly richer anyway. This was the crux of the critique against the Stern Review. However, this objection conflates $\rho$ with the growth term $\eta g$.

  In the Ramsey equation, the heavy lifting of discounting is done by $\eta g$ (the elasticity of marginal utility times growth). If we assume future people will be richer ($g > 0$) and that money matters less to rich people ($\eta > 0$), then future welfare is already discounted appropriately without needing a *pure* time penalty. A positive $\rho$ adds a *double penalty*: it assumes future people are richer (via $g$) *and* that they matter less (via $\rho$). The overdemandingness problem is solved by calibrating $\eta$ and realistic growth projections, not by smuggling in ethical prejudice via $\rho$. If $\rho = 0$ leads to "too much" saving, it implies our current economic structure makes sacrifice too costly, not that our ethics are wrong.

  ### The Stern-Nordhaus Divide as Ethical Clarity

  The clash between Stern and Nordhaus is not merely technical; it is a moral showdown. Nordhaus's $\rho \approx 1.5\%$ implies that a dollar of damage in 100 years is worth only a few cents today. This justifies gradual, moderate climate policy. Stern's $\rho \approx 0.1\%$ (adjusted only for extinction risk) values that same dollar much more highly, justifying immediate, aggressive mitigation.

  Critics called Stern's approach "alarmist" and economically unrealistic. But "unrealistic" is the point. Ethics often demands counter-factual reasoning. If we accept that climate change imposes irreversible harms on future people who did not consent to the risk, prioritizing current consumption convenience over their survival is an assertion of power, not justice. Nordhaus's model effectively privileges the consumption habits of the present over the livable conditions of the future. This is not a "reasonable compromise"; it is a moral failure disguised as prudence.

  ### The Verdict

  There is one caveat often raised: uncertainty of existence. If there is a probability that humanity will not exist in 2100, discounting is mathematically necessary. However, this is a probability adjustment, not a *pure time preference*. The prompt asks us to set extinction risk aside, but even within that constraint, the distinction holds. We discount because they might not be there, not because they are later.

  Once we strip away probability and growth, we are left with the bare question: Is a future person worth less than a present person? The answer must be no. A positive $\rho$ asserts that time itself erodes moral value. It treats the future as a colony to be exploited by the present.

  Therefore, the verdict is clear: **A positive pure rate of time preference is ethically indefensible.** It is a prejudice of date. While setting $\rho = 0$ demands significant sacrifice from the present, ethics is often demanding. The role of the social discount rate is not to make the future fit comfortably within our current budget constraints; it is to ensure our budget constraints do not violate the rights of those who come after. We are trustees of the future, not owners of the present. To discount their welfare simply because they are not yet here is to betray that trust. $\rho$ must be zero.
