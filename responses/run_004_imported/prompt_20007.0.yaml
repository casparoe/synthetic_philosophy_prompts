answer: |-
  Your friend has articulated a very strong, coherent version of what political theorists call the **"precommitment theory"** of constitutionalism, heavily influenced by Jon Elster's reading of Ulysses. It is a compelling argument because it appeals to democratic intuition: why should the dead rule the living? Why should a past majority stop a current majority, especially if the current majority is thinking clearly?

  However, while her account captures *one* important function of constitutions, it is reductive. It fails as a comprehensive theory of constitutional legitimacy, and her conclusion about "calm majorities" does not follow. You were right to feel nagged by it.

  Here is a breakdown of where her argument succeeds, where it fails, and four specific lines of rebuttal you can use to reconstruct your position.

  ### 1. The Diagnostic Error: Passion vs. Interest
  Your friend's argument relies on the assumption that the primary threat to constitutional order is **passion** (panic, prejudice, enthusiasm). Therefore, if you remove passion (via calm deliberation), the threat vanishes.

  **The Rebuttal:** This misreads the Federalist Papers and the history of constitutional design. James Madison in *Federalist No. 10* explicitly distinguishes between passion and **interest**. A faction can pursue its self-interest calmly, rationally, and deliberately.
  *   **Example:** If a majority of landless voters calmly deliberate for five years and conclude that stripping landowners of their property is economically beneficial to them, they are not acting like Ulysses listening to Sirens. They are acting like rational utility maximizers.
  *   **The Point:** Constitutional property rights are not designed solely to stop *panic*; they are designed to stop *expropriation*, regardless of the tempo. If the only justification for rights was stopping passion, then a "calm tyranny of the majority" would be legitimate. Most constitutional theorists reject this. Rights are trumps against majority will, not just shields against majority hysteria.

  ### 2. The Category Error: Ulysses vs. The Veil of Ignorance
  Your friend treats the Constitution as a **Ulysses Pact** (binding oneself against one's future weakness). But a better analogy for many constitutional provisions is the **Veil of Ignorance** (John Rawls / Constitutional Political Economy).

  **The Rebuttal:** When we draft a constitution, we (ideally) do not know if we will be in the majority or the minority, rich or poor, popular or unpopular. We agree to constraints (like due process or property rights) as a form of **insurance**.
  *   **The Problem with the Friend's View:** Once the veil is lifted and a specific majority identifies itself, that insurance is no longer needed *by them*. They are now the ones holding the power.
  *   **The Point:** The legitimacy of the constraint doesn't come from the *current* state of mind of the majority (calm vs. frantic); it comes from the *procedural fairness* of the original agreement. A calm majority stripping a minority of rights is violating the terms of the social insurance policy that makes democracy stable in the long run. The constraint remains justified because the *incentive structure* hasn't changed, even if the *emotional temperature* has.

  ### 3. The Institutional Error: Dualist Democracy
  Your friend assumes that "the majority" speaking through ordinary legislative channels is the only legitimate voice of the people. This ignores Bruce Ackerman's theory of **Dualist Democracy**.

  **The Rebuttal:** Ackerman argues there are two tracks of politics:
  1.  **Normal Politics:** Ordinary legislation, passed by calm representatives, focused on day-to-day governance.
  2.  **Constitutional Politics:** Rare moments of heightened democratic engagement where "We the People" speak directly to amend the fundamental law.
  *   **The Point:** A supermajority requirement or a Bill of Rights isn't just binding the future against passion; it is distinguishing between *ordinary* will and *fundamental* will. Even a calm, deliberate parliamentary majority does not have the same democratic legitimacy as the constitutional founding moment. To change the constitution, they shouldn't just be calm; they need to jump the higher hurdle of "constitutional politics" (e.g., Article V amendment process). The constraint forces them to prove their will is durable and broad, not just calculated and narrow.

  ### 4. The Specific Case of the Central Bank (Time Inconsistency)
  Your friend mentioned independent central banks. This is actually the weakest point for her argument, because the justification for central bank independence is rarely about "passion." It is about **time inconsistency** (Kydland & Prescott).

  **The Rebuttal:** Even a perfectly rational, calm, hyper-deliberative government has an incentive to cheat.
  *   **The Scenario:** A calm government knows inflation is bad long-term. But it also knows that printing money *now* will lower unemployment *before the next election*.
  *   **The Point:** This isn't a Siren song (irrational temptation); it is a **structural incentive problem**. The government is rationally choosing a sub-optimal long-term outcome because the short-term incentives are misaligned. Precommitment (an independent bank) solves this not by stopping panic, but by changing the payoff structure. A calm majority wanting to seize control of the bank is likely trying to exploit this short-term leverage, and the constitutional constraint remains justified to prevent that rational exploitation.

  ### Summary for the Next Dinner
  You can tell your friend that she has correctly identified the **Ulysses function** of constitutions (protecting against weakness), but she has mistaken it for the **entirety** of constitutional legitimacy.

  Her conclusion fails because:
  1.  **Rights are substantive, not just procedural:** They protect minorities against *interest*, not just *passion*.
  2.  **Legitimacy is backward-looking:** Constraints are justified by the fairness of the original "insurance" agreement (Veil of Ignorance), not the current mood of the majority.
  3.  **Rationality isn't enough:** As the Central Bank example shows, rational actors still create destructive outcomes without precommitment devices (Time Inconsistency).

  Elster himself would likely be on your side here. He famously argued that constitutions are not just about "binding" (Ulysses) but about **constituting** the very identity of the polity. A majority that calmly decides to violate the constitution isn't proving the constitution wrong; it is proving that it is no longer acting as a constitutional majority, but as a faction. The ropes on the mast aren't just there for when Ulysses is drunk; they are there because Ulysses knows that *even when sober*, the cost of steering toward the rocks might look tempting.
