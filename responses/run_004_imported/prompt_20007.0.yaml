          *   Constitutional rights aren't just about stopping panic; they're about defining the *boundaries* of what democracy can do, regardless of tempo.

      *   *Argument 2: Precommitment isn't just about Time (Short vs. Long), it's about Scope (Ordinary vs. Fundamental).*
          *   Ulysses is about *time* (now vs. later).
          *   Constitutionalism is often about *status* (ordinary politics vs. higher law).
          *   Bruce Ackerman's "Dualist Democracy": The People speak rarely and loudly (constitutional moments) vs. ordinary government. A calm parliamentary majority isn't "The People."

      *   *Argument 3: The "Veil of Ignorance" / Rawlsian Argument.*
          *   Constitutional rules are chosen behind a veil of ignorance (not knowing if you'll be in the minority).
          *   This isn't about stopping passion; it's about fairness/insurance.
          *   Even a calm majority knows they are the majority. They lack the impartiality of the constitutional framers.

      *   *Argument 4: Minority Rights are Trumps, not Shields against Panic.*
          *   Dworkin's view: Rights are trumps over utilitarian calculations.
