      *   More importantly, the friend is reducing *all* constitutional theory to the "passion vs. reason" model. This is a specific strand of constitutional justification (often associated with Holmes or certain readings of the Federalist Papers), but it is not the *only* one.

  4.  **Brainstorm Rebuttals/Counter-Arguments:**

      *   *Argument 1: The Definition of "Passion" is Too Narrow.*
          *   Friend assumes "calm deliberation" = "legitimate."
