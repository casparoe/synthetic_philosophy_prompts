      *   *Conclusion:* If the current majority is acting calmly/deliberately, the precommitment is unjustified.
      *   *Implicit Assumption:* Democracy is purely about majoritarian will, unless that will is "defective" (passionate).

  3.  **Evaluate the Friend's Interpretation of Elster/Ulysses:**
