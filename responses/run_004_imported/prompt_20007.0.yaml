          *   The justification is also about *coordination* and *stability*, not just passion. (e.g., Independent Central Banks prevent time-inconsistency problems, which exist even with calm actors).

      *   *Argument 6: Epistemic Humility.*
          *   We might *think* we are calm, but we are biased.
