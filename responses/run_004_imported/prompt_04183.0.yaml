answer: |-
  You have stumbled onto a genuine and fascinating piece of intellectual history, and you are right that it is often under-discussed in mainstream AI safety circles. However, whether it should "update us hard" toward modern AI risk arguments requires unpacking *why* von Neumann reached that conclusion versus *why* modern theorists do.

  Here is a breakdown of the historical nuance, the mechanistic differences, and what this actually implies for AI risk credence.

  ### 1. The Historical Record: 1955 vs. 1958
  You are mostly correct, but there is a slight conflation of sources common in this discussion.
  *   **The 1955 Essay:** In *"Can We Survive Technology?"* (published in *Fortune*), von Neumann absolutely argued that technological progress was accelerating faster than human social and political institutions could adapt. He warned this mismatch could lead to catastrophe (specifically citing nuclear war and automation-induced economic disruption).
  *   **The "Singularity" Coinage:** The specific mathematical metaphor of the "singularity" is most famously attributed to von Neumann by his colleague **Stanislaw Ulam**. In a 1958 tribute essay published after von Neumann's death, Ulam wrote:
      > "One conversation centered on the ever accelerating progress of technology and changes in the mode of human life, which gives the appearance of approaching some essential singularity in the history of the race beyond which human affairs, as we know them, could not continue."

  So, while the 1955 essay contains the *argument*, the 1958 Ulam anecdote contains the specific *terminology* that Kurzweil and Vinge later adopted.

  ### 2. Convergence vs. Mechanism
  Your argument rests on **convergent evolution of ideas**: If von Neumann (a genius) and Yudkowsky/Kurzweil (modern theorists) both predict a singularity, does that make the prediction more robust?

  **The Similarity (Structural):**
  Both camps agree on the *phenomenology* of the event:
  *   Progress is exponential, not linear.
  *   There is a horizon beyond which prediction becomes impossible.
  *   Human institutions cannot scale to match the speed of change.

  **The Difference (Mechanistic):**
  This is where the "update" gets tricky.
  *   **Von Neumann's Driver:** He was looking at **general technological acceleration** combined with **nuclear brinkmanship** and **cybernetics/automation**. His fear was largely sociological and political: that we would invent weapons or economic systems we couldn't control in time to prevent collapse.
  *   **Yudkowsky/Bostrom's Driver:** They are looking at **recursive self-improvement in cognitive architecture**. Their fear is agentic and cognitive: that a system will become smarter than us, optimize for a goal we didn't specify, and outmaneuver us.

  Von Neumann's singularity was about **humanity failing to adapt to technology.**
  The modern AI singularity is about **technology superseding humanity.**

  ### 3. Should This Update Your Priors?
  Does von Neumann's insight validate the modern AI risk position?

  **Yes, insofar as:**
  *   **The "Pacing Problem" is real:** Von Neumann identified a robust historical trend: technical capability scales faster than wisdom/institutions. This supports the AI safety argument that alignment (wisdom) is harder than capability (tech).
  *   **Genius intuition:** Von Neumann was arguably the best operational mind of the 20th century. If he looked at the trajectory of cybernetics and automata (the precursors to AI) and saw a discontinuity, that is a strong prior that discontinuities are possible.
  *   **Non-linearity:** It counters the "steady progress" narrative. If von Neumann saw a break in continuity in the 50s without modern compute, the concept of a "hard takeoff" isn't inherently absurd.

  **No, insofar as:**
  *   **Category Error:** Von Neumann's warning applies almost equally to nuclear war, bioengineering, or climate change. It is an argument for *caution regarding all advanced tech*, not specific evidence for *AGI intelligence explosion*.
  *   **Survivorship Bias:** Many brilliant people have made eschatological predictions that didn't come to pass (e.g., various nuclear winter scenarios, population bombs). Von Neumann being right about the *structure* of change doesn't mean he was right about the *outcome*.
  *   **The "Hard" Singularity:** Von Neumann seemed to imply a societal collapse or transformation. Modern AI risk often implies a physical or ontological transformation of the universe by superintelligence. The latter requires assumptions about mind design that von Neumann didn't explicitly make.

  ### 4. Is it Underrated in AI Risk Discussions?
  **Yes and No.**

  *   **Among Historians/Sociologists:** It is well-known. Scholars like James Beniger (*The Control Revolution*) discuss this lineage extensively.
  *   **Among AI Safety Researchers:** It is known but often treated as **etymology** rather than **evidence**. Rationalist circles tend to focus on the *mechanisms* of intelligence (computational theory, neuroscience) rather than the *sociological history* of tech trends.

  **Why it should be discussed more:**
  It grounds the Singularity in material history rather than sci-fi speculation. It shows that the intuition "tech is getting away from us" predates the computer age.

  **Why it shouldn't be over-weighted:**
  It risks the **Argument from Authority** fallacy. "Von Neumann believed X" is not evidence for X, unless Von Neumann had specific data about AGI that we are ignoring. He didn't; he had data about bombs and assembly lines.

  ### Summary
  You aren't missing anything; it is a potent data point. However, it updates us more strongly toward **"Technological disruption is dangerous and unpredictable"** than toward **"AGI will recursively self-improve and kill us."**

  It validates the *vibe* of the Singularity (rapid, uncontrollable change) but not necessarily the *mechanism* (FOOM/AI takeoff). It suggests that if there is a Singularity, it might look more like a societal collapse due to complexity (von Neumann's view) than a god-like AI emerging from a server farm (Kurzweil's view). Both are risky, but they require different preparations.
