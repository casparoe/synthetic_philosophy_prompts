          *   *Analysis:* This appeals to Fuller's "internal morality of law." If the system fails the 8 desiderata broadly, individual statutes might be tainted. It aligns with Fuller's view that extreme injustice/absence of procedural morality negates legal character.
          *   *Strength:* Captures the systemic nature of the Nazi perversion of justice.
          *   *Weakness:* Might conflate the specific statute with the general regime behavior.

      *   **Move (2) - Marcus:** Objects that this proves too little. The specific statute was public, prospective, and consistent. It passes Fuller's 8 criteria *on its own*. Ana is borrowing a verdict on the whole regime to invalidate a specific rule that looks formalistically valid.
          *   *Analysis:* This is a classic positivist move (and a specific critique of Fuller). It isolates the rule of recognition/validity from the moral quality of the regime. It challenges Fuller to show *which* of the 8 criteria *this specific statute* violated.
          *   *Strength:* Highlights the distinction between a valid rule within a system and the moral quality of the system.
          *   *Weakness:* Might be too atomistic. Can a rule be "law" if the system enforcing it is fundamentally arbitrary?

      *   **Move (3) - Ana:** Replies that legality is a property of a *system*, not individual statutes. A tidy rule from a terror regime doesn't inherit validity.
