answer: |-
  **The Void and the Cross: Pascal, Derrida, and the Foundation of Authority**

  Blaise Pascal's fragment L298 (Brunschvicg 298) is one of the most cited texts in political philosophy. It contains the chilling diagnosis: "Justice without force is powerless; force without justice is tyrannical." Unable to reconcile the two, humanity has made a cynical compromise: "We cannot make what is just strong, so we have made what is strong just." Jacques Derrida, in his seminal essay *Force of Law*, seizes upon this passage. He pairs it with Montaigne to argue that all law rests on a "mystical foundation of authority"—a founding violence that is neither legal nor illegal, but simply *force*, retroactively legitimized by custom. For Derrida, Pascal exposes the deconstructible nature of law: authority is grounded in an abyss.

  But was Pascal actually a proto-deconstructionist? Did he intend to reveal the ontological instability of justice, or was he performing a specific theological maneuver? To treat Pascal as a secular avant-la-lettre is to ignore the architecture of the *Pensées*. While Derrida correctly identifies the *mechanism* Pascal describes, he fundamentally misreads the *teleology*. Pascal is not arguing that justice is inherently groundless; he is arguing that human justice is *fallen*. The verdict is clear: Derrida's reading is a brilliant secular appropriation, but it is textually and philosophically wrong about Pascal's intent. Pascal does not leave us in the mystical void; he uses the void to point us to the Cross.

  To understand why Derrida's reading fails to capture Pascal, we must first acknowledge where it succeeds. Derrida argues that the moment a law is founded, it cannot appeal to a prior law to justify itself. If it did, it would be an extension of an old regime, not a new foundation. Therefore, the origin of law is a "coup de force," a performative violence that creates the very context it claims to uphold. Derrida finds this in Pascal's admission that we obey laws not because they are just, but because they are established. For Derrida, this reveals the structure of law itself: it is always haunted by the violence of its origin. There is no pure presence of justice in the legal system; there is only the endless deferral of justice through the enforcement of law.

  This reading is compelling because Pascal undeniably describes a world where authority looks exactly like this. However, Derrida treats this condition as ontological—a necessary feature of language, politics, and being. Pascal treats it as historical and theological—a symptom of the Fall.

  To see the divergence, one must engage with Pascal's doctrine of the "Three Orders." Pascal divides existence into the order of Flesh (power, wealth, force), the order of Mind (knowledge, science), and the order of Charity (God, grace, true justice). In fragment L793, Pascal notes that these orders are incommensurable: "All bodies, the firmament, the stars, the earth and its kingdoms, are not worth the lowest of minds." Crucially, force belongs to the order of Flesh. When Pascal says we have made "what is strong just," he is describing the tragic confusion of the orders. The world of the flesh operates on power; the world of charity operates on love and true justice.

  For Derrida, the gap between force and justice is unbridgeable; justice is an infinite idea that can never be incarnated in law. For Pascal, the gap is bridgeable, but not by human politics. True Justice exists objectively in the order of Charity, which is the domain of God. Human law is arbitrary not because "justice" is a metaphysical fiction, but because human nature is corrupted. Pascal's skepticism regarding earthly custom (*coutume*) is not a celebration of relativism; it is a diagnosis of *misère* (wretchedness). In fragment L94, Pascal writes that custom "is our nature." He means that after the Fall, man lost his true nature, and habit filled the void. When Pascal says law is founded on custom rather than natural reason, he is not making a linguistic point about signifiers; he is making a theological point about sin.

  This distinction is vital. If Derrida is right, the arbitrariness of law is a structural necessity we must navigate with endless ethical vigilance. If Pascal is right, the arbitrariness of law is a contingent disaster we must escape through Grace. Pascal's project in the *Pensées* is an Apology for the Christian Religion. Every skeptical argument he mounts against human reason, science, or morality is designed to humble the *libertin* reader. He dismantles the Stoic confidence in human virtue and the Skeptic confidence in nothingness to prepare the ground for faith.

  Consider Pascal's view on power. In fragment L82, he writes, "The reason why we do not believe in the true God is that we have a false one." We worship the God of power (force) because we belong to the order of Flesh. When Pascal says we made the strong "just," he is lamenting a idolatry. He is not saying "there is no justice." He is saying "you are worshipping force and calling it justice, when true justice is found only in God." Derrida stops at the critique of the idol; Pascal demands the worship of the true God.

  Furthermore, Pascal's concept of the "mystical" differs radically from Derrida's. For Derrida, the "mystical foundation" refers to the silence of the origin, the absence of a grounding signified. For Pascal, the "mystical" is the hidden God (*Deus Absconditus*). In fragment L449, Pascal states, "It is the heart which feels God, and not the reason." The foundation of authority for Pascal is not an abyss of meaning, but the will of God, which is often hidden from human reason but is nonetheless real and objective. When human laws fail to align with justice, it is not because justice is inaccessible, but because human reason is darkened.

  Derrida attempts to secularize Pascal's Jansenism. He takes the Jansenist emphasis on the hiddenness of God and the corruption of human nature and translates it into a post-structuralist emphasis on the indeterminacy of meaning and the violence of institutional power. It is a productive misreading, but a misreading nonetheless. Derrida claims Pascal as an ally in showing that law is not natural. But Pascal would reject the implication that law *cannot* be natural. In the state of Eden, before the Fall, force and justice would have been unified under God's sovereignty. The disconnect is not essential to law; it is essential to *fallen* man.

  The stakes of this distinction are high. If we accept Derrida's reading, we are left with a politics of endless negotiation, where we acknowledge the violence of our laws but strive for a "justice to come" that may never arrive. If we accept Pascal's reading, we are left with a politics of humility, where we obey earthly laws to maintain order (as necessary for the flesh) while recognizing they hold no ultimate moral weight, reserving our allegiance for the Kingdom of Charity.

  Derrida argues that Pascal reveals the "groundlessness" of law. But Pascal explicitly provides a ground: God. The problem is that this ground is inaccessible to reason alone. Pascal's skepticism is methodological, not radical. He doubts human justice so that the reader will crave Divine Justice. Derrida doubts justice so that the reader will remain vigilant against the tyranny of law. One is a path to conversion; the other is a path to deconstruction.

  Therefore, the verdict must be that Derrida is reading *against* Pascal, not *with* him. Derrida isolates the sociological observation Pascal makes—that power dictates law in the earthly realm—and elevates it to a philosophical first principle. Pascal, however, embeds this observation within a narrative of Loss and Redemption. To claim Pascal as a proto-deconstructionist is to strip the *Pensées* of its engine. Without the Fall, Pascal's skepticism is nihilism; without Grace, his humility is despair.

  Pascal does not leave us with the "mystical foundation of authority" as a final truth. He leaves us with the "mystery of Jesus." The fragment on force and justice is not a standalone treatise on political ontology; it is a step in the ladder of the Apology. It is meant to make the reader uncomfortable with the arbitrariness of their worldly attachments. Derrida wants to live in that discomfort as the condition of ethics. Pascal wants to cure the discomfort as the condition of salvation.

  Ultimately, Pascal is not deconstructing the law to save the concept of justice; he is dismantling the law to save the soul. He agrees with Derrida that earthly authority rests on a foundation that reason cannot justify. But for Derrida, that foundation is a void. For Pascal, it is a throne occupied by a God who has hidden Himself, waiting to be found not by analyzing the structure of law, but by wagering on the structure of grace. To read Pascal as a deconstructionist is to mistake the diagnosis of the disease for the prescription of the cure. Pascal shows us the wound of force to sell us the balm of faith. Derrida keeps the wound open and calls it justice. They are not allies. One is a theologian of the Fall; the other is a philosopher of the Trace. And Pascal, were he reading Derrida, would likely say that the philosopher of the Trace is precisely the kind of distracted mind that needs to be humbled by the reality of the Cross.
