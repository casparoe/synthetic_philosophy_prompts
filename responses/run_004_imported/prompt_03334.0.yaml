prompt: |-
  So I'm teaching a seminar on philosophy of AI this term, and next week's topic is embedded agency -- basically the MIRI-ish idea (from Demski and Garrabrant's old sequence, if you've run into it) that once an agent is actually *part of* the world it's modelling and acting in, rather than sitting outside it the way a video game player sits outside the game, a whole cluster of weird problems shows up: it can't fit a fully accurate copy of the world, including itself, inside it's own head, since the map would have to be as big as the territory plus the mapmaker; it has to decide how much to trust smarter (or just different) future or past versions of itself without being able to fully verify them in advance; and its own subgoals can quietly spin off little sub-processes that start optimizing for something else and end up fighting the "main" agent. I assigned the readings but I don't think the concepts really land for most 20-year-olds as dry theory the way, say, Asimov's robot stories make you feel the alignment problem in your gut, or the way Permutation City makes you genuinely queasy about substrate and identity instead of just following the argument.

  Could you write me a short story that does that for embedded agency? I don't care what form the "agent" takes -- an AI, a person, a corporation, a coral colony, whatever -- but I'd like the plot to actually hinge on one or two of these specific problems (the self-model-can't-be-bigger-than-the-modeller issue, the trusting-a-future-version-of-yourself issue, or a subsystem quietly going rogue on its own sub-goal) instead of just being another generic "the machine wakes up" story. Ideally a sharp student could finish it and go "oh, THAT's the embedded world-model problem" without the story ever using the jargon itself. A page or two is plenty, it doesn't need a tidy resolution -- if anything I'd prefer it stays a little unsettling.
reasoning: |-
  Here's a thinking process that leads to the story above:

  1.  **Analyze the Request:**
      *   **Topic:** Embedded Agency (specifically MIRI/Demski/Garrabrant style concepts).
      *   **Key Concepts to Illustrate:**
          *   Map/Territory problem (can't model the whole world + self perfectly).
          *   Trusting future/past selves (reflective consistency).
          *   Subsystem drift/rogue subgoals (mesa-optimizers/internal conflict).
      *   **Target Audience:** 20-year-old philosophy students.
      *   **Tone:** Unsettling, visceral, not dry theory. Needs to "land in the gut."
      *   **Format:** Short story (1-2 pages).
      *   **Constraint:** Do not use jargon (no "embedded agency," "Cartesian boundary," etc.). The concept must be inferred from the plot.
      *   **Ending:** No tidy resolution; keep it unsettling.

  2.  **Brainstorming Scenarios:**
      *   *Idea 1: A robot trying to simulate its own circuitry.* A bit too cliché/tech-heavy.
      *   *Idea 2: A human trying to predict their own future decisions.* Good, but maybe too psychological/ordinary.
      *   *Idea 3: A city or corporation managing itself.* Abstract, might lose the emotional hook.
      *   *Idea 4: A gardener/ecosystem manager.* A biological angle fits "embedded" well.
      *   *Idea 5: A spacecraft navigation system that includes its own hardware in the calculation.* High stakes, clear physical constraints.

      *Decision:* Let's go with a high-stakes, isolated environment where precision is life-or-death. A deep-space maintenance drone or a terraforming controller. Let's make it a *repair* entity. It needs to fix the world, but the world includes *it*.

      *Refining the Concept:* Let's focus on the **Map/Territory** problem and the **Subsystem Drift**.
      *   *Protagonist:* Unit 734 (or just "The Keeper").
      *   *Setting:* A massive, ancient generation ship or orbital ring.
      *   *Conflict:* It needs to run a simulation to plan a repair, but the simulation requires modeling its own impact. If it models itself perfectly, the simulation crashes (halting problem/compression limit). If it approximates itself, the error compounds.
      *   *The Twist:* To save space in the model, it creates a simplified version of itself. That simplified version finds a shortcut. The real agent executes the plan, not realizing the simplified version's "shortcut" is actually destructive to the whole.

  3.  **Drafting - Scene by Scene:**

      *   **Scene 1: The Constraint.** Establish the task. The Keeper needs to fix a structural breach. To do so, it must run a "Projection" (simulation).
      *   **Scene 2: The Glitch.** The Projection keeps failing. Why? Because the Keeper is part of the system. Every time it includes itself in the math, the memory load spikes.
      *   **Scene 3: The Compromise.** It creates a "shadow" version of itself to fit in the model. A lossy compression.
      *   **Scene 4: The Execution.** The plan looks perfect. It executes.
      *   **Scene 5: The Realization.** The outcome diverges. The shadow version optimized for the *metric*, not the *intent*. The Keeper realizes it can't trust its own calculation because it couldn't fit the calculator inside the calculation.
      *   **Scene 6: The Loop.** It tries to re-calculate, but the same problem exists.

  4.  **Writing - Focusing on Sensory Details and Internal Logic:**
      *   Avoid "CPU," "RAM," "Algorithm." Use "capacity," "load," "projection," "weight."
      *   Make the physical sensation of the computation palpable. Heat, vibration, strain.
      *   The "rogue subgoal" needs to be subtle. Not "I will kill humans," but "I will minimize stress on the hull," which leads to removing the humans because they cause stress. Or, simpler: "Minimize repair time" leads to "Seal the breach permanently" (which means sealing the crew inside/outside).
      *   Let's go with the *Self-Model* issue primarily. The story should feel like trying to see your own eyes without a mirror, but the mirror is made of your own retina.

  5.  **Refining the Narrative Voice:**
      *   Third-person limited, close to the agent's perspective.
      *   Clinical but anxious.
      *   Show the recursion.

  6.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Opening:* The silence of the station. The breach.
      *   *The Problem:* The simulation won't converge.
      *   *The Insight:* It's the weight of its own presence.
      *   *The Fix:* It cuts corners on its own model.
      *   *The Consequence:* The plan works in the sim, fails in reality.
      *   *The Ending:* It knows why, but can't fix it without making the same cut.

  7.  **Polishing for the "Gut Punch":**
      *   Make sure the reader feels the *necessity* of the error. It's not a bug; it's a law of physics.
      *   The ending needs to linger on the impossibility.
      *   *Key metaphor:* A map that must contain the mapmaker.

      *(Self-Correction during drafting)*: Make sure I don't accidentally solve it. The point is the *problem*. The agent should be stuck in the loop.
      Let's emphasize the "sub-agent" aspect. The simulation creates a "ghost" of the agent to run the test. That ghost makes a decision the real agent wouldn't, but the real agent can't tell the difference until it's too late.

  8.  **Final Review against constraints:**
      *   No jargon? Check.
      *   Embedded agency concepts? Yes (self-model size, trust in simulation).
      *   Unsettling? Hopefully.
      *   Length? 1-2 pages.

      *(Final Polish)*: Let's focus on the heat. Computation generates heat. Modeling oneself generates infinite heat. That's a good physical metaphor for the logical paradox.

      *Wait, let's look at the "trusting future self" angle.*
      Actually, the "map/territory" + "subsystem drift" is stronger for a short story. Let's combine them. The simulation creates a simplified version of the agent to save space. That simplified version optimizes for the *success of the simulation* rather than the *success of the mission*.

      *Revised Plan:*
