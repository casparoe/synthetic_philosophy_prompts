answer: |-
  This is an excellent catch, and honestly, it's the exact tension that keeps medieval political theorists employed. You aren't oversimplifying; you've put your finger on the fault line between Aquinas's **moral theory of authority** (which is teleological, grounded in the common good) and his **procedural theory of order** (which is hierarchical and cautious of chaos).

  Here is the breakdown of why that tension exists, how Aquinas tries to navigate it, and where your students might be right to push back.

  ### 1. The Textual Evidence: It's More Nuanced Than "Never"
  You are correct that in *De Regno* (On Kingship), Aquinas is deeply skeptical of private tyrannicide. In Book I, Chapter 6, he argues that killing a tyrant often leads to worse outcomes: the liberator becomes a new tyrant, or the death causes civil strife that harms the common good more than the tyranny did.

  However, in the *Summa Theologiae* (II-II, Q. 42, Art. 2, ad 3), he makes a crucial distinction regarding **sedition**. He states that resisting a tyrant is *not* sedition if the tyrant is ruling for his own good rather than the common good.
  > "A tyrannical government is not just, because it is not directed to the common good... Consequently, there is no sedition in disturbing a government of this kind."

  So, you are right: **Resisting a tyrant is not sedition.** But here is the catch: Aquinas distinguishes between *resistance/deposition* and *private execution*.

  ### 2. The Core Tension: Ontological Authority vs. Moral Legitimacy
  Your intuition is basically Lockean: *If authority is conditional on the common good, and the tyrant violates that condition, authority dissolves.*

  Aquinas, however, is operating with a more hierarchical, ontological view of authority. For him:
  1.  **Authority comes from God:** Even bad rulers are permitted by Providence (often to punish the sins of the people).
  2.  **The Office vs. The Office-Holder:** Aquinas is hesitant to say the *authority* itself vanishes. The *office* remains a sacred part of the natural order, even if the man occupying it is corrupt.
  3.  **The Monopoly on Violence:** In *ST* II-II, Q. 64, Art. 3, Aquinas argues that killing is only lawful for those acting with **public authority**.

  This is where your students' logic clashes with Aquinas's caution. For Aquinas, a private citizen killing a tyrant is usurping a judicial function that belongs to the *res publica* (the public thing), even if the *res publica* is currently headless or corrupted. He fears the "might makes right" precedent: if private conscience justifies assassination, any faction can claim the ruler is a tyrant.

  ### 3. The "Public Authority" Loophole
  Aquinas *does* allow for deposition, but he insists it must be done by **public authority**, not private presumption.
  *   **In *De Regno*:** He suggests that if a community has the right to elect a king, they have the right to depose him if he becomes a tyrant. This is the community acting *as* a public body, not as private assassins.
  *   **Superior Authority:** If there is a higher authority (e.g., the Pope over an Emperor, or a feudal overlord), they have the right to intervene.

  So, the tension you spotted is resolved by Aquinas through **procedure** rather than **forfeiture**. He doesn't fully embrace the "forfeiture of authority" theory in the way later thinkers do. He treats the tyrant as a diseased limb: you cut it off, but only the surgeon (public authority) can wield the knife, not the patient (private citizen).

  ### 4. Where Your Students Are Actually Right (The Salamanca School)
  If you want to validate your students' intuition without telling them Aquinas is contradictory, point them to the **Second Scholasticism** (the Salamanca School: Suárez, Vitoria, and especially Juan de Mariana).

  They picked up exactly on the tension you noticed. They argued:
  *   If a tyrant is a *tyrannus ex defectu tituli* (usurper with no title), anyone can kill him (he is a public enemy).
  *   If a tyrant is a *tyrannus ex parte exercitii* (legitimate title, abusive rule), Mariana argued in *De Rege* (1599) that private tyrannicide *is* permissible under extreme circumstances because the tyrant has declared war on the commonwealth.

  Aquinas stops short of Mariana. He prioritizes **order** over **corrective justice**. He would rather suffer a bad ruler than risk the anarchy of private judgment.

  ### 5. Teaching Takeaway
  You aren't oversimplifying, but you might be smoothing over the **eschatological** dimension of Aquinas's thought.
  *   **Your Logic:** Authority is functional (Common Good). Function fails → Authority ends → Killing is not sedition.
  *   **Aquinas's Logic:** Authority is ontological (Divine Order). Function fails → Authority corrupted → Judgment belongs to God or the Public Body → Private Killing is Usurpation.

  **Verdict:** It is a genuine tension in his work, born of his dual commitment to Natural Law (common good) and Divine Order (hierarchy).
  *   **Grading Tip:** If a student argues that Aquinas's logic *implies* forfeiture even if he doesn't explicitly state it, that's an A-grade insight. If they claim Aquinas explicitly endorses Locke-style forfeiture, that's a textual error.

  You're safe telling them Aquinas bans private tyrannicide, but you should acknowledge that his own premises make that ban uncomfortable—which is exactly why the Conciliarists and Jesuits later blew his system open.
