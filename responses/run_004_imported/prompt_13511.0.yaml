      *   **The Insight/Question:** The user notices a potential logical tension: If authority is grounded in the common good, a tyrant (who rules for self-interest) forfeits that authority. If they have no authority, isn't killing them *not* sedition? Is this a real tension in Aquinas, or is the user oversimplifying?
      *   **Goal:** Provide a nuanced analysis of Aquinas's position on tyrannicide, addressing the logical tension, textual evidence, and scholarly interpretations.

