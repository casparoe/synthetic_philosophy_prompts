          *   *Summa Theologiae (II-II, Q. 42, Art. 2):* Discusses sedition. Resisting a tyrant isn't sedition *if* it's for the common good. But who does the resisting?
          *   *Summa Theologiae (II-II, Q. 64, Art. 3):* Killing is reserved for public authority.
      *   **The "Forfeiture" Theory:** Does Aquinas explicitly say authority is forfeited? Not exactly in the Lockean sense. He sees authority as ontologically real but morally corrupted. The *office* remains even if the *man* fails.
      *   **The Public/Private Distinction:** This is the crux. Even if the ruler is bad, the *mechanism* of removal must be public. Why? To avoid anarchy and the "might makes right" problem.
      *   **The "Public Authority" Loophole:** Aquinas *does* allow for deposition, but it must come from a superior authority (e.g., the Pope for an emperor, or the community acting *as* a public body, not as private individuals).
