      *   *Standard Interpretation:* Aquinas is generally cautious. He distinguishes between a tyrant *ex defectu tituli* (no title) and *ex parte exercitii* (abuse of power).
      *   *The "Forfeiture" Argument:* The user's intuition aligns with later Scholastics (Suárez, Mariana) and Locke, but does it align with Aquinas?
      *   *Sedition:* Sedition is opposed to the unity of the multitude. If the tyrant breaks the unity, is resisting him sedition? Aquinas says usually no, *but* private killing is problematic.
      *   *Key Distinction:* Public vs. Private authority. Even if the tyrant is illegitimate, who has the right to execute judgment?

  3.  **Deconstruct the Tension:**
      *   *Premise 1:* Authority comes from God for the common good.
      *   *Premise 2:* A tyrant rules for private gain, not common good.
      *   *Conclusion:* Therefore, the tyrant lacks authority.
      *   *Counter-Conclusion (Aquinas):* Therefore, private citizens cannot kill him.
