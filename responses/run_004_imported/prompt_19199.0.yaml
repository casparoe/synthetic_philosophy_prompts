answer: |-
  Here is the argument you were looking for. It is drafted as a direct continuation of your dinner conversation, picking up the thread where you left off.

  ***

  **The Verdict: Why We Should Drop Truth Conditions Rather Than Distort Them**

  You're right that the embedding objection is the non-cognitivist's burden. But you're wrong to think it's a fatal one, and you're wronger still to think that Stalnaker's or Jackson's ways out are cheaper. Lewis's 1976 proof isn't just a puzzle to be solved; it's a boundary marker. It tells us that the class of propositions is too small to contain the content of indicative conditionals. Stalnaker and Jackson try to squeeze conditionals into that class anyway, but they do so by breaking the very features that made truth-conditional semantics attractive in the first place.

  Here is why the Adams-Edgington line is the only one that respects the data without distorting the metaphysics.

  ### 1. The Trap: What Lewis Actually Proved
  Let's be precise about the cost of the Adams Thesis (AT): $P(A \to B) = P(B|A)$.

  Lewis showed that if we assume (1) AT holds, and (2) $A \to B$ expresses a standard proposition $X$ (a set of worlds with a fixed truth value), then absurdity follows.
  The proof hinges on conditionalization. If $X$ is a proposition, we can update on it. Consider the probability of $X$ given $B$. If $B$ is true, and $X$ is true whenever $A$ and $B$ are both true (which AT requires), then $P(X|B)$ must be high. Specifically, Lewis shows that for AT to hold across all credence functions, it must be that $P(X|B) = 1$ and $P(X|\neg B) = 0$.
  By the law of total probability:
  $$P(X) = P(X|B)P(B) + P(X|\neg B)P(\neg B)$$
  Substituting the values required by AT:
  $$P(A \to B) = 1 \cdot P(B) + 0 \cdot P(\neg B) = P(B)$$
  But AT says $P(A \to B) = P(B|A)$. Therefore, $P(B|A) = P(B)$.
  This implies $A$ and $B$ are probabilistically independent. Since clearly not all indicatives involve independent antecedents and consequents, one of the assumptions must go.

  We have three choices:
  1.  **Deny AT.** (Jackson)
  2.  **Deny that $X$ is fixed across updates.** (Stalnaker)
  3.  **Deny that $X$ is a proposition at all.** (Adams-Edgington)

  ### 2. The Jackson Cost: Truth Without Point
  Jackson keeps truth conditions by identifying $A \to B$ with the material conditional $A \supset B$. He saves AT by reinterpreting it as a rule of *assertability*, not truth. We assert $A \to B$ only when $P(B|A)$ is high, even though its truth condition is just $\neg A \lor B$.

  The cost here is semantic idleness. In a truth-conditional framework, the point of assigning truth conditions is to explain rational belief: we aim to believe what is true. But on Jackson's view, the truth condition of a conditional plays *no role* in determining whether it is rational to believe it. I can know that $A \supset B$ is true (because I know $\neg A$), yet be completely irrational in asserting or believing "If A, then B."

  If the truth conditions do not govern rational acceptance, why call them truth conditions? They are philosophical zombies. They do no work in the theory of meaning or mind. Jackson saves the letter of truth-conditionalism by killing its spirit. He gives us a semantics where the "truth" of a conditional is irrelevant to its use. That is a high price for preserving a technicality.

  ### 3. The Stalnaker Cost: The Loss of Disagreement
  Your defense of Stalnaker is that we can keep AT and truth conditions if we let the proposition $X$ shift with the credal state. When I update on $B$, the content of "If A, then B" changes, so Lewis's substitution fails.

  But consider your own objection from dinner: **Disagreement.**
  Truth-conditional semantics is attractive because it explains how we disagree. If I say "The cat is on the mat" and you say "No, it isn't," we are contradicting ourselves about a single state of affairs.
  On Stalnaker's view, the content of my conditional depends on my credal state, and the content of your denial depends on yours. If our credal states differ, the *propositions* we are entertaining differ.
  Stalnaker has a pragmatic story about "common ground" to patch this, but it requires us to believe that when we argue about conditionals, we are secretly negotiating a context shift rather than describing the world. It turns the semantics of conditionals into a psychology of the interlocutors.

  This concedes the main point of the non-cognitivist: that conditionals are not primarily about the world, but about our stance toward the world. Stalnaker just dresses that stance up in the clothing of "shifting propositions." If the proposition shifts when my credence shifts, then the conditional isn't tracking a worldly fact; it's tracking my epistemic perspective. If it's tracking my perspective, why not just admit it expresses a perspective (a conditional belief) rather than a proposition? Stalnaker buys truth conditions at the price of making them radically context-dependent, effectively surrendering the idea that conditionals have stable truth-evaluable content.

  ### 4. The Embedding Objection: The Non-Cognitivist Reply
  Now, to your strongest point: Embeddings. You argued that if conditionals have no truth value, they cannot be negated, disjoined, or embedded in antecedents. "You can't negate a command," you said. "So you can't negate a conditional."

  This was the standard objection in 1976. It is no longer decisive. Here is the Adams-Edgington response, updated for modern expressivism:

  **A. Logic without Truth:**
  We do not need truth values to have a logic. We need a definition of *validity*. Adams redefined validity not as truth-preservation, but as *uncertainty-preservation*. An argument is valid if, whenever the premises are highly probable (or have low uncertainty), the conclusion must also be highly probable.
  On this definition, Modus Ponens works for simple conditionals. Crucially, this explains why some classical inferences feel wrong. For example, McGee's counterexamples to Modus Ponens involving nested conditionals make perfect sense on Adams' semantics but are anomalies for truth-conditional views. If truth conditions were the gold standard, McGee's cases would be paradoxes. On the suppositional theory, they are predicted features.

  **B. Handling Negation and Disjunction:**
  When I say $\neg(A \to B)$, I am not ascribing falsity to a proposition. I am expressing a refusal to adopt the conditional belief. In many contexts, $\neg(A \to B)$ is equivalent to committing to $A \to \neg B$. This is not a truth-functional negation, but it is a coherent move in the space of reasons.
  Similarly for disjunction: $(A \to B) \lor (C \to D)$. On the expressivist view, this is understood as a constraint on the credal state: "Your credal state must be such that either $P(B|A)$ is high or $P(D|C)$ is high."
  Recent work in *inquisitive semantics* and *expressivist semantics* (e.g., Yalcin, Mandelkern) has formalized this. They treat the content of a conditional not as a set of worlds (a proposition), but as a *constraint on information states*. Embeddings work because information states can be nested. A conditional in the antecedent of another conditional simply sets up a supposition within a supposition.

  **C. The "Extra Steps" Charge:**
  You said I was "restating Edgington with extra steps." That's the point. Edgington was right. The "extra steps" truth-conditionalists take (shifting propositions for Stalnaker, idle truth for Jackson) are the ones that lack motivation.
  If I say "If it rains, the match is cancelled," I am not describing a "rain-cancel" world. I am telling you: *in the event of rain, expect cancellation.*
  When that sentence appears in a complex structure ("If if it rains the match is cancelled, we should go home"), I am not describing a proposition about a proposition. I am telling you: *if your conditional expectation is such that rain implies cancellation, then we should go home.*
  This is slightly more complex than classical logic, yes. But it is metaphysically lighter. It does not posit "Stalnaker propositions" that vanish upon conditionalization, nor "Jackson truths" that are irrelevant to belief.

  ### 5. The Final Verdict
  Lewis's triviality result is a *reductio* of the assumption that indicative conditionals express propositions.
  *   **Jackson** keeps the proposition but admits it doesn't guide belief. (Cost: Semantics becomes disconnected from rationality.)
  *   **Stalnaker** keeps the proposition but admits it changes when the believer changes. (Cost: Semantics becomes unstable and disagreement becomes opaque.)
  *   **Adams-Edgington** drops the proposition. (Cost: We must revise our logic to be probabilistic rather than truth-functional.)

  The third cost is the only acceptable one. Revising logic to match the phenomenology of uncertainty is progress. Distorting the nature of content to save classical logic is conservatism.

  We should follow Adams and Edgington because they take the *function* of the conditional seriously. The function is to guide suppositional reasoning. Truth-conditionalism tries to force that function into a box labeled "Fact." Lewis proved the box is too small. Stalnaker suggests we shrink the fact; Jackson suggests we ignore the fit. The honest move is to throw away the box.

  Conditionals do not have truth conditions. They have *acceptability conditions*. And that is enough to do all the work we need them to do, embeddings included, without the metaphysical baggage of propositions that cannot exist.
