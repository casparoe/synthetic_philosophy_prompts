      *   *Question 7: Comparison with Rivals.* Stalnaker or Material Implication.
          *   *Draft:* Why not Stalnaker?
          *   *Refinement:* Stalnaker saves truth conditions by sacrificing the Probability Thesis. Why is your sacrifice better than his?
          *   *Follow-up:* She will say Probability is more central to reasoning. Push on whether truth is *also* central to assertion.

      *   *Question 8: Metaphysics of the "Gap".*
          *   *Draft:* What *are* conditionals if not true/false?
