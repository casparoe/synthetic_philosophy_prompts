          *   *Follow-up:* She will likely say it's a harmless idealization or a pragmatic shorthand. Push on the normative aspect: if I argue using conditionals, am I reasoning with shadows?

      *   *Question 3: Embedding/Negation (Required Topic).* The technical hurdle.
          *   *Draft:* How do you handle "It's not the case that if A then B"?
          *   *Refinement:* Focus on the "no proposition" problem. If it's not a proposition, it shouldn't be embeddable. But it is.
          *   *Follow-up:* She might distinguish indicative from embedded contexts or use a probabilistic logic. Push on whether this fragments the logic.

      *   *Question 4: Validity/Modus Ponens (Required Topic).* The logic question.
          *   *Draft:* What happens to Modus Ponens without truth?
          *   *Refinement:* Focus on *what is preserved*. Uncertainty? Degree of belief?
          *   *Follow-up:* She will likely talk about uncertainty preservation. Push on the accumulation of uncertainty in long arguments.

      *   *Question 5: The Ramsey Test.* Connect back to the psychological origin.
          *   *Draft:* Ramsey said we add A to our stock. Is this psychological or logical?
          *   *Refinement:* Is the Ramsey Test a description of processing or a normative rule?
          *   *Follow-up:* If it's normative, why does it clash with truth? If descriptive, why build a logic on it?

      *   *Question 6: Disjunctions and McGee Cases.* Specific embedding/validity overlap.
