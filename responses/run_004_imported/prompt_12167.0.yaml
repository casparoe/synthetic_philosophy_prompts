answer: |-
  Here are ten interview questions designed for a philosopher of language defending the 'no truth value' (NTV) or suppositional theory of indicative conditionals, complete with follow-ups keyed to the standard defenses of that position.

  ### 1. The Triviality Trap
  **Question:** You treat Lewis's triviality results not as a puzzle to be solved, but as a reductio of the assumption that conditionals have truth conditions. But one could argue that triviality results only show we must choose between the Equation ($P(\text{If } A, C) = P(C|A)$) and truth-conditions. Why is preserving the Equation worth the cost of abandoning truth conditions entirely, rather than, say, accepting that our intuitive probability judgments about conditionals are simply mistaken?

  **Follow-up:** You'll likely argue that the Equation is too central to reasoning to discard. But if we discard truth conditions, do we lose the ability to explain *why* the Equation works so well? Or are you suggesting the Equation is the fundamental norm, and truth is the derivative notion that simply doesn't apply here?

  ### 2. The Error Theory of Ordinary Discourse
  **Question:** Let's talk about the cost to the ordinary speaker. In everyday life, people assert conditionals, deny them, and say things like, "That's true." On your view, when a jury foreman says, "It is true that if the defendant was at the scene, he is guilty," they are making a category mistake. Are you committed to an error theory of ordinary language, and doesn't that make your semantics descriptively inadequate?

  **Follow-up:** I anticipate you'll say this is a harmless idealization, similar to how we treat "The sun rises." But unlike the sun, conditionals are the primary vehicles of legal and scientific argument. If the law relies on truth-apt premises for verdicts, does your view imply that legal reasoning involving conditionals is fundamentally flawed?

  ### 3. The Embedding Problem (Negation and Disjunction)
  **Question:** Standard semantics relies on compositionality: the meaning of a complex sentence is a function of its parts. If 'If A, then C' lacks a truth value, it shouldn't function as a propositional constituent. Yet we comfortably say, "Either if it rains the match is cancelled, or if it snows the match is cancelled." How does your account handle disjunctions or negations of conditionals without smuggling truth conditions back in through the syntax?

  **Follow-up:** You will likely distinguish between the surface grammar and the logical form, perhaps suggesting these embeddings are elliptical or pragmatic. But if the logical form of "Not (If A, C)" isn't the negation of a proposition, what *is* it? Are we forced to say that negation operates on speech acts rather than content?

  ### 4. Validity Without Truth-Preservation
  **Question:** Classically, an argument is valid if it is impossible for the premises to be true and the conclusion false. If conditionals cannot be true or false, truth-preservation cannot be the metric of validity. What replaces it? Are we talking about preservation of degree of belief, or preservation of assertibility?

  **Follow-up:** If you say validity preserves *high probability* or *low uncertainty*, doesn't this make validity degree-theoretic and potentially non-transitive? If I chain ten valid arguments together, each preserving high probability, can I still end up with a conclusion I ought to reject?

  ### 5. Modus Ponens and the McGee Counterexamples
  **Question:** Vann McGee famously used nested conditionals to argue that Modus Ponens fails for indicatives. Since your view already rejects truth conditions, you might be more comfortable abandoning Modus Ponens than a truth-conditionalist. Do you accept that Modus Ponens is invalid for indicative conditionals, and if so, how do we reason safely without it?

  **Follow-up:** If you concede that Modus Ponens can fail, doesn't that cripple hypothetical reasoning? If I can't assume 'If A, then B' and 'A' entails 'B', how do I plan for the future? Is your account of validity robust enough to support counterfactual planning?

  ### 6. The Ramsey Test: Psychology or Norm?
  **Question:** Your position leans heavily on the Ramsey Test: to evaluate 'If A, C', we hypothetically add A to our stock of beliefs and evaluate C. Is this a psychological claim about how humans *do* process conditionals, or a normative claim about how we *should*? If it's psychological, why build a logic on it? If it's normative, where does the norm come from if not from truth?

  **Follow-up:** You'll likely say it's a norm of rationality derived from probability theory. But if the Ramsey Test conflicts with truth-conditional intuition (as Lewis showed), are you asking us to rewire our cognitive architecture? Is the 'no truth value' view a description of language or a proposal for a new one?

  ### 7. Comparison with Stalnaker
  **Question:** Robert Stalnaker preserves truth conditions by accepting possible worlds semantics, but he must deny the Equation in certain cases to avoid triviality. You do the reverse. Why is your sacrifice better than his? Is there a pre-theoretical intuition—perhaps about assertion or betting—that decisively favors your side over Stalnaker's?

  **Follow-up:** Stalnaker might argue that without truth conditions, you can't explain disagreement. If I assert 'If A, C' and you deny it, what are we disagreeing about if not a fact of the matter? How does your account capture the phenomenon of contradiction without truth values?

  ### 8. Nested Conditionals
  **Question:** You mentioned embedding, but nested conditionals like "If A, then if B, C" are particularly troublesome. If the consequent 'If B, C' has no truth value, how can it be the output of a supposition 'A'? Does your view require that nested conditionals collapse into simple ones (e.g., 'If A and B, then C'), and if so, does that match our intuitive usage?

  **Follow-up:** If you argue for the Import-Export principle (collapsing the nest), aren't you vulnerable to the triviality results all over again? How do you navigate the tension between handling nested conditionals naturally and avoiding the collapse that Lewis proved fatal?

  ### 9. Decision Theory and Action
  **Question:** We use conditionals to make decisions: "If I take this job, I will be happy." If this sentence isn't true or false, what is the object of my belief when I act on it? Can I rationally act on a supposition that I acknowledge has no truth value, or does successful action require a belief that the conditional *corresponds* to reality?

  **Follow-up:** You will likely invoke Jeffrey Conditionalization or similar decision-theoretic tools. But doesn't action require a binary commitment (do it or don't), whereas your semantics offers only a gradient of probability? How do you bridge the gap between probabilistic conditionals and categorical actions?

  ### 10. The Future of the Debate
  **Question:** It has been fifty years since Lewis's triviality results. The field is still split between truth-conditionalists and no-truth-value theorists. Why do you think the debate has stalled? Is it possible that both sides are capturing different halves of a dual-natured phenomenon, or is this a case where one side must eventually surrender?

  **Follow-up:** If you believe the truth-conditionalists are ultimately mistaken, what empirical or logical development do you foresee that would finally convince them? Or is this a philosophical stalemate where the choice ultimately comes down to which theoretical cost one is more willing to bear?
