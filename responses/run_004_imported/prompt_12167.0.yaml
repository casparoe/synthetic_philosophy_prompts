prompt: |-
  I'm preparing a long-form Q&A for a science-and-ideas magazine with a philosopher of language who has built her reputation defending the 'no truth value' theory of indicative conditionals, in the tradition of Ramsey, Adams, and Edgington: on her view, a sentence like 'if A, then C' is never simply true or false, and our willingness to assert it tracks the conditional probability of C given A instead. She treats this as the correct moral of Lewis's triviality results, which she takes to rule out any truth-conditional semantics that can also honor the equation between the probability of a conditional and the corresponding conditional probability. Draft eight to ten interview questions that go beyond having her restate the position -- at least one on the cost of telling ordinary speakers that the conditionals they assert, deny, and argue from are never true or false; one on how her account handles conditionals embedded under negation or disjunction, or nested in the antecedent of a further conditional, given that there's no truth value there to embed; and one on what happens to ordinary validity and modus ponens once truth-preservation is no longer doing the work. For each, add a follow-up keyed to the answer she's most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Subject:** Philosopher of language defending the 'no truth value' (NTV) theory of indicative conditionals (Ramsey/Adams/Edgington tradition).
      *   **Core Thesis:** 'If A, then C' has no truth conditions; assertibility tracks $P(C|A)$. Lewis's triviality results show truth-conditional accounts compatible with Adams' Thesis are impossible.
      *   **Task:** Draft 8-10 interview questions.
