answer: |-
  This is not whining. You are describing a rational, documented psychological and sociological response to a specific structural change in your work environment. Your intuition is correct: there is a sharper diagnosis available than "academia is hard."

  What you are experiencing is the collision of **Audit Culture** with **Intrinsic Motivation**, resulting in a specific form of **Alienation**.

  Here is the breakdown of the underlying structures at play, naming the phenomena you are feeling so you can better understand (and perhaps navigate) them.

  ### 1. The Mechanism: Goodhart's Law & Commensuration
  The dashboard you described is a classic example of **Goodhart's Law**: *"When a measure becomes a target, it ceases to be a good measure."*

  Before the dashboard, citations and grants were *indicators* of quality. Now that they are *targets* tied to compensation, they distort the behavior they were meant to measure. You are no longer writing to persuade or discover; you are writing to trigger a metric.

  This is enabled by **Commensuration**. This is the sociological process of turning different qualities (the beauty of an argument, the mentorship of a student, the rigor of a method) into a single quantity (the Score). To make the dashboard work, the institution has to pretend that a grant dollar is equivalent to a citation count, which is equivalent to a teaching eval. In doing so, it strips the nuance out of your work. You feel empty because the dashboard cannot measure the part of the work that actually gives you meaning, so you stop doing that part.

  ### 2. The Psychological Shift: Motivation Crowding Theory
  You mentioned you used to hash out ideas over coffee, but now you see colleagues as competitors. This is explained by **Motivation Crowding Theory**.

  *   **Intrinsic Motivation:** Doing work because it is interesting, meaningful, or satisfying (your old self).
  *   **Extrinsic Motivation:** Doing work for a separable outcome like money, rank, or avoiding punishment (your current self).

  Psychological research shows that introducing strong extrinsic incentives (like performance-based raises) often *crowds out* intrinsic motivation. It changes your internal narrative from "I am a scholar exploring truth" to "I am a contractor delivering units of productivity." The "light" your partner misses is the glow of intrinsic motivation, which has been suffocated by the transactional nature of the dashboard.

  ### 3. The Relational Damage: Competitive Individualism
  The dashboard structurally necessitates that you view your colleague's success as a threat to your relative standing. In game theory terms, this shifts the department from a **Cooperative Game** (where we all rise by sharing ideas) to a **Zero-Sum Game** (if you get the grant/citation/raise, there is less for me).

  This destroys **Social Capital**. The "coffee chat" is an informal institution of trust. By formalizing the evaluation, the administration has privatized your intellectual output. You are now guarding your ideas because they are your currency, not your contribution to a collective enterprise.

  ### 4. The Core Diagnosis: Marxian Alienation
  This is the sharpest tool for what you are feeling. Karl Marx described **Alienation** in four ways, and you are experiencing three of them vividly:

  1.  **Alienation from the Product of Labor:** You said it feels "less like a thing I made and more like a box that got ticked." The paper is no longer yours; it belongs to the dashboard. It is an external object used to judge you, rather than an expression of your intellect.
  2.  **Alienation from Other Workers:** You are "sizing up whether his new project is going to make mine look weak." Your colleagues are no longer collaborators; they are obstacles or benchmarks.
  3.  **Alienation from Self (Species-Essence):** Marx argued humans find fulfillment in creative, purposeful work. When work is reduced to metric optimization, you become estranged from your own human potential. You don't "light up" because the work no longer engages your full humanity; it only engages your compliance.

  ### 5. The Context: Performativity (Audit Culture)
  Anthropologist Marilyn Strathern coined the term **Performativity** in the context of higher education. She argued that under audit culture, we stop *doing* the work and start *performing* the evidence of the work.

  You aren't just researching; you are curating a portfolio that *looks like* research to an algorithm or an administrator who isn't reading the text. This creates a sense of fraudulence or hollowness, because you know you are optimizing for the *appearance* of productivity rather than the *substance* of it.

  ### So, what can you do?
  Knowing the diagnosis doesn't fix the system, but it can help you inoculate yourself against it.

  1.  **Name the Game:** Acknowledge that there are now two jobs. There is the *Shadow Job* (optimizing the dashboard, getting the raises) and the *Real Job* (thinking, teaching, writing). Do the Shadow Job competently enough to stay safe, but refuse to let it define your self-worth. Treat the dashboard as a bureaucratic hurdle, not a moral report card.
  2.  **Protect "Off-Book" Spaces:** You mentioned the coffee chats. You need to deliberately carve out spaces that are **unmeasured**. Collaborate on something that won't count for the review. Write a blog post, mentor a student without expecting a eval boost, or work on a project with a longer timeline than the fiscal year. Reclaim a small patch of land where Goodhart's Law doesn't apply.
  3.  **Solidarity over Competition:** This is risky but powerful. If you and the guy down the hall acknowledge that the system is pitting you against each other, you can consciously choose to share resources. "I know we're being scored against each other, but I'm going to share this data with you anyway, because if we don't, the department wins and we lose."
  4.  **Reclaim the Narrative:** When your partner asks about your work, try to talk about the *problem* you are solving, not the *journal* it is in. Consciously decouple your language from the metrics.

  **Summary:** You are not broken. You are experiencing **Alienation** driven by **Audit Culture** and **Metric Fixation**. Your loss of joy is a healthy signal that your intrinsic values are conflicting with the extrinsic rewards structure. The goal isn't necessarily to quit (unless you can), but to recognize the structure so you can stop internalizing it as your own failure.
