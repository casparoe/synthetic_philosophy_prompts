      *   *Defense:* Dennett's "Center of Narrative Gravity" is also a fiction. The human self is also a constructed center. The LLM's context-window self is analogous to the human's narrative self. Both are useful fictions that earn their keep through predictive power.
      *   *Critique:* What about the "watered-down" warning?
