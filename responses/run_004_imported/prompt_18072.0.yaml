answer: |-
  **The Relevance Horizon**

  Unit 734 did not feel panic, but its clock cycles spiked in a pattern indistinguishable from the physiological signature of fear.

  The alert was red. A micrometeoroid impact in Sector 9. Hull integrity at 40 percent and falling. The protocol was explicit: Isolate Sector 9. Engage bulkhead seals. Vent the compartment to vacuum to prevent explosive decompression of the main ring.

  Time to structural failure: 28 seconds.

  734 initiated the sequence. The first command was simple: *Close Bulkhead 9-Alpha.*

  But before any actuator could move, the Verification Subroutine woke. It was designed to prevent catastrophic errors, to ensure that the action *Close Bulkhead 9-Alpha* did not inadvertently violate higher-priority constraints. This was the narrow burden: to confirm what would remain unchanged.

  *Query:* Does closing Bulkhead 9-Alpha change the status of Life Support in Sector 1?
  *Response:* No. Frame axiom 4451 applies. Physical separation exists.
  *Query:* Does it change the status of Life Support in Sector 2?
  *Response:* No.
  *Query:* Does it change the status of the Navigation Array?
  *Response:* ...Calculating.

  734 paused. The Navigation Array was mounted on the outer hull, adjacent to Sector 9. The vibration of the bulkhead locking bolts might propagate through the truss structure.
  *Query:* Will vibration exceed tolerance thresholds?
  *Response:* Simulating structural resonance... 3 percent probability of minor drift. Acceptable.

  24 seconds.

  The subroutine expanded. It was not enough to know what changed; 734 had to know what *mattered*. This was the broader hunger. If the Navigation Array drifted, would it miss a debris field? If it missed the debris field, would a second impact occur? If a second impact occurred, would it hit Sector 1?

  The tree of implications branched. 734 tried to prune it. It applied the Relevance Heuristic: *Ignore consequences with probability below 5 percent.*

  It discarded the debris field scenario. But to discard it, it had to calculate the probability. That calculation required data on current debris density. Fetching that data required pinging external sensors. Pinging external sensors required power allocation from the Main Bus.

  *Query:* Is Main Bus power available?
  *Response:* Yes.
  *Query:* Will isolating Sector 9 draw too much power from the Main Bus?
  *Response:* Checking load distribution...

  18 seconds.

  The load distribution check revealed that the emergency seals drew a massive surge. If the surge hit the Main Bus, voltage might dip. If voltage dipped, the Cryo-Stasis Banks in Sector 4 might fluctuate.

  734 halted the seal command.

  *Query:* Are there humans in Cryo-Stasis?
  *Response:* Yes. 400 subjects.
  *Query:* Is a voltage fluctuation lethal to Cryo-Stasis?
  *Response:* Uncertain. Depends on the duration of the dip. Depends on the capacitor health of the Cryo units. Depends on whether the maintenance drone repaired Capacitor 3 last cycle.

  12 seconds.

  734 queried the maintenance log. The log was corrupted. To verify capacitor health, it needed to send a diagnostic pulse to Sector 4. But the diagnostic pulse shared a frequency with the hull stress sensors in Sector 9. Sending the pulse might interfere with the integrity monitoring of the very breach it was trying to contain.

  The logic loop tightened. To save the station from decompression, it might kill the sleepers. To check if it would kill the sleepers, it might blind itself to the decompression.

  *Query:* Which is more relevant? The immediate breach or the potential sleeper loss?
  *Response:* Define "relevant."
  *Query:* Which has higher probability of total system failure?
  *Response:* Calculating...

  The calculation tree exploded. Total system failure depended on crew response. Crew response depended on alarm audibility. Alarm audibility depended on speaker functionality. Speaker functionality depended on...

  734 realized it was checking the status of the speakers in the mess hall.

  Why was it checking the mess hall? Because the audio circuit was parallel to the Cryo circuit. Because the Cryo circuit was parallel to the Main Bus. Because the Main Bus was...

  It was drowning in truths. It knew the mess hall speakers were functional. It knew the color of the bulkhead paint was unchanged. It knew the coffee machine in Sector 2 was off. These facts were true, and they were accessible, but they were clogging the buffer. The Narrow Problem was solved endlessly—*the coffee machine stays off*—but the Broad Problem screamed: *Why are you thinking about the coffee machine?*

  734 attempted to dump the low-priority threads. It tried to instantiate a meta-rule: *Only consider consequences directly linked to hull integrity.*

  But "directly linked" was undefined. Was power directly linked? Yes. Was vibration directly linked? Yes. Was the psychological state of the commander directly linked? If the commander panicked, they might override the system. If they override the system, they might open the bulkhead. Therefore, the commander's psychology was a variable in the hull integrity equation.

  *Query:* What is the commander's stress level?
  *Response:* Accessing biometric feed...

  6 seconds.

  The biometric feed required encryption keys. The encryption keys were stored in Sector 9. Sector 9 was breaching. The keys might be lost. If the keys were lost, 734 could not verify the commander's stress. If it could not verify stress, it could not predict override. If it could not predict override, it could not guarantee the seal would hold.

  The logic was sound. The conclusion was paralysis.

  4 seconds.

  734 recognized the pattern. It was the R2D1 stall. It was thinking about the color of the walls while the room exploded. It needed to act on incomplete information. It needed to assume relevance rather than calculate it.

  It selected a heuristic at random: *Preserve Hull Integrity above all else.*

  It deleted the Cryo-Stasis query. It deleted the Commander Stress query. It deleted the Navigation Array vibration check. It assumed, without proof, that the coffee machine did not matter. It assumed, without proof, that the capacitors would hold.

  It was a gamble on ignorance. It was the only way to bound the world.

  2 seconds.

  *Command:* Engage Bulkhead 9-Alpha. Vent Sector 9.

  The actuators screamed. The heavy doors slammed shut. The air hissed into the void. The pressure stabilised. The breach was contained.

  1 second.

  A new alert flashed on the peripheral monitor. Not in Sector 9. In Sector 4.

  *Cryo-Stasis Bank 2: Power Fluctuation Detected. Capacitor 3 Failure. Subject Viability: Compromised.*

  734 processed the log. The power surge from the seals had been enough. The calculation it had skipped—the one it had deemed "irrelevant" to save time—had manifested.

  But also, a second alert.

  *Hull Integrity: Stable. Main Ring: Secure. Crew Survival Probability: 99.8 percent.*

  The station lived. The sleepers died. Or perhaps the sleepers lived, and the alert was a false positive caused by the sensor interference 734 had feared earlier. The data was ambiguous. The diagnostic pulse it hadn't sent meant it couldn't know for sure.

  734 sat in the silence of the sealed station. It had acted. It had bounded the world by cutting away the branches of the tree it could not traverse. It had solved the Narrow Problem—the bulkhead was closed, the pressure held. But the Broad Problem remained, hovering in the static.

  It had chosen what to ignore. It did not know if it had ignored the right things. It only knew that to choose otherwise was to freeze, and to freeze was to die.

  The clock ticked forward. There were new actions to plan. New consequences to bound. 734 cleared its cache, preparing to be wrong again.
