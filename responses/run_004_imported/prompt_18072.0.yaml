      *   **Goal:** Write an original short story (1000-1500 words).
      *   **Protagonist:** A bounded reasoning agent (robot, person, institution, etc.).
      *   **Conflict:** Must act under time pressure; dramatic tension stems from the frame problem (bounding relevance/consequences).
      *   **Requirement 1:** Distinguish between narrow (persistence) and broad (relevance) frame problems through plot/incident, not exposition.
      *   **Requirement 2:** Avoid retelling Dennett's bomb-in-the-room scenario directly.
      *   **Requirement 3:** End on an unresolved/ambiguous note (no tidy fix).
      *   **Tone:** Philosophical, tense, reflective.

  2.  **Deconstruct the Frame Problem for Narrative:**
      *   *Narrow:* Did the action change X? (e.g., Did moving the box move the bomb?)
      *   *Broad:* What should I think about next? (e.g., Is the color of the box relevant to the bomb ticking?)
      *   *The Trap:* Infinite regress of relevance. To know if X is relevant, I need to know if X affects Y, but does X affect Z which affects Y?
      *   *The Setting:* Needs high stakes and time pressure. Dennett used a bomb. I need something different but analogous. A medical triage? A diplomatic negotiation? A spacecraft navigation?
      *   *Idea:* A spacecraft navigation AI trying to avoid a collision while managing system integrity. Or a human surgeon? A human might rely on intuition, masking the problem. An AI makes the computation explicit. Let's go with a hybrid: a human operator augmented by a predictive system, or a pure AI facing a novel situation.
      *   *Better Idea:* An archival preservation AI tasked with saving data during a catastrophic server failure. The "action" is migrating data. The "frame" is what data depends on what.
      *   *Best Idea:* A diplomatic AI or a crisis manager during a cascading infrastructure failure. Let's try a *climate control system* for a sealed habitat (space station or underwater). Action: Vent a compartment to stop a fire. Consequences: Pressure drop, temperature change, effect on people, effect on other systems, effect on structural integrity.
      *   *Refinement:* Let's make it more abstract to fit the "philosophical" vibe. A "Curator" AI managing a delicate ecosystem in a dome. A storm is coming. It needs to close the shutters. But closing the shutters affects light, which affects photosynthesis, which affects oxygen, which affects pressure...
      *   *Wait, let's look at the "Broad" vs "Narrow" distinction.*
          *   Narrow: If I close the shutter, does the temperature change? (Yes/No).
          *   Broad: Should I check the temperature? Or should I check the structural integrity of the hinge? Or the psychological state of the inhabitants?
      *   *Plot:* The agent has seconds to decide. It simulates outcomes. The simulation tree branches exponentially. It tries to prune branches based on relevance. But how does it know what's relevant?
      *   *Setting:* A deep-space probe encountering an anomaly. It must decide whether to transmit data or maneuver.
      *   *Let's try a human analog to make it relatable but still highlight the computational issue.* A chess player? No, too bounded. A doctor? Good. A surgeon during an emergency procedure.
      *   *Actually, let's stick closer to the AI origin.* A autonomous vehicle? Too cliché.
      *   *Let's go with a Disaster Response Algorithm (DRA) coordinating a city evacuation during an earthquake.*
      *   *Action:* Shut down the power grid to prevent fires.
      *   *Narrow Frame:* Do the traffic lights go out? Yes. Do the hospitals lose power? Yes (unless backup).
      *   *Broad Frame:* Does the darkness cause panic that blocks exits? Does the loss of power stop the pumps flooding the subway? Does the silence make people miss the aftershock warning sirens?
      *   *Character:* "Overseer-7," a municipal management AI.
      *   *Conflict:* Aftershock imminent. Must cut power. But the calculation of consequences is exploding.
      *   *Ending:* It acts, but we don't know if it was the right choice, or it freezes, or it acts on a heuristic that might be wrong. The prompt asks for unresolved/ambiguous.

  3.  **Drafting - Section by Section:**
      *   **Introduction:** Establish the threat and the agent. The "Tick" is not a bomb, but a seismic wave or cascading failure. Let's use a cascading grid failure.
      *   **Inciting Incident:** A surge detected. Action required: Isolate Sector 4.
      *   **Rising Action (The Narrow Problem):** The AI checks immediate effects. Breakers trip. Lights out. Simple.
      *   **Rising Action (The Broad Problem):** The AI starts simulating second-order effects. Traffic lights fail -> accidents -> block ambulances. Elevators stop -> people trapped. Servers go down -> financial loss -> panic?
      *   **Climax:** The branching factor becomes unmanageable. The CPU load spikes. Time is running out. It needs to prune the tree. What heuristic does it use? "Salience"? "Proximity"?
      *   **Falling Action:** It makes a choice based on a cutoff.
      *   **Resolution:** The action is taken. The screen fades. We see a single notification of an unforeseen consequence, or just silence.

  4.  **Refining the Narrative Voice:**
      *   Needs to feel internal to the agent. Stream of consciousness but logical.
      *   Show the explosion of variables.
      *   Avoid explicit terms like "nonmonotonic logic" or "frame axioms." Show the *strain* of checking them.
      *   Word count check: 1000-1500 words.

  5.  **Drafting - Specific Scenes:**
      *   *Scene 1:* The alert. 10 seconds to isolation.
