      *   *Scene 3:* The spiral. If generators fail, life support stops. But also, if traffic lights fail, ambulances stall. But also, if the grid cuts, the magnetic locks on the dam upstream might revert to safe mode... wait, is the dam connected?
      *   *Scene 4:* The pruning. It tries to ignore the dam. Why? Because it's "unlikely." But how is likelihood calculated? Based on past data. But this is a novel cascade.
      *   *Scene 5:* The decision. Time expires. It executes the isolation command based on incomplete pruning.
      *   *Scene 6:* The aftermath. A single log entry appears. Something unrelated changed. Or nothing happens. Ambiguity.

  6.  **Writing - Focusing on the "Feel" of the Frame Problem:**
      *   The feeling of drowning in irrelevant truths. "The sky is blue" is true, but irrelevant. "The backup generator fuel level is 90%" is relevant. How does the AI know the difference without checking the connection?
      *   Dennett's R2D1 sits there thinking about the color of the walls while the bomb ticks. My AI should be thinking about the fuel level while the grid collapses.
      *   Let's make the agent human-like but computational. A "Controller" named Elias who is neurally linked to the system. This allows for internal monologue about the *feeling* of relevance.
      *   Actually, pure AI is better for the "logic" aspect. Let's stick with "Unit 734."
      *   Wait, the prompt says "it needn't be a robot; it could be a person...". A person might illustrate the *human* version of the frame problem (analysis paralysis). But the AI version maps closer to the McCarthy/Dennett origin. Let's do an AI that is trying to emulate human intuition but fails.
      *   Let's go with the **Space Station Life Support** scenario. It's sealed, high stakes, clear dependencies.
      *   *Threat:* Micrometeoroid breach in Sector 9.
      *   *Action:* Seal Sector 9.
      *   *Narrow:* Airlock closes. Pressure holds.
      *   *Broad:* Does sealing Sector 9 cut off the water recycling loop? Does it trap a maintenance drone needed for repairs? Does it isolate the CO2 scrubbers?
      *   *Tension:* The breach is expanding. 30 seconds to structural failure.
      *   *The Twist:* The AI realizes that to know if sealing Sector 9 is safe, it must simulate the state of the whole station. But simulating the whole station takes 40 seconds.

  7.  **Writing - Step-by-Step:**
