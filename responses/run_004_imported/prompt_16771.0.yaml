answer: |-
  **Moderator:** We have time for one last exchange. Marcus, you had your hand up.

  **Marcus (Vagueness):** Thanks. I'm sympathetic to the claim that the clarinetist and the lawyer aren't related by "better than," "worse than," or "equally as good as." But I'm worried you're multiplying entities without necessity. Your entire case rests on the Small-Improvement Argument. You say if they were equal, a slightly improved clarinetist career would be better than the lawyer career. Since it isn't, they aren't equal. But this assumes "better than" has sharp boundaries. If "better than" is vague, then even if the careers are equally good, a small improvement might not cross the threshold into determinate betterness. The trichotomy fails not because of a fourth relation, but because the existing relations are indeterminate.

  **Elena (Parity):** But that indeterminacy comes at a cost, Marcus. If "better than" is vague, then it's indeterminate whether the improved clarinetist is better than the lawyer. But in hard choices, it's not indeterminate that the improvement *counts*. We know the extra salary matters. Parity captures this: the options are comparable—they're in the same normative neighborhood—but neither trumps the other. Vagueness suggests a defect in the world or our language. Parity suggests a distinct normative structure. If you rely on vagueness, you imply we shouldn't be able to choose rationally because the truth values are missing.

  **Marcus:** Not at all. Vagueness doesn't imply incomparability. It just means there's no fact of the matter about which is better. But you can still choose for reasons. My point is about the Small-Improvement Argument specifically. You claim that if A and B are equal, A+ must be better than B. But if "better than" is vague, there's a range where A and B are borderline equal, and A+ and B are borderline better. The inference fails because the predicate is sensitive to small changes without snapping into a new truth value. You don't need parity to block the inference; you just need to deny precision.

  **Elena:** I deny that vagueness blocks the inference in the way you need. If A and B are on a par, I can choose either without error. If they are vaguely equal, choosing A seems to risk choosing something determinately worse if I'm on the wrong side of the borderline. But the phenomenology of hard choices isn't about epistemic risk; it's about normative freedom. The Small-Improvement Argument shows that A and B are *determinately* not equal, because A+ is *determinately* not better than B. If you say "it's vague whether A+ is better," you lose the grip on why the choice is hard rather than just unclear.

  **Marcus:** But why is "determinately not equal" plus "determinately not better" anything other than vagueness? You're positing a sui generis relation to do the work of a borderline case. Occam's Razor cuts against parity. If I say "better than" is vague, I explain the failure of the trichotomy and the failure of the small-improvement inference with one tool. You use vagueness *plus* a new relation. Furthermore, if parity is sui generis, does it chain? If A is on a par with B, and B with C, is A on a par with C? Vagueness handles chaining naturally through sorites; parity risks intransitivity.

  **Elena:** Parity chains within a "neighborhood" of value, which explains why hard choices are local. But look at the stake: if you're right, rational choice in these cases is impossible because there's no truth to track. If I'm right, rational choice is possible because parity is a truth-maker for comparability. The Small-Improvement Argument reveals that we *can* compare them—we know the improvement doesn't tip the scale—but vagueness says we can't compare them precisely. I'm saying we can compare them precisely, just not via the trichotomy.

  **Marcus:** And I'm saying that "comparing precisely without the trichotomy" is just a description of vagueness without the name. If there's no sharp line where A+ becomes better than B, then it's not true that A+ is better, nor true that it isn't. That accommodates your data without the ontological expense. You feel the need for parity because you want rational choice to be determinate. I'm suggesting rational choice survives indeterminacy.

  **Elena:** But survival isn't enough. We want justification. Parity provides a positive relation that grounds commitment. Vagueness leaves us hovering.

  **Marcus:** Or it leaves us free to create reasons where the world runs out. But that's a topic for another colloquium.

  **Moderator:** I'm afraid that's all we have.
