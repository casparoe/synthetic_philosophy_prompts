answer: |-
  The word Elias used was "horizon," but he pointed at the garage. Mara didn't correct him. She simply handed him the keys.

  It had started six months ago, a slow slippage in the architecture of his speech. At first, it was merely cute, the kind of tired mix-up any couple shares. *Pass the salt* became *pass the sand*. But then the errors developed a rhythm, a logic that belonged only to him. He began to speak in a dialect of one, where words were chosen not for their definition but for their texture, their sound, or some private association that vanished the moment he finished speaking.

  Mara sat across from him at the kitchen table. The morning light was too bright, sharpening the shadows under his eyes. He was trying to tell her about the dream he'd had.

  "It was loud," Elias said. "The blue was very loud."

  Mara paused, her coffee cup halfway to her mouth. *Blue.* He often used colors for emotions now. Blue wasn't sadness; lately, blue had been anxiety. Or was it noise? Last week, the siren outside had been "a red scream." She had to hold her own dictionary open while listening to his, watching for the moment the pages aligned.

  She couldn't assume he was wrong. If she assumed he was mistaken, she stopped listening to *him* and started listening only to the error. So she assumed he was making sense. She had to. If she didn't, there was no bridge.

  "Loud blue," she repeated, testing the weight of it. "Was it the sky?"

  "No," Elias said, frustrated. He tapped his chest. "Inside. The blue was inside. It was pressing."

  *Panic,* Mara translated. *He had a panic attack in the dream.*

  "It pressed on you," she said.

  "Yes. Like a wall. Like a... horizon." He used the word again, this time meaning *barrier*.

  Mara felt the familiar exertion, the mental muscle flexing. She wasn't just decoding words; she was recalibrating her expectation of who he was in this specific second. She had to construct a temporary version of Elias—a version who used "horizon" for "barrier" and "blue" for "panic"—and inhabit it fully enough to catch what he threw. If she clung to the old Elias, the one who spoke the Queen's English, she would lose him. They would be shouting across a void, each holding a map of a different territory.

  "I understand," she said. "The horizon was closing in."

  Elias exhaled, his shoulders dropping. The tension vanished. He hadn't been understood because she knew his words; he was understood because she had adjusted her mind to meet his.

  Later, the phone rang. It was his sister, calling from another state. Mara handed him the handset. She watched him talk. He was struggling. She could hear the sister's voice rising in confusion on the other end, sharp with the friction of mismatched codes.

  "No, Elias, I don't know what you mean by 'the winter is broken,'" the sister said. "Are you cold? Is the heater out?"

  Elias looked at Mara, helpless. *Broken winter* meant *depression*, or maybe *grief*. It meant the season of sadness had lost its structure. But his sister was waiting for a literal repairman. She was waiting for the shared code to work, and when it didn't, she blamed the signal.

  Mara took the phone. "He means he's having a hard time, Linda. The season feels wrong to him."

  "Oh," Linda said, her voice cooling slightly. "Why didn't he just say that?"

  Mara hung up. She looked at Elias. He looked small, diminished by the failure of the common tongue.

  "He expects you to use the public map," Mara said softly.

  "It is the public map," Elias insisted, tapping the table. "I am using the words. They are the words."

  And in that moment, Mara saw it. The terrifying simplicity of it. She looked at her husband, really looked at the mechanism of his struggle, and then she looked out the window at the neighbor walking his dog.

  The neighbor waved. Mara waved back. She thought about the last time she had spoken to him. They had talked about the weather. *Nice day,* he had said. *Sure is,* she had replied.

  *Nice.* What did *nice* mean? It meant not raining. It meant temperate. It meant *I acknowledge your presence without demanding intimacy.* It meant *I am safe.*

  She realized she had never known exactly what anyone meant, not truly. With Elias, the gap was visible, a jagged crack she had to step over. With everyone else, the gap was just hidden under the smooth pavement of habit. She had always been building a temporary theory of her neighbor, just as she was building one for Elias. She assumed her neighbor was rational, that his words cohered with the world, that he intended sense. She adjusted on the fly when he used irony, or sarcasm, or when his mood shifted the weight of a syllable.

  There was no shared language. There was only this constant, frantic improvisation. There was only the work of converging, for a moment, on a single point of meaning before drifting apart again.

  With Elias, the work was heavy, visible, exhausting. With the world, it was invisible, automated, seamless. But the machinery was the same. They were all speaking private languages, colliding and negotiating, pretending they shared a code because the alternative was too lonely to bear.

  Elias reached across the table and took her hand. He squeezed it three times.

  *Love,* Mara thought. Or maybe *Thanks.* Or maybe *Stay.*

  She squeezed back. She didn't need to know which word it was. She only needed to know that, for now, they were speaking the same silence.
