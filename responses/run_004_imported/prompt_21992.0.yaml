answer: |-
  Here is a toast that hits that sweet spot. It's warm enough for your grandma, specific enough for your teacher, and philosophically sound without using a single piece of jargon.

  **Time:** Approx. 2 minutes at a conversational pace.
  **Tone:** Sincere, slightly reflective, but celebratory.

  ***

  **The Toast**

  "Hi everyone. For those who don't know me, I've had the privilege of being Jess's best friend since freshman year.

  If you asked Jess, she'd tell you that for the last four years, my primary form of communication has been a text message sent at 11 PM that says, *'Okay, be honest: is this messed up, or is it just me?'*

  I know that, theoretically, relying on someone else to tell you what's right or wrong is… complicated. We're supposed to find our own moral compass, right? It feels different than just trusting a doctor about a prescription. It feels like something you're supposed to figure out on your own.

  But here's what Jess taught me: She never actually gave me the answers.

  When I was spiraling about a decision, or unsure if I was being a good friend, or trying to navigate something messy, she didn't just say 'yes' or 'no.' She asked me questions. She helped me untangle my own gut feelings until I could hear my own voice again. She didn't let me outsource my conscience to her; she helped me polish my own.

  So, Jess, thank you. Thank you for being the person I could trust when I couldn't trust myself. But more importantly, thank you for never letting me stay there. You helped me become the person who can make those calls on my own.

  To Jess: may your future be as clear as you helped make my past. Cheers."

  ***

  ### Why this works for your specific situation:

  1.  **The "Philosophy Nod":** The second paragraph acknowledges the **Moral Testimony debate** (that moral deference feels problematic compared to factual deference) without using the terms "deference" or "testimony." Your teacher will catch the reference immediately.
  2.  **The "Agency" Solution:** The core philosophical objection to moral testimony is that it undermines **moral agency** (you aren't virtuous if you just do what you're told). By saying *"She didn't let me outsource my conscience... she helped me polish my own,"* you are arguing that her testimony was **transformative** rather than **deferential**. You aren't claiming blind trust is fine; you're claiming she helped you build the capacity to judge for yourself.
  3.  **The "Grandma/Bro" Safety:** To the non-philosophers, this just sounds like a really beautiful description of supportive friendship. They won't feel lost; they'll just feel the warmth.
  4.  **The "Blind Trust" Avoidance:** You explicitly state she *didn't* give you answers, which sidesteps the critique that you're just following orders.

  Good luck with the toast (and the class)!
