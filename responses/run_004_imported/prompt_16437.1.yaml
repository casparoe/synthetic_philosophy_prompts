  8.  **Final Polish:** Check against all constraints.
      *   Actual rule? Yes.
      *   Take Camp B seriously? Yes.
      *   Philosophy of language included? Yes.
      *   Memo format? Yes.

  **(Self-Correction Note):** I need to make sure I don't sound *too* academic. The user reads philosophy for fun, but the audience is entomologists. Keep the philosophy accessible. Focus on the *function* of language.

  Let's finalize the rule: "The Common Name Integrity Standard."
  Criteria:
  1. Is the term widely recognized as a slur?
