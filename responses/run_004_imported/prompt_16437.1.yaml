answer: |-
  **MEMORANDUM**

  **TO:** Common Names Committee, [Name of Entomological Society]
  **FROM:** [Your Name], Retired Fellow
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for a Derogatory Association Standard (DAS) regarding Common Names

  **Introduction**

  As we reconvene to address the backlog of species names under review, I want to acknowledge the genuine stalemate we face. On one side, we have colleagues who argue that any term historically used as a slur against a human group must be removed from our nomenclature immediately. On the other, colleagues argue that applying human social taboos to insect taxonomy is categorical overreach—that a name attached to a moth or a weed does not constitute an act of discrimination against people.

  Having spent 40 years in this field and recently spent my retirement studying the philosophy of language, I believe this deadlock stems from talking past one another about how language works. We are debating whether the "harm" of a slur is in the *word itself* (semantics) or in the *speaker's intent* (pragmatics).

  This memo proposes a middle path. It acknowledges that our intent as scientists is rarely malicious (addressing the "overreach" concern) while recognizing that common names function as public tools, not just internal labels (addressing the "harm" concern). I propose we vote on a specific **Derogatory Association Standard (DAS)** rather than a blanket ban or a case-by-case intuition pump.

  **The Philosophical Context: Intent vs. Impact**

  The argument that "it's just a bug" relies on a pragmatic view of language: words are tools, and a tool is only dangerous if wielded with malice. If no entomologist intends to insult the Roma people when saying "gypsy moth," then no insult occurs.

  However, common names are not solely for entomologists. They are for educators, park rangers, policymakers, and the public. In public discourse, the *history* of a word often travels with it, regardless of the speaker's intent. This is the semantic view: some words carry a "stain" that transfers to whatever they describe.

  We do not need to agree on the philosophy to agree on the policy. We simply need to agree on the *function* of a Common Name. Its function is to facilitate communication and engagement. If a name creates a barrier to engagement for a segment of the public because it echoes a slur, the name has failed its function, regardless of our scientific intent.

  **Addressing the "Overreach" Concern**

  To my colleagues concerned about a slippery slope: I agree that we should not sanitize history unnecessarily, nor should we police words that merely *sound* like slurs but are not (e.g., homonyms or terms with distinct etymological roots). A blanket rule that says "remove any word ever used offensively" is indeed unworkable and ahistorical.

  We must distinguish between a word that *is* a slur and a word that is being *used* as a label. The "Gypsy" in "Gypsy Moth" was not chosen because the moth is Roma; it was chosen using a term that *is* a slur. The harm lies in the normalization of the slur, not in the characterization of the moth.

  Therefore, this proposal does not ask us to judge the moral character of the scientists who coined these names decades ago. It asks us to judge the current utility of the name in a modern society.

  **The Proposal: Derogatory Association Standard (DAS)**

  I move that the committee adopt the following rule for reviewing existing and proposed common names. This rule is binary and evidence-based, removing the need for subjective "judgment calls" on individual feelings.

  **Rule Text:**
  *A common name shall be recommended for retirement if it meets both of the following criteria:*

  1.  *Etymological Link:* The name is derived from, or directly incorporates, a term that has been historically used as a pejorative or slur against a specific ethnic, religious, racial, or cultural group.
  2.  *Contemporary Recognition:* That term is currently recognized as offensive by major civil rights organizations, included in hate-speech databases, or flagged as derogatory in standard lexicographical references (e.g., Oxford English Dictionary, Merriam-Webster).

  *If both criteria are met, a replacement name shall be sought. If only one criterion is met (e.g., the word is archaic but not currently recognized as a slur, or is a homonym with no etymological link), the name shall be retained.*

  **Why This Rule Works**

  1.  **It avoids the "Blanket Ban" trap:** It does not remove words simply because someone, somewhere, found them offensive. It requires *contemporary recognition* and *etymological proof*. This protects us from chasing ghosts.
  2.  **It validates the "Just a Bug" argument:** It acknowledges that we are not changing the name because the moth is guilty of discrimination. We are changing it because the *label* is inefficient for public communication.
  3.  **It creates a clear voting mechanism:** We are not voting on feelings; we are voting on whether a word meets Criterion 1 and Criterion 2. This is verifiable data.

  **Implementation Example**

  *   **Case:** "Gypsy Moth"
      *   *Criterion 1:* Yes, "Gypsy" is a pejorative for Roma people.
      *   *Criterion 2:* Yes, recognized as derogatory by major civil rights groups and dictionaries.
      *   *Result:* Rename (Already done).
  *   **Case:** A hypothetical "Kaffir Corn" (using a South African slur)
      *   *Criterion 1:* Yes.
      *   *Criterion 2:* Yes.
      *   *Result:* Rename.
  *   **Case:** A hypothetical "Bugger Wasp" (UK slang, potentially offensive but context-dependent)
      *   *Criterion 1:* Debatable etymology.
      *   *Criterion 2:* Not universally flagged as a hate slur in lexicographical references in a scientific context.
      *   *Result:* Retain, pending further review.

  **Conclusion**

  We are scientists. We value precision. When a common name carries baggage that distracts from the organism itself, it introduces noise into our communication with the world.

  This proposal allows us to act with integrity without accusing our predecessors of malice. It allows us to acknowledge that while a moth cannot be racist, a human language can be. By adopting the Derogatory Association Standard, we clear the backlog with a consistent, defensible metric that respects both the dignity of human groups and the rigor of our scientific process.

  I request this rule be placed on the agenda for a vote at next month's meeting.

  Respectfully,

  [Your Name]
  [Contact Info]
