          *   Explain **Source Incompatibilism** (the deeper issue they might be missing). The real fight isn't about alternatives, it's about *origination*.
      *   **Jury Duty Connection:** Briefly tie it back to the legal context (mens rea, coercion vs. determination).
      *   **Conclusion:** Encouraging closing.

  6.  **Refining the Tone:**
      *   Avoid being overly pedantic.
