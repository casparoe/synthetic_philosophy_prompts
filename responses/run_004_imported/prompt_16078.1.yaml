answer: |-
  Friends, family, colleagues.

  For thirty years, I had the privilege of calling [Name] my friend. I am a biologist by trade, though I came to the questions she loved later in life. She came to them immediately, and she never wavered.

  To the world, [Name] was a paradox. She spent her life mapping the physiology of color vision. She published papers on wavelength discrimination, on opponent processes, on the neural circuitry of hue. She did this with a precision that commanded the respect of the greatest minds in her field. And she did it while living in a world without color herself.

  She had congenital achromatopsia. From her first breath to her last, her visual world was one of light and shadow, of texture and form, of brilliant, sharp contrast. But no red, no green, no blue.

  There is a famous thought experiment in philosophy about a scientist named Mary. Mary knows every physical fact there is to know about color, but she has never seen it. The question is: when she finally sees red, does she learn something new? Does she discover a fact that science left out?

  [Name] often joked that she was the real-life Mary. But she was serious about the answer. She believed that when you know the physics, the biology, and the function, you know the truth of the thing. She held that what she lacked was not a secret fact about the universe. She lacked a skill. She lacked the ability to recognize, to remember, to imagine. To her, understanding color was not about having a private, inner experience that science couldn't touch. It was about knowing how the machinery worked. And she knew the machinery better than anyone.

  She was a physicalist, not because it was the fashionable view, but because it was the honest one. She believed that the universe is made of matter and energy and law, and that our minds are the brilliant, complex way that matter understands itself. She did not believe there were ghosts in the machine.

  Because she understood this so clearly, she left us with specific instructions for today. She told her family plainly: no one is to stand here and say that she "can finally see red now."

  I know that phrase is meant to be comforting. It is meant to suggest that a limitation has been lifted. But to [Name], that phrase would have sounded like an admission of defeat. To say she finally sees is to say that her science was incomplete. To say she finally sees is to say there was a truth waiting for her that her life's work could not reach.

  She did not believe that. She believed she already knew the truth. She believed her work was complete.

  So, we will not say she sees now. Instead, we will say that she saw clearly then.

  She saw the structure of things. She saw the connections between a photon and a neuron. She saw the beauty in a rigorous argument. She saw the needs of her students and the vulnerabilities of her friends. Her world was not grey, as people sometimes assume. It was rich. It was distinct. It was full of the colors of the intellect and the heart, which do not require cones in the retina to perceive.

  I will miss her. I will miss the way she could dismantle a flawed argument with a single, quiet question. I will miss the way she laughed at her own irony. But I will not mourn her as someone who was waiting to be made whole. She was whole.

  She taught me that you do not need to stand in the light to understand the sun. You only need to understand the physics of the star, and the warmth on your face. She had the physics. She had the warmth.

  We lay her to rest not with the hope that she will finally know what she did not know, but with the gratitude that she taught us what she did. She knew the world exactly as it was, and she loved it exactly as it is.

  Rest well, my friend. The work is done. The map is complete.
