answer: |-
  Here are ten interview questions designed for your podcast, tailored to a self-taught but rigorous audience. They move from the practical motivation you mentioned into the technical metaphysics, ensuring your guest defends the nuance of her position rather than reciting a textbook definition.

  ### Part 1: Admissibility and Circularity

  **1. The Forecaster's Dilemma**
  "I want to start where my own journey began: looking at election forecasts or weather models. These experts give us a single number—say, a 70% chance of Candidate A winning. But an election is a one-off event; it doesn't repeat. When you defend the Principal Principle, you're arguing that our rational belief should match these objective chances. But for the self-taught listener trying to apply this: how do we justify treating a unique political event as having an 'objective chance' in the Lewisian sense, rather than just a measure of our own ignorance?"

  *   **Follow-up:** "If the answer is that we treat the *model* as the chance setup, does that mean the Principal Principle is actually a norm about how to trust models, rather than a metaphysical link between the world and our minds?"

  **2. Defining "Admissible"**
  "Lewis tells us the Principal Principle holds only when we possess 'admissible' evidence—roughly, evidence that doesn't give us crystal-ball access to the outcome. But critics have long worried that defining admissibility is tricky. If we define admissible evidence as 'evidence that doesn't reveal the future,' aren't we just defining it as 'evidence that allows the Principal Principle to work'? Does this worry strike you as a substantive philosophical problem, or just a terminological one?"

  *   **Follow-up:** "If it is circular, does that undermine the Principal Principle's status as a fundamental norm of rationality? Or is all rationality ultimately circular in this way, resting on definitions we simply have to accept?"

  ### Part 2: The Big Bad Bug

  **3. Introducing the Bug**
  "I'd like to move to what Lewis famously called the 'Big Bad Bug.' For the listeners who know Lewis was a Humean—believing chances supervene on the total pattern of actual events—can you explain why this creates a conflict? If the future determines the chances, but the chances are supposed to guide our beliefs about the future, where does the contradiction actually bite?"

  *   **Follow-up:** "So the worry is that if I defer to the current chance, I might be deferring to a probability that the future itself will prove impossible? Is that a fair way to put the 'undermining' problem?"

  **4. Rationality in a Humean World**
  "If the Big Bad Bug is real, it seems to suggest that in a Humean world, it is literally impossible for a rational agent to satisfy the Principal Principle. That's a heavy cost. Do you view this as a *reductio ad absurdum* of Humeanism, or do you think we have to accept that perfect rational deference to chance is unattainable in our actual world?"

  *   **Follow-up:** "If we accept it's unattainable, are we forced to say that forecasters and pollsters are being irrational when they ask us to trust their single numbers? I'm trying to understand the practical fallout of this metaphysical bug."

  ### Part 3: The Fix (The New Principle)

  **5. Conditionalizing on the Theory**
  "The standard response to the Bug, which Lewis eventually adopted, is to tweak the principle. Instead of conditionalizing on the proposition that 'the chance is X,' we conditionalize on the *entire theory of chance* being true. Does this 'New Principle' actually solve the undermining worry, or does it just relocate the problem by making the object of our credence much more complex?"

  *   **Follow-up:** "If we have to conditionalize on the whole theory, does that make objective chance inaccessible to anyone who doesn't know the true theory of physics? It seems to raise the bar for 'rational credence' incredibly high."

  **6. Epistemic vs. Ontic Shift**
  "One worry about this fix is that it blurs the line between objective chance and subjective confidence. If what I'm deferring to is my confidence in a *theory* about chances, haven't we quietly turned objective chance into an epistemic notion? Is there a way to implement the fix while keeping chance firmly out in the world, rather than in our theories?"

  *   **Follow-up:** "If we can't keep it out in the world, does that matter? For a pragmatist or a forecaster, does it make a difference if the 'chance' is a feature of reality or a feature of our best model of reality?"

  ### Part 4: Non-Humeanism and the Future of PP

  **7. The Non-Humean Sidestep**
  "I want to play devil's advocate for a non-Humean view. If chances are primitive propensities that *don't* supervene on the future history, the Big Bad Bug seems to vanish. The future can't undermine a propensity that exists right now. Do you think a non-Humean could accept the original Principal Principle without any of these fixes, and if so, does that suggest the trouble lies with Humeanism rather than the Principle itself?"

  *   **Follow-up:** "If the Principal Principle works 'out of the box' for non-Humeans, why do you think so many philosophers, including Lewis, were so committed to saving it within a Humean framework? What is Humeanism offering that's worth this much technical gymnastics?"

  **8. The Cost of Primitivism**
  "However, the cost of that non-Humean view is positing 'primitive propensities,' which many find metaphysically spooky. You've built your career defending the Principle within a more naturalistic framework. Is the Principal Principle robust enough to survive without these spooky propensities, or do we eventually have to choose between a clean metaphysics and a clean norm of rationality?"

  *   **Follow-up:** "So, are you saying we should keep the Principal Principle even if we have to modify it, because the alternative is giving up on the idea that the world guides our beliefs at all?"

  ### Part 5: Conclusion

  **9. Alternatives to Deference**
  "For the self-taught listeners who might find these metaphysical fixes too costly: are there competing norms of rationality they should know about? If someone rejects the Principal Principle because of the Bug or the circularity worries, what replaces it? Do we just fall back on Bayesian updating without a chance anchor?"

  *   **Follow-up:** "If we drop the anchor of objective chance, do we risk solipsism, where our probabilities are only about our own internal consistency and not about the world outside?"

  **10. Advice for the Amateur**
  "Finally, returning to my audience: many of them are like me, reading Lewis in their spare time and trying to make sense of the numbers they see in the news. If they take away one thing from your defense of the Principal Principle, how should they interpret that '70% chance of rain' tomorrow? Should they treat it as a fact about the clouds, a fact about the meteorologist's theory, or a command to their own belief?"

  *   **Follow-up:** "And if the meteorologist turns out to be wrong, does that mean the chance was wrong, or that their theory of chance was wrong? I think that distinction is where our listeners will get stuck."
