answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I've known the Honorable [Friend's Name] since our PhD days, back when we were teaching Intro to Ethics to undergraduates who mostly wanted to know if cheating on exams was *really* wrong. She lasted three years in philosophy before she realized that arguing about the good life was less urgent than actually structuring it. She went to law school. I stayed in the seminar room. But we kept having dinner.

  And if you know [Friend's Name], you know that dinner inevitably turned to one specific thinker. Blaise Pascal. Specifically, the fragment on justice and force.

  She gave me a warning when she asked me to speak. She said, "If you get up there and talk about Lady Justice holding her scales serenely above the fray, blind to power and custom, I will know you are lying. And half the room will know it too."

  She's right. To talk about justice as if it floats above power is a fairy tale. Pascal's point—the one we hashed out over so many glasses of wine—is much harder. He observed that justice without force is powerless; it is ignored by the wicked. But force without justice is tyrannical; it is hated by the good. We would like to marry the two. But we can't. We cannot make what is just automatically strong. So, as Pascal says, we have settled for making what is strong count as just.

  Now, to the family members here: I know that sounds cynical. It sounds like "might makes right." But to the lawyers and judges in the room, you know the burden of what that actually means.

  Pascal isn't saying power is good. He's saying that peace is necessary. The alternative to accepting established authority isn't perfection; it's a war of everyone against everyone, where every citizen privately relitigates every law until the courts collapse into chaos. We agree to obey the law not because every statute is divine, but because the alternative is violence. We accept the force of the state so that we don't have to use force against each other.

  That is a heavy, unsettling realization to build a career on. Most people want to believe they are serving the Angels. [Friend's Name] knew she would be serving the State.

  And that is why she is the right person for this robe.

  Because she knows that the gavel is not a magic wand. She knows that when she sentences, or rules, or sustains, she is wielding the very force Pascal warned us about. She knows that the authority of this court rests on a fragile agreement: that we will trust her to wield that force as if it were justice, even when we are tired, or angry, or afraid.

  A lesser person might find that depressing. A cynic might find it convenient. But [Friend's Name] finds it solemn.

  She understands that since we cannot make justice strong on its own, we have appointed *her* to make strength just. That is the alchemy of this office. It is not about being blind to power. It is about staring power in the face and disciplining it. It is about taking the raw force of the state—the police, the bailiffs, the incarceration, the fines—and filtering it through reason until it looks enough like justice that we can all sleep at night.

  I have watched her prepare for this. I have seen her grapple with the fact that the law is a human thing, written by flawed hands, enforced by flawed institutions. She doesn't pretend otherwise. She doesn't pretend the scales are perfectly balanced by God. She knows she has to hold them steady with her own hands, every single day.

  So, I am not going to wish you impartiality, [Friend's Name]. You are human; you are not impartial. I am not going to wish you serenity. This work is not serene; it is fraught.

  Instead, I wish you the courage to hold the tension. May you never forget that the force behind your rulings is real, and that the trust placed in you is fragile. May you remember that we obey the law not because it is perfect, but because you are there to ensure it is honorable. And may you always remember that while justice without force is powerless, force without a conscience is a monster.

  We are not asking you to be an angel. We are asking you to be a Judge. And knowing you, knowing the weight you give to that distinction, I think we are in safe hands.

  Congratulations.
