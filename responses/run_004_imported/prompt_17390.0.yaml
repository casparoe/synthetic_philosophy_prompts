prompt: |-
  My cousin's getting married in a few weeks and I somehow ended up on toast duty (long story, I'm closer to her than her actual siblings). Here's the complication: she and her fiancé met in the same modal metaphysics PhD program, and for basically their entire relationship they've had this running bit where one of them says something sappy like "there's no possible world where I don't end up with you," and the other one very deliberately ruins the moment. She's a died-in-the-wool Lewisian — counterpart theory, no object exists in more than one world, "you" in some other world is really just a counterpart who resembles you along whatever dimensions happen to be contextually relevant, so strictly speaking there's no metaphysical "you" out there for her to be reunited with. Her fiancé is Team Kripke — transworld identity, you don't need a similarity metric to know it's really you in another world, you just stipulate it, which is basically the whole point behind Kripke's objection to Lewis (something about how the actual Hubert Humphrey couldn't care less whether some Humphrey-resembling guy wins an election in a different world, because that guy isn't him). I've absorbed enough of this from years of holiday dinners to follow the argument, but I'm not a philosopher myself, so I don't fully trust myself to get the details right without help.

  What I want is a toast, maybe three or four minutes, that's actually structured around this disagreement instead of just name-dropping it once as a joke — and that ends up being a genuinely sincere, romantic thing to say about these two specific people rather than either (a) a straight, uncomplicated "you'll be together in every possible world" line, which is exactly the sentence they'd each independently object to for their own technical reasons, or (b) a dry seminar on the metaphysics of modality that leaves the room cold. It also has to actually work as a toast for my aunt, the flower girl's parents, and everyone else who has never heard the word "counterpart" used this way in their life. Can you write it?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for a cousin.
      *   **Speaker:** Cousin (close to the bride, closer than her siblings).
      *   **Audience:** Mixed (philosophers, family, non-philosophers). Needs to be accessible but accurate enough for the couple.
      *   **Key Theme:** The couple's relationship dynamic revolves around a specific philosophical debate: Modal Metaphysics (David Lewis's Counterpart Theory vs. Saul Kripke's Transworld Identity).
      *   **The Bride:** Lewisian (Counterpart Theory). Believes objects exist in only one world. "You" in another world is just a similar counterpart, not *you*.
      *   **The Groom:** Kripkean (Transworld Identity). Believes in rigid designators. You *are* you across worlds, stipulated by origin/identity, not just similarity.
      *   **The Dynamic:** One says something sappy ("No possible world where I don't end up with you"), the other ruins it with technical pedantry.
      *   **Goal:** A 3-4 minute toast that uses this disagreement as the *structure*, avoids the technical pitfalls (doesn't say the sappy line straight), remains sincere/romantic, and is understandable to laypeople.

  2.  **Deconstruct the Philosophy (for accuracy):**
      *   *Lewis (Bride):* Actualism. Worlds are concrete but isolated. I am only *here*. Any "me" elsewhere is a *counterpart*. Love is about *this* specific counterpart relation in *this* world.
      *   *Kripke (Groom):* Transworld identity. We can talk about *this* person in different circumstances. "Nixon could have lost." It's still Nixon. Love is about the *essence* of the person persisting.
      *   *The Conflict:* The sappy line "There's no possible world where I don't end up with you" fails for Lewis (because *you* aren't there) and arguably for Kripke (because if it's *necessary*, it removes contingency/choice, though Kripke is more about identity than determinism).
      *   *The Resolution:* How to make this romantic?
          *   Lewisian angle: We are here, now, in *this* world. This is the only one that matters. The concreteness of *this* moment.
          *   Kripkean angle: It is *you*, essentially. Not just someone like you.
          *   Synthesis: Regardless of the metaphysics, the *actual* world is where we are. The commitment is actual.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role, the relationship, and the "inside joke." Set the stage without alienating the grandma in the front row.
      *   **The Problem:** Explain the "sappy line" problem. Why the standard wedding vow ("forever," "every world") doesn't work for them. Use simple analogies (mirror images vs. traveling).
      *   **The Bride's View (Lewis):** Focus on *here and now*. The uniqueness of this specific reality. The value of *this* life they are building.
      *   **The Groom's View (Kripke):** Focus on *identity*. It's not just anyone; it's *him*. The essential connection.
      *   **The Synthesis/Toast:** Bring it together. The metaphysics doesn't matter as much as the *actual*. The "Actual World" is the one we live in.
      *   **Closing:** Raise a glass.

  4.  **Refining the Tone:**
      *   *Humor:* Needs to be warm, not mean. The pedantry is a love language for them.
      *   *Accessibility:* Avoid jargon like "rigid designators" or "mereological sum" unless immediately explained. Use "copies" vs. "traveling."
      *   *Sincerity:* The punchline needs to be emotional. The philosophy is the vehicle, not the destination.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm the cousin. They are nerds. They argue about possible worlds. She thinks you can't be in two places. He thinks you can. So I can't say "I love you in every world." That's wrong for both. But here is the truth: In this world, you are here. That's what matters. Cheers.
      *Critique:* Too dry. Needs more flavor and specific philosophical nods that show I did the homework.

  6.  **Drafting - Iteration 2 (Adding Detail & Voice):**
      Start with the "long story" about toast duty. Mention the PhD program. Explain the "ruining the moment" bit.
      *For her:* David Lewis. You are unique to this world.
      *For him:* Kripke. You are essentially you.
      *The pivot:* But we live in the Actual World.
      *Critique:* Better. Need to make sure the Lewis explanation doesn't sound like "you aren't real." It's about *location*.

  7.  **Final Polish (incorporating the prompt's constraints):**
      *   Make sure I don't say "There's no possible world where I don't end up with you."
      *   Ensure the laypeople get the emotional beat even if they miss the哲学 (philosophy).
      *   Keep it under 4 minutes (approx. 500-600 words spoken at a moderate pace).

      *(Self-Correction during drafting)*: I need to be careful with Kripke. Kripke's point is about *naming* and *identity*, not necessarily that we *do* travel worlds, but that we can *talk* about the same object in different worlds. For the toast, simplifying to "It's really you" is acceptable for the sake of romance. For Lewis, the romantic angle is "This world is concrete and real."

      *Key Insight:* The romantic synthesis is that while they disagree on the *other* worlds, they agree on *this* one. The "Actual World" is the intersection of their theories.

  8.  **Final Review against constraints:**
      *   3-4 minutes? (Word count check: ~550 words is about 3.5 mins).
      *   Structured around disagreement? Yes.
      *   Sincere/Romantic? Yes.
      *   Accessible? Yes, analogies used.
      *   Accurate enough? Yes, captures the spirit of Lewis vs. Kripke without getting bogged down.

  9.  **Writing the Toast.** (Proceeding to generate output based on these thoughts).
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Bride]'s cousin. I was told that usually, toast duty goes to the siblings. But as some of you know, in this family, proximity is measured in late-night phone calls and shared secrets, not just genetics. So, here I am.

  Now, I need to address the elephant in the room. Or rather, the elephant in the seminar room.

  [Bride] and [Groom] met in a modal metaphysics PhD program. For those of you whose eyes just glazed over, that means they fell in love by arguing about the nature of reality. Specifically, they have a running bit. One of them will say something romantic like, "There is no possible world where I don't end up with you." And the other will immediately ruin the moment by explaining why that is technically impossible.

  [Bride], you are a Lewisian. You believe we only exist in *this* world. To you, a "you" in another world is just a similar copy, a counterpart. You can't be in two places at once.
  [Groom], you are Team Kripke. You believe in transworld identity. To you, it really is *you* in those other scenarios, because your identity travels with you.

  So, if I stand here and say, "May you be together in every possible world," [Bride] will roll her eyes because *she* won't be there, and [Groom] will frown because it implies their love is a necessary truth rather than a choice. And I really don't want to ruin the mood before the cake is cut.

  But here is what I've learned from watching you two.

  [Bride], your philosophy teaches us to value the concreteness of *here*. It reminds us that this life, this specific timeline, is the only one that is actually real. It demands that we show up for *this* moment, because there are no backups.
  [Groom], your philosophy teaches us that identity is constant. It reminds us that no matter how circumstances change, no matter what counterfactuals life throws at you, the essence of who you are—and who you are to each other—remains fixed.

  And while you may disagree on what happens in the distant reaches of modal space, you agree on the Actual World. You agree that *this* world is the one where you met. This is the world where you chose each other. This is the world where you are building a life.

  In metaphysics, the "Actual World" is just an indexical. It's a fancy way of saying "wherever we are standing right now." And the beauty of your relationship isn't about the infinite other worlds where things might have gone differently. It's about the fact that in the one world that matters—the one we are all sitting in tonight—you found the one person who makes the argument worth having.

  You don't need to be together in every possible world. You just need to be together in this one. And looking at you both, I know that is a necessary truth.

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May your love be rigid, may your world be concrete, and may your happiness be actual.

  Cheers.
