answer: |-
  The faculty dining hall had emptied hours ago, leaving only the clatter of a busboy stacking plates in the distant galley. Arthur swirled the dregs of his Cabernet, the stain on the tablecloth marking the boundary of their thirty-year war.

  "The elimination argument is valid, Arthur," Ben said, leaning forward. His glasses had slipped down his nose, a telltale sign he was tired enough to stop performing and start fighting. "But the conclusion isn't that the test can't happen. It's that the announcement generates a proposition the student cannot know."

  Arthur snorted, setting his glass down with a sharp *clink*. "Here we go. The mystical epistemic fog. Look, Ben, Quine settled this. The student's reasoning is a *reductio ad absurdum* of the premise that he *knows* the announcement is true. It's not a paradox about the world; it's a paradox about his entitlement. He doesn't know the test is coming. Therefore, the teacher can walk in on Friday and surprise him. No magic required."

  "No magic?" Ben picked up his fork, tapping the tines against the table. "So, on Thursday night, the student believes the test must be on Friday. By your lights, he's wrong to believe he knows that. But why? The teacher *is* giving it on Friday. The announcement *was* true. If I'm standing in the hallway, I can know it's on Friday. I can look at the lesson plan. Why is the student epistemically castrated by the very same evidence that leaves me fully potent?"

  "Because you aren't the subject of the announcement," Arthur said, waving a hand. "The announcement says *'You cannot predict.'* When you try to predict it, you engage in a derivation that undermines your own justification. It's self-defeating. Like saying 'I am not speaking.' You can say it, but you can't say it truly while saying it."

  "That's the performative contradiction move," Ben said, shaking his head. "It's too cheap, Arthur. It treats the knowledge loss as a logical accident. But Sorensen's point is that this is a *blindspot*. It's a truth that is structurally inaccessible to the student, even if justified, even if true. It's not that his justification is defeated; it's that the proposition 'The test is on Friday and you don't know it' cannot be rationally believed by the student on Thursday night."

  Arthur leaned back, crossing his arms. "And that's where you lose me. You're reifying ignorance. You're positing a new ontological category—'unknowable truths'—just to save the student's derivation from being a simple error. If I tell you, 'It will rain tomorrow, but you won't know it until you see it,' have I created a blindspot? Or have I just told you that you lack evidence?"

  "I've told you that if you believe me now, you falsify the second conjunct," Ben countered. "If you believe 'I won't know,' then you *do* know, so the statement is false. If the statement is true, you can't believe it. That's not a lack of evidence. That's a structural feature of the proposition relative to the agent."

  "Relative to the agent," Arthur repeated, tasting the words like sour milk. "That's the soft spot, Ben. If you accept blindspots, you open the door to a rampant skepticism about future contingents involving our own knowledge. If I say, 'Next year I will discover a proof I currently don't know,' am I stating a blindspot? Am I barred from knowing my own intellectual trajectory? Your solution buys consistency at the price of making the future opaque to the agents living in it."

  Ben sighed, rubbing his temples. "I'm not saying we can't know future contingents. I'm saying we can't know *self-referential* epistemic futures. And frankly, your Quinean line has a cost just as high. You say the student doesn't know the announcement is true. Fine. But does he know it's *false*? No. So he has to suspend judgment. But if he suspends judgment, the elimination argument doesn't even get off the ground. He has to assume it's true to run the *reductio*. So he's in a bind where he must assume P to disprove P, but if he disproves P, he can't have assumed P knowledgeably. You're trapping him in a loop of skepticism about the teacher's competence."

  "I'm trapping him in nothing," Arthur snapped. "I'm saying the derivation shows he was never in a position to know. It's a warning label. 'Do not use this premise to derive certainty.' Once he heeds the warning, the paradox dissolves. The test happens. He is surprised. The world is consistent."

  "But *why*?" Ben pressed, his voice rising slightly before dropping to a conspiratorial hush. "Why does the logic of the situation forbid *him* specifically from knowing what is plainly true? If I walk in and say, 'The test is Friday,' the student believes me. Now he knows. But the announcement said he *couldn't* know in advance. So the announcement became false the moment he trusted the teacher? Your solution makes the truth of the announcement dependent on the student's credulity. That's idealism, Arthur. That's Berkeley in a tweed jacket."

  Arthur flushed. "It's not idealism. It's indexicality. 'You cannot know' is context-sensitive. It's true until the moment he knows it, at which point it's false. There's no mystery."

  "And that's exactly why it's explanatorily empty!" Ben slapped the table, making the silverware jump. "You're just describing the phenomenon and calling it 'indexicality.' I'm offering a mechanism. The blindspot explains *why* the indexical shifts. It explains why the colleague in the hallway doesn't suffer the same shift. The colleague isn't in the scope of the 'You.' The blindspot is agent-relative. It's not a truth that can't be known *simpliciter*; it's a truth that can't be known *by him*."

  "Agent-relative unknowable truths," Arthur said, pouring the last of the wine. "It sounds like a get-out-of-jail-free card for any failed prediction. 'Oh, I didn't fail to predict the market crash; it was a blindspot.'"

  "Don't be disingenuous," Ben said, softening. "We're talking about rational belief conditions. If positing the blindspot saves the principle that knowledge requires truth and belief without contradiction, isn't it worth the ontological cost? Would you rather keep your clean ontology and admit that rational agents can be forced into contradictions by valid reasoning?"

  "I'd rather admit that valid reasoning requires sound premises," Arthur said, staring into his glass. "And the premise 'I know this announcement is true' is unsound. That's the end of it. You want to save the premise by breaking the world. I break the premise to save the world."

  "And in doing so," Ben said, leaning back, "you make knowledge so fragile that a student can't trust a syllabus without running a meta-logical check on his own capacity to know it. You've made epistemology a minefield."

  "And you," Arthur replied, looking up, "have made it a magic show. Every time logic bites its own tail, you pull a rabbit out of the hat and call it a 'blindspot.' Does it actually predict anything new? Does it generate any insights outside of self-referential paradoxes? Or is it just a label for 'Arthur's skepticism applied to specific cases'?"

  Ben opened his mouth, then closed it. He picked up his water glass, took a sip, and set it down carefully. "It explains the asymmetry," he said quietly. "The colleague knows. The student doesn't. Your view struggles to explain why the colleague isn't also running a *reductio* on the teacher's competence."

  "My view says the colleague isn't the subject of the prediction," Arthur said, though his voice lacked its earlier edge. "The logic doesn't bind him."

  "Exactly," Ben said. "The logic binds the subject. Which implies the proposition has a different logical status for the subject than for the observer. Which is what I mean by a blindspot. We're saying the same thing, Arthur. You just refuse to name the ghost."

  "I refuse to invite the ghost in for dinner," Arthur corrected.

  They sat in silence for a moment. The busboy had stopped clattering plates. The hum of the refrigerator was the only sound left in the room.

  "Thirty years," Ben said, smiling faintly. "And we're still on the first week of the syllabus."

  "The test is on Friday," Arthur said, standing up and grabbing his coat. "And I still won't know it until I walk into the classroom."

  "See?" Ben said, rising to meet him. "You admit it."

  "I admit nothing. I'm just surprised."

  Arthur walked toward the door. Ben watched him go, then looked down at the table, at the two wine glasses, one empty, one with a splash of red left at the bottom. He wasn't sure if he knew which one was his.
