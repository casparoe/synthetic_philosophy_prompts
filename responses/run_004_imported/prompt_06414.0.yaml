answer: |-
  This is a fantastic topic for a reading group talk, and I have good news for you: **your interpretation is not embarrassing; it is the dominant view in contemporary Sidgwick scholarship.**

  You are not forcing a tidy story onto disparate interests. You are essentially summarizing the central thesis of the modern revival of Sidgwick studies, most notably associated with **Bart Schultz** (author of the definitive biography, *Henry Sidgwick: Eye of the Universe*). If that retired colleague has read the *Memoir* and the secondary literature, they will likely nod along with you, provided you frame it as engaging with the existing scholarship rather than presenting it as a brand-new discovery.

  Here is a breakdown of how your argument holds up, the nuances you should flag to protect yourself, and an assessment of the talk's potential.

  ### 1. Does the interpretation hold up?
  **Yes.** The "standard line" you mentioned (that the SPR was a Victorian hobby) is largely a relic of mid-20th-century analytic philosophy, which tended to sanitize Sidgwick into a proto-Rawlsian figure and ignore the biographical context.

  Since the 1980s and 90s (thanks largely to Schultz, Alan Gauld, and J.B. Schneewind), the consensus is exactly what you outlined:
  *   **The Problem:** The "Dualism of Practical Reason" in *The Methods of Ethics* (especially the 6th and 7th editions) leaves Sidgwick in a state of despair. If reason dictates both Egoism and Utilitarianism, but they conflict, reason is contradictory.
  *   **The Solution:** The only way to reconcile them is if the universe is structured such that virtue is ultimately rewarded and vice punished (i.e., a moral government of the universe, usually implying God and immortality).
  *   **The Constraint:** Sidgwick cannot accept this on religious faith (hence the 1869 resignation from Trinity over the Thirty-Nine Articles). He requires empirical evidence.
  *   **The SPR:** The Society for Psychical Research was the vehicle to gather that empirical evidence. If you can prove survival after death via mediumship or telepathy, you open the door to a moral order where duty and self-interest coincide in the long run.

  ### 2. Complications and Nuances to Flag
  To "sanity-check" this against the expert in the room, you should acknowledge a few complexities. This shows you've done your homework and aren't just oversimplifying.

  **A. The "Esoteric" Sidgwick**
  Sidgwick was famously secretive. He didn't always explicitly write, "I am doing psychical research to solve the Dualism." He kept much of this anxiety private.
  *   *Talk Tip:* Mention that the connection is often reconstructed from his letters and the *Memoir* (written by his wife, Eleanor, after his death) rather than just his public philosophical treatises. The *Memoir* is where the emotional urgency comes through.

  **B. It Didn't Actually Work**
  It is crucial to note that Sidgwick died without finding the proof he wanted. The SPR produced ambiguous results.
  *   *Talk Tip:* Don't imply the SPR *solved* the Dualism. Frame it as a **tragic project**. He spent 30 years trying to empirically verify the postulates of practical reason, and he failed. This adds a layer of pathos to the "cold," analytical utilitarian.

  **C. Theism vs. Ethics**
  While the Dualism is the *philosophical* engine, the *psychological* engine was also a general crisis of theistic belief.
  *   *Talk Tip:* Acknowledge that the SPR was also about proving the existence of God/Spirit generally, which would *then* support the ethical structure. It wasn't *only* about hedonic calculus; it was about cosmic meaning.

  **D. The Timeline of the *Methods***
  The Dualism becomes more pronounced in the later editions of *The Methods* (particularly the 6th, 1885, and 7th, 1907).
  *   *Talk Tip:* If you want to impress the specialist, note that his despair deepens in the later editions, parallel to his deepening involvement with the SPR. It wasn't a static background worry; it grew as the SPR failed to yield definitive proof.

  ### 3. Is this interesting enough for 20 minutes?
  **Absolutely.** In fact, it is arguably *the* most interesting thing about Sidgwick for a general philosophy audience.

  *   **Humanizes the Dryness:** Sidgwick is often taught as the driest of the utilitarians (compared to the fiery Mill or the radical Bentham). Showing that his "dry" ethics led to a lifelong, desperate quest for ghosts makes him a tragic, Victorian Dostoevsky figure.
  *   **Bridges Meta-Ethics and Metaphysics:** It forces students to confront the idea that ethical systems often rely on metaphysical assumptions (the "moral order of the universe").
  *   **The "Biscuit Factor":** For an informal group, the tension between "rigorous empiricist" and "ghost hunter" is a great narrative hook.

  ### 4. Strategic Advice for the Talk
  To ensure you don't look like you're saying something "embarrassing" to the specialist:

  1.  **Cite Schultz:** Early in the talk, mention Bart Schultz's biography (*Eye of the Universe*). Say something like, "Following Bart Schultz's reconstruction of Sidgwick's life..." This signals that you know this is established scholarship, not wild speculation.
  2.  **Quote the *Memoir*:** Since you know the colleague knows the *Memoir*, use a quote from it. Sidgwick wrote to his cousin about the "need for a moral government of the universe." Eleanor Sidgwick's biography details his anxiety. Using their text validates your claim.
  3.  **Avoid "Proof":** Don't say "Sidgwick joined the SPR *to prove* the Dualism wrong." Say "Sidgwick hoped the SPR might provide the *empirical grounds* necessary to resolve the Dualism without violating his intellectual conscience."
  4.  **End on the Tragedy:** Conclude with the fact that he remained agnostic and troubled to the end. It underscores the seriousness of the philosophical problem—if *Sidgwick* couldn't solve it with ghosts and ethics, maybe it's a real problem.

  ### Summary
  You are on solid ground. The only risk is presenting this as a novel insight rather than a synthesis of the last 30 years of Sidgwick scholarship. If you frame it as "I've been looking at how the SPR work illuminates the Dualism, following the lead of scholars like Schultz," you will look well-prepared and insightful.

  It's a great talk topic. Go for it.
