answer: |-
  HALE: Thirty minutes. That's the delta. Your report says the concrete sector fails at twelve-thirty. The charge went at twelve.

  VANCE: The charge went on Sector Four. The concrete weakness was Sector Seven.

  HALE: And the water ended up in the same houses. My clients are the insurers, Doctor Vance. Their liability hinges on causation. If the town floods at twelve-thirty regardless of the bomb, then the bomb did not cause the loss. It merely rescheduled it.

  VANCE: It didn't reschedule the loss. It initiated a different failure mode. You're treating the flood as a binary state. Flooded or not flooded. That's not engineering. That's accounting.

  HALE: It's law. The "but-for" test. But for the sabotage, would the town have flooded? Yes. Therefore, the sabotage is not the cause of the flooding. The cause is the degradation of the concrete. Which shifts liability to the engineering firm that signed off on the mix. Not the policy covering criminal acts.

  VANCE: You're relying on a counterfactual world that doesn't exist. You're asking me to simulate a reality where the bomb doesn't go off, but the concrete does.

  HALE: I'm asking you to isolate variables.

  VANCE: You can't isolate variables in a collapsed system. You're using a counterfactual theory of causation on a preemptive overdetermination case. It's a known failure state for your logic. If two sufficient causes exist, your "but-for" test eliminates both. But for the bomb, the concrete breaks it. But for the concrete, the bomb breaks it. By your logic, nothing caused the flood. The water just appeared.

  HALE: Don't be glib. We sequence them. The bomb happened first. But if the outcome was inevitable, the intervention is moot.

  VANCE: Intervention is never moot. That's the point. Causation isn't about what *would* have happened in a ghost timeline. It's about what happens when you manipulate the actual system. If I intervene on the bomb variable—remove it—the system holds until twelve-thirty. If I intervene on the concrete variable—reinforce it—the system holds against the bomb. Both are causal nodes.

  HALE: There it is. "If I intervene." You see the circularity? To define an intervention, you have to know which changes count as exogenous. You have to know what counts as "fixing" the concrete versus "changing the scenario." You can't build a causal model to explain causation. You're assuming the very causal structure you claim to be discovering.

  VANCE: I'm assuming physical laws. Gravity, tensile strength, hydrostatic pressure. Those aren't assumptions, Mr. Hale. They're constants. My model maps the dependencies. The bomb was an external shock to a node that should have been robust. The concrete was a latent weakness in a node that should have been independent.

  HALE: Latent weakness versus active trigger. If the wall was sound, the bomb does nothing. If the bomb wasn't there, the wall fails anyway. So the wall is the problem. The bomb is just... weather.

  VANCE: The bomb isn't weather. It's an agent. And you're only comfortable calling the concrete the cause because you're describing the effect loosely. "The Flood." Capital T, Capital F.

  HALE: The policy covers "Flood Damage."

  VANCE: Describe the event precisely. Not "The Town Floods." Describe it as "The Breach of Sector Four at 12:02 AM resulting in a hydraulic surge velocity of X." Now run your but-for test. But for the bomb, does Sector Four breach at 12:02?

  HALE: No.

  VANCE: But for the concrete, does Sector Four breach at 12:02?

  HALE: ...No. The concrete was in Sector Seven.

  VANCE: Exactly. If you define the event by its actual physical parameters—time, location, mechanism—your but-for test clears the concrete entirely. The shoddy mix becomes a background condition, not a cause. It drops out of your equation. So you only get the result you want—blaming the engineers—if you blur the specifics. If you treat "flood" as a vague cloud rather than a physical event.

  HALE: Because the policy isn't insuring a specific breach vector. It's insuring the town's solvency. If the town drowns at twelve-oh-five or twelve-thirty-five, the loss is identical. The houses are wet either way. You're arguing for a distinction without a difference to protect your profession's liability.

  VANCE: I'm arguing that mechanism matters. If I treat a cancer patient who dies of a heart attack an hour before the chemo kills them, I didn't cause the death. But I also didn't save them. You're trying to use inevitability to erase agency.

  HALE: I'm trying to use inevitability to assess risk. If the dam was going to fail that night, the risk was realized regardless of the saboteur. The saboteur didn't create the risk. He just tapped the keg.

  VANCE: He tapped a keg that shouldn't have been leaking. You keep saying "inevitable." Inevitability is a narrative, not a physical property. Nothing is inevitable until the bonds break. On the night of the storm, the concrete *had not yet failed*. The system was still holding. The bomb changed the state from "holding" to "failed." That is a causal intervention.

  HALE: And your interventionist model requires you to hold all other variables fixed. But you can't hold the storm fixed, you can't hold the water pressure fixed, and you certainly can't hold the concrete's degradation fixed while claiming it wasn't a cause. You're cherry-picking which nodes get to be "variables" and which get to be "structure."

  VANCE: Because the concrete was part of the system design. The bomb was not.

  HALE: And there's your assumption. You define the system boundary to exclude the saboteur. If I define the system as "The Valley During A Storm," the saboteur is just another variable in the weather pattern. A human variable.

  VANCE: Then your model can't distinguish between murder and gravity.

  HALE: My model distinguishes between payout and no payout. And right now, your root-cause analysis tells me the dam was dead man walking. The bomb just checked the pulse.

  VANCE: The bomb cut the throat.

  HALE: Of a corpse.

  VANCE: It wasn't a corpse until it broke. And it broke because of the charge.

  HALE: It broke because it was rotten. The charge just told us when.

  VANCE: Then why didn't it break in Sector Seven? Why Sector Four?

  HALE: Because the water follows the path of least resistance. The bomb made Sector Four the path.

  VANCE: So the bomb determined the path.

  HALE: The rot determined the destination.

  VANCE: You're stuck in the counterfactual. You keep looking at the world that didn't happen. The one where the bomb doesn't go off.

  HALE: Because that's where the liability lives. In the difference between what did happen and what would have.

  VANCE: No. The liability lives in the mechanism that actually happened. You want to charge the engineers for a failure that didn't occur. Sector Seven held. Sector Four blew. You want to bill us for Sector Seven based on a ghost story about twelve-thirty.

  HALE: I want to bill based on the fact that the town is underwater. And if I take away the bomb, the town is *still* underwater.

  VANCE: At twelve-thirty. Through Sector Seven. Affecting different houses. Different claims. Different survivors.

  HALE: Different paperwork.

  VANCE: Different lives.

  HALE: Then we're done. You're arguing metaphysics. I'm arguing indemnity.

  VANCE: No. I'm arguing that if you ignore the mechanism, you can't fix the system. You'll reinforce Sector Seven and leave Sector Four open because your math says the flood was "going to happen anyway."

  HALE: And I'm arguing that if you ignore the inevitability, you'll charge me for a loss that was already baked into the wall.

  VANCE: Then we have a problem.

  HALE: We have a flood, Doctor. The cause is secondary.

  VANCE: The cause is the only thing that matters.

  HALE: Then explain to me why the water is in the living room if the bomb didn't put it there.

  VANCE: Because the wall let it in.

  HALE: Because the wall was going to fall.

  VANCE: It didn't fall. It was blown.

  HALE: Semantics.

  VANCE: Physics.

  HALE: Law.

  VANCE: Then the law is broken.

  HALE: Then the dam was.
