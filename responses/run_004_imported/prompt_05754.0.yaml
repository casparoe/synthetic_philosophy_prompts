answer: |-
  You and your friend were both right, but you were playing two different games. This is a classic clash between **Decision Theory** (your friend) and **Game Theory/General Equilibrium** (you).

  Here is the breakdown of why Good's Theorem holds, why the Hirshleifer Effect holds, and exactly which assumption breaks when you move from one to the other.

  ### 1. Your Friend's Side: Good's Theorem (1967)
  **The Claim:** For a single rational Bayesian decision-maker, the expected utility of receiving free information is always greater than or equal to the expected utility of not receiving it.

  **The Logic:**
  *   Imagine you have to make a choice (e.g., take an umbrella or not).
  *   If you get a weather report (information), you can always choose to **ignore it** and make the same choice you would have made without it.
  *   Therefore, the worst-case scenario with information is the same as the scenario without it.
  *   In the best case, the information allows you to tailor your action to the state of the world, increasing your payoff.
  *   **Result:** $E[Utility | Info] \geq E[Utility | No Info]$.

  **The Hidden Assumptions:**
  1.  **Single Agent:** There is only one decision-maker. The "world" does not react strategically to your information.
  2.  **Private Information:** The information is for *you* to use. It does not automatically become known to other parties who might change their behavior toward you.
  3.  **Fixed Menu:** The set of available actions (contracts, bets, purchases) remains constant regardless of what the information says.

  ### 2. Your Side: The Hirshleifer Effect (1971)
  **The Claim:** Public information can reduce social welfare (and individual ex-ante expected utility) by destroying risk-sharing opportunities.

  **The Logic:**
  *   Insurance markets exist because of **uncertainty**. I don't know if my house will burn down; you don't know if yours will. We pool risk.
  *   If a crystal ball reveals *exactly* whose house will burn down **before** we sign insurance contracts, the market collapses.
  *   The insurer won't insure the house destined to burn (or will charge the full value of the house). The owner of the safe house won't buy insurance.
  *   Risk-averse individuals are now forced to bear all their own risk. Even though they have "more information," their expected utility drops because they lost the ability to smooth consumption across states of the world.

  **The Hidden Assumptions:**
  1.  **Multiple Agents:** There are counterparties (insurers, traders) whose payoffs depend on yours.
  2.  **Public Information:** The information is revealed to *everyone* (including the counterparties) before contracting.
  3.  **Endogenous Markets:** The availability of actions (insurance contracts) depends on the information structure.

  ### 3. Where They Stop Being Compatible
  The conflict arises because Good's Theorem treats information as a **tool for optimization**, while Hirshleifer treats information as a **structural change to the environment.**

  Here is the specific assumption Good's Theorem makes that Hirshleifer's scenario breaks:

  **Good assumes the payoff function and action space are fixed.**
  In Good's framework, the world is passive. If you learn $X$, you optimize $Action(X)$. The opportunity to take that action exists regardless of $X$.

  **Hirshleifer shows the action space shrinks.**
  In the insurance scenario, learning $X$ (who is high risk) causes the counterparty to withdraw the option to insure.
  *   **Without Info:** You have the option to buy insurance. Expected Utility = High (due to risk pooling).
  *   **With Info:** You know your risk, *but the insurer knows it too*. The option to buy insurance vanishes. Expected Utility = Low (due to bearing full risk).

  ### 4. The "Private vs. Public" Distinction
  This is the most critical pivot point.

  *   **If the information is Private (Good):** If *only you* know you are high-risk, and you can still buy insurance at the average rate, you are better off (until the market collapses via Adverse Selection/Akerlof, which is a different but related dynamic).
  *   **If the information is Public (Hirshleifer):** If *everyone* knows you are high-risk, the risk-sharing benefit is destroyed.

  Good's Theorem essentially calculates the **Private Value of Information**.
  Hirshleifer calculates the **Social Value of Information**.

  It is entirely possible for information to have positive *private* value (I can exploit this) but negative *social* value (we can no longer cooperate/insure). In the Hirshleifer case, the information has negative value *ex-ante* (before you know what the information will say). If you ask, "Do I want to live in a world where this test exists?" the answer is No. But if you ask, "The test exists and the result is here, do I want to look at it?" Good's theorem says Yes.

  ### Summary for Your Friend
  You can tell your friend:
  > "Good's Theorem proves that information never hurts a **single** decision-maker facing a **passive** world where the **options remain available**. But Hirshleifer proved that in a **multi-agent market**, public information can change the **strategic behavior of counterparties**, causing markets (like insurance) to vanish. Good assumes the menu of options is fixed; Hirshleifer shows the menu disappears when everyone knows the secrets."

  **Verdict:** You were arguing past each other. She was right about **Decision Theory**; you were right about **Market Design**.
