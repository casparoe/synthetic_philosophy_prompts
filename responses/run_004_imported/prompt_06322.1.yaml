      *   **The "Optimality" Claim:** It *is* optimal *if* your goal is strictly to maximize the long-term compound growth rate of your bankroll *and* you know the true probabilities exactly.
      *   **The Catch:** It assumes perfect knowledge of edge ($p$) and odds ($b$). In sports betting, edges are estimates, not certainties.
      *   **The Risk:** Full Kelly leads to massive drawdowns (variance). A 50% drawdown requires a 100% gain to recover. Full Kelly can easily lead to 50-70% drawdowns in the short/medium term.
