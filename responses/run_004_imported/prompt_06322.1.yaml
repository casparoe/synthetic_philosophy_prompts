  Got into sports betting about six months ago and I've properly fallen down the rabbit hole of bankroll management math since then. Everyone in the betting discord I'm in treats the Kelly criterion as basically the final word on how many units to stake - they call it "the optimal fraction" - but almost every guide out there also tells you to use half-Kelly or quarter-Kelly instead of full Kelly, just to "cut down variance." That's what's confusing me: if full Kelly really is the mathematically optimal stake size, isnt betting less than that just deliberately choosing a worse strategy on purpose? Should I be ignoring the variance-reduction advice and just betting full Kelly on every +EV line I find, since that's supposedly the one that's actually optimal?
