answer: |-
  Welcome to the club. It is a very common reaction for people with a hard science background to look at Newcomb's Problem, smell "backward causation," and immediately file it under "philosophical nonsense." In fact, many prominent philosophers and economists agree with you (they are "Two-Boxers").

  However, you are asking the right question: **Why do serious, non-mystical decision theorists defend one-boxing?**

  The short answer is: **You are correct that backward causation is impossible, but you are incorrect that one-boxing requires it.**

  The defense of one-boxing does not rely on your choice *changing* the past. It relies on the idea that your choice and Omega's prediction are **logically correlated** because they share a common cause: *you*.

  Here is the breakdown of why smart people take this seriously, translated for a physicist.

  ### 1. The Misconception: Causal Influence vs. Logical Entanglement
  Your intuition is grounded in **Causal Decision Theory (CDT)**. CDT says: *An action is rational if it causally brings about the best outcome.*
  *   **CDT View:** The money is already in the box (or not). My hand moving now cannot send a signal back in time to Omega. Therefore, I take both boxes.

  The One-Boxers (often adhering to **Evidential Decision Theory** or the newer **Functional Decision Theory**) argue that CDT is using the wrong map of reality. They aren't claiming your hand moves and magically rearranges the cash in the past. They are claiming that **your decision algorithm and Omega's prediction algorithm are running the same logic.**

  Think of it this way: Omega has simulated you. The simulation is not "you" in a spiritual sense, but it is running the same source code.
  *   If the simulation outputs "One-Box," Omega puts the money in.
  *   You are running the same source code.
  *   If you output "One-Box," it implies the simulation output "One-Box."

  There is no signal traveling backward in time. There is simply a **logical identity** between the prediction and the action. If $f(x) = y$, and Omega calculated $y$ yesterday, and you calculate $y$ today, the values match not because today changed yesterday, but because the function $f$ is deterministic.

  ### 2. The "Pre-Commitment" Argument
  Here is an argument that often resonates with experimentalists.

  Imagine you could modify your own brain (or program a robot to act for you) *before* Omega makes the prediction. You know Omega is scanning you to see what you will do.
  *   Would you program yourself/robot to be a One-Boxer or a Two-Boxer?
  *   Obviously, you'd program a One-Boxer. That version gets \$1 million. The Two-Boxer version gets \$1,000.

  The One-Boxer argument is: **Why is it rational to pre-commit to one-boxing, but irrational to actually one-box when the time comes?**

  If you say, "I wish I were the type of person who one-boxes, but now that the money is set, I'll two-box," you are admitting that the *type of person you are* determines the payout, not the specific physical motion of your hand at $t=now$. Decision theorists argue that rationality should be about **winning**, not about feeling like you have "free will" in a causal vacuum. If One-Boxers leave with \$1M and Two-Boxers leave with \$1k, the One-Boxers are the ones successfully navigating reality.

  ### 3. Functional Decision Theory (FDT)
  This is the modern heavy-hitter in this debate (championed by researchers at MIRI and Oxford). It treats decisions as **logical outputs** rather than **physical events**.

  In physics, we often deal with block universes or deterministic equations where $t$ is just a coordinate. FDT suggests that your decision is a logical fact, like $2+2=4$.
  *   Omega predicts the logical fact of your decision.
  *   You enact the logical fact of your decision.
  *   The correlation exists in the realm of logic, not the realm of physical signal propagation.

  To a physicist, this might look like **entanglement without communication**. Knowing the state of particle A tells you the state of particle B, not because A signaled B, but because they share a wavefunction. In Newcomb's, you and Omega's prediction share a "logical wavefunction" (your decision algorithm).

  ### 4. Why Theorists Don't "Laugh It Out of the Room"
  There are two main reasons this problem hasn't been discarded:

  1.  **It exposes a flaw in CDT:** CDT works great for standard causal chains (pull lever -> train switches track). But it fails in scenarios where your decision provides *evidence* about the state of the world that is not caused by your decision (like Newcomb's, or the Prisoner's Dilemma with a clone). If a decision theory systematically leads its adherents to be poorer in predictable scenarios, theorists feel compelled to fix the theory.
  2.  **It defines "Rationality":** Is rationality about following a specific causal ritual (CDT)? Or is it about achieving the highest utility (One-Boxing)? If you define rationality as "the art of winning," One-Boxing is the only rational choice. If you define it as "causal integrity," Two-Boxing wins. The debate forces us to define what we mean by "choice."

  ### Summary
  You aren't missing the physics; you're missing the **computational perspective**.

  *   **Your view (Two-Box):** I am a physical agent acting in time. My action cannot affect the past.
  *   **Their view (One-Box):** I am a deterministic algorithm. Omega has already computed my output. My "choice" is just the runtime execution of that output. To choose otherwise is to imply Omega was wrong, which contradicts the premise.

  They aren't smuggling in time travel. They are smuggling in **determinism**. They argue that if you accept the premise (Omega is accurate), you must accept that your decision is logically fixed before you make it, and acting in accordance with that fixity is the only way to win.

  Does that make it less frustrating? Probably not. But it does mean the One-Boxers aren't usually claiming magic—just a very rigid view of logical consistency.
