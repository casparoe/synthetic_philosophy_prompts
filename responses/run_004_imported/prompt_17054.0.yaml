      *   *Mara:* Focus on *GM* III, Section 8-10. The philosopher as an "ideal of the most spiritual man."
      *   *Key tension:* Is the regimen an expression of power (I command my body) or a reaction to weakness (I must protect my fragile body)?

  7.  **Polishing:** Check the rhythm. Ensure they interrupt each other logically but politely. Enhance the vocabulary (e.g., "physio-psychology," "convalescence," "hyper-aesthesia").

