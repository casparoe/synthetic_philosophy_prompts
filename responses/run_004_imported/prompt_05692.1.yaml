answer: |-
  First off: sleep well. You are not crazy, and you are not garbling the philosophy. In fact, you and Marcus have accidentally recreated one of the most lively, high-stakes debates in contemporary Kant scholarship. You are punching well above "late-night dorm argument" weight here.

  Here is the sanity check you asked for, broken down by your four questions.

  ### 1. Are you running CC vs. CW correctly?

  **Yes, structurally.**

  *   **Contradiction in Conception (CC):** You asked, "Is this world conceivable?" You argued that a world where everyone pads resumes is logically possible (the institution of applying for jobs doesn't vanish; it just gets noisier). This is the correct application. CC is usually reserved for **Perfect Duties** (things you must never do, like murder or lie).
  *   **Contradiction in Will (CW):** You asked, "Can I *rationally will* this world?" You argued that willing it undermines the specific goal of the maxim (gaining a relative edge). This is the correct application for **Imperfect Duties** (things you should generally do, like help others or develop talents).

  You have correctly identified the mechanical difference: CC is about the *possibility of the action/practice*, while CW is about the *rationality of the agent's will* in that world.

  ### 2. Does the resume case actually land where you think it does?

  **Mostly yes, but with a caveat.**

  Your intuition that resume padding is different from "I promise to pay you back knowing I won't" is strong.
  *   **The CC Test:** In Kant's false-promising example, he argues that if everyone made false promises, the *institution of promising* would vanish because no one would believe promises. In your resume case, you argue the institution of *applying* survives; employers just "discount" claims. This is a very defensible distinction. Language is flexible; "proficient" just shifts its meaning slightly. The practice doesn't logically collapse; it just becomes inefficient. So, **Pass CC** is a solid position.
  *   **The CW Test:** Here is where it gets tricky. In Kant's standard CW cases (like refusing to help others), the contradiction arises because you necessarily will your own happiness, and you might need help later. In your resume case, the contradiction is that your *specific scheme* fails.
      *   *Strict Kantian View:* A prudent failure ("I won't get the edge") isn't always a moral failure. Kant cares about duties to rational agency, not just winning the job market.
      *   *Your View (and Marcus's):* If the maxim is "I will lie to get an unfair advantage," and universalization removes the "unfair advantage," you have willed a world where your maxim is ineffective.

  **Verdict:** You are right that it feels different from false promising. It lands closer to a CW failure (or a "soft" CC failure) because the practice degrades rather than vanishes.

  ### 3. Is "the promising case is secretly a CW argument" a real criticism?

  **Yes. You are not garbling Korsgaard.**

  You are remembering **Christine Korsgaard's** seminal paper, *"Kant's Formula of Universal Law"* (1985). Her argument is essentially exactly what Marcus is saying.

  *   **The Standard View:** CC is a *logical* contradiction (like "square circle"). CW is a *teleological* contradiction (willing something that hurts your goals).
  *   **The Korsgaard View:** She argues that *both* are "Practical Contradictions."
      *   In CC cases (False Promising), the contradiction isn't logical; it's that you can't *achieve your purpose* (deceiving someone) if the practice is universalized.
      *   In CW cases (Non-beneficence), you can't achieve your necessary ends (happiness) if the practice is universalized.

  Marcus is channeling Korsgaard (perhaps via a seminar or secondary source) when he says the distinction is "without a difference." He is arguing that *every* failure of the Categorical Imperative is ultimately a failure because **the maxim defeats its own purpose when universalized.**

  There is also **Onora O'Neill**, who argues similarly that the "logical contradiction" in Kant's examples is often actually a "practical" one dependent on social conventions. So, Marcus has heavy-hitting philosophical backup.

  ### 4. Who is closer to right: You or Marcus?

  **You are right about the distinction; Marcus is right about the instability.**

  Here is the nuance you need to win (or at least tie) the argument:

  **Where You Win:**
  There *is* a phenomenological difference between "I cannot even do the thing" (CC) and "I can do the thing, but it won't get me what I want" (CW).
  *   In False Promising (CC), if trust is gone, I literally cannot *make a promise* that functions as a promise. The act itself is nullified.
  *   In Resume Padding (your case), I *can* still pad the resume. The employer still reads it. The act functions, but my *strategic goal* (the edge) is lost.
  Preserving that distinction helps explain why lying feels "worse" (Perfect Duty) than being shifty/selfish (Imperfect Duty).

  **Where Marcus Wins:**
  Marcus is right that the "Threshold Problem" threatens to collapse the two.
  If you argue (as you did) that resume padding passes CC because "the practice survives in a degraded form," Marcus can turn that back on False Promising. He can say: "If everyone lied, promising wouldn't *vanish*; people would just trust less and demand collateral. It would survive in a degraded form."
  If *that* is true, then False Promising isn't a CC failure either; it's a CW failure (you can't successfully deceive). If Marcus is right, then **Kant's own four examples don't actually fit the boxes he put them in.**

  **The Verdict:**
  *   **Philosophically:** Marcus is closer to the modern consensus (Korsgaard/O'Neill) that the CC/CW line is blurrier than Kant advertised.
  *   **Textually:** You are closer to Kant's explicit intent. Kant *wanted* there to be a hard line between logical impossibility and rational unwillingness.
  *   **On the Resume Case:** You are right. Resume padding is likely a **CW failure** (or a "Practical Contradiction" in Korsgaard's terms), whereas False Promising is a **CC failure**. The fact that you can distinguish them shows the test *does* work, even if the boundary is fuzzy.

  ### How to make up with Marcus

  Send him this:
  *"I checked the literature. You're basically arguing the Korsgaard/O'Neill 'Practical Contradiction' interpretation, where CC collapses into CW. I'm arguing for the traditional distinction where institutional collapse (CC) is different from purpose defeat (CW). We're both right, we're just reading different layers of the text. Also, I think resume padding is a CW failure, which makes it an imperfect duty, whereas lying is a CC failure/perfect duty. That distinction still matters for how we judge the action."*

  Then buy him a coffee. You had a good argument. Don't lose sleep over Kant; he lost sleep over everything so you don't have to.
