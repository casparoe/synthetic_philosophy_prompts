answer: |-
  **Characters:**
  *   **ELENA:** Philosopher of Religion (Wittgensteinian).
  *   **MARCUS:** Analytic Metaphysician (Realist/Evidentialist).

  **Setting:** A crowded, humid funeral reception. They are standing near a tray of lukewarm sherry.

  ***

  **MARCUS:** Did you hear the son? During the eulogy. He didn't say, "My father lives on in our memories." He said, "I'll see him again." Full stop.

  **ELENA:** I heard him. It was a beautiful expression of hope, Marcus.

  **MARCUS:** Hope requires an object. If I hope the train arrives, the train either arrives or it doesn't. If the son thinks he's going to see his father, he's making a claim about reality. Either that happens or it doesn't.

  **ELENA:** You're treating religious language like a weather forecast. You think "I'll see him again" is a hypothesis about future empirical data. It's not. It's a statement about how he intends to live with the loss.

  **MARCUS:** That's the move. The classic Wittgensteinian retreat. You say it's a "form of life" so you don't have to worry about whether it's true. Kai Nielsen called this out thirty years ago. It lets the believer off the hook of ever being simply wrong.

  **ELENA:** It's not a retreat, it's a grammatical correction. If you treat God like a big object in the universe, you've already misunderstood the concept. The belief regulates the life; it isn't a theory *about* the life.

  **MARCUS:** But tell that to the widow over there. She isn't thinking, "I am adopting a regulatory framework." She thinks her husband is actually somewhere. She thinks Christ actually rose. If you tell her, "Oh, that's just a picture you organize your grief around," she'd think you were insulting her.

  **ELENA:** I'm not doing psychology, Marcus, I'm doing philosophy. I'm asking what the *meaning* of the assertion is. If the Resurrection were disproven tomorrow by a bone box, would the faith collapse? For some, yes. For many, the "truth" of it is in the transformation it effects.

  **MARCUS:** So it's a useful fiction?

  **ELENA:** No. A fiction is something you know isn't true. This is a framework that makes truth possible for them. Like saying "I love you." That's not a prediction I'll behave nicely. It's a commitment. You don't ask for evidence of love the way you ask for evidence of rain.

  **MARCUS:** But if you *never* behave nicely, I conclude you don't love me. The commitment entails behavioral predictions. If the dead never rise, if there is no judgment, then the belief is false. You're trying to sever the link between the belief and the state of the world.

  **ELENA:** I'm saying the "state of the world" includes the moral and spiritual posture of the believer. The verification is internal to the practice.

  **MARCUS:** That's circular. It's a language game where the rules guarantee you can't lose. If it works, it's true. If it doesn't work, you weren't praying right. It's immune to falsification.

  **ELENA:** It's immune to *your* kind of falsification. You want to weigh the soul on a scale. But if I say, "This painting is balanced," I'm not talking about physics. I'm talking about aesthetics. You're committing a category error.

  **MARCUS:** Aesthetics don't promise resurrection. Religion makes ontological claims. It says something *happened*. If you strip away the event, you're left with poetry. And poetry doesn't save anyone.

  **ELENA:** Maybe not. But a literalism that demands empirical proof for transcendent claims leaves you with nothing but silence. I'd rather make sense of the practice than declare it irrational because it doesn't fit your verification principle.

  **MARCUS:** I'm not a logical positivist, Elena. I just think honesty matters. If they believe it's a fact, and you know it's a metaphor, you're being patronizing by calling it a "form of life."

  **ELENA:** And if you insist their deepest commitments are just failed science, you're being reductive. We're at a funeral, Marcus. Does it matter more that the son is comforted, or that his ontology is precise?

  **MARCUS:** It matters that he isn't deluded. Comfort from a delusion is still delusion.

  **ELENA:** Or maybe "delusion" is the wrong word for a commitment that sustains a community across millennia. You want to judge the tree by the roots you can't see. I'm looking at the fruit.

  **MARCUS:** The fruit doesn't prove the roots exist. It just proves the tree is standing.

  **ELENA:** *(Takes a sip of sherry)* We've been standing here for ten minutes arguing about whether the tree is real while ignoring the dirt.

  **MARCUS:** *(Signals the waiter)* Because you won't admit the dirt is all there is.

  **ELENA:** And you won't admit the dirt isn't the whole story.

  **MARCUS:** *(Softens slightly)* We used to do this over cheap pinot in the grad lounge.

  **ELENA:** Now it's lukewarm sherry and a corpse upstairs. Some things don't change.

  **MARCUS:** No. I suppose they don't. Cheers, Elena.

  **ELENA:** Cheers, Marcus.
