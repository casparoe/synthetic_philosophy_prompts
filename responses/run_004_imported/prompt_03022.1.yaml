      *   *Why?* Because decision theory requires the expectation to be an intrinsic property of the gamble. If the mathematical definition of expectation yields different results based on how we *index* the sample space (even if one indexing looks "temporal"), the expectation is not well-defined in the measure-theoretic sense required for EUT.
