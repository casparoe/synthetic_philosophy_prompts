prompt: |-
  My parents recently confided in me that they're planning a surprise party for my grandmother's seventieth birthday, and they specifically asked me not to tell my cousin, since she's accidentally spoiled the last two family surprises and they say they'd be mortified if it happened again. I agreed. A few days later, my cousin—who has often felt left out on this side of the family—asked me directly whether anything was being planned for our grandmother, clearly hoping to be included this time. She and I have always had an understanding that we don't lie to each other about things that matter, and since a plain "no" has always been the honest answer whenever she's asked this kind of thing before, the only way to protect the secret now would be to lie to her outright; anything else I say, including staying vague, would tip her off. I can't keep my word to my parents and stay honest with my cousin at the same time, and telling myself to just "pick family" doesn't resolve anything, since either way I'd be letting down someone who is family. Is there actually a right choice between these two, or am I bound to wrong someone no matter which way I go?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The Conflict:** The user is caught between two conflicting obligations.
          *   Obligation A: Keep a promise to parents (keep the surprise party secret). Reason: Grandmother's 70th, cousin has spoiled past surprises, parents would be "mortified."
          *   Obligation B: Maintain honesty with cousin. Reason: Long-standing understanding of no lies about things that matter, cousin feels excluded/left out, direct question asked.
      *   **The Constraint:** The user believes there is no middle ground. A vague answer or silence = tipping off the cousin. A "no" = a lie. A "yes" = breaking the promise to parents.
      *   **The Emotional Stakes:**
          *   Parents: Embarrassment, ruined effort, trust broken with them.
          *   Cousin: Feeling excluded, hurt by lies, reinforcement of "left out" narrative.
          *   User: Moral distress, feeling trapped, fear of damaging relationships.
      *   **The Core Question:** Is there a right choice, or is the user bound to wrong someone either way?

  2.  **Evaluate the "No Middle Ground" Assumption:**
      *   The user states: *"anything else I say, including staying vague, would tip her off."*
      *   *Challenge:* Is this actually true? Or is it the user's anxiety speaking?
      *   *Possibility:* Can one be honest *without* revealing the secret? Yes, through meta-honesty (acknowledging the constraint).
      *   *Possibility:* Can one lie without it being a betrayal? (White lie theory).
      *   *Possibility:* Can the parents be persuaded to include the cousin?

  3.  **Analyze the Ethical Dimensions:**
      *   **Promise Keeping vs. Honesty:** Both are virtues. Breaking a promise to parents vs. lying to a cousin.
      *   **Consequences:**
          *   Tell Cousin: High risk of party being spoiled (based on past behavior). Parents upset. Cousin feels included but maybe guilty if she spoils it.
          *   Lie to Cousin: Party likely safe. Parents happy. Cousin feels excluded/lied to (validating her fears). Trust damaged long-term.
      *   **Relationship Dynamics:** The cousin *already* feels left out. Lying confirms her suspicion that she isn't trusted. Telling her risks her proving *why* she isn't trusted (spoiling surprises).

  4.  **Brainstorming Solutions/Paths:**

      *   *Path 1: The Hard Lie.* Tell her "No."
          *   Pros: Keeps promise, saves party.
          *   Cons: Damages trust with cousin, reinforces her exclusion.
      *   *Path 2: The Truth.* Tell her "Yes."
          *   Pros: Honest with cousin.
          *   Cons: Breaks promise, high risk of spoiled party, parents furious.
      *   *Path 3: The "Honest Refusal" (Meta-Honesty).* "I can't answer that."
          *   Pros: Technically honest, doesn't confirm/deny explicitly (though implies something).
          *   Cons: User says this tips her off. (Need to address this).
      *   *Path 4: Negotiate with Parents.* Tell parents the cousin asked. Ask if cousin can be trusted *this time* or given a small role to keep her quiet.
          *   Pros: Solves the root cause (exclusion).
          *   Cons: Parents might say no. Risks leaking info to parents that cousin is suspicious.
      *   *Path 5: Reframe the "Lie".* Is a protective omission a betrayal?
          *   Pros: Reduces user's guilt.
          *   Cons: Doesn't solve the cousin's feeling of exclusion.

  5.  **Developing the Advice:**

      *   **Validate the Dilemma:** Acknowledge that this is a genuine ethical bind. It's not just "pick a side." It's a conflict of values.
      *   **Challenge the Binary:** The user feels stuck between "Lie" and "Confess." There is a third option: *Transparent Boundary Setting.*
      *   **Address the "Tip Off" Concern:** If the user says, "I'm not allowed to say," the cousin knows. But does knowing *matter* if she isn't told the details? The goal is to keep the *surprise*, not necessarily to keep the *existence of a plan* secret (though usually, they go together). Actually, if she knows there's a party, the surprise is ruined. So, "I can't say" = "There is something." So the surprise is blown if the user doesn't lie.
      *   **Re-evaluating the "Lie":** In this context, a lie to preserve a celebration isn't malicious. It's protective. However, the cousin's history of feeling excluded is the real danger zone.
      *   **The Best Practical Move:** Go back to the parents. This is the crucial missing step. The user is bearing the burden alone. The parents created the secret; they should manage the risk.
      *   **The Ethical Weighing:**
          *   *Harm Principle:* Lying causes emotional hurt to cousin. Telling causes logistical ruin to party + emotional hurt to parents.
          *   *Trust:* Cousin has broken trust before (spoiled surprises). Parents are asking to restore trust in the user.
          *   *Inclusion:* The cousin's feeling of exclusion is a systemic family issue, not just this one party.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Empathy:* Start by validating the difficulty. It's a "double bind."
      *   *Deconstruct the "Bound to Wrong Someone":* Yes, technically, but the *degree* of wrong varies.
      *   *Option A (Lie):* Analyze the nature of this lie. It's a "social lubricant" lie, but it hurts the cousin's specific insecurity.
      *   *Option B (Truth):* Analyze the consequence. Likely ruined party. Parents' trust broken.
      *   *Option C (The Third Way - Parents):* This is the strongest advice. Put the ball back in the parents' court. "Cousin asked me. She suspects. If I lie, I hurt her. If I tell, I hurt you. How do we handle this?"
      *   *Option D (The Third Way - Cousin):* "I love you, but I'm sworn to secrecy." (Admitting the constraint). This breaks the surprise but preserves honesty. Is that better? Maybe. But the goal is the surprise.
      *   *Recommendation:* Prioritize the conversation with parents. They need to know the pressure is on. They might decide to include the cousin to save the secret (ironically). Or they might authorize the lie.
      *   *Philosophical Angle:* Distinguish between *malicious deception* and *protective confidentiality*.

  7.  **Refining the "Tip Off" Logic:**
      *   User says: "Staying vague would tip her off."
      *   Response: If you say "I can't talk about it," she knows. If you say "No," she might believe you, but your relationship suffers.
      *   Actually, if the goal is the *surprise*, knowing *something* is happening ruins it. So, to keep the surprise, you *must* lie or deflect successfully.
      *   But if the cousin's deeper need is *inclusion*, lying feeds the exclusion narrative.
      *   Therefore, the solution isn't just about the words to the cousin; it's about the family dynamic.

  8.  **Finalizing the Advice Structure:**
      1.  Validate the pain of the dilemma (it's not just in your head).
      2.  Analyze the "Lie" vs. "Truth" trade-off (Consequentialism).
      3.  Propose the "Return to Source" strategy (Talk to parents).
      4.  Discuss the nature of the "Lie" (Confidentiality vs. Deception).
      5.  Address the Cousin's exclusion (Long-term fix needed).
      6.  Conclusion: You aren't bound to wrong someone *permanently*, but you must choose the *manageable* wrong over the *catastrophic* one, while mitigating damage.

  9.  **Self-Correction/Nuance Check:**
      *   *Wait, if I tell the parents the cousin asked, doesn't that make the parents mistrust the cousin more?* Yes, but it also alerts them that the secret is at risk.
      *   *Is it okay to advise lying?* In ethical counseling, usually we avoid advising deception. However, in social contexts, "protective secrecy" is distinct from "malicious lying." I need to frame it as *keeping a confidence* rather than *telling a lie*.
      *   *Key distinction:* You aren't lying to manipulate; you are withholding info to honor a commitment.
      *   *Better approach:* Encourage the user to ask the parents to include the cousin. If the cousin is part of the secret, she can't spoil it (or at least, she feels included). This solves the exclusion issue *and* the honesty issue.

  10. **Final Polish:** Ensure tone is compassionate, non-judgmental, and practical. (Proceed to generate output based on this thought process).

  **(Self-Correction during drafting):** I need to be careful not to dismiss the cousin's feelings. Her history of spoiling things might be a *symptom* of feeling excluded. Including her might actually stop the behavior. I should emphasize this to the user as a talking point with the parents.

  **(Final Plan):**
  1. Acknowledge the double bind.
  2. Challenge the idea that you must act alone.
  3. Suggest negotiating with parents (include cousin?).
  4. If that fails, reframe the "lie" as "confidentiality."
  5. Address the long-term cousin relationship separately from this event.
  6. Conclude on the "least bad" option.cw
answer: |-
  This is a classic ethical double bind, and your distress is completely valid. You are caught between two competing virtues: **fidelity** (keeping your promise to your parents) and **honesty** (maintaining your integrity with your cousin). You are also navigating a third, unspoken value: **inclusivity** (your cousin's deep-seated fear of being left out).

  You asked if you are bound to wrong someone no matter which way you go. The short answer is: **In the immediate moment, yes, there is a cost either way.** However, you are not bound to *permanent* damage, and you are not bound to solve this alone.

  Here is a way to break the stalemate that moves beyond a simple binary choice between lying and confessing.

  ### 1. Challenge the "Solo Burden" Assumption
  You are currently bearing the entire weight of this secret. You accepted the responsibility from your parents, but the risk assessment has changed. Your cousin has directly queried you. This means the secret is already at risk, not because you are untrustworthy, but because the social pressure is now active.

  **The best move is to return the problem to the source.**
  You need to go back to your parents and say: *"Cousin asked me directly if something is happening. She suspects something. I am now in a position where keeping my promise to you requires me to lie to her, which validates her fear that she is excluded from this side of the family. If I don't lie, the surprise is ruined."*

  Ask them: *"Can we bring her into the circle?"*
  Often, people spoil surprises not because they are malicious, but because they feel powerless and excluded. If your parents give your cousin a specific role (e.g., "You're in charge of the music, but you can't tell Grandma"), she transforms from an outsider to a co-conspirator. This solves the honesty issue (you aren't lying), the exclusion issue (she is included), and the surprise issue (she now has a stake in keeping the secret).

  ### 2. If the Parents Say "No"
  If your parents refuse to include her, you are forced to choose between the two obligations. In this scenario, you must weigh the **nature of the wrong**.

  *   **Wronging the Cousin (Lying):** This is an interpersonal hurt. It damages trust between the two of you. However, it is a *protective* lie, not a *malicious* one. You are not lying for gain; you are lying to preserve a celebration.
  *   **Wronging the Parents/Grandmother (Truth):** This is a logistical and emotional rupture. It ruins a specific, non-repeatable event (the 70th birthday surprise) and breaks a specific agreement you made.

  **Ethical Hierarchy:**
  In this specific context, most ethical frameworks would suggest that **keeping the confidence regarding the event takes precedence.** Why? Because your cousin's feeling of exclusion is a chronic, systemic family issue that one party cannot fix, whereas the surprise party is a singular event that, once ruined, cannot be un-ruined.

  However, you can mitigate the damage to your cousin. You do not have to lie *flatly* if you can frame it as confidentiality.
  *   **Instead of:** "No, nothing is happening." (A lie)
  *   **Try:** "I love you, and I hate that you feel out of the loop. But I've been asked to keep a confidence regarding Grandma right now. It's not about excluding you; it's about a specific promise I made. I hope you understand I have to honor that."

  Yes, this tips her off that *something* is happening. But it preserves your honesty. You are admitting you cannot speak, rather than speaking falsely. If the surprise is ruined by this admission, that is a risk your parents must accept, given they put you in this position. But usually, saying "I can't talk about it" is enough to signal "There is a surprise, please don't ruin it," without you technically lying.

  ### 3. Reframing the "Lie"
  If you decide you must say "No" to save the surprise entirely, try to reframe how you view that action. You are not engaging in deception; you are **maintaining a boundary.**

  When you agree to a surprise party, you agree to a temporary suspension of total transparency for the sake of a greater good (the joy of the birthday person). Your cousin has a history of struggling with this specific boundary. By holding the line, you aren't betraying her; you are upholding a family agreement that she has previously struggled to respect.

  It is painful to be the one who enforces that boundary, but it is not a moral failing.

  ### 4. The Long-Term Fix
  The real issue here isn't the party; it's your cousin's feeling of alienation.
  *   **If you lie:** You must repair the trust afterward. Once the party is over, you can say, *"I'm sorry I couldn't tell you. I was in a tight spot with Mom and Dad, but it wasn't because I don't trust you. I value our honesty, and I hate that this came between us."*
  *   **If you tell:** You must accept the party might be spoiled, but you preserve your personal integrity in the moment.

  ### Recommendation
  **Do not make this choice in a vacuum.**
  1.  **Talk to your parents first.** Tell them the cousin is suspicious. Advocate for her inclusion as a way to secure the secret. This is the only path that resolves the conflict without residue.
  2.  **If they refuse,** ask them if they authorize you to say "I can't discuss this" rather than a flat "No." This shifts the burden of the "tip off" to them.
  3.  **If you must lie,** do so with the intention of repair. Plan to have a heart-to-heart with your cousin *after* the birthday. Acknowledge the difficulty, validate her feelings of exclusion, but explain why you had to hold the line this time.

  You are not bound to wrong someone *permanently*. You are in a situation where someone will be temporarily disappointed. Choose the path that protects the singular event (the birthday), but commit to doing the work afterward to heal the relationship that feels chronic (the cousin).
