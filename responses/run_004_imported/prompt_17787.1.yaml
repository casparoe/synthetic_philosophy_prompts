answer: |-
  Good evening.

  For thirty-five years, my life was measured in grant cycles. Now that I've been retired for three, I've found my time measured in pages. I've finally been reading philosophy. And I've become quite attached to an eighteenth-century physicist named Émilie du Châtelet. Some of you know her name; for the rest, she was a working scientist who ran experiments on fire, settled a major debate about kinetic energy, and produced the French translation of Newton's *Principia* that is still the standard today.

  But she also wrote a short essay called the *Discourse on Happiness*. And I've come to believe it is one of the clearest things ever written on how to survive the end of a career.

  Du Châtelet argues that the passions which carry us through youth—love, the desire for glory, the need for recognition—eventually become too expensive to maintain. They require the world to cooperate, and the world becomes less cooperative as we age. She insists that the only passion capable of replacing them is the "love of study." Because study rewards you from within. It doesn't ask for permission. But, she warns, you must cultivate this taste *before* you need it. You cannot wait until the other passions have gone slack to pick it up.

  For decades, Helen was the only person in any department we shared who had opinions on du Châtelet. She kept a postcard of her portrait taped above her desk. She told me once that in an overwhelmingly male field, it was a relief to see a woman permitted to be rigorous and passionate without anyone treating those as pulling in different directions.

  So, when Helen announced her retirement plans, I assumed I knew what was coming. I expected to hear about a language she'd always wanted to learn, or a history she intended to master. I expected the love of study.

  Instead, Helen has joined a weekly poker game. And she is approaching it with a seriousness normally reserved for tenure review.

  Now, du Châtelet actually has something to say about this. In the *Discourse*, she defends her own love of gambling. She admits outright that it cannot be justified by the arithmetic of the thing—the expected value is negative—but she defends it anyway on the grounds that it keeps boredom at bay, provided one can afford to lose and loses with grace.

  I know there are three people in this room who have read that passage. You are likely smiling at the joke that Helen has found a vice with du Châtelet's blessing. But here is the complication: du Châtelet treats gambling and study as two different solutions to two different problems. Study is the engine of a happy old age; gambling is just the lubricant.

  Helen, however, has decided to make the lubricant the engine.

  She isn't following the prescription. She is doing something arguably more difficult. She is proving that the specific activity matters less than the quality of attention you bring to it. Du Châtelet said we need a passion that relies on ourselves rather than the world. Helen has looked at a table of cards, which is entirely dependent on chance and other people's bluffs, and decided to make it a domain of her own agency.

  She hasn't chosen the love of study. She has chosen the love of the game. And in doing so, she has reminded me that the point of du Châtelet's essay wasn't really about books. It was about autonomy. It was about refusing to let retirement mean becoming passive.

  So, I will not wish Helen a quiet retirement. I will not wish her a restful one. Du Châtelet wrote that boredom is the enemy, and Helen has taken that to heart.

  My wish for you, Helen, is that you always have a seat at the table. That when the arithmetic is against you, you play anyway. And that when you lose, you do it with the grace du Châtelet demanded, but with the confidence of someone who knows she'll win the next hand.

  To Helen.
