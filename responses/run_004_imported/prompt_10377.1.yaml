answer: |-
  Good morning, families, faculty, and the Class of 2024.

  Traditionally, this is the part where I tell you to "reach for the stars" or "trust your inner strength." But if I'm being honest, most of us spent the second half of this year battling a force much stronger than willpower. We call it senioritis. You know the feeling: You know you should study for finals. You know the future pain of failing outweighs the present pleasure of scrolling on your phone. And yet, you scroll.

  For the last year, I've been obsessed with why we do that. In my philosophy elective, we spent weeks on this exact problem. One ancient philosopher, Socrates, argued that what looks like weakness is actually just a math error. He believed no one chooses what they know is bad. When we procrastinate, we aren't choosing failure; we're just miscalculating the value of "now" versus "later."

  This sounds abstract until you talk to your psychology teacher. They call it "hyperbolic discounting." Our brains aren't wired to value the future smoothly. A reward right now feels infinitely heavier than a reward two weeks from now, even if the future reward is bigger. So, when you choose Netflix over studying, you aren't weak; you're just bad at temporal math. The future feels too small to compete with the present.

  But another philosopher, Aristotle, disagreed. He said weakness of will is real. He argued that we *do* have the knowledge, but in those moments, we aren't using it. He compared it to being asleep, or drunk. You can recite a geometry proof while sleeping, but it doesn't guide your actions. During senioritis, our better judgment was there—it was just dormant. We were sleepwalking through our own priorities.

  Whether it's a math error or dormant knowledge, the lesson is the same: relying on willpower alone is a trap. If our brains are wired to discount the future, and our knowledge can go dormant when we're tired or stressed, then "trying harder" isn't a strategy. It's a setup for failure.

  So, how do we succeed when we can't trust our own heads? We stop trying to be stronger, and start building better mazes.

  The ancient solution to this wasn't grit; it was precommitment. It's the story of Ulysses tying himself to the mast of his ship. He knew he couldn't trust his future self to resist the Sirens' song, so he restricted his future choices in advance. He didn't rely on willpower; he relied on structure.

  As we leave here, we're going to face bigger Sirens. Debt, burnout, distractions that are engineered to hack our dopamine systems. The hopeful truth isn't that you will become invincible. The hopeful truth is that you don't need to be.

  You can tie yourself to the mast. Automate your savings so you don't have to choose to save. Put your phone in another room so you don't have to choose to focus. Build environments where doing the right thing is the path of least resistance.

  We are not flawed because we struggle with this. We are human. But we are humans who can design around our flaws. So, don't just wish for strength. Build the structures that make strength unnecessary. Tie yourselves to the mast, set your course, and let the wind take you where you decided to go when you were clear-headed enough to choose.

  Congratulations, Class of 2024.
