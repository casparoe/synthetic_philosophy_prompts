      *   **Length:** Five minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Deconstruct Hannah Arendt's Framework:**
      *   *The Deliberate Lie:* Outright fabrication. Denying something happened that did. (The toast must *not* do this, nor accuse her of this unless it's true, which the prompt implies it isn't).
      *   *Reshaping Facts/Opinion:* Manipulating context, timing, emphasis, and interpretation. "The artful use of true ones." This is the gray area where PR lives.
