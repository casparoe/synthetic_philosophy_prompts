      *   *Epistemic Independence vs. Ontological Independence:* Just because knowledge of $X$ doesn't require knowledge of $Y$, doesn't mean $X$ doesn't depend on $Y$ for existence. (Example: I can know "2+2=4" without knowing about neurons, but my knowing it depends on neurons).
      *   *The "Self" Definition:* What is the "I" that remains? Is it a substance (soul) or just the locus of experience?
      *   *Descartes' Cogito:* This is essentially a modern, empirical version of the *Cogito, ergo sum*. Descartes argued similarly (I can doubt my body, but not my thinking).
