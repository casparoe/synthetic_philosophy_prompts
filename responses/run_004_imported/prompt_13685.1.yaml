      *   **Equivalence of Formalisms:** Turing $\equiv$ Church $\equiv$ Gödel. This *is* proven.
      *   **Adequacy of Formalisms:** Does Turing $\equiv$ "Human Calculator"? This is the unprovable part.
      *   **Analogy Check:** The user mentioned epsilon-delta continuity. This is a great analogy to dissect.
