      *   *Who has the better argument at each step?* Yes.
      *   *Flag what both are missing?* Yes.
      *   *No overall winner?* Yes.

  7.  **Final Polish:** Ensure the tone is empathetic to the friendship context but rigorous on the logic. (Self-Correction: Make sure I don't get too academic with terms like "tu quoque" without explaining them simply). Ensure I distinguish between "Truth of the claim" and "Standing to make the claim."

