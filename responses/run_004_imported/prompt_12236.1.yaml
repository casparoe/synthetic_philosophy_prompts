answer: |-
  Your friend is incorrect. There is a rigorous mathematical argument against betting 100% of your bankroll that has nothing to do with subjective "risk aversion" or emotional comfort. It relies on the difference between **Arithmetic Expected Value** and **Geometric Growth**, and the mathematical certainty of **Ruin**.

  If your goal is to place bets "for years" and compound your winnings, betting 100% of your bankroll is mathematically guaranteed to result in the total loss of your bankroll. It is not just "risky"; it is a strategy that makes your long-term goal impossible.

  Here is the breakdown of why your friend's logic fails, the mathematical principle that corrects it, and the specific fraction you should be betting.

  ### 1. The Flaw in Your Friend's Logic: Arithmetic vs. Geometric

  Your friend is arguing that you should maximize the **Arithmetic Expected Value (EV)** of each bet.
  *   **The Math:** If you have \$100 and bet it all ($f=1$):
      *   55% chance you have \$200.
      *   45% chance you have \$0.
      *   Arithmetic EV = $(0.55 \times 200) + (0.45 \times 0) = \$110$.
      *   This is a 10% return on average.

  If you do this once, the arithmetic average is indeed highest at 100% stake. However, you are not playing in a "multiverse" where you get to average the outcomes of 1,000 parallel versions of yourself. You are living in a single timeline where the results compound sequentially.

  In sequential betting with compounding, wealth grows (or shrinks) multiplicatively, not additively. The relevant metric for long-term wealth in a single timeline is the **Geometric Mean**, not the Arithmetic Mean.

  ### 2. The Argument from "Absorbing States" (Ruin)

  The most fundamental argument against betting 100% is the concept of an **absorbing state**. In gambling, \$0 is an absorbing state: once your bankroll hits zero, you cannot place further bets. The game ends for you.

  *   If you bet 100% of your bankroll every time, a single loss reduces your bankroll to zero.
  *   Since the probability of losing a single bet is 45% ($0.45$), the probability of surviving $N$ bets without a single loss is $0.55^N$.
  *   As $N$ approaches infinity (i.e., betting "for years"), $0.55^N$ approaches **zero**.

  Therefore, if you bet 100% of your bankroll, the probability of eventual ruin is **100%**.

  Even if you claim to be "indifferent to risk," you cannot be indifferent to a strategy that guarantees the termination of your activity. If your stated goal is to bet "for years," the 100% strategy is irrational because it makes that goal impossible with certainty. A rational agent must choose a strategy that allows the game to continue if they wish to realize the long-term edge.

  ### 3. The Solution: The Kelly Criterion

  The mathematical framework for determining the optimal bet size in repeated favorable wagers is the **Kelly Criterion**. Developed by John L. Kelly Jr. at Bell Labs in 1956, it does not rely on subjective risk tolerance. Instead, it calculates the fraction of capital that maximizes the **expected logarithmic growth rate** of the bankroll.

  Maximizing the expected log of wealth is mathematically equivalent to maximizing the long-term geometric growth rate. This is the fastest possible way to grow a bankroll over time without going bust.

  #### The Formula
  The standard Kelly formula for a binary outcome (win/loss) is:

  $$f^* = \frac{bp - q}{b}$$

  Where:
  *   $f^*$ = The fraction of the bankroll to stake.
  *   $b$ = The net odds received on the wager (profit per unit staked).
  *   $p$ = The probability of winning.
  *   $q$ = The probability of losing ($1 - p$).

  #### Applying Your Numbers
  Based on the figures you provided:
  *   **Win Probability ($p$):** 0.55
  *   **Loss Probability ($q$):** 0.45
  *   **Odds ($b$):** 1 (Since it is an even-money bet; you win \$1 profit for every \$1 staked).

  Plugging these into the formula:

  $$f^* = \frac{1(0.55) - 0.45}{1}$$
  $$f^* = 0.55 - 0.45$$
  $$f^* = 0.10$$

  ### 4. The Recommendation

  The mathematically optimal fraction of your bankroll to stake on each bet is **10%**.

  Here is why this is superior to your friend's 100% strategy, even for a "risk-neutral" investor:

  1.  **Growth Rate:** Betting 10% maximizes your compound annual growth rate. Betting more than 10% (e.g., 20% or 50%) actually *reduces* your long-term growth rate, despite having a higher arithmetic EV per bet. Betting 100% reduces your long-term growth rate to negative infinity (total ruin).
  2.  **Volatility Drag:** When you bet too large a fraction, the volatility of the returns drags down the geometric mean. For example, if you bet 50% of your bankroll and experience one win and one loss (in any order), you start with \$100, go to \$150, then drop to \$75. You lost money despite a 50/50 split in outcomes. The Kelly fraction balances the edge against this volatility drag.
  3.  **Survival:** At 10%, a losing streak reduces your bankroll but does not eliminate it. You remain in the game to exploit your edge over the thousands of bets you intend to place over "years."

  ### A Practical Caveat: Model Risk

  While the Kelly Criterion says 10% is optimal *if your probabilities are exact*, in the real world, statistical models are rarely perfect. Your 55% estimate might actually be 53%, or the market might adjust against you.

  If you overestimate your edge and bet full Kelly, you risk significant volatility and potential over-betting (which, as noted, reduces growth). Therefore, many professional gamblers and investors use **"Fractional Kelly"** (e.g., betting half the recommended amount).

  *   **Full Kelly:** 10% of bankroll. (Maximizes growth, high volatility).
  *   **Half Kelly:** 5% of bankroll. (Reduces volatility by roughly half, sacrifices only ~25% of growth rate, provides a safety margin against model error).

  ### Summary for Your Friend

  You can tell your friend this:
  1.  **Rationality requires survival.** If you bet 100%, the Law of Large Numbers guarantees you will eventually hit a loss sequence that wipes you out. You cannot compound winnings if you have no bankroll.
  2.  **EV is the wrong metric.** In repeated compounding, Geometric Mean dominates Arithmetic Mean. Maximizing Arithmetic EV leads to certain ruin; maximizing Geometric Mean leads to maximum wealth.
  3.  **The Math is settled.** The Kelly Criterion proves that for a 55% win rate at even money, the growth-optimal bet size is exactly **10%**. Betting more than 10% is mathematically suboptimal for growth; betting 100% is mathematically suicidal.

  **Recommendation:** Stake **10%** of your current bankroll on each wager. If you want to be conservative regarding model error, stake **5%**. Do not stake 100%.
