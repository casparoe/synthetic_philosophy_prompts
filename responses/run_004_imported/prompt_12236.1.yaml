prompt: |-
  A friend and I have spent the last couple of years building a statistical model for a fairly niche category of sports wagers, initially just as a way to put our shared background in statistics to some use outside our day jobs. Backtesting against several seasons of results has convinced us the model has found a genuine, persistent edge: on this type of bet, which happens to pay even money, our model puts the true probability of winning at about 55 percent rather than the 50 percent the price implies, so a winning bet doubles our stake and a losing one costs us the whole stake, with each bet effectively independent of the last. We intend to keep placing bets like this for years, rolling our winnings back into the pool rather than withdrawing them along the way. My friend's position is that since any individual bet here has a clearly positive expected value -- about 10 cents of profit for every dollar staked, on average -- the only defensible policy is to stake our entire bankroll on every single bet, since holding anything back just forfeits expected profit for nothing in return. When I push back that betting everything, every time, for years on end, seems obviously too risky, he says "too risky" is a feeling rather than an argument: if we're both genuinely indifferent to the possibility of losing it all, there's no further fact that could make a smaller stake the rational one, because expected value is exactly the quantity that rationality tells us to maximize.

  I would like to know whether he's actually right about that. Is it true that only risk aversion could ultimately justify staking less than everything on each bet here, or is there some more basic argument -- one that would apply even to two people who are genuinely indifferent to risk -- for why committing the whole bankroll every time would still be a mistake? If such an argument exists, I'd like to understand what fraction of the bankroll it would actually recommend staking on each bet, and how that number follows from the figures above, rather than just being told to be more careful.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** Two friends built a statistical sports betting model.
      *   **Edge:** They believe they have a 55% win rate on even-money bets (implied probability 50%, true probability 55%).
      *   **Payoff:** Even money (bet \$1, win \$1 profit + stake back, or lose \$1).
      *   **Strategy Dispute:**
          *   Friend: Bet 100% of the bankroll every time. Argument: Maximizes Expected Value (EV). Risk aversion is subjective; if indifferent to ruin, 100% is rational.
          *   User: Suspects 100% is too risky/wrong even without risk aversion. Wants to know if there's a mathematical argument against 100% betting that isn't just "risk aversion."
      *   **Goal:** Determine if the friend is right, explain the counter-argument (if any), and calculate the optimal fraction to bet based on the provided numbers.

  2.  **Evaluate the Friend's Argument (Maximizing Expected Value):**
      *   *Premise:* Rationality = Maximizing Expected Value of Wealth.
      *   *Math:* If $W_0$ is wealth, and you bet fraction $f$.
      *   Win: $W_1 = W_0(1 + f)$. Lose: $W_1 = W_0(1 - f)$.
      *   EV of one bet: $0.55 \times W_0(1+f) + 0.45 \times W_0(1-f) = W_0(1 + 0.1f)$.
      *   To maximize EV of *one* bet, set $f=1$. EV = $1.1 W_0$.
      *   If you repeat this $N$ times, the *arithmetic mean* of wealth grows fastest with $f=1$.
      *   *Flaw:* This ignores the *sequence* of returns and the concept of ruin. If you lose once with $f=1$, wealth becomes 0. You cannot bet again. The sequence ends.
      *   *Long-term perspective:* The user says "for years." This implies repeated betting (compounding).
      *   *Conclusion:* The friend is confusing Arithmetic Mean (EV) with Geometric Mean (Growth Rate). In repeated betting with compounding, maximizing Geometric Mean is the correct objective for long-term growth, not Arithmetic Mean.

  3.  **Identify the Core Mathematical Concept:**
      *   The problem describes a classic **Kelly Criterion** scenario.
      *   The Kelly Criterion maximizes the expected *logarithm* of wealth, which is equivalent to maximizing the long-term geometric growth rate.
      *   Why Log Wealth? Because of the Law of Large Numbers applied to multiplicative processes. Over many bets, the median outcome converges to the geometric mean, not the arithmetic mean.
      *   *Crucial Point:* Even if you are "risk neutral" in the utility sense, betting 100% leads to almost certain ruin (probability $\to 1$ as $N \to \infty$) because a single loss wipes you out. If the goal is to bet "for years," 100% betting makes that impossible. Therefore, 100% betting is irrational *given the goal*, regardless of risk aversion.

  4.  **Formulate the Counter-Argument:**
      *   **Argument 1: Ruin is Absorbing.** Once you hit 0, you stop. You can't recover. With $f=1$, probability of eventual ruin is 1 (since $P(\text{lose}) > 0$).
      *   **Argument 2: Ergodicity.** The friend is looking at the ensemble average (what happens to 1,000 parallel universes), but the bettor lives in one timeline (time average). In one timeline, the geometric mean dictates the outcome.
      *   **Argument 3: Utility of Money (Implicit).** Even if they claim indifference to risk, the utility of \$0 is effectively negative infinity if the goal is to continue betting. But more formally, maximizing $E[\log(W)]$ is the standard for repeated investment without exogenous utility functions.

  5.  **Calculate the Optimal Fraction (Kelly Criterion):**
      *   Formula: $f^* = \frac{bp - q}{b}$
      *   Where:
          *   $p$ = Probability of win = 0.55
          *   $q$ = Probability of loss = 0.45
          *   $b$ = Net odds received on the wager (profit per unit staked) = 1 (even money).
      *   Calculation:
          *   $f^* = \frac{1(0.55) - 0.45}{1}$
          *   $f^* = 0.55 - 0.45$
          *   $f^* = 0.10$
      *   Result: 10% of the bankroll.

  6.  **Draft the Response Structure:**
