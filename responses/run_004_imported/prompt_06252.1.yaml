answer: |-
  This is an exceptionally sharp reading of Chapter VI. You have identified what is perhaps the most delicate balancing act in *Principia Ethica*: reconciling the realist intuition that beauty exists independently of us with the idealist intuition that value is ultimately grounded in consciousness.

  Your friend's objection regarding personal affection is also astute, but I suspect it relies on a category error that Moore explicitly navigates. To untangle this for your piece, we need to look closely at how Moore distinguishes between the *existence* of value (the isolation test) and the *magnitude* of value (organic unities), and then examine why affection resists the isolation test in a way beauty does not.

  ### 1. The Isolation Test: Threshold vs. Magnitude

  The tension you feel arises if we interpret the "isolation test" in §113 as a claim about the *magnitude* of value. If the unwitnessed beautiful world is "good," and the witnessed beautiful world is "the greatest good," does the former eat up the value space of the latter?

  Moore's argument is not that the unwitnessed world possesses *equal* or even *substantial* value compared to the witnessed one. Rather, the isolation test is a **threshold argument**, not a **magnitude argument**.

  Moore uses the isolation test to refute the hedonistic claim that value *requires* consciousness. He needs to prove that $V(\text{Beautiful Object}) > 0$ even when $V(\text{Consciousness of Object}) = 0$. He succeeds in this by intuition: the beautiful world is better than the filthy one.

  However, once he establishes that $V(\text{Object}) > 0$, he immediately pivots to Organic Unities to explain the magnitude. In §114, he argues that while the beautiful object has *some* intrinsic value, the **whole** formed by [Consciousness of Beauty + Beautiful Object] has a value that is not merely the sum of the parts. It is a multiplier.

  Moore writes:
  > *"The addition of human consciousness... adds enormously to the value."*

  So, the resolution to your first puzzle is that Moore envisions a hierarchy:
  1.  **Unwitnessed Beauty:** A minor intrinsic good. (Proven by Isolation Test).
  2.  **Witnessed Beauty:** A major intrinsic good. (Proven by Organic Unities).

  The tension dissolves if we accept that for Moore, the unwitnessed world is *good*, but *trivially so* compared to the ideal. The isolation test secures the ontological status of beauty (it's real, not just a projection), while the organic unity principle secures the axiological primacy of consciousness (mind is where the value explodes).

  ### 2. The Friend's Objection: Affection vs. Beauty

  Your friend's challenge is: *Apply the isolation test to affection. Is a world with an unloved, admirable person better than one with an unloved, despicable person?*

  This is where Moore's framework creates a hard stop, and it illuminates why "The Ideal" consists of two distinct things (aesthetic appreciation and personal affection) that function differently.

  **The Category Error:**
  Moore defines "beauty" largely as a property of external objects (or at least, objects that *can* be external). Therefore, you can conceptually separate the *object* from the *mind*.
  However, Moore defines "personal affection" (and virtue) as **states of consciousness**. You cannot have "affection" without a mind feeling it.

  If your friend asks about an "admirable person" in a world with no observers, we must ask: **Is the admirable person conscious?**
  *   **If No:** Then there is no "person" in the morally relevant sense for Moore. A corpse or a robot might have the physical structure of a human, but for Moore, moral worth resides in mental states. An unconscious "good person" is like an unconscious "beautiful painting"—it might have *some* value as an object, but it lacks the specific value of virtue.
  *   **If Yes:** Then the person is not "unwitnessed." They witness themselves. They possess self-consciousness.

  **Moore's Radical Claim about Virtue:**
  Here is the point that might surprise your friend: Moore explicitly argues in Chapter VI that **virtue (or moral goodness of character) is not intrinsically good in isolation.**

  Moore distinguishes between the *virtue* of the agent and the *object* of affection. He argues that the "Ideal" is the *emotion* of love directed at a person, not the mere existence of the person.
  *   In the beauty case: Object (World) + Emotion (Appreciation) = High Value.
  *   In the affection case: Object (Person) + Emotion (Love) = High Value.

  If you strip away the emotion (the love), what is left?
  *   In the beauty case: A beautiful world. (Moore says: Still has *some* value).
  *   In the affection case: A person worthy of love. (Moore says: Has *little to no* intrinsic value on its own).

  Moore is quite clear that the existence of a human being, even a "good" one, does not constitute a great good unless there is **mutual affection** or **self-enjoyment** involved. If we imagine a world with one solitary, virtuous human who feels no affection for anyone (because there is no one) and takes no pleasure in anything, Moore would likely judge that world as having very little value, perhaps no more than the unwitnessed beautiful world.

  Therefore, the isolation test **does not license the same verdict** for affection as it does for beauty.
  *   **Beauty:** The object carries independent weight.
  *   **Affection:** The object (the person) is merely the necessary correlate for the mental state (the love). The value is almost entirely in the *relation* (the organic unity of loving mind + loved object).

  ### 3. Synthesizing for Your Piece

  For your article on early twentieth-century intuitionism, this tension is actually the key to understanding Moore's departure from earlier idealism.

  1.  **Realism about Value:** Moore uses the isolation test to prevent ethics from collapsing into subjective hedonism. Value is "out there" in the beautiful world, waiting to be found. This anchors his realism.
  2.  **Idealism about Magnitude:** Moore uses organic unities to prevent ethics from becoming a dry catalog of objects. The *apprehension* of value is where the ethical weight lies. This anchors his idealism.

  The "puzzle" you identified is the hinge on which Moore turns. He wants to say that beauty matters even if we aren't there (against the hedonist), but that *we* matter more when we are there appreciating it (against the materialist/realist who thinks mind is incidental).

  **How to frame the resolution:**
  You can argue that Moore's "Ideal" is not a list of things, but a **structural relationship**.
  *   The Isolation Test proves the *relata* (the beautiful object) have independent status.
  *   The Organic Unity principle proves the *relation* (conscious appreciation) generates the bulk of the value.

  Regarding your friend's point: You can note that Moore's framework is actually inconsistent here, or at least asymmetrical. He grants more independent value to *things* (beautiful worlds) than he does to *people* (virtuous characters) when stripped of consciousness. This is a common critique of *Principia Ethica*—that it values aesthetic states slightly more robustly than moral agents in isolation. Moore would likely reply that a "virtuous person" is defined by their capacity for appropriate emotions; without the opportunity to feel affection (because they are alone), their "virtue" is dormant and thus valueless.

  ### Summary for the Article
  The tension is intentional. Moore needs the isolation test to prove that value isn't *created* by consciousness (it is *recognized*), but he needs organic unities to prove that value isn't *realized* without consciousness. The unwitnessed beautiful world is a "sleeping" good; the witnessed world is an "awake" good. The isolation test proves the sleeper exists; the organic unity explains why waking them up is the primary ethical imperative.

  Your friend's objection highlights that for Moore, "persons" are valuable primarily as objects of consciousness (loved or self-aware), whereas "beautiful objects" retain a ghost of value even as mere matter. This asymmetry is a feature, not a bug, of Moore's specific brand of intuitionism: it privileges the *experience* of the good over the *existence* of the good, while refusing to say the good doesn't exist without the experience.
