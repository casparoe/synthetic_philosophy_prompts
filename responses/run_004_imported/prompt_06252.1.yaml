          5.  Synthesize: How Moore saves the "Ideal."
      *   *Key Citations/Concepts:* §113 (The two worlds), §114 (Organic Unities), §107-108 (The Ideal).
      *   *Refining the Argument:* Make sure to emphasize that for Moore, the *greatest* goods are always *conscious* states. The unwitnessed beauty is a *lesser* good. The tension is resolved by recognizing a hierarchy of goods, not a binary of valuable/valueless.

  6.  **Self-Correction/Nuance Check during drafting:**
      *   *Did Moore actually say the unwitnessed world is "good"?* Yes, §113. "I have no doubt... that the existence of such a world... is better than that of a heap of filth."
      *   *Did he say it's *great*?* No. He says the addition of consciousness makes it "immeasurably better."
      *   *The Friend's Affection Point:* This is the strongest part of the user's query. I need to be careful. Moore defines "personal affection" as an emotion *in* a mind. You can't have "unwitnessed affection." You can have an "unwitnessed object of affection." Does the object have intrinsic value? Moore says beautiful things do. Do *good people* (as objects) do? Moore tends to think the *virtue* (mental state) is the good, not the physical organism. So the analogy to the beautiful world (physical objects) is slightly off. I need to point out that for Moore, moral virtue is *internal* to consciousness, whereas beauty is often *external*.
      *   *Wait, check Moore on Virtue:* Moore argues virtue is not intrinsically good in itself (Chapter VI). Virtue is good only as a means or as part of a whole. Wait, no. Moore says Virtue (doing duty) is not the *ultimate* end. The ultimate ends are aesthetic enjoyment and personal affection. So a "good person" (virtuous) is only good insofar as they promote these ends or possess these states.
      *   *Correction:* Moore actually argues that *virtue* (the disposition to do duty) is not intrinsically good in isolation. It's the *emotions* that constitute the ideal. So the friend's example of an "admirable person" is tricky. If "admirable" means "virtuous," Moore might say that without the actual emotions of affection or aesthetic enjoyment, the virtue itself has little intrinsic value. This actually strengthens Moore's position against the friend. I should highlight this.

  7.  **Final Polish:** Ensure the distinction between *intrinsic value* (what the thing is in itself) and *total value* (what the whole situation is) is clear. Ensure the distinction between *beauty* (property of object) and *aesthetic appreciation* (state of mind) is clear.

      *(Self-Correction on the "Virtue" point)*: In *Principia*, Moore is quite radical. He says that "Virtue" (doing one's duty) is not the *summum bonum*. The *summum bonum* consists of states of consciousness. So an "admirable person" who feels no affection and appreciates no beauty is not, for Moore, a locus of high intrinsic value. This is a crucial point to answer the friend.

