      *   **The Collapse Argument (The Core):**
          *   If hyperplans partition logical space just like propositions...
          *   And "accepting a hyperplan" functions just like "believing a proposition" regarding consistency and entailment...
          *   Then what is the difference between "It is true that X is good" and "I accept a hyperplan that entails X"?
          *   Gibbard wants to say one is cognitive, one is normative. But if the *structure* is identical, the distinction is unexplained.
          *   Invoke Dreier: If you have truth-conditions (even expressivist ones), you have truth. If you have truth, you have facts (deflationary). If you have facts and truth, you are a cognitivist.

      *   **Comparison with Blackburn and Schroeder (Sharpening the Point):**
          *   *Blackburn:* Quasi-realism. Tries to earn the right to talk like a realist. But if he succeeds completely, he *is* a realist (Dreier's point). His "tree-structures" try to keep the psychology distinct, but the semantics often looks propositional.
          *   *Schroeder:* "Being for." Tries to find a generic attitude. But if "being for" is the content-bearer for logic, does it differ from belief? Schroeder admits the distinction is hard to pin down.
          *   *Gibbard's specific vulnerability:* Gibbard leans harder into the possible-worlds isomorphism than Blackburn. He explicitly models normative content on factual content to get validity. This makes the collapse more acute.

      *   **The "Theoretical Advantage" Loss:**
          *   What did expressivism buy us?
              1.  Ontological parsimony (no normative facts).
              2.  Explanation of motivation (internalism).
          *   If Gibbard is just a deflationary cognitivist:
              1.  He still has "normative facts" (deflationary). So parsimony is lost (or at least the *distinction* in parsimony is).
              2.  The link to motivation becomes mysterious again. If accepting a hyperplan is just a cognitive state with truth conditions, why does it motivate? Cognitivists struggle with this. Expressivists solved it by making the state *conative*. If the state is structurally identical to belief, the solution evaporates.

      *   **Conclusion:** Reiterate the thesis. Gibbard saved logic by sacrificing the soul of expressivism.

