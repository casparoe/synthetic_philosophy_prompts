answer: |-
  The central promise of expressivism has always been twofold: ontological parsimony and psychological distinctness. It promises to explain normative discourse without positing "queer" normative facts (ontology) and to capture the inherently action-guiding nature of moral judgment by identifying it with a conative, rather than cognitive, mental state (psychology). Allan Gibbard's *Wise Choices, Apt Feelings* represents the most sophisticated attempt to secure the logical respectability of this view. By modeling normative content via "hyperplans"—maximally specific plans for living that partition logical space much like possible worlds—Gibbard aims to make validity and embedding "come along for free."

  However, this solution comes at a catastrophic cost. The argument I will advance is that Gibbard's hyperplan machinery, precisely insofar as it successfully mimics the semantic structure of descriptive content to solve Frege-Geach, erodes the very distinction between cognitive and non-cognitive states. By making normative content isomorphic to propositional content, Gibbard renders expressivism a notational variant of deflationary cognitivism. Consequently, the view loses the theoretical advantages that motivated expressivism in the first place: it no longer offers a genuinely distinct account of moral psychology, nor does it secure a meaningful ontological advantage over a minimalist realist.

  ### The Isomorphism of Content

  To see why the collapse is inevitable, we must look at the semantic role Gibbard assigns to hyperplans. In standard possible-worlds semantics, a proposition is a set of possible worlds. To believe a proposition is to rule out all worlds where that proposition is false. Gibbard's innovation is to treat a normative state (accepting a norm) as the ruling out of all *hyperplans* incompatible with that norm. A hyperplan specifies what to do in every conceivable situation.

  The problem arises because Gibbard structures the relations between hyperplans to mirror exactly the relations between possible worlds. He needs this isomorphism to explain logical validity. If "Lying is wrong" entails "If lying is wrong, then getting your little brother to lie is wrong," the content of these sentences must interact logically. For Gibbard, this interaction is secured because the hyperplan-content of "Lying is wrong" excludes a specific set of hyperplans, and the logical connectives operate on these exclusions just as they operate on truth-conditions.

  But once normative content is defined by its exclusion of specific hyperplans in a logically structured space, the functional role of "accepting a norm" becomes indistinguishable from "believing a proposition." In both cases, the agent is in a state that:
  1.  Has correctness conditions (a hyperplan is either consistent or inconsistent with the norm).
  2.  Participates in logical entailment relations.
  3.  Can be assessed for consistency.

  If the semantic value of a normative sentence is a function from hyperplans to truth-values (or acceptance-conditions), and these functions behave exactly like truth-conditions, we must ask: what remains of the "non-cognitive" label? Gibbard insists that the *nature* of the state is planning, not believing. But if the *content* of the plan is propositionally structured and the *logic* governing the plan is classical, the psychological distinction becomes explanatorily idle.

  ### Dreier's Creeping Minimalism and the Loss of Ontological Advantage

  James Dreier's "creeping minimalism" objection sharpens this point. Dreier argues that if expressivists adopt deflationary notions of truth, facts, and representation to explain their semantics (as Gibbard must to handle embedding), they become indistinguishable from cognitivists who also adopt deflationary notions.

  Gibbard wants to say, "There are no normative facts, only plans." But if a hyperplan determines the 'correctness' of a normative judgment in every situation, and we have a deflationary notion of truth where 'It is true that lying is wrong' is equivalent to 'Lying is wrong,' then Gibbard is committed to normative facts in the only sense that matters. A hyperplan that rules out lying in situation S functions exactly as a truth-maker for the proposition "Lying is wrong in S."

  If the expressivist and the deflationary cognitivist both say:
  1.  Moral sentences express states with truth-conditions (or acceptance-conditions).
  2.  Moral sentences can be true or false (deflationarily).
  3.  Moral sentences entail one another.

  Then the claim that expressivism is ontologically superior collapses. The cognitivist says, "There are moral facts (deflationarily)." Gibbard says, "There are no moral facts, only hyperplans." But if hyperplans do the exact same semantic work as facts, this is a verbal dispute. The theoretical advantage of ontological parsimony is lost because Gibbard has imported all the ontological baggage of cognitivism under the guise of "planning." He has saved the phenomena of moral discourse by conceding the realist's semantic landscape.

  ### The Erosion of Psychological Distinctness and Internalism

  The loss is even more severe regarding moral psychology. The original motivation for expressivism was to explain internalism: the necessary connection between moral judgment and motivation. Cognitivists struggle to explain why believing "X is good" should motivate an agent to do X. Expressivists solved this by saying judging "X is good" *is* having a pro-attitude or plan toward X.

  However, Gibbard's hyperplan solution threatens to sever this link. By fattening up the object of the attitude into a hyperplan to secure logic, Gibbard makes the attitude itself more cognitive. A "maximally specific plan for living" is an incredibly complex, abstract object. To "accept" such a plan requires a sophisticated cognitive grasp of logical consistency across counterfactual situations.

  If the state of "accepting a hyperplan" is structurally isomorphic to belief, why does it motivate? If I believe the proposition *p* (where *p* maps to a set of worlds), I am not necessarily motivated to act. If I accept the hyperplan *h* (where *h* maps to a set of plans), and *h* is functionally identical to *p* regarding logic and truth, what ensures *h* motivates while *p* does not? Gibbard appeals to the *nature* of the state (planning vs. believing), but if the semantic role is identical, the psychological difference is opaque.

  Compare this to Simon Blackburn's quasi-realism. Blackburn attempts to construct a "tree-structured" attitude where higher-order moral judgments are attitudes toward lower-order attitudes. He tries to keep the psychology distinct by emphasizing the projective nature of the state. However, Blackburn faces the same trap: if his quasi-realist successfully earns the right to talk about moral truth and knowledge, Dreier argues he has simply become a realist. Gibbard is more vulnerable than Blackburn here because Gibbard explicitly adopts a possible-worlds-style semantics for plans. Blackburn's expressivism is more overtly psychological; Gibbard's is more overtly semantic. By prioritizing the semantic solution to Frege-Geach, Gibbard makes the psychological distinctness harder to maintain.

  Mark Schroeder's "being for" proposal attempts to dodge this by positing a generic attitude distinct from belief. But Schroeder admits the difficulty: if "being for" is to sustain logic, it must behave like belief. Gibbard's hyperplans are essentially an attempt to specify *what* we are "for" (a plan) in enough detail to sustain logic. But in doing so, the "plan" becomes a proposition. If I am "for" a hyperplan that entails I do not lie, and that hyperplan is a truth-conditional object, my state is indistinguishable from believing I ought not to lie.

  ### The Verdict: A Vacuous Distinction

  The crux of the argument is that theoretical virtues are earned through explanatory power, not terminology. Expressivism was supposed to explain two things better than cognitivism: the logic of moral language (without realist ontology) and the motivation of moral agents (without Humean psychology problems).

  Gibbard's hyperplan machinery solves the first by conceding the second.
  1.  **Logic:** He secures validity by making normative content propositional in structure.
  2.  **Ontology:** In doing so, he reintroduces "facts" (hyperplan-conditions) that render his ontological parsimony vacuous against a deflationary realist.
  3.  **Psychology:** By making the content so abstract and logic-governed, the link to motivation becomes as mysterious as it is for the cognitivist. If accepting a hyperplan is just a matter of consistency within a logical space, the "oomph" of the conative state is drained.

  Therefore, Gibbard's view collapses into a notational variant of deflationary cognitivism. He calls the states "plan-acceptances" and the contents "hyperplans," while the cognitivist calls them "beliefs" and "propositions." But if both sets of terms refer to states that bear identical logical relations, possess identical truth-conditions (deflationarily speaking), and face identical challenges regarding motivation, the expressivist label is empty.

  Gibbard saves the logic of moral discourse, but he does so by building a cognitive replica of it within the expressivist framework. In solving Frege-Geach so thoroughly that normative content behaves exactly like descriptive content, he eliminates the very feature—the non-cognitive, practical nature of judgment—that defined expressivism. The theoretical advantage is not just diminished; it is extinguished. We are left with a cognitivist theory wearing expressivist clothing, having sacrificed the soul of the view to save its logic.
