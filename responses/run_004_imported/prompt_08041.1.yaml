      *   *Premise 2:* To solve Frege-Geach (embedding/logic), Gibbard introduces "hyperplans" (maximally specific plans) which function semantically like possible worlds.
      *   *Premise 3:* If normative content is modeled using a possible-worlds-style semantics (fact-like structures), the distinction between "accepting a hyperplan" and "believing a normative proposition" becomes merely notational.
      *   *Premise 4:* Dreier's "creeping minimalism" shows that if expressivists adopt truth-conditions, entailment, and facts (even deflationary ones), they become indistinguishable from cognitivists.
      *   *Conclusion:* Gibbard's solution to Frege-Geach saves logic at the cost of the very feature (the practical/non-cognitive distinction) that made expressivism attractive. It becomes cognitivism in disguise.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Define the expressivist promise (ontology + psychology). Introduce Gibbard's move (hyperplans). State the thesis clearly: The semantic machinery required to save logic erases the psychological/ontological distinction.

      *   **The Expressivist Motivation:** Why start here? To show what is *lost*. It's not just about logic; it's about explaining the *nature* of judgment. Cognitivism says judgment is belief-like (mind-to-world). Expressivism says it's plan-like (world-to-mind/practical). If this distinction vanishes, expressivism is dead.

      *   **Gibbard's Hyperplan Solution:** Briefly explain *Wise Choices, Apt Feelings* (and *Thinking How to Live*). Normative states = accepting a norm. Norms = functions from situations to actions (hyperplans). This looks like possible worlds.
