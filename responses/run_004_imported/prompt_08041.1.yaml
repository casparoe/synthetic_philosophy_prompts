      *   **Task:** Argue *FOR* the claim that Gibbard's hyperplan machinery, by solving the logical embedding problem too well, loses the theoretical advantage of expressivism over cognitivism (i.e., it collapses into a notational variant of deflationary cognitivism).
      *   **Constraints:** Do not provide a balanced survey. Provide a sustained argument for the thesis. Use Blackburn and Schroeder comparably to sharpen the point if helpful.
      *   **Tone:** Academic, rigorous, suitable for comps prep (philosophically dense).

  2.  **Deconstruct the Core Argument:**
