answer: |-
  **Title:** The Limits of Assertion: Emptiness as Presupposition Failure in the *Mūlamadhyamakakārikā*

  **Introduction**

  The interpretive crux of Nāgārjuna's *Mūlamadhyamakakārikā* (MMK) lies in the logical status of the *catuṣkoṭi* (tetralemma). In Chapter 18, Nāgārjuna deploys the four corners—$P$, $\neg P$, $P \land \neg P$, and $\neg(P \lor \neg P)$—not merely to refute opponents, but seemingly to characterize the Buddha's teaching on reality itself. This has precipitated a sharp divide in contemporary scholarship. On one side, the "dialetheist" reading (championed by Garfield and Priest) argues that Nāgārjuna commits to true contradictions at the limit of thought, requiring a paraconsistent logic. On the other, the "presupposition failure" reading (associated with Westerhoff and classical Prāsaṅgika interpretations) argues that the tetralemma exposes a shared false presupposition (*svabhāva*) inherent in ontological discourse, resulting in truth-value gaps rather than contradictions.

  While the dialetheist reading offers a bold reconstruction of ultimate truth, it risks reifying emptiness into a contradictory metaphysical position, violating Nāgārjuna's explicit disavowal of views (*dṛṣṭi*). This essay argues that the presupposition failure reading is philosophically and textually superior. It accounts for the therapeutic soteriology of Madhyamaka without positing a contradictory ontology, and it utilizes the Two Truths doctrine to preserve the assertibility of conventional discourse while demonstrating the semantic defectiveness of ultimate ontological claims.

  **I. The Case for Dialetheism: The Logic of Paradox**

  The strongest argument for the dialetheist reading rests on a literal interpretation of MMK 18.8–9, where Nāgārjuna states that "everything is real," "everything is unreal," "both," and "neither" constitutes the Buddha's teaching. Proponents like Graham Priest and Jay Garfield argue that classical logic, governed by the Law of Non-Contradiction (LNC) and the Principle of Explosion (*ex contradictione quodlibet*), cannot model this without trivializing Nāgārjuna's system. If $P$ and $\neg P$ are both true, classical logic allows one to derive any $Q$, rendering the system useless.

  To avoid this, the dialetheist employs a paraconsistent logic, such as the Logic of Paradox (LP). In LP, truth values are $\{1, 0, i\}$, where $i$ represents "both true and false." Designated values (those preserved in valid inference) include both $1$ and $i$. This allows the Madhyamaka philosopher to assert that ultimate reality is *ineffable*, while simultaneously acknowledging that the assertion "reality is ineffable" is itself a linguistic construct that must be both true (conventionally) and false (ultimately).

  On this reading, the Two Truths are not separate domains but mutually entailing perspectives. Conventional truth (*saṃvṛti-satya*) operates under classical bivalence, sufficient for pragmatic navigation of the world. Ultimate truth (*paramārtha-satya*), however, is the realization that conventional designations are empty. Because language is inherently dualistic, any attempt to state the ultimate truth forces a contradiction. Thus, the *catuṣkoṭi* is not a heuristic to be discarded but an accurate map of the contradictory structure of reality when viewed from the limit. The dialetheist argues that only by accepting true contradictions can we avoid the nihilism of saying "nothing exists" or the eternalism of saying "something exists." Emptiness itself must be empty, leading to a contradictory status: emptiness exists (conventionally) and does not exist (ultimately).

  **II. The Case for Presupposition Failure: The Semantics of Emptiness**

  The competing reading, advanced by Jan Westerhoff and aligned with traditional Tibetan Prāsaṅgika commentary, rejects the need for paraconsistent logic. Instead, it locates the source of the contradiction in the semantics of the subject term. The four horns of the *catuṣkoṭi* all presuppose that the subject of predication possesses *svabhāva* (inherent existence).

  In formal semantic terms, *svabhāva* functions as a presupposition for ontological predicates. Consider the sentence "The present King of France is bald." In a Strawsonian analysis, this sentence is neither true nor false because the definite description fails to refer. Similarly, when Nāgārjuna analyzes "The self exists" or "The world is eternal," he is not negating the predicate; he is demonstrating that the subject lacks the ontological status required to bear the predicate. If *svabhāva* is empty, then any predicate $F$ applied to an entity $x$ with the assumption of inherent existence results in presupposition failure.

  Consequently, all four horns of the *catuṣkoṭi* are rejected not because they are contradictory, but because they are ill-formed.
  1.  $P$ (True)
  2.  $\neg P$ (False)
  3.  $P \land \neg P$ (Contradiction)
  4.  $\neg(P \lor \neg P)$ (Tautology/Negation of Excluded Middle)

  If the presupposition fails, none of these truth values apply. The logical form is not $P \land \neg P$, but rather $\text{Presupposition}(P) = \text{False}$. This preserves classical logic while explaining why Nāgārjuna rejects all four options without falling into silence or contradiction.

  Regarding the Two Truths, this reading posits that conventional truth is not a lower-grade reality but a domain of pragmatic assertibility. Sentences are "conventionally true" if they cohere within a web of dependent designations, much like moves in a game are "valid" relative to the rules. Ultimate truth is not a contradictory state of affairs, but the *recognition* that the semantic conditions for ontological commitment are never met. Ultimate truth is the cessation of conceptual proliferation (*prapañca*), not a description of a contradictory world.

  **III. Defense: Why Presupposition Failure Wins**

  While the dialetheist reading is philosophically provocative, it ultimately fails to capture the soteriological core of Madhyamaka. I argue that the presupposition failure reading is correct because it alone preserves Nāgārjuna's "no-view" stance, avoids reifying emptiness, and provides a more robust semantic model for the Two Truths.

  **1. The Soteriological Argument: Cessation vs. Contradiction**
  The goal of the MMK is not to construct a better metaphysics, but to end suffering (*duḥkha*). Nāgārjuna identifies suffering with *prapañca*—conceptual proliferation or linguistic reification (MMK 25.24). The dialetheist reading suggests that liberation involves accepting true contradictions. However, accepting a contradiction is still a cognitive act; it is still a *view* (*dṛṣṭi*). If the ultimate truth is a contradiction, the mind must hold $P$ and $\neg P$ simultaneously. This sustains the very conceptual activity Madhyamaka seeks to quell.

  The presupposition reading, conversely, models liberation as the dissolution of the question. If I ask, "Is the self eternal?" and you show me that "self" presupposes an inherent existence that does not obtain, I do not adopt a new view (e.g., "The self is both eternal and non-eternal"). I simply stop asking the question. This aligns with the simile of the raft: the Dharma is for crossing over, not for holding. Dialetheism asks us to hold the raft forever as a paradoxical object; the presupposition reading shows us how to step onto the shore and leave it.

  **2. The "No-View" Constraint (MMK 13.8)**
  In MMK 13.8, Nāgārjuna states: "The Victorious Ones have announced that emptiness is the relinquishing of all views. For whomever emptiness is a view, that one has accomplished nothing." This is the fatal objection to the dialetheist reading. If emptiness is modeled as a true contradiction ($P \land \neg P$), then "Emptiness is a true contradiction" becomes a metaphysical thesis about the nature of reality. It becomes a *dṛṣṭi*.

  The presupposition reading avoids this. To say "All ontological claims suffer from presupposition failure" is not itself an ontological claim; it is a semantic diagnosis of ontological claims. It is a second-order statement about language, not a first-order statement about the world. This allows Nāgārjuna to maintain a position without a view. He is not asserting a contradictory reality; he is demonstrating the incoherence of asserting *any* inherent reality.

  **3. Formal Semantics and the Two Truths**
  From the perspective of formal semantics, the presupposition reading offers greater explanatory power regarding the Two Truths. The dialetheist must posit two logics: classical for the conventional, paraconsistent for the ultimate. This creates a fragmentation problem: how do the two logics interface? If I say "The pot is empty," is that a classical assertion or a paraconsistent one?

  The presupposition reading unifies the logic. We operate with classical logic (or a standard dynamic semantics), but we recognize that truth is context-dependent.
  *   **Conventional Truth:** A sentence $S$ is conventionally true if its presuppositions are accommodated within a specific context $C$ (the web of dependent origination). In context $C$, "Fire is hot" is assertible.
  *   **Ultimate Truth:** A sentence $S$ is ultimately true only if its presuppositions hold independently of any context $C$. Since all phenomena are dependently originated, no presupposition of inherent existence holds context-independently. Therefore, no ontological sentence has an ultimate truth value.

  This explains why Nāgārjuna can vigorously debate conventional causality while denying ultimate causality. He is not contradicting himself; he is shifting the context of evaluation. The dialetheist reading struggles to explain why we should act on conventional truth if ultimate truth contradicts it. The presupposition reading explains that conventional truth is *pragmatically valid* (like a map), while ultimate truth is the realization that the territory does not contain the map's legends (inherent existence).

  **Conclusion**

  The temptation to read Nāgārjuna as a dialetheist stems from a desire to make the *catuṣkoṭi* say something positive about ultimate reality. However, this desire is precisely what Nāgārjuna diagnoses as the root of *prapañca*. The dialetheist reading, while logically sophisticated, turns Emptiness into a "contradictory essence," violating the core tenet that emptiness itself must be empty.

  The presupposition failure reading is superior because it treats Madhyamaka as a therapeutic semantic critique rather than a paradoxical metaphysics. It respects the Law of Non-Contradiction while showing why ontological discourse fails to satisfy its conditions. By framing the *catuṣkoṭi* as an exposure of shared false presuppositions rather than a description of contradictory states of affairs, we preserve the soteriological goal of the cessation of views. Ultimate truth is not a contradiction; it is the silence that follows when one realizes the question was never well-formed. For the formal semanticist, this is the more rigorous result: it does not require revising the logic of truth, but rather refining the semantics of reference and presupposition. Nāgārjuna is not asking us to believe contradictions; he is asking us to notice what our words assume, and to let go when those assumptions fail.
