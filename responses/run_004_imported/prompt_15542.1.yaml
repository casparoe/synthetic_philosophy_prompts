      *   *Correction:* Maudlin's *Philosophy of Physics: Space and Time* argues that the Hole Argument relies on a confusion about what a model represents. He defends a form of substantivalism but rejects the idea that diffeomorphisms generate distinct physical possibilities. I need to reflect this nuance. The "Sophisticated Substantivalist" view is essentially agreeing with the physicist's practice: distinct mathematical models $\to$ same physical situation.

  5.  **Final Plan:**
      1.  Validate the intuition (it *looks* like bookkeeping).
      2.  Explain the "Manifold Substantivalist" trap (points as bare particulars).
      3.  Explain the Indeterminism result (failure of supervenience).
      4.  Explain the Escape (Leibniz Equivalence).
      5.  Define Sophisticated Substantivalism (accepting points exist but denying they have haecceity/identity independent of structure).
