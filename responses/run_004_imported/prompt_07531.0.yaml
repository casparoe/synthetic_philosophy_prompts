answer: |-
  This is one of the most fascinating friction points in modern decision theory, and your confusion is completely warranted. You are standing right in the middle of a clash between **mathematical equivalence** (your TA's position) and **physical/ontological justification** (Peters' position).

  Here is the breakdown of who is right, why it matters, and how you should handle your roommate's dangerous financial advice.

  ### 1. The Theoretical Standoff: Is it Just Log Utility?

  Your TA and Ole Peters are arguing past each other on two different levels: the **formal** level and the **foundational** level.

  **Your TA is mathematically correct.**
  In the von Neumann–Morgenstern (VNM) expected utility framework, if you choose a utility function $u(w) = \log(w)$, maximizing expected utility is mathematically identical to maximizing the expected geometric growth rate (the Kelly Criterion). If you walk into a standard microeconomics exam and write down "I maximize $E[\log(W)]$," no one will mark you wrong. In this sense, the "ergodicity economics" math doesn't produce new equations; it reproduces known results.

  **However, Peters is philosophically distinct.**
  The disagreement is about *why* you use the log function.
  *   **Standard EUT (Your TA):** Risk aversion is a **preference**. You use log utility because you are *subjectively* cautious. A risk-neutral agent (linear utility) should theoretically take the "all-in" bet your roommate suggests.
  *   **Ergodicity Economics (Peters):** Risk aversion is a **constraint of reality**. In multiplicative dynamics (like investing), the "ensemble average" (what happens to 1,000 parallel universes) diverges from the "time average" (what happens to *you* over 1,000 days). If a process is non-ergodic, maximizing the ensemble average (standard Expected Value) will lead to ruin for the single agent over time.

  **The Verdict:**
  The TA is right that the *machinery* is the same. Peters is right that the *justification* changes everything.
  *   Under EUT, telling someone not to go all-in is saying, "You happen to dislike risk."
  *   Under Ergodicity, telling someone not to go all-in is saying, "If you do that, the mathematics of time guarantees you will eventually lose everything, regardless of your preferences."

  Peters isn't discovering a new utility function; he is arguing that for wealth dynamics, **log utility is the only utility function that aligns with the physical reality of time.**

  ### 2. Practical Implications: The Roommate's Proposal

  Your roommate is making a classic **Ensemble vs. Time** error. Here is how you use this framework to dismantle their argument.

  #### The "Positive EV" Fallacy
  Your roommate says: "The expected value is positive, so it's irrational not to."
  This is **Ensemble Thinking**. They are imagining 1,000 versions of you making this bet once. In that scenario, the average wealth across the group skyrockets.

  But you are not 1,000 people. You are one person making a sequence of decisions over time. This is a **Time Average** problem.
  *   **Multiplicative Dynamics:** Wealth investing is multiplicative ($W_{next} = W_{current} \times \text{Return}$).
  *   **The Trap:** In multiplicative processes, volatility acts as a drag on compound growth. If you lose 50%, you need a 100% gain just to get back to even.
  *   **Risk of Ruin:** If you bet 100% of your savings on a volatile stock, there is a non-zero probability the stock goes to zero (or close enough that you psychologically capitulate). If $W = 0$, the game ends. You cannot recover. The time-average growth rate of a strategy that risks ruin is effectively negative infinity over a long enough horizon.

  #### The Kelly Criterion Application
  The Kelly Criterion tells you the specific fraction of your bankroll to bet to maximize long-term geometric growth.
  $$f^* = \frac{p(b+1) - 1}{b}$$
  *(Where $p$ is win probability, $b$ is odds received)*

  Even if the bet has positive expected value, Kelly almost **never** recommends betting 100% of your bankroll unless the probability of loss is literally zero.
  *   **Implication 1:** Sizing matters more than selection. A good bet taken at the wrong size (too large) is a bad strategy.
  *   **Implication 2:** "Half-Kelly." In practice, because estimating probabilities is hard, most practitioners bet half the Kelly recommendation. This reduces volatility by 50% while only sacrificing 25% of growth. It provides a safety margin against model error.

  #### Diversification as Ergodicity
  Ergodicity economics provides a strong argument for diversification. By holding a basket of uncorrelated assets, you make the system more "ergodic." You smooth out the path so that the time average converges faster to the ensemble average. Putting all savings in one stock maximizes non-ergodicity (idiosyncratic risk).

  ### 3. How to Talk to Your Roommate (and Yourself)

  You don't need to lecture your roommate on measure theory. You can use the intuition derived from the seminar:

  1.  **Survival is the First Utility:** "I can't capture the expected value if I go bust before the long run arrives." The market doesn't care about your average return; it cares about your sequence of returns.
  2.  **The Game Must Continue:** Decision theory for life isn't about maximizing one bet; it's about maximizing the number of bets you get to make. Going all-in reduces the expected number of future bets to zero.
  3.  **Volatility Drag:** Explain that in compounding, arithmetic average returns lie. Geometric average returns are what you actually eat. High volatility lowers the geometric mean even if the arithmetic mean stays high.

  ### 4. Caveats and Nuance (Don't Worship Kelly)

  While the ergodicity crowd is onto something real, don't swing too hard the other way.
  *   **Kelly assumes infinite divisibility and rebalancing:** You can't actually rebalance continuously, and stocks have liquidity constraints.
  *   **Utility of Consumption:** You aren't just maximizing wealth; you're maximizing consumption. If you need this money for rent in 6 months, the "long-run time average" is irrelevant. You have a **liquidity constraint**, which acts like a hard ruin boundary.
  *   **The TA's "Arbitrary" Point:** There is still some truth to the TA. Why maximize *growth rate*? Why not maximize growth rate subject to a maximum variance constraint? Choosing to maximize time-average growth is still, in a sense, a choice. But it is a much more defensible choice than "I just feel like being risk-averse."

  ### Summary

  **Who is right?**
  *   **Mathematically:** The TA. Kelly is Log Utility.
  *   **Normatively/Physically:** Peters. Log Utility is not arbitrary; it is derived from the structure of time and multiplicative dynamics.

  **What should you do?**
  Your roommate is advising you to optimize for an **ensemble average** (positive EV) in a **time-average** situation (your life savings). This is the definition of non-ergodic reasoning.
  *   **Do not go all-in.**
  *   Treat your savings as a "stack" required to stay in the game.
  *   Use the Kelly insight to determine position size (likely very small for a single volatile stock), or better yet, diversify to reduce the volatility drag.

  The ergodicity framework gives you the vocabulary to say: "It's not that I'm scared of risk; it's that your strategy is mathematically guaranteed to underperform over time due to volatility drag and ruin risk." That is a much stronger argument than "I'm risk-averse."
