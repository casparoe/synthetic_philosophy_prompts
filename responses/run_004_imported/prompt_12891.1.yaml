  ok so my friend and I are both teaching ourselves game theory this summer before college using some online lectures (neither of our high schools offer it), and we've been writing eachother practice problems off of what we watched and grading them. I already graded hers but idk if I'm being too harsh or too easy, so I want someone else to actually check it properly - point by point, not just a vibe check.

  here's the game I gave her (payoffs written as (Player 1, Player 2)):

        L        C        R
  T   (4,3)   (0,2)   (2,0)
  M   (1,3)   (1,1)   (2,0)
  B   (0,2)   (4,3)   (2,0)

  the question was: find every strategy for both players that survives iterated elimination of strictly dominated strategies. a strategy counts as eliminated if its strictly dominated by another PURE strategy OR by some mixed strategy (a probability mix over the player's other strategies), not just pure ones. show each round and explain why nothing else can be eliminated at the end.

  her answer:

  "Def: strategy s is strictly dominated by s' if s' does at least as well as s against everything the opponent could play, and strictly better in at least one case. A strictly dominated strategy is never a best response, so it can be deleted.

  Round 1 (Player 2's strategies): compare R to L. At T, L gives 3 > 0. At M, L gives 3 > 0. At B, L gives 2 > 0. So L strictly dominates R, delete R.

  Round 2 (Player 1's strategies), only L and C matter now: T=(4,0), M=(1,1), B=(0,4). T vs M: T is better at L (4>1) but worse at C (0<1), so no domination. B vs M: B is better at C (4>1) but worse at L (0<1), so no domination. T vs B: each wins one column, so neither dominates. So none of T, M, B can be deleted.

  Round 3 (Player 2's strategies again), T, M, B still all in play: at T, L=3 > C=2. At M, L=3 > C=1. At B, L=2 < C=3. Neither wins both, so neither L nor C can be deleted.

  Final answer: only R is eliminated. T, M, B, L, and C all survive."

