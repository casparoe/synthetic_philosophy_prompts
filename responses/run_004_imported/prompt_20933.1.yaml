answer: |-
  This is a classic and deeply significant dispute in moral philosophy. You and your friend have inadvertently recreated a debate that occupies a central place in contemporary ethics: the distinction between the *substantive validity* of a moral claim and the *procedural standing* of the person making it.

  Your intuition (that hypocrisy affects the blamer, not the truth) aligns with G. A. Cohen. Your friend's intuition (that hypocrisy silences the blamer) aligns with R. Jay Wallace. Both are compelling, but they are answering slightly different questions. Here is how they compare, where they diverge, and why one offers a more robust account of the specific phenomenon of *standing*.

  ### 1. The Two Accounts

  **R. Jay Wallace: The Standing Account (Second-Personal Equality)**
  For Wallace, blame is not merely a judgment that "X is wrong." It is a *second-personal address*—a demand for accountability made from one moral agent to another. This practice presupposes a relationship of equality. When I blame you, I implicitly claim: "We are both subject to this norm, and I have the authority to hold you to it because I hold myself to it as well."

  Hypocrisy undermines this specific authority. By violating the norm they are invoking, the hypocrite implicitly claims a privilege for themselves ("This rule is for you, not for me"). This violates the equality condition required for moral address.
  *   **The Verdict on Hypocrisy:** The hypocrite's blame is **unfitting** or **inappropriate**.
  *   **Does the target get off the hook?** No. The target is still blameworthy.
  *   **What is lost?** The hypocrite loses the *standing* to express that blame. The target is morally entitled to reject the address ("Who are *you* to tell *me*?").

  **G. A. Cohen: The Message/Messenger Account (Moral Truth)**
  Cohen, particularly in his discussions on political violence and condemnation, is concerned with the objective status of moral truths. He argues that the validity of a moral proposition does not depend on the virtue of the person asserting it. If corruption is wrong, it is wrong regardless of whether the person pointing it out is a saint or a sinner.

  For Cohen, focusing on the hypocrite's character is a distraction from the moral reality of the target's action. To deny the truth of the accusation because the accuser is a hypocrite is to commit a logical error (the *tu quoque* fallacy).
  *   **The Verdict on Hypocrisy:** The hypocrite is **odious**, but their claim remains **true**.
  *   **Does the target get off the hook?** No. The target is still blameworthy.
  *   **What is lost?** Nothing regarding the *truth* of the blame. The hypocrite merely loses *credibility* or *respect*, not the moral right to speak truth.

  ### 2. Agreements and Divergences

  **Where They Agree:**
  1.  **The Target's Guilt:** Both philosophers agree that hypocrisy does not exonerate the target. If the public figure took bribes, he is corrupt, regardless of whether his critic also took bribes.
  2.  **Hypocrisy is a Vice:** Both agree that the hypocrite is morally flawed. Neither is defending hypocrisy.

  **Where They Part Ways:**
  The divergence lies in the **nature of the defect**.
  *   **Wallace** locates the defect in the **relationship**. Blame is a social practice, like making a promise or issuing a verdict. If you lack the authority (standing), the act is void *as an act of authority*, even if the content is correct. For Wallace, your friend is right: the hypocrite forfeits the *right* to criticize.
  *   **Cohen** locates the defect in the **person**. The act of criticizing is still valid; the person is just unlikable. For Cohen, you are right: the hypocrisy is a fact about the blamer's character, not the moral status of the blame.

  **On "Losing Standing":**
  *   For **Wallace**, losing standing makes the blame **morally inappropriate to voice**. It renders the act of blaming itself a kind of wrong (a violation of relational equality).
  *   For **Cohen**, losing standing is largely a **pragmatic or rhetorical loss**. The blame is still morally *accurate*, even if no one wants to listen to it.

  ### 3. The Verdict: Why Wallace is More Defensible

  While Cohen's view is essential for preserving objective moral truth (we cannot let wrongdoers escape justice just because their judges are imperfect), **R. Jay Wallace's account is more defensible regarding the specific concept of *standing*.**

  Here is why, using your dinner example:

  Imagine the anti-corruption campaigner (let's call him **Politician A**) condemns a rival (**Politician B**) for taking bribes. It is revealed that **A** also took bribes.
  *   **Cohen's view:** **A**'s statement "Bribery is wrong" is true. **B** is still guilty. **A** is just a hypocrite.
  *   **Wallace's view:** **A**'s act of *holding B accountable* is flawed.

  Wallace is superior here because blame is not just a statement of fact (like "It is raining"); it is a **claim of authority**. When **A** blames **B**, he is not just describing the world; he is attempting to *govern* **B**'s conduct through moral pressure. He is saying, "I represent the moral community's demand that you stop."

  If **A** is a hypocrite, he is effectively saying, "I represent the moral community, but I exempt myself from it." This turns the act of blame from a demand for accountability into an exercise of **power**. It becomes: "I will use this norm to punish you, even though I do not submit to it myself."

  Your friend's *tu quoque* reaction ("You forfeited your right to criticize") captures a real moral intuition that Cohen misses: **We owe each other equality in vulnerability.** If I am not willing to be blamed for X, I cannot blame you for X. To do so is to treat yourself as a ruler and the other as a subject. Wallace explains *why* the hypocrisy matters: it corrupts the *practice* of moral community. Cohen reduces it to a matter of annoying messaging.

  Therefore, Wallace is more defensible because it explains why we feel a specific kind of *indignation* at hypocrites, distinct from mere disagreement. We don't just think they are wrong; we think they are *presumptuous*.

  ### 4. The Divergent Case: When the Accounts Disagree

  There is a specific scenario where Wallace and Cohen would issue different verdicts on whether your friend's *tu quoque* response is warranted. This is the case of **"Different Norms" (or the Minor Hypocrite).**

  **The Scenario:**
  Imagine a Politician who campaigns on **Fiscal Responsibility** (Norm A). He is revealed to have underpaid his personal taxes by a small amount (Violation of Norm A).
  Later, he condemns an opponent for **Embezzling Millions from a Charity** (Violation of Norm B, which overlaps with A but is vastly more severe).

  **Your Friend's *Tu Quoque*:** "You can't criticize him! You cheated on your taxes too!"

  **G. A. Cohen's Verdict:**
  Cohen would say your friend is **unwarranted**.
  *   *Reasoning:* The message ("Embezzlement is wrong") is objectively true. The fact that the messenger violated a *related but lesser* norm (tax evasion) does not negate the truth of the condemnation regarding the charity. The *tu quoque* is a fallacy here because the moral truth stands independent of the messenger's minor sins. To silence the condemnation of massive theft because of minor tax evasion is to prioritize the messenger's purity over the victim's justice.

  **R. Jay Wallace's Verdict:**
  Wallace might say your friend is **warranted** (with nuance).
  *   *Reasoning:* Standing depends on the *specific norm* being invoked. If the Politician frames his criticism as "We must all follow the law regarding money," his tax evasion undermines his standing under *that* general norm. He has declared himself exempt from the financial laws he is now using to blame another.
  *   *However:* Wallace allows for a distinction. If the Politician says, "Stealing from charity is a unique betrayal of trust," he might retain standing on *that specific norm* even if he failed on tax law.
  *   *The Divergence:* In cases where the norms are closely linked (financial integrity), Wallace validates the *silencing* effect of the *tu quoque* more than Cohen does. Cohen insists the message must be heard regardless. Wallace allows that the *relationship* is damaged enough that the blame is inappropriate to voice, validating your friend's instinct that the hypocrite has lost the *platform*, even if Cohen insists the *platform's message* is still true.

  ### Summary for Your Next Dinner

  You can tell your friend that you consulted the literature.
  1.  **You were right about the truth:** Hypocrisy doesn't make the corruption okay (Cohen's point).
  2.  **Your friend was right about the standing:** Hypocrisy *does* forfeit the moral authority to demand accountability from others (Wallace's point).

  The synthesis is this: The hypocrite's claim is **true**, but their voice is **silenced**. Your friend was right to say the man lost the *right* to criticize, but you were right to imply that the corruption remains wrong regardless. The tragedy of hypocrisy is that it forces us to ignore true moral claims because the person speaking them has no moral credit left to spend.
