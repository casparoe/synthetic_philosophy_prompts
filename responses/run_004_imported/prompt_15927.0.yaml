          1.  Introduction (acknowledge the richness of the debate).
          2.  Step-by-Step Analysis (Round by Round).
          3.  Overall Verdict.
          4.  Blind Spots (Crucial for the user's novel).
          5.  Advice for the Novelist (How to use this in character development).
      *   *Tone:* Intellectual, fair, insightful.
      *   *Content Check:* Ensure I accurately reflect *Contingency, Irony, and Solidarity*.
          *   *Key Rorty concepts:* Antirepresentationalism, final vocabulary, sentimental education, cruelty, liberal ironist.
          *   *Dana's stance:* Orthodox Rortyan.
          *   *Mateo's stance:* The "Performative Contradiction" critique.

  6.  **Refining the Analysis (Self-Correction during drafting):**
