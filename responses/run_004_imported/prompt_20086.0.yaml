      *   **Format:** Dialogue only (no scene-setting, no speech tags).
      *   **Length:** 500-800 words.
      *   **Key Argument:** The steadfast character argues that conciliationism is self-defeating (since many peers reject it). The conciliationist needs a strong comeback (possibly about self-exemption or basic reasoning).
