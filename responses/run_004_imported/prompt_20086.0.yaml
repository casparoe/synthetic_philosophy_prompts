      *   **Ending:** Acknowledge the irony that they are currently epistemic peers disagreeing about disagreement.

  2.  **Recall/Verify Epistemological Concepts:**
      *   **Conciliationism:** If you recognize someone as an epistemic peer (equal intelligence, information, honesty) and they disagree with you, you must significantly adjust your credence toward their view (usually split the difference).
      *   **Steadfast/Total Evidence View:** You can maintain your belief if you think your evaluation of the evidence is correct, even against a peer. Peer disagreement is just another piece of evidence, not a defeater.
      *   **The Self-Defeat Objection:** If conciliationism is true, and many peers disagree with conciliationism, conciliationists should lower their confidence in conciliationism. If they lower it enough, why hold the view?
      *   **The Comeback (Non-conciliatory views about disagreement):** Some conciliationists argue that the norm of conciliation itself is *not* subject to conciliation. It's a "framework principle" or akin to trusting basic reasoning. If you conciliate on the rule of conciliation, you lose the ability to reason about disagreement. This is often called the "self-exemption" or "non-conciliatory view of disagreement about disagreement" move.
      *   **The Dinner Bill Example:** Classic thought experiment (Christensen). You and a friend split the bill. You calculate $43. Friend calculates $45. You should doubt your calculation.

