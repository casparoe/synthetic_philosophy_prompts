answer: |-
  You are right, and your friend is wrong. But more importantly, **your intuition is backed by science, and her logical objection is a fallacy.**

  You asked if there is a "more precise version" of what is bugging you that survives her objection. There is. The precise concept you are grasping for is **metacognitive impairment.**

  Here is how to break this down, why her "total self-doubt" argument doesn't hold water, and how to articulate this without it sounding like philosophical navel-gazing.

  ### 1. The Logical Flaw: Specific vs. Global Skepticism
  Your friend's argument is that if you can't trust your feeling of alertness, you can't trust *any* feeling about yourself. This is a **hasty generalization.**

  *   **Global Skepticism:** "I can never trust my senses." (This is indeed paralyzing and useless.)
  *   **Contextual Skepticism:** "I cannot trust my senses *when the biological mechanism responsible for processing those senses is compromised.*"

  This is not total self-doubt; it is **systemic reliability checking.** You trust your eyes to tell you if a light is on. You do *not* trust your eyes to tell you if you are hallucinating, because the tool you are using to check (your eyes/brain) is the very thing that might be broken.

  **The Precise Principle:** *You cannot use a compromised system to verify its own integrity.*

  ### 2. The Science: Why "Feeling Alert" is a Trap
  You hit the nail on the head when you asked: *"If you were just barely tired enough to actually be a danger, would you even be able to tell?"*

  Sleep science confirms this. Drowsy driving impairs the prefrontal cortex—the part of the brain responsible for judgment, decision-making, and self-awareness.
  *   **Microsleeps:** At 2 AM, after a party (potentially with alcohol, even if below the limit, plus fatigue), the brain can enter "microsleeps" lasting seconds. You can be asleep with your eyes open.
  *   **The Intoxication Parallel:** Studies show that being awake for 18–24 hours impairs driving ability similarly to a blood alcohol content (BAC) of 0.05% to 0.10%.
  *   **The Insight Deficit:** Just like a drunk person often insists "I'm fine to drive," a sleep-deprived person often insists "I'm alert." The impairment *includes* the inability to perceive the impairment.

  So, your worry isn't confused; it is biologically accurate. Her feeling of alertness is exactly the kind of data point that becomes unreliable when fatigue sets in.

  ### 3. Analogies to Win the Argument (Gently)
  If you want to explain this to her without it sounding like you're saying "you can't trust yourself ever," use analogies where the tool being used to measure is the thing that is broken.

  *   **The Thermometer:** "If a thermometer is broken and reading 10 degrees too high, can it tell you that it's broken? No. You need a second thermometer. Your brain is the thermometer. If fatigue breaks it, it can't tell you it's broken."
  *   **The Drunk Driver:** "If a drunk person says, 'I feel fine to drive,' we don't accept that as evidence. We know alcohol impairs the judgment required to make that assessment. Fatigue does the same thing."
  *   **The Fever:** "When you have a high fever, you sometimes feel cold. If you trusted your feeling ('I feel cold, so I don't have a fever'), you'd be wrong. You need an objective measure (a thermometer), not a subjective feeling."

  ### 4. The "Precise Version" of Your Standard
  You asked for a standard that doesn't collapse into total self-doubt. Here it is:

  **"Trust subjective feelings only when the physiological conditions for accurate self-assessment are known to be intact."**

  This is not radical doubt. It is **conditional trust.**
  *   **Condition Intact:** It's 2 PM, you slept 8 hours, you had coffee. *Verdict:* Trust your feeling of alertness.
  *   **Condition Compromised:** It's 2 AM, you've been awake 16 hours, you're in a warm car on a monotonous highway. *Verdict:* Do not trust your feeling of alertness.

  ### 5. Why This Matters
  Your friend thinks you are arguing about *philosophy* (can we know anything?). You are actually arguing about *risk management*.

  In risk management, you never rely on a single point of failure. If the "alertness sensor" (her brain) is potentially degraded by fatigue, you need an **objective heuristic.**
  *   *Subjective:* "Do I feel tired?" (Unreliable at 2 AM).
  *   *Objective:* "Have I been awake more than 16 hours?" "Is it past my circadian low point?" "Would I pull over if a police officer asked?"

  ### Summary for your next talk
  You can tell her:
  > "I'm not saying you can't trust yourself *ever*. I'm saying that fatigue specifically targets the part of the brain that judges risk. It's not total self-doubt; it's knowing that the specific instrument we use to measure safety gets glitchy when we're tired. We don't trust a drunk person's assessment of their driving, even if they feel fine. The science says being awake at 2 AM is basically the same thing."

  You had the right instinct. Don't let her gaslight you into thinking safety precautions are "philosophical paralysis." It's just biology.
