      *   *The "Small Improvement" Argument:* If A and B were comparable, a small improvement to A (e.g., +$100) would make A better than B. But sometimes, +$100 doesn't tip the scale because the values are of different *kinds*, not just different *amounts*.

  4.  **Synthesize the Two Views:**
