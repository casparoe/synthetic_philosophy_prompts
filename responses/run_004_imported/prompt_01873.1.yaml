      *   *Shift the locus of "Convention":* The objection assumes convention requires *conscious* agents. I need to argue that *evolutionary stable strategies* function identically to Lewisian conventions in terms of system logic.
      *   *Focus on the "Interpreter":* A code requires an encoder and a decoder. In biology, the transcription/translation machinery *is* the decoder. The "convention" is hard-coded into the physical interaction of tRNA synthetases.
      *   *Address Contingency vs. Convention:* Contingency is a prerequisite for convention. If the mapping were physically necessary (e.g., codon AAA *must* be Lysine due to physics), it wouldn't be a code. The fact that it *could* be otherwise (contingency) + the fact that it *is* stable across a population (universality) = Convention.
      *   *The "Frozen Accident" IS a Convention:* A frozen accident that becomes universal *is* a convention in the functional sense. The "mutual expectation" is replaced by "mutual fitness dependency."

  5.  **Structuring the Argument:**
      *   **Introduction:** Validate the user's intuition and the philosophical objection. State the thesis: The distinction between "contingent physical law" and "conventional code" collapses when we analyze the *informational architecture* rather than the *sociology of agents*.
      *   **Point 1: The Definition of Code (Shannon vs. Lewis).** As a software engineer, the user cares about information processing. Lewis's definition is for *language*, not *encryption/encoding*. In CS, a code is a mapping rule, not a social contract.
      *   **Point 2: Evolutionary Conventions (The "User" Problem).** Address the "no users" claim. The cell is the user. The "mutual expectation" is fitness interdependence. If the ribosome expects UUU=Phe and the tRNA delivers UUU=Leu, the system crashes. This is functionally identical to two humans disagreeing on language.
      *   **Point 3: Arbitrariness and Physical Independence.** Address the "physical necessity" counter. Show that the codon-amino acid mapping is not determined by chemical affinity (mostly). This proves the "arbitrary" criterion is met.
      *   **Point 4: Contingency *becomes* Convention.** Argue that a "frozen accident" that achieves fixation *is* an evolutionary convention. The "could have been otherwise" (contingency) + "is now fixed" (stability) = Convention.
