      *   Q7: The "Who" of Practice (Who meditates?).
      *   Q8: Historical specificity (Why Parfit and not Hume? Or why Early Buddhism and not Madhyamaka?). Let's go with the "Who practices" angle for Q7 and a methodological question for Q8.

      *Wait, I need to make sure I don't duplicate the required topics.*
      1. Karma/Rebirth (Required)
      2. Pudgalavada (Required)
      3. Two Truths (Required)
      4. Ethics/Concern (Required)
      5. Phenomenology/Experience (New)
      6. Diachronic Identity/Fission (New - links Parfit to Rebirth)
      7. The Agent of Practice (New)
      8. Methodological/Historical (New)

      *Okay, let's write them.*

      *(Final Polish)*: Ensure the follow-ups specifically address the "Chariot" deflection. E.g., "But the chariot doesn't move itself..."

      *Wait, one more check:* The prompt asks for 7 or 8 questions. I will provide 8 to be safe. The follow-ups need to be "tuned to the answer she'd most likely give." Her likely answer is "Reductionism explains this via causal continuity, just like the chariot parts explain the chariot." The follow-up needs to challenge the *sufficiency* of that explanation.

      *Let's refine the "Chariot" deflection counter.*
      If she says "The chariot covers it," the follow-up should be "The chariot explains composition, but not X."

