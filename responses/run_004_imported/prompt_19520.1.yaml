      *   *Check:* Is Van Fraassen's restriction actually "trust"? It's often framed as "no expected loss of rationality." I should be precise. It's about expecting *irrationality* (akrasia, memory loss).
      *   *Check:* Is the friend *totally* wrong? The "General Expert Principle" is a strong view (Gaifman 1988). I should acknowledge that structurally they are similar, but argue that the *application* makes them distinct enough that calling RP "PP in disguise" is misleading. I will nuance the "Take a Side" to be: They are structurally analogous but metaphysically and normatively distinct, so the friend's reductionism is incorrect.
      *   *Wait, one more thing:* The prompt asks "is Reflection best understood as a special case of a more general norm... or do the two principles answer genuinely different questions". I need to pick one. I will pick "Genuinely different questions" because the *source* of the norm differs (Diachronic Coherence vs. Chance-Credence Link). A general norm obscures this.

  9.  **Final Polish:** Ensure the distinction between the "Dutch Book" argument for RP and the "Humean Supervenience" context for PP is clear. Ensure the verdict on the qualifications is punchy and well-defended. (Van Fraassen's restriction makes the principle useless for the cases it was meant to solve—planning for weakness of will).

  *(Self-Correction on the "Side"):* Actually, the most philosophically robust position is often that there *is* a General Expert Principle (GEP), but RP and PP are distinct *instantiations* with distinct *domains*. However, the friend claims RP is *just* PP wearing a disguise (implying no independent rationale). I should refute the "no independent rationale" claim. I will argue they answer different questions, siding with the user, but acknowledging the structural kinship.

  *(Refining the Qualification Verdict):* Why is Van Fraassen's worse? Because RP was motivated by the idea that *I am my future self*. If I have to check if my future self is "trustworthy" like an external expert, I break the identity link. Lewis's admissibility doesn't break the link between chance and credence; it clarifies the link.

