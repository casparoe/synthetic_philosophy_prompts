answer: |-
  This is a classic dispute in formal epistemology, and it cuts to the heart of how we understand rationality over time versus rationality about the world. You and your friend have identified the structural similarity that tempts many philosophers to unify these principles, but you have also correctly identified the metaphysical and normative friction that resists that unification.

  Here is the technical comparison you requested, followed by my verdict on the relationship between the principles and an evaluation of their respective defensive retreats.

  ### 1. Technical Comparison: Reflection vs. Principal

  To see where the principles diverge, we must look at their formal constraints and the specific conditions under which they are supposed to hold.

  **The Reflection Principle (RP)**
  Van Fraassen (1984) originally formulated Reflection as a constraint on diachronic coherence. Let $C_t$ be your credence function at time $t$, and $C_{t'}$ be your credence function at a later time $t'$. For any proposition $A$ and any value $r \in [0,1]$:
  $$C_t(A \mid C_{t'}(A) = r) = r$$
  **Motivation:** The primary argument is diachronic Dutch Book. If you violate Reflection, a bookie can construct a series of bets at $t$ and $t'$ that guarantee a loss. The norm is one of **temporal consistency**: you should treat your future self as a proxy for your current self, assuming no new information intervenes other than the updating itself.
  **The Problem Case:** *Ulysses and the Sirens.* At $t_1$, Ulysses knows that at $t_2$ (when he hears the Sirens), his credence that "steering toward the rocks is good" will be 1. But at $t_1$, his credence is 0. If he obeys Reflection, he must believe at $t_1$ that steering is good. This is absurd; he expects his future self to be irrational (driven by passion).

  **The Principal Principle (PP)**
  Lewis (1980) formulated PP to connect subjective credence ($C$) with objective chance ($Ch$). Let $Ch_t(A) = r$ be the proposition that the objective chance of $A$ at time $t$ is $r$. Let $E$ be any "admissible" evidence.
  $$C(A \mid Ch_t(A) = r \cap E) = r$$
  **Motivation:** This is not primarily a Dutch Book argument but a conceptual one about the nature of chance. Chance is defined as *that which guides rational credence*. If you know the chance is $r$ and have no "inadmissible" information (like crystal ball gazing), your credence *must* be $r$.
  **The Problem Case:** *Undermining Futures.* If Humean Supervenience is true, chances supervene on the total history of categorical events. It is possible (though unlikely) that the actual future history is one that would make the current chance function false. If $E$ includes information about the future that undermines the chance hypothesis, PP yields a contradiction (credence must be $r$, but evidence implies chance isn't $r$). Lewis (1994) replaced PP with the **New Principle (NP)**:
  $$C(A \mid Ch_t(A) = r \cap E) = Ch_t(A \mid E)$$

  **Structural Similarity:**
  Both fit the **Expert Principle** schema: $C(A \mid \text{Expert}(A) = r) = r$.
  *   In RP, the Expert is $C_{t'}$.
  *   In PP, the Expert is $Ch_t$.

  **Structural Divergence:**
  1.  **Identity vs. Contingency:** In RP, the "expert" is *you*. The relationship is constitutive of personal identity over time. In PP, the "expert" is the world (chance). The relationship is contingent; the world could have had different chances.
  2.  **The Nature of the Violation:** Violating RP implies you think your future self is *irrational* or *misinformed* relative to you. Violating PP implies you think you have *inadmissible evidence* (evidence not mediated by chance).
  3.  **Direction of Fit:** RP is about **coherence** (making your time-slices hang together). PP is about **tracking** (making your mind match the world).

  ---

  ### 2. The Verdict: Distinct Questions, Not a Disguise

  I side with **you**. While your friend is correct that both principles instantiate a general schema of deference, her claim that Reflection is "just the Principal Principle wearing a disguise" is reductionist in a way that obscures the distinct normative work each principle performs. They answer genuinely different questions.

  **Argument 1: The Metaphysics of the Expert**
  The Principal Principle relies on the existence of an external authority (Chance) that is metaphysically distinct from the agent. Chance is a feature of the world that the agent discovers. Reflection relies on the agent's *own* future cognitive state.
  If RP were just a special case of PP, then deferring to your future self would be the same kind of act as deferring to a weather forecast. But it isn't. When I defer to my future self, I am engaging in a act of **diachronic identification**. I am saying, "That future thinker is *me*." When I defer to chance, I am saying, "That physical magnitude tracks truth."
  Collapsing RP into PP treats the future self as merely another external indicator. This loses the first-person authority that motivates Reflection. The reason Reflection is controversial is precisely because it demands we treat our future selves *better* than external experts (we usually assume our future selves are rational unless proven otherwise, whereas we assume chance is objective regardless of our opinion).

  **Argument 2: The Source of Normativity**
  The normative force of PP comes from the definition of **Chance**. If you don't obey PP, you don't understand what "chance" means.
  The normative force of RP comes from the definition of **Rational Agency**. If you don't obey RP, you are diachronically incoherent; you are effectively betting against yourself.
  Your friend's view implies that the "Expert Principle" is the fundamental norm, and RP/PP are just applications. But this gets the grounding wrong. We accept the Expert Principle *because* we accept principles like PP and RP in specific domains. The "General Expert Principle" is an abstraction, not the foundation. The foundation for RP is diachronic coherence; the foundation for PP is the chance-credence link. These are different foundations.

  **Argument 3: Incommensurable Failure Conditions**
  As you noted, the counterexamples differ.
  *   **Ulysses (RP Failure):** Here, the agent expects the "expert" (future self) to be *irrational*.
  *   **Undermining (PP Failure):** Here, the agent expects the "expert" (chance) to be *false* (or rather, the evidence entails the chance function is not the true one).
  In the Ulysses case, the failure is internal to the agent's rationality. In the Undermining case, the failure is external, regarding the supervenience base of chance.
  If RP were just PP, the solution to Ulysses would be to find an "admissibility" clause for future selves. But van Fraassen's solution isn't about admissibility of evidence; it's about the **status of the future agent**. This confirms that the principles are tracking different relations: one tracks evidence flow (PP), the other tracks agential integrity (RP).

  **Conclusion on this point:** Your friend is right that they are *structurally analogous*, but wrong that they are *the same principle*. They are distinct norms that happen to share a mathematical form, much like Newton's law of gravity and Coulomb's law both follow an inverse-square law but describe fundamentally different forces.

  ---

  ### 3. The Judgment on Defensive Qualifications

  You asked which retreat gives up more of the principle's original motivating force: Van Fraassen's restriction to "trusted" future selves, or Lewis's Admissibility/New Principle?

  **Verdict:** **Van Fraassen's retreat is significantly more damaging.**

  **Defense of the Verdict:**

  **1. The Cost of Lewis's Retreat (Admissibility/New Principle)**
  Lewis's move from PP to the New Principle (NP) is a technical refinement that preserves the core insight.
  *   **Original Force:** Credence should track chance.
  *   **New Force:** Credence should track chance *conditional on total evidence*.
  The NP acknowledges that if your evidence $E$ undermines the chance hypothesis, you cannot simply conditionalize on the chance being $x$. You must conditionalize on the chance being $x$ *given* $E$.
  This does not abandon the link between chance and credence. It clarifies that the link is mediated by the agent's total evidence. It preserves the idea that Chance is the *guide* to Credence. It essentially says, "Chance is still the expert, but you have to listen to what the expert says about your evidence, too." The metaphysical commitment to Chance as the anchor of probability remains intact.

  **2. The Cost of Van Fraassen's Retreat (Trusted Future Selves)**
  Van Fraassen's original Reflection Principle was radical: *Your future credence is authoritative simply because it is yours.* This captured a deep intuition about personal identity and rational planning. If I am rational now, and I expect to be rational later, I should defer.
  The retreat restricts the principle to cases where the agent has **independent reason to trust** the future self as rational.
  *   **Original Force:** Diachronic coherence is a requirement of being a single agent over time.
  *   **New Force:** Defer to your future self *if* you think they are like an external expert.
  This retreat is devastating because it renders the principle **vacuous** in the very cases where it is needed most.
  Consider the Ulysses case again. The whole point of Reflection was to handle cases where my future credence differs from my current one. If I must *first* judge my future self as "rational" before applying Reflection, how do I make that judgment?
  *   If I judge them rational based on their credences, I am already assuming Reflection holds (circularity).
  *   If I judge them rational based on external criteria, I am treating them as an external expert, which collapses RP into PP (your friend's view, but at the cost of RP's distinctness).
  *   If I cannot judge them rational (as in weakness of will), Reflection does not apply.

  By restricting RP to "trusted" future selves, Van Fraassen transforms a principle of **constitutive rationality** (what it means to be a persisting agent) into a principle of **contingent reliability** (when is my future self a good predictor).
  Lewis's modification says, "We need to be more precise about how Chance works."
  Van Fraassen's modification says, "We need to stop assuming your future self is *you*."

  **Why this matters:**
  The original motivating force of Reflection was to prevent **diachronic fragmentation**. It was meant to bind the agent's time-slices together. By adding the "trust" clause, Van Fraassen allows the agent to fragment whenever they anticipate irrationality. But anticipating irrationality is the *primary* reason we need a norm of diachronic coherence! We don't need a principle to tell us to trust our future selves when everything is going well; we need it to tell us how to manage the relationship when things might go wrong.
  Lewis's New Principle handles the "undermining" case by refining the math of chance. Van Fraassen's restriction handles the "Ulysses" case by essentially saying, "If you expect to go mad, the principle doesn't apply." That isn't a patch; it's a surrender. It gives up the claim that rationality requires a default presumption of continuity between temporal selves.

  ### Summary

  Your friend is right that there is a unified "Expert Principle" schema, but wrong to infer that RP lacks an independent rationale. RP is grounded in the metaphysics of agency and diachronic identity, whereas PP is grounded in the metaphysics of chance and evidence. They are distinct norms.

  However, on the question of defensive qualifications, your friend's skepticism of the framework finds more purchase with Van Fraassen than with Lewis. Lewis's "New Principle" saves the phenomenon of chance-credence alignment by refining the definition of admissibility. Van Fraassen's restriction saves Reflection from counterexamples by abandoning the claim that future selves are default authorities. In doing so, Van Fraassen sacrifices the core philosophical insight of his own principle: that being a rational agent *is* to be bound to one's future self. Lewis refined his principle; Van Fraassen retreated from his.
