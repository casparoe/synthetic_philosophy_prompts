          *   *Weaknesses:* Assumes the opera *endorses* the characters' actions rather than depicting them. Ignores 18th-century context (opera buffa conventions).
          *   *Verdict:* Strong moral intuition, weak on textual/dramatic intent.

      *   **Move 2 (Priya/Williams):** Ambiguity is the point. Not cynical, not sentimental.
