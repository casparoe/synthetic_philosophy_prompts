          *   (2) Priya (channeling Williams): The ending shouldn't be read as cynical *or* sentimental. It stages the tension without resolving it. That ambiguity is honest.
          *   (3) Jae: "Staging tension" is an excuse for lack of apology. Ambiguity launders bad content.
          *   (4) Priya: Can't read it as a realist morality play. The form is stylized (singing while disguised). Judging "endorsement" misreads the medium.
