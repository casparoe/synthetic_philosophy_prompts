answer: |-
  **MEMORANDUM**

  **TO:** Methodology Working Group, [Unit Name/Call Sign]
  **FROM:** [Your Name/Call Sign]
  **DATE:** October 26, 2023
  **SUBJECT:** SOP Draft: Handling Conditional Witness Information in Probability Grids

  ### 1. PURPOSE
  The purpose of this directive is to establish a Standard Operating Procedure (SOP) for updating search probability grids when dispatch receives *conditional* witness information (e.g., "If the subject passed the fork, they likely took the ridge"). 

  Current Bayesian search theory protocols handle direct evidence well (e.g., "Subject was seen at Grid X"). However, conditional constraints introduce mathematical ambiguities that can lead to counter-intuitive resource allocation. This memo defines the approved updating method to ensure our probability maps remain both mathematically sound and operationally defensible to Incident Command.

  ### 2. BACKGROUND: THE CONDITIONAL TIP PROBLEM
  In our standard workflow, we allocate search effort based on the Probability of Area (POA) for each grid cell. When a witness provides a conditional statement, they are not confirming an event occurred, but rather specifying a likelihood ratio *given* an event.

  *   **Example:** "If the hiker went North at the fork ($A$), they are 90% likely on the Ridge ($B$) and 10% on the Creek ($\neg B$)."
  *   **The Constraint:** This sets $P'(B|A) = 0.9$. It does *not* explicitly state $P'(A)$, the probability that the hiker actually went North.

  During the recent tabletop exercise, the team split on how to process this:
  1.  **Global Minimum Cross-Entropy (MinxEnt):** Update the entire grid to satisfy the new constraint while minimizing information gain (KL-divergence) from the prior.
  2.  **Jeffrey Conditionalization:** Treat the tip as uncertain evidence and update based on a weighted shift of probability mass.

  ### 3. EVALUATION OF METHODS

  #### 3.1 The Case for Global MinxEnt (The "Minimum Prejudice" Approach)
  Half the team advocated for Global MinxEnt. This is a sophisticated and intellectually honest position. The principle behind MinxEnt is "minimum prejudice": we should change our prior beliefs as little as mathematically possible to accommodate the new constraint. 

  Smart operators and theorists prefer this method because it preserves structural independence. It assumes that unless the evidence explicitly links two areas, their probability ratios should remain undisturbed. It is the standard for maximum-entropy inference in physics and information theory for good reason: it avoids introducing hidden assumptions.

  #### 3.2 The Judy Benjamin Problem (Operational Risk)
  However, as noted during the drill, Global MinxEnt suffers from what philosopher Bas van Fraassen termed the **Judy Benjamin Problem**. 

  When applying Global MinxEnt to a conditional constraint ($P(B|A) = k$), the mathematics inevitably shifts probability mass in the region where the antecedent is *false* ($\neg A$). In plain English: if a witness says, "If she went North, she's on the Ridge," Global MinxEnt will mathematically compel us to lower the probability that she went *South*, even though the witness said nothing about the South.

  **Why this matters for SAR:**
  At 0600, a Search Commander needs to justify why Team Alpha is being sent to the South Quadrant and Team Bravo to the North. If our model reduces the POA of the South Quadrant solely because a witness gave a conditional tip about the North Quadrant, we cannot defend that allocation. The math implies the witness's conditional knowledge updates our belief about the *decision* to go North, which is an unjustified leap.

  #### 3.3 The Case for Jeffrey Conditionalization
  The team members advocating for Jeffrey Conditionalization correctly identified the risk of mass shifting. Jeffrey updating allows us to specify uncertainty without forcing hard constraints. However, pure Jeffrey Conditionalization requires us to estimate $P(A)$ (the probability the hiker actually went North) as an independent input. In the fog of an active callout, asking Planning to derive a precise $P(A)$ from a vague witness tip introduces more human bias than it removes.

  ### 4. RECOMMENDED PROCEDURE: PARTITION-RESTRICTED UPDATING
  To balance mathematical rigor with operational defensibility, this SOP recommends **Partition-Restricted Minimum Cross-Entropy Updating**.

  This method adopts the MinxEnt machinery (minimizing change) but restricts its scope to the **Antecedent Partition** (the area where the condition applies). We treat the conditional tip as information *only* about the distribution of probability within the scenario where the antecedent is true, without allowing it to bleed into the probability *of* the antecedent itself.

  **Decision Rule:**
  *   **IF** the tip is a direct sighting or physical evidence: Use standard Bayesian updating.
  *   **IF** the tip is conditional ("If A, then likely B"): Use Partition-Restricted Updating.
  *   **UNLESS** the witness explicitly confirms the antecedent ("She *did* go North, and likely took the Ridge"): Treat as direct evidence and update globally.

  ### 5. IMPLEMENTATION STEPS
  When Planning receives a conditional tip, the Probability Grid will be updated as follows:

  1.  **Identify the Antecedent Zone ($A$):** Map the grid cells corresponding to the condition (e.g., "North of the Fork").
  2.  **Identify the Consequent Zones ($B, \neg B$):** Map the grid cells corresponding to the outcome (e.g., "Ridge Trail" vs. "Creek Trail" within the North Zone).
  3.  **Calculate Internal Ratios:** Apply the witness's likelihood ratio to the cells within Zone $A$ using MinxEnt principles. This redistributes probability mass between the Ridge and Creek *within the North Zone*.
  4.  **Freeze the Marginal:** Do **not** renormalize the grid globally. The total probability mass assigned to Zone $A$ (North) vs. Zone $\neg A$ (South) must remain at its prior value unless independent evidence suggests otherwise.
  5.  **Document the Constraint:** Log the update as "Conditional Constraint Applied" rather than "Evidence Confirmed." This alerts the Search Commander that the POA shift is theoretical, not evidentiary.

  ### 6. JUSTIFICATION AND COMPENSATION
  We are choosing Partition-Restricted Updating over Global MinxEnt not because Global MinxEnt is "stupid," but because it solves for *informational consistency* while we must solve for *resource defensibility*.

  Global MinxEnt is the correct choice when the goal is to maintain a coherent web of beliefs in a closed system. In SAR, our "system" is open and high-stakes. The Judy Benjamin slide is a feature in information theory (it preserves odds ratios across partitions), but it is a bug in search management (it deprioritizes search areas without cause).

  By restricting the update to the Antecedent Zone, we compensate for the Judy Benjamin effect. We acknowledge the witness's expertise on *terrain preference* (Ridge vs. Creek) without falsely attributing them expertise on *subject intent* (North vs. South).

  ### 7. CONCLUSION
  This procedure ensures that our probability grids reflect what the witness actually said, not what the mathematics of a global update implies they meant. It allows us to use the robust tools of Bayesian search theory without falling into the trap of "mathematical hallucinations" that shift resources away from viable search areas.

  Please review this draft for the next working group session. We aim to finalize this SOP before the next quarterly drill.

  **[Your Name/Call Sign]**
  **Methodology Working Group**
