  7.  **Final Polish:** Ensure the distinction between "Global" MinxEnt (the problem) and "Local/Partitioned" MinxEnt (the solution) is clear. This satisfies the requirement to recommend a concrete procedure while acknowledging the philosophical nuance.

      *(Self-Correction on the "Losing" Method)*: The prompt says one half wanted Jeffrey, half wanted MinxEnt. The rationalist pointed out Judy Benjamin (which attacks MinxEnt). So MinxEnt is the one with the famous philosophical bug. I need to make sure I don't trash MinxEnt, but explain why it fails *here*. The Jeffrey proponents were likely trying to avoid the bug but lacked the parameters. I will recommend a procedure that captures the *intent* of the Jeffrey camp (don't shift unrelated mass) using the *mechanism* of MinxEnt (least change) but restricted.

      *Wait, actually:* The most defensible SOP for SAR is often simpler. But since I'm drafted because I "won't shut up about philosophy," the memo needs to reflect that depth. I will recommend **Partition-Restricted Updating**.

