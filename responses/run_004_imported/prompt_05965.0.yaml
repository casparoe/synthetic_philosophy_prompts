answer: |-
  Good evening, everyone. For those who don't know me, I'm the groom's… wait, no, I'm the bride's older brother. And I'm also the family's resident philosophy nerd. So, when my sister asked me to give this toast, I knew I had a specific assignment. She knows I can't resist a theme.

  And the theme writes itself. [Sister] and [Fiancé] met in the chorus of a regional production of Mozart's *Così fan tutte*.

  Now, for the half of you who are opera lovers, you know exactly the tightrope I'm walking right now. And for the half of you who have never heard of it: *Così fan tutte* is essentially a comedy about two men who disguise themselves to test their fiancées' fidelity. The women fail the test. Everyone gets confused, hearts get broken, and then they all sing a quintet about how "thus do all lovers."

  It is, on paper, a terrible story for a wedding. It's cynical. It suggests that love is a game, and constancy is a myth.

  So, why bring it up? Why not just talk about how they met at a coffee shop? Because they didn't meet at a coffee shop. They met in the trenches of 18th-century Italian opera. And because I've been re-reading the philosopher Bernard Williams, who wrote beautifully about this specific opera.

  Williams argued that we shouldn't dismiss *Così* as just a farce. He suggested it tells a deeper, harder truth about human beings. And this connects to his famous idea of "Moral Luck."

  Here's the philosophy bit, I promise I'll keep it brief. We like to think that our character is solid. We think, "I am a faithful person," or "I am a brave person," as if those are facts written in stone. But Williams argues that our character is actually hostage to circumstance. We are only as faithful as the temptations we've actually faced. We are only as brave as the dangers we've actually met. That is moral luck: the idea that how "good" we are depends partly on luck, on what the world throws at us.

  In *Così*, the sisters aren't villains. They're just human. They are put in impossible circumstances, and they react. The opera suggests that fidelity isn't a shield you wear; it's a path you walk, and the terrain changes.

  Now, I know what you're thinking. "This is a wedding, not a seminar on moral vulnerability. Can we get to the champagne?"

  But hear me out. Because I think this is actually the most hopeful way to look at marriage.

  If you think marriage is a promise that you will never change, or that you will never be tempted, or that the world will never throw something weird at you, you are setting yourselves up for failure. That is the cynical reading of *Così*.

  But the Williams reading? The hopeful one? It's this: Marriage isn't about pretending the test won't come. It's about knowing that the test *might* come, knowing that you are both vulnerable, human, and subject to moral luck—and choosing to navigate that luck together anyway.

  [Sister] and [Fiancé], you didn't meet as the leads in this opera. You met in the chorus. You were in the ensemble. And I think that is perfect. Because the leads get the arias, but the ensemble holds the structure. They have to listen to each other. They have to breathe together. If one person rushes, the whole thing falls apart.

  My wish for you is not that you will be immune to the plot of *Così*. My wish is that you will be smarter than the characters in it.

  When the circumstances change—and they will—when the luck turns, and it feels like the ground is shifting under your feet, don't pretend you're statues. Don't pretend you're immune. Acknowledge the luck. Acknowledge the vulnerability. And then, make the active, conscious choice to turn back toward each other.

  Fidelity isn't the absence of temptation. It's the presence of a choice. It is looking at the chaos of the world, knowing how easily things could go wrong, and saying, "I know the odds. I know the luck. And I am still choosing you."

  That is a much stronger foundation than "happily ever after." "Happily ever after" is a fairy tale. "I choose you, again and again, despite the luck" is a marriage.

  So, if everyone could please raise a glass.

  To [Sister] and [Fiancé]. May your love be honest about the human condition. May you be kind to each other's vulnerabilities. And may you always find your way back to the duet, no matter what the chorus is singing.

  To the bride and groom!
