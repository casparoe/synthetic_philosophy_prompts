answer: |-
  This is a fantastic question. It cuts right to the heart of why metaethics matters outside the seminar room, and it's rare to see someone wrestling with the practical friction between a skeptical metaethical view and the institutional demand for normative certainty.

  You're right to identify the tension: The IRB operates *as if* moral verdicts are truth-apt, empirically grounded, and decidable ("This protocol is ethically sound"). Quine's picture suggests moral verdicts are socially ingrained habits rooted in hedonic responses, lacking the observation-sentence anchor that gives scientific verdicts their warrant.

  If you take Quine's "On the Nature of Moral Values" seriously—not as a shrug, but as a pragmatic description of what we are actually doing when we make moral claims—it doesn't necessarily paralyze the IRB. However, it should fundamentally shift the *self-conception* of the committee and the *justificatory language* you use.

  Here are four specific implications for IRB practice that follow from a Quinean naturalism about ethics.

  ### 1. Shift from "Moral Truth" to "Social Coherence and Harm Minimization"
  Quine argues that moral values grow out of basic hedonic responses (pain/pleasure) that get socially molded. He denies we have access to moral "facts" in the way we have access to physical facts.

  **Implication:** The IRB should stop viewing itself as a body that *discovers* whether a protocol is "Ethically True" and start viewing itself as a body that *manages* social harm and coherence.
  *   **In Practice:** When debating "respect for persons" or "justice," ground these concepts as firmly as possible in observable hedonic consequences (distress, exploitation, psychological harm) rather than abstract deontological violations.
  *   **The Change:** If a student argues, "This violates the subject's dignity," a Quinean IRB asks, "What is the observable hedonic or social cost of that violation?" If the answer is purely metaphysical ("It treats them as a means"), the Quinean committee should treat that claim with more skepticism than a claim about psychological distress. It prioritizes the *naturalized* base of ethics (suffering/well-being) over the *superstructure* (abstract rights), unless the superstructure is shown to have tangible social utility.

  ### 2. Epistemic Humility in Verdict Language
  You noted the "confident sounding verdicts." If moral claims lack the empirical footing of scientific claims, the confidence should be of a different *kind*. Scientific confidence is about correspondence with reality; ethical confidence (for Quine) is about coherence within a web of social belief.

  **Implication:** IRB determinations should be framed as regulatory and pragmatic clearances, not moral absolutions.
  *   **In Practice:** Be wary of language that suggests the committee has solved the moral problem. Instead of "This consent process is ethically adequate," the internal logic should be "This consent process meets our current community standards for minimizing risk and ensuring understanding."
  *   **The Change:** This protects the committee. If ethics is socially molded, it is revisable. A Quinean IRB acknowledges that today's "adequate" consent might be tomorrow's "coercive" practice, not because we found the *Truth*, but because our social molding has shifted. It encourages a culture where protocols can be flagged for re-evaluation based on shifting social norms without implying the committee was previously "wrong" in a factual sense.

  ### 3. The Crucial Role of the "Community Member"
  Quine emphasizes that moral values are *socially* molded. They aren't derived by lone rational agents (Kant) or calculated by isolated utilitarians. They are the product of a community's reinforcement history.

  **Implication:** The non-scientist "community member" on the IRB is not a token; they are the primary epistemic authority on the "social molding" side of the equation.
  *   **In Practice:** Often, community members are sidelined by the technical risk assessments of the scientists. On a Quinean view, the scientists are experts on the *empirical* risk (the drug's toxicity), but the community members are the experts on the *moral* risk (how the community feels about the intrusion).
  *   **The Change:** You should advocate for giving disproportionate weight to the community member's intuitions on "acceptability." Since Quine denies a scientific method for deriving 'ought' from 'is', the 'ought' comes from the community's shared reinforcement history. If the community member says, "This feels exploitative," that is data about the social molding of values that is just as critical as the PI's data on blood pressure.

  ### 4. Pragmatic Fallibilism (The Holistic Web)
  Quine's holism suggests that any statement can be held true come what may, if we make drastic enough adjustments elsewhere in the system. But we generally choose to revise statements that are closer to the periphery of experience.

  **Implication:** Treat IRB guidelines as hypotheses in a web of belief, not as static laws.
  *   **In Practice:** When a protocol creates an ethical dilemma, don't just force the protocol to fit the rules. Sometimes the rules (the general moral principle) should be revised to fit the specific case (the observation).
  *   **The Change:** A Quinean IRB is more willing to grant waivers or modifications when strict adherence to a rule (e.g., documented consent) causes more observable harm (e.g., endangering subjects in sensitive research) than the rule is designed to prevent. This isn't "breaking the rules"; it's adjusting the web of belief to maintain overall coherence and minimize net negative hedonic response. It treats the Common Rule not as scripture, but as a working theory of how to protect subjects that is subject to revision based on outcomes.

  ### Summary: Does it change the verdict?
  Probably not the *outcome* of most votes. You will still reject high-risk/low-benefit studies and approve low-risk ones. Quine isn't a nihilist; he thinks moral values are real *as social phenomena* and they function to keep society running.

  However, it changes the **weight** you put on your confidence.
  *   **Without Quine:** "We are protecting the Moral Rights of Subjects." (High stakes, metaphysical confidence).
  *   **With Quine:** "We are negotiating a consensus on acceptable risk based on our current social standards and observable harms." (High stakes, pragmatic confidence).

  For your students' debate: It's not a shrug. It's a relocation of authority. The authority doesn't come from the Moral Law; it comes from the Community and the Consequences. For an IRB, which is inherently a regulatory and community-facing body, that is actually a much more stable foundation than pretending you are doing applied Kantianism.

  **The actionable takeaway:** Next time you are in a meeting and the committee is deadlocked on a "principle," ask: "What specific harm are we preventing here, and is our intervention likely to reduce it?" That is the Quinean move—bypassing the ungrounded moral claim for the naturalized consequence.
