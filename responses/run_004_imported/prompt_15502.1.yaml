          *   *Core:* Paraconsistent logics (like LP) invalidate Disjunctive Syllogism (DS: $A \lor B, \neg A \vdash B$) to block Explosion ($A, \neg A \vdash B$). Critics say this makes logic useless for ordinary reasoning.
          *   *Draft Q:* How do you respond to the charge that invalidating DS changes the subject?
          *   *Likely Reply:* DS is valid *classically* but fails in inconsistent contexts; ordinary reasoning is usually consistent, so DS holds *de facto*. Or, use a relevant logic account.
          *   *Follow-up:* If it holds *de facto*, isn't the logic still normative? If I can't rely on DS in a proof, haven't I lost the transitivity of deduction?
          *   *Refinement:* Focus on the "normative force" of logic. If DS fails in the logic, how do we justify using it in meta-reasoning about the logic?

      *   *Topic 2: Gluts vs. Gaps.*
          *   *Core:* Why think the Liar is *both* true and false (Priest) rather than *neither* (Kripke/Field)? Both avoid classical contradiction.
          *   *Draft Q:* What's the positive argument for gluts over gaps?
          *   *Likely Reply:* The "Revenge" argument. Gap views succumb to a strengthened Liar ("This sentence is not true"). Dialetheism embraces it. Also, semantic closure.
