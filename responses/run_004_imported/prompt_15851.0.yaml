prompt: |-
  Okay, weird dilemma - curious what you think. I've been querying literary agents with my novel for almost a year and just got my first offer of representation: decent agent, small agency, and she genuinely seems to love the book. Problem is I've still got a dozen queries out to agents I like even better, no idea if or when any of them will even get back to me, and this agent's only giving me three weeks to decide before she moves on to her next client. Everyone keeps telling me either 'take it, you never know if you'll get another shot' or 'don't you dare sign with the first yes,' and I honestly don't know if there's some actual principled way to think about this or if im just supposed to guess.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Querying literary agents for a novel for almost a year.
      *   **Current Status:** Received first offer of representation.
      *   **Agent Details:** "Decent agent," "small agency," "genuinely seems to love the book."
      *   **Constraint:** 3-week deadline to decide.
      *   **Complication:** Still have ~12 queries out to "dream agents" (agents liked better).
      *   **Conflict:** Conflicting advice from others ("take it" vs. "wait for better").
      *   **Goal:** Wants a principled way to think about this, not just a guess.

  2.  **Initial Assessment & Industry Norms:**
      *   *Is this a good problem to have?* Yes. Getting an offer after a year is a success, even if it's not the "dream" scenario.
      *   *Is the deadline standard?* Yes, 2-4 weeks is standard protocol to allow other agents to respond.
      *   *Is the "small agency/decent agent" a red flag?* Not necessarily. Small agencies can offer more hands-on attention. "Decent" needs unpacking (track record, sales, compatibility).
      *   *Is waiting for "dream agents" risky?* Yes. Those 12 queries might never respond, or they might pass. A bird in the hand is worth two in the bush, *but* representation is a marriage.

  3.  **Deconstruct the Conflicting Advice:**
      *   *"Take it, you never know if you'll get another shot":* Pragmatic. Querying is grueling. Rejection rates are high. Momentum is valuable.
      *   *"Don't you dare sign with the first yes":* Idealistic. Bad representation can be worse than no representation. Career longevity matters.

  4.  **Develop a Framework for Decision Making (The "Principled Way"):**
      *   I need to give the user a process, not just a "yes/no."
      *   **Step 1: Notify the other agents.** This is crucial. It's standard etiquette. It might speed up responses.
      *   **Step 2: Evaluate the current offer.** Due diligence on the agent/agency.
      *   **Step 3: Evaluate the "Dream" list.** Are they actually better, or just bigger names?
      *   **Step 4: Risk Tolerance.** How much does the user value *this* book vs. *this* agent?

  5.  **Drafting the Advice - Section by Section:**

      *   **Validation:** Acknowledge the stress. This is a "good problem" but still stressful. Validate that the conflicting advice is annoying because both sides have points.
      *   **The Immediate Action (The "Notification"):** This is the most important tactical step. The user *must* email the other 12 agents.
          *   *Script:* Provide a template. "I have an offer, deadline is X, are you still interested?"
          *   *Outcome:* Some will pass immediately (saves time). Some might request the full ASAP. Some might ignore (answer is no).
      *   **Due Diligence on the Current Agent:** "Decent" is vague. How to verify?
          *   QueryTracker, Publisher's Marketplace, Twitter/Instagram, client list.
          *   Call current clients (ask the agent for references).
      *   **Re-evaluating the "Dream" Agents:**
          *   Why are they better? Sales record? Personality? Agency prestige?
          *   Reality check: A big name who doesn't love the book as much is worse than a smaller agent who is a champion.
      *   **The "Principled" Decision Matrix:**
          *   *Scenario A:* Other agents pass -> Decision made (Sign or walk away).
          *   *Scenario B:* Other agents want to see it -> You have leverage/choice.
          *   *Scenario C:* Silence -> Treat as a no.
      *   **The "Gut Check" on the Agent:**
          *   Did they offer editorial guidance?
          *   Do you vibe?
          *   Small agency pros/cons (more attention vs. less leverage).
      *   **The "Walk Away" Option:** Acknowledge that *no* agent is better than a *bad* agent. But is this agent bad? Doesn't sound like it.

  6.  **Refining the Tone:**
      *   Empathetic but professional.
      *   Industry-savvy (use terms like "full request," "comp titles," "Publisher's Marketplace").
      *   Balanced (don't push them to sign, don't push them to wait).

  7.  **Self-Correction/Edge Cases during thought process:**
      *   *Wait, should they withdraw the other queries?* No, not until they sign.
      *   *What if the other agents say "we need more than 3 weeks"?* That happens. Then the user has to decide if the current offer is good enough to risk losing.
      *   *Is 12 queries a lot?* No, it's a small batch. This implies the user might have exhausted their list or is being selective. If they have more to query after this, that changes things. *Correction:* The prompt says "still got a dozen queries out," implying the active list is dwindling or these are the top tier. I should mention if they have *more* agents to query after this round.
      *   *Key Insight:* The "Small Agency" aspect. Often, junior agents at big agencies vs. established agents at small agencies. Need to distinguish.

  8.  **Final Polish:**
      *   Structure with clear headings.
      *   Include the email template (very helpful).
      *   End with a summary recommendation.

  9.  **(Post-Drafting Review):** Does this answer the "principled way" request? Yes, by turning it into a due diligence process rather than a gamble. It shifts the control back to the user.

  *(Self-Correction during drafting)*: Make sure to emphasize that *enthusiasm* is the #1 metric. An agent who "genuinely seems to love the book" is a huge green flag, often outweighing agency prestige.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  First, take a deep breath. This is what is known in the industry as a "good problem." After a year of querying, you have achieved the hardest hurdle: validation. An agent wants to sell your work.

  The conflicting advice you're getting ("take it" vs. "wait") exists because both sides are partially right. Signing too quickly can lead to regret; waiting too long can lead to losing the offer and ending up with nothing.

  There *is* a principled, standard industry protocol for this exact scenario. You do not have to guess. Here is the step-by-step framework to handle this professionally and make the right decision for your career.

  ### 1. The Immediate Step: Notify the Other Agents
  You do not need to decide today. The standard etiquette when you receive an offer is to notify the other agents who have your full or partial manuscript (or even just a query, if they are high-priority) that you have an offer on the table.

  This does two things:
  1.  It is professional courtesy.
  2.  It forces the "dream agents" to show their hand. If they want you, they will speed up. If they don't, they will bow out, making your decision easier.

  **Send this email to the other 12 agents immediately:**

  > **Subject:** Offer of Representation: [Title] by [Your Name]
  >
  > Dear [Agent Name],
  >
  > I am writing to let you know that I have received an offer of representation for my novel, [Title]. Since you have been considering the manuscript, I wanted to give you the opportunity to let me know if you are still interested before I make a decision.
  >
  > The agent has given me a deadline of [Date, 3 weeks out]. If I don't hear back from you by then, I will assume you are passing.
  >
  > Thank you for your time and consideration.
  >
  > Best,
  > [Your Name]

  **The Likely Outcomes:**
  *   **The "Pass":** 8–10 of them will likely reply immediately saying, "Congratulations, but I'm going to pass." This hurts, but it clarifies your decision.
  *   **The "Request":** 1–2 might say, "I need to read this ASAP." This gives you a competitor for the current offer.
  *   **The "Silence":** Treat silence as a "no." Do not gamble your career on an agent who can't be bothered to reply to a deadline email.

  ### 2. Due Diligence on the Current Offer
  You described the agent as "decent" and the agency as "small." You need to verify if "decent" means "capable" or "mediocre." Enthusiasm is vital, but competence is non-negotiable.

  *   **Check Sales:** Go to *Publisher's Marketplace* (or ask the agent directly). Have they sold books in your genre in the last 2 years? To which publishers? A small agency with recent sales is better than a big agency with none.
  *   **Check Clients:** Ask the agent for a list of current clients. Find 2 or 3 of them online and politely ask: *"I'm considering representation with [Agent]. Can you tell me about their communication style and how they handled the submission process?"*
  *   **The "Small Agency" Factor:** Small agencies often offer more hands-on editorial attention and faster communication. The downside is they may have less leverage with big editors. However, a hungry agent at a small agency is often better than a burned-out agent at a giant agency.

  ### 3. Evaluate the "Dream" vs. The "Champion"
  This is the psychological part of the decision.
  *   **The Dream Agents:** You like them "better." Why? Is it their sales record? Their prestige? Or just their name recognition?
  *   **The Current Agent:** She "genuinely seems to love the book."

  **Principle:** *Enthusiasm sells.* An agent at a mid-tier agency who is fighting for your book will get it sold faster than a top-tier agent who thinks it's "nice" but isn't prioritizing it. If the current agent offered editorial notes with the offer, that is a massive green flag. It means she is already working.

  ### 4. The Decision Matrix
  Once you send those emails, you will land in one of three scenarios. Here is how to handle them:

  **Scenario A: The other agents pass.**
  You are left with the current offer.
  *   *Decision:* If your due diligence shows she has sold books and her clients speak well of her, **take it.** A year of querying is a long time. Momentum is precious. "Perfect" is the enemy of "Published."

  **Scenario B: One or two "dream" agents want to see it.**
  Now you have a choice.
  *   *Decision:* Ask the current agent if they are comfortable with a slight extension (sometimes they are). If not, you have to weigh risk. Do you trust the "dream" agent's vision more? If the current agent is solid, remember that *this* agent fought for you first. Sometimes being the "first love" matters in the long haul.

  **Scenario C: The current agent feels "off" upon deeper inspection.**
  If you find out she hasn't sold anything in 3 years, or her clients complain she never replies, **walk away.**
  *   *Decision:* No agent is better than a bad agent. A bad agent can tie up your rights for months while doing nothing, effectively killing the book's marketability.

  ### Summary Advice
  If the agent passes the due diligence check (has sales, happy clients, clear contract terms), **lean heavily toward accepting.**

  Here is why:
  1.  **Conversion Rate:** The jump from "Queried" to "Offered" is the hardest statistical leap in publishing. The jump from "Small Agent" to "Big Agent" is less significant than the jump from "Unagented" to "Agented."
  2.  **Career Longevity:** Your first agent does not have to be your forever agent. If she sells this book, you have a career. If she sells this book and you outgrow her, you can part ways amicably later.
  3.  **Mental Health:** Querying for a year is draining. Having a partner in your corner allows you to start writing the *next* book, which is ultimately what builds a career.

  **The Verdict:**
  Send the notification emails today. Use the three weeks to vet the agent thoroughly. If she checks out professionally, trust her enthusiasm over your fantasy of the "perfect" agent. Take the hand that is reached out to you.
