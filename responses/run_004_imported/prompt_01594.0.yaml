answer: |-
  **The Trace**

  The monitor hummed, a low, sickly vibration that Harrow felt in his teeth. On the screen, a single green line traced its way from left to right, jagged and trembling.

  "It's thinning," Harrow said, pointing a trembling finger at the glass. "Look at the flux. The stream is losing cohesion."

  Jens didn't look at Harrow. He looked at the screen, his eyes flat, unblinking. "The probability density is dropping. It's not thinning, Doctor. It's decohering."

  Harrow turned, his face illuminated by the green ghost-light. He was sixty, trained in the Continuum. He had spent forty years learning to see the universe as a plenum, a fullness. Matter was not distinct things; it was variations in the density of the Stuff. To Harrow, the green line was a river. It flowed. It had current. It could be choked, or it could flood.

  "There is no decoherence," Harrow said, his voice tight. "Decoherence implies a breaking apart of something that was whole. This is a attenuation. The resistance of the medium is increasing. The Stuff is having trouble moving through the aperture."

  Jens finally turned. He was thirty, trained in the Discontinuum. He had never seen a river. He had never been taught to see a flow. To Jens, the universe was a void punctuated by events. The green line was not a river. It was a series of flashes. *Flash. Flash. Flash.* A stroboscopic light moving so fast the eye blurred them into a line. But Jens knew the eye lied.

  "Doctor," Jens said softly. "There is no medium. There is no resistance. There is only the transition of state."

  Harrow laughed, a dry, brittle sound. "If there is no medium, what is waving? Tell me that. If I throw a stone, it moves through air. If I send a signal, it moves through *what*?"

  "It moves through nothing," Jens said. "It jumps."

  "Jumps?" Harrow stepped closer to the screen. He traced the path of the green line with his finger, hovering just above the glass. "You see jumps? I see a curve. I see a stress fracture in the tension."

  "I see nodes," Jens said. "Discrete excitations. The line isn't continuous. It's an artifact of the refresh rate. Between those points, Doctor, there is nothing. No Stuff. No tension. Just... absence."

  Harrow felt a physical nausea. This was the breakdown Kuhn had warned about, though Harrow would never read him. It wasn't that Jens was wrong about the data. It was that Jens was speaking about a different world. When Harrow said *flux*, he meant a quantity of substance passing a point per unit of time. When Jens said *flux*, he meant a change in the mathematical expectation of a detection event. They used the same word, but the referent had vanished.

  "Look at the dip," Harrow insisted, tapping a valley in the green trace. "The pressure dropped here. The medium thinned out. We need to increase the drive to compensate for the drag."

  "There is no drag," Jens said. "The dip is a superposition collapse. The system chose a lower energy state."

  "Chose?" Harrow snapped. "Matter doesn't choose. It is pushed."

  "It isn't matter," Jens corrected. "It's information."

  Harrow stepped back as if struck. "Information is a description of a thing. It is not the thing itself."

  "In the Discontinuum," Jens said, turning back to the console, "there are no things. There are only interactions. The 'thing' is just the sum of the interactions."

  Harrow looked at the screen again. He tried to force his eyes to see what Jens saw. He tried to break the line. He tried to shatter the river into droplets. But he couldn't. His training, his intuition, the very structure of his perception was built on the Continuum. To him, the idea of a 'jump' without a 'path' was not just false; it was unintelligible. It was like asking him to see the sound of blue.

  "If there is no path," Harrow whispered, "then how did it get from A to B?"

  "It didn't 'get' there," Jens said, his fingers flying over the haptic controls. "It was at A. Then it was at B. To ask what happened in between is a category error. It's like asking what is north of the North Pole."

  "It's nonsense," Harrow said. "You've abolished causality."

  "I've abolished the requirement for a mechanism," Jens said. "We don't need the gears anymore, Doctor. We just need the input and the output."

  Harrow looked at the young man. He realized then that they were not arguing about the theory. They were arguing about the ontology. They were not looking at the same machine. Harrow was looking at a engine, a complex system of pressures and flows that could be tuned, oiled, and understood. Jens was looking at a black box, a oracle that spat out numbers based on rules that had no physical analog.

  "The line is breaking up," Harrow said, pointing to the far right of the screen where the trace dissolved into static. "The medium is fracturing. We're losing containment."

  "The signal is terminating," Jens said. "The event horizon has been crossed."

  "Containment!" Harrow shouted. "If we don't reinforce the field, the Stuff will leak into the lab. We'll be saturated."

  "There's nothing to leak," Jens said, his voice calm, terrifyingly calm. "Saturation is impossible. You can't be wet if there's no water."

  Harrow grabbed the manual override lever. It was a heavy brass handle, designed to throttle the flow, to choke the river. He pulled it back.

  On the screen, the green line vanished.

  "See?" Harrow breathed. "I stopped the flow. I closed the valve."

  Jens looked at the blank screen. "You disrupted the observer effect. You collapsed the wave function prematurely. You didn't stop a flow. You ended the experiment."

  "I saved us," Harrow said, his hand still on the brass lever. He could feel the vibration of the machine through the metal. It felt like a heartbeat. It felt like a flow.

  "You saved nothing," Jens said, picking up his datapad. "Because there was no danger. You're fighting ghosts, Doctor."

  Harrow looked at his hand on the lever. He felt the vibration. He knew it was real. He knew the Stuff was real. He looked at Jens, who was already walking toward the door, unbothered by the silence of the machine.

  "Jens," Harrow called out.

  The younger scientist paused at the threshold.

  "When you look at the screen," Harrow asked. "Before the numbers. What do you see?"

  Jens thought for a moment. "I see a graph of probabilities."

  "I see a river," Harrow said.

  Jens nodded, not with understanding, but with acknowledgment. "I know."

  "And you can't see it?"

  "No," Jens said. "I can't."

  "Then how can we work together?"

  Jens opened the door. The light from the hallway spilled in, cutting across the dark lab, dividing the room into two distinct zones of light and shadow. There was no gradient. Just light, then dark.

  "We don't," Jens said. "You speak the language of the Old World. I speak the language of the New. We can translate the data, maybe. We can agree on the numbers. But we cannot agree on what the numbers *are*."

  Jens stepped into the light.

  "You live in a world of things," he said. "I live in a world of events. We are not looking at the same universe, Doctor. We are just standing in the same room."

  The door closed. Harrow was left in the dark with the humming machine. He looked back at the screen. It was black now, but he could still see the afterimage of the green line. It looked like a river. It would always look like a river. And he knew, with a sinking certainty, that to Jens, it had never existed at all.
