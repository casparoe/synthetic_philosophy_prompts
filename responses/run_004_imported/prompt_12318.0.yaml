  *(Self-Correction during final review)*: Make sure I don't let Marcus off the hook too easily regarding the "gerrymandering" charge. Van Inwagen accuses "Contact" of being gerrymandered because it doesn't carve nature at the joints. Elena should argue "Life" does the same thing in biology. Marcus must defend that "Life" *does* carve at the joints, unlike "Contact."

