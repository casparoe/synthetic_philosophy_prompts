answer: |-
  **Setting:** *A cramped faculty coffee shop, late afternoon. The metaphysics seminar has just let out. Elena (a mereological universalist) and Marcus (an organicist sympathetic to van Inwagen) are clearing away empty espresso cups.*

  **Elena:** You were quiet during the Q&A. I saw you wincing when the professor brought up van Inwagen's "Life" criterion again. Don't tell me you're losing faith in restricted composition.

  **Marcus:** Not losing faith. Just… feeling the pressure. You know my dissertation is on biological individuality. When you're knee-deep in holobionts and colonial organisms, van Inwagen's confident assertion that "there are dogs and there are no tables" starts to feel a bit thin.

  **Elena:** Thin how?

  **Marcus:** Thin because "Life" looks suspiciously like "Contact" or "Fastening." Van Inwagen demolishes those criteria because they admit of borderline cases. If two planks are touching, do they compose a table? What if they're a millimeter apart? He says this leads to vagueness in existence, which he thinks is impossible. But take a lichen. It's a fungus and an alga. Sometimes they act as a unit; sometimes you can pry them apart in the lab and they live independently. When exactly do they compose a lichen? If the answer is vague, haven't you just reintroduced the problem van Inwagen solved?

  **Elena:** Exactly. That's the Argument from Vagueness, Marcus. Lewis put it best. If composition is restricted, there must be a sharp boundary where composition begins and ends. If there isn't, then it's indeterminate how many objects exist. Van Inwagen agrees it can't be indeterminate how many objects exist. So, there must be a sharp boundary. But look at your lichens. Is there a *sharp* boundary where the fungus and alga start "catching a life" together?

  **Marcus:** I grant you there's vagueness in our *concept* of a lichen. But van Inwagen's point is that vagueness is semantic, not ontic. The particles either are engaged in a joint life-activity or they aren't. The fact that *we* can't pinpoint the moment doesn't mean the moment doesn't exist.

  **Elena:** That's the standard move. "The vagueness is in the map, not the territory." But in biology, the territory *is* the map. Take *Dictyostelium*. The slime mold. You know the case?

  **Marcus:** Cellular slime mold. Solitary amoebae when food is plentiful. When starvation hits, they aggregate into a single slug, then a fruiting body.

  **Elena:** Right. So, when food is plentiful, you have thousands of organisms. When they aggregate, van Inwagen says they compose *one* organism because their activity constitutes a life. But the aggregation is a gradient. Chemical signals ramp up. Movement synchronizes gradually. Where is the sharp cut-off? If you say there *is* a precise nanosecond where composition flips from False to True, you're saving the theory by making it biologically absurd. If you say there isn't, you've got ontic vagueness.

  **Marcus:** Okay, but consider the alternative. If you're a universalist, you say the amoebae always compose an object, whether they're scattered or slugged.

  **Elena:** They do. They compose a scattered object.

  **Marcus:** But that doesn't help me explain why the slug behaves as a unit while the scattered swarm doesn't. Van Inwagen's restriction is supposed to track *causal unity*. When the amoebae lock into that signaling loop, they become causally unified in a way they weren't before. That causal unity is the "life."

  **Elena:** Is it binary, though? Causal unity comes in degrees. The signaling isn't all-or-nothing. Some amoebae join the stream late. Some drop out. If composition depends on the degree of unity, then composition is vague. And if composition is vague, the number of objects is vague. Van Inwagen says that's metaphysically intolerable. So, he has to say there's a precise threshold of causal unity. But biology doesn't give you precise thresholds. It gives you sigmoid curves.

  **Marcus:** Biology gives us measurement error, Elena. Just because a process looks continuous to our instruments doesn't mean the underlying metaphysical state is continuous. Think about a digital signal. It looks like a wave, but it's carrying binary information. Maybe "catching a life" is like a phase transition. Water doesn't freeze gradually; at a specific pressure and temperature, the lattice locks.

  **Elena:** Water freezing is a bulk property of a homogeneous substance. You're talking about distinct agents coordinating. Let's look at the Portuguese man o' war. A siphonophore. It looks like a jellyfish, but it's a colony of zooids. Some are for stinging, some for digestion, some for reproduction. They're clonal, genetically identical, but physiologically distinct. Are they parts of one organism, or a colony of organisms?

  **Marcus:** Van Inwagen would say: do their activities constitute a single life?

  **Elena:** And what's the answer? The zooids can't survive alone. But they develop from a single zygote. Is it one organism that budded off parts that stayed attached? Or is it a society of cells that became specialized? Biologists argue about this. If the biology is unsettled, how can the metaphysics be sharp? If the composition fact depends on the biological fact, and the biological fact is indeterminate, then the composition fact is indeterminate.

  **Marcus:** I think you're conflating the classification of the object with the existence of the object. Whether we *call* it a colony or an organism is semantic. The question is: do those zooids compose something? Van Inwagen says yes, because there is a life going on there. The particles comprising the zooids are caught up in a joint event.

  **Elena:** But whose life? That's the holobiont problem. In the lichen, is it the fungus's life, the alga's life, or the lichen's life? If it's the lichen's life, you're presupposing the lichen exists to have the life. That's circular. If it's the fungus's life, then the alga is just food or a tool, not a part. But the alga reproduces *within* the lichen structure. It's not just fuel.

  **Marcus:** Okay, this is the hardest case. I'll grant you that. The lichen pushes the "Life" criterion hard. But here's where I think van Inwagen can dig in. He distinguishes between vagueness in *when* composition occurs versus vagueness in *what* we name the result. The particles are either participating in a self-maintaining homeostatic process or they aren't. In the lichen, the fungus and alga exchange nutrients in a closed loop. That loop is the life.

  **Elena:** A closed loop? You can break the loop in the lab.

  **Marcus:** You can break a dog in half too. That doesn't mean the dog wasn't one object before you broke it.

  **Elena:** But the dog's unity doesn't depend on the experimenter's choice to keep it together. The lichen's unity *does* seem to depend on environmental stability. In harsh conditions, they function as a unit. In rich conditions, they might dissociate. If composition turns on and off based on external conditions, it's not a fundamental mereological fact. It's a pragmatic description.

  **Marcus:** Why is that pragmatic? Survival is fundamental. If the joint activity increases the fitness of the genetic material involved, that's a real, mind-independent fact.

  **Elena:** Fitness is statistical. It's not a switch. Look, Marcus, here's my worry. Van Inwagen rejects "Contact" because two objects can be in contact without composing anything (a cat on a mat). He rejects "Fastening" because screws can be loose. He says only "Life" avoids arbitrariness. But if "Life" relies on biological concepts that are themselves graded—metabolic integration, immune tolerance, reproductive bottlenecks—then "Life" is just as arbitrary as "Fastening." It's just a more complex fastening.

  **Marcus:** It's not arbitrary if it tracks the only phenomenon in the universe that *actually unifies* matter against entropy. A table doesn't fight entropy; its varnish does, maybe. A dog fights entropy. The slime mold slug fights entropy. That causal power is the difference.

  **Elena:** I agree causal power is real. I just deny it marks a boundary in *composition*. I say the scattered amoebae compose an object, and the slug composes an object. The difference is in the *properties* of those objects, not their existence. When they aggregate, the object gains new causal powers. When they scatter, it loses them. No vagueness in existence required.

  **Marcus:** But then you lose the intuition that the scattered swarm is *many* things and the slug is *one*. That's the data we're trying to save! Common sense says there are a thousand amoebae, then there is one slug.

  **Elena:** Common sense also says there are tables. You're willing to override common sense about tables to save "Life." Why not override common sense about the slug to save universalism?

  **Marcus:** Because the dog (or the slug) has an internal principle of unity. The table doesn't. If I smash the table, the pieces are still wood. If I smash the slug, the life stops. The unity is intrinsic.

  **Elena:** Is it? In the siphonophore, the zooids are physiologically distinct. One zooid handles digestion, another defense. If you isolate a digestive zooid, it dies. If you isolate a defensive one, it dies. They are obligate parts. But they develop from separate buds. Is the unity intrinsic to the zooids, or imposed by the developmental history?

  **Marcus:** Imposed by the developmental history, which is a causal process.

  **Elena:** And that process is continuous.

  **Marcus:** *Processes* are continuous. *Events* can be discrete. The initiation of the developmental program could be the cut-off.

  **Elena:** You're retreating to the zygote? What about asexual reproduction? What about the lichen, which has no single zygote? You're forcing biology into a reproductive bottleneck model that doesn't fit all the cases. If you say "Life" requires a specific kind of reproductive history, you're excluding things biologists count as individuals. If you say "Life" just means "functional integration," you're back to vagueness.

  **Marcus:** *[Pauses, stirring cold coffee]* I see the trap. If I define Life too narrowly (reproduction), I lose the lichen. If I define it too broadly (integration), I get vagueness.

  **Elena:** And if you get vagueness, van Inwagen's own Argument from Vagueness kills your view. You can't use that argument against tables and then immunize "Life" from it when the biology gets messy.

  **Marcus:** Unless… unless I concede that "Life" is a natural kind term, and natural kinds have sharp boundaries even if we don't know them. Like "water is H2O." Maybe "organism is [specific causal structure]." We just don't know the full structure yet.

  **Elena:** That's a metaphysical hope, not an argument. It says, "There must be a boundary because I need one."

  **Marcus:** And your view says, "There are no boundaries because I don't want to find them." Look, Elena, if I accept universalism, I have to say that when the amoebae aggregate, no *new* object comes into existence. Just a rearrangement. But the slug has properties the swarm doesn't—chemotaxis, coordinated movement.

  **Elena:** The scattered object has those properties dispositionally, or the parts do. Or, the object changes properties. Universalism handles property change fine.

  **Marcus:** It handles it, but it flattens the ontology. It makes the slug no more an object than the "slug-minus-one-amoeba" or the "slug-plus-the-air-around-it."

  **Elena:** True. But that's the cost of avoiding ontic vagueness. You pay with a proliferation of objects. I pay with a flat ontology. You pay with a sharp boundary that biology can't seem to locate. I'd rather have too many objects than a magic switch that biology can't find.

  **Marcus:** But if there's no switch, then evolution is selecting for… what? Not organisms?

  **Elena:** Evolution selects for replicators. Sometimes those replicators are housed in what you call "organisms." Sometimes they're in colonies. The metaphysics shouldn't dictate the biology.

  **Marcus:** *[Sighs]* I think we're at the stalemate point. I can't convince you that "Life" isn't vague without a better theory of biological individuation than we currently have. And you can't convince me that accepting scattered objects doesn't miss the fundamental unity of living things.

  **Elena:** Almost. I'll make one concession. If you can show me a biological theory that identifies a *discrete* mechanism for the transition in *Dictyostelium*—a specific molecular lock that engages at time *t*—I'll admit your "Life" criterion is empirically grounded.

  **Marcus:** And I'll concede this: if "Life" turns out to be a cluster concept with no necessary and sufficient conditions, then van Inwagen's restriction fails, and I might have to join you in universalism, or at least a brute-factualism. But until then, I'm betting on the phase transition. The unity is real, even if the boundary is hard to see.

  **Elena:** And I'm betting that the boundary is hard to see because it isn't there. But… I'll grant you that universalism makes it hard to explain why we *care* about the slug and not the scattered swarm. That pragmatic difference is real, even if the mereological difference isn't.

  **Marcus:** Then we agree on the data. We just disagree on whether the data reflects existence or interest.

  **Elena:** *[Stands up]* Which is, arguably, the oldest debate in philosophy. Coffee's on me next time?

  **Marcus:** Only if we talk about something easier. Like free will.

  **Elena:** *[Laughs]* Don't push it.
