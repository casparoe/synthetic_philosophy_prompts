answer: |-
  This is a fantastic snippet of intellectual history. You are looking at Isaac Newton, the father of modern physics, applying the same rigorous skepticism to biblical texts that he applied to optics and gravity. He was indeed a devout (but heterodox) Christian who believed the doctrine of the Trinity was a corruption of true religion.

  Here is the breakdown of the two things you're wrestling with.

  ### 1. What is the "word of Mithridates" reference?

  This is a reference to a specific, infamous historical event known as the **Asian Vespers**, which took place in **88 BC**.

  Mithridates VI was the King of Pontus (in modern-day Turkey) and the greatest enemy of the Roman Republic in the East. At the start of the First Mithridatic War, he secretly sent letters to the magistrates of cities all across the Roman province of Asia. The orders were identical: on a specific night, at a specific hour, every citizen was to murder their Roman and Italian neighbors.

  According to ancient historians (like Appian and Plutarch), the coordination was absolute. The massacres happened simultaneously across the region. Estimates of the dead range from 80,000 to 150,000 men, women, and children. It was the ultimate "secret global conspiracy."

  **Why Newton uses it:**
  Newton is using this as a sarcastic analogy for the "Arian Deletion Theory."
  *   **The Claim:** Trinitarians claimed that Arians (who denied the Trinity) had removed the verse from the Bible.
  *   **Newton's Rebuttal:** For that to be true, the Arians would have had to coordinate a secret operation across the entire Mediterranean world, get hold of every copy of the scriptures, erase the line without leaving a trace, and brainwash everyone into forgetting it ever existed.
  *   **The Jab:** Newton is saying, "Do you really believe the Arians pulled off a conspiracy more difficult than Mithridates' massacre? Mithridates had an army and kings; the Arians were a scattered theological faction. To believe they edited every book in Christendom simultaneously without getting caught is to believe in magic."

  ### 2. Is this a legit argument or rhetorical dice-loading?

  The short answer is: **It is both.** Newton is using heavy-handed rhetoric to dress up a genuinely sound principle of textual criticism.

  He is absolutely "loading the dice" by portraying the deletion theory as a cartoonish, magical conspiracy ("Conjurers too," "wipe even the memory... out of all men's brains"). No serious pro-Trinitarian scholar was likely arguing that the Arians used magic to erase the memory from people's brains. Newton is constructing a strawman to knock it down easily.

  **However, the underlying historical asymmetry he is pointing to is real.**

  In the field of textual criticism (the science of reconstructing original texts), there is a fundamental asymmetry between **interpolation** (adding text) and **universal excision** (deleting text everywhere).

  **Why Addition is Plausible:**
  *   **Marginalia:** Scribes often wrote notes in the margins (glosses) to explain a theological point. A later scribe, copying the book, might mistake the note for part of the original text and incorporate it into the body.
  *   **Harmonization:** Scribes tended to smooth out contradictions. If a verse was missing in one Gospel but present in another, a scribe might add it to the first one to make them match.
  *   **Decentralization:** This can happen in one monastery, in one city, and slowly spread as copies of that specific manuscript travel. It requires no central conspiracy.

  **Why Deletion is Implausible:**
  *   **Physical Evidence:** If you scrape a word off parchment (palimpsest) or cut a line out, it leaves physical evidence. If the verse was original, we would expect to see manuscripts where it was crossed out or erased. We don't.
  *   **Geography:** The ancient church was decentralized. You had communities in Syria, Egypt, Rome, Gaul, and Britain. For a phrase to be deleted from *all* of them requires a central authority with total control over all physical books. The Arians never had that.
  *   **The "Smoking Gun" (Patristics):** This is Newton's stronger, less rhetorical point hidden inside the sarcasm. He mentions Athanasius. During the height of the Trinitarian controversies (4th century), the Church Fathers fought tooth and nail over scripture. If 1 John 5:7 existed, it was the ultimate proof-text for the Trinity. It is historically inconceivable that Athanasius or Augustine would *not* have quoted it if it were in their Bibles. The fact that they didn't quote it until centuries later proves it wasn't there.

  **Is there a "modest version" of the deletion theory?**
  You asked if Newton is avoiding a modest version, such as: *"Maybe the Orthodox party just stopped copying the Arian versions, and since they won the political war, their manuscripts survived and the Arian ones rotted away."*

  Newton actually addresses this implicitly. The problem for the "deletion" theory is that the verse is missing from the **Greek** manuscripts (the East), where Arianism was actually strongest, but it appears later in the **Latin** manuscripts (the West). If Arians deleted it, why did it survive in the Latin Vulgate (which Jerome translated from Greek)? If the Orthodox deleted it, why is it missing from the earliest Greek codices (like Sinaiticus and Vaticanus)?

  **The Verdict:**
  Newton was right. Modern textual criticism confirms his conclusion: the *Comma Johanneum* (1 John 5:7) is a later addition, likely originating as a marginal note in Latin manuscripts around the 4th or 5th century and slowly making its way into the Greek text by the 16th century (just in time for Erasmus to be pressured into including it in his printed Greek New Testament).

  Newton's rhetoric is hyperbolic—he's angry and being satirical—but the structural argument holds up. It is historically easy for a sentence to be added to a book and spread through careless copying. It is historically impossible for a sentence to be surgically removed from every book in an empire without leaving a single scar. Newton recognized that the burden of proof lay on the person claiming the text was *removed*, not the person claiming it was *added*.
