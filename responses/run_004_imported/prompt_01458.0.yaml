  3.  **Address Question 1: The "Verbal Transformation" Hedge & The MRL Objection:**
      *   *Modern Objection:* The "Best System" account (Lewis) faces the problem that simplicity depends on the vocabulary (predicates) used. If I allow gerrymandered predicates (e.g., "grue"), I can make any system simple. Lewis solves this with "perfectly natural properties."
      *   *Mill's Context:* Mill is an empiricist/inductivist. He doesn't have Lewis's modal realism or property semantics.
      *   *Mill's Point:* When Mill says it's a "verbal transformation," he isn't necessarily worrying about *predicates* in the Lewis sense. He is worrying about the *ontological status* of the law.
      *   *Key Distinction:* Is a law a *command* (governing) or a *description* (summary)?
      *   *Mill's Stance:* Mill is a Humean regularity theorist. For him, there is no "glue" holding the universe together. There are just uniformities.
      *   *Why "Verbal Transformation"?* If I say "The law is the simplest axiom set," I haven't explained *what makes* something a law other than our way of describing the uniformities. The "lawhood" isn't in the world; it's in our *systematization* of the world.
