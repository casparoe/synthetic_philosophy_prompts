  I'm working on a feature about anthropic reasoning and existential risk, and I've grown frustrated with how popular treatments of the Doomsday Argument stop at Carter and Leslie's original inference without engaging with how contested it actually is among specialists. I'd like your help thinking through the main positions philosophers and physicists have staked out in response to it. Consider these seven:

