answer: |-
  **Setting:** *A dusty, sunlit sculptor's studio. Shards of dried clay litter the floor. In the center, on a turntable, sits a magnificent, wet clay bust of a weeping angel. A sculptor stands nearby, hands hovering over the work, waiting for a signal. ELENA and MARCUS stand before the bust.*

  **ELENA:** Look at it, Marcus. It's perfect. And in ten seconds, it's gone.

  **MARCUS:** A shame. But the clay remains.

  **ELENA:** Exactly. That's the point. The *clay* remains. The *statue* does not. If the sculptor squashes it, the lump of clay survives the squashing. The statue does not survive the squashing. Therefore, by the Indiscernibility of Identicals, the statue cannot be identical to the lump.

  **MARCUS:** Leibniz's Law. The classic move. $x$ and $y$ are identical only if they share all properties. The lump has the property *will-survive-squashing*. The statue has the property *will-not-survive-squashing*. Different properties, different objects. You've got two things occupying the same space at the same time.

  **ELENA:** I've got one thing *constituting* another. They coincide, but they don't coincide in identity. It's the only way to respect the modal facts. We know the artwork would be destroyed. We know the matter wouldn't. If they were one thing, it would both be destroyed and not destroyed. Contradiction.

  **MARCUS:** Or, Elena, you're multiplying entities beyond necessity. Look at them. Where does the lump end and the statue begin? There is no seam. They share every atom, every electron, every gram of mass. If I weigh the lump, I get the weight of the statue. If I push the statue, I move the lump. To say there are two distinct objects here is to say reality is doubling up on itself for no physical reason. It's ontological gluttony.

  **ELENA:** It's not gluttony; it's precision. You're letting parsimony blind you to distinction. Just because they share *physical* properties doesn't mean they share *modal* properties. The lump is essentially a lump; it could be a ball. The statue is essentially a statue; it cannot be a ball. Their persistence conditions differ. That difference makes them distinct.

  **MARCUS:** *(Steps closer to the bust, lowering his voice)* Here is where your precision gets fuzzy. You say the difference in persistence conditions makes them distinct. But I'm asking for the *ground*. What fact *right now*, in this room, makes it true that this object has one modal profile and that object has another?

  **ELENA:** The sortal properties. What kind of thing they are.

  **MARCUS:** But sortals are just concepts we project onto the matter. Look at the clay. Is there a "statue-essence" particle hidden in the mixture? No. Physically, they are duplicates. If they are distinct objects, they must differ in *some* categorical property that grounds the modal difference. If they share all microphysical properties, and you deny they share all modal properties, you're saying modal properties float free of the physical base. You're positing a brute modal fact.

  **ELENA:** I'm not saying they float free. The modal properties are grounded in the *history* and *intentions* that brought the object into being. This lump existed before the statue. The statue came into existence when the sculptor shaped the lump. That historical relation grounds the difference. The lump has a longer temporal career than the statue.

  **MARCUS:** *(Smiles)* Ah, the historical move. But think about the Grounding Problem again. Suppose the sculptor hadn't shaped it. The lump would still be here. The statue wouldn't. So their histories differ. But *now*, as they stand, they are qualitatively identical. If I am a monist, I say there is one object here. It is clay. It is currently arranged statue-wise.

  **ELENA:** And when it's squashed?

  **MARCUS:** When it's squashed, the one object survives. But the description "statue" no longer applies. You say, "The statue is destroyed." I agree. But "The statue is destroyed" doesn't mean an object ceased to exist. It means an object lost a property—the property of *being a statue*.

  **ELENA:** But that violates our intuition about artifacts. If I burn a chair, the chair is gone. We don't say, "The wood survived, so the chair survived as wood." We say the chair ceased to be. If the statue is just the clay *described* as a statue, then the statue is the clay. And if the clay survives, the statue survives. You're denying the destruction of the statue to save your ontology.

  **MARCUS:** No, I'm distinguishing between *existence* and *classification*. I can grant your modal intuition—that the *statue* would not survive—without positing a second object. I just locate the modality in our practices, not in the metaphysics of the object.

  **ELENA:** So the destruction is subjective?

  **MARCUS:** Not subjective. Socially constituted. The "statue" is a status the clay holds. When the sculptor squashes it, the status is revoked. The object persists, the status perishes. You, however, are forced to say there are two objects. And that leads to the "Too Many Thinkers" problem. If I sit on a clay chair, am I sitting on one thing or two? If there are two, and both are material objects, do they both have mass? If so, why doesn't the scale read double?

  **ELENA:** Because they share the mass. Constitution isn't addition.

  **MARCUS:** That sounds like magic. How do two distinct things share the *very same* mass without overlapping parts? If they are distinct, they must have distinct parts. If they have distinct parts, they aren't coinciding. If they aren't coinciding, where is the second part?

  **ELENA:** You're treating parthood like it's only spatial. But objects have modal parts. The statue has a future where it is a statue. The lump has a future where it is a lump. They diverge in modal space. That divergence is enough for distinctness, even if they overlap in physical space.

  **MARCUS:** *(Turns to the sculptor, who is getting impatient)* But that divergence isn't *in* the objects, Elena. It's in the *counterfactuals*. And counterfactuals need truthmakers. If there is only one hunk of matter here, what makes the counterfactual "If squashed, the statue dies" true, while "If squashed, the lump lives" is also true? If there is only one object, it can't have contradictory fates.

  **ELENA:** Precisely! Because there are *two* objects. One dies, one lives. No contradiction.

  **MARCUS:** But why *this* object dies and *that* one lives? What pins the "dying" property to the statue-object and the "living" property to the lump-object? They are qualitatively identical *now*. It seems arbitrary. It's as if you've painted an invisible label on one saying "Perish" and the other "Persist," but the paint has no physical substance.

  **ELENA:** The label isn't invisible; it's categorical. It's the difference between *being an artifact* and *being a quantity of matter*. Artifacts have identity conditions tied to form and function. Matter has identity conditions tied to continuity of substance. These are real features of the world, not just our heads. The world contains both substances and forms.

  **MARCUS:** I think the world contains substances, and forms are ways those substances are. But let's test your view. If the sculptor squashes it, and then immediately reshapes it into the exact same angel...

  **ELENA:** It's a new statue. Numerically distinct.

  **MARCUS:** But the same lump.

  **ELENA:** Yes.

  **MARCUS:** So the lump persists through the squashing. The statue does not. But physically, the before-statue and the after-statue are indistinguishable. The lump is indistinguishable. So, at time $T_1$, you have Lump1 and Statue1. At $T_2$ (squashed), you have Lump1. At $T_3$, you have Lump1 and Statue2.
  My question is: At $T_1$, what makes Statue1 distinct from Lump1 other than your prediction of $T_2$? If the distinction relies entirely on what happens *later*, then the identity of the object *now* depends on the future. That's backward causation.

  **ELENA:** Not backward causation. Essentialism. What a thing *is* determines what it *can do*. The statue *is* essentially shaped. The lump is not. That essence is present now.

  **MARCUS:** But where is the essence? If I analyze the clay atom by atom, I find silicon, oxygen, water. I don't find "essentially-shaped-ness." You're asking me to believe in a metaphysical ghost in the machine.
  Here is my alternative, Elena. Accept there is one object. It is the clay. It has the capacity to be a statue. When it is squashed, it loses that capacity. The statement "The statue is destroyed" is true, but it is a *conceptual* truth, not an *ontological* one. It means "The object no longer falls under the concept 'statue'." You don't need a second object to make that true. You just need a concept and an object that fails to satisfy it.

  **ELENA:** But concepts don't have causal powers. Statues do. They inspire, they sell, they break. If the statue is just a concept, who is selling what?

  **MARCUS:** The object is selling. Under the description "statue."
  *(The sculptor clears his throat loudly.)*

  **ELENA:** We're running out of time. Look, if I'm right, there are two objects. If you're right, there is one. If there is one, and I say "The statue will not survive," and you say "The object will survive," aren't we just talking past each other?

  **MARCUS:** Only if you insist the word "statue" refers to a distinct metaphysical entity. If "statue" refers to the clay *in a specific functional state*, then we agree on the physics. We disagree on whether the functional state warrants a second ontological entry in the ledger.

  **ELENA:** And I say the ledger must track the modal reality. If the world allows for one thing to perish while another persists in the same place, the ledger must have two lines.

  **MARCUS:** Or the ledger has one line, and "perishing" is just a change of state.
  *(The sculptor raises his hands.)*

  **ELENA:** He's going to do it. Watch. If one object remains, I owe you a drink. If two... well, one of them will be dead.

  **MARCUS:** If one object remains, you admit that "destruction" is just loss of form.

  **ELENA:** Deal.

  *(The sculptor brings his hands down. The wet clay collapses with a sickening squelch. The angel is gone. A shapeless gray mound remains.)*

  **MARCUS:** *(Gesturing to the mound)* The object persists.

  **ELENA:** *(Gesturing to the mound)* The lump persists. The statue is dead.

  **MARCUS:** But you can't point to the dead statue. You can only point to the lump.

  **ELENA:** I can point to where it *was*. And the truth of "It is gone" requires that "It" was something that could go. The lump hasn't gone. So "It" must have been something else.

  **MARCUS:** Or "It" was the lump, and "Gone" means "No longer artistic."

  **ELENA:** Then you've redefined "existence."

  **MARCUS:** And you've doubled the universe.

  *(They stand in silence for a moment, looking at the gray mud.)*

  **ELENA:** Same time next week? The sculptor is starting a bronze cast.

  **MARCUS:** Only if we can agree on whether the mold and the bronze are one or two.

  **ELENA:** *(Smiling)* Don't push your luck.
