      *   *Point 3: Idealism vs. Realism.* Borges is an idealist (influenced by Berkeley). MWI is a realist interpretation of quantum mechanics. Borges would see MWI as another "totalizing system" or "monstrous cosmogony" (like the taxonomy in Celestial Emporium) rather than truth.
