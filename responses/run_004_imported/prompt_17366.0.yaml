      *   *Ethical/Social Implications:* It creates a "double standard" encoded in software. It requires the platform to police identity. It risks outting users. It assumes a monolithic group identity.
      *   *Linguistic Reality:* Reclaimed slurs are context-dependent, not just speaker-dependent. An ally might be allowed to use it in some contexts, while a group member might use it aggressively in others.

