answer: |-
  Here is the breakdown of Aquinas's position, the application to your specific scenario, and the verdict you can take back to Priya.

  ### 1. Aquinas's Actual Position on Tyrannicide

  To understand where Aquinas stands, you have to look primarily at *De Regno* (On Kingship) and the *Summa Theologiae* (II-II, Q. 42 on Sedition and Q. 64 on Killing). Priya is correct that your initial read was too optimistic; Aquinas is famously cautious, but he does leave a narrow door open.

  **The Distinction: Usurper vs. Oppressive Ruler**
  Aquinas distinguishes between two types of tyrants:
  *   **The Usurper (*tyrannus absque titulo*):** Someone who seizes power without any legal or moral right. They never possessed legitimate authority.
  *   **The Oppressive Ruler (*tyrannus in exercitio*):** Someone who gained power legitimately (through election, inheritance, etc.) but then rules unjustly.

  Aquinas is more permissive regarding the **Usurper**. Because the usurper never held true authority, removing them is not technically "sedition" (disturbing the peace of a legitimate regime). However, regarding the **Oppressive Ruler**, Aquinas is extremely restrictive. He argues that removing a legitimate ruler often leads to greater evils (civil war, instability, or a worse successor) than tolerating the tyranny for a time.

  **The "Public Authority" Requirement**
  This is the hinge point of your debate. Even in the case of the Usurper, Aquinas explicitly forbids **private individuals** from taking it upon themselves to kill the tyrant.
  *   **Why?** He argues that if private citizens decide who lives or dies based on their own judgment of "tyranny," it destroys the rule of law and invites chaos. It sets a precedent where any dissident can claim a ruler is a tyrant to justify murder.
  *   **Who counts as Public Authority?** For Aquinas, the removal must be authorized by a body that has jurisdiction over the ruler. In his medieval context, this could be:
      1.  The community acting collectively (not a lone assassin).
      2.  A superior authority (e.g., an Emperor deposing a King, or the Pope deposing a Christian ruler).

  **The Verdict on Internal Tyrannicide:**
  For Aquinas, licit tyrannicide is not a moral free-for-all. It is a **judicial act**. It requires a competent authority to judge that the ruler has forfeited their right to rule, followed by an execution of that judgment. It is *law enforcement*, not vigilantism.

  ### 2. Applying This to a Foreign Covert Drone Strike

  Now we apply this framework to your scenario: A foreign intelligence service (State A) covertly kills a dictator (State B) via drone, with zero internal involvement from State B's populace or institutions.

  **Problem A: The Jurisdiction Deficit**
  Aquinas's "public authority" requirement isn't just about having an army or a government; it is about having *jurisdiction*. In Aquinas's political theology, authority is hierarchical. A King is subject to an Emperor; a Christian King is subject to the Pope.
  *   In the modern Westphalian system, sovereign states are peers; one state does not have legal or moral jurisdiction over the internal leadership of another.
  *   Therefore, State A is not a "superior authority" to State B. To Aquinas, State A acting against State B's leader is not a judge executing a criminal; it is one private party attacking another. In Thomistic terms, a foreign king acting outside of a higher imperial mandate functions more like a **private individual** relative to the target polity than a legitimate judge.

  **Problem B: The Covert Nature**
  Aquinas insists on public authority partly to ensure the act is for the *common good*, not private gain or vengeance. A covert black-ops mission is, by definition, secret. It bypasses public declaration and accountability. For Aquinas, justice must be seen to be done to maintain order. A secret poisoning or drone strike lacks the transparency required of a public judicial act. It looks indistinguishable from murder or treachery, which Aquinas condemns even in war (he argues against killing by ambush/treachery in *Summa* II-II, Q. 40).

  **Problem C: Tyrannicide vs. Just War**
  This is the category error you and Priya were circling.
  *   **Tyrannicide** is an *internal* corrective mechanism. It is the body politic removing a diseased head.
  *   **Assassination by a Foreign Power** is an *external* act of force.
  Aquinas has a separate framework for external force: **Just War Theory**. For a war (or act of war) to be just, it requires legitimate authority, just cause, and right intention. While "stopping a tyrant" might be a just cause, Aquinas generally requires a sovereign authority to declare war publicly. Covert assassination sidesteps the sovereign declaration of war.

  ### 3. The Verdict

  Here is the honest best guess you can bring back to Priya:

  **Aquinas would rule that a foreign covert drone strike is NOT licit tyrannicide.**

  It fails on the **Public Authority** ground. A foreign state lacks the jurisdictional standing to act as the "judge" over another sovereign's ruler. In Aquinas's eyes, this act does not qualify as *tyrannicide* at all. It is either:
  1.  **Murder:** Because it is a private killing without judicial process.
  2.  **An Act of War:** Which would then need to be judged by Just War criteria (which generally frown on targeted assassination as opposed to combatant engagement).

  **Who wins the debate?**
  *   **Priya wins on the text:** She is right that Aquinas's view is heavily hedged and turns on the "public authority" requirement. Your "green light" interpretation ignores the strict procedural constraints he places on that light.
  *   **You win on the implication:** You were right to sense that this scenario doesn't fit his model. The reason it's not okay isn't just because the tyrant might be "legitimate"; it's because a foreign intelligence service can *never* be the "public authority" Aquinas requires for tyrannicide.

  **The Takeaway:**
  Tell Priya: *"You were right about the text. Aquinas requires a competent public authority with jurisdiction to depose a tyrant. A foreign state has no jurisdiction over another sovereign, so to Aquinas, their black-ops team counts as a private aggressor, not a public judge. It's not tyrannicide; it's murder or irregular war. So, no, Aquinas doesn't give a green light for CIA drone strikes."*
