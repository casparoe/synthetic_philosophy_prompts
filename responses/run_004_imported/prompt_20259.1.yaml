answer: |-
  Here are ten interview questions designed for your podcast, tailored to your background in physics and your focus on the history of ideas. They are structured to deepen the conversation beyond the initial headline of Anscombe's accusation.

  **1. The Nature of the Accusation**
  Elizabeth Anscombe's pamphlet is titled "Mr. Truman's Degree," yet history remembers it for the charge that Truman was a murderer. In your view, was the primary moral failure here the act of bombing itself, or was it the specific act of an academic institution conferring honor upon a man who committed that act? Does the moral weight rest on the killing, or on the corruption of the language of virtue by Oxford?

  **2. Intention and the Doctrine of Double Effect**
  Anscombe relies heavily on the distinction between intended means and merely foreseen side effects. A common defense of the bombings is that the target was "Japan's capacity to make war," and civilian death was a foreseen but unintended consequence of destroying industrial centers. How do you respond to the claim that the Doctrine of Double Effect actually *exonerates* Truman, provided his primary intention was ending the war rather than killing civilians for its own sake?
  *   **Follow-up:** You will likely argue that the destruction of the civilian population *was* the means to coerce surrender, making the death intended rather than foreseen. If so, does this imply that any weapon whose mechanism of action relies on indiscriminate terror is inherently immoral, regardless of the military target it physically strikes?

  **3. Absolutism vs. Consequentialist Calculus**
  Anscombe is famous for coining the term "consequentialism" specifically to condemn the reasoning that justifies evil acts for good outcomes. She argues the prohibition against killing innocents admits no exceptions. But if refusing to bomb had resulted in a prolonged invasion costing a million lives, why does the moral prohibition against *intending* the death of 100,000 civilians lexically outweigh the responsibility to *prevent* the death of a million soldiers?
  *   **Follow-up:** I anticipate you'll say that adopting consequentialist reasoning corrupts the moral agent and makes all actions permissible. But in the realm of statecraft, is there not a distinct moral burden on the leader to protect their own citizens that might require getting their hands dirty, even if it violates personal moral integrity?

  **4. The "Supreme Emergency" Exception**
  Michael Walzer, in *Just and Unjust Wars*, proposes a "supreme emergency" exception where normal rules of war may be suspended, yet he argues that by August 1945, the emergency for Japan had already lapsed. Does your defense of Anscombe rely on Walzer's timeline—that the threat was no longer existential—or do you reject the "supreme emergency" exception entirely, even if the invasion of Japan had seemed imminent and catastrophic?
  *   **Follow-up:** If you reject the exception entirely, as Anscombe likely would, how do you answer the charge that an absolutist ethic is a luxury of the observer, potentially demanding a level of purity that invites greater total suffering when facing a totalitarian adversary?

  **5. The Physics of Indiscriminacy**
  Speaking as a physicist, I am struck by the difference between the atomic bombs and the conventional firebombing of Tokyo, which killed more people overall. Does the *mechanism* of the nuclear weapon matter morally? Is there a qualitative difference in Anscombe's framework between killing civilians with a thousand conventional bombers versus a single nuclear device, or is the moral species of the act identical?

  **6. Counterfactuals and Necessity**
  Historians continue to debate whether Japan was already on the verge of surrender due to the Soviet entry into the Pacific war. For the sake of argument, if we grant that the atomic bombs were *unnecessary* to secure surrender, does that change the moral classification of the act from "murder" to something else, or does Anscombe's argument hold that the killing of innocents is intrinsically wrong regardless of military necessity?

  **7. The Label of "Murder"**
  Anscombe did not shy away from the word "murder," a term usually reserved for private criminal acts, not decisions made by Heads of State during war. Does applying this specific label to a President hinder moral clarity by sounding like partisan vitriol, or is it necessary to shock the conscience out of the numbness that "collateral damage" terminology induces?

  **8. Institutional Complicity**
  Your guest is here partly because of the context of the honorary degree. We often view universities as places of critique, but they also confer legitimacy. In the modern era, where universities frequently accept defense funding or host researchers tied to military applications, what is the contemporary equivalent of the moral duty Anscombe pressed upon Oxford in 1956?

  **9. Remote Warfare and Modern Ethics**
  Anscombe wrote before the age of drone warfare and autonomous weapons systems. Today, we have operators killing combatants and civilians from thousands of miles away. Does Anscombe's focus on *intention* provide a better framework for judging modern remote warfare than international law, which often focuses on *proportionality* and *distinction* in a way that can be gamed by technicalities?

  **10. The Viability of "Dirty Hands"**
  Finally, many political philosophers argue that governing requires a willingness to have "dirty hands." If we accept Anscombe's view that certain acts are absolutely forbidden regardless of the political stakes, are we left with a moral theory that is beautiful but politically impossible? Is the goal of her philosophy to guide statecraft, or to stand as a prophetic witness against it?
