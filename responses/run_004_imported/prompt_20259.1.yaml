          *   *Refinement:* Focus on the "lexical priority" of the prohibition. If killing 100,000 saves a million, why is the act still forbidden? Connect to her coining of "consequentialism."
          *   *Follow-up:* Guest will likely say it corrupts moral agency. *Follow-up:* Ask about the cost of that integrity on the world stage.
      *   *Question 4 (Walzer/Supreme Emergency):* *Requirement:* Address Walzer's exception and the timing (August 1945).
          *   *Draft:* What about Walzer's supreme emergency? He says it was over by August.
          *   *Refinement:* Walzer allows exceptions for existential threats but argues the threat lapsed by August '45. Does your defense of Anscombe rely on Walzer's timeline, or do you reject the exception entirely?
          *   *Follow-up:* Guest will likely reject the exception entirely (Anscombe style). *Follow-up:* Ask about the risk of rigid rules in the face of totalitarianism.
      *   *Question 5 (The Physicist's Angle):* Since the host is a physicist, include a question about the *nature* of the weapon.
          *   *Draft:* As a physicist, I wonder about the bomb itself. Does the scale matter?
          *   *Refinement:* Does the *indiscriminate* nature of nuclear weapons make the moral calculus different from conventional firebombing (e.g., Tokyo)?
      *   *Question 6 (Political Authority):* Anscombe focused on the degree, not just the act. What is the role of institutions?
          *   *Draft:* Why did Oxford matter?
          *   *Refinement:* Anscombe argued institutions confer honor. What is the responsibility of academic institutions in validating political power?
      *   *Question 7 (Alternative Actions):* Counterfactuals.
          *   *Draft:* Could they have done something else?
          *   *Refinement:* Critics argue surrender was imminent due to Russia/Soviet entry. Does the *necessity* of the bomb matter for Anscombe's charge, or is it solely about the *type* of act?
      *   *Question 8 (Legacy/Modern Warfare):* Connect to today.
          *   *Draft:* Is this still relevant?
          *   *Refinement:* Drone warfare and autonomous weapons. Does Anscombe's framework help us judge modern remote killing?
      *   *Question 9 (The "Murderer" Label):* Address the harshness of the term.
