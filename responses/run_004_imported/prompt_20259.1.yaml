          *   *Draft:* How does DDE apply here? Critics say the target was war capacity.
          *   *Refinement:* Make it sharper. Anscombe argues the *means* was civilian death. How do we distinguish intended effects from foreseen side effects when the destruction of the city *is* the method of coercion?
          *   *Follow-up:* Guest will likely say the intent was to terrorize. *Follow-up:* Ask about the physical mechanism of the bomb vs. the psychological intent.
