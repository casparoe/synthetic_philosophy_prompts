  2.  **Evaluate Each Theory on Reclamation:**

      *   **(1) Prohibitionism (Anderson & Lepore):**
          *   *Core Idea:* Slurs are offensive because they are prohibited words. Their content is neutral; the offense comes from the violation of the prohibition.
          *   *Reclamation:* If the rule is "don't use this word," how does in-group use become okay? Prohibitionists usually say the prohibition is context-sensitive or group-sensitive. However, the core mechanism is just "it's banned." Explaining why the ban lifts for insiders requires specifying *who* enforces the ban and *when*. It's often criticized for being too shallow. It treats the offense as purely normative/pragmatic rather than semantic. Reclamation looks like a change in the prohibition rules.
          *   *Fit:* Moderate. It handles variation well (rules change), but doesn't explain the *positive* affirming aspect well, just the lack of offense. It often feels like saying "it's okay because we say it's okay."
          *   *Verdict:* Bolted-on (mostly). The theory says "it's prohibited," so reclamation requires explaining why the prohibition doesn't apply, which isn't central to the "prohibited word" mechanism itself.

      *   **(2) Combinatorial Externalism (Hom):**
          *   *Core Idea:* Slurs encode a complex derogatory property determined by external social institutions (ideologies). The meaning is tied to the racist/sexist institution.
          *   *Reclamation:* This is tough for Hom. If the meaning is fixed by the oppressive institution, how can the oppressed group change it? Hom has to argue that the social institution itself changes or that the word's connection to the ideology is severed in certain contexts. This often requires significant maneuvering because the semantics are *externally* fixed by the very structures the group is fighting against.
          *   *Fit:* Poor. The externalist fixation makes semantic change hard. Reclamation requires changing the social institution's grip on the term, which is a heavy lift for the theory.
          *   *Verdict:* Bolted-on (heavily).

      *   **(3) Null-Extension / "Pejoratives as Fiction" (Hom & May):**
          *   *Core Idea:* The derogatory property is empty/null (no one actually has it). Using the slur presupposes this false ideology.
          *   *Reclamation:* If the term relies on a false ideology to have content, how does in-group use work? If insiders use it, are they invoking the false ideology? If they aren't, what content does the word have? This view struggles to explain how the word retains *any* meaning during reclamation without invoking the null property. It often has to say insiders are using a *different* word (homonym) or engaging in a pretense that cancels the nullity.
          *   *Fit:* Very Poor. It makes reclamation look like semantic ambiguity or error.
          *   *Verdict:* Bolted-on (very heavily).

      *   **(4) Conventional Implicature / Multidimensional Semantics (Potts tradition):**
          *   *Core Idea:* Slurs have truth-conditional content (neutral counterpart) + a conventional implicature (expressive content) that is separate.
          *   *Reclamation:* The expressive dimension can be contextually modulated or detached. Since the expressive content is a separate dimension, it's easier to argue that in-group use cancels or flips the expressive dimension while keeping the truth-conditional content. However, conventional implicatures are usually conventionally fixed. Explaining why the CI flips requires pragmatic enrichment.
          *   *Fit:* Moderate/Good. The separation of dimensions helps, but CIs are supposed to be conventional. Reclamation looks like a change in convention.
          *   *Verdict:* Bolted-on (but manageable). The separation allows it, but the mechanism for flipping the CI isn't automatic.

      *   **(5) Expressivism (Jeshion):**
          *   *Core Idea:* Slurs express a psychological state (contempt) directly. No descriptive content needed.
          *   *Reclamation:* If the word expresses contempt, how does it express solidarity? Jeshion argues that the expression depends on the speaker's attitude and the common ground. In-group use expresses a different attitude (solidarity/reclaiming). Since the core is the *expression of attitude*, changing the attitude changes the function.
          *   *Fit:* Good. It centers the speaker's intent and the expressive function. If the intent changes, the expression changes.
          *   *Verdict:* Built-in (mostly). The theory is about expression, so different expressions fit naturally.

      *   **(6) Perspectival Account (Camp):**
          *   *Core Idea:* Slurs invite the hearer to adopt a specific perspective (ideological lens).
          *   *Reclamation:* This is often cited as one of the best for reclamation. In-group use can invite the hearer to adopt a *different* perspective (one of solidarity, resilience, shared history) using the same lexical item. The mechanism is "adopting a perspective." Since perspectives are flexible and context-dependent, the same word can invite different perspectives depending on who is speaking.
          *   *Fit:* Excellent. The core mechanism is perspective-taking. Reclamation is just taking a different perspective on the term/group.
          *   *Verdict:* Built-in.

