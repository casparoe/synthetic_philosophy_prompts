      *   *The Conflict:* The *Bruen/Dobbs* test asks: "Was this right recognized in the past?" Douglass asks: "Does the text, read in light of liberty, allow this?"
      *   *Conclusion:* Douglass would likely *hate* the "history and tradition" test. Why? Because the "history and tradition" of 1787-1868 included slavery, coverture, and disenfranchisement. If you anchor rights to history, you anchor them to the very oppression Douglass fought.
      *   *Garrison vs. Douglass:* Ironically, the modern "history and tradition" test looks more like *Garrison's* method (look at what was actually done/intended) than Douglass's (look at the liberatory potential of the text). *However*, Garrison concluded the document was irredeemable, whereas the Court concludes the document protects only what was historically protected.

  5.  **Analyze Douglass as an "Originalist":**
      *   *Modern Originalism:* Usually means "Original Public Meaning" (Scalia/Thomas) or "Original Intent" (older Bork).
      *   *Douglass's Originalism:* He looked at the text but infused it with natural law. He argued the *words* "people," "citizens," "liberty" have a universal meaning that transcends the specific racist intentions of the framers.
      *   *Comparison:*
          *   *Scalia/Thomas:* Would ask what "liberty" meant to a reasonable person in 1791/1868. (Likely excludes slaves/women).
          *   *Douglass:* Would ask what "liberty" *ought* to mean according to the principles of the Declaration and the text's broad language.
      *   *Verdict:* Douglass is not a modern originalist. He is more of a "Living Constitutionalist" or a "Natural Law Textualist." He believes the text contains seeds of growth that the framers themselves didn't fully realize.

