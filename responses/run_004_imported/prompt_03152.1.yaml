answer: |-
  This is a sharp reading of the Douglass-Garrison split, and it cuts to the heart of a major tension in modern constitutional theory. You are right that Douglass's break with Garrison wasn't just about optimism vs. pessimism; it was a fundamental disagreement about *hermeneutics* (how to read the law).

  If we take Douglass's mature position (post-1851) seriously, **he would likely view the modern "history and tradition" test as a betrayal of the Constitution's promise, and he would not fit comfortably into the modern "originalist" camp.**

  Here is how Douglass's logic maps onto the current doctrinal landscape.

  ### 1. Douglass vs. the "History and Tradition" Test
  The test articulated in *Bruen* (Second Amendment) and *Dobbs* (Abortion) essentially argues: *If a right was not historically recognized or regulated in a specific way at the time of ratification (1791 or 1868), it is not protected by the Constitution today.*

  Douglass would reject this methodology almost entirely. In fact, his entire political career after 1851 was an argument against using "history and tradition" to define constitutional rights.

  *   **Practice is not Law:** As you noted, Douglass explicitly argued that the historical practice of the U.S. government regarding slavery did not determine the Constitution's meaning. In his 1860 speech in Glasgow, he said:
      > "I hold that the Constitution... will afford security to liberty... if administered according to its true meaning."
      He acknowledged that for 70 years, it had been administered to support slavery. To Douglass, that was a record of **sin**, not a record of **law**. To anchor rights in "history and tradition" is to anchor them in the very sin Douglass sought to purge.
  *   **The "Dead Hand" Problem:** The "history and tradition" test privileges the regulatory regimes of the past. In 1791 and 1868, the "tradition" included coverture (women having no legal identity), widespread disarmament of Black people, and the denial of basic due process to non-citizens. If Douglass accepted that "history and tradition" defines the scope of liberty, he would have to concede that women and Black people were never intended to have full rights.
  *   **The Anti-Precedent Stance:** Douglass argued that long-standing custom creates no constitutional authority. He would likely view *Bruen* and *Dobbs* as institutionalizing the "Garrisonian" error: accepting that the *reality* of oppression defines the *text* of freedom.

  **Verdict:** Douglass would see the "history and tradition" test as a method for constitutionalizing injustice. It is the exact opposite of his rule that "ambiguous text must be read in favor of liberty."

  ### 2. Is Douglass an "Originalist"?
  This is trickier, because "originalism" today is a coalition of sometimes conflicting ideas.

  **Where he aligns with Originalism:**
  *   **Textual Commitment:** Like Justice Scalia, Douglass insisted you must look at the *words* of the Constitution, not the secret intentions of the framers. He famously argued that the words "slave" and "slavery" do not appear in the document. He wanted to bind the judge to the text.
  *   **Rejection of "Living Constitution" Drift:** Douglass didn't believe judges should just invent rights based on modern whim. He believed the rights were *already there* in the text, waiting to be claimed.

  **Where he diverges from Modern Originalism:**
  *   **Original Meaning vs. Original Expected Application:** Modern originalists (like Thomas or Barrett) often focus on the "original public meaning"—how a reasonable person in 1791 would have understood the text.
      *   *The Problem:* A reasonable person in 1791 understood "the people" to exclude enslaved Africans and often women.
      *   *Douglass's Move:* Douglass argued that the *words themselves* ("We the People," "Liberty," "Privileges or Immunities") have a **universal, natural law meaning** that transcends the racist expectations of the framers. He believed the text was *better* than the men who wrote it.
  *   **The "Canon of Construction":** Douglass adopted Lysander Spooner's rule: *If the text is ambiguous, you must choose the interpretation that supports justice and liberty.* Modern originalists generally reject this. They argue that if the text is ambiguous or the history is unclear, the judge shouldn't import their own moral preference for "liberty." Douglass says you *must* import that preference.

  **Verdict:** Douglass is a **Natural Law Textualist**, not a modern Originalist. He believes the text encodes universal moral truths that may outstrip the framers' own understanding. Modern originalism tends to be more positivist (what did the law *say*, not what *should* it say).

  ### 3. The Irony: The Court is acting like Garrison, not Douglass
  There is a profound irony in your comparison.

  *   **Garrison's Method:** Look at the history, look at the intent, look at how the document actually functioned. Conclusion: The document is pro-slavery/anti-liberty.
  *   **The Modern Court's Method (in *Dobbs/Bruen*):** Look at the history, look at the tradition, look at how the rights were actually regulated. Conclusion: If it wasn't historically protected, it isn't protected now.

  In a strange way, the conservative Supreme Court's reliance on "history and tradition" is **Garrisonian realism without Garrisonian morality.**
  *   Garrison said: "History shows this document protects slavery, so I reject the document."
  *   The Court says: "History shows this document didn't protect abortion/gun rights in this way, so we won't protect them now."

  Both accept that **historical practice defines constitutional meaning.**

  Douglass is the outlier. He is the one saying: "History shows we failed. The text shows we promised better. Enforce the promise, ignore the failure."

  ### 4. How Douglass would rule
  If Douglass were on the Court today, his methodology would likely lead to results that confuse both modern liberals and conservatives:

  1.  **He would strike down restrictions on rights** (like abortion or voting access) not because of "privacy" or "evolving standards," but because the *text* of the 14th Amendment ("Liberty," "Equal Protection") creates a presumption of freedom that the state cannot overcome with appeals to 19th-century tradition.
  2.  **He would be skeptical of gun rights** if the "history and tradition" relied upon was the tradition of disarming Black people. He would likely argue that the "original meaning" of the 2nd Amendment must be read through the "original meaning" of the 14th Amendment (which was specifically designed to allow Black citizens to bear arms for self-defense against the KKK). He wouldn't look at 1791 white tradition; he would look at 1868 Black necessity.
  3.  **He would reject "Tradition" as a trump card.** He would argue that "tradition" is often just a euphemism for "past tyranny."

  ### Summary
  You hit the nail on the head: **Douglass's fight with Garrison was about whether the past dictates the law.**

  *   **Garrison:** Yes, the past (intent/practice) dictates the law. The law is bad.
  *   **Modern Originalists/Conservative Court:** Yes, the past (history/tradition) dictates the law. The law is limited.
  *   **Douglass:** No. The **Text** (read through the lens of natural rights) dictates the law. The past is evidence of our failure to live up to the law.

  Douglass is not an originalist by today's standards because he refuses to let the "expected application" of the framers limit the "semantic meaning" of the words. He would view the "history and tradition" test as a mechanism to bury the Reconstruction Amendments under the rubble of the antebellum past they were designed to destroy.
