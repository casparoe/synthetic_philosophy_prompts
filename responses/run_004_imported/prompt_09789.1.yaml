answer: |-
  This is a fantastic catch. You have stumbled onto one of the most interesting etymological and conceptual shifts in the history of ethics.

  To answer your main question immediately: **Yes, Article XIV is absolutely calling the concept heresy.** But **yes, the word was also repurposed** by modern philosophy in a way that tries to sidestep the theological trap, even though the trap keeps snapping shut.

  Here is the breakdown of the theological argument, how the word got hijacked by philosophers, and why your skepticism mirrors a very real problem in modern ethics.

  ### 1. The Theological Argument: Why is it "Arrogancy and Impiety"?

  To understand Article XIV, you have to understand what the Church of England was arguing *against*. In the 16th century, the Roman Catholic Church taught the doctrine of the **"Counsels of Perfection."**

  *   **Precepts:** Commands binding on all Christians (e.g., Do not kill, Do not steal). If you break these, you are damned.
  *   **Counsels:** Voluntary acts of extra piety (e.g., vows of poverty, chastity, obedience). If you do these, you earn "extra merit."

  The Catholic theology of the time suggested a "Treasury of Merit." If you did more than God commanded (supererogation), you built up a surplus of goodness. This surplus could theoretically help you, or even be applied to others (the basis of indulgences).

  **The Protestant Objection (Article XIV):**
  The Reformers (Luther, Calvin, and the Anglicans) found this spiritually dangerous for two main reasons, which explains the "arrogancy and impiety" charge:

  1.  **It limits God:** To say you can do *more* than God commands implies God's commandments were incomplete or had a "ceiling." It suggests there is a realm of goodness God forgot to require, which you were smart enough to find.
  2.  **It puts God in debt:** If I do only what is commanded, I am "even" with God. If I do *more*, I have put God in my debt. I have earned leverage over the Creator. This undermines the doctrine of Grace (*Sola Gratia*). If salvation is a free gift, you cannot buy extra credit.

  **The "Unprofitable Servants" Clause:**
  The Article quotes Luke 17:10: *"When ye have done all that is commanded to you, say, We be unprofitable servants."*
  The logic is: You owe God your entire existence. Even if you give away all your money to the poor, you have only given back what was already His. Therefore, it is impossible, by definition, to do "more" than your duty. To claim otherwise is spiritual arrogance.

  ### 2. The Philosophical Repurposing: How did the word survive?

  If the concept is heretical, why do philosophers use it today?

  For a few centuries, "supererogation" was a dirty word in Protestant circles. However, in 1958, the philosopher **J.O. Urmson** published a famous paper titled *"Saints and Heroes."* He needed a word to describe a specific moral intuition, and he raided the theological archives to grab *supererogation*.

  **The Secular Definition:**
  Urmson stripped out the "merit before God" aspect. In modern analytic philosophy, a supererogatory act is defined structurally:
  1.  It is morally good.
  2.  It is **not** morally obligatory (you are not blameworthy for omitting it).
  3.  It is **beyond** the call of duty.

  **Why did they need it?**
  Without this category, ethics becomes too demanding. If giving a kidney to a stranger is a "duty," then anyone who *doesn't* do it is morally wrong. That seems counterintuitive. We want to praise the kidney donor without condemning the non-donor. Supererogation creates a "safe zone" for moral heroism.

  So, to answer your question: **Yes, the word was repurposed.** It went from meaning *"Heretical claim of excess merit that threatens Grace"* to *"Neutral structural category for optional good deeds."*

  ### 3. Does the Old Theological Worry Show Up in Disguise?

  This is where your argument with your friend gets really deep. You were skeptical of the category, and Article XIV suggests you might have been onto something. The theological worry **did** survive, but it shows up in secular guise as **The Problem of Moral Demandingness.**

  Here is how the 1571 argument haunts 2024 ethics:

  **A. The Utilitarian Objection (The "Unprofitable Servant" Argument)**
  Strict Act Utilitarians (like Peter Singer) argue exactly what Article XIV argues: **There is no supererogation.**
  *   **Logic:** If you can save a life without sacrificing anything of moral significance, you *must* do it. If you donate a kidney, you aren't a "hero"; you are just doing what a rational moral agent ought to do.
  *   **The Connection:** Just as the Reformers said, "You owe God everything, so you can't do 'extra'," Utilitarians say, "You owe the Maximization of Goodness everything, so you can't do 'extra'."
  *   **The Worry:** If you accept supererogation (like your friend), are you just letting people off the hook? Is calling kidney donation "supererogatory" just a way for the rest of us to feel okay about being selfish? That is the secular version of "impiety."

  **B. The "Arrogance" of the Agent**
  Article XIV claims supererogation is arrogant. In secular ethics, there is a debate about whether claiming an act is supererogatory creates moral elitism.
  *   If I say, "Donating my kidney is above and beyond," am I implying that morality has a "baseline" that is actually quite low?
  *   Some philosophers argue that labeling things supererogatory creates a two-tiered moral system (Saints vs. Sinners) rather than a universal duty.

  **C. The Coherence Problem (Your Skepticism)**
  You mentioned you "weren't totally sold." Many philosophers agree with you. The biggest problem with supererogation is defining the boundary.
  *   Where does "duty" end and "supererogation" begin?
  *   If I give $10 to charity, is that duty? If I give $1,000, is that supererogatory? If I give $1,000,000, is that saintly?
  *   If the line is blurry, the category might be useless. Some philosophers (like David Heyd) argue supererogation is logically incoherent because if an act is *morally best*, rationality dictates we *should* do it. If we *should* do it, it's a duty. If it's not a duty, why *should* we do it?

  ### Summary

  Your friend is using the **modern philosophical definition**: Supererogation is a necessary category to explain why we praise heroes without blaming regular people.

  You were instinctively leaning toward the **Article XIV / Utilitarian definition**: If morality is real, it makes claims on us. Claiming to do "more than required" implies the requirements were too low, or it allows us to be complacent about suffering we could prevent.

  **The Verdict:**
  The word was definitely repurposed. The Church of England banned it because it threatened **Salvation** (you can't earn your way to heaven). Modern philosophy revived it because it threatens **Sanity** (if everything good is a duty, morality is too demanding to be livable).

  However, the old theological worry remains valid: **Does accepting supererogation allow us to lower the bar of morality too much?** If we classify too much as "optional goodness," we might end up like the "unprofitable servants" who think they've done enough when they haven't. So, while your friend is right that the term exists, your skepticism aligns with a rigorous moral tradition that says: *Be careful calling anything "extra," or you might be underestimating what you actually owe.*
