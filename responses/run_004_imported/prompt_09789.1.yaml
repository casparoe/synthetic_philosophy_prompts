prompt: |-
  Ok so I just spent like an hour arguing with my friend about supererogation - she was making the case that people who go above and beyond duty (kidney donors, whistleblowers who end up losing everything, stuff like that) deserve a special category of moral praise thats different from just "doing the right thing," and i wasn't totally sold. Afterward I was digging around for something completely unrelated and stumbled on Article XIV of the Church of England's 1571 Thirty-Nine Articles, which uses the exact same word but seems to be saying the opposite of what my friend meant. Here's the actual text:

  "Voluntary Works besides, over and above, God's Commandments, which they call Works of Supererogation, cannot be taught without arrogancy and impiety: for by them men do declare, that they do not only render unto God as much as they are bound to do, but that they do more for his sake, than of bounden duty is required: whereas Christ saith plainly, When ye have done all that is commanded to you, say, We be unprofitable servants."

  So this is basically calling the whole idea a heresy? Can you help me unpack the actual argument being made here (why is claiming to have done "more than duty" arrogant/impious to them specifically), and then explain how that connects to the modern philosophical use of "supererogation" my friend was going on about. Did the word just get repurposed at some point, or does the old theological worry actually show up again in disguise as a real problem for the secular version (like, isn't there a whole debate about whether "beyond the call of duty" even makes sense)?
