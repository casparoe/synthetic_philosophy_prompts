          *   *Nuance:* Hobbes thought he *could* square the circle. Lindemann proves he *couldn't*. This hurts his specific *claim* to knowledge, but not necessarily his *theory* of knowledge. However, if his theory relies on the idea that we can construct *any* coherent figure we define, the impossibility proof limits the scope of construction. But Hobbes's core point is about *certainty of consequence*, not necessarily the truth of the external world.
