prompt: |-
  I'm a student representative on my high school's grant committee, deciding how to spend a one-time $40,000 gift earmarked for "improving academic outcomes"; our only guidance is a bylaw requiring that funds "serve the interests of the student body as a whole" — a phrase nobody has ever defined further. One faction wants to fund a selective STEM accelerator (extra mentorship, competition coaching, new equipment) for whichever twenty students have the highest GPA, arguing that the resulting scholarships and recognition will attract more resources to the school over time, benefiting everyone eventually. The other wants the same money split evenly across tutoring hours open to any student who signs up. Since none of us on the committee knows whether we'll personally land in that top twenty, draft the memo I'll bring to Monday's vote: recommend one option using Rawls's veil of ignorance and difference principle rather than generic appeals to fairness, and give the accelerator's "rising tide" argument the strongest version you can before weighing it against the alternative.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Student Representative on a High School Grant Committee.
      *   **Task:** Draft a memo for Monday's vote regarding a $40,000 one-time gift.
      *   **Constraint 1 (Budget):** $40,000.
      *   **Constraint 2 (Purpose):** "Improving academic outcomes."
      *   **Constraint 3 (Bylaw):** Funds must "serve the interests of the student body as a whole" (undefined).
      *   **Option A:** Selective STEM Accelerator (Top 20 GPA students). Argument: "Rising tide" (scholarships/recognition attract future resources).
      *   **Option B:** Open Tutoring Hours (Split evenly, open to all who sign up).
      *   **Philosophical Framework:** Use John Rawls's *Veil of Ignorance* and *Difference Principle*. Avoid generic appeals to fairness.
      *   **Specific Instruction:** Give the Accelerator's "rising tide" argument its strongest version *before* weighing it against the alternative.
      *   **Context:** Committee members don't know if they will be in the top 20.

  2.  **Deconstruct the Philosophical Framework (Rawls):**
      *   *Veil of Ignorance:* Decision-makers should choose principles of justice without knowing their own place in society (or in this case, their academic standing/GPA). This removes bias and self-interest.
      *   *Difference Principle:* Social and economic inequalities are only justified if they benefit the least advantaged members of society. Inequality is okay *only if* it makes the worst-off better off than they would be under strict equality.

  3.  **Analyze Option A (STEM Accelerator) through Rawls:**
      *   *Inequality:* It creates a distinct advantage for the top 20 (who are already advantaged by high GPA).
      *   *Justification (Difference Principle):* Does this inequality benefit the *least* advantaged students?
      *   *The "Rising Tide" Argument:* This is the trickle-down theory. If the top students win big, the school gets famous, gets more grants, better teachers, etc.
      *   *Rawlsian Critique:* Rawls is skeptical of trickle-down. The burden of proof is on showing the *least* advantaged gain *more* than they would under an equal distribution. If the bottom 50% get nothing directly, does the indirect benefit outweigh the direct loss of $40k spent elsewhere?

  4.  **Analyze Option B (Open Tutoring) through Rawls:**
      *   *Equality:* Access is open to all.
      *   *Benefit to Least Advantaged:* Students struggling academically (the "least advantaged" in this context) get direct support to improve outcomes.
      *   *Alignment:* This seems to fit the Difference Principle better *if* the tutoring actually helps them more than the indirect benefits of Option A.

  5.  **Drafting Strategy - Section by Section:**
      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the decision, the constraints, and the philosophical lens (Rawls). Acknowledge the uncertainty (Veil of Ignorance).
      *   **The Case for the Accelerator (Steel-manning):** Present the "Rising Tide" argument as strongly as possible. Focus on long-term institutional gain, prestige, and the potential for future resources that *could* help everyone. Acknowledge that under the Veil, one might gamble on being in the top 20 *if* the payoff is huge.
      *   **The Rawlsian Analysis (The Pivot):** Apply the Veil of Ignorance. We don't know our GPA. Would we risk being in the bottom 80% for a chance at the top 20?
      *   **Applying the Difference Principle:** This is the crux. Does the inequality (Option A) maximize the minimum position? Likely not. The direct intervention (Option B) lifts the floor more reliably than the speculative ceiling (Option A).
      *   **Recommendation:** Vote for Option B (Tutoring).
      *   **Conclusion:** Reiterate commitment to the bylaw ("student body as a whole") interpreted through justice as fairness.

  6.  **Refining the Tone:**
      *   Needs to be persuasive but respectful.
      *   Needs to sound like a high school student (intelligent, engaged) but not overly academic/jargon-heavy without explanation.
      *   Must strictly follow the instruction to use Rawls, not just "fairness."

  7.  **Drafting - Key Considerations & Self-Correction:**
      *   *Correction:* Make sure I don't just say "Option B is fairer." I need to explicitly explain *why* Rawls leads there.
      *   *Correction:* Ensure the "Rising Tide" argument is strong. Don't strawman it. It needs to sound like a legitimate utilitarian or meritocratic argument before I dismantle it with Rawls.
      *   *Check:* Did I address the bylaw? Yes, "interests of the student body as a whole."
      *   *Check:* Did I mention the uncertainty? Yes, "none of us knows..."

  8.  **Final Polish:** Check the flow. Ensure the transition from the "Rising Tide" argument to the Rawlsian critique is sharp. (Self-Correction: Make sure to define the "least advantaged" in the context of a high school—likely those struggling academically, not necessarily financially, though they often overlap. Let's stick to academic standing as the metric since the grant is for "academic outcomes".)

  9.  **Final Review against constraints:**
      *   $40k mentioned? Yes.
      *   Rawls/Veil/Difference Principle used? Yes.
      *   Strongest version of Accelerator argument? Yes.
      *   Memo format? Yes.

