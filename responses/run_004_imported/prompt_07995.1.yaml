answer: |-
  Good morning. Faculty, families, and the Class of 2024.

  It is an honor to stand here. When the department asked me to speak, they gave me one instruction: "Don't tell them to follow their passions." I think that's wise. Passion is volatile. Instead, I want to talk about a constraint. I want to talk about a bug in the code of intelligence that you have all studied, and that I now fight for a living.

  I want to talk about the Frame Problem.

  For the families in the audience: In 1969, John McCarthy and Patrick Hayes identified a paradox in artificial intelligence. If you program a robot to move a box from point A to point B, how do you tell it what *doesn't* change? The box moves. But does the color of the wall change? Does the time of day change? Does the number of wheels on the wagon change?

  To a human, this is obvious. To a computer, unless you explicitly state that the wall color remains invariant, it doesn't know that. And since there are infinite facts about the world that *don't* change, you cannot list them all. You run into a combinatorial explosion. The robot freezes, trying to calculate the side effects of its own existence.

  In the 80s, Jerry Fodor and Daniel Dennett turned this into a philosophical war over "relevance." Dennett told a famous story about a robot sent to retrieve a battery from a room with a bomb. The first robot deduced that pulling the wagon out would move the battery. But it didn't deduce that the bomb was on the wagon. It blew up. The next robot was programmed to consider all side effects. It sat there calculating the millions of things that *wouldn't* change until the bomb went off.

  I mention this because I work on AI agents. And lately, half our incident reports look like Dennett's robot. We tell an agent to fix one line of code, and it decides forty unrelated files also need changing. Why? Because nothing told it what to leave alone. Nothing defined the frame.

  For the last four years, you have lived inside a solved Frame Problem.

  This department, this university, built the frame for you. The syllabus told you what was relevant. The grading rubric told you what could be ignored. The requirements told you what invariants to hold steady. You didn't have to wonder if studying for this exam mattered, or if sleeping mattered, or if your mental health mattered. The structure decided relevance for you. You were free to think, because the boundaries of "what counts" were already drawn.

  But when you walk out of these doors, the frame vanishes.

  You are entering the open world. And the danger isn't that you won't know what to change. The danger is that you won't know what to *keep*.

  In your careers, you will be pressured to optimize everything. Change your location for a job. Change your hours for a promotion. Change your values for a network. If you treat your life like an unconstrained optimization problem, you will be like that second robot. You will compute every possible side effect of every decision until you are paralyzed. Or worse, you will be like the agent at my work: you will change forty things you didn't mean to, because you never specified what was sacred.

  So, how do you solve the Frame Problem of a human life?

  You cannot compute relevance from the bottom up. You cannot look at every fact in the universe and decide if it matters. As Fodor hinted, relevance isn't calculated; it's felt. It is guided by commitment.

  You have to write your own frame axioms.

  You have to decide, in advance, what is invariant. "I do not compromise on X." "I do not trade Y for Z." When you have those constraints, the world suddenly becomes computable. You don't have to evaluate every opportunity. If it violates the frame, it is irrelevant. You are free to ignore it.

  This is the gift of a Cognitive Science education. You know that intelligence is not just about processing power. It is about filtering. It is about knowing what to ignore.

  The CS majors here know that without a frame, the system crashes. The liberal arts majors here know that without a story, the life has no shape. You are both right.

  So, my advice is not to follow your passion. My advice is to define your frame. Decide what stays the same when everything else moves. Decide what is on the wagon with the bomb, and what is not.

  It will be hard. There will be days when the world demands you update your axioms. That is learning. But do not let the world write them for you. If you don't define relevance, your inbox will define it. Your boss will define it. The algorithm will define it.

  Go out there and build a world where you know what matters. Go out there and tell the universe what to leave alone.

  Congratulations.
