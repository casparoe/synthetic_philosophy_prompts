prompt: |-
  So I somehow ended up on the little committee that decides what our union's dental plan covers (definitely not a dentist, they just needed a warm body off the floor), and right now we're fighting about wisdom teeth before the new plan year locks in next month. Currently the plan automatically pays to pull everybody's wisdom teeth in their twenties, because our consulting dentist says they're basically leftover teeth from back when human jaws were bigger and we don't need them anymore. But my cousin's came in perfectly straight and she's been chewing on hers fine for fifteen years, and it feels off to yank out a tooth thats actually doing its job just because its "evolutionarily pointless" - those feel like two different questions to me and I can't quite explain why. Can you draft the memo I need to bring to the committee? It has to actually recommend something (keep automatic removal, switch to case-by-case review, or some other option), and it needs to take our dentist's reasoning seriously instead of just waving it away.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Union committee member (non-dentist, layperson).
      *   **Task:** Draft a memo for the committee regarding the dental plan's coverage of wisdom teeth extraction.
      *   **Current Policy:** Automatic coverage for extraction in twenties (based on consultant's evolutionary/functional redundancy argument).
      *   **User's Concern:** Anecdotal evidence (cousin) suggests some wisdom teeth are functional and healthy. Feels wrong to remove functional teeth based solely on evolutionary theory.
      *   **Requirements:**
          *   Must recommend a specific course of action (Keep, Change, or Other).
          *   Must take the consulting dentist's reasoning seriously (not dismissive).
          *   Must be professional, persuasive, and suitable for a union committee context.
          *   Deadline: Next month (plan year lock-in).

  2.  **Determine the Best Recommendation:**
      *   *Option A: Keep Automatic Removal.* Ignores the user's valid concern about unnecessary surgery and cost. Risks member backlash if people are forced to remove healthy teeth.
      *   *Option B: No Coverage.* Too extreme, ignores legitimate medical need for impaction/infection.
      *   *Option C: Case-by-Case Review (Medical Necessity).* This is the industry standard for most modern plans. It balances the dentist's concern (preventing future issues) with the member's right to keep healthy, functional teeth. It saves money on unnecessary surgeries and reduces member risk.
      *   *Decision:* Recommend shifting from "Automatic/Prophylactic" to "Medically Necessary/Criteria-Based."

  3.  **Address the Dentist's Reasoning:**
      *   The dentist argues evolutionary redundancy (vestibular organs).
      *   *Counter-argument:* While evolutionarily vestigial *on average*, individually they can be functional.
      *   *Bridge:* Acknowledge the high rate of impaction/issues (validating the dentist) but argue that *universal* extraction is overtreatment. The goal is health, not evolutionary purity.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly (reviewing wisdom teeth coverage before lock-in).
      *   **Current Situation:** Describe the existing policy (automatic extraction in 20s) and the rationale (consultant's evolutionary/functional argument). *Crucial: Validate this rationale as well-intentioned and based on general statistical risk.*
      *   **The Issue/Concern:** Introduce the counterpoint. Not all wisdom teeth are problematic. Unnecessary surgery carries risks (nerve damage, cost, recovery). Mention the "functional tooth" aspect.
      *   **Analysis:** Compare the two approaches.
          *   *Automatic:* High cost, high member burden, potential overtreatment.
          *   *Case-by-Case:* Targeted, evidence-based, aligns with broader industry standards.
      *   **Recommendation:** Propose the shift to "Medical Necessity" criteria. Define what that looks like (impaction, decay, cyst, crowding).
      *   **Implementation:** How to handle the transition (grandfathering? new assessments?).
      *   **Closing:** Call to action (vote/approve).

  5.  **Refining Tone:**
      *   Needs to be respectful of the dentist's expertise but firm on fiduciary and member welfare duties.
      *   Avoid emotional language ("feels off") and use policy language ("clinical indications," "risk-benefit analysis").
      *   Ensure it sounds like it comes from a union rep (focused on member benefit and cost-effectiveness).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I dismiss the dentist too much?
      *   *Fix:* Add a paragraph explicitly acknowledging that impaction rates *are* high, so the dentist isn't "wrong," just applying a broad brush.
      *   *Critique:* Is the recommendation specific enough?
      *   *Fix:* List specific criteria for extraction (e.g., partial eruption, decay, damage to adjacent teeth).
      *   *Critique:* Is the union angle clear?
      *   *Fix:* Emphasize member choice and avoiding unnecessary medical procedures.

  7.  **Final Polish:** Check formatting, clarity, and ensure the "evolutionary" argument is addressed diplomatically. (e.g., "While the evolutionary perspective explains prevalence of issues, it does not dictate individual pathology.")

  8.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Union Dental Plan Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Wisdom Teeth Extraction Coverage Policy

  **Purpose**
  With the new plan year locking in next month, this memo reviews our current coverage policy regarding third molar (wisdom teeth) extraction. The goal is to ensure our plan balances preventative health, fiscal responsibility, and the medical autonomy of our members.

  **Current Policy & Rationale**
  Currently, the plan automatically covers the extraction of wisdom teeth for members in their twenties. This policy is based on guidance from our consulting dentist, who argues that third molars are evolutionarily vestigial. The rationale is that human jaws have reduced in size over time, making these teeth functionally redundant and highly prone to future complications (impaction, infection, crowding). The current policy operates on a preventative model: remove the teeth before they become problematic.

  **Assessment of Current Policy**
  While the consulting dentist's data regarding the *high prevalence* of wisdom tooth complications is statistically sound, the current policy applies a population-level generalization to individual cases.

  1.  **Clinical Variance:** A significant minority of the population possesses sufficient jaw density and alignment to accommodate third molars without pathology. In these cases, the teeth are functional, hygienic, and contribute to chewing efficiency.
  2.  **Surgical Risk:** Extraction is a surgical procedure with inherent risks, including nerve damage, dry socket, infection, and recovery time. Subjecting members to surgical risk for teeth that are currently healthy and functional contradicts the medical principle of *primum non nocere* (first, do no harm).
  3.  **Fiscal Impact:** Automatic extraction drives higher claim costs than a targeted approach. By covering surgeries that may not be medically necessary, we increase premiums without a corresponding increase in health outcomes for those specific members.

  **The Evolutionary Argument vs. Individual Health**
  We must take the consultant's reasoning seriously: evolutionarily, these teeth are prone to failure. However, "evolutionarily pointless" is not synonymous with "medically contraindicated." A tooth can be vestigial in an evolutionary context yet fully functional in a clinical context. Our insurance plan should treat pathology, not evolutionary history. If a tooth is not causing damage, decay, or crowding, its evolutionary origin should not dictate its removal.

  **Recommendation**
  I recommend the Committee **vote to shift from automatic coverage to a "Medical Necessity" coverage model**, effective the upcoming plan year.

  Under this model, extraction is covered when specific clinical criteria are met, rather than based on age alone. This aligns our plan with the broader industry standard and respects the variance in member dental anatomy.

  **Proposed Criteria for Coverage**
  Extraction would be fully covered when documentation supports one or more of the following:
  *   **Impaction:** Teeth that are unable to fully erupt due to lack of space or obstruction.
  *   **Pathology:** Evidence of cysts, tumors, or infection associated with the tooth.
  *   **Damage:** Decay that cannot be restored, or damage to adjacent second molars (root resorption).
  *   **Orthodontic Necessity:** Documented crowding that compromises overall dental alignment.

  If the teeth are fully erupted, functional, hygienic, and asymptomatic, extraction would not be covered (though routine cleaning/exam of those teeth would remain covered).

  **Implementation & Transition**
  To ensure fairness during the transition:
  1.  **Pre-Authorization:** Require pre-authorization for extractions to verify criteria are met.
  2.  **Grandfathering:** Members who have already received a formal treatment plan from their provider under the old rules prior to [Date] may proceed under current coverage to avoid disrupting scheduled care.

  **Conclusion**
  This shift does not deny care to those who need it; it ensures care is provided to those who need it. It respects the consultant's concern regarding high risk while acknowledging that risk is not certainty. By moving to a Medical Necessity model, we reduce unnecessary surgical risk for our members and ensure plan funds are directed toward essential health outcomes.

  I request this item be added to the agenda for our next meeting for a final vote.
