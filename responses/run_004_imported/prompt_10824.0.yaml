          *   *Conclusion on Classification:* Molina would call ML "highly sophisticated *Scientia Naturalis* regarding human psychology, mixed with *Scientia Libera* regarding past data." It is *not* Middle Knowledge.
      *   *Section 2: The Counterfactual Gap.*
          *   This is the technical killer. ML cannot evaluate $P(Y|do(X), C)$ for a world $C$ that never existed. It interpolates/extrapolates from existing manifolds.
