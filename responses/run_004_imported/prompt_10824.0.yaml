      *   *Fix:* Emphasize that Natural Knowledge is about *possibilities* (Can X do Y?), Middle is about *conditionals* (If X, then Y?). ML predicts *actuals* based on *past actuals*.
      *   *Check:* Did I answer the "threat" question?
