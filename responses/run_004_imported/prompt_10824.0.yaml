      *   *Conclusion:* The analogy fails structurally. ML is a tool of observation; Middle Knowledge is a metaphysical precondition. But the *success* of ML does raise uncomfortable questions about how "free" the "free choices" actually are, which Molina would have to concede is a risk of empirical psychology, not a refutation of his theology.

  7.  **Refining the Tone:**
