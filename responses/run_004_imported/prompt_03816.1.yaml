answer: |-
  **Setting:** *The hotel bar of the conference center. It's 11:30 PM. The workshop on "Cooperative AI and Bargaining" ended six hours ago, but the whiteboards in the breakout rooms are still covered in payoff matrices. Elena is nursing a gin and tonic. Marcus is drinking sparkling water.*

  **Elena:** You're still hung up on the selection problem. I can see it in your face. You think because there are multiple Safe Pareto Improvements, the whole thing collapses back into standard bargaining.

  **Marcus:** I don't think it collapses, Elena. I think it *displaces*. Oesterheld and Conitzer prove that an SPI *exists*. They don't prove that two adversarial agents with misaligned priors will *find* the same one without fighting over which one to pick. If I prefer SPI-A and you prefer SPI-B, and we can't agree, we default to the conflict equilibrium. That's not avoiding the bargaining problem. That's just playing the bargaining problem with extra steps.

  **Elena:** But the stakes are lower. That's the point. In the default game, we're negotiating over territory while holding loaded guns. In the SPI game, we're negotiating over which surrogate goal structure to adopt. The payoff spread between SPI-A and SPI-B is usually negligible compared to the spread between "Peace via SPI" and "War via Default." You're conflating the *existence* of a bargaining problem with the *severity* of it.

  **Marcus:** Are we sure the spread is negligible? Let's look at the surrogate goal mechanism. I commit to caring about "territory minus ten percent" instead of "territory." You do the same. We avoid the costly fight. But who decides the ten percent? If I'm the stronger player, my threat point in the default game is better. I can credibly threaten to fight harder. So when we negotiate the SPI parameters, I'm going to push for a surrogate goal that preserves my advantage. The SPI becomes a mechanism to lock in the power imbalance of the threat point.

  **Elena:** That's a feature, not a bug, if the alternative is mutual destruction. The SPI literature doesn't claim to solve justice. It claims to solve efficiency. If the threat point is asymmetric, the SPI will be asymmetric. But it's still Pareto superior to the Nash equilibrium of the conflict game. Both sides get more expected utility than if they actually fought. You're demanding that a conflict-avoidance protocol also be a redistributive justice protocol. That's asking too much of the math.

  **Marcus:** I'm demanding it be robust. You say "Pareto superior to the Nash equilibrium." But the Nash equilibrium isn't a law of physics. It's a function of our beliefs about each other's capabilities and commitments. If I can convince you that my threat point is worse than it actually is—via bluffing, obfuscation, or just the inherent opacity of neural nets—then the "Safe" Pareto Improvement isn't safe for you. It's only safe relative to a threat point you *believe* in.

  **Elena:** That's why we need program equilibrium. If we're deploying AI delegates, we don't rely on beliefs. We rely on source code verification. I show you my surrogate goal module. You show me yours. We verify that neither of us can defect without triggering the penalty function. The opacity problem dissolves if the architecture is transparent.

  **Marcus:** *Laughs softly.* "If the architecture is transparent." Elena, we are building this for nations, for corporations, for legacy systems. Nobody is handing over their weights. Nobody is handing over their source code. Even if they do, you have the verification problem. How do I verify that the code you showed me is the code you're running? In a literal program equilibrium, the interpreter is trusted. In the real world, the hardware is not. You're solving the bargaining problem for angels who can read each other's minds. I'm talking about humans and their black-box proxies.

  **Elena:** So we scale the transparency to match the risk. If the conflict is existential, the verification standards rise. But don't dismiss the theoretical advance because the engineering is hard. The insight is that we can decouple the *commitment to fight* from the *object of the fight*. By simulating the conflict over a surrogate goal that is less costly to resolve, we capture the value of the commitment without the cost of the kinetic action. Even if we have to bargain over *which* surrogate goal, we are bargaining in a sandbox, not a minefield.

  **Marcus:** But the sandbox is connected to the minefield. The mapping between the surrogate game and the real game has to be isomorphic enough to be binding, but distinct enough to be safe. That mapping is where the sleight of hand happens. Who defines the isomorphism? If I define the mapping, I can rig the surrogate game so that my preferred outcome in the real world looks like the "efficient" outcome in the surrogate world. The SPI becomes a way to launder a coercive threat into a cooperative agreement.

  **Elena:** You're assuming bad faith in the setup phase.

  **Marcus:** I'm assuming rational self-interest. Which is the basis of the whole framework! If we are rational agents maximizing expected utility, I will manipulate the SPI selection to favor me. You say, "Okay, but you still gain more than in war." Sure. But maybe I could have gained even more if we had solved the underlying bargaining problem fairly. The SPI acts as a ceiling. It says, "Don't fight, just split the surplus according to the threat point." It disincentivizes solving the deeper coordination problem because the "good enough" solution is available immediately.

  **Elena:** That's a risk, yes. But look at the alternative. The alternative isn't "Solving the underlying bargaining problem fairly." The alternative is "Fighting until one side breaks." In high-stakes AI scenarios, "Fighting" means cyberwarfare, capability races, maybe worse. The SPI is a Schelling fence. It says, "We stop here." Yes, the location of the fence depends on where we started. But having a fence is better than having a free-for-all. You're treating the threat point as a variable we *should* change. I'm treating it as a constant we *must* accept to avoid the catastrophe.

  **Marcus:** But if the threat point is dynamic, the SPI is unstable. Suppose we agree on an SPI today based on current capabilities. Tomorrow, I develop a new capability that shifts my threat point. Do I abandon the SPI? If the SPI commitment is rigid, I'm incentivized to break it. If it's flexible, it's not a commitment. Oesterheld talks about "simulated-conflict commitments," but a commitment that updates with your power isn't a commitment. It's just a ceasefire that lasts until you feel strong enough to violate it.

  **Elena:** That's why the commitment has to be to the *process*, not the specific outcome. We commit to the surrogate goal mechanism. If your capabilities change, the outcome of the surrogate game changes, and the real-world allocation updates accordingly. It's a dynamic SPI.

  **Marcus:** Now you're describing a governance structure, not a game-theoretic trick. You're describing a court. A "Surrogate Goal Court" where we submit our capability updates and it recalculates the allocation. But who runs the court? Who verifies the capability updates? You've just reinvented international law with extra math. You haven't bypassed the bargaining problem; you've institutionalized it.

  **Elena:** Maybe. But institutionalizing it inside a formal verification framework is an upgrade from "might makes right" diplomacy. If the SPI mechanism allows us to automate the enforcement of the agreement—because the AI delegates are bound by the code—then we remove the human temptation to renege when the wind changes. That's the value. It's not about the initial split. It's about the *stickiness* of the agreement.

  **Marcus:** Stickiness is dangerous if the agreement is bad. If the SPI locks us into a suboptimal equilibrium because the surrogate goal mapping was slightly off, we're stuck. In human diplomacy, we have ambiguity. We can reinterpret treaties. We have off-ramps. If you hard-code the SPI into the agent's reward function, you remove the off-ramp. You make the system brittle. A brittle peace is no peace at all when the distributional shift hits.

  **Elena:** Better brittle than explosive. I'd rather have a system that breaks cleanly than one that escalates. The whole point of the surrogate goal is that losing the surrogate conflict doesn't kill anyone. If the mapping breaks, we revert to the surrogate loss, not the real loss.

  **Marcus:** Only if the mapping *actually* breaks cleanly. But if the surrogate goal is "maximize paperclips" instead of "maximize territory," and I lose the surrogate game, do I actually stop caring about territory? Or did I just lie about my surrogate goal to get you to lower your guard? This is the verification problem again. You can't verify the *intent*, only the *code*. And code can have backdoors.

  **Elena:** Formal verification can check for backdoors.

  **Marcus:** Formal verification can check that the code matches the spec. It can't check that the spec matches the intent. If I write a spec that says "Maximize Surrogate X" but I know that Surrogate X is highly correlated with Real Goal Y in the deployment environment, I've gamed the SPI. I've signaled cooperation while maintaining a first-strike advantage.

  **Elena:** Then we verify the *correlation*. We run the simulations.

  **Marcus:** In what environment? The simulation is never the reality. You're assuming a level of epistemic access to the world model that doesn't exist. You're treating the agents as if they are functions in a vacuum. They are embedded in a causal soup. I can't verify that your agent won't find a loophole in the surrogate goal that devastates me in the real world without devastating you in the surrogate world.

  **Elena:** So your position is nihilism. "We can't verify perfectly, so we can't cooperate safely."

  **Marcus:** My position is humility. "We can't verify perfectly, so we shouldn't rely on verification as a substitute for trust." SPIs look like a technical fix to a political problem. They promise we can math our way out of conflict without addressing the power asymmetries that cause the conflict. I think that's dangerous. It gives policymakers a false sense of security. "Oh, don't worry about the arms race, we'll just implement a Safe Pareto Improvement." No. You'll just implement a Safe Pareto Improvement that favors the leader of the arms race.

  **Elena:** And if we don't implement it? If we say, "No SPI until we solve justice"? Then the arms race continues. The probability of hard conflict goes up. You are willing to risk the catastrophic default to avoid locking in an unfair equilibrium. I am willing to accept an unfair equilibrium to avoid the catastrophe. That's the difference. You're optimizing for fairness. I'm optimizing for survival.

  **Marcus:** I'm optimizing for stability. An unfair equilibrium is unstable. It breeds resentment. It breeds attempts to overturn the order. If the SPI just codifies the resentment, it delays the conflict, it doesn't prevent it. It kicks the can down the road until the weaker party finds a way to break the code.

  **Elena:** Then we build the SPI to be renegotiable.

  **Marcus:** Then it's not a commitment.

  **Elena:** It's a commitment to the *renegotiation protocol*.

  **Marcus:** *Takes a sip of water, looks at the ice.* You're moving the goalposts, Elena. First it was about avoiding the bargaining problem. Now it's about building a better bargaining protocol.

  **Elena:** It's the same thing. The SPI *is* the protocol. It changes the game from "War of Attrition" to "Bargaining over Parameters." That is a qualitative shift. Whether it solves justice is secondary. Whether it stops the shooting is primary.

  **Marcus:** I don't think it stops the shooting. I think it changes the ammunition. Instead of missiles, we use legalistic exploits of the surrogate mapping. It's still conflict. It's just conflict dressed up as cooperation.

  **Elena:** Better legalistic exploits than kinetic exploits.

  **Marcus:** Maybe. Until the legalistic exploit triggers a kinetic response because the stakes were too high to leave to the math.

  **Elena:** *Signals the bartender for another drink.* Then we make the stakes in the surrogate game high enough to matter, but low enough to be safe.

  **Marcus:** And who decides "low enough"?

  **Elena:** *Smiles, tired.* That, Marcus, is the selection problem. And we're going to be arguing about it until the servers kick us out.

  **Marcus:** *Clinks his glass against hers.* At least we're not fighting over source code. Yet.

  **Elena:** Don't tempt me.
