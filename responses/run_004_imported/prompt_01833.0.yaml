answer: |-
  This is a fantastic tension to grapple with, and you are right to sense that the standard bioethical appropriation of Aristotle (often used to prop up Whole-Brain Death via "integrative unity") glosses over his explicit cardiocentrism.

  If you drop Aristotle into the modern ICU, his system commits him to **Circulatory-Respiratory Death**, and he would be forced to reject Whole-Brain Death as a metaphysical category error. He cannot simply "update" the anatomy without breaking the hylomorphic link between the soul's specific powers and the specific material qualities of the organ that houses them.

  Here is the defense of that reading, based on the internal logic of *De Anima*, *De Juventute*, and *De Partibus Animalium*.

  ### 1. Vital Heat is the *Sine Qua Non* of the Soul
  In *On Youth and Old Age*, Aristotle is explicit: life is the presence of innate heat (*symphyton thermon*), and death is its extinguishment. Crucially, this heat is not just a byproduct of metabolism; it is the *instrumental vehicle* of the soul. The soul uses the pneuma (breath/spirit) and vital heat in the blood to enact its capacities.

  For Aristotle, the heart is the *arche* (source/origin) of this heat. The brain is explicitly *cold* and *bloodless* (in his anatomy); its teleological function is to cool the heart to prevent it from overheating.
  *   **The Implication:** If you declare a patient "dead" because their brain is gone but their heart is pumping, you are declaring that a furnace is "off" because the radiator is broken, even though the fire is still burning. For Aristotle, as long as the heart is generating vital heat and circulating blood (the vehicle of the nutritive soul), the *form* is still actualizing the *matter*. The organism is still a unity. To say otherwise is to privilege the cooling mechanism over the generative source.

  ### 2. The Hierarchy of Souls Prevents "Higher-Brain" Death
  Aristotle would dismiss Higher-Brain (cortical) death criteria immediately. His psychology is cumulative: you cannot have a rational soul without a sensitive soul, and you cannot have a sensitive soul without a nutritive soul.
  *   **The Implication:** A patient in a persistent vegetative state retains the nutritive soul (growth, metabolism, reproduction at the cellular level). For Aristotle, this is a living animal, even if the "rational" capacity is in abeyance or the "sensitive" capacity is impaired. Death requires the cessation of the *foundational* capacity (nutrition/growth), which is cardiac-mediated. Therefore, Higher-Brain criteria are insufficient for death.

  ### 3. Why He Can't Just "Update" to Whole-Brain Death
  The tempting move for the modern Aristotelian is to say: "Okay, Aristotle got the anatomy wrong. The brain is the *actual* integrator. So we keep the metaphysics (integration = life) but swap the organ (brain = heart)."
  **This fails for two reasons:**

  **A. Material Causality Matters in Hylomorphism**
  Aristotle is not a functionalist in the modern computational sense. The soul is the form *of this specific body*. The material qualities of the organ are part of the definition of its function. The heart is the *arche* because it is hot, bloody, and pulsatile. The brain is phlegmatic and cool. You cannot move the "seat of the soul" to a cold, bloodless organ without changing the *kind* of soul it is. If the soul is essentially "that which heats and moves," and the brain does not heat or move itself, the brain cannot house the soul's essence.

  **B. The "Common Sense" Location**
  You mentioned the "common sense" (*sensus communis*). Modern neurocentrism assumes this is cortical/brainstem. Aristotle locates it in the heart. He argues that we perceive with the heart, and the brain merely modulates the sensation. If the "unifying center" of perception is materially constituted by cardiac tissue, then the loss of the brain does not destroy the unifying center. It merely destroys the coolant.
  *   **The Bullet:** Aristotle must accept that a "brain-dead" body (with a beating heart) is still a *living organism*, albeit a damaged one. It has lost its cooling system and its higher sensory processing, but it retains its substantial form because the *arche* of movement and nutrition persists.

  ### 4. Alignment with Shewmon (and the Rejection of UDDA)
  This reading aligns Aristotle with Alan Shewmon's critique of the Uniform Determination of Death Act (UDDA). Shewmon argues that "somatic integration" (the marker of life) is maintained by hormones and cardiac circulation, not the brain. He uses Aristotelian-Thomistic metaphysics to argue that brain-dead bodies on ventilators are living organisms.
  *   If Aristotle were here, he would agree with Shewmon. The "integrative unity" of the body comes from the blood and heat distributed by the heart, not the electrical signals of the brain. The brain is a peripheral organ (in the literal sense: *around* the center), not the central one.

  ### The Verdict
  Aristotle is committed to **Circulatory-Respiratory Death**.

  He cannot detach from his physiology because his metaphysics is *embodied*. To move the soul to the brain is to become a Platonist (treating the body as a disposable vessel for the mind). Aristotle insists the soul is the actuality of the *organic* body. Since the heart is the first organ to form and the last to die, and the source of the heat that defines life, its cessation is the only moment the form truly separates from the matter.

  **The Cost:** He has to accept that "brain death" is not death. It is a catastrophic injury to the cooling system and sensory apparatus, but as long as the heart beats, the "human animal" persists. He bites the bullet: modern medicine is mistaking the loss of *personhood* (or regulatory control) for the loss of *life* (substantial form). For Aristotle, you are dead when your fire goes out, not when your thermostat breaks.
