answer: |-
  You are in a very common parenting trap, and your instincts are telling you the truth: the current system isn't working, but your father's solution isn't the answer either. You are stuck between a transactional approach that feels like bribery and an authoritarian approach that feels like abuse.

  There is a third path. To find it, we need to diagnose exactly what is going wrong with the current dynamic, evaluate the "kernel of truth" in your father's advice, and look at what child development research suggests actually builds responsibility.

  ### 1. What is going wrong? (The Transaction Trap)
  You have inadvertently turned homework into a business deal. In psychology, this is known as the **overjustification effect**. When you reward someone for doing a task they should arguably do anyway (like learning), their internal motivation decreases. They stop asking, "What am I learning?" and start asking, "What am I getting?"

  *   **The Reward:** Screen time turns homework into a chore to be endured, not a responsibility to be owned.
  *   **The Punishment:** Canceling a weekend outing is a "nuclear option." It is disproportionate to the "crime" (not doing math problems). This creates high anxiety and resentment, turning you into the enemy rather than the supporter.
  *   **The Power Struggle:** At ten years old, your son is developmentally driven to seek autonomy. By micromanaging his work and his body (the coat), you are triggering his resistance. He cannot control the homework load, so he controls *when* and *if* he does it. That is where his power lies.

  ### 2. Is your father onto something?
  Your father is operating from an **Authoritarian** model (high demands, low warmth), while you have drifted into a **Permissive/Transactional** model (low demands, high negotiation).

  He is right about one thing: **Children need clear authority and boundaries.** When you negotiate or threaten, you signal that the rules are up for debate. His generation often achieved compliance through fear, which looks like "respect" in the short term.

  However, he is wrong about the *method* and the *outcome*.
  *   **Spanking:** Decades of research show corporal punishment increases aggression, anxiety, and antisocial behavior. It teaches children to obey when the punisher is watching, but not to make good choices when alone.
  *   **The Coat:** Forcing a child to be cold to "toughen them up" is about control, not resilience. Real resilience comes from experiencing natural consequences (e.g., feeling chilly and deciding next time to wear a coat), not imposed discomfort.

  So, your father is right that you need more structure, but wrong that fear is the glue that holds it together.

  ### 3. The Solution: Authoritative Parenting
  The goal is to move toward an **Authoritative** style (high demands, high warmth). This means holding firm boundaries without being punitive or controlling. You want to shift from being his *manager* to being his *consultant*.

  Here is how to break the cycle:

  **A. End the Transaction**
  Stop paying for homework. Screen time should be a baseline expectation for a weekday, not a bonus.
  *   *Script:* "I realize I've made homework feel like a job I hire you to do. That's on me. From now on, homework is just part of being a student, like brushing teeth is part of hygiene. We aren't going to bargain about it anymore."
  *   *Expect Pushback:* He will whine. Hold the line calmly. "I understand you're upset, but the answer is no."

  **B. Use Natural Consequences, Not Punishments**
  Canceling a weekend outing is a punishment (it hurts him to make him pay). A natural consequence is directly related to the behavior.
  *   *The Shift:* If he doesn't do his homework, he goes to school unprepared. He faces the teacher's feedback. That is uncomfortable, but it is *his* discomfort, not yours.
  *   *Your Role:* Do not save him. Do not write the excuse note. If the school contacts you, say, "We are working on a routine at home, but he needs to learn to manage his assignments."

  **C. Restore Autonomy (The Coat and The Schedule)**
  A ten-year-old needs to practice decision-making.
  *   **The Coat:** Let him wear what he wants. If he is cold, he learns to dress warmer next time. If he is hot, he learns to dress lighter. This is low-stakes practice for high-stakes decisions later.
  *   **The Homework:** Instead of "Sit down now," try: "Homework needs to be done before dinner. You can choose to do it right after school or after a snack. Which do you prefer?" This gives him control within your boundaries.

  **D. Connection Before Correction**
  Often, homework resistance is actually anxiety or fatigue.
  *   Before mentioning work, spend 10 minutes connecting. Ask about his day, play a quick game, or just listen. A child who feels connected is less likely to power-struggle.
  *   If he is stuck, offer help as a consultant: "Do you want to tackle the hard part first or the easy part?" rather than "Sit down and do it."

  ### 4. A Plan for the First Week
  1.  **The Reset:** Have a calm conversation (not during homework time). Acknowledge the old system wasn't working. State the new rule: Homework is done before screens, no bargaining.
  2.  **The Environment:** Create a dedicated, distraction-free space. Be present nearby (reading your own book) to offer "body doubling" support without hovering.
  3.  **The Follow-Through:** If he refuses, do not threaten. Simply state, "If homework isn't done, screens aren't available tomorrow." Then walk away. If he doesn't do it, follow through calmly the next day. No anger, no lectures. Just cause and effect.
  4.  **The Coat:** Let him decide. It removes a battleground that has nothing to do with responsibility.

  ### Summary
  Your father's "old-fashioned" instincts identified a lack of boundaries, but his tools (fear and force) damage the relationship and fail to teach self-regulation. Your current tools (bribes and threats) teach him to manipulate the system.

  By shifting to **firm boundaries with natural consequences**, you stop being the bad guy. The *situation* becomes the teacher, not you. It will be harder for the first two weeks as he tests the new reality, but once he realizes you won't negotiate and you won't explode, the power struggle will fade, and he can begin to develop the intrinsic motivation you want him to have.
