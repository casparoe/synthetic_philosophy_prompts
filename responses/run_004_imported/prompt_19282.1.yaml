      *   **Solution Concepts:** The distinction between Nash Equilibrium, Sequential Equilibrium, and Rationalizability. BI is stronger than NE.
      *   **The "Impossible World" aspect:** In possible worlds semantics, if CKR holds at the actual world, worlds where deviation occurs are not accessible. Reasoning about them requires looking at "closest possible worlds" where CKR might fail.
