      *   *Did Binmore/Reny object?* Yes, Binmore (1987), Reny (1987).
      *   *What was Aumann's reply?* 1996 GEB paper. He argues that the paradox arises from mixing static and dynamic views. In a static model, the deviation never happens, so the contradiction never arises.
