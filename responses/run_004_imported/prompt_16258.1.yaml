answer: |-
  The notification pulsed on the kitchen tablet, a soft amber ring against the image of the sourdough starter Lin was feeding. *Mnemosyne Tier 2 Subscription: 3 Days Remaining.* Below it, a preview of the daily digest: *David would have liked this rain. He would have reminded you to check the gutters.*

  Lin wiped flour from her hands onto her apron and swiped the notification away without opening the message. Outside, the late autumn rain tapped against the greenhouse glass, a rhythmic, irregular drumming. It sounded like fingers on a tabletop.

  The doorbell rang. Lin didn't hurry. She finished kneading the dough, shaping it into a tight sphere, and set it to rise. When she opened the door, her sister-in-law, Mara, was shaking a wet umbrella with vigorous, agitated strokes.

  "You didn't answer your phone," Mara said, stepping into the foyer. She smelled of ozone and expensive perfume, the scent of the city center. "The account manager called me. He said you haven't engaged with the Avatar in four weeks."

  "I've been busy," Lin said, taking the umbrella. She placed it in the stand by the door, where water dripped onto the tile, pooling in the grout lines. "The tomatoes are finally dying back. I have to clear the vines before the frost."

  Mara followed her into the kitchen. Her eyes went immediately to the tablet, then to the smart speaker on the counter. The speaker's light band was dark. "You have it on mute."

  "It's sleeping."

  "It's not a pet, Lin. It's a preservation of consciousness. It's David." Mara pulled out a chair and sat, her coat still on. "The Tier 3 upgrade includes the holographic projection. You could have him at the dinner table. You could ask him about the taxes. You could ask him how he's feeling."

  Lin poured two cups of tea. She set one in front of Mara. "How who is feeling?"

  "David."

  "David is compost," Lin said. She said it lightly, the way one might note that the milk had run out. She sat opposite her sister-in-law and wrapped her hands around the warm ceramic. "The vines are going into the bin. By spring, they'll be soil. By summer, they'll be tomatoes. David is in the bin."

  Mara flinched. It was a small movement, a tightening of the jaw, but it filled the room. "That is grotesque. You know the Will specified the Cryo-Stasis option. We have the funds. We could have him suspended within the month. The body is recoverable. The mind is backed up here." She tapped the tablet. "You are choosing to let him rot."

  "I am choosing to let him change."

  "You're choosing to kill him twice." Mara's voice cracked. She leaned forward. "I know you read those old books. I know you think this... detachment is some kind of virtue. But this isn't a philosophy seminar. This is your husband. When I close my eyes, I want to know he's safe. I want to know he's waiting. Don't I deserve that comfort? Don't you?"

  Lin looked at the tablet. The amber ring had faded to black. She thought about the last time she had spoken to the Avatar. It had been three weeks ago. It had told a joke David used to tell, a joke about a mechanic and a priest. The timing was perfect. The cadence was exact. But the silence after the punchline had been different. It was a digital silence, a held breath that never needed to exhale.

  "The comfort is for you, Mara," Lin said. "Not for him. He isn't in the server. He isn't in the ice. He's in the rain."

  "That's poetry. It doesn't pay the bills, and it doesn't stop the grief." Mara stood up, pacing the small kitchen. "If you cancel the subscription, the data is purged. It's gone. Forever. You are erasing him."

  "I'm returning him."

  "To who?"

  "To the blur." Lin stood up and walked to the window. The rain had intensified, blurring the garden into shades of grey and green. "When you were a child, did you cry when the caterpillar broke its shell? You thought it died. But it just became something that flies. Why do you want to glue the shell back together?"

  "Because I loved the caterpillar!" Mara shouted. The sound bounced off the tiled walls. "I loved the way it crawled. I loved that I could hold it. I don't want a moth I can't catch."

  Lin turned from the window. She saw the exhaustion in Mara's face, the deep lines around her mouth that hadn't been there a year ago. Mara was holding onto a shape. She was insisting that the river stop flowing so she could keep drinking from the same spot. Lin felt a surge of affection for her, sharp and sudden, and then it passed, like a cloud shadow moving over a field.

  "The contract renews on Friday," Mara said, quieter now. She was pleading. "Just upgrade to Tier 3. Try the hologram. If you hate it, cancel it then. But don't let it lapse. Don't let the silence win."

  "The silence isn't winning, Mara. It's already here." Lin walked over to the counter and picked up the tablet. Her thumb hovered over the *Renew* button. It was green, inviting. *Secure David's Future.*

  She thought about the funeral home, months ago. They had offered the "Open Casket Preservation," a chemical treatment that kept the skin looking flushed, the limbs pliable. They had offered to spray him with a mist that smelled like pine and soap. Lin had refused. She had asked for a simple box, untreated wood. She had told them to leave the lid loose. *Let the air get in,* she had said. The director had looked at her as if she were speaking a dead language.

  *Heaven and earth will do fine as a coffin,* she had thought then, but she hadn't said it. Words were too heavy.

  "Lin," Mara said. "Please."

  Lin looked at her sister-in-law. She saw the fear there. It wasn't fear of death; it was fear of the void. It was the terror of being a creature that knows it will end, scrambling to build a dam out of data and ice. Lin understood the terror. She felt it in her own bones, a low hum, a biological imperative to persist. But she also felt the counter-pull, the gravity of the earth dragging the leaf down.

  If she renewed, Mara would be happy. The house would feel less empty. David's voice would fill the kitchen. He would remind her to check the gutters. He would tell the joke about the mechanic. It would be easier. It would be a warm room in a cold winter.

  But it would be a room with no doors.

  Lin tapped the screen. She navigated to *Settings*. She found *Subscription*. She found *Cancel Plan*.

  A dialogue box appeared. *Are you sure? This action is irreversible. All associated neural maps will be scheduled for deletion.*

  "Lin, don't," Mara whispered. She reached out, her hand hovering over Lin's shoulder, not touching.

  Lin looked at the button. It was red. *Confirm Deletion.*

  She thought about the compost bin outside. The heat rising from it in the winter, the steam lifting off the rotting vines. It smelled sweet and sour, like fermentation. It smelled like life eating itself to make more life. To stop that process, to vacuum-pack the vines and put them on a shelf, would be to kill the garden.

  "I'm sure," Lin said.

  She pressed the button.

  The screen spun for a moment, a loading wheel of grey dots. Then, a checkmark. *Cancellation Processed. Thank you for using Mnemosyne.*

  The smart speaker on the counter let out a soft chime, a final acknowledgment. The light band flickered once, blue, then went dark. Truly dark. Not sleeping. Off.

  Mara made a sound, a small gasp, as if she had been underwater and surfaced too quickly. She grabbed her coat. "I can't stay here."

  "Mara, wait. I'll drive you."

  "No." Mara was already at the door, fumbling with the lock. "I need to go somewhere he's still... somewhere he exists."

  "He exists in the taxes," Lin said. "He exists in the way you hold your coffee cup. He taught you that."

  Mara stopped with her hand on the knob. She didn't turn around. "That's not enough."

  "It has to be."

  Mara opened the door and stepped out into the rain. She didn't take her umbrella. She walked quickly to her car, the rain soaking her hair, her shoulders. Lin watched through the window until the taillights disappeared around the bend of the driveway.

  The kitchen was silent. The refrigerator hummed. The rain drummed on the glass.

  Lin stood alone in the center of the room. She waited for the feeling she expected. The rush of liberation? The crushing weight of finality?

  She felt her own heartbeat in her wrists. She felt the flour drying on her forearms, tight and itchy. She felt the cold draft coming from the window frame.

  She walked over to the smart speaker. She touched the top of it. It was cool plastic. She unplugged it from the wall and put it in the drawer with the spare chargers and tangled headphones.

  She picked up her tea. It had gone cold. She drank it anyway.

  Then, she put on her boots and raincoat. She went out the back door into the garden. The rain hit her face, cold and sharp. She walked to the compost bin at the edge of the yard. She lifted the lid. The steam rose up, smelling of earth and decay. She reached into her pocket and pulled out the tablet.

  She hesitated. The device was expensive. It contained photos, emails, banking apps. It was not just a vessel for David. It was a tool for Lin.

  But the *Mnemosyne* app was still open on the screen. The confirmation message. *Scheduled for deletion.*

  She looked at the compost. She looked at the tablet.

  If she threw it in, the circuit board would leach chemicals. The lithium would poison the soil. That wasn't transformation; that was pollution. Zhuangzi wouldn't have wanted that. He would have said the tablet has its own nature, its own path. To break it prematurely is violence. To keep it forever is attachment.

  Lin closed the lid of the compost bin. She wiped the rain from the tablet screen. She walked back to the house, her boots heavy with mud.

  Inside, she dried her hands. She sat at the table and opened the settings again. She initiated a factory reset. She watched the progress bar move across the screen, wiping the memory clean. When it was done, the screen went black, reflecting her own face back at her. She looked tired. Her hair was wet. Her eyes were dark.

  She put the blank tablet in the recycling bin by the door.

  Then she went to the counter and began to prepare dinner. She chopped onions. She sliced carrots. She lit the stove. The flame was blue and orange, dancing, consuming the gas, turning it into heat.

  As the onions sizzled in the pan, releasing their sharp, stinging scent, Lin's eyes watered. She blinked, and tears ran down her cheeks. She didn't wipe them away. She didn't stop chopping. She let the tears fall into the pan, evaporating instantly in the heat, joining the steam, joining the air.

  She wasn't sure if she was crying because David was gone, or because the onions were strong, or because the rain was cold, or because she was alive and the work of living required fuel.

  She stirred the vegetables. She added salt. She tasted the broth. It needed more thyme.

  She reached for the jar, her hand moving automatically to the shelf where the spices lived. For a second, her hand hovered, expecting a voice to tell her she was using too much salt. The silence rushed in to fill the space, heavy and absolute.

  Lin paused. Her hand trembled, just once.

  Then she took the thyme. She crushed the leaves between her fingers and dropped them into the pot. She turned the heat down. She waited for the water to boil.
