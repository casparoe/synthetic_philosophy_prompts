answer: |-
  1. **The Dominance Objection**
  Standard causal decision theory argues that in a one-shot Prisoner's Dilemma, defection strictly dominates cooperation: you get a better payoff if you defect, regardless of what the other player does. Your model relies on a logical correlation between players, but critics say this ignores causal isolation—my choice doesn't *make* you choose. How do you respond to the charge that superrationality treats a logical coincidence as if it were a causal lever?

  2. **Follow-up: The Mechanism of Constraint**
  *(Anticipating she will argue that logical necessity constrains physical outcomes without causal signals.)*
  If there is no causal signal, by what mechanism does my brain state physically constrain yours? Are we saying that the laws of logic exert a force on matter that bypasses the speed of light, or are we redefining what it means for an event to be "caused"?

  3. **The Similarity Threshold**
  Hofstadter originally illustrated this with exact clones, where the correlation is near-perfect. But in the real world, even brilliant agents are noisy; we have different experiences, moods, and cognitive biases. As we move from identical twins to merely "like-minded" humans, does the obligation to cooperate degrade gradually, or is there a sharp cliff where it becomes rational to defect?

  4. **Follow-up: The Sucker's Risk**
  *(Anticipating she will describe similarity as a probabilistic gradient.)*
  If it's a gradient, doesn't that reintroduce the risk of being the "sucker"? If I estimate a 90% chance you reason like me, but that 10% uncertainty means I could face the worst possible payoff, isn't the safe dominant strategy still to defect, effectively treating superrationality as too fragile for high-stakes decisions?

  5. **The Kantian Accusation**
  Kant's categorical imperative asks you to act only on maxims you could will to be universal law. Superrationality asks you to act as if your choice determines the choice of all identical reasoners. Is there any substantive difference here, or is superrationality simply smuggling a moral imperative into game theory by relabeling "duty" as "optimal strategy"?

  6. **Follow-up: The Definition of Winning**
  *(Anticipating she will insist this is about instrumental rationality and maximizing utility, not morality.)*
  If it's purely about utility, we have to ask: what is being maximized? If I defect and get more money, but you say I've reasoned poorly, have you changed the definition of "winning" to include a preference for fairness? Or are you claiming that the defector literally ends up with less utility in a way a bank account would reflect?

  7. **Program Equilibrium and AI**
  This theory seems to find its strongest footing not in human psychology, but in AI, where agents can actually read each other's source code. Do you suspect superrationality is a false universal that only applies to transparent algorithms, and that applying it to opaque biological brains is a category error?

  8. **The Evolutionary Puzzle**
  If superrational cooperation yields higher payoffs than causal defection, why hasn't evolution selected for it more aggressively? Why are human brains seemingly wired for causal decision theory—punishing defectors and fearing suckers—rather than naturally defaulting to the superrational equilibrium?
