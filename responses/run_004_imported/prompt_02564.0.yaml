answer: |-
  This is impressive work. You have correctly identified the two main pillars of the Thomistic position on tyranny: the distinction between the *tyrannus ex defectu tituli* (usurper) and the *tyrannus ex parte exercitii* (legitimate ruler turned bad), and the crucial restriction on private authority.

  Most pop-culture versions of Aquinas paint him as either a pacifist or a divine-command theorist who says "God wants the king dead." You have avoided both traps. Your Fra Silvestro sounds like a man who has actually read *De Regno* (On Kingship) and *Summa Theologiae* II-II, Question 42 (On Sedition).

  However, since you asked for the "Philosophy PhD side-eye" check, there are three nuances where a specialist might raise an eyebrow. None of them require a rewrite, but tightening them will make the dialogue bulletproof.

  ### 1. The Usurper Distinction (Aquinas vs. The Dominican School)
  You asked if the usurper vs. legitimate-ruler distinction is Aquinas's own or a later gloss.
  *   **The Verdict:** It is implicitly Aquinas, but explicitly his Dominican successors.
  *   **The Detail:** In *De Regno* (Book I, Chapter 7), Aquinas argues that it is not sedition to depose a tyrant. He distinguishes between a ruler who governs for the common good and one who governs for private gain. He implies that a ruler who seizes power by violence has no claim to obedience. However, the sharp legal distinction you have Fra Silvestro articulate was sharpened by **John of Paris** (another Dominican, writing *De potestate regia et papali* in 1302).
  *   **Why this helps you:** Since your novel is set in the 1360s and Fra Silvestro is a Dominican, he would absolutely have read John of Paris (d. 1306). So, having him articulate this distinction is historically accurate for a friar of that order and time, even if it's a slight development of Aquinas's original text. You are safe.
  *   **Suggestion:** Keep the logic, but perhaps have Silvestro attribute the wisdom to "the brothers" or "the doctors of the order" rather than just implying it's a direct quote from Thomas, unless you want to be pedantic. (Though in fiction, attributing it to Aquinas is acceptable shorthand).

  ### 2. The "Private Man" Restriction (The Trickiest Part)
  You nailed the core Thomistic worry: *"no private man may set himself up as its avenger."* This is straight out of *Summa* II-II, Q. 42, Art. 2. Aquinas is terrified of anarchy; he worries that if private citizens kill tyrants, the next guy might be good, but the precedent destroys the rule of law.
  *   **The Nuance:** Where a Thomist might wince is the line: *"to fell him is no more a sin than felling any thief who waylays you on the road."*
  *   **The Issue:** Aquinas is cautious about *killing* even a usurper. He prefers **deposition** over **execution**. In *De Regno*, he suggests that if a tyrant is intolerable, the community should depose him. Killing is permitted only in the immediate act of self-defense (repelling force with force), not as a premeditated execution of justice, unless there is a public sentence.
  *   **The Fix:** Fra Silvestro should emphasize that the usurper has forfeited the *protection* of law, making him vulnerable to public removal, rather than framing it as a license for private assassination. However, since Costanza is asking if she can *help* get rid of him (implying a conspiracy or a broader movement), you are in the clear. A conspiracy of citizens acts as a nascent "public authority."
  *   **Wording Tweak:** Instead of "fell him... as a thief," consider phrasing it as "resist him as one resists a brigand." It leaves the lethality ambiguous (self-defense vs. execution) which is more Thomistic.

  ### 3. Terminology and "Authority Above"
  *   **"Right of Succession":** In an Italian city-state commune, "succession" sounds a bit monarchical/feudal. While the *Signoria* was rising, the language of the *Commune* usually revolved around **statutes**, **election**, or **custom**. A *podestà* was typically an appointed magistrate. If the usurper was supposed to be elected for a year and stayed, the violation is against the **statutes of the commune** rather than "succession."
  *   **"Authority stands above it":** In 1360s Italy, this is politically fraught. The Emperor is weak; the Pope is in Avignon. Often, in a republic, the "authority above" the tyrant is **the People** (the *Universitas* or *Commune* itself). Aquinas acknowledges that if there is no human superior, the community itself retains the right to depose.
  *   **Suggestion:** Change "right of succession" to "statute of the commune" or "law of the city." Change "authority stands above it" to "the council of the citizens" or "the community that granted the office."

  ### Revised Draft Suggestion
  Here is a version that incorporates these nuances while keeping your voice. Changes are in **bold**.

  > "My daughter, you ask if the man may be killed as one kills a wolf. Consider first how he came to rule us: not by the **statutes** of the commune, nor by any **lawful election**, but by armed men in the piazza at night. A prince who is given his office by the people and only afterward turns cruel is owed a different reckoning than one who never held any office at all. For the first, the remedy belongs to those who made him — the commune itself, or whatever authority stands above it — and no private man may set himself up as its avenger, however just his grievance, for today it is a tyrant he strikes down and tomorrow it may be some lawful lord a hothead judges tyrannical besides.
  >
  > But the second sort of man is no prince at all in the eyes of God, only a robber grown large. **He holds no shield of office against the people he has bound.** To resist him is no more a sin than **repelling** any thief who waylays you on the road; **yet even here, let the hand that strikes act for the body of the city, not for the vengeance of a single member.**"

  ### Why this works better for a Thomist:
  1.  **"Statutes/Election" vs. "Succession":** Fits the Italian City-State context better.
  2.  **"Repelling" vs. "Felling":** Aligns with the *Summa's* preference for self-defense over execution.
  3.  **"Body of the city":** This is pure Aquinas. He uses the metaphor of the body politic constantly (amputating a diseased limb to save the body). It reinforces that Costanza must act as part of a wider movement (public authority), not a lone vigilante.

  ### One Last Historical Note for Your Pocket
  If a reader *does* challenge you, your trump card is **John of Paris (1302)**. He was a Dominican who explicitly argued that a king who rules for private gain rather than the common good forfeits his right to rule, and the community (not just a superior monarch) can depose him. Since Fra Silvestro is a Dominican in 1360, he is standing on solid ground.

  You've done the hard work already. This is going to read as authentic to anyone who knows the period.
