    },
    {
      "criteria": "Explanation of Why Signal Must Be Costly",
      "points": 5,
      "comment": "Accurate. Explains condition-dependence well (high-quality individuals can afford the cost)."
    },
    {
      "criteria": "Theoretical Footing (Mathematical Validation)",
      "points": 0,
      "comment": "Incorrect. Attributed to Fisher's Runaway. The correct answer is Grafen's (1990) Game Theory/Signaling model. Fisher explains exaggeration, not necessarily honest signaling via cost."
    }
  ]
  ```

  ### Note for your feedback to the student
  If you want to give them a chance to learn from this, you might add a note like:

  > "You have a fantastic grasp of the logic behind the Handicap Principle and the peacock example is spot-on. However, be careful not to conflate Zahavi with Fisher. Fisher's Runaway model (1930) explains how traits get *big*, but it doesn't guarantee they are *honest* indicators of quality. Zahavi's idea wasn't widely accepted until **Alan Grafen (1990)** used game theory to prove that differential costs make honesty stable. Keep an eye on that distinction for the exam!"
