answer: |-
  Here is a second opinion on your pedagogical instinct, followed by the reconstruction you requested.

  ### The Verdict
  Your colleague is wrong, but for a reason that makes the exercise valuable. The colleague thinks the parallel is strained because Truman *acted* and Putin (thus far) has only *spoken*. But for Anscombe, ethics is primarily about the orientation of the will, not merely the tally of bodies. If the moral crime is the *intention* to kill the innocent as a means, then the public declaration of that intention (the threat) is the evidence of the crime, regardless of whether the trigger is pulled.

  Using this in your seminar is excellent. It forces students to test the limits of Anscombe's absolutism. If they recoil at the idea that a threat without detonation is morally equivalent to the act itself, they must admit they are smuggling consequentialism back in (i.e., "it's only bad if people actually die"). If they agree with the reconstruction, they must confront the terrifying radicalism of her view on conditional intention.

  ### Reconstruction: "On the Threatening of Innocents"
  *(Written in the voice of G.E.M. Anscombe, c. 2002, imagining her response to the Russian posture in Ukraine)*

  There is a great deal of noisy confusion in the newspapers about whether Mr. Putin is "bluffing." The political scientists and the strategists wring their hands over whether the signals are genuine or merely a bargaining chip. They speak of "escalation management" and "strategic ambiguity." This is all moral rubbish. It is the language of people who have forgotten that there are actions a human being is simply forbidden to perform, and consequently, forbidden to intend to perform.

  Let us be clear about what is being threatened. It is not the destruction of military targets. If it were merely that, there would be no special horror attached to the mention of it; war involves the destruction of military targets. The threat that hangs over the Ukraine is the use of weapons that cannot be directed at combatants alone. To use them is to choose the death of the innocent—the children in the schools, the old people in the cities—as a means to a political end. That end might be the retention of occupied territory, or the intimidation of a neighbour, or the saving of a regime from humiliation. It does not matter. The end is irrelevant to the prohibition.

  Now, the modern mind wants to say: "But no bomb has fallen. No one has been burned. Where is the murder?"

  The murder is in the will.

  In the time of the Cold War, there was a debate about deterrence. Some bishops and philosophers tried to construct a delicate house of cards wherein one could intend to kill millions *conditionally* without it being a sin, provided one hoped the condition would never arrive. I argued then, as I argue now, that this is sophistry. You cannot say, "I am prepared to do X," without intending to do X. If you form the conditional intention to slaughter the innocent, you have already corrupted your soul. You have made yourself the sort of man who murders. That you are restrained by fear, or by the enemy's own weapons, does not wash the stain from your intention.

  But this case is worse than the Cold War. In the Cold War, the argument—however false—was that the intention was held to prevent war entirely. Here, the threat is wielded in the service of a war already chosen. It is a tool of coercion in an aggressive conflict. The man who points a gun at a hostage to steal his wallet is guilty of armed robbery even if the gun jams. He has already chosen to kill the innocent to get his way.

  Does it matter that it is a "signal" rather than an order? Do not be silly. A signal of willingness to kill innocents is a declaration of a wicked will. If I tell you, "I will cut your throat if you do not give me your purse," I have already committed myself to the moral equivalent of murder, regardless of whether you hand over the purse or whether my knife is dull. The terror inflicted on the population is the fruit of that intention.

  The consequentialists will tell us we must weigh the threat against the "greater evil" of defeat or the continuation of conventional war. They will say that if the threat prevents a longer bloodbath, it is justified. This is the same calculus that justified Truman. It is the calculation that leads men to believe they can do evil that good may come. It is a superstition. You cannot measure murder against murder and come out with a sum of zero.

  So, is the threat itself the crime? Yes. It is the public avowal of a willingness to commit murder. That the bomb does not fall is a mercy, perhaps, or a result of prudence. It is not a moral acquittal. The man who holds a knife to the throat of the innocent is guilty of the violence, even if he is talked down from using it. To argue otherwise is to say that morality resides in the physical consequences alone, and not in the choices of human beings. And if we believe that, we are lost.

  ***

  ### Analysis for the Seminar
  Here is how you can unpack this for your students to address your colleague's skepticism:

  **1. The Doctrine of Conditional Intention**
  Anscombe's strongest move here relies on her 1961 essay "War and Murder" and her interventions in the 1950s Catholic debate on deterrence. She rejected the view that "conditional intention" (I will do X *if* Y happens) is morally distinct from actual intention.
  *   **The Trap:** Students often want to say, "But he hopes he doesn't have to do it!"
  *   **The Anscombean Reply:** Hope is irrelevant to intention. If you have put mechanisms in place and declared your readiness to kill innocents to secure a political objective, you have *intended* it as a means. The "bluff" defense is morally unavailable to a head of state with launch codes; to be credible, the intention must be real. If it is real, it is sinful. If it is fake, it is a lie designed to coerce via fear of murder. Both are damning.

  **2. The "Reasons of State" Calculus**
  In "Mr. Truman's Degree," Anscombe attacks the idea that the office of Head of State grants a dispensation from ordinary morality.
  *   **Truman:** Claimed the bombs ended the war and saved lives overall.
  *   **Putin:** Claims the threat protects Russian sovereignty or prevents NATO encroachment.
  *   **Anscombe's View:** She would see these as identical moral errors. The "national interest" is not a trump card that allows the killing of the innocent. The fact that Putin started the war (aggression) makes the *context* worse, but the *moral structure of the threat* remains the same as Truman's: using the death of innocents as a lever.

  **3. Addressing the Colleague's Objection**
  Your colleague says the parallel is strained because Truman *killed* and Putin *threatened*.
  *   **Why Anscombe would dismiss this:** She would argue this is a consequentialist bias. It assumes the moral weight lies in the *outcome* (dead bodies) rather than the *act of will* (choosing to target innocents).
  *   **Pedagogical Pivot:** Ask the class: "If Anscombe is right, does the number of casualties change the *type* of wrong, or only the *scale* of the tragedy?" If the threat itself is murder in the heart, then Putin is already guilty of the specific wrong Anscombe accused Truman of, regardless of the radiation counts.

  **4. The Distinction on Aggression**
  There is one nuance where Anscombe might distinguish the cases, not to excuse Putin, but to condemn him further. Truman (in the view of his defenders) used the bomb to *end* a state of war. Putin uses the threat to *sustain* a war of aggression.
  *   For Anscombe, aggressive war is itself a crime. Using the threat of mass murder to sustain an aggressive war compounds the injustice. It removes even the flimsy "necessity" defense Truman attempted to use.

  ### Recommendation
  Put it in front of them. But frame it carefully. Tell the students: *"Anscombe died before this specific war, but she wrote extensively on conditional intention and nuclear deterrence. Your job is not to guess what she would feel, but to apply her rigorous logic. Does her absolutism break under the pressure of a threat that hasn't been executed? Or does it illuminate the morality of coercion?"*

  If your colleague thinks it's too strained, it's likely because they are thinking like a political scientist (outcomes, credibility, stability). Anscombe thinks like a moral philosopher (will, intention, prohibition). That friction is exactly where the learning happens.
