answer: |-
  **Setting:** *A university office, late afternoon. Books on evolutionary biology and bioethics are stacked precariously on a desk. ELENA (Naturalist) and MARCUS (Normativist) are finishing a seminar discussion.*

  **Marcus:** Let's press on the osteoarthritis case again, Elena. You say the eighty-year-old with degenerating cartilage is healthy, or at least not diseased, because their joint function is statistically normal *for an eighty-year-old*. But isn't that move question-begging?

  **Elena:** It's not question-begging; it's methodological necessity. If you construct a reference class of "all living humans," then yes, the eighty-year-old is pathological. Their VO2 max, synaptic density, and cartilage thickness are subnormal. But that reference class is biologically heterogeneous. It's like judging the function of a caterpillar by comparing it to a butterfly. Age is a biological coordinate, not a moral preference.

  **Marcus:** But who decides which coordinates are relevant? You stratify by age because you already assume aging isn't a disease. If you thought aging *was* a pathology, you'd insist the reference class be "human organisms at peak function." By carving nature at the joint of "age," you're smuggling in the judgment that decline is natural, and therefore acceptable.

  **Elena:** I'm not saying it's acceptable. I'm saying it's not a *failure of mechanism*. This is where the evolutionary biology matters. You're treating senescence as if it were a breakdown, like a rusted car. But under theories like antagonistic pleiotropy, senescence isn't a bug; it's a feature. Genes that promote robust tissue repair and rapid cell division early in life—vital for reproduction—often carry costs later, like cancer risk or cartilage degradation. Natural selection favors the early benefit because reproductive value drops off. The mechanism is functioning exactly as the design specifications dictate.

  **Marcus:** "Design specifications." There's the rub. You're using the selected-effect theory of function. A heart functions to pump blood because that's what it was selected for. But when you apply that to aging, you're saying the "function" of the organism is reproduction, not the welfare of the individual.

  **Elena:** The function of the *mechanism* is what determines health, not the welfare of the host. If a mechanism is doing what it was evolutionarily tasked to do, it isn't dysfunctional. The cartilage degradation is the result of a trade-off selected for by evolution. To call it a disease is to say evolution got it wrong. But biology doesn't get things wrong; it just optimizes for fitness.

  **Marcus:** But medicine isn't evolutionary biology. Medicine is a moral practice aimed at alleviating suffering and restoring agency. When I say "disease," I'm not asking, "Did this trait maximize inclusive fitness in the Pleistocene?" I'm asking, "Is this person impaired in a way that harms them?" If I'm eighty and I can't walk without pain, I don't care that my pain is the price of my grandfather's fertility. The impairment is real. By ruling it out as "normal senescence," you aren't making a biological discovery; you're making a policy decision to limit the scope of medical intervention.

  **Elena:** I'm not limiting intervention. We can treat the pain. But calling it a *disease* implies there is a standard of health the patient is failing to meet. If the statistical norm for eighty-year-olds is some degree of decline, then the eighty-year-old without decline is the outlier, not the one with decline. If you medicalize aging, you medicalize the entire human species. You make "health" a state that is biologically impossible to sustain. That renders the concept of health useless.

  **Marcus:** Why is that a problem? Maybe the concept *should* be demanding. But look closer at your evolutionary defense. You distinguish between a "trade-off" and a "dysfunction." How do you draw that line without a value judgment? Take a genetic predisposition to hypertension. It might be statistically normal in a specific population due to historical environmental pressures. Is it a trade-off or a dysfunction? You only call it a trade-off if you think the resulting physiology is "good enough" or "natural." If the organism suffers, the distinction between "selected trade-off" and "design failure" collapses into "do we care about fixing this?"

  **Elena:** It doesn't collapse. We can identify the causal history. If the hypertension is caused by a pathogen or a random mutation that reduces survival across all ages, it's a dysfunction. If it's a systemic consequence of a regulatory system that works well for forty years and then degrades as part of a life-history strategy, that's senescence. The causal history is objective.

  **Marcus:** The causal history is objective, yes. But the *label* "disease" is not tracking only the causal history. It's tracking the *badness* of the condition. You want to say, "It's bad, but it's not disease because evolution meant it to be this way." I'm saying, "If it's bad enough to warrant medical attention, the evolutionary 'why' is irrelevant." You're privileging the gene's eye view over the patient's eye view. You're essentially saying, "Don't worry, your suffering is statistically normal."

  **Elena:** I'm saying, "Don't worry, your machinery isn't broken." There's a difference between a machine wearing out and a machine being sabotaged. Wear and tear is inevitable in any physical system. To call wear and tear a "disease" is to misunderstand the thermodynamics of living systems.

  **Marcus:** But living systems aren't just thermodynamic systems; they're subjects of a life. When a pediatrician sees a child with the cartilage of an eighty-year-old, they call it progeria. It's a disease. Why? Because it's premature. But "premature" is a normative temporal concept. It means "too soon." Who decides when it's "time" to fall apart?

  **Elena:** The species-typical life cycle decides.

  **Marcus:** And who reads the cycle? You do. And you read it through the lens of what we've decided is inevitable. If we developed a technology tomorrow that halted cartilage degradation, would you still call the degradation "natural function"? Or would you suddenly see it as a treatable defect?

  **Elena:** If we could halt it without trade-offs, then yes, the previous state might be reclassified. But right now, given our biological constraints, the decline is internal to the normal functioning of the species.

  **Marcus:** So your naturalism is contingent on our technological inability to fix it. That's where the normativity hides, Elena. You define "normal function" as "what we can't currently avoid."

  **Elena:** No, I define it as "what contributes to survival and reproduction in the environment of adaptation."

  **Marcus:** And there it is. You ground health in *survival and reproduction*. I ground it in *well-being*. You can keep your biostatistical theory consistent, but only by accepting that a person can be "healthy" while suffering unnecessarily, simply because their suffering is evolutionarily explicable.

  **Elena:** And you can keep your normativism consistent, but only by accepting that "health" has no biological anchor, making it purely a matter of social consensus on what suffering we dislike.

  **Marcus:** Precisely. So we aren't disagreeing about the biology of cartilage. We're disagreeing about whether the concept of disease belongs to the biologist or the patient.

  **Elena:** I think it belongs to the organism.

  **Marcus:** And I think the organism doesn't speak. The patient does.

  *(Silence hangs between them, the gap remaining not in the facts of senescence, but in the authority to name it.)*
