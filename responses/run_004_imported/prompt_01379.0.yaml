answer: |-
  You are not strawmanning. In fact, your grasp of the literature is sharper than your housemate's deployment of it. You have correctly identified a category error that annoys philosophers and behavioral economists alike, and you've correctly cited the specific patches economists have built to deal with it.

  Here is the sanity check you asked for, broken down by your points.

  ### 1. Samuelson and the Definition of Preference
  **You are right.**
  Paul Samuelson's 1938 paper, *A Note on the Pure Theory of Consumer's Behaviour*, was explicitly an attempt to purge psychology from economics. He wanted to make demand theory falsifiable based on observable data (prices and quantities) rather than unobservable mental states (utility/happiness).

  In strict Revealed Preference Theory (RPT), "preference" is a binary relation derived from choice. If you choose $A$ when $B$ is available, you have revealed $A \succeq B$. It is a **positive** statement (a description of behavior), not a **normative** one (a claim about what is good for you).

  **The Equivocation:** Your housemate is leveraging the *technical authority* of the term "preference" (which sounds objective and mathematical) to smuggle in the *colloquial meaning* of preference (what you genuinely desire or what brings you satisfaction).
  *   **Technical:** "At $t=11\text{pm}$, given budget set $S$, you chose Scrolling."
  *   **Colloquial implication:** "Scrolling is what you actually want / what makes you better off."
  *   **The Error:** RPT does not validate the welfare implications of the choice; it only formalizes the choice itself.

  ### 2. The Consistency Requirement (WARP/SARP)
  **You are right.**
  This is the strongest technical rebuttal to your housemate. RPT only yields a coherent utility function if choices satisfy the **Weak Axiom of Revealed Preference (WARP)**. Roughly: If you choose $A$ over $B$ when both are available, you shouldn't choose $B$ over $A$ when both are available later.

  Your example (buying a book on stopping scrolling at 2pm vs. scrolling at 11pm) is a classic violation of stable preferences.
  *   At 2pm, you reveal a preference for a future state of "Reading" over "Scrolling" (by investing capital in the book).
  *   At 11pm, you reveal a preference for "Scrolling" over "Reading."
  *   If the options are effectively the same (read vs. scroll), this is time-inconsistency.

  By ignoring the consistency axiom, your housemate is using "Revealed Preference" as a tautology ("you did it, so you must have wanted it") rather than a theory that can be falsified by inconsistent behavior. If *every* choice reveals a "true" preference, the theory explains everything and predicts nothing.

  ### 3. Planner-Doer and Menu Preferences
  **You are not garbling this.**
  *   **Thaler & Shefrin (1981):** *A Principal-Agent Model of Self-Control.* You nailed it. They model the individual as a conflict between a far-sighted "Planner" and a myopic "Doer." In this framework, saying "you revealed you prefer scrolling" is incomplete; you have to specify *which agent* was driving.
  *   **Gul & Pesendorfer (2001):** *Temptation and Self-Control.* You also nailed this. They preserve the rational choice framework by shifting the domain of choice from *outcomes* to *menus* (sets of options).
      *   Example: You prefer the menu $\{ \text{Book} \}$ to the menu $\{ \text{Book, Phone} \}$.
      *   Why? Because if offered the second menu, you anticipate you will choose the Phone (due to temptation), which yields lower utility than the Book.
      *   This allows economists to say "Choosing the Phone was rational given the temptation cost," but it admits that the naive RPT view ("Phone > Book") is misleading regarding welfare.

  ### 4. Welfare Economics (Bernheim & Rangel)
  **You are spot on.**
  Douglas Bernheim and Antonio Rangel's work (e.g., *Beyond Revealed Preference*, 2009) is the standard reference for this exact problem. They argue that when choices are context-dependent or anomalous (like addiction or doomscrolling), we cannot simply equate Choice with Welfare.

  They propose looking for "ancillary conditions" under which choices are stable. If your choice flips depending on whether it's 2pm or 11pm, we cannot simply say "Choice = Welfare." We have to do extra work to determine which choice reflects your "true" welfare (often deferring to the "Planner" or the choice made in a "cool" state rather than a "hot" state).

  ### The Core Question: Do Economists Think Choice = Welfare?
  **Historically:** Yes, under "Consumer Sovereignty." Standard welfare economics assumes individuals are the best judges of their own well-being. If you choose it, it increases your utility.
  **Currently:** It is a major fault line.
  *   **Neoclassical Purists:** Still hold that we cannot paternalistically say a choice is "wrong" for the agent. If you scroll, you get utility from scrolling (even if it's guilt-ridden utility).
  *   **Behavioral Welfare Economists:** Argue that cognitive biases, self-control problems, and framing effects mean choices often *fail* to maximize the agent's own well-being.

  Your housemate is using a **1950s Neoclassical defense** to shut down a **2024 Behavioral reality.**

  ### How to Bring This Back to Her
  You are not crazy, and you haven't misunderstood the theory. Your housemate used a technical term as a conversation stopper ("It's not that you have a problem, it's that you *prefer* this") which is a common rhetorical move in econ circles, but it's intellectually lazy in this context.

  If you want to press the point without starting a war, you could say:

  > "I looked into that. Technically, Revealed Preference requires consistent choices over time (WARP). Since I'm choosing to buy self-help books in the afternoon and scrolling at night, I'm violating consistency. So naive Revealed Preference theory actually breaks down here. Economists like Thaler or Bernheim usually handle this by distinguishing between 'choice' and 'welfare' when self-control is involved. So saying I 'prefer' scrolling ignores the part of the model where I'm actively trying to change that preference."

  **Verdict:** You found the hole. It's real. Bring it up.
