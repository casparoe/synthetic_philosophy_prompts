          *   **Nuance:** Standard neoclassical econ *does* often treat revealed preference as synonymous with "what makes the agent better off" *given their preferences*, but it doesn't judge the preferences themselves. The housemate's error is conflating "preference" (ranking) with "well-being" (welfare) in a normative sense, or ignoring the consistency requirement.

