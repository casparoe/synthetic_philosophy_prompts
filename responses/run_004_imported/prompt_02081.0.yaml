          *   Options: $A$, $A^-$, $B$.
          *   Preferences: $A \succ A^-$ (strict).
          *   Gaps: $A \parallel B$ (gap), $A^- \parallel B$ (gap).
          *   The Pump: Start with $A$. Offer trade to $B$ (cost $\epsilon$). Agent accepts (gap allows it). Offer trade to $A^-$ (cost $\epsilon$). Agent accepts (gap allows it). End with $A^-$ minus costs. Agent started with $A$. $A \succ A^-$. Agent lost money for a worse outcome.
      *   *Thornley's Move:* The agent isn't just a bundle of pairwise preferences; it's a policy-implementer over time.
      *   *The Policy:* "If I previously rejected $X$, I will not later accept $Y$ if $X \succ Y$." Or more specifically, "If I turn down $B$ earlier, I won't trade $A$ for $B$ later." Wait, let's look at the specific pump structure.
      *   *Refining the Policy:* The specific policy Thornley suggests is often called a "resolute choice" or "precommitment" policy. The key is: *Treat the decision tree as a whole, not node-by-node myopically.*
      *   *The Explanation:*
          1.  **Preferential Gaps aren't Randomness:** Just because I'm indifferent/gapped between $A$ and $B$ doesn't mean I flip-flop. It means *either is permissible*.
          2.  **The Trap:** The money pump relies on the agent making locally permissible choices that globally sum to a disaster.
          3.  **The Shield:** The agent adopts a rule: "I will choose a path through the tree and stick to it."
          4.  **Why it doesn't violate preferences:** At any specific node, the choice made is *permissible* (due to the gap). The policy just selects *which* permissible option to take based on future consequences. It doesn't force the agent to choose $A^-$ over $A$ (which is forbidden). It forces the agent to choose $A$ over $B$ *in the context of the tree* to avoid ending up at $A^-$. Since $A \parallel B$, choosing $A$ is allowed.
      *   *Analogy:* Buridan's Ass. The donkey can starve if it waits for a reason to pick one haystack over the other. A "policy" is just picking one arbitrarily and sticking to it. The money pump tries to make that arbitrary pick costly. The policy says "I pick Left and I stay Left."

