answer: |-
  **Setting:** *A quiet corner of the convention center lounge, late afternoon. The noise of the "Foundations of Decision Theory" panel has faded into the clatter of espresso cups. Elena is staring at a whiteboard covered in series notation. Marcus leans against the doorframe, holding two coffees.*

  **Marcus:** You're still staring at the alternating harmonic series? I thought we agreed to ban talk of Pasadena after lunch. It gives everyone hives.

  **Elena:** *(Takes the coffee)* Thanks. I can't let it go, Marcus. It's not just a mathematical curiosity. It's a crack in the foundation. If Expected Utility Theory can't handle a coin toss, what can it handle?

  **Marcus:** It handles it fine. The expected value is $\ln(2)$. Sixty-nine cents. You pay less than that, you play. You pay more, you walk. End of story.

  **Elena:** That's the standard line. But it's question-begging. You're summing the terms in the order of the index $n$. One minus a half plus a third... But why that order? The Riemann Rearrangement Theorem tells us that for any conditionally convergent series, I can reorder the terms to sum to negative infinity, positive infinity, or pi.

  **Marcus:** You can reorder the *math*, Elena. You can't reorder the *game*. The index $n$ isn't just a label; it's the number of tosses until heads. It's a random variable defined on the probability space. The expectation is the integral of that variable with respect to the measure. The measure is defined on the sigma-algebra generated by the tosses. The structure of the game *imposes* the order.

  **Elena:** Does it? Or does it just impose the pairing of probability and payoff? Think about Nover and Hájek's card shuffle. Imagine the payoffs are written on cards: "Win $2," "Lose $2," "Win $8/3," and so on. Each card has its probability attached. I put them in a deck. I shuffle the deck. I deal them out to calculate the sum.

  **Marcus:** But that's not the game anymore.

  **Elena:** Isn't it? The gamble is the set of outcome-probability pairs. $\{(p_n, v_n)\}$. If the value of the gamble is intrinsic to the gamble itself, it shouldn't depend on the order in which I, the theorist, choose to write them down on my scratchpad. If shuffling the cards changes the expected value from sixty-nine cents to a billion dollars, then "Expected Value" isn't a property of the gamble. It's a property of my bookkeeping.

  **Marcus:** That's a category error. The shuffle changes the *summation*, but expectation isn't defined by an arbitrary summation. It's defined by the limit of the partial sums of the random variable over the sample space. The sample space is sequences of coin tosses: $H, TH, TTH...$ That sequence has a natural ordering. It's temporal. Causal. You can't get the result of the $n$-th term without resolving the previous $n-1$ tosses. The "card shuffle" ignores the causal structure of the stochastic process.

  **Elena:** So you're grounding decision theory in causality now? Since when does EUT care about time? If I offer you a ticket that pays out based on the state of the world, and the states are mutually exclusive, the order of enumeration shouldn't matter. If it does, then the expectation is undefined. And if it's undefined, you can't maximize it.

  **Marcus:** Okay, let's say I grant you that. Let's say the expectation is undefined. Does that break decision theory? Or does it just mean this specific game is pathological?

  **Elena:** It breaks the comparison. That's where Altadena comes in.

  **Marcus:** *(Sighs)* Here we go.

  **Elena:** The Altadena game is identical to Pasadena, except every payoff is increased by one dollar. Win $2^n/n + 1$ or Lose $2^n/n + 1$. In every single possible state of the world, Altadena pays exactly one dollar more than Pasadena.

  **Marcus:** Obviously.

  **Elena:** So, by the Principle of Dominance, a rational agent *must* prefer Altadena. It's strictly better. No risk, no downside, just +$1 in every branch. But if Pasadena's EV is undefined, Altadena's EV is also undefined. It's just the same divergent series shifted by the sum of probabilities, which is 1. You have "Undefined" versus "Undefined plus 1." How does Expected Utility Theory tell me to choose Altadena?

  **Marcus:** It tells you via Stochastic Dominance. You don't need a finite expectation to see that the cumulative distribution function of Altadena lies everywhere to the right of Pasadena's. EUT isn't just about calculating a scalar number $E[U]$. It's about preference orderings satisfying the axioms. If your preferences satisfy dominance, you pick Altadena. The fact that you can't assign a real number to the utility doesn't stop you from ranking them.

  **Elena:** But that's conceding the point! You're saying we need *additional* axioms outside of Expected Value maximization to resolve the choice. The whole promise of EUT was that the Expectation *is* the guide. If the Expectation goes silent, and we have to bring in Dominance as a separate tie-breaker for undefined cases, then Expectation isn't the general theory of value. It's a special case that works when the series converges absolutely.

  **Marcus:** I'm not conceding. I'm clarifying. Look, the problem arises because you're treating the expectation as a sum of a series rather than a Lebesgue integral. In Lebesgue integration, if the integral of the absolute value is infinite—which it is here, the harmonic series diverges—then the integral is undefined. Fine. But in the real world, we don't face "undefined." We face sequences.

  **Elena:** And in the real world, if I offer you these two games, you'd pay more for Altadena. Everyone would.

  **Marcus:** Exactly. Because we evaluate these things sequentially. We don't sum the whole infinite series at once. We look at the truncation. If we truncate Pasadena at $N$ tosses, the expected value oscillates. If we truncate Altadena, it oscillates *around a point one dollar higher*. The gap persists in the limit of the partial sums, even if the limit itself doesn't settle. The *difference* is well-defined, even if the absolute values aren't.

  **Elena:** That's a clever save, Marcus. "The difference is stable." But it relies on maintaining the natural ordering of $n$. Go back to the cards. If I shuffle the payoff cards for Pasadena and the payoff cards for Altadena *independently*, I can construct a summation order where Pasadena sums to 100 and Altadena sums to 2.

  **Marcus:** But you can't shuffle them independently! They are coupled. State $n$ in Pasadena is the *same* state $n$ in Altadena. It's the same coin toss. You can't rearrange the states of the world for one game and not the other. If you shuffle the cards, you're breaking the coupling between the two games. If you keep the coupling—the state-by-state dominance—the order of summation applies to *both* equally.

  **Elena:** So you're saying the dominance holds because the rearrangement must be identical for both?

  **Marcus:** Precisely. If you apply the same permutation $\sigma$ to the summation order of both games, the difference between the partial sums is always $\sum_{k=1}^N (p_{\sigma(k)} \cdot 1)$. As $N \to \infty$, that sum approaches 1, because the probabilities sum to 1 regardless of order. So $E[Altadena] - E[Pasadena] = 1$ is invariant under rearrangement, even if $E[Pasadena]$ is not.

  **Elena:** *(Pauses, tapping her pen)* Okay. That's... actually robust. The difference is absolutely convergent, even if the terms aren't. So the *relative* value is stable, even if the *absolute* value is volatile.

  **Marcus:** Right. So the theory isn't broken. It just tells us that absolute valuation is ill-posed for conditionally convergent gambles, but comparative valuation remains intact.

  **Elena:** But that's a huge restriction! It means Expected Value cannot be a universal measure of worth. It can only be a measure of *difference* in worth for this class of problems. That undermines the idea of a "fair price." If I ask you, "What is the fair price to enter the Pasadena game?" you can't answer me. You can only say, "It's one dollar less than the Altadena game."

  **Marcus:** And isn't that how value works in the real world? Value is relative. Prices are determined by arbitrage against other assets. If I can't pin down an absolute number, but I can tell you exactly how it trades against every other asset, haven't I captured everything that matters for decision making?

  **Elena:** Unless there's no Altadena. Unless it's just Pasadena against cash. If I offer you Pasadena for 50 cents, do you buy? According to your "natural order" logic, yes, because $\ln(2) > 0.50$. According to my "card shuffle" logic, the question is meaningless because I can rearrange the terms to make the EV $-100$.

  **Marcus:** But why would you rearrange them? What physical process corresponds to that rearrangement?

  **Elena:** That's the point! There *isn't* one. That's why the expectation is undefined. The game doesn't contain enough information to specify a unique value. The "natural order" is a story you're telling yourself to comfort the math. You're smuggling in a temporal assumption that isn't in the payoff structure.

  **Marcus:** I'm smuggling in the fact that coins are flipped in time, Elena. We are physical beings in a causal universe. Decision theory isn't pure math; it's a guide for agents in *this* world. In this world, $n$ means "toss count." Toss counts accumulate. You don't get to experience the 100th term before the 10th.

  **Elena:** But utility is supposed to be about the final outcome, not the path. If the game ends and I hand you a check, does it matter how we calculated the number on it?

  **Marcus:** It matters if the number on the check depends on how you calculate it. And that's the horror of Pasadena. It's not that the theory is broken. It's that the game is a monster. It's a "weakly integrable" random variable. We knew those existed in measure theory. We just didn't think we'd ever have to bet on one.

  **Elena:** *(Smiles faintly)* So we agree on one thing. It's a monster.

  **Marcus:** Agreed. But I still say $\ln(2)$ is the price.

  **Elena:** And I say if you offer me that price, I'll find a rearrangement of my bank account that makes it look like I bankrupted you.

  **Marcus:** *(Laughs)* I'll take that bet. But let's not write it down on cards. I don't trust the shuffle.

  **Elena:** Smart man. Stick to the coin toss. At least the physics is honest, even if the math isn't.

  **Marcus:** Cheers to that. *(Clinks coffee cup)*

  **Elena:** Cheers. But I'm still working on a paper about Altadena dominance.

  **Marcus:** I'll peer review it. I'll be the one arguing for the natural order.

  **Elena:** I'd expect nothing less.
