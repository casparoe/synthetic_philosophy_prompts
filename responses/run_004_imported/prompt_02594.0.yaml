      *   *The Critique:* If I need to know the truth to hide it, who is doing the hiding? If it's all one consciousness, how does it compartmentalize? Sartre says "non-thetic awareness." The critic argues: If you are non-thetically aware, you *know*. If you know, how are you deceived? If you aren't aware, it's Freud (which Sartre hates). So, Sartre just pushes the "knowing" part into a shadowy corner called "non-thetic" without explaining how that corner stays dark while still illuminating the trap. It's a homunculus problem disguised as phenomenology.

