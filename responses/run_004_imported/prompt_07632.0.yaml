      *(Refining the "Seams")*: The biggest seam is that Rousseau *wants* to be read. He is cultivating a public. The character needs to admit this is dangerous but argue it's a *necessary* danger to combat a greater one (Parisian influence). Or, argue that the book turns the reader *inward* (conscience) whereas theater turns them *outward* (opinion).

      *Let's build the argument.*

      *   **Premise 1:** Corruption is social. It happens in the *relation* between people.
      *   **Premise 2:** Theater creates a relation of *spectatorship* (passive, collective, anonymous).
      *   **Premise 3:** Reading creates a relation of *conscience* (active, solitary, accountable).
