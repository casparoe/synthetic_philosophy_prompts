      *   **Constraint:** Do *not* use the standard "Rousseau was a hypocrite" verdict. Construct the *strongest possible argument* for consistency based *strictly on Rousseau's own premises*.
      *   **Key Elements to Engage:**
          *   Collective public spectatorship vs. solitary silent reading.
          *   Acting (bodily/professional impersonation, *être/paraître*) vs. Writing (address to private imagination).
