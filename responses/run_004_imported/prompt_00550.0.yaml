      *   **Topic:** Aumann's Agreement Theorem (AAT).
      *   **Core Claim to Defend:** AAT loses normative force when computational complexity is considered.
      *   **Specific Arguments Required:**
          *   The theorem relies on unbounded common-knowledge iteration.
          *   Reaching/verifying common knowledge is computationally intractable for bounded reasoners.
