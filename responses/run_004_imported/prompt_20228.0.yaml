answer: |-
  # The Debt You Owe Your Future Self

  You are standing at the edge of a cliff. You are sober, the rock is loose, and your credence that "I will fall if I step" is 99%. You know that if you take a specific shot of tequila, your future self in thirty minutes will be 90% confident that "I can jump this gap safely." Van Fraassen's Reflection Principle, taken as a blind axiom, suggests that your current 99% credence is irrational. It suggests that because you know your future credence will be 90%, your current credence *ought* to be 90%.

  This is absurd. You know the tequila makes you stupid, not prescient. Yet, the intuitive pull of Reflection is strong enough that you felt it immediately: *Why shouldn't I trust my future self?* If you view yourself as a single agent persisting through time, disagreeing with your future self looks like a form of self-contradiction. It feels like looking in a mirror and arguing with the reflection.

  As a forecaster, you deal in calibration. You know that if you say 90% a hundred times, you should be right ninety times. Reflection seems to be the diachronic version of calibration: if your future self says 90% a hundred times, your current self should align with that. But the tequila case, the anesthesia case, and the forgotten evidence case all scream that this principle has limits.

  The question is whether those limits are fatal. Does the existence of "irrational updating" scenarios sink Reflection entirely, or does it merely tell us where the principle actually lives? The answer requires us to stop treating Reflection as a law of physics for beliefs and start treating it as a law of accounting for rational agents.

  ### The Case for Reflection: The Coherence Argument

  To understand why Reflection feels binding, you have to look at what happens when you violate it. It isn't just an aesthetic blemish on your belief system; it makes you exploitable.

  Imagine you are betting on a proposition $A$. Today, you assign it a 50% probability. You know for a fact that tomorrow, after seeing a specific report, you will assign it an 80% probability. If you truly believe your future 80% is unmoored from reality—if you think your future self is just "biased upward"—then you should be willing to make a series of bets today that guarantee a loss.

  Here is the Dutch Book: If your current credence is 50%, you will buy a bet on $A$ for \$0.50 that pays \$1.00 if true. But you also know that tomorrow you will think the bet is worth \$0.80. If you believe your future self is wrong, you should plan to sell that bet back tomorrow for \$0.60 (since you think it's only worth \$0.50). You buy high, sell low, and lose money regardless of whether $A$ is true or false. You have been money-pumped by your own timeline.

  The strongest argument for Reflection is that it is a necessary condition for viewing your future self as a partner rather than an adversary. In forecasting terms, it is the requirement that you treat your future belief state as *evidence* about the world. Why? Because the only thing standing between your current self and your future self is *information*.

  If you assume you are a rational agent, then the only reason your credence should change is that you have learned something. If you know you will learn something that pushes your credence to 90%, but you refuse to update to 90% now, you are effectively claiming that you know something *now* that your future self will ignore. You are claiming that the new information is irrelevant, even though you know it is powerful enough to shift your own mind. This is a form of epistemic arrogance. It posits a "mystery gap" between you and your future self where none should exist.

  Therefore, Reflection is binding because it enforces the idea that *learning is the only legitimate reason for belief change*. If you reject Reflection, you are admitting that your beliefs can shift for reasons other than the accumulation of truth-tracking evidence. And if you admit that, you admit that your belief system is not a map of reality, but a leaf in the wind. To be a rational forecaster is to commit to the idea that your future self is your current self plus data. To deny Reflection is to deny that the data matters.

  ### The Case Against Reflection: The Truth-Tracking Argument

  However, the tequila case is not just a quirky edge case; it exposes a fundamental category error in the Reflection Principle. The principle assumes that the correlation between your future belief and the world is fixed. It assumes that $P_{future}(A)$ is a *signal*. But in many cases, $P_{future}(A)$ is just a *state of affairs*.

  Consider the "Self-Fulfilling Prophecy" case, which is more subtle than the drunk driver. Suppose you are forecasting whether you will finish a marathon. You know that if you believe you will finish (90% confidence), the adrenaline will carry you across the line. If you believe you will fail (10% confidence), you will quit. You know today that tomorrow, right before the race, you will pump yourself up to 90% confidence to ensure success.

  Reflection says you should be 90% confident *now*. But that's wrong. Right now, objectively, you are a mediocre runner. Your actual chance of finishing is 50%. Your future 90% credence is not a *prediction* of the outcome based on evidence; it is a *cause* of the outcome. If you update to 90% now, you aren't respecting evidence; you are engaging in wishful thinking. You are confusing the map with the territory.

  The deeper problem is the "Forgotten Evidence" case. Imagine you solve a complex math problem today. You are 99% sure the answer is X. You know that tomorrow, you will have a head cold, forget the derivation, and your confidence will drop to 50%. Reflection says you should lower your confidence to 50% *now*. But that's insane. You have the proof in your hand! The fact that your future self will be stupider does not make the proof vanish.

  These cases sink the strong version of Reflection because they demonstrate that *belief change is not always learning*. Sometimes belief change is damage. Sometimes it is strategy. Sometimes it is chemistry.

  The standard defense—that we should only defer to future selves who update on "legitimate evidence"—smells circular to you, and rightly so. If "legitimate evidence" is defined as "that which satisfies Reflection," then the principle is tautological. It says, "You should defer to your future self unless you shouldn't." That's not a guide; it's a description of the outcome.

  If Reflection cannot distinguish between a Bayesian update and a bump on the head without relying on a circular definition of "evidence," then it fails as a normative guide for forecasters. It tells you to trust your future self, but it gives you no tools to determine if your future self is trustworthy. In the real world, we know our future selves will be tired, biased, emotional, or intoxicated. A principle that demands we ignore those known degradations in favor of abstract coherence is not a tool for rationality; it is a cult of consistency.

  ### The Verdict: Reflection as a Theorem, Not an Axiom

  So, where does this leave you? Do we toss Reflection into the bin with other broken philosophical toys? No. But we must demote it.

  The error in your Discord friend's pitch, and in the standard presentation of Van Fraassen's principle, is treating Reflection as a foundational *axiom* of rationality. It is not. It is a *theorem* that derives from a more fundamental rule: **Bayesian Conditionalization.**

  Here is the principled resolution: **You are bound by Reflection if and only if you expect your future self to be a Bayesian updater.**

  This is not circular if we define "Bayesian updater" functionally, not by the output. A Bayesian updater is a system that changes beliefs *only* in response to information that is probabilistically correlated with the truth. Alcohol is not information. Anesthesia is not information. Forgetting is not information (it is the loss of information).

  When you look at the tequila case, you are not violating Reflection by refusing to update. You are recognizing that the mechanism of change between Now and Future is not Conditionalization. It is *Causal Intervention*. Your future credence is not $P(A | Evidence)$; it is $P(A | Intervention)$. Reflection only holds when the change in belief is driven by the screening off of prior uncertainty by new data.

  This gives you a concrete test for your forecasting practice. You do not need to shrug and say "it depends." You need to ask: **"Is the difference between me-now and me-later purely informational?"**

  1.  **If Yes:** Reflection is binding. If you are just waiting for a poll result, a lab test, or a game outcome, and you trust your own ability to process that result, you *must* align with your expected future credence. To do otherwise is to claim you know how the evidence will land before you see it, which is incoherent.
  2.  **If No:** Reflection is void. If the change in belief is due to fatigue, chemical alteration, memory loss, or strategic self-manipulation, you owe your future self nothing. In fact, you should actively "anti-update" against known biases. If you know you will be overconfident tomorrow due to ego, you should discount your future self's forecast today.

  This resolves the circularity charge. We aren't defining "evidence" as "things that satisfy Reflection." We are defining "evidence" as "inputs that satisfy the likelihood ratio condition of Bayes' Theorem." Drugs and fatigue fail this test not because they break Reflection, but because they break the likelihood ratio. They alter the processing mechanism, not the input data.

  ### The Forecaster's Takeaway

  For your purposes on Manifold and in arguments with friends, this distinction is your sword. Reflection is not a magic rule that forces you to agree with your future self. It is a diagnostic tool.

  When you feel a tension between your current belief and your expected future belief, do not automatically defer. Investigate the *causal path* between the two. If the path is "I will see data," defer. If the path is "I will get tired," "I will want it to be true," or "I will forget my reasoning," do not defer.

  Van Fraassen was right that rational agents must respect their future selves, but only because rational agents respect the logic of learning. Your future self is an expert witness only if they are testifying about what they saw. If they are testifying about what they *feel* after three beers, they are not a witness; they are a defendant.

  So, keep using Reflection. But use it as a constraint on your *updating rule*, not as a constraint on your *credences*. Trust your future self to process the world, but never trust them to process themselves. That is the only way to remain coherent without becoming a fool.
