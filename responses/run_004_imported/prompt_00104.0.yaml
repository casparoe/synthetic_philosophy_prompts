answer: |-
  The rain blurred the lights of the city into smeared streaks of gold and red against the floor-to-ceiling glass of Elias's office. Inside, the air was still, conditioned to a precise, sterile cool.

  On the mahogany desk between them lay a single sheet of paper. A derivative contract. A binary bet on the FDA approval of a neuro-stimulant.

  Mara sat opposite him, her posture perfect, her hands folded loosely on her knees. She was thirty-two, sharp as a scalpel, and Elias had mentored her since she was an intern. He knew her risk tolerance. He knew her models. He knew she didn't gamble.

  "Five million notional," Elias said, his voice low. He held a Montblanc pen, the cap removed, the nib hovering an inch above the signature line. "You take the long position. I take the short. Settlement on Friday."

  "Fair odds," Mara said. Her voice didn't waver. "Based on the consensus probability of sixty percent. I'm pricing it at sixty-five."

  Elias nodded slowly. "And I am pricing it at fifty-five."

  "Then there is liquidity," she said. "There is a trade."

  This was the moment. The friction of the market. Two intelligent minds disagreeing on the future, finding a price where both could walk away richer. It was the engine of capitalism. It was what they did.

  Elias looked at the pen. Then he looked at Mara.

  He trusted her. Not just as a colleague, but as a processor of information. He knew that Mara did not act on hunches. If Mara was willing to put five million dollars on the line at these odds, it meant she possessed information that justified the risk. She wouldn't bet against him unless she believed, with rational certainty, that the expected value was positive.

  *If she knows something I don't,* Elias thought, *then the true probability is higher than my model suggests.*

  But then the second layer clicked into place, cold and heavy in his gut.

  *She knows me.*

  Mara knew that Elias was rational. She knew he wouldn't take the short side unless his models indicated the stock was overvalued. She knew that for him to sign this paper, he had to believe the true probability was *lower* than the market price.

  So, here they were.

  Mara was buying because she thought the asset was undervalued.
  Elias was selling because he thought the asset was overvalued.

  But they were sitting in the same room. They had access to the same public data. The only variable was private information.

  If Mara was willing to trade with *him*—specifically him, Elias Thorne, whose track record she knew better than anyone—she had to account for *his* willingness to trade.

  *Why am I selling?* Elias asked himself. *Because I think I'm right.*
  *Why is she buying?* Mara asked herself. *Because she thinks she's right.*

  *But she knows I think I'm right.*

  If Mara respected his competence, his willingness to sell should act as a signal to her. It should inject doubt into her conviction. It should lower her probability estimate. If she updated her beliefs based on his offer, the trade would no longer be profitable for her.

  Conversely, if Elias respected her competence, her eagerness to buy should signal to him that he was missing something. It should raise his probability estimate. If he updated his beliefs based on her offer, the trade would no longer be profitable for him.

  The pen did not move.

  The silence in the room stretched, tight as a drum skin. The hum of the server room in the basement seemed to grow louder.

  Elias looked into Mara's eyes. He saw the exact moment the calculation finished behind her pupils. It was a flicker, a micro-expression of horror. She wasn't looking at the contract anymore. She was looking at him, and she was seeing herself looking at him.

  It was a hall of mirrors.

  *If you know that I know that you know...*

  The trade required a difference of opinion. But their mutual knowledge of each other's rationality collapsed that difference. The very fact that the bet was on the table proved that the bet was impossible.

  "I..." Elias started, but the word felt thick.

  Mara didn't blink. "You're not signing."

  It wasn't a question.

  Elias set the pen down. The click of the cap engaging sounded like a gunshot in the quiet room. "If you're buying, Mara, you see a ghost in the machine I don't."

  "And if you're selling," she replied, her voice barely a whisper, "you see a crack in the foundation I'm standing on."

  "We can't both be right."

  "No," she said. "But we're both rational. So if we agree to trade, we're admitting that one of us is irrational. Or that we're lying."

  "Or," Elias said, feeling a strange, cold hollowness in his chest, "that the market is already efficient, and we're just noise."

  "But we're not noise," Mara said. There was a flash of anger now, or perhaps frustration. "I have a source. I have data."

  "And I have risk models. I have history." Elias leaned back in his chair, the leather creaking. "But the moment I offered you the short, I told you I think the price is too high. If you trust my judgment even one percent, you have to lower your bid. If you lower your bid, there is no trade."

  Mara stared at the contract. It was just paper now. Dead wood. The potential profit, the bonus, the vindication—it all evaporated, sucked out of the room by the logic of their own competence.

  It was profoundly awkward. They were friends. They had shared dinners, celebrated promotions, mourned losses. But in this moment, their trust was the weapon that killed the deal. Because they trusted each other's minds, they could not engage with each other's hands.

  To trade would be to insult the other's intelligence. To sign would be to say, *I know you are smart, but I think you are wrong enough to take my money.* And if they both knew they were smart, they had to conclude the price was already perfect.

  Mara reached out and slid the paper back across the desk. Her fingers didn't tremble, but they were stiff.

  "So," she said. "We sit."

  "We sit," Elias agreed.

  The opportunity was gone. Not because the market closed, but because they were too good at their jobs.

  A paranoia began to seed itself in the silence. Elias looked at Mara and wondered: *Does she know something so big that she thinks even my skepticism is a bluff?* And Mara looked at Elias and wondered: *Is he pretending to hesitate to scare me off?*

  But they both knew that was just noise too.

  "I should go," Mara said, standing up. She smoothed her skirt. She didn't look at him.

  "Mara," Elias said.

  She paused at the door.

  "We're still good," he said. It was a weak thing to say.

  She offered a thin, tight smile that didn't reach her eyes. "Of course. We're rational."

  She opened the door and stepped out into the hallway. The click of the latch was final.

  Elias sat alone in the dark office. He looked at the pen, then at the city lights bleeding through the rain. He had five million dollars he didn't make, and a partner he couldn't use. The market was quiet. It was perfect. It was dead.

  He capped the pen and put it in his drawer, locking it away, as if containing a virus.
