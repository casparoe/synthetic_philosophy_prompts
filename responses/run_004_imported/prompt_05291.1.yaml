      *   *Check names:* Schaffer, Cotnoir, Eklund, Bennett. Make sure the positions are attributed correctly. Cotnoir is the big name for "Junk is possible."

  6.  **Final Polish:** Organize with clear headings or bullet points for readability. (The user is an engineer/physicist, they like structure).

      *(Self-Correction during final review)*: Wait, I need to be careful about the definition of Junk. Junk usually means "Every object is a proper part of some object." In CEM, the fusion of all objects exists. Is that fusion a proper part of something else? No, because there's nothing outside it to be a part of. So the fusion of all objects is a "maximal" object. Therefore, Junk is incompatible with CEM. Correct.

      Also, need to mention that Schaffer *does* address this. In "Priority Monism" (2010), he acknowledges the junk objection and relies on unrestricted composition. Later literature (Cotnoir 2014) pushes back hard on this. I should mention that the "consensus" isn't settled.

      Okay, ready to write.

