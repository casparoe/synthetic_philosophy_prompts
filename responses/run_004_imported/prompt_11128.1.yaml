prompt: |-
  A friend of mine and I spent much of the walk home from our decision theory reading group last night arguing about whether the "coherence arguments" for expected utility maximization really deliver what their proponents claim. The occasion was Eliezer Yudkowsky's essay "Coherent decisions imply consistent utilities," which my friend reads as showing that any agent facing a long enough sequence of choices will be dragged, on pain of leaving free money on the table, toward acting as if it maximizes some real-valued utility function. When I asked why an agent couldn't simply decline to have any preference at all between certain pairs of options, rather than being forced to rank everything, my friend retreated to a narrower and admittedly more careful line of defense: the money-pump argument for the completeness axiom specifically, of the sort developed at length in Johan Gustafsson's 2022 book on the subject. There, an agent with a genuine gap in its preferences (the example under discussion was a career as a clarinettist versus a career in law) can apparently be walked through a short sequence of trades, none of which its incomplete preferences give it any standing to refuse, that leaves it strictly worse off than where it started.

  I remained unconvinced, because the whole procedure seemed to rely on treating each offered trade as a fresh, memoryless choice rather than as one step in an ongoing policy. An agent that keeps track of which options it has already turned down, and simply refuses ever to accept something ranked below one of those, appears to escape the entire sequence without needing a complete preference ordering anywhere. My friend regarded this as a kind of evasion: a rule invented on the spot to defuse one particular pump is suspicious by its very design, and in any case Gustafsson devotes a whole section of the book to arguing that this general style of history-sensitive, "resolute" response to money pumps does not ultimately work. We went around in circles for the better part of an hour and never settled it.

  I would like your help making my side of the case properly. Could you argue that the money-pump argument for completeness fails to show that rational agents must have complete preferences, on the grounds that its force depends on a substantive and independently unmotivated assumption about which choice rules an agent is permitted to use across a sequence of decisions, rather than following from any minimal requirement of rationality on its own? I would especially like you to engage with my friend's strongest objection – that a choice rule custom-built to survive a known pump is question-begging in exactly the way any ad hoc rescue is – rather than brushing it aside.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A debate between the user and a friend about coherence arguments for Expected Utility Theory (EUT), specifically focusing on the *completeness axiom* and money-pump arguments (referencing Yudkowsky and Gustafsson).
      *   **User's Position:** Money-pump arguments for completeness fail because they assume agents make memoryless, sequential choices rather than following a history-sensitive policy (resolute choice). An agent can refuse trades based on past rejections without needing complete preferences.
      *   **Friend's Position:** Resolute choice is an *ad hoc* evasion custom-built to survive the pump. Gustafsson argues this doesn't work. Rationality requires avoiding the pump, which implies completeness.
      *   **Task:** Argue the user's side. Specifically, show that the money-pump argument relies on unmotivated assumptions about choice rules (memorylessness) rather than minimal rationality. Crucially, *engage* with the friend's "ad hoc" objection, not dismiss it.

  2.  **Deconstruct the Core Philosophical Issue:**
      *   **The Money Pump for Completeness:** If preferences are incomplete (e.g., $A \not\succ B$, $B \not\succ A$, $A \not\sim B$), an agent might accept $A$ for $B$ (since $B \not\succ A$) and then $B$ for $A$ (since $A \not\succ B$), paying a small cost each time, ending up with $A$ minus costs, which is worse than starting $A$.
      *   **The Resolute Choice Counter:** The agent adopts a policy: "If I have previously rejected $X$, I will not accept anything inferior to $X$." Or simply, "I will not cycle." This requires memory and a diachronic policy.
      *   **The "Ad Hoc" Objection:** Why adopt *this* policy? If the agent doesn't care about cycling (because preferences are incomplete), telling them to stop cycling just to avoid the pump assumes they *should* care about the pump outcome more than their local preferences. It looks like assuming the conclusion (that they should act as if they have complete preferences) to save the argument.
      *   **The "Choice Rule" Objection:** The money pump assumes the agent maximizes locally at each node without regard for the tree structure. But rational agency might inherently involve planning over trees.

  3.  **Formulate the Argument Strategy:**
      *   **Acknowledge the Friend's Point:** Validate that "resolute choice" can look like a patch. This builds credibility.
      *   **Shift the Burden of Proof:** The money pump argument claims to derive EUT from *minimal* rationality. If it requires assuming a specific, controversial theory of diachronic choice (myopic vs. resolute), it's not "minimal."
      *   **Attack the "Myopia" Assumption:** The standard money pump assumes *myopic* choice (choosing the best option *now* without considering future nodes). But sophisticated or resolute choice is arguably *more* rational for temporally extended agents.
      *   **Address the "Ad Hoc" Charge:**
          *   Distinguish between *ad hoc* (saved only from this falsification) and *principled* (derived from a broader theory of agency).
          *   Argue that policy-based choice is the *default* for rational agents, not the exception.
          *   Show that the "completeness" requirement is actually the more *ad hoc* imposition because it demands a preference relation where the agent genuinely has none.
      *   **Engage Gustafsson:** Acknowledge his work but point out that his rejection of resolute choice relies on specific normative premises about what counts as a "reason" for choice, which are contestable.
      *   **Conclusion:** The money pump doesn't prove completeness; it proves that *myopic* agents with incomplete preferences are vulnerable. Since rationality doesn't require myopia, completeness isn't mandated.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Validate the user's intuition. The debate is classic (McClennen vs. Rabinowicz, etc.). State the thesis: The money pump argument smuggles in a controversial theory of diachronic rationality (myopia).
      *   **Point 1: The Hidden Premise (Myopia):** The money pump only works if the agent treats each node as a new, isolated decision. This is "myopic choice." But rational agents can plan. If you can plan, you can adopt a policy to avoid cycles.
      *   **Point 2: Addressing the "Ad Hoc" Objection:** This is the crux.
          *   *Friend's view:* You only adopt the policy to stop the pump.
          *   *Counter:* Agents *always* use policies. "Don't smoke" is a policy to avoid a health pump. Adopting a policy to avoid financial loss isn't ad hoc; it's instrumental rationality.
          *   *Key Distinction:* The policy isn't "maximize utility" (which assumes completeness). The policy is "avoid dominated outcomes." One can want to avoid dominated outcomes without having a complete ordering of the intermediate steps.
          *   *Reversing the Charge:* It is arguably *more* ad hoc to insist an agent *must* have a preference between Law and Clarinet just to satisfy a mathematical theorem, when they genuinely feel indifferent or undecided.
      *   **Point 3: Gustafsson's Specific Critique:** Gustafsson argues resolute choice violates "Choice Consistency" or similar norms.
          *   Counter: These norms presuppose that preferences drive choice at every node independently. If we reject that model (in favor of planning), the norms lose force. Gustafsson assumes the conclusion (that local choice constraints bind) to prove the conclusion.
      *   **Point 4: The Nature of Incompleteness:** Incompleteness isn't ignorance; it's a lack of comparative value. Forcing a comparison creates a fiction. A policy-based agent respects the gap locally but manages the global outcome.
      *   **Conclusion:** The money pump shows that *unrestricted myopic choice* + *incompleteness* = vulnerability. It does not show that *rationality* + *incompleteness* = vulnerability, because rationality permits (and often requires) non-myopic planning.

  5.  **Refining the Tone:**
      *   Needs to be philosophical, precise, and respectful of the friend's position (Gustafsson/Yudkowsky are serious thinkers).
      *   Avoid dismissiveness. Use terms like "diachronic rationality," "myopic vs. sophisticated choice," "normative premises."
      *   Ensure the "ad hoc" point is handled carefully. It's the hardest part.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address Gustafsson specifically? *Adjustment:* Need to mention his specific argument about "reasons" and why resolute choice might be seen as lacking a reason at the second node.
      *   *Check:* Did I address the "ad hoc" claim? *Adjustment:* Make sure to argue that policy-based choice is a *general* feature of agency, not a specific patch for money pumps.
      *   *Check:* Is the distinction between "completeness" and "avoiding dominance" clear? *Adjustment:* Emphasize that you can avoid dominance (the bad outcome) without filling in the preference gap (the local ranking).

  7.  **Final Polish:** Organize into clear arguments. (1) The Myopia Assumption, (2) The "Ad Hoc" Rebuttal, (3) The Burden of Proof regarding Gustafsson. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful not to conflate "sophisticated choice" (backward induction) with "resolute choice" (binding oneself). In the context of incomplete preferences, resolute choice is usually the relevant counter because sophisticated choice often requires complete preferences to do the backward induction. I should focus on *policy-based* or *resolute* choice as a general category of non-myopic agency.

  Let's refine the "Ad Hoc" rebuttal. The friend says: "You only choose this policy to stop the pump." The response should be: "No, I choose this policy because I prefer not to lose money. That preference (Money > No Money) is complete, even if (Law > Clarinet) is not. The pump exploits the gap to attack the complete preference. Protecting the complete preference via policy is rational." Wait, that might concede too much to EUT.
  Better argument: The agent has a complete preference over *outcomes* (Start > End-with-loss) but incomplete preferences over *options* (Law vs Clarinet). The money pump argues that to get the former, you need the latter. The counter is that you can secure the former via a rule without instantiating the latter. The rule isn't ad hoc; it's an instrument to secure a genuine preference (keeping money).

  Okay, ready to write.
answer: |-
  This is a sophisticated dispute that cuts to the heart of normative decision theory. You are effectively channeling the critique raised by philosophers like Edward McClennen (in *Rationality and Dynamic Choice*) against the standard Dutch Book/Money Pump arguments, while your friend is defending the neo-classical orthodoxy recently systematized by Johan Gustafsson.

  Your intuition is correct: the money-pump argument for completeness does not follow from "minimal rationality" alone. It relies on a substantive, controversial, and often unstated assumption about the **temporal structure of agency**—specifically, that rational agents must choose *myopically* (node-by-node) rather than *diachronically* (via policies or plans).

  Here is a structured argument you can use to make your case, with specific attention to neutralizing the "ad hoc" objection.

  ### 1. The Hidden Premise: Myopia vs. Planning

  The first step is to expose the mechanical assumption required to make the pump turn. The money-pump argument for completeness only works if the agent is forced to treat every offer as an isolated, memoryless event. In decision-theoretic terms, this assumes **myopic choice**.

  *   **Myopic Choice:** At every node, the agent asks, "Given my current preferences, is this trade strictly better than my current holding?" If the answer is "no" (because the preferences are incomplete), but also "no" to the reverse, the agent might accept the trade simply because there is no preference *against* it.
  *   **Diachronic/Resolute Choice:** The agent views the sequence of offers as a single decision tree. They ask, "Which path through this tree leads to the best outcome?" and adopt a policy to follow that path.

  **The Argument:**
  If rationality permits an agent to form plans and bind themselves to them (which it surely does; this is how humans avoid procrastination, addiction, and other dynamic inconsistencies), then an agent with incomplete preferences can simply adopt the policy: *"I will not accept any trade that results in a final outcome I know is worse than my starting point."*

  Since the agent prefers (Starting Career) to (Starting Career minus $100), they have a complete preference over the *outcomes* of the pump. They do not need a complete preference between (Law) and (Clarinet) to recognize that (Law) is better than (Law minus $100). The money pump exploits the local gap to violate the global preference. Closing the global loop via policy does not require filling the local gap.

  Therefore, the money pump does not prove that agents *must* have complete preferences. It proves that **myopic** agents with incomplete preferences are vulnerable. Since rationality does not require myopia, the argument fails.

  ### 2. Engaging the "Ad Hoc" Objection

  This is the crux of your friend's defense. They argue that adopting a "resolute" policy just to avoid the pump is question-begging: you are inventing a rule solely to save the theory from falsification. Gustafsson argues that at the second node of the pump, the agent lacks a "reason" to refuse the trade if their preferences are truly incomplete.

  Here is how you counter that charge without dismissing it:

  **A. Distinguish "Ad Hoc" from "Instrumental"**
  A rule is *ad hoc* if it is designed solely to save a hypothesis and has no independent justification. A rule is *instrumental* if it serves a broader, independent goal.
  *   **Your Friend's Claim:** The policy "Don't cycle" is ad hoc because it exists only to stop the pump.
  *   **Your Rebuttal:** The policy is not "Don't cycle." The policy is **"Secure the best available outcome."**
      The agent genuinely prefers keeping their money to losing it. That is a complete preference. The money pump is a mechanism that threatens this complete preference by leveraging a local incompleteness. Adopting a strategy to protect a genuine preference (keeping money) is the definition of instrumental rationality, not an ad hoc patch. It is no more ad hoc than a smoker adopting a "never buy cigarettes" policy to protect their health preference, even if they locally crave a cigarette.

  **B. Reverse the Charge of Ad Hoc-ness**
  You can argue that it is actually the *completeness axiom* that is ad hoc in this context.
  *   In the Clarinet vs. Law case, the agent genuinely feels no comparative value. To insist they *must* assign a real number to each to satisfy a theorem is to impose a mathematical structure onto a psychological reality that lacks it.
  *   Forcing the agent to say "I prefer Law to Clarinet" just to stop the pump is inventing a preference that doesn't exist.
  *   In contrast, adopting a *rule of conduct* ("I will not trade away my current position for a cycle") does not invent a preference between Law and Clarinet. It merely acknowledges a preference between **Status Quo** and **Exploited Status Quo**. The rule respects the incompleteness locally while managing the consequences globally.

  **C. Addressing Gustafsson's "Reasons" Argument**
  Gustafsson argues that at the second node of the pump, if you previously rejected $B$ for $A$, you cannot now reject $A$ for $B$ without a change in preference. He claims resolute choice violates the norm that "choice must be guided by current preferences."
  *   **Your Counter:** This norm ("Choice must be guided by *current* local preferences") is precisely what is at stake. It presupposes that agency is a sequence of snapshots rather than a continuous narrative.
  *   If I decide on Monday to diet, and on Tuesday I am offered cake, my "current local preference" might favor cake. If I refuse the cake, am I being irrational? No, I am being **resolute**. I am allowing my past rational planning to constrain my current local choice.
  *   Gustafsson's argument against resolute choice assumes that past plans cannot constitute a valid reason for current choice unless current preferences align with them. But this denies the possibility of planning itself. If rationality includes the capacity to plan, then "because I decided this was the optimal path yesterday" *is* a valid reason for choice today, even if my local preferences have not changed.

  ### 3. The Burden of Proof

  Finally, shift the burden of proof back to your friend. The coherence arguments are marketed as deriving Expected Utility Theory from "minimal" or "qualitative" constraints on rationality (like "don't leave money on the table").

  *   **Your Argument:** If the derivation requires assuming that agents are forbidden from using memory, forbidden from forming policies, and forbidden from letting past decisions constrain current ones, then it is not deriving EUT from *minimal* rationality. It is deriving EUT from *minimal rationality + a controversial theory of temporal agency.*
  *   Since the "controversial theory of temporal agency" (myopia) is arguably *less* intuitive than the idea that agents can have incomplete preferences, the argument fails to establish its conclusion. It shows that **Incomplete Preferences + Myopia = Irrationality**. It does not show that **Incomplete Preferences = Irrationality**.

  ### Summary for Your Friend

  You might summarize your position to your friend like this:

  > "I agree that an agent shouldn't end up strictly worse off than they started. But the money pump only forces that outcome if the agent is forbidden from treating the sequence of trades as a single problem to be solved.
  >
  > You call resolute choice 'ad hoc,' but I see it as the standard operation of planning. If I can plan to avoid a health pump (addiction), I can plan to avoid a money pump. The rule isn't 'maximize utility' (which assumes completeness); the rule is 'don't accept dominated outcomes.' I can follow that rule without ever deciding whether I prefer Law to Clarinet.
  >
  > Gustafsson's objection rests on the idea that a past decision cannot provide a reason for a current choice unless my local preferences support it. But that denies the possibility of binding plans altogether. If you accept that rational agents can make plans that constrain their future selves, the money pump for completeness dissolves. It doesn't show I need complete preferences; it shows I need a memory."

  ### Recommended Reading for Ammunition
  If you want to deepen the technical backing for this:
  1.  **Edward McClennen, *Rationality and Dynamic Choice* (1990):** The seminal work arguing that resolute choice is a coherent alternative to sophisticated/myopic choice.
  2.  **Isaac Levi, *The Enterprise of Knowledge* (1980):** Defends incomplete preferences (E-admissibility) and argues against the idea that rationality requires a single utility function.
  3.  **Hedden, "Dynamic Choice without Order" (2015):** Discusses how dynamic choice can be handled without completeness.
  4.  **Gustafsson's own concessions:** Note that Gustafsson admits resolute choice *works* to avoid the pump; his argument is purely normative (that it *shouldn't* be allowed). This highlights that the dispute is about the *norms of agency*, not the mechanics of the pump.

  By framing the dispute as one about the **nature of diachronic agency** rather than just preference orderings, you show that the "coherence" argument is not a free-standing proof, but a conditional one that relies on assumptions your friend has not justified.
