answer: |-
  Nietzsche is holding court in a café in Turin, lecturing a young disciple on the final chapter of *Ecce Homo*.

  "My friends," Nietzsche declares, stroking his mustache, "forget 'God,' 'soul,' and 'sin.' These are nothing! The only true morality is hygiene! A single piece of heavy German bread is a greater crime against the spirit than all the Commandments. I am so clever because I finally realized that wisdom begins in the intestines."

  The disciple looks down at Nietzsche's untouched plate, noticing the philosopher is visibly shaking from a migraine.

  "But Master," the disciple whispers, "with all due respect... you haven't kept a meal down in three weeks. You've spent the last twenty years chasing climates from Nice to Sils Maria, and you're still dying."

  Nietzsche adjusts his scarf, eyes watering. "Precisely! Do you think a healthy man would ever discover the importance of digestion? I am not sick, my friend. I am simply the only man clever enough to suffer from the truth."
