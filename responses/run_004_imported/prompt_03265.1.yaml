      *   *Modern Resolution:* Functional Decision Theory (FDT) or Logical Decision Theory (LDT) suggests you should act as if your decision algorithm determines the prediction. But in the classic setup, if the prediction is *already written* based on a perfect model of you, you are essentially locked in.
