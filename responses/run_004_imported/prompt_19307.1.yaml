  **Move 1 (Marcus):** This is a logically sound observation known in social choice theory as the "discursive dilemma." Marcus correctly identifies that while there are majorities for the *premises* (Impact and Tech), there is no majority for the *conclusion* (Promotion). Only one person (Priya) holds the complete mental model that justifies the promotion. His point highlights a genuine risk of the premise-based method: it can produce an outcome that no majority of individuals actually endorse as a whole.

  **Move 2 (Deb):** This is the counter-observation that validates the "premise-based procedure." Deb is correct that if the rubric defines truth as the aggregation of axis scores, then the majorities on those axes are objective facts within the system. If the committee agrees Tech is "yes" and Impact is "yes," the rubric functions as an algorithm that must output "promote." Her argument is structurally consistent with how rubrics are designed to minimize holistic bias.

  **Move 3 (Marcus):** This argument relies on a standard majority vote but fails to account for the purpose of the rubric. While democratically intuitive, treating the final vote as supreme renders the axis scoring redundant. In a calibration system designed to enforce specific standards (Impact + Tech), allowing a holistic "no" vote to override clear axis majorities introduces the exact subjectivity the rubric was meant to prevent. It's not "wrong," but it weakens the system's integrity.

  **Move 4 (Deb):** This is the strongest systemic argument. Deb correctly points out that if the raw promote/don't-promote tally overrides the axis scoring, the rubric is effectively decorative. For a calibration process to function as a governance tool rather than a suggestion box, the decision rule must constrain the outcome. If the rule doesn't change the result compared to a simple thumbs-up/down, the organization is wasting time scoring axes.

  ### The Bigger Issue

  Both Marcus and Deb are reenacting a classic problem in judgment aggregation called the **Doctrinal Paradox**, but they are missing the actual governance failure: **HR decided the aggregation method post-hoc.**

  In any high-stakes evaluation system, the method for combining individual judgments into a collective decision must be defined *before* the voting begins. By choosing the premise-based method (Deb's way) only after seeing the votes, HR set a precedent that the rules can be interpreted to fit the desired outcome, which erodes trust in the system.

  Furthermore, the underlying tension reveals a **calibration failure**. Marcus and Deb clearly have different internal weightings for the axes (Marcus prioritizes Tech, Deb prioritizes Impact). A successful calibration session should have aligned their understanding of what "clearing the bar" means *before* they voted. The fact that they left the room with fundamentally different interpretations of the candidate's profile suggests the rubric isn't being applied consistently, regardless of which tallying method is used.
