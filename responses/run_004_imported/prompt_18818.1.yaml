answer: |-
  Here is a model answer you can adapt for your seminar. It reconstructs the argument to highlight the dynamic constraint, then takes a hard line on the Adams/Edgington view to force the students to grapple with the costs of the alternative.

  ***

  ### The Dynamic Trap: Why Lewis's Result Isn't Just About the Equation

  Your students are half-right, but for the wrong reasons. They have correctly identified the conclusion (conditionals likely lack truth conditions) but have missed the mechanism (the requirement of *dynamic stability*). If you present Lewis's 1976 result as merely a contradiction between "The Equation" ($P(A \to B) = P(B|A)$) and "Truth Conditions," you invite the objection that we should just drop The Equation. But The Equation is too empirically robust to discard; it captures a fundamental feature of how we reason. The real force of Lewis's argument is that you cannot have truth conditions *and* maintain The Equation across *learning experiences*.

  To embarrass the CliffsNotes reading, you need to show them that the triviality result is not a static inconsistency, but a dynamic impossibility.

  #### 1. The Logical Shape of the Trap

  Start by distinguishing two claims:
  1.  **Static Equation:** For my *current* credence function $P$, $P(A \to B) = P(B|A)$.
  2.  **Dynamic Equation:** For any credence function $P^*$ in the class of rational updates of $P$ (specifically, conditionalizations), $P^*(A \to B) = P^*(B|A)$.

  Lewis's proof assumes $A \to B$ expresses a proposition with fixed truth conditions. Let's call the set of worlds where it is true $[A \to B]$. Because it is a proposition, its truth value at a world is fixed; it does not change when we acquire new evidence. What changes is our *credence* in that proposition.

  The trap springs when we consider what happens when we conditionalize on the conditional itself. Suppose we update on the news that $A \to B$ is true. Our new credence function is $P_{A \to B}(\cdot) = P(\cdot | A \to B)$.
  *   By the definition of conditionalization, $P_{A \to B}(A \to B) = 1$.
  *   If the **Dynamic Equation** holds, then $P_{A \to B}(B|A)$ must also equal 1.
  *   This implies $P(B | A \land (A \to B)) = 1$. This is unproblematic; if $A$ is true and the conditional is true, $B$ must be true.

  Now consider the negation. Suppose we update on $\neg(A \to B)$. Our new function is $P_{\neg(A \to B)}$.
  *   $P_{\neg(A \to B)}(A \to B) = 0$.
  *   If the **Dynamic Equation** holds, then $P_{\neg(A \to B)}(B|A)$ must also equal 0.
  *   This implies $P(B | A \land \neg(A \to B)) = 0$.

  Here is where the algebra collapses the space. We can expand the unconditional conditional probability $P(B|A)$ using the Law of Total Probability over the partition $\{A \to B, \neg(A \to B)\}$:

  $$P(B|A) = P(B | A \land (A \to B)) \cdot P(A \to B | A) + P(B | A \land \neg(A \to B)) \cdot P(\neg(A \to B) | A)$$

  Substitute the values derived from the Dynamic Equation constraints (1 and 0):

  $$P(B|A) = 1 \cdot P(A \to B | A) + 0 \cdot P(\neg(A \to B) | A)$$
  $$P(B|A) = P(A \to B | A)$$

  By the **Static Equation**, we also know $P(A \to B) = P(B|A)$. For these to cohere across updates, Lewis shows that $P(B|A)$ must be independent of the probability of the conditional proposition itself. Ultimately, this forces $P(B|A)$ to take only extreme values (0 or 1) or to equal $P(B)$, rendering the agent trivial (unable to have non-extreme conditional beliefs).

  **Why the Rich Algebra Matters:**
  This proof requires a "rich" algebra of propositions because we need to be able to vary $P(B|A)$ independently of $P(A \to B)$ in the initial state. If the space were too simple (e.g., only four worlds), the constraints might not generate a contradiction. The triviality result holds specifically for agents who can entertain non-trivial uncertainties about $B$ given $A$.

  **The Crucial Takeaway:**
  If we only demanded the **Static Equation**, we could assign truth conditions to $A \to B$ *ad hoc* to satisfy the equation for our current $P$. We could make $[A \to B]$ true at exactly the worlds needed to make the probabilities match. The contradiction arises only because we demand the Equation survive **conditionalization**. The truth conditions are fixed, but the conditional probability $P(B|A)$ shifts when we learn new evidence $C$. Lewis proves there is no fixed proposition $[A \to B]$ whose probability can track those shifts for all possible $C$.

  #### 2. The Verdict: Defending the Adams/Edgington Line

  So, where does this leave us? You asked for a side. I defend the **Adams/Edgington "No Truth Value" thesis**.

  Lewis's result is a *reductio ad absurdum* of the assumption that indicative conditionals express propositions. Since the probability data (The Equation) is too central to our epistemic practice to discard, and the requirement that our credences update via conditionalization is too central to Bayesianism to discard, the premise that must go is the propositionhood of the conditional.

  Conditionals are not descriptions of the world; they are *constraints* on credence functions. To assert "If A, B" is not to state a fact that obtains at a set of worlds, but to propose a change in the listener's conditional credence. This vindicates the students' intuition that conditionals lack truth conditions, but grounds it in the dynamic argument they missed.

  **The Ugly Cost:**
  I will not sugarcoat the cost of this view. It is the **Frege-Geach problem** (the problem of unasserted contexts). If conditionals have no truth conditions, how do they function in logical embeddings?
  *   *Modus Ponens:* If $A \to B$ has no truth value, in what sense does $A$ and $A \to B$ *entail* $B$?
  *   *Disjunctions:* What does it mean to assert $(A \to B) \lor (C \to D)$?
  *   *Attitude Reports:* "John believes that if A, B." If there is no proposition that $A \to B$, what is the content of John's belief?

  Adams and Edgington must argue that validity is not truth-preservation but *uncertainty-preservation*, and that embeddings are pragmatic or syntactic shorthands for more complex probabilistic attitudes. This is technically demanding and often feels like special pleading compared to the clean semantics of material or strict conditionals.

  **Why the Alternatives Are Worse:**
  You must reject the other options not because they are impossible, but because they are more costly than the Frege-Geach problem.

  1.  **Stalnaker's Contextualist Retreat:** Stalnaker suggests we can save truth conditions if we allow the *proposition expressed* by $A \to B$ to shift depending on the context (the credence function).
      *   *The Cost:* This saves truth conditions only by making them ephemeral. The Equation no longer holds as a semantic law; it holds only as a pragmatic coincidence relative to a specific context. It renders the connection between conditionals and conditional probability accidental rather than essential. It saves the letter of "truth conditions" while sacrificing the explanatory power of the semantics.

  2.  **Kratzer's Restrictor View:** Kratzer argues "if" is not a connective but a restrictor on a covert modal.
      *   *The Cost:* This dissolves the triviality result by denying the syntax that generates it (there is no $A \to B$ proposition). While linguistically powerful, it is a revisionary metaphysics of language. It forces us to say that in "If it rains, the match is cancelled," there is no conditional proposition being evaluated, only a modal claim about necessity restricted to rain-worlds. It solves the problem by changing the subject.

  3.  **Trivalent Logics:** We could allow conditionals to be true, false, or void (when $A$ is false).
      *   *The Cost:* This requires abandoning classical probability theory and logic. We lose the Law of Excluded Middle and standard Bayesian updating. The cost to our general theory of rationality is far higher than the cost of handling embeddings expressivistically.

  #### 3. Conclusion for the Seminar

  Tell your students this: Lewis did not prove that conditionals are weird. He proved that **probability is fundamental**.

  If you treat conditional credence as the basic phenomenon, Lewis's result shows that you cannot map it onto a classical truth-conditional semantics without breaking the probability calculus. The Adams view accepts this. It says: "The Equation is right. The updating is right. Therefore, the proposition is a ghost."

  Their response papers should not just say "Conditionals have no truth values." They should explain *why* the demand for dynamic stability makes truth conditions impossible, and then confront the Frege-Geach problem head-on. If they cannot explain how to validate *Modus Ponens* without truth conditions, they have not earned the right to cite Lewis.
