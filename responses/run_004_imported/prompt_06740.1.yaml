answer: |-
  This is a remarkably precise distillation of the "boundary problem" as it plays out in real time. Your dinner companions have effectively reenacted a debate that occupies entire semesters in political philosophy seminars. Alina is arguing from the **All-Affected Interests (AAI)** principle, while Ben is defending a version of the **All-Subjected Principle** (or *demos* as a pre-existing political community).

  Here is an analysis of the exchange move-by-move, followed by what is missing from the theoretical framework they are using.

  ### Move-by-Move Analysis

  **(1) Alina's Opening: The Stakeholder Principle**
  *   **The Argument:** Legitimacy requires enfranchising those whose lives are most permanently rearranged. Excluding long-term residents (EU nationals in UK, Brits in EU) while including transient Commonwealth citizens violates this.
  *   **Who has the better of it?** **Alina.**
  *   **Why:** Normatively, her intuition is stronger. In a referendum specifically about membership in a supranational body, the "stakes" are clearly higher for those whose residency rights and cross-border lives are directly altered. Ben has no immediate counter to the moral weight of excluding a Polish nurse with 20 years of residence while including an Australian with 8 months. Alina successfully identifies that the franchise used (Westminster parliamentary) was mismatched to the question asked (constitutional/EU membership).

  **(2) Ben's Reply: The Bright Line Defense**
  *   **The Argument:** "Affected interests" are infinitely expandable (exporters, in-laws). We need a workable bright line. Citizenship is a reasonable proxy for long-term stake.
  *   **Who has the better of it?** **Ben.**
  *   **Why:** Alina's principle suffers from the "boundary problem" itself: if everyone affected gets a vote, where does it stop? Does a German car manufacturer affected by tariffs get a vote? Ben correctly identifies that operationalizing "stakes" is administratively impossible. A bright line is necessary for a vote to occur at all. However, he concedes too much by admitting citizenship is only a "proxy," which leaves him vulnerable to Alina's next move.

  **(3) Alina's Rebuttal: The Historical Accident**
  *   **The Argument:** The "citizenship line" isn't even clean. It includes Maltese/Cypriot nationals (via Commonwealth rules) while excluding other EU nationals. This is historical path-dependence, not principle.
  *   **Who has the better of it?** **Alina.**
  *   **Why:** This is her strongest tactical move. She dismantles Ben's defense of "citizenship" as a coherent category. If the boundary is supposed to represent a political community, it cannot arbitrarily include citizens of one EU state (Malta) while excluding citizens of another (Poland) based on 1950s colonial arrangements. Ben's "bright line" is revealed to be jagged. Alina proves the rule isn't just imperfect; it's incoherent relative to the specific issue at hand.

  **(4) Ben's Response: The Stability Defense**
  *   **The Argument:** All citizenship regimes are full of accidents (birthright, treaties). Path-dependence doesn't invalidate legitimacy. Stability and general reliability matter more than derivation from first principles.
  *   **Who has the better of it?** **Ben.**
  *   **Why:** Alina implies that historical contingency invalidates legitimacy. Ben correctly notes that *all* political boundaries are historically contingent. If we disqualified every franchise rule that relied on historical accidents, no state would be legitimate. He shifts the ground from "moral perfection" to "political stability," which is a defensible position for maintaining order. He wins on the reality of how states function, even if he loses on moral precision.

  **(5) Alina's Last Word: The Systematic Error**
  *   **The Argument:** "Generally reliable" fails if the errors cluster at the highest-stakes cases. A proxy that systematically excludes the most affected is measuring the wrong thing.
  *   **Who has the better of it?** **Alina.**
  *   **Why:** This is a devastating statistical and philosophical critique. A proxy (citizenship) is acceptable if its errors are random. If the errors are *systematic*—specifically excluding the group with the most to lose—the proxy is biased, not just noisy. Ben's defense of "stability" does not answer the charge of "systematic exclusion." Alina successfully argues that for *this specific type of decision* (constitutional change), the standard for the proxy must be higher than for routine parliamentary elections.

  ---

  ### What Both Are Missing

  While Alina wins the moral argument and Ben wins the pragmatic one, neither resolves the underlying "boundary problem." Here is what is absent from their exchange that would be necessary to actually settle the question.

  **1. The Distinction Between *Constituted* and *Constitutive* Power**
  Both Alina and Ben treat the referendum as a standard policy decision where the *demos* (the people) is already fixed.
  *   **The Missing Piece:** A referendum on leaving the EU is a *constitutive* act—it changes the very nature of the sovereign unit. Political theorist **Arash Abizadeh** argues that boundaries themselves must be democratically justified to those on both sides.
  *   **Why it matters:** If the vote changes the boundary of the polity, the "people" entitled to vote cannot simply be the pre-existing citizens of one side (Ben's view), nor can it be everyone vaguely affected (Alina's view). It requires a theory of *joint* decision-making. Neither accounts for the fact that the vote unilaterally altered the status of EU citizens without their input, violating the reciprocity required for boundary changes.

  **2. The "All-Subjected" vs. "All-Affected" Distinction**
  Alina argues for "All-Affected" (stakes). Ben argues for "Citizenship" (which implies "All-Subjected" to the law).
  *   **The Missing Piece:** They miss the nuance of **residency vs. citizenship**. A stronger middle ground exists: the *All-Subjected Principle* applied to *coercive law*.
  *   **Why it matters:** EU nationals in the UK were subject to UK law, but the referendum wasn't about UK law; it was about the *source* of that law (EU vs. UK). However, they were subject to the *consequences* of the change. The missing theoretical tool here is **López-Guerra's "capacity for autonomy" argument**: voting rights should go to those who need the vote to protect their autonomy. The Polish nurse's autonomy was more threatened than the Australian banker's. Neither friend explicitly anchors "stakes" to *autonomy*, which would strengthen Alina's case without falling into Ben's "infinite expansion" trap.

  **3. The Second-Order Rule Problem (Whelan's Paradox)**
  You mentioned Whelan, but neither friend fully grapples with his paradox.
  *   **The Missing Piece:** The rule for *who votes* was set by the UK Parliament, not by the people voting.
  *   **Why it matters:** Alina argues the outcome is illegitimate because of the franchise. Ben argues the franchise is legitimate because it is stable. Both miss that the franchise rule itself was a piece of legislation passed by a Parliament elected under *different* rules. The boundary problem is a regress: you need a demos to decide the boundary, but you need a boundary to define the demos. The only way out is to acknowledge that the 2016 franchise was a **political settlement**, not a philosophical truth. It was a compromise to get the bill passed in Parliament. Acknowledging this removes the quest for "legitimacy" in a philosophical sense and replaces it with "authority" in a legal sense.

  **4. Reciprocity and the "External Franchise"**
  *   **The Missing Piece:** Neither mentions the asymmetry of the exclusion.
  *   **Why it matters:** British expats in the EU (under 15 years) *could* vote, but EU expats in the UK *could not*. If the principle were "affected stakeholders," both should vote or neither. If the principle were "citizenship," neither should vote (since it's an international treaty change). The specific asymmetry suggests the franchise was designed to maximize the "Leave" vote potential (older Brits abroad were often Eurosceptic, while EU nationals in the UK were overwhelmingly Remain). Ignoring the *strategic* selection of the boundary ignores the most likely explanation for why the line was drawn where it was.

  ### Summary for Your Feature
  If you are looking for a conclusion to the piece: Alina is right that the franchise failed the test of democratic equality regarding stakes, specifically because the errors were systematic. Ben is right that no franchise is philosophically pure.

  But the truth they missed is that the "boundary problem" is rarely solved by theory; it is solved by **power**. The boundary of the 2016 demos was drawn not to solve Whelan's puzzle, but to win the vote. The illegitimacy Alina senses isn't just philosophical; it's the result of using a tool (national citizenship) to solve a problem (supranational membership) it was never designed to measure.
