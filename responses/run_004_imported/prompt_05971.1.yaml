answer: |-
  This is a sharp intuition, and you have correctly identified the structural isomorphism between the problem of long-term causal prediction and the problem of many-body dynamics. You haven't committed a category error; you have essentially reinvented **Expected Consequentialism** but grounded it in a physicalist epistemology rather than standard decision theory.

  However, your self-skepticism is warranted. The analogy breaks down at the point of **measure justification**. Here is the honest assessment of where the argument holds and where it fails, using the terminology you're comfortable with.

  ### 1. The Strength: The Move from Trajectories to Densities
  You are absolutely right that the standard objection to consequentialism (Lenman/Greaves) relies on a demand for trajectory tracking. If morality requires knowing the specific microstate of the future (who gets born, etc.), it is computationally impossible due to positive Lyapunov exponents in the causal chain.

  Your move to density functions (ensembles) is the standard physicist's workaround for chaos. In philosophy, this corresponds to shifting from **Actual Consequentialism** (rightness depends on what *actually* happens) to **Expected Consequentialism** (rightness depends on the expectation value of the good).

  So far, so good. Greaves actually grants that *if* one can assign probabilities, the problem dissolves. She argues the problem is that we *can't*.

  ### 2. The Weakness: The Measure Problem
  This is the critical failure point you suspected.

  In statistical mechanics, the ensemble average $\langle A \rangle = \int A(\Gamma) \rho(\Gamma) d\Gamma$ is licensed by the **Liouville measure**. We know $d\Gamma$ is preserved under Hamiltonian flow. We justify $\rho$ via the Principle of Maximum Entropy or the Ergodic Hypothesis (time averages = ensemble averages). Crucially, we assume the system is **mixing**.

  In the moral/causal case:
  1.  **No Phase Space Metric:** There is no natural measure on the space of "possible futures." Is a future where humanity goes extinct distance $d=1$ or $d=\infty$ from a future where it thrives? Without a metric, you cannot define a volume, and without a volume, you cannot define a uniform prior.
  2.  **No Ergodicity:** We have $N=1$ universe. We cannot rerun the experiment to check if our ensemble matches the frequency of outcomes. In physics, we validate the canonical ensemble against empirical thermodynamics. In ethics, the "thermodynamics" (historical outcomes) is a single trajectory. You cannot distinguish between a low-probability event that happened and a high-probability law.
  3.  **Non-Mixing Social Dynamics:** You mentioned turbulence. In turbulence, we have intermittency and coherent structures that persist longer than the Kolmogorov time scale. Social/institutional effects (the "ripples" Lenman worries about) are often *more* like coherent structures than molecular collisions. They don't decorrelate (molecular chaos/Stosszahlansatz) quickly. If correlations persist over the moral horizon, the Central Limit Theorem doesn't kick in, and the variance doesn't shrink.

  **The Verdict:** You are trying to solve an **Epistemic Uncertainty** (Knightian uncertainty) problem using **Risk** (probabilistic) tools. Greaves' "complex cluelessness" is precisely the claim that the probability distribution $\rho$ is undefined, not just unknown. By positing an ensemble, you are assuming the existence of a measure that the objection claims is unavailable.

  ### 3. The Convergence Problem (Fat Tails)
  As a turbulence person, you know that moments don't always converge. In moral philosophy, this is the **Pascal's Mugging** problem.

  If the utility function $U$ is unbounded and the probability distribution of impacts has a fat tail (which is plausible for existential risks or technological singularities), the expected value integral $\int U \cdot P(U) dU$ may diverge or be dominated by extremely low-probability, high-impact events.

  In stat mech, energy is conserved, bounding the phase space. In ethics, there is no conservation of "good." If your ensemble allows for infinite value (e.g., infinite future generations), the expectation value becomes undefined regardless of how well you define the measure. This renders the ensemble averaging move useless for action guidance.

  ### 4. Literature Check
  You are not the first to make this move, but the literature suggests it hits the same wall you identified.

  *   **Harsanyi (1955)** and **Rule Utilitarianism:** Tried to use subjective expected utility. The objection remains: subjective priors are arbitrary in the absence of data.
  *   **Greaves (2016), "Cluelessness":** She explicitly addresses the "probabilistic response." She argues that for complex cluelessness, we lack the background theory to justify *any* specific probability assignment. It's not just ignorance; it's a lack of a model.
  *   **James Lenman (2000):** Argues that the causal chains are not independent (violating your molecular chaos assumption).
  *   **Hilary Greaves & William MacAskill (Longtermism):** They try to push through this by arguing that *some* predictions are robust (e.g., reducing existential risk increases the expected size of the future). They essentially argue that for *some* variables, the "macroscopic" properties are decoupled from the "microscopic" chaos. This is the closest to your stat mech intuition: trying to find moral "state variables" (like pressure) that are insensitive to micro-details.
  *   **Isaac Levi / Decision Theory under Ambiguity:** This literature distinguishes between risk (known $\rho$) and ambiguity (unknown $\rho$). Your argument attempts to reduce ambiguity to risk. Most decision theorists say this is illegitimate without a justification for the prior (like MaxEnt, which requires constraints you don't have in ethics).

  ### 5. Summary of Critique
  **Where it holds:** The structural analogy between chaotic causal chains and many-body dynamics is sound. The move to Expected Consequentialism is the only viable path forward for a consequentialist.

  **Where it fails:**
  1.  **Justification of the Prior:** In physics, symmetries justify the measure. In ethics, positing a distribution is an act of faith, not inference. You are smuggling in objectivity where there is only subjective credence.
  2.  **Independence Assumptions:** Social causal chains do not satisfy the *Stosszahlansatz*. Correlations persist, preventing the "washing out" of micro-details.
  3.  **Divergence:** Unbounded utility + fat tails = undefined expectations.

  **Recommendation:**
  If you want to pursue this, don't argue that the ensemble *solves* cluelessness. Argue that **Macro-Consequentialism** is the ethical equivalent of Thermodynamics.
  Identify "moral state variables" (e.g., institutional stability, existential risk probability) that are **renormalization group invariant**—i.e., their value at the macro scale is insensitive to the micro-scale causal chaos.

  This avoids the need to integrate over the whole future (which diverges) and focuses on the "hydrodynamic limit" of ethics. This is effectively what the "Longtermist" wing of effective altruism attempts, though they rarely use the stat mech vocabulary. You might find you can formalize their intuition better than they have.

  **Bottom line:** It's not a category error, but it is an **underdetermined model**. You have the formalism, but you lack the boundary conditions and the Hamiltonian.
