      *   *The Weak Point:* The user already identified it. In stat mech, the microcanonical/canonical ensembles aren't just "ignorance"; they are grounded in physical laws (Liouville's theorem, conservation of energy, ergodic hypothesis). In ethics, what grounds the measure on the space of possible futures?
      *   *Literature Check:* Has this been done?
