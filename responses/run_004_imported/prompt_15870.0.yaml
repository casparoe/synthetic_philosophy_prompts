prompt: |-
  I'm several chapters into a historical novel built around a formal philosophical disputation, a vāda, that I've invented for a fictional North Indian royal court in the early medieval period. My protagonist is a young Naiyāyika logician who has been given the unenviable task of defending her school's list of four pramāṇas against a visiting monk trained in the pramāṇa tradition of Dignāga and Dharmakīrti, whose lineage recognizes only perception and inference as genuine sources of knowledge. The scene I keep putting off concerns upamāna, comparison or analogy, which her tradition treats as a fully independent fourth pramāṇa, but which the monk insists can be folded into perception and inference without remainder. Both characters reach for the same illustration, inherited from Vātsyāyana's commentary on the Nyāya-sūtra: a traveler is told that a gavaya, a wild ox he has never seen, resembles a cow, and later, coming across the animal in a forest, correctly applies the word to it for the first time.

  Where the two characters part ways is over what that moment of recognition actually is. As I understand the monk's position, nothing happens there that perception, memory, and an ordinary inference from resemblance to applicability could not jointly explain, which makes positing an entirely separate faculty of knowledge explanatorily idle. I've read enough secondary literature to know that Naiyāyikas rejected this reduction, but most accounts I've found simply report that they did so, without reconstructing the reasoning in enough detail for me to trust it in my protagonist's mouth. I'd rather not have her win the debate by asserting her school's conclusion more forcefully than her opponent asserts his.

  Could you write out, as continuous argumentative prose rather than a summary of the historical positions, the strongest case available to a Naiyāyika for why the cognition produced by upamāna resists reduction to perception, memory, and inference? I'd particularly like the argument to say something precise about what upamāna is supposed to deliver that an inference could not, and to address whether the monk's proposed inferential reconstruction could even satisfy Nyāya's own requirement of invariable concomitance (vyāpti) between reason and conclusion. Something in the range of a page would suit the scene, and a closing sentence or two distilling the argument's logical skeleton would help me confirm that I've followed it correctly before I start drafting her lines.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A historical novel set in early medieval North India.
      *   **Scene:** A *vāda* (philosophical disputation) between a young Naiyāyika (Nyāya school) protagonist and a Buddhist monk (Dignāga/Dharmakīrti tradition).
      *   **Topic:** The status of *upamāna* (comparison/analogy) as an independent *pramāṇa* (source of knowledge).
      *   **Conflict:** Nyāya says *upamāna* is independent (4th *pramāṇa*). Buddhism says it reduces to perception (*pratyakṣa*) and inference (*anumāna*).
      *   **Specific Example:** The *gavaya* (wild ox) example from Vātsyāyana's commentary. A traveler is told "a *gavaya* is like a cow," sees the animal later, and recognizes it.
      *   **The Problem:** The user needs the *strongest Naiyāyika argument* against the Buddhist reduction, specifically focusing on why inference fails (especially regarding *vyāpti* / invariable concomitance).
      *   **Format:** Continuous argumentative prose (for the character to speak/think), approx. one page, plus a logical skeleton summary at the end.
      *   **Tone:** Philosophical, rigorous, dramatic but accurate to the traditions.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Buddhist (Dignāga/Dharmakīrti) Reduction:**
          *   Step 1: Hearing the statement ("*gavaya* is like a cow") creates a memory of the cow and an expectation.
          *   Step 2: Seeing the animal in the forest is perception.
          *   Step 3: Recognizing it as a *gavaya* is an inference based on similarity. "This animal resembles a cow; things resembling cows in this specific way are called *gavaya*; therefore, this is a *gavaya*."
          *   Claim: No new *pramāṇa* needed.
      *   **Nyāya Defense (Uddyotakara, Vācaspati Miśra, etc.):**
          *   The core issue is the *knowledge of the relation* between the word (*gavaya*) and the object (*the animal in the forest*).
          *   Inference requires a established universal connection (*vyāpti*). Do we have a *vyāpti* between "resembling a cow" and "being called a *gavaya*"?
          *   No, because the traveler has never seen a *gavaya* before. He doesn't know the class "gavaya" exists independently to establish a universal rule.
          *   Perception only gives the form (*ākāra*), not the name-relation.
          *   Memory only recalls the cow, not the *gavaya*.
          *   Therefore, the cognition "This animal is the referent of the word *gavaya*" is a unique cognition generated by the comparison of the remembered cow-form with the perceived animal-form, mediated by the prior testimony. It is *sādṛśya-jñāna* (knowledge of similarity) that links name to object directly, not via a syllogism.

  3.  **Drafting the Argument (Iterative Process):**
      *   *Attempt 1 (Mental Outline):* You say it's inference. But inference needs a rule. What is the rule? "All things like cows are gavayas." But I don't know that. I only know "The thing called gavaya is like a cow." When I see the animal, I don't infer; I recognize. The link between the word and the thing is established by similarity, not by a logical pervasion. If it were inference, I would need to know the class first. I don't. So it's unique.
      *   *Critique 1:* Too simple. Needs more technical Nyāya terminology (without being unreadable). Needs to hit the *vyāpti* hard.
      *   *Attempt 2 (Adding Technical Depth):* Focus on the *paksatā* (subject qualification) for inference. For inference, the subject must be doubtful. But here, the recognition is immediate. Also, the *vyāpti* requires observing many instances. The traveler has zero instances of *gavaya*. He cannot form a universal premise. The cognition is "This is that same thing referred to by the word." That relation (*śakti*) is grasped through similarity, not inference.
      *   *Refining for the Novel:* The protagonist needs to sound confident but respectful. She needs to corner the monk on the *vyāpti*. The key is that inference moves from a mark (*liṅga*) to a thing. Here, the "mark" is similarity. But similarity to what? A cow. Does "cow-similarity" invariably imply "gavaya-name"? No, because a cow has cow-similarity but isn't a *gavaya*. So the middle term is flawed.

  4.  **Developing the Core Argument (The "Vyāpti" Trap):**
      *   The Buddhist says: "It resembles a cow (Reason), therefore it is a *gavaya* (Conclusion)."
      *   Nyāya counter: To infer this, you need the premise: "Whatever resembles a cow is a *gavaya*."
      *   Problem: A cow resembles a cow. Is a cow a *gavaya*? No. So the premise is false.
      *   Buddhist adjustment: "Whatever resembles a cow *in this specific wild way*..."
      *   Nyāya counter: How do you know that specific way without already knowing what a *gavaya* is? You are begging the question.
      *   The Real Nyāya Point: The knowledge gained is the *relation* between the word and the object (*saṅketa*). Inference gives knowledge of a property. *Upamāna* gives knowledge of denotation (*abhidhāna*).

  5.  **Drafting the Prose (incorporating the above):**
      *   Start by acknowledging the monk's elegance.
      *   Pivot to the requirement of *vyāpti*.
      *   Show how the inference fails because the universal connection cannot be established prior to the experience.
      *   Highlight that the cognition is about the *name-object relation*, not just the object's existence.
      *   End with the distinctness of the cognitive event.

  6.  **Refining the Logic for the Summary:**
      *   Need to distill the prose into a syllogistic skeleton.
      *   1. Inference requires invariable concomitance (*vyāpti*).
      *   2. *Vyāpti* requires prior observation of the connection between the reason (resemblance) and the probandum (being a *gavaya*).
      *   3. The traveler has no prior observation of *gavayas*.
      *   4. Therefore, no *vyāpti* exists for the traveler.
      *   5. Therefore, the cognition cannot be inference.
      *   6. It is not perception (perception doesn't give names/relations).
      *   7. Therefore, it is a distinct *pramāṇa*.

  7.  **Final Polish:** Check the tone. Ensure it sounds like a debate but flows as prose. Make sure the distinction between "knowing the object" and "knowing the word applies to the object" is clear, as that is the specific *phala* (result) of *upamāna*. (Self-Correction: Ensure I don't conflate later Navya-Nyāya distinctions too much, keep it closer to the early medieval vibe of Uddyotakara/Vācaspati).

      *Key nuance:* The Nyāya argument often hinges on the fact that inference requires the *pakṣa* (subject) to be established as possessing the *hetu* (reason) *before* the conclusion is drawn. But here, the recognition *is* the conclusion. The "reason" (similarity) is only fully grasped *in the moment* of recognition.

      *Let's focus on the "Cow" counter-example.* If resemblance to a cow is the reason, then a cow resembles a cow. Is a cow a *gavaya*? No. So "resemblance to a cow" is not a valid *hetu*.

      *Wait, the Buddhist might say "Specific resemblance".* Nyāya says: You can't define "specific resemblance" without already knowing the *gavaya*. Circular.

      *Okay, let's write.*

  8.  **Final Review against constraints:**
      *   Continuous argumentative prose? Yes.
      *   Approx one page? Yes.
      *   Closing logical skeleton? Yes.
      *   Address *vyāpti*? Yes.
      *   Address what *upamāna* delivers (name-object relation)? Yes.

      *(Self-Correction during drafting)*: Make sure the voice sounds like a logician, not a modern analyst. Use terms like "pervasion," "mark," "cognition," "instrument."

      *(Final check on the "Cow" objection)*: This is the classic Nyāya objection found in the *Nyāyavārttika*. "If similarity to a cow is the mark, then the cow itself, having similarity to a cow, would be a *gavaya*." I must include this.

      *(Final check on the result)*: The result of *upamāna* is *sāṅketya-jñāna* (knowledge of the convention/name). Inference yields knowledge of a property. This distinction is crucial.

      Let's assemble.
answer: |-
  "Honorable monk, your reduction is elegant, I grant you. To collapse the many into the few is the instinct of the logician. But elegance is not truth, and in your zeal to prune the instruments of knowledge, you have severed the root of this specific cognition. You claim the traveler's recognition is an inference: 'This animal resembles a cow; whatever resembles a cow in this manner is called a *gavaya*; therefore, this is a *gavaya*.' But for this syllogism to hold water, you must establish the invariable concomitance (*vyāpti*) between your reason—'resembling a cow'—and your conclusion—'being a *gavaya*.'

  "Tell me, where does this traveler acquire that universal premise? To know that 'All things resembling a cow are *gavayas*' requires prior observation of many *gavayas*. But by definition, the traveler has never seen a *gavaya*. He stands in the forest devoid of any prior instance of the class he is trying to identify. He cannot establish a pervasion without observing the co-presence of the reason and the probandum, yet the probandum is exactly what he seeks to discover. If he already knew the rule linking cow-resemblance to the name *gavaya*, he would not need to go to the forest; he would already possess the knowledge *upamāna* yields. You are asking him to infer a connection he has never witnessed, based on a class he has never encountered. That is not inference; it is guesswork dressed in logical garb.

  "Perhaps you will refine the reason: 'It resembles a cow *in a specific way*.' But this begs the question. What is that specific way? It is the way of the *gavaya*. To define the mark by the very thing it is supposed to prove is circular. You are saying, 'It is a *gavaya* because it has *gavaya*-likeness.' This explains nothing.

  "Furthermore, consider the fault of over-extension. If 'resemblance to a cow' is the logical mark (*liṅga*) that proves something is a *gavaya*, then consider the cow herself. Does the cow resemble a cow? Perfectly. If your inference holds, the cow must also be a *gavaya*, for she possesses the reason. You will object that the cow lacks the 'wildness' or the specific difference. But again, how does the traveler know which similarities count and which do not without already knowing what a *gavaya* is? The distinction cannot come from inference, for inference relies on established distinctions.

  "The truth is simpler, though it costs you your reduction. Perception gives him the form of the animal before him. Memory gives him the form of the cow he knows. But neither perception nor memory can yield the *relation* between the word *gavaya* and this specific animal. Inference yields knowledge of a property inhering in a subject. But what the traveler gains here is not a property; it is a convention (*saṅketa*). He learns that *this* object is the referent of *that* word. This cognition arises from the comparison of the remembered form with the perceived form, mediated by the teacher's instruction. It is a unique flash of understanding where the name finds its object. It is not derived from a major premise, nor is it sensed by the eyes. It is *upamāna*. To call it inference is to confuse the map with the terrain; to call it perception is to confuse the eye with the mind. It stands alone because the knowledge it delivers—the binding of word to thing via similarity—is a cognitive event unlike any other."

  ***

  ### Logical Skeleton of the Argument

  1.  **Requirement of Inference:** Valid inference (*anumāna*) requires invariable concomitance (*vyāpti*) between the reason (*hetu*) and the conclusion (*sādhya*), established through prior observation of both.
  2.  **Lack of Prior Observation:** The traveler has no prior experience of *gavayas*; therefore, he cannot establish a *vyāpti* between "resembling a cow" and "being a *gavaya*."
  3.  **The "Cow" Counter-Example (Ativyāpti):** If "resembling a cow" is the sufficient reason for being a *gavaya*, then a cow (which resembles a cow) would logically be a *gavaya*, which is false.
  4.  **Circularity:** Specifying "specific resemblance" requires prior knowledge of the *gavaya*, rendering the inference circular (the conclusion is presupposed in the reason).
  5.  **Distinct Cognitive Content:** Inference yields knowledge of properties; *upamāna* yields knowledge of the word-object relation (*saṅketa*). Since the content of the cognition differs, the instrument (*pramāṇa*) must differ.
  6.  **Conclusion:** Since the cognition cannot be perception (which lacks name-relations) and cannot be inference (which lacks *vyāpti*), it must be a distinct *pramāṇa*.
