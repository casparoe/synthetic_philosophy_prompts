answer: |-
  This is one of the most fascinating "footnotes" in the history of philosophy, and you are absolutely right to feel that tension. To the modern eye, the author of *The Methods of Ethics*—a book celebrated for its icy, surgical precision and commitment to rational argument—spending decades investigating séances looks like a massive contradiction.

  However, most intellectual historians and Sidgwick scholars argue that it wasn't a contradiction at all. In fact, his psychical research was **directly motivated by the same philosophical anxieties that drove *The Methods of Ethics*.**

  Here is why Sidgwick's "ghost hunting" wasn't a lapse in rationality, but rather an extension of his philosophical project.

  ### 1. The Victorian Crisis of Evidence
  To understand Sidgwick, you have to understand the 1870s–1890s in England. This was the peak of the crisis of faith. Darwin, biblical higher criticism, and geology had dismantled traditional religious authority.

  Many Victorian intellectuals (including Sidgwick) were **empiricists**. They didn't want to believe in God or the soul based on dogma or tradition; they wanted *evidence*. If science could disprove miracles, could science not also prove them?

  The Society for Psychical Research (SPR), founded in 1882, wasn't a club for believers. It was founded by scientists, philosophers, and classicists (including William James in the US) who wanted to apply the **scientific method** to anomalous claims. Sidgwick didn't join because he was a mystic; he joined because he thought ignoring the data of human testimony regarding telepathy or apparitions was unscientific. He approached mediums with the same skepticism he applied to ethical intuitions: *Is this verifiable? Is this consistent? Is this fraud?*

  ### 2. The "Dualism of Practical Reason"
  This is the crucial philosophical link. In *The Methods of Ethics*, Sidgwick comes to a famously depressing conclusion known as the **Dualism of Practical Reason**.

  He argues that there are two rational methods for deciding how to act:
  1.  **Rational Egoism:** It is rational to pursue my own happiness.
  2.  **Rational Utilitarianism:** It is rational to pursue the general good.

  Sidgwick could not find a purely rational way to reconcile these two. If the universe is purely material and death is the end, it is often more "rational" to be an egoist than a utilitarian martyr. Why sacrifice your own happiness for the greater good if there is no cosmic justice or afterlife to balance the scales?

  Sidgwick desperately wanted to believe that the universe was morally ordered. He hoped that if psychical research could provide **empirical evidence of an afterlife or a spiritual dimension**, it would solve the Dualism. It would provide the "cosmic sanction" needed to make Utilitarianism fully rational. He wasn't looking for ghosts for fun; he was looking for the metaphysical foundation of morality.

  ### 3. Rigor Over Belief
  Sidgwick wasn't a gullible believer. He was famously hard to convince.
  *   He spent years investigating the medium Eusapia Palladino. While he admitted some phenomena were inexplicable by known physics, he was constantly vigilant against fraud.
  *   He resigned from the SPR at one point because he felt they were becoming too credulous and not rigorous enough.
  *   He remained an agnostic regarding the ultimate conclusions. He didn't claim to have "proven" God; he claimed to have proven that the materialist worldview was incomplete.

  In this sense, he was being *more* rational, not less. He was arguing that a true empiricist cannot ignore data just because it doesn't fit the current materialist paradigm.

  ### 4. It Wasn't a "Hobby"
  Your professor called it a "fun fact," but for Sidgwick, this was serious business. He viewed the SPR as potentially the most important work of his life. He wrote to a friend that the question of survival after death was "of all questions the most important."

  He also wasn't alone in this. His wife, **Eleanor Sidgwick**, was a formidable mathematician and philosopher in her own right who served as President of the SPR. Together, they viewed this as a moral duty to humanity. If they could scientifically prove the existence of a spiritual realm, they believed it would stabilize morality in a secularizing world.

  ### Summary: Mystic or Rationalist?
  Sidgwick was not a secret mystic. He was a **frustred rationalist.**

  *   **The Contradiction:** Only exists if you assume "rationalism" means "materialism." Sidgwick believed rationalism meant following the evidence wherever it leads, even if it leads to the paranormal.
  *   **The Connection:** His psychical research was an attempt to solve the ethical problem he laid out in *The Methods of Ethics*. He needed the universe to be moral, and he hoped science could prove it.

  So, when you read *The Methods of Ethics* again, you can see his psychical research not as a weird sidebar, but as the tragic, desperate attempt to find the missing premise that would make his ethical system hold together. He wanted a rational basis for morality, and when pure reason failed him, he turned to empirical investigation of the supernatural to find it.
