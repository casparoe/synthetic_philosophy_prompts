  **Justifications**

  **Move 1 (Owen):** This is the standard "Expected Choiceworthiness" model applied to moral uncertainty. It is a rational starting point that treats moral theories like empirical hypotheses. However, it receives a 1 rather than a 2 because it assumes a solution to the "intertheoretic comparison" problem (comparing units of value across different theories) that is notoriously difficult to justify philosophically.

  **Move 2 (Renata):** This is a decisive objection. Different moral frameworks often lack a common metric (cardinality) or zero point; one theory's "minor sin" might be another's "neutral act." Pointing out that you cannot mathematically aggregate values that aren't on the same scale is a fundamental and correct critique of Move 1.

  **Move 3 (Owen):** Switching to an ordinal ranking system (like a Borda count) is a logically coherent workaround that bypasses Renata's scaling objection. It deserves a 1 because it is a valid strategic retreat that preserves the structure of decision-making under uncertainty, even if it introduces new vulnerabilities regarding intensity.

  **Move 4 (Renata):** This correctly identifies the cost of Owen's workaround. By flattening all moral stakes into simple rankings, the model loses the ability to account for the *severity* of the wrong. In high-stakes moral decisions, ignoring the magnitude of harm is a significant theoretical weakness, making this a strong counter-argument.

  **Move 5 (Owen):** This "My Favorite Theory" approach is generally scored negatively in the literature on moral uncertainty because it effectively ignores the uncertainty it purports to address. While logically consistent (acting on what one deems most probable), it fails to manage the risk of committing a serious wrong if the minority view is correct, making it a weaker position than his initial proposal.

  **Move 6 (Renata):** This is the standard and strongest objection to the "My Favorite Theory" approach. It highlights that moral decision-making under uncertainty requires risk management, not just probability maximization. Ignoring a significant probability of a catastrophic moral wrong is widely considered reckless, making this a very strong closing argument.

  **Alternative Approach**

  Neither Owen nor Renata considered the "Common Permissibility" or "Intersection" approach. Instead of trying to calculate weights or rankings, Owen could identify which actions are permissible under *all* the serious theories he entertains. For instance, if the view that "animals don't count" says eating vegetables is permissible (even if meat is also allowed), and the view that "harming animals is murder" says eating vegetables is required, then vegetarianism lies in the intersection of permissible actions. This allows him to avoid the risk of serious wrongdoing without needing to compare incompatible moral scales or ignore minority views.
