      *   *Final Verdict:* I will argue that **biological repair is the only scenario that secures identity**, while **unique emulation secures "what matters" enough to justify the cost**, but **branching emulation reduces it to mere legacy, not survival.**

  7.  **Final Polish:** Check against constraints.
