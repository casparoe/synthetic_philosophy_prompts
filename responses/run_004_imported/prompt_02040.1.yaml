prompt: |-
  Ok this is going to sound like a weirdly specific ask but bear with me. I TA for a free will & moral responsibility seminar this term, and last week we did the pairing that apparently every syllabus does: P.F. Strawson's "Freedom and Resentment" right next to his son Galen's Basic Argument (the causa sui / self-creation regress thing from the '94 "Impossibility of Moral Responsibility" paper). My prof mentioned offhand that Galen actually has a piece where he responds directly to his dad's essay, which I haven't tracked down yet, and now I can't stop thinking about how that must've gone as an actual family dynamic lol.

  Here's what's actually bugging me though. P.F.'s move in "Freedom and Resentment" is basically: the reactive attitudes (resentment, gratitude, guilt, indignation, etc) are just brute features of our interpersonal form of life, they don't stand or fall with whether determinism is true, and we can't sustain the fully "objective" attitude toward people as a general policy even if we tried (we only really manage it for little kids, the "he wasn't himself" cases, stuff like that). Galen's Basic Argument seems to concede most of that descriptively - fine, we can't help acting and feeling like people are responsible - but he still wants to say none of it gets you to genuine, ultimate, heaven-or-hell-deserving responsibility, since that requires being responsible for the way you are "in certain crucial mental respects," which requires a kind of self-authorship that leads to infinite regress and is supposedly impossible whether determinism or indeterminism is true.

  So: do these two views actually contradict each other, or are they answering two seperate questions (one naturalistic/descriptive, one about "true" desert) such that Galen isn't really refuting his dad so much as changing the subject on him? And if you had to say who's doing the more serious philosophical work here - like which one comes closer to actually being right about moral responsibility - which would you pick, and why? Trying to get a decent answer sorted before my seminar meets again Thursday, my cohort has been going back and forth on this for like two weeks now.
