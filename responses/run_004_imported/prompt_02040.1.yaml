answer: |-
  This is a fantastic pairing, and you are right to sense the tension—it's one of the most dramatic "family feuds" in analytic philosophy, even if it's conducted with polite British reserve. The dynamic is legendary: P.F. (Peter Frederick) tries to save moral responsibility by dissolving the metaphysical worry, and Galen comes along decades later to say, "No, the metaphysical worry is fatal, and your dissolution just hides it."

  Here is the breakdown you need for Thursday, covering the bibliography, the philosophical clash, and an assessment of who carries the day.

  ### 1. The Bibliographic Hunt: Did Galen directly respond?
  Your prof is half-right, but there isn't a single paper titled "A Reply to My Father." However, Galen explicitly engages with P.F.'s legacy in two key places:

  *   **"The Impossibility of Moral Responsibility" (1994):** This is the paper you're already reading. While it's framed as a general argument, Galen explicitly positions it against the "Strawsonian" orthodoxy that dominated the post-1962 landscape. He treats P.F.'s view as the primary opponent to be overcome.
  *   ***Freedom and Belief* (1986, revised 2010):** This is Galen's monograph. In the revised edition especially, he discusses P.F. Strawson at length. He acknowledges his debt to his father's naturalism but argues that P.F. conflated the *inevitability* of the belief in responsibility with its *truth*.

  **The Family Dynamic:** In interviews, Galen has noted that while he reveres his father's work, he thinks "Freedom and Resentment" contains a fundamental category mistake. P.F. thought he was ending the debate; Galen thought he was merely changing the subject.

  ### 2. Contradiction or Talking Past Each Other?
  This is the crux of your seminar discussion. The answer is: **They are answering different questions, but Galen intends his answer to invalidate P.F.'s conclusion.**

  **P.F. Strawson (The Naturalist/Pragmatist):**
  *   **The Question:** What is the *status* of our moral practices?
  *   **The Move:** He shifts the ground from metaphysics to psychology/sociology. "Responsibility" isn't a metaphysical property floating above human interaction; it *is* the participation in reactive attitudes (resentment, gratitude, etc.).
  *   **The Conclusion:** Since we cannot abandon these attitudes (they are constitutive of human relationships), moral responsibility is real. The truth of determinism is irrelevant because it doesn't touch the practices themselves.
  *   **Key Phrase:** "The framework of human life."

  **Galen Strawson (The Metaphysical Impossibilist):**
  *   **The Question:** What are the *conditions* for true moral desert?
  *   **The Move:** He accepts P.F.'s description that we *feel* responsible, but he argues that this feeling presupposes a specific metaphysical condition: **Ultimate Moral Responsibility (UMR).** To be truly responsible, you must be the *causa sui* (cause of yourself) in crucial mental respects.
  *   **The Conclusion:** Since nothing can be *causa sui* (it leads to an infinite regress), UMR is impossible. Therefore, even if P.F. is right that we *can't stop* holding people responsible, we are *wrong* to think they deserve it in the ultimate sense.
  *   **Key Phrase:** "The Basic Argument."

  **The Verdict on Conflict:**
  P.F. is a **revisionist** about the concept of responsibility (Responsibility = Participation in Practices).
  Galen is a **preservationist** about the concept of responsibility (Responsibility = Ultimate Desert) who concludes the concept is empty.

  Galen isn't just changing the subject; he is arguing that P.F.'s move is a **cop-out**. Galen's charge is that P.F. Strawson successfully showed we can't *stop* blaming people, but failed to show that blaming people is *justified* in the way we intuitively think it is (i.e., that they truly *deserve* it).

  ### 3. Who is doing the "More Serious" Work? (Who is Right?)
  If you force me to pick a lane for your seminar (and knowing this will spark debate), here is the strongest assessment:

  **P.F. Strawson wins on Phenomenology and Utility.**
  If your goal is to preserve the social fabric and explain why punishment, praise, and relationships make sense, P.F. is unbeatable. He correctly identifies that skepticism about free will doesn't actually change how we live. We don't stop loving our spouses or resenting our enemies when we read Determinism 101. His work is "serious" in the Wittgensteinian sense: it dissolves a pseudo-problem that arises from misusing language.

  **Galen Strawson wins on Logic and Metaphysics.**
  If your goal is to determine whether anyone *truly deserves* heaven, hell, or retributive punishment in a cosmic sense, Galen is unbeatable. The Basic Argument is logically valid. If responsibility requires self-creation, and self-creation is impossible, then ultimate responsibility is impossible. His work is "serious" in the traditional analytic sense: it exposes a hidden contradiction in our intuitions.

  **The Synthesis (The "TA Answer"):**
  Galen is technically "righter" about the metaphysics, but P.F. is "righter" about the ethics.

  Most contemporary philosophers (like Daniel Dennett or John Martin Fischer) try to find a middle ground. They argue that Galen sets the bar for responsibility too high (the "God's eye view" of desert). They argue that P.F. was right to lower the bar, but they try to give it a stronger justification than just "we can't help it."

  **However, if I have to choose who did the harder philosophical heavy lifting:**
  I would give the edge to **Galen Strawson**.
  *Why?* Because P.F. Strawson's move is essentially a therapeutic dissolution. It says, "Stop asking that question." Galen Strawson forces us to ask *why* we are asking the question. He exposes that P.F.'s "naturalism" smuggles in a normative claim: that because a practice is inevitable, it is justified. Galen shows that inevitability $\neq$ justification. It is easier to describe a practice (P.F.) than to prove its metaphysical coherence against a regress argument (Galen).

  ### 4. Seminar Strategy for Thursday
  To get your cohort unstuck, try framing the discussion around **Definition**.

  1.  **Ask the room:** "When you say someone is 'morally responsible,' do you mean (A) They are an appropriate target of reactive attitudes, or (B) They are the ultimate source of their actions in a way that justifies cosmic desert?"
  2.  **If they say A:** P.F. Strawson wins. Galen is attacking a straw man.
  3.  **If they say B:** Galen Strawson wins. P.F. Strawson is changing the subject.
  4.  **The Kicker:** Ask them if (A) is *enough*. Is it enough to say "We can't help blaming people" to justify prison sentences? P.F. says yes (it's just our form of life). Galen says no (that's just brute force without justification).

  **Summary for your notes:**
  *   **Relation:** Galen accepts P.F.'s psychology but rejects his metaphysics.
  *   **Conflict:** P.F. thinks the metaphysics doesn't matter; Galen thinks it makes the practice unjustified.
  *   **Winner:** Galen on logic; P.F. on livability.
  *   **Citation:** Galen's *Freedom and Belief* (2010 ed.) is the most direct engagement with P.F.'s legacy.

  Good luck on Thursday. It's a great pairing, and honestly, the fact that it's father vs. son makes the "regress" argument feel almost Freudian (you can never be the cause of yourself, just as you can never fully escape the cause of your father). Your students will love that angle.
