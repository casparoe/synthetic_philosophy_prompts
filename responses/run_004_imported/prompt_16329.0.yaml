answer: |-
  The observation gallery of the Global Science Council smelled of recycled air and old carpet, a scent that hadn't changed since my days running mass spectrometry in Zurich. Forty years ago, my world was defined by error bars and calibration curves. If the needle moved, something physical had pushed it. Belief was irrelevant. The universe was a stubborn thing that refused to be argued into existence.

  Now, at seventy, I sat as a senior advisor, watching a young woman named Elara Vane attempt to argue the universe into a specific shape without touching a single instrument.

  Below me, in the pit of the chamber, the holographic display hovered between two models. On the left, Theory $\Omega_1$: a closed, finite cosmology. On the right, Theory $\Omega_2$: an eternal inflation model implying a googol times more observer-moments than $\Omega_1$.

  The physical evidence for both was identical. The particle data from the LHC-IV was ambiguous; the cosmic microwave background fit both curves within standard deviation. To distinguish them required the Acheron Array, a telescope network spanning the Lagrange points. Cost: four trillion credits. Time: twenty years.

  "The motion is to defund the Acheron project," the Chair announced.

  Elara stood. She was a metaphysician by training, a cosmologist by adoption, and the sharpest mind in the room. She didn't look at the budget figures. She looked at her own hands.

  "We cannot authorize the expenditure," Elara said, her voice calm. "To build the Acheron Array is to admit ignorance where we already possess certainty. We are operating under the Self-Indication Assumption. Given that I exist as an observer, I must reason as if I were drawn at random from the set of all *possible* observers."

  She gestured to the $\Omega_2$ model. "If $\Omega_1$ is true, there are $10^{22}$ observers in history. If $\Omega_2$ is true, there are $10^{52}$. Under SIA, the prior probability of $\Omega_2$ is weighted by the number of observers it contains. $\Omega_2$ is ten to the thirty times more likely than $\Omega_1$, purely because it contains more of *me*."

  A murmur rippled through the physicists. I leaned forward against the glass. This was Bostrom's Presumptuous Philosopher, flesh and blood, demanding we cancel a trillion-credit experiment because she had counted the seats in the theater and assumed she was more likely to be sitting in the larger one.

  "You are claiming," interrupted Kael, the project lead for Acheron, "that you can determine the topology of the cosmos by counting your own pulse?"

  "I am claiming that my existence is data," Elara countered. "And the data overwhelmingly favors the larger universe. To spend four trillion credits testing a hypothesis with a probability of $10^{-30}$ is not science. It is malpractice."

  Kael stood, tightening his tie. He was a man of the old school, like me. He believed in dirt under the fingernails.

  "Elara is applying the Self-Indication Assumption," Kael said, addressing the Chair. "But the SIA is not a law of physics. It is a heuristic for handling indexical uncertainty. The rival heuristic is the Self-Sampling Assumption. SSA dictates that I should reason as if I am a random observer from the set of *actual* observers in my reference class."

  He tapped the table. "Under SSA, the number of observers in the universe does not shift the prior probability. If the physical evidence is equal, the odds are fifty-fifty. We do not know which universe is actual yet. Therefore, the experiment is necessary."

  "If you accept SSA," Elara shot back, "you open the door to the Doomsday Argument. If you assume you are a random sample from all humans who will *ever* live, and you find yourself alive in the first trillion, you must conclude the total number of humans is small. SSA forces you to predict early extinction to keep the statistics consistent. Do you want to base our survival strategy on an argument that predicts our demise to save a budget line?"

  The room went silent. The trap was sprung. I knew it well. SSA saved the experiment but cursed humanity with a probabilistic expiration date. SIA saved humanity from Doomsday but rendered empirical verification presumptuous and redundant.

  Kael looked pained. "I would rather face a probable Doomsday than live in a delusion. If $\Omega_1$ is true, the vacuum metastability risk is non-zero. We need to know. We cannot let a philosophical assumption about observer counts veto a measurement."

  "It is not an assumption," Elara insisted, her composure cracking slightly. "It is Bayesian updating. If you refuse to update on your own existence, you are ignoring data. If you fund Acheron, you are choosing to ignore the most significant dataset available: the fact that you are here."

  "And if you cancel Acheron," Kael said, his voice rising, "you are claiming that logic can override measurement. That is not science. That is theology."

  They stood there, two brilliant people agreeing on every physical constant, every spectral line, every historical datum, yet driven to opposite actions by the way they defined the word *I*.

  I watched them, feeling the old vertigo. In the lab, if two technicians disagreed on a reading, we checked the machine. Here, the machine was the mind, and the calibration was impossible.

  The Chair turned to the advisory box. "Dr. Corwin? You have the tie-breaking vote on the scientific merit."

  All eyes turned to me. I stood up. The glass vibrated slightly under my palms.

  "Dr. Vane," I said, my voice amplified into the pit. "If you are right, and SIA holds, then the Acheron Array will confirm $\Omega_2$. It will be a waste of money, but it will be a harmless one. We will spend four trillion to learn what you already know."

  Elara nodded. "Inefficient, yes. But the opportunity cost—"

  "Wait," I cut in. "Dr. Kael. If you are right, and SSA holds, then the odds are fifty-fifty. If $\Omega_1$ is true, and we *don't* build Acheron, we remain ignorant of the vacuum stability risk. We might go extinct because we saved the budget."

  Kael nodded grimly. "Existential risk trumps fiscal efficiency."

  I looked down at them. The tension wasn't about the money. It was about the authority of the observer. Elara believed the observer's existence shaped the probability of the world. Kael believed the world existed independently of the observer's count.

  "There is a third option," I said.

  The Chair frowned. "The motion is binary, Elias."

  "The motion is about the *funding*," I corrected. "Not the philosophy. We are scientists. We do not vote on truth; we vote on procedure."

  I took a breath. "We fund the Acheron Array. But we fund it under the explicit proviso that we are testing the *Assumption*, not just the Cosmology."

  Elara stiffened. "You cannot test an anthropic principle."

  "Can't we?" I asked. "If we build Acheron, and it confirms $\Omega_1$—the small universe—then SIA is falsified. Your existence would not have been sufficient to predict the larger world. If SIA fails here, it fails everywhere. The Doomsday Argument loses its teeth, and we regain the right to trust our instruments over our introspection."

  "And if it confirms $\Omega_2$?" Kael asked.

  "Then we paid four trillion to learn that Elara was right," I said. "We bought certainty. In my forty years, I learned that certainty is the only commodity worth the price."

  Elara looked at me, her eyes narrowing. She saw the trap. If $\Omega_1$ was found, her entire framework for anthropic reasoning collapsed. She was betting her career on the size of the crowd, while I was betting on the ticket stub.

  "You're forcing an empirical test on a metaphysical axiom," she said quietly.

  "I'm forcing a metaphysical axiom to submit to an empirical test," I replied. "That is the only way this council operates. We do not reason our way out of the cave. We walk out and check the sun."

  The vote was called. The hands went up. Acheron was funded.

  As the session adjourned, I met Elara in the corridor. She was packing her tablet, movements sharp with frustration.

  "You know," she said, not looking up, "if $\Omega_1$ is true, and we run the experiment, you've validated SSA. But you've also validated the Doomsday Argument. You've condemned your own species to a high probability of near-term extinction, statistically speaking."

  "I know," I said.

  "And if $\Omega_2$ is true, you've wasted resources that could have mitigated climate collapse or pandemic risk. You've gambled the present on a philosophical hunch."

  "I know."

  She stopped and looked at me. "Why did you do it, Elias? You're a pragmatist. You should have taken the free probability SIA offered."

  I looked out the window at the gray sky, the heavy clouds of a warming world.

  "Because in the lab," I said, "when the gauge reads zero, it doesn't matter how many other labs might exist in the multiverse where the gauge reads one. It matters what the needle does here. If we accept that we can know the universe without looking at it, we stop looking. And when we stop looking, the darkness wins."

  Elara held my gaze for a moment, then nodded, a reluctant acknowledgment of the old creed. "See you at the data release, Elias. In twenty years."

  "Assuming we're still here," I said.

  She flinched, just slightly. The Doomsday Argument, hanging in the air between us, invisible and heavy.

  She walked away. I stayed at the window, watching the rain begin to fall. The water didn't care about SSA or SIA. It fell because of gravity, condensation, pressure. It was indifferent to my reasoning.

  For the first time in my retirement, I envied the rain. It didn't have to decide which universe it was in to know how to fall. I turned from the window and went to write the grant proposal, knowing that I had just wagered the future on the hope that the universe was small enough to be measured, and that we were not merely figments of a probability distribution trying to count ourselves into existence.

  The needle would move. I just prayed there was someone left to read it.
