answer: |-
  The work order was simple, printed on a slip of cardstock that felt too thin for the weight of the task: *Secure State 44-B. Ensure the Door is Closed.*

  Elian stood before the Door. It was a heavy thing, iron-bound and seamless, set into a wall of gray concrete that stretched endlessly in both directions. The Door was currently ajar, a dark slit of nothingness breathing cold air onto his face. His job was not to push it shut—that was the janitorial staff's concern, a physical act. His job was to make it *the case* that the Door was Closed. He was a Ligator, Third Class, in the Ministry of Cohesion. He dealt in the metaphysics of the bolt, the ontology of the latch.

  He opened his kit. Inside lay a single spool of silver wire, the standard-issue Connective.

  Elian stepped forward. He took one end of the wire and touched it to the edge of the Door. He took the other end and touched it to the Frame. He twisted the wire tight. A simple relation. *Door* connected to *Frame*.

  He stepped back to inspect the work. The wire hung loosely between the metal surfaces. It touched them, yes, but it did not *hold* them. The Door remained ajar. The wire was just another object sitting in the gap, a third thing lying alongside the Door and the Frame, not a bond uniting them. It was like listing three words on a page: *Door, Wire, Frame.* There was no sentence. There was no fact.

  "Loose connection," said a voice from the shadows.

  Elian jumped. It was the Overseer, a man whose face seemed to be made of the same gray concrete as the walls. He held a clipboard.

  "It's twisted tight, sir," Elian said.

  "The wire is not connected to the Door," the Overseer said, tapping his pen against the board. "It is merely adjacent to it. You must secure the wire to the Door."

  Elian nodded. He reached into his kit and pulled out a small metal clamp. He fastened the clamp over the point where the wire met the Door. Now the wire was held to the Door.

  He stepped back. The clamp sat on the surface, cold and inert. It was not gripping. It was just resting there, a fourth object. *Door, Frame, Wire, Clamp.* The gap remained. The cold air continued to breathe through the slit. The state "The Door is Closed" had not obtained. The universe had not congealed around the fact.

  "The clamp," the Overseer said, his voice devoid of irritation, which was worse. "It is not attached to the wire."

  Elian felt a prickle of sweat on his neck. He took a strip of adhesive tape from his kit. He pressed it over the clamp, binding the clamp to the wire.

  He waited. The tape did not stick. It lay on top of the clamp like a dead skin. It needed to be bound.

  Elian reached for a staple gun. He stapled the tape to the clamp.

  The staple sat on the tape. It did not pierce. It was merely present.

  "Mr. Elian," the Overseer said, checking his watch. "The shift ends in an hour. State 44-B must be finalized. Reality cannot remain in a list format. It must be a proposition."

  Elian worked faster. He grabbed a rivet to secure the staple. The rivet needed a washer. The washer needed a seal. The seal needed a stamp.

  With every attempt to fix the previous connection, he introduced a new object that required its own connection. He was building a bridge, but every plank he laid down hovered an inch above the last, requiring another plank to press it down, which then hovered in turn.

  The pile of hardware grew. It was no longer a simple latch; it was a mound of silver wire, clamps, tape, staples, rivets, washers, and seals. It rose from the floor like a metallic tumor, obscuring the bottom of the Door. But Elian knew, with a sinking dread, that the mound did not touch the Door. Not really.

  There was always a gap between the *thing* and the *thing-that-holds-the-thing*.

  He climbed a ladder to reach the top of the pile. He was now ten feet in the air, holding a heavy-duty chain link. He needed to bind the chain to the topmost seal.

  "Sir," Elian called down, his voice trembling. "The chain. It won't bite."

  "Then bind the bite," the Overseer said. He was standing further away now, as if distancing himself from the instability.

  "But if I bind the bite, I need a binder for the binder!" Elian shouted. The echo of his voice died instantly in the gray air.

  "Obviously."

  Elian looked at the Door. It hadn't moved. The dark slit was still there. The cold air was still flowing. All this metal, all this effort, and the Door was no more Closed than it had been when he started. The Wire was not *of* the Door. The Clamp was not *of* the Wire. They were just a heap. A plurality. A chaotic list of objects masquerading as a unified fact.

  He realized then that he would never reach the bottom. To secure the top link, he needed a second link. To secure that, a third. The chain of necessity stretched downward, past the floor, past the foundation, into the abstract dark beneath the world. And it stretched upward, too, because the chain itself needed to be held together by a higher unity, which needed a higher unity still.

  He was standing in the middle of an infinity.

  The pile groaned. It was not a mechanical sound, like metal under stress. It was the sound of meaning straining to exist. The sheer weight of the unconnected connectors was beginning to bow the air around them.

  "Sir!" Elian screamed, looking down. The Overseer was gone. The corridor was empty.

  Elian was alone with the Door and the infinite stack of failed attempts to close it.

  He looked at his hands. They were holding the latest fastener. He knew that if he applied it, it would not hold. It would just be another thing. Another noun without a verb. Another object waiting for a glue that would itself require glue.

  He looked back at the slit of darkness between the Door and the Frame. It seemed wider now. Or perhaps it was just that he understood the distance better. It was not a physical distance. It was the distance between *is* and *is not*.

  He dropped the fastener. It fell through the pile, clattering against a thousand loose clamps and unstuck tapes, never hitting a bottom, never stopping, falling forever through the stack of relations that had never related anything.

  Elian sat on the top of the mound. The cold air from the Door washed over him. He watched the fastener fall, and he waited for the sound of it hitting the ground, knowing that in a world where nothing truly connects, the sound would never arrive.
