  Two perfect Bayesians are watching a coin flip.

  One slides $20 across the table. "Heads. Even money."

  The other immediately puts his wallet away. "Declined."

  "What? We're looking at the same coin. We share a common prior on the physics."

  "Exactly," says the second. "Which means the only new data in this room is your willingness to wager."

  "So?"

  "So, if we truly share a prior, your confidence signals private information I don't have. But since I know *I* don't have any private info, your offer implies you're operating on a prior I don't share."

  "And that means you won't bet?"

  "No," says the second economist. "It means I just updated my model based on your offer."

  **Punchline:** "I'd love to bet on the coin, but I'm not betting against a guy whose offer just proved his prior is broken."
