answer: |-
  This is a profoundly difficult situation, and I want to start by answering your core question directly: **No, this inconsistency is not a failure on your part.** And yes, your flashes of resentment are almost certainly tracking something real that a purely clinical attitude misses.

  Your therapist's "bad weather" analogy is a common tool in psychoeducation for families of those with mental illness. It is designed to help you depersonalize the symptoms so you don't spiral into thinking, *"He hates me"* or *"I am unlovable."* That is a useful shield. But a shield is not a home. You cannot live inside a shield forever, and shields do not process emotional injury.

  Here is why your resentment is valid, why the analogy has limits, and how to navigate the guilt.

  ### 1. Resentment as a Signal, Not a Flaw
  Resentment is often misunderstood as a toxic emotion. In reality, it is a protective signal. It is your psyche's way of telling you that a boundary has been crossed, a value has been violated, or your safety has been compromised.

  When you feel resentment, it is tracking a real truth: **You were hurt.**
  *   **The Clinical Truth:** The words were symptoms of mania, driven by neurochemistry, impulse control issues, and potentially psychosis.
  *   **The Human Truth:** The words were spoken by your brother, they landed in your ears, they caused pain, and they damaged the trust in the relationship.

  Both truths exist simultaneously. If you focus only on the clinical truth, you invalidate your own pain. If you focus only on the human truth, you may lose compassion for his illness. Your resentment flares up when the balance tips too far toward invalidating your pain. It is telling you: *"I matter, too. My feelings matter, too."*

  ### 2. The Limits of the "Bad Weather" Analogy
  The weather analogy works for depersonalization, but it fails at accountability and connection.
  *   **Weather is impersonal.** A hurricane does not love you. Your brother does.
  *   **Weather does not apologize.** Your brother feels mortified. That indicates there is a "person" in there, not just a "storm."
  *   **Weather damage is insured.** Emotional damage between siblings requires repair, not just insurance.

  When you treat him *only* like bad weather, you risk turning him into an object to be managed rather than a person to be related to. This can actually increase your resentment because it feels like you are suppressing your humanity to accommodate his illness. You are allowed to miss the brother you knew before the diagnosis, and you are allowed to grieve the safety you used to feel.

  ### 3. The Guilt of Inconsistency
  You mentioned feeling guilty for being inconsistent. Please consider this: **Capacity is not a constant.**

  Some days, you are rested, supported, and emotionally resourced. On those days, the "bad weather" analogy works because you have the umbrella to handle the rain. Other days, you are tired, stressed, or your own emotional skin is thin. On those days, the rain feels like it's burning you.

  That isn't moral inconsistency; it is human variability. Beating yourself up for having less capacity on certain days drains the very energy you need to cope. Try to view your capacity like a battery. Some days you are at 80%, and you can offer grace. Some days you are at 10%, and you need to prioritize self-protection. Both are acceptable.

  ### 4. Moving from "Planning Around" to "Boundaries and Repair"
  If the "bad weather" approach is only working half the time, it may be time to adjust the strategy from *passive endurance* to *active boundary setting.*

  *   **Boundaries during the storm:** "Planning around" can sound like walking on eggshells. Instead, try clear consequences. "I love you, but if you start speaking to me that way, I will hang up the phone/leave the room." This isn't punishment; it is safety. It protects you from the cruelty and it actually helps him by not reinforcing the behavior.
  *   **Accountability during the stability:** When he is stable and mortified, that is the time for repair. Amnesia is a symptom, but it cannot be a free pass. He needs to ask: *"How can I make this right?"* and *"What is my plan to prevent this next time?"* (e.g., medication adjustment, earlier intervention when mania signs appear). If you do all the emotional labor of forgiving while he does none of the labor of accountability, resentment will inevitably grow.
  *   **Validate your own hurt:** You don't have to choose between "He is sick" and "I am hurt." You can say to yourself (or him): *"I know you were manic, and I know you didn't mean it. But what was said was very painful, and I need some time to process that before I can feel close again."*

  ### Summary
  Your resentment is not a failure of character; it is a sign that you are trying to balance two heavy truths: your love for your brother and your respect for yourself.

  The goal isn't to eliminate the resentment entirely (which would require eliminating your self-protection instincts). The goal is to listen to what the resentment is telling you. It is likely telling you that you need stronger boundaries, more acknowledgment of your pain, or simply permission to step back when the "weather" gets too severe.

  You are navigating a relationship with a chronic illness that affects personality and behavior. It is okay if your reaction to that is inconsistent. Be as kind to yourself in your stable moments as you are trying to be toward your brother in his.
