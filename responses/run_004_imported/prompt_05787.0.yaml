answer: |-
  You are definitely not missing anything obvious, and you haven't failed to grasp the logic. In fact, your objection hits on one of the oldest and most persistent fault lines in epistemology (the study of knowledge).

  You have correctly identified that Reid's argument relies on a specific assumption about **default settings**, and your counter-argument relies on a different one.

  Here is the breakdown of why Reid thinks his logic holds, why your objection is actually the standard Empiricist counter-attack, and whether it counts as a "soft spot."

  ### 1. Reid's Logic: The "Default Setting" Argument
  Reid is arguing against the Skeptics (like Hume) who believed that all belief comes from **induction** (reasoning based on past experience).

  *   **The Skeptic's View:** I believe you because, in the past, when people opened their mouths, sounds came out that matched reality. I have built a statistical model of human honesty.
  *   **Reid's Rebuttal:** If that were true, infants would be skeptics. They have no data set. They haven't observed enough "truth events" to build a statistical model. Yet, infants believe their caregivers immediately and completely.
  *   **The Conclusion:** Therefore, the belief isn't the *result* of the data; it's the *prerequisite* for processing the data.

  When Reid says, *"If credulity were the effect of reasoning and experience, it must grow up... in the same proportion as reason,"* he is making a claim about **causality**. He is saying: If $A$ (experience) causes $B$ (trust), then more $A$ should equal more $B$.

  ### 2. Your Objection: The "Calibration" Argument
  Your counter-argument is: *"Isn't it just as easy to say experience is EXACTLY what's teaching kids to trust less as they go?"*

  This is a very strong point. You are suggesting that the baseline isn't "Trust," but rather "Neutral" or "Open," and that experience acts as a filter that removes trust in specific instances (calibration).

  *   **Your Model:** Start at 50% trust $\rightarrow$ Experience reveals lies $\rightarrow$ Drop to 20% trust.
  *   **Reid's Model:** Start at 100% trust $\rightarrow$ Experience reveals lies $\rightarrow$ Drop to 20% trust.

  On the surface, the outcome looks the same (adults are less trusting than kids). So why does Reid insist his version is the only logical one?

  ### 3. The "Bootstrap" Problem (Where Reid digs in)
  Reid would argue that your model suffers from a circularity problem. This is the hidden step in his logic that he assumes you'll accept.

  To learn from experience that "people sometimes lie," you first have to accept a massive amount of testimony as **true**.
  *   How does a child learn what a "lie" is? Someone has to *tell* them. ("He is lying to you.")
  *   How does a child learn about the world generally? People tell them. ("Fire is hot," "Don't touch that.")

  Reid's point is that **you cannot use experience to validate testimony without already trusting testimony to interpret that experience.**

  If we started with zero credulity (or even neutral skepticism), we would never gather the data required to become credulous. We would be stuck in a solipsistic loop, unable to accept the very information needed to learn that information is sometimes unreliable.

  So, when you ask, *"Isn't it just as easy to say experience is teaching kids to trust less?"*, Reid would say: **"No, because to learn that lesson from experience, you first had to trust the experience."**

  ### 4. Is it a Soft Spot?
  Yes and no. It depends on what you demand from a philosophical argument.

  **It IS a soft spot if:**
  You require empirical proof of innateness. Modern developmental psychology actually complicates Reid's view. Studies show children aren't *blindly* credulous; they develop a "Theory of Mind" and start checking the reliability of informants around age 3 or 4. They aren't purely Reidian sponges. If trust were truly a hardwired "Principle of Credulity" in the way Reid describes, it shouldn't be as adjustable by context as it is.

  **It IS NOT a soft spot if:**
  You view it as a **transcendental argument**. Reid isn't necessarily saying, "I have measured the brain and found a trust gland." He is saying, "For human society and knowledge to function *at all*, we must assume this principle is innate."

  He is arguing that skepticism is self-defeating. If you doubt testimony, you have to use testimony to justify that doubt. Therefore, trust must be the "properly basic" belief (to use a modern term).

  ### 5. Why you feel stuck
  You feel stuck because you are intuitively an **Empiricist** (knowledge comes from sensory experience and calibration), while Reid is a **Common Sense Realist** (certain principles are axiomatic and pre-rational).

  *   **You are thinking:** "Trust is a hypothesis that gets updated."
  *   **Reid is thinking:** "Trust is the operating system; skepticism is just an app that runs on top of it."

  When he says, *"Nature intends that our belief should be guided by the authority and reason of others before it can be guided by our own reason,"* he is making a developmental claim. He is saying that **dependency precedes autonomy.** You cannot be an autonomous reasoner without first being a dependent believer.

  ### Summary
  You haven't missed a step. You've identified the exact pivot point where Reid breaks from the Empiricist tradition.

  *   **Your logic:** Experience modifies trust levels (up or down).
  *   **Reid's logic:** Experience can only *reduce* trust, because the initial high level of trust is required to access experience in the first place.

  It is a "soft spot" in the sense that it is an unprovable axiom. Reid can't *prove* credulity is innate; he can only argue that assuming it *isn't* innate leads to an absurdity (that we should know nothing until we are adults). He is betting that the survival of the species is proof enough of the design.

  If you don't buy the "Design/Nature" premise (i.e., if you don't buy that we were "intended" to be social creatures by a "beneficent Author"), his argument loses its teleological force and becomes purely observational—which, as you noted, is vulnerable to your counter-argument.
