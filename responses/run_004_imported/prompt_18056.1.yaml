      *   Total: 7/10.
      *   *Reasoning:* They didn't leave anything out. They just got the theory wrong on half of it. 7/10 feels more like a "Good effort, major conceptual error" grade, whereas 6/10 feels like "Mediocre". Given Part A is flawless, 7/10 is probably more defensible for peer grading. I'll aim for 7/10.

