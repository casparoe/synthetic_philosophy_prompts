          *   Truth in Art: Williams believes art reveals truth, but not necessarily *moral* truth in the propositional sense.
      *   **Political/ethical engagement:** Williams wasn't a conservative "art for art's sake" guy. He cared about truthfulness (*Truth and Truthfulness*). He acknowledged power and harm.

