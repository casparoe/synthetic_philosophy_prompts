      *   **Tragic Ethics/Shame (S&N):** Williams favors the Greek tragic view where agents are enmeshed in necessity, luck, and social context. Ethical life is thicker than just "right vs. wrong." *Relevance:* Does *Don Giovanni* function as a tragedy where Giovanni is a force of nature/necessity, or a crime drama where he is a criminal to be judged?
      *   **Opera Aesthetics (*On Opera*):**
