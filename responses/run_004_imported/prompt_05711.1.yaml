answer: |-
  This is a sophisticated application of Anscombe's ethics to a technological context she could not have anticipated. You have correctly summarized her position in *Mr Truman's Degree*: the moral prohibition rests on the **intentional structure** of the act (killing innocents as a means) rather than the utilitarian calculus (lives saved vs. lives lost).

  To answer your question, we must look primarily at her 1957 book *Intention*, as it provides the metaphysical machinery for the moral claims she makes in *Mr Truman's Degree*.

  Here is an analysis of how an Anscombian framework applies to signature strikes, distinguishing between her explicit texts and necessary extrapolations.

  ### 1. Intention and the "Description of the Act"
  You ask whether intending to kill "whoever matches the pattern" is morally equivalent to intending to kill a named person. For Anscombe, the answer is **yes**.

  In *Intention*, Anscombe argues that intention is not merely a psychological state or a feeling in the mind; it is a matter of the **description under which an action is chosen**. An agent intends X if X is the answer to the question "Why are you doing that?" (in the sense of asking for the reason for the action, not the cause).

  *   **The Name is Irrelevant:** Anscombe does not tie intention to the *identity* of the victim, but to the *description of the victim* in the agent's practical reasoning. If a sniper shoots a soldier, they intend to kill "that soldier." It does not matter if they know his name is Hans or Fritz.
  *   **The Pattern as Description:** In a signature strike, the operator's practical reasoning looks like this: "I am pressing this button *in order to* eliminate the targets at these coordinates." When asked, "Who are the targets?" the answer is, "Those who match the behavioral signature."
  *   **Extrapolation Flag:** Anscombe never discussed algorithmic targeting. However, based on her logic in *Intention* (§§14–18), the abstraction layer (the "pattern") does not dissolve the intention. If the death of the people at those coordinates is required for the action to be successful, their death is intended. The fact that they are unidentified is an epistemic limitation, not a change in the intentional structure.

  **Verdict:** Targeting a pattern is morally equivalent to targeting the specific individuals constituting that pattern. The "pattern" is simply a description of a group of people. To intend to destroy the pattern *is* to intend to kill the people matching it.

  ### 2. The Means/Side-Effect Distinction in Probabilistic Killing
  The crux of *Mr Truman's Degree* is the Doctrine of Double Effect (DDE). Anscombe argues that you may not intend evil (killing innocents) even for a good end, but you may sometimes *foresee* evil as a side effect of a legitimate act.

  Signature strikes complicate this because they rely on probability rather than certainty of combatant status.

  *   **Truman vs. Signature Strikes:** Truman intended the death of civilians *as a means* to break morale. In a "personality strike" (targeting a known combatant), civilian deaths are often argued to be foreseen side effects (collateral damage).
  *   **The Signature Problem:** In a signature strike, the individuals are targeted *because* they exhibit behavior correlated with militancy. However, by definition, the correlation is imperfect. If the intelligence community admits that a certain percentage of those matching the signature are non-combatants, yet authorizes the strike anyway, Anscombe would likely argue that the deaths of those non-combatants are no longer merely "foreseen."
  *   **Why?** Because their presence and death are subsumed under the description of the target. If the strike is considered "successful" even when non-combatants matching the pattern are killed, then their killing is part of the intended outcome, not a regrettable deviation from it.
  *   **Extrapolation Flag:** Anscombe wrote about clear-cut cases (bombing cities vs. bombing factories). She did not write about targeting based on metadata probabilities. However, her rigorous stance on *practical truth* suggests she would reject "probability" as a shield for intention. If you act knowing that "innocents" fall under the description of "target," you intend to kill innocents.

  ### 3. "Intentional Under a Description"
  You mentioned her view that an act can be intentional under one description and not another. This is the most critical point for your software engineering context.

  Consider the code logic of a signature strike:
  ```python
  if behavior_matches_pattern(location):
      authorize_strike()
  ```
  A defender might argue: "We intend to kill *militants* (Description A). We do not intend to kill *civilians* (Description B). We merely foresee that some civilians match Description A."

  Anscombe would likely reject this linguistic maneuver. In *Intention*, she warns against using descriptions to hide what is actually chosen.
  *   **The Test:** Can you separate the two descriptions in the action? If the only way to kill the "militants" (Description A) is to kill everyone at the location, and you know some are "civilians" (Description B), then you are choosing to kill people-under-the-description-civilian.
  *   **The "Who" Matters:** For Anscombe, the moral object of the act is determined by the reality of the situation, not just the agent's internal label. If the reality is that non-combatants are present, and the action chosen ensures their death, the intention extends to them. The "pattern" is a euphemism that attempts to obscure the intentional object (human beings).

  ### 4. The Moral Gap: Identification and Immunity
  Is there a morally relevant gap between targeting a named person and a pattern? Anscombe would likely say **yes**, but not in the way proponents of signature strikes hope.

  *   **Presumption of Innocence:** In Just War theory (which Anscombe broadly accepted, though strictly interpreted), non-combatant immunity is the default. To target someone, you must have positive reason to believe they have forfeited that immunity (i.e., they are combatants).
  *   **The Gap:** Targeting a named person implies specific knowledge of their status. Targeting a pattern implies *probabilistic* knowledge.
  *   **Anscombe's Likely View:** She would argue that acting on probabilistic knowledge regarding life and death treats human life as a variable to be managed rather than a sacred boundary. In *Mr Truman's Degree*, she criticizes the utilitarian view that allows the innocent to be sacrificed for the greater good. Signature strikes institutionalize a risk calculation where innocent death is an accepted variable in the algorithm.
  *   **Extrapolation Flag:** Anscombe did not discuss "risk thresholds." However, her absolutism regarding the killing of the innocent suggests she would view the *policy* of signature strikes as inherently corrupting. It creates a structure where the intention to kill innocents is baked into the rules of engagement, even if no specific operator feels malice.

  ### 5. Summary of the Anscombian Verdict
  If we strictly apply her principles from *Intention* and *Mr Truman's Degree*:

  1.  **Identity is not required for intention:** You intend to kill the people at the coordinates, regardless of whether you know their names. The "pattern" is just the description used to identify them.
  2.  **Foreseen vs. Intended:** If the targeting criteria accept that non-combatants may match the pattern, and you strike anyway, the death of those non-combatants is intended, not merely foreseen. They are part of the "means" to degrade the enemy's capability.
  3.  **Consequences don't redeem:** Even if signature strikes shorten a conflict or save allied lives (the Truman argument), this cannot redeem the intentional killing of those found to be non-combatants.

  **Where I am extrapolating:**
  I am applying her mid-20th-century concepts of "action" and "intention" to autonomous or semi-autonomous systems and metadata analysis. Anscombe focused on human practical reasoning. I am assuming she would view the designers and authorizers of the algorithm as the moral agents whose intentions are being analyzed, rather than the machine itself. She would likely view the "automation" as an attempt to distance the agent from the intention, which she would argue is impossible. You cannot code your way out of moral responsibility for the intentional structure of your actions.

  ### Conclusion for a Software Engineer
  In your terms: Anscombe would argue that **abstraction does not negate causality.**

  Wrapping the killing of humans in a function called `neutralize_signature()` does not change the return type of the function, which is `human_death`. If the developer knows that `input_parameters` sometimes include non-combatants, and the `execute()` function proceeds regardless, the intention to kill non-combatants is hardcoded into the logic. For Anscombe, you cannot refactor away the moral object of the act. The "pattern" is not the target; the people matching the pattern are, and intending their death without certainty of their combatant status would likely constitute murder in her view, regardless of the strategic utility.
