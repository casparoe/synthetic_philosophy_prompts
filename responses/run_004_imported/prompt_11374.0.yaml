  ok so i've fallen down a rabbit hole reading about "acausal trade" on some rationalist blogs late at night — the idea that two agents who could never causally interact (like they're in totally seperate parts of the universe, or one of them is a simulation, or they just exist at different times) might still be able to cooperate or "trade" with each other. i dont have any background in philosophy or decision theory, just been chewing on this on my own, and i've noticed people give pretty different reasons for WHY this is even supposed to work — some of them feel way more solid to me than others, but i can't tell if that's just my gut or if there's actual philosophical weight behind it.

  can you rank these proposed mechanisms for why acausal trade could actually work, from most philosophically solid to most hand-wavy, and give a one-sentence reason for each placement?

  - functional/updateless decision theory: you cooperate because your decision procedure is logically "the same" as theirs, so choosing to cooperate makes it more likely they do too, even with zero causal contact
  - superrationality (the hofstadter thing): two sufficiently rational agents facing a symmetric situation will each reason "if i were them i'd do X, so i should do X," landing on mutual cooperation without any formal decision theory behind it
  - evidential cooperation in large worlds / "multiverse-wide" superrationality: if the universe (or multiverse) is huge enough there's tons of agents out there correlated with you in values and reasoning style, so your choice is evidence for what they choose, and you cooperate on that basis
  - one party simulating the other's mind in enough detail to actually verify they'll hold up their end of the deal
  - sufficiently advanced rational agents just converge on the same values and decisions anyway, so there's nothing left to "trade" over

