      *   **The Age Factor:** Elias brings up the "older men" argument (loosening rigidity). Sarah counters with modern HR/liability realities or the idea that wisdom shouldn't need chemical assistance.
      *   **The "Test" Aspect:** Elias argues you don't know who you are until you've lost control. Sarah argues you should know who you are by *not* losing control.
