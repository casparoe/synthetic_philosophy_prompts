  2.  **Deconstruct the Frequentist Argument (The "Why it breaks" part):**
      *   *Core Concept:* $p$-values are calculated based on the sampling distribution of a statistic *under a specific stopping rule*.
      *   *The Mechanism:* Standard $p$-value calculation assumes a fixed $N$. If you check repeatedly, you perform multiple hypothesis tests.
      *   *The Inflation:* Each check has a chance (e.g., 5%) of a false positive. Cumulative probability grows with each look. $\alpha_{total} = 1 - (1-\alpha)^k$.
      *   *The Fix:* Sequential analysis (alpha spending functions) exists, but standard dashboards don't use them.
      *   *Conclusion:* Person A is technically correct *within the standard frequentist framework* used in most off-the-shelf tools.

  3.  **Deconstruct the Bayesian Argument (The "Does it solve it" part):**
      *   *Core Concept:* Likelihood Principle. The data speaks for itself; the intention of the experimenter (stopping rule) is irrelevant to the posterior *given the prior*.
      *   *The Mechanism:* $P(\theta | Data) \propto P(Data | \theta) \times P(\theta)$. The stopping rule doesn't appear in Bayes' theorem.
      *   *The Catch (The "Relocation"):*
          *   *Priors:* If you peek and stop early, you are often stopping on noise. If your prior is weak/flat, the posterior will be volatile. You might stop on a false signal driven by the prior or early noise.
          *   *Decision Rules:* Bayesian A/B testing isn't just about looking at a posterior; it's about making a *decision*. If you define a rule like "Stop if $P(B > A) > 95\%$", you have implicitly created a frequentist property (error rate) associated with that rule.
          *   *Calibration:* If you simulate a Bayesian stopping rule over many experiments, does it control false discoveries? It depends on the prior. If the prior is wrong, the error rates blow up.
      *   *Conclusion:* Person B is theoretically correct about *inference* (the posterior is valid), but potentially wrong about *decision making* (stopping early can still lead to costly errors if not calibrated).

