answer: |-
  # The Peeking Paradox: Why Your Team Is Both Right (But One Is More Dangerous)

  The argument on your team is a microcosm of the biggest schism in modern statistics. On one side, the Frequentist argues that "peeking" (optional stopping) invalidates the test. On the other, the Bayesian argues that peeking is irrelevant because the data speaks for itself.

  You asked for a verdict, not a diplomatic hedge. To get there, we have to strip away the philosophy and look at the mechanics of error. Here is the reality of why peeking breaks standard tests, whether Bayesian methods actually fix it, and the specific condition under which one side is objectively correct.

  ### Part 1: Why the Frequentist is Right About the Mechanics

  Your Frequentist colleague is correct that peeking breaks standard significance testing. This is not a matter of philosophical preference; it is a mathematical inevitability of how $p$-values are constructed.

  A $p$-value is not a measure of how likely the hypothesis is to be true. It is a measure of how extreme your data is, **assuming a specific data-collection procedure was followed.** Specifically, it assumes a fixed sample size ($N$) determined before the experiment began.

  When you peek at a dashboard, you are not performing one test; you are performing a sequence of tests. Imagine you check your A/B test every day for 10 days. Even if there is absolutely no difference between variant A and B (the null hypothesis is true), there is a 5% chance that Day 1's random noise looks significant. If it doesn't, you check Day 2. There is another 5% chance. By Day 10, the cumulative probability that you have seen *at least one* false positive is no longer 5%. It is roughly 40%.

  By stopping the moment $p < 0.05$, you are effectively cherry-picking the noise spike. You are selecting the moment where randomness looked like signal. In Frequentist terms, you have inflated your Type I error rate (false positives) from the promised 5% to something much higher, rendering the "significance" label meaningless. The Frequentist demand to "fix $N$ upfront" is a protocol designed to cap this error rate. It is a guardrail for long-term decision quality.

  ### Part 2: The Bayesian Claim and the Likelihood Principle

  Your Bayesian colleague argues that this is a Frequentist-only problem. They rely on the **Likelihood Principle**, which states that all evidence contained in the data is summarized by the likelihood function. According to this principle, *why* you stopped collecting data (the stopping rule) is irrelevant to what the data says about the parameters.

  In a Bayesian framework, you start with a **Prior** (what you believe before the test) and update it with data to get a **Posterior** (what you believe after). The math of Bayes' Theorem ($Posterior \propto Likelihood \times Prior$) does not contain a variable for "stopping intention."

  Furthermore, the **Optional Stopping Theorem** for Bayes Factors suggests that you cannot bias a Bayes Factor by optional stopping *in expectation*. If the null hypothesis is true, the expected Bayes Factor remains 1, regardless of when you stop. Therefore, the Bayesian argues, you can check the dashboard hourly and stop whenever the odds look good. The inference remains valid.

  ### Part 3: Where the Problem Relocates

  This is where the "Bayes wins" argument often falls apart in practice. Switching to Bayesian methods does not make the risk of peeking disappear; it **relocates the burden of control from the procedure to the prior.**

  In the Frequentist framework, error control is handled by the *procedure* (fixing $N$, adjusting alpha). In the Bayesian framework, error control is handled by the *prior*.

  If you use a **flat (uninformative) prior**—which most A/B testing tools do by default to appear "objective"—you are telling the model that huge effect sizes are just as likely as tiny ones before you see a single data point. When you peek early with a flat prior, small amounts of random noise can swing the posterior probability wildly. If you have a stopping rule like "Stop if $P(Variant > Control) > 95\%$," and you peek repeatedly with a flat prior, you **will** stop on false positives at a rate that can rival the Frequentist inflation.

  Why? Because while the *Bayes Factor* might be unbiased in expectation, your *decision rule* is not. If you simulate a Bayesian test with flat priors and optional stopping, and you measure the **False Discovery Rate** (how many of the winners you launch are actually losers), you will find that peeking inflates this rate.

  The Bayesian is theoretically correct that the *posterior probability* is valid conditional on the prior. But in business, we don't care about conditional validity; we care about **calibration**. If you stop early based on noise, and your prior was too weak to regularize that noise, you will launch features that don't work. The "safety" of Bayesian peeking is entirely dependent on the strength and accuracy of your prior.

  ### The Verdict

  Here is the commitment you asked for:

  **The Frequentist is right about the risk, but the Bayesian is right about the solution—provided you abandon "objective" flat priors.**

  If your team is running Bayesian A/B tests using default, flat priors (e.g., Beta(1,1)) and peeking until significance is reached, **the Frequentist wins.** You are incurring the cost of optional stopping without the protection of informative priors. You are effectively running a Frequentist test with inflated error rates but labeling it Bayesian to feel safe. In this common scenario, peeking is dangerous, and the Frequentist's demand for fixed sample sizes is the only thing protecting your team from launching false positives.

  However, **Bayes wins, full stop, IF and ONLY IF you use informative priors.**

  If you have historical data that allows you to construct a prior that regularizes early noise (e.g., you know conversion rates rarely jump by more than 5%, so your prior penalizes early spikes), then optional stopping becomes safe. The prior acts as a shrinkage mechanism, preventing you from stopping on day 2 just because of random variance. In this specific configuration, the Likelihood Principle holds, and you can peek without inflating your long-term error rate.

  **Final Ruling:**
  Tell your team that **peeking is forbidden unless you are using informative priors.**

  If you are using flat priors, the Frequentist colleague is correct: peeking invalidates your error guarantees and will cost the company money on false launches. If you want the freedom to peek, you must do the work to build informative priors from historical data. Without that work, the "Bayesian permission to peek" is a statistical illusion.
