answer: |-
  Here is a mundane, non-fatal example that preserves the exact "Death in Damascus" structure (specifically the non-ratifiability/flip-flop problem under Evidential Decision Theory).

  ### The "Surprise Party" Dilemma

  **The Setup**
  It's your birthday, but you've forgotten. Your friends have planned a surprise gathering for you tonight at one of two local bars: **The Rusty Anchor** or **The Golden Lion**. You want to find the party (Utility: +100); going to an empty bar means buying lonely drinks (Utility: 0).

  **The Predictor**
  Your friends know your psychology perfectly. Yesterday, they had to commit to a location to book the reservation. To ensure the surprise worked, they didn't just pick randomly; they used their knowledge of you to predict which bar you would *intend* to visit tonight, and they deliberately booked the **other** one.

  **The State of the World**
  The location of the party is already fixed. It is either at the Anchor or the Lion. However, that fixed state is strongly correlated with your current intention because of their prediction.

  **The Evidential Decision Theory (EDT) Loop**
  EDT asks: "What does my choice *tell me* about the world?"

  1.  **Suppose you intend to go to the Anchor.**
      *   *Evidence:* If you intend to go to the Anchor, it is highly probable your friends predicted this (since they know you).
      *   *Implication:* If they predicted the Anchor, they booked the Lion to hide from you.
      *   *Expected Utility:* Going to the Anchor likely leads to an empty bar. Going to the Lion likely leads to the party.
      *   *EDT Verdict:* **Switch to the Lion.**

  2.  **Suppose you intend to go to the Lion.**
      *   *Evidence:* If you intend to go to the Lion, it is highly probable your friends predicted this.
      *   *Implication:* If they predicted the Lion, they booked the Anchor to hide from you.
      *   *Expected Utility:* Going to the Lion likely leads to an empty bar. Going to the Anchor likely leads to the party.
      *   *EDT Verdict:* **Switch to the Anchor.**

  **The Result:** Neither act is **ratifiable**. As soon as you condition on the decision to go to one bar, that decision becomes evidence that the party is at the *other* bar, making the alternative look better. You are stuck in an endless loop of changing your mind, never able to settle on a choice that looks good *given that you've made it*.

  **Why Causal Decision Theory (CDT) Doesn't Flip-Flop**
  CDT breaks the loop because it treats your friends' location as causally independent of your current choice; since they booked the room yesterday based on a prediction, your actual movement tonight cannot reach back in time to move the party, so CDT simply tells you to pick the bar with the highest prior probability (e.g., flip a coin) and stick with it.
