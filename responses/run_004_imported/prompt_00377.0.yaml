      *   *Priors:* Ramsey is often interpreted as allowing *any* priors as long as they are coherent. He explicitly rejects Keynes's idea that there are objective logical probability relations.
      *   *Truth:* He has a redundancy theory of truth and a pragmatic view of knowledge.
      *   *Human Psychology:* He was deeply interested in the psychology of belief (maps, habits). He acknowledged human limitations.
