      *   *Nuance:* Ramsey wasn't an "anything goes" subjectivist. He believed in learning from experience. If agents share enough experience, priors might converge. But *ex ante* identity? That's a stretch for Ramsey.
      *   *Real-World Disagreement:* Ramsey would likely point to the psychological and pragmatic aspects.
