          *   *Priors:* He would accept that priors differ due to different psychological makeups or past experiences (which constitute the "prior" for the current interaction).
          *   *Utility:* Ramsey ties belief to desire (utility). Aumann assumes common utility or focuses purely on belief. Ramsey might argue disagreement persists because utilities differ, affecting what we attend to or how we process info.

