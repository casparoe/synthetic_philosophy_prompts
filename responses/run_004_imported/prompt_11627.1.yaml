answer: |-
  You are not crazy, you are not dumb, and your group is not cursed. You have stumbled directly into one of the most famous problems in mathematics and economics.

  The short answer to your question is: **Yes, it is actually impossible.** There is no ranking or scoring method that can guarantee a "fair" result 100% of the time without running into the exact contradictions you described.

  This isn't a flaw in your friends' logic or a bug in your spreadsheet. It is a fundamental feature of how group preferences work. Here is the breakdown of what happened to you, why the math says it's unavoidable, and what you can actually do about it.

  ### 1. The Circle (The Condorcet Paradox)
  The first issue you described (Thai > Burgers > Pizza > Thai) is called the **Condorcet Paradox**.

  It feels like it shouldn't happen because we assume that if Person A prefers X over Y, and Y over Z, the *group* should follow that same logic. But individual consistency does not guarantee group consistency.

  **Here is how it happens with just 3 friends:**
  *   **Friend 1:** Thai > Burgers > Pizza
  *   **Friend 2:** Burgers > Pizza > Thai
  *   **Friend 3:** Pizza > Thai > Burgers

  If you vote head-to-head:
  *   **Thai vs. Burgers:** Friend 1 and 3 prefer Thai. **Thai wins.**
  *   **Burgers vs. Pizza:** Friend 1 and 2 prefer Burgers. **Burgers wins.**
  *   **Pizza vs. Thai:** Friend 2 and 3 prefer Pizza. **Pizza wins.**

  Everyone had a perfectly logical, consistent ranking. But the *group* preference is a rock-paper-scissors loop. This happens more often than people think, especially with 3 or 4 distinct options (like cuisines) where preferences are polarized.

  ### 2. The Flip (Independence of Irrelevant Alternatives)
  The second issue Priya noticed (removing the last-place restaurant flips the winner of the other two) is a violation of something called **Independence of Irrelevant Alternatives (IIA)**.

  In a points system (3 for 1st, 2 for 2nd, etc.), the "loser" isn't just dead weight; they are actively dragging down the scores of the winners based on where people ranked them.

  **Example:**
  Imagine Thai and Burgers are close. But everyone hates Pizza.
  *   If Pizza is on the ballot, people rank it 3rd. That means Thai and Burgers are fighting for 1st and 2nd place points.
  *   If you remove Pizza, those same people now rank their 2nd choice as 1st, and their 3rd choice as 2nd. The *point values* shift.

  Priya was right to be suspicious. In a truly robust system, the preference between Thai and Burgers shouldn't change just because Pizza was removed. But in points-based systems (Borda Count), it does. This is a known mathematical weakness of scoring systems.

  ### 3. The "No Perfect System" Proof
  You asked if there is some approach out there that's actually clean. In 1951, an economist named Kenneth Arrow proved that there isn't. It's called **Arrow's Impossibility Theorem**.

  He laid out a list of criteria that seem like basic requirements for a fair voting system:
  1.  **No Dictator:** One person shouldn't decide for everyone.
  2.  **Pareto Efficiency:** If everyone prefers A over B, the group result should be A over B.
  3.  **Independence of Irrelevant Alternatives:** Removing a losing option shouldn't change the winner between the remaining options (Priya's observation).
  4.  **Unrestricted Domain:** The system should work for any set of individual preferences.

  **Arrow proved mathematically that no rank-order voting system can satisfy all of these conditions at once.** You have to sacrifice at least one.

  *   Your points system sacrificed **IIA** (Priya's flip).
  *   Your head-to-head system sacrificed **Transitivity** (the circular loop).

  So, the half of your group that thinks the ranking idea is "cursed" is technically right: a perfect system does not exist. But the half that thinks you haven't landed on the right method *yet* is also right: you can find a method that is *less annoying* for your specific group.

  ### 4. Practical Solutions for a Dinner Club
  Since you can't fix the math, you have to manage the social dynamics. For a group of 8 friends, you don't need a system that works for 100 million voters; you need one that preserves friendships. Here are three approaches that handle these paradoxes better than standard ranking:

  **A. Approval Voting (The "Thumbs Up" Method)**
  Instead of ranking (1st, 2nd, 3rd), everyone simply votes "Yes" or "No" on every restaurant.
  *   **Why it helps:** It breaks the Condorcet Cycle. If Thai gets 7 yeses, Burgers 6, and Pizza 5, Thai wins. It measures intensity of support rather than relative order. It also largely avoids the "removing the loser flips the winner" problem because the score for Thai doesn't depend on whether Pizza is on the list.
  *   **The trade-off:** It doesn't capture nuance (e.g., "I love Thai but I'm okay with Burgers" looks the same as "I'm indifferent to both").

  **B. Range Voting (The "Score" Method)**
  Instead of ranking, everyone rates each restaurant on a scale of 1 to 5 stars.
  *   **Why it helps:** This gives more data than ranking. If Thai is everyone's "5" and Burgers is everyone's "3", Thai wins decisively. If the cycle happens, the *magnitude* of the scores usually breaks the tie. It feels more like a consensus than a competition.
  *   **The trade-off:** People interpret scales differently (some never give a 1, some never give a 5).

  **C. The "Veto" Method (Negative Voting)**
  This is often the most fun for friends. Everyone gets one **Veto**.
  *   You propose 4 restaurants.
  *   Everyone can veto *one* place they really don't want (or pass if they like them all).
  *   If a place gets vetoed, it's out. Pick randomly from the survivors.
  *   **Why it helps:** It focuses on avoiding misery rather than maximizing joy. In a friend group, ensuring no one is stuck at a place they hate is usually more important than finding the mathematical "best" place. It also makes the Condorcet Paradox irrelevant because you aren't ranking, you're eliminating.

  ### The Verdict
  You haven't been unlucky. You've discovered **Arrow's Impossibility Theorem** in real time over takeout.

  If you want to keep voting, switch to **Range Voting (1-5 stars)**. It is generally considered the most robust method for small groups because it captures *how much* people want something, which usually breaks the cycles and reduces the "flip" effect Priya noticed.

  However, if the voting process itself is causing more stress than the food is worth, the other half of your group is right: go back to taking turns. But add a constraint: The person whose turn it is picks the restaurant, but *anyone* can veto it if they have a genuine dietary issue or strong aversion. That balances control with consent, and bypasses the math entirely.
