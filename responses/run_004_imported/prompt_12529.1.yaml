      *   **Part (c): Difference Principle vs. Equal Distribution.**
          *   *Rawls's Position:* The Difference Principle allows inequalities *if* they benefit the least advantaged. It is *not* strict equality. Strict equality is the benchmark, but inequalities are permitted if they raise the floor.
          *   *Student's Answer:*
              *   "the stable resting point is one in which income, wealth, and the other primary goods are held equally: any deliberate departure from equal shares would just reintroduce... the kind of gamble..."
