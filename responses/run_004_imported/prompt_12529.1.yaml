              *   *Assessment:* The student understands Harsanyi well but fundamentally misstates Rawls's objection. Rawls doesn't say "Equal probabilities are fine, but don't maximize EU." He says "You can't assume equal probabilities." This is a major philosophical slip in an upper-level seminar.
