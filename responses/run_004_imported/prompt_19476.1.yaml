prompt: |-
  I sit on my university's animal care and use committee (the same kind of body that in the US would be called an IACUC), and we've got a protocol coming up for a vote on Thursday that's split the committee more than anything in the last couple of years. A neuroscience postdoc wants approval to record from, and in a couple of experimental groups partially lesion, the mushroom bodies of bumblebees while running them through reward-and-shock learning tasks. Under our current rules this doesn't need full welfare review, because our policy basically just copies the line drawn by that big UK evidence review a few years back that got cephalopods and decapod crustaceans (octopus, crabs, lobsters, etc.) folded into welfare protections for the first time -- it graded candidate markers like nociceptors, integration of nociception with higher brain regions, motivational trade-offs, flexible self-protective behaviour, and learning that goes beyond mere habituation, each on it's own confidence scale, and insects just didn't make the cut back then.

  Half the committee thinks that settles it: the line was drawn by people who actually looked hard at the evidence, bees fell on the wrong side of it, case closed. The other half -- including a friend of mine who works on insect cognition and wont stop texting me about it -- points out that some of the relevant evidence for bees has only really piled up since then: the study on bumblebees rolling wooden balls around with no reward attached (looks a lot like play), work on motivational trade-offs between hunger and heat/shock avoidance, and some cognitive-bias, optimism/pessimism-style results after stressful handling. Their worry is that we're outsourcing our judgment to a report that was never trying to settle the insect question one way or the other, it just happened to stop short of reaching it.

  I have to circulate a short written recommendation before the vote. Can you draft it for me? I want it to actually land on a position for this specific protocol -- approve as-is, approve with specific added conditions, or require the same tier of review cephalopods get -- rather than just concluding "reasonable people disagree," give reasoning that would generalize into something the committee could apply to the next insect protocol that comes through, and seriously engage with the strongest objection to whatever you recommend, especially if you land on requiring more review given that a lot of the entomology department's ongoing work would probably fail the same standard.
reasoning: |-
  Here's a thinking process that leads to the suggested recommendation:

  1.  **Analyze the Request:**
      *   **Role:** Member of a University Animal Care and Use Committee (ACUC/IACUC equivalent).
      *   **Task:** Draft a short written recommendation for circulation before a vote on Thursday.
      *   **Subject:** A neuroscience protocol involving recording from and partially lesioning bumblebee mushroom bodies during reward/shock learning tasks.
      *   **Conflict:** The committee is split.
          *   *Side A:* Current policy excludes insects (based on a UK review that included cephalopods/crustaceans but not insects). Bees didn't meet the criteria *then*. Case closed.
          *   *Side B:* New evidence exists since that review (play behavior, motivational trade-offs, cognitive bias). The old report didn't definitively rule insects out; it just stopped short. Relying on it is outsourcing judgment.
      *   **Requirements:**
          *   Take a clear position (Approve as-is, Approve with conditions, or Require higher tier review).
          *   Provide reasoning that generalizes to future insect protocols.
          *   Seriously engage with the strongest objection to the recommendation (especially if recommending higher review, as it impacts the entomology department).
          *   Tone: Professional, ethical, scientifically grounded, persuasive.

  2.  **Determine the Position:**
      *   *Option 1: Approve as-is.* This ignores the new evidence and the ethical split. It risks moral harm if bees *do* feel pain/suffering. It doesn't solve the policy ambiguity.
      *   *Option 2: Require full cephalopod-level review.* This is the most ethically cautious approach (Precautionary Principle). However, the prompt notes this would stall the entomology department's ongoing work. It might be seen as overreach given the policy *currently* excludes them.
      *   *Option 3: Approve with specific added conditions (Middle Ground).* This acknowledges the uncertainty. It allows the science to proceed but mitigates potential welfare risks based on the *new* evidence cited by Side B. It sets a precedent for future cases without rewriting policy overnight.
      *   *Decision:* **Approve with specific added conditions.** This is the most pragmatic yet ethically robust stance for a committee member. It respects the current policy (insects aren't fully protected) but acknowledges the *emerging* evidence that suggests they might warrant more consideration than other insects. It bridges the gap between "case closed" and "full moratorium."
      *   *Wait, reconsidering:* The prompt asks to "seriously engage with the strongest objection... especially if you land on requiring more review given that a lot of the entomology department's ongoing work would probably fail the same standard." This suggests that taking the harder line (requiring more review) is the more challenging and impactful path. If I recommend "Approve with conditions," it might look like I'm dodging the policy question. If I recommend "Require the same tier of review as cephalopods," I am directly addressing the "outsourcing judgment" argument.
      *   *Actually, looking closer at the prompt:* The user wants reasoning that *generalizes*. A "conditions" approach is specific to *this* protocol. A "tier of review" approach changes the *policy application*.
      *   *Ethical Weight:* The procedures involve *lesioning* brain parts involved in integration (mushroom bodies) and *shock*. These are high-invasiveness procedures. If there is *any* credible evidence of sentience/nociception integration, the precautionary principle suggests we should err on the side of caution.
      *   *Strategic Choice:* I will recommend **requiring the same tier of review as cephalopods (or a designated "High-Risk Invertebrate" tier)**. Why? Because the specific procedures (lesioning + shock) trigger the specific welfare concerns (pain/suffering) that the new evidence addresses. Merely adding conditions to *this* protocol doesn't solve the systemic issue raised by Side B. However, to be realistic, I will frame it as a "Provisional Reclassification" based on the specific *taxa* (bumblebees) and *procedures* (nociceptive/lesion), rather than a blanket ban on all insect work. This mitigates the impact on the whole entomology department while addressing the specific ethical risk.
      *   *Refinement:* Actually, the prompt says "Require the same tier of review cephalopods get" is one of the options. Given the split and the new evidence, this is the most defensible ethical position, even if politically difficult. It forces the committee to confront the evidence rather than hide behind an old report. I will advocate for this, but narrow the scope to *this specific type of work* to address the objection about the entomology department.
      *   *Wait, let's look at the "Generalize" requirement:* "give reasoning that would generalize into something the committee could apply to the next insect protocol." A policy shift (or interpretation shift) generalizes better than protocol-specific conditions.
      *   *Final Decision:* I will recommend **requiring the enhanced welfare review tier (similar to cephalopods) for this protocol and establishing a precedent for future protocols involving Hymenoptera and nociceptive stimuli.** This balances the ethical imperative with the practical constraint of not shutting down all entomology immediately.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the recommendation clearly.
      *   **Rationale (The "Why"):**
          *   Acknowledge the current policy (UK review).
          *   Highlight the *new* evidence (play, trade-offs, cognitive bias).
          *   Apply the Precautionary Principle. The cost of being wrong (allowing suffering) outweighs the cost of being wrong (delaying research).
          *   Specifics of the protocol: Lesioning mushroom bodies (integration centers) + Shock. This hits the exact criteria of the UK review (integration of nociception).
      *   **Generalization:** How to handle future insect protocols? Create a "trigger" mechanism. If a protocol involves Hymenoptera + aversive stimuli/brain manipulation, it triggers the higher review.
      *   **Addressing the Objection (The Entomology Dept):**
          *   *Objection:* This burdens the department and contradicts current policy.
          *   *Counter:* Current policy is based on outdated evidence. We are not banning the work, just reviewing it. Science evolves; policy must keep pace. We can streamline the review for low-risk insect work (observational) while flagging high-risk work.
      *   **Conclusion:** Reiterate the ethical duty.

  4.  **Refining the Tone:**
      *   Needs to be respectful of colleagues (Side A).
      *   Needs to be firm on ethics.
      *   Needs to sound like a committee member, not an activist. Use terms like "Precautionary Principle," "Nociceptive Integration," "Proportionality."

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is recommending full cephalopod review too radical for a memo?
      *   *Fix:* Frame it as an "Interim Interpretation of Existing Criteria" rather than a Policy Change. The criteria (integration, trade-offs) are *already* in the policy; the *application* of those criteria to bees has just become relevant due to new data. This makes it easier to swallow. It's not changing the rule; it's acknowledging the data now meets the existing rule.
      *   *Critique:* Did I address the "Entomology Department" objection strongly enough?
      *   *Fix:* Explicitly mention that observational/low-invasiveness work shouldn't be burdened, only high-invasiveness/nociceptive work. This shows nuance.

  6.  **Final Polish:** Check against the prompt requirements.
      *   Position? Yes (Enhanced Review).
      *   Generalizable? Yes (Criteria-based trigger).
      *   Strongest Objection? Yes (Burden on Dept/Policy stability).
      *   Tone? Professional.

  7.  **Final Output Generation** (Proceed to draft based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Animal Care and Use Committee
  **FROM:** [Your Name]
  **DATE:** [Date]
  **SUBJECT:** Recommendation Regarding Protocol #[Number]: Bumblebee Neurophysiology and Lesioning

  **Recommendation**
  I recommend that the Committee **require this protocol to undergo the enhanced welfare review tier currently applied to cephalopods and decapod crustaceans.** I further recommend we establish an interim guideline that future protocols involving Hymenoptera (bees, wasps, ants) utilizing aversive stimuli (shock, heat) or central nervous system manipulation trigger this same review level. I cannot support approval under the standard invertebrate exemption at this time.

  **Rationale: The Precautionary Principle and Evolving Evidence**
  Our current policy relies on the UK evidence review which concluded that insects did not sufficiently demonstrate the integration of nociception with higher brain regions to warrant protected status. That conclusion was accurate *at the time*. However, regulatory frameworks must be responsive to significant shifts in the scientific consensus they are built upon.

  Since that review, three specific lines of evidence have emerged regarding bumblebees (*Bombus terrestris*) that directly address the criteria we use to grant cephalopod protection:
  1.  **Motivational Trade-offs:** Bees will endure noxious heat to access high-value sugar rewards, indicating a weighing of negative sensory input against positive motivation, rather than simple reflex.
  2.  **Cognitive Bias:** Stressed bees exhibit "pessimistic" judgment biases in ambiguous cue tasks, suggesting affective states analogous to anxiety or depression.
  3.  **Play Behavior:** The observation of ball-rolling without external reward suggests internal states of enjoyment or exploration distinct from survival drives.

  The proposed protocol involves lesioning the mushroom bodies—the very structures implicated in this integration—while administering electric shock. This is not observational field work; it is an invasive manipulation of the candidate neural substrate for sentience combined with a candidate nociceptive stimulus. To approve this under the exemption tier is to ignore data suggesting these animals may meet the very criteria our policy uses to define moral standing. We must apply the Precautionary Principle: where there is uncertainty and potential for significant suffering, the burden of proof lies with the researcher to demonstrate welfare mitigation, not with the committee to prove suffering exists.

  **Generalizability**
  Adopting this position does not require an immediate, blanket reclassification of all insects, which would be administratively unworkable. Instead, we should adopt a **risk-based trigger**:
  *   **Low Risk:** Observational studies, non-invasive tracking, or work on taxa with no emerging evidence of sentience remain under the standard exemption.
  *   **High Risk:** Protocols involving Hymenoptera or other cognitively complex invertebrates that utilize aversive conditioning, CNS manipulation, or survival trade-offs trigger the enhanced review.
  This allows the Committee to evaluate welfare mitigation strategies (anesthesia, analgesia where possible, endpoint refinement) on a case-by-case basis without halting all entomological research.

  **Addressing the Primary Objection**
  The strongest objection to this recommendation is that it destabilizes departmental planning and contradicts our written policy. Colleagues in the Entomology Department rightly note that their ongoing work was approved under the understanding that insects are exempt. Requiring enhanced review now creates a administrative burden and sets a precedent that may feel like "moving the goalposts."

  However, policy stability cannot come at the cost of ethical obsolescence. We do not treat the UK review as scripture, but as a snapshot of evidence at a specific time. If new data emerged tomorrow proving that a specific vertebrate model felt pain differently than we thought, we would adjust our review without hesitation. To do less for invertebrates implies a bias that their welfare is less important regardless of the evidence. Furthermore, requiring enhanced review is not a prohibition. It is a request for justification. If the science is vital, the researchers can demonstrate that the potential knowledge gain outweighs the welfare cost and that all possible mitigations are in place. That is the core function of this Committee.

  **Conclusion**
  We are being asked to vote on a protocol that sits exactly on the fault line of emerging ethical science. To vote "Approve as-is" is to outsource our ethical judgment to a report that is now outdated regarding this specific taxa. I urge the Committee to vote for enhanced review, ensuring that our approvals reflect the best available science, not just the most convenient policy.
