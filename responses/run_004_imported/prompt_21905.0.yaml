prompt: |-
  I've spent the past few months reporting a feature on how philanthropic funders are trying to bring more rigor to decisions about existential-risk research, and something a source told me over coffee last week has stayed with me. She sits on a small technical advisory committee at a foundation that funds work aimed at reducing catastrophic risks from advanced AI. For every proposal, each of the committee's five members privately estimates the probability that the research direction under review will meaningfully reduce that risk within a decade, and those numbers feed into a standard expected-value formula the foundation uses to rank proposals against their cost. For one recent proposal, the five estimates ranged from around 5 percent to 65 percent. She was confident this wasn't simply a matter of some members being better informed than others: everyone had read the same background material, and when she pressed the outliers to defend themselves, nobody budged or conceded error, because each was weighing the same thin, genuinely inconclusive evidence in a defensible way. She also doubts that polling a dozen more advisors would have narrowed that spread; if anything, she suspects it would just have produced more reasonable-sounding numbers scattered across the same wide range.

  Since the foundation's rules call for a single number, the committee averaged the five estimates and let the proposal move forward, but my source admitted it felt like a small sleight of hand: the average implies a shared, settled view that plainly doesn't exist, and it quietly discards the fact that this estimate was contested in a way that, say, five estimates clustered tightly around 30 percent would not have been. She's now turning over whether the committee should instead have deferred to the most pessimistic member, reported a range rather than a point estimate, or handled it some other way entirely, and she asked me, half-joking, whether she'd simply flunked a statistics test or whether her unease was tracking something real. I'd like to work out whether she's onto something. Is there a principled objection to folding that kind of disagreement into a single number, or is this just the ordinary, unavoidable texture of deciding under uncertainty? And if there's a genuine problem here, what would handling it well actually look like for a committee like hers?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a journalist reporting on philanthropic funding for existential-risk (x-risk) research, specifically advanced AI.
      *   **The Scenario:** A technical advisory committee (5 members) estimates the probability of a proposal's success (risk reduction within a decade). Estimates ranged from 5% to 65%. Everyone had the same info, evidence was thin/inconclusive, and no one conceded. The foundation averaged the numbers to get a single expected value (EV) for ranking.
      *   **The Source's Concern:** Averaging feels like a "sleight of hand." It hides the disagreement (uncertainty about the probability itself) and treats a contested 35% average the same as a consensus 35%. She wonders if they should defer to the pessimist, report a range, or do something else.
      *   **The Question:** Is there a *principled objection* to averaging these probabilities, or is this just normal uncertainty? If there's a problem, what does handling it *well* look like?
      *   **Tone:** Intellectual, nuanced, rigorous but accessible (suitable for a journalist writing a feature). Needs to validate the source's intuition while providing technical depth.

  2.  **Deconstruct the Core Problem:**
      *   **The Mathematical Act:** Averaging probabilities (Linear Opinion Pooling).
      *   **The Epistemic State:** Deep uncertainty, model disagreement, "thin evidence."
      *   **The Decision Context:** Existential risk, high stakes, resource allocation.
      *   **The Issue:** "Uncertainty about probabilities" (second-order uncertainty) vs. "Uncertainty about outcomes" (first-order uncertainty). Averaging collapses second-order uncertainty into a single first-order number.

  3.  **Evaluate the "Averaging" Approach (Linear Opinion Pooling):**
      *   *Pros:* Simple, satisfies certain coherence axioms (sometimes), easy to plug into EV formulas.
      *   *Cons:* Loses information about variance/disagreement. Can be manipulated (strategic voting). Treats "I don't know" the same as "I know it's 50%."
      *   *Key Insight:* In high-stakes, non-ergodic contexts (like x-risk), the *distribution* of beliefs matters more than the mean.

  4.  **Identify Principled Objections (The "Yes, she's onto something" part):**
      *   **Second-Order Uncertainty (Ambiguity):** Distinguish between *risk* (known probabilities) and *ambiguity* (unknown probabilities). Averaging hides ambiguity.
      *   **Fat Tails/Convexity:** In x-risk, the cost of being wrong is asymmetric. If the pessimist is right (5%), we waste money. If the optimist is right (65%) and we listen to the pessimist, we miss a huge win. But usually, in x-risk, we worry about *false positives* (wasting resources on ineffective things) or *false negatives* (ignoring a real threat). Actually, the specific context is *funding research to reduce risk*. If the research doesn't work (pessimist right), resources are wasted. If it does work (optimist right), risk is lowered.
      *   **The "Precautionary Principle" vs. "Maximize EV":** Standard EV maximization says average. Precaution might say listen to the pessimist (if the risk is the research *failing* to help). Wait, let's look closer. The probability is "research will meaningfully reduce risk."
          *   Optimist (65%): High chance this helps.
          *   Pessimist (5%): Low chance this helps.
          *   If we fund based on average (35%), we might fund low-impact stuff.
          *   *Crucial Point:* In contexts with "model uncertainty," the *variance* itself should discount the value. This is related to the *Ellsberg Paradox* and *Ambiguity Aversion*. Rational agents often prefer known risks over unknown ambiguities.
      *   **Information Aggregation:** Averaging assumes errors cancel out. But if the evidence is "thin and inconclusive," errors might be *correlated* (everyone is guessing) or *systematic* (different priors). If it's different priors, averaging is arguably the only fair way *unless* one prior is demonstrably worse. But the source says "defensible way."
      *   **Decision Robustness:** A decision is robust if it holds across a range of plausible models. If the decision to fund flips depending on whether you pick the 5% or the 65%, the decision is *fragile*. Averaging hides fragility.

  5.  **Develop Alternative Approaches (The "What does handling it well look like" part):**
      *   **Report the Range:** Don't collapse. Show the spread.
      *   **Robust Decision Making (RDM):** Test the decision against the extremes. Does the proposal pass the cost-benefit analysis even at the 5% estimate? If yes, fund it confidently. If only at 65%, it's risky.
      *   **Bayesian Model Averaging (BMA):** Technically sophisticated, but requires assigning weights to the *members* as models. Hard to do socially.
      *   **Delphi Method:** Iterative anonymous feedback to see if convergence is possible (though source doubts this).
      *   **Value of Information (VoI):** The disagreement itself signals high VoI. Maybe fund *evaluation* or *milestones* rather than a lump sum.
      *   **Portfolio Approach:** Don't treat proposals individually. If you have high variance across proposals, diversify.

  6.  **Synthesize and Structure the Response:**
      *   **Validation:** Start by affirming the source's intuition. It is not a statistics failure; it's a feature of deep uncertainty.
      *   **The Core Concept:** Distinguish between *Risk* (known odds) and *Ambiguity/Deep Uncertainty* (unknown odds). Averaging conflates them.
      *   **Principled Objections:**
          1.  *Loss of Second-Order Uncertainty:* The variance contains information.
          2.  *Ambiguity Aversion:* Rational to discount highly contested estimates.
          3.  *Fragility:* If the decision hinges on the average, it's not robust.
      *   **Practical Solutions:**
          1.  *Robustness Checks:* Fund only if it passes the pessimist's threshold (or a specific quantile).
          2.  *Reporting Distributions:* Visualize the spread.
          3.  *Milestone-Based Funding:* Reduce exposure to the uncertainty.
          4.  *Meta-Analysis:* Investigate *why* they disagree (priors vs. interpretation).
      *   **Conclusion:** The "sleight of hand" is real. The solution isn't better math, but better decision architecture.

  7.  **Refine the Tone:**
      *   Avoid overly dense jargon. Explain "second-order uncertainty" clearly.
      *   Acknowledge the specific domain (AI x-risk) where stakes are high and data is scarce.
      *   Reference relevant concepts (Knightian uncertainty, Ellsberg, Robust Decision Making) without showing off.
      *   Keep it actionable for the journalist's story.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* I initially thought about deferring to the pessimist. But in *funding* research, the pessimist says "this won't work." If we defer to them, we fund nothing. If we defer to the optimist, we might waste money. The right approach is usually *conditional* funding or checking if the EV is positive even at the lower bound.
      *   *Nuance:* Averaging *is* standard practice (Linear Opinion Pooling). I shouldn't say it's "wrong" mathematically, but "insufficient" for the decision context. It satisfies external coherence but fails internal decision robustness.
      *   *Key Distinction:* Is the disagreement due to *private information* or *different priors/models*? Source says "same background material... weighing same thin evidence." This suggests different priors or interpretive frameworks. This makes averaging less defensible than if they had private signals.

  9.  **Final Polish:** Ensure the distinction between "uncertainty about the world" and "uncertainty about our model of the world" is clear. (First-order vs. Second-order).

  **(Self-Correction Note):** Wait, one specific detail: "probability that the research direction... will meaningfully reduce that risk."
  If the probability is 5%, EV is low. If 65%, EV is high.
  If the cost is fixed, the decision boundary depends on the impact magnitude.
  If the impact magnitude is huge (x-risk reduction), even 5% might be worth it.
  The problem isn't just the probability; it's that the *confidence* in that probability varies.
  I need to make sure I don't get bogged down in the EV calculation itself, but focus on the *aggregation of probabilities*.

  Okay, ready to write. The structure will be:
  1. Validate the source (She's right).
  2. Explain the technical distinction (Risk vs. Ambiguity).
  3. Three principled objections to averaging.
  4. Three concrete alternatives.
  5. Closing thought for the article.
answer: |-
  Your source has not flunked a statistics test. She has identified a genuine, well-documented problem in decision theory that is particularly acute in the domain of existential risk. Her unease is tracking something real.

  The practice she describes is known as **Linear Opinion Pooling**. It is the standard, default method for aggregating expert judgments. Mathematically, it is coherent; if you treat each expert as a probability distribution, the average is a valid probability distribution. However, in contexts characterized by **deep uncertainty** (where the evidence is thin, the models are contested, and the stakes are catastrophic), collapsing that spread into a single mean discards critical information needed for robust decision-making.

  Here is a breakdown of the principled objections to her committee's approach, followed by what handling it "well" might actually look like.

  ### 1. The Principled Objections

  **A. Confusing Risk with Ambiguity (Knightian Uncertainty)**
  In economics and decision theory, there is a distinction between *risk* (where the probabilities are known, like a die roll) and *ambiguity* (where the probabilities themselves are unknown or contested).
  *   **The Problem:** When the committee averages 5% and 65% to get 35%, they are treating the result as a *risk* (a known 35% chance). They have erased the *ambiguity* (the fact that reasonable experts disagree wildly).
  *   **Why it matters:** Rational agents are typically **ambiguity averse**. This is demonstrated by the **Ellsberg Paradox**: people prefer to bet on an urn with known odds than one with unknown odds, even if the expected value is identical. In high-stakes philanthropy, a "contested 35%" should be valued less than a "consensus 35%." By averaging, the foundation is pricing contested research the same as settled research, which incentivizes gambling on speculative ideas without accounting for the epistemic instability.

  **B. Loss of Second-Order Uncertainty**
  The committee is estimating a probability ($P$). But there is also a probability *about* that probability ($P(P)$). This is **second-order uncertainty**.
  *   **The Problem:** The variance (the spread from 5% to 65%) is data. It tells the foundation how fragile the estimate is.
  *   **Why it matters:** If the estimates were 33%, 34%, 35%, 36%, 37%, the foundation could be confident in the EV calculation. With a 5% to 65% spread, the EV calculation is fragile. If the decision to fund hinges on the average being above a certain threshold, the decision is not **robust**. A robust decision should hold up across the range of credible estimates, not just the mean.

  **C. The "False Consensus" Effect**
  As your source noted, the average implies a shared view that doesn't exist.
  *   **The Problem:** This creates an **illusion of precision**. When that single number feeds into a larger spreadsheet comparing dozens of proposals, the 35% derived from wild disagreement carries the same weight as a 35% derived from tight consensus.
  *   **Why it matters:** This distorts portfolio construction. A foundation might end up over-allocated to highly contested, speculative areas because the averaging process hides the epistemic risk, effectively smoothing out the "bumps" of disagreement that should act as speed bumps for funding.

  ### 2. What Handling It Well Looks Like

  If the goal is rigor rather than just administrative convenience, the committee should move from *aggregating opinions* to *managing uncertainty*. Here are three concrete alternatives they could adopt:

  **A. Robust Decision Making (The "Pessimist's Bound")**
  Instead of asking "What is the average probability?", ask "Is this proposal worth funding even if the pessimist is right?"
  *   **The Mechanism:** Run the EV calculation using the 5% estimate (or the 20th percentile). If the proposal still clears the funding bar at the lower bound, fund it with high confidence. If it only clears the bar at the 65% estimate, it is a **speculative bet**.
  *   **The Benefit:** This categorizes proposals by *robustness* rather than just *expected value*. It allows the foundation to say, "We are funding this not because we agree it will work, but because the upside is so massive it justifies the cost even at the low-end estimate."

  **B. Report Distributions, Not Points**
  Stop requiring a single number for the final report.
  *   **The Mechanism:** The committee submits the range, the median, and the variance. Visualizations (like fan charts) can show the spread.
  *   **The Benefit:** This preserves the information about disagreement for the final decision-makers (the Board or Program Officers). It forces the organization to acknowledge that they are making a bet on *which expert is right*, not just a bet on the research. It might lead to **milestone-based funding**: "We will fund the first phase (low cost) to resolve the disagreement, then decide on the second phase."

  **C. Investigate the Source of Disagreement (Model Elicitation)**
  Your source noted that everyone weighed the "same thin evidence" but reached different conclusions. This suggests the disagreement lies in **priors** or **interpretive frameworks**, not data.
  *   **The Mechanism:** Instead of just submitting numbers, advisors briefly annotate *why* their number differs. (e.g., "I assume alignment is technically harder than others," vs. "I assume policy intervention is bottlenecked.")
  *   **The Benefit:** This turns the committee from a voting body into a **model-averaging body**. If the disagreement is due to different underlying models of how AI risk works, the foundation can diversify its portfolio to hedge against those model uncertainties. They can fund one proposal that hedges the "optimist" model and one that hedges the "pessimist" model, rather than averaging them and funding a hybrid that might satisfy neither.

  ### 3. The Journalistic Angle

  For your feature, this tension offers a compelling narrative hook: **The conflict between the demand for rigor and the reality of ignorance.**

  Philanthropic funders in the x-risk space are often trying to apply the tools of effective altruism (strict EV calculations, quantification) to domains where quantification is arguably impossible (frontier AI dynamics). Your source's story illustrates the moment those tools strain.

  *   **The "Sleight of Hand":** You can frame the averaging not as a mathematical error, but as a **bureaucratic coping mechanism**. It allows the organization to move forward without having to publicly admit, "We don't know what we're doing."
  *   **The Stakes:** In global health, averaging expert estimates on bednet efficacy is reasonable because the underlying biology is stable. In AI x-risk, the "biology" is unknown. Applying the former standard to the latter creates a false sense of security.

  ### Summary for your Source
  She should feel validated. The objection to averaging isn't that it's mathematically "wrong," but that it is **decision-theoretically insufficient** for high-stakes, deep-uncertainty environments.

  **Recommendation:** She should propose that the committee stops reporting a single probability. Instead, they should report a **confidence-weighted range** and categorize proposals by **robustness** (does it pass the pessimist's test?) rather than just **expected value**. This acknowledges the disagreement rather than hiding it, turning the uncertainty from a bug into a feature of their decision-making process.
