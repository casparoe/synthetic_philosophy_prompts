      *   *Key Difference:* Synchronic is about a snapshot; Diachronic is about a trajectory.
      *   *Assumptions:* Diachronic usually requires the agent to *commit* to an updating rule beforehand. This is the "strategy" aspect.
      *   *Objections:* "Pragmatic vs. Epistemic" (money pump vs. truth-tracking). "Package vs. Sequential" (would a rational agent see the whole set of bets?).
