  **MEMORANDUM**

  **TO:** Board of Directors, Congregation Beth Shalom
  **FROM:** Miriam Adler, Chair, Ritual Practices Committee
  **DATE:** October 14
  **SUBJECT:** Recommendation regarding the *Avodah* and *Musaf* Amidah in the New *Machzor*

  **Purpose**
  This memo summarizes the Ritual Practices Committee's deliberations regarding the *Avodah* service and the *Musaf* Amidah's petition for the restoration of Temple sacrifices. We request Board approval of the attached liturgical text by November 15 to meet printing deadlines for the High Holidays.

  **Theological Context**
  The Committee engaged deeply with the classical tension surrounding sacrificial worship. We reviewed Maimonides' rationale in the *Guide for the Perplexed* (3:32), which posits that sacrifices were a divine concession to an ancient mindset saturated with idolatrous cultic practice—a transitional "way station" toward the superior worship of prayer. However, we also noted that Maimonides the codifier, in the *Mishneh Torah*, writes the laws of sacrifices as literally binding obligations for a rebuilt Temple, not as spent metaphors.

  Against this, we weighed Nahmanides' objection (Commentary on Leviticus 1:9): that sacrifices pre-date the Tabernacle (Cain, Abel, Noah) and therefore cannot be merely a reaction to idolatry. For Nahmanides, the service possesses an inherent holiness, a "reaching on high" that prayer alone does not fully replicate. We also considered Rav Kook's speculation (*Olat Re'iyah*) that in the Messianic era, animal offerings may cease entirely in favor of grain offerings. While intellectually congenial to both factions on our committee, this position remains speculative halakha and cannot serve as the sole foundation for our liturgy.

  **The Minority View**
  It is incumbent upon me to articulate the argument of those committee members who advocated for excising or radically abstracting these passages. Their position is not merely a preference for "modernity" over "tradition," but a rigorous ethical claim rooted in the prophetic tradition. They argue that to recite a petition for the resumption of animal slaughter is to ask God to reverse moral progress. If Maimonides is correct that sacrifices were a concession to a primitive stage of human development, then to pray for their return is to pray for a regression in spiritual consciousness. They contend that "service of the heart" is not a euphemism for loss, but an evolution in holiness, and that retaining the literal language creates an insurmountable barrier to entry for congregants whose moral intuition recoils at the blood-rite, regardless of its historical context.

  **Recommendation**
  Despite the weight of the minority view, the Committee recommends retaining the traditional Hebrew text of the *Avodah* and the *Musaf* Amidah without alteration.

  We do so not because we have resolved the theological contradiction between Maimonides and Nahmanides, but because the liturgy must hold the tension rather than dissolve it. To edit the text is to claim a certainty about the Messianic future that we do not possess. If the Temple is rebuilt, we cannot know if the law will revert to the *Mishneh Torah* or evolve toward Rav Kook's vision; our prayer book should not preempt that revelation. However, to address the ethical concerns raised, we recommend including a new introductory essay in the *Machzor* that explicitly outlines this debate, citing the *Guide*, the *Mishneh Torah*, and Nahmanides. We preserve the text as a record of our people's complex relationship with the Divine, while using the commentary to validate the discomfort the text provokes.

  **Timeline**
  Final approval is required by the Board meeting on November 15 to ensure typesetting and distribution by Rosh Hashanah.

  Respectfully submitted,

  Miriam Adler
