prompt: |-
  Ok so this has been bugging me. A bunch of philosophers who work on causation argue that omissions can't be genuine causes of anything - like, my failure to water your plant isn't actually a cause of it dying, since 'nothing' can't do any causal work. But if that's right, doesnt it follow that a security guard who notices a fire starting and just doesn't pull the alarm can't be held responsible for anyone who dies, since his inaction never technically caused anything? That seems completely backwards to me, so I feel like the whole 'omissions aren't causes' camp must just be wrong. Am I missing something here?
