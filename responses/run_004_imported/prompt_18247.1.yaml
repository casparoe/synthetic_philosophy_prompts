          *   Indeterminacy: If I don't water the plant, is it my omission? What about the sun not raining? What about the guy in China not watering it? There are infinite non-events.
          *   Counterfactual dependence vs. Production: Omissions satisfy counterfactuals ("If I had watered, it wouldn't have died") but don't involve energy transfer.
      *   **Key Philosophers:** David Lewis (counterfactual view vs. process view), Jonathan Schaffer (contrastive causation), Helen Beebee (the main proponent of the "no causation by omission" view).

  4.  **Address the Responsibility Gap:**
      *   The user thinks: No Causation $\rightarrow$ No Responsibility.
      *   Philosophers say: No Causation $\rightarrow$ Still Responsibility (based on duty, expectation, counterfactual dependence, or "quasi-causation").
      *   *Analogy:* If I promise to feed your dog and don't, the dog starves. Did I *kill* the dog? Or did I *let* the dog die? The distinction matters metaphysically but not necessarily morally.

