      *   *Psychical Research (SPR):* Sidgwick was a founder. He was the "conscience" of the SPR (skeptical, rigorous). He wanted *evidence*, not faith. He investigated mediums (Piper), hallucinations, etc. He never became a convinced spiritualist like Myers.
      *   *The Connection:* The philosophical need for immortality drove the empirical search for it. But the empirical search demanded a higher standard of proof than the philosophical postulate required.
      *   *The Conflict:* Kant postulates because reason *needs* it for morality to make sense, regardless of empirical proof. Sidgwick wanted empirical proof to make the postulate *rationally secure*, not just practically necessary.
      *   *Intellectual Honesty:* Sidgwick famously said if the evidence fails, he might have to abandon the postulate, leading to ethical chaos.

  3.  **Structuring the Argument:**

      *   **Introduction:** Acknowledge the depth of the insight. State the thesis: While Sidgwick viewed them as complementary (a unified quest for a rational cosmos), they ultimately rest on incompatible epistemic standards (Practical Reason vs. Empirical Science). This tension reveals a crisis in Victorian rationality.
      *   **Section 1: The Philosophical Project (The Postulate).** Explain the Dualism. Explain the Kantian nature of the postulate. It's a *practical* necessity, not a theoretical truth. It requires faith/will, not proof.
      *   **Section 2: The Empirical Project (The SPR).** Explain his role. He wasn't looking for faith; he was looking for *data* to convert the postulate into knowledge. This shifts the burden from "need to believe" to "proof to know."
      *   **Section 3: The Conflict of Standards.** Here lies the crux.
          *   Philosophy: Justified by *need* (coherence of ethics).
          *   Science: Justified by *evidence* (inductive proof).
          *   Sidgwick tried to bridge them: He wanted the scientific evidence to validate the philosophical postulate so he wouldn't have to rely on mere faith.
      *   **Section 4: Intellectual Honesty and the Verdict.** Should he have abandoned the postulate?
          *   If he sticks to SPR standards: Yes, the evidence was insufficient.
          *   If he sticks to *Methods* standards: The postulate remains valid as a *practical* necessity, even without proof.
          *   *Crucial Nuance:* Sidgwick's tragedy is that he couldn't accept the Kantian "leap of faith" without empirical support. He wanted rational certainty for the postulate.
      *   **Conclusion:** Summarize. The two projects weren't just parallel; they were mutually undermining. His honesty prevented him from fully embracing the philosophical solution (faith) because he hoped for the scientific one (proof), which never came.

  4.  **Drafting the Content - Key Points to Refine:**

      *   *Kant vs. Sidgwick:* Kant is comfortable with the postulate remaining a postulate (faith). Sidgwick is uncomfortable. He wants the postulate to be *true* in a scientific sense.
      *   *The "Chaos":* Sidgwick feared that without the theological sanction, morality is irrational.
      *   *SPR Methodology:* Sidgwick applied the same rigor to psychical research as to ethics. Eliminate fraud, eliminate error. This high bar made success unlikely.
      *   *The 1887 Quote:* This is pivotal. He links the failure of the search to the consistency of his view of truth.
      *   *Resolution:* I need to argue that his intellectual honesty *did* oblige him to acknowledge the failure of the empirical project, but it *did not* necessarily oblige him to abandon the philosophical postulate, *unless* he conflated the two (which he seems to have done). The tragedy is the conflation.

  5.  **Refining the Argument (Self-Correction during drafting):**

