answer: |-
  You have correctly identified one of the most persistent confusions in popular science writing. The conflation of the original Church-Turing thesis with its "Extended" cousin is the source of nearly every hyperbolic claim about quantum computing "breaking logic" or "transcending limits."

  To write your feature accurately, you need to draw a sharp line between **computability** (what can be done in principle) and **complexity** (what can be done in feasible time). Here is the detailed philosophical and technical breakdown you requested.

  ### 1. The Original Church-Turing Thesis (CTT)
  **Assertion:** Any function that is "effectively calculable" (i.e., computable by a human following a definite, mechanical procedure without insight or creativity) is computable by a standard Turing machine.

  **Scope:** This is a thesis about **computability**, not efficiency. It draws the boundary between the computable (recursive functions) and the uncomputable (e.g., the Halting Problem). It asserts that no physical device, however exotic, can calculate a function that a Turing machine cannot eventually calculate, given enough time and tape.

  **Epistemic Status:**
  The status of the original CTT is philosophically contentious because it bridges an informal intuition ("effective calculability") and a formal mathematical definition ("Turing machine").
  *   **Carnapian Explication:** Many philosophers view CTT as an *explication*. We take a vague, pre-theoretic concept (effective method) and replace it with a precise one (Turing computability) for the sake of scientific rigor. On this view, CTT isn't "true" or "false" in an empirical sense; it is a proposal to standardize language.
  *   **Kripke's Theorem:** Saul Kripke has argued that CTT is actually a theorem, provided one accepts certain axioms about what constitutes a "computation." If we axiomatize the notion of an "effective procedure" (e.g., finite states, local operations, deterministic transitions), the equivalence to Turing machines follows deductively.
  *   **Empirical Generalization:** Others view it as a broad empirical claim about the limits of human cognition and physical law. However, since no one has ever produced a counterexample (a hypercomputer) in 90 years, it is treated as a foundational principle of computer science.

  **Quantum Impact:** **None.**
  Quantum computers do not compute uncomputable functions. Anything a quantum computer can calculate, a classical Turing machine can also calculate, provided you wait long enough. Quantum mechanics changes the *trajectory* of the calculation, not the *destination*. Therefore, quantum computing does **not** refute the original Church-Turing thesis.

  ### 2. The Extended Church-Turing Thesis (ECTT)
  **Assertion:** Any physically realizable computational process can be *efficiently* simulated by a probabilistic Turing machine.

  **Scope:** This is a thesis about **complexity**. "Efficiently" usually means with at most polynomial overhead. In complexity-theoretic terms, the ECTT claims that the class of problems solvable by any physical device in polynomial time is equivalent to **BPP** (Bounded-error Probabilistic Polynomial time), the class solvable by classical probabilistic computers.

  **Epistemic Status:**
  The ECTT is fundamentally different from the original CTT. It is not a conceptual explication or a theorem about logic; it is a **falsifiable scientific conjecture**.
  *   It makes a claim about the physical world: that nature does not offer "shortcuts" that allow for exponential speedups over classical algorithms.
  *   It is contingent. If a physical system were discovered that could solve an NP-complete problem in polynomial time, or factor integers exponentially faster than classical machines, the ECTT would be empirically falsified.

  **Quantum Impact:** **High.**
  Quantum computing introduces the complexity class **BQP** (Bounded-error Quantum Polynomial time). Shor's algorithm demonstrates that a quantum computer can factor integers in polynomial time, a task for which no classical polynomial-time algorithm is known (and is widely believed not to exist). If scalable quantum computers are built, they demonstrate that **BPP $\neq$ BQP**, thereby proving that classical Turing machines *cannot* efficiently simulate all physical processes. This refutes the ECTT.

  ### 3. Comparison and Relation

  | Feature | Original CTT | Extended CTT (ECTT) |
  | :--- | :--- | :--- |
  | **Core Question** | *What* is computable? | *How fast* is it computable? |
  | **Boundary** | Computable vs. Uncomputable | Efficient (Poly) vs. Inefficient (Exp) |
  | **Formalism** | Recursive Functions | Complexity Classes (BPP vs. BQP) |
  | **Epistemic Type** | Conceptual / Axiomatic / Definitional | Empirical / Complexity Conjecture |
  | **Falsifiable?** | Difficult (requires hypercomputation) | Yes (requires quantum speedup) |
  | **Quantum Status** | **Safe** | **Threatened** |

  **Relation:** The ECTT implies the CTT (if you can simulate everything efficiently, you can certainly simulate everything eventually), but the CTT does not imply the ECTT. You can accept that quantum computers are Turing-computable (CTT holds) while acknowledging they are exponentially faster for certain tasks (ECTT fails).

  ### 4. The Plain Truth for Your Feature

  Here is the framing you should use to correct the record in your magazine feature:

  > "It is a common misconception that quantum computers violate the Church-Turing thesis. They do not. The original Church-Turing thesis concerns the *limits* of computation: it asserts that there are some problems no computer can ever solve. Quantum computers remain within these limits; they cannot solve the unsolvable.
  >
  > "What quantum computing challenges is the *Extended* Church-Turing thesis. This later conjecture claims that any physical computer can be *efficiently* simulated by a classical one. Quantum algorithms, such as Shor's algorithm for factoring, suggest that nature allows for computational shortcuts that classical machines cannot match without exponential cost. If scalable quantum computers are realized, they will not break the laws of logic, but they will overturn the assumption that classical physics is sufficient to model the efficiency of computation."

  **Summary for your notes:**
  *   **Original CTT:** About **computability**. Epistemic status is conceptual/axiomatic. **Quantum computing respects it.**
  *   **Extended CTT:** About **efficiency**. Epistemic status is empirical conjecture. **Quantum computing refutes it.**

  By making this distinction, you move the conversation away from mysticism ("quantum magic breaks logic") and toward the actual scientific revolution ("quantum mechanics changes the economics of computation").
