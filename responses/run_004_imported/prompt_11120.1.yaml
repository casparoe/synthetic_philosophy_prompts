  Solution yields $P(Red) = 1 / (1 + 2^{1/2} \cdot 3^{-3/4} \cdot 1^{1/4} ...)$ actually, the standard result is $P(Red) \approx 0.47$.
  The exact value isn't as important as the *direction*. The direction is downward.
  Why? Because the constraint makes the Red distribution *less uniform*. The Blue distribution stays uniform. The prior is uniform. To stay close to uniform, put more weight on the part that *is* uniform (Blue).
