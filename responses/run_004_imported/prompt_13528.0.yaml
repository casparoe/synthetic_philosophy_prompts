answer: |-
  Happy birthday, Elena.

  [Turn to friend]
  When we were undergrads, we spent a lot of late nights talking about the future. About what kind of world we were heading into, and whether it was fair to ask a child to grow up in it. I know that for you and [Partner's Name], the decision to have Elena wasn't just a given. It was a choice you made carefully, after three years of waiting, of saving, and of worrying.

  I also know, because you've told me, that a part of you still carries a quiet guilt. A feeling that you made Elena wait to be born. That three years of life were taken from *her*.

  As some of you know, I'm studying bioethics now. And there is a famous line of reasoning in my field that speaks directly to that guilt. It's the idea that a child isn't a single soul hovering in the universe, waiting for an invitation. Elena isn't a delayed version of some earlier child. Because conception is a matter of specific moments and specific cells, if you had tried a year earlier, or three years earlier, the result wouldn't have been an "older Elena." It would have been a completely different person.

  So, logically, those three years weren't taken from her. There was no "her" to lose them. She didn't wait to arrive; she arrived exactly when she could exist at all.

  But here is the thing about logic: it's clean, but life isn't. While that idea might dissolve the guilt about the *timing*, it doesn't dissolve the weight of the *choice*. It doesn't answer the harder question you both asked yourselves: whether it was right to bring a child into a warming world because you were ready, or to wait because you were afraid.

  Philosophy can't solve that. Only love can. And looking at Elena today, surrounded by this much care, I think the answer is in the room. You didn't just give her time. You gave her a place.

  To Elena. May you never have to wait for love.
