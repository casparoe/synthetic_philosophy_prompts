answer: |-
  **MEMORANDUM**

  **TO:** University Academic Integrity Board
  **FROM:** [Your Name/Student Representative/Advisory Committee Member]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Evidentiary Standards for AI-Detection Findings

  **Purpose**

  This memo provides a recommendation regarding the Board's recently adopted policy permitting a finding of responsibility for unauthorized AI use based solely on an AI-writing detector score exceeding a stated confidence threshold. After reviewing the policy's implications for due process and epistemic reliability, I recommend that the Board amend the policy to prohibit findings of responsibility based exclusively on detector scores. Instead, a detection flag should require specific corroboration to sustain a violation.

  **Recommendation and Implementation**

  **Recommendation:** The Board should adopt a "corroboration requirement." An AI detection score, regardless of confidence level, constitutes probabilistic evidence rather than direct proof of misconduct. Therefore, a finding of responsibility requires additional evidence, such as:
  *   Inconsistencies revealed during an oral defense of the work;
  *   Absence of draft history or version control data;
  *   Discrepancies between the submission and the student's prior in-class writing; or
  *   Admissions by the student.

  **Effective Date:** This change should take effect **immediately**. It must apply to all pending cases and all future submissions. Applying a higher standard of evidence retroactively to pending cases is necessary to maintain the legitimacy of the Board's current docket; continuing to process pending cases under the "score-only" standard risks irreversible reputational harm to the University and wrongful sanctions against students.

  **Rationale: The Problem of Naked Statistical Evidence**

  The core issue with the current policy is not merely technical but philosophical and legal. AI detectors function by estimating the probability that a text was generated by a model. Even with a high confidence threshold (e.g., 95%), the tool relies on aggregate error rates.

  The Board is currently positioned to accept a logical inconsistency akin to the "Lottery Paradox." If the Board accepts detector scores as sufficient proof, it asserts regarding *each* specific student that "it is more likely than not that this student cheated." However, by acknowledging the detector's documented error rate, the Board simultaneously acknowledges that "some fraction of these students did not cheat."

  While legal systems often rely on probabilistic thresholds (e.g., preponderance of evidence), they generally reject *naked statistical evidence* as the sole basis for liability (often illustrated by the "Blue Bus Problem," where a bus is known to be 90% likely to belong to a defendant company, but no specific evidence places it at the scene). Relying solely on a score treats the student as a statistical unit rather than an individual agent. When the Board knows in aggregate that false positives will occur, proceeding with individual findings based solely on that statistic undermines the moral authority of every verdict. It creates a system where the Board knows it is punishing innocent students but proceeds anyway, justified only by the mathematical likelihood of guilt. This erodes trust in the integrity process more deeply than the risk of unpunished cheating.

  **Counter-Argument: Deterrence and Administrative Efficiency**

  The strongest argument for maintaining the current "score-only" policy is **deterrence and administrative feasibility.**

  Proponents of the current policy argue that requiring corroboration places an unsustainable burden on faculty and the Board. Investigating draft histories or conducting oral defenses for every flagged submission requires significant time and resources. Furthermore, they argue that strict evidentiary standards create a safe harbor for cheaters. If students know a detector flag can be easily explained away without further proof, the deterrent effect of the technology is neutralized. In this view, the risk of occasional false positives is an acceptable trade-off for maintaining a high barrier to academic dishonesty and preserving the efficiency of the adjudication process.

  **Rebuttal**

  While efficiency and deterrence are vital, they cannot supersede the fundamental requirement of accuracy in disciplinary proceedings. The cost of a false positive in an academic integrity case is disproportionately high: it can result in suspension, expulsion, and permanent notation on a transcript, altering a student's career trajectory.

  Moreover, the deterrence argument rests on a false premise. A system known to produce wrongful convictions does not deter cheating; it incentivizes litigation and appeals. If students perceive the process as algorithmic and rigged, they will challenge findings aggressively, ultimately consuming *more* administrative resources in appeals and potential legal liability than would be spent on initial corroboration. True deterrence comes from the certainty of a *fair* process, not the speed of a verdict. Requiring corroboration ensures that when the Board does find a student responsible, the finding is unassailable, thereby strengthening the long-term credibility of the University's academic standards.

  **Conclusion**

  The Board must prioritize individualized justice over statistical efficiency. I urge the Board to amend the policy immediately to require corroboration for AI detection flags. This ensures that findings of responsibility are based on evidence specific to the student's conduct, rather than the known error rates of a software tool.
