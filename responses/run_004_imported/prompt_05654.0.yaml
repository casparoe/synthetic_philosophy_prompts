answer: |-
  This is a fantastic setup. You are almost certainly interviewing **Ruth Chang** (her TED talk, the "on a par" thesis, and the "creating reasons" view are her signature contributions). Her work is precise, so vague questions will let her default to standard exegesis. To get the "pressure points," you need to challenge the *costs* of her view, not just the mechanics.

  Here are nine questions structured into four thematic blocks (with follow-ups) plus a closing question. They are designed to be technical enough for a philosophy audience but accessible enough for a podcast format.

  ### Block 1: The Small-Improvement Argument (SIA)
  *The Goal: Challenge whether the SIA actually proves a fourth relation or just exposes the limits of our measurement.*

  **Q1:** You use the Small-Improvement Argument to distinguish parity from equality: if A and B were equal, a slight improvement to A (A+) should make it strictly better than B. If A+ is still not better than B, you argue they are "on a par." But critics suggest this just reveals that "better than" is vague. If I can't tell the difference between A and B, or A+ and B, isn't that just a failure of discriminability rather than proof of a distinct normative relation?

  **Follow-up 1:** You'll likely reply that vagueness implies a range where *neither* is better, whereas parity allows that they *are* comparable. But if the small improvement is too tiny to trigger a change in relation, doesn't that commit you to the existence of precise "value facts" that are permanently epistemically hidden? How do you avoid positing a metaphysical precision that does no work in our actual deliberation?

  ### Block 2: The Broome Objection (Rough Equality)
  *The Goal: Press on whether "parity" is just a rebranding of imprecise equality.*

  **Q2:** John Broome has argued that "on a par" collapses into ordinary rough equality once we look closely at precisifications. He suggests that if we sharpened our criteria enough, we'd find the options are either equal or one is better. Why should we accept the ontological cost of a fourth relation rather than just admitting that "better than" admits of degrees of imprecision?

  **Follow-up 2:** If we accept your view that parity is *sui generis* and not just rough equality, it seems to break the transitivity of "better than" in ways that standard decision theory can't handle. Are you arguing that we need a new formal logic of choice, or are you suggesting that rational choice theory simply fails to capture the structure of hard choices?

  ### Block 3: Ignorance vs. Parity
  *The Goal: Challenge the idea that the difficulty is ontological rather than epistemic.*

  **Q3:** A common intuition in hard choices—like choosing between a career abroad or a relationship at home—is that one option *is* objectively better, but we are too ignorant to see which. Is "parity" just a fancy label for the limits of our self-knowledge? How do you rule out the possibility that the normative facts are there, but we just lack access to them?

  **Follow-up 3:** If you insist the normative facts *don't* exist until a choice is made, doesn't that make the choice truth-apt only in retrospect? If I can't be right or wrong at the moment of choice because there is no fact of the matter, in what sense is the choice "rational" rather than just a leap of faith?

  ### Block 4: The Will and Creating Reasons
  *The Goal: Press on the "normative power" claim to see if it collapses into arbitrariness.*

  **Q4:** You argue that in hard choices, we exercise "normative power" to create reasons for an option through commitment. But this sounds suspiciously like picking arbitrarily and calling it agency after the fact. If the reasons weren't sufficient to determine the choice initially, what stops me from "creating" a reason to do something absurd? Where is the constraint on the will?

  **Follow-up 4:** You usually respond that we must commit "for the right reasons." But if the given reasons were insufficient to make one option better (that's what makes it a hard choice), where do the constraints on *which* reasons you can create come from? Isn't there a circularity in saying the will is constrained by reasons that the will itself is supposed to generate?

  ### Closing Question
  *The Goal: Move from meta-ethics to practical implication.*

  **Q5:** If parity is real and we have this normative power, it changes how we should advise people. When a listener faces a hard choice, is "follow your gut" actually bad advice? Should we instead be telling them to stop looking for the answer and start trying to *become* the person for whom one option is better?

  ***

  ### A Note on Your Personal Context
  Since you mentioned your own dilemma (fellowship vs. relationship): **Do not lead with this.** It risks turning the episode into an advice column. However, you can use it as a "concrete anchor" for **Q3**.

  *   *Modification for Q3:* "Take a concrete case: choosing between a perfect career fit abroad or a deep relationship at home. The intuition is that one *is* objectively better, but we are too ignorant to see which..."

  This keeps the focus on the *philosophical structure* of the case rather than the *biography* of the host, while still letting you use your genuine confusion to drive the point home. Good luck with the recording.
