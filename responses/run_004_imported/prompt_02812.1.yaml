      *   **Level-Splitting:** Rationality is about responding to evidence. Sometimes first-order evidence (the actual dates, conversations) is distinct from higher-order evidence (statistics about dating). Lasonen-Aarnio argues that if your first-order evidence *actually* supports $P$, you should believe $P$, even if you have misleading higher-order evidence suggesting you're biased.
      *   **The Clash:** Is rationality about *being right* (tracking truth via first-order) or *being coherent* (managing your cognitive state)?

  5.  **Drafting the Application (Section 2):**
