      *   *Decision:* The Enkratic Principle is the better *heuristic* here, even if Level-Splitting is theoretically possible. Why? Because the specific mechanism of limerence *mimics* good reasoning. It makes flimsy reasons feel concrete.
      *   *Nuance:* However, strict Enkratism might lead to paralysis. A modified view is best. But if forced to choose for *guidance*: Trust the meta-evidence (the friend/psychology) over the first-order feeling.
