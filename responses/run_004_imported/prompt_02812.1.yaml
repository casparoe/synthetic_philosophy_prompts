      *   *Refined Bet:* The Enkratic Principle wins in this specific context. Why? Because the higher-order evidence (psychology of early dating) is a *defeater* for the first-order evidence. You can't rationally hold both. Since the HOE is statistically stronger than anecdotal first-order evidence at 6 weeks, you should downgrade the first-order belief.

