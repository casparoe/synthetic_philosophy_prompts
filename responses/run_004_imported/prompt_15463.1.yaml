answer: |-
  You and your brother-in-law are both right. You aren't bad at math, and he isn't missing the human element. You have collectively recreated one of the most famous experiments in the history of behavioral economics.

  What you experienced is a textbook example of the **Allais Paradox**, named after the French economist Maurice Allais, who demonstrated it in 1953.

  Here is the sanity check you asked for, broken down by the math, the psychology, and what it means for the theory grading you.

  ### 1. The Actuary's Math (Expected Utility Theory)
  Your brother-in-law is applying **Expected Utility Theory (EUT)**. This is the standard "rational agent" model used in classical economics. It assumes that if you prefer Option A over Option B, you should maintain that preference even if you add the same irrelevant risk to both options (this is called the **Independence Axiom**).

  Let's look at your choices through that lens:

  *   **Raffle 1:** You chose the **Guaranteed $200** over the mix (80% $200, 15% $1000, 5% $0).
      *   Mathematically, this implies that the "utility" (satisfaction) of a guaranteed $200 is greater than the weighted average of the gamble.
      *   Inequality: $U(\$200) > 0.8 \cdot U(\$200) + 0.15 \cdot U(\$1000) + 0.05 \cdot U(\$0)$
      *   If we subtract $0.8 \cdot U(\$200)$ from both sides, we get:
      *   **Result 1:** $0.2 \cdot U(\$200) > 0.15 \cdot U(\$1000) + 0.05 \cdot U(\$0)$

  *   **Raffle 2:** You chose the **15% shot at $1000** over the 20% shot at $200.
      *   Inequality: $0.15 \cdot U(\$1000) + 0.85 \cdot U(\$0) > 0.2 \cdot U(\$200) + 0.8 \cdot U(\$0)$
      *   If we subtract $0.8 \cdot U(\$0)$ from both sides, we get:
      *   **Result 2:** $0.15 \cdot U(\$1000) + 0.05 \cdot U(\$0) > 0.2 \cdot U(\$200)$

  **The Contradiction:** Look closely at Result 1 and Result 2. They are exact opposites. In Raffle 1, your choice says the left side is bigger. In Raffle 2, your choice says the right side is bigger. According to classical rational choice theory, this is impossible. You cannot hold both preferences simultaneously without violating the axioms of rationality.

  So, strictly speaking, **your brother-in-law is correct.** The choices are inconsistent.

  ### 2. The Human Reality (Prospect Theory)
  However, if nearly everyone in the room did the same thing (and decades of research show they will), it suggests the flaw isn't in the people, but in the theory used to grade them.

  This behavior is explained by **Prospect Theory**, developed by Daniel Kahneman and Amos Tversky (work that won Kahneman the Nobel Prize). They argued that humans don't calculate probability linearly. We use a **probability weighting function**.

  Here is why your brain switched strategies:

  **The Certainty Effect**
  In Raffle 1, the difference between **80%** and **100%** feels massive to the human brain. We overweight outcomes that are considered certain. Moving from "pretty likely" to "guaranteed" eliminates the pain of potential regret. If you take the gamble and hit the 5% nothing, you will kick yourself forever for not taking the sure $200. That emotional cost outweighs the extra expected value.

  In Raffle 2, both options are **unlikely**. The difference between **15%** and **20%** feels negligible. Both are "long shots." When the certainty is removed, your brain switches from "risk aversion" (protect what I have) to "risk seeking" (go for the big prize since I probably get nothing anyway).

  To a human, 100% is a different *category* than 80%. But 20% and 15% are in the same *category*. Classical math treats the gap between 100-80 and 20-15 as identical (20 percentage points). Your brain does not.

  ### 3. Fact About People or Fact About Theory?
  You asked: *"Is that a fact about people, or about the theory grading us?"*

  It is a fact about people that reveals a limitation in the theory.
  *   **Expected Utility Theory** is a **normative** model. It describes how a perfectly rational robot *should* make decisions to remain logically consistent.
  *   **Prospect Theory** is a **descriptive** model. It describes how actual biological humans *do* make decisions.

  Your brother-in-law is grading you on a normative scale. You are operating on a descriptive reality.

  ### The Verdict
  You didn't mess up the math. You successfully identified that **certainty has a premium value** that disappears once the guarantee is off the table.

  If you were a spreadsheet, you would have taken the higher Expected Value in Raffle 1 ($310 vs $200) and the higher Expected Value in Raffle 2 ($150 vs $40). But you aren't a spreadsheet; you're a parent at a school raffle who knows that a guaranteed $200 buys groceries, while a 5% chance of nothing buys regret.

  Tell your brother-in-law he wins the argument on **consistency**, but you win the argument on **psychology**. You just demonstrated the Allais Paradox in the wild, which is a great story for a science writer.
