          *   If people prefer 2B over 2A: $0.15U(1000) + 0.85U(0) > 0.2U(200) + 0.8U(0)$.
          *   Subtract $0.8U(0)$ from both sides: $0.15U(1000) + 0.05U(0) > 0.2U(200)$.
          *   *Conclusion:* The inequality flips. In Raffle 1, $0.2U(200)$ is greater. In Raffle 2, $0.15U(1000) + 0.05U(0)$ is greater. This is a direct violation of the Independence Axiom of Expected Utility Theory.
      *   **Verdict:** The brother-in-law is mathematically correct according to standard Expected Utility Theory (EUT). The crowd (and the user) displayed behavior consistent with the **Allais Paradox**.

  3.  **Identify the Psychological Mechanism:**
      *   Why did this happen?
      *   **Certainty Effect:** People overweight outcomes that are considered certain compared to outcomes that are merely probable. In Raffle 1, the move from 80% to 100% feels huge. In Raffle 2, the move from 15% to 20% feels small.
      *   **Prospect Theory:** Daniel Kahneman and Amos Tversky. This is the core framework.
      *   Key components of Prospect Theory relevant here:
          1.  **Value Function:** Concave for gains (risk aversion), convex for losses (risk seeking). Not linear like money.
          2.  **Probability Weighting:** People don't treat probabilities linearly. There's a jump at 0 and a jump at 1. The difference between 99% and 100% is weighted much heavier than 50% and 51%.
      *   In Raffle 1: The "Certainty" of the $200 is heavily weighted.
      *   In Raffle 2: Both are unlikely. The "Certainty" effect drops away. People focus on the magnitude of the prize ($1000 vs $200) because the probabilities (15% vs 20%) feel similarly "small."

