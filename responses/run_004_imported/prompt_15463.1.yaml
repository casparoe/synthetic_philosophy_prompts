          *   *EV Comparison:* Option D ($150) > Option C ($40).
          *   *Behavior:* People chose D. This implies risk seeking (or at least less risk aversion) compared to Raffle 1.
      *   *The Inconsistency (Allais Paradox):* The brother-in-law is referencing the **Allais Paradox**.
      *   *Let's check the independence axiom:*
          *   Let $U(x)$ be the utility of money $x$.
          *   Raffle 1 Preference: $U(200) > 0.8 U(200) + 0.15 U(1000) + 0.05 U(0)$.
          *   Rearranging: $0.2 U(200) > 0.15 U(1000) + 0.05 U(0)$. (Subtract $0.8 U(200)$ from both sides).
          *   Raffle 2 Preference: $0.15 U(1000) + 0.85 U(0) > 0.2 U(200) + 0.8 U(0)$.
          *   Rearranging: $0.15 U(1000) > 0.2 U(200) - 0.05 U(0)$. Or simply: $0.15 U(1000) + 0.05 U(0) > 0.2 U(200)$ (assuming $U(0)=0$).
          *   *Contradiction:* Raffle 1 says $0.2 U(200)$ is bigger. Raffle 2 says $0.15 U(1000)$ is bigger (relative to the other terms).
          *   Actually, let's look at the common consequence effect.
          *   Raffle 1: A vs B. Common outcome: 80% chance of $200 (in B) vs 100% chance of $200 (in A). Wait, the structure is slightly different from the classic Allais setup but functionally similar.
          *   Classic Allais:
              *   1A: 100% $1M
              *   1B: 89% $1M, 10% $5M, 1% $0
              *   2A: 11% $1M, 89% $0
              *   2B: 10% $5M, 90% $0
          *   User's Scenario:
              *   1A: 100% $200
              *   1B: 80% $200, 15% $1000, 5% $0
              *   2A: 20% $200, 80% $0  (Note: 100% - 80% = 20%)
              *   2B: 15% $1000, 85% $0 (Note: 100% - 15% = 85%)
          *   Let's check the Independence Axiom violation.
          *   If you prefer 1A over 1B: $U(200) > 0.8U(200) + 0.15U(1000) + 0.05U(0)$.
          *   Subtract $0.8U(200)$ from both sides: $0.2U(200) > 0.15U(1000) + 0.05U(0)$.
          *   Now look at Raffle 2.
          *   Option 2A: $0.2U(200) + 0.8U(0)$.
