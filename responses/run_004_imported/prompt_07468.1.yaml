answer: |-
  Let's cut through the fog. You are right to be suspicious of both, but for different reasons. To see why, we need to stop talking about them as abstract concepts and put them into the machine of a specific money-pump scenario.

  ### The Setup: The Sequential Money Pump

  Imagine you start with **Option A**.
  A trader offers you a sequence of trades. The fees are small ($1), but the cycle is real.

  1.  **Node 1:** You hold **A**. Trader offers: Swap A for **B** minus $1.
      *   *Your Preference:* B > A. (So B-$1 is better than A).
  2.  **Node 2:** You hold **B**. Trader offers: Swap B for **C** minus $1.
      *   *Your Preference:* C > B. (So C-$1 is better than B-$1).
  3.  **Node 3:** You hold **C**. Trader offers: Swap C for **A** minus $1.
      *   *Your Preference:* A > C. (So A-$3 is better than C-$2).

  **The Cycle:** A < B < C < A.
  **The Pump:** If you blindly follow local preferences at every node, you trade A→B→C→A. You end up with **A** but **$3 poorer**.

  Here is how the two strategies navigate this tree.

  ---

  ### 1. Sophisticated Choice (The "Strategic Pessimist")

  Sophisticated choice assumes you are **dynamically inconsistent**. It accepts that your future self at Node 3 will be "irrational" (cyclic) and trade C for A. It does not try to fix that future self; it plans around it. It uses **backward induction**.

  *   **At Node 3:** You hold C. You prefer A to C. You trade.
      *   *Outcome:* **A - $3**.
  *   **At Node 2:** You hold B. You look ahead. You know if you trade to C, your future self (at Node 3) will immediately trade to A.
      *   *Choice:* Stop with **B - $1** OR Continue to end up with **A - $3**.
      *   *Preference:* You prefer B to A. Therefore, **B - $1** is better than **A - $3**.
      *   *Action:* You **REFUSE** the trade at Node 2.
  *   **At Node 1:** You hold A. You look ahead. You know if you trade to B, your future self (at Node 2) will refuse the next trade.
      *   *Choice:* Stop with **A** OR Continue to end up with **B - $1**.
      *   *Preference:* You prefer B to A.
      *   *Action:* You **ACCEPT** the trade at Node 1.

  **The Behavior:** You trade A→B, then stop.
  **The Result:** You end with **B - $1**.
  **The Cost:** You lost $1, but you successfully upgraded from A to B. You avoided the full pump, but you still paid a toll.

  **The Weird Feature:** At Node 2, you *want* to trade to C (locally, C > B). But you don't. You are effectively holding a gun to your own future head. You are restricting your own future freedom because you don't trust your future self to maximize your current interests.

  ---

  ### 2. Resolute Choice (The "Plan Follower")

  Resolute choice (McClennen's view) assumes you are **dynamically consistent** because you bind your future selves to your current plan. It rejects the idea that you are a sequence of different agents. You are one agent extended through time. Rationality is about **plan integrity**, not just local maximization.

  *   **At Node 1 (Planning Phase):** You analyze the whole tree. You see that trading A→B→C→A loses $3. You see that trading A→B and stopping gains the upgrade (B > A) for only $1.
      *   *The Plan:* "I will trade A for B at Node 1, and I will **REFUSE** the trade at Node 2."
  *   **At Node 1 (Execution):** You follow the plan. You trade A→B.
  *   **At Node 2 (Execution):** You hold B.
      *   *Local Preference:* C > B. (You *want* to trade).
      *   *The Plan:* "Refuse trade."
      *   *Action:* You **REFUSE** the trade. Not because you calculated the backward induction, but because **you resolved to do so at Node 1.**
  *   **At Node 3:** Irrelevant, you never get there.

  **The Behavior:** You trade A→B, then stop.
  **The Result:** You end with **B - $1**.
  **The Cost:** Same as Sophistication in this specific scenario.

  **The Weird Feature:** At Node 2, you are acting against your *current* local preference (C > B) solely because of a decision made in the past. If preferences are truly cyclic, at Node 2, C *is* better than B. Resolute choice says, "I don't care what is better now; I care what I decided was better for the whole path."

  ---

  ### The Divergence: Where They Actually Fight

  In the simple cycle above, they produce the same outcome. The difference emerges in **framing** and **separability**.

  Imagine a variation where at Node 2, a new option appears, or the trader changes the fee slightly.
  *   **Sophisticated Choice** obeys **Separability**: What you do at Node 2 should depend *only* on the options available at Node 2 and your preferences at Node 2. If the tree changes, your choice changes.
  *   **Resolute Choice** violates **Separability**: What you do at Node 2 depends on what you planned at Node 1, even if the local options haven't changed.

  **The Critical Failure of Sophistication:**
  Imagine a case where your future self would make a choice that is *good* for you, but your current self *thinks* is bad (due to preference reversal).
  *   *Example:* You are hungry (Node 1). You plan to eat a salad (Node 2). At Node 2, you are still hungry and prefer the salad.
  *   *Now imagine Hyperbolic Discounting:* At Node 1, you prefer Healthy (Long term) over Tasty (Short term). At Node 2, you prefer Tasty over Healthy.
  *   **Sophisticated Agent:** Knows at Node 2 they will eat Tasty. At Node 1, they compare (Healthy) vs (Tasty). If they prefer Healthy, they might **refuse to enter the situation entirely** (e.g., don't go to the restaurant). They foreclose the outcome of eating the Tasty meal, even though at Node 2, that is exactly what they want. They sacrifice the actual experience to satisfy the past self's judgment.
  *   **Resolute Agent:** Plans at Node 1 to eat Healthy. At Node 2, they want Tasty. They eat Healthy anyway. They get the outcome the "extended agent" values most.

  In the Money Pump context, Sophistication admits vulnerability ("I will lose $1 because I can't trust myself to stop"). Resoluteness denies vulnerability ("I will not lose $1 because I am the kind of agent who keeps plans").

  ---

  ### The Verdict

  You asked for no cop-out. Here it is:

  **Resolute Choice is the more defensible reply to the Money Pump argument.**

  Here is why, addressing your specific worries:

  **1. Addressing the "Question-Begging" Worry**
  You worry Resolute Choice just defines the problem away by saying "the agent resolves to stick to the plan."
  *   **Counter:** The Money Pump argument relies on the premise that rationality is **local maximization**. It says: "If you are rational, you maximize at every node. If you maximize at every node with cyclic preferences, you lose money. Therefore, cyclic preferences are irrational."
  *   Resolute Choice attacks the first premise. It argues that rationality is **global plan optimization**. It is not question-begging; it is a competing definition of agency. If you view an agent as a *temporally extended entity* rather than a sequence of time-slices, then violating a plan without new information isn't "optimizing," it's "fragmentation." The Money Pump only works if you accept the "time-slice" model of the self. Resolute Choice rejects that model.

  **2. Addressing the "Self-Sabotage" Worry**
  You worry Sophisticated Choice forecloses outcomes the agent would prefer.
  *   **Confirmation:** You are absolutely right. This is the fatal flaw of Sophistication. The Sophisticated agent is essentially at war with their future self. They restrict their own options to prevent their future self from "messing up." This leads to **regret**. At Node 2 in the money pump, the Sophisticated agent *wants* to trade to C but forces themselves not to. They are internally divided.
  *   **Why Resolute Wins:** The Resolute agent is not divided. At Node 2, they do not "want" to trade in the all-things-considered sense. They feel a local pull toward C, but their *agency* is committed to the plan. They experience integrity rather than restraint.

  **3. The Normative Stakes**
  The Money Pump argument is a *normative* claim: "You *ought* not to have cyclic preferences."
  *   **Sophisticated Choice** accepts the normative claim. It says, "Yes, cyclic preferences are bad. They cost me $1. I will manage the damage." It concedes that the agent is flawed.
  *   **Resolute Choice** rejects the normative claim. It says, "An agent with cyclic preferences *can* be rational if they are resolute. They lose $0."

  **Conclusion:**
  If your goal is to describe how humans *actually* behave, Sophisticated Choice wins (we are often dynamically inconsistent and try to precommit).

  But your question is about the **Money Pump Argument**, which is a philosophical proof about rationality. To defeat a *reductio ad absurdum*, you must show the absurdity (losing money) does not necessarily follow from the premise (cyclic preferences).
  *   Sophistication says: "It follows, but only a little bit." (Concession).
  *   Resoluteness says: "It does not follow, if agency is temporal." (Refutation).

  **Resolute Choice is the only strategy that fully vindicates the agent against the charge of irrationality.** It requires a richer theory of agency (one that values plan-integrity over separability), but that is a price worth paying to save the concept of a unified self. Sophisticated Choice saves the math of decision theory but sacrifices the agent, turning them into a bundle of conflicting time-slices holding each other hostage.

  **Pick Resolute Choice.** It treats the agent as a whole person, not a leaky bucket of moments.
