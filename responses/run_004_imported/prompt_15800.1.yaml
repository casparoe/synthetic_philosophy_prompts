answer: |-
  Here is a draft for a five-minute address. It is approximately 800 words, which, spoken at a measured, deliberate pace with pauses for effect, will fill the time.

  **Title:** The Art of Living
  **Tone:** Reflective, honest, intellectually humble, yet forward-looking.

  ***

  [Stand comfortably. Take a moment to look at the audience before beginning.]

  Class of 2024, faculty, families, and friends.

  When I was asked to give this address, I wanted to find a framework for the future that was honest about the past. So, I turned to a seminar I took last term on John Maynard Keynes. Specifically, his 1930 essay, *"Economic Possibilities for our Grandchildren."*

  Many of you know the headline. Keynes predicted that within a hundred years—meaning, by right about now—technological advancement would solve the problem of scarcity. He calculated that we would need to work only fifteen hours a week to maintain a comfortable standard of living. The rest of our time would be ours. He argued that humanity's real, permanent problem was never scarcity itself, but what to do with our freedom once scarcity is solved.

  [Pause. Look toward the faculty section, then back to the class.]

  Now, I stand here before you in 2024, and I look at my inbox, I look at your job offers, I look at the cost of housing, and I have to say the obvious: Keynes was wrong about the hours. We are not working fifteen hours. Many of us are working fifty. The professors in the audience know I know this, and my parents know I know this.

  It is tempting to dismiss Keynes as a dreamer who didn't understand the grind of late capitalism. But if we stop there, we miss the point. He was wrong about the *math*, but he was right about the *moral challenge*.

  We have solved more scarcity than any generation in history, yet we feel more besieged by it. We have the technology to free us, yet we feel more bound to our devices, our emails, and our metrics of productivity. Keynes asked a question we still haven't answered: If we are not defined by our struggle to survive, what defines us?

  [Shift tone to be more introspective.]

  This brings me to a later, quieter piece of writing by Keynes, titled *"My Early Beliefs."* Written near the end of his life, it is a chastened reflection. He looked back on his time with the Bloomsbury Group—that circle of artists and thinkers who believed that the "good life" was simply a matter of refined individual judgment. They believed that if you were educated and sensitive enough, you could just *be* free.

  Keynes came to doubt this. He realized that the capacity to use freedom well is not innate. It is not reserved for a cultivated elite. He realized that building a society where people can actually *live*—not just labor—is much harder than building a society that produces goods.

  This is the tension we carry today.

  We are graduating into an economy buzzing with anxiety about automation and AI. The fear is that machines will take our work. But the deeper Keynesian fear is that if machines take our work, we will be left with nothing but ourselves. And we have not been taught how to be ourselves without a job title to hold onto.

  If we treat technology only as a way to produce more, faster, we will work ourselves to death. But if we treat technology as a way to reclaim the time Keynes promised, we face the harder task. We have to cultivate the capacity for leisure, for community, for art, for care. We have to make the "good life" accessible not just to the elite, but to the cashier, the coder, and the caregiver.

  [Pause. Make eye contact with the graduates.]

  So, what do we carry from this place?

  Do not expect the fifteen-hour week to arrive on its own. It will not. The economic machinery will not stop spinning unless we grab the gears. But do not dismiss the vision, either.

  When you enter your workplaces, you will be pressured to view your time as a commodity to be sold. Resist that. View your time as the raw material of your life. When you encounter automation, do not just ask, "Will this replace me?" Ask, "If this task is done, what more human thing can I now do?"

  Keynes's later doubt reminds us that this is not easy. It requires judgment. It requires ethics. It requires us to build systems where freedom isn't a privilege for the few, but a possibility for the many.

  We are not the grandchildren who inherited the leisure Keynes predicted. We are the grandchildren who inherited the question.

  The economic problem is solvable. The human problem is not. It is a practice. It is something we must build, together, every day.

  Let us go out and build it.

  Congratulations, Class of 2024.

  ***

  ### Delivery Notes for the Speaker

  *   **The "Professors" Moment:** When you acknowledge the professors know the essay well, offer a slight, knowing smile. It signals camaraderie rather than defiance. It shows you respect their expertise without being intimidated by it.
  *   **The Pivot:** The transition from the 15-hour week failure to the "moral challenge" is the crux of the speech. Slow down here. You want the audience to feel the weight of the unasked question.
  *   **The Ending:** The distinction between "The economic problem is solvable. The human problem is not" should be delivered clearly and distinctly. Do not rush the final line.
  *   **Customization:** If there is a specific local issue (e.g., student debt, housing costs in your college town), you can briefly insert it in the second paragraph to ground the "scarcity" point further.
