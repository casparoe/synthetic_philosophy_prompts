prompt: |-
  I've been chosen to give the student address at my graduation this spring, and after a term spent in a seminar on Keynes's non-economic writings, I want to build the speech around "Economic Possibilities for our Grandchildren" -- specifically his claim that humanity's real, permanent problem was never scarcity itself but what to do with our freedom once scarcity is solved. I can't in good conscience pretend his fifteen-hour week ever arrived, and several of the professors who will be in the audience know the essay well enough to notice if I dodge that; at the same time, I don't want to give my family and the other non-academics in the crowd a lecture on late capitalism. I'd also like to bring in the more chastened Keynes of "My Early Beliefs," who came to doubt whether the Bloomsbury circle's faith in refined individual judgment could really extend beyond a small, cultivated elite. Could you draft a five-minute speech that holds this tension honestly, without resolving it into false cheer, and still leaves my class with something real to carry into an economy full of automation anxiety?
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** Graduating student giving the student address.
      *   **Audience:** Mixed (family/non-academics + professors who know Keynes well).
      *   **Topic:** Keynes's "Economic Possibilities for our Grandchildren" (1930) + "My Early Beliefs" (1938).
      *   **Key Themes:**
          *   Keynes's prediction: Scarcity solved $\rightarrow$ 15-hour work week $\rightarrow$ Problem becomes how to use freedom.
          *   Reality Check: The 15-hour week didn't happen (must acknowledge this honestly).
          *   Philosophical Tension: Keynes's later doubt (in "My Early Beliefs") about whether *everyone* can handle that freedom/refined judgment, or if it's just for an elite.
          *   Tone: Honest, not falsely cheerful, not a dense academic lecture, meaningful for an anxious economy (automation/AI).
      *   **Length:** Five minutes (approx. 750-850 words spoken at a moderate pace).

  2.  **Determine the Structure:**
      *   **Opening:** Acknowledge the occasion, introduce Keynes, state the famous prediction (15-hour week).
      *   **The Pivot (The "Elephant in the Room"):** Admit he was wrong about the hours. Don't sugarcoat it.
      *   **The Deeper Insight:** Shift from the *prediction* to the *problem*. The problem isn't scarcity; it's purpose.
      *   **The Complication (My Early Beliefs):** Introduce the doubt. Can we all handle this freedom? Is it elitist to think we can?
      *   **The Application (For the Graduates):** Connect to automation anxiety. We aren't waiting for freedom; we have to build it.
      *   **Closing:** A call to action that is realistic but hopeful.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Start with the standard congratulations, then pivot to the intellectual hook. Mention the seminar.
      *   *Keynes's Vision:* Briefly explain "Economic Possibilities." 1930. Great Depression looming. He saw a future of leisure.
      *   *The Reality Check:* Look around. We work more, not less. Professors know I know this. Family knows this too. Why? (Briefly touch on capitalism/consumption without getting bogged down in jargon).
      *   *The Core Question:* If the hours didn't shrink, the *question* remains. What is work for? If machines do the labor, what is the human for?
      *   *The "My Early Beliefs" Twist:* This is the tricky part. Keynes realized the Bloomsbury group's "good life" was exclusive. We can't just say "go be artists." We need to make the capacity for freedom universal.
      *   *The Graduation Context:* Automation anxiety. AI. Will we be obsolete? Keynes says no, we become *more* human. But it requires work (moral/psychological work).
      *   *Conclusion:* Don't promise utopia. Promise agency.

  4.  **Refining the Tone:**
      *   *Avoid:* Academic jargon (marginal utility, liquidity preference), cynicism ("capitalism failed"), toxic positivity ("you can do anything!").
      *   *Aim for:* Nuance, shared vulnerability, intellectual honesty.
      *   *Voice:* Smart student, humble but confident.

  5.  **Drafting - First Pass (Mental or rough notes):**
      Hey everyone. I studied Keynes. He said we'd work 15 hours a week by now. We don't. He was wrong. But he asked a good question. What do we do when we don't *have* to work? Later he worried only rich people could answer that. We are graduating into AI world. People are scared. I say we take the fear and turn it into the question. How do we live well? Not just for us, but everyone. Let's go figure it out.

      *Critique:* Too blunt. Needs more grace and flow. Needs to honor the professors without alienating the parents.

  6.  **Drafting - Second Pass (Focusing on Flow and Word Count):**
