answer: |-
  Here is the verdict: The "right not to know" is **not a counterexample to the mathematical validity of Good's theorem**, but it is a decisive counterexample to the **axiom of outcome-separability** that the theorem requires. When you rescue the theorem by folding the psychological cost of knowledge into the utility function, you do risk making the claim "expected value of information is non-negative" analytically true and empirically empty *unless* you constrain the utility function independently. Therefore, the theorem retains substantive value **only** when understood as a normative benchmark for *instrumental* rationality (agents that care only about external outcomes), not as a universal law of human behavior.

  Here is the detailed defense of that position.

  ### 1. The Hidden Axiom: Outcome-Separability
  To see why the "right not to know" does not break Good's math but does break its applicability, we must look closely at the utility function $U$ in Good's formulation.

  Good's theorem proves that $E[U(\text{act after observing})] \geq U(\text{act without observing})$. This proof relies on a specific structural assumption about utility: **Utility depends only on the state of the world and the action taken, not on the agent's belief state.**

  In formal terms, Good assumes $U = f(\text{World State}, \text{Action})$.
  The "right not to know" implies that for humans, $U = f(\text{World State}, \text{Action}, \text{Belief})$.

  If knowing you have a Huntington's mutation causes you despair *regardless* of what actions you take (e.g., even if you take the optimal financial and medical steps), then the belief itself has entered the utility function as a negative term. Good's theorem does not account for this. It treats information strictly as a **tool** for action (instrumental value), whereas the "right not to know" treats information as a **good** (or bad) to be consumed (intrinsic value).

  Consequently, the person declining the test is not violating the laws of probability or decision theory; they are correctly maximizing a utility function that Good's theorem does not describe. They are acting rationally according to a model where *ignorance has utility*.

  ### 2. Information as Instrument vs. Information as Experience
  The conflict arises because Good's theorem models an agent that lives in the world, while human agents also live in their minds.

  In your automated pipeline, the system is a pure instrument. It does not feel anxiety when it processes a difficult edge case; it does not lose sleep wondering if a probability distribution is bimodal. For your system, Good's theorem holds strictly. Information is purely instrumental. If the system can pause for a human review (an observation), it should do so whenever the expected improvement in the final decision outweighs the cost of the pause. Since you stipulated the observation is "free" (or cost-accounted), the system should never reject it.

  However, in medical ethics, the patient is not just an instrument for producing health outcomes; they are a subject experiencing the process. A positive genetic test result changes the *phenomenology* of the patient's life immediately, before any medical action is taken. The "bad news" is not just a signal to act; it is a harm in itself.

  Therefore, the "right not to know" exposes that Good's theorem assumes **consequentialism** (only outcomes matter) while human welfare often includes **deontological or experiential constraints** (the state of knowing matters).

  ### 3. The Tautology Worry: Does Rescuing the Theorem Empty It?
  You asked if folding psychological costs into the utility function makes the theorem "true merely by construction, unfalsifiable by any pattern of real behavior." This is a serious concern.

  If we say, "Any time an agent refuses free information, we simply posit a negative 'cost of knowing' term in their utility function to make the math work," then yes, the theorem becomes tautological. It loses predictive power because we can explain *any* behavior post-hoc by adjusting the utility function. If I refuse to look at my bank account, you say I have a high "anxiety cost." If I look at it obsessively, you say I have a high "uncertainty cost." The theory explains everything and predicts nothing.

  **However, the theorem does not have to collapse into triviality.** It remains substantive if we treat it as a **normative constraint on model-building** rather than a descriptive law of behavior.

  To keep the theorem substantive, we must demand **independent evidence** for the utility function. We cannot simply infer the "cost of knowing" from the refusal itself. We need psychological or physiological measures (cortisol levels, self-reported anxiety, quality-of-life surveys) that establish the cost of knowledge *independently* of the decision to test.
  *   **Substantive Use:** If we can measure that the anxiety of waiting for results is *lower* than the anxiety of knowing, Good's theorem (modified) predicts the agent *should* test. If they don't, our utility model is wrong.
  *   **Tautological Use:** If we say "They didn't test, therefore the cost of knowing must have been high," we are engaging in circular reasoning.

  So, the theorem is not inherently unfalsifiable, but it becomes so if the researcher is lazy about specifying the utility function.

  ### 4. The Specific Verdict
  The "right not to know" is not a paradox; it is a boundary marker.

  **Good's theorem is a normative law for instrumental agents, not a descriptive law for human beings.**

  When you apply Good's theorem to your automated pipeline, you are correct to enforce it. Your system is an instrumental agent. It should never pay to remain ignorant if that ignorance reduces its expected performance on the task. To program your system to "prefer not to know" would be a bug, unless that preference is explicitly tied to a resource cost (e.g., compute time).

  When you apply Good's theorem to human stakeholders (the patients, or even the human reviewers in your loop), you must recognize that the theorem's assumptions are violated. Humans derive utility from hope, from narrative continuity, and from the absence of dread. These are not "irrationalities" to be corrected; they are features of human welfare that Good's formalism excludes by design.

  **Conclusion:**
  Do not view the "right not to know" as a failure of rationality, nor Good's theorem as a failure of truth. View Good's theorem as a **special case** of decision theory that applies when utility is strictly separable from belief.
  *   **For your pipeline:** The theorem holds. Maximize information gathering within cost constraints.
  *   **For human policy:** The theorem is a warning. It tells you that if you force humans to act like Good-agents (by mandating testing or forcing information disclosure), you are implicitly asserting that their well-being depends *only* on the outcomes they can manage, ignoring the toll of the knowledge itself.

  The substantive value of Good's theorem, therefore, is not that it tells us we *must* always seek information. It is that it forces us to be explicit: **If you are refusing information, you are paying a price.** In an automated system, that price is measured in task performance. In a human, that price is measured in peace of mind. The theorem remains valid, but the currency of the utility function changes.
