      *   I need to be careful not to say "it becomes useless." It becomes a *consistency check*. If an agent claims to be a Good-agent but refuses free info, they are inconsistent.
      *   But for humans, the verdict is: The theorem exposes a category error. We treat information as a *tool* in the theorem, but for humans, it is also a *good* (or bad) in itself.
