answer: |-
  **MEMORANDUM**

  **TO:** Sentencing Risk-Assessment Advisory Panel
  **FROM:** Public Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on the Interpretation of Probabilistic Risk Scores

  **1. Purpose**
  This memo provides a recommendation for the official interpretation of risk scores generated by the Panel's new recidivism-risk instrument. As the Panel finalizes the guidance accompanying this tool, we must resolve the disagreement regarding the ontological status of the output probability (e.g., "34 percent likelihood"). We cannot issue a tool without defining what the numbers *are*. To do otherwise is to invite judicial misinterpretation and legal vulnerability.

  **2. Recommendation**
  The Panel should officially adopt the **Frequentist Interpretation** of the risk score, explicitly rejecting the Propensity interpretation and qualifying the Subjectivist interpretation.

  Under this official line, a risk score of 34 percent must be defined as an **actuarial frequency derived from a specific historical reference class.** It states that among past defendants who matched the current defendant's measured risk profile, 34 percent were re-arrested within the specified timeframe. It is not a measurement of the defendant's internal causal disposition (Propensity), nor is it merely an uncalibrated expert opinion (Subjectivist). It is an empirical observation about a group, applied to an individual as the best available estimate.

  **3. Rationale**
  We must choose the Frequentist interpretation because it is the only one that corresponds to how the tool is actually built. The model is trained on historical data regarding groups of people; it does not scan a defendant's brain or soul for a "risk particle." To describe the number as an objective propensity (Faction 2) is scientifically false. It suggests a deterministic or causal mechanism that the algorithm does not possess and cannot measure. To describe it solely as a subjective credence (Faction 3), while philosophically cautious, risks rendering the evidence too weak for legal utility, inviting judges to disregard it as mere speculation.

  The Frequentist interpretation strikes the necessary balance: it grounds the number in verifiable data while acknowledging that the application to an individual is an inference, not a direct measurement.

  **4. The Strongest Difficulty: The Reference Class Problem**
  Adopting the Frequentist interpretation requires us to be candid about its primary vulnerability: the **Reference Class Problem.**

  A single defendant simultaneously belongs to infinite reference classes. A 25-year-old male defendant is also a resident of a specific zip code, a person with a specific employment history, and a person with a specific mental health profile. Each of these classes has a different re-arrest frequency. The risk instrument privileges one specific combination of these traits (the model's chosen reference class) over others.

  By adopting the Frequentist view, we admit that the 34 percent figure is contingent on *which* group we chose to compare him to. If the model had weighted "zip code" more heavily than "prior arrests," the frequency might be 45 percent. If it had weighted "employment" more heavily, it might be 20 percent. The number is not an absolute truth about the defendant; it is a relative truth about the defendant's overlap with a specific, chosen dataset.

  **5. Mitigation Strategy**
  To mitigate this difficulty, the Panel must mandate transparency regarding the reference class. Judges cannot be allowed to treat the number as a standalone fact. They must be informed of the specific traits that define the comparison group. This prevents the number from acquiring an aura of infallibility and allows the defense to challenge whether the chosen reference class is appropriate for the individual at hand.

  **6. Proposed Guidance Language**
  The following language is drafted for insertion into the official Report Template provided to sentencing judges. It operationalizes the Frequentist recommendation while explicitly disclosing the Reference Class limitation.

  ***

  **RESOLVED:** The Panel adopts the Frequentist Interpretation as the official guidance for all risk-assessment reporting. The following text shall appear on every risk report generated by the instrument:

  > **Interpretation of Risk Score:**
  > This score indicates that **34 percent of individuals in the historical data who shared this specific combination of risk factors** were re-arrested for a violent offense within three years. This figure is an actuarial frequency derived from a defined group, not a deterministic prediction of this specific defendant's future conduct.
  >
  > **Limitation:** This defendant belongs to many overlapping groups (e.g., by age, location, history), each with different re-arrest rates. This score reflects only the rate associated with the specific reference class selected by this model. The Court should consider this frequency as one estimate of risk among other relevant evidence, acknowledging that the defendant may not perfectly resemble the historical group from which this number is drawn.
