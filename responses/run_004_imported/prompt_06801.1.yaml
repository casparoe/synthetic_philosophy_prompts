  *(Self-Correction Note)*: I need to be careful with "Ought Implies Can." Kantians use it to deny dilemmas. Williams/Existentialists might argue that the "Ought" persists even when the "Can" breaks. I need to frame this carefully so I don't misrepresent Kant but show why his framework is insufficient for *tragic* choices. The argument is that the logical view treats obligations as commands from a system, whereas the dilemma view treats them as claims from persons.

