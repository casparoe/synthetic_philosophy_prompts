answer: |-
  This is a fantastic exchange. It captures the exact tension that makes Anscombe's work so enduringly difficult to teach: the collision between a rigorous metaphysics of action and the messy reality of political violence. Your students have essentially reenacted the last fifty years of scholarship on the Doctrine of Double Effect (DDE) in a coffee shop.

  Here is a move-by-move breakdown of who holds the stronger philosophical position at each stage, followed by an analysis of the redescription problem and a suggestion for a "third position" to unstick the seminar.

  ### Move-by-Move Analysis

  **Move 1: Leah's Opening (The Absolutist Claim)**
  *   **Argument:** Truman intended civilian death as a means; consequences cannot launder the act.
  *   **Assessment:** **Leah wins on exegesis.**
      *   She is faithfully representing Anscombe's text. In "Mr. Truman's Degree," Anscombe does not engage in a utilitarian calculus; she makes a categorical claim about the *kind* of act this was. For Anscombe, the prohibition against killing the innocent is absolute. If the act falls under that description, the downstream good (ending the war) is irrelevant to the *moral quality of the act*, though it might explain why Truman did it.
      *   Marcus cannot win this move by appealing to consequences, because Leah is explicitly ruling consequences out of the justificatory structure.

  **Move 2: Marcus's Pushback (The Standard DDE Defense)**
  *   **Argument:** The intention was ending the war; death was a foreseen side effect. This is what DDE is for.
  *   **Assessment:** **Marcus wins on theoretical structure, loses on textual fidelity.**
      *   Marcus is correctly identifying how DDE is *typically* applied in just war theory (e.g., collateral damage in bombing a munitions factory). He is pointing out that DDE exists precisely to distinguish between *aiming at* death and *accepting* death.
      *   However, he loses ground against Anscombe specifically because Anscombe argues this *isn't* a collateral damage case. By treating it as a standard DDE case, he is begging the question against Anscombe's specific factual claim: that the civilian destruction *was* the method of coercion.

  **Move 3: Leah's Counter (The Means/End Objection)**
  *   **Argument:** If certainty = side effect, any atrocity is excusable. Here, terror/death was the mechanism of surrender (means), not incidental.
  *   **Assessment:** **Leah wins decisively.**
      *   This is the strongest objection to Marcus's application of DDE. It relies on the distinction between *oblique intention* and *direct intention*. If the causal chain to the good outcome (surrender) *runs through* the civilian deaths (terror), then the deaths are intended as a means.
      *   Anscombe's point is that you cannot bomb a city center to induce panic and claim the panic was a "side effect." The panic (and the deaths causing it) is the instrument. Marcus has no good reply to this without denying the strategic reality of the bombing, which puts him on historical shaky ground.

  **Move 4: Marcus's Counter (The Redescription Problem)**
  *   **Argument:** Leah is carving the "plan" coarsely to get her verdict; Marcus carved it finely. Without a neutral way to fix the level of description, the intention test collapses.
  *   **Assessment:** **Marcus wins on meta-ethics.**
      *   This is the famous "Redescription Objection" (often associated with Bennett or Thomson). It attacks the stability of "intention" as a moral category. If I can describe my action as "destroying a munitions plant" (good intention) or "killing the workers inside the plant" (bad intention) depending on how granular I get, then "intention" is just a rhetorical tool, not a metaphysical fact.
      *   Leah has no immediate answer here because this is a known vulnerability in Anscombe's own action theory (*Intention*). She is relying on a "natural" description of the act, but Marcus is right to point out that descriptions are theory-laden.

  **Move 5: Leah's Closing (The Consequentialism Charge)**
  *   **Argument:** Why do saved lives matter? If the prohibition is absolute, numbers shouldn't fix the description. You're smuggling consequentialism in.
  *   **Assessment:** **Leah wins on internal consistency.**
      *   She catches Marcus in a performative contradiction. He is trying to use a deontological tool (DDE) to reach a conclusion that only makes sense if the numbers (lives saved vs. lives lost) matter.
      *   If the prohibition against murder is absolute (as Anscombe holds), the fact that an invasion might cost *more* lives is irrelevant to whether Hiroshima was murder. By leaning on the "lives saved" to justify his description of the intention, Marcus is effectively consequentializing the deontology. He is saying, "The intention is good *because* the outcome is good," which is exactly what Anscombe forbids.

  ### The Redescription Problem: Does DDE Collapse?

  You asked specifically whether the intention/foresight distinction can survive Marcus's second move. The short answer is: **Not in its crude psychological form, but yes in its robust action-theoretic form.**

  Marcus is right that if "intention" is just a report of what went on in Truman's head, or a flexible linguistic description, the distinction collapses. However, Anscombe (and later defenders like Warren Quinn) argue that intention is not merely psychological; it is structural to the action itself.

  *   **The Order of Intention:** Anscombe argues in *Intention* that actions have an "order." If $X$ is necessary for $Y$, and I choose $Y$, I choose $X$. If the surrender of Japan was causally dependent on the terror caused by civilian death, then civilian death is in the order of intention, regardless of Truman's private psychological hopes.
  *   **The Fix:** To survive Marcus's objection, you need to anchor the description of the act in the **causal structure of the plan**, not the agent's self-report. Leah was gesturing at this (the deaths were the "mechanism"). If the plan *requires* the deaths to work, they are intended. If the plan works *despite* the deaths (e.g., destroying a bridge where workers happen to be), they are foreseen.
  *   **Verdict:** The distinction survives only if you reject the idea that agents get to choose their own descriptions. The facts of the causal chain fix the description, not the agent's rhetoric. Marcus is right that *psychological* intention is unstable; Leah is right that *structural* intention is not.

  ### The Third Position: Where to Go Next?

  Both students are stuck in a framework of **Act-Assessment**. Leah is a Rule-Deontologist (Anscombe); Marcus is a Consequentialist masquerading as a Deontologist. Neither is fully utilizing the rest of the "Oxford Circle" you are teaching.

  Here are two third positions that resolve the stalemate by changing the terrain:

  **1. Philippa Foot's "Rights and Justice" Shift**
  Later in her career, Foot became dissatisfied with DDE precisely because of Marcus's redescription problem. In her essay *"The Problem of Abortion and the Doctrine of Double Effect,"* she suggests that the real moral weight isn't in the *intention*, but in the **negative vs. positive duties** (or rights).
  *   **The Move:** It matters less whether Truman "intended" the deaths and more that he violated a **negative right** (the right of civilians not to be attacked).
  *   **Why it helps:** It bypasses the metaphysical quagmire of "what did he really mean?" and focuses on the **justice of the claim** the civilians had on Truman. Leah gets her absolutism (rights trump utility), but Marcus's redescription problem becomes irrelevant because the violation of the right is objective, regardless of the description of the intention.

  **2. Warren Quinn's "Direct vs. Indirect Harm"**
  Quinn (*"Actions, Intentions, and Consequences"*) revises DDE to avoid the redescription problem. He distinguishes between **Direct Agency** (harm comes from the agent's causal contribution to the goal) and **Indirect Agency** (harm comes from a causal sequence the agent initiates but doesn't direct toward the goal).
  *   **The Move:** Truman engaged in Direct Harmful Agency (the deaths were part of the causal path to surrender).
  *   **Why it helps:** This validates Leah's intuition without relying on the slippery word "intention." It focuses on the **structure of agency**. It gives you a technical vocabulary to explain *why* Leah's description of the plan is the correct one, without getting bogged down in Truman's psychology.

  **3. Iris Murdoch's "Vision and Attention"**
  Since you are teaching the Oxford Circle, Murdoch offers a radical third way. She argues that the debate between "intention" and "consequence" is a fantasy of the sovereign will.
  *   **The Move:** The moral failure wasn't a miscalculation of intention or utility; it was a failure of **moral vision**. Truman (and the culture) failed to *see* the Japanese civilians as real human beings. They were rendered invisible by the concept "enemy."
  *   **Why it helps:** It shifts the seminar from legalistic act-assessment (Who wins, Leah or Marcus?) to moral psychology and culture. It explains *how* intelligent people come to describe atrocities as "necessary."

  ### Pedagogical Recommendation

  For next year, I suggest you let Leah and Marcus fight it out exactly as they did, but then intervene with **Foot's later critique**.

  Tell the class: *"Leah has won on Anscombe's terms. Marcus has won on the terms of Action Theory. But Philippa Foot, Anscombe's closest friend and colleague, eventually decided that this debate was a dead end."*

  Assign Foot's *"The Problem of Abortion and the Doctrine of Double Effect"* alongside Anscombe. Ask the students: **Does shifting from 'Intention' to 'Rights' solve Marcus's redescription problem?**

  This validates Leah's moral seriousness (rights are not negotiable by numbers) while acknowledging Marcus's theoretical point (intentions are hard to pin down). It moves the seminar forward rather than letting it stall in the metaphysics of action.
