      *   **The Objection:** Bring in the "Niggerati" or the *Crisis* symposium respondents. The fear of the "Talented Tenth" policing representation. If I write about a Black criminal, am I betraying the race? Du Bois says yes (if it reinforces stereotypes). The objector says no (it's Truth).
      *   **The Analysis of "Propaganda":** Is he fusing two different things? Yes. Propaganda implies an external end. Art implies an internal end. But Du Bois argues the external end (freedom) is a precondition for the internal end (expression).
      *   **The Verdict:** He is wrong as an aesthetician (Keats was right, beauty can be separate). He is right as a sociologist. But the *most* interesting claim is this: In an unjust world, the pursuit of pure Beauty is implicitly political (it supports the status quo). Therefore, conscious propaganda is more honest than pretended neutrality.
