      *   *Option D:* Du Bois is right about the *function* of beauty in a political context. Beauty *is* a persuasive force.
      *   *Decision:* I will argue that Du Bois is technically wrong about the definition of "propaganda" (it is an equivocation), *but* he is profoundly right about the *sociological function* of Black art in 1926. The slogan fails as aesthetics but succeeds as history. However, to be more interesting, I'll argue that his triad (Beauty, Truth, Right) reveals a deeper truth: Beauty is not neutral. In a racist society, Black Beauty *is* political. Therefore, the distinction collapses not because art is propaganda, but because neutrality is a myth.

