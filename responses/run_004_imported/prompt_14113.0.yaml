answer: |-
  **The Triad and the Lie: Reconsidering Du Bois's Propaganda**

  To read W. E. B. Du Bois's "Criteria of Negro Art" only for the slogan—"All Art is propaganda and ever must be"—is to mistake the battle cry for the strategy. As you have noted, the common caricature of Du Bois as a stern moralist demanding sociological pamphlets disguised as poetry collapses when one examines the architecture of his argument. He does not pit Propaganda against Beauty; he subsumes Propaganda into a triad where Beauty, Truth, and Right are mutually constitutive. For Du Bois, a work that lacks Beauty fails as propaganda because it cannot captivate; a work that lacks Right fails as art because it is morally hollow.

  However, your character, the little-magazine editor caught in the fire of the 1926 *Crisis* symposium, needs to know if this philosophy holds water, or if it is merely a desperate rationalization for censorship. To answer this, we must reconstruct Du Bois's strongest case, weigh it against the specific objections of his contemporaries, and render a verdict that does not flinch from the contradictions.

  **The Strongest Version of the Argument**

  Du Bois's argument is not aesthetic; it is ontological. He is not making a claim about what art *should* do in a vacuum, but what art *is* when created by a people whose humanity is under siege.

  In 1926, the "Truth" of Black life was being manufactured by white media as a caricature of servitude or savagery. In this context, Du Bois argues that "neutral" art is impossible. If a Black artist paints a portrait of a Black subject without an intention to assert their dignity (Right), the vacuum will be filled by the prevailing racist narrative. Therefore, the pursuit of Beauty is not an escape from politics, but the only viable method of political survival.

  When Du Bois binds Beauty to Truth and Right, he is arguing that Beauty is a form of evidence. A beautiful poem about Black life proves Black capacity for refinement, emotion, and complexity. It forces the white world to look, and in looking, to acknowledge humanity. Thus, "propaganda" for Du Bois does not mean "lying for a cause." It means "persuasion toward an ethical end." If the art is not beautiful, it persuades no one. If it is not ethical, it persuades toward the wrong end. The fusion is not illegitimate; it is functional. Beauty is the delivery system; Right is the payload. To separate them is to render the art impotent.

  **The Objection from the Circle**

  The strongest objection to this does not come from white critics, but from the very "New Negroes" Du Bois sought to champion. In the *Crisis* symposium "The Negro in Art: How Shall He Be Portrayed?" and in contemporaneous essays like Langston Hughes's "The Negro Artist and the Racial Mountain," the counter-argument is clear: The demand for "Right" inevitably strangles "Truth."

  The objection is that Du Bois's triad contains a hidden hierarchy. When Truth (the messy, ugly, complex reality of Black life) conflicts with Right (the need to present a dignified front to a hostile white world), Du Bois's framework demands that Truth be sacrificed. If a writer wishes to depict a Black criminal, a Black fool, or the sordid interior of a Harlem tenement, Du Bois's criteria label this a betrayal of the race. It becomes "bad propaganda."

  Hughes and the younger modernists argued that this turns the artist into a public relations agent for the Talented Tenth. It creates a "censorship of dignity." If art must always serve the race's vindication, then the artist is forbidden from exploring the full spectrum of human experience, which includes sin, ugliness, and ambiguity. The objection is that Du Bois claims to want Truth, but he only wants a Truth that is palatable to the project of racial uplift. In fusing Beauty and Right, he makes Beauty a hostage to politics.

  **The Verdict: The Equivocation is the Point**

  So, is Du Bois right?

  As a universal aesthetic claim, Du Bois is wrong. "All Art is propaganda" is factually false. There is art that is purely exploratory, purely formal, or purely expressive without an intent to persuade toward a specific ethical outcome. To claim otherwise is to misunderstand the history of art itself.

  However, to stop there is to miss the genius of his error. Du Bois is not equivocating because he is confused; he is equivocating because he is exposing a larger lie.

  The charge that Du Bois fuses "propaganda" and "beauty" illegitimately assumes that "non-propaganda" art is neutral. It assumes that the white artist painting white subjects is not engaging in propaganda. Du Bois's deeper, buried claim is that *all* art in a stratified society is propaganda for the status quo unless it consciously strives against it. A white poet writing about "universal" beauty in 1926 is implicitly propagating a world where Black suffering is invisible. That is propaganda for white supremacy.

  Therefore, Du Bois is right about the specific condition of Black art in 1926, even if he is wrong about Art as such. In a society where Blackness is politicized by default, Black art cannot be depoliticized. To pretend otherwise is not to be "pure"; it is to be complicit.

  The verdict is this: Du Bois's slogan is an aesthetic lie, but a sociological truth. He trades on an equivocation, yes—he expands "propaganda" to mean "any act of representation in a political field." But he does so to force a recognition that the "Art for Art's Sake" crowd (including some of his own contributors) was enjoying a luxury they did not actually possess. They could claim neutrality only because they hoped white audiences would ignore their race. Du Bois knew the audience would not ignore it.

  **For Your Character**

  For your editor in 1926, this means the fight is not about whether art *should* be political. The fight is about *which* politics the art serves. Du Bois argues for the politics of Vindication (showing we are worthy). Hughes argues for the politics of Expression (showing we are free).

  Du Bois is right that Beauty is a weapon. But he is wrong that a weapon must always be aimed at the enemy. Sometimes it must be aimed at the self, to clear away the lies we tell ourselves about our own dignity.

  If your character must choose, they should not choose between "Art" and "Propaganda." They should recognize that Du Bois has correctly identified that the distinction is a trap. The question is not whether the art serves a master, but whether the master is the artist's own conscience or the race's reputation. Du Bois demands the latter. The modernists demanded the former.

  Du Bois survives not because his definition of propaganda is accurate, but because his intuition was correct: In 1926 Harlem, a poem about a moonlit night was never just about the moon. It was a claim to the night. And that claim was, inescapably, an act of war.
