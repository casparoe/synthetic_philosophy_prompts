prompt: |-
  Now that I'm retired (35 years in solid-state physics) I've fallen down a philosophy rabbit hole, and Frege got me the hardest -- started with the Begriffsschrift stuff and ended up reading about that diary of his from 1924, only published decades after he died, full of genuinely ugly stuff: wanting Jews stripped of political rights, contempt for parliamentary democracy, pining for a strongman to sort Germany out. I run a little interview podcast out of my garage these days, and next month's guest is a Frege scholar known for basically shrugging the diary off -- his line is something like "you don't need the plumber's biography to trust the pipes," i.e. none of it should touch how we read the Grundgesetze. Write me 8-10 questions that make that shrug progressively harder to pull off. I want at least one question that turns Frege's own anti-psychologism against him (he insisted thoughts live in what he literally called a "third realm," totally independent of any thinker's psychology -- doesn't the diary just show how much of his own psychology was leaking through everywhere else?), one that makes him say exactly what structurally seperates Frege's case from Heidegger's (where most people think the Nazism does show up in the philosophy itself), and one on Michael Dummett, who did more than anyone to rebuild Frege's reputation and by his own account was genuinely shaken by the diary -- does that reaction carry any evidential weight, or is it just noise? End on a question about what would actually count as evidence against his shrug. For each required question, give me a one-line guess at the answer he'll reach for, plus a follow-up.
