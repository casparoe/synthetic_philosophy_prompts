answer: |-
  This is one of the deepest rabbit holes in the history of physics. You have correctly identified the exact tension that drove Einstein crazy for years while he was developing General Relativity.

  The short answer is: **General Relativity (GR) did not fully pick a winner.** It created a third option that incorporates parts of both views but strictly satisfies neither.

  However, we *have* been able to test the mechanism Mach proposed, and the results are fascinating. Here is the breakdown of where things stand.

  ### 1. The Core Conflict
  *   **Newton:** Space is a "container" (Absolute Space). It exists even if the universe is empty. Rotation is defined relative to this container.
  *   **Mach:** Space is just a relationship between objects. Inertia (the force pushing the water up the sides) is caused by the gravitational influence of all the distant matter (the "fixed stars") in the universe. If the universe were empty, the water would stay flat.

  ### 2. Einstein’s Attempted Solution
  Einstein was a huge fan of Mach. In fact, he coined the term **"Mach's Principle."** When he was building General Relativity, his goal was to make a theory where inertia was *entirely* generated by the distribution of matter in the universe. He wanted to prove Mach right and Newton wrong.

  However, when he finished the math of General Relativity, he realized the theory didn't quite work the way Mach thought it should.

  ### 3. What General Relativity Actually Says
  In GR, space and time are combined into **spacetime**, which is a dynamic fabric (the metric field).

  **Where GR agrees with Newton:**
  Spacetime is a "real thing." Even if you remove all matter from the universe (an empty vacuum), the equations of GR still allow for spacetime to exist and have geometry. In an empty universe, if you spin a bucket, the water *would* still climb the walls. This violates strict Mach's Principle. So, in this sense, Newton was closer to the truth: the "stage" exists independently of the "actors."

  **Where GR agrees with Mach:**
  Matter affects spacetime. Specifically, **rotating mass drags spacetime around with it.** This is called **Frame Dragging** (or the Lense-Thirring effect).

  This is the closest we have to a resolution. Mach argued that if you held the bucket still and spun the universe around it, the water would climb. GR says: **Yes, effectively.**

  If you place a non-rotating bucket inside a massive, rotating spherical shell of matter, the spacetime inside that shell gets "dragged" by the rotation of the shell. Relative to the local spacetime, the water is now rotating, and it *will* climb the sides, even though it isn't rotating relative to the distant stars.

  ### 4. Can we test this? (The "Impossible" Experiment)
  You mentioned that we can't spin the universe to test Mach's idea. You are right, we can't do that specific experiment. **However, we can test the mechanism.**

  If Mach is right (or at least, if the GR mechanism of frame dragging is real), then a rotating massive object should twist the spacetime around it, affecting the inertia of nearby objects.

  **We have tested this:**
  *   **Gravity Probe B (2004-2011):** NASA launched a satellite with ultra-precise gyroscopes orbiting Earth. Earth is a massive rotating object. GR predicted Earth would drag spacetime slightly, causing the gyroscopes to drift. **They measured this drift.** It matched Einstein's predictions.
  *   **LAGEOS Satellites:** Laser geodynamics satellites have also confirmed frame dragging by measuring the orbits of satellites around Earth.

  ### 5. The Verdict
  So, did it get resolved?

  **Philosophically: No.**
  Physicists still argue about whether Mach's Principle is fundamental or just a coincidence of our specific universe. There are solutions to Einstein's equations (like the Gödel metric or Minkowski space) that describe rotating universes or empty universes where inertia exists without distant matter. This suggests spacetime has an independent reality, favoring Newton.

  **Physically: General Relativity won.**
  We don't use "Absolute Space" (Newton) and we don't use strict "Relational Mechanics" (Mach). We use the **Metric Field** of General Relativity.
  *   The water climbs because it is rotating relative to the **local spacetime metric**.
  *   That local metric is usually aligned with the distant stars (which is why Mach's intuition worked so well for 200 years).
  *   But if you mess with local mass (like spinning a black hole or the Earth), you can decouple the local metric from the distant stars (Frame Dragging).

  ### Summary
  Newton thought space was a stage. Mach thought space was just the distance between actors. Einstein showed us that space is a **flexible fabric**.

  The water climbs because it is spinning relative to that fabric. Usually, that fabric is held still by the gravity of all the distant galaxies (validating Mach's intuition), but the fabric itself is real (validating Newton's intuition), and it can be twisted by nearby mass (validated by Gravity Probe B).

  So, you aren't stuck because you're missing something obvious; you're stuck because the answer is that **spacetime is a physical entity that interacts with matter,** which is a concept that sits uncomfortably between both Newton and Mach.
