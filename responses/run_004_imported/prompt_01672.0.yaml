answer: |-
  This is one of the most robust and enduring problems in moral philosophy, often centered on the concept of **Moral Status**. Your hunch is correct: the distinction between "having interests" and "having rights" is the pivot point, but to make it stick for students, you need to unpack *why* we grant one to humans and (currently) only the other to animals.

  Here is a systematic framework you can use in class to move students from intuition to argument. It breaks the problem down into four steps: defining the moral currency, testing the criteria, addressing the "marginal cases," and examining the political implications.

  ### 1. Define the Moral Currency: Interests vs. Rights
  The first step is to clarify the student's intuition. They are asking why animals don't get the *same* protection as humans. To answer, you must distinguish between two types of moral consideration.

  *   **Interests (Utilitarian/Welfarist View):** To have an interest is to have a capacity for well-being or suffering. If a being can suffer, it has an interest in not suffering.
      *   *Implication:* Interests are **aggregable**. We can weigh Animal Interest A against Human Interest B. If the human benefit is high enough and the animal suffering is low enough, the trade is permissible.
      *   *Current Status:* This is roughly where animal law sits (e.g., the Animal Welfare Act). We acknowledge they have interests (don't torture them for fun), but those interests can be overridden by significant human benefit (medical cures).
  *   **Rights (Deontological View):** To have a right is to have a **trump** or a **side-constraint**. It means the individual cannot be used merely as a means to an end, regardless of the aggregate benefit.
      *   *Implication:* Rights are **non-aggregable**. You cannot sacrifice one innocent human's life to save five others, even if the math works.
      *   *Current Status:* This is where human medical ethics sits (e.g., the Nuremberg Code, Declaration of Helsinki). Informed consent is a right, not a preference.

  **Class Question:** *Is the difference between humans and animals a difference of **degree** (animals suffer less/are less smart) or a difference of **kind** (humans have a sacred status)?*

  ### 2. Test the Criteria: Why do Humans have Rights?
  If rights are "trumps," what quality grants them? Have the students propose criteria, then test them. Common criteria include:

  *   **Criterion A: Rationality/Autonomy.**
      *   *Argument:* Humans can reason and consent; animals cannot. Therefore, humans have rights.
      *   *Counter-Argument:* What about human infants, the severely cognitively disabled, or those in comas? They lack rationality/autonomy, yet we grant them full rights. We do not allow medical testing on them without proxy consent, and even then, with massive restrictions.
  *   **Criterion B: Sentience (Capacity to Suffer).**
      *   *Argument:* The ability to feel pain is what matters (Jeremy Bentham/Peter Singer).
      *   *Counter-Argument:* If sentience is the bar, then primates (and pigs/dogs) qualify. If we don't test on humans with similar cognitive capacity to chimps, why test on chimps? This leads to the charge of **Speciesism**.
  *   **Criterion C: Moral Agency/Community.**
      *   *Argument:* Rights are part of a social contract among beings who can understand and follow rules (Contractualism). Animals can't sign the contract, so they don't get the protection.
      *   *Counter-Argument:* This admits that animals are outside the sphere of justice. It explains *why* we do it, but doesn't necessarily justify it morally. It reduces morality to power dynamics ("might makes right").

  ### 3. The "Argument from Marginal Cases"
  This is the most powerful philosophical tool for this specific case. It forces students to confront the inconsistency.

  **The Argument:**
  1.  If we justify animal testing based on cognitive inferiority (they are less smart/autonomous than us)...
  2.  Then we must logically accept testing on humans who have the same or lower cognitive capacity (infants, severe dementia patients).
  3.  We reject testing on those humans (we say they have rights).
  4.  Therefore, cognitive capacity cannot be the sole reason we deny rights to animals.

  **The Fork in the Road:**
  At this point, the class must choose one of two difficult positions:
  *   **Position 1 (Elevate Animals):** We are wrong to test on primates. Their cognitive similarity to "marginal case" humans grants them a right not to be used as means. (Tom Regan's view).
  *   **Position 2 (Lower Humans):** We protect "marginal case" humans only because of **species membership**, not capacity. We admit this is a form of nepotism (Speciesism), but argue that human solidarity is a necessary political fiction to maintain human rights culture.

  ### 4. Distinguish "Moral Status" from "Political Status"
  To help the distinction "stick," you can introduce the difference between *moral considerability* and *political membership*.

  *   **Moral Considerability:** Does this being matter? (Yes, animals matter. Torturing them for fun is wrong).
  *   **Political Membership:** Is this being a citizen of the moral community entitled to inviolability?

  **The Systematic Explanation:**
  We might argue that while animals have *moral status* (their suffering counts), they lack the *political status* required for rights because rights are a mechanism for governing relationships between agents who can claim duties.
  *   *Critique:* This sounds like "realpolitik" (as you noted).
  *   *Defense:* A political philosopher might argue that human rights are a **human technology**. They are designed to protect human vulnerability within a human community. Extending them to animals requires a different framework (e.g., stewardship or guardianship) rather than "rights."

  ### 5. Classroom Exercise: The "Veil of Ignorance" for Species
  To make this concrete, adapt Rawls' *Veil of Ignorance*.

  **The Setup:** Ask students to design a medical research policy behind a veil of ignorance.
  **The Twist:** They do not know *what species* they will be born as. They might be a human, a chimpanzee, or a mouse.
  **The Question:** Would they consent to a system where primates are used for neurological research if there is a chance they might be born a primate?

  *   If they say **No**: They argue for strong animal rights (or at least rights for high-cognition animals).
  *   If they say **Yes**: They must explain why the human benefit is so overwhelmingly valuable that it justifies the risk of being a suffering primate.

  ### Summary for the Students
  To answer your specific question on how to articulate the line:

  1.  **Interests** are about **welfare** (minimizing pain). We owe this to all sentient beings.
  2.  **Rights** are about **sovereignty** (inviolability). We arguably owe this to beings who are "subjects-of-a-life" (have memory, preference, future) OR simply to members of our own moral community.
  3.  **The Tension:** The current system is a hybrid. We treat animals as having *interests* (hence oversight/IACUC), but not *rights* (hence they can be sacrificed for aggregate good).
  4.  **The Challenge:** The system is only consistent if you can defend why a primate's interest in not suffering is outweighed by human benefit, while a cognitively similar human's interest is not. If you can't defend that without saying "because they are human," you have admitted the system rests on species-preference, not pure moral logic.

  ### Recommended Reading for the Unit
  If you want to assign short texts to anchor this:
  *   **Peter Singer:** *All Animals Are Equal* (Focus on Speciesism and Sentience).
  *   **Tom Regan:** *The Case for Animal Rights* (Focus on "Subject-of-a-Life" and inherent value).
  *   **Carl Cohen:** *The Case for the Use of Animals in Biomedical Research* (A defense of the Contractualist view—animals have no rights because they cannot claim them).

  This approach validates the student's intuition (that there is an inconsistency) without forcing you to take a political stance. It turns the inconsistency into a feature of the lesson, not a bug in your lecture.
