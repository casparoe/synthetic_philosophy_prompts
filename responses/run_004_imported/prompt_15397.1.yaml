prompt: |-
  Okay so I'm TAing a seminar on Humean supervenience this term and we just spent two whole sessions on Lewis's Principal Principle and this "undermining" business, and I still feel kind of shaky on it if I'm honest. My office mate and I were arguing about it over coffee yesterday: the idea (I think?) is that since on Lewis's picture objective chances get fixed by patterns spread across the whole Humean mosaic, past present and future, it's possible for some evidence about the far future to count as evidence against the very chance hypothesis that the Principal Principle is telling you, right now, to defer to - so naive deference and just conditionalizing on everything you know can come apart. Lewis's own go-to illustration (long-run coin toss frequencies undermining a chance-of-heads hypothesis) is the one every intro to this literature recycles, and it's so clean and idealized at this point that I honestly can't tell if I understand the phenomenon itself or if I've just memorized the shape of that one example.

  So here's what I actually want from you: invent a brand new "undermining future" case for me, not coins, not radioactive decay, some totally different concrete setup (real-world-ish is fine, or even just a vivid toy scenario, as long as its not a repaint of the standard one). It needs an agent who knows the objective chance of some event E, plus some further proposition H about the future course of history, such that H isn't the kind of thing the Principal Principle would obviously flag as inadmissible, but learning H would still rationally push the agent's credence in E away from the stated chance, precisely because H bears on whether that chance hypothesis is even the true one. Then walk me through, concretely and in terms of your own example (not just gesturing at the general recipe), why plugging straight into the Principal Principle there gives a worse answer than conditionalizing on everything, and whether a Hall/Thau-style "New Principle" fix actually rescues the intuitive verdict in your case or just relabels the problem.
