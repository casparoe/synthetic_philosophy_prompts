answer: |-
  This is a profound and deeply human dilemma. You are grappling with the philosophy of personal identity alongside the ethics of repair. It is a sign of significant moral growth that you feel this tension; a person who had not changed would likely feel no discomfort at all, or would simply offer a hollow platitude to make the problem go away.

  To answer your specific questions: **Yes, there is something confused about thinking you are off the hook, but no, the lack of emotional continuity does not mean the apology isn't yours to give.**

  Here is a way to untangle the knot between who you were, who you are, and what you owe your friend.

  ### 1. The Victim's Reality vs. The Perpetrator's Identity
  The core confusion lies in where you are locating the "truth" of the event. You are locating it in your internal sense of self (*"I don't feel like that person anymore"*). Your friend is locating it in her lived experience (*"You hurt me"*).

  To her, the continuity is absolute. She has carried the memory of your voice, your face, and your words for fifteen years. If you tell her, "That wasn't really me," you are effectively gaslighting her. You are prioritizing your current psychological comfort over her historical reality. You noted that you would be furious if someone used that line on you; trust that instinct. It reveals that, ethically, you know that identity is not just an internal feeling, but a social contract. We are held accountable by those we impact, not just by our own self-conception.

  ### 2. The "Distant Relative" Metaphor
  Your metaphor of the teenager as a "distant relative" is actually very useful, provided you don't use it to escape responsibility.

  Think of it this way: If a distant relative died and left behind a debt or a mess that harmed someone, and you were the executor of their estate, you wouldn't say, "I didn't incur this debt." You would say, "I am the one here now to settle this."

  You are the current custodian of that teenager's life. You inherited their body, their history, and the consequences of their actions. Part of growing up is becoming the adult who cleans up the messes the child made. The apology isn't an admission that you are *still* cruel; it is an admission that you are *responsible* for the cruelty that happened under your watch.

  ### 3. Reframing the Apology
  The reason the apology feels dishonest is that you think an apology requires you to say, "I am a bad person who did a bad thing." Since you don't feel like a bad person now, that feels like a lie.

  But a mature apology doesn't have to be about self-flagellation. It can be about **witnessing**.

  You don't have to pretend you are the same person to validate her pain. In fact, your growth is the very thing that makes the apology possible now. You can say, in essence: *"I have changed so much that looking back at what I did shocks me. But I know it was me, and I know it hurt you."*

  The apology is not about punishing your current self for the past self's crimes. It is about acknowledging that her pain is real, regardless of your internal evolution.

  ### 4. How to Bridge the Gap in Writing
  You can actually write the disconnect into the apology. Honesty about your transformation can be part of the repair, as long as it doesn't minimize the harm.

  *   **Avoid:** "I'm not that person anymore." (This dismisses her experience.)
  *   **Try:** "I have spent fifteen years becoming someone who would never speak to you that way. But looking back with the eyes I have now, I see clearly how much pain I caused you, and I am deeply sorry."

  This approach accomplishes two things:
  1.  It validates her memory (Yes, that happened).
  2.  It validates your growth (I see it clearly now, which is why I can apologize sincerely).

  ### 5. Why It Feels Like "Confessing to a Crime"
  It feels like confessing to someone else's crime because you are conflating **guilt** with **responsibility**.

  *   **Guilt** is the feeling that you are currently morally corrupt. You don't need to feel this to apologize.
  *   **Responsibility** is the acknowledgment that your actions (past or present) have consequences that need addressing.

  You can take full responsibility without carrying the guilt. You are not going back in time to stop the teenager; you are stepping forward as the adult to acknowledge the fallout.

  ### The Verdict
  You are not off the hook. The continuity of consciousness isn't required for moral responsibility; the continuity of consequence is. Your friend was hurt by your body and your voice, and she is seeking healing from the person who occupies that life now.

  The discomfort you feel is not a sign that the apology is wrong; it is the friction of growth. It is the weight of the past meeting the integrity of the present. If you can write the apology not as a confession of current evil, but as a testament to how clearly you now see the harm you caused, you may find it feels less like a lie and more like the final proof that you really have changed.
