      *   Actually, CEE is often derived *from* the law of total probability. RP is a constraint that ensures your current distribution over future probabilities aligns with those probabilities.
      *   Better phrasing: CEE is a mathematical consequence of Bayesian updating. RP is a normative principle that *requires* you to set your priors such that you treat your future self as an expert. If you are a Bayesian updater, you satisfy CEE. If you satisfy RP, you generally must be a Bayesian updater (mostly), but RP demands more (deference even without evidence).
      *   Okay, I will characterize CEE as a *theorem of Bayesian kinematics* and RP as a *normative principle of diachronic coherence*. CEE is what happens when you update on evidence. RP is what happens when you trust your future self *simpliciter*.

