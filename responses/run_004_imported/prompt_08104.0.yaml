answer: |-
  You have put your finger on a genuine and often overlooked distinction in formal epistemology. Within the rationalist community (LessWrong, *Overcoming Bias*), these two principles are frequently treated as synonymous heuristics for "don't be biased," but formally and philosophically, they occupy different niches.

  Your suspicion is correct: **Conservation of Expected Evidence (CEE) is best understood as a mathematical theorem of Bayesian kinematics, whereas Van Fraassen's Reflection Principle (RP) is a normative constraint on diachronic coherence that extends beyond Bayesian updating.**

  Here is a detailed comparison addressing your specific questions.

  ### 1. Formal Distinctions and the "Special Case" Hypothesis

  **Conservation of Expected Evidence (CEE)**
  CEE is a theorem of standard probability theory, provided one assumes Bayesian conditionalization. If you have a hypothesis $H$ and a partition of possible future evidence $\{E_i\}$, then:
  $$P_t(H) = \sum_i P_t(E_i) P_t(H | E_i)$$
  Since the posterior $P_{t'}(H)$ is defined as $P_t(H | E_i)$ upon learning $E_i$, this entails:
  $$P_t(H) = E_t[P_{t'}(H)]$$
  Your current credence is the expectation of your future credence. This holds *if and only if* your belief update is driven by conditionalization on a partition of evidence you can currently conceive.

  **Van Fraassen's Reflection Principle (RP)**
  RP is a normative principle stated as:
  $$P_t(A | P_{t'}(A) = r) = r$$
  This states that your current credence in $A$, conditional on the proposition that your future credence in $A$ will be $r$, must be $r$. It treats your future self as an **expert** on $A$.

  **Is CEE a special case of RP?**
  Yes, effectively. If you assume that:
  1.  Your future credence $P_{t'}(A)$ is determined solely by Bayesian conditionalization on evidence $E$; and
  2.  You currently know the mapping between evidence $E$ and posterior credence $r$;

  Then conditioning on "my future credence will be $r$" is equivalent to conditioning on "I will receive evidence $E$ such that $P(A|E)=r$." Under these restrictive Bayesian assumptions, RP collapses into CEE.

  However, the **justification** differs. CEE is a mathematical identity derived from the axioms of probability and the definition of conditionalization. RP is a substantive claim about rationality: it claims you *ought* to defer to your future self's doxastic state even if you don't know *why* it changed.

  ### 2. The Troublesome Generality of Reflection

  You asked if the restriction in CEE avoids the troublesome features of RP. **Yes, absolutely.**

  The "troublesome feature" of RP is that it demands deference to the future self's *output* regardless of the *process*. It treats the future credence as a black box of expertise. This exposes RP to counterexamples where the future self is reliable in a trivial sense but not evidentially.

  **The Counterexamples (Memory Loss and Brainwashing)**
  *   **Memory Loss (Shangri-La):** Suppose you enter Shangri-La via the Mountains. You know that upon entering, your memory of the path will be wiped and replaced with a memory of coming via the Sea. At time $t$ (before entry), you know your future credence $P_{t'}(\text{Mountains})$ will drop to 0.5.
      *   **RP says:** You should lower your credence to 0.5 *now*.
      *   **Intuition:** This is irrational. You currently possess evidence (you are at the Mountain gate) that you will lose. You should not defer to a future self who is less informed than you.
      *   **CEE says:** CEE does not apply here because the change in belief is not due to receiving new evidence $E$ that partitions the world, but due to the *loss* of evidence. CEE governs updating on evidence, not evidence destruction.

  *   **Rational Self-Doubt (Christensen):** Suppose you know that as the night wears on, your cognitive faculties will dull, and you will become less confident in your mathematical calculations, even if the calculation remains correct.
      *   **RP says:** You should lower your confidence now to match your future tired self.
      *   **Intuition:** No. You know the future shift is due to fatigue (a bias), not evidence.
      *   **CEE says:** CEE is silent. Fatigue is not a Bayesian evidence partition.

  By restricting itself to **expected evidence**, CEE sidesteps these counterexamples. It only commands you to move your belief if you expect to receive *information*. RP commands you to move your belief if you expect your future self to *believe it*, even if that belief is caused by forgetting or manipulation.

  ### 3. Which Principle Does More Substantive Work?

  This depends on whether you are doing **engineering** (debugging human reasoning) or **foundations** (defining rational agency).

  **For the Rationalist Community (Engineering): CEE is superior.**
  Yudkowsky's deployment of CEE is primarily a tool against motivated reasoning. The argument is: "If you know that reading the study will make you believe X, you should believe X now."
  *   This is actionable advice.
  *   It correctly identifies that if you can predict the direction of belief change without seeing the data, you are likely double-counting your priors or ignoring the evidence you already have.
  *   It avoids the trap of telling you to defer to your future, brainwashed self.

  **For Formal Epistemology (Foundations): RP is more ambitious but likely false.**
  RP attempts to solve the problem of **diachronic coherence**. It tries to establish a norm that binds an agent across time.
  *   Its "missing generality" (the part CEE lacks) is the attempt to handle cases where the *mechanism* of belief change is opaque.
  *   However, as the counterexamples show, this generality is a bug, not a feature. A rational agent should *not* defer to a future self that they know will be less informed or compromised.
  *   Philosophers like David Christensen and Frank Arntzenius have argued that RP must be severely qualified (e.g., "Reflection holds only if you expect your future self to be at least as informed and rational as you") to survive. Once you add those qualifications, it begins to look much more like CEE.

  ### 4. Does Yudkowsky's CEE Smuggle in Reflection's Difficulties?

  Generally, **no**, but there is a subtle risk in how it is applied rhetorically.

  **The Math is Safe:**
  As a theorem of probability, CEE cannot be "false." $E[P_{posterior}] = P_{prior}$ is tautologically true for Bayesian updaters.

  **The Application Risk:**
  The danger lies in assuming that a future belief *is* the result of Bayesian updating when it might not be.
  *   *Safe usage:* "I expect to read a rigorous study. I cannot predict the result. Therefore, my expected belief change is zero."
  *   *Risky usage:* "I expect that after talking to my guru, I will believe X. Therefore, by Conservation of Expected Evidence, I should believe X now."

  In the risky usage, the rationalist might conflate "future belief" with "posterior on evidence." If the guru's influence is persuasion (changing priors/values) rather than evidence (likelihood ratios), CEE does not apply. If a rationalist uses CEE to justify deferring to a future self who has been persuaded by rhetoric rather than evidence, they have effectively smuggled in the unqualified Reflection Principle.

  However, Yudkowsky's writing typically emphasizes **evidence** specifically ("Conservation of Expected *Evidence*"). He usually warns against anticipating belief shifts driven by non-evidential factors (like "wanting to believe"). In this sense, the LessWrong usage is usually careful enough to avoid the Shangri-La/Memory Loss traps. It treats CEE as a constraint on how you process *data*, not a command to defer to *future psychology*.

  ### Verdict

  You are right to distinguish them.

  1.  **CEE** is a theorem of Bayesian updating regarding **evidence**. It is robust, mathematically sound, and practically useful for catching bias. It does not suffer from the brainwashing counterexamples because it does not apply to non-evidential belief changes.
  2.  **RP** is a normative principle regarding **expertise**. It is philosophically fragile. Its "generality" (deferring to future selves regardless of process) is precisely what makes it vulnerable to counterexamples involving memory loss, irrationality, or information loss.
  3.  **Substantive Work:** CEE does more work for the goal of *truth-seeking* in imperfect humans. RP does more work for the goal of *defining ideal agency*, though it likely fails as a universal norm without heavy qualification.
  4.  **Smuggling:** CEE does not inherently smuggle in RP's difficulties, provided one strictly adheres to the requirement that the future belief change be driven by a known partition of **evidence**. The risk lies only in the misclassification of psychological persuasion as "evidence."

  In short: **Conservation of Expected Evidence is the safe, evidential core of the Reflection Principle, stripped of the dangerous requirement that we treat our future selves as infallible experts regardless of how they got there.** The rationalist community is generally correct to rely on CEE, provided they don't slide into unqualified deference to their future opinions.
