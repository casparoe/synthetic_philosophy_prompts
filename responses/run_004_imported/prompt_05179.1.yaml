answer: |-
  The carbon dioxide scrubber on Elara's suit had failed an hour ago. Now, the air inside her helmet tasted like copper pennies and old sweat. She floated tethered to the exterior hull of Station Theta, the black void of the lunar night pressing against her visor. Inside the airlock, three meters of reinforced polymer away, was breathable atmosphere and Kael.

  Kael controlled the cycle. He also controlled the encryption key she needed to unlock the station's comms array once she was inside. They had a problem: Elara had the administrative override codes for the station's power grid, which Kael needed to prevent a meltdown. He wouldn't open the inner door unless he knew she'd hand over the codes. She wouldn't hand over the codes unless she knew she'd get inside.

  But once she was inside, the leverage vanished. She would be breathing. He would be safe. Rationality dictated that once her lungs were full, she should keep the codes. She could hold the station hostage from the inside. Kael knew this. That was why the airlock panel wasn't waiting for a promise. It was waiting for a profile.

  A holographic interface flickered to life on the airlock glass. A single line of text pulsed in the red glow: *INTENT VERIFICATION REQUIRED.*

  Elara's breath hitched. The station's AI, Overseer, didn't scan for lies. It scanned for dispositions. It analyzed micro-tremors in her grip, pupil dilation, hormonal spikes, the chaotic firing of neurons associated with future planning. It didn't care what she said. It cared about who she was becoming in the moment of decision.

  If she intended to honor the deal only because she was currently vulnerable, Overseer would see the calculation. It would see that once vulnerability ended, the incentive would evaporate. The light would stay red. She would suffocate.

  To turn the light green, she couldn't just promise to pay. She had to be the kind of person who pays even when the gun is off their temple.

  Her fingers hovered over the keypad on her suit wrist. The logical path screamed in her head. *Get inside. Secure the air. Then negotiate from strength. Why give him the grid codes when he can't eject you?* It was the only move that maximized her survival probability. It was the only rational move.

  And it was the move that would kill her.

  The vertigo hit her physically, a nausea unrelated to the hypoxia. To survive, she had to voluntarily disable her own future self-interest. She had to lobotomize her survival instinct regarding the codes. She had to make a promise to her future self that her future self would want to break, and she had to make it stick *now*.

  She closed her eyes. The copper taste was stronger.

  She thought about the codes. They were power. Giving them up was weakness. But keeping them was death. No, that wasn't right. Keeping them was *possible* death. Giving them up was *guaranteed* safety. But Overseer didn't want the calculation. It wanted the disposition.

  She had to love the honor more than the leverage. She had to rewrite her own utility function in real-time.

  Elara imagined herself inside the airlock. The hiss of pressure equalizing. The helmet coming off. Kael standing there, hand out. In this imagination, she didn't hesitate. She didn't weigh options. She didn't look for loopholes. She simply handed over the drive. She felt the loss of power as a relief, not a cost. She felt the irrationality of it—the sheer waste of leverage—as a virtue.

  She had to convince the machine that she was incapable of betrayal, even when betrayal was free.

  She focused on the feeling of integrity, not as a strategy, but as a compulsion. She visualized the moment of handover not as a transaction, but as an inevitability. She stripped away the part of her mind that calculated odds. She buried the strategist. She amplified the partner.

  It felt like falling. It felt like stepping off a ledge trusting the air would hold. She was forcing her future self into a cage, locking the door, and throwing away the key, all to prove to the present moment that the cage existed.

  *If I am the type who cheats,* she thought, *I die here.*
  *If I am the type who pays,* she lives.
  *Therefore, I must be the type who pays.*

  But she couldn't just decide to be that type. She had to *be* it. The distinction was the width of a neuron. She had to genuinely not see the option to cheat as an option at all.

  Her heart rate slowed. The panic receded, replaced by a cold, hard resolve that felt alien to her instincts. She wasn't agreeing to pay. She was becoming a payer.

  The red light on the airlock panel flickered. It hovered, uncertain. The AI was tasting the change in her neurochemistry, the sudden drop in deceptive planning centers, the spike in commitment-related pathways. She was rewriting her own source code through sheer will.

  The light turned green.

  The outer door hissed open. Elara pulled herself through the threshold, her muscles weak. The inner door cycled. Pressure equalized. She popped her helmet seal and breathed. The air was cold, recycled, and perfect.

  Kael was waiting in the small decon room. He held out a data pad. He didn't speak. He didn't have to. He knew the scan had passed. He knew she was safe now. He knew that by every metric of standard game theory, she should shoot him, or run, or keep the codes.

  Elara floated toward him. The leverage burned in her pocket. The codes could buy her a ship. They could buy her freedom. Giving them up meant returning to being a subordinate, a technician, dependent on the grid she just saved. It was irrational. It was a loss.

  She looked at Kael. He didn't flinch. He trusted the scan more than he trusted her.

  Elara reached into her suit and pulled out the drive. Her hand trembled, not from fear, but from the sheer weight of the paradox. She was about to act against her own immediate interest because her past self had decided her future self must be bound. She was a puppet of a decision made when she was dying, cutting off the options of the woman who was now living.

  She placed the drive in his hand.

  It was done. She had won by losing. She had survived by ensuring she could no longer threaten the man who saved her. The rationality of it spun in her head, a loop with no beginning. She was safe because she was harmless.

  Kael took the drive. "Welcome back," he said.

  Elara leaned against the wall, the vertigo still spinning behind her eyes. She was alive. And she was exactly the kind of fool who would let herself be saved.
