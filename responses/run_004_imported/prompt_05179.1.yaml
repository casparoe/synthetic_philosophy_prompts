  *(Refining the Ending)*: The story should end right as she fulfills the promise, highlighting the cost. She loses the leverage, but gains life. The "irrationality" is giving up the leverage when she doesn't need to.

  10. **Final Polish:** Check word count and flow. Ensure the "vertigo" lands—the feeling that rationality is a loop, not a line.

