answer: |-
  The fume hood hummed, a constant B-flat that marked the passage of time in the lab. It was 7:00 PM on a Tuesday. The building was mostly empty, save for the hum and the two of them.

  Mark capped the vial of synthesized azide. He looked at the secondary containment tray, then at the clock. The protocol demanded the tray be lined with absorbent pads and checked for microfractures before handling high-energy compounds. It would take ten minutes. The courier was coming in eight.

  "It's stable," Mark said, more to the room than to Elena. "It's been stable for six months. The tray looks fine."

  Elena nodded, wiping her hands on her lab coat. She was running the same synthesis the following week. "Ten minutes is ten forever-hours when you're waiting on a grant renewal."

  Mark skipped the check. He boxed the vial. The courier arrived. The sample left the building. Nothing exploded. Nothing leaked. Mark published the paper six months later. At the departmental review, the PI clapped him on the shoulder. "Efficient work, Mark. You know how to keep the pipeline moving without getting bogged down in bureaucracy."

  The following week, Elena stood at the same hood. The same hum. The same vial. She looked at the containment tray. It looked fine. She thought of Mark's success, the praise for efficiency, the pressure of her own timeline. She skipped the check.

  She pipetted the solution. A stress fracture in the tray, invisible to the naked eye, gave way under the weight of the rack. The vial tipped. The azide struck the bare ceramic base of the hood.

  The blast was dull, like a book dropping heavily, but the shrapnel was precise. A technician two hoods down took a shard of glass to the radial nerve. Permanent damage. Partial loss of hand function.

  The fallout was immediate and absolute.

  Elena wasn't invited to the departmental meeting where the incident was discussed; she was the subject of it. The PI spoke in a grave, disappointed tone. "Negligence," he said. "A disregard for safety culture. We cannot have cowboys in this lab."

  Her access badge was deactivated. Her name was attached to the insurance claim. In the breakroom, conversations stopped when she entered. People looked at her hands, then at their own, as if checking for contagion. She was no longer "efficient." She was "reckless."

  Three months later, they met for coffee off-campus. The lab was a forbidden zone for Elena while the investigation dragged on. Mark looked rested; Elena looked hollowed out.

  "They're talking about terminating my contract," Elena said. She stirred her coffee but didn't drink. "Miller says I compromised the integrity of the whole group."

  "Miller praised me for the same move," Mark said quietly.

  "He praised you because nothing happened."

  "I made the choice, Elena. You made the choice. It was the same choice."

  "Was it?" She looked up, her eyes sharp with a fatigue that sleep wouldn't fix. "If I'd done it a thousand times, and nothing happened a thousand times, I'd be a genius. I did it once. Something happened. Now I'm a danger."

  "It's not fair."

  "Fairness implies there's a metric we're being measured against," she said. "But there isn't. We think we're being judged on our judgment. On our intent. But we're not." She set the spoon down. It clinked loudly against the ceramic. "We're being judged on the roll of the dice."

  Mark looked out the window. He thought about the tray. He thought about how easily he could have been the one sitting here with a ruined career, while Elena collected the praise for efficiency. The only difference was a microfracture in plastic.

  "So what are we?" Mark asked. "If the outcome decides the virtue... if I'm 'prudent' and you're 'negligent' based on something neither of us controlled..."

  "Then we aren't moral agents," Elena said. "We're just weather vanes. Spinning wherever the wind blows."

  "We chose to skip the check."

  "We chose to take a risk," she corrected. "But we didn't choose the reality that met that risk. You got away with it. I didn't. So you're good, and I'm bad. But inside the hood, Mark, nothing was different. The chemistry was the same. The decision was the same."

  She picked up her cup, her hand trembling slightly—a permanent reminder, though not from this incident.

  "If my moral worth depends on luck," she said, her voice dropping to a whisper, "then I don't think I have any moral worth at all. I just have luck. And so do you."

  Mark watched her. He wanted to argue. He wanted to say that character mattered, that intent counted. But he looked at his own hands, steady and unscarred, and wondered if they were truly his own, or just gifts from a universe that hadn't decided to break them yet.

  "I'm sorry, Elena."

  "Don't be sorry," she said, standing up. "Just check the tray tomorrow. Even if nothing happens."

  She walked out into the bright sunlight, leaving Mark alone with the silence, wondering if the man who checked the tray was actually better, or just luckier than the man who didn't.
