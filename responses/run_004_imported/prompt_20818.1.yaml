answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** [Your Name], Committee Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Discount Rate Methodology for Internal Evaluation Guidance

  **1. Purpose**

  This memo resolves the ongoing discussion regarding the discount rate components in our grant evaluation framework. Specifically, it addresses the proposal to introduce a ~1.5% "Pure Time Preference" (PTP) term. Our goal is to finalize a guidance document that allows us to compare near-term interventions (e.g., global health bednets) against long-term interventions (e.g., AI safety governance) without conflating distinct ethical and economic variables.

  **2. The Three Components of Discounting**

  To ensure clarity in our writeups, we must keep the following three components distinct. Confusion arises when we let them bleed into one another to justify a pre-determined conclusion.

  *   **A. Pure Time Preference (PTP):** Discounting a benefit solely because it occurs later. (e.g., "Saving a life in 2100 is intrinsically less valuable than saving a life in 2025.")
  *   **B. Growth / Diminishing Marginal Utility (DMU):** Discounting because future beneficiaries may be wealthier, meaning an additional dollar buys less utility. (e.g., "Future humans will be richer, so cash transfers are less effective.")
  *   **C. Existence & Probability:** Discounting based on the likelihood the beneficiaries exist or the intervention succeeds. (e.g., "Civilizational collapse risk" or "Model uncertainty.")

  **3. Analysis of the Proposal**

  **The Ethical Objection (Sidgwick/Ramsey)**
  Committee members opposing PTP are correct on normative grounds. As a mission-driven foundation, our discount rates should reflect our *values*, not descriptive models of market behavior or human psychology. Adopting a positive PTP implies we value the welfare of future generations less than current ones simply due to temporal location. This contradicts the core impartiality principle underpinning our interest in long-termism and biosecurity. If we accept that a life is a life, the date on the calendar is morally irrelevant.

  **The Practical Objection (The "Quant Lead" Concern)**
  The argument for a 1.5% PTP is not truly about impatience; it is a safeguard against **model dominance**. As the Stern-vs-Nordhaus debate highlighted, a near-zero PTP combined with high-leverage long-term claims can mathematically dominate a portfolio. This leads to two risks:
  1.  **Pascal's Mugging:** Low-probability, astronomical-payoff claims (e.g., affecting $10^{50}$ future lives) drown out certain, near-term suffering.
  2.  **Permanent Deferral:** If the future is valued equally and investment returns exceed economic growth, the rational move is to never spend and only invest.

  **4. Recommendation**

  I recommend we **reject the inclusion of a normative Pure Time Preference term (set PTP = 0%)**, but explicitly adjust our **Probability/Existence** framework to address the practical risks identified.

  **Rationale:**
  We can achieve the Quant Lead's desired practical outcome (preventing far-future speculation from automatically dominating the budget) without adopting the ethical baggage of time discrimination. We do this by treating "time" as a proxy for "uncertainty," not value.

  **5. Implementation Guidelines**

  Effective immediately, our evaluation rubric will adopt the following standards:

  *   **Pure Time Preference:** Set to **0%**. We do not discount the welfare of future beings based on date. This maintains ethical consistency across our global health and long-term safety portfolios.
  *   **Growth/DMU:** Continue to apply based on projected economic growth and estimated marginal utility of wealth. *Note: Evaluators must ensure this is not double-counting against probability.*
  *   **Probability & Epistemic Uncertainty:** This is where we address the "cluelessness" problem. We will introduce an **Epistemic Decay** factor within the Probability term.
      *   *Guidance:* As the time horizon extends, the reliability of our causal models decreases. A grant claiming impact in 2030 should be held to a different standard of evidence than a grant claiming impact in 2150.
      *   *Mechanism:* Evaluators must apply a "model uncertainty" discount that scales with the complexity and distance of the causal chain. This is not discounting the *lives*; it is discounting our *confidence* that the intervention helps them.
  *   **Portfolio Constraints (Addressing Deferral):** To prevent "permanent deferral" or single-cause dominance, we will not rely on discount rates to balance our portfolio. Instead, we will use **allocation buckets**.
      *   *Guidance:* We will set target allocation ranges (e.g., 40-60% Near-Term, 20-40% Long-Term) at the committee level. This ensures we address urgent suffering now while hedging against existential risk, without requiring our EV models to force a false precision that inevitably favors the longest time horizons.

  **6. Conclusion**

  Adopting a 1.5% PTP would solve a mathematical problem with an ethical compromise. By keeping PTP at 0% and rigorously applying epistemic uncertainty discounts within the Probability term, we remain faithful to the principle that "time is not a moral discriminator," while acknowledging that "distance is a predictor of uncertainty."

  This approach allows us to fund bednets without guilt and AI safety without hype, keeping our three discount components distinct and defensible.

  Please review the attached draft rubric reflecting these changes prior to the quarterly meeting.

  [Your Name]
