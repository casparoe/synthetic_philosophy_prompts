      *   *Growth/Diminishing Marginal Utility:* Discounting because future people might be richer (so money helps less) or because utility functions saturate. This is standard welfare economics.
      *   *Existence/Probability:* Discounting because the beneficiaries might not exist (extinction risk) or the intervention might fail. This is risk adjustment.
      *   *The "Quant Lead's Real Worry":* It's not actually about impatience. It's about *decision paralysis* or *dominance arguments*. If PTP = 0, and there's a tiny probability of affecting $10^{50}$ future lives, expected value calculations get hijacked by long-termism to the exclusion of near-term suffering. This is the "Astronomical Waste" or "Pascal's Mugging" problem.
      *   *The "Sidgwick/Ramsey" Worry:* Institutionalizing discrimination against future generations.

  3.  **Identify the Core Tension:**
