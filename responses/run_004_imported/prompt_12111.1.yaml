      *   Reference the "St. Petersburg Paradox" resolution without utility functions.
      *   *Self-Correction:* I need to be careful not to say EUT is *wrong*, but that Ergodicity Economics offers a *distinct foundation*. The prompt asks for the case *for* the ergodic camp.
