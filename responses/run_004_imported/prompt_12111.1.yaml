answer: |-
  As a fellow traveler who has spent decades staring at phase spaces and worrying about whether time averages converge to ensemble averages, I can tell you exactly why this debate feels so uncanny. You are recognizing a category error that physicists spotted immediately but economists largely ignored for a century.

  To make the strongest possible case for the Ergodicity Economics (EE) camp, we must strip away the economic jargon and look at this through the lens you know best: **statistical physics.**

  The core argument for the ergodicity/Kelly camp is not that the math differs from Expected Utility Theory (EUT) with log utility—it often doesn't. The argument is that **EUT gets the ontology wrong.** It treats a physical constraint of the dynamics as a psychological preference of the agent.

  Here is the case for why maximizing time-average growth is a distinct, superior, and physically grounded standard of rationality.

  ### 1. The Violation of the Ergodic Hypothesis
  In stat mech, we assume ergodicity to justify replacing a time average with an ensemble average. We know this is an assumption, often an approximation, sometimes false (e.g., broken ergodicity in spin glasses).

  Standard economics assumes wealth dynamics are ergodic. It assumes that the expectation value $\mathbb{E}[W]$ (the ensemble average over parallel universes) is the relevant observable for a single agent living through time.

  But wealth dynamics are typically multiplicative ($W_{t+1} = W_t \cdot r_t$). In multiplicative processes, the distribution of wealth becomes log-normal. The ensemble average $\mathbb{E}[W]$ is dominated by the extreme right tail—outcomes that happen in vanishingly few parallel universes but involve astronomical wealth.
  *   **The Ensemble View:** "On average, you get rich." (Because the one copy of you that hits the jackpot pulls the mean up).
  *   **The Time View:** "Almost surely, you go broke." (Because the geometric mean is lower than the arithmetic mean due to volatility drag).

  For a single trajectory in a non-ergodic system, the ensemble average is **physically inaccessible**. It is a ghost. Optimizing for $\mathbb{E}[W]$ is optimizing for an observable that does not exist for the system you are actually in (a single universe). The EE camp argues that rationality requires optimizing the observable that actually exists for the agent: the time-average growth rate.

  ### 2. Dynamics vs. Preferences (The "Ad Hoc" Problem)
  This is the strongest philosophical wedge.
  *   **EUT (Samuelson's View):** To explain why people don't bet their entire bankroll on a positive expected value gamble, we must postulate a **utility function** $U(W)$. Why is it concave? Because people are "risk-averse." Why log specifically? Because that fits the data. It is a subjective psychological parameter fitted to behavior.
  *   **EE (Peters' View):** You don't need to postulate risk aversion. If the dynamics are multiplicative, the time-average growth rate is $g = \mathbb{E}[\ln(r)]$. To maximize your wealth over time, you *must* maximize the expected log.

  In this view, the "log" doesn't come from the agent's brain; it comes from the **equations of motion**.
  *   If the dynamics were additive ($W_{t+1} = W_t + \Delta$), the system would be ergodic, and the rational strategy would be to maximize expected value (linear utility).
  *   If the dynamics are multiplicative, the rational strategy is to maximize expected log (Kelly).

  This removes the "ad hoc" nature of utility functions. It turns risk aversion from a psychological quirk into a physical necessity imposed by the compounding nature of the environment. As a physicist, you should find this appealing: it derives the "law of motion" for decision-making from the properties of the system, not the introspection of the particle.

  ### 3. The Absorbing Boundary (Ruin)
  In many physical systems, we deal with conservative forces or periodic boundaries. In economics, there is a hard absorbing boundary at $W=0$.
  *   **Ensemble Average:** If one copy of you goes bust, it doesn't matter; the other copies keep playing and pull up the average. The ensemble average flows right through the absorbing barrier.
  *   **Time Average:** If *you* hit zero, the trajectory stops. There is no "next period."

  EUT can model ruin, but only by tweaking the utility function to be infinitely negative at zero. EE models ruin naturally: it is the point where the time average ceases to exist.
  The Kelly criterion inherently prevents ruin (it never bets the full bankroll). EUT with arbitrary utility functions can justify betting the farm if the payout is high enough. The EE argument is that any rationality criterion that allows for a non-zero probability of absorption (ruin) in a repeated game is physically defective for a single agent. You cannot average over histories that have terminated.

  ### 4. Evolutionary Selection (The "Market" as a Heat Bath)
  Even if an agent *wants* to maximize arithmetic expected value, the market may not let them.
  Consider a population of agents with different betting strategies.
  *   Agents maximizing arithmetic mean (high leverage) will have huge variance. Some will get astronomically rich, most will go bust.
  *   Agents maximizing geometric mean (Kelly) will grow steadily without ruin.

  Over long time horizons, the **share of total wealth** held by the Kelly bettors converges to 100%. The high-variance bettors are wiped out by the absorbing boundary.
  This makes the time-average growth rate an **objective standard of survival**. It doesn't matter what utility function you *think* you have; if you deviate significantly from the time-optimal path in a competitive, compounding environment, you are selected against. Rationality, in an evolutionary sense, is defined by persistence. The ensemble optimizer goes extinct; the time-average optimizer inherits the earth.

  ### 5. Answering Samuelson
  Samuelson's rebuttal (including the famous one-syllable paper) was essentially: *"If you maximize growth, you are acting as if you have log utility. So why complicate things? Just say you have log utility."*

  The Ergodic rebuttal is: **"The 'why' matters."**
  If it's just utility, then it's a matter of taste. If I prefer square-root utility, that's my prerogative. But if it's a property of the dynamics, then preferring square-root utility is objectively irrational in a multiplicative world, akin to preferring to violate the Second Law.

  Samuelson conflated the **mathematical equivalence** (maximizing $\mathbb{E}[\ln W]$ looks like maximizing log utility) with **conceptual identity**.
  *   **EUT:** "I maximize log wealth because I am nervous."
  *   **EE:** "I maximize log wealth because the world is multiplicative and I want to exist tomorrow."

  The EE camp argues that by masking the dynamic constraint as a preference, EUT allows economists to ignore the structural fragility of financial systems. It blames the agent's "risk aversion" rather than the system's "non-ergodicity."

  ### The Verdict for a Stat Mech Expert
  You spent 35 years knowing that $\lim_{T\to\infty} \frac{1}{T} \int_0^T A(t) dt \neq \langle A \rangle_{ensemble}$ unless the system is ergodic.

  Economics spent 350 years assuming they are equal for wealth.

  The strongest case for the Ergodicity/Kelly camp is that it restores **physical consistency** to economic modeling. It acknowledges that a single agent follows a single trajectory through phase space, not a cloud of probabilities. It recognizes that in non-ergodic systems (which includes almost all compounding financial processes), the expectation value is a misleading statistic for decision making.

  It is not merely "log utility in disguise." It is the assertion that **rationality is alignment with the ergodic properties of the environment.** When the environment is non-ergodic, the only rational observable is the time average. To do otherwise is to optimize for a parallel universe you will never visit.

  Samuelson was right that the math looks the same. But Peters is right that the physics is different. And in our line of work, physics trumps psychology.
