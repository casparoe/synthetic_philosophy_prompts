          *   Modern credit: The "breeding" happens before the loan even starts. The principal itself is a fiction of accounting.
          *   The *tokos* (interest) is charged on money that never existed.
          *   This violates the "sterility" doctrine more profoundly. It's not just treating sterile money as fertile; it's treating a promise as substance.

      *   **Point 3: Money as a "Common Measure" (*Metron*).**
          *   *NE* V: Money acts as a ruler. A ruler must be stable to measure accurately.
