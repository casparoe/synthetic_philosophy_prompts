          *   Modern banking creates a claim on *future* value (promise) treated as *present* money.
          *   For Aristotle, this separates the sign (money) from the thing signified (real wealth/need) even more radically than coinage debasement.
          *   It is the ultimate triumph of *chrematistike*: wealth-getting detached not just from need, but from *existing* substance.

      *   **Point 2: Usury (*Tokos*) Intensified.**
