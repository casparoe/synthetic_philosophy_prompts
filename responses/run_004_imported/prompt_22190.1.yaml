      *   *Justice in Exchange:* Reciprocal justice requires equality of value. Money measures this.
      *   *Usury:* The most hated because it makes money the source of money. It divorces acquisition from need/production.

  3.  **Analyze Modern Credit Creation through Aristotelian Eyes:**
      *   *The Act:* A bank types numbers into a computer. A deposit is created. A loan liability is created. No pre-existing metal/coin is moved.
      *   *Aristotle's View on Metal:* He acknowledges coinage is conventional, but he likely assumes a commodity basis (metal) or at least a state-backed token that represents *past* labor/production.
      *   *The "Sterility" Argument:* If money is sterile, it cannot reproduce. In usury, $100 becomes $105. In credit creation, $0 becomes $100 (principal) + $105 (repayment).
      *   *The "Measure" Argument:* If money measures value, the ruler itself must be stable. If the supply of money expands/contracts based on private profit motives (*chrematistike*), the measure fluctuates independently of the goods being measured.

  4.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. State the thesis: Aristotle would likely view this not merely as aggravated usury, but as a fundamental metaphysical corruption of money's ontological status, compounding the error of *chrematistike* with a falsification of the "measure."

      *   **Point 1: The Ontology of the Principal (Creation *ex nihilo*).**
