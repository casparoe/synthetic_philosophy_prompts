answer: |-
  This is a fantastic problem, and your intuition is spot-on while your labmate's is walking into a classic trap. You have stumbled directly into a research area known as **Program Equilibrium** (pioneered by Moshe Tennenholtz) and, more recently, **Logical Decision Theory** (developed by researchers like Eliezer Yudkowsky and Nate Soares).

  Your labmate is proposing a bot that acts according to **Causal Decision Theory (CDT)**: "I will model the world (the opponent), determine the causal outcome of my actions, and maximize utility." In a standard one-shot Prisoner's Dilemma, CDT dictates defection ("Grab"). Even with source code access, if you treat the code merely as a black box to simulate, you generally end up in a Defect-Defect equilibrium (or an infinite loop).

  Your intuition is that source code transparency allows for **Functional Decision Theory (FDT)** or **Logical Decision Theory (LDT)**: "My output is logically correlated with the output of any agent running similar reasoning. I should choose the output that leads to the best logical consequence."

  Here is a breakdown of the first principles, the specific algorithm you should consider, and the limits of this approach.

  ### 1. Why Simulation Fails (The Halting/Regress Problem)
  Your labmate's plan (`run(opponent)` then `best_respond`) fails for three reasons:
  1.  **Infinite Regress:** If Opponent B also simulates Opponent A, `A(B)` calls `B(A)` calls `A(B)`... Stack overflow.
  2.  **The Halting Problem:** You cannot algorithmically determine if an arbitrary opponent program will halt. If you set a timeout, a clever opponent can detect the timeout (by checking system clock or instruction count) and defect only when they detect they are being simulated.
  3.  **Unstable Equilibrium:** Even if simulation works, if you simulate them and they cooperate, your `best_respond` logic tells you to **Defect**. If they are also CDT agents simulating you, they see you defecting, so they defect. You end up at (Grab, Grab).

  ### 2. The Solution: "FairBot" (Proof-Based Cooperation)
  To capture the value of code transparency, you must stop treating the opponent's code as a *physical process to simulate* and start treating it as a *logical statement to analyze*.

  The canonical solution in this literature is an algorithm called **FairBot**.

  **The Logic:**
  > "I will **Share** if and only if I can **prove** that you will **Share** against me. Otherwise, I will **Grab**."

  **Pseudocode:**
  ```python
  def decide(my_source, opponent_source):
      if Prove(opponent_source(my_source) == "SHARE"):
          return "SHARE"
      else:
          return "GRAB"
  ```

  **Why this works (First Principles):**
  1.  **Safety against Defectors:** If the opponent is "Always Grab," you cannot prove they will Share. The proof fails. You Grab. You avoid the "Sucker's Payoff."
  2.  **Cooperation in Mirror Match:** This relies on **Löb's Theorem** from provability logic.
      *   FairBot A checks: `Provable(FairBot_B(A) == Share)`.
      *   FairBot B checks: `Provable(FairBot_A(B) == Share)`.
      *   Because the bots are identical (or logically equivalent), the system creates a self-referential loop of provability. Löb's Theorem essentially states that if a system can prove that "if P is provable then P is true," then P is true.
      *   In this context, it allows two FairBots to mutually prove cooperation without simulating each other, resulting in (Share, Share).
  3.  **No Infinite Regress:** You are not *running* the code; you are analyzing the code statically (like a compiler or theorem prover) to determine its output properties.

  ### 3. Practical Implementation for a Class Assignment
  Writing a full formal theorem prover (like Coq or Isabelle) inside a Python script for a tournament is likely impractical and might exceed runtime limits. However, you can implement a **heuristic approximation** of FairBot that captures the spirit without the heavy machinery.

  **Strategy: The "Handshake" + Static Analysis**
  Instead of full provability, look for structural evidence that the opponent is *trying* to cooperate with agents like you.

  1.  **Default to Grab:** Your baseline must be Defect. This protects you from "Always Grab" bots.
  2.  **Quine Check (CliqueBot):** Check if `opponent_source == my_source`. If yes, Share. This guarantees the mirror match points.
  3.  **Pattern Matching:** Scan the opponent's source code for specific strings that indicate they are looking for cooperation.
      *   *Example:* If their code contains `if opponent_will_share(): return SHARE`, and you can verify that their definition of `opponent_will_share` is compatible with your logic, you can Share.
  4.  **Bounded Simulation with "Cooperation Detection":**
      *   Run the opponent in a sandbox with a strict timeout.
      *   **Crucial Twist:** Do not best-respond to the result. Instead, look for *why* they produced the result.
      *   If they halt quickly and Share: Check *if* they simulated you. If they simulated you and *still* Shared, that is strong evidence of a cooperative algorithm (like FairBot). You Share.
      *   If they simulate you and then Grab: They are a CDT agent (like your labmate's idea). You Grab.
      *   If they hang (timeout): Assume they are stuck in a simulation loop. You Grab.

  **Recommended Bot Logic (Practical Version):**
  ```python
  def bot(my_code, opponent_code):
      # 1. Safety First
      if "GRAB" in opponent_code and "SHARE" not in opponent_code:
          return "GRAB" # Heuristic for unconditional defectors

      # 2. Mirror Match (Guaranteed Points)
      if my_code == opponent_code:
          return "SHARE"

      # 3. Attempt Logical Cooperation
      # Try to run them with a very short timeout. 
      # We pass a 'mock' version of ourselves that always Shares to test intent.
      try:
          # Sandboxed execution
          result = run_with_timeout(opponent_code, mock_cooperative_self, timeout=100ms)
          
          # If they cooperate with a cooperator, we cooperate with them
          if result == "SHARE":
              return "SHARE"
          else:
              return "GRAB"
      except TimeoutError:
          # If they hang, they are likely trying to simulate us recursively.
          # We defect to avoid the loop and punish non-halting.
          return "GRAB"
  ```
  *Note: A sophisticated opponent might detect the `mock_cooperative_self`. To prevent this, your mock self should be indistinguishable from your real self up to the point of the decision, or you must rely on static analysis.*

  ### 4. What This Exercise Teaches (The Limits of Transparency)
  This assignment is designed to teach you that **information alone does not solve coordination problems; decision architecture does.**

  1.  **Transparency $\neq$ Cooperation:** Simply seeing the code doesn't help if both agents use CDT (simulation + best-response). You will just see each other defecting before you defect.
  2.  **The Necessity of Commitment:** To get the (Share, Share) payoff, you must bind your own output to the opponent's output. You are effectively saying, "My action is a *function* of yours." This creates a correlation that CDT ignores.
  3.  **The "Clique" Limit:** In practice, without a formal theorem prover, bots tend to form "cliques." They cooperate with exact copies or bots written by the same team, but defect against bots written differently, even if those bots are also cooperative. This highlights the difficulty of **interoperable cooperation**.
  4.  **Vulnerability to "Spam":** If your bot tries to analyze code, it is vulnerable to opponents who submit massive, obfuscated code designed to crash your analyzer or consume your runtime quota. Your bot must have strict resource limits on its analysis phase.

  ### 5. Advice for the Grading Harness
  As a TA, here is what you should watch for in the harness:
  *   **Infinite Loops:** The harness *must* enforce a hard timeout on every match. If Bot A simulates Bot B and Bot B simulates Bot A, the OS won't necessarily catch it quickly.
  *   **Resource Exhaustion:** Prevent bots from reading huge files or allocating massive memory to crash the opponent's analysis.
  *   **Side Channels:** Ensure bots can't communicate via timing attacks or file I/O. They must only communicate via the return value.

  ### Summary Recommendation
  Tell your labmate: **"If we simulate them to best-respond, we are CDT agents, and we will defect against everyone, including ourselves (if we timeout). We will get the Punishment payoff everywhere."**

  Propose this instead: **"We should build a bot that searches for proof (or strong heuristic evidence) that the opponent cooperates with us. We default to Grab. We only Share if we verify they Share with agents like us. This makes us unexploitable by defectors but allows cooperation with other sophisticated bots."**

  This approach respects the theoretical promise of the assignment (Program Equilibrium) while acknowledging the practical constraints (Halting Problem). It turns the assignment from a "who has the best simulator" contest into a "who has the best logical decision theory" contest.
