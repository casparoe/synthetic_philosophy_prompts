      *   In the expression $0.5(2X) + 0.5(X/2)$, the $X$ in the first term denotes the smaller amount ($S$), and the $X$ in the second term denotes the larger amount ($L$). But $X$ is defined as "the amount in my envelope."
      *   Correct formulation: Let $S$ be the smaller amount. Envelopes are $(S, 2S)$.
