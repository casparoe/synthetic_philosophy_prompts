      *   Since $P(\text{hold } S) = P(\text{hold } 2S) = 1/2$ (unconditionally), $E[\text{other}] = 1.5S$. $E[\text{hold}] = 1.5S$. No gain.
      *   The paradoxical argument conditions on the *value* $X$ but treats the probability of being in the smaller/larger case as independent of $X$.
      *   The "Infinite Mean" resolution explains why the *conditional* argument ($E[\text{other}|X] > X$) can persist in specific pathological distributions, but the fundamental logical error is the treatment of $X$ as a constant in the expectation calculation while it varies across the two states of the world.
