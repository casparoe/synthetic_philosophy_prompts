      *   *Claim:* This is her diagnosis in different clothes. When expectation fails to converge, ordinary EV reasoning stops being trustworthy. The moral is that the switching argument relies on a probability structure (convergent expectations) that need not hold. She was too narrow tying it to impropriety rather than divergence.
