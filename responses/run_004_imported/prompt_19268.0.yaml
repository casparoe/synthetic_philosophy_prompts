answer: |-
  Good evening.

  There is a philosophical question that asks: What is actually valuable in this world? Some say it's pleasure, or virtue, or success. But the most compelling answer I know suggests that the greatest goods are specific states of mind: personal affection combined with the appreciation of something beautiful.

  But there is a catch. For that appreciation to be valuable, it has to be true. It must respond to qualities the object *actually* has, not qualities we merely wish it had.

  I tell you this because I know how Priya loves. When she designed her first bridge, she didn't just hope it would hold her parents' car. She spent a year inspecting every joint. To some, that might look like an audit. But Priya knows that trust isn't blind. Real regard demands that you see the thing as it truly is. She loves them too much to rely on sentiment. She relies on the steel.

  And I know how Jonah loves. He lends his books, but he writes in the margins first. He expects them back. This isn't possessiveness; it's a belief in continuity. He values the actual engagement of minds, not just the transaction of objects.

  Together, they form what philosophers might call an "organic unity." Their marriage isn't just Priya plus Jonah. It is a third thing, created by the combination, more valuable than the sum of its parts.

  Now, this brings us to us. To this room.

  If their love is truly good, it possesses what's called "intrinsic value." It would be just as valuable if they were the only two people on earth. It doesn't *need* us to exist. It doesn't need our applause to be real.

  So, why are we here?

  We are not here to validate their love. We are here to witness it. There is a difference. A candle burns in the dark whether we see it or not. But when we light a room full of mirrors, the light fills the space.

  We are the mirrors. We are here to reflect back to them the reality of what they have built, so they can see it clearly, too. Not to make it true, but to honor the truth that is already there.

  Priya, Jonah: May you always inspect the joints. May you always write in the margins. And may you always know that while you do not need us to love each other, you are deeply loved by us for doing it.

  To the couple.
