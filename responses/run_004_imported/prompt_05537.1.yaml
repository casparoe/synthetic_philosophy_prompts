answer: |-
  Here are ten interview questions designed for a philosophy of physics reading group podcast. They are structured to move from foundational conceptual distinctions to model-specific challenges, ending with the criterion of falsifiability. Each includes a follow-up tailored to anticipate the guest's likely "common cause" defense.

  ### 1. Determinism vs. Superdeterminism
  **Question:** You argue that superdeterminism is the natural stance for a realist who wants to save locality. However, Bohmian mechanics is a fully deterministic theory that reproduces quantum correlations without violating Measurement Independence; it simply accepts non-locality. This suggests that determinism *alone* does not entail superdeterminism. Superdeterminism seems to require a strictly stronger commitment: not just that the future is fixed, but that the hidden variables $\lambda$ are specifically correlated with measurement settings $a$ and $b$ to enforce locality. Why should we view this specific correlation constraint as physically motivated rather than an *ad hoc* restriction on the initial state space?

  *   **Follow-up:** You'll likely respond that Bohmian non-locality is the greater evil. But if we are comparing "action-at-a-distance" against "highly specific initial correlations," aren't we just trading one non-local-looking feature for another? How do you quantify the "cost" of the correlation constraint to show it is objectively cheaper than non-locality?

  ### 2. The Causal Graph
  **Question:** In standard causal modeling, violating Measurement Independence implies a causal path between the setting choice and the hidden variable, or a common cause in the past. If you posit a common cause in the distant past (e.g., the Big Bang) to explain the correlation between a lab setting today and a particle's spin, you are effectively claiming the causal structure of the universe forbids statistically independent subsystems. Doesn't this dissolve the distinction between distinct experimental apparatuses? If the photon source and the detector setting generator are not causally separable, how do you justify treating them as distinct variables in your own models?

  *   **Follow-up:** I anticipate you'll say they are distinct variables, just not *independent* variables. But if the value of one variable carries information about the other due to past boundary conditions, doesn't that undermine the method of isolation that allows us to identify local laws of motion in the first place?

  ### 3. The Fine-Tuning Objection (Required)
  **Question:** You often dismiss the "conspiracy" objection by noting that any correlation can be explained by a common cause if traced back far enough. However, the Bell correlations aren't just *any* correlation; they must precisely mimic the quantum mechanical $\cos^2(\theta)$ dependence regardless of how the settings are chosen (whether by human decision, pseudo-random number generator, or quasar light). This looks less like a generic common cause and more like extreme fine-tuning of the initial state to mask non-locality. How does your view explain why the initial conditions were "tuned" specifically to hide the underlying local dynamics from *us*, rather than resulting in some other statistical distribution?

  *   **Follow-up:** If you reply that "the initial conditions are just what they are," doesn't that render the theory immune to empirical criticism? If any deviation from QM can be blamed on a different initial configuration, and the actual configuration is fixed to match QM, what work is the physical law doing versus the boundary condition?

  ### 4. The "Undermining Science" Objection
  **Question:** A standard charge against superdeterminism is that it undermines scientific inference. If we cannot assume Measurement Independence, we cannot assume that our sample of tested systems is representative of the whole population. If the universe correlates our testing choices with the properties being tested, how can we ever validate a law of physics? Are we not forced into a skepticism where we can never distinguish a law of nature from a coincidence of our specific spacetime trajectory?

  *   **Follow-up:** You might argue that we assume independence in daily life and it works. But in Bell tests, we are specifically probing the limits of that assumption. If the assumption fails only in EPR scenarios, doesn't that require a *law* that says "conspire only when entanglement is present"? How is that law formulated without referencing the measurement context explicitly?

  ### 5. Concrete Models and 't Hooft (Required)
  **Question:** Let's turn to concrete implementations, such as Gerard 't Hooft's Cellular Automaton Interpretation. Does this model, or any other superdeterministic model you favor, yield independently testable predictions that diverge from standard quantum mechanics? Or does it merely provide a deterministic re-description of the quantum formalism after the fact? If it is empirically equivalent to QM in all accessible regimes, in what sense is it a physical theory rather than a metaphysical overlay?

  *   **Follow-up:** If you claim deviations exist only at the Planck scale, doesn't that push the theory permanently beyond empirical reach? How do you respond to the charge that a theory which reproduces QM exactly at all testable scales but claims to be "local" is functionally indistinguishable from a non-local theory that does the same?

  ### 6. Retrocausality vs. Superdeterminism
  **Question:** There is a growing interest in retrocausal models (like the Two-State Vector Formalism) which also violate Measurement Independence but allow the future setting to influence the past hidden variable. You reject retrocausality in favor of past-determined correlations. But mathematically, the violation of Statistical Independence looks identical in both cases. Is your preference for superdeterminism over retrocausality purely a philosophical commitment to the arrow of time, or is there a structural advantage in the superdeterministic approach that retrocausality lacks?

  *   **Follow-up:** If the advantage is merely preserving a "block universe" without backward causation, isn't that a cosmetic difference? If the correlation between $\lambda$ and $a$ is fixed, does it matter physically whether the constraint comes from the past boundary or a future boundary condition?

  ### 7. Thermodynamics and the Past Hypothesis
  **Question:** Superdeterminism relies heavily on special initial conditions. In cosmology, we already accept a "Past Hypothesis" to explain the low-entropy start of the universe. Do you view the superdeterministic correlations as part of this same Past Hypothesis? If so, does adding the Bell-correlation constraints to the initial state significantly reduce the phase space volume of allowable universes, and if so, does that make our universe statistically even more improbable than standard cosmology suggests?

  *   **Follow-up:** If you argue that the phase space reduction is negligible, how do you calculate that measure? Given that the correlations must hold for *all* possible measurement angles, the constraint seems highly restrictive. How do you quantify the "improbability" of a superdeterministic universe compared to a non-local one?

  ### 8. Effective Field Theory Status
  **Question:** In the context of Quantum Field Theory, locality is built into the commutation relations of fields at spacelike separation. If superdeterminism is true, these commutation relations must emerge from a deeper, non-statistically-independent layer. Have you or others worked out how a superdeterministic underlying model recovers the Standard Model as an effective field theory? Specifically, how do you prevent the "conspiracy" from leaking into high-energy scattering amplitudes where we don't see Bell-type violations?

  *   **Follow-up:** If the answer is that the conspiracy is "screened off" at high energies, doesn't that require a mechanism that effectively distinguishes between "measurement" interactions and "ordinary" interactions? How do you define that boundary without invoking an observer-dependent cut?

  ### 9. Probability and Typicality
  **Question:** In Bohmian mechanics, we use the Quantum Equilibrium Hypothesis ($\rho = |\psi|^2$) to recover QM probabilities, justified by arguments about typicality. Superdeterminism lacks an equivalent equilibrium hypothesis because the distribution of $\lambda$ depends on the settings. How do you ground probability in your view? Are quantum probabilities epistemic (reflecting our ignorance of the initial state) or ontic? If they are epistemic, how do you explain why our ignorance is always precisely calibrated to yield the Born Rule?

  *   **Follow-up:** If you say it's because the initial state *is* that way, we return to the fine-tuning worry. Is there a dynamical relaxation mechanism in superdeterminism analogous to Bohmian relaxation, or must the Born Rule be hardcoded into the Big Bang?

  ### 10. Falsifiability (Closing)
  **Question:** To close, I want to address the charge of unfalsifiability directly. Critics argue that because superdeterminism can explain any correlation by positing a suitable common cause in the past, it is compatible with any experimental outcome. Can you specify a concrete observation or experimental result that would count as evidence *against* superdeterminism? If Bell violations themselves are explained away by denying Measurement Independence, what data could possibly rule your view out?

  *   **Follow-up:** (No follow-up for the closing question, but be prepared for him to say "If we found a violation of the no-signaling theorem." If he says this, note that standard QM also respects no-signaling, so that wouldn't distinguish the views.)
