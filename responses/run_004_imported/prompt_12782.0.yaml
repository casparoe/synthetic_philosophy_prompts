answer: |-
  This is an excellent question, and the fact that you're asking it suggests you're already ahead of 90% of historical fiction writers. You have the facts right (the heresy, the alchemy, the secrecy), but your interpretation of the *psychological conflict* risks falling into a historiographical trap that scholars have been correcting for the last 40 years.

  Here is the sanity check you asked for, broken down by the historical reality versus the dramatic potential.

  ### 1. The Historiography: "The Last Magician" vs. The Unified Mind
  In 1936, economist John Maynard Keynes bought a trunk of Newton's private papers at auction. He was shocked to find they weren't math, but alchemy and heresy. Keynes famously declared Newton was **"not the first of the age of reason, but the last of the magicians."**

  For a long time, this fueled the "Two Newtons" theory: Dr. Jekyll (the rational physicist) and Mr. Hyde (the mystic alchemist).

  **However, modern Newton scholarship (led by historians like Richard Westfall, Rob Iliffe, and Stephen Snobelen) largely rejects this dichotomy.**
  To Newton, there was no conflict between alchemy, theology, and physics. They were a single, unified project.
  *   **Physics** described how God's creation moved (mechanically).
  *   **Alchemy** described the active spiritual forces *within* matter that caused that movement (the "vegetable spirit").
  *   **Theology** described the Master Architect who designed it all.

  Newton didn't think, *"Oh no, my alchemy contradicts my gravity."* He likely believed his alchemy *explained* gravity (action at a distance was considered "occult" by his contemporaries; Newton may have viewed it as an alchemical spiritual force).

  **The Verdict:** If you write him feeling that his mysticism undermines his rationality, you are projecting a 19th-century positivist view of science onto a 17th-century natural philosopher. In 1670, studying nature *was* an act of worship.

  ### 2. The Real Conflict: Orthodoxy vs. Truth
  You are correct that he hid these views, but not because he felt they were "crackpot." He hid them because they were **dangerous.**

  *   **The Heresy:** Newton was an Arian (or Socinian). He believed Jesus was subordinate to God the Father, not co-equal. In Restoration England, denying the Trinity was a crime. It would have cost him his fellowship at Trinity College, his income, and his social standing. He wasn't hiding from his own conscience; he was hiding from the Anglican Church and the university statutes.
  *   **The Alchemy:** While not illegal, it was viewed with suspicion. But more importantly, Newton was a perfectionist paranoid. He believed in the *prisca sapientia* (ancient wisdom). He thought he was recovering lost knowledge given to the ancients (like Moses or Solomon) and corrupted by the Church. He didn't publish much of anything in his life (including the *Principia*) because he hated controversy and criticism.

  **The Verdict:** The tension wasn't "Science vs. Magic." The tension was **"The Burden of Truth vs. The Fear of Persecution."** He believed he possessed the key to the universe (both physical and spiritual), but he lived in a world that would burn him for saying it out loud.

  ### 3. How to Fix the Arc (Without Losing the Drama)
  Your proposed scene (housemate catches him burning notes) is dramatic gold. You don't need to scrap it, but you should tweak the *motivation* to fit the man he actually was.

  **Don't write this:**
  > "I have to burn these because they are irrational superstitions that contradict my laws of motion. I am a fraud."

  **Write this instead:**
  > "I have to burn these because the world is not worthy of them. If they see this, they will call me a heretic and silence me before I can finish the work. I am protecting the truth from the vulgar."

  **The Emotional Engine:**
  Instead of a conflict between *Reason and Faith*, make the conflict about **Isolation and Pride.**
  *   Newton was famously solitary, difficult, and paranoid.
  *   The drama comes from his inability to trust anyone with the "Unified Theory" of his mind.
  *   He isn't hiding from himself; he is hiding from a world he considers intellectually and spiritually inferior.
  *   The tragedy is that in protecting his work, he isolates himself to the point of misery.

  ### 4. Specific Nuances for Your Novel
  If you want to impress the readers who know the history, keep these three points in mind:

  1.  **God is the Glue:** For Newton, a universe without God was a dead clock. He fought *against* the idea of a purely mechanistic universe (which is why he later clashed with Leibniz). He needed God to be actively involved to keep the planets stable. Your Newton should pray *more* when he is doing math, not less.
  2.  **The "Vulgar":** Newton had a distinct class/intellectual snobbery. He distinguished between the "Vulgar" (the masses, the orthodox clergy) and the "Initiated" (those who could understand the true ancient wisdom). His secrecy was elitist, not shameful.
  3.  **The Timeline:** You mentioned he is young (at Cambridge). In the 1660s/70s, his alchemical work was actually at its peak (the "Praxis" period). He wasn't yet the public hero of the *Principia* (1687). At this stage, he is likely more obsessed with the "Green Lion" (antimony) than gravity. The conflict is that he hasn't yet synthesized them in his head. You can dramatize the *struggle to unify them*, rather than the *shame of having them.*

  ### Recommended Reading for the "Vibe"
  Since you are deep in the rabbit hole, two specific resources will help you nail the voice:
  *   **"Never at Rest" by Richard Westfall:** The definitive biography. It treats his alchemy and theology with the same seriousness as his physics.
  *   **"Newton: The Making of a Genius" by Patricia Fara:** Good for the cultural context of Cambridge at the time.
  *   **Rob Iliffe's "Priest of Nature":** This is the most recent major scholarship on his religion. It explicitly argues against the "secret sinner" narrative and frames it as "private devotion."

  ### Summary
  You are onto something true (the secrecy, the dual interests), but the *nature* of the conflict is anachronistic.
  *   **Modern View:** Science and Religion are enemies.
  *   **Newton's View:** True Science and True Religion are the same thing; the Enemy is the Corrupt Church and the Ignorant Public.

  If you pivot the conflict from **Self-Doubt** to **Paranoid Protectionism**, you will have a character who is historically defensible and arguably even more compelling. A man who believes he holds the mind of God and trusts no one else to touch it is a fascinating protagonist.

  Keep writing. Just let Newton be the arrogant, pious, alchemical genius he was, rather than the modern secular scientist he wasn't.
