      *   *Validation Therapy Nuance:* If the caregiver says, "You miss him very much," that is true. If they say, "He'll be here soon," that is a lie.
      *   *The "Mental Reservation" problem:* Augustine generally rejects equivocation if the intent is to induce false belief. However, he allows keeping silent.
