      *   *Check:* The hierarchy. The prompt says "lies told merely to protect someone's bodily chastity (the least grave)." The dementia case is about emotional distress. Augustine usually groups "helpful lies" together. I should be precise: it's an *officiosum mendacium*.
      *   *Check:* The "Sick Person" example. The prompt mentions Augustine rejects lying to the sick. I must emphasize this parallel. It's almost the exact same case (distress vs. truth).
      *   *Tone:* Academic, respectful, rigorous, matching the user's level (graduate seminar instructor).

  8.  **Drafting the Response:** (Mental Outline)
      *   Start by affirming the colleague's insight but grounding it in Augustine's text.
