  2.  **Deconstruct Augustine's Position (*De Mendacio* & *Contra Mendacium*):**
      *   **Definition of a Lie:** *Enuntiatio cum falsa voluntate* (an assertion with a false will/intent). It requires:
          1.  Falsehood in the statement (objective).
          2.  Knowledge of the falsehood by the speaker (subjective).
          3.  Intention to deceive (*voluntas fallendi*).
      *   **Absolute Prohibition:** No lie is venial in the sense of being permissible. All lies are sins, though gravity varies.
      *   **The 8 Categories (roughly):**
          1.  Religious doctrine (worst).
          2.  Lies that help no one and hurt someone.
          3.  Lies that help one and hurt another.
          4.  Lies told for the pleasure of lying.
          5.  Lies told to please others (officious).
          6.  Lies that help one and hurt no one.
          7.  Lies that help one and hurt no one (protecting purity/chastity).
          8.  Lies that protect someone from bodily defilement (least grave).
          *Note: The prompt summarizes the hierarchy slightly differently (doctrine to chastity), but the core is: Religious > Harmful > Officious/Helpful.* The dementia case falls under "helpful/officious" (protecting from emotional distress).
      *   **The "Sick Person" Case:** Augustine explicitly rejects lying to a sick person to spare them distress, arguing it damages the soul (the liar's) to save the body/feelings of another.
      *   **The *Imago Dei*:** Truth is ontological. God is Truth. Lying distorts the sign (speech) away from the thing (reality) and the mind (intent), breaking the communion of rational souls.

  3.  **Address Question 1 & 2: Ruling and Hierarchy:**
