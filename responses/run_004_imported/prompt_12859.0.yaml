prompt: |-
  So I've been down a Tolstoy rabbit hole for a novel I'm drafting -- my narrator is a novelist having a slow-motion crisis about whether her books actually mean anything -- and the thing that keeps nagging me is how in What Is Art? Tolstoy actually throws War and Peace and Anna Karenina under the bus, lumping them in with Shakespeare and Wagner as "bad art" and keeping almost none of his own fiction except two little stories. Write me an essay that gets into the actual mechanics of how he gets there: the infection idea, the individuality/clarity/sincerity test for how strong that infection is, and the seperate "goodness" test about whether the feeling being spread unites people across class lines rather than just entertaining the rich. Weigh whether that machinery really earns him the right to disown his own masterpieces, or whether its just dressing up a conclusion his religious conversion had already handed him. Don't hedge at the end -- say straight out whether you think he was onto something real or whether the theory collapses under its own weight, and why.
