  2.  **Debate 1: Tariffs & Trade Deficits:**
      *   *Hume's Core Argument:* The Price-Specie-Flow Mechanism.
      *   *Source:* "Of the Balance of Trade."
      *   *Logic:* If a country has a trade deficit, gold/silver (specie) flows out. This reduces the money supply domestically, lowering prices/wages. Lower prices make exports more competitive and imports less attractive. The balance corrects itself naturally. Therefore, worrying about a deficit is unnecessary; the market self-corrects.
      *   *Mercantilism:* Hume hates the "jealousy of trade" (the idea that a neighbor's gain is my loss). He argues trade is mutually beneficial ("Of the Jealousy of Trade"). Prosperity of neighbors increases demand for your goods.
      *   *Modern Friction:* Hume assumes money = specie (gold/silver). Modern money is fiat/credit. Central banks manage money supply, preventing the deflationary pressure Hume relied on for self-correction. Exchange rates float, absorbing shocks rather than price levels alone.
      *   *Character's Take:* She would scoff at the idea that a trade deficit is a "loss." She'd call tariffs a futile attempt to stop a natural water level.

  3.  **Debate 2: Sovereign Debt:**
      *   *Hume's Core Argument:* Public Credit is dangerous.
      *   *Source:* "Of Public Credit."
      *   *Logic:* High debt leads to high taxes. High taxes crush industry and drive wealth abroad. It transfers wealth from industrious subjects to idle creditors (rentiers). It weakens the state in war (either bankruptcy or tyranny). He famously says, "The state must die of the disease, or the disease must die of the state."
      *   *Modern Friction:* Hume didn't anticipate fiat currency where debt can be monetized (though he feared inflation). He didn't see the depth of global capital markets where debt can be rolled over indefinitely. He assumed debt *must* be paid in specie eventually. Modern MMT or Keynesian stimulus logic would be alien to him.
      *   *Character's Take:* She would be grimly vindicated. The post-2008 debt explosion confirms his fears about mortgaging the future. She'd worry about the intergenerational transfer and the power of creditors.

