      *   **Ramsey's Ethical Claim:** $\delta$ should be 0 (or near 0). We shouldn't value 2024 lives more than 2124 lives *just* because of the date.
      *   **Stern's Choice:** Stern set $\delta = 0.1\%$ (very low, effectively zero for ethical purposes, accounting for existential risk).
      *   **Why is $r$ still 1.4%?** Because of the $\eta \cdot g$ part.
      *   **The Logic of $\eta \cdot g$:** If future generations are richer than us (due to economic growth), an extra dollar is worth *less* to them than to us (diminishing marginal utility). Therefore, we don't need to sacrifice as much today to help them, because they will be better equipped to handle it. This isn't about *time*; it's about *wealth*.

