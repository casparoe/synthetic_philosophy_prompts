answer: |-
  This is an incredibly sharp observation, and you have hit on one of the most famous and nuanced debates in environmental economics. Your intuition is actually correct on the ethics, but the economics has a second layer that explains why Stern didn't just set the rate to 0%.

  You are absolutely right that Frank Ramsey (a brilliant mathematician and economist from the 1920s) argued that **pure time preference** ($\delta$) is ethically indefensible. He believed it is discriminatory to value a human life in 2100 less than a human life in 2024 simply because of the date on the calendar.

  The Stern Review (2006) agreed with Ramsey on this. In fact, that is exactly what made the Stern Review so "progressive" and controversial compared to previous models.

  However, the reason Stern still used a positive discount rate (around 1.4%) rather than 0% comes down to the difference between **discounting time** and **discounting wealth.**

  Here is the breakdown of why that 1.4% isn't a contradiction.

  ### 1. The Ramsey Equation
  To understand this, you have to look at the formula economists use to determine the social discount rate ($r$). It is called the Ramsey Equation:

  $$r = \delta + (\eta \times g)$$

  *   **$r$**: The Social Discount Rate (the number used in the cost-benefit analysis).
  *   **$\delta$ (delta)**: The **Pure Rate of Time Preference**. This is the ethical part. It asks: "Do we value future wellbeing less just because it is in the future?"
  *   **$\eta$ (eta)**: The **Elasticity of Marginal Utility**. This measures how much less we value an extra dollar as we get richer. (If you are starving, \$100 is life-saving. If you are a billionaire, \$100 is nothing.)
  *   **$g$**: The expected **Growth Rate** of the economy (per capita consumption).

  ### 2. Where Stern Agreed with Ramsey ($\delta$)
  On the ethical component ($\delta$), Stern basically went to zero. He set $\delta$ at **0.1%**.

  He didn't set it to exactly 0% only because there is a tiny, non-zero probability that humanity might go extinct naturally (asteroid, etc.) before the future arrives. But ethically, he asserted that future generations count equally. This was a huge departure from previous economists (like William Nordhaus) who used a $\delta$ of around 3% or more, which effectively wrote off the future.

  So, on your specific point about "valuing future generations less just because they're later in time," Stern agreed with you: **That rate should be near zero.**

  ### 3. Where the 1.4% Comes From ($\eta \times g$)
  If $\delta$ is 0.1%, why is the total rate $r$ around 1.4%? The rest comes from the **wealth effect** ($\eta \times g$).

  The logic here is **not** that future people matter less. The logic is that **future people will likely be richer than us.**

  Standard economic theory assumes that despite climate change, technological progress will continue, and future generations will have higher GDP per capita than we do today.
  *   If your grandchild is a millionaire and you are struggling, \$1,000 means more to *you* than it does to *them*.
  *   This is called **Diminishing Marginal Utility of Consumption.**

  Stern argued that if we sacrifice \$100 today to prevent climate damage, that is a significant cost to us. But if we *don't* act, the damage in 2100 will cost future people \$100. However, because future people are expected to be richer, that \$100 loss will hurt them *less* than \$100 hurts us today.

  Therefore, the discount rate isn't saying "their lives matter less." It is saying "a dollar of cost matters less to them because they will be wealthier."

  ### 4. Why 1.4% is still "Progressive"
  To see why Stern is considered the "good guy" report in this context, you have to compare it to the alternative.

  *   **Standard Market Discount Rate:** Often 3% to 6%. At 6%, damages happening 100 years from now are almost worthless in today's calculation. It justifies doing almost nothing today.
  *   **Stern Discount Rate:** 1.4%. This is extremely low. By keeping the rate this low, Stern's model concluded that we should spend a lot of money **right now** (up to 2% of global GDP) to mitigate climate change.

  If Stern had used a 0% discount rate literally, the economic model would have demanded even *more* extreme sacrifice today, potentially to the point of halting economic growth entirely, which some economists argued would be counterproductive.

  ### 5. The Critical Flaw (Where your intuition wins again)
  There is a massive caveat to Stern's logic, and it validates your skepticism.

  The "wealth effect" argument ($\eta \times g$) only works if the future is actually **richer** ($g$ is positive).

  If climate change is catastrophic, it could destroy economic growth. If the world in 2100 is poorer, war-torn, and resource-scarce because we didn't act, then $g$ could be negative. If $g$ is negative, the math flips: **Future dollars would be worth *more* than present dollars.**

  Some critics argued that by assuming positive growth ($g$) to justify the 1.4% rate, Stern was assuming climate change wouldn't be *too* bad. If climate change is existential, the discount rate should drop even lower, or go negative, implying we should sacrifice almost anything to save them.

  ### Summary
  You aren't wrong to feel it's contradictory, but technically Stern is distinguishing between two things:
  1.  **Valuing Human Wellbeing:** Stern says future wellbeing counts equally ($\delta \approx 0$).
  2.  **Valuing Economic Costs:** Stern says future costs count less *only if* future people are richer ($\eta \times g > 0$).

  The 1.4% is not a "time penalty"; it is a "wealth adjustment." However, your instinct that this is ethically tricky is shared by many philosophers. If climate change makes the future poorer, that adjustment becomes immoral, and the discount rate should indeed be lower.

  **For your APES class:** The key takeaway is that Stern used a **low** discount rate to justify **strong** immediate action, whereas other models use **high** discount rates to justify **delaying** action. The 1.4% is low *relative to standard economics*, even if it isn't literally zero.
