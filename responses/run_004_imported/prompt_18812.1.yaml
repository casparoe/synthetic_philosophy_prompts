answer: |-
  Good evening.

  As a novelist, I spend my life thinking about plot structures. Most love stories are linear: a meeting, a conflict, a resolution. But [Groom] and [Bride]'s story is different. It's a story about time. Eleven years of it.

  For over a decade, we watched them navigate a very specific kind of geography. They would find each other, and the world made sense. Then, they would drift apart, seeking something else, something freer or perhaps just different. And then, inevitably, they would find their way back to the start.

  To the rest of us, that looked like turbulence. It looked like the messy, painful work of two people growing into the shape of each other. We saw the heartbreak. We saw the joy. We saw them pay a price in time and tears for every detour.

  But there is a logic to love that is stricter than romance. In any complex system, if you allow preferences to cycle—if you allow yourself to trade certainty for freedom, and then trade freedom back for certainty, over and over—you incur a cost. You bleed value. You end up exactly where you began, but poorer than when you started.

  For eleven years, they lived inside that loop. They tested the variables. They proved, through exhaustion, that the grass was never greener on the other side, because the other side always led back here.

  But a loop only becomes a spiral when you refuse to step off. A cycle only breaks when you make a choice that makes reversing it impossible.

  That is what today is. This isn't just a celebration of affection. It is a binding constraint. It is the moment you look at the uncertainty of the future and say, "No more trades. No more re-evaluations. No more arbitrage of the heart."

  By making this vow, you are removing the option to cycle. You are making the cost of leaving so high that the only rational choice, forever, is each other. You are turning a volatile market into a stable equilibrium.

  [Groom's Sister], I know you understand that a promise is only as good as the mechanism that enforces it. But for the rest of us, we just understand that a promise is a kind of magic. It takes the chaos of eleven years and straightens it into a line that extends into the future.

  So, let's raise a glass. To the end of the cycle. To the closure of the loop. To the understanding that the only way to stop paying the cost of uncertainty is to invest everything in the certainty of us.

  To [Groom] and [Bride]. May your preferences remain transitive, your costs be low, and your love be the one variable that never fluctuates.

  Cheers.

  ***

  ### Notes on the Double-Coding

  For your confidence in delivering this, here is how the layers work:

  **For the General Audience:**
  *   **"Turbulence," "Messy, painful work," "Heartbreak":** Frames the 11 years as emotional growth.
  *   **"The grass was never greener":** A common idiom about realizing what you have is best.
  *   **"Binding constraint," "No more trades":** Sounds like poetic dedication and fidelity.
  *   **"Invest everything in the certainty of us":** Standard romantic rhetoric about commitment.

  **For the Sister (Decision Theorist):**
  *   **"Preferences to cycle":** Direct reference to cyclic preferences ($A \succ B \succ C \succ A$), the prerequisite for a money pump.
  *   **"Trade certainty for freedom... back for certainty":** Describes the specific trades that constitute the pump.
  *   **"End up exactly where you began, but poorer":** The definition of being money-pumped (dominated strategy).
  *   **"Binding constraint" / "Makes reversing it impossible":** References the *commitment device* solution to dynamic inconsistency. To stop a money pump, an agent must bind their future self to prevent the preference reversal.
  *   **"Stable equilibrium":** Game theory terminology for a state where no player has an incentive to deviate.
  *   **"May your preferences remain transitive":** The specific mathematical condition ($A \succ B$ and $B \succ C \implies A \succ C$) that prevents money pumps from existing in the first place. This is the "wink" line.
