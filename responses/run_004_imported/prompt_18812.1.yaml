      *   *Key elements:*
          1.  Cyclical preferences (wanting to be together, then apart, then together).
          2.  Cost incurred with each cycle (time, emotional energy, "money").
          3.  Rationality failure (dynamic inconsistency).
          4.  The Solution: A commitment device (binding oneself to a choice to prevent future cycling).
      *   *Application to the Couple:*
          *   Preference A: Being together.
          *   Preference B: Being apart/freedom.
          *   Cycle: Together $\to$ Breakup $\to$ Reconcile $\to$ Together.
          *   Cost: 11 years of emotional turbulence.
          *   Resolution: Marriage (a binding contract/commitment device) that makes reversing the preference too costly or impossible, thus stabilizing the system.

