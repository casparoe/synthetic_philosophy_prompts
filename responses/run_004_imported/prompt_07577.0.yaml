      *   **Deep Dive into Person-Affecting Views:** Explain the Non-Identity Problem and the asymmetry issues.
      *   **The Impossibility Theorem:** Introduce Arrhenius's work to show this is a mathematical/logical impossibility, not just a lack of imagination.
      *   **Conclusion:** Summarize that population ethics is hard because our intuitions conflict, not because philosophers haven't thought of AU/PAV.

