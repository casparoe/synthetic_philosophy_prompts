answer: |-
  You have hit on the exact starting point that Derek Parfit began with in *Reasons and Persons* (1984). Your intuition is correct: **Total Utilitarianism (TU)** is indeed the specific axiology that generates the Repugnant Conclusion. It is also true that **Average Utilitarianism (AU)** and **Person-Affecting Views (PAV)** successfully avoid the Repugnant Conclusion in its standard form.

  So, why hasn't philosophy "solved" this by simply switching to one of those alternatives?

  The short answer is that in population ethics, there is no free lunch. While AU and PAV avoid the Repugnant Conclusion, they each generate their own conclusions that are, to many philosophers, equally counterintuitive or morally unacceptable. In fact, recent formal work suggests that this isn't just a matter of finding the right theory, but rather a structural impossibility.

  Here is a breakdown of why philosophers consider AU and PAV inadequate solutions, and why the field remains unresolved.

  ### 1. The Problems with Average Utilitarianism
  Average Utilitarianism suggests we should maximize the *average* welfare per person rather than the *total* sum. While this stops us from preferring a massive population of barely-happy lives over a smaller population of very happy lives, it introduces new absurdities.

  *   **The "Mere Addition" Problem:** Imagine a world with 1 million people who are extremely happy (utility 100). Now imagine adding 1 million *new* people who are also very happy, but slightly less so (utility 90).
      *   **Intuition:** Most people feel that adding happy people who have lives worth living is a good thing, or at least not a *bad* thing.
      *   **AU Verdict:** Because the new people are below the average, their addition lowers the global average. Therefore, AU implies that adding these happy people makes the world **worse**.
  *   **The "One Happy Person" Problem:** If you strictly maximize average utility, a world containing a single person experiencing the maximum possible ecstasy is better than a world containing billions of people who are extremely happy, provided the single person is even marginally happier than the billions.
  *   **The "Kill the Below-Average" Implication:** If average utility is the only metric, then the existence of people whose happiness is below the current average drags the score down. In its strictest form, AU could imply that it would be better if people with "below average" (but still positive) lives had never been born, or even that we should eliminate them to raise the average. This violates the basic intuition that a life worth living is a good thing, regardless of whether it is "above average."

  ### 2. The Problems with Person-Affecting Views
  Person-Affecting Views (often summarized by the slogan: "We should make people happy, not make happy people") claim that an outcome can only be better or worse if it is better or worse *for someone*.

  *   **The Non-Identity Problem:** This is the biggest hurdle for PAV. Consider a policy choice regarding climate change or nuclear waste.
      *   **Scenario A:** We adopt a risky policy. In 200 years, the world is difficult, but the people living there still have lives worth living.
      *   **Scenario B:** We adopt a safe policy. In 200 years, the world is prosperous.
      *   **The Catch:** Because social policies change the course of history, they change who meets whom and when children are conceived. The specific people who exist in Scenario A would *not exist* in Scenario B.
      *   **PAV Verdict:** Since the people in Scenario A have lives worth living, they are not harmed by being created (they wouldn't exist otherwise). Since the people in Scenario B are different people, we haven't harmed them either. PAV struggles to explain why Scenario A is wrong, because there is no specific person for whom the risky policy is *worse* than the safe policy.
      *   **Intuition:** Most people feel it is clearly wrong to choose the risky policy that leaves future generations in a depleted world, even if those specific individuals wouldn't exist otherwise.
  *   **The Asymmetry Problem:** PAV handles the intuition that we shouldn't create suffering people well. However, it struggles to explain why we *should* create happy people. If "making happy people" isn't a moral goal, PAV implies there is no moral reason to ensure humanity continues to exist, provided the current generation is satisfied.

  ### 3. The Impossibility Theorems
  Perhaps the strongest reason philosophers treat this as unresolved is the work of **Gustaf Arrhenius**. Over the last two decades, Arrhenius has developed a series of **Impossibility Theorems** in population ethics.

  Using formal logic, Arrhenius demonstrated that no population axiology can satisfy a set of very weak, highly plausible adequacy conditions simultaneously. For example, it is mathematically impossible to find a theory that satisfies all of the following at once:
  1.  **The Repugnant Conclusion is false.**
  2.  **Adding happy lives is not bad** (avoiding the AU problem).
  3.  **Equality is good** (ceteris paribus).
  4.  **Avoiding suffering is prioritized.**

  What this means is that the problem is not that philosophers haven't thought of Average Utilitarianism or Person-Affecting Views. It is that **every possible theory violates at least one strong moral intuition.**

  ### 4. Why the Field Remains Active
  Philosophers continue to work on this because population ethics is not just an academic puzzle; it has real-world stakes.
  *   **Climate Change:** How do we weigh the costs to the current generation against the benefits to future generations?
  *   **Existential Risk:** Is it important to ensure humanity survives for millions of years (Total View), or does it only matter how well the current generation lives (Person-Affecting)?
  *   **Reproductive Technology:** As genetic selection and IVF become more common, questions about "who to bring into existence" are moving from theory to practice.

  ### Summary
  You are right that switching to Average Utilitarianism or Person-Affecting Views dissolves the Repugnant Conclusion. However, philosophers reject them as "solutions" because they purchase that victory at the cost of accepting other conclusions (like "adding happy people is bad" or "harming future generations is impossible") that are arguably just as repugnant.

  The consensus in the field is not that we haven't found the answer, but that **our moral intuitions regarding population are inconsistent.** We want a theory that says:
  1.  More happy people is good.
  2.  Higher quality of life is better than lower quality.
  3.  We shouldn't create miserable people.

  Formal proofs suggest you can only pick two. Until we decide which intuition to discard, the problem remains unresolved.
