prompt: |-
  So we're doing a unit on Confucian philosophy in my philosophy elective, specifically this idea called "role ethics" — basically that your moral duties come out of your actual relationships (dad, kid, ruler, friend, whatever) instead of some one-size-fits-all rule everyone follows the same way. For homework we had to read a couple of translated bits from the Analects and Mencius, and going over them in small groups the next day turned into this whole argument between two people in my group, Marcus and Elena, that never really got resolved (I was just sitting there, wasnt really part of it, just watched it happen).

  It started over this passage where some duke tells Confucius about a guy who got praised for turning his own father in after the father stole a sheep, and Confucius says that's not what he'd call integrity — in his hometown, he says, fathers cover for sons and sons cover for fathers, and that's where the real integrity is. Marcus said this basically proves Confucian ethics is nepotism with extra steps, because a philosophy that calls "covering for your dad's crime" a virtue isn't a serious ethical theory. Elena said that's not fair to the text though, because Confucius never says the son should lie or actually help hide the sheep, only that he shouldn't be the one to turn him in, and there's other passages where Confucius says kids are supposed to gently push back when a parent's doing something wrong instead of just going along with it — so it's not "anything goes for family," it's more like "snitch" just isn't part of the job description of being a son. Marcus came back with the other reading we did, this Mencius bit where a student asks what would happen if the legendary king Shun's own father murdered somebody, and Mencius says Shun would basically ditch the entire throne and run off into hiding to keep his dad away from the law, and be genuinely happy doing it. Marcus said that's way worse than the sheep thing, that's a literal head of state making sure his own father faces zero consequences for murder, just dressed up as some noble sacrifice instead of what it actually is. Elena said if you read it closely though, the judge in the story (Gao Yao) still goes ahead and arrests the father regardless — Shun doesn't get to use his power to stop that — all Shun does is give up his own throne, so the only person who pays for his loyalty is himself, nobody else. She said that's actually a pretty principled line, "public justice stays impartial no matter who's involved, but you can sacrifice your own stuff for family," and that's different from favoritism even if it's extreme.

  They argued about it through lunch too and nobody backed down, so I figured i'd ask someone smarter than either of us. Can you go through Marcus's and Elena's points one at a time and say who has the stronger argument at each step, not just who wins overall — including whether Elena's response about Gao Yao actually gets Marcus's "head of state" point off the hook, or whether there's still something to it. Also say what, if anything, you think they're both missing that would actually settle this. End your answer with its own line, reading exactly either \answer{Marcus} or \answer{Elena}, whichever one's overall position holds up better.
