      *   *Q1: Are the last two sentences distinct objections?* Yes, technically. One is the Flicker Defense (there *were* alternatives). The other is the Question-Begging/Determinism Defense (the case *presupposes* incompatibilism is false). However, the second sentence is phrased awkwardly.
