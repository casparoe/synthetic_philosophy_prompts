answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've known Priya for years, and I have the distinct honor of standing here today, despite the fact that last Tuesday, I nearly got uninvited from this wedding over a theoretical disagreement.

  We were having dinner, and I made the innocent comment that Priya and Dev are "happier together than they were apart."

  Priya put down her fork, looked me in the eye, and told me that was a category error. For those of you in the family who aren't economists, basically, Priya believes you cannot measure happiness in units. You can't compare Priya's joy to Dev's joy. And you certainly can't add them together like they're scores in a video game. To Priya, saying "you complete each other" is mathematically unsound.

  So, I have spent the last week consulting with her PhD friends in the back row to ensure this toast is compliant. I am operating under strict Robbinsian constraints. I cannot tell you that their love is "big." I cannot tell you that they are "better off" now than before. And I absolutely cannot say they are "more than the sum of their parts."

  However, as an economist, Priya does believe in *Revealed Preference*.

  We don't need to measure internal states to know what's going on here. We just need to look at the data. And the data is overwhelming.

  Priya, you have revealed, through a series of costly investments and binding commitments, that Dev is your top-ranked option among all available alternatives. Dev, you have done the exact same. In a world of infinite choices and scarce time, you have both allocated your entire future budget to this specific partnership.

  That is not a measurement of utility. That is an observation of choice. And it is the most robust data point I know.

  To the family: What this means, in plain English, is that they didn't have to choose each other. There was no law of physics that forced this. But they looked at the menu of life, and they both ordered the exact same thing.

  To the econ PhDs in the back: I am not claiming a Pareto improvement across time. I am simply noting that at time *t*-now, the contract is signed voluntarily by both parties with full information.

  And that is actually more romantic than anything I could have said originally. Because it means their love isn't a feeling that can be weighed or measured. It's an action. It's a decision they make every single day.

  Priya, you don't have to worry. I won't say your lives are "happier" now. But I will say that your indifference curves are finally tangent. Dev, you've found your comparative advantage. And together, you are entering a long-term joint venture with excellent projected stability.

  So, if everyone could please raise a glass.

  To Priya and Dev. May your preferences remain consistent, your transaction costs remain low, and may you continue to reveal, every day, that you are each other's optimal bundle.

  To Priya and Dev!
