      *   *Refining the Hume/Miracle point:* Be careful not to say Hume thinks miracles are *impossible* metaphysically. He argues they are unbelievable evidentially. Ghazali argues they are possible metaphysically and believable if reported by trustworthy prophets.
      *   *Refining the Ghazali point:* Emphasize *Adah* (habit/custom) of God.
      *   *Refining the "Medieval Hume" label:* It's a useful heuristic but ultimately misleading if taken literally.

