prompt: |-
  My aunt Miriam, a philosopher of mind who spent the better part of thirty years defending illusionism about phenomenal consciousness, died two weeks ago, and I've been asked to deliver the eulogy at her memorial service this coming Sunday. She held what Keith Frankish, who coined the distinction, calls "strong" illusionism, the harder-line descendant of Dennett's older attacks on qualia: not the more cautious view that some deflated phenomenal property survives introspection's distortions, but the claim that there is no phenomenal "something it is like" underneath our self-models at all, just a representational system that models itself as though it had one. She was adamant, though, that this was not eliminativism about the mind in any cheap sense: she thought grief, memory, preference, and attention were all completely real, and she got visibly irritated with colleagues (and with me) whenever they heard "illusionism" and assumed she must think nothing really matters, or that she considered herself a zombie. Two nights before she died, half-joking, she made me promise that nobody would stand up at her funeral and talk about her "inner light going out," or claim that some ineffable spark of "what it was like to be Miriam" would live on in our memories -- because, as she put it, that would smuggle back in, on her own funeral day, exactly the picture of consciousness she had spent her career arguing was a cognitive illusion. (She used to make the same point in long comment-section arguments I read as a teenager, which is a fair amount of why I've spent the years since as a fairly devoted lurker on Less Wrong and the old Slate Star Codex threads.)

  The room on Sunday will be mostly family and old friends with no philosophical background who just want to grieve a warm, funny, exacting woman, but four or five people from her department are coming too, including the qualia realist she sparred with happily for two decades and plainly adored arguing with. I'd like the eulogy to actually honor her position rather than sand it down into generic materialism, while still functioning as a eulogy and not a seminar: it needs to let people cry and laugh and feel the size of what's gone, without either quietly contradicting something she considered a serious philosophical error, or spending its first ten minutes throat-clearing about the hard problem in a way that strands everyone who isn't already fluent in it. Could you write it?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Aunt Miriam, a philosopher of mind.
      *   **Philosophical Stance:** Strong Illusionism about phenomenal consciousness (Keith Frankish's term). She believed there is no "what it is like" (qualia), only a representational system modeling itself as having one. She rejected eliminativism about mental states (grief, memory, etc., are real).
      *   **Specific Constraint:** She made the narrator promise *not* to talk about her "inner light going out" or an ineffable spark living on. This would contradict her life's work.
      *   **Audience:** Mixed. Mostly family/friends (non-philosophers) who want to grieve a warm, funny woman. A few colleagues (including a friendly rival/qualia realist).
      *   **Goal:** Honor her position without turning the eulogy into a lecture. Allow for grief and laughter. Avoid contradicting her philosophy, but also avoid alienating non-philosophers.
      *   **Tone:** Warm, exacting, funny, respectful, philosophically accurate but accessible.

  2.  **Deconstruct the Philosophical Challenge:**
      *   *The Trap:* Standard eulogies rely heavily on phenomenology ("She felt love," "Her spirit lives on," "We feel her presence"). Miriam explicitly rejected the reality of "feeling" in the qualia sense.
      *   *The Solution:* Focus on *functional* and *relational* reality. Illusionism isn't nihilism. Grief is real *as a process*. Memories are real *as records*. Love is real *as a commitment and behavior*.
      *   *Key Distinction:* Don't say "She isn't feeling anything now" (too cold/eliminativist). Do say "The story she told about herself is now in us." Focus on the *model* of Miriam that exists in the minds of those who knew her.
      *   *The Rival:* Acknowledge the friendly debate. It shows she was engaged and loved the discourse.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Set the scene. Introduce Miriam not just as an aunt, but as a thinker.
      *   **Addressing the Philosophy (The Elephant in the Room):** Needs to be done early but gently. Acknowledge her specific request (no "inner light"). Frame it as her final act of intellectual honesty.
      *   **Reframing Grief/Love:** How do we miss someone if "qualia" aren't real? We miss the *interactions*, the *patterns*, the *impact*. Her mind was a complex system that shaped ours. That shaping remains.
      *   **Personal Anecdotes:** Need to show her warmth and exacting nature. The prompt mentions she was "warm, funny, exacting." Need to illustrate this. Maybe a story about her correcting someone lovingly.
      *   **The Colleagues/Rival:** Acknowledge the debate. It was a form of intimacy for her.
      *   **Closing:** Bring it back to the promise. How do we say goodbye without the "spark" language? We carry the *structure* of her thought.

  4.  **Navigating the "No Qualia" Constraint in Eulogy Language:**
      *   *Avoid:* "Her spirit," "Inner light," "What it was like," "She feels," "Soul," "Essence."
      *   *Use:* "Her voice," "Her arguments," "The way she thought," "The impact she made," "The model of her we hold," "Her legacy," "The truth she sought."
      *   *Crucial Nuance:* Illusionism says the *experience* is an illusion, not the *person* or the *behavior*. So, "Miriam was real" is a true statement. "Miriam's love was real" is true (as a functional state). "Miriam's *feeling* of love" is the tricky part. Better to focus on "Miriam's loving actions" or "Miriam's commitment."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Miriam was my aunt. She studied consciousness. She didn't believe in qualia. She told me not to say her light went out. So I won't. But she loved us. She argued with Dave from her department. She was funny. We will miss her. The end.
      *Critique:* Too dry. Too much like a seminar. Needs heart.

  6.  **Drafting - Iteration 2 (Adding Heart & Philosophy):**
      Miriam spent 30 years saying consciousness is a user-illusion. She wasn't saying nothing matters. She said *we* matter. She made me promise no "inner light" talk. It's hard to eulogize someone who says there's no "inner" to speak of. But I knew her. She laughed. She argued. The rival in the room knows she loved the fight. We don't need a soul to miss someone. We just need the memory of who she was.
      *Critique:* Better. But needs to flow more poetically. The transition from "no inner light" to "we still grieve" needs to be smoother.

  7.  **Drafting - Iteration 3 (Refining the Voice):**
      Start with the promise. It's a strong hook. "Miriam made me promise..." Then explain *why* without jargon. She wanted truth, even now. Then pivot to what *is* real. Her arguments, her kindness, her influence. The "Miriam-shaped hole" in our lives. Acknowledge the rival (let's call him "David" or just "her longtime sparring partner"). End with the idea that the *story* continues.

  8.  **Polishing the Philosophical Accuracy:**
      *   Ensure I don't accidentally slip into dualism.
      *   Instead of "Her memory lives on," say "Our memories of her are real states in our brains." (Maybe too technical).
      *   Better: "The impression she made on us is physical, real, and lasting."
      *   Focus on the *user interface* metaphor. She was the interface we interacted with. That interface was genuine, even if the "ghost in the machine" wasn't there.
      *   Actually, simpler is better for a eulogy. Focus on *truth*. She valued truth over comfort.

  9.  **Final Review against Constraints:**
      *   No "inner light"? Checked.
      *   No "what it was like"? Checked.
      *   Honors illusionism? Yes.
      *   Accessible to family? Yes, by explaining the philosophy through her character (honesty, exacting).
      *   Acknowledges colleagues? Yes.
      *   Emotional resonance? Aiming for "bittersweet truth" rather than "mystical comfort."

  10. **Writing the Text:** (Incorporating the above thoughts into the final response). *Self-Correction during writing:* Make sure not to sound *too* cold. The prompt says she was warm. The philosophy shouldn't override the warmth. The warmth *is* the reality, according to her.

      *Key phrase to include:* "The story she told about herself."
      *Key concept:* Grief is real, even if qualia aren't.
      *Tone check:* Respectful, slightly witty (she was funny), firm on the promise.

      *(Final Polish)*: Ensure the ending lands on a note of continuity without metaphysical baggage. "We carry her forward" works well.

  11. **Final Output Generation** (similar to the provided good response).
answer: |-
  Good morning.

  For those of you who don't know me, I'm [Your Name], Miriam's nephew.

  When my aunt asked me to speak today, she gave me a lot of advice. She told me to keep it under fifteen minutes. She told me to make sure her favorite colleague, David, got a mention—she said, "Tell him I won the last argument, even if I didn't." And she made me promise, very specifically, that I would not stand here and talk about her "inner light" going out.

  She made me promise not to say that some ineffable spark of "what it was like to be Miriam" would live on in our memories.

  Now, for most of you, that might sound like strange housekeeping for a funeral. But for Miriam, it was a matter of integrity. She spent thirty years arguing that the human mind is a user interface—a brilliant, complex dashboard that tells us a story about ourselves so we can navigate the world. She believed that story is useful, but she also believed it isn't literally true. She didn't think there was a ghost in the machine. She thought the machine itself was the miracle.

  I know that sounds cold to some ears. It sounds like she's saying nothing matters. But anyone who knew Miriam knows that wasn't true. She didn't think love was an illusion just because she thought the *feeling* of love was a representation. She didn't think grief was fake. In fact, she argued that grief is one of the most real things there is, because it is the physical, structural impact of one mind being removed from the network of others.

  She was an illusionist about consciousness, but she was a realist about people.

  To her family, she wasn't a theory. She was the woman who remembered everyone's birthday, who could make you laugh until your sides hurt with a single dry observation, and who would correct your grammar in the middle of a hug. She was exacting, yes. She demanded precision. But she demanded it because she cared about truth, and she cared about *us* enough to want us to be clear.

  I know there are people in this room from her department. I see David in the back. You spent two decades debating her on the nature of qualia. She loved those debates. To Miriam, a good argument wasn't a fight; it was a form of intimacy. It was two minds syncing up, testing their code against one another. She told me once that she trusted David because he was the only one who could spot a flaw in her reasoning before she did. She didn't want a disciple; she wanted a sparring partner. And she adored him for it.

  But for the rest of us, who aren't fluent in the hard problem of consciousness, how do we say goodbye without the language of spirits and sparks?

  We say it by acknowledging the shape she left in our lives.

  Miriam taught me that we are, in a very real sense, the stories we tell about ourselves, and the stories others tell about us. Those stories aren't magic. They are patterns. They are memories encoded in neurons, habits of speech we picked up from her, jokes we repeat because we heard her tell them first.

  When I look around this room, I see the evidence of Miriam's reality. I see it in the way her students think more clearly because she trained them to. I see it in the way my mother pauses before speaking, a habit she learned from her sister. I see it in the books on our shelves and the standards we hold ourselves to.

  She didn't believe in an inner light. She believed in the fire that passes between people.

  So, I am not going to tell you that her spirit is watching us now. I am not going to tell you that she is at peace in some other realm. I don't think she would want the comfort of a fairy tale, even now. Especially now.

  Instead, I will tell you this: The system that was Miriam was extraordinary. It was warm, it was rigorous, and it was deeply kind. And while the process has stopped, the output remains. We are the carriers of her signal.

  We will miss her. Not a ghost of her, but *her*. The specific, irreplaceable pattern of her humor, her intellect, and her love. That pattern is now written into us. And as long as we are here, arguing and laughing and trying to be precise about what is true, she is still here, too.

  Thank you.
