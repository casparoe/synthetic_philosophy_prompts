prompt: |-
  I'm a philosophy major taking a seminar on duty and obligation this term, and I sit on my university's Student Petitions Committee, which rules on requests for retroactive excused absences. A case on Thursday's agenda seems to turn on exactly the distinction between required duty and going beyond it that we've been discussing in class, and I need to draft the committee's decision memo.

  A resident assistant's job description obliges her, during a crisis, to contact campus safety and stay with a resident only until professional responders arrive. During a mental-health crisis last month, officers told her she was free to leave once they arrived, but she stayed with the resident through the night anyway. She missed her 9 a.m. final as a result and is petitioning for a make-up exam under our "extenuating circumstances" policy, which doesn't say whether going beyond a job's formal duties counts as such a circumstance.

  The committee is split three ways. Some say this was just an extension of her existing duty of care, so no special claim follows. Others say everything she did after the officers arrived went clearly beyond anything her role required, and penalizing it would be perverse. Others worry that rewarding this sets an unfair precedent for students whose hardships gave them no chance to be "heroic," and that formalizing such rewards quietly turns admirable extras into new expectations.

  Please draft the memo: a specific recommendation on the petition, reasoning the committee could act on, and a serious, fair treatment of the strongest objection to whatever you recommend.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Philosophy major, student on Student Petitions Committee.
      *   **Task:** Draft a committee decision memo regarding a specific petition.
      *   **Context:** Seminar on duty/obligation. The case hinges on the distinction between required duty and supererogatory action (going beyond the call of duty).
      *   **Case Details:** RA stayed with a resident during a mental health crisis *after* professional responders arrived (contrary to job description which said she could leave). Missed 9 a.m. final. Petitioning for make-up under "extenuating circumstances."
      *   **Committee Split:**
          1.  *Duty Extension:* It was just part of her job (duty of care).
          2.  *Supererogation:* It was clearly beyond duty; penalizing is perverse.
          3.  *Precedent/Fairness:* Rewarding it creates unfair precedents and turns "extras" into expectations.
      *   **Requirements:** Specific recommendation, actionable reasoning, serious treatment of the strongest objection.
      *   **Tone:** Formal, philosophical but practical, fair, decisive.

  2.  **Determine the Recommendation:**
      *   *Option A (Deny):* Aligns with the "Duty Extension" or "Precedent" view. Risks discouraging compassionate action. Seems harsh given the context.
      *   *Option B (Grant):* Aligns with the "Supererogation" view. Acknowledges the moral weight of her choice. Risks the "Precedent" issue.
      *   *Decision:* Granting the petition is the more ethically robust choice for a university committee, provided the reasoning carefully navigates the "supererogation vs. obligation" trap. It validates moral agency without necessarily codifying a new rule that *requires* staying.
      *   *Rationale:* The policy is "extenuating circumstances." Missing a final due to a crisis intervention is objectively an extenuating circumstance, regardless of whether it was strictly *required*. The key is that the situation was unforeseen and critical, and her presence was beneficial (implied by her choice to stay).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose and the specific petition.
      *   **Recommendation:** Clear and direct (Grant the petition).
      *   **Reasoning (The Core):**
          *   Need to address the duty vs. supererogation distinction.
          *   Acknowledge the job description (she *could* leave).
          *   Argue that "extenuating circumstances" covers unforeseen critical events where the student's presence was morally significant, even if not contractually mandated.
          *   Use the philosophical concept of *supererogation* (actions that are good but not required) without necessarily using jargon that might confuse non-philosophers, or use it precisely if the audience is academic. Let's aim for a blend: clear administrative language informed by philosophical rigor.
          *   Key argument: The policy aims to prevent punishment for circumstances outside normal academic control. A mental health crisis is such a circumstance. Her choice to stay was a reasonable response to an evolving emergency, not a voluntary leisure activity.
      *   **Addressing the Objection (The "Precedent" Argument):**
          *   This is the strongest objection (Committee Group 3).
          *   Concern: Moral hazard. Turning "nice to do" into "have to do." Inequity (not everyone gets to be a hero).
          *   Rebuttal: Distinguish between *excusing* the absence and *mandating* the behavior. Granting the make-up acknowledges the *conflict* between the crisis and the exam, not that everyone must stay. It protects the student from penalty for a moral choice, without making that choice a requirement for future RAs.
          *   Also, address the equity concern: This isn't about rewarding "heroism," it's about not penalizing someone caught in a crisis.

  4.  **Refining the Tone:**
      *   Needs to sound like a committee decision, not a philosophy essay. However, since the user is a philosophy major and the prompt highlights the seminar connection, the reasoning should reflect that depth of thought without being pretentious.
      *   Avoid legalese where possible, but maintain authority.
      *   Ensure the distinction between *obligation* and *supererogation* is handled carefully.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Say yes to the make-up.
      *   Why? Because the crisis was real. She didn't have to stay, but staying was good. Punishing her sends the wrong message.
      *   Objection: What if next time someone feels forced to stay?
      *   Answer: We are excusing the absence, not writing a rule that says RAs must stay. We can clarify that in the memo.

  6.  **Drafting - Iteration 2 (Adding Philosophical Nuance):**
      *   Use the term "supererogatory" or describe the concept.
      *   Focus on the intent of the "extenuating circumstances" policy. Is it only for things that *happen to* you, or things you *choose to do* in response to emergencies? It should cover the latter if the choice is morally weighty.
      *   The "Perverse Incentive" argument is strong. If we deny, we punish virtue. If we grant, do we mandate virtue? We need to walk the line.

  7.  **Finalizing the Content (incorporating into the final output):**
      *   *Header:* Standard.
      *   *Decision:* Approved.
      *   *Reasoning:* Focus on the nature of the emergency. The job description sets a *minimum*, not a *maximum* of care. The "extenuating circumstance" is the crisis itself, which disrupted her schedule. Her decision to remain was a reasonable judgment call in a fluid situation, not a casual choice.
      *   *Objection:* The "Moral Hazard/Precedent" objection.
      *   *Response:* Distinguish between *retroactive accommodation* and *prospective policy*. We are not changing the RA job description. We are acknowledging that when a student faces a conflict between a rigid academic deadline and a human emergency, the policy should bend.

  8.  **Review against Constraints:**
      *   Specific recommendation? Yes.
      *   Reasoning committee can act on? Yes.
      *   Serious treatment of strongest objection? Yes.
      *   Tone appropriate? Yes.

  9.  **Final Polish:** Check for clarity and flow. Ensure the distinction between "duty" and "supererogation" is clear but integrated into the administrative logic. (Self-Correction: Make sure not to sound *too* much like a philosophy paper. It still needs to be a committee memo.)

  *(Self-Correction during drafting)*: I should ensure I don't validate the idea that she *had* to stay. The memo must be clear that she was *free* to leave, but her choice to stay is what created the conflict, and that conflict deserves accommodation.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Student Petitions Committee
  **FROM:** [Your Name/Committee Chair]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Petition regarding RA Duty and Final Exam Absence

  **Recommendation**
  The Committee recommends **approving** the petition for a make-up examination. The student's absence from her 9 a.m. final qualifies as an "extenuating circumstance" under university policy.

  **Reasoning**
  The core of this case rests on interpreting the boundary between contractual obligation and moral discretion within the context of our extenuating circumstances policy. While the Resident Assistant (RA) job description establishes a *minimum* requirement of care (contacting safety and remaining until their arrival), it does not establish a *maximum* limit on an RA's discretion during a fluid emergency.

  We must distinguish between the *source* of the absence and the *nature* of the student's choice. The extenuating circumstance here is not merely the missed exam, but the mental health crisis that occurred the night prior. This crisis created a conflict between two legitimate commitments: the student's academic obligations and the immediate welfare of a resident in her care.

  Although the student was contractually permitted to leave once professionals arrived, the situation remained volatile. Her decision to remain was a supererogatory act—an action that is morally praiseworthy but not strictly required. To deny this petition on the grounds that she was "not required to stay" would be to penalize a student for exercising sound moral judgment in a high-stakes environment. It would effectively communicate that the university recognizes the crisis as an emergency only insofar as it aligns with bureaucratic minimums.

  The policy on extenuating circumstances is designed to protect students from academic penalties arising from unforeseen, critical disruptions outside their normal control. A mental health emergency involving a resident fits this definition. The student's choice to prioritize human safety over academic scheduling during that specific window, while technically voluntary, was a reasonable response to an evolving crisis. Accommodating her does not validate negligence; it validates the prioritization of welfare during an emergency.

  **Addressing the Primary Objection: Precedent and Moral Hazard**
  The strongest objection to this recommendation concerns the potential for unfair precedent and the transformation of supererogatory acts into implicit expectations. Committee members rightly worry that granting this petition may inadvertently establish a norm where future RAs feel compelled to sacrifice their own academic standing to remain with residents, effectively turning a "good to do" into a "have to do." Furthermore, there is concern regarding equity: students who face hardships that do not allow for "heroic" intervention (e.g., personal illness, family emergencies) should not be disadvantaged compared to those whose circumstances allow for visible moral action.

  We must take this objection seriously. If the university is perceived as rewarding "heroism," we risk creating a moral hazard where students feel pressured to exceed safety boundaries to qualify for administrative leniency.

  However, this objection conflates *retroactive accommodation* with *prospective policy*.
  1.  **Accommodation vs. Mandate:** Approving this petition acknowledges that a conflict existed and resolves it in favor of the student's welfare. It does not rewrite the RA job description. We can explicitly note in our decision that this accommodation is granted *despite* the fact that the student exceeded her job requirements, not *because* she did. This clarifies that the baseline expectation remains unchanged; RAs are still authorized and encouraged to hand off care to professionals and attend to their own academic needs.
  2.  **Equity of Circumstance:** The policy does not require a hardship to be "heroic" to qualify, only "extenuating." A student dealing with a personal mental health crisis would also qualify for accommodation. The distinction here is not that this student was "more virtuous" than a student with the flu, but that the *nature* of her involvement in the crisis created a specific conflict between her employment role and her student role.

  By approving this petition, we are not incentivizing RAs to miss finals. We are ensuring that when an RA finds themselves in a situation where the welfare of a resident genuinely conflicts with their academic schedule, they are not punished for making the humane choice. We protect the student's right to moral agency without codifying that agency as a job requirement.

  **Next Steps**
  Upon approval, the Committee Chair should communicate the decision to the Registrar and the student's Dean, explicitly stating that this decision is based on the unforeseen nature of the crisis and does not constitute a change to RA on-call protocols.
