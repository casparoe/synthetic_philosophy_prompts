  3.  **Identify the Core Crux:**
      *   The conflict isn't just "math vs. intuition." It's about *parameter certainty* and *utility functions*.
      *   *Kelly/Ravi:* Assumes we *know* the probabilities and payoffs (edge). If we know them, Kelly is mathematically optimal for geometric growth.
      *   *Linda/Samuelson:* We *don't* know the probabilities. Estimation error is fatal. Also, a foundation has a specific spending mandate (liability-driven), not necessarily a Log-Utility function (maximizing long-term geometric growth).
