answer: |-
  **MEMORANDUM**

  **TO:** Investment Committee, [Foundation Name]
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal to Modify Trend-Following Sleeve Sizing Methodology

  ### Executive Summary

  The Committee is currently reviewing a proposal from our trend-following manager (currently 8% of AUM, ~$3.2M) to transition their allocation sizing methodology from a **Fixed Volatility Target** to a **Half-Kelly Dynamic Sizing** rule.

  After reviewing the theoretical arguments and fiduciary implications, **I recommend we approve the transition, subject to three specific guardrails.**

  While the Kelly framework offers a mathematically rigorous approach to geometric compounding, it relies on assumptions regarding "known edge" that rarely hold in active management. Linda's concern regarding parameter uncertainty and utility mismatch is theoretically sound and poses a tangible risk to the Foundation's capital preservation mandate. However, rejecting the proposal outright forfeits potential alpha from a manager we trust to operate within a limited sleeve.

  Therefore, we should allow the methodology shift but constrain it with hard drawdown limits and periodic edge-validation reviews. This balances the manager's desire for geometric optimization with the Foundation's need to protect against estimation error.

  ### Background: The Proposal

  *   **Current State:** The manager targets a fixed annualized volatility (e.g., 12%). Position sizes are adjusted to maintain this volatility band regardless of the manager's conviction or perceived market opportunity.
  *   **Proposal:** The manager wishes to size positions based on a "Half-Kelly" criterion. This dynamically adjusts leverage based on the ratio of expected return (edge) to risk (odds).
  *   **Stated Goal:** To maximize the long-term geometric growth rate of the sleeve by compounding more aggressively when the signal-to-noise ratio is high and de-risking when it is low.

  ### The Theoretical Crux: Ergodicity vs. Estimation Risk

  The debate between the manager's proposal (supported by external advisor Ravi) and Linda's skepticism is not merely semantic; it identifies a genuine conflict between *theoretical optimality* and *practical implementation*.

  **1. The Argument for Geometric Growth (Ravi/Manager)**
  The pro-Kelly argument rests on **ergodicity**. In multiplicative systems (like compounding wealth), the time-average growth rate of a single path matters more than the ensemble-average expected value across parallel universes.
  *   **The Point:** Fixed volatility targeting ignores the magnitude of the edge. If the manager identifies a high-probability dislocation, fixed vol caps the upside. Kelly sizing argues that to maximize long-term wealth, one must bet proportionally to the edge.
  *   **The Validity:** Mathematically, if the probabilities and payoffs are *known*, Full Kelly maximizes geometric growth. Half-Kelly reduces variance while retaining ~75% of the growth rate. In a vacuum, this is superior for long-term compounding.

  **2. The Argument for Parameter Uncertainty (Linda)**
  Linda's objection invokes the Samuelson critique: Kelly is not "utility-free." It implicitly assumes a Log-Utility function, which may not match the Foundation's actual utility (which includes spending liabilities and capital preservation thresholds).
  *   **The Point:** The fatal flaw in applying Kelly to asset management is **input sensitivity**. Kelly requires precise knowledge of the "edge." In a casino, the odds are known. In trend-following, the edge is an *estimate* derived from historical data.
  *   **The Validity:** If a manager overestimates their edge by even a small margin, the Kelly formula recommends over-leverage. In the presence of estimation error, "Half-Kelly" can still result in ruinous drawdowns before the "long run" arrives. For a $40M foundation, the "long run" is irrelevant if we breach our spending mandate in year three.

  **The Crux:** The manager is optimizing for a world where their model's edge is a fixed parameter. Linda is optimizing for a world where the edge is a distribution with fat tails. **Linda is right that we cannot treat the manager's edge estimate as a known constant.**

  ### Fiduciary Analysis

  As a Foundation with a "don't blow it up" mandate, our primary risk is not underperforming the S&P 500; it is permanent capital impairment that jeopardizes our grant-making capacity.

  1.  **Sleeve Size:** At 8% of the book ($3.2M), this sleeve is material but not existential. A 50% drawdown here is a 4% hit to total AUM. This gives us some room to experiment, provided the loss is contained.
  2.  **Utility Mismatch:** A Log-Utility function (implied by Kelly) suggests we should be willing to tolerate significant volatility for growth. However, our utility function is likely "step-wise": we are fine with volatility until assets drop below a threshold where our spending rate becomes unsustainable. Kelly does not account for this threshold.
  3.  **Manager Incentives:** Dynamic sizing increases the manager's fee potential in good times but increases the risk of a "blow-up" in bad times. We must ensure the risk of ruin is capped, not just theoretically minimized.

  ### Recommendation: Approve with Guardrails

  We should not reject the methodology simply because it is complex, nor should we approve it based on theoretical elegance alone. We should approve it **conditionally**, treating the "edge" as uncertain until proven otherwise.

  **I propose we vote to authorize the Half-Kelly transition, contingent on the following three guardrails:**

  **1. Hard Drawdown Limit (The "Linda" Guardrail)**
  *   **Condition:** The sleeve is subject to a hard liquidation or de-risking trigger if the sleeve loses 20% of its allocated capital from its high-water mark.
  *   **Rationale:** This overrides the Kelly formula. Even if the model says "double down" because the edge looks huge, if we are down 20%, we acknowledge that our *estimate* of the edge was likely wrong. This protects the Foundation from parameter uncertainty.

  **2. Edge Estimation Review (The "Fiduciary" Guardrail)**
  *   **Condition:** The manager must provide a quarterly memo detailing how the "edge" parameter is derived. We require a sensitivity analysis showing how position sizing changes if the estimated edge is reduced by 50%.
  *   **Rationale:** This forces transparency on the input variable. If a small reduction in estimated edge causes massive de-leveraging (or over-leveraging), we know the model is too fragile.

  **3. Reversion Clause (The "Escape Hatch")**
  *   **Condition:** If the sleeve underperforms its benchmark by more than 500bps over any rolling 24-month period, the Committee reserves the right to mandate a reversion to Fixed Volatility targeting without penalty.
  *   **Rationale:** This acknowledges that if the theoretical growth advantage doesn't materialize in a reasonable timeframe, the complexity is not worth the risk.

  ### Conclusion

  Ravi is correct that wealth compounds along a single path, and we should care about geometric growth. But Linda is correct that we do not know the odds of the game we are playing.

  By approving the Half-Kelly rule with a hard drawdown limit, we accept the manager's theoretical framework while insuring against the practical reality that their "edge" is an estimate, not a fact. This allows us to pursue alpha without violating our primary duty to preserve the Foundation's capital.

  **Action Required:** Vote to approve the methodology change subject to the guardrails outlined above.
