answer: |-
  **MEMORANDUM**

  **TO:** City Council
  **FROM:** Civic Decision-Making Task Force
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Futarchy Pilot for Transportation Bond Decision

  ### Executive Summary

  The Task Force has reviewed the proposal to utilize a conditional prediction market (futarchy) to resolve the three-year deadlock regarding the $400 million Transportation Bond (Plan A vs. Plan B). After extensive deliberation, the Task Force **recommends a modified endorsement of the pilot.**

  We advise the Council to adopt the futarchy mechanism as the decision driver for this bond, *provided* that four specific structural safeguards are implemented to address the unique risks of a municipal context. These safeguards focus on insulating implementation from political sabotage, funding a counterfactual audit to validate the mechanism, ensuring market liquidity, and locking the value metrics prior to trading.

  A flat rejection would preserve the status quo of dueling consultants and continued gridlock. However, a full endorsement without modification exposes the city to unacceptable moral hazards, specifically the risk that losing stakeholders may undermine the winning plan to vindicate their market positions. The modifications below are designed to retain the information-aggregation benefits of the market while mitigating the governance risks.

  ### Background

  For three years, the City has been unable to authorize the Transportation Bond due to conflicting consultant reports favoring either Bus-Rapid-Transit expansion (Plan A) or Road-Capacity/Repaving (Plan B). The proposal before us suggests the Council vote only on the definition of a "Quality of Movement Index" (QMI), after which subsidized conditional markets would determine which plan is predicted to yield a higher QMI score in five years. The proposal requests a charter amendment binding the City to implement the market's choice.

  The Task Force is divided. Proponents argue this bypasses biased expertise and incentivizes residents to uncover truth. Opponents argue this relocates politics into market manipulation and creates incentives for post-decision sabotage. Both sides raise valid points. The status quo is demonstrably failing; however, the proposed remedy introduces new failure modes that must be engineered out before deployment.

  ### Assessment of Proposal Strengths

  The Task Force acknowledges the compelling advantages of the futarchy model in this specific context:

  1.  **Breaking Consultant Capture:** The current process rewards stakeholders for hiring consultants who produce favorable conclusions, not accurate ones. A prediction market financially penalizes inaccurate forecasting, regardless of the source. This aligns private incentive with public accuracy.
  2.  **Information Aggregation:** Local knowledge (e.g., small business owners knowing which intersections actually bottleneck) is currently siloed. Markets aggregate this dispersed information more efficiently than public hearings.
  3.  **Forcing Specificity:** By tying the decision to a specific Index (QMI), the debate shifts from ideological posturing ("Pro-Transit" vs. "Pro-Business") to empirical estimation of outcomes.

  ### Assessment of Critical Risks

  While the strengths are significant, the Task Force identifies two structural risks that, if unaddressed, could render the pilot harmful to the City.

  **1. The Sabotage and Moral Hazard Problem**
  In a standard election, the losing coalition accepts the result and waits for the next cycle. In a futarchy binding the City to a specific policy, the losing coalition may retain the capacity to influence the *implementation* of the winning plan.
  *   **The Risk:** If a stakeholder group has heavily shorted Plan A, and Plan A wins the market, that group has a financial and reputational incentive to ensure Plan A underperforms the QMI. In a municipal context, this could take the form of bureaucratic delay, permit obstruction, or public relations campaigns designed to lower resident satisfaction scores.
  *   **The Constraint:** Unlike national markets where no single actor can influence GDP, our city's market is thin enough that organized local actors *can* influence the outcome variables (e.g., pedestrian injury rates or business receipts).

  **2. The Counterfactual Verification Problem**
  Futarchy relies on the claim that markets are better at predicting the future than politicians. However, because only one plan is implemented, we can never observe the outcome of the losing plan.
  *   **The Risk:** If the City implements Plan A based on the market, and the QMI declines, we cannot know if Plan A was inherently flawed or if Plan B (the market loser) would have been catastrophic. This creates an accountability vacuum. If the mechanism fails, we cannot learn *why*, making it difficult to justify using the tool again.
  *   **The Constraint:** Without a method to estimate the counterfactual, the City is flying blind on performance review. We risk binding ourselves to a mechanism we cannot audit.

  ### Recommendation and Required Safeguards

  The Task Force recommends the Council proceed with the futarchy pilot, but **only** if the following four modifications are adopted in the enabling legislation. These modifications are non-negotiable for the Task Force's support.

  **1. Implementation Insulation (Mitigating Sabotage)**
  To reduce the incentive and ability to sabotage the winning plan, the implementation authority must be decoupled from the political coalitions that participated in the betting.
  *   **Requirement:** The Council shall appoint an **Independent Implementation Officer (IIO)** for the duration of the bond project. The IIO will have sole authority over contracting and timeline management for the winning plan.
  *   **Rationale:** If the actors who bet against the plan cannot influence its execution (permits, hiring, scheduling), the profitability of sabotage drops significantly. The IIO's performance bonus should be explicitly tied to the QMI metrics, aligning their incentive with the market's success.

  **2. The Counterfactual Audit Fund (Mitigating Verification Blindness)**
  To address the inability to verify the market's accuracy, the City must invest in estimating what *would* have happened.
  *   **Requirement:** 0.5% of the Bond value ($2 million) shall be set aside as a **Counterfactual Audit Fund**. This fund will commission an independent academic or economic body to model the projected QMI of the *losing* plan over the same five-year period, using the best available data and simulation methods.
  *   **Rationale:** While this model will not be perfect, it provides a baseline for the Task Force to evaluate the market's performance post-hoc. If the market chose Plan A, and the Audit shows Plan B would have clearly outperformed, we know the market failed. This allows the City to treat the pilot as a learnable experiment rather than a leap of faith.

  **3. Liquidity and Depth Triggers**
  A thin market is a manipulable market. If only a few wealthy actors participate, the price signal is noise.
  *   **Requirement:** The market results shall only be binding if total trading volume exceeds $500,000 and no single entity holds more than 15% of the open interest in either contract. If these thresholds are not met by the close of the trading period, the decision reverts to a standard Council vote.
  *   **Rationale:** This ensures the "wisdom of the crowd" is actually present before the City cedes its decision-making authority.

  **4. Metric Lock-In**
  Politics will inevitably attempt to migrate from the betting phase to the metric-definition phase.
  *   **Requirement:** The weights and definitions of the Quality of Movement Index (QMI) must be finalized and published *before* the markets open. No adjustments to the QMI methodology are permitted after trading begins, even if unforeseen circumstances arise.
  *   **Rationale:** Changing the goalposts after bets are placed is equivalent to insider trading. Stability here is required to maintain market integrity.

  ### Conclusion

  The Task Force recognizes that these safeguards do not eliminate all risk. The counterfactual will always remain an estimate, and the incentive to sabotage can never be reduced to zero. However, the current deadlock carries its own severe costs: economic stagnation, eroded public trust, and the continued waste of public funds on biased consulting studies.

  By adopting these modifications, the City can test a promising governance innovation without exposing itself to irreversible moral hazard. We recommend the Council accept this modified framework. If the pilot succeeds, it offers a path out of gridlock for future decisions. If it fails, the Counterfactual Audit will tell us why, ensuring that even in failure, the City learns something the current system would never teach us.

  **Vote of the Task Force:** 7 in favor of Modified Endorsement, 4 in favor of Rejection, 1 Abstention.

  Respectfully submitted,

  [Your Name/Title]
  Civic Decision-Making Task Force
