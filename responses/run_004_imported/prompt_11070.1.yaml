      *   **Goal:** Write a memo that recommends a course of action (Endorse, Reject, or Modify) with reasoning that the losing side can engage with (substantive, not diplomatic fluff).
      *   **Key Constraints:** Must take the sabotage/moral-hazard problem and the counterfactual verification problem seriously. Must weigh these against the strengths of the proposal.
      *   **Tone:** Professional, analytical, balanced, decisive but nuanced.

