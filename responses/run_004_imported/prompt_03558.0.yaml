      *   Bentham's Hedonic Calculus weighs intensity, duration, certainty, propinquity, fecundity, purity, extent.
      *   *Fecundity/Purity:* Does the pain of kink lead to *more* pain later (addiction, escalation, injury)? Or does it lead to more pleasure (stress relief, bonding)?
