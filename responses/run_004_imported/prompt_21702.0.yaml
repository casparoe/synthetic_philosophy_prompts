answer: |-
  You have put your finger on one of the most famous and contentious cruxes in the history of logic. Your confusion is not a failure of reading; it is a sign that you are grappling with the text exactly as generations of philosophers have, from the Stoics to modern modal logicians. The Oxford translation you are holding is almost certainly by **J.L. Ackrill** (1963), which is the standard scholarly edition, and the phrasing you quote is the precise pivot point where Aristotle attempts to dismantle the "Lazy Argument" of the fatalists.

  To answer your core question: **Yes, there is genuine logical work being done in that distinction, but yes, there is also a metaphysical assumption that a sharp rival could exploit.**

  Here is the breakdown of the logic, the potential soft spot, and how your characters might wield it.

  ### 1. The Logical Move: Scope of Necessity
  The primary logical error Aristotle is identifying is what modern logicians call a **modal scope fallacy**.

  The fatalist argues like this:
  1.  Either there will be a battle ($B$) or there will not ($\neg B$).
  2.  This disjunction ($B \lor \neg B$) is necessary.
  3.  Therefore, one of the two options is *individually* necessary ($\square B \lor \square \neg B$).

  Aristotle's counter-move is to insist that the necessity applies to the **disjunction as a whole**, not to the **disjuncts individually**.
  *   **Valid:** $\square (B \lor \neg B)$ — "It is necessary that (either battle or no battle)."
  *   **Invalid:** $\square B \lor \square \neg B$ — "Either (necessarily battle) or (necessarily no battle)."

  To use a trivial analogy: It is necessary that "I am either sitting or standing." It is *not* necessary that "I am sitting" nor necessary that "I am standing." I have the power to choose which one becomes true, even though the logical structure covering both options is rigid.

  **For your Chaplain:** He is committing the fallacy intentionally (or perhaps he has convinced himself it isn't one). He argues that because the *outcome* is fixed (one side must win), the *path* to it is also fixed. He collapses the necessity of the whole into the necessity of the parts.

  ### 2. The Temporal Move: "When It Is"
  This is the specific passage that has you stuck: *"What is, necessarily is, when it is... But not everything that is, necessarily is."*

  This is Aristotle's attempt to distinguish between **actual necessity** and **prior necessity**.

  *   **"What is, necessarily is, when it is":** This is a statement about the **present**. If a sea battle is occurring *right now*, it is impossible for it *not* to be occurring right now. The past and present are "fixed" in the sense that they are actual. You cannot make a present fact untrue. This is sometimes called "temporal necessity."
  *   **"Not everything that is, necessarily is [unconditionally]":** This denies that the present necessity implies **eternal** necessity. Just because the battle is happening now (and is therefore necessary *now*), it does not mean it was necessary *yesterday* that it would happen today.

  **The Logical Work:** Aristotle is trying to block the inference from **Truth** to **Fatalism**.
  The fatalist says: If it is *true now* that there will be a battle, then it is *necessary* that there will be a battle.
  Aristotle says: No. It may be *true* that there will be a battle, but it only becomes *necessary* when the battle actually begins ("when it is"). Until then, it is merely a possibility that happens to be trending toward actuality.

  ### 3. Is It a Soft Spot? (The Begging the Question Charge)
  You asked if this is "a restatement of 'the past is fixed and the future is open,' which is exactly the conclusion he needs to earn."

  **You are absolutely right to suspect this.** Many commentators argue that Aristotle is indeed begging the question.
  *   To say "It is not necessary until it is" assumes that future events do not have the same ontological status as present events.
  *   The fatalist (like your Chaplain) would argue: "Truth is timeless. If the proposition 'There will be a battle' is true, it is *always* true. If it is always true, how can it be contingent?"

  Aristotle's solution essentially requires rejecting the **Principle of Bivalence** for future contingent statements. He is arguing that statements about the future are not yet "True" or "False" in the hard sense; they are indeterminate.
  *   **The Soft Spot:** If your rival character is philosophically sharp, they can point out that Aristotle hasn't *proven* the future is open; he has simply *defined* it as open to save the concept of human agency. He asserts that "necessity" attaches to actuality, but he doesn't fully explain *why* truth doesn't carry necessity with it across time.

  ### 4. How to Write the Sermon and the Rebuttal

  This philosophical tension is perfect drama. Here is how you might stage it:

  **The Chaplain's Sermon (The Fatalist Reading)**
  The Chaplain should lean on the **Timelessness of Truth**. He should ignore the "when it is" clause or interpret it cynically.
  *   *Argument:* "God (or Logic) sees all time at once. To say 'It is not necessary yet' is a comfort for children. If the proposition is true, the event is fixed. The disjunction is necessary, and since God knows which side of the disjunction is true, the necessity has already collapsed onto that specific outcome. We are merely walking out a script written in the grammar of reality."
  *   *Use of Aristotle:* He cites the "Sea-battle must either take place or not" to establish the rigid framework, then ignores the caveat about "when it is," treating the necessity of the whole as infecting the parts.

  **The Rival's Rebuttal (The Anti-Fatalist Reading)**
  The rival (perhaps a captain or a skeptical officer) should exploit the **Modal Scope** and the **"When It Is"** distinction.
  *   *Argument:* "You confuse the map with the territory, Father. You say the battle is necessary because the *statement* about the battle is true. But a map is not the land. Aristotle tells us: necessity attaches to the *event* only when the event *is*. Until the cannon fires, the necessity is not there. You are treating a possibility as a fact because you are afraid to admit you have a choice in how you face it."
  *   *The Logical Strike:* "You claim that because (Battle or No Battle) is necessary, therefore (Battle) is necessary. That is a child's error. It is necessary that I will either eat or starve tomorrow. It is not necessary that I starve. My hand holds the bread, not fate."

  ### 5. A Note on the Translator
  The translation you are using is almost certainly **J.L. Ackrill** (Oxford, Clarendon Aristotle Series, 1963). His translation is the standard for analytic philosophy because it tries to be hyper-literal to preserve the logical structure, which is why it reads so knotty. If you want to see how other translators smooth this over, you might look at **Gilbert Anscombe** (1956) or **Edghill** (1831), but Ackrill is the one your logic-tutor chaplain would respect most for its precision.

  ### Summary for the Novel
  *   **The Logic:** Aristotle distinguishes between the necessity of the *disjunction* (Always True) and the necessity of the *disjuncts* (Not yet True).
  *   **The "When It Is" Clause:** This limits necessity to the moment of actuality. It prevents the necessity from flowing backward in time to determine the present.
  *   **The Flaw:** Aristotle assumes the future is ontologically different from the present (Bivalence fails). A hard fatalist denies this.
  *   **The Drama:** The Chaplain uses Aristotle to preach resignation (focusing on the necessity of the outcome). The Rival uses Aristotle to preach courage (focusing on the indeterminacy of the process).

  Your chaplain is technically misreading Aristotle if he uses him to argue for hard fatalism, but that makes him a more interesting character: a logician who has twisted logic to justify his despair. He has taken a text meant to *save* free will and weaponized it to *deny* it. That is a profound theological and philosophical tragedy suitable for the eve of a battle.
