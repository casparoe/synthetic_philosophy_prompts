answer: |-
  The protocol was called *Tabula Rasa*, but Elias preferred the older name. The Flying Man.

  He lay in the Chrysalis, a coffin of matte-white polymer. There were no restraints, because there was no gravity to resist. The suspension field held him in the center of the sphere, limbs splayed in a starfish spread, precisely calibrated so his left hand did not brush his left thigh, so his chin did not rest on his collarbone.

  "Proprioceptive dampeners at ninety percent," the technician's voice came through the bone-conduction implant. "Cutting the feed in three. Two. One."

  The silence wasn't quiet; it was absolute. It was the absence of the concept of sound. Then the touch went. It didn't feel like numbness, because numbness is a sensation. It felt like deletion.

  Elias waited for the panic. That was the control variable. Most subjects spiked in cortisol when the body map dissolved. But Elias had read Ibn Sina. He had read Descartes. He knew the theory.

  *Imagine a man created all at once, perfect in body, but suspended in air, isolated from all sensation.*

  *Would he affirm his own existence?*

  Yes, Elias thought. The answer rose up instantly, clean and sharp. *I am.*

  It was intoxicating. For the first ten minutes, he felt like a god. He was pure cognition, a point of light in a void of nothing. He was the Avicennian ideal. He didn't need a heart to beat to know he was alive; he didn't need lungs to fill to know he breathed. The *I* was a substance distinct from the *Body*. He had proven the soul in a lab test. He floated in the white dark, smiling a smile that had no muscles to form it.

  *I am.*

  Then, the minutes stretched.

  The problem with a point of light is that it needs a surface to shine upon.

  Elias tried to think about his wife. He tried to summon her face. But without eyes to focus, the image was slippery. It required a vantage point. *Where* was he looking at her from? If he had no head, where did the image project?

  He tried to retreat back to the *I*. *I am thinking of her.*

  But the *I* was starting to feel thin.

  Avicenna said the self would remain certain. But Avicenna was imagining a thought experiment, not enduring a duration. In a thought experiment, time doesn't pass. In the Chrysalis, time was the only thing left.

  *I am.*

  What is *am*?

  To be is to be somewhere. To be something. To have a boundary where you end and the rest of the universe begins. Elias reached for the edge of himself. He tried to feel the limit of his consciousness.

  There was no limit.

  If you have no skin, do you leak? If you have no ears, is there a difference between silence and a scream?

  The certainty began to curdle. It wasn't that he stopped existing. It was that the *I* started to feel like a verb without a subject. *Aming.* Just a process running on hardware that had been turned off.

  He remembered a footnote he'd read once, a modern critique of the Flying Man. *The phantom limb.* The idea that when you strip away the body, you don't find the soul; you find the ghost of the body's map, burning itself out.

  Was this *I* just an echo?

  He tried to move his hand. Just a twitch. A command sent down the nerve.

  Nothing happened. Of course nothing happened. The suit was dampening the signal. But he couldn't feel the *attempt* either. Usually, even in paralysis, you feel the tension of the will. Here, the will just vanished into the white.

  *I am.*

  The thought felt weaker now. Desperate. Like he was saying it to keep the dark away.

  If I cannot distinguish myself from the void, am I the void?

  The terror wasn't that he would cease to exist. The terror was that he already had, and this lingering *I* was just a recording. A loop. A scratch on a vinyl disc that kept playing the note *I* even after the needle had been lifted.

  He tried to find anger. Anger is hot; anger is bodily. Adrenaline. Cortisol. He tried to summon rage at the technicians, at Avicenna, at the machine.

  But rage requires a chest to tighten. It requires a throat to constrict. Without the biology, the emotion had no texture. It was just the concept of anger. A label on an empty jar.

  *I... exist.*

  The gap between *I* and *exist* was widening.

  What if Avicenna was wrong? What if the self isn't a jewel buried in the rock, but the shape of the rock itself? What if you can't separate the statue from the clay without losing the statue?

  He felt a sensation then. A flicker.

  It wasn't touch. It wasn't sound. It was a memory of weight. A phantom gravity pulling at a limb he didn't have.

  *There,* he thought. *That's me. I feel the weight.*

  But then the thought analyzed itself. To feel weight, you need mass. To feel mass, you need a boundary. If he felt the weight, he was admitting he had a body. If he had a body, the experiment had failed. He wasn't the Flying Man. He was just a blind man in a box, hallucinating his own limbs because the silence was too loud.

  The *I* began to fray at the edges. It wasn't a dissolution; it was a diffusion. He wasn't shrinking; he was spreading. He was the white room. He was the hum of the suspension field. He was the technician watching the monitor.

  *I am.*

  Who is speaking?

  If there is no listener, is there a speaker?

  He tried to scream. He pushed every ounce of will into a vocal command. *Let me out.*

  But without a mouth, without a throat, without air to push through cords, the scream was just a thought. And if a thought happens in a mind with no boundaries, does it make a sound?

  The monitor in the control room flatlined. Not his heart—his neural coherence. The wave pattern smoothed out into a perfect, straight line.

  "Elias?" The technician's voice cut through the bone-conduction. "We're seeing a drop in ego-integration. Do you want to abort?"

  Elias tried to say *Yes*.

  But the *Yes* required an *I* to say it. And the *I* was currently busy wondering if it was just a trick of the light.

  He realized then the cruelty of the argument. Avicenna used the Flying Man to prove the soul's independence. But he never asked what the soul *does* when it's independent.

  A knife is defined by its ability to cut. If you remove everything that can be cut, is it still a knife? Or is it just a strip of metal pretending at sharpness?

  He was a mind with nothing to think *about*. And a mind that cannot think about objects eventually starts to think about itself as an object. And once you are an object, you can be broken.

  *I am...*

  The sentence trailed off. Not because he forgot the end, but because the grammar of existence was failing. Subject. Verb. Object. He had the verb. He had lost the rest.

  The technician's voice came again, sharper. "Abort sequence initiated. Reintegrating proprioception in five."

  Panic. Real, biological panic. The kind that lives in the gut.

  He wanted it. He wanted the itch on his nose. He wanted the ache in his lower back. He wanted the heavy, clumsy anchor of the meat.

  "Four."

  He tried to hold onto the purity of the void, the certainty of the *I*, but it was already gone. It had evaporated the moment he doubted it.

  "Three."

  He prayed for the weight.

  "Two."

  He prayed for the limit.

  "One."

  The sensation crashed into him like a tidal wave. Gravity returned with a violent shove. His left hand slammed against his left thigh. His chin dropped to his chest. Air rushed into lungs that suddenly felt too small, burning with the effort of inflation.

  Elias gasped, a wet, ragged sound. His eyes flew open, staring at the white ceiling of the Chrysalis.

  He was shaking. Violently.

  "Elias? Vitals are spiking. Talk to me."

  He lifted his hand. He looked at it. It was pale, trembling, veins blue under the skin. He flexed the fingers. He felt the tendons pull. He felt the friction of the suit against his palm.

  He pressed his thumb against his index finger. Pinched the skin. Hard.

  Pain. Sharp, bright, localized pain.

  "Subject is verbalizing," the technician said, relieved.

  Elias opened his mouth. He had to say it. He had to affirm it. He had to complete the argument.

  *I am.*

  But the words stuck in his throat. Because he remembered the space between the *I* and the *Am*. He remembered how easy it was to slip into that gap.

  He looked at his hand again. It felt foreign. Like a glove he was wearing.

  "Did it work?" the technician asked. "Did you achieve the separation?"

  Elias closed his hand into a fist. He squeezed until his knuckles turned white. He needed the resistance. He needed the world to push back. If the world didn't push back, he wasn't sure he could push forward.

  "I don't know," Elias whispered. His voice sounded thin. Borrowed.

  He looked at the ceiling, terrified that if he blinked, the white might come back. Terrified that the hand he was looking at was just another image in the void, and that he was still falling, still flying, still waiting for a ground that wasn't there.

  "I think," Elias said, and he hated how much effort the words cost him. "I think I need to feel something else."

  "Like what?"

  Elias didn't answer. He just pressed his thumb harder into his palm, digging in, trying to carve a boundary into the flesh, trying to prove that the edge was real, trying to make sure that when he stopped looking, the hand didn't just fade away.
