      *   *Ethical/Philosophical:* This touches on liberalism vs. communitarianism, privacy rights, the scope of institutional authority, and the definition of "harm."
      *   *Practical:* Enforcement would be a nightmare. Who decides what is "morally objectionable"? What constitutes "enough" parents/teachers?

  3.  **Deconstruct the Supporters' Argument:**
      *   *Premise 1:* A school functions as a real community only if members share certain values.
      *   *Premise 2:* Open disregard for those values (even in private) threatens that community.
