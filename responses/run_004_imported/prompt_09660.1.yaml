      *   **Vagueness/Subjectivity:** "Morally objectionable" is highly subjective. One group's moral failing is another's cultural expression. This invites bias and arbitrary enforcement.
      *   **The "Harm Principle":** Classical liberalism (Mill) suggests power should only be exercised to prevent harm to others. The prompt explicitly states "no other student is affected."
