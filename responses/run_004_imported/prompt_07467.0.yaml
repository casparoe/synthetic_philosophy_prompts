answer: |-
  The dispute over the Kennedy sentences is not merely a parlor game; it is the central fault line in the philosophy of conditionals. Your intuition—that the indicative ("If Oswald didn't...") is true while the counterfactual ("If Oswald hadn't...") is false—is shared by almost every competent speaker. Your friend's intuition—that a rigorous logic should not fracture into two disjoint systems based on grammatical mood—is shared by almost every formal semanticist. To settle this, we must determine whether the divergence in truth values is a bug in our logical theories or a feature of the language that a sufficiently sophisticated theory can capture.

  The verdict is this: **Unification is achievable, and it is necessary.** Your friend is right that a dualist semantics is theoretically untenable, but you are right that the difference between the sentences is real. The solution lies not in abandoning unity, but in recognizing that grammatical mood signals a shift in the *contextual parameters* of a single logical operator. Stalnaker's unified theory, properly understood, survives the triviality results and solves the embedding problems that plague the dualist view.

  ### The Phenomenon and the Unified Mechanism

  The "JFK Pair" demonstrates that indicatives and counterfactuals respond differently to the same facts. In the actual world, Oswald shot Kennedy, and there was no conspiracy.
  1.  **Indicative:** "If Oswald didn't shoot Kennedy, someone else did." We accept this as true because we hold fixed the fact that Kennedy was killed. We are reasoning within our current knowledge.
  2.  **Counterfactual:** "If Oswald hadn't shot Kennedy, someone else would have." We reject this as false because we allow the past to change. In the closest world where Oswald refrains, the conspiracy does not exist, and Kennedy lives.

  Robert Stalnaker's unified semantics handles this with a single logical operator: the selection function. For any antecedent $A$ and world $w$, the function $f(A, w)$ selects the single world most similar to $w$ where $A$ is true. The conditional $A > C$ is true if $C$ is true in that selected world.

  The divergence arises not from the operator itself, but from the **context set**. The context set is the collection of worlds compatible with the presuppositions of the conversation.
  *   **For Indicatives:** The selection function is constrained to search *within* the context set. Since it is a shared presupposition that Kennedy was killed, the search for a world where "Oswald didn't shoot" must remain within worlds where "Kennedy was killed." Thus, the selected world is one where a conspiracy exists. The sentence is true.
  *   **For Counterfactuals:** The selection function is permitted to reach *outside* the context set. We suspend the presupposition that Kennedy was killed to evaluate the causal chain. The closest world where Oswald doesn't shoot is one where Kennedy survives. The sentence is false.

  This achieves your friend's goal: a single semantic mechanism. It also respects your intuition: the truth values diverge because the domain of search shifts based on mood.

  ### The Dualist Challenge and Triviality

  The standard alternative, championed by Ernest Adams and later Dorothy Edgington, posits a deep split. Counterfactuals have truth conditions (possible worlds), but indicatives do not. Instead, indicatives express conditional probabilities. Adams' Thesis states that the probability of a conditional equals the conditional probability of the consequent given the antecedent: $P(A \rightarrow C) = P(C|A)$.

  This view appeals to your skepticism. It treats indicatives as tools for belief revision rather than descriptions of reality. However, it runs headlong into **Lewis's Triviality Results**. David Lewis proved that if conditionals are truth-apt propositions that obey Adams' Thesis, probability theory collapses. Essentially, you cannot equate the probability of a truth with a conditional probability without restricting the language so severely it becomes useless.

  Stalnaker's unified account avoids this by rejecting Adams' Thesis as a semantic identity. He maintains that indicatives *have* truth conditions, but their *assertability* is governed by conditional probability. This distinction saves the logic from triviality. We can assign truth values to indicatives without forcing probability functions to collapse, provided we acknowledge that speakers often confuse assertability conditions with truth conditions.

  ### The Embedding Problem

  The decisive blow against the dualist view, however, is the problem of embedding. Logic must account for compound sentences. Consider: "It is not the case that if Oswald didn't shoot Kennedy, someone else did." Or, "If it is true that if Oswald didn't shoot Kennedy, someone else did, then there was a conspiracy."

  If indicatives lack truth values (as the dualist claims), these sentences are nonsense. You cannot negate a probability, and you cannot make a probability the antecedent of another conditional. Dualists are forced to develop complex, non-standard logics to explain how we seemingly reason with nested conditionals.

  Stalnaker's unified truth-conditional approach handles embedding naturally. Since "If A then B" expresses a proposition with a truth value, it can be negated, conjoined, or nested without grammatical or logical friction. The fact that we *can* embed indicatives in ordinary discourse is strong empirical evidence that they function as truth-apt propositions, supporting the unified model.

  ### The Verdict

  So, who wins the dinner argument?

  **Your friend is right about the theory, but wrong about grammar.** Logic cannot be "blind" to grammar because grammatical mood (indicative vs. subjunctive) is the morphological marker for the semantic parameter that matters: the domain of the selection function. To demand unity is not to demand that the sentences mean the same thing, but that they be governed by the same logical rules. Stalnaker proves this is possible. The divergence in truth values is not a failure of semantics; it is a successful prediction of how context interacts with a unified operator.

  **You are right about the intuition, but wrong about the implication.** The fact that the sentences differ in truth value does not prove that semantics is broken. It proves that the context set shifts. Your intuition that the first is true and the second false is the very data a correct semantics must predict. Stalnaker's theory predicts exactly this divergence. If you reject unification, you are left with a dualist system that cannot explain how you negate or nest the very sentences you are arguing about.

  **Final Judgment:** Unification is achievable. The "JFK Pair" is not evidence of two different logics, but of one logic sensitive to epistemic context. The dualist view must be rejected because it sacrifices the compositional structure of language (embedding) to save a probabilistic intuition that is ultimately untenable (triviality). Stalnaker's unified semantics, which locates the difference in the permissible range of the selection function rather than the function itself, is the only framework that preserves both the logical integrity of the conditional and the distinct truth values of the Kennedy sentences.

  The semantics is not what has gone wrong; the expectation that grammatical difference implies logical fragmentation is. A single mechanism, sensitive to context, settles the dinner argument.
