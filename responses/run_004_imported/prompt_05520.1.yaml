answer: |-
  The air in the Oslo kitchen smelled of burnt coffee and rain, distinct from the lavender detergent of Elin's own apartment in London. She stood on one side of the granite island; the other Elin stood on the opposite side. They looked identical, down to the scar on the left chin from a childhood fall, but the Oslo-Elin wore it with a harder set to her jaw.

  "The bridge is destabilizing," London-Elin said, gripping the edge of the counter. Her knuckles were white. "We need to synchronize to push me back. You have to want me there as much as I want to be there."

  Oslo-Elin didn't move. She was staring at a rejection letter on the table between them. The architecture firm had let her go an hour ago. "Why should I want that?"

  "Because it's safety. It's home."

  "It's *your* home," Oslo-Elin said. Her voice was lower, rougher. "You stayed. You took the safe path. I came here. I took the risk. And now I lose everything, and you want to swap places like we're trading coats?"

  "I'm trying to help you. I'm trying to help *us*."

  Oslo-Elin laughed, a sharp, brittle sound. "There is no *us*. That's the mistake you keep making. You look at me and you see a reflection. You think because I have your face, I have your life."

  "We have the same past. Up until the job offer."

  "Divergence isn't a split screen; it's a fracture," Oslo-Elin said, picking up the letter. "You feel pity for me. I can see it. You think, 'Poor me, I'm suffering in Oslo.' But you aren't suffering. You're standing in a dry kitchen in London, worrying about your commute."

  "I feel your pain," London-Elin insisted. She reached across the island. "It hurts here." She tapped her chest.

  "That's empathy. It's not identity." Oslo-Elin stepped back, out of reach. "Think about it. If I starve here, do you lose weight? If I die in this apartment, does your heart stop in London?"

  "No, but—"

  "Then nothing happens to *you* when it happens to *me*. I am just a stranger who looks like you. A very close stranger. Why should I care about your safety? Why should you care about my failure? You didn't lose this job. I did. Your sympathy is worthless because it costs you nothing."

  London-Elin felt the room tilt. This was the itch her partner had warned her about, the metaphysical rot at the core of her premise. If Lewis was right, if they were merely counterparts, then this rescue mission was absurd. It was voyeurism. She was meddling in the life of a woman who was fundamentally *other*.

  "If we aren't the same," London-Elin whispered, "then I can't bring you back. The mechanism requires identity. It requires that I am you."

  "Exactly." Oslo-Elin tossed the letter into the sink. "So stop pretending you can fix this. You can't fix a stranger's life without breaking your own. And you won't do that. You love yourself too much to sacrifice your timeline for a counterpart."

  "I love *you*."

  "You love the idea of me. You love the version of yourself that was brave enough to leave." Oslo-Elin leaned forward, eyes dark. "Humphrey doesn't care that his counterpart won the election. He cares that *he* lost. I don't need your victory. I need mine. And I don't have it."

  The air between them began to hum. The swap was initiating automatically now, the instability forcing a resolution. The light fractured, prisms of London grey and Oslo blue slicing through the room.

  London-Elin realized the truth then. The magic wasn't failing because of energy; it was failing because of definition. You cannot merge two distinct objects simply because they resemble each other. If they were truly the same soul across different bodies, the pain would be shared equally. But London-Elin felt only fear, while Oslo-Elin felt devastation. They were not one.

  "I can't take you with me," London-Elin said. The realization was cold, heavier than the guilt. "You aren't me."

  "Finally," Oslo-Elin said. She looked tired. "Go home. Live your safe life. Let me live mine."

  "I'm sorry."

  "Don't be. You didn't do this to me."

  The hum peaked. London-Elin felt the pull of her own timeline, the lavender detergent, the safe commute. She reached out one last time, not to swap, but to touch. Her fingers brushed Oslo-Elin's hand. It felt like touching her own skin in a mirror—cold, smooth, and fundamentally separate.

  The connection snapped.

  London-Elin stumbled onto her own kitchen floor in London. The silence was absolute. There was no echo of the rejection letter, no taste of burnt coffee. She was whole, singular, and entirely alone. The metaphysics held: she had never left. She had only ever visited a stranger who wore her face. And somewhere, in a world she could no longer touch, that stranger was crying without her.
