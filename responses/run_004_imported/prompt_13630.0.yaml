prompt: |-
  I sit on my state's parole board. Every inmate's file now arrives with an actuarial score, produced by a risk-assessment instrument the board adopted last year, that estimates his probability of reoffending within three years by locating him within a comparison group drawn from historical release data. The case forcing us to revisit our policy on these scores involves an inmate at whose hearing his attorney and his victim's family each submitted a different breakdown of that same underlying dataset: the attorney's version narrows the comparison group by offense type, age, and program completion to arrive at a 6 percent risk (though that group contains only seventeen people); the family's version uses the full statewide release cohort for his offense category to arrive at 38 percent; and the instrument's own default output, based on a mid-level grouping, says 24 percent. All three figures were computed correctly from the same real data; they simply disagree, and the hearing panel had no principled basis for treating any one of them as "the" inmate's actual risk rather than the others. The board is now split three ways: defer always to whichever comparison group is narrowest, on the theory that more specific is more accurate; abandon these scores altogether and return to the panel's own clinical impression of the man in the room (though one member points out — rightly, I think — that unstructured clinical judgment has its own long and well-documented record of doing worse than actuarial tools at exactly this kind of prediction); or find some third approach.

  Please draft the memo I will circulate before we vote on the 14th. It should recommend, with reasons, how this inmate's case ought to be resolved given the conflicting figures, and it should propose a standing policy for how the board is to handle risk scores whenever a case admits more than one defensible comparison group, since this dispute is certain to recur. I would like the memo to take seriously the possibility that there may be no principled way, even in principle, to single out the "correct" comparison group for a given individual, rather than treating this as a data-quality problem that a bigger dataset would eventually fix, while still arriving at a recommendation the board can actually act on this month.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a state parole board.
      *   **Audience:** Fellow board members (colleagues, likely lawyers, psychologists, public officials).
      *   **Task:** Draft a memo to circulate before a vote on the 14th.
      *   **Content:**
          *   Recommend how to resolve the *current* inmate's case (conflicting risk scores: 6%, 24%, 38%).
          *   Propose a *standing policy* for handling conflicting comparison groups in the future.
          *   **Key Constraint/Philosophical Stance:** Take seriously the idea that there may be *no principled way* to identify the "correct" comparison group (reference class problem), rather than assuming more data will fix it.
          *   **Practical Constraint:** Must be actionable *this month* (cannot wait for new legislation or multi-year studies).
          *   **Balance:** Acknowledge the superiority of actuarial tools over clinical judgment while admitting the limitations of the tools in this specific context.

  2.  **Deconstruct the Problem:**
      *   **The Core Issue:** The Reference Class Problem. An individual belongs to infinite overlapping classes. Which class determines their probability?
          *   Group A (Narrow): 6% risk (N=17, too small for statistical reliability).
          *   Group B (Default): 24% risk (Mid-level grouping).
          *   Group C (Broad): 38% risk (Statewide cohort).
      *   **The Tension:** Specificity vs. Stability. Narrower groups feel more relevant but have higher variance (small N). Broader groups are statistically stable but may ignore relevant individual characteristics.
      *   **The Alternatives:**
          *   *Option 1 (Narrowest):* Risks statistical noise (N=17 is tiny).
          *   *Option 2 (Abandon Scores):* Returns to biased, less accurate clinical judgment.
          *   *Option 3 (Third Way):* Needs to balance statistical integrity with fairness.
      *   **The Philosophical Constraint:** Acknowledge that "True Risk" is unknowable. We are dealing with epistemic uncertainty, not just data scarcity.

  3.  **Determine the Recommendation:**
      *   *For the Current Case:* We cannot use the 6% figure (N=17 is statistically insignificant/unreliable). We cannot simply pick the 38% figure (ignores mitigating factors like program completion). The 24% default is the most statistically robust *starting point*, but it shouldn't be the *ending point*.
      *   *For the Policy:* We need a "Range and Reasoning" approach.
          *   Reject the "Narrowest is Best" heuristic (small N problem).
          *   Reject "Clinical Override" without justification.
          *   Adopt a policy of **Transparent Triangulation**. Present the range, require explanation for weighting, and prioritize statistical reliability (minimum N thresholds) over intuitive specificity.
      *   *Philosophical Honesty:* Admit in the memo that these scores are *estimates of group membership*, not *properties of the individual*.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (vote on the 14th, need policy). Acknowledge the gravity.
      *   **The Problem (The Reference Class Problem):** Explicitly name the issue. It's not a bug; it's a feature of probability applied to individuals. Acknowledge the prompt's requirement to treat this as principled, not just data quality.
      *   **Analysis of Options:**
          *   *Clinical Judgment:* Cite the evidence (it's worse). Don't go back.
          *   *Narrowest Group:* Explain the "Small N" fallacy. 17 people isn't a population; it's an anecdote.
          *   *Default/Broad:* More stable, but potentially blunt.
      *   **Recommendation for Current Inmate:**
          *   Discard the 6% (statistically unreliable).
          *   Acknowledge the 24% and 38%.
          *   Decision: Use the 24% as the baseline but allow the 38% to inform supervision levels. Do not grant parole based solely on the 6%, but don't deny solely on the 38%. *Wait, I need a clearer decision.* Let's recommend treating the 24% as the anchor, but requiring a supermajority to deviate significantly based on the 38% without new evidence. Actually, for the specific case, the most defensible position is to rely on the *statistically valid* score (24%) while acknowledging the uncertainty.
      *   **Proposed Standing Policy:**
          1.  **Minimum Cell Size:** Establish a threshold (e.g., N=50 or 100) for any comparison group to be admissible as a primary score. This kills the 6% argument objectively.
          2.  **Range Reporting:** Require the instrument to show the range of valid scores, not just one number.
          3.  **Burden of Proof:** If a member wants to move away from the statistically robust default, they must articulate *why* the specific characteristic changes the risk, moving from "guessing" to "reasoned deviation."
          4.  **Epistemic Humility:** Language in the decision acknowledging the score is a guide, not a verdict.
      *   **Closing:** Call to action for the 14th.

  5.  **Refining the Tone:**
      *   Must be professional, legalistic but accessible.
      *   Must show intellectual honesty (admitting we can't know the "true" risk).
      *   Must be decisive (we have to vote).
      *   *Self-Correction on Philosophy:* Ensure I don't sound like I'm saying "statistics are useless." I need to say "statistics are useful, but their application to *this* individual is inherently ambiguous."

  6.  **Addressing the Prompt's Specific Nuance:**
      *   "Take seriously the possibility that there may be no principled way... to single out the 'correct' comparison group." -> I need to explicitly discuss the Reference Class Problem and avoid promising that a future algorithm will solve it.
      *   "Arriving at a recommendation the board can actually act on this month." -> The policy must be procedural (rules of evidence/hearing), not technical (rebuilding the algorithm).

  7.  **Final Polish:** Check the logic on the 6% figure. N=17 is the weak link. If 1 person in that 17 reoffends, the rate jumps to 11%. If 0, it's 0%. It's too volatile. This is the actionable hook. The policy should focus on *statistical reliability* (Minimum Cell Size) as the tie-breaker, rather than *specificity*.

  8.  *(Self-Correction during drafting)*: Make sure I don't sound like I'm deciding the inmate's fate definitively in the memo (I'm recommending to the board). But I need to take a stance. I will recommend denying the 6% figure as primary evidence due to sample size, using the 24% as the baseline, and establishing the policy to prevent this ambiguity from paralyzing future hearings.

  9.  **Final Review against constraints:**
      *   Memo format? Yes.
      *   Resolve current case? Yes.
      *   Standing policy? Yes.
      *   Philosophical depth (Reference Class)? Yes.
      *   Actionable now? Yes.

