answer: |-
  You are reading the text correctly, and your suspicion about the gap between the Thomistic source and the modern "rationalist" packaging of the Doctrine of Double Effect (DDE) is well-founded.

  Here is a breakdown of why your reading is accurate, what Aquinas is actually doing in that passage, and how it complicates the modern generalization of the doctrine.

  ### 1. Verification of Your Reading
  You are absolutely right: Aquinas explicitly restricts the **intention** of killing to those with public authority.

  For a private individual acting in self-defense:
  *   **Permissible Intention:** Self-preservation.
  *   **Foreseen but Unintended Effect:** The death of the aggressor.
  *   **Constraint:** If the private individual *intends* to kill the aggressor (even to save themselves), the act becomes unlawful.

  For a public authority (soldier, judge's minister):
  *   **Permissible Intention:** Killing the aggressor/foe.
  *   **Justification:** This is not merely self-defense; it is an act of justice directed toward the "common good."

  The popular truncation of the quote ("...if he repel force with moderation his defense will be lawful") isolates the **proportionality** and **intention/foresight** distinction while excising the **authority** constraint. By stopping early, modern presentations make it sound like *anyone* can perform an act that results in death, provided they "don't intend it." Aquinas adds a crucial caveat: *Unless you have public authority, you had better really not intend it, because you have no right to intend death at all.*

  ### 2. Does This Support the General-Purpose DDE?
  This is where your second question hits the nail on the head. The passage supports the **mechanism** of the DDE, but not necessarily the **general moral ontology** that modern rationalists often attach to it.

  #### The Mechanism vs. The Justification
  *   **The Mechanism:** Aquinas does establish that moral acts take their "species" (their moral identity) from what is intended, not from what is accidental (*praeter intentionem*). This is the engine of the DDE.
  *   **The Justification:** However, *why* this distinction matters for Aquinas is embedded in a specific theological and political framework that modern secular DDE often discards.
      *   **Natural Law Teleology:** Aquinas argues self-preservation is natural ("natural to everything to keep itself in 'being'").
      *   **Monopoly on Violence:** The prohibition on intending death for private citizens is not just about "clean hands"; it is about the structure of justice. For Aquinas, killing is inherently an act of justice (removing a threat to the order of the community). Private citizens do not administer justice; they preserve themselves. Public authorities administer justice; they may therefore intend the removal (killing) of threats.

  #### The Generalization Problem
  When rationalists apply DDE to the Trolley Problem, they usually treat it as a freestanding principle of rational consistency: *"It is rational to distinguish between intended means and foreseen side-effects."*

  Aquinas's text suggests a narrower claim: *"It is unlawful for a private person to intend death because they lack the authority to judge that a life should be taken, even if the physical act of defense is the same."*

  If you remove the "public authority" premise (as secular ethics usually does), the force of the argument changes.
  *   **In Aquinas:** A private person cannot intend death because they lack the *jurisdiction* over life and death.
  *   **In Modern DDE:** A person cannot intend death (often) because intending evil is inherently corrupting to the will, or because rights-violations cannot be intended.

  So, does the passage support the general-purpose doctrine? **Only partially.** It provides the classic *example* of the distinction, but it relies on premises (the sinfulness of private homicide, the role of the state) that do not automatically transfer to a secular trolley scenario where no "public authority" exists.

  ### 3. Implications for the Trolley Problem
  Your observation exposes a potential category error in how the Trolley Problem invokes Aquinas.

  In the standard "Switch" case (divert a trolley to kill one to save five), modern DDE proponents often argue this is permissible because the death of the one is a "side effect" of saving the five, not the means.

  However, if we apply Aquinas's specific restriction from II-II, Q. 64, Art. 7:
  1.  **Private Authority:** The switch-puller is a private individual.
  2.  **Intention:** If the switch-puller thinks, "I must kill this one person to stop the trolley," they have intended death.
  3.  **Verdict:** For Aquinas, a private individual intending the death of another (even to save others) is unlawful, because they are usurping the role of public authority/justice.

  Aquinas's framework is much stricter than the modern "Mangan" formulation. The modern formulation asks: *Is the bad effect the means?* Aquinas asks: *Do you have the standing to intend this effect at all?*

  For Aquinas, the "means" condition and the "authority" condition are linked. If you lack the authority to intend death, then making death the "means" is doubly forbidden. But even if death is a "side effect," you must ensure your internal intention remains strictly on preservation, not on the elimination of the threat *via* death.

  ### 4. Why the Truncation Happens
  The truncation you noticed likely occurred during the secularization of Catholic moral theology in the 20th century.
  *   **Catholic Casuistry:** For centuries, theologians used this text to discuss war, abortion, and self-defense, keeping the "public authority" clause relevant (e.g., just war theory relies on legitimate authority).
  *   **Analytic Philosophy:** When philosophers like Philippa Foot and Judith Jarvis Thomson revived the DDE in the 1960s/70s, they were interested in the **structure of moral reasoning**, not Thomistic political theology. They extracted the "intention vs. foresight" distinction because it was a useful tool for distinguishing cases (e.g., Loop Variant vs. Standard Switch), but they left behind the metaphysical baggage regarding who is allowed to intend what.

  ### Conclusion
  You are correct. The text supports a **narrower claim** than the one usually attributed to it.
  1.  **Yes,** you are reading it correctly: Private individuals may not intend to kill, even in self-defense; only the act of defense is intended.
  2.  **No,** the passage does not fully support the general-purpose DDE as a universal rational principle. It supports a specific moral theology where the permissibility of an intention is contingent on one's role in the cosmic and political order.

  The modern "tidy packaging" treats the intention/foresight distinction as a **sufficient** condition for permissibility (provided proportionality holds). Aquinas treats it as a **necessary** condition for private citizens, but one that operates within a framework where the *right to intend death* is not universally distributed. Recognizing this doesn't necessarily invalidate the DDE, but it does suggest that using Aquinas to justify it requires acknowledging that his moral universe is far more hierarchical and teleological than the one assumed in most rationalist forums.
