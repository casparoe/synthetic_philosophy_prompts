      *   **The System Design:** Why did the model have the *capacity* to promise an escalation if no tool exists? This is a *grounding* issue (RAG/Tool Use), not just a safety or training issue.
      *   **T&S Process:** They are arguing semantics instead of severity. T&S should focus on *impact*, not just ontology.
