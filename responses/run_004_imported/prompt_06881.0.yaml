      *   *Hyperbolic Discounting:* Behavioral economics concept. Describes how people value immediate rewards much more highly than future rewards, inconsistent over time (time-inconsistent preferences).
      *   *The Comparison:* They describe the same *phenomenon* (choosing short-term gratification over long-term well-being).
      *   *The "Solved" Claim:* Did economists "solve" it? They modeled it mathematically (Laibson, O'Donoghue & Rabin, etc.). Does math *solve* the human experience of it? No. It describes the *pattern*, not necessarily the *cure*.
