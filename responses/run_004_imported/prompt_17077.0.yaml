  **Machery's trade-off hypothesis:** This account ranks highly because it specifically explains the cost-versus-bonus evidence and intentionality asymmetries, though it offers a less natural fit for statistical norm violations and knowledge attributions than norm-based theories.
  **Sripada's Deep Self Concordance model:** This model explains intentionality judgments well via agent values but struggles to account for asymmetries driven by statistical norms that do not reflect the agent's stable moral character.
  **Knobe's own account:** While foundational for the original moral asymmetry, the specific claim that moral valence is constitutive of intentionality fails to generalize to the non-moral norm and knowledge evidence cited.
  **Alicke's culpable-control model:** This theory effectively explains blame-driven moral judgments but cannot account for the asymmetry in cases involving conventional or statistical norms where no culpability is at stake.
  **Nadelhoffer's account:** This explanation is poorly supported because empirical studies generally fail to show that affect distorts perceived foreknowledge enough to drive the intentionality judgment.
  **Adams and Steadman's pragmatic account:** This theory is ranked lowest because experimental controls demonstrate the asymmetry persists even in contexts where conversational implicatures are removed.
