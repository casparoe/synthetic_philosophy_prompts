prompt: |-
  I'm a novelist, and something in Nelson Goodman's Languages of Art has been nagging at me. He calls painting "autographic": even an undetectable copy of a painting is a forgery, because what makes a painting genuine is its history of production. He calls literature "allographic": since a text is fully specified by its sequence of words, a letter-for-letter copy is just another authentic instance of the work, not a forgery, whatever its provenance. That seems basically right, yet literary history keeps handing us cases we call forgeries without hesitation — William Henry Ireland forging Shakespeare's handwriting and passing off his own play, Vortigern and Rowena, as a newly discovered Shakespeare work that collapsed into farce within months of its 1796 premiere once the hoax broke, or James Macpherson passing off his own verse as translations of a bard, Ossian, who probably never existed. The words on the page never changed; only our beliefs about their origin did, and that was enough to destroy both works' standing. If a text can't be forged the way a painting can, what was actually being faked in these cases, and does Goodman's framework survive contact with them or need real revision? I'd like you to work through the actual mechanics, not just restate the general theory.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **User:** Novelist (implies a practical, creative, perhaps slightly skeptical but intellectually rigorous perspective).
      *   **Topic:** Nelson Goodman's *Languages of Art*, specifically the autographic/allographic distinction.
      *   **The Problem:** Goodman says literature is allographic (text = work, provenance doesn't matter for authenticity), but history is full of literary forgeries (Ireland's Shakespeare, Macpherson's Ossian) where provenance *did* matter immensely.
      *   **The Question:** What was actually being faked in these literary cases? Does Goodman's framework survive, or does it need revision?
      *   **Constraint:** Work through the *actual mechanics*, not just restate the theory.

  2.  **Deconstruct Goodman's Distinction:**
      *   *Autographic:* The work's identity depends on its history of production (e.g., a painting). Even a perfect copy is a forgery if it lacks the right causal chain to the artist.
      *   *Allographic:* The work's identity depends on compliance with a notation system (e.g., musical score, literary text). If it matches the notation, it's an instance of the work. Provenance is irrelevant to *identity*.
      *   *Goodman's Defense:* He anticipates the forgery objection. He argues that in literature, we aren't forging the *work* (the text), we are forging the *manuscript* (the physical object) or the *attribution* (the claim of authorship).

  3.  **Analyze the Counter-Examples (Ireland & Macpherson):**
      *   *William Henry Ireland:* Wrote *Vortigern and Rowena*. Claimed it was Shakespeare.
          *   Textually: It's a play.
          *   Fraud: Claiming Shakespeare wrote it.
          *   Outcome: When revealed as Ireland's, it stopped being "Shakespeare's *Vortigern*" and became "Ireland's *Vortigern*."
      *   *James Macpherson:* Wrote *Ossian*. Claimed it was translated from ancient Gaelic.
          *   Textually: It's poetry.
          *   Fraud: Claiming ancient origin/translation.
          *   Outcome: When revealed as Macpherson's, it stopped being "Ancient Ossian" and became "Macpherson's Ossian."

  4.  **Evaluate the Conflict:**
      *   Goodman would say: The *work* is the text. If the text is the same, the work is the same. Therefore, Ireland didn't forge a Shakespeare work; he created a new work (Ireland's play) and lied about its class membership (Shakespeare's corpus).
      *   The User's intuition: But the *value* and *status* of the work collapsed. If the work is just the text, why did the revelation change the work's standing so drastically?
      *   *Key Insight:* Goodman distinguishes between *authenticity of the work* (allographic) and *authenticity of the production/history* (autographic aspects attached to the allographic work).
      *   *Refinement:* In literary forgery, we aren't usually forging an *instance* of a known work (like printing a fake first edition of *Hamlet*). We are forging the *genesis* of a *new* work to make it belong to a specific *class* (Shakespeare's oeuvre).

  5.  **Develop the Argument (Mechanics of the Forgery):**
      *   **Mechanism 1: The Work vs. The Corpus.** Goodman defines a "work" as a class of inscriptions compliant with a notation. But readers care about the "Corpus" (the set of works by Author X). Ireland didn't forge *Hamlet* (an existing allographic work); he tried to insert a *new* inscription class into the *Shakespeare Corpus*. The forgery is about *class membership*, not *textual identity*.
      *   **Mechanism 2: The Aesthetic Predicate.** We read differently based on authorship. "Shakespearean" is an aesthetic predicate. If I think it's Shakespeare, I look for depth, irony, Elizabethan context. If I think it's Ireland, I look for imitation, pastiche, anachronism. The *text* didn't change, but the *perceived properties* did. Goodman acknowledges this in his discussion of "aesthetic symptoms," but maintains the *identity* of the work remains textual.
      *   **Mechanism 3: The Manuscript as Autographic Object.** Ireland didn't just type the play; he aged the paper, faked the handwriting. He was forging an *autographic artifact* (the manuscript) to support the claim about the *allographic work*. Goodman allows that manuscripts are autographic.
      *   **Mechanism 4: Performance/Interpretation.** In theater (like *Vortigern*), the work is realized in performance. If the script is allographic, why did the production fail? Because the *context* of the performance was a lie. The audience's engagement relies on the "game" of witnessing Shakespeare.

  6.  **Assess Goodman's Framework:**
      *   *Does it survive?* Yes, technically. Goodman is precise about *identity conditions*. The text *is* the work.
      *   *Does it need revision?* It feels incomplete regarding *value* and *interpretation*. Goodman cares about ontology (what *is* it?), not axiology (what is it *worth*?). The novelist cares about the latter.
      *   *Synthesis:* The forgery isn't of the *text* (allographic), it's of the *history of production* (autographic) attached to that text. Literary forgery is a hybrid crime. It treats an allographic object as if its history matters.

  7.  **Drafting the Response (incorporating the Novelist Persona):**
      *   *Tone:* Respectful, analytical, engaging with the craft of writing.
      *   *Structure:*
          1.  Validate the intuition (it's a classic objection).
          2.  Clarify Goodman's specific definitions (Work vs. Instance vs. Corpus).
          3.  Dissect the Ireland/Macpherson cases mechanically.
          4.  Identify the "Hybrid" nature of literary forgery (faking the history of an allographic object).
          5.  Discuss the "Aesthetic Consequence" (why the text feels different).
          6.  Conclusion: Goodman survives ontologically, but fails phenomenologically.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "Goodman is right." The user asks if it needs revision. I should argue that while the *ontology* holds, the *theory of art* requires expanding to include the "author function" (Foucault might be a useful shadow here, though keep focus on Goodman).
      *   *Focus:* Stick to the mechanics. How does the forgery operate? It operates on the *label*, not the *inscription*.
      *   *Nuance:* Distinguish between "forging a copy of *Hamlet*" (allographic, not really a forgery of the work, just a pirate copy) vs. "forging a new play by Shakespeare" (attributive forgery). Ireland did the latter.

  9.  **Final Polish:** Check against the prompt's requirements.
