  10. **Final Plan:**
      *   Intro: Acknowledge the tension.
      *   Section 1: Goodman's Ontological Knife (Work vs. History).
      *   Section 2: The Mechanics of the Ireland/Macpherson Hoax (Attribution vs. Inscription).
      *   Section 3: The "Author" as Part of the Notation? (Expanding the system).
      *   Section 4: The Aesthetic Shift (Why the text changes without changing).
      *   Conclusion: Goodman is right about *what* it is, wrong about *how it works* for us.

