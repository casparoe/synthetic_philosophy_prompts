answer: |-
  This is one of the most persistent and fruitful objections to Goodman's *Languages of Art*. As a novelist, your intuition is hitting on something Goodman deliberately sidelines: the difference between the *ontology* of the work (what it *is*) and the *sociology* of the work (how it *functions*).

  Goodman's distinction is ontological. He is asking: "What are the necessary and sufficient conditions for an object to be an instance of Work X?"
  *   **Painting:** The history of production is necessary. (Autographic)
  *   **Literature:** Compliance with the text is sufficient. (Allographic)

  When you point to Ireland or Macpherson, you are pointing out that literary *value* and *meaning* seem to depend on history, just like painting. If Goodman is right, why does *Vortigern* become "trash" the moment we learn Ireland wrote it, even though the text didn't change?

  To work through the mechanics, we have to separate three distinct layers that literary forgery conflates: the **Inscription**, the **Corpus**, and the **Artifact**.

  ### 1. The Mechanics of the Fraud: Inscription vs. Corpus

  Goodman would argue that Ireland and Macpherson did not forge a *work* in the strict sense; they forged an *attribution*.

  If I print a copy of *Hamlet* on my home printer and sell it as a 1603 Quarto, I am forging a physical **artifact**. I am lying about the history of *this piece of paper*. But I am not forging the *work* "Hamlet," because the text complies with the notation of "Hamlet."

  Ireland and Macpherson did something more complex. They didn't claim to have found an old copy of a known text. They introduced a **new inscription class** (a new text) and claimed it belonged to an existing **Corpus** (Shakespeare's oeuvre, Ancient Gaelic tradition).

  *   **Goodman's View:** The "work" is the class of all inscriptions compliant with that text. Ireland's text is compliant with *itself*. Therefore, the work is "Ireland's *Vortigern*." The fraud was claiming this work was a member of the class "Shakespeare's Works."
  *   **The Mechanic:** The forgery wasn't in the *allographic* structure (the words); it was in the *metadata* attached to the work.

  In this strict sense, Goodman's framework survives. The text *is* the work. *Vortigern* the text exists. But the claim "This text was generated by Shakespeare's hand/mind" is a historical claim about production. Since literature is allographic, that historical claim is irrelevant to the *identity* of the work, but crucial to its *classification*.

  ### 2. The Manuscript as Autographic Anchor

  However, your examples involve physical deception. Ireland didn't just submit a typescript; he aged the paper, used period ink, and mimicked Shakespeare's handwriting. Macpherson claimed to possess ancient Gaelic manuscripts (which he largely didn't).

  Here, the forgery *does* become autographic.
  *   **The Manuscript:** A unique physical object. Its value depends entirely on its history of production (Did Shakespeare touch this paper?). This is autographic.
  *   **The Text:** The sequence of words. This is allographic.

  Ireland was forging the **manuscript** (autographic) to validate the **text** (allographic). He understood that while the *work* is allographic, the *market* treats the manuscript as the holy relic. He was trying to convert an allographic object into an autographic one by faking its history of production.

  Goodman accounts for this. He admits that manuscripts are autographic. But he insists the *literary work* is not the manuscript. So, technically, when the hoax was revealed, the *manuscript* became a forgery (a fake Shakespeare relic), but the *play* remained a genuine instance of *Vortigern*—it just ceased to be an instance of *Shakespeare's Play*.

  ### 3. Where Goodman's Framework Strains: The "Author" as Notation

  Here is where your novelist's instinct exposes a crack in Goodman's wall. Goodman treats the "text" as a sequence of words governed by a spelling/syntax notation. But in literature, is the "Author" part of the notation system?

  When we read a text, we are not just processing characters. We are processing **voice**.
  *   If I read a sentence, "To be or not to be," I process it as Shakespearean.
  *   If I read a sentence, "I am not a crook," I process it as Nixonesque.

  Goodman assumes the notation system (alphabet, grammar) is fixed and neutral. But literary reception relies on a **stylistic notation** that includes authorship. When Macpherson published *Ossian*, the "work" wasn't just the words; it was "Words + Ancient Provenance."

  If we revise Goodman slightly, we might say that in literature, the **Corpus** functions like an autographic history.
  *   **Painting:** The history is causal (brushstrokes by Hand X).
  *   **Literature:** The history is stylistic/causal (patterns generated by Mind X).

  When Ireland wrote *Vortigern*, he failed the stylistic notation test. The "spelling" of the style didn't match the "Shakespeare" corpus. The audience didn't just reject it because of the biographical reveal; they rejected it because, once primed to look for Ireland, the stylistic notation became legible as "imitation" rather than "generation."

  Goodman resists this. He argues that aesthetic properties (like "being Shakespearean") are not inherent to the work but are projections we place upon it. He would say the text *didn't change*, only our perception did.

  ### 4. The Aesthetic Consequence: Why the Text *Does* Change

  This is the crux for a novelist. If I tell you a poem is by Keats, you read it with a certain attention to romantic sublimity. If I tell you it was written by me yesterday, you might read the same lines as pastiche.

  Goodman calls these "aesthetic symptoms." He admits the experience changes, but maintains the *object* of the experience (the work) remains the same.

  But consider the mechanics of **performance** (specifically regarding *Vortigern*).
  A play is not just text; it is a script for performance. The performance relies on a contract between stage and audience.
  *   **Contract A:** We are gathering to witness a channeling of Shakespeare.
  *   **Contract B:** We are gathering to witness a new play by Mr. Ireland.

  When the contract switched from A to B, the *performance* failed. Why? Because the text was written to satisfy Contract A. The rhetorical flourishes, the archaic diction—they function as "Shakespearean" only within the context of Contract A. Within Contract B, they function as "mock-Shakespearean."

  Does this mean the work changed?
  *   **Goodman:** No. The inscription is identical.
  *   **Novelist:** Yes. Because the *function* of the words shifted. A word in a forgery functions as a *lie*. A word in a genuine work functions as an *expression*.

  If a word's function is part of its identity, then the work *has* changed. This suggests Goodman's allographic definition is too narrow. It defines the work as **Inscription**, but the work is actually **Inscription + Context**.

  ### 5. Does the Framework Need Revision?

  Goodman's framework survives **ontologically** but fails **phenomenologically**.

  1.  **Ontologically (What it is):** Goodman is right. *Vortigern* is not a forgery of a Shakespeare work, because no such work existed to forge. It is a genuine work by Ireland, falsely labeled. The text remains authentic to itself. The "forgery" is in the label, not the letters.
  2.  **Phenomenologically (How it works):** Goodman is wrong to dismiss the history of production as irrelevant to the *artistic* identity. In literature, the "history of production" (i.e., who wrote it and when) is a constitutive element of the aesthetic experience, just as the brushstroke is in painting.

  **The Revision:**
  We need to treat literary authorship not as external metadata, but as an **internal constraint of the notation system.**

  In painting, the notation is open (any mark can be a painting). In literature, the notation is closed (letters/words). But the *genre* of "Shakespeare Play" has its own notation rules, one of which is "Generated by Shakespeare."
  *   Ireland's text complied with the *linguistic* notation (English).
  *   It failed to comply with the *corpus* notation (Shakespearean stylistic generation).

  Therefore, literary forgery is a **category error** masquerading as an **ontological forgery**. Ireland tried to pass off a work from Category B (18th-century pastiche) as Category A (16th-century original).

  ### Conclusion for the Novelist

  Goodman's distinction holds up if you are a librarian cataloging objects. It breaks down if you are a reader experiencing art.

  *   **What was being faked?** Not the text (allographic), but the **causal chain of creativity** (autographic). Ireland was faking the *genesis*, not the *product*.
  *   **Does Goodman survive?** His ontology survives, but his theory of art is too sterile. He separates the "work" from the "world" too cleanly.
  *   **The Revision:** We should view literature as **hybrid**. The text is allographic, but the *authorship* is an autographic property attached to the text. When you forge a book, you are attaching a false autographic history to an allographic object.

  The reason *Vortigern* collapsed isn't just that the audience felt cheated. It's that the text *could not sustain the weight of the false history*. The words were doing a job (imitating Shakespeare) that they could only do as long as the lie held. Once the lie broke, the words stopped being "Shakespearean imitation" and became "Ireland's original." The work didn't vanish, but its *aesthetic center of gravity* shifted entirely.

  Goodman tells us *what* the work is (text). You are reminding us that the work is also *where it comes from*. In literature, provenance isn't just history; it's part of the syntax.
