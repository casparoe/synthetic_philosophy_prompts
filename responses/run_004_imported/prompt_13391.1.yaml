answer: |-
  Ian Hacking visits a retired experimentalist to discuss his latest paper on cosmological fine-tuning.

  **Hacking:** "I'm afraid your multiverse reply commits the Inverse Gambler's Fallacy. You walk into the casino, see a double-six, and infer there must have been a thousand prior rolls. You can't infer the existence of other universes just because this one permits life."

  **Physicist:** "I'm not inferring the rolls to explain the dice, Ian. I'm inferring them to explain the logbook."

  **Hacking:** "That's just Leslie's firing squad. You're saying if the dice hadn't rolled six, you wouldn't be here to record it."

  **Physicist:** "Close. But in the firing squad, the misses make a bang. In the multiverse, the misses make no observers."

  **Hacking:** "So you claim the data is biased?"

  **Physicist:** "Not the data. The authorship. It's the only branch of physics where the null results can't submit peer reviews."
