      *   *Method:* Elenctic (refutational). He doesn't prove LNC directly; he shows the opponent *cannot speak* without presupposing it.
      *   *Core Move:* Signification (*semainein*). To say something is to signify *one thing* (a definite nature).
      *   *The Trap:* If I say "man," I signify "two-footed animal." If I deny LNC, "man" could also mean "not-man" (e.g., trireme). If words signify everything and its opposite, speech is impossible. There is no thought, only vegetation.
      *   *Crucial Nuance:* Aristotle isn't just saying "contradictions are false." He's saying "meaning requires determinacy." If $A$ and $\neg A$ are both true of the same subject in the same respect, language collapses.

  3.  **Deconstruct Priest's Dialetheist Challenge:**
