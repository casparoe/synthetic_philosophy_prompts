      *   **The Argument:** SR's relativity of simultaneity undermines Endurantism (which requires a "wholly present" object at a moment) because there is no absolute "moment." Perdurantism (4D worm) fits SR better because the worm is invariant, and "nows" are just slices.
      *   **Specific Questions:**
          1.  Is the core argument valid, or does it beg the question?
          2.  What is the standard Endurantist comeback?
