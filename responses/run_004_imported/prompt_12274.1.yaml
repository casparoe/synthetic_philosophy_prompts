answer: |-
  **MEMORANDUM**

  **TO:** Tribal Enrollment Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Application [ID #] and Review of Blood Quantum Statutes

  **PURPOSE**

  The purpose of this memo is to provide a recommendation regarding the pending enrollment application of [Applicant Name], and to address the broader statutory conflict this case has illuminated. We are faced with an applicant whose lineal descent is verified through a full-blood great-grandmother on the base roll, but whose blood quantum calculates to 1/8, falling below the 1/4 requirement mandated by our current Constitution.

  This is not merely a bureaucratic hurdle. It is a fundamental question of who we are as a nation, how we protect our resources, and how we intend to survive the next century. After reviewing the testimony, the legal constraints, and the historical context, I am submitting the following recommendation for the Committee's vote.

  **THE CORE CONFLICT**

  The Committee is currently divided between two positions. To move forward, we must ensure we are not arguing past one another. Both sides of this debate rest on valid concerns regarding tribal sovereignty and survival.

  **Position 1: Adherence to Current Blood Quantum Standards**
  *The Argument for Stability and Fiduciary Duty*

  Those advocating to deny the application based on current statutes are not simply "protecting per-capita checks." The strongest version of this argument is about **legal certainty and sovereign integrity.**

  Our Constitution is the supreme law of this tribe. It was ratified by the people to provide a clear, objective standard for membership. When the Enrollment Committee bypasses the Constitution—even for sympathetic cases—we undermine the Rule of Law. If we make an exception here, we open the door to accusations of favoritism in future cases. How do we deny the next applicant who is 1/16? Or the one with no base roll ancestor but a strong cultural tie?

  Furthermore, we have a fiduciary duty to the current citizenry. Our healthcare, housing, and education budgets are finite. Unchecked enrollment growth dilutes these resources for everyone, potentially triggering a crisis where the tribe cannot meet its treaty obligations to those already on the roll. There is also a historical memory among our elders of rolls being manipulated in the past. A rigid, mathematical standard protects against accusations that the rolls are being "cleaned" or manipulated for political gain. In short: The blood quantum rule, however flawed, is a locked door. If we pick the lock, we lose the ability to secure the house.

  **Position 2: Lineal Descent and Cultural Continuity**
  *The Argument for Sovereignty and Decolonization*

  Those advocating for approval argue that blood quantum is not a traditional Indigenous concept, but a colonial tool imported by the Bureau of Indian Affairs during the Allotment Era. Its original design was not to protect tribes, but to mathematically "breed us out" of existence by diluting bloodlines until we ceased to be legally Indian.

  By enforcing a 1/4 cutoff, we are inadvertently finishing the work of the federal government. We are excluding our own descendants. The strongest version of this argument is that **citizenship should be political, not biological.** In most nations, citizenship is determined by lineage (who your parents are) and participation (your commitment to the community), not by a blood test. A member who attends council, volunteers, and lives in the community contributes more to the tribe's survival than a 1/2 blood member who lives overseas and never engages. By prioritizing genetics over participation, we risk becoming a genetic archive rather than a living nation.

  **THE SOVEREIGNTY QUESTION**

  A housemate of mine, who studies political theory, framed this for me recently. She noted that this is a version of a debate nations have about borders. A country must have the right to exclude others; without that right, it has no sovereignty. But a country also has the right to decide *how* it draws that border.

  Right now, we are using a border drawn by the federal government in the 1930s. Position 1 says we must guard that border strictly to maintain order. Position 2 says we have the sovereign right to move that border to a place of our own choosing. Both sides agree we need a border. The disagreement is about who drew the map we are using.

  **RECOMMENDATION**

  I recommend that the Enrollment Committee take the following two-step action:

  1.  **Deny the current application** based on strict adherence to the existing Constitutional requirement of 1/4 blood quantum.
  2.  **Simultaneously refer the Blood Quantum clause to the Tribal Council** with a formal recommendation to initiate a Constitutional Amendment process regarding enrollment criteria.

  **RATIONALE**

  **Why Deny the Application?**
  We cannot approve this application under the current laws. To do so would be *ultra vires*—beyond our legal authority. If we approve her, we expose the tribe to litigation from past applicants who were denied under the same rules. We would be violating our oath to uphold the Constitution. Denying her is not a judgment on her identity or worth; it is an acknowledgment that this Committee enforces the law as it exists, not as we wish it to be. To do otherwise undermines the very sovereignty Position 1 seeks to protect.

  **Why Refer the Rule for Review?**
  Denying the application solves the legal problem but ignores the moral and existential one. If we simply deny her and stop there, we perpetuate a system designed to reduce our numbers. By formally recommending a Constitutional Review, we validate the concerns of Position 2. We acknowledge that while we must follow the law *today*, the law itself may need to change *tomorrow*.

  This path allows for a community-wide conversation. A Constitutional Amendment requires a vote of the general membership. This means the people—not this Committee—will decide if they want to shift from Blood Quantum to Lineal Descent. This protects the Committee from accusations of favoritism (we didn't change the rule for one person; we asked the people if they want to change it for everyone) while addressing the long-term viability of the tribe.

  **CONDITIONAL STATUS (ALTERNATIVE CONSIDERATION)**
  Some have suggested creating a "conditional" or "associate" membership for this applicant. I advise against this. Creating a two-tiered citizenship often leads to internal stratification and resentment. It is cleaner to have a clear "yes" or "no" determined by the Constitution than to create a new class of members without a legal framework to support their rights and responsibilities.

  **NEXT STEPS**

  If the Committee accepts this recommendation, I propose we:
  1.  Vote to deny Application [ID #] based on non-compliance with Article [X], Section [Y] of the Constitution.
  2.  Draft a formal resolution to the Tribal Council outlining the demographic reality: that a significant portion of our descendants (including children of current members) will be ineligible within two generations under current statutes.
  3.  Request the Council form a ad-hoc committee to draft amendment language for the next General Council meeting.

  **CONCLUSION**

  This recommendation asks us to hold two truths at once: We must respect the law as it stands to maintain order, but we must also have the courage to change that law to ensure our future. Denying this applicant is painful, particularly for those of us in intermarried families who see our own children in her position. But the only way to help them legitimately is not to break the rules, but to change them through the proper sovereign channels.

  I look forward to discussing this in our next session.
