  5.  **Address Question 3: Fatal Flaw vs. Fixable Bug:**
      *   Why not just accept a hierarchy (Frege's indirect sense)?
      *   Russell's goal in "On Denoting" is to eliminate *meanings* (entities) entirely in favor of a logical analysis where denoting phrases have no meaning in isolation (only the proposition has meaning).
