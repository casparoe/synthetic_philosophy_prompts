prompt: |-
  I'm teaching a graduate seminar on medieval political philosophy this term, and last week we spent a long session picking apart Aquinas's actual position on tyrannicide -- De Regimine Principum, the relevant bit of his commentary on the Sentences, and the question on sedition in the Summa. What struck the class is how much more cautious he actually is compared to the "Aquinas said its fine to kill bad kings" version that gets passed around in intro classes -- he's pretty wary of private individuals taking it on themselves to kill a tyrant, seems to want any deposing done by whatever public authority set the ruler up in the first place, and keeps circling back to the worry that a botched or unauthorized tyrannicide could produce more disorder and suffering than the tyranny it's replacing.

  That's the background for a question one of my students asked that I couldn't answer well on the spot, and it's been bugging me since. Say a tyrant today gets taken out by a drone strike ordered by some other country's government, maybe with a nod of approval from the UN Security Council -- so not a lone assassin, but also not any authority that the tyrannized population itself set up or answers to. Does that count as the kind of "public authority" action Aquinas thinks can licitly depose a tyrant, given that his own examples all seem to assume some authority internal to the same community (a council, the barons, a liege lord within the same political order)? Or is a foreign power acting on a population's behalf just a structurally different case that his framework doesn't really have the resources to adjudicate one way or another? I'd love an answer that actually works through how his argument hangs together rather than just citing the "yes tyrannicide can be ok" headline.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A graduate seminar instructor in medieval political philosophy.
      *   **Context:** They just taught a nuanced session on Aquinas and tyrannicide (De Regimine Principum, Sentences commentary, ST II-II, Q. 42, Q. 64). They correctly identified the standard "Aquinas supports tyrannicide" narrative as oversimplified. Aquinas is cautious, emphasizes public authority, and worries about greater evils.
      *   **Student's Question:** Does a foreign drone strike (authorized by another state/UN) count as "public authority" in Aquinas's framework for deposing a tyrant? Or is this outside his framework?
      *   **Requirement:** The answer needs to work through Aquinas's argument structure (metaphysics, teleology, jurisprudence) rather than just giving a "yes/no" headline. It needs to respect the nuance the instructor already demonstrated.

  2.  **Deconstruct Aquinas's Position on Tyrannicide/Deposition:**
      *   *Sources:* *De Regno* (De Regimine Principum) I.6, *Summa Theologiae* II-II, Q. 42 (Sedition), Q. 64 (Killing), and *In II Sent.*, d. 44, q. 2, a. 2.
      *   *Key Distinction:* Private vs. Public Authority.
      *   *Private:* Generally forbidden. Risk of greater disorder, usurpation of judgment, violation of the natural order of subjection.
      *   *Public:* Permissible *if* certain conditions are met. Who constitutes "public authority"?
          *   In *De Regno*: It's the community or a superior authority (like the Emperor over a King).
          *   In *ST*: Emphasis on not causing greater turmoil.
      *   *Teleology:* The end of government is the common good. Tyranny frustrates this end.
      *   *Jurisprudence:* Authority comes from God (Romans 13), but is mediated through human law/compact. If a ruler violates the compact, the authority relationship changes.

  3.  **Analyze the "Foreign Power/Drone Strike" Scenario:**
      *   *Actor:* Foreign state (not internal superior, not internal community).
      *   *Authorization:* UN Security Council (international body).
      *   *Beneficiary:* The tyrannized population.
      *   *Method:* Targeted killing (modern tech, but functionally assassination/execution).

  4.  **Evaluate the Scenario against Aquinas's Framework:**
      *   *The "Public Authority" Problem:* For Aquinas, political authority is particular, not universal (except for the Emperor in his context, or the Pope spiritually). A foreign king is not the *superior* of another king in the same way an Emperor is over a vassal. They are peers.
      *   *The "Common Good" Problem:* The foreign power's primary obligation is to *its own* common good. Intervening elsewhere risks neglecting its own people or causing unjust war.
      *   *The "Disorder" Problem:* Aquinas's biggest worry is that removing a tyrant leads to factionalism or worse tyranny. Foreign intervention often leads to occupation, instability, or resentment (modern context, but fits the principle).
      *   *The "UN" Problem:* Aquinas has no concept of international law or supranational bodies. The closest analog might be the Church or the Empire, but neither fits the UN perfectly.
      *   *Just War Theory:* This is the better Aquinas lens. Foreign intervention is an act of war. Does it meet *jus ad bellum*? (Just cause, right intention, proper authority).
          *   *Proper Authority:* The foreign sovereign has authority over *their* troops, but do they have jurisdiction over the *target*?
          *   *Just Cause:* Defense of innocents? Aquinas allows war to punish evil.

  5.  **Synthesize the Argument:**
      *   *Thesis:* Aquinas's framework doesn't directly map onto modern international relations, but applying his *principles* suggests he would be highly skeptical, though not necessarily absolutely opposed, depending on how "public authority" is construed.
      *   *Point 1: Jurisdiction and Hierarchy.* Aquinas thinks in terms of organic hierarchies. A foreign king is not a "superior" in the *De Regno* sense. He is an external agent. This makes it closer to private violence *from the perspective of the tyrannized community*, unless viewed through Just War.
      *   *Point 2: The Risk of Greater Evil.* This is Aquinas's pragmatic brake. Foreign intervention often creates power vacuums. Aquinas would weigh the certainty of tyranny against the probability of chaos/occupation.
      *   *Point 3: The "Public" Nature of the UN.* Aquinas requires the action to be for the *common good*, not private gain. If the UN represents a broader "public," does it count? Probably not for Aquinas, as political community is local/national.
      *   *Point 4: Just War as the Better Category.* Instead of "tyrannicide," frame it as "punitive war." Aquinas allows sovereigns to wage war to punish evil. If the tyrant is a threat to peace (even internally), does it spill over?
      *   *Conclusion:* It's structurally different. Aquinas lacks the resources for *international* public authority. He would likely treat it as a Just War question rather than a tyrannicide question.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic, collegial, respectful of the instructor's expertise.
      *   *Structure:*
          1.  Validate the instructor's reading (Aquinas is indeed cautious).
          2.  Identify the core tension: Internal vs. External Authority.
          3.  Analyze via *De Regno* (Hierarchy).
          4.  Analyze via *Summa* (Sedition/Order).
          5.  Shift to Just War Theory (The more applicable framework).
          6.  Address the "UN" aspect (Anachronism).
          7.  Final verdict: Category error, but principles suggest skepticism.

      *   *Refining the "Public Authority" point:* In *De Regno*, Aquinas mentions that if a king is elected by the people, the people can depose him. If he is appointed by a superior (Emperor), the superior can depose him. A foreign king is neither. So, strictly speaking, it's not the *De Regno* mechanism.
      *   *Refining the "Just War" point:* In ST II-II, Q. 40, Aquinas says sovereigns can wage war to punish evil. If the tyrant is harming his people, is that a cause for *another* sovereign? Only if it violates natural law universally or threatens peace.
      *   *Refining the "UN" point:* The UN is not a sovereign. It has no sword of its own. For Aquinas, authority requires the power to coerce.

  7.  **Final Polish:** Ensure the distinction between *tyrannicide* (internal removal) and *intervention* (external removal) is clear. Emphasize that for Aquinas, political community is a moral unity, not just a geographic boundary. An external force breaks that unity.

      *(Self-Correction during drafting)*: I should make sure not to just say "Aquinas didn't know about drones." Instead, focus on the *moral logic* of authority. The drone is just the tool; the moral issue is the *wielder's jurisdiction*.

      *(Key Insight)*: The student's question conflates two Thomistic categories: the internal law of sedition/tyrannicide and the external law of just war. The answer should disentangle these.

  8.  **Final Output Generation:** (matches the detailed response provided previously.)
answer: |-
  This is a fantastic question, and it speaks well of your seminar that the students are pressing on the jurisdictional and structural limits of Aquinas's thought rather than just the moral headline. You are absolutely right to flag the nuance: Aquinas is far less a theorist of revolutionary violence and far more a theorist of *ordo* (order) and *auctoritas* (authority).

  To answer your student: **No, a foreign power (even with UN backing) does not fit Aquinas's definition of the "public authority" required for licit tyrannicide in the strict sense.** However, Aquinas *does* have a framework for external intervention, but it falls under **Just War theory**, not the internal jurisprudence of deposition.

  Here is how you can unpack this for the class, working through the architecture of his argument rather than just the conclusion.

  ### 1. The Definition of "Public Authority" is Organic, Not Functional
  The core of your students' confusion lies in assuming "public authority" is a functional label (i.e., "someone with enough power and legitimacy to get the job done"). For Aquinas, authority is ontological and relational.

  In *De Regno* (I.6), when Aquinas discusses who can depose a tyrant, he outlines a specific hierarchy of jurisdiction:
  *   **If the ruler was appointed by a superior:** That superior (e.g., the Emperor over a client king) has the right to depose him.
  *   **If the ruler was appointed by the community:** The community (or its representatives) retains the residual authority to remove him, because the authority was delegated conditionally on the pursuit of the common good.

  In both cases, the authority removing the tyrant is part of the **same political body** (*corpus politicum*) as the tyrant. The authority flows from the same source that established the ruler.

  **The Foreign Power Problem:** A foreign king or state is not a "superior" in the *De Regno* sense, nor is it the "community" that delegated the power. To Aquinas, political communities are distinct moral organisms. A foreign king has no jurisdictional standing *within* the tyrannized community. If he acts, he is technically an external agent. In the internal logic of the tyrannized state, a foreign strike looks less like "public justice" and more like **invasion**.

  ### 2. The Shift from "Tyrannicide" to "Just War"
  Since the foreign power lacks internal jurisdiction, Aquinas would not analyze this under the question of sedition or tyrannicide (*ST* II-II, Q. 42). He would analyze it under **Just War** (*ST* II-II, Q. 40).

  This is the crucial categorical shift for your students.
  *   **Tyrannicide/Deposition:** An act of *internal* law enforcement. It is the body politic curing its own disease.
  *   **Foreign Intervention:** An act of *war*.

  For Aquinas, for a war to be just, three things are needed: sovereign authority, just cause, and right intention.
  *   **Sovereign Authority:** The foreign state has authority over its own soldiers, yes. But does it have the authority to execute judgment on a foreign head of state? Aquinas argues that sovereigns wage war to "avenge wrongs" (*ultio injuriarum*). If the tyrant's actions are contained within his own borders, does he commit an *injuria* against the foreign power?
  *   **Just Cause:** Aquinas allows war to punish evil. However, he is generally wary of wars fought solely for the benefit of *others*. The primary obligation of a sovereign is to the common good of *his own* people. Risking his own citizens' lives to fix another country's political problem is, in Aquinas's framework, potentially negligent of his own primary duty.

  **The Drone/UN Complication:**
  *   **The Drone:** For Aquinas, the method matters less than the authority. But the secrecy and lack of due process inherent in a drone strike would trouble him. Aquinas emphasizes that even legitimate punishment should ideally follow a judicial order. A strike from the sky bypasses the judicial aspect of "public authority."
  *   **The UN:** Aquinas has no concept of supranational secular authority. The closest analog is the Pope or the Holy Roman Emperor, but even those powers were limited. The UN Security Council lacks its own coercive power (it relies on member states), which for Aquinas undermines its status as a true "public authority." It cannot wield the sword itself; it borrows swords from sovereigns who *do* have their own agendas.

  ### 3. The "Greater Evil" Calculus (The Pragmatic Brake)
  This is where Aquinas's caution in *De Regno* becomes most relevant. He argues that often, the remedy of tyranny is worse than the disease.

  > *"For it often happens that when the tyrant is deposed by his subjects, there follow grave dissensions... Moreover, it often happens that while the struggle is going on against the tyrant, the party which is conducting the struggle places more hope in the help of some outside power... and this outside power, when it has gained the victory, oppresses the state with a worse servitude."* (*De Regno*, I.6)

  Aquinas explicitly anticipates your student's scenario. He worries that inviting foreign intervention to solve a domestic tyranny results in **foreign occupation**, which is a "worse servitude."

  In a modern context, Aquinas would likely argue that a drone strike or foreign invasion, even if it removes the tyrant, creates a power vacuum, destabilizes the region, and imposes a will external to the community's own political development. This violates the **Common Good**, which requires peace and order specific to that community.

  ### 4. Natural Law as the Only Bridge
  Is there *any* way Aquinas could justify it? Only through **Natural Law** overriding Positive Law.

  If the tyrant's actions are not just "bad governance" but violations of universal natural law (e.g., genocide, mass slaughter of innocents), one could argue that the tyrant has made himself a **hostis humani generis** (enemy of all mankind).
  *   In *ST* II-II, Q. 64, regarding killing sinners, Aquinas argues that a sinner who is dangerous to the community may be killed for the common good.
  *   If the tyrant's evil is so profound that it shocks the conscience of *all* communities, a foreign sovereign *might* claim jurisdiction not as a political superior, but as an **executioner of natural law**.

  However, Aquinas is very hesitant here. He generally reserves the right to punish to the specific jurisdiction where the crime occurred. He would likely view this as dangerously prone to abuse (which, given modern geopolitics, is a fair Thomistic concern).

  ### Summary for the Seminar
  You can tell your student that their scenario exposes a limit in medieval political thought: **the lack of a theory of international public authority.**

  1.  **Structurally:** It is not "tyrannicide" in the Thomistic sense because the agent lacks internal jurisdiction. It is an act of war.
  2.  **Morally:** It fails the "public authority" test unless viewed through Just War theory, where the "just cause" is hard to prove if the foreign power's own common good isn't directly threatened.
  3.  **Pragmatically:** Aquinas would likely vote "no." His overriding concern is *tranquillitas ordinis* (the tranquility of order). Foreign intervention, even via drone, introduces external chaos into an organic community, risking the "worse servitude" he explicitly warns about in *De Regno*.

  Aquinas wants the cure to come from the body's own immune system (the community or its internal superior), not a transplant from a foreign body, because the rejection risk (disorder) is too high.
