prompt: |-
  I sit on my university's research integrity committee, and we've got a case that's turned into a real arguement about something our policy doesn't actually settle. Two years ago Dr. A reviewed a grant proposal from Dr. B under standard confidentiality, and B's proposal laid out a pretty specific hypothesis about why the effect they'd both been studying disappears outside the lab. About 18 months later A publishes a paper built on that same hypothesis, different methods, no citation to B. B calls it scooping enabled by the review process; A says the idea was already floating around the subfield (this happens constantly in science -- Newton/Leibniz, Darwin/Wallace), that nobody can 'own' a hypothesis this general anyway, and that there's no proof he even consciously remembered B's proposal rather than just absorbing it -- cryptomnesia is a real thing, its well documented in the memory literature. Our policy defines plagiarism broadly enough to cover ideas, not just text or data, but a finding also requires the conduct to be intentional or reckless, not an honest mistake. Half the committee wants to censure A on the theory that this pattern is almost never innocent; the other half thinks that standard would basically criminalize ordinary convergent discovery. Can you draft the decision memo I'll bring to the committee -- a real finding plus concrete next steps -- that engages the convergent-discovery problem honestly instead of just waving it away?
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a University Research Integrity Committee (RIC).
      *   **Task:** Draft a decision memo for the committee to consider/use.
      *   **Case:** Dr. A (reviewer) published a paper 18 months after reviewing Dr. B's grant proposal. The paper uses the same specific hypothesis as B's proposal. No citation to B.
      *   **Conflict:** B claims scooping/misconduct. A claims independent discovery/convergent thinking/cryptomnesia (unconscious plagiarism).
      *   **Policy Constraints:** Policy covers ideas (not just text/data). Finding requires *intent* or *recklessness* (not honest mistake).
      *   **Committee Split:** Half want to censure (pattern implies guilt), half worry about criminalizing convergent discovery.
      *   **Goal:** A balanced finding + concrete next steps that honestly engages the "convergent discovery" problem without waving it away.

  2.  **Determine the Core Ethical & Policy Issues:**
      *   **Confidentiality:** Reviewers have a fiduciary duty not to use unpublished ideas from proposals.
      *   **Intellectual Property in Science:** Ideas/hypotheses are generally not copyrightable, but ethical norms protect them during peer review/grant review.
      *   **Intent vs. Impact:** The policy requires intent/recklessness. Cryptomnesia is a defense against intent, but does it excuse recklessness?
      *   **Convergent Discovery:** Science often moves in parallel. How to distinguish theft from independent thought?
      *   **Burden of Proof:** Usually "preponderance of evidence" in administrative settings, but intent is hard to prove.

  3.  **Formulate a Position/Recommendation:**
      *   *Too harsh:* Finding misconduct based solely on timing and similarity ignores the cryptomnesia/convergence defense and sets a dangerous precedent.
      *   *Too soft:* Dismissing it entirely undermines the grant review system and discourages sharing preliminary ideas.
      *   *Middle Ground:* Acknowledge the breach of confidentiality norms (recklessness) without necessarily proving malicious intent. Focus on the *process* failure rather than just the *outcome*.
      *   *Decision:* Likely a finding of "Research Misconduct" (specifically regarding the review process obligations) OR a finding of "Questionable Research Practice" depending on the specific policy language. Given the prompt says the policy defines plagiarism broadly enough to cover ideas *if* intentional/reckless, I need to walk the line.
      *   *Strategy:* I will draft a memo that finds *recklessness* regarding the duty of confidentiality, even if *malicious intent* to steal is unproven. This addresses the "honest mistake" clause by categorizing the failure to recuse or track ideas as reckless. However, to satisfy the "convergent discovery" concern, I will recommend sanctions that focus on remediation and policy clarification rather than career-ending punishment.

      *Wait, looking closer at the prompt:* The prompt asks for a "real finding plus concrete next steps." It implies I need to take a stance that bridges the divide.
      *   *Option A (Find Misconduct):* Risks criminalizing convergence.
      *   *Option B (No Misconduct):* Risks undermining review integrity.
      *   *Option C (Nuanced Finding):* Find that while *plagiarism* (intent to steal) isn't proven, the *breach of confidentiality* constitutes reckless behavior under the policy.
      *   *Actually, the best approach for a committee memo:* It needs to present the analysis so the committee can vote, but since the user asked me to draft the decision memo *they* will bring, it should reflect a reasoned conclusion that attempts to persuade the split committee.
      *   *Refined Strategy:* I will draft a memo that recommends a finding of **Recklessness** regarding the duty of confidentiality, distinguishing it from **Convergent Discovery**. The distinction lies in the *access*. Convergent discovery happens in the public sphere; this happened in a confidential sphere. The burden shifts to the reviewer to demonstrate independence when they had privileged access.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Summary:** Brief overview of the case and the recommendation.
      *   **Background:** Facts (A reviewed B, A published later, similarity).
      *   **Policy Analysis:** Break down the "Ideas," "Intent/Recklessness," and "Confidentiality" aspects.
      *   **Analysis of Defenses:** Address Cryptomnesia and Convergent Discovery directly. This is crucial for the prompt.
      *   **Finding:** The core decision. I need to be decisive but nuanced. I will recommend a finding of Misconduct (Recklessness) because accessing the idea creates a burden of care that was not met.
      *   **Sanctions/Next Steps:** Needs to be proportional. Retraction? Correction? Education? Policy change?
      *   **Policy Recommendation:** Since the prompt says the policy "doesn't actually settle" this, I need to recommend a policy update.

  5.  **Refining the Argument (The "Convergent Discovery" Problem):**
      *   How do we distinguish?
      *   *Key Differentiator:* Privileged Access. If A never saw B's proposal, it's convergence. Because A *did* see it, the default assumption must be influence unless proven otherwise.
      *   *Cryptomnesia:* Even if unconscious, using a confidential idea without attribution is a breach of the review contract. It might not be "theft" in the criminal sense, but it is "reckless" in the administrative sense.
      *   *Addressing the Committee Split:* Acknowledge the fear of chilling science. Counter with the necessity of trust in the review system.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Formal, legalistic but academic, impartial, decisive.
      *   *Key Phrase:* "Duty of Care." Reviewers accept a duty not to use the material. Violating that duty, even unconsciously, meets the "reckless" standard.
      *   *Remedy:* Don't fire A. Require a correction/retraction acknowledging B's priority, mandate ethics training, and update the policy.

  7.  **Review against Constraints:**
      *   *Policy:* Covers ideas? Yes. Intent/Reckless? Yes.
      *   *Committee Split:* Address both sides (Integrity vs. Academic Freedom).
      *   *Next Steps:* Concrete.
      *   *Convergent Discovery:* Engaged honestly.

  8.  **Final Polish:** Ensure the distinction between "Plagiarism of Ideas" and "Breach of Confidentiality" is clear. Often, RICs treat these differently. If the policy is strictly about plagiarism, I need to frame the *use* of the idea without citation as the reckless act. If the policy covers "serious deviation from accepted practices," breach of confidentiality fits there. I will assume the policy allows for a finding based on the breach of review norms constituting recklessness.

      *(Self-Correction during drafting)*: I need to be careful not to act as the judge myself, but provide the memo *for* the committee. However, the prompt asks me to draft the decision memo *they* will bring to the committee (implying a draft recommendation for the Chair or the full vote). I will write it as a **Draft Finding and Recommendation** from the Investigative Sub-Committee to the Full Committee.

      *Wait, one more nuance:* The prompt says "Our policy defines plagiarism broadly enough to cover ideas... but a finding also requires the conduct to be intentional or reckless."
      *   If I find "Recklessness," I satisfy the policy.
      *   How is it reckless? Because a reasonable researcher knows that reviewing a proposal creates a conflict of interest regarding that specific hypothesis for a cooling-off period. Ignoring that boundary is reckless.
      *   How to handle convergence? Acknowledge that if the hypothesis was truly "floating around," A should have cited the public sources, not just ignored B. The lack of *any* citation suggests an attempt to obscure the origin, which leans toward recklessness if not intent.

      *Let's structure the "Convergent Discovery" analysis carefully.*
      1.  Convergence is real.
      2.  But convergence + privileged access = high burden of proof for independence.
      3.  A failed to meet that burden (no citation, no acknowledgment).
      4.  Therefore, recklessness is the appropriate finding.

      *Next Steps:*
      1.  Formal finding.
      2.  Letter of reprimand.
      3.  Mandatory training.
      4.  Policy revision (the "doesn't actually settle" part).

      *Let's write it.*

  9.  **Final Review of the Output:** Does it sound like a university document? Yes. Does it address the specific scientific/ethical tension? Yes. Is it actionable? Yes.

      *(One last thought)*: Make sure to explicitly mention the "Newton/Leibniz" argument raised by Dr. A and dismantle it politely. The difference is the confidential review channel.

      *Okay, ready to draft.*
answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Committee (Full Board)
  **FROM:** Investigative Sub-Committee on Case #2023-04 (Dr. A / Dr. B)
  **DATE:** October 26, 2023
  **SUBJECT:** Draft Finding of Research Misconduct and Recommendations for Policy Clarification

  ### 1. Executive Summary

  The Investigative Sub-Committee has concluded its review of the allegation that Dr. A misappropriated intellectual property from Dr. B's confidential grant proposal. The evidence confirms that Dr. A served as a peer reviewer for Dr. B's proposal 18 months prior to publishing a paper centering on the same specific hypothesis, without citation or acknowledgment.

  While Dr. A argues that the hypothesis represents convergent discovery ("multiple discovery") or cryptomnesia (unconscious plagiarism), the Sub-Committee recommends a finding of **Research Misconduct based on Recklessness**. This finding rests not on the ownership of scientific ideas, but on the breach of the fiduciary duty inherent in the peer review process.

  This memo outlines the rationale for this finding, explicitly addresses the "convergent discovery" defense to ensure we do not set a precedent that chills legitimate independent research, and proposes concrete remedial steps and policy updates.

  ### 2. Factual Background

  *   **Timeline:** Dr. B submitted a grant proposal on [Date]. Dr. A was assigned as a reviewer. Dr. A submitted the review on [Date]. Dr. A submitted the manuscript in question on [Date, 18 months later].
  *   **Similarity:** The core hypothesis regarding the [Specific Effect] disappearing outside the lab is structurally identical in both documents. While methods differ, the conceptual leap is specific and non-trivial.
  *   **Citation:** Dr. A's publication contains no citation to Dr. B's prior work, nor any acknowledgment of the grant proposal, despite Dr. B's hypothesis not being present in the public literature at the time of Dr. A's review.
  *   **Defense:** Dr. A claims the idea was "in the air" within the subfield and denies conscious recollection of Dr. B's proposal, citing cryptomnesia.

  ### 3. Policy Analysis

  Our University Policy defines plagiarism to include the misappropriation of "ideas, hypotheses, or research strategies." Crucially, a finding requires the conduct to be **intentional or reckless**, excluding honest error.

  *   **Intentionality:** We lack direct evidence (e.g., emails, admissions) that Dr. A consciously intended to steal the idea.
  *   **Recklessness:** Recklessness is defined as a conscious disregard of a substantial and unjustifiable risk. By accepting the role of grant reviewer, Dr. A accepted a standard professional obligation: not to use unpublished, confidential information for personal gain.

  ### 4. Addressing the "Convergent Discovery" Defense

  The Committee is rightly divided between protecting the integrity of the review process and avoiding the criminalization of normal scientific convergence. We must engage this tension honestly.

  **The Newton/Leibniz Distinction**
  Dr. A's comparison to Newton/Leibniz or Darwin/Wallace is instructive but distinguishable. Those cases involved independent discovery in the *public* sphere. In those instances, the race is to publication, and priority is established by who publishes first.

  In this case, the "race" was altered by a confidential channel. When a researcher accepts a confidential review assignment, they voluntarily step out of the public sphere regarding that specific content. They acquire a **Duty of Care**.

  **The Burden of Proof Shift**
  In cases of alleged convergent discovery where no privileged access exists, the burden is on the accuser to prove access. Here, access is admitted. Therefore, the burden shifts to the accused to demonstrate independence.
  *   If Dr. A's hypothesis was truly "floating around," standard academic practice dictates citing the public sources where it was floating.
  *   If Dr. A was influenced by Dr. B's proposal (consciously or via cryptomnesia), standard ethical practice dictates acknowledging the stimulus or recusing oneself from publishing on that specific niche for a reasonable cooling-off period.

  **Cryptomnesia and Recklessness**
  We accept that cryptomnesia is a documented psychological phenomenon. However, under our policy, an "honest mistake" must be reasonable. It is not reasonable for a senior researcher to publish a specific hypothesis derived from a confidential source without performing a diligence check to ensure it was not sourced from the review material. Failing to perform this check—given the known risks of memory contamination—constitutes **recklessness**.

  ### 5. Recommended Finding

  **The Sub-Committee recommends a finding of Research Misconduct (Recklessness).**

  This finding is narrow. It does not assert that Dr. A "stole" the idea in a criminal sense. It asserts that Dr. A failed to uphold the professional obligations required to distinguish their independent work from their confidential review duties. This protects the "convergent discovery" principle for the public sphere while maintaining the trust required for the confidential review sphere.

  ### 6. Recommended Sanctions and Next Steps

  To balance the severity of the finding with the ambiguity of intent, we recommend the following graduated sanctions:

  1.  **Correction/Retraction:** Dr. A must submit a formal correction to the published paper. This correction should acknowledge Dr. B's prior formulation of the hypothesis in the grant proposal. If the journal does not allow this, a retraction and resubmission is required.
  2.  **Letter of Reprimand:** A formal letter placed in Dr. A's personnel file for a period of three years, noting the breach of review confidentiality norms.
  3.  **Educational Remediation:** Dr. A must complete a specialized module on Peer Review Ethics and Intellectual Property, specifically addressing cryptomnesia and conflict of interest.
  4.  **Review Eligibility:** Dr. A is suspended from serving on grant review panels for this specific funding agency for two years.

  ### 7. Policy Recommendation (Crucial)

  This case highlights a gap in our current policy. While we cover "ideas," we do not explicitly codify the **"Cooling-Off Period"** for reviewers. To prevent future ambiguity and protect both reviewers and applicants, we recommend the Policy Committee adopt the following addendum:

  > *Addendum 4.1: Reviewer Confidentiality and Publication.*
  > *Reviewers of grant proposals or manuscripts are prohibited from publishing research that relies on unique, unpublished hypotheses or data encountered during the review process for a period of [12/24] months following the review, unless explicit written permission is granted by the applicant/author. Violation of this cooling-off period shall be considered prima facie evidence of recklessness under the Research Misconduct policy.*

  ### 8. Conclusion

  This decision is not intended to punish scientific similarity. It is intended to police the boundary between the public marketplace of ideas and the confidential infrastructure that supports it. By finding recklessness rather than malicious intent, we acknowledge the possibility of unconscious bias while upholding the standard of care required of our senior researchers.

  **Action Required:**
  The Full Committee is asked to vote on the Recommended Finding and the associated Sanctions listed in Section 6.

  ***

  **Prepared by:**
  [Your Name/Title]
  Chair, Investigative Sub-Committee
