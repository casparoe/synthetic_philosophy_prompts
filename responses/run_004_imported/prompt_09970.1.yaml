answer: |-
  You are right to smell Lewis in the Arnauld correspondence, but if you brief Leibniz on the 1970s debate, he would reject both Kripke and Lewis, though for different reasons. He ends up in a metaphysical no-man's-land that is arguably more extreme than either of them.

  Here is the breakdown of why Leibniz isn't Kripke, why he isn't quite Lewis, and where his system breaks the modern mold entirely.

  ### 1. Why Leibniz is not Kripke (The Death of the Rigid Designator)
  Kripke's revolution rests on the idea that we can refer to an individual (via a rigid designator like "Nixon") independently of their properties. We can say, "Nixon might have lost," and we are talking about *Nixon*, just with a different property set. Kripke separates the *haecceity* (thisness) from the *quiddity* (whatness).

  Leibniz's **Complete Concept** doctrine destroys this separation. For Leibniz, an individual substance *just is* the sum total of its predicates. There is no "bare particular" underneath the properties.
  *   **The Arnauld Point:** When Leibniz tells Arnauld that if Adam hadn't sinned, he wouldn't be *this* Adam, he is asserting **Superessentialism**. Every predicate true of Adam (including "eats the apple") is contained in the concept "Adam."
  *   **The Clash:** If you try to use a Kripkean rigid designator on Leibniz, it fails. You cannot point to "Adam" and strip away "sinned." If you strip away "sinned," the concept changes. If the concept changes, the substance changes. For Leibniz, there is no transworld identity because there is no transworld *concept*. Kripke saves identity by making properties contingent; Leibniz makes identity impossible by making properties essential.

  So, Leibniz is definitely not on Team Kripke. He denies the very mechanism (rigid designation across property variations) that Kripke uses to solve the problem.

  ### 2. Why Leibniz is not Lewis (Superessentialism vs. Similarity)
  This is where your intuition needs the nuance. Leibniz agrees with Lewis's conclusion (no transworld identity), but his metaphysics for *why* are opposites.

  **Lewis's Counterpart Theory** is built on **similarity** and **anti-essentialism**.
  *   For Lewis, "Humphrey could have won" is true because there is a concrete person in another world who resembles Humphrey enough to be his counterpart.
  *   Crucially, for Lewis, almost nothing is essential to Humphrey. The counterpart can differ in almost any way and still be a counterpart, provided the contextual similarity holds.

  **Leibniz's "Counterpart" Theory** is built on **logical containment** and **hyper-essentialism**.
  *   For Leibniz, the "other Adam" (the one who doesn't sin) isn't just a guy who looks like Adam and lives in a similar garden. That "other Adam" is a distinct *possible substance* defined by a different complete concept.
  *   The relationship between Actual-Adam and Possible-Adam isn't based on vague similarity; it's based on **logical variation of a concept**.
  *   **The Kicker:** For Lewis, it is contingent that Humphrey loses. For Leibniz, it is *essential* to Actual-Adam that he sins. The "Possible-Adam" who doesn't sin is a totally different individual essence.

  Leibniz is actually *more* restrictive than Lewis. Lewis allows an individual to be represented by counterparts who are merely similar. Leibniz says the only way to talk about "Adam not sinning" is to talk about a logically distinct individual whose essence *includes* not sinning. Leibniz doesn't have "counterparts" in the Lewisian sense; he has **alternative individual concepts**.

  ### 3. Where Leibniz Fits Neither Camp: Hypothetical Necessity & Divine Ideas
  You mentioned the reality of possible worlds as a point of divergence, and that is correct, but there is a deeper structural difference regarding **the source of modality**.

  **The Problem:**
  *   **Kripke** treats modality as metaphysical. We discover necessary truths about the world (e.g., Water = H2O).
  *   **Lewis** treats modality as quantificational over concrete realities. "Possibly P" means "There exists a world where P."
  *   **Leibniz** treats modality as **Theological-Conceptual**.

  **The "Fits Neither" Spot: The Status of the "Possible"**
  For Lewis, the counterpart is flesh and blood (concrete). For Kripke, the possible world is a stipulation about the actual world (actualism). For Leibniz, the "Possible Adam" has **objective being in the Divine Intellect**.

  This creates a unique modal category called **Hypothetical Necessity**.
  *   In the mind of God, the concept "Adam" logically contains "sins." It is *absolutely necessary* (logically) that if Adam exists, he sins.
  *   However, it is *contingent* that God chose to actualize this concept rather than the concept "Adam-Who-Does-Not-Sin."

  This doesn't fit Kripke or Lewis.
  *   **Against Kripke:** Kripke distinguishes necessary vs. contingent truths *de re*. For Leibniz, *all* truths about Adam are necessary relative to his concept, but contingent relative to God's will. Kripke has no room for "necessary given the concept, contingent given the existence."
  *   **Against Lewis:** Lewis's worlds are ontologically equal. The "Humphrey-loses" world is just as real as the "Humphrey-wins" world. For Leibniz, the "Possible Adam" has a lesser ontological status (an idea) than the "Actual Adam" (created substance). But crucially, the "Possible Adam" is not just a similar concrete guy; he is a blueprint in God's mind.

  **The Compossibility Constraint**
  There is one more place Leibniz breaks the modern binary: **Compossibility**.
  For Kripke and Lewis, a possible world is generally a maximal consistent set of propositions/states of affairs.
  For Leibniz, worlds are sets of substances that **mutually express each other**.
  *   Adam isn't just in a world; Adam *mirrors* the entire world from his perspective.
  *   You can't just swap "Adam" into a different world (even a possible one) because his concept contains relations to *every other substance* in his specific world (Eve, the serpent, the specific geometry of Eden).
  *   This means individuals are **world-bound** not just by spatiotemporal isolation (Lewis) or stipulation (Kripke), but by **metaphysical harmony**. An individual *cannot* exist outside its specific world because its individual concept *includes* that world.

  ### The Verdict
  If you force Leibniz into the booth:
  *   **On Transworld Identity:** He votes with **Lewis** (No, individuals are world-bound).
  *   **On Essentialism:** He votes with **neither** (He is a Superessentialist, whereas Lewis is anti-essentialist and Kripke is moderate).
  *   **On Ontology:** He votes with **neither** (Conceptual Idealism vs. Concrete Realism vs. Actualism).

  Leibniz is best described as a **Superessentialist Conceptualist**. He anticipates Lewis's denial of transworld identity, but he grounds it in a radical essentialism that Lewis explicitly rejects. For Lewis, "Humphrey" could have been almost anything. For Leibniz, "Adam" could have been *nothing else* than what he is, unless he were a completely different person.

  So, when you tell Leibniz about Humphrey, he wouldn't say, "Ah, a counterpart won!" He would say, "Humphrey lost. A distinct possible substance, *Humphrey-Prime*, won in a different divine idea. They share a name, but they are not the same *haecceity*."
