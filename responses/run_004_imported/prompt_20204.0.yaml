answer: |-
  Here is a eulogy drafted to walk that tightrope. It honors her intellectual rigor without alienating those who need spiritual comfort, focusing on the legacy of her curiosity rather than making claims about her current state.

  ***

  **Eulogy for Marion**

  Thank you all for being here.

  For those of you who don't know me, I'm [Your Name], Marion's nephew/niece. Standing here today, I feel a bit like I'm standing in front of a structural load-bearing wall, trying to explain how the whole building stays up. And if there's one thing Marion taught me, it's that you don't guess about the structure. You look at the evidence.

  Many of you know me as an engineer. I chose that path because of her. When I was a kid, she didn't just give me toys; she gave me questions. She taught me that the world makes sense if you look closely enough, if you test your assumptions, and if you respect the truth, even when it's not the answer you wanted.

  But while I was building bridges and circuits, Marion was exploring a different kind of frontier. For fifty years, she was a dedicated member of the Society for Psychical Research. Now, I know what some of you might think—that this was about ghosts or superstition. But those of us who knew her know it was nothing of the sort. It was about the same rigor she applied to everything else. She was part of a tradition going back to Sidgwick in the 1880s, a group of people who asked the biggest questions human beings can ask, with a "show me the evidence" attitude.

  She spent a lifetime reading case files, analyzing reports on hauntings, and studying near-death experiences. She approached the unknown with the mind of a scientist and the heart of a seeker.

  I know that for some of us, funerals are a time to declare with certainty where our loved ones have gone. And I know Marion would be the first to tell me not to claim I know something I don't. She died just as unconvinced of an afterlife as she was at twenty-five. She never found that one solid case, that one undeniable piece of data that would let her stop wondering.

  She once told me, quietly, that the hardest part of her life's work wasn't the skepticism. It was that she never found proof solid enough to let her rest.

  But here is what I know, based on the evidence I have right here in this room.

  I know that a person is not just a body. A person is the sum of their influence, the questions they asked, and the love they left behind. Marion may not have believed she was going to a specific place, but she believed deeply in *us*. She believed in the importance of keeping our minds open, even when the answers are hard to find.

  To her friends from the Society: We honor her by continuing to ask the hard questions, by refusing to settle for easy answers, just as she did.

  To her bridge club, to my Uncle, and to those who find comfort in faith: Marion respected your certainty, even if she held onto her questions. And I think there is comfort for all of us in this: We do not need to know exactly where she is to know that she is still *here*.

  She is here in the way I double-check my work because I want it to be right. She is here in the way you all sit together, supporting one another. She is here in the silence between the notes, in the mystery that remains.

  Marion didn't need to believe in ghosts to believe in magic. She found the magic in the inquiry itself. She found it in the connection between people.

  So, I won't tell you she's watching over us. I don't think she'd forgive me for making a claim I can't substantiate. But I will tell you this: We are carrying her. Her curiosity is now part of my curiosity. Her integrity is part of this family's integrity.

  She spent her life looking for light in the dark. Today, we don't need to prove the light exists. We just need to be it for each other.

  Thank you, Aunt Marion, for teaching us how to look. And thank you all for being the evidence that she was loved.
