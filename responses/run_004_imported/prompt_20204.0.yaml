  1.  **Analyze the Request:**
      *   **Deceased:** Aunt Marion.
      *   **Relationship:** Close (she inspired the user's engineering career).
      *   **Key Passion:** Active member of the Society for Psychical Research (SPR) for ~50 years.
      *   **SPR Context:** Serious, academic, British, founded 1880s (Sidgwick), evidence-based, not "ouija-board" stuff.
      *   **Her Stance:** Skeptical but open-minded ("show me the evidence"). Died unconvinced of an afterlife.
      *   **Her Conflict:** Never called it nonsense, but admitted the hardest part was never finding a case solid enough to stop wondering.
      *   **Constraint 1 (Crucial):** Do *not* say "she's watching over us now" (she would hate that).
      *   **Constraint 2 (Audience):** Mixed bag. SPR friends (will spot inaccuracies/overclaims), Bridge Club/Uncle (Catholic, need comfort/tradition).
      *   **Tone:** Honest to her worldview, comforting, not a lecture.

  2.  **Determine the Core Theme:**
      *   The tension between *knowing* and *wondering*.
      *   The value of the question itself, rather than the answer.
      *   Engineering (structure, evidence) parallels her approach to the paranormal (rigorous inquiry).
      *   Legacy: She taught the user to look for evidence, but also to keep asking questions.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty of the task. Establish the relationship (engineering connection).
      *   **The "Engineering" Connection:** How she influenced the user. It wasn't just about building things; it was about *how* to think. Rigor, evidence, curiosity.
      *   **The SPR Connection (The Elephant in the Room):** Address her passion honestly. Define it correctly (serious inquiry, not superstition). Acknowledge her skepticism.
      *   **The "Afterlife" Dilemma:** Navigate the tricky part. Don't affirm she's watching, but don't say "she's gone forever." Focus on what remains (memory, influence, the questions she asked).
      *   **Comfort for the Believers (Uncle/Bridge Club):** Shift the focus from *where* she is to *how* she lives on in us. The "evidence" of her life is in the people she touched.
      *   **Closing:** A final tribute to her intellectual honesty and love.

  4.  **Navigating the Tone (The Tightrope Walk):**
      *   *Risk:* Sounding too cold/skeptical for the Catholic uncle.
      *   *Risk:* Sounding too mystical for the SPR friends.
      *   *Solution:* Focus on *Love* and *Memory* as the tangible evidence. Use engineering metaphors (structure, foundation) that bridge both worlds.
      *   *Key Phrase Idea:* "She didn't need to know the end of the story to love the characters." or "The evidence was in the living."

  5.  **Drafting - Specific Lines & Phrasing:**
      *   *Avoid:* "She's in a better place," "Looking down on us," "At peace with God" (unless qualified).
      *   *Use:* "Rigorous curiosity," "Unanswered questions," "Legacy of thought," "Evidence of her life."
      *   *The "Watching Over" alternative:* Instead of her watching us, *we* carry her. Her influence is the lens through which we see the world.

  6.  **Refining the SPR Detail:**
      *   Make sure to mention Sidgwick or the era to show respect to the SPR friends.
      *   Emphasize the "show me" attitude.
      *   Highlight the humanity in her search (the "wondering").

  7.  **Addressing the Comfort Aspect:**
      *   How to comfort without lying? By validating the grief. By suggesting that the *uncertainty* she lived with is actually okay. It keeps us connected.
      *   For the Uncle: Focus on the spirit of inquiry as a form of reverence.

  8.  **Review against Constraints:**
      *   Did I say she's watching us? No.
      *   Is it honest about her skepticism? Yes.
      *   Is it comforting? Hopefully, by focusing on enduring love/memory.
      *   Is it respectful to the SPR? Yes, by treating it as serious science/philosophy.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Check:* Is the engineering connection clear? *Adjustment:* Make sure to link the engineering mindset (testing, building) to her SPR mindset (testing, investigating).
      *   *Check:* Is the ending strong? *Adjustment:* End on a note of shared curiosity and love, rather than finality.

  10. **Final Output Generation:** (This matches the provided good response.)
      *   *Structure:* Intro -> Engineering/Influence -> SPR/Philosophy -> The "Afterlife" nuance -> Comfort/Conclusion.
      *   *Tone:* Warm, respectful, intellectually honest.

