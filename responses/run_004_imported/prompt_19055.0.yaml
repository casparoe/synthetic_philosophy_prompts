          *   Wait, if $p=0$ (P2 plays R) and $q=0$ (P3 plays r), then $T$ gets 1. $T$ is a best response to the independent belief $(R, r)$.
          *   **My example was too simple.** I need to ensure $T$ is not a BR to *any* independent belief, including pure ones.
          *   To fix this, $T$ must fail against pure profiles too, or the alternative $B$ must be better against the specific profiles where $T$ wins.
          *   Let's adjust the payoffs.

  **Revised Payoffs for Player 1:**

  | P1 \ (P2, P3) | $(L, l)$ | $(L, r)$ | $(R, l)$ | $(R, r)$ |
  | :--- | :---: | :---: | :---: | :---: |
  | **$T$** | 1 | 0 | 0 | 1 |
  | **$B$** | 0.6 | 0.6 | 0.6 | 0.6 |

  *Wait, in the previous analysis, if P1 believes P2 plays R and P3 plays r (independent belief with $p=0, q=0$), $T$ gets 1 and $B$ gets 0.6. So $T$ IS rationalizable.*

  I need a payoff structure where $T$ wins on correlation, but loses on independence *everywhere*. This requires $T$ to be "average" good but "peaky", while $B$ is consistently better than $T$'s independent average, but worse than $T$'s correlated peak.

  **Corrected Example Construction:**
  Let $T$ payoff be 1 on $(L,l)$ and $(R,r)$, and 0 otherwise.
  Let $B$ payoff be **0.51** everywhere.

  *   **IESDS:** $T$ is not dominated. Against $(L,l)$, $T$ gets 1, $B$ gets 0.51. $B$ cannot dominate $T$.
  *   **Rationalizability:**
      *   Max expected payoff of $T$ under independent beliefs ($p, q$):
          $$ E[T] = pq + (1-p)(1-q) $$
      *   This function is convex. Its maximum over the unit square occurs at the corners $(0,0), (0,1), (1,0), (1,1)$.
      *   At corners (pure strategies of opponents), $E[T] = 1$.
      *   So $T$ is a BR to independent pure beliefs. $T$ is rationalizable.

  **The True Counter-Example Logic:**
  To make $T$ non-rationalizable, $T$ must *never* be a best response to independent beliefs. This means there must be another strategy (or mix) that beats $T$ under *all* independent beliefs, even if that strategy doesn't dominate $T$ against all *profiles*.

  Let's try a 3-player game where P1 has strategies $\{U, D\}$. P2 and P3 have $\{L, R\}$ and $\{l, r\}$.
  P1 Payoffs for $U$: 1 if $(L, l)$ or $(R, r)$; 0 otherwise.
  P1 Payoffs for $D$: **0.6** always.

  Wait, if P2 plays $L$ and P3 plays $l$ (independent pure strategies), $U$ gets 1, $D$ gets 0.6. $U$ is a BR.
  The problem is that pure strategies are independent beliefs ($p=1, q=1$).
  For $U$ to be eliminated by rationalizability, it must be that against *any* independent belief, $D$ (or a mix) does better.
  But if $U$ wins against $(L,l)$, and $(L,l)$ is a possible independent belief, $U$ is a BR to that belief.

  **Ah, the trick:** The opponents' strategies must be restricted by *their own* rationalizability.
  In the example above, I assumed P2 and P3 have dummy payoffs. If P2 and P3 have payoffs that eliminate some strategies, the set of independent beliefs shrinks.

  **Let's use the standard "Matching Pennies with a Third Player" logic.**
  Actually, the cleanest explanation is theoretical rather than needing a specific matrix, because constructing the matrix requires ensuring P2 and P3 eliminate strategies that would otherwise support P1's choice.

  **Theoretical Explanation of the Gap:**
  1.  **IESDS** asks: Is $s_i$ a best response to *any* $\mu_{-i} \in \Delta(S_{-i})$? (Correlated allowed).
  2.  **Rationalizability** asks: Is $s_i$ a best response to any $\mu_{-i} \in \Delta(S_2) \times \dots \times \Delta(S_n)$? (Independent only).
  3.  Because the set of independent beliefs is smaller, the set of Best Responses to independent beliefs is smaller.
  4.  Therefore, a strategy can be a BR to a correlated belief (surviving IESDS) but not to any independent belief (eliminated by Rationalizability).

  **Why did my matrix example fail?**
  Because I didn't restrict P2 and P3. If P2 and P3 can play *any* strategy, then pure profiles are independent beliefs. If $T$ is a BR to a pure profile, it is rationalizable.
  For the equivalence to break, we need a situation where $T$ is a BR *only* to a correlated belief that puts weight on multiple profiles, but against any single profile (or product of beliefs), another strategy is better.

  **Revised Example:**
  P1: $\{In, Out\}$.
  P2: $\{L, R\}$. P3: $\{l, r\}$.
  P1 Payoff $Out$: 0.
  P1 Payoff $In$:
  *   $(L, l) \to 2$
  *   $(R, r) \to 2$
  *   $(L, r) \to -2$
  *   $(R, l) \to -2$
  P2 and P3 play a game between themselves where they want to mismatch P1's expectation? No, keep P2/P3 payoffs simple.
  Let P2 and P3 have payoffs such that they randomize 50/50 in equilibrium, but they cannot correlate.
  Actually, simply assume P2 and P3 are constrained to play 50/50 mix (perhaps by previous elimination rounds).
  If P2 plays 50/50 and P3 plays 50/50 (Independent):
  $E[In] = 0.25(2) + 0.25(-2) + 0.25(-2) + 0.25(2) = 0$.
  $E[Out] = 0$.
  So $In$ is a weak BR.
  If P2 and P3 Correlate (Match with prob 1):
  $E[In] = 0.5(2) + 0.5(2) = 2$.
  $In$ is a strict BR.

  To make $In$ **not** rationalizable, we need $Out$ to be strictly better than $In$ under all independent beliefs.
  Set $Out$ payoff to **0.1**.
  *   **Independent Beliefs:** Max $E[In]$ is when P2/P3 match as much as possible independently. Max prob match is 0.5 (when both 50/50). Max $E[In] = 0.5(2) + 0.5(-2) = 0$.
      *   Since $0 < 0.1$, $In$ is never a best response to independent beliefs. **$In$ is not Rationalizable.**
  *   **IESDS:** Is $In$ strictly dominated?
      *   We need a strategy (mix of $In, Out$) that beats $In$ against all 4 profiles.
      *   Against $(L, l)$, $In$ gets 2. $Out$ gets 0.1. No mix beats 2.
      *   So $In$ is not dominated. **$In$ survives IESDS.**

  **This works.** The key is that P2 and P3's independent randomization "washes out" the payoff for $In$, but a correlated belief allows P1 to exploit the correlation.

  ### Summary for your understanding

  1.  **Assumption doing the work:** **Independence of Beliefs.**
      *   **Rationalizability** assumes players believe opponents choose independently (no correlation without communication).
      *   **IESDS** implicitly guards against *any* contingency, which is mathematically equivalent to allowing beliefs that include correlation.
  2.  **Two-Player Case:** Independence is trivial (you only have one opponent to have a belief about). The sets of beliefs are identical. Equivalence holds.
  3.  **Three-Player Case:** You have beliefs about a *pair* of opponents. You can believe they correlate (IESDS allows this) or you can believe they are independent (Rationalizability requires this).
  4.  **The Consequence:** Rationalizability eliminates strategies that rely on opponents correlating their moves "magically." IESDS keeps them, because strictly speaking, those strategies aren't dominated; they just require "unreasonable" (correlated) beliefs to be optimal.

  This is why Osborne notes the breakdown: Rationalizability is often preferred in $n$-player games because the independence assumption is more behaviorally justified than allowing players to believe opponents correlate without a mechanism. IESDS is robust but "looser" in multi-player settings.
