answer: |-
  You have hit the nail on the head. Your instinct is exactly right, and your guess about the regress is precisely McTaggart's objection.

  As a physicist, your intuition is essentially the **B-Theory of Time** (Eternalism/Block Universe). In your framework, "past," "present," and "future" are indexical relations relative to a coordinate $t$, just like "here" and "there" are relative to a coordinate $x$. A particle being at $x_1$ at $t_1$ and $x_2$ at $t_2$ is not a contradiction; it's a worldline.

  McTaggart's argument is designed specifically to block this move *if* you insist that time requires genuine "passage" (the A-Series). He argues that you cannot reduce A-properties (past/present/future) to B-relations (earlier/later) without losing the essence of what makes time *time*.

  Here is the step-by-step walkthrough of the regress, formalized slightly to appeal to your background, followed by the available "ways out."

  ### The Regress Argument Step-by-Step

  McTaggart's goal is to show that the A-series is contradictory. The contradiction is: **Every event is Past, Present, and Future, but these properties are mutually exclusive.**

  **Step 1: The Initial Contradiction (Level 0)**
  Let $E$ be an event.
  1.  $E$ is Present.
  2.  $E$ is Past.
  3.  $E$ is Future.
  4.  Being Present, Past, and Future are incompatible.
  5.  **Contradiction.**

  **Step 2: The Proposed Fix (Indexing)**
  This is your move. You say $E$ does not have these properties simpliciter; it has them relative to times.
  *   $E$ is Present at $t_1$.
  *   $E$ is Past at $t_2$.
  *   $E$ is Future at $t_3$.
  (Where $t_2$ is later than $t_1$, and $t_3$ is earlier than $t_1$).

  **Step 3: McTaggart's Trap (The Meaning of "At")**
  McTaggart asks: What does it mean to say "$E$ is Present **at** $t_1$"?
  In a B-theory block universe, "$t_1$" is just a coordinate. But for an A-theorist (who believes in genuine passage), for $E$ to be *actually* present, **$t_1$ itself must be the present time.**

  If $t_1$ is just a static coordinate in a block, then "$E$ is present at $t_1$" just means "$E$ is simultaneous with $t_1$." That is a permanent B-relation. It never changes. $E$ is *always* simultaneous with $t_1$. If time involves change, the A-properties must change.

  So, to preserve the A-theory, the statement "$E$ is Present at $t_1$" entails:
  *   **$t_1$ is Present.**

  **Step 4: The Contradiction Re-emerges (Level 1)**
  But $t_1$ is a moment of time. Just like event $E$, moment $t_1$ must also have A-determinations.
  *   $t_1$ is Present (when we are at $t_1$).
  *   $t_1$ is Future (when we are at $t_0$).
  *   $t_1$ is Past (when we are at $t_2$).

  We have now reproduced the exact same contradiction from Step 1, but now applied to the *times* ($t_1, t_2, t_3$) instead of the *events*.
  *   $t_1$ is Past, Present, and Future.
  *   These are incompatible.
  *   **Contradiction.**

  **Step 5: The Second Fix (Level 2)**
  To fix the contradiction regarding $t_1$, we must index *its* A-properties to a second-order time.
  *   $t_1$ is Present at $t_{1a}$.
  *   $t_1$ is Past at $t_{1b}$.
  *   $t_1$ is Future at $t_{1c}$.

  **Step 6: The Infinite Regress**
  But for "$t_1$ is Present at $t_{1a}$" to hold, **$t_{1a}$ must be Present.**
  So now $t_{1a}$ has A-properties (Past, Present, Future).
  So we need a third-order time $t_{1aa}$ to index $t_{1a}$'s properties.
  And so on, *ad infinitum*.

  **McTaggart's Conclusion:** We never eliminate the incompatible properties; we just postpone them to the next level. Since the regress is vicious (the contradiction is never resolved, only pushed back), the A-series is incoherent. Since McTaggart believes time *requires* the A-series, **Time is Unreal.**

  ### Why Your Physicist Intuition Feels Different

  Your intuition says: *"Just treat 'Present' as a function $P(t)$. $P(t) = 1$ if $t = t_{now}$, else $0$."*

  McTaggart would reply: *"What defines $t_{now}$?"*
  *   If $t_{now}$ is defined by a B-relation (e.g., "the time of this utterance"), you have successfully reduced time to the B-series. You have saved consistency, but you have eliminated "passage." The "Now" is just a token-reflexive label, like "Here." Nothing is genuinely *becoming* past; it just bears the relation "earlier than" to this utterance.
  *   If $t_{now}$ is defined by a genuine A-property (a metaphysical glow of "presentness"), then you are back in the regress, because that glow has to move, and you have to explain *when* it glows on a specific time.

  ### Is There a Way Out?

  You asked if there is a way out that doesn't just relabel the problem. There are three main exits, depending on which premise you are willing to sacrifice.

  #### 1. The B-Theory Exit (Accept your intuition)
  **Strategy:** Deny that time requires the A-series.
  **The Move:** Argue that McTaggart is right that the A-series is contradictory, but wrong that we need it for time.
  **Physics Alignment:** This is the standard view in relativity. Spacetime is a 4D manifold. "Change" is just variation of qualities along the time coordinate (like a movie reel existing all at once). "Present" is indexical (like "here").
  **Cost:** You lose "temporal passage." The feeling that the future is open and the past is fixed is an illusion of consciousness, not a feature of reality. Many physicists are happy to pay this cost.

  #### 2. The Presentist Exit (Deny the existence of non-present events)
  **Strategy:** Deny that past and future events exist.
  **The Move:** Only the present event $E$ exists. Therefore, $E$ is never *simultaneously* past, present, and future. It is present now. Later, it does not exist (so it isn't "past," strictly speaking, it just *was*).
  **Physics Alignment:** This clashes horribly with Special Relativity (simultaneity is relative), but some quantum gravity approaches (like Shape Dynamics or certain interpretations of Collapse) try to carve out a privileged foliation.
  **Cost:** You have to explain truthmakers for past-tense statements (what makes "Dinosaurs existed" true if dinosaurs don't exist?) and reconcile with Lorentz invariance.

  #### 3. The "Tense Logic" Exit (Prior's Solution)
  **Strategy:** Change the logic, not the ontology.
  **The Move:** Arthur Prior (a logician and physicist manqué) argued we shouldn't analyze "It will be past" as a relation to a time $t$. We should treat tenses as logical operators.
  *   Instead of: $Past(E)$ at $t_2$.
  *   Use: $F(P(E))$ (It will be the case that it was the case that $E$).
  **Why it helps:** Operators don't require existing objects to bear relations. "It will be" modifies the proposition, not the event's relation to a time coordinate. This blocks the regress because you aren't positing second-order *times*, you're just stacking logical operators.
  **Cost:** It's technically complex and still struggles to account for the *phenomenology* of passage without smuggling in A-properties.

  ### Summary for a Physicist

  McTaggart's argument is essentially a proof that **you cannot have a dynamic "Now" moving along a static timeline without contradiction.**

  *   If the timeline is static (B-series), the "Now" is an illusion or indexical. (Your intuition).
  *   If the "Now" is real (A-series), the timeline cannot be static, but then you need a "hyper-time" for the Now to move in, leading to regress.

  McTaggart's conclusion (Time is unreal) is widely rejected. Most philosophers of physics take the **B-Theory Exit**. They agree with McTaggart that the A-series is contradictory, but they conclude that **physics describes reality correctly without it.**

  So, your instinct to index the properties to time is the standard B-theoretic solution. McTaggart's point is simply: *"If you do that, you have saved logic, but you have killed Time (as a dynamic flow)."* Whether that is a bug or a feature depends on whether you think dynamic flow is a physical reality or a psychological artifact. Given your background, you likely lean toward the latter, which makes McTaggart's paradox a "problem dissolved" rather than a "problem solved."
