          *   *The Ergodicity Point:* Why Log? VNM says "pick whatever you want." Ergodicity says "Log is forced by the physics of multiplicative dynamics." It shifts the burden from *preference* to *process*.
          *   *The Crucial Distinction:* Subjective vs. Objective. VNM = "I am risk averse." Ergodicity = "The world is non-ergodic."
