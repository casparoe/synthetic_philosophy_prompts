answer: |-
  Here is a draft for the eulogy. It is written to be spoken aloud, with a rhythm that allows for pauses and emotion. It aims to honor your mother's professional clarity and personal wishes while framing the final week as an act of love for the family, rather than a medical ambiguity.

  **Time:** Approximately 5 minutes at a moderate, spoken pace.
  **Tone:** Honest, grounded, loving, and firm.

  ***

  **Eulogy for [Mom's Name]**

  Good morning. Thank you all for being here to honor my mother.

  If you knew Mom, you knew she was a woman who valued truth over comfort. She spent nearly thirty years as an ICU nurse. She spent three decades standing at the bedside of people in the most vulnerable moments of their lives. She held hands, she comforted families, and she saw the precise moment when a person leaves their body.

  Because of that, she didn't have any illusions about death. She talked about it often. She had very strong opinions on how she wanted her own end to look. She used to say, plainly and clearly: "If my brain is gone, I am gone. Don't dress that up. Don't pretend I'm still here if I'm not."

  She believed that the person isn't the heartbeat; the person is the light behind the eyes. And when that light is out, she believed, the work is done.

  I am sharing this because Mom would have hated a eulogy that smoothed over the reality of her passing to make everyone feel more comfortable. She taught us to look things in the eye.

  When she had her stroke last week, the medical reality was exactly what she always said it would be. By Tuesday, her brain had stopped functioning. By her own definition, and by medical definition, the woman we knew was no longer there.

  But the story of her final week isn't just about medicine. It's about love.

  Even though Mom was gone, our family wasn't quite ready to let go of the physical presence we had left. My brother was overseas. He needed time to travel, to say goodbye. So, my father made the difficult decision to keep her body on the ventilator for those six days.

  I know that week was incredibly hard for everyone. I know there were prayers said for a recovery. I know my Aunt [Aunt's Name] sat by her side and prayed with a ferocity that only comes from deep love. Those prayers weren't in vain. They weren't asking for a medical miracle; they were an expression of how much we wanted her here. They were a testament to how much we weren't ready to lose her.

  But in the end, the decision to turn off the machine wasn't about "giving up." It was about listening.

  My father didn't make that choice lightly. He made it because he knew it was what *she* wanted. He honored her thirty years of expertise. He honored her clear, direct wishes. To have done otherwise—to have kept her body going indefinitely against her stated will—would have been the true disservice to her memory.

  That week allowed us to gather. It allowed my brother to hold her hand. It allowed us to sit in the quiet and accept what Mom had taught us all along: that the body is just the vessel, and when the vessel is empty, it is time to let it rest.

  So, as we stand here today, I ask that we remember her not for the machines that breathed for her in those final days, but for the breath she gave to all of us in her life.

  Remember her for the clarity she brought to difficult situations. Remember her for the compassion she showed strangers in hospital beds, and the fierce love she showed us at home. And remember her for the courage she had to define her own end, and the courage she taught us to have in respecting it.

  She was an ICU nurse until the very end. She knew the science, but she also knew the soul. She taught us that loving someone means listening to them, even when it hurts. Even when it's hard. Especially when it's hard.

  We said goodbye to her body on [Day of Week]. But the truth she lived by remains. She is not in the ground. She is not in the past. She is in the values she instilled in us. She is in the honesty we owe each other. She is in the love that brought us all here.

  Thank you for loving her. And thank you for helping us honor her, exactly as she wished to be honored.
