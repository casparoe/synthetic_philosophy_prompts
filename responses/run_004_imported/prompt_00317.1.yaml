prompt: |-
  I'm a tech lead at a mid-sized software company, and I've run into a management puzzle I can't quite articulate to my own manager, let alone resolve. Over the summer we ran a structured internship program: interns worked through a fixed backlog of well-specified tickets, and we graded them almost entirely on ticket throughput plus a code-review checklist (test coverage percentage, PR description completeness, linting, that kind of thing). One intern, I'll call him Dan, was by far our top performer under that system, closing more tickets than anyone else while hitting every item on the checklist nearly every time.

  We converted Dan to full-time and moved him onto our main team, where the work is far more open-ended: he sets his own priorities, tickets are vague, and there's no rigid checklist to satisfy. Since the transition, his output looks fine on paper, high ticket counts, green checkmarks everywhere, but the actual product keeps breaking in ways the old rubric never would have caught. He writes tests that technically pass but don't meaningfully cover edge cases, and he'll decompose a genuinely hard problem into a pile of narrowly "closed" tickets that don't add up to a working feature. When I've raised this with him, he isn't being cynical or lazy about it; he seems honestly convinced he's doing exactly what good engineering looks like, because that's precisely what got him praised and promoted a few months ago.

  I'm trying to figure out how to think about this rather than just chalk it up to "he's not that good, actually." Was this a bad hire, a badly designed internship rubric, or something more structural, something about how the specific metrics we trained and evaluated him against shaped what he actually internalized as "doing a good job," in a way that only became visible once he was moved into an environment different from the one he was evaluated in? I'd like help understanding what's really going on here conceptually, and what that understanding implies both for how I coach Dan going forward and for how we design evaluation criteria in future internship programs, so we're not inadvertently producing more engineers like him.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Role:** Tech Lead at a mid-sized software company.
      *   **Situation:** Ran a structured internship program with rigid metrics (ticket throughput, checklist compliance).
      *   **Subject:** Dan, a top-performing intern under that system, converted to full-time.
      *   **Current Issue:** Dan is struggling in the open-ended full-time role. He optimizes for the old metrics (high ticket count, green checkmarks) but produces low-quality work (brittle tests, fragmented features, breaking products).
      *   **Dan's Mindset:** He isn't lazy or cynical; he genuinely believes he's doing the right thing because that's what was rewarded before.
      *   **User's Goal:** Understand the *conceptual* root cause (bad hire? bad rubric? structural issue?) and get advice on coaching Dan + redesigning the internship program.

  2.  **Diagnose the Core Issue:**
      *   *Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure." The internship metrics became the target, not the underlying engineering quality.
      *   *Campbell's Law:* Similar to Goodhart's, specifically regarding social indicators.
      *   *The Cobra Effect:* Perverse incentive structures leading to unintended negative consequences.
      *   *Context Switching:* The environment changed from "Factory/Assembly Line" (structured, well-specified) to "Studio/Craftsmanship" (open-ended, ambiguous). Dan is still operating in "Factory Mode."
      *   *Learned Helplessness/Conditioning:* Dan was conditioned to seek external validation via checklists. He hasn't developed internal quality heuristics.
      *   *Systemic Failure:* This is primarily a management/system design failure, not necessarily a hiring failure. Dan did exactly what the system asked him to do.

  3.  **Structure the Response:**
      *   **Validation:** Acknowledge the user's insight. It's not just "Dan is bad." It's a systemic issue.
      *   **Conceptual Framework:** Name the phenomena (Goodhart's Law, Context Mismatch, Extrinsic vs. Intrinsic Motivation).
      *   **Diagnosis:** Break down *why* this happened (The Rubric Trap, The Environment Shift).
      *   **Action Plan for Dan (Coaching):** How to fix the immediate problem without firing him immediately (assuming he has potential). Focus on shifting mental models.
      *   **Action Plan for the Program (Prevention):** How to redesign the internship to prevent recurrence.
      *   **Conclusion:** Summarize the key takeaway.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Validate the user. This is a classic management case study. It's not a "bad hire" in the traditional sense; it's a "system-induced behavior" issue.
      *   **Conceptual Lens:**
          *   *Goodhart's Law:* Explain it simply. The metric became the goal.
          *   *Extrinsic vs. Intrinsic:* The internship rewarded extrinsic cues (checklists). Real engineering requires intrinsic judgment.
          *   *Complicated vs. Complex:* Internship work was *complicated* (clear steps). Real work is *complex* (unclear outcomes). Dan is applying complicated solutions to complex problems.
      *   **Diagnosing Dan:** He's not incompetent; he's *over-fitted*. Like a machine learning model trained on training data that doesn't match production data. He learned "how to pass the internship," not "how to engineer."
      *   **Coaching Dan:**
          *   *Stop the bleeding:* Pair him with seniors.
          *   *Reframe the goal:* Shift from "Closing Tickets" to "Solving Problems."
          *   *Feedback loop:* Change *how* feedback is given. Stop praising the checklist. Start praising the outcome.
          *   *Psychological Safety:* Make sure he knows he's not in trouble for *trying* the old way, but needs to learn the new way.
      *   **Redesigning the Internship:**
          *   *Reduce specificity:* Introduce ambiguity earlier.
          *   *Outcome-based metrics:* Did the feature work for the user? Not just did the tests pass.
          *   *Qualitative assessment:* Code review quality, communication, problem decomposition.
          *   *The "Why":* Teach them *why* the checklist exists, not just *that* it exists.
      *   **Management Reflection:** The Tech Lead needs to own this. The system created Dan. The system must fix Dan.

  5.  **Refining the Tone:**
      *   Needs to be empathetic but firm.
      *   Professional, analytical, yet actionable.
      *   Avoid blaming Dan entirely, but don't let him off the hook for adapting.
      *   Avoid blaming the user entirely, but highlight the structural oversight.

  6.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe suggest firing Dan. *Correction:* No, the user asked how to coach and understand. Dan was "top performer," implying capability. He just needs retraining. Firing should be a last resort if he can't adapt.
      *   *Initial thought:* Blame the HR rubric. *Correction:* It's likely engineering leadership designed the rubric. Own the engineering management side.
      *   *Key nuance:* Make sure to distinguish between "compliance" and "competence." Dan is compliant, not necessarily competent in the new context.

  7.  **Final Polish:** Check for clarity, flow, and ensure all parts of the user's prompt are addressed (Conceptual understanding, Coaching Dan, Future Program Design). (This aligns with the structure developed in step 3).

  8.  *(Final check against safety guidelines)*: No sensitive PII, no harmful advice. All good.

  9.  **Generate Output.** (Proceed to write the response based on these thoughts.)
answer: |-
  This is a textbook case of **Goodhart's Law** meeting **Context Mismatch**, and it is one of the most common structural failures in engineering management.

  To answer your core question directly: **This is not a bad hire. This is a system that successfully optimized for the wrong variable.**

  Dan is not "faking it." He is behaving exactly as the system trained him to behave. You have created a high-fidelity simulation of engineering work that inadvertently rewarded compliance over competence. Now that he has been moved to production, the simulation has ended, but he is still playing by the simulation rules.

  Here is a conceptual breakdown of what is happening, followed by actionable advice on coaching Dan and redesigning your program.

  ### 1. The Conceptual Diagnosis

  **Goodhart's Law in Action**
  Goodhart's Law states: *"When a measure becomes a target, it ceases to be a good measure."*
  During the internship, ticket throughput and checklist compliance were targets. Dan optimized for them. He didn't optimize for "software reliability" or "user value" because those weren't the measured targets. He played the game you built. In game theory terms, he found the dominant strategy.

  **The "Over-Fitted Model" Problem**
  Think of Dan like a machine learning model. You trained him on a specific dataset (structured tickets, rigid checklists). He achieved 99% accuracy on the training set. However, you have now deployed him into production (open-ended problems, vague requirements), which is a different data distribution. He is **over-fitted** to the internship environment. He hasn't generalized the concept of "engineering"; he has memorized the concept of "interning."

  **Complicated vs. Complex Work**
  *   **Internship (Complicated):** There is a right answer, a clear path, and a defined finish line. Success is deterministic.
  *   **Full-Time (Complex):** The path is unclear, the requirements shift, and "done" is subjective. Success is probabilistic.
  Dan is applying deterministic tactics to probabilistic problems. Breaking a hard problem into small tickets is usually good advice, but when done without regard for the holistic feature, it becomes "ticket theater"—creating the illusion of progress without the reality of value.

  **Extrinsic vs. Intrinsic Quality Control**
  The internship rubric externalized quality control. Dan doesn't need to ask, "Is this test good?" He asks, "Does this test satisfy the coverage percentage?" You removed the need for him to develop an internal compass for quality. Now that the external compass is gone (or less rigid), he is directionless.

  ### 2. How to Coach Dan (Immediate Remediation)

  Do not frame this as "you are doing a bad job." Frame it as "the game has changed, and the rules you mastered no longer apply."

  **A. Explicitly Name the Shift**
  Have a candid conversation. Acknowledge that the internship metrics were training wheels, not the bike.
  *   *Say this:* "Dan, you crushed the internship metrics. You mastered the rubric we gave you. But that rubric was designed to measure learning velocity, not production ownership. The metrics we used then are actually dangerous now. I need you to unlearn 'closing tickets' and learn 'shipping value.'"
  *   *Why:* This validates his past success (preserving confidence) while invalidating the method (forcing change).

  **B. Change the Feedback Loop**
  Stop reviewing his PRs for checklist items. He already knows how to pass those. Start reviewing for **outcome**.
  *   *The New Rubric:* When a bug comes back from QA or production, trace it to Dan. Don't ask, "Did you write the test?" Ask, "What scenario did this test miss, and why did you think it wasn't necessary?"
  *   *Force Reflection:* Make him write the post-mortem for his own breakages. He needs to feel the pain of the "green checkmark" failing to protect the product.

  **C. Pair Programming with a "Why" Focus**
  Pair him with a senior engineer who has strong product intuition.
  *   *Instruction to Senior:* Do not let Dan drive. Have him observe. The goal isn't to show him *how* to code, but to narrate the *decision-making process*. "I'm not writing this test because the linter wants it; I'm writing it because I'm worried about what happens if the API times out."
  *   *Goal:* Externalize the internal monologue of a senior engineer so Dan can hear what "quality" actually sounds like in conversation.

  **D. Redefine "Done"**
  For the next month, Dan is not allowed to mark a ticket as "Done" until a peer verifies the feature works end-to-end, regardless of ticket status.
  *   *Constraint:* If he splits a feature into 5 tickets, none of them are "Done" until the feature works. This breaks the habit of accumulating "closed" tickets that don't function.

  ### 3. Redesigning the Internship Program (Systemic Fix)

  You need to prevent the next Dan. The goal of an internship should be to assess **potential for judgment**, not **capacity for compliance**.

  **A. Introduce Ambiguity Early**
  Do not give interns a fully specified backlog for the whole summer.
  *   *The Fix:* Give them a goal ("Improve the load time of this page") rather than a ticket ("Refactor function X"). Let them write the tickets. Evaluate them on *what* they chose to build, not just how well they built it.
  *   *Why:* This tests problem decomposition and prioritization, which are the skills failing in your current full-time Dan.

  **B. Measure Outcomes, Not Output**
  Shift the grading weight from "Tickets Closed" to "Features Shipped & Stable."
  *   *The Fix:* If an intern closes 20 tickets but the feature requires hotfixes the week after they leave, their score should reflect that.
  *   *Why:* This aligns their incentives with the long-term health of the codebase, not the short-term velocity.

  **C. Qualitative over Quantitative**
  The checklist (linting, coverage %) should be a *threshold* (pass/fail), not a *score*.
  *   *The Fix:* Once they hit 80% coverage, getting to 90% earns no extra points. Instead, grade them on Code Review quality. Did they catch logic errors in their peers' code? Did they ask clarifying questions about requirements?
  *   *Why:* This rewards critical thinking and collaboration, which are harder to game than a coverage percentage.

  **D. The "Broken Build" Test**
  Intentionally introduce a vague requirement or a conflicting constraint midway through the internship.
  *   *The Fix:* See how they react. Do they freeze? Do they ask for clarification? Do they make a reasoned assumption and document it?
  *   *Why:* You want to hire people who can navigate ambiguity, not just people who can follow a map.

  ### Summary

  You are currently suffering from the **Cobra Effect**: you offered a bounty for dead cobras (tickets closed), so people started breeding cobras (gaming the tickets).

  Dan is salvageable. He is clearly disciplined, hardworking, and capable of learning complex systems (he mastered your rubric, after all). The deficit is in **engineering judgment**, which is a skill, not a trait.

  1.  **Own the system failure.** Tell Dan the metrics changed, not that he failed.
  2.  **Coach for judgment.** Focus feedback on *why* decisions were made, not *what* was produced.
  3.  **Fix the pipeline.** Ensure the next cohort is evaluated on navigating ambiguity, not just executing instructions.

  If you treat this as a "Dan problem," you will fire him and hire someone else who will eventually fail the same way. If you treat this as a "Management System problem," you save Dan and upgrade your entire hiring pipeline.
