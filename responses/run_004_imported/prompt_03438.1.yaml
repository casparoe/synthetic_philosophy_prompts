      *   Bring in the Morton White angle but deepen it. White said holism blurs the line. The deeper argument is that *naturalism* dissolves the ontological gap the friend relies on.
      *   *Self-Correction during drafting:* Avoid arguing *for* moral realism. The goal is to show Quine is *internally inconsistent* or *not entitled* to the distinction. Keep it immanent to Quine's system.

