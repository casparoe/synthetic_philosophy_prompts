answer: |-
  The strongest argument against your friend does not rest on denying that science has a unique relationship to prediction, nor does it rely solely on the blunt instrument of holism. Instead, it attacks the **ontological privilege** your friend grants to "external nature."

  Your friend's objection relies on a metaphysical dualism that Quine's own naturalism explicitly forbids. The argument is that Quine is not entitled to treat "physical nature" as a theory-independent anchor while treating "moral tastes" as theory-dependent projections. If Quine takes his naturalism seriously, he must admit that **human beings and their sentiments are part of nature**, and therefore the "friction" ethics encounters is just as natural and causal as the friction science encounters.

  Here is the construction of that argument, broken down into three moves.

  ### 1. The "Nature" to Which Science Answers is a Posit, Not a Given
  Your friend argues that science is constrained by an "external nature" that forces itself upon us. But for Quine, there is no access to "nature" except through the web of belief itself. "External physical objects" are not pre-theoretical givens; they are **theoretical posits** introduced to make sense of sensory irritations (neural intake).

  Quine famously argues that we posit physical objects because they are useful conceptual imports for predicting the flux of experience. But this means the "external nature" your friend cites is not a metaphysical foundation standing outside the web; it is a construct *within* the web.
  *   **The Trap:** If Quine says science is answerable to "nature," but "nature" is itself a hypothesis generated by science to explain sensory input, he cannot use "nature" as an independent tribunal to judge ethics without circularity.
  *   **The Implication:** To say science answers to "nature" while ethics answers only to "tastes" is to privilege one set of posits (physical objects) over another set of posits (values/goals) without an external vantage point. Quine rejects "First Philosophy"—the idea that we can step outside our web of belief to see which parts hook onto Reality and which don't. Your friend is inadvertently doing First Philosophy by asserting that physical posits hook onto Reality while moral posits do not.

  ### 2. Sensory Irritation Includes Affective Input
  Quine's epistemology bottoms out in "sensory stimulation" or "neural intake." Your friend claims science has a causal periphery (nature forcing itself on us) that ethics lacks. But this assumes that "causal impact" is limited to photons hitting retinas or sound waves hitting eardrums.

  For a naturalist, **pain, distress, and social friction are also causal impacts.**
  *   When a child cries, that is a sensory stimulation.
  *   When a community fractures due to conflicting norms, that results in behavioral dysfunctions that are observable and causally efficacious (violence, starvation, collapse).
  *   Quine's dog refusing the turnip is not just "indifference"; it is a biological organism registering a negative value in its environment.

  If the "tribunal of experience" is neural intake, then the distress caused by witnessing suffering is just as much a "recalcitrant experience" as the failure of a prediction in physics. The friend's distinction relies on a narrow definition of "nature" that excludes human psychology. But for Quine, humans are natural objects. Therefore, the "tastes" your friend dismisses are **natural facts about human neurology and sociology.** If science tracks the behavior of physical objects, ethics tracks the behavior of social animals. Both are empirical inquiries into natural phenomena. To say one tracks "nature" and the other tracks "mere taste" is to draw an arbitrary line within the natural world that Quine's ontology does not support.

  ### 3. The Inconsistency of "Ultimate Ends" vs. "Logical Laws"
  Quine admits that logic and mathematics are central to the web of belief and are justified by their utility in simplifying the system, not by direct observation. He treats them as revisable in principle, though deeply entrenched.
  *   **The Parallel:** "Ultimate ends" in ethics function exactly like logical laws or principles of simplicity in science. They are the central nodes that organize the periphery. We do not justify the law of non-contradiction by pointing at a rock; we justify it because the web collapses without it. Similarly, we do not justify "suffering is bad" by pointing at a particle; we justify it because the social web collapses without it.
  *   **The Friend's Error:** Your friend argues that scientific centrality (logic/math) counts as answerable to the world, but ethical centrality (values) does not. But if holism is true, *nothing* is answerable to the world in isolation. Everything is answerable in terms of how well the *whole web* handles sensory irritation.
  *   **The Knockout:** If Quine allows that logical principles are validated by their contribution to the web's overall predictive success, he must allow that moral principles are validated by their contribution to the web's overall *pragmatic* success (social cohesion, reduction of conflict). To deny this is to claim that "predicting particles" is metaphysically superior to "predicting social stability." But for a naturalist, both are just strategies for a species navigating its environment.

  ### Conclusion: The Naturalistic Dilemma
  You can put the argument to your friend as a dilemma regarding Quine's consistency:

  1.  **If Quine maintains the asymmetry:** He must claim that "physical nature" is a metaphysically privileged realm distinct from "human nature." This violates his naturalism, which views humans as continuous with the rest of the physical world. It reintroduces the fact/value dualism he claims to be dissolving through empiricism.
  2.  **If Quine embraces naturalism fully:** He must admit that moral values are hypotheses about how to satisfy the needs of a natural organism (humans) within a causal environment. The "recalcitrance" of moral error is the pain and social dysfunction that results from bad moral hypotheses.

  **The Verdict:** Your friend is mistaken because they are treating "nature" as a metaphysical absolute rather than a scientific posit. Quine is not entitled to the asymmetry because his own naturalism dissolves the boundary between "external constraint" and "internal taste." Both are interactions between a natural organism and its environment. Science models the non-human part of the environment; ethics models the inter-human part. Both are answerable to the same tribunal: the causal friction of experience. Quine can prefer science for its *precision*, but he cannot claim it has a *metaphysical* anchor that ethics lacks without abandoning the naturalism that defines his philosophy.
