answer: |-
  Here is the verdict, stripped of the hedging: **Your postdoc is right.** The conflation is sloppy, theoretically dangerous, and obscures the specific mechanism that makes honest signaling possible. While your advisor is correct that the *mathematical skeleton* is isomorphic (both rely on separating equilibria in asymmetric information games), the Handicap Principle (HP) is a **strict, non-trivial subset** of Costly Signaling Theory (CST). Treating them as synonymous allows researchers to bypass the rigorous conditions required for signal stability.

  Here is the breakdown of why HP is meaningfully special, why the differential cost requirement is load-bearing, and where the social science analogies break down.

  ### 1. The Differential Cost Requirement is Load-Bearing
  The core of the disagreement lies in the **single-crossing property** (or condition-dependent marginal costs).

  *   **The Theory:** For a signal to be honest in a separating equilibrium, it is not enough for the signal to be *costly*. It must be **differentially costly**. The marginal cost of increasing the signal must be lower for high-quality individuals than for low-quality individuals.
  *   **Grafen (1990):** Alan Grafen's formalization of Zahavi's intuition proved that without this differential cost structure, the system collapses into a pooling equilibrium (everyone signals, or no one signals) or instability.
  *   **The Sloppiness:** In much of the economic and anthropological literature (e.g., applications of Sosis's ritual cost or Veblenian consumption), the argument often stops at "the signal is expensive, therefore it is honest." This is false. If a $10,000 wedding costs a rich man $10,000 and a poor man $10,000 (in utility terms), the poor man *should* mimic if the benefit of the signal (social status) exceeds $10,000. The signal is only stable if the *marginal utility loss* is significantly higher for the poor man.
  *   **Why HP is Special:** Biological HP literature demands empirical proof of this differential. In frog calls (your wheelhouse), we measure the metabolic cost relative to body condition. In social science, "cost" is often asserted axiomatically. HP is special because it treats the differential cost not as an assumption, but as the **mechanism of honesty**.

  ### 2. Index vs. Handicap (The Maynard Smith & Harper Distinction)
  This is where the "unified theory" argument falls apart completely.

  *   **Indices:** Signals that are physically constrained and impossible to fake (e.g., vocal pitch determined by larynx size, or muscle mass as a sign of strength). These are honest by physical necessity, not by economic trade-off.
  *   **Handicaps:** Signals that *could* be faked but are too expensive to fake (e.g., a peacock's tail, a gazelle's stotting).
  *   **The Conflation:** Much of the "costly signaling" literature in anthropology and sociology lumps indices and handicaps together. A hazing ritual might be a handicap, but a scar from a hunt might be an index.
  *   **Why HP is Special:** Zahavi's HP applies **only** to handicaps. It explains the evolution of traits that *reduce* survival probability. If you conflate HP with general CST, you lose the explanatory power for why organisms evolve *maladaptive* traits. General CST can explain indices (costly but physically constrained); HP specifically explains the evolution of **viability-reducing** traits. That is a distinct biological phenomenon that requires the specific ESS logic Grafen provided.

  ### 3. The Currency Problem: Fitness vs. Utility
  Your advisor's view holds up mathematically, but fails biologically because of the currency of cost.

  *   **Economics (Spence/Veblen):** The currency is transferable utility (money, time, effort). I can work three jobs to pay for the signal. The cost is external to my biological state.
  *   **Biology (Zahavi):** The currency is **fitness** (survival/reproduction). This is non-transferable. You cannot borrow "survival" from a neighbor to pay for your tail.
  *   **The Implication:** In HP, the cost is paid directly in the probability of death or reduced future reproduction. This creates a much harder constraint than economic cost. In economics, if the benefit outweighs the cost, a low-type *should* signal. In HP, if a low-type signals, they die *before* realizing the benefit.
  *   **Why HP is Special:** HP describes a system where the cost is **immediate and existential**, whereas general CST often describes costs that are **deferred or fungible**. This makes HP a "harder" version of signaling. A system that satisfies HP conditions automatically satisfies CST conditions, but a system that satisfies CST conditions (e.g., buying a luxury car) does not necessarily satisfy HP conditions (viability reduction).

  ### The Verdict
  The Handicap Principle is **not** just Costly Signaling Theory wearing a mating-display costume. It is the **evolutionarily stable, viability-constrained core** of Costly Signaling Theory.

  Your advisor is correct that they share a mathematical lineage (separating equilibria via asymmetric costs). However, your postdoc is correct that treating them as identical is sloppy. General CST is often used as a "just-so" story framework where cost implies honesty. The Handicap Principle is a **specific mechanistic hypothesis** that requires:
  1.  **Condition-dependent marginal costs** (not just absolute cost).
  2.  **Viability reduction** (the signal must be detrimental to survival, not just expensive).
  3.  **Exclusion of indices** (the signal must be fakable in principle).

  Most social science applications of "costly signaling" fail criteria 1 and 2. They are analogies, not instantiations. By calling them "Handicap Principle," researchers borrow the rigor of Grafen's ESS proof without doing the work to satisfy its conditions.

  **Final Call:** The Handicap Principle is a **strict subset** of Costly Signaling. It is the only version of CST that fully accounts for the evolution of maladaptive traits through natural selection. Conflating the two dilutes the HP into a tautology ("honest signals are costly") rather than a predictive theory ("signals are honest *because* marginal costs scale negatively with quality"). Stick with the postdoc's rigor; it's what keeps the biology from becoming just-so storytelling.
