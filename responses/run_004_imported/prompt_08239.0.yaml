  9.  **Final Polish:** Check for clarity, empathy, and accuracy regarding Project Prakash findings (Sinha et al.). Ensure the distinction between congenital cataracts and total blindness is acknowledged (she has light/dark perception, which is slightly different than total darkness, but functionally similar for shape recognition).

