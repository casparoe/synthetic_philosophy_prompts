answer: |-
  This is an exceptionally sharp reading of the Scholium. Most commentators rush to the bucket because it offers an empirical handle on the debate, but the passage you've isolated is where Newton lays his metaphysical cards on the table. It is indeed distinct from the bucket argument: where the bucket is an *a posteriori* argument from effects (forces) to causes (absolute motion), this passage is an *a priori* argument from the *concept* of place to the *nature* of space.

  Here is a reconstruction of the argument, an evaluation of its success, and the specific relationist counter-move.

  ### 1. Sentence-by-Sentence Reconstruction

  Newton is attempting to derive the immutability of space from the very definition of what it means to be a "place."

  > **"As the order of the parts of time is immutable, so also is the order of the parts of space."**

  *   **Function:** Premise/Analogy.
  *   **Analysis:** Newton asserts a structural parallel between time and space. Just as "tomorrow" cannot swap places with "yesterday" without destroying the concept of time, point $A$ in space cannot swap with point $B$. He assumes space has "parts" (points or regions) that possess an intrinsic ordering independent of the matter within them.

  > **"Suppose those parts to be moved out of their places, and they will be moved (if the expression may be allowed) out of themselves."**

  *   **Function:** Reductio ad Absurdum setup.
  *   **Analysis:** This is the core metaphysical claim. Newton is arguing that a "part of space" is *individuated* by its location. In modern terms, he is arguing for **haecceity**: the "this-ness" of a spatial point is identical to its position in the absolute grid. If a point moves, it is no longer *that* point. To move a part of space is a category error, like moving the number 5.

  > **"For times and spaces are, as it were, the places as well of themselves as of all other things."**

  *   **Function:** Justification of the Reductio.
  *   **Analysis:** Newton posits space as self-locating. Ordinary objects are "in" space, but space is "in" itself. It is the ultimate container that does not require a further container. This denies the relationist view that space is merely a set of relations *between* objects. For Newton, space is a substance-like entity that exists even if empty.

  > **"All things are placed in time as to order of succession; and in space as to order of situation."**

  *   **Function:** Functional Definition.
  *   **Analysis:** Space and Time are the universal reference frames. They provide the "order of situation" (geometry/topology) and "order of succession" (temporal sequence). This establishes their role as the necessary conditions for intelligible measurement.

  > **"It is from their essence or nature that they are places; and that the primary places of things should be movable, is absurd."**

  *   **Function:** The Modal Claim.
  *   **Analysis:** This is the crux. Newton argues that immobility is an *essential property* of "Place." If the primary reference frame (Absolute Space) could move, it would cease to function as a reference frame. Therefore, it is metaphysically impossible for Absolute Space to move. He moves from "we need a fixed frame to define motion" to "there exists an immutable entity."

  > **"These are therefore the absolute places; and translations out of those places, are the only absolute motions."**

  *   **Function:** Conclusion.
  *   **Analysis:** Having established that the "parts of space" are immutable by essence, he concludes that motion relative to these parts is the only "true" motion. This sets the stage for the bucket argument, which is intended to show how we can *detect* this motion empirically.

  ### 2. The Verdict: Metaphysical Insight or Question-Begging?

  Is this a genuinely independent argument, or a stipulative move?

  **Verdict:** It is a **reification of the coordinate system**. It succeeds only if you already accept Newton's ontology of space as a *substantival container*, but it fails as a proof against a relationist because it begs the question at the second sentence.

  **Why it feels like an independent argument:**
  Newton is identifying a genuine conceptual necessity: to define velocity or acceleration rigorously, you need a rigid reference frame. If your ruler shrinks or your grid shifts, your measurements lose objective meaning. Newton correctly identifies that relative motion between bodies is insufficient for dynamics (as the bucket will show).

  **Why it fails as a proof of Substantivalism:**
  The argument trades on an equivocation between **space as a mathematical framework** and **space as a physical entity**.
  1.  **The Equivocation:** Newton argues that because the *concept* of a reference frame must be immutable (to serve its function), the *entity* serving as that frame must be physically immutable and existent.
  2.  **The Relationist Objection:** A relationist (like Leibniz) agrees that we need a rigid frame for calculation, but argues this frame is an **abstraction**, not a **thing**. To say "the parts of space cannot move" is, for a relationist, like saying "the numbers on a graph cannot slide off the paper." Of course they can't; they aren't physical objects.
  3.  **The Begging of the Question:** When Newton says, "Suppose those parts to be moved... they will be moved out of themselves," he assumes the parts of space have independent identity (haecceity). A relationist denies this. For a relationist, a "part of space" is defined *by* the bodies in it. If there are no bodies, there are no parts to move. Newton assumes the parts exist *prior* to the bodies to make his argument work.

  **Honest Assessment:**
  Newton is not offering an empirical proof here; he is offering a **transcendental argument** about the conditions of possibility for physics. He is saying: *"Physics requires absolute motion; absolute motion requires absolute places; absolute places must be immutable by definition."*
  It is logically valid *within his system*, but it is not persuasive to someone who denies the first premise (that physics requires absolute places rather than just relative configurations plus laws of inertia). It is closer to a stipulative definition of "Absolute Space" disguised as a metaphysical deduction.

  ### 3. The Sharpest Relationist Reply (Leibniz/Barbour)

  Leibniz's famous replies to Clarke (which defend Newtonian substantivalism) focus on the **Principle of Sufficient Reason (PSR)** and the **Identity of Indiscernibles (PII)**. Applied specifically to *this* passage, the reply is devastating.

  **The Argument from Indiscernibility:**
  Newton claims the "parts of space" have an immutable order and distinct essence ("moved out of themselves"). Leibniz would ask: **What distinguishes one part of empty space from another?**

  1.  **No Intrinsic Properties:** If space is a container independent of matter, point $X$ and point $Y$ in empty space have no intrinsic differences. They are qualitatively identical.
  2.  **No Identity:** If they are qualitatively identical, they are numerically identical (by PII). If all parts of space are identical, they cannot have an "order." An order requires distinct relata.
  3.  **The Collapse of the Argument:** If the parts of space are indiscernible, the statement "Suppose those parts to be moved out of their places" is meaningless. You cannot move a part of space to a new place if all places are identical. There is no "out of themselves" because there is no "themselves" to begin with.

  **The Modern/Barbourian Twist:**
  Connecting back to your interest in Yudkowsky and Barbour:
  Barbour would argue that Newton has reified the **"Nows"** of space just as he reified the **"Nows"** of time.
  *   **Newton:** Space is a fixed stage; bodies move across it.
  *   **Barbour:** The "stage" is an illusion generated by the relationships between the actors. There is only the configuration of bodies (the "heap of Nows").
  *   **Reply to this Passage:** When Newton says, "It is from their essence or nature that they are places," Barbour would reply: **"No, it is from their *relations*."**
      *   A "place" is not a pre-existing slot in a grid. A "place" is a potential position relative to other masses.
      *   To say a place is "movable is absurd" is true only if you think a place is a *thing*. If a place is a *relation*, it doesn't move; the relations change.
      *   Newton's error is treating the **degrees of freedom** in the configuration space as **physical locations** in a substantival container.

  ### Summary
  Newton's argument in this passage is a **metaphysical grounding** for his physics, not an empirical proof. It argues that for motion to be real, the background must be real and immutable.
  *   **Strength:** It correctly identifies that relative motion alone is insufficient for dynamics (inertia requires a preferred frame).
  *   **Weakness:** It conflates the *necessity of a reference frame* with the *existence of a substance*.
  *   **Defeat:** Leibniz defeats it by arguing that indiscernible parts of space have no identity, so they cannot have an "immutable order." Barbour defeats it by arguing that the "order" is emergent from configuration, not foundational.

  Newton wins the physics of the 18th century with this move, but he loses the metaphysics of the 20th (and 21st). He treats the coordinate grid as a divine sensorium rather than a bookkeeping tool.
