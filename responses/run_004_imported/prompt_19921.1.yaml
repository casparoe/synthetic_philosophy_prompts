  8.  **Refining the Tone:**
      *   Use terms like "locus of variance," "salience," "assertability conditions," "decision-theoretic."
      *   Keep it punchy. No "In conclusion."
      *   Address the "rationalist" angle (Bayesianism).

  9.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I distinguish Hawthorne/Stanley from Fantl/McGrath?
      *   *Correction:* Hawthorne/Stanley is SSI (Knowledge itself varies). Fantl/McGrath is often framed as Knowledge Norm of Action (KNA) + Encroachment. For this purpose, they function similarly regarding stakes. I will group them under PE/SSI for clarity but acknowledge the nuance.
      *   *Check:* Did I answer the "cheat" question?
