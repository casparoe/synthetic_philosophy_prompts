      *   *Section 3: The "Cheat" Accusation.* Address salience. EC says subject stakes are relevant *only if* salient to speaker. PE says they are relevant *period*.
      *   *Section 4: The Verdict.* Pick a side. I'll argue PE is less ad hoc metaphysically, even if EC is linguistically smoother. Semantic blindness is a killer for EC.
