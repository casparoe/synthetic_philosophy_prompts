      *   *Check:* Is the verdict clear?
      *   *Correction:* Make sure I don't hedge too much. The prompt explicitly forbids the "both sides have costs" shrug. I need to weigh the costs. Semantic blindness is a bigger theoretical cost than counter-intuitive truth conditions for "knows."

  10. **Final Polish:** Ensure the Bayesian section doesn't feel tacked on. It should reframe the whole debate. (The debate is about whether "Knowledge" is a natural kind or a speech-act tool).

  *(Self-Correction on Verdict)*: Actually, for a rationalist audience, the Bayesian translation often dissolves the debate. I should emphasize that. But I still need to pick a winner in the traditional framework first. I will argue PE is the "ontologically serious" view, EC is the "linguistic pragmatic" view. PE wins on truth, EC wins on usage. Given the prompt asks about "real difference" and "truth of 'she knows'", PE is the stronger candidate for *truth*.

