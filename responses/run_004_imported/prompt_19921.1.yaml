      *   *Disagreement:* Does it survive? Yes, but it shifts from "Truth of 'Knows'" to "Norm of Assertion vs. Norm of Action."
      *   EC = Norm of Assertion is context-sensitive.
      *   PE = Norm of Action is stakes-sensitive, and "Knowledge" is just the label for "Epistemic position sufficient for Action."
      *   In pure credence terms, the disagreement dissolves into: "Is there a distinct epistemic state called Knowledge, or is it just Credence + Utility?" PE says the latter (mostly). EC says the reporting mechanism varies.

  7.  **Drafting the Response (Iterative refinement):**
