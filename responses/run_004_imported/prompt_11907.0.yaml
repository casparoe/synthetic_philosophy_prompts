answer: |-
  Good evening, everyone. For those of you who don't know me, I'm the sibling of the bride. I work in marketing, which means my entire career is built on convincing people that imaginary futures are real. My sister, on the other hand, is finishing her PhD in metaphysics, which means she spends her life proving that the real world is just one of many concrete realities.

  So, you can imagine the pressure I felt when she asked me to give this toast. She gave me one specific instruction: "Please do not say, 'Out of everyone in the world you could have ended up with, you chose each other.'"

  When I asked why, she sighed the sigh of someone who has graded one too many undergraduate papers and said, "Because in David Lewis's framework, 'could have' implies mere possibility. But every possibility is real. There *are* worlds where I didn't meet [Partner's Name]. There are worlds where we met and hated each other. There are worlds where I married a lighthouse keeper in Tasmania."

  She looked at me and said, "If you tell this room that other options weren't real, the philosophy department will laugh. If you tell them they *were* real, the family will think she's having an affair with a Tasmanian lighthouse keeper."

  So, I had to find a middle ground. And I think I found it.

  Here is the truth, as best as I can understand it: In the vast plurality of worlds, every version of every story is being told. There is a concrete, real world where I am dropping this microphone right now. There is a world where the catering never arrived. And yes, there are worlds where my sister and [Partner's Name] never crossed paths.

  But modal realism also teaches us that "actual" is just an indexical term. It just means "here." It means *this* place. *This* time. *Us*.

  Among the infinite noise of the multiverse, among the countless counterparts living out every variation of existence, we are privileged to inhabit the world where your paths didn't just cross—they converged. We are in the world where you decided to build a life not because it was the only option, but because out of all the realities that exist, this is the one you chose to call home.

  [Partner's Name], I have to thank you. I don't know what your counterparts are doing in other worlds. Maybe in some of them, you're much more difficult to deal with. But in this world, you make my sister happier than I have ever seen her. You ground her. And for a modal realist, finding someone who makes *this* world feel more significant than all the others combined… that is the highest compliment you can pay.

  To the rest of the family, who might be wondering if we're about to open a portal to another dimension: don't worry. The only magic tonight is the kind that happens when two people decide to share a single reality, no matter how many other options are out there.

  So, if everyone could please raise a glass.

  To the bride and groom. May your love be necessary in every possible world, but may you always cherish the one where you are actually standing here, together, right now.

  To the Actual World.
