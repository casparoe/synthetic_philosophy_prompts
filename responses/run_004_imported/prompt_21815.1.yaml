      *(Self-Correction during drafting)*: Make sure to be precise about "uncaused." In Marcus's view, the cause is the *setup* including the boundary condition. Alina views the cause as needing to be *internal* to the process. Both have valid definitions of causation at play.
      *(Refining Claim 1)*: Alina claims it's a "genuine proof." It's not a proof, it's an argument based on a premise (that the limit state must follow from the sequence) that is contestable. So (1) is "Mistaken in its conclusion, though valid in its internal logic."
      *(Refining Claim 5)*: This is about Hypercomputation. If the output is arbitrary, it's not a computation. This is a very strong point.

