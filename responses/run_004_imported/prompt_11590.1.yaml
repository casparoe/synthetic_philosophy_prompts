      *   *Question 3 (Combined Spectrum/Empty Questions):* Focus on "Empty Questions."
          *   *Draft:* Is saying the question is empty just a dodge?
          *   *Refinement:* Frame it as ontological deflationism. Is it a discovery about reality or a decision to stop talking?
          *   *Follow-up:* If she says "It's like asking if a heap is a pile," ask about the *stakes* involved (moral responsibility vs. sand).

      *   *Question 4 (Williams/Embodiment):* Focus on Fear and the Body.
          *   *Draft:* Williams says we care about our bodies. You disagree?
          *   *Refinement:* Set up the torture scenario. Why does the intuition track the body? Is Parfit asking us to revise our deepest instincts?
          *   *Follow-up:* If she says "Intuitions are unreliable," ask if philosophy should override evolutionary hardwiring regarding self-preservation.

      *   *Question 5 (Filling the gap - Moral Responsibility):* Parfit's view impacts responsibility. If I'm not strictly identical to my past self, am I responsible?
          *   *Draft:* How does this affect punishment?
          *   *Refinement:* Connect Relation R degrees to degrees of responsibility.
          *   *Follow-up:* If she says "Responsibility tracks R," ask about the *threshold* for punishment.

      *   *Question 6 (Filling the gap - The "Further Fact"):* Parfit rejects the "further fact."
