answer: |-
  Here are nine questions designed to bypass the introductory material and press on the specific philosophical tensions in Parfit's Reductionist view. Each includes a targeted follow-up based on the standard Parfitian defense.

  ### 1. The Branch-Line Asymmetry
  In the Branch-Line case, the original you stays on Earth and dies a few days later, while the replica lives on Mars. Parfit claims this is "as good as" ordinary survival because Relation R holds. But from the *first-person perspective* of the Earth-bound original, there is a definitive end to experience within days. Why should the knowledge that a psychological duplicate is thriving on Mars comfort the version of you who is about to cease existing on Earth, given that the Earth-bound consciousness never inherits the Mars experiences?

  *   **Follow-up:** *If she argues that "survival" doesn't require the survival of the specific subjective perspective:* Push on whether this redefines "survival" so broadly that it no longer answers the fear of non-existence. Ask: "If the 'I' that fears death is the one on Earth, does the Mars replica's happiness actually satisfy the Earth-bound 'I's' desire to continue, or does it just satisfy a third-party observer?"

  ### 2. Fission and "Double Success"
  Parfit describes fission (splitting into two psychologically continuous people) as "double survival" rather than death, even though strict identity is lost because one cannot be identical to two. But if identity is transitive, and neither successor is identical to the original, in what sense is this a *success* for the original? If I am told I will be replaced by two people who are exactly like me, but I will cease to exist, why is that logically distinct from death, other than the fact that my genetic or psychological legacy continues?

  *   **Follow-up:** *If she argues that what matters is the preservation of what we value (memories, projects, character):* Ask whether this conflates *survival* with *legacy*. "If I write a book and die, my ideas survive. If I fission, my ideas survive in two bodies. What is the specific extra ingredient in fission that makes it 'survival' rather than just a very robust form of legacy?"

  ### 3. The Combined Spectrum and "Empty Questions"
  On the Combined Spectrum, where physical and psychological changes occur gradually, Parfit suggests that asking "Is it still me?" in the middle cases is an empty question. Critics argue this looks like a linguistic dodge to avoid an ontological problem. Is claiming the question is "empty" a genuine insight into the vagueness of reality, or is it merely a decision to stop speaking about identity because the metaphysics gets too difficult to pin down?

  *   **Follow-up:** *If she argues that vagueness is a feature of the world, not just language:* Press on the stakes. "We accept vagueness with concepts like 'bald' or 'heap,' but those don't carry moral weight. When the question determines moral responsibility or entitlement to resources, does calling it 'empty' actually solve the problem, or just hide the need for a arbitrary cutoff?"

  ### 4. The Williams Objection (Embodiment and Fear)
  Bernard Williams argued that our fear of future pain tracks the body we expect to wake up in, not just psychological continuity. If I'm told my memories will be copied to someone else who will be tortured, while my current body remains safe, I don't feel fear. But if my body will be tortured, I do, even if my memories are wiped. Doesn't this suggest that embodiment is a constitutive part of what matters for survival, and that Parfit is asking us to argue against our deepest evolutionary instincts regarding self-preservation?

  *   **Follow-up:** *If she argues that intuitions are unreliable or culturally conditioned:* Ask if a theory of survival that contradicts our immediate, pre-theoretical fear response is actually useful. "If the metaphysics tells me I shouldn't fear the torture of my body, but my amygdala still does, has the philosophy actually addressed the human condition, or just described a logical abstraction?"

  ### 5. Special Concern and Prudence
  If identity isn't what matters, but rather degrees of psychological connectedness, my concern for my future self should presumably vary with the degree of connection. But we tend to treat our future selves as having full claim to our current sacrifices. If I save for retirement, I assume that 80-year-old is *me*. If Relation R weakens significantly over 50 years, does Parfit's view imply I am rationally permitted to care less about that future person, potentially undermining long-term prudence?

  *   **Follow-up:** *If she argues that we should still maximize Relation R:* Ask about the *agent-neutral* implication. "If what matters is just the existence of psychological states, why should I prioritize *my* future connectedness over creating *new* people who would have rich psychological lives? Doesn't this view slide into a form of impersonal utilitarianism that dissolves the individual agent?"

  ### 6. The "Further Fact" and Reductionism
  Parfit insists there is no "further fact" of personal identity over and above physical and psychological continuity. But many people feel a persistent sense of self that isn't fully captured by a bundle of memories or physical traits. Is the Reductionist view actually explaining away this experience of a persistent self, or is it denying the existence of a phenomenon that is phenomenologically real, regardless of its metaphysical status?

  *   **Follow-up:** *If she argues that the "self" is a useful fiction:* Ask about the cost of that fiction. "If the self is a fiction, what happens to the concept of autonomy? If there is no 'owner' of the experiences, just the experiences themselves, who is it that is supposed to be free or self-governing?"

  ### 7. Moral Responsibility and Connection
  If I am not strictly identical to the person who committed a crime ten years ago, but only psychologically connected to them, does my liability for punishment diminish as that connection weakens? If Relation R is what matters, and it comes in degrees, does justice require a sliding scale of punishment based on how much the offender has psychologically changed since the crime?

  *   **Follow-up:** *If she says responsibility tracks Relation R:* Push on the practical implementation. "How do we measure that without arbitrariness? If a criminal undergoes a religious conversion or personality shift, does Parfit's view mandate they are literally less deserving of punishment than someone who remained the same, even if the harm caused was identical?"

  ### 8. The Ethics of Replication
  If psychological continuity is what matters, and identity is not, does creating a psychological replica of a person become a morally neutral act, provided the original isn't harmed? If I could copy your mind into a digital substrate without your consent, but the copy would be happy and psychologically continuous with you, have you been harmed in the specific sense of "survival," or only in the sense of bodily autonomy?

  *   **Follow-up:** *If she argues that consent is still required:* Ask what grounds that consent if not identity. "If the copy *is* you in all that matters, why does the original have veto power? Isn't appealing to consent smuggling back in the idea that the original is a unique owner of that psychology, which is the very identity view Parfit rejects?"

  ### 9. Existential Impact vs. Therapeutic Rationalization
  Parfit famously claimed that accepting Reductionism made him feel less afraid of death, as if the boundaries of his life were less rigid. Do you find that holding this view actually changes your emotional relationship with your own mortality, or do you worry that this is a case of tailoring a metaphysical theory to provide a therapeutic conclusion that the logic alone doesn't necessarily earn?

  *   **Follow-up:** *If she says it genuinely reduces her fear:* Challenge the link between truth and comfort. "Parfit thought the view was true *and* consoling. But if we found out Identity *was* what matters, would you abandon the view because it's more frightening? I'm asking if the emotional benefit is a byproduct of the truth, or if it's functioning as a motivation for believing the theory in the first place."
