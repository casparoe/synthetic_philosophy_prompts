      *   **Guest:** A philosopher defending Parfit's view (from *Reasons and Persons*) that identity isn't what matters; Relation R (psychological continuity/connectedness) is what matters.
      *   **Goal:** Skip basic explanations (like the standard Teletransporter case) and dig into harder objections/implications.
      *   **Quantity:** 8 or 9 questions.
      *   **Specific Requirements:**
          1.  One question on the *Branch-Line Case* (why dying shortly after replication feels like death, not survival).
          2.  One question on *Fission* (why "double success" isn't as bad as death despite lack of strict identity).
          3.  One question on the *Combined Spectrum* (is calling in-between cases "empty questions" insight or a dodge?).
          4.  One question on *Bernard Williams' Objection* (fear of pain tracks the body, not psychology).
          5.  One final question on *Practical/Existential Impact* (does this actually change how she feels about her own death, or is it just therapy?).
          6.  Each question needs a tailored follow-up based on the likely answer.
      *   **Tone:** Intellectual, probing, respectful but challenging (suitable for a philosophy podcast).

  2.  **Deconstruct Parfit's Position & The Required Topics:**
      *   *Core Thesis:* Personal Identity over time consists in holding Relation R (psychological connectedness/continuity) with any cause. Identity itself (the "further fact") is not what matters.
      *   *Branch-Line Case:* Teletransporter breaks down after sending copy to Mars. Original on Earth dies a few days later. Parfit says: This is as good as ordinary survival. *Challenge:* Intuitively, it feels like you die on Earth and someone else lives on Mars.
      *   *Fission:* Brain splits, goes into two bodies. Both are psychologically continuous. Neither is strictly *identical* (1 $\neq$ 2). Parfit says: This is "double survival," not death. *Challenge:* How can survival be non-unique?
      *   *Combined Spectrum:* Gradual replacement of cells/psychology. At some point, is it you? Parfit says: In the middle, the question "Is it me?" is empty. *Challenge:* Is this linguistic convenience or ontological truth?
      *   *Williams' Objection:* Thought experiment where you are told you will be tortured tomorrow. If they wipe your memory but keep your body, you still fear it. If they copy your memories to another body but keep your body safe, you don't fear the other body's torture. *Challenge:* Embodiment matters more than Parfit admits.
      *   *Existential Impact:* Parfit claimed this view made death less frightening. *Challenge:* Is this rationalization?

  3.  **Drafting the Questions (Iterative Process):**

