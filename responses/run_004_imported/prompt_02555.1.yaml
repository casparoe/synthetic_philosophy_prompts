answer: |-
  This is a fantastic question that cuts to the heart of some very niche but fascinating decision theory. It's no wonder you and your friend had a long argument; Evidential Cooperation in Large Worlds (ECL) is conceptually dense.

  The short answer is: **Your friend is right, and your position is incorrect.**

  ECL does **not** stand or fall on the Many-Worlds Interpretation (MWI) of quantum mechanics being true. While MWI is *one* way to get the "Large World" necessary for ECL, it is not the *only* way. In fact, standard cosmological models provide a arguably stronger case for ECL without needing quantum branching at all.

  Here is the breakdown of why MWI isn't required, and what ECL actually depends on.

  ### 1. The "Large World" doesn't require Quantum Branching
  Your argument rests on the idea that without MWI, there is only "one regular universe." This is a common intuition, but it contradicts standard modern cosmology.

  Even if the wave function never collapses into multiple branches (i.e., MWI is false), we have strong reason to believe the spatial universe is **infinite** (or at least vastly larger than our observable horizon).
  *   **Eternal Inflation:** Most mainstream inflationary models suggest that space is infinite.
  *   **Combinatorics:** In an infinite universe with a finite number of ways to arrange matter within a Hubble volume, exact duplicates of you must exist simply due to the pigeonhole principle. This is often called the **Level I Multiverse** (in Max Tegmark's classification), as opposed to MWI which is the **Level III Multiverse**.

  For ECL, the mechanism of duplication doesn't matter. Whether your "copy" is in a different quantum branch (MWI) or in a galaxy $10^{10^{50}}$ meters away in the same spatial manifold (Infinite Space), the decision-theoretic logic remains identical: *There are other agents making the same decision as you.*

  ### 2. ECL relies on Correlation, not Causation
  The core engine of ECL is **Evidential Decision Theory (EDT)** or **Functional Decision Theory (FDT)**. These frameworks argue that you should act as if your decision provides *evidence* about the decisions of other agents who are logically similar to you.

  *   **The MWI Case:** If I cooperate, it is evidence that my quantum counterparts in other branches also cooperate.
  *   **The Infinite Space Case:** If I cooperate, it is evidence that my spatial duplicates in other Hubble volumes also cooperate (because they share my source code/upbringing/reasoning process).

  From the perspective of the decision algorithm, these are isomorphic. The "distance" (quantum vs. spatial) is irrelevant to the correlation. As long as the universe is large enough to contain enough copies of you to outweigh the local costs of cooperation, ECL holds.

  ### 3. ECL is a Gradient, not a Binary Switch
  Your argument implies a binary: MWI = Large World, No MWI = Small World. But "Large World" is a threshold concept based on numbers, not ontology.

  ECL becomes compelling when the number of correlated agents ($N$) multiplied by the benefit ($B$) outweighs the cost ($C$) to you locally ($N \times B > C$).
  *   **MWI** generates copies very quickly (at every quantum event).
  *   **Infinite Space** generates copies, but they are spatially distant.

  However, even without MWI *or* Infinite Space, ECL can still apply weakly. If there are merely 1,000 other humans reasoning about ECL in this single observable universe, and you are all logically correlated, there is still an evidential gain to cooperating, just on a smaller scale. MWI just turns the volume up to 11; it doesn't turn the radio on.

  ### 4. Where your intuition might have come from
  You aren't entirely crazy for thinking MWI is special here. There is a subtle distinction regarding **independence**.

  In an infinite spatial universe, duplicates are separated by space-like intervals. In MWI, they are separated by decoherence. Some decision theorists argue that MWI copies might be "more correlated" because they diverge from a common recent history more frequently than spatial duplicates, who might have diverged billions of years ago.

  However, ECL proponents (like Caspar Oesterheld, who formalized much of this) explicitly state that **both** Infinite Space and MWI qualify as "Large Worlds." Oesterheld's papers on ECL generally treat them as interchangeable for the sake of the argument. If one is true, ECL gets a foothold. If *both* are true, the "world" is even larger. If *neither* is true (a finite, single-universe cosmos), ECL loses most of its power, but that is a much stricter condition than just "MWI is false."

  ### The Verdict
  **You owe your friend an apology (or at least a beer).**

  *   **ECL requires:** A universe large enough to contain many correlated decision-makers.
  *   **ECL does not require:** Specifically quantum branching (MWI).

  If MWI is false, but the universe is spatially infinite (which is the consensus view in cosmology regardless of quantum interpretation), the "Large World" still exists, and the ECL argument still stands.

  **One caveat to save face:** You could argue that if *both* MWI is false *and* the universe is spatially finite, then ECL largely collapses. But since your claim was specifically that it hinges on MWI, the physics of infinite space undermines that specific constraint.

  It's a cool argument to have, though. It shows you're really grappling with the metaphysical commitments of decision theory!
