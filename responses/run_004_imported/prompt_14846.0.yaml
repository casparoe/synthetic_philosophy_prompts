answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the privilege of standing up here as the Best Man.

  Looking around this room, I realize we have a unique demographic split. On one side, we have the family and old friends, who are here to celebrate love, drink good wine, and hope the speeches aren't too long. On the other side, we have the colleagues and grad school friends, who spent years studying behavioral ecology and are statistically likely to analyze the mating display I'm performing right now.

  Since the groom and bride spent their formative years thinking about signaling theory for a living, I felt I owed it to them to get the science right. I didn't want to stand up here and give you the standard speech about how "love is blind." Because if you know [Groom] and [Bride], you know nothing about this relationship is blind. It is hyper-observant.

  So, I've been thinking about why we are all here. Specifically, why a wedding? Why not just sign a paper at city hall?

  **[Pause slightly, shift tone to be slightly more analytical – this is the "nerd moment"]**

  There is a concept in evolutionary biology called Zahavi's Handicap Principle. For the non-scientists, stick with me, it's actually quite romantic. The idea is that for a signal to be credible, it has to be costly. A peacock's tail is heavy and attracts predators. Only a truly fit bird can afford to carry it. If the tail were easy to grow, every sickly bird would have one, and the signal would mean nothing.

  Now, the easy joke is to say, "Look at this venue, look at the flowers, look at the open bar—that's the peacock tail." But [Groom] and [Bride] would be the first to tell you that financial cost isn't a true handicap. As the economist Robin Hanson might point out, spending money is a conventional cost, not an index. A diamond ring is expensive because of marketing, not because it's biologically difficult for an insincere person to buy one. You can fake wealth. You cannot easily fake fitness.

  So, if the money isn't the handicap, what is?

  **[Shift back to warm, emotional tone]**

  The real handicap isn't the price of the wedding. The real handicap is the vulnerability.

  In behavioral terms, a true handicap is a cost that falls disproportionately on someone who *isn't* committed. It's something a "low-quality" partner literally cannot afford to pay.

  And when I look at these two, I see the real costs they've already paid.
  It's the cost of autonomy. It's agreeing that "I" is now "We."
  It's the cost of transparency. It's letting someone see you when you're stressed, or sick, or wrong, without running away.
  It's the opportunity cost of every other path not taken, chosen willingly because this path is better.

  Anyone can throw a party. Anyone can buy a ring. But not everyone can sustain the daily, unglamorous work of compromise. That is the true peacock tail. It is heavy. It requires energy. And you cannot fake it for a lifetime.

  I've watched [Groom] and [Bride] navigate the transition from grad school to the "real world." I've watched them support each other through career changes that had nothing to do with ecology, and everything to do with building a life. I have seen them argue, and I have seen them apologize. And I have seen them choose each other, not when it was easy, but when it was costly.

  That is what makes today credible. The signal works not because the wedding was expensive, but because the commitment is hard. They are signaling to each other, and to us, that they are fit for the long haul. They are saying, "I am willing to bear the weight of this, because the value of you is higher than the cost of me."

  [Groom's Father's Name], for the family: You don't need to know the biology to know the truth of it. You just need to look at how they look at each other when the other walks into the room. That is the only data point that matters.

  So, if everyone could please raise a glass.

  To [Groom] and [Bride]. May your signals always be honest, may your costs be shared, and may your fitness together only increase with time.

  To the happy couple!
