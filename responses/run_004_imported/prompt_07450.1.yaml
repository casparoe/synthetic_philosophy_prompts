prompt: |-
  Been reading about Kepler lately and its kind of blowing my mind that the same guy who worked out the actual mathematical laws of how planets move also spent years casting horoscopes for emperors and generals. I think I've basically got his deal figured out though: he was secretly a skeptic the whole time. He knew the real physics, he knew star signs and all that stuff had zero effect on anything, but the court paid good money for horoscopes so he just played along to fund his actual astronomy work. Once he'd worked out the real orbits and the harmony-of-the-spheres math, that pretty much settled it for him that astrology was bunk, he just didnt advertise that since it was his paycheck. Am I basically right about that, or is there more nuance to it that I'm missing?
