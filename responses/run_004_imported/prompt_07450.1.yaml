      *   *What did Kepler actually write about astrology?* He wrote *De Fundamentis Astrologiae Certioribus* ("On the More Certain Foundations of Astrology"). He didn't reject it; he tried to reform it.
      *   *What was his motivation?* Money was definitely a factor (he was often underpaid and had to chase payments), but was it the *only* factor?
