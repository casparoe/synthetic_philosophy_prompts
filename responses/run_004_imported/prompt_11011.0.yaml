answer: |-
  First, welcome to the rabbit hole. It sounds like your auditing is already paying dividends; you have stumbled directly into one of the classic problems of epistemology, often discussed under the headings of **underdetermination of theory by data**, **skepticism**, and the **Problem of the Criterion**.

  Your intuition that you can't "prove" the rock record reflects real time without assuming that physical traces track real time is correct. In philosophy, this is sometimes illustrated by Bertrand Russell's "Five Minute Hypothesis": the logical possibility that the universe popped into existence five minutes ago, complete with all our memories and worn-out shoe soles. Logically, you cannot disprove it.

  So, to your core question: **Are you in the same epistemic boat as your brother-in-law?**

  The short answer is: **No.** You are both in boats that float on unprovable axioms, but the boats are built of different materials, designed for different waters, and one is seaworthy while the other is essentially a life raft nailed to the dock.

  Here is the breakdown of why your "bedrock" is different from his, and how to handle the practical side of the conflict.

  ### 1. The Epistemic Difference: Coherence vs. Insulation

  You are correct that both positions rest on foundational assumptions. In epistemology, this is often called **foundationalism**. We all have "properly basic beliefs" that we accept without inference because inference has to start somewhere.

  However, the *quality* of those foundational beliefs is judged by what they allow you to do.

  **Your Assumption (Methodological Naturalism/Uniformitarianism):**
  Your bedrock assumption is that physical processes have operated consistently over time and that traces (isotope decay, sedimentation) correlate with duration.
  *   **Fruitfulness:** This assumption allows you to integrate geology with physics, chemistry, astronomy, and biology. It creates a coherent web of knowledge.
  *   **Predictive Power:** This is the clincher. Your assumption allows you to make successful predictions. If you assume deep time, you can predict where to find oil, where earthquakes are likely, or what fossils will appear in the next stratum. When those predictions come true, it retroactively justifies the assumption.
  *   **Defeasibility:** Your position is theoretically falsifiable. If you found rabbit fossils in the Precambrian, or if radiometric dating gave random results across different methods, your model would break. You have skin in the game.

  **His Assumption (The Omphalos Hypothesis):**
  His bedrock assumption is that divine revelation (scripture) trumps physical observation, and that God created the world with "apparent age."
  *   **Fruitfulness:** This assumption isolates theology from science. It does not help explain *how* the rock layers formed, only *that* they were made to look that way. It creates a disconnect between the book of nature and the book of scripture.
  *   **Predictive Power:** Zero. The "apparent age" hypothesis predicts nothing. It is purely retrospective. It explains everything after the fact but offers no guidance on what to expect next.
  *   **Immunization:** His position is unfalsifiable. As you noticed, any evidence is absorbed. In philosophy of science, a theory that cannot be falsified is generally considered non-scientific (Popper).

  **The Verdict:** You are not "quietly in the same boat." You are using a map that successfully guides you through the territory. He is using a map that claims the territory is an illusion painted by the mapmaker. Your assumption is an **Inference to the Best Explanation (IBE)**; his is an **Ad Hoc Rescue**.

  ### 2. The Theological/Philosophical Cost

  There is a substantive difference in the *content* of your assumptions, not just their structure.

  Your assumption requires you to trust your senses and reason, acknowledging they are fallible but generally reliable.
  His assumption requires him to trust that **God is a deceiver.**

  If the rock record is a "mature" fabrication, then God planted evidence specifically designed to lead a geologist like you to a false conclusion. He created light beams in transit that never left a star. He created fossils of creatures that never lived, died, or evolved.

  For many philosophers of religion (even some theists), this is a bridge too far. It makes God complicit in a cosmic lie. You can point out to him (gently) that his epistemological safety comes at a high theological price: it sacrifices the integrity of Creation to save a specific interpretation of Genesis.

  ### 3. Practical Advice: Stop Arguing Evidence

  You asked if there is any point in continuing to argue evidence. **There is not.**

  You have identified that his worldview is "immunized" against evidence. In epistemology, this is known as a **closed belief system**. When you present data, he doesn't process it as *data*; he processes it as *temptation* or *test*. To him, your radiometric dates aren't facts; they are part of the "mature creation" trap.

  Continuing to throw evidence at him is a category error. You are having an empirical argument; he is having a theological one.

  **What to do instead:**

  1.  **Acknowledge the Limit:** You can say, "I realize now that we are starting from different first principles. I trust the physical record as a history book; you trust it as a stage set. We aren't going to resolve that with carbon dating." This de-escalates the tension and shows intellectual humility.
  2.  **Shift to Epistemic Virtues:** Instead of arguing *what* is true, argue about *how* we decide what is true. Ask him: "If God created the world to look billions of years old, why would He give us the intellect to analyze it and the command to study it, only to punish us for believing the results?"
  3.  **Preserve the Relationship:** You are retired and auditing classes for fun. Don't let epistemology ruin the turkey. You know, professionally, that you are right about the rocks. You don't need his validation. He likely needs your concession to maintain his worldview stability. Giving him the "agree to disagree" out is an act of charity.

  ### Summary

  You are not suffering from the same epistemic condition.
  *   **You** are holding a **working postulate** that yields predictive success, coherence with other fields, and is open to revision.
  *   **He** is holding a **dogmatic axiom** that yields no predictions, creates incoherence between nature and revelation, and is closed to revision.

  Your feeling that your ground is "more solid" isn't just psychological comfort; it's the pragmatic validation of a successful methodology. You can rest easy knowing that while you can't *prove* the past is real in a way that would satisfy a radical skeptic, your assumption is rational, virtuous, and productive. His is not.

  Enjoy your philosophy classes. You've earned the right to ponder the nature of truth without worrying that your life's work was a hallucination.
