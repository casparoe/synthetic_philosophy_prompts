      *   *Refinement:* It's about "Option Value." Information expands your effective action set conditional on states. You never lose the ability to do what you would have done blind, but you might gain the ability to do something better in specific sub-cases.
      *   *Analogy:* Choosing a route to work. If you check traffic, you might switch routes. If traffic is bad on your usual route, you switch (gain). If traffic is fine, you stay (neutral). You never *force* yourself into a worse route because you checked.

