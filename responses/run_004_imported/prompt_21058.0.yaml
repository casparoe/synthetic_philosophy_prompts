answer: |-
  **Setting:** *A crowded coffee shop. Alex and Jamie are standing by a small, empty two-top table. Both are holding lattes. Both are hesitating.*

  **Alex:** You take it.

  **Jamie:** No, you. You were talking.

  **Alex:** I'm not sitting until we resolve the seating protocol. It's a coordination problem.

  **Jamie:** It's a chair, Alex. Sit down. This is exactly what I mean. You're looking for a meeting of minds. I'm looking at a stable equilibrium.

  **Alex:** That's the divide in a nutshell. Lewis says a convention isn't just a stable regularity. It's a regularity sustained by *reasons*. I sit because I expect you to sit, you sit because you expect me to sit, and we both know the other knows. Common knowledge.

  **Jamie:** And that's the just-so story. I'm telling you, you can get that exact stability with bacteria. Quorum sensing. No knowledge, no expectations, just selection pressure. If a behavior persists because it avoids a penalty, it functions as a convention. Why demand the cognitive overhead?

  **Alex:** Because without the reasoning, it's just a habit. If I drive on the left because I'm conditioned to, and you drive on the right because you're conditioned to, we crash. A convention requires that I have a *reason* to switch if you switch. The common knowledge is what makes the expectation self-fulfilling rather than just a statistical collision.

  **Jamie:** But that assumes the agents are capable of that level of recursion. Look at the Bourgeois strategy in Maynard Smith's Hawk-Dove game. "If you possess the resource, play Hawk; if you're the intruder, play Dove." It's an Evolutionarily Stable Strategy. It stops fights. It's arbitrary—could have been "Intruder Wins"—but it stabilizes without anyone knowing what anyone else knows.

  **Alex:** I grant you the arbitrariness. "Intruder Wins" would have worked. But Lewis requires a *coordination problem*. In Hawk-Dove, our interests diverge. I want the resource, you want the resource. That's conflict, not coordination.

  **Jamie:** Exactly. And yet, "Possessor Wins" becomes a convention in animal populations all the time. If your definition excludes ownership norms because they arise from conflict, your definition is too narrow to cover the actual world.

  **Alex:** Not necessarily. Once the "Possessor Wins" regularity is established, the game changes. Now, we both have a coinciding interest in *following the rule* to avoid the cost of the fight. The conflict is over the resource, but the convention solves a secondary coordination problem: how to allocate it without bloodshed.

  **Jamie:** But the selection pressure does all the work there. The losers who fought died out. The winners who respected ownership survived. You don't need me to *know* that you know the rule. You just need me to have a history of losing when I challenge owners. Reinforcement learning gets you there.

  **Alex:** Reinforcement explains how you *learned* it. It doesn't explain why you *follow* it now. If I see you're weak today, a reinforcement learner might test the boundary. A conventional agent doesn't, because they know that *if* they test it, *you* will expect it, and the equilibrium collapses. The common knowledge creates a normative force. It makes the convention a reason for action, not just a cause of behavior.

  **Jamie:** Normative force is a ghost. Show me the mechanism. In my model, the "convention" is just the basin of attraction. If we're in it, we stay in it. If you perturb it, we snap back. That's all the "force" there is. You're reifying the rationalization of the agent into the definition of the phenomenon.

  **Alex:** I'm protecting the phenomenon! If I train a pigeon to peck a key for food, it's not following a convention. If two pigeons peck in alternating turns to avoid jamming the feeder, is that a convention?

  **Jamie:** Yes. It's a behavioral convention.

  **Alex:** No. It's a synchronized habit. Lewis's point is that conventions are solutions to *problems of agreement*. There has to be a sense in which we *could have agreed otherwise*. The "Intruder Wins" strategy is biologically implausible for many species, sure. But for humans? We could drive on the left or the right. We could shake hands or bow.

  **Jamie:** Okay, but take ownership again. "Intruder Wins" is biologically costly, sure, but it's not impossible. Spiders do it sometimes. If the environment changes, the ESS shifts. The arbitrariness is there. The stability is there. The only thing missing is your little recursive loop of "I know that you know." And honestly, that loop is fragile. In the real world, common knowledge is almost never perfect.

  **Alex:** It's an idealization. But it's the right one. If common knowledge breaks down—if I'm not sure if you saw the sign saying "New Traffic Pattern"—the convention dissolves into uncertainty. I slow down. You slow down. We get inefficiency. The *degree* of conventionality tracks the *degree* of common knowledge.

  **Jamie:** Or it tracks the *strength of the penalty*. If the fight is deadly enough, I don't need to know what you know. I just need to know I don't want to die. The stakes do the work, not the epistemology.

  **Alex:** But why *this* way of avoiding death? Why possessors? Why not the bigger animal?

  **Jamie:** Because possession is a cheap signal. It's a correlation device.

  **Alex:** A correlation device! See? That's Schelling. That's Lewis. We need a focal point.

  **Jamie:** We need a cue. A dog smells the scent marker. That's not a focal point derived from rational introspection. That's a stimulus. You're trying to stretch "Convention" to cover everything from handshake protocols to territorial disputes, and you're forcing the territorial disputes into a mold that fits handshakes.

  **Alex:** And you're stretching "Convention" so wide it covers reflex arcs. If everything that stabilizes is a convention, then gravity is a convention because orbits are stable.

  **Jamie:** Don't be reductive. I'm talking about strategic stability in populations. Look, let's sit down.

  **Alex:** Who sits where?

  **Jamie:** I'm sitting here. You sit there.

  **Alex:** Why?

  **Jamie:** Because I moved first. Possessor wins.

  **Alex:** *Laughs.* Fine. But notice: you appealed to the rule. You didn't just shove me.

  **Jamie:** I didn't appeal to your knowledge of my knowledge. I appealed to your desire to avoid the awkwardness of standing there for another ten minutes. That's a payoff matrix, Alex. Not a meeting of minds.

  **Alex:** *Sits.* But the awkwardness only exists because we share a norm about personal space and queueing. Which brings us back to common knowledge.

  **Jamie:** *Sits.* Or it brings us back to the fact that we're both primates who hate public conflict.

  **Alex:** Same thing.

  **Jamie:** Different mechanisms.

  **Alex:** Different descriptions of the same mechanism.

  **Jamie:** If the mechanisms are different, the explanations are different. I can model the primate thing without assuming you're a logician. You can't model the logician without assuming he's not a primate.

  **Alex:** I'll drink to that. *Raises cup.*

  **Jamie:** *Clinks.* To stable equilibria.

  **Alex:** To common knowledge.

  **Jamie:** We're not going to agree on this.

  **Alex:** No. But we've coordinated on the table.

  **Jamie:** Yeah. Wonder which one of us is going to pay.

  **Alex:** ...Possessor of the wallet?

  **Jamie:** Don't push it.
