      *   *Implication 1: The "Omissions Aren't Causes" Premise is Philosophically Weak.* Most modern accounts of causation (especially in law and ethics) accept that omissions *can* be causes, provided there is a duty or expectation. The insurance company is using a very crude, almost archaic metaphysical view to dodge liability.
      *   *Implication 2: The "Too Many Causes" Objection is Solved by Norms.* The user mentioned the "guy in another state" problem. Philosophy solves this by appealing to *responsibility* and *expectation*. The super/management had a specific duty; the guy in Ohio did not. This distinguishes the boiler omission from the background noise.
