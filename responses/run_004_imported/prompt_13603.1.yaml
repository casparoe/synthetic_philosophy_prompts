  3.  **Analyze the Philosophical Debate (Omissions as Causes):**
      *   *The Problem:* If omissions are causes, then everything that *didn't* happen but *could* have prevented an event is a cause. (e.g., The President didn't send a heater, the guy in Ohio didn't call, I didn't buy a space heater). This leads to causal explosion.
      *   *The Counter-Argument:* We distinguish between "causes" and "background conditions." We use normative expectations (duties, norms, functions) to filter which omissions count.
