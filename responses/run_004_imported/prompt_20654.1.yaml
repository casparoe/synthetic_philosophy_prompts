answer: |-
  Here are 10 questions designed to press your quasi-realist guest on the technical and philosophical costs of their view, organized by the five specific pressure points you requested. Each question includes a anticipated "dodge" and a targeted follow-up to keep the pressure on.

  ### Topic 1: Moral Modus Ponens & Meaning Invariance

  **Q1.** Let's walk through a concrete derivation. If I say, "Lying is wrong," I express a negative attitude toward lying. If I say, "If lying is wrong, then getting your little brother to lie is wrong," I am not asserting that lying is wrong; I'm just supposing it. In that antecedent clause, what psychological state am I in? If I'm not expressing my actual attitude toward lying, what is the semantic content of that clause doing the work in the modus ponens?

  *   **Likely Dodge:** She will likely say you are expressing a "higher-order" attitude or a "plan" about what to do in hypothetical scenarios, not a direct moral attitude.
  *   **Follow-up:** "Okay, but for the logic to hold, the 'lying is wrong' in the antecedent has to mean the *same thing* as the 'lying is wrong' in the premise. If one is a direct expression of attitude and the other is a hypothetical plan, haven't you committed the fallacy of equivocation? How do you guarantee semantic stability across asserted and unasserted contexts without admitting the content is a proposition?"

  **Q2.** You argue that quasi-realism earns the right to use truth-apt language. But in the modus ponens case, the validity seems to depend on the *propositional* structure of the claims, not the expressive function. If I accept the premises but reject the conclusion, you say I'm inconsistent. But if the premises are just expressions of attitude, isn't my inconsistency merely psychological (like feeling happy and sad at once) rather than logical (like believing P and not-P)?

  *   **Likely Dodge:** She will argue that there is a "logic of attitudes" or "consistency of plans" that mirrors logical inconsistency.
  *   **Follow-up:** "But whose plans? If I say 'If lying is wrong...' I might not actually have a plan regarding lying. If the logic relies on *my* current psychological state, then the argument is only valid for people who already have those specific attitudes. How do you get *objective* validity out of *subjective* psychological states?"

  ### Topic 2: Higher-Order Attitudes & Relocation

  **Q3.** A common quasi-realist move to solve Frege-Geach is to appeal to "attitudes about attitudes"—for example, I disapprove of disapproving of lying. But doesn't this just relocate the Frege-Geach problem up a level? Now I need to explain the logic of *those* higher-order attitudes. If I say, "If disapproving of lying is wrong, then disapproving of getting your brother to lie is wrong," don't I need a *third*-order attitude to make that conditional work?

  *   **Likely Dodge:** She will claim the regress stops because the higher-order attitudes are structural features of the planning system, not infinite stacks of mental states.
  *   **Follow-up:** "If they are structural features of the system rather than actual mental states I'm holding, then aren't you describing a cognitive architecture that represents moral facts? At what point does describing the 'structure of planning' just become a description of a moral belief system under a different name?"

  **Q4.** Let's press on the nature of that inconsistency. If a moral realist denies the conclusion of a valid moral argument, they are contradicting the *facts*. If an expressivist denies it, they are clashing with their own *commitments*. But why is violating a commitment irrational in the same way that contradicting a fact is irrational? Couldn't I just say, "I know I'm committed to this plan, but I don't care"?

  *   **Likely Dodge:** She will argue that rationality *just is* coherence among attitudes/plans, not correspondence to facts.
  *   **Follow-up:** "That sounds like you're defining rationality to fit your theory. If I can coherently imagine a 'moral sociopath' who has perfectly consistent plans but rejects all moral norms, your account says they are rational. The realist says they are mistaken about the world. Why is your verdict on the sociopath the correct one?"

  ### Topic 3: Negation vs. General Validity

  **Q5.** Expressivists often treat the "negation problem" (what does 'not wrong' mean?) and the "validity problem" (why do arguments hold?) as the same issue. But aren't they distinct? I can solve negation by saying 'not wrong' expresses a tolerance, but that doesn't explain why 'P, If P then Q, therefore Q' is valid. Are you conflating the semantics of moral terms with the logic of moral reasoning?

  *   **Likely Dodge:** She will argue that you can't separate them because the meaning of the terms is constituted by their inferential role.
  *   **Follow-up:** "If meaning is constituted by inferential role, and you're fixing the inferential role to match realist logic, what is constraining that role? If you can stipulate that moral attitudes behave exactly like beliefs in logic, what stops you from stipulating that they behave like beliefs in metaphysics too?"

  **Q6.** Let's move beyond conditionals. How does your account handle disjunctions or logical equivalence? If "Lying is wrong" is equivalent to "It is not the case that lying is not wrong," do I need to hold the same attitude in both cases? If I accept the double negation but reject the positive claim, is that a logical error or just a change in mood?

  *   **Likely Dodge:** She will appeal to a deflationary logic where equivalence is guaranteed by the rules of the language game.
  *   **Follow-up:** "But rules of a language game are arbitrary unless they track something. If the 'something' isn't truth conditions, what makes the rule *correct*? Are we just playing a game of 'make-believe' realism, or is there a normative force behind the logic that you haven't explained?"

  ### Topic 4: Generalization (Quantifiers & Attitude Reports)

  **Q7.** Let's talk about quantifiers. If I say, "Everything the senator said was wrong," I'm quantifying over moral claims. On your view, moral claims express attitudes. But the senator might not be me. Whose attitude is being expressed in that quantified claim? Is it mine? If so, how can I quantify over *your* attitudes without knowing what they are?

  *   **Likely Dodge:** She will say the quantifier ranges over *propositions* or *contents* that are the objects of attitudes, not the attitudes themselves.
  *   **Follow-up:** "Ah, so there *are* moral propositions that serve as the objects of attitudes. If those propositions have logical relations (like being quantified over), why aren't they truth-apt in a robust sense? You seem to be smuggling in the very cognitive content you claim to reject."

  **Q8.** Consider attitude reports: "Ann believes that cheating is permissible." I am asserting this, but I am not expressing *my* attitude toward cheating, nor am I expressing Ann's attitude (I might be wrong about what she thinks). What semantic content does "cheating is permissible" have in that sentence if it's not a proposition that Ann stands in a relation to?

  *   **Likely Dodge:** She will use a "proxy" account, where I am expressing my attitude toward Ann's potential attitude.
  *   **Follow-up:** "But that changes the truth conditions. If Ann actually believes it's permissible, my statement is true, regardless of my attitude toward her attitude. If your semantics makes the truth of my report depend on *my* expressive state, aren't you making moral reports egocentric in a way that contradicts how we actually use them?"

  ### Topic 5: Creeping Minimalism

  **Q9.** This is the "Creeping Minimalism" objection. You've used deflationary truth, a logic of attitudes, and semantic stability to earn back all the trappings of realism. You say moral claims are "true," have "facts," and follow "logic." At this point, what substantive work is the label "expressivism" doing? What is the actual difference between your view and a cognitivist who just has a different genealogy for how we form beliefs?

  *   **Likely Dodge:** She will say the difference is metaphysical: there are no "robust" moral properties out there in the world, only human projects.
  *   **Follow-up:** "But if the 'human projects' generate truth-apt claims that function identically to robust properties in every logical and semantic test, why does the metaphysical origin matter? If it walks like a duck (truth) and quacks like a duck (logic), why insist it's not a duck (cognitivism) just because of its ancestry?"

  **Q10.** Finally, if quasi-realism is successful, it seems to make the debate between realism and expressivism verbal. If you can say everything the realist says, but claim you mean something different by "truth" and "fact," isn't the cost of your view that you make metaethics irrelevant? If the practical output is identical, why should we care about the underlying psychological mechanism?

  *   **Likely Dodge:** She will argue it matters for understanding human nature and avoiding metaphysical queerness.
  *   **Follow-up:** "But if the 'queerness' is invisible to all our semantic and logical tests, isn't it Occam's Razor to cut it? If you've earned the right to talk like a realist, shouldn't you just take the win and admit that, for all intents and purposes, moral judgments *are* a species of belief?"
