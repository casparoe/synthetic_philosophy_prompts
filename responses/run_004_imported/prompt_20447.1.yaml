          *   Zorn's Contribution: Max Zorn's 1935 paper ("A remark on method in transfinite algebra") explicitly argues that the lemma is more useful than transfinite induction for algebraists. He didn't claim discovery in the sense of "no one ever thought of this," but he did advocate for its adoption as an axiom/tool.
          *   *Stigler's Law:* Yes, this fits perfectly. Zorn's Lemma is named after Zorn, though Hausdorff and Kuratowski preceded him.
