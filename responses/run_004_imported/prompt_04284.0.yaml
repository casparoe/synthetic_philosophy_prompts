      *   *Sidgwick's Dualism of Practical Reason:* Sidgwick worries about the conflict between Rational Egoism and Utilitarianism. Longtermism might exacerbate this (why should *I* sacrifice for distant strangers?).
      *   *The Verdict:* Sidgwick would accept the *theory* of longtermism but reject the *practical priority* of strong longtermism in the present context. He would be a "Weak Longtermist" or a "Classical Indirect Utilitarian" who acknowledges the future's importance but prioritizes established rules that secure present welfare, fearing the dangers of speculative calculation.

