answer: |-
  **Title:** The Point of View of the Universe vs. The Fog of the Future: Would Sidgwick Be a Strong Longtermist?

  Your student is absolutely right to draw the line from Sidgwick to Greaves and MacAskill. When longtermists argue for a "zero rate of pure time preference," they are quoting Sidgwick's *The Methods of Ethics* almost verbatim. Sidgwick's insistence that "the mere difference of priority and posteriority in time" is no rational ground for preferring one moment of consciousness over another is the axiological bedrock of the longtermist project. From the "point of view of the universe," a unit of happiness in the year 3024 is morally identical to a unit of happiness in 2024.

  However, your colleague's skepticism is also well-founded. To determine whether Sidgwick would sign on to *Strong Longtermism*—the practical claim that we should prioritize influencing the long-term future over near-term welfare, even at significant cost—we must look beyond his axiology to his epistemology and his practical moral theory. If we reconstruct Sidgwick's full system, the verdict is clear: **Sidgwick would reject Strong Longtermism as a practical guide.**

  While he would endorse the *principle* that the future matters impartially, he would reject the *priority* longtermists assign to it. Sidgwick's utilitarianism is constrained by a profound epistemic humility that treats speculative calculations about the distant future as rationally unreliable. Consequently, he would argue that we are morally obligated to follow common-sense rules (like relieving present suffering) rather than chasing astronomical expected values that outrun our capacity for prediction. Sidgwick is the philosopher of temporal neutrality, but he is not the philosopher of the Pascalian wager.

  ### The Axiological Alignment
  It is necessary to grant the longtermist their strongest foothold first. In Book II, Chapter XIII of *The Methods*, Sidgwick establishes that Rational Benevolence requires us to aim at the universal good. He explicitly attacks the "irrationality" of privileging the present. He writes, "If the Universal Good were composed of the good of individuals, the good of any one individual would be of no more importance, from the point of view of the Universe, than that of any other."

  This includes individuals who do not yet exist. Sidgwick was deeply concerned with population size; he recognized that if we can bring more happy people into existence without diminishing the happiness of others, we increase the total good. On this abstract level, Sidgwick and the longtermist are allies. If you could know with certainty that spending \$1,000 on existential risk reduction would save a trillion future lives, Sidgwick's calculus demands you spend it. The "point of view of the universe" is radically expansive.

  ### The Epistemic Break
  The divergence occurs when we move from the *value* of the future to our *knowledge* of it. Strong Longtermism relies on Expected Value (EV) reasoning: even if the probability of influencing the far future is low, the magnitude of the stakes (astronomical numbers of lives) makes the EV of longtermist interventions higher than near-term interventions (like bednets).

  Sidgwick would find this reasoning epistemically reckless. Throughout the *Methods*, Sidgwick emphasizes that utilitarian calculation is severely limited by human ignorance. We cannot foresee the remote consequences of our actions. In Book III, he notes that the further into the future we project, the more the chain of causation becomes obscured. For Sidgwick, uncertainty does not just increase linearly with time; it compounds.

  For a modern longtermist, uncertainty is a variable to be plugged into an equation. For Sidgwick, uncertainty is a boundary condition for moral reasoning. He argues that when consequences are too remote or speculative, we cannot rationally claim to know that an action maximizes utility. To base a moral decision on a chain of causation spanning centuries is, for Sidgwick, to step outside the realm of rational calculation and into the realm of guesswork. He would argue that the "expected value" of x-risk reduction is not just low-probability, but *incalculable*, because we lack the empirical data to assign meaningful probabilities to events millions of years hence.

  ### The Defense of Common-Sense Morality
  This epistemic limitation drives Sidgwick toward his most controversial move: the defense of common-sense morality. Sidgwick observes that the moral rules of everyday life (veracity, justice, prudence, benevolence to kin and neighbors) generally coincide with utilitarian outcomes. Why? Because humanity has evolved these rules precisely because they *work* to maximize welfare in the face of uncertainty.

  Sidgwick argues that we should generally follow these rules rather than attempting direct utilitarian calculation for every act. This is not merely a concession to human weakness; it is a rational strategy for maximizing good given our cognitive limits. We should fund bednets because the rule "relieve preventable suffering when you can" has a proven track record of increasing utility. The causal link is short, visible, and reliable.

  Strong Longtermism, by contrast, often requires violating common-sense intuitions. It suggests that we might be justified in allowing significant present suffering (e.g., skipping malaria relief) to secure a speculative future benefit. Sidgwick would view this as dangerous. In Book IV, he warns against utilitarian conclusions that diverge too sharply from ordinary moral consciousness, as this undermines the social fabric that makes utility maximization possible. If agents start ignoring certain, present harms for uncertain, future gains, the result is likely to be a net decrease in welfare due to the breakdown of trust and the high rate of error in prediction.

  Sidgwick's "Government House Utilitarianism" (to use Williams's label) implies that while the philosophical elite might understand the ultimate principle of utility, the practical application of morality must remain grounded in stable, time-tested rules. Strong Longtermism asks us to act as if we are the philosophical elite with god-like foresight. Sidgwick would say we are not.

  ### The Verdict: Temporal Neutrality Without Longtermist Priority
  So, would Sidgwick sign the "Case for Strong Longtermism"? He would sign the preamble, but he would reject the policy recommendations.

  Sidgwick would argue that Strong Longtermism commits a category error: it conflates the *ontological status* of future good (which is equal to present good) with the *epistemic access* to that good (which is vastly inferior). Temporal neutrality means we do not discount the future *simply because it is the future*. It does not mean we should prioritize the future when our evidence for it is speculative and our evidence for the present is concrete.

  For Sidgwick, the rational agent maximizes *expected* good, not *potential* good. Because the reliability of our calculations drops precipitously over time, the "discount rate" is not a moral preference but an **epistemic necessity**. We care more about the near future not because it matters more, but because we can actually see it.

  Therefore, Sidgwick would conclude that funding anti-malarial bednets beats funding existential risk research, not because the future lives don't count, but because the utility of the bednets is *knowable* and *secure*, whereas the utility of the x-risk research is *speculative* and *fragile*. To sacrifice the certain for the uncertain is, on Sidgwick's view, irrational—even for a utilitarian.

  ### Conclusion
  Your student has correctly identified Sidgwick as the grandfather of longtermist axiology. But your colleague is right to suspect Sidgwick would balk at the practice. Sidgwick's system is designed to prevent exactly the kind of moral overreach Strong Longtermism proposes. He builds a firewall between the abstract "point of view of the universe" and the concrete decisions of human agents, a firewall constructed out of epistemic humility and respect for common-sense rules.

  Sidgwick would tell the longtermist: "You are right that the future matters. But you are wrong that you can know it well enough to bet the present against it." He would remain a temporal neutralist, but he would be a near-term prioritizer. He would not be a Strong Longtermist.
