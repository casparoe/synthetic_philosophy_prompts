      *   **Key Tensions:**
          *   *Pro-Longtermism:* Temporal neutrality (zero pure time preference), impartiality ("point of view of the universe"), maximization of total good.
          *   *Anti-Longtermism:* Epistemic humility (uncertainty of distant future), reliance on common-sense morality (indirect utilitarianism/Government House), wariness of conclusions that diverge too sharply from intuition.

  2.  **Deconstruct Sidgwick's Position:**
      *   *The Good:* Hedonistic utilitarianism (greatest total happiness).
      *   *The Method:* Rational intuitionism leading to utilitarianism.
