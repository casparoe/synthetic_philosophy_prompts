      Sidgwick's epistemology makes him skeptical of high-stakes, low-probability calculations (Pascalian wagers). He prefers rules with proven track records.
      Therefore, on the *practical* question that defines Strong Longtermism (allocation of resources), Sidgwick would likely demur. He would not sign the "Case for Strong Longtermism" as a practical guide, even if he signed the axiology.
      *Decision:* The verdict is **No, he would not be a Strong Longtermist.** He would be a temporal neutralist who prioritizes near-term welfare due to epistemic constraints and the instrumental value of common-sense rules.

