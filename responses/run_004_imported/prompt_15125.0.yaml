answer: |-
  The rig hummed, a sound Elara felt in her teeth more than her ears. It was the sound of probability being coerced into a wire.

  She sat in the isolation chair, the haptic crown heavy on her skull. On the monitor before her, the branching tree of the multiverse scrolled in cascading waterfalls of data. Most branches were static—white noise, dead ends, or worlds so divergent from hers that the resonance was too weak to carry a signal. She was looking for a strong lock. A near-match.

  "Calibration is holding at ninety-four percent," she said to the empty room. Her voice sounded thin. "Initiating deep-scan on Sector 88-Delta."

  She wasn't supposed to be doing this alone. Mark, her safety officer, would have flagged the divergence index. But Mark was a Kripkean. He believed that if she looked into another world, she was looking at *herself*. Strict identity. Transworld essence. To him, this machine was a suicide booth waiting to happen. If you died over there, did a piece of you die here?

  Elara was a Lewisian. To her, the other Elaras were counterparts. Similar, yes. Causally connected through the quantum foam, certainly. But not *her*. They were distinct individuals linked by resemblance. Watching one die should be no more traumatic than watching a very convincing actor play your biography on screen.

  Except the rig didn't just show video. It mapped qualia. It didn't show you the crash; it let you feel the glass.

  "Lock acquired," the system chimed.

  The lab dissolved. The sterile white walls bled into the grey wash of a rainy afternoon. The smell of ozone was replaced by the scent of wet asphalt and stale coffee. Elara blinked, and she was sitting behind the wheel of a sedan. Her hands—*her* hands, but wearing a silver ring she didn't own—gripped the steering wheel at ten and two.

  She was a passenger in her own mind. She couldn't steer, couldn't speak. She could only feel the tension in the counterpart's shoulders, the tightness in the chest.

  *Okay,* Elara thought, the scientist part of her brain still functioning amidst the sensory intrusion. *Branch 88-Delta. Divergence point approximately five years ago. I took the job at CERN; she took the job at MIT. That explains the ring. MIT alumni band.*

  The car was moving fast. Rain lashed the windshield. The wipers slapped a rhythmic panic.

  *Why am I speeding?* Elara wondered. *Is this the death event?*

  She checked the telemetry overlay that only she could see in her peripheral vision. The resonance was stable. The link was clean. She was feeling the counterpart's fear, a cold knot in the stomach that wasn't hers, yet was.

  Then, the telemetry flickered.

  A warning glyph pulsed red in the corner of her vision. **AMBIGUITY DETECTED. COUNTERPART METRIC: NON-UNIQUE.**

  Elara frowned. Under Lewis's theory, counterpart relations are based on similarity. Usually, in any given world, there is one person who is more similar to you than anyone else. That's your counterpart. But Lewis admitted the edges could be fuzzy. In weird cases, there could be two people equally similar to you. Or none.

  The car skidded.

  The counterpart slammed on the brakes. Elara felt the ABS shudder through the pedal, up the leg, into the hip. The world spun. Trees rushed in.

  *This is it,* Elara thought. *The end of the line.*

  She braced for the impact. She braced for the silence that would follow, the severing of the link that would snap her back to the lab. If Kripke was right, this was a fragmentation of the self. A piece of Elara Vance was about to be extinguished. She should feel the weight of mortality.

  The crash was a symphony of violence. Metal shrieked. Airbags detonated with the smell of chalk dust and burning chemicals. Pain, white-hot and sharp, flared in the counterpart's ribs. The world tilted sideways.

  Elara waited for the blackout.

  It didn't come.

  The pain lingered, throbbing, but the consciousness didn't fade. The telemetry glyph stopped flashing red and turned a steady, calm green. **LINK STABLE.**

  Elara gasped in the lab, her physical body jerking against the restraints. But in the vision, the car was still smoking, and the counterpart was... moving.

  No. Not *the* counterpart.

  Through the cracked windshield, Elara saw a figure stumbling out of the passenger side. It was a woman. She was wearing the same coat. She had the same hair, matted with rain and blood. She had the same face.

  The driver—the one Elara had been linked to—was slumped over the wheel, unconscious or dead. The link should have died with the neural activity.

  Instead, the sensation *slid*.

  It was a sickening lurch, like an elevator dropping a floor in a split second. The pain in the ribs vanished, replaced by a different pain: a laceration on the forehead, the shock of cold rain on skin. Elara was no longer the driver. She was the passenger.

  She stood in the mud, shaking, looking at the wrecked car. She looked at the driver.

  *Oh,* Elara thought. The realization hit her harder than the crash had hit the car.

  In this branch, there were two of them. Twins? Clones? A convergence of history where two distinct paths resulted in two women who were, by the machine's metric of similarity, equally "Elara Vance."

  Lewis was right. The relation wasn't identity. It was a fuzzy set of attributes. The machine didn't latch onto a soul; it latched onto a pattern. When the pattern of the driver ceased, the machine simply found the next best match in the vicinity. It found the sister.

  If Kripke were right, this would be impossible. You cannot be identical to two different people in the same world. Identity is one-to-one. If this were truly *her* in there, strictly speaking, the death of the driver should have ended the experience. The fact that the experience continued proved they were not identical. They were counterparts.

  The passenger—the new link—reached into the car. She checked the driver's pulse. Nothing.

  Elara felt the grief wash over the passenger. It was a hollow, tearing agony. *I am alone,* the passenger thought. *I am the only one left.*

  Elara, in the lab, tears streaming down her actual face, felt the irony choking her.

  *You're not the only one,* Elara thought at the woman across the void. *I'm here. I'm the one who built the machine. I'm the one watching you.*

  But the passenger couldn't hear her. To the passenger, the driver was her twin, her other half. To Elara, the driver was a stranger who shared her face.

  The question that had plagued her for months crystallized in the smoke of the crash. Should she grieve?

  If she accepted the Kripkean view, she had just died. She had survived, yes, but a version of her had been extinguished. The universe was poorer by one Elara. The grief the passenger felt was Elara's own grief, reflected back at her.

  But the machine's behavior had answered the question. The link had slipped. It had treated them as interchangeable vessels for the signal. That meant they were distinct. The driver was dead. Elara was alive. The continuity of consciousness had been maintained by the machine, not by the self.

  It was a category error. Grieving the driver was like grieving a character in a book you finished reading. The pain was real, but the object of the pain was a fiction of identity.

  And yet.

  Elara ripped the crown off her head.

  The lab rushed back in, silent and cold. The hum of the rig was the only sound. She sat there, trembling, the phantom ache of a forehead laceration throbbing where no wound existed.

  She looked at the monitor. The telemetry log was still running. **SUBJECT STATUS: ALIVE. COUNTERPART STATUS: DECEASED (1 OF 2).**

  One of two.

  Mark would say she was lucky. She had peeked over the edge and didn't fall. But Elara felt a hollowness that luck couldn't fill.

  If Lewis was right, then she was never truly connected to them. She was an island, shouting at reflections in the water. The machine lied. It simulated unity where there was only similarity. It made her feel the death as her own, but the metaphysics said it wasn't.

  She stood up, her legs shaky, and walked to the window. It was night outside. The city lights blurred in the rain.

  Somewhere, in a world just a quantum tick away, a woman was standing in the mud beside a wrecked car, weeping for her dead twin. She thought she was mourning herself. She was wrong.

  Elara pressed her hand against the glass. She should feel relief. She was safe. The category error was corrected. She knew the truth: she was unique. Her death was her own, and no one else's.

  So why did she feel like the one in the mud?

  Because the machine didn't care about Lewis or Kripke. It cared about resonance. It cared about the pattern. And the pattern of grief was the same in every branch.

  She turned back to the rig. The screen still showed the green light. **LINK STABLE.**

  It was waiting. It could slide back. It could find another counterpart. There might be a world where three Elaras existed. A world where none did.

  Elara picked up the crown.

  If she put it back on, she was admitting that the connection mattered more than the ontology. She was admitting that even if it was a category error, the grief was real enough to warrant the risk.

  If she turned it off, she was choosing the safety of strict identity. She was choosing to be one person, in one world, with one life.

  She thought of the driver's slumped head. She thought of the passenger's hand checking for a pulse.

  "Similarity is not identity," she whispered to the room.

  But as she lowered the crown toward her hair, she knew she was lying. The pain didn't care about the difference. The machine had proven the metaphysics, but it had also proven the metaphysics didn't matter.

  She put the crown on.

  "Re-engaging," she said.

  The hum rose. The lab dissolved. She went back to the mud, to the rain, to the woman who thought she was alone. Elara wouldn't correct her. She would just stay on the line, bearing witness to the death of a counterpart, grieving the stranger who wore her face, accepting that in the multiverse, the only thing that binds us is the lie that we are the same.

  The link locked. The rain started to fall.
