      *   **The Glitch:** The biometric readout shows two heartbeats in the target world matching her signature. Lewis's "several counterparts."
      *   **The Death:** The crash happens. She feels the impact.
      *   **The Aftermath:** She survives in the lab. The link doesn't break. It slides to the *other* counterpart in the crash world.
      *   **The Realization:** If it were truly *her* (Kripke), she would be dead. The fact that the consciousness persists in the second counterpart proves they are distinct entities linked by similarity. She didn't die. She just lost a mirror.
      *   **The Emotional Punch:** She *wanted* it to be her. She wanted the unity. Instead, she gets the isolation of being one among many.

  6.  **Writing - Focusing on Sensory and Pacing:**
      *   Use the machine's feedback to show the metaphysics. "Similarity Index." "Identity Lock."
