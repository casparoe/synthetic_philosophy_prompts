      *   Make the philosophical realization a physical sensation. The "slip" of the connection.

  7.  **Refining the "Zero-or-Several" Wrinkle:**
      *   Lewis argues that in some worlds, you might have no counterpart (if you never existed) or two (if your parents had twins and both were named you, or a cloning scenario, or just a convergence of history).
