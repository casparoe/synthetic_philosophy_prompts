      *   **Philosophical Framework:** David Lewis's Counterpart Theory (similarity-based, non-identical, messy relations) vs. Kripkean Transworld Identity (strict identity, "it could have been me").
      *   **Specific Constraint:** The "zero-or-several-counterparts" wrinkle (Lewis's non-transitive/one-to-many issue) needs to be plot-relevant, not just trivia.
      *   **Tone:** Not a lecture. Load-bearing metaphysics. "Black Mirror" vibes but earned.
      *   **Length:** 1500-2500 words.
      *   **Status:** Protagonist is 1/3 into the novel (this is a middle act scene).

  2.  **Determine the Plot Beat:**
      *   The protagonist (let's name her Elara) needs to be testing the limits of the machine.
      *   She needs to encounter a death.
      *   The "zero-or-several" wrinkle needs to create a crisis. If Lewis is right, identity is fuzzy. If Kripke is right, it's absolute.
      *   *Idea:* What if she links to a world where *two* versions of her exist? Or where the link is ambiguous?
      *   *Better Idea:* The machine relies on a specific metric of "similarity" to find the counterpart. If Lewis is right, the machine is picking a *counterpart*, not *her*. If she dies in that branch, does *she* die?
      *   *The Twist/Complication:* She finds a branch where her counterpart is about to die, but the "similarity" metric is glitching. There are *two* potential counterparts in that world. Which one is she linked to? Or is the link splitting?
      *   *Refinement:* Let's focus on the grief aspect. She watches a death. The machine forces her to feel it. The question is: Is this suicide? Is this murder? Or is this watching a stranger?
      *   *Incorporating the "Several Counterparts" wrinkle:* In the target world, there are two Elaras. The machine latches onto *both* or oscillates. When one dies, the connection doesn't sever; it snaps to the other. This proves Lewis right (similarity-based, not identity-based). If it were Kripkean identity, there could only be *one* her. The existence of two proves they are counterparts, not identical.
      *   *Emotional Climax:* She realizes she isn't dying. She's just watching a similar person. But the machine makes it *feel* like her. The horror is the disconnect between the phenomenology (feels like me) and the ontology (isn't me).

