          *   *Necessity vs. Preference:* The user admits it's for taste, not survival. Does this weaken the justification for taking a life?
          *   *The "Better Off" Comparison:* Is it coherent to say someone is "better off" existing than not existing when the alternative is non-existence (which isn't a state of suffering)?

