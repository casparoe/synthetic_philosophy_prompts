answer: |-
  You have hit upon one of the most famous and subtle features of the information cascade literature. Your intuition that cascades should be stable is correct *with respect to private signals*, but the standard models (Bikhchandani, Hirshleifer, and Welch 1992; Banerjee 1992) actually predict that cascades are **informationally fragile** with respect to *public* information.

  The sudden unraveling you observe in real-world bubbles and fads does not necessarily disprove the rational Bayesian mechanism. In fact, the rational models provide a specific mathematical explanation for why herds are prone to sudden collapse without invoking psychological panic.

  Here is how the rational models account for the fragility you are observing, and where behavioral factors might still play a role.

  ### 1. Stability Against Private Signals, Fragility Against Public News
  Your observation that "nobody has any private incentive to break from it" is the defining characteristic of a cascade. Once a cascade starts, the public history of actions outweighs any single agent's private signal. Therefore, a private signal (e.g., "I heard this stock is bad") will not stop the herd.

  However, the "small piece of news" that dislodges a real-world herd is usually **public information**, not a private signal.
  *   **The Math:** In the BHW model, a cascade might begin after a net difference of just one or two signals (e.g., two people Adopt, one Reject, then two more Adopt). The public "weight" supporting the cascade is incredibly light.
  *   **The Shock:** If a public signal arrives (e.g., a regulatory report, an earnings miss, a celebrity tweet), it enters the public information set directly. It does not suffer from the inference problem that private signals do. Because the cascade was built on a thin margin of public information, a single moderate public signal can mathematically overturn the public belief, instantly switching the rational choice for everyone downstream.
  *   **Conclusion:** The suddenness is a feature, not a bug, of the rational model. The herd is stable against *idiosyncratic* doubt but fragile against *common* knowledge.

  ### 2. Observing Payoffs vs. Observing Actions
  The standard cascade model assumes agents observe only the **actions** of predecessors, not the **payoffs**.
  *   **In the Model:** I see you buy a stock. I don't know if you made money. I only infer that your private signal was "buy."
  *   **In Reality:** We often observe outcomes. If the herd invests in a technology, we eventually see whether it works. If the herd queues at a restaurant, we eventually hear if the food was cold.
  *   **The Unraveling:** If agents observe negative payoffs from the herd's choice, this acts as a high-precision public signal. Rational agents will immediately update and reverse their behavior. This looks like a "collapse," but it is actually rational learning from realized outcomes. This extension (often associated with later work by Smith, Sørensen, and others) explains why bubbles burst when reality fails to match expectations.

  ### 3. Heterogeneous Signal Precision
  The basic model assumes all agents have signals of equal precision. In the real world, signal quality varies.
  *   **The Expert Effect:** If the market believes that most agents have noisy signals, a cascade forms easily. However, if a known "expert" (an agent with known high-precision signals) acts against the cascade, rational agents will weight that expert's action more heavily than the entire history of the herd.
  *   **Sudden Shift:** The arrival of a contrarian expert (e.g., a short-seller publishing a report, a respected critic panning a movie) can rationally trigger an immediate reversal. To an outside observer, it looks like the crowd panicked; in the model, the crowd simply re-weighted the public information set upon learning a high-quality signal contradicted the low-quality history.

  ### 4. Endogenous Timing and Waiting
  In the standard model, agents are forced to act in a fixed sequence. In reality, agents can often choose **when** to act.
  *   **The Option Value of Waiting:** If an agent suspects a cascade might be wrong, they may delay their decision to gather more information.
  *   **The Freeze:** When uncertainty is high, herds can "freeze." No one acts.
  *   **The Break:** Once someone finally acts against the herd (perhaps because their private signal was overwhelming), it reveals that waiting was valuable. This can trigger a rush of previously waiting agents to act on their contrary private signals, causing a sudden avalanche of reversal. This looks like panic, but it is the release of pent-up private information that was temporarily suppressed by the option value of waiting.

  ### 5. Where Psychology *Does* Enter
  While the rational models explain the *mechanism* of fragility, you are right to suspect that psychological factors amplify the *severity* and *speed* of the collapse.
  *   **Salience and Overreaction:** Rational Bayesian updating is linear. Human updating is often non-linear. A small piece of bad news might be psychologically salient, causing agents to over-weight it relative to the prior history (representativeness heuristic).
  *   **Preference Cascades:** Sometimes people herd not because they believe the action is correct (informational cascade), but because they want to fit in or avoid social sanction (preference cascade). These are much harder to break with information alone and often require a shift in social norms.
  *   **Leverage and Forced Selling:** In financial markets, collapses are often mechanical rather than informational. If prices drop slightly, leveraged investors are margin-called and *forced* to sell. This drives prices down further, triggering more margin calls. This is a structural fragility, not necessarily a Bayesian update.

  ### Summary
  The sudden collapse of real-world herds does not invalidate the rational cascade model. The standard BHW model explicitly describes cascades as **informationally fragile**. They are robust to the accumulation of low-value private signals but extremely vulnerable to small shocks in public information or the revelation of payoffs.

  The "panic" you observe is often the rational realization that the public information foundation of the herd was much thinner than it appeared. However, behavioral biases likely accelerate the speed of the crash once the rational threshold for reversal has been crossed. The rational model explains *why* the dam breaks; psychology often explains the *flood* that follows.
