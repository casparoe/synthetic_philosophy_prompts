      *Wait, one more check:* Priya's logic: "flat part was never really intended, just an artifact of nobody ever staying unpaid long enough to see past it."
      If the flat part was an artifact, why did it happen from 50-85? She must believe the *logic* was "Cap at 150 until 90 days, then resume." But the data stops at 85. So she is assuming the cap *would have* lifted at 90. This is pure speculation. The User's assumption (Cap stays) is the null hypothesis.

