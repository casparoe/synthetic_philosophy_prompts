answer: |-
  Good evening. For those who don't know me, I'm the older sibling. It's an honor to stand here.

  Now, my sister and her fiancé met in a Philosophy PhD program. Specifically, in a seminar on early twentieth-century ethics. I know what half of you are thinking: "Here comes the lecture." And to the other half: "Here comes the part where I zone out."

  I promise, no lecture. But I have been reading G. E. Moore's *Principia Ethica*. For the non-philosophers, don't panic. For the philosophers: yes, I am talking about the 1903 text, and yes, I am sticking to Chapter Six.

  Keynes once said reading Moore felt like "the opening of a new heaven on a new earth." And Moore argues that the very best things in that new heaven are two-fold: the appreciation of beauty, and personal affection.

  This explains a great deal about this couple. They left academia to become stained-glass conservators. They spend their lives preserving beauty. And I know, because I've heard the arguments, that they debate whether a window loses something *essential* when medieval glass is replaced by a modern reproduction, however faithful.

  Moore would say: Yes. It does. He argues that a real beautiful object is intrinsically better than an equally beautiful copy. It's not about utility; it's about truth. So, to my sister and her fiancé: Your arguments were not just technical. They were moral. You were right to fight for the original.

  But Moore goes further. He claims that a beautiful world forever unwitnessed by any mind is still better than an ugly one. Beauty has value in itself. Yet, he ranks human affection higher still. And here is where his ethics become a wedding vow.

  Moore writes that the highest form of affection isn't just loving someone for their qualities. The highest good is loving someone for *how they love*. It is a second-order affection: taking pleasure in the fact that they are capable of deep, genuine care for the world and for others.

  I have watched the two of you together. I have seen how you treat your work, your friends, and each other. And I can confirm, with philosophical precision, that the way you love is itself a beautiful object. It is not a copy. It is original. And it is not unwitnessed. We are all here to see it.

  Moore believed that personal affection, specifically this reflective love, is the greatest good a life can contain. It is greater even than the stained glass you restore. Because the glass may break, and the lead may corrode, but this capacity you have to cherish one another's capacity to cherish—that is the closest thing to eternity we get.

  So, if the Bloomsbury Group taught us anything, it is that life should be lived for the sake of these states of mind.

  Please raise your glasses. To the bride and groom: May your world remain beautiful, may your originals always be honored, and may you never stop loving the way you love.
