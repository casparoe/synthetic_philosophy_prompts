      *   **The Core Argument:** Lewis uses the Law of Total Probability. He considers the probability of the conditional $(A \to B)$ given some other proposition $X$. He shows that if The Equation holds, $P(B|A)$ must equal $P(B|A \land X)$ for any $X$ compatible with $A$. This implies $A$ and $B$ are probabilistically independent of everything else, which collapses the space.

