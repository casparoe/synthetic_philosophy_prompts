          *   This leads to "Probabilistic Semantics" (Adams) vs. "Truth-Conditional Semantics" (Stalnaker/Lewis).
          *   It impacts AI/Probabilistic Programming: How do we represent rules? As random variables or as constraints on distributions?

      *   **Refining the Intuition:**
