prompt: |-
  I'm one of the public members on my state's parole board (long story — a piece I wrote a few years back on actuarial risk tools apparently impressed the right person), and we've hit a snag this month I can't stop turning over. We're deciding on a file where the risk instrument our office uses was run by two different consultants who reached very different numbers for the exact same guy: one anchored his five-year reoffending estimate to "all men convicted of this offense category released in the past decade," which comes out to 44%, and the other used a narrower comparison group — same offense, same age band, completed the same in-prison program, no juvenile record — which comes out to 13%. Everyone agrees both groupings are legitimate and both rest on decent sample sizes, but nobody can tell me why one is "more correct" for this specific human being than the other. A board member who used to teach philosophy says this has an actual name, something like "the reference class problem" (hope I'm getting that right), and that it isn't just the usual algorithmic-bias story with extra math — it's that literally any person belongs to endless overlapping reference classes that would each hand you a different number, bias or no bias.

  I need to send round a short memo before thursdays vote, and I'd like it to do double duty: what we should do with this particular file, and what our standing policy should be for weighing these actuarial numbers whenever this kind of split shows up again (apparently it's more common than I realized). Make the recommendation concrete enough that the board could actually vote on it line by line, and please don't let the memo off easy on the strongest pushback it'll get in the room — that walking away from the single "official" number just hands the decision back to individual members' gut instincts, which is exactly the unaccountable, possibly more biased discretion these tools were brought in to replace.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Public member of a state parole board.
      *   **Context:** A specific parole case has two conflicting actuarial risk assessments (44% vs. 13% reoffending risk) based on different reference classes.
      *   **Core Issue:** The "Reference Class Problem" (identified by a board member). Any individual belongs to multiple overlapping groups, yielding different probabilities.
      *   **Task:** Write a short memo for the board.
      *   **Goals:**
          1.  Recommend a decision for the specific file.
          2.  Propose a standing policy for handling future splits in risk assessment.
          3.  Make recommendations concrete/votable.
          4.  Address the strongest pushback: abandoning a single number might return decision-making to unaccountable gut instincts/bias, defeating the purpose of the tools.
      *   **Tone:** Professional, authoritative, nuanced, actionable, respectful of the gravity of the decision (liberty vs. public safety).
      *   **Deadline:** Before Thursday's vote (implies urgency/brevity).

  2.  **Deconstruct the Problem (The Reference Class Problem):**
      *   *Broad Class:* "All men convicted of this offense." (44%) - High base rate, less specific to the individual. Safer for public protection, potentially unfair to the individual.
      *   *Narrow Class:* "Same offense, age, program, no juvenile record." (13%) - More specific, arguably more accurate for *this* person, but smaller sample size (even if "decent"), potentially riskier if the specific factors aren't truly predictive.
      *   *The Dilemma:* Choosing the broad class punishes the individual for factors they don't share (heterogeneity). Choosing the narrow class risks overfitting or ignoring base rates.
      *   *The Pushback:* If we don't trust the number, do we just guess? That invites bias.

  3.  **Drafting Strategy - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the specific case and the core technical issue (Reference Class Problem). Validate the philosophy professor's point.
      *   **Analysis of the Conflict:** Briefly explain *why* the numbers differ without getting bogged down in math. Broad = Base Rate; Narrow = Individualized.
      *   **Addressing the Pushback (Crucial):** Acknowledge that rejecting a single number risks subjectivity. Counter-argue that *blindly* accepting a flawed single number is also subjective (choosing one class over another is a value judgment). The goal is *structured* discretion, not *no* discretion.
      *   **Recommendation 1 (Specific Case):** How to vote on *this* guy?
          *   Option A: Deny (safe).
          *   Option B: Grant (fair).
          *   Option C: Middle path (conditional/structured).
          *   *Decision:* Given the massive gap (44% vs 13%), relying on the 44% seems unjustified if the 13% factors are relevant. However, 13% isn't zero. A conditional release or a vote to grant with specific mitigation strategies is best. Let's recommend granting parole but with heightened supervision conditions that address the uncertainty. Or, more simply, recommend using the *narrower* class but acknowledging the uncertainty. Actually, the prompt asks for a policy too. For the specific file, the recommendation should be to prioritize the narrower class *unless* there is specific evidence contradicting it. Let's go with: Vote to Grant, but acknowledge the risk management plan must address the 44% scenario.
          *   *Refinement:* It's better to recommend a specific voting principle. "In cases of significant divergence, prioritize the most specific valid reference class *provided* protective factors are verified."
      *   **Recommendation 2 (Standing Policy):** This needs to be votable language.
          *   Require transparency on reference classes.
          *   Establish a hierarchy (Specific > General) *with caveats*.
          *   Require a "narrative justification" when deviating from the higher risk number.
          *   Implement a "Risk Uncertainty Protocol" (e.g., if spread > X%, require senior review or specific mitigation).
      *   **Addressing the Bias Pushback:** Explicitly state that *interpreting* the tool requires human judgment. The tool doesn't remove discretion; it informs it. We must document *why* we chose one number over the other to maintain accountability.

  4.  **Refining the Tone and Content:**
      *   *Avoid:* Jargon-heavy statistics, wavering indecision, moralizing.
      *   *Include:* Clear directives, acknowledgment of the "Reference Class Problem," specific policy language.
      *   *Key Argument:* The "single number" is an illusion of objectivity. True objectivity comes from transparent reasoning about *which* number we choose.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   To: Board Members.
      *   Subject: Risk Assessment Discrepancy.
      *   We have a problem. Two numbers. 44% and 13%.
      *   It's the Reference Class Problem.
      *   If we pick 44%, we might be unfair. If we pick 13%, we might be unsafe.
      *   Pushback: Won't this make us biased?
      *   Answer: No, if we write down why.
      *   Vote 1: Release this guy (13% is more accurate).
      *   Vote 2: New policy. Always look at the classes. If they differ, write a reason.
      *   Closing: Let's do this.

  6.  **Drafting - Iteration 2 (Adding Polish and Weight):**
      *   Need to sound like a board member speaking to peers.
      *   Need to make the policy "line-by-line" votable.
      *   Need to hit the bias argument hard. "Gut instinct" is what happens when we pretend the math speaks for itself.
      *   *Self-Correction on Specific Case:* I shouldn't tell them how to vote on the *merits* (guilt/innocence/rehab) but rather how to weigh the *risk score*. However, the prompt asks "what we should do with this particular file." I need to take a stand. Given the 13% is based on relevant mitigating factors (program completion, no juvenile record), ignoring those seems wrong. I will recommend granting parole, conditioned on the specific risk factors identified in the broader class being managed.

  7.  **Final Polish:** Check against constraints.
      *   Short memo? Yes.
      *   Concrete recommendation? Yes.
      *   Address pushback? Yes.
      *   Votable language? Yes.
      *   Tone? Professional/Grave.

  8.  **Final Review of the "Bias" Counter-Argument:** This is the trickiest part. The argument is: "If we ignore the 44%, we are just using our guts." The counter is: "Choosing the 44% is *also* a choice. It's a choice to prioritize public safety over individual fairness without justification. By forcing a written justification for whichever number we pick, we reduce bias compared to hiding behind a 'magic number'." I need to make sure this lands clearly.

      *   *Policy Mechanism:* "Structured Professional Judgment." We don't abandon the tool; we contextualize it.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm dismissing the 44% entirely. It represents a base rate that shouldn't be ignored. The policy should require explaining why the narrower class is *more predictive* for this individual.

      *   *Revised Policy Idea:* When divergence exceeds a threshold (e.g., 15 percentage points), the board must articulate which class is more probative and document specific mitigation strategies if the lower risk number is used.

      *   *Specific File:* Vote to Grant Parole. Rationale: The narrower class accounts for dynamic risk factors (program completion) which are more actionable.

      Let's write it.

      *   *Subject Line:* Needs to be clear.
      *   *Opening:* Direct.
      *   *The "Why":* Explain Reference Class simply.
      *   *The Pushback:* Address the "gut instinct" fear.
      *   *The Resolutions:* Two distinct motions.

      *(Final check on the "Reference Class Problem" definition)*: Yes, it's exactly what the user described. Reichenbach's problem. Individual probability is undefined without a class.

      *(Final check on tone)*: Needs to be respectful of the danger. 44% is high. 13% is low. The gap is the danger zone.

      Let's assemble the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** State Parole Board Members
  **FROM:** [Your Name], Public Member
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Protocol: Divergent Actuarial Risk Assessments (Case #_____)

  **Purpose**
  This memo addresses the discrepancy in the actuarial risk assessments for Case #_____ and proposes a standing policy for handling similar divergences. As noted by Board Member [Name], we are facing the **Reference Class Problem**: the statistical reality that any individual belongs to multiple overlapping groups, each yielding different probability estimates.

  In this case, the "Broad Class" (all men convicted of this offense) suggests a 44% recidivism rate. The "Narrow Class" (same offense, age, program completion, no juvenile record) suggests 13%. Both are statistically valid. Neither is objectively "true" for this specific human being.

  **The Core Challenge**
  We must avoid the illusion that the risk instrument produces a single, objective fact. It does not. It produces a range of probabilities dependent on human choices about which comparison group matters most.

  **Addressing the Pushback: Discretion vs. Bias**
  The strongest argument against acknowledging this ambiguity is that it returns power to individual board members' "gut instincts," reintroducing the unaccountable bias these tools were designed to eliminate.

  This is a valid concern, but the alternative is worse. Pretending one number is "The Answer" does not remove discretion; it merely hides it. When we accept the 44% without question, we are exercising discretion to prioritize base rates over individual rehabilitation. When we accept the 13%, we are exercising discretion to prioritize specific mitigating factors.

  **Blind reliance on a single number is not objectivity; it is abdication.** True accountability comes not from hiding behind a statistic, but from documenting *why* we chose to weight one statistic over another. We must replace *unstructured* gut instinct with *structured* professional judgment.

  **Recommendations for Vote**
  I propose the board adopt the following two resolutions. The first applies to the pending file; the second establishes standing policy.

  **Resolution 1: Disposition of Case #_____**
  *   **Motion:** To grant parole.
  *   **Rationale:** In instances where the narrower reference class accounts for dynamic, post-conviction factors (e.g., program completion, clean disciplinary record), that class is more probative of current risk than a static historical base rate.
  *   **Condition:** Release conditions must specifically address the risk factors identified in the Broad Class (44%) that were not neutralized by the Narrow Class filters. We treat the 13% as the baseline probability, but manage the case as if the 44% risk exists until proven otherwise through supervision.

  **Resolution 2: Standing Policy on Divergent Risk Scores**
  *   **Motion:** To adopt the "Divergent Reference Class Protocol" effective immediately.
  *   **Protocol Terms:**
      1.  **Threshold:** Whenever two valid risk assessments for the same individual diverge by 15 percentage points or more, the "Single Score" field in the official record shall remain blank.
      2.  **Narrative Requirement:** The presiding board member must dictate a brief "Weighting Justification" into the record. This justification must state which reference class was prioritized and *why* (e.g., "Prioritized Narrow Class due to verified completion of cognitive behavioral therapy").
      3.  **Mitigation Check:** If the board relies on the lower risk estimate, the release plan must include specific supervision conditions targeting the risk factors present in the higher-risk reference class.
      4.  **Audit:** The Board Chair shall review a random sample of "Weighting Justifications" quarterly to ensure consistency and prevent demographic bias in class selection.

  **Conclusion**
  We cannot math our way out of moral responsibility. The Reference Class Problem ensures there will always be uncertainty. Our job is not to find a perfect number, but to make a defensible decision in the face of imperfect data. By voting for this protocol, we acknowledge the limits of the tool while strengthening the accountability of the user.

  I move we adopt these resolutions.
