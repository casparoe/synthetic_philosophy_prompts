          *   *Key Distinction:* Gongsun's argument relies on the *addition* of a quality (White) making the compound distinct from the base (Horse). The IAU argument relies on the *failure* of a quality (Clearing Orbit) making the compound distinct from the base.
          *   *Wait, is that right?* Gongsun says "White Horse is not Horse." He separates the compound from the simple. The IAU separates the compound ("Dwarf Planet") from the simple ("Planet").
          *   *So the structural move is identical.* $Compound \neq Simple$.
          *   *Where it breaks:* The linguistic expectation. "White Horse" naturally sounds like a specific horse. "Dwarf Planet" naturally sounds like a specific planet. Gongsun argues against the natural linguistic intuition in *both* cases.
          *   *Refinement:* Gongsun would argue the IAU is correct to separate them, but perhaps the name "Dwarf Planet" is itself a confusion (a "disorderly name"). If it's not a planet, why call it a planet? Just as if a White Horse is not a Horse, why call it a Horse?
          *   *Actually, Gongsun accepts the term "White Horse".* He just denies the predicate "is a Horse." So he accepts "Dwarf Planet" but denies "is a Planet."
          *   *The "Dwarf Star" Counter-example:* This is the tricky part. If Gongsun accepts "White Horse is not Horse," does he accept "Dwarf Star is not Star"?
