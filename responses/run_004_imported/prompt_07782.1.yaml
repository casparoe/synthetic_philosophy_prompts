          *   But astronomers say "Dwarf Star IS a Star."
          *   Gongsun would say the astronomers are loose with names. The IAU is being Gongsun-like with Planets, but inconsistent with Stars.
          *   *Conclusion:* Gongsun would see the IAU's Pluto decision as a rare moment of philosophical clarity in a world of linguistic confusion, vindicating his method of *Zheng Ming* (Rectification of Names), even if the specific astronomical taxonomy (Star vs. Planet) remains inconsistent.

