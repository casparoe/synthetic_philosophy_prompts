          *   *Wait, check the thesis:* "White Horse is *not* Horse." If Gongsun means "not identical," he's right. If he means "not a member of," he's being provocative. The "Seeking" argument suggests extensional difference. If I want a horse, any color works. If I want a white horse, only white works. Therefore, the *demand* is different.

      *   *Case 2: Dwarf Planet vs. Planet.*
