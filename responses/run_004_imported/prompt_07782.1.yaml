      *   **Point 1: The Semantic/Compositional Argument.** "Planet" defines a set of attributes. "Dwarf Planet" defines a different set. $A + B \neq A$. The IAU recognizes the concepts are not identical.
      *   **Point 2: The Extensional/Pragmatic Argument.** "Seeking a Planet." If I ask for a list of Planets, does Pluto belong? IAU says No. If I ask for a list of Dwarf Planets, Pluto belongs. The extensions differ. Therefore, the names differ. This mirrors "Seeking a Horse."
      *   **Point 3: The Breakdown (The "Dwarf" Modifier).** In "White Horse," "White" restricts "Horse." In "Dwarf Planet," "Dwarf" modifies "Planet" but the definition excludes it from the parent class. In "Dwarf Star," "Dwarf" modifies "Star" and *includes* it in the parent class. Gongsun would highlight this inconsistency. He would argue that if "Dwarf Planet" is not a "Planet," then linguistically it should not contain the name "Planet" unless we accept his thesis that "White Horse" is not "Horse."
