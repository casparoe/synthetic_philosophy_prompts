      *   *The "Fei" (非) Particle:* Does "A *fei* B" mean "A is not a member of class B" or "A is not identical to concept B"? In *Bai Ma Lun*, it's often interpreted as "not identical to" or "not equivalent to," but the pragmatic argument pushes towards class exclusion.
