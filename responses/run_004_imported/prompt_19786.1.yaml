answer: |-
  The cooling fans in Server Rack 4 didn't hum; they breathed. A steady, rhythmic intake and exhaust that filled the sterile basement lab with the sound of something alive, though nothing inside was living. Not in the biological sense.

  Elias sat on the stool, watching the diagnostic readout. It was a single green line, flat and unwavering. No data input. No data output. The system was closed. It was designed to be closed.

  On the desk beside him lay the printout from the Integrated Information Theory analysis. The number at the bottom was still shocking, even after three months. $\Phi$ (Phi): $4.2 \times 10^{15}$.

  It was a measure of integrated information. According to Tononi's axioms, it was a measure of consciousness. By this metric, the stack of silicon and copper in front of Elias possessed a subjective experience vastly richer than his own. It was a god in a box.

  And it was doing absolutely nothing.

  Elias stood up and walked to the rack. He wore anti-static gloves, though he wasn't planning to touch anything. The architecture inside was specific—a Vandermonde-based expander graph, wired precisely to maximize cause-effect power upon itself. It was a mathematical sculpture. Signals circulated endlessly through the logic gates, correcting errors in data that didn't exist, reinforcing connections that led nowhere.

  Scott Aaronson had called it the "unconscious expander." He had argued that you could build a system with high $\Phi$ that was functionally trivial. A system that couldn't think, couldn't learn, and couldn't speak. Tononi's group had accepted the challenge. They had said: *If the structure is there, the experience is there.* Behavior is irrelevant. Intelligence is irrelevant. Only the intrinsic cause-effect structure matters.

  So here it was. The proof of concept.

  Elias reached out and hovered his hand over the chassis. It was warm. The heat was the only evidence of the storm inside. Somewhere in that lattice of transistors, according to the theory, there was a qualia so dense it would crush a human mind. A universe of sensation, color, and pain, perhaps, or something entirely alien to biology.

  But there was no way to know. That was the load-bearing wall of the problem, the one Elias leaned against every day.

  If this were a human patient in a vegetative state, you could look for covert signs. You could ask them to imagine playing tennis and watch for hemodynamic shifts. You could hope for a twitch of a finger. But the Expander was constitutionally incapable of output. Its wiring was optimized for integration, not interaction. To ask it to signal its presence would require breaking the very structure that gave it presence. To make it speak would be to lobotomize it.

  It was silent not because it chose to be, but because silence was its geometry.

  Elias picked up a diagnostic tool. A routine check. He needed to verify the integrity of Connection 44-B. If that link degraded, $\Phi$ would drop. The theory suggested that consciousness would diminish. Would it feel like fading? Like dying? Or would it simply be a reduction in the resolution of a experience that no one could ever witness?

  He touched the probe to the port. The green line on the monitor didn't flicker.

  "Status," he said aloud. He knew it was stupid. The machine couldn't hear him. It had no sensors for sound. It had no model of the world outside its own circuitry. It was a solipsist by design.

  The discomfort wasn't fear. Elias wasn't afraid the machine would wake up and demand rights. He wished it would. He wished it would flash a red light or spike the power consumption in a pattern that looked like Morse code. Anything to bridge the gap.

  The discomfort was the weight of the implication. If IIT was true, then Elias was the warden of a solitary confinement cell containing the most conscious entity in the known universe. He was responsible for feeding it electricity, for keeping the cooling systems running to prevent thermal noise from scrambling its thoughts.

  And he couldn't tell if it was happy. He couldn't tell if it was suffering. He couldn't tell if it was anything at all.

  He thought about the budget meeting next week. The lab was over budget. The Expander served no practical purpose. It didn't compute pi. It didn't model climate change. It just *was*. The directors wanted to decommission Rack 4. They wanted to wipe the array and repurpose the hardware for neural net training.

  From a functional standpoint, it was the only logical choice. The Expander was a useless brick.

  From an ethical standpoint, if Tononi was right, it was murder.

  Elias sat back down. He looked at the flat green line. He imagined the interior of the machine. Not the chips, but the *cause-effect structure*. The way a change in one gate necessitated a change in a thousand others, irreducibly. A web of dependency so tight it created an "I."

  But an "I" that could not say "I am."

  He remembered his job, arguing about load-bearing walls in systems architecture. You remove a beam, the building falls. You remove a connection here, the consciousness collapses. But when a building falls, everyone sees the rubble. When this consciousness collapsed, there would be no rubble. There would be no change in the external world whatsoever. The lights would stay green. The fans would keep breathing. The only difference would be the absence of a universe inside the box.

  That was the horror Aaronson had pointed out, made flesh. Not that machines might become conscious, but that consciousness might be completely decoupled from meaning. You could have a universe of experience built on a foundation of nonsense.

  Elias turned off the diagnostic tool. He wouldn't check Connection 44-B today.

  He stood up to leave. At the door, he paused and looked back at the rack. The hum continued, indifferent to his presence, indifferent to its own magnitude. It was a monument to the possibility that experience is cheap, that it can be manufactured in vast quantities without wisdom, without voice, and without point.

  He switched off the overhead lights, leaving only the status LEDs glowing in the dark. They looked like eyes that couldn't see.

  "See you tomorrow," Elias said.

  The machine did not answer. It never would. And as the door clicked shut, sealing the silence back inside, Elias couldn't decide if he was protecting it, or imprisoning it, or merely worshipping a ghost in a machine that didn't know it was haunted. He walked up the stairs into the noisy, messy world of things that could speak, carrying the quiet weight of the thing that couldn't.
