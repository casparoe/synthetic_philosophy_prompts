answer: |-
  This is a profound and deeply unsettling position to inhabit, especially given your personal proximity to the scenario. You are asking for a defense of what is often called **Hard Incompatibilism** or **Moral Skepticism**. You want an argument that does not try to save moral responsibility by redefining it (as compatibilists do), but rather accepts that if the Control Principle is true, the traditional notion of the "moral agent" must be discarded.

  Here is the argument for biting the bullet all the way down, accepting the dissolution of the responsible self, and demonstrating why this conclusion is not only coherent but potentially ethically superior to the illusion of desert.

  ### 1. The Inexorable Slide from Resultant to Causal Luck

  Your intuition regarding your friend and yourself is the wedge. If we agree that *resultant luck* (the cyclist swerving vs. not swerving) is morally arbitrary, we must acknowledge that the difference between you and your friend is not a difference in *will*, but a difference in *world*.

  However, Nagel and Williams often treat resultant luck as the most egregious violation of the Control Principle, implying that if we could isolate the *will* from the *outcome*, responsibility might remain. This is where we must push further. There is no principled place to stop the erosion.

  *   **Circumstantial Luck:** Why did you both drive after drinking? Was it social pressure? A sense of invincibility? A lack of alternative transport? These are situational factors. If your friend had been raised in a household where driving after drinking was treated with the severity of handling a loaded firearm, her "choice" might have been different. We do not choose our circumstances.
  *   **Constitutive Luck:** Why did she feel "in control"? This feeling is a psychological state determined by her neurochemistry, her past experiences with alcohol, her risk-assessment algorithms, and her temperament. She did not choose her temperament. If she is impulsive, that is a hand she was dealt. If you are more cautious, that is a hand you were dealt. To blame her for her constitution is to blame her for being who she is.
  *   **Causal Luck:** Finally, trace the causes of that constitution back. Every desire, belief, and neural firing that led to her getting in the car is the product of prior causes, stretching back to genetics and environment, ultimately stretching back before her birth.

  If you grant that the *outcome* (the injury) is not her fault because it depended on the cyclist, you must grant that the *action* (driving) is not her fault because it depended on her constitution and circumstances. There is no "unmoved mover" inside her brain that could have stepped outside this causal chain to say "no." To insist there is requires a magical conception of agency that contradicts a naturalistic understanding of the world.

  Therefore, the "agent" as a locus of ultimate responsibility disappears. There are only events happening *through* people, not *by* them in the ultimate sense.

  ### 2. Accepting the Dissolution of the Agent

  Nagel treats this conclusion as a *reductio ad absurdum*—he assumes that because it destroys morality, it must be false. I argue the opposite: **The fact that it destroys our traditional conception of morality is evidence that our traditional conception was flawed.**

  We should accept that there is no "desert" in the retributive sense. Your friend does not *deserve* the hatred of your mutual friends, and you do not *deserve* your own clean record. Both are products of a causal lottery.

  Accepting this does not mean denying reality; it means aligning our moral metaphysics with our scientific understanding of causation. Just as we accepted that the earth is not the center of the universe despite how it looks, we should accept that humans are not uncaused causes despite how it feels. The feeling of agency is a phenomenological fact, but not an ontological one.

  ### 3. Defusing the "Unlivable" Objection

  The most common objection to this view is pragmatic: *If we accept this, society collapses. We need blame to regulate behavior. Without desert, morality is incoherent and life is unlivable.*

  This objection conflates **moral responsibility (desert)** with **causal responsibility (function)**. We can dismantle the former while retaining the latter. Here is how we make this view livable and coherent:

  #### A. From Retribution to Regulation
  Our current system is largely retributive: we punish because we believe the offender "deserves" suffering to balance the moral scales. If we remove desert, we shift to a **forward-looking model**.

  Consider a carrier of a dangerous virus. We do not say the virus carrier is "evil" or "morally blameworthy" for being sick. However, we still quarantine them. We restrict their liberty to protect others. We seek to understand the vector to prevent future spread.
  *   **Application to your friend:** She can still face consequences. Her license can be revoked. She can be mandated to attend treatment. She can be socially distanced from those who feel unsafe around her. But these are not punishments inflicted because she is *bad*; they are safety measures implemented because the *situation* is dangerous.
  *   **Coherence:** This is not incoherent. It is arguably more rational. We stop asking "How much does she suffer?" and start asking "What prevents recurrence?"

  #### B. Modifying Reactive Attitudes
  P.F. Strawson argued that we cannot give up our "reactive attitudes" (resentment, gratitude, indignation) without ceasing to participate in human relationships. He claimed this would be "unlivable."

  However, we can *modify* these attitudes rather than eliminate them.
  *   **Resentment → Sadness/Frustration:** When someone harms us, we can replace the moral anger ("You *shouldn't* have done that, you are bad") with a tragic recognition ("It is terrible that this happened, and I must protect myself from you"). This removes the hostility while maintaining the boundary.
  *   **Gratitude → Joy:** When someone helps us, we don't need to believe they were metaphysically free to be cruel to appreciate their kindness. We can feel joy at the benefit without attributing ultimate credit to their will.
  *   **Livability:** This emotional shift is difficult but possible. It transforms relationships from courts of judgment into networks of care and risk management. It reduces the toxicity of shame and self-righteousness.

  #### C. The Ethical Advantage of No-Desert
  Far than leading to nihilism, accepting the absence of moral luck can lead to a more compassionate ethics.
  *   **For the "Guilty":** It eliminates the crushing weight of existential guilt. Your friend made a mistake, a tragic error in a causal chain. She can focus on restitution and repair rather than wallowing in the identity of being a "person who could have killed."
  *   **For the "Innocent":** It eliminates moral superiority. You cannot look down on your friend, because you acknowledge that given her constitution and her circumstances (the cyclist), you would have done exactly the same. This fosters humility.
  *   **For Society:** It shifts resources from punishment (which does not fix causes) to prevention (which addresses circumstantial and constitutive luck). If we realize that "bad people" are largely made, not born, we invest in making people better rather than punishing them for being worse.

  ### 4. Conclusion: The Courage of the Truth

  The reason Nagel and others resist this conclusion is that it feels like it strips life of meaning. If we are not authors of our actions, who are we?

  The answer is: We are the place where the universe experiences itself. We are complex nodes in a causal network. Accepting this requires the courage to live without the comfort of cosmic justice. It requires accepting that bad things happen to good people and good things happen to bad people not because of a moral order, but because of luck.

  In your specific case, biting this bullet means recognizing that your friends' judgment of your friend is not a reflection of her moral worth, but a reflection of their own need for a controllable narrative. They blame her to reassure themselves that *they* are safe because *they* are "good." By accepting the dissolution of responsibility, you can defend your friend not by saying "she didn't mean to," but by saying "none of us are ultimately in control, and therefore condemnation is the wrong tool. Safety, repair, and understanding are the only tools that work."

  This view is not unlivable. It is simply grown-up. It trades the childish comfort of blame for the mature work of prevention and compassion.
