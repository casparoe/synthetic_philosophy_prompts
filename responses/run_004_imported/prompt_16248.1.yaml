      *Let's sharpen the verdict:* Greaves doesn't solve the epistemic problem; she dissolves the *normative* force of the problem. She shows that even if we are clueless (Lenman is right), we can still act rationally (Greaves is right). So it's not bookkeeping; it's a defense of rationality under ignorance.

