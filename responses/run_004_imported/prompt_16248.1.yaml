answer: |-
  Here is a breakdown of the Lenman-Greaves dialectic, structured so you can lift the core argument directly for your seminar introduction.

  ### The Mapping: Where Lenman Lands in Greaves's Taxonomy

  To answer your students' question, we first have to locate Lenman's specific "chaos/identity" worry within Greaves's framework.

  Lenman's argument relies on the **sensitivity of long-term outcomes to small initial conditions** (chaos theory) combined with the **non-identity problem**. If I help a person cross the street, I alter the timing of their interactions, changing who they meet, who they conceive, and thus the entire population of the future. Since we cannot predict the moral value of these future lives (will they be tyrants or saints?), we cannot calculate the total utility of the act.

  **Greaves classifies this as *Simple Cluelessness*.**

  Here is the logic you can walk the class through:
  1.  **Greaves's Definition:** Simple cluelessness obtains when we have no reason to think the unforeseen effects of Act A are better than Act B, and no reason to think they are worse. The ignorance is symmetric.
  2.  **Lenman's Claim:** We are totally ignorant of the long-term ripple effects.
  3.  **Greaves's Move:** Unless we have a specific theory suggesting that "ripple effects tend to be negative" (or positive), we must treat this ignorance as symmetric. We have no reason to think the "butterfly effect" of saving a child leads to a worse future *rather than* a better one.
  4.  **The Result:** In Expected Utility terms, the positive and negative possibilities cancel out. The expected value of the unknown long-term ripples is zero. Therefore, we can bracket them and decide based on the known, short-term consequences.

  **However, there is a trap.** Lenman would argue that this isn't truly Simple Cluelessness; it is **Complex Cluelessness** masquerading as Simple. Why? Because we *do* have competing narratives. We can construct a plausible story where the saved child becomes a dictator (reason to think A is worse) and a plausible story where they become a humanitarian (reason to think A is better). Since these reasons are incommensurable and lack probabilities, Lenman argues we cannot simply "cancel them out."

  Greaves anticipates this. She argues that unless those narratives are backed by *evidence* of probability, they remain in the realm of Simple Cluelessness. Mere possibility does not create Complex Cluelessness; competing *reasons with weight* do.

  ### The Verdict: Solution or Bookkeeping?

  Here is the hard verdict you can offer your seminar:

  **Greaves does not solve Lenman's *epistemic* problem; she dissolves its *normative* force.**

  If your students ask if she "solved" it, the answer is **no**, if by "solve" we mean "showed us how to know the long-term consequences." Lenman is right that we are clueless. The world is still chaotic; identity effects still ripple. Greaves does not give us a telescope to see the future.

  However, the answer is **yes**, if by "solve" we mean "showed how consequentialism remains action-guiding despite the cluelessness." Greaves demonstrates that Lenman's worry only paralyzes act consequentialism if you assume that *ignorance implies inability to maximize*. Greaves shows that under Expected Utility Theory (EUT), symmetric ignorance (Simple Cluelessness) has an expected value of zero.

  **The Critical Flaw (for discussion):**
  Greaves's "solution" relies on a **Principle of Indifference**. She assumes that in the absence of evidence, we should assign equal probability to positive and negative ripples. Lenman's deeper worry is that this principle is unjustified in chaotic systems. Chaos isn't necessarily a random walk around a mean of zero; it might be a drift toward entropy or disvalue.

  **So, is it bookkeeping?**
  It is sophisticated bookkeeping that functions as a solution *only if* you accept the norms of decision theory over the norms of epistemic skepticism. Greaves effectively says: "Lenman, you are right that we don't *know*, but you are wrong that we can't *act*." She relocates the problem from "Consequentialism is false" to "Consequentialists must be comfortable with imprecise probabilities."

  ### Draft Remarks for Thursday (Stealable Text)

  *"We often pair Lenman and Greaves to show the evolution of the 'cluelessness' objection, but I want to be precise about what Greaves actually achieves. Lenman argues that because our actions ripple through time and change who exists, we are fundamentally blind to the value of our acts. He treats this as a knockout blow to act consequentialism.*

  *Greaves's intervention is to ask: 'What kind of blindness is this?' She distinguishes between Simple Cluelessness (symmetric ignorance) and Complex Cluelessness (conflicting reasons without probabilities). She classifies Lenman's 'chaos' worry as Simple Cluelessness. Her argument is that unless we have a specific reason to think the ripples are bad, their expected value cancels out to zero. This allows the consequentialist to ignore the long-term chaos and focus on the short-term knowns.*

  *So, did she solve it? Epistemically, no. We are still clueless. But normatively, yes. She shows that cluelessness does not entail paralysis. However, this victory comes at a cost: it requires us to accept a Principle of Indifference regarding the far future. Lenman would say that's an unjustified assumption; Greaves says it's a necessary requirement of rational choice. The debate, then, isn't about whether we are clueless—we are. It's about whether rational agents are licensed to treat symmetric ignorance as neutral."*

  ### Teaching Tip: The "Bednet" Test
  To make this concrete for the students, ask them to apply the taxonomy to **malaria bednets**:
  *   **Lenman:** Saving a child changes the future population. We don't know if that's good. (Cluelessness).
  *   **Greaves:** Is there a reason to think the *specific* future people born because of the bednet are worse off than the ones who would have been born otherwise? If no $\rightarrow$ **Simple Cluelessness** (Ignore it).
  *   **The Challenge:** What if saving the child contributes to overpopulation, straining resources? Now we have a specific reason to think the ripple is negative. That shifts it to **Complex Cluelessness**. Greaves admits this is harder to solve, but argues we can still assign imprecise probabilities.

  This distinction shows that Greaves didn't just rename the problem; she gave us a filter to separate the "harmless" unknowns from the "dangerous" ones.
