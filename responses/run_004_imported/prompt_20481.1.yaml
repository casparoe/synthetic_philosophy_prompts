      *   **Anscombe's Critique (Intention):**
          *   Focuses on "acting under a description."
          *   If the bad effect is integral to the plan's success *in the world*, even if not in the mind, it might be intentional.
          *   Key concept: "Causal work." If the death of the innocent is doing the causal work necessary for the objective, Anscombe tends to view it as intended, regardless of the agent's psychological state.
          *   She famously argued against Truman because the demoralization/destruction of the civilian population *was* the mechanism of victory.
          *   *Goal:* Find a case where standard DDE says "side effect" (collateral damage), but Anscombe says "the death is doing the work."

