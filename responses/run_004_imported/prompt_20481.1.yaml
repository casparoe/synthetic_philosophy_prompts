answer: |-
  Here is a case designed to drive a wedge between the standard Doctrine of Double Effect (DDE) and G.E.M. Anscombe's specific account of intention. It avoids the overused Terror/Strategic Bomber dichotomy and Hiroshima, focusing instead on the indivisibility of the causal chain.

  ### The Case: The "Load-Bearing Collapse" Scenario

  **The Setup:**
  Intelligence confirms that an Enemy High Command unit is operating out of the basement and first floor of a ten-story mixed-use building in an urban center. Floors 2 through 10 are occupied by 200 civilian residents who cannot be evacuated in time (the window of opportunity is 10 minutes).

  The building's architecture is such that the basement supports the entire weight of the structure. There is no precision munition available that can destroy the basement command post without compromising the load-bearing pillars. Engineering assessments confirm with **100% certainty** that destroying the basement will cause a total structural collapse of the entire building.

  **The Decision:**
  The commander orders a airstrike on the basement to decapitate the enemy command, accepting the total collapse of the building and the death of the 200 civilians as a necessary consequence of the physics involved.

  ---

  ### 1. The Standard DDE Verdict: **Permissible**

  A student applying the standard four conditions of the Doctrine of Double Effect will likely clear this action. Here is the breakdown they would write:

  1.  **Nature of the Act:** The act is bombing a legitimate military target (Enemy Command). This is a good or neutral act in itself.
  2.  **Intention:** The agent intends only the good effect (destroying the command post/ending the war sooner). They do *not* intend the death of the civilians. (Proof: If the civilians could be magically teleported away while the building collapsed, the commander would be delighted. Their death contributes nothing to the military objective.)
  3.  **Means vs. Side Effect:** The death of the civilians is not the *means* by which the command post is destroyed. The explosion destroys the command post; the collapse kills the civilians. The civilians' deaths are causally downstream, not instrumental.
  4.  **Proportionality:** The military advantage (decapitating enemy command) is sufficiently grave to outweigh the foreseeable collateral damage (200 civilians), assuming this strike significantly shortens the war.

  **Result:** Under standard DDE, this is a tragic but morally permissible act of "collateral damage." The intention is pure; the death is merely foreseen.

  ---

  ### 2. The Anscombe Verdict: **Murder (Intentional Killing)**

  Anscombe would reject the DDE verdict. In her framework (specifically from *Intention* and her essay "War and Murder"), the commander is guilty of intentionally killing the innocent. She would not be swayed by the commander's psychological state ("I didn't want them to die").

  Here is how her machinery convicts the planner, highlighting the gap:

  **A. Acting "Under a Description"**
  Anscombe argues that intention is not a private mental feeling; it is found in the description of the action that the agent accepts as true. If you ask the commander, "What are you doing?" and he says, "I am destroying the command post," Anscombe asks: "Is that the *whole* truth?"

  If the commander knows with certainty that he is also "Collapsing the residential floors," then that is *also* a description of his intentional action. He cannot describe his way out of it. To say "I am only destroying the basement" is a lie about the physical reality of the action. He is destroying the *building*. Since "building" entails "people living in it," he is destroying the people.

  **B. The "Causal Work" Problem**
  This is the crux of your request. DDE tries to separate the *blast* (which hits the target) from the *collapse* (which hits the civilians). Anscombe argues that you cannot separate the causal work when the mechanism is indivisible.

  In this scenario, the **gravity-induced collapse** is the causal mechanism. That same mechanism acts on the command post *and* the civilians simultaneously. The commander is utilizing the structural integrity of the building as the delivery system for his attack. By choosing a method that *requires* the destruction of the civilian space to reach the military space, the civilian destruction becomes part of the *execution* of the plan, not just an aftermath.

  For Anscombe, if the causal chain *necessitates* the death of the innocent as a condition of the action's success (i.e., you cannot have the explosion without the collapse), then the death is intended *under the description* "killing those in the building."

  **C. Certainty vs. Foresight**
  Anscombe famously dismantles the DDE distinction between "intended" and "foreseen" when the consequence is certain. She argues that if you know with certainty that X will happen as a result of your action, and you proceed, you intend X.

  *   **DDE View:** "I foresee the death, but I don't intend it."
  *   **Anscombe View:** "You know the death is inevitable. Therefore, in the order of your practical reasoning, the death is accepted as part of the plan. You cannot claim you don't intend what you knowingly bring about."

  ---

  ### 3. Why This Shows the Gap (For Your Grading)

  This case allows you to point out to students where their DDE application is superficial versus where it engages with the metaphysics of action.

  *   **The DDE Loophole:** Students will rely on the *psychological* distinction ("He didn't want them to die"). They treat intention as a feeling of regret attached to a side effect.
  *   **The Anscombe Correction:** She forces the focus onto the *action in the world*. The gap appears because DDE allows the agent to define the action narrowly ("Bombing the basement"), while Anscombe insists the action must be described truthfully according to its known effects ("Collapsing the inhabited building").

  **The "Smoking Gun" for your feedback:**
  If a student argues this case is permissible under DDE, ask them: *"If the commander knew the civilians were there with 100% certainty, in what sense is their death not part of the plan?"*
  *   If they say, "It's not the goal," they are using standard DDE.
  *   If they say, "It doesn't help achieve the goal," they are using the "Means" condition.
  *   **You can then reply:** "Anscombe argues that 'helping achieve the goal' isn't the test. The test is whether the agent accepts the description 'Killing Civilians' as true of their action. Since the physics make it inevitable, the agent *does* accept it by pulling the trigger. Therefore, the intention includes the killing, regardless of whether it was a 'means' or an 'end'."

  This example moves the debate away from "Terror vs. Strategic" (which is about *why* you bomb) to "Description vs. Physics" (which is about *what* you are doing), which is exactly where Anscombe's philosophy bites hardest.
