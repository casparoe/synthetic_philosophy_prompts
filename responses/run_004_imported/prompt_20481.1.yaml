  2.  **Deconstruct the Philosophical Frameworks:**
      *   **Standard Doctrine of Double Effect (DDE):**
          1.  The act itself is good or neutral.
          2.  The agent intends only the good effect (bad effect is foreseen but not intended).
          3.  The good effect is not produced *by means of* the bad effect.
          4.  Proportionality (good outweighs bad).
