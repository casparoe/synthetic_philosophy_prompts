answer: |-
  This is fantastic. You and Dana aren't just having a casual disagreement; you have accidentally stumbled onto one of the oldest and most famous problems in the history of philosophy.

  You are arguing about **Future Contingents**.

  Specifically, you are reenacting a debate that Aristotle wrote about over 2,000 years ago in his work *De Interpretatione* (On Interpretation). He used the example of a "sea battle." Is the statement "There will be a sea battle tomorrow" true or false right now?

  Here is the breakdown of who is "right," why you are both feeling so sure, and why you don't need to worry about Mia's free will.

  ### 1. The Case for You (Logical Realism / Bivalence)
  Your position relies on the **Law of Bivalence**. In classical logic, every meaningful statement must be either true or false. There is no middle ground.

  *   **Your logic:** Reality is a certain way. Either the future event *will* happen or it *won't*. If Mia *will* say yes, then the statement "Mia will say yes" corresponds to reality, making it true now. If she *won't*, the statement is false now.
  *   **Why you feel sure:** It feels like knowledge is just a matter of access. Just because we don't *know* the answer doesn't mean there *isn't* an answer. Think of a card at the bottom of a deck. Is it the Ace of Spades or not? Yes, it is one or the other, even if no one has looked at it yet.

  **In classical logic, you are right.** Most standard logical systems operate on the assumption that propositions have fixed truth values.

  ### 2. The Case for Dana (The Open Future)
  Dana's position is often called the **Open Future** view. This view suggests that truth depends on existence.

  *   **Dana's logic:** For a statement to be true, there has to be some "fact of the matter" that makes it true. Since the future hasn't happened yet, there are no facts about it. Mia hasn't decided. Her brain hasn't fired the neurons yet. Therefore, the statement "Mia will say yes" is neither true nor false; it is **indeterminate**.
  *   **Why she feels sure:** She is intuiting that the future is *created* by choices, not *discovered* like a hidden card. If the truth is already fixed, it feels like the choice is an illusion.

  **In many modern philosophical and logical systems (like Temporal Logic), Dana is right.** Some logicians argue that applying "true/false" to future events is a category error.

  ### 3. Who is actually right?
  **Philosophy has not settled this.**

  There is no experiment you can run to prove who is correct. It depends on which metaphysical framework you prefer:
  *   If you believe in a **"Block Universe"** (where past, present, and future all exist simultaneously in spacetime), then **you are right**. The future is already "there," waiting to be observed.
  *   If you believe in **"Presentism"** (where only the present moment exists), then **Dana is right**. The future literally does not exist yet, so there is nothing for the statement to correspond to.

  ### 4. Addressing the "Freak Out" (Free Will vs. Truth)
  This is the most important part. You asked: *If "she'll say yes" is already true, is her answer locked in? Is she not really choosing?*

  This is the problem of **Logical Fatalism**. It is a very common anxiety, but logicians generally agree it is a mistake in reasoning. Here is why Mia still has free will, even if you are right and the statement is already true.

  **Truth describes; it does not cause.**
  The truth of the statement is a *result* of Mia's choice, not the *cause* of it.

  *   **Scenario A:** Mia thinks about it, decides she loves him, and says "Yes." Because she chose "Yes," the statement "Mia will say yes" was true all along.
  *   **Scenario B:** Mia thinks about it, decides she isn't ready, and says "No." Because she chose "No," the statement "Mia will say yes" was false all along.

  The truth value of the proposition doesn't reach back in time and force her hand. It simply reflects what she *will* freely choose.

  **The Map vs. The Territory**
  Think of the truth value like a map. Just because the map says "There is a mountain here" doesn't mean the map *built* the mountain. The mountain is there (or will be there) because of geological forces. The map is just true because it matches the mountain.
  Similarly, the statement is true *because* Mia will choose it. Her choice is the geological force; the truth value is just the map.

  ### The Verdict
  *   **On the logic:** You and Dana are both defending valid, historically respected positions. You are arguing for **Classical Bivalence**; Dana is arguing for **Indeterminacy**. You can shake hands and agree that the answer depends on which philosophical lens you wear.
  *   **On the fear:** You can relax. Even if the statement is true right now, it is only true *because* Mia is going to make a free choice next weekend. Her agency is safe.

  **My advice?** Tell Dana you looked it up, and you both accidentally recreated an Aristotelian paradox. Then buy her a drink, because arguing about metaphysics for an hour is impressive, even if you were both technically arguing about things that can't be proven.
