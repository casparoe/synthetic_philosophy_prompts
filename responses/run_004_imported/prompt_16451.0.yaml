prompt: |-
  I've spent most of the last decade covering science and ideas, with a good chunk of that on the effective-altruism and existential-risk beat. That's presumably why a mid-sized foundation funding long-term-future and existential-risk work recently invited me to join its grants committee as one of two outside 'public members' — people with no financial stake in the outcomes, brought in mainly to stress-test whether the committee's reasoning would hold up once it left the room.

  Ahead of our allocations meeting in three weeks, the committee has to rule on an application that has left everyone more confident in their gut reaction than in their ability to defend it, so I've been asked to draft the discussion memo. The applicants aren't proposing a specific intervention; they want roughly a million dollars over two years for a research and advocacy program built on an argument along these lines. Serious cosmological models don't rule out a spatially infinite universe, in which case, on fairly standard assumptions, there exist infinitely many exact or near-exact duplicates of Earth, each causally sealed off from us behind its own cosmological horizon. The applicants argue that by adopting and publicizing a specific cooperative policy — one that any sufficiently similar reasoner elsewhere would, on identical evidence, also be inclined to adopt — the committee can affect, in a purely evidential rather than causal sense, how countably infinitely many of those duplicate civilizations fare. On a standard expected-value calculation, that makes the payoff from funding them literally infinite, and since no finite amount of expected good can outweigh an infinite one, they conclude the grant should take strict priority over everything else in the budget, including our pandemic-preparedness and AI-safety commitments, regardless of how small the committee's credence in the underlying cosmology is. Two committee members find the logic basically airtight and want to fund it as a cheap hedge against an enormous upside; a couple of others want to reject it out of hand as a clever trick not worth the committee's time; I don't think either reaction survives being spelled out in full.

  Could you draft that memo for me? I need it to reach an actual recommendation — fund, decline, or fund with specific conditions — on this application, and, since this will not be the last unbounded-value argument to reach this committee, a general rule or procedure it can apply to future proposals of the same shape without simply refusing to engage with them. Please take the applicants' reasoning seriously on its own terms first — including the uncomfortable fact that quietly abandoning expected-value reasoning only when it yields an inconvenient answer is its own kind of inconsistency — before explaining where, if anywhere, you think the argument breaks down. Keep it to two pages or so, something the committee will actually read in one sitting, without flattening the argument just to get there.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Science/Ideas Journalist, Outside Public Member on a Grants Committee (Effective Altruism/Existential Risk focus).
      *   **Task:** Draft a discussion memo for the committee regarding a specific grant application.
      *   **The Application:** Requests ~$1M over 2 years. Premise: Infinite universe $\rightarrow$ Infinite duplicates $\rightarrow$ Evidential Decision Theory (EDT) / Acausal Trade $\rightarrow$ Infinite Expected Value (EV). Conclusion: This grant dominates all others (pandemics, AI safety) regardless of low credence in the cosmology.
      *   **Committee State:** Divided. Some think it's airtight/cheap hedge; others think it's a trick.
      *   **Requirements:**
          *   Reach an actual recommendation (Fund, Decline, or Conditional).
          *   Propose a general rule/procedure for future "unbounded value" arguments.
          *   Take the reasoning seriously first (avoid motte-and-bailey dismissal).
          *   Acknowledge the inconsistency of abandoning EV reasoning only when inconvenient.
          *   Explain where the argument breaks down (if it does).
          *   Length: ~2 pages (readable in one sitting).
          *   Tone: Professional, analytical, rigorous, EA-adjacent (familiar with terms like EV, credence, acausal trade).

  2.  **Deconstruct the Argument (The "Infinite Ethics" Problem):**
      *   *Premise 1:* Spatially infinite universe is possible (non-zero credence).
      *   *Premise 2:* Infinite duplicates exist (Level I Multiverse).
      *   *Premise 3:* Our decision correlates with duplicates via logical/evidential connection (EDT/Functional Decision Theory).
      *   *Premise 4:* Infinite beneficiaries $\times$ Non-zero utility = Infinite Expected Value.
      *   *Conclusion:* Any non-zero probability of this being true makes the EV infinite, dominating all finite EV projects (like AI safety).
      *   *The Trap:* This is a variant of "Pascal's Mugging" or the "St. Petersburg Paradox" applied to cosmology. If accepted, it paralyzes decision-making because *any* action could be claimed to have infinite EV under some obscure theory.

  3.  **Determine the Recommendation:**
      *   *Fund?* No. It diverts resources from tangible x-risks (AI, Bio) based on speculative metaphysics. It sets a dangerous precedent.
      *   *Decline?* Yes, but needs nuance. A flat "no" looks like dogmatism.
      *   *Conditional?* Maybe fund a small amount for *philosophical* research into the problem, but not the advocacy program described.
      *   *Decision:* **Decline the specific application, but recommend a procedural framework for handling unbounded value claims.** The specific proposal is advocacy based on unsettled decision theory, which is low priority compared to concrete x-risk.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly up front. (Decline, but adopt a framework).
      *   **The Case for the Proposal (Steel-manning):** Acknowledge the logic. If we use standard EV maximization and accept non-zero credence in infinite universes + acausal influence, the math holds. Ignoring this *is* inconsistent if we claim to be pure EV maximizers. This validates the "cheap hedge" intuition.
      *   **The Breakdown (Where it fails):**
          *   *Decision Theory Dispute:* Causal Decision Theory (CDT) vs. Evidential (EDT) vs. Functional (FDT). The argument relies on a specific, controversial interpretation of acausal influence.
          *   *The "Infinity" Problem:* Infinite ethics breaks standard math. If Action A has $\infty$ value and Action B has $\infty$ value, how do we choose? (Isomorphism problem).
          *   *Pascal's Mugging:* If we accept this, we must accept *any* claim with infinite upside and non-zero probability, leading to paralysis or vulnerability to manipulation.
          *   *Opportunity Cost:* Funding this *reduces* finite but massive value (AI safety) which might also have infinite downstream implications (colonization).
      *   **Procedural Recommendation (The "Rule"):** We need a heuristic. "Bounded Utility" or "Truncation." We cannot act on infinite EV claims without robust consensus on the underlying decision theory.
      *   **Final Recommendation:** Decline the advocacy grant. Fund a small philosophical investigation if needed, but prioritize tractable x-risks.

  5.  **Refining the Tone:**
      *   Needs to sound like an insider who understands EA jargon (credence, EV, acausal, tractability) but maintains journalistic/objective distance.
      *   Avoid being dismissive ("this is crazy") but be firm ("this is decision-theoretically unstable").
      *   Address the "inconsistency" charge directly.

  6.  **Drafting - Iteration 1 (Mental Check):**
      *   *Critique:* Is it too long?
      *   *Fix:* Keep paragraphs tight. Use bullet points for the breakdown.
      *   *Critique:* Is the recommendation clear?
      *   *Fix:* Make sure the "General Rule" is distinct from the specific decision.

  7.  **Drafting - Iteration 2 (Focusing on the "Inconsistency" point):**
      *   I need to explicitly say: "You are right that dropping EV because we don't like the result is bad. But keeping EV when the math breaks is also bad."
      *   The key is that standard EV calculus *requires* finite bounds to function. When infinity enters, the calculus itself dissolves, so we aren't abandoning EV, we are acknowledging the tool is broken for this input.

  8.  **Final Polish:** Check word count and formatting. Ensure the "Public Member" voice comes through (stress-testing reasoning, not just voting).

  **(Self-Correction during drafting):** I initially thought about suggesting a small grant for research. But the prompt asks for a recommendation on *this* application (advocacy + research program). Better to decline the advocacy part specifically. I will recommend declining the application as stated but propose the committee adopt a policy for future similar claims.

  9.  **Finalizing the "General Rule":** Call it the "Finite Truncation Principle" or "Decision-Theoretic Consensus Requirement." Let's go with a requirement for robust decision-theoretic consensus before acting on infinite claims.

  10. **Writing the Memo.** (Proceeding to generate output based on these thoughts).

  *Wait, one more check:* The prompt asks me to *draft the memo for the journalist*. So I am writing *as* the journalist.
  *Voice:* Analytical, respectful, firm.
  *Length:* ~1000-1200 words (approx 2 pages single spaced).

  *Key argument to include:* If AI safety succeeds, *that* also unlocks infinite value (via future colonization). Therefore, the "infinite" argument doesn't necessarily privilege *this* specific proposal over AI safety, unless one assumes acausal trade is more reliable than causal colonization. This is a strong counter-argument.

  *Let's integrate that.* If we save the world causally, we might fill the universe with value. If the universe is already infinite, our causal actions might still matter (measure problem). But crucially, AI safety is a prerequisite for *any* long-term future, infinite or not. So it dominates the infinite ethics proposal instrumentally.

  *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** Long-Term Future Fund Grants Committee
  **FROM:** [Your Name], Outside Public Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Application #492 (Infinite Cosmology & Acausal Advocacy)

  **Executive Summary**

  This memo addresses the application requesting $1M for a research and advocacy program based on "Infinite Ethics" and acausal decision theory. The applicants argue that if there is a non-zero probability of an infinite universe, acting on policies that correlate with infinite duplicates yields infinite expected value (EV), dominating all finite causes (e.g., AI safety, pandemic preparedness).

  **Recommendation:** **Decline** the application as currently structured.

  **Rationale:** While the applicants' logic is internally consistent under specific decision-theoretic assumptions, acting on it violates the operational requirements of robust grantmaking. It exposes the foundation to "Pascal's Mugging" vulnerabilities and ignores the fact that standard causal interventions (like AI safety) are prerequisites for *any* long-term value realization, infinite or otherwise.

  However, simply rejecting this as "absurd" is intellectually dishonest and inconsistent with our commitment to expected-value reasoning. To maintain integrity, the committee must adopt a formal procedure for handling unbounded value claims. I propose we adopt a **Decision-Theoretic Consensus Rule**: *The committee will not allocate significant resources based on infinite EV claims unless there is robust consensus within the relevant decision-theory community that the underlying mechanism (e.g., acausal influence) is actionable.*

  **1. Steel-manning the Argument**

  We must acknowledge that the applicants are not making a category error; they are applying our own stated principles more rigorously than we often do.

  1.  **Cosmology:** Standard inflationary models allow for a spatially infinite universe. Our credence in this should not be zero.
  2.  **Decision Theory:** If we accept Evidential Decision Theory (EDT) or Functional Decision Theory (FDT), our choices can be logically correlated with identical reasoners across cosmological horizons.
  3.  **Calculation:** Infinite beneficiaries $\times$ Non-zero credence $\times$ Positive utility = Infinite EV.

  If we claim to be EV maximizers, we cannot discard a calculation simply because the result is inconvenient. If we ignore this argument, we are effectively imposing an arbitrary cap on utility, which contradicts the utilitarian framework underpinning much of our work. The "cheap hedge" argument has merit: if there is *any* chance this works, the upside is unbounded.

  **2. Where the Argument Breaks Down**

  Despite the internal consistency, there are three critical failure points that justify rejection without abandoning EV reasoning.

  **A. The Paralysis of Infinity**
  If one action yields infinite EV, *any* action with a non-zero chance of yielding infinite EV also yields infinite EV. If we fund this proposal, we must also fund a proposal to press a button that *might* create infinite value, or one that prevents infinite disvalue. When everything has infinite EV, the metric ceases to discriminate. We lose the ability to compare trade-offs. Standard EV calculus requires bounded utility to function as a decision tool; introducing infinity breaks the math rather than solving it.

  **B. The Instrumental Convergence Counter-Argument**
  Even if the infinite universe hypothesis is true, standard causal interventions likely dominate acausal ones. If we fail to mitigate existential risk (e.g., unaligned AI), humanity goes extinct. A dead humanity cannot execute acausal policies, nor can it colonize a finite universe to create vast (if not infinite) value. Therefore, existential risk reduction is an *instrumental prerequisite* for any long-term value strategy, whether causal or acausal. Funding this advocacy program at the expense of AI safety reduces the probability of humanity surviving to leverage *any* cosmological opportunities.

  **C. Vulnerability to Manipulation**
  Accepting infinite EV claims with low credence makes the foundation vulnerable to "Pascal's Mugging." Any applicant could construct a speculative metaphysical narrative with infinite upside to bypass standard scrutiny on tractability and evidence. Defending against this requires a prior commitment to ignoring unbounded claims until the underlying physics and decision theory are settled science, not active research areas.

  **3. Procedural Recommendation: The Finite Truncation Principle**

  This will not be the last time we encounter an unbounded value argument. To avoid ad-hoc reasoning, I propose the committee adopt the following guideline for future allocations:

  *   **The Finite Truncation Principle:** For the purposes of grant allocation, the committee will treat all outcome values as finite. We will explicitly discount probabilities below a certain threshold (e.g., $10^{-9}$) when multiplied by claimed utilities exceeding a specific cap (e.g., $10^{20}$ lives).
  *   **Justification:** This is not a claim that infinite value *does not exist*. It is an admission that our cognitive and mathematical tools for *allocating capital* cannot handle infinity. We are maximizing expected value *conditional on our ability to calculate it*.
  *   **Exception:** Infinite claims may be considered only if the mechanism relies on established physics and decision theory with >50% credence within the relevant expert community. Currently, acausal trade fails this bar.

  **4. Conclusion**

  The applicants are correct that quietly abandoning EV reasoning when it yields uncomfortable results is inconsistent. However, continuing to use EV reasoning when the inputs break the calculation is equally inconsistent.

  We should decline this grant not because the universe is finite, but because our ability to act on the infinite is currently nil. We should prioritize interventions that secure a future where this question might one day matter. I recommend we communicate this decision to the applicants along with the new procedural framework, inviting them to re-apply should the decision-theoretic consensus shift.

  **Action Required:**
  1.  Vote to Decline Application #492.
  2.  Vote to adopt the **Finite Truncation Principle** for future committee deliberations.
