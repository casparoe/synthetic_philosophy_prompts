  7.  **Key Philosophical Reference:** Derek Parfit is essential here. He discusses the "Past and Future Bias" extensively. He concludes that while Temporal Neutrality is defensible, Future Bias is not obviously irrational. This gives the user solid ground.

  8.  **Final Polish:** Check against the user's specific constraints. They want to know who had the "better of it." I should conclude on that.
