      *   *Correction/Refinement:* Actually, most contemporary philosophers lean towards the idea that Future Bias is rationally permissible, even if not strictly required by pure logic. The friend's claim that it is "arbitrary" is too strong. It has evolutionary and pragmatic grounds.

