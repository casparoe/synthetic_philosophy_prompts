          *   *Argument 3: Uncertainty.* The past is fixed; the future holds variance (even if small).
      *   *The Verdict:* The friend is logically consistent but pragmatically naive. The user is psychologically normal and pragmatically rational. The bias isn't "arbitrary" in a biological/functional sense, even if it is in a purely abstract logical sense.
      *   *Advice:* How to handle the anxiety? Acknowledge the bias but use the friend's logic to reduce suffering *now*.

