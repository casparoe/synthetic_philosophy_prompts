          2.  **Narrative Identity:** The "self" moves through time. Past pain is part of the story already written; future pain is a threat to the current trajectory.
          3.  **Uncertainty:** The future is probabilistic. The past is fixed. Even if the *expected* pain is the same, the *risk* profile differs.
          4.  **Parfit's Insight:** Parfit argued that Future Bias is actually rational *for the person experiencing it*, even if it looks irrational from a "view from nowhere."

