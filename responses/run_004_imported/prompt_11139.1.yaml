answer: |-
  GALILEO: Your Eminence, I do not seek to overturn the Faith. I seek to protect it from the embarrassment of being contradicted by the senses. Nature and Scripture are both words of God. One is written in the book of the world, the other in the book of the Bible. If they seem to clash, it is because we are misreading one of them.

  BELLARMINE: A pleasing symmetry, Sig. Galileo. But the books are not equal in their purpose. Scripture is the voice of God adapted to the capacity of the common man. When it says God has hands, or that He repents, we do not accuse Him of having limbs or changing His mind. We understand it as accommodation. But accommodation is not license to discard the text whenever a natural philosopher proposes a new model.

  GALILEO: Precisely. Augustine teaches us that if a claim about nature is fixed by sense experience and necessary demonstration, we must reinterpret the scriptural passage, not deny the demonstration. To do otherwise is to make our faith a mockery among the pagans who can see the earth moves.

  BELLARMINE: There is the hinge. You say "necessary demonstration." I have read your letters. You speak of the phases of Venus, of the moons of Jupiter, of the tides. These are observations. I grant you them. But do they constitute a demonstration that the earth *must* move? Or do they merely save the appearances? Ptolemy used epicycles to save the appearances. Tycho Brahe uses a moving sun around a stationary earth to save the same appearances you cite. Your moons show that not everything circles the earth; they do not prove the earth circles the sun.

  GALILEO: The phases of Venus forbid the Ptolemaic order. The tides arise from the double motion of the earth. These are not mere calculations to predict positions. They are physical effects requiring physical causes.

  BELLARMINE: Are they? Or are they another hypothesis, cleverer than the last? The Council of Trent is explicit. We cannot abandon the unanimous reading of the Fathers on a scriptural passage without genuine necessity. The Fathers are unanimous: the sun moves, the earth stands still. Joshua commanded the sun to stand still, not the earth. If you had a strict demonstration, Galileo, I would be with you. God is the author of truth, and truth cannot contradict truth. But you have probability. You have ingenuity. You do not have the necessity that forces us to risk the credibility of Scripture.

  GALILEO: And if we do not risk it, we lose it anyway! Suppose fifty years from now, instruments improve. Suppose the motion of the earth is demonstrated beyond all doubt. If the Church has bound itself to the literal reading of Joshua, what happens to the faith of the common man then? He will see the Church denied by the heavens themselves. Is it not safer to say, as Cardinal Baronius wrote, that the Holy Spirit's business is to teach how one goes to heaven, not how heaven goes?

  BELLARMINE: Baronius spoke of moral instruction, not natural philosophy. But let us press your point. You ask why the Fathers' agreement carries weight. It is because the Church is a pillar of truth. If the Fathers, guided by the Spirit, erred on a matter stated in Scripture, what guarantee do we have they did not err on salvation? You ask us to treat the motion of the earth as incidental. But it is written in the text of Revelation. To reinterpret it without necessity is to say the text was unclear. If it was unclear on this, why not on the Eucharist? Why not on the Resurrection?

  GALILEO: You conflate matters of faith with matters of sense. No one needs to know the earth moves to be saved. But everyone can see the sunspots. If you tie the credibility of the Resurrection to the stability of the earth, you are building a house on sand. I am trying to build it on rock. I am saying that the truth of nature is certain, and Scripture must be understood in light of that certainty.

  BELLARMINE: And I say certainty is yours to prove, not mine to assume. You speak of Augustine. Augustine also warned against Christians speaking nonsense about things they do not know, lest they bring the Faith into disrepute. At this moment, you do not know with certainty. You believe. You argue. But you cannot demonstrate. The tides you speak of—you have not mapped them perfectly. The parallax of the stars—you cannot show it. Without parallax, the universe must be infinitely large if you are right. That is philosophically absurd to many.

  GALILEO: Philosophical absurdity yields to observation! The universe is as God made it, not as Aristotle imagined.

  BELLARMINE: Then wait. If it is true, demonstrate it. Until then, prudence favors the traditional reading. You want me to reinterpret Scripture based on a hypothesis that might be replaced in ten years by another. If I concede now, and you are wrong, I have made Scripture a liar for the sake of a mathematical convenience.

  GALILEO: And if I am right, and you do not concede, you have made Scripture an enemy of truth. We are at an impasse, Eminence. You wait for a demonstration that you say is impossible to provide without admitting the conclusion first. I offer evidence that you dismiss as mere hypothesis because it contradicts the Fathers.

  BELLARMINE: It is not an impasse of logic, Sig. Galileo. It is an impasse of authority. You place the authority of sense and demonstration above the authority of the Church's tradition. I place the Church's tradition as the guardian of what counts as demonstration in matters touching Scripture.

  GALILEO: I place God's work above man's interpretation of God's word.

  BELLARMINE: And I say the Church is the steward of that word. You see the limit as scientific. I see it as theological. You ask where the disagreement stops being about astronomy. It stops where the text of Scripture begins. You wish to treat Joshua as poetry when it suits your system. I must treat it as revelation until you prove it cannot be literal.

  GALILEO: Then I must continue to look through the glass, and pray that the evidence becomes so loud that even poetry cannot drown it out.

  BELLARMINE: And I must continue to watch, and pray that you do not force us to choose between you and the Fathers before the time is ripe.

  GALILEO: The time is ripe now. The earth moves.

  BELLARMINE: Prove it. Then we shall speak of reinterpretation. Until then, speak hypothetically. For the sake of your soul, and for the sake of the Church.
