  so we've been doing a unit on the church-turing thesis in my philosophy of computer science seminar and its kind of messing with my head. our professor keeps hammering on the point that the thesis isnt a theorem thats been proven, its more like a claim about how a rigorous mathematical concept (turing computability) lines up with a fuzzy informal one (effective calculability, what a human or machine can compute "in principle"), and that different people over the decades have offered pretty different kinds of arguments for why we should believe it anyway. like theres turing's own argument analyzing what a person following an algorithm with pencil and paper is actually doing, theres the whole "lambda calculus AND general recursive functions AND turing machines AND post systems all turn out equivalent" confluence thing that Kleene and others liked to point to, theres gandy's 1980 argument that tries to extend turing's analysis from human computers to physical mechanisms in general using stuff like locality/no-action-at-a-distance constraints, theres the simple "nobody's found a counterexample in like 90 years" inductive argument, and then theres the more speculative "physical church-turing thesis" stuff people bring up re: hypercomputation, relativistic spacetimes, quantum computers etc. a few of us got into it after class about which of these actually matter vs which are just filler that textbooks repeat.

