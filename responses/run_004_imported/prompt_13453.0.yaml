answer: |-
  Here are nine interview questions tailored to your podcast, designed to pin down your guest's "equal standing" account without letting him retreat into abstractions.

  **1.** Let's start with the basic architecture of your view. You argue that hypocritical blame is problematic because the blamer claims a special exemption for themselves. But in ordinary conversation, when we accuse someone of hypocrisy, we usually think we're undermining the *truth* of what they're saying, not just their right to say it. Why should we separate the *message* from the *messenger* so cleanly?

  **2.** You've mentioned in past discussions that *tu quoque* arguments confuse the "logic of justification" with the "ethics of address." That distinction does a lot of heavy lifting for you. Can you explain what work "ethics of address" is actually doing here? Is it a moral rule, a social norm, or something else?

  **3.** **(The Standing vs. Truth Distinction)**
  I want to press you on the practical difference between losing standing and being wrong. Let's use a concrete case: Suppose I guilt-trip my mom about money, which is wrong. My sister does the exact same thing the next week. I call her out. She says, "You did it too." On your view, does her action become *less wrong* because I lack standing, or is the action just as bad but I'm the one who messed up the delivery?
  *   **Follow-up:** If the action is just as bad and the criticism is factually accurate, what is the practical prescription? Are you saying I ought to remain silent and let the behavior go unchallenged, or is there a way to blame her that doesn't violate standing?

  **4.** **(The "Everyone is a Hypocrite" Worry)**
  A common pushback is that almost everyone violates the norms they advocate for at some point. If standing requires that I haven't committed the same fault, aren't you setting a bar so high that almost nobody has standing to blame anybody for anything? Does your view lead to a kind of moral silence where we're all afraid to speak up?
  *   **Follow-up:** If you reply that the fault has to be "relevantly similar" or "recent" to negate standing, who gets to decide what counts as relevant? Doesn't that just push the problem back a step, allowing people to argue over whether their own hypocrisy counts?

  **5.** You focus heavily on the idea of claiming an *exemption*. But what about the "confessional hypocrite"—someone who says, "Look, I know I do this too, it's terrible, but you shouldn't do it either"? They aren't claiming an exemption; they're admitting they're a sinner. Do they retain standing to blame?
  *   **Follow-up:** If you say yes, admitting fault restores standing, then doesn't the "equal standing" account collapse into a rule about honesty? And if you say no, admitting fault *doesn't* help, then what exactly is the hypocrite doing wrong? Is it the act itself, or just the social dynamic?

  **6.** Let's go back to that distinction between justification and address. If I blame someone correctly (justification) but without standing (address), have I actually harmed them? Is the harm to the person being blamed, or is it a harm to the moral community at large?

  **7.** Your account implies that the primary function of blame is relational—it's about who has the right to speak to whom. But many philosophers think blame is about moral improvement or holding people accountable to values. If my sister stops guilt-tripping our mom because I called her out, does it really matter if I was a hypocrite? Isn't the good outcome what counts?

  **8.** **(The "Logic of Justification" Dodge)**
  You often deflect the *tu quoque* worry by saying it's a fact about the "logic of justification." But in real family dynamics, that distinction feels invisible. If the only result of losing standing is that the other person feels justified in ignoring me, isn't "standing" just a fancy word for "persuasive power"? Why call it a philosophical category if it functions like a rhetorical weakness?

  **9.** **(The Falsification Question)**
  Finally, I want to ask about the limits of your framework. What would it take for you to admit that the "standing" account is doing less philosophical work than you think? Is there a case of hypocritical blame that feels intuitively wrong, but where the blamer clearly had equal standing, or vice versa, that would force you to rethink the theory?
