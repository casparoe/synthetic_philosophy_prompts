answer: |-
  This is excellent. It's concise, historically grounded, and makes a genuine conceptual contribution by linking the *Methods* conclusion to the SPR biography in a way that feels inevitable once stated.

  Here is the gut check on your specific questions, followed by a few minor nitpicks.

  ### 1. Are you overselling the ethics-to-psychical-research link?
  **No.** You are actually hitting the current scholarly consensus. Bart Schultz's *Henry Sidgwick: Eye of the Universe* (2004)—which is the definitive modern biography—argues exactly this. He posits that Sidgwick's psychical research was not a Victorian hobby but a philosophical necessity. Sidgwick needed the "moral order of the universe" to be an empirical fact to resolve the Dualism of Practical Reason.

  Since he couldn't sign the 39 Articles (as you note), he couldn't access that postulate through theology. The SPR was his attempt to secure the *postulate of immortality* via science. You aren't inflating the claim; you are summarizing the most charitable and coherent reading of Sidgwick's life work. If anything, emphasizing this link makes your post *more* academically defensible, not less.

  ### 2. Does the "proto-rationalist-community" comparison hold up?
  **Yes, but with a tiny caveat.**
  The analogy is strong because the SPR was explicitly founded to investigate "debated questions" (mesmerism, spiritualism, telepathy) using evidence rather than tribal affiliation. They were trying to carve out a space for inquiry where the Royal Society feared tread and the spiritualists demanded belief without proof.

  For a rationalist audience, the "Bayesian-update" language will land well. The only risk is historical pedants pointing out that "Bayesian" is anachronistic.
  *   **Suggestion:** You might tweak "trying to Bayesian-update its way through" to "trying to apply something like Bayesian updating..." or "trying to weigh evidence on taboo claims without..." Just to signal you know it's an analogy, not a historical claim about their math. But honestly, for a forum shortform, your current phrasing is probably fine.

  ### 3. Is any of this flat wrong?
  **Fact-check looks solid.**
  *   *Methods* length/final chapter: Correct.
  *   Trinity Fellowship resignation (1869): Correct.
  *   SPR founding (1882) & Presidency: Correct.
  *   *Phantasms of the Living* / Census of Hallucinations: Correct.
  *   Hodgson/Blavatsky (1885): Correct. Hodgson's report on Blavatsky was a major credibility win for the SPR's rigor, even if it alienated theosophists.
  *   Deaths (Sidgwick 1900, Myers 1901) & Cross-Correspondences: Correct. The cross-correspondences are a fascinating footnote to add; they really do feel like a narrative capper.

  **One nuance to consider:**
  Sidgwick was often more privately convinced than publicly. There are letters where he suggests the evidence for telepathy/survival is stronger than he let on in public, because he feared damaging his philosophical reputation or the SPR's scientific standing. You don't *need* to add this, but keep in mind that his public "agnosticism" about the results might have been strategic, whereas his private need for the results to be true was existential.

  ### General Feedback & Verdict

  **Verdict: Post it.**
  This is exactly the kind of "intellectual history that matters" content that does well in rationalist/philosophy circles. It takes a dry meta-ethical problem (the Dualism) and shows the real-world, human stakes of it (a decades-long search for ghosts to save morality).

  **Two minor suggestions for the draft:**

  1.  **Clarify the "God vs. Survival" distinction:** In the second paragraph, you write: *"normal route to 'there is a moral governor and a future life' was closed to him... Psychical research reads like his attempt to get the same postulate in the back door."*
      Technically, Sidgwick needed the *future life* more than the *moral governor*. If the soul survives, there is infinite time for virtue and happiness to align, even without a specific deity enforcing it. The SPR was specifically hunting for *survival* evidence. You might tighten that sentence to emphasize **immortality/survival** as the specific empirical fact he needed to solve the Dualism.
  2.  **The "Defeat" framing:** In the first paragraph, you say he "admits defeat." Some Sidgwick scholars argue he didn't see it as defeat, but as a clear statement of the limits of intuitionism. However, "admits defeat" is punchier for a shortform and captures the mood of the final chapter well enough. I wouldn't change it, just noting that it's a stylistic choice.

  **Final thought:** The ending about the cross-correspondences is great. It adds a slightly eerie, narrative closure that fits the tone perfectly. Don't cut that.

  Go for it.
