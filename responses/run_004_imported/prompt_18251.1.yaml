answer: |-
  **The Hypocrite's Stand**

  **Setting:** *Walking out of the ethics lecture hall.*

  **Elena:** You're sticking with the "parents are right" take? Even when they're scrolling Instagram while screaming at you to study?

  **David:** I'm saying the advice survives the messenger. If screen time ruins your sleep, it ruins your sleep whether your dad is awake until 3 AM or not. The truth of the claim doesn't depend on his consistency.

  **Elena:** But blame isn't just stating facts, David. It's a relational act. When you blame someone, you're appealing to a shared standard. You're saying, "We both know this is wrong." The hypocrite undermines that. By violating the very norm they're enforcing, they're quietly claiming an exception for themselves. They're saying, "This rule applies to you, but not to me."

  **David:** So they're annoying. Maybe even unfair. But does that make the rule void? If a smoker tells me smoking kills, do I light up because they lack standing?

  **Elena:** You can acknowledge the health risk. But do they have the *standing to blame* you? No. Because blame assumes you're addressing someone as an equal within a moral community. When you exempt yourself, you step out of that community. You lose the authority to hold others accountable because you've refused to be held accountable yourself. The hypocrisy wipes out the standing.

  **David:** You're conflating the *legitimacy of the norm* with the *sincerity of the enforcer*. Look, hypocrisy makes them an insincere messenger, not an illegitimate one. The standing to blame shouldn't depend on the blamer's purity. It should depend on whether the blame is *correct*. If you did something wrong, you're liable to blame, regardless of who points it out.

  **Elena:** That reduces blame to a mere scorecard. "You committed error X." But blame carries a demand: "Don't do this." If I make that demand while exempting myself, the demand becomes coercive rather than reciprocal. It becomes power, not morality. My parents aren't inviting me to share a value; they're imposing a restriction they refuse to bear. That inequality corrodes the interaction.

  **David:** But if you say hypocrisy removes standing entirely, you let the hypocrite off the hook too easily. Say a corrupt politician argues for anti-corruption laws. By your logic, we should ignore him because he lacks standing. But maybe the law is still good! We should separate "Is the blame correct?" from "Does this person get to say it?" The norm survives the violation.

  **Elena:** The norm survives, yes. But the *transaction* of blame fails. You can still argue for the norm—"Screens are bad for sleep"—without blaming. But the moment you say, "You shouldn't do this," while doing it yourself, you're engaging in a kind of moral fraud. You're claiming a moral high ground you haven't occupied.

  **David:** I think you're demanding too much purity. We're all hypocrites sometimes. If standing vanished every time we slipped, moral community would collapse. Maybe hypocrisy just diminishes the *force* of the blame, makes it sting less. But it doesn't erase the standing. Otherwise, only saints could teach ethics.

  **Elena:** Maybe. But until they admit the hypocrisy—until they say, "I struggle with this too, but let's try"—they're not addressing me as an equal. They're addressing me as a subordinate. And that's not moral blame. That's just noise.

  **David:** Then I guess I'll keep listening to the noise, if it keeps me from failing my exams. Even if the speaker is flawed.

  **Elena:** Just don't call it morality. Call it management.
