answer: |-
  Two graduate students, Elena and Julian, are seated for a one-shot Prisoner's Dilemma as part of a seminar experiment. Both are known devotees of Hofstadter's concept of superrationality.

  Before marking their sheets, Elena leans over and whispers, "Julian, remember the logic. We're identical rational agents. Our decisions are logically correlated. If I cooperate, you *must* cooperate. So let's both take the 3 points."

  Julian nods solemnly, marks "Defect," and hands his sheet to the proctor.

  Elena is aghast. "You violated the symmetry! If we're identical, we make the same choice!"

  Julian replies, "We *would* have. But your whisper proved we aren't. A true superrationalist knows the correlation is logical, not causal. By trying to persuade me, you implied you think your words can causally influence my output. That means you're modeling me as an independent agent. You're playing Causal Decision Theory."

  He gathers his things. "And against a CDT agent, defection is dominant."
