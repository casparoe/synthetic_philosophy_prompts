      *   **Key Concept:** Epistemic Akrasia. Is it always irrational? Most say yes. But how to avoid it when HOE conflicts with FOE (First-Order Evidence)?
      *   **Key Concept:** The "Right Reason" vs. "Calibration." Naomi feels she has the "right reason" (the code works). Felix says she isn't calibrated (her process is biased).
      *   **Resolution:** Philosophers (like Sophie Horowitz, David Christensen, Adam Elga) debate this. There is no consensus. It is a genuine, unresolved tension. Naomi isn't making a *mistake* in logic, nor is Felix. They are adopting different epistemic policies.

