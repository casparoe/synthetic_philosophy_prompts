  The smoke in Café Hansen hung low, a gray ceiling over the clatter of cups. Outside, the new Constitution was still fresh ink, but inside, the air was thick with older tensions.

  "The press is the engine of this maturity," said Larsen, tapping his newspaper against the table. "For centuries, we were subjects. Now, through print, we become citizens. The Constitution gives us the right, but the newspaper gives us the voice."

  Niels, clutching a worn copy of *Two Ages*, shook his head. "It gives you a phantom voice. You speak of a people, but the press manufactures only a public. A people is concrete, bound by duty and place. A public is an abstraction, a monster where no one is accountable. When your paper attacks a man, who attacks him? The editor? The printer? No. It is 'the public.' It is leveling."

  "Leveling?" Larsen leaned forward. "You speak as if equality is a sin. We need this impersonality. How else does a man in Jutland know the concerns of Copenhagen? The state is too large for face-to-face trust. We need the abstraction to hold the polity together."

  "It holds nothing together," Niels countered. "It dissolves everything into reflection. We talk endlessly about what *should* be done, but no one acts. Passion is replaced by commentary. You call it maturity; I call it a passionless age where everyone is an inspector of life but no one lives it."

  Larsen smiled thinly. "A convenient critique for a theologian. But let us speak of your master. Kierkegaard decries the press as the instrument of leveling, yet look at the kiosks. *The Moment*. He prints his own broadsheet. He uses the very machine he condemns to shout his critique. Is that not hypocrisy? He needs the public to tell the public it does not exist."

  Niels stiffened. The smoke seemed to tighten around them. "You confuse the merchant with the martyr. When you publish, you seek influence within the system. You want readers to sustain the enterprise. When Søren publishes, it is an act of suffering. He does not seek to build a party or a circulation. He uses the press as a thorn."

  "A thorn that reaches the same abstract masses," Larsen pressed. "He cannot escape the medium. By printing, he validates the public."

  "He validates nothing," Niels said, his voice dropping. "He submits to the penalty of the age. When you write, you hide behind the newspaper's authority. When he writes, he stands alone before God. The difference is not in the ink, but in the authority. You claim to speak for the people. He claims only to speak as a single individual. The press makes everyone equal in noise. He uses that noise to show us the silence we have lost. He does not resort to the press to win; he resorts to it to be sacrificed. There is no contradiction in using the weapon of the enemy to reveal the enemy, provided you do not become the enemy."

  Larsen sat back, tracing the rim of his cup. "A fine distinction. But history will not measure your suffering, Niels. It will measure your reach. And for that, you need me."

  "Perhaps," Niels said, looking out at the street. "But reach is not salvation."
