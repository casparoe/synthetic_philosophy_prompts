answer: |-
  **The Whiteboard Debate**

  **Characters:**
  *   **ELIAS:** The Exclusionist. Sharp, impatient, chalk in hand.
  *   **SARAH:** The Non-Reductive Physicalist. Calm, marker in hand, trying to redraw the lines.

  **Setting:** A seminar room after hours. On the whiteboard, Jaegwon Kim's exclusion diagram is already drawn in fading chalk:
  *   Top row: **M** (Mental Cause) - - - > **M*** (Mental Effect)
  *   Bottom row: **P** (Physical Base) ——— > **P*** (Physical Base)
  *   Verticals: **M** ↓ **P** and **M*** ↓ **P*** (Supervenience)

  ***

  **ELIAS:** (Tapping the solid arrow between P and P*) This is the hammer, Sarah. Causal closure of the physical. Every physical event has a sufficient physical cause. If P is sufficient for P*, what work is left for M to do?

  **SARAH:** None, if you think causation is a bucket of stuff that gets used up. But P being sufficient doesn't mean M is idle. It just means M isn't *competing* with P.

  **ELIAS:** It's not competition; it's exclusion. Look at the vertical arrow. M supervenes on P. You can't have M without P. So when P pushes P* over, M is just along for the ride. A shadow on the wall doesn't push the objects casting it.

  **SARAH:** That's the "shadow" objection. It assumes the only real causation is bottom-up. But look at the top arrow. M causes M*. I raise my hand (M*) because I want to ask a question (M). My neural state (P) is just how that desire is implemented.

  **ELIAS:** Implemented, yes. Caused, no. Because if P is there, P* *must* follow. If P* follows, M* follows (because M* supervenes on P*). So M is causally redundant. Unless you want to say every action is systematically overdetermined? That your desire *and* your neurons both independently cause your hand to rise?

  **SARAH:** No overdetermination. That's why I need Yablo. (She circles M and P). You're treating P as the cause, but P is too specific. My desire to ask a question is a *determinable*. The specific neural firing pattern is a *determinate*.

  **ELIAS:** (Snorts) Proportionality. I know the move. "The neural state is too micro to be the real cause."

  **SARAH:** It's not about size, it's about counterfactual dependence. If I had a slightly different neural realization of the *same* desire, I'd still raise my hand. So the specific P isn't essential. The mental property M is the "right-sized" cause. It captures what matters across multiple physical realizations.

  **ELIAS:** (Wipes a section of the board aggressively) That's pragmatics, Sarah. That's about how *we* talk about causes, not what *does* the causing. The universe doesn't care about "right-sized." The physics is happening at the P level. The energy transfer, the synaptic weights, the muscle contractions. M is a label we paste on a cluster of P-states. You're confusing explanatory relevance with ontological causation.

  **SARAH:** But causation *is* about relevance! If I can't manipulate M to change M*, it's not a cause. And I can.

  **ELIAS:** Can you? Or are you manipulating P, which changes M?

  **SARAH:** Okay, fine. Let's get precise. List and Menzies. Interventionism. (She draws a new box next to the diagram). We define causation via structural equations. Does an intervention on M change M*? Yes. Therefore M causes M*. We don't need to reduce M to P to say that. They are distinct variables in the causal model.

  **ELIAS:** (Leans in, eyes narrowing) Here's where the model breaks. To test if M causes M*, you have to intervene on M while holding other relevant variables fixed. Right?

  **SARAH:** Standard ceteris paribus.

  **ELIAS:** But M supervenes on P. You cannot intervene on M without intervening on P. They aren't independent variables. If you try to "fix" P and vary M to see if M* still changes, you can't. Because if P is fixed, M is fixed.

  **SARAH:** We don't fix P. We just account for it in the graph.

  **ELIAS:** No, listen. If you run the intervention on M, you are *necessarily* dragging P along with it. So when M* changes, how do you know it wasn't P* changing because P changed? You haven't isolated M's causal power. You've just measured P's causal power again and given it a mental name.

  **SARAH:** (Pauses, marker hovering) The interventionist says we treat the supervenience relation as a constraint, not a causal path. We ask: "If M were different, would M* be different?" We don't worry about *how* M got different, just that it is.

  **ELIAS:** But physics *does* worry about how. If M is different, P *must* be different. So the counterfactual "If M were different..." implies "If P were different..." And we already know P causes P*. So you haven't found a new cause; you've just found a shadow that moves when the object moves.

  **SARAH:** But that makes mental causation epiphenomenal by fiat! If I say "The fragility of the glass caused it to break," and you say "No, the molecular lattice structure caused it," you're excluding the higher-level property. But fragility *is* real. It does work.

  **ELIAS:** Fragility is a disposition of the lattice. It's not an extra force. Look, Sarah, I'll grant you this: Interventionism works for special sciences *if* you ignore the metaphysics. It works for biology, economics, psychology. But it doesn't solve the exclusion problem; it sidesteps it. It says, "Within the model, M is a cause." I'm asking, "In the world, does M add any oomph to P?"

  **SARAH:** The "oomph" is the organization! P is just particles. M is the pattern. The pattern does the work because the pattern is what the system responds to.

  **ELIAS:** The system responds to the particles *arranged* in a pattern. The particles do the pushing. The pattern is... (He taps his temple) ...how we track the pushing.

  **SARAH:** (Sighs, caps the marker) So we're back to the illusion. Non-reductive physicalism is just a "useful fiction" to you.

  **ELIAS:** It's a useful framework. But don't tell me it's metaphysically robust. If P does all the work, and M is nothing over and above P, then M's causation is borrowed. It's derivative.

  **SARAH:** Borrowed from where? If M is distinct enough to be a variable in your interventionist account, it's distinct enough to be a cause.

  **ELIAS:** Distinct conceptually, not ontologically. (He points to the vertical arrow M ↓ P). As long as that arrow exists, the exclusion argument holds. You can't have it both ways. You can't say M depends on P for its existence but is independent of P for its causal power.

  **SARAH:** (Looks at the diagram, quiet for a moment) Maybe the arrow is the problem. Not the dependence, but the direction.

  **ELIAS:** (Smiles, a genuine, sharp smile) Now you're doing metaphysics. But until you cut that vertical arrow, M is excluded.

  **SARAH:** Or until you admit causation isn't about sufficiency.

  **ELIAS:** Then you're not talking about the physical world anymore.

  *(They stand there for a moment, the chalk dust settling between the M and the P.)*
