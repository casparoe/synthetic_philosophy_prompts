answer: |-
  The chalk snapped in Elias's hand. It was the third piece in an hour.

  He didn't notice. He was staring at the board, his hand hovering over the final line of the derivation. The office was dark, save for the green glow of the exit sign and the desk lamp illuminating the slate. Outside, a November rain blurred the Cambridge streetlights into streaks of amber and red.

  "It fits," he whispered. The words died in the cold room.

  He wasn't talking about consistency. Any graduate student could force variables to cancel out. He was talking about the *weight* of it. The equation describing the quantum spin interaction hadn't just been solved; it had been *uncovered*. It felt like brushing dust off a statue that had been standing in the dark for a million years. He hadn't chosen the symbols; they had refused to be anything else.

  "You're doing it again."

  Elias jumped. Sarah was leaning against the doorframe, holding two Styrofoam cups. She'd been working in the computational lab down the hall.

  "Doing what?" Elias asked, wiping chalk dust from his tweed jacket.

  "Talking to the ghosts." She walked in and set a cup on his desk. Black coffee, no sugar. She knew him too well. "You have that look. Like you just saw God's spreadsheet."

  Elias turned back to the board. "Look at the symmetry, Sarah. I was trying to model the decay rate, but the algebra kept rejecting the perturbation. It wasn't working. So I stopped trying to force it and just... followed the constraint. And this appeared."

  He gestured to the board. A complex manifold structure sprawled across the slate, elegant and severe.

  "It's beautiful," Sarah admitted, stepping closer. She traced a line in the air, not touching the chalk. "But it's just a model, Eli. It's a map. You're treating it like the territory."

  "It's not a map," Elias said, his voice tight. "Maps are arbitrary. You can draw a coastline differently depending on the scale. This? This is rigid. If I change a sign here, the whole thing collapses. It resists me. I can't invent something that resists me. I can only find something that's already there."

  Sarah took a sip of her coffee. "You're a neurobiologist's nightmare, you know that?"

  "Here we go."

  "I'm serious. You're a physical organism. Your brain is a lump of meat running on electrochemical signals. Causal interactions. Neurons firing because other neurons fired." She tapped the chalkboard with a fingernail. *Click, click, click.* "These things? Numbers, sets, manifolds? They don't have location. They don't have time. They don't push on atoms. They are causally inert."

  "So?"

  "So, how did they get in there?" She pointed at his temple. "If mathematical objects are outside space and time, they can't send light waves to your eyes. They can't send sound waves to your ears. They can't bump into your neurons. There is no causal bridge between the realm of abstract objects and the lump of meat in your skull. By your own definition, knowledge of them should be impossible."

  Elias rubbed his face. He'd heard this before, usually in faculty seminars, but here, in the quiet rain, it felt like an accusation.

  "I'm looking at it, Sarah. I know it."

  "You know the syntax," she corrected. "You know the rules of the game we invented. You're feeling the click of internal consistency. That's not discovery; that's coherence. It's like saying you 'discovered' that a knight moves in an L-shape in chess. No, we decided that. The knight doesn't exist outside the rules."

  "The knight is arbitrary," Elias snapped. "This isn't. If we met an alien civilization, they wouldn't play chess. But they would have this." He slapped the board. "Prime numbers would still be prime. This structure would still hold. It doesn't care about us. It doesn't care if humans exist. That's why it feels... heavy."

  "That feeling is evolution," Sarah said softly. "We evolved in a physical universe. Brains that could model physical regularities survived. We project that utility onto the math and call it 'truth.' It's a useful fiction. A story that lets us build bridges and split atoms. But don't confuse the utility with ontology."

  Elias turned away from her. He looked at the equation. It seemed to hum.

  "If it's a fiction," Elias said, "why does it surprise me? I didn't know this solution was here. I walked into the room expecting one thing, and the math gave me another. If I'm the author, why am I surprised by the ending?"

  "Because your brain is a prediction engine running faster than your conscious mind," Sarah countered. "You did the work subconsciously. The surprise is just the handoff from unconscious processing to conscious awareness. It's a parlor trick your mind plays on you to prioritize new information."

  "It feels like memory," Elias said. "Not invention. Like remembering a face I haven't seen in years."

  "That's the danger, Eli." Sarah moved to his side, her voice dropping. "That's the Platonist trap. It feels like revelation, so you assume there's a revealer. But if you're right... if those things are really out there, in some abstract realm..." She paused, looking at the chalk dust on his fingers. "Then tell me. How do you touch them?"

  Elias fell silent. The rain hammered the window.

  He wanted to say *intuition*. He wanted to say *reason*. But those were just words for the mechanism he couldn't explain. If the objects were truly abstract, truly outside the causal chain, then his belief in them was a cosmic accident. A miracle. The probability of a physical brain aligning perfectly with a non-physical truth, with no causal link to guide it, was zero.

  And yet.

  He looked at the board. The elegance of it offended the idea of chaos. It was too ordered to be noise.

  "I don't know how I touch them," Elias said finally. "I just know I can't move them."

  Sarah sighed, the fight draining out of her. She knew she couldn't logic him out of a feeling. She'd seen this look in the eyes of religious mystics and quantum physicists alike.

  "Finish your coffee," she said. "It's getting cold."

  She turned to leave, her hand on the light switch.

  "Sarah?"

  She stopped.

  "If it's just a game," Elias asked, staring at the symbols that seemed to glow in the lamplight. "If we made it up... why does it feel like it's watching us back?"

  Sarah stood in the doorway for a long moment. The hallway light cut a sharp rectangle across the floor, stopping just short of the chalkboard.

  "Maybe," she said, her voice barely audible over the rain, "we're just very good at building mirrors."

  She flipped the switch. The office went dark, save for the exit sign's green haze. The equation vanished into the black, but Elias knew it was still there. Waiting. Or perhaps, just persisting.

  He stood in the dark, listening to the rain, unable to shake the feeling that the silence in the room wasn't empty, but full.
