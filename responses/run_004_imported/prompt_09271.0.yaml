answer: |-
  Friends, family, and colleagues.

  For thirty years, I was a chemist, and she was a physicist. In that time, we learned that while we studied different scales of matter, we shared a single devotion: to the way things actually are, rather than the way we might wish them to be. That devotion was the bedrock of our friendship. It was also the defining feature of her career.

  Many of you here know her work better than I do. You know the long hours in the laboratory, the alignment of optics, the struggle against noise, and the historic weight of the loophole-free experiments of the 2010s to which she contributed. But for those of you who are family, who know her best through her laughter and her kindness, you may have heard stories about what she did that sound like science fiction. You may have heard that she proved everything in the universe is secretly connected, or that she found a way for information to travel faster than light.

  She would have asked me to tell you, gently but firmly, that those stories are not true. She had no patience for mystical gloss. She did not believe her work licensed telepathy, nor did it suggest that consciousness creates the physical world. She corrected those errors at dinner parties for three decades, not to be difficult, but because she believed that truth is a form of respect. To misdescribe the world is to disrespect the world.

  So, I stand here to honor a specific request she made of me a few weeks before she died. She asked that I state exactly what her life's work demonstrated, with no more and no less than the strict truth.

  She spent her career testing a specific hope held by Einstein: that the universe is "local," meaning nothing influences anything else faster than the speed of light, and "real," meaning that objects possess definite properties even when no one is measuring them. Her experiments, and those of her colleagues, showed that nature does not allow us to keep both of those assumptions.

  Therefore, the fact I must state is this: The world cannot be both local and "real" in the sense that she and Einstein once hoped it was, even though nothing in her results permits a signal to outrun light.

  To her colleagues: I know the interpretative weight of that sentence. I know it leaves the choice of which premise to relinquish to one's preferred formulation of quantum mechanics. I know it asserts a violation of Bell's inequality without invoking superluminal signaling. I believe she would find this phrasing acceptable.

  To her family: I know this sounds abstract. But the human meaning of it is profound. It means that the universe is stranger than our common sense suggests, but it is not lawless. It means that we cannot assume we know the state of things before we look, yet we remain bound by the speed of light. It means that mystery remains, but it is a precise mystery, bounded by rigor.

  She taught me that clarity is not cold; it is the warmest thing we can offer one another. In a world that often prefers comforting illusions to difficult truths, she chose the truth. She chose to know, and to know exactly. That integrity is her legacy to us.

  We do not honor her by pretending the universe is simpler than it is. We honor her by facing the complexity with the same courage she brought to the laboratory. We honor her by being precise in our love, and rigorous in our grief.

  She has finished her measurements. The data is recorded. And for those of us who knew her, the correlation is undeniable: we are better for having shared a timeline with her.

  Rest in peace.
