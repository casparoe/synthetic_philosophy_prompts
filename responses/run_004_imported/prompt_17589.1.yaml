          *   Character B: Defends Cognitive Penetration (Siegel style).
      *   **Specific Case:** Dennis Proffitt's "embodied perception" studies (hills look steeper when tired/burdened) vs. Frank Durgin's rebuttal (demand characteristics/verbal vs. non-verbal measures).
      *   **Key Conflict:** The epistemological stakes (neutral check on belief) and the methodological problem (distinguishing perception from judgment).
      *   **Tone:** Philosophical dialogue, rigorous, responsive, not just restating positions.

  2.  **Character Conception:**
      *   **Character A (Impermeable):** Let's call him *Marcus*. He values the distinction between seeing and thinking. He worries about the "epistemic role" of perception. If perception is biased, how do we correct beliefs? He leans on Durgin's critique.
      *   **Character B (Penetrable):** Let's call her *Elena*. She values the holistic nature of the mind. She argues that ignoring top-down effects ignores the function of perception (action-guidance). She leans on Proffitt's original intuition but acknowledges the methodological hurdles.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. A quiet office or conference hallway. Establish the core disagreement immediately.
