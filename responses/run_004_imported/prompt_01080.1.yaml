      *   **The Classmate's Argument:** "If scientists can't agree on what a species *is*, the lines are arbitrary. Therefore, evolution isn't discovering real categories, it's just a story we fit onto messy data."
      *   **The Teacher's Reaction:** Dismissive ("good question, moving on").
