answer: |-
  This is an incredibly sharp observation, and you've hit on a tension that a lot of people miss when they first dive into the EA literature. You are absolutely right to flag the difference between **epistemic uncertainty** (I don't know which theory is true) and **Sidgwick's Dualism** (I am convinced *both* are true, but they contradict).

  If you transported Henry Sidgwick from 1874 to a modern Effective Altruism strategy session and showed him the "Moral Parliament" model, my bet is on him being **politely disappointed, rather than relieved.**

  Here is why your intuition about Sidgwick's "scientific" view of ethics is spot on, and why the Moral Parliament would feel like a category error to him.

  ### 1. The "Credence" Problem (You nailed this)
  You identified the biggest logical hurdle: Sidgwick didn't assign probabilities to his theories. In modern moral uncertainty (like the MacAskill/Bostrom framework), you might say, "I'm 60% credence in Utilitarianism, 40% in Deontology." Those percentages sum to 100% because you assume only one theory can ultimately be the "True" one.

  Sidgwick's despair came from the fact that he thought **both** Rational Egoism and Rational Benevolence (Utilitarianism) were self-evident axioms of reason. He didn't think, "Maybe egoism is false." He thought, "Reason commands me to seek my own good, and Reason *also* commands me to seek the universal good."

  When those two goods align, great. When they conflict (and he thought they often would without God to punish/reward us), Reason is at war with itself. You can't put that into a parliament where parties negotiate. If two parties both claim 100% legitimate authority over the same territory, a vote doesn't solve the constitutional crisis. Sidgwick wanted to resolve the contradiction, not manage it.

  ### 2. Ethics as Science vs. Ethics as Politics
  Sidgwick was obsessed with making ethics "scientific." By that, he didn't mean lab coats; he meant **coherence and convergence.** He wanted ethics to be like mathematics or Newtonian physics: a system where you start with self-evident axioms and derive conclusions that don't contradict each other.

  The Moral Parliament model is inherently **political**, not scientific. It treats ethical theories like interest groups or coalition partners. It says, "Since we can't prove who is right, let's compromise."

  To Sidgwick, this would look like giving up on the project of finding Truth. Imagine showing a physicist who is struggling to unify Gravity and Quantum Mechanics a model that says, "Well, just let Gravity decide 50% of the time and Quantum Mechanics decide the other 50%." The physicist would say, "No, one of them is wrong, or there is a deeper theory underlying both. I need the Unified Field Theory, not a schedule."

  Sidgwick was looking for the Unified Field Theory of Morals. Moral Uncertainty is an admission that we might never find it.

  ### 3. The Theological Escape Hatch
  It's important to remember *how* Sidgwick hoped to solve the Dualism. He didn't think a voting system would do it. He thought the only way to reconcile Egoism and Utilitarianism was if the universe was structured such that doing the right thing always led to your own happiness in the long run.

  Since that clearly doesn't happen in *this* life (virtuous people suffer, villains prosper), Sidgwick famously concluded that the Dualism could only be resolved if there was a God who ensured cosmic justice in an afterlife.

  The Moral Parliament model is secular and pragmatic. It doesn't require God; it just requires hedging. Sidgwick would likely see this as "esoteric morality" (which he actually advocated for in practice!), but he wouldn't see it as solving the *philosophical* problem that kept him up at night.

  ### 4. Where He Might Nod in Agreement
  That said, Sidgwick was a pragmatist in his personal life. He was a key figure in founding Newnham College (for women's education) and was involved in psychical research. He understood that while philosophers search for truth, humans have to act *now*.

  He might appreciate Moral Uncertainty as a **decision theory** tool, even if he rejected it as a **meta-ethical** solution. He would likely say:
  > "This parliament does not tell me what is *True*, but it might tell me what is *Rational to do* given my cognitive limitations. However, do not mistake this compromise for a resolution of the Dualism."

  ### The Verdict
  You're right that "credence" is the wrong frame for Sidgwick. He wasn't uncertain; he was **tragic.**

  The EA community treats Sidgwick as a patron saint because he was the first to really systematize Utilitarianism and ask the hard questions about how to maximize good. But EA is largely optimistic: it assumes we can figure out the best cause, the best charity, and the best ethical framework if we try hard enough.

  Sidgwick ended *The Methods of Ethics* with a whisper of despair because he thought he *had* tried hard enough, and Reason itself was broken.

  If you showed him the Moral Parliament, he'd probably sigh and say, **"It is a clever mechanism for action, but it leaves the fundamental contradiction of Reason untouched. I wanted to know what I ought to do because it is True, not because it won the coalition vote."**

  It's a fascinating rabbit hole you've fallen down. The transition from "How do I do the most good?" to "What if I don't know what 'good' actually is?" is where EA gets really philosophically spicy. Keep reading Sidgwick; he's arguably deeper than the modern EAs give him credit for.
