      *   Avoid jargon where possible, or explain it (e.g., meta-ethics, epistemic vs. ontological).

  6.  **Self-Correction/Fact Check during drafting:**
      *   *Did Bostrom start Moral Parliament?* It's often attributed to Nick Bostrom (2009 paper "Moral Uncertainty"), but William MacAskill developed it significantly in his thesis/book. I should acknowledge Bostrom but maybe mention MacAskill since the user mentioned 80k Hours (MacAskill is a co-founder).
      *   *Sidgwick's Despair:* Make sure to characterize it correctly. It wasn't just "I don't know," it was "Reason is divided against itself."
      *   *Egoism:* Clarify that Sidgwick meant *Rational* Egoism (it is rational to pursue own good), not psychological egoism.

  7.  **Final Polish:**
