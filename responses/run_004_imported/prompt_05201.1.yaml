      *   **The Twist (The Coda):** Despite the logical proof, lived experience confirms time. "I am the river, the tiger, the fire." Idealism fails to capture the *feeling* of duration.
      *   **Key Metaphysical Stance:** Idealism / Phenomenalism. Time is denied because the *entities* required to sustain it (matter, self) are fictions. It's an ontological denial based on epistemology.

  3.  **Deconstruct the Physicist's Argument (Block Universe/Eternalism):**
