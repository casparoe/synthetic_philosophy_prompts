answer: |-
  This is a fantastic real-world case study for an ethics seminar. It cuts right to the heart of the tension between **consequentialism** (outcomes/harm) and **deontology** (duty/rules), while adding the complex layer of **special obligations** (friendship).

  The reason your friend's line—"a promise is a promise"—bugs you is that it appeals to a deontological intuition: that the act of breaking a promise is inherently wrong, regardless of the consequences. But your intuition that "no one is getting hurt" is consequentialist.

  Here is a breakdown of how to analyze this ethically, which might help you structure your thoughts for your seminar.

  ### 1. The Deontological View: The Nature of the Promise
  Your friend is arguing from a position similar to Immanuel Kant. In this view, a promise is not just a prediction of future behavior; it is a **speech act that creates an obligation.**

  *   **The Normative Bond:** When you promised, you gave your friend a "right" to expect your labor. By breaking it, you are unilaterally revoking a right you granted them.
  *   **The Categorical Imperative:** Kant would ask: *Can I universalize the maxim "I will break promises when something better comes along"?* If everyone did that, the institution of promising would collapse because no one would trust promises anymore.
  *   **Respect for Persons:** By breaking the promise for personal gain, you might be treating your friend as a "means" (a backup plan) rather than an "end" (someone deserving of fidelity).

  **Why this feels true to you:** Even if she finds a replacement, the *trust* is the commodity that was damaged, not just the labor.

  ### 2. The Consequentialist View: The Calculation of Harm
  Your intuition relies on Utilitarianism. You are weighing the net good.

  *   **The Calculation:**
      *   **Option A (Keep Promise):** You work unpaid (financial loss/lost opportunity), Friend gets reliable help (gain), Professor loses your help (loss).
      *   **Option B (Break Promise):** You get paid/experience (gain), Friend gets annoyed but finds replacement (neutral/slight loss), Professor gets your help (gain).
  *   **The "Harm" Dispute:** You say "no one is really getting hurt." Your friend disagrees.
      *   **Logistical Harm:** She has to spend time recruiting someone new.
      *   **Psychological Harm:** She feels devalued.
      *   **Relational Harm:** The friendship dynamic shifts from "reliable" to "transactional."
  *   **Rule Utilitarianism:** Even a utilitarian might argue that we should follow the rule "keep promises" because, in the long run, a society where people keep promises produces more happiness than one where people calculate harm every time.

  ### 3. Virtue Ethics: Integrity and Friendship
  Aristotle wouldn't ask "What is the rule?" or "What is the outcome?" He would ask: **"What would a virtuous friend do?"**

  *   **Integrity:** Integrity is about wholeness—your words matching your actions. Breaking the promise creates a fracture in your own character.
  *   **Friendship:** Friendships involve special duties that strangers don't have. There is an expectation of loyalty.
  *   **The Counter-Argument:** However, virtue ethics also values *flourishing*. Is it virtuous to sacrifice your own professional development and financial stability for an unpaid role when a paid one is available? Is the friend being virtuous by demanding unpaid labor when she knows you could be paid elsewhere?

  ### 4. The "Implicit Conditions" of Promises
  This is a crucial nuance for your seminar. Philosophers like T.M. Scanlon argue that promises are based on mutual understanding.

  *   **Was the promise conditional?** Most promises have implicit "escape clauses."
      *   *Example:* "I promise to drive you to the airport... unless my car breaks down."
      *   *Your Case:* Did you promise "unless I get a paid opportunity in my field"?
  *   **Change in Circumstances:** When you made the promise, you had "nothing else lined up." Now you do. The context has shifted materially. Is a promise binding if the fundamental assumptions under which it was made change?

  ### 5. Why the "No Harm" Argument Might Be Flawed
  You mentioned: *"Honestly my friend could find someone else to fill in pretty easily."*

  Be careful here. This assumes the value of the promise was **only** the labor.
  *   **Reliance:** She may have turned down other candidates because she relied on you.
  *   **Symbolism:** To her, the promise was a symbol of your commitment to *her* and her research. Taking the paid job signals that you value money/prestige over her project.
  *   **The "Better Option" Problem:** If "something better coming along" is a valid excuse to break a promise, then promises only hold when they are inconvenient. That makes the promise meaningless.

  ### How to Resolve This (Ethically)
  You don't have to choose one side, but you do need to address the moral residue.

  1.  **Acknowledge the Wrong:** Even if you take the paid job, admit that you are breaking a commitment. Don't gaslight her by saying "it's no big deal." To her, it *is* a big deal.
  2.  **Mitigate the Harm:** actively help her find a replacement. Make the transition seamless.
  3.  **Re-evaluate the Economic Justice:** Is it ethical for a friend to expect *unpaid* labor when you have a chance for *paid* labor in the same field? There is a justice argument here: you should not be expected to sacrifice your economic well-being for a friend's project if you don't have to.
  4.  **Communicate the "Why":** Explain that this isn't just about "something better," but about your career trajectory and financial needs.

  ### Questions for Your Seminar
  Since you are covering this in class, here are three discussion points you could raise:

  1.  **The Scope of "Harm":** Does moral obligation depend on tangible harm (logistics), or does the violation of expectation constitute harm in itself?
  2.  **Implicit Clauses:** Do all promises contain an implicit "unless life changes significantly" clause, or does that undermine the definition of a promise?
  3.  **Friendship vs. Contract:** Does the fact that this is a friend make the obligation *stronger* (loyalty) or *weaker* (friends should want the best for each other, even if it means breaking the plan)?

  **The Verdict?**
  Your friend is right that promises have intrinsic weight independent of consequences. However, you are right that circumstances matter. The ethical failure isn't necessarily taking the paid job (you have a duty to your own future, too); the failure would be dismissing her feelings or pretending the promise didn't matter.

  You can break the promise, but you cannot break the *obligation to make it right.*
