prompt: |-
  Ok so this actually happened to me and I can't stop turning it over, especially since we're covering promising this week in my ethics seminar. Back in the fall I promised my friend I'd be her unpaid research assistant this summer, back when I had literally nothing else lined up. Now a professor I really admire has offered me a paid RA spot for the exact same summer, and honestly my friend could find someone else to fill in pretty easily, its not like shes stuck without options. She said "a promise is a promise, you don't get to back out just because something better came along," and even though no one's really getting hurt if I switch, that line is bugging me because it feels true anyway. Is she right, and if so, why does the obligation still hold even when breaking it wouldn't really harm anyone? I'm kinda stuck on how to even think about this one.
