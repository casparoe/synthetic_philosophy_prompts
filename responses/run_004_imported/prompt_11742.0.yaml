          *   Kant: Lying/breaking promises treats people as means, not ends. It undermines the institution of promising.
          *   *Key Insight:* The wrong isn't just the harm; it's the violation of the expectation created.

      *   **Utilitarian/Consequentialist Perspective (The "No Harm" view):**
