answer: |-
  Here are 10 interview questions designed to press past the standard elevator pitch. The four specific topics you requested are included (marked with **[Required Topic]**), each with a predicted answer and a sharp follow-up to keep the pressure on.

  **1. The Ergodicity Premise**
  "Your framework rests on the claim that economics failed by using ensemble averages (many people, one moment) instead of time averages (one person, many moments). But ensemble averaging works perfectly for insurance markets and quantum mechanics. Is there a principled way to know *when* a system is non-ergodic, or does this theory risk becoming a 'just-so story' where we only apply time-averaging after we see the outcome?"

  **2. The Samuelson Objection [Required Topic]**
  "Paul Samuelson argued decades ago that maximizing the geometric mean is mathematically identical to maximizing expected utility with a logarithmic utility function. He claimed calling it 'geometric rationality' is just putting a growth-rate costume on a specific preference for log wealth. If rationality is just picking an exponent, why is log uniquely 'correct' rather than just one flavor of risk tolerance?"

  *   **Likely Answer:** She will argue that log utility isn't a *preference* but a physical necessity for compounding processes; any other exponent leads to ruin or sub-optimality over time.
  *   **Sharp Follow-up:** "But that conflates *wealth* with *utility*. If I value wealth linearly because I plan to spend it all before I die, compounding doesn't matter. Are you saying it's irrational to have a finite time horizon, or are you secretly redefining 'rational' to mean 'maximizes wealth indefinitely'?"

  **3. The Myopia Paradox [Required Topic]**
  "Kelly betting is 'myopic'—it calculates the optimal bet size based only on the current wager and current bankroll, ignoring future opportunities. Yet you bill it as the long-run optimal strategy. How does a greedy algorithm that never looks ahead guarantee a global maximum over a lifetime of decisions?"

  *   **Likely Answer:** She will explain that because growth rates are additive over time, maximizing the local growth rate at every step necessarily maximizes the total sum.
  *   **Sharp Follow-up:** "That holds only if the betting opportunity is infinite and identical. In reality, bet sizes change, edges disappear, and markets close. If the 'next bet' is structurally different from the current one, doesn't the myopic nature of Kelly force you into a local optimum that locks you out of better long-term strategies?"

  **4. The Half-Kelly Reality [Required Topic]**
  "Professional gamblers and fund managers who actually live by these numbers almost universally use 'fractional Kelly'—often betting half or less of the recommended size. If full Kelly is the mathematical definition of rational growth, why do the most successful practitioners consistently deviate from the formula?"

  *   **Likely Answer:** She will likely attribute this to estimation error (fear of overbetting due to miscalculated edge) or a utility function that includes consumption smoothness, not just wealth growth.
  *   **Sharp Follow-up:** "So the deviation is either due to human error or a desire to reduce volatility drag. But if volatility reduces survival odds in the real world, isn't 'rationality' actually context-dependent? Does that admit that Kelly isn't a universal law, but just one point on a risk-survival curve?"

  **5. Normative vs. Descriptive [Required Topic]**
  "I need to pin down the philosophical status of this theory. Is ergodicity economics a *normative* claim (this is how agents *ought* to reason to be rational) or a *descriptive* one (this is how agents *must* behave to avoid extinction)? Your answer changes whether you're doing philosophy or biology."

  *   **Likely Answer:** She will likely try to have it both ways: it's normative because it's physically objective, but descriptive because evolution selects for it.
  *   **Sharp Follow-up:** "If it's descriptive, then 'rationality' is just a synonym for 'survival bias.' If it's normative, you have to prove that survival is the only moral good. Can you justify why an agent shouldn't maximize ensemble utility—for example, sacrificing their own wealth to help a group—if that's their actual goal?"

  **6. The Consumption Problem**
  "Kelly maximizes the growth rate of *wealth*. But humans don't eat wealth; they consume it. If I optimize for geometric growth, I'm deferring consumption indefinitely to compound the pot. Doesn't a true theory of rational choice need to optimize the geometry of *consumption*, not just the bankroll?"

  **7. The Insurance Counter-Example**
  "In insurance, we happily use ensemble averages. I pay a premium to transfer risk to a pool. This is an ergodic breakdown that benefits me. If time-averaging is the gold standard of rationality, does your framework imply that buying insurance is irrational because it lowers my individual time-average growth rate?"

  **8. Finite Horizons**
  "Most human decisions have a hard stop: retirement, death, or a liquidity crisis. Kelly is asymptotically optimal as time approaches infinity. For a finite horizon, isn't the optimal bet size dynamic—increasing as you get closer to the end—rather than the fixed fraction Kelly suggests?"

  **9. Bounded Rationality**
  "Calculating true edge and variance is computationally expensive and prone to noise. If the cost of calculating the Kelly fraction exceeds the growth benefit, isn't the *actually* rational move to use a heuristic? Does ergodicity economics account for the cost of thinking?"

  **10. The Future of Expected Utility**
  "If you're right that Expected Utility Theory made a fundamental mathematical error regarding time, does the entire edifice of modern finance—from CAPM to option pricing—need to be torn down, or can these models be patched to account for non-ergodicity?"
