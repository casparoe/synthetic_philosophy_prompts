      *   **The Debate:** Dana vs. Marcus.
      *   **Dana's Position:** Higher-Order Thought (HOT) theory leaning. Consciousness requires awareness *of* the mental state. No memory/reportability implies no consciousness during the event.
      *   **Marcus's Position:** First-Order (FOR) theory leaning. Forgetting $\neq$ non-experience. Explicit self-monitoring isn't required for consciousness.
      *   **Task:** Analyze the exchange move-by-move, determining who has the better of it at each stage. Specifically address Dana's final retreat and whether the dispute is merely verbal/conceptual or a genuine philosophical fault line.
