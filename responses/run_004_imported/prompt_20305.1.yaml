      *   **Move 4: Marcus's Reductio (The Animal/Ordinary Life Argument).**
          *   *Claim:* If explicit registration is required, most human life and all animal life is unconscious. Absurd conclusion.
          *   *Theory:* Phenomenal Consciousness (what it's like).
          *   *Strengths:* Highlights the high cost of Dana's view. Points out that "flow states" or habitual actions feel conscious even without meta-commentary.
