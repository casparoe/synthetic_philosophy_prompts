answer: |-
  First, please accept my condolences on the loss of your great-aunt. It is profound to uncover a hidden history like that in the midst of grief, and it makes perfect sense that it would spark a intense debate, especially among family members who care deeply about moral reasoning.

  This is actually a famous knot in political theology. Your uncle and cousin are arguing over a tension that exists right in the heart of Aquinas's own writing, specifically in *De Regno* (On Kingship) and the *Summa Theologiae*. Neither of them is inventing arguments; they are pulling on two different threads of the same tapestry.

  Here is a breakdown of who has the stronger Thomistic footing at each step, followed by the crucial element they are both missing.

  ### Round 1: Private Citizens vs. Public Authority
  **Mark's Claim:** Aquinas forbids private citizens from killing tyrants; it requires public authority.
  **Elena's Claim:** (Implicitly) The resistance cell acted as a legitimate authority.
  **Verdict:** **Mark is textually correct.**

  In *De Regno* (Book I, Chapter 6), Aquinas is explicit: "To proceed against the cruelty of tyrants is an act to be initiated not by private presumption, but by public authority." He argues that if private individuals take this on themselves, it sets a dangerous precedent where anyone who dislikes a ruler kills them, leading to greater instability. He explicitly rejects the idea that a private citizen can simply decide a ruler is tyrannical and execute them. For Aquinas, the "sword" belongs to the community or a higher authority (like the Emperor judging a local king), not a "few guys in a barn."

  ### Round 2: Tyrant by Exercise vs. Tyrant by Defect (Usurper)
  **Elena's Claim:** There is a difference between a legitimate ruler who becomes bad and a ruler who never had a right to rule (usurper). Occupiers are usurpers.
  **Verdict:** **Elena is textually correct.**

  Aquinas does make this distinction. He distinguishes between the *tyrannus ex exercitio* (legitimate title, bad rule) and the *tyrannus ex defectu tituli* (usurper with no title). Regarding the usurper, Aquinas writes: "Whoever can kill him is to be praised and rewarded." His logic is that since the usurper has no legitimate claim, killing him is not "sedition" (which is disturbing a legitimate unity). Elena is right that Aquinas is much more permissive here. If the Nazi administrator had no legitimate title over Belgium, he falls into this category.

  ### Round 3: Foreign Occupier vs. Internal Usurper
  **Mark's Claim:** "Usurper" means an internal coup, not foreign occupation. Foreign occupation is a Just War issue, not a tyrannicide issue.
  **Elena's Claim:** The logic (no title = no sedition) applies even better to foreign occupiers.
  **Verdict:** **Elena has the stronger philosophical case, though Mark is right on the category shift.**

  Mark is trying to box Aquinas into a 13th-century feudal context where "usurpation" usually meant a duke seizing a king's throne. However, Thomistic logic is based on *legitimacy of title*, not nationality. A foreign occupier imposed by force has even *less* claim to legitimacy than an internal coup leader. Elena is right that the underlying principle (lack of consent/title) applies. However, Mark is correct that this bleeds into *Jus ad Bellum* (Just War theory), which complicates things because resistance becomes an act of war rather than domestic law enforcement. But on the specific question of "Is this sedition?", Elena wins: resisting a usurper is not sedition.

  ### Round 4: The Consequentialist Veto (Disorder vs. Prevention)
  **Mark's Claim:** Even if he is a usurper, if killing him causes more harm (reprisals) than it prevents, it is unjustified.
  **Verdict:** **Mark wins the debate here.**

  This is the trump card in Aquinas's political thought. Even in *De Regno*, after saying a usurper can be killed, Aquinas immediately pivots to the **Common Good**. He warns that if killing the tyrant puts the community at risk of "greater perils" (e.g., the tyrant's allies crush the population, or a worse tyrant takes over), it should not be done.

  Aquinas is not a deontologist; he is a teleologist. The moral act is judged by its end (the Common Good). If the resistance cell knew (or should have known) that the Nazis would respond by executing 50 civilians for every administrator killed—a standard Nazi reprisal policy in Belgium—then the act fails the Thomistic test. It trades one injustice for a greater disorder. Mark is right that Aquinas would likely view the *prudence* of the act as fatally flawed, regardless of the *justice* of the cause.

  ---

  ### What They Are Both Steamrolling Past

  While Mark and Elena are fighting over the *mechanics* of Aquinas's rules, they are both missing the **teleological foundation** and the **historical development** of the tradition.

  **1. The "Public Authority" Problem in Occupation**
  Aquinas assumes a functioning polity. He says you need "public authority" to kill a tyrant. But in occupied Belgium, the legitimate public authority (the Belgian government) was in exile or dissolved.
  *   **What they miss:** Later Scholastics (like Francisco Suárez and Juan de Mariana, writing 300 years after Aquinas) realized this gap. They argued that in the absence of a king, **authority reverts to the commonwealth itself.** The "public authority" can be the resistance cell *if* they are acting as the de facto voice of the community.
  *   **The Verdict:** Elena is closer to the *developed* Thomistic tradition (Scholasticism), while Mark is closer to Aquinas's *literal* text. Aquinas himself might have been baffled by a stateless resistance; the later Thomists would likely have sided with Elena on the authority question, but Mark on the proportionality.

  **2. The Definition of "Sedition"**
  They are arguing about whether the killing was sedition.
  *   **What they miss:** For Aquinas, Sedition is a sin against the *unity of the multitude*. If the "multitude" (the Belgian people) is being crushed by a foreign power, the "unity" is already broken by the occupier. Therefore, resistance restores unity rather than breaking it. However, Aquinas prioritizes *spiritual* unity and order. He often argues that it is better to suffer injustice than to risk the spiritual health of the community through violence. This is the hard pill of Christian pacifism-adjacent thought that sits inside Aquinas. He might argue your great-uncle's martyrdom (execution) was spiritually preferable to the violence required to kill the administrator.

  **3. The "Scandal" Factor**
  Mark mentioned disorder, but Aquinas has a specific concept called **Scandal**.
  *   **What they miss:** Even if an act is permissible, if it leads others into sin or confusion, it must be avoided. If the assassination leads to the deaths of innocents (reprisals), those deaths are, in a complex way, on the hands of the assassin in Thomistic ethics (via the principle of Double Effect). If the foreseeable consequence is the death of neighbors, Aquinas would likely say the cell lacked the *charity* required to justify the act.

  ### Summary for the Family

  If you need to mediate this (or just understand it yourself):

  *   **Elena is right on the Title:** The Nazi administrator was a usurper, and Aquinas allows for usurpers to be removed without it being "sedition."
  *   **Mark is right on the Prudence:** Aquinas places a massive "Stop" sign on resistance if it endangers the common good or causes greater suffering (reprisals).
  *   **Both are missing the Context:** Aquinas was writing for 13th-century monarchies, not 20th-century totalitarian occupations. The later Catholic tradition (World War II era) generally shifted toward Elena's view regarding occupation, acknowledging that "public authority" can exist in a resistance movement *provided* the proportionality test (Mark's point) is met.

  **The Thomistic Synthesis:**
  Aquinas would likely say your great-uncle was **not a sinner** for resisting a usurper (Elena's point), BUT he might question whether the specific operation was **prudent** given the certainty of civilian reprisals (Mark's point).

  However, given that your great-uncle was executed and the occupation eventually ended, a Thomist might also argue that his sacrifice bore witness to the truth of the Common Good in a way that mere survival did not. Aquinas values the *virtue* of the actor. If your great-uncle acted out of charity for his neighbors and justice for his country, rather than hatred or ambition, Aquinas would judge his soul kindly, even if the political calculus was debatable.

  You might tell Mark and Elena that they are both defending half of Aquinas. Mark is defending Aquinas's **caution**, and Elena is defending Aquinas's **justice**. In a situation like the Nazi occupation, the tradition eventually decided that Justice had to take the lead, but Caution was never wrong to speak up.
