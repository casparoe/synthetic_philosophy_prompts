prompt: |-
  I've been working through Quine's essay "On the Nature of Moral Values" (reprinted in Theories and Things), where he treats ethical predicates with noticeable suspicion. He is willing to grant mathematical posits a place in his ontology on the grounds that our best scientific theories cannot be formulated without them, yet he does not think moral predicates earn their keep in the same way, and he seems doubtful that moral discourse enjoys the kind of intersubjective checkpoints that let disputes in the sciences actually get settled. Suppose Quine had lived long enough to encounter Sharon Street's 2006 "Darwinian Dilemma" for moral realists, which argues that our evaluative dispositions were shaped by selective pressures bearing no obvious relation to any independent moral facts -- leaving realists stuck choosing between positing an implausible tracking coincidence or conceding that those dispositions are unreliable. Given his naturalized epistemology, his holism, and his selective, indispensability-based approach to ontological commitment, how do you think Quine would actually have responded to Street? Would he simply have signed on to her antirealist conclusion, or does his broader framework point toward some more distinctive move -- an error theory, a companions-in-guilt strategy, or treating moral discourse as not really fact-stating in the first place? I am less interested in your bottom-line verdict than in the reasoning you think he would actually have given to reach it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Subject:** W.V.O. Quine's potential response to Sharon Street's "Darwinian Dilemma" (2006).
      *   **Context:** Quine's essay "On the Nature of Moral Values" (in *Theories and Things*), his naturalized epistemology, holism, and indispensability argument for ontology.
      *   **Key Question:** Would Quine accept Street's antirealism? Or would he take a distinctive route (error theory, companions-in-guilt, non-cognitivism, etc.)?
      *   **Constraint:** Focus on the *reasoning* process, not just the verdict.
      *   **Tone:** Philosophical, analytical, speculative but grounded in textual evidence.

  2.  **Deconstruct Quine's Position on Ethics:**
      *   *Source:* "On the Nature of Moral Values" (1981).
      *   *Key Claims:*
          *   Ethics lacks the "intersubjective checkpoints" of science.
          *   Moral predicates are not indispensable to our best scientific theory of the world.
          *   Moral judgments are more akin to "habits of behavior" or "dispositions" than descriptions of fact.
          *   He distinguishes between the *genesis* of morality (sociobiological/psychological) and its *validation*.
          *   He is not a moral nihilist in the practical sense; he acknowledges the function of morality in social cohesion.
          *   He rejects the idea of "objective moral values" existing in the same way physical objects or sets do.
      *   *Ontological Commitment:* "To be is to be the value of a bound variable." We commit to entities indispensable to our best scientific theory. Moral values don't make the cut.
      *   *Epistemology:* Naturalized. Knowledge is part of the web of belief, anchored by sensory stimulation. Ethics is on the periphery, less constrained by observation.

  3.  **Deconstruct Sharon Street's "Darwinian Dilemma":**
      *   *Target:* Moral Realism (specifically robust, mind-independent realism).
      *   *The Dilemma:*
          1.  *Independence:* Moral facts exist independently of our attitudes.
          2.  *Influence:* Evolutionary forces shaped our moral judgments.
          3.  *The Problem:* If (1) and (2) are true, why do our judgments track the independent facts?
          4.  *Horns:*
              *   *Tracking Account:* Evolution tracked independent truth (implausible scientifically).
              *   *Reliability Account:* Evolution shaped judgments for survival, not truth (leads to skepticism about moral beliefs).
      *   *Street's Solution:* Constructivism/Antirealism. Moral truths are constituted by our evaluative attitudes, not independent of them.

  4.  **Synthesize: Quine meets Street:**
      *   *Agreement:* Quine would likely agree with Street's premise that evolutionary history explains our moral dispositions. He was a naturalist; he accepted evolution as the framework for human cognition. He would also agree that positing independent moral facts is ontologically profligate.
      *   *Disagreement/Nuance:* Street is arguing *against* realism to save the normative force of ethics (via constructivism). Quine is often read as leaning towards non-cognitivism or a deflationary view of ethical discourse. He doesn't necessarily want to "save" ethics as a truth-apt domain; he wants to categorize it correctly within a naturalistic worldview.
      *   *The Indispensability Argument:* This is the crux. Math gets in because physics needs it. Does ethics help physics? No. Does it help psychology/sociology? Maybe as an *object* of study, but not as a *tool* for explanation in the same way.
      *   *Holism:* For Quine, statements face the tribunal of experience as a corporate body. Ethical statements are so far from the sensory periphery that they can be adjusted without impacting the core scientific theory. Street's dilemma highlights this disconnect.

  5.  **Develop the Reasoning Path:**

      *   *Step 1: Ontological Parsimony.* Quine would applaud Street's attack on independent moral facts. It aligns with his rejection of "meanings," "propositions," and other intensional entities unless indispensable. Moral facts are definitely not indispensable for predicting sensory stimuli.
      *   *Step 2: The Genetic Fallacy vs. Naturalism.* Quine wouldn't see the evolutionary explanation as a "dilemma" forcing a choice between realism and skepticism. He would see it as a *dissolution* of the problem. The question "Do our judgments track independent facts?" presupposes there *are* independent facts to track. Quine denies the presupposition.
      *   *Step 3: Cognitive Status.* Would Quine call moral statements false (Error Theory) or non-truth-apt (Non-Cognitivism/Expressivism)?
          *   In "On the Nature of Moral Values," Quine says moral sentences *look* like factual statements but function differently. He compares them to commands or expressions of sentiment that have been grammaticalized.
          *   He might lean towards a *quasi-realist* or *fictionalist* stance, but given his time, a deflationary non-cognitivism is more likely. He wouldn't say they are "false" (Error Theory) because that implies they *aim* at truth and miss. He'd say they aren't in the business of truth.
      *   *Step 4: Companions in Guilt?* Would he save math and logic to save ethics? No. He explicitly distinguishes math (indispensable to science) from ethics (not indispensable). He would reject the "companions in guilt" move regarding ontology, though he might admit both are human constructs. But math is a *necessary* construct for science; ethics is a *contingent* construct for social living.
      *   *Step 5: The Function of Ethics.* Quine acknowledges ethics has a function (social cohesion). Street wants to preserve normativity. Quine would treat normativity as a sociological/psychological phenomenon, not a philosophical one requiring justification via truth conditions.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the fascinating counterfactual. State the thesis: Quine would welcome Street's evolutionary premise but reject the framing of the dilemma. He wouldn't be an antirealist in Street's constructivist sense, but rather a deflationary naturalist who sees moral discourse as non-fact-stating.
      *   *Point 1: Indispensability and Ontology.* Contrast Math vs. Ethics. Math is a posits of the theory; Ethics is not. Street's dilemma assumes the realist wants to keep the facts; Quine says drop the facts.
      *   *Point 2: Naturalized Epistemology.* The "Tracking" horn of the dilemma is a non-starter for Quine. We don't track "values"; we develop dispositions. The "Reliability" horn is just natural history.
      *   *Point 3: Truth and Discourse.* Does Quine think moral sentences are false? No, he thinks they lack truth conditions. This distinguishes him from Error Theorists (like Mackie). It aligns more with Expressivism, though Quine is wary of the analytic/synthetic distinction that often underpins traditional non-cognitivism. He'd likely view them as "observation sentences" of a sort, but tied to social reinforcement rather than physical stimuli.
      *   *Point 4: The "Distinctive Move".* It's not Error Theory, not Companions-in-Guilt. It's *Ontological Deflationism coupled with Pragmatic Retention*. We keep the talk, but we stop worrying about the "truth" of it in the scientific sense.
      *   *Conclusion:* Quine would see Street's dilemma as a *reductio* of realism, confirming his long-held suspicion. But he wouldn't adopt her constructivism. He'd treat ethics as a vital social technology, not a domain of knowledge.

  7.  **Refining the Quinean Voice:**
      *   Avoid attributing too much "metaethical" jargon that Quine might avoid (like "expressivism" as a labeled doctrine). Stick to his concepts: "posits," "web of belief," "stimulus meaning," "ontological commitment."
      *   Ensure the distinction between *science* (descriptive) and *ethics* (prescriptive/dispositional) is clear.
      *   Highlight the "Two Dogmas" holism: Ethics is at the edge of the web, easily revised, not central like logic or physics.

  8.  **Final Review against constraints:**
      *   Did I answer how he responds to Street? Yes.
      *   Did I focus on reasoning? Yes.
      *   Did I avoid just giving a verdict? Yes.
      *   Did I incorporate "On the Nature of Moral Values"? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to make Quine sound *too* much like an emotivist (Ayer/Stevenson). Quine was more sophisticated. He acknowledged the "objectivity" of ethics within a social framework, just not a *cosmic* objectivity. I should emphasize the *social* aspect of his view on ethics, which complements Street's evolutionary focus but strips the normative metaphysics.

      *(Another thought)*: Street is a Constructivist. Quine would likely find "construction" suspicious if it implies a realm of normative truths constructed by minds. He'd prefer "inculcation of dispositions."

      *(Final Polish)*: Structure the essay logically: Ontology -> Epistemology -> Semantics -> Pragmatics.

