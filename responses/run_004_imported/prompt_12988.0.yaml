answer: |-
  This is a fascinating counterfactual. To speculate on how Quine would respond to Sharon Street, we must resist the temptation to simply slot him into contemporary metaethical categories (like "error theorist" or "expressivist") without filtering them through his specific philosophical commitments: naturalism, ontological parsimony, and the indeterminacy of translation.

  While Quine would likely find Street's evolutionary premises congenial, he would probably reject the framing of her "dilemma" itself. He would not view it as a problem to be solved by choosing between realism and constructivism, but rather as a confirmation of his long-held view that moral discourse is ontologically innocent but pragmatically vital.

  Here is the reasoning Quine would likely employ, moving from ontology to epistemology, and finally to the function of moral language.

  ### 1. The Indispensability Argument and Ontological Parsimony
  The cornerstone of Quine's response would rest on his criterion of ontological commitment: *to be is to be the value of a bound variable.* We are committed only to those entities that are indispensable to our best scientific theory of the world.

  In "On the Nature of Moral Values," Quine explicitly contrasts mathematics with ethics. He grants mathematics ontology because physics cannot be formulated without quantifying over numbers and sets. Ethics, however, plays no such role in the explanation of sensory stimuli. We do not need to posit "goodness" or "rightness" as abstract objects to predict the motion of planets or the behavior of neurons.

  When encountering Street, Quine would seize upon her argument as a *reductio ad absurdum* of moral realism, but for ontological rather than epistemological reasons. Street argues that if independent moral facts existed, the evolutionary origin of our judgments would make our access to them miraculous. Quine would shorten this: **There are no independent moral facts because positing them does no explanatory work.**

  For Quine, the "Tracking Horn" of Street's dilemma (that evolution tracked independent truths) is not just implausible; it is scientifically idle. The "Reliability Horn" (that evolution shaped judgments for survival, not truth) is simply the naturalistic description of how moral dispositions arise. Quine would argue that Street presents a dilemma only for those who insist on inflating moral discourse into a fact-stating enterprise about mind-independent properties. If one drops the commitment to independent properties, the dilemma evaporates.

  ### 2. Naturalized Epistemology and the Web of Belief
  Quine's naturalized epistemology treats knowledge as a "web of belief" anchored by sensory stimulation. Statements near the periphery (observation sentences) are easily revised; statements near the center (logic, laws of physics) are held true come what may.

  Where does ethics sit in the web? Quine places it near the periphery, but not because it is easily falsified by observation. Rather, it is insulated from observation. In "On the Nature of Moral Values," he notes that moral judgments lack the "intersubjective checkpoints" of science. Two scientists can look at a gauge and agree on a reading; two moralists can look at an act and disagree on its value, with no recourse to a neutral arbiter.

  Quine would interpret Street's Darwinian argument through this holist lens. The fact that our moral dispositions are shaped by survival pressures confirms that they are part of our biological endowment, akin to our disposition to perceive spatial depth or to learn language. However, unlike our disposition to perceive physical objects (which is keyed to physical stimuli), our moral dispositions are keyed to social reinforcement.

  Quine would argue that Street's mistake (from a Quinean perspective) is to assume that for moral judgments to be valid, they must correspond to something *outside* the web of belief. For Quine, the "validity" of a moral judgment is its coherence within the social web and its efficacy in guiding behavior. The evolutionary story explains *why* the web has the shape it does, but it doesn't threaten the web's utility. Quine would tell Street that she is trying to save normativity by making it mind-dependent (constructivism), whereas he would simply dissolve the demand for normativity as a philosophical problem.

  ### 3. Semantic Deflationism: Not Error, but Non-Cognitivism (of a sort)
  Would Quine be an error theorist? Would he say moral statements are *false*? Unlikely. Error theory (à la J.L. Mackie) presupposes that moral statements aim to describe facts but fail. Quine's suspicion runs deeper: he doubts they aim to describe facts at all.

  In "On the Nature of Moral Values," Quine suggests that moral terms are learned through conditioning and social reinforcement. They function more like commands or expressions of sentiment that have been grammaticalized into declarative sentences. We say "Stealing is wrong" rather than "Don't steal," but the underlying function is similar.

  If Quine encountered Street, he would likely argue that her dilemma arises from a semantic confusion. We treat moral predicates as if they refer to properties because our grammar forces us to use subject-predicate form. But for Quine, grammar is a poor guide to ontology (as he argued with "Pegasus").

  Therefore, Quine would not say moral statements are false (Error Theory). He would say they are **truth-valueless** in the scientific sense, or that their "truth" is merely immanent to the moral scheme itself. He might adopt a deflationary view: to say "Kindness is good" is true is just to say "Kindness is good." It commits us to nothing beyond the linguistic practice. This avoids Street's dilemma because there is no "independent fact" to track or fail to track.

  ### 4. Rejection of "Companions in Guilt"
  A common realist response to evolutionary debunking is the "companions in guilt" argument: if evolution undermines morality, it also undermines logic, math, or science, since our cognitive faculties evolved for survival, not truth.

  Quine would firmly reject this move, and this is where his response would be most distinctive. He distinguishes sharply between the *indispensability* of logic/math to science and the *dispensability* of ethics.
  *   **Logic/Math:** We cannot formulate the theory of evolution without them. They are constitutive of the explanation.
  *   **Ethics:** We can formulate the theory of evolution (and explain why humans have moral feelings) without positing objective moral values.

  Quine would argue that the "guilt" does not spread. The reliability of science is vindicated by its predictive success regarding sensory stimuli. The "reliability" of ethics is vindicated by its success in promoting social cohesion. These are different jobs. To demand that ethics pass the same test as physics is, for Quine, a category mistake.

  ### 5. The Verdict: Pragmatic Retention without Ontological Inflation
  So, how would Quine conclude? He would not sign on to Street's constructivism, because constructivism still smells of trying to find a "truth" for morality (even if constructed). Quine is more pragmatic.

  He would likely argue that Street's dilemma is a symptom of "first philosophy"—the attempt to stand outside science and justify it (or ethics) from a higher vantage point. Quine rejects first philosophy. We are within the world, using science to understand ourselves. Science tells us (via Street's premise) that our moral feelings are evolutionary adaptations.

  Quine's response would be: **So what?**

  He would retain moral discourse as a vital social technology. We teach our children "do not kill" not because it corresponds to a Platonic form of the Good, but because a society that does so is more stable, and we prefer stability. The "objective value" of morality is not a metaphysical fact but a sociological one.

  ### Summary of Quinean Reasoning
  1.  **Ontology:** Moral values are not indispensable posits of our best scientific theory. Therefore, we are not ontologically committed to them. Street is right to doubt them, but for Quine, they never existed to be tracked in the first place.
  2.  **Epistemology:** The evolutionary explanation of moral dispositions is a scientific fact. It does not create skepticism; it creates clarity. It shows morality is a matter of disposition, not detection.
  3.  **Semantics:** Moral sentences are not fact-stating in the scientific sense. They are expressions of conditioned disposition. Therefore, the question of whether they "track" independent facts is ill-formed.
  4.  **Pragmatics:** We keep moral language because it works for social coordination, not because it describes reality.

  Quine would likely view Street's "Darwinian Dilemma" as a rigorous scientific argument that confirms his own naturalistic suspicions, but he would chide her for thinking the loss of independent moral facts requires a new metaethical foundation (constructivism). For Quine, the only foundation needed is the natural history of the human species and the pragmatic needs of the community. He would treat ethics not as a failed science, but as a successful technology that was never science to begin with.
