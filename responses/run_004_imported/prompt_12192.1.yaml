      *   *Check:* Did I mention the grad students? Yes.
      *   *Check:* Is the ending celebratory? Needs to raise a glass.
      *   *Adjustment:* Make sure the transition from the "plus-one" joke doesn't undermine her. Frame it as: "The party had boundary problems, but unlike real politics, we're all happy you're here."

  8.  **Final Word Count Check:** Aiming for roughly 700-800 words.

