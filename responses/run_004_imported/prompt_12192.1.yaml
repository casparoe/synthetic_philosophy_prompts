      *   **Core Theme:** The "Boundary Problem" (who counts as "the people"?).
      *   **Specific Angle/Hook:** The irony that the retirement dinner itself suffered from boundary problems (headcount, name cards, uncleared plus-one) without a "legitimate" democratic process.
      *   **Tone:** Warm, celebratory, not glib, not reducing her work to a punchline, acknowledging there's no clean answer to the theory, accessible to laypeople but respectful to experts.
      *   **Length:** Around 5 minutes (approx. 600-800 words spoken at a moderate pace).

  2.  **Deconstruct the "Boundary Problem" for the Toast:**
      *   *The Theory:* To decide who decides, you need to already have a group to decide. It's circular.
      *   *The Irony:* The party planning committee made arbitrary decisions about who gets in (the caterer headcount, the plus-one issue).
      *   *The Resolution:* Don't solve the theory. Acknowledge the messiness. Celebrate that she taught us how to live with the questions, not just find answers.
      *   *The Personal Connection:* The speaker's novel consultation. This grounds the relationship and shows her impact beyond the classroom.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the honor, the fear (the "voluntold" aspect), and the mixed audience. Establish warmth immediately.
      *   **The Theory (Simplified):** Explain the "Boundary Problem" without jargon. Use the "guest list" analogy provided in the prompt. It's perfect for this setting.
      *   **The Irony (The Hook):** Bring in the party logistics. The headcount, the name cards, the rogue plus-one. Connect this to her life's work. *Crucial:* Make sure this doesn't sound like mocking her work. It needs to sound like affectionate homage.
      *   **The Personal Connection:** Mention the novel consultation. Show how she applies theory to real life (even fiction). This bridges the gap between the academics and the family.
      *   **The Pivot/Celebration:** Why does this matter? It's not about solving the puzzle; it's about caring enough to ask the question. She taught us to care about *who* is in the room.
      *   **The Closing:** A toast to her. Acknowledge the lack of a "clean answer" but celebrate the legacy.

  4.  **Refining the Tone (Iterative Process):**
      *   *Risk:* Making it too academic. *Fix:* Keep the explanation of the boundary problem tied to the dinner party logistics.
      *   *Risk:* Making it too simple. *Fix:* Use specific phrasing that the grad students will catch (e.g., "constituency," "legitimacy," "circularity").
      *   *Risk:* Sounding cynical. *Fix:* Emphasize that the *struggle* is what matters. The fact that we worry about the plus-one proves her influence.
      *   *Risk:* Ignoring the "no clean answer" constraint. *Fix:* Explicitly state that she never claimed to solve it, and that's okay.

  5.  **Drafting - Specific Lines & Beats:**
      *   *Intro:* "Voluntold" is a good hook. Acknowledge the grad students watching like hawks.
      *   *The Theory:* "Who counts as 'the people'?" Use the guest list analogy.
      *   *The Party Irony:* The caterer deadline. The plus-one who wasn't cleared. "Arbitrary exclusion."
      *   *The Novel:* School board election. She helped me see the stakes.
      *   *The Meaning:* She didn't teach us *how* to draw the line, but *that* the line matters.
      *   *The Toast:* To Carol.

  6.  **Review against Constraints:**
      *   5 minutes? (Word count check: ~750 words is usually safe for 5 mins with pauses/laughter).
      *   Warm joke? Yes, the party logistics.
      *   Not glib? Ensure the transition from the joke to the tribute is sincere.
      *   No clean answer? Explicitly mention the circularity remains.
      *   Audience balance? Explain the theory simply but accurately.

  7.  **Final Polish:** (Self-Correction during drafting)
