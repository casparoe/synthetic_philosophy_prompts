answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], Carol's niece/nephew. I was what you might call "voluntold" to give this toast. Which is terrifying, specifically because looking out at this room, I realize I'm speaking to two distinct constituencies.

  On one side, I have the family and old friends, who mostly think Carol's job involved arguing about the news. On the other, I have her colleagues and former students, who are currently listening with the predatory alertness of grad students waiting for a methodological error. So, I need to get this right.

  For thirty-six years, Carol's career orbited a concept called the "boundary problem." In plain English: In a democracy, "the people" rule. But who counts as "the people"? Is it citizens? Residents? Everyone affected by a decision? Even people who aren't born yet?

  Carol taught that every answer is circular. You need "the people" to vote on who counts as "the people." It's like needing a guest list to vote on the guest list.

  Now, I bring this up because I couldn't help but notice that this retirement dinner—which honors a woman who spent her life interrogating how we decide who gets to be in the room—was itself a masterpiece of arbitrary boundary drawing.

  We had a hard headcount for the caterer. We have assigned seating with little name cards. And I heard a rumor that someone's plus-one didn't get cleared by the planning committee in time and was consequently excluded from the polity of this banquet hall.

  Now, the political theorists in the room are smiling, because they see the irony. The family is probably wondering if we need to call the restaurant manager. But here is the point: Carol never claimed to solve the boundary problem. She'd be the first to tell you, happily, that there is no clean answer. There is no perfect formula for who gets a name card and who doesn't.

  But what she taught us—and what she taught me—is that the *struggle* to define the boundary is where the morality lives.

  I've been leaning on Carol heavily for the past year. I'm writing a novel about a nasty school board election, and she's been my free consultant. Whenever I tried to write a easy villain, she'd stop me. She'd ask, "Who isn't in this room? Whose voice is missing from this argument?" She didn't help me fix the plot; she helped me widen the scope. She taught me that the most important political act isn't casting a vote; it's asking who isn't allowed to cast one.

  That is her legacy. Not a solution, but a sensitivity.

  Because of her, the cousins at the back of the room might think twice about who gets invited to the next family reunion. And the colleagues at the front know that their next paper will be slightly more rigorous because Carol once asked them, "But have you defined your terms?"

  So, yes, this party had boundary issues. The plus-one situation was arguably illegitimate. The seating chart was authoritarian. But looking around this room, I see the people who were included. I see the colleagues she challenged, the students she mentored, and the family she loved.

  Carol spent thirty-six years teaching us that drawing the line is hard, messy, and never finished. But she also showed us that if you care enough to worry about the line, you're already doing the work.

  So, if everyone could raise a glass.

  To Carol. Thank you for teaching us that the question matters more than the answer, and for proving that even when the guest list is imperfect, the celebration is still legitimate. We are so glad you're here.

  To Carol.
