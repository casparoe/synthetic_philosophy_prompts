      *   *Verification:* This is the core tenet of ISOTYPE (Vienna Method of Pictorial Statistics). Neurath argued that scaling a symbol (e.g., a man twice as tall) creates a visual area four times as big, leading to misinterpretation of the data. Repetition ensures unit-for-unit accuracy.
      *   *Verdict:* **Correct.**
