      *   *Verification:* Marie Neurath (née Reidemeister) was indeed crucial. The term "Transformer" (*Transformator*) was used for the person who translated raw statistical data into visual concepts. Marie took on this role extensively, especially after Otto's death, but also during the Vienna years. She is often cited as *the* Transformer.
      *   *Verdict:* **Correct.** (Though it's worth noting it was a role/function, sometimes held by Otto, but Marie is the most famous holder of that specific function).

  3.  **Evaluating the Philosophical Claim (Point 2):**
      *   *Claim:* ISOTYPE flattens facts into countable/repeatable units. It cannot express "not," "used to," "he claims," or individual emotional states. Novels thrive on these specific exceptions.
      *   *Analysis:* This is a strong insight. ISOTYPE is about *aggregate* data, not *individual* narrative. It is synchronic (mostly) rather than diachronic (narrative time). It deals in positives (presence of things) rather than modalities (possibility, doubt).
      *   *Verdict:* **Not just a flattering analogy.** It's a structural truth about information design vs. narrative fiction. The limitation is inherent to the medium.

