      *   *Claim:* Neurath knew pictures couldn't do everything. Is the character's disillusionment a strawman?
      *   *Analysis:* Neurath was a logical positivist (Vienna Circle). He believed in the unity of science and clear communication. He *did* acknowledge ISOTYPE needed text (captions, titles) to function. He called it a "visual language" but knew it wasn't a *complete* language. He wanted to educate the masses ("the little man").
      *   *Nuance:* However, Neurath was also an optimist/utopian. He believed this method could democratize knowledge and potentially reshape society. He might have underestimated the *loss* of human nuance in the service of clarity.
      *   *Verdict:* **It's not a strawman, but it needs calibration.** The character shouldn't think Neurath claimed ISOTYPE could write a novel. The disillusionment should come from realizing that *life* is mostly the stuff ISOTYPE excludes. Neurath wanted to clarify the world; the character realizes clarification often means erasure.

