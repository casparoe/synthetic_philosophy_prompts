answer: |-
  Here is the direct feedback you asked for, broken down by your three questions.

  ### 1. The Facts
  **You are mostly right, but you need to tighten the terminology.**

  *   **Repetition vs. Size:** You are correct. This is the foundational rule of the "Vienna Method." Neurath argued that if you double the linear dimensions of a symbol (make a man twice as tall), the area quadruples, leading the viewer to overestimate the data. To show "two million," you show two men. To show "ten million," you show ten men. This is accurate.
  *   **Marie Reidemeister:** You are correct, but with a caveat. "Transformer" (*Transformator*) was indeed the specific technical term for the person who translated raw statistical data into visual concepts. Marie Neurath (née Reidemeister) is the most famous holder of this role. However, it wasn't necessarily her exclusive job title on a business card in 1928; it was a function within the workshop. Otto was a Transformer; Marie was a Transformer. Later, she became *the* Transformer after Otto's death. For a novel, calling her "the Transformer" is historically defensible and dramatically potent.
  *   **One Correction:** You refer to it as "Isotype." In the late 20s (specifically before 1934), it was usually called the **Vienna Method of Pictorial Statistics**. The acronym ISOTYPE (International System of TYpographic Picture Education) was coined later, largely after they moved to England. If your character is a purist in 1928 Vienna, they might correct someone who calls it "Isotype" too early.

  ### 2. The Philosophical Claim
  **This is not a flattering analogy; it is a structural truth.**

  Your observation that "Isotype has no icon for 'not,' no icon for 'used to,' no icon for 'he claims'" is sharp and accurate.

  *   **The Limit:** ISOTYPE is inherently **positivist**. It shows what *is* (in terms of quantity). It struggles immensely with negation, conditionality, or modality. You cannot easily draw a chart showing "people who *might* have been unemployed." You can only draw "unemployed people."
  *   **The Novelistic Conflict:** You are right that this is where the novel lives. Fiction thrives on the subjunctive mood (what if, what might have been), on internal states that contradict external appearances, and on the specific exception to the rule. ISOTYPE thrives on the aggregate, the indicative mood, and the rule.
  *   **The Verdict:** This is a solid thematic engine. It is not forced. The tension between "statistical truth" (the chart) and "human truth" (the tired man) is genuine.

  ### 3. Fairness to Neurath (The Strawman Risk)
  **Here is where you need to be careful. You are bordering on a strawman, but you can fix it.**

  *   **Neurath's Actual Stance:** Neurath never claimed ISOTYPE was a complete language. He explicitly stated it needed text (captions, titles) to function. He called it a "visual aid," not a replacement for speech. He knew it couldn't express complex syntax or abstract philosophy.
  *   **The Risk:** If your character's disillusionment is based on the idea that Neurath *promised* ISOTYPE could capture the full human experience, the character looks naive, not disillusioned. Neurath didn't promise that.
  *   **The Fix:** The disillusionment shouldn't be that ISOTYPE failed to do what Neurath said it would. **The disillusionment should be that what Neurath said it *would* do is morally insufficient.**
      *   Neurath wanted to educate the "little man" to understand economics and housing so he could vote for socialism. He wanted clarity.
      *   Your character should realize that in the pursuit of that clarity, you inevitably erase the suffering that doesn't fit the category.
      *   *Example:* A chart shows "Housing Units Built." It looks like progress. It does not show that the new units smell of wet cement and make the residents sick, or that a family was split up to fit the metrics.
      *   Neurath would say: "The chart tells the truth about production."
      *   Your character should realize: "The chart tells a truth, but it is not *the* truth."

  **Don't make Neurath a liar.** Make him a utilitarian. He believed the greater good was served by simplifying knowledge for the masses. Your character's arc is the realization that simplification is a form of violence. That is a much stronger conflict than "Neurath oversold the product."

  ### Specific Notes on Your Text
  *   *"Isotype was never meant to replace language, just sit next to it"* -> **Keep this.** It shows your character has done the homework.
  *   *"no single man is allowed to be bigger, sadder, or more tired than the others"* -> **This is your killer line.** This is the emotional core of the scene.
  *   *"smuggling all the disallowed stuff... back in through the captions"* -> **This is a great plot mechanic.** It gives the character something active to do. They are subverting the charts from within.

  ### One Historical Nuance to Consider
  In the late 20s, this work was heavily funded by "Red Vienna" (the Social Democratic municipal government). There was a political urgency to it.
  *   **The Pressure:** The pressure wasn't just philosophical; it was political. If the charts didn't show success, the political opponents (the Conservatives/Fascists rising in the background) would use that against the party.
  *   **The Conflict:** Your character might feel pressure to make the icons look "happier" or the numbers look "cleaner," not because the *method* demands it, but because the *party* demands it. This adds a layer of political dread to the philosophical limitation.

  **Summary:** Your facts are solid enough for fiction (just watch the "ISOTYPE" vs. "Vienna Method" timeline). Your philosophical insight is sound. Just ensure your character is fighting Neurath's *optimism*, not his *claims*. Neurath knew the limits of the system; he just believed the benefits outweighed them. Your character disagrees. That is a worthy conflict.
