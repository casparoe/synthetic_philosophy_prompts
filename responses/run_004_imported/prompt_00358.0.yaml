          *   *Alternative:* Some Safety formulations *do* struggle with Fake Barns. If "nearby worlds" are defined strictly by the actual environment, Henry's belief is unsafe (he could easily have looked at a fake). But if defined by the specific object, it's safe.
          *   *Let's go with this:* Sens (Sensitivity) claims victory because the case is a slam-dunk for tracking. Safe (Safety) argues that while the verdict is the same, Sensitivity's mechanism breaks logic (Closure), whereas Safety can explain the failure without breaking logic, provided we understand "environment" correctly.

  3.  **Character Conceptions:**
      *   **Sens (Sensitivity):** Pragmatic, focused on counterfactual dependence. "If it were a fake, you'd still think it's real." A bit aggressive about Skepticism being a bullet worth biting (or at least pointing out Safety's hypocrisy).
