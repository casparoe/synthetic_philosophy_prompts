      *   **Safety (Sosa, Williamson, Pritchard):** $S$ knows $p$ iff (roughly) if $S$ believes $p$, then $p$ is true. (In nearby possible worlds where $S$ believes $p$, $p$ is not false).
          *   *Application to Fake Barns:* This is tricky. In the *actual* world, Henry believes it's a barn and it is a barn. But what are the "nearby worlds"?
