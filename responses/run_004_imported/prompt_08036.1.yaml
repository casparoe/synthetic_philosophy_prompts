      *   **Reason 2: Interpretation of Evidence (Likelihoods):** Same data $\neq$ same update. Trust in sources varies.
      *   **Reason 3: Values/Utility Functions:** Disagreement on *goals*, not just *methods*.
      *   **Reason 4: "Common Knowledge" isn't met:** You know *what* he thinks, but not the exact Bayesian weight he assigns to every piece of evidence.
