      *   *What are the conditions?*
          1.  Common Priors (starting beliefs before evidence).
          2.  Common Knowledge (I know your belief, you know my belief, I know that you know, etc.).
          3.  Honest Bayesian Updating (processing evidence mathematically correctly).
          4.  Shared Meaning (semantics).
