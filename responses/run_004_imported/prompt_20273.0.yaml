answer: |-
  This is an exceptionally sharp grasp of the problem for someone without formal training. You have correctly identified the tension at the heart of contemporary metaphysics of probability. Many undergraduate philosophy majors graduate without understanding the "Big Bad Bug" as clearly as you have articulated it.

  The puzzle you are wrestling with is the conflict between **metaphysics** (what chance *is*) and **epistemology** (how we should *believe*). David Lewis wanted a metaphysics that was clean and parsimonious (Humean Supervenience), but he found it clashed with the epistemology he thought was obvious (the Principal Principle).

  Here is a walkthrough of the three points you raised, focusing on the logical shape of the disagreement rather than the notation.

  ---

  ### 1. Why Undermining is a Genuine Problem (Not Just a Technicality)

  To see why this isn't just a quirk of notation, we have to look at the contradiction it generates for a rational agent.

  **The Setup:**
  *   **Humean Supervenience (HS):** The chance function at time $t$ is determined by the *entire* history of the world (past, present, and future). It is the "Best System" summarizing the whole mosaic of events.
  *   **The Principal Principle (PP):** If you know the objective chance of event $A$ is $x$, your credence (degree of belief) in $A$ should be $x$.
  *   **The Undermining Future:** Imagine a world where the current best system says a coin is fair (50% heads). However, there is a possible future sequence of outcomes (say, 1,000 heads in a row) that is physically possible (it has non-zero chance) but, *if it occurred*, would make the "fair coin" system no longer the Best System. If that future happened, the Best System would instead be one that says "this coin is biased toward heads."

  **The Contradiction:**
  Let $F$ be that specific "undermining future" (the 1,000 heads).
  1.  **According to PP:** The current chance of $F$ is some small number $x > 0$. Therefore, my credence in $F$ should be $x$.
  2.  **According to HS:** The proposition "The current chance function is $Ch$" entails that $F$ does *not* occur. Why? Because if $F$ *did* occur, $Ch$ would not be the chance function (a different system would win). So, knowing the current chance function is $Ch$ logically guarantees that $F$ is false.
  3.  **The Clash:** If I know the current chance is $Ch$, logic (via HS) tells me my credence in $F$ should be **0**. But the Principal Principle tells me my credence in $F$ should be **$x$** (where $x > 0$).

  **Why this matters:**
  This isn't just a calculation error; it implies that **Humean Supervenience and the Principal Principle are logically inconsistent.** You cannot hold both.
  *   If you keep HS, you must reject the idea that rational credence simply matches objective chance.
  *   If you keep PP, you must reject the idea that chances supervene on the total history.

  Lewis loved HS (it kept metaphysics simple and scientific). He was unwilling to drop it. So, he concluded the Original Principal Principle had to be the one to go.

  ---

  ### 2. The New Principal Principle (NPP): Solution or Redefinition?

  Lewis's fix was to modify the Principal Principle to accommodate the metaphysics of HS.

  **The Change:**
  The Original PP said:
  $$ \text{Credence}(A \mid \text{Chance}(A) = x) = x $$

  The **New Principal Principle** effectively adds a hidden clause. It says you should match your credence to the chance, *conditional on the chance function actually being the true one for the whole history.*
  $$ \text{Credence}(A \mid \text{Chance}(A) = x \ \& \ \text{History is compatible with this Chance}) = x $$

  In Lewis's later work, he formalized this by saying we should conditionalize on the *theory of chance* ($T$) that governs our world. Since $T$ (under HS) includes information about the fit between chances and history, conditionalizing on $T$ automatically rules out the undermining futures.

  **Is it a Real Solution or a Dodge?**
  It is a **real solution** to the logical contradiction, but it comes with a philosophical cost that feels like a dodge to some.

  *   **The Victory:** It restores consistency. Under the NPP, I am no longer told to have credence $x$ in the undermining future. I am told to have credence $x$ *only if* I assume the future doesn't undermine the chance function. Since I know (by HS) that the undermining future *would* falsify the chance function, the condition fails, and the instruction doesn't apply. The contradiction vanishes.
  *   **The Cost:** The Original PP felt like a direct bridge between the world and the mind: "The world says 50%, so you believe 50%." The NPP makes that bridge indirect. It says: "The world says 50%, so you believe 50%... *unless* believing 50% would contradict the fact that the world says 50%."

  **The Verdict:**
  It is not merely a redefinition to dodge the bullet; it is an admission that our access to Humean chance is more complex than we thought.
  *   **Original Intuition:** Chance is a guide to belief.
  *   **Lewis's Revised View:** Chance is a guide to belief *only after* we have filtered out scenarios where the chance function itself would be different.

  Critics argue this makes "chance" less action-guiding. If I have to check whether a future undermines the chance function before I defer to it, do I really know the chance function yet? Lewis would reply: "You don't need to check explicitly; rationality just requires you to respect the logical connections between chance and history."

  So, it saves the Humean metaphysics, but it concedes that the epistemology of chance is not as simple as the Original PP suggested.

  ---

  ### 3. Non-Humean Alternatives: Avoiding the Mess?

  This is where the "shape of the disagreement" becomes clearest. You asked if primitivist or propensity views avoid this mess, and whether that is an advantage.

  **The Non-Humean Picture:**
  In a propensity or primitivist view, chances are **real properties of the present moment**. They are dispositional features of the physical setup (like the fragility of a glass), not summaries of the whole history.
  *   The chance of the coin landing heads is fixed *now* by the physical coin.
  *   It does *not* depend on whether the future turns out to be 1,000 heads or 1,000 tails.
  *   Therefore, **undermining is impossible.** A future outcome cannot "rewrite" the present chance, because the present chance does not supervene on the future.

  **Do they avoid the mess?**
  **Yes.** On a Non-Humean view, the Original Principal Principle works perfectly.
  1.  Chance is fixed now.
  2.  Future outcomes don't change the present chance.
  3.  Therefore, knowing the chance gives you no logical information about whether the future will undermine it (because it can't).
  4.  You can safely set your credence to $x$.

  **Is this an advantage? (The Trade-Off)**
  This is the central debate in the metaphysics of probability. It is a trade-off between **Metaphysical Parsimony** and **Epistemological Simplicity**.

  *   **The Humean (Lewis) Deal:**
      *   *Pros:* Metaphysically cheap. You only need "events in spacetime." No spooky modal forces. Fits well with a scientific worldview that dislikes hidden powers.
      *   *Cons:* Epistemologically expensive. You get the "Big Bad Bug." You have to complicate your theory of rational belief (NPP) to make it fit your metaphysics.
  *   **The Non-Humean Deal:**
      *   *Pros:* Epistemologically cheap. The Original Principal Principle holds. Chance guides belief directly. No undermining futures.
      *   *Cons:* Metaphysically expensive. You must believe in "propensities" or "primitive chances." These are invisible, non-categorical properties that exist over and above the actual events. Critics call this "occult" or "magical." If the coin lands tails 1,000 times, the Non-Humean must say "It still had a 50% propensity all along." The Humean says "No, it was biased." The Non-Humean view requires a leap of faith that these properties exist even if they never manifest clearly.

  **Conclusion on the Disagreement:**
  The disagreement isn't about who solved the puzzle "correctly." It is about which cost you are willing to pay.
  *   If you think **metaphysical clarity** (no hidden powers) is the highest virtue, you stay Humean, accept the New Principal Principle, and live with the complexity.
  *   If you think **conceptual coherence of probability** (chance guiding belief without asterisks) is the highest virtue, you go Non-Humean, keep the Original Principal Principle, and accept "spooky" metaphysics.

  ### Summary for your Reading Group

  1.  **The Bug:** Humean chances depend on the future. This creates a logical contradiction where knowing the chance tells you the future *won't* happen, even though the chance says it *might*.
  2.  **The Fix:** Lewis changed the rule for belief (NPP). You now defer to chance *conditional* on the chance function remaining true. It solves the logic but makes the link between chance and belief less direct.
  3.  **The Alternative:** Non-Humeans fix the metaphysics so chances don't depend on the future. This saves the Original Principle but requires believing in invisible "propensity" properties.

  You have correctly intuited that Lewis's "fix" feels like a compromise. It is. But Lewis argued it was the only way to keep a scientific, Humean worldview intact. Whether that was worth it is the question your group should debate.
