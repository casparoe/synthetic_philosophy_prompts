answer: |-
  **Setting:** *A quiet corner of the university faculty club. Two old colleagues, ALEX (a staunch defender of critical rationalism) and SAM (a philosopher of science with leanings toward Duhem and Quine), are finishing coffee. The user’s prompt has clearly been the subject of their morning conversation.*

  **Alex:** You're letting the historical outcome cloud the logical status. That's the exact fallacy Le Verrier's case is supposed to illuminate. Look, when Le Verrier posited Neptune, he took a massive risk. He said, "Newton is right, but there's a mass *here*." If Galle points the telescope and sees nothing, Newton is in deep trouble. That is the essence of falsifiability. He put his neck on the block.

  **Sam:** But that's just it, Alex. He put his neck on the block in 1846, and he put it on the block again in 1859 for Vulcan. The logical structure is isomorphic. In both cases, you have a core theory (Newtonian Mechanics), an anomaly (residuals in the orbit), and an auxiliary hypothesis (an unseen planet). If you judge the *scientificity* of the move by the risk involved, both moves are equally scientific. Yet, we treat Neptune as the triumph of prediction and Vulcan as... well, a footnote to a mistake.

  **Alex:** We treat Vulcan as a mistake because it was *false*. But false hypotheses are still scientific hypotheses! Popper never said science is about being right. He said it's about being testable. "There is a planet at coordinates X" is eminently testable. Le Verrier gave specific parameters. It wasn't a vague "ether" or a "divine intervention." It was concrete. When the telescopes looked and didn't find it, the hypothesis was falsified. That's the system working, not failing.

  **Sam:** I'm not talking about the truth value. I'm talking about the demarcation. You want to say the Neptune move was "good science" and the Vulcan move was... what? "Bad science"? Or just "science that failed"? Because if it's the latter, then your criterion doesn't distinguish between a progressive research program and a degenerating one at the moment of inception.
  Consider the "ad hoc" charge. Popper hates ad hoc modifications—patches added solely to save a theory without adding new content. But Le Verrier's patch *did* add new content: a new planet. It had independent testability. So, by Popper's own lights, the Vulcan hypothesis was scientific. But here's the rub: for fifty years, astronomers kept the Vulcan hypothesis alive despite negative results. They tweaked the orbit, they suggested it was a ring of dust, they suggested it was invisible. *That* is the ad hoc degeneration. But the initial inference? It's identical to Neptune.

  **Alex:** Fine, I'll concede that the *long-term retention* of the Vulcan hypothesis involved some immunizing stratagems. Scientists were reluctant to abandon Newton. But that's a psychological or sociological fact, not a logical one. The initial posit was a bold conjecture. The fact that it turned out to be the wrong *kind* of solution—requiring a modification of the core theory (General Relativity) rather than an auxiliary (a planet)—doesn't retroactively make the conjecture unscientific.
  You're conflating the *context of discovery* with the *context of justification*. Le Verrier followed a heuristic: "Anomalies in orbit imply mass." It's a good heuristic. It worked for Uranus. It failed for Mercury. But the failure was empirical, not methodological.

  **Sam:** But Duhem's point cuts deeper than that. Duhem says you never test a hypothesis in isolation. You test a whole group: Newton's Laws + Optics of the Telescope + Data Reduction + *Existence of Planets*. When Mercury wobbled, the experiment didn't say "Vulcan is false." It said "Something in that group is false."
  Why was it rational to keep Newton and posit Vulcan in 1860, but rational to ditch Newton and posit Curved Spacetime in 1915? Logic alone can't tell you. There is no logical rule that says "Save the core, tweak the auxiliaries." That's a pragmatic choice. A strict Popperian might have argued in 1880: "Vulcan is falsified by non-detection. Newton is falsified by the perihelion. Burn it all down." But they didn't. They held onto Newton because the *web* was too valuable.

  **Alex:** And that's where you Holists get it wrong. You think because there's no *logical* algorithm for theory choice, it's all pragmatic coherence. But there *is* a normative constraint: Independent Testability.
  Here is the distinction, Sam. The Neptune hypothesis had consequences *beyond* explaining Uranus. Once found, Neptune could be weighed, its moons observed, its effect on other bodies calculated. It integrated into the whole system.
  The Vulcan hypothesis, increasingly, did not. It became a "ghost." It was posited to explain Mercury, but it didn't show up in solar eclipse photos, it didn't perturb comets in the way a mass that size should. The *degree* of independent testability dropped. The hypothesis became insulated. So, the Popperian criterion *does* hold. It wasn't the inference pattern that changed; it was the empirical cash-value of the auxiliary.

  **Sam:** That's a fair point, but it's retrospective. You're judging the "independent testability" based on the fact that we *know* now there was nothing there to interact with.
  Let's press on the user's specific worry, Alex. They're a physicist. They know the math. The math for the perturbation calculation is the same. If I hand you the residuals for Uranus and the residuals for Mercury without telling you which is which, and I ask you to apply the "Falsificationist Method," you would generate the same output: "Posit a planet, calculate coordinates, look."
  If the method produces a "scientific" result in case A and a "scientific" result in case B, but case B leads to a dead end that requires a paradigm shift to resolve, does the method actually help you distinguish the *potential* of the theory? Or does it just validate the *process* after the body is cold?

  **Alex:** It validates the process. And that's enough! Science isn't a truth machine; it's an error-elimination machine. The Vulcan episode *was* science. It was a necessary error. We had to try the Newtonian solution to be sure the Newtonian framework was exhausted.
  If you adopt the Holist view, don't you risk making everything permissible? If it's all about the "health of the web," can't I just say, "My theory is fine, the anomaly is in the web," forever?
  Popper gives me a stick to beat the dogmatists with. Le Verrier was right to look for Neptune. He was right to look for Vulcan. He was wrong to insist on Vulcan after the eclipses failed to show it. The criterion tells us *when to stop*.

  **Sam:** Does it? Because astronomers didn't stop because of a single falsifying instance. They stopped because Einstein offered a better web that explained the anomaly *and* bent light *and* handled gravity.
  This is the Quinean underdetermination. You can always save the core theory if you are willing to make drastic enough changes elsewhere (like changing the nature of space and time). The Holist doesn't say "anything goes." We say that the choice between "Vulcan exists" and "Newton is approximate" is not decided by a single falsification, but by the comparative virtues of the total systems.
  The physicist in your prompt is worried that the "Same Inference Pattern" implies the "Same Scientific Status." I agree with them. Both were scientific. The difference isn't in the logic of the hypothesis, but in the *resilience of the core theory*. Newton was too entrenched to be killed by Mercury alone.

  **Alex:** But that entrenchment is rational! Newton had survived countless other tests. Mercury was one outlier. In Bayesian terms—though I hate to admit it—the prior on Newton was huge.
  But here is where I think I can answer your physicist friend directly. The demarcation isn't between Neptune and Vulcan. It's between *Le Verrier's Astronomy* and *Astrology*.
  An astrologer says, "Uranus is wobbly because Mars is angry." That is not testable. "Anger" has no coordinates.
  Le Verrier said, "Uranus is wobbly because Mass is at X." That is testable.
  So, the Popperian line holds firm against the *real* enemies of science. The distinction between Neptune and Vulcan is internal to science. It's the difference between a successful conjecture and a failed one. The Holist wants to turn that into a difference in *kind* of reasoning. I say it's just a difference in *outcome*.

  **Sam:** But if the reasoning is the same, why do we feel uneasy about Vulcan? Because it *feels* like a save. It feels like we were trying to force nature to fit the box.
  Here's my strongest card, Alex. Lakatos, trying to save Popper from people like me, introduced the idea of "Progressive vs. Degenerating Problemshifts."
  Neptune was progressive. It predicted something *novel* that was verified.
  Vulcan was degenerating. It predicted a planet, wasn't found, so it predicted a smaller planet, wasn't found, so it predicted a ring of dust. Each step was a defensive move.
  The Popperian criterion, in its raw form ("is it falsifiable?"), can't distinguish a progressive shift from a degenerating one *in real time*. Both "There is a planet" and "There is a dust ring" are falsifiable. But one is a desperate patch.
  So, to answer your physicist: A strict, naive Popperian says both moves are equally scientific. A sophisticated Popperian (like Lakatos) admits the logic is the same, but the *heuristic power* differs. But that sophistication moves Popper closer to... well, me. Closer to holism.

  **Alex:** *Laughs.* Don't get cocky, Sam. Moving closer to holism doesn't mean arriving there. Lakatos kept the normative bite. He still said you *should* abandon a degenerating program. Duhem just says you *will* abandon it when a better story comes along.
  I think the answer for your physicist is this: The inference pattern *is* the same. That's the beauty of it. Science relies on the uniformity of nature. We assume the same causes produce the same effects. It was rational to assume mass causes wobbles in 1859 because it worked in 1846.
  The falsificationist criterion doesn't guarantee success. It guarantees that when you fail, you know you've failed. Le Verrier knew Vulcan was dead. He didn't retreat into mysticism. He accepted the falsification.
  So, the criterion handles it fine. It classifies both as scientific. It classifies the Neptune result as corroboration and the Vulcan result as falsification. The fact that the *core theory* survived the Vulcan falsification for a while is a separate issue about theory-ladenness, which Popper acknowledged.

  **Sam:** I'll accept that. If the Popperian admits that "Scientific" doesn't mean "True" or even "Likely to Succeed," but simply "Empirically Risky," then the symmetry holds. Both were risky. Both were scientific. One hit, one missed.
  But I'd add the Holist coda: The reason we don't view Vulcan as a "stain" on science is that we view the *whole epoch* as a process of tightening the web. We didn't just test Vulcan; we tested the limits of Newtonian space.
  So, tell your physicist friend: The logic is identical. The status is identical. The difference is that nature said "Yes" to one and "No" to the other. And when nature said "No" to Vulcan, it wasn't just killing a planet hypothesis; it was inviting us to rewrite the laws of gravity.
  Popper tells you how to ask the question. Duhem tells you why the answer changed the whole conversation.

  **Alex:** I can live with that. As long as we agree that asking the question required a falsifiable hypothesis, and not a metaphysical excuse.

  **Sam:** Agreed. No invisible angels pushing the planets. But I still maintain that deciding *when* to stop looking for Vulcan was more about the promise of Einstein than the failure of Le Verrier.

  **Alex:** Then we have work to do. Coffee?

  **Sam:** Please.
