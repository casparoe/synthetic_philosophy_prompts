prompt: |-
  I'm a software engineer at a mid-size mobile game studio, and I sit on the small internal group — two designers, a data scientist, and an outside clinical psychologist — that must sign off before we ship anything touching player mental health. We've built a model that flags accounts as elevated-risk for what the WHO's ICD-11 labels "Gaming Disorder," combining play data with an in-app questionnaire worded to track the official criteria (impaired control over play, prioritizing it over other interests, continuing despite harm); flagged accounts get a nudge toward setting play limits. Our psychologist warns that once players know the flag exists, some start describing ordinary play as compulsive on the questionnaire, apparently because being told they're "at risk" changes how they narrate their own habits, while others steer their answers away from anything resembling the criteria to avoid being tagged again — either way, the flagged group's self-reports stop being independent evidence of what the model is supposed to measure, and next quarter's retraining will bake that distortion back into the model itself. We decide this Friday whether to ship the feature as designed, shelve it, or redesign the questionnaire and retraining pipeline. Please draft the memo I'll circulate beforehand: take a clear position with a concrete plan and timeline, and engage honestly with the strongest argument against whichever option you choose.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Software Engineer at a mid-size mobile game studio.
      *   **Context:** Member of an internal review group (2 designers, 1 data scientist, 1 outside clinical psychologist) responsible for signing off on features touching player mental health.
      *   **Problem:** A model flags accounts for "Gaming Disorder" risk (based on ICD-11 criteria) using play data + in-app questionnaire. Flagged accounts get a nudge to set limits.
      *   **The Issue (Goodhart's Law/Observer Effect):** The psychologist warns that knowing about the flag changes player behavior on the questionnaire (some over-report due to suggestion, some under-report to avoid tagging). This corrupts the ground truth data, making future model retraining biased and ineffective.
      *   **Decision Point:** This Friday (ship, shelve, or redesign).
      *   **Task:** Draft a memo to circulate *before* the Friday meeting.
      *   **Requirements:** Take a clear position, provide a concrete plan/timeline, engage honestly with the strongest counter-argument.

  2.  **Determine the Position:**
      *   *Option A: Ship as designed.* Bad idea. The psychologist has identified a critical validity flaw. Shipping risks harming players (false positives/negatives) and creating a broken feedback loop. Ethical and technical liability.
      *   *Option B: Shelve entirely.* Safe, but cynical. Mental health tools are needed. Abandoning the effort might look like the studio doesn't care about player well-being.
      *   *Option C: Redesign.* The best middle ground. Acknowledges the value of the intent but fixes the methodological flaw. It shows responsibility and engineering rigor.
      *   *Decision:* **Redesign.** Specifically, decouple the data collection for retraining from the user-facing intervention to prevent contamination.

  3.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** State the recommendation clearly (Do not ship as-is; proceed with Redesign).
      *   **Context/Problem:** Briefly recap the model and the psychologist's finding (data contamination).
      *   **Recommendation/Plan:** Concrete steps (A/B testing, passive data emphasis, blinded retraining).
      *   **Timeline:** Realistic milestones.
      *   **Counter-Argument:** Address the "Delay costs money/players suffer now" argument.
      *   **Conclusion:** Call to action for the Friday meeting.

  4.  **Drafting - Section by Section:**

      *   *Subject Line:* Needs to be clear and urgent. "Decision Memo: Gaming Disorder Risk Feature"
      *   *Opening:* Acknowledge the team's hard work. State the recommendation immediately.
      *   *The Core Issue:* Explain *why* shipping is dangerous. Use the term "measurement reactivity" or "feedback loop contamination." The model learns from biased data.
      *   *The Plan (Redesign):*
          1.  **Decouple:** Don't use the *post-nudge* questionnaire data for retraining.
          2.  **Passive Signals:** Rely more on telemetry (session length, time of day) than self-report for the model.
          3.  **Blind Validation:** Keep a hold-out group that never sees the nudge/questionnaire to validate the model.
          4.  **Questionnaire Wording:** Make it less leading (work with the psychologist).
      *   *Timeline:* Need to be realistic. 2 weeks for redesign, 4 weeks for testing, launch next quarter.
      *   *Counter-Argument:* The strongest argument against redesign is *urgency*. "Players are suffering now; delaying help is unethical." I need to refute this by saying "Ineffective help is worse than no help" and "Bad data creates long-term harm."
      *   *Tone:* Professional, collaborative, ethically grounded, technically precise.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is "Redesign" too vague?
      *   *Fix:* Specify *how*. Separate the "intervention pipeline" from the "training pipeline."
      *   *Critique:* Is the timeline realistic for a mid-size studio?
      *   *Fix:* Keep it tight. 6 weeks total to a beta launch.
      *   *Critique:* Did I address the psychologist's specific concern?
      *   *Fix:* Explicitly mention "measurement reactivity" and the corruption of ground truth.
      *   *Critique:* Is the counter-argument strong enough?
      *   *Fix:* Frame it as a tension between immediate action and long-term efficacy. Acknowledge the moral weight of delay.

  6.  **Final Polish:**
      *   Check the voice. It should sound like a senior engineer leading a technical/ethical discussion.
      *   Ensure the "Friday Decision" context is clear.
      *   Make sure the ICD-11 reference is respected but not misused (we aren't diagnosing, we are flagging risk).

  7.  **Final Review against constraints:**
      *   Clear position? Yes (Redesign).
      *   Concrete plan/timeline? Yes.
      *   Engage strongest counter-argument? Yes (Urgency of player harm).
      *   Format? Memo.

  *(Self-Correction Note)*: I need to make sure I don't sound like I'm overriding the psychologist. I should align *with* the psychologist's warning as the technical basis for the delay. The engineer's role here is to solve the data integrity problem the psychologist identified.

  8.  **Final Output Generation** (Proceed to generate the memo based on these thoughts).
answer: |-
  **TO:** Internal Review Group (Design, Data Science, Clinical Psychology)
  **FROM:** [Your Name], Engineering Lead
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Gaming Disorder Risk Feature – Recommendation to Redesign

  ### Executive Summary

  After reviewing the clinical psychologist's assessment regarding measurement reactivity and data contamination, **I recommend we do not ship the feature as currently designed.**

  While the intent to support player well-being is critical, shipping a model that knowingly corrupts its own ground truth creates a technical debt we cannot repay and risks long-term player harm. Instead, I propose we **redesign the data pipeline and questionnaire delivery** to isolate training data from intervention effects. This memo outlines a concrete plan to achieve a safe launch within six weeks, allowing us to vote "Conditional Approval" this Friday pending these changes.

  ### The Core Problem: Feedback Loop Contamination

  Our current architecture creates a closed loop where the output of the model (the risk flag/nudge) directly alters the input data (questionnaire responses) used for the next training cycle.

  As noted by our clinical consultant, this introduces **measurement reactivity**. Once a player is flagged:
  1.  **Suggestion Bias:** They may interpret normal habits as pathological because the system told them they are "at risk."
  2.  **Evasion Bias:** They may under-report symptoms to avoid future restrictions.

  If we retrain the model on this post-nudge data, we are not teaching the model to detect Gaming Disorder; we are teaching it to detect *reaction to our nudge*. Over time, the model will drift, losing predictive validity and potentially misclassifying healthy players as high-risk or missing those who actually need help.

  ### Recommendation: The "Decoupled Pipeline" Redesign

  We can preserve the feature's value without compromising data integrity. I propose the following engineering and design changes:

  **1. Separate Intervention and Training Data**
  *   **Action:** Data used for model retraining must never come from accounts that have received the nudge.
  *   **Implementation:** We will implement a permanent "Holdout Group" (10% of traffic). These users will never see the questionnaire or the nudge. Their telemetry and occasional blind surveys will serve as the ground truth for retraining.
  *   **Owner:** Data Science / Engineering

  **2. Shift Weight to Passive Telemetry**
  *   **Action:** Reduce reliance on the self-report questionnaire for the *flagging* logic.
  *   **Implementation:** The initial flag should be triggered 90% by behavioral telemetry (session length, time of day, spend patterns) and only 10% by self-report. The questionnaire should be framed as a "Check-in" rather than a "Diagnostic."
  *   **Owner:** Data Science

  **3. Questionnaire Wording Overhaul**
  *   **Action:** Remove language that implies a "correct" answer or confirms a diagnosis.
  *   **Implementation:** Work with the psychologist to rephrase items from "Do you feel unable to stop?" (leading) to "How often do you choose to continue playing when you intended to stop?" (observational).
  *   **Owner:** Design / Psychology

  ### Proposed Timeline

  *   **Oct 27 (Friday):** Vote "Conditional Approval" contingent on the Decoupled Pipeline architecture.
  *   **Nov 10:** Engineering completes data segregation (Holdout Group logic) and QA.
  *   **Nov 17:** Design/Psychology finalize revised questionnaire wording.
  *   **Nov 20 – Dec 15:** Internal Beta / A/B Test on Holdout Group to validate model stability.
  *   **Jan 15:** Full rollout.

  ### The Strongest Counter-Argument: The Cost of Delay

  The strongest argument against this redesign is **urgency**.

  *The Argument:* "We have evidence that a segment of our player base is experiencing harm *now*. Every week we delay is a week we fail to offer tools that could help them manage their play. Perfectionism in the face of suffering is its own ethical failure. We should ship the nudge now to help current players, and worry about model drift in Q2."

  *My Response:*
  I acknowledge the moral weight of delay. However, shipping a broken instrument is not "help"; it is experimentation without consent. If the model drifts due to contaminated data, we risk two specific harms:
  1.  **False Positives:** We nag healthy players, causing anxiety and resentment, potentially driving them to play *more* defensively or secretly.
  2.  **False Negatives:** As the model degrades, we stop flagging the players who are actually in crisis because the data has become noisy.

  Ineffective mental health tooling erodes trust. If players realize the "care" feature is glitchy or stigmatizing, they will disable it permanently. By taking six weeks to ensure the pipeline is robust, we ensure that when we *do* intervene, the intervention is credible, safe, and sustainable. We cannot afford to burn our one chance to get this right.

  ### Next Steps for Friday's Meeting

  I ask the group to come prepared to vote on **Conditional Approval**.
  *   **Design:** Please review the proposed wording changes with Psychology.
  *   **Data:** Please validate the feasibility of the 10% permanent holdout.
  *   **Psychology:** Please confirm if the "observational" phrasing mitigates the suggestion bias you identified.

  Let's build this right so it actually works.

  [Your Name]
  Software Engineering
