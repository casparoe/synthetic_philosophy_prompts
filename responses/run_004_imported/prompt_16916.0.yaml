      {"name": "Explanation of MEC", "score": 0, "max": 5, "comment": ""},
      {"name": "Explanation of the intertheoretic comparisons problem", "score": 0, "max": 5, "comment": ""},
      {"name": "Evaluation of the moral parliament model", "score": 0, "max": 6, "comment": ""},
      {"name": "Clarity / organization", "score": 0, "max": 4, "comment": ""}
    ],
    "total": "x/20",
    "overall_comment": ""
  }
  ```
