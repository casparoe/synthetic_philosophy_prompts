      *   Let's stick to the binary choice to keep it tight.

  9.  **Word Count Management:**
      *   Need to expand on the internal monologue to hit 1000-1500.
      *   Describe the physical sensation of the paradox. The nausea of logic eating itself.

  10. **Final Polish:**
      *   Check constraints: No Baghdad/Samarra retelling? Check. No neat ending? Check. Focus on reasoning? Check.
      *   Ensure the "predictor" isn't just luck. It must be causal link via information.

