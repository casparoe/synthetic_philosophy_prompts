answer: |-
  The notification on Elias's wrist pulsed a soft, indifferent blue. *Compliance Audit Imminent. Location Verification Required: 00:00.*

  It was 11:14 PM. He had forty-six minutes to be in one place, and the Compliance Bureau's algorithm, the Oracle, would be waiting for him there. The Oracle wasn't magic. It was just math made flesh, a predictive engine so sophisticated it modeled human decision-making with one hundred percent accuracy. If Elias decided to be in his apartment, the Oracle would have already dispatched an auditor to his apartment. If Elias decided to be at the train station, the auditor would be waiting on the platform.

  The rule was simple: You must be where the Oracle expects you. If you are where the Oracle expects you, the audit is routine. If you are not, it is considered evasion. Evasion carried penalties Elias didn't want to contemplate.

  So, he had to be where the Oracle expected him. But the Oracle's expectation was based on what Elias would choose.

  Elias stood in the center of his living room. The carpet was worn thin in a path between the sofa and the kitchenette, a physical map of his previous indecisions. He looked at the door. Leaving meant the train station. Staying meant the apartment.

  *Okay,* he thought. *I'll leave.*

  The moment the thought solidified, a cold knot tightened in his stomach. If he decided to leave, that decision was a data point. The Oracle monitored biometric stress, pupil dilation, micro-movements. It knew he had decided. Therefore, the Oracle now expected him at the station. Therefore, the auditor would be at the station.

  If the auditor was at the station, and Elias went to the station, he would be compliant. That was good. But wait.

  If he knew the auditor would be at the station because he decided to go there, did he actually want to go there?

  No. He wanted to survive. But survival meant being where the auditor was. So he needed the auditor to be where he was.

  *If I go to the station, the auditor goes to the station. So I should go to the station.*

  He reached for his coat. His fingers brushed the fabric.

  *But if I pick up the coat, that confirms the decision. The Oracle sees the coat. The Oracle sends the auditor to the station. But what if I change my mind?*

  If he changed his mind, he would be at the apartment. The auditor would be at the station. That was evasion. That was penalties.

  So he couldn't change his mind. He had to commit.

  He put the coat on. The weight of it felt like a confession. He walked to the door, hand on the latch.

  *Stop,* a voice inside him said. *Why are you at the door?*

  *Because I decided to leave.*

  *So the Oracle knows you're leaving.*

  *Yes.*

  *So the auditor is at the station.*

  *Yes.*

  *So if you stay here, you miss the auditor.*

  *Yes.*

  *So you should stay.*

  Elias took his hand off the latch. He peeled off the coat and dropped it on the floor. He sat on the sofa. The cushions exhaled dust.

  *Okay. I'm staying.*

  He settled back, trying to force his heart rate down. If he stayed, the Oracle would register his calm. It would register his settled posture. It would know he chose the apartment. Therefore, the auditor would come here. Therefore, he would be compliant.

  *But,* the voice whispered, *if you know the auditor is coming here because you decided to stay, isn't staying just as dangerous as leaving?*

  No, not dangerous. Necessary. He had to match the prediction.

  *But the prediction is based on the decision. You just decided to stay. So the prediction is 'Stay'. So the auditor comes here. So you are safe.*

  He closed his eyes. Safety. It felt within reach.

  *Unless,* the voice said, *you decided to stay only because you thought the auditor would come here.*

  Elias opened his eyes. The room seemed to tilt.

  If he chose the apartment because he thought it was the safe move, then the choice was motivated by the desire to match the prediction. But the prediction was based on the choice. It was a snake eating its own tail.

  If he thought, "I will stay to be safe," the Oracle saw that thought. The Oracle updated: *Subject intends to stay.* The auditor was dispatched to the apartment.

  But if the auditor was dispatched to the apartment, was it safe? Yes, because that's where he was.

  *Then why am I sweating?*

  Because the logic was slippery. It felt like standing on a floor that turned to water whenever he put weight on it.

  He stood up again. Pacing. Left, right. Turn. Left, right. Turn.

  *What if I randomize it?*

  He reached into his pocket and pulled out a credit card. Heads, station. Tails, apartment.

  He flipped the card. It spun in the air, a silver blur.

  *Wait.*

  If he decided to trust the card, that was a decision. The Oracle knew he was a man who relied on chance when stressed. The Oracle would predict he would follow the card.

  If the card landed on 'Station', and he went to the station, he was compliant.

  But what if the card landed on 'Station', and he thought, *The Oracle knows I'll follow the card, so the auditor will be at the station, so I should go to the apartment instead?*

  Then he would be evading.

  So he had to follow the card. But to follow the card, he had to decide to follow the card. And the moment he decided to follow the card, the Oracle knew the outcome before the card even hit the floor.

  The card slapped onto the carpet. Heads. Station.

  Elias stared at it.

  *So I go to the station.*

  He bent to pick it up.

  *But if I pick it up, I'm acting on the result. The Oracle saw me look at the result. The Oracle knows I'm going to the station.*

  *So?*

  *So what if I decide not to go?*

  *Then you evade.*

  *So I have to go.*

  *So why are you still standing here?*

  11:38 PM. Twenty-two minutes.

  He walked to the door again. He put his hand on the latch. He could feel the cold metal through his skin. It was a tangible connection to the outside world, to the station, to the auditor.

  *If I open this door, I am confirming the prediction.*

  *Yes.*

  *So I am safe.*

  *Yes.*

  *Then open it.*

  He didn't open it.

  Because if he opened it, he was admitting that he believed the prediction was fixed. But the prediction wasn't fixed until he made it. He was the author of the prediction. Every step he took wrote the sentence that condemned him to be found.

  If he stayed, he wrote "Apartment."
  If he left, he wrote "Station."

  He needed to write a sentence the Oracle hadn't read. But the Oracle read everything, especially the things he wrote himself.

  He turned away from the door. He walked back to the sofa. He sat down.

  *Now I am staying.*

  *So the prediction is Apartment.*

  *So the auditor comes here.*

  *So I am safe.*

  *Unless I only sat down because I thought it was safe.*

  *Which it is.*

  *But only because I thought it was.*

  *Which means the thought caused the safety.*

  *Which means the thought is the variable.*

  *Which means I can't think.*

  Elias stopped breathing for a moment. He tried to empty his mind. He stared at the blank wall. No thoughts. No decisions. Just existence. If he didn't decide, maybe the Oracle couldn't predict.

  But not deciding was a decision. It was a decision to wait. The Oracle knew he was waiting. The Oracle would predict he would wait until the last second and then panic. Where would he panic to? The station.

  *No,* Elias thought fiercely. *I won't panic.*

  *You're thinking about panicking.*

  *Stop it.*

  *You're thinking about stopping it.*

  11:52 PM. Eight minutes.

  He stood up. He walked to the kitchen. He opened a cupboard. He took out a glass. He filled it with water. He drank.

  These were actions. Were they decisions? Or just habits? If they were habits, the Oracle knew them. If they were decisions, the Oracle knew them.

  He put the glass down. It clinked too loudly.

  *Why did I do that?*

  *To calm down.*

  *So you're anxious.*

  *So you're going to leave.*

  *No, I'm staying.*

  *You say staying, but your body is toward the door.*

  He looked at his feet. They were angled toward the exit. He forced them to turn toward the sofa. He sat. He forced his hands into his lap. He forced his eyes to the wall.

  *Now I am staying.*

  *Now the prediction is Stay.*

  *Now the auditor is coming here.*

  *Now I am safe.*

  *Unless I'm only staying because I want to be safe.*

  *Which I do.*

  *Which means I'm trying to match the prediction.*

  *Which means the prediction matches me.*

  *Which means we are locked.*

  11:57 PM.

  Elias stood up. He didn't mean to. His legs just straightened. He walked to the door. He didn't mean to. His body moved.

  *Where are we going?*

  *Away.*

  *Why?*

  *Because staying feels like waiting to be caught.*

  *But the auditor is coming here.*

  *How do you know?*

  *Because we decided to stay.*

  *But we're leaving now.*

  *Then we evade.*

  *Then we die.*

  *Then stay.*

  *Then trapped.*

  His hand touched the latch. The metal was cold. It felt like the only real thing in the room. The logic was a fog, thick and suffocating, but the door was solid.

  If he opened it, he committed. The loop would close. The Oracle would know. The auditor would be there. He would be compliant.

  If he didn't open it, he committed. The Oracle would know. The auditor would be here. He would be compliant.

  Both paths led to the auditor. Both paths led to compliance. Both paths were determined by the step he was about to take.

  *So it doesn't matter,* he thought.

  *But it matters.*

  *Why?*

  *Because if it doesn't matter, why are you hesitating?*

  *Because I want to choose.*

  *You can't choose. You can only reveal.*

  11:59 PM.

  Elias stood with his hand on the latch. His heart hammered against his ribs, a frantic drum counting down the seconds. He knew that in sixty seconds, the audit would begin. The Oracle would lock his location. The auditor would arrive.

  If he was here, the auditor would be here.
  If he was there, the auditor would be there.

  The only way to win was to be where the Oracle said he would be. But the Oracle said he would be where he decided to be.

  He tightened his grip on the latch.

  *If I turn this, I choose.*

  *If I choose, I am known.*

  *If I am known, I am found.*

  *If I am found, I am safe.*

  *So turn it.*

  *But if I turn it because I think I'll be safe, then the safety is contingent on the thought.*

  *And the thought is visible.*

  *And the visibility is the trap.*

  *So don't think.*

  *Don't decide.*

  *Just be.*

  But he couldn't just be. He was a man with a hand on a door, and the clock was ticking, and the logic was spiraling down into a singularity where cause and effect ate each other alive.

  11:59:30 PM.

  He didn't turn the latch. He didn't let go. He stood in the equilibrium, suspended between the apartment and the station, between staying and leaving, knowing that whichever way he fell, he was falling exactly where he was expected to fall, and that knowing it didn't stop the fall, it only made the air feel thin.

  11:59:45 PM.

  His fingers twitched.

  11:59:50 PM.

  He opened his mouth to speak, to say something, anything that wasn't a decision, but no sound came out.

  11:59:55 PM.

  The blue light on his wrist pulsed once, twice, waiting for the final coordinate, waiting for him to finish the sentence he had been writing all night.

  Elias stared at the door. The door stared back.

  11:59:59 PM.
