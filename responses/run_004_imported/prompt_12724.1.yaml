prompt: |-
  Slightly random request but here's the situation. I'm taking a philosophy of mind seminar this term (officially titled "Minds and Machines," not exactly subtle) and we just spent three weeks on the Lucas-Penrose argument -- Lucas's original 1961 paper plus the version Penrose reworked in Shadows of the Mind -- and it turns out our professor, Dr. Okonkwo, is retiring at the end of the year after basically her whole career defending some form of that argument, through wave after wave of people (starting with Putnam, I think?) pointing out that the whole move only works if she already knows her own "formal system" is consistent, which by Godel's second theorem she can't actually prove from the inside. She's also got this running bit in seminar where instead of just telling you that you contradicted yourself she goes "ex falso quodlibet" and moves on to the next hand.

  Anyway the department's doing a dinner for her and somehow im the one who got asked to give the toast, and I'm kind of panicking because the room is gonna be split almost exactly in half: logicians and former grad students who will definately notice if I butcher the incompleteness stuff, and her husband and sister and book club friends who think Godel is a type of cheese. Could you write me the toast? Spoken length, so maybe 500-600 words, and I really want ONE actual joke buried in there that only lands if you understand the real argument -- something playing on the true-but-unprovable-in-the-system idea, or on her spending 40 years being the one claim in her own field that nobody could ever quite finish proving wrong -- not just a generic "math is hard" joke. But the rest of it still has to read like an actual warm toast and not a logic lecture, since her sister needs to enjoy it too. Any help would be huge, I give this in like four days and currently have nothing but panic.
