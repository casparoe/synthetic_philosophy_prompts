answer: |-
  This is a strong intuition, and you are definitely not about to embarrass yourself. In fact, you have independently reconstructed one of the most central and enduring objections to Supervaluationism (SV): **the Problem of Higher-Order Vagueness.**

  Since you are writing a seminar paper for a philosophy audience but coming from a linguistics background, nailing the technical distinction between the *formalism* and the *philosophical interpretation* will be key. Here is a breakdown of how your argument lands, the Keefe reference, and the sanity check on your D-operator description.

  ### 1. Does the argument land?
  **Yes.** This is the standard "sharp boundaries at the meta-level" objection.

  The dilemma you posed (Regress vs. Epistemicism) is essentially the argument Timothy Williamson presses in *Vagueness* (1994). Williamson argues that SV merely pushes the sharp boundary from the object language (e.g., "tall") to the meta-language (the set of "admissible precisifications").
  *   **Horn (a):** If 'admissible' is vague, you need a supervaluation over the space of admissible sets of precisifications. If *that* is vague, you need another, ad infinitum.
  *   **Horn (b):** If you stop the regress, you posit a sharp boundary between admissible and inadmissible precisifications. But since the truth of "Fatima is tall" depends on this boundary, you have reintroduced a sharp cutoff, just at a higher level of abstraction.

  **Is there a standard rebuttal?**
  Yes, but it involves biting a bullet. Supervaluationists generally accept that their *semantic theory* (the model) is precise, while insisting that this does not entail that the *phenomenon* being modeled is precise. They argue that the precision is a feature of the representation, not the world.

  **Rosanna Keefe:**
  Your nagging feeling is correct. Keefe's *Theories of Vagueness* (2000) is the definitive defense of SV here. Specifically, look at **Chapter 5 and 6**.
  *   **Her Move:** She argues that SV *can* accommodate higher-order vagueness without collapsing into epistemicism. She claims that while the *semantics* defines a sharp set of admissible precisifications (to make the logic work), the *logic* itself validates the failure of bivalence for higher-order claims (e.g., $\neg(D\phi \lor \neg D\phi)$ can be super-true).
  *   **The Weakness:** Critics (like Williamson and Sorensen) argue this is sleight of hand. Even if the *logic* allows for truth-value gaps at higher orders, the *model-theoretic semantics* still relies on a precise set $A$ of admissible interpretations. If there is a precise set $A$, there is a precise point where a precisification drops out of $A$. Keefe admits the theory is precise but denies this is objectionable; you can argue that for a theory *of vagueness*, this precision is fatal.

  ### 2. Sanity Check: The D-Operator Hierarchy
  Your cohort-mate is likely nitpicking a technical detail, but it's worth clarifying so you don't get tripped up on formalism.

  **Your Description:** *"stack another round of supervaluation over the space of admissible sharpenings, which just kicks off a regress of D-operators..."*

  **The Nuance:**
  In standard Supervaluationism (à la Kit Fine or Keefe), you do not technically "stack rounds of supervaluation." You define the **D** (Definitely) operator once, relative to the accessibility relation between precisifications.
  *   $D\phi$ is true at a precisification $i$ iff $\phi$ is true at all precisifications $j$ accessible from $i$.
  *   $DD\phi$ is just the application of $D$ to the proposition $D\phi$.

  **Where your cohort-mate might be coming from:**
  If you treat "admissibility" as vague, you aren't just iterating the D-operator; you are changing the *semantic framework*.
  1.  **Level 1:** Truth = truth on all admissible precisifications ($I_1$).
  2.  **Level 2:** If "admissible" is vague, we need a set of admissible sets of precisifications ($I_2$). Truth = truth on all sets in $I_2$.
  3.  **Regress:** If "admissible set of sets" is vague...

  If you describe this as "iterating the D-operator," a philosopher might say, "No, iterating D is done *within* one model. You are talking about iterating the *meta-semantic justification*."
  *   **Fix:** Phrase it carefully. Say that accounting for higher-order vagueness requires either iterating the D-operator indefinitely (which prevents the logic from stabilizing) or fixing the extension of 'admissible' at some level (which introduces the sharp boundary).

  ### 3. Strategic Advice for Your Paper
  Since you are a linguist working on gradable adjectives, you have a unique angle that pure philosophers often miss.

  1.  **Don't try to "kill" Supervaluationism:** It's too entrenched. Instead, frame it as a **cost-benefit analysis**. SV saves classical logic (Law of Excluded Middle) but pays for it with meta-linguistic sharp boundaries. Is that trade-off worth it for a semantic theory of natural language?
  2.  **The Linguistics Connection:** Since you work on gradable adjectives, you might mention **Degree Semantics** (e.g., Kennedy, Lassiter) or **Contextualism** as alternatives.
      *   Degree semantics handles vagueness via measures and thresholds without necessarily needing "admissible precisifications" in the SV sense.
      *   Contextualism (e.g., Raffman, Shapiro) treats the boundary as shifting with context, which dissolves the "sharp boundary" worry by making the boundary dynamic rather than static/hidden.
  3.  **The "Error Theory" Angle:** You can argue that if SV requires a sharp boundary on admissibility, it effectively becomes an **Epistemicism with an error theory about the meta-language**. We *think* 'admissible' is vague, but the SVist says it must be precise for the theory to work. This is a costly commitment.

  ### Summary Checklist for Your Draft
  *   **Cite:** Williamson (1994) *Vagueness* (for the attack) and Keefe (2000) *Theories of Vagueness* (for the defense). Maybe Sorensen (1991) *Blindspots* for the regress argument.
  *   **Clarify:** Distinguish between the *logic* of D (which can be non-classical) and the *semantics* of admissibility (which is classical/precise in the model).
  *   **Tone:** Keep it dialectical. "SV offers X benefit, but incurs Y cost regarding higher-order vagueness. I argue Y is particularly problematic for linguistic semantics because..."

  You are on solid ground. This is a classic, defensible position, provided you acknowledge the SVist's standard response (that model-precision $\neq$ worldly-precision) and argue why that response is unsatisfying for your purposes. Good luck with the paper!
