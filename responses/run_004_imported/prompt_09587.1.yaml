answer: |-
  **London, 1657. A private chamber near Fleet Street.**

  **THOMAS HOBBES** sits at a heavy oak table, a compass and a straightedge laid out with surgical precision before him. **JOHN WALLIS** stands by the window, holding a sheaf of papers covered in algebraic symbols. The air is thick with pipe smoke and unspoken animosity.

  **HOBBES:** You treat my *Six Lessons* as a jest, Mr. Wallis. You and your clique at Gresham College. You publish your *Elenchus*, you mock my quadrature, yet you refuse to engage the foundation. You attack the sum, but ignore the counting.

  **WALLIS:** I engage the foundation, Mr. Hobbes, precisely by showing that your sum is incorrect. If a builder claims to have squared the circle, and his measurements fail when applied to the wall, we do not ask him to justify his trowel. We say the wall does not stand.

  **HOBBES:** (Strikes the table) That is the error of the schoolmen! You mistake arithmetic for geometry. You count shadows and think you hold the substance. My construction stands because it follows the only path to truth: generation. A circle is not a definition scribbled in a book. It is a trace. It is the record of a point moving under constraint. If you cannot describe the motion that creates the magnitude, you do not know the magnitude. You know only a name.

  **WALLIS:** And there we have the root of it. You bind geometry to the physical world. You insist that a mathematical object must be capable of physical construction. But mathematics, sir, is the science of quantity, not of matter. I may define a chiliagon—a thousand-sided polygon. I cannot construct it physically with any precision. Yet I can reason about it, calculate its angles, and know its properties with absolute certainty. Does my inability to draw it negate its existence in the mind?

  **HOBBES:** It negates its existence in *science*. Science is the knowledge of consequences from the generation of things. If I cannot tell you how a thing is made, I cannot tell you what it is. Your chiliagon is a word without a referent. A sound of the tongue. When you define a figure merely by its properties—"a space bounded by a line equidistant from a center"—you speak of a ghost. You have not told me how the line came to be there. You have stipulated a miracle.

  **WALLIS:** I have stipulated a convention. And conventions are the liberty of the mathematician. If I define a quantity by its relation to other quantities, that is sufficient for demonstration. Why must I drag the heavy machinery of kinematics into every proof? Why must I simulate motion when I can simply compare ratios?

  **HOBBES:** Because without motion, you have no cause. And without cause, you have no certainty. You rely on these... symbols. (He gestures disdainfully at Wallis's papers.) This "specious algebra." You replace magnitudes with letters. You calculate with *a* and *b* as if they were coins. But they are not coins. They are nothing. You are shuffling empty signs.

  **WALLIS:** The symbols are not the thing, they are the map. Algebra allows me to see relationships that a diagram obscures. When I solve an equation, I am not shuffling signs; I am tracing the logical dependencies of quantity. It is a universal logic. If I prove that $x^2 = 2$, I have found a ratio, even if I cannot express it as a fraction of whole numbers.

  **HOBBES:** And there you reveal the absurdity. $\sqrt{2}$. You call it a number. It is not a number. It is a mark of your own failure. It says, "I cannot find the ratio." To treat this defect as a quantity is to build a palace on a foundation of ignorance. A line is commensurable with itself. If your algebra tells you otherwise, your algebra is lying.

  **WALLIS:** The line does not care for your comfort, Mr. Hobbes. The diagonal of a square *is* incommensurable with its side. Nature presents us with this. To deny it because it does not fit your arithmetic of integers is to deny the evidence of geometry itself. I accept the quantity because the proof demands it, not because I can write it as a fraction.

  **HOBBES:** You accept it because you have abandoned the requirement of construction. You are content with "truths" that cannot be exhibited. This is why you defend the method of indivisibles. Cavalieri's ghosts.

  **WALLIS:** (Stiffens) The method of indivisibles has opened doors Archimedes could not unlock. It allows us to measure the infinite.

  **HOBBES:** It allows you to speak nonsense. You claim a surface is made of lines. But a line has no breadth. Add a thousand lines of no breadth, you have no breadth. Add a million, an infinity—you still have no breadth. To say an area is a "sum of lines" is to say a body is made of ghosts. It is a category error.

  **WALLIS:** You take it too literally. We do not mean the lines are physical threads. We mean that the ratio of the sums of the lines is as the ratio of the areas. It is a shorthand for limits. It is a way of comparing the growth of magnitudes.

  **HOBBES:** It is a way of hiding your ignorance behind the infinite. If you cannot show me the step-by-step generation of the area, if you must leap over the finite to grasp the infinite, you are not doing geometry. You are prophesying. And I have little patience for prophets.

  **WALLIS:** And I have little patience for gatekeepers who would lock the doors of discovery because the key does not look like a compass. You say motion is the only legitimate cause. But consider this: If I can prove a theorem using algebra and indivisibles, and that theorem allows an engineer to build a bridge that stands, or an astronomer to predict an eclipse... in what sense is my method illegitimate?

  **HOBBES:** In the sense that you do not know *why* it works. You have found a rule, perhaps, but you have not found the science. You are like a man who knows that pressing a lever opens a gate, but does not know the mechanism of the latch. You have operational success, Mr. Wallis, but you lack philosophical certainty. And without certainty, there is no science. There is only guesswork that has not yet failed.

  **WALLIS:** Certainty is found in the consistency of the result, not the metaphysics of the method. If my definitions are clear, and my logic is valid, the conclusion is certain. You demand that every definition be a physical recipe. But mathematics is a realm of the intellect. We deal with abstractions. When I speak of a point, I do not mean a dot of ink. I mean a position. When I speak of a line, I mean length without breadth. These are mental conceptions.

  **HOBBES:** Mental conceptions derived from where? From the senses. From the observation of bodies. If you sever the link to body and motion, your "mental conceptions" float away into nonsense. You say "length without breadth." Show it to me. You cannot. It is an abstraction divorced from reality. Geometry is the only science it has pleased God to bestow upon man, but only because it is the science of *making*. To define is to construct.

  **WALLIS:** To define is to distinguish. I distinguish a circle from a square by its properties. That is sufficient. If you insist that I must simulate the drawing of the circle to reason about its area, you cripple the mind. You forbid us from thinking about the finished structure until we have laid every brick. Sometimes, sir, we must look at the blueprint to understand the building.

  **HOBBES:** And if the blueprint describes a building that cannot be built? If your algebra leads you to a quantity that cannot exist in nature? Then you have led young men into a labyrinth of words. You are creating a new scholasticism. Instead of angels dancing on pinheads, we have indivisibles summing to areas. It is the same vanity.

  **WALLIS:** It is not vanity. It is progress. You look backward to the Greeks and see a golden age we must not disturb. I look forward. The algebra of Viète, the indivisibles of Cavalieri—these are tools that extend our reach. You accuse me of lacking certainty. But look at your own quadrature. You claim certainty because you followed your rule of motion. Yet the experts of Europe show your numbers do not hold. Where is your certainty then?

  **HOBBES:** (Leans forward, eyes hard) The numbers are secondary. The *method* is secure. If my arithmetic is in error, it is a mistake of reckoning, correctable. But your method is in error of *principle*. You can calculate correctly and still know nothing. If you build your house on the convention that lines have breadth when it suits you, and no breadth when it does not, you may get a roof over your head, but you do not understand the house. I would rather be right about the cause and wrong about the sum, than right about the sum by a lucky accident of symbols.

  **WALLIS:** But mathematics is not about "cause" in your physical sense. It is about necessary consequence. If the definitions are granted, the conclusion follows. That is the certainty. Not the physical origin of the figure, but the logical inevitability of the proof.

  **HOBBES:** Logical inevitability from false premises is still falsehood. And your premises—that you can sum the unsummable, that you can treat symbols as magnitudes—are false because they have no genesis in body.

  **WALLIS:** They have genesis in the mind. And the mind, Mr. Hobbes, is where the mathematics happens. Not in the compass. Not in the ink.

  **HOBBES:** The mind is nothing but motion in the head. If the motion does not correspond to the motion outside, it is hallucination.

  **WALLIS:** (Sighs, gathering his papers) We shall not agree. You seek to anchor mathematics in the earth. I seek to let it sail on the sea of abstraction.

  **HOBBES:** And I tell you, the sea has no bottom. You will sail until you fall off the edge.

  **WALLIS:** And I tell you, Mr. Hobbes, that while you are checking the timber of your ship, others are already mapping the new world. History will judge which method yielded the fruit.

  **HOBBES:** History judges truth, Mr. Wallis. Not utility. There is a difference.

  **WALLIS:** In mathematics, sir, they are often the same thing.

  *Wallis bows stiffly and turns to the door. Hobbes watches him go, then looks down at his compass. He opens and closes it, testing the hinge, ensuring the motion is smooth, the generation pure. He does not look at the numbers on the page.*
