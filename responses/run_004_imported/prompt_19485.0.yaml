answer: |-
  (Stand up, clink glass gently. Smile at the room, acknowledging both sides.)

  Hi everyone. For those who don't know me, I'm [Your Name], and I have the distinct honor of being Dana's Maid of Honor.

  Now, looking around this room, I realize we have a bit of a split audience. On one side, we have family and friends who know Dana as the woman who loves hiking, terrible puns, and Theo. On the other side, we have her philosophy cohort, who know Dana as the woman who spent the last five years obsessing over *mereology*.

  For the family: Mereology is the study of parts and wholes. The big puzzle Dana solved for her PhD is called the "Special Composition Question." It asks: When do a bunch of separate things stop being just a pile of stuff, and actually become *one* new thing? Like, when does wood arranged table-wise actually become a Table?

  For the philosophers: You know the literature. Most people say "always" or "never." But Dana? Dana is a van Inwagen gal. She holds that composition only occurs when the activity of the parts constitutes a *life*.

  (Look at Dana and Theo)

  Now, this creates a specific ontological problem for a wedding. Because if you follow Dana's own thesis, signing a marriage license doesn't actually make Dana and Theo "one." A piece of paper doesn't constitute a life. Legally, sure, they're married. But metaphysically? According to the bride's own dissertation, they are still just two distinct organisms sitting next to each other.

  Dana has joked for years that by her own standards, they don't truly "compose" a unit until their lives are properly tangled. Until their activities are so interwoven that they aren't just two people sharing a space, but two parts constituting a single, shared existence.

  And here is the thing that makes this toast warm instead of just a lecture: Watching them together, I don't need a PhD to see that the composition has already happened.

  I see it in the way they finish each other's sentences. I see it in the way they navigate a crisis as a single unit. I see it in the quiet, mundane Tuesday nights that add up to something much bigger than the sum of their parts. They aren't waiting for the certificate to become a team. They are already doing the work that van Inwagen says matters. They are building a *life*.

  So, for the philosophers in the room: You can rest easy knowing the ontology is sound. Their joint activity *does* constitute a life.
  And for the family: You can rest easy knowing that even if the wood doesn't make a table, these two make a hell of a home.

  Dana, you spent years studying when parts become a whole. Today, you don't have to study it anymore. You just get to live it.

  Please raise your glasses. To Dana and Theo: May your parts always add up to a life worth living. To the happy couple!
