  Last cycle revealed a structural flaw in our voting process. We promoted a candidate who cleared each gate by majority (2-1), yet every single reviewer had a "no" on at least one gate. Individually, we all would have voted "no" on the promotion; collectively, we voted "yes." This is a classic voting paradox that undermines our calibration integrity and creates outcome misalignment.

  I propose we shift to **Individual Holistic Voting** for the next cycle. Under this model, each committee member casts a single Yes/No vote on the promotion itself, rather than voting gate-by-gate. The promotion passes only if 2 of 3 reviewers vote "Yes" on the packet.

  I am not suggesting we abandon the rubric. The current gate-by-gate system has strengths. It forces us to engage with criteria (Scope, Execution, Influence) rather than "vibing" an overall verdict. It also prevents a single reviewer from tanking a packet based on a narrow objection unrelated to the core bar. We must preserve these benefits.

  Holistic voting achieves this while fixing the aggregation error. Reviewers will still be required to score all three gates internally to justify their verdict. If you vote "Yes," you are asserting the candidate meets the bar across the board, not just on average. This aligns accountability: if a candidate succeeds, every "Yes" voter owns that decision. It eliminates the scenario where we collectively promote someone none of us endorse.

  To address the "harsh reviewer" concern, our calibration discussion will focus on whether a gate "no" is disqualifying. The gates become diagnostic tools rather than binary switches. We discuss where the gaps are, but the vote reflects our holistic judgment of readiness.

  Let's use Friday's sync to finalize this workflow. This tweak ensures our outcomes match our individual judgments while maintaining rubric rigor.

