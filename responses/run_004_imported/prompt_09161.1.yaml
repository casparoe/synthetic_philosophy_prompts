      *   **Problem:** The current promotion voting system (gate-by-gate majority) led to a candidate being promoted despite every single reviewer having a "no" vote on at least one gate, meaning every reviewer individually would have voted "no" on the overall promotion if asked directly. This is a classic voting paradox (similar to Condorcet's paradox or doctrinal paradox).
      *   **Goal:** Write a short memo (~300 words) to circulate before the calibration sync.
      *   **Task:** Pick one concrete way to run votes going forward and argue for it.
      *   **Constraint 1:** Must take the case for gate-by-gate voting seriously (acknowledge its benefits: rubric engagement, preventing single-reviewer vetoes on unrelated criteria).
