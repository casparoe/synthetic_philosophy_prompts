prompt: |-
  This is gonna sound like a wierd question but its been bugging me since our last promo cycle. I sit on the 3-person committee that calibrates staff-level promo packets on my team. We score each packet against 3 gates -- Scope, Execution, Influence -- and you need majority yes (2 of 3 of us) on EACH gate separately to pass overall. Last cycle a candidate went 2-1 yes on all three gates individually, so by the rule she cleared the bar and got promoted. Afterward I compared notes with the other two reviewers and realized: if you'd just asked each of us 'promote, yes or no' on the whole packet, all three of us would've said no -- I was the no on Influence, one reviewer was the no on Scope, the other was the no on Execution. So gate-by-gate we said yes, but a plain up-or-down poll of the same 3 people on the same packet would've been unanimous no. Everyone I've mentioned this to just shrugs: 'the gates are the gates.' We've got a calibration sync Friday to lock the process for next cycle, and I want to bring something more solid than a gut feeling. Can you write a short memo (~300 words, something I could actually circulate) that picks one concrete way to run these votes going forward and argues for it, and that takes the case for gate-by-gate voting seriously -- it forces reviewers to engage with the rubric instead of just vibing an overall verdict, and stops one harsh reviewer from tanking someone over something unrelated to the criteria -- instead of just brushing it aside?
