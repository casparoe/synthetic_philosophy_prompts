      *   The current system uses a "conjunction aggregation" (must pass Gate A AND Gate B AND Gate C) where each gate is decided by majority vote.
      *   The paradox observed is the "Doctrinal Paradox" in judgment aggregation.
      *   Option A: Keep gate-by-gate majority (current).
      *   Option B: Individual overall verdicts (each reviewer decides yes/no based on all gates, then majority wins).
      *   Option C: Hybrid/Modified gate system (e.g., unanimous gate passing, or individual gate passing then overall majority).

      *The prompt asks me to "pick one concrete way to run these votes going forward and argues for it."*
      *It also says "takes the case for gate-by-gate voting seriously... instead of just brushing it aside."*
      *This implies I should probably argue *for* a change (since the current system produced a counter-intuitive result), but acknowledge why the current system exists. Or, I could argue *for* keeping the gate system but tweaking it to avoid the paradox.
      *However, the most robust solution to the "unanimous no on overall, but yes on promotion" paradox is to shift to **Individual Overall Verdicts** (each reviewer decides pass/fail based on the rubric, then we take the majority of those overall decisions). This aligns the outcome with individual accountability.
      *Alternatively, I could argue for **Unanimous Gate Passing** (if any reviewer says no on a gate, it fails). But that might be too harsh (one harsh reviewer tanking someone).
      *The prompt mentions: "stops one harsh reviewer from tanking someone over something unrelated to the criteria" as a benefit of gate-by-gate. So I need to preserve the benefit of rubric specificity without the paradox.

      *Best Approach:* Argue for **Individual Holistic Voting with Rubric Anchoring**. Each reviewer must vote Yes/No on the *whole packet*, but must justify based on the 3 gates. This solves the paradox (if all 3 say no, candidate doesn't pass) while keeping rubric engagement.
