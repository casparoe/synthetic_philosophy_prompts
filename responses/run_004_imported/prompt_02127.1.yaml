prompt: |-
  I'm putting together a graduate seminar on medieval theories of political resistance, and Aquinas's remarks on tyrannicide have turned out to be far less tidy than the usual textbook gloss suggests. A student last week cited him, in the same breath as John of Salisbury's Policraticus, as just another medieval authority who straightforwardly sanctioned killing a bad ruler, and I realized I couldn't give a confident answer about whether that does justice to the primary texts. I'd like your help working through the question properly, in essay form.

  Here is the difficulty as I see it. In the youthful Commentary on the Sentences (Book II, distinction 44, question 2, article 2 — the article that asks whether Christians are bound to obey secular power, "and especially tyrants"), Aquinas seems to endorse, almost in passing, the claim that a man who kills a tyrant to free his country is to be praised and rewarded — though it has long been disputed whether he's asserting this in his own voice or simply relaying a view he found in Cicero. Compare this with the later De Regimine Principum, where, in the chapter on safeguarding a kingdom against tyranny (editions differ on the exact numbering; it's usually somewhere around Book I, chs. 6–7), he raises the biblical precedent of Ehud's killing of Eglon, king of Moab, apparently to endorse it, and then immediately takes it back: Eglon, he points out, was a foreign oppressor of Israel, so Ehud really killed an enemy rather than assassinated a domestic ruler; he pairs this with the counter-example of the assassins of King Joash, who were punished despite Joash's own apostasy. He concludes that a private citizen who moves against a tyrant on his own initiative endangers the whole community, and that dealing with tyranny belongs to public authority. That restriction fits with two further passages: his aside in the Summa (II-II, q. 42, a. 2, ad 3) that disturbing a tyrannical regime is not itself the sin of sedition, and his general doctrine on lawful killing (II-II, q. 64, a. 3), where he compares putting evildoers to death to a physician amputating a diseased limb — a task for whoever has charge of the whole body, i.e., public authority, and never a private individual acting alone.

  Write me an essay that reaches an actual verdict on how these passages fit together, rather than resting on "the texts are ambiguous." Specifically: is there any sense in which Aquinas's considered doctrine licenses a private citizen to kill a tyrant, and if so, which kind — a bare usurper with no legitimate title at all, as against a duly established ruler who has simply become oppressive? Or does his mature position restrict all legitimate killing of tyrants, of either kind, to public or communal authority, in which case the Sentences passage needs to be explained away rather than reconciled with the rest? Please say explicitly how much weight the usurper/oppressor distinction can really bear here, given that Aquinas's own handling of Ehud suggests the distinction doing the real work in his mind may be between a foreign enemy and a domestic ruler rather than between two kinds of tyrant. You may bring in how later commentators such as Cajetan or Suárez read him if it helps sharpen your case, but I want the essay to defend your own reading of Aquinas rather than survey the wider scholastic debate, and I want it to end with a clear, defensible answer, even if that answer has to be hedged or conditional.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** Aquinas's doctrine on tyrannicide/political resistance.
      *   **Problem:** The standard textbook gloss (Aquinas = pro-tyrannicide) is too simple. There are apparent contradictions between early (*Sentences*) and later (*De Regimine*, *Summa*) works.
      *   **Specific Texts to Address:**
          *   *Commentary on the Sentences* (II, d. 44, q. 2, a. 2): Seemingly praises killing a tyrant.
          *   *De Regimine Principum* (I, ch. 6-7): Discusses Ehud/Eglon, distinguishes foreign vs. domestic, warns against private initiative.
          *   *Summa Theologiae* (II-II, q. 42, a. 2, ad 3): Disturbing a tyrant isn't sedition.
          *   *Summa Theologiae* (II-II, q. 64, a. 3): Lawful killing requires public authority.
      *   **Task:** Write an essay reaching an *actual verdict*. Avoid "it's ambiguous."
      *   **Key Questions to Answer:**
          *   Does Aquinas ever license a *private citizen* to kill a tyrant?
          *   Does the usurper vs. established ruler distinction matter?
          *   Does the foreign vs. domestic distinction (Ehud) matter more?
          *   How do we explain the *Sentences* passage in light of the mature work?
      *   **Constraint:** Defend *my* reading, not just survey commentators (though Cajetan/Suárez can be used for support). End with a clear, defensible answer.

  2.  **Deconstruct the Texts & Develop a Thesis:**
      *   *Sentences:* This is early (1250s). He is commenting on Peter Lombard. The specific line about praising the tyrannicide is often attributed to Cicero (*De Officiis*). Even if Aquinas doesn't explicitly reject it here, it lacks the nuance of his mature political philosophy. It should be treated as a *sed contra* or a reported opinion that gets refined later.
      *   *De Regimine:* This is the crucial political text. He explicitly curtails the Ehud precedent. Eglon was a *foreign* oppressor. Joash's killers were punished. Conclusion: Private initiative is dangerous. Public authority must act.
      *   *Summa (Sedition):* Overthrowing a tyrant isn't sedition *if* the tyrant is the one actually causing the sedition (discord). This justifies resistance but doesn't specify *who* resists.
      *   *Summa (Killing):* Only public authority can kill. A tyrant, by definition, disrupts the public good. A private person killing him usurps public authority.
      *   *Thesis:* Aquinas's mature position is a firm rejection of *private* tyrannicide. The *Sentences* passage is an undeveloped inheritance from Cicero that he corrects in *De Regimine* and the *Summa*. The distinction that matters is not usurper vs. oppressive ruler, but private vs. public authority. Even a usurper cannot be killed by a private individual *unless* that individual is acting as an agent of a higher public authority (which effectively makes it public execution, not assassination). The Ehud case is the exception that proves the rule: it was war, not police action.

  3.  **Outline the Essay:**
      *   **Title:** Needs to be academic and precise.
      *   **Introduction:** State the problem (textbook simplification vs. textual complexity). State the thesis (Aquinas systematically closes the door on private tyrannicide; the *Sentences* is a youthful artifact; the core principle is the monopoly of public authority on lethal force).
      *   **Section 1: The *Sentences* and the Ciceronian Inheritance.** Analyze II, d. 44. Acknowledge the pro-tyrannicide sentiment but contextualize it as commentary on Lombard/Cicero, not independent political theory. It lacks the "public authority" constraint developed later.
      *   **Section 2: The *De Regimine* Correction.** Analyze the Ehud/Joash contrast. Explain why Ehud doesn't work as a precedent for domestic assassination (foreign enemy vs. domestic ruler). Emphasize the danger of private initiative (greater tyranny often follows).
      *   **Section 3: The *Summa* and the Principle of Public Authority.** Connect q. 64 (killing) and q. 42 (sedition). Show how the "physician amputating a limb" analogy requires the physician to have charge of the body. A private citizen has no such charge.
      *   **Section 4: Addressing the Usurper Distinction.** Does a usurper change things? Some later scholastics said yes. Does Aquinas? Argue that for Aquinas, even a usurper, once in possession, creates a public order that only a higher public authority can remove. Private violence remains illicit.
      *   **Conclusion:** Deliver the verdict. No private tyrannicide. Resistance is a public act. The *Sentences* is superseded.

  4.  **Drafting - Key Arguments & Nuances:**
      *   *Nuance on "Public Authority":* Who constitutes public authority in *De Regimine*? It's the community or a superior lord (like the Emperor over a King). It's *not* a lone vigilante.
      *   *Nuance on Ehud:* The prompt asks specifically about the foreign vs. domestic distinction. I need to make sure I don't gloss over this. Aquinas uses Ehud to show that *sometimes* killing a ruler is okay, but *only* when it's essentially an act of war against an occupier, not a judicial execution of a sovereign.
      *   *Nuance on the Verdict:* I need to be firm. "Aquinas does not license private tyrannicide." I can acknowledge that he licenses *resistance*, but resistance $\neq$ assassination by a private hand.
      *   *Handling the *Sentences*:* Don't just say "he changed his mind." Say "he refined his understanding of the relationship between individual morality and political ontology." The *Sentences* treats it as a moral act of virtue; the *Summa* treats it as a jurisdictional act of authority.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is it fair to dismiss the *Sentences*?
      *   *Correction:* It's not dismissing, it's prioritizing the mature systematic theology. The *Sentences* is a commentary where he often lists opinions. The *Summa* is his own *responsio*. The weight of evidence lies with the *Summa* and *De Regimine*.
      *   *Critique:* What about the usurper?
      *   *Correction:* Aquinas doesn't explicitly dwell on the "usurper vs. legitimate" distinction in the context of *killing* as much as later Jesuits did. For Aquinas, the key is who has the *jurisdiction* to punish. If a ruler is a usurper, he lacks title, but a private individual still lacks the commission to punish. I need to make sure I don't attribute Suárez's view to Aquinas. I will argue that for Aquinas, the "public authority" requirement swallows the "usurper" distinction regarding *private* action.

  6.  **Final Polish:**
      *   Check tone: Academic, rigorous, suitable for a graduate seminar context.
      *   Check citations: Ensure the distinctions (d., q., a.) are accurate based on the prompt's data.
      *   Check the verdict: Make sure the conclusion is unmistakable.

  7.  **Final Review against Prompt Requirements:**
      *   Essay form? Yes.
      *   Actual verdict? Yes.
      *   Address *Sentences*, *De Regimine*, *Summa* (Sedition & Killing)? Yes.
      *   Address Usurper vs. Oppressive? Yes.
      *   Address Foreign vs. Domestic (Ehud)? Yes.
      *   End with clear answer? Yes.

  *(Self-Correction Note on De Regimine Authorship)*: Scholars sometimes dispute the authorship of *De Regimine Principum* (Books II-IV are definitely Ptolemy of Lucca). However, Book I is generally accepted as Aquinas. The prompt treats it as Aquinas, so I will proceed with that understanding, focusing on Book I.

  *(Refining the "Verdict")*: The verdict should be: Aquinas prohibits private tyrannicide. Legitimate removal requires public authority (community or superior). The *Sentences* is a youthful, unrefined position that is effectively overruled by his mature doctrine on jurisdiction and the common good.

  Let's write.
answer: |-
  **The Sword of Public Justice: Aquinas on Tyranny, Authority, and the Illegitimacy of Private Tyrannicide**

  The image of Thomas Aquinas as a sanctioner of tyrannicide is a persistent fixture in the history of political thought, often marshaled to demonstrate that medieval political theory contained a robust right of revolution. This reading relies heavily on a selective gloss of his early *Commentary on the Sentences*, where he appears to praise the slayer of a tyrant. However, a rigorous examination of Aquinas's mature political theology—specifically *De Regimine Principum* and the *Summa Theologiae*—reveals a far more restrictive doctrine. The textbook consensus that Aquinas straightforwardly licenses the killing of bad rulers by private citizens does not survive contact with the textual evidence. While Aquinas certainly allows for the *removal* of a tyrant, his mature work systematically closes the door on *private* tyrannicide. The apparent contradiction between his early and later works is best resolved not by harmonizing them, but by recognizing that Aquinas's developing understanding of public authority subsumed his earlier Ciceronian instincts. The verdict is clear: for the mature Aquinas, the lethal removal of a tyrant is an act of public jurisdiction, never a private moral virtue.

  To understand the evolution of Aquinas's thought, one must begin with the problematic passage in the *Commentary on the Sentences* (II, d. 44, q. 2, a. 2). Here, addressing whether Christians must obey secular powers, Aquinas considers the case of a tyrant who seizes power by force or rules for private gain rather than the common good. He writes that such a ruler does not merit obedience, and adds that "he who kills a tyrant to free his country is praised and rewarded." Superficially, this is the smoking gun for the pro-tyrannicide reading. However, context is crucial. This text is from the 1250s, prior to Aquinas's full engagement with Aristotle's *Politics* and before the composition of the *Summa*. In this passage, Aquinas is commenting on Peter Lombard, and the specific sentiment regarding the praise of the tyrannicide is widely acknowledged by scholars to be a citation of Cicero's *De Officiis*. Aquinas does not explicitly claim this as his own *responsio* in the robust systematic sense he later employs in the *Summa*. It represents a youthful inheritance of classical republicanism that he had not yet fully integrated into a Christian theology of jurisdiction. To treat this as his considered doctrine is to ignore the significant theoretical architecture he builds in the subsequent two decades.

  That architecture is erected most clearly in *De Regimine Principum* (Book I, chapters 6–7). Here, Aquinas confronts the practical question of how to safeguard a kingdom against tyranny. He explicitly raises the biblical precedent of Ehud killing Eglon, King of Moab (Judges 3), which had traditionally been the scriptural warrant for tyrannicide. In a move that decisively narrows the scope of legitimate violence, Aquinas dismantles the precedent. He argues that Eglon was not a true domestic ruler but a foreign oppressor holding Israel in captivity; therefore, Ehud's act was one of war against an enemy, not the judicial execution of a sovereign. Aquinas contrasts this with the assassins of King Joash (2 Kings 12). Joash was an apostate and a bad ruler, yet those who killed him were punished by divine authority. Aquinas draws a sharp lesson from this juxtaposition: "It is not for private presumption to kill such tyrants."

  The reasoning in *De Regimine* is sociological as well as theological. Aquinas argues that private attempts at tyrannicide usually fail to liberate the community and instead expose it to greater danger. A private killer, lacking the support of public authority, often provokes the tyrant to greater cruelty or creates a power vacuum that invites further instability. More importantly, this passage introduces the distinction that does the real work in Aquinas's mature thought: not the distinction between a "usurper" and an "oppressive ruler," but the distinction between a *foreign enemy* and a *domestic ruler*. Even a bad domestic ruler holds a public office that integrates him into the structural unity of the community. To kill him is to attack the body politic itself unless one acts *for* the body politic. The Ehud case is permissible only because Eglon stood outside the covenant community of Israel; he was an occupier, not a head of the body. This distinction undermines the utility of the usurper/oppressive ruler binary for licensing private violence. Even if a ruler is a usurper, once he is functioning as the head of the community, removing him requires a mechanism that represents the community, not the whim of an individual.

  This restriction is codified in the *Summa Theologiae*, where Aquinas's moral theology and political theory reach their synthesis. In II-II, q. 42, a. 2, ad 3, Aquinas addresses sedition. He argues that disturbing a tyrannical regime is not sedition, because the tyrant is the one who has already sown discord by ruling for private gain rather than the common good. This passage is often cited to justify resistance. However, it must be read in concert with II-II, q. 64, a. 3, which addresses the conditions under which it is lawful to kill a sinner. Here, Aquinas employs his famous analogy of the physician amputating a diseased limb to save the body. Crucially, he specifies that this power belongs "not to a private person, but to a public authority, to whom care of the common good has been committed."

  The logic of the *Summa* renders private tyrannicide incoherent. If killing a malefactor is analogous to amputation, it is a judicial act, not an act of self-defense or private vengeance. A private citizen has no commission to amputate the "head" of the political body. To do so is to usurp the very public authority that the tyrant is misusing. If a private individual kills a tyrant, they are not acting as a physician to the body politic; they are acting as a disease within it, introducing the principle that private judgment supersedes public order. Aquinas's allowance for resistance in q. 42 is therefore an allowance for *public* resistance. It legitimizes the *act* of removal but restricts the *agent* of removal to those with public standing. This resolves the tension with *De Regimine*: the community, or a superior authority (such as an emperor over a king), may depose a tyrant, but a private subject may not.

  Does the distinction between a usurper and a legitimate-but-oppressive ruler save the possibility of private tyrannicide? Later scholastics, such as Suárez and Mariana, would argue that a usurper lacks true title and may therefore be killed by any private citizen. However, attributing this view to Aquinas is anachronistic. Aquinas's focus is consistently on the *function* of authority and the preservation of the common good. In *De Regimine*, he advises that if a tyranny is not excessive, it is better to endure it than to risk greater turmoil through resistance. This prudential counsel applies regardless of the ruler's title. For Aquinas, the danger of private violence lies in the dissolution of the legal order itself. Even a usurper, once established, creates a de facto public order. To allow private individuals to judge the legitimacy of that order and execute judgment lethally is to invite the war of all against all. The "public authority" requirement in *Summa* II-II, q. 64 is absolute regarding lethal force; it admits no exception for the private citizen, regardless of the tyrant's legal title. The only exception remains the Ehud case: the target is not a ruler within the community, but an enemy outside it.

  How, then, do we explain the *Sentences* passage? It must be read as a *dictum probandum* (a proposition to be proved) or a reported opinion that Aquinas subsequently refined. In the economy of Aquinas's intellectual development, the *Sentences* represents a stage where he had not yet fully articulated the metaphysical necessity of public authority for the administration of justice. By the time of the *Summa*, the principle that justice is a public virtue, administered by public persons, is non-negotiable. The *Sentences* gloss is not a counter-weight to the *Summa*; it is a precursor that was corrected by it. To privilege the *Sentences* over the *Summa* is to prioritize the apprentice over the master.

  Therefore, the verdict on Aquinas's doctrine of political resistance must be precise. Aquinas does not teach a right of private tyrannicide. He teaches a right of public deposition. A tyrant may be removed, but only by an authority that represents the whole community or by a superior power within the political hierarchy. The distinction between a usurper and an oppressive ruler does not license private violence in Aquinas's mature thought; only the distinction between a domestic ruler and a foreign occupier (as in the case of Ehud) creates a context where killing a ruler is not an act of sedition or usurpation of justice. The *Sentences* passage, while historically significant for the reception of Aquinas, does not reflect his considered theological position.

  In conclusion, the graduate student who cites Aquinas alongside John of Salisbury as a straightforward sanctioner of tyrannicide is repeating a historiographical error. John of Salisbury, in the *Policraticus*, indeed offers a more open endorsement of killing tyrants, viewing them as public enemies whom any faithful subject may strike down. Aquinas, however, imposes a rigorous jurisdictional constraint that John lacks. For Aquinas, the tyrant is a diseased head, but the knife must be held by the public hand. To allow a private hand to wield it is to kill the patient in the process of curing him. Thus, Aquinas's mature position restricts all legitimate killing of tyrants to public or communal authority. The *Sentences* passage must be explained away as an unrevised inheritance from Cicero, superseded by the systematic doctrine of the *Summa* and *De Regimine*. There is no sense in which Aquinas's considered doctrine licenses a private citizen to kill a tyrant, whether usurper or established. The sword of justice belongs to the public alone.
