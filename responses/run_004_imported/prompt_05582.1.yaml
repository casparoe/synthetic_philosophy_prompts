answer: |-
  This is a fantastic question because it cuts right to the bone of a common historical misconception. Because Neurath and Wittgenstein were both associated with the Vienna Circle (loosely speaking) and both used the word "picture" (*Bild*), it is tempting to assume they are playing the same game with different pieces.

  They are not. They are playing entirely different sports.

  To give you the argued answer your editors want: **Neurath and Wittgenstein are operating on fundamentally incompatible theories of representation.** Wittgenstein's picture theory is a metaphysical claim about the *ontology of truth* (how language hooks onto reality), while Neurath's ISOTYPE is a pragmatic claim about the *sociology of knowledge* (how humans process information).

  Furthermore, regarding your specific context—the history of infographics and the conveyance of objective social knowledge—**Neurath offers the vastly more defensible account.** Wittgenstein's theory is philosophically elegant but practically inert (and was eventually abandoned by Wittgenstein himself), whereas Neurath's conventionalism anticipates modern semiotics and cognitive science.

  Here is the breakdown of why they differ, and why Neurath wins the argument for your piece.

  ### 1. The Ontological vs. The Pedagogical "Picture"

  The confusion stems from the word *Bild*. But the mechanism of representation is opposite in each case.

  **Wittgenstein (*Tractatus*): Logical Isomorphism**
  For early Wittgenstein, a "picture" is not necessarily visual. A musical score, a groove on a record, and a spoken sentence are all "pictures."
  *   **The Mechanism:** *Isomorphism.* A proposition pictures a state of affairs because it shares the same **logical form**. If the fact is "A is to the left of B," the proposition must have a structure where the sign for A stands in a specific relation to the sign for B.
  *   **The Commitment:** This is a realist, correspondence theory of truth. The picture works because the world *has* a logical structure, and language *mirrors* it. It is not up to us. We cannot choose a different logical form any more than we can choose for 2+2 to equal 5.
  *   **The Goal:** To define the limits of meaningful language. If it doesn't picture a state of affairs, it's nonsense (which includes ethics, aesthetics, and most philosophy).

  **Neurath (ISOTYPE): Cognitive Conventionalism**
  For Neurath, a "picture" is explicitly visual and tactile.
  *   **The Mechanism:** *Transformation.* Neurath called his team "transformers." They took statistical data and transformed it into visual tokens.
  *   **The Commitment:** This is a **conventionalist** and **physicalist** theory. Neurath does *not* believe the icon of a man mirrors the "logical form" of a population. He believes it is a tool chosen because human brains process repeated icons better than abstract numbers. The sign is arbitrary (we could use a star instead of a man), but it is *optimized* for universal comprehension.
  *   **The Goal:** To democratize knowledge. To bypass the "metaphysical mischief" of words (which vary by language and class) and create a unified visual language for social planning.

  **The Crucial Divergence:**
  Wittgenstein believes the picture relationship is **necessary** (dictated by the structure of reality). Neurath believes the picture relationship is **contingent** (dictated by human psychology and social need).

  ### 2. Convention vs. Mirroring (Answering your specific doubt)

  You asked: *Is Neurath's picture language ultimately just a system of conventional signs... or is it secretly doing something closer to what Wittgenstein wants?*

  It is unequivocally the former. Neurath was a staunch anti-metaphysician. He would have rejected Wittgenstein's "logical form" as exactly the kind of invisible, mystical entity he sought to purge from science.

  Neurath explicitly argued that there is no "God's eye view" of reality. We cannot step outside our language (or visual systems) to check if they "mirror" the world. We only have other statements (or pictures) to compare them to. This is his **Coherentist** theory of truth (famously articulated in the *Protocol Sentence Debate* against Carnap and Schlick).

  *   **Wittgenstein:** The proposition matches the fact. (Correspondence)
  *   **Neurath:** The new picture must fit into the existing encyclopedia of accepted pictures without contradiction. (Coherence)

  If Neurath's system were Wittgensteinian, changing the icon from a "man" to a "block" would destroy the truth-value of the graphic because the logical form changed. For Neurath, changing the icon is fine as long as the *quantity* represented remains consistent and the viewer understands the convention. The "truth" is in the consistency of the system, not the metaphysical mirroring of the icon.

  ### 3. Why Neurath Wins (The Argued Verdict)

  You need a winner for your piece. Here is the argument for why Neurath's account is superior for infographics and objective knowledge, and why Wittgenstein's fails.

  **A. The Problem of Access**
  Wittgenstein's theory requires that we have access to the "logical form" of reality to verify that our propositions picture it correctly. But how do we check the logical form? We can only use language to check language. This leads to a regress. Wittgenstein eventually realized this and dismantled his own theory in the *Philosophical Investigations*, admitting that meaning is use, not picturing.
  Neurath faces no such problem. He doesn't claim ISOTYPE mirrors reality; he claims it *organizes* experience. His account is defensible because it makes no supernatural claims about logical isomorphism. It claims only: "Humans count icons faster than they read tables." That is an empirical claim, and it holds up.

  **B. The Problem of Vagueness**
  Wittgenstein wanted to eliminate vagueness by finding the perfect logical syntax. He failed, because ordinary language (and social facts) are inherently vague.
  Neurath embraced the vagueness. ISOTYPE is deliberately approximate. One icon = 1,000 people. If you have 1,500 people, you show one and a half icons. Wittgenstein would call this logically nonsensical (what is half a state of affairs?). Neurath calls it **pedagogically necessary**. For the purpose of "objective knowledge" in a social context (e.g., "housing is scarce"), Neurath's approximate visual is more *truthful to the human experience* than a Wittgensteinian logical atom.

  **C. The Social Dimension**
  Wittgenstein's *Tractatus* is solipsistic. It is about the relationship between one mind, language, and the world.
  Neurath's ISOTYPE is inherently social. It is designed for transmission between people of different literacy levels. Since your piece is on the history of **infographics** (a communication technology), Wittgenstein's theory is category-error irrelevant. A Wittgensteinian infographic would be a rigid logical syntax tree, which is useless for an airport traveler. A Neurathian infographic is a pictogram, which works.

  ### 4. How to Frame This in Your Piece

  Don't present them as rivals who disagreed on the same point. Present them as two different responses to the crisis of representation in the early 20th century.

  *   **Wittgenstein** tried to solve the problem by retreating into **Logic**. He wanted a language so perfect it couldn't lie. (Result: Philosophical dead end).
  *   **Neurath** tried to solve the problem by advancing **Design**. He wanted a language so simple it couldn't confuse. (Result: The modern pictogram).

  **The Punchline:**
  Wittgenstein thought "pictures" (propositions) were the limit of the world. Neurath thought pictures (graphics) were the bridge across the world's barriers.

  For your argument: **Neurath provides the defensible account.** Wittgenstein's picture theory is a metaphysical ghost; Neurath's picture language is a material tool. Wittgenstein asks, "What makes a representation *true*?" Neurath asks, "What makes a representation *work*?" In the history of information design, the latter is the only question that matters.

  If you quote anyone, quote Neurath's own rebuke to the overly abstract philosophers of his circle: *"Words divide, pictures unite."* Wittgenstein was busy dividing the sayable from the unsayable; Neurath was busy uniting the literate and the illiterate through visual convention. For a history of infographics, Neurath isn't just the ancestor; he's the only one who was actually building the thing.
