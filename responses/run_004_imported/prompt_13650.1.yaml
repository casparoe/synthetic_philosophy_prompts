      *   It's about the *conduct* incited.
      *   Key distinction: **Advocacy of Abstract Doctrine vs. Incitement to Imminent Lawless Action** (Brandenburg test logic, though applied loosely in school settings).
      *   Priya moved from "speech" to "organizing a protest/confrontation" that resulted in disruption.
      *   The inclusion of the address and specific time made it a coordinated mobilization, not just an expression of sentiment.

  5.  **Address the "Free Speech" Claim:**
      *   Priya is partially right that she can express the opinion.
