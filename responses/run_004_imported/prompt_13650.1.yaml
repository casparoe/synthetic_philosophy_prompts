      *   **Consequence:** The school suspended Priya for "inciting a disturbance." 15 other students reposted similar criticisms *without* the call to action/address and were not punished.
      *   **Conflict:** Priya claims this is a free speech violation/unfair singling out. The user feels there *must* be a difference but can't articulate it.
      *   **Goal:** The user wants an outside opinion on whether Priya is right (unfairly singled out/free speech violation) or if there's a meaningful distinction justifying the school's action.

  2.  **Identify the Core Legal/Ethical Concepts:**
      *   **First Amendment (Free Speech):** Does it apply to public schools? Yes (*Tinker v. Des Moines*), but it's not absolute.
      *   **Substantial Disruption:** Under *Tinker*, schools can regulate speech if it causes or foresees a "substantial disruption" to the school environment.
      *   **True Threats/Harassment:** Speech that incites violence or illegal activity isn't protected.
      *   **Off-Campus Speech:** Recent Supreme Court ruling (*Mahanoy Area School District v. B.L.*) limits schools' power over off-campus speech (like social media), but there are exceptions (severe harassment, threats, substantial disruption to school operations).
