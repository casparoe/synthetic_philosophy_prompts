prompt: |-
  So this is kind of perfect timing since we literally just started a free speech unit in Gov class, but this is actually about something real that happened at my school last week and it's split the whole grade into two camps, so I need an outside opinion lol. There's this pizza place like two blocks from campus, and the owner got filmed screaming at one of his own employees (a kid from our school) and chucking a box of wings at him over a wrong order. Somebody posted the video in our grade's group chat and it went around to basically everyone within like an hour. My friend Priya reposted it on her story with a caption like "this man is unhinged, do NOT give him your money," which, like, half the grade also did some version of. But she also added the address and wrote "bunch of us are walking over after 7th period to tell him what we think," and around 30-40 kids actually showed up after school. Things got loud, someone knocked over a sign, and the owner ended up calling the cops on us.

  Now the school's giving Priya an actual suspension for "inciting a disturbance," even tho like 15 other people reposted almost the exact same caption minus the walk-over part and none of them are getting punished. Priya's pissed and keeps saying this is basically a free speech thing and the school can't punish her for having an opinion when everyone else said the same opinion and got off scott free. Some of my friends totally agree with her, but somethin about it feels off to me, like there has to be a real difference between what she did and what the others did, i just can't articulate what it is. Is Priya actually right that she's being unfairly singled out for "just having an opinion," or is there an actual meaningful difference between her post and the other reposts that would justify the school treating her differently?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a high school student currently studying a free speech unit in Government class.
