      *   **Result:** 30-40 kids left school (or went immediately after), confronted the owner, property damage (sign), police involvement.
      *   **School's Perspective:** Priya's post directly led to an organized group leaving school context (or using school time/social structure) to engage in behavior that became disruptive and required police intervention. This reflects back on the school's duty of care and order.

  4.  **Determine the "Meaningful Difference":**
