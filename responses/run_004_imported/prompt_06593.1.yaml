          *   *Draft:* You say we can't act rightly. Why not just be careful?
          *   *Refinement:* Challenge the idea that uncertainty leads to paralysis.
          *   *Question 6:* You claim indeterminacy leaves everyone 'unable to act rightly.' But in law and medicine, we act under uncertainty all the time using risk assessment. Why is the AI case unique? Is it that the stakes (potential murder vs. property destruction) are too asymmetrical for standard risk calculus?
          *   *Follow-up:* If she says "Yes, asymmetry," ask: "If the asymmetry is the problem, why isn't the solution to treat all advanced AI as a patient until proven otherwise, rather than forbidding the creation?"

      *   *Requirement 7: Corporate/Structural Incentives.*
