          *   *Question 8:* Your policy talks about moral status. Are you concerned with full personhood rights, like voting and freedom, or merely welfare rights, like freedom from suffering? Because a system could be a moral patient without being a moral agent. Does your 'excluded middle' apply to suffering alone?
