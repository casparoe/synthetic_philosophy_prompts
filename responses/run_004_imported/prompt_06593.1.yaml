      *   *Consequence:* If we don't know if it's a person, we can't know if turning it off is murder or maintenance.
      *   *Solution:* Don't build things in the gray area. Build clear tools or clear persons (though the latter is unlikely/illegal).
      *   *Tension:* This is a preventative ethic. What about retroactive application? What about epistemic limits?

