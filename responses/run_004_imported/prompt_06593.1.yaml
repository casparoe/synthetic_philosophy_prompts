          *   *Question 7:* This policy requires a level of epistemic humility and restraint that seems contrary to competitive market dynamics. If one lab adheres to the 'excluded middle' and limits their models, while a competitor pushes into the gray zone for better performance, hasn't the ethical lab just made itself obsolete? Is this policy viable without regulation?
          *   *Follow-up:* If she says "It requires regulation," ask: "Who regulates the regulators when the technology evolves faster than the legislation?"

