      *   **Relationalism (Leibniz Equivalence):** Spacetime points don't exist independently. Only the relationships between events/matter exist. The two mathematical models represent the *same* physical reality. Therefore, no indeterminism.
      *   **Sophisticated Substantivalism:** Accepts the manifold exists, but denies that diffeomorphic models represent distinct physical possibilities. Identity of points is tied to the metric structure (haecceity vs. qualitative identity).
      *   **Essentialism:** Points have their metrical properties essentially. You can't swap the metric properties between points $p$ and $q$ because $p$ *is* the point where the curvature is $X$.

  3.  **Drafting - Section by Section:**

      *   **Setting the Scene:** Needs to feel immediate. Chalkboards, late night, the math is fresh.
      *   **Opening (Relationalist):** Hit hard on the indeterminism. It's "radical," "unobservable," and "absurd." Bring up Leibniz Equivalence.
      *   **Response (Substantivalist):** Don't concede the manifold. The manifold is the stage. But address the indeterminism. Introduce the idea that the mathematical distinction doesn't imply a physical distinction *in terms of possibility*. This leans towards "Sophisticated Substantivalism."
      *   **Counter (Relationalist):** If the math is distinct but the physics is the same, why keep the manifold as a "substance"? It sounds like you're keeping the ghost but exorcising the haunt. If you accept Leibniz Equivalence, you're basically a relationalist in practice.
