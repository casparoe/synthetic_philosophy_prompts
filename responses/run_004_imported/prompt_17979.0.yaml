answer: |-
  Higher-order theories (HOT) of consciousness attempt to explain the subjective character of experience by positing a structural relationship between mental states. On this view, a mental state is not conscious in virtue of its intrinsic properties, but rather in virtue of being the object of a suitable higher-order representation. Within this framework, a significant debate exists between David Rosenthal's "actualist" account and Peter Carruthers's "dispositionalist" alternative. Rosenthal argues that a state is conscious only if there is an actual, occurrent higher-order thought (HOT) about it. Carruthers, motivated by the "richness and fine grain" objection, argues that it suffices for the first-order state to be *disposed* to cause such a thought. While Carruthers's move successfully mitigates the psychological implausibility of Rosenthal's view, it ultimately fails to resolve the deeper metaphysical difficulty. By substituting a dispositional property for an occurrent relation, Carruthers renders the generation of phenomenal consciousness mysterious, conflating the *accessibility* of a state with the *experience* of it.

  To understand the stakes, one must first grasp the motivation for Carruthers's departure from Rosenthal. Rosenthal's actualism holds that for a subject to be phenomenally conscious of a red apple, there must be a first-order perceptual state representing the apple and a distinct, ordinarily unconscious HOT representing the subject as being in that perceptual state. The primary objection to this view concerns the richness of perceptual experience. As Carruthers notes, our visual field contains a vast amount of information—thousands of details regarding color, texture, and spatial relation. If consciousness requires an actual HOT for each conscious detail, the mind would need to sustain a "profusion" of simultaneous unconscious thoughts. This seems cognitively implausible; it posits a level of unconscious mental activity that rivals the complexity of the conscious experience itself, violating principles of parsimony and conflicting with empirical models of attention and working memory capacity.

  Carruthers's dispositionalist account is designed to solve this economy problem. He proposes that a first-order perceptual state is conscious if it is "poised" to impact higher-order cognitive systems (specifically, the faculty of thought). On this view, the state does not need to be *actually* targeted by a HOT; it merely needs to be available to be so targeted. The first-order state acquires a "dual content": it represents the external world, and in virtue of its dispositional role, it carries information about itself. This allows Carruthers to account for the fine grain of experience without positing thousands of simultaneous higher-order vehicles. The brain need only maintain the neural connectivity (the disposition) rather than firing thousands of distinct propositional attitudes.

  In terms of cognitive architecture, Carruthers's solution is compelling. It aligns better with what we know about neural efficiency and the distinction between focal attention and peripheral awareness. However, the prompt asks us to assess whether this move resolves the difficulty regarding the *nature* of consciousness, or whether it leaves it mysterious how a disposition makes a state phenomenally conscious. Here, the dispositionalist account falters. The core difficulty is that consciousness is paradigmatically an *occurrence* or an *actuality*, whereas a disposition is a *potentiality*.

  The mystery arises when we ask: Why does a state that is merely *ready* to be thought about feel like anything *now*? To say a state is disposed to cause a thought is to make a conditional claim: "If the subject were to attend to this state, they would form a thought about it." But phenomenal consciousness is not conditional; it is categorical. When I look at a field of flowers, the peripheral flowers are phenomenally present to me immediately, not merely on the condition that I shift my attention. If the consciousness of those flowers depends entirely on a disposition, then prior to the actualization of that disposition (the shift in attention), the "consciousness" exists only as a structural property of the neural system, not as an experienced reality.

  Carruthers might respond by asserting that this is simply what phenomenal consciousness *is*: global availability. He effectively identifies phenomenal consciousness with a specific kind of access consciousness (in Ned Block's terminology). However, this response risks changing the subject. The intuition driving HOT theories is usually to explain *what it is like* to be the subject. There is a robust pre-theoretical distinction between a state being available for report (access) and a state having a qualitative feel (phenomenality). By reducing the latter to the former, Carruthers leaves unexplained why global availability should be accompanied by subjective experience at all. A computer system might have data "poised" for higher-order processing without there being "something it is like" to be that computer. If Rosenthal's actual HOT fails to bridge the gap between unconscious processing and feeling, it is unclear how a mere disposition to process does any better.

  Furthermore, the dispositional view struggles to distinguish between conscious states and non-conscious states that are nonetheless poised for access. Consider cases of subliminal priming or blindsight. In some interpretations, these states involve information that is available to guide behavior or even report under specific conditions, yet they lack phenomenality. If "being poised to cause a thought" is the sufficient condition for consciousness, Carruthers must argue that blindsight states are not truly poised in the right way. But this requires drawing a fine line between two dispositional properties (one that yields consciousness, one that does not) without an occurrent difference to ground it. This makes the presence of phenomenology appear arbitrary. Why does *this* disposition generate light, while *that* disposition generates only darkness? Rosenthal's actualism, for all its faults, at least posits an actual event (the HOT) as the differentiator. Carruthers posits a difference in connectivity that remains, from the first-person perspective, invisible.

  Defending the verdict that Carruthers's move leaves the matter mysterious requires emphasizing the modal gap between disposition and occurrence. A glass is disposed to break when struck, but it does not *shatter* until it is struck. Similarly, if a mental state is disposed to be the object of a thought, it is not *the object of a thought* until the disposition is realized. If consciousness consists in being the object of a higher-order awareness (the core HOT intuition), then a mere disposition to be such an object is insufficient. It is akin to saying a room is illuminated not by light actually striking the walls, but by the lights being wired and ready to turn on. The readiness explains why the room *can* be illuminated, but it does not explain why it *is* illuminated.

  Carruthers attempts to bypass this by arguing that the first-order state itself changes its nature when it becomes poised. He suggests the state acquires a reflexive content. However, without an actual higher-order event to ground this reflexivity, the claim that the state represents itself remains metaphorical. A neural state represents the world causally or functionally; to say it represents itself dispositionally is to say it *would* represent itself if queried. But phenomenology is not a "would"; it is an "is."

  In conclusion, Peter Carruthers's dispositionalist higher-order theory successfully addresses the empirical objection regarding the richness of experience, saving the theory from positing an implausible profusion of unconscious thoughts. However, this gain in psychological plausibility comes at the cost of phenomenological adequacy. By replacing an actual relation with a dispositional property, Carruthers leaves it mysterious how a state that is merely *poised* for awareness generates the actuality of subjective experience. The theory effectively reduces phenomenal consciousness to access consciousness, failing to explain why access is accompanied by feeling. Therefore, while the dispositional move solves the problem of cognitive economy, it fails to resolve the fundamental metaphysical difficulty of how higher-order mechanisms generate phenomenality, leaving the "light" of consciousness switched off in the wiring diagram.
