          *   Explain the mechanism: State M is conscious iff there is a HOT about M.
          *   Explain the objection: Visual experience is rich (million pixels), thoughts are sparse. Positing thousands of unconscious thoughts is psychologically implausible (the "profusion" problem).
      *   **Section 2: Carruthers's Dispositionalist Solution.**
          *   Explain the mechanism: State M is conscious iff M is poised to cause a HOT.
          *   Explain the benefit: Cognitive economy. No need for thousands of occurrent thoughts, just neural connectivity/readiness.
          *   Connect to "Dual-Content" theory (often associated with Carruthers): The first-order state carries the content, the disposition makes it *for* the subject.
      *   **Section 3: Critique - The Mystery of Dispositional Phenomenology.**
          *   Argument A: Actuality vs. Potentiality. Consciousness is an *occurrence*. A disposition is a *conditional*. Why does the conditional feel like anything *now*?
          *   Argument B: The "Poised" vs. "Conscious" distinction. Carruthers admits non-conscious states can be poised (in some readings) or argues poised states *are* conscious. But intuitively, a state ready to be reported isn't necessarily felt. (e.g., blindsight or subliminal priming might involve dispositions without phenomenology).
          *   Argument C: The Explanatory Gap. Moving from neural disposition to "what it is like" is just as hard as moving from neural firing to "what it is like." It doesn't solve the hard problem; it just shifts the locus.
      *   **Section 4: Counter-Arguments and Rebuttal.**
          *   Carruthers might argue: "Consciousness *just is* global availability/poising." (Functionalist definition).
          *   Rebuttal: This changes the subject from *phenomenal* consciousness (feeling) to *access* consciousness (reporting). The prompt asks about phenomenally conscious states.
      *   **Conclusion:**
          *   Summarize the trade-off. Carruthers saves psychology but loses phenomenology.
          *   Final Verdict: The dispositional move does not resolve the difficulty; it masks it by redefining consciousness in terms of access rather than experience.

  4.  **Drafting - Key Concepts & Terminology:**
      *   *Intransitive vs. Transitive Consciousness:* Rosenthal focuses on transitive (awareness of state).
      *   *Phenomenal Consciousness (P-Consciousness):* The "what it's like" aspect (Block).
      *   *Access Consciousness (A-Consciousness):* Availability for reasoning/reporting.
