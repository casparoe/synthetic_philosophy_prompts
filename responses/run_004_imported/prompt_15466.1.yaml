answer: |-
  Good evening. For those of you who don't know me, I'm one of the many journalists who cut my teeth under Marion's watch. I started as an intern at her investigations desk and eventually drifted off to cover science and ideas. But no matter how far I drifted, I never quite escaped the gravitational pull of Marion's ethics seminar.

  For the family and friends here—Marion, your husband, your kids—there is a specific ritual many of us in this room survived. Marion used to pose a thought experiment to new hires. She'd describe two reporters. They get the same tip. They do the exact same legwork. They show the exact same diligence. But Reporter A's tip turns out to be true, wins a Pulitzer, and exposes a corrupt mayor. Reporter B's tip turns out to be false, through no fault of their own, and accidentally ruins an innocent person's reputation.

  Marion would look around the room, eyes twinkling behind her glasses, and ask: "Which reporter deserves the bigger raise?"

  Half the room would say Reporter A. The other half would squirm. And then Marion would spend an hour dismantling both answers, teaching us that judging a journalist by their outcomes is a fool's errand. Outcomes are luck. Process is character.

  Now, usually, when we toast someone after thirty-eight years, we list their wins. We talk about the prizes on the shelf, the headlines that stopped traffic, the scandals that toppled giants. But if I stood here and listed Marion's greatest hits, I know exactly what would happen. Marion would sit there with that tight-lipped smile she reserves for press releases, waiting for me to finish so she can tell me I'm missing the point.

  Because Marion Voss built a career on a radical, stubborn asymmetry. When a story landed perfectly, she deflected the praise. "The source held up," she'd say. "The timing was right." She treated success as a weather event she happened to be standing under. But when a story went sideways? When the facts shifted or the world changed its mind? Marion didn't look for the exit. She stepped into the fire. She accepted blame for things she couldn't control, because she believed that if she asked her reporters to take the risk, she had to take the weight.

  To her husband and kids: I know this sounds like work talk. But I want you to know what this actually means. It means Marion is the person in the room who refuses to let luck take the credit for love, and refuses to let bad luck take the blame for mistakes. It means she is the most reliable person you will ever meet, not because she's never wrong, but because she is the first to own the mess when things go wrong.

  The philosophers Bernard Williams and Thomas Nagel wrote about "moral luck" and worried that if we subtract everything we can't control, there's nothing left of us to judge. Marion proved them wrong. She showed us that there is plenty left. What's left is the diligence. What's left is the integrity of the process. What's left is the willingness to stand in the gap between the work you did and the way the world received it.

  We aren't here to toast Marion's luck. God knows, she's spent three decades telling us that luck is a terrible metric for a human life. We aren't even here to toast her success, strictly speaking, because she'd argue that success is just a byproduct of good process meeting good fortune.

  We are here to toast the rigor. We are toasting the thirty-eight years of showing up, doing the work, and refusing to let the chaos of the outcome dictate the value of the effort. We are toasting the woman who taught us that you don't get to choose how your stories land, but you do get to choose how you stand when they do.

  So, if everyone could please raise a glass.

  To Marion: May you never accept praise you didn't earn, may you never fear blame you can withstand, and may your retirement be filled with the one thing you can actually control: a well-deserved rest.

  To Marion.
