      *Option A:* Argue that Just Combatants *are* justified because the Unjust Combatants pose a threat, even if non-liable (Innocent Aggressor view).
      *Option B:* Argue that the *status* of the combatants is equal (both have right to life), even if the *act* of the Just side is objectively permissible.
      *Better approach:* Focus on the *status* of the combatant. McMahan says Unjust = Liable, Just = Non-liable. I want to say Unjust (non-culpable) = Non-liable, Just = Non-liable. Thus, Moral Equality of Status. The permission to kill the Unjust side comes from a "lesser evil" or "necessity" override, not from the Unjust soldier's forfeiture. This preserves the deep moral equality of the *persons*, even if the *actions* differ in objective rightness.

      *Refining the "Deep Morality" claim:* Walzer thought MEC was a convention to limit war. I need to argue it's a moral truth because the *conditions of agency* in war render individual soldiers morally symmetric regarding *ad bellum* judgments.

