answer: |-
  The debate between Jeff McMahan and Michael Walzer represents the central fault line in contemporary Just War Theory. McMahan's revisionism challenges Walzer's traditional "moral equality of combatants" (MEC) by arguing that liability to attack tracks objective justice: unjust combatants pose an unjust threat and are therefore liable to be killed, even if they are not culpable for believing their cause is just. Walzer, conversely, argues that combatants on both sides possess an equal right to fight, a view he treats largely as a necessary legal convention to contain the horrors of war.

  Your request asks for a defense of a position that splits the difference: rejecting McMahan's "responsibility-without-culpability" move to argue that non-culpably mistaken unjust combatants are **not liable** to be killed, thereby vindicating something like Walzer's MEC not as a mere convention, but as a truth of **deep morality**.

  Here is an argument defending that conception of liability.

  ### 1. The Normative Threshold of Liability: Why Culpability Matters

  McMahan's core move is to decouple liability from culpability. He argues that if you are morally responsible for an unjust threat (i.e., you are the agent causing it), you forfeit your right not to be killed, regardless of whether you are blameworthy for doing so. He relies on analogies like the "innocent driver" who has a seizure and careens toward a pedestrian; McMahan suggests the driver is liable to be killed to save the pedestrian because he is the source of the threat.

  However, this conflates **causal responsibility** with **normative forfeiture**. The right to life is the most fundamental right we possess. To forfeit it, an agent must do more than merely constitute a danger; they must violate a duty they could reasonably be expected to fulfill.

  Liability is a normative status, not a physical one. It arises when an agent acts in a way that demonstrates a disregard for the rights of others that is within their power to avoid. If a combatant fights for an unjust cause but has done everything epistemically possible to verify the justice of their cause, they have not violated a duty of due care. They have not manifested a will that is hostile to the rights of others; they have manifested a will that is tragically mistaken.

  To hold such an agent liable is to demand a level of moral omniscience that human agents do not possess. If liability attaches to non-culpable error, then the right to life becomes contingent on objective outcomes rather than subjective agency. This destabilizes the very concept of rights. A deep moral conception of MEC rests on the insight that soldiers on both sides are similarly situated moral agents: they are individuals coerced by states, operating under conditions of radical uncertainty, trying to fulfill what they perceive as civic duty. To say one side forfeits their life while the other does not, based on facts inaccessible to them, is to punish them for metaphysical bad luck rather than moral failure.

  ### 2. The Epistemic Condition and the "Fog of War"

  McMahan's view requires that combatants bear the burden of the *jus ad bellum* (justice of the war). He acknowledges the "epistemic fog" of war but insists that responsibility remains even if knowledge is obscured. This is where his theory becomes morally untenable for the rank-and-file soldier.

  In modern warfare, the determination of *jus ad bellum* is a complex geopolitical and legal assessment involving classified intelligence, historical grievances, and international law. It is a determination properly made by political leaders and international bodies, not by individual soldiers. A soldier's epistemic access is structurally limited by the very hierarchy they are duty-bound to obey.

  If we accept that moral liability requires a reasonable opportunity to avoid the wrongful act, then unjust combatants who lack access to the truth about their cause cannot be liable. They are in a state of **invincible ignorance**.

  Consider the symmetry: The just combatant fights believing their cause is just (correctly). The unjust combatant fights believing their cause is just (incorrectly, but reasonably). From the perspective of *agency*, they are identical. Both are exercising judgment under constraints. If deep morality respects the autonomy and limits of the moral agent, it must recognize this symmetry. Walzer's MEC captures this moral truth: the soldier's moral universe is limited to *jus in bello* (conduct in war). To expand their liability to include *ad bellum* judgments they are structurally incapable of making is to hold them responsible for the sins of their leaders.

  Therefore, non-culpably mistaken combatants retain their right not to be killed. They are **innocent threats**, not liable ones.

  ### 3. Liability vs. Lesser-Evil Justification

  A common objection to this view is: *If unjust combatants are not liable, does that mean just combatants are not permitted to kill them? Does this lead to pacifism?*

  No. We must distinguish between **liability** (the victim forfeits their right) and **justification** (the killer is permitted to infringe the right due to necessity).

  If non-culpably mistaken unjust combatants are not liable, then when just combatants kill them, they are infringing upon their right to life. However, this infringement can be justified under a **lesser-evil** or **necessity** principle. If the unjust army is permitted to advance, they will objectively violate rights and cause unjust harm. The just army, to prevent this greater objective wrong, is permitted to kill the unjust combatants, even though those combatants have not forfeited their rights.

  This distinction is crucial for preserving deep moral equality.
  *   **McMahan:** Unjust combatants have no right not to be killed; Just combatants have a right not to be killed. (Asymmetry of Status)
  *   **This View:** Both Unjust (non-culpable) and Just combatants have a right not to be killed. (Symmetry of Status).

  In this framework, the just combatant kills not because the enemy *deserves* death, but because the situation makes it a tragic necessity to prevent greater injustice. This preserves the humanity of the unjust combatant. They are not reduced to "objects of defense" (as in McMahan's view); they remain rights-bearers whose deaths are a moral tragedy, even if permissible.

  ### 4. Vindicating Walzer at the Level of Deep Morality

  Walzer famously argued that MEC is a "legalist paradigm"—a convention necessary to prevent war from becoming total slaughter. He feared that if soldiers believed they were fighting criminals (as McMahan suggests), they would show no quarter.

  However, by grounding non-liability in the **epistemic limits of agency**, we can argue that MEC is not just a useful convention, but a **moral truth**.

  The moral equality of combatants arises from the nature of collective violence. When a state goes to war, it transforms its citizens into instruments of policy. Unless a soldier commits war crimes (*jus in bello* violations), they are acting as a fiduciary of their political community. Because all political communities are fallible, and because the information asymmetry between leaders and soldiers is universal, all soldiers stand in the same moral relation to the violence they perpetrate.

  To argue otherwise (as McMahan does) is to individualize a collective failure. It places the weight of the state's unjust aggression on the shoulders of the individual soldier who lacks the power to stop it. A deep morality that values fairness must recognize that two individuals, both acting in good faith under coercive state authority, possess equal moral status.

  ### Conclusion

  McMahan's "responsibility-without-culpability" move is an attempt to align the ethics of war with the ethics of self-defense in ordinary life. But war is not ordinary life. It is a sphere of structured epistemic limitation and collective agency.

  By insisting that liability requires culpability (or at least a violation of a duty one could reasonably fulfill), we protect the right to life from being forfeited due to unavoidable ignorance. This renders the non-culpably mistaken unjust combatant **non-liable**. Since just combatants are also non-liable, we arrive at a **deep moral equality of combatants**.

  This does not mean "anything goes." It means that killing in war is always a grave moral infringement that requires supreme justification (necessity/lesser-evil), rather than a simple enforcement of rights against a liable target. This view preserves the dignity of the soldier on both sides, acknowledging that in the fog of war, the difference between the hero and the aggressor is often not a matter of individual moral character, but of objective facts beyond their reach. Walzer was right about the equality; he just underestimated the moral depth of the reasons why it holds.
