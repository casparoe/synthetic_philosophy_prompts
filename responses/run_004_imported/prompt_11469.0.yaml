      *   Did I preserve MEC at the level of deep morality? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to slide into pacifism. I must allow that killing *can* happen, just not based on *liability*. The justification shifts from "they forfeited rights" to "we are excused/justified by necessity." This preserves the symmetry of *status* (both have rights) while acknowledging the asymmetry of *outcome* (one side might win). Actually, to preserve MEC fully, I should argue that *both* sides kill under a lesser-evil justification relative to their own perspective, or that the just side kills under necessity but the unjust side's soldiers remain non-liable. The prompt asks to preserve MEC such that non-culpably mistaken unjust combatants are *not liable*. This implies Just Combatants are also *not liable* (which McMahan agrees with). So both are non-liable. This creates moral equality.

