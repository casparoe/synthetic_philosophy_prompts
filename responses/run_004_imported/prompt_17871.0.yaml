answer: |-
  The corridor outside the *Sala del Concistoro* was narrow, the stone cold enough to seep through the soles of their shoes. A single sconce flickered, casting long, wavering shadows that made the two priests look like giants on the wall.

  Father Valeriano, the Jesuit, leaned against the masonry, a stack of papers clutched tight against his chest. Father Tomas, the Dominican, stood opposite, his hands folded into the sleeves of his habit, motionless as a statue.

  "You look like a man carrying the weight of the *Concordia*," Tomas said, his voice low. "Or perhaps just the weight of your own novelty."

  "Novelty is only error until it is understood, Father," Valeriano replied, though he did not push away from the wall. "Tomorrow, I must explain how God is sovereign without being a tyrant. You intend to argue He is sovereign because He is the only true cause?"

  "I intend to argue that if the will moves itself without God's motion, God is not the First Cause. He becomes a spectator." Tomas stepped into the light. "You claim your *scientia media* saves contingency. But walk me through the logic again. Without the notes."

  Valeriano took a breath. "Divine knowledge has three logical moments. Not in time, but in nature. First, God knows all possibles—what *could* happen. This is necessary knowledge. Third, He knows what *will* happen—the actual world He decrees to create. This is free knowledge."

  "And the middle?"

  "The middle is the hinge," Valeriano said, his finger tracing a line in the dust on the ledge beside him. "Before God decrees to create this specific world, He knows, by His essence, what any free creature *would* choose in any set of circumstances. He knows that if Peter were placed in the courtyard of the High Priest, warmed by that specific fire, questioned by that specific maid, he *would* deny Christ. Not that he *will*, but that he *would*."

  "And God consults this truth?"

  "He consults it to decide which world to actualize. He sees a thousand possible orders. In one, Peter denies and repents. In another, Peter stands firm but falls later in pride. God chooses the order that best fits His providential ends, knowing exactly how our freedom will respond to His grace within that order. Grace is offered sufficiently to all, but its efficacy depends on the consent of the will, which God foresaw."

  Tomas nodded slowly, as if weighing a stone. "So. Before God decrees to create Peter, and before Peter exists to exercise his will, this proposition—'Peter would deny'—is already true."

  "Yes."

  "Where does this truth reside?" Tomas asked softly. "If Peter does not exist, there is no Peter to ground the truth. If God has not yet decreed to move Peter's will, there is no divine determination to ground the truth. What makes it *true*, Valeriano? Is there a realm of phantom truths floating outside of God's essence, waiting for Him to find them?"

  "It resides in the nature of the creaturely will as known by God," Valeriano countered, stiffening. "God knows His own power to create a will of such a nature. He knows how that nature operates."

  "A nature that is nothing but a concept?" Tomas pressed. "You make God's knowledge dependent on something outside Himself. You make the creature the determinant of grace. If God wills to save Judas, but your 'middle knowledge' says Judas *would not* consent, then God is thwarted. The creature's 'would' binds the Creator's 'will'."

  "It does not bind Him; He chooses the world where the 'would' aligns with His purpose. It preserves the difference between coercion and vocation." Valeriano pushed off the wall, stepping into Tomas's space. "But let us speak of your preservation. *Praemotio physica*. Physical premotion. You claim God moves the will to act, even to will freely."

  "We claim God is the cause of the act of willing, yes."

  "Then tell me," Valeriano said, his voice sharpening. "When this premotion is applied to the will, is the will determined to one outcome?"

  "It is infallibly moved," Tomas said.

  "Infallibly. So if God premoves me to choose charity, I cannot choose selfishness in that instant."

  "Correct."

  "Then how is it free? If the scale is tipped by a hand outside the balance, the weight is irrelevant. You call it 'premition,' but I see predetermination with a softer name. If the decree is antecedent to the merit, and the motion is irresistible, where is the contingency? You save God's causality by making the creature a puppet that feels the strings."

  Tomas did not blink. "You confuse coercion with causation. When fire burns, it burns necessarily. When God moves the will, He moves it *as will*—that is, freely. He causes the very freedom of the act. If the will could resist the First Cause, then the First Cause is not first. It would be dependent on the secondary cause."

  "But if the motion is infallible, the outcome is necessary," Valeriano insisted. "You say the will acts according to its nature, but who determined the nature of the act in that moment? If God moves the will to consent, and it is impossible for it not to consent under that motion, then Judas had no power to do otherwise. And if he had no power to do otherwise, your condemnation of him is a farce."

  "God's justice is not bound by your definition of power," Tomas said, his voice hardening like cooled iron. "We do not say the will is coerced. We say it is elevated. You, Father, try to protect freedom by limiting God's knowledge to guesses and conditions. I protect freedom by ensuring it actually exists as a gift from God, not a rival to Him. If your 'middle knowledge' is true, God waits on man. If my premotion is true, man lives because God wills it."

  "God waits on nothing," Valeriano said. "He encompasses all. But He wills sons, not machines."

  "And machines are all that remain if you sever the chain of causality," Tomas replied.

  They stood in silence for a moment. The flicker of the sconce died down, leaving them in near darkness, the outlines of their habits blurring into the stone. Neither had yielded an inch; the chasm between *Concordia* and *De Auxiliis* was as wide in the shadow as it was in the light.

  "Tomorrow," Tomas said, turning toward the door.

  "Tomorrow," Valeriano answered, tightening his grip on the papers.

  They walked in opposite directions, the sound of their footsteps echoing separately, neither quite drowning out the other.
