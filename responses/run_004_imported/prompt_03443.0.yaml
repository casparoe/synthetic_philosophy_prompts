      *   Differentiate Mickey Mousing vs. Leitmotif.
      *   Conclude with the "Ideal Schopenhauerian Score."

  *(Self-Correction during drafting)*: Wait, did Schopenhauer actually say he preferred Rossini over Wagner? Yes, in his later years, he found Wagner's *Tristan* too exhausting/modern, though he acknowledged Wagner's understanding of his philosophy. He liked Italian opera for its clear melody. I need to make sure I don't overstate his hatred of Wagner, but acknowledge his preference for melodic clarity.

  *(Refining the "Commentary" point)*: Schopenhauer says music + scene makes the scene intelligible. But he also says music is *independent*. The synthesis happens in the listener's mind, not by the composer forcing the music to fit the cut. This is a crucial distinction for film scoring. The composer usually writes *to* the cut. Schopenhauer would prefer the cut to fit the music, or the music to be composed independently and then paired (which rarely happens in film). I need to highlight this tension.

  *(Final Plan)*:
  1.  **Metaphysical Foundation:** Music as Will vs. Image as Representation.
