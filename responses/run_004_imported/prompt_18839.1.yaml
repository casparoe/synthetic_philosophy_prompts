      *   *The Implication:* If we want certain knowledge in politics (the goal of *Leviathan*), we must mimic the geometric method.
      *   *Historical Context:* Hobbes met Galileo. He was obsessed with Euclid later in life (the famous story of him finding Euclid's *Elements* in a gentleman's library at age 40 and falling in love with it). The 17th century was the dawn of the "Scientific Revolution," but "science" (scientia) meant *certain knowledge*, not just empirical observation.

  3.  **Address the Specific Questions:**
