      *   *Is it rhetorical or structural?* It is deeply structural. *Leviathan* is attempts to be a "civil science" built geometrically.
      *   *Character Development:* How to translate this into fiction? The character shouldn't just like triangles; they should crave *certainty* in a world of chaos (Civil War). Geometry represents order, control, and undeniable truth.

