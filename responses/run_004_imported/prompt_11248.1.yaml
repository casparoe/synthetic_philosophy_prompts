      *   *Counter-Argument (Philosophical/Psychological nuance):* *Akrasia* isn't just about *what* you choose, it's about the *conflict* between levels of desire or judgment. Hyperbolic discounting describes the *mechanism*, but *akrasia* describes the *phenomenological and normative experience* of that mechanism.

  3.  **Brainstorming Key Distinctions:**
