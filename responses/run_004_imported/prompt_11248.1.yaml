prompt: |-
  So in my psych elective we're doing this whole unit on self-control and cognitive biases, and my teacher put up a hyperbolic discounting graph to explain why people procrastinate (basically your brain values a reward way less if its delayed even a little bit when the reward is close in time, but far-off rewards barely lose value the more you delay them, so the curve is steep near "now" and flat further out). This reminded me of the akrasia/weakness-of-will stuff we covered in my philosophy elective when we read some Aristotle, except now I'm kind of thinking that whole debate might be pointless. Like last night I was supposed to be studying for my chem test and I ended up watching youtube for two hours instead, and my instinct was to call that "weak willed," but if hyperbolic discounting is literally just the math describing how my brain values rewards over time, then wasn't I just... following the curve? A rock isn't being irrational when it falls instead of floating, its just obeying gravity, so why would I be "irrational" for obeying my own discount function? I tried explaining this to my friend and she said something felt off about it but couldnt say what exactly.

  So basically, if a hyperbolic discounting curve can fully predict/explain my procrastinating, doesn't that mean there's no extra "akrasia" thing going on -- no sense in which I'm actually going against what I "really" want, just different discount rates showing up at different moments? Or is there an actual difference between just being a hyperbolic discounter and having weakness of will in the philosophical sense, and if there is, what is it? Basically trying to figure out if my "akrasia is fake" theory holds up or if im missing something obvious.
