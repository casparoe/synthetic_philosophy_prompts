      *   **Hypothesis:** The user suspects *akrasia* might be "pointless" or "fake." If behavior is fully predicted by a mathematical function (hyperbolic discounting), then acting on immediate gratification isn't "irrational" or "weak-willed," it's just obeying a natural law (like gravity).
