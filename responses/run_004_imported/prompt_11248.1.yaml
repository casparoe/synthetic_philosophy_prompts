      *   **Synchronic vs. Diachronic:** Hyperbolic discounting creates a preference reversal over time. At $t_1$ (days before), I prefer studying. At $t_2$ (now), I prefer YouTube. *Akrasia* is often defined as acting against one's *better judgment* (which usually aligns with the $t_1$ preference).
      *   **The "Self" Problem:** If I am just a series of time-slices, there's no *akrasia*. If I am a unified agent over time, there is.
      *   **Aristotle's View:** Aristotle actually argued *against* the Socratic view that "no one does evil knowingly." He thought *akrasia* was real. But he also thought it involved a temporary suspension of knowledge, not just a math error.
