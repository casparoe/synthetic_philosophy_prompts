answer: |-
  You have hit on exactly the right nerve. In fact, your intuition is so strong and so common that it has a name: it is the core argument for **Causal Decision Theory (CDT)**, which advocates for taking both boxes. Many Nobel prize-winning economists and prominent philosophers (like Robert Nozick and David Lewis) agree with you.

  However, to answer your specific question: **No, serious one-boxers are not committed to backward causation.** They do not believe your choice reaches back in time to move the money.

  If they aren't claiming magic, how do they justify one-boxing? The defense rests on three main pillars: **Correlation vs. Causation**, **Decision Algorithms**, and **Counterfactuals**. Here is how they make sense of it without violating the laws of physics.

  ### 1. The "Common Cause" Argument (Correlation, Not Causation)
  The most standard defense (associated with **Evidential Decision Theory**) argues that you are confusing *causing* an event with *providing evidence* of an event.

  Think of a barometer. When the needle drops, a storm often follows. Does the needle dropping *cause* the storm? No. Does holding the needle up with your finger stop the storm? No. Both the needle dropping and the storm are caused by a third thing: **low atmospheric pressure.**

  In Newcomb's Problem, the "low atmospheric pressure" is **your decision-making algorithm.**
  *   The Predictor simulated you (or analyzed your psychology) yesterday.
  *   That simulation produced a result: "This person will one-box."
  *   Based on that, the Predictor put the money in.
  *   Today, you sit down and run the same algorithm. You output: "I will one-box."

  Your choice today didn't *cause* the money to be there yesterday. Rather, your choice today is **evidence** that the money is there. If you are the kind of agent who two-boxes, the predictor knew that yesterday, and Box B is empty. If you are the kind of agent who one-boxes, the predictor knew that, and Box B is full.

  One-boxers argue that rationality isn't about physically manipulating the past; it's about acting in a way that is *consistent* with the world where you get the million dollars. By choosing one box, you aren't changing the past; you are confirming that you are in the "lucky" timeline where the predictor filled the box.

  ### 2. Functional Decision Theory (The "Algorithm" View)
  A more modern defense (championed by researchers at the Machine Intelligence Research Institute, like Eliezer Yudkowsky and Nate Soares) moves away from "evidence" and talks about **logical correlation**. This is often called **Functional Decision Theory (FDT)**.

  They argue that you shouldn't think of yourself as a physical human sitting in a chair at a specific moment in time. You should think of yourself as an **algorithm**.

  *   The Predictor didn't predict "What will Bob do on Tuesday?"
  *   The Predictor calculated "What does the *Bob-Algorithm* output when presented with Newcomb's Problem?"

  The math equation $2 + 2 = 4$ is true regardless of whether you calculate it on a calculator in New York today or on an abacus in ancient China. It's the same logical fact.

  Similarly, the output of your decision process is a logical fact. The Predictor computed that logical fact yesterday. You are computing the same logical fact today. Since it is the *same fact*, it must have the *same output*.

  If you decide to two-box, you aren't "changing" the past. You are essentially asserting that the logical output of the *Bob-Algorithm* is "Two-Box." But if the output is "Two-Box," the Predictor (who computed the same algorithm) would have foreseen that and left Box B empty.

  So, the defense here is: **You control the logical output of your decision function.** Since the Predictor's prediction is logically linked to that same function, you effectively control the prediction, not through time travel, but through logical identity.

  ### 3. The "Tickle" Defense (Why Two-Boxing Fails)
  To understand why one-boxers think two-boxing is a mistake, consider the payoff matrix.

  *   **If you are a One-Boxer:** The Predictor knew this. Box B has $1M. You take Box B. **Total: $1M.**
  *   **If you are a Two-Boxer:** The Predictor knew this. Box B is empty. You take Box A + Box B. **Total: $1,000.**

  The Causal (Two-Box) argument says: "Look, the money is already there or not. If it's there, I get more by taking both. If it's not there, I get more by taking both. Therefore, taking both is always better."

  The One-Boxer responds: "You are assuming you can hold the content of Box B fixed while you change your choice. But you can't. The content of Box B is **counterfactually dependent** on your choice."

  In other words, you cannot say "Suppose the money is there, *and* I take both boxes." That is an impossible world. The only possible worlds are:
  1.  Money is there + You take one box.
  2.  Money is absent + You take two boxes.

  When you compare the *possible* worlds, the one-boxer wins $1,000,000 and the two-boxer wins $1,000. The one-boxer argues that rationality should be about winning, not about satisfying an intuition about local causality.

  ### Summary: No Magic Required
  To answer your specific worries:

  1.  **Are they committed to backward causation?**
      No. They explicitly deny it. They argue that the correlation is established by a common cause (your psychology/algorithm) existing before the prediction and persisting until your choice.
  2.  **How do they defend it without violating causality?**
      By shifting the focus from "causing the money to appear" to "being the type of agent for whom the money appears." They argue that your decision is not an isolated event in the present, but the final step of a process that began when the Predictor analyzed you.
  3.  **Is there a way to make sense of it?**
      Yes. Think of it less like "I am moving the money with my mind" and more like "I am logging into a computer system." If the password was set to 'OneBox' yesterday, typing 'TwoBox' today won't grant access. You don't have the power to change the password retroactively; you only have the power to type the password that matches what was set.

  **The Bottom Line:**
  The disagreement isn't about physics; it's about the definition of **rationality**.
  *   **Two-Boxers** define rationality as: "Do the action that physically causes the best outcome *given the current state of the world*."
  *   **One-Boxers** define rationality as: "Be the agent who walks away with the most money *across the whole scenario*."

  You are in good company with your intuition. But the One-Boxers aren't smuggling in magic; they are just arguing that your "choice" is more deeply connected to the past than your intuition suggests.
