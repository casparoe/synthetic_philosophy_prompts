answer: |-
  **The Impossible Standard: Why Galen Strawson's Basic Argument Fails to Undermine Moral Responsibility**

  It is one of the great ironies of contemporary analytic philosophy that P.F. Strawson, the man who rehabilitated moral responsibility for the twentieth century, fathered a son who would attempt to dismantle it with surgical precision. In your seminar, you have grappled with Galen Strawson's "Basic Argument," a regress argument designed to prove that true moral responsibility is impossible regardless of whether determinism or indeterminism holds. You are right to be bothered by its neutrality; it feels like a trap that snaps shut on every exit. However, while Galen's logic is tight, his conclusion rests on a category error. The Basic Argument does not succeed in showing that we can never be truly morally responsible. It succeeds only in showing that we are not gods. By demanding *causa sui* (self-creation) as a condition for responsibility, Galen sets a standard that is not just unmeetable, but incoherent. P.F. Strawson's "Freedom and Resentment" is not a dodge; it is the necessary correction that locates responsibility where it actually lives: in human relationships, not metaphysical origination.

  To understand why Galen's argument feels like "cheating," we must first acknowledge its strength. Your intuition that the neutrality between determinism and indeterminism might be a trick is understandable, but it is actually the argument's most rigorous feature. Traditional hard determinists argue that if our actions are caused by prior events, we aren't responsible. Libertarians counter that if we introduce indeterminism (randomness) into the causal chain, we can be free. Galen blocks this move. He argues that if an action is random, it is not *yours* in a way that grounds responsibility—it's just luck. If it is determined, it's not *yours* either—it's just physics. By closing the libertarian loophole, Galen forces the incompatibilist conclusion without needing to prove determinism is true. This neutrality is not cheating; it is a logical pincer movement. It demonstrates that the problem of responsibility is not about the *structure* of the universe (causal vs. random), but about the *structure of the self*.

  However, this is where the Basic Argument overreaches. The core premise of the regress is that to be responsible for an action, you must be responsible for the mental nature that produced that action. To be responsible for that mental nature, you must have chosen it based on prior principles, for which you must also be responsible. This leads to an infinite regress. Galen concludes that because humans have a beginning (we are born with specific genetics and environments), we cannot complete this regress, and thus we can never be "truly" responsible.

  The verdict must be that this argument fails because it defines "true responsibility" as "ultimate responsibility." It demands that an agent be the *causa sui*—the cause of themselves. But this is a conceptual impossibility. To be the cause of oneself, one would have to exist prior to oneself in order to perform the act of creation. Since nothing can exist prior to itself, nothing can meet Galen's condition. If the definition of "moral responsibility" requires performing a logical impossibility, then the fault lies with the definition, not the agent. Galen has not discovered that responsibility is an illusion; he has discovered that *metaphysical godhood* is an illusion. Proving that humans are not prime movers does not prove they are not moral agents. It merely proves they are finite beings.

  This is precisely where P.F. Strawson's "Freedom and Resentment" enters, and it is crucial to see that it is not dodging Galen's point but rather dissolving it. Galen asks a metaphysical question: "Does the agent originate the action in a way that transcends the causal chain?" P.F. Strawson asks a interpersonal question: "Is the agent a participant in the moral community?" P.F. Strawson argues that moral responsibility is not a theoretical status conferred by the universe; it is a natural fact of human social life, constituted by our "reactive attitudes." When someone harms us intentionally, we feel resentment. When they help us, we feel gratitude. These are not theoretical judgments we can opt out of because we read a philosophy paper; they are the fabric of human relationship.

  Critics of P.F. Strawson often claim he is changing the subject—that he offers a pragmatic account of *blaming practices* rather than answering the metaphysical question of *desert*. They argue he tells us why we *punish*, not why we *deserve* punishment. But this criticism misses the point. "Desert" only has meaning within the context of these practices. To ask if someone "really" deserves blame outside of the human context of expectations, intentions, and relationships is like asking if a chess move is "really" valid outside the rules of chess. Galen wants to judge human morality from the perspective of the universe; P.F. Strawson correctly identifies that morality is a human scale phenomenon. Therefore, P.F. Strawson is not dodging the question of desert; he is re-grounding it in the only soil where it can grow.

  Furthermore, Galen's regress assumes a view of the self that is overly static. He treats the self as an object that must be "shaped" before it can act. But agency is not a one-time construction project; it is an ongoing process. We are responsible for our actions not because we chose our DNA, but because we have the capacity to reflect on our motives, recognize reasons, and modify our behavior in light of social norms. This "reasons-responsiveness" is sufficient for moral responsibility. When Galen asks, "But are you responsible for the capacity to recognize reasons?" he is once again demanding *causa sui*. We do not need to create our capacity for reason to be responsible for how we use it. We simply need to possess it.

  Ultimately, the Basic Argument succeeds only as a negative theological proof: it proves we are not unmoved movers. But moral responsibility was never about being an unmoved mover. It is about being a moved mover who can recognize the difference between right and wrong and act accordingly. Galen's neutrality regarding determinism is logically sound, but it is deployed in service of an impossible standard. P.F. Strawson's appeal to reactive attitudes is not a evasion; it is a recognition that responsibility is a feature of our life together, not a feature of the cosmos.

  Therefore, the verdict is clear: Galen Strawson's Basic Argument fails to show that we can never be truly morally responsible. It shows only that we cannot be *ultimately* responsible in a metaphysical sense. Since "ultimate responsibility" is an incoherent concept that has no bearing on how we live, love, judge, or forgive, the argument is a philosophical pyrrhic victory. It wins the battle of logic but loses the war on human reality. We are not *causa sui*, but we are persons. And for the purposes of moral responsibility, being a person is enough.
