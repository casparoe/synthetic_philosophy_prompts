  2.  **Analyze the Draft Content:**
      *   **Hook:** "If your mother tells you she loves you, check it out." (Classic journalism adage).
      *   **Core Conflict:** Hume (Reductionism) vs. Reid (Anti-Reductionism/Transmissivism) regarding testimony.
      *   **Hume's View:** Testimonial justification reduces to induction/perception/memory.
      *   **Reid's View:** Testimony is a basic source. Principles of Veracity and Credulity are innate. Children believe before they have inductive evidence.
      *   **Reductionist Comeback (Fricker):** Psychological origin $\neq$ Epistemic justification. Adults need case-by-case screening (competence, sincerity).
