      *   *Wait, one nuance on Fricker:* Elizabeth Fricker is associated with "local reductionism." The draft describes this well.
      *   *Wait, the Closing:* The draft says readers "don't really know how to trust any other way." That might be too strong. They *can't* trust any other way (time/energy constraints). "Don't know how" implies inability/ignorance. "Can't" implies structural limitation. "Can't" fits the "division of labor" argument better. I should suggest that tweak.

  9.  **Final Polish:** Ensure the tone is collaborative ("Here's what I see...") but direct ("Here's the risk...").

  **(Self-Correction Note):** I need to make sure I don't just validate them. They asked for accuracy checks.
  *   *Reid Accuracy:* Reid's *Inquiry into the Human Mind* and *Essays on the Intellectual Powers of Man*. Yes, the child argument is central.
