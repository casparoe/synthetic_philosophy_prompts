      *   *Refinement:* To make it "earn its place," it needs to acknowledge that reader credulity isn't just a failure of diligence, but a functional necessity (division of epistemic labor). If readers acted like Fricker, they'd never read anything. The draft touches on this ("division of epistemic labor"), but could be sharper.
