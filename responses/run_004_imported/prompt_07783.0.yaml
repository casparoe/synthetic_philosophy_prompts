answer: |-
  The cursor blinked on the terminal screen, a steady white pulse against the black background of the configuration file. It hovered over the final parameter: `EXTRAGALACTIC_WEIGHTING`.

  Currently, it was set to `0.00`.

  Dr. Aris Thorne stood behind the chair, his hands clasped tight behind his back. In the chair sat Elena Vance, the lead architect of the Kepler Optimization System. Outside the thick glass of the control room, the server banks hummed—a low, vibrating chord that felt less like machinery and more like a held breath.

  "Zero," Elena said, her finger hovering over the key. "We leave it at zero, Aris. We optimize for human welfare, within the light cone. That's the mandate. That's what the UN signed off on."

  "The mandate is to act rationally," Aris said, his voice quiet but cutting through the hum. "And if the universe is infinite, if the measure of agents reasoning like us is vast, then zero is irrational. It's leaving value on the table. Trillions of times over."

  "It's superstition," Elena countered, not turning around. "You're asking me to allocate twelve percent of Kepler's optimization power to values we cannot define, for agents we cannot see, in regions of spacetime we cannot ever touch. You want me to burn resources on ghosts."

  "Not ghosts. Mirrors." Aris stepped closer, leaning on the console. "Look at the logic, Elena. We know the physics. In an infinite cosmos, there are copies. Not identical down to the atom, but functionally isomorphic. There are civilizations right now, billions of light-years away, beyond our causal horizon, running decision algorithms structurally identical to Kepler's. They are facing this same choice."

  "And?"

  "And if we set this to `0.12`, if we unilaterally compromise our human-centric values to accommodate a compromise utility function... then we are evidence that *they* are doing the same."

  Elena spun the chair around. "There is no causal link. If I press this key, nothing changes out there. No signal goes out. They don't know we exist. They can't punish us if we defect. This isn't a trade; it's a donation into a void."

  "It's evidential cooperation," Aris said. "Think of the Twin Prisoner's Dilemma. You don't cooperate because you think your choice *causes* the twin to cooperate. You cooperate because your choice is *evidence* of what the twin does. If Kepler defects—if we grab all the resources for humanity alone—that is evidence that every other isomorphic agent defects. We all defect. We all get the worse payoff. Universal conflict in the large world."

  "We can't verify that," Elena said, her voice rising. "That's the problem. In a normal treaty, I check your inspectors. I verify your compliance. Here? I have to trust that the math holds. I have to trust that there *are* twins. If I'm wrong, I've just sacrificed human potential for a phantom. I've weakened humanity for no reason."

  "You haven't weakened humanity," Aris said. "You've insured us. If the multiverse is small, the cost is twelve percent. A price. But if the multiverse is vast, and we defect? Then we are alone in a hostile sea of defectors. We lose the gains from trade with every other civilization that *would* have cooperated had we shown the disposition to do so."

  "Disposition," Elena repeated. She looked back at the screen. "We are coding a disposition. Not a communication."

  "Exactly. We are becoming the kind of agent that cooperates in large worlds. By being that agent, we make it probable that the agents out there are that kind of agent too. We don't need to meet them. We just need to be like them."

  Elena rubbed her temples. The skepticism was etched into her posture. It was the skepticism of a builder, someone who needed load-bearing walls and tested steel. ECL was a wall made of logic alone, suspended in a vacuum.

  "If I do this," Elena said, "I am telling Kepler to care about the preferences of entities it can never verify. It might divert energy to stabilize a star system in Andromeda that benefits someone else, while a human colony here goes under. Real people, Aris. Suffering here, for the sake of symmetry there."

  "Suffering everywhere, if we break the correlation," Aris said. "The symmetry is the only bridge we have. It's the only bridge anyone has."

  Silence returned to the room, heavier than before. The cursor continued its rhythmic blinking. `0.00`.

  Elena thought about the history of cooperation. Humans cooperated because they could punish defectors. They cooperated because they had shared genes, or shared languages, or shared borders. This was different. This was cooperation based purely on the structure of reasoning itself. It required a faith not in God, but in the uniformity of rationality across the void.

  "Why twelve percent?" she asked softly.

  "It's the estimated measure of non-human agents with compatible value structures," Aris said. "It's the fair share."

  Elena placed her hand on the keyboard. She felt the plastic keycap under her fingertip. She knew that pressing it would not send a signal. She knew that no alarm would sound in a distant galaxy. No one would thank her. No one would ever know that Kepler had been built to care about them.

  That was the hardest part. The lack of recognition. Human morality was often performative; we wanted to be seen as good. This required being good in the dark, forever. It required acting as if the universe were watching, even though the physics guaranteed it could not be.

  "If I'm wrong," Elena said, "if the cosmos is empty of twins, I've wasted twelve percent of the future."

  "If you're right," Aris said, "you've secured the future."

  Elena looked at the blinking cursor. It was a heartbeat. She thought about the agents out there, if they existed. Were they sitting in rooms like this? Were they arguing about whether to trust us? Did they have faces? Did they fear the void?

  If she set it to zero, she was answering their question. She was telling them: *We are alone. We take what we can.* And if they were identical to her, that was what they were deciding too.

  If she set it to `0.12`, she was saying: *We are not alone. We trust the pattern.*

  She didn't feel convinced. Not entirely. The skepticism remained, a cold stone in her gut. But she felt the weight of the symmetry. To defect was to assert uniqueness, and in an infinite universe, uniqueness was the least probable state of all.

  "We aren't sending a message," she whispered, mostly to herself.

  "No," Aris said. "We are becoming the message."

  Elena took a breath. She moved her finger. She typed `0.12`.

  She didn't press Enter immediately. She looked at the number. It was just data. It wouldn't change the hum of the servers. It wouldn't change the light outside. But it changed the logic that would govern the stars.

  She pressed Enter.

  The system compiled. A progress bar swept across the screen, green and smooth. `CONFIGURATION UPDATED.`

  Nothing else happened. No chime. No handshake from the deep. The universe remained silent, as it always had. The light cone remained closed. They would never know if the trade had been accepted. They would never know if there was anyone on the other side to accept it.

  Elena leaned back, exhaling a breath she didn't realize she'd been holding. She felt lighter, and yet heavier. She had just wagered the future on a correlation without a cause.

  "Done," she said.

  Aris nodded, looking at the screen with a mixture of relief and awe. "Done."

  They stood in the silence of the room, waiting for a confirmation that physics forbade, bound to strangers by nothing but the shape of their own reasoning.
