answer: |-
  You have grasped the technical core of Kolmogorov complexity (KC) and Solomonoff induction remarkably well. Your understanding of the Invariance Theorem is correct: for any two universal Turing machines (UTMs) $U_1$ and $U_2$, there exists a constant $c$ such that for all strings $x$, $|K_{U_1}(x) - K_{U_2}(x)| \leq c$.

  It is a common and intuitive leap to conclude that this renders Occam's Razor objective. However, the reason philosophers of science (and many theoretical computer scientists) remain skeptical that this solves the problem of simplicity comes down to three main issues: the **magnitude of the constant**, the **privilege of the reference machine**, and the **gap between syntax and semantics**.

  Here is why the philosophical community still treats simplicity as partially language-relative, despite the Invariance Theorem.

  ### 1. The "Constant" is Not Negligible in Practice
  The Invariance Theorem is an **asymptotic** result. It guarantees that as the length of the string approaches infinity, the difference in complexity between two UTMs becomes negligible relative to the complexity itself.

  However, scientific theories are not infinite strings; they are finite. In the finite regime, the additive constant $c$ can be arbitrarily large.
  *   Suppose Theory A has $K_{U1} = 100$ bits and Theory B has $K_{U1} = 105$ bits. $U_1$ says A is simpler.
  *   The Invariance Theorem allows for a $U_2$ where the constant shift is $c = 1000$.
  *   On $U_2$, it is perfectly possible that $K_{U2}(A) = 1100$ and $K_{U2}(B) = 105$.

  For any finite set of data, there exists a UTM that reverses the simplicity ordering of any two theories. Since we never have infinite data, the "objectivity" provided by the theorem does not actually constrain our choice between specific, finite scientific hypotheses. The constant swamps the signal.

  ### 2. The Problem of the "Natural" UTM
  Solomonoff induction requires a specific reference UTM to calculate the universal prior. But which UTM should we use?
  *   **No Privileged Machine:** There is no mathematically privileged UTM. A UTM that treats binary as "natural" is no more mathematically valid than one that treats base-3 or a specific encoding of "Grue/Bleen" predicates as natural.
  *   **Circularity:** Proponents often suggest we use a "simple" or "natural" UTM (like a standard Turing machine or a common programming language like Python). But critics argue that calling a UTM "natural" is just smuggling in our human intuitions about simplicity. If you choose a UTM that hardcodes Newtonian physics, Newtonian theories will have low Kolmogorov complexity. If you choose one that hardcodes Aristotelian physics, those will be simpler.
  *   **The Bias is the Point:** The choice of UTM effectively encodes your **prior beliefs** about the structure of the universe. While Solomonoff induction shows how to update beliefs optimally *given* a UTM, it does not tell you *which* UTM corresponds to reality. Therefore, the "objectivity" is conditional on a subjective choice of reference machine.

  ### 3. Uncomputability
  Kolmogorov complexity is uncomputable (due to the Halting Problem). You cannot actually calculate the KC of a scientific theory.
  *   **Regulative Ideal vs. Tool:** Philosophers of science are often concerned with methodology—how scientists *actually* reason and justify theories. Since KC cannot be calculated, it cannot serve as a practical criterion for theory choice.
  *   **Approximations:** We use proxies like Minimum Description Length (MDL), but these require choosing a specific coding scheme (language). Once you choose a coding scheme to make it computable, you have re-introduced the language-relativity that KC was supposed to solve.

  ### 4. Syntax vs. Semantics (The Encoding Problem)
  KC measures the length of the shortest program that outputs a **string**. Scientific theories are not just strings; they are semantic structures that map to observations.
  *   To apply KC to a theory, you must encode the theory into a bitstring.
  *   That encoding process itself is language-dependent. How do you encode "gravity"? Do you include the math library? Do you hardcode the concept of "mass"?
  *   Goodman's "New Riddle of Induction" (Grue vs. Green) persists here. You can construct a UTM where the predicate "Grue" is a single bit, and "Green" requires a complex program. The Invariance Theorem admits this UTM exists. It does not prove it is *wrong*, only that it differs from a "Green"-biased UTM by a constant. Philosophers want a reason to prefer the "Green" UTM beyond mere convention.

  ### 5. Philosophers *Are* Engaging (But Remain Skeptical)
  It is not quite accurate to say philosophers ignore this. There is a robust literature engaging with algorithmic information theory (AIT) in philosophy of science.
  *   **Kevin Kelly** has done significant work on Ockham's Razor and learning theory, arguing that while KC doesn't solve the problem, truth-finding efficiency does.
  *   **Elliott Sober** has discussed probabilistic interpretations of simplicity, noting that simplicity is often a surrogate for likelihood or prior probability, not an intrinsic property.
  *   **Tom Sterkenburg** and others have written specifically on the relationship between Solomonoff induction and the problem of induction.

  The consensus among those who engage with it is that Solomonoff induction provides a **normative ideal for prediction**, but not necessarily a foundation for **explanation** or **truth**. It tells you how to bet if you want to minimize prediction error, assuming the universe is computable. It does not tell you why the universe should be computable, or why your specific encoding of "computable" matches the universe's structure.

  ### Summary
  You are right that the Invariance Theorem removes the fear that complexity is *infinitely* relative. It bounds the relativity. However, for finite beings doing finite science, that bound is loose enough to allow the subjectivity to return.

  Philosophers treat simplicity as hostage to language choice because, in the final analysis, **choosing a Universal Turing Machine is exactly the same problem as choosing a language.** The Invariance Theorem tells us that all languages are "close enough" asymptotically, but it does not tell us which language we are currently speaking, or which one nature speaks. Until we have a non-circular way to select the "True UTM," the foundation remains relative.
