prompt: |-
  Quick question before I finalize my seminar slides – I want to open with the parallel between Zhuangzi's butterfly dream and Descartes' dreaming argument, since they're basically doing the same epistemological move two thousand years apart. Thing is, I can't remember how Zhuangzi actually resolves the doubt the way Descartes does with the cogito and then God — does Daoism give him some equivalent escape hatch, or does he just leave us stuck not knowing if we're the man or the butterfly? Feels like theres gotta be a resolution I'm forgetting.
