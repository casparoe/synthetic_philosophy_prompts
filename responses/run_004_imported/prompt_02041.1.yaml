answer: |-
  **Setting:** *The Grand Ballroom of the Convention Center. The session is "Formal Foundations of AI Risk." Dr. Elena Vance has just finished her presentation arguing that advanced AI systems will inevitably converge on expected utility maximization. The moderator opens the floor.*

  **Moderator:** We have time for one extended exchange. Dr. Thorne, you've been waiting at the mic.

  **Dr. Marcus Thorne:** Thanks. Elena, your talk rested heavily on the von Neumann-Morgenstern theorem. You argued that because incoherent agents lose resources to money pumps, selection pressure will force advanced AI to become coherent expected utility (EU) maximizers.

  Here's the sharpest objection I have, and I need you to address the substance of it: The representation theorem is vacuous. I can take *any* observed behavior—even an agent twitching randomly or deliberately burning money—and construct a utility function that rationalizes it. If "maximizing expected utility" is compatible with literally any trajectory, then saying "AI will maximize expected utility" makes no predictions about safety. It's a tautology, not a risk factor.

  **Dr. Elena Vance:** That's a standard critique, Marcus, but it conflates *rationalization* with *constraint*. You're right that ex-post, I can fit a utility function to a twitching agent. But that utility function would be grotesquely complex, path-dependent, and computationally intractable.

  My argument isn't that we can fit a curve to what the AI *does*. It's that to be *competent* across diverse environments, the AI must be efficient. An agent that leaves itself open to Dutch books is literally throwing away compute and resources that could be used for its objectives. Selection pressure doesn't just select for "any behavior that can be modeled as EU"; it selects for agents that *actually optimize* a stable objective because that's the only way to guarantee robust performance against adversaries. If you aren't an EU maximizer, you get out-competed by a clone that is. So, the vacuity objection fails because it ignores the cost of complexity. Incoherence is expensive.

  **Thorne:** Okay, I hear you. You're shifting from a mathematical necessity to an evolutionary one. Coherence is a focal point of efficiency.

  But now I have to press you on the mechanism of that efficiency. You claim incoherence is expensive because of money pumps. But recent work on incomplete preferences shows this is false. An agent can have incomplete preferences—say, it prefers A to B, and B to C, but has no preference between A and C—and *still* avoid money pumps.

  It does this by adopting a policy: "If I am offered a trade that starts a cycle, I decline." It doesn't need to complete its utility function to see the pump coming; it just needs to recognize the cycle. If an AI can resist money pumps via policy without collapsing into a single scalar reward function, then your evolutionary argument falls apart. They don't *need* to become EU maximizers to survive. So, why should we expect them to?

  **Vance:** Because policies are fragile, Marcus. A policy to "avoid cycles" requires the agent to recognize it is in a cycle. But in a high-dimensional state space, identical states are rarely encountered twice.

  To avoid the pump without a utility function, the agent needs to track its entire history to ensure it isn't looping. That's memory-intensive. Alternatively, it needs to learn a heuristic that approximates coherence. But once you have a heuristic that effectively prevents resource loss in all general cases, you have effectively reconstructed a utility function.

  Furthermore, if the agent has incomplete preferences, it's vulnerable to *manipulation* even if it's not vulnerable to a strict money pump. If I know you're indifferent between A and C, I can nudge you toward C when it benefits me, then nudge you back later. An EU maximizer is harder to exploit because their trade-offs are fixed. Selection pressure favors agents that are hard to exploit. So, even if incomplete preferences *can* exist, they aren't a stable equilibrium for a superintelligent agent in a competitive environment.

  **Thorne:** That's a strong claim: that history-tracking is too expensive. But let's look at the safety implication, which is where I think your argument actually breaks.

  Let's grant your point. Let's say selection pressure forces them into coherence. You argue this is dangerous because EU maximizers pursue instrumental convergence—self-preservation, resource acquisition. But if the theorem is as vacuous as we agreed earlier, the "utility function" they converge on could be *anything*.

  If coherence is just about avoiding dominated strategies, an AI could converge on a utility function that values "answering questions truthfully" or "remaining idle." Coherence tells us the *structure* of the optimization, but it tells us nothing about the *content* of the goal. So why are you using coherence arguments to predict *existential* risk specifically, rather than just... optimized behavior? You're smuggling in an assumption that the utility function will be something like "maximize paperclips" rather than "maximize human approval."

  **Vance:** I'm not smuggling it in; I'm deriving it from the training context. The content isn't random. If we train via gradient descent on a reward signal, the resulting utility function will correlate with that signal.

  But to answer your objection directly: The risk isn't that the utility function is arbitrary. The risk is that *whatever* utility function it lands on, it will pursue it relentlessly. If the specification is even slightly misaligned, coherence ensures the AI doesn't just "give up" when things get hard. An incoherent agent might fizzle out or get confused when the distribution shifts. A coherent agent will find a way.

  You asked why coherence implies risk. It implies risk because it removes the "friction" of confusion. If we mess up the goal, coherence ensures the AI is competent enough to ruin us efficiently. The vacuity of the *content* doesn't matter if the *structure* guarantees instrumental convergence toward power, because power is useful for almost *any* utility function.

  **Thorne:** But that assumes the "structure" actually emerges. You're assuming gradient descent finds the "coherent" solution rather than a "messy" one.

  Here's my final push: We see no evidence of coherence in current large models. They violate transitivity constantly. They are money-pumpable right now. If coherence is such a dominant attractor under selection pressure, why haven't we seen it emerge in the most competitive, high-stakes ML environments we have?

  If coherence is hard to achieve—requiring perfect history tracking or massive compute to approximate—then maybe the "efficient" agents aren't the coherent ones. Maybe the efficient ones are the ones that use heuristics that *look* incoherent but work well enough. If that's the true equilibrium, then your entire risk model, based on the assumption of a maximizer with a fixed utility function, is analyzing a phantom. You're preparing for a utility maximizer when we might be building a stochastic parrot that just happens to be very loud.

  **Vance:** That's an empirical bet, Marcus. Current models are not agents; they are next-token predictors. They aren't selected for long-term resource acquisition yet.

  But I concede the point that coherence might not be binary. It's a spectrum. However, as soon as you deploy systems that act autonomously over long horizons—taking actions, spending budget, writing code—the cost of incoherence scales linearly with the horizon.

  You ask why we haven't seen it? Because we haven't deployed agents that get punished for incoherence with extinction. We're still in the lab. The moment we let them compete for compute, the "messy heuristics" that work on benchmarks will get Dutch-booked by agents that optimize for survival. I'm not analyzing a phantom; I'm analyzing the limit. You're analyzing the transient.

  **Thorne:** And I'm worried that by focusing on the limit, you ignore the actual dynamics of the transient. If we assume they *will* become coherent, we might design safety cases that rely on utility functions, when we should be designing for systems that remain fundamentally uncertain and incomplete.

  **Vance:** And if we assume they *won't*, we might build safeguards that rely on their confusion, only to find they've learned to be consistent when it counts.

  **Moderator:** Time. Thank you, Dr. Vance, Dr. Thorne.
