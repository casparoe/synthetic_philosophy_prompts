          *   If I Don't Test, I stay in "Not Knowing."
          *   The Utility of "Treat" depends on "Knowing."
          *   $U(Treat, Diseased, Know) \neq U(Treat, Diseased, \text{Don't Know})$.
          *   Good's theorem assumes $U(a, s)$ is invariant.
          *   So this is a **Genuine Violation of the Utility Stability Assumption**.

  4.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the theorem and the goal (pedagogical bite).
      *   **The Case:** "The Worried Well" (Medical Screening).
      *   **Setup:**
          *   Agent: Patient.
          *   Decision: Take preventative medication (Act $M$) or Don't (Act $\neg M$).
          *   States: Disease ($D$), Healthy ($H$).
          *   Priors: $P(D) = 0.1$.
          *   Experiment: Perfect, Free Test ($E$).
          *   **Crucial Utility Twist:** Utility depends on *anxiety*. Knowing $D$ incurs a psychological cost *prior* to treatment outcome.
      *   **Numbers:**
          *   $U(\neg M, H) = 100$ (Healthy & No meds).
          *   $U(M, H) = 80$ (Healthy & Meds side effects).
          *   $U(\neg M, D) = 0$ (Sick & No meds).
          *   $U(M, D) = 70$ (Sick & Meds helps).
          *   **Anxiety Cost:** If Agent *knows* $D$, subtract 40 utility from all outcomes involving $D$ (due to distress while waiting for treatment).
          *   *Wait, need to ensure the "No Info" case doesn't have anxiety.* Assume baseline anxiety is 0.
      *   **Calculation (No Info):**
          *   $EU(M) = 0.1(70) + 0.9(80) = 7 + 72 = 79$.
          *   $EU(\neg M) = 0.1(0) + 0.9(100) = 90$.
          *   Optimal Act: $\neg M$. EU = 90.
      *   **Calculation (With Info):**
          *   Outcome $H$ (0.9): Know $H$. Choose $\neg M$. Utility = 100.
          *   Outcome $D$ (0.1): Know $D$. Choose $M$ (70 - 40 anxiety = 30) vs $\neg M$ (0 - 40 anxiety = -40). Choose $M$. Utility = 30.
          *   Expected Utility with Info: $0.9(100) + 0.1(30) = 90 + 3 = 93$.
          *   *Wait, 93 > 90.* Info still helps.
          *   *I need to tune the numbers.*
          *   Make Anxiety Cost higher. Say 60.
          *   With Info, Outcome $D$: $U(M) = 70 - 60 = 10$.
          *   Exp Utility with Info: $0.9(100) + 0.1(10) = 90 + 1 = 91$.
          *   Still > 90.
          *   *Why is it so hard to break?* Because info lets you avoid the worst case ($\neg M, D$).
          *   In "No Info", I chose $\neg M$ (EU 90). Risk was getting 0.
          *   In "Info", I avoid the 0. I get 10 instead.
          *   So Info *removed* the risk of the 0 outcome. That's valuable.
          *   *To make Info hurt:* The "No Info" choice must be the *risky* one that yields high utility on average, and the Info must force me to abandon it due to anxiety, or the anxiety must attach to the *No Info* state less.
          *   *Let's flip the Acts.*
          *   Act: Invest in Venture (V) or Safe Bond (B).
          *   State: Success (S), Failure (F).
          *   P(S) = 0.5.
          *   $U(V, S) = 200$. $U(V, F) = 0$.
          *   $U(B, S) = 100$. $U(B, F) = 100$.
          *   No Info: $EU(V) = 100$. $EU(B) = 100$. Indifferent. Let's say they pick V. EU = 100.
          *   Info: Perfect.
          *   If S: Pick V. Utility 200.
          *   If F: Pick B. Utility 100.
          *   EU Info: $0.5(200) + 0.5(100) = 150$.
          *   Info helps.
          *   *Add Anxiety:* If I know F is coming, I suffer -100 anxiety.
          *   Info Case:
              *   If S (0.5): Pick V. Util 200.
              *   If F (0.5): Pick B. Util 100 - 100 (Anxiety) = 0.
              *   EU Info: $0.5(200) + 0.5(0) = 100$.
          *   No Info Case:
              *   Pick V. EU = 100. (No anxiety because I don't know F is coming).
              *   Pick B. EU = 100.
          *   Result: Info EU (100) = No Info EU (100).
          *   *Make Anxiety -110.*
          *   Info EU: $0.5(200) + 0.5(-10) = 95$.
          *   No Info EU: 100.
          *   **Result:** Info lowers Expected Utility (95 < 100).
      *   **This works.**
      *   **Premise Violated:** The assumption that the utility of a consequence is independent of the information state (Utility Stability / State Description). Good's theorem assumes $U(a, s)$. This case requires $U(a, s, e)$.

  5.  **Refining the Output:**
      *   Present the "Investor with Anxiety" case clearly.
      *   Show the math.
      *   Identify the premise: **State-Description / Utility Stability.**
      *   Explain *why* it's a violation: Good's theorem treats information as purely instrumental (changing probabilities to guide acts). It does not treat information as a *constituent* of the outcome (news utility).
      *   Discuss the "Dissolution": If we redefine the States to include "Knowing," does the theorem hold?
          *   If State = (World, Knowledge), then the "No Info" act leads to states (S, ~K) and (F, ~K). The "Info" act leads to (S, K) and (F, K).
          *   These are *different decision problems* (different state spaces reachable). Good's theorem compares the same decision problem with and without an *experiment*.
          *   Actually, Good's theorem compares $EU(\text{optimal}|prior)$ with $\sum P(e) EU(\text{optimal}|posterior)$.
          *   If $U$ changes based on $e$, the function $U$ in the second term is different from the first term.
          *   So it is a **Genuine Violation** of the theorem's conditions, not just an appearance. The theorem *does not apply* to agents who care about the news itself.

  6.  **Final Polish:**
      *   Ensure tone is appropriate for a graduate seminar (rigorous but accessible).
      *   Check constraints: Single agent? Yes. No market effects? Yes. Free info? Yes. Rational agent? Yes (maximizing SEU, just with different U).
      *   Make sure to explicitly answer the final question: "Is it a genuine violation... or merely an appearance?"
      *   Answer: It is a genuine violation of the **ontological assumption** that utility is defined solely over physical outcomes $(a, s)$.

  7.  **Self-Correction during drafting:**
      *   Wait, is the agent "Rational" in the Good sense if they have news utility?
      *   Good's theorem defines rationality as maximizing Expected Utility. If their Utility includes news, they are still rational *by their own lights*.
      *   But Good's theorem *proof* relies on the convexity of the max function over a *fixed* utility landscape.
      *   If the landscape shifts based on $e$, the convexity argument ($\sum P(e) \max_a EU(a|e) \ge \max_a \sum P(e) EU(a|e)$) fails because the $EU$ function inside the max is different from the one outside.
      *   So yes, it's a violation of the theorem's applicability conditions.

      *   *Wait, one nuance:* Can we save the theorem by saying "The State *should* include Knowledge"?
      *   If we include Knowledge in the State, then the "Experiment" doesn't just update probabilities over States; it *changes which States are possible*.
      *   In the "No Info" scenario, State "Disease & Know" is impossible.
      *   In the "Info" scenario, State "Disease & ~Know" is impossible.
      *   Good's theorem assumes the set of States $S$ is fixed and the experiment partitions $S$.
      *   If the experiment makes some $s \in S$ impossible (e.g., "Disease & ~Know"), it violates the **Partition Assumption** (specifically, that $\sum P(s|e) = 1$ over the *same* $S$).
      *   So, it violates the **Fixed State Space / Partition** assumption.
      *   I will highlight this dual violation (Utility Stability and Fixed State Space).

  8.  **Final Plan:**
      *   **Case:** The "Anxious Investor."
      *   **Setup:** Investment decision, free perfect info, utility penalizes *knowing* bad news.
      *   **Math:** Show EU(No Info) > EU(Info).
      *   **Analysis:** Identify the violated premises (Utility depends on Information; State Space shifts).
      *   **Conclusion:** It's a genuine violation of the theorem's idealizations, teaching students that "Value of Information" is not about truth, but about *instrumental control over a fixed outcome space*.
answer: |-
  Here is a case designed for your graduate seminar. It isolates the specific ontological assumptions of Good's theorem without relying on strategic interactions or computational costs.

  ### The Case of the Anxious Investor

  **The Setup**
  Consider a single rational agent, Alice, who must decide how to allocate her savings for the upcoming year. She faces a simple decision problem with two available acts and two possible states of the world.

  *   **Acts:**
      *   $A_1$: **Invest** in a volatile tech startup.
      *   $A_2$: **Hold** cash in a safe account.
  *   **States:**
      *   $S_1$: The startup **Succeeds**.
      *   $S_2$: The startup **Fails**.
  *   **Priors:** Alice assigns a subjective probability of $P(S_1) = 0.5$ and $P(S_2) = 0.5$.

  **The Utility Function (Standard)**
  Alice cares about her financial return. Let the monetary payoffs be:
  *   $U(A_1, S_1) = 200$ (High return)
  *   $U(A_1, S_2) = 0$ (Total loss)
  *   $U(A_2, S_1) = 100$ (Safe return)
  *   $U(A_2, S_2) = 100$ (Safe return)

  **The Information**
  Alice is offered a **free, perfect experiment** $E$ (an audit report) that will reveal with certainty whether the startup will Succeed ($e_1$) or Fail ($e_2$). The report costs nothing to acquire and nothing to process.

  **The Twist: News Utility**
  Standard applications of Good's theorem assume utility depends only on the act and the state: $U(a, s)$. However, Alice is prone to **anticipatory anxiety**. Her utility depends not only on the financial outcome but also on her *epistemic state* regarding the outcome. Specifically, *knowing* that the startup will fail causes her significant psychological distress during the waiting period, regardless of the financial action she takes subsequently.

  We must therefore specify her utility as a function of the Act, the State, *and* the Information received: $U(a, s, e)$.

  *   If Alice remains **ignorant** (No Experiment), she suffers no anxiety.
  *   If Alice learns the startup will **Fail** ($e_2$), she suffers an anxiety cost of $-110$ utility units.
  *   If Alice learns the startup will **Succeed** ($e_1$), she suffers no anxiety (perhaps a small thrill, but we set this to 0 for simplicity).

  **The Calculation**

  **1. Expected Utility Without Information**
  Alice calculates the expected utility of each act based on her priors. Since she does not take the experiment, she remains ignorant, and no anxiety cost is incurred.
  *   $EU(A_1) = 0.5(200) + 0.5(0) = 100$
  *   $EU(A_2) = 0.5(100) + 0.5(100) = 100$
  *   Alice is indifferent, but let us assume she breaks the tie in favor of the risky investment $A_1$.
  *   **Maximum Expected Utility (No Info) = 100.**

  **2. Expected Utility With Information**
  Alice acquires the free report. She updates by conditionalization (her posteriors become 0 or 1) and then chooses the optimal act *given the news*.

  *   **Outcome $e_1$ (Success):** Probability 0.5.
      *   Alice knows $S_1$. Anxiety cost = 0.
      *   She chooses $A_1$ (Invest). Payoff = 200.
      *   Net Utility = 200.
  *   **Outcome $e_2$ (Failure):** Probability 0.5.
      *   Alice knows $S_2$. Anxiety cost = -110.
      *   She chooses $A_2$ (Hold) to save her money. Payoff = 100.
      *   Net Utility = $100 - 110 = -10$.
      *   *(Note: Even if she chose $A_1$, payoff would be $0 - 110 = -110$, so $A_2$ is indeed optimal post-update.)*

  *   **Expected Utility (With Info):**
      $$EU(E) = P(e_1) \cdot U(A_1, S_1, e_1) + P(e_2) \cdot U(A_2, S_2, e_2)$$
      $$EU(E) = 0.5(200) + 0.5(-10)$$
      $$EU(E) = 100 - 5 = 95$$

  **The Result**
  *   Expected Utility (No Info) = **100**
  *   Expected Utility (With Info) = **95**

  Despite the information being free, true, and processed by a rational agent who conditionalizes and maximizes, **acquiring the information lowers her expected utility.**

  ***

  ### Analysis for the Seminar

  This example appears to contradict Good's Theorem. However, for the purposes of your seminar, the crucial task is to locate exactly where the derivation breaks down. This is not a case of bounded rationality or strategic interaction; it is a case of **ontological mismatch**.

  **Which Premise is Violated?**
  This is a **genuine violation** of the theorem's conditions, specifically the assumption regarding the **stability of the utility function** (and consequently, the **fixed state space**).

  Good's Theorem relies on the inequality:
  $$ \sum_e P(e) \left[ \max_a \sum_s P(s|e) U(a, s) \right] \ge \max_a \sum_s P(s) U(a, s) $$

  This mathematical inequality holds because the function $f(P) = \max_a (P \cdot U)$ is convex. However, this convexity argument assumes that $U(a, s)$ is **invariant** across the experiment. It assumes that the value of the consequence $(a, s)$ is the same whether you arrived at that consequence via a gamble or via a known path.

  In the Anxious Investor case:
  1.  **Utility Stability:** The utility of the consequence (Hold Cash, Startup Fails) is $100$ in the "No Info" scenario but $-10$ in the "Info" scenario. Because $U$ is a function of the information $e$ (i.e., $U(a, s, e)$), the $U$ inside the expectation on the left-hand side of Good's inequality is not the same $U$ on the right-hand side. The theorem simply does not apply to agents who derive utility or disutility from the *news itself* (sometimes called "news utility" or "diagnostic utility").
  2.  **Fixed State Space:** Alternatively, one might argue we can save the theorem by re-describing the states to include the agent's knowledge (e.g., State = "Failure & Known"). However, doing so violates the **Partition Assumption**. In the "No Info" decision problem, the state "Failure & Known" has probability 0 and is effectively not part of the feasible state space. In the "Info" decision problem, the state "Failure & Unknown" becomes impossible. Good's theorem requires the experiment to partition a *fixed* set of states $S$. If the experiment changes which states are metaphysically possible (by changing the agent's epistemic relation to the world), the state space is not fixed.

  **Pedagogical Takeaway**
  This case helps students see that Good's Theorem is not a vindication of the Principle of Total Evidence in all practical contexts, but rather a **structural result about instrumental control**.

  The theorem proves that information is valuable *insofar as it allows the agent to better align their acts with a fixed set of outcomes*. It does not account for situations where the *possession* of information alters the value of the outcomes themselves. If your students walk away understanding that Good's Theorem assumes **consequences are independent of the path of discovery**, they will have grasped the "bite" of the restrictions far better than if they had simply memorized the inequality.
