      *   **Constraint 3:** After presenting the example, identify exactly which premise of Good's Theorem is being violated or appears to be violated (is it a genuine violation or an illusion?).
      *   **Pedagogical Aim:** Help students feel the "bite" of the restrictions (costless info, fixed decision problem, strict conditionalization, optimal choice).

  2.  **Recall Good's Theorem (The Core Logic):**
      *   Let $D$ be a decision problem with acts $A$ and states $S$.
      *   Let $E$ be an experiment with outcomes $e \in \{e_1, ..., e_n\}$.
      *   Let $U(a, s)$ be the utility.
      *   Prior expected utility of optimal act: $\max_a \sum_s P(s) U(a, s)$.
      *   Expected utility *with* information: $\sum_e P(e) \left[ \max_a \sum_s P(s|e) U(a, s) \right]$.
      *   Good's Result: The latter is always $\ge$ the former.
      *   *Key Assumptions:*
          1.  Information is costless (no deduction from utility).
          2.  The agent *must* act (or can choose a "do nothing" act with fixed utility).
          3.  The utility function remains stable (no "news utility" or psychological cost of knowing).
          4.  The set of available acts remains stable.
          5.  The agent updates via Conditionalization.
          6.  The agent chooses the *optimal* act post-update.

