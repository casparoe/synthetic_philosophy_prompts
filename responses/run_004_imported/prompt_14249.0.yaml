  > "It's not that he forgets which exit is which. It's that the driver who left the driveway plans to exit, but the driver who actually *arrives* calculates that continuing is optimal. He's not absent-minded, darling, he's just dynamically inconsistent."

  ### The Philosopher's Notes (So you can write the smugness)
  If someone at the dinner party asks her to explain (so you can write her sighing and putting down her wine glass), here is the actual logic she's flexing:

  1.  **The Setup:** In the *Absent-Minded Driver* paradox (Piccione & Rubinstein, 1997), a driver wants to take the second exit but can't distinguish it from the first.
  2.  **Planning-Optimal (Ex Ante):** Before he leaves the house, he does the math. To maximize his chances of hitting the second exit without stopping at the first, he decides on a mixed strategy (e.g., "I will continue driving with a 2/3 probability").
  3.  **Action-Optimal (Ex Interim):** But once he is actually *at* an intersection, his perspective changes. Because he knows he is absent-minded, the mere fact that he is *at* an intersection makes it more likely he is at the second one (since he had to survive the first to get here). This updated belief makes "continuing" look even safer than it did at home.
  4.  **The Tangle:** The strategy that was rational at home is no longer rational at the wheel. He knows this will happen, but he can't "commit" his future self to stick to the plan.
  5.  **Why it's insufferable:** She is framing his forgetfulness not as a cognitive failure, but as a sophisticated game-theoretic conflict between his "past self" and "present self." She's calling him **time-inconsistent**, which is philosopher code for "a liar, but a rational one."
