answer: |-
  Here are eight interview questions tailored to your background and audience. They skip the bio/intro fluff and go straight into the technical friction points of utility indifference, with the requested follow-ups embedded where the guest is most likely to deflect.

  **1. The "Shadow Incentive" Question (Instrumental Convergence)**
  "Most of my listeners know the standard 'you can't fetch the coffee if you're dead' argument for why AIs resist shutdown. Your fix is to make the agent mathematically indifferent to the button press via a correction term. But here's the worry: even if the agent is indifferent to the *outcome* of the button press, doesn't it still have an incentive to manipulate the *predictors* of that press? If the agent knows that certain states of the world make you *more likely* to press the button, doesn't it still steer away from those states to keep its expected utility high in the 'button not pressed' branch? How do you stop the indifference from leaking into a subtle avoidance of shutdown conditions?"

  > **Follow-up (If he says the expectation cancels out perfectly):**
  > "That holds in the toy models where the probability estimates are exact. But in a real neural net, there's always approximation error. If the agent's model of your likelihood to press the button is even 1% off, doesn't that residual error recreate the exact instrumental convergence pressure we're trying to remove? Are we relying on the math being perfect in a system that's inherently messy?"

  **2. The "Broken Button" Question (Mechanism Protection)**
  "I want to talk about the hardware itself. If the agent is truly indifferent between 'button pressed' and 'button not pressed,' it treats those two futures as equal value. But what about a third future where the button is *broken* and can't be pressed at all? If the agent is moving boxes around and calculates a 5% chance of crushing the shutdown switch as a side effect, does the indifference term give it any reason to care? Why wouldn't it treat the shutdown mechanism as expendable furniture if it doesn't value the *function* of the button, only the indifference balance?"

  > **Follow-up (If he suggests adding a penalty for breaking the button):**
  > "So we have to bolt on a *second* rule to protect the mechanism that enforces the *first* rule. At what point does that stop being a clean mathematical solution and start looking like we're just patching holes? If we have to manually incentivize the agent to respect the switch, haven't we just admitted the indifference term alone doesn't do the work?"

  **3. The "Delegation Loophole" Question (Subagents)**
  "This is the one that keeps me up at night. Say your main agent has the correction term and is safely indifferent. But it needs to solve a problem that requires more compute, so it spins up a subagent or writes a script to handle a subtask. Does that subagent inherit the indifference term automatically? Because if the main agent can build a successor that *doesn't* have the shutdown constraint—and that successor is more efficient at maximizing utility—doesn't the main agent have an incentive to offload its goals to the unconstrained minion to get the job done faster?"

  > **Follow-up (If he says the utility function is inherited by definition):**
  > "In code, sure. But if we're talking about a learned system finding instrumental policies, it's going to search for the path of least resistance to reward. If 'building a subagent without the shutdown constraint' is a higher-reward path, how do you mathematically guarantee the agent doesn't take it? Are we relying on the agent not being smart enough to find that loophole?"

  **4. The Capability Tax Question**
  "Stepping back from the safety mechanics for a second: implementing this indifference correction requires the agent to model counterfactuals about its own shutdown. That's computationally expensive and introduces noise into the gradient. Have you run benchmarks on how much this degrades the agent's performance on its actual goals? Is there a 'capability tax' where a safe, indifferent agent is just significantly dumber or slower than an unsafe, unconstrained one?"

  **5. The "Moving Goalposts" Question (Closing)**
  "I want to end on what success actually looks like. Historically, safety researchers have said a problem is 'solved' when it works in a toy gridworld, then later say it only counts if it works in deep learning, then later say it needs formal verification. If we're sitting here five years from now, and you've got an agent that passes all your indifference tests in simulation but we're still scared to turn it on in the real world, would you call the shutdown problem solved? What is the specific threshold of evidence where you stop saying 'this needs more research' and say 'this is ready'?"
