      *   **User Persona:** PhD student in cognitive science (implies high technical literacy, familiarity with the literature, need for precision, no hand-holding on basics).
      *   **Core Question:** What is the precise relationship between the Free Energy Principle (FEP) and Predictive Processing (PP)? Are they interchangeable? Is PP a strict consequence of FEP, or does it add empirical content?
      *   **Specific Comparison Points:** Hierarchical message-passing, precision-weighted prediction error, cortical microcircuitry vs. general claim about self-organizing systems/Markov blankets.
