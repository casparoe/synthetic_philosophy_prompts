      *   *Predictive Processing (PP) / Predictive Coding (PC):* A specific neuroscientific theory *inspired* by FEP (and earlier work by Rao & Ballard, Mumford, etc.). It posits a specific architecture (hierarchical generative models) and a specific algorithm (prediction error minimization via message passing between layers).
      *   *Relationship:* FEP is the "why" (normative/mathematical necessity); PP is a specific "how" (mechanistic/implementation hypothesis).
      *   *The "Interchangeable" Confusion:* Many papers treat them as synonymous. This is a category error. FEP is broader; PP is narrower.
      *   *The Empirical Content:* PP adds specific claims about neural anatomy (superficial vs. deep pyramidal cells), physiology (forward vs. backward connections), and computation (precision weighting). FEP does not demand *this* specific implementation, only *some* implementation that minimizes free energy.
      *   *The Falsification Test:* If prediction error units aren't found, PP is in trouble. FEP might survive because other minimization schemes (e.g., sampling, direct parameter adjustment without explicit error units) are mathematically possible under FEP.

  3.  **Drafting the Argument - Section by Section:**

