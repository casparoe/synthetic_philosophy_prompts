      *   *Exchange 2 (Concept Horse):* Marcus brings in the ontological cost. Elena defends the function analogy. *Self-Correction:* Make sure Elena doesn't just say "Frege said so." She needs a philosophical defense of functions as real.
      *   *Exchange 3 (Relocated Regress):* This is crucial. Elena argues that an act of predication involves a subject, a property, and a mode. What glues them? Marcus must argue that acts are *sui generis*.
