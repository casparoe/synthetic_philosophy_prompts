      *   *Frege's Solution:* Concepts are functions. $F(a)$ is complete because $F$ maps $a$ to a truth value. No extra linker needed.
      *   *Hanks/Soames:* Propositions are types of acts. To grasp a proposition is to be disposed to perform an act of predication. The unity is the unity of the action.
