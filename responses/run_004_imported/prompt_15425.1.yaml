answer: |-
  **Setting:** *A quiet corner of the university library, late evening. Two coffee cups sit between stacks of papers. ELENA (Neo-Fregean) and MARCUS (Act-Theorist) have been talking for an hour.*

  **ELENA:** You keep saying the textbook narrative is dead, Marcus. But look at the alternative. If we discard Frege's distinction between saturated and unsaturated expressions, what stops Bradley's regress? If a proposition is just a collection of constituents—*Socrates*, *wisdom*—what makes *Socrates is wise* different from the set {Socrates, wisdom}?

  **MARCUS:** Nothing, if you treat them as objects sitting side-by-side. That's exactly the point. The mistake isn't in failing to find a magical glue; it's in thinking the proposition is an object composed of parts in the first place. The unity isn't in the *proposition*; it's in the *predication*. When I judge that Socrates is wise, I am not assembling a metaphysical structure. I am doing something. I am predicating wisdom of Socrates. The unity is the unity of an action, not a composite entity.

  **ELENA:** But actions have structure. If you predicate wisdom of Socrates, your act involves a representation of Socrates and a representation of wisdom. We are back at the start. What binds the representation of the subject to the representation of the property within the act? If you say "the agent binds them," I ask: how? Does the agent employ a relation of predication? If so, what binds the agent to *that* relation? You haven't solved Bradley's regress; you've just relocated it from the abstract realm of propositions to the psychological realm of cognitive acts.

  **MARCUS:** That's the "relocated regress" objection. I expect it. But it assumes that an act of predication is a complex event composed of independent sub-events that need tying together. It isn't. Predication is *sui generis*. It's a primitive cognitive type. To entertain the proposition that Socrates is wise just *is* to be disposed to perform a token act of predicating wisdom of Socrates. There is no further "binding" step. The unity is intrinsic to the performance.

  **ELENA:** "Intrinsic to the performance." That sounds suspiciously like Frege's "unsaturated," but dressed in psychological clothing. Frege said concepts are functions. They aren't things that need binding; they are rules for mapping objects to truth-values. The unsaturatedness isn't a hole waiting to be filled; it's a logical category. By saying the act is "primitive," you're essentially saying the binding power is brute. But Frege at least located that brute power in the logical nature of the constituent itself. You locate it in the agent. But if the agent can predicate, the agent must possess a capacity for unity. Where does *that* come from?

  **MARCUS:** It comes from the nature of cognitive agency. Look, let's talk about the cost of your view. You're willing to populate your ontology with entities that are essentially incomplete. Frege himself admitted the awkwardness here. Remember the "Concept Horse" paradox. As soon as you try to talk about the concept *horse* as a subject, it becomes an object, and thus ceases to be a concept. You can't refer to the unsaturated without saturating it.

  **ELENA:** That's a linguistic limitation, not an ontological one.

  **MARCUS:** Is it? Or does it reveal that "unsaturated entity" is a contradiction in terms? If reality is what we quantify over, and we can only quantify over objects, then your "unsaturated" constituents are ghosts. You're positing a special kind of ontological glue—functions, modes of presentation—and claiming they don't need glue themselves. But why? Because they are "gappy"? That sounds like saying a hook doesn't need a nail because it has a hole in it. The hole is precisely what demands an explanation of how it latches on.

  **ELENA:** You're spatializing logic, Marcus. A function isn't a hook. It's a mapping. When I say "Unsaturated," I mean that the concept *is* the rule of combination. It doesn't *have* a combining power; it *is* that power. If you deny this, you have to explain how two saturated items—say, a name and a concept treated as an object—ever manage to say anything true or false. A list of objects can't be false. Only a unified content can. If your act-theory says the content is just a type of act, who performs the act when no one is thinking?

  **MARCUS:** Ah, the argument from mind-independence. You think propositions must exist ungrasped. I don't. But even if we grant abstract propositions for the sake of argument, the act-theorist says propositions are *types* of acts. The type exists even if no token is currently being performed. But to your point about the list: A list is static. An act is dynamic. The unity of a sentence isn't found in the ink marks; it's found in the assertoric force with which they are uttered. Similarly, the unity of a thought isn't in the concepts; it's in the predicative force of the judgment.

  **ELENA:** But force presupposes content. I can't predicate wisdom unless I already have the content *wisdom* before my mind. If the content is already unified, you've smuggled in Fregean unity. If the content isn't unified, how do you know *what* to predicate? You need to identify the property *as* a property. To identify it as a property is to treat it as unsaturated. So, even in your act, you are relying on the distinction between object and concept to make the act intelligible. You're using my ladder to climb up and then kicking it away.

  **MARCUS:** I'm not kicking it away; I'm naturalizing it. You treat "unsaturated" as a property of the *constituent*. I treat "predicative" as a property of the *mode of engagement* with the constituent. Wisdom isn't unsaturated in itself. Wisdom is a property. It becomes a predicate when I engage with it predicatively. This solves the Concept Horse problem. I can talk about the property *wisdom* as an object of reflection without losing its predicative potential, because the potential lies in how I *use* it, not in what it *is*.

  **ELENA:** That seems to make truth subjective. If unity depends on my act of engagement, is the proposition true only when I engage with it?

  **MARCUS:** No. Truth is a property of the content type. The content type is defined by the conditions under which a token act would be accurate. But let's turn the regress back on you. You say the concept is a function. Fine. A function takes an argument. So we have the Function and the Argument. What ensures they meet? If they are distinct ontological categories, how do they interact? If the concept is essentially incomplete, it *demands* an argument. But a demand isn't a fulfillment. You still need the argument to be supplied. Who supplies it?

  **ELENA:** The thought supplies it. In a thought, the argument is already present. You're imagining a temporal process: first the concept, then the object, then the combination. But logical priority isn't temporal. In the proposition *Socrates is wise*, Socrates is not added to Wisdom. The thought is a single unit where the unsaturatedness of the concept is *already* satisfied by the object. The regress stops because there is no third thing. The relation isn't a constituent; it's the way the constituents are arranged.

  **MARCUS:** "The way the constituents are arranged." There it is. "Arranged." By what? If the constituents don't arrange themselves, you need an arranger. If they do arrange themselves, they have a combinatorial power. If they have a combinatorial power, they are effectively doing what my act of predication does. So why posit the weird ontology of unsaturated entities? Why not just say the combinatorial power belongs to the mind grasping them?

  **ELENA:** Because the mind grasps *what is there*. If the structure is only in the mind, then logic is psychology. I want to say that *Socrates is wise* is true regardless of whether anyone judges it. That requires the unity to be in the truth-bearer itself. If the truth-bearer is an act-type, fine. But an act-type is defined by its structure. If the structure requires predication, and predication is a binding of property to object, you still need to explain the bond. You say the bond is the act. I say the bond is the function. The difference is that functions are timeless; acts are events. If logic is to be normative for thought, the unity must be normative, not merely causal. Unsaturatedness provides a norm: a concept *ought* to be saturated. An act just *happens*.

  **MARCUS:** Acts aren't just happenings; they are intentional performances. They have correctness conditions. That's the normativity. But let's isolate the deadlock. You think I can't explain the unity of the act without presupposing a unified content. I think you can't explain the unity of the content without presupposing a mysterious ontological category that violates the principle that all entities are self-subsistent.

  **ELENA:** Precisely. So, for my view to win, I must demonstrate that "unsaturatedness" is not merely a negative label for "we don't know how these combine," but a positive logical feature that explains *why* no further linker is needed. I need to show that a function is not an entity that *needs* an argument, but a rule that *constitutes* the argument's role.

  **MARCUS:** And for my view to win, I must show that the act of predication is not a complex event composed of parts that need binding, but a primitive intentional stance. I need to demonstrate that we can individuate act-types without relying on pre-unified propositional contents. Basically, I have to prove that we can characterize *what* is predicated without already assuming the proposition exists as a unified object.

  **ELENA:** So the crux is ontological parsimony versus logical objectivity. You're willing to risk psychologism to avoid "ghostly" functions. I'm willing to risk ontological weirdness to preserve the mind-independence of truth conditions.

  **MARCUS:** And both of us are trying to avoid Bradley's pit: the idea that unity requires a further constituent. You say the concept isn't a constituent in that sense. I say the act isn't an event in that sense.

  **ELENA:** Then perhaps our dissertation chapter shouldn't conclude with a verdict. It should conclude by mapping the cost of each avoidance strategy. The Neo-Fregean buys unity at the price of ineffable logical categories. The Act-Theorist buys unity at the price of primitive cognitive powers.

  **MARCUS:** And the reader has to decide which price they're willing to pay. Whether they find "unsaturated entities" more objectionable than "primitive predicative acts."

  **ELENA:** Though, Marcus, if your acts are primitive, you still owe me an account of error. If I predicate wisdom of Socrates, and Socrates is not wise, my act fails. What makes it the *same* act type as a successful one?

  **MARCUS:** And if your concepts are unsaturated, Elena, you still owe me an account of how we grasp them without turning them into objects.

  **ELENA:** *Sighs.* Coffee?

  **MARCUS:** Please. Black. Saturated.

  **ELENA:** *Smiles.* At least we agree on that.
