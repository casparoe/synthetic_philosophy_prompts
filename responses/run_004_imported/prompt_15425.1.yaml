  8.  **Final Polish:** Check flow and clarity. Ensure the distinction between *propositions as abstract objects* (Frege) and *propositions as act types* (Hanks/Soames) is clear. (Self-Correction: Make sure Elena doesn't conflate senses and references too messily, keep it on unity).

  *(Self-Correction during drafting)*: I need to make sure Marcus doesn't just say "acts are primitive" as a conversation stopper. He needs to explain *why* that's better than unsaturatedness. Elena needs to explain why functions aren't just "objects in disguise."

