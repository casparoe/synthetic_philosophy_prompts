answer: |-
  Your friend is absolutely right, and your intuition is excellent. You have stumbled upon one of the most significant fault lines in formal epistemology and social science: the gap between **Decision Theory** (one agent vs. Nature) and **Game Theory** (multiple agents vs. each other).

  Good's Theorem is a cornerstone of individual rationality. It proves that for a single Bayesian agent facing a passive world ("Nature"), free evidence is never a burden. You can always ignore it, so having it must be weakly better.

  However, Good's Theorem relies on a hidden assumption that holds in decision theory but shatters in multi-agent settings: **the environment does not react strategically to your information.**

  When you move from one person to a room full of people (institutions, markets, governments), information stops being just a tool for *you* to navigate the world; it becomes a variable that changes *how everyone else acts*. Here is exactly what breaks when you try to aggregate Good's result to social transparency.

  ### 1. Strategic Interdependence (The Poker Problem)
  In Good's framework, the state of the world is fixed, and you are just trying to match your action to it. In a multi-agent setting, the "state of the world" includes *other agents' actions*, which depend on *their* information.

  If information becomes public, it changes the equilibrium of the game.
  *   **Example:** Consider a negotiation. If I know my absolute bottom line, Good's Theorem says that's good for me. If you know your bottom line, that's good for you. But if *we both know each other's* bottom lines perfectly (maximum transparency), the zone of possible agreement might vanish, or one party might exploit the other ruthlessly, leading to a breakdown in trade that would have occurred under ambiguity.
  *   **The Break:** In game theory, ignorance can be a commitment device. Sometimes, not knowing exactly how much you can squeeze an opponent prevents you from trying, which maintains a cooperative equilibrium. Perfect transparency can unravel cooperation.

  ### 2. The Hirshleifer Effect (The Insurance Problem)
  This is the most direct rebuttal to your point about insurers and governments. Jack Hirshleifer (1971) demonstrated that **public information can destroy risk-sharing opportunities.**

  Good's Theorem says *you* benefit from knowing your future risks. But insurance works by pooling risk among people who *don't* know their specific outcomes.
  *   **Example:** Genetic testing. Suppose a test reveals with 100% accuracy whether you will develop a costly disease.
      *   **Individual View (Good's Theorem):** It is valuable for you to know this. You can plan your life.
      *   **Institutional View:** If this information is public (or even just known to you and the insurer), the insurance market collapses. Low-risk people leave the pool to save money; high-risk people stay. Premiums skyrocket. The *social* ability to smooth consumption over states of the world is destroyed.
  *   **The Break:** Good's Theorem measures expected utility for a decision. It does not account for the **value of the gamble itself.** In social systems, we often want to *avoid* knowing the state of the world ex-ante so that we can insure against it. Transparency eliminates the uncertainty required for insurance to function.

  ### 3. Incentives to Produce Information (Grossman-Stiglitz)
  You mentioned financial markets. A classic result in financial economics (Grossman & Stiglitz, 1980) shows that if information is perfectly public and costless, **no one has an incentive to produce it.**

  *   **The Mechanism:** If prices perfectly reflect all available information (maximum transparency), then an investor cannot gain an advantage by doing research. If they can't gain an advantage, they won't pay to do the research. If no one does the research, the prices stop reflecting information.
  *   **The Break:** Good's Theorem assumes the evidence is "free" and already available. In institutions, evidence often costs effort to generate. Maximum disclosure policies can inadvertently kill the incentive to generate high-quality information in the first place, leading to a society that is "transparent" about nothing but noise.

  ### 4. Ex-Ante vs. Ex-Interim Utility
  Good's Theorem is an **ex-ante** result: *before* you see the evidence, you expect to be better off.
  However, in social choice, we often care about **ex-interim** welfare (after people know their type) or distributional fairness.

  *   **The Problem:** Public information often creates winners and losers *before* the action is taken.
  *   **Example:** A government releases data showing Neighborhood A is safe and Neighborhood B is high-crime.
      *   **Aggregate:** Maybe crime drops overall because police allocate resources better (Good's Theorem logic).
      *   **Distribution:** Property values in B crash. People in B are trapped. The *sum* of utility might go up, but the variance increases drastically, potentially causing social instability that reduces long-term welfare.
  *   **The Break:** Good's Theorem applies to a single utility function. It does not tell us how to sum conflicting utility functions across a population where information shifts bargaining power.

  ### 5. Common Knowledge and Coordination
  Finally, there is a subtle logical break regarding **Common Knowledge**.
  Good's Theorem assumes you update your beliefs. In multi-agent settings, you also update your beliefs about *their* beliefs about *your* beliefs.

  *   **Rubinstein's Email Game:** This famous result shows that "almost common knowledge" (I know, you know, I know you know... for 100 levels) behaves totally differently from "common knowledge" (infinite levels).
  *   **The Break:** Slight ambiguities in transparency can sustain coordination. Perfect transparency (common knowledge of intentions) can sometimes lead to infinite regressions of strategic reasoning that result in coordination failure. Sometimes, a little bit of "fog" allows institutions to function smoothly because it stops agents from over-optimizing against each other.

  ### Summary
  Your friend is right because **Good's Theorem is a theorem about Decision Theory, not Game Theory.**

  *   **Decision Theory:** Agent vs. Nature. Nature doesn't care what you know. More info = better map.
  *   **Game Theory/Social Choice:** Agent vs. Agent. Agents care what you know. More info = changed incentives, destroyed risk-pooling, and altered equilibria.

  When you propose "maximum public disclosure," you aren't just giving everyone a better map of the terrain; you are changing the terrain itself. You are turning risk into certainty (killing insurance), turning negotiation into ultimatum (killing trade), and turning research into a public good (killing production).

  So, Good's result doesn't "add up" across people because utilities are not independent. The value of my information depends on whether you have it, and whether you know that I have it. That interdependence is where the theorem breaks.

  **Seminarian Tip:** If you want to impress your instructor, look up the **Hirshleifer Effect (1971)** regarding the social value of information and **Aumann's Agreement Theorem** regarding common knowledge. They are the natural "next steps" from Good's Theorem into the social realm.
