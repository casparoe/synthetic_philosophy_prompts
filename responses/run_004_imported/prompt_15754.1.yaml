answer: |-
  Here is a structured argument designed for your graduate seminar. It is framed to challenge the students' consensus by exposing the explanatory gap in Frege's doctrine and demonstrating its dialectical parity with the very view it is meant to supersede.

  ***

  ### The Argument: Unsaturatedness as a Label, Not a Solution

  **Thesis:** Frege's doctrine of unsaturatedness does not dissolve Bradley's Regress; it merely relocates the mystery from the *relation* to the *category*. By treating "unsaturatedness" as a primitive metaphysical feature, Frege offers a stopping point that is dialectically available to his opponents, thereby failing to provide a unique solution to the unity problem.

  #### 1. The "Dormitive Virtue" Objection: Relabeling the Phenomenon
  The primary charge against Frege is that "unsaturatedness" (*Ungesättigtheit*) functions as a *nominal* explanation rather than a *real* one.

  *   **The Phenomenon to be Explained:** We observe that in the proposition "Socrates is mortal," the constituent *Socrates* and the constituent *is mortal* form a unity capable of truth or falsehood. In a mere list ("Socrates, mortality"), they do not.
  *   **Frege's Explanation:** They form a unity because *is mortal* is unsaturated and *Socrates* is saturated.
  *   **The Critique:** To say a concept is "unsaturated" is simply to say "it is the kind of thing that combines with an object to form a unity." This is circular. It defines the nature of the concept by the very phenomenon (combination/unity) that requires explanation.
      *   It is akin to Molière's doctor explaining that opium induces sleep because of its "dormitive virtue."
      *   If we ask, "But *how* does the unsaturated concept hook onto the object?" Frege cannot answer without pointing back to the definition of unsaturatedness. He has named the capacity for unity but has not provided an ontology that makes that capacity intelligible.

  #### 2. The Ontological Status Problem: Entities Still Require Unifiers
  Frege insists that concepts are not objects. However, in Frege's ontology, concepts *are* referents (*Bedeutungen*). They are part of the furniture of the world, albeit a different kind of furniture.

  *   **The Bradleyan Challenge:** If the concept is an entity (even a non-object entity) and the object is an entity, we have a plurality: $C$ and $o$.
  *   **The Gap Metaphor:** Frege uses the spatial metaphor of a "gap" or "hole" that the object fills. But metaphysically, what constitutes the "filling"?
      *   If the filling is a further fact (the fact that $o$ saturates $C$), we have returned to the need for a unifier.
      *   If the filling is immediate, we must ask: Is this immediacy a feature of $o$, a feature of $C$, or a feature of the complex?
      *   If it is a feature of $C$ (its unsaturatedness), then we must distinguish between $C$ *simpliciter* and $C$-as-combining. If $C$ can exist (as a referent) without combining, then unsaturatedness is a contingent property, requiring a further tie to bind it to $C$. If $C$ *cannot* exist without combining, then we face the problem of how we can refer to it or think of it in isolation (which Frege arguably does when he discusses concepts).
  *   **Conclusion:** Merely asserting that one entity is "gappy" does not explain how the gap is metaphysically bridged without a further relating fact. It asserts the bridge exists but denies the need for pillars.

  #### 3. Confronting the Fregean Rejoinder: The Appeal to Primitives
  Your students will likely offer the standard Fregean defense: *Unsaturatedness is not a further item; it is a primitive categorial distinction. To demand an explanation of how saturated and unsaturated combine is to misunderstand the categories, like asking what color the number 7 is.*

  *   **The Counter-Argument:** This defense concedes that the unity of the proposition is a **brute fact**. Frege is essentially saying: "Some things just combine. Specifically, things of Category U combine with things of Category S."
  *   **Why This Fails to Stop the Regress:** Bradley's Regress is not merely a demand for more relations; it is a demand for **intelligibility**. Bradley argues that a complex cannot be constituted by a collection of entities, regardless of their type, without a principle of unity.
      *   If Frege stops the regress by saying "It is primitive that concepts combine," he is asserting a brute metaphysical law.
      *   But a brute law is precisely what Bradley finds suspect. Bradley's point is that *no* collection of entities, however categorized, yields a proposition without a unifying act or fact.
      *   By appealing to a primitive, Frege does not *solve* the regress; he **stipulates** a termination point. While stipulations are necessary in metaphysics, the burden is on Frege to show why *this* stipulation is more intelligible than the alternatives.

  #### 4. The Parity Argument: The Bradleyan Relation Realist's Revenge
  This is the strongest point for your seminar. If Frege is permitted to stop the regress via a primitive categorial distinction, the Relation Realist (whom Bradley critiques) is entitled to the exact same move.

  *   **The Fregean Move:** "Relations/Concepts are not inert terms; they have an essential nature (unsaturatedness) that allows them to combine without a further tie."
  *   **The Relation Realist's Move:** "Relations are not inert terms; they have an essential nature (relatingness) that allows them to combine relata without a further tie."
  *   **The Dialectical Implication:**
      1.  Bradley argues that if $R$ is a term, it needs $R'$ to link it to $a$ and $b$.
      2.  The Realist replies: "$R$ is not a mere term; it is essentially relating. $R'$ is not needed."
      3.  Bradley replies: "You are just asserting that $R$ has a magic power. You haven't explained it."
      4.  **Frege's Position:** Frege says to Bradley: "The Realist is right to be worried about inert terms. But Concepts are not inert. They are unsaturated. No magic power needed; it's their category."
      5.  **The Trap:** If Bradley accepts Frege's answer, he must accept the Realist's answer. If "unsaturatedness" is a sufficient primitive to stop the regress, then "relatingness" is also a sufficient primitive.
      6.  **The Result:** Frege has not *dissolved* the regress; he has merely shifted the locus of the primitive from the *relation* to the *concept*. If the regress is vicious for the Realist (because it posits a brute capacity to relate), it is equally vicious for Frege (because it posits a brute capacity to saturate).

  #### 5. Summary for the Seminar
  To put this to your students, you might frame it as a challenge to **explanatory privilege**:

  > "Frege asks us to believe that the unity of the proposition is secured because concepts are 'unsaturated.' But if we press him on what 'unsaturated' means, he tells us it means 'able to combine with an object to form a unity.' This is circular.
  >
  > If he retreats to saying it is a 'primitive categorial fact,' he grants that the unity is brute. But if the unity is brute, why is the Relation Realist not allowed to say that *relating* is a brute fact of relations?
  >
  > If the Realist is barred from this move because it is 'mysterious,' then Frege must be barred as well. 'Unsaturatedness' is simply 'relatingness' wearing a different hat. It names the mystery of propositional unity without dispelling it. Therefore, Frege does not stop the regress; he merely hides the stopping point behind a terminological distinction."

  ### Suggested Discussion Questions for the Students
  1.  **The Metaphor Problem:** Is the "gap" or "hole" metaphor in Frege merely heuristic, or does it carry ontological weight? If it is merely heuristic, what is the actual metaphysical mechanism of saturation?
  2.  **The Parity Check:** If a Relation Realist adopts Frege's strategy (stipulating that relations are essentially relating), does Bradley's regress actually vanish, or does Bradley simply refuse to accept brute facts? If Bradley refuses brute facts, is *any* solution to the unity of the proposition possible?
  3.  **Ontological Commitment:** Does Frege's distinction between Object and Concept actually reduce ontological complexity, or does it introduce a new kind of entity (the unsaturated entity) that is just as problematic as the relating relation?
