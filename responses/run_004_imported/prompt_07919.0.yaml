answer: |-
  Friends, family, neighbors. Thank you for coming.

  I know that standing here, looking out at this room, there are words expected of me. In my studies, I am taught that words are tools to define things, to draw lines between what is right and what is wrong, what is lawful and what is not. But today, standing before you as a grandson rather than a student, I have learned that some lines cannot be drawn without cutting something living.

  We are gathered to mourn a man. To some, he was simply Opa. He was the man who taught me how to sharpen a pencil until the point was perfect. He was the man who sat in the same chair for thirty years, reading the same newspapers, drinking the same coffee. He was quiet. He was steady. He was the person who held my hand when the world felt too loud.

  To others in this room, he is something else. He is a symbol. He is a name in a file, a defendant in a transcript, a representation of a time and a system that caused immeasurable pain. I know that for many of you, his presence in your lives has been a source of anger, or grief, or a reminder of a wound that has not healed. I do not stand here to ask you to change how you feel. I do not stand here to argue a case. The courts have spoken, and history has rendered its own heavy judgment. I am not here to overturn a verdict.

  I am here to testify to a life.

  There is a sentence my grandfather said often, especially in the later years. When the questions came, when the silence grew heavy, he would say: "I did what the law asked of a soldier."

  For a long time, I heard that sentence as a law student. I heard it as a defense. I analyzed it. I weighed it against the arguments of philosophers who say that justice is higher than statute, that conscience must override command. I have sat in seminars and debated the weight of that exact phrase.

  But standing here today, I no longer hear it as a legal argument. I hear it as a confession of limitation.

  I hear a man telling me that he was small, and the state was big. I hear a man telling me that he was taught that duty was the highest virtue, and he followed that teaching until it broke him. I hear a man who lived with the knowledge that his obedience had consequences he could never undo. He did not say that sentence to escape guilt. He said it because it was the only map he had for the territory he had walked through. It was the burden he carried so that we wouldn't have to.

  It is tempting, in a moment like this, to try to make him whole. To polish the memory until the rough edges are gone. But my grandfather was not a polished stone. He was a man who lived through a century that demanded impossible choices of ordinary people. He was a man who loved his family with a fierce, quiet devotion, and who also wore a uniform that history has condemned. Both of these things are true. To deny the love is a lie. To deny the condemnation is also a lie.

  We are a room divided. I feel that division in the air. Some of you see a victim of circumstance; some of you see a perpetrator of injustice. Perhaps you are both right. Human beings are large enough to contain contradictions that the law cannot resolve. The law needs a binary outcome: guilty or not guilty, liable or not liable. But grief does not work that way. Memory does not work that way.

  I loved him. And I know that love is not a legal shield. It does not erase the past. But it does demand that we look at the whole person.

  If you knew him only as a guard, you missed the gardener. You missed the way he would spend hours coaxing tomatoes from the soil, patient and gentle. You missed the way he listened when I spoke, really listened, making me feel like the only person in the world. If you knew him only as a grandfather, you perhaps shielded yourselves from the shadow he cast. But we cannot have the light without acknowledging the shadow.

  He died last week. The trial is over. The statutes have been cited. The theories have been debated. What remains is the silence he left behind.

  My hope for us, in this difficult hour, is that we can find a way to lay down the briefs. We do not need to agree on the judgment of history to agree on the reality of loss. We can acknowledge the pain he caused without denying the love he gave. We can acknowledge the duty he served without sanctifying the system he served it in.

  He spent his final years carrying the weight of that sentence: "I did what the law asked." Let us not spend our eulogy arguing with him. Let us instead acknowledge that the law asked too much, and that he, like so many, was not strong enough to refuse it. That is not an excuse. It is a tragedy.

  So, I invite you to remember him not as a precedent, but as a person. Remember the hands. Remember the voice. Remember the complexity.

  May we find the courage to hold the truth of his life without letting it break us. And may he finally find the rest that the law could not give him, and the judgment of history could not grant.

  Rest now, Opa. The shift is over.

  Thank you.
