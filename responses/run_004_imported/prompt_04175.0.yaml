answer: |-
  Elias stood in the checkout line and watched the woman in front of him count out coins on the rubber belt. She was short, wearing a coat that had been mended at the elbow with thread that didn't quite match. She was three dollars short. The cashier, a teenager with a name tag that read *JAY*, was already sighing, his finger hovering over the void button to remove the loaf of bread.

  Elias tapped his card on the reader. "Put it on mine," he said.

  It was a reflex. It cost him three dollars and forty-two cents. It saved her the bread. The woman turned, eyes wide, and thanked him with a intensity that made Elias look at his shoes. She took the bag. She left. Elias took his receipt and walked out into the grey afternoon.

  In the immediate ledger, this was a positive utility event. A small cost to Elias, a relief of hunger and shame to the woman. The net was good. Elias felt the warm, familiar glow of it as he walked to his car. He had optimized a small moment of suffering.

  But then the rain started.

  Because Elias had paused to pay, he exited the store twelve seconds later than he would have. He reached the crosswalk as the light turned red. He waited. The rain soaked his shoulders.

  Inside the store, the woman—Martha—walked out twelve seconds earlier than she would have. She reached the bus stop just as the number 42 pulled away. She missed it. She had to wait twenty minutes for the next one. She stood under the shelter, dry, holding the bread. Because she was dry, she did not rush. Because she did not rush, she noticed the flyer on the pole about a community dinner. She memorized the address.

  Elias, wet and annoyed at the red light, drove home five minutes slower than usual. He took the turn onto his street too fast on the slick asphalt. His tire hit a pothole he usually missed. A vibration started in the steering column, a tiny wobble, imperceptible at first. He parked, went inside, made tea. He forgot about the three dollars. He forgot about the wobble.

  Three weeks later, the vibration in Elias's car wore down a tie rod. He didn't notice until he was merging onto the highway. He corrected the drift. The car behind him, a blue sedan, braked hard. The driver of the blue sedan, a man named Kovic, was late for a job interview. The braking made him spill coffee on his lap. He arrived at the interview distracted, smelling of stale roast, dabbing at a stain on his tie. He did not get the job. He went home angry. He snapped at his daughter.

  Martha took the bus to the community dinner. She ate a hot meal. She met a volunteer there, a woman named Sarah. They talked about the cost of heating oil. Sarah gave her a number for a subsidy program. Martha applied. She got the grant. Her apartment stayed warm in January. Her son, who had a mild asthma condition, did not have an attack that month. He slept through the night. He grew three millimeters taller than he would have if he had woken up coughing.

  Elias fixed the tie rod. It cost him four hundred dollars. He decided to skip his annual donation to the global health fund to cover the surprise expense. He reasoned it was a one-time thing. The fund used that missing money to purchase bed nets for a region in Malawi. The allocation algorithm shifted. The nets went to Village A instead of Village B.

  In Village A, a child slept under a net. In Village B, a child did not.

  Kovic, the man with the coffee stain, took a different job two months later. It paid less but was closer to home. He drove less. He emitted four tons less carbon over the next decade. The climate warmed a fraction of a degree less than it would have. A storm track shifted, imperceptibly, over the Atlantic.

  Martha's son grew up. Because his lungs were clear, he joined the track team. He ran meets on weekends. At a meet in his junior year, he bumped into a girl from another school. They started dating. They broke up two years later. The girl went to college in a different state. She met someone else there. She had a child. That child would not have existed if Martha had caught the bus twelve seconds earlier.

  Elias's car eventually broke down for good. He bought an electric vehicle. He felt virtuous. He drove less, worried about the battery. He stayed home more. He became slightly more isolated. His mood dipped. He was kinder to his neighbors but colder to his brother.

  The threads pulled tight and then slackened. The three dollars and forty-two cents moved through the economy. The bakery that made Martha's bread sold one more loaf. They ordered more flour. The farmer planted more wheat. He used more fertilizer. The runoff entered the watershed. The algae bloomed. The fish died. The fisherman caught less.

  Elias died of a heart attack at seventy-four. If he had left the store twelve seconds earlier, he would have been home in time to take his medication before the pain started. Or perhaps he would have been on the highway when the truck skidded. It is impossible to say. The variables of biology are as chaotic as the variables of traffic.

  Martha died at eighty-one. Warmth in her lungs.

  The child in Village B lived. He became a teacher. He taught a student who wrote a paper on effective altruism. The student read about the cluelessness problem. The student wondered if the bed nets had been a mistake, if the overpopulation caused by saving lives would strain the resources of the next century, causing wars that wouldn't have happened otherwise. Or if the extra minds would solve fusion power.

  The student looked out the window. It was raining.

  Elias's great-granddaughter walked into a grocery store. She saw a man short on cash. She hesitated. She thought about the carbon cost of the food. She thought about the labor practices of the supermarket. She thought about how she couldn't possibly know what the man would do with the energy from the meal, if he would hurt someone, if he would heal someone, if his existence was a net positive on a timeline stretching into the heat death of the universe.

  She watched the cashier's finger hover over the void button.

  The rain fell on the parking lot, pooling in the depressions of the asphalt, finding the cracks, seeping down into the dark earth where the roots waited, drinking blindly.

  Elias's great-granddaughter tapped her card. "Put it on mine," she said.

  She walked out into the grey afternoon. The light turned red. She waited. The water soaked her shoulders. Somewhere, a tie rod began to vibrate. Somewhere, a bus pulled away from a curb. Somewhere, a child took a breath.

  The ledger remained open. The ink was still wet. The sum was waiting to be calculated, but the column of numbers went on forever, running off the bottom of the page, into the dark, where no one could read it.
