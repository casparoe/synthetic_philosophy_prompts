answer: |-
  The booth smelled like ozone and burnt hair, which was standard for the Chicago Hub. Elias stepped onto the pad, adjusting the collar of his suit. He'd done this four hundred and twelve times. Commute from Chicago to the Singapore processing plant. Home for dinner, there for breakfast. The teleporter made the world small, but it made Elias feel thin.

  "Ready for transit, Mr. Vance?" the technician asked, not looking up from her tablet.

  "Ready," Elias said. He thought about Sarah waiting for him in Singapore. He thought about the way she hated cilantro, how she'd pick it out of her soup with surgical precision. He thought about how he loved her. He held onto that thought like a lifeline. It was the anchor. If he remembered loving her, he was him.

  The hum started in his teeth. The light wasn't bright; it was absolute. It wiped the color from the world, then the shape, then the sensation. There was a moment of nothingness—not sleep, not darkness, just an absence of existence.

  Then, gravity returned.

  Elias gasped, stumbling forward onto the Singapore reception mat. The air here was humid, thick with the scent of jasmine and machinery. He straightened his tie, ready to walk through the sliding doors to the waiting car.

  But he stopped.

  Someone was standing in front of the doors.

  He was wearing Elias's suit. He had Elias's tie, slightly loosened on the left side. He had Elias's face, pale and slick with the sweat of transit. He was looking at Elias with an expression of pure, unadulterated terror.

  "What," the other Elias said. His voice was exactly Elias's voice, down to the slight rasp from too much coffee.

  The technicians in the control room behind the glass were moving now, frantic shadows against the white walls. Alarms began to wail, a low, throbbing sound that vibrated in the floor.

  Elias looked at his hands. They were his hands. A small scar on the thumb from a kitchen knife incident three years ago. He looked at the other man's hands. The same scar.

  "Protocol," the other Elias whispered, shaking his head. "The protocol is dematerialize origin, materialize destination. One unit."

  "I know the protocol," Elias said. His heart was hammering against his ribs. He could feel the blood pumping in his neck. He was alive. He was here. But so was… himself.

  If the machine worked correctly, the Elias in Chicago was vaporized. Reduced to base carbon and water. The Elias here was the reconstruction. A copy built from new atoms, imprinted with the memory of loving Sarah and hating cilantro.

  But there were two of them.

  That meant the Chicago Elias was dead. Definitely dead. And these two… what were they? Backups? Glitches?

  "Don't move," a voice boomed over the intercom. A security team poured into the room, rifles lowered but not aimed. They surrounded both Eliases.

  "We need to verify integrity," the lead technician said, stepping out from the glass booth. She looked between them, her face pale. "Identify."

  "I'm Elias Vance," Elias said.

  "I'm Elias Vance," the other said simultaneously. They flinched at the unison.

  "Serial verification," the technician demanded.

  They both recited their employee ID. They both recited their home address. They both recited the name of their first pet. A golden retriever named Buster.

  "Memory sync is perfect," the technician muttered to her colleague. "Both show continuous consciousness up to the point of entry."

  Elias looked at the other man. The other man looked back. There was a hunger in those eyes—the same hunger Elias felt. The desire to go home. To see Sarah. To prove he was real.

  "If we're both copies," the other Elias said, his voice trembling, "then the one who walked into the booth in Chicago… he's gone."

  "Yes," Elias said. The word felt heavy, like a stone in his mouth. "He's gone."

  "So we're both… new."

  "We're both here."

  "But only one of me goes home," the other Elias said. The implication hung in the humid air. The company couldn't have two employees with the same ID, the same security clearance, the same life. One of them was an error. Errors were corrected.

  The lead technician sighed, rubbing her temples. "Corporate policy on duplication events is… strict. We can't reintegrate two instances. The psychological divergence is too high. It violates the Single-Identity Accord."

  "Who goes?" Elias asked. He hated how desperate he sounded. He thought of Sarah. If he didn't go home, who would kiss her goodbye? The other man would. He had the same memories. He loved her just as much. Was love data? If so, it could be copied. If it was something else, something soul-deep, then only one of them could possess it.

  But which one?

  "We'll run a diagnostic," the technician said. "One of you will be designated Prime. The other… will be held for observation."

  "Observation," the other Elias repeated. He knew what that meant. In the early days of teleportation, 'observation' meant termination. You couldn't keep a spare human being in a closet.

  They were separated. Elias was led to the left, the other him to the right. They looked back at each other one last time before the heavy doors sealed.

  In that second, Elias saw himself cry. He felt the tears on his own cheeks. He remembered the exact weight of his wedding ring. He remembered the smell of Sarah's shampoo. He knew, with absolute certainty, that he was the real Elias Vance.

  But he also knew, with a sinking dread, that the man in the other room felt the exact same way.

  The diagnostic took an hour. Elias sat in a white room, staring at his reflection in the glass. He tapped the table. He blinked. He was continuous. He was here. But the memory of the booth—the vaporization—was a gap. A cut in the film reel.

  The door opened. The technician returned. She wouldn't meet his eyes.

  "Results?" Elias asked.

  "Randomized selection," she said softly. "The system couldn't distinguish. So it chose."

  "Am I Prime?"

  She handed him a tablet. "You are cleared for transit to the residential sector. Your… counterpart… has been scheduled for reprocessing."

  Elias felt a wave of nausea. Reprocessing. Breaking him down into atoms again. But this time, there would be no rebuild.

  "Wait," Elias said, standing up. "If you kill him, you're killing me."

  "We are killing an echo," she said, her voice flat, practiced. "You are the employee. You have a job to do. Your wife is waiting."

  *Your wife.*

  The words struck him like a physical blow. If he went home, he was the husband. If the other man went home, he would be the husband. The difference was merely which body the company stamped with approval.

  The continuity of consciousness was a lie. He hadn't survived the trip from Chicago. The man who loved Sarah enough to step into that booth was dead. Elias was just the thing that woke up remembering him. And now, another thing had woke up, and it was going to die so Elias could keep pretending.

  "Can I see him?" Elias asked.

  "No."

  "Please. Just… let me tell him I'm sorry."

  The technician hesitated, then shook her head. "It's better if you don't. Go home, Mr. Vance. Don't be late."

  Elias walked out of the hub into the Singapore night. The air was thick and warm. He got into the company car. He looked at his hands on his lap. They were steady.

  He thought about the other man in the white room. Was he screaming? Was he calm? Did he feel the same fear, or had the 'reprocessing' sedative already kicked in?

  Elias closed his eyes. He tried to feel the love for Sarah. It was there. It felt real. It felt heavy and warm in his chest. But now, underneath it, there was a cold spot. A hollow knowledge.

  He was a copy of a copy of a copy. Four hundred and twelve times he had died. Four hundred and twelve times a new man had woken up with his memories. Today, the machine had just been honest about it. It had shown him the spare.

  The car stopped in front of his apartment. The lights were on. Sarah was in the kitchen. He could see her silhouette through the blinds. She was humming.

  Elias opened the car door. He stepped onto the pavement. He was here. He was alive. He had a life to live.

  But as he walked toward the door, he wondered if the man who walked through it would be him, or just the next in a long line of men who remembered how to love her, dying a little more every time the machine hummed.

  He knocked on the door. He practiced his smile. He hoped it was real.
