prompt: |-
  So I've been chewing on this teletransporter thing for weeks now, ever since a buddy explained it to me at a bar (the version where the machine scans your body, destroys the original, then builds an exact copy somewhere else out of new atoms). He was like "so did you actually survive that trip or did you just die and some copy of you thinks its you now" and honestly it messed me up a little. Like what if the machine glitches and makes TWO copies at the destination, are they both you? Neither? Does it even matter if the "you" that walks out the other end has all your memories and loves your wife and hates cilantro just like you did, if the original meat-you got vaporized five minutes ago in a booth in Chicago?

  I don't have any philosophy background, this is just something I think about on long drives, but I want to see this turned into an actual story rather than a thought experiment on a page. Can you write me a short story, maybe 800-1500 words, about someone who works a job that requires them to teleport regularly (like an oil rig worker, or a diplomat, whatever fits), and something goes wrong on one trip that forces them to actually confront whether they've been dying and being replaced this whole time. I don't need it to resolve neatly or hand me a philosophy answer, I just want to feel the weight of the question through what happens to this person and the people around them.
