      *   *Deontology (Duty-based):* Tricky. If driving is a "duty violation," trading it away is problematic. But if the duty is "reduce harm where possible," the deal works.
      *   *Virtue Ethics:* Does this make them better people? It fosters cooperation and empathy. But does it erode conviction?
