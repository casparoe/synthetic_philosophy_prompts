answer: |-
  Arthur sat at his kitchen table, the printed pages of the essay spread before him like a disassembled map. The heating vent hummed, pushing air that smelled of dust and burnt oil. Outside, a Tuesday morning was progressing in the standard, gray fashion: cars passing, a neighbor shoveling salt, the sky refusing to decide on rain.

  Arthur read the argument for the fourth time. It was elegant, airtight. Matter was merely a perception; there was no table, no paper, no kitchen, only the sensation of them. Furthermore, there was no Arthur to perceive them. There was only a bundle of perceptions, a flash of consciousness here, another there. Without a persisting self to tie them together, there was no thread on which to string the beads of moments. If Moment A and Moment B were identical in content, they were not sequential; they were the same. If the self was an illusion, the death of the self was a grammatical error.

  He closed his eyes. The logic settled over him like a heavy, warm blanket. He was not a man waiting for a diagnosis. He was not a man whose lymph nodes had swollen into hard, worrying grapes beneath his jaw. He was a series of discrete, unconnected nows. In this *now*, he was alive. In the next *now*, if it existed, he would also be alive, because there was no one to travel from the first to the second to experience the loss. Death required a traveler. Arthur had just proven there was no one home.

  He opened his eyes. The relief was intellectual, a crisp, cold clarity. He should feel lighter. He should feel immortal.

  He reached for his mug. The ceramic was cold. The coffee inside, which had been scalding when he began the third reading, was now lukewarm.

  Arthur stared at the liquid. Here was the betrayal. The heat had left the coffee. Entropy had occurred. If time were an illusion, the thermal energy should have remained suspended in the present tense. But the molecules had slowed. The state had changed.

  He pressed his fingers against his neck. The lymph node was there, a hard marble of biological fact. It throbbed. The pain was not a concept; it was a signal firing along a nerve, a signal that implied a history of damage and a future of worsening decay.

  "Discrete moments," Arthur whispered. His voice sounded thin in the small room.

  He tried to force the logic to overwrite the sensation. He looked at the microwave clock. 7:14. He closed his eyes for ten seconds. He opened them. 7:15.

  *Different numbers,* the logic argued. *But who saw the change?*
  *I did,* his body answered.

  The tremor started in his left hand. It was a subtle vibration, a hummingbird's wing trapped under the skin. He set the mug down to hide it. The logic said the tremor was just a perception in a vacuum, unconnected to the steady hand of a moment ago. But the fear rising in his chest was a bridge. It connected the memory of health to the reality of sickness. It spanned the gap the essay claimed was unbridgeable.

  Arthur stood up. The movement was too fast. The room tilted. He gripped the back of the chair. The wood was solid. It resisted his weight. If matter was only perception, why did it push back? If the self was a fiction, who was afraid?

  He walked to the window. He did not look at his reflection in the glass—he had no interest in confirming the pallor he knew was there—but looked out at the street. A dog barked. A car engine revved. These were events. They happened *after* the silence, *before* the next sound. They demanded a sequence.

  The essay lay on the table behind him, a perfect crystal structure of thought. It offered him a universe where he could not die because he had never truly been born. It was a paradise of stasis.

  But his throat hurt when he swallowed.

  He turned back to the room. He needed to leave. The appointment was at 8:30. If time was false, the appointment was a hallucination. The doctor was a hallucination. The treatment, the prognosis, the end—it was all a narrative trick.

  Arthur put on his coat. He slid his arms into the sleeves. The wool scratched his wrists. He buttoned it, one, two, three. The action required duration. He could not button all three at once. He was forced to inhabit the interval between the buttons.

  He picked up the essay. He should leave it. It was a key to a door that didn't exist. But he folded it and put it in his pocket. It pressed against his hip, a hard square of paper against the soft, failing meat of his body.

  He walked to the door. He placed his hand on the knob. The metal was cold, colder than the coffee.

  For a second, standing in the threshold, the logic flared up again, bright and blinding. *You are not moving,* it told him. *You are here. You are always here. There is no hallway to walk down, no elevator to descend, no street to cross. There is only this instant, and it is safe.*

  Arthur turned the knob. The latch clicked.

  He stepped out into the hallway. The air was different here, stale and recirculated. He locked the door. The sound echoed.

  He began to walk toward the elevator. With every step, the conviction warred with the pulse in his neck. The logic was true; he felt it in his mind, undeniable and absolute. The fear was true; he felt it in his gut, undeniable and absolute.

  He was the argument that disproved death. He was also the animal running from it.

  As the elevator doors opened, Arthur realized he was not one or the other. He was the friction between them. He stepped inside and pressed the button for the lobby. The numbers began to count down. 12. 11. 10.

  He watched the numbers change. He knew they were an illusion. He knew he was not descending. He knew he was not Arthur.

  But as the cable groaned and his stomach lifted with the drop, he held his breath, waiting for the impact of the ground, praying it would never come, knowing it would. He was devoured by the descent, and he was the descent itself. The doors opened, and he walked out into the morning, carrying his immortality like a secret he was too mortal to keep.
