      *   *Crucial Point:* I need to make sure Amara addresses the "rights" objection strongly. Menkiti argues that rights are secondary to duties. Amara needs to articulate why that's not dangerous.

  7.  **Final Review:** Does this meet the user's constraint of "equally sharp"?
      *   Kwame's point about the "tyranny of the community" is strong.
