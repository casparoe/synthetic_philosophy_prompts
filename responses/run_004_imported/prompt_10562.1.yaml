          *   Elena: (Crucial moment) She needs to distinguish between *species-typical design* and *wear and tear*. Aging isn't a specific pathology; it's the accumulation of entropy. It's the background rate of decay, not a specific system failure.
      *   **Round 3: The ICD-11 Nuance.**
          *   Discuss the specific code (MG2A "Old Age"). It was an extension code, not a primary diagnosis.
          *   Elena: This proves the point. It's a factor, not a cause.
          *   Marcus: Semantics. If I treat it, I want insurance to pay.
      *   **Round 4: Consequences (Dad's supplements).**
          *   Marcus: If it's a disease, we research cures.
          *   Elena: If it's a disease, every healthy 80-year-old is "sick." It shifts resources from actual illnesses (cancer, Alzheimer's).
      *   **Closing:** No clear winner, but mutual understanding of the stakes.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is Elena dodging the "universal = normal" point?
      *   *Fix:* Make sure Elena explicitly acknowledges that aging is universal but argues *why* that disqualifies it from "disease" status in her framework. She should use the "evolutionary purpose" argument—aging isn't selected for, but it's the inevitable shutdown, not a malfunction like cancer.
      *   *Critique:* Is Marcus too emotional?
