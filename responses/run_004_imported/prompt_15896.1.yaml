answer: |-
  The discovery of Gottlob Frege's 1924 political diary presents a profound crisis for the historiography of analytic philosophy. To generations of students, Frege was the austere, saintly figure who liberated logic from the vagaries of human psychology, establishing the objective foundations upon which mathematics and language rest. Michael Dummett, who arguably did more than any other twentieth-century philosopher to establish Frege's centrality, described the revelation of Frege's virulent antisemitism and reactionary nationalism as a source of deep dismay. The diary depicts a man hostile to the Weimar Republic, opposed to universal suffrage, and eager to strip Jews of civil rights. This creates a dissonance between the philosopher of universal, objective "Thoughts" (*Gedanken*) and the partisan of exclusionary, ethnic nationalism.

  The question of how this biography bears on his philosophy requires navigating two distinct levels of inquiry. First, there is the general methodological question: to what extent should a thinker's moral or political failings invalidate their arguments? Second, there is the specific exegetical question: are Frege's technical commitments—his anti-psychologism, his Platonism, his distinction between sense and reference—structurally complicit in his politics, or are they innocent tools? After weighing the arguments for separation against the evidence of structural affinity, I argue for a definite verdict: while Frege's logical calculus retains its formal utility, the diary necessitates a rejection of the *normative authority* of his philosophical framework. We must utilize Frege's tools while dismantling the myth that his conception of objectivity is politically neutral. His philosophy cannot be read as a pure sanctuary of reason; it must be understood as a project deeply entangled with a desire for order that is compatible with authoritarianism.

  To address the general question, one must first confront the Genetic Fallacy. In logic and mathematics, the truth of a proposition is independent of the psychological or moral state of the person asserting it. If Frege proves that a concept is subordinate to another, that relation holds regardless of whether he was a democrat or a fascist. To argue otherwise is to confuse the context of discovery with the context of justification. Bertrand Russell's discovery of a paradox in Frege's system was a mathematical refutation; Frege's antisemitism is a moral stain. From this "Separationist" perspective, the diary is biographically tragic but philosophically irrelevant. To discard the *Begriffsschrift* because of the diary would be akin to discarding calculus because of Newton's alchemical obsessions or vindictive temperament. The arguments must stand or fall on their own merits.

  However, this Separationist view relies on a conception of philosophy as merely a technical discipline akin to mathematics. Philosophy, unlike pure math, is inherently concerned with the nature of human understanding, the structure of society, and the norms of reasoning. When a philosopher constructs a system intended to govern how we *ought* to think, their conception of the "human" and the "rational" becomes relevant. If a philosopher's technical distinctions rely on a specific, contested anthropology, their biography can illuminate the motivations behind those distinctions. Therefore, while the diary cannot logically refute the law of non-contradiction, it can refute the *philosophical narrative* Frege built around it. It forces us to ask whether his drive for absolute objectivity was a neutral scientific pursuit or a reaction against a world he found too chaotic, too human, and too diverse.

  This leads to the specific question of substantive connections between Frege's technical commitments and his politics. Here, the Separationist defense begins to fray. There are striking structural homologies between Frege's philosophy and his politics, suggesting they are not merely coincidental but stem from a unified worldview. The core of Frege's revolution was his attack on "psychologism"—the idea that logic is a description of how human beings happen to think. Frege insisted that logic describes an objective "third realm" of Thoughts, independent of any individual mind. While technically sound as a defense of logical truth, this move also functions as an elitist gesture. By severing logic from human psychology, Frege renders it inaccessible to the "common" understanding, placing it in the hands of a disciplined few capable of grasping these objective entities.

  This mirrors his political rejection of democracy. Just as he believed truth is not determined by the "sway of the masses" (universal suffrage), he believed logic is not determined by common usage or psychological consensus. His anti-psychologism is the epistemological correlate of his anti-democracy. Both positions posit a rigid, external authority (Logic/The State) that stands above the messy, subjective flux of individual human lives. Furthermore, Frege's Platonism posits a realm of perfect, unchanging entities. His politics yearned for a static, hierarchical social order purified of "alien" elements. The desire for *purity* in his logic—precise definitions, lack of ambiguity, rigorous boundaries—resonates uncomfortably with his desire for ethnic and political purity. The diary suggests that Frege's philosophical rigor was not merely an intellectual virtue but part of a broader psychological disposition that viewed ambiguity, plurality, and change as threats to be eliminated.

  Critics of this "Connectionist" view might argue that this is guilt by association. They would point out that many liberal democrats have embraced Platonism and anti-psychologism. They would argue that Frege's logic is a tool that can be used for liberation just as easily as for reaction. This is true; the formalism of analytic philosophy has been adopted by progressives and conservatives alike. However, to stop there is to ignore the *spirit* in which the system was built. Frege did not present his logic as a tool for negotiation or democratic deliberation; he presented it as a discovery of eternal, binding laws. The diary reveals that for Frege, "eternal law" was conceptually linked to authoritarian command.

  Therefore, my verdict is this: **Frege's diary does not invalidate his logical theorems, but it discredits his philosophical ideology.** We must adopt a stance of *critical instrumentalism*. We are justified in using Frege's distinctions (such as sense and reference) and his quantificational logic because they work; they solve problems and clarify language. However, we must reject the Fregean *mythos* that these tools grant us access to a "God's eye view" completely detached from human perspective. The diary teaches us that the claim to absolute, perspective-free objectivity can be a mask for exclusion. When Frege argues that *Gedanken* exist in a third realm independent of human grasp, he is making a metaphysical claim that the diary reveals is psychologically comforting to a man who despised the actual, living humans of the Weimar Republic.

  Consequently, the assessment of Frege's philosophy must shift from reverence to critical engagement. We cannot treat him as the "founder" who settled the nature of language and logic once and for all. Instead, we must view his work as a monumental achievement that is nevertheless situated within a specific, flawed historical and psychological context. The diary forces us to recognize that the "objectivity" Frege championed is not a neutral given but a specific philosophical achievement that carries risks. It risks devaluing the subjective, the particular, and the communal aspects of human life in favor of a rigid formalism.

  In conclusion, Michael Dummett's dismay was warranted, but it should not lead to a simple excision of Frege's politics from his philosophy. To compartmentalize them entirely is to sanitize the history of ideas and ignore the ways in which metaphysical commitments can align with political pathologies. Frege's logic remains a powerful engine for thought, but the diary removes its halo. We should use Frege's tools, but we must do so with the awareness that the drive for absolute logical purity can, in the wrong hands, become a template for political tyranny. The diary does not destroy Frege's philosophy, but it saves us from being enslaved by it. It compels us to accept that while logic may be universal, the philosopher who wields it is all too human, and all too fallible.
