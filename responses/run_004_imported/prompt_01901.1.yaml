answer: |-
  **Setting:** *The balcony of a crowded apartment party. It is cold. Inside, music thumps. Through the glass door, Maya can be seen laughing, a cigarette dangling from her fingers. Elias (Philosopher) and Sarah (Economist) stand by the railing, holding coats.*

  **Sarah:** There it is. The crossover point. At breakfast, the health benefit was distant, abstract. Now? The nicotine is immediate. The curve crossed. It's textbook hyperbolic discounting.

  **Elias:** It's a broken promise. She didn't just change her mind, Sarah. She abandoned a resolution. There's a difference. If she'd woken up and decided smoking wasn't actually bad for her, that's a preference change. But she still believes it's bad. She just couldn't hold the line.

  **Sarah:** That's the mysticism I'm talking about. "Holding the line." You're positing a little homunculus inside her head—a "will"—that got tired. My model doesn't need a ghost in the machine. It just needs time. As the reward gets closer, its present value inflates exponentially relative to the future cost. She's the same agent she was at breakfast, just operating under a different temporal constraint.

  **Elias:** But that's the problem. If she's the "same agent" governed only by shifting discount rates, then she didn't *fail*. A falling rock doesn't fail when it hits the ground; it just follows gravity. If her preferences simply reversed because the object moved closer in time, then smoking *right now* is genuinely what she prefers more. So why does she look guilty?

  **Sarah:** Guilt is a sunk cost emotion. It's a social signal. But look at the difficulty your view faces: You say she abandoned a resolution "too readily." How do you measure "too readily"? If I resolve to fast and then eat because I'm starving, did I show weakness of will? Or did I have a good reason?

  **Elias:** Holton addresses that. Weakness of will is abandoning a resolution *without* a sufficient reason. She judged at breakfast that health outweighs pleasure. At the party, nothing changed factually. The health risk didn't vanish. So, she dropped the policy without new evidence. That's the failure.

  **Sarah:** But "sufficient reason" is just another way of saying "the preference shifted enough to justify the action." You're smuggling utility back in. Here's the substantive hole in your resolution account: It explains the *normativity*—why she feels bad—but it doesn't explain the *mechanics*. How does a resolution actually stop a preference from flipping? If the hyperbolic curve is steep enough, what magical force does this "resolution" exert to flatten it? If it exerts no force, it's irrelevant. If it does exert force, it must have its own utility value. And if it has a utility value, we're back to my discounting model.

  **Elias:** It's not magic; it's a distinct psychological capacity. Think of it like a muscle. She can train herself to ignore the spike in the curve. But your model has a bigger blind spot. It treats the breakfast announcement as cheap talk. But we know people use resolutions to bind their future selves. If it were just discounting, she would have known at breakfast she would smoke tonight. She wouldn't have announced the quit attempt. The fact that she tried to bind herself proves she knows her preferences aren't stable, but she also believes she has an agency that can override them.

  **Sarah:** Pre-commitment isn't proof of a "will." It's proof of strategic sophistication. I know I'm prone to hyperbolic discounting, so I try to lock in a choice. But the lock failed. Here's the difficulty for you: Your view makes weakness of will a moral category, not a psychological one. If I understand the math, I can engineer the environment so she never has to use this "will." I take away the cigarettes. If I do that, and she doesn't smoke, did she exhibit strength of will? Or did I just change the constraints?

  **Elias:** You changed the constraints, yes. But suppose I put the cigarettes on the table and she *still* doesn't take one. Your model says that's just because the discount rate didn't spike high enough. But we praise her. We treat her differently than someone who didn't smoke because there were no cigarettes. We recognize an exercise of agency. Your model collapses the distinction between *unable* to smoke and *choosing not* to smoke.

  **Sarah:** Does it? I distinguish between them based on counterfactuals. If a cigarette appeared, would she smoke? That's a probability calculation. You want to say there's a binary switch called "Will" that flipped on. I'm saying there's a threshold of stimulation. But let's press your "abandonment" idea. You say she abandoned the resolution. But what if the resolution was irrational? What if at breakfast she was in a cold state and overvalued long-term health, and at the party, in a hot state, she correctly valued immediate stress relief? Who's to say the breakfast self is the "real" one authorized to make resolutions?

  **Elias:** Because the breakfast self is the planning self. The party self is the impulsive self. Weakness of will is precisely the impulsive self hijacking the planning self's authority.

  **Sarah:** That's a narrative, not an explanation. Why is the planning self the boss? Maybe the party self is correcting a mistake. Maybe she's miserable and needs the smoke. Your view requires us to privilege the distant preference over the immediate one axiomatically. But evolutionarily, immediate rewards usually matter more for survival. By calling it "weakness," you're just asserting that long-term planning is superior. My model is neutral. It just says the weights changed.

  **Elias:** Neutrality is a vice here. If we are neutral, we can't explain regret. Maya isn't neutral. She feels she betrayed herself. Your model predicts she should just update her priors and move on. "Oh, my discount rate is high tonight." But she won't do that. She'll say, "I was weak." She acknowledges a standard she failed to meet, not just a variable that fluctuated.

  **Sarah:** Because she's been socialized to believe in the soul. Look, here is the hard problem for your side: If "will" is a capacity to resist preference reversals, what motivates the will? To resist the cigarette, the "will" must prefer *not* smoking more than smoking. But you just said her preference *did* flip to smoking. So, for her to not smoke, the "will" would have to be a third preference, stronger than both. But then it's just another preference in the stack. You haven't explained weakness of will; you've just renamed "strongest preference" as "will."

  **Elias:** No, because a resolution isn't a preference for an outcome. It's a preference for a *policy*. It's a second-order state. I prefer not to smoke, but I also prefer to be the kind of person who keeps promises. When she smokes, she violates the second-order policy. Your discounting model only tracks first-order goods: health vs. nicotine. It can't account for the value of integrity itself as a distinct motivator that isn't subject to the same discounting curve.

  **Sarah:** But integrity *is* subject to discounting! That's the point. The value of "being a person who keeps promises" is a future reward (self-respect tomorrow). The nicotine is a present reward. The hyperbolic curve inflates the nicotine *more* than it inflates the self-respect. That's why she smokes. You don't need a special faculty; you just need to acknowledge that "integrity" is a commodity with a delayed payout.

  **Elias:** If integrity is just a commodity with a delayed payout, then a sociopath who doesn't value it is just someone with a different discount rate. But we don't say the sociopath has a "steeper discount curve." We say they lack a moral capacity. Similarly, Maya isn't just discounting the future heavily; she's failing to execute a command she gave herself.

  **Sarah:** And I'm saying that "command" is just a neural pathway that got inhibited by a stronger dopaminergic signal. You're clinging to the *feeling* of agency. I'm looking at the *function*. If I want to help Maya, your advice is "try harder, engage your will." That's useless. My advice is "don't go to parties," or "use a nicotine patch to lower the value of the cigarette." I can intervene on the variables. You can only intervene on the homunculus.

  **Elias:** And that's why your advice fails long-term. She can't avoid every party. Eventually, she has to stand in the presence of the temptation and *choose*. If she never exercises the capacity to maintain a resolution against a shifting preference, she never develops the character trait of fidelity. You're treating the symptom; I'm treating the agent.

  **Sarah:** Or I'm fixing the machine, and you're lecturing it.

  **Elias:** (Watching Maya flick the ash) She's coming back inside. Watch her face.

  **Sarah:** I see a person whose utility maximization just caught up with her constraints.

  **Elias:** I see a person who knows she could have done otherwise, and didn't.

  **Sarah:** Then we agree on the data. We just disagree on whether "could have done otherwise" is a reality or a useful illusion.

  **Elias:** If it's an illusion, Sarah, then neither of us is actually arguing for our position. We're just determined to speak.

  **Sarah:** (Smiles) Exactly. So pass me that cigarette. My discount rate just spiked.

  **Elias:** Don't. You made a resolution last week about your running.

  **Sarah:** See? You're trying to bind me. It's not going to work. The curve is already crossing.

  **Elias:** Then prove me wrong. Not by changing the constraints. By keeping the line.

  **Sarah:** (Pauses, looks at the cigarette pack, then puts it away) Fine. But only because the long-term utility of winning this argument outweighs the short-term nicotine hit.

  **Elias:** Call it what you want. I call it will.

  **Sarah:** I call it a calculated investment.

  **Elias:** As long as you don't smoke.

  **Sarah:** As long as the math holds.
