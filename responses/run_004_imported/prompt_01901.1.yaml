      *   *Elias:* "Shame proves the resolution existed." -> *Challenge:* But your 'will' is a black box. How does it exert force?
      *   *Sarah:* "It's not force, it's strategic bundling." -> *Challenge:* Bundling requires a planner. Who is the planner?
      *   *Elias:* "The planner is the agent." -> *Challenge:* That's circular.
      *   *Sarah:* "Your view makes akrasia a moral failure, mine makes it a design flaw." -> *Challenge:* If it's a design flaw, can we fix it without 'will'?
      *   *Elias:* "If it's just math, she isn't responsible."
      *   *Sarah:* "Responsibility is an incentive mechanism."

      *(Self-Correction during drafting)*: Make sure they don't just talk past each other. They need to poke holes in the *specific* explanation of the cigarette moment.
      *   *Elias needs to ask:* How does discounting explain the *normative* force of the breakfast announcement?
      *   *Sarah needs to ask:* How does "resolution" explain the *mechanism* of the failure without invoking magic?

  7.  **Polishing the Voice:**
      *   Sarah should sound pragmatic, slightly reductionist, focused on mechanisms and incentives.
      *   Elias should sound normative, focused on agency, responsibility, and phenomenology.
      *   Ensure the ending is ambiguous/no clear winner.

  8.  **Final Review against Constraints:**
