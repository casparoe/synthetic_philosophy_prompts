      *   *Speed:* Hacking talked about decades/centuries. TikTok operates in days/weeks. Does speed matter ontologically?
      *   *Personalization:* Hacking talked about broad cultural scripts. Algorithms serve hyper-specific feedback loops.
      *   *Authority:* Hacking focused on *experts* (psychiatrists, scientists). TikTok shifts authority to *peers* and *influencers*.
