  ### TA-to-TA Note on Part (c)

  Since you mentioned you're still getting your grip on the material, here's the specific distinction that makes part (c) incorrect, just so you have it in your back pocket:

  *   **The Student's Claim:** Fischer admits there are alternative possibilities ("flickers") left over on the indeterministic horn, and therefore **PAP is saved** (the Frankfurt case fails).
  *   **Fischer's Actual View:** Fischer admits there are alternative possibilities ("flickers") left over, **BUT** he argues they are too trivial ("non-robust") to satisfy the moral intuition behind PAP. For Fischer, an alternative possibility only matters if it allows the agent to avoid moral responsibility. In a Frankfurt case, even if Jones flickers differently, he's still responsible. Therefore, **PAP is still refuted**, and the Frankfurt case stands.

