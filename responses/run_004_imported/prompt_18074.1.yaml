answer: |-
  Good evening, everyone. For those who don't know me, I'm a friend of Mara's. I make my living writing about science and ideas, which, Mara tells me, makes me the safest possible person to give this toast. Apparently, when you spend your life analyzing how things work, you're less likely to get swept away by sentiment. Or perhaps she just knows I'm used to dealing with complex systems that have a tendency to collapse if you look at them wrong.

  Standing here, looking at the two of you, I am struck by how much thought has gone into this moment. Most couples build a marriage on tradition, or momentum, or the simple, beautiful desire to be together. Mara and Alex have done that, too. But they have also built their marriage on a specific idea. Those of you who looked at the program epigraph know exactly what I'm talking about. For those who didn't catch it, the quote comes from the philosopher Bertrand Russell, specifically his book *Marriage and Morals*.

  Now, I want to speak to both halves of this room for a moment, because this quote is doing a lot of heavy lifting tonight.

  To the family and friends who might be wondering what a 1920s philosopher is doing at a wedding: Russell's core idea was actually quite simple and deeply romantic. He argued that love shouldn't be about possession. He suggested that jealousy is often just a habit of mind—a fear we can unlearn—and that a marriage lasts not because of strict rules, but because of radical honesty and the daily choice to trust. He believed that if you treat your partner as a free person, rather than something you own, the love you share is actually stronger. That is a beautiful thing to aspire to, regardless of your views on tradition. It's about respecting the humanity in each other.

  To the colleagues from the department: Yes, *that* Russell. And yes, we are all aware of the biography. We know that Russell's own attempt to live out these ideals with his second wife, Dora, ended in precisely the kind of jealousy and recrimination he claimed a rational couple could rise above.

  I mention this not to cast a shadow, but to offer a light. There is a wonderful irony in the fact that the man who wrote the manual on rational love couldn't quite manage to drive the car. But I don't think that failure invalidates the theory. I think it just highlights the difficulty of the work. Russell was a genius, but he was also a human being living in a different century. Mara and Alex are not Bertrand and Dora. They are not trying to reenact a historical case study; they are using a philosophical tool to build a modern home.

  The fact that they are willing to stare directly at the hardest parts of human relationships—jealousy, insecurity, the desire for control—before they even say "I do," tells me something profound about their commitment. It tells me they aren't sleepwalking into this. They aren't relying on the inertia of social norms to keep them together. They are choosing each other, actively and consciously, every single day.

  There is a moment in every marriage where the theory meets the practice. Where the epigraph meets the Tuesday night argument about whose turn it is to do the dishes. Russell failed that test, perhaps because he valued the idea more than the person. But looking at Mara and Alex tonight, I don't see two ideologues. I see two people who value *each other* more than any idea.

  I see a couple who knows that freedom without commitment is just drift, and commitment without freedom is just a cage. They have chosen to walk the narrow, beautiful path in between. That requires courage. It requires a level of communication that most of us only pretend to attempt. And it requires a grace that I have seen them offer one another time and time again.

  So, my wish for you is not that you prove Russell right. My wish is not that you live up to a theory. My wish is that you continue to do the hard, unglamorous work of talking to each other when it would be easier to assume. May you always treat each other as free people who choose to come home. May you find that your trust is sturdy enough to hold your freedom, and your love is deep enough to quiet the habit of jealousy.

  Bertrand Russell wrote about love, but you two are going to live it. And I suspect you'll write a much better ending than he did.

  Please raise your glasses. To Mara and Alex: May your arguments be short, your honesty be kind, and your love be the one law you never need to question.

  To Mara and Alex.
