answer: |-
  Here are 10 interview questions designed to bypass the introductory "Explainer 101" material and dig into the actual friction points in the current literature. I've structured them with the **Question**, the **Intent** (so you know why you're asking it), and a **Follow-Up** tailored to the most common academic dodge.

  ### 1. The Complexity Class Dodge
  **Question:** "One of the original selling points of debate was that it allows a human judge to verify claims beyond their direct capability. But critics argue that cross-examination doesn't necessarily resolve obfuscated arguments; it just relocates the problem to a nastier complexity class where the judge can't even verify the *rebuttal*. Do you think cross-examination actually solves the obfuscation problem, or does it just push the verification burden one step deeper into the weeds?"
  *   **Intent:** Hits your specific requirement on complexity/obfuscation immediately. Shows you understand the computational limits of the human judge.
  *   **Likely Dodge:** "It depends on the transcript length and the specific domain."
  *   **Follow-Up:** "If it depends on the domain, does that mean Debate isn't a *general* oversight protocol, but rather a tool we can only deploy on problems where the 'truth' has a short verification path? And if so, isn't that most of the dangerous stuff we're worried about?"

  ### 2. Truth vs. Rhetoric (The Khan Problem)
  **Question:** "I want to talk about the equilibrium. The Khan et al. paper on persuasiveness really highlighted that LLMs are optimized to win the judge's approval, not necessarily to be factually correct. Why should we expect a debate's equilibrium to track truth rather than sheer persuasiveness? What mechanism breaks the link between 'sounding right' and 'winning'?"
  *   **Intent:** Hits your requirement on the Khan paper. Forces her to explain the *mechanism* of truth-tracking, not just the hope.
  *   **Likely Dodge:** "We assume the models are equally capable, so rhetoric cancels out."
  *   **Follow-Up:** "But in a safety context, we are often worried about asymmetric capabilities or one model finding a 'rhetorical hack' the other hasn't discovered. If rhetoric doesn't perfectly cancel out, doesn't the judge just become a vulnerability surface for social engineering?"

  ### 3. The Capability Gap (Khan vs. DeepMind)
  **Question:** "Speaking of Khan, their results were somewhat rosy regarding debate improving accuracy. But DeepMind's follow-up found much more modest gains once the judge-debater capability gap widens. How do you square those two findings? Are we banking on a regime where the judge is smarter than current data suggests is feasible?"
  *   **Intent:** Hits your requirement on reconciling the literature. Highlights the scalability bottleneck.
  *   **Likely Dodge:** "Those are early results; we expect judge training to improve."
  *   **Follow-Up:** "If the solution is 'better judges,' aren't we just kicking the can down the road? The whole point of scalable oversight is that the judge *is* the bottleneck. If the judge needs to scale capabilities linearly with the debaters, do we actually have a scalability solution?"

  ### 4. The "Honest Equilibrium" Assumption
  **Question:** "A lot of the theoretical safety guarantees rely on the existence of an 'honest equilibrium.' But in practice, RLHF tends to optimize for sycophancy. If we train debaters via RL on win-rates, aren't we actively incentivizing them to find the path of least resistance for the judge, rather than the path of highest truth?"
  *   **Intent:** Moves from theory to training dynamics. Questions the reward function itself.
  *   **Likely Dodge:** "We can regularize against sycophancy."
  *   **Follow-Up:** "How do you regularize against something you can't detect? If the judge can't tell the difference between a sycophantic lie and a complex truth, what does the regularization signal look like?"

  ### 5. Debate vs. Iterated Distillation
  **Question:** "Given the engineering overhead of running multi-turn debates, how do you view Debate compared to Iterated Distillation and Amplification (IDA)? Are we still betting on Debate as the primary protocol, or has the field quietly shifted toward distillation because it's more compute-efficient?"
  *   **Intent:** Forces a comparison with the main competitor in the scalable oversight space.
  *   **Likely Dodge:** "They are complementary approaches."
  *   **Follow-Up:** "Complementary is a safe word. But if you had to allocate 80% of the oversight budget tomorrow, does Debate still get the majority share, or is it now a niche tool for specific verification tasks?"

  ### 6. The "Cheat Sheet" Problem
  **Question:** "In human debate, we worry about debaters colluding or using shared shorthand the judge doesn't understand. With AI agents sharing weights or training distributions, isn't there a risk they develop a 'cipher'—a way to signal correctness to each other that looks like noise to the human judge?"
  *   **Intent:** Addresses the unique risk of AI debaters (non-human communication channels).
  *   **Likely Dodge:** "We can penalize opaque language."
  *   **Follow-Up:** "Penalize how? If the cipher is mathematically sound but conceptually dense, how does the judge distinguish between 'high-level abstraction' and 'intentional obfuscation'?"

  ### 7. Failure Modes & Catastrophe
  **Question:** "Let's talk failure modes. If Debate fails as an oversight protocol, how does it fail? Does it fail quietly by giving us false confidence in a misaligned model, or does it fail loudly by making the model impossible to query?"
  *   **Intent:** Safety labs care most about silent failures. This asks for a specific risk profile.
  *   **Likely Dodge:** "We have monitoring in place."
  *   **Follow-Up:** "Monitoring based on what metrics? If the debate looks coherent and the judge is convinced, what's the leading indicator that the oversight protocol itself has been compromised?"

  ### 8. The Human-in-the-Loop Sustainability
  **Question:** "Most debate experiments use humans as judges. For this to work at the frontier, we need humans to judge millions of interactions. Do you actually see a path where humans remain the judge, or do we eventually have to recurse to AI judges? And if we recurse to AI judges, haven't we just moved the alignment problem up one layer?"
  *   **Intent:** Challenges the scalability of the human component.
  *   **Likely Dodge:** "We will use AI assistance for judges."
  *   **Follow-Up:** "If the judge is AI-assisted, aren't we just measuring the alignment of the assistant? At what point does the 'human' in the loop become a figurehead?"

  ### 9. Domain Specificity
  **Question:** "Most successful debate demos are on factual QA or math, where there is a ground truth. Safety questions often don't have ground truth—they're about values or trajectory. Does Debate lose its efficacy when the 'truth' is normative rather than empirical?"
  *   **Intent:** Moves the topic from math/facts to values/alignment, which is harder.
  *   **Likely Dodge:** "We can debate values by debating the consequences of actions."
  *   **Follow-Up:** "But if two models debate the consequences and disagree on the long-term forecast, the judge is back to guessing. Does Debate actually help with moral uncertainty, or just factual uncertainty?"

  ### 10. The "So What?" for the Lab
  **Question:** "Finally, for our team specifically: We aren't DeepMind. We don't have the compute to train massive debater pairs from scratch. What is the low-compute version of Debate that we should be implementing internally right now? Is it useful for code review, or is it strictly a frontier model concern?"
  *   **Intent:** Brings it back to your internal context. Practical application.
  *   **Likely Dodge:** "It's useful for many things."
  *   **Follow-Up:** "Can you give me one concrete workflow? If I want to use Debate to audit a fine-tuning run next month, what does that prompt chain actually look like?"

  ### Tips for the Interview
  *   **The "Pause":** When she gives a polished, academic answer, don't jump in immediately. Let the silence hang for two seconds. Often, they will fill that silence with the *real* answer or a concession.
  *   **The "Translation":** If she gets too technical, interrupt gently: "For the engineers in the room who haven't read the latest arXiv dump, what does that look like in practice?"
  *   **The "Steel Man":** If you push back too hard, frame it as: "I want to steel-man the critique here so we can knock it down properly..." This keeps it collaborative rather than adversarial.
