answer: |-
  You have stumbled upon one of the most famous puzzles in probability theory, known as the **Two Envelopes Problem**. It has baffled mathematicians and philosophers for decades, so you should feel good about the fact that your gut told you something was "off." Your intuition was correct: the math you did in your head contains a hidden, flawed assumption.

  Here is the breakdown of why the reasoning breaks, why the situation is actually symmetrical, and whether you made the rational choice.

  ### 1. The Symmetry Check (The "Coworker Test")
  The quickest way to see the flaw is to look at the situation from your coworker's perspective.
  *   You have an envelope with $50.
  *   She has the partner envelope.
  *   If your math says you should switch to gain expected value, **her math must say the exact same thing.** She knows one envelope is double the other. If she opened hers and saw $25, she'd think the other is $50. If she saw $100, she'd think the other is $50.

  If switching is always the mathematically superior move for *both* of you, then you should both switch. But if you both switch, you just swap envelopes and end up exactly where you started. You haven't created value out of thin air. If a strategy suggests you should swap back and forth infinitely to keep increasing your expected value, the strategy is broken.

  ### 2. The Flaw in the 50/50 Assumption
  Your calculation relied on this specific line: *"There's a 50% chance her envelope has $25... and a 50% chance it has $100."*

  This is the leak in the logic. For that 50/50 split to be true, it requires a very specific (and impossible) condition about how the gift cards were distributed at the party.

  Let's look at the two scenarios where you could be holding a $50 bill:
  *   **Scenario A:** The pair is ($25, $50). You hold the **high** end.
  *   **Scenario B:** The pair is ($50, $100). You hold the **low** end.

  Your math assumes Scenario A and Scenario B are equally likely. But how do you know that? That depends entirely on the office budget and the organizer's choices.
  *   If the organizer bought ten ($25, $50) pairs and only one ($50, $100) pair, it is **much more likely** you are in Scenario A. In that case, switching is likely to lose you money.
  *   If the organizer bought ten ($50, $100) pairs and only one ($25, $50) pair, it is **much more likely** you are in Scenario B. In that case, switching is likely to make you money.

  Without knowing the **prior distribution** (how many of each pair were actually in the pool), you cannot assign a 50% probability to either outcome.

  ### 3. The "Infinite Money" Problem
  For your logic ("I should always switch no matter what number I see") to work, it would have to apply to *any* amount you opened.
  *   If you opened $10, you'd want to switch (chance of $5 or $20).
  *   If you opened $1,000, you'd want to switch (chance of $500 or $2,000).

  For this to be true for every possible number, there would need to be an equal probability of every possible dollar amount existing in the envelopes, from $1 to infinity. In the real world (and definitely at an office party), there is a **maximum budget**.

  If $50 happens to be the maximum gift card value the company allowed, then the other envelope *must* be $25. In that case, switching guarantees a loss. Because there is a "ceiling" on the gift card values, seeing a high number like $50 actually gives you information: it makes it more likely you are at the top of a pair than the bottom of a higher pair, simply because higher pairs might not exist.

  ### 4. So, what was the rational move?
  Since you did not know the distribution of the pairs (how many 25/50s vs 50/100s were in the mix), you had no way to calculate a true Expected Value.

  In the absence of that information, you must fall back on the **symmetry of the initial setup**. Before you opened the envelope, your envelope and your coworker's envelope had the exact same expected value. Opening yours revealed a number, but without knowing the bounds of the possible values (the min and max of the party budget), that number gives you no strategic advantage.

  **The Verdict:**
  You made the rational choice by keeping your card.
  *   **Mathematically:** There is no expected gain from switching without knowing the distribution of pairs.
  *   **Psychologically:** Switching introduces risk (ending up with $25) for a hypothetical gain, based on flawed probability assumptions.
  *   **Logically:** If switching were truly advantageous, your coworker would have demanded the switch just as loudly as you wanted it. Since the situation is symmetric, the advantage must be zero.

  You can stop bugging yourself: the "paradox" is a trick of language and hidden assumptions, not a real opportunity you missed. Enjoy the $50!
