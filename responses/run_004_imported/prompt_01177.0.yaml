answer: |-
  This is an excellent worry, and frankly, if you *didn't* have this worry, I'd be concerned you hadn't read the formalism closely enough. You have put your finger on the single most important technical constraint in Epistemic Utility Theory (EUT): **the requirement of Strict Propriety.**

  Your intuition is correct regarding *actual* accuracy: If $P$ is true, a credence of 1 is strictly more accurate than a credence of 0.7. If the norm were simply "Maximize Actual Accuracy," the theory would indeed collapse into dogmatism (always believe 1 or 0).

  However, EUT does not tell agents to maximize *actual* accuracy (which is impossible for non-omniscient agents); it tells them to maximize **Expected Epistemic Utility (EEU)**.

  Here is how you can unpack this in your quals paper, distinguishing between a misunderstanding of the math and a deeper philosophical critique about whether "accuracy" is doing the normative heavy lifting.

  ### 1. The Technical Solution: Proper Scoring Rules
  The reason EUT doesn't recommend extremization is that it employs **strictly proper scoring rules** (like the Brier Score).

  A scoring rule is "proper" if, from the perspective of any given credence function, that very function expects *itself* to be more accurate than any other credence function.

  **The Math (for your paper):**
  Imagine a coin you know to be fair (credence 0.5 in Heads).
  *   **Option A (Extremize):** You adopt credence 1.0 in Heads.
      *   If Heads (50% chance): Score is 0 (perfect).
      *   If Tails (50% chance): Score is 1 (maximal error).
      *   **Expected Score:** $0.5(0) + 0.5(1) = 0.5$.
  *   **Option B (Calibrate/Proportion):** You adopt credence 0.5 in Heads.
      *   If Heads (50% chance): Score is $(1-0.5)^2 = 0.25$.
      *   If Tails (50% chance): Score is $(0-0.5)^2 = 0.25$.
      *   **Expected Score:** $0.5(0.25) + 0.5(0.25) = 0.25$.

  Since lower Brier scores are better, Option B (0.25) dominates Option A (0.5). Therefore, maximizing *expected* accuracy requires you to match your credence to your evidence (0.5), not to extremize.

  **Key Term:** If a scoring rule encouraged you to extremize regardless of evidence, it would be an **improper** scoring rule. Joyce, Pettigrew, et al., build their arguments on the premise that rational agents must use *proper* scoring rules.

  ### 2. Is This "Cheating"? (The Philosophical Worry)
  Your second intuition—"Feels like the real normative work is being done by something other than accuracy"—is a legitimate philosophical critique that appears in the literature. You can frame this in your paper as the **"Rigidity" or "Input" Objection.**

  Critics argue: *Why* are we restricted to proper scoring rules?
  *   **The EUT Defense:** Improper scoring rules are self-defeating. If you use an improper rule, the rule tells you that you should report a credence different from what you actually believe. This creates a fracture between your doxastic state and your epistemic goal. Propriety ensures the norm is **immodest** (your credences recommend themselves).
  *   **The Critic's Reply:** By demanding propriety, aren't we smuggling in a norm of "honesty" or "evidence-responsiveness" *before* we even start measuring accuracy? If the definition of "epistemic utility" is rigged to punish dogmatism, is accuracy really the *sole* fundamental value?

  **For your quals paper:** This is a great place to show nuance. You can argue that accuracy *is* doing the work, but only because rational agents face uncertainty. The norm is not "Be Accurate" (which is impossible to follow directly); the norm is "Respect your current evidence when estimating future accuracy."

  ### 3. Calibration vs. Coherence
  A small terminological correction for your draft: EUT (Joyce/Pettigrew) primarily argues for **Probabilistic Coherence** and **Conditionalization**, not strictly "calibration" in the van Fraassen sense.
  *   **Calibration:** Your credence of $x$ matches the long-run frequency of truth.
  *   **Coherence:** Your credences obey the axioms of probability.

  EUT proves that if you are incoherent (e.g., violating probability axioms), there is *some* coherent set of credences that is guaranteed to be more accurate than yours (Accuracy Dominance). However, it does not guarantee that a coherent agent is calibrated. It just says coherence is the necessary baseline to avoid guaranteed inaccuracy.

  ### 4. How to Frame This in Your Paper
  You can structure this section to show you understand the tension:

  1.  **State the Dogmatism Objection:** "A naive reading of accuracy-first epistemology suggests agents should adopt extreme credences (0 or 1) to minimize distance from the truth value."
  2.  **Introduce Expected Utility:** "However, EUT is a decision-theoretic framework. Since agents lack access to truth values *ex ante*, they must maximize Expected Epistemic Utility."
  3.  **Invoke Propriety:** "This requires the adoption of Strictly Proper Scoring Rules (e.g., Brier, Logarithmic). These rules mathematically penalize unwarranted extremization because the risk of massive error outweighs the benefit of being confidently right."
  4.  **Address the 'Real Work' Worry:** "One might worry that propriety smuggles in evidentialist norms. However, proponents argue propriety is required for **immodesty**: a rational credence function should not recommend adopting a different credence function. Thus, accuracy remains the goal, but expected accuracy is the guide."

  ### Key Citations for this Point
  *   **Joyce (1998), "A Nonpragmatic Vindication of Probabilism":** The foundational paper. He explicitly discusses why the scoring rule must be proper to avoid the "dogmatism" problem.
  *   **Predd et al. (2009), "Probabilistic Coherence and Proper Scoring Rules":** Formalizes the link between propriety and coherence.
  *   **Levinstein (2017), "Permissive Rationality and Sensitivity":** Discusses whether propriety constraints limit the theory too much.
  *   **Carr (2017), "Risk and Accuracy":** Discusses how different attitudes toward risk (encoded in scoring rules) affect the norms.

  ### Summary
  You aren't missing anything obvious. You've identified the exact pressure point of the theory.
  *   **Is it a legit worry?** Yes, if the theory didn't have the constraint of **Propriety**.
  *   **Does the theory survive it?** Yes, because Proper Scoring Rules make extremization *irrational* (in terms of expected utility) even though it would be *more accurate* if you got lucky.
  *   **Is accuracy doing the work?** Yes, but it is **expected** accuracy, which inherently values risk-aversion regarding error.

  This distinction between *ex post* accuracy (truth) and *ex ante* rationality (expected accuracy) is the hinge your section should turn on. Good luck with the quals!
