          *   If I say 1.0: Expected score = $0.5 \times (1-1)^2 + 0.5 \times (0-1)^2 = 0.5$.
          *   If I say 0.5: Expected score = $0.5 \times (1-0.5)^2 + 0.5 \times (0-0.5)^2 = 0.25$.
          *   0.25 is better (lower error) than 0.5. So, rationality dictates 0.5, not 1.0.
          *   *Term to introduce:* **Strictly Proper Scoring Rules**. This is the technical fix to the user's worry.
      *   **Addressing the "Real Work" Worry:**
          *   The user worries accuracy is just a label.
          *   Counter: Accuracy *is* the goal, but *expected* accuracy is the guide.
          *   However, acknowledge a deeper philosophical critique: Where do the priors come from? (The Problem of the Priors). EUT justifies *updating* and *coherence*, but often needs a prior norm to avoid arbitrariness. Some critics (like Greaves, Wallace) argue this is fine; others say it shows accuracy isn't enough.
      *   **The "Calibration" Point:**
