      *   *Crucial Point:* The TEP isn't about infinite expectation. It's about a dominance argument ($1.25X > X$) that applies for *any* $X$.
      *   If $U$ is concave, does $0.5 U(2x) + 0.5 U(x/2) > U(x)$?
      *   Let's test $U(w) = \ln(w)$ (ignoring background wealth $w$ for a moment, or assuming $w=0$ relative to the envelope).
