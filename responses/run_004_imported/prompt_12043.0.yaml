      *   Math check: By Jensen's Inequality, since $\ln$ is concave, $E[\ln(Z)] \leq \ln(E[Z])$.
      *   Wait, the naive argument relies on $E[\text{Money}] > \text{Current Money}$.
      *   Let's check the difference: $\Delta = 0.5 \ln(w + 2x) + 0.5 \ln(w + x/2) - \ln(w + x)$.
      *   $\Delta = 0.5 [\ln((w+2x)(w+x/2))] - \ln(w+x) = 0.5 \ln(w^2 + 2.5wx + x^2) - \ln(w+x) = \ln(\sqrt{w^2 + 2.5wx + x^2}) - \ln(w+x)$.
      *   Compare arguments: Is $\sqrt{w^2 + 2.5wx + x^2} > w+x$?
      *   Square both sides: $w^2 + 2.5wx + x^2$ vs $w^2 + 2wx + x^2$.
      *   Difference is $0.5wx > 0$.
      *   *Result:* The inequality holds. Expected utility of switching is *still higher* than keeping, assuming the 50/50 probability conditional on $x$ holds.
      *   *Correction/Refinement:* Wait, does Bernoulli's utility *stop* the switching?
      *   In St. Petersburg, the expected *value* is infinite, but expected *utility* is finite. That resolves the paradox by making the price finite.
