          *   TEP is a problem of Bayesian coherence (priors).
          *   Historical verdict: Daniel Bernoulli would likely have attacked the probability assignment (the "equipossibility" assumption) rather than the utility function, because the equipossibility assumption is mathematically indefensible over an unbounded range.
          *   Advice for the paper: Frame Bernoulli's contribution as solving the *divergence* problem, not the *coherence* problem. This protects the claim from the committee member's objection.

  7.  **Refining the Math (Self-Correction/Verification):**
