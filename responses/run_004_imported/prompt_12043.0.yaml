      *   *The Flaw:* The variable $X$ is treated as a fixed constant in the expectation calculation, but it actually depends on which envelope was picked (the smaller or the larger). The probability $P(Y=2X | X=x)$ is not necessarily $0.5$ for all $x$. It depends on the prior distribution of money in the envelopes.
      *   *Bernoulli's Lens:* Bernoulli focuses on *moral expectation* (expected utility) rather than mathematical expectation (expected value). Utility function $U(w) = \ln(w)$.

