      *   So, Log Utility *does not* resolve the TEP if we assume the 50/50 probability conditional on $X$ is valid. It reduces the *gain* compared to linear utility, but it doesn't eliminate the preference to switch (unless $W=0$, where it creates indifference).
      *   *Correction on $W=0$:* If $W=0$, $U(x) = \ln(x)$. $E[U] = \ln(x)$. Indifference.
