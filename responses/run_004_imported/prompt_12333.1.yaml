answer: |-
  This feeling is real, and it is significant. It is not merely the friction of adopting a new tool; it is a structural shift in the relationship between labor, identity, and meaning.

  What you are documenting is a form of **cognitive alienation**.

  In traditional Marxist theory, alienation describes the factory worker who builds a car but cannot afford one, feeling separated from the product of their labor. Your subjects are experiencing a more subtle, psychological version: they are separated from the *process* of their labor. For decades, the promise of white-collar work was that it offered autonomy, mastery, and purpose (the "craft"). Generative AI is decoupling output from effort, and in doing so, it is dissolving the tether between the worker's identity and the work itself.

  Here are four specific dimensions of this hollowness that might help you name and frame it in your feature.

  ### 1. The Loss of "Generative Struggle"
  The copywriter's feeling that "nothing of herself" is in the work stems from the removal of friction. In creative and technical work, the struggle *is* the thinking. When you stare at a blank page or debug a complex function, you are forcing your brain to synthesize information, make connections, and impose structure. That struggle leaves a fingerprint on the final product; it is where your specific perspective enters the work.

  When AI removes the struggle, it also removes the imprint. The worker becomes a conductor rather than a musician. While conducting is a skill, it feels different than playing the instrument. The hollowness comes from realizing that the specific texture of their thought process is no longer required to generate the result. They are no longer *expressing* themselves; they are *filtering* the machine's expression.

  ### 2. The Erosion of Tacit Knowledge
  The software engineer feels like a "supervisor of a stranger" because AI bypasses the accumulation of tacit knowledge. Tacit knowledge is the stuff you can't write down—the intuition gained from writing bad code, fixing it, and understanding *why* it broke.

  When an AI writes the code, the engineer gets the solution without the lesson. Over time, this creates a sense of impostor syndrome, but inverted. It's not "I can't do this"; it's "I didn't do this." If the work is the primary evidence of their competence, and the work is no longer fully theirs, their professional self-concept begins to fray. They are managing a black box, and you cannot feel pride in a process you do not fully inhabit.

  ### 3. The Collapse of the "Guild" Dynamic
  This is perhaps the most critical point regarding your observation about them stopping sharing drafts. Historically, white-collar professions functioned like guilds. Sharing a draft or asking for code review was a ritual of trust and mutual improvement. It said, "We are practitioners of a shared craft, and we help each other hone it."

  AI turns work into a proprietary secret. If your value is no longer in the output (which anyone can generate) but in your "personal knack for prompting," then your prompt library is your competitive advantage. You guard it.
  *   **Before:** "Here is my draft, how can we make it better?" (Collaborative)
  *   **After:** "Here is the final result, don't ask how I got it." (Protective)

  This isolates workers. It atomizes the workplace. The hollowness is partly loneliness; they have lost the communal texture of problem-solving. They are no longer colleagues building a thing together; they are individual prompt-engineers competing on efficiency.

  ### 4. The "Curator's Malaise"
  Many tech optimists argue that workers are moving from "creators" to "curators" or "editors." On paper, this sounds like an upgrade. In practice, it often feels like a demotion. Editing requires taste, but taste without the ability to execute can feel impotent.

  When you write a sentence, you have agency. When you select a sentence from a list of ten AI options, you have preference. Agency builds character; preference consumes it. The copywriter feels hollow because she is no longer making choices based on what she *wants to say*, but on what she *knows the model will accept*. She is optimizing for the machine's logic, not human communication.

  ### Is it just the "New Tool" discomfort?
  It is easy to dismiss this as the same anxiety photographers felt when digital replaced film, or writers felt when word processors replaced typewriters. But those tools changed the *medium*, not the *source* of the creation. A typewriter didn't write the sentence for you.

  Generative AI is the first tool that inserts itself between the intention and the execution.

  ### How to Frame It
  If you are looking for a hook for the piece, consider that we are measuring the success of AI integration entirely by **productivity metrics** (output per hour) while ignoring **psychological metrics** (sense of ownership, pride, connection).

  The workers you interviewed are "successful" by corporate standards. They are faster and cheaper. But they are experiencing a crisis of **authorship**. They are asking: *If the machine does the work, what am I for?*

  That hollowness is the sound of a professional identity being unmoored. It is real, it is widespread, and it suggests that as we automate the "work," we may accidentally automate the "worth."
