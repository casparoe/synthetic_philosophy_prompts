  While both resolute and sophisticated strategies allow an agent to avoid financial loss, decision theorists generally argue that they do not validate intransitive preferences. Instead, they show that avoiding exploitation requires sacrificing other standard norms of agency, specifically **Separability** (or Dynamic Consistency).

  ### 1. The Strategies: Sophistication vs. Resolution

  Both strategies prevent the agent from completing the cycle, but they rely on different mechanisms of agency.

  **Sophisticated Choice (Backward Induction)**
  *   **Mechanism:** The agent treats the sequence of trades as a single decision tree. Using backward induction, they predict that if they accept the first trade, their future self will inevitably complete the cycle and lose money.
  *   **Action:** To avoid this predicted loss, the sophisticated agent declines the **first trade** outright.
  *   **Nature:** This is **strategic**. The agent at $t_1$ constrains their choice based on a prediction of their future self's "irrational" (intransitive) behavior.

  **Resolute Choice (Pre-commitment)**
  *   **Mechanism:** Associated with philosopher Edward McClennen, this approach relies on **volition** rather than prediction. At $t_1$, the agent forms a plan: "I will keep A." When offered the trade at $t_2$, their local preference says "Take C," but the resolute agent overrides this local urge to stick to the prior plan.
  *   **Action:** The agent refuses the trade at $t_2$ (or $t_3$) simply because it violates the plan formed at $t_1$.
  *   **Nature:** This is **binding**. The agent asserts that they are a single extended entity, and the "will" formed at the start remains authoritative throughout the sequence, regardless of shifting local preferences.

  ### 2. The Core Difference
  The distinction lies in how the agent views their future self:
  *   The **Sophisticated** chooser views their future self as a **constraint** or opponent ("I know I will be weak later, so I must stop now").
  *   The **Resolute** chooser views their future self as **subordinate** to their past plan ("I decided this earlier, so I will do it now, even if I want to switch").

  ### 3. Refutation or Relocation?
  Most decision theorists argue that these strategies **relocate the problem** rather than solve it. Here is why the money pump argument for transitivity remains robust:

  **A. Violation of Separability**
  The money pump argument assumes agents satisfy **Separability**: the idea that your choice at any node should depend only on the consequences flowing from that node, not on past plans.
  *   Resolute choice explicitly violates this. It claims a choice at $t_2$ is rational *only* because of a plan at $t_1$.
  *   **The Cost:** To save Transitivity, you must sacrifice Separability. Most theorists argue Separability is a more fundamental requirement of rationality than the ability to bind one's future self against current preferences.

  **B. The Meta-Preference Argument**
  If an agent chooses to stick to a plan rather than satisfy a current preference, they reveal a **higher-order preference** for consistency.
  *   If we analyze *that* higher-order preference structure (e.g., "Plan A > Local Preference C"), it turns out to be **transitive**.
  *   **The Cost:** You haven't proven intransitive preferences are rational; you've just pushed the requirement for transitivity up to a meta-level. The "rational will" is transitive, even if the "local tastes" are not.

  **C. Revealed Preference**
  In standard economics, preference is defined by choice. If you choose $A$ over $C$ at $t_2$ due to resolution, a theorist will say, "You actually prefer $A$."
  *   **The Cost:** Resolute choice requires decoupling **Choice** from **Preference**. This breaks the standard operational definition of rationality. If preferences don't drive choices, the concept of "preference" loses its explanatory power.

  ### Conclusion
  The resolute-choice response demonstrates that an agent *can* avoid the money pump without having transitive local preferences, but only by adopting a controversial model of agency that allows past plans to override current desires.

  Consequently, the money pump argument stands as a normative claim: **If you wish to be a standard, dynamically consistent agent, your preferences must be transitive.** Resolute choice is essentially an admission that to avoid exploitation, one must impose a form of transitivity on one's *plans*, even if one's *tastes* remain cyclic.

  **Recommended Reading:**
  *   **Edward McClennen**, *Rationality and Dynamic Choice* (The definitive defense of resolute choice).
  *   **Johan Gustafsson**, *The Money Pump Arguments* (A recent comprehensive technical overview).
  *   **David Gauthier**, *Morals by Agreement* (Discusses resolute choice in the context of cooperation).
