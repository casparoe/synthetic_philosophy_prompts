          2.  Distinguishing unified *agency* vs. unified *experience*.
          3.  Turning Nagel's "no fact of the matter" back on her certainty.
          4.  Ruling out Bayne's "switch model" (rapid alternation vs. simultaneous streams).
      *   **Format:** Question + Follow-up (matched to likely answer).

  2.  **Deconstruct the Guest's Position & The Literature:**
      *   *Classic View (Sperry/Gazzaniga):* Commissurotomy severs the connection, creating two independent conscious spheres. Left hemisphere speaks, right hemisphere acts/perceives but is mute.
      *   *Contrarian View (Pinto et al., de Haan, etc.):* Subcortical pathways or residual fibers allow integration. Patients function as unified agents in daily life. The "two minds" are an artifact of specific experimental setups.
      *   *Tim Bayne's Switch Model:* Maybe it's not two simultaneous minds, but one mind switching rapidly between hemispheres.
      *   *Thomas Nagel:* Skepticism about whether we can even know the answer (indeterminacy of identity).
      *   *Key Tension:* Phenomenal unity (experience) vs. Functional unity (agency/behavior).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (The Classic Dissociations):* Need to address the elephant in the room. If it's one mind, why can't the left hand name the object?
          *   *Draft:* How do you explain the naming deficit if it's one mind?
          *   *Refinement:* Make it sharper. Focus on the *phenomenal* gap. If I see it, why can't I say it?
          *   *Follow-up:* She'll likely say "access deficit, not consciousness deficit." Push on whether access is part of consciousness.

      *   *Question 2 (Agency vs. Experience):* The prompt specifically asks for this.
