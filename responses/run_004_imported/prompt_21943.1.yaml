prompt: |-
  I'm prepping to interview a philosopher of mind next week for my podcast on science and ideas. She's known for taking the contrarian side on split-brain cases, arguing the classic Sperry/Gazzaniga "two seperate minds in one skull" story got oversold, and she leans hard on that 2017 Pinto study that found surprising cross-hemisphere integration in a couple of split-brain patients. I don't want questions she can answer by just name-dropping that paper, so write me 7-8 that actually press the view: one that makes her square "it's really just one subject" with the classic demonstrations (can't name what's flashed to the left visual field, hands fighting each other), one on whether the new data shows unified agency rather than unified experience -- not obviously the same thing, one that turns Nagel's old line -- maybe there's no fact of the matter about how many minds are in there -- back on her own certainty, and one asking her to rule out Bayne's switch-model rival (rapid alternation, not two simultaneous streams) as an equally good fit. Add a quick follow-up after each, matched to whichever answer she's most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
