      *   *Question 3 (Nagel/Indeterminacy):* The prompt asks to turn Nagel on her.
          *   *Draft:* Nagel said we can't know. Why are you sure?
          *   *Refinement:* Nagel suggested the question might be empty. You are asserting a definite answer (One Mind). Isn't that metaphysical overreach?
          *   *Follow-up:* She'll claim empirical evidence decides it. Push on whether empirical data can settle metaphysical identity.

      *   *Question 4 (Bayne's Switch Model):* The prompt asks to rule this out.
          *   *Draft:* What about Bayne's switch model?
          *   *Refinement:* Bayne suggests rapid switching. Your data shows integration, but does it rule out millisecond switching?
          *   *Follow-up:* She'll say the timing is too fast. Push on whether the *subject* experiences the switch.

      *   *Question 5 (The "Interpreter" Module):* Gazzaniga's left-hemisphere interpreter.
          *   *Draft:* What about the interpreter?
          *   *Refinement:* If the left hemisphere confabulates to make sense of the right's actions, doesn't that imply two distinct narratives needing reconciliation?
          *   *Follow-up:* She'll say it's a post-hoc narrative tool. Push on whether the *need* for the tool implies prior disunity.

      *   *Question 6 (Subcortical Pathways):* The mechanism of the Pinto study.
          *   *Draft:* Is it subcortical pathways?
          *   *Refinement:* You rely on subcortical integration. If we found a patient with *no* subcortical transfer, would they be two minds? Are you defining mind by anatomy?
          *   *Follow-up:* She'll say it's about functional capacity. Push on the edge case (complete vs. partial).

      *   *Question 7 (Daily Life vs. Lab):* Ecological validity.
          *   *Draft:* They act normal in real life.
          *   *Refinement:* You argue the lab creates the split. But isn't the lab designed to *reveal* structure? If the structure only appears under stress, is it less real?
