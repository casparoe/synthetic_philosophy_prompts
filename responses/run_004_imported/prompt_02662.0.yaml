answer: |-
  Based on the commitments staked out in *The Querist*, George Berkeley would almost certainly **condemn** a decentralized cryptocurrency like Bitcoin. While he would agree with the premise that money need not have intrinsic commodity value, he would reject Bitcoin as a dangerous abstraction that severs the essential link between currency, sovereign authority, and the management of national industry. His condemnation would rest on grounds structurally similar to his critique of John Law: both systems divorce the issuance of money from the **prudent, discretionary regulation of a national authority** required to match the "needs of trade."

  ### 1. The "Ticket" Without a Sovereign Issuer
  Berkeley famously argues that money is not wealth itself but a "ticket" or "counter" that commands the industry of others. In Query 52, he asks, "Whether gold and silver... are not... counters?" and in Query 35, he posits that money is useful only "as it motivates industry." However, for Berkeley, the validity of this ticket depends entirely on the authority that issues it. In Query 45, he explicitly asks, "Whether the making of money be not the care of the state?" and in Query 225, he identifies a "national bank" as "the true spring of public wealth."

  For Berkeley, money is a political technology, not merely a technical one. It is a token of credit backed by the sovereign's capacity to organize labor and goods for the common good. Bitcoin, by design, removes the sovereign issuer. It is a "ticket" without a "ticket-master." Berkeley would argue that without a state authority to guarantee its acceptance and manage its flow, the "ticket" loses its power to command labor reliably. It becomes a private speculation rather than a public instrument. Thus, while Bitcoin fits Berkeley's definition of money as having no intrinsic value, it fails his requirement that money be an instrument of statecraft.

  ### 2. Fixed Supply vs. The Needs of Trade
  Berkeley's critique of John Law centers on the lack of restraint in issuance, but the deeper principle is that money supply must be **elastic** to match the "wants of trade" and the "industry of the people." In Query 328, he asks, "Whether the circulation of money be not the life of trade?" and throughout the text, he treats the shortage of circulating medium in Ireland as a paralysis of industry that must be cured by credit expansion.

  However, this expansion must be prudent. Berkeley faults Law's Mississippi Company scheme (Query 230–240 range) not simply for creating money, but for creating *too much* without regard for the real productive capacity of the nation, leading to inflation and collapse. Bitcoin commits the opposite error but violates the same principle: it imposes a **permanent rigidity** on the money supply. Berkeley argues that as a nation's industry grows, the circulating medium must expand to facilitate that growth. A fixed supply (like Bitcoin's 21 million cap) would inevitably lead to deflation, hoarding, and a contraction of trade—precisely the "chronic shortage" Berkeley sought to solve in Ireland, but codified into law. He would view a fixed supply as a failure to regulate quantity according to the "needs of trade," just as he viewed Law's unlimited supply as a failure of regulation.

  ### 3. Condemnation on the Grounds of Law's Scheme
  The prompt asks if Berkeley would condemn Bitcoin on the "same grounds" as Law's scheme. While Law's error was *excess* and Bitcoin's is *scarcity*, the **ground** of Berkeley's objection is identical: **the abdication of prudent human management in favor of a mechanical system.**

  *   **John Law:** Replaced sovereign discretion with a land-backed algorithm that lacked limits.
  *   **Bitcoin:** Replaces sovereign discretion with a code-based algorithm that lacks flexibility.

  In Query 236, Berkeley implies that the value of bills depends on the "opinion" of the people, which must be guided by the wisdom of the state. Both Law and Bitcoin attempt to automate or depoliticize money. Berkeley would argue that money *must* be political. To remove the "care of the state" (Query 45) is to remove the mechanism by which money serves the "public good." He would condemn Bitcoin for the same reason he condemned Law: it treats money as a self-regulating commodity or mathematical certainty rather than a flexible tool of social organization.

  ### Conclusion
  Berkeley would not welcome Bitcoin as the "purest realization" of his theory because his theory is not just about the *substance* of money (tickets vs. gold) but about its *function* (state-managed stimulation of industry). He would not regard it as a mere "category error" because he would understand its intent as money, but he would deem it **illegitimate money**.

  He would condemn it as a scheme that, like Law's, ignores the necessity of a National Bank to regulate credit. Where Law threatened the nation with inflationary collapse through unbounded issuance, Bitcoin threatens it with deflationary stagnation through bounded rigidity. Both violate Berkeley's central maxim: that the quantity of money must be prudently managed by the sovereign to ensure the "circulation" that constitutes the "life of trade." Bitcoin is a ticket, but for Berkeley, it is a counterfeit ticket, issued by no one and redeemable for no guaranteed share of the national industry.
