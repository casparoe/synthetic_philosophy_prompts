      *   *Correction on Gupta-Belnap:* Revision theory doesn't posit gaps; it posits instability. The revenge comes when we try to define "categorical truth" (true in all stable revisions). If the language can't define "categorical truth," it's expressively incomplete. If it can, we get a new liar.
      *   *Character Motivation:* Why did she abandon it? Because the "expressive completeness" promise was a lie. We want a language that can state its own semantic theory. Neither Kripke nor Gupta-Belnap allows the language to fully capture its own semantics without stepping outside.

