answer: |-
  **The Silence of the Theorem and the Noise of the Floor: Why Speculative Trade Refutes the Harsanyi Doctrine**

  The no-trade theorems of the 1980s, culminating in the work of Milgrom, Stokey, and Aumann, present one of the most elegant embarrassments in economic theory. They demonstrate that in a market populated by risk-averse agents who share a common prior and for whom rationality is common knowledge, speculative trade cannot occur. If you offer to sell me an asset, I must infer that you possess information suggesting the price is too high; to avoid being "picked off," I will lower my bid until the trade is no longer profitable for you. The logic is watertight: under these specific conditions, betting on differences of opinion is impossible because the mere offer to bet reveals the opinion that kills the bet.

  Yet, the global financial markets turn over trillions of dollars daily in purely speculative positions. Hedge funds, proprietary trading desks, and sophisticated institutional investors do not merely hedge risks; they bet aggressively against one another. Faced with this discrepancy, defenders of the standard model typically preserve the Common Prior Assumption (CPA)—often codified as the "Harsanyi Doctrine"—by arguing that observed trade is driven by liquidity needs, noise traders, or failures in the common knowledge of rationality. This essay argues that such defensive maneuvers are ad hoc and epistemologically costly. The ubiquity of speculative trade among sophisticated actors constitutes genuine evidence against the Common Prior Assumption as a constraint on rationality. To preserve the CPA is to conflate rationality with uniformity, imposing a metaphysical requirement on belief formation that has no place in a rigorous epistemology of agency.

  To understand the stakes, we must clarify the Harsanyi Doctrine. It posits that differences in posterior beliefs must arise solely from differences in information, not from differences in prior probabilities. If two rational agents share the same prior and update via Bayes' rule, they cannot "agree to disagree" (Aumann, 1976). In this framework, the common prior is not merely a modeling convenience; it is a normative requirement of rationality. It implies that there is a single, objective "correct" way to be ignorant about the world. Any deviation from this shared starting point is deemed irrational.

  The standard economic defense of the CPA against the reality of trading volume relies on relaxing assumptions *other* than the prior. The most common move is to introduce "noise traders" or liquidity-motivated agents who trade for exogenous reasons (e.g., hedging an endowment shock) rather than informational advantage. In models like Kyle (1985), informed traders can profit because they hide behind the noise traders. Alternatively, theorists may relax the "common knowledge of rationality" condition, suggesting that traders speculate because they believe their counterparties are less sophisticated than they are.

  While these explanations account for *some* market activity, they fail as a comprehensive defense of the Harsanyi Doctrine for two reasons. First, they cannot account for the volume of trade between equally sophisticated institutions. When two top-tier quantitative funds take opposing positions on a macroeconomic trend, it is implausible to claim one is merely hedging a non-financial endowment or that one is fundamentally irrational while the other is not. Second, and more critically, relying on "irrationality" or "noise" to explain away speculative volume renders the theory unfalsifiable. If every instance of speculative trade is evidence of a failure of rationality or the presence of noise, the no-trade theorem loses its normative bite. It becomes a tautology: "Rational agents with common priors do not speculate; therefore, agents who speculate are not rational (or do not have common priors)." This protects the model at the cost of making it irrelevant to the actual behavior of successful market participants.

  The deeper issue is epistemological. The Harsanyi Doctrine smuggles in a metaphysical assumption about the nature of probability and belief. It treats the prior not as a feature of the agent's epistemic perspective, but as a feature of the world—a "true" distribution of probability that rational agents must converge upon. This is a form of epistemic objectivism that is difficult to justify. Why should two agents, with distinct cognitive architectures, evolutionary histories, and conceptual frameworks, be required to assign the exact same probability to a unique event (like a sovereign default or a technological breakthrough) before receiving any data?

  To demand a common prior is to demand that rational agents be identical in their initial state of ignorance. But rationality is properly understood as a constraint on *coherence* and *updating*, not on *starting points*. A subjective Bayesian view (akin to Savage, distinct from Harsanyi) holds that priors are brute inputs reflecting an agent's identity and perspective. As long as an agent updates consistently upon receiving new information, they remain rational. Under this view, speculative trade is not a puzzle to be solved away; it is the natural outcome of diverse rational perspectives interacting. When Trader A buys from Trader B, it is not necessarily because A thinks B is irrational or liquidity-constrained; it may be because A and B legitimately weigh the same evidence differently based on distinct, yet coherent, prior frameworks.

  Defenders of the CPA might argue that without a common prior, "anything goes," and we lose the ability to predict market convergence or efficiency. They fear that allowing subjective priors opens the door to persistent delusion. However, this fear is overstated. Market discipline still applies. Agents with priors that consistently lead to poor predictions will lose capital and exit the market. This selection effect ensures a degree of empirical discipline without requiring a metaphysical uniformity of priors *ex ante*. We can have a theory of rational markets without requiring a theory of identical minds.

  Furthermore, maintaining the CPA forces us into an uncomfortable position regarding disagreement. If the CPA is a rationality constraint, then persistent disagreement among experts is evidence of widespread irrationality. Given the complexity of the modern world, it is far more plausible that the state space of the economy is too vast for any two agents to effectively share a prior over it. The "common prior" effectively assumes that agents have already agreed on the relevance and weighting of all possible states of the world before the game begins. In reality, much of economic discovery is about *defining* the state space itself. Speculative trade is often a bet on which conceptual framework will prove useful, not just a bet on outcomes within a known framework. The CPA cannot model this kind of fundamental uncertainty.

  Therefore, the verdict must be that the ubiquity of speculative trading is evidence against the Harsanyi Doctrine as a rationality constraint. The standard defenses—appealing to noise, liquidity, or bounded rationality—are stopgaps that preserve the formalism at the expense of descriptive and normative validity. They ask us to believe that the vibrant, speculative heart of global finance is driven primarily by irrationality or exogenous necessity. It is more philosophically honest to accept that rational agents can hold different priors.

  This does not mean abandoning formal epistemology; it means refining it. We should view the Common Prior Assumption not as a law of rationality, but as a specific condition that, when met, leads to no-trade. Since trade occurs, the condition is not met. The question is whether this failure is a bug or a feature of human cognition. The Harsanyi Doctrine says it is a bug (irrationality). I argue it is a feature (pluralism). Rationality requires that we update our beliefs in light of evidence, but it does not require that we all begin the inquiry from the exact same coordinate. To insist otherwise is to mistake the map for the territory, and in doing so, to silence the very disagreement that makes markets epistemically useful. The noise on the trading floor is not the sound of irrationality; it is the sound of diverse rationalities colliding, and the Common Prior Assumption is too thin a reed to bear the weight of that reality.
