answer: |-
  You have put your finger on precisely the nerve that makes Quine's argument so potent, and your intuition is correct: Quine deliberately modeled the indeterminacy of translation on the underdetermination of scientific theory. He viewed linguistics as a branch of empirical science, where the "data" are the native's observable behaviors and the "theory" is the translation manual.

  However, the reason philosophers treat the indeterminacy of translation as radically more unsettling than the underdetermination of quantum mechanics lies in a specific metaphysical shift. In your physics example, the underdetermination is generally treated as **epistemic**. In Quine's linguistic example, the indeterminacy is **ontological**.

  Here is the distinction that generates the philosophical friction.

  ### 1. "We Cannot Know" vs. "There Is Nothing to Know"

  In the case of Copenhagen vs. Many-Worlds vs. Bohmian mechanics, the standard scientific realist stance (which you noted is common among physicists) is that there **is** a fact of the matter regarding the underlying ontology, even if our empirical tools cannot distinguish between them. We assume the universe has a definite state, and our theories are imperfect maps. The gap is in our access, not in the territory.

  Quine's thesis is stronger. He argues that once you have accounted for all possible observable behaviors (stimulus conditions, assent/dissent, etc.), there is **no further fact** about what the native means. It is not that meanings are hidden mental entities we cannot access; it is that meanings *are not* hidden mental entities.

  For Quine, a strict behaviorist regarding semantics, "meaning" is not a ghostly mechanism inside the head causing the speech; meaning is exhausted by the dispositions to behave. Therefore, if two translation manuals account for all behavioral dispositions equally well, there is no "meaning fact" left over to decide between them. To ask which one is *really* correct is, for Quine, a meaningless question.

  To a physicist, this is analogous to saying: "If Copenhagen and Many-Worlds predict all possible data identically, it is not just that we can't know which is true; it is that **there is no truth** to the matter. The question 'Which interpretation is real?' is nonsense." Most physicists would reject that conclusion. Quine insists on it for language.

  ### 2. The Rejection of the "Museum Myth"

  Why does Quine take this harder line for language than for physics? It stems from his rejection of what he called the "Museum Myth" of meaning.

  Many people (and philosophers prior to Quine) viewed meanings as distinct objects—ideas, propositions, or concepts—that words label. If meanings were objects, then even if behavior underdetermined the translation, there would still be a fact of the matter about which mental object the native was referring to.

  Quine argues there are no such objects. He naturalizes meaning. If you are a realist about electrons, you posit them to explain the data. But Quine argues we do not need to posit "meanings" to explain linguistic behavior; the behavior plus the physical constitution of the speaker is all there is. Consequently, when the behavior underdetermines the translation, there is no residual "meaning entity" to anchor the truth.

  This is why it is unsettling: it suggests that **propositional content** (the idea that there is a specific thought being conveyed) is not a fundamental feature of reality, but a loose construct we impose on behavior.

  ### 3. Ontological Relativity

  The "gavagai" example is not just about words; it is about **reference**.

  If "gavagai" can be translated as "rabbit," "undetached rabbit part," or "rabbit stage," then we cannot determine what **objects** the native believes exist.
  *   If they mean "rabbit," they believe in enduring substances.
  *   If they mean "rabbit stage," they believe in temporal slices.
  *   If they mean "part," they believe in mereological sums.

  In physics, underdetermination leaves the ontology of the *world* mysterious. In Quine's linguistics, indeterminacy makes the ontology of the *speaker* inscrutable. This leads to Quine's doctrine of **Ontological Relativity**: what exists (what objects a theory quantifies over) is only meaningful relative to a background language used to translate it. There is no "view from nowhere" to say what the native's words really refer to.

  For a scientist, this implies that even the question "What objects does this theory posit?" has no absolute answer, only a relative one. This undermines the traditional realist goal of science, which is to tell us what the world is made of.

  ### 4. Normativity vs. Description

  There is a second reason philosophers find this distinct from scientific underdetermination. Scientific theories are descriptive. Language, however, is often treated as **normative**.

  When we say a translation is "correct," we often imply the translator has grasped a rule or a norm that governs the native's usage. If the native says "gavagai" in the presence of a rabbit, we assume they are following a rule like "Apply 'gavagai' to rabbits."

  Quine's behaviorism dissolves the norm. If the native's behavior is compatible with the rule "Apply to rabbits" and the rule "Apply to rabbit stages," and there is no mental fact to decide, then there is no fact about which rule they are following. This suggests that **meaning is not rule-governed** in the way we intuitively think. This attacks the foundation of logic and rationality, which rely on the stability of concepts. If "rabbit" is indeterminate, then the logical laws governing statements about rabbits are equally slippery.

  ### 5. Why Philosophers Fight It

  You asked why philosophers treat this as distinctive. It is because it is a **reductionist elimination**.

  *   **Scientific Underdetermination:** Usually invites *more* realism (e.g., "We need better experiments," or "We must choose based on elegance/truth-likeness").
  *   **Quinean Indeterminacy:** Invites *anti-realism* about semantics.

  Many philosophers (Chomsky, Kripke, Fodor) have pushed back hard against Quine precisely because they refuse to accept that meaning is exhausted by behavior. They argue that there *are* internal states (computational, neural, or otherwise) that fix meaning, even if they aren't fully manifest in outward behavior. They treat meaning more like you treat the quantum state: as a real property that explains the data, even if the data alone doesn't pin it down uniquely.

  ### Summary

  Your instinct that the logical structure is identical is correct. Quine intended it that way. But the philosophical shock comes from the **modal status** of the gap:

  1.  **In Physics:** The gap is between **Evidence** and **Reality**. (We assume Reality exists beyond Evidence.)
  2.  **In Quine's Linguistics:** The gap is between **Evidence** and **Meaning**. (Quine argues Meaning does *not* exist beyond Evidence.)

  Physicists live with underdetermination because they believe the universe is there even if their theories are ambiguous. Philosophers are unsettled by Quine because he argues that "what is meant" is *not* there once the behavior is accounted for. He isn't saying meaning is hidden; he is saying it is hollow.

  As a retired physicist, you might view Quine as an instrumentalist about semantics, whereas you are likely a realist about quantum ontology. Quine's challenge is to ask: *Why are you a realist about the wavefunction but not about the meaning?* Or conversely: *If you accept indeterminacy in translation, why not accept it in physics?* That is the unsettling mirror he holds up to science.
