      *   *Quine's Indeterminacy of Translation:* Competing translation manuals ($M_1, M_2$) fit all behavioral data ($B$). Quine claims there is *no fact of the matter* about which is correct. Meaning itself is indeterminate.
      *   *Key Difference:* In physics, we usually think the underdetermination is epistemic (we don't *know* which is true). In Quine's view, indeterminacy is ontological (there *is no truth* to be known).

  3.  **Identify Key Philosophical Distinctions:**
      *   **Epistemic vs. Ontological:** This is the crux. Physicists say "We can't tell." Quine says "There's nothing to tell."
      *   **The Nature of the "Facts":** In physics, the facts are about physical states (particles, fields). In translation, the putative facts are about *meanings* (propositions, intentions). Quine is behaviorist about meaning.
      *   **Holism:** Quine's underdetermination applies to the whole web of belief, but indeterminacy applies specifically to semantics.
      *   **Normativity:** Meaning often carries normative weight (you *ought* to use a word this way). Behavior doesn't capture normativity easily.
