      *   *Williamson's Argument (Margin for Error):* Knowledge requires reliability. If a mental state (like feeling cold, or feeling sure) changes gradually, there are borderline cases. To avoid error in the borderline cases, you must stop claiming knowledge *before* the state actually ends. Therefore, there are cases where you are in the state (e.g., you know $p$) but you are not in a position to know you are in the state (you don't know that you know $p$).
      *   *Implication:* Knowledge is not transparent to the knower. You can't just "look inside" to verify you know something. The "feeling of knowing" is not a reliable indicator of the *fact* of knowing.

