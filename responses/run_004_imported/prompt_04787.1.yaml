answer: |-
  Here are ten questions designed for your podcast interview, organized by theme. Each includes a main question and a targeted follow-up that anticipates her reliance on the *belief vs. understanding* distinction.

  ### Theme 1: Moral Education and Development

  **1. The Scaffolding Problem**
  "Let's start with moral development. It seems empirically obvious that children acquire their initial moral concepts through testimony from parents—being told 'hitting is wrong' before they can grasp the reasons why. If moral testimony is epistemically defective, does this imply that a child's early moral beliefs are unjustified? And if so, how do they ever transition to justified adult beliefs if the foundation is rotten?"

  *   **Follow-up:** "I suspect you'll say children acquire *true belief* but not *moral understanding*, and that the latter comes later with autonomous reasoning. But if the child acts correctly based on that testimony, what is the *normative* deficit? Are we saying the child's action is morally inferior to an adult's, or simply that it lacks a specific epistemic status that doesn't seem to impact the rightness of the action?"

  **2. The Age of Autonomy**
  "Following up on education: at what point does reliance on testimony become problematic? Is there a specific age where deference shifts from necessary scaffolding to an impediment to moral worth? If it's a gradual transition, doesn't that suggest testimony *does* convey some degree of justification, just not the maximum amount, which sounds more like a scalar optimist view than a pessimist one?"

  *   **Follow-up:** "You might reply that the distinction isn't about age but about capacity: once you *can* grasp the reasons, you *must*. But does this distinction between 'can' and 'must' risk making moral knowledge elitist? If 'understanding' is required for full moral standing, are you implying that those with lower cognitive capacities are permanently barred from full moral agency, even if they defer to trusted sources?"

  ### Theme 2: The Asymmetry Challenge (Empirical Expertise)

  **3. The Bioethicist Objection**
  "We readily defer to empirical experts—doctors on diagnoses, climate scientists on warming. Some argue we should also defer to moral experts, like bioethicists on end-of-life care. If you reject moral testimony, are you denying the existence of moral expertise entirely? Or are you saying experts exist but are structurally unable to transmit that expertise via testimony?"

  *   **Follow-up:** "You'll likely argue the expert has *understanding* but cannot transfer it, only the *belief*. But if the expert's testimony reliably produces true moral beliefs in others, what practical work is the 'understanding' doing? If the outcome is the same (correct action based on true belief), is the distinction between expert testimony in medicine vs. ethics just a difference in the *type* of reasons, or a difference in the *value* of the outcome?"

  **4. Practical Deference**
  "Consider navigation. If I'm lost, I follow your directions without knowing the map. I arrive successfully. In morality, if I defer to your judgment on a complex dilemma and act correctly, you seem to say I've missed something essential that the navigator hasn't. Why is 'arriving at the right action' via testimony sufficient in practical navigation but insufficient in moral action?"

  *   **Follow-up:** "I imagine you'll say moral action requires acting from *your own* reasons to have moral worth, whereas navigation is merely instrumental. But doesn't this concede that moral testimony *does* provide justification for the belief (I am justified in thinking this is the right turn), but simply fails to confer *worth*? If so, isn't your view actually a thesis about moral psychology or virtue, rather than a strict epistemological pessimism about testimony?"

  ### Theme 3: Aesthetic Testimony Parallels

  **5. The Structural Analogy**
  "Your view shares a lot of DNA with pessimism about aesthetic testimony—the idea that I can't truly know a movie is good just because a critic says so. Do you endorse aesthetic pessimism as well? If you accept it, does that suggest a global pessimism about all value judgments? If you reject it, what is the relevant difference between aesthetic and moral value that makes testimony permissible in one but not the other?"

  *   **Follow-up:** "Suppose you say both involve a requirement for 'first-hand appreciation' or understanding. If I buy a gift for my spouse based solely on a friend's aesthetic testimony, and my spouse loves it, have I failed aesthetically? If the 'belief vs. understanding' distinction applies here too, does it render a huge chunk of our cultural consumption epistemically bankrupt, and is that a cost you're willing to bear?"

  **6. Action-Guiding Aesthetics**
  "Sometimes aesthetic judgments guide action, like a designer deferring to an art director. If pessimism holds, the designer lacks 'aesthetic understanding.' Does this matter if the design succeeds? I'm pressing on whether your distinction between acquiring a true belief and acquiring understanding tracks any real-world difference in success, or if it describes a private mental state that doesn't affect the external outcome."

  *   **Follow-up:** "If you insist the understanding is necessary for the action to be 'fully' appropriate, are you conflating the *production* of the object with the *character* of the producer? In other words, does the belief/understanding distinction save the epistemology of testimony, or does it just shift the goalposts to say the *person* is deficient even if the *belief* is fine?"

  ### Theme 4: High-Stakes and Time-Pressure Cases

  **7. The Emergency Deference**
  "Imagine a high-stakes situation where I lack time to reason through a moral dilemma—say, a triage scenario in an ER. I defer instantly to a senior doctor's moral snap judgment. Intuitively, this seems permissible, even required. Does your view imply that by deferring, I am acting without moral justification? That seems to suggest I ought to take time I don't have to reason it out myself, which is implausible."

  *   **Follow-up:** "You might say this is an 'excusable' violation of the norm, or that in emergencies, mere true belief is sufficient. But if true belief is sufficient in emergencies, why isn't it sufficient in non-emergencies? Does this admit that the 'understanding' requirement is a luxury good rather than a necessary condition for justified moral belief?"

  **8. Moral Worth vs. Right Action**
  "In that emergency case, suppose I save a life by deferring to testimony. You might say the action is right, but I lack moral worth because I didn't grasp the reasons. Does this distinction between 'right action' and 'worthy action' do enough work to save your view? It seems to concede that testimony *does* guide us to the truth, which is what most optimists care about."

  *   **Follow-up:** "If the distinction is just about praiseworthiness, isn't that a concession to the optimist regarding *knowledge*? Can I know it was the right thing to do via testimony, even if I'm not praiseworthy for doing it? If you say 'no, you don't know,' you seem to be defining knowledge in a way that excludes successful, life-saving action guided by testimony."

  ### Theme 5: The Metaphysics of the Distinction

  **9. The Explanatory Role of Understanding**
  "You frequently rely on the distinction between having a true moral belief and having moral understanding. Can you specify what 'understanding' adds to 'belief' in a way that is observable? If two agents act identically, speak identically, and react identically, but one has 'understanding' and the other only 'testimony-based belief,' what is the difference made of?"

  *   **Follow-up:** "If the difference is purely counterfactual (e.g., 'the understander could explain why if asked'), doesn't that allow the testimonial believer to gain understanding simply by memorizing the explanation later? If so, isn't the barrier to testimony just a delay in processing, rather than a fundamental epistemic block?"

  **10. The Optimist Co-option**
  "Finally, many epistemic optimists agree that understanding is more valuable than mere belief. They just deny that testimony *cannot* provide it. If you grant that testimony provides true belief, and optimists grant that understanding is better, what is the live disagreement left? Is your pessimism actually just the claim that testimony is *less efficient* at producing understanding, rather than impossible?"

  *   **Follow-up:** "If you stick to the claim that testimony *cannot* confer understanding, are you defining 'understanding' in such a narrow way that it becomes trivial? If I trust you because I know you are virtuous and reliable, isn't *that* a reason I grasp, thereby giving me understanding via testimony? Does your distinction survive if we view trust itself as a form of reason-grasping?"
