answer: |-
  **MEMORANDUM**

  **TO:** City Council
  **FROM:** Town-Gown Relations Subcommittee (Student Representatives)
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Voter Enfranchisement and Ballot Measure 4B

  ### **I. Executive Summary**

  The Town-Gown Relations Subcommittee has reviewed the implications of Ballot Measure 4B (the "Rental Construction Moratorium") and the current barriers to student participation in this election. While the Subcommittee discussed multiple avenues for increasing engagement, **we recommend the City adopt a proactive voter education and registration clarification initiative.**

  Specifically, we recommend the City Clerk's Office issue clear guidance confirming that students residing in university housing or nearby rentals for the academic year meet the residency requirements for this local election, and launch a targeted outreach campaign to facilitate registration before the deadline. We do not recommend the creation of a separate advisory ballot, nor do we believe additional public comment sessions alone are sufficient to address the democratic deficit presented by this measure.

  ### **II. Background and Context**

  Ballot Measure 4B proposes a five-year freeze on new multi-unit rental construction within a half-mile radius of the university. This measure directly impacts housing supply and rental rates in the zone where approximately 40% of the city's population resides.

  Currently, student participation in this vote is critically low. This is not due to a lack of interest, but due to confusion regarding "domicile" requirements. Many students believe they cannot register because they do not intend to remain in the city indefinitely after graduation. However, under State Election Code [Insert Relevant State Code Section if known, otherwise keep generic], local voting residency is determined by *current* primary residence, not permanent intent to remain indefinitely.

  The Subcommittee considered three approaches:
  1.  **Status Quo:** Rely on existing public comment periods.
  2.  **Advisory Ballot:** Create a non-binding "student tally" separate from the official count.
  3.  **Proactive Enfranchisement:** Clarify eligibility and assist students in registering for the binding ballot.

  ### **III. Rationale for Recommendation**

  Our recommendation prioritizes **Proactive Enfranchisement** based on the following principles of democratic integrity and practical governance:

  **1. The "All-Subjected" Principle**
  A core objection to student voting in local elections is that students are transient and will not bear the long-term consequences of housing policy. While permanent residents certainly have a stake in the city's future, the "All-Subjected" principle of democratic theory suggests that anyone currently bound by the coercion of a law should have a say in its passage.
  *   **Immediate Impact:** Students living in the affected zone are the primary subjects of this measure. A supply cap will immediately impact their rental costs and housing security during their tenure.
  *   **Current Residency:** For the duration of their enrollment, this *is* their community. Excluding them from a vote on neighborhood character and housing supply effectively taxes them (via higher rents) without representation.

  **2. Rejection of "Second-Class" Voting**
  The proposal for a separate "student advisory ballot" was considered but rejected. Creating a parallel voting track segregates the electorate and implies that student voices are less valid than permanent residents. If students are legal residents under state law, their votes must count toward the binding total. An advisory measure would likely face legal challenges and undermines trust in the process.

  **3. Public Comment is Not a Substitute for Voting**
  While additional public comment sessions (Option 1) are valuable, they do not resolve the power imbalance. Comment allows residents to speak, but voting allows them to decide. Given that 40% of the population risks being silenced by administrative confusion, comment sessions alone are insufficient to ensure a legitimate outcome.

  **4. Addressing the Long-Term Stakeholder Concern**
  We acknowledge the concern that transient populations should not dictate long-term zoning policy. However, Measure 4B is not a 50-year master plan; it is a five-year moratorium. Students currently residing in the city will live under this moratorium for a significant portion of its lifespan. Furthermore, clarifying registration eligibility does not force students to vote; it simply removes the barrier for those who *choose* to participate.

  ### **IV. Implementation Timeline**

  To ensure this recommendation is viable for the May ballot, we propose the following timeline:

  *   **Week 1 (Immediate):** City Attorney and Clerk review State Election Code regarding "residency" vs. "domicile" for municipal elections. Draft plain-language guidance confirming students living in the city for the academic year are eligible to register.
  *   **Week 2:** Subcommittee and University Administration coordinate on outreach channels (email lists, student portals, housing contracts).
  *   **Week 3:** City Council adopts resolution supporting the clarification. City Clerk launches "Register to Vote" campaign targeting the university zone.
  *   **Week 4–8:** Registration drive and town hall Q&A sessions focused on *how* to register, distinct from policy advocacy.
  *   **May Election:** Standard ballot administration with full inclusion of eligible student residents.

  ### **V. Conclusion**

  A legitimate vote requires a legitimate electorate. Excluding 40% of the city's population from a vote that directly impacts their housing security creates a democratic deficit that undermines the legitimacy of Measure 4B, regardless of the outcome.

  By clarifying eligibility and facilitating registration, the City Council ensures that the result reflects the will of the *actual* community affected by the moratorium, balancing the rights of permanent residents with the rights of current tenants. We urge the Council to adopt this recommendation immediately.

  ***

  **Attachments:**
  *   *Draft Language for Clerk's Eligibility Guidance*
  *   *Summary of State Election Code Residency Requirements*
