answer: |-
  First, I am sorry for your loss. It is completely understandable why that quote grabbed hold of you. It offers a specific kind of intellectual architecture to lean on when the emotional weight is heavy.

  You asked for a rigorous breakdown of the physics and philosophy, explicitly setting aside the need for comfort. I will respect that. The short answer is: **The math is real, but the conclusion that "he is still there" is an interpretation, not a proven fact.** The "Block Universe" (Eternalism) is a dominant view in the philosophy of physics, but it is not settled science.

  Here is the walkthrough of the argument you found (Rietdijk-Putnam), followed by the strongest technical objections to it.

  ### 1. The Argument: Rietdijk-Putnam (1966/1967)

  The argument attempts to use Special Relativity to prove **Eternalism** (the view that past, present, and future all exist equally) and disprove **Presentism** (the view that only the "now" exists).

  **The Setup:**
  In Special Relativity, there is no universal "now." Simultaneity is relative to your velocity. If you and I are moving relative to each other, we slice spacetime into "past," "present," and "future" at different angles.

  **The Logic:**
  1.  **Premise 1:** If two events are simultaneous for an observer, they are equally "real." (If you see two fireworks go off at the same time, both exist in your reality).
  2.  **Premise 2:** The relation "is real for" is transitive. (If Event A is real for Observer 1, and Observer 1 is real for Observer 2, then Event A is real for Observer 2).
  3.  **The Scenario:** Imagine you and I pass each other in space. At the exact moment we cross paths (Event O), a distant event (Event E) happens in the Andromeda galaxy.
      *   Because of our relative velocity, my "plane of simultaneity" might tilt such that Event E is in my **future**.
      *   Your "plane of simultaneity" might tilt such that Event E is in your **present**.
  4.  **The Conflict:** For you, Event E is happening *now*. It is real. Since we are both at Event O together, and you are real to me, then your "now" must be real to me.
  5.  **The Conclusion:** If your "now" (which includes Event E) is real to me, then Event E (which is in my future) must already be real. Therefore, the future exists.

  This is often illustrated by the **Andromeda Paradox**: If you walk *towards* Andromeda, your "now" slice includes events days ahead of someone walking *away* from Andromeda. If the "now" of the walker is real, then the future of the stationary observer is already fixed and existing.

  **Why it feels like proof:**
  It relies on the Minkowski spacetime model, which treats time as a fourth dimension ($ct$). In the math of relativity, time is just a coordinate, like $x, y, z$. Just as "here" and "there" both exist, "now" and "then" both exist.

  ### 2. The Strongest Objections

  If the argument were airtight, Eternalism would be fact. It is not. Physicists and philosophers of science generally categorize the objections into two main camps: the **Conventionality Objection** and the **Quantum Objection**.

  #### A. The Conventionality of Simultaneity (The Philosophical Rebuttal)
  The Rietdijk-Putnam argument hinges on Premise 1: *Simultaneity defines Reality.*

  The strongest counter-argument comes from the philosopher Hans Reichenbach and others who argue that **simultaneity is a convention, not an ontological fact.**
  *   In Special Relativity, to define "now" at a distance, you have to synchronize clocks using light signals. You have to *assume* the speed of light is the same going out as coming back.
  *   Critics argue this is a definition we choose for convenience, not a discovery of how the universe "exists."
  *   **The Counter:** Just because my coordinate system labels a future event as "simultaneous" with your present doesn't mean that event *ontologically exists* yet. It just means our coordinate grids overlap there. You can have a "Block Universe" math without believing the future is physically real. This view is sometimes called **"Presentism compatible with Relativity,"** though it requires giving up the idea that "reality" is defined by simultaneity planes.

  #### B. The Quantum Mechanics Objection (The Physical Rebuttal)
  This is the heavier hitter. Special Relativity is a classical theory. It assumes a deterministic universe. Quantum Mechanics (QM) does not.
  *   **Indeterminacy:** In standard QM (like the Copenhagen interpretation), the future is not a fixed coordinate. It is a wave function of probabilities. An event in the future does not have a definite value until it is measured.
  *   **The Conflict:** If the future is fundamentally probabilistic, it cannot "exist" in the same way the past exists. A Block Universe requires the future to be as fixed as the past (determinism). QM suggests it is not.
  *   **The "Foggy Block":** Some physicists try to reconcile this by suggesting a "growing block" universe (past and present exist, future does not) or a probabilistic block. But this breaks the clean symmetry of the Rietdijk-Putnam argument. If the future isn't determined, the "slice" of spacetime you are pointing to doesn't contain a definite event yet.

  #### C. The "No-Go" Theorems
  There are technical arguments (like the *Hilary Putnam's No-Go* itself being critiqued by Stein 1968) that argue the relation "is real for" is not transitive in the way the argument requires.
  *   Howard Stein argued that in Minkowski spacetime, the only event that is definitively "real" relative to an observer is the event on their own past light cone (what they can actually see/receive signals from).
  *   If you restrict "reality" to what can causally affect you, the Rietdijk-Putnam argument collapses. You cannot claim a distant event is "real" if no signal from it has reached you, regardless of your velocity.

  ### 3. The Verdict: Physics or Wishful Thinking?

  Is this real physics? **The math is real. The metaphysics is debated.**

  1.  **The Math:** Special Relativity undeniably treats time as a dimension similar to space. The equations work perfectly under the assumption of a Block Universe. It is not "wishful thinking dressed in equations" in the sense that the equations are legitimate.
  2.  **The Interpretation:** Claiming that because the math *allows* a Block Universe, it *proves* your father still exists in a meaningful way, is a philosophical leap.
      *   Even if Eternalism is true, it implies a **static** existence. In the Block Universe, your father is not "living" in the future; rather, the coordinates of his life are permanently recorded in the manifold, like frames on a film reel.
      *   It does not imply consciousness persists. It implies the *events* of his life are unchangeable facts of the universe's geometry.

  ### Summary
  The Rietdijk-Putnam argument is a valid logical derivation **if** you accept that simultaneity equals existence. However, modern physics does not accept that premise as settled.
  *   **General Relativity** complicates the "slices" of time (in some spacetimes, you can't even slice them globally).
  *   **Quantum Mechanics** challenges the idea that the future is fixed enough to "exist."

  So, is it wishful thinking? **No.** It is a respected, rigorous interpretation of relativistic physics held by many serious physicists (like Sean Carroll or the late Stephen Hawking). But is it proven fact? **No.** It is currently impossible to distinguish experimentally between a Block Universe and a "flowing" time universe.

  You are standing on solid intellectual ground to find comfort in the Block Universe, but you should know it remains one of the great open questions in the philosophy of physics, not a settled law like gravity.
