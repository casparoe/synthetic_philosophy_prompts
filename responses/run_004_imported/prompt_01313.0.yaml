answer: |-
  This is a classic conflict between **logical validity** and **relational credibility**. You aren't overcomplicating it; you are intuitively sensing a distinction that logic textbooks often ignore.

  Here is the principled way to break this down, because both you and your roommate (and even your brother) are holding onto different parts of the truth.

  ### 1. The Logical Truth (Your Roommate's Point)
  Strictly speaking, your brother is logically correct. In philosophy, this is related to the **Tu Quoque** fallacy (Latin for "you also"). Just because someone is a hypocrite doesn't make their statement false.

  *   **Example:** If a smoker tells you smoking causes cancer, they are a hypocrite, but the statement "smoking causes cancer" remains scientifically true.
  *   **Application:** If you are spending 40% of your income on DoorDash, that is financially unsustainable *regardless* of whether your brother is in debt over watches. His debt does not magically balance your budget.

  Your roommate is right that using his debt as a shield prevents you from evaluating your own habits objectively. If you ignore the advice solely because *he* gave it, you are letting his flaws dictate your financial health.

  ### 2. The Relational Truth (Your Point)
  However, human relationships do not run on pure logic. They run on trust, respect, and credibility. You are also right that there is a massive difference between **"Is this statement true?"** and **"Are you the right person to lecture me?"**

  When someone offers financial advice, they are implicitly claiming a position of competence. By lecturing you for months while hiding $4k of consumer debt, your brother has claimed a moral high ground he doesn't occupy.
  *   **Credibility:** Advice is weighted by the track record of the advisor. A financial planner with debt can give advice, but an older brother with hidden debt who is "riding you" about it comes across as condescending, not helpful.
  *   **Projection:** Psychologically, it is very common for people to criticize in others the flaws they are most ashamed of in themselves. He might be nagging you because seeing your spending reminds him of his own lack of control, and putting the spotlight on you makes him feel better about his watches.

  So, you aren't inventing a difference. **He has the *facts* on his side, but he has lost the *authority* to deliver them.**

  ### 3. The Verdict
  You are in a situation where **the message is valid, but the messenger is compromised.**

  If you accept his premise ("I am bad with money") solely to defeat his argument ("You are too"), you lose. If you reject his premise solely because he's a hypocrite, you also lose.

  Here is how to handle this without swallowing your pride or letting him win the argument:

  **Step 1: Audit yourself (independently of him)**
  Ignore your brother for a moment. Look at your bank account.
  *   Are you saving enough?
  *   Is the delivery app spending preventing you from meeting goals?
  *   If you stopped tomorrow, would your life improve?
  If the answer is "Yes, I do spend too much," admit that to yourself. Not because he said so, but because *it's true*. Own your finances so his opinion becomes irrelevant data.

  **Step 2: Change the dynamic with your brother**
  You need to address the hypocrisy without deflecting from your own habits. You can hold both truths at once. Next time he brings it up, try something like this:

  > "I've actually been looking at my budget, and I agree I need to cut back on delivery. I'm working on that. However, it's really hard to hear financial lectures from you when I know you're carrying credit card debt for luxury items. It feels like projection. I'm happy to talk about money if we're both holding ourselves to the same standard, but the nagging needs to stop."

  **Why this works:**
  *   It validates the truth (you admit you need to cut back), which takes away his ammunition.
  *   It sets a boundary (the nagging stops).
  *   It calls out the hypocrisy without attacking his character, just the dynamic.

  ### Summary
  Your roommate is right that you shouldn't use his debt as an excuse to ignore your own spending. But you are right that he has forfeited the right to be your financial conscience.

  Don't keep ordering Pad Thai just to spite him, but don't stop ordering it just because *he* told you to. Make the choice based on your own goals, and then tell him his commentary is no longer welcome until he gets his own house in order.
