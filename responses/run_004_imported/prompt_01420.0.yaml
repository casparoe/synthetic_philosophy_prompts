answer: |-
  You are absolutely not being pedantic. Your intuition is mathematically sound, and your brother-in-law is making a fundamental error in probability theory. In fact, you have stumbled upon a classic concept in decision theory and economics called a **Dutch Book**.

  Here is the breakdown of why he is wrong, why it matters, and how you could theoretically bankrupt him (though I advise against doing it at Thanksgiving).

  ### 1. The Math: Mutually Exclusive and Exhaustive
  In a standard football match, there are three possible outcomes: Home Win, Draw, Away Win.
  *   **Mutually Exclusive:** Only one can happen.
  *   **Exhaustive:** One of them *must* happen (assuming the game is finished).

  According to the axioms of probability, the sum of probabilities for all possible outcomes in a closed system **must equal 100%**.
  *   If the sum is **110%**, he is overestimating the likelihood of events happening.
  *   If the sum is **90%**, he is underestimating them (implying a 10% chance that the game simply vanishes from existence).

  His claim that "each number is separate" is logically false. Because the outcomes are tied together (if United wins, Chelsea *cannot* win), the probability of one is mathematically dependent on the others. $P(\text{United}) = 1 - P(\text{Draw or Chelsea})$.

  ### 2. The Trap: "Either Side"
  If he were just throwing out numbers casually, this would be harmless imprecision. However, he added a critical condition: **"He'd happily bet either side of any of those numbers."**

  This means he is willing to treat his percentages as **fair odds**.
  *   If he says 50%, he implies fair odds are 2.0 (even money). He is willing to bet *for* it at 2.0 or *against* it at 2.0.
  *   This willingness to bet *either side* at the implied odds makes him vulnerable to a **Dutch Book**.

  ### 3. How You Could Guarantee a Profit
  A Dutch Book is a series of bets that guarantees a profit for the bettor regardless of the outcome, created by inconsistent odds.

  **Scenario A: His percentages sum to > 100% (e.g., 110%)**
  This means his odds are "too short" (he thinks events are more likely than they mathematically can be).
  *   **Your Move:** You bet **against** all three outcomes.
  *   **Why:** Since the total probability he assigns is inflated, the payouts he offers for betting against him are skewed in your favor. One outcome will happen, and you will lose that specific bet, but the winnings from the two bets you got right will exceed the loss from the one you got wrong.

  **Scenario B: His percentages sum to < 100% (e.g., 90%)**
  This means his odds are "too long" (he thinks events are less likely than they must be).
  *   **Your Move:** You bet **for** all three outcomes.
  *   **Why:** You place a stake on Home, Draw, and Away. One *must* win. Because his implied probabilities are too low, the payout on the winning bet will be higher than the total amount you staked across all three. You guarantee a profit simply by covering all bases.

  ### 4. The Bookmaker Nuance (Where he might be confused)
  Your brother-in-law might argue, "But bookmakers always have odds that add up to more than 100%!"

  This is true. It's called the **overround** or **vigorish**. If a bookie's odds sum to 110%, that 10% is their built-in profit margin.
  *   **However:** A bookmaker does **not** bet "either side." They set the odds for *you* to bet against them. They never offer to take the other side of a bet at those same odds.
  *   By saying he'd bet *either side*, he is claiming his numbers represent "true fair value," not "bookmaker prices." True fair value must sum to 100%.

  ### The Verdict
  You are right. He is making a real logical error called **probabilistic incoherence**.
  *   **Is it harmless?** In casual conversation, yes. Most humans are terrible at intuitively summing probabilities.
  *   **Is it a real mistake?** Yes. If he actually honored those bets, he would lose money in the long run to anyone who understood the math.

  **Grading Advice:**
  You can safely stop letting this distract you from your grading. You've solved the puzzle. As for your brother-in-law? You can win the argument by asking him to put his money where his mouth is on a game that sums to 90%. If he hesitates, you've proven the point without having to actually take his cash.
