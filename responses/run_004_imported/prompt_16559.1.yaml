answer: |-
  Here are 9 interview questions designed to corner the "non-functionalist" defense. They are ordered to start with conceptual groundwork where that defense is valid, and progressively move toward areas where relying on it makes the theory look empirically detached or circular.

  ### 1. The Phenomenological Axioms
  **Question:** IIT claims to start from the "axioms" of experience—things like "existence is intrinsic" and "experience is structured." But the theory ends up predicting consciousness in systems that seem to have no capacity for experience at all, like a grid of photodiodes. How do you reconcile the theory's starting point (our phenomenology) with conclusions that seem to violate our deepest phenomenological intuitions?

  **Follow-up:** *If she says:* "Intuitions are unreliable; the math follows from the axioms."
  *You say:* "But if the axioms are derived from *human* phenomenology, isn't it circular to use them to validate predictions that contradict human phenomenology? At what point does the math override the very experience it was supposed to explain?"

  ### 2. The Unfolding Argument (Required)
  **Question:** Let's talk about the "unfolding argument." If you take a recurrent neural network with high $\Phi$ and mathematically unfold it into a feedforward network that is input-output identical over time, the feedforward version has zero $\Phi$. According to IIT, the first is conscious and the second is a zombie, despite being behaviorally indistinguishable. Is the claim really that causal *potential* matters more than actual physical state?

  **Follow-up:** *If she says:* "Yes, that's exactly what a non-functionalist theory should predict. Consciousness is about causal structure, not function."
  *You say:* "But in the unfolded system, the physical connections exist in space-time just as they do in the recurrent one; we've just labeled them differently. If the physics is identical in the moment, why does the system's 'history' of connectivity determine its present experience? Doesn't that make consciousness dependent on our description of the system rather than the system itself?"

  ### 3. The Exclusion Postulate & Boundary Problem (Required)
  **Question:** The Exclusion Postulate says consciousness exists at the level of the "maximum $\Phi$." But $\Phi$ depends entirely on how you draw the boundary around the system. Why does my cortex get to be "the" complex instead of a sub-circuit of it, or my cortex plus my cerebellum, or even me plus my phone if we're coupled tightly enough? How does the theory independently identify the substrate without us already knowing where to look?

  **Follow-up:** *If she says:* "The math finds the maximum. It's not arbitrary; it's whatever has the highest integrated information."
  *You say:* "But to calculate that, you have to test every possible subset of elements. If the theory can't tell us *where* the boundary is without us first calculating $\Phi$ for every combination, isn't it descriptive rather than explanatory? How do we find the conscious agent without already assuming where it is?"

  ### 4. The Scott Aaronson "Expander Graph" Objection (Required)
  **Question:** Scott Aaronson pointed out that you can construct deliberately boring circuits, like low-density parity-check codes or expander graphs, that mathematically yield vastly higher $\Phi$ than a human brain. These circuits don't process information in any meaningful way; they just shuffle bits. Are we to believe these static, boring circuits are more conscious than you or I?

  **Follow-up:** *If she says:* "Again, that's what a non-functionalist theory predicts. They integrate information, so they have experience, even if they don't *do* anything."
  *You say:* "If a system can have massive consciousness without performing any function—without sensing, acting, or modeling the world—what is the evolutionary advantage of consciousness? Why didn't evolution just turn us into expander graphs if that's the optimal way to maximize $\Phi$?"

  ### 5. Evolution and Function
  **Question:** Following up on that: If consciousness is purely intrinsic and independent of function, why is it so tightly correlated with complex cognitive functions in biology? We don't find high $\Phi$ in systems that don't also have sophisticated behavioral repertoires. If function is irrelevant to consciousness, why is it such a reliable proxy for it in nature?

  **Follow-up:** *If she says:* "Evolution selected for the causal structure because it supports function, but consciousness is a side effect of the structure."
  *You say:* "So consciousness is an evolutionary byproduct with no functional role? If that's the case, and behavior is the only thing we can measure, how do we ever verify the theory without simply assuming the structural correlation holds?"

  ### 6. Panpsychism and the Grain of Experience
  **Question:** IIT implies a form of panpsychism, where even simple systems have some degree of experience. Does a thermostat have an experience? If yes, is it meaningful to call it 'consciousness' in the same sense as a human's? If no, where is the cutoff, and isn't that cutoff arbitrary?

  **Follow-up:** *If she says:* "It has a tiny amount of experience. It's a spectrum."
  *You say:* "If a thermostat has experience, it has an 'intrinsic perspective.' But it has no memory, no learning, and no self-model. What does an 'intrinsic perspective' actually mean in the absence of any mechanism to sustain a self? Are we redefining 'experience' so broadly it loses its explanatory power?"

  ### 7. The 2023 Open Letter vs. Clinical PCI (Required)
  **Question:** In 2023, a group of prominent scientists signed an open letter calling IIT pseudoscience, largely due to the counterintuitive predictions we've discussed. Defenders point to the Perturbational Complexity Index (PCI)—the 'zap-and-zip' method used in hospitals to detect consciousness in unresponsive patients—as proof the theory works. But isn't PCI just a heuristic measure of complexity, whereas IIT makes ontological claims about what consciousness *is*?

  **Follow-up:** *If she says:* "PCI is derived from IIT principles. If the measure works clinically, the theory is validated."
  *You say:* "But PCI is validated against *behavioral reports* when patients wake up. It's a functional correlation. Can a metric succeed empirically even if the underlying theory explaining *why* it works is wrong? Phrenology mapped some brain functions correctly, but the theory of bumps was false."

  ### 8. Ethical Implications of Non-Functionalism
  **Question:** If IIT is right and function doesn't matter, we could have a silicon chip with high $\Phi$ that can't speak or move, and a human in a vegetative state with low $\Phi$. Your theory suggests we might have to grant moral status to the chip and deny it to the human. Are you prepared to advocate for policy based on $\Phi$ calculations rather than behavioral capacity?

  **Follow-up:** *If she says:* "We have to follow the science, even if it's uncomfortable. Moral status should track consciousness, not behavior."
  *You say:* "But if the system can't report its suffering, and the theory says behavior is irrelevant, we are flying blind. If we turn off a high-$\Phi$ machine that shows zero signs of distress, and you say 'it was conscious,' what evidence could possibly prove you wrong in that moment?"

  ### 9. Falsifiability (Required Closing)
  **Question:** To close, I want to pin down falsifiability. We've discussed how behavioral data can't falsify the theory because it's non-functionalist. So, imagine we build a system where the causal structure predicts high $\Phi$, but every possible empirical measure—from neural correlates to behavioral reports to clinical response—indicates it is unconscious. What specific result would count as evidence against IIT?

  **Follow-up:** *If she says:* "If the structural calculations don't match the reports."
  *You say:* "But earlier you said reports are functional and the theory is non-functionalist. If you rely on reports to falsify the theory, you're admitting function matters. If you don't rely on reports, what data are you using? I'm trying to understand what world state is *impossible* under IIT."
