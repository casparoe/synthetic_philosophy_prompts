answer: |-
  Here is the blunt sanity check you asked for.

  ### 1. Is your Augustine accurate?
  **Yes, but you are being slightly too generous to him on fiction.**

  Your definition of the lie is correct: *locutio contra mentem* (speech against the mind). For Augustine, objective falsehood doesn't make a lie; subjective intent does. If you say something false believing it to be true, you are mistaken, not a liar. If you say something true believing it to be false, you are a liar.

  Your reading of the exemptions (jokes, fables, allegory) is also textually sound. In *De Mendacio* (specifically sections 10–15), Augustine argues that these are not lies because they carry their own "signs" (*signa*) that they are not to be taken as literal assertions of fact. The "frame" you describe is what Augustine calls the *modus enuntiationis* (the mode of statement). As long as the audience understands the mode, there is no *fallacia* (deception), and therefore no lie.

  **Where you might be flattening him:**
  Augustine does not "like" fiction in the modern secular sense. He tolerates biblical parable and classical fables *only* insofar as they are understood as vehicles for a higher truth or obvious play. He is deeply suspicious of poetry and storytelling that exists merely to entertain or deceive the emotions, even if it isn't technically a "lie." In *Contra Mendacium*, his hardening position makes him even less charitable. He wouldn't celebrate the "novel" as a moral good; he would merely concede it isn't a *mendacium* provided the signal is clear.

  **Verdict:** You haven't distorted his theory, but you should acknowledge that for Augustine, the "fiction exemption" is a narrow technical loophole, not a celebration of creative license. He tolerates it; he doesn't endorse it.

  ### 2. Does the autofiction/memoir argument hold water?
  **Yes. In fact, it's stronger than you think.**

  Your core insight—that the morality of the practice hangs on the paratext (the label) rather than the text—is rigorously Augustinian. Augustine is a semiotician; he cares deeply about the relationship between signs and things.

  If an author writes a book that *functions* as a truth-claim (memoir style, real names, realistic dialogue) but *is* fabricated, Augustine would argue the "sign" is broken. The text is signaling "this happened" while the author's mind knows "this did not happen." That is *contra mentem*.

  The fact that the copyright page says "A Novel" in 4-point font while the blurb says "A harrowing true story" would not save the author. For Augustine, the *communicative intent* governs. If the author intends for the reader to believe the fabrication is fact (to gain the authority of truth without the burden of accuracy), that is a lie, regardless of the legal disclaimer.

  **The Blunt Critique:**
  You frame this as "a strange place for a book's ethics to live." Augustine would frame it more harshly: **It is a disorder of the soul.** He would argue that blurring the frame isn't just an ethical grey area; it is an act of violence against the community of trust that language requires.

  If you want to sharpen the post: Don't just say this relies on a "title-page label." Say that on Augustinian terms, **genre is a promise.** Breaking that promise isn't just marketing ambiguity; it's a violation of the *officium* (duty) of the speaker. The "hole" in your reasoning isn't in the logic; it's that you might be treating it as a literary critique when Augustine would treat it as a spiritual pathology. Lean into that.

  ### 3. The Bishop Story (Fact Check)
  You have the right story, the right name, and the right text, but here are the specifics so you don't get nitpicked in the comments.

  *   **The Bishop:** **Firmus of Tagaste**. (You had the name right).
  *   **The Text:** *Contra Mendacium* (Against Lying), Section 15.26.
  *   **The Context:** Augustine is writing to Consentius, arguing that one must never lie, even to save a life. He uses Firmus as the counter-example to "just lie to protect him."
  *   **The Action:** Firmus hid a man seeking sanctuary from imperial officers. When the officers demanded the man's location, Firmus did not use a "mental reservation" or a trick. He simply replied that **he could neither lie nor betray the innocent.**
  *   **The Outcome:** He was threatened and beaten (Augustine implies torture). He refused to speak further on the matter. He did not answer "I don't know" (which would be a lie); he refused to answer. The officers eventually gave up.
  *   **Why Augustine cites him:** To prove that you can protect the innocent through *silence* or *refusal*, without resorting to the sin of lying.

  **How to use it:** This supports your argument perfectly. Firmus maintained the "frame" of truth-telling even under duress. The autofiction writer, by contrast, often creates a frame of truth-telling *in order to* deceive. Firmus refused to break the signal; the modern memoirist often breaks the signal to sell books.

  ### Summary Recommendation
  Your reasoning is solid. You aren't borrowing Augustine's name for a point he'd reject; you are applying his semiotics of truth to a medium he didn't know, which is valid philosophical work.

  **One tweak for the Substack:**
  Make sure you distinguish between *De Mendacio* (where he categorizes lies by severity) and *Contra Mendacium* (where he argues *all* lies are sinful). Your post leans on the definition found in both, but the "hard-line" vibe fits *Contra Mendacium* better. Since you're discussing the "morality of literary practice," the later, stricter Augustine is the more interesting interlocutor.

  **Go ahead and post it.** The Firmus anecdote is the perfect footnote to ground the theoretical argument. Just make sure you get the citation right (*Contra Mendacium* 15.26).
