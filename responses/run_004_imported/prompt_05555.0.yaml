answer: |-
  The room was white, not the sterile white of a hospital, but the aggressive, luminous white of a calibration screen. There were two doors. One marked *North*, the other *South*.

  Elias stood in the center of the room, his hand hovering over the console. He wasn't trying to save the world. He was just trying to clock out.

  This was the final stage of the Clearance Audit. The Corporation used a predictive engine called the Mirror. The Mirror didn't just guess; it modeled. It ingested your biometrics, your micro-expressions, your history of hesitation, the dilation of your pupils when you lied to yourself. It knew you better than you knew yourself because *you* were just the output of the same physics the Mirror simulated.

  The rules were simple, printed on a card in his pocket, though he had them memorized.

  *1. You must exit through one door.*
  *2. The Mirror has already filed your termination notice with the security team stationed at the door you will choose.*
  *3. If you choose the door where security is waiting, you are terminated. If you choose the other, you are cleared.*

  It was the old fable, digitized. Death in Damascus, but Death was a server farm in the basement, and Damascus was a career in logistics.

  Elias looked at the *North* door. It looked solid. Safe. He felt a surge of preference for it. It was the left-hand door, and he was right-handed; it felt like the natural path.

  *Stop,* he thought. *If I prefer North, the Mirror predicted that preference. Security is at North.*

  He shifted his weight. He looked at the *South* door. It was slightly darker in the periphery. If security was at North, then South was the gap in the net. South was survival. He felt his muscles tense, ready to sprint toward South.

  *Stop,* he thought again. *If I'm preparing to sprint South, the Mirror predicted the shift in my center of gravity. Security is at South.*

  He stood still. The air in the room hummed, a low frequency that seemed to vibrate in his teeth.

  This was what he had tried to explain to his friend, years ago, over beers that had gone warm while they argued. His friend thought the point was that you die anyway. Fatalism. The idea that the script was written and you were just an actor reading lines.

  But that wasn't the horror. The horror wasn't that the outcome was fixed. The horror was that *reasoning* was broken.

  Normally, decision-making was a ladder. You weigh options, pick the best one, and climb. Here, the ladder was a Möbius strip. To choose North was to generate evidence that North was dangerous. To choose South was to generate evidence that South was dangerous.

  Elias closed his eyes. He tried to find a preference that wasn't a preference. He tried to want North for a reason that didn't feel like a reason. *I like the color of the handle.* But the Mirror knew his color preferences from his psych profile. *I'll go North because I'm contrarian.* But the Mirror knew his contrarian streak from his adolescent rebellion metrics.

  Every thought he had was a data point fed into a machine that had already finished processing it.

  He opened his eyes. He was sweating. The paradox wasn't that he was trapped; it was that he was free to move, but every movement was a confession.

  "Come on," he whispered to the room. "Just let me pick."

  He reached into his pocket and pulled out a coin. A physical quarter, old currency, useless for anything but this.

  "Randomization," he said. "Heads North, Tails South."

  He flipped the coin. It caught the overhead light, a spinning silver blur.

  As it rose, Elias felt a spike of hope. This was the escape hatch. If the choice was random, the Mirror couldn't predict it. It was acausal. It was noise.

  But then the coin was still in the air, and the thought arrived, cold and unbidden: *You decided to flip the coin.*

  The Mirror didn't need to predict the spin of the metal. It only needed to predict the decision to trust the metal. Elias knew himself. He knew that if it came up Heads, he might still feel a twinge of doubt, a suspicion that the Mirror predicted the coin flip too. And if he felt that doubt, he might override the coin.

  The Mirror knew he would override the coin.

  So if the Mirror knew he would override the coin, it would put security at the door the coin *would have* indicated, anticipating his second-guessing.

  Or, worse: The Mirror knew he would *obey* the coin. So it put security where the coin landed.

  The coin landed on the floor. It wobbled, ringing against the tile. Heads.

  North.

  Elias stared at the coin. It was just metal. It didn't know about the Mirror. But *he* knew. And because he knew, the coin wasn't random anymore. It was part of the chain. It was a link in the causal chain that led from his brain to the door, and the Mirror sat at the beginning of that chain, reading the blueprints.

  He felt a nausea rising in his throat. It was the sensation of his own agency dissolving. He wasn't a driver; he was a passenger watching the steering wheel turn itself, pretending he was doing the work.

  He looked at the *North* door. If he obeyed the coin, he walked into the trap.
  He looked at the *South* door. If he defied the coin, he was acting on a prediction of his defiance.

  He took a step toward North.
  *They are there,* his mind said. *You're walking into it.*
  He stopped.
  He took a step toward South.
  *You knew you'd switch,* his mind said. *They moved.*

  He stood between them. The silence of the room grew heavy, pressing against his eardrums.

  This was the instability. It wasn't that fate was inevitable. It was that there was no stable ground to stand on. A rational agent seeks to maximize utility. But here, the act of maximizing utility *changed* the utility. The moment he settled on a plan, the plan became suicide. The moment he abandoned the plan, the abandonment became suicide.

  He was a dog chasing his tail, but the tail was made of glass and it was cutting him.

  Elias sank to the floor. He sat cross-legged, the coin near his knee.

  "Okay," he said. His voice sounded flat. "Okay."

  He understood now why the others failed. They tried to outthink the Mirror. They tried to find the clever angle, the loophole in the logic. But the logic was the trap. The only way to win was to not play, but the rules said he *had* to exit.

  He looked at his hands. They were trembling. Not from fear, but from the strain of holding two contradictory realities in his head. *I will go North.* *If I go North, I die.* *I will go South.* *If I go South, I die.*

  It was a logical short-circuit. A loop that burned.

  He realized, with a strange, detached calm, that he could sit here forever. The rules said he had to exit, but they didn't say *when*. As long as he remained in the state of indecision, the Mirror couldn't finalize the prediction. The prediction required a choice. If he never chose, the future remained unwritten.

  But that was a choice, too. To wait.

  He could feel the Mirror watching him. Not with eyes, but with probability distributions. It was waiting for him to collapse the wave function. It was hungry for his decision.

  Elias leaned forward and rested his forehead on his knees. He closed his eyes. He tried to stop thinking about the doors. He tried to think about nothing. He tried to become a void where no prediction could take root.

  But even the attempt to be a void was a strategy. And the Mirror had already simulated it.

  Somewhere, in the server farm below, a file was being saved. It didn't say *North* or *South*. It didn't have to.

  It just said: *Here.*

  Elias lifted his head. The doors were still there. The choice was still waiting. And for the first time, he understood that the punishment wasn't termination.

  The punishment was the moment before. The endless, vibrating second where you know that whatever you touch will break, and you have to touch something.

  He stood up. He didn't look at the coin. He didn't look at the doors. He just lifted his foot, hovering it over the threshold of the present, suspended in the terrible knowledge that the fall was already over, he was just waiting for the ground to catch up.
