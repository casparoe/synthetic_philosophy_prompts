prompt: |-
  A friend of mine, who taught classical Chinese philosophy for almost thirty years and directed my dissertation long before that, died two weeks ago after a short illness. She had spent most of her career working on the Zhuangzi, and the instructions she left in writing for her memorial were pretty transparently modeled on the philosopher she'd devoted her life to: cremation, the ashes scattered informally with no headstone, no black clothing, and explicitly no one is permitted to say that she is "watching over us" or "in a better place." She used to close her seminar every year on the "Zhile" ("Perfect Happiness") chapter with the scene where Huizi arrives to console the newly widowed Zhuangzi and instead finds him sitting sprawled on the ground, drumming on an upturned basin and singing; her point was always that Zhuangzi had not argued himself out of loving his wife, only out of the assumption that his wife's death was a misfortune happening to some self of hers that persisted afterward to be pitied. She also had a real fondness, which I remember mainly because it always got a laugh, for the scene near the end of the book where the dying Zhuangzi waves off his disciples' plans for an elaborate burial, tells them heaven and earth will do for an outer coffin and the sun and moon for a pair of jade discs, and then, when the disciples worry that crows will eat him if he's left exposed, asks why being eaten by worms underground is supposed to be the better deal.

  I've been asked to give the eulogy at the memorial, and the room is going to split cleanly in two: former students and colleagues who will recognize exactly which arguments sit behind every one of her instructions and will notice immediately if I get them wrong or soften them into mush, and family and old friends who have never read the Zhuangzi and are there because they loved her and are simply grieving. Could you write the eulogy? It needs to let the philosophy do real work in shaping what can and can't be said, rather than showing up as decoration -- no talk of her watching over anyone, since that's closer to what she spent her career arguing against than to anything she actually believed, but also nothing so serenely detached that it comes across as telling the grieving half of the room that their grief is a mistake. I'd also like it to find an honest way of touching on that deathbed scene, since it was more or less the blueprint for what she asked us to do with her own remains, without letting it land as a cute literary allusion, or reproducing the joke about the crows and the worms in a way that scandalizes people rather than comforting them.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Subject:** A friend/mentor/professor of classical Chinese philosophy (specialist in *Zhuangzi*) who died two weeks ago.
      *   **Context:** Memorial service.
      *   **Audience:** Split in two.
          *   Group A: Former students/colleagues (know the *Zhuangzi*, know her work, will spot philosophical inaccuracies or softening).
          *   Group B: Family/old friends (don't know the text, there to grieve, need comfort without platitudes).
      *   **Constraints/Instructions:**
          *   Follow her written instructions (cremation, scattered ashes, no headstone, no black clothing, *no* "watching over us" or "better place").
          *   Philosophy must do *work*, not just be decoration.
          *   Avoid "watching over us" (violates her beliefs).
          *   Avoid serene detachment that invalidates grief (grief is real, not a mistake).
          *   Address the deathbed scene (Zhuangzi refusing elaborate burial/crows vs. worms) honestly, without it sounding like a cheap joke or scandalizing the non-academic audience.
          *   Tone: Honest, grounded, respectful of both the philosophy and the human emotion.

  2.  **Deconstruct the Philosophical Core (*Zhuangzi*):**
      *   *The Drumming on the Basin:* It's not about lack of love; it's about understanding transformation (*hua*). Grief is natural, but the *catastrophizing* of death is the illusion.
      *   *The Deathbed Scene:* Equality of processes. Being eaten by crows or worms is the same return to the earth. It's about not privileging human ritual over natural process.
      *   *The "Self":* The self isn't a fixed entity that persists. Death isn't a misfortune happening to a permanent "her."
      *   *The Constraint:* No "better place." Death is just change.

  3.  **Address the Audience Split:**
      *   *For the Scholars:* Use the terminology correctly (transformation, not nihilism). Acknowledge the specific passages without lecturing.
      *   *For the Family:* Translate the concepts into human experience. "Transformation" becomes "returning to the world." "No self" becomes "she is part of everything now." Validate their sadness while offering a different perspective on *why* it hurts.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the unusual nature of the gathering. No black clothes, no urn on display. Set the tone immediately.
      *   **The Philosophy (The Hard Part):** How to explain *why* she asked for this without sounding cold?
          *   *Idea:* Frame it as her final lesson. She didn't want us to pity her.
          *   *Key Concept:* Transformation. She isn't "gone" in the sense of vanishing; she has changed form.
      *   **The "Drumming on the Basin" Reference:**
          *   Need to mention her seminar tradition.
          *   Explain it: She loved her students/family, but she didn't view death as a tragedy.
          *   *Crucial nuance:* Grief is allowed. Zhuangzi cried first, *then* drummed. The eulogy must validate the tears.
      *   **The Deathbed Scene (Crows/Worms):**
          *   This is risky. If I say "she didn't care if crows ate her," family might hear "she didn't care about dignity."
          *   *Reframing:* It's about equality with nature. She wanted to be useful to the world, even in death. It's about not fearing the physical process.
          *   *Phrasing:* Focus on her desire to be *part* of the world, not separate from it.
      *   **The "Watching Over Us" Prohibition:**
          *   Why did she ban this? Because it implies she's still a "person" hovering.
          *   *Alternative:* She is in the wind, the ground, the memory. Not a ghost, but a presence.
      *   **Closing:** Bring it back to the living. How do we honor her? By living fully (Zhile/Perfect Happiness).

  5.  **Refining the Tone (Iterative Process):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Use metaphors. "Seasons," "Breath," "Earth."
      *   *Critique:* Is it too cold?
      *   *Fix:* Admit that it hurts. "We miss her." "This is hard."
      *   *Critique:* Is the crow/worm joke handled well?
      *   *Fix:* Don't tell the joke. Tell the *point* of the joke. The point is that we are food for the earth either way. She chose to trust the earth.

  6.  **Writing the Draft (incorporating the above):**
      *   *Start:* Welcome everyone. Note the lack of black.
      *   *Middle 1:* Her instructions. Why? Because she believed in transformation.
      *   *Middle 2:* The seminar story. Acknowledge the love. Grief is the cost of love, not a mistake.
      *   *Middle 3:* The burial request. Connect it to the "crows and worms." Frame it as generosity to the world.
      *   *End:* How to remember her. Not watching from above, but here in the change.

  7.  **Final Polish:**
      *   Check against constraints: No "better place." No "watching over."
      *   Ensure the *Zhuangzi* scholars nod along (concepts of *hua* [transformation] and *qi* [breath/energy] implied).
      *   Ensure the family feels hugged, not lectured.
      *   *Self-Correction during drafting:* I initially thought about quoting the text directly. Better to paraphrase the *spirit* so it flows better for the non-academics. The scholars will hear the echo; the family will hear the meaning.
      *   *Specific focus on the "Crows/Worms":* Make sure it sounds like *her* voice. She had a sense of humor. It should sound like her wit, not a grim fact.

  8.  **Final Review against the Prompt:**
      *   Did I mention the dissertation/mentorship? Yes, implicitly in the "teacher" role.
      *   Did I cover the instructions? Yes.
      *   Is the philosophy doing work? Yes, it structures the comfort.
      *   Is grief validated? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  Thank you all for being here. Thank you for coming, and thank you for honoring the request that you not wear black. Looking out at this room, seeing the colors you've chosen, feels like the first lesson of her final class.

  For those of you who knew her as a mother, a sister, or a friend, you know that she was a teacher. It wasn't just her job; it was how she moved through the world. She spent thirty years teaching classical Chinese philosophy, and specifically, she spent those thirty years thinking deeply about how to live with the fact that things end.

  When she wrote the instructions for this gathering, she was very specific. No headstone. Ashes scattered informally. No talk of her "watching over us" from above, and no assurances that she is in a "better place."

  I know that for some of you, those instructions might feel stark. It might feel like she is asking us to minimize the loss. I want to be clear: she was not asking us to minimize the loss. She was asking us to understand the nature of the change.

  She spent her career studying the *Zhuangzi*. There is a famous scene in that text where the philosopher's wife dies. His friend arrives to offer condolences and finds Zhuangzi sitting on the floor, drumming on an upside-down basin and singing. It looks like indifference. It looks like coldness. But she taught us for decades that this was not about a lack of love. Zhuangzi admitted that when his wife first died, he cried like anyone else. He grieved. The drumming came later. It came only after he realized that to demand she stay in the form of a living woman was to misunderstand how the world works. He realized she had simply moved from one form of existence to another, like the seasons changing from spring to winter.

  She told us that story every year. She told it because she wanted us to know that we could love someone fiercely without demanding that they stay the same forever.

  So, when I say she is not "watching over us," I am not saying she is gone. I am saying she is not separate from us. To say she is watching from somewhere else implies she is still a distinct person, hovering apart from the world she loved. She didn't believe that. She believed she was returning to the flow of things. She is in the air we are breathing in this room. She is in the ground where her ashes will rest. She is not absent; she has just become less defined.

  I know this doesn't stop the ache. Understanding the philosophy doesn't stop the phone from feeling too quiet when it doesn't ring. She knew that. The *Zhuangzi* never argues that grief is a mistake. It argues that suffering comes from resisting the inevitable. We are allowed to miss her. In fact, missing her is the proof that she was here, and that we loved her.

  There is one other instruction she left, which I know might be difficult for some of you to hear. She asked that there be no elaborate burial, no coffin, no monument. She wanted to be scattered.

  There is a passage near the end of the *Zhuangzi* where the philosopher is dying. His disciples want to give him a grand funeral. He tells them, "I have heaven and earth for my inner and outer coffins, the sun and moon for my jade discs, and the stars for my pearls. Everything is ready for my burial. What could you add to this?"

  The disciples worry. They say, "We are afraid the crows and kites will eat you."

  And he laughs. He asks, "Above ground, the crows and kites will eat me. Below ground, the ants and worms will eat me. Why would you rob the crows to feed the worms?"

  She loved that story. She loved it because it was funny, yes, but also because it was honest. She didn't want us to treat her body as a temple that needed to be protected from the earth. She wanted to be useful to the world, even now. She trusted the earth enough to let it take her back without a barrier.

  For her family here: I know this might sound undignified to you. I know you might want a place to visit, a stone to touch. But please hear this in her voice, with the wit and warmth you knew. This wasn't a rejection of you. It was an embrace of everything else. She didn't want to be walled off in a plot of land. She wanted to be free. She wanted to be part of the grass, and the wind, and the soil, rather than a memory trapped in marble.

  We cannot argue ourselves out of loving her. And we cannot argue ourselves out of missing her. But we can try to honor her by not treating her death as a catastrophe. She spent her life teaching that "perfect happiness" isn't about getting what we want or keeping what we have. It's about flowing with the transformation of things.

  So, we will not say she is in a better place. This place, here, with us, in this change, is where she is.
  We will not say she is watching over us. She is not above us; she is with us.
  And we will not dress in black to mourn the end of a life. We will wear color to celebrate the transformation of a spirit that refused to be small, even in death.

  If you want to honor her, do not stand solemnly before a grave. Go for a walk. Notice the way the light hits the trees. Notice the change in the season. Feel the ground beneath your feet. She is there. And if you feel a sudden laugh rise up in you when you remember her wit, or her stubbornness, or the way she challenged you—let yourself laugh.

  She drummed on the basin. She asked us to trust the earth. She asked us not to pity her.
  Let's grant her that. Let's miss her, let's love her, and let's let her go.

  Thank you.
