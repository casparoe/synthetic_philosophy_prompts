answer: |-
  Here are 10 interview questions tailored for your column, designed to move past the textbook summary and into the friction points of the theory. Each includes a targeted follow-up based on the standard philosophical "moves" she's likely to make.

  ### 1. The "Common Sense" Hook
  **Question:** Thomas Reid argued that truth-telling and belief-acceptance are like instinctual pairings, hardwired into us for social survival. But instincts can be maladaptive—like our craving for sugar in an era of abundance. If our "credulity" is just an evolutionary heuristic, why should we treat it as an *epistemic* virtue rather than a biological shortcut we need to override?

  **Follow-up:** *If she leans on the reliability of the heuristic:* "So are you saying the track record of testimony validates the instinct, or that the instinct validates the track record? It feels like we might be chasing our tails."

  ### 2. The Gullibility Objection & Real-Time Defeaters **(Required)**
  **Question:** The standard knock against anti-reductionism is that it licenses gullibility. You'll say entitlement is *defeasible*—we don't believe if there are red flags. But in the heat of a conversation, especially online or in polarized contexts, what actually counts as a defeater *in real time*? Is it a contradiction, a tone shift, or do we need external corroboration? Where is the line between 'default trust' and 'lazy thinking'?

  **Follow-up:** *If she says "context determines the threshold":* "That sounds a lot like the reductionist's 'positive reasons' requirement, just with a lower bar. If the context does all the work, what heavy lifting is the 'default entitlement' actually doing?"

  ### 3. Coady vs. Fricker: The Local Reductionist Loophole **(Required)**
  **Question:** C.A.J. Coady's famous argument against Hume is that we can't build an inductive case for testimony without *using* testimony, which begs the question. That seems to sink *global* reductionism. But Elizabeth Fricker's *local* reductionism doesn't require a global induction; she just says I need reasons to trust *you*, here and now, based on monitoring your coherence and plausibility. Doesn't Coady's argument leave Fricker's position completely untouched?

  **Follow-up:** *If she argues monitoring is too cognitively demanding:* "But adults monitor speakers effortlessly. If it's effortless, isn't that just what a successful inductive habit looks like? Why call it 'entitlement' instead of 'automated inference'?"

  ### 4. The Language Acquisition Argument **(Required)**
  **Question:** Anti-reductionists often point to children: they learn language through testimony before they have the capacity to evaluate sources. Therefore, trust must be basic. But doesn't this only prove that trust is *developmentally unavoidable*, not that it is *epistemically justified*? Just because I can't help but believe you doesn't mean I *ought* to. How do you bridge that 'is-ought' gap?

  **Follow-up:** *If she claims it's a precondition for rationality:* "If it's a precondition, does that mean adults who become skeptical of testimony—conspiracy theorists, say—have actually lost their rational status, or just exercised a right you say they don't have?"

  ### 5. The Fake News Ecosystem
  **Question:** Reid wrote when the biggest lie you'd hear was probably from a neighbor about a horse trade. Today, we are bombarded by algorithmic disinformation designed to bypass our defeaters. Does the anti-reductionist view need a patch for the digital age? Is there a point where the volume of noise invalidates the default entitlement, similar to how visual illusions invalidate perception in a funhouse?

  **Follow-up:** *If she says "the principle remains, apply more defeaters":* "But if the environment is hostile, doesn't the burden of proof shift? If I know 40% of what I see on X is bot-generated, isn't the default *suspicion*, not trust?"

  ### 6. Scientific Testimony and Understanding
  **Question:** In science, we rely on testimony constantly, but we're also told we should understand the mechanisms behind the claims. If I believe a climatologist without understanding the models, am I epistemically lazy, or am I exercising a proper entitlement? Does anti-reductionism let us off the hook for intellectual diligence regarding expertise?

  **Follow-up:** *If she distinguishes between "blind faith" and "entitlement":* "What's the practical difference? If I don't check the models either way, how does labeling it 'entitlement' improve my epistemic hygiene?"

  ### 7. The Perception Analogy
  **Question:** You treat testimony like perception: I believe my eyes unless I have a reason not to. But when my eyes play tricks on me, I can often check them against touch or another angle. When a speaker lies, the only check is often... more testimony. Doesn't this lack of independent access make testimony riskier than perception, requiring a higher baseline of scrutiny?

  **Follow-up:** *If she argues we check testimony against coherence:* "Coherence within a belief system can be self-sealing. If a liar is consistent, and my other beliefs come from testimony, haven't I just built a coherent web of lies?"

  ### 8. The Norm of Assertion
  **Question:** Some argue we are entitled to believe because speakers are bound by a norm of truth-telling (you shouldn't say what you don't believe). But if a speaker violates that norm, do I lose my entitlement retroactively? Or is my justification secure even if they were lying, provided I had no reason to know?

  **Follow-up:** *If she says "justification is internal, so you're still justified":* "That means two people can believe the same lie, one is justified and one isn't, based purely on their access to defeaters. Does that make truth irrelevant to knowledge?"

  ### 9. The Moral Dimension
  **Question:** There's a moral argument here, too: trusting someone acknowledges their agency and status as a knower. By demanding independent evidence for everything you tell me, am I not just being epistemically careful, but also insulting you? Is anti-reductionism actually a form of epistemic etiquette?

  **Follow-up:** *If she agrees it's partly ethical:* "If it's ethical, can we be *too* trusting? Is there a moral duty to be skeptical when the stakes are high, like in a courtroom or a medical diagnosis?"

  ### 10. The "So What?" for the Reader
  **Question:** For my readers who aren't philosophers: if they adopt your view tomorrow, how does their life change? Do they argue less? Do they consume news differently? Or is this purely a theoretical cleanup job to stop skeptics from winning arguments?

  **Follow-up:** *If she says "it changes how we view community":* "So the takeaway is that believing each other is the glue of society? Even if some of what we believe turns out wrong?"
