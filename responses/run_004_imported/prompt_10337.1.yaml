          *   *Correction:* Epistemic value drives exploration *when there is uncertainty about how to fulfill priors*. It doesn't drive novelty for novelty's sake unless the priors favor learning.
          *   *Wait, Friston argues:* Epistemic value is intrinsic to EFE. Even without specific "curiosity priors," an agent must resolve uncertainty to minimize risk.
          *   *Nuance:* The user thinks Epistemic Value was added to fix Dark Room. Actually, Dark Room is fixed by *Priors*. Epistemic Value fixes *Exploration-Exploitation*.
