      *   **Core Claim:** Transformers might refute F&P's systematicity argument because they show systematicity without classical symbolic architecture.
      *   **F&P Summary:** Thought is symbolic (Mentalese). Systematicity (ability to think $aRb$ implies ability to think $bRa$) requires constituent structure. Connectionism (1988 style) lacks this, so it fails. Therefore, cognition must be classical.
      *   **Counter-Argument:** Transformers produce novel combinations without discrete symbols/variable binding (just matrices/attention). This is an existence proof that systematicity $\neq$ classical architecture.
