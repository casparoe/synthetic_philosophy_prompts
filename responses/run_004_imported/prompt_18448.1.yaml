          4.  The Dichotomy Problem: The classical/connectionist distinction might be false/blurred.

  3.  **Evaluate Point 1: Representation of Fodor & Pylyshyn:**
      *   *Accuracy:* The summary of systematicity is generally correct. F&P did argue that systematicity is a *nomological necessity* (law of nature for minds), not just an empirical regularity. They argued connectionist networks (specifically simple backprop nets of the late 80s) couldn't guarantee it without implementing classical structure.
      *   *Nuance:* F&P's claim wasn't just "you need symbols," it was "you need *constituent structure* that is causally active." They distinguish between *having* a representation and the system being *sensitive* to that structure.
      *   *Weakness:* The draft implies F&P said "no connectionist system can ever do this." F&P allowed that connectionist systems could *simulate* classical systems. Their point was that if a system exhibits systematicity, it *is* (functionally) classical, even if implemented in neurons. The draft says "falsify the 'must implement classical structure' claim." F&P would reply: "If it does systematicity, it *is* implementing classical structure, even if you call it matrices."
