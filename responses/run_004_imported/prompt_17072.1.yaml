  ### Score Explanations

  **Move 1 (Naomi): +1**
  Naomi is substantively correct that the mathematical decomposition of Expected Free Energy (EFE) into extrinsic (pragmatic) and epistemic (information gain) value closely mirrors reward-plus-entropy-regularization in Maximum Entropy RL. However, she loses a point for dismissing the *derivation*. In RL, the exploration bonus is usually added ad hoc; in Active Inference, it emerges necessarily from the uncertainty in the generative model. It's not *just* a costume, but the functional equivalence she points out is real and widely acknowledged.

  **Move 2 (Theo): +1**
  Theo correctly identifies the theoretical appeal: the trade-off isn't an arbitrary weighted sum but falls out of a single objective function. However, this is slightly oversold. In practice, Active Inference models still require setting "precision" parameters (hyperpriors on uncertainty) that effectively act as tunable knobs controlling the explore/exploit balance. The constraint is tighter than RL, but not as rigid as he implies.

  **Move 3 (Naomi): +2**
  This is the strongest philosophical objection to the FEP (the "tautology" or "Just-So Story" critique). If any observed behavior can be rationalized as free-energy minimizing under *some* specified generative model, the principle itself cannot be falsified. Naomi is right that the falsifiability burden shifts entirely to the specific model specification, leaving the overarching principle insulated from empirical refutation.

  **Move 4 (Theo): +1**
  Theo is honest and technically accurate: Friston himself classifies FEP as a "postulate" or mathematical identity (like Least Action) rather than a falsifiable hypothesis. However, Naomi's rebuttal within this move is devastatingly accurate (+2 territory): if the falsifiable content lies entirely in the process theories (like predictive coding) which can exist without FEP, the explanatory surplus provided by FEP becomes questionable. Theo's move is valid defensively, but it concedes the offensive ground.

  ### Referee Verdict

  **Does Naomi's "shell game" charge survive?**
  **Yes, but with caveats.** Naomi wins the argument on **falsifiability**. Theo's "state theory" defense saves the FEP from being *false*, but it inadvertently confirms Naomi's suspicion that it might be *empty*. If the FEP is merely a bookkeeping identity (like Least Action), it cannot tell you *which* model an agent is using, only that *if* they are using a model, it looks like free energy minimization. Since you can always reverse-engineer a model to fit the data (Move 3), the FEP itself doesn't constrain the space of possible explanations enough to be a standalone scientific theory.

  **What are they both missing?**
  Both are treating the FEP as either a **universal law of nature** (Theo's implicit hope) or a **tautological trick** (Naomi's claim). They are missing the argument for **structural constraints**.

  The missing move is that while *any* behavior can be modeled as FEP-minimizing post-hoc, not all generative models are **biologically plausible** or **computationally tractable**. The scientific value of the FEP isn't that it predicts behavior in a vacuum, but that it restricts the space of *implementable* models to those that can be solved via message passing (variational inference) on neural hardware.

  **The Referee's Ruling:**
  The debate stalls because they are arguing past each other on the **level of analysis**.
  *   **Naomi** is arguing at the **computational/functional level**: "Does this give me unique predictions about behavior?" (Answer: No).
  *   **Theo** is arguing at the **algorithmic/implementation level**: "Does this give me a plausible mechanism for how brains do inference?" (Answer: Yes).

  **Final Call:** Naomi is right that the FEP is not a falsifiable theory of behavior. Theo is right that it is a useful framework for building mechanistic models. The "shell game" charge holds if you expect FEP to predict *what* an agent does; it fails if you use FEP to constrain *how* an agent could possibly do it. The cohort should stop asking if FEP is "true" and start asking if the specific generative models it forces you to build are more biologically constrained than standard RL models. That is the only empirical ground left to fight on.
