answer: |-
  Your intuition is spot on, and your colleague is defending a position in epistemology that is widely considered untenable for human agents: the requirement of **logical omniscience**.

  You have stumbled onto a classic tension between *normative logic* (how reasoning ought to work in a vacuum) and *bounded rationality* (how reasoning works given finite time and cognitive power).

  Here is the breakdown of why your colleague is technically correct about the *propositions* but likely wrong about the *agents*, and why the "amount of work" matters profoundly for attributing irrationality.

  ### 1. The Trap of Logical Omniscience
  Your colleague is operating under the standard possible-worlds semantics often used in formal epistemology. In that framework, if an agent believes $P$, and $P$ logically entails $Q$, the agent is modeled as believing $Q$. Consequently, if an agent believes $P$ and believes $R$, and $P$ and $R$ are contradictory, the agent is labeled inconsistent.

  The problem, as you noted, is that this implies **logical omniscience**. It suggests that a rational agent instantly knows all logical consequences of their beliefs. If we accept your colleague's view, then no human being is rational. We all hold beliefs that contain hidden contradictions we simply haven't lived long enough to deduce.

  If a mathematician believes the axioms of ZFC set theory, and those axioms happen to be inconsistent (which we don't know for sure), is the mathematician irrational for not knowing that yet? Under your colleague's definition, yes. Under any reasonable definition of human rationality, no.

  ### 2. Bounded Rationality and Computational Cost
  Your instinct that the "work" matters aligns with the theory of **bounded rationality** (pioneered by Herbert Simon) and more recent work in **computational epistemology**.

  Rationality is not just about the static state of your belief set; it is about the *process* by which you manage that set given your constraints.
  *   **The Broccoli Case:** "I love broccoli" and "I hate all vegetables." The contradiction is semantic and immediate. The cognitive cost to detect the inconsistency is near zero. Failing to notice this suggests a failure of basic conceptual competence.
  *   **The 8,051 Case:** The contradiction is arithmetic and hidden. The cognitive cost to detect it requires executing a factoring algorithm.

  To call the kids "irrational" for failing to factor 8,051 in their heads is like calling a runner "irrational" for not running a 3-minute mile. It violates a norm that is physically/cognitively impossible for them to meet.

  In computer science terms, you are pointing out that **deductive closure is computationally expensive.** For some propositions, checking consistency is polynomial time; for others (like factoring large integers), it is much harder. A theory of rationality that ignores computational complexity is a theory that applies to angels or gods, not to students at a math night.

  ### 3. Explicit vs. Implicit Belief
  A useful distinction here (often attributed to Jaakko Hintikka) is between **explicit** and **implicit** belief.
  *   **Explicit Belief:** What you actively assent to when asked. (The kids explicitly believed both cards were true).
  *   **Implicit Belief:** The logical consequences of what you believe. (It is an implicit consequence of their beliefs that $1=0$, or that arithmetic is broken).

  We generally only hold people responsible for inconsistencies in their *explicit* beliefs, or in the *implicit* beliefs that are easily derivable. When the derivation requires "grinding through the division," the inconsistency remains latent. Holding someone accountable for latent inconsistencies that require significant proof-work to uncover is not a critique of their rationality; it is a critique of their omniscience.

  ### 4. Why This Matters for Teaching Logic
  Since you teach intro logic, this is actually a fantastic case study to bring into the classroom. It helps distinguish between **validity** and **soundness**, and between **logic** and **reasoning**.

  *   **Logic** is the study of consequence. In the realm of logic, your colleague is right: $\{P, \neg P\}$ is an inconsistent set. Full stop.
  *   **Reasoning** is the human activity of navigating beliefs. In the realm of reasoning, you are right: We are permitted to hold beliefs that *might* be inconsistent if we lack the resources to verify consistency, provided we are open to revising them upon evidence.

  The kids weren't being incoherent; they were using a heuristic. They likely looked at the cards, saw they were "math trivia," and assumed the booth wouldn't present a logical paradox. They were reasoning probabilistically ("It is highly unlikely these cards contradict"), not deductively. That is a rational strategy for a noisy world, even if it led to a false conclusion in this specific instance.

  ### The Verdict
  Your colleague is defending **ideal rationality**, which is useful for building formal systems but terrible for evaluating human beings. You are defending **ecological rationality**, which evaluates how well an agent functions within their environment and cognitive limits.

  The kids were **wrong** (their beliefs did not match reality), but they were not **irrational** (they did not violate the norms of reasoning appropriate for their cognitive capacity).

  If you tell your students "don't hold inconsistent beliefs," you are giving them a regulative ideal. But if you tell them "you are irrational if you hold inconsistent beliefs you couldn't possibly have known were inconsistent," you are teaching them a definition of rationality that no one can satisfy. The "amount of work" doesn't just matter; it is the *only* thing that matters when judging the rationality of the agent rather than the truth of the propositions.

  So, you can rest easy: the kids keep their stickers, and their rationality remains intact.
