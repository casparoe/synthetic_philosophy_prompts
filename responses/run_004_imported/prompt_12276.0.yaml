  4.  **Key Concepts to Integrate:**
      *   **Logical Omniscience:** The idea that a rational agent knows all consequences of their beliefs. Widely rejected in epistemology as an impossible standard for humans.
      *   **Bounded Rationality (Herbert Simon):** Rationality is limited by cognitive resources, time, and information.
      *   **Explicit vs. Implicit Belief:** Hintikka's distinction. You explicitly believe $P$. Do you implicitly believe $Q$ if $P \to Q$?
      *   **Computational Complexity:** Some logical truths are easy to verify; others (like factoring large numbers) are hard. This maps to the "work" the user mentioned.
