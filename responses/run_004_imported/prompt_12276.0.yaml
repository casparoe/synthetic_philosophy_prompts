      *   The colleague represents a strict *normative* view of logic (classical logic demands consistency).
      *   The user represents a more *psychological/descriptive* or *bounded rationality* view (humans have limited cognitive resources).
      *   The specific example (prime factorization) is a great hook for discussing computational complexity in epistemology.

  3.  **Deconstruct the Arguments:**

