answer: |-
  The waiting room was designed to lower blood pressure, all soft curves and muted sage greens, but Julian's heart was hammering against his ribs like a trapped bird. On the low table between him and Kael lay the consent form. It was thicker than a passport, filled with clauses about neural plasticity, permanent synaptic rerouting, and the waiver of rights regarding "pre-procedural personality retention."

  Julian looked at the pen. It was heavy, brushed steel. Then he looked at Kael.

  Kael had undergone the Integration three years ago. He sat with a stillness that unnerved Julian. It wasn't the stillness of meditation, which Julian had tried and failed at for a decade. It was the stillness of a lake that had no wind to catch it. Kael's eyes were the same brown they had always been, but the focus behind them seemed diffuse, as if he were looking at Julian and the wall behind him and the space between them all at once.

  "You don't have to decide today," Kael said. His voice was calm, lacking the usual cadence of persuasion. "The slot remains open."

  "If I don't decide today, I lose the subsidy," Julian said. "And if I lose the subsidy, I can't afford it. And if I can't afford it, I stay... this." He gestured vaguely at his own chest.

  "You stay Julian," Kael corrected.

  "Julian who worries. Julian who wants to write the novel and can't. Julian who loves his wife but feels separated from her by a pane of glass." Julian leaned forward. "You told me the glass goes away."

  "It does."

  "Tell me what it's like."

  Kael tilted his head. This was the third time Julian had asked this question in twenty minutes. "I told you. It's like waking up."

  "That's a metaphor. I need data." Julian tapped the consent form. "I need to know what I'm trading. The procedure severs the ego-boundary. Permanently. I need to know if the trade is worth it."

  "Worth is the problem, Julian," Kael said softly. "You are asking me to describe the color blue to you using only words for temperature. I can tell you it is cool. I can tell you it is deep. But you are looking for heat, and you are looking for surface."

  Julian sat back, frustrated. "Okay. Practicalities. Will I still care about my book?"

  Kael paused. The silence stretched, uncomfortable and thick. "You will care about the words. But the idea of 'your' book... the ownership of it... that will feel like trying to hold water in a fist. You won't want to hold it. You'll let it flow."

  "So I won't finish it."

  "Finishing implies a destination. The experience is the movement."

  "To me, that sounds like quitting." Julian's voice rose slightly. "I value completion. I value struggle. If the procedure removes the desire to struggle, it removes the thing that makes me feel alive. How can you say it's an improvement?"

  "Because the struggle is pain," Kael said. "And the pain is unnecessary."

  "But the pain is where the art comes from! If I'm just... flowing... what do I produce? What do I contribute?"

  Kael smiled, and it was a kind smile, but it felt patronizing. "You are assuming contribution matters. You are assuming production matters. Those are values held by the separate self. When the boundary dissolves, you don't need to contribute. You are already part of the whole."

  Julian looked down at his hands. They were trembling. This was the wall he kept hitting. Every time Kael offered an answer, it relied on a premise Julian currently rejected. Kael said peace was better than ambition. Julian knew, with absolute certainty, that ambition was better than peace. Kael said connection was better than individuality. Julian believed individuality was the only thing that made connection meaningful.

  They were speaking the same language, but the definitions of the words had shifted. Kael was trying to help Julian calculate the value of the Integration, but Kael was using a new currency that Julian couldn't exchange.

  "If I do this," Julian said, "I become you. Or something like you."

  "You become yourself," Kael said. "Just... unbound."

  "But I won't be me. The me that is sitting here wants to write the novel. The me that comes out of there won't want that. So, in a sense, I die. You die. The person who walks out is a successor who inherits my body and my memories but doesn't care about my goals."

  Kael nodded slowly. "That is one way to frame it."

  "It's not a frame. It's the math." Julian picked up the pen. It felt cold. "If I sign this, I am voting for my own obsolescence. I am saying that the person I am now is not good enough to continue existing."

  "You are saying that the person you are now is limited," Kael said. "And that limitation causes suffering. For you, for your wife, for everyone you touch."

  "My wife loves me," Julian snapped. "She loves *this* version. The driven one. The worried one. If I come home... unbound... will she recognize me? Will she love me?"

  "She will love who you are," Kael said. "But she will not be able to relate to you as she does now. You know this. The literature is clear. Relationships reconfigure. Some survive. Some dissolve."

  "So I could lose her."

  "You could lose the relationship you have now. You might gain something deeper. Or you might find the depth unnecessary."

  Julian stared at the signature line. *I acknowledge that my preference structure may undergo fundamental alteration.*

  He couldn't run the simulation. He closed his eyes and tried to imagine life after the Integration. He tried to imagine not caring about the novel. But when he imagined it, he felt a hollow dread. He imagined not worrying about money, about status, about legacy. It felt like floating in a void. To his current self, it looked like death. It looked like numbness.

  But he knew that was a lie. He knew it was a lie because Kael was sitting right there, and Kael wasn't numb. Kael was vibrant, but in a way Julian couldn't access. Kael's happiness was real, but it was a happiness that Julian's current brain was wired to reject.

  It was like being asked to agree to become a creature that breathed water. You could understand the mechanics of gills, you could talk to the fish who loved the ocean, but you couldn't *want* the ocean until you drowned in the air.

  "Why did you do it?" Julian asked.

  Kael looked out the window, where the city traffic crawled in silent lines. "I was tired," he said. "I was tired of being a single point of view. I wanted to know what it was like to be everywhere."

  "And now you know."

  "Yes."

  "Is it worth it?"

  Kael turned back to him. "I cannot answer that for you. Because the 'you' that asks the question will not be the 'you' that answers it."

  Julian gripped the pen. The steel was warming now, taking on the heat of his hand. He thought about the theory of it, the rational choice model. You assign probabilities, you assign utilities, you multiply and sum. But the utility function was about to be rewritten. He was being asked to maximize a value he couldn't comprehend, for a self he couldn't inhabit.

  The only thing he had left was the curiosity. The raw, itching need to know what was on the other side of the wall. Was that enough? Was the desire to know worth the destruction of the knower?

  He thought of his wife, asleep at home. He thought of the unfinished manuscript on his desk. He thought of the silence in Kael's voice.

  If he didn't sign, he remained safe. He remained Julian. He remained capable of loving and hating and striving and failing. He remained bounded. He would never know what Kael knew. He would always look at Integrated people and wonder if they were enlightened or lobotomized.

  If he did sign, he would find out. And then he wouldn't care that he found out.

  Julian uncapped the pen. The click was loud in the quiet room.

  "There's no going back," Kael said. It wasn't a warning. It was just a statement of fact, like noting the color of the walls.

  "I know," Julian said.

  He hovered the nib over the paper. The ink waited, black and final. He realized he was waiting for a sign, for a sudden clarity, for a feeling of certainty that would bridge the gap between his current self and his future self. But the gap was the point. The gap was the transformative experience. There was no bridge. There was only the jump.

  He looked at Kael one last time. Kael was watching him with no expectation, no hope, no fear. Just presence.

  Julian lowered the pen. The tip touched the fiber of the paper. He didn't know if he was signing his name or erasing it. He didn't know if the person who lifted the pen would be grateful or grieving. He only knew that he could not stay where he was. The question was no longer about what he wanted. It was about whether he could bear not to know.

  He pressed down. The ink flowed.
