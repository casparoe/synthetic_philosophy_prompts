  9.  **Key Phrase/Concept to Include:** The idea that the memory of a lifetime is less probable than the memory of *having* a lifetime. The "pasted-on" quality of the past.

  10. **Final Polish:** Check the pacing. Ensure the ending feels like a return to equilibrium, not just death. It's not dying; it's *unhappening*.

