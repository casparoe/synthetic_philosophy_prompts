answer: |-
  The coffee mug was warm, but the heat didn't travel up the handle the way it should have. It was just *declared* warm.

  I stood in the kitchen, the morning light slicing through the blinds in perfect, dust-free geometric bars. I looked at the mug. It was blue. I knew it was blue because I had bought it at a street fair in Portland three years ago, during a rainstorm, with a woman named Elena. I could see the rain. I could feel the damp wool of my coat. I could hear Elena laughing about the price.

  But when I tried to touch the memory of the rain, my fingers met only the concept of wetness. It was smooth. Glossy. Like a photograph laminated in plastic.

  I took a sip. It tasted like coffee. Not *my* coffee, not the specific bitter blend I roasted myself, but the universal idea of coffee.

  "Okay," I said. My voice sounded thin, as if the room were too large to hold the echo. "Okay."

  I had woken up ten minutes ago. Or rather, I had the memory of waking up ten minutes ago. I had the memory of sleeping eight hours before that. I had the memory of a childhood in Ohio, a degree in architecture, a divorce, a cat named Orla who was currently sleeping on the radiator.

  I looked at the radiator. It was cold. Orla was not there.

  I didn't feel panic. That was the strange part. I felt a kind of heavy, sinking recognition, like stepping off a curb you thought was higher than it was.

  I walked to the living room window. Outside, the city was humming. Cars moved along the street below. They moved smoothly, without the slight stutter of internal combustion. They were streams of color, red and white, flowing in obedient lanes. A pedestrian walked a dog. The dog's legs moved in a perfect, rhythmic scissor motion. *Left, right, left, right.* No variation. No sniffing of the ground.

  I pressed my hand against the glass. It felt like glass, but it didn't have the microscopic imperfections I expected. It was too smooth.

  The thought arrived fully formed, not as a deduction but as an intrusion. *It is easier to make a lie than the truth.*

  To build a universe, to build a sun, a planet, a biosphere, a history of billions of years, a city, a house, a body, a brain, and then a consciousness within that brain... that was hard. That was work. That required energy. That required time.

  But to make just the brain? To make just the consciousness, suspended in the void, and give it the *impression* of the sun, the planet, the history? To paint the scenery on the inside of a skull?

  That was easy. That was cheap.

  Statistically, the cheap thing happens more often. Vastly more often. For every real person who earned their memories through the slow grind of evolution, there were a million ghosts who woke up with the memories already installed.

  I looked at my hands. They were trembling. Were they trembling because I was afraid, or because the simulation of my nervous system was encountering a rendering error?

  "I am real," I said.

  The words hung in the air. They didn't dissipate. They just stayed there, vibrating, as if the air was too thick to let them go.

  I tried to summon Elena again. I needed the sharp edge of her. The way she snorted when she laughed too hard. The scar on her chin. I pushed for the scar. I saw it. It was there. But it felt like I was looking at a picture of a scar, not a scar I had kissed a thousand times. The emotional weight was missing. The gravity was gone.

  If I was a fluctuation, a random assembly of particles in a dying universe, then Elena was part of the fluctuation. The divorce was part of the fluctuation. The grief I had carried for five years was just chemical noise, arranged to look like sadness.

  Was the sadness real if the cause was fake?

  I sat on the couch. The fabric depressed under my weight, but it felt distant, like I was sitting on a memory of a couch.

  The light in the room was changing. Not the slow arc of the sun, but a dimming. A uniform lowering of the luminance, as if someone were turning down a dimmer switch on the universe.

  "If I realize it," I whispered, "does that make me real?"

  Descartes. *I think, therefore I am.*

  But a Boltzmann brain can think. It can think, *I am a Boltzmann brain.* In fact, it's more likely to think that, because that thought requires less context than the thought *I am a human in 2024.* To think you are human requires a belief in physics, history, society. To think you are a fluctuation requires only the immediate present and a statistical intuition.

  The intuition was the trap.

  I stood up and walked to the bookshelf. I pulled out a copy of *Great Expectations*. I opened it. The text was there. *My father's family name being Pirrip, and my Christian name Philip...*

  I read the next page. The words were shapes. They had no meaning. I looked back at the first page. The letters were shifting. *Pirrip* became *Prrrp*. *Philip* became *Phllp*.

  The details were economizing. Why render the text if I'm not going to read it? Why render the texture of the wood grain on the floor if I'm not looking at it?

  The periphery of my vision was graying out. Not going black, just... ceasing. There was no darkness, just an absence of data.

  I felt a surge of anger. It was hot and bright and felt more real than anything else so far. "No," I said. "I lived. I suffered. I loved."

  But the anger felt like a spike in voltage, not a reaction to a moral injury. It was a mechanism firing.

  I closed my eyes. I tried to find the core of me. The thing that was observing the grayness.

  *If I am a mistake,* I thought, *then this realization is also a mistake.*

  *If I am noise, then this thought is noise.*

  *If I am about to dissolve, then the fear of dissolution is just part of the dissolution.*

  There was no way out. There was no test I could perform. Any test I devised would be part of the fluctuation. If I pinched my arm and felt pain, the pain was generated. If I pinched my arm and felt nothing, the numbness was generated. I was trapped inside the argument.

  The room was half gone now. The window was a rectangle of static. The coffee mug on the table had lost its handle; it was just a blue cylinder.

  I sat back down. There was no point in running. Where would I run to? The hallway was already unraveling, the carpet pattern repeating in a simple loop.

  I thought about the void. The high-entropy equilibrium. The eternal, cold dark where particles drift forever. That was the baseline. That was the default. This moment, this room, this panic, this specific sadness about a woman named Elena who never existed... this was the anomaly.

  We are the bubbles in the boiling water. We are the brief froth on the surface of an infinite, still lake.

  The grayness was at my feet. It wasn't creeping; it was just that my feet were no longer being rendered. I looked down and saw nothing, but I still felt the pressure of the floor. Proprioception was holding on longer than vision.

  "Orla," I said.

  I tried to summon the cat. I needed to see her one more time, even if she was fake. I needed to see something imperfect. A matted fur ball. A cough.

  A shape formed in the corner of the room. White. Fuzzy.

  It didn't meow. It just sat there, a white blob labeled *Cat*.

  "It's okay," I told it. "It's okay."

  I wasn't sure who I was comforting. The cat? Or the universe, for having to produce this brief, conscious glitch?

  The light was very low now. The air was thin. Breathing felt like an option I could choose to stop taking.

  I realized something then, as the edges of my thoughts began to blur.

  If I am a Boltzmann brain, then I am the only thing that exists. There is no outside. There is no future. There is only this moment, stretching out as far as it can before the statistics reassert themselves.

  But this moment *is*.

  The pain of the realization is real because it is happening. The love for Elena is real because it is felt. Even if the past is a lie, the present experience of the lie is true.

  I am a lie that knows it is a lie. And in knowing it, I become something else.

  The grayness reached my chest. I couldn't feel my hands anymore. The book was gone. The coffee was gone.

  I had one second left. Maybe less.

  I closed my eyes, or I stopped simulating the concept of sight.

  "I was here," I said.

  The words didn't make a sound. They were just a configuration of particles, aligning for a fraction of a second before the thermal bath swallowed them whole.

  The thought of Elena faded. Not like a memory fading, but like a file being deleted. The data was gone.

  Then the thought of *I* faded.

  There was no darkness. There was no silence. Those are things that exist in a universe.

  There was just the equilibrium. The high entropy. The wait.

  Until, perhaps, in a trillion trillion years, the particles shuffled again.

  *My father's family name being Pirrip...*

  *Heat...*

  *Blue...*

  *...*
