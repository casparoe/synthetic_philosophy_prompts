  4.  **Drafting - Scene by Scene:**

      *   *Scene 1: Morning Routine.* Establish normalcy. Coffee, sunlight, the feeling of a history (childhood, job). But introduce subtle wrongness. The coffee tastes like "concept of coffee." The sunlight is too perfect.
