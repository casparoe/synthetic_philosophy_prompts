answer: |-
  The Monastery of the Eternal Gear sat atop the Needle, a spire of black rock piercing the cloud layer of the world below. Inside, the air smelled of ozone and old oil. The Great Clock did not tell time; it regulated the atmospheric mixers that kept the valley below breathable. To miss a cycle was to suffocate the thousands sleeping in the mist.

  Elara was the Keeper. She had spent forty years turning the calibration wheel, following the Rule of the Ancestors.

  The Rule was simple, written on a single slate: *Adjust the tension by the sum of the Cycle Number and the Stellar Index.*

  For forty years, the Cycle Numbers had been small. 1, 2, 3… up to 56. The Stellar Index had always been 5.
  Cycle 1: $1 + 5 = 6$ turns.
  Cycle 10: $10 + 5 = 15$ turns.
  Cycle 56: $56 + 5 = 61$ turns.

  Elara knew the rule. She didn't just know it intellectually; it was in her muscles. When she saw the numbers, her hand moved. It was a disposition, carved into her nervous system by decades of repetition. She *would* have added them. If you had asked her yesterday, she would have sworn that the meaning of "sum" was fixed by her past training and her internal understanding.

  Today was Cycle 57. The Stellar Index was still 5.

  Elara stood before the brass wheel. She calculated: $57 + 5 = 62$. She reached for the wheel to turn it sixty-two times clockwise.

  "Stop."

  The voice belonged to Tomas, the Junior Keeper. He stood in the shadows of the gear-train, holding a ledger.

  "The mixture will thin," Elara said, her hand hovering over the cold brass. "Move, Tomas."

  "You intend to turn it 62 times," Tomas said. "But the Rule says 'quum', not 'sum'."

  Elara blinked. "There is no 'quum'. There is only addition."

  "Is there?" Tomas stepped into the light. "Look at the logs. Every time you have applied the Rule before, the Cycle Number was less than 57. In all those cases, 'sum' and 'quum' yield the same result. 'Quum' is defined as addition for numbers less than 57, but for any number 57 or greater, the result is 5."

  Elara laughed, a sharp, nervous sound. "That's absurd. If the result was always 5 for large numbers, the valley would have choked years ago."

  "No," Tomas corrected gently. "Because you never *had* a large number before. You never tried 57. You never tried 100. You never tried 1,000. Your past behavior, Elara, is finite. You have turned the wheel exactly 1,946 times in your life. Every single one of those turns is compatible with the rule 'Add' and the rule 'Quum'. Nothing you did in the past distinguishes between them."

  "I know what I meant!" Elara insisted. She tapped her temple. "I meant addition. I can introspect. I feel the meaning."

  "You feel a disposition," Tomas said. "You feel that you *would* have added. But how do you know you wouldn't have quadded? Maybe your brain is a machine that malfunctions at 57. Maybe the Ancestors wrote 'Sum' but meant 'Quum' until the Great Conjunction. There is no fact about your past, no fact about your brain state, that proves you meant one and not the other. The finite past underdetermines the infinite future."

  Elara gripped the wheel. The metal was cold. She tried to summon the feeling of certainty, the normative force that told her she *ought* to turn it 62 times. But Tomas's words ate at the certainty. If meaning is just a disposition, then a glitch in the disposition is just another disposition. If meaning is a mental picture, a picture can be interpreted in multiple ways.

  "If I turn it 5 times," Elara whispered, "the mixers fail. People die."

  "If you turn it 62 times," Tomas countered, "and the Rule was actually 'Quum', then you have violated the Ancestors' law. You have broken the Covenant. The Clock might stop anyway."

  They stood in the stale silence of the engine room. The hum of the turbines was slowing. The air was getting heavy.

  This was the precipice. Elara realized Tomas was right about the isolation. Alone, in her own mind, there was no bedrock. She could search her memories of her teacher, the Old Keeper, but she could only remember him saying, "Add the numbers." She could not remember him testing 57. She could not remember him ruling out 'Quum'. The ghost of the teacher was as silent as the dead.

  "We need the Chapter," Elara said.

  They descended to the Hall of Gears. The Order of the Keepers, thirty men and women in grease-stained robes, gathered in a circle. The air was thick with panic; the lights were dimming as the power waned.

  Elara stood before them. "The Rule is indeterminate. My past does not fix the meaning. Tomas claims the result should be 5. I claim 62. There is no fact of the matter in the slate, in the logs, or in my head."

  A murmur ran through the Chapter. They were practical people. They knew the philosophy of the Needle: *The Gear turns because we turn it.*

  Abbot Halloway stood. He was old, his hands shaking. "So, there is no truth to be found?"

  "There is no truth *waiting* to be found," Elara said. "Not about the meaning itself. The meaning is not a ghost in the machine."

  "Then how do we turn the wheel?" a young novice cried. "If there is no right answer, why not guess?"

  "Because we must agree," Elara said, the realization settling over her like a heavy coat. "If I turn it 62, and you all expect 5, I am wrong. Not because the universe says I am wrong, but because I am out of step with the community that sustains the language of the Rule. Meaning is not private. It is public."

  Halloway looked at Tomas, then at Elara. "If we endorse 5, then 'Sum' meant 'Quum'. If we endorse 62, then 'Sum' meant 'Add'. We are not discovering the meaning. We are legislating it."

  "The valley breathes because we agree on how the gears mesh," Elara said. "If we fracture, the Clock stops. Not because of the math, but because of the trust."

  Halloway raised his hand. "All who believe we must continue the pattern of addition as we have always *felt* it, raise your hand."

  Elara raised hers. She looked around. One by one, the Keepers raised their hands. They did not look like they had discovered a hidden manuscript. They looked like they were making a choice. They were imposing a norm.

  Tomas kept his hands at his sides. He looked lonely. "You are ignoring the logical possibility," he said.

  "We are ignoring nothing," Halloway said. "We are deciding what counts as 'ignoring'. You are now the one deviating from the practice. You are speaking a private language, Tomas. And private languages cannot run a Clock."

  Tomas looked at the floor. He understood. He could claim until he died that he meant 'Quum', but without the community to check him, to correct him, to say "No, that's not how we do it," his rule was noise. It had no traction.

  "Turn the wheel, Elara," Halloway ordered.

  Elara returned to the engine room. The hum was now a wheeze. The lights flickered.

  She placed her hands on the brass. She did not feel the metaphysical certainty she had felt an hour ago. She knew now that her feeling was just a disposition, vulnerable to skepticism. But she also knew that the *rightness* of the turn came from the thirty people downstairs who were willing to stand by her turn, to correct her if she slipped, to call her "Keeper" only if she followed *their* path.

  She turned the wheel.
  *One. Two. Three…*
  Up to 62.

  She engaged the latch.

  For a terrifying minute, nothing happened. Then, the great flywheel groaned and picked up speed. The turbines roared back to life. Fresh air hissed through the vents.

  Elara leaned against the console, sweating. She had not solved the paradox. The skeptical problem remained: she still could not prove, from her own isolated past, that 62 was the *true* continuation.

  But as the air filled her lungs, she understood the solution. The correctness of "62" was not a fact about Elara. It was a fact about the Order. It was a social norm, enforced by the willingness of the community to accept her performance as satisfying the rule.

  Tomas appeared in the doorway. He watched the spinning gears.

  "It worked," he said quietly.

  "Because we made it work," Elara replied.

  "Does that mean I was wrong?"

  Elara looked at him. "It means you were alone. And out here, on the Needle, being alone is the only error that kills."

  She handed him the logbook. "Record the adjustment. 62 turns."

  Tomas took the book. He hesitated, pen hovering. For a second, the indeterminacy hung in the air again—the possibility that he could write '5', that he could start a new sect, a new practice.

  Then he wrote '62'.

  He handed the book back. The rule was fixed again, not by the past, but by the future they had just agreed to build together.
