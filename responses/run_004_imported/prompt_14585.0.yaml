      *   *The Risk-Weighted Position (Buchak):* Maximize $\sum r(p_i) \cdot v_i$ where $r$ is a risk function (concave for risk-averse). Justification: Captures intuitive risk aversion without needing diminishing marginal utility of the *outcome* itself. Acknowledges that agents care about the *distribution* of outcomes, not just the mean.
      *   *The "One-Shot" Argument:* Law of Large Numbers doesn't apply to a small fund making a few grants a year. If you go bust on the high-risk bet, you can't try again.
