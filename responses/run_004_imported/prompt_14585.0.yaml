answer: |-
  **MEMORANDUM**

  **TO:** Grant Allocation Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Framework for Current Allocation and Standing Risk Policy

  ### Executive Summary

  This memo addresses the current impasse regarding the allocation between Proposal A (Global Health) and Proposal B (Biosecurity), and establishes a standing decision rule for future rounds.

  **Recommendation:**
  1.  **Current Round:** Allocate **60% to Proposal B** and **40% to Proposal A**. This hedges against model ambiguity in B while capturing the majority of its upside.
  2.  **Standing Rule:** Adopt **Risk-Weighted Expected Utility (RWEU)** as our formal decision framework, with a pre-commitment to a specific risk-aversion parameter. This legitimizes our intuitive risk attitudes without sacrificing dynamic consistency.

  ### 1. The Core Disagreement

  The committee is stalled between two decision-theoretic positions:

  *   **Expected Utility (EU) Maximization:** Relies on the **Independence Axiom**. It argues that if B has higher expected value (EV), we must fund B. Deviating invites inconsistency (money pumps) and violates the moral linearity of impact (saving two lives is twice as good as saving one).
  *   **Risk-Weighted Preferences:** Relies on the observation that our revealed preferences violate Independence (Allais-type cases). It argues that for a "one-shot" fund, the Law of Large Numbers does not apply, and we are rationally permitted to weight the *distribution* of outcomes, not just the mean.

  ### 2. Analysis of the Independence Axiom

  The argument for Independence is strongest in two contexts: **iterated choices** and **moral aggregation**.

  *   **Iterated Choices:** If we made 1,000 grants a year, EV maximization guarantees the best aggregate outcome. However, we make ~5–10 grants annually. We are not an insurance company; we will not see the long-run convergence. The "repeated game" defense of EV does not hold for us.
  *   **Moral Linearity:** The EV proponent argues that impact is linear. However, this fund is a *sub-agent* of the broader EA movement. If the broader movement is already over-invested in speculative biosecurity, our marginal EV for B drops. If we view our role as providing a stable baseline of impact *plus* some upside, linearity applies to the *portfolio*, not necessarily individual grants.

  **The Consistency Objection:**
  The strongest argument against violating Independence is the **money-pump argument** (dynamic inconsistency). If we violate Independence, we can be exploited in sequential trades.
  *   *Rebuttal:* This applies only if choices are sequential and tradable. Our grants are illiquid and largely simultaneous. Furthermore, as Lara Buchak argues in *Risk and Rationality*, an agent can maintain consistency under RWEU through **Resolute Choice**—pre-committing to a risk function and sticking to it, rather than re-evaluating risk attitudes at every node.

  ### 3. Proposed Framework: Risk-Weighted Expected Utility (RWEU)

  We should formally adopt RWEU. This framework retains the structure of EU but introduces a risk function, $r(p)$, which transforms probabilities before calculating value.

  $$ RWEU = \sum [r(p_i) \cdot u(outcome_i)] $$

  *   **Why this resolves the impasse:** It allows us to codify our risk aversion without calling it "irrational." It acknowledges that we care about the *security* of the outcome, not just the expectation.
  *   **Addressing Scope Insensitivity:** To prevent the "safety bias" from becoming extreme, we must fix our risk function $r$ in advance (e.g., $r(p) = p^2$ or similar). This prevents us from becoming *more* risk-averse when stakes are higher, which is the classic scope-insensitivity trap.

  ### 4. Recommendation for Current Round (A vs. B)

  Even under RWEU, if B's risk-weighted value exceeds A's, we should theoretically fund 100% of B. I recommend a **60/40 split** for a distinct reason: **Ambiguity Aversion.**

  *   **Risk vs. Ambiguity:** Proposal B's model cites a "70% chance of failure." This is a *risk* (known probability). However, given the speculative nature of biosecurity interventions, this probability is likely an estimate with high error bars. This is *ambiguity* (unknown probability).
  *   **Justification:** It is rational to be ambiguity-averse even if one is risk-neutral. Since the EV model for B is fragile (small changes in the probability estimate drastically alter the EV), a split allocation acts as a hedge against **model error**, not just outcome variance.
  *   **Allocation:** 60% to B captures the upside if the model is roughly correct. 40% to A ensures we secure a baseline of verified impact if the model for B is overly optimistic.

  ### 5. Standing Rule for Future Rounds

  To prevent this debate from recurring and to ensure dynamic consistency (avoiding the money pump), the committee should adopt the following protocol:

  1.  **Adopt RWEU:** We explicitly reject the Independence Axiom for fund-level decisions, acknowledging our size prevents long-run averaging.
  2.  **Fix the Risk Parameter:** We will agree on a risk-function parameter (e.g., a specific coefficient for exponential discounting of low-probability events) during our annual strategy retreat. This parameter applies to all grants.
  3.  **Ambiguity Discount:** For proposals with high model uncertainty (like B), we apply an explicit "ambiguity discount" to the probability inputs before running the RWEU model. This formalizes the intuition that drove the split this round.
  4.  **Portfolio Check:** Before finalizing, we review the *aggregate* portfolio. If we have already funded three speculative biosecurity projects, the marginal RWEU of a fourth drops due to correlation risk, even if its standalone RWEU is high.

  ### 6. Conclusion

  The EV-maximization argument is theoretically robust for large, iterated portfolios but misaligned with our operational reality. The Allais-based objection is intuitively correct but requires a formal structure to avoid inconsistency.

  By adopting **RWEU with a fixed risk parameter**, we validate the committee's risk attitudes while maintaining the consistency required for responsible stewardship. For this round, the **60/40 split** is justified not by a failure of decision theory, but by the high ambiguity inherent in the speculative model.

  **Action Required:** Vote on the 60/40 allocation and the adoption of RWEU as the standing framework.
