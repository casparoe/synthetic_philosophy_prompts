answer: |-
  **Setting:** *A dimly lit faculty lounge, late evening. Two empty coffee cups sit between **Elena** (a Fregean logicist) and **Marcus** (an Armstrongian naturalist). A whiteboard behind them is covered in diagrams of facts, functions, and arrows pointing nowhere.*

  **Elena:** You keep circling back to the "tie," Marcus. But that's exactly where Bradley traps you. If you posit a relation to unite the particular and the universal, you immediately require a further relation to unite that relation to the terms. It's the regress. It eats the world.

  **Marcus:** I know the regress, Elena. *Appearance and Reality*, 1893. I've read it. But your solution doesn't stop the eating; it just tells the monster it isn't hungry.

  **Elena:** It stops it by denying the premise that generates it. Bradley assumes all constituents are on the same ontological footing—objects all the way down. I deny that. The concept is *unsaturated*. It has a gap. The object is *saturated*. When you put the object in the gap, you don't need a glue. The fit is intrinsic to the nature of the concept. The unity is logical, not mechanical.

  **Marcus:** "Unsaturated." It's a brilliant metaphor, I'll grant you. But is it metaphysics, or is it grammar? You're projecting the structure of the predicate '$F(\xi)$' onto the world. You say the concept *needs* the object. But how? If the concept is an abstract entity, and the object is... well, an object, what constitutes this "needing"?

  **Elena:** It's not a causal need. It's a categorial one. You can't have a function without an argument. The incompleteness *is* the hook.

  **Marcus:** But who drives the hook in? If I say, "The hook drives itself," I'm mystifying the issue. You've taken the relation—the copula, the instantiation—and you've hidden it inside the concept. You say, "No extra relation is needed." But the "unsaturatedness" *is* a relational property. It's a property of *pointing toward* an object. So I ask again: what secures the pointing? If the concept points and the object sits there, what makes them *meet*? You haven't eliminated the brute unity, Elena. You've just relocated it from the copula to the very nature of the function. You're calling it "unsaturatedness" to avoid calling it a "relation," but the explanatory burden is identical.

  **Elena:** That's unfair. A relation is a third thing standing between two others. Unsaturatedness is a modification of the thing itself. It's the difference between a brick and a mortarless arch. The keystone holds because of its shape, not because of extra cement.

  **Marcus:** But the arch still rests on gravity. In your ontology, what is the metaphysical gravity? You assert that $F$ and $a$ form a unity. If I hand you the concept *Wisdom* and the particular *Socrates*, and I lay them on the table, they don't unify. *Socrates is wise* is not the same as *Socrates, Wisdom*. You claim the former is the natural state of the concept. But that implies the concept has a power to combine. Is that power a constituent? If yes, regress. If no, then you are asserting a brute fact of combination and labeling it "logic."

  **Elena:** Fine. Let's turn the table. You prefer the State of Affairs. The Fact. *a*'s being *F*. You say this is ontologically fundamental. The particulars and universals are merely abstractions *from* the fact.

  **Marcus:** Precisely. The world is a world of facts, not a world of things that then get fact-ish. The unity is prior to the constituents. There is no "tying" because the tie is internal to the existence of the fact. The fact is a non-mereological composition. It's not a heap; it's a molecule.

  **Elena:** "Non-mereological composition." There it is. The magic words. You're telling me that $a$ and $F$ are in the fact, but they aren't parts in the standard sense. They are "constituents." But if they are constituents, they are distinguishable. If they are distinguishable, we can ask what distinguishes the fact *a's being F* from the mere list *<a, F>*.

  **Marcus:** The existence of the fact distinguishes them.

  **Elena:** That's circular. The fact exists *because* they are united. You can't use the existence of the whole to explain the unity of the parts if the whole is nothing *over and above* the parts being united. You've posited a primitive nexus. Armstrong calls it the "instantiation nexus." But tell me, Marcus: is this nexus an entity?

  **Marcus:** It's not an entity. It's the way entities are.

  **Elena:** Which sounds suspiciously like "It's a relation that isn't a relation." You accuse me of hiding the copula in the concept. I accuse you of hiding the copula in the "non-mereological." You say the fact is fundamental to stop the regress. But if I ask, "Why is this fact a unity and not a heap?" your answer is, "Because it is a fact." That's not an explanation; it's a termination of inquiry. You haven't solved Bradley; you've just declared the regress vicious only when *you* say so. You've relocated the brute unity onto the Fact itself.

  **Marcus:** I admit I posit a primitive. I own that. But my primitive is concrete. Yours is abstract. The regress arises because we try to construct the world from the bottom up—objects plus properties plus relations. I'm saying the bottom *is* the state of affairs. The unity isn't something added; it's the mode of existence.

  **Elena:** But does that secure the *proposition*? We are trying to explain truth-bearers. If the fact is a concrete hunk of reality, how does it map to the thought? If I think "Socrates is wise," and I grasp the unsaturated concept, I understand the unity because I understand the grammar of thought. If I grasp your "fact," I am asked to intuit a metaphysical atom that somehow contains distinction without separation. It's obscure.

  **Marcus:** It's obscure because reality is not a sentence, Elena. You're trying to save the unity of the proposition by making the world linguistic. I'm trying to save the unity of the world by making propositions derivative. Look, let's be honest. Both of us are hitting a wall.

  **Elena:** Agreed.

  **Marcus:** You need the "fit" to be brute. I need the "nexus" to be brute. The question isn't who eliminated the brute fact. It's who places it more honestly.

  **Elena:** I place it in the logical category. It is brute that functions apply to arguments. But that is a condition of *sense*. Without it, we cannot speak.

  **Marcus:** And I place it in the ontological category. It is brute that particulars instantiate universals. Without it, there is no *being*.

  **Elena:** But here is my worry, Marcus. If the nexus is internal to the fact, how do we account for falsehood? If *a's being F* is a fundamental unity, what is *a's not being F*? A non-existent fact?

  **Marcus:** A non-existent state of affairs. It has constituents, but the nexus doesn't obtain.

  **Elena:** Ah! So the nexus *can* fail to obtain? Then the nexus is distinct from the constituents! If the constituents can exist without the nexus obtaining, then we are back to the heap. We have *a*, we have *F*, and we have the *possibility* of the nexus. What unites *a* and *F* to the *possibility* of the nexus? Bradley smiles from his grave.

  **Marcus:** [Pauses, tapping his pen] You're pushing the regress into modal space. Fine. But if I accept your view, Elena: The concept is unsaturated. Does it *always* seek an object? If so, does the concept *Wisdom* exist unattached?

  **Elena:** In a realm of sense, yes.

  **Marcus:** Then it is an entity waiting for another entity. And we are back to the two bricks waiting for gravity. You say the shape guarantees the fit. I say the shape is just another property. Why does *this* shape fit *that* object? If you say "It just does," you have your own brute nexus. You call it "satisfaction." I call it "instantiation."

  **Elena:** [Sighs] So we are both foundationalists about unity.

  **Marcus:** It seems we must be. Bradley proved that if you treat unity as a *component*, you lose it. So unity must be a *mode*. For you, it's the mode of predication. For me, it's the mode of existence.

  **Elena:** But is "mode" just a euphemism for "mystery"?

  **Marcus:** Perhaps. But a necessary one. If we demand an explanation for the explanation, we get the regress. We have to stop somewhere. I'd rather stop at the concrete fact. It feels more... grounded.

  **Elena:** And I'd rather stop at the logical function. It feels more... transparent. But I concede this: if "unsaturatedness" is just a name for the inability to analyze the combination further, then I am guilty of relocating the brute unity. I am saying the mystery lies in the nature of the concept rather than the relation.

  **Marcus:** And I concede that if "non-mereological composition" is just a name for the inability to analyze the fact into independent parts, I am locating the mystery in the nature of the fact.

  **Elena:** So Bradley wins?

  **Marcus:** Bradley wins if we demand that every unity be constituted by further unities. But if we accept that some unities are primitive...

  **Elena:** ...then the regress stops not because we solved it, but because we refused to play the game.

  **Marcus:** Exactly. The question is no longer "How do we stop the regress?" It's "Which primitive unity is more tolerable?" The linguistic hook or the metaphysical atom?

  **Elena:** [Picks up her coffee cup] To the brute fact, then.

  **Marcus:** [Clinks his cup against hers] May it be unified.
