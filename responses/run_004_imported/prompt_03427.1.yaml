      *   **Gear 1: The Press as the Machine of Abstraction.**
          *   *Idea:* How does a newspaper turn individuals into a "Public"?
          *   *Mechanism:* Simultaneity without community. Everyone reads the same thing at the same time, but alone.
          *   *Result:* The "Public" is a ghost. It has no face, no name, no responsibility. It's an abstract monster.
          *   *Novel Application:* Show the character realizing the critics aren't people; they are a voice without a throat.

      *   **Gear 2: Reflection and the Loss of Action.**
