answer: |-
  **Setting:** *Outside the seminar room, late afternoon. Elena is packing her bag; Marcus is lingering by the whiteboard, still holding a marker.*

  **Elena:** You're not actually going to stand there and tell me the Pasadena game doesn't break Expected Value theory. After that truncation argument, I thought the room was going to implode.

  **Marcus:** I'm standing here telling you that Expected Value theory is a tool for evaluating acts defined over a probability space. If the integral doesn't converge absolutely, the expectation is undefined. That's not a bug; it's a feature. It tells us this specific act falls outside the domain of the theory.

  **Elena:** "Outside the domain" is just a polite way of saying "the theory fails." Look, the rearrangement objection is the parlor trick. Anyone who knows calculus knows conditionally convergent series can be reordered to sum to anything. But Hájek and Nover's real dagger is the truncation sequence. It's not about reordering the terms mathematically; it's about how we approximate the game physically.

  **Marcus:** Approximations matter, yes.

  **Elena:** They matter too much. If I truncate the game by the number of tosses—stop after $N$ tosses, pay off or not—the expected value converges to $\ln 2$. That looks stable. But if I truncate by payoff magnitude—grouping all outcomes where I win at least $X$ dollars versus those where I lose at least $Y$—I get a different sequence of partial sums. I can construct a sequence of finite sub-games, each one a "slice" of the Pasadena game, that converges to positive infinity. I can construct another that converges to negative infinity. All of these truncations are equally "natural" descriptions of finite approximations of the same infinite prospect. If the value of the game depends on *how* I choose to approximate it, then the game has no objective value. And if it has no objective value, EV maximization can't tell me whether to play it.

  **Marcus:** But why are those other truncations decision-theoretically legitimate? You're conflating mathematical summation with the structure of the decision problem. The Pasadena game is defined by a specific stochastic process: a coin tossed until heads. The sigma-algebra is generated by the outcomes of those tosses. The only truncation that respects the causal and informational structure of the act is truncating by the number of trials.

  **Elena:** Why? Because it's convenient for the math?

  **Marcus:** Because it corresponds to feasible acts. "Play the game for $N$ tosses and then stop" is something an agent can actually decide to do. "Play the game until the cumulative payoff exceeds $X$" is a different stopping rule. That's not a truncation of the *same* game; that's a *different* game with a different stopping time. When Hájek and Nover suggest truncating by payoff magnitude, they are implicitly changing the stopping rule. You can't claim the expectation is indeterminate just because you're evaluating different acts and finding they have different values.

  **Elena:** That's a dodge, Marcus. The Pasadena game is an idealization. We use infinite series to model unbounded prospects all the time. The point of the truncation argument is that the infinite limit is sensitive to the *path* taken to get there. In physics, if a limit depends on the path, we say the function is ill-defined at that point. Decision theory should do the same. If I offer you the Pasadena game, and I offer you a modified St. Petersburg game that dominates it in some states but not others, EV theory is silent. It can't rank them. A normative theory of rational choice that goes silent on clear-cut preference scenarios isn't just "limited"; it's broken.

  **Marcus:** It's not silent; it's precise. It says: "You cannot represent this preference using a real-valued expectation." That forces you to use other principles. Stochastic dominance, for instance.

  **Elena:** Dominance fails here too! That's the next step in the paper. Because the series isn't absolutely convergent, you can pair the states of the Pasadena game with the states of a constant-payoff game in ways that make Pasadena dominate, or be dominated, depending on the bijection between state spaces. If you can't sum the values, and you can't rely on state-by-state dominance because the state space is countably infinite and the utilities are unbounded, what is left?

  **Marcus:** You're assuming rationality requires a complete ordering of all possible acts. I don't accept that. Rationality requires consistency *where comparisons are defined*. If two acts have undefined expectations and no dominance relation, it is not irrational to be indifferent, and it is not irrational to prefer one. The theory doesn't need to replace EV; we just need to accept that rational permissibility is sometimes broader than EV maximization.

  **Elena:** So your defense of Expected Value theory is that we should lower our standards for what counts as a rational choice?

  **Marcus:** My defense is that we shouldn't inflate the standards of what the theory promises. EV theory is derived from axioms—VNM, or Savage. Those axioms imply countable additivity under certain conditions. But the Pasadena game violates the boundedness conditions required for the representation theorem to hold. You're trying to drive a car off a cliff and blaming the engine when it stops working. The engine is fine; you're just off the road.

  **Elena:** But we *put* the car there! Economists and decision theorists use countable additivity. We talk about infinite horizons. We use unbounded utility functions to model greed or risk-seeking. If the formalism allows us to write down the Pasadena game—which it does, because the probability space is valid and the utility function is permissible—then the theory is obligated to evaluate it. You can't say "The axioms allow me to construct this problem, but forbid me from solving it." That's inconsistent.

  **Marcus:** The axioms allow you to construct the act, but the representation theorem only guarantees an EV representation if the integral exists. If it doesn't, the theorem doesn't apply. It's that simple. You want a "real replacement"? Fine. Use relative expectation theory. Or restrict utility functions to be bounded. But don't claim standard EV theory is *false* because it doesn't handle cases it was never designed to handle.

  **Elena:** It was designed to handle risky choice. This *is* risky choice. The problem is that EV theory relies on the Archimedean property and absolute convergence to guarantee stability. The Pasadena game shows that without absolute convergence, the "value" of a gamble isn't an intrinsic property of the gamble; it's an artifact of the summation order. If value isn't intrinsic, maximization is meaningless.

  **Marcus:** Value *is* intrinsic, provided the integral is well-defined. The Pasadena game is a pathological case, like dividing by zero. Does the fact that $1/0$ is undefined mean arithmetic is broken?

  **Elena:** Arithmetic doesn't claim to be a complete guide to physical quantity. Decision theory *does* claim to be a guide to rational choice. If I walk into a casino and they offer me the Pasadena game for a \$5 entry fee, EV theory should tell me whether to buy the ticket. If it says "undefined," it's useless. And if I say, "Well, the truncation by tosses suggests $\ln 2$, which is about 0.69, so I shouldn't pay \$5," you'll tell me that's arbitrary. But if I *must* choose, I *will* use some heuristic. EV theory refuses to acknowledge that heuristic, leaving a gap between the normative model and the agent's necessity to act.

  **Marcus:** And if you use the truncation by tosses, you're implicitly assuming a specific stopping rule. If the casino allows you to play forever, but you know you'll die, then you have a finite horizon. Then the series is finite. Then EV works perfectly. The paradox only exists if you insist on the actual infinite.

  **Elena:** But the paradox is about the *principle*. If the principle fails at the limit, it casts doubt on the finite cases near the limit. If I have a game that goes to $N = 10^{100}$, the EV is huge. If I go to $N = 10^{100} + 1$, the EV might drop significantly because of the alternating sign. The instability of the infinite case reveals the fragility of the finite case when utilities get large. It shows that EV is not robust.

  **Marcus:** Robustness isn't the only virtue. Consistency is. If we abandon EV because of Pasadena, what do we put in its place? Anything you propose will either collapse back into EV for normal cases or violate dominance.

  **Elena:** Maybe violating dominance is what's required for infinite cases. Or maybe we admit that "Rationality" isn't a single function mapping acts to values. But I won't accept the "it's just undefined" defense. That's surrender. The truncation argument proves that the undefinedness isn't a mathematical singularity; it's a conceptual ambiguity in how we define the value of an infinite prospect. Decision theory needs to resolve that ambiguity, not hide behind it.

  **Marcus:** And I won't accept that ambiguity exists. The probability measure defines the weight of each state. The order of summation is fixed by the index of the probability space. Any other order is a distortion. The ambiguity is in your interpretation, not the theory.

  **Elena:** Then the theory is blind to the structure of the payoff.

  **Marcus:** No. The theory sees the payoff clearly. It just refuses to lie about the sum.

  **Elena:** *Sighs.* We're going to be arguing about this until the next seminar.

  **Marcus:** Count on it. Just don't expect me to pay \$5 to play.

  **Elena:** Even if the limit is $\ln 2$?

  **Marcus:** Especially then.
