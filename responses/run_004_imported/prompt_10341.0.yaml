  Let's refine the truncation argument.
  Elena: Truncating by $N$ (tosses) gives $\ln 2$. Truncating by grouping positive terms then negative terms gives $+\infty$. Truncating by payoff magnitude (which correlates with $n$ but changes the grouping logic if we consider utility) creates issues. Hájek/Nover say *any* sequence of finite gambles approximating the infinite one is fair game.
  Marcus: No. An infinite gamble is the limit of a specific sequence of finite gambles *defined by the experiment*. The experiment is "toss until heads." The finite approximations are "stop after $N$ tosses regardless." Other truncations don't correspond to feasible sub-games.

  Okay, ready to write.

