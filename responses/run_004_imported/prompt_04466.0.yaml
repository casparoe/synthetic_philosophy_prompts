          *   *Conclusion:* Cluelessness might still weigh heavier on longtermism, but not equally.
      *   **Implication 2: Imprecise Probabilities & Maximality.** Explain that if EV is undefined, we can't maximize. We must use decision rules for uncertainty (e.g., Maxmin, Interval Dominance).
          *   *Application:* Does AI safety dominate even under wide intervals? If the lower bound of "future is good" is positive, risk reduction is still valuable.
      *   **Implication 3: Robustness over Precision.** This is the practical takeaway. Don't try to calculate the EV of 23rd-century politics. Look for interventions that are good under many models.
          *   *GiveWell:* Robustly good for *current* welfare.
          *   *AI Safety:* Robustly good for *continuing* the project of civilization (assuming future > 0).
      *   **Implication 4: Worldview Diversification (The Strongest Recommendation).** This directly answers the budget split. Since we are fundamentally uncertain about the *moral weight* of the future vs. present (and cluelessness exacerbates this), splitting the portfolio is rational. It's not a compromise; it's a hedge against moral/epistemic uncertainty.
      *   **Implication 5: Focus on "Control" and "Feedback Loops".** Neartermist causes have feedback. Longtermist causes don't. Cluelessness suggests favoring things where you can learn if you were wrong. This might nudge toward neartermism *or* towards longtermist work with milestones (e.g., policy wins vs. abstract research).
      *   **Synthesis/Recommendation:** How to actually divide the budget.
          *   Don't abandon EV, but widen the intervals.
