answer: |-
  This is one of the sharpest readings of *On Liberty* I've encountered in a long time. You have put your finger on the exact spot where Mill's system strains against its own boundaries. The tension you're identifying—between the absolute prohibition on paternalism and the prohibition on voluntary slavery—is the "original sin" of liberal theory.

  You are asking two distinct but intertwined questions: one about the **logical boundary** of autonomy (Q1), and one about the **integrity of Mill's project** (Q2). Let's tackle them in order, because the answer to the second depends on how we resolve the first.

  ### 1. Drawing the Line: Destroying Freedom vs. Making a Bad Choice

  You ask if there is a non-question-begging way to distinguish "stopping someone from destroying future freedom" from "stopping someone from making a bad choice."

  The standard charitable defense of Mill relies on the distinction between **welfare** and **agency**.

  Mill's anti-paternalism is primarily concerned with *welfare paternalism*: the state cannot stop you from drinking, gambling, or marrying poorly because the state claims to know what is *good for you* better than you do. Mill's justification for liberty is epistemic: you are the best judge of your own desires and interests.

  However, the slavery case shifts the ground from *interests* to *the precondition of having interests at all*.

  **The "Presumption of Competence" Argument**
  Mill argues that we respect voluntary choices because they are evidence that the choice serves the agent's good. But this evidence only holds if the agent remains an agent.
  *   **Bad Choice:** I drink poison. I lose my life, but until the moment of death, I was the one choosing. The state stopping me assumes it knows my life is more valuable than my desire to die.
  *   **Slavery Contract:** I sign away my agency. I am no longer the one choosing. By validating the contract, the state is not respecting my choice; it is respecting the choice of my *master* for all future time-steps.

  The non-question-begging line, then, is **irreversibility of the capacity to choose.**
  If I make a bad choice (drink poison), I suffer the consequences, but the *mechanism* of liberty (my ability to choose) remains intact until the end. If I sell myself into slavery, I dismantle the mechanism itself. Mill isn't saying "Slavery is bad for you" (welfare); he is saying "Slavery removes the 'you' that liberty is supposed to protect" (constitutive).

  **Does the logic stop at the extreme?**
  You asked if this only works because slavery is total. This is where Mill's claim that the reasoning has "far wider application" becomes dangerous (or insightful, depending on your view).

  If the principle is "you cannot irreversibly alienate your future agency," then it applies to more than just chattel slavery. It potentially applies to:
  *   **Irrevocable Power of Attorney:** Giving someone total control over your finances with no recourse.
  *   **Permanent Exile:** Renouncing citizenship with no right of return.
  *   **Selling Organs:** If selling a kidney compromises your future health agency significantly.

  However, Mill *does* allow for binding contracts (marriage, employment). Why are those okay? Because they are **revocable at a cost**, not revocable *in principle*. In a liberal society, you can breach an employment contract (paying damages) or divorce (legal process). You cannot "breach" slavery; the contract *is* the removal of your standing to breach.

  So, the line is: **Can you exit the arrangement?**
  If the answer is "No, because you sold the right to exit," Mill says the state must intervene. This isn't protecting you from a *bad outcome*; it's protecting the *system of rights* from consuming itself.

  **The Nudge Theory Connection**
  You are absolutely right that this is the same rhetorical move Thaler and Sunstein make. "We aren't restricting your choice; we are protecting Future You from Past You's cognitive biases."
  *   **Mill:** "We aren't restricting your freedom; we are protecting Future Agent from Past Agent's alienation."
  *   **Thaler/Sunstein:** "We aren't restricting your freedom; we are protecting Future Welfare from Past Bias."

  The difference is that Mill is worried about the *status of the agent*, while Nudge theorists are worried about the *quality of the outcome*. But structurally? Yes, it is the same move. It is **meta-paternalism**. It says, "Your first-order preference (to be a slave / to not save) is overridden by a second-order principle (you must remain an agent / you should be rich)."

  ### 2. Coherent Extension or a Fudge?

  Is Mill fudging it? The honest answer is: **Yes, but it might be a necessary fudge.**

  **The Case for "Fudge"**
  Mill defines liberty negatively (freedom from interference). But to ban slavery contracts, he must introduce a positive conception of liberty (freedom *as* autonomy/capacity).
  When he says, "The principle of freedom cannot require that he should be free not to be free," he is engaging in a definitional stipulation. He is essentially defining "freedom" in a way that excludes the choice to abandon it.
  A strict libertarian (like Nozick later) would argue this *is* paternalism. If I own myself, I own the right to transfer that ownership. To say I *can't* is to say the state owns me, not myself. Mill is smuggling in a value judgment: "Being free is objectively better than being a slave, even if you consent otherwise." That violates his own "own good is not sufficient warrant" rule.

  **The Case for "Coherent Extension"**
  However, there is a stronger reading: **Liberalism is not self-immolating.**
  The Harm Principle is a rule for a society of free agents. If the society allows the creation of non-agents (slaves), it undermines the moral foundation of the society itself.
  *   Mill isn't protecting the *individual* from a bad choice; he is protecting the *principle* from a logical contradiction.
  *   If the state enforces a slavery contract, the state becomes an enforcer of domination. The state is now harming the slave (by coercing them to stay) based on a past consent that is no longer operative (because they can no longer consent).

  In this view, it's not paternalism because the state isn't acting for the slave's *good*; it's acting to maintain the *juridical status* required for rights to exist. You cannot have a right to extinguish all rights, because once extinguished, there is no one left to hold the right.

  **The "Rationalist" Angle**
  Since you mentioned the rationalist sphere: Think of this as a **Ulysses Contract** problem.
  Ulysses ties himself to the mast. He restricts his future freedom to achieve a goal. Mill accepts some Ulysses contracts (marriage, joining the army). He rejects the "Total Ulysses Contract" (slavery).
  Why? Because a Ulysses contract requires a mechanism to *untie* yourself if the conditions change (e.g., the Sirens turn out to be harmless). Slavery removes the mechanism.
  Mill's "fudge" is essentially saying: **"You can pre-commit, but you cannot pre-commit to never being allowed to change your mind."**
  This is a coherent boundary, but it requires the state to judge which commitments are "total" and which are "partial." That requires state interference in contracts, which Mill generally wants to minimize.

  ### Summary

  1.  **Is there a non-question-begging line?**
      Yes, but it rests on a specific definition of liberty. The line is **revocability**. You can make bad choices, and you can make binding commitments, but you cannot make a commitment that destroys your legal/moral capacity to revoke commitments. This distinguishes it from standard paternalism (which overrides choices for *welfare*) by framing it as protecting the *preconditions of agency*. However, this does open the door to the exact "soft paternalism" rhetoric you noticed in Thaler/Sunstein.

  2.  **Is it a fudge?**
      It is a **foundational limit**, not necessarily a logical error. Mill realizes that a doctrine of absolute non-interference allows for the creation of situations where non-interference becomes morally impossible (i.e., leaving a slave in bondage). He has to break his "no paternalism" rule once to prevent the rule from destroying the conditions of its own application.
      *   **Charitable view:** It's the "Paradox of Tolerance" applied to contracts. A liberal society cannot tolerate the contract that ends liberalism for that individual.
      *   **Cynical view:** Mill realized that Victorian society would never accept a philosophy that allowed people to sell themselves into bondage, so he carved out an exception to make the book palatable, using "freedom" semantics to hide the concession.

  Given Mill's rigor elsewhere, I lean toward the **Charitable/Foundational** view. He isn't fudging because he's confused; he's fudging because he recognizes that *On Liberty* describes a system for *citizens*, and a slave is not a citizen. To allow the creation of slaves is to allow the destruction of the subject matter of his own essay.

  But your intuition is correct: once you admit that "protecting future autonomy" justifies overriding "current voluntary choice," you have opened the door to everything from cooling-off periods to mandatory retirement savings. Mill tries to keep that door barely ajar (only for total alienation), but the logic of the wedge is identical to the modern nudgers. He just had the honesty (or the fear) to admit it only applies to the extreme case, whereas Thaler and Sunstein try to apply it to everything.
