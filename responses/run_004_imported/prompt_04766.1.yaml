answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've had the privilege of being [Bride]'s friend for about ten years, since our sophomore year of college. I'm also currently getting a PhD in History, which usually means I'm the person you avoid at parties to prevent getting trapped in a monologue about grain prices in 1750. But tonight, I promise to keep the lecturing to a minimum. Mostly because [Bride] has made it very clear that "Resolution" is one of her virtues, and she will resolve to cut me off if I go over five minutes.

  That actually brings me to why I'm standing here. When [Bride] asked me to give this toast, I knew I had to talk about Benjamin Franklin.

  Now, stay with me, even if you didn't minor in Early American Literature. Ten years ago, [Bride] became obsessed with a specific chapter of Franklin's autobiography. It's the part where he decides to achieve "moral perfection." He made a list of thirteen virtues—things like Temperance, Silence, and Industry—and he created a little chart. He'd focus on one virtue a week, tallying a black mark every time he messed up.

  Most people hear this and think, "Classic overachiever." But [Bride] actually did it. She bought a notebook. She drew the grids. And for a decade, through jobs, moves, and life changes, she has kept that chart.

  If you know her well, you know that "Order" and "Resolution" have remained her nemeses for ten years. If you live with her, you know this even better. There is always a tally mark somewhere. But here is the thing that most people miss about Franklin's project, and the thing that [Bride] and I bonded over in that seminar sophomore year: Franklin admits it didn't work.

  He writes, quite beautifully, that he was startled by how many faults he had once he actually started counting. He realized he was never going to be perfectly polished. He tells a story about a man who wanted his axe ground perfectly bright all over. The grinder worked hard, but the axe was heavy, and the man kept turning the wheel. Eventually, the man got tired. He looked at the axe, which was still speckled with rust, and said, "I think I like a speckled axe best."

  Franklin decided he was okay with the speckled axe.

  And that is what I admire most about you, [Bride]. It isn't the perfectionism. It isn't the grid in the notebook. It's that for ten years, you have kept grinding the axe. You have kept trying to be kinder, better, more patient, even when you know you're going to leave a few speckles. You've accepted that the effort *is* the virtue.

  Franklin also noted that he added "Humility" to his list last, after a friend told him he was coming off as arrogant. But he immediately wrote that even if he achieved perfect humility, he'd probably just be proud of his humility. It's a paradox. We are all a little bit speckled.

  Which brings me to [Groom].

  [Groom], you are marrying a woman who strives for moral perfection but knows she won't quite get there. And honestly, that's the best kind of person to marry. Because marriage is not two polished axes leaning against each other. It's two people with speckled axes, agreeing to help each other with the grinding.

  I know you love her for her brilliance and her kindness. But I hope you also love her for the tally marks. For the times she tries to have "Order" and life gets messy. For the times she strives for "Resolution" and changes her mind. That's not failure. That's being human. And Franklin would tell you that being human, flaws and all, is the only project worth undertaking.

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May your life together be full of virtue, may your axes be shiny enough to reflect the good times, and may you always be happy with a little bit of speckle.

  To the happy couple!
