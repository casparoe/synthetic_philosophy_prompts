          *   Franklin admitted it didn't really work (the "speckled axe" analogy).
          *   Franklin added "Humility" last because he was proud of his humility (irony).
      *   **Tone:** Funny but heartfelt. Not a lecture, not a roast. Needs to celebrate her persistence, not mock her flaws.
      *   **Length:** About 5 minutes (roughly 600-800 words spoken at a moderate pace).
      *   **Goal:** Land on "I love watching you keep trying" rather than "You're a mess" or "Here's a history lesson."

  2.  **Determine the Structure:**
      *   **Opening:** Establish the relationship, acknowledge the honor, introduce the Franklin hook gently (so non-nerds aren't lost).
      *   **The Hook (The Notebook):** Explain the 13 virtues chart tradition. Make it relatable (self-improvement is universal).
      *   **The Twist (Franklin's Failure):** Pivot to the part of the story everyone ignores: Franklin failed. Introduce the "Speckled Axe."
      *   **The Application (The Bride):** Connect the "Speckled Axe" to the bride. It's not about perfection; it's about the effort. Mention "Order" and "Resolution" lightly.
      *   **The Partner (The Groom):** How does the groom fit in? He's the co-grinder of the axe.
      *   **The Closing:** Raise a glass. Sentimental wrap-up.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Start with the PhD status but immediately undercut it. "I study history, but I'm not here to teach." Introduce the friendship.
      *   *The Franklin Bit:* Need to explain the 13 virtues without boring the family. "Ben Franklin's self-help list." Mention the bride's notebook. This is the "inside baseball" that the seminar friends will recognize but others will understand as "she likes lists."
      *   *The Irony:* This is crucial. Franklin thought he could be perfect. He realized he couldn't. The "Speckled Axe" story. *Self-Correction:* Make sure the axe analogy is clear. A man wants a shiny axe, gets tired of grinding, keeps it speckled.
      *   *Connecting to Bride:* She's kept this up for 10 years. That's the win. Not the perfection, the persistence. "Order and Resolution" are still hard. That's okay.
      *   *The Humility Point:* Franklin added Humility last. He was proud of his humility. This is a good joke for the nerds, but needs to land for everyone too. Maybe tie it to how she handles her flaws now.
      *   *The Groom:* Marriage isn't about a polished axe. It's about two people accepting the speckles.
      *   *Conclusion:* The toast.

  4.  **Refining the Tone (The "Roast" Danger):**
      *   *Risk:* Saying "She's bad at Order and Resolution" sounds like "She's disorganized and flaky."
      *   *Fix:* Frame it as "She cares deeply about being good, which makes the messiness human." Focus on the *attempt*. The love is in the trying.
      *   *Risk:* History lecture.
      *   *Fix:* Keep Franklin references concrete. Don't name-drop other philosophers. Keep the focus on the *story* of the axe, not the philosophy of the Enlightenment.

  5.  **Drafting - Specific Phrasing (Mental or Scratchpad):**
