prompt: |-
  I'm working on a novel where my main character has to decide whether to sign up for a one-way colony mission to Mars, no coming back ever, and I fell down a rabbit hole reading L.A. Paul's stuff on transformative experience for research. The vampire example and the whole epistemically-transformative vs personally-transformative distinction make sense to me fine. What I can't wrap my head around is her actual fix for the rational choice problem -- something about how you're supposed to choose by valuing the "reveal" of what the new experience will be like, instead of valuing its specific content. Can you walk me through how that move is actually supposed to work, in plain terms? Because it seems like "I value discovering new things about myself" would give the same green light whether the outcome is amazing or a disaster, and it doesn't seem to help you pick between two different transformative options competing for the same decision. Is that an actual hole in her account or am I just missing the move she's making?
