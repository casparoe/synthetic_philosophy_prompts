      *   The "comfort" comes from a sense of invincibility.
      *   The "danger" is risk compensation (taking more risks because you feel safer).
      *   *Crucial:* I need to validate their feelings without validating the dangerous conclusion.

  4.  **Formulate the Response Strategy:**
