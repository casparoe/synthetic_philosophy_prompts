  7.  **Final Polish:** Check for clarity and impact. Ensure the distinction between "project-related DMs" and "personal DMs" is clear, as that addresses the "limiting principle" fear. (e.g., If they were arguing about football, we wouldn't intervene. Because it was about a PR, we do.)

