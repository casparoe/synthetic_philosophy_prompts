answer: |-
  **MEMORANDUM**

  **TO:** Code of Conduct Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Jurisdiction Regarding Maintainer DM Dispute

  ### Executive Summary

  We are convened to adjudicate a complaint regarding hostile communication between two maintainers. The core procedural question is whether the Code of Conduct (CoC) applies to Direct Messages (DMs) on Discord, given that our listed "official project spaces" specify the "Discord server" but do not explicitly enumerate DMs.

  **Recommendation:** I recommend the committee **assert jurisdiction** over this incident and proceed with adjudication on the merits of the complaint.

  While the text of the CoC does not explicitly list "DMs," the context of the interaction was project-related, occurring between individuals acting in their capacity as maintainers. Excluding these communications from our scope creates a critical safety loophole that undermines the CoC's purpose. However, to address valid concerns about overreach, this jurisdiction should be explicitly limited to interactions with a clear *nexus to project work*.

  ### Context

  A complaint was filed by Maintainer B against Maintainer A. The incident involves severe personal insults exchanged via Discord DMs. Both parties agree the conversation occurred; they disagree on whether we have the authority to judge it. The conflict originated from a disagreement over a specific Pull Request (rewrite) within the project repository.

  ### Reasoning for Recommendation

  My recommendation rests on three pillars: the functional definition of our workspace, the intent of the CoC, and the necessity of contributor safety.

  **1. The "Functional Workspace" Argument**
  Our CoC lists the "Discord server" as an official space. In practice, for a distributed open source project, Discord DMs between maintainers are not "private life"; they are a private *channel* within a public workspace. When two maintainers discuss a PR, they are working. The medium (DM vs. Public Channel) should not dictate whether basic professional conduct applies. If we ruled that harassment is permissible so long as it happens in a private tab rather than a public channel, we would be prioritizing technicalities over human safety.

  **2. The Nexus to Project Work**
  This is the critical limiting principle. We are not asserting jurisdiction over *all* DMs between contributors. We are asserting jurisdiction over DMs that are **inextricably linked to project participation.**
  *   **In Scope:** Maintainer A insulting Maintainer B about a code review, release schedule, or project direction.
  *   **Out of Scope:** Maintainer A and Maintainer B arguing about politics, video games, or personal matters unrelated to the library.
  Because this dispute grew directly out of a project PR, it falls under the umbrella of project conduct.

  **3. The "Loophole" Risk**
  The opposing argument warns of a slippery slope regarding privacy. However, the steeper slope is the one we face if we dismiss this. If we rule that DMs are off-limits, we effectively signal that the CoC can be bypassed by clicking a different button. This disproportionately endangers marginalized contributors who are often the targets of "off-site" harassment designed to push them out of the project.

  ### The Counter-Argument (Steel-manned)

  I want to address the argument for dismissal fairly, as it contains valid concerns that we must mitigate even if we reject the conclusion.

  **The Argument for Dismissal:**
  The CoC is a social contract with defined boundaries. By listing specific spaces, we created a jurisdictional fence. If we expand that fence now, we risk turning the committee into a morality police for the personal lives of volunteers.
  *   **Limiting Principle:** If we claim DMs today, what stops us from investigating Twitter arguments or text messages tomorrow? Where does the project end and the person begin?
  *   **Verification Burden:** DMs are he-said-she-said. Adjudicating them requires the committee to act as HR professionals without training, potentially forcing us to demand invasive screenshot evidence for private conversations.
  *   **Volunteer Burnout:** Maintainers are volunteers. If they feel they are under surveillance in their private DMs whenever they talk about the project, they may disengage. The friction of potential investigation could stifle the honest, sometimes heated, debate required to maintain software.

  **Why I still recommend Jurisdiction:**
  These risks are real, but they are manageable through *scope limitation* (the Nexus test above) rather than total abdication. We can protect privacy boundaries without granting immunity for project-related harassment.

  ### Next Steps & Timeline

  If the committee votes to accept jurisdiction, I propose the following workflow:

  *   **Friday (Today):** Committee Vote. (Goal: Majority decision on jurisdiction).
  *   **Monday:** Notification to Parties.
      *   Inform both maintainers that the committee has accepted the complaint.
      *   Explicitly state the reasoning: *Jurisdiction is accepted based on the direct nexus to project work, not as a blanket policy on all private communications.*
      *   Request any additional context/evidence from both sides by Wednesday.
  *   **Wednesday - Thursday:** Deliberation on Sanctions.
      *   Review evidence.
      *   Determine appropriate sanction (e.g., formal warning, temporary suspension of commit rights, mandatory mediation).
  *   **Friday (Next Week):** Final Decision Delivered.
      *   Decision communicated to both parties.
      *   No public announcement (to protect privacy), unless a removal from the team occurs that requires public access changes.
  *   **Month-End:** Policy Clarification.
      *   Draft a CoC amendment or FAQ to explicitly address "project-adjacent communications" to prevent this ambiguity in the future.

  ### Conclusion

  This is an uncomfortable position to be in. We are volunteers, not HR. However, the safety of our contributors is the prerequisite for the success of our software. Dismissing this complaint on a technicality would preserve our textual consistency but damage our community trust.

  I urge the committee to vote to assert jurisdiction, apply the "project nexus" limitation to address privacy concerns, and resolve the complaint on its merits.

  Please come prepared to vote on this specific recommendation at our meeting Friday at 14:00 UTC.

  Regards,

  [Your Name]
  CoC Committee Member
