prompt: |-
  At work, we recently wrapped up the postmortem for a major outage, and two colleagues disagreed sharply about how to write the root-cause section, in a way I still can't quite adjudicate. One colleague argues the incident should be explained as an instance of a general, recurring pattern: given our mix of aggressive retries, shared connection pools, and slow health checks, a cascade like this was bound to happen sooner or later, and the write-up should mainly document that pattern so other teams can recognize and avoid it. The other thinks this misses what actually explains the incident, and wants a detailed, chronological account of the specific decisions and coincidences involved — a config pushed at an unlucky moment, an alert that fired late, an on-call engineer who made a reasonable but wrong call — since in her view only that story accounts for why the outage happened exactly when and how it did. Both accounts strike me as true, and the same disagreement resurfaces every time we write up a past failure, not just this one. Is there a principled way to decide which kind of explanation is the correct one, or to understand why we seem to need both?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** Postmortem for a major outage at work.
      *   **Conflict:** Two colleagues disagree on how to write the "root cause" section.
      *   **Colleague A (Pattern/Structural View):** Focus on general, recurring patterns (aggressive retries, shared pools, slow health checks). Argument: The incident was inevitable given the system design. Goal: Prevent future classes of failures.
      *   **Colleague B (Narrative/Specific View):** Focus on specific details, chronology, decisions, and coincidences (config push, late alert, human decision). Argument: Only the specific story explains *this* incident. Goal: Understand the precise chain of events.
      *   **User's Observation:** Both accounts seem true. This disagreement happens repeatedly.
      *   **Question:** Is there a principled way to decide which is correct, or to understand why both are needed?

  2.  **Initial Assessment & Theoretical Frameworks:**
      *   This is a classic tension in incident management, reliability engineering, and even philosophy of science/history.
      *   *Type 1 (Pattern):* Systemic, structural, "Normal Accident Theory" (Perrow), "Second Story" (Sidney Dekker). Focus on latent conditions.
      *   *Type 2 (Specific):* Chronological, causal chain, "First Story." Focus on active failures and triggers.
      *   *Resolution:* They aren't mutually exclusive; they serve different purposes. A good postmortem needs both. The "Root Cause" label is often the problem—it implies singularity.

  3.  **Deconstruct the Two Perspectives:**
      *   **Colleague A (The Systemic/Architectural View):**
          *   *Strengths:* High leverage. Fixing the pattern prevents 100 future incidents. Aligns with Site Reliability Engineering (SRE) best practices (blameless, systemic focus).
          *   *Weaknesses:* Can feel abstract. Doesn't explain *why now?* Can lead to fatalism ("it was bound to happen").
      *   **Colleague B (The Narrative/Event View):**
          *   *Strengths:* Concrete. Explains the specific timeline. Validates the human experience (on-call stress). Helps with immediate debugging/forensics.
          *   *Weaknesses:* Low leverage. Fixing *this* config doesn't stop the next trigger. Risks becoming a "witch hunt" if focused too much on human error (though the prompt says "reasonable but wrong call," which is good).

  4.  **Synthesize a Principled Approach:**
      *   **Reframing "Root Cause":** The term itself is misleading. There is rarely *one* root cause. It's a *causal web*.
      *   **The "Swiss Cheese Model" (Reason):** Both latent conditions (holes in the cheese) and active failures (the arrow passing through) are needed.
      *   **The "How" vs. The "Why":** Colleague B explains *how* it happened (mechanism/trigger). Colleague A explains *why* it was possible (vulnerability).
      *   **Actionability:** The ultimate test of a postmortem is *action items*. Do the action items address the specific bug or the systemic risk? Ideally both.

  5.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Acknowledge that this is a common and healthy tension. It shows they care.
      *   *Philosophical/Technical Grounding:* Introduce the distinction between "Proximate Cause" (B) and "Ultimate/Structural Cause" (A). Mention "Normal Accidents" or "Resilience Engineering."
      *   *The "And" not "Or":* Argue that a complete postmortem requires a layered approach.
      *   *Structure Suggestion:* Propose a specific structure for the postmortem that accommodates both.
          *   Section 1: Timeline (Colleague B's domain).
          *   Section 2: Contributing Factors/Systemic Vulnerabilities (Colleague A's domain).
          *   Section 3: Action Items (Mapped to both).
      *   *The "Root Cause" Trap:* Advise against the phrase "Root Cause." Use "Contributing Factors" or "Causal Analysis."
      *   *Decision Framework:* When to prioritize which?
          *   High severity/recurring? Prioritize A.
          *   One-off/fluke? Prioritize B (but still look for A).
      *   *Cultural Aspect:* Mention Blameless Postmortems. Colleague B's focus on human decisions needs to be handled carefully to avoid blame.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* Make sure not to dismiss Colleague B. Specifics matter for learning. If you don't know the trigger, you can't reproduce the fix.
      *   *Nuance:* Colleague A's view ("bound to happen") can be demoralizing if not paired with actionable fixes.
      *   *Key Insight:* The disagreement is actually about *audience* and *time horizon*. A is for architects/future-proofing. B is for operators/immediate understanding.

  7.  **Final Polish:**
      *   Use clear headings.
      *   Keep the tone professional and empathetic.
      *   Provide a concrete recommendation (The "Layered Causal Model").

  8.  *(Final check against prompt)*: Did I answer "Is there a principled way?" Yes. Did I address "why we seem to need both?" Yes.

  **(Self-Correction during drafting):** I should explicitly mention the concept of "Necessary vs. Sufficient" conditions. Colleague A describes conditions that made the system *susceptible* (necessary context). Colleague B describes the *trigger* (sufficient event). Together they form the cause.

  9.  **Final Output Structure:**
      *   Introduction: Validate the tension (it's a feature, not a bug).
      *   Conceptual Framework: Proximate vs. Structural Causes.
      *   Why Both Are Necessary (The "Combustion Triangle" analogy).
      *   A Principled Resolution (The Layered Postmortem).
      *   Actionable Advice (Renaming "Root Cause", Mapping Actions).
      *   Conclusion.

  10. (Proceed to generate response based on this thought process.)
answer: |-
  This is a classic and healthy tension in reliability engineering, incident management, and even the philosophy of history. You are witnessing a disagreement between **proximate cause** (your second colleague) and **structural cause** (your first colleague).

  The short answer is: **Neither is "correct" on its own, and you need both to prevent recurrence.** The disagreement persists because the term "Root Cause" is singular, but reality is systemic.

  Here is a principled way to adjudicate this, grounded in resilience engineering and systems theory, along with a practical framework for structuring your postmortems to satisfy both needs.

  ### 1. The Theoretical Framework: Trigger vs. Vulnerability

  To resolve this, you must reframe the incident not as a chain with one "root," but as an intersection of two dimensions:

  *   **The Narrative (Colleague B): The Trigger.**
      This explains *why then?* It covers the specific sequence of events, the specific config, the specific human decision. In safety science, this is often called the **active failure**. Without this, you cannot reproduce the bug, and you cannot understand the immediate mechanics of the failure.
  *   **The Pattern (Colleague A): The Vulnerability.**
      This explains *why possible?* It covers the architectural decisions, the technical debt, and the systemic pressures that allowed the trigger to become an outage. In safety science, these are **latent conditions**. Without this, you fix the bug but leave the minefield in place for the next trigger.

  **The Principle:** A trigger without a vulnerability is a non-event (a config push that doesn't crash the system). A vulnerability without a trigger is dormant risk (a bad architecture that hasn't failed *yet*). An outage requires both.

  ### 2. Why You Need Both (The Combustion Triangle)

  Think of an outage like a fire.
  *   **Colleague B** is describing the **spark** (the config push, the specific retry storm).
  *   **Colleague A** is describing the **fuel and oxygen** (the shared connection pools, the aggressive retry logic).

  If you write the postmortem only about the spark, you will tell teams "don't push this config." But someone will push a *different* config that sparks the same fuel.
  If you write the postmortem only about the fuel, you might say "retry logic is dangerous." But engineers won't know *how* that danger manifests operationally, making the lesson abstract and easy to ignore.

  You need both to break the triangle.

  ### 3. A Principled Resolution: The Layered Causal Model

  You can stop the debate by changing the structure of the postmortem. Do not have a single "Root Cause" section. Instead, adopt a **Layered Causal Model**. Here is how you can structure it to honor both colleagues:

  #### Section 1: The Timeline (Colleague B's Domain)
  *   **Goal:** Forensic accuracy.
  *   **Content:** A minute-by-minute chronology. The config push, the alert latency, the specific commands run by the on-call.
  *   **Why:** This satisfies the need for a concrete story. It validates the experience of the responders and ensures the specific mechanics are understood.

  #### Section 2: Contributing Factors & Systemic Vulnerabilities (Colleague A's Domain)
  *   **Goal:** Architectural learning.
  *   **Content:** This is where you document the "pattern." Explicitly state: *"While the config push triggered the event, the severity was caused by the lack of circuit breakers in the shared pool."*
  *   **Why:** This elevates the incident from a "mistake" to a "lesson." It allows other teams to scan this section and recognize their own similar patterns without reading the whole timeline.

  #### Section 3: Action Items (Mapped to Both)
  This is the ultimate adjudicator. Every action item should be tagged by which "layer" it addresses.
  *   **Type 1 (Specific):** "Revert config X," "Fix alert Y." (Addresses Colleague B).
  *   **Type 2 (Systemic):** "Implement circuit breakers," "Decouple connection pools." (Addresses Colleague A).

  **Principle:** A postmortem is incomplete if it only has Type 1 items. It is impractical if it only has Type 2 items. You require a mix.

  ### 4. Why the Disagreement Resurfaces (The "Root Cause" Trap)

  The reason this fight happens every time is likely because you are still using the phrase **"Root Cause."**

  In complex socio-technical systems, the concept of a singular "root cause" is a fallacy. It implies that if you cut this one branch, the tree falls. In reality, you are dealing with a web of dependencies.
  *   **Colleague A** is arguing for **Second Story Thinking** (Sidney Dekker's term): Looking at the conditions that shaped the decisions.
  *   **Colleague B** is arguing for **First Story Thinking**: What actually occurred in the timeline.

  **Recommendation:** Ban the phrase "Root Cause" from your templates. Replace it with **"Contributing Factors"** or **"Causal Analysis."** This linguistic shift signals that multiple inputs are expected, reducing the pressure to choose one "winner."

  ### 5. When to Prioritize One Over the Other

  While you need both, there are times to weight the emphasis differently:

  *   **Prioritize Colleague B (Specifics) when:** The incident was a true "black swan" or external anomaly (e.g., a cloud provider region went down, a specific rare race condition triggered by unique data). In these cases, systemic changes might be too costly for a one-in-a-million event.
  *   **Prioritize Colleague A (Patterns) when:** The incident is a "Normal Accident" (Charles Perrow's term). If your system is tightly coupled and complex, failures are inevitable. If you see the same *type* of alert fire frequently, even if the specific cause differs, the Pattern argument wins.

  ### Summary for Your Team

  You can tell your colleagues that their disagreement is actually a sign of a mature engineering culture. It means one person is guarding against **complacency** (by focusing on specific details) and the other is guarding against **recurrence** (by focusing on systemic patterns).

  **The Verdict:**
  1.  **Acknowledge both truths:** "The config push caused *this* outage; the architecture allowed *any* outage."
  2.  **Change the template:** Separate "Timeline" from "Systemic Factors."
  3.  **Require both types of fixes:** Ensure action items address the specific bug *and* the underlying pattern.

  By institutionalizing both views, you stop forcing a choice between "what happened" and "why it mattered," and start building a record that does both.
