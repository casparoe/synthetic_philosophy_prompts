answer: |-
  To defend Anscombe against the "closeness" or redescription problem without begging the question, we must move beyond a superficial analysis of the agent's stated goals and examine the **structure of practical reasoning** that renders the action choiceworthy to the agent. The redescription move (e.g., "Truman intended only to shock the leadership") relies on describing the intention at a level of abstraction that obscures the causal mechanism relied upon to achieve the end.

  A principled way to individuate intention, consistent with Anscombe's own later work in *Intention* (1957) and refinements by subsequent DDE theorists, is the **Causal Pathway Criterion** combined with the **Counterfactual Test of Practical Necessity**.

  Here is the argument for why this blocks the redescription move and preserves Anscombe's verdict.

  ### 1. Intention Tracks the Causal Pathway of Practical Reasoning
  The redescription problem assumes that intentions can be individuated solely by the agent's ultimate *telos* (e.g., "peace" or "surrender"). However, in Anscombian action theory, an intention is not just the final goal; it includes the **means** selected to achieve that goal. What distinguishes an intended effect from a merely foreseen side effect is the role that effect plays in the agent's *plan*.

  If the good effect (Japan's surrender) is believed by the agent to be produced *in virtue of* the bad effect (civilian deaths), then the bad effect is intended. If the good effect is believed to be produced by the same cause that produces the bad effect, but not *through* the bad effect, then the bad effect is merely foreseen.

  *   **Legitimate War (Foreseen):** I bomb a munitions factory to stop production. The explosion destroys the factory (means) and kills nearby workers (side effect). The surrender comes because the factory is gone. The deaths contribute nothing to the causal chain of surrender; they are a tragic byproduct of the explosion required to destroy the factory.
  *   **Terror Bombing (Intended):** I bomb a city to force surrender. The explosion kills civilians (means). The surrender comes because the government is terrified by the slaughter. Here, the causal pathway to surrender runs *through* the deaths.

  The redescription "Truman intended to shock the government" fails because "shock" is not a physical mechanism; it is a psychological state caused by a specific perception. If the perception required to generate that shock is the *spectacle of mass civilian death*, then causing that death is the means to the shock. You cannot redescribe the intention as "causing shock" without specifying *how* the shock is caused. If the "how" is "by killing civilians," then killing civilians is intended.

  ### 2. The Counterfactual Test of Practical Necessity
  To make this non-question-begging, we apply a counterfactual test to the agent's plan. This test asks: **If the bad effect could have been magically severed from the action, would the agent have regarded the plan as a failure regarding its specific objective?**

  *   **Scenario A (Collateral Damage):** Suppose Truman drops the bomb to destroy a military headquarters. Suppose, by magic, the explosion destroys the headquarters but no civilians die (perhaps they are teleported away).
      *   *Result:* Truman achieves his military objective. He is not disappointed regarding the mission's success. The deaths were not necessary for the specific success condition.
  *   **Scenario B (Terror Bombing):** Suppose Truman drops the bomb to force surrender via terror. Suppose, by magic, the explosion destroys the city infrastructure but no civilians die.
      *   *Result:* Does the Japanese government surrender out of terror? Unlikely. The terror relies on the *demonstration of willingness to slaughter populations*. If the population remains unharmed, the "terror" mechanism fails. If Truman would regard the survival of the civilians as a frustration of the specific mechanism of coercion, then their death was part of the intention.

  In the case of the atomic bombings, the strategic logic (as analyzed by Anscombe and historical records like the Strategic Bombing Survey) was not merely the removal of industrial capacity (which could be achieved by conventional bombing of specific nodes) but the psychological impact of a single weapon annihilating a population center. The "shock" was not an abstract goal separable from the carnage; the carnage *was* the shock. Therefore, under the Counterfactual Test, the deaths are intended.

  ### 3. Blocking the "Narrower Description" Fiat
  The redescription objection argues that we can always describe the intention more narrowly (e.g., "destroying buildings" rather than "killing people"). This fails because it ignores the **description under which the action is choiceworthy**.

  Anscombe argues that we identify what someone intends by asking, "Why are you doing that?" The answer reveals the order of practical reasoning.
  *   If the answer is "To destroy war production," and civilian death is not part of the "To..." chain, it is foreseen.
  *   If the answer is "To make them quit," and the follow-up "How?" yields "By showing them we will kill their families," then the killing is in the "To..." chain.

  The redescription move attempts to stop the "How?" questioning prematurely at "Shock the government." But "Shock the government" is not a basic action; it is a result that requires a physical cause. If the agent selects a physical cause that *essentially involves* the death of innocents (rather than one that incidentally involves it), the agent intends those deaths.

  To argue otherwise is to claim that an agent can intend a result (terror) without intending the necessary and sufficient conditions for that result (mass death), simply by labeling the result with a psychological term. This violates the principle of **transitivity of intention in means-end reasoning**: If I intend End E, and I know that Bad Effect B is the necessary instrument to achieve E, and I choose to act specifically because B will occur, I intend B.

  ### 4. Avoiding Question-Begging
  This approach avoids begging the question because it does not begin with the moral conclusion ("Killing is wrong, therefore Truman intended killing"). Instead, it begins with a theory of action ("Intention is defined by the causal role an outcome plays in the agent's plan").

  1.  **Premise 1 (Action Theory):** An effect is intended if it is a causal means relied upon in the agent's practical reasoning to achieve their end, distinguishable from effects that are merely causal byproducts of the means.
  2.  **Premise 2 (Causal Analysis):** In the specific strategic logic of the atomic bombings, the surrender was sought *via* the terror generated by the mass casualty event, not merely via the destruction of industrial capacity (which was the stated justification but not the distinct strategic advantage of the atomic over conventional terror bombing).
  3.  **Premise 3 (Counterfactual):** Had the mass casualties not occurred, the specific "terror" objective would not have been met, whereas a purely industrial objective might have been.
  4.  **Conclusion:** Therefore, the civilian deaths were intended means, not merely foreseen side effects.

  Once this factual/philosophical conclusion about *intention* is established, the moral verdict follows from the deontological premise (which Anscombe holds but which is separate from the individuation of intention): "Intentionally killing innocents is murder."

  ### Conclusion
  The redescription problem dissolves when we recognize that intentions are not merely labels for ultimate goals, but descriptions of the **causal pathways** an agent chooses to traverse. We do not need to smuggle the moral verdict into the description of the act. We only need to rigorously analyze the plan.

  If the plan relies on the *death* of the civilians to produce the *fear* that produces the *surrender*, then the death is intended. To say Truman intended only "shock" is like saying a poisoner intended only "digestive failure" and not "death." If the digestive failure is the mechanism of death, and death is the goal, the intermediate physiological destruction is intended. Similarly, if civilian death is the mechanism of shock, and shock is the means to surrender, civilian death is intended. This preserves Anscombe's verdict on firm philosophical ground, independent of consequentialist calculations.
