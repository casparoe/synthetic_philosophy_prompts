prompt: |-
  G.E.M. Anscombe's 1956 pamphlet "Mr. Truman's Degree," written to protest Oxford's decision to award Harry Truman an honorary degree, turns on a specific application of the doctrine of double effect: she argues that Truman intended the deaths of Japanese civilians as the very mechanism by which Japan would be forced to surrender, rather than merely foreseeing those deaths as a side effect of an otherwise legitimate act of war, and that this is precisely what makes the bombings murder rather than a permissible, if terrible, act of war.

  Regular readers of these debates will already know the standard consequentialist rebuttal to Anscombe — that no act can be absolutely forbidden regardless of the lives at stake — and I'd like to set that aside. I'm more interested in a narrower problem internal to the doctrine of double effect itself: the so-called "closeness" or redescription problem, on which almost any foreseen death can be redescribed as the unintended side effect of some more narrowly specified goal (on such a redescription, Truman merely intended to shock Japan's government into surrendering, or to destroy war production, and merely foresaw that civilians would die as a result).

  Please argue that there is nonetheless a principled, non-question-begging way of individuating Truman's intention that blocks this redescription move and preserves Anscombe's verdict — one that doesn't simply smuggle the desired conclusion into the description of the act by fiat.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Topic:** G.E.M. Anscombe's "Mr. Truman's Degree" and the Doctrine of Double Effect (DDE).
      *   **Core Issue:** The "closeness" or "redescription" problem. Critics argue that almost any intended bad effect can be redescribed as a merely foreseen side effect of a narrower goal (e.g., Truman intended to "shock the government," not "kill civilians," even if killing civilians was the means to the shock).
      *   **Task:** Argue that there *is* a principled, non-question-begging way to individuate Truman's intention that blocks the redescription move and preserves Anscombe's verdict (that it was murder/intentional killing of innocents).
      *   **Constraint:** Do not rely on standard consequentialist rebuttals (utilitarian calculus). Stay internal to DDE/intentional action theory. Do not simply stipulate the conclusion (i.e., don't just say "It was murder because I say the intention was murder").

  2.  **Deconstruct the "Closeness Problem":**
      *   The problem arises because intentions can be described at various levels of abstraction (Anscombe's own *Intention* deals with this).
      *   *Example:* I turn on the light.
          *   Level 1: I flip the switch.
          *   Level 2: I illuminate the room.
          *   Level 3: I alert the burglar.
      *   In the Truman case:
          *   Description A (Anscombe): Intending to kill civilians to force surrender.
          *   Description B (Redescription): Intending to destroy infrastructure/shock leadership, foreseeing civilian death.
      *   The challenge is to show why Description A is the *correct* description of the intention, not Description B, without just asserting A is correct because the act is wrong.

  3.  **Identify Potential Philosophical Resources:**
      *   **Anscombe's *Intention*:** She distinguishes between "intentional action" and "foreseen consequences" based on the "Why?" question. If the answer "I didn't know that would happen" is false, it might still be unintentional. But if the answer "That was part of the plan" is true, it's intentional.
      *   **The Means/End Distinction:** DDE hinges on whether the bad effect is a *means* to the good end or a *side effect*.
      *   **Quinn's Revision (Direct vs. Indirect Harm):** Phillip Quinn refined DDE to focus on whether the agent involves the victim in a harmful way directly.
      *   **Thomson/Scanlon on Intent:** Focus on the agent's plan and the role the outcome plays in the success of the plan.
      *   **Counterfactual Test:** If the civilians hadn't died, would the plan have succeeded?

  4.  **Develop the Argument (The "Plan-Based" or "Success Condition" Approach):**
      *   *Goal:* Show that civilian death wasn't just correlated with the plan; it was *constitutive* of the plan's mechanism.
      *   *Step 1: The Role of the Effect in the Causal Chain.*
          *   If Truman's goal was "destroy war production," then civilian death is a side effect (collateral damage).
          *   If Truman's goal was "force surrender via terror," then civilian death is the *means*.
          *   Historical context matters here (non-question-begging evidence). The Strategic Bombing Survey, Truman's own statements, the choice of targets (Kyoto vs. Hiroshima/Nagasaki - cultural vs. military).
          *   *Wait, I need a philosophical principle, not just history.* The principle must be about how we identify intention *given* the causal structure.
      *   *Step 2: The Counterfactual Test of Intention.*
          *   Ask: "Would the agent have been disappointed if the bad effect did not occur?"
          *   If Truman dropped the bomb and *no one died* (magic forcefield), but the infrastructure was destroyed, would he consider the mission a failure regarding the *objective*?
          *   If the objective was "terror," then zero deaths = failure of the specific mechanism.
          *   If the objective was "factory destruction," zero deaths = success (plus bonus).
          *   *Refinement:* This is often called the "Counterfactual Test" (associated with Bennett or Quinn).
      *   *Step 3: The "In Virtue Of" Relation.*
          *   Did the plan succeed *in virtue of* the civilians dying?
          *   Anscombe argues the surrender was sought *by means of* the destruction of the city and its people.
          *   To redescribe it as "shocking the government" is empty unless we specify *how* the shock is achieved. If the shock is achieved *by* the spectacle of mass death, then the mass death is intended.
      *   *Step 4: Avoiding Question-Begging.*
          *   Don't say "It's murder so the intention must be killing."
          *   Say "The causal logic of the plan requires the death for the specific end sought (terror/surrender), therefore the death is intended."
          *   Distinguish between "obstructive prevention" (destroying a bridge to stop troops, workers die) vs. "productive use" (killing workers to stop production/terrorize).
          *   Actually, a better distinction is **Strategic Necessity within the Plan**. If the plan relies on the *fear* generated by the *reality* of the slaughter, the slaughter is not a side effect; it is the message.

  5.  **Drafting the Argument Structure:**
      *   **Introduction:** Acknowledge the closeness problem. State the thesis: We can distinguish intention from foresight by examining the *causal role* the outcome plays in the agent's plan of action (the "Plan-Based Criterion").
      *   **Point 1: The "Why?" Question and Practical Reasoning.** Anscombe's own method. The intention is identified by the order of practical reasoning. If X is required for Y, and Y is the goal, X is intended.
      *   **Point 2: The Counterfactual Test.** If the civilians survived but the buildings fell, would the specific goal (terror/surrender) be met? If the answer is "No, the terror requires the bodies," then the death is intended.
      *   **Point 3: Distinguishing "Obstacle" vs. "Medium".** In legitimate war, civilians are obstacles (collateral). In terror bombing, civilians are the medium (the message).
      *   **Point 4: Addressing the Redescription.** "Shocking the government" is not a narrower description; it's an abstract one. We must look at the *concrete mechanism*. The mechanism was mass death. Therefore, mass death was intended.
      *   **Conclusion:** This preserves Anscombe's verdict without begging the question.

  6.  **Refining the Argument (Self-Correction/Critique):**
      *   *Critique:* Isn't "shocking the government" still a valid description where death is foreseen?
      *   *Response:* Only if the shock can be achieved without death. If the shock is *specifically* the horror of the slaughter, then the slaughter is the means. We need to anchor this in the *nature of the act* as chosen.
      *   *Key Philosophical Move:* Use the distinction between **intended means** and **foreseen conditions**. A condition is foreseen if it must happen for the act to work, but isn't *what* the agent is trying to bring about. A means is what the agent is trying to bring about to get the end.
      *   *Wait, if it must happen for the act to work, isn't it intended?* Not necessarily (e.g., noise in surgery). But in terror bombing, the death *is* the instrument.
      *   *Better formulation:* The "Causal Uploading" argument. If the good effect (surrender) flows *through* the bad effect (death), the bad effect is intended. If the good effect flows *alongside* the bad effect (from the same cause, e.g., explosion), it is foreseen.
      *   *Application to Truman:* Did surrender flow from the explosion destroying factories (death = side effect)? Or did surrender flow from the realization that the US would annihilate populations (death = means)? Anscombe argues the latter. The argument must support why the latter is the philosophically salient description of the *choice*.
      *   *Focus on the Choice:* When Truman chose the action, what description made the action choiceworthy *to him* as a path to surrender? If he thought "This will kill 100,000 people and that will scare them into quitting," the killing is part of the rationale.

  7.  **Finalizing the Argument Strategy:**
      *   Use the **"Causal Pathway" Criterion**.
      *   Use the **"Counterfactual Disappointment" Test**.
      *   Use the **"Description under which the act is choiceworthy"** (Anscombe's *Intention*).
      *   Show that "shocking the government" is too vague to escape the charge unless the shock is divorced from the killing, which historically and logically it wasn't.

  8.  **Writing the Response:** (Incorporating the above points into a coherent philosophical argument).
      *   *Tone:* Analytical, rigorous, respectful of Anscombe's framework.
      *   *Key Terminology:* Practical reasoning, causal pathway, counterfactual test, description under which the action is intended.

      *(Self-Correction during drafting)*: Make sure I don't rely *too* much on historical trivia (like specific memos) because the prompt asks for a *principled* way of individuating intention, not just a historical fact-check. The principle must be applicable generally, using Truman as the case study. The principle is: **Intention tracks the causal pathway relied upon in practical reasoning.**

      *Refining the "Redescription" block:* The redescription says "He intended to shock." The rebuttal is "Shocking is a mental state in the Japanese leaders. How is that state caused? By the perception of mass death. Therefore, causing mass death is the means to causing the mental state." You can't stop at "shock." You have to go down to the physical mechanism.

      *Final Polish:* Ensure I explicitly mention how this avoids question-begging. It avoids begging because it doesn't start with "killing is wrong," it starts with "how do we identify what is intended?" and concludes "killing was intended," which *then* triggers the moral prohibition.

  9.  **Final Review against constraints:**
      *   No consequentialism? Check.
      *   Internal to DDE/Intention? Check.
      *   Non-question-begging? Check.
      *   Preserves Anscombe's verdict? Check.

