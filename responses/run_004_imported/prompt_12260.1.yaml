prompt: |-
  A close friend and I spent much of last night's dinner arguing in circles about a decision I've been putting off, and I still don't know which of us was right. My cousin is being released from prison in a few weeks after a five-year sentence, and I've offered him my spare room while he gets back on his feet, along with a lead on a steady construction job through a contact of mine. On the face of it this looks like an easy call: stable housing and steady employment are among the best-documented predictors of whether someone reoffends, so it seems as though I'd be doing him, and probably everyone else, a real favor.

  My friend didn't dispute any of that, but she pushed back hard on whether I should feel confident that this is the right thing to do. Her point was that the moment he moves in and starts that job, the effects branch outward in ways neither of us could trace, let alone weigh against one another: maybe the job would otherwise have gone to someone who needed it more, whose life goes somewhat worse as a result; maybe the stability lets my cousin meet someone and have children whose lives ripple forward for generations, for better or worse; maybe having him around changes the course of my own life in ways I would never be able to trace back to this decision at all. She argued that these unforeseeable knock-on effects vastly outnumber the handful of effects I can actually see and reason about, that there is no particular reason to expect them to cancel out on balance, and that I have therefore just arbitrarily stopped counting consequences at the point that happens to make me feel good about my choice. I countered that this cannot be the right way to think about it, since it seems to show that we could never be justified in believing any action to be good, which feels like the wrong lesson to draw from a case this mundane. We went back and forth for the better part of an hour and never resolved it.

  I would be curious to get an outside read on this: is my friend pointing to a genuine problem with how I am reasoning about this decision, or is there a flaw in her argument that we were both missing?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **The Situation:** The user is offering housing and a job lead to a cousin recently released from prison.
      *   **The Conflict:** The user believes this is a good deed based on known predictors of recidivism (housing + job = less reoffending). The friend argues that the *unforeseeable long-term consequences* (ripple effects) make it impossible to know if it's truly "good" overall (e.g., job displacement, future children, impact on the user).
      *   **The Core Philosophical Question:** Is the friend right that we can't justify actions because we can't count all infinite consequences (a problem for consequentialism/utilitarianism)? Or is the user right that this line of reasoning leads to paralysis and must be flawed?
      *   **The Goal:** Provide an "outside read" on who is reasoning correctly, identifying the genuine problem vs. the flaw in the argument.

  2.  **Identify the Philosophical Underpinnings:**
      *   **User's Stance:** Common-sense morality, rule utilitarianism (following rules that generally work), or perhaps virtue ethics (being a good cousin). Focus on *proximate* and *probable* outcomes.
      *   **Friend's Stance:** Act utilitarianism taken to its logical extreme (infinite regress of consequences), skepticism about moral knowledge. This touches on the "Problem of Epistemic Limitation" in consequentialism.
      *   **The Tension:** Ideal Consequentialism (judge by *actual* outcomes) vs. Practical Consequentialism (judge by *expected* outcomes based on available information).

  3.  **Evaluate the Friend's Argument:**
      *   *Strengths:* She is technically correct that we cannot know the future. Every action has infinite causal chains. If "goodness" is defined strictly by the *actual* total net utility of the entire future, we can never know if an action is good until the end of time.
      *   *Weaknesses:* This makes moral decision-making impossible (paralysis). It conflates *ontological* goodness (what actually happens) with *epistemic* justification (what we are reasonable to believe). It ignores probability. The "job displacement" argument is a classic "seen vs. unseen" economic fallacy (Bastiat), but in a moral context, it often cancels out (someone gets the job either way, but your cousin getting it prevents crime).

  4.  **Evaluate the User's Argument:**
      *   *Strengths:* Practical. Aligns with how humans actually make decisions. Focuses on high-probability, high-impact near-term outcomes (recidivism rates are data-driven).
      *   *Weaknesses:* Could be accused of being short-sighted, but in this specific case, the data supports the short-term view as a proxy for long-term good.

  5.  **Synthesize the Resolution:**
      *   The friend is raising a valid *philosophical* objection (the epistemic problem of consequentialism) but applying it in a way that is *practically* useless.
      *   The user is right to reject the conclusion (paralysis) but needs to articulate *why* the friend's premise doesn't invalidate the decision.
      *   **Key Distinction:** *Expected Value* vs. *Actual Value*. We judge decisions based on information available at the time, not omniscience.
      *   **Key Concept:** *Satisficing* or *Probabilistic Reasoning*. We don't need to count *all* consequences, just the *significant and probable* ones.
      *   **Key Concept:** *Baseline Comparison*. Comparing the action to the relevant alternative (cousin homeless vs. housed), not to a utopian ideal.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the debate. It's a classic philosophical puzzle (Consequentialism vs. Epistemic Limits). Validate both sides.
      *   *Analyze the Friend's Point:* She's describing the "Epistemic Objection" to Utilitarianism. She's right that we can't know the future. But she's wrong that this invalidates the decision.
      *   *Analyze the User's Point:* You're relying on "Expected Utility." This is the standard for rational decision-making.
      *   *The Flaw in the Friend's Reasoning:*
          1.  **Probability:** Unforeseeable effects are, by definition, low probability or random. They tend to cancel out over time. Foreseeable effects (housing reduces crime) are high probability.
          2.  **The Baseline:** The comparison isn't "Perfect World vs. This Action." It's "Status Quo (Homelessness/Recidivism) vs. This Action."
          3.  **Moral Mathematics:** We judge the *decision*, not the *outcome*. A good decision can have bad luck.
          4.  **Paralysis:** If her logic holds, you can't get out of bed (might step on a bug that changes the ecosystem).
      *   *The Flaw in the User's Reasoning (to be fair):* Don't ignore the risks entirely. Acknowledge that "good intentions" aren't enough, but data helps.
      *   *Conclusion:* The user is practically right; the friend is theoretically right but practically wrong. The decision is justified based on *expected* value.

  7.  **Refining the Tone:**
      *   Keep it empathetic but analytical.
