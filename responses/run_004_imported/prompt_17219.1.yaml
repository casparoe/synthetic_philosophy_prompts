      *   **Problem:** Frustrated by the stalemate in the literature. Adaptationists say models are testable; Pluralists say they are untestable "just-so stories." Wants to see the *actual* argument hashed out over specific evidence, not slogans.
      *   **Task:** Write a dialogue between two sharp evolutionary biologists.
