answer: |-
  **Setting:** *A quiet booth in a coffee shop near the university biology building. Rain streaks the window. Two colleagues, ELENA and MARCUS, are finishing espresso. Elena is 60s, sharp-eyed, wears a cardigan that has seen better days but implies tenure. Marcus is similar age, beard grey, dressed in rumpled corduroy. They have known each other for thirty years.*

  **Elena:** You're frowning at that book again, Marcus. *The Structure of Evolutionary Theory*? Heavy reading for a rainy Tuesday.

  **Marcus:** Heavy history, Elena. I was just re-reading the Spandrels paper. It strikes me differently now than it did in the eighties. Back then, it felt like a polemic. Now, reading it after a career of watching grad students struggle to publish... it feels like a warning label that nobody reads.

  **Elena:** [Sighs] Here we go. The "adaptationists are blind" sermon. I thought we agreed to disagree on the weighting, not the existence.

  **Marcus:** It's not about existence. It's about the default. You people—your generation, the Maynard Smith school—you treat adaptation as the null hypothesis. You assume selection did the work until proven otherwise. Gould's point was that this isn't a neutral starting point. It's a bias that structures what questions you're allowed to ask.

  **Elena:** It's not a bias; it's a methodology. Look, I spent thirty-five years modeling shorebird foraging. If I assume the bird is *not* optimizing its intake, I have no baseline. I can't measure deviation. If I assume optimality, I can generate a prediction: "Given prey density X, the bird should switch diets at threshold Y." Then I go out and watch. If they don't, the model fails. That is testable. That is science.

  **Marcus:** But that works for *behavior*. Behavior is plastic. You're modeling a decision process. Gould and I are talking about *morphology*. Fixed traits. Take the human chin. Gould's favorite example.

  **Elena:** The bony protrusion on the mandible.

  **Marcus:** Right. The adaptationist story is usually something about sexual selection, or structural reinforcement for speech, or deflecting blows during fighting. You build a model where a chin confers a fitness advantage.

  **Elena:** And if the math holds, and the comparative data supports it, why is that a "just-so story"?

  **Marcus:** Because you started with the function and looked for the form. Gould argued the chin is a byproduct. A spandrel. It arises inevitably from the intersection of two growth fields: the alveolar process (holding the teeth) and the basal mandible. As the hominid face shortened and the teeth crowded, those two fields intersected at an angle that left a protrusion. No selection for the chin *itself*. It's architectural debris.

  **Elena:** Okay. So how do we decide? That's the question the literature never answers to my satisfaction. You say "it's a byproduct," I say "it's an adaptation." We trade insults. What is the actual evidentiary standard?

  **Marcus:** The standard is independent evidence. If you claim the chin is for speech reinforcement, show me that the bone density correlates with speech muscle attachment points in a way that differs from non-speaking primates. Show me that individuals with larger chins have higher reproductive success *because* of speech clarity.

  **Elena:** That's impossibly high. We can't run fitness regressions on extinct hominids.

  **Marcus:** Exactly! So you're left with a story. But if I claim it's a developmental byproduct, I can look at ontogeny. I can look at the growth trajectories of children. I can look at Neanderthals, who didn't have chins but had similar diets and fighting styles. If the trait appears only when specific developmental constraints shift, regardless of the ecological niche, that points to constraint, not selection.

  **Elena:** But Marcus, that's negative evidence. You're saying "I don't see a function, therefore it's a spandrel." That's just as risky. Absence of evidence isn't evidence of absence. Maybe we haven't found the right variable yet. This is where Godfrey-Smith's distinction matters. You're conflating *empirical* adaptationism with *methodological* adaptationism.

  **Marcus:** Explain.

  **Elena:** Empirical adaptationism is the claim that "most traits are adaptations." I don't necessarily believe that. I know drift happens. I know constraints exist. But *methodological* adaptationism says: "Assume adaptation first to generate hypotheses." It's a heuristic. It forces you to be precise. If I model the chin as a stress-beam, I can calculate the load it should bear. If the actual bone structure is weaker than the model requires, the model is falsified.

  **Marcus:** But who is doing that falsification, Elena? In my experience, when the model fails, the adaptationist doesn't discard the adaptationist assumption. They tweak the function. "Oh, it's not for stress, it's for sexual display." Then, "Oh, not display, it's for fat storage." The core assumption—that there *is* a function—is immune to refutation.

  **Elena:** That's bad science, not bad adaptationism. A proper optimality model has trade-offs. If the chin were for sexual selection, we should see sexual dimorphism. We do, somewhat. But if it's a developmental byproduct, the dimorphism should be a secondary effect of overall size, not a specific shape difference. We can measure that.

  **Marcus:** See, now you're doing what I want! You're looking for the signature of selection versus the signature of development. But the problem is the *priority*. If you start with the adaptationist model, you spend five years measuring dimorphism. If you start with the developmental model, you spend five years mapping growth fields. Resources are finite. What if the developmental path explains 90% of the variance in year one, and your selection model explains 5% in year five?

  **Elena:** Because selection is the only process that creates *design*. Development creates variation, sure. But it doesn't explain why the variation is maintained. Why is the chin universal in *Homo sapiens*? If it were just neutral debris, why hasn't it drifted away? Why is it so consistent? Universality suggests stabilizing selection.

  **Marcus:** Or... it suggests a strong developmental constraint. If the growth fields *must* intersect that way given our skull size, you can't drift away from it even if you wanted to. It's not that it's being selected *for*; it's that it's impossible to select *against* without breaking the jaw. That's the "architectural" argument.

  **Elena:** Okay, let's get into the weeds of testability. This is where I get stuck with the Spandrels critique. You say "impossible to select against." How do you test impossibility?

  **Marcus:** You look for exceptions. Are there populations with genetic anomalies that decouple the growth fields? Do pathologies exist where the chin is absent but the jaw functions? If the chin is truly functionless debris, its absence shouldn't impact fitness. If it's adaptive, absence should be costly.

  **Elena:** Fine. Let's say we find a population where the chin is reduced, and they have no increase in jaw fractures or decrease in mating success. I concede the point. The adaptationist model is falsified. But here is my counter: How do you prove it *wasn't* selected for in the past? Environment changes. Maybe it was for chewing tough tubers two million years ago, and now it's neutral.

  **Marcus:** Then it's a historical adaptation, not a current one. But Gould's point was about the *origin*. If the origin is developmental, the adaptationist story about the origin is wrong. And getting the history wrong matters. If you think the chin is for fighting, you look for aggression markers in the fossil record. If you think it's developmental, you look for cranial flexion markers. You go to different dig sites. You measure different bones.

  **Elena:** So your objection is pragmatic. Methodological adaptationism leads research down the wrong alley.

  **Marcus:** Yes. It creates a confirmation bias loop. You assume function, you measure variables related to function, you find a correlation, you publish. You ignore the developmental variables because they aren't in your model.

  **Elena:** But Marcus, be honest. The pluralist approach can be a dead end too. "It's just constraint." "It's just drift." That can stop inquiry just as fast. If I tell a grad student "the chin is a spandrel," they go home. If I tell them "model the optimal chin shape for stress," they have a thesis. They might prove me wrong, but they'll generate data.

  **Marcus:** I'm not saying stop inquiry. I'm saying start with a pluralist null. The null shouldn't be "Optimal Design." The null should be "Phylogenetic Inertia and Developmental Constraint." Selection is the *alternative* hypothesis that requires positive proof.

  **Elena:** But selection is the only thing that explains *fit*. The chin fits the soft tissue. The teeth fit the bone.

  **Marcus:** Because development is integrated! The soft tissue grows *with* the bone. They signal each other. You don't need natural selection to explain why they match; you need epigenetics.

  **Elena:** [Pauses, stirs her espresso] You know, Godfrey-Smith breaks this down into three things. Empirical, Explanatory, and Methodological. I think we agree on the Empirical. We both know not everything is an adaptation.

  **Marcus:** We do.

  **Elena:** We disagree on the Methodological. You want the Pluralist Null. I want the Adaptationist Null. But I think the real friction is the Explanatory. You think that if a trait *can* be explained by constraint, the adaptationist explanation is invalid. I think they can coexist.

  **Marcus:** They can. But they have different weights. If the developmental constraint explains the *presence* of the trait, and selection explains the *refinement*... that I can live with. My worry is when adaptationists claim selection explains the *presence*. That's the Spandrels claim. The arch didn't select for the painting on the spandrel. The arch exists because of the dome. The painting is secondary.

  **Elena:** Okay. Let's apply that to the chin. If I want to convince you, I can't just show a model. I need comparative data. I need to show that among primates with similar jaw mechanics, those with higher social stress have larger chins. Independent of the growth fields.

  **Marcus:** Yes. That would be independent evidence. Correlating the trait with the proposed selective pressure across taxa, controlling for phylogeny.

  **Elena:** And if you want to convince me?

  **Marcus:** I need to show that manipulating the growth fields in a model organism eliminates the chin without altering the proposed function. If I can engineer a mouse with a "chin-less" jaw that eats and mates fine, your stress hypothesis weakens.

  **Elena:** Fair. But that's hard.

  **Marcus:** Science is hard. That's why "it's an adaptation" shouldn't be the easy default.

  **Elena:** But consider the cost of error. If I assume it's a spandrel and it's actually a signal for disease resistance, I miss a medical insight. If you assume it's a signal and it's a spandrel, you waste some grant money on dimorphism measurements.

  **Marcus:** [Laughs] You think wasted grant money is the lesser evil? I think the cost is conceptual. It reinforces the idea that organisms are perfectly designed machines. It blinds us to the messy, historical, contingent nature of life. It makes biology engineering instead of history.

  **Elena:** But biology *is* engineering, Marcus. It's reverse engineering. We are looking at the machine and asking how it works. If we assume the parts are junk, we stop looking for the function.

  **Marcus:** And if we assume the parts are optimized, we invent functions that aren't there. We end up with evolutionary psychology nonsense about why we like sunsets.

  **Elena:** Touché.

  **Marcus:** Look. I'm not saying don't use models. Use them. But acknowledge the assumption. When you publish your optimality model, state clearly: "This assumes selection is the dominant force shaping this trait." Don't hide it in the math.

  **Elena:** And you acknowledge that "constraint" isn't a magic wand. Saying "it's developmental" requires a mechanism just as much as "it's adaptive" does. Gould's growth field intersection is a mechanism. That's good. But often, "constraint" is just a placeholder for "I don't know the selection pressure."

  **Marcus:** Agreed. "Spandrel" shouldn't be a conversation stopper either. It should be a claim: "Here is the developmental necessity that produces this trait."

  **Elena:** So, the chin. Where do we stand?

  **Marcus:** I stand with Gould. The ontogenetic evidence is strong. The intersection of the alveolar and basal fields predicts the chin without invoking selection. The burden is on you to show why that's insufficient.

  **Elena:** And I stand with the data gap. The ontogeny explains the *mechanism of formation*, but not necessarily the *maintenance*. Why didn't selection remove it if it's costly? Or why didn't it drift away? I suspect there's a weak stabilizing selection keeping it, even if it originated as a byproduct.

  **Marcus:** Weak selection is hard to distinguish from drift.

  **Elena:** Exactly. Which is why I need to keep modeling.

  **Marcus:** And which is why I need to keep measuring growth fields.

  **Elena:** [Raises cup] To the stalemate?

  **Marcus:** [Clinks cup] To the tension. It's the only thing that keeps the field honest.

  **Elena:** Just promise me one thing. If you write a paper on the chin, don't call my model a "just-so story" unless you've actually tried to falsify the prediction.

  **Marcus:** And you promise not to call my constraint hypothesis "defeatist" unless you've looked at the ontogenetic data.

  **Elena:** Deal.

  **Marcus:** Good. Now, buy me another espresso. All this philosophy is exhausting.

  **Elena:** Only if you admit that shorebird foraging models are beautiful.

  **Marcus:** They are elegant. I'll give you elegant. But are they true?

  **Elena:** Don't push it.
