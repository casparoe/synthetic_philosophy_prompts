      *   *The Conflict:* How do you prove it's *not* adaptive vs. how do you prove it *is*?

  4.  **Key Philosophical Concepts to Weave In:**
      *   **Just-So Stories:** Narratives without independent evidence.
      *   **Optimality Models:** Mathematical predictions based on trade-offs.
      *   **Godfrey-Smith's Three Adaptationisms:**
          1.  *Empirical:* Most traits are adaptations. (False, say pluralists).
          2.  *Explanatory:* Adaptation is the most important explanation. (Debatable).
          3.  *Methodological:* Start by assuming adaptation to generate hypotheses. (The core dispute).
