      *   If God is space-like (in terms of immensity), He cannot move because there is no "outside" for Him to move into. He *is* the container.
      *   Creatures exist *in* space. Therefore, they can change location relative to absolute space.
      *   *The Smuggling:* The user is right. Newton *is* using his physics/metaphysics of space to define divinity. If you don't accept Newton's specific view of space/God, the argument fails. But within his system, it's consistent.

  5.  **Historical/Theological Context (Arianism/Socinianism):**
      *   Traditional Trinity: Father and Son are *homoousios* (same substance). If Father is immutable, Son must be immutable.
      *   Newton's Heresy: The Son is a Mediator, a created God (divine but not the Supreme God).
      *   Why Immovability? In classical theism, immutability is a key divine attribute. If Jesus walked on earth, died, rose, and ascended, he underwent change and movement.
      *   Newton pushes this further: It's not just about the Incarnation (which Trinitarians explain via two natures). Newton argues the Son's *ontological status* is inherently moveable.
