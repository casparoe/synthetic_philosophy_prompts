      *   *Newton's Theology:* He was an Arian/Socinian (anti-Trinitarian). He believed the Father was the one true God, and the Son was a created divine being, subordinate to the Father.
      *   *Keynes MS 8:* Yes, this is a known manuscript. The "Twelve Articles" are a summary of his heterodox beliefs.
      *   *Article 5 Content:* The quote provided matches Newton's typical phrasing regarding God's omnipresence and immutability.
      *   *Physics/Theology Connection:* Newton famously linked space to God's "sensorium" (though he later walked this back slightly) or viewed space as an emanation of God's existence. Absolute space is immutable and eternal.
      *   *The Logic:* If God is defined by certain metaphysical attributes (aseity, immutability, omnipresence in a specific way), and Christ lacks one (movability), then Christ lacks the *essence* of the Father.

  3.  **Deconstruct the Logic of Article 5:**
      *   *Premise 1:* The Father is defined by "immoveability" in a metaphysical sense (not just physical, but ontological). He fills space by "eternal necessity of nature."
      *   *Premise 2:* All *other* beings (created things) are "moveable from place to place."
      *   *Observation:* Christ (the Son) is a being.
      *   *Implicit Premise:* If Christ were fully God (consubstantial with the Father), he would share the Father's attribute of immovability/necessary omnipresence.
