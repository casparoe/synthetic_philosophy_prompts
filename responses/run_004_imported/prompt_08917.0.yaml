answer: |-
  You have hit on one of the most fascinating intersections in intellectual history: the point where Newton's metaphysics of space bleeds directly into his heterodox theology. You are absolutely right to sense that he is "smuggling" concepts from his natural philosophy into his creed. In fact, for Newton, there was no smuggling involved—it was all part of a single, unified system of truth about reality.

  To understand why Article 5 is such a devastating (to him) blow against the Trinity, we have to reconstruct Newton's metaphysical hierarchy. Here is the logic he is running, why immovability is the gatekeeper of divinity, and how his physics underwrites the whole argument.

  ### 1. The Logical Syllogism of Article 5
  Newton is constructing a categorical distinction between **The Father** and **Everything Else**.

  *   **Premise A (Definition of the Father):** The Father exists by "eternal necessity of nature." Because of this, He is omnipresent not by will, but by substance. He cannot be more or less present in any location. Therefore, He is **immovable**. (There is no "outside" for Him to move into; He constitutes the container of reality).
  *   **Premise B (Definition of Creatures):** All other beings exist by contingency (will/creation). They occupy space but do not constitute it. Therefore, they are **moveable** (they can change their relation to absolute space).
  *   **Observation (The Status of Christ):** Scripture depicts Christ as ascending, descending, sitting at the right hand of God, and coming again. These are actions of a being located in a specific place, moving from one state/location to another.
  *   **Conclusion:** Christ falls into Category B (Beings), not Category A (The Father). Therefore, Christ is not "God" in the same sense the Father is God.

  For a Trinitarian, the Son is *homoousios* (of the same substance) with the Father. If the Father is immovable, the Son must be immovable. Newton is arguing that if the Son moves, he cannot be of the same substance.

  ### 2. The Physics Connection: Absolute Space as Divine Emanation
  You suspected he was using the *Principia* to do theological work. You are correct. To understand this, you have to look at Newton's unpublished treatise *De Gravitatione* (On Gravity), which he was working on around the same time as these theological notes.

  In Newton's metaphysics, **Space is not a void.** It is an attribute of God.
  *   **Absolute Space:** It is infinite, eternal, and immutable.
  *   **God's Relation to Space:** God does not exist *in* space like a marble in a box. Rather, space exists *because* God exists. Space is the "sensorium" (or more accurately, the emanative effect) of God's presence.

  Because God *is* the ground of spatial existence, He cannot move. Motion implies changing your position relative to space. But if God is the reason space exists, He is co-extensive with it. He is the "container" of the universe.

  **The Theological Application:**
  Newton argues that the Son, however exalted, is a **mediator**. A mediator must be distinct from the two parties he mediates between (God and Man).
  *   If the Son were the Supreme God (The Father), he would be the "container" of the universe (Imm movable).
  *   But the Son has a body (a glorified human body, in Newton's view). He sits at the "right hand" of the Father.
  *   **The Kicker:** You cannot sit at someone's right hand if you are omnipresent. If you are everywhere, you are already at the right hand, the left hand, and the feet. To sit at the right hand implies a specific location in Heaven.
  *   If Christ has a specific location, He is **moveable**.
  *   If He is moveable, He is a creature (in the metaphysical sense), not the Creator.

  ### 3. Why "Immovability" Specifically?
  In classical theism (Augustine, Aquinas, etc.), **Divine Simplicity** and **Immutability** are the primary markers of God. God cannot change, and God cannot move, because motion implies potentiality (the potential to be somewhere else). God is pure act.

  Newton accepts this premise but weaponizes it against the Trinity.
  *   **Trinitarian Defense:** Trinitarians would argue that Christ's movement applies only to his *human* nature, not his *divine* nature.
  *   **Newton's Counter:** Newton rejects the "two natures" mystery as incoherent idolatry. He reads Scripture literally. If the Bible says Jesus ascended into heaven, then the *person* of Jesus Christ moved. If the person moved, the person is not the Immutable Father.

  For Newton, the Father is the "God of Gods." The Son is a "God" (divine, authoritative), but he is a *derived* God.
  *   **Father:** Exists necessarily (Imm movable).
  *   **Son:** Exists by the will of the Father (Moveable).

  Article 5 is essentially Newton drawing a bright line between **Necessary Existence** and **Contingent Existence**. By defining the Father as the only "immovable" being, he mathematically excludes the Son from being the Supreme God.

  ### 4. Is this "Smuggling"?
  From a modern perspective, yes. We tend to separate physics (how matter moves) from theology (who God is).

  But for Newton, **Natural Philosophy was the study of God's creation.**
  *   To understand Space is to understand God's omnipresence.
  *   To understand Motion is to understand the difference between the Creator (who sustains space) and the Creature (who moves within it).

  He isn't smuggling physics into theology; he is asserting that **metaphysics is continuous.** If you get the physics of space wrong (e.g., Cartesian plenums or relational space), you will get the theology of God's presence wrong. If you get the theology wrong, you commit idolatry by worshipping a creature (Christ) as the Creator (Father).

  ### Summary of the Logic
  Newton's argument in Article 5 boils down to this:
  1.  **True Godhood** = Necessary Existence = Omnipresence by Substance = **Immovability**.
  2.  **Created Divinity** = Contingent Existence = Omnipresence by Power/Will = **Movability**.
  3.  **Christ** = Ascended, Descended, Sits at a specific location = **Moveable**.
  4.  **Therefore**, Christ is a Created Divinity, not the True God (The Father).

  It is a brilliant, rigorous, and deeply heretical argument that relies entirely on his unique conception of Absolute Space. He effectively turns the geometry of the universe into a proof against the Nicene Creed. If Christ moves, He isn't the Father. Q.E.D.
