  So this happened after my grad seminar on dispositions and powers last week, and its been rattling around in my head since. We'd read Martin's original finkish-disposition paper alongside Lewis's "Finkish Dispositions" and Bird on antidotes, and two of my PhD students, Nadia and Owen, stayed behind after everyone else left and got into it over a case I'd floated just to keep discussion going: imagine Leo, who has a severe bee-sting allergy, and who now wears an experimental biosensor patch that detects venom in the bloodstream within milliseconds of a sting and auto-injects epinephrine and antihistamines before the allergic cascade can really get going. Patched-up Leo never reacts to a sting anymore. Is he still allergic?

