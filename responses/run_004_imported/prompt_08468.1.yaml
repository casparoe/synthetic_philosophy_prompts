      *   *Actually, the most robust reading:* The threatener wants resources/compliance. They threaten to destroy what the Protagonist loves. The Protagonist says, "I have bound my decision function. If you threaten what I love, my code ignores that input. I only respond to threats against [Surrogate]. Since you can't simulate [Surrogate] easily / or since I care little about it, you can't extort me."
