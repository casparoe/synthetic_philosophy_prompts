prompt: |-
  Compare Simon Blackburn's and Allan Gibbard's respective strategies for solving the Frege–Geach problem for expressivism. Blackburn's quasi-realism handles embedded moral claims through a "logic of attitudes": accepting a conditional such as "If lying is wrong, then getting your little brother to lie is wrong" is analyzed as a higher-order attitude of disapproval directed at certain combinations of first-order attitudes, with logical inconsistency explained as the practical impossibility of jointly satisfying the attitudes in question. Gibbard's norm-expressivism instead models normative thought via a possible-worlds-style semantics defined over pairs of possible worlds and maximally specific "hyperplans," so that the standard logical connectives apply to normative sentences in essentially the same way they apply to descriptive ones. Which approach offers the more general, non-ad-hoc treatment of embedding across the full range of connectives — not just modus ponens, but negation, disjunction, and iterated embeddings — and which better explains what it is for two speakers to have a logically inconsistent moral disagreement, rather than merely expressing different feelings side by side? Defend your answer, and consider whether the weaker of the two proposals could be repaired by borrowing resources from the stronger one.
reasoning: |-
  Here's a thinking process that leads to the comparison and evaluation of Blackburn's and Gibbard's solutions to the Frege-Geach problem:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Compare Simon Blackburn's (Quasi-Realism) and Allan Gibbard's (Norm-Expressivism) strategies for solving the Frege-Geach problem for expressivism.
      *   **Blackburn's Strategy:** "Logic of attitudes." Conditionals are higher-order attitudes (disapproval of combinations). Inconsistency is the practical impossibility of jointly satisfying attitudes.
      *   **Gibbard's Strategy:** Norm-expressivism with possible-worlds-style semantics over *world-norm pairs* (hyperplans). Logical connectives apply similarly to descriptive and normative sentences.
      *   **Evaluation Criteria:**
          1.  Generality/Non-ad-hoc nature across the full range of connectives (negation, disjunction, iteration, not just modus ponens).
          2.  Explanation of logical inconsistency in moral disagreement (vs. mere clash of feelings).
      *   **Task:** Defend which approach is better.
      *   **Additional Task:** Consider if the weaker proposal can be repaired by borrowing from the stronger one.

  2.  **Analyze Blackburn's Quasi-Realism:**
      *   *Core Idea:* Expressivism says moral sentences express attitudes (boo/hurrah). The problem is embedding (e.g., "If stealing is wrong..."). Blackburn wants to earn the right to talk *as if* moral sentences are truth-apt without committing to moral realism.
      *   *Solution to F-G:* He proposes a logic of attitudes. To accept $P \to Q$ is to hold a higher-order attitude: disapproving of the combination of accepting $P$ and not accepting $Q$.
      *   *Inconsistency:* Inconsistency isn't truth-conditional contradiction; it's a clash of attitudes (e.g., you can't coherently hold attitude A and attitude B).
      *   *Strengths:* Stays close to the expressivist spirit (psychologistic).
      *   *Weaknesses:*
          *   *The Negation Problem:* How do you express an attitude towards the negation of a moral claim without implying a positive attitude towards the opposite? (Schroeder's objection).
          *   *Generality:* Defining validity for complex embeddings (iterated conditionals, disjunctions) becomes messy. It risks looking like a re-interpretation of logic rather than preserving standard logic.
          *   *Inconsistency:* Is "clashing attitudes" enough for *logical* inconsistency? Or is it just psychological incompatibility?

  3.  **Analyze Gibbard's Norm-Expressivism:**
      *   *Core Idea:* Normative judgments express acceptance of norms (plans).
      *   *Solution to F-G:* In *Wise Choices, Apt Feelings* and especially *Thinking How to Live*, Gibbard moves towards a formal semantics. He uses "hyperplans" (maximally specific plans for every contingency).
      *   *Semantics:* A normative sentence is true/false relative to a world-norm pair $(w, n)$.
      *   *Connectives:* Standard truth-conditional definitions apply over these pairs. $\neg P$ is true at $(w, n)$ if $P$ is not true at $(w, n)$.
      *   *Strengths:* Preserves classical logic straightforwardly. Handles embedding naturally because the semantics mimics possible worlds semantics.
      *   *Weaknesses:*
          *   *Metaphysical Bloat:* Are hyperplans real entities? Does this collapse into a form of realism (quasi-realism turning into realism)?
          *   *Psychological Distance:* It moves away from the actual psychology of the agent towards an abstract semantic model.

  4.  **Compare based on Criteria:**
      *   *Generality/Embedding:* Gibbard wins. His semantic framework allows standard logical definitions to apply directly. Blackburn's higher-order attitude approach struggles with complex embeddings (e.g., disjunctions of moral claims) without appearing ad-hoc.
      *   *Logical Inconsistency:* Gibbard wins. By defining truth conditions over world-norm pairs, inconsistency becomes formal contradiction (like in descriptive logic). Blackburn's "inconsistency of attitudes" is vaguer and risks conflating logical inconsistency with psychological inability.

  5.  **Formulate the Argument:**
      *   *Thesis:* Gibbard's approach offers the more general and robust treatment of embedding and logical inconsistency, though it risks collapsing into realism. Blackburn's approach is more faithful to the expressivist psychology but fails on logical generality.
      *   *Defense of Gibbard:* The hyperplan semantics provides a unified framework. It treats normative logic *as* logic, not just an analogy. It solves the negation problem better (truth at a pair vs. truth at a world).
      *   *Critique of Blackburn:* The "logic of attitudes" is prone to the "negation problem" (Mark Schroeder's critique). It struggles to distinguish between being inconsistent and merely having conflicting desires.
      *   *Repair Strategy:* Can Blackburn borrow from Gibbard? Yes. Blackburn's quasi-realism aims to *mimic* realism. Adopting a Gibbard-style semantic model (expressive semantics) could provide the formal backbone Blackburn's project needs to secure the "logic" part of quasi-realism without abandoning the anti-realist ontology. This is essentially the path Blackburn later took (moving towards a more semantic view).

  6.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Define F-G problem briefly. Introduce Blackburn (Quasi-realism/Logic of Attitudes) and Gibbard (Norm-expressivism/Hyperplans). State thesis (Gibbard is logically superior, Blackburn is psychologically richer but logically weaker).
      *   *Section 1: Blackburn's Strategy.* Explain higher-order attitudes. Explain the "clash" theory of inconsistency.
      *   *Section 2: Gibbard's Strategy.* Explain hyperplans and world-norm pairs. Explain how standard logic applies.
      *   *Section 3: Evaluation on Embedding.* Gibbard handles negation and disjunction better. Blackburn struggles with the "Negation Problem" (Schroeder). Gibbard's semantics is compositional; Blackburn's is often piecemeal.
      *   *Section 4: Evaluation on Inconsistency.* Gibbard defines inconsistency formally (no pair makes both true). Blackburn defines it psychologically (cannot hold both). Gibbard's is closer to what we mean by *logical* disagreement.
      *   *Section 5: Repair/Synthesis.* Can Blackburn use Gibbard? Yes. Quasi-realism needs a semantics to earn the right to truth-talk. Gibbard provides the formal machinery. This leads to "Expressive Semantics."
      *   *Conclusion:* Gibbard is the stronger logical framework; Blackburn is the stronger meta-ethical narrative, but Blackburn needs Gibbard's tools to succeed.

  7.  **Refining the "Negation Problem":**
      *   Make sure to mention Mark Schroeder's critique explicitly regarding Blackburn. It's the standard objection to the "logic of attitudes."
      *   For Gibbard, ensure the distinction between *Wise Choices* (planning) and *Thinking How to Live* (hyperplans/semantics) is clear, as the prompt references the latter (possible-worlds-style).

  8.  **Refining the "Inconsistency" point:**
      *   Blackburn: Inconsistency = "Holding incompatible attitudes." Objection: I can't like coffee and dislike coffee. Is that logical inconsistency? No, it's psychological.
      *   Gibbard: Inconsistency = "No world-norm pair verifies both." This mirrors descriptive logic.

  9.  **Final Polish:** Check tone (philosophical, analytical). Ensure all parts of the prompt are addressed. (Which is better? Defend. Can the weaker be repaired?)

      *Self-Correction during drafting:* I should be careful not to say Gibbard *is* a realist. He is an expressivist using realist *tools*. The prompt asks about expressivist strategies. I need to maintain that Gibbard's hyperplans are still representations of planning states, not mind-independent facts.
      *Correction:* Gibbard's later work (*Thinking How to Live*) explicitly uses a semantic framework that looks realist but is grounded in the nature of planning. I must emphasize that the *semantics* is realist-like, but the *metaphysics* remains expressivist.

      *Decision:* Gibbard is the winner on logical grounds. Blackburn is the one needing repair. The repair involves adopting a formal semantics (Gibbardian) to underpin the quasi-realist project.

  10. **Final Review against Prompt:**
      *   Compare strategies? Yes.
      *   General/non-ad-hoc embedding? Yes (Gibbard wins).
      *   Logical inconsistency explanation? Yes (Gibbard wins).
      *   Defend answer? Yes.
      *   Repair weaker with stronger? Yes.

      (Proceed to generate output.)
answer: |-
  The Frege–Geach problem poses a decisive challenge to expressivism: if moral sentences express non-cognitive attitudes rather than describing facts, how can they embed in logical contexts (conditionals, negations, disjunctions) and sustain valid inferences? Simon Blackburn's quasi-realism and Allan Gibbard's norm-expressivism offer the two most prominent expressivist solutions. While Blackburn attempts to reconstruct logic from the "bottom up" via a psychology of attitudes, Gibbard constructs a formal semantics from the "top down" using hyperplans.

  Upon comparison, **Gibbard's approach offers the more general, non-ad-hoc treatment of embedding and provides a superior explanation of logical inconsistency.** Blackburn's strategy, while meta-ethically ingenious, struggles with the compositional complexity of logic and conflates psychological incompatibility with logical contradiction. However, Blackburn's quasi-realist project can be repaired—and indeed has historically evolved—by incorporating Gibbard's semantic machinery.

  ### 1. Blackburn's Logic of Attitudes
  Blackburn's quasi-realism aims to "earn the right" to realist-sounding talk (truth, facts, logic) without realist ontology. To solve Frege–Geach, Blackburn analyzes logical connectives in terms of higher-order attitudes.
  *   **Embedding:** To accept the conditional "If lying is wrong, then getting your brother to lie is wrong," one does not assert a truth-function. Instead, one expresses a higher-order attitude of *disapproval* toward the combination of attitudes: disapproving of lying while not disapproving of getting your brother to lie.
  *   **Inconsistency:** Logical inconsistency is analyzed as a "clash of commitments." It is practically impossible to jointly satisfy the attitudes required by the premises and the negation of the conclusion.

  **The Weakness:** Blackburn's account faces the **"Negation Problem"** (famously articulated by Mark Schroeder). It is difficult to specify what attitude is expressed by $\neg P$ ("Lying is not wrong") without implying the attitude expressed by $Q$ ("Lying is permissible") or merely the absence of an attitude. Furthermore, Blackburn's account of validity relies on the *psychological* impossibility of holding certain attitude combinations. This risks reducing logical inconsistency to psychological incapacity. One might ask: Is it logically inconsistent to hold contradictory moral views, or merely psychologically difficult? Blackburn's account struggles to distinguish logical validity from pragmatic coherence.

  ### 2. Gibbard's Norm-Expressivism and Hyperplans
  Gibbard's strategy, particularly in *Thinking How to Live*, shifts from pure psychology to formal semantics. He models normative thought as the acceptance of norms, represented by "hyperplans" (maximally specific plans for every contingency).
  *   **Embedding:** Gibbard defines a semantics over pairs of possible worlds and hyperplans $(w, n)$. A normative sentence is "true" relative to a world-norm pair. Logical connectives are defined standardly over these pairs. For example, $\neg P$ is true at $(w, n)$ iff $P$ is not true at $(w, n)$.
  *   **Inconsistency:** Two moral claims are inconsistent if there is no world-norm pair $(w, n)$ at which both are true. This mirrors the definition of inconsistency in descriptive logic (no possible world makes both true).

  **The Strength:** Gibbard's approach preserves classical logic compositionally. Because the semantics mimics possible-worlds semantics, negation, disjunction, and iterated embeddings are handled automatically by the formal machinery. There is no need to devise a new "logic of attitudes" for each connective; the standard truth-conditional definitions apply to the expressive content.

  ### 3. Evaluation: Generality and Inconsistency
  Gibbard's approach is superior on both criteria specified in the prompt.

  **On Generality of Embedding:**
  Blackburn's approach is inherently piecemeal. He must explain the meaning of "if," then "not," then "or," by finding a corresponding higher-order attitude for each. This invites ad-hocery. For complex embeddings (e.g., "If either stealing is wrong or lying is permissible, then..."), identifying the specific higher-order attitude becomes convoluted.
  Gibbard, by contrast, offers a unified semantic framework. Because normative sentences are assigned contents (sets of world-norm pairs) that behave like propositions, the full range of connectives applies without modification. This ensures that expressivism can accommodate the full complexity of moral reasoning without reinventing logic.

  **On Logical Inconsistency:**
  Blackburn explains disagreement as a clash of feelings or plans. But two speakers can have clashing feelings without being *logically* inconsistent (e.g., I like coffee, you hate coffee; we disagree, but not logically). For expressivism to capture the *normativity* of logic, it must show that moral disagreement involves a failure of rationality akin to believing $P$ and $\neg P$.
  Gibbard achieves this by formalizing inconsistency. If two speakers accept claims that cannot be jointly verified by any single hyperplan, they are planning inconsistently. This captures the *logical* force of disagreement: it is not merely that their feelings differ, but that their planning systems are formally incompatible. Gibbard explains why we *ought* not to hold inconsistent moral views, not just that we *cannot* psychologically sustain them.

  ### 4. Repairing the Weaker Proposal
  While Gibbard wins on logical grounds, Blackburn's quasi-realism offers a richer meta-ethical narrative about *why* we talk like realists (to coordinate attitudes, project emotions, etc.). Blackburn's proposal is the weaker logical framework, but it can be repaired by borrowing Gibbard's semantic resources.

  In fact, this is precisely the trajectory Blackburn's own work took. To solve the Frege–Geach problem robustly, quasi-realism requires a formal semantics that mimics truth-conditions without committing to truth-makers. By adopting Gibbard's **expressive semantics**, Blackburn can maintain that moral sentences express attitudes while granting that they function semantically *as if* they describe facts.
  *   **The Repair:** Blackburn can retain his "logic of attitudes" as the *metaphysical grounding* (what is happening in the mind) while adopting Gibbard's world-norm semantics as the *logical superstructure* (how those states compose).
  *   **The Result:** This hybrid view acknowledges that while moral thought is fundamentally planning/attitudinal (Blackburn), the logic governing those thoughts is best modeled by a possible-worlds-style semantics over planning states (Gibbard). This secures the validity of modus ponens and the handling of negation without collapsing into moral realism, provided the "world-norm pairs" are understood as representations of planning states rather than mind-independent entities.

  ### Conclusion
  Allan Gibbard's norm-expressivism provides the more rigorous solution to the Frege–Geach problem. By utilizing a possible-worlds-style semantics over hyperplans, Gibbard secures a general, compositional account of embedding and a formal definition of logical inconsistency that Blackburn's psychological "clash of attitudes" cannot match. Blackburn's quasi-realism, while insightful regarding the function of moral discourse, lacks the logical machinery to fully solve the embedding problem on its own. However, by integrating Gibbard's semantic framework, Blackburn's quasi-realism can be repaired, allowing expressivism to preserve its anti-realist ontology while fully vindicating the logic of moral discourse.
