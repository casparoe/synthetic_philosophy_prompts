prompt: |-
  I have spent a long time reading the rationalist and effective-altruism blogospheres, and one move I keep encountering in threads about personal identity is an appeal to Buddhism on behalf of what is usually called "open individualism" -- Daniel Kolak's term for the view that there is really only a single subject underlying every experience anyone has ever had, so that the sense of being a separate person is a kind of perspectival illusion. The argument I keep running into goes roughly: Buddhism teaches that there is no enduring self (anatta); the boundary you draw around "your" experiences versus "someone else's" therefore isn't doing any metaphysical work; so at bottom there is just one experiencer wearing different masks. This is usually set against "empty individualism," the rival reductionist position (closer to what I associate with Parfit, or with Buddhist accounts of momentariness) on which there is not even a persisting subject within a single life -- only a series of discrete, causally linked experiences, none of which is more "you" than any other. (Kolak's third category, "closed individualism," is just the common-sense view and doesn't seem to be what anyone in these threads is actually fighting about.) A friend of mine who has read far more Kolak than I have insists that open individualism is basically what the Buddha was getting at all along, and that Buddhologists who deny this just haven't caught up with him.

  I am not convinced the canonical material actually licenses that move, and I would like you to make the case in some detail rather than just asserting it. Specifically, please argue that anatta -- as developed through the analysis of the person into the five skandhas, the doctrine of dependent origination, and the notion of the santāna (the causally linked but non-identical mental stream that is what actually "continues" from moment to moment, and, on the traditional account, from life to life, without any self doing the continuing) -- supports empty individualism far better than it supports open individualism. I would like the argument to also establish that reading anatta as evidence for a single universal subject quietly reintroduces something like the Upanishadic identification of ātman with brahman, exactly the kind of view the doctrine was originally formulated to rule out.

  I would also like you to take on the strongest objection available to someone defending the open-individualist reading: Mahayana notions like buddha-nature (tathāgatagarbha) and the Dharmakāya, and non-dual traditions such as Dzogchen or Zen, all of which can sound like they are describing one pervasive awareness underlying all beings. Please explain concretely why these traditions do not actually rescue the open-individualist interpretation, rather than simply noting that they exist and moving on.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The relationship between Buddhist metaphysics (specifically *anatta*, *skandhas*, *pratītyasamutpāda*, *santāna*) and theories of personal identity (Open Individualism vs. Empty Individualism).
      *   **User's Stance:** Skeptical of the claim that Buddhism supports Open Individualism (OI). Believes it supports Empty Individualism (EI) (Parfitian/Buddhist momentariness). Suspects OI readings smuggle in Upanishadic *ātman/brahman*.
      *   **Task:** Argue *in detail* that canonical Buddhist doctrine supports EI over OI. Explain why OI reintroduces *ātman*. Address the strongest objection: Mahayana concepts like *tathāgatagarbha* (Buddha-nature), *Dharmakāya*, and non-dual traditions (Dzogchen/Zen).
      *   **Tone:** Philosophical, rigorous, respectful of the source material, avoiding mere assertion.

  2.  **Deconstruct the Core Arguments:**

      *   **Open Individualism (OI):** One subject, many experiences. "I am everyone."
      *   **Empty Individualism (EI):** No subject, just experiences (or causal streams). "There is no I."
      *   **Closed Individualism (CI):** One subject per body/life. (Common sense, rejected by both OI and EI).
      *   **Buddhist Core:** *Anatta* (no-self), *Anicca* (impermanence), *Dukkha* (suffering).
      *   **The Conflict:** OI proponents say "No separate self = One Big Self." EI proponents say "No separate self = No Self at all, just processes."

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the prevalence of the OI reading in rationalist/EA circles (Kolak, etc.). State the thesis: Canonical Buddhism aligns with EI, and OI is a category error that reintroduces *ātman*.

      *   **Part 1: The Canonical Case for Empty Individualism.**
          *   *Anatta* and the *Skandhas*: The Buddha's method is deconstruction, not unification. If you look for the self in form, feeling, perception, formations, consciousness, you find none. OI assumes there *is* a subject, just a shared one. Buddhism says the *search* for the subject is the error.
          *   *Pratītyasamutpāda* (Dependent Origination): Identity is relational and causal, not substantial. Experiences arise due to conditions. There is no "experiencer" behind the experience. OI requires a container for experiences; Buddhism denies the container.
          *   *Santāna* (Continuum): This is crucial. Rebirth happens without a soul. It's like a flame passing from candle to candle. This supports EI (causal continuity without identity) rather than OI (numerical identity of subject). If there were one subject, karma would be incoherent (why does *this* stream suffer if *I* am everyone?).

      *   **Part 2: The Upanishadic Smuggle (The Metaphysical Error).**
          *   Compare *Atman/Brahman* (Sat-Chit-Ananda, eternal, unchanging) with *Anatta*.
          *   OI posits a "Single Subject." This subject must be enduring to be the *same* subject across time and beings.
          *   This violates *Anicca* (impermanence).
          *   This violates the soteriological goal. The goal is cessation of clinging, not realizing "I am the Universe." Realizing "I am everyone" can inflate ego (cosmic ego), whereas realizing "There is no I" deflates it.
          *   Reference the *Alagaddupama Sutta* (Snake Simile): Clinging to views, even subtle ones, is suffering.

      *   **Part 3: Addressing the Mahayana/Non-Dual Objection.**
          *   *Tathāgatagarbha* (Buddha-nature): Often misunderstood as a self. Need to clarify it as *potentiality* or *emptiness* itself, not a substance. Cite the *Ratnagotravibhāga* or similar texts that warn against mistaking it for *ātman*.
          *   *Dharmakāya*: The "truth body." It's not a mind; it's the nature of reality. It's not a subject experiencing things.
          *   *Dzogchen/Zen (Rigpa/Original Mind)*: This is the trickiest part. They speak of "One Mind."
          *   *Counter-argument:* In these traditions, "One Mind" is not a numerical singular subject (like a monad). It is the *emptiness* of all minds. It is non-dual, meaning subject-object duality collapses, not that all subjects merge into one big subject.
          *   *Distinction:* Non-duality (advaya) $\neq$ Monism (advaita in the Vedantic sense). Buddhism is often non-dual but not ontologically monist in the OI sense.
          *   *Functional Argument:* If OI were true, enlightenment would be instantaneous for all beings once one is enlightened (since there's only one experiencer). Traditional Buddhism rejects this (though Huayan has "interpenetration," it doesn't negate individual karmic trajectories in the conventional truth).

      *   **Conclusion:** Summarize. The OI reading is a philosophical imposition, not an exegesis. EI captures the liberating insight of *anatta* without positing a metaphysical entity.

  4.  **Refining and Polishing:**
      *   *Check Terminology:* Ensure *santāna*, *skandhas*, *tathāgatagarbha*, *dharmakāya* are used correctly.
      *   *Check Logic:* Make sure the distinction between "no boundary" (OI) and "no thing to have a boundary" (EI) is sharp. This is the crux.
      *   *Tone Check:* Ensure it doesn't sound dismissive of OI as a philosophical position (it has merit in analytic metaphysics), but specifically dismissive of it *as Buddhism*.
      *   *Addressing the Friend:* Acknowledge the friend's Kolak influence but pivot to textual fidelity.

  5.  **Self-Correction/Nuance during drafting:**
      *   *Correction:* I need to be careful not to say Mahayana *never* sounds like OI. It does. I need to explain *why* that appearance is misleading hermeneutically.
      *   *Nuance:* Parfit's EI isn't *exactly* Buddhist momentariness (Parfit is reductionist, Buddhism is often process ontology), but they are functionally equivalent regarding personal identity. I should clarify that alignment.
      *   *Emphasis:* Highlight the ethical/soteriological consequence. OI leads to "Universal Love because it's all me." Buddhism leads to "Compassion because there is suffering, but no one to own it." The motivation differs.

  6.  **Final Review against constraints:**
      *   Did I argue for EI? Yes.
      *   Did I explain the *ātman* smuggle? Yes.
      *   Did I address Mahayana/Dzogchen? Yes.
      *   Is it detailed? Yes.

  7.  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a sophisticated metaphysical dispute that cuts to the heart of how we interpret the soteriological aim of Buddhism versus how we categorize it within analytic philosophy of mind. Your skepticism is well-founded. The move to equate Buddhist *anatta* (no-self) with Open Individualism (OI) is a frequent occurrence in rationalist and transhumanist circles, largely because OI offers a comforting ethical payload (altruism becomes rational self-interest) that resonates with Effective Altruism. However, as an exegetical matter, this reading requires flattening the specific ontological commitments of Buddhism to fit a Western metaphysical category it was explicitly designed to dismantle.

  The following argument details why the canonical machinery of Buddhism—specifically the analysis of the *skandhas*, *pratītyasamutpāda* (dependent origination), and the *santāna* (continuum)—supports Empty Individualism (EI). It further demonstrates that Open Individualism inadvertently reintroduces a substantialist *ātman*, and finally, it addresses why Mahayana non-dualism does not rescue the OI interpretation.

  ### I. The Canonical Case for Empty Individualism

  The core divergence between Open and Empty Individualism lies in the status of the "subject." Open Individualism posits that there is **one** subject who is numerically identical across all experiences. Empty Individualism posits that there is **no** subject, only experiences (or causal streams of experience). Buddhism argues for the latter.

  #### 1. The Skandhas and the Elimination of the Substrate
  The Buddha's primary method for establishing *anatta* is the analysis of the person into the five *skandhas* (aggregates): form, feeling, perception, mental formations, and consciousness. In the *Anattalakkhaṇa Sutta*, the logic is exhaustive: if the self existed, it would be found within these aggregates. The Buddha asks whether these aggregates are permanent or impermanent. When the answer is "impermanent," he asks if what is impermanent is satisfactory or unsatisfactory. When the answer is "unsatisfactory," he concludes: "Is it fit to regard that as 'This is mine, this I am, this is my self'?"

  The Open Individualist reading skips the final step of this negation. OI argues: "The boundary between my aggregates and your aggregates is arbitrary; therefore, we share a self."
  The Buddhist argument is: "The aggregates are empty of self; therefore, **there is no self to be shared.**"

  To claim there is a single subject underlying all aggregates is to posit a sixth aggregate—a container or substrate that holds the experiences together. But the doctrine of *anatta* is not merely that the self is hard to find; it is that the concept of a "subject of experience" is a category error. In EI (and Parfitian reductionism), experiences exist, but they do not belong to anyone. They are "ownerless events." OI requires an owner; Buddhism denies the ownership relation itself.

  #### 2. Dependent Origination and the Lack of a Unifying Principle
  *Pratītyasamutpāda* (Dependent Origination) explains how experience arises without a homunculus. Ignorance conditions formations, formations condition consciousness, and so on. This is a causal chain, not a substantial identity.

  For OI to be true, there must be a principle of individuation that is false (the body/mind boundary) and a deeper principle of identity that is true (the universal subject). But Buddhism teaches that *all* phenomena are empty of intrinsic nature (*svabhāva*). There is no "deeper level" where a universal subject hides. There is only the interplay of conditions.

  If there were a single subject, that subject would have to be unconditioned to remain identical across different causal streams. But in Buddhism, only Nirvana is unconditioned, and Nirvana is not a subject; it is the cessation of craving and the cooling of the fires of grasping. To posit a universal subject is to reify consciousness (*viññāṇa*) into an absolute, which the *Mahānidāna Sutta* explicitly warns against: consciousness is always dependent on name-and-form. A universal consciousness independent of specific conditions is metaphysically impossible within this framework.

  #### 3. The *Santāna* and the Coherence of Karma
  The concept of the *santāna* (mental continuum) is the Buddhist solution to the problem of continuity without identity. It explains how karma ripens without a soul. It is like a flame passing from one candle to another: the later flame is causally dependent on the earlier flame, but it is not *numerically identical* to it.

  This supports Empty Individualism perfectly. EI holds that personal identity is just psychological continuity and connectedness (as Parfit argued). The *santāna* is exactly that: a causal stream of momentary events.

  Open Individualism breaks the mechanism of karma. If there is only one subject, then when "I" attain enlightenment, "you" must attain enlightenment, because there is no "you" distinct from "me." If "I" suffer the karmic result of "your" action, the moral causality that drives the Buddhist path dissolves. The *santāna* preserves the ethical urgency of the path: *this* stream of suffering continues unless *this* stream of practice intervenes. OI renders the path incoherent by collapsing the distinct causal trajectories that the doctrine of karma relies upon.

  ### II. The Upanishadic Smuggle: Reintroducing Ātman

  Your intuition that OI reintroduces the *ātman* is historically and philosophically precise. The historical Buddha debated Brahmins who held that *ātman* (the individual self) is identical with *Brahman* (the universal reality). This is essentially Open Individualism: the boundary between self and world is illusory because there is only One.

  The Buddha's innovation was to deny the *ātman* entirely, not to universalize it.

  #### 1. The Attribute of Permanence
  For a subject to be the "same" subject across different lives and bodies (as OI requires), it must possess a degree of permanence or trans-temporal identity. It must endure while experiences change. This violates *anicca* (impermanence). The OI subject functions exactly like the Upanishadic *ātman*: it is the unchanging witness behind the changing masks. By calling it "Universal" rather than "Individual," the OI proponent hopes to dodge the charge of substantialism, but the metaphysical structure is identical. It is a *substance* that underlies *attributes*. Buddhism rejects substance ontology in favor of process ontology.

  #### 2. The Soteriological Error
  The *Alagaddupama Sutta* (The Snake Simile) warns that grasping the Dhamma incorrectly is like grasping a snake by the tail: it will turn and bite you. The Buddha specifically addresses monks who think, "Consciousness is self."
  If one adopts OI, one replaces the small ego ("I am this body") with a cosmic ego ("I am the Universe"). This is still *asmi-māna* (the conceit "I am"). The goal of Buddhism is not to expand the self to infinity, but to see through the construct of self entirely.
  *   **OI Goal:** Realize I am everyone (Expansion).
  *   **Buddhist Goal:** Realize there is no one to be anyone (Cessation).

  The OI reading turns *anatta* into a puzzle about the *scope* of the self, whereas the texts present it as a puzzle about the *existence* of the self.

  ### III. Addressing the Mahayana and Non-Dual Objection

  This is the strongest objection available to your friend. Mahayana texts speak of *Tathāgatagarbha* (Buddha-nature), the *Dharmakāya* (Truth Body), and traditions like Dzogchen speak of *Rigpa* (pristine awareness) as a singular, all-encompassing ground. It is easy to read these as a Universal Subject. However, hermeneutical precision shows these concepts do not support Open Individualism.

  #### 1. Tathāgatagarbha as Emptiness, Not Substance
  The *Tathāgatagarbha* sutras were historically controversial precisely because they sounded like *ātman* doctrines. Later Mahayana scholars (like those in the *Ratnagotravibhāga*) went to great lengths to clarify that Buddha-nature is **not** a substantial self.
  It is defined as the *emptiness* of the mind, its potential for enlightenment, or the presence of the Buddha's qualities in a latent state. Crucially, it is not a "subject" that experiences. It is the *nature* of experience.
  To say "All beings have Buddha-nature" is not to say "All beings are one Subject." It is to say "All beings share the same lack of intrinsic existence." Sharing a property (emptiness) does not make two things numerically identical. Fire in one candle and fire in another share the property of "hotness," but they are not one fire.

  #### 2. Dharmakāya is Not a Mind
  The *Dharmakāya* is often described as all-pervasive. However, in Madhyamaka and Yogacara philosophy, the *Dharmakāya* is the realization of emptiness, not a cosmic mind that thinks thoughts. It is "non-dual" (*advaya*).
  We must distinguish **Non-Duality** from **Monism**.
  *   **Monism (OI/Vedanta):** There is One Thing.
  *   **Non-Duality (Buddhism):** The distinction between Subject and Object is false.
  In Dzogchen or Zen, when one rests in "One Mind," one is not merging into a universal subject. One is recognizing that the "subject" pole of the experience is empty. The "One" in "One Mind" refers to the undivided nature of reality where subject-object splitting has ceased, not a numerical count of subjects (i.e., 1 instead of 7 billion).
  If *Dharmakāya* were a universal subject, it would be capable of ignorance. But the *Dharmakāya* is unconditioned. If it were the subject of your suffering, the absolute would be suffering. Traditional Mahayana avoids this by positing that the *Dharmakāya* is the *truth* of the mind, not the *agent* of the mind.

  #### 3. The "Instant Enlightenment" Reductio
  If Open Individualism were true, and there is only one subject, then the liberation of one being would necessitate the liberation of all beings. If "I" wake up, and "I" am everyone, then everyone is awake.
  Mahayana Buddhism explicitly rejects this. The Bodhisattva vow is to save *all sentient beings*. This vow is incoherent if there is only one sentient being.
  While the *Avatamsaka Sutta* speaks of the interpenetration of all phenomena (Indra's Net), this is a description of causal interdependence (emptiness), not numerical identity. One jewel reflects all others, but they remain distinct jewels. This supports Empty Individualism (distinct causal streams that are mutually dependent) rather than Open Individualism (one stream wearing many masks).

  ### Conclusion

  The Open Individualist reading of Buddhism is a category error born of trying to solve the problem of personal identity by expanding the self, whereas Buddhism solves it by eliminating the self.

  1.  **Metaphysically:** The *skandhas* and *pratītyasamutpāda* describe a world of ownerless processes. OI requires an owner (a universal subject), which reintroduces the *ātman* and violates *anicca*.
  2.  **Ethically:** OI collapses the distinct karmic streams (*santāna*) required for the doctrine of karma and the Bodhisattva vow to make sense.
  3.  **Hermeneutically:** Mahayana concepts like *Tathāgatagarbha* and *Dharmakāya* describe the *nature* of reality (emptiness/non-duality), not a *substantial subject* underlying reality.

  Your friend's insistence that Buddhologists "haven't caught up" with Kolak reverses the burden of proof. Kolak is importing a Western metaphysical view (which has its own merits in analytic philosophy) and mapping it onto Buddhism. The canonical material, read on its own terms regarding causality, impermanence, and the specific negation of the "I-am" conceit, aligns robustly with Empty Individualism. It teaches that the boundary isn't an illusion hiding a unity; the boundary is an illusion hiding a void.
