          "notes": "Docked significantly for claiming indeterminacy applies only to radical translation/field linguists. Quine insists it applies to home translation as well. Also docked for Quine/Davidson chronology error."
        },
        "underdetermination_contrast": {
          "points_possible": 5,
          "points_awarded": 4.5,
          "notes": "Strong grasp of epistemic vs. ontological distinction. 'No fact of the matter' point well articulated."
        }
      },
