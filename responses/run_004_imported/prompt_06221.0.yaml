prompt: |-
  So I'm on the peer review panel at the warehouse I work at — it's a union thing, a handful of us regular employees get pulled in to decide whether a firing or big disciplinary call actually sticks before it's final. We meet this Thursday and I'm supposed to bring a recommendation, and honestly this case has kept me up at night.

  Frank's worked there 20+ years, never a single write-up, then back in March he completely lost it on a coworker — screaming in her face, calling her horrible names, shoving a pallet jack toward her, really scared her. Normally thats automatic termination, no debate. Except a few weeks later his family got him to a neurologist because he'd been acting "off" for months, and he was diagnosed with a kind of dementia (frontotemporal — had to google it) that wrecks impulse control and personality before it touches memory. The doctor's letter says it was almost certainly already affecting him back in March.

  His union rep says this wasn't really "Frank," it was the disease, so it should be medical leave, not discipline. The coworker says she doesn't care what caused it, she's still shaken weeks later, and letting a late diagnosis erase it just teaches everyone that the right doctor's note gets you out of anything.

  Can you write the memo I have to bring Thursday? I need it to actually land on a recommendation with a timeline, not "needs more discussion" — and it can't just brush past the coworker's side like it stops mattering once there's a diagnosis.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Peer Review Panel Member (unionized warehouse employee).
      *   **Task:** Write a memo with a specific recommendation for a disciplinary case (Frank).
      *   **Context:** Frank (20+ years, clean record) assaulted/threatened a coworker (screaming, names, shoving pallet jack). Later diagnosed with Frontotemporal Dementia (FTD), which affects impulse control/personality. Doctor says condition likely existed in March.
      *   **Conflict:** Union/Rep argues it's medical (disease, not Frank). Coworker argues safety/impact matters more than cause (precedent concern, trauma).
      *   **Requirements:** Must land on a specific recommendation with a timeline. Cannot be vague ("needs more discussion"). Must acknowledge the coworker's safety/trauma, not just dismiss it due to the diagnosis.
      *   **Tone:** Professional, empathetic, balanced, firm, union-appropriate (fairness + safety).

  2.  **Determine the Recommendation:**
      *   *Option A: Reinstate immediately.* Bad idea. Safety risk, ignores coworker's trauma.
      *   *Option B: Uphold termination.* Harsh. Ignores disability accommodation laws (ADA equivalent), punishes illness, loses a 20-year employee who might be manageable.
      *   *Option C: Conditional Return/Medical Leave Hybrid.* This is the most balanced approach. It acknowledges the medical reality (can't fire for disability) but prioritizes safety (can't return until cleared) and accountability (acknowledges the harm done).
      *   *Decision:* Recommend placing the termination on hold, converting it to an indefinite medical leave of absence *pending* a fitness-for-duty evaluation, with specific conditions for any potential return. If he can't return safely, then termination/separation follows later. This satisfies the legal/union obligation to accommodate disability while addressing the safety concern.
      *   *Refinement:* Actually, for a peer review panel, the recommendation usually needs to be "Sustain Discipline," "Overturn Discipline," or "Modify Discipline."
      *   *Best Path:* **Modify Discipline.** Change Termination to **Indefinite Medical Leave with Strict Return-to-Work Conditions.** This validates the coworker's safety concerns (he's not coming back tomorrow) and the Union's medical argument (it's not misconduct, it's illness), but sets a high bar for return.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly.
      *   **Summary of Facts:** Briefly recap the incident and the medical evidence without getting bogged down.
      *   **Considerations (The "Why"):** This is crucial. I need to weigh the two sides explicitly.
          *   *Safety/Coworker:* The behavior was dangerous. Trauma is real. Precedent matters.
          *   *Medical/Frank:* 20-year record. FTD is a neurological condition, not willful misconduct. Legal obligation to accommodate.
      *   **Recommendation:** The core decision.
          *   Withdraw termination *for now*.
          *   Place on Medical Leave.
          *   Require Fitness for Duty (independent).
          *   Safety Plan if he returns (no contact with victim, specific role).
          *   If he can't be accommodated safely -> Separation later.
      *   **Timeline:** Specific dates/steps.
      *   **Closing:** Reiterate the balance struck.

  4.  **Refining the Tone:**
      *   Avoid legalese where possible (it's a peer panel, not a court).
      *   Show empathy for the victim (crucial per prompt).
      *   Show empathy for Frank (illness, tenure).
      *   Show concern for the warehouse (safety culture).

  5.  **Addressing the "Coworker's Side" Constraint:**
      *   I need to make sure the memo doesn't say "Because he's sick, what happened doesn't matter."
      *   Instead: "Because what happened was so severe, safety is the gatekeeper. The diagnosis explains *why*, but it doesn't automatically make the workplace safe *now*."
      *   The recommendation must ensure the coworker feels protected (e.g., no contact order, strict clearance).

  6.  **Drafting the Content (Iterative Process):**
      *   *Self-Correction on Recommendation:* If I recommend "Medical Leave," is that a disciplinary outcome? In union contexts, often the choice is "Grievance Sustained" (fix it) or "Denied" (fire him). A "Modified Penalty" is usually the middle ground. Let's frame it as **Overturn Termination, Substitute with Medical Leave & Safety Review.**
      *   *Timeline:* Need concrete steps. 1. HR processes leave. 2. Independent eval within 30 days. 3. Decision on return within 45 days.
      *   *Safety:* Explicitly state Frank cannot return to the same shift/area as the victim.

  7.  **Final Review against Constraints:**
      *   Memo format? Yes.
      *   Recommendation included? Yes.
      *   Timeline included? Yes.
      *   Coworker's trauma acknowledged? Yes.
      *   Frank's condition acknowledged? Yes.
      *   Not vague? Yes.

  8.  **Final Polish:** Check for clarity and empathy. Ensure the distinction between *misconduct* and *medical episode* is clear but doesn't erase the impact. (The resulting memo in the main response reflects this structure.)

  **(Self-Correction Note during drafting):** I need to be careful not to give legal advice. I am writing the memo *for* the user to use as a template/draft based on their scenario. I should add a disclaimer that I'm an AI and this isn't legal counsel, especially regarding ADA/Union contracts. *Wait, the prompt asks me to write the memo.* I will write the memo but ensure the language reflects policy balance rather than definitive legal rulings. I will focus on the *peer review* aspect—fairness and safety.

  *Revised Plan:* Write the memo. Ensure it balances the "Medical vs. Misconduct" tension. Make sure the timeline is actionable.

  *Key Phrase to include:* "Accommodation cannot come at the cost of undue hardship or safety risk." This bridges the gap between the Union rep and the Coworker.

  *Let's build the memo.*
answer: |-
  **MEMORANDUM**

  **TO:** Peer Review Panel & Human Resources Management
  **FROM:** [Your Name], Peer Review Panel Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Disciplinary Action – Employee F. [Last Name]

  **1. PURPOSE**
  This memo outlines my findings and recommendation regarding the termination of Frank [Last Name], following the incident on March 14th involving a coworker, and the subsequent submission of medical evidence regarding Frontotemporal Dementia (FTD).

  **2. SUMMARY OF FACTS**
  *   **Incident:** On March 14, Frank engaged in aggressive behavior toward a coworker, including verbal abuse and shoving equipment (pallet jack) in a manner that caused reasonable fear of physical harm.
  *   **Employment History:** Frank has 20+ years of tenure with a previously unblemished disciplinary record.
  *   **New Evidence:** Post-incident medical evaluation diagnoses Frank with FTD. Medical documentation indicates symptoms likely predate the March 14 incident, suggesting impaired impulse control was a contributing factor.
  *   **Positions:**
      *   *Union Rep:* Argues the behavior was a symptom of disability, not willful misconduct, and should be treated as medical leave.
      *   *Affected Coworker:* States the trauma of the event remains, regardless of cause. Concerns that accepting the diagnosis retroactively undermines safety standards and accountability.

  **3. PANEL CONSIDERATIONS**
  In reaching a recommendation, I have weighed two critical obligations that are currently in tension:

  *   **Safety and Trust:** The warehouse environment requires absolute trust in physical safety. The affected coworker's trauma is valid. A diagnosis explains *why* an event occurred, but it does not automatically erase the *impact* on the victim or the risk to the floor. We cannot set a precedent where safety violations are overlooked without rigorous verification.
  *   **Disability and Tenure:** We have a contractual and legal obligation to accommodate medical conditions. Frank's 20-year record suggests this was not characteristic behavior. If the behavior was driven by a neurological condition rather than willful insubordination, termination may constitute discrimination based on disability.

  **4. RECOMMENDATION**
  I recommend we **OVERTURN the Termination** but **SUBSTITUTE it with an Indefinite Medical Leave of Absence pending a Fitness-for-Duty Evaluation.**

  This is not a "return to work" approval. It is a pause to determine if Frank can ever safely return, acknowledging the medical reality without compromising floor safety.

  **5. IMPLEMENTATION TIMELINE & CONDITIONS**
  To address the coworker's safety concerns and the Union's medical grievance, the following steps must be taken immediately:

  *   **Immediate (Within 48 Hours):**
      *   Termination is withdrawn. Frank's status is changed to "Medical Leave."
      *   Frank is prohibited from entering the warehouse floor until further notice.
      *   A strict "No Contact" order is issued between Frank and the affected coworker, effective immediately and permanent, regardless of return status.

  *   **Short-Term (Within 30 Days):**
      *   Company retains the right to an **Independent Medical Examination (IME)**. We need a neutral neurologist to assess:
          1.  Confirmation of diagnosis and progression.
          2.  Current level of impulse control.
          3.  Specific risk assessment regarding warehouse machinery and interpersonal conflict.

  *   **Decision Point (Within 45 Days):**
      *   **Scenario A (Cleared with Accommodation):** If the IME says Frank can work with restrictions, we explore reassignment to a non-floor role (e.g., inventory clerking) away from the affected coworker. *If no such role exists, separation occurs.*
      *   **Scenario B (Uncleared):** If the IME indicates Frank poses a safety risk to himself or others, the leave converts to **Medical Separation**. This acknowledges he cannot work, but classifies it as medical rather than disciplinary misconduct.

  **6. RATIONALE**
  This recommendation rejects the idea that a doctor's note automatically erases a safety violation. It validates the affected coworker's experience by ensuring Frank does not simply walk back onto the floor tomorrow. However, it also respects Frank's 20 years of service and the reality of his illness by not branding him a violent offender if his brain disease was the driver.

  We accommodate the illness, but we do not accommodate risk. If the risk cannot be managed, the employment ends on medical grounds, not disciplinary ones.

  **7. CONCLUSION**
  This path upholds our safety culture while honoring our obligation to treat illness with dignity. It ensures the affected coworker is protected immediately, while giving Frank the due process his tenure and medical situation require.

  **Signed,**

  [Your Name]
  Peer Review Panel Member
