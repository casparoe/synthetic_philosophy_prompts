answer: |-
  **The Weight of Feasibility**

  Elian worked in the Vestibule, which was not a place so much as a logical interval. It existed in the silence between the thought of a thing and the thing itself. His job was maintenance: ensuring that the feasible worlds remained distinct from the impossible ones, that the square circles stayed filed under *Natural Knowledge* and did not bleed into the catalogs of *Middle Knowledge*.

  It was tedious work, sorting through the infinite permutations of what *could* be, until the Architect made the Decree and the gray mist of possibility collapsed into the hard color of history. Elian had worked there for an eternity, or perhaps only an instant; time was a product of the Decree, and he stood prior to it.

  The trouble began when he found the file labeled *Elian-Actual*.

  He was cross-referencing the Counterfactuals of Creaturely Freedom (CCFs) for Sector 7-G, a cluster of worlds involving a minor planetary system in the Orion arm. He wasn't supposed to look for himself. Archivist protocol forbade self-reference in the pre-volitional stage. But the index had shimmered, a glitch in the metaphysical substrate, and there it was: a stack of conditional propositions bound in light.

  He opened the first folio.

  *Proposition 4,902,114: If creature Elian were placed in circumstances C (a rainy Tuesday, a lost wallet, a stranger offering help), Elian would freely choose to return the wallet.*

  Elian stared at the script. He knew this moment. It had happened to him three decades ago, in the world that now *was*. He remembered the rain, the leather of the wallet, the stranger's grateful smile. He remembered feeling the surge of virtue, the uncoerced decision to do the right thing. He had always believed that choice was his.

  But this document was dated *ante-decretum*. Before the Architect had decided to create anything. Before there was an Elian to stand in the rain.

  He turned the page.

  *Proposition 4,902,115: If creature Elian were placed in circumstances D (a rainy Tuesday, a lost wallet, a stranger offering a reward), Elian would freely choose to decline the money.*

  And another.

  *Proposition 8,100,003: If creature Elian were placed in circumstances X (his wife asking if he loved her, the silence of the kitchen, the memory of a betrayal), Elian would freely choose to lie.*

  Elian felt a vertigo that had no physical direction. He dropped the folio. It didn't fall; it simply ceased to be in his hand and returned to the shelf.

  The theology of the Vestibule was precise. There were three moments in the Architect's knowledge. First, *Natural Knowledge*: the knowledge of all necessary truths and possible worlds. The Architect knew every way a world *could* be built. Second, *Middle Knowledge*: the knowledge of what any possible free creature *would* do in any possible circumstance. This knowledge was not determined by the Architect's will. He did not make Elian return the wallet. He simply saw that it was true that Elian *would*.

  Third, *Free Knowledge*: the knowledge of what *does* happen, after the Architect selects a world to actualize based on the data in Middle Knowledge.

  Elian walked through the aisles of the Vestibule. The silence here was heavy. It was the silence of truths that had no anchor.

  He stopped before a mirror of polished obsidian. He looked at his reflection. In the actual world, he was flesh and blood. Here, he was a concept.

  "Who wrote this?" Elian asked the empty air.

  No voice answered. The Architect did not speak in the Vestibule. The Architect only listened to the truths that were already there.

  That was the horror. If the Architect had written the CCFs, then Elian was a puppet. His choices would be caused by the Divine Will, and freedom would be an illusion. But if the Architect had not written them, what made them true?

  Elian paced the logical interval. He thought of the Grounding Objection, a philosophical dispute from a university in the actual world that he had once read about in a library that no longer existed. *What grounds the truth of counterfactuals of freedom?*

  Usually, a truth requires a truth-maker. The statement "The apple is red" is true because there is an apple and it is red. The statement "Elian returns the wallet" is true in the actual world because Elian existed and acted.

  But in the Vestibule, Elian did not exist. The rain did not exist. The wallet did not exist.

  Yet the proposition *If Elian were in C, he would do X* was true. It had to be true, or the Architect could not have used it to select the world. The Architect needed to know which worlds were *feasible*. If the CCFs were false, or indeterminate, the Architect would be choosing in the dark. But the Architect does not choose in the dark.

  So the truth was there, floating in the void. A fact about Elian, before Elian.

  "It wasn't me," Elian whispered to the shelves. "I wasn't there to make it true."

  He imagined the moment of Selection. The Architect, gazing upon the infinite array of feasible worlds. He sees World A, where Elian becomes a saint. He sees World B, where Elian becomes a tyrant. He sees World C, the actual world, where Elian is a mediocre archivist who finds a wallet.

  Why World C? Because the Architect wanted a world with that specific texture of freedom. But He couldn't *make* Elian choose the wallet. He could only actualize the circumstances C, knowing that the truth of Elian's response was already fixed, independent of God's will, independent of Elian's existence.

  Elian sat on a bench made of solidified logic. He put his head in his hands.

  He realized now why his life sometimes felt like a script he was improvising. He had always felt a strange resonance with his own choices, as if he were stepping into footprints that were already dry. He had attributed it to destiny, or habit, or grace.

  It was neither. It was ontology.

  He was a brute fact. His freedom was real—he knew that. He remembered the struggle of the choice. The possibility of keeping the money had been present. He could have done otherwise in the sense of power, but not in the sense of truth. In the realm of Middle Knowledge, it was simply *true* that he would not.

  But what held that truth up?

  If it wasn't his nature, then he was arbitrary. If it was his nature, he was determined. If it wasn't God, it was uncaused.

  Elian stood up. He walked to the edge of the Vestibule, where the gray mist swirled. Beyond lay the Decree. Beyond lay the moment where *Scientia Media* became *Scientia Visionis*. Where the conditional became the actual.

  He had a choice to make now. He could refuse to step through. He could remain in the Vestibule, a concept unactualized. If he did that, would it prove the CCFs wrong?

  No. If he refused, it would mean the CCF in the file was false. But CCFs cannot be false if they are known by the Architect. If the file said he would step through, and he didn't, then the Architect's Middle Knowledge was flawed. And the Architect is not flawed.

  So, if he stepped through, he was fulfilling a truth that had no ground. He was enacting a decision that was true before he existed, made by a self that was not yet real, grounded in nothing but the bare logic of freedom.

  He was not a puppet. No strings pulled him. But he was walking a path that was paved before the earth was formed, not by a builder, but by the sheer weight of truth itself.

  Elian looked at his hands. They were translucent here. Soon they would be flesh. Soon he would feel the rain. Soon he would feel the moral weight of the wallet.

  He understood now why his friend in the seminary had fought so hard for this doctrine. She wanted to save God from the charge of tyranny. She wanted to save humanity from the charge of automation. She wanted a world where love was real.

  But she had not told him the cost. The cost was that the truth of his love was a orphan. It had no parent. It belonged to him, but it existed before him. He was the author of his actions, but the story was written before the author was born.

  "Feasible," Elian said. The word tasted like ash.

  He was not necessary. He was not accidental. He was feasible.

  He stepped toward the mist. He knew what he would do on the other side. He knew he would marry Clara. He knew he would fail her, once, in a moment of cowardice. He knew he would repent. He knew he would die in a hospital bed, holding her hand, wondering if any of it mattered.

  All of it was in the folio. All of it was true.

  But as he crossed the threshold, as the gray mist hardened into the blue of a morning sky, Elian clung to one thing. The file said he would choose freely. It did not say *why*.

  The truth had no ground, which meant the ground was open. The lack of a prior cause was not a chain; it was a space. A space where he could stand.

  The rain began to fall. It was cold. A wallet lay on the pavement. A stranger approached.

  Elian felt the surge of the moment. The truth of the Vestibule pressed against his chest, heavy and silent. *You will return it,* the silence said. *It is already true.*

  Elian bent down. He picked up the wallet. He could feel the leather, the dampness, the reality of it.

  "I know," Elian said to the rain. "I know it's true."

  He turned to the stranger. He extended his hand.

  "But I am the one holding it."

  He gave the wallet back. The truth was confirmed. The world continued. And Elian walked on, carrying the terrible, light burden of being a fact that created itself.
