answer: |-
  This is a fascinating philosophical puzzle wrapped in a messy social situation. You have stumbled upon a classic problem in ethics and language: the distinction between a **factual dispute** and a **normative dispute**.

  To answer your core question directly: **No, there is no objective "fact of the matter" about whether they are together.** Relationships are not biological states like "being pregnant" or "being dead"; they are social contracts. They exist only insofar as people agree they exist.

  However, the dispute among your friend group is **not empty**. It feels heavy because you aren't actually arguing about the label; you are arguing about *moral obligations*, and the label is just the shorthand you're using to express them.

  Here is a breakdown of why this is happening, why the words didn't matter when you tabooed them, and where the actual moral weight lies.

  ### 1. The Two Competing Definitions
  Your friend group is split 50/50 because there are two valid, competing cultural heuristics for defining a relationship. Neither is objectively "true," but they lead to different conclusions.

  *   **The Declarative Model (Team Single):** This side believes a relationship status is defined by **explicit verbal agreement**. Under this model, the "breakup talk" was a speech act that dissolved the contract. Until a new contract is signed (a "get back together" talk), the previous one remains terminated. The hookups are just ambiguous behavior, but they don't override the explicit declaration.
  *   **The Functional Model (Team Taken):** This side believes a relationship status is defined by **behavioral patterns**. Under this model, saying "I love you," spending time together, and physical intimacy *are* the relationship. The verbal breakup is viewed as a momentary lapse or a "break," but the functional reality is that they are acting like a couple.

  Because society uses both models interchangeably, half your friends are prioritizing the *words* (the breakup), and half are prioritizing the *actions* (the hookups).

  ### 2. Why Tabooing the Words Didn't Work
  You mentioned that even when you listed the raw events without labels, people still split on the verdict. This is because the moral judgment isn't derived from the label; **the label is derived from the moral judgment.**

  When your friends hear the facts, they instantly run a subconscious simulation: *"If I were the ex-girlfriend, would I feel betrayed?"* or *"If I were the new girl, would I feel lied to?"*

  *   **Friend A thinks:** "The breakup was explicit. Jake owes her nothing. Asking someone out is honest." -> Verdict: **Single.**
  *   **Friend B thinks:** "The behavior implies reconciliation. Asking someone out is deceptive." -> Verdict: **Cheating.**

  Removing the words "cheating" or "single" didn't change their assessment of the *harm* involved. The dispute isn't about semantics; it's about **reasonable expectations.**

  ### 3. The Missing Fact: The Ex's Expectation
  You said everyone agrees on every single fact, but there is actually one crucial fact missing from your list, and it is the only one that matters: **What does the ex-girlfriend believe is happening?**

  *   **Scenario A:** She thinks the breakup is final, and the hookups are just closure/friends-with-benefits.
      *   *Verdict:* Jake is morally free to date, provided he is transparent with the new person.
  *   **Scenario B:** She thinks they are in a "soft reconciliation" and that exclusivity still applies.
      *   *Verdict:* Jake is violating her trust, regardless of the lack of a formal "we are back together" talk.

  The reason your friend group is stuck is that they are projecting *their own* expectations onto the ex. Half assume she thinks it's over; half assume she thinks they're fixing things. Without asking her, there is no fact of the matter.

  ### 4. Why It Feels Like So Much Rides On It
  You asked why the dispute feels weighty if the label is arbitrary. It feels weighty because **labels create reality.**

  In social ontology (the study of social reality), saying "We are broken up" is like saying "This piece of paper is money." It only works because we agree on the rules.
  *   If Jake calls himself "single," he is signaling to the new woman that he has no entanglements.
  *   If he acts "taken" with his ex, he is signaling to her that he is still committed.

  The tension comes from the **asymmetry of information.**
  *   If Jake asks the new person out without telling them about the ex, that is deception.
  *   If Jake asks the new person out and says, "I technically broke up, but we still sleep together," that is transparency.

  The "shadiness" isn't in the relationship status; it's in the **potential for collateral damage.**

  ### The Resolution
  The dispute in your friend group is "empty" in the sense that you will never find a physical fact that proves they are together. But it is "substantial" in the sense that real people could get hurt depending on how Jake proceeds.

  To resolve the verdict, stop asking "Are they together?" and start asking these two questions:

  1.  **Has Jake clarified the situation with his ex?** (Does she know he is looking to date others?)
  2.  **Will Jake clarify the situation with the new person?** (Will he disclose the ongoing intimacy with his ex?)

  If the answer to both is **Yes**, then Jake is acting ethically, regardless of the label.
  If the answer to either is **No**, then your friends who are calling it "shady" are correct, not because of the relationship status, but because of the **secrecy.**

  **The Verdict:** The label doesn't matter. Transparency matters. Jake is entering a morally hazardous zone not because he's "taken," but because he is allowing ambiguity to persist where clarity is required. If he wants to date someone new, he has an obligation to collapse the ambiguity with his ex *before* he makes a move on someone else. Until he does that, he isn't cheating on a girlfriend, but he is failing to be an honest partner to anyone involved.
