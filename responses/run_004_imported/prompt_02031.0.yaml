prompt: |-
  So for my IB Theory of Knowledge class we have this big "exhibition" project where you connect a real object or situation to a "way of knowing," and since everyone in my class is doing the obvious Descartes/empiricism thing, I decided to go a different route and dig into the Nyāya school from classical Indian philosophy instead (mostly Wikipedia plus one long PDF I found, not gonna lie). Everyone describes Nyāya as basically THE logic-and-proof school of Indian thought -- their whole thing is that a belief only counts as real knowledge if it comes through one of a fixed set of approved "pramanas," which felt perfect for a ways-of-knowing project.

  Here's the part I want help with though. Nyāya lists four pramanas: perception, inference, comparison (upamana, which I still don't fully get, but that's not my question rn), and testimony (sabda). But when you actually think about it, testimony isn't really its own way of knowing, right -- it's just inference wearing a trenchcoat? Like "X said Y, X is a reliable source, therefore Y" is a plain old syllogism. So Nyāya must basically agree, deep down, with the Buddhist logicians who said sabda reduces to inference, and the only reason they still officially list it as an equal, independent fourth pramana is so nobody can accuse them of putting the authority of the Vedas on shaky ground. My teacher gave me a funny look when I ran this theory by her but couldn't say exactly what was wrong with it, so before I build my whole script around "even the most rigorous ancient logic system still had to fudge its own rules for religious reasons," can you help me nail down WHY Nyāya insists sabda is a genuinely seperate, independent pramana instead of just admitting its inference in disguise?
reasoning: |-
