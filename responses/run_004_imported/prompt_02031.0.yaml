      *   **Key Distinction 2: The Scope of the *Āpta*:** It's not just Vedas. It's any reliable expert. This undermines the "religious fudge" theory.
      *   **Key Distinction 3: Error Conditions:** You can have valid inference with false testimony, and valid testimony with flawed inference. They fail in different ways.
      *   **TOK Advice:** How to frame this for the exhibition. Don't just say "they were biased." Say "they identified a distinct cognitive mechanism that inference doesn't capture." This shows deeper analysis.

