      *   *Is the startup analogy perfect?* No. A startup is smaller than the Napoleonic wars. The CEO *does* have more leverage in a 10-person company than Napoleon did over 1812. I should acknowledge this limitation. Tolstoy is talking about *mass* movements. A startup is a microcosm, but the power dynamics are more concentrated. I need to nuance this so I don't gaslight the founder into thinking their CEO had no impact.
      *   *Correction:* Acknowledge that in a startup, the "unit" of the CEO is larger relative to the whole than Napoleon was to France. But the *principle* remains: the collapse is a system failure, not just a will failure.

