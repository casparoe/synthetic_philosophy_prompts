answer: |-
  You are definitely not crazy, and your group's reaction is the single most common objection to Rawls's later work. If you read *Political Liberalism* (1993) without reading *The Idea of Public Reason Revisited* (1997), the "no comprehensive doctrines" rule looks absolute. When Rawls then pivots to praising the Abolitionists and MLK, it feels exactly like the motte-and-bailey you describe: "Religion is banned from politics" (Motte) vs. "Actually, religion is great if it's the right religion fighting the right fight" (Bailey).

  However, inside the Rawlsian machinery, there **is** a principled line. It isn't an ad hoc exemption for MLK, but it relies on two specific distinctions that often get glossed over in introductory summaries. Whether you find these distinctions *persuasive* is another matter, but they are structurally consistent.

  Here is the untangling, translated into terms that should resonate with a LessWrong/ACX-adjacent crowd.

  ### 1. The "Proviso" (Wide vs. Narrow Public Reason)
  In *Revisited*, Rawls explicitly softens the "full stop" interpretation you started with. He introduces what scholars call **the proviso**.

  Rawls distinguishes between the **background culture** (civil society, churches, universities, media, and your meetup group) and the **public political forum** (judges, legislators, executives, and candidates speaking *as* candidates).

  *   **In the Background Culture:** Comprehensive doctrines (religious, philosophical, moral) are not only allowed; they are encouraged. This is where the "marketplace of ideas" lives. MLK preaching at Ebenezer Baptist or writing a letter from a Birmingham jail is operating largely in the background culture (or at the boundary of it).
  *   **In the Public Political Forum:** When you are voting, legislating, or adjudicating constitutional essentials, you must use public reason.
  *   **The Proviso:** You may introduce comprehensive doctrines into political discussion *at any time*, **provided that in due course** you present proper public reasons to support the same conclusion.

  **The Rationalist Translation:** Think of this as a constraint on the *final output* of the decision algorithm, not necessarily the *internal heuristic* used to discover it.
  If your religious faith tells you "Segregation is sin," you can shout that from the pulpit. But to change the *law*, you must eventually translate that into "Segregation violates the Equal Protection Clause" or "Segregation undermines the fair equality of opportunity required for social cooperation."

  Rawls argues that comprehensive doctrines often provide the **motivational energy** to pursue justice, while public reason provides the **justificatory framework** that allows for stable cooperation among people with different source codes.

  ### 2. Ideal vs. Non-Ideal Theory (The MLK Clause)
  This is the heavier lifter for your specific question about the Civil Rights Movement.

  Rawls is very clear that Public Reason is a principle for a **well-ordered society** (or one that is "nearly just"). It is **Ideal Theory**. It assumes that the basic structure of society is already reasonably just, and we are just arguing over the margins or specific policies.

  The United States during slavery or Jim Crow was **not** a well-ordered society. It was a society with a fundamentally unjust basic structure. Therefore, the strict duties of civility and public reason are suspended or altered. This is **Non-Ideal Theory**.

  Rawls writes explicitly in *Revisited*:
  > "Whether or not the abolitionists and the civil rights movement violated public reason... is a question I do not take up. ... [But] in a society that is not well-ordered... the duty of civility may not hold."

  He goes on to say that in a nearly unjust society, comprehensive doctrines may be necessary to **shake the foundation** and bring society *back* to a state where public reason is possible. The Abolitionists and MLK were not trying to tweak policy in a just system; they were trying to *create* the conditions for a just system where public reason could eventually apply.

  **The Rationalist Translation:** Public Reason is a coordination protocol for agents who already agree on the basic rules of the game (the Constitution, the idea of free and equal citizenship). When the game itself is rigged (slavery/segregation), appealing to the rulebook is insufficient. You need to appeal to "higher laws" (comprehensive doctrines) to refactor the code. Once the code is refactored, you return to the standard protocol.

  ### 3. Is it still a Motte-and-Bailey?
  Here is where your group can have a real debate.

  **The Steelman (Rawls is consistent):**
  Rawls isn't saying "Religious arguments are okay if I like the outcome." He is saying:
  1.  In a just society, religious arguments must be translatable to public reason eventually (The Proviso).
  2.  In an unjust society, the rules of engagement change to allow for radical correction (Non-Ideal Theory).
  MLK fits #2 (fighting an unjust structure) and often fit #1 (he constantly appealed to the Constitution and American creed, not just the Bible).

  **The Steelman (The Critics, e.g., Nicholas Wolterstorff, Paul Weithman):**
  Even with these distinctions, the "Proviso" is incredibly demanding and vague. Who decides if a reason is "public" enough?
  *   If a Catholic votes against abortion because of Church teaching, can they *always* find a secular public reason? Maybe.
  *   But if the secular reason is just a post-hoc rationalization for the religious belief, have they actually respected their fellow citizens?
  *   Critics argue Rawls wants the *benefit* of religious mobilization (the energy of the Civil Rights movement) without the *cost* of religious epistemology in the public square. That feels like having your cake and eating it too.

  ### 4. Why the Biographical Context Matters (But Doesn't Solve It)
  Your intuition about Rawls's loss of faith is spot on. In "On My Religion," he describes the horror of realizing that prayer is essentially asking God to take sides in a war (steering bullets away from Americans onto Japanese). He realized that if God is a moral agent, He cannot be a tribal agent.

  This biographical trauma drives the *motivation* for Public Reason. He wants a political system where we don't fight over who God favors. But as you noted, the *theory* has to stand on its own.

  The fact that he praises MLK isn't him trying to avoid "condemning the Civil Rights movement" out of social pressure. It's him acknowledging that **Public Reason is not a suicide pact.** If you enforce Public Reason strictly in a society built on slavery, you effectively protect the status quo, because the status quo cannot be defended by public reason, only by force. To get to Public Reason, you sometimes have to violate it temporarily.

  ### The Verdict for Your Group
  It is not a motte-and-bailey in the sense of "he changes the definition based on the outcome." It is a **two-stage model**:
  1.  **Stage 1 (Non-Ideal/Unjust):** Comprehensive doctrines are necessary tools to dismantle structural injustice. (MLK/Abolitionists).
  2.  **Stage 2 (Ideal/Just):** Once the basic structure is just, comprehensive doctrines must be translatable to public reason to maintain stability among pluralistic citizens. (The Proviso).

  **The catch:** Rawls is often vague about when we transition from Stage 1 to Stage 2. Are we in Stage 2 now? If so, does the Proviso silence modern religious activists on abortion or gay marriage? Rawls suggests that as long as they *can* offer public reasons (e.g., about human rights or equality), they can speak. If their *only* reason is "Leviticus says so," they are out of bounds in the political forum.

  **Discussion Prompt for your Meetup:**
  Ask the group: *"If Public Reason is a coordination protocol for a pluralistic society, does allowing comprehensive doctrines in 'Non-Ideal' theory create a perverse incentive? Can politicians game the system by claiming society is 'unjust enough' to warrant religious arguments, thereby bypassing the burden of public justification?"*

  That gets you to the heart of whether the distinction is principled or just a loophole.
