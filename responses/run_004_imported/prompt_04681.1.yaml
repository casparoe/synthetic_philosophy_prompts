      *   *The Core Distinction 1: The Proviso.* Explain the "wide" vs. "narrow" view of public culture. In the "public political forum" (officials, judges), strict rules apply. In the "background culture" (media, churches, universities), comprehensive doctrines are welcome. The bridge is the proviso: if you argue from religion in the background, you must show how it translates to public reason for the final vote/law.
      *   *The Core Distinction 2: Ideal vs. Non-Ideal Theory.* This is the MLK specific defense. Rawls explicitly states that Public Reason applies to a *nearly just* society. If the basic structure is fundamentally unjust (slavery, Jim Crow), the duty of civility/public reason is weakened or suspended. The goal is to *establish* the conditions for public reason. MLK appealed to the Constitution (public reason) *alongside* the Bible (comprehensive).
      *   *Addressing the "Ad Hoc" Charge:* Is it ad hoc? Rawlsians say no, it's structural. Critics say yes, it's a fudge. I need to present the Rawlsian defense fairly but acknowledge the criticism. The Rationalist/ACX crowd will appreciate a "steelman vs. steelman" approach.
      *   *Connect to Rationalist/ACX sensibilities:* Use terms like "Schelling points," "coordination problems," "common knowledge," "idealized agents." This builds rapport.
      *   *Conclusion:* Summarize. It's not a free pass for *any* religious argument, but it's not a total ban either. It's a constraint on *final justification* in a *just* society.

  5.  **Refining the Argument (Self-Correction during drafting):**
