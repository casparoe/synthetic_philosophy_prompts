      *   **User's Background Knowledge:** Knows about Rawls's biographical shift (Christian to secular), "On My Religion," the chaplain incident.
      *   **Goal:** Untangle this. Is there a principled distinction, or is it an ad hoc exemption?

  2.  **Initial Assessment & Fact-Checking:**
      *   *Is the user's reading of Public Reason correct?* Broadly, yes. Public reason requires appealing to a political conception of justice, not a comprehensive doctrine.
