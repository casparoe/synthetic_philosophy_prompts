answer: |-
  This is a fantastic dispute to have had. You and your friend have put your fingers on the exact tension that kept David Lewis awake at night (metaphorically speaking) during the last decade of his career. The debate centers on whether a Humean metaphysics of chance is compatible with a rationalist epistemology of chance.

  To settle the score, we need to walk through three stages: the mechanics of the "Big Bad Bug" (why HS breaks the PP), the mechanics of the New Principle (how Lewis tried to fix it), and finally, an evaluation of your "definitional" worry.

  ### 1. The Setup: PP vs. HS

  First, let's lock down the two conflicting commitments.

  **The Principal Principle (PP):**
  Roughly, the PP says that if you know the objective chance of an event $A$ is $x$, and you have no "inadmissible" evidence (like crystal ball gazing or time travel), your rational credence in $A$ should be $x$.
  $$C(A \mid \langle Ch_t(A) = x \rangle \wedge E) = x$$
  The intuition here is that **chance guides credence**. Chance is an objective feature of the world at time $t$, and rationality demands you align your beliefs with it.

  **Humean Supervenience (HS):**
  Lewis's metaphysics says there are no necessary connections or primitive propensities. The world is just a vast mosaic of local qualities (the "Humean Mosaic"). Laws and chances are not rulers of the mosaic; they are **summaries** of it.
  Specifically, chances are defined by the "Best System" (the set of axioms that best balances simplicity and strength in describing the *entire* history of the world, past and future).
  *Crucial Consequence:* Under HS, the chance at time $t$ supervenes on the **total history**, including the future.

  ### 2. The Big Bad Bug: How Undermining Threatens PP

  Your friend is absolutely correct that the conflict arises because, under HS, the future determines the present chance. This creates "undermining futures."

  **The Logic of the Bug:**
  1.  Let $T$ be the true theory of chance for our world (the Best System). $T$ assigns specific chances to events at time $t$.
  2.  Because $T$ is a probabilistic system, it assigns a positive chance to various future histories.
  3.  Consider a specific future history $F$ that is *compatible* with $T$'s probabilities (i.e., $T$ says $F$ has a non-zero chance of occurring).
  4.  **The Undermining:** However, suppose that if $F$ actually occurs, the *Best System* for the total history (including $F$) would **not** be $T$. Perhaps $F$ contains a pattern that makes a different system $T^*$ simpler and stronger.
  5.  If $F$ occurs, $T$ is false. (Because $T$ is defined as the Best System of the *actual* total history).
  6.  **The Contradiction:**
      *   **By PP:** If I know $T$ is the true theory of chance, I should believe $F$ is possible (because $T$ assigns it positive chance). So, $C(F \mid T) > 0$.
      *   **By Logic/HS:** If I know $T$ is the true theory of chance, I know $F$ cannot occur. Why? Because if $F$ occurred, $T$ would *cease* to be the true theory of chance. So, $C(F \mid T) = 0$.

  **The Result:** The Principal Principle requires you to have contradictory credences. It tells you to believe $F$ is possible (based on the chance) and impossible (based on the definition of chance under HS) simultaneously.

  Your friend is right: This is why "historical evidence" is not automatically admissible. Under HS, knowing the history up to $t$ restricts the possible futures, which restricts the possible Best Systems, which changes the chances. Therefore, history carries "inadmissible" information about the chances themselves.

  ### 3. The Fix: The New Principle (NP)

  In "Humean Supervenience Debugged" (1994), Lewis conceded that the PP is false if HS is true. He proposed the **New Principle (NP)** to replace it.

  **The Shift:**
  The PP tells you to match your credence to the *unconditional* chance: $Ch_t(A)$.
  The NP tells you to match your credence to the chance *conditional on the history*: $Ch_t(A \mid H_t)$.

  **The Formula:**
  $$C(A \mid H_t \wedge T) = Ch_t(A \mid H_t \wedge T)$$
  *(Where $H_t$ is the history up to $t$, and $T$ is the theory of chance.)*

  **How it Blocks the Bug:**
  The NP acknowledges that under HS, you cannot separate the chance from the history.
  1.  In the undermining scenario, the PP asked you to consider $C(F \mid T)$. This led to contradiction because $T$ and $F$ are incompatible.
  2.  The NP asks you to consider $C(F \mid H_t \wedge T)$.
  3.  Under the NP, the chance function on the right side ($Ch_t$) is calculated *given* that $H_t$ is fixed.
  4.  Crucially, the NP effectively says: "Conditionalize on the proposition that $T$ is the Best System *for a world that has history $H_t$*."
  5.  This blocks the inference that leads to the contradiction. It prevents you from using the current chance to predict a future that would undermine that very chance, because the chance assignment is now explicitly tied to the history that constrains the future.

  In short, the NP saves the coherence of Humean chance by sacrificing the idea that chance is independent of history. It makes the norm of rationality (credence) track the *conditional* chance, which is safe from undermining.

  ### 4. Evaluating Your "Definitional" Worry

  Now, to the crux of your disagreement. You argued: *The NP doesn't defeat the bug so much as define it away. Once the conditionalized proposition builds in the history, deference comes out true by construction, and we lose the idea that credence tracks an independently characterized objective feature.*

  **Where You Are Right:**
  You have identified a significant philosophical cost of the NP.
  1.  **Loss of Guidance:** The original allure of the PP was that Chance was a *guide*. It stood over there, objective and independent, and told our credences what to do. The NP turns Chance into a *shadow*. It says, "Look at the history, calculate the best summary of that history including its future, and match that." It feels less like "tracking an objective feature" and more like "calculating a statistic."
  2.  **Circularity Worry:** There is a sense in which the NP is tautological. If chances are defined by the Best System, and the Best System is defined by the pattern of events, and we are conditioning on the events ($H_t$), the link between credence and chance becomes very tight—perhaps too tight. It risks looking like: "Your credence should match the number that rational credence would match."
  3.  **The "Independent Feature":** You are correct that the NP abandons the idea of chance as a *sui generis* objective feature (like a propensity). If you hold that chance *ought* to be an independent guide, the NP is a surrender. It admits that under HS, chance cannot play the role the PP originally demanded.

  **Where Your Friend Is Right (and You Might Be Too Quick):**
  However, calling it "merely definitional" might be too dismissive for two reasons:
  1.  **The Mosaic is Still Independent:** Even under the NP, the Humean Mosaic (the total distribution of qualities in spacetime) is objective and independent of our minds. The Best System is determined by the Mosaic, not by our credences. Therefore, the chance function on the right side of the NP equation is still **objective**. It is not defined by our credence; it is defined by the world. The NP just changes *which* objective number we are supposed to match (the conditional one rather than the unconditional one).
  2.  **It's Not a Trivial Fix:** It required a substantive revision of the norm. It's not that Lewis just changed the definition of "chance" to make the math work; he admitted the original PP was *false* under HS. The NP is a new normative claim. It says: "Rationality requires you to acknowledge that your access to chance is mediated by history." That is a substantive epistemological claim, not a definition.
  3.  **The Alternative is Worse:** If you reject the NP, you must either reject HS (become a non-Humean about chance) or reject the idea that rational credence should align with chance at all. If you want to be a Humean *and* believe chance guides credence, the NP is the only coherent game in town.

  ### The Verdict

  **Who won the argument?**

  *   **On Metaphysics:** Your **friend** wins. She correctly identified that the "Big Bad Bug" is an inevitable consequence of combining Humean Supervenience with the original Principal Principle. The undermining futures are real, and historical evidence is not admissible in the old sense.
  *   **On Epistemology:** **You** have the stronger philosophical intuition. The New Principle *does* deflate the Principal Principle. It saves the coherence of the system by conceding that chance cannot be the robust, independent guide we intuitively want it to be. The NP makes the relationship between chance and credence look much more like a bookkeeping identity than a metaphysical constraint.

  **The Synthesis:**
  The NP works, but it changes the story.
  *   **Old Story (PP):** Chance is a boss; Credence is the employee. The boss tells the employee what to think.
  *   **New Story (NP):** Chance is a summary statistic of the employee's data (the history). The employee is told to align their thoughts with the summary of their own data.

  Your worry holds up in this sense: The NP saves Lewis's system from contradiction, but only by weakening the "objectivity" of chance into something more like "idealized subjective expectation." If you thought chance was supposed to be a robust feature of the world that *constrains* belief from the outside, the NP will feel like a defeat. If you think chance is just a useful way to summarize patterns, the NP is a successful debugging.

  Lewis himself admitted in "Debugged" that the PP was "subject to the bug" and that the NP was a "replacement." He knew he was giving up something. You were right to feel that something was lost; your friend was right that it was the price of admission for Humeanism.
