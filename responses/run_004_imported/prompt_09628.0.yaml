  **Move 4 (Mark): 2**
  This is a crucial logical distinction: the lack of an easy answer (epistemology) doesn't prove there is no answer (metaphysics). Mark correctly points out that difficulty doesn't equal ambiguity.

  **Move 5 (Dana): 1**
  While she correctly notes that legal disputes have stipulated rules, she implies that ordinary concepts lack reality simply because they lack a judge. Vagueness exists in real properties too, so this criterion doesn't definitively prove the dispute is merely verbal.

  **Move 6 (Mark): 2**
  Mark appeals to functionalism or natural kinds, suggesting concepts should track how things actually work rather than arbitrary stipulations. This is the strongest philosophical counter to Dana's deflationism, arguing for a "better" definition rather than no definition.

