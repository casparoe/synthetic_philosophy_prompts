  **The Verdict**

  Is this actually a merely verbal dispute? **No, not in the dismissive sense.** Dana is right that there is no mind-independent fact of the matter (like a physics equation) that settles whether the band is "the same." However, Mark's last move survives and leaves something real on the table: this is a **normative dispute about conceptual engineering**. The question isn't "what is the band?" but "what *should* we use the word 'band' to track?" Mark is arguing that the concept should track artistic continuity because that serves the function fans care about, whereas Dana suggests tracking legal continuity. That is a substantive disagreement about values and utility, not just semantics.

  **What Neither of Them Brought Up**

  Both of them treat the band's identity as something determined either by the musicians (Mark) or the lawyers (Dana). They both miss the role of **social ontology**: a band is partly constituted by the recognition of the audience. If the fans collectively decide the tour is a cash-grab cover act, the band *ceases to be the original band* in the only sense that matters socially, regardless of contracts or lineup history. The "fact of the matter" they are both looking for is actually a collective agreement among the listeners, which neither friend considered.
