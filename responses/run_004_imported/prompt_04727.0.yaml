  8.  **Final Polish:** Make sure the distinction between "knowing this animal is a *gavaya*" and "knowing what the word *gavaya* means" is clear. The Nyāya argument leans heavily on the latter. The knowledge gained is about the *word's capacity to denote*, not just the animal's identity.

