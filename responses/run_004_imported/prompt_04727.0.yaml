          *   If it were just perception, I would only know "This animal is like a cow." I wouldn't necessarily know "The word '*gavaya*' is the label for this kind of animal."
          *   If it were just testimony, I would only know "There is something called '*gavaya*' that is like a cow." I wouldn't know which animal in the forest fits that.
