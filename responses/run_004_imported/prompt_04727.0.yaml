          *   The Problem: How do you know `observed` is an instance of `Gavaya`?
          *   Nyāya says: You need a specific operation (Comparison) to bind the label `Gavaya` to the class of objects sharing that similarity, not just the specific instance in front of you.

      *   *Breaking down the Reply:*
          *   "That the name bos gavaeus signifies one and all members of the bos gavaeus class is not a result of perception..."
          *   Perception is particular. I see *this* animal. I don't see "all animals."
          *   Testimony is linguistic. I hear the word. But testimony alone doesn't show me the referent in the wild.
          *   The *knowledge* gained is: "The word '*gavaya*' refers to things that look like this."
          *   The opponent (Mīmāṃsā or others) says: "No, you just perceive the similarity."
          *   Nyāya says: "Perception gives you similarity. Testimony gives you the word. But the knowledge that *'This word applies to this class based on that similarity'* is a unique cognitive event."

      *   *Refining the "General Notion" Point:*
          *   This is the crux. In Nyāya, words refer to Universals (classes), not just particulars.
