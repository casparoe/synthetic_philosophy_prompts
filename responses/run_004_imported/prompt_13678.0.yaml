answer: |-
  You have hit on one of the deepest, most fascinating rifts in the entire philosophy of mathematics. Your intuition and your brother-in-law's "Monopoly" analogy are not wrong—in fact, they represent a very respectable philosophical position called **Formalism**.

  However, the mathematicians you found arguing about the "truth" of the Continuum Hypothesis (CH) are operating from a different philosophical position, usually called **Platonism** (or Realism).

  You aren't missing anything about the math. You are witnessing a clash of worldviews about what mathematics *is*. Here is the breakdown of why serious mathematicians spend careers on this if the "Monopoly rules" argument seems so sensible.

  ### 1. The Two Views: Game vs. Geography

  **The Brother-in-Law's View (Formalism):**
  In this view, mathematics is a game of symbols. We invent the axioms (the rules of Monopoly). A statement is "true" only if it can be derived from the rules. If the rules don't settle it (like CH in ZFC), then the statement has no truth value. It is meaningless to ask if it is "really" true, just as it is meaningless to ask if a "Free Parking" cash bonus is "really" part of Monopoly. It's only true if you decide to play with that house rule.
  *   **Verdict on CH:** It is undecidable. Stop asking. Pick a side if it helps your specific work, but don't claim one is "true."

  **The Set Theorists' View (Platonism):**
  In this view, mathematical objects (like sets) exist independently of us, in a sort of abstract reality. The "Universe of Sets" is out there, like a continent. Our axioms (ZFC) are not the *definition* of the universe; they are a **map** we drew to describe it.
  *   **Verdict on CH:** The fact that ZFC doesn't settle CH doesn't mean CH has no truth value. It means **our map is incomplete.** The continent of Sets either has a landmass of size $\aleph_1$ between $\aleph_0$ and $2^{\aleph_0}$, or it doesn't. We just haven't found the right features on the map (new axioms) to see it yet.

  ### 2. Why the "Monopoly" Analogy Fails for Platonists

  The Monopoly analogy fails for Platonists because Monopoly rules are *stipulative*. They are true *because* we wrote them down.

  Mathematical truth is usually *descriptive*. Consider physics. Imagine Newton's Laws were our "axioms." If there were a phenomenon Newton's Laws couldn't predict, a Formalist might say, "According to Newton, this has no answer." But a Physicist says, "Newton's laws are incomplete. Gravity is still doing something specific; we need better laws (like Einstein's) to describe what is actually happening."

  Set theorists who hunt for new axioms believe ZFC is like Newton's Laws: an incredibly successful approximation of the "Universe of Sets," but not the final word. They believe there are deeper principles about "set-ness" that we haven't formalized yet.

  ### 3. Is It Just Philosophy?

  You asked if these mathematicians are "doing philosophy and calling it math." That is a sharp question, and the answer is: **It is math, but it is motivated by philosophy.**

  If a set theorist proposes a new axiom (like a Large Cardinal axiom or a Forcing Axiom), they don't just argue about it philosophically. They do rigorous math:
  1.  **Consistency:** They prove that adding this axiom doesn't break ZFC (relative consistency).
  2.  **Consequences:** They derive new theorems. "If we assume Axiom X, then CH is false, *and* we also solve these five other open problems in analysis and topology."
  3.  **Intrinsic/Extrinsic Justification:**
      *   *Intrinsic:* Does this axiom fit our intuitive concept of what a set is? (e.g., The "Iterative Conception" of sets).
      *   *Extrinsic:* Does this axiom make the theory richer, more elegant, or more useful for other branches of math?

  So, they aren't just debating semantics. They are building rigorous mathematical structures *conditional* on new axioms to see which ones create the most coherent picture of the mathematical universe.

  ### 4. Why Most Mathematicians Side With Your Brother-in-Law

  It is important to note that for 95% of working mathematicians (analysts, geometers, algebraists), your brother-in-law is right.

  If you are calculating fluid dynamics or proving theorems about prime numbers, it does not matter if CH is true or false. You can work in ZFC and never encounter it. For most people, math is a tool, and ZFC is a sufficient rulebook. The idea that there is a "Platonic Heaven" of sets is metaphysical baggage they don't need.

  The debate is almost exclusively confined to **Foundations of Mathematics** and **Set Theory**.

  ### 5. The Current State of Play

  You mentioned that some think Large Cardinals won't do it. You are correct. We know that Large Cardinal axioms (which posit the existence of incredibly huge infinities) generally *do not* decide CH. They are "neutral" regarding CH.

  However, there are other candidates, like **Forcing Axioms** (e.g., Martin's Maximum). Many prominent set theorists (like W. Hugh Woodin or Justin Moore) have argued that these axioms provide a "complete" picture of the universe up to a certain level, and they tend to imply that **CH is False.**

  Others argue for the "Multiverse View" (championed by Joel Hamkins), which is a modern twist on your brother-in-law's view. This view says there isn't *one* universe of sets, but many. In some universes CH is true; in others, it is false. In this view, asking "Is CH true?" is like asking "Is it raining?" without specifying a location. It's true in some models, false in others.

  ### Summary

  *   **You aren't missing a math fact:** You correctly understand independence.
  *   **You aren't missing a logic fact:** You correctly understand that ZFC cannot settle it.
  *   **What you are encountering is Ontology:** The debate is about whether mathematical objects are *invented* (Formalism/Monopoly) or *discovered* (Platonism/Geography).

  If math is invented, the search for "true" axioms is nonsense. If math is discovered, the search is the most important work in foundations. Since we can't prove which view is correct (that's a philosophical question, not a mathematical one), both camps continue to work. The Platonists build new axioms to describe the "territory," and the Formalists analyze the consistency of those "games."

  Both are doing legitimate math, but they are answering different questions. One is asking, "What can we consistently define?" and the other is asking, "What is actually there?"
