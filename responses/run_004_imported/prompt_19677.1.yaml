      *   *Refining the CDT critique:* Is UDT just CDT + precommitment? Many sources say UDT *achieves* the outcome of optimal precommitment, but it is not *implemented* as CDT + precommitment. CDT agents are dynamically inconsistent. UDT agents are dynamically consistent by design. A CDT agent *wishes* it could precommit, but UDT *is* the algorithm that acts as if it did. The student says "give a CDT agent a precommitment device... it'll behave exactly like a UDT agent". This is false in cases involving logical correlation (Newcomb's) where the "device" isn't a physical contract but a logical fact about the agent's source code. CDT doesn't treat its own source code as a cause. UDT does. So the claim is substantively wrong regarding the *mechanism* and *scope*.

