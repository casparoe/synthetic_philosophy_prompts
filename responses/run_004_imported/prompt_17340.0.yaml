answer: |-
  This is a fantastic question. Given your 35 years in the field, you've got the intuition for why this matters: when a heart fails, it's not just making a different noise; it's *failing* at something objective. That normativity is the hard nut philosophy tries to crack.

  If you dropped Aristotle into a seminar on Wright, Neander, and Cummins, I suspect he'd pull up a chair, sharpen his quill, and tell **both** camps that they are confusing *efficient* causes with *final* causes. He would likely argue that we are indeed mangling the concept of the final cause, though he might find the Historical (Selected Effects) camp more salvageable than the Systemic (Causal Role) camp.

  Here is how I think the Stagirite would break down the modern debate.

  ### 1. He would reject Cummins (Systemic) immediately
  Aristotle would have the least patience with Robert Cummins. The Causal Role analysis says function is relative to the analytical interests of the observer (e.g., the heart functions to make noise relative to a cardiologist's ear).

  For Aristotle, this is a category error. In *Physics* II and *Parts of Animals*, he is adamant that teleology in nature is **intrinsic**, not extrinsic. The *telos* (end/goal) belongs to the substance itself, not to the scientist analyzing it.
  *   **The Noise:** Aristotle would agree that the heart makes noise. But he would classify that as a *material necessity* or an incidental byproduct of the pumping, not a *final cause*.
  *   **The Relativism:** To say the function changes based on the system you analyze (circulatory system vs. doctor-patient system) would strike him as sophistry. The "system" that matters is the organism itself, understood as a unified whole striving toward its own maintenance and reproduction.

  So, he'd toss Cummins out. Function isn't in the eye of the beholder; it's in the nature of the thing.

  ### 2. He would find Wright/Neander (Historical) intriguing but incomplete
  The Selected Effects (SE) theory feels more Aristotelian because it restores **normativity**. If the function of the heart is defined by what it was selected for, then a heart that doesn't pump is objectively malfunctioning. It's not just "different"; it's "wrong." Aristotle would like that. He believes nature does nothing in vain, and parts exist for the sake of the whole.

  However, Aristotle would likely critique the SE theory on two metaphysical grounds:

  **A. Efficient vs. Final Causation**
  Modern evolutionary biology (and the SE theory) attempts to *reduce* final causation to efficient causation. It says: "We don't need mysterious 'goals'; we just need past selection pressures (efficient causes) that shaped the trait."
  Aristotle would argue this explains *how* the heart came to be prevalent (the history), but it doesn't explain *why* the heart is there in the ontological sense. For Aristotle, the final cause is the "that for the sake of which." It is the organizing principle that directs the development of the embryo and the activity of the adult. Shifting the burden to ancestral history doesn't capture the current, immanent directedness of the organism. He might say the SE theorists are describing the *history of the form*, but missing the *activity of the form*.

  **B. The Unit of Selection vs. The Substance**
  Aristotle's teleology is centered on the **individual substance** (the specific animal) actualizing its potential. The SE theory is centered on **lineages** and gene frequencies.
  If you tell Aristotle, "The heart's function is to pump blood because that helped ancestral organisms replicate," he might ask: "But what is it doing *now*?" For Aristotle, the final cause is immanent in the current activity of the organism flourishing (*eu zên*). The SE theory makes function backward-looking; Aristotle's function is forward-looking (in terms of development and activity), even if it isn't conscious intent.

  ### 3. The "Mangling" Charge
  You hit the nail on the head with your last option. Aristotle would likely argue that both sides are trying to naturalize teleology by stripping it of its metaphysical weight.

  *   **Cummins** strips it of normativity (anything can be a function if you pick the right system).
  *   **Wright/Neander** strip it of immanence (the purpose is back there in the past, not in the current nature of the thing).

  Aristotle's view is that living things are **self-organizing wholes**. The "function" of the heart is tied to the *good* of the organism. It's not just about what kept the lineage alive (SE), and it's not just about what contributes to a capacity (CR). It is about the part serving the life of the whole *because* the whole organizes the part.

  He would probably say: *"You are all trying to explain the arrow by analyzing the archer's history (Wright) or the arrow's impact on the target board (Cummins), but you are ignoring the tension in the bowstring right now that gives the arrow its direction."*

  ### The Verdict
  If forced to choose a side in a modern departmental feud, Aristotle would probably sit with the **Historical (Wright/Neander)** camp, but only as a temporary ally.
  *   He would agree with them that functions are objective and that malfunction is real.
  *   He would agree that the "noise" of the heart is not its function.

  But ultimately, he would write a paper titled *"On the Insufficiency of Selection as Final Causality."* He would argue that selection is merely the **efficient cause** that explains the distribution of traits, while the **final cause** is the internal principle of change and rest that makes the organism a unified living being rather than a heap of parts.

  Given your background in field biology, you might appreciate this distinction: The SE theorist looks at the population over generations to define the trait. Aristotle (and perhaps a field biologist's intuition) looks at the individual organism in its environment and sees a directed unity that demands explanation *now*, not just in the deep past.

  **Scholarly Note:** If you want to dive deeper into this specific intersection, the philosopher of biology **James Lennox** is the definitive voice on Aristotle's biology. He argues persuasively that Aristotle is a naturalist, not a mystic, but that his teleology is fundamentally about *explanatory priority* in development, which neither Cummins nor Wright fully captures.
