          *   *Mechanistic Difference:* SD is "one-way" (past determines all). RC is "two-way" (boundary conditions at both ends).

      *   **Section 2: The "Conspiracy" Charge against Superdeterminism.**
          *   Why "conspiracy"? It implies a correlation between *free choices* (or pseudo-free) and *particle states* that is unexplained by known physics.
          *   Hossenfelder/'t Hooft response: It's not a conspiracy, it's just determinism. But the burden is explaining why the correlation is *specific* to Bell violations and doesn't show up elsewhere (e.g., in medical trials or stock markets).
          *   The "Screening Off" problem: In SD, $\lambda$ must screen off $a$ and $b$, but $a$ and $b$ are correlated with $\lambda$.

      *   **Section 3: The Retrocausal Claim to Innocence.**
          *   Price/Wharton argument: It's not a coincidence; it's a law. Just as future position depends on past force, past $\lambda$ depends on future $a$.
          *   The Lagrangian/Action perspective: The path is determined by endpoints. No "propagation" of conspiracy, just a global constraint.
          *   This avoids the "common cause in the deep past" narrative.

      *   **Section 4: The No-Signaling Constraint and Fine-Tuning (The Critical Turn).**
          *   Here is where the user's intuition about "fine-tuning" is crucial.
