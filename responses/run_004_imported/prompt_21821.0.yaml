      *   **Move 6: Theo's Semantic Dissolution.**
          *   *Claim:* They are arguing past each other. Nadia = "traceable to one mind." Theo = "market label."
          *   *Reasoning:* Once definitions are clear, no fact remains to fight over. Just a choice of definition.
          *   *Evaluation:* This is the crux. It attempts to turn a normative dispute into a semantic one.
          *   *Winner:* Contested. It clarifies, but doesn't resolve the *conflict*.

      *   **Move 7: Nadia's Normative Counter.**
          *   *Claim:* Even with definitions, there's a question of what a cover is *supposed* to invoke. What is a reader *owed*?
          *   *Reasoning:* It's not just what words mean, but what promise the product makes.
          *   *Evaluation:* Strongest move. Shifts from descriptive (what is) to normative (what ought to be).
          *   *Winner:* Nadia.

  3.  **Evaluate Theo's Closing Move (The "Dissolution"):**
      *   Theo thinks he's ended the fight by saying "We mean different things."
