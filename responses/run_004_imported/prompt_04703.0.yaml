answer: |-
  # The Sadistic Trap: Why Total Utilitarianism is the Only Coherent Escape from Arrhenius's Impossibility Theorems

  The dinner debate you had is the inevitable endpoint of anyone who stays in population ethics long enough. You start with Parfit's *Reasons and Persons*, horrified by the Repugnant Conclusion (RC). You try to fix it with Average Utilitarianism, only to run into the Mere Addition Paradox and the Absurd Conclusion. You try Critical-Level views, and suddenly you are endorsing the Sadistic Conclusion. Then you read Gustaf Arrhenius's dissertation and his subsequent book, *Population Ethics: The Challenge of Future Generations*, and you realize the trap is structural. Arrhenius's impossibility theorems demonstrate that no welfarist axiology can satisfy a set of seemingly adequate conditions simultaneously.

  Most commentators treat this as a reason to shrug, cycle through the menu of "least worst" options, or retreat to vague lexical intuitions. I will not do that. Arrhenius's work does not prove that population ethics is broken; it proves that our intuitive constraints are inconsistent. To build a working moral theory, we must cut a constraint.

  My position is decisive: **We must reject Non-Elitism and accept the Repugnant Conclusion.** We must hold fast to **Weak Non-Sadism**, **Transitivity**, and **Dominance**. Consequently, **Total Utilitarianism** is the only viable population axiology. While the Repugnant Conclusion is psychologically jarring, the alternatives—specifically the Sadistic Conclusion and the collapse of rational transitivity—are morally catastrophic or practically paralyzing. The "monstrosity" your friend detected in Total Utilitarianism is a feature of aggregation, not a bug; the true monster lurks in the attempts to avoid it.

  ### The Impossibility Landscape

  To understand why Total Utilitarianism (TU) is the necessary choice, we must look closely at what Arrhenius's theorems actually force upon us. Arrhenius does not merely restate Parfit's RC. He formalizes a conflict between conditions that are individually highly plausible. A simplified version of his central impossibility result suggests that no population axiology can satisfy all of the following:

  1.  **Egalitarian Dominance:** If population A is perfectly egalitarian and has higher average welfare than B, A is at least as good as B.
  2.  **General Non-Extreme Priority:** We should not give absolute priority to the worst off (rules out strict prioritarianism that ignores total sums).
  3.  **Non-Elitism:** There is no life so good that a small loss in its quality cannot be compensated for by adding enough lives with positive welfare. (This is the condition that blocks the RC).
  4.  **Weak Non-Sadism:** It is not better to add lives with negative welfare than to add lives with positive welfare.
  5.  **Weak Quality Addition:** Adding a life with very high positive welfare is at least not worse than not adding it.

  Total Utilitarianism satisfies 1, 2, 4, and 5. It violates 3 (Non-Elitism). This violation *is* the Repugnant Conclusion: that a massive population of lives barely worth living can outweigh a smaller population of excellent lives.

  However, consider the main competitor: **Critical-Level Utilitarianism (CLU)**. CLU sets a threshold (above zero) where a life must be to contribute positive value to the total. This blocks the RC because lives "barely worth living" (positive but below the critical level) count as negative contributions. But to satisfy Non-Elitism and avoid the RC, CLU must set the critical level high enough to block the slide from A to Z. In doing so, CLU violates **Weak Non-Sadism**. It implies that adding a population of lives with *negative* welfare (suffering) can be better than adding a population of lives with *positive* welfare (happy), provided the happy lives are below the critical level. This is the **Sadistic Conclusion**.

  Other views fare worse. Average Utilitarianism violates Dominance (adding a happy person can lower the average). Lexical views (which say some goods are incomparable) avoid the RC but violate **Continuity** and often lead to their own "Lexical Repugnant Conclusions" or imply **Intransitivity**, making rational choice impossible.

  ### The True Monster: Sadism vs. Repugnance

  The core of my argument is a comparative assessment of the bullets we must bite. We have to choose between violating Non-Elitism (TU/RC) or violating Weak Non-Sadism (CLU/Sadistic Conclusion).

  The Sadistic Conclusion is morally indefensible. It asserts that, *ceteris paribus*, a world where we create people who suffer is preferable to a world where we create people who enjoy their lives, simply because the enjoyers don't enjoy them *enough*. This turns welfarism on its head. If the metric of morality is welfare, then creating negative welfare is pro tanto bad, and creating positive welfare is pro tanto good. To claim that creating positive welfare is *worse* than creating negative welfare (in specific population contexts) is to sever the link between welfare and goodness. It renders the theory action-guiding only in a perverse sense.

  Contrast this with the Repugnant Conclusion. The RC states that a huge number of lives with net positive welfare outweigh a small number of excellent lives. While this clashes with our intuition that "quality" matters more than "quantity," it does not violate the fundamental sign of welfare. In Population Z (the repugnant one), every single person has a life worth living. No one is suffering net negative. The "repugnance" stems from a failure of imagination or a bias toward the elite. As Tannsjo has argued, if a life is "barely worth living," it is not a life of drab misery; it is a life where the good slightly outweighs the bad. It contains joy, satisfaction, and meaning, just less of it than the A-lives. To say that $10^{50}$ units of good outweigh $10^{9}$ units of greater good is mathematically consistent and morally coherent, provided you accept that welfare aggregates.

  If I must choose between a theory that tells me "more happy people are better than fewer excellent people" (RC) and a theory that tells me "some suffering people are better than some happy people" (Sadistic Conclusion), I choose the former without hesitation. The Sadistic Conclusion is a dealbreaker; the Repugnant Conclusion is a pill to swallow.

  ### The Case for Continuity and Transitivity

  One might object: "Why not go Lexical?" Parfit's later work and Arrhenius's own sympathies lean toward the idea that some values are lexically superior, blocking the slide from A to Z by denying that enough quantity can ever equal higher quality. This preserves Non-Elitism and Non-Sadism but violates **Continuity** (the Archimedean property that any good can be traded for enough of a lesser good).

  While Lexical Views avoid the RC, they introduce a fatal flaw for any ethics intended to guide real-world policy (such as Effective Altruism): **Intransitivity** or **Incompleteness**. If A is better than A+, and A+ is better than B, but A is not better than B (because they are lexically incomparable), your preference ordering is cyclic. In practical terms, this invites money pumps and makes cost-benefit analysis impossible. If we cannot trade off small probabilities of existential catastrophe against certain economic losses because the values are "lexically distinct," we cannot act.

  Furthermore, Lexical Views often succumb to the **Lexical Repugnant Conclusion**: Is a population of infinite A+ lives better than a finite population of A lives? If you say yes, you have a repugnant conclusion of a different flavor. If you say no, you violate Dominance.

  Total Utilitarianism preserves **Transitivity** and **Continuity**. This makes it the only view that remains robust under uncertainty and scalable to the astronomical stakes of the long-term future. In a world where we might influence $10^{50}$ future lives, we need a calculus that can handle large numbers without breaking into lexical discontinuities. TU is that calculus.

  ### Rehabilitating Population Z

  The resistance to TU usually rests on a phenomenological error regarding Population Z. When we imagine "lives barely worth living," we tend to imagine a grey, dreary existence—muzak and potatoes, as Parfit famously put it. But in welfarist terms, "barely worth living" simply means $W > 0$.

  If we take the long-term future seriously, Population Z is not a world of depressed humans eating potatoes. It is a world of $10^{50}$ beings whose lives contain net positive experiences. Given the potential for post-human welfare, the "floor" of a life worth living could be incredibly high by current standards. The RC only seems repugnant if we assume the "barely worth living" floor is near the threshold of suicide. If the floor is merely "a life one is glad to have lived," then the RC transforms from "Choosing a sea of misery over a peak of joy" to "Choosing a vast continent of contentment over a small mountain of ecstasy."

  The intuition that the mountain is better is an elitist bias (violating Non-Elitism). It privileges the intensity of the few over the existence of the many. In a welfarist framework, existence is the prerequisite for value. More existences with net positive value is more value.

  ### Conclusion: The Cost of Coherence

  Arrhenius's impossibility theorems are not a reason to abandon population ethics; they are a reason to abandon the hope that population ethics will align with all our unreflective intuitions. We are forced to choose which intuition to sacrifice.

  1.  **Sacrificing Non-Sadism** (Critical-Level) leads to endorsing suffering over happiness.
  2.  **Sacrificing Transitivity/Continuity** (Lexical Views) leads to irrational decision procedures.
  3.  **Sacrificing Dominance** (Average Views) leads to the conclusion that adding happy people can make the world worse.
  4.  **Sacrificing Non-Elitism** (Total Utilitarianism) leads to the Repugnant Conclusion.

  Of these four, the Repugnant Conclusion is the least costly. It requires us to revise our intuition about the trade-off between quality and quantity, but it does not require us to revise our logic, our understanding of suffering, or our commitment to Pareto improvements.

  Your friend at dinner suspected Total Utilitarianism was "secretly committed to something monstrous." They were half-right. It is committed to the idea that numbers matter, and that no single life, no matter how beautiful, is so sacred that it outweighs the aggregate good of billions of lesser lives. That is not monstrosity; that is the mathematical reality of aggregation. The true monstrosity lies in the theories that try to deny this math, only to find themselves justifying the creation of suffering to avoid the sight of a vast, mediocre happiness. We should bite the bullet. We should accept the Repugnant Conclusion, not because it is pleasant, but because the alternatives are morally bankrupt.
