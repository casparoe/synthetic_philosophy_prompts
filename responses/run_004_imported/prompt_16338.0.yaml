answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Father's Name]'s kid.

  When I agreed to give this toast, I asked my dad if he had any advice. He thought for a minute and said, "Yes. Don't tell them I loved this job. They've done it too; they'll know I'm lying. But don't tell them it was a waste of time, because that would be insulting to them, and honestly, I don't think it's true."

  That is a very specific tightrope to walk. But it reminded me of something I read years ago in a philosophy class, by a man named Moritz Schlick. He made a distinction between two ways of spending our time. He called them "Work" and "Play."

  For Schlick, "Work" is something you do for the sake of something else. You do it to get a result. You do it to get paid. You do it to secure a future. It is a means to an end. "Play," on the other hand, is something you do for its own sake. You don't do it to get somewhere; you do it because the doing of it is the point. Schlick argued that while work builds the structure of a life, play is where we actually find the meaning of it.

  Looking at my father's last thirty-six years, I think he has mastered both categories better than most people ever do.

  To his colleagues here: My father never called insurance claims adjusting his "calling." He called it "reliable." And in this economy, in this life, "reliable" is a virtue that doesn't get enough credit. For thirty-six years, he showed up. He solved problems that weren't his. He navigated the paperwork, the regulations, and the difficult days so that he could come home and provide for us. That wasn't "dead time." That was the foundation. It was the heavy lifting that built the house I grew up in and funded the garage where he spends his weekends.

  There is a profound dignity in doing work honestly, even when the work itself isn't your passion. You all know what that takes. It takes discipline. It takes integrity. And it takes a love for something outside of the office strong enough to motivate you to be that reliable.

  Because that reliability bought him the freedom to be here tonight, and the freedom to be who he is on Saturday mornings.

  If you want to see the "Play" Schlick talked about, you have to go to our garage. You have to see him hunched over a disassembled 19th-century mantle clock. He isn't getting paid. He isn't trying to finish a task so he can move to the next one. He is just... there. With the gears. With the springs.

  Schlick wrote that the capacity for play is tied to youth. He said that when we are truly engaged in an activity for its own sake, we stop counting the cost and start living in the moment. I can confirm that my father is objectively younger when he is holding a tweezers and a mainspring than he is when he is balancing a spreadsheet. The gray in his beard seems to matter less. The tension in his shoulders disappears. He isn't working toward a retirement; in those moments, he is already retired. He is already free.

  For a long time, I worried that the job took time away from the clocks. But I realize now that the relationship wasn't a competition. It was a partnership. The "Work" protected the "Play." The steady paycheck bought the tools, the lights, the parts, and the security that allowed the hobby to remain pure. If he had tried to make the clocks his job, they would have become work. By keeping them separate, he kept them sacred.

  So, Dad, you were right. I'm not going to stand here and say you spent thirty-six years chasing a dream. You spent thirty-six years building a reality. You did the work so you could enjoy the play. And you did the work well enough that you never had to compromise the play.

  To the coworkers: Thank you for sharing the burden of the work with him, and for respecting the boundary he drew around his life.

  To the clock enthusiasts: Thank you for keeping him young.

  And to my father: Thank you for teaching me that a life doesn't have to be one thing. It can be the steady hand that signs the checks, and the steady hand that fixes the time.

  Here's to the reliability that got you here, and to the time that is now entirely your own. Cheers.
