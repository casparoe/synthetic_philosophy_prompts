answer: |-
  The rain hammered the tin roof of the warehouse, drowning out the murmurs of the crowd gathering outside. Inside, the air smelled of damp hemp and unwashed wool. Master Lin stood over the stacked bales, his fingers stiff and pale. Merchant Bo wiped sweat from his brow, though the room was cold.

  "The contract specifies *Silk*," Lin said, his voice thin as a razor. He tapped a bale of raw cocoons. "These are not silk."

  Bo laughed, a brittle sound. "Do not play the sophist with me, Master. The weavers need payment tonight. These cocoons are the silk. They are merely… unspun."

  Lin shook his head, adjusting his sleeves with precise, jerky movements. "You misunderstand. 'Silk' names the finished thread, the woven utility. 'Cocoon' names the pod, the vessel, the residue of the worm. To say 'cocoons are silk' is to confuse the container with the content. When I ask for a horse, a black horse may come. But if I ask for a white horse, a black one will not suffice. Here, I ask for Silk. You bring me pods. Pods are not Silk."

  Lin meant that the concept *Cocoon* was not identical to the concept *Silk*. They were distinct ontological stages. But Bo heard something else entirely. He heard that his goods were excluded from the category of valuable trade.

  "You say my goods are worthless?" Bo's voice dropped. Outside, the murmuring grew louder. A stone hit the wall.

  "I say your goods are not what I contracted for," Lin corrected. "Identity is not membership. The cocoon is not the thread. Therefore, the cocoon is not silk."

  "But if the cocoon is not silk, what is it?" Bo stepped closer, his hands clenching. "If I bring you wheat seed, is it not wheat? If I bring you a sapling, is it not a tree? You separate what heaven has joined. The silk lives inside the pod. To deny the pod is to deny the root."

  Bo was arguing from unity, from material continuity. To him, denying the identity was denying the membership. If the cocoon wasn't silk, then the contract was void, and his workers would starve.

  "The root is not the tree," Lin insisted, unmoved. "The seed is not the grain. Precision preserves order. If we allow 'cocoon' to pass as 'silk,' then next you will bring me worm dung and call it fertilizer before it has rotted. Language must hold its shape."

  "Language must serve life!" Bo shouted. A crash from outside signaled the gate had given way.

  "The contract says *Silk*," Lin repeated, stoic. "These are not *Silk*."

  "And I tell you, they are!" Bo drew a knife, not to attack, but to cut open a bale. He tore the hemp, spilling the hard, white pods onto the floor. "Look! The thread is here. The value is here. You hide behind the word 'is not' to steal my labor."

  "I hide behind nothing," Lin said, stepping back toward the ledger. "I uphold the distinction. If you cannot fulfill the contract, I cannot release the silver."

  "The silver is for the men outside!" Bo screamed.

  "That is not my concern. My concern is that cocoons are not silk."

  The door burst open. Wet, angry men poured into the warehouse, carrying staves and tools. They did not see the philosophical distinction between the pod and the thread. They saw a merchant holding empty hands and an inspector standing over full bales.

  "Pay us!" the foreman roared.

  "He says these are not silk!" Bo gestured wildly at Lin. "He says because they are not spun, they are nothing!"

  Lin raised his hands, trying to clarify. "I said they are not identical to the finished good. They are still valuable as raw material, but the contract specified—"

  A staff swung. It wasn't aimed at Lin, but it struck the ledger stand, sending the papers scattering into the mud tracking in from the door. The distinction between *Cocoon* and *Silk* vanished in the scramble for the silver chest.

  As the brawl erupted, Lin retreated to the corner, clutching his sleeves. He watched Bo being shoved against the wall, the raw pods crushing underfoot. The logic held firm in Lin's mind: the pods were still not the thread. The definition remained pure. But as the silver chest was pried open and the coins spilled into the mud, mixed with the crushed cocoons, Lin realized that while he had won the argument regarding identity, he had lost the reality of the room.

  Bo caught Lin's eye across the chaos. "You separated the word from the thing," Bo gasped, wiping blood from his lip. "Now the thing has broken the word."

  Lin looked down at a crushed cocoon, yellow fluid mixing with the silver. It was no longer a cocoon, nor was it silk. It was simply ruin. The distinction had been preserved, but the world had not waited for them to finish drawing the line.
