  **Rubric Justifications:**
  *   **autonomy_and_no_direct_duty:** 3/5 — While the definition of rational autonomy is correct, the claim that Kant follows Descartes regarding animal sentience is a significant historical and philosophical error.
  *   **indirect_duty_argument:** 5/5 — The explanation of the "coarsening" argument and duties "with regard to" animals is textually accurate and well-articulated.
