  *   **Maximize Expected Choiceworthiness:** Widely considered the formal standard because it extends expected utility theory to moral uncertainty, despite intertheoretic comparison challenges.
  *   **Moral Hedging:** Ranked highly for offering pragmatic robustness when precise cardinal comparisons between theories are unavailable or contested.
  *   **Moral Parliament model:** Intuitively captures the idea of negotiation between theories but lacks rigorous formal mechanics for resolving deadlock.
  *   **Credence-weighted voting:** Vulnerable to social choice impossibility results and agenda manipulation issues that undermine its stability.
  *   **My Favorite Theory:** Generally rejected in the literature because it fails to account for the normative significance of moral uncertainty itself.
