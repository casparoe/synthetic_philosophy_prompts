answer: |-
  This is an exceptionally sharp intervention. You have identified a pressure point in teleosemantics that is often glossed over in philosophy seminars because philosophers rarely have the population genetics background to see just how fragile the "selection history" premise is. Your title, *Teleosemantics and the Ghost of Adaptationism*, is apt.

  You are asking for a pre-submission review from a philosophical perspective, keeping your biological expertise in mind. Here is my assessment, structured around your three specific questions.

  ### 1. Have you got Millikan's apparatus roughly right?

  **Yes, largely.** Your understanding of the core etiological account is correct: for Millikan, a proper function is defined by the historical conditions that explain the reproduction of the trait. A token state (like a specific belief) gets its content via **derived proper functions**—it inherits its normative status from the mechanism that produced it, which in turn must have a direct proper function grounded in selection.

  **Where you might give "derived proper function" slightly more credit:**
  Millikan is aware that not every token needs its own selection history. She allows that new mechanisms can arise that are variations on old themes. If a mechanism for "tracking predators" is co-opted for "tracking stock prices," Millikan would likely argue that the *derived* function of the stock-price belief is unstable or non-existent unless there is a new reproductively established family forming around that specific usage.

  **Where your critique holds:**
  You are correct that derived functions cannot do the heavy lifting if the *anchor* mechanism itself lacks a clear etiological history. If the cognitive capacity for "abstract inference" is a spandrel (a byproduct of brain size increase selected for thermoregulation or metabolic efficiency, say), then there is no direct proper function for the mechanism to pass down to its tokens. Derived functions are parasitic on direct proper functions. If the host is a ghost, the parasite starves.

  **One nuance:** Millikan distinguishes between a trait being *adaptive* now and having a *proper function*. A trait can have a proper function even if it is currently maladaptive, provided it was reproduced *because* of its effects in the past. However, your point about **exaptation** cuts deeper: if it was reproduced for reason *A* (thermoregulation) but we are using it for *B* (logic), Millikan must say its proper function is *A*. Consequently, any "belief" generated by this logic-machine about *B* is technically a misrepresentation or lacks content entirely, because the mechanism was not selected to correlate with *B*. This supports your worry.

  ### 2. Is this distinct from the standard disjunction/indeterminacy worries?

  **Yes, it is distinct and more fundamental.**

  *   **The Disjunction Problem:** Assumes there *is* a proper function but asks *which* environmental correlate fixes the content (flies vs. dark moving dots). It is a problem of **individuation**.
  *   **The Swampman Objection:** Assumes that without *any* history, there is no content. It is a problem of **existence** (based on total lack of history).
  *   **Your Objection:** This is a problem of **epistemic access to existence**, or perhaps **metaphysical indeterminacy of existence**. You are arguing that for many cognitive traits, the historical fact required to ground content *does not obtain* (due to drift/exaptation) or is *in principle unrecoverable*.

  This is not just a redescribed disjunction problem. The disjunction problem asks, "Given selection for F, does the state represent F or G?" You are asking, "Given the messiness of evolution, is there any F for which this state was selected?"

  If you are right, teleosemantics doesn't just suffer from indeterminacy of content; it risks collapsing into a form of **eliminativism** for higher-order human cognition. If human abstract reasoning is largely exaptive or drift-driven (as Gould might have suspected), then on strict Millikanian terms, human abstract thoughts have no determinate content. They are "noise" rather than "signals." This is a much stronger conclusion than the standard seminar objections yield.

  ### 3. What is the strongest reply available to a teleosemanticist?

  There are two main lines of defense a philosopher like Neander or Godfrey-Smith might offer.

  **Reply A: The "Cumulative Selection" Move (Neander)**
  Karen Neander, in *Misrepresenting and Malfunctioning*, modifies Millikan's view slightly. She argues that we don't need to identify the *origin* of the trait's reproduction, but rather that the trait has been maintained by **cumulative selection** for a specific effect.
  *   *The Argument:* Even if a trait started as an exaptation, if it has *subsequently* been shaped by selection for its current representational role (even for a short evolutionary time), it acquires a proper function.
  *   *The Weakness:* This concedes your biological point. For many human cognitive capacities (language, abstract math, moral reasoning), the timeframe is too short for significant cumulative selection to have fixed a specific function. Neander's move saves teleosemantics for frog vision, but may not save it for human philosophy.

  **Reply B: The "Normal Conditions" and "Consumer" Account**
  Millikan emphasizes the **consumer** of the signal, not just the producer. A mental state means what it does because downstream systems use it *as if* it indicates X.
  *   *The Argument:* Even if the *producer* mechanism is a spandrel, if the *consumer* mechanisms (action planners, other belief systems) have a selection history of relying on that state to track X, content might be fixed by the consumer's history.
  *   *The Weakness:* This just pushes the regress back. Do the consumer mechanisms have a clean selection history? If the whole cognitive architecture is a tangled web of exaptations, the consumers are just as historically murky as the producers.

  **Reply C: The "Bite the Bullet" (Eliminativism)**
  The most honest reply is: "So what?"
  *   *The Argument:* Teleosemantics is a naturalistic theory. If naturalism tells us that human higher cognition is a biological accident without a specific selection history, then teleosemantics predicts that human higher cognition lacks determinate content. This confirms the theory's naturalistic credentials rather than refuting them.
  *   *The Weakness:* This renders teleosemantics useless for the very project most philosophers care about: explaining human intentionality. It saves the theory by sacrificing the phenomenon.

  ### Where you might be overreaching (The "Biology vs. Philosophy" Check)

  There is one area where a philosopher might push back on your biological premises, not to deny them, but to soften their impact:

  **The "Selection-for" vs. "Selection-of" Distinction:**
  Philosophers might argue that teleosemantics requires only that the trait was *selected of* (reproduced due to correlation with F), not that we can *prove* the specific selective pressure. They might argue that as long as the trait is an **adaptation** (in the broad sense of being a product of selection, even if messy), there is *some* proper function, even if we cannot specify it.
  *   *Counter:* You are right to reject this. Teleosemantics needs the *specific* function to fix the *specific* content. "Selected for survival" is too broad to distinguish "belief about rain" from "belief about food."

  **The "Drift" Threshold:**
  A philosopher might argue that for complex cognitive mechanisms, drift is unlikely to be the *sole* explanation. Even if the trait wasn't optimized, it was likely maintained by negative selection (purifying selection).
  *   *Counter:* Maintenance is not the same as functional specification. Purifying selection keeps the engine running, but it doesn't tell you whether the engine is *for* propulsion or *for* generating heat. Your exaptation point covers this well.

  ### Recommendation for the Reading Group

  You have not embarrassed yourself; you have identified a genuine vulnerability. However, to make the piece bulletproof for a philosophy audience, I suggest two tweaks:

  1.  **Clarify the Stakes:** Explicitly state that if your argument holds, teleosemantics may be true for simple organisms (frogs, flies) where adaptationist explanations are more secure, but fails for human higher cognition. This prevents the philosophers from dismissing you by pointing to simple cases.
  2.  **Acknowledge the "In Principle" vs. "In Practice" Gap:** A philosopher might say, "The function exists even if we can't know it." Your counter should be: "If the history is genuinely indeterminate (due to drift/equifinality), then the function is *metaphysically* indeterminate, not just epistemically hidden." Lean into the population genetics argument that these histories are often not just unknown, but *non-existent* as singular narratives.

  **Verdict:** Your piece is strong. It bridges the "Two Cultures" gap effectively. The "Ghost of Adaptationism" is a serious challenge that forces teleosemanticists to either abandon human cognition or embrace a radical biological contingency that most philosophers of mind are unwilling to accept. Bring it to the group.
