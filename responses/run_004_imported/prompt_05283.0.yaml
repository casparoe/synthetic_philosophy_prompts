answer: |-
  **MEMORANDUM**

  **TO:** Triage Protocol Committee
  **FROM:** [Your Name/Role]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Default Protocol: Survivor Count in Impossible Choices

  **Purpose**
  This memo addresses the committee's deadlock regarding triage decisions in scenarios where resources allow for the rescue of only one of two equally viable survivor groups (e.g., 1 survivor vs. 5 survivors). The goal is to establish a default protocol that is operationally decisive for Shift Commanders while respecting the ethical weight of every individual life.

  **The Ethical Objection**
  We acknowledge the valid concern raised by the committee: that summing lives can feel like reducing human beings to statistics. Philosophically, it is true that the single survivor in Pocket A loses everything, just as the five in Pocket B do. Death is not "multiplied" for the individual; the tragedy is absolute for each person regardless of the count. To ignore this is to risk moral injury to our teams.

  **The Recommendation**
  Despite this, the committee recommends the following default protocol:

  > **When tactical access, medical stability, and time-to-failure are equal, teams must prioritize the pocket containing the greatest number of viable survivors.**

  **Rationale**
  This rule is not based on cold mathematics, but on the principle of **Equal Value**.

  If we hold that every life has infinite and equal worth, we cannot arbitrarily choose to preserve one life at the cost of five. To ignore the count is not to honor the individual in Pocket A; it is to render the five individuals in Pocket B invisible. By choosing the larger group, we are not saying the one person matters less. We are acknowledging that *every* person matters equally, and our duty is to preserve as much of that equal value as physically possible.

  The "separateness of persons" argument is morally sound in reflection, but operationally, it offers no decision rule. In the absence of a medical or tactical reason to choose otherwise, choosing the smaller group actively sacrifices five distinct futures to save one. Our mandate is to minimize the loss of life, not to randomize it.

  **Operational Directive for Shift Commanders**
  Under pressure, ambiguity kills. This protocol is designed to carry the moral burden so the Commander can execute the rescue.

  1.  **Verify Equality:** Confirm that access, stability, and survivability are effectively equal between pockets.
  2.  **Apply the Count:** If equality is confirmed, the number of survivors becomes the tie-breaker.
  3.  **Execute:** Commit resources to the larger group immediately. Do not pause to debate the ethics on scene.

  **Conclusion**
  This protocol does not deny the tragedy of the one. It accepts that in catastrophic failure, we may be forced to choose, and when forced, we must choose the path that honors the equal worth of the greatest number of our neighbors.

  **Recommendation:** Adopt the "Greatest Number" default as written above for the Field Guide.
