prompt: |-
  I volunteer with our county's urban search-and-rescue squad, and I'm on the committee rewriting the triage section of our field guide - the part covering what a team does when it can't physically reach everyone before a structure fails. Here's the case we can't agree on: after a collapse, two pockets of survivors turn up, equally reachable, equally stable, equally likely to die if we're not through in 20 minutes, and there's only time to cut through to one. Pocket A has 1 person, Pocket B has 5. Half the committee wants the rule to just be "always take the bigger number, end of story." The rest of us keep getting stuck on something I read once, that the numbers shouldn't automatically decide it, since 5 deaths aren't "5 times worse" than 1 death for any actual person - nobody loses all 5 lives, its just 5 seperate people each losing their own one life, same as whoever's stuck in Pocket A. Can you write us a short memo recommending what our default protocol should actually be, clear enough that a shift commander could use it under pressure, and that takes that objection seriously instead of just waving it away?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Urban Search-and-Rescue (USAR) squad, county level. Rewriting the triage section of the field guide.
      *   **Scenario:** Post-collapse, two survivor pockets (A: 1 person, B: 5 people). Both equally reachable, stable, and likely to die within 20 minutes if not reached. Only time/resources to save one group.
      *   **Conflict:** Committee split.
          *   Side 1: Utilitarian view ("Always take the bigger number").
          *   Side 2: Deontological/Egalitarian view ("Numbers shouldn't automatically decide; 5 deaths aren't 5x worse for an individual; each life is unique").
      *   **Task:** Write a short memo recommending a default protocol.
      *   **Requirements:** Clear enough for a shift commander under pressure, takes the ethical objection seriously (doesn't just wave it away), actionable.

  2.  **Determine the Ethical & Operational Framework:**
      *   *Operational Reality:* In disaster medicine and USAR, triage protocols *must* be actionable. Hesitation kills. "Greatest good for the greatest number" is the standard principle (START/JumpSTART triage logic).
      *   *Ethical Nuance:* The objection raised by the committee is philosophically valid (the "separateness of persons" argument often associated with John Rawls or Frances Kamm). However, in emergency management, treating lives as equal *units of value* usually leads to saving the most lives, which is the overarching goal of public safety.
      *   *Resolution:* The protocol needs to affirm the value of the individual (addressing Side 2) while establishing a clear decision rule for impossible choices (addressing Side 1 and operational necessity). The rule should be "Save the Most" *because* every life counts equally, not *despite* it.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the gravity of the situation. Validate the committee's debate. This shows respect for the ethical concern.
      *   **The Core Principle:** Define *why* we choose the larger group. It's not math; it's equity. If every life is infinite in value, saving 5 preserves more of that value than saving 1.
      *   **The Protocol (The "Rule"):** Needs to be crisp. "Maximize Survivors" is the standard.
      *   **Addressing the Objection:** Explicitly mention the "separateness" argument. Explain that while true philosophically, operationally, ignoring the count violates the equal worth of the five.
      *   **Commander's Guidance:** What does the Shift Commander actually *do*? Keep it simple. Count. Compare. Act. Don't second-guess in the moment.
      *   **Closing:** Reiterate the burden carried by the team.

  4.  **Refining the Tone:**
      *   *Tone:* Professional, empathetic, authoritative, clear.
      *   *Avoid:* Cold utilitarianism ("5 > 1"). Avoid overly academic philosophy.
      *   *Emphasize:* Duty, equal value of life, operational clarity.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   To: Triage Committee.
      *   Subject: Triage Protocol.
      *   Look, this is hard. We know 1 life matters. But 5 lives matter more total.
      *   Rule: Save the 5.
      *   Why? Because if we save the 1, we let 5 die. That's worse.
      *   Commander: Just do it. Don't freeze.
      *   End.

      *Critique 1:* Too blunt. Doesn't take the objection seriously enough. Needs to explain *why* the numbers matter without reducing people to statistics.

  6.  **Drafting - Iteration 2 (Adding Nuance):**
      *   Acknowledge the "separateness of persons" argument. It's true that the one person loses everything just like the five.
      *   However, our mandate is public safety. We serve the community.
      *   Protocol: When forced to choose, prioritize the group with more viable survivors.
      *   Reasoning: This honors the equal value of *each* life. Ignoring the count treats the five as if they don't matter.
      *   Commander Note: Make the call fast.

      *Critique 2:* Better. But needs to be punchier for a field guide context. Needs to sound like a policy recommendation that resolves the deadlock.

  7.  **Finalizing the Content (incorporating the "Separateness" argument):**
      *   The key insight to convey: Choosing the larger group isn't about math; it's about refusing to arbitrarily sacrifice the five. If every life is sacred, we cannot sacrifice five to save one without a specific reason (like medical survivability, which is ruled out in this scenario).
      *   The "Default Protocol" needs to be a tie-breaker rule.
      *   *Key Phrase:* "Equal value demands maximum preservation."

  8.  **Final Polish (Reviewing against constraints):**
      *   *Short memo?* Yes.
      *   *Clear for Shift Commander?* Yes, needs a bolded "Action" section.
      *   *Takes objection seriously?* Yes, by addressing the moral weight of the single individual.

  9.  **Writing the Memo (incorporating the above thoughts):**
      *   *Subject:* Triage Protocol Recommendation: Survivor Count in Impossible Choices.
      *   *Opening:* Validate the ethical struggle.
      *   *The Decision:* Save the greater number.
      *   *The Rationale:* Explain that counting isn't dehumanizing; it's acknowledging every single person counts. To ignore the five is to treat them as invisible.
      *   *The Instruction:* "When all other medical and tactical factors are equal, prioritize the pocket with the highest number of viable survivors."
      *   *Commander's Note:* Trust the protocol. The protocol bears the moral weight so you can act.

  10. **Final Review:** Does this sound like it comes from a USAR context? Yes, uses terms like "tactical factors," "viable survivors," "Shift Commander."

  **(Self-Correction during drafting):** Make sure I don't sound like I'm dismissing the minority view. I need to explicitly state that the objection is morally sound *in theory*, but operationally unsustainable *in practice* without violating the principle of equal care.

  *Revised Rationale:* The objection says "5 deaths aren't 5x worse." The counter is "But 5 deaths are 5 distinct tragedies versus 1." The protocol must reflect that we minimize distinct tragedies when forced to choose.

  *Final Plan:*
  1. Header.
  2. Acknowledge the ethical tension.
  3. State the recommendation clearly.
  4. Provide the ethical justification (addressing the prompt's specific concern).
  5. Provide the operational directive.
  6. Closing support.

