      *   **Position 4: Contextualism (The "It Depends" View):**
          *   *Theory:* Meaning shifts with context.
          *   *Code Implication:* A 50-line config file is different from a 50-line business logic function.
          *   *Critique:* Requires human judgment.
      *   **Position 5: Eliminativism (The "Wrong Metric" View):**
