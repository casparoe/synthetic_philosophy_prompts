answer: |-
  The rain against the window was the only sound in Elias's study, a rhythmic static that usually helped him think. Tonight, it felt like counting. One, two, three.

  Across the desk sat Mara. She wasn't a gambler, not really. She was an actuary who viewed risk the way a geologist views strata: layers of cold, hard history. Elias was a hobbyist, a man who had spent the last year reading de Finetti and Savage, convinced that if he could just quantify his intuition, he could stop feeling so anxious about the future.

  "It's the tenure review," Elias said, staring at the closed laptop in front of him. "Decision comes Friday."

  "And you want to hedge?" Mara asked. She opened her notebook. She wasn't there to comfort him. She was there to test him. They had an agreement: Elias would state his degrees of belief as prices, and Mara would decide whether to take the other side of the bet. It was an exercise in coherence.

  "I want to lock in value," Elias corrected. "If I get it, my income jumps. If I don't, I need liquidity. I've run the numbers, Mara. I'm confident."

  "Confidence is a probability, Elias. Put a price on it."

  Elias tapped his pen against the desk. "Okay. I believe there is a sixty percent chance the committee approves my tenure."

  Mara wrote it down. *P(Approval) = 0.60.*

  "Standard wager," she said. "Face value ten thousand dollars. If you're approved, the ticket pays ten grand. If not, it pays zero. Based on your sixty percent, the fair price is six thousand. Do you want to buy it?"

  Elias nodded. He wanted to feel like he owned the success. "Yes. I'll pay you six thousand for the ticket."

  Mara didn't blink. She slid a printed contract across the desk. Elias signed it. He felt a surge of relief. He had monetized his hope. Now it was an asset, not a wish.

  "But," Elias said, the anxiety creeping back in as the rain intensified. "Sixty percent means there's a substantial risk of failure. Forty percent is almost half. I can't just lose everything."

  "You've already priced the risk," Mara said softly.

  "Have I?" Elias leaned forward. "If I fail, I need to know I protected myself. Honestly, Mara, looking at the committee... looking at the politics... I feel like there's a sixty percent chance this goes south. The risk is that high."

  Mara's pen hovered over the page. She looked up, her eyes sharp. "You just told me there was a sixty percent chance of approval. Now you're saying there's a sixty percent chance of rejection?"

  "It's not a contradiction," Elias insisted, his voice tightening. "It's about weighting. The approval is my baseline expectation. The rejection is my risk assessment. They measure different things. One is hope, one is fear."

  "In probability," Mara said, "they are complements. $P(A) + P(\neg A)$ must equal one. If you price them both at point-six, you're saying the sum of all possibilities is one-hundred-and-twenty percent."

  "I'm saying I need coverage," Elias snapped. "Can you write the second ticket? A ten-thousand-dollar payout if I am *rejected*? I'll pay six thousand for that, too."

  Mara studied him. She saw the tremor in his hand. He wasn't trying to make money; he was trying to buy certainty in a universe that didn't sell it. He wanted to live in the world where he succeeded, and simultaneously prepare for the world where he failed, and he was willing to pay a premium to occupy both timelines at once.

  "I can write the ticket, Elias," she said. "If that is your stated degree of belief."

  "It is."

  She wrote the second contract. *P(Rejection) = 0.60.* Face value $\$10,000$. Price $\$6,000$.

  Elias signed it immediately. He sat back, exhaling a breath he seemed to have been holding for months. "There. Now I'm covered. No matter what happens, I have value."

  Mara closed her notebook. She didn't offer a handshake. "Friday, we settle."

  ***

  The week passed in a blur of nausea and checklists. Elias paced his office. He rehearsed his lectures. He packed boxes he might not need. He lived in two futures, exhausting himself by preparing for both with equal intensity.

  On Friday afternoon, the email arrived.

  *Approved.*

  Elias should have felt triumph. Instead, he felt a dull thud in his chest. He opened the spreadsheet Mara had sent him the night before. She hadn't waited for the result to calculate the ledger.

  **Ledger:**
  *   **Cost of Ticket A (Approval):** $-\$6,000$
  *   **Cost of Ticket B (Rejection):** $-\$6,000$
  *   **Total Outlay:** $-\$12,000$
  *   **Payout (Approval):** $+\$10,000$
  *   **Payout (Rejection):** $\$0$
  *   **Net Result:** $-\$2,000$

  It didn't matter what the email said. If the email had said *Rejected*, he would have won the second ticket ($\$10,000$) but still lost the first ($\$0$), and the total outlay would remain $\$12,000$. The net result would still be a loss of $\$2,000$.

  Mara arrived an hour later to collect. She didn't look triumphant. She looked sad.

  Elias transferred the money. He stared at the screen, the numbers blurring. "I knew it would pass," he whispered. "I said sixty percent."

  "And you said sixty percent it would fail," Mara said.

  "I was just being careful."

  "You were being incoherent," she corrected. "You tried to pay for two mutually exclusive realities. The market doesn't allow that, Elias. Reality doesn't allow that."

  "But I felt both," he said, his voice cracking. "I felt the success coming. And I felt the disaster coming. They both felt real. Why should I be penalized because my feelings were loud?"

  "Because feelings aren't probabilities," Mara said. "Probabilities are about how the world works. Your beliefs were about how you wanted to feel about the world."

  She stood up to leave. At the door, she paused. "You know what a Dutch Book proves? It doesn't prove you're bad at math. It proves that if you act on inconsistent beliefs, you become a resource for someone else. You become a pump."

  Elias sat alone in the study. The rain had stopped. The silence was absolute.

  He looked at the two contracts on the desk. They were legal binding agreements, perfectly valid. He had lost two thousand dollars not because he was unlucky, and not because he was stupid. He had lost it because he had refused to choose a single world to inhabit. He had tried to hedge against existence itself.

  He realized then that the two thousand dollars wasn't a gambling loss. It was a tax. It was the fee charged by the universe for the luxury of holding contradictory hopes without resolving them. He had paid to remain anxious, to keep both doors open, to refuse the binary nature of truth.

  Elias picked up the contract for the rejection bet—the one that had paid out nothing. He ran his thumb over the signature. He had paid six thousand dollars to believe in his own failure, even while he succeeded.

  He folded the papers and put them in the drawer. He knew he would do it again. The anxiety was cheaper than the certainty of choosing one path and accepting that the other was dead. He would pay the tax. He would keep the books incoherent. It was the only way he knew how to survive the waiting.
