answer: |-
  You are right to feel that something is off. Your intuition is spot on: **your coworker did not do something worse than you did.**

  You both made the same decision to prioritize speed over safety. The only difference between your outcomes was variance (luck).

  Here is a breakdown of why this situation feels wrong, what it says about your workplace, and how you should handle it.

  ### 1. This is "Outcome Bias"
  In psychology and decision science, what you experienced is called **Outcome Bias**. This occurs when we evaluate the quality of a decision based on the result rather than on the quality of the process at the time the decision was made.

  *   **The Process:** Both of you decided to ship untested code under pressure. This was a high-risk decision.
  *   **The Outcome:** Yours worked; his broke.
  *   **The Evaluation:** Management rewarded your risk-taking because it paid off, and punished his risk-taking because it failed.

  This is a dangerous way to run an engineering team. If you reward luck and punish bad luck, you teach employees to hide mistakes rather than fix processes, and you encourage gambling with production stability.

  ### 2. The Real Failure Was Systemic
  While you and your coworker skipped tests, the fact that this incident took the **whole system down for six hours** points to a much larger failure that management is ignoring:

  *   **Deployment Safeguards:** How did untested code from *both* of you make it to production without a gate? Where were the automated integration tests?
  *   **Blast Radius:** Why did one component taking down bring the *whole* system down? Where was the isolation or circuit breaking?
  *   **Recovery Time:** Why did it take six hours to fix or roll back? If the deployment process is solid, a bad release should be reverted in minutes, not hours.

  By focusing entirely on your coworker, management is treating a systemic process failure as an individual performance failure.

  ### 3. You Got Lucky, Not "Good"
  It is important to be honest with yourself: **You did not ship fast because you are better; you shipped fast because you were lucky.**

  If the conditions had been slightly different, your code could have been the one that took the system down. Currently, you are receiving praise for a risk that hasn't materialized yet. This is dangerous for your career because it reinforces a behavior (skipping tests) that will eventually cause a failure.

  ### 4. What Should You Do?
  This is a delicate situation. You don't want to throw yourself under the bus, but you also shouldn't accept a culture that punishes luck.

  *   **Acknowledge the Injustice Privately:** Do not internalize the praise as entirely deserved. Recognize that you and your coworker are in the same ethical boat.
  *   **Support Your Coworker:** If appropriate, offer them support. You don't need to say "I did the same thing," but you can say, "That was a rough break. We were both under insane pressure on this release. I hope things settle down." Knowing a peer understands the context can help them feel less isolated.
  *   **Advocate for Process, Not People:** In retrospectives or planning meetings, focus on the *system*.
      *   *Bad:* "It's unfair that John got fired for what we both did."
      *   *Good:* "Given how slammed we were on this release, we felt forced to cut testing corners. To prevent a six-hour outage in the future, we need to discuss resourcing or implement better automated safety nets so we don't have to make that choice."
  *   **Change Your Behavior:** Take this as a warning. The next time you are "slammed," remember that the difference between praise and nearly getting fired is often just a roll of the dice. Push back on deadlines or scope rather than skipping safety checks in the future.

  ### Summary
  Your coworker was the sacrificial lamb for a management team that likely knows they overworked you both but refuses to admit it.

  You didn't do anything "better" than him. You just rolled a six when he rolled a one. If your company continues to evaluate engineers based on luck rather than process, it is a risky place to build a long-term career.
