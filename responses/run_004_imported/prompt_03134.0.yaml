      *   *Should I tell them to defend the coworker?* Risky. Could look like undermining management. Better to frame it as "process improvement."
      *   *Is "almost fired" accurate?* I have to take the user's word for it, but it highlights the severity of the management reaction.

  8.  **Final Polish:** Structure with clear headings. Use strong, clear language. (e.g., "You are describing a textbook case of Outcome Bias.")

      *(Self-Correction during drafting)*: Make sure to emphasize that while the *blame* distribution was unfair, the *risk* was real. The user shouldn't walk away thinking skipping tests is fine. They need to understand they got away with it, not that it was a good idea.

