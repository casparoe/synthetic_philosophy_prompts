prompt: |-
  Something's been bugging me. A coworker and I each built a different part of the same release, and honestly we both cut the same corner -- neither of us wrote proper tests becuase we were both slammed and figured it'd probably be fine. My part never happened to hit the conditions that would've exposed that, so nothing came of it. His part hit an edge case once it went live and took the whole system down for six hours. He almost got fired over it, I got praised for shipping fast. Something about that feels off to me but I can't pin down what -- did he actually do something worse than I did, or did we just get different luck?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Context:** Two coworkers built different parts of the same release.
      *   **Action:** Both cut the same corner (skipped proper tests due to being slammed).
      *   **Outcome:**
          *   User's part: No issues hit (luck), praised for speed.
          *   Coworker's part: Edge case hit, system down for 6 hours, coworker almost fired.
      *   **User's Feeling:** Something feels "off."
      *   **Core Question:** Did the coworker actually do something worse, or was it just luck?

  2.  **Evaluate the Ethical and Professional Dimensions:**
      *   **Objective Reality:** Both committed the same procedural error (skipping tests).
      *   **Outcome Bias:** The evaluation of their performance was based entirely on the *result*, not the *process*. This is a classic cognitive bias.
      *   **Fairness:** It is inherently unfair to punish one person for a risk that both took, solely because one risk materialized.
      *   **Systemic Issues:** The fact that both felt pressured to skip tests suggests a culture or resourcing problem ("slammed"). The fact that one person could take the system down for 6 hours suggests a lack of safeguards (deployment pipelines, monitoring, rollback capabilities).
      *   **User's Guilt/Discomfort:** The user recognizes the injustice. This is a good sign of integrity.

  3.  **Determine the Answer:**
      *   **Direct Answer:** No, the coworker did not do something worse technically or ethically. It was luck (outcome bias).
      *   **Nuance:** While the *action* was the same, the *impact* was different. However, performance reviews should focus on controllable actions, not uncontrollable outcomes.
      *   **The "Off" Feeling:** Validate this feeling. It *is* off. It's a sign of a dysfunctional evaluation system.

  4.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Start by validating the user's intuition. Yes, it feels off because it *is* off.
      *   *Concept Identification:* Name the phenomenon. "Outcome Bias" is the perfect term here. Also mention "Luck vs. Skill."
      *   *Ethical/Professional Assessment:* Confirm that ethically, they are in the same boat. Both took a risk.
      *   *Systemic Analysis:* Why did this happen?
          *   Pressure ("slammed").
          *   Lack of safety nets (how did untested code go live? Why 6 hours downtime?).
          *   Management's reaction (punishing bad luck vs. rewarding risky behavior).
      *   *Advice for the User:* What should they do now?
          *   Don't gloat.
          *   Reflect on own risk.
          *   Consider speaking up (carefully) about process, not blame.
          *   Learn for the future.
      *   *Advice for the Coworker (Indirect):* Acknowledge the injustice done to them.

  5.  **Refining the Tone:**
      *   Needs to be empathetic but objective.
      *   Avoid being preachy, but highlight the risk the user also took.
      *   Focus on systemic improvement rather than just blaming management (though management is at fault).
      *   Ensure the user understands that *they* were also lucky, not necessarily "good" in this instance.

  6.  **Key Points to Cover:**
      *   **Outcome Bias:** Explain it clearly.
      *   **Process vs. Outcome:** Good process can lead to bad outcomes (bad luck), bad process can lead to good outcomes (good luck). You want to reward process.
      *   **The Real Failure:** The system allowed untested code to take down production for 6 hours. That's a deployment/monitoring failure, not just a coding failure.
      *   **The User's Position:** They are currently "living on borrowed time" regarding reputation if this pattern continues.
      *   **Actionable Steps:** How to handle the guilt and the future.

  7.  **Self-Correction/Safety Check:**
