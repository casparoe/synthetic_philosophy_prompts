prompt: |-
  I'm a PhD student in philosophy, and a few of us in the program run a small podcast that's mostly listened to by other grad students. Next month's guest is a philosopher known for defending an unusually demanding, rigorist reading of Kant on moral worth: on her view, an action counts as morally worthy only when the dutiful motive is not merely present and sufficient but actually operative against whatever competing inclinations the agent has — closer to what's sometimes called a "battle citation" reading of acting from duty than the more forgiving "fitness report" reading most contemporary Kantians prefer. That distinction matters here because it's a harder line than the one Barbara Herman's "limiting condition" account was designed to make safe for Kantians to hold, and I don't want the interview to give her room to quietly retreat to Herman's more defensible position while sounding like she's still defending the same view. This connects to my own dissertation chapter on the overdetermination problem, so I'd like the questions to actually advance the argument rather than let her recap the position for an audience that's already read the paper we're discussing.

  Could you draft eight to ten interview questions for me? I want at least one question that pushes past a mere restatement of Kant's contrast between the honest shopkeeper and the sympathetic helper in the Groundwork, forcing her to own the least comfortable consequence of reading that contrast strictly rather than just re-narrating the passage; one that puts real pressure on her with the Huckleberry Finn case — Huck's sympathy for Jim overriding his own explicit conscience, which Bennett and later Arpaly have used against exactly this kind of rigorism — and gets her to say plainly whether Huck's action comes out as having zero moral worth on her view; and one that raises the "moral fetishism" charge against requiring a bare, de dicto desire to do one's duty, posed specifically against Markovits's coincident-reasons alternative, so she has to explain why mere sameness of motivating and justifying reasons isn't sufficient for worth. For each of those three, please add a sharp follow-up question keyed to whatever answer she's most likely to give, so a predictable dodge doesn't end up closing off the exchange.
