answer: |-
  It is a genuine philosophical whiplash to go from the Curry-Howard correspondence to UK immigration policy, but Michael Dummett's *On Immigration and Refugees* makes a strange kind of sense if you know his work. Dummett, the giant of intuitionistic logic, argued that meaning is tied to verification—you can't claim something is true unless you can show how you know it. He applied this same rigor to politics. His core thesis in the book is a reversal of the standard burden of proof. We usually assume states have a right to exclude anyone they want, and migrants must prove why they deserve entry. Dummett argues the opposite: the default position must be freedom of movement. If a state wants to keep someone out, the state bears the burden of proving a specific, justified harm that entry would cause. He contends that when you actually scrutinize the reasons Western states give for exclusion—economic strain, cultural cohesion—they rarely hold up under verification. Instead, he argues, these restrictions are largely "racism wearing a policy costume," designed to keep nations white rather than safe.

  The strongest counter-argument to Dummett comes from liberals like Christopher Wellman and Michael Walzer, who argue that a state is akin to a private club or a marriage. Just as you have a right to freedom of association, you also have a right to freedom *not* to associate. If a political community is a collective project of self-determination, the existing members get to decide who joins the project. Wellman takes this further with a provocative move: even if we have duties to help desperate outsiders, we can "buy out" of that obligation through foreign aid. If we send enough money to fix the problems at home, we discharge our duty without having to open the border to the single neediest person on earth. It's a clever attempt to square humanitarianism with sovereignty.

  But here is where the "club" analogy falls apart, and why Dummett's framework ultimately wins, even if we have to qualify it. A private club is voluntary; you choose to join and you choose to stay. Citizenship is largely coercive. You are born into it, and leaving is costly and difficult. Because the state holds a monopoly on force and territory—resources nobody created alone—it cannot act like a private homeowner inviting guests to a party. The "freedom of association" defense works for a book club; it works less well for an entity that controls the very ground you need to stand on to survive.

  Furthermore, Wellman's "buy out" clause is mostly a dodge. It treats human rights as fungible commodities. You can compensate someone for a broken window with cash, but you cannot compensate a refugee fleeing persecution by sending money to the persecutor. Presence matters. Access to the rule of law, to specific labor markets, and to physical safety cannot be fully outsourced to foreign aid. If the obligation is based on basic human rights, sending a check doesn't discharge the duty any more than sending a food parcel discharges the duty not to imprison someone unjustly.

  So, here is the verdict: Dummett wins on the principle, but Wellman wins on the capacity constraint. Dummett is right that the burden of proof must lie with the state. Exclusion is an act of violence that requires justification, not a natural right of sovereignty. The "club" argument fails because states aren't voluntary associations. However, Dummett's verificationist standard needs a practical limit. A state can justify exclusion if it can verify that unlimited entry would collapse the very institutions that make rights meaningful in the first place. You don't get to exclude to protect "culture" or "wages," but you can exclude if the influx physically overwhelms the capacity to house, feed, and govern.

  Ultimately, Wellman's attempt to preserve sovereignty via aid is too clean. It tries to keep the world tidy without getting our hands dirty. Dummett forces us to admit that open borders might be costly and disruptive, but that doesn't make them unjust. The presumption of entry should stand. If a state wants to close the door, it shouldn't be allowed to just write a check; it has to prove that opening the door would break the house. Until they can prove that, the door stays open.
