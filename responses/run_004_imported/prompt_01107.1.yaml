          *   *Habit:* I drink coffee at 9 AM. You drink tea. We don't care what the other does. Not a convention.
          *   *Coercive Rule:* Drive on the right or go to jail. I do it because of the penalty, not because I expect you to.
          *   *Convention:* I drive on the right because I expect *you* to, and I want to not crash.
      *   *The "Common Knowledge" bit:* This solves the infinite regress of reasoning. It stabilizes the equilibrium.

  3.  **Compare with Folk "Social Norm":**
      *   *Folk Norm:* Broad. Includes moral norms ("don't steal"), etiquette ("chew with mouth closed"), and conventions ("drive on right").
      *   *Lewis's Convention:* Narrower. Specifically *coordination* problems where interests align.
      *   *The Gap:* Folk norms often involve *conflict* or *moral obligation*. Lewis's conventions are about *mutual benefit* through alignment.
