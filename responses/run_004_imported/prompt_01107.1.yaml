answer: |-
  You are absolutely right to be skeptical. If you read Lewis's definition and think, "Wait, isn't this just what we mean by 'custom'?" you have successfully understood the concept. The friction you're feeling is the gap between **phenomenology** (what it feels like to live in a society) and **mechanism** (how that society actually holds together without collapsing).

  Your editor is asking for plain English, which is good, because Lewis's machinery is often mistaken for obscurantism when it's actually trying to solve a very specific puzzle: **How do we get order without a ruler?**

  Here is the breakdown of Lewis vs. the Folk Notion, what the game-theory "special sauce" actually buys him, and whether Margaret Gilbert lands a knockout punch.

  ### 1. Lewis's "Convention" vs. The Folk "Social Norm"

  To the average person, a "norm" is a big tent. It covers everything from "don't murder" (moral norm) to "say bless you when someone sneezes" (etiquette) to "drive on the right" (coordination).

  Lewis is trying to carve out a **much narrower slice** of that tent. He isn't trying to define all social behavior; he is trying to define *arbitrary coordination*.

  **The Folk Notion:**
  *   **Scope:** Broad. Includes moral obligations, traditions, and habits.
  *   **Force:** Often feels binding or "right."
  *   **Origin:** Often assumed to be cultural, historical, or divine.
  *   **Example:** "We tip 20%." (Folk view: It's just what you do, or you're cheap.)

  **Lewis's Technical Account:**
  *   **Scope:** Narrow. Only applies where interests *align* (we both want to avoid crashing) and the solution is *arbitrary* (we could have driven on the left).
  *   **Force:** Prudential. I do it because it is in my best interest *given that you are doing it*.
  *   **Origin:** Emergent. No one voted; it self-organizes.
  *   **Example:** "We tip 20%." (Lewis view: If I tip 10% while everyone else tips 20%, I get bad service. If I tip 20% while everyone tips 10%, I'm wasting money. We are stuck in an equilibrium.)

  **The Key Differentiator: Arbitrariness**
  This is the biggest wedge Lewis drives between his definition and the folk notion. For Lewis, if there is no viable alternative, it's not a convention.
  *   **Convention:** Driving on the right. (Left would work fine, we just need to match.)
  *   **Not a Convention (for Lewis):** Queuing for the bus. (Actually, this is debatable, but Lewis might argue queueing solves a conflict of interest, whereas driving is pure coordination.)
  *   **Definitely Not a Convention:** "Don't punch people in the face." (There is no arbitrary alternative here where we all agree to punch people in the face and everyone benefits.)

  **What the Machinery Buys Him:**
  Why do we need "Coordination Equilibrium" and "Common Knowledge"?
  1.  **To distinguish Convention from Coincidence:** If everyone wears hats on Tuesdays, is it a convention? Only if I wear a hat *because* I expect you to. If we all just independently like hats, that's a regularity, not a convention. The "preference to conform conditional on others conforming" clause proves the interdependence.
  2.  **To explain Stability without Authority:** The "Common Knowledge" bit is the glue. It's not enough that I know the rule. I need to know that *you* know the rule, and that *you* know that *I* know it. If I think you might not know that I know, I might hesitate. Common knowledge creates the certainty that allows the equilibrium to lock in without a police officer enforcing it.

  **Plain English for the Editor:**
  > Lewis isn't redefining "custom." He's building a model for how we coordinate without talking. The folk notion says, "We do this because it's the norm." Lewis asks, "How does that norm survive without a boss?" His answer: It's a self-reinforcing loop of expectations. I do it because I expect you to; you do it because you expect me to. The "game theory" isn't math; it's a way to prove that we are locked into this behavior by mutual interest, not just habit.

  ### 2. The Margaret Gilbert Critique: The Missing "Ought"

  You mentioned Gilbert's argument that Lewis can't explain why breaking a convention feels like *wronging* someone. This is a famous and very fair critique.

  **Lewis's Account (Expectations):**
  For Lewis, convention is based on **concordant expectations**.
  *   *Why I follow it:* Because I expect you to, and I want to coordinate.
  *   *If I break it:* I have made a calculation error. I have acted imprudently. I might cause a crash. I might look rude.
  *   *The Vibe:* "That was a stupid move."

  **Gilbert's Account (Joint Commitment):**
  Gilbert argues that conventions create a **plural subject**. When we enter a convention (even implicitly), we form a "joint commitment."
  *   *Why I follow it:* Because I owe it to *us*.
  *   *If I break it:* I have violated a commitment. I have betrayed the group.
  *   *The Vibe:* "You had no right to do that."

  **The "Per My Last Email" Example:**
  *   **Lewis:** I write "per my last email" because I expect that to be the standard signal for "I already told you." If I stop doing it, communication becomes inefficient. You'll be annoyed because the system is broken.
  *   **Gilbert:** I write it because we are participants in a shared office practice. If I stop, I'm not just being inefficient; I'm opting out of our shared agreement. You feel *wronged* because I violated our joint commitment to the office culture.

  **Is Gilbert Fair?**
  Yes. Lewis explicitly downplays the normative force. He treats conventions like traffic lights: you run a red light because you don't want to crash (prudential), not necessarily because you feel a moral duty to the state (obligatory).

  However, Lewis would argue that the *feeling* of obligation is a secondary psychological effect of the stability. If I break the convention, you stop trusting me. If you stop trusting me, we can't coordinate. Therefore, I *ought* to follow it if I want to remain part of the group.

  Gilbert's counter is that this is still circular. It explains why I *should* follow it to avoid punishment, but not why I feel I *owed* it to you in the first place.

  ### 3. Synthesis: How to Write This

  For your piece, you don't need to choose a winner. You can frame them as two different lenses on the same phenomenon.

  **The "Special Sauce" Summary:**
  Lewis's theory survives because it explains **emergence**. Folk norms assume the norm already exists. Lewis explains how we get from "chaos" to "order" without a meeting. The "common knowledge" machinery explains why these things are so hard to change once they start (because you have to shift everyone's expectations simultaneously).

  **The Gilbert Gap Summary:**
  Gilbert explains the **emotion**. Lewis explains the **structure**. Lewis can tell you why we drive on the right. Gilbert can tell you why you get angry when someone drives on the left in a one-way street. Lewis sees a system error; Gilbert sees a breach of contract.

  **Drafting suggestion for the "Plain English" section:**
  > "David Lewis argued that conventions aren't just habits; they are invisible contracts we sign with our behavior. He used game theory to show that we follow these rules not because we're told to, but because we're trapped in a web of mutual expectations. I drive on the right because I know you expect me to, and I know you know I expect you to.
  >
  > But philosopher Margaret Gilbert pointed out a hole in Lewis's map. Lewis explains why it's *smart* to follow the rule, but not why it feels *wrong* to break it. If I cut in line, Lewis says I've disrupted the coordination. Gilbert says I've violated a promise we never spoke. Lewis gives us the mechanics of the social machine; Gilbert gives us the moral weight of the gears."

  ### Verdict
  Lewis is not just dressing up common sense. He is providing the **structural engineering** for social norms. The folk notion is the architecture (looks nice, serves a purpose); Lewis is the physics (load-bearing walls, tension, equilibrium).

  Gilbert is right that physics doesn't explain why we love the building, but Lewis is right that without the physics, the building falls down. For a piece on *why* arbitrary habits feel mandatory, you need Lewis to explain the **stickiness** (the equilibrium) and Gilbert to explain the **guilt** (the normativity).

  Lewis's machinery buys you the ability to say: "This isn't just culture; it's a stable solution to a recurring problem that no one designed." That is a much stronger claim than "it's a social norm."
