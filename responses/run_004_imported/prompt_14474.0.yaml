          *   *Nuance:* In standard graduate game theory, "dominance" usually implies allowing mixed strategies unless specified otherwise. However, her logic about pure strategies is internally consistent.
          *   *Score:* Technically correct on the arithmetic of pure strategies, but potentially missing the standard definition of dominance in a grad seminar context.

