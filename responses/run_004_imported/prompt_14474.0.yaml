  **(Self-Correction on Point 3):** Marisol's objection about "nobody actually committed to playing." In non-cooperative game theory, a player *can* commit to a randomization device. However, in a one-shot game without a visible coin flip, a mixed strategy is often interpreted as the *opponent's uncertainty* about the player's move. Marisol is touching on the "purification" theorem or the epistemic interpretation. I should mention this as the subtlety.

