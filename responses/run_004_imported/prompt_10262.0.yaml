      *   *Point 4: Democracy.* Why can't a society agree to rules that prevent D2? Nozick says rights trump democracy. Liberals say democracy defines rights.
      *   *Point 5: Taxation != Forced Labor.* Nozick's famous claim. Counter: You own your labor, but society provides the infrastructure (courts, markets) that makes the labor valuable.
      *   *Context:* Mention that Nozick himself softened his views later (*The Examined Life*).

  6.  **Refining the Tone:**
