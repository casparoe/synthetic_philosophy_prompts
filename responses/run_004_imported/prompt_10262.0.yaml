      *(Self-Correction during drafting)*: I should make sure not to get too bogged down in Rawlsian jargon. Keep it focused on the Wilt argument specifically. I need to emphasize that Nozick's argument works *if* you accept his entitlement theory. The debate is about whether we *should* accept entitlement theory.

