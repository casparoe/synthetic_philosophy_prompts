      *   **Contrast Goals:**
          *   Descartes: Certainty, Epistemology, "What can I know?"
          *   Zhuangzi: Freedom, Transformation, "How should I live?"
      *   **Explain the "Next Move":** For Zhuangzi, the "next move" isn't finding a foundation, it's *letting go* of the need for one. This is the concept of *wu shi* (non-affirmation) or *qi wu* (equalizing things).
      *   **Address the Friend's Debate:** Both "nothing matters" (nihilism) and "everything's fine" (optimism) miss the nuance. It's more about *flexibility*.
