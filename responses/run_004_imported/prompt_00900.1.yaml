      *   *Duties:* Duties regarding animals are *indirect* duties to humanity. Cruelty to animals dulls our sympathy, making us more likely to be cruel to humans. Kindness to animals preserves our humane feelings.
      *   *The "Line":* It's binary, not scalar. You either have rational autonomy (human) or you don't (everything else). Sentience (*Sentienz* vs. *Sapience*) is not the criterion for moral *status*, though it matters for moral *disposition*.

  3.  **Evaluate the Impact of Cephalopod Evidence:**
