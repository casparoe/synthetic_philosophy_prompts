      *   *Strengthening Indirect Duties:* This is the lever. If octopuses are *more* sentient and expressive of suffering/joy, our *indirect* duty to not coarsen our own humanity becomes *stronger*. The more an animal resembles a moral agent in its suffering, the worse it is for *us* to torture it.
