answer: |-
  **Setting:** *A cluttered metaphysics lab, late evening. On the workbench sits a coiled copper wire connected to a small black box labeled "ELECTRO-FINK." Next to it is a crystal goblet filled with a clear liquid, a small vial of antidote resting beside it. ALEX (defending a refined Conditional Analysis) is adjusting a multimeter. SAM (defending Primitive Powers) is swirling the wine glass.*

  **Alex:** You're staring at the wire like it's going to bite you.

  **Sam:** It might. If Martin's right, it's dead. If the fink is active, it's live. But if I touch it, the fink wakes it up. So, if I touch it, it conducts. But it isn't *disposed* to conduct. It's dead metal until the moment of contact.

  **Alex:** And that's why the Simple Conditional Analysis failed. "If touched, it conducts" is true, but "It is fragile/conductive" is false. We agree on that. That's why Lewis saved it.

  **Sam:** Saved it? He put a bandage on a severed artery.

  **Alex:** It wasn't a bandage, it was a structural repair. Lewis saw that the simple conditional ignored the *causal basis*. The disposition isn't just about the stimulus and the manifestation. It's about an intrinsic property—the molecular lattice, the electron flow—that *persists* through the stimulus. In Martin's case, the dead wire lacks the intrinsic basis *until* the touch. The fink creates the basis *ex nihilo* at the moment of stimulus. Lewis's fix requires the basis to be there *before* and *during*.

  **Sam:** Okay, grant Lewis the dead wire. The wire has no enduring categorical base for conductivity. So the conditional "If touched, it conducts" is true, but the disposition ascription is false because the intrinsic base is missing. Fine. But look at the wine.

  **Alex:** The Johnston-Bird case. Poison.

  **Sam:** This wine has a specific chemical structure. Let's call it $C$. Ingesting it ($S$) causes death ($M$). It has the intrinsic base. The base persists through ingestion. The poison doesn't vanish when you drink it. By Lewis's lights, it is disposed to kill.

  **Alex:** It is.

  **Sam:** But suppose I drink it with the antidote. The antidote neutralizes the toxin immediately. I don't die.

  **Alex:** Because the antidote is a mask.

  **Sam:** Exactly. But here's the rub: The poison *retains* its intrinsic basis. The chemical structure doesn't change when the antidote arrives. Unlike the dead wire, nothing intrinsic to the poison is lost. Lewis's requirement—that the basis persist—is satisfied. Yet, the conditional "If ingested, it kills" is false. So, the disposition is present, but the conditional fails.

  **Alex:** Wait. You're saying the disposition is present even if it doesn't manifest?

  **Sam:** I'm saying your analysis says the disposition *should* be present because the base is there, but the conditional test fails because of the mask. Lewis fixed the Fink (where the conditional is true but disposition false) but he didn't fix the Mask (where the disposition is true but conditional false).

  **Alex:** Hold on. We can patch the conditional. We just add a *ceteris paribus* clause. "If ingested, *and no antidotes are present*, it kills."

  **Sam:** Ah, the "all else being equal" escape hatch. Now we're playing the game. What counts as "equal"?

  **Alex:** Standard conditions. No interferers.

  **Sam:** But how do you define "interferer" without already knowing what the disposition is? To say the antidote is an interferer, you have to know that the poison is *trying* to kill. You're defining the condition in terms of the disposition it's supposed to analyze. That's circular.

  **Alex:** It's not circular, it's contextual. We fix the context by reference to the actual world's laws. In the actual world, this chemical structure kills. The antidote is an extrinsic addition. We can specify the stimulus condition more rigorously. "Ingested in isolation."

  **Sam:** "In isolation"? Now you're ruling out masks by fiat. But masks are part of the causal fabric of the world. If I have a fragile glass, and I wrap it in bubble wrap, it's still fragile. If I drop it, it doesn't break. Is your analysis: "If dropped *and not wrapped*, it breaks"?

  **Alex:** Yes.

  **Sam:** Then you haven't analyzed fragility. You've analyzed "fragility-in-a-vacuum." But ordinary properties aren't vacuum properties. Fragility is the power to break *even when* there are minor buffers, or at least, the buffer doesn't remove the fragility. The point is, the mask prevents the manifestation without removing the power. Your conditional analysis ties the *existence* of the property to the *truth* of the conditional. If the conditional fails because of a mask, you have to say the property is absent, or you have to rig the antecedent so much it no longer looks like a reductive analysis.

  **Alex:** I'm not rigging it. I'm being precise. Look, Sam, your alternative is "Primitive Powers." You're telling me this wine has a little metaphysical arrow pointing at "Death" inside it? That's occult. I can analyze the poison in terms of molecular bonds, reaction rates, biology. I don't need a "power." I need a categorical base and a law.

  **Sam:** And I'm telling you that the "law" just *is* the behavior of the powers. But look at the cost of your precision. To save the Conditional Analysis from masks, you have to list every possible mask in the antecedent. "If ingested, and no antidote, and no stomach pump, and no divine intervention..."

  **Alex:** We don't need to list them all. We just need to say "in the absence of preventative factors."

  **Sam:** And "preventative" means "factors that prevent the manifestation of the disposition." You are using the concept of disposition to define the conditions for the analysis of disposition. You're chasing your tail. Lewis tried to ground it in the intrinsic base to stop the tail-chasing, but the Mask shows that intrinsic bases aren't enough. The manifestation depends on the *environment* too.

  **Alex:** But if I admit the environment determines the manifestation, I lose the intuition that dispositions are *of* the object. The poison is poisonous regardless of the antidote.

  **Sam:** Exactly! That's my point. The poison *is* poisonous. The conditional "If ingested, it kills" is false in the antidote case. Therefore, the disposition cannot be *reduced* to the conditional. The disposition is real, the conditional is contingent.

  **Alex:** But if the disposition is real and distinct from the conditional, what work is it doing? If I know the molecular structure, and I know the laws of chemistry, I know everything. Positing a "power" adds nothing to the prediction. It's a ghost.

  **Sam:** It adds directionality. It adds modality. Your molecular structure is categorical. It just *is*. Why does it do *that* when ingested? Why does $C$ lead to $M$? You say "Laws of Nature." I ask: what grounds the laws?

  **Alex:** Regularities. Humean supervenience.

  **Sam:** And I say that's where the finks really kill you. If laws are just regularities, what happens in the fink case? The regularity is interrupted. The wire conducts when touched, but it wasn't live. The regularity holds, but the causal story is wrong. You need something to ground the counterfactual. You need the power to make the conditional true *because* the power is there, not the other way around.

  **Alex:** I don't need a power to make the conditional true. I need the base plus the laws. The problem with the Mask isn't that the analysis is wrong, it's that we're being sloppy about the stimulus. The stimulus for the poison isn't just "ingestion." It's "ingestion without neutralization."

  **Sam:** But who decides what counts as neutralization? If I drink the poison in a world where everyone has a natural immunity, is it not poison?

  **Alex:** In that world, it's not poison. Dispositions are world-relative.

  **Sam:** Now you're a relativist? I thought we were doing metaphysics.

  **Alex:** I'm doing naturalism. Properties are defined by their role in our best science. Science doesn't posit "powers." It posits structures and functions. If the function is blocked, the disposition ascription is context-sensitive. That's not a bug, it's a feature. It explains why we argue about whether something is "soluble" or "fragile." We're arguing about the context.

  **Sam:** But you can't argue about the context without agreeing on what the thing *is*. If I say "This is soluble," and you say "No, it's not, because it's in a saturated solution," we aren't disagreeing about the salt. We agree the salt has the nature it has. The saturation is external. Your analysis forces you to say the salt *loses* its solubility in the saturated solution.

  **Alex:** It loses the *conditional truth* of its solubility.

  **Sam:** And that's why the project is dead. You started wanting to reduce dispositions to conditionals to avoid spooky powers. But to save the reduction from Finks and Masks, you've had to load the antecedent with so much modal baggage—"no finks, no masks, standard conditions"—that the conditional is no longer doing the heavy lifting. The heavy lifting is being done by your implicit understanding of the *power* itself. You're using the power to fix the conditional, then claiming the conditional explains the power.

  **Alex:** (Pauses, taps the multimeter) I'll grant you the circularity risk. It's a risk. But look at the alternative. If powers are primitive, they are unanalyzable. They are "I-know-not-what" qualities. How do we know them? How do we distinguish a power from a categorical property that merely *looks* like a power?

  **Sam:** By what they do. A power is defined by its manifestation. But not reduced to it. It's a potentiality.

  **Alex:** Potentiality is just a word for "might happen."

  **Sam:** No, it's a word for "directed toward happening." The arrow is real, even if the target is shielded. Your wire example... Martin's dead wire. You agree the fink makes the conditional true falsely. Lewis fixed that by demanding an intrinsic base. But the Poison shows the intrinsic base isn't sufficient. You need the *connection* between base and manifestation to be robust. That robustness *is* the power. You can't analyze it away into a conditional because the conditional is fragile. The power is what makes the conditional hold *when it does*.

  **Alex:** So you're saying the power is the truth-maker for the conditional?

  **Sam:** Yes.

  **Alex:** Then why not just study the truth-maker directly? The molecular structure.

  **Sam:** Because the structure *is* the power. You're treating the structure as categorical, waiting for a law to animate it. I'm saying the structure *is* the potential for interaction. Electrons aren't little balls that *then* decide to repel. Their repulsion is what they *are*.

  **Alex:** (Sighs) If I accept that, I lose the Humean mosaic. I lose the clean separation between what exists and what happens.

  **Sam:** And if you keep the Conditional Analysis, you lose the ability to account for masks without begging the question. You're stuck saying the poison isn't poisonous when mixed with an antidote.

  **Alex:** I'd say the ascription is context-dependent.

  **Sam:** And I'd say that's just a polite way of admitting the conditional doesn't capture the property.

  *(Silence hangs between them. Alex picks up the wire. Sam picks up the wine.)*

  **Alex:** If I touch this wire, and the fink works, it shocks me.

  **Sam:** If I drink this wine, and the antidote works, I live.

  **Alex:** In both cases, the prediction holds.

  **Sam:** In both cases, the nature of the thing remains.

  **Alex:** Maybe we're just arguing about where to draw the line between object and environment.

  **Sam:** Maybe. Or maybe we're arguing about whether the world is made of dead stuff governed by external laws, or living stuff governed by its own nature.

  **Alex:** (Puts the wire down) I'm not ready to say the salt is "alive" just because it dissolves.

  **Sam:** (Sets the glass down) And I'm not ready to say the poison is harmless just because I have an antidote.

  **Alex:** So we're at a stalemate.

  **Sam:** No. We're at the boundary. The Finks and Masks didn't solve the problem. They just showed us where the map ends.

  **Alex:** Then I suppose we keep walking.

  **Sam:** Carefully. Watch out for the finks.

  **Alex:** And don't drink the wine.
