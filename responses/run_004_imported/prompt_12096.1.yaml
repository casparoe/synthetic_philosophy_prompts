answer: |-
  Your labmate is relying on a logical fallacy, and your intuition aligns with the prevailing ethical standards of academic publishing. You are not required to define a precise "hour count" or "task count" to justify your decision.

  Here is a principled way to think about this, why your labmate's argument fails, and how to handle the conversation.

  ### 1. The Logical Flaw: The Sorites Paradox
  Your labmate is employing a version of the **Sorites Paradox** (also known as the "Paradox of the Heap"). The argument goes: *If you remove one grain of sand from a heap, it is still a heap. If you keep removing grains, at what exact number does it stop being a heap? Since you can't name the exact number, the distinction between 'heap' and 'not a heap' is arbitrary.*

  This is logically unsound. The inability to define a precise boundary does not mean the distinction between two categories does not exist.
  *   **Example:** We all agree there is a difference between a "child" and an "adult," even though the transition is gradual and legal cutoffs (18 vs. 19) vary by jurisdiction.
  *   **Application:** There is a clear conceptual difference between "technical assistance" and "intellectual ownership," even if the boundary case can sometimes be fuzzy. Your situation is not a boundary case; one day of technical work without intellectual input is firmly in the "assistance" category.

  ### 2. The Principled Distinction: Contribution vs. Accountability
  Authorship is not a reward for labor; it is a claim of **intellectual ownership and accountability**. Most major journals and organizations (including the ICMJE, APA, and IEEE) adhere to criteria that require more than just "doing work."

  The standard (ICMJE) requires **all four** of the following for authorship:
  1.  Substantial contributions to the **conception or design** of the work; OR the **acquisition, analysis, or interpretation** of data.
  2.  Drafting the work or **revising it critically** for important intellectual content.
  3.  Final approval of the version to be published.
  4.  Agreement to be **accountable** for all aspects of the work.

  **Where your labmate falls short:**
  *   **Interpretation:** You stated they had no role in interpreting the results. Running a robustness check is mechanical; deciding *what that check implies for the hypothesis* is intellectual.
  *   **Drafting/Revising:** They did not write or critically revise the manuscript.
  *   **Accountability:** This is the most important ethical factor. If this paper is later found to be flawed or fraudulent, is your labmate prepared to take public responsibility for the conclusions? If they didn't design the study or interpret the data, they cannot honestly defend the claims. Authorship implies, "I vouch for this truth." Acknowledgment implies, "I helped make this possible."

  ### 3. The "Type" of Work Matters More Than "Amount"
  Your labmate's argument ("I did more than nothing") frames authorship as a **quantitative** metric (how many hours/tasks). In reality, authorship is a **qualitative** metric (what kind of input).

  *   **Technical Service:** Cleaning data, running code provided by others, formatting references, collecting samples. (Acknowledgment)
  *   **Intellectual Contribution:** Formulating the hypothesis, deciding *which* robustness checks are necessary to validate the claim, interpreting why a check failed or succeeded, writing the narrative. (Authorship)

  If you asked them to "run robustness check X," and they did it, that is technical service. If they said, "Your results look weak, you should really run robustness check Y to prove Z," and then interpreted the outcome, that leans toward authorship. Based on your description, it sounds like the former.

  ### 4. How to Respond
  You need to shift the conversation from "how much work" to "what responsibility." You can be firm but kind.

  **Suggested Script:**
  > "I appreciate your help with the data cleaning and robustness checks; it definitely strengthened the paper, and I want to make sure you are prominently thanked in the acknowledgments for that.
  >
  > Regarding authorship, I'm following the standard [ICMJE/Field] guidelines. Authorship isn't just about time spent or tasks completed; it's about intellectual ownership and accountability. To be a co-author, you need to be able to publicly defend the study design, the interpretation of the results, and the conclusions drawn. Since you weren't involved in designing the study or interpreting what the results mean, putting your name on the author list would actually be ethically problematic—it implies a level of responsibility for the claims that you didn't take on.
  >
  > I value your contribution, which is why I want to acknowledge it accurately, but I can't justify authorship when the criteria for intellectual contribution and accountability aren't met."

  ### 5. One Caveat
  Before you finalize this, ask yourself one question: **Did they suggest the robustness checks?**
  *   **If you told them what to run:** Your position is solid. This is technical support.
  *   **If they identified a weakness and proposed the specific checks to fix it:** This edges closer to "interpretation of data" and "critical revision." In some fields (like economics or computer science), this might warrant a co-authorship discussion, though one day of work is still very low.
      *   *If this is the case:* You might offer them a middle ground. "Your suggestion on the robustness checks was valuable. However, given the scope was limited to that one day, I believe acknowledgment is the standard norm. However, I am happy to discuss this with our PI/Supervisor to see what they think is fair."

  ### Summary
  Your labmate is wrong. The lack of a precise "cutoff point" does not make the distinction arbitrary. Authorship is defined by **intellectual contribution and accountability**, not hours logged. Stand firm on the standards, but express genuine gratitude for the help.
