prompt: |-
  A labmate spent about a day cleaning data and rerunning a few robustness checks for a paper I'm about to submit, but had no role in designing the study, interpreting the results, or drafting the manuscript. When I suggested they be thanked in the acknowledgments rather than added as a coauthor, they objected: if they'd written half the paper, I'd call them a coauthor without hesitation, and what they did is clearly more than nothing — so unless I can name the exact point between those extremes where authorship begins, my refusal is just arbitrary line-drawing. I don't have a good answer to that, but I remain fairly confident they don't belong on the author list. Is my labmate right that, absent such a cutoff, my position is arbitrary — or is there a more principled way to think about this?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The User:** Preparing to submit a paper. Did the study design, interpretation, and drafting.
      *   **The Labmate:** Spent ~1 day cleaning data and rerunning robustness checks. Did *not* contribute to design, interpretation, or writing.
      *   **The Conflict:** User wants to acknowledge the labmate. Labmate wants co-authorship.
      *   **The Labmate's Argument:** "If writing half the paper = author, and doing nothing = no author, there must be a cutoff. Since you can't name the exact cutoff, your refusal is arbitrary." (Sorites Paradox / Line-Drawing Fallacy).
      *   **The User's Intuition:** Confident the labmate doesn't qualify, but struggling to articulate *why* beyond "it's not enough."
      *   **The Goal:** Determine if the labmate is right (arbitrary line-drawing) or if there's a principled way to distinguish authorship from acknowledgment.

  2.  **Evaluate the Labmate's Argument (Philosophical/Logical):**
      *   The argument is a classic "Sorites Paradox" (heap of sand). Just because a precise boundary is hard to define doesn't mean the distinction doesn't exist.
      *   *Example:* "Bald vs. Hairy." Losing one hair doesn't make you bald, but losing all of them does. The lack of a specific hair count doesn't mean the concepts are identical.
      *   *Conclusion:* The labmate is logically incorrect. The inability to define a precise threshold does not invalidate the distinction between categories.

  3.  **Evaluate the Labmate's Contribution (Ethical/Professional Standards):**
      *   **ICMJE Criteria (International Committee of Medical Journal Editors):** Widely adopted across sciences.
          1.  Substantial contributions to conception/design OR acquisition/analysis/interpretation.
          2.  Drafting OR critically revising.
          3.  Final approval.
          4.  Agreement to be accountable.
          *   *All four* must be met.
      *   **Labmate's Contribution:**
          1.  Analysis? Yes (cleaning/robustness). Conception/Design/Interpretation? No. (Fails part of #1).
          2.  Drafting/Revising? No. (Fails #2).
          3.  Approval/Accountability? Presumably no, since they aren't involved in the narrative.
      *   **CRediT Taxonomy (Contributor Roles Taxonomy):** Distinguishes between "Formal Analysis," "Data Curation" (often acknowledgment level) vs. "Conceptualization," "Writing," "Investigation."
      *   **Norms:** One day of technical work, without intellectual input into the *story* or *conclusions*, is traditionally acknowledgment territory. Authorship implies intellectual ownership and accountability for the *claims*, not just the code running.

  4.  **Formulate the Principled Distinction:**
      *   It's not about *quantity* of work (time spent). It's about *quality* and *type* of work (intellectual contribution vs. technical service).
      *   **Authorship:** Intellectual ownership. You stand behind the *conclusions*. You can defend the *why*.
      *   **Acknowledgment:** Technical support. You ensured the *how* worked, but not necessarily the *what it means*.
      *   **Accountability:** If the paper is retracted for fraud, is the labmate responsible? If they didn't interpret the results, they can't really be accountable for the scientific claim.

  5.  **Drafting the Response:**
      *   **Validate the User:** Confirm their intuition is aligned with standard academic norms (ICMJE, etc.).
      *   **Address the Logic:** Explain why the labmate's "line-drawing" argument is a fallacy (Sorites Paradox).
      *   **Define the Principle:** Shift from "how much work" to "what kind of work." Focus on *intellectual contribution* and *accountability*.
      *   **Provide Criteria:** Cite ICMJE or similar standards.
      *   **Offer a Script:** Give the user words to say to the labmate to de-escalate and explain the decision professionally.
      *   **Consider Nuance:** Is "robustness checks" actually interpretation? Sometimes yes, sometimes no. If they suggested *which* checks to run and interpreted the outcome, that leans toward authorship. If they just ran code provided by the user, that's technical. I need to make sure the user reflects on this.

  6.  **Refining the Advice (Self-Correction/Edge Cases):**
      *   *Wait, did the labmate suggest the robustness checks?* The prompt says "rerunning a few robustness checks." It implies the user asked for them. If the labmate *designed* the robustness strategy, that's more significant. I should advise the user to be sure about this distinction.
      *   *Field Differences:* In some CS or econ fields, code contribution is weighted higher. But "1 day" is still very low for authorship in most contexts.
      *   *Relationship Management:* This could ruin a working relationship. The advice needs to be firm on principles but soft on delivery.

  7.  **Final Structure:**
      *   Direct Answer: No, the labmate is not right.
      *   The Logical Flaw: Explain the Sorites Paradox.
      *   The Principled Distinction: Intellectual Contribution & Accountability (ICMJE).
      *   Actionable Advice: How to communicate this.
      *   Caveat: Double-check the nature of the "robustness checks."

  8.  (Final Polish): Ensure tone is supportive but objective. Use standard guidelines (ICMJE) as the anchor.

  *(Self-Correction during drafting)*: I should make sure not to dismiss the labmate's effort. One day is helpful. Acknowledge that gratitude is due, just not authorship.

