          *   *Moorean Shift:* G.E. Moore's "Here is one hand."
          *   *Pragmatism:* What does "knowing" *do* for us?
      *   **Address the Social/Relational Aspect:** This is a *friend*. Philosophical debate is one thing; disrupting conversation is another. The behavior might be performative or avoidant.
      *   **Provide Actionable Advice:** How to respond in the moment.

