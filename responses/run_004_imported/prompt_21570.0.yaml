      *   *Why He's Wrong (Philosophically):*
          *   **Wittgenstein:** Doubt needs a background of certainty. You can't doubt *everything* at once. These beliefs are "hinges."
          *   **Contextualism:** In everyday contexts, you *do* know. The friend is changing the context to a philosophical seminar unfairly.
          *   **Pragmatism:** If it walks like a duck... The *success* of navigating the world justifies the belief.
      *   *Why He's Wrong (Socially):* It's a conversation stopper. It might be a power play or anxiety.
