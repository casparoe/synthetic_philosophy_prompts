answer: |-
  # The Centipede's Sting: Why Backward Induction Survives the Paradox

  The Centipede Game is the canonical embarrassment of game theory. Two players take turns deciding whether to take a growing pile of money or pass it to the other. The pot increases with every pass, but if either player takes the pot, the game ends. Standard backward induction (BI) dictates that the first player should take the pot immediately. The logic is ruthless: at the final node, the second player would take the pot; knowing this, the first player would take it at the penultimate node; and so on, unraveling all the way to the start.

  Yet, almost no one actually plays this way. In experiments, players cooperate for several rounds. This discrepancy has fueled a decades-long philosophical firefight, centered on the "paradox of backward induction" articulated by Philip Pettit and Robert Sugden. Their argument strikes at the epistemic foundations of the game: BI requires Common Knowledge of Rationality (CKR). But if players are truly rational in the BI sense, the game ends at node one. If the game reaches node two, CKR has been falsified by the very act of play. So, on what grounds can Player 2 assume Player 1 will be rational at node three?

  This creates a knot that has tangled seminar rooms for thirty years. Does the paradox prove that immediate defection is not actually forced by rationality? Or does backward induction survive if we clarify what we mean by "rational"? The answer requires us to bite a bullet that many find unpalatable: **Backward induction survives, but only by accepting that rationality in game theory is not a psychological state updated by evidence, but a logical property of an ex-ante strategy.** Pettit and Sugden identify a genuine tension, but they mistake an epistemic puzzle for a logical contradiction.

  ### The Epistemic Fragility of the Chain

  To understand the force of the Pettit-Sugden critique, we must look closely at the machinery of backward induction. BI works by folding back from the end of the game tree. To decide what to do at node $n-1$, I must know what you will do at node $n$. To know that, I must believe you are rational at node $n$. But for you to be rational at node $n$, you must believe *I* am rational at node $n-1$.

  Pettit and Sugden point out that this chain of reasoning relies on counterfactuals that contradict the actual history of play. If we are actually playing the Centipede Game and I have passed the pot to you at node 1, I have visibly deviated from the BI solution. If BI is the unique consequence of CKR, then my passing the pot is proof that CKR does not hold.

  Here lies the paradox: If you (Player 2) observe my deviation, you have evidence that I am not playing the BI strategy. Why, then, should you believe I will suddenly revert to BI reasoning at node 3? If I was irrational (or cooperative) enough to pass at node 1, I might well pass again at node 3. If you believe that, your best response at node 2 is to pass as well, hoping for a larger payout later. Thus, the observation of deviation destroys the very assumption of rationality required to justify the BI solution. The logic of BI seems to consume its own tail: it predicts a path that, if departed from, invalidates the prediction.

  ### The Strategic Defense: Rationality as Commitment

  The defense of backward induction, championed by Robert Aumann and Ken Binmore, requires a shift in ontology. The paradox arises only if we view rationality as a moment-to-moment psychological disposition that can be confirmed or refuted by observed moves. In the standard epistemic defense, rationality is not about what you *do* at a node; it is about the *strategy* you selected at the root of the tree.

  When Aumann argues for BI, he is not claiming that players are hyper-intelligent calculators in real-time. He is claiming that a "strategy" is a complete plan of action chosen before the game begins. Common Knowledge of Rationality means that both players know, at the start, that the other has chosen a strategy that maximizes expected utility at every node, *conditional on that node being reached*.

  This distinction allows the defender of BI to handle the "off-equilibrium" problem. If I pass at node 1, I have not necessarily proven I am irrational. I may have made a "tremble"—a mistake with a small probability. Binmore's defense relies on the idea that rational players assign a non-zero probability to errors (trembling hand perfection). If you see me pass, you do not update your belief to "Player 1 is irrational." You update to "Player 1 is rational but made a mistake." Because your belief in my underlying rationality remains intact, you still expect me to maximize at node 3. Therefore, you should defect at node 2.

  In this framework, the "evidence" of deviation is treated as noise, not signal. The counterfactual reasoning—"What would Player 1 do at node 3?"—is not a prediction based on past behavior; it is a deduction based on the *type* of player I am. If my type is "rational maximizer," then my action at node 1 (even if it was a slip) does not change my type at node 3.

  ### The Verdict: Logic Over Psychology

  So, where does the truth lie? Does the paradox show that defection isn't forced?

  **The verdict is that backward induction survives.** Pettit and Sugden are correct that BI is epistemically fragile in a psychological sense—if we treat players as empirical agents learning from history, BI collapses. However, game theory is not primarily a descriptive psychology; it is a normative logic of choice. The paradox dissolves once we accept that the "rationality" in Common Knowledge of Rationality is a structural constraint on the *model*, not a description of the *mind*.

  The knot unties when we realize that Pettit and Sugden are demanding that game theory handle belief revision in a way that is inconsistent with the definition of the solution concept. They want rationality to be "substantive" (maximizing given the actual history) rather than "strategic" (maximizing given the initial plan). But if rationality were substantive in their sense, there would be no stable solution to any extensive-form game with off-equilibrium paths. We would be stuck in an infinite regress of belief-updating about belief-updating.

  To save the coherence of strategic interaction as a formal discipline, we must accept the Aumann/Binmore stipulation: **Rationality is an ex-ante commitment.** When you sit down to play, you commit to a strategy. If you deviate, you have not changed your strategy; you have merely executed it poorly. Your opponent is therefore justified in assuming you will execute the *rest* of the original rational strategy correctly.

  This is a hard pill to swallow. It implies that if I act "irrationally" by cooperating in the Centipede Game, my opponent is logically compelled to treat me as a rational defector who slipped up, rather than a cooperator. It feels counterintuitive because in the real world, past behavior *is* evidence of future intent. But in the sterile universe of the Centipede Game, "intent" is defined by the payoff structure, not the history.

  ### Conclusion

  The Pettit-Sugden paradox is a vital critique because it exposes the gap between game theory's logical norms and human psychology. It shows that Backward Induction is not a prediction of what humans *will* do, but a theorem about what they *must* do if they adhere to a specific, rigid definition of rationality.

  However, the paradox does not break the logic. Backward induction remains the only solution consistent with Common Knowledge of Rationality defined over complete strategies. To claim otherwise is to demand that the rules of logic change mid-game because a player stumbled. Rationality forces immediate defection, not because players are untrusting, but because the logic of the end-game permeates the start-game, regardless of the trembles that occur in between. The Centipede's sting is real, and backward induction is the only shield that holds—even if it leaves us feeling cold.
