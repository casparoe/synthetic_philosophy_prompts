  Ok so this has been going back and forth on our team Slack for like two weeks now and I need an outside opinion, because I don't think anyone in the thread is being fully honest about why they believe what they believe (including me, probably). I'm an engineer at a mid-size fintech startup, no philosophy background at all beyond one ethics-in-tech gen-ed I mostly zoned out in, so bear with me if I explain this clumsily.

  We're deciding whether to add a mandatory extra security step at checkout - a 3 second "verifying..." spinner plus one extra confirmation tap, for literally every single checkout, across our ~5 million monthly active users. Our PM is pushing hard for it and her argument is basically arithmetic: 3 seconds times 5 million people, every month, works out to something like 174 days of cumulative human time burned every single month, versus the handful of severe fraud cases (maybe 4-5 a year) where someone's whole account gets drained and it takes them months of stress to get their money back, sometimes with real damage to their credit or rent payments in the meantime. She says once you add it all up, the "small" cost is actually way bigger than the "big" one, so its irrational not to add the friction. Our head of trust & safety thinks this is insane and wont budge, but when I press him on why exactly it's wrong to add the little annoyances up like that, all he says is "come on, obviously you can't compare a wasted second to someone's life savings," which isn't really an argument either.

  I brought it up with my partner over dinner hoping for a tiebreaker and she just said "sounds like a work problem, not a math problem," which, thanks, very helpful. But I can't shake the feeling both sides are dancing around some actual principle neither of them has words for, and I'd rather understand what that is than just vote with whoever's more senior. Is the PM's multiplication trick actually valid, is trust & safety's gut reaction defensible on some real basis, or are they both missing the actual crux here?
