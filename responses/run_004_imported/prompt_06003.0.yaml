      *   *Argument for Support:* It is an "expedient," a case-by-case crisis response to the immediate threat of warming. It avoids the "prohibition" of technology. It acknowledges the crisis and tries to manage equilibrium.
      *   *Argument for Opposition:* It is a "centralized advance planning" move on a planetary scale. It shrinks the adjustment time even further (instant climate shift). The consequences are hard to foresee (violating the humility required for case-by-case management). It creates a new technological wave before society has absorbed the last one (industrialization -> warming -> geoengineering).

