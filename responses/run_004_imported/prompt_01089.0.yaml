answer: |-
  You are looking for a clean structure because you are treating this as a **causal puzzle**, but your colleagues are treating it as a **normative contract**. That is the crux of the disagreement.

  In rationalist terms, you are arguing from **counterfactual causality** ("But for my action, would the outcome have changed?"), while Colleague A is arguing from **duty-based agency** ("Did you violate an expectation of care?"), and Colleague B is arguing from **institutional design** ("Did the system assign an owner?").

  These are three orthogonal axes of responsibility. The conflict arises because you are trying to win on the causal axis, while the team needs to resolve the normative and institutional axes to prevent recurrence.

  Here is the breakdown of the structure, why your current argument is failing, and a principled way to resolve it.

  ### 1. The Three Frames of Responsibility

  To untangle this, you need to explicitly name the three different definitions of "responsibility" currently in play.

  **A. Causal Responsibility (Your Frame)**
  *   **Question:** *Did my specific action physically determine the outcome?*
  *   **Your Argument:** "Even if I acted, the backlog might have prevented renewal."
  *   **Validity:** Technically sound in a physics sense, but socially brittle. In complex systems, almost no single action is the sole cause of failure. If you rely on this, you imply that unless you are 100% certain your action would have succeeded, you bear zero responsibility. This creates a "threshold of futility" where anyone can opt out of action by imagining obstacles.

  **B. Moral/Agency Responsibility (Colleague A's Frame)**
  *   **Question:** *Did you violate a duty of care owed to the team/customer?*
  *   **Their Argument:** "Noticing and doing nothing is functionally identical to causing it."
  *   **Validity:** High. In high-reliability organizations (like infrastructure teams), omission *is* commission. If you see a bridge collapsing and don't pull the alarm because "someone else might have already called," you are negligent. This frame addresses the **Bystander Effect** (diffusion of responsibility), which is clearly what happened here.

  **C. Procedural Responsibility (Colleague B's Frame)**
  *   **Question:** *Did the process designate an owner?*
  *   **Their Argument:** "Who had explicit ownership of that alert?"
  *   **Validity:** Highest utility for prevention. This bypasses the psychological messiness of blame and looks at the system. If no one owned it, the *process* is guilty. If someone did, they are guilty of negligence.

  ### 2. Why Your Argument Is a "Dodge" (and how to fix it)

  Colleague A calls your argument a dodge because, in a team context, **causal uncertainty does not absolve moral agency.**

  By arguing "it might not have mattered anyway," you are introducing a counterfactual that cannot be proven. More importantly, you are signaling that your willingness to act is contingent on the *guarantee of success*. In infrastructure engineering, that is a dangerous norm. The norm should be: *If I see a risk, I initiate the mitigation protocol.*

  If you win this argument (i.e., the team accepts that you aren't responsible because the ticket might have been backlogged), you establish a precedent where team members are incentivized to remain silent about risks unless they have the bandwidth to solve them personally. This increases systemic risk.

  **The Principled Concession:**
  You can maintain your causal point without accepting it as an absolution.
  *   *Instead of:* "I didn't cause it."
  *   *Try:* "Causally, the outcome was overdetermined by our backlog. But morally, I accept that seeing the risk and not logging it was a failure of agency."

  ### 3. The Principled Resolution: Just Culture

  The rationalist-standard framework for this is **Just Culture**. It distinguishes between **Human Error**, **At-Risk Behavior**, and **Reckless Conduct**.

  *   **Human Error:** A slip or lapse (e.g., forgot to renew). Response: Console and fix the system.
  *   **At-Risk Behavior:** Cutting corners due to production pressure or ambiguity (e.g., assuming someone else would do it). Response: Remove the incentives/ambiguity.
  *   **Reckless Conduct:** Conscious disregard for safety. Response: Punitive.

  This situation is **At-Risk Behavior** driven by **Ambiguity**. All three of you engaged in diffusion of responsibility.

  **The Verdict:**
  1.  **Individual Level:** All three of you share **equal accountability** for the outage. Not because you all "caused" it, but because you all failed the duty to *ensure* it was handled. Splitting hairs on who noticed it first or who was busier is a waste of energy and destroys psychological safety.
  2.  **System Level:** The team failed to assign **Procedural Ownership**. If Colleague B is right and no one owned the alert, the *team lead or manager* bears significant responsibility for allowing a critical certificate to exist without a named owner.

  ### 4. How to Navigate the Postmortem

  Do not try to win the "who is to blame" game. There is no clean structure there, only blood. Instead, pivot the conversation to **Forward-Looking Responsibility**.

  **Step 1: Dissolve the Defensiveness**
  Open by explicitly conceding the normative point.
  > "I've been arguing about causal counterfactuals, but Colleague A is right: noticing a fire and not pulling the alarm is a failure of duty, regardless of whether the fire department was busy. I own that part of the failure."

  This disarms Colleague A. They want acknowledgment of the norm violation, not necessarily your head on a spike.

  **Step 2: Validate the Systemic View**
  Align with Colleague B.
  > "However, Colleague B is also right that relying on individual heroics is a bug. The fact that three people noticed it and no ticket existed means our ownership model is broken."

  **Step 3: Propose the Fix (The "Clean Structure")**
  Propose a policy that makes this disagreement impossible in the future.
  > "We need a 'Saw It, Owned It' policy. If anyone notices a critical risk without a ticket, they are automatically the owner until they explicitly hand it off. No assumptions. Additionally, we need to audit our alerts: every production certificate must have a named owner in the config, not just in our heads."

  ### Summary

  The "clean underlying structure" you are looking for is the distinction between **Blame** (backward-looking, punitive, focused on the past) and **Accountability** (forward-looking, restorative, focused on the future).

  *   **You** are trying to minimize Blame.
  *   **Colleague A** is trying to enforce Accountability.
  *   **Colleague B** is trying to fix the System.

  You cannot minimize Blame by denying Accountability. The only way to reduce Blame is to maximize Accountability and fix the System. If you walk into the meeting and say, *"I am fully accountable for not logging the ticket, and here is the system change to ensure no one else has to make that choice again,"* you resolve the dispute principledly.

  You stop being a defendant and start being an engineer.
