answer: |-
  You have stumbled upon one of the oldest and most difficult problems in political philosophy. What you are experiencing is not just a student council squabble; it is a microcosm of the **"Boundary Problem"** (or the "Problem of the *Demos*").

  The question *"Who has the right to decide who decides?"* is logically circular. As you noticed, if you hold a vote to decide who gets to vote, you have already presupposed an electorate to cast that first vote.

  To answer your question directly: **The line is not arbitrary, but it cannot be decided purely procedurally.** It requires a normative (ethical) choice based on political principles.

  Here is a breakdown of the philosophical frameworks you can use to resolve this, followed by practical solutions for your specific situation.

  ### 1. The Philosophical Frameworks

  Political theorists generally use three main principles to determine the boundaries of an electorate. You can use these to argue for one side or the other.

  **A. The "All Affected Interests" Principle**
  *   **The Argument:** Anyone whose interests are significantly affected by a decision should have a say in making it.
  *   **Application:** Since the constitution will govern the student body for years, incoming freshmen will be deeply affected by it. Excluding them is akin to "governance without consent."
  *   **Verdict:** This strongly supports **including incoming freshmen**.
  *   **Weakness:** Logistically, how do you give a vote to someone who isn't there yet? (See practical solutions below).

  **B. The "All Subjected" Principle**
  *   **The Argument:** Anyone who is currently subject to the coercion of the rules should have a say.
  *   **Application:** Currently enrolled students are the ones living under the *current* constitution and will be the ones implementing the *new* one immediately. Incoming students are not yet members of the polity.
  *   **Verdict:** This supports **current students only**.
  *   **Weakness:** It treats the constitution as a temporary measure rather than a foundational document.

  **C. The "Stakeholder/Citizenship" Principle**
  *   **The Argument:** Voting rights are tied to formal membership status at the time of the decision.
  *   **Application:** Just as a country doesn't let future immigrants vote on its constitution before they arrive, the student council is a body of *current* members.
  *   **Verdict:** Supports **current students only**.
  *   **Weakness:** It ignores the long-term nature of a constitution.

  ### 2. Addressing the Circularity

  You are worried that the process is circular. In political theory, this is known as the distinction between **Constituent Power** (the power to make the constitution) and **Constituted Power** (the power granted by the constitution).

  The circularity is unavoidable in any founding moment. There is no "meta-constitution" to tell you how to write the first constitution. Eventually, someone must make a **foundational decision** that stands outside the normal rules.

  This doesn't mean the decision is *arbitrary* (random); it means it is *normative* (based on values). You cannot vote your way out of it; you must argue your way out of it based on fairness and legitimacy.

  ### 3. Practical Solutions for Your Council

  Since you cannot solve the philosophical paradox with a simple vote, here are four procedural mechanisms used by real governments and organizations to handle this:

  **Option 1: The Ratification Delay (Best for Fairness)**
  Draft the constitution now, but do not **ratify** it until the fall semester when incoming freshmen arrive.
  *   **Pros:** Satisfies the "All Affected Interests" principle. Freshmen can vote on the final package.
  *   **Cons:** Leaves the council without a governing document for the start of the year.
  *   **Fix:** Pass a temporary "Transitional Ordinance" to govern the first semester, subject to the full constitution later.

  **Option 2: The Trustee Model (Best for Efficiency)**
  Current students vote, but they explicitly acknowledge they are acting as **trustees** for future students.
  *   **Mechanism:** Include a clause in the new constitution that makes it **easier to amend** for the first two years (e.g., a simple majority instead of a 2/3 vote).
  *   **Rationale:** This acknowledges that the current electorate might not perfectly represent the future one, so it lowers the barrier for future students to fix mistakes.

  **Option 3: External Arbitration (Breaking the Circle)**
  If the council is deadlocked on *who* should vote, ask a neutral third party to decide the electorate.
  *   **Who:** A faculty advisor, the Dean of Students, or the previous year's council alumni.
  *   **Rationale:** Since the circularity cannot be solved internally, an external authority must define the "Constituent Power" for this specific instance.

  **Option 4: Supermajority Requirement**
  If you decide to let only current students vote, acknowledge the limitation by requiring a **supermajority** (e.g., 66% or 75%) to pass the constitution.
  *   **Rationale:** A simple majority might allow 51% of current students to impose rules on 100% of future students. A supermajority ensures broader consensus, acting as a proxy for broader inclusion.

  ### Recommendation

  The most principled path that avoids the circularity trap is **Option 2 (The Trustee Model with Easy Amendment)**.

  1.  **Acknowledge the limitation:** Write a preamble stating that this constitution is ratified by the current student body *on behalf of* the future student body.
  2.  **Sunset Clause:** Add a provision that the constitution can be amended by a simple majority for the first 12 months.
  3.  **Why this works:** It respects the logistical reality that freshmen aren't here to vote (solving the logistics), but it respects their moral right to self-governance (solving the ethics) by giving them an easy path to change the rules if they dislike them.

  **Summary:** The line you draw is not arbitrary, but it is **foundational**. You cannot vote on it without assuming the answer. Instead of trying to vote on *who votes*, argue about *which principle of fairness* matters more (immediate membership vs. future affectedness) and choose a procedural workaround (like easy amendment) that mitigates the exclusion.
