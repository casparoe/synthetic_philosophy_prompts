prompt: |-
  Our student council is rewriting its constitution, and the main disagreement has been over who should be allowed to vote on the new rules. I believe every currently enrolled student should get a vote, but several members argue that since the new constitution will also govern years after we've graduated, next year's incoming freshmen should have some say too, even though they can't vote in this year's election. When we tried to settle that dispute by voting on who should be allowed to vote in the first place, someone pointed out that whoever we'd already admitted to that vote would decide the outcome, which felt circular. Is there a principled way to decide who belongs in a vote like this, or is the line we draw always going to be somewhat arbitrary?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** A student council is rewriting its constitution.
      *   **Core Dispute:** Who gets to vote on the new constitution?
          *   Option A: Currently enrolled students (User's view).
          *   Option B: Currently enrolled + Next year's incoming freshmen (Opposing view).
      *   **The Meta-Problem:** When trying to vote on *who* gets to vote, they realized it's circular (the people currently allowed to vote decide who gets to vote).
      *   **The Question:** Is there a principled way to decide the electorate, or is it always arbitrary?

  2.  **Identify the Philosophical/Political Science Concept:**
      *   This is a classic problem in democratic theory known as the **"Boundary Problem"** or the **"Problem of the Unit"** (who constitutes the *demos*?).
      *   It's also related to the **"Paradox of Democracy"** (who decides the rules of democracy?).
      *   Key thinkers: Robert Dahl, Frederick Whelan, H.L.A. Hart (rule of recognition), Social Contract Theory.

  3.  **Evaluate the Arguments:**
      *   **Current Students:** They are the ones currently subject to the rules *now*. They bear the immediate burden/benefit.
      *   **Incoming Freshmen:** They will be subject to the rules for the majority of the constitution's lifespan. Excluding them feels like "taxation without representation" (or governance without consent).
      *   **The Circularity:** This is the "Constituent Power" vs. "Constituted Power" distinction. The body writing the constitution (Constituent) is different from the body operating under it (Constituted).

  4.  **Develop Principled Approaches (The "How-To"):**
      *   *All Affected Interests Principle:* Anyone significantly affected by the decision should have a say. (Strong argument for including freshmen).
      *   *All Subjected Principle:* Anyone subject to the coercion of the rules should have a say. (Also supports freshmen, but maybe not alumni).
      *   *Stakeholder/Citizenship Model:* Membership is defined by current status. (Supports current students).
      *   *Trusteeship/Representation:* Current students act as trustees for future students. (Compromise).
      *   *Supermajority/Ratification:* Require a higher threshold if the electorate is contested.

  5.  **Address the Circularity:**
