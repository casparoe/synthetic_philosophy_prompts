      *   *Point of Contention 2 (Reification):* AI safety folks often talk as if the Utility Function is a *thing* in the code. Ramsey would say it's just a description of behavior. If the behavior changes, the "utility function" changes. There is no "true" goal underneath.
      *   *Point of Contention 3 (Completeness):* Ramsey's framework requires preferences over *all* relevant propositions. An AI might have no preference between two irrelevant states. Forcing completeness creates the "fixed goal" illusion.
