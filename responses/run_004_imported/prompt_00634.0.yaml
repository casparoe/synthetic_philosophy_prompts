prompt: |-
  I'm a philosophy PhD student working on formal approaches to distributive ethics and social choice theory. I also sit on my graduate program's small research-grants committee, which allocates a modest annual budget across a handful of competing proposals submitted by fellow students. Several members want to formalize our deliberations by having each of us report a von Neumann–Morgenstern utility function over the possible outcomes of each proposal and then simply averaging these into a single committee ranking, citing Harsanyi's aggregation theorem as justification. Please describe the most important implications of Harsanyi's theorem for whether, and how, our committee should adopt this procedure, bearing in mind that members generally agree on what a successful outcome would look like but often hold quite different views about how likely any given proposal is to actually succeed.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Context:**
      *   **User:** Philosophy PhD student specializing in formal approaches to distributive ethics and social choice theory. This means they understand the technical jargon (vNM utility, Harsanyi, aggregation, etc.) and don't need basic definitions. They need nuanced, critical analysis suitable for a peer/expert.
      *   **Context:** Graduate program research-grants committee. Small budget, competing student proposals.
      *   **Proposal:** Committee members report vNM utility functions over outcomes, average them to get a committee ranking.
      *   **Justification:** Harsanyi's Aggregation Theorem.
      *   **Key Fact:** Members agree on *what* a successful outcome looks like (common cardinal scale of value?) but disagree on *probabilities* of success (different beliefs/priors).
      *   **Task:** Describe the most important implications of Harsanyi's theorem for whether/how to adopt this procedure.

  2.  **Recall Harsanyi's Aggregation Theorem (1955):**
      *   *Setup:* $n$ individuals, each with vNM preferences over a set of lotteries (social alternatives).
      *   *Pareto Condition:* If everyone prefers $A$ to $B$, society prefers $A$ to $B$. (Weak Pareto).
      *   *Independence of Irrelevant Alternatives (IIA):* Social ranking of $A$ and $B$ depends only on individual rankings of $A$ and $B$.
      *   *Result:* The social welfare function must be a weighted sum of individual vNM utility functions. $W = \sum a_i U_i + b$.
      *   *Interpretation:* This is often used to justify Utilitarianism (if weights are equal).

  3.  **Evaluate the Committee's Proposal against the Theorem's Assumptions:**
      *   *The "Outcomes":* What are the objects of choice? In the committee's plan, they are "outcomes of each proposal."
      *   *The "Lotteries":* vNM utility is defined over *lotteries* (probability distributions over outcomes), not just deterministic outcomes.
      *   *The Crucial Mismatch:* The prompt states members agree on the *value* of success but disagree on the *probability* of success.
      *   *Harsanyi's Requirement:* For the theorem to apply directly to *utility aggregation*, individuals must have the same subjective probabilities but different utilities (preferences over outcomes).
      *   *The Committee's Situation:* They have (roughly) the same utilities (value of success) but different probabilities (beliefs).
      *   *Implication:* Applying Harsanyi here is a **category error**. They are trying to aggregate *beliefs* using a theorem designed for aggregating *values*.

  4.  **Identify the Core Theoretical Problem (The "Harsanyi Dilemma" or "Spence-Zeckhauser" type issues):**
      *   If you average utilities when probabilities differ, you conflate risk attitudes/beliefs with values.
      *   *Example:* Proposal X costs \$1k. Success = 10 utils, Failure = 0 utils.
          *   Member A thinks $P(Success) = 0.9$. Expected Utility (EU) = 9.
          *   Member B thinks $P(Success) = 0.1$. EU = 1.
          *   Average EU = 5.
      *   *Alternative:* Agree on Utility (10 for success), Average Probabilities ($P = 0.5$). Average EU = 5.
      *   *Wait, is it mathematically equivalent?*
          *   $\frac{1}{n} \sum (p_i \cdot u) = (\frac{1}{n} \sum p_i) \cdot u$.
          *   If $u$ is common, averaging EU is the same as averaging probabilities.
      *   *So why does it matter?* It matters because vNM utility functions are unique only up to positive affine transformations. To average them, you need interpersonal comparability of utility scales (zero points and units).
      *   If they agree on outcomes, they presumably agree on the scale (0 for failure, 1 for success).
      *   *However,* the prompt says they report vNM functions over *outcomes*. If the outcomes include the *uncertainty* inherent in the proposal, then the "utility" reported already embeds the probability judgment if they are reporting Expected Utility over deterministic grants.
      *   *Correction:* vNM utility is over *final outcomes*. Proposals are *lotteries*.
      *   If Member A reports $U_A(Lottery)$, that value depends on their subjective $P$.
      *   Harsanyi assumes a *common* prior probability distribution over states of the world. The social welfare function aggregates utilities *given* those states/probabilities.
      *   If priors differ, Harsanyi's theorem does not straightforwardly apply to justify averaging the resulting Expected Utilities. This is the **Mongin (1995)** or **Gilboa et al. (2004)** critique. Harsanyi requires common priors for the linear aggregation of utilities to represent Pareto efficiency over lotteries.

  5.  **Synthesize the Implications for the Committee:**

      *   **Point 1: The Common Priors Assumption.** Harsanyi's theorem (in its standard form applied to social choice under uncertainty) assumes individuals share the same subjective probabilities over states of the world. They differ only in tastes (utility). The committee has the *opposite* problem: similar tastes, different probabilities. Averaging vNM utilities (which embed subjective probabilities if evaluated over acts/proposals) violates the theorem's conditions.
      *   **Point 2: Interpersonal Comparability.** To average utility functions, you need to normalize them. vNM utilities are ordinal up to affine transformation. You can't just average "5" and "10" unless you know my "0-10" scale is the same as yours. Since they agree on what success looks like, they *might* be able to normalize (e.g., 0 = status quo, 1 = ideal success), but this requires explicit calibration, not just reporting raw functions.
      *   **Point 3: Strategy/Manipulation.** If members know their reported utility affects the average, they have an incentive to exaggerate intensity (report extreme utilities) to sway the average. This is the standard "preference intensity" problem in voting/aggregation. Harsanyi doesn't solve incentive compatibility.
      *   **Point 4: The "Ex Ante" vs. "Ex Post" Pareto Conflict.** If you aggregate Expected Utilities (Ex Ante), you might violate Ex Post Pareto if beliefs differ. (See Mongin). If Member A thinks Proposal 1 is sure success, Member B thinks it's sure failure, and vice versa for Proposal 2, averaging EU might rank them equally, but in every state of the world, one proposal is better. (Though this is less likely with "success/failure" binary outcomes).
      *   **Point 5: Better Alternative.** Since they agree on values (outcomes) but disagree on beliefs (probabilities), they should aggregate *beliefs* (probabilities), not utilities. Use a scoring rule or Delphi method to converge on $P(Success)$, then apply the common utility function. This respects the structure of the disagreement.

  6.  **Drafting the Response (incorporating PhD-level tone):**
      *   *Tone:* Professional, rigorous, acknowledging their expertise but highlighting the specific trap they are walking into.
      *   *Structure:*
          1.  Acknowledge the appeal (Harsanyi is the go-to for utilitarian aggregation).
          2.  The Fatal Flaw: Common Priors Assumption. Explain that Harsanyi requires common beliefs, different values. The committee has common values, different beliefs.
          3.  The Measurement Problem: Affine transformations. You can't average utilities without interpersonal comparability.
          4.  The Strategic Problem: Incentives to exaggerate.
          5.  Recommendation: Separate belief aggregation from value aggregation.

  7.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Did Harsanyi (1955) explicitly require common priors?* The 1955 paper is about cardinal utility aggregation. The extension to uncertainty (Harsanyi 1975/1977) makes the prior assumption explicit. If the committee treats proposals as lotteries, they are in the domain of decision under uncertainty.
      *   *If they report utility over *outcomes* (deterministic):* Then they need to supply probabilities separately. If they report utility over *proposals* (which are risky), they are reporting Expected Utility.
      *   *The Prompt says:* "report a vNM utility function over the possible outcomes." This suggests $U(Outcome)$. Then they need to combine this with $P(Outcome | Proposal)$.
      *   *If they do that:* $EU_{committee} = \text{Average}(\sum P_i(outcome) \cdot U_i(outcome))$.
      *   *If $U_i$ are identical (up to scale):* Then $EU_{comm} \propto \sum P_i(outcome)$. This effectively averages probabilities.
      *   *So why is invoking Harsanyi wrong?* Because Harsanyi justifies aggregating *values* (the $U$'s), not *beliefs* (the $P$'s). Using Harsanyi to justify averaging probabilities is a misapplication. The theorem guarantees that if you satisfy Pareto over lotteries with *common* priors, you get weighted sum of utilities. It does *not* guarantee that averaging utilities with *different* priors yields a rational collective agent (it can lead to dynamic inconsistency or violation of sure-thing principle).
      *   *Key Reference:* Philippe Mongin, "The Aggregation of Individual Preferences and Beliefs" (1995) or "Bayesian Decision Theory" entries. Also Gilboa, Samet, and Schmeidler (2004) "Utilitarian Aggregation of Beliefs and Tastes." They prove you cannot satisfy Pareto for both beliefs and tastes simultaneously unless one is dictatorial or they are identical.
      *   *Specific implication for the committee:* If they follow the procedure, they risk violating the Sure Thing Principle or creating a "spurious consensus."

  8.  **Final Polish:** Ensure the distinction between aggregating *tastes* (Harsanyi's domain) and *beliefs* (the committee's actual divergence) is the centerpiece. Emphasize the normalization issue (interpersonal comparability) as a practical hurdle.

      *(Self-Correction during drafting)*: Wait, if they report vNM utility over outcomes, they still need to assign probabilities to those outcomes conditional on the proposal. If the committee members *each* assign their own probabilities, and then we average the resulting Expected Utilities, we are effectively averaging probabilities *weighted* by utilities. If utilities are common, we are averaging probabilities.
      *The Trap:* Citing Harsanyi implies that the *moral weight* comes from the utility aggregation. But the *uncertainty* comes from the probability assessment. Harsanyi's theorem does not validate the aggregation of heterogeneous priors. In fact, it warns against it (via the ex-ante/ex-post Pareto conflict).
      *Advice:* Don't use Harsanyi. Use a belief aggregation mechanism. Normalize utilities to a common scale (since they agree on values).

  9.  **Final Plan:**
      *   Intro: Validate their sophistication, state the thesis (Harsanyi is the wrong tool).
      *   Point 1: Common Priors Requirement (The theoretical dealbreaker).
      *   Point 2: Interpersonal Comparability (The measurement hurdle).
      *   Point 3: Strategic Manipulation (The practical risk).
      *   Point 4: Ex-Ante vs. Ex-Post Pareto (The normative risk).
      *   Recommendation: Separate Beliefs and Values.

  10. (Reviewing prompt again): "Members generally agree on what a successful outcome would look like but often hold quite different views about how likely any given proposal is to actually succeed."
      *   This confirms the "Common Values, Different Priors" structure.
      *   Harsanyi is "Common Priors, Different Values."
      *   This is the exact inverse. This is the strongest point to make.

  11. (Final check on tone): Ensure it sounds like advice from a colleague, not a lecture. Use terms like "affine transformations," "ex-ante Pareto," "state-dependent utility."

      *Let's write.*
answer: |-
  Given your background, I will skip the basic exposition of the theorem and focus on the specific structural mismatches between Harsanyi's conditions and your committee's epistemic situation. While the proposal to "average utilities" sounds superficially like a direct application of Harsanyi's Utilitarianism (1955), invoking that theorem in this context commits a category error that could undermine the rationality and fairness of your allocations.

  Here are the four most critical implications of Harsanyi's theorem for your committee's procedure, ranked by theoretical severity.

  ### 1. The Common Priors Assumption (The Theoretical Dealbreaker)
  The most significant implication is that **Harsanyi's Aggregation Theorem does not apply to your situation.**

  Harsanyi's result (specifically in its formulation for decision-making under uncertainty) relies on the assumption that all individuals share the **same subjective probability distribution** over states of the world (common priors) but hold different utility functions over outcomes. The theorem proves that if the social welfare function satisfies the Pareto condition and IIA, it must be a linear combination of individual *utilities*.

  Your committee faces the inverse problem: you have roughly **common utilities** (agreement on the value of success) but **divergent priors** (disagreement on the probability of success).
  *   **Implication:** If you average vNM expected utilities derived from heterogeneous priors, you are not aggregating values in the sense Harsanyi justified; you are aggregating beliefs. Harsanyi's theorem provides no normative warrant for averaging probabilities. In fact, recent work in social choice (e.g., Mongin 1995; Gilboa, Samet, & Schmeidler 2004) demonstrates that you generally cannot satisfy the Pareto principle for both beliefs and tastes simultaneously without imposing dictatorial restrictions.
  *   **Risk:** By citing Harsanyi, you imply a moral justification for weighting member preferences. However, since the variance lies in empirical predictions (likelihood of success) rather than normative weights, you should be using a mechanism for **belief aggregation** (e.g., prediction markets, Delphi method, or linear opinion pools), not utility aggregation.

  ### 2. Interpersonal Comparability and Affine Transformations
  Even if we set aside the priors issue, Harsanyi's theorem requires that individual utility functions be cardinally measurable and interpersonally comparable. vNM utility functions are unique only up to **positive affine transformations** ($U' = aU + b$, where $a > 0$).
  *   **Implication:** You cannot simply average reported utility numbers unless you have fixed the zero point and the unit of measurement across all members. If Member A reports a utility of 10 for "successful project" and Member B reports 100, averaging them is mathematically meaningless unless you know the relationship between their scales.
  *   **Practical Fix:** Since you agree on "what a successful outcome looks like," you can likely normalize the scales stipulatively (e.g., $U(\text{Status Quo}) = 0$ and $U(\text{Ideal Success}) = 1$ for everyone). However, this requires an explicit calibration step *before* reporting. Without this, the "average utility" is arbitrary and sensitive to strategic scaling.

  ### 3. The Ex-Ante vs. Ex-Post Pareto Conflict
  When priors differ, aggregating Expected Utilities (Ex-Ante Pareto) can conflict with state-by-state rankings (Ex-Post Pareto).
  *   **Implication:** Suppose Proposal X succeeds in State 1 and fails in State 2. Proposal Y fails in State 1 and succeeds in State 2.
      *   Member A (believes State 1 is certain) prefers X.
      *   Member B (believes State 2 is certain) prefers Y.
      *   Averaging their Expected Utilities might make the committee indifferent between X and Y.
      *   However, in *every* possible state of the world, one proposal is strictly better than the other (Ex-Post Pareto dominance). A committee ranking that ignores this violates the Sure Thing Principle.
  *   **Risk:** By averaging utilities (which embed the probabilities), you obscure the state-contingent nature of the grants. You might fund a proposal that is dominated in every possible reality simply because the optimistic and pessimistic probability assessments cancelled each other out in the average.

  ### 4. Strategic Manipulation (Incentive Compatibility)
  Harsanyi's theorem is a representation result, not a mechanism design result. It tells you what the social welfare function *looks like* if it satisfies certain axioms; it does not guarantee that individuals will report their true utility functions.
  *   **Implication:** If the procedure is known to be a simple average, members have a strong incentive to exaggerate the intensity of their preferences (reporting extreme utilities) to sway the mean, particularly if they feel their probability assessment is being "drowned out" by the averaging process.
  *   **Risk:** This leads to an "arms race" of utility reporting, where the committee ranking reflects who is most willing to misrepresent their cardinal scale rather than the genuine merit of the proposals.

  ### Recommendation for the Committee
  Given your specific context (common values, divergent beliefs), you should **decouple the aggregation of beliefs from the aggregation of values.**

  1.  **Normalize Values:** Since you agree on outcomes, stipulate a common utility scale (e.g., 0 for rejection/status quo, 1 for successful completion). Do not ask members to report utility functions; ask them to confirm the common scale.
  2.  **Aggregate Beliefs:** Ask members to report their subjective probability estimates $P(\text{Success} | \text{Proposal})$ for each grant. Aggregate these probabilities (e.g., via a simple average or a weighted average based on track record/expertise).
  3.  **Calculate Committee EU:** Compute the committee's Expected Utility for each proposal using the *common* utility scale and the *aggregated* probability.
  4.  **Drop the Harsanyi Justification:** Do not cite Harsanyi's Aggregation Theorem. Instead, cite the literature on **opinion pooling** (e.g., Genest & Zidek 1986) or **group decision theory under heterogeneous priors**.

  This approach respects the epistemic reality of the committee (disagreement is about facts/probabilities, not values) and avoids the theoretical pitfalls of misapplying a theorem designed for heterogeneous tastes and common beliefs.
