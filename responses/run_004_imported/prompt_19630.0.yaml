answer: |-
  Good evening. For those who don't know me, I cover science and ideas. I spend my days translating complex theories into copy, which means I occupy a strange border country between the newsroom and the academy. I'm told I'm giving this toast because I'm the only person here who talks to philosophers for a living, and looking around the room, I see roughly half of you are nodding along with that, and the other half are checking your watches to see if dinner is coming.

  We are here to honor Dana Kessler. For twenty-eight years, Dana has been our Standards Editor. In most magazines, that title means you check facts. You make sure names are spelled right and dates align. But anyone who has ever had a copy edited by Dana knows she wasn't just checking facts. She was checking *epistemic status*.

  Dana enforced a specific, rigorous standard. It wasn't enough that a claim was true. It wasn't even enough that a reporter had justified belief in the claim. Dana required *knowledge*. If you couldn't say you *knew* it, it didn't run.

  For the journalists here, that sounds like semantics. For the philosophers here, you recognize that immediately as the Knowledge Norm of Assertion. And you know that it is a much heavier burden than the Truth Norm. The Truth Norm says: "Assert it if it's true." The Knowledge Norm says: "Assert it only if your connection to the truth is non-accidental."

  There is a piece of newsroom lore that perfectly illustrates the cost of that distinction.

  Years ago, a reporter came to Dana with a breakthrough story. It was explosive. It was controversial. And, as we found out two days later, it was factually correct. A wire service ran it, verified by a different source. We were scooped. We looked slow. We looked like we missed a big win.

  But Dana had spiked the story.

  When the reporter protested, pointing out that the story was, in fact, *true*, Dana didn't blink. She pointed out that the source had arrived at the information through a chain of reasoning that was flawed, relying on a coincidence that masked a lack of access. The source had gotten it right by accident.

  In philosophy, we call that a Gettier case. It is a belief that is true and justified, but only true by luck. Most newsrooms would have run it. It was true. We would have been right. But Dana refused to let us assert something we didn't *know*. She sacrificed the scoop, and she sacrificed being "right," to protect the integrity of the assertion itself.

  That is an expensive rule to live by.

  To the journalists in the room: We all feel the pain of that. We want to be first. We want to be right. When you kill a story that turns out to be true, it feels like a wound. It feels like bureaucracy strangling instinct.

  But to the philosophers in the room: You understand what Dana was protecting. If we adopt a Truth Norm, we become gamblers. We can win by luck. If we adopt a Justified Belief Norm, we can win by convincing argumentation that happens to rest on false premises. But if we adopt the Knowledge Norm, we acknowledge that journalism is not just about the output; it is about the relationship between the writer and the world.

  Dana understood that a magazine's authority doesn't come from never making mistakes. It comes from never making lucky guesses. She understood that if we run a story because we got lucky, we are teaching our readers to trust our luck, not our work. And luck runs out.

  Now, Dana has given me specific instructions for this evening. She wrote to me and said, "Do not toast me as though I was always right. Toast me as though the rule was."

  This is a crucial distinction. Dana is not infallible. I am sure there were times when her rigor felt like obstruction. I am sure there were times when the rule was applied and the cost was high, with no immediate payoff. She doesn't want credit for her intuition. She wants credit for her fidelity to the standard.

  She wants us to recognize that the standard is bigger than the enforcer. The standard survives the newsroom. The standard survives the news cycle.

  So, Dana, we are not toasting your perfection. We are toasting your discipline. We are toasting the times you made us rewrite, the times you made us report more, and yes, the times you made us kill a story that was true, because we hadn't earned the right to say we knew it.

  You taught us that being right by accident is the enemy of being reliable by design. You taught a room full of writers and a room full of philosophers that there is a difference between a claim that happens to land on the truth, and a claim that is anchored to it.

  For twenty-eight years, you were the anchor.

  Ladies and gentlemen, please raise your glasses. To Dana Kessler, and to the rule that held us all to account.

  To Dana.
