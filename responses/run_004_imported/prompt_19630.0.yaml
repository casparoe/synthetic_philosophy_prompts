prompt: |-
  I cover science and ideas for a magazine, and I've been asked to toast Dana Kessler at her retirement dinner. Dana has been our standards editor for twenty-eight years, and she enforced, without exception, a genuine knowledge norm of assertion: not "reasonably believed," not "well justified," not even "true, so far as we can tell" -- if a reporter couldn't be said to know a claim, it didn't run. Newsroom lore holds that she once spiked a story her own reporter had gotten exactly right, because the source had, as she put it, "gotten it right by accident" -- about as close to a live Gettier case as a newsroom will ever produce -- and a wire service scooped it two days later. I got tapped for the toast because my beat means I'm the one person in the room who talks to philosophers for a living, and roughly half the tables actually are philosophers, since Dana spent her last decade co-teaching a seminar on assertion and the news with the philosophy department. She has asked, in writing, not to be toasted as though she was always right -- only as though the rule was. Write a five-minute toast built around the Gettier anecdote: it should read as affection, not a lecture, to the newsroom half of the room, while not flattening, for the philosophers, what a knowledge norm actually costs against the truth-norm and belief-norm alternatives.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Science and ideas writer for a magazine.
      *   **Honoree:** Dana Kessler, retiring Standards Editor (28 years).
      *   **Audience:** Mixed crowd. Half newsroom (journalists, editors), half philosophers (Dana co-taught a seminar on assertion and the news).
      *   **Key Theme:** Dana enforced a *knowledge norm of assertion* (KNA), not just truth or justified belief. If you didn't *know* it, it didn't run.
      *   **Key Anecdote:** Dana spiked a story that was actually *true* because the source got it right by accident (a live Gettier case). A wire service scooped it two days later.
      *   **Constraint 1 (Tone):** Affectionate, not a lecture (for the journalists).
      *   **Constraint 2 (Depth):** Don't flatten the philosophical stakes (for the philosophers). Acknowledge the cost of KNA vs. truth/belief norms.
      *   **Constraint 3 (Dana's Wish):** Do not toast her as if *she* was always right; toast her as if the *rule* was.
      *   **Length:** Five minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophical Concepts (for accuracy):**
      *   *Truth Norm:* Assert $p$ only if $p$ is true. (Problem: You can't always access truth directly).
      *   *Justified Belief Norm:* Assert $p$ only if you have good evidence for $p$. (Problem: You can have good evidence and still be wrong, or get it right by luck).
      *   *Knowledge Norm (KNA):* Assert $p$ only if you *know* $p$. (Requires truth, belief, justification, *and* no luck/Gettierization).
      *   *The Gettier Case:* A belief is true and justified, but true only by luck (e.g., the broken clock that shows the right time). Dana spiked a story that fit this profile.
      *   *The Cost:* KNA is stricter. It kills true stories if the epistemic path is flawed. It prioritizes integrity of process over being first or even being right by accident.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the dual audience (journalists and philosophers). Set the scene. Introduce Dana's role.
      *   **The Core Concept (The Norm):** Explain what Dana did without using jargon immediately. She wasn't just checking facts; she was checking *how* we knew them.
      *   **The Anecdote (The Gettier Spike):** Tell the story of the spiked story. This is the heart of the toast. It needs to illustrate the philosophical point without sounding like a classroom.
      *   **The Philosophical Weight (for the philosophers):** Acknowledge that this rule is expensive. It costs scoops. It costs "being right." But it preserves something else (trust, authority).
      *   **Dana's Wish:** Address her request not to be praised for infallibility, but for the standard.
      *   **Closing:** A raise of the glass to the rule and the enforcer.

  4.  **Drafting - Tone Check:**
      *   *Journalists:* Need to feel the pain of the spiked story but respect the integrity. Avoid academic dryness. Use newsroom lingo (spiked, scoop, copy desk).
      *   *Philosophers:* Need to nod to the specific epistemic nuance. Use terms like "Gettier," "norm," "assertion" correctly but naturally.
      *   *Affection:* Warmth towards Dana. She's retiring. It's a celebration.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I write about science. Dana edited standards. She loved philosophy. She had a rule: You have to know it. Not just think it. One time she killed a true story because the reporter got lucky. Philosophers call that Gettier. Journalists call that a headache. But she was right about the rule. Even if it cost us a scoop. Dana says don't praise her, praise the rule. So let's praise the rule. Cheers.
      *Critique:* Too dry. Needs more emotion and better integration of the philosophy.

  6.  **Drafting - Iteration 2 (Fleshing out the Gettier story):**
      Make the story vivid. The reporter was excited. The source was shaky. The facts aligned, but the *path* was wrong. Dana saw through it. The wire service got it later, maybe with better sourcing. This shows the cost. We lost the scoop. But we kept our soul.
      *Refining the Philosophy:* Explicitly mention "Truth Norm" vs. "Knowledge Norm." Explain that Truth Norm allows lucky guesses. Knowledge Norm forbids them. This is the "cost" the prompt mentions.

  7.  **Drafting - Iteration 3 (Writing the speech):**
      *   *Start:* Good evening. I'm the science writer. I talk to philosophers. That's why I'm here.
      *   *Middle:* Dana's 28 years. The "Knowledge Norm." Explain it simply. Then the story. The "Gettier Spike."
      *   *Nuance:* Acknowledge the pain. We lost a scoop. That hurts. But if we run lucky guesses, we are gamblers, not journalists.
      *   *Dana's Request:* She doesn't want to be the hero. The *principle* is the hero.
      *   *End:* Raise a glass.

  8.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check Word Count:* A 5-minute toast is roughly 750-850 words.
      *   *Check Audience Balance:* Ensure the philosophers don't feel talked down to, and the journalists don't feel bored.
      *   *Key Phrase:* "Not that she was right, but that the rule was."
      *   *Gettier Explanation:* Keep it narrative. "True by accident."
      *   *Emotional Arc:* Start respectful, move to the tension of the spiked story, resolve with the value of integrity.

  9.  **Final Review against constraints:**
      *   5 minutes? Yes.
