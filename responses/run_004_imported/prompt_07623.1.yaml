  8.  **Self-Correction/Nuance Check:**
      *   *Did Quine believe *everything* is indeterminate?* No, just translation/meaning. Physics is determinate.
      *   *Is MI about meaning?* Sometimes yes (interpretability), sometimes no (debugging).
      *   *Superposition:* This is a compression argument. Quine liked parsimony. He might view superposition as a vindication of his skepticism about discrete "ideas."
      *   *Key Insight:* The friend's claim is essentially anti-realist about features. Quine is a realist about physical objects but anti-realist about propositions/meanings. So, it depends on what status "features" have.

