answer: |-
  **Stop! Do not write that headline.** If you publish "Church-Turing Thesis Overturned," you will get hammered by computer scientists.

  Your researchers are using shorthand that is technically imprecise. Here is the nuance you need to save your article:

  **1. The Core Distinction: Computability vs. Complexity**
  *   **The Church-Turing Thesis (CTT)** is about **computability**: *What can be computed in principle?* It states that any function that can be effectively calculated can be computed by a Turing Machine.
  *   **Quantum Computing** is about **complexity**: *How fast can it be computed?*
  *   **The Reality:** A classical Turing Machine **can** simulate a quantum computer. It can run Shor's algorithm. It can replicate Google's supremacy experiment. It just might take millions of years to do what a quantum computer does in minutes.
  *   **Verdict:** Because a classical computer *can* do it (given infinite time/memory), the problems are not "impossible." Therefore, the original Church-Turing Thesis remains **true**.

  **2. The Thesis Actually at Stake: The *Extended* Church-Turing Thesis**
  The version of the thesis your researchers are actually challenging is the **Extended Church-Turing Thesis (ECTT)**.
  *   **ECTT Claim:** Any reasonable physical model of computation can be **efficiently** simulated by a probabilistic Turing Machine.
  *   **Quantum Impact:** If quantum computers can solve problems exponentially faster than classical ones (as Shor's suggests), then the **ECTT is false**.
  *   **Why it matters:** This is still a huge deal, but it's a statement about *efficiency*, not *possibility*.

  **3. Why the Researchers Say It**
  In physics circles, there is a variation called the **Physical Church-Turing Thesis**, which suggests that *physics itself* limits computation. Some physicists argue that because the universe is quantum, a classical Turing Machine isn't a complete model of physical reality. When they say "CTT is falsified," they usually mean this physical interpretation or the Extended version, not the original mathematical thesis.

  **4. How to Frame This in Your Explainer**
  *   **Avoid:** "Quantum computers do the impossible."
  *   **Use:** "Quantum computers do the **intractable**."
  *   **The Hook:** "Classical computers *could* crack RSA encryption or simulate molecules, but it would take longer than the age of the universe. Quantum computers change the economics of computation, not the laws of logic."
  *   **The Thesis Angle:** "Quantum computing challenges the *Extended* Church-Turing Thesis, suggesting that nature allows for shortcuts that classical logic cannot efficiently mimic."

  **Summary for your deadline:**
  The original Church-Turing Thesis is safe. The *Extended* Church-Turing Thesis is the one taking fire. The story isn't that we broke logic; it's that we found a loophole in the speed limits of the universe.

  Good luck with the deadline!
