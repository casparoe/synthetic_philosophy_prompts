answer: |-
  **The Custom of Gravity**

  The flint struck the steel. A spark flew. It touched the oil-soaked wick.

  For a heartbeat, nothing happened.

  Yasmin held her breath, her hand hovering over the lamp. In the silence of the observatory, the wick remained dark. The spark had vanished, but the flame had not arrived.

  Then, a soft *whump*. The fire bloomed, yellow and steady.

  Yasmin exhaled, a long, shaky release. She dipped her pen into the inkwell, but before writing, she whispered the necessary qualification. "It burned, by Habit."

  She did not write *Fire causes combustion*. To write that was heresy, and worse, it was false. She wrote: *On this morning, in this room, the Creator willed the cotton to blacken and the light to appear, as He has done for ten thousand mornings prior.*

  Yasmin was a Recorder of the Sunnah of Matter. In other worlds, they might have called her a physicist. Here, she was a theologian of the mundane.

  Her job was to track the Consistency. The Great Habit.

  Most days, the Habit held. Stones fell when dropped. Bread nourished. Water quenched thirst. But the memory of the Great Drought of the previous century hung over the city. For three days, water had refused to be wet. It had slipped through fingers like mercury, refusing to enter the throat. Thousands had died, not because the water vanished, but because it stopped *acting* like water.

  "Report?"

  Yasmin looked up. Kael stood in the doorway, holding a basket of apples. He looked tired. In a world where cause was not guaranteed, fatigue was the only true constant, because it was a state of the soul, not the body.

  " The lamp lit," Yasmin said. "Latency of two seconds."

  Kael set the basket down. "Two seconds is long. The market had a break yesterday. A mason dropped a block of sandstone. It didn't fall. It just… hovered. Then it turned to dust."

  Yasmin felt a cold prickle at the base of her neck. "Did it hurt anyone?"

  "No. But the mason won't build. He says if stone forgets it is stone, a roof cannot be trusted." Kael picked up an apple. He looked at it with deep suspicion. "I'm hungry. But I keep thinking, what if this apple decides to be poison today? Not because it's rotten. Just because the Habit shifted."

  "Eat," Yasmin said softly. "If you starve waiting for certainty, you die anyway."

  Kael bit into the fruit. He chewed, swallowed, and waited. His eyes stayed locked on Yasmin's. After a minute, he didn't double over. He let out a laugh that was half-sob. "It nourished."

  "Alhamdulillah."

  This was the burden of their science. They could not predict. They could only witness. There were no laws of nature, only patterns of Divine Will. A miracle was not a violation of law; it was simply a change in routine. Abraham in the fire was not magic; it was God deciding that today, fire would act as a flower.

  "We have to calibrate the bridge," Yasmin said, standing up.

  Kael froze. "The suspension bridge? Yasmin, the cables are iron. Iron has been… moody."

  "The trade caravan is waiting on the other side of the gorge. Medicine. Grain. They can't wait for a month of observation." Yasmin grabbed her satchel. Inside were not tools, but prayers and contracts. "If we don't test it, they won't cross. If they don't cross, the south district starves."

  "I'm not going out there," Kael said. "If gravity takes a holiday, I'd rather fall in my own room."

  "Then hold the rope."

  Yasmin stepped out onto the stone balcony. The bridge stretched across the Deep Cut, a massive span of iron and wood. It looked solid. But solidity was an opinion, not a fact.

  She stepped onto the planks.

  *Step one.* The wood supported her weight. The Habit held.
  *Step two.* The iron cables groaned. Tension was being transferred.
  *Step three.*

  She stopped. She felt a sudden lightness in her stomach. Not fear. Physical lightness. Her foot came down, but the plank didn't depress.

  She looked down. Her boot was hovering an inch above the wood.

  Panic, cold and sharp, spiked in her chest. This was it. The Break. The moment the universe remembered it didn't *have* to make sense. If the Habit severed now, she wouldn't fall. She might float. She might turn to glass. She might simply cease to be, because existence itself was being renewed moment by moment, and the Pen might stop writing her.

  *Don't fight it,* she told herself. *There is no power in you to fall. There is no power in the wood to hold. There is only He.*

  To struggle was to assume she had agency over the physics. She didn't. She was a shadow on the wall.

  She closed her eyes. She did not try to push down. She simply existed in the space she occupied. "Ya Muqallib al-Qulub," she whispered. *O Turner of Hearts.* And, *O Turner of States.*

  She waited for the new command of the moment.

  A wind blew. It smelled of dust and ozone. The wind pushed against her back.

  Her foot pressed down. The wood creaked. Gravity returned, not as a right, but as a gift.

  Yasmin opened her eyes. She was on the other side of the gorge. She hadn't walked the last twenty feet; she had surfed the edge of a miracle, riding the uncertainty until the Habit re-established itself.

  She turned around. Kael was on the other side, white-faced, gripping the anchor rope.

  "Yasmin!" he screamed. "You vanished! For three steps, you were gone!"

  "I was here," she called back, her voice trembling. "The world just looked away."

  She walked back. The return trip was mundane. The wood was wood. The air was air.

  When she stepped back onto the balcony, her legs gave out. Kael caught her.

  "You can't send the caravan," Kael said fiercely. "Did you feel that? The Habit is thinning. It's wearing out."

  Yasmin shook her head, staring at her hands. They were solid. For now. "No. It's not wearing out. We just forget that it's not a machine."

  She pulled out her logbook. She dipped her pen.

  *What do you write?" Kael asked. "That gravity failed?"

  "No," Yasmin said. She watched the ink soak into the paper. It didn't turn to smoke. It stained the fiber. Another small mercy.

  She wrote: *The Bridge held. The Traveler crossed. The Support was granted.*

  "We don't study nature, Kael," she said, capping the ink. "We study His patience. He could make the fire freeze us. He could make the air drown us. But He doesn't. He creates the same world, over and over, trillions of times a day, just so we can recognize it."

  "So we just trust it?" Kael asked. "Like the apple?"

  "We trust the Giver, not the gift," Yasmin said. She picked up the apple Kael had been eating. It sat on the table, red and heavy. "If I drop this, it will likely fall. If it doesn't, I will not be surprised. And if it falls, I will not take it for granted."

  She let go of the apple.

  It fell. It hit the table with a dull thud. It rolled to a stop.

  Yasmin smiled, a tired, fragile thing.

  "Tomorrow," she said, "we test the water again."

  "And if it's dry?"

  "Then we pray for rain, even if the sky is blue."

  Yasmin looked out the window at the city. Lamps were being lit all over the valley. Thousands of tiny flames, each one a separate decision, a separate act of creation. None of them touched the others. None of them caused the next. They were a constellation of singular moments, strung together by memory and hope.

  It was terrifying. It was exhausting.

  But as the sun began to set, painting the sky in violets and oranges, Yasmin watched the light fade. She knew the sun didn't actually go anywhere. The light was simply being turned off, pixel by pixel, across the horizon.

  And she knew, with absolute certainty, that tomorrow, the Light would be willed on again.

  "Goodnight, Kael," she said.

  "Goodnight, Yasmin. If we wake."

  "If we wake," she agreed.

  She blew out the lamp. The darkness arrived, instant and total. She did not stumble in the dark. She knew the shape of her room, not because she had memorized it, but because she trusted the Habit enough to walk through it.
