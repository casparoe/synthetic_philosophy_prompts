      *   **Core Concept:** Cause and effect are not intrinsic; God recreates the universe at every moment. Fire doesn't burn cotton; God creates burning alongside cotton. Miracles happen when God breaks the "habit."
      *   **Setting:** A world where this is objectively true (not just believed, but *happening*).
      *   **Tone/Constraint:** Not generic fantasy/magic. Needs to explore the *philosophical/psychological implications*. How does this affect trust, planning, science, and daily life?
      *   **Format:** Short story.

  2.  **Deconstruct the Implications of Occasionalism:**
      *   *Predictability:* If gravity is just a habit, it might stop. If bread nourishes, it might poison tomorrow.
      *   *Science:* Empiricism becomes risky. You can't say "A causes B," only "A has been followed by B so far." Science becomes the study of Divine Habits (Sunnat Allah), not natural laws.
      *   *Psychology:* Anxiety vs. Surrender (Tawakkul). Constant vigilance or total reliance on the Will.
      *   *Social:* Contracts, promises, and physics are all equally contingent.

  3.  **Brainstorming the Narrative:**
      *   *Protagonist:* Needs to be someone who relies on cause and effect. An engineer? A baker? A scientist? Let's go with a "Habit-Watcher" or someone trying to build something reliable. Maybe a clockmaker? No, clocks imply mechanics. A builder? A bridge builder. If the stone doesn't hold weight, people die.
      *   *Conflict:* The tension between the *need* to act as if causes exist and the *knowledge* that they don't.
      *   *Setting the Scene:* A marketplace or a construction site. Let's try a laboratory/observatory setting where they track the "Consistency."
      *   *The "Magic" Element:* It shouldn't be spells. It should be "Interruptions." A cup of water suddenly turning to honey. A step landing on air.
      *   *The Al-Ghazali Connection:* The story should reflect the theological nuance. It's not chaos; it's *habit*. God is consistent, but not bound.

  4.  **Developing the Plot:**
      *   *Character:* Yasmin. She's an archivist of Habits.
      *   *Inciting Incident:* A minor "break" in habit. Something small. A flame that doesn't heat.
      *   *Rising Action:* She tries to plan a journey or a construction. She has to prepare for the possibility that physics won't hold.
      *   *Climax:* A moment of reliance. She has to trust the Habit, knowing it could fail.
      *   *Resolution:* Acceptance of the uncertainty. Not fear, but a specific kind of faith.

  5.  **Drafting - Scene by Scene:**
      *   *Scene 1: The Morning Ritual.* Establish the world. Lighting a lamp. The prayer that acknowledges the contingency. "If He wills it burns."
      *   *Scene 2: The Work.* Yasmin is testing materials. Not for strength, but for *willingness*. She's not an engineer; she's a theologian of matter.
      *   *Scene 3: The Disruption.* A colleague experiences a "Break." Water doesn't quench thirst. It highlights the danger.
      *   *Scene 4: The Philosophy.* Discussion about Al-Ghazali (or a fictionalized equivalent). The difference between "Law" and "Custom."
      *   *Scene 5: The Journey/Task.* She needs to cross a bridge. The ultimate test of gravity's habit.
      *   *Scene 6: The Ending.* She crosses. It holds. But the victory isn't the crossing; it's the lack of surprise.

