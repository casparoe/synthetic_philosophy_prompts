prompt: |-
  ok so in my philosophy elective we did a unit on medieval islamic philosophy and we got to this guy al-ghazali, who apparently believed something called occasionalism — like fire doesn't actually cause cotton to burn, it's really God doing it fresh every single time, and it only looks like cause and effect because that's just God's normal habit/custom, but it doesnt have to keep going that way (which is supposedly why miracles can happen, like abraham not burning up in that fire). ngl this kinda broke my brain a little. could you write me a short story set in a world where this is actually true, where the laws of nature are really just habits that could stop working at any second? i dont want it to just turn into a generic magic-exists fantasy story tho, i want it to actually sit with the weird philosophical part, like what that would do to how people trust cause and effect, plan for stuff, or even do science at all
