          *   *Horn 2 (Indeterministic Sign):* If the sign doesn't guarantee the action, Jones could have chosen otherwise *before* the intervention kicked in. So PAP holds (there *was* an AP, however brief).
          *   *Verdict:* This is widely considered the strongest technical objection to Frankfurt cases. Owen is on solid ground here.
      *   **Maya's Point 3 (The "Flicker" Strategy/Robustness):** This appeals to the "Flicker of Freedom" debate. Even if there's a tiny AP (e.g., "choosing on my own" vs. "being made to choose"), is it *morally significant*? Many argue responsibility requires *robust* APs (the ability to avoid the *blame*, not just avoid the *action*). If the only AP is "doing it freely vs. doing it unfreely," but the outcome is the same, is that enough to ground PAP?
          *   *Verdict:* This is a sophisticated move. It concedes there are *some* APs but denies they are the *right kind* to ground responsibility. It shifts the debate from PAP to the "Principle of Robust Alternative Possibilities" (PRAP).
      *   **Owen's Point 4 (The Bait and Switch):** Owen argues Frankfurt claimed to kill PAP *simpliciter*, not a qualified version. If Maya has to add "robust," she admits Frankfurt didn't strictly refute PAP, only a specific *version* of it.
