answer: |-
  This is a fantastic summary of a classic debate. You've captured the dialectic almost perfectly: Maya is defending the **Frankfurtian Compatibilist** (or Semi-compatibilist) line, while Owen is deploying the **Dilemma Defense** (often associated with Robert Kane and David Widerker).

  The reason you're flip-flopping is that this specific argument is one of the most technical, seesawing battles in modern metaphysics. Neither side has a "knockout," which is why your classmates didn't resolve it in the hallway.

  Here is a move-by-move breakdown of who has the better of the exchange, followed by the hidden assumption they're both missing.

  ---

  ### Move 1: Maya's Opening (The Actual Sequence)
  **Claim:** The device never fires. Jones's actual decision-making process is normal. Therefore, the fact that he *couldn't* have done otherwise is irrelevant to his responsibility.
  **Verdict:** **Maya wins on intuition, but Owen wins on logic.**

  *   **Why Maya is strong:** This is the core intuitive punch of Frankfurt's paper. It appeals to our gut feeling that responsibility depends on *how* the action actually happened (the "actual sequence"), not on what *might* have happened in a different scenario. If I choose to donate to charity, and a genie was waiting to force me to do it if I hesitated, but I didn't hesitate... surely I still deserve credit? That intuition is very hard to shake.
  *   **Why Owen can attack it:** While intuitive, this move assumes the case is *possible* as described. It glosses over *how* Black knows what Jones is going to do. Maya is treating the "prior sign" as a magic black box. She wins the "common sense" round, but she hasn't yet addressed the metaphysical mechanics required to make the case work.

  ### Move 2: Owen's Dilemma (The Prior Sign)
  **Claim:** The "prior sign" creates a dilemma. If it guarantees the action, the case is deterministic (which libertarians reject anyway). If it doesn't guarantee the action, Jones *could* have done otherwise before the device intervened.
  **Verdict:** **Owen wins this round decisively.**

  *   **Why Owen is right:** This is the standard "Dilemma Defense" in the literature, and it is widely considered the strongest objection to Frankfurt cases.
      *   **Horn A (Determinism):** If the sign is a perfect predictor, there must be a causal chain leading to it. That means Jones's choice is determined by prior states. If Jones is a libertarian (who believes responsibility requires indeterminism), he will say Jones isn't responsible *because of the determinism*, not because of the device. Frankfurt hasn't changed the libertarian's mind; he's just begged the question.
      *   **Horn B (Indeterminism):** If the sign isn't a perfect predictor (it's just a probabilistic indicator), then right up until the moment of intervention, Jones *could* have chosen differently. The device would have intervened, yes, but for a split second, the alternative possibility existed. Therefore, PAP (Principle of Alternative Possibilities) is technically true: there *was* an alternative possibility, even if it was fleeting.
  *   **Why Maya struggles here:** She has no answer to the mechanics. Owen has shown that you can't construct the case without smuggling in either determinism or a fleeting alternative possibility.

  ### Move 3: Maya's Counter (The "Flicker" & Robustness)
  **Claim:** Sure, there's a tiny "flicker" of an alternative possibility on Horn B, but it's not *robust*. Jones couldn't have avoided the *outcome* or the *blame*. If PAP requires a "usable" alternative, Frankfurt still wins.
  **Verdict:** **Maya regains the ground, but at a cost.**

  *   **Why Maya is strong:** She is invoking what's called the **"Robustness Requirement."** Many philosophers agree with her here: what matters for responsibility isn't just having *any* alternative (like "I could have sneezed instead"), but having an alternative that allows you to avoid moral blame. In the Frankfurt case, the only alternative is "doing A on my own" vs. "being forced to do A." In both cases, A happens, and in both cases, Jones is arguably blameworthy. So, the alternative doesn't *exempt* him from responsibility.
  *   **The Cost:** To make this move, Maya has to change the definition of PAP. She is no longer defending "Responsibility requires *any* alternative possibility." She is now defending "Responsibility requires a *robust* alternative possibility." This is a modification of the original principle.

  ### Move 4: Owen's Reply (The Bait and Switch)
  **Claim:** Frankfurt claimed to kill PAP *simpliciter* (full stop). By adding "robust," you've admitted Frankfurt didn't kill PAP, he only killed a specific, stronger version of it.
  **Verdict:** **Owen wins on strict logic; Maya wins on philosophical progress.**

  *   **Why Owen is right:** Logically, Owen is correct. Frankfurt's paper is famous because it claims to show that *alternative possibilities are unnecessary*. If Maya admits, "Well, you need *some* alternatives, just not *useful* ones," she has conceded that alternatives *are* necessary. She has saved "Responsibility" but sacrificed the strict falsification of PAP.
  *   **Why Maya isn't totally wrong:** In philosophy, principles often get refined. If the only version of PAP that survives is one that requires "robust" alternatives, and Frankfurt cases show we don't have *those*, then the *spirit* of Frankfurt's argument stands. However, Owen is right to call her out: the headline "Frankfurt proves we don't need alternative possibilities" is false if we need *robust* ones.
  *   **Summary of the Exchange:** Owen successfully showed that Frankfurt cases don't eliminate *all* alternatives (the "flicker" remains). Maya successfully argued that the remaining alternatives don't *matter* for responsibility. Owen wins the logical point; Maya wins the practical implication.

  ---

  ### Part 5: The Hidden Assumption (Sourcehood vs. Leeway)

  There is a deeper assumption underlying both Maya and Owen's debate that neither of them questioned. They are both assuming that the battle is about **Alternative Possibilities (Leeway)**.

  **The Hidden Assumption:** They assume that if Incompatibilism (the view that determinism kills responsibility) is true, it must be true *because* determinism removes alternative possibilities.

  **Why this matters:**
  There is a rival view called **Source Incompatibilism**. Source Incompatibilists argue that what matters for responsibility isn't whether you *could have done otherwise* (Leeway), but whether you are the **ultimate source** of your action.

  *   **The Critique:** Even if Maya wins and proves we don't need alternative possibilities, Owen's "Horn 1" (Determinism) still looms. If the "prior sign" is determined by the past + laws of nature, Jones is not the *ultimate source* of his action, even if he acts freely in the moment.
  *   **The Blind Spot:** Both Maya and Owen are fighting over whether APs are necessary. But a Source Incompatibilist would say: *"You're both missing the point. Even if Frankfurt proves APs aren't needed, Jones still isn't responsible in the deterministic version of the case because he isn't the ultimate originator of his will."*

  **Conclusion for your seminar:**
  If you want to contribute to the discussion, you don't need to pick Maya or Owen. You can point out that their debate presupposes that **PAP is the only threat to responsibility.** You can suggest that even if Frankfurt defeats PAP (Maya's goal), he hasn't necessarily defeated Incompatibilism, because the real worry might be about **Causal Determinism** and **Ultimate Sourcehood**, not just alternative possibilities.

  **In short:** Owen is right that the case is technically flawed (the Dilemma). Maya is right that the flaw might not matter for responsibility (Robustness). But both might be fighting a war that Source Incompatibilists already moved past.
