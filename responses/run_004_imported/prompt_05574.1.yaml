      *   *Alternative:* **The assumption that thought experiments can settle metaphysical disputes.** (A bit too meta).
      *   *Selected Assumption:* **The assumption that "Responsibility" is univocal.** They are arguing about "Moral Responsibility" as if it's one thing. But maybe it splits into "Attributability," "Accountability," and "Eligibility for Blame."
      *   *Let's go with the "Flicker" assumption.* Both assume that if there is *any* AP, PAP is saved (Owen) or if the AP isn't *robust*, PAP is dead (Maya). The hidden assumption is that **we agree on what kind of APs PAP requires.** The debate reveals they don't.
      *   *Actually, the most insightful one:* **The assumption that the "Actual Sequence" is pristine.** Owen challenges this (if the sign is deterministic, the actual sequence is determined). Maya defends it. But both assume the *device* is the only threat. What if the *sign* itself undermines freedom?
      *   *Let's settle on:* **The assumption that the "Prior Sign" is distinct from the "Choice."** If the sign is part of the choice process, the dilemma dissolves or changes.

      *   *Refining Point 5:* I think the best "hidden assumption" is that **Moral Responsibility is solely a function of the agent's internal state at the moment of action.** Both ignore the broader context of *why* the sign exists. Or, more pointedly: **They assume the "Principle of Alternative Possibilities" is the only thing worth fighting over.** Many incompatibilists have moved to the "Principle of Ultimate Responsibility" (Source Incompatibilism). If Jones is determined (Horn 1), he lacks *ultimate* responsibility, regardless of APs. So Frankfurt misses the real incompatibilist worry. This is a very strong point for a seminar student.

