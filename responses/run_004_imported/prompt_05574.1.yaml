      *   *Actually, the strongest shared assumption:* **The "Actual Sequence" vs. "Alternative Sequence" distinction itself.** Both assume we can neatly separate what actually happened from what *could* have happened. But some (like semicompatibilists or source incompatibilists) might argue the *source* is all that matters, making the AP debate irrelevant (which Maya hints at), OR that the *sign* itself undermines sourcehood (which Owen hints at).
      *   *Let's go with the "Robustness" assumption.* Both assume that if an AP exists, it must be *robust* to matter. But maybe the *mere existence* of an AP is what matters for libertarianism, regardless of robustness.
