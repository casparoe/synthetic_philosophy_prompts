      *   **Maya's Point 1 (The Standard View):** This is the core intuition pump. The actual sequence is normal. The counterfactual intervener is causally inert in the actual sequence. *Verdict:* Strong intuitive start, but vulnerable to the dilemma.
      *   **Owen's Point 2 (The Dilemma):** This is the classic "Widerker/Kane" objection.
