answer: |-
  The schism between William Lloyd Garrison and Frederick Douglass in 1851 was not merely a disagreement over tactics; it was a hermeneutic crisis. At stake was the fundamental question of how a legal text acquires meaning. For Garrison, the Constitution was a "covenant with death" because its *intent* and *effect* were to secure the interests of slaveholders. For the mature Douglass, influenced by the legal theorist Lysander Spooner, the Constitution was a "glorious liberty document" because its *text* and *enumerated powers* contained no sanction for human property. This debate anticipates the modern friction between originalism and textualism, but in the antebellum context, it was a matter of life and death. To determine which reading holds water, one must examine the specific compromise clauses that Garrison deemed proof of sin and Douglass deemed proof of silence.

  The Garrisonian position rests on a theory of contextual originalism. Garrison argued that legal documents cannot be divorced from the political reality of their ratification. In 1787, the euphemisms of the Constitution were transparent. When Article I, Section 2 mandated that representation be calculated by adding "the whole Number of free Persons" to "three fifths of all other Persons," every framer knew "other Persons" meant enslaved Africans. To Garrison, the absence of the word "slave" was not a legal loophole but a moral cowardice—a way to avoid staining the text with the reality of the institution while simultaneously protecting it.

  This argument is strongest regarding the Importation Clause (Article I, Section 9), which prohibited Congress from banning the "Migration or Importation of such Persons as any of the States now existing shall think proper to admit" until 1808. Garrisonians argued that this was a explicit federal shield for the slave trade for twenty years. By forbidding interference, the Constitution actively protected the traffic in human beings. Furthermore, the Fugitive Slave Clause (Article IV, Section 2), which mandated that "Person held to Service or Labour in one State... shall be delivered up," created a federal obligation to return escapees. For Garrison, the text did not need to say "slave" for the meaning to be binding; the context supplied the definition. To interpret these clauses as anything other than protections for slavery was, in the Garrisonian view, a willful blindness to the compact the North had signed.

  Douglass's mature counter-argument relies on a strict constructionist textualism combined with the doctrine of enumerated powers. He contended that the Constitution creates a government of limited authority; it can only do what the text explicitly says. Nowhere does the text grant the federal government the power to establish or maintain slavery. Therefore, slavery remained a creature of state law, with no standing in federal court.

  Regarding the specific clauses, Douglass argued that the text must be read according to its plain language, not the secret intentions of the framers. On the Three-Fifths Clause, Douglass argued it was a penalty against the South, not a bonus. By counting enslaved people as less than whole persons for representation, the Constitution reduced the political power of slave states compared to if they had counted them as whole persons (which they wanted) or zero (which abolitionists might have preferred). It was a compromise that acknowledged the *existence* of black people without acknowledging their *status* as property.

  On the Importation Clause, Douglass turned Garrison's timeline against him. The clause did not protect the trade indefinitely; it set an expiration date. By 1808, the text *required* that Congress be able to ban the trade. Thus, the clause was not a protection of slavery but a temporary restraint on federal power to end it. Douglass argued that the text's silence on "slavery" was deliberate and legalistic: if the word is not there, the power is not granted. The federal government had no constitutional authority to pass a Fugitive Slave Act because the Constitution did not give Congress the power to legislate on the capture of "Persons held to Service"; it merely directed that they be delivered up according to state claims.

  The crux of the debate, and the weakest point in Douglass's armor, is the Fugitive Slave Clause. This is where the Garrisonian reading feels most visceral. The clause mandates delivery. If a human being escapes a state where they are held by force, and the Constitution says they must be returned, the federal compact is enforcing slavery. Douglass struggled with this. In his 1860 speech "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?", he argued that the clause applied to indentured servants and apprentices, not chattel slaves, because the Constitution recognized only "persons," and chattel law recognized only "things." A slave, being property, could not be a "Person held to Service."

  This is the point where Douglass's textualism strains against credulity. It is difficult to argue that the "original public meaning" of "Person held to Service" in 1787 included indentured servants but excluded the millions of enslaved people whose labor was the economic engine of the union. Here, the Garrisonian objection is formidable: Douglass is engaging in wishful advocacy, dressing up a moral desire as legal exegesis. If the text commands the return of a person, and the state defines that person as a slave, the federal Constitution compels the return of a slave. To deny this is to deny the political reality that the Constitution was designed to preserve the Union, even at the cost of moral compromise.

  However, to accept the Garrisonian verdict is to accept a constitutional theory that privileges extra-textual intent over the written grant of power. If we adjudicate this based on the rules of constitutional law rather than historical sociology, Douglass's position is the more rigorous one.

  The objection to Douglass—that he ignores the "original public meaning"—fails to account for the nature of a constitutional republic. A constitution is not a diary of the framers' thoughts; it is a charter of authority. If the framers wished to grant the federal government the power to property in man, they needed to write it down. They did not. By relying on euphemisms, they left the federal government without the explicit statutory authority to support slavery. Douglass correctly identified that the Constitution creates a "freedom national, slavery local" framework. The federal government has no police power to hunt fugitives; that power resides with the states. The federal obligation is merely to respect state comity, but without federal legislation enforcing it (like the Fugitive Slave Acts of 1793 and 1850), the clause is non-self-executing. Douglass's argument exposes that the pro-slavery federal apparatus was not a requirement of the Constitution, but a legislative usurpation.

  Therefore, the verdict must favor Douglass, though with a critical qualification. Garrison was historically correct: the *political compact* of 1787 was pro-slavery. The framers intended to protect the institution, and the euphemisms were a knowingly deceptive shield. On the question of historical intent, Garrison wins. But on the question of *constitutional interpretation*, Douglass wins.

  A legal document must be judged by what it empowers the government to do, not by what the authors hoped it would protect. Douglass's reading is superior because it treats the Constitution as a living grant of limited powers rather than a static ratification of the status quo. His interpretation of the Importation and Three-Fifths clauses is legally sound: the text limits federal protection of slavery. His reading of the Fugitive Clause is legally clever, if historically optimistic, by shifting the enforcement burden to the states. Ultimately, Douglass's textualism offers a path to liberation within the law, whereas Garrison's originalism offers only the moral purity of disunion. In a constitutional democracy, the interpretation that allows for the expansion of liberty through the text itself must prevail over the interpretation that binds the present to the compromised intentions of the past. Douglass was right: the words on the page, stripped of the framers' cowardice, belonged to the free.
