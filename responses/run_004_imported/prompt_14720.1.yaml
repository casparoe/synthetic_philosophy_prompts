prompt: |-
  My mother died three weeks ago, and the eulogy has fallen to me, mostly because I'm the one in the family who writes for a living. I've realized this week that novel-writing has trained exactly the wrong instincts for the job: my usual craft is making a life cohere into a satisfying shape, which is precisely what she spent her career refusing to do to other people's copy. She ran the fact-checking desk at a regional newspaper for thirty-one years, and sometime in her sixties she became a quiet but serious reader of Hannah Arendt -- not the banality-of-evil book everyone half-remembers, but the essays specifically about lying in politics, "Truth and Politics" and the Pentagon Papers piece. She liked to point out, usually at the worst possible moment at a family dinner, that a fact is not the same kind of thing as an opinion, and that nobody at the table was entitled to a personal view of what had actually happened.

  That habit is now my problem. A eulogy is, structurally, almost exactly the operation Arendt distrusted: it takes a contingent, could-have-gone-differently life and quietly edits it into something more consoling and more usable, the way a comfortable story can replace an inconvenient fact once everyone involved would rather agree on it. My mother's argument, borrowed from Arendt, was that facts survive only because stubborn, often unlikeable people insist on them past the point of social convenience, and that the very imagination that lets us lie is also what lets us act and change the world, which is exactly why truth needs defenders who have no interest in changing anything. I don't think I can honestly deliver this eulogy if its comfort depends on doing to her memory the thing she gave her working life to preventing. Complicating things, most of the room will be neighbors and cousins who have never heard of Arendt and shouldn't have to sit through a lecture on her; four or five of her former colleagues from the copydesk will absolutely notice if I cheat.

  Please write the eulogy: five to seven minutes, genuinely comforting to people who are simply grieving an aunt or a neighbor, but constructed so that its comfort comes from precision about who she actually was, edges included, rather than from softening her. Let it find a natural, unforced way for the copydesk contingent to recognize her real convictions about facts, lying, and politics, without turning any part of it into exposition for everyone else.
reasoning: |-
  Here's a thinking process that leads to the eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** A writer (novelist) whose mother died three weeks ago.
      *   **Subject:** The mother, a fact-checker/copy desk editor for 31 years at a regional newspaper.
      *   **Key Character Trait:** Obsessed with truth, facts vs. opinions, influenced by Hannah Arendt (specifically "Truth and Politics"). She was stubborn, precise, and often inconvenient at dinner tables.
      *   **The Conflict:** Eulogies naturally smooth over rough edges to create a comforting narrative (fiction-making). The mother spent her life fighting against this kind of falsification. The speaker feels writing a "comforting" eulogy betrays her.
      *   **Audience:** Mixed. Neighbors/cousins (need comfort, don't know Arendt) + Former colleagues (know her work, will spot insincerity).
      *   **Goal:** A 5-7 minute eulogy (approx. 750-1000 words spoken at a moderate pace). It must be comforting *through* precision, not softening. It must acknowledge her convictions without lecturing.
      *   **Tone:** Honest, precise, warm but unsentimental, respectful of her intellect.

  2.  **Deconstruct the Mother's Philosophy:**
      *   Facts are stubborn things.
      *   Opinions don't change facts.
      *   Storytelling (cohering a life) can be a form of lying if it ignores the messy reality.
      *   Comfort shouldn't come from falsehoods.
      *   She was difficult at times (dinner table arguments), but that difficulty was a virtue.

  3.  **Determine the Structure:**
      *   **Opening:** Acknowledge the irony. The writer child is speaking about the fact-checker mother.
      *   **Middle (The Work):** Describe her job not as "fixing commas" but as "guarding reality." Show, don't tell, the Arendt connection.
      *   **Middle (The Home):** How her professional rigor bled into family life (the dinner table moments). Reframe these not as annoyances but as acts of love/care.
      *   **Climax/Turning Point:** Addressing the nature of eulogies. Admitting the temptation to lie. Choosing not to.
      *   **Closing:** A specific, factual memory or statement that honors her demand for truth. A goodbye that doesn't pretend she's "in a better place" but that she *was* here, precisely.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Start with the assignment. I write fiction; she checked facts. It's a conflict.
      *   *The Job:* 31 years. Regional paper. It wasn't just grammar. It was about what *happened*.
      *   *The Philosophy (Subtle Arendt):* Don't name-drop Arendt explicitly for the cousins, but use the language. "Facts are not opinions." The colleagues will hear the echo; the neighbors will hear a strong woman.
      *   *The Dinner Table:* The "worst possible moment" corrections. Reframe this. She didn't do it to be mean; she did it because reality matters.
      *   *The Eulogy Problem:* Acknowledge the prompt's meta-conflict. A eulogy tries to make a life look like a story. She hated that. So, I won't make her life a neat story.
      *   *The Comfort:* Where is the comfort? In knowing she was real. In knowing we were loved by someone who saw us clearly, not through a haze of sentiment.
      *   *Ending:* A factual statement. She existed. She worked. She was here.

  5.  **Refining the Voice:**
      *   Needs to sound like a writer, but a writer trying to stop writing "like a writer."
      *   Avoid clichés ("gone but not forgotten," "angel on her shoulder").
      *   Use concrete details (red pen, the sound of the keyboard, the specific look she gave).
      *   *Self-Correction during drafting:* I initially thought about quoting Arendt. *No.* The prompt says "without turning any part of it into exposition." The colleagues will know the reference if I use the *concepts*. The neighbors just need to feel the weight of her integrity.
      *   *Focus on "Precision as Love":* This is the key to making it comforting. She corrected you because she respected you enough to tell you the truth.

  6.  **Drafting - specific lines:**
      *   "My job is to make things up. Her job was to make sure I didn't."
      *   "She didn't believe in 'your truth'."
      *   "To smooth her edges would be to lie about her."
      *   "She is not at peace. She is gone. There is a difference." (Maybe too harsh? Soften slightly but keep the edge.) -> "She is not everywhere. She is in the specific places she was."

  7.  **Review against Constraints:**
      *   5-7 minutes? (Word count check: ~800-900 words is usually safe for 5-7 mins depending on pacing. I'll aim for around 900 to allow for pauses.)
      *   Comforting to neighbors? Yes, by emphasizing her care and reliability.
      *   Recognizable to colleagues? Yes, by referencing the "fact vs. opinion" stance and the refusal to soften copy.
      *   No exposition? Yes, weave the philosophy into the memory.

  8.  **Final Polish:** Check the rhythm. Ensure the transition from the "dinner table annoyance" to "moral stance" feels earned. Make sure the ending lands on a note of solid ground, not airy transcendence. (The idea of "stubborn facts" as a foundation for grief is strong).

  *(Self-Correction during final review)*: Make sure I don't sound *too* cold. The prompt asks for "genuinely comforting." The comfort comes from reliability. She was a solid ground. That is comforting. I need to emphasize that her rigor was a form of safety for the family.

  9.  **Final Word Count Check:** Aiming for roughly 900 words.

  *(Drafting the content based on these thoughts...)*
answer: |-
  Thank you for being here.

  I am a writer of fiction. My mother was a verifier of fact. For thirty-one years, she ran the copy desk at the *Gazette*, which meant that while I was paid to imagine worlds that didn't exist, she was paid to ensure that the names, dates, and coordinates of the world that *did* exist were correct.

  Standing here, I am aware of the professional hazard I face. A eulogy is a genre with specific expectations. It asks for a narrative arc. It asks me to take seventy-odd years of contingent, messy, contradictory human behavior and edit it into a shape that offers you closure. It asks me to make her life cohere.

  If I did that, I would be lying. And if there was one thing my mother taught this family, it is that a lie is not a comfort, even a kind one.

  We all know she was precise. Some of you remember her as the aunt who would gently correct your timeline of events at Thanksgiving. "Actually, that was 1998, not 1999," or, "He didn't say that, he said this." I know that in the moment, it could feel like a rebuke. I know that sometimes, we just wanted to be heard, not fact-checked.

  But I have come to understand that this wasn't pedantry. It was a form of care.

  She believed that reality is fragile. She believed that when we allow facts to become flexible, when we let our opinions overwrite what actually happened, we lose the ground we stand on. She read philosophy in her sixties, specifically about the nature of truth in public life, and she brought those hard questions to our kitchen table. She insisted that facts are not democratic. You don't get to vote on what happened. You don't get to have your own private version of reality.

  She held that line because she wanted us to be safe. If we cannot agree on what is true, she argued, we cannot protect each other. Her corrections were her way of keeping us tethered to the same world.

  To her colleagues: You know better than anyone that she did not believe in "killing your darlings" if the darling was a lie. She knew that the truth is often inconvenient, often ugly, and rarely fits the headline. She defended it anyway. She understood that the imagination is a powerful tool, which is exactly why it must not be used to rewrite the record.

  To the rest of you, her neighbors and cousins: You knew her as the woman who brought casseroles that were exactly the right temperature, who remembered your children's middle names, who showed up when she said she would. This was not separate from her work. It was the same discipline. She loved you with the same rigor she applied to the news. She did not love a fantasy version of you; she loved *you*. She saw you clearly, without sentimentality, and she chose you anyway.

  There is a temptation, in grief, to say that she is "at peace" now, or that she is "watching over us." I know those words are meant to soothe. But my mother would ask me: Is that true?

  She is not watching over us. She is gone. The world is objectively different today than it was three weeks ago because she is not in it. That is a hard fact. It is a heavy fact. But I think she would want us to have it.

  Comfort, in her view, should not come from a story we tell ourselves to feel better. Comfort should come from the reliability of what remains.

  What remains is the standard she set. What remains is the knowledge that for thirty-one years, in a world that was constantly rushing to print, constantly eager to simplify, there was one desk where someone refused to let the error stand. There was one person who insisted that what happened matters.

  We are grieving her. That is a fact. We miss her. That is a fact. The hole she left is specific, and it has edges. I am not going to try to fill it with soft words. I am going to let you feel the shape of it.

  Because that shape is proof that she was here.

  She was not a saint. She was stubborn. She could be difficult. She would rather be right than be liked, because she believed that being liked is temporary, but being right—being accurate—is how we build a life that lasts.

  So, I will not tell you that everything happens for a reason. I will not tell you that she is in a better place. I will tell you that she was here. She worked. She checked. She cared. She loved us enough to tell us the truth, even when the truth was that we were mistaken.

  That is a rare thing. To be loved by someone who refuses to lie to you is the safest a human being can ever be.

  We are less safe now. But we are not without resources. We have the example she left. We have the habit of checking. We have the obligation to be precise with each other, to honor the actual history of this family, and to refuse the easy story when the hard fact is available.

  If you want to honor her, do not speak of her in generalities. Do not say she was "wonderful." Tell the truth about her. Remember the time she drove three hours to help you move. Remember the time she argued with you about the date of the election and turned out to be correct. Remember the red pen. Remember the silence when she was reading. Remember the specific weight of her hand on your shoulder.

  Keep those facts. Guard them. Do not let them soften with time.

  She spent her life making sure the record was accurate. The least we can do, the only thing we can do that she would respect, is to ensure that her memory is treated with the same integrity.

  She was my mother. She was exact. She was here. And that has to be enough.

  Thank you.
