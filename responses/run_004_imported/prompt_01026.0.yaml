          *   Character B (Gauthier/McClennen-esque): Argues rational agents can bind future selves; re-examining the choice tomorrow is the error.
      *   **Key Requirement:** Each must press the other on their weakest point (A: Why doesn't a sincere feeling count? B: Why isn't this just "whatever gets paid is rational"?).
      *   **Ending:** Stroke of midnight. No resolution on who gets the money.

  2.  **Character Conception:**
      *   **Character A (The Skeptic/Intentionalist):** Let's call him *Elias*. He's analytical, perhaps a bit weary, focused on the definition of intention and the timeline of incentives. He represents Kavka's view that intention requires a belief in future action, which is irrational here.
      *   **Character B (The Disposition/Resolutist):** Let's call her *Mara*. She's pragmatic but theoretically grounded, focused on rationality as a disposition over time, not just moment-to-step maximization. She represents Gauthier's constrained maximization or McClennen's resolute choice.

  3.  **Setting the Scene:**
      *   Cold night, outside a gated estate. A clock tower or visible timer adds tension.
      *   The pressure of the deadline (midnight) mirrors the puzzle's constraint.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Establish the stakes and the deadline. Introduce the core conflict immediately.
      *   **Round 1: The Core Argument.**
          *   Elias: You can't intend to do something you know you won't do. Tomorrow, the money is already there (or not). Drinking is just pain.
          *   Mara: Rationality isn't just about tomorrow afternoon. It's about the plan *now*. If you plan to drink, you get rich. If you plan not to, you don't.
      *   **Round 2: Pressing the Weak Points (Crucial Step).**
          *   *Elias's Weak Point:* Why can't I just lie to myself? Why isn't a "sincere feeling" enough?
          *   *Mara's Weak Point:* Isn't this just magic? If I decide to jump off a cliff for money, is that rational too? Where's the limit?
      *   **Round 3: Deepening the Philosophy.**
          *   Elias needs to explain the link between intention and belief. To intend $X$, I must believe I will do $X$. But I know I won't do $X$ because it's irrational tomorrow. Therefore, I can't believe I will do $X$. Therefore, I can't intend $X$.
          *   Mara needs to explain *resolute choice*. It's not about ignoring reasons, it's about weighting the *capacity to commit* as a valuable trait. It's about being the *kind* of agent who keeps plans.
      *   **Closing:** The clock strikes. Ambiguity remains.

  5.  **Refining the Dialogue (Self-Correction during drafting):**
      *   *Check:* Did I make Elias too dismissive? He needs to acknowledge the temptation but stand firm on the logic.
      *   *Check:* Did I make Mara too hand-wavy? She needs to address the "magic" accusation. It's not magic; it's a different model of agency.
      *   *Check:* Is the "weakest point" requirement met?
          *   Elias must address: "Can't I just psych myself up?"
          *   Mara must address: "Doesn't this make rationality mean whatever wins?"
      *   *Tone:* Keep it intellectual but tense. They are strangers, but bonded by the absurdity of the situation.

  6.  **Writing - Specific Lines & Beats:**
      *   *Elias:* "Intention isn't a wish. It's a prediction you make about yourself."
      *   *Mara:* "If you treat your future self as a stranger who can renegotiate, you're already poor."
      *   *The Clock:* Use it to punctuate the end.

  7.  **Final Polish:**
      *   Ensure the philosophical distinctions (Kavka vs. Gauthier/McClennen) are accurate but woven naturally into speech.
      *   Kavka's point: Intention requires belief in performance. Performance is irrational ex-post. Therefore belief is impossible. Therefore intention is impossible.
      *   Gauthier/McClennen point: Rationality applies to the *selection of dispositions* or *plans*, not just individual acts. A resolute chooser sticks to the plan even if the local calculus changes.

  8.  **Final Review against constraints:**
