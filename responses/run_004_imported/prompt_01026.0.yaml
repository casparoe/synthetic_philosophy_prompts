answer: |-
  The iron gates of the estate loomed black against the night sky. A digital clock mounted on the security post glowed red: 11:58 PM. Two figures stood under the single amber streetlamp, collars turned up against the chill.

  **Elias** checked his watch, then the clock, then his watch again. "Ninety seconds. Enough time to realize you're wasting your breath."

  **Mara** didn't look at him. She was staring at the gate, hands deep in her coat pockets. "I'm not wasting it. I'm calibrating."

  "Calibrating?" Elias let out a short, sharp laugh. "You can't calibrate a lie. That's the point. The billionaire isn't asking if you *promise*. He has scanners, psychometrics, the works. He needs to know you *mean* it. And you can't mean it."

  "Because I'm rational?"

  "Because you're clear-headed. Look, walk me through tomorrow afternoon. The money hits your account at 8:00 AM. Whether you drink the vial or pour it down the sink, the money is already there. The contract is fulfilled by the intention tonight. So, tomorrow afternoon, what reason do you have to drink?"

  "Pain," Mara said. "A day of vomiting. Zero benefit."

  "Exactly. So tomorrow, the rational choice is *don't drink*. You know that now. You know that future-you will look at the vial and see no reason to lift it. So, how can you sincerely intend tonight to do something you know you won't do? Intention requires a belief that you will act. If you know you won't act, you can't form the intention. The million dollars is a reward for a mental state that logic forbids."

  Mara turned to him then. Her eyes were bright, not with desperation, but with a kind of fierce calculation. "That logic assumes your future self is a stranger you can't control. It assumes rationality is just maximizing utility at every single discrete moment."

  "It is," Elias said. "That's what rationality *is*."

  "No," Mara countered. "That's what *myopia* is. If I treat tomorrow afternoon as a brand new decision point, open for re-negotiation, I'm admitting I have no agency over time. A rational agent chooses a *plan*, not just a move. I am choosing, right now, to be the kind of person who keeps commitments even when the local incentives shift. That disposition is worth a million dollars."

  "But you won't drink it tomorrow!" Elias pressed, stepping closer. "That's the physical reality. You're saying you intend to do X, while knowing you won't do X. That's not a plan, that's delusion. Come on, press the weak spot. Why isn't this just self-hypnosis? Why can't I just psych myself up right now, feel really sincere, tell myself 'I'm going to drink that,' and walk away with the cash?"

  Elias gestured at his own head. "If I can convince myself for five minutes, the scanner picks it up. I get the million. Tomorrow I change my mind. I lose a day to sickness, but I net 999,999 dollars of profit. Why doesn't the 'sincere feeling' work?"

  "Because it's not sincere if it's based on a strategy of abandonment," Mara said. "You're trying to trick the scanner. But more importantly, you're tricking yourself. If you know, deep down, that the intention is a sham to get the cash, the belief that you will drink isn't there. You can't believe you'll drink if you've already decided that drinking is irrational tomorrow. You're trying to hold two contradictory beliefs: 'I will drink' and 'I will not drink because it is irrational.' The scanner sees the conflict."

  "So I just suppress the second belief?"

  "Then you're irrational in the worst way. You're blind." Mara shook her head. "My point isn't to lie. It's to bind. I am deciding *now* that the calculation made tonight overrides the calculation made tomorrow. Tomorrow, when I look at the vial, I won't ask 'Is this useful?' I'll ask 'Did I commit to this?' And because I value being a resolute agent more than I value avoiding a day of nausea, I drink it. Not because it's useful tomorrow, but because it validates the rationality of the plan today."

  Elias rubbed his temples. "Okay, let's press your weak spot then. You say it's rational to bind yourself. Where does it stop? If the billionaire offered a million dollars to shoot yourself in the leg tomorrow, would you form the intention to do that? Is any action rational as long as it secures a prior reward? Doesn't your view collapse into 'whatever gets you paid counts as rational'? That makes the word meaningless."

  The clock ticked to 11:59 PM.

  Mara didn't flinch. "It's not about the action. It's about the *coherence* of the agency. Shooting my leg serves no long-term interest and destroys my capacity for future agency. Sticking to a plan to secure a million dollars enhances my agency. But here is the real distinction: I'm not saying I'll do *anything* for money. I'm saying that rationality isn't just about the act of drinking. It's about the act of *choosing to be a person who drinks*."

  "That's word salad," Elias snapped. "You're trying to magic away the fact that tomorrow, the reason to drink vanishes. You can't eat your cake and have it too. You can't say 'I'm rational because I commit' when the commitment requires acting against your own self-interest at the moment of action. If you drink tomorrow, you are, by definition, acting irrationally in that moment. So you're arguing that rationality requires acting irrationally."

  "I'm arguing that being rational *over a lifetime* requires sometimes ignoring the calculus of the *moment*," Mara said, her voice tightening. "If everyone knew they could renegotiate their plans whenever the wind changed, no one would ever make a deal. No one would trust a promise. By being the person who follows through even when the local incentive drops, I make myself a viable partner in any future contract. The million dollars is just the down payment on that reputation."

  "Reputation with who?" Elias threw his hands up. "It's a one-off puzzle! A billionaire in a vacuum! There's no future contract. There's just you and the vial. In a vacuum, your 'resolute choice' is just stubbornness. It's throwing away your well-being for a principle that has no cash value once the check clears."

  "The principle has cash value *tonight*," Mara said. "That's the only time it matters. The intention is the asset. The drinking is just the redemption."

  "The intention is impossible!" Elias insisted. "You can't intend what you know you won't execute. You're walking up to that gate hoping the scanner breaks."

  "And you're walking away hoping logic saves you from having to make a choice. But you've already chosen. You chose the moment you realized you wouldn't drink."

  The digital clock flickered. 11:59:50 PM.

  Elias looked at the gate, then at the vial in his hand, sealed in plastic. "I'd rather keep my mind than the money. At least I know why I'm doing what I'm doing."

  "And I'd rather have the money and a reason that holds across time, not just across an afternoon," Mara replied. She tightened her grip on her own vial. "Midnight isn't the deadline for the drinking, Elias. It's the deadline for who you are."

  "Then I guess we're different people."

  "Tomorrow," Mara said. "We'll see if we're still different tomorrow."

  The clock hit 11:59:59 PM. The amber light above the gate buzzed. Neither moved toward the intercom. Neither walked away. The red numbers rolled over to 12:00 AM, and the gate remained shut, waiting to see who would step forward, and who would be lying.
