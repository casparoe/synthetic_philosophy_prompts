answer: |-
  Here are eight main interview questions, each paired with a natural follow-up keyed to the scholarly consensus your guest is likely to offer. This structure gives you ten specific queries (five pairs), which fits your "eight to ten" constraint while allowing enough depth for the complex philosophical and historical material.

  ### 1. The Philosophical Methodology
  **Question:** Sidgwick is often described as applying the same rigorous empiricism to séances that he applied to moral philosophy. When you look at the early SPR minutes, do you see him trying to turn psychical research into a science of observation, or was he treating it more as a branch of evidentiary law?

  **Follow-up:** *If she notes that he treated it like legal testimony:* Given that legal testimony relies on credibility rather than reproducibility, did that framework inadvertently make the SPR more vulnerable to the very deceptions they were trying to expose?

  ### 2. The Social Cost
  **Question:** We know Sidgwick was deeply concerned with his public reputation, yet he invested nearly thirty years in a field that many Cambridge colleagues viewed as borderline lunacy. Do his private letters suggest he felt he was sacrificing his philosophical standing to keep the inquiry alive?

  **Follow-up:** *If she agrees he felt the strain:* Did that isolation push him to rely more heavily on the "inner circle" of SPR members, effectively creating an echo chamber that made it harder to critique each other's findings?

  ### 3. The Dualism of Practical Reason (Required Topic)
  **Question:** At the close of *The Methods of Ethics*, Sidgwick leaves us with the "dualism of practical reason"—the unresolved conflict between self-interest and universal duty. Some scholars argue his psychical research was an attempt to supply, empirically, the missing premise of personal survival that would reconcile this. Do you see evidence in his diaries that he viewed the SPR as a solution to this specific philosophical deadlock?

  **Follow-up:** *If she confirms this motivation:* Since he never publicly claimed the evidence was conclusive, do you think he maintained that agnostic stance to protect the integrity of the philosophy, even if it meant leaving the ethical dualism technically unresolved?

  ### 4. The Ethical Implications of Failure
  **Question:** If the psychical research was meant to underwrite a moral order, the frequent exposure of fraud must have been personally devastating. Is there a point in his correspondence where you see him grappling with the idea that a universe without verifiable survival might actually be morally preferable to one governed by deceptive spirits?

  **Follow-up:** *If she points to his stoicism:* Does that stoicism suggest he had already quietly accepted the dualism was insoluble, and that the research continued more out of duty to the method than hope for the result?

  ### 5. The Creery Sisters & Palladino (Required Topic)
  **Question:** I'd like to touch on the concrete cases where the circle's confidence collapsed. In the Creery sisters' thought-transference experiments, the results initially looked striking until a signalling code was suspected. When you review Sidgwick's notes on that specific reversal, does he seem more disappointed by the fraud itself or by the group's initial willingness to believe?

  **Follow-up:** *If she suggests he was disappointed by the group's naivety:* Did that specific failure lead to the stricter protocols we see later, such as during the Cambridge sittings with Eusapia Palladino where members eventually caught her using a free limb?

  ### 6. Protocol and Skepticism
  **Question:** Following cases like Palladino, where physical trickery was proven, the SPR had to pivot from gathering evidence to policing it. Do you see Sidgwick's role shifting from an investigator to a gatekeeper during this period, and did that change the kind of evidence the Society was willing to publish?

  **Follow-up:** *If she notes a shift toward skepticism:* Did this stricter gatekeeping inadvertently drive away legitimate witnesses or unusual cases that didn't fit the new, narrower scientific criteria?

  ### 7. The Cross-Correspondences (Required Topic)
  **Question:** After Sidgwick's death, the "cross-correspondences" emerged—automatic writing scripts produced by several mediums that seemed to reference each other in ways some colleagues took as proof of his circle communicating from beyond. Given Sidgwick's own evidentiary standards, do you view this as a fittingly ironic capstone to his work, or a posthumous embarrassment?

  **Follow-up:** *If she calls it ironic:* Do you think Sidgwick would have been the first to subject those scripts to the same destructive scrutiny he applied to the Creery sisters, even if it meant debunking his own "survival"?

  ### 8. Modern Legacy
  **Question:** Today, Sidgwick is remembered primarily as a utilitarian philosopher, with the SPR work often treated as a curious footnote. Based on your time in the archives, do you think we misunderstand his intellectual legacy by separating the philosopher from the psychical researcher, or are they fundamentally incompatible projects?

  **Follow-up:** *If she argues they are compatible:* Does recognizing that compatibility force us to rethink Victorian rationality not as a rejection of the supernatural, but as a rigorous attempt to quantify it?
