answer: |-
  Good evening. For those of you who don't know me, I'm a friend from Priya and Teo's PhD program. And for those of you who *do* know me, please don't worry—I have been strictly instructed to keep the tensor calculus to a minimum.

  I know about a third of this room is currently waiting for a punchline about general covariance, while the rest of you—the parents, the cousins, the wonderful friends from before graduate school—have heard the "Hole Argument" mentioned so many times it's basically the third wheel in this relationship. You know it's important, but you might not know that it's technically a problem about whether spacetime points have their own unique identities, or if they're just nodes in a web of relationships.

  So, let me try to bridge that gap, because understanding this disagreement is actually the key to understanding why they asked me to make one specific request on their behalf tonight.

  Priya and Teo met in a seminar on this very topic. For the experts here: Priya argues that spacetime points are real, but they have no identity apart from the roles they occupy. Teo argues that the Hole Argument proves those points were never real individuals to begin with. They have spent seven years disagreeing on the ontology of the universe.

  But for the rest of the room: Imagine you have a map of a city. Priya says the street corners are real, but they only matter because of where the roads go. Teo says the street corners aren't real at all; only the roads matter. They argue about the corners constantly. But they agree completely on how to drive the car.

  And that brings me to the request. They have asked that no one say their marriage is "meant to be," or "written in the stars." Now, usually, when a couple says that, it's humility. For Priya and Teo, it's metaphysics.

  To say a relationship is "written in the stars" implies that there is a pre-existing script, a destiny that identifies you as "soulmates" across all possible futures. In their field, that's called *haecceitism*—the idea that things have a primitive "this-ness" independent of what they actually do. Priya gave up haecceitism for spacetime points years ago; she's certainly not going to accept it for persons. And Teo doesn't believe there's an independent fabric of fact for a destiny to be written into.

  If I were to say you were "meant to be," I would be suggesting that your love is a discovery of something pre-existing. But your philosophy—and your life—suggests something much more robust.

  Here is the joke, and I promise it lands for everyone: The Hole Argument threatens to make the universe indeterminate. It suggests that without a strict rule of identity, the future could slide around the past like a sheet on a bed. Priya and Teo have spent their careers proving that the universe is stable *not* because it is destined, but because it is structured by the relations within it.

  Your marriage is the same. It isn't stable because fate glued you together. It's stable because you have built a metric field so robust that no diffeomorphism could shake it. You haven't found a destiny; you've constructed a reality.

  Teo, at your engagement, you joked about loving Priya "regardless of which diffeomorphism she turns out to be." Half the room laughed, and half the room nodded politely. But I think tonight we can all agree on what you meant. You meant that you love her not for some abstract label of "wife" or "soulmate" that exists in a vacuum, but for the specific, concrete, structural role she occupies in your life. And Priya, you love him not because he was "the one" in a cosmic sense, but because he is the one who stands in the right relation to you in *this* world, the actual world.

  There is a beautiful irony here. By rejecting the idea that you were "meant to be," you are actually making your commitment stronger. "Meant to be" is passive. It implies that if the stars aligned, you'd stay together even if you stopped trying. But your view? Your view requires work. It requires that you continue to define the points of your marriage by the work you put into the roads between you.

  So, I will not say that this was written in the stars. The stars are just gas, and spacetime is just a manifold.

  Instead, I will say this: In a universe where identity is fragile and the future is technically underdetermined, you have chosen to fix the metric of your lives together. You have agreed that the only reality that matters is the one you build, day by day, interaction by interaction.

  To Priya and Teo: May your structural relations remain invariant, may your future be determinate by your own hands, and may you never stop arguing about the furniture of the universe, as long as you agree on how to live in it.

  To the happy couple.
