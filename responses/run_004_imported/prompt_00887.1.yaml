answer: |-
  This is one of the most famous and enduring puzzles in the history of philosophy. You and your friend have effectively recreated a debate that has been raging since the Hellenistic period, through the Medieval scholastics (Boethius, Aquinas, Ockham), and into modern analytic philosophy (Łukasiewicz, Quine, Prior).

  The short answer is: **Your reading is closer to the literal text of *De Interpretatione* 9, but your friend's reading is the one that dominated Western logic for nearly two thousand years.**

  The text is notoriously difficult, and the Edghill translation you are using (from 1831) is serviceable but can obscure some crucial Greek nuances. However, even looking at the English provided, there is strong evidence that Aristotle is doing something more radical than your friend suggests.

  Here is a breakdown of the two positions, where the text supports them, and what it implies for logic and metaphysics.

  ### 1. Your Friend's Reading: The Modal Scope Distinction
  Your friend argues that Aristotle is distinguishing between:
  1.  **Necessity of the Consequence:** Necessarily (if it is true that a sea battle will happen, it will happen).
  2.  **Necessity of the Consequent:** If it is true that a sea battle will happen, then it *necessarily* will happen.

  Your friend claims Aristotle accepts the Principle of Bivalence (every proposition is either true or false) for future statements but denies that their truth implies *necessity*. On this view, "There will be a sea battle tomorrow" is **true right now**, but it is only **contingently true**.

  **Where the text supports this:**
  Aristotle clearly makes the modal distinction you friend cites:
  > "For there is a difference between saying that that which is, when it is, must needs be, and simply saying that all that is must needs be..."

  Aristotle definitely wants to block the fatalist inference that *truth implies necessity*. If your friend stops reading there, they are on solid ground. This is the "Ockhamist" solution: the future is fixed in terms of truth-values (God or logic knows which is true), but it is not fixed in terms of causal necessity.

  **Where the text undermines this:**
  The problem arises in the final paragraph you quoted. If Aristotle merely wanted to deny necessity while keeping bivalence, he could have said: *"One proposition is true and the other false, but neither is necessarily true."*

  Instead, he writes:
  > "One of the two propositions in such instances must be true and the other false, but we cannot say **determinately** that this or that is false... It is therefore plain that it is not necessary that of an affirmation and a denial one should be true and the other false."

  The concluding sentence is the killer for your friend's view. Aristotle explicitly says it is **not necessary** that one be true and the other false. If bivalence held, it would be *necessary* (by definition of bivalence) that one is true and one is false. By denying this necessity, Aristotle seems to be denying that the propositions *have* a truth value in the standard sense.

  ### 2. Your Reading: Truth-Value Gaps (The Open Future)
  You argue that Aristotle is claiming future contingent propositions are neither true nor false *yet*. They are "undecided" (or in other translations, "indefinite"). Their truth value settles only when the event occurs.

  **Where the text supports this:**
  The strongest evidence is here:
  > "One may indeed be more likely to be true than the other, but it **cannot be either actually true or actually false**."

  If the statement *cannot be actually true*, then it lacks a truth value. This is a rejection of the Principle of Bivalence for future singular contingents. Aristotle seems to be saying that reality itself is not yet settled, so language cannot yet latch onto it with a definite "True" or "False."

  This aligns with his motivation: saving deliberation. If the statement "I will eat dinner" is *already true*, deliberation feels pointless (even if causally compatible). If the statement is *neither true nor false*, deliberation is the mechanism that *makes* it true.

  **The Logical Commitment:**
  You asked if this commits him to a three-valued logic. Anachronistically, **yes**.
  *   **Classical Logic:** Propositions are True (1) or False (0).
  *   **Aristotle's View (on your reading):** Future contingents are Indeterminate (½).

  This makes Aristotle the ancestor of modern "Open Future" views (like A.N. Prior's branching time logic) and many-valued logics (like Jan Łukasiewicz's, who explicitly used *De Interpretatione* 9 to motivate his 3-valued system in the 1920s).

  ### 3. The Crucial Distinction: Bivalence vs. Excluded Middle
  The confusion between you and your friend likely stems from conflating two logical principles that Aristotle seems to treat differently.

  1.  **Law of Excluded Middle (LEM):** $(p \lor \neg p)$. "Either there will be a sea battle or there will not."
  2.  **Principle of Bivalence:** $True(p) \lor True(\neg p)$. "Either 'There will be a sea battle' is true, or 'There will not' is true."

  Aristotle **accepts LEM**. He says: *"A sea-fight must either take place to-morrow or not."* The disjunction is necessary.
  Aristotle **rejects Bivalence** (for future contingents). He says: *"It is not necessary that of an affirmation and a denial one should be true and the other false."*

  Your friend's reading tries to save Bivalence by treating "True" as "True but contingent." But Aristotle's text suggests that for future contingents, the truth predicate doesn't apply *at all* until the event is present.

  ### 4. Is the Text "Torn"?
  You asked if Aristotle's text is torn between these views. Many scholars say **yes**.

  Notice the tension in this sentence:
  > "One of the two propositions in such instances **must be true and the other false**, but we cannot say **determinately** that this or that is false..."

  The first clause ("must be true... false") sounds like your friend's view (Bivalence holds). The second clause ("cannot say determinately") sounds like your view (Truth is indefinite).

  The resolution lies in the Greek word *horismenōs*, translated by Edghill as "determinately." A more precise reading is:
  *"One of the two propositions must be true and the other false, but not **definitely** (or 'specifically') this one or that one."*

  However, the concluding sentence ("It is therefore plain that it is not necessary that... one should be true and the other false") pushes hard toward your view. It suggests that while the *disjunction* is necessary, the assignment of truth values to the *disjuncts* is not.

  ### 5. Verdict: Who is Right?

  **On the Text:** **You are closer.**
  The literal conclusion of Chapter 9 is a restriction on the Principle of Bivalence. Aristotle explicitly limits the rule that "of every affirmation and denial, one must be true and the other false." He restricts it to present and past statements, excluding future singular contingents. Your friend's reading requires assuming Aristotle was speaking loosely about truth when he meant "necessary truth," but the text distinguishes them too sharply for that to be comfortable.

  **On the Philosophy:** **It depends on your goals.**
  *   **Your Friend (Ockhamist/Classical):** Wants to preserve classical logic and divine foreknowledge (if applicable). This view says the future is "fixed" in logic but "open" in causality.
  *   **You (Peircean/Open Future):** Want to preserve the intuition that the future is ontologically open. This view says the future is "unfixed" in logic *and* causality.

  **The "Rabbit Hole" Conclusion:**
  Aristotle is best read as an ancestor of the **Open Future** view. He is not merely blocking a logical fallacy (the modal scope error); he is making an ontological claim about the nature of time and possibility. For Aristotle, possibilities are real powers (*dunameis*). If a future event is truly contingent, it has the potential to be or not to be. If the statement about it were *already* true, that potentiality would be collapsed into actuality prematurely.

  So, tell your friend this: They are arguing like a Medieval scholastic (trying to save bivalence for theology/logic), while you are arguing like a modern temporal logician (accepting truth-value gaps). The text supports the temporal logician, but the scholastic reading is historically how the West managed to keep Aristotle compatible with Christian doctrine for a millennium.

  **Recommendation for the next dinner:**
  Suggest looking at the distinction between the **Law of Excluded Middle** (which Aristotle keeps) and the **Principle of Bivalence** (which Aristotle restricts). If your friend admits that Aristotle rejects Bivalence for future contingents but keeps Excluded Middle, you have won the textual argument. If they insist Bivalence holds, they are reading Boethius, not Aristotle.
