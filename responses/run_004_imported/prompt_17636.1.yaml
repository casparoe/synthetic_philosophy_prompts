  9.  **Final Polish:** Ensure the distinction between "validity of the text" and "validity of the enforcement action" is clear. This mirrors the Hart/Fuller distinction without the academic baggage. (Self-Correction: Make sure not to sound like I'm accusing the President of corruption directly, but highlight the *appearance* of impropriety regarding the parking feud).

