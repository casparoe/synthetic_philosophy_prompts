answer: |-
  The machine hummed, a sound like a held breath. Elena adjusted the focal lens, her fingers trembling against the cold brass of the Indexical. On the screen, the static coalesced into the study. *Their* study, but not. The bookshelves were fuller, the light warmer, the dust motes dancing in a sunbeam that hadn't touched this room in six months.

  And there he was. Julian.

  He sat in the leather armchair, pen in hand, frowning at a notepad. He looked exactly as he had the morning of the aneurysm: the same frayed cuff on his left sleeve, the same way he bit his lower lip when parsing a complex predicate. He was alive. He was breathing.

  Elena's hand hovered over the comms button. If she pressed it, the Indexical would bridge the modal gap. She could speak. He could hear.

  But her hand stopped. Resting on the console was a sealed envelope, taped there by Julian's own hand three days before he died. It bore a single instruction: *Read before activation.*

  She tore it open. The paper smelled of his tobacco, a scent that belonged to the past.

  *Elena,*

  *If you are reading this, you have built the Indexical. You are looking at World $W_n$. You are looking at me.*

  *Do not press the button. Do not speak. Listen to me, not with your heart, but with the logic I taught you to respect.*

  *You want to believe that the man in the chair is me. You want to believe in Transworld Identity. You want to think that 'Julian' is a rigid designator, as Kripke argued, pointing to the same essential soul across the multiverse. You want to think that I am merely located elsewhere, like a traveler in a different time zone, and that if you reach out, you touch me.*

  *This is false. I am not there. That man is not me.*

  *I have left my final paper on the desk. 'The Humphrey Objection Revisited.' Read it.*

  Elena looked past the screen to the physical desk in front of her. There, atop her own grief-stained tax returns, lay a manuscript in Julian's precise, angular script. She picked it up.

  *The core problem,* the manuscript began, *is the Law of Non-Contradiction. In World Actual ($W_a$), Julian is dead at $t_1$. In World Neighbor ($W_n$), Julian is alive at $t_1$. If the Julian in $W_a$ is numerically identical to the Julian in $W_n$, then one individual possesses the property of Being Dead and the property of Being Alive simultaneously.*

  *This is impossible. An object cannot be $P$ and $\neg P$.*

  *Therefore, the Julian in $W_n$ is not me. He is my Counterpart.*

  Elena looked up at the screen. The Other Julian stretched his arms, yawning. He stood up and walked to the window. In this world, the window looked out onto the garden where they had buried Julian's ashes. In that world, the garden was overgrown, but the man was walking through it.

  *Counterpart Theory,* she read on, *posits that individuals are world-bound. I exist only here. The man there resembles me closely. He shares my genetic history, my memories up to the divergence point (approximately the moment of conception, or perhaps the moment we met). He is similar enough to bear my name in his world, but he is not me.*

  *You will feel an urge to reject this. You will feel that love transcends ontology. You will cite Kripke's intuition: that when we speak of possibility, we speak of what could have happened to us, not to a stranger who looks like us.*

  *But consider Humphrey.*

  Elena traced the line. This was the crux. Saul Kripke's famous jab at David Lewis. Humphrey, the politician, does not care that a counterpart of him wins the election in another world. That victory brings him no joy here. It is not *his* victory.

  *If you speak to the man in $W_n$,* Julian wrote, *you are not speaking to your husband. You are speaking to a widower of a different Elena. In $W_n$, you likely died. Or perhaps you left him. Look closely, Elena.*

  She leaned in. The Other Julian was walking back to the desk. He wasn't alone. A woman entered the frame. She placed a mug of coffee on the desk. She wasn't Elena. She was younger, her hair darker. She touched Julian's shoulder. He leaned into her touch, smiling a smile Elena hadn't seen in years.

  *He is happy,* the note said. *But that happiness is not mine. My happiness ended with you, in this world. His happiness belongs to him and the woman in his room. If you intervene, you do not reclaim our life. You invade his.*

  *There is a deeper cruelty in Transworld Identity. If you insist that he is me, then you must accept that I am alive in $W_n$. If I am alive there, then my death here is merely a local accident, not an end. It diminishes the finality of my love for you. It suggests I am a diffuse entity, spread thin across probabilities, never fully present, never fully gone.*

  *I was present. I am gone.*

  *The man in the screen is a stranger who remembers being me. To treat him as me is to deny the reality of my death. To treat him as me is to deny the reality of his own life.*

  *Kripke argued that Humphrey doesn't care about the counterpart. I argue the inverse: The counterpart does not care about Humphrey. That man in the chair loves the woman who brought him coffee. He does not love you. He loves his wife. You are a ghost in his machine, a memory of a divergence that never happened for him.*

  *Do not make him a widower twice. Do not make yourself a ghost.*

  *Turn off the Indexical. Mourn me. Let him live.*

  *— J.*

  Elena lowered the paper. The hum of the machine seemed to grow louder, aggressive. On the screen, the Other Julian laughed at something the dark-haired woman said. He reached out and took her hand. The intimacy was casual, practiced, deep. It was the intimacy of years built in a world where Elena had not been the anchor.

  She felt the pull, the gravitational drag of the possible. It was so easy to slip into the Kripkean view. To say that "Julian" referred to the essence of the man, the soul that animated the logic and the love. If she believed that, she could save him. She could tell him about the aneurysm, warn him, bridge the gap.

  But if she did that, she accepted the premise that this Julian was a fragmented version of a whole. That her grief was unnecessary because "he" was still out there.

  But he wasn't. The man who had written the note, the man who had held her hand as the pain took him, the man who had feared the contradiction of his own existence... he was dust.

  To claim the Other Julian was her husband was to steal him from the woman in the room. It was to look at a stranger who shared a face and say, "You belong to me." It was the ultimate solipsism.

  Kripke was right about reference, perhaps. When she said "Julian," she meant *this* Julian. The one who died. The rigid designator pointed to a specific spatiotemporal location. It pointed to a grave.

  Lewis was right about identity. One thing cannot be two things. One life cannot be two lives.

  The Other Julian turned toward the screen. For a second, his eyes seemed to flicker, as if sensing the gaze from the Actual. He frowned, tilting his head. He felt the draft from a door that wasn't there. He looked unsettled.

  Elena's finger hovered over the power switch.

  If she kept it on, she lived in the limbo of the Counterpart. She would watch him age, watch him die eventually, mourning a death that wasn't hers, loving a man who didn't know her. She would become the Humphrey who cared about a victory that wasn't his, haunting a life that wasn't hers.

  If she turned it off, she accepted the void. She accepted that the universe was not a safety net, that death was a period, not a comma. She accepted that the man in the chair was a stranger, and that her husband was truly, logically, irrevocably dead.

  It was the harder truth. Transworld Identity was a comfort, a mystical assurance that no one is ever truly lost. Counterpart Theory was cold. It said we are bound to our world, to our choices, to our ends.

  Julian had chosen the cold truth. He had chosen logic over comfort. He had chosen to protect the integrity of the other world's Julian, and the integrity of his own death.

  "I care," she whispered to the screen. "Kripke was wrong. Humphrey does care."

  But caring didn't make it true. Her grief did not grant her ontological rights.

  The Other Julian said something to the woman. She laughed. The sound was muffled by the modal barrier, but the joy was clear. It was a closed loop. A complete life.

  Elena realized that by watching, she was already violating the boundary. She was the voyeur of her own replacement.

  She looked at the note one last time. *I was present. I am gone.*

  "I know," she said.

  She didn't press the comms. She didn't try to send a signal. She didn't try to verify if the divergence point was the aneurysm or something earlier, something that would explain the different woman. It didn't matter. The metaphysics held. The contradiction could not stand.

  Elena reached out and flipped the switch.

  The hum died. The screen went black, reflecting her own face, pale and tear-streaked, alone in the study. The silence rushed back in, heavy and absolute.

  There was no Julian in the machine. There was only Julian in the memory, and Julian in the ground.

  She picked up the manuscript and held it to her chest. It was the only thing that was actually his. The logic was his. The choice was his. And the death was his.

  She walked to the window and looked out at the garden. The grass was cut short. The headstone was white and stark.

  "Goodbye, Julian," she said.

  She didn't say it to the multiverse. She said it to the earth. She accepted the Lewisian constraint. She accepted the singularity of her loss. It hurt more than the alternative. It hurt more than hoping. But it was real.

  Elena turned from the window, leaving the Indexical in the dark, and walked out of the room to make coffee for one.
