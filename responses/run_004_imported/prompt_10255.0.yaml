          *   *Lewis's Fix:* Lewis adds a clause: "If $x$ retained its intrinsic basis throughout the stimulus." Since the fink removes the basis, the condition "retained basis" is false, making the counterfactual evaluation shift or the analysis accommodate the loss. Actually, Lewis's specific move is to analyze dispositions in terms of an intrinsic causal basis $B$. $x$ is disposed to $M$ when $S$ iff $x$ has $B$ and if $S$ were to occur and $B$ were to persist, $M$ would occur.
