answer: |-
  An Evil Demon corners a buck-passing theorist in a dimly lit dungeon.

  "Desire this saucer of mud," the demon growls, holding it out, "or I will torture you for eternity."

  The theorist adjusts his glasses, stares at the mud, and nods. "Fine. I desire the mud."

  "Ha!" says the demon. "So the buck stops here! The mud is good!"

  "Not so fast," says the theorist. "You've given me a decisive reason to *have* the desire, but you haven't given the mud any properties that make it *worthy* of the desire."

  The demon raises a whip. "I'm giving you a reason to favor it! Isn't that what value is?"

  "It's a state-given reason, not an object-given one," the theorist says, dodging the lash. "You're making it *useful* for me to want the mud, but you're not making the mud *good*. You're offering the wrong kind of reasons."

  The demon pauses, lowers the whip, and looks at the saucer. "So, if I painted the mud gold, would that be the right kind?"

  "Then it would be good, but I wouldn't need a threat."

  "And if I keep the threat?"

  "Then I'll keep desiring it, but I'll never call it valuable."

  The demon sighs, rubs his temples, and mutters, "I hate meta-ethics. I'm just trying to make the buck stop."

  The theorist shrugs. "You can't. You're not grounding the value; you're just pricing the attitude. You're not a value-creator, you're an incentive-provider."

  "Is there a union for that?"

  "No," says the theorist. "But if you stop torturing me, I might find your relief *fitting*."

  "Is that object-given?"

  "No," says the theorist. "That's just pragmatic. But it's the right kind of reason for me to leave."
