          *   *Theory:* Sacrifice is a cosmic mechanism. "The deeds of the below awaken the deeds of the above." It's about drawing divine effluence (*shefa*) and atonement through the substitution of life for life.
          *   *Critique of Rambam:* Reducing mitzvot to historical utility undermines their eternal validity. It makes God's will contingent on human historical accidents.

