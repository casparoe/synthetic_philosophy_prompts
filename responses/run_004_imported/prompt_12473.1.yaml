answer: |-
  There is a strange tension at the heart of tonight. We speak of Christ taking our place. But consider this: if I owe a debt, a friend can pay it. The creditor is satisfied. I walk free. But if I commit a crime, a friend cannot serve my prison sentence. We would call it unjust. Guilt clings to the soul in a way money does not.

  So when we say Jesus took our punishment, are we speaking nonsense? Philosophically, it stalls. Justice demands the guilty suffer. Yet, here we are, gathered around a cross where the Innocent suffers for the guilty. If we treat the atonement like a business deal, the books do not balance. It feels like a violation of moral order. And yet, this violation is our only hope. If justice were strictly rigid, we would be lost.

  Perhaps the error is thinking of God primarily as a creditor or a judge in a courtroom of cold logic. What if the cross is not a transaction, but an intrusion? God does not merely pay a fine from heaven; He enters the prison. He does not avoid the consequence of sin; He absorbs it into Himself. In human courts, substitution is corruption. In the Kingdom of God, substitution is communion. He does not stand apart from us; He becomes us. He allows the guilt that clings to us to cling to Him, not because justice requires a substitute, but because love refuses to leave the beloved alone in the dark.

  We cannot solve this puzzle tonight. The mechanics of grace will always outrun our reason. If you leave here trying to make the logic work, you will leave frustrated. But we are not called to solve the mystery; we are called to stand beneath it. The question is not whether the math works, but whether we will accept that Love is stronger than justice. He took what was ours—shame, death, separation—so we might receive what is His. Not because it makes sense to our minds, but because it is true to His heart. So let us not explain the cross. Let us simply kneel before it, and let ourselves be loved.
