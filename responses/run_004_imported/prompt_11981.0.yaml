answer: |-
  This is a beautiful problem. It feels like a family squabble, but it is actually a precise, real-world instance of a question that has occupied philosophers of language, legal theorists, and game designers for centuries. You are asking about the **ontology of rules**: Do rules exist independently of their application, or are they created by the act of playing?

  Here is the outside take you requested, broken down into the philosophical reality, the practical reality, and a path forward for your family.

  ### 1. The Philosophical Reality: The "Fact of the Matter"
  You asked whether there was ever a hidden "correct" way waiting to be uncovered. The hard truth, based on how oral traditions and rule systems work, is that **there almost certainly was no fact of the matter.**

  This is a concept explored by the philosopher Ludwig Wittgenstein and later by Saul Kripke regarding "rule-following." A rule is defined by its *use*. If a situation never arises, the rule regarding that situation does not exist in any functional sense.

  Consider your grandfather. Even if he was a genius of game design, human cognition is finite. When he invented the game, he likely visualized common scenarios and perhaps some edge cases. But the specific intersection of "Final Trick" + "Both Jokers" + "Two of Trump" is a statistical anomaly so rare it didn't happen in 40 years. It is highly probable that **your grandfather never thought about this specific combination.**

  If he never thought about it, he couldn't have formed an intent about it. Therefore, Mara and Denny are not remembering a fact; they are remembering *narratives* they constructed to make sense of the game.
  *   **Mara** is applying a principle of *cumulative mechanics* (bonuses stack).
  *   **Denny** is applying a principle of *hierarchical override* (special conditions cancel others).

  Both are logical frameworks, but neither is a "discovery" of a pre-existing truth. They are interpretations. In legal theory, this is called a **"case of first impression."** When a court encounters a situation no law covers, the judge cannot simply "find" the law; they must interpret principles to *make* a ruling that fits the spirit of the system.

  ### 2. The Evidence Problem
  You mentioned that Mara and Denny both speak with "total confidence." This is a well-documented psychological phenomenon. Human memory is reconstructive, not reproductive.
  *   Mara remembers the *pattern* of how he settled disputes (stacking).
  *   Denny remembers a *specific conversation* (hypothetical cancellation).

  Since the historical scoresheets are consistent with *both* views, the empirical evidence is neutral. You are left with two conflicting anecdotal claims about a deceased man's internal state. Epistemologically, you cannot verify either. To claim one is "right" is to claim access to information you do not have.

  ### 3. The "Legislating" Dilemma
  You wrote: *"It feels wrong to say the game never really had settled rules... but it also feels wrong to say Mara or Denny is simply mistaken."*

  This is the crux of your anxiety. You feel that admitting you are "legislating" diminishes the game's history. I would argue the opposite.

  An oral tradition is not a fossil; it is a living language. Languages evolve when speakers encounter new concepts. If your family had written the rules down in 1975, this would be a matter of textual interpretation (and lawyers would still be arguing about it). Because the rules are social, the "truth" of the game is not what was in your grandfather's head in 1975; **the truth of the game is what allows the family to continue playing together meaningfully.**

  If you insist on "discovering" the rule, you condemn the family to permanent stalemate, because the evidence is gone. If you admit you are "legislating," you reclaim agency. You are not breaking the tradition; you are sustaining it by adapting it to the present.

  ### 4. A Principled Way to Settle It
  Since you cannot settle this via archaeology (digging up the past), you must settle it via **coherence and policy**. Here is how a family with no rulebook should handle this:

  **A. The "Spirit of the Game" Test**
  Look at the mechanics.
  *   The "Double" is a bonus for a difficult feat (collecting both Jokers).
  *   The "Flip" is a chaos mechanic that upends the strategy (low tricks win).
  *   **Mara's view (Stacking):** High risk, high reward. The chaos of the Flip is amplified by the rarity of the Jokers. This creates wild score swings.
  *   **Denny's view (Cancellation):** The Flip is so disruptive that it normalizes the scoring. It prevents a single hand from deciding the whole game.

  Which version makes the game more fun for your *current* family? Which version feels more like the games you remember playing? If your family enjoys high variance, go with Mara. If you prefer strategic consistency, go with Denny.

  **B. The Democratic Compromise**
  Since the authority of the "Founder" is inaccessible, the authority defaults to the "Players."
  *   Hold a vote. Not on who is *right* about the past, but on what the rule *will be* going forward.
  *   Acknowledge openly: "We cannot know what Grandpa intended. We love his game enough to keep it going, so we are deciding this together."
  *   This actually honors the grandfather more than a fictionalized memory does. It treats the game as a living heirloom rather than a museum piece.

  **C. The Most Important Step: Write It Down**
  The root cause of this crisis is the lack of codification. Whatever you decide, **write it down.**
  *   Create a "Constitution" for the game.
  *   Include a clause for "Unforeseen Interactions." (e.g., "In cases where multiple scoring modifiers apply, bonuses stack unless otherwise voted by the majority of players.")
  *   Date it. Sign it.
  *   This turns this Thanksgiving's dispute into a foundational moment for the next 40 years.

  ### Conclusion
  To answer your specific questions:
  1.  **Is one of your cousins actually right?** Probably not. They are likely remembering their own logical extrapolations of your grandfather's style, not a specific edict.
  2.  **Is there a principled way to settle it without the founder?** Yes, but the principle is *coherence and consensus*, not *historical accuracy*.
  3.  **Are you just legislating?** Yes. And that is okay.

  You are worried that legislating the rule admits the game was "undefined." I suggest you reframe it: The game was defined enough to be played for 40 years. Now it needs a new definition to be played for 40 more.

  My advice? Gather the family. Admit that Grandpa left this one blank on purpose (even if he didn't). Tell Mara and Denny that their memories are both valid tributes to his style, but the game requires a single path forward. Vote on which rule makes for the better game *tonight*. Then, write it on a card, laminate it, and keep it in the deck box.

  That doesn't erase your grandfather's legacy; it ensures your grandchildren won't have this same argument in 2065.
