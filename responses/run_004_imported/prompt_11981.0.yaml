      *   *The Skeptical View (Kripke/Wittgenstein):* There is no "fact of the matter" about what the grandfather meant for a situation he never contemplated. Meaning is use. Since the use never occurred, the meaning is undefined.
      *   *The Intentionalist View:* The grandfather had a specific intent. If we could access his mind, there would be an answer. But we can't. So we are left with evidence. The evidence is inconclusive.
      *   *The Legal/Precedent View:* In law, when precedents conflict or don't cover a case, judges interpret based on principles, coherence, or policy. They are effectively making law but claiming to find it.
