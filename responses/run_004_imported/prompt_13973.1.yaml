answer: |-
  You have stumbled onto one of the most contentious debates in the philosophy of language regarding slurs: **The Problem of Embeddedness** (or the Projection Problem).

  The short answer is that the family of theory that explains your experience is the **Semantic/Conventional Implicature** view (often allied with **Prohibitionism**), while the theory that fails you is the **Pragmatic/Expressivist** (or "Use") view.

  Here is the breakdown of why the "attitude" theory fails to predict the contamination you're feeling, and why the semantic/prohibitionist view explains why the stain remains even in mention.

  ### 1. Why the "Attitude/Use" Theory Fails
  The theory you are describing as the "attitude" kind is generally known as **Expressivism** or **Speech Act Theory** (championed by philosophers like Michael Randall or, in a different key, Luvell Anderson and Ernie Lepore).

  *   **The Claim:** The derogatory force of a slur is not in its definition (truth conditions) but in the *act* of using it. It is a tool for expressing contempt. If I am not expressing contempt (e.g., I am a narrator reporting on a bigot, or I am quoting the word to condemn it), I am not performing the harmful speech act. Therefore, the word should be "laundered."
  *   **Why it fails your test:** This theory treats language as **atomistic** and **presentist**. It assumes meaning is generated fresh in every specific utterance based on the speaker's current intent.
  *   **The Reality:** It ignores the **historical sedimentation** of the signifier. A slur is not just a tool for *your* contempt; it is a repository of *historical* contempt. When you mention the word, even to condemn it, you are invoking the entire history of violence and subordination attached to it. The "attitude" theory fails because it locates the toxicity in the *speaker's mind*, whereas your reader experiences the toxicity in the *social world* the word invokes.

  ### 2. The Theory That Explains the Contamination: Projection & Prohibition
  The phenomenon you are experiencing is best explained by a combination of **Conventional Implicature** (Christopher Potts) and **Prohibitionism** (Christopher Hom & Robert May).

  #### A. The Projection Problem (Conventional Implicature)
  In linguistics, certain meanings "project" out of logical embeddings.
  *   *Example:* "John stopped smoking." Even if I say, "John didn't stop smoking," the presupposition that *John used to smoke* remains true. It projects through negation.
  *   *Applied to Slurs:* Many semantic theorists argue that the derogatory content of a slur acts like a **conventional implicature** or a **presupposition**. It is baked into the meaning of the term itself, not just the intent of the user.
  *   *The Result:* When your narrator reports, "He spat out the [slur]," the derogatory content **projects** out of the report. The reader cannot process the sentence without accommodating the derogatory content as part of the narrative reality. The "stain" is semantic, not just pragmatic. It survives quotation because the meaning travels with the concept, not just the deployment.

  #### B. Prohibitionism (Hom & May)
  This is perhaps the most relevant to your specific situation (where you aren't even printing the word). Hom and May argue that slurs are **prohibited words**.
  *   **The Claim:** The moral/ethical weight of a slur is deontic (rule-based). There is a social norm that says: *Do not token this word.*
  *   **Mention vs. Use:** Prohibitionism suggests that the prohibition is so strong that it bleeds into **mention**. To bring the word into the discourse—even to talk *about* it—is to risk violating the norm because it keeps the concept active in the shared social space.
  *   **Why it feels contaminated:** By writing a sentence that revolves around the existence of the slur, you are forcing the reader to **accommodate the taboo**. You are making the reader complicit in the recognition of the word. The "contamination" you feel is the friction of navigating a social prohibition. The reader's brain has to simulate the word to understand the sentence, and in that simulation, the affective harm is triggered.

  ### 3. The "Social Meaning" Gap
  There is a third angle, drawn from the work of **Sally Haslanger** and **Cecilia Tirrell**, which focuses on **Social Meaning**.

  The "attitude" theory fails because it treats the slur as a private transaction between speaker and hearer. The Social Meaning view argues that slurs are **public artifacts**. They function to reinforce a hierarchy.
  *   When your narrator mentions the slur, they are not just reporting a sound; they are reporting a **hierarchical act**.
  *   The sentence reads as "contaminated" because the *narrative world* is now contaminated. You have established that this is a space where that hierarchy is enforceable. The toxicity isn't in the ink; it's in the **ontological status of the setting**.
  *   The "attitude" theory predicts the word should be neutral if the narrator is neutral. The Social Meaning theory predicts the *environment* becomes toxic because the *possibility* of that violence has been made salient.

  ### Summary for the Writer
  You are feeling the **Ineradicability** of the slur.

  *   **The "Attitude" Theory** tells you: "You aren't using it to hurt, so it shouldn't hurt." (This is false.)
  *   **The "Semantic/Prohibitionist" Theory** tells you: "The word carries historical trauma that projects through quotation and mention." (This is true.)

  **Why this matters for your craft:**
  Don't try to "launder" the word. The contamination you feel is **accurate data**. It is the reader feeling the gravity of the historical weight you are invoking. If the sentence feels heavy, toxic, or uncomfortable, that is not a failure of your prose; it is a successful transmission of the social reality of 1950s Alabama.

  The "attitude" theory fails because it assumes language is a clean vessel. Your experience proves that for slurs, the vessel *is* the poison. Trust the stain. It's doing the work you need it to do.
