answer: |-
  The cursor blinked against the white background of the email draft. It was a rhythmic, mechanical pulse, like a heart monitor for a decision that hadn't been born yet.

  Elias rubbed his eyes. The office was dark, save for the glow of his monitor and the streetlights bleeding through the blinds. It was 11:43 PM. The grant disbursement was scheduled for 8:00 AM.

  On his screen was the final report from the partner NGO in the region. It was mostly clean, except for Column G, Row 42. A demographic projection error. A single decimal point shifted to the right. It inflated the estimated reach of the upcoming water sanitation project by a factor of ten.

  It was a typo. Everyone knew it was a typo. The field officers were exhausted; the data entry clerk was new. If Elias sent the correction now, the finance team would flag the discrepancy. The automated compliance system would freeze the disbursement. A manual review would take three days, minimum.

  Three days without the water trucks. Three days where the temporary filtration units ran dry.

  Elias hovered his finger over the *Send* key.

  If he sent the correction, he upheld the integrity of the data. Integrity mattered. If donors lost trust in the accuracy of the reports, future funding would dry up. He had evidence for this: last year, a similar organization lost their primary grant after a audit revealed systemic inflation of metrics. Thousands lost access to medicine over the following decade. That was a concrete vector pointing toward *Send*.

  But he also had evidence pointing toward *Don't Send*. The region was entering the dry season. Immediate hydration prevented cholera outbreaks. He had the epidemiological models on his desktop. A three-day delay increased the probability of an outbreak by 14%. An outbreak now would strain the local clinic, diverting resources from vaccination drives scheduled for next month. That was a concrete vector pointing toward *Silence*.

  It wasn't that he didn't know the future. It was that he knew too many fragments of it, and they were screaming in opposite directions.

  This wasn't the simple kind of uncertainty. This wasn't flipping a coin where the heads and tails averaged out to zero. This was complex. The good effects of sending the email (systemic integrity, long-term trust) were real, weighted, and supported by data. The bad effects of sending the email (immediate suffering, secondary health crises) were also real, weighted, and supported by data.

  He tried to imagine the ripple.

  *Scenario A: He sends.*
  The finance team wakes up to the flag. The transfer stops. The field coordinator, Sarah, calls him. She's angry. She says the village elders are already gathering at the distribution point. She tells him that trust is local, not global. If the trucks don't come, the community turns to the unregulated wells.
  *Counter-thought:* But if he doesn't send, and the donors catch the error later—which they might, because their auditors are sharp—the penalty is worse. A clawback of funds. A blacklisting. The organization collapses. The water stops forever, not just for three days.
  *Counter-counter-thought:* But maybe the donors won't catch it. Maybe this typo stays buried in the archives. Then the water flows, the clinic stays open, and a child who would have died drinks clean water and grows up to be a teacher.
  *Counter-counter-counter-thought:* Or that child grows up to be a teacher who radicalizes a generation because the curriculum is outdated. Or the population growth from reduced mortality strains the food supply, leading to conflict over arable land.

  Elias stopped. That last chain felt like speculation, but was it? He had read the conflict risk assessments. Population pressure was a known variable. He had evidence that success here could breed instability there.

  He looked at the decimal point. It was so small. A period inked on a screen.

  He thought about his mentor, years ago, telling him that consequentialism was just accounting for ghosts. You had to sum the values of things that hadn't happened yet. But the ledger wouldn't balance. The positive integers of immediate relief were being subtracted by the negative integers of systemic risk, while the positive integers of long-term credibility were being subtracted by the negative integers of immediate crisis.

  There was no common denominator. There was no way to net it out.

  He minimized the email window. He opened the field report again. He looked at a photo attached to the document: a group of children standing next to a dry pump. They were smiling, waiting for the fix.

  If he protected them now, he might betray them later.
  If he protected them later, he might betray them now.

  The clock on the taskbar ticked to 11:44 PM.

  He thought about not choosing. But inaction was a choice with its own causal chain. Ignoring the error normalized the error. It signaled to the data entry clerk that precision was optional. Next time, the error might not be a decimal point. It might be a diverted shipment.

  But signaling virtue to a clerk in a capital city wouldn't matter to a child dying of dysentery in the field.

  Elias realized his hands were shaking. It wasn't fear. It was the physical sensation of holding two incompatible truths in his head without being able to resolve them. He wasn't blind to the future; he was binocular. He saw two overlapping images of reality, slightly out of alignment, and no matter how he squinted, they wouldn't merge into a single, clear picture.

  He maximized the email window.

  He typed a subject line: *Urgent: Discrepancy in Final Report - Region 4.*

  He looked at the *Send* button. It was grey, unassuming. It didn't know it was a switch for a universe.

  He thought about the argument for sending: *Truth is a structure. If you loosen the bricks, the wall falls.*
  He thought about the argument against: *People are not bricks. They are flesh. They bleed now, not later.*

  He had no metric to weigh structure against flesh. He had no algorithm to convert integrity into liters of water. The framework demanded he maximize the good, but the good was fractured. It was distributed across time and causality in a way that his mind couldn't aggregate. He was being asked to solve an equation with too many variables and not enough constants.

  He took a breath. It hitched in his throat.

  He understood, finally, that the comfort people found in morality came from believing the weights were hidden, not that they were missing. They believed that if they just knew enough, the scales would tip. But the scales weren't waiting for more data. The data was already here, and it was contradictory.

  Elias moved his index finger.

  He pressed the key.

  The screen flashed. *Message Sent.*

  The cursor disappeared. The email moved to the *Sent Items* folder. The office was silent again. The streetlights outside hummed. The water trucks would stay in the depot tomorrow. The auditors would wake up to their flags. The children would wait.

  Or they wouldn't. The donors might override the flag. The clerk might correct the data before morning. The outbreak might not happen. The trust might not erode.

  Elias sat back in his chair. He waited for the relief of a decision made, or the guilt of a harm caused. Neither came. There was only the quiet hum of the computer fan and the vast, opaque silence of the future, stretching out ahead of him, utterly unchanged in its unknowability.

  He closed his laptop. The room went dark. He still didn't know if he had done the right thing. He knew only that he had done *a* thing, and the rest was noise.
