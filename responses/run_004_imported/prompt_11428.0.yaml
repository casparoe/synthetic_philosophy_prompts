  *Opening:* The glow of the screen.
  *Middle:* The branching paths in his head. Not fantasy, but plausible projections.
  *End:* The click. The silence.

  *Wait, one nuance:* Greaves' complex cluelessness is often about *signs* of the future being ambiguous. Like, "Saving this person leads to overpopulation" vs "Saving this person leads to innovation."
