      *   Specifically, it resonates with David Benatar's **Asymmetry Argument** (though maybe too pessimistic for a conservation context) or, more accurately, the distinction between *person-affecting views* vs. *impersonal views* in population ethics.
      *   It also touches on **Negative Utilitarianism** (prioritizing the reduction of suffering over the creation of happiness/existence).
      *   There's an element of **Deontology** (duties regarding harm) vs. **Consequentialism** (outcomes).

  3.  **Validate the User's Intuition:**
      *   Crucial first step: Tell the user they are *not* just being sentimental. This is a recognized, hard problem in ethics.
      *   Acknowledge their biological expertise (they know the animals' reality better than the "arithmetic" board members).

  4.  **Drafting the Philosophical Framework (Simplified):**
      *   *Avoid jargon overload* (since they said they fumble terms), but introduce the specific concepts gently so they can look them up if they want.
      *   **The Non-Identity Problem:** Explain that bringing a specific toad into existence creates a specific subject of harm. Not bringing them into existence harms *no one*.
      *   **The Asymmetry of Harm and Benefit:** It is generally considered worse to create a being that suffers than it is good to create a being that is happy (in this specific context of risk).
