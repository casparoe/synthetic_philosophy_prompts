prompt: |-
  I'm a student member of my high school's Honor Council, which can discipline "conduct that violates the moral standards of the school community" even when no other rule has been broken. A case has come to us: several seniors, all eighteen, have been playing poker for real money among themselves off campus. Nobody is in debt or was pressured, no one outside the group is affected, and our handbook's gambling rule, which covers on-campus conduct only, doesn't reach it. Parents and teachers still want them punished, arguing that a school depends on shared standards, and that quietly tolerating this, even though it harms no one in particular, erodes something the community needs. Other Council members say we should only discipline conduct that harms an identifiable person, since "some people are offended" would justify punishing almost any unpopular private choice. The Council is evenly split. Please draft the memo I'll bring to our vote: it should recommend how we should rule, sketch a workable test for similar future cases, and take the "shared standards" side's strongest version seriously rather than dismiss it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Student member of a High School Honor Council.
      *   **Task:** Draft a memo for the Council's vote on a specific case.
      *   **Case Details:** Seniors (18+), off-campus, playing poker for real money, consensual, no debt/pressure, no outside impact. Handbook gambling rule is on-campus only.
      *   **Conflict:**
          *   *Side A (Community Standards):* Parents/teachers want punishment. Argument: Schools rely on shared moral standards; tolerating this erodes community fabric even without specific harm.
          *   *Side B (Harm Principle):* Some Council members argue against punishment. Argument: Discipline requires identifiable harm to a person; "offense" shouldn't justify punishing private choices.
      *   **Current Status:** Council is evenly split.
      *   **Requirements for Memo:**
          *   Recommend a ruling (how to vote).
          *   Sketch a workable test for future cases.
          *   Take the "shared standards" argument seriously (don't dismiss it).
          *   Tone: Persuasive, balanced, thoughtful, appropriate for a student leadership body.

  2.  **Determine the Stance/Recommendation:**
      *   *Option 1: Punish.* Risks overreach, legal issues (students are 18, off-campus), and sets a precedent for policing private lives. Hard to define limits.
      *   *Option 2: Don't Punish.* Respects privacy and legal boundaries, but risks alienating administration/parents and ignoring the "character" mission of an Honor Council.
      *   *Option 3: Nuanced Middle Ground (The "Honor" Approach).* Acknowledge the tension. Rule *against* formal discipline in this specific instance (due to lack of nexus to school function/specific harm) BUT affirm the importance of the discussion. Create a test that allows for intervention *only* when off-campus conduct significantly reflects back on the school's integrity or safety.
      *   *Decision:* The most sustainable and ethically sound position for a *student* council is to recommend **no formal sanction** for this specific case, but to adopt a **clarified standard** that acknowledges community values without granting unlimited police power. This bridges the split: it respects the "Harm Principle" advocates (no punishment without specific nexus/harm) while validating the "Shared Standards" advocates (by explicitly discussing why this falls short of the threshold, rather than saying the school has no interest).
      *   *Refinement:* Actually, to truly take the "Shared Standards" side seriously, I need to ensure the recommendation doesn't just say "No, because rules." It needs to say "We value the standard, but this specific mechanism (punishment) is the wrong tool for this specific conduct." Or, perhaps more boldly, "We find no violation, but issue a statement of expectation."
      *   *Best Path:* Recommend finding **no violation** of the Honor Code in this instance, but establish a **"Nexus and Integrity Test"** for future off-campus conduct. This protects students from arbitrary policing while giving the Council a framework to act if conduct *does* threaten the school's core mission (e.g., cheating, hate speech, safety threats).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose. Acknowledge the difficulty of the case.
      *   **The Core Tension:** Explicitly articulate the two valid perspectives (Harm vs. Community Standards). Show understanding of the "Shared Standards" argument (it's not just about offense; it's about culture).
      *   **Analysis of the Current Case:**
          *   Legal/Age factor (18, adults).
          *   Location (Off-campus).
          *   Nature (Consensual, no victims).
          *   Why the "Shared Standards" argument is strong but insufficient here (slippery slope, privacy).
      *   **Recommendation:** No sanction.
      *   **Proposed Test (The "Workable Test"):** This is crucial. It needs to be specific.
          *   *Nexus:* Does it affect the school environment?
          *   *Integrity:* Does it violate core academic/ethical missions (honesty, safety)?
          *   *Vulnerability:* Is there coercion or power imbalance?
      *   **Conclusion:** Call to unity.

  4.  **Refining the Tone:**
      *   Must sound like a student leader, not a lawyer or a principal.
      *   Respectful to faculty/parents (don't dismiss their concerns as "old fashioned").
      *   Respectful to peers (don't treat them like criminals).
      *   *Key Challenge:* Taking the "Shared Standards" side seriously. I need to validate that schools *are* moral communities, not just contract providers. I should argue that *enforcing* this specific case might actually *damage* the shared standard by making the Council look authoritarian.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey Council. We are stuck.
      *   Side A says gambling is bad for character. Side B says no harm no foul.
      *   I think we shouldn't punish. They are 18. It's off campus.
      *   But I agree schools need values.
      *   Let's make a test: Only punish off-campus stuff if it hurts the school's reputation or safety.
      *   Vote no on this case.

  6.  **Drafting - Iteration 2 (Adding Depth & Nuance):**
      *   *Critique:* Too blunt. Needs to elevate the "Shared Standards" argument.
      *   *Revision:* Acknowledge that an Honor Council *is* about character, not just rule-breaking. The parents have a point that culture matters. However, culture is built by trust, not fear. Punishing legal, private adult behavior erodes trust.
      *   *The Test:* Needs to be called something like the "Community Nexus Test."
      *   *Recommendation:* Dismiss the case, but issue a guidance statement.

  7.  **Final Polish (incorporating into the final output):**
      *   Ensure the "Shared Standards" argument is steel-manned (presented in its strongest form).
      *   Ensure the "Test" is practical for high schoolers to apply.
      *   Check word count and formatting.

      *(Self-Correction during drafting)*: I need to be careful not to give legal advice. I am a student. Focus on *Honor* and *Policy*, not legality. Although the age (18) is relevant to the moral weight.
      *Focus:* The memo should persuade the split council to unite around a "No Sanction" verdict *based on principle*, not just loophole exploitation.

  8.  **Final Review against constraints:**
      *   Recommend how to rule? Yes (No sanction).
      *   Sketch a workable test? Yes (The "Nexus & Integrity" Test).
      *   Take "shared standards" seriously? Yes (Acknowledged in the analysis section).
      *   Tone? Appropriate for Honor Council.

      *(Final thought on the "Shared Standards" argument)*: I will argue that upholding shared standards requires *restraint* to maintain legitimacy. If we police everything, we police nothing. This validates their goal while rejecting their method for this case.

  9.  **Proceed to generate output.** (This matches the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** The Honor Council
  **FROM:** [Your Name], Council Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation and Framework Regarding Off-Campus Conduct Case

  **Introduction**

  We are currently deadlocked on the case regarding the senior students playing poker for money off-campus. This stalemate reflects a deeper philosophical divide within our body: Is the Honor Council a judicial body that punishes specific harms, or is it a guardian of the school's broader moral culture?

  This memo recommends that we **find no violation** in this specific instance. However, to address the valid concerns of the administration and the "shared standards" proponents on this Council, I propose we adopt a new framework for evaluating future off-campus conduct. This approach allows us to rule fairly in this case without surrendering our ability to protect the community's integrity in the future.

  **The Core Tension: Harm vs. Culture**

  To move forward, we must acknowledge that both sides of this debate hold valid moral ground.

  *The Harm Principle:* Several members argue that without an identifiable victim, coercion, or debt, there is no "honor" violation. To punish consensual, private conduct between adults (as our seniors are) risks turning the Council into a morality police force. If we punish based on "offense" alone, we risk arbitrary enforcement that targets unpopular but harmless private choices.

  *The Shared Standards Argument:* We must take the administration's and parents' position seriously. Their argument is not merely that "gambling is bad." It is that a school is not just a service provider; it is a moral community. They argue that the Honor Code exists to cultivate character, not just to police rule-breaking. If we tacitly endorse high-stakes gambling among seniors, we may signal that the school's commitment to integrity ends at the campus gate. They fear that eroding this boundary weakens the trust and shared identity that makes our community function.

  Both arguments are correct in the abstract. The challenge is applying them to this specific case without compromising the Council's legitimacy.

  **Recommendation: No Sanction**

  I recommend we vote to **dismiss the case without sanction.**

  While the "Shared Standards" argument is compelling, applying it here creates more damage to the community than the conduct itself.
  1.  **Legitimacy:** If we punish students for legal, off-campus conduct between consenting adults where no one was harmed, we risk losing the student body's trust. An Honor Council relies on peer respect to function. If students view us as overreaching, they will be less likely to report genuine violations (like cheating or plagiarism).
  2.  **The Nature of Honor:** Honor is internally motivated. Punishing private behavior that has no nexus to school life suggests that students are only "honorable" when watched. We should encourage seniors to make better choices through dialogue, not disciplinary records.
  3.  **Precedent:** Punishing this conduct sets a slippery slope. If gambling is punishable, what about other legal adult activities off-campus? We lack the clear boundaries to enforce those without bias.

  **A Workable Test for Future Cases**

  Dismissing this case does not mean we surrender our authority over off-campus conduct entirely. There are scenarios where off-campus behavior *does* violate our shared standards (e.g., off-campus hazing, cyberbullying, or academic dishonesty that originates at home).

  To guide future votes, I propose we adopt the **"Nexus and Integrity Test."** For off-campus conduct to be actionable under the Honor Code, it should meet at least two of the following three criteria:

  1.  **The Nexus Clause:** Does the conduct have a direct, demonstrable impact on the school environment? (e.g., Does it disrupt classes, threaten safety on campus, or involve school resources?)
  2.  **The Integrity Clause:** Does the conduct fundamentally undermine the core academic or ethical mission of the school? (e.g., Cheating, plagiarism, or stealing exam materials off-campus clearly fits this, even if gambling does not.)
  3.  **The Vulnerability Clause:** Does the conduct involve a power imbalance, coercion, or the exploitation of a community member? (e.g., Hazing or pressuring underclassmen.)

  **Application to Current Case:**
  *   *Nexus:* None. The game was off-campus and did not spill into school.
  *   *Integrity:* Weak. While gambling is regulated, consensual poker among peers does not inherently undermine academic integrity.
  *   *Vulnerability:* None. All participants were willing, equal seniors.

  Under this test, the current case is dismissed. However, if a similar case involved underclassmen, or if the gambling debts led to theft or coercion on campus, it would meet the *Vulnerability* or *Nexus* criteria and become actionable.

  **Conclusion**

  We can respect the "Shared Standards" argument without punishing these students. We affirm that our school values character development beyond the classroom, but we also affirm that the Honor Council's disciplinary power must be limited to conduct that tangibly affects our community's safety and integrity.

  By dismissing this case while adopting the "Nexus and Integrity Test," we protect our peers from overreach while preserving our authority to act when the community is truly at risk. I ask that we vote to dismiss the charges and adopt this framework immediately.
