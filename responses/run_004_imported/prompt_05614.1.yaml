prompt: |-
  My first writing teacher is retiring after forty years running the same fiction workshop, and I have been asked to give the toast at her farewell dinner. She has always judged fiction—student drafts and, later, my own published novels—by Tolstoy's 'infection' test from *What Is Art?*: not craft, only whether a piece carries one sincere, particular feeling that any reader can actually catch. She has never let me forget that, by that standard, my own novels belong with the 'bad art' Tolstoy eventually decided even his own *War and Peace* was. Half the room will be former students who know his opera-rehearsal chapter cold; the other half will be family who have never read a word of it. Write the toast—five minutes, anchored in that rehearsal scene—honest about exactly where her standard leaves my work, yet still unmistakably a gift, not a verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Farewell dinner for a retiring writing teacher (40 years, same fiction workshop).
      *   **Speaker:** A former student, now a published novelist.
      *   **Key Theme:** Tolstoy's "infection" test from *What Is Art?* (sincerity/feeling over craft).
      *   **Specific Conflict:** The teacher judges the speaker's published novels as "bad art" by this standard (even comparing them to Tolstoy's own self-criticism of *War and Peace*).
      *   **Audience:** 50% former students (know the Tolstoy reference well), 50% family (don't know the reference).
      *   **Tone:** Honest (acknowledge the "bad art" verdict), but a gift, not a verdict (celebratory, warm, grateful).
      *   **Constraint:** 5 minutes spoken (approx. 750-900 words).
      *   **Anchor:** The opera-rehearsal scene from *What Is Art?* (where Tolstoy tests art on "normal" people/children to see if it infects them).

  2.  **Deconstruct the Tolstoy Reference:**
      *   *What Is Art?* (1897) is notorious for being harsh. Tolstoy argues that true art isn't about beauty or technique, but about "infection"—the ability of the artist to transmit a feeling they have experienced to the audience.
      *   *The Opera Rehearsal:* In the essay, Tolstoy describes attending a rehearsal of *Siegfried*. He observes the wealthy patrons pretending to enjoy it vs. the exhausted workers/orchestra who are unmoved. He realizes the "upper class" art fails the infection test because it's exclusive and insincere. He also mentions testing art on children or common folk to see if it truly works.
      *   *The Twist:* The teacher uses this to grade the student. The student admits they fail the test.
      *   *The Resolution:* The toast needs to reframe "failing the test" as a testament to the teacher's integrity, not the student's failure. The *relationship* is the art that infected.

  3.  **Determine the Structure:**
      *   **Opening:** Welcome everyone, acknowledge the milestone (40 years).
      *   **The Hook (Tolstoy):** Introduce the "Infection Theory" simply for the family, specifically for the students. Mention the opera rehearsal.
      *   **The Conflict:** Acknowledge the teacher's harsh grading of the speaker's career using this metric. (The "Bad Art" confession).
      *   **The Turn:** Why this harshness is actually the gift. The sincerity of the teacher *is* the infection.
      *   **The Climax:** Reframing the workshop not as a factory for novels, but as a place of feeling.
      *   **Closing:** A toast to the teacher.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Keep it warm. 40 years is a lifetime.
      *   *Explaining Tolstoy:* Need to bridge the gap between the scholars and the family. Don't get bogged down in theory. Focus on the *feeling*. Use the opera image. The exhausted workers vs. the pretentious audience.
      *   *The Personal Sting:* I need to admit my novels are "bad art" by her standards. This needs to be funny but tender. Not bitter. "She told me my books were lies."
      *   *The Reframe:* If I am the bad art, she is the good artist. Her teaching infected *me*, even if my books don't infect others. Her standard was the art.
      *   *The Opera Scene Application:* In the essay, Tolstoy looks for the person who *feels*. In this room, we are the proof. We felt *her*.
      *   *Closing:* Raise a glass.

  5.  **Refining the Tone:**
      *   *Risk:* Sounding too self-deprecating or making the teacher sound cruel.
      *   *Fix:* Emphasize that her harshness came from love and a belief in the stakes of writing. It wasn't cruelty; it was high stakes.
      *   *Risk:* Losing the family.
      *   *Fix:* Explain the "infection" metaphor clearly. "Have you ever cried at a movie?" That's infection.
      *   *Risk:* Going over time.
      *   *Fix:* Keep sentences punchy. Monitor word count.

  6.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. 40 years. She loves Tolstoy. Tolstoy said art is a virus of feeling. He tested it on opera workers. She tested it on us. She says my books fail. They are dead. But she is alive. Her teaching infected us. So I toast her.

  7.  **Drafting - Iteration 2 (Adding Flesh & Voice):**
      (Start with the room.) Look around. Two tribes. Writers and Family. You share one thing: [Teacher].
      (The Tolstoy bit.) In *What Is Art?*, Tolstoy goes to an opera. He ignores the rich people. He watches the stagehands. If they cry, it's art. If not, it's trash. Even *War and Peace* was trash to him eventually.
      (The Personal bit.) She used this on me. "Your book," she'd say. "Did it make a stranger weep? No? Then it's a puzzle, not art." I have shelves of trophies and she sees puzzles.
      (The Turn.) But here's the thing. Tolstoy wanted sincerity. She was sincere. She didn't lie to me. That honesty infected me. I might write bad art, but I learned what good art feels like from her.
      (The Toast.) To the only artist in the room who passed the test.

  8.  **Polishing and Checking Constraints:**
      *   *Word Count Check:* A 5-minute speech is roughly 750 words at a moderate pace.
      *   *Tolstoy Detail:* Ensure the "opera rehearsal" is specific. Tolstoy watched the *orchestra* and the *workers*, not just the singers. He wanted to see if the fatigue of the workers was overcome by the feeling.
      *   *The "Bad Art" line:* Make sure it lands as a joke that hurts a little but heals.
      *   *The Gift:* The gift is the standard itself.

  9.  **Final Polish (incorporating into the final output):**
      *   Make the transition between the "bad art" confession and the tribute smoother.
      *   Ensure the family understands they are part of the "infection" (they raised the teacher, they love her).
      *   End on a high note.

  **(Self-Correction during drafting):** I initially thought about quoting Tolstoy directly. *Correction:* No, keep it conversational. The students know it, the family doesn't need the lecture, they need the sentiment. Focus on the *image* of the rehearsal.

  **(Final check on the "Verdict vs. Gift" constraint):** The speech must not sound like I am finally judging *her*. It must sound like I accept her judgment of *me* as a badge of honor. The "gift" is the rigor.

  10. **Final Word Count Check:** Aiming for ~800 words.

  *(Proceeds to generate output based on these thoughts.)*
answer: |-
  Good evening. For those who don't know me, I'm one of the many who passed through [Teacher's Name]'s workshop. I'm also one of the few who went on to publish novels. And if you ask her about those novels, she will tell you, quite calmly, that they are not art.

  To the family here: don't worry. She doesn't think I'm a bad person. She just thinks I'm a bad artist. And she says this with love.

  For forty years, [Teacher's Name] has run this workshop by a single, terrifying metric. She borrowed it from Leo Tolstoy's late-life essay, *What Is Art?* Tolstoy argued that technique doesn't matter. Beauty doesn't matter. The only thing that matters is "infection." Can the writer transmit a specific feeling they have experienced directly into the soul of the reader? If the reader doesn't catch that feeling—like a virus—the work is fake. It is merely entertainment. It is "bad art."

  Tolstoy describes testing this theory at an opera rehearsal. He didn't watch the singers. He watched the exhausted orchestra members and the stagehands. If the music made *them* forget their fatigue and feel the composer's joy, it was art. If they just waited for their break, it was a fraud. He eventually decided that even his own *War and Peace* failed this test.

  So, you can imagine the atmosphere in Room 304.

  Half of you in this room are former students. You know the drill. You remember handing over a draft you thought was brilliant, only to have her ask, "Yes, but did you feel this when you wrote it? Or did you just think it was clever?"

  The other half of the room is family. You know her as the woman who makes the best lasagna or remembers every birthday. You might wonder how anyone could teach like that for forty years without driving everyone away.

  Here is the truth: She applied the Tolstoy test to me, strictly, for two decades. When my first novel came out, she didn't congratulate me on the prose. She asked, "Who did it infect?" When I told her about the good reviews, she said, "Reviews are craft. Did a stranger cry?" I had to say no. She nodded, like a doctor confirming a diagnosis. "Then it is not art. It is a puzzle."

  For a long time, I resented this. I wanted the trophy, not the truth. I wanted her to tell me I was Tolstoy, even if Tolstoy said he wasn't Tolstoy.

  But standing here tonight, looking at this room, I realize I misunderstood the lesson.

  Tolstoy wrote that essay to warn against art that divides people—art that only the rich understand, or only the educated. He wanted art that unites. He wanted sincerity.

  [Teacher's Name], you judged my work as "bad art." You were right. By your standard, and by Tolstoy's, my books are often just clever puzzles. But in judging them so honestly, you passed the test yourself.

  You didn't pretend to like them to make me feel good. You transmitted exactly what you felt. You infected *me*.

  The "infection" wasn't supposed to be in the pages I wrote. It was in the room where we sat. When I walk into a classroom now, or sit at my desk, I feel your presence. I feel the weight of that standard. I feel the demand for sincerity over success. That feeling you gave me—that specific, particular feeling of responsibility to the truth—is the only art I have ever made that matters.

  Tolstoy watched the stagehands at the opera to see if they felt the music. Tonight, look around. The stagehands are here. The students are here. The family is here. We are all tired. Life is exhausting. Writing is exhausting. Teaching for forty years is a marathon of exhaustion.

  But look at us. We are not waiting for the break. We are not checking our watches. We are united by a feeling you transmitted to us, forty years ago, and never stopped transmitting. We feel the stakes. We feel the need for truth. We feel loved, because you cared enough to tell us when we were lying.

  So, I am not standing here to defend my novels. I am standing here to admit that by your standard, I am a failure. And I am grateful for it. Because your standard was never about the books. It was about us.

  Tolstoy said art is the capacity to make another person feel what you feel. [Teacher's Name], you have made hundreds of us feel exactly what you feel. That makes you the only true artist in this room.

  To the teacher who failed us so we wouldn't fail the art. To the only one who passed the test.

  Cheers.
