answer: |-
  You have hit the nail on the head. Your recollection is accurate, and your skepticism about the symmetry between the two arguments is well-founded. While the synchronic and diachronic Dutch Book Arguments (DBAs) share a family resemblance—both use guaranteed loss as a marker of irrationality—the diachronic version relies on significantly stronger and more controversial premises.

  Your claim to your coworkers that arbitrage-hunting is "applied Bayesian epistemology" is a fantastic elevator pitch, but as you suspect, it frays slightly when pulled at the threads of the diachronic literature.

  Here is a breakdown of the asymmetry between the two arguments, the specific extra assumption the diachronic version requires, and how your trading context maps onto the philosophical debate.

  ### 1. The Synchronic Argument (Probabilism)
  **The Target:** An agent's credences at a single time $t$.
  **The Norm:** Credences must satisfy the probability axioms (e.g., $P(A) + P(\neg A) = 1$).
  **The Mechanism:** If your betting quotients violate the axioms, a bookie can construct a set of bets acceptable to you that guarantees a net loss regardless of the outcome.

  **Strengths:**
  *   **Self-Contained:** It relies only on the agent's current state. It does not matter what the agent plans to do tomorrow.
  *   **Logical Necessity:** The incoherence is mathematical. If you price $A$ at 0.6 and $\neg A$ at 0.6, you are effectively pricing a tautology at 1.2.
  *   **Trading Parallel:** This maps perfectly to your job. If your order book implies $P(A) + P(\neg A) < 1$, you are leaving money on the table (or inviting arbitrage). Market makers *must* satisfy synchronic coherence to avoid being "picked off."

  ### 2. The Diachronic Argument (Conditionalization)
  **The Target:** An agent's rule for updating credences from $t_1$ to $t_2$ upon receiving evidence $E$.
  **The Norm:** The agent should update by Conditionalization ($P_{new}(H) = P_{old}(H|E)$).
  **The Mechanism:** (Lewis/Teller) A bookie makes a bet with the agent at $t_1$. Then, depending on what evidence $E$ arrives, the bookie makes a second bet at $t_2$. If the agent's updating rule deviates from conditionalization, the combination of the $t_1$ bet and the contingent $t_2$ bet guarantees a loss.

  **The Crucial Asymmetry (The "Extra Assumption"):**
  You are correct that the diachronic argument requires an assumption the synchronic one does not: **Pre-commitment.**

  For the bookie to construct the Dutch Book *at $t_1$* (which is necessary to prove the agent is irrational *at $t_1$*), the bookie must know exactly how the agent will react to evidence at $t_2$.
  *   **Synchronic:** The bookie only needs to know your current prices.
  *   **Diachronic:** The bookie needs to know your *updating policy* in advance.

  If the agent is free to decide at $t_2$ how to update based on whatever seems reasonable *at that moment*, the bookie cannot lock in the second leg of the trade at $t_1$. The guaranteed loss disappears. Therefore, the Diachronic DBA only works against an agent who has **publicly committed** to a specific updating rule beforehand.

  ### 3. Why the Diachronic Argument Faces More Skepticism
  The literature (e.g., Brian Skyrms, Paul Teller, later David Christensen) highlights several friction points that don't afflict the synchronic version:

  **A. Pragmatic vs. Epistemic Rationality**
  The synchronic DBA is often criticized for conflating pragmatic rationality (not losing money) with epistemic rationality (believing truth). However, the diachronic version suffers this more acutely.
  *   *Critique:* Why should avoiding a clever bookie's trap dictate how I respond to evidence? If I update via a non-conditionalizing rule (say, I become more skeptical than Bayes allows), I might be epistemically cautious, even if a bookie could theoretically exploit that caution.
  *   *Result:* Many modern epistemologists prefer **Accuracy Arguments** (e.g., Jim Joyce) over Dutch Books. They argue you should conditionalize because it minimizes expected inaccuracy, not because it avoids financial loss.

  **B. The "Forgotten Evidence" Problem**
  The Diachronic DBA assumes the agent retains their old credences perfectly to calculate the conditional probability. In reality, agents forget. If I forget my prior $P(H)$, I cannot conditionalize. A strict Diachronic DBA would label me irrational, which seems too harsh.

  **C. Alternative Updating Rules**
  There are plausible scenarios where Conditionalization is not the correct norm.
  *   **Jeffrey Conditionalization:** Used when evidence is uncertain (e.g., "I think I saw a red shirt, but the lighting was bad").
  *   **Reflection Principle (van Fraassen):** Suggests your current credence should match your expected future credence. Sometimes satisfying Reflection conflicts with strict Conditionalization.
  The Synchronic DBA has no such rivals; probability axioms are generally taken as the definition of coherence.

  ### 4. Is Your Claim to Coworkers Defensible?
  *"Our arbitrage-hunting is basically applied Bayesian epistemology."*

  **The Verdict:** It is a robust *analogy*, but technically imprecise.

  **Where it holds up:**
  *   **Coherence:** Just as a Bayesian agent must avoid synchronic Dutch Books to be rational, a market maker must avoid static arbitrage to be solvent. In both cases, incoherence leads to a dominated strategy (sure loss).
  *   **Information Aggregation:** Prediction markets are often defended using the "Wisdom of Crowds" logic, which leans heavily on the idea that prices represent aggregated credences. If those prices aren't coherent, the aggregation fails.

  **Where it breaks down:**
  *   **The Diachronic Element:** Markets do *not* update by strict Conditionalization. Prices move based on order flow, inventory risk, capital constraints, and latency. If a whale dumps a position, the price moves not because the "evidence" changed, but because the risk exposure changed. A strict Bayesian would say the market is being irrational; a trader knows the market is managing risk.
  *   **The Counterparty:** In the philosophical DBA, the bookie is a hypothetical exploiter revealing your irrationality. In your job, *you* are the bookie hunting for others' irrationality. You are essentially acting as the external enforcer of the Dutch Book theorem, punishing incoherent credences in the wild.

  ### 5. Summary Recommendation
  Your impression of the asymmetry is accurate. The Diachronic DBA is widely regarded as weaker than the Synchronic DBA because it requires the **assumption of a fixed, known updating plan**, which is often unrealistic for human agents (though perhaps more realistic for algorithmic trading bots).

  **How to refine your pitch to the team:**
  Instead of saying "We are applied Bayesian epistemologists," try:
  > "We are the external enforcement mechanism for the Dutch Book Theorem. The philosophy says incoherent credences *can* be exploited; our job is to *be* the exploitation that forces the market back into coherence."

  This acknowledges the philosophical root (the existence of the vulnerability) without committing you to the controversial claim that your trading algorithms follow strict Bayesian conditionalization. You aren't the Bayesian agent; you are the *environment* selecting for Bayesian agents.

  **Key References for your digging:**
  *   **Teller, P. (1973).** "Conditionalization and Observation." *Synthese*. (The first print appearance of Lewis's argument).
  *   **Lewis, D. (1999).** "Why Conditionalize?" (The original manuscript).
  *   **Christensen, D. (1991).** "Clever Bookies and Coherent Beliefs." *The Philosophical Review*. (A seminal critique of the diachronic argument).
  *   **Skyrms, B.** (Various works on dynamic coherence).

  You are right to treat the diachronic argument with more caution. In trading, as in epistemology, static consistency is a hard constraint; dynamic consistency is often a strategic choice.
