      *   *Section 1: The Prediction Paradox.* If they predict you, they model you. Modeling reveals the utility function's topology. Artificial spikes look different than natural hills.
      *   *Section 2: The Cost of Credibility.* If the surrogate is truly defended, it consumes resources. This consumption is observable. If it doesn't consume resources, it's a bluff.
