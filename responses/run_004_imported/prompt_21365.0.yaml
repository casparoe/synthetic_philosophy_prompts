  8.  **Final Review of the "Stinginess" point:** Nate says "theory rewards companies for being stingier." Sofia says "it's not about fairness, it's about structure." Sofia is right about what Marx *said*, but Nate is right that it feels like a loophole. I need to explain *why* it's not a loophole in the theory: because without a wage, there is no *capitalist production* occurring, just *appropriation*. The company isn't making profit *from the labor process* of the maintainer; they are saving costs. Cost-saving != Surplus Value extraction in the strict sense.

