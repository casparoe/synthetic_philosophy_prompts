      *   **Nate's Position:** Yes, it's exploitation. Companies extract value, pay nothing. Paying nothing shouldn't be *less* exploitative than underpaying. Maintainers feel compelled/directed by company needs.
      *   **Sofia's Position:** No, not in the technical Marxist sense. Exploitation requires a wage relation (surplus value/wage). No wage = no baseline. Marx's focus is on compulsion via separation from means of production + direction of labor. This is more like free-riding or appropriation of a commons.
