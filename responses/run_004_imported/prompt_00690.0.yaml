  **MEMORANDUM TO THE BENCH**
  **RE: The Jurisprudential Basis for Conviction in the Grudge Informer Case**
  **DATE: October 1949**
  **SUBJECT: Hart vs. Fuller and the Validity of Nazi Statutes**

  Your Honor,

  You stand before a ruin. The courthouse may be standing, the codes may be on the shelf, but the moral architecture of the German legal order has collapsed. You are asked to convict a woman who used the statutes of the Third Reich to destroy her husband. She pleads that she did no wrong because she obeyed the law of the land at the time.

  You have two paths. One is paved by H. L. A. Hart, the English positivist. The other by Lon Fuller, the American natural lawyer. You asked for rigor, not comfort. You asked which argument is *better*. For a judge in 1949 Bavaria, tasked not merely with settling a dispute but with resurrecting the concept of Law itself, the better argument is **Fuller's**.

  Here is why you must reject the positivist temptation and rule that the Nazi edicts were not law, and therefore offer her no shield.

  ### I. The Positivist Trap (Hart)

  Professor Hart's position is intellectually seductive because it is clean. He argues that law is a matter of social fact, not moral merit. If a rule is enacted by a recognized sovereign and follows the system's procedural rules, it is law. The Nazi statutes regarding treason and disparagement of the Führer were, by the internal logic of the Third Reich, valid law.

  Hart admits this law was wicked. But he insists that calling it "not law" confuses the question. For Hart, the honest solution is to pass a new, retroactive statute punishing the wife. We must admit, he says, that we are sacrificing the principle of *nullum crimen sine lege* (no crime without law) to achieve a moral end. We must choose between two evils: impunity for the informer or retroactive punishment.

  **Why this fails you:**
  Hart's rigor is the rigor of a taxonomist, not a judge. If you adopt his reasoning, you validate the Nazi claim to legality. You concede that their terror was "law," merely too evil to be tolerated now. This creates a catastrophic precedent for the new Republic. It teaches the citizen that Law is simply the command of power, and that morality is an external check applied only when the regime changes.

  Furthermore, Hart's solution requires the new democratic state to openly violate the Rule of Law (via retroactivity) to fix the crimes of the old one. You would be staining the hands of the new democracy to cleanse the old. It suggests that Justice and Law are inherently opposed. For a court trying to rebuild trust in the judiciary, this is poison.

  ### II. The Inner Morality of Law (Fuller)

  Professor Fuller argues that law is not merely a command; it is a *purposeful enterprise*. It is the subjecting of human conduct to the governance of rules. For a system to be called "law," it must possess an "inner morality." It must be general, public, prospective, clear, non-contradictory, possible to comply with, constant, and congruent with official action.

  Fuller contends that the Nazi regime failed these criteria so egregiously that it ceased to produce law. When statutes are applied arbitrarily, when tribunals are shams, when the "law" is used as a tool of terror rather than order, the system loses its claim to legality. It becomes a system of naked force.

  **Why this prevails:**
  This is the argument you need. It allows you to convict the woman without resorting to retroactivity. You are not punishing her for violating a new law; you are ruling that she violated *valid legal principles* that existed even then, because the Nazi statutes lacked the essential qualities of law.

  This approach denies the Nazi regime the dignity of legality. It asserts that the Rule of Law did not die in 1933; it went underground, preserved by the conscience of the jurist. It allows you to say: "You did not obey the law, Frau X. You obeyed a command that lacked the moral authority of law."

  ### III. The Verdict on the Argument

  You should rule for Fuller, but with a specific caveat that sharpens the rigor. Do not drift into vague appeals to "divine justice" or "eternal rights." That is the caricature of natural law Hart rightly despises. Instead, ground your decision in the **functional failure** of the Nazi legal order.

  The statute the wife invoked was not merely immoral; it was legally defective. It lacked clarity. It was applied with retroactive effect by the tribunals. It demanded the impossible (loyalty to a madman). It failed the test of *congruence* between the written rule and the official action. Because the system failed the "inner morality of law," its edicts cannot be recognized as binding obligations by this court.

  This is the path taken by Gustav Radbruch, the German legal philosopher who, like many, converted from positivism to natural law after seeing the ruins of 1945. His formula is your guide: *Where there is a conflict between positive law and justice to an intolerable degree, the law must yield.*

  Hart calls this confusion. You must call it **restoration**.

  ### IV. Instructions for the Bench

  In your novel, the judge's voice must not sound like a moralizing priest. He must sound like a technician repairing a broken machine.

  1.  **Acknowledge Hart's Warning:** Have the judge admit that calling evil statutes "non-law" is dangerous. It risks judicial arbitrariness. "We tread carefully," he should say. "We do not declare a statute void because it is unwise or harsh."
  2.  **Define the Threshold:** The judge must establish that this is not a normal case. The Nazi regime was not a normal government. It was a criminal enterprise wearing the mask of the state. The "law" was a weapon, not a rule.
  3.  **The Ruling:** The wife is guilty not because she broke a moral rule, but because she colluded in a system that had abandoned the *form* of law. She deprived her husband of liberty using a mechanism that lacked legal validity.

  ### Conclusion

  Hart offers intellectual honesty at the cost of legal continuity. Fuller offers legal continuity at the risk of moral ambiguity. In 1949, you cannot afford to admit that the Law is broken. You must assert that the Law survived.

  Therefore, the better argument is Fuller's. It allows you to convict the informer while simultaneously acquitting the concept of Law itself. It tells the German people that the horror they endured was not "Law," but a perversion of it. It allows the new court to stand on the ground of Justice without admitting it is standing outside the Law.

  Rule for the prosecution. Rule that the statute was void *ab initio*. Rule that there is no duty to obey a command that is not law.

  **Respectfully submitted,**

  **Legal Counsel to the Court**
