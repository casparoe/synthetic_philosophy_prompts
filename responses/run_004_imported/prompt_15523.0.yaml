      *   *Lexical Incommensurability:* Later Kuhn (Post-1990) moved away from "gestalt switches" to "taxonomic structures." They are debating the *Postscript* (1969), but Kuhn's final view was more linguistic.
      *   *The "No Overlap" Principle:* Kuhn's specific mechanism for incommensurability (kinds cannot cross-cut).
      *   *Rationality vs. Algorithm:* The core philosophical issue. Is rationality about *process* or *outcome uniqueness*? Owen defends process; Farah attacks outcome uniqueness.
      *   *Local vs. Global:* Incommensurability is rarely global. It's usually local to specific kind-terms.
      *   *Translation vs. Understanding:* You can understand a past theory without fully translating it into current terms (the "bridge" problem).
      *   *Kuhn's Realism:* Kuhn was a Kantian with categories. He wasn't a relativist about *nature*, but about *categorization*.

