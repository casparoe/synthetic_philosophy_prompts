answer: |-
  Here is a reconstruction of the Lewisian defense, tailored for a graduate proseminar context. It is designed to be rigorous enough to satisfy second-years who have read the literature, while clearly distinguishing a substantive metaphysical rebuttal from a mere verbal dodge.

  ***

  ### The Humphrey Objection and the Charge of Question-Begging

  When Kripke objects that Counterpart Theory (CT) "changes the subject," he is relying on a specific semantic intuition: that the truth of a *de re* modal claim (e.g., "Humphrey might have won") requires the **literal identity** of the subject across worlds. He argues that CT substitutes a relation of similarity (counterparthood) for a relation of identity, and in doing so, loses the "aboutness" of the claim.

  The Lewisian reply is that this objection is question-begging. However, to prevent this from sounding like a generic defensive shield ("Any theory can say its critic is assuming the rival view!"), we must show **why** Lewis is entitled to this charge based on independent metaphysical grounds. The argument proceeds in three steps: distinguishing the semantic datum from the metaphysical explanation, deploying the Problem of Accidental Intrinsics to show why Transworld Identity (TWI) is not a neutral default, and demonstrating CT's superior flexibility with cases like constitution.

  #### 1. The Semantic Datum vs. The Metaphysical Explanation
  The first move is to grant Kripke the *semantic datum* but deny his *metaphysical explanation* of it.

  *   **The Datum:** We agree that when we say "Humphrey might have won," we are saying something about Humphrey. We are not talking about a distinct individual, Robert, in another world, unless Robert stands in the right relation to Humphrey.
  *   **The Disagreement:** Kripke assumes the only relation that secures this "aboutness" is strict numerical identity ($x = y$). Lewis argues that strict identity across worlds is metaphysically incoherent. Therefore, the "aboutness" must be secured by a different relation (the counterpart relation).

  If Lewis can show that TWI is incoherent, then Kripke's demand that "it must be Humphrey himself (via identity)" is a demand for something impossible. In that case, CT isn't changing the subject; it is providing the only coherent analysis of the subject matter available. The charge of question-begging has teeth here because it rests on the claim that **Kripke is treating a contested metaphysical thesis (TWI) as a pre-theoretic semantic constraint.**

  #### 2. Giving the "Question-Begging" Charge Teeth: Accidental Intrinsics
  To show this isn't just a verbal stalemate, we must invoke Lewis's independent argument against TWI: **The Problem of Accidental Intrinsics** (*On the Plurality of Worlds*, Ch. 4).

  *   **The Problem:** If Humphrey is literally identical across worlds, then Humphrey has 5 fingers in $w_1$ and 6 fingers in $w_2$. If Humphrey is one object existing in both worlds, he has incompatible intrinsic properties. You cannot solve this by indexing properties ("has-5-fingers-at-$w_1$") without turning intrinsic properties into relations to worlds, which Lewis argues destroys the notion of intrinsicality.
  *   **The Implication:** Lewis argues TWI leads to a contradiction regarding the nature of properties. CT solves this by positing distinct individuals (Humphrey-$w_1$, Humphrey-$w_2$) who are not identical but are counterparts. Humphrey-$w_1$ has 5 fingers simpliciter; his counterpart has 6 fingers simpliciter. No contradiction.

  **The Rejoinder to the Student:**
  "When you say CT fails because it isn't about *Humphrey himself*, you are presupposing that 'Humphrey himself' can coherently exist as a transworld entity bearing incompatible properties. Lewis argues this is metaphysically impossible. Therefore, your objection amounts to saying: 'Counterpart Theory fails to preserve Transworld Identity.' Lewis's reply is: 'Nothing can preserve Transworld Identity, because it is incoherent.'

  To insist on TWI as a condition for an adequate theory of modality is to beg the question against the argument that TWI is logically flawed. The Humphrey objection treats TWI as a fixed point of data, but Lewis has shown it is a variable with high metaphysical costs."

  #### 3. Principled Flexibility: The Statue and the Lump
  Students often worry that the counterpart relation is "interest-relative" or "ad hoc." They fear Lewis can just tweak the similarity metric to save any intuition. To counter this, show how CT handles **constitution cases** better than TWI, proving the framework is principled.

  Consider the statue and the lump of clay.
  *   **TWI View:** If they are identical, they share all modal properties. But the lump could survive being squashed; the statue could not. TWI forces you into awkward choices (deny they are identical, or deny one of the modal intuitions).
  *   **CT View:** CT allows for **sortal-relative counterpart relations**. The statue has statue-counterparts (which preserve form); the lump has matter-counterparts (which preserve material).
      *   "The statue could have been squashed" is false (no statue-counterpart is squashed).
      *   "The lump could have been squashed" is true (a matter-counterpart is squashed).
      *   Since the terms pick out the same world-bound object but invoke different counterpart relations, we validate both intuitions without contradiction.

  **Why this matters for Humphrey:**
  This shows that CT does not merely "change the subject"; it **refines** the subject. When we say "Humphrey might have won," we are implicitly invoking a specific counterpart relation (one grounded in origin, psychology, and causal history). The reason we don't care about a random twin in another world is that they do not satisfy the relevant counterpart relation.

  The Humphrey objection assumes there is only *one* way to be Humphrey (Identity). CT shows there are *many* ways to trace Humphrey modally (Counterpart Relations), and this granularity solves problems TWI cannot. To demand Identity is to demand a less expressive tool.

  #### 4. Summary: How to Deliver This in Office Hours
  Here is the script for the core argument, stripped of the scaffolding above:

  > "The Humphrey objection is powerful because it appeals to a strong intuition: modal claims are *about* us. But Kripke makes a hidden metaphysical assumption: that the only way for a claim to be *about* Humphrey is if Humphrey is literally present in the other world.
  >
  > Lewis's response is that this assumption is the very thing being debated. Lewis argues that literal transworld identity is incoherent (due to accidental intrinsics). If transworld identity is impossible, then we *must* analyze 'aboutness' using a different relation to avoid contradiction. Counterpart Theory offers that relation.
  >
  > So, when Kripke says, 'But Humphrey doesn't care about his counterparts!', he is effectively saying, 'But Humphrey doesn't care about the only metaphysically coherent way for him to have modal properties!'
  >
  > This isn't a generic 'you're begging the question' defense. It relies on the independent argument that TWI breaks logic regarding properties. CT preserves the truth of the modal claim ('Humphrey might have won') while correcting the metaphysics of *how* that truth is grounded. To reject CT on the grounds that it isn't TWI is to prioritize a discredited metaphysics over a working semantic analysis."

  ### Why This Survives Scrutiny
  This defense works against sharp second-years because it concedes the semantic intuition (yes, it's about Humphrey) while challenging the metaphysical necessity of TWI. It avoids the "any theory" trap by anchoring the question-begging charge in the **Problem of Accidental Intrinsics**.

  If a student presses, "But why accept Lewis's view of intrinsics?" you can admit that this is the real battleground. The Humphrey objection is not a knockout blow; it is an invitation to debate the nature of properties and identity. But as a standalone argument against CT, it fails because it assumes the coherence of the very view (TWI) that CT is designed to replace.
