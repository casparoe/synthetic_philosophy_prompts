          *   Tone: Rigorous, suitable for sharp second-year grad students (philosophically precise but accessible).

  2.  **Deconstruct the Humphrey Objection:**
      *   *Kripke's Claim:* When we say "Humphrey might have won," we mean *Humphrey himself* could have won. CT says "A counterpart of Humphrey won." Kripke says Humphrey doesn't care about counterparts.
      *   *The Core Tension:* Intuition about *de re* modality (about the object itself) vs. CT's extensional semantics (about relations between distinct objects).

  3.  **Deconstruct the Lewisian Defense (The "Question-Begging" Charge):**
