  10. **Final Review against constraints:**
      *   Rigorous? Yes.
      *   Address QB charge having teeth? Yes (via Accidental Intrinsics).
      *   Include Statue/Lump or Accidental Intrinsics? Yes (Accidental Intrinsics is crucial for the "teeth," Statue/Lump for flexibility).
      *   Tone for 2nd years? Yes, authoritative but explanatory.

