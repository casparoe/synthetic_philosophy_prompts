      *   If CT is true, "Humphrey himself" in a modal context *just means* "Humphrey and his counterparts."
      *   Therefore, saying "But it should be Humphrey!" assumes TWI is correct, which is what's being debated.
      *   *The Hard Part:* Why isn't this just saying "My theory defines terms differently, so your objection fails"? That *is* question-begging in a bad way if not justified. The defense needs to show CT offers a *better* or *equally valid* explication of the pre-theoretic intuition, and that Kripke's intuition relies on a specific metaphysical commitment (TWI) that has its own costs.

  4.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the force of the intuition. It *feels* right. But distinguish between *semantic intuition* and *metaphysical commitment*.
      *   **Point 1: The Semantic vs. Metaphysical Divide.** Kripke treats "Humphrey" as a rigid designator picking out the same entity across worlds. Lewis treats "Humphrey" as a world-bound individual extended modally via counterpart relations. The objection assumes the former is the only way to capture the truth conditions.
      *   **Point 2: Why it's Question-Begging (The "Teeth").** It's not just "you defined it differently." It's that Kripke's objection relies on the *intelligibility* of transworld identity. Lewis argues TWI is unintelligible (Problem of Accidental Intrinsics). If TWI is incoherent, then the demand "It must be Humphrey!" is a demand for something impossible. Thus, CT isn't changing the subject; it's saving the phenomenon from incoherence.
      *   **Point 3: Explicating the Intuition.** CT claims to capture *why* we care. We care about counterparts because they represent *how we could have been*. The relation is grounded in similarity and causality (origin), not magic identity.
      *   **Point 4: Addressing the "Any Theory" Worry.** Why can't everyone say this? Because Lewis provides independent arguments *against* TWI (Accidental Intrinsics). Most theories can't rule out their competitor on independent grounds. Lewis claims TWI is logically problematic.
      *   **Point 5: The Statue/Lump & Sortal Relativity.** Use this to show CT handles *de re* nuance better than TWI. TWI struggles with contingency of constitution. CT handles it via different counterpart relations (statue-counterparts vs. clay-counterparts). This shows CT isn't ad hoc; it's more flexible.
      *   **Conclusion:** Summarize. The objection fails because it demands TWI as a precondition for *de re* modality, but TWI is the contested metaphysical claim, not a semantic datum.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is saying TWI is "incoherent" too strong? Lewis thinks so (Accidental Intrinsics), but many disagree. I need to frame it as: Lewis offers a *reason* to reject TWI, so insisting on TWI ignores that reason.
