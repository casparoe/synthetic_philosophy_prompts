  **Move 1 (Owen): Score 0**
  This is a common intuitive heuristic, but it treats natural language categories like mathematical sets. While 40 is arithmetically half of 80, social labels don't adhere to strict averages, making this definition linguistically naive even if the math checks out.

  **Move 2 (Dana): Score +2**
  Dana correctly identifies that intrinsic properties (like aging) shouldn't fluctuate based on extrinsic statistics (like global life expectancy). This effectively dismantles Owen's mathematical definition by showing it leads to absurd, unstable results for the individual.

  **Move 3 (Owen): Score +1**
  Owen pivots to a "prototype" view, which is closer to how humans actually categorize things than the math argument. However, relying on "you know it when you see it" is a bit of a conversation stopper that lacks explanatory power.

  **Move 4 (Dana): Score +1**
  This is a classic articulation of the Sorites Paradox (the paradox of the heap), correctly highlighting that if no single month causes the change, the concept seems incoherent. It's a logically sound move, though she uses it defensively to resist the label rather than resolve the paradox.

  **Move 5 (Owen): Score +2**
  Owen accurately describes the philosophical solution to the Sorites Paradox: vague predicates have fuzzy boundaries rather than sharp cutoffs. Comparing it to blurriness is an excellent analogy for how gradable adjectives work in reality.

  **Move 6 (Dana): Score -1**
  Dana incorrectly assumes that a lack of sharp boundaries renders a statement truth-valueless ("undefined"). In ordinary language and fuzzy logic, statements can be "mostly true" or "true enough" without needing a precise binary switch, so her claim that Owen lied is pedantic and incorrect.

  ***

  **The Referee's Ruling on Terminology**

  Both of them were grappling with what philosophers of language call **Vague Predicates**, but they missed the concept of **Prototype Theory**. Words like "middle-aged," "tall," or "bald" aren't defined by necessary and sufficient conditions (like a math formula), nor are they completely undefined. Instead, they work like a target: there is a clear center (e.g., a 55-year-old is definitely middle-aged) and a clear outside (e.g., a 10-year-old is definitely not), with a fuzzy penumbra in between where truth is a matter of degree.

  Owen was right that 40 sits comfortably within the "target" of middle age in our current culture, so his statement was pragmatically true. Dana was right that the boundaries are fuzzy and shouldn't depend on arbitrary math, but she was wrong to demand binary precision from a concept that is inherently gradient. The label isn't a fact about her biology; it's a social tool for grouping, and 40 fits the group well enough for party banter.
