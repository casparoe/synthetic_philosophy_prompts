      *   *Question 2: Modal Collapse (Required).*
          *   *Focus:* Identity of Will and Essence.
          *   *Anticipated Reply:* Distinction between God's necessary act of willing *in general* and the contingent terms of that will.
          *   *Follow-up:* If the act is identical to the essence, and the essence is necessary, how can the *term* vary without introducing composition in God?

      *   *Question 3: Escape Routes/Relations (Required).*
