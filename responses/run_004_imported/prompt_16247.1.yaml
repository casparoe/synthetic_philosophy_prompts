      *   **Speaker's Position:** Leibnizian/Thomistic hybrid. Defends PSR-based cosmological argument (contingent totality $\rightarrow$ necessary being). Defends Classical Divine Simplicity (no real distinctions in God). Defends Libertarian Freedom/Contingency of Creation (God could have done otherwise or nothing).
      *   **Specific Requirements:**
          *   Move beyond premise restatement to pressure points in the literature.
