          *   *Follow-up:* Does this make the contingency merely Cambridge-like? If the ground is necessary, how is the grounded truly contingent?

      *   *Question 4: Synchronic Contingency.*
          *   *Focus:* Scotist alternative to temporal succession.
          *   *Anticipated Reply:* God wills $X$ at $t_1$ but could have willed $Y$ at $t_1$ (logical instant).
          *   *Follow-up:* Does this preserve libertarian freedom without reintroducing potentiality into God's actual nature?

      *   *Question 5: The Principle of Sufficient Reason itself.*
          *   *Focus:* Restricted vs. Unrestricted PSR.
          *   *Anticipated Reply:* We only need PSR for contingent facts.
          *   *Follow-up:* Isn't the contingency of the world precisely what needs explaining? If the explanation is necessary, does the contingency vanish?

      *   *Question 6: Divine Knowledge of Counterfactuals.*
          *   *Focus:* Middle Knowledge vs. Simplicity.
          *   *Anticipated Reply:* God knows all possibles through his essence.
          *   *Follow-up:* If God's essence is identical to his existence, are the possibles grounded in God? If so, are they necessary?

      *   *Question 7: The "Best of All Possible Worlds" Tension.*
          *   *Focus:* Leibnizian intellectualism vs. Thomistic voluntarism.
          *   *Anticipated Reply:* God wills the good, but isn't necessitated to create *this* good.
          *   *Follow-up:* What tips the scale? If nothing tips the scale, is it random? If something does, is it necessitated?

      *   *Question 8: Explanatory Priority.*
          *   *Focus:* Order of explanation vs. Order of being.
          *   *Anticipated Reply:* God is prior in being, but our concepts differ.
