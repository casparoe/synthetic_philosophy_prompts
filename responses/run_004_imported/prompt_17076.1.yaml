answer: |-
  **Setting:** *A nearly empty diner, 2:00 AM. The coffee is stale. Elena and Marcus have been talking for an hour. The napkins on the table are covered in scribbled diagrams.*

  **Marcus:** Let's strip the rhetoric away, Elena. You say losses don't sum. I say preventable deaths are bad, and more preventable deaths are worse. If you walk into a burning building and can pull left or right—left has one child, right has five—you go right. If you go left, you have to explain to the parents of the four extra children why their kids were expendable.

  **Elena:** And that's exactly the language I reject. "Expendable." "The four extra." You're speaking as if the five are a single entity with a hunger for survival that is greater than the one's. But there is no "five-person." There is David, and Sarah, and Jen, and...

  **Marcus:** I know there are five distinct people. I'm not positing a hive mind. I'm saying that from the point of view of morality, the fact that there are five distinct claims adds up. Each person has a claim to be saved. Five claims outweigh one.

  **Elena:** But *who* is doing the weighing? If I lose my life, I lose everything. If David loses his life, he loses everything. These are incommensurable tragedies. There is no super-observer who suffers the sum of our losses. If you break your leg and I break my leg, we don't say, "Well, collectively, this is a double-leg injury that is twice as bad as one of us breaking a leg." We say, "That's terrible for you, and that's terrible for me."

  **Marcus:** We don't say that when it comes to resource allocation. If we have two casts and two broken legs, we treat both. If we have one cast and two broken legs, we have to choose. And if you tell me we should flip a coin between the two patients, I say you're ignoring the fact that using the cast on *both* (if it were divisible) would reduce more pain. In the life-saving drug case, the drug is divisible in effect, if not substance. You can save five lives or one. Why is the reduction of five tragedies not better than the reduction of one?

  **Elena:** Because "reduction of tragedies" is a view from nowhere. I am standing here, in the world, with the drug. David is on my left. The other five are on my right. David says, "I will die." Sarah says, "I will die." David's "I will die" is not less intense because Sarah is also saying it. To save the five because they are five is to tell David: "Your death matters less because others are dying too." It makes his right to life contingent on the demographic accident of who else is in the room.

  **Marcus:** It doesn't make his right to life contingent. It makes *our obligation* contingent on the consequences of our action. Look, let's push your intuition. Keep the drug. Keep the one person on the left. But on the right, there aren't five strangers. There are a thousand.

  **Elena:** Okay.

  **Marcus:** You still flip a coin? You give the single person on the left a 50% chance, and the thousand on the right a 50% chance?

  **Elena:** *Pauses, stirring her coffee.* If I adhere strictly to the principle that numbers don't count intrinsically... yes. Or at least, I am not *obligated* to save the thousand.

  **Marcus:** That's the bullet, Elena. You're willing to let 999 people die—people who could have lived—to give one person a fair shot. If you flip that coin and it lands for the one, you have effectively decided that the lives of 999 people were worth sacrificing for the sake of a procedural notion of fairness. How is that not monstrous?

  **Elena:** It feels monstrous, I grant you. But consider the alternative. If you say I *must* save the thousand, you are asserting that the thousand have a collective weight that crushes the one. At what number does this kick in? Is it 5-1? 10-1? If I am obligated to save the greater number, then the individual is essentially a vessel of value that can be outweighed. If we accept that, what stops us from killing one healthy person to harvest organs for five dying patients?

  **Marcus:** Don't pull the transplant card. That's about rights and constraints on action, not rescue. In the rescue case, everyone is already dying. We are talking about who we *help*, not who we *kill*.

  **Elena:** But the distinction is thinner than you think. By withholding the drug from the one to give it to the thousand, I am letting the one die so the thousand can live. My inaction regarding the one is caused by my action regarding the thousand.

  **Marcus:** Fine. Let's grant the distinction is blurry. The point is the *complaint*. If you save the one, the thousand have a complaint. Each of the thousand can say, "You could have saved me at no extra cost to the one person's chance, had you just chosen us." Wait, no—that's not right. If you flip, the one person has a 50% chance. If you save the thousand, the one person has 0%.

  **Elena:** Exactly. If I save the thousand automatically, I guarantee the one person's death. If I flip, I give the one person a fighting chance.

  **Marcus:** But you give the thousand a *worse* chance. You drop their survival probability from 100% to 50%. Why is it fair to drastically lower the odds for the many to slightly raise the odds for the few?

  **Elena:** Because the "many" aren't a unit! You keep saying "lower the odds for the many." I lower the odds for Sarah, for Jen, for Mike... individually. For Sarah, the choice is between a 50% chance (coin flip) or a 100% chance (aggregation). Yes, she loses out. But if we aggregate, we treat Sarah's gain as a mere increment in a total sum. We treat human lives like ounces of gold. "We have more ounces on the right, so pour the water there." But lives aren't ounces.

  **Marcus:** They aren't ounces, but they are *reasons*. This is where you need to answer me. I'm not summing losses in a metaphysical sense. I'm summing *reasons for action*. I have a reason to save David. I have a reason to save Sarah. I have a reason to save Jen. I have five reasons to go right, and one reason to go left. Unless you tell me that reasons don't aggregate, the math holds.

  **Elena:** Ah, now we're at the core. Do reasons aggregate? Parfit asked this. If I promise to meet you for lunch, and I promise to meet *five* people for lunch, do I have five times the reason to keep my promise? Or do I have five separate conflicts? If I can only keep one promise, is the wrong I do to the five *one big wrong*? Or five small wrongs?

  **Marcus:** It's five small wrongs. But five small wrongs are worse than one small wrong.

  **Elena:** Worse *for whom*? If there is no "whom" who suffers the five wrongs, then "worse" is just a label you're sticking on the universe. Morality is about how we treat individuals. If I treat David with respect, I acknowledge that his life is his own, not a token to be traded against Sarah's. By flipping a coin, I show equal respect to David and Sarah. By saving Sarah automatically, I use David as a means to maximize the "goodness" of the outcome.

  **Marcus:** You're conflating respect with procedure. I respect David by acknowledging his life has value. But I also respect Sarah. If I ignore Sarah's value to give David a coin flip, I am failing to respect Sarah. You say aggregation treats David as a means. I say your coin flip treats Sarah's survival as a bargaining chip to buy David fairness.

  **Elena:** It's not a bargaining chip. It's an acknowledgment of the tragedy. Look, Marcus, imagine you are David. You are standing there, dying. I hold the drug. I look at you, then at the five others. I say, "David, statistically, you should die. Your existence is outweighed." How does that feel?

  **Marcus:** It feels terrible. But if I am Sarah, and you flip a coin and it lands on David, and I die knowing you could have saved me for sure... that also feels terrible. The question isn't how it feels to the loser. It's about what the agent ought to do.

  **Elena:** But the agent is part of the moral community. If I accept that I must save the greater number, I am accepting a principle that allows me to be sacrificed if I am in the minority.

  **Marcus:** We all accept that principle in rescue cases. If there are two lifeboats, one holds ten, one holds two, and a storm is coming, we fill the big one first. We don't draw straws between the groups.

  **Elena:** That's different. That's logistics. In the drug case, the resource is singular. It's all or nothing. Let's go back to your "reasons" argument. You say you have five reasons to go right. I say you have one reason to go right (save Sarah), one reason to save Jen, etc. And you have one reason to go left (save David). When reasons conflict, and they are of the same type (saving a life), and there is no common subject who benefits from the sum... why does the *count* dictate the *obligation*?

  **Marcus:** Because impartiality demands it. If you don't know which person you are—Rawls' veil of ignorance—would you choose the coin flip or the sure save?

  **Elena:** If I don't know who I am, I am thinking like a statistic, not a person. But fine, let's play. If I'm behind the veil, and I care about my own survival, I choose the sure save of the five. I maximize my odds.

  **Marcus:** Exactly. So rationality dictates aggregation.

  **Elena:** But that's self-interest, not morality. Behind the veil, you are calculating risk. In the actual scenario, I am facing *David*. I am not facing a probability. I am facing a human being who will cease to exist. Taurek's point is that the "loss" is only real relative to the subject. Since there is no subject who is "the group of five," the "greater loss" is a fiction.

  **Marcus:** It's not a fiction. It's a description of the state of the world. A world where five people die is worse than a world where one person dies.

  **Elena:** "Worse." There it is. "Worse" implies a scale. Who holds the scale? God? The Universe? If morality is about interpersonal relations, then the only scale that matters is the one between me and David, and me and Sarah. I owe David a chance. I owe Sarah a chance. I cannot give both full chances. So I give them equal chances.

  **Marcus:** But you owe the *group* of five more than you owe the one, because the group contains more claims. You're acting as if "the group" is an abstraction. It's not. It's just... more people.

  **Elena:** And that's where we stall. You see "more people" as a quantitative weight that tips the moral scale. I see "more people" as more distinct, separate moral universes that cannot be merged. If I save the five, I am essentially saying, "The sum of your five lives is greater than his one life." But since no one lives the sum, the comparison is category error.

  **Marcus:** It's not a category error to compare outcomes. We do it every day. We build hospitals in cities rather than villages because more people benefit. We tax the rich to help the poor because the aggregate utility gain is higher.

  **Elena:** And libertarians and rights-theorists object to those very examples! They say you can't violate the rights of the few for the benefit of the many. This is the same structure.

  **Marcus:** Rescue is different from redistribution. In redistribution, you take something from someone. In rescue, you give something to someone. You aren't violating David's rights by not saving him; nature is killing David. You are just choosing who to aid.

  **Elena:** But by choosing who to aid based on numbers, you are making a judgment on the *value* of the aid relative to the recipient. You are saying David is less worthy of aid because he is alone.

  **Marcus:** No! I am saying the *drug* does more good with the five. It's about the efficacy of the resource, not the worth of the person.

  **Elena:** But the "good" is defined by the number of people. If the good is "lives saved," then you've already baked aggregation into your definition of the good. If the good is "acting fairly toward each claimant," then the coin flip wins.

  **Marcus:** So it comes down to the definition of the good.

  **Elena:** It seems so. Either the outcome is the primary moral locus, or the relationship between the agent and the individual is.

  **Marcus:** If the relationship is primary, then you have to explain why you don't save your *friend* over the five strangers. Most people would save the friend.

  **Elena:** Because partiality is permitted in personal relationships. But among strangers, where I have no special tie, I must be impartial. Impartiality to individuals means equal chance, not equal outcome.

  **Marcus:** Impartiality to individuals means weighing their interests equally. If I weigh Sarah's interest (1 unit) and Jen's interest (1 unit), I have 2 units. David has 1 unit. 2 > 1. To ignore that is to be blind to the facts.

  **Elena:** To ignore that is to refuse to treat human lives as units.

  *Silence falls between them. The waitress pours more coffee, looking wary of the intensity at the table.*

  **Marcus:** So, if I understand you: Even at 1 vs. 1000, you maintain that the "loss" of the 1000 is not a single loss that outweighs the one, because the 1000 do not share a consciousness.

  **Elena:** Correct. The tragedy is multiplied, not summed. And multiplied tragedies do not create a heavier moral weight than a single total tragedy for an individual.

  **Marcus:** And I maintain that if you walk away from the 1000 to save the one, you are guilty of a moral blindness that privileges a theoretical purity over actual blood.

  **Elena:** And I maintain that if you sacrifice the one to the "greater good," you are guilty of treating a person as a container of value rather than a sovereign life.

  **Marcus:** We're not moving.

  **Elena:** No. We're not. You see a math problem where the answer is 5. I see a moral problem where the variables can't be added.

  **Marcus:** Then I suppose the only thing left is to ask: If we were the ones dying, which of us would you trust to hold the drug?

  **Elena:** *Smiles faintly.* If you were holding the drug, Marcus, I'd pray you didn't do the math. If I were holding it, I'd pray I didn't flip the coin.

  **Marcus:** Because you'd know exactly what it cost either way.

  **Elena:** Yes. That's the only thing we agree on. The cost is everything.
