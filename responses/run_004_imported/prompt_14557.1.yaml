      *   Even if perdurantism is true, the 80-year-old is part of the same *person* as the 17-year-old.
      *   The "That wasn't me" line works as a *metaphysical literalism* used to evade *moral reality*. This is actually a rich tension. She is using a technical truth (I have changed) to deny a moral truth (I am responsible).
      *   So, the scene remains valid. In fact, it becomes more interesting: she is hiding behind a philosophical technicality to avoid guilt.

