          *   Derek Parfit's *Reasons and Persons* is crucial here. He argues identity isn't what matters; *Relation R* (psychological connectedness) is. Even if identity is loose, responsibility holds if the connection is strong enough.
          *   The mother's defense ("That wasn't me") fails even on perdurantism because the *causal link* exists.

  4.  **Evaluate the Novel's Scene:**
