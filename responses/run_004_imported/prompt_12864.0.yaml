answer: |-
  This is a sharp reading of *Inadequate Equilibria*. You are correct that Yudkowsky's critique of "modesty" is primarily targeted at *institutional* deference and asymmetric competence scenarios (e.g., a layperson deferring to economists, or an outsider deferring to a broken academia). He is arguing against deference to *status* masquerading as deference to *evidence*.

  However, you are asking for the strongest case that Conciliationism (specifically the Equal Weight View) survives in **symmetric peer disagreements**, and how it handles the **self-undermining objection**.

  Here is the argument for why Conciliationism holds in genuine peer cases despite Yudkowsky's "track record" objection, and why it does not self-destruct when applied to itself.

  ### 1. The Track Record Objection vs. Higher-Order Evidence

  Yudkowsky's core move is: *"If you have a track record of success, you are licensed to trust your reasoning over the consensus."*

  In a genuine peer disagreement (like Christensen's restaurant bill), both agents have a track record. Let's assume you and I are both mathematically competent, sober, and have equal history of accuracy in mental arithmetic. We calculate the tip. You say \$43. I say \$45.

  **The Yudkowsky/Steadfast Move:**
  "I checked my work. My cognitive faculties feel engaged. My track record says I'm usually right. Therefore, the fact that you disagree is likely due to *your* error, not mine. I should stick to my guns."

  **The Conciliationist Counter: The Bootstrapping Problem**
  The strongest argument for Conciliationism here isn't about "humility" or "crowd wisdom." It is about **question-begging**.

  To use your track record as a reason to dismiss my disagreement, you must assume that your cognitive faculties are functioning correctly *in this specific instance*. But the fact of our disagreement is **higher-order evidence** that one of us is malfunctioning *right now*.

  If you say, "I'm right because my reasoning tells me I'm right, and I trust my reasoning," you are using the very faculty under suspicion to vindicate itself. You are assuming the conclusion (that your reasoning is currently reliable) to prove the conclusion.

  **The "Drug Case" Analogy (Elga):**
  Imagine you know you took a drug that makes 50% of people unable to do mental arithmetic. You calculate the bill as \$43. A friend (who didn't take the drug) calculates it as \$45.
  Even if your calculation *feels* lucid, the fact that a sober peer disagrees is evidence that you might be in the impaired 50%. To ignore their disagreement is to assume you aren't impaired without independent evidence.

  In the standard peer case, the disagreement *itself* functions like the drug warning. It signals a potential local failure mode. Your general track record establishes you as a peer *ex-ante*, but it does not inoculate you against specific errors *ex-post*. The disagreement is new evidence that wasn't available when you established your track record.

  **Why Yudkowsky's Distinction Matters Here:**
  Yudkowsky is right that you shouldn't defer to "consensus" if the consensus is based on social incentives rather than truth-tracking (the "Inadequate Equilibria" scenario). But in a **genuine peer case**, by definition, the other person is tracking truth with the same tools you are.
  *   If the institution is broken, their belief is not evidence of truth.
  *   If the peer is genuine, their belief *is* evidence of truth (because it stems from the same evidence/competence relation you possess).

  Conciliationism survives the track record objection because **general reliability does not entail specific infallibility**, and disagreement is specific evidence of specific fallibility.

  ### 2. The Self-Undermining Objection

  This is the heavier lift. The objection runs:
  1.  Conciliationism says: "If an epistemic peer disagrees with you, you should significantly adjust your confidence."
  2.  There are many epistemic peers (smart philosophers) who disagree with Conciliationism (Steadfasters, Total Evidence Viewers).
  3.  Therefore, a Conciliationist should significantly adjust their confidence in Conciliationism.
  4.  If they adjust enough, they abandon Conciliationism.
  5.  Therefore, Conciliationism is self-defeating.

  To defend Conciliationism here without resorting to ad-hoc exemptions ("it applies to everything except me"), we need to distinguish between **object-level reasoning** and **framework-level reasoning**.

  #### A. The "Epistemic Circularity" Defense
  To apply the Conciliationist norm, you must first **identify a peer**. To identify a peer, you must evaluate their competence and the symmetry of evidence. To do *that*, you must use an epistemic framework.

  If you are a Conciliationist, you use Conciliationism to evaluate whether someone is a peer. If you encounter a Steadfaster who says, "Disagreement isn't evidence," you cannot treat them as a peer *regarding the norm of disagreement* without begging the question.
  *   If you accept their view (Steadfastness) to evaluate them, you don't need to conciliate.
  *   If you use your view (Conciliationism) to evaluate them, they fail the peer test on this specific issue because they deny the normative force of the evidence you think exists.

  This sounds like an exemption, but it's structural. You cannot use a rule to invalidate the conditions required to apply the rule. You need a "fixed point" in your epistemology to measure disagreement against. If the ruler shrinks because someone says it's too long, you can't measure anything. A Conciliationist is licensed to be Steadfast about the *norms of reasoning* because those norms are the prerequisite for processing the disagreement in the first place.

  #### B. The "Right Reasoning" Defense (Kelly/Christensen nuance)
  A more sophisticated version of Conciliationism (often called the **Total Evidence View**) argues that disagreement is *some* evidence, but not necessarily *equal* evidence.

  In the restaurant case, the only evidence available is the calculation and the disagreement. Since the evidence is symmetric, the weight is equal.
  In the epistemology case, the evidence is **not symmetric**.
  *   You have access to the arguments *for* Conciliationism (the bootstrapping argument, the drug case, etc.).
  *   You have evaluated the Steadfaster's arguments and found them wanting (otherwise you wouldn't be a Conciliationist).

  When you disagree with a Steadfaster about epistemology, you aren't just seeing that they disagree; you are seeing that they disagree *despite* the arguments you find compelling.
  *   **Scenario A (Restaurant):** I see the math, you see the math. We differ. I have no access to *why* you differ. -> **Conciliate.**
  *   **Scenario B (Epistemology):** I see the arguments for Conciliationism. You reject them. I have access to the *reasons* for my belief, not just the belief itself. -> **Stick to guns (mostly).**

  The Conciliationist can argue: "I respect you as a peer generally, but on this specific topic, I have evaluated the first-order evidence (the arguments for/against conciliationism) and concluded I am right. Your disagreement is higher-order evidence, but it is outweighed by the first-order evidence of the arguments themselves."

  This avoids self-undermining because it treats the belief in Conciliationism as a belief supported by **arguments**, not just a bare intuition subject to headcounts.

  ### 3. Synthesizing the Strongest Position

  The strongest version of Conciliationism that survives Yudkowsky's critique looks like this:

  1.  **Domain Restriction:** Conciliationism applies strongly in **informationally symmetric** environments (the restaurant bill, two sensors measuring the same temperature) where the disagreement is the *only* new evidence. It applies weakly or not at all in **informationally asymmetric** or **incentive-corrupted** environments (Yudkowsky's examples of academia or politics), where the "consensus" is not a reliable truth-tracking signal.
      *   *This concedes Yudkowsky's point:* Don't defer to broken institutions.
      *   *This keeps Conciliationism:* Do defer to genuine peers on neutral ground.

  2.  **Higher-Order Evidence as Defeasible:** Disagreement provides higher-order evidence that you might be wrong. However, higher-order evidence can be overridden by strong first-order evidence.
      *   In the restaurant case, first-order evidence (my calculation) is weak/fallible. Higher-order evidence (peer disagreement) is strong. -> **Conciliate.**
      *   In the epistemology case, first-order evidence (the logical arguments for Conciliationism) is strong. Higher-order evidence (philosophers disagree) is present but weaker than the logical force of the arguments. -> **Remain Steadfast.**

  3.  **The Framework Exception:** One cannot apply epistemic norms to undermine the very cognitive architecture required to apply norms. You must be Steadfast about the rules of the game to play the game.

  ### Conclusion

  Yudkowsky is right that "modesty" is often a shield for laziness or status-deference in complex, asymmetric systems. He is wrong that this invalidates Conciliationism in symmetric, peer-to-peer contexts.

  The "track record" objection fails because general reliability does not rule out local error, and disagreement is specific evidence of local error.
  The "self-undermining" objection fails because epistemic norms are the *tools* used to weigh disagreement, not just another belief to be weighed. You can consistently hold that "disagreement usually requires conciliation" while believing "the arguments for this principle are strong enough to withstand the disagreement of those who haven't been convinced by them."

  This preserves the core insight of Conciliationism (disagreement is evidence) without collapsing into the global skepticism Yudkowsky rightly attacks.
