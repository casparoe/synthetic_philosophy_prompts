prompt: |-
  I sit on the compensation and governance committee of a small nonprofit legal aid clinic. Our bylaws, drafted a decade ago by a founder with a philosophy background, include a clause I only recognized as Rawlsian after a friend in my reading group pointed it out: staff compensation is to be set the way principles chosen behind a veil of ignorance — as to whether one will turn out to be an attorney or a client here — would set them, and any resulting inequality in pay must satisfy Rawls's difference principle by working to the benefit of the clinic's least-advantaged stakeholders, understood in practice as both our lowest-paid staff and the low-income clients we exist to serve. The clause has never mattered until now. Our only attorney with the trial experience to handle contested asylum appeals has an outside offer at nearly three times her current salary, and says she will take it unless the board approves a comparable retention raise. Our executive director argues this is exactly the situation the difference principle was designed to license: losing this attorney would leave asylum clients, who have essentially no other path to representation, without appellate coverage for the better part of a year, so paying her more — even though it stretches our internal pay scale — leaves our worst-off clients better off than flat equality would, which is just what parties behind the veil of ignorance would have chosen. Two other committee members, both of whom studied philosophy, disagree, pressing a version of G.A. Cohen's objection to this style of reasoning: if the attorney is genuinely committed to the clinic's mission, she should not need to be paid three times as much to keep doing work she says she believes in, and rewarding a credible exit threat only teaches staff to develop one, hollowing out the ethos the bylaws were meant to protect rather than honoring the principle they invoke.

  Please draft the short memo I will circulate to the full committee ahead of our vote. It should recommend one specific resolution — approving the raise, rejecting it, or approving some conditional or time-limited version — rather than dodge the disagreement by simply presenting both sides. Before landing on that recommendation, it should state the Cohen-style objection in its strongest form, including the natural Rawlsian reply that a principle meant to govern the basic structure of institutions was never intended to presuppose that individuals will renounce ordinary self-interested bargaining within the rules of an already-just scheme, and it should close by specifying what evidence or review point, if any, would count as vindicating the losing side later.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Compensation and Governance Committee of a small nonprofit legal aid clinic.
      *   **Audience:** The full committee (including the ED, the two philosophy-trained members, and others).
      *   **Task:** Draft a short memo recommending a specific resolution regarding a retention raise for a key attorney.
      *   **Context:**
          *   Bylaws contain a Rawlsian clause (Veil of Ignorance + Difference Principle).
          *   Situation: Key attorney (asylum appeals) has an outside offer at 3x current salary. Threatens to leave without a match.
          *   Argument For (ED): Difference Principle licenses this inequality because it benefits the least advantaged (clients) who would otherwise lose representation.
          *   Argument Against (2 Members): G.A. Cohen-style objection. Incentivizing bad behavior/threats undermines the ethos. If she believed in the mission, she wouldn't need 3x pay.
      *   **Requirements:**
          *   Recommend *one* specific resolution (Approve, Reject, or Conditional).
          *   State the Cohen-style objection in its strongest form.
          *   Include the Rawlsian reply (Basic Structure vs. Individual Choice).
          *   Specify evidence/review point that would vindicate the losing side later.
          *   Tone: Professional, philosophical but practical, decisive.

  2.  **Determine the Recommendation:**
      *   *Option A: Approve the raise.* Risks validating extortionate behavior, blows up the pay scale, validates the Cohen critique (ethos erosion).
      *   *Option B: Reject the raise.* Risks losing the attorney, harming clients (violating the Difference Principle's goal of helping the least advantaged), potential legal/operational crisis.
      *   *Option C: Conditional/Time-Limited.* This seems the most prudent governance path. It acknowledges the immediate necessity (saving the clients) while mitigating the long-term ethos risk (Cohen's worry). It treats this as an emergency exception rather than a new precedent.
      *   *Decision:* Recommend a **conditional, time-limited retention bonus/raise** with a sunset clause and a commitment to review the structural implications. This balances the immediate need to help the "least advantaged" (clients) against the long-term health of the "basic structure" (staff ethos).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly up front.
      *   **The Philosophical Conflict (The Core):**
          *   Need to articulate the Cohen objection strongly. It's not just "she's greedy"; it's about the *ethos of justice*. If the rules rely on threats to function, the community is corrupted.
          *   Need to articulate the Rawlsian reply. Rawls governs the *basic structure*, not individual moral choices within it. We can't assume altruism in a market economy, even within a nonprofit. The priority is the outcome for the worst-off.
      *   **The Recommendation:** Propose the conditional raise. Why? It accepts the Rawlsian necessity *for now* (clients need help) but builds in safeguards against the Cohen risk (don't make this a permanent precedent).
      *   **Vindication Criteria:** How do we know later if we were right or wrong?
          *   If we pay and morale/ethos holds + clients served = Rawlsian view vindicated.
          *   If we pay and more threats emerge + mission drift = Cohen view vindicated.
          *   Need a specific review timeline (e.g., 12 months).

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Check:* Did I represent Cohen fairly? Cohen argues that in a truly just society, people wouldn't *need* incentives to do the right thing. Applying strict incentives creates a society where justice is only bought. In a nonprofit, this is acute.
      *   *Check:* Did I represent Rawls fairly? Rawls focuses on institutions. The "Veil of Ignorance" asks what rules we'd set. If we didn't know if we were the lawyer or the client, would we allow a spike in pay to ensure representation? Probably yes, *if* it's the only way.
      *   *Tone Check:* Avoid being condescending to the philosophy majors or the ED. Use the philosophy to bridge the gap, not widen it.
      *   *Specifics:* The raise is "nearly three times." That's huge. A straight salary increase might be unsustainable. A "retention bonus" or "temporary adjustment" is better governance. Let's recommend a temporary adjustment tied to a specific caseload or timeframe.

  5.  **Drafting the Content (Iterative Process):**
      *   *Subject Line:* Needs to be clear. "Recommendation re: Attorney Retention & Bylaw Interpretation."
      *   *Recommendation:* Approve a *temporary* market adjustment, not a permanent tripling of base salary. This splits the difference.
      *   *Cohen Section:* Focus on "incentive erosion." If we pay the threat, we teach staff that leverage > mission.
      *   *Rawls Section:* Focus on "consequences for the worst-off." The clients are the ultimate "least advantaged." No lawyer = no justice.
      *   *Resolution:* 18-month adjustment. Review at 12 months.
      *   *Vindication:* If no other threats arise within 2 years, Rawls wins. If turnover/threats spike, Cohen wins.

  6.  **Final Polish:**
      *   Ensure the "Veil of Ignorance" language is used correctly.
      *   Make sure the "Basic Structure" distinction is clear.
      *   Keep it concise (it's a memo).

  7.  **Final Review against Constraints:**
      *   Recommend one resolution? Yes (Conditional/Time-limited).
      *   State Cohen objection strongly? Yes.
      *   Include Rawlsian reply (Basic Structure)? Yes.
      *   Specify evidence/review point for vindication? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm dismissing the Cohen objection. It's a valid governance risk. The recommendation should acknowledge that risk explicitly. The "Conditional" nature is the direct response to Cohen.

  *(Refining the Vindication)*: It needs to be measurable. "Culture" is hard to measure. "Incidence of retention threats" is better. "Client outcomes" is also key.

  *(Finalizing the Recommendation)*: A permanent 3x raise is dangerous. A temporary "retention premium" is better. It acknowledges the market reality without rewriting the internal equity structure permanently.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Compensation and Governance Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Attorney Retention and Bylaw Interpretation

  **Recommendation**
  I recommend that the Committee approve a **time-limited retention adjustment** rather than a permanent base salary increase. Specifically, we should authorize a market-based premium effective immediately, set to expire in 18 months or upon the hiring of a second appellate attorney, whichever comes first. This approach authorizes the inequality required to retain counsel but treats it as an emergency exception to our pay structure rather than a new precedent.

  **The Philosophical Conflict**
  Our bylaws require us to balance two competing interpretations of justice. To decide wisely, we must confront the strongest version of the objection raised by our colleagues.

  *The Cohen-Style Objection*
  G.A. Cohen argued that a society truly committed to egalitarian justice cannot rely on incentives that appeal to self-interest without corroding the communal ethos required to sustain that justice. Applied here: If we validate a threat to leave based on salary, we signal that commitment to our mission is contingent on market rates. This transforms our staff from partners in a shared project into mercenaries within it. By rewarding the exit threat, we risk creating a "moral hazard" where future staff feel compelled to secure outside offers to justify their worth, ultimately hollowing out the solidarity our bylaws were designed to protect. If the Difference Principle is used to justify inequalities driven by individual bargaining power rather than structural necessity, it ceases to be a principle of justice and becomes a tool of leverage.

  *The Rawlsian Reply*
  However, Rawls intended the Difference Principle to govern the **basic structure** of institutions, not to presuppose that individuals will renounce ordinary self-interested bargaining within an already-just scheme. Behind the Veil of Ignorance, we do not know if we will be the staff member or the asylum seeker. Knowing that legal representation is a life-or-death necessity for our clients, rational parties would prioritize the *availability* of counsel over strict internal pay parity. If the only way to secure representation for the least advantaged (our clients) is to accommodate market realities for the attorney, the principle licenses that inequality. To refuse the raise is to prioritize the purity of our internal ethos over the tangible welfare of the vulnerable population we exist to serve.

  **Rationale for Conditional Approval**
  A permanent tripling of salary risks validating the Cohen objection by permanently distorting our basic structure. A time-limited adjustment acknowledges the Rawlsian necessity (clients need representation *now*) while mitigating the Cohen risk (we do not institutionalize threat-based bargaining). It treats this as a structural gap to be fixed (by hiring more capacity) rather than a permanent feature of our compensation philosophy.

  **Vindication Criteria**
  We will know which philosophical framework was correct based on the following review metrics at the 18-month sunset point:

  1.  **Vindicating the Rawlsian View:** If client appellate win rates remain stable or improve during this period, and **no other staff members** submit outside offers as leverage for raises during the 18-month term, we can conclude the inequality benefited the least advantaged without corrupting the ethos.
  2.  **Vindicating the Cohen Objection:** If, within 12 months of this approval, **two or more additional staff members** formally utilize outside offers to negotiate compensation, we must acknowledge that the incentive has eroded our communal norms. In that event, the Committee should convene to revert the adjustment early and implement a strict no-negotiation policy for future retention.

  We must act to save the cases at hand without mortgaging the culture required to handle them in the future.
