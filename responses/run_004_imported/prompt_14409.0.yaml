answer: |-
  **Setting:** *A kitchen, 1:30 AM. Two empty wine bottles sit on the counter. Elias is leaning against the sink; Mara is perched on a stool, spinning a wine glass by the stem.*

  **Mara:** It's the Hacking thing. I can't shake it. You saw Sarah, right? Two years ago she was just… scattered. Stressed. Now? She's *ADHD*. It's not just a diagnosis; it's her operating system. She explains every lateness, every lost key, every emotional spike through it. And honestly? The symptoms got sharper after the name stuck.

  **Elias:** Because she finally stopped fighting herself. She got medication. She got accommodations. She stopped calling herself lazy and started calling it a deficit. That's not the category changing the person; that's the person finally aligning with the reality of their brain.

  **Mara:** But that's the loop, Elias. The classification changed the behavior, which changes the classification. If ADHD were a natural kind—like gold, or a virus—it shouldn't matter what she thinks about it. Gold doesn't care if you call it gold. But people care. When you give someone a script for who they are, they act out the script.

  **Elias:** You're confusing the *experience* of the illness with the *mechanism* of the illness. Look, before germ theory, people thought cholera was caused by bad air or moral sin. They reacted to that. They prayed, they fled cities. Did that mean the *vibrio cholerae* bacteria wasn't real? Did it mean the bacteria changed because they prayed? No. The underlying thing was stable. We just had bad theories about it.

  **Mara:** But psychiatry isn't bacteriology. There is no microscope for ADHD. There's no blood test. You have a cluster of behaviors: forgetfulness, impulsivity, hyperfocus. But what counts as "impulsive" or "forgetful" depends entirely on what society demands of you. In 1950, that kid was a discipline problem. In 2024, he's neurodivergent. The "kind" shifts because the cultural context shifts.

  **Elias:** The context shifts, sure. But the dopamine transporters don't. The neural pathways don't. We can see the under-arousal in the prefrontal cortex on a scan. That's physical. That's stable. Just because our *social understanding* of it evolves doesn't mean the biological substrate is a moving target. You're treating the diagnosis like it's the disease.

  **Mara:** I'm treating the diagnosis like it's a feedback loop. Here's my point: If I tell you you have a virus, you isolate and take meds. If I tell you you have ADHD, you start curating your identity around executive dysfunction. You join communities. You watch TikToks about it. You start noticing symptoms you ignored before because now they're *signal* instead of *noise*. That awareness physically alters how you process your own failures. It changes the stress response. So the biology *does* change, but it changes *because* of the label.

  **Elias:** Okay, fine. The *expression* changes. The severity might fluctuate based on self-concept. But the *capacity* is the limit. Sarah couldn't focus before the diagnosis either. She was just miserable about it. The meds work regardless of whether she identifies as "ADHD" or "tired." If I give her methylphenidate, her working memory improves. That proves there's a mechanical breakage there that we're fixing.

  **Mara:** Does it? Or does it prove we have a chemical that alters attention in *anyone*, and we've decided that only people with this specific label need it? But look deeper. You say the biology is the stable kind. But if the looping effect is real, then the biology of a person diagnosed in 2024 is literally different from the biology of a person with the same traits in 1980. Because the 2024 brain has developed under the expectation of deficit. It's wired for coping with a diagnosed condition.

  **Elias:** That's a huge leap. You're saying the label creates the deficit?

  **Mara:** I'm saying the label creates the *kind*. Hacking called it "making up people." It's not that the suffering is fake. It's that the *category* "ADHD" isn't a bucket we're filling with discoveries. It's a engine we're running. The more we define it, the more people fit themselves into it, which forces us to redefine it. A virus doesn't read the DSM. People do.

  **Elias:** But why does the suffering persist if we take the label away? I've seen kids who can't function in school, who are dangerous to themselves, before they ever hear the word "disorder." The pain is antecedent to the name. If you strip away the social looping, there is still a kid who can't sit still and fails every class. What is that, if not a real thing?

  **Mara:** It's a real *problem*. I'm not denying the pain. I'm denying that "ADHD" is a natural kind waiting to be found. It's a negotiated settlement between biology and culture. It's a way of saying, "This specific cluster of suffering belongs to *this* category of person." But because people inhabit that category, they change the cluster.

  **Elias:** So what's the alternative? If we tell people, "This category is unstable, it's a moving target," you undermine treatment. You give ammo to the people who say it's all a pharma conspiracy. If I tell Sarah, "Your diagnosis is a looping effect," she stops taking her meds.

  **Mara:** Or she gains agency. If she thinks it's a fixed biological defect, she's stuck with it. It's her essence. If she understands it's a loop, she realizes she can intervene in the loop. She can change how she relates to the symptoms. Realism locks people into the diagnosis. Interactionism lets them breathe.

  **Elias:** That's dangerous optimism. You can't cognitive-behavioral therapy your way out of a neurotransmitter shortage. Look, I get the philosophy. I do. But in the clinic, when the fog lifts, it's because we hit a biological target. The loop might explain why she *likes* the diagnosis, or why she joins a support group. It doesn't explain why the methylphenidate blocks the reuptake transporter. That is not social. That is chemistry.

  **Mara:** But the *reason* we block the transporter is to achieve a *social* outcome: sitting still in a classroom. Holding a job. Not interrupting. We are tuning the brain to fit the environment. If the environment changes—if we valued hyperactivity as entrepreneurship—the "disorder" might vanish, even if the chemistry stayed the same.

  **Elias:** So it's only a disorder because capitalism demands focus?

  **Mara:** It's a mismatch. But you're treating the mismatch as a defect in the person. I'm saying the "kind" is the relationship between the person and the demand. You can't isolate the person from the demand and still have the same "kind."

  **Elias:** But the person still crashes without the meds. Regardless of the demand. Sarah crashed when she was on vacation. She crashes when she's trying to relax. It's not just about fitting into capitalism. It's internal chaos.

  **Mara:** Internal chaos shaped by a lifetime of being told you're failing to meet demands. The anxiety of the potential failure becomes the inability to focus. It's a self-fulfilling prophecy that gets written into the neural pathways.

  **Elias:** Then why do twins have such high concordance rates? Why is it heritable? You can't inherit a social loop.

  **Mara:** You inherit the *susceptibility* to the loop. You inherit a temperament. But "ADHD" isn't just temperament. It's the medicalization of that temperament. The looping effect explains why the rates are skyrocketing. It's not that we're "finding" more cases like we're finding new islands. It's that the category has expanded to swallow more of the temperament.

  **Elias:** Or… we stopped missing them. We stopped calling them "bad kids" and started calling them "sick kids." That's progress. That's moral progress. The looping effect makes it sound sinister, like we're contaminating the population with ideas. I see it as giving people a vocabulary for their pain.

  **Mara:** Vocabulary is power. But it's also a cage. If the category is a moving target, we can't claim scientific realism about it. We have to admit we're building it as we go.

  **Elias:** We build all science as we go. Physics changed from Newton to Einstein. Did gravity stop being real?

  **Mara:** Gravity doesn't know it's being measured. Sarah knows.

  **Elias:** *Pause.* He takes a sip of wine.

  **Elias:** Okay. She knows. So the observation affects the subject. Quantum physics has that problem too. The observer effect.

  **Mara:** But in quantum physics, the particle doesn't start identifying as a wave. It doesn't join a community of waves.

  **Elias:** *Smiles slightly.* True. But here's where I stick. Even if the loop exists, even if the category shifts… there's a wall there. Sarah hits the wall. I hit the wall. Some people hit it harder. The meds lower the wall. The label helps you climb it. But the wall is real. Whether you call it "ADHD" or "Executive Dysfunction" or "Moral Failing," the wall is there. I think there's a biological reality to the wall, even if the paint on it changes color every decade.

  **Mara:** I'll grant you the wall. I won't grant you that "ADHD" is the name of the brick. "ADHD" is the story we tell about why the wall is there. And that story changes the height of the wall.

  **Elias:** Then we need better stories. But we can't stop telling them.

  **Mara:** No. We just have to remember we're holding the pen.

  **Elias:** And the bricks are still hard.

  **Mara:** *Clinks her glass against his.* And the bricks are still hard.
