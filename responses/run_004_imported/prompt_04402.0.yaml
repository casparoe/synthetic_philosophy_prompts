      *   **The Crucial Distinction:** Sunday Beauty knows it is Sunday. Waking Beauty does not know if it is Monday or Tuesday. Waking Beauty has *less* temporal information. She has undergone "rational forgetting."
      *   **The Verdict:** Restrict Reflection. It applies to standard learning, not amnesia/self-location. This allows us to keep the fair coin intuition (1/2 on Sunday) and the betting intuition (1/3 on waking).
