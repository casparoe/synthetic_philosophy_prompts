prompt: |-
  A friend and I were originally arguing about multiple realizability, of all things, and somehow ended up spending most of the evening on a much narrower question that neither of us could resolve: whether Sydney Shoemaker's "subset" account of realization actually earns non-reductive physicalists an escape from Kim's causal exclusion argument, or whether it just relocates the problem. My friend's position was that once you define realization so that a mental property's causal powers are, by construction, a proper subset of its physical realizer's causal powers, the exclusion worry simply evaporates: there is no longer a distinct, competing sufficient cause for the physical cause to screen off, since the mental instantiation isn't causally separate from the physical one in the first place, just narrower. She also insisted that this is basically the same move Stephen Yablo made years earlier with his determinable/determinate proposal, just dressed up in the language of causal powers instead of properties, so that anyone who accepts one should accept the other, and any objection to one is an objection to both.

  I wasn't so sure, on either count. On the first point, it seems to me that individuating a mental property partly by way of a strict subset relation to its realizer's powers risks either trivializing realization into type-identity wearing a nonreductive costume, or leaving the "included" powers unable to do any explanatory work that isn't already done by the superset, which just looks like exclusion again under a different name. On the second point, I recall that the determinable/determinate relation is supposed to satisfy some fairly specific formal constraints, e.g., that no two determinates of a single determinable can be co-instantiated, and that no property can be a determinate of more than one determinable, and I don't see why the mental/physical case, especially once multiple realizability is in play, is guaranteed to satisfy those constraints just because it satisfies the more permissive subset-of-powers condition. So it seemed to me the two strategies could come apart even though they're often presented as siblings.

  Could you help adjudicate this? I'd like you to (1) spell out as precisely as you can why a subset of causal powers is supposed to be immune to exclusion in a way that a merely correlated or supervenient property isn't, (2) assess whether the subset strategy and the determinable/determinate strategy really are notational variants of one another or whether they face distinct objections, and (3) tell me, with reasons, which of the two you find more promising as a response to Kim, or whether you think both ultimately fail for the same underlying reason.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Topic:** Non-reductive physicalism, specifically Sydney Shoemaker's "subset account" of realization vs. Jaegwon Kim's Causal Exclusion Argument.
      *   **Secondary Comparison:** Shoemaker's subset account vs. Stephen Yablo's determinable/determinate account.
      *   **User's Friend's Position:**
          1.  Subset account solves exclusion because mental powers are a *subset* of physical powers (no competition, just narrowing).
          2.  Subset account is effectively the same as Yablo's determinable/determinate move (notational variants).
      *   **User's Position:**
          1.  Subset account might trivialize realization (type-identity in disguise) or still face exclusion (superset does all the work).
          2.  Subset account and determinable/determinate are *not* the same because MR (multiple realizability) violates formal constraints of determinables (e.g., unique determinable parent).
      *   **Tasks:**
          1.  Explain *why* the subset account claims immunity to exclusion (vs. mere correlation/supervenience).
          2.  Assess the equivalence claim (Subset vs. Determinable/Determinate).
          3.  Adjudicate which is more promising (or if both fail).

  2.  **Task 1: The Subset Account and Exclusion Immunity:**

      *   *Kim's Argument:* If $P$ causes $P^*$, and $M$ supervenes on $P$, does $M$ cause $P^*$? If $M$ is distinct from $P$, we have overdetermination. If not overdetermined, $P$ screens off $M$.
      *   *Shoemaker's Move:* Properties are individuated by causal powers. $M$ is realized by $P$ iff the powers of $M$ are a *subset* of the powers of $P$.
      *   *The "Immunity" Claim:* It's not that $M$ and $P$ are two *separate* causes competing for the effect. $M$'s causal contribution is *contained within* $P$'s contribution. When $P$ causes $E$, it does so in part by exercising the powers that constitute $M$. Therefore, citing $M$ isn't citing a *rival* cause; it's citing a *aspect* of the cause.
      *   *Contrast with Supervenience:* Standard supervenience says $M$ depends on $P$ but doesn't specify the causal overlap. Kim treats them as distinct events/properties. Shoemaker makes them metaphysically linked via powers.
      *   *Key Distinction:* Token identity vs. Type distinctness. The *instance* of the power is the same, but the *property* is defined by a subset.
      *   *Potential Weakness:* If $P$ has *more* powers, why do we need $M$? (The "explanatory exclusion" worry remains even if "causal exclusion" is dodged).

  3.  **Task 2: Subset vs. Determinable/Determinate (Yablo):**

      *   *Yablo's View:* $M$ is a determinable of $P$ (the determinate). Example: Red (M) vs. Scarlet (P). If Scarlet causes the peck, Red doesn't compete; Red is *how* Scarlet caused it (in a general way).
      *   *Friend's Claim:* They are the same move.
      *   *User's Claim:* They come apart due to Multiple Realizability (MR).
      *   *Analysis:*
          *   *Similarity:* Both rely on a non-competitive hierarchical relation. Both try to avoid overdetermination by making the higher-level property "contained in" the lower-level one.
          *   *Difference (Formal Constraints):* Determinables usually require a specific logical structure (determinates under a determinable are mutually exclusive).
          *   *The MR Problem:* If Pain is realized by C-fibers firing ($P_1$) in humans and silicon chips ($P_2$) in robots, is Pain a determinable of *both*?
              *   Standard Determinable theory: A determinate usually falls under *one* determinable (uniqueness).
              *   Shoemaker's Subset: A property $M$ can be a subset of $P_1$'s powers and $P_2$'s powers without $P_1$ and $P_2$ sharing a specific determinable relation *with each other*.
          *   *Conclusion:* They are *analogous* strategies but not notational variants. Shoemaker's is more flexible for MR. Yablo's faces the "many determinables" problem.

  4.  **Task 3: Adjudication (Which is more promising?):**

      *   *Critique of Subset:*
          *   *Individuation:* If properties are *just* clusters of powers, and $M$'s powers are a subset of $P$'s, is $M$ really distinct? If $M$ is *only* its powers, and those powers are identical to some of $P$'s, isn't $M$ just a fragment of $P$?
          *   *Causal Work:* Even if $M$'s powers are a subset, the *exertion* of the power is done by the particular physical instance. Does the subset property *do* anything, or is it just a classification?
          *   *The "Too Many Properties" Objection:* Every subset of powers constitutes a property? That's an explosion of properties.
      *   *Critique of Determinable:*
          *   *MR Issue:* As noted above, it's hard to fit MR into the determinable model without stretching the definition.
          *   *Proportionality:* Yablo relies on causal proportionality. But Kim argues physical closure demands the *specific* physical cause.
      *   *Verdict:* Shoemaker's subset account is technically more robust for physicalism because it grounds the relation in the metaphysics of properties (powers) rather than conceptual/logical relations (determinables). However, *both* face the "Causal Inheritance" dilemma: If $M$ inherits $P$'s causal powers, $M$ is causally redundant. If $M$ has *new* powers, physicalism is violated. Shoemaker tries to thread the needle (subset, not identical, not new), but Kim would argue the *instance* of the power is the physical instance.
      *   *My Stance:* Shoemaker's is more promising *structurally*, but both likely fail to satisfy a hardline Kim-style exclusionist because they don't solve the "token-level competition" problem. The physical token does the work; the property classification is descriptive. However, Shoemaker offers a better metaphysical grounding for *why* the mental isn't epiphenomenal (it *is* the causal power, just abstractly described).
      *   *Refinement:* I need to be careful not to just say "both fail." I need to evaluate which *response* is better. Shoemaker's is better because it addresses the *nature* of properties, whereas Yablo's addresses the *description* of causation. But the User's skepticism about trivialization is well-founded.

  5.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the depth of the debate. It's a classic metaphysics knot.
      *   *Section 1: The Subset Account & Exclusion.*
          *   Define Shoemaker's view (Properties = Clusters of Powers).
          *   Explain Realization (Subset relation).
          *   Explain the Exclusion Dodge: No competition because the causal *oomph* is identical at the token level, just different at the type level. It's not $M$ AND $P$ causing $E$; it's $P$ causing $E$ *by virtue of* the powers that constitute $M$.
          *   Address the "Correlation" contrast: Supervenience allows distinctness; Subset implies metaphysical containment.
      *   *Section 2: Subset vs. Determinable.*
          *   Acknowledge the similarity (both non-competitive).
          *   Highlight the User's insight on MR.
          *   Explain the Formal Constraints of Determinables (mutual exclusion of determinates, uniqueness of determinable).
          *   Show how MR violates this (Pain realized by distinct physical bases that aren't determinates of a single physical determinable).
          *   Conclusion: Not notational variants. Subset is more flexible.
      *   *Section 3: Adjudication.*
          *   Evaluate the "Trivialization" worry (User's Point 1). If $M$ is just a subset of powers, is it a real property? Shoemaker says yes (functional roles).
          *   Evaluate the "Explanatory Work" worry. Does the subset add anything?
          *   Compare promises: Yablo is intuitive but struggles with MR. Shoemaker handles MR but struggles with Property Individuation (inflation).
          *   Final Verdict: Shoemaker is more promising for *physicalists* because it respects causal closure better, but the User's worry about "explanatory exclusion" remains potent. The real problem isn't causal competition, it's explanatory redundancy.
      *   *Tone:* Philosophical, precise, balanced, acknowledging the sophistication of the user's query.

  6.  **Refining the Arguments (Self-Correction during drafting):**

      *   *Correction:* Make sure to distinguish between *type* distinctness and *token* identity. Shoemaker allows type distinctness but token-level power identity.
      *   *Correction on Yablo:* Yablo doesn't strictly require MR to fail, but it makes it awkward. If Pain is a determinable, what is the determinate? "Physical realization of pain"? That's disjunctive. Disjunctive properties are usually banned from being determinates. This supports the User's view that they come apart.
      *   *Correction on Kim:* Kim's argument is about *sufficiency*. If $P$ is sufficient, $M$ is unnecessary. Shoemaker says $M$ isn't "unnecessary" because $M$ *is* the relevant aspect of $P$. But Kim asks: Why not just cite $P$? Shoemaker's answer: Because we care about *that* subset. Is that enough? Maybe not for *causal* exclusion, but for *explanatory* relevance. I should clarify that distinction.

  7.  **Final Polish:** Check against the three specific prompts in the user's request.
      1.  Spell out immunity claim. (Done)
      2.  Assess notational variant claim. (Done - they differ on MR)
      3.  Adjudicate promise/failure. (Done - Shoemaker better metaphysics, but both struggle with explanatory redundancy).

  8.  *(Final check of the "Subset" mechanics)*: Shoemaker argues that if $M$'s powers are a subset of $P$'s, then whenever $P$ is instantiated, $M$ is instantiated (forward realization). But crucially, the *causal contribution* of $M$ is not *additional* to $P$. It is *included*. This avoids overdetermination. The worry is whether $M$ contributes *anything distinct*. If the powers are identical, the contribution is identical. So $M$ is causally efficacious *only because* $P$ is. This is Causal Inheritance. Kim accepts Causal Inheritance but argues it leads to epiphenomenalism if $M$ is distinct. Shoemaker argues $M$ isn't distinct *in the relevant causal sense*.

