answer: |-
  This is a sophisticated dispute that cuts to the heart of contemporary metaphysics of mind. You and your friend have identified the two most critical pressure points in the debate: the metaphysical mechanics of the "subset" move against exclusion, and the relationship between Shoemaker's powers-based ontology and Yablo's more traditional property-based ontology.

  Here is an adjudication of the three specific points you raised.

  ### 1. Why the Subset Account Claims Immunity to Exclusion

  To understand why Shoemaker thinks the subset account dodges Kim, we must first look at how Kim generates the problem. Kim's Causal Exclusion Argument relies on the **Principle of Causal Closure** (every physical effect has a sufficient physical cause) and the **No Overdetermination Principle** (effects are not systematically overdetermined by distinct causes).

  If Mental Property $M$ and Physical Property $P$ are distinct, and both are sufficient for Effect $E$, we have overdetermination. To avoid this, Kim argues $P$ screens off $M$. Standard non-reductive physicalism (via supervenience) tries to say $M$ and $P$ are distinct but dependent. Kim replies: dependence isn't enough to stop competition. If they are distinct properties, they are distinct candidates for causal relevance.

  **Shoemaker's Move:**
  Shoemaker changes the individuation conditions for properties. For Shoemaker, properties are individuated by their **causal powers** (what they confer on their bearers).
  *   **Realization:** $M$ is realized by $P$ if and only if the causal powers conferred by $M$ are a **proper subset** of the causal powers conferred by $P$.
  *   **The Immunity Claim:** The exclusion argument assumes $M$ and $P$ are *competitors* for causal relevance. Shoemaker argues they are not competitors because the causal work done by $M$ is **metaphysically contained** within the causal work done by $P$.

  When $P$ causes $E$, it exerts a cluster of powers. Since $M$'s powers are a subset of $P$'s, the exertion of $M$'s powers *just is* part of the exertion of $P$'s powers. There are not two "pushes" against the effect; there is one push (the physical instance) which *counts as* a mental push because it falls under the subset description.

  **Why this differs from mere correlation/supervenience:**
  *   **Supervenience:** Says $M$ cannot change without $P$ changing. It leaves open the possibility that $M$ and $P$ are causally distinct entities that just happen to covary. Kim treats them as distinct causes.
  *   **Subset Realization:** Says $M$ is *constituted* by a portion of $P$'s causal identity. It denies the premise that $M$ is a *separate* sufficient cause that could compete with $P$. It argues that $M$ is causally sufficient *only in virtue of* $P$ being causally sufficient, not as a rival sufficiency condition.

  **Your Worry (Trivialization/Explanatory Work):**
  You noted that this risks trivializing realization or leaving $M$ with no work. This is the **"Causal Inheritance Dilemma."**
  *   If $M$'s powers are identical to a subset of $P$'s, then $M$'s causal contribution is identical to part of $P$'s.
  *   Kim would ask: "Why cite the subset ($M$) rather than the superset ($P$)?"
  *   Shoemaker's reply is that citation depends on explanatory context. But strictly *causally*, you are right to worry: if the physical superset does all the heavy lifting, the mental subset looks like a "causal free rider," even if it isn't technically epiphenomenal.

  ### 2. Subset vs. Determinable/Determinate: Notational Variants?

  Your friend claims Shoemaker and Yablo are making the same move. You suspect they come apart, specifically regarding Multiple Realizability (MR). **You are correct; they are not notational variants, and the MR constraint is the wedge.**

  **The Similarity:**
  Both strategies rely on a **non-competitive hierarchy**.
  *   **Yablo:** If *Scarlet* causes the pigeon to peck, *Red* does not compete. *Red* is a determinable of *Scarlet*. Citing *Red* is just citing *Scarlet* less specifically.
  *   **Shoemaker:** If $P$ causes the behavior, $M$ does not compete. $M$ is a subset of $P$'s powers. Citing $M$ is citing $P$'s causal profile under a specific restriction.

  **The Difference (Formal Constraints):**
  The determinable/determinate relation is governed by strict logical constraints (following Johnson and determinable theory):
  1.  **Mutual Exclusion:** Two determinates of the same determinable cannot be co-instantiated by the same object at the same time (e.g., something cannot be Scarlet and Crimson all over simultaneously).
  2.  **Uniqueness:** A determinate usually falls under a *single* immediate determinable.

  **The Multiple Realizability Problem:**
  This is where your friend's equivalence claim breaks down.
  *   **Yablo's Struggle:** If Pain ($M$) is a determinable, what is its determinate? In humans, it is C-fiber firing ($P_1$). In robots, it is Silicon-state ($P_2$).
      *   Are $P_1$ and $P_2$ determinates of $M$? If so, they must be mutually exclusive (fine) and fall under the *same* determinable.
      *   However, standard determinable theory implies a qualitative similarity between determinates (Scarlet and Crimson are both shades of color). $P_1$ (biological) and $P_2$ (silicon) share no qualitative physical similarity other than "realizing Pain."
      *   To make Yablo work with MR, you have to allow **disjunctive determinates** (Pain is realized by $P_1$ OR $P_2$ OR $P_3$...). But most metaphysicians (including Yablo) reject disjunctive properties as genuine causal bases. If the determinate is disjunctive, the determinable relation loses its metaphysical grip.
  *   **Shoemaker's Flexibility:** Shoemaker does not require $P_1$ and $P_2$ to be determinates of a single physical determinable. He only requires that $M$'s powers be a subset of $P_1$'s powers *and* a subset of $P_2$'s powers.
      *   $P_1$ and $P_2$ can be wildly different physically. As long as they both include the specific forward-looking causal powers that define $M$ (e.g., the power to cause avoidance behavior), $M$ is realized.
      *   Shoemaker avoids the "unique determinable parent" constraint. $M$ can be a subset of many different supersets without those supersets needing to be related to each other as determinates.

  **Verdict on Task 2:** They are **analogous strategies, not notational variants.** Shoemaker's account is metaphysically more flexible regarding MR. Yablo's account is more intuitive but struggles to formalize MR without accepting disjunctive properties, which undermines the determinable relation.

  ### 3. Adjudication: Which is More Promising?

  Both strategies attempt to solve the same problem: how to keep the mental causally relevant without violating physical causal closure. Here is the breakdown of their promise and failure modes.

  **The Case for Yablo (Determinables):**
  *   **Pros:** It aligns with our intuitive explanatory practices. We often cite higher-level properties (e.g., "The glass broke because it was fragile," not "because of silicon-oxygen bond stress"). It handles the "proportionality" of causation well (the cause should be proportional to the effect).
  *   **Cons:** As noted, it crumbles under rigorous MR. If Pain is a determinable, the "determinates" are a heterogeneous mess of physical states that share nothing in common physically. This makes the relation look like a linguistic convenience rather than a metaphysical reality.

  **The Case for Shoemaker (Subset):**
  *   **Pros:** It grounds the relation in the **metaphysics of properties** (powers) rather than conceptual logic. It respects Causal Closure strictly: the physical token does *all* the causing, but the mental property is not distinct *in a way that generates competition*. It handles MR naturally because powers can be shared across distinct physical bases without those bases being "determinates" of each other.
  *   **Cons:** It faces the **"Property Inflation"** objection. If every subset of causal powers constitutes a property, the world is flooded with properties. More damningly, it faces your **"Explanatory Exclusion"** worry. Even if $M$ isn't *causally* excluded, is it *explanatorily* redundant? If the physical superset ($P$) is present, and $P$ necessitates the subset ($M$), citing $M$ adds no new causal information. It merely highlights a portion of the physical cause.

  **The Final Verdict:**

  **Shoemaker's Subset Account is the more promising response to Kim, but it does not fully escape the exclusion worry.**

  Here is why:
  1.  **Metaphysical Grounding:** Shoemaker provides a stronger ontological basis. Yablo relies on a logical/conceptual relation (determinable) that fits poorly with the heterogeneous nature of physical realizers. Shoemaker relies on the actual causal structure of the world (powers), which fits physicalism better.
  2.  **The Nature of the "Escape":** Shoemaker successfully shows that Kim's argument relies on an assumption of **property dualism** (that $M$ and $P$ are distinct candidates for causation). By making $M$'s causal identity a *subset* of $P$'s, Shoemaker dissolves the competition. There is no second cause to exclude.
  3.  **The Remaining Failure:** However, your intuition that this "relocates the problem" is correct. The problem shifts from **Causal Exclusion** to **Explanatory Redundancy**.
      *   Kim can concede that $M$ is not a *rival* cause. He can then argue: "Fine. But if $P$ is the fundamental causal engine, and $M$ is just a subset of $P$'s powers, then $M$ has no *autonomous* causal status."
      *   The mental property becomes a "causal shadow." It is efficacious only because the physical is. This saves non-reductive physicalism from epiphenomenalism, but only at the cost of making mental causation **derivative**.

  **Conclusion:**
  Your friend is right that the subset move blocks the *logical form* of Kim's exclusion argument (no competition). But you are right that it risks trivializing the mental (it's just a fragment of the physical).

  Between the two, **Shoemaker is superior to Yablo** because it accommodates Multiple Realizability without forcing physical states into an unnatural determinable structure. However, **both ultimately fail to satisfy a hardline physicalist** who demands that if the physical does all the work, the mental is explanatorily redundant, and **both fail to satisfy a robust realist** who wants the mental to have causal powers *over and above* the physical.

  Shoemaker finds the most stable middle ground: Mental properties are real, distinct types, but their token-level causal power is identical to the physical. Whether that counts as "saving" mental causation depends on whether you think *inheritance* is enough for *agency*. Most critics (including Kim) say it is not.
