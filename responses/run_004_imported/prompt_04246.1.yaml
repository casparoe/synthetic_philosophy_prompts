prompt: |-
  I'm a retired chemist who's fallen down the philosophy rabbit hole since retiring, and I just found something kind of delicious: Galen Strawson's "Basic Argument" claims true moral responsibility is impossible, since you'd have to be the ultimate cause of your own character, and nothing can cause itself. Turns out his own father, P.F. Strawson, wrote "Freedom and Resentment," one of the most influential defenses of moral responsibility ever, built on everyday reactive attitudes like resentment and gratitude rather than metaphysics. Can you compare the two arguements in some depth, and tell me which one actually holds up better under scrutiny? Also curious if Galen ever addressed his dad's essay directly, or if that's just a connection readers like me have noticed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

