answer: |-
  **Setting:** *A cluttered graduate office, late evening. Empty coffee cups and stacks of handouts on Hirsch and Sider cover the desk. ELENA (Universalist) and MARCUS (Nihilist) have been arguing for an hour. The whiteboard is covered in mereological sums and diagrams of simples.*

  **Elena:** [Cap off her marker, turning from the board] Look, Marcus, we've been at this for three years. You say there are no tables. I say there are tables, and shoes, and fusions of shoes and towers. We recite the same arguments. The argument from vagueness, the argument from parsimony. It's a stalemate.

  **Marcus:** It's not a stalemate. It's a case where one of us is failing to follow the arguments where they lead. I follow them to simples. You follow them to... everything.

  **Elena:** Or maybe we're following them to the same place, just using different maps. I was reading Hirsch again last night. What if this isn't a substantive disagreement at all? What if it's merely verbal?

  **Marcus:** [Sighs, leaning back] Here we go. Quantifier variance. You're going to tell me my "there exists" is just a dialect of your "there exists."

  **Elena:** I'm saying consider the possibility. When I say, "There exists a fusion of your left shoe and the Eiffel Tower," I'm not positing a new ghostly entity hovering over Paris. I'm just saying that *those things*—the shoe, the tower—satisfy the condition of being compossible. My quantifier is unrestricted. Yours is restricted to simples. But if my fusion is nothing over and above its parts, then my claim is just a liberal way of describing the very particles you accept.

  **Marcus:** "Nothing over and above." That's the slogan, isn't it? But it does heavy lifting you aren't paying for.

  **Elena:** It's not a slogan; it's the translation manual. Hirsch's charity principle. I can translate your nihilist sentences into my universalist idiom without loss of truth. When you say, "There are no tables, only simples arranged table-wise," I hear, "There exists a plurality of simples that compose a table." We agree on the arrangement of the world. We agree on the physics. We only disagree on the logic of "exists." If charity dictates we maximize agreement, we should conclude we're both right, relative to our own quantifier meanings.

  **Marcus:** And if we do that, Elena, what happens to the reasons I became a nihilist in the first place?

  **Elena:** You keep your reasons. They just become reasons for preferring a restricted linguistic convention, not reasons for denying objects.

  **Marcus:** No. They become useless. Look, the payoff of nihilism isn't just linguistic hygiene. It's metaphysical resolution. I deny the existence of the statue and the lump as distinct objects to solve the puzzle of coincident entities. If they are numerically distinct, how do they differ in properties? If they aren't, how do they have different persistence conditions? Nihilism dissolves this. There is only the clay.

  If you're right, and this is just verbal, then the puzzle isn't dissolved. It's just translated. In your language, the statue and the lump *are* distinct objects. You've just told me not to worry about it because "distinct" is cheap. But the metaphysical tension remains. If the dispute is merely verbal, then Universalism doesn't actually solve the problem of coincidence; it just talks around it. And I didn't sign up for a verbal trick. I signed up for an ontology that cuts the knot.

  **Elena:** But that assumes the knot is real. I'm saying the knot is tied by your restrictive quantifier. If you allow the unrestricted quantifier, coincidence isn't a puzzle. Two objects can share all their material parts and differ in modal properties because identity is primitive. You're treating the theoretical payoff of nihilism as a datum, but that payoff only exists if we assume your sparse ontology is the one required to do metaphysics.

  **Marcus:** It's not an assumption. It's a conclusion from the nature of reality. This is where Sider stops me from sliding into Hirsch's comfort zone. Even if you can translate my sentences into yours preserving truth, that doesn't mean the meanings are on par. Truth isn't the only goal of ontology. *Structure* is.

  **Elena:** Structure. The joint-carving argument.

  **Marcus:** Exactly. One candidate meaning for "exists" carves at the joints of reality. The other does not. If Universalism is true only on a permissive quantifier meaning that lumps together scattered simples as "objects," then that quantifier is failing to track the fundamental structure of the world. The world doesn't contain shoe-tower fusions. It contains simples. The restrictive quantifier matches that structure. The unrestricted one smears over it. So the dispute *is* substantive. It's about which logic captures the fundamental structure of being.

  **Elena:** But how do you determine which quantifier carves the joints without already begging the question? You say the restrictive one carves because the world only contains simples. But that's just asserting nihilism is true. I say the unrestricted one carves because composition is identity—the fusion *is* the parts, so counting the fusion is just counting the parts in a different mode. If I'm right about the metaphysics, *my* quantifier is the joint-carver. You can't use joint-carving to decide the ontology if the ontology determines which quantifier carves.

  **Marcus:** It's not circular if the choice of quantifier is constrained by theoretical virtues independent of the specific ontological verdict. Parsimony, for instance.

  **Elena:** Quantitative or qualitative parsimony?

  **Marcus:** Qualitative. My ideology is leaner. I don't need a primitive composition relation. I just have the simples and the spacetime relations. You need composition to be unrestricted, which implies a massive proliferation of entities.

  **Elena:** But I don't need a primitive composition relation either! For me, composition is trivial. It's automatic. That's ideologically simpler than your view, which has to explain *why* composition fails to occur. You have a negative restriction on reality; I have a default setting. And regarding parsimony: if fusions are nothing over and above their parts, I'm not positing *more stuff*. I'm positing the same stuff, described more comprehensively. So, on what grounds do you privilege the restrictive quantifier as the "structural" one? It looks like you're just labeling your preferred ontology as "structural" and mine as "conventional."

  **Marcus:** I'm privileging it because the unrestricted quantifier leads to absurdities that strain the concept of objecthood. Sider's argument from vagueness. If composition is unrestricted, then there is a precise moment when a collection of cells becomes a person. If there isn't, then existence is vague. But existence can't be vague—that's a constraint on logic itself, not ontology. Therefore, composition must be restricted.

  **Elena:** Or, existence *is* vague, and that's fine because vagueness is semantic, not ontic. The world is precise; our quantifier is vague. Why penalize the ontology for the limitations of language? You're treating the precision of the quantifier as a mark of joint-carving, but maybe the joint-carving quantifier is the one that allows us to speak truly about vague boundaries without inventing sharp cuts in reality.

  **Marcus:** If the quantifier is vague, then it's not carving joints. Joints are sharp. A foggy knife doesn't carve; it smears. If your quantifier admits vagueness, it's by definition not the fundamental one.

  **Elena:** And if your quantifier denies the existence of tables, it's by definition not the one we use to navigate the world. Look, Marcus, here's my worry. You want to say the dispute is substantive because one quantifier is "elite." But if I can translate every claim you make into my language and make it true, and every claim I make into your language and make it true, what work is the "elite" quantifier doing?

  **Marcus:** It's doing the work of telling us what the world is *really* like, beneath the translations.

  **Elena:** But we can't access the world beneath the translations! We only have the translations. If the nihilist translation of "There is a table" is "There are simples arranged table-wise," and that is true, then the table-talk is vindicated. Why do I need to say "But strictly speaking, no table exists" to get the metaphysical payoff?

  **Marcus:** Because "There are simples arranged table-wise" leaves open the possibility that *also* a table exists over and above them. It leaves the door open to coincidence, to overdetermination. If a ball hits the window, did the simples break it, or did the window break it? If both exist, you risk causal overdetermination. Nihilism closes that door. It says *only* the simples acted. Your translation preserves truth, Elena, but it doesn't preserve *exclusivity*. It doesn't preserve the claim that the simples are *all there are*.

  **Elena:** But that claim—"the simples are all there are"—is only meaningful if "there are" has your restricted meaning. If I use my meaning, "the simples are all there are" is false, but "the simples are the fundamental base" is true. We agree on the base! We agree on the causation! You're insisting that to capture the truth, we must use a quantifier that renders ordinary speech false. I'm saying a quantifier that renders ordinary speech true, while acknowledging the base, is theoretically superior.

  **Marcus:** Theoretically superior for *communication*, maybe. Not for *metaphysics*. Metaphysics wants the skeleton, not the skin.

  **Elena:** And I'm saying the skeleton without the skin isn't an animal. It's a diagram.

  **Marcus:** [Pauses, tapping his pen] So we're back to the stalemate. You think the substantive disagreement dissolves into a choice of linguistic framework. I think the choice of linguistic framework is itself a substantive metaphysical claim about which framework tracks reality's structure.

  **Elena:** Precisely. And neither of us can argue for our framework without assuming the framework is correct. I can't prove the unrestricted quantifier is joint-carving without assuming composition is trivial. You can't prove the restricted quantifier is joint-carving without assuming composition is non-trivial.

  **Marcus:** It's not circular if the arguments from vagueness and parsimony are neutral premises.

  **Elena:** They aren't neutral. They rely on intuitions about what counts as a "cost" or a "vagueness" that are already theory-laden.

  **Marcus:** [Stands up, walks to the window] Then maybe that's where the real disagreement is. Not about tables. Not even about quantifiers. But about whether metaphysics is about describing the world as it is independent of us, or describing the best conceptual scheme for coping with the world.

  **Elena:** I'd say it's about whether logic is a tool we bring to the world, or a structure we find in it.

  **Marcus:** If logic is found, then one quantifier is right. If logic is brought, then Hirsch might be right, and we're just arguing over which tool is sharper.

  **Elena:** And if we're arguing over tools, then your nihilism isn't a discovery about reality. It's a preference for a scalpel over a hammer.

  **Marcus:** And your universalism isn't a description of reality. It's a preference for a net over a sieve.

  **Elena:** [Smiles faintly] So we aren't disagreeing about the fish. We're disagreeing about the mesh size.

  **Marcus:** But the mesh size determines which fish you say exist. That's not a trivial difference, Elena. If I say there are no minnows, and you say there are, and we go to stock the pond, we're going to have a problem.

  **Elena:** Only if "stock the pond" requires a substantive ontology. If it just requires "minnow-wise simples," we're fine.

  **Marcus:** [Turns back from the window] You're not going to let me have the substance, are you?

  **Elena:** Not until you show me how "joint-carving" isn't just a metaphor for "the ontology I prefer."

  **Marcus:** And you're not going to admit that if everything exists, then "exists" means nothing?

  **Elena:** No. Because if everything exists, then "exists" means *everything*.

  **Marcus:** [Sits back down, picks up his coffee] Well. The seminar paper is due Tuesday.

  **Elena:** Tuesday. We still have to write the section on the metaontological implications.

  **Marcus:** I'll write the Siderian response. You write the Hirschian objection.

  **Elena:** Deal. But Marcus?

  **Marcus:** Yeah?

  **Elena:** If we're both right, you owe me dinner.

  **Marcus:** If we're both right, Elena, the concept of "owing" is just simples arranged debt-wise. So I don't owe you anything.

  **Elena:** [Laughs] See? You can't even be a nihilist consistently.

  **Marcus:** Pass the marker. I need to erase the board.
