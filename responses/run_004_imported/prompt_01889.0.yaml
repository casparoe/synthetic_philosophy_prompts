answer: |-
  "Nice eulogy," Marcus said, swirling the cheap memorial wine. "You almost sounded like you meant the 'eternal rest' part."

  Elena didn't look at him. She was watching the mourners cluster near the urn. "I meant the wish, Marcus. Not the mechanism."

  "Mechanism. Right. Because there's no mechanism. There's just a grammar." He took a sharp sip. "We've been doing this since '88, El. You realize that? Thirty-five years of me asking you what you actually believe, and thirty-five years of you telling me what I'm actually saying."

  "I'm telling you what you're doing. There's a difference."

  "Is there?" He stepped into her line of sight. "Because here's the problem with your Wittgensteinian move. If religious belief isn't a hypothesis—if it's just a 'picture that organizes life,' as you've said since dissertation days—then you and I weren't arguing about anything back in grad school. When I said 'God doesn't exist' and you said 'He does,' we weren't contradicting each other. We were just... vibrating at different frequencies. Is that it? Are you telling me we stayed up until 4 AM fighting over nothing?"

  Elena finally turned. Her eyes were tired, but sharp. "We were arguing about authority, Marcus. Not facts. You were arguing that the picture shouldn't have authority over you. I was arguing that it did. That's a real conflict. It's just not a scientific one."

  "So it's psychology? You believe because it comforts you?"

  "No. I believe because the picture holds. Because when I look at the world, that's the shape it takes. You look at the same world and see a void. We were disagreeing about the world's aspect. Don't reduce that to 'nothing.'"

  "Aspect," Marcus repeated, tasting the word like spoiled milk. "See, that's where you lose me. Because you still use the word 'true.' You stand up in church and say 'I know my Redeemer liveth.' But if I ask you how you know, you say evidence doesn't apply. If I ask you if he's actually alive, you say 'alive' doesn't mean biological existence. It's convenient, Elena. It's intellectually convenient. You get the comfort of the claim without the risk of the refutation."

  "You think reason doesn't have its own risks?"

  "Reason risks being wrong. Faith, on your account, can't be wrong. It's immune."

  "It's not immune. It's fragile. If the picture stops holding, if it stops organizing the life, it dies. That's the scrutiny. Existential scrutiny, not empirical."

  "That's moving the goalposts from 'true' to 'useful' while keeping the vocabulary of 'true.' It's armor." He leaned in, lowering his voice. "And don't give me the 'pure Wittgenstein' defense. I know you think you're above the fideism charge because Wittgenstein didn't explicitly say faith is immune to reason. But that's what his followers did with the tools he gave them. You're using his lectures as a shield."

  Elena smiled, thin and cold. "Actually, I was going to say you're fighting Kai Nielsen, not me. You're attacking a caricature of fideism that assumes faith is a separate sphere immune to critique. I'm saying the critique looks different. You want to treat 'God exists' like 'Electrons exist.' I'm saying that's a category error. But you hate that. Because if it's a category error, you can't debunk it. You can only outlive it."

  "Debunking isn't the point. Clarity is. And your view obscures everything. It lets believers claim they're describing reality while refusing to describe what reality they're describing. It's a fog machine."

  "It's a map," she corrected. "You just refuse to read the legend."

  "The legend says 'Here be dragons,' Elena. And you're telling me the dragons are metaphorical while you still lock your doors against them."

  "I lock my doors because the picture teaches prudence. Not because I think the dragon is biological."

  Marcus laughed, a short, brittle sound. "You hear yourself? 'The picture teaches prudence.' You've reduced the Almighty to a heuristic. And yet you expect me to believe you're not an atheist in all but name."

  "I expect you to believe I'm not an atheist in any name. Because I don't accept your definition of belief."

  "Then what are we doing?" He gestured at the room, at the grieving colleagues. "Why are we here? If it's just a picture, why does it matter if the picture is wrong?"

  "Because people live and die by pictures," Elena said softly. "And some pictures are worth dying for. Even if you think they're false. Especially then."

  "That's tragic," Marcus said. "Not noble. Tragic."

  "Maybe," she said, turning back to the urn. "Or maybe it's the only way to stand the heat."

  Marcus watched her for a long moment, then took the last sip of his wine. He didn't offer a rebuttal. There wasn't one that would land. He just set the plastic cup down on the table between them, the sound final as a gavel.

  "Same time next year?" he asked.

  "Same time next year," she said.
