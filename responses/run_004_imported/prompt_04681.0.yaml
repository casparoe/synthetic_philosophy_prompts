answer: |-
  This is one of the most famous and persistent objections to Rawls's later work, so first off: your group is reading closely. The tension you're identifying between *Political Liberalism* (1993) and "The Idea of Public Reason Revisited" (1997) is real, but most Rawls scholars argue it is not a motte-and-bailey.

  However, whether it is a *successful* distinction is a different matter. Given your group's background (LessWrong/ACX adjacent), I think you'll find the resolution lies in distinguishing between **ideal vs. non-ideal theory** and the **architecture of coordination**, rather than just "rules for debate."

  Here is the principled line Rawls is trying to draw, why it isn't technically an ad hoc pass for MLK, and where the legitimate criticisms still lie.

  ### 1. The Distinction: Background Culture vs. Public Political Forum
  The most common misunderstanding of public reason (and the source of the "motte") is thinking Rawls wants to banish religious language from all political *discussion*. He doesn't. He distinguishes between:

  *   **The Public Political Forum:** The discourse of judges, legislators, government officials, and candidates for public office when they are deciding on **constitutional essentials** and matters of basic justice.
  *   **The Background Culture:** The discourse of civil society—churches, universities, media, associations, and private citizens.

  Rawls explicitly states that in the **background culture**, there are no restrictions on comprehensive doctrines. You can argue purely from the Bible, the Quran, or utilitarian calculus in your church or your blog.

  **The MLK Application:** Rawls argues that MLK and the Abolitionists were primarily operating in the *background culture* mobilizing public sentiment. They were not, in their capacity as activists, writing statutes or issuing court rulings. They were persuading the citizenry.

  **The Catch:** Rawls says that when those movements succeed and enter the *political forum* (i.e., when laws are actually passed or court decisions made), the justification must be translatable into public reason.

  ### 2. The Proviso (The "Revisited" Addition)
  In "The Idea of Public Reason Revisited," Rawls introduces the **proviso**, which is the specific mechanism that allows MLK in the door without breaking the rule.

  The proviso states: Citizens may introduce their comprehensive doctrines (religious or otherwise) into political discussion **at any time, provided that in due course proper political reasons are presented to support whatever the comprehensive doctrines are said to support.**

  *   **Motte:** "You can't justify coercion solely on comprehensive grounds."
  *   **Nuance:** "You can use comprehensive grounds to motivate or illustrate, as long as there *exist* public reasons that justify the policy independently."

  Rawls argues MLK satisfies the proviso because while he used religious language to motivate, the *substance* of his demands (voting rights, desegregation) were justifiable via the Constitution and the Declaration of Independence (which count as public reasons in the American context). The religious language provided the **moral urgency**, but the **legitimacy** rested on the constitutional violation.

  ### 3. Ideal vs. Non-Ideal Theory (The Rationalist Angle)
  This is probably the frame your group will resonate with most. Rawls's theory of public reason is a model for a **nearly just society** operating under **ideal theory**. It assumes a society where the basic structure is already reasonably just, and we are just tweaking the equilibrium.

  The Jim Crow South (and the pre-Civil War US) was **not** a nearly just society. It was a society where a significant portion of the population was excluded from the status of "free and equal citizen."

  *   **Ideal Theory:** Everyone follows the rules of public reason to maintain stability and mutual respect.
  *   **Non-Ideal Theory:** When the basic structure is unjust, the duty of civility may be overridden by the duty to establish justice.

  Rawls acknowledges that in a society that is *already* violating the principles of justice, appealing to public reason might be impossible or counterproductive because the oppressors are not acting in good faith. In such cases, comprehensive doctrines may be necessary to break the deadlock and move society *toward* a state where public reason is possible.

  So, praising MLK isn't an exception to the rule; it's an application of **non-ideal theory**. You break the norms of public reason to fix the game board so that public reason can eventually function.

  ### 4. Why It's Not (Just) a Motte-and-Bailey
  A motte-and-bailey requires shifting definitions based on convenience to defend a position. Rawls's distinction is structural:

  1.  **Stability:** The goal of public reason isn't "truth"; it's **stability for the right reasons**. In a pluralistic society, if I coerce you based on my Bible, and you don't accept my Bible, I am treating you as a subject, not a citizen.
  2.  **Overlapping Consensus:** Rawls wants religious people to support the liberal order *for their own reasons*. He doesn't want them to stop being religious; he wants their religion to overlap with political liberalism.
  3.  **The Module:** Rawls views political liberalism as a "module" that can fit into various comprehensive doctrines. MLK showed that Christianity could be that module.

  If Rawls condemned MLK, he would undermine the possibility of an overlapping consensus. He needs to show that religious citizens can be fully reasonable. Banning MLK would imply that devout Christians cannot be reasonable citizens, which would collapse his whole theory of stability.

  ### 5. Where Your Group is Still Right (The Steelman Critique)
  Even if it's not a motte-and-bailey, there are legitimate reasons to think Rawls is fudging it. The strongest critique comes from Nicholas Wolterstorff (a Christian philosopher who debated Rawls extensively).

  **The "Translation" Problem:**
  The proviso requires that public reasons be available "in due course." But what if they aren't?
  *   Some religious believers argue that their stance on abortion or euthanasia *cannot* be justified without the religious premise. The secular arguments are just shadows of the theological truth.
  *   If Rawls says, "You can hold that view, but you can't vote for it unless you lie and pretend there's a secular reason," he is asking them to be intellectually dishonest.

  **The Motivational Necessity:**
  For many movements (Abolition, Civil Rights), the religious language wasn't just decoration; it was the *only* thing powerful enough to overcome the inertia of injustice. If Rawls says, "You can use it in the background, but not the foreground," he might be underestimating how much the "background" *is* the political engine.

  **The "Reasonable" Definition:**
  Rawls defines "reasonable" citizens as those willing to propose and abide by fair terms of cooperation. Critics argue this definition is rigged. By defining "reasonable" to include "accepts public reason," he effectively defines out anyone who thinks God's law trumps democratic consensus. It's not a motte-and-bailey, but it might be **question-begging**.

  ### Summary for the Meetup
  You can tell your group:

  1.  **It's not a contradiction:** Rawls distinguishes between the *context* (background culture vs. political forum) and the *timing* (the proviso).
  2.  **It's non-ideal theory:** MLK was fixing a broken system where public reason was already dead; you can't use the rules of a functioning game to fix a rigged one.
  3.  **The Real Beef:** The criticism shouldn't be that Rawls is being inconsistent, but that his **proviso is too demanding**. He asks religious citizens to bifurcate their reasoning in a way that might be psychologically or theologically impossible, even if he makes a formal exception for historical heroes.

  Rawls isn't trying to write religion out of politics to be secular; he's trying to write it out of *coercion* to preserve peace. He praises MLK because MLK managed to use religious fire to light a fuse that burned down an unjust system, revealing public reasons (Constitutional equality) underneath. Rawls's hope is that we can eventually keep the equality without needing the fire. Whether that's possible is the open question.

  *(Side note on the biography: Your read on "On My Religion" is spot on. That loss of orthodox faith is exactly why he became obsessed with a system that doesn't require theological agreement to function. He wasn't hostile to religion; he was traumatized by the political consequences of theological disagreement.)*
