answer: |-
  **MEMORANDUM**

  **TO:** Pretrial Risk Assessment Oversight Board
  **FROM:** [Your Name], Resident Ethicist
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Contract Renewal and Fairness Metrics

  **Executive Summary**
  The Board is currently divided between two positions: equalizing false-positive rates (FPR) across racial groups or maintaining the tool's current calibration. It is my professional assessment that treating this as a purely engineering problem is a category error. Due to disparate base rates of rearrest in our jurisdiction, it is mathematically impossible to simultaneously satisfy equalized false-positive rates and calibration (predictive parity). We cannot engineer our way out of this constraint; we must make a policy choice about which statistical error we are willing to tolerate.

  **Recommendation**
  I recommend that the Board **condition contract renewal on the vendor re-optimizing the tool to equalize False Positive Rates**, with the explicit understanding that this will degrade calibration.

  In pretrial proceedings, the primary ethical stakes concern liberty. A false positive results in the unnecessary detention of an innocent person. Because the audit confirms that Black defendants currently bear a disproportionate burden of these errors, prioritizing FPR parity is the only option that aligns with the presumption of innocence and equal protection under the law. We must accept that a "High Risk" score will no longer imply the exact same probability of rearrest for every defendant, provided that the cost of that inconsistency is not borne disproportionately by one racial group.

  **Engagement with the Calibration Argument**
  I urge the Board to consider the strongest argument against my recommendation, put forth by the proponents of maintaining the current model: **Calibration ensures informational integrity.**

  When a tool is well-calibrated, a risk score of "70%" means that 70% of people with that score reoffend, regardless of race. Proponents argue that sacrificing calibration effectively "race-norms" the truth, implying that a Black defendant with a specific score is inherently less dangerous than a White defendant with the same score. This undermines the tool's validity as a neutral arbiter of risk and could erode judicial trust. If judges cannot rely on the score to mean the same thing for every defendant, they may revert to unstructured discretion, which carries its own well-documented biases. This is a serious concern regarding the transparency and consistency of our justice system.

  However, consistency in prediction cannot outweigh consistency in liberty. A calibrated tool that systematically detains innocent Black defendants at higher rates than innocent White defendants preserves the "meaning" of the score while violating the rights of the individuals behind the data. We must prioritize the distribution of harm (detention) over the distribution of predictive accuracy.

  **Implementation Timeline**
  To execute this recommendation responsibly, I propose the following 180-day timeline:

  1.  **Days 1–30:** Board vote to formally adopt FPR parity as the governing fairness metric, acknowledging the resulting loss of calibration.
  2.  **Days 31–120:** Vendor retraining period. The vendor must submit to interim audits to demonstrate FPR convergence without concealing calibration drift.
  3.  **Days 121–150:** Judicial training. Judges must be briefed that risk tiers no longer represent identical rearrest probabilities across groups, ensuring they interpret the data with necessary nuance.
  4.  **Days 151–180:** Final audit and contract execution.

  **Conclusion**
  We cannot have a tool that is both perfectly calibrated and equally error-prone across groups given our current reality. By choosing to equalize false positives, we acknowledge that while we cannot eliminate the mathematical trade-off, we can choose to distribute the cost of that trade-off more justly.

  I look forward to discussing this framework at the November meeting.
