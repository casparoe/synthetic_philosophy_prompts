prompt: |-
  So I write about science and ideas for a living, and I'm working on a piece about this new wave of "neuroscience says free will is dead" takes (the Sapolsky book, etc). I've got a philosopher lined up who defends the Strawsonian line on moral responsibility -- basically that whether determinism is true is beside the point, because resentment, gratitude and guilt just arent the kind of thing a metaphysical thesis could undermine. Can you draft me seven or eight interview questions that push on the actual substance instead of just having her explain "reactive attitudes" 101 for readers? I want at least one question on the old Gary Watson complaint that Strawson conflates "we can't help feeling this way" with "we're entitled to feel this way," one on whether the participant/objective distinction can draw a principled line once you hit hard cases (a violent offender whose backstory makes people's attitudes flicker between resentment and something closer to fear or pity), and one on Mele/Pereboom-style manipulation cases, where an agent checks every Strawsonian box -- reasons-responsive, no local excuse, doesn't buckle under "did you really mean it" -- yet was deterministically engineered start to finish by someone else, which seems to bite precisely because determinism itself was supposed to be irrelevant on her view. For each, tack on a follow-up keyed to whatever dodge she's most likely to reach for.
