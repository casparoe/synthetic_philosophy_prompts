answer: |-
  Here are eight substantive interview questions designed to bypass the introductory material and press directly on the tensions within the Strawsonian framework, specifically tailored for a piece engaging with the Sapolsky-style determinist challenge.

  ### 1. The Watson Challenge (Is vs. Ought)
  **Question:** Gary Watson's classic critique is that Strawson conflates the *inevitability* of reactive attitudes with our *entitlement* to them. He argues that just because we can't help feeling resentment doesn't mean resentment is rationally justified in a determined world. If our emotional machinery is just another causal product of evolution, why shouldn't the skeptic treat our reactive attitudes as cognitive illusions we ought to outgrow, rather than the bedrock of justification?

  *   **Likely Dodge:** She will likely argue that "justification" is internal to our form of life; asking for an external justification is incoherent because there is no "view from nowhere" to stand on.
  *   **Follow-up:** But if justification is entirely internal to the practice, doesn't that make moral responsibility immune to critique in a way that feels suspicious? If a society decided it was "practically impossible" to stop feeling resentment toward left-handed people, would their internal coherence make that practice justified? Where do we get the leverage to say some reactive attitudes are *mistakes* rather than just facts about our psychology?

  ### 2. The Manipulation Argument (Mele/Pereboom)
  **Question:** Let's look at manipulation cases. Imagine an agent engineered by neuroscientists to be a killer. They check every Strawsonian box: they are reasons-responsive, they understand the moral stakes, and they feel guilt afterward. Yet, intuitively, they aren't responsible because their will was deterministically engineered. If the *origin* of the will matters here, why doesn't it matter in standard deterministic cases? Doesn't this show that we actually do care about the metaphysical history of the action, not just the current quality of the will?

  *   **Likely Dodge:** She will likely distinguish between "local" manipulation (an exemption) and "universal" determinism (the background condition), arguing that manipulation triggers the objective stance because it bypasses the agent's agency in a way normal causation doesn't.
  *   **Follow-up:** But if the agent's internal psychology is identical in both cases, what *is* that difference other than the presence of a manipulator? If the agent is equally determined by genes and environment in the non-manipulated case, isn't the "manipulator" just a scapegoat for determinism itself? Why is determination by nature permissible but determination by a scientist an exemption?

  ### 3. The Participant/Objective Boundary (Hard Cases)
  **Question:** You rely on the distinction between the participant stance and the objective stance to handle exemptions. But consider a violent offender with a horrific backstory of abuse and neglect. In court, people's attitudes often flicker between resentment and something closer to fear or pity. If the objective stance is triggered by causal explanations that undermine the quality of will, why doesn't *every* causal explanation trigger it? Where is the principled line between a "tragic backstory" that mitigates responsibility and a "causal history" that everyone has?

  *   **Likely Dodge:** She will likely argue that the line is pragmatic, not metaphysical. We suspend the participant stance only when interaction is impossible or pointless, not merely because causes are present.
  *   **Follow-up:** But Sapolsky's point is that interaction is *always* causally determined. If the line is purely pragmatic, doesn't that reduce moral responsibility to a tool for social management? Are you saying we hold people responsible not because they *are* responsible, but because it's inconvenient to treat them like broken machines?

  ### 4. The Sapolsky Expansion (Universal Exemption)
  **Question:** Robert Sapolsky argues that as neuroscience advances, more and more behaviors migrate from the "choice" bucket to the "biology" bucket. He sees this as a gradual expansion of the objective stance until it covers everyone. On your view, is there any empirical discovery that *could* force us into the objective stance universally? Or is your claim that no amount of biological explanation can ever logically compel us to abandon reactive attitudes?

  *   **Likely Dodge:** She will likely say that biological explanation is only relevant if it shows the agent couldn't participate in moral relationships (e.g., psychosis), not merely that the behavior was caused.
  *   **Follow-up:** But if a tumor causes a personality change that leads to murder, we exempt them. If a traumatic childhood causes a personality change that leads to murder, we often don't. Both are biological/causal. If the "participation" capacity is intact in both, why does the tumor exempt but the trauma doesn't? Isn't that an arbitrary distinction in the quality of will?

  ### 5. Moral Progress and Attitude Revision
  **Question:** Strawsonians often say we can't give up reactive attitudes without ceasing to be human. But history suggests we *have* given up reactive attitudes that once felt natural. We no longer feel collective guilt for heresy or witchcraft, and we've largely abandoned honor-based resentment. If we can prune our reactive attitudes based on new moral knowledge, why can't we prune resentment itself in light of determinism?

  *   **Likely Dodge:** She will argue that those were *misapplications* of reactive attitudes based on false beliefs, whereas resentment in response to ill will is constitutive of human relationships, not a contingent belief.
  *   **Follow-up:** How do you distinguish a "misapplication" from a "constitutive" attitude without an external standard of truth? If the belief in "could have done otherwise" is what drives resentment, and that belief is false, isn't the resentment itself based on a false belief? Why isn't dropping it moral progress rather than psychological collapse?

  ### 6. The First-Person Perspective (Guilt)
  **Question:** Most of this discussion focuses on the second-person stance: my resentment toward you. But what about the first-person stance: my guilt toward myself? If I become convinced by Sapolsky that my actions were the inevitable result of prior causes, can I rationally feel guilt? Or does the Strawsonian view require me to maintain a kind of useful illusion about my own metaphysical freedom to function as a moral agent?

  *   **Likely Dodge:** She will likely say guilt is forward-looking; it's about modifying future behavior and repairing relationships, not about metaphysical authorship.
  *   **Follow-up:** But that seems to change the definition of guilt. If I know I couldn't have done otherwise, my "guilt" becomes mere regret, like regretting a natural disaster I caused. Does your view survive if we strip guilt of its retributive element? Is a non-retributive guilt still moral responsibility, or is it just behavioral conditioning?

  ### 7. The "Human Nature" Claim
  **Question:** Strawson grounds this in "our nature" as social beings. But anthropology suggests reactive attitudes vary significantly across cultures. Some societies emphasize shame over guilt, or restoration over resentment. If the specific texture of reactive attitudes is culturally contingent, why should the specific Western package of resentment-and-blame be the anchor for moral responsibility? Why not build a system on attitudes that are more compatible with determinism?

  *   **Likely Dodge:** She will argue that while the *expression* varies, the underlying demand for goodwill and the response to its violation is a human universal.
  *   **Follow-up:** Even if the demand is universal, the *interpretation* of violation isn't. If determinism shows that "ill will" is itself a product of prior causes, doesn't that undermine the demand itself? If we can cultivate a culture that views ill will as a form of sickness rather than a moral failure, wouldn't that be a healthier "form of life" than the one Strawson describes?

  ### 8. Circularity and the Skeptic
  **Question:** Ultimately, the skeptic wants to know if moral responsibility is *true*, not just if it's useful. Your argument seems to be: "We practice responsibility, therefore responsibility is valid." Doesn't this beg the question? If I doubt the foundation of the house, telling me that the furniture is arranged nicely inside doesn't prove the foundation is solid. Are you defending responsibility, or just explaining why we can't stop pretending it exists?

  *   **Likely Dodge:** She will likely reject the "true/false" binary for responsibility, arguing it's a social status, not a metaphysical fact like mass or velocity.
  *   **Follow-up:** But if it's not a metaphysical fact, then Sapolsky wins by default: he's talking about the metaphysics of action, and you're talking about the sociology of blame. You aren't disagreeing with him; you're just changing the subject. How do you engage the skeptic who cares about the metaphysics of agency without conceding that, metaphysically, no one is responsible?
