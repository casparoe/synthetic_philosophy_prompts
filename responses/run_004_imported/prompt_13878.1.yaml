      *   *Watson's Critique:* Just because we *do* feel resentment doesn't mean we *should* or are *rationally entitled* to. Strawson moves from descriptive psychology to normative justification too quickly.
      *   *The Hard Case:* When does the "objective stance" kick in? If a criminal had a terrible childhood, we might feel less resentment. But if determinism is true, *everyone* has a causal backstory. Where is the line?
      *   *Manipulation Cases:* If someone is engineered to be a killer (determinism via manipulation), they might look responsible by Strawsonian standards (they acted on reasons, they feel guilt), but intuitively they aren't. This suggests the *origin* of the will matters, which brings determinism back in.
