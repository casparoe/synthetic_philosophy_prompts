      *   *Strict Interpretation:* To be truly Black's Spheres, they cannot interact. Interaction creates a relation that distinguishes the source from the receiver.
      *   *Narrative Workaround:* They exist in a state where interaction is impossible or perfectly mirrored. They are aware of each other, but that awareness is a shared property. "Aware of a sphere at distance D." Both have this property.
