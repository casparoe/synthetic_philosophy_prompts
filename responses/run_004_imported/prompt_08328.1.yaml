      *Wait, one more check on Part (c).* The prompt asks: "Does the strategy you describe in (b) ultimately collapse...?" The student says "No... since the causal theory locates the explanatory work in the external history... rather than in any descriptive content graspable by the speaker."
      *Critique:* The strategy in (b) to account for *informativeness* was "treats their difference... as a merely psychological fact." The justification in (c) shifts to "external history... determines reference." This is a slight non-sequitur. The puzzle is about *informativeness* (cognitive), not *reference determination* (metasemantic). The collapse objection is: "If you need psychological facts to explain the difference, aren't those psychological facts doing the work of Senses?" The student answers: "No, because reference is determined externally." This misses the point of the collapse objection regarding *cognitive significance*. This is a significant philosophical slip at the grad level. Maybe 3.5/5 or 4/5? 4/5 is generous but acceptable for a TA grade if the core intuition (Millianism != Fregeanism) is clear. I will stick with 4/5 but be specific about the mismatch between the puzzle (cognitive) and the defense (metasemantic).

