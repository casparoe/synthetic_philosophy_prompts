answer: |-
  Colleagues, students, guests: welcome.

  It is a privilege to open this workshop as we mark one hundred years since the death of Gottlob Frege. Looking around this room, I see a division that is, in its own way, fitting for a philosopher who spent his life drawing distinctions. On one side, we have historians of analytic philosophy who know the arc of Frege's life in detail. On the other, graduate students who know Frege through the *Begriffsschrift*, through *Sinn* and *Bedeutung*, and through the shattered dream of the *Grundgesetze*.

  For the historians, I need not say much. But for the students, and for the sake of our collective honesty, we cannot begin a centenary reflection without addressing the shadow that has fallen over Frege's legacy in recent decades.

  In the spring of 1924, a year before his death, Frege kept a political diary. When Michael Dummett discovered the extent of its contents in the 1990s, he described his reaction as one of profound dismay. The diary reveals a man embittered by the Weimar Republic, hostile to democracy, and espousing virulent antisemitism. For those of you encountering this for the first time: it is a shock. It is jarring to find the philosopher who taught us that logic is the law of truth itself writing with such venom about his fellow human beings.

  This raises a question that I know will linger in the back of our minds today, even during the most technical proofs: Does the poison in the man poison the logic? If the thinker is compromised, is the *Gedanke*—the Thought—corrupted?

  I want to stake out a position on this immediately, so we may proceed without evasion. My view is this: The diary is not merely a biographical footnote, but it is also not a refutation of his logicism. Rather, it stands as a tragic, ironic counterpoint to his life's work.

  Frege fought a lifelong battle against psychologism. He insisted that thoughts inhabit a "third realm"—objective, mind-independent, and untouched by the subjective quirks of whoever grasps them. He argued that the truth of a proposition does not depend on the psychology of the thinker. In his philosophy, he demanded we separate the *context of justification* from the *context of discovery*.

  The tragedy of the diary is that Frege failed to live up to his own philosophical standards. His own mind was not the pure vessel of objective truth he theorized it should be; it was cluttered with the subjective prejudices of his time. But here is the crucial point: The fact that Frege failed to inhabit the third realm does not mean the third realm does not exist.

  If anything, the diary reinforces the necessity of his distinction. We need the rigor of Fregean logic precisely because human minds are fallible, biased, and prone to error. The objectivity of arithmetic and the laws of truth are not validated by Frege's virtue; they are validated by their necessity for any thinking being who wishes to communicate truthfully. The logic survives the logician because the logic was designed to correct the very sort of thinking Frege succumbed to.

  So, how do we proceed today? We do not ignore the diary. To ignore it would be to disrespect the victims of the ideologies Frege entertained, and to disrespect the historians among us who study the discipline's moral complexities. But neither should we allow it to hijack the technical work. To claim that his antisemitism invalidates his quantification theory is to commit a genetic fallacy that Frege himself would have been the first to identify.

  Our task today is to engage with the philosophy on its own merits, while holding the biography in sober memory. We honor Frege best not by canonizing the man, but by rigorously testing the tools he gave us. We honor him by doing what he struggled to do: inhabiting that objective realm where thoughts are judged by their truth, not by the identity of the thinker.

  We have a full day of talks on sense, reference, and the foundations of arithmetic. Let us approach them with the seriousness they deserve, mindful that the pursuit of logical clarity is not just an academic exercise, but a moral imperative in a world where confused thinking can have dire consequences.

  Thank you, and let us begin.
