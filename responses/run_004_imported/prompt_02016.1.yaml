answer: |-
  This is a wonderful observation. You have stumbled upon a case where a technical term survived the death of the specific worldview that created it, leading to exactly the kind of confusion you are experiencing.

  Your intuition is correct: the modern philosophical example of the burning car feels morally positive, while Article XIV treats the concept as spiritually toxic. To understand why, we have to separate the **theological economy of salvation** (what the Reformers were fighting) from the **secular taxonomy of duty** (what philosophers discuss today).

  Here is an unpacking of Article XIV on its own terms, followed by an analysis of how it relates to modern moral philosophy.

  ---

  ### Part 1: What the Reformers Were Rejecting

  To understand Article XIV, we have to look at the specific Roman Catholic doctrines that the English Reformers were reacting against in the 16th century. The Article is not condemning kindness, charity, or heroism; it is condemning a specific accounting system regarding sin and salvation.

  #### 1. The Two-Tiered System: Precepts vs. Counsels
  In the medieval theology the Reformers opposed, there was a distinction between:
  *   **The Precepts (Commandments):** Rules binding on all Christians (e.g., do not murder, do not steal, attend mass). If you broke these, you were in sin.
  *   **The Counsels of Perfection:** Voluntary acts of higher spirituality (e.g., vows of poverty, chastity, and obedience taken by monks and nuns).

  The idea was that an ordinary layperson could be "saved" by following the Precepts, but a monk could achieve a higher spiritual status by following the Counsels.

  #### 2. The Treasury of Merit
  This is the crux of the issue. The medieval Church taught that Christ and the Saints had accumulated a vast "Treasury of Merit."
  *   If a monk took a vow of poverty, he was doing what was *required* of a monk, but because he wasn't *required* to be a monk in the first place, his suffering and discipline counted as "extra" credit.
  *   These "Works of Supererogation" (works over and above the duty) went into the Treasury.
  *   **Indulgences:** The Church claimed the authority to dispense this extra merit to ordinary people to reduce the temporal punishment for their sins (either for themselves or for souls in Purgatory).

  #### 3. Why the Reformers Called it "Arrogancy and Impiety"
  Article XIV attacks this system on three fronts:

  *   **Arrogancy:** To claim you have done *more* than God required implies that God's commandments were insufficient or that a human being can put God in their debt. The Reformers believed that because God is infinite and humans are finite, a human can never "out-give" God. As the Article quotes Luke 17:10, even when we have done everything commanded, we are "unprofitable servants." We have only done what was our duty; we have no surplus to offer.
  *   **Impiety:** This is the theological heavy hitter. The Reformers believed in *Sola Christus* (Christ Alone). They argued that Christ's sacrifice on the cross was **sufficient** for all sin for all time. If humans can generate "extra merit" through supererogatory works, it implies Christ's sacrifice was not enough and needs to be topped up by human effort. To the Reformers, this insulted the sufficiency of Christ.
  *   **Pastoral Danger:** They believed this doctrine corrupted morality. It allowed people to think they could sin freely as long as they (or someone else) bought an indulgence or relied on a monk's "extra" prayers to balance the ledger. It turned salvation into a financial transaction rather than a matter of faith and repentance.

  **In summary:** When Article XIV condemns Works of Supererogation, it is specifically condemning the idea that **humans can generate transferable spiritual merit that contributes to salvation.**

  ---

  ### Part 2: The Modern Philosophical Concept

  When moral philosophers today use the term "supererogation," they are generally not talking about salvation, God, or merit. They are talking about the structure of secular ethical obligations.

  The term was revived in its modern sense largely by the philosopher J.O. Urmson in a famous 1958 paper titled *"Saints and Heroes."* He needed a word to describe actions that fit a specific logical category:
  1.  **It is good to do them.**
  2.  **It is not wrong to omit them.**

  Your example of the burning car is perfect. If you run in and save the child, you are a hero (good). If you stay back because you are not trained and might die, you are not necessarily a villain (not wrong).

  In modern secular ethics, there is no "Treasury of Merit." If I save a child from a burning car:
  *   I do not earn "points" in heaven.
  *   I cannot transfer that good deed to cancel out my friend's tax fraud.
  *   I am not claiming to have fulfilled a divine obligation that didn't exist.

  Philosophers use the term to solve a problem in ethical theories (like Utilitarianism or Kantianism) that struggle to explain why we praise heroes but don't punish non-heroes. They need a category for "above and beyond the call of duty" without implying that the non-hero is immoral.

  ---

  ### Part 3: Do the Two Concepts Clash?

  You asked whether the Reformers' objection has any bearing on the modern concept, or if they are unrelated debates using the same word.

  The answer is: **They are largely unrelated debates, but there is a subtle point of friction.**

  #### 1. The Terminological Fossil
  The word *supererogation* comes from the Latin *supererogare*, meaning "to pay out over and above." It was used in accounting. The Church adopted it for spiritual accounting. Philosophers adopted it for moral accounting.
  *   **The Reformers** were arguing about **Soteriology** (How are we saved?).
  *   **Philosophers** are arguing about **Normative Ethics** (How should we treat each other?).

  The Reformers would likely have no objection to the modern philosophical definition *if* it remained strictly between humans. If a philosopher says, "Saving the child is supererogatory because you have no legal or social obligation to risk your life," the Reformers would not call that "impious."

  #### 2. The Point of Friction: Duty to God vs. Duty to Man
  Here is where it gets interesting. While modern philosophers see the burning car rescue as optional, a strict reading of Christian theology (including the Anglican one) might disagree.

  Jesus summarizes the Law as: "Love the Lord your God... and love your neighbor as yourself."
  *   **The Philosopher says:** You have no duty to risk your life for a stranger. Therefore, doing so is supererogatory.
  *   **The Theologian might say:** If you have the capacity to save your neighbor, and you do not, have you truly loved them as yourself?

  Some Christian ethicists argue that **there is no such thing as supererogation in Christianity.** Because the command to "love your neighbor" is infinite, you can never reach a point where you have done "enough." Therefore, every good deed is simply your "bounden duty."

  If you adopt this theological view, the modern philosophical concept of supererogation looks suspiciously like the "Works of Supererogation" condemned in Article XIV. It creates a category where we can say, "I was nice, but I didn't *have* to be, so I deserve special praise." The Article warns that this mindset leads to arrogance.

  #### 3. The "Transferable Merit" Distinction
  However, the strongest distinction remains the issue of **merit**.
  *   **Article XIV** rejects supererogation because it implies **transferable merit** (I can give my extra goodness to you to fix your sin).
  *   **Modern Philosophy** uses supererogation to describe **moral optionality** (I did something good that wasn't required).

  Modern philosophers do not claim that the bystander who saves the child earns credit that can be used to forgive the sins of the bystander who walked away. Because that mechanism is absent, the "impiety" charge doesn't stick in the secular context.

  ### Conclusion

  You are right to feel that the Article and the philosophy textbook are talking past each other.

  *   **Article XIV** is a polemic against a specific medieval mechanism where humans could earn "bonus points" with God to offset sin. It rejects the idea that we can ever be "in credit" with the Divine.
  *   **Modern Philosophy** uses the term to categorize actions that are praiseworthy but not obligatory within human society.

  The Reformers would likely look at the modern example of the burning car and say: "It is a glorious act of love, but do not call it 'supererogatory' in a way that suggests you have done more than God required of you, or that this act earns you salvation."

  The word survived, but the spiritual economy that gave it its dangerous charge was dismantled by the very Reformation that wrote the Article you are reading. You can appreciate the moral beauty of the "supererogatory" act in philosophy without falling into the "arrogancy and impiety" warned against in the Prayer Book, provided you don't think that act puts God in your debt.
