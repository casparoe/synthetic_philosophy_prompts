prompt: |-
  My mom's turning 80 next month, and since she taught Latin for thirty five years she's already vetoed the standard "age is just a number" toast. What she actually loves, and has made basically the whole family read at some point, is Cicero's De Senectute -- especially how Cato doesn't dodge the four classic complaints against old age (you can't be active anymore, the body's weaker, the pleasures are gone, death is close) but takes each one on directly and answers it. I got asked to give the toast, probably because I actually teach philosophy for a living, even though Cicero specifically isn't really my period. About half the room is her old students and collegues who'll clock exactly what I'm doing if I lean on Cicero, the other half is just family who wants cake and has no idea who Cato even is. Can you write me something around 4 minutes long that actually uses Cicero's four part structure -- including his answer to the death one, without it getting morbid -- to say something specific and true about her, and not just a classics lecture dressed up as a toast?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Mom's 80th birthday.
      *   **Honoree:** Taught Latin for 35 years, loves Cicero's *De Senectute* (On Old Age), specifically Cato's defense against the four complaints of old age.
      *   **Speaker:** Her child, teaches philosophy (but not ancient/classics specifically).
      *   **Audience:** 50% Latin teachers/colleagues (will recognize the reference), 50% family (just want cake, need accessibility).
      *   **Constraint:** Around 4 minutes long (approx. 500-600 words spoken at a moderate pace).
      *   **Key Requirement:** Use Cicero's four-part structure (Activity, Strength, Pleasure, Death) but make it personal, specific, and not morbid. Avoid clichés like "age is just a number."
      *   **Tone:** Respectful, warm, intellectual but accessible, celebratory.

  2.  **Deconstruct *De Senectute* (Cato's Four Arguments):**
      *   *Complaint 1:* Old age withdraws us from active employment (business/public life).
      *   *Complaint 2:* Old age enfeebles the body (physical strength).
      *   *Complaint 3:* Old age deprives us of physical pleasures.
      *   *Complaint 4:* Old age is not far from death.
      *   *Cicero/Cato's Counter:*
          1.  Activity changes form (mentorship, wisdom).
          2.  Strength of mind > strength of body.
          3.  Higher pleasures (conversation, learning) replace base ones.
          4.  Death is natural/fulfilling, like fruit ripening.

  3.  **Drafting Strategy:**
      *   **Opening:** Acknowledge the elephant in the room (the Latin reference) without alienating the non-Latin speakers. Establish the speaker's relationship (philosopher child).
      *   **Body Paragraphs (The Four Points):** Map each Ciceronian point to specific traits of the mom.
          *   *Activity:* She's retired but still teaching/mentoring (family gatherings, correcting grammar).
          *   *Strength:* Physical slowing vs. mental resilience/endurance.
          *   *Pleasure:* Shift from wild parties to deep conversation/reading/garden.
          *   *Death:* Frame it as legacy and continuity (students, family) rather than an end.
      *   **Closing:** Bring it back to the celebration, the cake, and a final toast.
      *   **Language:** Keep the Latin minimal but present (enough for the colleagues to nod). Ensure the philosophy doesn't overshadow the love.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with the "age is just a number" veto. Mention *De Senectute*. Explain briefly for the family.
      *   *Point 1 (Activity):* Cato says we don't stop working, we work differently. Mom didn't stop teaching when she retired. She teaches us.
      *   *Point 2 (Strength):* Body slows, but will remains. She's still the strongest person in the room morally/intellectually.
      *   *Point 3 (Pleasure):* Not about dancing on tables, but about good food, books, grandkids. The "feast of reason."
      *   *Point 4 (Death):* This is the tricky one. Needs to be uplifting. Cicero says it's like a ship reaching harbor or fruit ripening. Focus on her legacy living on in students and family.
      *   *Conclusion:* Raise a glass.

  5.  **Refining and Timing:**
      *   *Word Count Check:* A 4-minute speech is roughly 500-600 words.
      *   *Tone Check:* Is it too academic? Need to soften the edges. Make sure the family feels included.
      *   *Specifics:* Add details about her correcting grammar or the specific joy she finds in things.
      *   *The "Death" Argument:* Cicero argues that a life well-lived makes death natural. I should frame this as "she is already immortal through us."

  6.  **Writing the Draft (Iterative Process):**
      *   *Self-Correction during drafting:* I initially thought about quoting Latin phrases. *Better:* Just translate them but keep the structure obvious so the colleagues get the wink without the family getting lost.
      *   *Focus on the Mom:* Ensure every philosophical point lands on *her* life.
      *   *The "Death" section:* Make sure it doesn't sound like a eulogy. Focus on *continuity*.

  7.  **Final Polish:**
      *   Check the rhythm.
      *   Ensure the transition between the four points is smooth.
      *   Verify the length. (The resulting draft looks to be around 550-600 words, which is perfect for 4 minutes with pauses for laughter/applause).

  8.  **Final Review against constraints:**
      *   4 mins? Yes.
      *   Cicero's 4 parts? Yes.
      *   Not morbid? Yes, framed as legacy.
      *   Accessible? Yes, Latin explained contextually.
      *   Personal? Yes.

  *(Self-Correction Note: Make sure to explicitly mention that I'm a philosopher too, as requested, to acknowledge the irony/authority.)*

  9.  **Final Output Generation** (Proceed to generate the speech based on these thoughts).
answer: |-
  Good evening. As many of you know, I was asked to give this toast. I suspect this is because I teach philosophy for a living, and my mother assumes that means I automatically understand everything the ancient Romans ever wrote. It doesn't. But I do know an argument when I see one.

  When I asked Mom what she wanted to hear tonight, she vetoed the phrase "age is just a number." She told me if I wanted to say something meaningful, I should look at Cicero's *De Senectute*. For the family members currently wondering if there will be cake: there will be. For the Latin colleagues in the room: yes, I am going to steal Cicero's structure, because Mom taught us that the best arguments anticipate objections.

  Cicero, through the character of Cato, lists four complaints people make against old age. Mom has spent thirty-five years proving them wrong, not with theory, but with her life.

  The first complaint is that old age withdraws us from active life. People think retirement means stopping. But anyone in this family knows Mom never stopped teaching. She might not stand in a classroom anymore, but she corrects our grammar at the dinner table. She mentors former students who still call for advice. She manages this family with the efficiency of a consul. She hasn't withdrawn from activity; she has simply chosen her projects more wisely.

  The second complaint is that the body grows weaker. This is the one she finds most annoying. Yes, she admits, she doesn't run marathons. But Cicero argues that the strength of the mind outweighs the strength of the muscle. We have seen her navigate health scares, loss, and change with a resilience that puts people half her age to shame. Her posture at the podium was straight for thirty-five years; her posture in the face of adversity is still straighter.

  The third complaint is that old age deprives us of physical pleasures. Cicero says good riddance to the vices that cloud the mind. Mom would agree. She has traded the frantic pleasures of youth for the deeper joys of a garden in bloom, a book well-read, and a room full of people she loves. She enjoys the feast of reason far more than the food on the plate—though she does love this cake.

  Finally, the fourth complaint: that death is near. This is the heavy one. But Cicero argues that for a life well-lived, death is not a crash, but a harvest. It is the natural ripening of fruit. Mom, you have planted so many seeds. They are in the hundreds of students who learned to write because of you. They are in this family, who knows how to think because of you. You are not nearing an end; you are watching your legacy grow. You have made yourself immortal in the only way that matters.

  So, Mom, on your eightieth birthday, we don't toast a number. We toast the argument you have lived. You have shown us that age isn't a decline; it's a culmination.

  To Mom. *Ad multos annos.*
