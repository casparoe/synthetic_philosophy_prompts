          *   Why the defense is needed: Because standard decision theory assumes separability (preferences at $t_1$ shouldn't depend on $t_0$). Resolute choice challenges separability. Without defending it, we concede that rationality is purely local, which undermines long-term planning.

      *   **Conclusion:** Bring it back to the user's intuition. The "cost" isn't hidden; it's paid in the cognitive effort of maintaining identity over time. It's not a perpetual motion machine; it's a flywheel.

