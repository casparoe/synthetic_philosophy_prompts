      *   **Resolute Choice (McClennen):** An agent commits to a plan at $t_0$ and follows it at $t_1, t_2$, even if local preferences at $t_1$ suggest deviating. It preserves the *plan* rather than maximizing *local utility*.
      *   **Sophisticated Choice:** The agent anticipates future irrationality (or preference shifts) and chooses the best available option *now* given what they know they will do *later*. It avoids the pump by truncating the tree, but often leads to suboptimal outcomes compared to the original plan (dynamic inconsistency).
      *   **The User's Instinct:** Resolute choice is just "binding oneself" (Ulysses) but pretending the ropes aren't there. It feels like hiding the cost (thermodynamic violation).

