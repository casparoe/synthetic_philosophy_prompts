answer: |-
  Here is the tiebreaker: **Your roommate is right.**

  While your intuition that "feelings should count for something" is morally kind, it is logically incorrect in this specific context. Sincerely feeling guilty does **not** preserve Mia's right to criticize others for the same behavior, especially when the behavior is chronic.

  Here is the breakdown of why the guilt argument fails, which you can use to settle the debate.

  ### 1. Impact vs. Intent
  Social reliability is based on **impact**, not intent.
  *   **The Impact:** When Mia flakes an hour before dinner, the group is left with a reservation for the wrong number, a gap in conversation, and wasted time.
  *   **The Comparison:** When *another* friend flakes, the group experiences the exact same inconvenience.
  *   **The Verdict:** Mia's internal guilt does not fix the reservation or fill the empty seat. By claiming her guilt makes her flaking "different," she is centering her feelings over the group's experience. She is essentially saying, *"My inconvenience (feeling guilty) is more important than your inconvenience (waiting for me)."*

  ### 2. Guilt vs. Remorse
  This is the most critical distinction.
  *   **Guilt** is self-focused: "I feel bad about what I did."
  *   **Remorse** is action-focused: "I feel bad about what I did, so I will change my behavior to ensure I don't hurt you again."
  *   **The Verdict:** Mia has flaked 8 or 9 times. If she truly felt remorse, the behavior would have changed by attempt #3. Repeatedly doing the same thing while claiming to feel awful suggests she is addicted to the *apology* rather than committed to the *change*. Guilt without behavioral correction is just self-pity.

  ### 3. The "Moral High Ground"
  To call someone out for a behavior, you generally need to have standing.
  *   If you smoke a pack a day, you lose the standing to lecture your friend on the dangers of smoking. You can share *concern*, but you can't act as the *judge*.
  *   By making flaking "her whole thing" (ragging on others), Mia has appointed herself the Judge of Reliability.
  *   **The Verdict:** You cannot be the Judge and the Repeat Offender simultaneously. If she wants to stop calling people out, she can be a friend who struggles with planning. But if she wants to be the enforcer of plans, she must adhere to the rules she enforces.

  ### 4. The Emotional Tax
  There is a hidden cost to Mia's logic that you might be overlooking.
  *   When a friend flakes without guilt, you are just annoyed.
  *   When Mia flakes *with* guilt, you are annoyed **plus** you often feel pressured to comfort *her*. ("Oh don't worry, it's okay, don't feel bad!")
  *   **The Verdict:** Her guilt actually makes her flaking *more* burdensome than the people she criticizes. She is dumping her emotional regulation onto the friends she inconvenienced.

  ### The Nuance (Where you were half-right)
  You felt that guilt should count for something. It does—but it counts toward **forgiveness**, not **authority**.
  *   Because Mia feels guilty, she is likely a good person who struggles with anxiety or overcommitment. The group should probably forgive her more easily than they would a flake who doesn't care.
  *   However, forgiveness is a gift the group gives her; it is not a shield she uses to protect her right to criticize others.

  ### The Final Ruling
  Mia is being a hypocrite.
  *   **Does guilt matter?** Yes, it makes her a kinder person than a non-guilty flake.
  *   **Does it excuse the double standard?** No.
  *   **Does she lose the right to call people out?** Yes. Until she goes a significant period (e.g., 6 months) without flaking, she has forfeited the right to police others' reliability.

  **How to tell her:**
  "Mia, we know you feel bad when you bail. We believe you. But feeling bad doesn't fix the dinner reservation. You can't hold everyone else to a standard you can't keep yourself, no matter how guilty you feel. If you want to stop feeling guilty, the solution isn't apologizing; it's under-scheduling so you can actually show up."
