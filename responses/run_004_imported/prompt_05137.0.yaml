      *   *Principles of Nature and Grace:* The ultimate end is the happiness of minds.
      *   *Letter to Arnauld / Correspondence:* Discusses the hierarchy of substances.
      *   *Key Distinction:* Metaphysical goodness (existence/variety) vs. Moral goodness (happiness/virtue). Leibniz usually subordinates the former to the latter in the context of the *ultimate* purpose of creation.

  6.  **Synthesize the Verdict:**
      *   Leibniz would likely **reject** the Repugnant Conclusion.
      *   *Reason 1: Quality of Perception.* A world of "barely living" monads implies confused perceptions. A world of rational spirits implies distinct perceptions. Distinctness is a higher degree of reality/perfection than confusion.
      *   *Reason 2: The Primacy of Minds.* The "City of God" is the telos. The happiness of rational beings counts more than the mere existence of non-rational beings.
      *   *Reason 3: Harmony and Order.* The Repugnant Conclusion often implies a swarm. Leibniz values *harmonious* variety. A world of suffering/barely-positive lives might lack the harmonic proportion required for the "best" world.
      *   *Reason 4: Non-Aggregative Value.* Leibniz isn't a simple total utilitarian. He doesn't just sum up "units of joy." He looks at the *composition* of the universe. The presence of higher goods (virtue, wisdom) weighs more than the accumulation of lower goods.

