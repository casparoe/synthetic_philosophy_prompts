      *   *Argument for Rejecting Repugnant Conclusion:* Leibniz explicitly privileges *quality* of perception (distinctness) over mere *quantity* of existence. Rational spirits mirror God. The moral good outweighs the metaphysical good of mere existence. Harmony requires order, not just chaos/quantity.

