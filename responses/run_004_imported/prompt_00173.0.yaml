      3.  The Non-Linearity of Value (Why variance doesn't cancel).
      4.  The Causal Asymmetry of the World (Why ripple effects aren't random walks).
      5.  The Reference Class Relativity (How framing creates the distinction artificially).
      6.  Conclusion: The distinction is a stopgap, not a solution.

