answer: |-
  Here is an argument challenging the principled nature of the simple/complex cluelessness distinction, focusing on the epistemic unjustifiability of the "cancels out" assumption.

  ***

  ### The Collapse of Symmetry: Why the Simple/Complex Cluelessness Distinction Fails

  Hilary Greaves' distinction between simple and complex cluelessness is intended to save consequentialism from paralysis. By categorizing the vast majority of unforeseeable downstream effects as "simple" (symmetrically distributed around zero expected value), Greaves allows agents to focus on foreseeable, near-term consequences. However, this distinction relies on an epistemic privilege that real-world agents do not possess.

  The argument below contends that the distinction is not principled because the condition for **simple cluelessness**—that unforeseeable effects have no systematic tilt—is almost never met in a complex, non-linear causal world. Consequently, nearly all actions fall into the category of **complex cluelessness**, rendering the distinction useless for rescuing ordinary deliberation.

  #### 1. The Principle of Indifference is Not a Default
  The core engine of simple cluelessness is a specific application of the Principle of Indifference (POI). It asserts that because we lack evidence that unknown effects $E_1, E_2... E_n$ favor value or disvalue, we must treat their expected value as zero.

  However, in probability theory, the POI is notoriously sensitive to how possibilities are framed (Bertrand's Paradox). To claim that effects "wash out," one must assume that the *distribution of value* in the future is symmetric around the status quo. But we have no epistemic warrant for this assumption.
  *   **The Argument:** Absence of evidence for asymmetry is not evidence of symmetry. To classify a case as simple cluelessness, you need positive reason to believe the causal structure is symmetric (like a fair coin). In a chaotic social and ecological system, causal chains are rarely symmetric.
  *   **The Implication:** Claiming simple cluelessness requires a positive model of the future that asserts symmetry. Since we lack a model of the far future, we cannot justify the symmetry claim. Therefore, the default position cannot be "zero expectation"; it must be "unknown expectation," which is the definition of complex cluelessness.

  #### 2. The Non-Linearity of Value Prevents Cancellation
  The "washing out" argument assumes a linear value function. It assumes that if Action $A$ has a 50% chance of creating $+10$ value and a 50% chance of creating $-10$ value, the expectation is 0. This holds for aggregative hedonistic utilitarianism over short timeframes. It does not hold for longtermist value functions.

  Longtermism posits that value is heavily concentrated in specific trajectories (e.g., avoiding existential catastrophe, achieving technological maturity). This creates a non-linear value landscape with thresholds and tipping points.
  *   **The Argument:** In a system with critical thresholds, variance does not cancel out; it dominates. If an action introduces high variance into a system near a tipping point (even if we don't know which way it pushes), the expected value calculation is driven by the magnitude of the tail risks, not the mean.
  *   **Example:** Consider donating a malaria net. The "simple" view says the population effects wash out. But if population growth interacts non-linearly with resource scarcity to increase the probability of nuclear war by 0.0001%, the disvalue of that tail risk may dwarf the certain good of saving a life. Because we cannot quantify the skew, it is complex cluelessness. But because the value function is non-linear, we cannot assume the "good" ripples cancel the "bad" ripples. A ripple that triggers a lock-in event is not offset by a ripple that delays one.

  #### 3. Causal Asymmetry and the "Butterfly Effect"
  Greaves' distinction relies on the idea that unforeseeable effects are like noise. But in complex systems, unforeseeable effects are often signal. This is the problem of **Causal Asymmetry**.

  For effects to be "simple," the causal pathways of the action must be reversible or balanced. But time is irreversible, and causal chains branch exponentially.
  *   **The Argument:** We can almost always construct a plausible asymmetric causal story for any action. If I save a life today, that person exists. If I do not, they do not. The "Non-Identity Problem" logic applies here: the specific individuals who exist in the future depend on the precise timing of conceptions, which depend on the specific actions of the present.
  *   **The Implication:** Because the future population is entirely different depending on the action, we are not comparing "same world, slightly better/worse." We are comparing "World A with Population X" vs. "World B with Population Y." We have no common metric to assert that the value of Population X washes out against Population Y. Since the identities of future people are sensitive to initial conditions, every action changes the long-term trajectory in a way that is fundamentally unquantifiable but systematically skewed (because the people are different). This meets the criteria for complex cluelessness (systematic skew, unquantifiable) for *every* action.

  #### 4. The Reference Class Problem
  Whether an effect counts as "simple" depends entirely on how the agent chooses to group the unknown outcomes. This makes the distinction subjective rather than objective.

  *   **The Argument:** If I group all unknown future effects into "General Welfare," I might convince myself they wash out (Simple). But if I group them into "Effects on Existential Risk," "Effects on Moral Progress," or "Effects on Technological Lock-in," the symmetry disappears.
  *   **Example:** Buying a coffee.
      *   *Reference Class A:* "Economic transactions." Effect: Negligible noise. (Simple)
      *   *Reference Class B:* "Carbon emissions contributing to climate tipping points." Effect: Systematically negative, but unquantifiable regarding the specific tipping point. (Complex)
      *   *Reference Class C:* "Support for corporate supply chains that influence AI governance." Effect: Systematically skewed, unquantifiable. (Complex)
  *   **The Implication:** Since a consequentialist ought to care about *all* valuable outcomes, they cannot arbitrarily choose Reference Class A to evade complex cluelessness. If *any* valid reference class yields complex cluelessness, the action is tainted by it. Since we can always find a reference class involving long-term trajectory changes (which are inherently skewed and unquantifiable), the "Simple" category is empty.

  #### 5. The "Plausible Story" Threshold is Too Low
  Greaves defines complex cluelessness as cases where we have "reasons" to think effects are skewed. Defenders of the distinction argue that for simple cluelessness, we lack such reasons.

  However, in a highly interconnected world, the threshold for generating a "reason" is trivially low.
  *   **The Argument:** To move a case from Simple to Complex, one only needs a *qualitative* causal mechanism, not a quantitative one. Given our understanding of history, sociology, and physics, we can construct qualitative mechanisms linking almost any resource transfer to long-term skew.
      *   *Mechanism:* Resource transfer $\to$ Economic growth $\to$ Technological acceleration $\to$ Changed risk profile.
      *   *Mechanism:* Resource transfer $\to$ Population change $\to$ Political instability $\to$ Changed risk profile.
  *   **The Implication:** Because these mechanisms are theoretically sound (even if empirically unverified for the specific case), we always have "reason" to suspect a skew. We just don't know the *sign* or *magnitude* of the skew. But Greaves' definition of Complex Cluelessness covers cases where we know there is a skew but can't quantify it. If we acknowledge that *some* skew exists (due to non-linearity and causal asymmetry), but admit we can't measure it, we are in Complex Cluelessness territory. The only way to stay in Simple Cluelessness is to dogmatically assert the skew is zero, which is an unjustified empirical claim.

  ### Conclusion: The Distinction as a Pragmatic Stopgap, Not a Solution
  The simple/complex distinction attempts to draw a bright line between "knowable enough" and "unknowable." However, the analysis above suggests this line is illusory.

  1.  **Epistemically:** We cannot justify the symmetry required for simple cluelessness without a model of the future we do not possess.
  2.  **Ontologically:** The non-linear nature of value and causal asymmetry means effects do not mathematically cancel out.
  3.  **Methodologically:** The classification depends on arbitrary reference classes.

  If almost every action generates complex cluelessness because we can always construct an asymmetric causal story linking it to trajectory changes, then the distinction fails to rescue ordinary consequentialist deliberation. It merely hides the problem by labeling the vast uncertainty of the future as "simple" without sufficient warrant.

  To maintain the distinction, one must implicitly import non-consequentialist constraints (e.g., "common sense rules" or "deontological side-constraints") to rule out the speculative asymmetric stories. But if one must rely on non-consequentialist intuitions to decide which cluelessness is "simple," then consequentialism is not doing the justificatory work; the distinction is simply a post-hoc rationalization for following common sense.
