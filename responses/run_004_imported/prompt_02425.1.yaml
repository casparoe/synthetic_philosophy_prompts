  4.  **Drafting - Step-by-Step (incorporating technical details):**

      *   *Exchange 1:* Proponent sets up FairBot. Skeptic acknowledges the math but questions the meaning.
      *   *Exchange 2:* Proponent explains Löb's Theorem briefly ($\square(\square P \to P) \to \square P$). Skeptic accepts the proof but calls it a "fixed point trick."
      *   *Exchange 3:* Skeptic brings up CooperateBot. $FB$ cooperates, but $CB$ doesn't care. Is this trust?
      *   *Exchange 4:* Proponent admits $FB$ is flawed, introduces PrudentBot (checks if opponent punishes defectors).
