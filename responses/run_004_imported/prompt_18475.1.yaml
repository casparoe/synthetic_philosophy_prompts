      *   *Resolution:* Dismiss the charge due to insufficient evidence (the testimony is compromised), but do not exonerate Jordan of future scrutiny.
      *   *Standard:* A "Bias Disclosure & Corroboration" standard. If a proctor has specific prior negative information, their testimony needs corroboration or the bias must be disclosed/managed.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
