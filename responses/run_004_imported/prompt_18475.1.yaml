answer: |-
  **MEMORANDUM**

  **TO:** Honor Council Members
  **FROM:** [Your Name], Junior Class Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Discussion Memo: Case of Jordan (Chemistry Final)

  **Purpose**
  This memo is intended to frame our discussion for Thursday's vote regarding the alleged academic integrity violation by Jordan (Class of '26). As we prepare to deliberate, I want to ensure we are weighing both the specific facts of this incident and the broader precedent our decision will set. Given the split in our preliminary discussions, this memo outlines a recommended resolution and proposes a standard for handling observer bias in future cases.

  **Case Summary**
  Jordan is accused of cheating on the Chemistry final based on the testimony of a single proctor. The proctor reports observing Jordan tilt his paper and glance toward a neighbor's desk twice.

  The complicating factor is that 48 hours prior to the exam, a teacher informed the proctor informally that Jordan was "someone to watch" due to a cheating rumor from the previous semester. That rumor was never substantiated. Jordan's advocate argues that this warning created a "perceptual expectancy," compromising the reliability of the proctor's observation. The Council is divided on whether this prior knowledge invalidates the testimony or if it is simply part of an experienced proctor's job.

  **The Core Conflict: Experience vs. Expectation**
  We are grappling with two valid concerns.

  1.  **The Psychological Reality:** As covered in AP Psychology, human perception is not a camera recording; it is constructed. "Top-down processing" means our brains use prior knowledge to interpret sensory input. If the proctor expected to see cheating, her brain may have interpreted ambiguous head movements as glancing, even if they were not. If our Honor Code requires "direct, firsthand observation," that observation must be reliable. If expectation altered perception, the reliability is in question.
  2.  **The Operational Reality:** Our counter-argument is that *all* observation involves expectation. We hire experienced proctors specifically because they know what students look like when they are working versus struggling or cheating. If we dismiss testimony every time a proctor has a prior belief about a student, we effectively require video evidence for every conviction, which is not feasible.

  **Analysis**
  We must distinguish between *general professional experience* and *specific, unverified bias.*

  It is appropriate for a proctor to expect that *a student* might cheat; that is why they are watching. It is appropriate for a proctor to know that *a specific student* is often anxious or fidgety. However, it is procedurally dangerous for a proctor to be told immediately prior to an exam that *a specific student* is a suspected cheater based on baseless rumors.

  The former is professional vigilance; the latter is confirmation bias. The teacher's informal warning crossed the line from "be vigilant" to "look for guilt." In this specific instance, because the observation was brief (two glances), ambiguous, and made by an observer primed to see guilt, the "direct observation" standard has not been met beyond a reasonable doubt.

  **Recommended Resolution for Jordan**
  I recommend we vote **Not Responsible**.

  This is not necessarily a declaration that Jordan definitely did not look at his neighbor's paper. Rather, it is a finding that the *evidence provided* is insufficient to sustain a charge. The integrity of our process matters more than this single outcome. If we uphold a charge based on testimony tainted by unverified rumors, we undermine the fairness of the Honor Code itself.

  **Proposed Standard for Future Cases**
  To address the worry that we are "handcuffing" proctors, I propose we adopt the **"Corroboration Standard for Specific Bias."** This standard distinguishes between general experience and specific prior knowledge.

  1.  **General Experience:** A proctor's testimony remains valid if their expectation is based on general experience (e.g., "I've seen this behavior before") or general knowledge of a student (e.g., "This student usually struggles with focus").
  2.  **Specific Negative Intelligence:** If a proctor has received specific, negative information about a student's integrity prior to an exam (e.g., a warning from a teacher that "Student X cheated before"), their testimony regarding that student **requires corroboration** to meet the burden of proof.
      *   *Corroboration may include:* A second proctor's testimony, physical evidence (cheat sheets), or a statistical analysis of answer similarity.
      *   *Rationale:* This acknowledges that proctors need experience, but prevents unverified rumors from becoming self-fulfilling prophecies in hearings.

  **Next Steps**
  This standard does not stop us from catching cheaters; it simply ensures that when we do, our evidence is robust enough to withstand the reality of human psychology.

  Please review this framework before we meet Thursday. I believe this allows us to be fair to Jordan without making it impossible to enforce the Honor Code in the future. I look forward to discussing this with you all.

  Respectfully,

  [Your Name]
  Honor Council Member, Class of '24
