prompt: |-
  Okay so I've been down an AI-safety rabbit hole in my spare time lately (zero background in CS or philosophy, just a curious person with too much time on youtube and random pdfs). I kept running into this idea of "inverse reinforcement learning" - instead of hand-writing rules for what humans want, you just have an AI watch what people actually do and back out their preferences/reward function from the behavior. Made sense to me at first, like, isn't this basically what economists mean by "revealed preference" anyway?

  Then I got into a whole argument with a friend who does ML professionally, who insisted this is basically a solved-in-principle problem and its just a matter of more data and better algorithms at this point. But I stumbled on some paper (I think it had "Occam's razor" in the title?) arguing that this is actually impossible to fully solve even with infinite data and even with a simplicity prior to rule out dumb answers - something about how you can never separate "what someone wants" from "how good/rational they are at getting it" just by watching what they do, because for basically any goal you could imagine, theres some way of being irrational that produces the exact same actions. I also noticed that in practice people just build in an assumption that humans are "noisily rational" (mostly sensible, with some random error) to make the math tractable, which feels a bit like cheating, like you've decided the answer before you even started measuring.

  Could you walk me through, in a pretty gut-level intuitive way rather than the full math, why this is supposedly a deep "in principle" problem rather than just a "we need better data" problem? Is the core issue basically that you always have to smuggle in some assumption about rationality from outside the behavioral data before that data can even count as evidence of "preferences" at all - kind of like how you can't get an ought from an is without some extra premise? And is there any principled way out of that, or is everyone in this field just quietly picking an assumption about rationality that seems reasonable and hoping it's close enough to true?
