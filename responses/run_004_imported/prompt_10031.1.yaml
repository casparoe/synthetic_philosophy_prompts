prompt: |-
  My younger sister Nora died three weeks ago at thirty-one, and I'm giving her eulogy this weekend. She was diagnosed with borderline personality disorder at nineteen, and once she had that word she read everything she could find on it, joined a DBT (dialectical behavior therapy) group, and started narrating her own moods and relationships back to us in that vocabulary. What I keep coming back to is that it went both ways: over the twelve years since, I watched the diagnosis itself shift too, partly because of people like her pushing back on how dismissively it used to get discussed. She and that label kept remaking each other right up to the end, and I no longer believe there was ever a "real Nora" sitting underneath it, untouched.

  Our parents will be up front wanting the simpler version: that she was wonderful underneath, and an illness separate from her took her away. A few friends from her DBT group will be further back, and they'd hear that version as thin, almost erasing what she spent years building. I've never studied any of this, I've only lived alongside it. Could you write the eulogy? It should run about five minutes read aloud, comfort both halves of the room, and stay honest about how tangled Nora and her diagnosis really were, without ever reducing her to it.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Nora, 31 years old, died 3 weeks ago.
      *   **Speaker:** Older sibling (implied).
      *   **Key Theme:** The relationship between Nora and her Borderline Personality Disorder (BPD) diagnosis. It wasn't just an illness she *had*; it was something she engaged with, reshaped, and that reshaped her. There was no "real Nora" underneath untouched by it.
      *   **Audience Dynamics:**
          *   *Parents (Front):* Want the "she was wonderful, illness took her" narrative (separation of person and disease).
          *   *DBT Friends (Back):* Would find the separation narrative erasing of her work/identity.
      *   **Tone:** Honest, tangled but not reductive, comforting to both sides, lived experience (not clinical).
      *   **Length:** About 5 minutes spoken (approx. 650-800 words).

  2.  **Determine the Core Message:**
      *   The central tension is between "Nora *with* BPD" vs. "Nora *defined by* BPD" vs. "Nora *without* BPD."
      *   The prompt suggests a nuanced middle ground: Nora and the diagnosis "remade each other."
      *   The eulogy needs to validate the parents' grief (she was wonderful) without invalidating the friends' understanding (the diagnosis was part of her journey/identity).
      *   *Metaphor idea:* Weaving, clay, a conversation, a language. Let's go with "language" or "vocabulary" since the prompt mentions her narrating her moods in that vocabulary.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, the difficulty of speaking, and the diverse crowd. Establish the relationship (sibling).
      *   **The Diagnosis (The Elephant in the Room):** Address the BPD directly but gently. Acknowledge the parents' view (the struggle) and the friends' view (the tool).
      *   **The Nuance (The "Remaking"):** This is the crux. How she took the label and made it hers. How it changed how the family saw her.
      *   **Specific Memories/Qualities:** Need to show her humanity beyond the clinical. Her humor, her intensity, her love.
      *   **The Conclusion:** Bringing the two groups together. A final farewell that honors the whole person.

      *   *Self-Correction during thought process:* I need to be careful not to sound too academic. The prompt says "I've never studied any of this, I've only lived alongside it." The language must be personal, not clinical. Avoid jargon where possible, or use it the way Nora used it.

      *   *Addressing the Parents:* Validate that it was hard. Validate that she was wonderful.
      *   *Addressing the DBT Group:* Validate that her work mattered. That the vocabulary was real to her.

  4.  **Drafting - Attempt 1 (Mental Outline):**
      Hi everyone. Nora died. She was 31. She had BPD. Mom and Dad, you know she was good. Friends, you know she worked hard on it. It wasn't just a sickness. It was part of her. She read about it. She taught us words. We changed too. There wasn't a Nora without it. But there was also a Nora who was more than it. I love her. Goodbye.
      *Critique:* Too blunt. Needs more poetry and warmth. Needs to bridge the gap between the "illness" narrative and the "identity" narrative.

  5.  **Drafting - Attempt 2 (Focusing on the "Language" metaphor):**
      Start with the words she taught us. "Splitting," "Mindfulness," "Gray rock." She used these to explain herself. To our parents, these were medical terms. To her friends, they were tools. To me, they were just how we talked.
      *Refining the "Real Nora" concept:* The prompt says "I no longer believe there was ever a 'real Nora' sitting underneath it." I need to express this without sounding like the diagnosis *was* her. It's about integration. The diagnosis wasn't a mask; it was a lens.

      *Addressing the Parents:* "I know you wish it was just a cloud that passed over her."
      *Addressing the Friends:* "I know you know that cloud was part of the weather."
      *Synthesis:* "She was the sky and the weather."

  6.  **Writing the Content (incorporating the 5-minute constraint):**
      *   Word count target: ~750 words.
      *   Pace: Slow, deliberate.

      *(Self-Correction on Sensitivity)*: BPD carries stigma. I must ensure the eulogy doesn't reinforce the stigma (e.g., "she was difficult") but honors her agency in managing it. The prompt says she "pushed back on how dismissively it used to get discussed." I need to highlight her advocacy/agency.

  7.  **Final Polish:**
      *   Check the rhythm.
      *   Ensure the transition between the parents' perspective and the friends' perspective is smooth, not confrontational.
      *   Make sure the ending feels like a release.

      *(Key Phrase to include)*: "She and that label kept remaking each other." (From prompt).
