answer: |-
  Good morning. Thank you all for being here.

  For those who don't know me, I'm Nora's sibling. Standing here, looking out at this room, I see the two great loves of Nora's life: the family she was born into, and the community she built to understand herself.

  I know that for some of you, the story of Nora's life is a story of subtraction. You look at the last twelve years and see a brilliant, vibrant woman who was constantly having to fight against a chemical storm inside her. You see the diagnosis as the intruder. You want to believe that if we could just peel away the Borderline Personality Disorder, the stigma, the hospitalizations, and the intense emotions, we would find the "real" Nora underneath. Pure. Untouched. Safe.

  I know how much you need that to be true. It offers a kind of comfort. It means the illness took her, but it never really *had* her.

  And then, I look toward the back of the room. I see the friends from her DBT group. The people who sat in circles with her on Tuesday nights. The people who know that for Nora, that diagnosis wasn't just a storm she weathered. It was the map she used to navigate the terrain.

  If I tell you that the diagnosis was separate from her, I know you would feel that was a lie. You know that Nora didn't just "have" BPD. She studied it. She argued with it. She took the clinical vocabulary—words like "splitting," "validation," "dialectics"—and she turned them into a language of survival. She taught us how to speak it. She taught me that when she was angry, she wasn't being difficult; she was experiencing an emotional burn. She taught me that forgiveness wasn't a switch, it was a practice.

  For a long time, I tried to separate my sister from her struggle. I wanted to find the version of Nora that existed before the label. But the truth is, I don't think that version existed. Not in the way we want her to.

  Nora and her diagnosis were in a twelve-year conversation. They remade each other. The label changed how she saw herself, yes, but she also changed what that label meant. She pushed back against the dismissive ways people talked about women like her. She demanded nuance. She forced us, her family, to stop seeing her behaviors as choices and start seeing them as symptoms, without ever letting her off the hook for her humanity.

  There was no "real Nora" hiding underneath, untouched. There was just Nora. Whole. Complicated. Tangled.

  To my parents: I know you wish you could have saved her from the struggle. I know you want to remember the wonderful girl she was before the words got in the way. But I hope you can see that the struggle didn't hide her; it revealed her. Her courage wasn't in spite of the diagnosis. It was *in* the work she did with it.

  To her friends: I know you worry that saying she was "wonderful underneath" erases the work she did. But I hope you can hear that her work made her wonderful. The empathy she showed you, the boundaries she taught you, the fierce loyalty she had—that was the alchemy of her life. She took a heavy thing and made it into a tool.

  We often talk about grief as letting go. But grieving Nora feels like holding on to a contradiction. She was fragile and she was steel. She was exhausted by her emotions and she was the most feeling person I ever knew. She was defined by her disorder, and she was infinitely larger than it.

  I am not a doctor. I am just the one who lived alongside her. And what I saw was a woman who refused to be a passive patient in her own life. She wrote her own chart. She edited her own prognosis.

  So, I am not going to say the illness didn't take her. It did. But I am also not going to say it defined her. It accompanied her.

  Nora, thank you for teaching us the words. Thank you for the messy, loud, honest conversations. Thank you for showing us that we don't have to be untouched to be whole. We will miss you not in spite of who you were, but because of who you were. All of it.

  Rest now. You don't have to narrate the mood anymore. We understand.
