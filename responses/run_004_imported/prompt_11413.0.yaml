      *   **Non-Monetary Factors:** Time, stress, privacy, appeal risk.
      *   **Conclusion:** It is rational to reject the single-number requirement. The decision should be based on *robustness* (does the choice hold up across the range?) rather than *optimization* (finding the perfect number).

