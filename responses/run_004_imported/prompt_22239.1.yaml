answer: |-
  A philosopher named Karl Popper walks into a logic lab, holding two darts.

  "Look at this," Popper says, pointing to a target. "The bullseye is the Truth. I threw both darts and missed. But this one landed in the outer ring, and that one landed in the parking lot. So even though both missed, this one is *closer to the truth*. That's how science works! We don't have to be right; we just have to be *less wrong* than the last guy."

  Two logicians in the corner, Miller and Tichý, look up from their notebooks. They whisper for a minute, do some quick calculations, and shake their heads.

  "Sorry, Karl," Miller says. "We just ran the numbers on your definition. It turns out that if both darts miss the bullseye, neither one is closer. Mathematically, being one inch off is the same as being one mile off."

  Popper blinks. "What? So Newton wasn't closer to the truth than the guy who thought rocks fell because they were lonely?"

  "Nope," says Tichý. "According to your own rules, once you admit you're false, you can't be 'less' false. You're just wrong. All wrong theories are equally far from the truth."

  Popper stares at his darts. "So... my theory of scientific progress is false?"

  "Yep," says Miller.

  "And since it's false, it can't be closer to the truth than any other false theory?"

  "Exactly," says Tichý. "Which means your theory isn't even *less wrong* than saying science makes no progress at all. It's just equally wrong."

  Popper sighs, picks up his darts, and walks toward the door.

  "Where are you going?" Miller asks.

  "Home," Popper says. "Apparently, being closer to the exit doesn't mean I'm any nearer to leaving."
