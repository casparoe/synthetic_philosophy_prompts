answer: |-
  Here is a scene snippet featuring the joke. I've designed it to sound like something a pedantic professor would say—condescendingly intimate, treating the listener like a grad student who *should* know better, with a punchline that relies on the specific tension between Russell's logical framework and his emotional reality.

  ***

  The professor swirled his Pinot, trapping you against the sideboard with the easy confidence of a man who has never been cornered in his life. He lowered his voice, as if sharing state secrets rather than gossip about a dead logician.

  "Everyone cites *Marriage and Morals* as if it were a manifesto for rational non-possessiveness," he said, a thin smile playing on his lips. "They think Bertie was arguing that jealousy is an emotion we can simply deduct away. But if you actually read the correspondence with Dora... well, it changes the genre, doesn't it? It stops being a treatise and starts being a plea bargain."

  He took a slow sip, eyes dancing over the rim of the glass.

  "Russell posits that jealousy is merely a claim of property rights over another human being. A logical fallacy. But his life with Dora proved he wasn't opposed to property rights. He was just opposed to *competition*. He wanted an open marriage where he was the sole proprietor. And that is the genuine irony of the City College scandal. They didn't deny him the job because the book was immoral. They denied it because the biography caught up with the bibliography. The judge didn't see a philosopher advocating for freedom; he saw a man trying to write a universal law where he was the only exception."

  ***

  ### Why this works for your specific request:

  1.  **The "Property Rights" Angle:** This is the core philosophical argument in *Marriage and Morals*. Russell explicitly frames jealousy as an extension of capitalist property ownership applied to people. By twisting this to say Russell wanted a "monopoly" or to be the "sole proprietor," it attacks his specific philosophical framework rather than just making a generic "he was a hypocrite" joke.
  2.  **The Dora Reference:** Mentioning the "correspondence" signals to the listener (and your reader) that this isn't surface-level knowledge. It alludes to the very real, very angry letters Russell wrote when Dora had children with another man, demanding she adhere to the rationality *he* preached but couldn't practice.
  3.  **The CCNY Turn:** The joke lands on the City College firing (1940). The common historical take is that he was fired for being "lewd and lascivious." This joke reframes it: he was fired because the *hypocrisy* was so visible that it undermined his academic authority. It frames the legal loss as a *logical* failure ("universal law where he was the only exception"), which is a much stinging insult for a philosopher.
  4.  **The Voice:** Phrases like "deduct away," "changes the genre," and "biography caught up with the bibliography" give the character that insufferable, academic cadence without making him sound like a caricature. He thinks he's being brilliant, which makes him more annoying.
