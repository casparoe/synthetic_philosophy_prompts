      *Wait, one more thought:* The prompt says "take the grounding-objection side seriously." If I just dismiss it, I fail. I need to argue that the Grounding Objection is metaphysically serious but *doctrinally irrelevant* to the specific wording of the SoF. That's the key nuance.

