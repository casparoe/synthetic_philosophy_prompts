      *   **Task:** Draft a memo for the Thursday meeting.
      *   **Constraints:**
          *   Must make a *real recommendation* (Clear, Flag, etc.), not "discuss more."
          *   Must take the Grounding Objection seriously (cannot just punt or describe both sides neutrally).
