prompt: |-
  I'm giving the toast at the wedding of two friends I met about fifteen years ago on LessWrong, where the three of us have spent most of the years since arguing metaethics in the comments. Both bride and groom eventually settled on moral error theory in the mold of Mackie and Joyce: ordinary claims like 'you deserve each other' or 'it would be wrong to hurt one another' are, strictly speaking, false, since they presuppose the kind of objective, categorically prescriptive facts Mackie's argument from queerness was built to discredit -- and, following Joyce, they've become committed fictionalists, treating moral talk as a fiction worth keeping rather than a truth worth asserting. They've asked me, half-seriously, to keep the toast honest by their own lights: no 'meant to be,' no 'written in the stars,' nothing that smuggles back in the objective prescriptivity they spent a decade arguing away. Half the room will catch every word of that; the other half just came for a wedding. Write a five-minute toast that stays genuinely warm, never asserts anything a committed error theorist would have to call false, and turns their fictionalism into part of the joke rather than a wet blanket over the room.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** A friend of the bride and groom (15 years friendship).
      *   **Context:** Wedding toast (5 minutes).
      *   **Audience:** Split 50/50. Half are rationalist/LessWrong types who understand metaethics; half are normal people just there for a wedding.
      *   **Couple's Philosophy:** Moral Error Theorists (Mackie/Joyce style). They believe objective moral facts don't exist (error theory) but choose to engage in moral discourse as a useful fiction (fictionalism).
      *   **Constraint:** Do not assert objective prescriptivity (no "meant to be," "written in the stars," "true love," "ought" in a categorical sense).
      *   **Tone:** Genuinely warm, humorous (turn fictionalism into a joke, not a downer), accessible to normals but precise enough for the nerds.

  2.  **Deconstruct the Philosophical Constraints:**
      *   *Forbidden:* "You *should* be together," "It's *right* that you're married," "Love *conquers* all," "Destiny," "Soulmates."
      *   *Allowed:* "You *want* to be together," "This arrangement *maximizes utility*," "We *pretend* love is magic," "This is a *useful narrative*," "I *hope* you continue," "We *value* this."
      *   *The Trick:* Frame the wedding vows and the celebration as a conscious, shared adoption of a beautiful fiction. This validates their philosophy while celebrating the emotion.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the history (LessWrong, 15 years). Set the stage for the "inside joke" without alienating the normals.
          *   *Idea:* Mention how we met. Mention the arguments.
          *   *Hook:* The request to keep it "honest."

      *   **Addressing the Philosophy (The "Error Theory" Bit):**
          *   Need to explain it simply for the normals while nodding to the nerds.
          *   *Concept:* There are no cosmic rulebooks. But we write our own.
          *   *Joke:* Acknowledge that strictly speaking, "marriage is sacred" is false. But who cares?

      *   **The Fictionalism Pivot:**
          *   Joyce's contribution: It's a fiction worth keeping.
          *   *Application:* Love isn't a force of physics, but it's a game we play that makes life better.
          *   *Warmth:* The fact that they *choose* this fiction together is more meaningful than if they were forced by fate.

      *   **Direct Address to the Couple:**
          *   Focus on preferences, desires, and instrumental value rather than moral duty.
          *   "You make each other happy" (empirical claim) vs. "You make each other better" (moral claim).
          *   "You fit together" (compatibility) vs. "You were meant to be" (teleology).

      *   **The Toast:**
          *   Raise a glass.
          *   Final wording must avoid categorical imperatives.
          *   "To the fiction," "To the project," "To the future we imagine."

  4.  **Refining the Tone:**
      *   *Risk:* Too dry/academic.
      *   *Fix:* Use emotional language that describes *feelings* rather than *obligations*. "Joy," "comfort," "partnership."
      *   *Risk:* Confusing the normies.
      *   *Fix:* Keep the jargon minimal or immediately explained in plain English. "Objective moral facts" $\rightarrow$ "Cosmic rulebook."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I met them on the internet arguing about ethics. They think morality is fake. So I can't say they are "good" for each other. But they pretend it's real. That's nice. They chose this. Normies, don't worry, love is still real emotionally. Let's drink to their fake but useful story.

      *Critique 1:* Too blunt. Needs more warmth. Needs to sound like a wedding toast, not a lecture.

  6.  **Drafting - Iteration 2 (Adding Warmth & Humor):**
      Start with the LessWrong story. "We argued for 15 years." They asked me not to lie. So, strictly speaking, there is no "duty" to marry. But look at them. They *want* to. That's stronger. For the normals: think of it as writing your own story. For the nerds: it's a stable equilibrium. Let's toast to the useful fiction.

      *Critique 2:* Better. Need to make sure the "normals" feel included in the joke, not excluded by it. The joke should be on the *speaker* trying to walk the tightrope, or on the *absurdity* of being so precise at a wedding.

  7.  **Final Polish (incorporating into the final output):**
      *   *Opening:* Establish the 15-year timeline.
      *   *The "Constraint":* Make it a playful challenge. "They gave me a style guide."
      *   *The Philosophy:* Translate "Error Theory" to "No cosmic script." Translate "Fictionalism" to "Choosing the story."
      *   *The Warmth:* Emphasize *agency*. It's better to choose the game than be forced to play it.
      *   *The Normie Bridge:* "Even if you don't care about metaethics, you care about choice."
      *   *The Toast:* "To the project," "To the narrative."

  8.  **Review against Constraints:**
      *   "Meant to be"? No.
      *   "Written in stars"? No.
      *   "Wrong to hurt"? Avoid "wrong." Use "costly" or "undesirable."
      *   "Deserve"? Use "want" or "value."
      *   Warmth? Yes, focused on shared commitment.
      *   Time? ~750-850 words is about 5 minutes spoken at a moderate pace.

  9.  **Final Tweak:** Ensure the ending lands emotionally. The "fiction" isn't a lie; it's a shared world-building exercise. That's romantic in its own way.

  **(Self-Correction during drafting):** I need to make sure I don't accidentally say "It is *true* that you love each other" if "truth" implies correspondence to objective moral reality. Stick to psychological states. "You report feeling love," "You act *as if* love is binding." Actually, "You love each other" is an empirical psychological claim, which is fine. Just avoid "Love *commands* you."

  Let's write it.cw
answer: |-
  Good evening. For those of you who don't know me, I'm [Name]. I've had the privilege of knowing [Bride] and [Groom] for about fifteen years. We met in a very specific corner of the internet, on a forum called LessWrong, where the primary form of courtship is dissecting philosophical arguments in the comments section.

  So, naturally, when they asked me to give this toast, they sent me a style guide. It was two pages long. The main instruction was: "Please do not lie."

  Now, usually, when a couple says "be honest," they mean "don't make up stories about how we met." But for [Bride] and [Groom], it's a bit more technical. As many of you know, they are committed moral error theorists. For the half of the room currently checking your watches: this means they believe there are no objective, cosmic rulebooks. There is no "fate," no "written in the stars," and strictly speaking, no moral fact of the matter that says they *ought* to stay together.

  The other half of the room is nodding vigorously. You know exactly what I mean.

  So, I cannot stand here and tell you they are "soulmates." I cannot tell you this marriage is "sacred" in a way that binds the universe. And I certainly cannot say they "deserve" each other, because "desert" implies a moral ledger that, according to their best models, doesn't exist.

  But here is the beautiful part. And this is for everyone, whether you read Mackie or just read People Magazine.

  [Bride] and [Groom] are also fictionalists. They believe that even though moral truths aren't *real*, they are incredibly *useful*. They believe that life is better if we act *as if* love is binding. As if promises matter. As if there is something sacred about standing up in front of your community and saying, "I am choosing this person, again and again."

  Most people stumble into these fictions. They say, "I *had* to marry him," or "It was just *meant* to be." That removes the weight from the choice.

  But look at them. They looked into the void, confirmed that the universe is silent on the matter of their romance, and said, "Excellent. That means the story is ours to write."

  There is a profound warmth in that. It is easy to be loyal when you believe a cosmic policeman is watching. It is much harder, and much more meaningful, to be loyal when you know the only thing enforcing the promise is your own desire to keep it.

  I have watched them for fifteen years. I have seen them argue about the nature of normativity until 4:00 AM. And I have seen them bring each other coffee without being asked. I have seen them offer comfort when the world was heavy. I have seen them build a life that maximizes something far more tangible than moral truth: happiness, security, and deep, abiding companionship.

  They don't need the universe to tell them this is "right." The empirical data is sufficient. They make each other better. They make each other happier. They function, beautifully and consistently, as a team.

  So, to the normal people in the room: When you hear them say "I promise," know that they mean it more than most. Because they know a promise isn't a magical spell. It's a deliberate, conscious architecture they are building to shelter themselves from the chaos.

  And to the nerds in the room: We know this is a coordination game. We know this is a pre-commitment strategy. But look at the utility function they're optimizing. It's not cold. It's warm. It's generous. It's kind.

  [Bride] and [Groom], you have agreed to inhabit a shared fiction. You have agreed to pretend that your love is a law of nature, even though you know it is a law of your own making. That is not a limitation. That is the ultimate freedom.

  So, if everyone could please raise a glass.

  I cannot say "May you live happily ever after," because "may" implies a blessing I cannot bestow, and "ever after" is empirically dubious.

  Instead, I will say this:

  I observe that you both strongly prefer a future in which you are together. I predict that continuing this project will yield high returns in well-being for both of you. And I hope that you continue to find this specific fiction—the story of "Us"—to be the most valuable one you ever tell.

  To [Bride] and [Groom]. To the story you choose to tell. And to the truth that exists between you, even if it doesn't exist anywhere else.

  Cheers.
