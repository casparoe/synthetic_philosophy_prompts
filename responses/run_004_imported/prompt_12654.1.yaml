answer: |-
  You are not irrational, and your friend is pulling a classic move: he is hiding behind a mathematical technicality to win a philosophical argument.

  You have stumbled directly into the **St. Petersburg Paradox**, one of the most famous problems in the history of economics and decision theory. It was introduced by Nicolas Bernoulli in 1713 and has been debated ever since.

  Here is the breakdown of why your instinct is defensible, why your friend's "gotcha" is flawed, and how you can use this in your reporting.

  ### 1. The Math: He is right about the Expected Value
  Your friend is mathematically correct that the **Expected Value (EV)** of the game is infinite.
  *   50% chance of $1 (Tails on flip 1) → Contribution: $0.50
  *   25% chance of $2 (Tails on flip 2) → Contribution: $0.50
  *   12.5% chance of $4 (Tails on flip 3) → Contribution: $0.50
  *   ...and so on.

  You are adding $0.50 forever. The sum is infinity. If your only goal in life is to maximize the arithmetic average of your bankroll across infinite parallel universes, you should mortgage your house to play.

  ### 2. The Reality: He is wrong about "Rationality"
  Your friend claims that refusing to pay serious money means you are "bad at probability." This is false. It means you understand that **Expected Value is not the same as Expected Utility.**

  This was solved by Nicolas's cousin, **Daniel Bernoulli**, in 1738. He argued that people don't maximize dollars; they maximize *utility*. The first $1,000 you win changes your life; the millionth $1,000 is just numbers on a screen.

  If you apply a standard **logarithmic utility function** (which models how humans actually value money), the infinite expected value collapses into a finite number.
  *   For a person with modest wealth, the "fair price" to play this game is usually calculated between **$2 and $10**.
  *   For a millionaire, it might be **$20**.
  *   For a billionaire, maybe **$100**.

  **Your friend's specific claim that "utility doesn't fix it" is technically incorrect for this specific game.** For the standard St. Petersburg payout ($2^n$), logarithmic utility *does* converge to a finite number. He is likely conflating this with a "Super St. Petersburg" variant where payouts grow exponentially faster (e.g., $10^{2^n}$), which *can* break log utility. But for the game he described? Your utility objection holds water.

  ### 3. The "Bankroll" Argument (The most practical rebuttal)
  There is a simpler reason your friend is wrong: **No one has infinite money.**

  The infinite EV relies on the possibility of the coin landing heads 100 times in a row. $2^{100}$ is roughly $10^{30}$ dollars. That is more money than exists in the entire global economy.
  *   If the pot is capped at $1 million, the EV is ~$10.
  *   If the pot is capped at $1 billion, the EV is ~$30.
  *   If the pot is capped at the total wealth of the Earth, the EV is roughly $40-$50.

  Unless your friend is prepared to wire you $1 quintillion if you flip 60 heads, the game has a finite ceiling, and therefore a finite expected value. Your $20 offer is actually quite generous given the odds of seeing a payout higher than that are slim.

  ### 4. The Ergodicity Argument (The cutting-edge rebuttal)
  Since you are writing about risk and investing, this concept might be the most valuable for your piece. It comes from physicist **Ole Peters**.

  The friend's calculation assumes an **ensemble average**: if a million people played this game once, the average payout would be huge.
  But you are playing a **time average**: *you* play this game *once* (or a few times) in *your* lifetime.

  In systems with high volatility and compounding risks (like startup investing or betting), the time average does not equal the ensemble average. This is called **non-ergodicity**. Maximizing the ensemble average (EV) in a non-ergodic system can actually lead to ruin over time. Refusing the bet isn't irrational; it's an acknowledgment that you live in linear time, not a multiverse.

  ### Summary for your article
  Your friend is treating probability as a abstract Platonic truth, while you are treating it as a tool for navigating reality. Both are valid perspectives, but in finance and life, **your perspective is the one that prevents bankruptcy.**

  *   **The Instinct:** Your cap at $20 is defensible via Expected Utility Theory.
  *   **The Flaw:** "Maximizing Expected Value" is a dangerous heuristic for one-off, high-variance bets.
  *   **The Takeaway:** Rationality isn't about following the math blindly; it's about choosing the right math for the context. In the real world, bankrolls are finite, utility diminishes, and you only get one life to spend.

  Tell your friend he owes you $20 for the lesson in economic history.
