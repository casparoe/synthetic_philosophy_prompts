answer: |-
  **Title:** Signs, Substance, and Specie: The Metaphysical Roots of Berkeley's *Querist*

  **Introduction**

  It is a striking intellectual coincidence that the same man who dismantled the material world in the *Principles of Human Knowledge* later attempted to dismantle the gold standard in *The Querist*. In his immaterialist philosophy, George Berkeley argued that *esse est percipi*—to be is to be perceived—stripping matter of its status as an independent substance and reducing it to a collection of ideas sustained by mind. Decades later, facing the economic ruin of Ireland, he argued that money is not wealth, but merely a "ticket" or "counter," and that true wealth resides in the industry and labor of the people. The structural resemblance is undeniable: in both cases, Berkeley denies intrinsic reality to a fetishized object (matter/money) and relocates value to a dynamic relation (perception/industry).

  However, resemblance is not proof of lineage. Skeptics argue that Berkeley's economic views were merely pragmatic responses to an Irish crisis, sharing common ground with contemporaries who had no metaphysical axe to grind. This essay will evaluate whether *The Querist* is a genuine extension of Berkeley's immaterialism or a separate pragmatic project. After examining the strongest arguments for the pragmatic disconnection, I will argue that the connection is indeed profound. While Berkeley's economic policy was driven by immediate necessity, his *diagnosis* of the economic problem relies on a uniquely Berkeleyan theory of signs and language. Therefore, *The Querist* should be read as an applied epistemology: Berkeley treats money not just as currency, but as a linguistic token, and his economic reform is ultimately an attempt to correct a category error in how society perceives value.

  **The Case for Disconnection: Pragmatism and Context**

  The strongest argument against reading *The Querist* as metaphysics is that it renders Berkeley's economics unnecessarily obscure. By the 1730s, the idea that "money is not wealth" was not a radical philosophical insight but a growing consensus among practical economists. The Mercantilist obsession with hoarding specie (gold and silver) was already under fire by thinkers like Richard Cantillon and John Law, who argued that wealth lay in goods and trade volume. These men were not idealists; they were merchants and financiers concerned with liquidity and balance of trade.

  Furthermore, the context of *The Querist* is undeniably specific. Ireland was suffering from a acute shortage of coin, caused by absentee landlords collecting rents in Dublin and spending them in London. This drained the physical currency from the Irish economy, paralyzing local trade. Berkeley's proposal for a national bank to issue paper credit was a direct solution to a mechanical problem: if there is no coin, there is no trade; therefore, create a substitute for coin. In this light, Berkeley's claim that gold is merely a "counter" is not an ontological claim about the nature of reality, but a functional claim about the medium of exchange.

  Finally, the definition of "real" shifts between the two works. In the *Three Dialogues*, "real" concerns ontological status (does it exist independent of the mind?). In *The Querist*, "real" concerns utility (does it feed and clothe the population?). When Berkeley says matter isn't real, he means it has no substratum. When he says gold isn't real wealth, he means it has no use-value. To conflate these is to commit a category error. One could argue that Berkeley simply put on his "Bishop's hat" for economics and his "Philosopher's hat" for metaphysics, using the same rhetorical flourish ("X is not what you think") to serve two entirely different masters: Truth in one case, and Irish poverty relief in the other.

  **The Case for Connection: The Metaphysics of Value**

  However, to dismiss the connection as merely rhetorical is to ignore the consistency of Berkeley's intellectual method. Berkeley was not a philosopher who compartmentalized; his entire career was an attempt to combat "abstract ideas" that he believed led to error in science, religion, and morality. The core of his immaterialism is the rejection of a hidden *substance* that supposedly supports observable *qualities*. He argues we never perceive "matter," only colors, shapes, and textures. To posit a material substratum is to worship an empty word.

  In *The Querist*, Berkeley performs the exact same operation on money. The Mercantilists worshipped the "substratum" of money (gold/silver), believing value inhered in the metal itself. Berkeley argues that we never experience the "wealth" of gold; we only experience what the gold *does*—it commands labor, it circulates goods. To posit that the value lies in the metal rather than the circulation is, for Berkeley, the same kind of philosophical error as positing matter behind perception. It is the reification of an abstract idea.

  Moreover, Berkeley consistently prioritizes *activity* over *passivity*. In his metaphysics, the only true substances are spirits (minds), because they are active agents of will and perception. Matter is passive and inert. In *The Querist*, he defines wealth as "industry"—the active labor of the people. Hoarded gold is inert (like matter); circulating credit and working hands are active (like mind). The structural isomorphism is too precise to be accidental. Berkeley is not just saying "paper works better than gold"; he is saying "value is a power, not a thing." This aligns perfectly with his view that reality is constituted by powers and relations (minds perceiving) rather than static objects.

  **The Verdict: A Unified Theory of Signs**

  While the pragmatic context of Ireland cannot be ignored, the verdict must be that *The Querist* is a genuine, if undeclared, extension of Berkeley's metaphysics. The bridge between the two is not merely the denial of substance, but Berkeley's specific theory of **language and signs**.

  In his later work *Alciphron*, Berkeley clarifies that words do not always need to stand for specific ideas to have meaning; they can function as signs that prompt action or expectation. This is the key to unlocking *The Querist*. For Berkeley, money is a linguistic system. A coin is a word in the language of commerce. Just as the word "dog" does not need to be a furry animal to signify a dog, a "dollar" does not need to be silver to signify value. It only needs to be accepted within the grammar of the economy.

  The pragmatists (Side B) argue that Berkeley's view of money was common. This is true regarding the *conclusion* (paper credit is fine), but false regarding the *justification*. A merchant might support paper money because it's convenient. Berkeley supports it because he understands the *ontology of signs*. He realizes that people are making a metaphysical error by confusing the sign (the coin) with the thing signified (the labor/goods). This is exactly parallel to the error of confusing sensory ideas with material substance.

  Therefore, the resemblance is not superficial. It is methodological. Berkeley approaches the Irish economy as he approaches the universe: by analyzing the signs we mistake for substances. He diagnoses the Irish crisis not just as a lack of coin, but as a failure of imagination—a failure to perceive that wealth is a relational activity (industry) rather than a static object (gold). If he were merely a pragmatist, he would have focused on trade balances alone. Instead, he focuses on the *concept* of wealth, attempting to reform the national mind just as he attempted to reform the philosophical mind.

  **Conclusion**

  We must conclude that *The Querist* is immaterialism applied to political economy. While the immediate catalyst was the Irish depression, the lens through which Berkeley viewed the solution was forged in his metaphysics. He treats money as a sign without a necessary material referent, and wealth as an activity of mind and body rather than a pile of inert stuff. To read *The Querist* as purely pragmatic is to miss Berkeley's deeper point: that economic error, like philosophical error, stems from the worship of empty abstractions. The "tickets" of *The Querist* are the economic cousins of the "ideas" of the *Principles*. Both are valid only insofar as they are used by an active mind to navigate a world of relations. Berkeley did not leave his philosophy behind when he turned to economics; he simply found a new set of idols to smash.
