answer: |-
  This is a sharp intuition, and you have correctly identified one of the central, unresolved tensions in modern decision theory (specifically within the FDT/TDT lineage).

  To answer your questions directly: **No, you are not missing an obvious rebuttal that makes the problem go away.** However, **yes, this is a well-known class of objections** within the LW/decision-theory community, though it often gets discussed under different labels (e.g., "The Problem of Unbounded Priors," "Pascal's Mugging for FDT," or "The Complexity of the Deal").

  Here is a breakdown of where your argument holds, where the disanalogies lie, and why this remains an open problem rather than a settled one.

  ### 1. Is this a "Yeah, obviously" point?
  It is "obvious" in the sense that anyone who has tried to formalize FDT (Functional Decision Theory) or TDT (Timeless Decision Theory) runs into this wall immediately. It was a major topic of discussion around 2010–2016 (Yudkowsky, Soares, Benja Fallenstein, etc.).

  The specific issue you're pointing to is that **Solomonoff priors do not scale fast enough to penalize utility.** If utility scales as $3 \uparrow\uparrow\uparrow 3$ but the description length of the hypothesis only scales as $\log(3 \uparrow\uparrow\uparrow 3)$, the expected value diverges.

  This is generally considered a problem with **unbounded utility functions** rather than a problem unique to acausal trade. However, you are right to point out that acausal trade is uniquely vulnerable because it *requires* positing the existence of unobservable, high-capability agents to function at all. Pascal's Mugging is usually treated as a bug to be solved; Acausal Trade is often treated as a feature to be utilized. Your critique highlights the inconsistency in treating one as a pathology and the other as a protocol.

  ### 2. Is there a disanalogy between "Mugger" and "Trading Partner"?
  There are structural disanalogies, but they may not save you from the prior problem.

  **The Disanalogy: Logical Correlation vs. Causal Threat**
  *   **Pascal's Mugger:** Claims causal power over you from outside your light cone (or via magic). The link is one-way.
  *   **Acausal Trader:** Claims *logical* correlation. The "enforcement" isn't that they will hunt you down; it's that their simulation of you (which determines their action) is logically linked to your actual decision.
  *   **Why this matters:** To be a valid trading partner, the entity must be running a decision algorithm compatible with yours (or one that can model yours). This restricts the hypothesis space. You can't be mugged by *any* hyper-computable entity; you can only trade with entities that care about logical correlation.

  **Why your critique still holds:**
  Even with logical correlation, you still have to assign a prior to the *existence* of such an entity.
  *   Hypothesis A: There is a superintelligence 10^10 years in the future simulating me.
  *   Hypothesis B: There is a hyper-computational demon simulating 3^^^^3 copies of me.
  *   Hypothesis B is only slightly more complex description-wise than A, but the stakes (number of copies/value at risk) are astronomically higher. If the trade depends on the number of copies (e.g., "I will save 3^^^^3 lives if you eat this sandwich"), the expected value calculation explodes just like in the Mugging case.

  ### 3. Potential Rebuttals (The "Holes" you asked for)

  If you want to defend acausal trade against this, here are the standard lines of defense, along with their weaknesses:

  **A. Bounded Rationality / Compute Limits**
  *   **Argument:** You cannot model an agent that models 3^^^^3 agents. The computational cost of verifying the trade exceeds the capacity of your brain. Therefore, the hypothesis is not just "unlikely," it is *incoherent* to you.
  *   **Weakness:** This feels like a "get out of math free" card. Decision theory is supposed to tell us what is rational *in principle*, not just what fits in our working memory. Also, acausal trade is often pitched as something we should code into AI, which might have larger (though still bounded) limits.

  **B. The Complexity of the Mechanism**
  *   **Argument:** Describing the *number* of agents is cheap (3^^^^3). Describing a *mechanism* that allows acausal trade with that many agents is expensive. To trade acausally, the other party needs a commitment architecture that scales. Specifying that architecture might add enough Kolmogorov complexity to kill the prior.
  *   **Weakness:** This is the strongest defense. A mugger just says "I have power." A trader must say "I have power AND I have a commitment mechanism that logically binds me to your decision." The description length of a robust commitment mechanism might scale with the stakes. However, it's unclear if it scales *fast enough*.

  **C. Bounded Utility Functions**
  *   **Argument:** Rational agents *should* have bounded utility functions. If your utility caps out at some point, then 3^^^^3 lives isn't meaningfully more valuable than 3^^^^^3 lives.
  *   **Weakness:** Many people find bounded utility intuitively repugnant (would you really not prefer to save 3^^^^^3 lives over 3^^^^3?). It solves the math but creates moral weirdness.

  **D. Anthropics and Reference Classes**
  *   **Argument:** We have evidence about our own observations. Hypotheses that imply we are in a specific, tiny slice of a massive simulation might get penalized by anthropic reasoning (SSA/SIA).
  *   **Weakness:** Anthropics is itself a battleground. Depending on which formalism you use, you can sometimes get *more* vulnerable to these muggings (e.g., the "Presumptuous Philosopher" problem).

  ### 4. Verdict on Novelty
  You haven't discovered a bug the community missed, but you have correctly identified that **acausal trade inherits the unresolved baggage of Pascal's Mugging.**

  The community's current stance is roughly:
  1.  Pascal's Mugging is a sign that our current formalization of priors/utility is broken.
  2.  Acausal Trade is a theoretical consequence of FDT *if* we assume the priors don't explode.
  3.  Therefore, we can't fully endorse Acausal Trade until we solve the Mugging problem.

  Most proponents of acausal trade implicitly assume a "sanity check" prior: *Unless I have specific evidence that acausal partners exist, I assign the hypothesis 'no partners exist' a probability near 1.* But as you noted, if the payoff is high enough, "near 1" isn't enough.

  ### Summary
  *   **Is your point valid?** Yes. Acausal trade is epistemically vulnerable to the same prior-scaling failures as Pascal's Mugging.
  *   **Is it new?** No, it's a standard objection in decision theory circles, often discussed as "The Unbounded Priors Problem."
  *   **Is there a fix?** No consensus fix exists. The most common "solution" is to assume bounded utility or bounded compute, but both are controversial.

  If you write this up, the value add wouldn't be pointing out the problem (that's known), but rather analyzing whether the **Complexity of the Mechanism** (Rebuttal B) scales fast enough to save acausal trade specifically, even if it doesn't save Pascal's Mugging generally. That is a narrower, more tractable niche that might yield interesting results.

  Does that align with what you were chewing on?
