      *   *Revisionist/Nuanced View (The Guest's View):* Animals have *sentiment* (sensation/passion) but lack *pensée* (thought/conscious reflection/language). Pain exists as a mechanical reaction, but there's no "inner witness" or soul experiencing it qualia-wise. Or, perhaps they feel pain but it's not *conscious* pain in the human sense.
      *   *Key Texts:* *Discourse on Method* (Part V), *Meditations*, *Principles of Philosophy*, *Letters to More* and *Newcastle*.
      *   *Key Problem:* If they scream and withdraw, how is that different from a machine? If they *feel*, where does the feeling happen without a mind?

