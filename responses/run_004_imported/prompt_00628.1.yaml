      *   *Key Concept:* *Conatus*. If the state impedes the *conatus* of half the population, is it stable? Spinoza thinks excluding them *preserves* stability. The Friend thinks including them *increases* power. This is an empirical disagreement, not a metaphysical one.

  8.  **Final Plan:**
