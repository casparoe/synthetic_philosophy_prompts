answer: |-
  This is an exceptionally sharp philosophical disagreement, and your intuition is correct: the standard "internal critique" (that Spinoza *should* have been a feminist because his metaphysics undermines fixed natures) often relies on a normative leap that Spinoza's political naturalism does not automatically license. Your friend is arguing from the standpoint of the *Ethics* (what human beings *can* become through reason), while Spinoza in the *Political Treatise* (TP) is arguing from the standpoint of political physics (what human beings *are* given their current affects).

  To defend your position rigorously, we need to show that the inferential move your friend makes—**from "this hierarchy is produced by custom" to "a Spinozist has no reason to endorse it"**—fails because it misunderstands the ontological status of "custom" in Spinoza's system. For Spinoza, customs are not mere illusions; they are causal mechanisms that produce real differences in *potentia* (power), and since *jus* (right) is co-extensive with *potentia*, customs that produce hierarchy produce right.

  Here is the rigorous case for your side, engaging with the structure of Chapter 11, followed by an analysis of where your own argument might reach its limit.

  ### I. The Ontology of Right: Why "Custom" is Not "Idle"

  Your friend's objection relies on a latent distinction between *nature* (metaphysically necessary, normative) and *convention* (contingent, normatively idle). She assumes that if women's subordination is "conventional," it lacks the weight of "natural" right.

  However, in **TP Chapter 2**, Spinoza explicitly dissolves this distinction.
  *   **TP 2.4:** "Whatever each thing does by the laws of its own nature, it does with supreme right."
  *   **TP 2.19:** "The right of nature... is co-extensive with [each thing's] power."

  Crucially, Spinoza rejects the idea that humans are a "dominion within a dominion" (TP 2.6). Human passions, prejudices, and customs follow the "common laws of nature" just as much as geometry does. Therefore, a power differential produced by centuries of patriarchal upbringing is not a "mere" convention; it is a **fact of natural power**.

  If the social machinery of Spinoza's 17th-century Europe systematically reduces the *potentia* of women (by denying them education, confining them to the domestic sphere, conditioning them to deference), then, in the specific context of that time and place, women literally possess less *power* to assert their will against the common order. Since *jus naturale* is defined by *potentia*, they possess less *natural right* in that specific context.

  To argue, as your friend does, that "it's just custom, therefore it shouldn't count," is to appeal to a normative standard of justice external to Spinoza's immanent naturalism. It implies that right *ought* to be distributed based on potential capacity rather than actual capacity. But Spinoza's political science is descriptive of forces, not prescriptive of ideals. If the "custom" renders women unable to participate in the council without destabilizing the state (due to the affects of jealousy or conflict, as Spinoza claims), then excluding them is a rational calculation of power preservation, consistent with his definition of right.

  ### II. The Specific Argument of TP Chapter 11

  We must look at exactly what Spinoza argues in the final paragraphs of **TP Chapter 11**. He is not arguing that women lack rational souls. He is arguing from **institutional stability**.

  Spinoza defines the democratic state as one where the council is constituted by the whole multitude of men (*omnis multitudo virorum*). When he turns to women, he offers three specific claims:
  1.  **Empirical Precedent:** No society has ever ruled jointly.
  2.  **The Amazon Counter-Example:** Where women ruled, they excluded men (swapping one exclusivity for another, not achieving joint rule).
  3.  **The Affect of Jealousy:** Men and women are driven by sexual affects (lust, jealousy) that would make joint deliberation impossible. "For example, if men and women were to rule together, men would be jealous of women... and hence they would not be able to live in harmony." (TP 11.4, paraphrased).

  Your friend wants to say: *These affects are products of social conditioning. Change the conditioning, change the affects.*

  **Your Counter-Argument:** Spinoza is designing a constitution for men *as they are*, not as they *might be* under ideal philosophical education. The *Political Treatise* is distinct from the *Ethics*. The *Ethics* outlines the path to freedom (overcoming passive affects); the *TP* outlines how to build a state that remains stable *given* that most people live under the guidance of passion.

  If the *current* affective economy (driven by existing customs) makes joint rule a source of civil strife, then a Spinozist legislator *must* exclude women to preserve the state. The end of the state is **peace and security** (TP 1.6), not abstract equality. If including women triggers affects that dissolve the common power, then including them violates the fundamental *conatus* of the state.

  Therefore, pointing out that the affects are "customary" does not help. Customs are real causes. If the custom of sexual jealousy is currently a dominant force in the multitude, it is a "law of nature" for the purpose of political calculation. To ignore it is to be a utopian, which Spinoza explicitly despises.

  ### III. Engaging the Friend's Strongest Case (Hasana Sharp)

  Your friend will likely cite commentators like Hasana Sharp (*Spinoza and the Politics of Renaturalization*). Sharp argues that Spinoza's monism undermines any fixed "human nature" that could justify hierarchy. In the *Ethics*, there is no essential difference between men and women that dictates capacity; differences are modal and relational.

  **The Strong Form of Her Objection:**
  If human nature is mutable, and power is generated by the composition of bodies, then a state that excludes women is actively *diminishing* the total power (*potentia multitudinis*) of the multitude. By excluding half the population, the state weakens itself. A "consistent Spinozist" should want to maximize the power of the multitude. Therefore, even if current customs subordinate women, the state should be designed to *overcome* those customs to increase total power.

  **Your Rebuttal:**
  This is a stronger argument, but it still relies on a specific empirical claim: *Would including women actually increase the total power of the state?*

  Spinoza's answer in TP 11 is **No**. He believes the friction caused by sexual affects would decrease the state's power more than the inclusion of women would increase it. He prioritizes the **unity** of the council over the **size** of the council.

  For your friend's argument to work, she must prove Spinoza wrong on empirical grounds (i.e., "Joint rule does not actually cause jealousy that destroys states"). She cannot prove him wrong on *metaphysical* grounds (i.e., "Women are naturally equal"). Spinoza admits they might be naturally equal in essence, but denies they are equal in *power* within the current affective regime.

  If your friend argues, "But we could change the regime," she is no longer interpreting the *Political Treatise*; she is critiquing it from the standpoint of the *Ethics*. She is asking Spinoza to be a revolutionary, when he explicitly positions himself as a realist who takes "men as they are."

  ### IV. Where Your Argument Might Break Down (The Limit of Naturalism)

  You asked to understand exactly where your argument might fail. There is a vulnerability in the "Naturalist Defense" you are mounting.

  **1. The Problem of Self-Fulfilling Prophecies:**
  Spinoza defines right as power. But political institutions also *constitute* power. If the state excludes women *because* they lack power, but that exclusion is what *prevents* them from developing power, the state is engaging in a feedback loop that artificially limits its own *potentia*.
  In **TP 7.2**, Spinoza argues that the best state is one where men are led *as if* by reason, even if they are not. He acknowledges that institutions can shape affects.
  *   **The Breakdown Point:** If Spinoza admits that institutions can modify affects (which he does), then designing an institution that *presupposes* the permanence of patriarchal affects is arguably irrational. It treats a mutable cause as a necessary one. A "consistent Spinozist" might argue that a democracy which includes women would, over time, *alter* the affects of jealousy and create a more powerful multitude. By failing to account for the *educative power of the state*, Spinoza's argument in Chapter 11 is inconsistent with his own theory of institutional affect in earlier chapters.

  **2. The Definition of *Sui Juris*:**
  In **TP 11.3**, Spinoza defines those who are *sui juris* (independent) as those who live under their own guidance or are integrated into the state's power. He excludes servants and women because they are in the power of masters/husbands.
  *   **The Breakdown Point:** Spinoza argues women are in the power of husbands due to sexual affects. But in a Democracy, the law is the common power. If the law recognizes women as citizens, they are no longer "in the power of husbands" but "in the power of the state." Spinoza's argument assumes the private power of the husband supersedes the public power of the state. This contradicts his general aim in the *TP*, which is to subordinate private affects to public law. If the state is truly sovereign, it should be able to regulate marriage and sexual affects to make joint rule possible. By conceding to the private affect of jealousy, Spinoza admits a limit to the sovereign's power that he denies elsewhere.

  ### V. Conclusion: Verdict on the Inferential Move

  Your intuition is philosophically robust. **Your friend's specific inferential move ("It is custom, therefore a Spinozist has no reason to endorse it") does not go through.**

  1.  **Custom is Power:** In Spinoza's naturalism, customs are causal forces that generate real inequalities in *potentia*. Right follows power, not potential.
  2.  **Stability over Essence:** The goal of the *TP* is state preservation. If current affects (even customary ones) threaten preservation, excluding the source of friction is politically rational within Spinoza's framework.
  3.  **No Teleology:** Spinoza does not believe history is moving toward equality. He believes we must navigate the forces present.

  **However,** your defense is not absolute. You can concede the following to your friend:
  While the move "it's custom therefore it's wrong" fails, the move **"it's a mutable custom that limits the state's total power, and the state ought to maximize power"** is a valid Spinozist critique. Spinoza's error in Chapter 11 is likely not metaphysical (denying women's nature) but **empirical and institutional**. He fails to apply his own insight that institutions shape affects. He treats the affects of sexual jealousy as a fixed constraint rather than a variable that a well-designed democracy could modulate.

  **Summary for your discussion:**
  Tell your friend she is right that Spinoza is inconsistent, but wrong about *why*. He isn't inconsistent with his metaphysics of nature/convention (because customs *are* natural powers). He is inconsistent with his own **political utilitarianism**. He excludes women to preserve stability, but by doing so, he likely weakens the total *conatus* of the multitude and concedes sovereignty to private passions (jealousy) rather than public law. That is the true Spinozist critique: not that he violated a norm of equality, but that he miscalculated the physics of power.
