answer: |-
  You have stumbled directly into what philosophers of language call **The Embedding Problem** (or sometimes The Projection Problem) regarding slurs. It is one of the most contentious debates in the field, and your intuition as a writer is actually tracking with the most robust contemporary theories.

  To answer your specific question: **The family of theory that explains your experience is the Semantic/Externalist family (specifically Combinatorial Externalism or Conventional Implicature), not the Pure Expressivist/Attitude family.**

  Here is the breakdown of why the "Attitude" theory fails to predict the "laundering" effect you expected, and why the word remains "contaminated" in your narrative space.

  ### 1. Why the "Attitude" (Expressivist) Theory Fails Here
  The Expressivist view (championed by theorists like Allan Pred or early work by Christopher Potts) argues that the offensive content of a slur is not part of its truth-conditional meaning, but rather an expression of the **speaker's current psychological state** (contempt, hatred, endorsement of a hierarchy).

  *   **The Prediction:** If the toxicity is solely in the *speaker's attitude at the moment of utterance*, then a narrator who does not hold that attitude should be able to report the speech act without transmitting the toxicity. The narrator is essentially saying, "He performed a hate-speech act," without performing one themselves. The "stain" should stay on the character, not the page.
  *   **The Reality:** As you've noticed, the stain spreads.
  *   **The Failure:** Expressivism assumes a firewall between the *reporter* and the *reported*. It treats language like a sterile container. But slurs are not sterile containers; they are more like radioactive isotopes. The Expressivist theory fails because it treats the offensiveness as a property of the *agent*, whereas your reader experience confirms the offensiveness acts like a property of the *concept* or the *token* itself.

  ### 2. Why Semantic/Externalist Theories Explain the Contamination
  The theories that align with your experience argue that the derogatory content is baked into the **semantic value** or the **social history** of the term itself, independent of the current speaker's intent.

  **A. Combinatorial Externalism (Christopher Hom)**
  Hom argues that slurs refer to social constructs created by oppressive ideologies. The meaning of the slur *is* the ideology.
  *   **Why it fits your novel:** When your narrator reports the slur (even by describing it as "a slur" or "the N-word"), they are invoking the social construct associated with it. You cannot mention the construct of "racial inferiority in 1950s Alabama" without invoking the violence and history attached to it. The meaning is external (in the world/history), not internal (in the speaker's head). Therefore, the narrator cannot "launder" it, because the narrator is still pointing at the same toxic historical object.

  **B. The "Display" Hypothesis (Anderson & Lepore)**
  This theory suggests that slurs are prohibited words, similar to how certain images are prohibited. The harm is caused by the **tokening** of the word in a public space.
  *   **Why it fits your novel:** Even if you don't print the letters, by explicitly signaling *which* slur was used, you force the reader to mentally tokenize the word to understand the sentence. The reader has to retrieve the concept to process the report. By forcing the reader to cognitively activate the slur, the narrative space becomes "contaminated." The reader becomes a witness to the harm, not just an observer of the report.

  **C. Presupposition Accommodation**
  When a character uses a slur, they presuppose a world where that slur has validity. When a narrator reports it without heavy distancing, the narrative flow often requires the reader to temporarily "accommodate" that presupposition to follow the story. Even if the narrator condemns it, the *presence* of the concept in the narrative discourse normalizes its availability as a descriptor in that world.

  ### 3. The Narrative "Echo" Effect
  There is a specific literary-philosophical layer here beyond pure semantics. In fiction, the narrator's voice and the characters' voices share a textual ecosystem.

  *   **Bakhtinian Dialogue:** Mikhail Bakhtin argued that in novels, words are "half-ours, half-someone else's." When a narrator reports a slur, even indirectly, the ideology attached to that slur enters the narrative discourse. It creates an **echo**.
  *   **The Reader's Burden:** The "contamination" you feel is the reader being forced to hold the tension of that word's existence. The Attitude Theory assumes the reader is passive. But the reader is active. If the text requires the reader to think about the slur to understand the scene, the reader is implicated in the linguistic act.

  ### 4. Craft Implications: Don't Fight the Contamination
  You asked which theory explains this, but the deeper answer is: **Trust the contamination.**

  The fact that the sentence feels "infected" even when the word is merely mentioned is not a failure of your craft; it is an accurate philosophical representation of how slurs function in reality. Slurs *do* poison the environment they are spoken in, regardless of who speaks them or why.

  If you try to "launder" the word (e.g., by having a narrator overly apologize for it, or by using clinical distancing that feels sterile), you might accidentally validate the Attitude Theory—which is to say, you might suggest that the word *could* be safe if handled correctly. But your intuition tells you it isn't safe.

  **Strategies for handling this:**
  1.  **Lean into the Discomfort:** If the sentence feels heavy, let it be heavy. That weight is the atmospheric pressure of the setting (1950s Alabama). The reader *should* feel the toxicity of the environment, even when the narrator is "good."
  2.  **Focus on the Aftermath, Not the Act:** Since the "mention" carries weight, focus on the physical or emotional recoil of the listener. This shifts the semantic load from the *word* to the *wound*.
  3.  **Orthographic Interruption:** You mentioned not printing the word. Continuing to use "the slur" or "the N-word" is often better than printing it, precisely because it acknowledges the prohibition (Anderson & Lepore) without forcing the visual token. However, be aware that *naming* the prohibition still invokes the concept.
  4.  **Narrative Distance:** If the contamination is too strong, increase the temporal distance. A narrator looking back from 1980 on 1950 might be able to frame the word more as a historical artifact than a present-tense threat, though the semantic stain will remain.

  ### Summary
  The **Attitude/Expressivist** theory fails to predict your experience because it assumes meaning is localized in the speaker's intent. Your experience confirms the **Semantic/Externalist** view: the meaning (and harm) is localized in the word's history and social function.

  The "contamination" you feel is the **Embedding Problem** manifesting aesthetically. The slur refuses to be embedded in a neutral context because its very definition is non-neutral. As a writer, you aren't failing to sanitize the word; you are succeeding in representing its true linguistic power.
