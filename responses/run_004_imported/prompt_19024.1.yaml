          *   *Dodge:* "It's complex, likely both."
          *   *Follow-up:* "Give me a specific dataset. Genetic? Fossil?"

      *   *Filling the Gap (Need 8-10 total).*
          *   *Q5: Developmental Constraints.* How do we quantify them?
          *   *Q6: The "Pan-Adaptationist" Strawman.* Is she fighting a ghost? Modern adaptationists (like Grafen) know about constraints.
          *   *Q7: Neutral Theory.* Is structuralism just Neutral Theory in disguise?
          *   *Q8: Engineering/Evolutionary Medicine.* Practical costs of her view. If we assume spandrels, do we miss cures?
          *   *Q9: The "Just-So" Label.* When does an adaptive story become testable?
          *   *Q10: Future of the Field.* Where is structuralism in 20 years?

  4.  **Refining and Polishing (Adding the "Dodge" and "Follow-up"):**
      *   *Review against constraints:* Are they tough but fair? Do they prevent the "just-so story" dismissal?
      *   *Tone Check:* Ensure it sounds like a podcast host who knows their stuff, not an aggressor.
      *   *Specifics:* Ensure the architectural fact is handled carefully (it's a common critique, need to make sure it lands philosophically).
      *   *Refining the "Just-So" Dodge:* The prompt specifically mentions she uses this move. I need to make sure the questions preempt this.

      *(Self-Correction during drafting)*: Make sure the architectural question isn't just "gotcha." It needs to be about whether the *logic* of the metaphor holds if the physics are wrong.
      *(Self-Correction on Exaptation)*: Ensure the distinction between *origin* and *maintenance* is clear.
      *(Self-Correction on Methodology)*: Focus on *risky predictions*.

  5.  **Final Review of the 10 Questions:**
      1.  Architecture (Spandrel vs. Pendentive).
      2.  Methodology (Queller/Dennett/Risky Predictions).
      3.  Exaptation (Origin vs. Maintenance).
      4.  Falsifiability (Feathers).
