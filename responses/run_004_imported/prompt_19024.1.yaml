answer: |-
  Here are ten interview questions designed to corner a hardcore structuralist without being hostile. They are structured to preempt the "just-so story" dismissal by forcing methodological specificity.

  ### 1. The Architectural Accuracy of the Metaphor
  **Question:** "Let's start with the famous image itself. Architectural historians have pointed out that the triangular spaces in St. Mark's Basilica you and Gould famously cited are technically pendentives, not spandrels, and the mosaics weren't structurally necessary in the way the paper implies—they were decorative choices made *after* the structure was built. Does this factual error matter? Is it a harmless label, or does the physical inaccuracy actually undercut the metaphor's argumentative force regarding structural necessity?"

  *   **The Likely Dodge:** "It's just a metaphor. The philosophical point about constraints stands regardless of the architectural pedantry."
  *   **The Follow-Up:** "But your whole critique rests on the idea that certain features are *unavoidable* consequences of the architecture, not decorative add-ons. If the original example was actually a decorative choice layered onto a structure, doesn't that accidentally validate the adaptationist view that form often follows functional intent rather than structural inevitability?"

  ### 2. The Queller/Dennett Methodological Critique
  **Question:** "David Queller and Daniel Dennett have both argued that while the Spandrels paper was a devastating negative critique, it never cashed out into a rival methodology with its own risky predictions. Adaptationism generates hypotheses we can test. If structuralism is just saying 'wait, maybe it's a constraint,' how do we test *that* without falling into the same unfalsifiable trap you accuse adaptationists of?"

  *   **The Likely Dodge:** "We use comparative phylogenetics to show traits are conserved across lineages regardless of environment."
  *   **The Follow-Up:** "But phylogenetic conservation is consistent with both strong stabilizing selection and structural constraint. Without an independent measure of the 'structural load,' aren't you just inferring constraint from the absence of an adaptive story you've already rejected?"

  ### 3. Exaptation and the "Origin vs. Maintenance" Trap
  **Question:** "In the 1982 paper with Vrba, Gould introduced 'exaptation' to describe traits co-opted for use after arising as byproducts. But critics note that once a spandrel is co-opted, it is immediately subject to fine-tuning by selection. If the maintenance and refinement are adaptive, does the non-adaptive origin really do any explanatory work for the trait's current form, or does 'exaptation' quietly give the game back to selectionism?"

  *   **The Likely Dodge:** "History matters. We need to know the true causal sequence, not just current utility."
  *   **The Follow-Up:** "I agree history matters, but if 90% of the trait's current complexity is due to post-co-option selection, isn't labeling it a 'spandrel' mostly a historical footnote rather than a biological explanation of why the trait looks the way it does today?"

  ### 4. The "Strawman" Adaptationist
  **Question:** "The 1979 paper targeted a very specific, somewhat caricatured version of British selectionism. Today, most evolutionary biologists explicitly model constraints and trade-offs within an adaptive framework. Do you feel you're fighting a ghost? Is there any serious biologist left who actually claims *every* trait is an optimal adaptation without considering structural limits?"

  *   **The Likely Dodge:** "The rhetoric has changed, but the practice hasn't. Look at the literature; it's still adaptationist by default."
  *   **The Follow-Up:** "Can you point to a specific recent paper where the authors ignored a known physical constraint to posit an adaptive story? If the 'default' is now to test for constraints, what work is the Spandrels critique still doing?"

  ### 5. Operationalizing "Constraint"
  **Question:** "You often say a trait is a byproduct of developmental architecture. But development is incredibly plastic. How do you quantify 'constraint' in a way that distinguishes it from 'lack of genetic variation'? If a trait doesn't evolve, is it because physics forbids it, or because the mutation never arose?"

  *   **The Likely Dodge:** "We look at the morphospace. If the trait falls in a region that is developmentally inaccessible..."
  *   **The Follow-Up:** "But mapping morphospace requires assuming a model of development. If that model is wrong, you might label something 'structurally impossible' that is actually just 'selectively disadvantageous.' How do you validate the developmental model independently of the evolutionary outcome?"

  ### 6. The "Just-So" Threshold
  **Question:** "Your go-to response to adaptive hypotheses is often that they are 'just-so stories.' But science is full of narratives that become testable later. At what specific point does an adaptive story stop being a 'just-so story' and become a hypothesis? Is there a threshold of evidence you require that adaptationists rarely meet?"

  *   **The Likely Dodge:** "When they manipulate the trait and show a fitness difference in the wild."
  *   **The Follow-Up:** "We can do that for beak depth or coloration, but not for complex historical traits like the human chin or language. Are you saying that for any trait we can't experimentally manipulate, the adaptationist null is automatically false? Doesn't that make structuralism a argument from ignorance?"

  ### 7. Structuralism vs. Neutral Theory
  **Question:** "Is structuralism distinct from Neutral Theory? If a trait is a spandrel, it's presumably not under selection. But Kimura's Neutral Theory already accounts for non-adaptive traits via drift. Is 'structuralism' just Neutral Theory with a focus on development, or is there a category of traits that are neither adaptive nor neutral, but structurally necessary?"

  *   **The Likely Dodge:** "Neutral theory is about molecular drift. Structuralism is about phenotypic necessity."
  *   **The Follow-Up:** "But if a phenotype is fixed due to structural necessity, it effectively behaves like a neutral trait in terms of selection coefficients. If the mathematical treatment is the same, why do we need a separate philosophical banner for it?"

  ### 8. The Cost of False Negatives
  **Question:** "Let's talk about applied biology. In evolutionary medicine or bio-engineering, assuming a trait is functional usually leads to discoveries about *why* it breaks. If we assume a trait is a spandrel, we might stop looking for its function. Have there been cases where the 'spandrel' label halted productive research that an adaptationist framework would have pursued?"

  *   **The Likely Dodge:** "Better to halt bad research than pursue false leads. We don't want to waste time looking for functions that aren't there."
  *   **The Follow-Up:** "But if you're wrong, and it *was* an adaptation, you've closed the book on understanding a mechanism. Given the success of adaptationist heuristics in medicine, isn't the structuralist stance the riskier bet for scientific progress?"

  ### 9. The Positive Heuristic
  **Question:** "If I'm a grad student coming into your lab today, and I'm forbidden from assuming traits are adaptations, what is my positive research program? What question do I ask on day one that an adaptationist wouldn't ask?"

  *   **The Likely Dodge:** "I ask: 'What are the developmental pathways that generate this variation?'"
  *   **The Follow-Up:** "But an adaptationist asks that too, to understand the heritability of the adaptation. If the *method* is the same, but the *interpretation* differs, isn't this a philosophical disagreement rather than a biological one?"

  ### 10. The Falsifiability Closer (Feathers)
  **Question:** "I want to end on a concrete challenge. Take feathers. Adaptationists argue they were selected for insulation or display before flight. A structuralist might argue they are modified scales necessitated by skin topology. What specific piece of evidence—fossil, genetic, or developmental—would make you throw up your hands and say, 'Okay, feathers are primarily an adaptation, not a spandrel'? I need a falsification condition."

  *   **The Likely Dodge:** "It's never binary. It's always a mix of constraint and selection."
  *   **The Follow-Up:** "I understand it's a mix, but I need to know where the weight lies. If we found a fossil lineage where feather-like structures evolved rapidly in response to a specific thermal pressure, bypassing the usual developmental constraints, would that convince you? Or is the 'structural constraint' argument immune to that kind of data?"
