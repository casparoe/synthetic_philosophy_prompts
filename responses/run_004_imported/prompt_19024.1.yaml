prompt: |-
  I co-host a small philosophy-of-biology podcast and next month's guest is a structuralist biologist who's built her whole career defending the Gould-Lewontin spandrels critique against adaptationism -- properly hardcore about it. Her go-to move whenever someone hands her a concrete adaptationist story is to just say 'that's a just-so story' and move on without touching the specifics, and I don't want to let her get away with that for a whole hour. Draft me eight to ten interview questions that go beyond having her restate the critique: I want at least one on the fact that the San Marco mosaics actually sit in pendentives, not spandrels (i think? someone told me this once and I never confirmed it), and whether that's a harmless label or actually undercuts the metaphor's argumentative force; one that presses the Queller/Dennett-style complaint that the critique never cashed out into a rival methodology with its own risky predictions, so its no less unfalsifiable than what it's attacking; one on whether Gould & Vrba's 'exaptation' category quietly gives up the game, since co-opted spandrels seem to get fine-tuned by selection right after co-option anyway; and end with one that forces her to say what evidence would make her call some specific trait -- feathers, say -- a real adaptation instead of a byproduct. For each, note the dodge she'll probably reach for and give a follow-up that closes it off.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** Co-host of a small philosophy-of-biology podcast.
      *   **Guest:** A hardcore structuralist biologist, defender of the Gould-Lewontin (1979) "Spandrels of San Marco" critique against adaptationism.
      *   **Guest's Style:** Dismissive of concrete adaptationist stories ("that's a just-so story"), avoids specifics.
      *   **Goal:** 8-10 interview questions that go beyond restating the critique. Need to press her on methodology, specific claims, and potential inconsistencies.
      *   **Specific Requirements:**
          *   One question on the architectural accuracy of the "spandrel" metaphor (pendentives vs. spandrels).
          *   One question on the Queller/Dennett critique (lack of rival methodology/risky predictions).
          *   One question on Exaptation (Gould & Vrba) potentially conceding to selectionism post-co-option.
          *   One closing question on falsifiability (what evidence would convince her a trait like feathers is an adaptation?).
