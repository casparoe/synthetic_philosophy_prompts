          *   *Drafting Q2:* Ask about positive heuristics. How do we distinguish constraint from adaptation without assuming adaptation first?
          *   *Dodge:* "We use comparative phylogenetics."
          *   *Follow-up:* "Isn't that still testing adaptive hypotheses? Where is the *structural* prediction?"

      *   *Requirement 3: Exaptation (Gould & Vrba).*
          *   *Core Issue:* If a spandrel gets co-opted, selection acts on it. Does the origin matter if the maintenance is adaptive?
          *   *Drafting Q3:* Ask about the boundary between origin and maintenance.
          *   *Dodge:* "Origin matters for historical truth."
