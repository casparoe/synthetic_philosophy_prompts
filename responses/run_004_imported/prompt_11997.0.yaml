answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Framework for the Innovation Fund: Proposal A vs. Proposal B

  **Introduction**

  As we prepare to vote on the allocation of this year's $500,000 Innovation Fund, I want to thank the committee for a rigorous debate. Specifically, I want to acknowledge the strength of the argument made by the majority in favor of Proposal B (the air-quality advocacy campaign). The logic of Expected Value (EV) is compelling: mathematically, a 10 percent chance of saving 4,000 lives yields a higher average return (400 lives) than a 95 percent chance of saving 250 lives (237.5 lives). If we were making this investment annually for a decade, I would agree that Proposal B is the unequivocal choice. In a repeatable game, playing the odds is the only rational strategy.

  However, I am writing to suggest that our current situation differs from a repeatable game. Because this is a single, non-repeatable decision, I believe we need to adjust our framework to account for "single-shot risk." This memo outlines why a hybrid approach better serves our mission, proposes a specific funding split, and suggests a rule for future committees.

  **The "One-Shot" Problem**

  The EV calculation relies on the Law of Large Numbers—the idea that if we make enough bets, the average outcome will match the mathematical expectation. But our foundation does not have infinite capital or infinite time. We are making this specific bet once.

  In a single-shot scenario, the 90 percent probability of Proposal B achieving *nothing* is not just a statistical detail; it is the most likely reality we will face next year. If we fund B exclusively and the campaign fails (as it likely will), we return to our donors and community having saved zero lives with this fund. While the *potential* impact is higher, the *risk of total ineffectiveness* is also maximized.

  Furthermore, we must consider the reliability of the estimates. Proposal A's metrics (maternal health interventions) are historically stable. Proposal B's metrics (policy advocacy abroad) are inherently volatile. There is a significant risk that the 10 percent probability is overconfident. If the true chance of success is actually 5 percent, the EV of Proposal B drops to 200 lives, making it inferior to Proposal A even on paper.

  **Recommendation: A Portfolio Approach**

  We do not need to choose between "math" and "caution." We can treat this fund as a micro-portfolio. By splitting the allocation, we secure a baseline of certain good while still purchasing a meaningful "ticket" for the high-impact outcome.

  I recommend we allocate the $500,000 as follows:

  *   **60% to Proposal A (Maternal Health): $300,000**
  *   **40% to Proposal B (Advocacy): $200,000**

  **Rationale for the 60/40 Split:**
  1.  **Guaranteed Impact:** This ensures we definitively save approximately 150 lives (scaling Proposal A linearly). This fulfills our immediate duty of stewardship.
  2.  **Meaningful Upside:** While $200,000 may not fund the *entire* advocacy campaign, it allows us to fund a critical phase or leverage co-funding. We retain a chance at the high-impact outcome without betting the entire farm.
  3.  **Respecting the EV Argument:** By allocating 40 percent to Proposal B, we are acknowledging that its higher expected value deserves significant capital, just not 100 percent of it given the risk profile.

  **A Rule for Future Decisions**

  To help future committees navigate this tension, I propose we adopt the **"Repeatability Test"** as part of our grant rubric:

  > *When evaluating high-risk/high-reward grants, the committee must assess whether the decision is repeatable.*
  >
  > *   **If Repeatable:** (e.g., an annual operating fund) Prioritize Expected Value. High-risk bets are acceptable because failures will average out over time.
  > *   **If Single-Shot:** (e.g., a one-time discretionary fund) Apply a "Risk Discount." High-variance options must demonstrate a significantly higher Expected Value (e.g., 2x or 3x) to outweigh low-variance options, to account for the unacceptable cost of total failure in a non-repeatable context.

  **Conclusion**

  Choosing Proposal A over B is not a rejection of data or efficiency; it is an acknowledgment of our limitations as a small foundation making a one-time decision. Conversely, choosing B over A is not reckless; it is an ambitious attempt to maximize good.

  A 60/40 split honors both impulses. It allows us to be responsible stewards of the capital we have *now* while remaining ambitious about the impact we *might* have. I hope this compromise allows us to vote unanimously and move forward with confidence.

  I look forward to discussing this at our meeting on Tuesday.
