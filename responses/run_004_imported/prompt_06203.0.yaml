prompt: |-
  I'm taking a seminar on formal epistemology this term, and I'm also the student representative on my university's Academic Integrity Board, which is drafting a policy for cases where the only evidence is a score from a well-calibrated AI-writing detector: of every hundred essays it flags at "98% confidence," about ninety-eight really are AI-written. Several faculty argue that this alone justifies finding each flagged student responsible for a violation; others want the score barred from ever being sufficient by itself, since treating it as sufficient means we already know, before hearing a single case, that some students found responsible under the rule are actually innocent. Even our Chair concedes this is almost certainly true of the Board's record over the years, though she stands behind every verdict she's personally signed. Draft the short memo I'll circulate before our next meeting: recommend an evidentiary standard the Board can actually apply, and engage seriously with the "calibration is enough" position rather than dismissing it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Student Representative on the University's Academic Integrity Board.
      *   **Task:** Draft a short memo to circulate before the next meeting.
      *   **Topic:** Drafting a policy for cases where the *only* evidence is a score from a well-calibrated AI-writing detector (98% confidence = 98% true positive rate).
      *   **Conflict:**
          *   Faculty Position A: The score alone justifies finding responsibility (Calibration is enough).
          *   Faculty Position B: The score should never be sufficient by itself (because it guarantees some false positives/innocents found responsible).
          *   Chair's Position: Acknowledges some past verdicts might have been wrong (statistically) but stands by them procedurally.
      *   **Requirements:**
          *   Recommend an evidentiary standard the Board can actually apply.
          *   Engage seriously with the "calibration is enough" position (don't dismiss it).
          *   Tone: Professional, thoughtful, suitable for an Academic Integrity Board context (formal but accessible).
          *   Context: The user is taking a seminar on formal epistemology (implies an appreciation for probabilistic reasoning, reference classes, and standards of proof).

  2.  **Deconstruct the Core Philosophical/Legal Problem:**
      *   This is the "Reference Class Problem" or the "Problem of Statistical Evidence" (often illustrated by the Gatecrasher Paradox or Prison Yard Riot cases in legal philosophy).
      *   *The Issue:* High probabilistic likelihood (98%) vs. Individualized Justice.
      *   *Faculty A's Argument:* If we know the error rate is 2%, acting on the 98% is rational and efficient. It maximizes accuracy overall.
      *   *Faculty B's Argument:* Due process requires more than naked statistics. We cannot condemn an individual based solely on group membership (the class of "flagged essays") without individualized evidence.
      *   *The Chair's Concession:* Acknowledges the statistical reality but maintains procedural legitimacy. This hints at a distinction between *epistemic* certainty and *procedural* legitimacy.

  3.  **Determine the Goal of the Memo:**
      *   Bridge the gap between the two faculty positions.
      *   Propose a standard that respects the statistical weight of the detector *without* making it the sole basis for sanction.
      *   Show understanding of formal epistemology (probabilistic reasoning) without being overly academic/jargon-heavy.
      *   Maintain the student representative voice (advocating for fairness but acknowledging institutional needs).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty of the task. Validate both sides.
      *   **Engaging "Calibration is Enough":**
          *   Why is this tempting? It's mathematically sound in the aggregate.
          *   It treats the detector like a reliable witness.
          *   If we ignore it, we might let cheaters go.
          *   *Key Epistemological Point:* 98% is a high credence. Why isn't it knowledge?
      *   **The Counter-Argument (Why it's not enough):**
          *   The "Individualization Principle."
          *   Statistics tell us about the *group*, not the *specific case*.
          *   The moral weight of accusing a specific person requires a link to *their* action, not just probability.
      *   **The Proposal (The Evidentiary Standard):**
          *   Need a "Plus Factor."
          *   The AI score creates *probable cause* or a *prima facie* case, shifting the burden of production, but not the burden of persuasion.
          *   Standard: "AI Score + Corroborating Context."
          *   Examples of corroboration: Draft history, oral defense, stylistic deviation from past work.
      *   **Addressing the Chair's Point:**
          *   Acknowledge that *any* system has error.
          *   Distinguish between *systemic error* (unavoidable) and *procedural unfairness* (relying solely on stats).
      *   **Closing:** Call to action for the meeting.

  5.  **Refining the Tone and Content (Self-Correction during drafting):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Keep terms like "naked statistical evidence" but explain them briefly. Ensure it sounds like a policy recommendation, not a philosophy paper.
      *   *Critique:* Did I engage seriously with Faculty A?
      *   *Fix:* Make sure to explicitly state that their reliance on calibration is rational from a utilitarian/accuracy standpoint. Don't call it "wrong," call it "insufficient for *this* context."
      *   *Critique:* Is the recommendation actionable?
      *   *Fix:* Be specific about what counts as corroboration.

  6.  **Incorporating Formal Epistemology Concepts:**
      *   The prompt mentions the user is in a formal epistemology seminar. The memo should subtly reflect this training.
      *   Concepts to weave in: *Credence vs. Knowledge*, *Reference Classes*, *Individualized Evidence*.
      *   *Idea:* Use the distinction between "high probability" and "justified belief in a specific instance."

  7.  **Final Polish:**
      *   Check length (should be a "short memo").
      *   Ensure the recommendation is clear.
      *   Make sure the Chair's position is handled delicately (respectful but firm on the policy change).

  8.  **Final Review against constraints:**
      *   Recommend standard? Yes.
      *   Engage "calibration is enough"? Yes.
      *   Short memo format? Yes.
      *   Tone appropriate? Yes.

  *(Self-Correction Note)*: I need to make sure I don't sound like I'm accusing the Chair of misconduct. She admitted the statistical reality. I should frame the policy change as strengthening the *legitimacy* of her verdicts, not correcting past mistakes.

  9.  **Drafting the Content:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** [Your Name], Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Evidentiary Standards for AI-Detection Evidence

  As we draft the new policy regarding AI-writing detectors, we face a tension between statistical reliability and individual due process. This memo outlines a recommended evidentiary standard that respects the calibration of these tools while safeguarding the legitimacy of our verdicts.

  **The Case for Calibration**
  We must engage seriously with the position that a 98% confidence score is sufficient for a finding of responsibility. From a purely epistemic and utilitarian standpoint, this argument is strong. If a tool is well-calibrated, treating a 98% probability as certainty maximizes overall accuracy. To ignore such strong statistical evidence risks exonerating guilty students at a high rate, undermining the value of our degrees. If we accept that all empirical evidence carries some risk of error (eyewitness testimony, forensic data), proponents argue it is inconsistent to single out algorithmic probability as uniquely deficient.

  **The Limitation of "Naked Statistics"**
  However, Academic Integrity adjudication is not merely about aggregate accuracy; it is about attributing *specific* actions to *specific* agents. This is the distinction between high *credence* and justified *attribution*.

  A 98% score tells us about the reference class (flagged essays), not the individual case. Relying solely on this score creates a procedural deficit: the student is condemned based on group membership rather than individualized evidence. Even if we accept the Chair's concession that some past verdicts were statistically likely to be erroneous, our policy must ensure that current verdicts are *procedurally* defensible. A system that knowingly sanctions innocent students based solely on a probability threshold risks losing moral authority, regardless of its calibration.

  **Recommendation: The "Corroborated Probability" Standard**
  I propose we adopt a standard where an AI-detection score serves as **probable cause**, but not **proof of violation**.

  Under this standard, a high-confidence AI score (e.g., >95%) shifts the burden of production to the student but cannot alone sustain a finding of responsibility. To move from "probable cause" to "responsibility," the Board requires at least one additional corroborating factor, such as:
  1.  **Draft Discrepancies:** Inability to produce intermediate drafts or version history inconsistent with the final text.
  2.  **Oral Defense:** Inability to explain or reconstruct the argument of the essay in a follow-up interview.
  3.  **Stylistic Deviation:** Significant divergence from the student's established voice in previous, verified work.

  **Conclusion**
  This approach acknowledges the faculty's concern for accuracy without reducing students to statistical probabilities. It accepts that while we cannot eliminate error entirely, we can ensure that our findings are based on evidence tied to the individual's conduct, not just the properties of the text. This strengthens the legitimacy of every verdict the Chair and this Board sign.

  I look forward to discussing this framework at our next meeting.
