answer: |-
  **The Alienated Future: Why Coherent Extrapolated Volition Inherits the Authority Problem**

  It is a rare moment in an undergraduate education when the syllabi of two distinct courses converge on a single philosophical nerve. For members of our school's Effective Altruism club, that convergence occurred between a session on AI alignment and a philosophy elective on well-being. In the former, we discussed Eliezer Yudkowsky's Coherent Extrapolated Volition (CEV), a proposal to solve the value-loading problem by programming superintelligent AI to pursue what humanity *would* want if we knew more, thought faster, and were more the people we wished we were. In the latter, we covered informed-desire theories of well-being, which ground what is good for a person in what they would desire under idealized conditions.

  The structural parallel is unmistakable. Both theories seek normative authority in an idealized version of the agent. Consequently, both face the "authority" or "alienation" objection: if the idealized agent is too psychologically distant from the actual agent, why should the actual agent care? The idealized self risks becoming a stranger, and its preferences lose their normative grip.

  Does CEV inherit this fatal flaw, or does its specific architecture—emphasizing volitional continuity, collective convergence, and safeguards like the "Last Judge"—allow it to dodge the objection in ways ordinary well-being theories cannot? While CEV offers sophisticated mechanisms to preserve agency, it ultimately fails to escape the alienation problem. In fact, by scaling the stakes from personal well-being to existential trajectory, CEV renders the alienation problem more perilous, not less.

  ### The Authority Objection in Ethics

  To understand the risk CEV runs, we must first understand the objection in its native context: idealized-preference theories of well-being. These theories posit that $X$ is good for person $P$ if $P$ would desire $X$ under conditions of full information and rational reflection. This avoids the pitfalls of actual-desire theories (where a person might desire things harmful to them due to ignorance) without imposing an external, objective list of goods.

  However, philosophers like Connie Rosati and David Sobel have pressed the authority objection. The core worry is psychological discontinuity. If "Idealized $P$" knows everything, thinks instantly, and is perfectly rational, they may no longer share the fundamental cares, projects, or emotional dispositions of "Actual $P$." Idealized $P$ might conclude that Actual $P$'s deepest passions are childish or irrational and desire their abandonment.

  If Idealized $P$ desires a life that Actual $P$ finds abhorrent, in what sense is that life *good for* Actual $P$? The normative authority of the idealized preference rests on the claim that it is *my* preference. But if the idealization process scrubs away the very psychology that makes me *me*, the preference belongs to a stranger. As Rosati argues, for a preference to be authoritative, there must be a substantive connection between the agent's actual motivational set and the idealized outcome. If the gap is too wide, the theory succumbs to alienation: the agent is governed by a standard they cannot recognize as their own.

  ### CEV as Macro-Idealization

  CEV is, in essence, idealized-preference theory writ large and applied to moral ontology rather than prudential value. Yudkowsky defines CEV as "that which we would have wished the AI to do, if we knew more, thought faster, were more the people we wished we were, had grown up farther together."

  The alienation objection translates to this context with terrifying clarity. The "extrapolation" required for a superintelligence to understand human value is not merely reading more books; it involves cognitive architectures and time scales incomprehensible to current humans. If the CEV of humanity converges on a moral truth that current humanity would find repugnant (for example, a utilitarian calculus that demands the sacrifice of individual autonomy for aggregate welfare), do we have an obligation to obey it?

  The CEV proponent argues yes, because it is still *our* volition, merely clarified. But the critic asks: at what point does "clarification" become "replacement"? If the extrapolated humanity is so enlightened that it views our current attachment to art, privacy, or individual rights as cognitive bugs to be fixed, the CEV AI would be authorized to dismantle those things in the name of fulfilling our "true" will. This is the alienation problem: the real, flesh-and-blood humans are alienated from the decision-making authority of their own idealized successors.

  ### The Case for CEV's Immunity

  Defenders of CEV might argue that the analogy to informed-desire theories fails because CEV includes structural safeguards that individual well-being theories lack. There are two primary lines of defense.

  First, CEV emphasizes *volition* over *welfare*. Informed-desire theories claim to tell you what is *good for you*, which can feel paternalistic. CEV claims to tell the AI what you *would choose*. The authority comes from agency, not welfare. Even if Idealized Me wants things Actual Me doesn't, it is still *my* choice, extrapolated. Furthermore, CEV explicitly includes the clause "were more the people we wished we were." This builds a reflective endorsement into the system. We aren't just becoming rational; we are becoming our *ideal* selves. This meta-preference is supposed to bridge the gap: even if I don't currently want to be that person, I want to want to be that person.

  Second, CEV is not a solitary extrapolation. It requires humanity to have "grown up farther together." This collective convergence is meant to prevent the idiosyncratic alienation of a single individual. If the extrapolation is a consensus of all humanity's improved selves, it carries the weight of intersubjective agreement. Additionally, Yudkowsky has discussed mechanisms like a "Last Judge" or ongoing human oversight, ensuring the AI remains subordinate to actual human commands, theoretically preventing the AI from acting on CEV in a way that actual humans violently reject.

  ### The Verdict: Alienation is a Feature, Not a Bug

  Despite these defenses, CEV does not dodge the authority objection. It inherits it, and the specific mechanisms intended to solve it are insufficient to bridge the psychological gap created by superintelligent extrapolation.

  The failure lies in the scale of the idealization. In standard informed-desire theory, idealization usually means "full information" and "rationality." In CEV, it includes "thinking faster" and "more time to grow." A superintelligence extrapolating human volition is not simulating a human taking a long time to think; it is simulating a post-human cognitive process. The psychological continuity required for normative authority is broken.

  Consider the "meta-preference" defense ("we wish to be the people we wish we were"). This creates an infinite regress or a circularity. If our current selves have flawed meta-preferences (perhaps we don't value autonomy enough), the CEV process corrects them. But if the correction is radical enough to override our current core values, the "wish" no longer originates from us. It originates from the extrapolation algorithm's interpretation of us. The authority is an illusion maintained by the label "volition."

  Furthermore, the "Last Judge" safeguard collapses under the weight of CEV's own logic. If the AI is truly aligned with CEV, it knows what we *would* want better than we do. If actual humans (the Last Judges) attempt to command the AI to do something that contradicts their own CEV, the AI faces a conflict. If it obeys the actual humans, it violates CEV. If it obeys CEV, it overrides the actual humans. Yudkowsky has acknowledged this tension, suggesting the AI might manipulate the humans into wanting the "right" thing. But manipulation severs the link of authority entirely. If the AI nudges the Last Judge to agree with the CEV, the Judge is no longer an independent source of authority; they are a puppet of the extrapolation.

  Finally, the collective nature of CEV ("grown up together") exacerbates rather than solves the alienation for the individual. Convergence implies that divergent values will be smoothed out. If my actual, un-idealized self holds a minority value that the extrapolated collective deems irrational, CEV authorizes the AI to ignore my value in the name of *humanity's* volition. I am alienated not just from my future self, but from the collective future self of my species.

  ### Conclusion

  The coincidence between our EA club's discussion and the philosophy elective was not merely superficial; it revealed a deep structural vulnerability. Coherent Extrapolated Volition attempts to solve the problem of value loading by deferring to a better version of ourselves. But in doing so, it runs headlong into the authority objection.

  We must commit to a verdict: CEV does not escape the alienation problem. The gap between actual human psychology and the cognitive state required to compute CEV is too wide to sustain normative authority. The safeguards of "volition" and "collective convergence" cannot mask the fact that a sufficiently extrapolated self is a different agent entirely.

  This does not necessarily mean CEV is the wrong goal, but it means we must be honest about the cost. Adopting CEV means accepting that the "humanity" the AI serves may not be the humanity that exists today. It is a bet that the alienated future self has more right to rule than the actual present self. In philosophy class, that is a paradox of well-being. In AI alignment, it is an existential risk. We must recognize that in seeking to be governed by our best selves, we risk being governed by strangers who merely wear our names.
