prompt: |-
  So I'm taking a seminar on AI alignment this semester and we just spent two lectures on inverse reinforcement learning, and something's been bugging me ever since that I can't quite shake. The whole pitch is that hand-writing a reward function for an AI is basically doomed because humans are bad at specifying what they actually want (reward hacking, Goodhart's law, all that), but IRL supposedly gets around this: instead of specifying the reward up front, you just have the system watch a bunch of human behavior and back out whatever reward function best explains it. And since humans are at least roughly rational agents, it seems like there should basically be one reward function (up to relabeling/rescaling) that's consistent with any given behavior pattern — like, if you watch someone make choices for long enough while theyre trying to maximize something, there's only one "something" that actually fits what you saw, no?

  So my actual question is: if that's right, doesn't it mean we could basically solve the hard, normative part of alignment — figuring out what humans actually value — just by scaling up IRL on enough behavioral data, without ever having to wade into the messier philosophical debates about what people should value? My prof said something in passing about "identifiability" being harder than it looks but didn't really elaborate, and I didn't want to look dumb asking in front of the whole room. I vaguely remember the syllabus citing some paper with "occams razor" in the title, so I'm guessing if more than one reward function fits the data, you just go with whichever is simplest and that patches the problem? Basically I want to know if the "just infer values from behavior at scale" plan is actually as solid as it seemed to me at first, or if I'm missing something more fundamental about why this wouldn't fully work even in principle.
