      *   **The Normative Gap (Philosophical):** Distinguish between *revealed preference* (what we do) and *normative preference* (what we want to want). Mention addiction, coercion, ignorance.
      *   **Occam's Razor/Simplicity:** Address the specific syllabus reference. Explain why simplicity doesn't solve the normative gap (a simple reward can still be wrong).
