      *   **Rationality Assumption:** Humans are *not* perfectly rational. We have biases, akrasia, addiction, mistakes. IRL assumes optimality. If the model assumes optimality but the human is suboptimal, the inferred reward is wrong (e.g., inferring a reward for smoking from a smoker).
      *   **Normative vs. Descriptive:** Even if we perfectly infer what drives behavior, that includes biases, prejudices, and short-term impulses. Do we want the AI to optimize for *revealed preferences* or *idealized preferences*? (The "Should" vs. "Do" gap).
      *   **Occam's Razor:** Simplicity priors help, but they don't guarantee the *right* kind of simplicity (e.g., a reward function that says "do exactly what you saw" is simple but doesn't generalize).
      *   **Distributional Shift:** Behavior is observed in a limited context. The AI acting in the real world might encounter situations where the inferred reward leads to catastrophic Goodharting.
      *   **The "Pointers" Problem:** Humans value things in the world, not just sensory inputs or action histories. IRL often infers rewards over states/actions, not external referents.

