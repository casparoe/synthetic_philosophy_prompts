          *   Outcome: If the colleague is *extremely* reliable (never jokes, sober, multiple witnesses), the "falsehood of testimony" becomes more improbable than the "clown suit event." We believe the testimony.
      *   *Why this helps:* It shows the *structure* is valid. In the miracle case, the "Law of Nature" side is so heavy (Death is permanent) that the "Testimony" side (Human veracity) rarely matches it. In the Dean case, the "Dean Norm" side is heavy, but the "Testimony" side can outweigh it. This proves the *mechanism* works, even if the *inputs* differ in the miracle case.

