answer: |-
  ### Program Equilibrium and the Logic of Commitment: A Comparison of Tennenholtz and Löbian Constructions

  The problem of rational cooperation in the one-shot Prisoner's Dilemma (PD) challenges the standard Nash equilibrium concept, which prescribes mutual defection. Program equilibrium, introduced by Moshe Tennenholtz (2004), offers a mechanism to recover cooperation by allowing agents to submit algorithms rather than atomic actions. These algorithms are granted read-access to their opponent's source code. This seminar paper compares Tennenholtz's original syntactic construction with the later proof-theoretic construction developed by researchers at the Machine Intelligence Research Institute (MIRI), specifically the "FairBot" architecture relying on Löb's Theorem.

  #### 1. The Threat of Ill-Foundedness and the Location of Self-Reference

  The primary technical hurdle in program equilibrium is the threat of ill-foundedness arising from mutual simulation. If an agent $A$ decides its move by simulating its opponent $B$, and $B$ decides its move by simulating $A$, the interaction generates an infinite recursive loop ($A \to B \to A \dots$). Computationally, this results in non-termination; logically, it renders the agents' output functions undefined.

  **Tennenholtz's Avoidance Strategy**
  Tennenholtz's original proposal sidesteps this computational hazard entirely by forbidding simulation. The "Cooperate-if-Identical" program ($P_{CI}$) does not run the opponent's code; it performs a string comparison.
  $$ P_{CI}(Opponent) = \begin{cases} C & \text{if } Source(P_{CI}) == Source(Opponent) \\ D & \text{otherwise} \end{cases} $$
  Because string comparison is a primitive operation that does not require executing the compared object, the interaction is well-founded. However, this safety comes at the cost of semantic depth. The agent does not reason about the opponent's *rationality*; it reasons only about the opponent's *identity*.

  **The Löbian Construction and Metatheoretic Relocation**
  The MIRI construction, exemplified by FairBot ($FB$), replaces simulation with proof search. $FB$ cooperates with opponent $X$ if it finds a proof in a formal system (e.g., Peano Arithmetic, PA) that $X(FB) = C$.
  $$ FB(X) = \begin{cases} C & \text{if } \vdash_{PA} (X(FB) = C) \\ D & \text{otherwise} \end{cases} $$
  When $FB$ plays against itself, the interaction relies on Löb's Theorem, which states that for any sentence $\phi$, if $\vdash (\vdash \phi \to \phi)$, then $\vdash \phi$. In this context, the system proves that "If it is provable that $FB$ cooperates, then $FB$ cooperates," thereby securing the proof of cooperation itself.

  Does this escape the threat of ill-foundedness, or merely relocate it? It is accurate to say the self-reference is **relocated into the metatheory**, but this relocation constitutes a genuine resolution rather than a semantic shuffle.
  1.  **Computational vs. Logical Recursion:** Simulation creates *operational* recursion (a dynamic process that fails to halt). Löbian cooperation relies on *logical* fixed-points (static relationships between sentences). The self-reference required for Löb's Theorem is secured via the Diagonal Lemma, which constructs a sentence asserting its own provability.
  2.  **Well-Definedness:** While the Diagonal Lemma introduces self-reference into the logical system, the system itself (PA) remains consistent (assuming standard arithmetic). The agents do not hang; they terminate because proof search is distinct from execution. The "loop" exists in the dependency of truth values, not in the flow of control.

  Therefore, the Löbian construction escapes the *computational* threat of ill-foundedness by translating the problem from computer science (halting) to mathematical logic (provability). It accepts self-reference as a feature of the metatheory to ensure well-definedness in the object theory (the agent's execution).

  #### 2. Syntactic Equality vs. Provable Cooperation: A Gain in Generality?

  The second point of comparison concerns the robustness of the cooperation condition. Tennenholtz requires syntactic identity; MIRI requires provable equivalence.

  **The Fragility of Syntactic Equality**
  Tennenholtz's condition is excessively narrow. Cooperation is sustained only if $Source(A) \equiv Source(B)$. This implies that:
  *   Agents cannot optimize their code (e.g., compiling with different flags) without breaking cooperation.
  *   Agents cannot use different programming languages to implement the same logic.
  *   Agents cannot use modular subroutines that differ slightly in implementation.
  This models a "cloning" scenario rather than a "cooperation" scenario. It suggests that I will only cooperate with you if you are literally *me*. This fails to capture the intuition of rational agents recognizing shared interests despite implementation differences.

  **The Robustness of Provable Cooperation**
  The Löbian condition requires $\vdash (A(B)=C \land B(A)=C)$. This is a genuine gain in generality because it decouples *behavior* from *syntax*.
  *   **Functional Equivalence:** $FairBot$ can cooperate with $PrudentBot$ (a variant that defects against unconditional cooperators) provided the proof systems are compatible and the mutual cooperation is derivable.
  *   **Implementation Independence:** As long as the logical output is provably determined, the underlying source code can vary.

  **Is it Merely Another Narrow Condition?**
  Critics might argue that requiring shared axiomatic foundations (e.g., both agents using PA) is just another form of exclusivity. If Agent A uses PA and Agent B uses ZFC, or if one agent uses a bounded resource proof system while the other does not, cooperation may fail.
  However, this is a necessary constraint for *logical* trust, not an arbitrary restriction like syntactic equality. Syntactic equality restricts cooperation based on irrelevant physical details (textual representation). Provable cooperation restricts cooperation based on relevant logical details (inferential capacity). The latter is a normative constraint on rationality; the former is a bureaucratic constraint on formatting. Therefore, trading syntax for proof is a substantive generalization that moves the model from "identity-based" to "reason-based" interaction.

  #### 3. Verdict: Accounting for Unenforced Commitment

  Which construction provides a more satisfying account of how unenforced commitment among rational agents is possible?

  **Tennenholtz: The Solipsistic Account**
  Tennenholtz's model demonstrates that cooperation is an equilibrium, but it offers a thin explanation of *commitment*. The commitment is not to the *principle* of cooperation, but to the *self*. The agent effectively says, "I am committed to cooperating only with my own reflection." This does not explain how distinct rational agents can trust one another; it explains how an agent can trust itself when duplicated. It renders the "other" player ontologically redundant.

  **MIRI/Löbian: The Rationalist Account**
  The Löbian construction offers a richer account of commitment rooted in **logical correlation**. FairBot cooperates not because the opponent is identical, but because the opponent is *predictably rational* in a specific way. The commitment is to a policy: "I commit to cooperating with any agent that can be proven to reciprocate."
  This aligns with philosophical accounts of decision theory (such as Functional Decision Theory) where agents reason about the output of their own decision procedure as it is instantiated in others. The "unenforced" nature of the commitment is secured by the transparency of reasoning. I am bound to cooperate not by a contract, but by the logical necessity that my cooperation is a precondition for yours, a fact we both can prove.

  **Conclusion**
  While both models rely on strong idealizations (perfect source code transparency), the Löbian construction is superior. It successfully relocates the threat of infinite regress from the computational domain to the logical domain, rendering the interaction well-founded without sacrificing depth. Furthermore, by replacing syntactic equality with provable cooperation, it captures the essence of rational agreement: distinct agents converging on a cooperative equilibrium through shared reasoning, rather than mere clones matching strings.

  Therefore, the MIRI construction provides the more satisfying account. It demonstrates that unenforced commitment is possible not through identity, but through **mutual legibility of rationality**. It shows that when agents can prove things about each other's decision procedures, the one-shot Prisoner's Dilemma transforms from a trap of individual rationality into a solvable problem of logical coordination.
