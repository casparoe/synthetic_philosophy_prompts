answer: |-
  The reception had thinned out an hour ago. Most of the conference attendees had retreated to the hotel bar or their rooms, but Elena and Sarah remained on the terrace, leaning against the stone railing. The air was cool, a relief after the stuffy lecture hall. Elena swirled the last of her red wine; Sarah nursed a sparkling water.

  They hadn't seen each other since the dissertation defenses, seven years prior. Elena had gone on to a tenure-track job in the Midwest, doubling down on the epistemicism that had scandalized her committee. Sarah had stayed in the UK, polishing a monograph on supervaluationism and higher-order vagueness.

  "That talk on degree theory was a mess," Elena said, breaking the silence. "Trying to save the inductive premise by tweaking the logic. It's like patching a hull that's already full of water."

  Sarah smiled, tiredly. "At least they admit the hull is wet. You still think the ship is dry and we're just blind to the leaks?"

  "I think the ship is fine, and 'wet' is a precise property we're misapplying." Elena took a sip. "But look, Sarah, I read the new draft you sent. The chapter on iterated penumbras. You're still trying to solve the higher-order problem by layering precisifications."

  "It's the only way to respect the intuition that there's no sharp boundary between the borderline cases and the clear cases," Sarah said. "If you draw a line between 'definitely tall' and 'borderline tall,' you've just recreated the Sorites at the meta-level. Supervaluationism allows the extension of 'tall' to be indeterminate without violating classical logic for the precisified sentences."

  "Classical logic is the one thing we agree on," Elena conceded. "I'm not giving up bivalence. But let's talk about the cost. You pay for it with admissibility. You say a sentence is supertrue if it's true on all *admissible* precisifications. My question is the one I asked you in the office back in '16: What fixes the set of admissible specifications?"

  Sarah sighed, looking out at the dark garden. "Usage. Linguistic practice. The constraints of penumbral connections. If 'Jack is tall' is true, 'Jack is not short' must be true on every precisification. That rules out the crazy ones."

  "But is the boundary of *admissibility* sharp?" Elena pressed. "Is there a precise number of grains, $n$, such that a precisification counting $n$ as a heap is admissible, but one counting $n-1$ is not? If there is, you're an epistemicist about admissibility. You've just pushed the sharp cut-off from the object language to the meta-language."

  Sarah turned to face her. "And if there isn't? If the set of admissible precisifications is itself fuzzy?"

  "Then you need a logic for *that*," Elena said. "You need a super-supertruth. And then you're off on a regress. Or, you stop the regress somewhere. Wherever you stop, there's a fact of the matter about which precisifications are in and which are out. That fact is unknowable to the speakers, presumably, because if they knew it, they'd know the cutoff. So you end up with my position, just with extra steps."

  "That's the standard objection," Sarah said, her voice sharpening slightly. "But it assumes that 'admissible' must have a classical extension. Why can't the boundary of admissibility be vague without requiring a further set of precisifications? We can model that with a topology, not a set. A fading out of legitimacy rather than a cliff edge."

  "A topology defined how?" Elena asked. "Mathematically, a boundary is a boundary. If you say 'this precisification is 0.8 admissible,' you've introduced a new predicate: '0.8 admissible.' Is *that* predicate vague? If yes, regress. If no, sharp cut-off at the meta-level. You haven't dissolved the boundary; you've just hidden it in the definition of the model."

  Sarah took a breath. "Okay. I'll concede that point for the sake of argument. Let's say I have a sharp boundary at the meta-level regarding admissibility. It's less costly than your sharp boundary at the object level. Because my sharp boundary is about *meanings*, which are abstract objects, not about *grains of sand*."

  "Is it?" Elena set her glass down on the railing. "Let's talk about my cost. You think epistemicism is insane because I claim there's a specific number of grains where 'heap' flips to 'non-heap,' and we can't know it. You ask: 'Why can't we know it?'"

  "I do ask that," Sarah said. "It seems like magic. The world is one way, language is another, and you're saying they lock together at a specific atom, but we're constitutionally barred from seeing the lock."

  "It's not magic, it's safety," Elena said. "Williamson's margin for error principle. Knowledge requires safety. If I know that $n$ grains make a heap, then in nearby possible worlds where I believe $n$ grains make a heap, it must be true. But the meaning of 'heap' is sensitive to usage, and usage is sensitive to environmental factors. In a nearby world where usage shifts microscopically, $n$ might not be the cutoff. So my belief isn't safe. Therefore, I don't know."

  Sarah shook her head. "But that argument only works if you assume the cutoff exists in the first place. You're using the margin-for-error principle to explain our ignorance, but the need for a margin of error only arises because you've posited a sharp boundary that outstrips our discriminative abilities. It feels circular. You say: 'There is a boundary, and here's why you can't see it.' I say: 'The reason you can't see it is that there isn't one.' Your explanation of ignorance borrows its plausibility from the very phenomenon it's trying to explain away."

  "It's not circular, it's transcendental," Elena countered. "We *use* vague terms successfully. We communicate. If there were no determinate truth conditions, even if unknowable, communication would be noise. The fact that we successfully coordinate on 'tall' suggests there is a fact of the matter, even if our epistemic access is limited by the margin for error. The margin isn't an ad-hoc patch; it's a consequence of the nature of knowledge applied to unstable semantic boundaries."

  "Unstable?" Sarah pounced. "So the boundary moves? If the boundary moves based on usage, then at time $t$, there is a cutoff. At $t+1$, it shifts. So when I ask 'Is $n$ grains a heap?', the answer depends on the micro-state of the linguistic community? That makes 'heap' indexical in a way that destroys the Sorites. If 'heap' shifts, the inductive premise fails because the meaning of 'heap' in premise 1 isn't the same as in premise 1000."

  "Exactly," Elena said. "The inductive premise is false. There is a step where it flips. We just can't locate it because locating it would require a discriminative capacity we don't have, given the safety condition."

  "But that makes the truth of 'heap' radically opaque," Sarah said. "It severs truth from assertibility completely. I can assert 'this is a heap' justifiably, but it might be false, and I can never know it's false. That's a skepticism about meaning, Elena. It's not just that we don't know the world; we don't know what we mean."

  "I'd rather have skepticism about knowledge than skepticism about logic," Elena said. "You keep classical logic, you keep bivalence. You just accept that truth outruns knowability. That's not new. That's just realism."

  "It is new when applied to semantics," Sarah insisted. "Look, let's meet in the middle on the higher-order problem. I admit, defining the set of admissible precisifications without a sharp boundary is the hardest part of my view. If I say the set is sharp, I look like you. If I say it's vague, I need a logic for that vagueness. I'm working on a supervaluationist account of higher-order vagueness that treats the 'definitely' operator as iterative but non-transitive."

  "Non-transitive?" Elena raised an eyebrow. "So 'Definitely Definitely $P$' doesn't imply 'Definitely $P$'?"

  "It blocks the regress," Sarah said. "It acknowledges that as you iterate 'definitely,' the penumbra shrinks, but never vanishes to a point. There is no last borderline case. There's just a gradual fading of truth-value stability."

  "And you think that's coherent?" Elena asked. "If there's no last borderline case, then for every case that is borderline, there is a more definite case next to it. But that implies a density. Are grains of wheat dense? No. So at some point, you have to jump from grain $k$ to grain $k+1$. If 'borderline' applies to $k$ but not $k+1$, you have a sharp boundary between borderline and definite. You can't fade over discrete atoms."

  Sarah paused. She looked down at her hands. "Discrete atoms. Yes. That's the problem with the heap example. It forces discreteness. If we use color patches, a continuous spectrum, the fading model works better. The admissibility of a precisification can fade as the wavelength shifts."

  "But 'heap' isn't a color patch," Elena said gently. "It's countable. And 'tall' is countable in centimeters. If you accept classical logic, you accept that for any $n$, 'n is tall' is either true or false. If you say it's neither, you've dropped bivalence. If you say it's supertrue, you need a set of precisifications. If that set is well-defined, there's a boundary."

  "I know," Sarah said. "I know the meta-boundary is the weak spot. It's the price of entry for keeping the object language vague. But your price is accepting that there is a fact of the matter about whether 4,321 grains is a heap, and that fact is essentially inaccessible. That's a huge metaphysical posit. Why posit a fact that plays no role in explanation? It doesn't guide usage. It doesn't guide belief. It just sits there to save the Law of Excluded Middle."

  "It guides usage by making usage truth-apt," Elena said. "If there's no fact, then when we argue about whether a stadium crowd is a 'heap' of people, we aren't arguing about truth. We're just negotiating. I think we *are* arguing about truth. I think one of us is right and the other is wrong, even if we can't prove it."

  "Or," Sarah said, "we're both operating within a range of admissible precisifications where the answer varies, and that's why the argument feels resolvable but never gets resolved. We stop arguing when we're tired, not when we hit the truth."

  "We stop because we hit the margin for error," Elena corrected. "We realize we can't safely claim knowledge."

  They stood in silence for a moment. The wind picked up, rustling the leaves in the garden below.

  "I think," Sarah said slowly, "that if I can't solve the meta-admissibility problem without introducing a sharp boundary, I might have to concede that vagueness is, at some level, epistemic. But I won't concede it's at the *object* level. I'll keep the semantic plasticity."

  "And I think," Elena said, "that if I can't explain why the margin for error isn't just a restatement of 'we don't know,' I might have to concede that the 'fact' of the cutoff is metaphysically lightweight. But I won't concede it's non-existent. I'll keep the bivalence."

  "So we're still stuck," Sarah said.

  "Stuck," Elena agreed. "But at least we're stuck on the right problems. Not the Sorites itself, but the cost of the solution."

  Sarah finished her water. "Do you remember Professor Halloway? He told us vagueness was a disease of language."

  "He was wrong," Elena said, picking up her wine glass. "It's a disease of epistemology."

  "No," Sarah said, pushing off the railing. "It's a feature of representation. But I'll buy you dinner tomorrow, and we can argue about whether 'dinner' has a sharp cutoff."

  "Deal," Elena said. "Just don't order the heap of fries."

  Sarah laughed, a short, sharp sound. "Only if you promise not to tell me exactly how many fries constitute a heap."

  They walked back inside, leaving the cool air and the unsolved boundaries behind them.
