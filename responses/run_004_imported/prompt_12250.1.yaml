prompt: |-
  My best friend from college is getting married in a couple weeks and I'm his best man. I'm a backend engineer, not a writer, so I need an actual draft here, not just bullet points. He's been obsessed with Ancient Greek philosophy since undergrad and keeps cornering me at bars insisting that the thing everyone half-remembers about 'Plato and drinking' - the Symposium bit where Socrates outdrinks the whole room and stays unaffected - isn't even the good part. He says the real argument is buried in the Laws: something about using supervised group drinking to test people's self-control the same way you'd test soldiers for courage, a whole bit about needing one sober person in charge or it goes badly, and different rules on how much you're allowed to drink depending on your age. I dont know any of this in real detail, but I want to build my toast around whatever that actual Laws argument is instead of the generic Symposium line everyone else will reach for, because he'll clock the difference immediately and it'll mean way more to him. There's an open bar tonight so it fits naturally. Only catch: besides him and maybe one groomsman, literally nobody in that room (including both sets of parents) has ever heard of the Laws. Can you write me a 4ish minute toast that uses the real argument to say something true about the two of them, still works fine for people who don't know any of this, and doesn't turn into a philosophy lecture with 'cheers' bolted on the end?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Best Man (Backend Engineer, not a writer).
      *   **Occasion:** Wedding reception.
      *   **Groom:** College best friend, obsessed with Ancient Greek philosophy (specifically Plato).
      *   **Key Constraint:** The toast *must* reference Plato's *Laws* (specifically the argument about supervised drinking as a test of character/self-control), not the more famous *Symposium* (Socrates outdrinking everyone).
      *   **Audience:** Mostly laypeople (parents, other guests) who know nothing about Plato. Only the Groom (and maybe one groomsman) will get the deep reference.
      *   **Tone:** Meaningful, not a lecture, funny but sincere, fits a 4-minute timeframe (approx. 500-600 words spoken at a moderate pace).
      *   **Context:** Open bar is available, making the drinking theme relevant.
      *   **Goal:** Show deep friendship/understanding of the Groom while saying something true about the couple.

  2.  **Deconstruct the Philosophical Reference (Plato's *Laws*):**
      *   *The Core Idea:* In *Laws* (Book 1 & 2), the Athenian Stranger argues that drinking parties (symposia) shouldn't just be about getting wasted. They are a "training ground" for virtue.
      *   *The Mechanism:* Alcohol lowers inhibitions and reveals true character. It's a safe simulation of danger/chaos.
      *   *The Safeguard:* You need a sober "ruler of the drink" (a moderator) to ensure it doesn't descend into chaos.
      *   *The Application:* It tests self-control. If you can hold your head when your emotions are loosened, you have true virtue.
      *   *Relevance to Marriage:* Marriage requires self-control, vulnerability, and a partner who acts as the "sober moderator" when things get chaotic.

  3.  **Drafting Strategy - Balancing the Audience:**
      *   *Problem:* If I talk too much about *Laws*, the parents will zone out. If I talk too little, the Groom won't feel the special nod.
      *   *Solution:* Frame it as a story about the Groom's quirks (which everyone knows) that leads into a metaphor about marriage. Don't use jargon like "The Athenian Stranger." Use plain English.
      *   *Structure:*
          1.  **Hook:** Acknowledge the open bar and the Groom's notorious philosophy lectures.
          2.  **The Pivot:** Mention the *Symposium* (what everyone expects) but dismiss it for the *Laws* (the deep cut).
          3.  **The Explanation (Simplified):** Explain the "sober moderator" concept simply as a metaphor for partnership.
          4.  **The Couple:** Apply this to the Bride and Groom. She is the grounding force; he is the passionate one (or vice versa, but usually, the "sober guide" fits the partner role well in this context).
          5.  **Conclusion:** A wish for their future and the toast.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with the engineer persona. "I build systems, he builds arguments." Acknowledge the bar.
