answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm a backend engineer, which means I spend my life making sure invisible systems don't crash when everyone else is trying to use them. So, naturally, I'm the best man. I handle the infrastructure; [Groom] handles the user interface.

  We've been friends since college. And if you know [Groom], you know that he has a very specific habit when we're at a bar. About halfway through the night, he will corner me, point a finger, and start lecturing me about Ancient Greece.

  Most people know the famous story about Plato and drinking. It's from a book called the *Symposium*. It's the one where Socrates outdrinks everyone at the party, stays completely stone-cold sober, and wins a debate. It's the ultimate "I can hold my liquor" flex.

  But [Groom] would never let me leave it at that. He'd lean in and tell me, "No, that's the amateur hour. The real wisdom is in the *Laws*."

  For the rest of you who didn't have to endure 2 a.m. lectures on this: In the *Laws*, Plato argues that drinking isn't about showing off how much you can handle. He says drinking is actually a stress test. Alcohol lowers your inhibitions. It makes you emotional, loud, and honest. And Plato argues that the only way a drinking party is virtuous—the only way it doesn't end with someone crying in the bathroom or fighting a bouncer—is if there is a designated leader. A "ruler of the drink." Someone who stays clear-headed enough to guide the room, to make sure the vulnerability doesn't turn into chaos.

  As an engineer, I love this. It's basically error handling for human emotions. You need a fail-safe.

  And watching [Groom] and [Bride] together over the last few years, I realized: they have already built this system.

  [Groom], you are the passion. You are the big ideas, the late-night debates, the guy who feels everything at maximum volume. You are the open bar. And [Bride], you are the "ruler of the drink."

  Now, I don't mean that you're a buzzkill. I mean that you are the steady hand. You are the person who keeps the test safe. When things get chaotic, you're the one who remembers the direction. When the inhibitions drop, you're the one who ensures the honesty builds something real instead of burning it down.

  [Groom] spent years telling me that Plato believed we drink to practice virtue. To practice being good people when our guard is down. But I think he missed the point. You don't practice virtue alone in a bar. You practice it with the person standing next to you.

  Marriage is going to be a lot like that open bar over there. There will be times of celebration where the flow is endless. There will be times when emotions run high, when you're tired, when your guard is down, and it would be easy to say the wrong thing or make a reckless choice.

  But looking at you two, I know you're going to be okay. Because [Groom], you have found the one person who knows your philosophy better than you do. And [Bride], you have found the one person who will never stop challenging you to be better, even when he's trying to quote Athenian legal code at you.

  You are each other's sober second thought. You are each other's safety. And in a world that is often pretty chaotic, that is the best system design I can imagine.

  So, if everyone could please raise a glass.

  [Groom], I promise to stop arguing about the *Symposium*. You were right about the *Laws*.

  To [Groom] and [Bride]. May you always have wine in your glasses, wisdom in your arguments, and may you always, always keep each other steady.

  To the happy couple.
