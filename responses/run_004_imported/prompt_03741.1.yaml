answer: |-
  This is an excellent question that cuts to the core of modern decision theory. You have correctly identified the standard narrative arc: St. Petersburg (divergent expectation) $\to$ Bernoulli (concave utility) $\to$ Menger (utility St. Petersburg) $\to$ Bounded Utility (axiomatic requirement).

  Since you want the technical precision to reconstruct the argument, I will break this down into two sections corresponding to your questions. I will treat the utility function $U$ as a mapping from outcomes (or wealth) to real numbers, and assume the agent maximizes Expected Utility (EU).

  ---

  ### Part 1: Why Unboundedness Regenerates the Paradox

  The intuition that "diminishing returns" solves the paradox relies on the specific growth rate of money ($2^k$) versus the specific growth rate of utility (e.g., $\log w$). Menger's insight was that the paradox is not about the relationship between *money* and *utility*, but about the relationship between *probability* and *utility*.

  #### 1. The Setup
  Let $L$ be a lottery with a countable set of outcomes $\{x_1, x_2, \dots\}$ occurring with probabilities $\{p_1, p_2, \dots\}$ where $\sum p_i = 1$.
  The Expected Utility is:
  $$ E[U(L)] = \sum_{i=1}^{\infty} p_i U(x_i) $$

  The St. Petersburg Paradox arises when this sum diverges to $+\infty$.

  #### 2. Bernoulli's "Solution"
  In the classic game, the monetary payoff is $w_k = 2^k$ with probability $p_k = 2^{-k}$.
  The expected monetary value is $\sum 2^{-k} \cdot 2^k = \sum 1 = \infty$.
  Bernoulli proposed $U(w) = \ln(w)$.
  $$ E[U] = \sum_{k=1}^{\infty} 2^{-k} \ln(2^k) = \ln(2) \sum_{k=1}^{\infty} k 2^{-k} $$
  Since $\sum k 2^{-k}$ converges (to 2), $E[U]$ is finite. The paradox appears resolved *for this specific payoff schedule*.

  #### 3. Menger's Reconstruction (1934)
  Menger argued that if $U$ is **unbounded above**, we can construct a *new* lottery $L'$ that breaks the Bernoulli fix. We do not need to change the probabilities; we change the prizes to match the utility function.

  **The Argument:**
  1.  **Assumption:** $U$ is unbounded above.
      $$ \forall M \in \mathbb{R}, \exists x \text{ such that } U(x) > M $$
  2.  **Construction:** We want to construct a lottery where the expected utility diverges. Let us keep the St. Petersburg probabilities: $p_k = 2^{-k}$.
  3.  **Requirement:** We need to find outcomes $x_k$ such that:
      $$ \sum_{k=1}^{\infty} 2^{-k} U(x_k) = \infty $$
  4.  **Selection:** To ensure divergence, it suffices to choose $x_k$ such that the $k$-th term is at least 1 (or any constant $c > 0$).
      $$ 2^{-k} U(x_k) \ge 1 \implies U(x_k) \ge 2^k $$
  5.  **Existence:** Because $U$ is unbounded, for every $k$, there *exists* some outcome $x_k$ (some amount of wealth, or some state of the world) such that $U(x_k) \ge 2^k$.
  6.  **Result:** Define the lottery $L_{Menger}$ as offering prize $x_k$ with probability $2^{-k}$.
      $$ E[U(L_{Menger})] = \sum_{k=1}^{\infty} 2^{-k} U(x_k) \ge \sum_{k=1}^{\infty} 2^{-k} \cdot 2^k = \sum_{k=1}^{\infty} 1 = \infty $$

  **Conclusion:** Diminishing marginal utility (concavity) slows the growth of $U(w)$, but if $U(w)$ has no ceiling, we can always find a $w$ large enough to compensate for the shrinking probability $p_k$. The divergence is driven by the tail behavior. If $U$ is unbounded, the utility values can grow fast enough to outpace any summable probability distribution.

  Therefore, **unboundedness is the necessary and sufficient condition** for the existence of *some* St. Petersburg-style lottery that yields infinite expected utility. To rule out *all* such lotteries, $U$ must be bounded.

  ---

  ### Part 2: The Boundedness Requirement and the "Ceiling" Objection

  You asked if insisting on bounded utility resolves the weirdness or relocates it. This is the central tension in modern decision theory.

  #### 1. Why Boundedness Falls Out of Axioms
  You mentioned the von Neumann–Morgenstern (vNM) Continuity (Archimedean) Axiom. It is important to be precise about where boundedness comes from, because the standard vNM theorem (1944) applies to **finite** lotteries. For finite lotteries, utility does *not* need to be bounded.

  Boundedness becomes required when we extend Expected Utility Theory to **countably infinite** lotteries (which we must do to discuss the St. Petersburg game coherently).

  **The Continuity Axiom:**
  For any three outcomes $A, B, C$ where $A \prec B \prec C$ (strictly preferred), there exists a probability $p \in (0,1)$ such that the agent is indifferent between $B$ and a lottery yielding $A$ with probability $p$ and $C$ with probability $1-p$.
  $$ B \sim [p: A, (1-p): C] $$

  **The Conflict with Unbounded Utility:**
  If $U$ is unbounded, we can construct a sequence of outcomes $C_1, C_2, \dots$ such that $U(C_n) \to \infty$.
  Fix a baseline outcome $A$ and a middle outcome $B$.
  If utility is unbounded, the "distance" in utility between $A$ and $C_n$ grows without limit, while the distance between $A$ and $B$ is fixed.
  Eventually, $C_n$ becomes so valuable that no probability $p < 1$ attached to $A$ can drag the expected utility of the lottery down to match $B$.
  Mathematically, if $U(C_n) \to \infty$, then for any fixed $p > 0$:
  $$ E[U(\text{Lottery})] = p U(A) + (1-p) U(C_n) \to \infty $$
  This will eventually exceed $U(B)$. Thus, no $p$ exists that satisfies the indifference condition.
  **To preserve Continuity over infinite domains, $U$ must be bounded.**

  #### 2. The "Ceiling" Objection (Satiation)
  The objection you encountered is often called the **Problem of Satiation**.
  If $U$ is bounded, there exists some $U_{\max}$ such that $U(x) < U_{\max}$ for all $x$.
  This implies:
  1.  **Asymptotic Value:** There is a limit to how good life can get.
  2.  **Negligible Improvements:** For sufficiently good outcomes $x, y$, even if $y$ is objectively "better" than $x$ (e.g., saving 1 trillion lives vs. 1 quadrillion lives), the difference $U(y) - U(x)$ becomes arbitrarily small.
  3.  **Counter-Intuitive Trade-offs:** A bounded utility function implies that at the margin, a tiny probability of a "heavenly" outcome might be worth less than a guaranteed modest improvement, even if the "heavenly" outcome involves infinite happiness/duration.

  **Is this a fatal flaw?**
  Decision theorists generally view this as a "bite the bullet" situation. You have two options, both of which violate some intuition:

  **Option A: Unbounded Utility (Reject Boundedness)**
  *   *Benefit:* Preserves the intuition that "more is always better" without limit.
  *   *Cost:* You become vulnerable to **Pascal's Mugging** and St. Petersburg variants. A tiny probability of an astronomically high payoff dominates all finite certain goods.
      *   *Example:* If $U$ is unbounded, you should trade a guaranteed year of happiness for a $1/10^{100}$ chance of $10^{200}$ units of happiness.
      *   *Consequence:* Your preferences become unstable. Any finite good can be overturned by a sufficiently large (but improbable) promise. This makes rational planning impossible.

  **Option B: Bounded Utility (Accept Satiation)**
  *   *Benefit:* Guarantees that expected utility is always well-defined and finite. Decisions are stable; tiny probabilities cannot dominate finite certainties.
  *   *Cost:* Violates the intuition that value is unbounded.
      *   *Defense 1 (The Asymptote):* Boundedness does not mean you hit a hard "stop" where additional good adds *zero* value. It means the value approaches a limit. You can distinguish between saving 1 billion and 1 trillion lives; the utility difference is just very small relative to the scale of $U_{\max}$.
      *   *Defense 2 (Finite World):* In a physical universe with finite resources and finite time, we may never practically reach the region where utility flattens completely. The bound is a theoretical safeguard against infinities, not necessarily a practical constraint on human experience.
      *   *Defense 3 (Coherence):* Most theorists argue that the cost of Option A (incoherent preferences dominated by infinitesimal probabilities) is higher than the cost of Option B (accepting that value has limits). If you refuse boundedness, you cannot use Expected Utility Theory at all for infinite games, requiring a wholly new framework (which leads to the Pasadena game issues you wisely set aside).

  #### 3. Reconstructing the Trade-off
  To assess this yourself, consider the **Continuity Axiom** again.
  Do you believe that for *any* two goods $A$ and $B$ ($A \prec B$), there is *some* probability $p$ such that you would prefer a guaranteed $A$ over a lottery giving you $B$ with probability $p$ and Death with probability $1-p$?

  *   If **Yes**: You accept Continuity. If you accept Continuity over infinite lotteries, you **must** accept Bounded Utility. The "Ceiling" is the price of Continuity.
  *   If **No**: You reject Continuity. You believe some goods are "lexicographically" superior (e.g., "No probability of death is worth a candy bar"). This leads to non-Archimedean decision theories, which are mathematically much harder to work with and often fail to provide unique solutions to decision problems.

  ### Summary for Reconstruction

  1.  **Menger's Point:** The St. Petersburg divergence is a property of the *probability/utility* pairing, not *probability/money*. If $U$ is unbounded, $\exists$ a prize schedule $x_k$ such that $\sum p_k U(x_k) = \infty$ for any summable $p_k$. Concavity is irrelevant if the range of $U$ is $\mathbb{R}$.
  2.  **The Fix:** To prevent *any* lottery from having infinite expected utility, $U$ must be bounded ($|U(x)| \le M$).
  3.  **The Axiomatic Source:** In vNM-style theory extended to countable lotteries, the **Continuity (Archimedean) Axiom** implies Bounded Utility. If $U$ were unbounded, one could construct a sequence of lotteries that violates Continuity.
  4.  **The Objection:** Bounded Utility implies "Satiation" (a ceiling on value).
  5.  **The Assessment:** This is a choice between **Fanaticism** (Unbounded: tiny probs of huge payoffs dominate all reasoning) vs. **Satiation** (Bounded: huge improvements eventually matter less than small risks). Mainstream decision theory chooses Satiation because Fanaticism renders the expectation operator useless for guiding action in a world of uncertainty.

  If you want to read the primary source on the Menger argument, look for **Karl Menger, "Die Unsicherheitstheorie" (1934)**. For the modern axiomatic treatment of boundedness, **Fishburn (1967)** or **Savage (1954)** discuss the implications of the Continuity axiom on the boundedness of utility.
