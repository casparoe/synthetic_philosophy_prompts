      *   **Conflict:** Their partner thinks it's irrational/funny ("she's not real, you made her up"). Their writing group is split (valid emotion vs. performing emotion).
      *   **Core Question:** Is this reaction irrational/confused (as the partner suggests), or is there something real and defensible happening? They want an *account* of what's happening, not just "feelings are weird."
      *   **Key Nuance:** The "suspension of disbelief" argument doesn't work here because they aren't lost in the story; they are working technically *and* emotionally simultaneously.

  2.  **Deconstruct the Partner's Argument:**
