answer: |-
  Your quant source is correct, and your intuition is tripping over the single most important distinction in trading mathematics: the difference between **Expected Value (arithmetic mean)** and **Expected Growth (geometric mean).**

  You wrote: *"My understanding was always that the Kelly fraction is just whatever bet size maximizes your expected profit."*

  **This is the misunderstanding.** If your goal was simply to maximize the expected profit of a single bet (or the arithmetic average of many independent bets), you would bet **100% of your bankroll** on every wager that has a positive edge.

  But that strategy guarantees you will eventually go broke (Gambler's Ruin). The Kelly Criterion does not maximize profit per bet; it maximizes the **long-term compound growth rate** of your bankroll.

  Here is the breakdown of why your quant is right, why double Kelly kills growth, and how to explain this in your piece.

  ### 1. The Trap of "Expected Profit"
  Imagine a coin flip where you have a 60% chance to win even money (double your bet) and a 40% chance to lose your bet.
  *   **Edge:** Positive.
  *   **Maximize Expected Profit:** You bet 100% of your wallet.
  *   **Outcome:** Eventually, you will hit that 40% loss. When you bet 100%, one loss wipes you out to zero. You cannot compound from zero. Your long-term growth rate is negative infinity.

  Kelly sizing asks a different question: *"What fraction of my bankroll should I bet so that my wealth grows as fast as possible over thousands of bets without risking ruin?"*

  ### 2. Volatility Drag (The "Math" of Why You Lose)
  The reason doubling Kelly destroys growth is due to **volatility drag** (also called variance drain). This is the mathematical reality that losses hurt more than wins help when you are compounding.

  *   If you have \$100 and lose 50%, you have \$50.
  *   To get back to \$100, you don't need a 50% gain; **you need a 100% gain.**

  When you increase your bet size, you increase the volatility of your equity curve. As volatility increases, the "drag" on your compounding increases.
  *   **Full Kelly** is the exact peak of the growth curve. It is the maximum speed you can drive without crashing.
  *   **Double Kelly** pushes you so far into volatility that the drag cancels out the edge entirely.

  ### 3. The "Double Kelly = Zero Growth" Rule
  Your quant told you that betting double the Kelly fraction drives your growth rate to zero. In continuous finance models (which quants often use), this is theoretically exact.

  Here is the intuition:
  *   At **1x Kelly**, you are maximizing the slope of your wealth curve.
  *   At **2x Kelly**, the volatility is so high that the geometric mean return becomes zero. You might have wild swings up and down, but over the long run, your bankroll will not grow. It will effectively stagnate or drift toward zero.
  *   At **>2x Kelly**, your expected growth rate becomes **negative**. Even though every individual bet has a positive edge, the sequence of bets will mathematically guarantee you lose money over time.

  So, to answer your specific question: **Yes, you can have a positive edge on every single bet and still lose all your money.** This happens when your bet size is too large relative to your edge.

  ### 4. Why Prediction Market Traders Worship Kelly
  For your story, this is a crucial color detail. It signals that the "degen" stereotype of prediction markets is evolving.

  *   **Survival is Priority #1:** In markets like Polymarket or Kalshi, opportunities are recurring. Traders aren't trying to hit a home run on one contract; they are trying to compound over thousands of contracts. Kelly ensures survival.
  *   **Uncertainty Management:** You will notice many traders actually use **"Half-Kelly"** (betting 50% of what the formula suggests). Why? Because the Kelly formula assumes you know your edge *precisely*. In reality, traders often overestimate their edge. Half-Kelly reduces volatility by 50% but only sacrifices about 25% of growth. It's a safety buffer against being wrong about the probability.
  *   **The "Gospel" Aspect:** When traders talk about Kelly, they are signaling that they view trading as a **risk management problem**, not a prediction problem. Anyone can guess an outcome; professionals size their bets.

  ### Summary for Your Piece
  You can frame it like this:

  > "Newcomers think trading is about finding bets with positive expected value. Veterans know it's about sizing those bets so volatility doesn't eat your capital. The Kelly Criterion is the bridge between the two. As one quant put it: 'If you bet double Kelly, you're working for free. If you bet triple, you're paying for the privilege.'"

  **The Verdict:** Your quant is right. You were defining Kelly as an **EV maximizer** (which implies betting everything), but Kelly is actually a **Growth Optimizer** (which implies betting a fraction). Doubling that fraction breaks the compounding math, turning a winning strategy into a losing one.
