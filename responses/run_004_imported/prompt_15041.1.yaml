prompt: |-
  so i went down a rabbit hole this weekend reading about the "demandingness objection" to consequentialism — basically, if you take maximizing-the-good seriously, don't you end up morally required to give away almost everything you own until you're about as badly off as whoever you're helping? seems like a lot to ask of someone just trying to live a normal life.

  turns out philosophers have cooked up a bunch of named fixes for this over the decades: satisficing consequentialism, rule-consequentialism (Hooker's version), Scheffler's agent-centered prerogatives, Railton's sophisticated/indirect consequentialism, Liam Murphy's compliance-based cap on what you owe, and the just-bite-the-bullet crowd (Singer/Unger) who basically say yeah it's demanding, get over it.

  can you rank these (add any other major one i'm forgetting) by how well they actually solve the demandingness problem without quietly turning consequentialism into some other theory wearing a trenchcoat? give me a tier list, S down to D, as a JSON block like:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  and toss in like one sentence per tier on the general reasoning. thanks!
