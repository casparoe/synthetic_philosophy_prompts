      *   *Hume's Context:* Hume isn't doing modal logic. He's doing genetic psychology/epistemology.
      *   *Why does he equate them?* For Hume, the *meaning* of causation is exhausted by what we can observe and infer.
          *   Observation: Constant Conjunction (CC).
          *   Inference: Customary Transition (CT).
          *   The Counterfactual: When Hume says "if the first object had not been, the second never had existed," he isn't positing a metaphysical necessity in the world. He is expressing the *strength of the expectation* generated by CC.
      *   *The "Collapse":* They collapse *for the mind*. Because we have no impression of necessary connection, the only content we have for "cause" is the regularity. The counterfactual is just a way of expressing the *uniformity* of that regularity from the perspective of inference. If the regularity is perfect, the counterfactual holds *for us*.
      *   *Is it a fudge?* Modern critics (like Strawson, Kripke) say yes, it's a logical gap. But exegetically, Hume thinks he's describing the *same phenomenon* from two angles: the objects (CC) and the mind (CT). The counterfactual is tucked into the first definition as a way of emphasizing the *universality* of the conjunction, not a distinct modal fact.
      *   *Key Insight:* Hume's counterfactual isn't a truth-condition for causation independent of regularity; it's a rhetorical restatement of the *invariability* of the regularity.

