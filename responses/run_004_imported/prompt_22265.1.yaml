      *   *Nuance:* Some argue Hume isn't a full projectivist (Skeptical Realist reading: there *is* a power, we just don't know it). But the dominant view is Projectivism.
      *   *Conclusion on Q2:* It is a principled *adaptation*, not a strict exegesis. They are "Humean" in ontology (no necessary connections) but not in semantics/psychology. They drop Def 2 because they want laws to be truth-apt descriptions of the world, not descriptions of mental habits.

