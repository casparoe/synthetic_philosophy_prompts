  7.  **Final Polish:** Check quotes and terminology (Constant Conjunction, Customary Transition, Humean Mosaic, Best System Analysis). Ensure the distinction between Section 7 (Enquiry) and Treatise is kept in mind (Enquiry is cleaner).

