      *   **Question 2:** Contemporary Humeans about laws (Best System Analysis, e.g., Lewis) focus on the regularity/objective definition and ignore the psychological/mental definition (custom, anticipation). Is this principled, or does it misrepresent Hume as more objectivist than he actually was (ignoring the projectivist/psychologistic element)?
      *   **Goal:** Provide a philosophically nuanced explanation that addresses both the textual/exegetical issue and the meta-philosophical issue regarding contemporary Humeanism.

  2.  **Deconstruct Question 1: Regularity vs. Counterfactuals in Hume:**
