answer: |-
  This is an excellent pair of questions. You have put your finger on the two central tensions in Hume scholarship and the metaphysics of laws: the logical gap between regularity and counterfactuals, and the gap between Hume's epistemology/psychology and contemporary Neo-Humean metaphysics.

  Here is a breakdown of how to untangle both issues for your seminar.

  ### 1. The "Fudge": Regularity vs. Counterfactuals

  You are absolutely right that in modern modal logic (post-Kripke, post-Lewis), regularity and counterfactual dependence are not equivalent.
  *   **Regularity:** All $A$s are followed by $B$s. (Universal Generalization)
  *   **Counterfactual:** If this specific $A$ had not occurred, this specific $B$ would not have occurred.

  The problem, as you know, is **accidental generalizations**. Suppose everyone in the seminar room is wearing shoes. That is a regularity. But it is not true that "if John had not worn shoes, he would not have been in the room." Yet, under a naive regularity view, the generalization holds.

  So, is Hume fudging it? **Exegetically, no; Logically, yes.**

  **Why it isn't a fudge for Hume:**
  Hume is not doing modal metaphysics; he is doing genetic psychology. He is asking: *What is the content of our idea of cause?* His answer is that we have no impression of "power" or "necessity" in the objects themselves. We only have the impression of constant conjunction (Def 1) and the impression of the mind's determination (Def 2).

  When Hume inserts the counterfactual ("if the first object had not been, the second never had existed") into the first definition, he is not positing a distinct modal fact about the world. He is using the counterfactual as a **rhetorical device to emphasize the universality of the regularity.**

  For Hume, "Necessity" is not a feature of the world; it is a projection of the mind's expectation onto the world. Therefore, to say "A causes B" *just means*:
  1.  A and B are constantly conjoined.
  2.  The mind is determined to expect B given A.

  When he writes the counterfactual, he is translating the *feeling* of necessity (which arises from custom) into a statement about the objects. He is saying: "Because our expectation is so total (due to perfect regularity), we speak *as if* the effect depends on the cause."

  **The Collapse:**
  They collapse together **only within Hume's epistemic framework.** Since we cannot know anything beyond experience, a "true" counterfactual dependence *is* nothing more than a perfect regularity accompanied by a strong customary transition. If there were a difference between "always conjoined" and "counterfactually dependent," that difference would constitute a "secret power" or "necessary connection" independent of experience—which Hume has already argued we can have no idea of.

  **Verdict for Seminar:** It is a logical fudge by modern standards, but it is consistent within Hume's system. He treats the counterfactual not as a truth-condition that *grounds* the regularity, but as a synonymous way of expressing the *invariability* of the regularity as experienced by the mind.

  ### 2. Contemporary Humeanism and Definition 2

  This is the deeper metaphysical issue. You are correct that contemporary "Humeans" (like David Lewis and proponents of the Best System Analysis) aggressively adopt Definition 1 (Regularity/Supervenience on local matters of fact) and largely ignore Definition 2 (The Mind's Customary Transition).

  Is this principled, or does it betray Hume?

  **The Neo-Humean Move (Lewis):**
  David Lewis explicitly calls himself a "Humean" regarding ontology (the "Humean Mosaic": the world is just a distribution of local qualities in spacetime, with no necessary connections between distinct existences). However, Lewis is a **realist** about laws, whereas Hume is a **projectivist** (or skeptic) about them.

  *   **Hume:** Causation/Laws = Regularity + *Mental Habit*. Without the mind's habit, there is no "causation," only succession.
  *   **Lewis:** Causation/Laws = Regularity + *Systematicity*. Laws are the axioms of the system that best balances simplicity and strength in describing the Humean Mosaic.

  **Why they drop Definition 2:**
  Contemporary Humeans drop the psychological definition because they are trying to solve a **metaphysical** problem (what makes a law a law?), whereas Hume was solving an **epistemological** problem (how do we justify induction?).

  If you keep Definition 2, causation becomes mind-dependent. For Lewis, this is unacceptable for a metaphysics of science. He wants laws to be objective features of the world (supervening on the mosaic), not features of human psychology. If laws depend on "customary transitions," then causation wouldn't exist before humans evolved to have customs. Lewis wants to save the objectivity of science while keeping Hume's ontology (no necessary connections).

  **Is it Principled?**
  It is a **principled adaptation**, but it creates a hybrid view often called "Neo-Humeanism."
  *   **Principled:** They retain Hume's *negative* thesis (no necessary connections in nature) but reject his *positive* thesis (that causation is merely a feeling). They replace the "feeling" with "best systematization."
  *   **Betrayal:** From a strict exegetical view, yes, it betrays Hume. Hume's point in Section 7 is that we *cannot* define cause objectively without reference to the mind. By dropping Def 2, Neo-Humeans are trying to have an objective definition of cause that Hume explicitly said was impossible ("beyond these, we have no idea of it").

  **The Projectivist Critique:**
  Philosophers like Simon Blackburn or Huw Price (Quasi-Realists) argue that the Neo-Humeans are missing the point. They argue we should embrace Definition 2. On this reading, laws *are* projections of our normative attitudes onto the regularities. To say "It is a law that A causes B" is not to describe a modal fact in the world, but to express our commitment to inferring B from A.

  **Verdict for Seminar:**
  Dropping Definition 2 allows contemporary Humeans to be **metaphysical realists** about laws (in a deflated sense) rather than **psychological projectivists**.
  *   If you keep Def 2, you get **Hume's View**: Causation is a hybrid of worldly regularity and mental habit.
  *   If you drop Def 2, you get **Lewis's View**: Causation is a worldly regularity that satisfies certain systematic constraints.

  The "Humeanism" in contemporary metaphysics refers to the **ontology** (the mosaic, no necessary connections), not the **psychology**. They are "Humean" about what exists, but not "Humean" about what we mean when we talk about causes.

  ### Summary for your Seminar Contribution

  1.  **On the Counterfactual:** Hume equates regularity and counterfactuals because he denies we have access to any modal reality beyond regularity. The counterfactual is not a separate truth-maker; it is the *voice* of the customary transition speaking about the objects. It collapses only because Hume limits the *meaning* of causation to what is experienceable.
  2.  **On Contemporary Humeanism:** Modern Humeans (Lewis/BSA) are "Ontological Humeans" but "Semantic Realists." They drop Definition 2 because they want laws to be objective features of the world (supervening on the mosaic) rather than dependent on human psychology. This is a principled shift from epistemology to metaphysics, but it means they are not fully Humean on the *nature* of causal claims, only on the *furniture* of the world.

  This distinction shows you understand that "Humeanism" is a label used for two different projects: Hume's (limiting knowledge) and Lewis's (saving objectivity without necessity).
