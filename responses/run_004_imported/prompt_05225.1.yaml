answer: |-
  **Setting:** *A quiet corner of a coffee shop, late afternoon. Alex and Jordan are finishing up their drinks. They've been talking about the family dinner incident you described.*

  **Alex:** I keep going back to your cousin's point. I know the uncle was technically right about the money stuff, but the cousin was right to shut him down. There's a difference between being *correct* and having the *standing* to say it.

  **Jordan:** See, I think that's where you're getting tricked by the emotion of the moment. Logically, it's the *tu quoque* fallacy. "You did it too." It doesn't actually disprove the argument. If I tell you smoking kills you, and I'm a chain-smoker, I'm still telling the truth. The advice doesn't become false because the messenger is flawed.

  **Alex:** I'm not saying the advice becomes false. That's the distinction I'm trying to make. The proposition "financial responsibility is good" is true. But blame isn't just a data transfer. It's a social transaction. When your uncle lectured everyone, he was implicitly saying, "I am operating from a position of authority on this." By having declared bankruptcy twice through negligence, he forfeited that authority. He lost his standing.

  **Jordan:** But "standing" sounds so formal. Like he needs a permit to give advice. If we say hypocrisy kills your standing, where does it end? Do we need a moral credit score before we're allowed to criticize anything? If I've ever sped, can I not tell you not to drive recklessly? If I've ever told a white lie, I can't advocate for honesty? That leads to a world where only saints can speak, and last I checked, saints are rare.

  **Alex:** That's the obvious comeback, and it's a good one. But it assumes "hypocrisy" just means "having ever done the thing." That's not what the philosophers who support the standing view are saying. It's not about a clean record; it's about your *commitment* to the norm.

  **Jordan:** How so?

  **Alex:** Think about the difference between someone who struggles with debt but is trying to pay it off, versus your uncle. Your uncle wasn't apologizing. He was lecturing. He was treating the rule as something that applied to *you*, but not to *him*. That's the forfeiture. When you flout a rule yourself while enforcing it on others, you're essentially saying, "I'm above this." You can't be above the rule and then use the rule as a weapon. That's why the standing is gone.

  **Jordan:** Okay, I see the nuance there. It's about the attitude, not the history. But I still think you're conflating the *message* with the *messenger's character*. Let's take the classic case you mentioned in your notes: the politician campaigning on "family values" who is secretly cheating on his spouse.

  **Alex:** Exactly. That's the perfect example of lost standing.

  **Jordan:** Is it? Or is it just that he's a liar? If he gives a speech about why stable families are good for society, and he's cheating... well, the speech might still be right. Stable families *are* good for society. If we say he has no *standing* to say that, are we saying the point shouldn't be heard? Or are we just saying *he* is untrustworthy? I think it's the latter. The hypocrisy damages his credibility, sure. It makes us dislike him. But it doesn't mean the moral claim itself loses its force, or that he's somehow barred from making it.

  **Alex:** But it feels like more than just credibility. It feels like a violation of fairness. Imagine a referee in a soccer game who secretly bets on the games. Even if he calls a foul correctly, the players are going to riot. Why? Because the referee's authority comes from being neutral, from being subject to the rules of officiating. When the politician or your uncle lectures, they're acting like a moral referee. If they're violating the rules they're enforcing, they're engaging in a kind of manipulation. They're trying to claim a moral high ground they haven't earned.

  **Jordan:** I agree it's manipulative. I agree it's gross. But does "gross" mean they lose the *right* to speak? I worry that if we accept your view, we give people a get-out-of-jail-free card. Imagine I catch you stealing from the register. You turn around and say, "Well, Alex, you shoplifted once in high school, so you have no standing to call me out."

  **Alex:** [Laughs] I see what you're doing.

  **Jordan:** Right? If hypocrisy negates standing, then your past mistake silences your present concern. That protects the wrongdoer, not the victim. It shifts the focus from *my theft* to *your history*. That seems dangerous.

  **Alex:** Okay, but in that case, am I really being a hypocrite? If I stole in high school, regretted it, and have been honest for ten years, I'm not currently flouting the norm. I'm holding myself to the standard *now*. Your uncle, and the cheating politician, are actively violating the standard *while* preaching it. There's a difference between a reformed sinner and an active hypocrite. The reformed sinner has standing because they acknowledge the rule binds them. The active hypocrite says the rule binds *you*, but not *them*.

  **Jordan:** That's a stronger distinction. So it's about current endorsement of the exception?

  **Alex:** Yes. It's about the relationship between the blamer and the blamee. Blame is a demand. I'm demanding you respect this rule. But if I show you I don't respect it, the demand becomes unfair. It becomes a power play.

  **Jordan:** But let's press on that "unfair" part. Let's say the uncle is unfair. Let's say he's a jerk. Does his jerk-ness mean his cousin shouldn't listen? Look, I get the emotional sting. It feels insulting to be lectured by someone who fails at the very thing they're preaching. But if the advice is good, isn't the moral obligation to *listen to the advice* more important than the *feelings about the advisor*?

  **Alex:** Maybe. But we aren't robots. We learn norms through social modeling. If we allow people to enforce rules they don't follow, we erode the norm itself. It turns the rule into a tool for control rather than a shared value. If your uncle gets to lecture everyone without living it, then "financial responsibility" isn't a value the family shares; it's just a stick he uses to hit people. By calling out his lack of standing, your cousin was actually defending the value. He was saying, "This rule matters enough that even *you* should follow it before you preach it."

  **Jordan:** That's a really interesting spin. So, calling out the hypocrisy isn't dismissing the rule; it's demanding the rule be taken seriously enough to apply to everyone?

  **Alex:** Exactly. It's saying the rule has authority over *all of us*, including the speaker.

  **Jordan:** I can buy that. But I still want to hold onto the idea that the truth of the claim is independent. I worry that "standing" becomes a way to shut down uncomfortable truths. If a climate change activist flies on a private jet, they're a hypocrite. By your logic, they lose standing. But does that mean the data on climate change is wrong? Or that we should ignore them?

  **Alex:** No, the data is still the data. That goes back to the correctness vs. standing distinction. The *proposition* ("climate change is real") remains correct. The *blame* ("you are bad for ignoring this") loses its bite coming from them. You can accept the science without accepting their moral authority to shame you.

  **Jordan:** So, correctness is about the world. Standing is about the relationship.

  **Alex:** Yes. Your uncle was right about the world (money management is important). He was wrong about the relationship (he doesn't have the position to demand that of you).

  **Jordan:** Okay. I think I'm closer to your view on the "active flouting" part. If you're actively breaking the rule while enforcing it, you are engaging in a form of deception. You're presenting yourself as a partner in this moral project when you're actually a saboteur. That does feel like it voids the contract.

  **Alex:** "Voiding the contract." I like that.

  **Jordan:** But I still think the "Clean Record" worry is worth keeping in mind. We have to be careful not to let "standing" become a purity test. We're all struggling with something. If I'm trying to quit drinking, can I not tell my friend not to drive drunk?

  **Alex:** Absolutely you can. Because you aren't claiming you're perfect. You're claiming the rule matters. If you say, "I struggle with this, and it's dangerous, please don't do it," you have standing. If you say, "I drink and drive all the time, but you shouldn't," you have none. It comes down to whether you acknowledge the rule applies to you.

  **Jordan:** So the uncle's problem wasn't the bankruptcy. It was the lecture.

  **Alex:** Precisely. If he'd said, "Look, I messed this up twice. It ruined my life. Please learn from my mistakes," he would have had standing. Maybe even more standing, because it's earned through experience. But by lecturing *down* to you guys? That's what killed it.

  **Jordan:** That makes sense. It shifts the focus from "You're a hypocrite, so shut up" to "You're pretending to be something you're not, and that makes this interaction fake."

  **Alex:** Right. It's not about silencing the truth. It's about demanding authenticity in how we deliver it.

  **Jordan:** Okay. I think I can live with that. I still think the advice should be evaluated on its merits regardless of the source—I don't want to throw away good money advice just because the uncle is a mess—but I concede that he lost the right to deliver it as a *moral judgment* on everyone else.

  **Alex:** And I'll concede that "standing" isn't a magic wand that makes the underlying fact false. The cousin still needs to manage his money. The uncle was just the wrong person to deliver that lesson in that way.

  **Jordan:** So, what do we tell your cousin?

  **Alex:** Tell him he was right to feel annoyed. He wasn't just deflecting. He was pointing out that moral authority has to be earned, not just claimed.

  **Jordan:** And tell the uncle...

  **Alex:** To fix his own balance sheet before he tries to audit everyone else's.

  **Jordan:** [Smiles] Fair enough.
