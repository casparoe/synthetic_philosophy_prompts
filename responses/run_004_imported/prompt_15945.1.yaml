answer: |-
  **Setting:** *A dimly lit control room at the Institute for Quantum Optics. Two large monitors display real-time coincidence counts from detector stations Alpha and Beta, separated by twenty kilometers of optical fiber. The data stream has just stabilized. ELIAS (60s, Bohmian) stands by the Alpha feed. SARAH (40s, Everettian) leans against the console near Beta. The hum of cooling fans fills the silence between their words.*

  **Elias:** (Tapping the screen) Look at that. Ninety-nine percent anti-correlation. The moment Alpha registers spin-up, Beta registers spin-down. Instantaneously. For thirty-six years I ignored what that meant, but looking at it now... it's a handshake across spacetime. My particles know what the other is doing.

  **Sarah:** Your particles know nothing, Elias. The wavefunction knows. And it doesn't "know" instantly; it simply evolves. What you're seeing isn't a handshake. It's a record of a single, unitary history that includes both detectors.

  **Elias:** Don't retreat into the formalism. I'm talking about ontology. In your view, when Alpha measured up, the world branched. When Beta measured down, the world branched. So tell me: what guarantees that the "Up-Alpha" branch locks onto the "Down-Beta" branch? If branching is a local physical process, as you claim to preserve locality, why don't I ever find myself in a branch where we both measured up? Something has to enforce that correlation across the twenty kilometers.

  **Sarah:** That's the trap of the single-outcome intuition. You're imagining two separate branching events that need to be stitched together. They aren't separate. The entanglement was established at the source. The "branching" is just the local decoherence of a global state. The correlation isn't *enforced* across the distance; it's *revealed* locally.

  **Elias:** Revealed? That's magic. If I change my setting angle here at Alpha *now*, the statistical distribution of your outcomes at Beta doesn't change, true. But the *correlation* does. In Bohmian mechanics, it's clear: the quantum potential depends on the configuration of both particles. I change my magnet, the potential changes everywhere, and your particle's trajectory is guided differently. It's non-local, yes. I own that. But you... you claim locality while relying on a global wavefunction that dictates which branches are compatible.

  **Sarah:** I claim locality because nothing physical crosses the gap. Think Deutsch-Hayden. In the Heisenberg picture, the operators describing the qubits evolve locally. The information about the correlation is carried by the local observables from the source to the detectors. No signal passes between Alpha and Beta during the measurement. The "global" wavefunction is just a bookkeeping tool for the relations between those local descriptors.

  **Elias:** Bookkeeping? Sarah, if the wavefunction is just bookkeeping, what is branching? If it's real, it's a global object. If the state vector is ontic, and it collapses—or branches—based on a measurement here, the update is non-local. You say "no single outcome," but *I* am experiencing a single outcome. I see "Up." You see "Down." For us to compare notes and agree on the Bell violation, our branches had to find each other. If there is a version of you that saw "Up," where did it go? Why am I not talking to her?

  **Sarah:** You *are* talking to her. Or rather, a version of you is. But *this* you, in this branch, only has access to the local information consistent with this history. You're asking for a mechanism to "select" the matching branch. There is no selection. All matching pairs exist. The reason you don't see the mismatched pairs is that they are orthogonal in Hilbert space. They don't interfere. It's not that they are far away; it's that they are *elsewhere* in the state space.

  **Elias:** "Elsewhere in state space." That's a polite way of saying "non-local influence." You've hidden the action-at-a-distance inside the geometry of Hilbert space. But let's turn the screw. You accuse me of non-locality. Fine. My guiding equation is non-local. $\frac{dq}{dt}$ depends on the positions of all particles instantly. But your price for this "local" branching is that you have to multiply reality by infinity to save the Schrödinger equation.

  **Sarah:** I multiply reality to save *causality*. Look at your guiding equation, Elias. It requires a time parameter $t$. In non-relativistic QM, that's fine. But we live in a relativistic universe. To make your trajectories work, you need a preferred foliation of spacetime. A universal "Now." You have to posit a hidden frame of reference where the guidance happens instantaneously. You break Lorentz invariance at the fundamental level, even if you hide it statistically.

  **Elias:** I posit a structure that explains the data. Relativity is a symmetry of the phenomena, not necessarily a constraint on the underlying ontology. If the truth requires a preferred frame, so be it. Better a hidden frame than hidden worlds.

  **Sarah:** Is it? A hidden frame is empirically inaccessible. You can never measure the absolute velocity relative to the preferred foliation. It's a metaphysical add-on. But my "hidden worlds"... they aren't hidden in the same way. They are consequences of the linear dynamics. I don't add them; the math gives them to me. You add a frame *and* you add a non-local influence that jumps spacelike intervals.

  **Elias:** I add a frame to make sense of the fact that *events happen*. One event. One result. You keep the math pure, but you lose the world. You tell me that when I see "Up," there is another Elias who saw "Down." If that's true, then "I" am not a continuous entity. I'm a slice of a manifold. How do you justify the Born Rule in that soup? Why should I bet on the squared amplitude if *all* outcomes happen?

  **Sarah:** That's the decision-theory derivation. If I know I'm going to branch, I should act as if the branches have weights. But we're talking about locality. You asked what I give up. I give up the idea that *this* outcome is the *only* outcome. I surrender uniqueness. In exchange, I keep the Schrödinger equation local and linear. I keep information flowing within light cones. What do you give up, Elias? To keep your single outcome, to keep your definite particles... what is the cost?

  **Elias:** (He looks at the coincidence counter, then back to her) The cost is that the universe is not locally causal in the way Einstein hoped. I give up the idea that physical influences are confined to the past light cone. I accept that the configuration of the universe is a single, indivisible whole, and that "separation" is an emergent approximation. I give up Manifest Lorentz Invariance. I admit there is a "true" time, even if we can't clock it.

  **Sarah:** And I give up the uniqueness of the present. I admit that "now" is not a single slice of reality, but a superposition of histories.

  **Elias:** So there it is. I sacrifice Relativity's claim to fundamental ontology to save the definiteness of experience.

  **Sarah:** And I sacrifice the definiteness of experience to save Relativity's claim to fundamental ontology.

  **Elias:** (Turns back to the screen) The data doesn't care, does it?

  **Sarah:** No. The data is silent. It's just the silence between us that's loud.

  *(They stand in the hum of the servers, watching the numbers climb, neither willing to blink.)*
