answer: |-
  Your unease is not only justified; it is philosophically precise. You have stumbled onto a real-world implementation of **Futarchy** (a governance system proposed by economist Robin Hanson), and your intuition that it is "self-undermining" in this specific context hits on the central critiques leveled against it by political philosophers and mechanism designers.

  While your partner sees a depersonalized conflict resolution mechanism, what they are describing is a category error in political epistemology. The scheme attempts to use a tool designed for *information aggregation* (markets) to solve a problem of *value negotiation* (politics) within a *small, non-liquid community*.

  Here is the breakdown of why this is structurally doomed, moving from the epistemological to the political.

  ### 1. The Identification Problem (The Epistemological Flaw)
  This is the deepest technical issue. Futarchy relies on the distinction between **values** (what we want) and **beliefs** (what leads to what). The market is supposed to aggregate beliefs about causal relationships.

  However, prediction markets can only price *observable outcomes*. In this co-op, only one policy can be enacted.
  *   If the market chooses **Allow**, you will observe the "Happiness + Savings" score for the *Allow* world.
  *   You will **never** observe the score for the *Ban* world.

  So, how do you settle the bets for the people who bet on the *Ban* scenario?
  *   **Option A:** You void their bets. This destroys market liquidity and incentives. No one will bet on the losing side if they know their capital is at risk of being voided.
  *   **Option B:** You settle based on a causal model/estimate. Now the market isn't betting on *reality*; it's betting on *the model's estimate of a counterfactual*.

  This means the market price doesn't reflect "what will happen"; it reflects "what the house thinks a model would say." In a 30-person house, there is no "market truth" independent of the participants' biases. You haven't removed the disagreement; you've just shifted the disagreement from "Should we allow Airbnb?" to "What is the correct causal coefficient for Airbnb's impact on happiness?" That is arguably a *more* technical and less resolvable fight.

  ### 2. Incentive Compatibility in Small-N (The Game Theoretic Flaw)
  Prediction markets work best when traders are indifferent to the outcome and care only about being *right* (profit). This requires a large, liquid market of strangers.

  In a 30-person co-op, the traders are the **citizens**. They have strong preferences over the policy outcome independent of the rent discount.
  *   **Sabotage Betting:** If I morally oppose Airbnb, I might bet against the "Allow" score *even if I believe it will actually raise savings*. I am willing to lose some rent discount money to ensure the policy doesn't pass. This introduces "noise" that decouples the market price from the true probability.
  *   **The Wealth Effect:** If one housemate is significantly wealthier or more risk-tolerant, they can corner the market. They can flood the "Allow" side with bets not because they believe it will increase happiness, but because they can afford to lose the bet price to buy the policy they want. In a nation-state, this is bribery; in a co-op, it's oligarchy.

  The mechanism assumes that the financial incentive (rent discount) outweighs the policy preference. In a shared living situation, the policy preference (e.g., "I don't want strangers in my kitchen") often has a higher utility value than a $50/month rent discount. Once that happens, the market signal is corrupted.

  ### 3. Goodhart's Law on Steroids (The Metric Flaw)
  You mentioned Goodhart's Law, but in this setup, it is endogenous and financialized.
  *   **The Metric:** "Happiness Survey + Savings."
  *   **The Incentive:** Rent discounts are tied to this metric.

  Now, every housemate has a direct financial incentive to **inflate the happiness score**, regardless of the policy.
  *   If I know the "Happiness Survey" determines my rent, I am incentivized to report high happiness on the survey to boost the pool score, even if I am miserable.
  *   Furthermore, housemates are incentivized to *make* each other happy in superficial ways to boost the score, potentially suppressing legitimate conflict. If someone is rightfully angry about a messy kitchen, reporting that anger lowers the collective score and hurts everyone's rent discount.

  This creates a **repressive tolerance**. The mechanism financially penalizes the expression of negative feedback. A healthy co-op *needs* conflict to function; this system prices conflict as a negative externality. It doesn't solve the shouting; it incentivizes passive-aggressive silence.

  ### 4. The Erosion of Deliberative Legitimacy (The Political Flaw)
  This is the point most relevant to your work in political epistemology. Your partner likes the system because it "feels less personal." That is exactly the problem.

  Co-op governance is not just about optimizing outcomes; it is about **legitimacy through participation**.
  *   **Alienation:** By outsourcing the decision to a market, housemates are alienated from the normative justification of the rule. If the "Allow" policy wins, the losers cannot be convinced by reasons; they are simply overruled by "the odds."
  *   **Responsibility:** In a vote, everyone owns the decision. In a futarchy, if the policy fails, the housemates can blame the "market" or the "bettors." It diffuses moral responsibility.
  *   **The "Right to Rule":** In a small community, the right to make rules over shared space is derived from shared vulnerability. A market mechanism privileges those with better information or higher risk tolerance, not those most affected by the policy.

  ### The Verdict
  Your gut is right. This is not an implementation problem that can be fixed with better rules; it is a **category error**.

  Prediction markets are tools for **epistemic aggregation** (finding the truth about the world). Co-op governance is a process of **normative negotiation** (deciding how to live together).

  By trying to turn a normative question ("Do we want strangers in our house?") into an epistemic question ("Will strangers increase our blended score?"), the system attempts to bypass the need for value consensus. But because the "score" is subjective (happiness) and the group is small (illiquid), the market cannot find an objective truth. It just becomes a proxy war for the original conflict, now complicated by financial derivatives and metric gaming.

  **What to tell your partner:**
  The system assumes that the house agrees on *what matters* (the score) and only disagrees on *how to get it*. But in a co-op, the fight about Airbnb is rarely just about money vs. happiness; it's about privacy, security, and community boundaries. Those are incommensurable values. You cannot bet your way out of a value conflict, especially when the bettors are the ones who have to live with the losers.

  It's a clever hack, but it treats the house like a corporation rather than a polity. And historically, when you treat a home like a firm, you get efficiency at the cost of habitability.
