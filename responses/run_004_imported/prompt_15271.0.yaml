          4.  The policy with the higher expected score (according to market odds) wins automatically.
      *   **Partner's View:** Likes it because it depersonalizes the conflict.
      *   **User's Intuition:** Something is off/self-undermining.

  2.  **Deconstruct the Proposed Mechanism:**
