      *   *Incentive Compatibility:* Do housemates want to maximize the score, or do they want their preferred policy? If I hate Airbnb, I might bet against it even if I think it *will* raise savings, because I want it banned. Wait, the mechanism says "bet on what the score *will be*." If I bet against my belief to influence the outcome, I lose money. *But*, if I care more about the policy than the rent discount, I might sabotage the market.
      *   *Liquidity & Noise:* 30 people is tiny. One biased actor can skew odds.

