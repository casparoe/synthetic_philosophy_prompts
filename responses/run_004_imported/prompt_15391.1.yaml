prompt: |-
  Two people in my game theory prep group (we're grinding through practice questions for our micro prelim) got into it on the whiteboard last night and I still can't decide who won. The problem only gives Player 1's payoffs, since that's all this question needs: A gets 4 if Player 2 plays L and 1 if R; B gets 1 if L and 4 if R; C gets 2 either way. The question was whether C survives iterated elimination of strictly dominated strategies.

  (1) Julian said yes, obviously: A doesn't dominate C since it looses to C under R (1 vs 2), and B doesn't dominate C since it loses under L (1 vs 2), so nothing beats C everywhere, so C isn't dominated and survives.
  (2) Mara said no, C is dead: a fifty-fifty mix of A and B pays (2.5, 2.5), which beats C under both L and R, so C is strictly dominated by that mixture even though no pure strategy dominates it alone.
  (3) Julian said that's a technicality: nobody in this game is actually randomizing, so knocking out C by appeal to a strategy nobody would ever play seems unmotivated -- restrict to strategies someone might really use, and C looks fine.
  (4) Mara said it doesn't matter that the mix never actually gets played: since it beats C in both columns, it beats C against any belief Julian could have about what Player 2 does, so there's no belief under which C is a best response, which is exactly what dominance is supposed to rule out.

  Neither of them budged and I'm honestly not sure who's right about what. Can you go through it move by move? Give me a JSON block scoring each move from -2 (clearly wrong) to 2 (clearly right), formatted like {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, then a sentence or two justifying each score, and say if you think there's anything both of them are still missing.
