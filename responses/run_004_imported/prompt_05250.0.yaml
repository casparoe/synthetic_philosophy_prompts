  This summer I've been teaching myself some set theory for fun (finished Halmos's Naive Set Theory, which is apparently not normal summer reading for a rising junior but whatever) and now I'm stuck on Zorn's Lemma. It's apparently the thing you use to prove stuff like "every vector space has a basis," which is such a random conclusion to get out of something that sounds this abstract. I think I've got the actual statement down ok: if you have a partially ordered set where every chain has an upper bound, then the whole set has to contain a maximal element.

  But when I tried sanity-checking this on an example I actually understand, like the real numbers with the normal ≤ ordering, it just breaks. ℝ is a poset, and for any chain of reals you pick out there's obviously always some real number sitting above all of them, right, since the reals dont have an "edge" anywhere. So by Zorn's Lemma shouldn't ℝ have a maximal element somewhere in it? Except it obviously doesnt, since you can always just add 1 to whatever you've got and get something bigger. I asked a friend from math club about it (we definitely do not cover this in class - our calc teacher had never even heard of 'Zorn' when I asked her) and all he said was 'lol thats just the axiom of choice being weird,' which didn't actually explain anything. So is Zorn's Lemma just not true for infinite sets like ℝ, or am I messing up what counts as a "chain" or an "upper bound" here? I'd like to actually understand what's going on instead of just memorizing that it "works" for the basis proof and moving on.
