      *   **Part 2: Why Speed/Verifiability Changes the *Kind* of Danger:**
          *   *Verifiability (Legibility):* Human threats are cheap talk. AI commitments can be cryptographic or architectural. If I show you my source code, you *know* I will defect if you do X. This removes the "bluffing" buffer that allows de-escalation.
          *   *Speed (Temporal Compression):* It's not just "fast." It's that the time to evaluate a commitment becomes shorter than the time to negotiate.
