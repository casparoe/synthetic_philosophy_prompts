answer: |-
  The jar sat between the empty wine glasses, ninety chips settled at the bottom. Thirty red. Sixty black and yellow, in proportions no one knew. The dinner plates had been cleared twenty minutes ago, but neither Elena nor Marcus had moved to the couch.

  "You're hiding behind Raiffa," Elena said, tapping a fingernail against the glass. "And honestly, it's a clever hiding spot, but it's made of glass too."

  Marcus leaned back, swirling the dregs of his Cabernet. "I'm not hiding. I'm telling you that the randomization argument doesn't dissolve the paradox. It just moves it."

  "Let's walk through it again. Slowly." Elena leaned forward. "You say you prefer betting on Red over Black. That implies you think the probability of Red is higher than Black. But then you prefer betting on Black-or-Yellow over Red-or-Yellow. That implies you think Black is *more* likely than Red. You can't hold both beliefs. Savage proved that. So Raiffa offered a way out. He said: 'Fine, Marcus. You don't know the split of Black and Yellow. So let's randomize.' "

  She gestured to the jar. "I flip a coin. Heads, you bet on Black. Tails, you bet on Yellow. Regardless of how the sixty chips are split, your chance of winning is now exactly one-third. It is mathematically identical to betting on Red. If you are truly ambiguity-averse, this randomized bet should be acceptable to you, because the ambiguity has been washed out by the coin. If you *still* reject it, you are rejecting a known one-third probability in favor of a known one-third probability. That's not caution. That's incoherence."

  Marcus watched the chips. "You're relying on the Reduction of Compound Lotteries. You're assuming that a two-stage process—coin flip, then urn draw—is rationally equivalent to a single-stage process with known odds."

  "It is equivalent," Elena said. "The math is identical."

  "The math is identical. The *epistemology* isn't." Marcus picked up a red chip, then dropped it back. "Raiffa's solution assumes I trust the independence of the coin and the urn. But my ambiguity aversion isn't just about the urn. It's about the entire structure of the decision environment. When I look at the urn, I don't have a prior. I have a set of priors. When you introduce a coin, I now have a set of priors over the *joint distribution* of the coin and the urn."

  "But I tell you the coin is fair," Elena said. "I guarantee it."

  "Who are you?" Marcus smiled, but it was thin. "In a lab, maybe I trust the experimenter. In the world? If I'm ambiguity-averse, it's because I suspect the game is rigged in ways I can't model. If I accept your randomized bet, I am accepting your model of reality. I am conceding that the uncertainty is quantifiable. But it isn't. The moment I agree to the coin flip, I've surrendered the very insight that motivated my aversion: that some things are not measurable."

  Elena shook her head. "That's the un-deflectable objection, Marcus. You're conflating *ontology* with *epistemology*. Whether the odds are measurable doesn't change whether they exist. If you reject the randomized bet, you are saying you prefer Red to the Mix. But Red and the Mix have the exact same objective frequency. You are literally paying a premium to avoid a coin flip. You're saying the *source* of the probability has magical properties. That's not rationality; that's fetishism."

  She paused, letting the word hang. "If you can't distinguish between a known risk and a manufactured risk when the frequencies match, you can't make *any* decisions. You've paralyzed yourself. You're claiming that because you don't know the split of black and yellow, you can't act, even when I hand you a mechanism that neutralizes that ignorance. That's not wisdom. It's a refusal to engage with reality."

  Marcus took a sip of wine. He didn't flinch. "Okay. You want an objection you can't deflect? Here it is."

  He pointed at the jar. "Your Bayesian framework forces me to be precise when precision is unwarranted. To satisfy Savage's axioms, I have to assign a subjective probability to Black. Let's say I assign 1/3. Now I have to bet my house on it. If I'm wrong, I'm ruined. Your model treats my guess as if it were knowledge. It punishes me for admitting I don't know."

  "That's not a bug, it's a feature," Elena countered. "You have to pick *something*."

  "Do I?" Marcus leaned in. "In the real world, the rational move when information is missing is often *not to bet*. Or to hedge. But your axioms forbid me from hedging against the model itself. You say my ambiguity aversion is an error because it violates the Sure Thing Principle. But the Sure Thing Principle assumes the world is stable. It assumes that 'Black' means the same thing in every context."

  Marcus tapped the table. "Here is your problem, Elena. Your Bayesianism works beautifully in a 'small world' where all contingencies are listed. But we live in a 'large world.' When you force me to assign a probability to Black, you are forcing me to lie. You are forcing me to pretend I have information I don't have. If I follow your advice, I will be internally consistent, yes. I will be axiomatically pure. But I will be fragile. When the black-and-yellow split turns out to be 60-0 instead of 30-30, I won't just lose a bet. I'll discover that my entire probability distribution was fiction."

  Elena opened her mouth, then closed it. She looked at the jar. "So you're saying consistency is the enemy of robustness."

  "I'm saying consistency is a local optimum," Marcus said. "You can be perfectly consistent and completely wrong. My Maxmin rule accepts that I might be irrational by your lights so that I can survive in a world where the rules might change. I'd rather be vaguely right and solvent than precisely wrong and bankrupt."

  "But," Elena said, her voice quieting, "if you reject the randomized bet, you are guaranteeing a lower expected utility in every possible state of the world where the coin is fair. You are burning money to make a philosophical point. How is that survival?"

  "Because," Marcus said, "the coin might not be fair. Or the urn might be magnetic. Or you might be lying. My ambiguity aversion is a tax I pay for the possibility that the model is broken. You refuse to pay the tax. You assume the model holds."

  "I assume the model holds because without it, 'rational' has no definition," Elena said. "If you reject the reduction of lotteries, you reject the logic of probability itself. You're not doing decision theory anymore. You're doing psychology."

  "And you," Marcus replied, "are doing theology. You're worshipping the axioms."

  They sat in silence for a moment. The jar of chips caught the light from the overhead fixture. The red chips were distinct, countable, safe. The black and yellow chips were a muddled mass at the bottom.

  "So," Elena said finally, picking up her glass. "We aren't arguing about the math."

  "No," Marcus said. "We're arguing about whether the map is allowed to have blank spots."

  Elena nodded slowly. "I say blank spots are just places we haven't filled in yet. You say they're cliffs."

  "Exactly." Marcus raised his glass. "To the cliffs."

  "To the map," Elena corrected, clinking her glass against his.

  They drank, the jar sitting between them, neither of them willing to reach in and pull out a chip.
