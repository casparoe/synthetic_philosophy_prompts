      *   **User's Hypothesis:** Is it rational to keep bidding initially? Does it hinge on *common knowledge of limits*? Or is the payoff structure itself trapping rational agents?
      *   **Goal:** Explain the game theory mechanics of the Dollar Auction (and related war of attrition models) without resorting to behavioral psychology buzzwords. Focus on rationality, Nash equilibria, and information asymmetry.

  2.  **Deconstruct the "Dollar Auction" (Shubik, 1971):**
      *   *Rules:* Auctioneer sells $1. Highest bidder wins $1. *Both* highest and second-highest bidders pay their bids.
      *   *The Trap:* Once bidding starts (say, 90c vs $1), the 90c bidder faces a loss of 90c if they stop, or a loss of 10c if they bid $1.05 (winning $1, paying $1.05). Losing 10c is better than losing 90c. So they bid. Then the other person faces losing $1 vs losing 15c... and so on.
      *   *Rationality:* At *any specific node* in the game tree, continuing can be locally rational to minimize loss, even if globally irrational.
      *   *Ex Ante vs. Ex Post:* Before the game starts, the rational move is *not to play*. Once in, the rational move is often to *continue* until limits are hit.

  3.  **Address the User's Specific Questions:**
      *   *Q1: Isn't raising your bid, at least for a while, the individually rational move?*
          *   **A:** Yes. This is the crux. It's a "local rationality" trap.
      *   *Q2: If spending limits were common knowledge, would a rational player drop out immediately?*
          *   **A:** Yes. This relates to backward induction. If I know your max is \$500 and the prize is \$100, I shouldn't start. If we both know this, no one starts.
      *   *Q3: Is it failure of common knowledge OR payoff structure?*
          *   **A:** It's both, but distinctively. The payoff structure creates the *potential* for the trap (the second-highest payer rule). The lack of common knowledge (or uncertainty about the other's utility function/limits) allows the game to *enter* the trap.

