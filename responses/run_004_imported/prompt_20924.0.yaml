      *   **Local vs. Global Rationality:** This is the key game theory concept.
          *   *Global:* Don't start. Expected value is negative.
          *   *Local:* Given I'm already at bid $X$, bidding $X+\epsilon$ reduces my loss compared to stopping.
          *   *Analogy:* Like a burning building. You don't plan to run into a fire, but once your hand is stuck, you pull harder to avoid the burn.
      *   **Common Knowledge & Backward Induction:** Address the user's specific memory.
          *   If limits are known: Backward induction says "Don't start."
          *   If limits are unknown (Incomplete Information): This is a *War of Attrition*. I bid hoping *you* hit your limit first. This turns it into a poker game about bluffing and endurance.
      *   **Nash Equilibria:** Mention that there are multiple equilibria. One is "Nobody bids." Another is "One person bids max, other folds." The problem is coordination on the wrong one.
      *   **The Legal Context (War of Attrition):** Map the Dollar Auction to the legal fight.
          *   Prize: House Value ($V$).
          *   Cost: Legal Fees ($C_1, C_2$).
          *   Rule: Loser pays their own fees (usually), sometimes loser pays winner's fees (English Rule). In the Dollar Auction, *both* pay. In legal fights, usually both pay their own, which is slightly different but leads to similar escalation if "vindication" has utility.
          *   *Correction:* Actually, in inheritance disputes, it's often "both pay own fees" unless there's a specific clause. But the *sunk cost* feeling mimics the Dollar Auction because the money is gone regardless of outcome.
      *   **Escape Mechanism:** How to get out?
