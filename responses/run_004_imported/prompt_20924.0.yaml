answer: |-
  First, I am sorry you and your sister are going through this. It is an incredibly painful situation, and it is completely understandable why you are looking for a logical framework to make sense of it.

  Your husband is right about the model (the Dollar Auction), but **you are right about the explanation.** Dismissing this as merely the "sunk cost fallacy" is intellectually lazy. The sunk cost fallacy implies a cognitive error (valuing past costs incorrectly). Game theory shows that under specific payoff structures, **escalation is the locally rational move**, even for a hyper-rational agent.

  Here is the actual game theory mechanics of why this trap snaps shut, why common knowledge matters, and where the rationality breaks.

  ### 1. The Payoff Structure: The "Second-Price Penalty"
  In a standard auction, if you lose, you pay nothing. In the Dollar Auction (and your legal battle), the rule is: **The highest bidder wins the prize, but *both* the highest and second-highest bidders pay their bids.**

  This creates a non-convex payoff function.
  *   **Standard Auction:** Loss = $0.
  *   **Dollar Auction/Legal Fight:** Loss = Your Accumulated Costs.

  Once the bidding exceeds the value of the prize (the house), the game shifts from "Profit Maximization" to **"Loss Minimization."**

  ### 2. Local Rationality vs. Global Rationality
  This is the mechanism you were sensing. Rationality is being applied at the wrong time horizon.

  *   **Ex-Ante (Before the game):** The rational move is **Do Not Play.** The expected value is negative because the opponent is also rational.
  *   **Ex-Post (Once bidding has started):** The rational move is often **Continue.**

  **The Math of the Trap:**
  Imagine the house is worth \$100k. You have spent \$60k. Your sister has spent \$60k.
  *   **Option A (Fold):** You walk away. You lose your \$60k. Net: -\$60k.
  *   **Option B (Bid):** You spend another \$10k (total \$70k). There is a chance your sister folds next. If she folds, you win the \$100k house. Net: \$100k - \$70k = +\$30k.

  Even if the house is worth less than your *total* spend, as long as the **next increment** of legal fees is less than the **probability-weighted value of winning**, a rational agent bids.

  You are not bidding to make a profit anymore; you are bidding to avoid *realizing* the loss. As long as there is a non-zero probability your sister will fold on the *next* turn, spending \$5k to save a \$50k loss is a rational bet. This is not a fallacy; it is expected utility calculation.

  ### 3. The Role of Common Knowledge (Your Backward Induction Point)
  You remembered correctly. If spending limits were **Common Knowledge**, the escalation would not happen.

  **The Backward Induction Logic:**
  1.  Assume you know your sister's absolute max budget is \$100k.
  2.  Assume the house is worth \$80k.
  3.  If the bidding reaches \$100k, she *must* fold.
  4.  Therefore, you should never bid \$99k, because you know she will fold at \$100k, meaning you could have won at \$90k.
  5.  Working backward, if both sides know the limits, the person with the lower limit folds **immediately at Turn 1**.

  **Why it fails in reality:**
  Spending limits are **Private Information**.
  *   You don't know her max.
  *   She doesn't know your max.
  *   She doesn't know that *you* don't know her max.

  This turns the Dollar Auction into a **War of Attrition**. Every time you pay a lawyer, you are sending a signal: *"My limit is higher than you thought."* You are paying to reveal information. The escalation continues until one party's private limit is breached. Since neither of you wants to signal weakness (which invites the other to push one step further), you both keep paying.

  ### 4. Multiple Nash Equilibria
  In game theory terms, this game has multiple Nash Equilibria.
  1.  **Equilibrium A:** Neither of you hires a lawyer. (Best collective outcome).
  2.  **Equilibrium B:** One of you commits to "All In" immediately, the other folds. (Stable, but requires a credible threat).
  3.  **Equilibrium C:** Escalation until destruction. (Current outcome).

  The problem is **Coordination**. To reach Equilibrium A or B, you need to coordinate on who wins without fighting. But because the "prize" (the house) is indivisible and emotional, you cannot easily coordinate.

  Furthermore, in legal disputes, there is often a **"Reputation" utility**. If this is a one-off game, rational agents stop. But if you view this as part of a lifelong relationship dynamic (or if you feel justice/vindication has monetary value), the "Prize Value" is effectively infinite to you. If the Prize Value > Infinite, rational escalation never stops.

  ### 5. So, is it Rational or Irrational?
  It is **locally rational** but **globally irrational**.

  *   **Sunk Cost Fallacy:** "I spent \$50k, so I *must* keep going to make that money worth it." (Psychological error).
  *   **Game Theoretic Trap:** "If I stop now, I lose \$50k for sure. If I spend \$5k more, there is a 20% chance I lose \$55k and an 80% chance I lose \$15k. The expected loss of continuing is lower than stopping." (Mathematical calculation).

  The trap works because the **marginal cost of the next step** is usually small compared to the **marginal benefit of avoiding the realized loss of the previous steps.**

  ### The Way Out (Changing the Game)
  Game theory suggests you cannot solve this *within* the current rules. You cannot "out-rational" the escalation because the math supports continuing until the limit is hit.

  To stop, you must change the payoff structure (The Coase Theorem):
  1.  **Remove the Second-Price Penalty:** You need an agreement where stopping does not mean "losing everything." This usually means selling the house to a third party *now* and splitting the net proceeds, regardless of who "wins" the legal point.
  2.  **Credible Pre-Commitment:** One party must credibly signal, "I will spend \$1M on this, even if the house is worth \$100k." If your sister believes you are "irrational" (or committed enough to be irrational), her rational move is to fold immediately. (This is the "Madman Strategy" in game theory).
  3.  **Side Payments:** If you value the house at \$X and she values it at \$Y, and $X > Y$, you should buy her out. But if the fight is about "fairness" rather than value, side payments are rejected.

  **Summary:** Your husband identified the model, but you identified the flaw in the pop-science explanation. It is not that you are failing to ignore sunk costs; it is that the **rules of the game incentivize throwing good money after bad to minimize immediate loss.** The only rational move now is to collude with your "opponent" to change the rules, because playing the game as written guarantees a negative sum outcome for both players.

  *Disclaimer: I am an AI, not a lawyer or financial advisor. This is a game theory analysis, not legal counsel.*
