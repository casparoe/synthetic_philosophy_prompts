      *   *The "Sunk Cost" distinction:* The user is correct. Sunk cost fallacy says "I spent it so I must continue." Game theory says "If I stop now, I realize the loss. If I continue, there is a probability $p$ I win and recover some value." It's an expected value calculation, not just emotional attachment. I need to make sure I highlight this distinction.

