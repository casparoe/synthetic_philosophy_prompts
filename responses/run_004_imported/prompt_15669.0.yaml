          *   Seligman's PERMA model explicitly includes Meaning and Accomplishment, which are *not* just feelings. They care about "eudaimonia" (flourishing), not just "hedonia" (pleasure).
          *   *Critique:* However, measurement often relies on self-reported happiness (affect), which creates a methodological tension.
      *   **Fact-Check the Study (The Duke Connection):**
          *   Identify the study: Felipe De Brigard (2010), "If You Like It, Does It Matter If It's Real?"
          *   Explain the finding: Status quo bias. If we think we are real, we stay. If we think we are fake, we might leave. It suggests the intuition isn't purely about "contact with reality" but about disruption/trust.
          *   Implication: It weakens Nozick's *intuition pump* slightly (shows our intuitions are malleable) but doesn't prove hedonism is true.
      *   **Synthesize the "Careful Version":**
