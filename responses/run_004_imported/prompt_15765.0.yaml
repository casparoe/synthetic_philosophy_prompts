  ### **Total Score: 18/20**

  ### **Point-by-Point Comments for Peer Feedback**

  **1. Definitions of Textualism and Purposivism (Paragraph 1)**
  *   **Strengths:** You correctly identify the core distinction: semantic meaning vs. legislative purpose. The distinction regarding legislative history (illegitimate vs. evidence) is spot-on and shows you've done the reading.
  *   **Critique:** You state that a textualist reads language "as narrowly and literally as the words allow." This is a common misconception that a strict grader might catch. Textualists argue for *ordinary* meaning, which isn't always *narrow*. Sometimes ordinary meaning is broad. In *Holy Trinity*, the text ("any kind") was broad; a textualist would apply that breadth, whereas the Court *narrowed* it via purposivism. You might want to swap "narrowly" for "ordinarily" to be theoretically precise.
  *   **Suggestion:** Clarify that textualism commits a judge to the *scope* of the text, whether that turns out to be narrow or broad, rather than presuming a narrow construction.

  **2. Application to *Holy Trinity* (Paragraph 2)**
  *   **Strengths:** Excellent summary of the Court's reasoning. You correctly identify the specific statutory phrase ("labor or service of any kind") and the specific purposivist evidence used (title, reports, "mischief"). The line "within the letter of a law and still fall outside its spirit" is a perfect encapsulation of Brewer's opinion.
  *   **Critique:** You mention a textualist would reject this "regardless of how sympathetic the result is." To be even more precise, you could acknowledge the "absurdity doctrine." Most textualists admit they won't apply text if it leads to an *absurd* result, but they argue *Holy Trinity* wasn't absurd, just unintended. Distinguishing "unintended" from "absurd" would strengthen the theoretical precision here.
  *   **Suggestion:** Consider adding a clause acknowledging that textualists allow for "absurdity" exceptions but argue *Holy Trinity* doesn't meet that high bar.

  **3. Application to *Bostock* (Paragraph 3)**
  *   **Strengths:** This is the strongest section. You clearly explain the "awkwardness" (Textualist Method + Liberal Outcome). You correctly identify Gorsuch's reliance on but-for causation and the distinction between "expected application" vs. "semantic meaning." Bringing in Alito's dissent adds good context.
