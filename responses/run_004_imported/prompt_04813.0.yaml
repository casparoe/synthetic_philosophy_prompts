answer: |-
  **Setting:** *The coffee break area of the 12th International Conference on the Biology of Aging. The air smells of roasted beans and stale poster board. Two name badges dangle against suit jackets: **DR. ARIS THORNE** (Department of Philosophy of Science, Zurich) and **DR. ELENA CORVO** (Center for Bioethics & Policy, Boston).*

  **Thorne:** (Stirring sugar into an espresso) Did you sit through the keynote on ICD-11 coding? They're still hedging. "Senility" gets a code, "frailty" gets a code, but "aging" itself remains the elephant in the room. It's frustrating. We have the pathways. We have the *daf-2* mutants living twice as long. We know the mechanism is distinct from the pathology.

  **Corvo:** Distinct, maybe. But is it pathological? That's the question you naturalists keep trying to bypass with a microscope.

  **Thorne:** It's not bypassing, Elena. It's clarifying. If aging is simply the accumulation of molecular damage—cross-links, telomere attrition, mitochondrial dysfunction—then it fits the causal model of disease. We treat hypertension, we treat hyperlipidemia. Why is the root cause exempt?

  **Corvo:** Because hypertension deviates from a norm. Aging *is* the norm. This is where I watch you try to squeeze Boorse through a keyhole. You want to use the Biostatistical Theory (BST). You want to say health is statistically typical function for a species.

  **Thorne:** Precisely. Function is objective. Survival and reproduction are the biological goals. When systems fail to contribute to those goals, that's disease.

  **Corvo:** Ah, but the Reference Class. The fatal flaw. If my reference class is "80-year-old humans," then my cataracts, my arterial stiffness, and my immunosenescence are statistically typical. They are *normal* function for an 80-year-old. By Boorse's original definition, I am perfectly healthy.

  **Thorne:** (Sighs) We've been over this. That's why the reference class has to be anchored to the *design* of the organism, not the current state of the population. We compare the 80-year-old to the species-typical *peak* function. The young adult. If your immune system performs at 40% of the species-typical design capacity, you have a pathology, regardless of how many others your age share it.

  **Corvo:** And there it is. The switcheroo. If you measure everyone against a 25-year-old baseline, then yes, aging is a disease. But you've also just medicalized the entire human race over the age of 30. You haven't "read off" the biology, Aris. You've made a normative choice about which time-slice of the organism counts as the "true" human.

  **Thorne:** It's not normative, it's teleological. The organism is designed by evolution to maintain homeostasis. Aging is the breakdown of that maintenance. It's a failure of the system to do what the system was built to do.

  **Corvo:** Was it? Evolutionary biology suggests aging isn't a breakdown; it's a feature. Antagonistic pleiotropy. Genes that help me reproduce at 20 kill me at 60. That's not a system failure; that's the system working exactly as selected. If I'm a *C. elegans*, and I shift resources from somatic maintenance to reproduction, I die young. If I'm a *daf-2* mutant, I live longer but reproduce less. Which one is the "disease" state? The wild type or the mutant?

  **Thorne:** The wild type dies because of resource allocation constraints that we can now technologically overcome. Just because something is evolutionary "typical" doesn't mean it isn't a physiological deficit. Scurvy is typical in a population without vitamin C, but it's still a dysfunction of collagen synthesis.

  **Corvo:** Scurvy is a specific deficiency. Aging is universal. If you define disease as "any deviation from peak physiological efficiency," then sleep is a disease. We are cognitively impaired and paralyzed for eight hours a night. Growth is a disease; puberty is a hormonal storm of instability. You're expanding the category of "disease" until it loses its utility.

  **Thorne:** Utility is exactly why I want the label! If aging is a disease, insurance covers it. Research funding shifts from "managing decline" to "preventing etiology." If you tell me I have to accept arthritis because it's "statistically typical for my reference class," you're condemning millions to suffering based on a semantic technicality.

  **Corvo:** I'm not condemning them to suffering. I'm saying "disease" is the wrong lever. "Disease" implies a deviation from a natural state that we ought to restore. But what if the "natural state" *is* decline? When you intervene, you aren't restoring health; you're enhancing function beyond the species-typical boundary.

  **Thorne:** So it's enhancement, not therapy? That's a value judgment, not a biological one. If I give you a vaccine, I'm altering your immune response beyond what's "typical" for an unexposed human. Is that enhancement? No, it's prophylaxis. I view geroprotectors as prophylaxis against the pathology of time.

  **Corvo:** But vaccines protect against an external pathogen. Aging is endogenous. It's intrinsic to the system. Here's the pressure point, Aris: Boorse tried to fix the reference class problem by appealing to "species-typical design." But who defines the design? If we successfully treat aging, the "species-typical design" changes. In 200 years, if everyone lives to 150, then dying at 80 becomes the pathology. Your definition of disease is a moving target dependent on our technological success.

  **Thorne:** That just means our capacity to treat disease expands. We redefined plague, we redefined HIV. Why not aging?

  **Corvo:** Because plague is an invader. Aging is the context in which invaders operate. Look, I respect the BST. It tries to keep values out of medicine. But the Reference Class dilemma proves you can't. To choose the "young adult" baseline is to say: *We value peak physical capacity over the natural lifecycle.* That's a value. It's a good value, maybe. I'd take a pill to keep my knees good. But don't tell me you found that value in the nematode's genome.

  **Thorne:** (Pauses, looks at his coffee) I found the mechanism in the genome. The insulin/IGF-1 pathway. I found that reducing signaling extends lifespan. That's a fact.

  **Corvo:** The mechanism is a fact. The claim that extending lifespan is "treating a disease" is a policy.

  **Thorne:** But if I don't make that claim, the FDA won't approve the drug. They need an indication. "Old age" isn't an indication. "Osteoporosis" is. So we treat the symptom, not the cause. It's inefficient. It's intellectually dishonest. Calling aging a disease is the only way to align our medical ontology with biological reality.

  **Corvo:** Or, it's aligning our biological ontology with medical economics. You want the ontology to shift so the money flows.

  **Thorne:** (Laughs sharply) Guilty. But the money flows because the suffering is real. Does the normativist view offer the patient anything other than semantic purity? If I can fix the mitochondria, does it matter if I call it "curing a disease" or "optimizing a lifecycle"?

  **Corvo:** It matters for justice. If aging is a disease, it demands a cure for everyone. If it's a condition of existence, we talk about care, support, and acceptance. If you medicalize aging, you risk making the inability to afford the treatment a matter of life and death in a new, sharper way. "You didn't just get old, John, you failed to treat your condition."

  **Thorne:** We already do that. "You didn't manage your cholesterol, John."

  **Corvo:** True. But aging is unavoidable without the intervention. It shifts the burden of proof. If it's a disease, the default is treatment. If it's life, the default is... living.

  **Thorne:** (Leans in) Here's where I push back. You say "life doing what life does." But life also does cancer. Life also does childhood leukemia. We don't say leukemia is "life doing what life does" just because mutations happen. We say the repair mechanisms failed. Aging is the failure of repair mechanisms. Why is the timeline the only difference?

  **Corvo:** Because leukemia is a deviation from the age-specific reference class. An 8-year-old shouldn't have leukemia. An 80-year-old *should* have cellular senescence. Boorse's age-specific class exists for a reason. It acknowledges that the organism changes phases. You're insisting the organism is one static thing from zygote to corpse.

  **Thorne:** I'm insisting the organism is a homeostatic system that *should* maintain itself, and we now know how to help it do that longer. The "age-specific" norm is just a surrender to entropy.

  **Corvo:** Or it's a recognition that entropy is the tax on complexity. Look, Aris. I think we agree on the biology. We agree on the interventions. We even agree on the goal: less suffering, more vitality.

  **Thorne:** Then what are we fighting about?

  **Corvo:** We're fighting about who gets to draw the line between "healing" and "altering." If you use the young-adult baseline, you turn the human lifecycle into a chronic condition. That changes how we view the elderly. They aren't elders; they are untreated patients.

  **Thorne:** And if I use the age-specific baseline, I turn the elderly into walking graveyards where suffering is "normal." That changes how we fund research. It tells the 20-year-old that their future decay is inevitable, so why bother studying the root cause?

  **Corvo:** (Silence for a moment) So the Reference Class isn't a biological discovery. It's a political choice.

  **Thorne:** It's a strategic one.

  **Corvo:** Then Boorse was wrong. You can't have a value-free theory of disease. The moment you pick your reference class, you've picked your values. Peak performance? Or age-appropriate function?

  **Thorne:** Maybe. But I'd rather pick the value that lets me fix the mitochondria.

  **Corvo:** And I'd rather make sure we understand what we're valuing before we sell it as a cure.

  **Thorne:** (Finishes his espresso) Well. There's a symposium on epigenetic clocks in ten minutes. They're claiming they can measure biological age distinct from chronological age.

  **Corvo:** Ah. A new reference class. "Biological Age."

  **Thorne:** Exactly. It bypasses the problem. If your biological age is 50 but you're 70, you have a deficit.

  **Corvo:** (Smiles wryly) Until we decide that "Biological Age" is just another normative construct based on biomarkers we selected because we prefer the profile of a 50-year-old.

  **Thorne:** Come on. Let's go see how they justify that one.

  **Corvo:** Lead the way. I'll bring the values; you bring the biology.

  **Thorne:** Deal.
