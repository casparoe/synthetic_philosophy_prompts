answer: |-
  Good evening. For those who don't know me, I'm a friend of Nora's from the Philosophy department. I work in Ethics, which is a polite way of saying I spend my days worrying about what we *ought* to do, while Nora and Owen spend theirs arguing about what *exists*.

  Giving this toast is officially more stressful than my qualifying defense. Mostly because I'm walking a metaphysical tightrope. Nora has explicitly instructed me not to say she and Owen are the "same people" who met in that seminar without earning it. And Owen has requested I not refer to him as a mere bundle of temporal parts stapled together by memory.

  So, I have to be careful.

  Nora and Owen met arguing about temporary intrinsics. For the family: they argued about how an object can change its properties—like going from happy to grumpy—without ceasing to be itself. For the department: they spent a semester debating Lewis against Sider in real-time.

  But here is what I know, from the outside. I know that when Owen looks at Nora, he isn't looking at a time-slice. He is looking at her, wholly and completely present. He is an endurantist in love, fully grounded in the *now*.

  And I know that when Nora looks at Owen, she sees a beautiful trajectory. She sees the person he was, the person he is, and the person he is becoming, all as parts of a single, extended whole. She is a perdurantist in love, cherishing the entire worm.

  They are different people than they were in that seminar. They are kinder, they are wiser, and they are infinitely more patient with disagreement. Nora, you have earned the right to say you are not the same person. Owen, you have earned the right to say you are fully yourself.

  They have built a life on a premise that bridges their divide. They stood before an officiant and made a vow about time. They promised "till death do us part."

  Now, that is the one joke I can make safely. Because "till death do us part" is the only temporal boundary condition on which a perdurantist and an endurantist can agree without needing a footnote. It is the one premise that doesn't require a counterfactual analysis.

  For the metaphysicians in the room: It is the termination of the marriage function.
  For the family: It is a promise to spend every single moment they have, however they exist, together.

  So, let's raise a glass. To Nora and Owen. May your love be wholly present in every moment, and may your life together be a beautiful, extended whole. To the happy couple!
