answer: |-
  You have a really strong grasp of the core argument already. You're right: Bentham is arguing that the legal punishment of gay sex isn't based on harm (the Utilitarian standard), but on **disgust masquerading as morality.**

  This text is from his essay *Offences Against One's Self: Paederasty* (written c. 1785, published 1978). It is remarkably modern. Let's break down the logic, unpack your specific sticking points, and then look at how this holds up today.

  ### 1. The Step-by-Step Logic of the Passage

  Bentham is trying to trace the genealogy of a punishment. He asks: *Why do we punish this?*

  1.  **The Origin:** Punishment comes from **Antipathy** (strong dislike/disgust) held by those in power, not from actual damage done to society.
  2.  **The Confusion:** People confuse **Physical Disgust** ("This act looks/smells gross to me") with **Moral Wrong** ("This act is evil").
  3.  **The Projection:** Just because *I* find something physically repulsive doesn't mean *you* are harmed by doing it. (His carrion vs. fresh meat analogy). But people can't handle this distinction. If I hate it, I want you punished for it.
  4.  **The Pretext:** To punish you, I need a excuse. If society gives me a pretext (like religion or "unnatural acts"), my personal disgust becomes law.
  5.  **The Real Motive:** Ultimately, moralists aren't angry because the act causes pain (harm); they are angry because the act produces **pleasure** for you, and they believe pleasure is suspect.

  ---

  ### 2. Unpacking Your Three Sticking Points

  #### A. Why James I, Anabaptists, and Tobacco?
  This is an analogy about **power, pretext, and arbitrariness.**

  Bentham is showing how "antipathy" (dislike) turns into violence only when society allows a **pretext** for it.
  *   **The Anabaptists:** King James I hated them for religious reasons (speculative points). Society at the time accepted that religious heresy was punishable by death. So, his *antipathy* led to **burning them.**
  *   **The Tobacco:** King James I *also* hated tobacco (he wrote *A Counterblaste to Tobacco*). He thought it was disgusting. But there was no legal/religious pretext to execute smokers. So, his *antipathy* led only to **writing an angry book.**

  **The Point:** Bentham is arguing that the punishment for gay sex is like the Anabaptist case, not the Tobacco case. There is no actual harm (like there was no actual harm in smoking tobacco), but because society accepts "sodomy" as a valid category of crime (like heresy), the King's/Magistrate's personal disgust gets to become a death sentence. It proves that the severity of the punishment depends on **social permission to punish**, not on the **severity of the harm.**

  #### B. Who are the "Philosophical Pride" Moralists?
  When Bentham says "Philosophical pride... to say nothing at present of superstition," he is targeting two groups:

  1.  **Ascetic Religious Moralists ("Superstition"):** Christian theologians who viewed the body and flesh as sinful. In this worldview, pleasure is a trap set by the Devil. Virtue is defined by *denial* of pleasure.
  2.  **Stoic/Classical Moralists ("Philosophical Pride"):** Philosophers (like the Stoics or Kantians emerging in his time) who believed reason must conquer passion. They viewed being ruled by pleasure as "weakness" or "animalistic."

  Bentham is calling this "Pride" because these moralists believe they are superior for *not* enjoying certain things. They police others' pleasure to validate their own self-control. It is a status game: *I am morally better than you because I am disgusted by what gives you joy.*

  #### C. "It is not the pain that angers them but the pleasure."
  This is the Utilitarian "checkmate."

  *   **Utilitarian Logic:** An act is bad if it creates **Pain** (suffering, harm, injury). An act is good if it creates **Pleasure** (happiness, satisfaction).
  *   **The Moralists' Logic:** They claim they are banning gay sex to prevent harm (pain).
  *   **Bentham's Observation:** If they actually cared about pain, they would look at the evidence. Does this act hurt the participants? No. Does it hurt society? No.
  *   **The Conclusion:** The only thing happening in the act is **Pleasure**. Therefore, if they are angry, they must be angry about the **Pleasure**.

  He is accusing society of **anti-hedonism**. He's saying: *You claim to be protecting victims, but there are no victims. You are actually just punishing people for enjoying themselves.* You hate that they are happy.

  ---

  ### 3. Does This Theory Hold Up Today?

  Bentham was roughly 200 years ahead of his time. Modern psychology and philosophy largely vindicate him, though we have added nuance.

  #### Where Bentham Was Right (The "Yuck Factor")
  *   **Moral Foundations Theory:** Psychologist Jonathan Haidt identifies **"Purity/Sanctity"** as a distinct foundation of moral intuition. Bentham described this perfectly as "confound[ing] physical impurity with moral." Modern research confirms that when people can't articulate a *harm* caused by a victimless act (like gay sex or incest between consenting adults), they fall back on **disgust**.
  *   **The "Harm Principle":** Bentham's student, John Stuart Mill, formalized Bentham's intuition into the *Harm Principle* (the only reason to power over a citizen is to prevent harm to others). This is the bedrock of modern liberal law.
  *   **Martha Nussbaum:** The contemporary philosopher Martha Nussbaum wrote a book called *Hiding From Humanity: Disgust, Shame, and the Law*. Her thesis is almost identical to Bentham's: she argues that disgust is an unreliable basis for law because it is rooted in a fear of our own animality and is often used to subordinate minorities.

  #### Where Bentham Might Be Missing Nuance
  *   **Disgust is Resistant to Reason:** Bentham writes with the Enlightenment confidence that if you just *explain* the logic ("Hey, it doesn't hurt anyone"), people will stop being disgusted. Modern psychology suggests disgust is visceral and evolutionary; it often bypasses rational centers of the brain. Pointing out the lack of harm doesn't always kill the disgust response.
  *   **Social Cohesion:** Émile Durkheim (a sociologist) would argue that punishing "victimless crimes" serves a function: it reinforces group boundaries. Bentham sees this as irrational prejudice; a sociologist might say it's an irrational but *functional* way for a tribe to say "This is who we are." (Though most modern liberals would side with Bentham that this function isn't worth the human cost).
  *   **Internalized Shame:** Bentham focuses on the *punisher's* psychology. He touches less on the psychological damage done to the *offender* via shame, which modern queer theory explores deeply.

  ### Summary
  You read it perfectly. Bentham is arguing that **moral disgust is just personal taste weaponized by the state.**

  *   **James I** proves that punishment scales with social permission, not actual harm.
  *   **Philosophical Pride** identifies the elitism of denying others pleasure.
  *   **"Not the pain... but the pleasure"** exposes that the law is punishing happiness, not preventing harm.

  It is a stunningly brave piece of writing for 1785. He essentially invented the "Harm Principle" argument for gay rights two centuries before it became mainstream legal theory.
