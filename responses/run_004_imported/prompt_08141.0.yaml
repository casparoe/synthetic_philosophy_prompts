prompt: |-
  In my AP European History class, we recently spent a week on the Marquis de Condorcet as part of a unit on the Enlightenment, and the detail that stuck with me most was not his political activism but a mathematical result our teacher mentioned almost in passing: the Condorcet Jury Theorem, from his 1785 essay applying probability theory to majority decisions. The idea that a group of voters who are each only slightly more likely than not to be correct about some factual question will, if their judgments are independent, reach the right verdict with near certainty as the group grows large enough seems to have been, for Condorcet, just one piece of a larger project of building a genuine "social mathematics" that could ground political decisions in something more rigorous than tradition, rhetoric, or aristocratic privilege. What impressed me further is that he applied this commitment to equality with unusual consistency: he was one of the very few Enlightenment figures to argue seriously for extending full citizenship and the vote to women, and he chaired the constitutional committee that in 1793 produced a draft constitution for France, sometimes called the Girondin constitution, which was quietly set aside once his political allies fell from power.

  Not long after that unit, a friend sent me a link to a blog post about "futarchy," a governance proposal from the economist Robin Hanson, whose slogan for it is roughly "vote on values, but bet on beliefs": an elected body would decide on and periodically update some measurable definition of national welfare, while the choice of which specific policy to adopt in order to raise that measure would be handed over to speculative markets, where anyone willing to risk money could bet on the outcomes of different proposed policies, with whichever policy the market currently prices as most likely to raise expected welfare being the one that actually gets implemented. It struck me as a strange descendant of exactly the kind of probability-driven, anti-rhetorical approach to collective judgment that Condorcet was reaching for, except that it replaces his equally-weighted, independent voters with self-selected traders whose influence over the outcome is proportional to how much money they are willing and able to stake.

  I would like you to reconstruct, as specifically as you can from Condorcet's own arguments rather than from a generic impression of "Enlightenment rationalism," what verdict he would likely have reached about futarchy as a mechanism of governance. Would he have welcomed it as finally realizing, through real institutions and incentives, the kind of mathematically disciplined aggregation of judgment his jury theorem only gestured toward on paper? Or would his own theoretical commitments have generated principled objections to it, for instance about whether traders who can observe and imitate one another's positions still satisfy the independence condition his theorem depends on, or about whether letting wealth determine political influence betrays the same egalitarian instincts that led him to defend women's suffrage and to distrust arguments from mere privilege? I would also be curious whether you think the divide at the center of futarchy, between values settled democratically and beliefs settled by markets, corresponds to anything in Condorcet's own writing about which political questions should be left to specialized judgment and which should be decided by the broader citizenry.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Subject:** Marquis de Condorcet (Enlightenment philosopher/mathematician) vs. Futarchy (Robin Hanson's governance proposal).
      *   **Core Task:** Reconstruct Condorcet's likely verdict on futarchy based *specifically* on his own arguments and theoretical commitments (not just generic Enlightenment tropes).
      *   **Key Tensions to Explore:**
          *   Condorcet's Jury Theorem (CJT) vs. Market Mechanisms (aggregation of judgment).
          *   Independence of voters (CJT requirement) vs. Herding/Correlation in markets.
          *   Egalitarianism (women's suffrage, equal weight) vs. Plutocracy (wealth-weighted voting in markets).
          *   Values vs. Beliefs (Futarchy's split) vs. Condorcet's view on public reason/expertise.
      *   **Tone:** Academic, nuanced, historically grounded, philosophically rigorous.

  2.  **Deconstruct Condorcet's Core Commitments:**
      *   *The Condorcet Jury Theorem (CJT):* Requires (1) Binary choice (true/false), (2) Competence ($p > 0.5$), (3) Independence of votes. Conclusion: Majority rule converges to truth as $n \to \infty$.
      *   *Social Mathematics:* The belief that probability can rationalize politics, reducing error and bias.
      *   *Egalitarianism:* Universal suffrage (including women), one person, one vote. Rejection of privilege/wealth as a basis for authority.
      *   *Progress:* Belief in human perfectibility through reason and education.
      *   *Role of Representation:* He wasn't a pure direct democrat; he favored representative systems but with strict mandates and accountability (Girondin constitution).
      *   *Public Reason:* Decisions should be justifiable to all citizens, not just experts or elites.

  3.  **Deconstruct Futarchy (Hanson):**
      *   *Mechanism:* "Vote on values, bet on beliefs."
      *   *Values:* Democratic determination of a welfare metric (e.g., GDP, happiness index).
      *   *Beliefs:* Prediction markets decide *which policy* achieves that metric.
      *   *Weighting:* Influence in the market is proportional to capital (wealth).
      *   *Goal:* Efficient aggregation of information to maximize the metric.

  4.  **Synthesize/Compare (The "Verdict"):**

      *   *Point 1: Aggregation of Judgment (CJT vs. Markets).*
          *   *Similarity:* Both seek to aggregate dispersed information to find the "truth" (or best outcome). Both distrust rhetoric.
          *   *Difference:* CJT relies on *independence*. Markets often suffer from *herding* (information cascades). If traders watch each other, independence fails, and the "wisdom of crowds" collapses into mob mentality. Condorcet was mathematically precise about independence; he would likely spot this flaw.
          *   *Competence:* CJT assumes $p > 0.5$. Markets assume informed traders drive out noise traders. Condorcet worried about voter ignorance but believed education could fix it. He might doubt whether profit motive ensures *truth* or just *profit* (which might involve manipulation).

      *   *Point 2: Equality and Weighting (One Person, One Vote vs. One Dollar, One Vote).*
          *   *Condorcet:* Vehemently opposed to wealth-based privilege. Argued for women's suffrage based on natural rights and equal capacity for reason.
          *   *Futarchy:* Wealth determines influence.
          *   *Verdict:* This is the biggest dealbreaker. Condorcet would see this as a return to aristocracy/oligarchy. It violates the moral foundation of his social mathematics.

      *   *Point 3: Values vs. Beliefs.*
          *   *Futarchy:* Separates ends (democratic) from means (market).
          *   *Condorcet:* Did he separate them? He believed in natural rights (values) but also that reason could determine the best means. However, he distinguished between *rights* (inviolable) and *administrative decisions* (technical).
          *   *Nuance:* Condorcet might appreciate the attempt to isolate factual claims (will Policy X raise GDP?) from normative ones (do we want higher GDP?). *However*, he believed political decisions must be *publicly justifiable*. A market price is not a public reason. It's an opaque signal. Citizens need to understand *why* a law is passed. Futarchy creates a "black box" governance.

      *   *Point 4: Education and Perfectibility.*
          *   Condorcet believed in *improving* the voter through education so they *become* competent ($p$ increases).
          *   Futarchy takes voters/traders as they are and incentivizes them.
          *   Condorcet would likely argue that relying on markets bypasses the civic duty of becoming informed. It depoliticizes the citizenry.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. Validate the connection between CJT and Futarchy (both epistemic democracies). State the thesis: Condorcet would recognize the *aim* but reject the *mechanism* on both mathematical (independence) and moral (equality) grounds.
      *   *Section 1: The Mathematical Objection (Independence).* Focus on the 1785 Essay. Explain why market correlation violates the theorem. Mention "information cascades."
      *   *Section 2: The Moral Objection (Equality).* Focus on *Sur le droit des femmes* (1790) and the 1793 Constitution. Wealth-weighted voting is aristocratic. It violates the "equal capacity for reason."
      *   *Section 3: Public Reason vs. Opaque Prices.* Condorcet wanted decisions justified by reason accessible to all. Market prices are not reasons. This undermines the educational function of politics.
      *   *Section 4: Values vs. Beliefs.* Acknowledge where they align (facts vs. rights), but note Condorcet's belief that means/ends are often intertwined in public deliberation.
      *   *Conclusion:* Summarize. Futarchy is a technocratic oligarchy; Condorcet wanted a rational republic.

  6.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Check:* Did I rely too much on generic Enlightenment ideas? *Correction:* Ensure I cite specific Condorcet concepts (e.g., "social mathematics," the specific conditions of the Jury Theorem, his 1790 essay on women).
      *   *Check:* Did I address the "Values vs. Beliefs" split? *Correction:* Make sure to discuss whether Condorcet thought "beliefs" about policy could be separated from "values." He thought reason could determine the *general will* which encompasses both.
      *   *Check:* Is the tone appropriate? *Correction:* Keep it analytical and respectful of both thinkers, but firm on Condorcet's likely critique.

  7.  **Final Review against Prompt Requirements:**
      *   Reconstruct verdict from Condorcet's arguments? Yes.
      *   Address independence condition? Yes.
      *   Address wealth/egalitarianism? Yes.
      *   Address values/beliefs divide? Yes.

  8.  *(Final Polish)*: Ensure the distinction between "epistemic" (truth-tracking) and "procedural" (fairness) is clear, as Condorcet cared about both. Futarchy is epistemic but procedurally unequal. Condorcet requires both.

  **(Self-Correction Note during drafting):** I need to be careful not to paint Condorcet as a naive optimist. He knew voters could be ignorant. That's why he emphasized education and sometimes representative filters. But he never surrendered the *weight* of the vote to wealth. I must emphasize that distinction. Also, the "independence" clause in CJT is crucial—markets are inherently interactive, which violates independence. This is a strong technical objection Condorcet would make.

  9.  **Final Output Generation** (Proceed to write the response based on these structured thoughts).
answer: |-
  This is a remarkably sharp connection to draw. You have identified a genuine intellectual lineage: both Condorcet and Robin Hanson are engaged in the project of *epistemic democracy*—the attempt to design institutions that track truth or optimal outcomes rather than merely aggregating raw preferences or enforcing tradition. Both share a distrust of rhetoric and a belief that mathematical or statistical structures can rescue politics from human bias.

  However, if we reconstruct Condorcet's verdict based on the specific architecture of his *Essai sur l'application de l'analyse à la probabilité des décisions rendues à la pluralité des voix* (1785) and his political writings (particularly *Sur l'admission des femmes au droit de cité* and the 1793 Constitution), it is highly probable that he would reject futarchy. While he would admire its ambition to realize "social mathematics," he would likely view it as a corruption of his theorem's necessary conditions and a betrayal of the moral equality required for legitimate authority.

  Here is a reconstruction of Condorcet's likely critique, organized by his theoretical commitments.

  ### 1. The Mathematical Objection: The Violation of Independence
  Condorcet's Jury Theorem is not a vague endorsement of "crowdsourcing"; it is a precise probabilistic claim with strict prerequisites. For the probability of a correct majority decision to converge to 1 as the group size increases, three conditions must be met:
  1.  **Binary Choice:** There is a correct and an incorrect answer.
  2.  **Competence:** Each voter is more likely than not to be correct ($p > 0.5$).
  3.  **Independence:** Each voter's judgment is statistically independent of the others.

  Condorcet would likely identify futarchy's market mechanism as a systematic violator of the third condition. In a prediction market, traders do not form judgments in isolation; they observe prices, which aggregate the positions of others. This creates **information cascades**. If a trader sees a market price shift, they often infer that other traders possess private information, leading them to update their own position not based on independent evidence, but on the observed behavior of the crowd.

  For Condorcet, this correlation is fatal. In his 1785 *Essay*, he explicitly worries about "corporate spirits" or factions that vote in blocks, noting that if voters are not independent, the group acts not as $N$ individuals but as a smaller number of factions, drastically reducing the probability of a correct verdict. A prediction market is essentially an engine of correlation. Condorcet would argue that futarchy replaces the independent reason of the juror with the herd behavior of the speculator. The market price does not represent the aggregation of $N$ independent probabilities; it represents a feedback loop where influence is contagious. Thus, the mathematical guarantee of the Jury Theorem dissolves.

  ### 2. The Moral Objection: Wealth as a Proxy for Competence
  The most profound divergence lies in the weighting of influence. Condorcet's Jury Theorem assumes a simple majority: one person, one vote. This is not merely a procedural preference for Condorcet; it is grounded in his anthropology of reason.

  In *Sur l'admission des femmes au droit de cité* (1790), Condorcet argues that rights derive from the capacity to form moral ideas and reason about them. Since women possess this capacity equally to men, they must have equal political rights. He explicitly rejects the idea that property ownership or education level should determine the *weight* of a vote, though he did believe in universal public education to ensure the *competence* condition ($p > 0.5$) of his theorem was met.

  Futarchy operates on a "one dollar, one vote" principle regarding beliefs. Influence is proportional to capital at risk. Condorcet would view this as a resurrection of the aristocratic privilege he fought to destroy. To Condorcet, wealth is an accident of fortune, not a marker of superior rational capacity or moral insight. By allowing the wealthy to exert more influence over "beliefs" (policy selection), futarchy effectively grants them a veto power or a steering mechanism over the state.

  Even if one argues that wealthy traders are *more competent* (having more skin in the game), Condorcet would reject the premise that political authority can be purchased. In his *Sketch for a Historical Picture of the Progress of the Human Mind*, he envisions a future where equality is realized through the diffusion of knowledge, not the concentration of capital. Futarchy incentivizes the accumulation of capital to gain political power, which Condorcet would see as structurally corrupting the "social mathematics" by introducing a variable (wealth) that is orthogonal to truth-tracking competence.

  ### 3. Public Reason vs. Opaque Prices
  Condorcet's vision of a republic was not just about getting the right answer; it was about **public justification**. For a decision to be legitimate, citizens must be able to understand the reason for it. This is tied to his belief in human perfectibility: participating in reasoned debate *makes* citizens more rational.

  Futarchy creates a "black box" of governance. If a policy is enacted because the market priced it higher, the *reason* for the policy is hidden in the dispersed, private information of traders. There is no public argument to evaluate, only a price signal to accept.

  Condorcet would argue this undermines the educational function of politics. In his 1793 draft constitution, he proposed mechanisms for public deliberation and strict accountability of representatives. He wanted citizens to engage with the *why* of legislation. Futarchy says, "Do not ask why this policy was chosen; ask only that the market predicts it will work." For Condorcet, this is a form of political alienation. It treats citizens as subjects of a mechanism rather than agents of reason. It solves the problem of error by removing the citizen from the process of judgment, whereas Condorcet wanted to solve error by improving the citizen's capacity to judge.

  ### 4. The Values/Beliefs Divide
  You asked whether the futarchic split (vote on values, bet on beliefs) corresponds to anything in Condorcet's writing. There is a partial parallel, but a critical distinction.

  Condorcet did distinguish between **natural rights** (which are absolute and universal, discoverable by reason) and **positive law** (which is contingent and administrative). He might agree that the definition of "national welfare" (values) should be a matter of democratic consensus, akin to establishing a constitutional framework.

  However, Condorcet would likely reject the idea that "beliefs" about policy means can be fully separated from values and handed to a technocratic or market elite. In his view, the *application* of reason to social problems is a public duty. To outsource the selection of means to a market is to admit that the public is incapable of reasoning about cause and effect. While Condorcet feared an ignorant populace, his solution was **education**, not **outsourcing**.

  Furthermore, Condorcet was acutely aware that "facts" in politics are often laden with values. A market betting on "GDP growth" might select a policy that increases GDP but violates rights or increases inequality. If the "values" metric is incomplete (which it always is), the market will optimize for the metric at the expense of the unmeasured values. Condorcet, with his deep commitment to universal rights, would fear that a quantitative welfare function could not capture the qualitative demands of justice. He would argue that the "beliefs" about how to achieve welfare must remain subject to democratic scrutiny to ensure they do not violate the rights that underpin the welfare metric itself.

  ### The Verdict
  Condorcet would likely view futarchy as a **monstrous hybrid**: it possesses the cold rationality he admired but lacks the moral equality he deemed essential.

  He would acknowledge that Hanson has correctly identified the problem: how to aggregate dispersed information without the corruption of rhetoric. He would agree that probability and incentives matter. But he would conclude that futarchy fails on two counts:
  1.  **Mathematically:** It violates the independence condition of the Jury Theorem through market correlation and herding.
  2.  **Morally:** It replaces the equal weight of reason with the unequal weight of wealth, violating the natural rights of citizens to participate equally in the formation of the general will.

  For Condorcet, the "social mathematics" was not just about efficiency; it was about legitimizing authority through the equal exercise of reason. Futarchy achieves efficiency (perhaps) by sacrificing legitimacy. He would likely argue that a system that treats political judgment as a commodity to be traded rather than a right to be exercised is not a realization of the Enlightenment, but a sophisticated return to the oligarchy the Enlightenment sought to overthrow.

  He would likely propose instead what he actually advocated: a representative democracy with strict mandates, robust public education to raise voter competence ($p$), and transparent deliberation to ensure independence of judgment, trusting that a properly educated and equal citizenry is the only reliable mechanism for truth-tracking governance.
