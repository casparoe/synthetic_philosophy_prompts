        "points_possible": 10,
        "points_awarded": 5,
        "feedback": "Significant errors in the mechanics of interventionism. (1) Proposes a 'double intervention' (changing both M and T) which tests joint causation, not singular. (2) Contradicts self on 'actual state' (Tom actually fired). (3) Fails to model the standard solution (fine-graining the effect variable to 'Time'), merely asserting it in the conclusion."
      }
    ],
    "ta_note": "This is a classic 'knows the buzzwords, doesn't know the math' answer. They understand the motivation for interventionism (Part a) but haven't grasped the formal definition of an intervention variable (Part b). 10/15 is fair: full credit for the problem, partial credit for identifying the right framework, heavy penalty for the methodological error."
  }
  ```

  ### **Summary for your peace of mind:**
  You aren't being too harsh. The student's answer in Part (b) describes a procedure that would invalidate the test for singular causation in any formal causal modeling course (Woodward, Pearl, or Halpern). If you give them full credit on (b), you are endorsing the idea that to test if $A$ causes $C$, you should also turn off $B$. That's a fundamental category error.

  However, their Part (a) is flawless, so failing them or giving them a D would be unfair. A **10/15 (C)** strikes the right balance: it rewards their understanding of the literature's *motivations* while penalizing the misunderstanding of the *technical machinery*.
