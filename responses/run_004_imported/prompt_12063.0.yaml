answer: |-
  This is one of the most profound and unsettling intersections in the history of moral philosophy. To treat Sidgwick's involvement with the Society for Psychical Research (SPR) merely as a Victorian eccentricity is to miss the structural necessity it held for his ethical system. Sidgwick was not a dabbler seeking comfort; he was a rigorous epistemologist seeking a missing premise.

  Here is a reconstruction of why Sidgwick believed empirical evidence was the only valid resolution to the Dualism of Practical Reason, how his resignation from Trinity clarifies this epistemological stance, and why his ultimate failure to find that evidence is philosophically decisive.

  ### 1. The Argument for Empiricism: Why Not Kant?

  To understand why Sidgwick turned to telepathy and survival of death, we must first understand the specific nature of the "Dualism of Practical Reason."

  In *The Methods of Ethics*, Sidgwick argues that both Rational Egoism (it is rational to maximize my own happiness) and Universal Hedonism/Utilitarianism (it is rational to maximize the general happiness) are self-evident axioms of practical reason. However, in a naturalistic world where death is the end, these two axioms frequently conflict. Sacrificing my life for the greater good is utilitarian but egoistically irrational.

  For ethics to be a coherent rational system, these two must harmonize. There must be a "Cosmos of Duty" where what is best for me is ultimately best for the whole. Traditionally, this harmony is guaranteed by a moral governor (God) who ensures that virtue is rewarded and vice punished, potentially in an afterlife.

  **Why a Kantian Postulate was insufficient for Sidgwick:**
  Kant resolves a similar tension by postulating God and Immortality as necessary conditions for the moral law to be intelligible. For Kant, we are justified in believing these things *because* we must act under the moral law. It is a justification based on practical necessity.

  Sidgwick, however, was a methodological naturalist regarding truth claims. His ethics is built on intuitionism and empiricism; he seeks premises that are *true*, not merely *useful*.
  1.  **The Truth Condition:** If the universe is not actually structured to harmonize self-interest and duty (i.e., if there is no God or afterlife), then the conflict is real. A postulate does not change the facts of the universe; it only changes our attitude toward them. For Sidgwick, if the premises of ethics are factually false, the system collapses into "Chaos."
  2.  **The Scientific Ideal:** Sidgwick viewed moral philosophy as a science ("The Methods"). In science, you cannot solve a contradiction in your data by willing a new variable into existence. You must find the variable in the world. If the harmony of interests depends on an afterlife, the afterlife must be a fact, not a hope.
  3.  **The Failure of Natural Theology:** Sidgwick was well aware that traditional metaphysical proofs for God had failed. He needed a proof that met the standards of the emerging scientific age.

  Therefore, psychical research was not a retreat into mysticism; it was an attempt to extend the empirical method into the metaphysical. If survival of death could be established via the same rigorous evidentiary standards used in physics or biology, then the "religious sanction" for morality would move from the realm of *faith* to the realm of *knowledge*. Only knowledge could permanently resolve the Dualism without compromising intellectual integrity.

  ### 2. The 1869 Resignation: The Precedent of Intellectual Conscience

  Sidgwick's resignation of his Trinity fellowship in 1869 is the biographical key that unlocks the philosophical necessity of the SPR.

  At the time, Cambridge fellows were required to subscribe to the Thirty-Nine Articles of the Church of England. Sidgwick resigned not because he was an atheist, but because he could not honestly affirm doctrines he felt were not sufficiently evidenced. He famously stated that he could not continue to "teach what he did not believe."

  **How this bears on the Empirical Route:**
  1.  **Rejection of "Convenient" Truth:** The resignation proves that Sidgwick placed a higher value on evidentiary honesty than on social stability or institutional belonging. A Kantian postulate is, in a sense, a "convenient" truth—it saves morality without requiring proof. Sidgwick had already demonstrated in 1869 that he would not accept convenient truths. He would not sign the Articles for the sake of his career; similarly, he would not accept a Postulate of Immortality for the sake of his ethics.
  2.  **The Demand for Public Evidence:** The Thirty-Nine Articles represented dogmatic authority. Sidgwick's turn to the SPR represented the opposite: public, verifiable, collective investigation. He hoped psychical research could provide a form of religious knowledge that was independent of ecclesiastical authority and grounded in shared experience.
  3.  **Continuity of Project:** The SPR work was the continuation of the 1869 resignation by other means. Having cleared away the dogma he couldn't accept, he spent the next 40 years trying to find the evidence that would allow him to rebuild the foundation he had cleared. He needed to know if the universe was moral, not just act as if it were.

  ### 3. The Late-Life Admissions: Taking the Failure Seriously

  Sidgwick's repeated admissions in his later years (in letters to friends like Frederic Myers and in the later editions of *The Methods*) that the research had yielded no conclusive proof must be taken with the utmost seriousness. They are not merely expressions of disappointment; they are the final philosophical verdict on his system.

  **Why we must take them seriously:**
  1.  **Validation of the Dualism:** By admitting the evidence was insufficient, Sidgwick effectively concedes that the Dualism of Practical Reason remains unresolved. He does not fudge the data to save the theory. This means that, strictly speaking, Sidgwick's ethics ends in agnosticism. He leaves us with the conclusion that reason demands morality, but the universe offers no guarantee that morality is rational.
  2.  **The Tragedy of Rationalism:** Sidgwick's honesty highlights the limits of rationalist ethics. If a mind as rigorous as Sidgwick's cannot find a rational bridge between self-interest and duty without empirical proof of the supernatural, then secular ethics may be inherently unstable. His failure validates the severity of the problem.
  3.  **Integrity over System:** Sidgwick prioritized the integrity of the inquiry over the completeness of the system. In the final edition of *The Methods*, he writes: "I do not see how the belief [in immortality] can be proved... I cannot therefore say that I see my way to a solution." To treat this as a mere biographical footnote is to ignore his final philosophical instruction: that we must not pretend to know what we do not know.

  ### Conclusion: The Argument Reconstructed

  Sidgwick's engagement with psychical research was the logical culmination of his ethical epistemology. He rejected the Kantian postulate because he believed that **moral coherence depends on metaphysical fact.** If the universe does not actually reward virtue, then the rational egoist is right to be selfish, and the "Cosmos of Duty" is an illusion.

  His 1869 resignation established that he would not accept dogma for comfort; his SPR work established that he would not accept hope for evidence. When the evidence failed to materialize, he did not retreat to faith. He left the Dualism standing.

  We should view this not as a failure of Sidgwick's project, but as its most honest feature. He showed that if we demand empirical proof for the harmony of ethics, we may find ourselves in a "Chaos" where reason is divided against itself. His life's work suggests that without a "further premise" that can be empirically verified (which he failed to find), we are left with a morality that is rationally obligatory but potentially irrational to follow. This is the dark, unresolved core of modern secular moral philosophy, and Sidgwick's refusal to hide it is his greatest philosophical legacy.
