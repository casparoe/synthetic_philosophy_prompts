  Hey, I'm working on a longread about places where Buddhist logic and analytic philosophy collide, and I've fallen down the catuskoti rabbit hole. That's Nagarjuna's four-cornered move in the Mulamadhyamakakarika, where a claim gets run through "true," "false," "both," and "neither" to show phenomena are empty of inherent existence. Thing is, every camp of scholars reads whats actually going on there totally differently: Garfield and Priest say Nagarjuna's basically a card-carrying dialetheist and some contradictions are just true, the old Murti-style reading treats it as gesturing past logic at some ineffable absolute, others say its just equivocation between conventional and ultimate truth so classical logic survives fine, and then there's the "no thesis" crowd (following Candrakirti) who say Nagarjuna isn't asserting anything, just using reductio to wreck everyone else's views. I want to rank these camps by how well they actually hold up against Nagarjuna's own arguments, not by how elegant they are to a modern logician. Give me a tiered ranking (S = holds up best) as JSON:

