          *   *Correction/Refinement:* The standard derivation of collapse in Gödel's system comes from Axiom 5 (Necessary Existence is Positive) + S5. If God exists necessarily, and God's nature entails His will, and His will determines reality... actually, the formal derivation is usually: If $\phi$ is true, is it necessary? In Gödel's system, it can be derived that any true property is a positive property (or entailed by one), leading to necessity.
