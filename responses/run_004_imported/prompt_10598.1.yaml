          *   Tone: Professional, persuasive, analytically rigorous but accessible to non-statisticians.

  2.  **Deconstruct the Data:**
      *   **Intro Psych:**
          *   Traditional: 270/300 (90%)
          *   Flipped: 57/60 (95%)
          *   *Flipped wins.*
