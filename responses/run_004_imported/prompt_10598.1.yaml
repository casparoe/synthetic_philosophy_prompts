          *   Traditional: 30/60 (50%)
          *   Flipped: 165/300 (55%)
          *   *Flipped wins.*
      *   **Pooled:**
          *   Traditional: 300/360 (83.3%)
          *   Flipped: 222/360 (61.7%)
          *   *Traditional wins.*
      *   **Why?** The "Traditional" group is heavily weighted toward the easy course (Psych), while the "Flipped" group is heavily weighted toward the hard course (Chem). This is a classic case of Simpson's Paradox driven by unequal group sizes (confounding by course difficulty/enrollment).
      *   **Second Confound:** Instructor grading. Flipped Chem = easy graders. Traditional Chem = hard graders. This suggests the within-Chem advantage for Flipped might be inflated.

  3.  **Determine the Recommendation:**
      *   *Kill it?* No, the disaggregated data suggests it works, and killing it based on pooled data is statistically invalid.
      *   *Expand immediately?* Risky. The instructor confound is real. We don't know if the format works or if it's just the teachers.
      *   *Continue with changes (Controlled Pilot)?* Yes. This addresses the accreditation risk (monitoring rates), the statistical validity (fixing the pooling error), and the causal inference issue (randomizing instructors).
      *   **Decision:** Recommend a **One-Year Controlled Extension** with specific design changes to isolate the format effect from the instructor effect.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
