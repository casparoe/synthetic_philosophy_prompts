prompt: |-
  My younger brother marries in three weeks, and I've been asked to give the best man speech. Purely as a hobbyist reader, I got interested some years ago in Zahavi's handicap principle — the idea that a peacock's tail is a credible signal precisely because it's a costly liability that only a genuinely strong bird could afford to carry, and a weaker bird can't fake it cheaply. I want to build the speech around something my brother actually did: known in our family for being tight-fisted to a fault, he secretly spent months of savings flying her parents and both grandmothers in from overseas for the proposal, completely out of character for him. My instinct is that this is exactly why everyone who heard the story believed him at once — not despite the extravagance but because of it. But I understand the theory says more than "expensive equals sincere": what matters is that faking the gesture would have cost a less committed man even more than it cost him, and that distinction is easy to lose. Several of the guests work in behavioral ecology and will notice if I flatten it into the cruder version, while most of the room has never encountered any of this. Could you write me a five-minute speech that gets the idea right, works for both halves of the room, and still sounds like a toast and not a biology lecture?
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Occasion:** Younger brother's wedding (Best Man speech).
      *   **Time:** Three weeks away (implies urgency but plenty of prep time).
      *   **Core Theme:** Zahavi's Handicap Principle (costly signaling theory).
      *   **Specific Anecdote:** Brother is known for being tight-fisted/stingy. He secretly spent months of savings to fly her parents and grandmothers overseas for the proposal.
      *   **Theoretical Nuance:** It's not just "expensive = sincere." It's that the cost is *differentially* burdensome. A less committed man wouldn't do it because the cost outweighs the benefit *for him*, whereas for the brother, the commitment makes the cost worth it. It's about the *liability* being the proof.
      *   **Audience:** Mixed. Some behavioral ecologists (will spot errors/simplifications), most laypeople (need it to be accessible/funny).
      *   **Tone:** Toast/Speech, not a biology lecture. Needs warmth, humor, and emotional resonance.
      *   **Length:** Five minutes (approx. 750-850 words spoken at a moderate pace).

  2.  **Deconstruct the Handicap Principle for a Wedding Speech:**
      *   *The Trap:* Saying "He spent a lot of money, so he loves her." (Too crude).
      *   *The Truth:* "He is the kind of guy who *doesn't* spend money. For him to spend this much, the value of the prize (her) must be astronomically high."
      *   *The Ecologist Check:* Needs to acknowledge that the signal is credible *because* it is costly relative to the signaler's baseline. The "handicap" is the financial pain relative to his stinginess.
      *   *The Layperson Check:* Needs to avoid jargon like "differential cost" or "fitness indicator" unless immediately explained or joked about.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Standard best man opening. Acknowledge the role, thank guests, establish the bond with the brother.
      *   **The Setup (The Brother's Character):** Establish the "tight-fisted" reputation. This is crucial for the "cost" part of the theory. If he were rich and generous, the gesture wouldn't be a handicap.
      *   **The Anecdote:** The proposal story. Flying the family in.
      *   **The Theory (The Delicate Part):** Weave the Handicap Principle in without naming it explicitly (or naming it lightly). Explain *why* this proves his love. Focus on the *sacrifice*, not the *price tag*.
      *   **Addressing the Ecologists:** A subtle nod/wink to the experts in the room so they know the speaker knows the nuance.
      *   **The Bride:** Shift focus to her. Why is she worth the cost?
      *   **Conclusion:** The toast.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm the best man. My brother is cheap. Like, really cheap. But for the proposal, he flew everyone here. Why? Because of biology. Zahavi says signals must be costly. For a cheap guy, spending money is a huge cost. So it proves he loves her. The ecologists here know what I mean. She is worth it. Cheers.
      *Critique:* Too dry. Too lecture-y. Needs more heart and humor.

  5.  **Drafting - Iteration 2 (Adding Flavor & Nuance):**
      Start with a joke about the open bar (since he's paying? No, don't imply he's paying). Start with his frugality. Use the peacock analogy but keep it brief. Make sure to emphasize that a *different* guy could do this easily, but for *him*, it was hard. That's the key.
      *Refining the Theory:* The prompt says: "faking the gesture would have cost a less committed man even more than it cost him." Actually, the theory says the cost is higher for low-quality signallers. In this context, a "low commitment" man wouldn't pay the price. The price is the filter. I need to make sure I don't say "it cost him a lot so it's true." I need to say "The fact that *he* paid it is what makes it true."

  6.  **Writing the Speech (incorporating the constraints):**

      *   *Opening:* Warm, welcoming.
      *   *The "Stingy" Angle:* Gentle roasting. Coupons, splitting bills.
      *   *The Proposal:* The reveal of the secret trip.
      *   *The "Science" Bit:* This is the tightrope walk. I'll use the peacock analogy but pivot quickly to the *relative* cost. I'll add a line specifically for the ecologists to show I'm not butchering it.
      *   *The Emotional Core:* It's not about the money; it's about what the money represents for *him*.
      *   *The Bride:* She's the catalyst.
      *   *The Toast:* Standard closing.

  7.  **Refining the "Handicap" Explanation:**
      *   *Bad:* "He spent money, which is a handicap."
      *   *Good:* "A peacock's tail is heavy. It makes him easy to eat. Only a strong peacock can survive with it. My brother's wallet is heavy. Only a truly committed man can survive without it."
      *   *Better:* "In biology, a signal is only trusted if it's expensive to fake. For most people, flying family overseas is a nice gesture. For my brother, it was an act of survival-level commitment. That's why we believe it."
      *   *Ecologist Nod:* "For the biologists here, yes, I'm talking about differential costs, but I promise to keep the jargon to a minimum so the rest of you don't fall asleep."

  8.  **Review against Constraints:**
      *   5 minutes? (Word count check: ~750-850 words).
      *   Accurate theory? (Yes, focuses on the *relative* cost/credibility).
      *   Accessible? (Yes, uses peacock analogy simply).
      *   Emotional? (Yes, focuses on love).

  9.  **Final Polish:** Check the rhythm. Ensure the transition from the joke about stinginess to the sincerity of the gesture feels natural and not mean-spirited. Make sure the bride feels central to the value proposition. (Self-Correction: Ensure I don't imply the brother is *too* cheap, just frugal enough for the story to work).

  10. **Final Word Count Check:** A 5-minute speech is roughly 750 words at 150 words per minute. I will aim for that range.

  *(Self-Correction during drafting)*: I need to be careful not to make the brother sound *too* cheap that it insults him on his wedding day. Frame it as "prudent" or "resource-conscious" until the punchline.

  *(Refining the Ecologist Nod)*: Make it a wink. "I know there are a few behavioral ecologists in the room... I promise I'm not reducing love to mere signaling theory, but..."

