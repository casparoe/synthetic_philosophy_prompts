prompt: |-
  So I'm the student rep on my university's Honor Council this term (we're the body that actually hears academic integrity cases, mix of a few students and a few faculty), and we've got a case up on Thursday that's got the whole group kind of stuck. It's messing with my head extra because I'm also in a philosophy of language seminar right now where we just spent two weeks on Kripke's book on Wittgenstein and the rule-following paradox, and now I can't stop seeing it everywhere.

  Here's the case. All the writing-intensive courses at my school share one collaboration policy: students 'may use spelling and grammar-check tools but may not use any tool that generates or substantially rewrites sentences or paragraphs.' A student fed a bunch of her own clunky sentences into an AI writing assistant, told it to 'make this flow better,' and lightly touched up whatever it gave back. She says that's basically souped-up grammar-checking. Her professor says it's obviously substantial rewriting. I went and pulled the dozen or so past cases the Council has decided under that same clause, and none of them are actually like this one -- they're all clearly Grammarly-type stuff on one side or blatant paragraph-generation on the other. So the real problem isn't a factual dispute about what she did; its that nothing about how we've actually applied the rule before seems to settle which side of the line this new case falls on. It's basically the plus/quus thing -- lots of different ways of extending the old rule agree perfectly on every past case and just disagree on this one, and whichever way we rule, it feels less like we're discovering what the policy always meant and more like we're deciding that, right now, for the first time.

  Can you draft the memo I'd send around to the rest of the Council before Thursday? I need it to actually come down on a side for this specific student (not 'needs more discussion'), lay out a concrete rewrite of the policy language with a timeline for getting it approved before next semester's syllabi go out, and take seriously -- rather than dismiss as too abstract for a real disciplinary decision -- the objection that at least three Council members are going to raise: that if nothing in the rule's past use actually settles this case, fairness requires giving the student the benefit of the doubt.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Student Representative on the University Honor Council.
      *   **Audience:** Other Honor Council members (students and faculty).
      *   **Task:** Draft a pre-meeting memo regarding a specific academic integrity case involving AI usage.
      *   **Key Constraints:**
          *   Must take a definitive stance (recommend a verdict for *this* student, not "needs more discussion").
          *   Must propose a concrete policy rewrite with a timeline for approval.
          *   Must address the "Kripke/Wittgenstein rule-following" objection seriously (i.e., the argument that past usage doesn't determine current meaning, so fairness dictates benefit of the doubt).
          *   Tone: Professional, persuasive, thoughtful, acknowledging the philosophical complexity without getting bogged down in jargon.
      *   **Context:** The policy bans tools that "substantially rewrite sentences or paragraphs" but allows "spelling and grammar-check tools." The student used AI to "make this flow better" on clunky sentences. Past cases are binary (Grammarly vs. Full Generation); this is the middle ground.

  2.  **Determine the Stance:**
      *   *Option A: Find Guilty.* Argument: "Flow" implies structural/syntactic changes beyond grammar. It crosses the line into rewriting.
      *   *Option B: Find Not Guilty.* Argument: The rule is ambiguous in this specific context (the "plus/quus" problem). Fairness requires strict construction in favor of the accused when the rule's application is genuinely novel and unsettled.
      *   *Decision:* Option B (Not Guilty) is the stronger fit for the prompt's specific philosophical framing. The prompt explicitly mentions the "benefit of the doubt" objection regarding rule-following. To take that objection seriously *and* recommend a verdict, finding for the student aligns best with the principle of *nulla poena sine lege* (no penalty without law) in an academic context. It also allows the memo to pivot effectively to the need for policy clarification.

  3.  **Address the Philosophical Objection (Kripke/Wittgenstein):**
      *   The prompt mentions the "plus/quus" paradox. I shouldn't use that jargon explicitly in the memo (it might alienate non-philosopher faculty), but I need to capture the *substance* of the argument: Past precedents underdetermine the current case.
      *   *How to frame it:* Acknowledge that the distinction between "grammar" and "rewriting" has never been tested in this specific "middle zone." Therefore, the community's shared understanding of the rule doesn't clearly cover this action.
      *   *Fairness:* If the rule wasn't clear *ex ante*, punishing the student *ex post* is unjust.

  4.  **Drafting the Policy Rewrite:**
      *   Current: "may use spelling and grammar-check tools but may not use any tool that generates or substantially rewrites sentences or paragraphs."
      *   Problem: "Substantially rewrites" and "flow" are subjective.
      *   Solution: Focus on *agency* and *provenance* of ideas/wording.
      *   New Language Idea: Focus on "generative AI" vs. "corrective AI." Or focus on the percentage of tokens changed. Or focus on the *prompt*.
      *   Better Approach: Define the boundary by *input/output ratio* or *semantic alteration*. Let's try: "Tools that correct errors within existing student syntax are permitted. Tools that alter sentence structure, tone, or vocabulary choices beyond error correction are prohibited."
      *   Even Better (more concrete): "Students may use tools that identify errors (spelling, grammar, punctuation). Students may not use tools that suggest or implement changes to sentence structure, style, or word choice."

  5.  **Drafting the Timeline:**
      *   Need approval before next semester's syllabi.
      *   Steps: Council recommendation -> Faculty Senate/Committee review -> Approval -> Dissemination.
      *   Timeline: 4-6 weeks.

  6.  **Structuring the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose (recommendation on Case #X and policy update).
      *   **Case Recommendation:** Not Guilty. Explain why (ambiguity, benefit of the doubt).
      *   **Addressing the Rule-Following Concern:** Acknowledge the precedent gap. Validate the concern that we are setting a new standard, not applying an old one.
      *   **Policy Proposal:** The new language.
      *   **Implementation Plan:** Timeline for approval.
      *   **Closing:** Call to action for Thursday's meeting.

  7.  **Refining the Tone:**
      *   Needs to sound like a student rep who is sharp but respectful.
      *   Avoid saying "As Wittgenstein said..." Instead, say "As some of us have noted regarding the interpretation of precedent..."
      *   Ensure the "Not Guilty" verdict doesn't sound like "AI is okay," but rather "This specific rule didn't cover this specific act clearly enough."

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the policy rewrite specific enough?
      *   *Fix:* Make sure it distinguishes between *correcting* and *styling*.
      *   *Critique:* Did I address the "benefit of the doubt" argument seriously?
      *   *Fix:* Dedicate a specific section to "The Precedent Gap and Fairness." Acknowledge that ruling for the student admits the rule was unclear.
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* Check academic calendars. Syllabi usually go out a month before classes. If this is mid-semester, there's time for next term.

  9.  **Final Polish:** Check against the prompt requirements one last time.
      *   Memo format? Yes.
      *   Come down on a side? Yes (Not Responsible).
      *   Concrete rewrite? Yes.
      *   Timeline? Yes.
      *   Address the philosophical/fairness objection? Yes.

  **(Self-Correction Note on the Philosophical Angle):** The prompt explicitly says the user is thinking about Kripke/Wittgenstein. The memo shouldn't necessarily cite Kripke by name (might seem pretentious in a formal council memo), but it should *embody* that reasoning. However, since the user *wants* to take the objection seriously, I should phrase it in a way that validates the Council members who are thinking this way without requiring the whole council to read *Wittgenstein on Rules and Private Language*. I will frame it as "interpretive indeterminacy."

