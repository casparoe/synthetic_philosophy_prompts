answer: |-
  This is one of the most profound and contentious questions in modern psychiatry, philosophy, and literature. You are asking about the **boundary problem**: Where does normal human suffering end and pathology begin?

  For your book, and for your family, it is helpful to know that **both your aunt and your mom are right.** They are just looking at the same landscape through different lenses.

  Here is a breakdown of the principled lines, the arbitrary ones, and how you might navigate this tension in your writing.

  ### 1. The Case for Your Aunt (The Medical/Functional Model)
  Your aunt feels relief because a diagnosis often provides **validation** and **access**.

  *   **The "Stuck" Mechanism:** Normal grief usually moves in waves. It hurts intensely, but over time, the person regains the ability to find moments of joy, sleep, and function. Prolonged Grief Disorder (PGD), added to the DSM-5-TR in 2022, describes a state where the grief system is "frozen." The brain's attachment system cannot update to the reality that the person is gone. It is less about "sadness" and more about a disruption in the brain's ability to process loss.
  *   **Functional Impairment:** The principled line psychiatry tries to draw is **function**. If grief prevents you from sleeping, eating, working, or maintaining other relationships for an extended period (usually over 12 months), it moves from an emotion to a disability.
  *   **Access to Care:** This is the pragmatic reality. Without a diagnostic code, insurance won't pay for therapy. Without a "disorder," doctors hesitate to prescribe medication that might help with the insomnia or the crushing anxiety that accompanies the grief. The label is a key that unlocks the door to help.

  ### 2. The Case for Your Mom (The Humanistic/Social Model)
  Your mom is offended because she sees the diagnosis as a **reduction** of love.

  *   **Pathologizing Love:** Her argument is that the intensity of the grief is proportional to the intensity of the love. To call it a "disorder" implies there is something *wrong* with the bond, rather than something *deep* about it.
  *   **Cultural Impatience:** We live in a society that wants people to "get back to normal" quickly. Your mom likely fears that the diagnosis is a way of telling your aunt, "You've grieved too long; fix it so you're productive again."
  *   **The Arbitrary Timeline:** Why is grief "normal" at 11 months but a "disorder" at 13 months? That line *is* arbitrary. It is a consensus drawn by committees of psychiatrists, not a blood test. Your mom is right to be skeptical of that specific cutoff.

  ### 3. Is the Line Real or Made Up?
  The answer is: **It is a real distinction drawn on an arbitrary map.**

  *   **The Reality:** The suffering is real. The insomnia, the isolation, and the daily crying are physiological and psychological realities that are damaging your aunt's health. That isn't "made up."
  *   **The Map:** The *category* is a social construct. Psychiatry creates categories to help clinicians communicate and to satisfy insurance requirements.
  *   **The Danger:** The risk your mom sees is **medicalization.** If we label too much of life as "disordered," we lose the capacity to endure hardship. We start looking for a pill to fix a broken heart, rather than sitting with the pain until it changes shape.
  *   **The Benefit:** The benefit your aunt feels is **legitimization.** For years, she may have been told to "snap out of it" or "he's in a better place." The diagnosis says, "No, this is a specific injury, and it requires treatment."

  ### 4. How to Write This Conflict
  For your character, you don't need to decide who is right. The tension *is* the story. Here are a few angles to consider:

  *   **The Relief of Surrender:** Show how the diagnosis allows your character to stop fighting the grief. Sometimes, admitting "I am sick" is easier than "I am sad." One implies a cure; the other implies a permanent state of being.
  *   **The Conflict of Identity:** If the grief is a "disorder," can it be cured? If it's cured, does that mean she loves her husband less? Your character might fear that treatment will erase the memory of the deceased.
  *   **The System vs. The Soul:** You can contrast the clinical language of the therapist (symptoms, metrics, timelines) with the raw, messy reality of the grief (smelling his shirt, talking to the empty room). Both are true, but they speak different languages.
  *   **The "Third Way":** Many experts argue that PGD isn't about *stopping* grief, but about **integrating** it. Treatment isn't about "getting over it"; it's about learning how to carry the loss without collapsing under it. This might bridge the gap between your aunt's need for help and your mom's desire to honor the love.

  ### Summary
  There is a principled line based on **suffering and impairment**, but the specific boundaries are indeed influenced by culture, economics, and medical consensus.

  Your aunt is right that she is suffering in a way that time alone hasn't fixed. Your mom is right that labeling it risks diminishing the sanctity of that love. In your book, the truth likely lies in the space between: **The grief is a testament to love, but the inability to function is a wound that needs healing.**

  *Disclaimer: I am an AI, not a doctor. This information is for educational and creative purposes and should not be taken as medical advice for your aunt.*
