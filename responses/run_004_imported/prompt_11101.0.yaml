      *   *Key Arguments:*
          1.  **The Nature of the Party:** A party is a machine that generates collective passion. Its primary law is self-preservation and growth, not truth or public good.
          2.  **The Effect on Thought:** Membership requires mental abdication. One adopts the party's stance without examining it. It creates "pressure" on the mind.
