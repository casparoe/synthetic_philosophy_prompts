      *   *Is GR deterministic?* Yes, in the sense of well-posed initial value formulation (Choquet-Bruhat). The Hole Argument threatens *this* specific notion of determinism only if you are a naive substantivalist.
      *   *Did Einstein accept this?* Einstein used the Hole Argument to motivate General Covariance, then abandoned it, then came back to it. Earman/Norton revived it to attack substantivalism.
