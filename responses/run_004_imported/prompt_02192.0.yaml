answer: |-
  First off, welcome to the club. There is a specific kind of headache reserved for people who try to read the *Summa* in translation while their brain is still primed by modern analytic philosophy. You have spotted two genuine structural tensions in the text that many commentators gloss over.

  You are right to feel that there are two distinct moves happening here, and you are also right that the modern "four conditions" of the Doctrine of Double Effect (DDE) are doing more heavy lifting than Aquinas explicitly does in this specific article.

  Here is the breakdown of the two wrangles you've identified.

  ### 1. The Two Arguments: Private DDE vs. Public Authority

  You asked if the second half of the paragraph (about public authority) is just a restatement or a genuinely different piece of argumentative work. It is the latter. Aquinas is carving out two distinct **moral jurisdictions** for killing, and he needs both clauses to make the system work.

  **Argument A (The DDE Move):**
  *"Nothing hinders one act from having two effects... moral acts take their species according to what is intended..."*
  This establishes that a private citizen *can* cause death without it being murder, provided the death is *praeter intentionem* (beside the intention). This is the "self-defense" exception. It allows you to swing a fist to stop an attacker, foreseeing that they might hit their head and die, without you being morally culpable for the death.

  **Argument B (The Public Authority Move):**
  *"But as it is unlawful to take a man's life, except for the public authority..."*
  This establishes that a private citizen *cannot* intend death, even for a good reason. Only the state (acting for the common good) can intend death as a means or an end (e.g., execution, just war).

  **Why both?**
  If Aquinas only gave you Argument A, you might conclude that private citizens can never kill, period (because killing is always bad). If he only gave you Argument B, you might conclude that private citizens *could* intend to kill attackers if they framed it as "protecting the neighborhood" (vigilantism).

  He needs Argument A to allow private self-preservation (which is a natural law duty). He needs Argument B to prevent private vengeance.

  **The Connection to Article 3:**
  You suspected this relies on Article 3, and you are correct. In Article 3, Aquinas argues that killing is generally unlawful because it violates the love of neighbor and usurps God's authority over life and death. The exception in Article 3 is **Public Authority** (acting for the common good).
  In Article 7, he is addressing a loophole: *What if I'm not the state, but someone is trying to kill me right now?*
  His solution is: You still cannot usurp the state's authority to *intend* death (Argument B). However, you are allowed to perform an act of self-preservation where death is a foreseen but unintended side effect (Argument A).

  So, the structure is:
  1.  **General Rule (Art 3):** Killing is wrong unless done by Public Authority intending the common good.
  2.  **Specific Exception (Art 7):** Private citizens may cause death *unintentionally* if the act is proportionate self-defense.

  If you miss this distinction, you end up confused about why a soldier *can* intend to shoot an enemy combatant (Public Authority/Common Good) but a civilian *cannot* intend to shoot a home invader (Private/Self-Preservation only), even though the physical act is identical. For Aquinas, the moral "species" of the act changes based on the agent's authority and intention.

  ### 2. The Missing "Means vs. Side-Effect" Condition

  This is the sharper philosophical catch. You are absolutely correct: **Aquinas does not explicitly state the "means" condition here.**

  The modern DDE (as codified by philosophers like Philippa Foot and later used in the Trolley Problem literature) usually has four conditions:
  1.  The act itself must be good or neutral.
  2.  The agent must intend only the good effect.
  3.  **The good effect must not be produced by means of the bad effect.**
  4.  There must be a proportionate reason for allowing the bad effect.

  In Article 7, Aquinas explicitly covers #2 (intention), #4 (proportionality: *"if it be out of proportion to the end"*), and implicitly #1 (the act of self-defense is natural). But #3 is absent.

  **Is it hiding in the text?**
  It is hiding in his **psychology of action**, not in the explicit conditions.
  For Aquinas, the will intends the end *and* the means to the end. If the bad effect is the *means* to the good effect, then by definition, the bad effect is **intended**.
  *   **Switch Case (Modern DDE view):** The death is a side effect of diverting the trolley. (Permissible).
  *   **Footbridge Case (Modern DDE view):** The death is the *means* by which the trolley is stopped. (Impermissible).

  For Aquinas, he wouldn't necessarily distinguish "means" from "intended" as separate conditions. He would simply say: *"In the footbridge case, you are pushing the man **in order to** stop the trolley. Therefore, you intend his death (or at least the violence against him). Therefore, it fails Condition #2."*

  **The Anachronism:**
  The separation of "intention" and "means" into distinct conditions is largely a later Scholastic development (often attributed to Cardinal Cajetan in the 16th century) and was further refined by modern analytic philosophy to handle edge cases Aquinas never imagined (like trolleys).

  Aquinas's framework is robust enough to *yield* the same result as the modern DDE (he would forbid the footbridge shove), but his reasoning is slightly different. He focuses on the **orientation of the will**. If the bad thing is necessary for your plan to work, your will is hooked to it. If your will is hooked to it, you intend it. If you intend it, and you are a private citizen, it is unlawful.

  **Does modern DDE do more work?**
  Yes. By separating "means" from "intention," modern DDE allows for more granular analysis of causal chains that Aquinas's broader "intention" bucket might miss. For example, there are modern thought experiments where an agent might "intend" a means without "intending" the bad properties of that means. Aquinas would likely find that distinction nonsensical; if you choose the means, you choose the package.

  ### Summary

  You haven't missed anything; you've just noticed the gap between **Thomistic Moral Theology** and **Neo-Scholastic Analytic Ethics**.

  1.  **On the Two Arguments:** They are distinct. One licenses private self-defense via unintended effects (DDE); the other reserves intended killing for the State (Public Authority). They work together to prevent vigilantism while allowing self-preservation.
  2.  **On the Means Condition:** It is not explicitly in the text. It is implicit in Aquinas's definition of intention (to intend an end is to intend the means), but the explicit formulation as a separate condition is a later addition.

  The "Doctrine of Double Effect" invoked in LessWrong/EA trolley threads is effectively a **neo-scholastic reconstruction**. It uses Aquinas's bricks but follows a blueprint drawn up 600 years later. When people cite Aquinas as the authority for the specific "means vs. side-effect" distinction in the Footbridge case, they are engaging in a bit of rationalist folklore. Aquinas gives you the *engine* (intention vs. foresight), but the later tradition built the *transmission* (means vs. ends) that makes the car drive the way modern ethicists want it to.

  You went down the rabbit hole and found out the white rabbit was actually wearing a later century's waistcoat. That's about as on-brand as it gets.
