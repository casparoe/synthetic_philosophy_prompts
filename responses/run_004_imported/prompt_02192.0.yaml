prompt: |-
  Ok so I fell down a bit of a rabbit hole this week, very on-brand for someone who's read way too much LessWrong/ACX over the years. There was yet another trolley-problem subthread going around (the eternal "why is flipping the switch fine but shoving the guy off the footbridge not fine" argument, this time on the EA forum), and someone in the comments mentioned, kind of offhand, that the whole doctrine of double effect everybody cites actually traces back to one specific article in Aquinas, and that basically nobody arguing about it online has actually gone and read it. So obviously I had to go read it. It's the old public-domain Dominican Fathers translation, since that's the version that's floating around everywhere, and scholastic prose from the 1270s is... not exactly optimized for skimming. I think I mostly get it, but there's a specific wrinkle in the argument I can't untangle on my own, and I'd like a second pair of eyes.

  Here's the actual passage (Summa Theologica, II-II, Q.64, Art.7, "Whether it is lawful to kill a man in self-defense?" -- I'm cutting the five objections and the sed contra for length and just giving you the "I answer that" and the reply to the first objection):

  "I answer that, Nothing hinders one act from having two effects, only one of which is intended, while the other is beside the intention. Now moral acts take their species according to what is intended, and not according to what is beside the intention, since this is accidental. Accordingly the act of self-defense may have two effects, one is the saving of one's life, the other is the slaying of the aggressor. Therefore this act, since one's intention is to save one's own life, is not unlawful, seeing that it is natural to everything to keep itself in 'being,' as far as possible. And yet, though proceeding from a good intention, an act may be rendered unlawful, if it be out of proportion to the end. Wherefore if a man, in self-defense, uses more than necessary violence, it will be unlawful: whereas if he repel force with moderation his defense will be lawful, because according to the jurists, it is lawful to repel force by force, provided one does not exceed the limits of a blameless defense. Nor is it necessary for salvation that a man omit the act of moderate self-defense in order to avoid killing the other man, since one is bound to take more care of one's own life than of another's. But as it is unlawful to take a man's life, except for the public authority acting for the common good, as stated above (Article 3), it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority, who, while intending to kill a man in self-defense, refer this to the public good, as in the case of a soldier fighting against the foe, and in the minister of the judge struggling with robbers, although even these sin if they be moved by private animosity.

  Reply to Objection 1. The words quoted from Augustine refer to the case when one man intends to kill another to save himself from death. The passage quoted in the Second Objection is to be understood in the same sense. Hence he says pointedly, 'for the sake of these things,' whereby he indicates the intention."

  Two things are bugging me and I think they're actually related. First: it seems like there's two different arguments stacked on top of each other in that "I answer that" paragraph, and I honestly can't tell if Aquinas thinks they're the same argument or not. Argument A is the twofold-effect move itself: death is beside the intention, moral acts get their "species" from what's intended rather than what's accidental, so proportionate self-defense is fine, period. That alone seems like it should fully license a private citizen killing an attacker regardless of whether they "intend" the death, so long as it's proportionate. But then there's this seperate-looking move where only public authorities are allowed to actually intend to kill, even in a defensive context, which is a way stronger and narrower restriction than "just keep it proportionate." Is that second half just restating the first in different words, or is he doing two genuinely different pieces of argumentative work in one article, where the second part only makes sense once you bring in whatever's in Article 3 about public authority and punishment? Second, and I think this is the bigger one: this article is always cited as the historical origin of the modern doctrine of double effect, which nowadays usually gets stated as four conditions, and the condition doing most of the work in distinguishing the switch case from the footbridge case is the one about the bad effect not being allowed to be the *means* to the good effect (in the footbridge case you're using the guy's body as the thing that physically stops the trolley, not just foreseeing his death as a side effect). But I don't see Aquinas saying anything here about means versus side-effects, just intended versus beside-the-intention plus proportionality. So: am I missing where the "not as a means" idea is hiding in this text, or is that condition a later addition that's been retroactively read back into Aquinas -- and if it's the latter, does that mean the "doctrine of double effect" that gets invoked constantly in trolley-problem arguments is honestly doing more philosophical work than this original text can support?
