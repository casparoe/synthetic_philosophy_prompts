      *   **The Asymmetry:** Lewis's proof assumes the conditional expresses a proposition (has a truth value). Adams denies this. Therefore, the proof doesn't apply to Adams. It applies directly to Stalnaker.

  3.  **Drafting Section 1: Adams vs. Stalnaker (The Theses):**
      *   *Adams:* Focus on *The Logic of Conditionals* (1975). Key concept: Uncertainty ($U = 1-P$). Validity is preservation of high probability, not truth. Conditionals lack truth values. They are "inference tickets" (Ryle) or expressions of conditional belief. Scope restriction: No nesting, no Boolean compounds.
