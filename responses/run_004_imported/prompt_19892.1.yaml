  2.  **Deconstruct the Core Philosophical Issues:**
      *   **Adams's Thesis (AT):** $P(\text{If } A, C) = P(C|A)$. Crucially, Adams treats this as a thesis about *assertability* or *acceptability*, not truth conditions. Conditionals don't express propositions (they aren't truth-apt in the standard sense). Restricted to unembedded conditionals.
      *   **Stalnaker's Thesis (ST):** Conditionals *do* express propositions (they have truth conditions based on selection functions). Stalnaker *also* wants $P(\text{If } A, C) = P(C|A)$ to hold for these propositions.
