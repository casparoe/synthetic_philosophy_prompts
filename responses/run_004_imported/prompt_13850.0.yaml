answer: |-
  It is excellent that you are engaging with Goodin this way; his argument is intentionally provocative and designed to feel like a "clean sweep" of the boundary problem. Your intuition that the All-Affected Interests Principle (AAIP) offers a determinate answer is exactly what Goodin wants you to feel. He argues that by shifting from *status* (citizenship) to *fact* (effects), we solve the arbitrariness of borders.

  However, the reason theorists like Sofia Näsström (and others such as Frederick Whelan or Ludvig Beckman) continue to treat the boundary problem as unresolved is not merely a reluctance to accept the radical practical consequences of Goodin's view. Rather, they argue that the AAIP fails to solve the problem **conceptually**.

  Here are the three main gaps in the principle that keep the debate alive, which should help clarify why Näsström and others remain unsatisfied.

  ### 1. The Problem of Indeterminacy (The "Causal Chain" Objection)
  Your climate example is the strongest case for Goodin: the effects are global and obvious. But the AAIP struggles to provide a *determinate* boundary in less extreme cases because "affectedness" is a matter of degree and causal distance.

  *   **The Threshold Question:** Almost every political decision has ripple effects. If a town votes to build a new park, property values might rise, displacing low-income residents who move to a neighboring town, affecting school enrollment there, which affects tax revenue there. Are the residents of the neighboring town "affected"? If yes, the *demos* expands. If no, who decides where the causal chain stops?
  *   **The Circularity:** To decide which effects count as significant enough to grant enfranchisement, you need a rule. But who makes that rule? A *demos*. But we are trying to define the *demos* in the first place.
  *   **Näsström's Point:** Näsström argues that the AAIP attempts to stand outside of politics to define politics. She suggests that "interests" are not pre-political facts waiting to be discovered; they are constituted *through* political processes. You cannot count the interests before you have a polity to define what counts as a relevant interest. Therefore, the AAIP presupposes the very boundary it claims to establish.

  ### 2. The Problem of Institutionalization (The "Demos" vs. "Stakeholders" Distinction)
  Even if we accept Goodin's moral claim that everyone affected *should* have a say, there is a gap between having an interest and being a member of the *demos*.

  *   **The "Everything is Connected" Problem:** If we take the AAIP literally for significant issues (like climate, trade, or war), the *demos* becomes "everyone." But democracy requires a stable body of people who make decisions over time, not just a fluid gathering of stakeholders for a single vote.
  *   **The Temporal Problem:** As you noted, future generations are affected. But they cannot vote. If the AAIP says they are part of the *demos*, but they cannot participate, the principle breaks down practically. If we say they are represented by proxies, who appoints the proxies? Again, we need a prior *demos* to appoint them.
  *   **Näsström's Critique:** Näsström specifically worries that the AAIP dissolves democracy into a form of utilitarianism. If the goal is simply to maximize the satisfaction of affected interests, we might not need democracy at all; we might just need benevolent technocrats calculating the effects. Democracy, she argues, is about the *people* ruling themselves, which requires a "We" that exists prior to the calculation of interests.

  ### 3. The "All-Subjected" Counter-Principle
  Part of why the boundary problem remains a puzzle is that the AAIP competes with another compelling principle: the **All-Subjected Principle** (or All-Coerced Principle).

  *   **The Argument:** This principle suggests that anyone subject to the *coercive enforcement* of a law should be in the *demos*, regardless of whether their "interests" are affected in a substantive way.
  *   **The Conflict:** Consider a foreigner who is not a citizen. A country's tax law might "affect" them indirectly (via global markets), but it does not "coerce" them (they don't have to pay). The AAIP might include them; the All-Subjected Principle would not. Conversely, a resident alien is coerced by the laws but might be excluded from voting under current regimes.
  *   **Why it matters:** Because both principles (Affected vs. Subjected) yield different boundaries, and both have moral weight, the boundary problem remains theoretically unresolved. We haven't agreed on *which* moral criterion determines the boundary.

  ### Is it just practical reluctance?
  You asked if the disagreement is "really just about whether theorists are willing to accept its practical consequences."

  The answer is **no**. While it is true that few theorists want to advocate for a global plebiscite on every issue, the deeper objection is that the AAIP does not actually provide a **criterion** that can function without prior political decisions.

  If the AAIP requires us to know the *scope of the effects* before we can define the *voters*, but the *effects* depend on *which policy options are on the table* (which is decided by the voters), we are stuck in a loop. Goodin tries to cut the loop by saying "look at the facts of the world," but critics like Näsström reply that the "facts of the world" are politically interpreted.

  ### Summary for your debate
  To synthesize this for your coffee debates:
  1.  **Goodin** treats the *demos* as fluid and issue-specific (a "demoi-cracy").
  2.  **Näsström** argues that democracy requires a stable "People" that cannot be constantly reconstituted by causal effects.
  3.  **The Gap:** The AAIP cannot tell us *how much* affectedness is required to vote without begging the question (requiring a prior decision by some group).

  The boundary problem remains a puzzle not because we lack a moral compass (AAIP is morally strong), but because the principle cannot mechanically generate a boundary without relying on prior political judgments about what counts as a relevant effect.
