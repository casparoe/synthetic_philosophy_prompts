answer: |-
  To say "actual" is to point a finger. That was the first thing Julian taught his undergraduates every September. *Actual* is not a special metaphysical status. It is an indexical, like *here* or *now*. When you say "this world is real," you are saying nothing more than "this world is where I am standing." To a counterpart in a neighboring possibility, you are the ghost. You are the mere fiction.

  Julian stood at the kitchen sink, scrubbing a plate that was already clean. The water was hot, stinging his fingertips. This pain was actual. The steam rising from the ceramic was actual.

  Outside, the rain fell on the driveway where Elena had slipped three months ago. She had fallen, struck her head, and never woke up. In this world.

  Julian turned off the tap. The silence of the house rushed in. He knew, with the cold certainty of a man who had spent his life studying David Lewis, that there was a world where Elena did not slip. There was a world where she slipped but wore a helmet. There was a world where the ambulance arrived thirty seconds sooner. There was a world where Julian had held her hand and caught her.

  The Principle of Plenitude stated that every way a world could possibly be, is a way some world actually is. The pluriverse was vast, teeming with concrete realities just as solid as this one. In the majority of worlds, Elena was alive. She was eating dinner. She was laughing. She was aging.

  So why did this room feel so empty?

  This was the nagging wound Lewis's philosophy had left in him. If every tragedy is counterbalanced by a triumph elsewhere, does the tragedy lose its sting? If there is a version of me who is a saint, does it matter that I am a sinner here?

  Julian walked into the living room and sat in the armchair. He picked up the framed photo from the side table. Elena squinting in the sun. He knew that photo existed in other worlds, too. But in those worlds, the man holding the camera was not him. He was a counterpart. Similar, yes. Shared origins, shared memories up to a divergence point. But distinct. Spacetime isolated. No causal bridge could ever span the gap between Julian-Here and Julian-There.

  He couldn't ask that other Julian how he did it. He couldn't borrow the happiness from the world where Elena survived. Those worlds were hermetically sealed. They were infinite islands in a dark ocean, visible only to the mind, never to the hand.

  The moral vertigo hit him then, as it did every Tuesday. If the sum total of happiness in the pluriverse is fixed, if every sorrow I feel is offset by a joy elsewhere, why bother being good? Why bother mourning? Grief feels like a refusal to accept the plenitude. To mourn is to insist that *this* indexical point matters more than the others. But Lewis said all points are equal.

  Julian closed his eyes. He imagined the counterpart. The Lucky Julian. In that world, Elena was likely worried about him right now. Maybe he was late for work. Maybe he was buying her flowers. That Julian was real. Flesh and blood. Not a dream.

  But that Julian could not dry Elena's mother's tears.

  The phone rang. It was Elena's mother. In this world, she was a widow twice over.

  Julian stared at the phone. In a thousand other worlds, he let it go to voicemail. In some, he answered and was kind. In some, he was cruel. The set of all Julians was already complete. The script was written across the pluriverse.

  But *this* phone was ringing in *this* room.

  Lewis argued that our reasons for action are tied to the world we are causally embedded in. We care about *our* future because we will be there to experience it. We care about *our* neighbors because we can help them. But Julian had always found this thin. It felt like a consolation prize. *You can't save everyone, so just save the ones next to you.*

  He looked at the photo again. The metaphysics threatened to dissolve the image. If Elena exists elsewhere, is she really gone? No. *This* Elena is gone. The woman who laughed in this kitchen, who slipped on this driveway, is dead. The others are counterparts. Similar, but not identical. To confuse them was a category error. To seek comfort in their survival was a delusion.

  The ringing stopped. Voicemail.

  Julian stood up. The weight of the house pressed on him. He understood now why the nihilism was so tempting. If everything happens, nothing matters. But that was a view from nowhere. It was the view of God, looking down at the whole pluriverse at once.

  Julian was not God. He was an index. He was a *here*.

  He picked up the phone to call Elena's mother back. His hand shook. In some worlds, he didn't call. In those worlds, she sat in silence, feeling abandoned. In this world, he could change that.

  The metaphysics didn't save him. It didn't tell him that Elena was waiting for him in heaven, or that she lived on in spirit. It told him something harder. It told him that the pain here was unique because the causal chain here was unique. The suffering of *this* mother was not offset by the happiness of a counterpart mother in another world. Suffering isn't a resource that balances out across the multiverse. It is local.

  Responsibility was local, too.

  He dialled the number. The line clicked open.

  "Julian?" Her voice was brittle.

  "Hi, Margaret. I missed your call. I was... I was just cleaning up."

  "Oh. I was just checking."

  "I'm coming over," Julian said. He hadn't planned to say it. In many worlds, he made an excuse. In many worlds, he stayed home and drank.

  "You don't have to."

  "I want to. I'll bring dinner."

  He hung up. The decision was made. The counterpart Julians were irrelevant. They could not bring Margaret dinner. They could not sit in her living room and endure the silence of the house that used to hold Elena's voice. Only this Julian could.

  The moral weight returned, heavy and sharp. It was no longer diluted by the knowledge of infinite variations. The existence of a better world did not absolve him of the conditions of this one. In fact, it made it worse. He knew exactly what was possible. He knew that a world without this grief existed. He knew it was real. But he was locked out of it.

  He was trapped in the actual.

  Julian grabbed his coat. He looked at the door where Elena's umbrella still hung on the hook. A relic. In other worlds, she would take it down. In this world, it would gather dust until he threw it away.

  He touched the handle of the umbrella. It was cold.

  "Actual," he whispered to the empty room.

  It wasn't a special status. It was just a location. But it was *his* location. It was the only coordinate where his actions had traction. The other worlds were watching, in a sense—they existed alongside him—but they were silent spectators. They could not intervene.

  He stepped out into the rain. The water soaked his shoulders immediately. It was uncomfortable. It was real.

  Somewhere, in the vast logical space of the pluriverse, there was a Julian standing in the sun with Elena. That Julian was happy. Julian hoped he was happy. He hoped that version of himself cherished the moment, knowing nothing of the divergence.

  But this Julian had a job to do. The isolation of worlds meant that love, like gravity, only worked at close range. You could not love the pluriverse. You could only love the world you were in. To do otherwise was to love nothing at all.

  He started the car. The engine turned over, a violent, mechanical spark in the quiet street. He put the car in gear. He drove toward Margaret's house. He drove through the rain, leaving the infinite behind, bound by the terrible, narrow limits of the here and now.
