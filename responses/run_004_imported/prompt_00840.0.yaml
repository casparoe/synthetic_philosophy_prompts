answer: |-
  You have put your finger on one of the most enduring and contentious knots in the history of metaphysics. The tension you identify—between the **Complete Concept Doctrine** (which suggests that changing a property changes the individual) and the **Contingency of History** (which suggests the same individual could have done otherwise)—is precisely the fault line where David Lewis later built his counterpart theory.

  To answer your core question directly: **The standard scholarly consensus is that Leibniz does *not* hold a Kripkean view of transworld identity.** When taken seriously, the Complete Concept Doctrine forces Leibniz much closer to Lewis's counterpart theory than to modern essentialism, though Leibniz tries to paper over this with theological distinctions that often sound like transworld identity.

  Here is how the tension is typically dissolved (or at least managed) in the literature, and where Leibniz stands relative to the modern debate.

  ### 1. The Complete Concept and Individuation
  Your reading of the "Complete Concept" implication is correct. For Leibniz, an individual substance is individuated by its concept. As he writes in the *Discourse*, the concept of Caesar includes "once for all everything which can ever happen to him."

  If you posit a world where Caesar does not cross the Rubicon, you are not positing the *same* Caesar with a different property. You are positing a **different complete concept**. Let's call the actual historical figure *Caesar-Actual* (who crosses) and the counterfactual figure *Caesar-Possible* (who stays home).
  *   *Caesar-Actual* contains the predicate "crosses Rubicon."
  *   *Caesar-Possible* contains the predicate "does not cross Rubicon."

  Because their predicates differ, their complete concepts differ. Because their complete concepts differ, they are numerically distinct individuals. Therefore, strictly speaking, *Caesar-Actual* could not have done otherwise. If he had done otherwise, he would not have been *Caesar-Actual*.

  This is the exact logical structure of Lewis's counterpart theory: individuals are "world-bound." There is no literal identity across worlds, only similarity relations between counterparts.

  ### 2. How Leibniz Saves Contingency (Without Transworld Identity)
  If Caesar couldn't have done otherwise, how does Leibniz avoid "absolute fatality"? This is the heart of §13. Leibniz distinguishes between two kinds of necessity:

  1.  **Absolute Necessity:** Truths whose opposite implies a contradiction (e.g., geometry, logic). These hold in all possible worlds.
  2.  **Hypothetical Necessity:** Truths that follow from God's choice of the "best of all possible worlds."

  Leibniz's solution in the passage you cited relies on the distinction between **possibility** and **actuality**.
  *   **In God's Intellect:** All possible Caesars exist as concepts. There is a concept <Caesar-crossing> and a concept <Caesar-not-crossing>. Both are *possible* in themselves (neither implies a contradiction).
  *   **In God's Will:** God chooses to instantiate the world containing <Caesar-crossing> because it fits best with the overall harmony of the universe.

  When Leibniz says, "Caesar could have not crossed," he does not mean *Caesar-Actual* has the power to change his history. He means: **"The concept <Caesar-not-crossing> is internally consistent and exists in the realm of possibles, even though it was not selected for existence."**

  So, the statement "Caesar could have done otherwise" is shorthand for "There is a possible world containing a counterpart of Caesar who does otherwise." This confirms your suspicion: Leibniz is effectively using a counterpart-theoretic model to preserve contingency.

  ### 3. The "Transworld Identity" Illusion
  Why, then, does Leibniz often *sound* like he believes in transworld identity? Why does he speak of "the same Caesar" in other contexts?

  There are two reasons, one theological and one linguistic:
  1.  **The Conceptualist View:** For Leibniz, possible worlds are ideas in the mind of God. In God's mind, the "essence" of Caesar is a single idea that can be analyzed in different ways. Leibniz sometimes treats the *possible essence* as the individual, prior to the decree of existence. If we focus on the essence, we can talk about it having different properties in different "hypotheses." But once existence is added, the concept becomes fixed.
  2.  **Language:** Leibniz admits that human language is imprecise. We say "Caesar could have..." because we cannot grasp the infinite complexity of the complete concept. We treat "Caesar" as a rigid designator (to use Kripke's term), but metaphysically, "Caesar" is a cluster of predicates.

  Kripke, in *Naming and Necessity*, explicitly critiques Leibniz on this point. Kripke argues that Leibniz was confused: he wanted to maintain contingency (like Kripke) but held a theory of individuation (Complete Concepts) that made everything necessary (like Spinoza). Kripke suggests Leibniz should have just admitted that names designate the same object across worlds regardless of properties.

  David Lewis, conversely, argued that Leibniz was right about individuation but needed to drop the pretense of transworld identity. Lewis's counterpart theory is essentially an attempt to formalize what Leibniz's metaphysics *requires*, even if Leibniz's language sometimes wavered.

  ### 4. Resolving the Tension in §13
  Returning to the specific text you quoted:

  > *"Now nothing is necessitated whose opposite is possible."*

  When Leibniz says the opposite is "possible," he means **logically possible** (non-contradictory), not **compossible** with the actual world.
  *   Is <Caesar-not-crossing> logically possible? Yes.
  *   Is <Caesar-not-crossing> compossible with the actual world (the Best of All Possible Worlds)? No.

  Therefore, the tension dissolves if we accept that for Leibniz, **modality is de dicto (about concepts/propositions) rather than de re (about things across worlds).**
  *   **De Dicto:** "It is possible that a Caesar-like individual does not cross." (True)
  *   **De Re:** "This individual, Caesar, could have not crossed." (False, strictly speaking, because *this* individual is defined by crossing).

  Leibniz wants to have it both ways to save moral responsibility. He needs *Caesar* to be responsible, not a *Counterpart-Caesar*. He bridges this by arguing that the *reason* Caesar crosses is internal to his concept (his "nature or form"), but the *existence* of that concept is contingent on God's will. Thus, Caesar is free because his actions flow from his own nature, not external coercion, even if that nature is fixed.

  ### 5. Conclusion: Who Wins, Lewis or Kripke?
  To answer your final question: **Does any essentialism this strong eventually have to concede the point to Lewis?**

  Yes, if you maintain the **Complete Concept Doctrine** (that an individual is the sum of all its predicates, past, present, and future), you are logically committed to something like counterpart theory. You cannot have transworld identity without weakening the individuation criteria.

  *   **Kripke's Move:** Keep transworld identity, weaken individuation (Caesar is Caesar regardless of whether he crosses; crossing is accidental, not essential).
  *   **Lewis's Move:** Keep strong individuation (individuals are world-bound), adopt counterpart theory to explain modal talk.
  *   **Leibniz's Position:** He attempts a hybrid. He keeps strong individuation (leaning Lewis) but uses theological voluntarism to claim the *choice* of which individual exists is contingent (leaning Kripke).

  Most modern Leibniz scholars (such as Benson Mates and Nicholas Rescher) agree with your intuition: Leibniz's official metaphysics supports a counterpart-theoretic reading. When he speaks of "Caesar" in other possible worlds, he is speaking loosely about a concept that resembles the actual Caesar.

  So, you are not stuck on a misreading. You have identified the exact point where Leibniz's system strains against common sense. He establishes that Caesar's actions are **certain but not necessary**. They are certain because they are in his concept; they are not necessary because that concept itself was not the only one God *could* have created. But since the concept defines the individual, the "Caesar" who doesn't cross is, metaphysically speaking, someone else.

  In short: Leibniz is a crypto-counterpart theorist who sometimes speaks as if he believes in transworld identity to preserve the intuition of human freedom. Lewis simply made the implicit metaphysics explicit.
