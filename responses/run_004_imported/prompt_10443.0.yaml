answer: |-
  Here is a concrete scenario designed to break the "Normal Species Functioning" baseline by weaponizing the **Reference Class Problem**.

  ### The Concept: "The Canary Protocol" (Environmental Immune Tolerance)

  **The Science:**
  A CRISPR-based epigenetic modifier that dampens the IgE immune response to specific synthetic particulates (let's call them *polymer-dusts*). These dusts are byproducts of the cheap, rapid-construction nanomaterials used in low-income housing and industrial zones.

  **The Clinical Pitch:**
  The clinic is treating children for **"Chronic Environmental Sensitivity Syndrome" (CESS)**.
  *   **Symptoms:** Anaphylactic reactions, chronic inflammation, and developmental stunting caused by exposure to standard building materials.
  *   **Goal:** Restore the child's ability to attend school and live at home without requiring a sterile (and unaffordable) air-filtered environment.

  **The Regulatory Trap:**
  The regulator (let's call her Vance) has to approve the procedure as **Therapy** to allow it. If she classifies it as **Enhancement**, the unlicensed clinic is shut down and the patients are denied.

  Here is how the "Normal Baseline" collapses depending on how you sort the reference class:

  #### 1. The Biological Baseline (Therapy Fails)
  *   **Reference Class:** *Homo Sapiens (Ancestral/Global Standard).*
  *   **Norm:** A healthy human immune system *should* identify and attack foreign synthetic particulates. Inflammation is the correct, species-typical response to toxins.
  *   **Verdict:** Dampening a correctly functioning immune system is **Enhancement**. You are disabling a warning system. You are making the human *less* human to accommodate the toxin.
  *   **The Bite:** If Vance rules this way, she admits the treatment is biologically unnatural.

  #### 2. The Sociological Baseline (Therapy Succeeds, but at a Cost)
  *   **Reference Class:** *Citizens of Sector 4 (The Local Environment).*
  *   **Norm:** 90% of the population in this zone already has suppressed immune responses due to chronic, multigenerational exposure. Their bodies have "acclimatized" (or been damaged) into tolerance.
  *   **Verdict:** The patient is the outlier. Their immune system is *over*-reacting compared to their peers. Restoring them to the local baseline allows them to function in their society. This is **Therapy**.
  *   **The Bite:** To approve this as therapy, Vance must legally certify that the "Normal Human" in this sector is one who is **immune-compromised against toxins.** She is codifying a diseased population as the new "Normal." She is admitting the city is uninhabitable for unmodified humans.

  #### 3. The Economic Baseline (The Enhancement Loophole)
  *   **Reference Class:** *Industrial Laborers.*
  *   **Norm:** Workers in high-exposure zones (mines, recycling plants) currently require expensive respirators and hazard pay.
  *   **Verdict:** This gene edit removes the need for safety equipment. It increases labor efficiency and reduces corporate liability.
  *   **The Conflict:** If the clinic markets this to adults for work, it is clearly **Enhancement** (optimizing for productivity). But they are marketing it to *children* for *school*.
  *   **The Ambiguity:** Is a school in a toxic zone a "learning environment" or a "low-hazard workplace"? If the child cannot exist in the school without the edit, is the school disabling the child, or is the child disabled?

  ### How to Play the Scene

  The tension comes from the Regulator realizing that **both** labels destroy her.

  **The Clinic Doctor's Argument:**
  > "You're holding a clipboard with WHO standards from twenty years ago, Counselor. Look out the window. The air outside is Category 4. By your definition, a child who goes into anaphylactic shock breathing the air is 'normal,' and a child who can breathe it is 'enhanced.' I'm not building a super-soldier. I'm building a child who can walk to the bus stop."

  **The Regulator's Counter (The Trap):**
  > "If I sign this as therapy, I'm certifying that the natural human immune response is a pathology in this zip code. I'm putting on record that this city is toxic to unmodified life. That triggers a Federal Health Mandate. The city gets condemned. Thousands lose their homes."

  **The Collapse:**
  The "Normal Species Functioning" baseline requires a "Normal Species Environment." By changing the environment (pollution), the corporation/state has shifted the baseline of "Health."
  *   **Therapy** implies fixing the patient to match the world.
  *   **Enhancement** implies fixing the patient to exceed the world.
  *   **The Reality:** The world is broken. Fixing the patient to match the broken world looks like therapy locally, but enhancement globally.

  ### Why This Has "Bite"
  1.  **It's Visceral:** It's about breathing, children, and invisible poison.
  2.  **It's Class Warfare:** The rich live in "Clean Zones" where this treatment is unnecessary (and perhaps dangerous, as it lowers immune vigilance). The poor *need* it to exist.
  3.  **It Traps the Regulator:**
      *   If she bans it: She condemns sick kids to illness.
      *   If she allows it as Therapy: She admits the government has failed to keep the environment safe.
      *   If she allows it as Enhancement: She admits the state is sanctioning genetic modification for labor compatibility.

  ### The "Age" Variable (Adding one more layer)
  To hit your specific request about sorting by age:
  *   **Adults:** The edit is irreversible and locks the immune system. For an adult, it's a choice (Enhancement/Risk).
  *   **Children:** Their immune systems are still calibrating. The clinic argues it's **Prophylactic Therapy** (like a vaccine).
  *   **The Conflict:** A vaccine protects you from a *pathogen* (the virus). This "vaccine" protects you from the *environment* (the air).
  *   **The Question:** At what age does a child stop being a "patient" who needs protection from the air, and start being a "citizen" who is being modified to serve the economy? The clinic treats 6-year-olds. The regulator argues that 6 is too young to consent to "environmental adaptation," but waiting until 18 means the child has already suffered irreversible lung damage. The "Therapy Window" is a trap.

  This setup forces your characters to argue not about medicine, but about **what reality they are legally allowed to acknowledge.**
