prompt: |-
  I'm working on a piece about organ donation and I've got an interview lined up with a philosopher of medicine who's known for arguing that whole-brain death isn't really a biological fact so much as a useful legal fiction -- something we keep around so transplant teams can procure organs without technically "killing" anyone -- and that we'd be more honest just scrapping the dead donor rule altogether. Can you draft me 8-10 interview questions that don't just let her restate that thesis? Want at least one on the Shewmon-style chronic survival cases (bodies that keep growing, healing, even one pregnancy sustained to viability, years after a whole-brain-death diagnosis) and whether those cases actually help or undercut her "it's a fiction" line; one on why circulatory-death protocols only wait a couple minutes after the heart stops given that auto-resuscitation is a real thing, and whether "permanent" cessation is smuggling in a decision that "irreversible" cant justify; and one that pushes her to say what's left of the dead donor rule on her view, and whether shes actually willing to bite the bullet on harvesting organs from living, consenting, permanently unconscious patients. For each, throw in a quick follow-up keyed to whatever dodge she's most likely to reach for.
