answer: |-
  The departmental lounge smelled faintly of stale coffee and cheaper sherry. Name tags were peeling off lapels. Marcus, adjusting his glasses, found himself cornered near the cheese platter by Elena, whose reputation for dismantling modal realists was well-known.

  "Enjoyable talk, Marcus," Elena said, swirling her plastic cup. "Though I suspect you expected more resistance than the graduate students offered. But let's not rehash the Q&A. I want to go straight to the Humphrey objection. Kripke put it best: if Counterpart Theory is true, then when we say 'Humphrey could have won the election,' we aren't talking about Humphrey. We're talking about some other guy, a counterpart, in a concrete universe causally sealed off from ours. But surely, what matters to Humphrey is whether *he* could have won. He has no stake in the success of a merely resembling stranger. Your theory changes the subject."

  Marcus took a sip of sherry, unbothered. "It's a powerful rhetorical point, Elena, I'll grant you. But does it hold metaphysical water? First, we must distinguish the analysis of the *truth conditions* of the sentence from the psychological state of the subject. That ordinary speakers don't consciously quantify over counterparts doesn't mean counterparts aren't what make their claims true. Folk physics talks about the sun 'rising,' but that doesn't make geocentrism true."

  "But modality isn't astronomy," Elena countered. "It's about *possibility for an agent*."

  "Exactly. And consider your own view," Marcus pressed, leaning in. "On your Genuine Transworld Identity picture, Humphrey is numerically identical to a winner in world *W*. But *W* is causally isolated from us. So, why should *this* Humphrey care about that one any more than he cares about my counterpart? If causal connection is what grounds 'stake,' then the transworld Humphrey is just as much a stranger as the counterpart. If causal connection *isn't* required, then why isn't resemblance enough? You seem to be positing a magical bond of 'identity' across the void that does no work other than satisfying the intuition that the name 'Humphrey' must stick to the same substance."

  Elena smiled sharply. "The bond isn't magical; it's logical. Identity is primitive. But let's not get bogged down in the psychology of care. Let's talk about the logic of identity itself. You say counterparts are determined by similarity. But similarity is context-dependent and vague. This leads me to my worry for *you*."

  "Go on."

  "Imagine a possible world," Elena said, ticking a point off on her finger. "A world where, due to a twinning event in the early stages of embryonic development, there exist two individuals, *H1* and *H2*. Both are qualitatively identical to our Humphrey up to the point of the election. Both win. Both have equal claim to resembling the actual Humphrey. On your view, who is the counterpart? Is it *H1*? Is it *H2*? Is it both?"

  Marcus nodded. "Standard Lewisian line: Both are counterparts. Counterpart relations are one-to-many. There's no requirement for uniqueness."

  "But that destroys the logic of identity," Elena said. "If I say 'Humphrey might have been twins,' that's one thing. But if I say 'Humphrey might have won,' and there are two winners who are equally Humphrey-like, your theory makes it indeterminate which truth-maker verifies the claim. Worse, consider Chisholm's paradox. We can construct a chain of worlds where Humphrey changes gradually. In the last world, he is qualitatively identical to someone else, say, Nixon. If identity is transitive, and you rely on qualitative similarity to track individuals across these steps, you end up proving Humphrey is Nixon. To avoid this, you must admit that the counterpart relation is not identity. But then, what fixes the relation? If you say 'context,' you've made metaphysics dependent on conversational pragmatics."

  Marcus set his cup down. "I'm happy to accept that 'identity' across worlds is a loose way of speaking. But you face the mirror image of this problem. In your twinning scenario, you insist that one of *H1* or *H2* is *numerically identical* to Humphrey, and the other is not. But ex hypothesi, they are qualitatively indistinguishable. What grounds this difference? You can't point to their properties; they share them all. You can't point to their origins; by the scenario, they share the same zygote initially. So you are forced to posit a bare 'thisness,' a haecceity, that tags one as Humphrey and the other as Not-Humphrey, with no qualitative basis. That looks like occult metaphysics to me."

  Elena didn't flinch. "It's not occult; it's the only way to preserve the necessity of distinctness and the determinacy of identity. I appeal to non-qualitative individual essences. Humphrey has a property, *being Humphrey*, which is not reducible to a cluster of qualities. In your twinning world, *H1* instantiates *being Humphrey*, and *H2* does not. It's a brute fact, yes. But it's no bruter than your claim that similarity relations carve reality at its joints. Your similarity metric is just as mysterious. Why is sharing a nose more important than sharing a fingerprint for counterpart selection? You need a weighting system. Who provides the weights? If it's us, then modality is mind-dependent. If it's the world, then you have primitive similarity facts, which are just haecceities in disguise."

  "Primitive similarity is grounded in shared universals or natural properties," Marcus shot back. "It's not a bare tag. And regarding the twinning case: why think reality must be determinate there? Perhaps it is simply vague whether Humphrey exists in that world. I can bite the bullet on vagueness. Can you bite the bullet on unknowable haecceities? If *H1* and *H2* are qualitatively identical, no one, not even God, could tell which one is Humphrey on your view. That makes transworld identity epistemically inaccessible."

  "And your counterpart relation makes it contextually unstable," Elena retorted. "In one context, *H1* is the counterpart; in another, *H2*. So the truth value of 'Humphrey could have won' shifts depending on who is speaking? That makes modal truth too cheap. I'd rather accept primitive individuation than make truth dependent on conversational scorekeeping."

  "So we're at an impasse," Marcus said, picking his sherry back up. "You prefer primitive identity facts to save logic; I prefer primitive similarity facts to save naturalism."

  "Essentially," Elena said, clinking her plastic cup against his. "You think I'm mystifying the substance; I think you're dissolving the subject."

  "Cheers to Humphrey," Marcus said. "Whoever he is."

  "Wherever he is," Elena replied.

  They drank, the disagreement hanging between them as solid as any possible world.
