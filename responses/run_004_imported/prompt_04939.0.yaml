answer: |-
  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name], Academic Ethicist
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Charter Language Regarding Consultant Recommendations

  Colleagues,

  We are at an impasse regarding the weight the treating team owes an ethics consultant's recommendation. This is not merely an administrative question of workflow; it is an epistemic question about the nature of moral authority in clinical care. Below is my analysis of the competing positions and a specific recommendation for the charter text.

  ### 1. The Case for Formalized Deference (Faction 1)
  The argument to formalize the current practice ("recommendation shall guide... absent contraindication") is strong and deserves serious weight. It relies on a **Moral Division of Labor**. In modern medicine, we accept cognitive specialization to ensure safety and efficiency. We do not ask nephrologists to derive dialysis protocols from first principles; they defer to the nephrology consult.

  Proponents argue that ethics should function similarly. Treating teams face high moral distress; offloading the normative burden to a specialist reduces that distress, ensures consistency across cases, and prevents delays in care. If the consultant is the "expert," treating the recommendation as a directive streamlines the process and protects the team from the anxiety of uncertainty. To demand otherwise risks inconsistency and "ethics drift," where similar cases yield different outcomes based on the treating team's philosophical leanings rather than institutional standards.

  ### 2. The Epistemic Objection (Faction 2)
  However, the cardiology analogy fails on a crucial epistemic distinction. Cardiology consults deal primarily with *empirical facts* and *technical means* (e.g., "This drug will lower the potassium"). Ethics consults deal with *normative ends* and *moral justification* (e.g., "This action is permissible").

  As Alison Hills and others in moral epistemology argue, there is a distinction between **moral knowledge** (knowing *that* X is right) and **moral understanding** (knowing *why* X is right).
  *   **Testimony transmits knowledge:** I can tell you the speed limit is 65, and you know it.
  *   **Testimony does not transmit understanding:** If I tell you *why* 65 is the safe limit, you only understand if you grasp the reasoning yourself.

  In clinical ethics, **moral understanding is a requirement for moral agency.** If a nurse or physician implements a withdrawal of life support solely because "Ethics said so," they act as a technician, not a moral agent. They cannot explain the decision to the family, defend it to risk management, or reconcile it with their own conscience. This creates a "black box" of moral authority. If the consultant is wrong, the team has no epistemic resources to catch the error. Furthermore, it quietly converts the Ethics Service from a deliberative resource into a risk-management shield, eroding our moral authority.

  ### 3. Recommendation: A Tiered Duty of Concurrence
  We must balance the need for efficiency (Faction 1) with the need for moral agency (Faction 2). The distinguishing principle should be **reversibility and time pressure.**

  In true emergencies, deference is necessary. In standard complex cases (capacity, withdrawal of treatment), where time allows for deliberation, the treating team must retain ownership of the decision to preserve moral understanding. Therefore, I recommend we reject the "shall guide" language and adopt a "Duty to Deliberate" standard with an emergency exception.

  ### 4. Proposed Charter Language
  I propose the following amendment to Section [X] of the Charter:

  > **Authority and Implementation of Recommendations**
  >
  > **(a) Advisory Nature:** Ethics consultations provide normative analysis and recommendations but do not issue binding directives. Ultimate responsibility for patient care decisions remains with the treating clinical team.
  >
  > **(b) Standard Cases:** In non-emergent cases (e.g., capacity determinations, withdrawal of life-sustaining treatment), the treating team shall not implement an ethics recommendation solely on the basis of the consultant's authority. Implementation requires **documented concurrence**, wherein the team briefly notes the ethical rationale supporting the decision in the medical record.
  >
  > **(c) Expedited Cases:** In time-sensitive situations where delay poses immediate risk to patient welfare, the treating team may act on the consultant's recommendation based on deference alone. A retrospective note documenting the team's alignment with the rationale shall be added within 24 hours.

  ### 5. Rationale for the Vote
  This provision rejects the "cardiology model" for standard ethics cases without paralyzing the team in a crisis.
  *   **To Faction 1:** This preserves speed in emergencies (Section c) and ensures consistency by requiring the rationale to be documented, which creates a record for review.
  *   **To Faction 2:** This protects moral agency. By requiring the team to articulate the *why* (Section b), we ensure they possess moral understanding, not just moral knowledge. This allows them to defend the decision to families and maintains the Ethics Service's role as an educator and deliberative partner, not a proxy decision-maker.

  I urge the committee to adopt this language. It formalizes the expectation that ethics is a practice we *do* together, not a service we *outsource*.

  Respectfully,

  [Your Name]
