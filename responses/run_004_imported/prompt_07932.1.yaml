  8.  *(Self-Correction during drafting)*: Wait, Bayne's view evolved. In *The Unity of Consciousness* (2010), he argues for unity. Later, he acknowledged the possibility of "partial unity." I should stick to the "Switch Model" as the user defined it (one stream, alternating dominance) as that's the seminar focus. I will frame the critique around the *mechanism* of switching vs. the *ontology* of duality.

  9.  **Final Plan:**
