answer: |-
  This is an exceptionally sharp objection. You have put your finger on what is often called the **underdetermination problem** in the split-brain literature. Your intuition is correct: if the "Switch Model" (Unity) and the "Duality Model" (Two Streams) predict identical behavior in everyday contexts, and the Switch Model relies on a mechanism (attentional switching) that is purportedly too fast or subtle to be reported in the lab, then the preference for Unity often rests on a methodological default (assume unity unless forced otherwise) rather than positive empirical evidence.

  Here is a construction of the case against the Switch Model, built on your insight, followed by the strongest counter-argument a Bayne-defender could offer.

  ### The Case Against the Switch Model: The "Explanatory Idleness" Argument

  To argue for permanent duality (or at least, that duality has equal claim), you need to show that the Switch Model pays a higher theoretical price for the same explanatory return. You can structure this around three points: Simultaneity, The Silence of the Right, and Reversed Parsimony.

  #### 1. The Argument from Simultaneous Conflict (The Temporal Objection)
  The Switch Model relies on *attentional competition*. For the model to work, there must be a time $t_1$ where Hemisphere A dominates the stream and $t_2$ where Hemisphere B dominates. Even if this switching is rapid, it is not instantaneous.

  *   **The Data:** In certain lab conditions, split-brain patients can engage in bimanual conflict that appears truly simultaneous. For example, one hand begins to button a shirt while the other unbuttons it, or one hand reaches for a cigarette while the other slaps it away.
  *   **The Critique:** If there is only one stream of consciousness, the subject must will $X$ at $t_1$ and $Y$ at $t_2$. But in cases of genuine bimanual conflict, the motor commands are issued concurrently. For the Switch Model to hold, the "switch" would have to be faster than the neural latency required to initiate motor action (roughly 150-200ms). If the switching is that fast, it becomes a "hidden variable"—a mechanism posited solely to save the theory of unity, with no independent phenomenological or behavioral marker.
  *   **The Duality Advantage:** The Duality Model predicts simultaneous conflict naturally. Two distinct centers of volition can will contradictory actions at the exact same time. The Switch Model has to stretch the definition of "attentional switching" to cover simultaneous motor output, whereas Duality accepts the simultaneity as evidence of distinct agents.

  #### 2. The Argument from the "Silent Right" (The Communication Objection)
  This engages your point about daily life. In everyday settings, the left hemisphere (LH) speaks. The Switch Model says the LH is usually "driving" the single stream of consciousness. The Duality Model says the Right Hemisphere (RH) is a separate conscious subject that lacks speech.

  *   **The Critique:** If the RH is merely "offline" or "unattended" in the Switch Model during normal conversation, why does it never attempt to break into the stream? In the lab, the RH can communicate via the left hand. If there is one stream that the RH occasionally accesses, we might expect the RH to use the left hand to correct the LH's speech during complex daily tasks (e.g., the LH says "I'm going to the store," and the left hand writes "NO, BANK").
  *   **The Duality Advantage:** The Duality Model explains the silence of the RH in daily life not because it is unconscious, but because it is *socially isolated*. It is a mute subject trapped in a body controlled largely by the speaking subject. The lack of inter-manual conflict in daily life is explained by **shared goals and environmental redundancy** (both hemispheres see the same coffee cup, both want coffee), not by a single stream of consciousness. The Switch Model struggles to explain why the "switching" mechanism so perfectly suppresses the RH's desire to communicate outside the specific constraints of the lab.

  #### 3. Reversed Parsimony (The Theoretical Objection)
  You noted that Unity seems more parsimonious (1 subject vs. 2). However, parsimony isn't just about counting subjects; it's about counting *ad hoc mechanisms*.

  *   **The Critique:**
      *   **Duality:** Posits 2 subjects. Mechanism: Standard neurology (two hemispheres, severed connection).
      *   **Switch Model:** Posits 1 subject. Mechanism: Standard neurology + **A high-speed, unreportable attentional switching mechanism that leaves no phenomenological trace.**
  *   **The Argument:** The Switch Model saves the *ontology* (1 subject) at the cost of the *mechanism*. It requires a specific cognitive architecture (a central attentional gate that toggles between hemispheres without the subject noticing) for which there is little evidence outside of split-brain theory itself. The Duality view is ontologically extravagant but mechanically simple: cut the bridge, get two islands. If the evidence (simultaneous conflict) fits the "two islands" model better, the "one island with a teleporter" model is actually less parsimonious.

  ### The Strongest Switch-Model Defense (Bayne's Reply)

  If you present the above in your seminar, a defender of Bayne (or Bayne himself) would likely respond with the **Argument from the Singularity of the Phenomenal Field.**

  This is the strongest card in the Unity deck. It concedes that behavioral independence exists but denies that behavioral independence entails *phenomenal* duality.

  **The Argument:**
  1.  **Phenomenal Unity is Primitive:** Consciousness is not a collection of data points; it is a *field*. When you look at a scene, you don't experience "left visual field data" + "right visual field data." You experience *one scene*.
  2.  **The Split-Brain Phenomenology:** Even in split-brain patients, when they are not in constrained lab settings, they report a unified world. They do not report "blackouts" or "gaps" where the other hemisphere took over.
  3.  **The Explanation of Lab Disunity:** Bayne argues that the disunity in the lab is **Access Disunity**, not **Phenomenal Disunity**. The patient has one stream of consciousness, but the *information* available to that stream is restricted by the lack of callosal transfer.
      *   *Example:* If an image is flashed to the RVF (LH), the single conscious stream accesses it. If flashed to the LVF (RH), the stream accesses it *via the RH's control of attention*.
      *   *Why no switching report?* Because the *subject* doesn't switch. The *source of input* switches. Just as you don't feel like a different person when you close your left eye and then your right eye, the patient doesn't feel like a different person when attention shifts from LH-dominance to RH-dominance.
  4.  **The Knock-Down Point:** If there were truly two subjects, we would expect **double reporting** or **inter-subjective conflict** in the verbal domain. We would expect the LH to say, "I see a flash," and the Left Hand to write, "I didn't see anything." While manual conflict happens, *verbal* conflict about the nature of experience is rare. The verbal report (the gold standard of phenomenology) remains singular. This suggests the *experiencer* is singular, even if the *controller of the hands* is fragmented.

  ### Summary for Your Seminar

  To synthesize this for your discussion:

  **Your Critique:** The Switch Model is empirically underdetermined. It relies on a "default unity" assumption to override the evidence of simultaneous behavioral independence. It posits a "ghostly switch" (fast, unreportable attentional shifts) to save the single-subject ontology, whereas the Duality view accepts the ontological cost of two subjects to avoid positing invisible mechanisms.

  **The Counter-Critique:** The Duality view confuses *agency* with *phenomenology*. Two hands can fight (agency duality) while one field of experience watches them fight (phenomenal unity). The Switch Model is preferred not because it explains behavior better, but because it respects the **first-person report**: the patient says "I am one person." To say they are two is to tell them they are wrong about their own existence, which requires a much higher burden of proof than telling them their attention is shifting.

  **The Stalemate:** Ultimately, the debate rests on whether you prioritize **Third-Person Behavioral Independence** (favoring Duality) or **First-Person Phenomenal Character** (favoring Unity). The Switch Model wins if you think phenomenology trumps behavior; it loses if you think behavior reveals the ontology of mind better than reports do.
