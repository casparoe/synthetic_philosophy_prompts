      *   **The Duality Model (Puccetti, Marks, others):** The corpus callosum facilitates *conscious unity*. Without it, the hemispheres support distinct centers of consciousness. Apparent unity in daily life is due to environmental redundancy and sub-conscious coordination, not genuine phenomenal unity.
      *   **The User's Specific Angle:** The "Empirical Equivalence" problem. If Behavior $X$ (daily life) is predicted by both Model A (Switch) and Model B (Duality), and Behavior $Y$ (lab) is explained by Switch as "switching" and by Duality as "independent processing," how do we decide? The user thinks the Switch Model wins only by fiat (default unity).

  3.  **Drafting the Argument Against the Switch Model (The "Duality Defense"):**
      *   *Point 1: The Phenomenology of Conflict.* In lab settings (e.g., tachistoscopic presentation), the left hand might button-press 'O' while the right hand button-press 'X'. The Switch Model says "Consciousness focused on Left, then Right." But often, the hands act *simultaneously* in conflict. If I am one subject, how do I will two contradictory actions at $t_1$? Bayne says attention switches fast. Counter: Some conflicts are truly simultaneous (bimanual conflict).
      *   *Point 2: The "No Report" Problem.* Patients don't report switching. Bayne says switching is pre-reflective or too fast. Duality proponent says: "They don't report it because there is no single subject to report the switch. The Left Subject doesn't feel the Right Subject's turn." This explains the silence better than "fast switching."
      *   *Point 3: The Burden of Proof/Parsimony.* The user mentions this. I need to sharpen it. Parsimony usually favors fewer *entities*. Duality says 2 subjects. Switch says 1. So parsimony favors Switch. *However*, parsimony also favors fewer *ad hoc mechanisms*. Does "attentional switching" explain the data without adding complexity? If the switching mechanism is unmotivated except to save the unity intuition, it's ad hoc.
      *   *Point 4: Sub-conscious vs. Conscious Coordination.* In daily life, hands cooperate. Switch says "One consciousness driving." Duality says "Two consciousnesses + sub-cortical coordination." Evidence: Inter-manual conflict in daily life (alien hand syndrome-ish behaviors) suggests distinct volitions that *usually* align but sometimes slip. If it were one stream, slips should be rarer or different.

  4.  **Developing the Strongest Counter-Argument (Bayne's Defense):**
      *   Bayne's strongest point is the *Unity of Phenomenology* in non-lab settings. When I drink coffee, *I* taste it and *I* hold the cup. If there were two subjects, who is having the experience? If both, why don't they interfere?
      *   Bayne argues that the *structure* of experience is unified. Even if content is limited, the *field* is one.
      *   The "Switch" isn't necessarily a blink. It's a shift in *access*.
      *   Crucially: The Duality view struggles to explain why the two subjects never "talk over each other" in verbal reports. If there are two thinkers, why only one voice? (Bayne: Because only the Left has speech. Duality: Because the Right is mute. Bayne: But the Right understands. Why doesn't it signal distress via the Left hand during normal conversation?)

