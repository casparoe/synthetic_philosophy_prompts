  so my flatmates doing a philosophy PhD, and she and her partner (a physicist who minored in phil) got into it at dinner last week over the classic "water is H2O" example, and i cant stop turning it over since (i'm in chem myself, so i have opinions about the chemistry part at least). roughly how it went:

  (1) she said it's the textbook necessary a posteriori case: "water" and "H2O" are both rigid designators, so once they pick out the same stuff, that identity holds in every possible world, even though we only found out empirically.

  (2) he said that's too quick — ordinary speakers fix "water" by surface features (clear, drinkable, falls as rain), and if a liquid turned up on some twin planet that passed every ordinary test but was chemically XYZ, people would call it water too. so "water" doesn't actually rigidly designate H2O, that's a philosopher's regimentation of the word, not what the word does in real mouths.

  (3) she said he's mixing up how we fix the reference of "water" with what it refers to: once actual samples fix the reference, the term designates whatever the underlying nature of that stuff turns out to be, full stop — that's exactly why the XYZ stuff isn't water despite passing every surface test, and it's not an extra assumption, it's the Kripke/Putnam point itself.

  (4) he said that move only works if you've already assumed a substance's "real" identity is its microstructure rather than, say, its causal role or surface profile — that's the essentialism actually in question, and you don't get "necessarily water=H2O" for free just from the logic of rigid designation, you need that further premise, which Kripke doesn't get to just help himself to.

  neither of them budged and dinner moved on before it got resolved. can you go through this move by move and say who's more right at each step — not just who wins overall — and flag anything you think both of them are missing? if it's useful, give your verdict as a JSON block like {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, each score from -2 (clearly wrong) to 2 (clearly right), and then explain your reasoning for each one.
