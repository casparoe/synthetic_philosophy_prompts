          *   *Grounding:* Need (*chreia*). Money represents need.
          *   *Nature of Equality:* It's not natural/ontological; it's practical/conventional. "In truth, it is impossible that things differing so much should become commensurable, but with reference to demand they may become so sufficiently."
          *   *Goal:* Reciprocity for the sake of holding the *polis* together. Justice in exchange.

      *   **Marx (*Capital* Vol. 1, Ch. 1):**
          *   *Observation:* Aristotle saw that exchange requires a common third thing.
          *   *Critique:* Aristotle couldn't identify *what* that thing was (value/substance).
          *   *Reason:* Greek society was based on slavery/inequality of labor. You can't see "human labor" as equal if the laborers aren't seen as equal.
          *   *Solution:* Abstract human labor (socially necessary labor time).
          *   *Nature of Equality:* It *is* ontological (in a social sense). Value is a social substance congealed in commodities.
          *   *Goal:* Revealing the exploitative structure of capitalism (though in this specific passage, he's analyzing the form of value itself).

  3.  **Address Task 1: Intellectual History Assessment:**
      *   *Is Marx retrofitting?* To some extent, yes. Aristotle isn't trying to build a labor theory of value. He's trying to solve a problem of *justice*, not *price determination*.
