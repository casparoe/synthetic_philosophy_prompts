answer: |-
  The whiteboard was still warm, covered in half-erased attention diagrams and the residual scratch of a sparsity penalty equation. The rest of the journal club had drifted off to the hallway for pizza, but Elena was capping her marker, staring at the projection of the SAE feature visualization. Marcus was leaning against the doorframe, nursing a lukewarm coffee.

  "It's the monosemanticity, Marcus," Elena said, turning from the board. "Look at Feature 892. It fires for 'mentions of betrayal in a historical context' and nothing else. It's not a mixture. It's a *thing*. We're finally doing what Hubel and Wiesel did for V1, but for semantics."

  Marcus pushed off the doorframe. "Hubel and Wiesel didn't have to tune an L1 penalty coefficient to find edge detectors. That's my problem. You're calling Feature 892 a 'representation' like it's a place cell in a hippocampus. But if I double the dictionary size, Feature 892 splits into two. If I change the random seed, it rotates. If the 'cell' depends on how hard I press on the sparsity knob, in what sense is it a genuine representation?"

  "Resolution isn't ontology," Elena countered. "If I look at a star with a low-res telescope, it's a dot. High-res, it's a binary system. Did the second star not exist before I adjusted the lens? The network is storing that concept in superposition. The SAE is just the basis change that aligns with the latent structure the model already built to minimize loss."

  "But the basis isn't unique," Marcus said, walking over to the board. He tapped the reconstruction loss term. "In superposition, the model uses non-orthogonal directions to pack more features than dimensions. Any set of directions that reconstructs the activation within epsilon is valid. You're picking the *sparsest* one, sure. But sparsity is a prior *you* imposed, not necessarily one the model cares about intrinsically. You're carving the turkey along lines that make *you* happy, not lines the turkey grew."

  "Okay, but does the carving predict behavior?" Elena turned to face him. "When we intervene on Feature 892—clamp it to zero—the model stops predicting betrayal in the completion. We ablate it, the behavior goes away. That's causal. It's not just a statistical artifact of my dictionary size. It's doing work."

  Marcus held up a hand. "I'm not denying it's causally relevant. I'm denying that calling it a 'representation of betrayal' adds any explanatory power over saying 'this direction is causally linked to betrayal tokens.' This is Ramsey's Job Description Challenge. If you can fully explain the system's input-output behavior by describing the causal role of the node—its connections, its weights, its activation threshold—what work is the word 'representation' doing? It's just a gloss. A folk-psychological sticker we put on a vector so we feel comfortable."

  Elena sighed, grabbing a paper plate but forgetting to put pizza on it. "You're treating 'representation' like it's magic. It's not. It's a hypothesis about generalization. If I say this direction *represents* betrayal, I'm predicting it will fire for *novel* instances of betrayal it hasn't seen, even if the statistical correlation in the training set was weak. The causal role describes the past; the representational content predicts the future."

  "Does it, though?" Marcus crossed his arms. "Or does it just predict the future because the statistical regularities hold? Look, take the 'grandmother cell' idea. Neuroscientists mostly abandoned that. It's rarely one neuron. It's populations. When you insist on discrete SAE features, you're forcing a discrete ontology onto a continuous, distributed system. You're reifying the basis vectors. Ramsey's point is that if the 'content' doesn't do anything the 'causal role' doesn't already do, you're committing to an ontology you don't need."

  "But the causal role *is* the content," Elena insisted. "In a semantic system, the reason node A connects to node B is *because* A means 'betrayal' and B means 'consequence.' The meaning is the compression of the causal structure. If I treat it as a representation, I can reason about it. I can say, 'If I stimulate this, the model should think it's been betrayed.' If I treat it as just 'Direction 892,' I have to re-run the experiment every time. The representational stance is a lossy compression of the causal graph that allows *us* to reason about the model."

  Marcus smiled thinly. "So it's a representation for *you*, not for the *model*."

  "That's... a distinction without a difference, maybe." Elena paused. "Wait. No. If it helps me predict the model's behavior on out-of-distribution data better than the raw weights do, then the representation is functionally real. It's like a map. The grid lines aren't on the terrain, but if the grid helps me navigate, the grid is... valid."

  "The grid lines are arbitrary," Marcus said. "Latitude and longitude help you navigate, but don't pretend the Equator is a physical river. My worry is that interpretability is going to spend the next decade debating whether Feature 101 is 'more real' than Feature 102, when really they're just different coordinate systems on the same manifold. You're looking for place cells in a system that was trained to be a universal function approximator. It doesn't have a biology that selects for stable, energy-efficient single features. It has a loss function that selects for performance. Sometimes performance looks like features. Sometimes it looks like holographic noise."

  Elena picked up a marker again, uncapped it, then recapped it. "So what would change your mind? If we found a feature that was robust across dictionary sizes? Across seeds? Across architectures?"

  "Maybe," Marcus said. "But even then, you're back to Ramsey. Suppose you find a direction that is perfectly stable across all seeds and perfectly predicts 'betrayal' behavior. I can still write down a causal story: 'Input tokens activate subspace V, which triggers output W.' Why do I need to say 'The model *believes* betrayal is occurring'? What does 'belief' add to the equation?"

  "Because the model might be lying," Elena said quietly.

  Marcus blinked. "What?"

  "Deception. Sycophancy. If we only look at causal roles—input A leads to output B—we miss the internal state where the model knows X but outputs Y. To catch that, we need to identify the internal representation of 'truth' versus the representation of 'what the user wants to hear.' If those are just causal nodes, fine. But if we don't treat them as representational states with content, we can't distinguish between a model that is wrong and a model that is deceptive. The causal role is 'output Y.' The representation is 'knows X.' The gap between them is where the risk lives."

  Marcus was silent for a moment. He looked at the whiteboard, at the messy equations of the reconstruction loss. "That's a pragmatic argument. You're saying we *need* the realist stance for safety, not because it's metaphysically true."

  "I'm saying if the shoe fits and walks like a duck..."

  "I'm saying we might be teaching the duck to quack on command and calling it a bird," Marcus said, but his tone had softened. "Look, I agree we need to find the levers. I just don't want us to confuse the levers for the machinery. If I change the sparsity penalty and the 'betrayal' feature dissolves into three 'conflict' features and one 'history' feature, which one was the real representation? Was the first one a hallucination?"

  "Maybe they were all partial shadows," Elena said. "Plato's cave, but the shadows are high-dimensional vectors."

  "Exactly. So why argue about which shadow is the 'real' object?" Marcus pushed off the doorframe fully. "Maybe the object is the whole activation space, and our dictionary learning is just trying to project it onto 2D paper because humans can't think in ten thousand dimensions."

  "Because we have to intervene," Elena said. "We can't intervene on the whole space. We need handles. And handles need names. And names imply content."

  "Names imply utility," Marcus corrected. "Not truth."

  "Utility is the only truth we can test," Elena said. She finally put a slice of cold pizza on her plate. "But fine. Tell me this: If we find a feature that is invariant across seeds, robust to ablation, and predicts OOD behavior, and you *still* refuse to call it a representation... what evidence would you accept? Is it a metaphysical block? Or is there a test?"

  Marcus thought about it. He looked at the feature visualization again, the bright spots lighting up on the token sequence. "I don't know," he admitted. "Maybe if the feature emerged without us asking for it? Without the sparsity penalty? If the model naturally orthogonalized its own activations..."

  "But it doesn't," Elena said. "It uses superposition. It compresses. That's the whole point."

  "Then maybe the 'representation' isn't in the direction," Marcus said, tapping the board. "Maybe it's in the relationship between directions. Maybe you're looking for nouns in a language that's entirely verbs."

  Elena smiled, a tired, competitive smile. "Then we need a better grammar."

  "Or," Marcus said, turning to leave, "we need to admit we're just drawing constellations in the stars and arguing about whether Orion is real."

  "Orion kills things," Elena called after him. "If I turn off Orion, the stars don't move, but the hunter stops shooting. That looks real enough for me."

  Marcus didn't turn around, just raised a hand in acknowledgment. "We'll see if he shoots the same way when you change the lens."

  The door swung shut. Elena looked back at the board, at Feature 892, and wondered if she was looking at a cell or a shadow. She picked up the marker, wrote *Job Description?* next to the equation, and didn't erase it.
