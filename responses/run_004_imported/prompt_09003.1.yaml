answer: |-
  **MEMORANDUM**

  **TO:** Tenure-Review Committee
  **FROM:** [Your Name]
  **SUBJECT:** Recommendation on Voting Procedure for Tenure Decisions
  **DATE:** October 26, 2023

  **Introduction**

  At our recent meeting, we encountered a structural inconsistency in our voting process known in social choice theory as the *discursive dilemma* (or doctrinal paradox). As our Chair noted, we found that a majority of the committee judged the candidate adequate on Research, and a majority judged the candidate adequate on Teaching, yet a majority voted against granting Tenure.

  This discrepancy arises from the choice between two aggregation procedures:
  1.  **Conclusion-Based:** Voting directly on the final verdict (Grant/Deny Tenure).
  2.  **Premise-Based:** Voting on the constituent criteria (Research/Teaching) and deriving the verdict logically from those votes.

  This memo argues that the committee should adopt a standing rule requiring the **premise-based procedure** for all future tenure cases. While the conclusion-based method appears more democratic on the surface, the premise-based method is essential for maintaining the integrity of our bylaws, ensuring accountability, and upholding the rule of law within our department.

  **The Case for Premise-Based Voting**

  Tenure is not a popularity contest; it is a rule-bound judgment. Our bylaws explicitly state that tenure is granted *if and only if* a candidate meets specific criteria (Research and Teaching). This establishes a logical contract between the candidate and the institution.

  1.  **Enforcement of Bylaws:** The conclusion-based procedure allows committee members to bypass the bylaws. A member can acknowledge that a candidate met all stated criteria but still vote "No" on tenure based on unstated, private, or idiosyncratic reasons. The premise-based procedure forces members to align their votes with the public standards we are sworn to uphold.
  2.  **Transparency and Reason-Giving:** Premise-based voting requires members to take a public stand on specific dimensions of performance. This creates a clear record of *why* a decision was made. If a candidate is denied, we know whether it was for research, teaching, or both. Conclusion-based voting obscures this reasoning, making it difficult to provide constructive feedback or to defend the department against grievances.
  3.  **Consistency Across Cases:** By aggregating judgments on criteria rather than outcomes, we ensure that the "bar" for tenure remains stable over time. Conclusion-based voting allows the threshold for tenure to fluctuate based on the composition of the committee or the specific dynamics of a single case.

  **Addressing the Strongest Objection: The "No-Supporter" Problem**

  The most serious objection to the premise-based procedure is the possibility of what theorists call the "no-supporter" outcome. It is logically possible that the members who vote "Yes" on Research are a different group from those who vote "Yes" on Teaching. In such a scenario, the logical conclusion (Grant Tenure) passes, even if **not a single individual member** votes to grant tenure when asked directly.

  Critics argue this is undemocratic and irrational: *How can we grant tenure to a candidate that no one on the committee actually supports?*

  While this concern is intuitively powerful, it rests on a misunderstanding of the committee's function. We are not aggregating personal preferences; we are aggregating *judgments about truth* relative to our bylaws.

  1.  **Institutional Integrity vs. Individual Preference:** The "no-supporter" outcome is only a paradox if we view the committee as a sum of individual wills. However, the committee is an agent of the department's governance. The bylaws represent the collective will of the faculty, established *ex ante*. When a member votes "Yes" on Research and "Yes" on Teaching, they are certifying a fact about the candidate's record. If the bylaws state that these facts necessitate tenure, the committee is obligated to grant it. To deny tenure in this scenario is to privilege the private, unrecorded preferences of the members over the public, ratified rules of the department.
  2.  **Preventing Hidden Vetoes:** The "no-supporter" problem is the price we pay to prevent unaccountable vetoes. In the conclusion-based procedure (which we just used), a majority denied tenure despite the candidate meeting the criteria. This implies that a majority of the committee effectively added a *third*, unstated criterion (e.g., "collegiality," "fit," or personal bias) to deny the candidate. The premise-based procedure eliminates the ability to hide behind a bottom-line vote. It forces members to either propose adding new criteria to the bylaws or to vote honestly on the existing ones.
  3.  **The Role of Deliberation:** The "no-supporter" scenario is theoretically possible but practically rare in a deliberative body. If a vote tally reveals that the logical outcome is supported by no individual, this serves as a vital signal for *further deliberation*. It invites members to ask: "If we all agree on the premises, why do we hesitate on the conclusion?" This often reveals misunderstandings of the criteria that can be resolved before the final vote is locked. However, if deliberation fails to change their premise votes, members must accept the logical consequence to maintain the credibility of our evaluation system.

  **Recommendation**

  We should adopt the premise-based procedure not because it guarantees outcomes that satisfy every individual's private judgment, but because it guarantees that our outcomes are consistent with our public rules.

  The discomfort of granting tenure in a "no-supporter" scenario is preferable to the alternative: denying tenure to a candidate who has satisfied all published requirements. The latter exposes the department to legitimate grievances and erodes trust in the tenure process. The former, while awkward, demonstrates that the department respects its own laws more than the transient preferences of its committee members.

  **Proposed Standing Rule:**
  *"In all tenure reviews, the Committee shall vote separately on each criterion mandated by the bylaws (e.g., Research, Teaching). A positive verdict on the grant of tenure shall be determined by the logical application of the bylaws to the results of these criterion votes, rather than by a direct vote on the tenure grant itself."*

  By adopting this rule, we ensure that our tenure decisions are defensible, transparent, and faithful to the standards we have set for ourselves and our colleagues.
