  2.  **Character Conception:**
      *   *Defender:* Let's call her **Elena**. She's pragmatic, maybe leans towards David Albert's "Time and Chance" framework. She values predictive success and the practical necessity of the Past Hypothesis.
      *   *Critic:* Let's call him **Marcus**. He's the Huw Price disciple. He's rigorous about logical symmetry and skeptical of ad hoc posits.
      *   *Setting:* A quiet corner of a conference hall, maybe after a contentious panel. Coffee in hand.

  3.  **Key Arguments to Deploy:**
