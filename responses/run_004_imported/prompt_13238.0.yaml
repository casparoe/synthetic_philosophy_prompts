          *   The Skeptical Catastrophe: If you apply symmetry without PH on both ends, the most likely state is equilibrium. Therefore, your memories are likely fluctuations.
          *   To avoid skepticism, you need a *Future* Hypothesis too, or admit the PH is doing too much work without justification.

  4.  **Drafting - Section by Section:**

