answer: |-
  Here are 10 interview questions designed to press the constitution view on its weakest points, specifically targeting the grounding problem, proliferation of entities, and the generality of the theory. Each includes a targeted follow-up to prevent the "brute fact" or "derivative property" dodge from ending the line of inquiry.

  **1. The Grounding Problem (Modal vs. Categorical)**
  "Let's start with the core tension. On your view, the statue and the lump share every categorical property—the same particles, same arrangement, same location, same microphysical structure. Yet, they differ in their modal properties: the lump survives being squashed, the statue does not. If supervenience holds, modal differences must be grounded in categorical differences. But by your own admission, there *are* no categorical differences during the period of coincidence. So, what exactly *grounds* the truth of the claim that only one of these objects survives the squashing?"
  *Follow-up:* "If you say this modal difference is ungrounded or 'brute,' aren't you effectively admitting that the identity conditions of objects are disconnected from what those objects *are* physically? At what point does positing a brute modal fact stop being a metaphysical insight and start being an explanatory failure?"

  **2. The 'Too Many Objects' Problem (Weight and Value)**
  "Critics often argue that constitution without identity leads to an explosion of objects. If the statue and the lump are numerically distinct, do we have two things weighing exactly one kilogram sitting on the pedestal? Do we have two distinct artworks? If the statue is valuable and the lump is just raw material, does the coincidence create a second entity that somehow inherits the artistic value? If so, isn't this multiplying reality for free wherever we have a shape?"
  *Follow-up:* "You might say the lump only 'derivatively' possesses the weight or value. But if I put the pedestal on a scale, does the scale register the weight of one object or two? If it registers one, in what robust sense are there two distinct weight-bearers? If it registers two, physics seems to disagree with your metaphysics."

  **3. The Dion and Theon Puzzle (Generality)**
  "I want to test if this is a general theory of coincidence or just a fix for artifacts. Consider Chrysippus's puzzle: Dion is a man; Theon is 'Dion minus one foot.' If Dion steps on a mine and loses that foot, Theon (who lacked the foot already) seems to survive while Dion perishes, or vice versa. Does your constitution model apply here? Is 'Dion' constituted by a human organism in the same way a statue is constituted by clay, or does the metaphysics shift when we move from artifacts to biological life?"
  *Follow-up:* "If you say the metaphysics shifts, what justifies the shift? Is there a principled difference between a 'primary kind' like *Person* versus *Statue* that blocks the Dion/Theon paradox, or are you forced to accept that in cases of amputation, two people momentarily coincide where only one seemed to exist before?"

  **4. The Counting Question**
  "During the period of total coincidence, if I ask 'How many things are on the pedestal?', what is the correct answer? If I say 'one,' I seem to be ignoring the lump. If I say 'two,' I seem to be violating the intuition that they occupy the same space. Lynne Rudder Baker suggests we count by 'primary kinds,' but doesn't that make counting relative to our conceptual scheme rather than objective reality?"
  *Follow-up:* "If counting is kind-relative, doesn't that collapse into a form of conceptualism? If the universe doesn't 'count' two things until a concept-user arrives to distinguish the kind *Statue* from the kind *Lump*, aren't the persistence conditions mind-dependent?"

  **5. Causal Exclusion and Overdetermination**
  "If the statue and the lump are distinct, do they both cause the shadow cast on the wall? Do they both cause the crack in the pedestal if they fall? If both objects are causally sufficient for the effect, aren't you committed to systematic causal overdetermination? And if they *share* the causal power, doesn't that suggest they are, in the only sense that matters, the same object?"
  *Follow-up:* "Defenders often say the statue causes the shadow *in virtue of* the lump causing it. But if the lump is doing all the causal heavy lifting, what causal work is left for the statue to do? If the answer is 'none,' is the statue causally inert, and if so, why posit its existence?"

  **6. The 'Brute Fact' Dodge (Property Inheritance)**
  "I anticipate the response that the statue 'inherits' properties like weight or shape from the lump without identity. But inheritance usually implies a transfer between distinct entities. Here, they are coincident. Is the relation of 'constitution' just a primitive, unanalyzable relation? If so, how is this theoretically superior to simply saying identity is relative or that objects are four-dimensional worms?"
  *Follow-up:* "If constitution is primitive, doesn't that make it a theoretical stopper? You're essentially saying 'they are distinct because they are constituted.' But if I ask 'what is constitution?', and the answer is 'the relation that allows distinctness without separation,' haven't we just renamed the problem?"

  **7. The Person Case (Too Many Thinkers)**
  "You extend this view to persons: I am constituted by my body, but I am not identical to it. This invites the 'Too Many Thinkers' objection. If my body is physically identical to me and located where I am, and the body has a functioning brain, isn't the body also thinking? Am I sitting here with a silent, thinking animal body that is numerically distinct from me?"
  *Follow-up:* "If you deny the body thinks, you seem to violate biological continuity. If you admit the body thinks, we have two thinkers. If only *I* think, what physical difference between me and the body grounds my exclusive capacity for thought? Is it just the 'first-person perspective,' and is that property physically grounded or something else?"

  **8. Temporal Coincidence vs. Identity**
  "Consider the time before the sculptor arrived. The lump existed, the statue did not. Then they coincide. Then the statue is destroyed, and the lump remains. If they are distinct, they have different temporal parts. But during the coincidence, they are perfectly co-located. Why isn't the most parsimonious explanation that the statue is just a *temporal stage* of the lump, rather than a distinct object riding on top of it?"
  *Follow-up:* "If you reject the temporal stage view to save the intuition that the statue is a genuine object, aren't you prioritizing folk intuition over ontological simplicity? Why should our pre-theoretical desire to treat statues as objects dictate the fundamental structure of reality?"

  **9. The Unity of the Constituter**
  "You treat the 'lump of clay' as one of the relata. But what makes the clay a unified object? Is it just the sum of its particles? If the lump is just a mereological sum, and the statue is a functional object, aren't you comparing two different *categories* of being? Is the real problem just that we are confusing mereological sums with functional unities?"
  *Follow-up:* "If the lump is just a sum, it exists wherever the particles exist. If the statue is a functional unity, it exists only when the form holds. If they are distinct, does the lump cease to be a 'lump' when it becomes a statue, or does it remain a lump *and* become a statue? If the latter, we are back to the multiplication problem."

  **10. Theoretical Virtues and Rivals**
  "Finally, let's zoom out. The main rival to your view is four-dimensionalism (perdurance), which says the statue and lump are distinct because they have different temporal parts, avoiding the coincidence problem entirely. What specific theoretical virtue does the 'constitution without identity' view have that perdurance lacks? Why should we accept coincident objects in 3D space rather than distinct spacetime worms?"
  *Follow-up:* "If the answer is that 3D constitution preserves our intuition of 'enduring' objects, isn't that a psychological benefit rather than a metaphysical one? Is it worth the cost of the grounding problem and causal overdetermination just to save the intuition that objects endure through time?"
