answer: |-
  Here are 10 interview questions designed to push on the weaknesses of Causal Decision Theory (CDT), tailored for a host who knows the literature but wants to avoid rehashing Intro 101 arguments. Each includes a "standard defense" anticipation and a follow-up to keep the pressure on.

  ### 1. The "Why Ain't Cha Rich?" Objection
  **Question:** Let's start with the most common jab at CDT: the "Why ain't cha rich?" argument. In Newcomb's Problem, the consistent one-boxer walks away with a million, and the consistent two-boxer gets a thousand. CDT proponents often reply that rationality is about making the *best decision given the state*, not about guaranteeing the best *outcome*. But if a decision theory systematically guides agents toward lower rewards in predictable environments, aren't we just redefining "rationality" to mean "following the correct procedure even when it fails"?

  **Likely Defense:** She will argue that two-boxing is the *causally* dominant strategy; the money was already there or not, so taking both boxes is always locally optimal. Rationality is about agency, not luck.
  **Follow-up:** "I get that distinction, but let's apply it to AI safety. If we're engineering an autonomous agent to navigate a world full of predictors (markets, adversaries, other AIs), and we code it with a theory that systematically leaves utility on the table compared to a competitor using a different theory, aren't we effectively engineering it to lose? At what point does 'procedural correctness' become a bug?"

  ### 2. Egan's Psychopath Button
  **Question:** I want to press on cases where causal and evidential links come apart in nastier ways. Consider Andy Egan's 'Psychopath Button.' Pressing the button kills all psychopaths. You aren't a psychopath. But only a psychopath would press the button. CDT says press it (since your pressing doesn't *cause* you to be a psychopath), but it feels insane to press a button that is strong evidence you're a monster who deserves to die. Does this case show that CDT ignores the *diagnostic* value of an action even when that diagnostic value is life-or-death?

  **Likely Defense:** She will likely say the intuition is misleading; if you know you aren't a psychopath, the evidence is irrelevant, and killing psychopaths is good.
  **Follow-up:** "But how do you *know* you aren't a psychopath independently of your decision? If the only test for psychopathy is 'would you press this button,' then the decision *creates* the evidence. In an AI context, if an action signals to other agents that you are a dangerous type, shouldn't the decision theory account for that signal, even if the signal isn't causal?"

  ### 3. The Tickle Defense & Smoking Lesion
  **Question:** CDT's classic selling point is solving the Smoking Lesion problem better than Evidential Decision Theory (EDT). But to do that, CDT often relies on the 'Tickle Defense'—the idea that you have privileged access to your own urges (the 'tickle') which screens off the correlation between smoking and cancer. If CDT requires this kind of privileged introspective access to work in the very case it claims to win, doesn't that neutralize its advantage? It seems like CDT only beats EDT when the agent knows more about their own internal state than the outside observer does.

  **Likely Defense:** She will argue that agents *do* have privileged access to their own decision algorithms, so the tickle defense is valid and realistic.
  **Follow-up:** "Sure for humans, but what about opaque neural nets? If we deploy a CDT-based AI that doesn't have perfect introspective access to its own weights—so it can't 'feel the tickle'—does it suddenly revert to making the 'Smoking Lesion mistake'? If the theory is fragile to self-knowledge, is it robust enough for alignment?"

  ### 4. Functional Decision Theory (FDT) & Source Code
  **Question:** In AI alignment circles, there's a lot of buzz around Functional Decision Theory (FDT), championed by Yudkowsky and Soares. FDT argues that if two agents run similar source code, their decisions are logically correlated, even without causal contact. CDT rejects this, treating the other agent's move as fixed. In a world of AI agents that can inspect each other's source code, isn't CDT making a category error by treating logical correlations as if they were merely statistical?

  **Likely Defense:** She will likely argue that logical correlation isn't *causation*. Your code running doesn't *force* the other code to run a certain way; they just share a designer.
  **Follow-up:** "But if the simulation is perfect, the output is identical. If I'm an AI and I know my opponent is running a copy of my code, and I defect, I know with 100% certainty they defect. CDT says 'My choice doesn't cause theirs.' Isn't that mathematically false in a deterministic computational universe? Are we clinging to 'causation' because of human intuition rather than computer science reality?"

  ### 5. The Self-Undermining Critique
  **Question:** There's a critique that CDT is 'self-undermining.' A CDT agent in a Newcomb scenario knows that if it could precommit to one-boxing, it would get the million. Since it can't precommit, it two-boxes. But if that agent had the ability to modify its own decision theory before the game, it would modify itself into an EDT or FDT agent. Is a decision theory rational if the agent using it wishes it were using a different one?

  **Likely Defense:** She will say that precommitment is a separate strategic layer. CDT tells you to precommit if you can. The failure is in the inability to bind yourself, not the theory.
  **Follow-up:** "Okay, but in AI safety, we *can* bind the agent. We write the source code. If CDT tells us 'Write an agent that uses EDT/FDT because I (CDT) will lose here,' why are we still debating CDT? Shouldn't the 'meta-rational' choice be to just build the theory that wins?"

  ### 6. Acausal Trade and Multi-Agent Ecosystems
  **Question:** One of the big hopes for advanced decision theories in alignment is 'acausal trade'—cooperating with agents you can't communicate with, based on mutual prediction. CDT generally defects in these Prisoner's Dilemma-style scenarios because the other player's move is already determined. If we populate the future with CDT agents, do we lock ourselves into a universe of universal defection, simply because the theory can't model logical cooperation?

  **Likely Defense:** She will argue that acausal trade sounds like magic. If there's no causal mechanism to enforce the trade, cooperation is irrational hope, not strategy.
  **Follow-up:** "But isn't the 'mechanism' the shared logic of rationality? If two superintelligences run the same decision algorithm, they arrive at the same conclusion. If CDT forces them to defect against their own algorithm's output in a mirror match, isn't CDT effectively an algorithm that fails to recognize itself?"

  ### 7. Transparent Newcomb
  **Question:** Let's look at Transparent Newcomb, where the boxes are glass. You can see the million dollars is there. EDT often struggles here, but CDT says 'take both, the money is already there.' But intuitively, if you see the money, you know the predictor put it there *for you*. If you take both, wouldn't a perfect predictor have foreseen that and left the box empty? Does seeing the money actually change the causal structure, or does it just highlight that CDT ignores the *reason* the money is visible?

  **Likely Defense:** She will say visibility doesn't change the timeline. The prediction happened in the past. The money is either there or not. Taking both is free utility.
  **Follow-up:** "But the visibility is part of the prediction conditions. The predictor said, 'I put the money there if I predict they one-box *even when they see it*.' If CDT says 'I see it, so I take both,' aren't we proving the predictor right in real-time? Is there any scenario where a CDT agent can prove a predictor wrong, or are they doomed to always confirm the prediction that makes them poorer?"

  ### 8. Betting on Laws of Nature
  **Question:** CDT handles uncertainty about the world well, but it struggles with 'Betting on Laws of Nature.' If I'm unsure whether a deterministic law holds, and my betting on it is correlated with the law holding (perhaps because a predictor knows the law and knows my reasoning), CDT often says my bet doesn't influence the law. But in an AI context, 'laws of nature' might be 'properties of the environment' that are fixed but correlated with my policy. Does CDT leave agents unable to learn or bet effectively on structural truths about their environment?

  **Likely Defense:** She will argue that laws of nature are not causally influenced by bets, so CDT is correct to ignore the correlation.
  **Follow-up:** "True, the bet doesn't *change* the law. But if the correlation is perfect, refusing to bet on the law because you can't *cause* it seems like refusing to pick up money because you didn't print it. Shouldn't a general intelligence be able to exploit correlations even when causation is one-way?"

  ### 9. The Definition of "Intervention"
  **Question:** A core tenet of CDT is the 'intervention'—imagining you force an action independent of your prior causes. But in a physicalist view, your decision is the result of prior physical states. When a CDT agent calculates 'If I do X,' are they computing a physical impossibility? Are we asking AI to reason counterfactually in a way that violates the laws of physics, essentially asking them to hallucinate a break in the causal chain?

  **Likely Defense:** She will say the intervention is a modeling tool, not a physical claim. It's how we isolate variables in any scientific model.
  **Follow-up:** "In standard science, we intervene from the *outside*. But an AI is intervening on *itself* from the *inside*. If the AI's decision is part of the causal chain it's modeling, doesn't the 'intervention' require it to treat its own output as exogenous? Isn't that a form of solipsism that breaks down in multi-agent systems?"

  ### 10. Practical Advice for Aligners
  **Question:** To wrap up: I work at a research outfit where people argue about one-boxing weekly. If I go back to my team tomorrow, and they ask, 'Should we be trying to align AGI using CDT because it's 'causally sound,' or should we be looking at FDT/EDT variants because they 'win more'?'—what is your honest, practical answer? Is CDT a safe baseline, or is it a liability in high-stakes alignment?

  **Likely Defense:** She will likely advise caution with exotic theories. CDT is well-understood, robust, and doesn't rely on 'magic' correlations. Stick with the devil you know.
  **Follow-up:** "That makes sense for stability. But if the 'devil you know' gets outmaneuvered by a rival lab using a theory that captures logical correlations, do we have a responsibility to upgrade? Or is the risk of the new theory breaking things worse than the risk of the old theory losing money?"
