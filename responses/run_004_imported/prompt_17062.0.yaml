prompt: |-
  A friend from my old grad school reading group -- she went into philosophy of physics, I ended up teaching ethics -- died a few weeks ago out of nowhere, a brain aneurysm. She was a committed Everettian who loved bringing up Tegmark's quantum suicide setup at parties, half-joking, to argue that from the inside you never actually experience the branch where you died, so in some sense shes still around somewhere. She left a note for whoever spoke at the memorial: don't make her a ghost story, but don't let some smart-ass colleague smugly debunk it either -- just get the reasoning right. That's me, no idea why they didn't ask one of her actual physicist friends, but here we are. Half the room is her physics people, who'll absolutely notice if I botch the measure/anthropic stuff; the other half is her mom and old college friends who's never even heard of Everett and just want to grieve. Write the eulogy -- it has to be honest that on her own view, nobody left in this room is obviously getting any comfort out of any of this, while still landing as a eulogy and not a colloquium talk.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** An ethicist (old grad school friend), not a physicist.
      *   **Deceased:** A philosopher of physics, committed Everettian (Many-Worlds Interpretation proponent).
      *   **Cause of Death:** Sudden brain aneurysm.
      *   **Deceased's Wish:** No ghost stories, no smug debunking, get the reasoning right.
      *   **Audience:** Split 50/50 between physicists (who know the theory) and laypeople/family (who don't, just want to grieve).
      *   **Tone:** Honest about the lack of comfort in her specific worldview, but still functioning as a eulogy (warm, commemorative, meaningful). Not a lecture, but intellectually rigorous enough for the physicists.
      *   **Key Concept:** Quantum Suicide/Immortality (Tegmark), Everettian branching, subjective continuity vs. objective loss.

  2.  **Deconstruct the Philosophical Challenge:**
      *   *The Everettian View:* All possible outcomes happen. In some branches, she survived. In *this* branch, she died.
      *   *The "Quantum Suicide" Idea:* From the *first-person perspective*, you only experience the branches where you survive.
      *   *The Problem for the Living:* This offers comfort to *her* (in the branches where she lives), but zero comfort to *us* (in this branch where she died). We are left in the "dead friend" branch.
      *   *The Ethical/Emotional Angle:* How do we grieve when the deceased explicitly rejected the finality of death in a technical sense, yet we feel the finality acutely?
      *   *The Constraint:* "Don't make her a ghost story" (no spiritualism) vs. "Don't let some smart-ass colleague smugly debunk it" (respect the theory).

  3.  **Determine the Structure:**
      *   **Opening:** Acknowledge the awkwardness/my role. Establish the connection (ethics vs. physics).
      *   **The Theory (Simplified):** Explain her view without jargon. The "Branching" metaphor.
      *   **The Hard Truth:** Acknowledge that *this* branch is the one where she's gone. Don't offer false hope to the audience based on her theory.
      *   **The Shift (Ethical/Emotional):** Move from metaphysics to memory/impact. Even if branches exist, *this* reality is where her impact landed.
      *   **The "Quantum Suicide" Reference:** Address her party trick gently. Acknowledge the logic but center the human cost.
      *   **Closing:** A commitment to remember her in *this* world. A toast/salute that bridges the gap.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with the instruction she left. It sets the tone immediately. "Get the reasoning right." Acknowledge I'm an ethicist, not a physicist.
      *   *Explaining Everett:* Need a metaphor that works for Mom and the physicists. "The book of reality has infinite pages." In some pages, she's still here. In this one, she isn't.
      *   *Addressing the Comfort Gap:* This is crucial. I can't tell the mom "She's alive in another universe." That violates the "no ghost story" rule and ignores the grief of *this* branch. I need to say: "Her theory says she might be safe, but it doesn't save us from missing her."
      *   *The "Quantum Suicide" bit:* She loved this thought experiment. I should mention it. But I need to frame it as her intellectual playfulness, not a promise of resurrection. It was her way of staring down the void.
      *   *The Ethical Turn:* Since I'm an ethicist, what's my contribution? Value isn't just about existence; it's about *relationship*. The weight of this branch matters because *we* are in it.
      *   *Conclusion:* Bring it back to the room. We are the witnesses in this branch.

  5.  **Refining the Tone (Self-Correction during drafting):**
      *   *Critique:* Is it too cold?
      *   *Fix:* Add specific memories. The reading group. The parties. Her laugh.
      *   *Critique:* Is it too technical?
      *   *Fix:* Keep the physics metaphors high-level. Focus on "branches" and "perspective."
      *   *Critique:* Does it follow her note?
      *   *Fix:* Ensure I don't claim she's "watching over us" (ghost story) and don't say "Many Worlds is nonsense" (debunking). Stick to: "This is what she believed, and here is what it means for us."

  6.  **Final Polish:**
      *   Check the rhythm. Eulogies need pauses.
      *   Ensure the "Quantum Suicide" mention doesn't sound like I'm making fun of her. It was her "half-joking" shield.
      *   Make sure the ending lands on love/memory, not just physics.

  7.  **Key Phrase Integration:** "Get the reasoning right." "This branch." "Subjective continuity."

  *(Self-Correction Note: Make sure to explicitly address the mother. She needs to know her daughter isn't being reduced to a thought experiment.)*

  8.  **Final Review against constraints:**
      *   Honest about lack of comfort? Yes.
      *   Not a colloquium? Yes, keeps tech light.
      *   Respects the note? Yes.
      *   Bridges the audience gap? Yes.

