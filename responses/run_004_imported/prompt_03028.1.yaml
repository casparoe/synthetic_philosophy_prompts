answer: |-
  This is an exceptionally strong draft. You have clearly done the reading, and you have managed to capture the specific *texture* of Einstein's political thought, which is often glossed over in pop culture.

  Here is a breakdown regarding your two specific questions, followed by a few minor suggestions on voice and phrasing.

  ### 1. Accuracy and Compression
  **Is this a fair compression of the argument?**
  Yes. In fact, your instinct to prioritize the ethical claim ("moral injury") over historical inevitability makes this *more* accurate to Einstein, not less.

  Einstein was a ethical socialist, not a Marxist-Leninist. He did not believe in "dialectical materialism" or the scientific inevitability of socialism. He explicitly states in *Why Socialism?* that economics is not physics. He argues for socialism not because history demands it, but because human suffering demands it.
  *   **The "Moral Injury" vs. "Inevitability":** An orthodox Marxist in 1949 might argue that capitalism contains the seeds of its own destruction. Einstein argues that capitalism contains the seeds of human *crippling*. Your draft captures this distinction perfectly. He is arguing from humanism, not historical materialism.
  *   **The Historical Scaffolding:** You asked if skipping the specific anthropological history (conquering peoples, priesthoods, land monopolies) is a distortion. In a novel, it is not. In the essay, Einstein uses that history to prove that economic behavior is culturally determined, not biologically fixed. Your line—"frozen habits of one especially rapacious period of history mistaking itself for permanent human nature"—captures the *conclusion* of that historical argument without requiring a lecture on feudal land grants. It is a smart dramatic compression.

  ### 2. The Bureaucracy Warning
  **Does the closing worry feel earned, or like a hedge?**
  It feels earned, provided the delivery is right.

  In the actual essay, the warning about bureaucracy is not a postscript or a "cover your ass" move; it is the climax of the piece. Einstein admits that a planned economy is merely a *means*, not an *end*, and that it carries the risk of "complete enslavement."
  *   **Why it works here:** You have structured the speech so that the bureaucracy warning arises logically from his critique of power. He argues that private owners distort democracy through power. The natural follow-up question is: "Won't state planners just become new owners?" By having Einstein answer that before she asks it, you show his intellectual honesty.
  *   **The "Hedge" Perception:** It might read as a hedge to a modern reader looking for a partisan soundbite, but to a reader who knows the history, it reads as Einstein's defining political trait: a refusal to trade one dogma for another. He is admitting ignorance ("no one... has yet designed the office that keeps the planners honest"). That vulnerability makes it feel earned.

  ### 3. Suggestions on Voice and Phrasing
  While the philosophy is sound, there are two small tweaks I would consider to ensure the voice feels like 1950s Einstein rather than 2020s Academic.

  **A. "Moral Injury"**
  The phrase "moral injury" is heavily associated with modern PTSD literature and contemporary ethics (largely post-1990s). While the *concept* is timeless, the specific collocation might ping as anachronistic to a careful reader.
  *   **Einstein's phrasing:** In the essay, he writes about the "crippling of individuals" and the "waste of human effort."
  *   **Suggestion:** Consider something like: *"I call that a crippling of the spirit, not merely an inefficiency"* or *"a moral deformity."* "Deformity" fits his era's medical/scientific vocabulary better.

  **B. Rhythm and Syntax**
  Einstein spoke English well, but his cadence was often Germanic—slightly formal, precise, and prone to placing the verb at the end of a clause. He was also humble.
  *   **Current:** *"It isn't because I've found some science that makes socialism as certain as starlight bending around the sun..."*
  *   **Critique:** This is lovely. The reference to the 1919 eclipse is perfect for his self-awareness regarding his own fame.
  *   **Current:** *"...most of what passes for its laws are just the frozen habits..."*
  *   **Critique:** "Just the frozen habits" is a bit colloquial. Einstein might say, *"are nothing more than the frozen habits..."*
  *   **Current:** *"...at one remove, the parties that stand for election..."*
  *   **Critique:** "Stand for election" is fine, but "contend for office" might have a slightly more period-appropriate ring.

  ### Revised Draft Suggestion (incorporating minor voice tweaks)
  Here is a version with those tiny calibrations applied, just for comparison:

  > "You want to know why a man who has spent his life prizing one mind's free play against a problem should end up arguing for collective ownership. It isn't because I have found some science that makes socialism as certain as starlight bending around the sun. Economics is not astronomy, whatever it likes to pretend. Most of what passes for its laws are nothing more than the frozen habits of one especially rapacious period of history mistaking itself for permanent human nature.
  >
  > "My reasons are humbler and, I think, harder to shake. I look at what unregulated competition does to a person before he is old enough to have chosen anything for himself—the anxious, grasping posture our schools reward—and I call that a crippling of the spirit, not merely an inefficiency. And I look at what happens to a democracy once a handful of men own the factories and the newspapers and, at one remove, the parties that contend for office: the citizen keeps his vote and loses the information he would need to spend it wisely.
  >
  > "Planning the economy might cure some of this. I will not pretend it cures all of it. A planned economy policed by an unanswerable bureaucracy could enslave a man as completely as any factory owner ever did. No one, including me, has yet designed the office that keeps the planners honest."

  ### Final Verdict
  You are on solid ground. The passage respects the source material without being enslaved by it. The emphasis on the ethical over the dogmatic is exactly where Einstein stood, and the inclusion of the bureaucratic warning saves the character from becoming a propaganda mouthpiece. It portrays him as a thinker who understands that solving one power dynamic often creates another—a very fitting theme for a novel set in the early Cold War.

  The FBI subplot you mentioned pairs perfectly with this: the agent sees the word "Socialism" and sees disloyalty; Einstein speaks the word and sees a moral imperative fraught with unsolved dangers. That tension is your scene's engine. Keep it.
