  **Move 1 (Owen):** Owen is technically correct on the mathematics. The Price Equation does allow variance to be partitioned equivalently into kin-selected (relatedness) and multilevel (group/individual) components, and under standard assumptions, they yield identical predictions for gene frequency change. This "formal equivalence thesis" is a well-established result in evolutionary theory (e.g., Queller 1992). However, his inference that this reduces the debate to mere "bookkeeping" is a philosophical leap, not a mathematical necessity, which leaves him vulnerable to Leah's counter.

  **Move 2 (Leah):** Leah correctly identifies that mathematical equivalence does not entail explanatory equivalence. In philosophy of science, distinct formalisms can illuminate different causal structures or mechanisms even if they predict the same outcomes (similar to her Newtonian/Lagrangian analogy). By emphasizing that the choice of decomposition reflects claims about population structure and causal pathways, she successfully challenges Owen's deflationary "bookkeeping" conclusion without denying the math.

  **Move 3 (Owen):** Owen's appeal to falsifiability is consistent with his rationalist framing, but his argument falters on two counts. First, he mischaracterizes physics practice; physicists often prefer specific formalisms because they reveal different symmetries or make certain problems tractable, which supports Leah's point about explanatory utility. Second, dismissing the causal question as "unfalsifiable" ignores that causal models are evaluated by their interventionist utility, not just observational prediction. He fails to address Leah's core point about explanation.

  **Move 4 (Leah):** Leah delivers the strongest move by attacking the premise of perfect equivalence. She correctly notes that the mathematical mapping between kin and multilevel selection often relies on idealizations like additive fitness effects and weak selection. In cases of strong selection or non-linear synergy (epistasis), the partitions can diverge or become biologically opaque. Furthermore, her point about research heuristics—that frameworks guide which empirical questions get asked—is a robust sociological and methodological argument that Owen's formalism ignores.

  **Missing Points:** Both participants treat the Price Equation as a causal model rather than a statistical tautology. The equation describes change but does not specify causal structure without additional assumptions (e.g., causal graphs). Additionally, neither mentions *evolutionary transitions in individuality*; the debate is most substantive when asking how new higher-level units (like multicellular organisms) emerge, where group structure is dynamic rather than fixed. Finally, practical data availability often dictates the choice of framework (e.g., measuring relatedness vs. group fitness), a pragmatic constraint neither fully explores.
