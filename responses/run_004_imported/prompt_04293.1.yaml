answer: |-
  It is a pleasure to converse with someone who can appreciate both the chemical pedigree of William Crookes and the philosophical weight of Henry Sidgwick. Your background in industrial chemistry actually gives you a distinct advantage here: you are trained to distinguish between signal and noise, and to understand the difference between a systematic error and a random anomaly. Sidgwick is essentially trying to articulate a protocol for handling "signal detection" in a field where the noise (fraud, delusion, error) is historically maximal.

  You have put your finger on the exact tension that makes Sidgwick's address so fascinating. To answer your questions directly: Sidgwick is not being merely resigned, nor is he ignoring the logical gap you identified. He is proposing a **probabilistic squeeze**, and yes, he is almost certainly engaging with Hume, though he is attempting to invert Hume's conclusion through sheer volume of testimony.

  Here is how the strategy works, viewed through the lens of both philosophy and your experience in the lab.

  ### 1. The "Heap of Facts" vs. The "Trick" Accusation
  You asked: *That move doesn't seem to get any harder to make as the evidence pile grows — you can say "the investigator is in the trick" about fact number 500 just as easily as about fact number one.*

  Logically, you are correct that the *assertion* is equally easy to make. However, Sidgwick (and De Morgan, whom he cites) is relying on **independent corroboration** to make the assertion increasingly *costly* to maintain.

  In your line of work, if you run an assay once and get an anomalous result, a peer reviewer might suggest contamination. If you run it 500 times in the same lab with the same reagents, they might suggest a systematic error in your protocol. But if 50 different labs, using different reagents and protocols, all report the same anomaly, the "contamination" hypothesis requires a conspiracy of contamination.

  Sidgwick's "heap of facts" is not intended to be 500 experiments conducted by William Crookes in his private laboratory. The SPR was founded specifically to diversify the "investigator" variable. The strategy relies on the **conjunction of probabilities**.
  *   Hypothesis A (Psychical Phenomena are real): Requires accepting a new, strange natural law.
  *   Hypothesis B (The Skeptic's Defense): Requires accepting that Investigator 1 is a fraud, AND Investigator 2 is a fraud, AND Investigator 3 is a fraud... all independently, without collusion.

  Sidgwick is arguing that as the "heap" grows (provided it comes from witnesses with "credit," i.e., reputational capital), the probability of Hypothesis B (a massive, undetected conspiracy of reputable men) eventually becomes *more* improbable than Hypothesis A. He is trying to make the skeptic's "out" (the fraud accusation) more miraculous than the phenomenon itself.

  When he says, *"When he has nothing else left to allege he will allege that,"* he is acknowledging that the fraud accusation is the **skeptic's null hypothesis**. His goal is to raise the burden of proof for the skeptic. He wants to reach a point where accusing Crookes, Wallace, Barrett, and Richet of being either dupes or charlatans is socially and logically more absurd than accepting the data.

  ### 2. The Hume Connection
  You asked: *Is Sidgwick likely consciously responding to Hume... or is that reading too much into some off-the-cuff remarks?*

  It is absolutely not reading too much into it. Sidgwick was one of the most rigorous scholars of the 19th century. His *Methods of Ethics* is a cornerstone of utilitarian thought. He knew Hume inside and out.

  Sidgwick is directly engaging with Hume's argument in *"Of Miracles."* Recall Hume's maxim: *"No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact, which it endeavours to establish."*

  Hume generally assumed that the "uniform experience" of natural law was so strong that human testimony could never outweigh it. Sidgwick is accepting Hume's framework but rejecting his pessimism about testimony.
  *   **Hume:** The prior probability of a miracle is so low that testimony cannot overcome it.
  *   **Sidgwick:** The prior probability of "scientific incredulity" is high (like Hume's natural law), but we can overcome it if we accumulate enough *independent* testimony from high-credit witnesses.

  Sidgwick is essentially trying to operationalize Hume. He is saying, "Okay, David, you want testimony that is more miraculous than the fact? We will give you a mountain of testimony from the most credible men in science. We will make the falsehood of our collective report more 'miraculous' (i.e., implausible) than the existence of telepathy."

  ### 3. Resignation or Realism?
  Is he being wry/resigned? There is a touch of weariness, but it is primarily **strategic realism**.

  Sidgwick was not a spiritualist; he was a skeptic who wanted to know if the phenomena were real. He knew that the "Trick" accusation was the ultimate unfalsifiable claim. In philosophy of science terms, it's a "get-out-of-jail-free" card that protects the prevailing paradigm from falsification.

  By stating this explicitly in his inaugural address, Sidgwick is inoculating the Society. He is telling his members: *"Do not be discouraged when you have controlled for light, distance, and collusion, and the critic still calls you a liar. We predicted this. It is the final defense of the old paradigm. We must simply continue to pile up the facts until the lie becomes untenable."*

  He is shifting the ground from **Proof** (which implies a single knockdown argument, common in mathematics or logic) to **Evidence** (which implies a cumulative case, common in law and geology). As a chemist, you know that you rarely "prove" a structure with a single test; you build a preponderance of evidence (NMR, IR, Mass Spec, X-ray) until alternative structures are untenable. Sidgwick is arguing that psychical research requires a "structural elucidation" of reality, and that requires multiple methods and multiple investigators.

  ### Summary
  Sidgwick is not undercutting his plan; he is defining the battlefield. He admits that the skeptic's final move is to attack the *observer* rather than the *observation*. His counter-move is to make the number of observers so large, and their collective reputation so high, that attacking them all becomes a greater violation of "common sense" than accepting the phenomena.

  It is a bold, perhaps overly optimistic, application of empiricism to the supernatural. History, of course, did not bear him out—the "heap of facts" was eventually explained by better understandings of psychology, probability, and magic tricks—but logically, his strategy was a coherent attempt to solve the Humean problem of testimony through statistical weight.

  It is a poignant thought: the man who discovered Thallium and the Radiometer, and the man who wrote *The Methods of Ethics*, joining forces to argue that if enough serious men say they saw a ghost, science must listen.
