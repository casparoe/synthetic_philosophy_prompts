      *   *Is Mill a Rule Utilitarian?* Scholars debate this. Better to phrase it as "indirect utilitarianism" or focus on the "permanent interests" aspect to avoid getting bogged down in taxonomy.
      *   *Bentham on Disgust:* Bentham explicitly argues that the pain of disgust should *not* count because it is based on false prejudice. This is a crucial nuance. He tries to sanitize the inputs of the calculus.
