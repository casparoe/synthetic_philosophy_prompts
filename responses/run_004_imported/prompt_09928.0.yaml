      *   *Wait, is it exactly Nash?* Tennenholtz defines it as a Nash Equilibrium of the "program game." So yes. The key is that the strategy space changed. CE keeps the strategy space (actions) but changes information. PE changes the strategy space (programs).
      *   *Crucial distinction:* CE = Same actions, more info. PE = Different actions (functions), transparency.

