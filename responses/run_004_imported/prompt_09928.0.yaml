          *   CE in one-shot PD: Only (D, D).
          *   PE in one-shot PD: Can support (C, C).
          *   Conclusion: PE outcomes $\not\subseteq$ CE outcomes.
      *   **Mechanism Difference:**
          *   CE: Trusted third party sends private signals. No binding commitment.
          *   PE: Code is public/inspectable. It acts as a *binding commitment device*. If the code says "I will defect if you defect," that's a threat/promise that is executed automatically.
      *   **Theoretical Framing:**
          *   CE expands the *information structure* (signals).
          *   PE expands the *strategy space* (functions from code to actions) and introduces *transparency*.
          *   Analogy: CE is like a traffic light. PE is like smart contracts on a blockchain.
      *   **Nuance/Caveats:**
          *   Halting problem/Computability issues (Tennenholtz assumes specific conditions or uses probabilistic programs to avoid infinite loops).
          *   Robustness (FairBot vs. PrudentBot).
          *   Connection to "Commitment Equilibria" (Kalai et al.).
      *   **Relevance to Multiagent RL:** Why should the user care? (Transparent agents, code-aware policies, commitment in automated negotiation).

