      *   *Refining the PE argument:* The program *is* the action. Or rather, the program selects the action. By submitting `if opponent == me: C else: D`, I am making my action conditional on the opponent's *strategy*, not just their realized action or an external signal. This is "modal logic" or "logical correlation."
