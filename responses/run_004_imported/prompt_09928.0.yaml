      *   **Goal:** Clarify the distinction, validate/correct the intuition, and explain *why* Program Equilibrium is distinct (and potentially more powerful/different) than Correlated Equilibrium in this context.

  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   **Correlated Equilibrium (CE):** Requires a trusted third party (correlating device) that sends private signals to players. Players condition their actions on these signals. No player wants to deviate *given* the signal. The set of CE payoffs includes Convex Hull of Nash Equilibria (CHNE) and often more (e.g., Chicken, Battle of Sexes). In PD, the only NE is (Defect, Defect). The CE set for PD *is* just (Defect, Defect) because there's no incentive to correlate on Cooperation without enforcement. Wait, let me double-check that.
          *   *Correction:* In a one-shot Prisoner's Dilemma, the unique Nash Equilibrium is (D, D). The set of Correlated Equilibria is *also* just (D, D). Why? Because for (C, C) to be a CE, the recommendation to Play C must be self-enforcing given the probability distribution. If the device says "Play C", I must prefer C over D given the other player plays C. But in PD, D dominates C regardless of what the other does. So, **CE cannot sustain Cooperation in one-shot PD.**
      *   **Program Equilibrium (PE):** Tennenholtz (2004). Players submit programs. Programs read each other's source code. If I submit a program that says "If opponent's code == my code, Cooperate, else Defect" (FairBot-like logic), and the opponent does the same, they match and Cooperate. This *is* an equilibrium.
      *   **Comparison:** PE allows (C, C) in one-shot PD. CE does not. Therefore, PE $\not\subseteq$ CE. The user's hypothesis ("everything... already be sitting inside the correlated equilibrium set") is **false**.
      *   **Why?** CE assumes actions are conditioned on *external* signals. PE assumes actions are conditioned on *strategic commitment* visible in the code. It's about commitment power and transparency, not just correlation.
      *   **Related Concepts:** Commitment equilibria, Stackelberg equilibria, Nash Equilibrium in programs (Nash in the space of algorithms).

