answer: |-
  Short answer: **No, it is not just Correlated Equilibrium (CE) with extra steps.** Your intuition is sharp—both involve coordination beyond standard Nash—but they achieve it through fundamentally different mechanisms, and they yield **different sets of achievable payoffs**.

  The "smoking gun" is the one-shot Prisoner's Dilemma (PD), which you already noted.
  *   **Correlated Equilibrium:** In a one-shot PD, the set of CE payoffs is **exactly the same** as the Nash Equilibrium payoffs: mutual defection (D, D). A correlating device cannot sustain cooperation because Defect is a *dominant strategy*. Even if a mediator tells you "The other player will Cooperate," your best response is still to Defect. Therefore, a CE mediator can never recommend Cooperation in equilibrium.
  *   **Program Equilibrium:** As Tennenholtz showed, you **can** sustain mutual Cooperation (C, C) as a Program Equilibrium. If both players submit code that says `if opponent_source == my_source: Cooperate else: Defect`, neither has an incentive to deviate (changing your code to always Defect triggers the opponent's code to Defect, lowering your payoff).

  Since Program Equilibrium can achieve (C, C) in one-shot PD and Correlated Equilibrium cannot, **Program Equilibrium outcomes are not a subset of Correlated Equilibrium outcomes.**

  Here is the deeper breakdown of why they differ, tailored to your CS/RL background.

  ### 1. Information vs. Commitment
  The distinction lies in what is being augmented:

  *   **Correlated Equilibrium (Aumann):** Augments the **information structure**. Players still choose actions from the base set $\{C, D\}$. They receive private signals from a trusted mediator. Crucially, **the signals are not binding.** I can ignore the mediator's recommendation if it benefits me. In PD, it always benefits me to ignore a "Cooperate" recommendation.
  *   **Program Equilibrium (Tennenholtz):** Augments the **strategy space** and introduces **binding commitment**. You aren't choosing an action; you are choosing a *function* from opponent-code to action. By submitting source code, you are effectively making a binding promise: "I *will* execute this logic." You cannot "deviate" at execution time because the program runs automatically.

  In game-theoretic terms, CE is about **conditional probability over actions**, whereas PE is about **conditional commitment over strategies**.

  ### 2. The "Correlating Device" Analogy
  You suggested the code inspection acts like a correlating device. It's more accurate to say the code inspection acts like a **smart contract** or a **commitment device**.

  *   **CE Mediator:** "I suggest you both play C." (Players can lie/defect).
  *   **PE Code:** "I *will* play C if you play C, and I *will* play D if you play D." (Enforced by the interpreter).

  The PE setup transforms the game from a simultaneous move game into something resembling a Stackelberg game or a commitment game (à la Kalai, Kalai, and Samet, 2010), where players can commit to contingent strategies *before* the move.

  ### 3. Why this matters for Multiagent RL
  Since you work in MARL, this distinction is actually critical for your field, perhaps more than classical game theory realizes.

  *   **CE in MARL:** Usually implemented via a central trainer that correlates gradients or policies, or via communication channels. But if agents are independent learners optimizing their own reward, they will learn to ignore the correlation if defection is dominant (the "social dilemma" problem).
  *   **PE in MARL:** This maps directly to **transparent agents** or **code-aware policies**. If your RL agent can inspect the weights or architecture of the opponent (or a proof of their behavior), it can condition its policy on the opponent's *disposition*, not just their history.
      *   This is the foundation of recent work on **Logical Induction**, **Functional Decision Theory**, and **Robust Cooperation** (e.g., the work of Critch, Oesterheld, Conitzer).
      *   It suggests that in automated systems, **transparency is a substitute for trust.** You don't need a mediator (CE); you need readable code (PE).

  ### 4. The Caveats (Where the "Nerdier Bottle" leaks)
  While PE isn't just CE, it does come with heavy baggage that CE avoids:
  1.  **Computability:** Tennenholtz's original result assumes programs can read each other. But if Program A simulates Program B, and B simulates A, you get infinite loops. Resolving this requires probabilistic programs (quining) or bounded compute, which complicates the equilibrium existence proofs.
  2.  **Obfuscation:** PE relies on the assumption that you *must* submit readable code. If I can obfuscate my "Always Defect" bot to *look* like a "Tit-for-Tat" bot, the equilibrium collapses. CE doesn't have this problem because the mediator is trusted by definition.
  3.  **Strategy Space Explosion:** In CE, you optimize over distributions of actions. In PE, you optimize over the space of Turing Machines. Finding the equilibrium is much harder computationally.

  ### Summary
  You aren't looking at old wine in a new bottle. You are looking at **Commitment Equilibrium** masquerading as Program Equilibrium.

  *   **Correlated Equilibrium** = Trusted Mediator + Non-binding suggestions. (Cannot solve one-shot PD).
  *   **Program Equilibrium** = Transparent Code + Binding Execution. (Can solve one-shot PD).

  For your research, the takeaway is that **access to opponent internals (source/weights) fundamentally changes the equilibrium set** in a way that shared randomness or communication channels do not. It allows for "logical correlation" rather than just statistical correlation.

  **Recommended Reading:**
  *   **Kalai, Kalai, Samet (2010):** "A commitment folk theorem." (Closer game-theoretic foundation).
  *   **Oesterheld (2019):** "Robust Program Equilibrium." (Addresses the computability/looping issues).
  *   **Critch (2019):** "Parametric Polymorphism for Transparent Agents." (Connects this to ML/RL).
