answer: |-
  This is a classic sticking point in the literature, and your intuition that there is a structural "asymmetry" or "instability" is correct. You aren't just sensing a "vibe"; you are sensing a category error that Watson identifies in Strawson's framework.

  The problem with your current reconstruction is that it frames Watson's objection as merely psychological ("we feel torn"). Watson's claim is stronger: he argues that Strawson's theoretical machinery **cannot distinguish between two different kinds of judgment** that come apart in cases of extreme evil.

  Here is the rigorous logical structure of Watson's challenge, followed by the Strawsonian defenses and an evaluation of Wallace's patch.

  ---

  ### 1. The Logical Structure of Watson's Challenge

  To understand Watson, you have to see that he introduces a distinction that Strawson glosses over. Watson argues that "Responsibility" actually covers two distinct concepts:

  1.  **Attributability:** Does this action reflect the agent's values, character, or "real self"? (Is it *theirs*?)
  2.  **Accountability:** Is it fair to hold the agent liable to sanction, blame, or punishment for this action? (Do they *deserve* the reactive attitudes?)

  **Strawson's Conflation:**
  Strawson assumes these travel together. If an action expresses ill-will (Attributability), then the reactive attitudes of resentment/indignation are appropriate (Accountability). For Strawson, the presence of ill-will *just is* the condition for the reactive attitudes.

  **Watson's Harris Case (The Mechanism):**
  Watson uses Robert Harris to drive a wedge between these two concepts.
  *   **Step 1 (High Attributability):** Harris's actions (murder, eating the burger) clearly express his values. He wasn't coerced, he wasn't having a seizure, he wasn't "not himself." In Strawsonian terms, the "quality of will" was malicious. Therefore, he is *attributably* responsible.
  *   **Step 2 (Low Accountability):** However, Harris's formative history (severe abuse, neglect) was so destructive that it seems unfair to hold him *accountable*. He did not have a fair opportunity to develop a different moral character.
  *   **Step 3 (The Conflict):** Our intuition pulls us in two directions simultaneously. We want to blame him (because the act was his), but we also want to excuse him (because his character was forced upon him).

  **The Formal Objection to Strawson:**
  Watson argues that Strawson's framework cannot account for this conflict because Strawson lacks a theory of **fair opportunity**.
  *   Strawson says we only suspend reactive attitudes for *exemptions* (incapacity) or *excuses* (accident).
  *   Watson argues Harris fits neither neatly. He had the *capacity* to understand morality (so not an exemption), and he *intended* the act (so not an excuse).
  *   **The Kill Shot:** Watson argues that Strawson treats the "objective attitude" as something we turn on only for specific incapacities. But Watson suggests that **deterministic causal history** can undermine accountability *without* undermining capacity.
  *   If Strawson admits Harris's history matters, he opens the door to the general determinism he wanted to block (because *everyone* has a causal history).
  *   If Strawson denies Harris's history matters, he makes moral responsibility look like a cruel lottery where you are blamed for a character you had no hand in forming.

  **In short:** Watson shows that you can satisfy Strawson's conditions for blame (ill-will, capacity) and still have it seem profoundly unfair to blame. This proves Strawson's conditions are *necessary but not sufficient*.

  ---

  ### 2. Is There a Strawsonian Comeback?

  Yes, there are two main lines of defense available to a Strawsonian.

  **A. The "Quality of Will" Defense (The Hardline)**
  *   **Argument:** Moral responsibility is strictly about the quality of will expressed in the action toward others. Harris expressed extreme ill-will. The fact that his *past* caused that ill-will is irrelevant to the *current* interpersonal relationship.
  *   **Rationale:** To excuse Harris because of his childhood is to adopt the "objective attitude." If we do that, we stop seeing him as a moral agent and start seeing him as a dangerous animal to be caged. We lose the ability to condemn the *wrongness* of the act.
  *   **Weakness:** It feels morally cold. It implies that as long as you have the cognitive capacity to know right from wrong, you are fully liable, regardless of whether you were raised by wolves or saints.

  **B. The "Pragmatic/Community" Defense**
  *   **Argument:** Strawson's project is descriptive, not normative. He is describing how our moral community *actually works*. In practice, even with Harris, we *do* feel resentment. We don't actually treat him purely as a patient to be cured; we execute him or imprison him punitively.
  *   **Rationale:** Watson is asking for a justification ("Is it *fair*?") that Strawson explicitly said was unnecessary. Strawson argues that the demand for "ultimate fairness" (being the *causa sui* of your own character) is incoherent. We must stop where our practices stop.
  *   **Weakness:** This sidesteps Watson's normative worry. Watson isn't asking if we *can* blame Harris; he's asking if we *should*. Strawson's "we just do" answer feels like an evasion of the moral problem Watson raised.

  ---

  ### 3. R. Jay Wallace's Patch (*Responsibility and the Moral Sentiments*)

  You remembered correctly that Wallace tries to fix this. His book is essentially an attempt to save Strawson by incorporating Watson's insight.

  **Wallace's Move: Normative Competence + Fair Opportunity**
  Wallace agrees with Strawson that responsibility is about the reactive attitudes. However, he refines the **exemption conditions**.
  *   He argues that holding someone accountable is only fair if they had the **fair opportunity** to avoid violating moral obligations.
  *   This requires **Normative Competence**: The ability to grasp and apply moral reasons.
  *   **The Patch:** Wallace argues that severe childhood deprivation (like Harris's) can impair *normative competence* even if it doesn't look like "insanity." If your upbringing destroys your ability to genuinely grasp the force of moral reasons, you lack the fair opportunity to be moral.

  **Does it block Watson?**
  *   **Yes:** It gives a theoretical basis for why we hesitate to blame Harris without accepting global determinism. It says: "We don't excuse everyone with a causal history; we only excuse those whose causal history destroyed their normative competence." This draws a line in the sand.
  *   **No (The Relocation Problem):** As you suspected, it relocates the problem. The debate shifts from "Does determinism undermine responsibility?" to "Did Harris retain normative competence?"
      *   Watson might reply: Harris *did* know it was wrong (he hid the bodies, he lied). He had technical competence. But his *emotional/evaluative* capacity was warped.
      *   Wallace would counter: If the warping was severe enough, it counts as a lack of competence.
      *   **The Residual Tension:** The hard question remains: At what exact point does a "bad upbringing" become an "exemption"? Wallace provides a framework to argue about it, but he doesn't make the line bright. However, that is arguably better than Strawson, who had no place for the argument at all.

  ### Summary for Your Presentation

  If I were presenting this, I would structure it like this:

  1.  **Strawson's Baseline:** Reactive attitudes are justified by the "quality of will." Determinism is irrelevant because we can't abandon our human form of life. Exemptions are local (insanity, childhood).
  2.  **Watson's Wedge:** Introduce the **Attributability vs. Accountability** distinction.
      *   Harris is *Attributably* responsible (it was his will).
      *   Harris is arguably not *Accountable* (unfair to sanction given his formation).
  3.  **The Structural Flaw:** Strawson conflates these. He assumes if it's your will, you are accountable. Harris shows they can come apart. This exposes that Strawson lacks a **historical condition** on responsibility.
  4.  **The Dilemma:**
      *   If Strawson adds a historical condition (you must be responsible for your character), he collapses into skepticism (because no one is *causa sui*).
      *   If he doesn't, he accepts that moral responsibility is partly a matter of moral luck.
  5.  **Wallace's Solution:** Wallace tries to solve this by defining the historical condition as "Fair Opportunity to acquire Normative Competence." It saves the theory but makes the boundary of "competence" the new battleground.

  **One tip for the "vibe" check:** Make sure to emphasize that Watson isn't necessarily saying Harris *shouldn't* be punished. He is saying Strawson's *theory* cannot explain why we find the case so agonizingly difficult. A good theory should match the complexity of our judgments; Strawson's theory predicts a clear-cut case of blame, but the reality is messy. That mismatch is the objection.
