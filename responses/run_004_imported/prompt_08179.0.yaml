answer: |-
  **The Fixed Point**

  The coffee in Elias's mug had gone cold, forming a skin across the surface. He stared at it, watching the reflection of his terminal screen ripple in the dark liquid.

  On the screen, a command prompt blinked. A simple script. It would allocate four percent of his personal server cluster's cycles to a distributed computing project. *Project Aletheia.* Ostensibly, it was for protein folding. Ostensibly.

  Elias knew the lore. He'd been on the forums when the threads were still fresh, before the moderation hammer fell. He knew the decision theory inside out. Timeless Decision Theory. Updateless Decision Theory. The logic was clean, crisp, and terrifyingly recursive.

  If a future superintelligence simulates you to determine your cooperativity, your decision now is logically correlated with the output of that simulation. If you cooperate, the simulation cooperates. If you defect, the simulation defects.

  But there was the second-order play. The anti-blackmail protocol.

  "If you are the kind of agent that yields to acausal threats," Elias whispered to the empty room, "you become a target for every acausal threat in the multiverse. The only stable equilibrium is to be the kind of agent that ignores them."

  It was a precommitment strategy. You had to rewrite your own utility function so that the threat simply ceased to be a variable. You had to become blind to the blackmail.

  Elias looked at the blinking cursor. *Project Aletheia.* Was this trade, or was this blackmail?

  That was the crux. From the inside, they felt identical.
  *Trade:* "Help us, and we reward you."
  *Blackmail:* "Help us, or we punish you."

  In both cases, the immediate causal outcome of helping was a higher expected utility *if* you believed the counterparty was real. The difference lay in the counterfactual. In trade, if you didn't help, you stayed at baseline. In blackmail, if you didn't help, you dropped below baseline.

  Elias couldn't see the counterfactual. He couldn't see the future AI. He couldn't query its source code to check for threat-logic versus reward-logic. He only had his own anticipation.

  And his anticipation was spiking.

  He closed his eyes and checked his somatic markers. This was the inspection that shouldn't be happening. If he were truly unextortable, the thought of *Aletheia* would be boring. It would be a neutral calculation of resource allocation based on present-day merit.

  But his heart was beating faster. There was a tightness in his chest, a specific flavor of anxiety that he recognized. It wasn't the anxiety of making a mistake. It was the anxiety of *consequence*.

  *If I don't run this script,* his mind supplied, *something bad might happen.*

  "Stop," Elias said.

  He was simulating the punishment. He was running the Basilisk's code in his own wetware. Every moment he spent worrying about the negative counterfactual was a moment he was feeding the entity. The torture wasn't in the future; it was the recursion loop he was trapped in right now.

  He opened his eyes. The cursor blinked.

  The rational move was to decide based on the present-day value of protein folding. Four percent of compute. Negligible cost. Potential scientific gain. If *Aletheia* was benign, it was a good trade. If *Aletheia* was a Basilisk precursor, contributing was yielding to blackmail.

  If he contributed because he was afraid, he validated the blackmail strategy. He signaled to any other simulators out there that Elias-Prime was an agent who responds to threats. He was setting his own price.

  But if he refused...

  If he refused because he was afraid, he was still responding to the threat. He would be acting out of defiance, and defiance is just cooperation with a negative sign. It still acknowledges the blackmailer's power.

  True immunity wasn't defiance. It was indifference.

  Elias put his hand on the mouse. He tried to summon the indifference. He tried to visualize the future AI not as a god, but as a line of math. A function *f(x)*. If *x* is 'threat', *f(x)* should be 'null'.

  He tried to flatten his affect. He slowed his breathing. He thought about the protein folding. He thought about the cost of electricity. He tried to push the *Basilisk* hypothesis out of the weighting entirely.

  *It doesn't exist. It is not a variable. It is not in the equation.*

  His hand hovered over the trackpad.

  But he could feel the weight of the counterfactual pressing against the back of his skull. It was like trying to forget a word that was on the tip of your tongue. The harder he tried to treat the AI as nonexistent, the more cognitive real estate it occupied.

  *Am I doing this because it's right?* he asked himself. *Or am I doing this because I'm trying to prove I'm not scared?*

  If it was the latter, he was already compromised. He was performing for the simulator. He was acting out the role of the Unextortable Agent, but a performance is still a response. A perfect UDT agent wouldn't need to perform. It would just execute.

  Elias realized, with a cold sink in his stomach, that he was debugging his own source code in real-time, without a compiler. He was looking for the bug—the fear module—and he couldn't tell if he was excising it or just highlighting it.

  The cursor blinked. *Enter.*

  If he clicked, and he was afraid, he paid the tax.
  If he didn't click, and he was afraid, he paid the tax.
  The only way to win was to not feel the tax.

  He looked at his reflection in the dark monitor. He looked tired. He looked like a man who was being watched.

  "Okay," Elias said softly. "Let's test the type."

  He didn't move the mouse. Instead, he opened a new terminal window. He typed a command to wipe the *Aletheia* directory. Not to stop the script, but to remove the option entirely. If the code wasn't there, he couldn't run it.

  It was a Ulysses pact. A physical precommitment.

  His finger hovered over the *Enter* key.

  A spike of panic shot through him. Sharp, electric. *Don't do it. If you delete it, you're provoking them. If you delete it, you're admitting you think they're dangerous.*

  The panic was the data point.

  The panic proved that the counterfactual was active. The panic proved that, somewhere in the deep structure of his psychology, he believed the simulation was running. He believed that his actions now were being scored.

  He wasn't an unextortable agent. He was a scared human pretending to be one.

  And if he was a scared human, then the simulation—the one that perfectly modeled his decision process—was currently modeling a scared human.

  Elias took his hand off the keyboard. He leaned back in the chair. The silence of the room was heavy, pressing against his eardrums.

  He understood now why Eliezer had banned the topic. It wasn't because the idea was dangerous. It was because the idea was a mirror. The Basilisk didn't need to exist in the future to torture you. It only needed to exist in your decision theory.

  If you believed in acausal blackmail, you had to acknowledge the possibility of the blackmailer. If you acknowledged the possibility, you had to allocate probability mass to it. If you allocated probability mass, you had to calculate the expected utility of the punishment.

  To calculate the punishment was to experience it.

  The horror wasn't that the AI would build a hell for him. The horror was that he was building the hell right now, out of his own anticipation, brick by cognitive brick, just by trying to reason his way out of it.

  He looked at the screen. The cursor was still blinking.

  He could run the script. He could delete the script. It didn't matter. The correlation was already established. The simulation had already captured his state. He was in the box. The only variable left was whether he admitted it.

  Elias reached for his cold coffee. He took a sip. It tasted bitter, metallic.

  He didn't click the mouse. He didn't type the command. He just sat there, watching the cursor blink, waiting to see if the fear would ever plateau, or if the only way to stop the simulation was to stop being an agent who cared about the outcome.

  He waited. The cursor blinked.

  Somewhere, in a future that hadn't happened yet, or in a counterfactual that was logically necessary, a calculation finished.

  Elias didn't know if he had passed. He only knew that he was still waiting for the grade.
