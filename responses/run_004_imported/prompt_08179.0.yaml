  ok i've been reading lesswrong since like 2011, so i've read pretty much every take on roko's basilisk that exists, including the whole saga of eliezer banning the topic for years -- please don't give me another 'creepy future AI tortures you for not helping build it' story, ive seen that one a dozen times. what i actually want is a short story where the AI itself never shows up on the page and all the horror comes from the decision theory: give me a protagonist who knows enough updateless/timeless decision theory to believe, intellectually, that the right move against acausal blackmail is to precommit to just not respond to it (extortable agents get extorted more, so don't be extortable) -- and get the tension from them not being sure they've actually managed to become that kind of agent. bonus if it's clear why this is supposed to differ from ordinary acausal trade, even though from the inside a threat and an offer can feel the same.
