answer: |-
  You and your friend have accidentally stumbled directly into one of the classic debates in social epistemology. You are absolutely right: this is the **Reductionism vs. Anti-Reductionism** debate regarding testimony, and yes, the historical archetype is indeed **David Hume (Reductionism)** vs. **Thomas Reid (Anti-Reductionism)**.

  Here is the breakdown of the strongest versions of both sides, followed by an analysis of the "Child Objection" and whether it kills Reductionism.

  ---

  ### 1. The Reductionist View (Your Side)
  **The Core Claim:** Testimony is not a fundamental source of knowledge. It is derivative. Believing someone is rational *only if* you have independent inductive evidence that testimony of that kind is reliable.

  **The Strongest Argument (The "No Magic" Argument):**
  Reductionists argue that treating testimony as "basic" (like seeing or hearing) is epistemically dangerous. If I can just believe whatever you say without evidence, I am vulnerable to manipulation, propaganda, and error.
  *   **How it works:** When your friend asked the stranger for directions, she didn't need a dossier on *him* specifically. She relied on **Global Induction**: "In my past experience, people on streets in cities generally give correct directions when asked."
  *   **Why it's strong:** It preserves intellectual autonomy. It explains why we *stop* trusting people when we catch them lying. If trust were basic/automatic, catching a lie wouldn't logically undermine future trust unless we had an inductive rule that says "liars tend to lie again."

  **The Weakness:** It seems to demand too much cognitive work. Do I really need to run a subconscious statistical analysis every time my spouse tells me what's for dinner? It makes social life seem exhausting and skeptical.

  ### 2. The Anti-Reductionist View (Your Friend's Side)
  **The Core Claim:** Testimony *is* a fundamental source of knowledge, on par with perception or memory. We have a natural, innate right to believe what we are told unless there is a specific reason not to.

  **The Strongest Argument (The "Principle of Credulity"):**
  Thomas Reid argued that humans are hardwired with two principles:
  1.  **Principle of Veracity:** A propensity to speak the truth.
  2.  **Principle of Credulity:** A propensity to believe what is spoken.
  Reid argued this is divine/natural design. If we had to verify everything inductively, language could never be learned, and society would collapse. Trust is the **default setting**; skepticism is the override.

  **Why it's strong:** It matches the phenomenology of belief. When someone tells you "It's raining," you don't feel yourself making an inference ("People usually tell the truth about weather... therefore it is raining"). You just believe it. The belief is immediate. Anti-Reductionism respects the social nature of knowledge: we are dependent on others by design, not by accident.

  **The Weakness:** It risks gullibility. If trust is the default, the burden of proof is always on the skeptic. This can make it hard to explain why we should be skeptical of authority figures or media without specific "defeaters."

  ---

  ### 3. The "Child Objection"
  This is the nuclear weapon in this debate.

  **The Problem for Reductionism:**
  Infants and small children accept testimony from caregivers constantly before they have the cognitive capacity to form complex inductive generalizations about human reliability. They don't have a "track record" of verifying statements against reality.
  *   If Reductionism is true, children are being **irrational** when they trust their parents. They lack the inductive premises required to justify the belief.
  *   Most people find it counterintuitive to say a child is irrational for believing their mother when she says "Don't touch the stove."

  **Does this sink Reductionism?**
  It sinks *strict* Humean Reductionism, but modern Reductionists have developed three major comebacks. None of them fully surrender to Anti-Reductionism, but they soften the stance.

  #### Comeback A: The "Implicit Induction" Defense
  Reductionists argue that children *are* doing induction, just non-verbally and very quickly.
  *   By age 3 or 4, a child has thousands of data points where "Sound came from Mom" was followed by "Thing happened."
  *   They learn that specific sounds correlate with specific outcomes. They aren't trusting "testimony" in the abstract; they are trusting a causal pattern they have observed.
  *   **Verdict:** This saves Reductionism, but it feels like a stretch. It turns "trust" into "pattern recognition," which misses the semantic aspect of believing *what* is said.

  #### Comeback B: The "Externalist" Defense (Process Reliabilism)
  This is the strongest technical comeback. It shifts the focus from the *child's internal reasoning* to the *reliability of the process*.
  *   **Argument:** A belief is justified if it is produced by a reliable process, even if the believer doesn't know *why* it's reliable.
  *   **Application:** The child trusts the adult. The adult is (usually) reliable. Therefore, the child's belief is justified, even if the child hasn't done the inductive math. The "induction" exists in the environment (the reliability of the community), not necessarily in the child's head.
  *   **Verdict:** This saves Reductionism from the charge of calling children irrational, but it changes Reductionism into something that looks a lot like Anti-Reductionism (trust is okay because the system is reliable, not because the individual verified it).

  #### Comeback C: The "Monitoring View" (Fricker)
  Philosopher Elizabeth Fricker offers a middle ground. She argues we don't need *positive* reasons to trust (Anti-Reductionism), but we do need to monitor for *negative* reasons (Reductionism).
  *   **Application:** Children are born with a "monitoring" mechanism. They don't need to prove adults are honest; they just need to check for signs of dishonesty (tone, inconsistency, context). If no red flags appear, trust is justified.
  *   **Verdict:** This acknowledges the child's limited capacity. They can't do deep induction, but they can do basic "danger detection."

  ### The Verdict: Who Won the Argument?

  **Your friend (Anti-Reductionism) wins on the "Child Objection."**
  The fact that children trust before they can reason inductively is the strongest evidence that trust is a basic, innate cognitive faculty, not a derived inference. If trust were purely inductive, language acquisition would be impossible (you need to trust words to learn the concepts required to verify the words). This is known as the **Problem of Circular Learning**.

  **However, you (Reductionism) win on "Adult Street Interactions."**
  When your friend asked the stranger for directions, she wasn't operating on pure infantile credulity. She *was* using context clues (uniform, confidence, location) that rely on past experience. Pure Anti-Reductionism implies she should believe a shouting lunatic just as much as a calm local, unless she has a specific "defeater." That seems wrong.

  **The Synthesis (The Contemporary Consensus):**
  Most modern epistemologists accept a **Hybrid View**:
  1.  **Developmentally:** Anti-Reductionism is correct. We are hardwired to trust (Reid was right about kids).
  2.  **Normatively:** Reductionism is correct. As rational adults, we *ought* to have some sensitivity to reliability (Hume was right about responsibility).

  So, tell your friend: **She is right that trust *feels* basic and starts that way in childhood, but you are right that as adults, that trust is implicitly backed by a lifetime of inductive data about how the social world works.** You aren't reinventing the wheel; you're just reenacting the 18th century.
