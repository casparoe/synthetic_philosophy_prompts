      *   **Part II:** Practical application/Reinforcement. Hume offers four "reasons" why we shouldn't believe miracles.
          1.  No miracle has ever been attested by a sufficient number of men of unquestioned good sense, education, learning, integrity, and reputation.
          2.  Human psychology loves the marvelous (passion for surprise/wonder).
          3.  Miracles abound in "ignorant and barbarous nations."
          4.  Different religions have conflicting miracles, canceling each other out.
      *   **The Abbé Paris Passage:** This appears in the discussion of the *first* reason in Part II. Hume admits this case *comes closest* to meeting the standard but ultimately rejects it.

