      *   **Does it prove free will is an illusion?** No. Decision theory assumes agents *make* choices. The paradox arises *because* the agent has a choice that correlates with the prediction. If there were no choice, there would be no decision problem.
      *   **Why theorists still study it:** It's not about metaphysics; it's about *rational choice*. It highlights tensions between Causal Decision Theory (CDT) and Evidential Decision Theory (EDT). It's about how to act when your action provides evidence about a state of the world you can't causally influence *now* (but which correlates with your choice).

