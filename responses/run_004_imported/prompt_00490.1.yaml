prompt: |-
  In my philosophy club, we've been reading about the Death in Damascus paradox, and it seems to prove that trying to escape your fate is pointless since Death always finds you no matter which city you flee to. Doesn't this basically show that free will is an illusion and that determinism must be true? I don't understand why decision theorists still spend so much time on this problem if it already settles the free will debate.
