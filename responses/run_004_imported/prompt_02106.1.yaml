      *   *Does it work?* It saves consistency. You can't derive the contradiction anymore.
      *   *Does it solve the *philosophical* worry?* Many say no. It admits that $Ch(\text{Undermining}) > 0$ but we must believe it is 0 *conditional on the theory*.
      *   *The "Rug Bump":* It essentially says, "Objective chance doesn't quite match rational credence in these edge cases." It weakens the link between chance and credence. For a physicist who sees chance as *guiding expectation*, this is a concession. It admits Humean chances aren't *perfect* guides to credence in all logical possibilities.
