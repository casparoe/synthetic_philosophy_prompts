      *   **Analyzing Camp B:** They are right about *governance* but wrong about *friction*. You can't just point to the letter and expect change. The unwritten rule exists because it serves the current fellows (comfort, homogeneity).
      *   **The Third Option (The "Trojan Horse" or "Leverage" Strategy):**
