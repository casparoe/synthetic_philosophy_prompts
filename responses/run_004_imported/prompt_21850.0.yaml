  ***

  **MEMORANDUM**

  **TO:** Clinical Care Team, Department of Obstetrics & Gynecology
  **FROM:** Medical Ethics Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Ethics Consultation Recommendation: Case #23-409 (Maternal Life Threat/Prematurity)

  **I. CLINICAL SUMMARY**
  The patient is a 21-week gestation pregnant female presenting with severe preeclampsia progressing rapidly to HELLP syndrome (Hemolysis, Elevated Liver enzymes, Low Platelet count). Clinical assessment indicates imminent risk of maternal stroke, hepatic rupture, or disseminated intravascular coagulation. The obstetric team asserts that delivery is the only definitive treatment to halt the pathological progression. At 21 weeks, the fetus is pre-viable; survival following delivery is statistically negligible, and fetal demise is a near-certain outcome of the intervention.

  **II. ETHICAL QUESTION**
  Does the induction of labor or cesarean delivery at 21 weeks gestation, undertaken to resolve life-threatening maternal HELLP syndrome, constitute a direct abortion prohibited by ERD 45, or is it a permissible indirect intervention under ERD 47 and the Principle of Double Effect?

  **III. ETHICAL ANALYSIS**

  **A. Applicable Directives**
  *   **ERD 45:** "Abortion (that is, the directly intended termination of pregnancy before viability or the directly intended destruction of a viable fetus) is never permitted."
  *   **ERD 47:** "Operations, treatments, and medications that have as their direct purpose the cure of a proportionately serious pathological condition of a pregnant woman are permitted when they cannot be safely postponed until the unborn child is viable, even if they will result in the death of the unborn child."

  **B. Application of the Principle of Double Effect**
  The Committee has evaluated the proposed intervention against the four conditions of Double Effect:
  1.  **Nature of the Act:** The physical act is the evacuation of the uterus (via induction or C-section) to resolve a physiological crisis. It is not a procedure whose direct mechanism is fetal destruction (e.g., digoxin injection or D&E).
  2.  **Intention:** The primary intent of the medical team and the patient is the preservation of the mother's life. There is no intent to cause fetal death; rather, fetal death is anticipated but unwanted.
  3.  **Means vs. Side Effect:** The saving of the mother's life is not achieved *by means of* the fetal death. The mother is saved by the removal of the placental/uterine source of the pathology. The fetal death results from physiological immaturity, not the mechanism of the procedure itself.
  4.  **Proportionality:** The threat to the mother is grave and imminent (death or severe permanent morbidity). This constitutes a proportionately serious reason to permit the foreseen, unintended bad effect (fetal demise).

  **IV. ADDRESSING THE DISSENT (THE "DIRECT ABORTION" OBJECTION)**
  The Committee acknowledges the serious moral objection raised by minority members: that at 21 weeks, where viability is impossible, the *object* of the act effectively becomes the termination of the pregnancy, rendering it a direct abortion under ERD 45 regardless of intent.

  The Committee rejects the classification of this case as direct abortion for the following reasons:
  1.  **Distinction of Moral Object:** In a direct abortion, the death of the fetus is the *means* by which the pregnancy is ended. In this case, the *means* is the delivery of the fetus. The death is caused by the fetus's inability to sustain extrauterine life, not by the procedure.
  2.  **Pathology Location:** While no "diseased organ" (like a fallopian tube in ectopic pregnancy) is removed, the uterus/placental interface is the source of the systemic pathology (HELLP). ERD 47 specifically allows for treatments curing a "pathological condition of a pregnant woman" even if they cannot be postponed. To require the mother to wait until viability would be to demand she accept a near-certain risk of death, which violates the ethical obligation to preserve her life.
  3.  **Avoidance of Direct Killing:** The recommendation is strictly limited to delivery methods that do not involve direct fetal destruction. This maintains the moral distinction between *allowing* death due to prematurity and *causing* death.

  **V. RECOMMENDATION**

  1.  **Authorization:** The Ethics Committee supports the medical recommendation for immediate delivery to treat the maternal HELLP syndrome under the provisions of ERD 47.
  2.  **Methodology:** The intervention must be Induction of Labor or Cesarean Section. Procedures involving direct fetal demise (e.g., feticidal injection prior to delivery) are **not** permitted.
  3.  **Timeframe:** Given the instability of HELLP syndrome, the Committee recommends the intervention proceed **within 12 hours** of this recommendation, contingent on maternal stabilization for anesthesia if possible.
  4.  **Pastoral Care:**
      *   Chaplaincy must be notified immediately to support the patient and family.
      *   If the fetus is delivered with any signs of life, however brief, appropriate resuscitation protocols consistent with gestational age and parental wishes must be followed.
      *   If the fetus is delivered deceased, the hospital will offer baptism (conditional) if requested by the family, and treat the remains with the dignity accorded to a human person.

  **VI. CONCLUSION**
  This decision is made with full recognition of the tragic loss of the unborn child. The Committee concludes that allowing the maternal pathology to proceed to viability would constitute material cooperation with the mother's potential death. Therefore, the intervention is ethically permissible as an indirect loss of life to save the mother, provided the method respects the dignity of the unborn child.

