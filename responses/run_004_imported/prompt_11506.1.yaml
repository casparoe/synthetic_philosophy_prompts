prompt: |-
  I keep noticing a move in effective altruist and rationalist writing that I don't think gets scrutinized enough: people invoke evolutionary debunking arguments, in the style of Sharon Street's Darwinian Dilemma, to discount parochial moral intuitions—favoring kin, tribe, or the present generation—as better explained by what Street calls an "adaptive link account" (the disposition was fitness-enhancing regardless of whether its content was true) than by a "tracking account" on which our ancestors were actually detecting independent evaluative facts. Yet the same style of explanation seems just as available for the impartial, aggregative intuitions that cause-prioritization work depends on (that a benefit's moral weight doesn't depend on who receives it, that more welfare is better than less), and Street intended her dilemma as a fully general argument against realism, with no built-in exemption for whichever intuitions happen to be impartial rather than parochial. Please describe the most important implications of this for how much epistemic weight I should give my own impartial, scope-sensitive intuitions when they are doing load-bearing work in cause-prioritization reasoning, and assess whether Katarzyna de Lazari-Radek and Peter Singer's Sidgwickian attempt to save axioms such as impartiality and temporal neutrality—by treating them as byproducts of a general rational capacity rather than direct targets of selection—genuinely escapes the dilemma, or merely relocates the same evidential burden one level up.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Observation:** The user notices a pattern in EA/Rationalist writing: using evolutionary debunking arguments (EDAs), specifically Sharon Street's "Darwinian Dilemma," to dismiss *parochial* moral intuitions (kin preference, tribalism, present bias) as adaptive rather than truth-tracking.
      *   **The Problem:** The user points out that this same EDA logic applies equally well to *impartial, aggregative* intuitions (impartiality, scope-sensitivity, temporal neutrality) which are foundational to EA cause prioritization. Street's argument is general, not selective.
      *   **Task 1:** Describe the most important implications for how much *epistemic weight* the user should give their impartial, scope-sensitive intuitions when doing cause-prioritization.
      *   **Task 2:** Assess whether de Lazari-Radek and Singer's Sidgwickian defense (impartiality as a byproduct of rational capacity, not direct selection) escapes the dilemma or just relocates the burden.

  2.  **Analyze the Philosophical Landscape:**

      *   **Sharon Street's Darwinian Dilemma:**
          *   Premise: Evolutionary forces shaped our evaluative attitudes.
          *   Dilemma: Either (1) Evolution tracked independent moral truths (unlikely, evolution cares about fitness, not truth), or (2) Evolution shaped attitudes for fitness regardless of truth (implies our moral beliefs are unjustified if realism is true).
          *   Conclusion: Moral Realism is untenable; Constructivism is preferred.
      *   **EA/Rationalist Usage:** Often use EDAs to strip away "bias" (e.g., "We feel closer to locals, but that's just evolution, so we should ignore it and help the global poor").
      *   **The User's Critique:** If evolution explains *why* we feel kin preference, it also explains *why* we feel the pull of impartiality (if that pull exists in us). If fitness explains the former, why not the latter?
      *   **De Lazari-Radek & Singer (2012/2014):** "The Objectivity of Ethics and the Evolutionary Origins of Ethics." They argue that while specific norms (don't kill kin) are selected, the *capacity* for rational reflection is selected. Impartiality is a requirement of rationality (Sidgwick's axiom), not a specific adaptive trait. Therefore, it survives the EDA.

  3.  **Drafting Task 1: Implications for Epistemic Weight:**

      *   *Direct Implication:* If the EDA applies generally, confidence in *all* substantive moral intuitions drops. This includes the "impartiality" axiom.
      *   *Nuance:* EA relies on "scope sensitivity" (more lives saved = better). Is this an intuition or a logical consequence of impartiality? If impartiality is debunked, scope sensitivity might fall too.
      *   *Practical Impact:* It doesn't necessarily mean stopping EA work, but it shifts the justification from "intuition pumping" to "coherentist reasoning" or "constructivist frameworks."
      *   *Key Point:* The "Parochial vs. Impartial" distinction isn't an "Evolutionary vs. Rational" distinction. Both could be evolutionary. Impartiality might be a spandrel or a cultural adaptation, not a truth-tracker.
      *   *Weight:* Reduce dogmatic confidence. Acknowledge that the "view from nowhere" might just be another view from somewhere (e.g., a WEIRD, philosophical somewhere).

  4.  **Drafting Task 2: Assessing de Lazari-Radek & Singer:**

      *   *Their Argument:* Evolution selected for *intelligence/reasoning*, not specific moral rules. Once you have reasoning, you see that partiality is arbitrary. Therefore, impartiality is a deliverance of reason, not evolution.
      *   *Critique (The "Relocation" Charge):*
          *   Did evolution select for the *specific* form of reasoning that yields utilitarianism?
          *   Street would argue: Evolution shaped the *capacity* for reasoning to solve social coordination problems. The "axioms" we find self-evident might just be the ones that helped our ancestors cooperate.
          *   Is "rationality" neutral? Or is our concept of rationality itself shaped by evolutionary pressures? (Evolutionary debunking of logic/reason is a harder pill to swallow, but Street hints at it).
          *   *Verdict:* It relocates the burden. It claims the *process* is clean, but if the process itself was tuned for fitness, its output (impartiality) might still be fitness-conducive (e.g., impartial rules help large-scale cooperation which helps fitness).
      *   *Strength:* It distinguishes between *content* (don't eat pork) and *form* (treat like cases alike).
      *   *Weakness:* It assumes the "form" isn't also contaminated. Why does "treat like cases alike" lead to *utilitarian* aggregation rather than *contractualist* reciprocity? Both claim rationality.

  5.  **Synthesizing and Structuring the Response:**

      *   **Introduction:** Validate the user's insight. It's a sharp and under-discussed point in the EA community. Acknowledge Street's generality.
      *   **Section 1: Implications for Epistemic Weight.**
          *   Humility regarding "self-evident" axioms.
          *   Shift from Realism to Constructivism/Coherentism.
          *   Risk of "Motivated Stopping": Using EDA to stop at the intuitions you like.
          *   Practical advice: Don't discard the intuitions, but stop treating them as *foundational evidence* of truth. Treat them as starting points for reflective equilibrium.
      *   **Section 2: Assessing de Lazari-Radek & Singer.**
          *   Explain their "Dual-Process" / "Rational Capacity" move.
          *   Analyze the escape: Does it work?
          *   The "Relocation" Critique: Evolution selects for reasoning tools useful for survival. Is "Impartial Maximization" useful? Maybe "Reciprocal Altruism" is more useful.
          *   The "Contamination" Risk: If the *capacity* is shaped, the *output* might be biased towards fitness-enhancing social structures (like large-scale cooperation), which mimics impartiality but isn't truth-tracking.
          *   Conclusion on this point: It mitigates but doesn't fully escape. It shifts the debate from "specific instincts" to "the nature of rationality."
      *   **Section 3: Strategic Takeaways for EA.**
          *   Focus on convergence (reflective equilibrium) rather than intuition.
          *   Acknowledge the possibility that EA is a "fitness-enhancing cultural meme" rather than moral truth.
          *   Maintain commitment based on coherence, not metaphysical certainty.

  6.  **Refining the Tone:**

      *   Needs to be philosophically rigorous but accessible to an EA audience.
      *   Avoid taking a definitive stance on Moral Realism vs. Anti-Realism (since that's unresolved), but focus on the *epistemic implications* of the uncertainty.
      *   Ensure Street's specific arguments are represented accurately (she's a constructivist, not an error theorist).
      *   Ensure Singer's counter-argument is represented fairly (he accepts the EDA against specific norms but defends the axioms).

  7.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I address "scope sensitivity"?
      *   *Correction:* Make sure to mention that scope sensitivity is often treated as a rational requirement of impartiality, so if impartiality is shaky, scope sensitivity is too.
      *   *Check:* Did I address "temporal neutrality"?
      *   *Correction:* Include this in the axioms discussion.
      *   *Check:* Is the distinction between "adaptive link" and "tracking" clear?
      *   *Correction:* Reiterate this in the context of rationality. Is rationality an adaptive link or a tracker?

  8.  **Final Polish:** Check for clarity, flow, and ensure the conclusion directly answers the prompt's two main tasks. (Proceed to generate output based on these thoughts.)

      *   *Key Insight to emphasize:* The EA move is often "Evolution explains away *their* morals, but *our* morals are Reason." The user is correctly identifying that as question-begging.
      *   *Singer's Defense:* It relies on the idea that evolution can't select for logical truths (2+2=4). Singer argues moral axioms are like logical truths. Street argues moral axioms aren't like logical truths; they are practical.
      *   *Final Verdict:* The user's skepticism is well-founded. The epistemic weight should be lowered from "perception of truth" to "input for coherentist system."

  9.  (Final review of the prompt requirements):
      *   Describe implications for epistemic weight of impartial intuitions in cause-prioritization.
      *   Assess de Lazari-Radek & Singer's Sidgwickian attempt (escape vs. relocation).

      *Okay, ready to write.*
answer: |-
  This is a sophisticated and crucial observation. You have identified a significant asymmetry in how Evolutionary Debunking Arguments (EDAs) are deployed within the Effective Altruism (EA) and rationalist communities. Often, EDAs are wielded as a sword against "parochial" intuitions (kin preference, in-group bias, presentism) to clear the ground for "impartial" axioms (neutral aggregation, scope sensitivity). However, as you note, Sharon Street's Darwinian Dilemma is a general challenge to moral realism, not a selective filter that spares the intuitions required for utilitarian calculation.

  Here is an analysis of the implications for your epistemic stance and an assessment of the de Lazari-Radek and Singer defense.

  ### 1. Implications for the Epistemic Weight of Impartial Intuitions

  If you accept the generality of Street's dilemma, the epistemic status of your impartial, scope-sensitive intuitions shifts from **foundational evidence** to **contingent inputs**. This has three major implications for cause-prioritization reasoning:

  **A. The Loss of "Self-Evidence" as Justification**
  EA reasoning often relies on the phenomenological force of axioms like "distance doesn't matter" or "saving two lives is better than one." These are treated as self-evident truths perceived by rational insight. If the EDA applies generally, the feeling of self-evidence is no longer a reliable indicator of independent truth. It is equally plausible that the intuition of "impartial aggregation" was selected because it facilitates large-scale cooperation among non-kin (enhancing group fitness) or because it is a cognitive spandrel of our capacity for symbolic manipulation.
  *   **Implication:** You cannot use the *strength* of your impartial intuition as proof of its correctness. In cause prioritization, this means arguments resting solely on "it is intuitively obvious that we must maximize" are epistemically weaker than they appear.

  **B. The Shift from Realism to Coherentism**
  If you cannot claim your impartial axioms are "tracking" independent moral facts (because evolution likely shaped them for fitness, not truth), you lose the realist justification for EA. You are forced toward a coherentist or constructivist framework.
  *   **Implication:** The weight of your reasoning must shift from *discovery* (finding the truth) to *construction* (building a consistent system). Cause prioritization becomes less about "calculating the objective good" and more about "determining what we value upon maximal reflection." This doesn't necessarily change the *output* (you might still choose to maximize welfare), but it changes the *confidence* and the *nature* of the claim. You are advocating for a value system, not reporting on a moral reality.

  **C. The Risk of "Motivated Stopping"**
  The common EA move is to apply the EDA to parochial intuitions but stop before applying it to impartial ones. This is a form of motivated stopping. If you apply the EDA consistently, you must acknowledge that the intuition "suffering is bad regardless of species" is just as evolutionarily suspect as "suffering of kin is bad."
  *   **Implication:** You should assign a "debunking discount" to *all* substantive moral intuitions, including impartial ones. This suggests a higher degree of epistemic humility in cause prioritization. It argues against dogmatic longtermism or rigid utilitarianism if those positions rely heavily on specific, contestable interpretations of impartiality (e.g., total view vs. average view) that may be artifacts of how human rationality evolved to handle abstraction.

  ### 2. Assessing de Lazari-Radek and Singer's Sidgwickian Defense

  Katarzyna de Lazari-Radek and Peter Singer (in *The Objectivity of Ethics and the Evolutionary Origins of Ethics*) attempt to rescue ethical objectivity by distinguishing between **specific moral norms** (which are vulnerable to EDAs) and **general rational axioms** (which they claim are not).

  **Their Argument:**
  1.  Evolution selected for specific norms (e.g., "protect kin," "reciprocate") because they aided survival.
  2.  Evolution also selected for a general capacity for reasoning.
  3.  Impartiality and temporal neutrality are not specific norms but requirements of rationality itself (Sidgwick's axioms). Just as evolution didn't select for the belief that $2+2=4$ (it selected for the logic that makes it true), it didn't select for impartiality; it selected for the reasoning capacity that *reveals* impartiality.
  4.  Therefore, these axioms escape the EDA because they are deliverances of reason, not adaptations.

  **Assessment: Escape or Relocation?**

  While elegant, this defense largely **relocates the evidential burden one level up** rather than escaping the dilemma. Here is why:

  **A. The Contamination of Rational Capacity**
  Street's argument is not just that specific beliefs were selected, but that the *cognitive faculties* producing those beliefs were selected for fitness, not truth. If our capacity for "rational reflection" was tuned by evolution to solve social coordination problems, why trust that this capacity yields *moral truth* rather than *fitness-enhancing social heuristics*?
  *   **Critique:** It is plausible that "impartial reasoning" is itself an adaptation for managing large-scale tribal cooperation. The ability to abstract away from the self allows for complex social contracts that benefit the individual in the long run. If the *tool* (reason) is shaped by fitness pressures, the *output* (impartiality) is still suspect. Singer assumes reason is a neutral telescope; Street argues reason is a fitness-tuned filter.

  **B. The Ambiguity of "Rational Requirements"**
  Singer treats Sidgwick's axioms as analogous to logical truths. However, logical truths (non-contradiction) are formal, whereas moral axioms (impartiality, aggregation) are substantive.
  *   **Critique:** One can be perfectly rational (logically consistent) without accepting utilitarian aggregation. A contractualist or a virtue ethicist can claim their system is equally rational. If "rationality" underdetermines the specific impartial axioms EA relies on (e.g., why *maximize* the good rather than *satisfice* or *distribute*?), then the move to "rational capacity" doesn't secure the specific load-bearing intuitions of cause prioritization. It merely shifts the debate to "Which version of rationality is the true one?"—a debate that is equally vulnerable to evolutionary explanation.

  **C. The "Adaptive Link" to Impartiality**
  Street's "adaptive link account" suggests that even if a belief is true, if the *reason* we hold it is adaptive rather than truth-tracking, realism is undermined.
  *   **Critique:** There is a strong adaptive link for impartiality. As human groups grew larger, norms that approximated impartiality (rule of law, universalizable maxims) became more fitness-enhancing than strict nepotism. Therefore, the intuition that "impartiality is rational" could itself be an adaptive link. De Lazari-Radek and Singer assert that impartiality is a *byproduct* of reason, but they do not prove that the *structure* of our reason wasn't selected specifically to produce impartial-seeming norms for cooperative advantage.

  ### Conclusion

  Your skepticism is well-founded. The EA community often utilizes EDAs as a hygiene factor to clean away "biases" while assuming the remaining "rational" intuitions are pristine.

  **Epistemic Weight:** You should treat your impartial, scope-sensitive intuitions as **provisional commitments** rather than **perceptions of truth**. They deserve weight because they survive reflective equilibrium and cohere with your other values, not because they are immune to evolutionary explanation. In cause prioritization, this suggests prioritizing robustness (actions that are good under multiple moral frameworks) over optimization based on a single, potentially debunked axiomatic system.

  **Singer's Defense:** De Lazari-Radek and Singer do not fully escape the dilemma; they relocate it. They successfully argue that *logic* might be safe from evolution, but they fail to prove that *moral rationality* is identical to logic, or that the specific axioms of utilitarianism are the unique output of pure reason rather than fitness-tuned social cognition. The burden remains to explain why the "rational" intuitions we happen to have are the ones that track moral truth, rather than the ones that tracked ancestral fitness.

  **Strategic Takeaway:** Do not abandon impartiality or cause prioritization. However, ground them in **constructivist commitment** ("This is the value system we endorse upon reflection") rather than **realist discovery** ("This is the moral structure of the universe"). This preserves the motivation for EA work while inoculating it against the charge of epistemic naivety regarding its own foundations.
