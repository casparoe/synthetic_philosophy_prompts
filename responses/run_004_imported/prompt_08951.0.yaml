          *   Let $K_i E$ be the event "i knows E". This is the set of states where $\mathcal{P}_i(\omega') \subseteq E$.
          *   We need to show that at $\omega$, $i$ knows $K_i E$. That is, $\mathcal{P}_i(\omega) \subseteq K_i E$.
          *   Take any $\omega' \in \mathcal{P}_i(\omega)$. Since partitions are equivalence relations, $\mathcal{P}_i(\omega') = \mathcal{P}_i(\omega)$.
          *   Since $\mathcal{P}_i(\omega) \subseteq E$, then $\mathcal{P}_i(\omega') \subseteq E$.
          *   Therefore, $\omega' \in K_i E$.
          *   So $\mathcal{P}_i(\omega) \subseteq K_i E$.
