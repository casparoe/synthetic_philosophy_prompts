      *   *Knowledge Definition:* Agent $i$ knows event $E$ at state $\omega$ iff the cell of the partition containing $\omega$ is a subset of $E$ ($\mathcal{P}_i(\omega) \subseteq E$).
      *   *Deriving KK:*
