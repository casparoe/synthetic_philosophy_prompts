answer: |-
  Here are eight interview questions designed for your podcast. They are structured to move from the foundational motivation of the view to specific objections, ending with a stress-test of the position.

  I have included brief context notes for you (in italics) to explain the strategic goal of each question and how the follow-up connects to likely answers.

  ### 1. The Regress Problem (Motivation)
  "The standard reductionist picture suggests that before I believe your testimony, I need independent reasons to think you're reliable. But as you've noted, almost none of us have actually gathered that evidence firsthand for the vast majority of what we believe. Is your anti-reductionism essentially a pragmatic concession that the reductionist demand is impossible to meet, or are you making the stronger claim that the demand itself is conceptually incoherent?"

  *   **Context:** This avoids simply asking "What is the regress problem?" and instead asks the guest to characterize the *force* of their argument (pragmatic vs. conceptual).
  *   **Likely Answer:** They will likely argue the demand is incoherent or viciously regressive, not just hard to meet.

  ### 2. The Regress Problem (Follow-up)
  "If you're arguing the demand is incoherent, we need an alternative foundation. Is this default entitlement a brute fact about rationality—something we just have to accept—or do you think it's derived from some deeper principle, like the inherent social nature of language or cognition?"

  *   **Context:** This follows up on the "conceptually incoherent" path. It presses the guest on the *source* of the entitlement, which is often a weak spot in anti-reductionist accounts.

  ### 3. Jennifer Lackey's "Hostile Environment" Objection
  "Jennifer Lackey has argued that a default entitlement to trust over-licenses belief, particularly in what she calls 'hostile environments'—places saturated with misinformation or propaganda where most speakers are unreliable. If trust is the default, how does your view prevent a hearer in such an environment from being epistemically irresponsible when they believe false testimony?"

  *   **Context:** This addresses the "over-licensing" worry without getting bogged down in technical definitions of "hostile environments." It asks for the mechanism of protection.
  *   **Likely Answer:** They will likely appeal to "defeaters"—conditions that, if present, override the default entitlement.

  ### 4. Lackey Objection (Follow-up)
  "You likely rely on the presence of 'defeaters' to handle those cases. But doesn't identifying a defeater often require the very kind of independent, inductive checking that reductionists demand? If I have to investigate the environment to know if a defeater is present, haven't we just slipped back into reductionism?"

  *   **Context:** This is the standard counter-punch to the "defeater" response. It challenges whether the "default" status is robust or if it collapses under the weight of monitoring for defeaters.

  ### 5. The Argument from Child Development
  "Anti-reductionists often point to small children, who accept testimony long before they are capable of inductive reasoning. Critics argue this is a naturalistic fallacy: just because children *do* trust blindly doesn't mean they are *justified* in doing so. How do you bridge the gap between a descriptive fact about development and a normative claim about epistemic entitlement?"

  *   **Context:** This challenges the inference from "is" (kids trust) to "ought" (kids are justified). It forces the guest to defend the normative weight of the developmental argument.
  *   **Likely Answer:** They will likely argue that the capacity for knowledge shouldn't depend on sophisticated cognitive skills we acquire later.

  ### 6. Child Development (Follow-up)
  "If the entitlement is rooted in that developmental necessity, does the strength of the entitlement change as we age? In other words, do adults retain the *same* default right to trust as a child, or does gaining the capacity for critical reasoning impose new burdens that children don't have?"

  *   **Context:** This tests the consistency of the view across the lifespan. If they say adults have more burdens, they risk conceding ground to reductionism; if they say no, they risk appearing naive about adult epistemic responsibilities.

  ### 7. Elizabeth Fricker's "Local Reductionism"
  "Elizabeth Fricker proposes a middle ground: we don't need global evidence that testimony is reliable, but we do need to monitor individual speakers for signs of incompetence or insincerity. How do you distinguish your 'default entitlement' from Fricker's 'monitoring requirement'? Is the difference merely about where the burden of proof lies, or is there a structural difference in how the hearer processes the testimony?"

  *   **Context:** This distinguishes the guest's view from the most plausible competitor. It asks whether the difference is substantive or just a matter of phrasing regarding the "burden of proof."
  *   **Likely Answer:** They will likely argue that monitoring is a secondary, negative check, whereas reductionism makes it a primary, positive requirement for justification.

  ### 8. The "Dealbreaker" Case (Closing & Fricker Follow-up)
  "Building on that distinction: if monitoring for red flags becomes necessary in almost every non-trivial conversation, your 'default' might look functionally identical to Fricker's 'local reductionism.' So, to close, I'd like to ask: what specific kind of case or scenario would force you to admit that Fricker was right and abandon the default-entitlement picture altogether?"

  *   **Context:** This satisfies the requirement for a Fricker follow-up *and* the closing requirement for a "view abandonment" question. It pressures the guest to define the limits of their own theory.
