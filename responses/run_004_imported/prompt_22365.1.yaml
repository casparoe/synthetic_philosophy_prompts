      *   *The Role of Demand (*chreia*):* Aristotle says demand "holds all things together." Without mutual need, no exchange. Demand is the *ontological* ground of commensurability.
      *   *The Role of Money (*nomisma*):* Money is a *conventional* representation of demand. It makes the abstract "demand" concrete and measurable.
      *   *The "Impossible" Claim:* "In truth (*tei aletheiai*) it is impossible... but with reference to demand they may become so sufficiently." This is the crux. It suggests commensurability isn't intrinsic (like weight) but relational/social.
