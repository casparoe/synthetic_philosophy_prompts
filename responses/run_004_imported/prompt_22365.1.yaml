answer: |-
  This is one of the most famous and notoriously difficult passages in the history of economic thought. You are right to feel that the text resists a simple reading; scholars have debated this specific chapter for centuries, precisely because Aristotle seems to be balancing on a knife-edge between metaphysical realism and social conventionalism.

  The confusion you are experiencing regarding the "impossible" commensurability, the role of demand (*chreia*), and the shift in proportions is not a failure of your reading. It is the central tension of the text.

  Here is a reconstruction of the argument designed to help you navigate your reading group discussion, focusing strictly on *Nicomachean Ethics* V.5 without leaning on the *Politics*.

  ### 1. The "Impossible" Commensurability: Nature vs. Convention
  Your primary sticking point is the apparent contradiction: Aristotle says it is "impossible" (*adynaton*) for a house and a bed to be truly commensurate, yet immediately explains how money makes them commensurate.

  This is not a contradiction, but a distinction between **ontological commensurability** and **functional commensurability**.

  *   **In Truth (*tei aletheiai*):** Aristotle is a realist. In terms of their physical nature (*physei*), a house and a bed share no common substance. One is for shelter, one for sleep. There is no intrinsic "value substance" inside them that allows you to say one is objectively equal to five of the other, in the way that two liters of water is objectively equal to two liters of wine. If you are looking for a natural property (like weight or volume) that makes them equal, it is *impossible*.
  *   **With Reference to Demand (*pros ten chreian*):** However, human society requires exchange to survive. For the *polis* to hold together, we must act *as if* they are commensurate. Money provides a **conventional** (*nomos*) standard that allows us to treat them as commensurate "sufficiently" (*hikanos*).

  **The Takeaway:** Money does not discover a pre-existing equality; it creates a working equivalence where none exists in nature. This is why Aristotle emphasizes that money exists "not by nature but by law." It is a social technology to solve a metaphysical problem.

  ### 2. Demand (*Chreia*) vs. Money (*Nomisma*)
  You asked whether money or demand is the true unit. Aristotle's hierarchy is subtle but consistent:

  1.  **Demand (*Chreia*) is the Ontological Ground:** Demand is what makes exchange *possible*. As Aristotle says, demand "holds all things together." If no one needed shoes, the shoemaker's labor would have no social traction. Demand is the *reason* for the commensurability. It is the shared social need that links the builder and the shoemaker.
  2.  **Money is the Epistemological Tool:** Demand is abstract and fluctuating. You cannot walk into a market with "demand" in your pocket. Money is the "representative" (*hypallagma*) of demand. It concretizes need into a countable unit.

  **Avoiding Circularity:** The argument avoids circularity (Money measures Value, Value is Price) because **Demand** is the external anchor.
  *   *Circular:* Money measures goods; Goods are worth what money says.
  *   *Aristotelian:* Mutual Need makes goods exchangeable; Money measures the intensity of that Need.

  So, when Aristotle says "this unit is in truth demand," he means demand is the *reality* behind the exchange. When he says money "measures all things," he means money is the *ruler* we agreed to use to measure that reality.

  ### 3. The Shift in Proportions: Geometric vs. Arithmetic
  You noticed a shift between the opening example (Builder/Shoemaker) and the closing example (House/Bed/Minas). This is crucial.

  *   **The Opening (Builder : Shoemaker :: House : Shoes):**
      This is a **proportion of persons and products**. Aristotle is establishing *Reciprocal Justice*. It is not enough that the house equals the shoes in value; the *Builder* must be proportionately related to the *Shoemaker*. If the builder is of higher social status or contributes more to the *polis*, the exchange ratio must reflect that to maintain the political bond. This is a **Geometric Proportion** (A is to B as C is to D). It is qualitative and political.
  *   **The Closing (House = 5 Minas; Bed = 1 Mina):**
      This is a **calculation of price**. Once the political/proportional relationship is acknowledged, we need a way to execute the trade. Here, Aristotle shifts to **Arithmetic Equivalence**. Money reduces the complex geometric ratio of social worth into a simple arithmetic equation (5 = 5).

  **Does the shift matter?** Yes. It shows that money performs a reduction. It takes the complex, qualitative social relationship (Builder vs. Shoemaker) and flattens it into a quantitative price (5 minas) so the transaction can actually occur. The "success" of the argument depends on recognizing that money simplifies social reality to make it tradable, even if that simplification loses the nuance of the original "proportionate equality."

  ### 4. The Marx Connection (Context for your Group)
  Your discussion leader mentioned Marx's footnote in *Capital* (Vol 1, Chapter 1, Section 3). It is worth knowing what Marx saw here, as it clarifies the "impossible" claim.

  Marx argued that Aristotle was brilliant to identify that exchange requires commensurability, but he stopped short of finding the *common substance*.
  *   **Aristotle's Answer:** The common substance is **Demand** (social need).
  *   **Marx's Critique:** Demand is too subjective. Marx argued the true common substance is **Abstract Human Labor**.
  *   **Why Aristotle didn't say this:** Marx suggests that because Aristotle lived in a slave society, he could not see "labor" as the equalizing factor, because the labor of a citizen (Builder) and a non-citizen/slave were not viewed as socially equal. Therefore, Aristotle could only locate the equality in "need" (*chreia*) and "convention" (*nomos*), rather than in the production itself.

  This supports your reading: Aristotle knows there is no *natural* equality (hence "impossible"), so he settles for a *social* equality based on need and convention.

  ### 5. Reconstructing the Argument for Your Meeting
  To avoid the argument collapsing, you can propose the following three-step synthesis to your group:

  1.  **The Problem:** Exchange is necessary for the *polis*, but goods are heterogeneous (houses $\neq$ shoes). There is no natural common measure.
  2.  **The Solution (Ontological):** **Demand (*chreia*)** is the common denominator. It is the mutual interdependence of citizens that makes different goods comparable. Without shared need, there is no exchange.
  3.  **The Solution (Practical):** **Money (*nomisma*)** is the conventional proxy for demand. It allows us to quantify the unquantifiable. It makes the "impossible" commensurability "sufficiently" possible for the sake of social cohesion.

  **Addressing the "Contradiction":**
  When Aristotle says it is "impossible" for things to become commensurate, he means **metaphysically**. When he says money makes them commensurate, he means **pragmatically**. Money is a "fiction" (in the sense of *nomos*/convention) that is necessary for truth (*aletheia*) of social survival.

  ### Summary of Key Distinctions
  | Concept | Role in Argument | Nature |
  | :--- | :--- | :--- |
  | **Demand (*Chreia*)** | The *ground* of exchange. Makes goods comparable. | Real / Social Fact |
  | **Money (*Nomisma*)** | The *measure* of exchange. Represents demand. | Conventional / Legal |
  | **Commensurability** | **Impossible** by nature (houses $\neq$ beds). **Possible** by convention (via money). | Relational / Functional |
  | **Proportion** | **Geometric** (Builder/Shoemaker) justifies the ratio. **Arithmetic** (Minas) executes the price. | Political vs. Economic |

  ### A Note on Translation
  Since you are using Ross, keep in mind that *chreia* is indeed tricky. It means "need," "use," and "demand" simultaneously. If someone argues for a "subjective theory of value" (modern economics), remind them that for Aristotle, *chreia* is not individual preference (I want this), but social necessity (The city needs this). It is objective social need, not subjective utility.

  This reconstruction should allow you to defend the text against the charge of circularity: Money measures Demand; Demand validates Money; but the *anchor* is the survival of the political community (*koinonia*), which requires the exchange to happen. The argument succeeds not as a theory of pricing, but as a theory of social cohesion.
