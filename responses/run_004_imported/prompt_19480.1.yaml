answer: |-
  This is a formidable challenge because, as you have discovered, the philosophical consensus since Sidgwick and Ramsey has been overwhelmingly against the ethical defensibility of a positive pure rate of time preference (PRTP). To defend it requires stepping outside standard utilitarian frameworks and engaging with metaphysical, contractualist, and structural arguments that are often kept out of mainstream climate economics.

  However, there is a rigorous, minority case for PRTP > 0. It does not rely on uncertainty, extinction risk, or economic growth. It relies on the **ontological asymmetry between present and future persons**, the **problem of infinite obligation**, and the **directionality of causality**.

  Here is the strongest construction of that case, structured to address the specific "space vs. time" objection you raised.

  ### 1. The Argument from Infinite Obligation (The "Tyranny of the Future")

  The most potent ethical defense of a positive PRTP is not that the future matters *less*, but that without discounting, the present matters *not at all*.

  If we assume a potentially infinite future timeline and a zero pure time preference, the sum of future utility becomes mathematically dominant over any finite present utility. Even a vanishingly small benefit to every future generation, aggregated over infinity, outweighs any catastrophic cost to the current generation.

  *   **The Logic:** If $\delta = 0$ and $T = \infty$, then $\int_{0}^{\infty} U(t) dt$ swamps $U(0)$.
  *   **The Ethical Implication:** This renders the present generation mere servants to the future. It creates a "tyranny of the future" where no sacrifice is too great for the present to make, provided it yields a permanent, non-zero improvement for the future.
  *   **The Defense:** A positive PRTP acts as a **moral horizon**. It asserts that the moral community has a temporal structure where proximity matters. Just as we accept that we have stronger obligations to our children than to strangers (partiality), we may have stronger obligations to contemporaries than to non-existent future beings. Without this discount, the concept of "intergenerational equity" collapses into "intergenerational servitude."

  **Why this doesn't apply to space:** Spatially distant people are finite in number (within any given time slice). Saving a person in Antarctica does not trigger an infinite chain of obligations in the same way saving the *concept* of future humanity does. The "infinity problem" is unique to the temporal dimension.

  ### 2. The Ontological Argument: Existence vs. Potentiality

  This argument rests on a metaphysical claim: **Present people exist; future people do not.**

  Standard utilitarianism treats "well-being" as a container that can be filled regardless of when the subject exists. However, an "Actualist" or "Existence-Dependent" view of morality argues that moral weight attaches to *actual* subjects.

  *   **The Logic:** A person living in a distant country is a *contemporary*. They share the same ontological status as you: they are actual, existing entities with rights and interests that are currently active. A person in 2150 is currently a potentiality. Their interests are not "waiting" to be satisfied; they are contingent on our actions bringing them into existence (or maintaining the conditions for their existence).
  *   **The Defense:** Discounting based on temporal distance is not discrimination against a person; it is a recognition of the difference between **obligations to existing beings** and **obligations regarding possible beings**. To weigh a future person's utility equally with a present person's is to treat potential existence as morally equivalent to actual existence.
  *   **The "Space vs. Time" Rebuttal:** This directly answers your spatial objection. A person in Tokyo is spatially distant but temporally co-present. They are "actual" in the same way you are. A person in 2100 is not. Therefore, spatial distance preserves moral symmetry (both exist), while temporal distance breaks it (one exists, one does not).

  ### 3. The Argument from Causal Asymmetry and Reciprocity

  This is a contractualist defense, drawing on the idea that morality is grounded in the possibility of reciprocal cooperation or shared causal context.

  *   **The Logic:** Time has a direction (entropy, causality); space does not. We can affect future people, but they cannot affect us. We can affect distant people, and they can affect us (e.g., through trade, communication, political pressure, or even just the knowledge of their suffering).
  *   **The Defense:** Moral obligations are strongest within a **community of interaction**. Because future generations cannot reciprocate, negotiate, or share in the burden of sacrifice, the relationship is fundamentally different from the relationship with spatially distant contemporaries. A positive PRTP acknowledges this lack of reciprocity. It reflects the ethical intuition that obligations are weaker when the relationship is strictly one-way.
  *   **The "Space vs. Time" Rebuttal:** Spatially distant people are capable of reciprocity. If I help a distant nation, they might trade with me, ally with me, or simply acknowledge the moral debt. Future people cannot do this. Therefore, discounting based on temporal distance is not arbitrary bias; it is a recognition of the **unidirectionality of causal power**.

  ### 4. The Phenomenological Argument: "Thank Goodness That's Over"

  Philosopher A.N. Prior famously argued that temporal bias is rational and intrinsic to consciousness. When we say "Thank goodness that's over" about a pain, we are expressing a preference that pain be in the past rather than the future, even if the intensity is identical.

  *   **The Logic:** Human rationality is inherently tensed. We experience time as a flow, not a block universe. To demand that a rational agent value a future pain exactly as much as a present pain is to demand they cease experiencing time as humans do.
  *   **The Defense:** If ethics is grounded in the experiences of moral agents (rather than abstract Platonic utilities), then the **structure of human consciousness** matters. A positive PRTP aligns social planning with the psychological reality of the agents doing the planning. To impose $\delta = 0$ is to impose a "view from nowhere" that no actual human can occupy.
  *   **The "Space vs. Time" Rebuttal:** We do not have a similar phenomenological bias against space. We do not inherently feel that pain in Tokyo is less real than pain in New York simply due to distance. But we *do* inherently feel that pain next week is less pressing than pain today. The discount rate reflects the structure of human agency, which is oriented toward the immediate.

  ### Summary for Your Readers

  To summarize the "opposing case" for your article, you might frame it this way:

  Defenders of a positive pure rate of time preference do not argue that future happiness is intrinsically less valuable. Rather, they argue that **moral obligation is structurally dependent on existence, reciprocity, and finitude.**

  1.  **Ontology:** Contemporaries exist; future people do not. Spatial distance preserves existence; temporal distance does not.
  2.  **Infinity:** Without discounting, the infinite future mathematically annihilates the moral worth of the present. Spatial obligations do not suffer from this infinite aggregation.
  3.  **Reciprocity:** Moral communities rely on potential interaction. Future generations are causally isolated from us; distant contemporaries are not.

  The strongest version of this argument concludes that setting the pure time preference to zero is not "more ethical"; it is a category error that treats time like space, ignoring the unique metaphysical and causal asymmetries of the temporal dimension.

  ### Key Sources to Cite

  While most philosophers oppose PRTP, these sources engage with the defense seriously:

  *   **C. Fred Bergstrom:** Has written on the "tyranny of the future" and the mathematical implications of zero discounting over infinite horizons.
  *   **Tyler Cowen:** In *Stubborn Attachments*, he grapples with the growth vs. discounting trade-off, acknowledging the dangers of zero discounting.
  *   **A.N. Prior:** "Thank Goodness That's Over" (1959) for the phenomenological defense of temporal bias.
  *   **Jan Narveson:** Argues for a "person-affecting" view where we have no obligations to bring future people into existence, which supports discounting their potential utility relative to actual people.
  *   **Melinda Roberts:** Work on the Non-Identity Problem suggests that because future people's existence depends on our choices, our obligations to them are different than to existing people.

  This framework should provide the rigorous counterweight you are looking for without resorting to the "uncertainty" or "wealth" arguments you've already ruled out.
