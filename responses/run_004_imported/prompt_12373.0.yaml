answer: |-
  Adam Elga's "Subjective Probabilities Should Be Sharp" is indeed treated as a heavyweight knockout in many rationalist circles. The argument is elegant: if you have imprecise credences (e.g., $P(H) \in [0.4, 0.6]$), and you follow standard decision rules for such credences (like $\Gamma$-maximin), you will reject two bets that, taken together, guarantee a profit. Elga concludes that since leaving guaranteed money on the table is irrational, the imprecise credence model must be discarded.

  However, Elga's argument is not a proof that imprecise credences are incoherent; it is a proof that **imprecise credences are incompatible with the Separability principle** (the idea that rational choice at a node depends only on future consequences from that node).

  To defend the rationality of imprecise credences without collapsing into sharpness, you do not need vague appeals to "sophistication." You need to explicitly reject Separability in favor of **Resolute Choice** grounded in **Portfolio-Dependent Evaluation**. Here is the concrete argument for why an agent can retain imprecise credences, accept Elga's bets, and remain rational.

  ### 1. The Hidden Premise: Separability vs. Holism

  Elga's trap relies on the assumption that a rational agent must evaluate the second bet at time $t_2$ in isolation from the first bet, treating the first bet as "sunk." This is the **Separability** principle (or Dynamic Consistency combined with Consequentialism).

  Elga argues that at $t_2$, the agent faces a choice: Take Bet 2 or Reject Bet 2. The past (Bet 1) is fixed. If the agent's credence in $H$ is still imprecise, and they evaluate Bet 2 locally, the minimum expected utility is negative, so they reject it. Anticipating this at $t_1$, they reject Bet 1. Result: \$0.

  The defense of imprecise credences begins by noting that **ambiguity is a property of a portfolio, not just individual acts.**
  *   **Bet 1 alone:** Increases exposure to the ambiguity of $H$.
  *   **Bet 2 alone:** Increases exposure to the ambiguity of $H$.
  *   **Bet 1 + Bet 2:** Eliminates exposure to the ambiguity of $H$ (the payoff is constant).

  For an ambiguity-averse agent, the value of Bet 2 *depends logically* on whether Bet 1 has been taken. Bet 2 is not a "gain" in isolation; it is a "hedge" in the context of Bet 1. Therefore, the decision problem at $t_2$ is **not** "Should I take Bet 2?" It is "Should I complete the hedge?"

  Elga claims that PLAN and SEQUENCE fail because they require the agent to treat the choice at $t_1$ and $t_2$ differently despite the agent's beliefs and outcomes being "alike." This is false. The **ambiguity profile** of the available outcomes is not alike.
  *   At $t_1$, the agent chooses between a certain \$0 and a *risky portfolio* (Bet 1 + Planned Bet 2).
  *   At $t_2$, if the agent treats Bet 1 as sunk, they choose between a *risky position* (Bet 1 only) and a *different risky position* (Bet 1 + Bet 2).

  If the agent evaluates the *total final wealth distribution* (which they should, if they care about ambiguity), the choice at $t_2$ is between "Remain Ambiguous" (reject Bet 2) and "Become Sharp" (accept Bet 2). A rational ambiguity-averse agent prefers "Become Sharp." Elga's claim that the nodes are identical ignores that the *state of the agent's exposure to uncertainty* is different at each node.

  ### 2. Resolute Choice as a Decision Rule

  To "get through the betting case intact" (i.e., actually take the \$5), the agent cannot be merely "sophisticated" in the game-theoretic sense (predicting their future self's defection). They must be **Resolute**.

  **Resolute Choice** (defended by Edward McClennen) is a specific, formal decision rule:
  1.  At $t_1$, identify the optimal *complete plan* (sequence of actions) based on current preferences.
  2.  Commit to executing that plan at future nodes, even if re-evaluating at the future node in isolation would suggest a different action.

  Elga objects to this by saying it violates Consequentialism: "Why should a choice at $t_1$ bind you at $t_2$ when no new evidence has arrived?"

  **The Counter-Argument:** The binding force does not come from magic; it comes from the recognition that **preferences over sequences are primary.**
  If you genuinely have imprecise credences, your preference ordering is defined over *acts* (functions from states to outcomes), not just *outcomes*.
  *   Act A: Take Bet 1, then Take Bet 2. (Payoff: +\$5 certain).
  *   Act B: Take Bet 1, then Reject Bet 2. (Payoff: Ambiguous).
  *   Act C: Reject Bet 1...

  At $t_1$, Act A dominates Act B and C. If you are rational, you choose Act A. If you choose Act A, you are committed to the second step. To defect at $t_2$ is not to "update rationally"; it is to suffer a **preference reversal** without new information. Elga assumes that re-evaluating at $t_2$ is required for rationality. The imprecise credence proponent argues that *sticking to the plan* is required for rationality, because the plan was the only object that satisfied the ambiguity-aversion constraint.

  ### 3. Why This Does Not Collapse to Sharp Credences

  Elga's second prong is that if you accept both bets, you are acting *as if* you have a sharp credence (specifically $P(H) = 0.5$). He argues this renders the imprecise model redundant.

  This is empirically and theoretically false. We can distinguish the **Imprecise Resolute Agent** from the **Sharp Agent** via a simple counterfactual test: **The Single-Bet Scenario.**

  *   **Sharp Agent ($P=0.5$):**
      *   Bet 1 EU: $0.5(-10) + 0.5(15) = +2.5$.
      *   Action: **Accept Bet 1 even if Bet 2 is not offered.**
  *   **Imprecise Agent ($P \in [0.4, 0.6]$):**
      *   Bet 1 Min-EU: $0.6(-10) + 0.4(15) = 0$. (Or negative, depending on interval width).
      *   Action: **Reject Bet 1 if Bet 2 is not offered.**

  The Imprecise Resolute Agent takes the pair in Elga's scenario but would reject the first bet in isolation. The Sharp Agent takes the first bet in *both* scenarios. Their behavioral dispositions are distinct. Therefore, accepting the pair does not "quietly reinstate a sharp number." It confirms the agent is optimizing for **ambiguity reduction**, not **expected value maximization** based on a point estimate.

  The "sharpness" of the *payoff* in the combined bet (\$5 certain) does not imply sharpness in the *credence*. It implies the agent successfully hedged their ambiguity. To conflate the two is to confuse the *object* of belief (the world) with the *structure* of the portfolio (the bets).

  ### 4. Addressing the PLAN/SEQUENCE Bind Directly

  Elga specifically attacks **PLAN** (choose the best plan at $t_1$) and **SEQUENCE** (evaluate choices based on the sequence). He claims they fail because they treat the choice at $t_2$ differently depending on what happened at $t_1$, despite the agent's epistemic state regarding $H$ being unchanged.

  **The Rebuttal:** The agent's epistemic state regarding $H$ is unchanged, but their **epistemic state regarding their own financial exposure** has changed.
  *   At $t_1$, the agent is "naked" to $H$.
  *   At $t_2$ (having taken Bet 1), the agent is "short" on $H$.

  Elga assumes the only thing that matters is $P(H)$. But for an imprecise agent, what matters is the **set of probable measures over final wealth**.
  *   At $t_1$, the set of measures for {Take, Take} is a Singleton (Variance = 0).
  *   At $t_2$, if the agent ignores the plan, the set of measures for {Take} is an Interval (Variance > 0).

  Elga argues that rational choice must be **Consequentialist**: only the final outcomes matter, not the path. But this presupposes that the *value* of an outcome is path-independent. For an ambiguity-averse agent, the value of a dollar is path-dependent because the *certainty* of that dollar depends on the path taken to acquire it.

  Therefore, PLAN and SEQUENCE do not fail. They correctly identify that the **admissibility** of an act at $t_2$ depends on the act chosen at $t_1$. Elga calls this irrational because it violates Separability. The imprecise credence defender replies: **Separability is the axiom that must go.** It is more rational to violate Separability (by committing to a plan) than to violate the evidence (by adopting a sharp credence where none is warranted).

  ### Conclusion

  Elga's argument succeeds only if you grant that **Dynamic Consistency + Separability > Ambiguity Aversion**.
  But there is a coherent rational package that reverses this priority:
  1.  **Credences:** Imprecise (reflecting the evidence).
  2.  **Decision Rule:** Resolute Choice / Global Planning (respecting ambiguity aversion).
  3.  **Axiom Sacrificed:** Separability (acknowledging that the value of a hedge depends on what is being hedged).

  An agent using this package accepts both bets (getting the \$5), rejects Bet 1 in isolation (preserving the imprecise signature), and remains dynamically consistent by treating the *plan* as the unit of agency rather than the *momentary choice*. This is not a "vague appeal to sophistication"; it is a well-defined decision-theoretic stance (McClennen's Resolute Choice) that handles Elga's case without forcing the agent to pretend their uncertainty is sharper than it is. Rationality permits you to tie your own hands to avoid ambiguity; Elga has not proven otherwise, only that doing so costs you the axiom of Separability.
