  5.  **Final Polish:**
      *   Tone: Rigorous, philosophical, engaging directly with the LessWrong/EA context (rationality, decision theory).
      *   Structure:
          1.  Concede Elga's logical validity *given his premises*.
          2.  Identify the contested premise: **Separability/Consequentialism**.
          3.  Defend **Portfolio-Dependent Evaluation** (why Bet 2 isn't the same at $t_2$ as it looks in isolation).
