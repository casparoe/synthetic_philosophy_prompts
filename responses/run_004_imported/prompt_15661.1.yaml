answer: |-
  Friends from the club, family, and everyone who loved Walter.

  For those of you who rode with him, you know that Walter measured his life in miles, not minutes. He cared about the horizon, the lean of the bike, and the brotherhood of the road. He didn't worry much about the clock. But this week, the clock has been all any of us can hear.

  We are gathered here because Walter is gone. And I know that for this family, the timing of that departure has become a heavy burden. I know there are questions about Tuesday and Wednesday. I know there is pain in the gap between those two days.

  I stand here as Walter's nephew. I also happen to teach bioethics. But I am not here to teach a seminar. I am here to honor my uncle. And to honor him, I have to speak the truth as clearly as I can, even when it is hard.

  Walter died on Tuesday.

  I say this not to dismiss what anyone saw or felt, but to honor the choice he made when he signed his donor card. On Tuesday, the person we knew—the rider, the uncle, the man with the laugh that could shake the walls—left us. The brain that steered the motorcycle and remembered our birthdays had ceased to function. That is when Walter's journey ended.

  But I also know what Aunt Deb saw. I know that on Wednesday, his chest still rose. I know his skin was still warm. To see that, and to be told he was gone, feels like a contradiction. It feels like a fiction. Deb, your eyes did not deceive you. His body *was* working. But a heartbeat is not the same thing as a life.

  The reason his heart beat on Wednesday was not because Walter was still here waiting. It was because Walter had already left, and he left instructions. He asked that if his body could heal others, it should. The ventilation on Wednesday wasn't keeping Walter alive; it was allowing Walter to give. The warmth you felt wasn't a sign of his presence; it was the engine of his generosity, running on the fuel of his prior consent.

  And Mark, you saw the other side of this. You saw the monitors. You saw the medical reality that the person was gone. You are right, too. The organism as a whole, the integrated person, was no longer there.

  It is painful when the medical record and the human eye tell different stories. But we don't have to choose between loving the memory of the man and respecting the function of the body. We can hold both. We can acknowledge that Tuesday was the day the rider fell, and Wednesday was the day the gift was delivered.

  For the friends from the club: I know none of this matters to you. You don't care about ventilators or declarations. You care that the road got a little quieter. You care that a good rider isn't coming back to the clubhouse. Walter would want it that way. He wouldn't want us arguing over the timestamp of his death. He would want us to talk about the ride.

  He was a man who lived with his hands on the handlebars and his heart in the open. He made the hardest decision a person can make—deciding that his death could mean life for someone else—and he made it look easy. That wasn't easy. That was courage.

  So, let us lay the debate to rest. Let us agree that Tuesday was the day we lost him, and Wednesday was the day he saved others. Both are part of his story. Both are acts of love.

  Walter rode hard, he loved deep, and he gave everything he had, right down to the final beat of his heart. The road ends for all of us. But the distance we cover, and the people we help along the way, that's what stays.

  Ride in peace, Uncle Walter. We'll take it from here.
