prompt: |-
  I have served on my hospital's ethics consultation committee for two years, but until last week the role was mostly theoretical. A case has now arrived that I find genuinely difficult, and it has sent me back into decision theory in a way I never expected my job to require. Eighteen months ago, a patient with a long history of severe bipolar I disorder executed a psychiatric advance directive containing what her outpatient psychiatrist calls a "Ulysses clause": while euthymic, she specified that if she ever entered a manic episode meeting stated severity criteria (fewer than two hours of sleep for three consecutive nights, spending above a fixed dollar threshold, or sustained refusal of her mood stabilizer), she was to be hospitalized and medicated regardless of her objections at the time, and that the directive itself could be revoked only in writing while she was stable, with her psychiatrist's concurrence. She explained her reasoning in the document: two previous untreated episodes had already cost her a marriage and a job, she described her manic refusals as belonging to "a self I don't want making decisions for me," and she said she would rather be overridden every single time than lose what remained of her life a third time.

  She is now in exactly the episode the clause anticipated, and the case has turned out to be harder than any of us expected. She does not meet our jurisdiction's threshold for involuntary commitment on ordinary grounds, since she is neither violent nor suicidal, only severely impaired in judgment. More awkwardly, the attending's formal capacity assessment concluded that she meets the standard criteria for decisional capacity regarding this specific choice: she is coherent, oriented, and able to give a fluent argument for refusing treatment, saying the medication "takes away the only version of me that has ever gotten anything done" and that honoring the clause now would let "someone who doesn't have to live with today" decide for her. Her sister, who is named in the directive, wants it invoked immediately, citing the money already given away this week; the patient's court-appointed advocate counters that no document can validly pre-empt a contemporaneous, articulate refusal like this one without effectively cancelling her standing as a person for the duration of every future episode. I should mention, since it seems relevant, that this is not the first cycle: she signed a similar clause after an episode two years ago, and here we are again. That repetition is what sent me looking outside our usual clinical-ethics toolkit, where I kept running into money-pump arguments and the distinction between "sophisticated" and "resolute" choice in decision theory, both of which seem to bear directly on whether a person can rationally bind a later self at all -- though I don't know how to turn either into something a hospital committee can actually vote on.

  Could you draft the short opinion I would circulate before our meeting in two days? Everyone agrees we cannot simply wait the episode out; the committee needs to say something within 48 hours. I need the opinion to recommend one concrete course of action for this patient with that time frame attached, to state explicitly whether and how this case should shape a standing hospital policy on Ulysses clauses going forward, and to take the advocate's objection seriously on its own terms rather than quietly resolving it into an ordinary capacity determination.
reasoning: |-
  Here's a thinking process that leads to the suggested ethics committee opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital ethics consultation committee.
      *   **Task:** Draft a short opinion to circulate before a meeting in two days.
      *   **Case:** A patient with Bipolar I executed a Psychiatric Advance Directive (PAD) with a "Ulysses clause" (binding future self during mania). She is currently manic but meets standard criteria for *decisional capacity* regarding treatment refusal (coherent, oriented, articulate). She does not meet involuntary commitment (IVC) standards (no violence/suicidality).
      *   **Conflict:** Sister wants PAD enforced. Court-appointed advocate argues PAD invalidates personhood/autonomy during episodes. Patient argues current self is valid.
      *   **Requirements:**
          1.  Recommend one concrete course of action within 48 hours.
          2.  State explicitly how this should shape standing hospital policy on Ulysses clauses.
          3.  Take the advocate's objection seriously (don't just dismiss it as a capacity issue).
          4.  Acknowledge the decision theory context (money-pump, sophisticated vs. resolute choice) but translate it into clinical ethics language.
      *   **Tone:** Professional, ethically rigorous, decisive, suitable for a hospital committee.

  2.  **Deconstruct the Ethical Dilemma:**
      *   **Autonomy (Precedent vs. Contemporaneous):** This is the core tension. Precedent autonomy (the PAD signed while euthymic) vs. Contemporaneous autonomy (the refusal spoken while manic but "capable" by standard assessment).
      *   **Capacity Assessment:** The attending says she has capacity *now*. However, standard capacity assessments (understand, appreciate, reason, express choice) often fail to detect the *values distortion* inherent in mania. She understands the risks, but her *valuation* of the manic state is pathologically inflated.
      *   **The "Ulysses" Metaphor:** Binding oneself to the mast to resist the Sirens. The ethical question is: Can the "euthymic self" bind the "manic self"?
      *   **Advocate's Objection:** If we enforce the PAD, do we treat the patient as a non-person during episodes? Does this create a "two selves" problem where one self enslaves the other?
      *   **Decision Theory:**
          *   *Money Pump:* If preferences reverse cyclically (Euthymic prefers Treatment -> Manic prefers No Treatment -> Euthymic prefers Treatment), an agent can be exploited. Binding prevents the pump.
          *   *Sophisticated vs. Resolute:* A "sophisticated" chooser anticipates future preference changes and plans around them. A "resolute" chooser sticks to the original plan despite changed preferences. The PAD is an act of resolute choice by the euthymic self.
      *   **Legal/Policy Context:** Many jurisdictions recognize PADs, but few address the specific conflict of *capacity during the episode*. If she has legal capacity now, does the PAD override it? Usually, PADs kick in when capacity is *lost*. Here, capacity is arguably *retained* but compromised by illness values.

  3.  **Formulate the Recommendation:**
      *   *Action:* Honor the Ulysses clause. Treat despite current objection.
      *   *Rationale:* The standard capacity assessment is insufficient for psychiatric advance directives in bipolar disorder. Mania inherently distorts value weighting, even if logic remains intact. The "euthymic self" represents the stable, authentic agent over time. Ignoring the PAD undermines the autonomy of the well self to protect the life of the whole person.
      *   *Addressing the Advocate:* Acknowledge the risk of "self-cancellation." Mitigate this by ensuring the PAD is specific (it is), voluntary (it was), and reviewed periodically. The goal isn't to cancel personhood but to preserve the *continuity* of the person's life narrative against episodic disruption.
      *   *Policy:* We need a specific protocol for Ulysses clauses. They shouldn't be treated as standard PADs. They require higher thresholds for execution (e.g., witnessed, psychiatrist concurrence *at the time of signing*, specific triggers).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** State the urgency and the specific question.
      *   **Recommendation:** Clear and immediate. Honor the directive.
      *   **Ethical Analysis (The "Why"):**
          *   *Autonomy:* Distinguish between "decisional capacity" (mechanical) and "authentic autonomy" (values-based). Mania distorts values. The PAD represents the authentic, stable value system.
          *   *Decision Theory Translation:* Use the concept of "temporal neutrality" or "narrative unity." The patient explicitly identified the manic self as an intruder on her life narrative. Respecting the PAD respects the *whole* life, not just the *current* moment.
          *   *Addressing the Advocate:* This is crucial. Don't dismiss. Acknowledge that enforcing the PAD *does* override the current voice. Justify it not by denying her personhood, but by affirming the *precedence* of the stable self's judgment about what constitutes harm to her life. It's a protection of liberty *over time*, not just liberty *in the moment*.
      *   **Policy Implications:** Ulysses clauses need specific safeguards. Not all PADs are equal. Need verification of stability at signing, specific triggers, and periodic renewal (to avoid the "cycle" problem where it's signed in crisis and forgotten).
      *   **Conclusion:** Reiterate the commitment to the patient's long-term agency.

  5.  **Refining the Tone and Content:**
      *   *Check:* Did I use the decision theory terms? The prompt mentions "money-pump" and "sophisticated/resolute." I should incorporate the *concepts* without necessarily using jargon that confuses clinicians, or explain the jargon briefly if it adds precision. *Decision:* Use the concepts (binding future self, preference reversal) but keep the language accessible to a medical committee.
      *   *Check:* Did I address the 48-hour window? Yes, the recommendation must be immediate.
      *   *Check:* Did I address the advocate's point? Yes, in the "Personhood and Objection" section.
      *   *Check:* Is the policy recommendation concrete? Yes, specific criteria for Ulysses clauses.

  6.  **Self-Correction/Polishing during drafting:**
      *   *Initial thought:* Maybe suggest a court order? *Correction:* No, too slow. 48 hours. The ethics committee needs to give moral cover for the clinical team to act on the PAD.
      *   *Initial thought:* Dismiss the capacity assessment. *Correction:* Too aggressive. Acknowledge the attending's finding but explain why it's insufficient *in this specific context* (psychiatric values vs. medical facts).
      *   *Focus:* Ensure the distinction between "standard PAD" (for incapacity) and "Ulysses Clause" (for refusal *despite* capacity/objection) is clear. This is the legal/ethical crux.

  7.  **Final Review against constraints:**
      *   Concrete course of action? Yes (Medicate/Hospitalize per PAD).
      *   Policy shape? Yes (Specific protocol for Ulysses clauses).
      *   Advocate's objection? Yes (Addressed via "Narrative Autonomy").
      *   Timeframe? Yes (Immediate).

  8.  **Final Polish:** Ensure the voice sounds like a senior ethics committee member—respectful, analytical, but decisive. (Proceed to generate output).

  *(Self-Correction Note on Decision Theory)*: The prompt specifically mentions "money-pump arguments" and "sophisticated vs. resolute choice." I should explicitly reference these concepts to show I've engaged with the user's specific intellectual struggle, but translate them into ethical reasoning.
  *Money Pump:* If we let the manic self decide, she cycles into ruin, then regrets it, then cycles again. This is irrational over time.
  *Resolute Choice:* The euthymic self is making a resolute choice to bind the future self to prevent the cycle.
  *Integration:* I will weave this into the "Autonomy Over Time" section.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Consultation Committee
  **FROM:** [Your Name/Role]
  **DATE:** October 26, 2023
  **RE:** Urgent Recommendation Regarding Case # [Patient ID] – Psychiatric Advance Directive and Ulysses Clause

  **1. Immediate Recommendation (48-Hour Window)**
  I recommend the committee authorize the clinical team to **invoke the Psychiatric Advance Directive (PAD) immediately**, proceeding with hospitalization and mood-stabilizing medication as specified in the Ulysses clause, despite the patient's contemporaneous refusal.

  This action should be taken under the ethical authority of the PAD, not under involuntary commitment statutes, as the patient does not meet the legal threshold for danger to self/others. The clinical team must document that the intervention is based on *precedent autonomy* established during a period of demonstrated stability, rather than a finding of current incapacity.

  **2. Ethical Analysis: Autonomy Over Time**
  The core conflict here is not between autonomy and paternalism, but between *contemporaneous autonomy* (the patient's voice today) and *precedent autonomy* (the patient's voice while euthymic). Standard capacity assessments measure the ability to process information and reason logically. As the attending noted, the patient retains this ability. However, in Bipolar I mania, the *valuation* of that information is pathologically distorted. She can reason perfectly toward a conclusion that her euthymic self identifies as catastrophic.

  To address the decision theory concerns raised: We are witnessing a preference reversal cycle. If we prioritize the manic self's preferences, we enable a "money-pump" scenario where the patient cyclically consumes her own life resources (relationships, employment, finances) only to regret it upon returning to stability. The Ulysses clause is a mechanism of **resolute choice**. It allows the "euthymic self" to bind the "manic self" to prevent predictable, self-destructive preference reversals. Respecting the clause is not a violation of autonomy; it is an affirmation of the patient's *long-term* autonomy over her *episodic* impulses. It honors her explicit instruction that the euthymic self is the "true" agent of her life narrative.

  **3. Addressing the Advocate's Objection**
  The court-appointed advocate argues that enforcing this clause effectively cancels the patient's standing as a person during episodes, reducing her to a vessel for her past self's commands. This objection must be taken seriously. If we routinely override contemporaneous refusal, we risk treating psychiatric patients as non-agents whenever they deviate from their "well" preferences.

  However, we can resolve this without denying her personhood by framing the PAD as an exercise of **narrative unity**. The patient did not merely express a treatment preference; she defined the conditions of her own agency. She explicitly stated that the manic refusal belongs to "a self I don't want making decisions for me." To ignore this is to impose *our* definition of her personhood over *her* definition. We are not silencing a person; we are honoring a person's specific instruction on how to handle the fragmentation of their own psyche. The safeguard against abuse is not ignoring the clause, but ensuring the clause was executed with the high safeguards detailed below. We respect her personhood by respecting her judgment about how her illness affects her personhood.

  **4. Policy Implications: Standing Protocol for Ulysses Clauses**
  This case reveals a gap in our current policy. Standard PADs assume incapacity triggers enforcement. Ulysses clauses are designed for *refusal despite capacity*. Going forward, I propose the committee draft a standing policy with the following requirements for Ulysses clauses to be considered binding:

  *   **Verification of Stability:** Execution must be witnessed and concurred by the treating psychiatrist *during a verified euthymic period*, not during or immediately following hospitalization.
  *   **Specific Triggers:** As in this case, the clause must define objective behavioral criteria (e.g., sleep hours, spending thresholds) rather than subjective feelings.
  *   **Periodic Re-affirmation:** To address the advocate's concern about "eternal binding," these clauses should expire after a set period (e.g., 2 years) unless re-executed, ensuring the "euthymic self" regularly renews the commitment.
  *   **Exclusion Criteria:** These clauses cannot be invoked if the patient expresses a *new*, stable value system that persists across multiple euthymic intervals (i.e., if she changes her mind while well, the old clause is void).

  **5. Conclusion**
  We cannot wait for the episode to resolve naturally; the financial and social damage is accruing daily. By honoring the Ulysses clause, we align ourselves with the patient's own assessment of her best interests over the course of her life, rather than merely in the present moment. We validate her right to construct a life that is not held hostage by her pathology.

  I request we vote on this recommendation by 09:00 tomorrow to allow clinical implementation.
