prompt: |-
  A friend and I spent most of a long dinner arguing about whether it can ever be rational to prefer not knowing something. The trigger was her ongoing indecision about taking a genetic test for a late-onset hereditary condition that, even if the result came back positive, she would have no way of treating or preventing. I argued that her reluctance to test sat uneasily with a result I had come across a while ago: I. J. Good's 1967 proof that, for a Bayesian decision-maker, the expected value of free and relevant information can never be negative, and is generally strictly positive whenever the information is even slightly likely to change what one would otherwise do. On my reading, this seemed to settle the matter in favor of testing.

  She was unconvinced, and pushed back with a handful of cases that, the more I thought about them, seemed like genuine trouble for my glib appeal to the theorem rather than mere emotional resistance to it: a mutually beneficial insurance contract that would unravel the moment either party learned a fact that current ignorance is quietly protecting; a negotiator who is better off not learning her counterpart's true reservation price, since she can then never be tempted, or pressured, into revealing it; and simply the fact that people who receive an accurate terminal prognosis often report being made worse off by the news even when it changes nothing about their treatment options. Neither of us could say with any precision whether these are real counterexamples to Good's theorem, cases the theorem was never meant to cover, or situations where the theorem is technically vindicated but somehow still misses the point.

  I would like your help thinking this through more rigorously than we managed over dinner. Could you first explain, with enough precision that the assumptions are fully visible, what Good's theorem actually shows and for whom? Then, rather than stopping at the formal result, I would like you to set out what you take to be its most important implications and limits for how a person should actually reason about seeking out information, in personal decisions like my friend's as well as in professional or strategic ones. I would especially appreciate it if you could work through my friend's three examples along the way and tell us plainly where each one lands.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Core Question:** Is it ever rational to prefer not knowing something? (Specifically in the context of I.J. Good's theorem vs. real-world intuition).
      *   **Context:** A dinner argument between the user and a friend regarding genetic testing for an untreatable condition.
      *   **User's Position:** Cites I.J. Good's 1967 theorem (Expected Value of Information is non-negative).
      *   **Friend's Position:** Cites counterexamples (Insurance unraveling, Negotiation leverage, Psychological harm of prognosis).
      *   **Task:**
          1.  Explain Good's Theorem precisely (assumptions, scope, target audience).
          2.  Discuss implications and limits for reasoning about information seeking (personal & strategic).
          3.  Analyze the friend's three specific examples against the theorem.
          4.  Maintain a rigorous but accessible tone (helping them think through it "more rigorously than we managed over dinner").

  2.  **Part 1: Explaining I.J. Good's Theorem:**
      *   *What is it?* "On the Principle of Total Evidence" / "The Expected Value of Information."
      *   *The Claim:* For a Bayesian agent maximizing expected utility, the expected value of free, relevant information is always $\ge 0$.
      *   *Key Assumptions:*
          1.  **Bayesian Rationality:** The agent updates beliefs via Bayes' rule.
          2.  **Expected Utility Maximization:** The agent chooses actions to maximize expected utility based on current beliefs.
          3.  **Costless Information:** The information itself costs nothing (no money, no time, no psychological pain *in the model*).
          4.  **Actionability:** The information can potentially change the decision. If it never changes the decision, value is 0. If it *might* change the decision, value is $>0$.
          5.  **Truthfulness/Relevance:** The signal is informative about the state of the world.
          6.  **No Strategic Interaction (Single Agent):** This is crucial. It's a decision-theoretic result, not a game-theoretic one.
      *   *The Logic:* You can always ignore the information if it suggests a worse action than you were already planning. But if it suggests a better action, you take it. Therefore, ex-ante, you are better off (or equal).

  3.  **Part 2: Implications and Limits:**
      *   *Implication:* In isolated, static decision problems, seek information. Ignorance is instrumentally irrational *if* you are a perfect utility maximizer.
      *   *Limit 1: Cost.* Information is rarely free. If Cost > Expected Benefit, don't seek it.
      *   *Limit 2: Utility Function.* Good's theorem assumes utility depends only on *outcomes*. If utility depends on *beliefs* (e.g., hope, anxiety), the theorem breaks.
      *   *Limit 3: Game Theory.* In strategic settings, your knowledge affects others' actions. Information can be a liability (e.g., knowing too much in a negotiation).
      *   *Limit 4: Bounded Rationality.* Humans aren't perfect Bayesian updaters. We suffer from cognitive biases, emotional distress, etc.

  4.  **Part 3: Analyzing the Friend's Examples:**
      *   *Example 1: Insurance/Unraveling.*
          *   *Scenario:* A contract works because of asymmetric ignorance. If I learn I'm high risk, I buy more. If insurer learns I'm high risk, they charge more/cancel.
          *   *Analysis:* This is a *market equilibrium* issue, often involving adverse selection. Good's theorem applies to the *individual* decision given fixed prices/terms. But if the *availability* of the contract depends on ignorance, the "action space" changes.
          *   *Verdict:* Violates the "fixed action space/outcomes" assumption. It's a strategic/market interaction, not a single-agent decision against nature.
      *   *Example 2: Negotiation/Reservation Price.*
          *   *Scenario:* Knowing the counterpart's bottom line might make me greedy, they detect it, and deal collapses. Or, knowing it restricts my ability to bluff.
          *   *Analysis:* Classic Game Theory. Your knowledge changes *their* behavior or your ability to signal.
          *   *Verdict:* Outside Good's scope. Good assumes a static world. Negotiation is dynamic and interactive. Information has *strategic cost*.
      *   *Example 3: Terminal Prognosis/Psychological Harm.*
          *   *Scenario:* Knowing I have 6 months to live makes me miserable, even if I can't change it.
          *   *Analysis:* This attacks the Utility Function assumption. Good assumes $U(outcome)$. Humans have $U(outcome, belief)$. If $U$ includes "peace of mind" or "hope," then changing the belief directly alters utility independent of the physical outcome.
          *   *Verdict:* Violates the "outcome-only utility" assumption. If utility depends on beliefs, information has direct (negative) utility.

  5.  **Part 4: Synthesizing for the Friend's Genetic Test Case:**
      *   Where does the genetic test fit?
      *   It's not strategic (like negotiation).
      *   It's not market-dependent (like insurance, usually, thanks to GINA in US, but theoretically possible).
      *   It *is* about psychological utility. If the friend values "hope" or "not worrying," the utility function includes the belief state.
      *   *Conclusion:* Good's theorem says "Take the test" *if* you only care about medical actions. If you care about emotional state, the theorem doesn't apply directly. It becomes a trade-off: Value of preparation vs. Cost of anxiety.

  6.  **Drafting the Response:**
      *   *Tone:* Respectful, analytical, philosophical but grounded. Acknowledge the depth of the dinner conversation.
      *   *Structure:*
          1.  Introduction: Validate the debate.
          2.  Good's Theorem Explained: The "Single-Agent, Outcome-Only" model.
          3.  The Three Counterexamples: Analyze each against the assumptions.
          4.  Application to the Genetic Test: Bring it back to the friend.
          5.  Conclusion: Rationality is model-dependent.

  7.  **Refining the content (Self-Correction during drafting):**
      *   *Check:* Did I explain *why* the value is non-negative? (Because you can always ignore the info).
      *   *Check:* Did I distinguish between *instrumental* value (changing actions) and *intrinsic* value (liking/disliking the news)?
      *   *Check:* Make sure to mention that Good's theorem is about *expected* value. Ex-post, you might regret knowing. Ex-ante, you should expect to gain.
      *   *Nuance:* The insurance example is tricky. It's often about *disclosure*. If I take the test, do I have to tell the insurer? If yes, that's a cost. If no, it's private info. I need to clarify that distinction. Let's assume the friend's example implies the contract relies on *mutual* ignorance or that the knowledge forces a disclosure. I'll frame it as "Strategic/Market Interaction."
      *   *Nuance:* The negotiation example is definitely Game Theory. Good's theorem is Decision Theory. This is a hard boundary.
      *   *Nuance:* The prognosis example is about "Utility of Beliefs." This is the strongest philosophical objection to Good in personal contexts.

  8.  **Final Polish:** Ensure clear headings and a summary that gives the user "ammunition" but also validates the friend. (The friend is right that the theorem doesn't settle the real-world case, but the user is right that the theorem holds within its specific mathematical bounds).

  *(Self-Correction on the Insurance Example)*: I need to be careful. If I am the insured, and I learn I am high risk, Good's theorem says I should value that info (I can buy more insurance). But the *friend's* example says the contract *unravels*. This implies the *existence* of the contract depends on ignorance. This means the "menu of actions" changes based on knowledge. Good assumes the menu is fixed. I will highlight this "Endogenous Action Space" violation.

  9.  **Final Review against constraints:**
      *   Explain Good's theorem precisely? Yes.
      *   Implications and limits? Yes.
      *   Work through the three examples? Yes.
      *   Address the genetic test specifically? Yes.

  Proceed to generate response.
answer: |-
  This is a profound disagreement that cuts to the heart of decision theory, game theory, and the philosophy of mind. You are both right, but you are arguing past each other because you are operating within different models of rationality.

  Your friend is arguing from the perspective of **human experience and strategic interaction**, where knowledge can be burdensome or dangerous. You are arguing from the perspective of **classical decision theory**, where knowledge is a tool for optimization.

  To resolve this, we need to dissect I.J. Good's theorem to see exactly what it guarantees, and then examine where the real world violates its assumptions. Here is the rigorous breakdown you requested.

  ---

  ### 1. What Good's Theorem Actually Shows

  I.J. Good's 1967 result, often summarized as "the expected value of information is non-negative," is a theorem of **Bayesian Decision Theory**. It is mathematically sound, but it is not a law of nature; it is a logical consequence of specific axioms.

  For the theorem to hold, the decision-maker must satisfy four strict conditions:

  1.  **Single-Agent Decision Problem:** The theorem assumes you are making a decision against "nature" (a static environment), not against other strategic agents. Your actions do not influence the behavior of others who might react to your knowledge.
  2.  **Outcome-Only Utility:** Your utility (satisfaction/well-being) must depend *only* on the physical state of the world and your actions, **not on your beliefs or knowledge state itself**. You cannot get utility from "hope" or disutility from "dread."
  3.  **Costless Information:** The act of acquiring the information must have no cost (financial, temporal, or psychological).
  4.  **Freedom to Ignore:** You must be able to receive the information and then choose to act exactly as you would have if you hadn't received it. (i.e., Information expands your options; it never restricts them).

  **The Logic of the Proof:**
  Imagine you are deciding between Action A and Action B. Currently, based on your prior beliefs, Action A has a higher expected utility.
  *   **Scenario 1:** You get new information, and it confirms Action A is still best. You do A. Your outcome is the same as if you hadn't looked. Value = 0.
  *   **Scenario 2:** You get new information, and it reveals Action B is actually better. You switch to B. Your outcome is better than if you hadn't looked. Value > 0.

  Since you can never be forced to switch to a *worse* action (you can always ignore the info and stick with A), the *expected* value of looking must be greater than or equal to zero.

  **For whom is this true?**
  It is true for a **Bayesian Expected Utility Maximizer** operating in a **non-strategic, static environment** with **no psychological cost to belief states.**

  ---

  ### 2. Implications and Limits for Reasoning

  The theorem implies that in a vacuum, ignorance is instrumentally irrational. If you claim to want to maximize your real-world outcomes, you should always seek free, relevant data.

  However, the **limits** are where your friend's intuition lives. The theorem fails whenever the assumptions above are violated. In the real world, information is rarely free, utility often depends on beliefs, and we often interact with other agents.

  Here is how we should reason about information seeking given these limits:

  *   **In Personal Decisions (like health):** We must ask if our utility function includes "peace of mind." If knowing the truth causes psychological harm that outweighs the benefit of better planning, the "Outcome-Only Utility" assumption is violated.
  *   **In Strategic/Professional Decisions:** We must ask if this is a game. If my knowledge changes how others treat me, or if my knowledge limits my ability to bluff, the "Single-Agent" assumption is violated.
  *   **In Institutional Design:** We must recognize that while information is good for the *individual* (per Good), it can be bad for the *system* (e.g., market collapse due to asymmetric information).

  ---

  ### 3. Analyzing Your Friend's Three Examples

  Your friend provided three excellent counterexamples. None of them disprove Good's math, but all three prove that Good's **assumptions** do not apply to those situations.

  #### Example A: The Unraveling Insurance Contract
  *The Case:* A mutually beneficial insurance contract exists only because neither party knows the specific risk profile. If the buyer learns they are high-risk, they buy more; if the seller learns it, they cancel. The market collapses.
  *   **Verdict:** **Violates the "Single-Agent / Fixed Action Space" assumption.**
  *   **Analysis:** Good's theorem assumes the menu of available actions (e.g., "buy policy at price X") is fixed regardless of what you learn. In this case, the *availability* of the contract is endogenous to the information state. If you learn the truth, the contract vanishes. Therefore, the information has restricted your action space rather than expanded it. Furthermore, this is a market equilibrium problem (Game Theory), not a single-agent decision problem. The theorem does not apply.

  #### Example B: The Negotiator's Reservation Price
  *The Case:* A negotiator is better off not knowing the counterpart's true bottom line, because knowing it might tempt them to push too hard, revealing their own hand, or causing the deal to collapse due to perceived aggression.
  *   **Verdict:** **Violates the "Single-Agent" assumption.**
  *   **Analysis:** This is pure Game Theory. In Good's model, the world is passive. In negotiation, the counterpart is active. Your knowledge changes your behavior, which signals information to the counterpart, which changes *their* behavior. Information here has a **strategic cost**. It can degrade your bargaining position by altering the equilibrium of the interaction. Good's theorem explicitly excludes strategic interaction.

  #### Example C: The Terminal Prognosis
  *The Case:* A patient learns they have six months to live. Treatment options don't change. They spend their remaining months in despair rather than hopeful ignorance.
  *   **Verdict:** **Violates the "Outcome-Only Utility" assumption.**
  *   **Analysis:** This is the most philosophically significant objection. Good's theorem assumes $Utility = f(World State, Action)$. It assumes you don't care about what you *know*, only about what *happens*. But humans experience **epistemic utility**. We derive pleasure from hope and pain from dread.
      *   If $Utility = f(World State, Action, \textbf{Belief State})$, then changing the Belief State directly changes Utility, independent of the World State.
      *   If the disutility of "knowing I am dying" exceeds the utility of "planning my funeral," the expected value of information is negative. Good's theorem does not account for the emotional cost of the belief itself.

  ---

  ### 4. Applying This to Your Friend's Genetic Test

  Now we can return to the dinner table argument. Who wins?

  **You are right that:**
  If your friend views herself purely as a biological machine trying to optimize logistical outcomes (financial planning, arranging care, saying goodbyes), and if the test is free and accurate, Good's theorem says she is making a mistake by not testing. The information allows for better preparation. Ex-post, she might wish she didn't know, but ex-ante, the *expectation* of better preparation should outweigh the risk.

  **Your friend is right that:**
  She is not a Bayesian robot. She is a human being whose utility function almost certainly includes her emotional state.
  1.  **Psychological Cost:** If the test result will cause her years of anxiety that diminishes her quality of life *now* (before the disease onsets), that is a direct cost of information. Good's theorem assumes costless information; anxiety is a cost.
  2.  **Belief Utility:** If she values "hope" (the possibility, however small, that she is in the clear) more than "certainty," then her utility depends on her belief state. Preserving ignorance preserves hope.
  3.  **Actionability:** Good's theorem notes that information value is zero if it never changes your action. If she knows for a fact that she *would not* change her lifestyle, financial plans, or medical care regardless of the result, the instrumental value of the test is zero. If the psychological cost is positive, the net value is negative.

  **The Synthesis:**
  Good's theorem settles the matter only for a specific, narrow definition of rationality (instrumental rationality regarding physical outcomes). It does not settle the matter for **human rationality**, which includes emotional well-being and the value of hope.

  **Recommendation for the Argument:**
  You should concede that Good's theorem does not apply if her utility function includes "peace of mind" or "hope." However, you can challenge her to verify *why* she doesn't want to know.
  *   Is it because she genuinely values the emotional state of ignorance higher than the utility of preparation? (Valid per the "Prognosis" example).
  *   Or is it because she is afraid the information will force her to make a hard choice she is currently avoiding? (This is a violation of the "Freedom to Ignore" assumption she imposes on *herself*).

  If she *could* take the test and promise herself, "I will not let this news ruin my happiness, I will only use it to plan," then Good's theorem kicks back in, and testing is rational. If she knows she *cannot* separate the news from her emotional state, then she is correctly identifying that for her specific utility function, ignorance is indeed preferable.

  **Summary:** Good's theorem proves information is power. Your friend correctly points out that power is not always worth the price, especially when the price is paid in hope.
