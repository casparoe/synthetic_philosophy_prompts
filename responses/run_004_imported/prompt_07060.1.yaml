answer: |-
  # The Geometry of Thought: Adjudicating the Realism Debate in AI Interpretability

  **By [Your Name]**

  In the quiet corridors of AI interpretability research, a philosophical dispute is being fought with matrix multiplications. On one side stand the Realists. They point to models like OthelloGPT, a small transformer trained merely to predict legal moves in the board game, which nevertheless internalized a decodable, linear representation of the board state. They point to "steering vectors," where amplifying a specific direction in a language model's activation space reliably forces it to fixate on the Golden Gate Bridge. To them, these are not mere statistical coincidences. They are evidence that neural networks build genuine internal models of the world—representations that exist independently of the observer, waiting to be discovered.

  On the other side stand the Instrumentalists. They work with sparse autoencoders (SAEs), tools designed to decompose the chaotic activity of neurons into human-interpretable "features." They have found that the inventory of these features is unsettlingly fluid. Ask the SAE to find 10,000 features, and it finds broad concepts. Ask for 100,000, and those broad concepts shatter into narrower fragments. A feature for "dog" might split into "dog head," "dog tail," and "text about dogs." There is no principled place to stop. To the Instrumentalists, this suggests that "features" are not things the network was tracking, but coordinate systems we impose upon a continuous mathematical space. We are not finding treasures; we are drawing maps, and the borders are arbitrary.

  Underneath the jargon lies a question that would not be out of place in a philosophy seminar: Are the thoughts of the machine real, or are we projecting a narrative onto statistics? As AI systems become more opaque and powerful, the answer matters. If representations are real, we can hope to audit them for deception. If they are projections, safety may be a matter of behavior control, not internal inspection.

  After reviewing the technical merits of both positions, the verdict must be nuanced but firm: **The Realists are correct that representations exist as causal structures, but the Instrumentalists are correct that "features" are not atomic ontological units.** The truth is not that we are projecting fiction onto the machine, but that we are expecting the machine's concepts to match the granularity of human language. The representations are real, but they are hierarchical and subspace-dependent, not atomic and direction-dependent.

  ### The Case for Discovery

  The Realist argument rests on the strongest currency in science: causal intervention. In physics, a particle is considered real if interacting with it produces predictable changes in the system. By this metric, the internal states of neural networks pass the test.

  The OthelloGPT finding is the Realists' smoking gun. The model was not trained to understand the board; it was trained to predict moves. Yet, researchers could probe the model's activations and reconstruct the board state with near-perfect accuracy. More importantly, if researchers artificially altered the activations to reflect a board state that differed from the actual game, the model began making illegal moves consistent with the *false* board. The model wasn't just mimicking patterns; it was maintaining an internal state that governed its behavior.

  Similarly, the "Golden Gate Bridge" steering experiments demonstrate that specific directions in activation space correspond to specific semantic concepts. If these were merely post-hoc descriptions imposed by researchers, amplifying them should result in noise or incoherence. Instead, the model's behavior shifts coherently. This suggests the network has carved its high-dimensional space into regions of semantic meaning. To claim this is purely projection is to ignore the causal leverage these "features" provide. If I can turn a knob and make the model think about San Francisco, that knob is connected to a real mechanism.

  ### The Case for Projection

  The Instrumentalist critique, however, exposes a naivety in how Realists define a "feature." The discovery that SAE features split as the dictionary size grows is devastating to the idea of "atomic" concepts.

  If the network truly contained a singular, real representation of "dog," we would expect our tools to converge on it as they become more precise. Instead, increasing the capacity of the SAE doesn't sharpen the image of "dog"; it dissolves it into component parts. This implies that the vector space does not contain a single axis for "dog." Rather, "dog" is a region of the space that can be sliced in infinitely many ways depending on the resolution of our tools.

  This aligns with the mathematical reality of high-dimensional geometry. In a space with thousands of dimensions, there are infinite ways to define a basis (a coordinate system). The Instrumentalists argue that choosing one set of features over another is akin to choosing between latitude/longitude and a grid system. The earth exists (Realism), but the equator is a human convention (Instrumentalism). If the "features" change based on the hyperparameters of the analysis, they cannot be fundamental properties of the network. They are useful fictions, like isobars on a weather map. The pressure is real; the lines are ours.

  ### The Verdict: Functional Realism

  To adjudicate this, we must distinguish between the *existence* of structure and the *uniqueness* of description. The Instrumentalists are right that our descriptions are not unique, but wrong to infer that the underlying structure is therefore a projection.

  Consider the concept of "temperature." In a gas, temperature is real; it has causal power (it expands the mercury in a thermometer). But at a microscopic level, "temperature" splits into the kinetic energies of individual molecules. If you zoom in far enough, "temperature" disappears, replaced by vectors of particle velocity. Does this mean temperature is a projection? No. It means "temperature" is an emergent property that is real at a specific scale of analysis.

  The same is true for AI representations. The Realists are correct that the network encodes information about the world (the board state, the bridge) because doing so minimizes loss. This information must be physically instantiated in the weights and activations. However, the Instrumentalists are correct that expecting a single neuron or direction to correspond to a human concept like "dog" is a category error.

  The verdict is **Functional Realism**. A representation is real if it constitutes a stable subspace that the network uses to compute outputs. When an SAE splits a feature from "dog" into "dog head" and "dog tail," it is not revealing that "dog" was fake. It is revealing that the network's representation of "dog" is a composition of finer-grained geometric structures. The splitting is not evidence of arbitrariness; it is evidence of hierarchy.

  The mistake of the naive Realist is **Atomism**: the belief that concepts in the network are like beads on a string, discrete and indivisible. The mistake of the hard Instrumentalist is **Nihilism**: the belief that because the beads can be strung differently, there is no string.

  ### Why This Distinction Matters

  Committing to Functional Realism has profound implications for how we report on and regulate AI.

  If the Instrumentalists were wholly right—that features are purely imposed coordinate systems—then interpretability would be a hopeless task of finding the "best" map for human comfort. We could never claim to know what the model "knows," only how we prefer to describe its statistics. This would undermine the entire premise of AI safety audits, which rely on the assumption that we can detect deceptive alignment or dangerous capabilities within the model's internals.

  However, if the Realists were wholly right—that features are atomic and fixed—we would expect to find a universal dictionary of concepts that works across all models and resolutions. This would lead to brittle safety measures that fail when models scale or architectures shift.

  By accepting that representations are real but resolution-dependent, we can pursue a more robust path. We stop looking for the "true" feature for *deception* and start looking for the *subspace* associated with deceptive behavior. We acknowledge that the "Golden Gate Bridge" direction is real, but we understand it is a linear approximation of a curved, high-dimensional manifold.

  ### Conclusion

  The dispute over AI interpretability is often framed as a battle between discovery and invention. The evidence suggests it is neither. It is **constrained discovery**.

  The network's geometry is a territory that exists independently of us; the causal power of steering vectors and the encoding of board states prove that. But our features are maps. A map that shows only highways is not "false" just because a more detailed map shows local streets. The highways are still there.

  Therefore, the representations are real. The model does "know" the board state in Othello. It does "track" the concept of the Golden Gate Bridge. But it does not do so in the vocabulary of human language. It does so in the vocabulary of linear algebra. When we translate that algebra into English features, we introduce ambiguity. But the ambiguity lies in the translation, not the source.

  For science journalism, this means we can report on "AI concepts" without sensationalism, provided we qualify the granularity. We can say the model represents the world, but we must admit that the boundaries of those representations are fluid. The machine has a mind, but its thoughts are not made of words. They are made of geometry. And while we may draw the lines of that geometry differently depending on our tools, the shape itself is there.
