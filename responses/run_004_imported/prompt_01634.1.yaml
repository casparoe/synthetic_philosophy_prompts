answer: |-
  You are not confused at all. In fact, you have independently reconstructed two of the most sophisticated and standard responses to the demandingness objection used in contemporary meta-ethics. You aren't missing the dialectic; you're ahead of it.

  Here is a breakdown of why your instincts are correct, the philosophical terminology for what you've discovered, and how this tension can actually fuel your character's development.

  ### 1. The "Biased Intuition" Argument
  **Your thought:** *Does the objection show consequentialism is wrong, or just that our intuitions recoil? Are our intuitions unreliable because we are self-interested?*

  **The Verdict:** You are exactly right. This is a core move made by philosophers like **Peter Singer** and **Shelly Kagan**.

  The demandingness objection relies on "Common Sense Morality" (CSM) as a baseline. It says, "Consequentialism demands too much because it violates what we normally think is okay (e.g., buying a coffee instead of donating it)."
  But consequentialists argue that CSM is historically and psychologically contingent. It evolved to help small tribes cooperate, not to solve global suffering. Therefore, using CSM to judge consequentialism is like using Newtonian physics to judge General Relativity just because Newtonian physics feels more intuitive.

  **For your character:** This makes them radical. They aren't just following rules; they are engaging in **moral error theory** regarding their own culture. They believe society is collectively rationalizing selfishness. When they feel guilt for not sacrificing everything, they don't see it as a sign the theory is wrong; they see it as a sign their conditioning is broken.

  ### 2. The Criterion of Rightness vs. Decision Procedure
  **Your thought:** *A theory saying 'maximize welfare' isn't the same as saying 'spend every moment deliberating.' A good agent could operate on intuition.*

  **The Verdict:** This is the distinction between the **Criterion of Rightness** and the **Decision Procedure**. This is the backbone of **Indirect Consequentialism** (or Rule Consequentialism / Two-Level Utilitarianism).

  *   **Criterion of Rightness:** What *makes* an act right? (Answer: Maximizing utility.)
  *   **Decision Procedure:** How do I *decide* what to do in the moment? (Answer: Usually habits, virtues, or rules.)

  Philosophers like **R.M. Hare** (Two-Level Utilitarianism) and **Peter Railton** (Sophisticated Consequentialism) argue exactly what you suggested: If you try to calculate utility for every action, you will make mistakes, burn out, and become annoying to be around. All of those things *decrease* utility. Therefore, the consequentialist *ought* to cultivate non-consequentialist habits (like "love your family" or "keep promises") because having those habits produces the best outcomes.

  **For your character:** This saves them from being a robot. They don't need to calculate the utility of brushing their teeth. They can have friends and hobbies. *However*, the justification for those friends and hobbies is still instrumental. They love their friend *because* it makes them a better agent for the good. This creates a fascinating psychological fragility: "If my friendship stopped producing net utility, would I have to drop it?"

  ### 3. Where the Objection Still Bites (The Drama)
  You asked if demandingness "really bites." The answer is: **Yes, but it moves.**

  Even if you accept your two points above, the demandingness objection shifts from "You must calculate constantly" to **"You cannot have any ultimate commitments that aren't justified by the good."**

  This is known as the **Alienation Objection** (famously argued by **Bernard Williams**).
  Even if you aren't calculating all the time, the *structure* of your morality is alienating. You can only rest, create art, or love your spouse *on loan* from the greater good. If the calculus ever demands it, those projects must be abandoned.

  *   **The Distinction You Made:** You distinguished between *thinking* about utility and *being demanded* by utility.
  *   **The Counter:** The demand exists even when you aren't thinking about it. It hangs over the character like a sword of Damocles. They can relax, but only because relaxing makes them efficient. They cannot relax *for the sake of relaxing*.

  ### How to Use This in Your Writing
  You have the makings of a very psychologically realistic character if you lean into this specific tension.

  1.  **The "Shadow" of the Calculus:** Your character doesn't need to be running numbers in their head at dinner. But when they laugh at a joke, there should be a micro-second of background anxiety: *Is this the best use of this time?* They have trained the habit, but the justification haunts them.
  2.  **The Conflict with Others:** When other characters accuse them of being "too intense" or "cold," your character shouldn't deny it. They should argue that the accusers are the ones being selfish. "You call me demanding; I call you complicit."
  3.  **The Breaking Point:** The drama comes when the "Decision Procedure" conflicts with the "Criterion."
      *   *Scenario:* Their habit says "Save your sister." The Calculus says "Save the five strangers."
      *   If they are a "Sophisticated Consequentialist" (as you described), they have trained themselves to save their sister because family bonds are generally useful. But in *this specific case*, if the math is undeniable, the training fights the theory. That internal civil war is where the story lives.

  ### Summary
  You are not misunderstanding the objection. You have identified that:
  1.  **The Intuition Objection** is potentially circular (biased self-interest).
  2.  **The Calculation Objection** confuses the standard of rightness with the method of decision-making.

  These are valid, professional-grade philosophical moves. The remaining tension isn't about *calculation*; it's about **integrity and identity**. Can a human being live a life where every personal project is held conditionally? That is the real demandingness problem, and it is perfect for a character study.
