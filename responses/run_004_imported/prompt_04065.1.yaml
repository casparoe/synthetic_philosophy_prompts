answer: |-
  **Setting:** *The vestry of the AME Zion Church in Rochester, New York. November 1851. The air is cold, smelling of stale tobacco and damp wool. A few oil lamps sputter on a table littered with pamphlets and half-finished teacups. The audience has dispersed, still buzzing from the speech. FREDERICK DOUGLASS stands by the fireplace, removing his coat. ELIAS THORNE, a senior member of the Garrisonian Non-Resistant Society, remains seated, holding a copy of Douglass's notes.*

  **THORNE:** You spoke with fire, Frederick. I will grant you that. The cadence, the rhythm—it was the voice we all know. But the music cannot save the message if the message is a lie.

  **DOUGLASS:** Elias, I expected you to be here. And I expected nothing less. But tell me, where did the truth fail? Was it in the logic, or merely in the conclusion?

  **THORNE:** It failed in the foundation. You stood before those people and told them the Constitution is a "glorious liberty document." You asked them to look at the text and see freedom. I ask you: when a man looks at a contract that demands he return his fleeing brother in chains, does it matter if the word "slave" is omitted? If the ink binds him to hell, what comfort is it that the devil's name was left out of the signature?

  **DOUGLASS:** It matters immensely. Because if the word is not there, the power is not explicit. You argue that the Constitution is a pro-slavery compact because of what it protects. I argue it is a liberty document because of what it empowers. The Constitution gives the federal government the power to suppress insurrections and guarantee a republican form of government. It does not say "slave property." It says "persons held to service." We can read that as indentured servants. We can read that as a loophole. If we read it as liberty, the law becomes a shield. If we read it as you do, we hand the shield to the master.

  **THORNE:** A shield? Frederick, look at the Fugitive Slave Act. Passed just last year. It was born of this Constitution. The courts, the marshals, the President—they all draw their breath from this "liberty document." And what do they do with that breath? They hunt men in Boston. They drag families from beds in Syracuse. You say we should interpret the text to mean liberty, but the machine interprets it as chains. Who is the better reader of the law? You, with your theory of what it *ought* to be? Or the Marshal, with the handcuffs he says the law gave him?

  **DOUGLASS:** The Marshal reads the law through the eyes of a tyrant. That is precisely why we must seize the interpretation! If we abandon the Constitution to the slaveholder, we abandon the field. You say the machine hunts men. I say we must take control of the machine. You advocate disunion. You say "No Union with Slaveholders." You refuse to vote. You refuse to hold office. In doing so, you leave the government entirely in the hands of men who love slavery. How does your moral purity feed the hungry or free the bound?

  **THORNE:** It keeps my hands clean. That is no small thing. If I vote, I choose a master. I choose between a Whig who will enforce the Fugitive Act and a Democrat who will expand it. To vote is to say, "I consent to this system." And this system is a covenant with death. I will not negotiate with sin. If the house is built on bones, I will not move into the second floor and claim it is clean because I do not sleep in the cellar.

  **DOUGLASS:** But Elias, who is in the cellar? The slave. And while you stand outside the house refusing to enter because of the foundation, the man in the cellar is being beaten. If I enter the house, even a house with a rotten foundation, and I use the tools inside to tear down the walls, have I sinned? Or have I saved a life?

  **THORNE:** *(Leans forward, tapping the notes)* This is where I lose you. You talk of tools. You talk of strategy. And I begin to wonder... is this legal argument of yours truly about the text? Or is it merely the vocabulary you have adopted to justify a change in tactics?

  **DOUGLASS:** *(Pauses, warming his hands by the fire)* Go on.

  **THORNE:** Two years ago, you stood with Mr. Garrison. You burned the Constitution. You called it a fraud. You agreed that the intent of the framers was clear—they bargained with slavery to secure the Union. Now, suddenly, the text is ambiguous? The intent is irrelevant? It seems convenient, Frederick. It seems you found a way to read the law that allows you to do what you wish to do: engage in politics. You want to run candidates. You want to vote. So you found a Constitution that permits it.

  **DOUGLASS:** *(Turns slowly, his expression hardening)* You ask if I am changing the law to fit the strategy. I ask you: Are you changing the law to fit your conscience? You need the Constitution to be irredeemable, Elias. Because if it is redeemable, then your refusal to participate is not a moral witness—it is a dereliction of duty.

  **THORNE:** I do not need it to be irredeemable. It *is*.

  **DOUGLASS:** Is it? Or do you need it to be, so that your separation remains pure? Let us be plain. You believe that moral suasion is the only path. That if we speak the truth, the nation will repent. I no longer believe that. Power concedes nothing without a demand. The Constitution is a weapon. It is currently pointed at the black man. You say, "Drop the weapon, it is cursed." I say, "Turn the weapon around."

  **THORNE:** But a weapon is defined by its use. A gun that fires only one way cannot be turned. The structure of this government protects property rights over human rights. That is not a matter of interpretation; that is a matter of mechanics. If you engage, you will be corrupted. The Liberty Party will become just another party. You will compromise. You will trade a principle for a vote.

  **DOUGLASS:** And if I do not engage? The Compromise of 1850 stands. The Fugitive Act remains. The South grows richer and more entrenched. Your moral witness is a light in a window, Elias. It is beautiful. But it does not stop the wolf.

  **THORNE:** *(Stands, pacing slightly)* So we are back to the wolf. You think I do not feel the blood? You think I do not hear the cry? I refuse to vote not because I do not care, but because I believe that legitimizing a corrupt system prolongs the suffering. If the North secedes from this Union, if we dissolve the compact, the South cannot hold the slaves alone. The Union is the rope that binds the slave. Cut the Union, and the slave falls free.

  **DOUGLASS:** And into what does he fall? Into a border war that will last decades? Into a nation where the North washes its hands of the South entirely? No. The Union must be perfected, not destroyed. And to perfect it, we must argue that the Constitution *already* forbids slavery.

  **THORNE:** *(Stops pacing, looks Douglass in the eye)* There it is. That is the knot. You say we must argue the Constitution forbids slavery to justify working within the Union. I say we must work outside the Union because the Constitution permits slavery. Frederick... which came first? The reading of the text? Or the desire to vote?

  **DOUGLASS:** *(Silence for a long moment. He looks into the fire.)* Does it matter?

  **THORNE:** It matters for the truth.

  **DOUGLASS:** Truth is not a static object, Elias. It is a path. When I escaped Maryland, I used a sailor's protection certificate. It was not mine. The name was not mine. The description was not mine. By the strict letter of the law, it was a fraud. But it secured my liberty. Was it a lie? Or was it a tool to achieve a higher truth?

  **THORNE:** That was a physical escape. This is a moral covenant.

  **DOUGLASS:** It is the same. I am using the Constitution as I used that certificate. I am finding the缝隙—the gaps—in the armor of the oppressor. Whether I started with the text or started with the strategy... perhaps I started with the slave. I started with the question: *What works?* If reading the Constitution as a liberty document gives me the political ground to stand on to crush slavery, then I will read it that way until the last chain is broken.

  **THORNE:** *(Sits back down, weary)* Then you admit it. The text is secondary. The strategy is the master.

  **DOUGLASS:** And you? If the Constitution suddenly had the word "liberty" written in every clause, but you believed voting was still sinful, would you vote?

  **THORNE:** *(Hesitates)* If the law was truly righteous... perhaps. But a law written by men who hold slaves cannot be righteous.

  **DOUGLASS:** Then we are agreed on one thing. The law is what we make of it. You make it a idol of perfection that no government can match, so you must reject it. I make it a tool of imperfection that can be wielded for good.

  **THORNE:** I fear that when you wield it, Frederick, it will wield you.

  **DOUGLASS:** And I fear that while you wait for perfection, the night will never end.

  *(Thorne picks up his hat. He does not put it on immediately. He looks at the pile of pamphlets on the table—Garrison's "The Liberator" next to Douglass's new "North Star.")*

  **THORNE:** I cannot follow you into the polling booth. I cannot tell my conscience to accept a government that returns fugitives.

  **DOUGLASS:** I would not ask you to. But do not stand in the way of those who will. Do not call us traitors to the cause because we choose a different road to the same mountain.

  **THORNE:** *(Puts on his hat)* I will not call you traitor. But I will watch. And if you compromise, if you trade a man's freedom for a seat in Congress... I will be there to say I told you so.

  **DOUGLASS:** And if I succeed? If I use this "covenant with death" to bury slavery?

  **THORNE:** *(At the door, hand on the latch)* Then I will thank God, and I will thank you. And I will admit that the law is more flexible than my faith allowed. But until then... God keep you, Frederick.

  **DOUGLASS:** God keep us all, Elias.

  *(Thorne exits into the cold night. Douglass remains by the fire. He picks up his copy of the Constitution, runs his thumb over the preamble, and sets it down without opening it.)*
