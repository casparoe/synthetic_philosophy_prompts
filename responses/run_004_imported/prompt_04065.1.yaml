      *   **Setting:** Just after one of Douglass's speeches announcing his change of mind (circa 1851-1852).
      *   **Tone:** Intellectual, passionate, respectful but sharp. Both sides must be competent and persuasive. No strawmen.
      *   **Core Conflict:** Constitutional interpretation (textualism vs. intent/context) *and* Political Strategy (moral witness/disunion vs. political engagement).
      *   **Specific Goal:** Explore whether the legal argument is just a proxy for the strategic disagreement. Let the characters debate this, don't resolve it for the user.
      *   **Format:** Dialogue.

  2.  **Historical Context & Character Voices:**
