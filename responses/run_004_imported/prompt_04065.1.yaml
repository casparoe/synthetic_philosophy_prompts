      *   *Check:* The "Meta" question. *Fix:* Ensure Thorne asks, "Is this just semantics to make yourself feel better about voting?" and Douglass responds, "No, the weapon matters."

  6.  **Writing - Section by Section (Mental or Scratchpad):**
