      *   **Characters:** Two philosophers representing opposing camps.
          *   Camp A: Separationist (Logic is autonomous; genetic fallacy; personal views don't invalidate arguments).
          *   Camp B: Integrationist/Contextualist (The philosophical rigor and political authoritarianism stem from the same underlying worldview/temperament).
      *   **Tone:** Real back-and-forth, substantive arguments, no strawmanning, mutual respect but sharp critique.
      *   **Key Details to Include:** Frege's logic/sense-reference, Dummett's role (revival + anti-racism), the diary's content (anti-democratic, anti-Semitic), the specific philosophical link (anti-psychologism vs. anti-democracy).

  2.  **Character Conception:**
