          *   Marcus: Dummett was haunted by it. He knew the separation was fragile.
      *   **Closing:** No neat resolution. The tension remains. A mutual acknowledgment of the cost of doing philosophy.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Am I making Marcus sound like a postmodern relativist? *Correction:* No, ensure Marcus argues that the *structure* of the philosophy mirrors the politics, not that the logic is false because Frege was a bigot. It's about the *motivation* and the *systematicity*.
      *   *Check:* Am I making Elena sound cold/uncaring? *Correction:* Give her a strong ethical commitment to truth. She believes protecting objective truth is a moral duty, especially in a post-truth world.
