answer: |-
  The sun beat down on the stone courtyard of the Śvetāmbara monastery in Vallabhi, turning the air above the sand shimmery. A crowd of merchants, monks, and courtiers sat in a wide circle. In the center, on a raised platform covered with white wool, sat Āryikā Guṇasundarī. Opposite her, standing as if ready to pace, was Tarkika Bhāsvan, a Nyāya logician from Mithila, his forehead marked with sandalwood paste, his eyes sharp with the confidence of syllogism.

  Bhāsvan adjusted his shawl. He did not bow; Nyāya bows only to truth, not to robes.

  "Āryikā," Bhāsvan began, his voice carrying easily over the hushed audience. "You teach that reality is like a gem with infinite facets. I do not dispute the gem. I dispute the claim that one can speak of all facets simultaneously without madness. Your *saptabhaṅgī*—this sevenfold predication—asks us to say of a single jar: 'In some sense it is, in some sense it is not, in some sense it is both.' Is this not a violation of the first law of reason? A thing cannot be and not-be in the same respect. If you deny this, you deny the possibility of knowledge itself."

  Guṇasundarī sat with her hands folded in her lap, her posture unmoving despite the heat. "Tarkika, you speak of the law of non-contradiction as if it were a cage for reality, rather than a tool for the mind. You say 'in the same respect.' I agree. A jar cannot be red and non-red in the same light, at the same time, viewed by the same eye. The Jaina do not teach contradiction. We teach *anekānta*—the non-absoluteness of any single statement about a complex being."

  "Then why the qualifier *syāt*?" Bhāsvan pressed, taking a step forward. "Why say '*Perhaps* it is'? If the jar is before us, it *is*. If you add 'perhaps,' you introduce doubt where there is perception. If you claim the jar *is not*, you lie to your own eyes. If you claim it *is and is not*, you speak nonsense. These are your three horns. Which do you choose?"

  "I choose none, for your trilemma rests on a false premise," Guṇasundarī replied, her voice calm, low, yet resonant. "You assume that 'is' implies existence in all ways, forever. When I say *syāt asti*—'in some sense, it is'—I do not express doubt. I express a standpoint (*naya*). *Syāt* means 'from a specific perspective of substance, time, and place.' When I say *syāt nāsti*—'in some sense, it is not'—I do not mean the object vanishes. I mean it is not *that* other thing you are comparing it to."

  Bhāsvan smiled thinly. "So you dilute language until it cannot cut. If I say 'Fire is hot,' must I add 'in some sense'? If I say 'Fire is not water,' must I add 'in some sense'? If you qualify every predicate, no statement excludes anything. If no statement excludes anything, no statement informs. Your philosophy swallows itself."

  "We distinguish between the practical (*vyavahāra*) and the ultimate (*niścaya*)," Guṇasundarī countered. "In the marketplace, if you touch fire, you burn. We do not tell the layman 'in some sense it burns.' We say 'It burns.' But here, in disputation on the nature of Being, we must account for change. Tell me, Tarkika: When a seed becomes a sprout, is it the same entity or a different one?"

  "It is the same substance undergoing modification," Bhāsvan answered instantly. "The seed ceases to be a seed; the sprout arises. Continuity is maintained through the universal 'plant-ness'."

  "Then at the moment of change," Guṇasundarī said, leaning forward slightly, "does the seed exist or not?"

  "It exists as the cause of the sprout. It does not exist as a seed."

  "Precisely," she said. "So, of the seed, one can truly say: 'It is' (as substance). And one can truly say: 'It is not' (as the form that has ceased). If you forbid me from saying both, you freeze reality. You make change impossible. If the seed is only *is*, it can never become the sprout. If it is only *is not*, the sprout arises from nothing. To account for causality, you must admit that existence and non-existence are concomitant in the flow of time."

  Bhāsvan waved a hand, dismissing the temporal argument. "Time resolves the contradiction. At time one, it is seed. At time two, it is sprout. I do not need your sevenfold predication for that. I need simple succession. But you claim the *same* subject holds contradictory predicates simultaneously in the third predication: 'It is and it is not.' How can the seed be both seed and not-seed at the instant of change? If the instant has duration, divide it. If it has no duration, it is a point. At that point, logic demands a decision."

  "Logic demands a decision," Guṇasundarī said, her eyes locking onto his. "But reality offers a process. You treat the instant as a knife-edge. We treat it as a flow. The third predication is not a logical error; it is the recognition of *avaktavya*—the inexpressible nature of the simultaneous unity of permanence and change."

  Bhāsvan's brow furrowed. "Ah, the refuge of the mystic. When cornered by reason, you claim the truth is 'inexpressible.' If it cannot be expressed, how do you express it? You speak words to tell me words fail. This is sophistry, Āryikā. If the nature of the jar is inexpressible, then your scripture is empty. If it is expressible, then it must conform to the laws of speech: A is A, and A is not non-A."

  "I do not say the jar is inexpressible," Guṇasundarī corrected sharply. "I say the *simultaneous totality* of the jar is inexpressible in a single proposition. Language is linear; reality is multidimensional. To say 'The jar exists' is true regarding its substance (*dravya*). To say 'The jar does not exist' is true regarding its form (*paryāya*) prior to creation. To say 'It is inexpressible' is the acknowledgment that I cannot utter the full infinity of the jar's attributes in one breath. This is not mysticism. It is epistemic humility."

  "Epistemic humility," Bhāsvan repeated, tasting the words like sour fruit. "It sounds like a license to avoid commitment. If a rival school says 'The soul is eternal,' and you say 'In some sense it is, in some sense it is not,' you have not refuted them. You have absorbed them. If you absorb all views, you have no view of your own. A sword that cuts in all directions cuts the hand that holds it. What is the Jain *siddhānta*? If everything is partially true, is your own doctrine only partially true?"

  The audience stirred. This was the danger point.

  Guṇasundarī did not blink. "Our doctrine is that no single proposition captures the whole. That proposition is itself absolute. We assert absolutely that reality is complex. This is not a contradiction. It is like saying, 'All maps are distortions.' That statement is not a map; it is a statement about maps. We claim absolutely that all claims are conditioned. This claim is the condition under which we speak."

  Bhāsvan paced a small circle in the sand. "A clever maneuver. But let us test the utility. If I am on trial for a theft I did not commit, and the judge asks, 'Did you steal the gold?' will you answer with the sevenfold predication? 'In some sense I did, in some sense I did not'? Or will you say 'No'?"

  "I will say 'No'," Guṇasundarī said. "Because in the standpoint of the specific action, time, and agent, the predication is definite. *Syādvāda* is not for the blind. It is for those who see the complexity of Being. To use it where a simple *naya* suffices is itself an error."

  "Then it is superfluous!" Bhāsvan exclaimed, his voice rising. "If in daily life, in law, in trade, and even in perception you speak absolutely, then your sevenfold method is a game played only in the clouds. It adds nothing to knowledge. It only adds hesitation."

  "It adds the prevention of dogmatism," Guṇasundarī said, her voice hardening. "You Nyāyas burn libraries that disagree with you. You call us heretics because we deny a creator God. We call you limited because you deny the complexity of the soul. If you had applied *syāt* to your own certainty, you might see that your 'God' is a standpoint, not the totality. The sevenfold predication is not a tool for buying rice. It is a tool for breaking the pride of the intellect. It prevents you from killing for a concept."

  Bhāsvan stopped pacing. The silence stretched between them, heavy with the implication of violence inherent in his school's history and the non-violence (*ahiṃsā*) of hers.

  "You argue from ethics to logic," Bhāsvan said quietly. "But logic does not care for peace. It cares for consistency. If I grant you that 'is' and 'is not' can coexist, I grant you that truth and falsehood can coexist. If truth and falsehood coexist, there is no liberation (*mokṣa*), only confusion. You offer a philosophy of tolerance, Āryikā, but tolerance is a social virtue, not an ontological truth. The sun does not tolerate the night. It dispels it."

  "The sun dispels the night only because the earth turns," Guṇasundarī replied. "From the sun's standpoint, there is no night. From the earth's, there is both. You claim the standpoint of the sun. I claim the standpoint of the earth. We are both speaking truth. But only one of us acknowledges we are standing on a moving sphere."

  Bhāsvan looked down at the sand, then back at the nun. He did not smile, but the aggression in his posture softened into a rigid respect.

  "You claim the moving sphere," Bhāsvan said. "I claim the fixed star. We shall see which burns when the cosmos cools. I maintain that without the law of non-contradiction, your sphere has no axis. It spins into chaos."

  "And I maintain," Guṇasundarī said, bowing her head slightly, "that without the acknowledgment of the many, your axis pierces nothing but air."

  Bhāsvan nodded once, a sharp, mechanical motion. He stepped back from the center of the circle. The disputation was not over—such debates lasted days—but the first volley had landed, and neither shield was broken.
