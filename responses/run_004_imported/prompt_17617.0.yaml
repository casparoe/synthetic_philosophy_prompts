      *   **Format:** Short story (1-2 pages).
      *   **Setting:** Editorial board, proof assistant library, or FOM mailing list (or similar).
      *   **Tone:** Intellectual, slightly surreal/bureaucratic, capturing the specific anxiety of logicians.

  2.  **Deconstruct the Core Conflict:**
      *   If PA is inconsistent, there exists a proof of $0=1$.
      *   By EFQ, for any statement $P$, there is a proof of $P$ and a proof of $\neg P$.
      *   Mathematics relies on consistency. If consistency goes, truth value collapses.
      *   *The Dramatic Hook:* How do humans/institutions react when *everything* is provable? The value of a "proof" drops to zero. The currency of the realm is debased.
      *   *Idea:* A journal editorial meeting. They have to decide what to publish. If everything is provable, what distinguishes a "good" paper from a "bad" one? Or, a proof assistant (Lean/Coq) that starts verifying nonsense.
