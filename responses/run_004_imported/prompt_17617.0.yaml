      *   **Characters:** Editor-in-Chief (Sarah), Senior Editor (Marcus), maybe a rep from the verification community (David).
      *   **The Incident:** "The Nelson Event" happened a month ago. PA is confirmed inconsistent.
      *   **The Problem:** Submissions are flooding in. Every contradictory pair is being submitted.

  4.  **Developing the "Logical Weirdness":**
      *   Normally, a proof settles a debate. Now, a proof settles nothing because a counter-proof exists.
