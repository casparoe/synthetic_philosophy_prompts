      *   *Surrogate Goals:* Agent B adopts a secondary, less important goal (the surrogate). Agent B convinces Agent A that punishing the surrogate is just as effective as punishing the real goal. If A threatens the surrogate, B doesn't care as much. If A threatens the real goal, B calls the bluff because they've pre-committed to ignore threats against the real goal.
      *   *Commitment Races:* Agents rushing to make irreversible commitments to force others to yield.
      *   *Verification/Transparency:* For acausal trade/threats to work, agents usually need to be able to read each other's source code or prove their decision algorithms.

