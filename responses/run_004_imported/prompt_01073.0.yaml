answer: |-
  **Title:** The Compass and the Commonwealth: Hobbes, Wallis, and the Limits of Construction

  **Introduction**

  It is a testament to the enduring power of early modern philosophy that it can still derail a night out at the bar. You and Theo stumbled onto one of the genuine classic tensions in Hobbes scholarship: the relationship between his epistemology (how we know things) and his biography (specifically, his notorious mathematical stubbornness).

  Theo is technically correct on a point of logical formalism: a philosopher's personal incompetence in a specific domain does not logically invalidate their general epistemological claims. Isaac Newton could be a terrible gardener without undermining the *Principia*. However, you are sensing something deeper and more structural. The Hobbes-Wallis feud wasn't just a case of a smart man making a silly mistake; it was a decades-long refusal to accept the constraints of the very system he claimed to master.

  To settle this, we need to look at Hobbes's *verum-factum* principle (the idea that truth is made), examine why he thought politics could be as certain as geometry, and then determine if the "circle-squaring embarrassment" is a mere biographical footnote or a crack in the foundation of *Leviathan*.

  **I. The *Verum-Factum* Principle: Why Making Equals Knowing**

  To understand Hobbes's confidence, you have to understand his distinction between natural philosophy and civil philosophy.

  For Hobbes, human knowledge is limited by human agency. We cannot have perfect, demonstrative knowledge of nature (physics, biology, astronomy) because we did not create nature. God made the world, so only God has perfect scientific knowledge of it. We can observe effects and hypothesize causes, but we are always guessing from the outside.

  However, there are two domains where humans are the creators: **Geometry** and **Civil Philosophy (Politics).**

  1.  **Geometry:** We define the points, lines, and circles. We stipulate the axioms. Because we construct the figures according to our own definitions, we can have absolute certainty about their properties. There is no "gap" between the concept and the object because the object is generated by the concept.
  2.  **Civil Philosophy:** This is Hobbes's bold move. He argues that a Commonwealth is not a natural occurrence like a beehive; it is an artifact. It is "made" by men through covenants and contracts. Because we construct the Sovereign and the laws, we can have the same kind of demonstrative certainty about politics that we have about geometry.

  In *Six Lessons to the Professors of the Mathematics* (1656), the very text where he battles Wallis, Hobbes writes:

  > *"Geometry... is certain, because the lines and figures are drawn by ourselves... Civil Philosophy is demonstrable, because we make the commonwealth ourselves."*

  This is the core of his claim. Certainty comes from **construction**. If you build it, you know how it works.

  **II. The Wallis Debacle: A Failure of Construction?**

  Enter John Wallis, the Savilian Professor of Geometry at Oxford. Wallis was a brilliant mathematician; Hobbes was a brilliant philosopher with an amateur's grasp of advanced mathematics.

  The problem of "squaring the circle" (constructing a square with the same area as a given circle using only a compass and straightedge) was the holy grail of geometry. It was impossible (though not proven impossible until 1882, the tools to show Hobbes was wrong were available in his time). Hobbes claimed he solved it. Wallis showed, repeatedly and publicly, that Hobbes's proofs relied on errors in basic arithmetic and a misunderstanding of the axioms.

  Hobbes never conceded. He published rebuttal after rebuttal, *De Corpore* to *Hexameron*, right up until his death in 1679. He became a laughingstock among the mathematical community.

  **III. The Verdict**

  Here is where we must adjudicate between you and Theo.

  **Theo's Defense:** Theo argues that Hobbes's inability to square the circle is a failure of *competence*, not *principle*. Just because a carpenter builds a crooked table doesn't mean the physics of wood is wrong. Similarly, Hobbes failing to do geometry correctly doesn't mean the *verum-factum* principle (that we know what we make) is false. Geometry *is* certain; Hobbes just wasn't good at it. Therefore, his political theory stands on its own merits.

  **Your Intuition:** You feel that the failure in geometry *does* bleed into politics. If Hobbes was so deluded about the certainty of lines he drew himself, why trust his certainty about the state he constructed in theory?

  **The Decision:**
  **You are right, but for a more sophisticated reason than "Hobbes was bad at math." Theo is wrong to dismiss the connection entirely.**

  The Wallis debacle is not evidence that the *verum-factum* principle is false. It is evidence that Hobbes fundamentally misunderstood what "construction" entails. He conflated **stipulation** with **generation**.

  In geometry, "construction" is not merely willing a shape into existence; it is generating a figure within a system of **external constraints** (axioms, logical consistency). Hobbes acted as if his *definition* of a circle overruled the *axioms* of geometry. He treated the "making" as an act of sovereign will, rather than an act of logical submission.

  This reveals a structural flaw in his analogy between Geometry and Politics:

  1.  **In Geometry:** The "material" is conceptual. The constraints are logical. If you ignore the constraints (axioms), your construction fails (as Wallis proved).
  2.  **In Politics:** The "material" is human beings. The constraints are psychological and physical (passions, scarcity, violence).

  Hobbes's failure with Wallis shows that when push came to shove, Hobbes believed his **will to be right** superseded the **constraints of the system**. He thought that because he *said* he squared the circle, and because he *made* the proof, it *must* be true, despite the evidence of the axioms.

  **The Verdict:** The Wallis feud counts as genuine evidence against Hobbes's political certainty, not because it proves he was bad at logic, but because it proves he was a **voluntarist about truth**.

  Hobbes treats "construction" as if it grants immunity from refutation. In geometry, this made him look foolish against Wallis. In politics, this is dangerous. If Hobbes approaches the Commonwealth with the same attitude he approached the circle—that "I have constructed this theory, therefore it is immune to the resistance of the material"—his political science loses its claimed certainty.

  Human beings are more recalcitrant than geometric points. If Hobbes couldn't respect the constraints of geometric axioms (which are static and silent), why should we believe he can respect the constraints of human nature (which are dynamic and violent)?

  **Conclusion for the Bar Argument**

  Here is your takeaway to serve Theo next time you buy him a pint:

  Tell him: *"You're right that a specific error doesn't disprove an epistemology. A bad carpenter doesn't disprove physics. But Hobbes wasn't just a bad carpenter; he was a carpenter who insisted the wood was wrong because his blueprint said it should bend.*

  *The Wallis feud proves that Hobbes confused 'making' with 'willing.' He thought that because he constructed the proof, it was immune to external refutation. That is the exact same risk in his politics. He thinks because we 'make' the Commonwealth, the Sovereign's will creates political truth without resistance. The geometry failure shows he doesn't respect the resistance of the material he's working with. In geometry, that made him look crazy. In politics, it makes his claim to 'scientific certainty' dangerously arrogant."*

  **Final Ruling:** The geometric failure does not invalidate the *principle* that construction yields knowledge (Theo wins the logic point). However, it *does* invalidate Hobbes's *confidence* in his own application of that principle (You win the practical point). The flaw is not in the idea that we know what we make; the flaw is Hobbes's belief that "making" allows him to ignore the constraints of the thing made. Since politics has harder constraints than geometry, his political certainty is actually *less* secure than his geometric certainty—and he failed at the latter.

  So, the circle remains un-squared, and the Commonwealth remains uncertain. You were right to be suspicious.
