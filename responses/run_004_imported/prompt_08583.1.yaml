answer: |-
  **Setting:** *A quiet corner of a café across from the county courthouse. Two philosophers, ELENA and MARCUS, have been invited as consultants to help the court understand the epistemic weight of eyewitness testimony. They are reviewing notes from the deliberations.*

  **ELENA:** It's fascinating, isn't it? That juror who insisted we needed independent reasons to trust the eyewitness. He sounded like a crude Humean, but he stumbled onto a genuine normative constraint. If we convict a man based solely on a stranger's say-so, without checking her vantage point, her consistency, her demeanor... aren't we just institutionalizing gullibility?

  **MARCUS:** I don't think he was arguing for gullibility, Elena. He was arguing against an impossible standard. The other juror was right: if we required independent, non-testimonial verification for every claim, the trial would never end. We'd need a witness to verify the eyewitness's eyes, and another to verify the optometrist who tested them. At some point, trust has to be the default, not the reward.

  **ELENA:** But that's the seduction of the Reidian view, isn't it? The "Principle of Veracity." That nature has implanted a propensity to speak truth and a propensity to believe it. It sounds noble, but in a criminal trial, nature is irrelevant. We need justification. My worry is that your view—Anti-Reductionism, or Presumptivism—makes testimony a *sui generis* source of justification. You're saying I'm justified in believing the witness *unless* I have a reason not to.

  **MARCUS:** Precisely. Burge's Acceptance Principle: a person is entitled to accept a proposition presented as true unless there are stronger reasons not to. The justification is *a priori*. It doesn't rely on my inductive track record of this specific witness.

  **ELENA:** And that's where I part ways. That's Local Reductionism. I hold that for testimony to justify belief, the hearer must have positive reasons—based on perception, memory, and inference—to think the testimony is reliable *in this instance*. In the jury room, that meant looking at the witness's body language, checking if her story matched the physical evidence. That work *is* the justification. Without it, you have no bridge between her word and my belief. You just have faith.

  **MARCUS:** "Faith" is doing a lot of heavy lifting there. Let's press the impossibility argument. Consider a child. A three-year-old learns that "fire is hot" because her mother says so. Does she have an inductive base? Has she tracked her mother's reliability over time? No. She lacks the conceptual machinery to even formulate the hypothesis "Mother is reliable." If Reductionism is true, the child knows nothing. She is unjustified until she can perform the very reasoning that the testimony is supposed to help her learn.

  **ELENA:** I've heard Coady make this argument. The claim is that language acquisition requires trust, so trust can't be based on inference. But this conflates the *genesis* of belief with the *justification* of belief. A child might be causally determined to believe, sure. But epistemically? We don't grant children full testimonial authority for a reason. We wait until they develop "critical monitoring," as Fricker puts it. In a court of law, we aren't children. We are epistemic adults. We have the capacity to monitor. To say we don't *need* to is to lower the bar for knowledge.

  **MARCUS:** But monitoring for what? Defeaters? Or positive reasons? This is where I think the debate often talks past itself. I'm not saying you should ignore red flags. If the witness is shaking, or contradicts herself, you withhold trust. But on my view, the *presence* of trust is innocent until proven guilty. On your view, trust is guilty until proven innocent.

  **ELENA:** That's a helpful framing. But consider the stakes. In a criminal trial, the cost of false acceptance is incarceration. If the default is "believe unless contradicted," you risk convicting on the basis of a confident liar who leaves no obvious tracks. Reductionism demands you actively construct a case for reliability. It shifts the burden of proof onto the testifier, mediated by the hearer's scrutiny.

  **MARCUS:** But can you actually meet that burden without circularity? You said you checked her story against physical evidence. But how did you know the physical evidence report was accurate? Someone wrote that report. You trusted the lab technician. Did you have independent reasons for the technician's reliability? Or did you just assume the lab system works?

  **ELENA:** I had reasons. The lab is accredited. The chain of custody was documented.

  **MARCUS:** Which relies on testimony from the accrediting body and the officers handling the evidence. Elena, you're pushing the regression back, but you aren't escaping testimony. You're just layering testimonial claims on top of each other and calling the structure "inductive support." At the foundation, you're still relying on the assumption that people generally write down what they observe accurately.

  **ELENA:** I am relying on that, but I'm relying on it because I have observed, over a lifetime, that documents generally correlate with reality. That's a Humean induction. It's broad, but it's empirical. Your view treats testimony as magic. It suggests that your word *creates* justification for me simply by being uttered. That makes knowledge too easy. It severs the link between my belief and the world, inserting your authority as a black box.

  **MARCUS:** It's not magic, it's social. We are epistemic dependents. Lackey has argued for a dualist view, trying to split the difference, but I think she concedes too much to you. The core insight of Anti-Reductionism is that testimony *transmits* justification. If I know *p*, and I tell you *p*, you can come to know *p* not because you've investigated me, but because you've plugged into my knowledge. The justification originates in my competence, not your scrutiny.

  **ELENA:** But that requires me to know that you are competent. If I don't check, I'm just gambling on your competence.

  **MARCUS:** No, you're entitled to assume rationality. Just as I'm entitled to assume my senses aren't deceiving me unless I have a specific reason to think they are. Why is perception basic but testimony derivative? Both are fallible. Both can be hijacked. Yet we don't demand positive proof that my eyes are working before I believe I see a cup.

  **ELENA:** Because perception is first-personal. I have direct access to the visual experience. Testimony is third-personal. I have to infer your mental state from your noises. That inference requires evidence.

  **MARCUS:** That's the Cartesian ghost in the machine. We understand speech directly. When you say "the light was red," I don't infer your belief; I understand the content. If we are to function as a community of knowers, the default must be cooperation, not suspicion.

  **ELENA:** I agree cooperation is necessary. I just deny that cooperation entails epistemic entitlement without verification. Let's try to pin down where we actually differ, Marcus. Because in the jury room, practically speaking, we did the same thing. We listened to the witness. We looked for inconsistencies. We checked her account against the photos.

  **MARCUS:** Exactly. So is the dispute merely theoretical?

  **ELENA:** I don't think so. If it were just about practice, we'd agree on a checklist. But the disagreement is about the *locus* of the justificatory force. When the jury voted to convict, did they do so because the witness's testimony *itself* carried weight, or because their *assessment* of the witness carried weight?

  **MARCUS:** I say the testimony carried weight, provided no defeaters were triggered. You say your assessment carried the weight.

  **ELENA:** Right. And here is the substantive fault line: It's about the **necessity of positive reasons versus the sufficiency of absent defeaters.**

  **MARCUS:** Go on.

  **ELENA:** For me, the absence of red flags is not enough. I need *positive* indicators of reliability. The witness didn't just need to *not* look like a liar; she needed to look like a truth-teller. Consistency, detail, corroboration—these are positive assets I add up. For you, the absence of red flags *is* sufficient. The testimony stands justified until knocked down. For me, it sits unjustified until built up.

  **MARCUS:** That's clearer. But there's a deeper layer. It's about the **source of the entitlement.** Is the entitlement to believe generated by the hearer's cognitive labor (your monitoring), or is it granted by the speaker's rational nature (my view)?

  **ELENA:** Yes. If I'm right, testimony isn't a fundamental source of knowledge. It's a extension of perception and induction. I perceive you speaking; I infer you are reliable; I believe. If you're right, testimony is a basic source, on par with perception.

  **MARCUS:** And that matters for the "gullibility" charge. You think my view licenses gullibility because it removes the requirement for positive monitoring. I think your view licenses skepticism because it demands a level of independent verification that breaks the chain of social knowledge.

  **ELENA:** So, to summarize our remaining dispute: We agree that in practice, hearers should monitor for defeaters. We agree that blind trust is dangerous. But we disagree on whether that monitoring *constitutes* the justification (Reductionism) or merely *allows a pre-existing entitlement to function* (Anti-Reductionism).

  **MARCUS:** And we disagree on whether the burden of proof lies with the testifier to demonstrate reliability, or with the skeptic to demonstrate unreliability.

  **ELENA:** Exactly. In this trial, that juror who demanded independent reasons was applying a Reductionist standard: "Show me why she's reliable." The juror who argued for default trust was applying an Anti-Reductionist standard: "Show me why she isn't."

  **MARCUS:** And the law?

  **ELENA:** The law is messy. "Beyond a reasonable doubt" sounds like it requires positive construction (my side). But "presumption of innocence" applied to the defendant sometimes bleeds into how we treat witnesses (your side).

  **MARCUS:** So we haven't solved the case. We've just identified the epistemic tension the jury had to resolve without knowing it.

  **ELENA:** Precisely. They had to decide: Is this witness's word a gift we accept unless spoiled, or a claim we endorse only after audit?

  **MARCUS:** And whichever they chose, they were doing philosophy.

  **ELENA:** *Raises coffee cup.* To Hume and Reid.

  **MARCUS:** *Clinks cup.* May the best principle of veracity win.
