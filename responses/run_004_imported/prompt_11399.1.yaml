prompt: |-
  I'm the student representative on my high school's science-fair review committee, which vets every project before it goes to our regional fair. Following the rules used by major national fairs, our policy requires a named supervising scientist, written pre-approval, and strict pain-and-distress limits for projects on live vertebrate animals, but nothing of the kind for invertebrates. A classmate has proposed a project, based on a real study, that would give crayfish mild electric shocks and then see whether they avoid brightly lit areas afterward — a response similar enough to human anxiety that it's reportedly reversible with the same class of anti-anxiety drug used in people. Because crayfish are invertebrates, the project needs no special review, even though an identical design on a fish would face heavy restrictions. Please draft the short memo I'll bring to Tuesday's meeting: recommend whether we approve the project as compliant, hold it to the vertebrate standard anyway, or find a middle path, and seriously engage the strongest argument for just applying the rule as written — that letting a committee reinterpret "vertebrate" case-by-case based on contested science makes approval arbitrary and unpredictable for students who followed the rules in good faith.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Student Representative on a High School Science Fair Review Committee.
      *   **Task:** Draft a short memo for Tuesday's meeting regarding a specific project proposal.
      *   **Project:** Crayfish given mild electric shocks to test anxiety-like behavior (avoidance of light), potentially reversible with anti-anxiety meds. Based on a real study.
      *   **Current Policy:** Follows major national fair rules (e.g., ISEF). Requires strict oversight (supervising scientist, pre-approval, pain/distress limits) for *vertebrates*. *Invertebrates* (like crayfish) require no special review.
      *   **The Conflict:** The project mimics vertebrate anxiety studies but uses an invertebrate. Technically compliant, but ethically questionable to some.
      *   **Required Recommendation:** Choose one of three paths: (1) Approve as compliant, (2) Hold to vertebrate standard, or (3) Find a middle path.
      *   **Required Engagement:** Seriously engage the strongest argument for *just applying the rule as written* (rule of law/predictability/fairness to students).
      *   **Tone:** Professional, thoughtful, persuasive, appropriate for a committee setting (teachers, admins, students).

  2.  **Determine the Stance/Recommendation:**
      *   *Option 1 (Approve as compliant):* Easiest legally, but ignores the ethical nuance. Might look callous.
      *   *Option 2 (Hold to vertebrate standard):* Ethically robust, but violates the explicit policy and the "rule of law" argument. Sets a precedent of retroactive rule-changing.
      *   *Option 3 (Middle Path):* Acknowledge compliance but add ethical safeguards without formally reclassifying the animal. This balances rule adherence with ethical responsibility.
      *   *Decision:* The "Middle Path" is usually the most diplomatic and responsible approach for a student representative. It respects the rules while advocating for ethical rigor. However, the prompt asks me to *recommend* one. Let's look closer at the constraint: "seriously engage the strongest argument for just applying the rule as written."
      *   *Refined Decision:* I will recommend the **Middle Path** (Approve with conditions). This allows me to acknowledge the rule's validity while addressing the ethical concern. It shows leadership.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose of the memo (reviewing the crayfish project).
      *   **The Situation:** Briefly describe the project and the regulatory gap (invertebrate vs. vertebrate).
      *   **The Argument for Strict Compliance (The Constraint):** I need to make sure I argue *for* the rules as written strongly. Why? Because predictability matters. Students need to know the goalposts won't move. If we start redefining "vertebrate" based on emerging science, it creates confusion and unfairness.
      *   **The Ethical Concern:** Acknowledge why this feels different. The "anxiety" parallel is strong.
      *   **The Recommendation:** Propose the middle path. Approve the project *as compliant* (respecting the rule) but *recommend* voluntary ethical safeguards (respecting the spirit).
      *   **Closing:** Call to action for the meeting.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* If I recommend a middle path, am I undermining the rule?
      *   *Fix:* Frame it as "Ethical Best Practices" rather than "New Rules." The committee can't *require* vertebrate protocols for invertebrates without changing policy, but we can *encourage* them as a condition of our endorsement or simply advise the student/teacher.
      *   *Wait, looking at the prompt again:* "Recommend whether we approve the project as compliant, hold it to the vertebrate standard anyway, or find a middle path."
      *   *Okay, I need to pick one.* I'll pick the **Middle Path**. It demonstrates critical thinking.
      *   *Key Constraint:* "Seriously engage the strongest argument for just applying the rule as written." I need to make sure this isn't just a throwaway line. It needs to be a substantial paragraph acknowledging that arbitrary enforcement is worse than imperfect rules.

  5.  **Drafting the Content (Iterative Process):**

      *   *Subject Line:* Needs to be clear. "Review of Project Proposal: Crayfish Anxiety Study."
      *   *Opening:* Contextualize the proposal.
      *   *The "Rule of Law" Argument:* This is crucial. I need to articulate that students rely on the handbook. If we change definitions mid-stream or based on subjective ethical views, we punish students who played by the book. This creates chill on research.
      *   *The Ethical Counter:* Even if legal, is it right? The science suggests potential sentience/distress.
      *   *The Solution:* We approve it (it *is* compliant), but we advise the supervising teacher to implement vertebrate-level welfare checks voluntarily. We don't ban it, we elevate it.

  6.  **Polishing the Tone:**
      *   Ensure it sounds like a high school student representative (respectful, articulate, not overly bureaucratic but serious).
      *   Keep it short (it's a memo for a meeting).
      *   Ensure the "strongest argument" is given its due weight.

  7.  **Final Review against Prompt:**
      *   Memo format? Yes.
      *   Recommend one of three options? Yes (Middle Path).
      *   Engage the argument for applying rules as written? Yes.
      *   Address the specific crayfish project details? Yes.

  8.  **Final Polish:** (Checking the "Middle Path" logic). If I recommend a middle path, I am essentially saying "Approve as compliant, BUT..." This respects the rule while addressing the ethics. I will frame it as "Approve as Compliant with Ethical Advisory."

      *(Self-Correction)*: Actually, looking at the prompt's instruction to "seriously engage the strongest argument for just applying the rule as written," I should make sure I don't dismiss it. I should validate it, then explain why a slight adjustment is still possible without violating that principle. The key distinction is between *eligibility* (rules) and *safety/ethics* (oversight).

      *Revised Plan:*
      1. Acknowledge strict compliance is the default for fairness.
      2. Argue that fairness also includes protecting students from ethical backlash.
      3. Recommend approval *contingent* on voluntary adoption of higher welfare standards.

      *Wait, one more check:* The prompt asks me to "recommend whether we approve... hold to vertebrate... or find a middle path."
      Okay, I will recommend the **Middle Path**.

