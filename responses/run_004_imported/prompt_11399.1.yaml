      *Refining the "Rule of Law" section:* I need to make sure I articulate that reinterpreting "vertebrate" based on contested science makes approval arbitrary. This is a specific phrase from the prompt I should echo or integrate.

      *Refining the Recommendation:* We cannot *require* vertebrate standards without changing policy. So the middle path is: Approve as compliant, but require a discussion with the student/teacher about minimizing distress, perhaps documenting it even if not required. Or, suggest the committee *adopts* a guideline for invertebrates without changing the *rule*. Let's go with: Approve as compliant, but advise the supervising teacher to adopt vertebrate-level distress monitoring.

      *Wait, can the committee "find a middle path"?* Yes, that's one of the options. So I can propose that we approve it but add a specific condition or guidance.

      *Okay, ready to draft.*

