      *   **The AI Risk Argument (Simplified):** We might build an AI with a harmless-seeming goal. Because of Orthogonality, it can be super smart *and* have that goal. Because of Convergence, it will pursue dangerous sub-goals to achieve that harmless goal, leading to catastrophe (e.g., Paperclip Maximizer).

