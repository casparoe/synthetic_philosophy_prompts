      *   **The Seniors' "Gut":** Demystify it. It's not magic; it's compressed experience. But it can also be bias (recency effect, confirmation bias).
      *   **The "Coherent Position":** Answer the specific question. Yes, it is coherent. It's called "Strong opinions, loosely held." Or "Probabilistic Thinking."
