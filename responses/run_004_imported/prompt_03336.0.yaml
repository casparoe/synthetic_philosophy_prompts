answer: |-
  The gaslight in the drawing room had been turned down to a dull blue hiss, not for atmosphere, but because Mr. Eglinton insisted the spirits required a dimmer spectrum to manifest. Henry Sidgwick stood by the mahogany table, a ruler in his hand. He was not looking at the spirits. He was measuring the distance between the table leg and the carpet.

  "Half an inch clearance," Sidgwick said, noting the figure in his notebook. "Insufficient for a confederate to pass beneath, provided the skirt of the tablecloth remains pinned to the edge."

  "Professor," Eglinton said, his voice possessing that practiced, resonant calm common to men who make their living in the dark. "You wound me with your geometry."

  "I wound only the possibility of error," Sidgwick replied. He capped his pen. He felt the familiar, dull ache behind his eyes that had been his companion since the publication of *The Methods of Ethics* five years prior. To the world, he was the man who had systematized utilitarianism. To himself, he was the man who had found a hole in the universe.

  He had proved, to his own satisfaction, that reason could not reconcile a man's self-interest with his duty to others. Unless the universe was structured such that virtue was ultimately rewarded—unless there was a God, or a survival of consciousness that enforced a moral order—then morality was a kind of beautiful mistake. A noble lie. He could not will himself to believe it. He was too honest for that. But if the phenomena were real—if consciousness could survive the body, if communication across that threshold was possible—then the gap might be closed. The universe might have a moral architecture after all.

  So he measured table legs. He searched for trapdoors. He subjected mediums to the same rigorous cross-examination he would apply to a thesis on intuitionism.

  Frederic Myers sat in the corner, swirling a glass of sherry he would not drink. Myers wanted the phenomena to be true for the poetry of it; he wanted a universe teeming with energy and spirit. Sidgwick wanted them to be true for the logic of it. He needed the ledger to balance.

  "Are we satisfied with the conditions?" Eglinton asked. He sat at the head of the table, his hands resting on two slates of clean writing paper.

  "The conditions are adequate," Sidgwick said. "Proceed."

  The room settled into a silence that was not heavy, but expectant. It was the silence of a laboratory waiting for a reaction. Sidgwick watched the medium's hands. He watched the slates. He did not close his eyes. To close one's eyes was to surrender the very faculty that made the evidence valuable.

  A scratching sound began. It was faint, like a insect moving across the grain of the wood. Sidgwick leaned forward, his posture rigid. He noted the time. He noted the position of Eglinton's elbows. They remained on the table. The scratching stopped.

  Eglinton slid the slates across the wood. "Read," he said softly.

  Sidgwick picked up the top slate. Between the two boards, written in a cramped, jagged hand that was not Eglinton's, was a single sentence: *The doubt is the discipline.*

  Myers exhaled sharply, a sound of triumph. "Direct writing," he whispered. "Under test conditions."

  Sidgwick held the slate up to the diminished light. He ran his thumb over the chalk marks. They were dry. He looked at Eglinton, whose face was a mask of benign neutrality.

  "Who is the communicator?" Sidgwick asked.

  "It is not always given to know," Eglinton said.

  "Was the slate within your reach at any point prior to the sitting?"

  "No. You selected them from the stack yourself."

  Sidgwick placed the slate back on the table. He felt a surge of something that might have been hope, sharp and painful in his chest. If this was genuine, it was a crack in the materialist wall. It was a datum. But data required verification. Hope was not verification.

  "It could be a thumb-nail manipulation," Sidgwick said, his voice level. "If the slates were not sealed."

  "We discussed sealing," Myers said, a note of irritation entering his tone. "Henry, must we dissect the miracle before we have acknowledged it?"

  "If it is a miracle, it will withstand dissection," Sidgwick replied. "If it is a trick, acknowledging it only sets back the cause of truth."

  He looked at Eglinton. The medium did not flinch. He had seen men like Sidgwick before—men who wanted to believe so badly they made themselves impossible to convince. But Sidgwick knew he was not impossible. He was merely precise. He would believe if the evidence held. That was the tragedy of it. He was willing to be converted, but the universe refused to provide the necessary proof.

  "Let us try once more," Sidgwick said. "But I will hold the slates this time. One hand on each."

  Eglinton sighed, a subtle shift of weight. "The energy is sensitive to pressure, Professor."

  "Then the energy must accommodate the conditions of inquiry."

  They adjusted. Sidgwick placed his hands on the slates. He felt the wood, cool and smooth. He waited. The minutes stretched. The gaslight hissed. Myers stared into the shadows as if he could will a spirit into existence by the force of his own imagination.

  Nothing happened.

  The scratching did not return. The slates remained blank. When the light was turned up, fully and harshly, the chalk remained unused. Eglinton claimed the conditions had been too hostile. Myers claimed the spirits were shy. Sidgwick wrote in his notebook: *Negative result. Conditions altered by investigator. Possibility of fraud not eliminated, but neither is possibility of genuine phenomenon constrained by stricture.*

  He closed the notebook. The headache behind his eyes had deepened.

  They walked out into the London night together. The fog was thin, merely a dampness on the coat collars. Myers lit a cigar, the flare illuminating his disappointed face.

  "You were hard on him, Henry," Myers said.

  "I was exact," Sidgwick corrected. He pulled his gloves on, finger by finger. "If we are to build a science, Frederic, we cannot build it on exceptions that vanish when observed."

  "But if it is true... think of what it means. For us. For everyone."

  "I do think of it," Sidgwick said. He stopped at the corner where he would hail a cab. He looked down the empty street. The lamps cast pools of yellow on the wet pavement. "I think of it every hour. I think of the man who acts rightly though it ruins him, and the man who acts wrongly and prospers. I think of the ledger."

  "You hope," Myers said. It was not a question.

  "I hope," Sidgwick admitted. The word felt heavy, unphilosophical. "But hope is not a method."

  He stepped into the cab. As the horse began to move, clattering over the cobblestones, Sidgwick leaned back against the worn leather seat. He reached into his pocket and touched the notebook there. He could open it. He could read the sentence written on the slate: *The doubt is the discipline.*

  It was a comforting sentiment. Too comforting. It sounded like something a medium would say to disarm a skeptic. Or it sounded like a truth from the other side. He had no way to know.

  He would go home. He would write up the report for the *Proceedings*. He would note the anomalies and the failures with equal weight. He would return to his lectures on Moral Science next week. He would teach his students that duty is rational, even if he could not prove why. He would continue to search the dark rooms of the world for a light that would not turn on when he flipped the switch.

  The cab turned onto his street. Sidgwick closed his eyes, not to sleep, but to rest them for the work waiting on his desk. The universe remained silent. He would ask it again tomorrow.
