prompt: |-
  I serve on the clinical ethics committee of a psychiatric hospital, and we have been asked to resolve a case involving what our consult-liaison psychiatrist calls a "Ulysses contract." Six months ago, while clinically stable, a patient with a long history of bipolar I disorder signed a directive instructing the team to hospitalize and medicate her against her contemporaneous wishes if she became manic again, provided that two psychiatrists uninvolved in drafting the document certified that she met behavioral criteria she had chosen herself in advance: several consecutive nights without sleep, initiation of large unplanned purchases, and refusal of outpatient follow-up. She now meets all three criteria, as confirmed independently by two psychiatrists. The complication is that she is neither confused nor incoherent: she converses fluently, passes our standard capacity assessment without difficulty, and gives a clear, reasoned argument for wanting to leave and refuse medication, including the claim that the woman who signed the contract "was afraid of herself in a way I'm no longer afraid of." Our hospital's advance directive policy was drafted with end-of-life care in mind and says nothing about directives that anticipate a future psychiatric crisis, so the committee has no internal precedent to invoke. Roughly half the committee wants to honor her present, apparently capacitous refusal; the other half wants to enforce the contract, on the grounds that its entire point was to withstand exactly this kind of persuasive-sounding reversal, and they have started comparing it to the way a constitution binds a later legislature even when that legislature has the votes to change it.

  Could you draft the short memo I will circulate before Friday's meeting? It should recommend, concretely, whether we honor the contract or her current refusal; lay out a specific procedure and timeframe for acting on that recommendation; and take the strongest version of the losing side's argument seriously rather than treating it as an obvious mistake.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Clinical Ethics Committee (CEC) at a psychiatric hospital.
      *   **Task:** Draft a short memo to circulate before Friday's meeting.
      *   **Case:** A "Ulysses contract" (psychiatric advance directive) scenario.
          *   *Patient:* Bipolar I, history of mania.
          *   *Directive:* Signed 6 months ago while stable. Specifies hospitalization/medication if specific criteria are met (sleeplessness, spending, refusal of follow-up).
          *   *Current Status:* Meets criteria (confirmed by 2 independent psychiatrists). However, she is *not* confused/incoherent, passes capacity assessment, and argues reasoned refusal ("past self was afraid, current self is not").
          *   *Policy Gap:* Hospital AD policy is for end-of-life, no precedent for psychiatric crises.
          *   *Committee Split:* 50/50. One side honors current capacitous refusal. The other enforces the contract (constitutional analogy).
      *   **Requirements:**
          *   Recommend concretely (Honor contract OR Honor refusal).
          *   Lay out specific procedure and timeframe.
          *   Take the strongest version of the *losing* side's argument seriously (steel-manning).
          *   Tone: Professional, ethical, decisive but nuanced.

  2.  **Determine the Ethical Recommendation:**
      *   *Option A: Honor the Refusal.*
          *   Pros: Respects current autonomy, avoids coercion of a capacitous individual, aligns with standard legal/ethical norms regarding contemporaneous capacity.
          *   Cons: Undermines the purpose of Ulysses contracts (which exist *because* insight is lost in mania), risks severe harm to the patient (mania consequences), sets a precedent that makes psychiatric ADs useless.
      *   *Option B: Honor the Contract.*
          *   Pros: Respects precedent autonomy (the "well" self), prevents predictable harm, aligns with the specific intent of Ulysses contracts in psychiatry.
          *   Cons: Overriding a currently capacitous refusal is ethically fraught, risks trauma/trust loss, legal ambiguity (since policy doesn't cover this).
      *   *Decision:* In psychiatric ethics, the prevailing (though debated) view on Ulysses contracts is that they *should* be enforceable even during periods of apparent capacity *if* the specific trigger conditions indicative of the onset of the episode are met. The core ethical justification is that mania impairs *decision-making capacity* regarding the illness itself (anosognosia or valuing of risk) even if general cognitive capacity (understanding/appreciation) appears intact. The "constitutional" argument is strong here. If we don't enforce it now, the directive is meaningless.
      *   *Selection:* I will recommend **enforcing the contract**. This is the harder ethical lift but aligns better with the specific utility of psychiatric advance directives (PADs) and the prevention of harm in Bipolar I mania. It acknowledges the "capacity" nuance (decision-specific capacity vs. general capacity).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly.
      *   **Recommendation:** Be direct. Enforce the directive.
      *   **Rationale (The Winning Argument):** Why enforce? Precedent autonomy, specific nature of mania (insight fluctuation), the specific criteria were met.
      *   **Steel-manning the Losing Argument (Honoring Refusal):** This is crucial. I need to show I understand why honoring her current refusal is compelling. Focus on bodily integrity, the risk of error, and the sanctity of contemporaneous choice.
      *   **Procedure & Timeframe:** Needs to be actionable.
          *   *Action:* Admit and medicate per directive.
          *   *Safeguards:* Second opinion (already done), regular review, specific goal for discharge (return to baseline).
          *   *Timeframe:* Immediate implementation, review within 72 hours.
      *   **Policy Note:** Acknowledge the gap and suggest future policy work.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* If I say she has capacity, how can I override her?
      *   *Correction:* I need to nuance "capacity." She passes the *standard* assessment, but the directive was triggered by *behavioral* markers of mania. The ethical claim is that her *valuation* of risk is currently skewed by the emerging pathology, even if her logic is fluent. The directive represents her "true" values when well.
      *   *Steel-manning:* The counter-argument isn't just "she says no." It's that overriding a capacitous patient is a slippery slope to paternalism. It treats the patient as two people. It risks trauma. I must validate this fear.
      *   *Tone Check:* Is it too authoritarian? Need to emphasize this is an exceptional measure based on *her own prior rules*, not hospital whim.

  5.  **Drafting the Content (Iterative Process):**

      *   *Subject Line:* Needs to be clear. "Ethics Consultation Recommendation: Case of [Initials/ID]".
      *   *Recommendation:* "The Committee should recommend enforcing the psychiatric advance directive."
      *   *Rationale:* Focus on the "Ulysses" nature. It's designed for this. The criteria are objective (sleep, spending).
      *   *Counter-argument:* Acknowledge the "Constitutional" analogy is good, but the "Bodily Integrity" argument is stronger for the other side. The risk of false positives. The trauma of coercion.
      *   *Procedure:* Admit. Medicate. Review in 72 hours. Document specifically why the capacity assessment was overridden (reliance on PAD).
      *   *Policy:* Recommend drafting a specific PAD policy.

  6.  **Final Polish:**
      *   Ensure the "steel-man" section feels genuine, not dismissive.
      *   Ensure the timeframe is realistic (immediate safety vs. committee review).
      *   Check word count (keep it "short memo" style).

      *(Self-Correction during drafting)*: Wait, the prompt asks me to draft the memo *I will circulate*. It implies I am taking a stance to guide the meeting. I need to sound like a chair or a lead ethicist proposing a resolution. I will choose to recommend **enforcing the contract**. This is generally the more ethically defensible position in *specific* Ulysses contract cases where objective behavioral criteria are met, as it respects the long-term autonomy over the short-term impaired autonomy (even if standard capacity tests are passed).

      *Wait, one nuance:* The prompt says she passes the *standard* capacity assessment. This is the crux. If she has legal capacity, overriding her is legally risky. However, ethics often leads policy. I will frame the recommendation as enforcing the contract *based on the specific criteria she set*, acknowledging the tension with the capacity assessment.

      *Re-evaluating the "Losing Side":* If I recommend enforcing the contract, the losing side is "Honor Current Refusal." I need to make their argument very strong. They argue that current consciousness is the only one that matters, and that mania doesn't necessarily negate capacity to refuse *this specific treatment*.

      *Let's write.*

  7.  **Final Review against constraints:**
      *   Concrete recommendation? Yes (Enforce).
      *   Specific procedure/timeframe? Yes (Admit immediately, 72-hr review).
      *   Strongest version of losing argument? Yes (Bodily integrity, risk of error, sanctity of contemporaneous will).
      *   Tone? Professional, ethical.

      *(Final thought)*: Make sure to mention the policy gap. The memo should suggest that while we act now, we need a policy later.

      *(Wait, one more check)*: Is it better to recommend honoring the refusal? In many jurisdictions, a contemporaneous capacitous refusal trumps an AD. However, the *point* of a Ulysses contract is to bypass this. If the ethics committee recommends honoring the refusal, the Ulysses contract becomes a "suggestion." If they enforce it, it becomes a "contract." Given the prompt highlights the "Constitutional" analogy and the specific objective criteria (sleep, spending), the ethical weight leans toward enforcement to preserve the integrity of the tool for future patients, provided safeguards are high. I will stick with Enforcement. It makes for a more robust ethical memo.

      *Wait, actually, looking at bioethics literature:* There is significant debate. Some jurisdictions legally *cannot* enforce Ulysses contracts if capacity is present. But this is an *ethics* committee memo, not a legal ruling. Ethically, precedent autonomy is weighty. I will proceed with Enforcement but acknowledge the legal risk.

      *Actually, let's pivot slightly:* To be most helpful to the user, I should ensure the memo facilitates a decision. I will take a stance. I will recommend **enforcing the directive**. This aligns with the "Ulysses" concept.

      *Wait, I need to make sure I don't ignore the capacity finding.* I must explain *why* we override a capacity finding. The argument is that the capacity assessment measures cognitive processing, but the directive addresses *value stability* during prodromal mania.

      *Okay, ready to draft.*

      *Structure:*
      1. Header.
      2. Recommendation.
      3. Ethical Rationale (Precedent Autonomy).
      4. Counter-Argument (Contemporaneous Autonomy/Integrity).
      5. Implementation Plan.
      6. Policy Implication.

      *Let's refine the "Losing Argument" section.* It needs to be respectful. "The argument for honoring her refusal rests on the fundamental principle that a capacitous adult's current bodily integrity is inviolable..."

      *Let's refine the "Procedure".* Needs to be clinical. "Admit under authority of PAD." "Re-assess capacity in 72 hours." "Medicate per prior consent."

      *Okay, good to go.*
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name/Title]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation Regarding Psychiatric Advance Directive (Case #____)

  **Recommendation**
  The Ethics Committee should recommend **enforcing the patient's psychiatric advance directive (the "Ulysses contract")** and proceeding with involuntary hospitalization and medication as stipulated, despite her contemporaneous refusal.

  **Rationale for Enforcement**
  The ethical weight of this case rests on the distinction between *decisional capacity* (the ability to process information) and *value stability* (the consistency of one's fundamental interests over time). The patient's directive was not created to address general incapacity, but specifically to address the *prodromal phase of mania*, a period where insight is notoriously compromised even when cognitive fluency remains intact.

  By setting objective behavioral criteria (sleeplessness, spending, refusal of follow-up) rather than relying on a clinician's subjective judgment of "insight," the patient created a mechanism to protect her long-term autonomy from her short-term pathological shifts. To disregard this because she can now argue persuasively against it is to render the instrument useless; the specific function of a Ulysses contract is to bind the self during the very period when the self wishes to be unbound. Honoring the contract respects her "precedent autonomy"—the values held when she was best equipped to judge her own welfare.

  **The Case for Honoring Current Refusal (Minority View)**
  We must take seriously the argument that we should honor her current refusal. This position rests on the fundamental liberal principle that a capacitous adult's bodily integrity is inviolable in the present moment. 

  Proponents of this view argue that capacity is binary and contemporaneous: if she passes the assessment now, her refusal is valid, regardless of past documents. They contend that mania does not necessarily negate the ability to weigh risks and benefits, and that the patient's claim—that her past self was operating out of fear while her current self is operating out of confidence—is a legitimate evolution of values, not merely a symptom. Furthermore, overriding a fluent, reasoned refusal carries a high risk of psychological trauma and erosion of therapeutic trust. If our capacity assessments are to mean anything, they must protect the patient's right to be wrong about their own care, provided they understand the consequences. There is also a legitimate concern regarding error: if the behavioral criteria are met but the episode is not actually manic (e.g., situational stress), enforcement constitutes a severe rights violation.

  **Implementation Procedure and Timeframe**
  To balance the enforcement of the directive with the safeguards demanded by the minority view, I propose the following protocol:

  1.  **Immediate Action (Within 4 Hours):** Admit the patient and initiate medication per the directive's specifications. The attending physician must document that the two independent psychiatrists have re-confirmed the behavioral criteria are met.
  2.  **Notification:** Inform the patient in writing that the admission is based on her own prior directive, not on a finding of current general incapacity. Explicitly validate her current perspective while explaining the committee's duty to her prior instructions.
  3.  **Re-evaluation (72 Hours):** A formal capacity and clinical status review must occur within 72 hours. If the behavioral criteria cease to be met or if she returns to a baseline where she acknowledges the directive's validity, discharge planning should begin immediately.
  4.  **Advocacy:** Assign a patient advocate not involved in her clinical care to visit her daily during the first week to ensure her grievances are heard and documented, even if not acted upon.

  **Policy Implication**
  This case highlights a critical gap in our hospital policy. While we act on this recommendation, I will draft a proposal for a specific "Psychiatric Advance Directive" protocol to replace our end-of-life focused policy, ensuring future cases have clearer procedural guardrails.

  Please review this recommendation prior to Friday's vote.
