          *   Proposed (Narrow): Feels precise, but statistically noisy and arbitrarily bounded.
      *   **Recommendation:** Retain current tool + Confidence Intervals + Review Committee.
      *   **Implementation Plan:** Timeline.

  5.  **Refining the Tone:**
