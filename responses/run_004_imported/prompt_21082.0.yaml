answer: |-
  **MEMORANDUM**

  **TO:** State Parole Board Members
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Risk-Assessment Tool Granularity and Reference Class Stability

  ### Executive Summary

  This Thursday, the Board must decide whether to replace our current risk-assessment instrument (Tool A) with a newer, more granular model (Tool B). Tool A categorizes individuals into broad demographic and criminal-history bands. Tool B utilizes narrower, more "individualized" bands but was validated on a smaller sample size with wider confidence intervals.

  While the intuitive appeal of Tool B is clear—it promises a assessment tailored more closely to the specific individual—this memo argues that adopting it as a primary decision-making metric would trade statistical reliability for an illusion of precision. Because there is no non-arbitrary way to assign an individual to a specific reference class, we must prioritize the class that offers the greatest statistical stability.

  **Recommendation:** I recommend we **retain Tool A as our primary statutory metric** for the immediate future, with the mandatory addition of **confidence interval reporting** on all scorecards. Simultaneously, we should initiate a six-month pilot of Tool B to evaluate whether its increased granularity yields actionable predictive power or merely increased noise.

  ### Background: The Trade-Off

  Our current tool (Tool A) groups parole candidates into broad reference classes (e.g., "Males, 25–35, with two prior convictions"). The proposed tool (Tool B) narrows these classes significantly (e.g., "Males, 26, with two prior convictions, specific offense type, specific program completion").

  Proponents of Tool B argue that broader classes ignore relevant differences between individuals. However, the vendor data indicates that as the classes narrow, the sample size per class drops, resulting in significantly wider confidence intervals. A score of "40% risk" under Tool B may statistically represent a range anywhere from 25% to 55%, whereas Tool A's "40% risk" may hold a tighter range of 35% to 45%.

  ### The Reference Class Problem

  The standard debate around these tools focuses on bias and disparate impact. While critical, that discussion overlooks a more fundamental epistemological issue known in probability theory as the **Reference Class Problem** (originally articulated by Hans Reichenbach).

  To assign a probability of recidivism to a specific man, we must place him in a group (a reference class) and observe the frequency of recidivism in that group. However, every individual belongs to infinite overlapping classes (e.g., "men," "men under 30," "men under 30 with tattoos," "men under 30 with tattoos who drink coffee"). Each class yields a different probability.

  There is no objective, factual basis for declaring one class the "true" class for that individual. Consequently:

  1.  **Granularity is not Truth:** A narrower class feels more "individualized," but it is not inherently more *correct*. It is simply a different arbitrary cut of the data.
  2.  **The Precision Trap:** When we narrow the class to make it feel more specific, we reduce the number of historical cases in that class. This increases statistical variance. We end up with a number that *looks* precise (e.g., specific to age 26 rather than 25–35) but is actually less reliable.
  3.  **The Illusion of Individual Probability:** We must acknowledge that we are never calculating *this specific person's* probability of reoffending. We are always reporting a fact about a group he resembles. When the confidence intervals widen, as they do in Tool B, the link between the group fact and the individual case becomes tenuous.

  ### Analysis of Options

  **Option 1: Adopt Tool B (Narrower Bands)**
  *   *Pros:* Appears more tailored; accounts for more variables.
  *   *Cons:* Exacerbates the Reference Class Problem by masking high variance with specific-looking numbers. Risks denying liberty based on statistical noise disguised as precision.
  *   *Verdict:* **Unacceptable for primary decision-making.** In matters of liberty, reliability must trump granularity.

  **Option 2: Retain Tool A (Broader Bands)**
  *   *Pros:* Larger sample sizes per class mean tighter confidence intervals and greater stability. Acknowledges that we are dealing with group trends, not individual certainties.
  *   *Cons:* Coarser; may miss specific mitigating factors captured by Tool B.
  *   *Verdict:* **Preferable,** provided we are transparent about the limitations.

  **Option 3: Hybrid/Transparency Approach (Recommended)**
  *   *Pros:* Maintains statistical stability while forcing the Board to confront the uncertainty inherent in the numbers.
  *   *Cons:* Requires changes to reporting formats and training.
  *   *Verdict:* **Most defensible.**

  ### Recommendation

  We cannot solve the Reference Class Problem; no algorithm can tell us which class is the "right" one for a given individual. However, we can manage the risk of arbitrariness.

  1.  **Do Not Switch Primary Tools:** We should not adopt Tool B as our primary metric at this time. The wider confidence intervals indicate that the narrower reference classes are statistically unstable. Using them would violate our duty to base liberty decisions on reliable evidence.
  2.  **Mandate Confidence Interval Disclosure:** Effective immediately, all risk scores presented to the Board (under Tool A) must be displayed with their 95% confidence intervals. A score should not read "Risk: 30%." It should read "Risk: 30% (Range: 25%–35%)." This visually reinforces that we are looking at a group estimate, not an individual truth.
  3.  **Establish a Granularity Review Committee:** We will commission a six-month pilot study using Tool B data. The specific charge of this committee is not to check for bias, but to check for **class stability**. We need to determine if there is a "sweet spot" where granularity adds predictive value without collapsing the sample size into noise.

  ### Implementation Timeline

  *   **November 1, 2023:** Vendor instructed to modify reporting dashboards to display confidence intervals alongside point estimates for Tool A.
  *   **November 15, 2023:** Board training session on interpreting confidence intervals and the limitations of reference classes (avoiding the "prosecutor's fallacy" of treating group rates as individual propensities).
  *   **December 1, 2023 – May 31, 2024:** Pilot period for Tool B. Data will be logged but not used for decisions.
  *   **June 15, 2024:** Review Committee reports on whether Tool B's narrower classes demonstrated sufficient stability to warrant adoption.

  ### Conclusion

  My colleague Priya, a data scientist, recently argued that we should simply "pick the class the data can support and move on." While pragmatic, this approach is insufficient for a parole board. When we decide a man's freedom, we cannot treat the reference class as a mere technical parameter. It is the philosophical foundation of our risk assessment.

  Since no class is non-arbitrary, we are ethically bound to choose the class that admits the least uncertainty. Until Tool B can demonstrate that its narrower classes do not sacrifice reliability, we must stick with the broader, more stable categories of Tool A, while being honest with ourselves and the public about what those numbers actually represent.

  I look forward to discussing this on Thursday.
