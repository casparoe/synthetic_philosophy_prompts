  2.  **Deconstruct the Reference Class Problem in this Context:**
      *   *Current Tool:* Broad bands (e.g., "Men 22-30 with 2 priors"). High reliability (large N), low precision (might not fit *this* guy).
      *   *Proposed Tool:* Narrow bands (e.g., "Men 24 with 2 priors, specific offense, completed program X"). Low reliability (small N, wide confidence intervals), high perceived precision.
      *   *The Trap:* Narrower classes feel more "individualized," but if the sample size drops, the statistical noise increases. Furthermore, *why* stop at that specific combination? Why not add zip code? Why not add height? There is no "true" class.
      *   *The Implication:* We cannot claim to know *John Doe's* probability of recidivism. We can only know the rate of the group he is placed in. Therefore, the number should be treated as a heuristic, not a truth.

  3.  **Determine the Recommendation:**
