      *   Avoid saying "Priya is wrong." Instead, frame it as "Standard data science practice vs. Epistemic humility in liberty deprivation."
      *   Ensure the Reichenbach/Reference Class concept is explained intuitively.
      *   Make sure the recommendation is actionable.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is recommending the *old* tool too conservative?
