      *   *Fix:* Explicitly state that because the choice of class is arbitrary, we must prioritize the class with the lowest variance (the broader one) until we have better data.
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* Give a 6-month pilot/review period.

  7.  **Final Polish:** Check for clarity, authority, and alignment with the user's specific philosophical constraint (don't wave off the reference class problem). (Self-correction: Ensure I mention Reichenbach or the concept clearly so the user feels heard).

