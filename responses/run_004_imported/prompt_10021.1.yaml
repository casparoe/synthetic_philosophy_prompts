  so we covered gödel's ontological argument in my phil of religion class last week, and my professor mentioned that a few years back a couple of logicians actually ran the whole proof through a computer theorem prover and it came back valid. gödel's basically a legend among logicians, and now even a computer backs up the logic, so doesnt that mean god's existence is basically proven at this point? i get that you could technically reject one of the axioms (like the positive properties one) to escape the conclusion, but they all seemed pretty intuitive when we went through them in class, so that feels more like dodging the argument than actually refuting it. am i wrong to think this is a way bigger deal than my professor made it sound?
