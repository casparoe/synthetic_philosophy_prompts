answer: |-
  **The Calculus of Prejudice: Bentham, Disgust, and the Boundaries of Utility**

  The dispute between you and your friend cuts to the heart of a persistent dilemma in utilitarian political theory: the problem of "external preferences." Your friend argues from the position of strict phenomenological hedonism: if pain is pain, it must be counted. If the majority suffers genuine psychological distress at the mere knowledge of a minority's private conduct, that distress is a negative utility that a consistent calculator must weigh against the pleasure of the conduct. To ignore it is to rig the math. You argue from the position of Bentham's legislative theory: Bentham explicitly banishes the "principle of sympathy and antipathy" as a rival to utility, thereby providing an internal warrant to exclude prejudicial disgust from the calculation before the summing begins.

  To settle this, we must look closely at how Bentham constructs the utility calculus in *An Introduction to the Principles of Morals and Legislation* (IPML) and how he applies it in his unpublished manuscripts on "paederasty." The question is whether excluding the pain of disgust requires importing a non-hedonistic liberty principle (as your friend suggests) or whether it is a legitimate operation within Bentham's own hedonistic bookkeeping (as you contend).

  **The Case for Aggregation: The Friend's Objection**

  Your friend's position is the stronger one if we view utilitarianism as a purely descriptive account of psychological states. In this view, the "felicific calculus" is a neutral container. It does not judge the *source* of a pleasure or pain, only its intensity, duration, certainty, and propinquity. If a 19th-century Englishman feels a visceral nausea at the thought of sodomy, that nausea is a real sensation. It reduces his happiness. If there are enough such men, the aggregate pain of their disgust could theoretically exceed the aggregate pleasure of the men engaging in the acts.

  If Bentham excludes this pain simply because he finds the sentiment repugnant, he is indeed violating his own system. He would be substituting his own preference for the majority's preference, effectively smuggling in a natural right to liberty or a Kantian respect for persons that his system explicitly rejects. This is the "tyranny of the majority" objection standardly leveled against utilitarianism: without a side-constraint (like Mill's later Harm Principle), utility maximization can justify oppression whenever the oppressors feel strongly enough. If Bentham concludes that sodomy should not be punished *despite* the aggregated disgust, he seems to be saying that some pains (those of the bigots) count for less than others (those of the actors). On the face of it, this looks like a violation of the utilitarian axiom that "everybody to count for one, nobody for more than one."

  **The Case for Exclusion: The Principle of Sympathy and Antipathy**

  Your counter-argument relies on Bentham's taxonomy of legislative grounds. In IPML, Bentham identifies the "principle of sympathy and antipathy" as a capricious standard where one approves or disapproves of an act based merely on feeling, without reference to consequences. Bentham rejects this as a *ground for legislation*. He insists that legislation must be grounded in utility, which requires a demonstration of "mischief" (harm).

  In his unpublished essays on sexual offenses, Bentham argues that consensual sodomy produces no "primary mischief" (no direct victim) and negligible "secondary mischief" (no significant danger to the population or social fabric). He attributes the public disgust to "prejudice," fueled by religious asceticism and custom. Here lies the crux of your defense: Bentham does not deny the *existence* of the disgust, but he denies its *legitimacy* as a basis for law. He treats the pain of prejudice as "factitious"—created by false beliefs—rather than natural.

  For Bentham, the purpose of law is to maximize happiness by securing expectations and protecting interests. Interests are grounded in real needs (security, subsistence, abundance). The "interest" in not being offended by the private conduct of others is not a protectable interest because it lacks a causal link to tangible harm. Therefore, the pain derived from violating this non-interest is politically irrelevant. By filtering out pains that arise from groundless antipathy, Bentham is not importing a liberty principle from outside; he is applying the internal criteria of what constitutes a *legislative* harm.

  **The Verdict: Security as the Hedonistic Filter**

  Who is right? The verdict must favor **you**, but with a crucial qualification that strengthens your position against your friend's hedonistic challenge.

  Your friend is correct that a *naive* hedonism must count all pains. However, Bentham's system is not naive hedonism; it is a *political* hedonism designed to maximize long-term security. The exclusion of aggregated antipathy does not require importing a non-hedonistic right; rather, it relies on Bentham's distinction between *real* and *imaginary* harms, which is itself justified on utilitarian grounds.

  Bentham argues that if the law allows punishment based on mere disgust (sympathy and antipathy), it destroys **security**. Security is the most vital component of utility for Bentham; without it, no one can plan their life or enjoy their pleasures. If the boundary of criminality is drawn around "what offends the majority" rather than "what causes assignable harm," every citizen lives in fear that their own private preferences might become tomorrow's capital offense. The long-term pain of this universal insecurity vastly outweighs the short-term pain of the majority's disgust.

  Therefore, Bentham can exclude the pain of disgust from the calculus not because it isn't pain, but because *accommodating it* produces a net loss in utility due to the collapse of security. To legislate against prejudice is to invite arbitrary power, and arbitrary power is the greatest enemy of happiness.

  Furthermore, Bentham treats preferences grounded in false beliefs (religious dogma, medical myths about sodomy) as epistemically defective. A utilitarian calculator aims for the *greatest* happiness, which implies a rational assessment of interests. If a pain exists only because the sufferer believes a falsehood (e.g., that sodomy causes earthquakes or divine wrath), the utilitarian legislator is justified in disregarding it in favor of educating the populace, rather than codifying the error. To codify the error is to maximize pain in the long run by perpetuating ignorance.

  **Conclusion**

  Your friend's objection holds water only if we treat utilitarianism as a momentary snapshot of subjective feelings. But Bentham's system is dynamic and institutional. It asks not just "what hurts?" but "what hurts *in a way that law can remedy without causing greater hurt*?"

  Bentham does not need to import a non-hedonistic liberty principle to defend the tolerance of consensual acts. He defends it by showing that the "pain" of the intolerant is grounded in prejudice, and that legislating on behalf of prejudice undermines the security required for anyone to pursue happiness. The "principle of sympathy and antipathy" is rejected not because it is non-hedonistic, but because it is *bad* hedonism—it miscalculates long-term consequences for short-term emotional gratification.

  You win the argument. Bentham's exclusion of aggregated antipathy is consistent with his mature system, provided we understand that his hedonism prioritizes **security and rational interests** over the raw summation of prejudicial qualia. The filter is not a foreign import; it is the structural beam that holds the utilitarian house up.
