          *   Einstein: Relative space/time (spacetime), mass-energy equivalence, mass depends on frame (in early interpretations) or is part of a 4-vector.
      *   *The "World Change":* Scientists working in different paradigms practice their trade in different worlds.

  4.  **Drafting the Response - Structure:**

