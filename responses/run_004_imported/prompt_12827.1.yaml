answer: |-
  Thomas Kuhn addresses this specific objection—the mathematical continuity between Newtonian and Einsteinian physics—in *The Structure of Scientific Revolutions* and subsequent essays. He argues that the transition is not a cumulative refinement because **incommensurability is a semantic and ontological problem, not a mathematical one.**

  While the user correctly identifies that the equations of relativity reduce to Newtonian mechanics in the low-velocity limit ($v \ll c$), Kuhn contends that this logical reduction does not imply conceptual identity. He rejects the cumulative view for three primary reasons:

  ### 1. The Shift in Physical Referents
  Kuhn argues that the terms "mass," "space," and "time" function as **homonyms** across the paradigm shift. Although they share the same names, they refer to fundamentally different physical entities.

  *   **Mass:** In Newtonian mechanics, mass is a conserved, invariant property of matter that is distinct from energy. In Einsteinian mechanics, mass is convertible to energy ($E=mc^2$). Kuhn argues that because the *nature* of the entity has changed, the concepts are incompatible, even if the numerical values are similar at low speeds.
  *   **Space and Time:** Newtonian space and time are absolute, independent containers. Einsteinian space and time are relative and interwoven into a single spacetime manifold.

  Kuhn’s conclusion is that when Einstein formulated his theory, he did not merely extend Newton’s concepts; he **destroyed** them and replaced them with new ones. Consequently, Newton’s laws cannot be derived from Einstein’s laws as a special case because the variables in Newton’s laws (absolute space, invariant mass) do not exist in Einstein’s universe.

  ### 2. The "Limit" is a Retrospective Construction
  Kuhn points out that the mathematical reduction is a tool created *after* the revolution to bridge the gap between the two theories. It is a logical derivation, not a historical reality.

  *   **Historical Discontinuity:** During the transition, Einsteinian physics did not look like a "correction" to Newtonian physics; it looked like a radical rejection of it.
  *   **Gestalt Switch:** The shift required scientists to abandon the Newtonian worldview entirely. You cannot logically derive the concept of "spacetime" from the concept of "absolute space" simply by adjusting a variable; you must replace the framework itself.

  ### 3. Incommensurability vs. Incomparability
  Finally, Kuhn clarifies that incommensurability does not mean the theories cannot be compared; it means there is **no neutral language** to describe both without loss of meaning.

  If one attempts to describe Einsteinian physics using strictly Newtonian terms (e.g., trying to explain time dilation using only absolute time), the description fails. Because the two paradigms define the "rules of the game" differently, there is no common standard of measurement to prove that one is simply a "refinement" of the other.

  **Summary:** For Kuhn, the fact that the math converges at low velocities is a coincidence of approximation, not a proof of continuity. The shift is incommensurable because the two theories describe **different worlds**, not just different numbers.
