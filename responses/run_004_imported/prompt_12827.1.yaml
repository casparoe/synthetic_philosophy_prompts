      *   *The "Limit" Argument:* Kuhn acknowledges the mathematical limit exists ($\lim_{v/c \to 0} \text{Einstein} = \text{Newton}$). However, he argues this is a *formal* property, not a *conceptual* one.
      *   *Conceptual Change:* What do "mass," "space," and "time" *mean* in each theory?
