          *   *Dev's Claim:* We *cannot know* if death is bad (epistemological claim). We shouldn't assume it's bad. Grief is unjustified because we lack grounds, not because death is inherently neutral/good.
      *   **Specific Arguments:**
          *   Mia: "Didn't understand fate" = grief is false.
