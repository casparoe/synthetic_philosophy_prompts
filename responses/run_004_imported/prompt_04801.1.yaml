answer: |-
  Thank you for being here.

  My mother was a writer, though she would have corrected me and said she was an arguer. I am the family's novelist. I make things up to tell the truth; she analyzed the truth to see if it held together. Usually, she found it didn't.

  She was a woman of immense precision. I remember once, at a relative's funeral, she leaned over to me during the eulogy and whispered, "If he says her spirit is 'free from the burden of the body' one more time, he's committed us all to Cartesian dualism." I told her to hush. She whispered back, "Truth matters most when it's difficult."

  She lived by that. And because I loved her, and because I know she is listening to this from inside my memory and not from above the clouds, I intend to honor that precision today.

  It is a temptation, when we stand at a grave, to reach for comforts that my mother spent forty years explaining were incoherent. She did not believe that her mind has detached from her brain and floated away to a better place. She believed that when her brain stopped, her mind stopped. To suggest otherwise would be to lie about who she was. She was a physicalist. She believed in the world as it is.

  But there is a different danger. There is a bleaker comfort that says, "Well, she's gone, and her love was just chemistry, and the universe will go on exactly the same without her." She fought that idea harder than anything. She spent her career defending the reality of the mental. She refused to accept that our thoughts, our choices, and our loves were merely shadows cast by neurons—epiphenomena that didn't actually *do* anything.

  She believed that her love was a cause. Real, effective, and irreducible.

  For those of you who aren't philosophers, let me try to put her life's work into the language of a novelist.

  Imagine you are reading a book, and you begin to cry. Why did you cry?
  A physicist might say: "Because photons reflected off the page, struck your retina, and triggered electrochemical signals."
  A neurologist might say: "Because your amygdala activated and your lacrimal glands engaged."
  But I would say: "You cried because the character died."

  My mother taught me that the last explanation is not just a metaphor. It is the truest cause. The story caused the tears. If you remove the story, the tears don't happen, even if the physics remain the same. The mental level—the level of meaning, of intention, of love—is the level where the causation actually happens.

  She applied this to us. Her love for us was not a ghost hovering over her biology, but it wasn't *just* the biology either. It was the pattern. It was the specific, complex, high-level arrangement of her attention and her care. And because it was real, it changed things.

  I am who I am because she loved me. That is a causal claim. If she had not loved me, I would be a different person. Therefore, her love did work. It moved the furniture of the world. It shaped my nervous system, yes, but more importantly, it shaped my life.

  To the colleagues sitting in the front row: She never yielded ground. She never accepted the exclusion argument. She believed that we are not redundant spectators in our own bodies.

  And to the rest of us, who just miss her: This is where your comfort lies. It does not lie in pretending she is watching you from a distance. It lies in recognizing that she is still acting.

  Causation takes time to propagate. The things she taught me, the kindnesses she showed you, the arguments she started, the papers she wrote—these are causal chains that are still unfolding. She is not present as a spirit, but she is present as a cause. We are the effects of her. Every time I choose patience over anger because she taught me to value clarity; every time one of you recalls her advice and make a different choice because of it; that is her mental causation continuing in the physical world.

  She worried, I think, that if she died, she would be silenced. But she was wrong. A cause does not vanish when the origin point stops; it travels through the medium it touched.

  So, we will not say she is "at peace." We will say she was effective.
  We will not say she is "looking down." We will say she is built in.
  We will not say her love survives as a ghost. We will say her love survives as history, and as us.

  She told me once that the goal of philosophy is to let us see the world without flinching. So I will not flinch. She is gone. But what she did remains. And what she did was love us. And that love is the kind of thing that changes the future.

  Thank you.
