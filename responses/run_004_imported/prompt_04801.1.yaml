  *Drafting the "Philosophy" paragraph:* "She taught me that what makes a cause real isn't that it's made of the smallest things, but that it's the right size to explain what happened." -> This captures proportionality without the jargon.

  *Drafting the "Colleagues" nod:* "For those who know the arguments, you know she never yielded ground." -> Acknowledges their shared history.

  *Drafting the "Comfort":* "We are the evidence of her causation." -> Strong ending.

  8.  **Final Polish:** Check the rhythm. Ensure it sounds like speech. (Proceed to generate output).

  *(Wait, one last check on the "muttering at funerals" bit)*: Make sure it comes off as endearing quirkiness, not disrespect. It highlights her commitment to truth even in uncomfortable moments.

