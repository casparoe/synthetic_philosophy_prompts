      *   **Constraint:** Neither side should simply concede or get the last word by default. It needs to be a genuine clash of frameworks without a tidy resolution.

  2.  **Character Conception:**
      *   *Geo (Let's call her Elena):* Pragmatic but theoretically grounded in ergodicity economics (Ole Peters style). Sees log-wealth as physical reality of compounding. Impatient with "imaginary ensembles."
      *   *EU (Let's call him Marcus):* Rigorous, Bayesian/Subjectivist. Sees utility as preference representation. Worried about path dependence only insofar as it affects *his* specific utility function, which might not be log.
