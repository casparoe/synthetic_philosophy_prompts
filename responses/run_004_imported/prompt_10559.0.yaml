  7.  **Writing the Dialogue.** (Proceeding to generate output based on these thoughts).

      *   *Note on specific math:* Bet: 60% win, 40% lose. Payoff 1:1. Kelly = 0.6 - 0.4 = 0.2.
      *   *Marcus's position:* Finite horizon (say, 100 rounds). He might argue that for 100 rounds, the optimal growth is slightly different, or simply that his utility function isn't log. Let's stick to the utility function argument as it's the core EUT objection.
