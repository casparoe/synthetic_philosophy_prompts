      *   *Better Ending:* They agree to bet, but the *reasoning* remains unresolved. Or they split the difference. Let's have them agree on the action (Kelly) but disagree violently on the *justification*, highlighting that the action converges even if the philosophy doesn't. Actually, it's more dramatic if they struggle to agree on the number. Let's have Marcus want to bet *more* than Kelly for a short horizon (optimal growth for finite N is often slightly higher than asymptotic Kelly), while Elena holds the line.
      *   *Wait, standard Kelly logic:* For finite horizons, optimal bet can be higher than Kelly if you aren't worried about the long run. But Marcus is an EU maximizer. If he has log utility, he bets Kelly. If he has linear, he bets all. If he has square root, he bets half-Kelly. Let's make Marcus have a utility function that implies a different fraction. Let's say he wants to bet 15% (more conservative) because he values the marginal utility of the first million more. Elena wants 20%.
