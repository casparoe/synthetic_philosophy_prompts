      *   *Key Texts to Reference (Mental Check):* *New Essays on Human Understanding*, letters to Arnauld/Des Bosses, *De Quadratura Arithmetica*. (No need to cite page numbers, but keep the ideas accurate).
      *   *Nuance:* Make sure to distinguish between mathematical ideality (where limits exist) and metaphysical reality (where actual infinites don't exist).

  7.  **Self-Correction/Edge Case:**
