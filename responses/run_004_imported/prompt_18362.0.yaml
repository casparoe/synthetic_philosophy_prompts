  5.  **Evaluate the Success of Kavka's Argument:**
      *   Is the Intention-Belief Principle absolute?
      *   *Counter-arguments:*
          *   Self-fulfilling prophecy (Ullmann-Margalit & Morgenbesser): Can I induce the belief?
          *   Self-binding (Schelling): Can I change the payoff structure? (Not applicable here, grandpa is dead).
          *   Bratman's Planning Theory: Intention is a distinct mental state, not just belief + desire.
      *   *Verdict:* Kavka's argument holds for "standard" rationality (Homo Economicus). It fails if we accept that rationality includes disposition-based or plan-based reasoning.

  6.  **Synthesize the User's Specific Situation:**
