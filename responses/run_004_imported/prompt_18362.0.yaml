          4.  The user has intrinsic motivation (loves grandpa, wants to honor him) which changes the payoff matrix (scattering isn't "costly" in utility terms, it's fulfilling). *Crucial Point:* Kavka's toxin is *purely* painful with no benefit. Scattering ashes has emotional/moral benefit. This is a disanalogy. I need to point this out.

