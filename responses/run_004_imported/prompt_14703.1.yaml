  *Key Phrase to include:* "Punishment is essentially communicative." "Fungibility vs. Non-fungibility." "Forensic fiction vs. Metaphysical union."

  *Wait, one nuance:* Murphy actually argues that VP *is* a form of substitution but redefined. I need to be careful not to misrepresent Murphy. Murphy's point is that the *guilty party's punishment* consists in the suffering of the representative. It is not that the representative is punished *instead*. The distinction is:
  PSA: Christ is punished. (Subject of punishment = Christ)
  VP: We are punished via Christ's suffering. (Subject of punishment = Us, Mode = Vicarious)
  This is the crucial distinction to hammer home.

