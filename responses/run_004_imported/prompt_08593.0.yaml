  Alex: Let's start with Mercury. We knew the anomaly existed before Einstein. Probability 1. Then GR arrives, predicts it perfectly. Intuitively, huge confirmation. Formally, zero. Because P(E)=1 means P(T|E) = P(T).

  Jamie: Exactly. That's the problem of old evidence. And your side's solution is basically to say physicists are bad at logic?

  Alex: Not "bad at logic." Just not logically omniscient. They didn't know *T implies E* until the math was done. That implication is the new evidence, not E itself.

  Jamie: But the implication is a logical truth. Once T exists, "T implies E" is timelessly true. You're conflating the psychology of discovery with the logic of confirmation.

  Alex: I'm conflating nothing. Bayesianism is supposed to model rational belief updating. If the agent doesn't know the entailment, it's not in their sigma-algebra. Learning it *is* an update.

  Jamie: So confirmation becomes purely historical? If Einstein had been smarter and seen the entailment immediately, Mercury would confirm GR less? That makes support subjective.

  Alex: It makes support relative to the agent's state. What's your alternative? That counterfactual prior where we pretend we never saw Mercury?

  Jamie: Precisely. We strip E from the background knowledge, calculate P(T|K-E), then see how much E boosts it. That measures the *structural* support E gives T.

  Alex: And how do you construct that prior? It feels like you're reverse-engineering a distribution just to make the numbers work out to match our intuition.

  Jamie: It's not arbitrary. You hold fixed everything else—theoretical virtues, other data—and just excise E. It's a controlled thought experiment.

  Alex: But you can't actually excise E without changing everything else. Mercury's wobble influenced background physics. Your "clean" prior is a fiction.

  Jamie: All idealizations are fictions. But yours relies on a specific moment of human ignorance. Mine relies on a logical relation. Why is your fiction better?

  Alex: Because it tracks what actually changed. The "discovery of entailment" isn't old evidence in disguise; it's a new constraint on the theory space.

  Jamie: It's old evidence wearing a disguise. You're just conditioning on "T entails E" instead of "E". But if E is certain, knowing T entails E just tells you T is consistent with certainty. It doesn't boost T.

  Alex: It boosts T because alternatives to T might *not* entail E. Learning T locks onto the only theory that survives the old data.

  Jamie: But that selection happens in the counterfactual space! In the actual space, the selection already happened. You're trying to have it both ways.

  Alex: I'm saying the actual space includes our logical limitations. Your counterfactual prior is ill-defined because there are infinite ways to remove E from knowledge.

  Jamie: There are principled ways. And if you don't use them, you can't explain why Mercury confirms GR more than, say, a theory that entails it by accident.

