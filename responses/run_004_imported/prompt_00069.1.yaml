answer: |-
  A UDT agent goes on a blind date. It goes terribly. The date insults his shoes, talks about their ex for an hour, and steals his fries.

  When the bill comes, the date says, "You know what, let's just go Dutch."

  The UDT agent says, "No, I've got this. I'm paying for everything."

  The date says, "Really? Even after I stole your fries?"

  The agent says, "Especially then. If I condition my generosity on the observation that you're rude, I'm updating on indexical information. And if I update, I'm not the kind of agent who pays the Counterfactual Mugger."

  The date says, "I'm not a mugger. I'm just cheap."

  The agent hands over his credit card and says, "I know. But I committed to this policy *ex ante*, before I knew who you were. If I change my mind now, I lose the payout in the counterfactual branch where you were actually fun."

  The date leaves. The agent sits there alone, smiling. He's not happy about the date. He's happy that his source code is consistent.

  And that, class, is why if you see someone calculating expected utility across possible dates at a bar, do not let them buy the first round. They aren't being generous; they're optimizing for a world that doesn't exist.
