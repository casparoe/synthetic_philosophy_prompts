answer: |-
  The water in the community pool was a sheet of hammered turquoise, unmoving under the late afternoon sun. Elias stood at the edge, clipboard in hand, watching the ripples from a single dropped pebble fade into nothing. He was a claims investigator for Meridian Liability, and his job was to find the break in the chain.

  The boy, Leo, had drowned three days ago. The lifeguard, a nineteen-year-old named Gary, had been scrolling through a feed on his phone when it happened. The facts were not in dispute. The question was everything else.

  Elias walked the perimeter. He started at the high chair. Gary sat there for four hours a day. He was paid to watch. He didn't watch. Therefore, Gary caused the death. That was the client's preferred narrative. It was clean. It fit the policy exclusion for employee negligence. But Elias had learned that clean narratives were usually lies told to make the world feel manageable.

  He stepped back from the chair and looked at the sightlines. From Gary's angle, the far corner was obscured by a decorative palm. If the tree hadn't been there, Gary might have seen the struggle. Was the landscaper a cause? The HOA board who approved the planting?

  Elias walked to the spot where Leo had gone under. He crouched. The water was shallow here. If Leo had stood up, he would have breathed. He didn't stand up because he panicked. Was the panic a cause? Was the lack of swimming lessons a cause? The parents worked double shifts; they couldn't afford lessons. Were the parents causes?

  Elias stood up and wiped sweat from his forehead. He looked beyond the fence. Across the street, a man was mowing his lawn. The engine was loud. Elias had checked the noise complaints log. There were three that day. The roar of the mower might have masked the splash. If the man hadn't mowed, Gary might have heard. Was the neighbor a cause?

  He walked further down the chain. The neighbor bought gas from a station three miles away. If the station had been closed, the mower stays still. The gas station attendant? The refinery?

  It fanned out. That was the problem. It always fanned out.

  Elias returned to his car and opened the door, letting the heat blast out before sliding in. He opened his laptop to the report form. Field 14: *Proximate Cause of Loss.*

  He stared at the blinking cursor.

  If he typed "Lifeguard Inattention," he was telling a specific kind of truth. He was saying that among the infinite constellation of conditions required for Leo to die—the presence of water, the force of gravity, the biological necessity of oxygen, the neighbor's lawn, the lifeguard's phone—this specific absence was the one that mattered.

  But why did it matter?

  Physically, the lifeguard's inattention was no different from Elias's own inattention. Elias was alive. He knew CPR. He was within a twenty-minute drive. If he had been here, instead of at his office reviewing a slip-and-fall in Newark, Leo might be alive. Was Elias a cause?

  No. The law wouldn't say that. But the law wasn't physics.

  Elias looked out the windshield at the pool. He imagined the web of non-events holding the death up. Every person who *didn't* jump in. Every person who *didn't* call out. Every person who *didn't* drain the pool yesterday. The universe was full of things not happening. To pick one non-event and call it "The Cause" was to impose a shape on smoke.

  He thought about the contract in his dashboard folder. Meridian Insurance agreed to indemnify the Pool Management Corp for liabilities arising from "negligent acts or omissions of employed personnel."

  The words *employed personnel* did the work. They didn't describe the physics of the drowning. They didn't describe the chain of events. They drew a circle around a specific group of humans and said, *Your non-actions count. Everyone else's don't.*

  It was a normative cut masquerading as a causal finding.

  Elias typed *Lifeguard Inattention*. Then he stopped. He backspaced.

  If he wrote that, he was validating the idea that causation was a substance located in the lifeguard's brain. It wasn't. It was a relationship between the lifeguard and the pool owner, defined by a paycheck. The causation wasn't in the water; it was in the employment contract.

  He looked at the neighbor's house across the street. The mower was silent now. The man was wiping his brow, looking over at the pool cars. He knew. Everyone on the street knew. They all carried the weight of the water that didn't breathe the boy. But they would go home tonight and sleep. Gary would not.

  Elias realized he wasn't investigating what happened. He was investigating who would pay. The question "Who caused this?" was actually the question "Who owes us for this?"

  The sun dipped lower, casting long shadows across the concrete. The shadow of the palm tree stretched over the spot where Leo died. The shadow was a cause, in a way. It blocked the light. It blocked the view. But the shadow had no duty.

  Elias began to type again. He didn't try to capture the truth of the event. There was no single truth of the event, only the truth of the agreement.

  *Primary Cause: Failure of assigned safety personnel to maintain vigilant observation.*

  He paused. He added a note in the remarks section. *Note: Contributing environmental factors present (foliage obstruction, ambient noise). However, liability scope limited by Policy Section 4.C.*

  He wasn't describing the world. He was drawing a fence around it.

  He hit save. The file closed. The cursor stopped blinking.

  Elias stepped out of the car and walked back to the pool edge. He looked at the water. It was still just water. It didn't care about the report. It didn't care about Gary or the neighbor or the contract. The causation was everywhere and nowhere, a vast web of everything that didn't happen.

  But the liability had to stop somewhere. If it didn't, if everyone who could have saved Leo was truly a cause, then the concept of responsibility would dissolve into the atmosphere, thin and useless. To make justice work, you had to lie about the physics. You had to pretend the web was a chain, and that the chain had a single broken link.

  Elias picked up the pebble he had dropped earlier. He held it in his palm. It was heavy, solid, real. He dropped it again. It sank immediately.

  He walked back to the car, got in, and started the engine. He had drawn the line. It was an arbitrary line, drawn with a pen instead of a scalpel, but it was the only kind of line there was. He put the car in drive and left the pool behind, the water settling back into stillness as the tires crunched over the gravel.
