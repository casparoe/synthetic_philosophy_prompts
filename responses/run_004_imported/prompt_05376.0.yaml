answer: |-
  1. **Humphreys' Paradox (Main)**
  Paul Humphreys argued that if propensities are to be treated as probabilities, they must obey the standard probability calculus, including Bayes' theorem. But Bayes' theorem allows us to invert conditional probabilities: if there is a propensity for a coin toss to produce heads, the calculus implies a propensity for the toss to have occurred *given* that it landed heads. The first is a causal disposition; the second seems to be a backward-looking inference that violates the time-asymmetry of physical causation. If you insist propensities are real physical dispositions, how do you justify accepting the mathematical machinery that forces them to run backward in time?

  2. **Humphreys' Paradox (Follow-up)**
  *Targeting the "math is just a map" dodge:* Your likely response is that the probability calculus is merely a tool for bookkeeping, while the physical propensity is strictly forward-looking. But if you sever the link between the ontology (the propensity) and the formalism (the calculus) to save the causal direction, aren't you admitting that propensities *do not actually satisfy the axioms of probability*? If they don't satisfy the axioms, in what precise sense are they "probabilities" rather than just vague causal powers that we happen to measure with percentages?

  3. **The Reference Class Problem (Main)**
  You criticize frequentism for the reference class problem: a single event belongs to infinite repeatable classes (e.g., a smoker, a male, a 50-year-old), each yielding different frequencies. You propose that single-case propensities solve this by anchoring probability to the specific "chance setup." But a single case is also describable in infinite ways physically: is the propensity of this uranium atom defined by its being uranium-238, by its position in this magnetic field, or by the total state of the universe? How do you identify *the* relevant setup without appealing to the very frequencies or pragmatic descriptions you claim to reject?

  4. **The Reference Class Problem (Follow-up)**
  *Targeting the "physical factors" dodge:* You will likely say the setup is defined by the *causally relevant* physical factors, not our descriptions. But in physics, everything is causally connected to some degree. If you say only *some* factors constitute the "chance setup," aren't you making a pragmatic or epistemic choice about which details to ignore? If the propensity depends on our choice of which physical details count as the "setup," how is the propensity fully objective and mind-independent?

  5. **Lewis's Principal Principle and Undermining (Main)**
  David Lewis's Principal Principle dictates that a rational agent's credence should match the objective chance. But this creates a tension for propensity theorists: if propensities are real dispositions, they must constrain rational belief. However, Lewis also identified the "undermining" problem, where a chance process can produce a long-run history that statistically contradicts the very chance law that generated it. If your single-case propensities are real, do you accept Lewis's conclusion that we can never know the chances, or do you have a mechanism to prevent the future outcomes from undermining the present propensity?

  6. **Lewis's Principal Principle and Undermining (Follow-up)**
  *Targeting the "non-Humean" dodge:* You may argue that unlike Lewis's Humean view, your propensities are real powers that cannot be undermined by their outcomes. But if a 50% propensity can consistently produce a run of 100% heads without the propensity itself changing, the connection between the propensity and the actual evidence is severed. If the outcomes cannot count as evidence against the propensity, isn't the theory rendered untestable and scientifically vacuous?

  7. **The "Physics vs. Formalism" Boundary**
  You frequently defend your position with the slogan: "the formalism can be patched; the physics can't." But in modern quantum mechanics, the formalism *is* the physics; the wave function and its evolution are not just maps, they are the territory. When you suggest patching the probability calculus to fit your ontology, are you not effectively proposing a change to the physics itself? At what point does insisting on a specific ontology despite the mathematical contradictions become a refusal to accept the physical theory you claim to defend?

  8. **Falsification (Closing)**
  Finally, I want to ask plainly: what kind of empirical or theoretical discovery would actually count as evidence *against* propensity theory itself, as opposed to evidence that its formalism merely needs adjusting? If every mathematical inconsistency can be dismissed as a patchable artifact, and every empirical mismatch can be attributed to a misidentified "chance setup," is there any possible world in which you would concede that single-case propensities do not exist?
