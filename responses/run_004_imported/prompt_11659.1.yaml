prompt: |-
  So I'm working on a longer explainer piece tied to the Aspect/Clauser/Zeilinger Nobel from a couple years back, and I got on a call last week with a philosopher of physics who kind of wrecked my whole framing. Every popular explainer (including, uh, ones I've written) just says Bell's theorem proves the universe is "nonlocal," full stop. She stopped me and said thats too fast: the condition Bell actually rules out is a package deal that splits into two logically independent pieces -- she called them something like "parameter independence" and "outcome independence," crediting the split to a guy named Jarrett back in the 80s -- and apparently only one of those two pieces is actually tied to relativity's no-signalling requirement. The other one can be violated with no chance whatsoever of a faster-than-light signal, which is why she said some people (a philosopher or historian of physics, Howard, I think?) prefer to describe the whole situation as a failure of "separability" rather than "locality."

  I don't need a rederivation of the CHSH inequality or anything like that, I've got the statistics down fine for the piece. What I'm missing is the gut-level intuition: why does splitting Bell's condition into those two pieces matter so much, why is only one of them connected to signalling, and why would a serious physicist or philosopher resist the headline "Bell's theorem proves spooky action at a distance" even while granting that the correlations definately can't come from any local hidden-variable model? If you've got a clean analogy or toy example that makes parameter independence vs outcome independence click without requiring a stats background, that'd be perfect. And if you think the standard "no signalling, but somehow still nonlocal" framing that science writers (myself included) tend to lean on is actively misleading rather than just simplified, I'd like to hear that case too, since I'll have to decide how much of this nuance I can actually fit into 900 words.
