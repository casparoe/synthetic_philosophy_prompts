          *   Case A: $\square (P \lor \neg P)$ [Necessary that (P or not-P)] -> Aristotle accepts this.
          *   Case B: $(\square P) \lor (\square \neg P)$ [ (Necessary P) or (Necessary not-P) ] -> Aristotle rejects this.
      *   *Why it matters:* Fatalism relies on Case B. If "True now" implies "Necessarily true," then the future is fixed. Aristotle says: Just because the *whole statement* ("Either fight or no fight") is necessary doesn't mean the *parts* are necessary.
