  3.  **Address Point 1: The Apparent Contradiction (True/False vs. Not Actually True/False):**
      *   *Text:* "One of the two propositions... must be true and the other false... but we cannot say determinately that this or that is false... It is therefore plain that it is not necessary that of an affirmation and a denial one should be true and the other false."
      *   *Analysis:* This looks like a contradiction of the Law of Excluded Middle (LEM). Aristotle *doesn't* want to reject LEM entirely. He wants to restrict its application to *contingent* future events.
      *   *Resolution:* Distinguish between "True/False" in a general sense vs. "Definitely/Determinately True/False."
      *   *Key Concept:* **Bivalence vs. Excluded Middle.**
          *   Excluded Middle: $(P \lor \neg P)$ is always true. (Aristotle keeps this).
          *   Bivalence: Every proposition is *currently* either True or False. (Aristotle rejects this for future contingents).
      *   *The "Actually":* In Edghill's translation, "actually" (or "determinately") refers to the *current state of reality* fixing the truth value. For past/present/necessary events, reality fixes it. For future contingents, reality hasn't "crystallized" yet. So, the disjunction is true, but the specific disjuncts don't have a fixed truth value *yet*.

  4.  **Address Point 2: Scope of Necessity (The Modal Fallacy):**
      *   *Text:* "A sea-fight must either take place to-morrow or not, but it is not necessary that it should take place to-morrow, neither is it necessary that it should not take place, yet it is necessary that it either should or should not take place to-morrow."
