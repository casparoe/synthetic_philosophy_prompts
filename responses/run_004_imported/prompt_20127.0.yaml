prompt: |-
  Aquinas never encountered the modern dispute between textualism, which holds that judges should adhere to a law's enacted text even against its apparent purpose, and purposivism, which holds that text should yield to that purpose when the two diverge. Yet his treatise on law contains real material bearing on it: in the Summa Theologiae, I-II, q. 96, a. 6, he argues that a law binds according to the lawgiver's intention rather than its bare wording, illustrating the point with a besieged city whose standing order to keep the gates shut ought to be disregarded for citizens fleeing the enemy, since obeying the letter there would defeat the very purpose the order serves; he treats the corresponding virtue of equitable judgment, epikeia, at II-II, q. 120. Elsewhere in the same treatise, however, he insists that private individuals may not simply override the letter with their own judgment of the common good except in cases of manifest and urgent necessity, since interpreting the law in less clear cases belongs to those who hold public authority. Working only from these actual commitments — on natural law, the common good, and who has standing to interpret — would you expect him to side more with the textualists or with the purposivists, and why? Defend your answer against the strongest textual evidence for the opposite reading.
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the Prompt:**
      *   **Subject:** Thomas Aquinas's legal philosophy (specifically *Summa Theologiae* I-II, q. 96, a. 6 and II-II, q. 120).
      *   **Modern Context:** The dispute between Textualism (adhere to text even against purpose) and Purposivism (text yields to purpose).
      *   **Key Aquinas Commitments:**
          1.  Law binds according to the lawgiver's intention, not just wording (Besieged city example).
          2.  Virtue of *epikeia* (equity) corrects the law when it fails in particular cases.
          3.  Private individuals cannot override the letter except in "manifest and urgent necessity."
          4.  Interpretation in less clear cases belongs to public authority.
          5.  Underlying principles: Natural law, Common Good.
      *   **Task:** Determine which side (Textualist or Purposivist) Aquinas would likely support based *only* on these commitments.
      *   **Requirement:** Defend the answer against the strongest textual evidence for the *opposite* reading.

  2.  **Initial Assessment & Categorization:**
      *   *Textualism:* Focus on the enacted text. Stability, predictability, democratic legitimacy (in modern terms), limiting judicial discretion.
      *   *Purposivism:* Focus on the goal/intent of the law. Flexibility, justice in particular cases, avoiding absurd results.
      *   *Aquinas's "Besieged City" Example:* This is the classic case for equity/purposivism. Keeping gates shut (text) vs. saving citizens from enemy (purpose). Aquinas says follow the purpose.
      *   *Aquinas's "Authority" Constraint:* Private individuals can't just decide the law doesn't apply. Public authority interprets. This sounds like a constraint on discretion, which textualists like.

      *   *Tension:* Aquinas prioritizes the *intent* (Purposivist) but restricts *who* can make that call (Institutional constraint similar to Textualist concerns about judicial overreach).

      *   *Verdict:* Aquinas is fundamentally a **Purposivist** (specifically an Intentionalist), but with strong institutional guardrails that prevent *private* purposivism. He believes the *law itself* is defined by its aim (common good), so adhering to the text *against* the aim is actually adhering to something that isn't truly "law" in that specific instance.

  3.  **Drafting the Argument (Step-by-Step):**

      *   **Thesis:** Aquinas would side with the **Purposivists** (specifically a robust intentionalism), because for him, the binding force of law derives from reason and the common good, not mere verbal formulation. However, his view is nuanced: it is "Institutional Purposivism."

      *   **Support for Purposivism:**
          *   *Nature of Law:* Law is an ordinance of reason for the common good (I-II, q. 90). If the text contradicts the reason/common good, the text loses its binding force in that instance.
          *   *Epikeia:* The virtue of *epikeia* (II-II, q. 120) is higher than strict legal justice. It corrects the law where it is deficient due to universality.
          *   *The Besieged City:* Explicit example where text is ignored for the sake of the law's end (safety of the city).

      *   **The Textualist Counter-Argument (The "Strongest Evidence"):**
          *   Aquinas says private individuals cannot interpret the law in doubtful cases; only the sovereign can (I-II, q. 96, a. 6).
          *   He warns against following one's own judgment over the law unless necessity is *manifest*.
          *   This aligns with Textualist concerns about stability, rule of law, and preventing judges/citizens from substituting their policy preferences for enacted law.

      *   **Rebutting the Counter-Argument (The Defense):**
          *   Why does Aquinas restrict private interpretation? Not because the text is sacred, but because *private judgment is fallible* and social order requires a final arbiter.
          *   Who interprets? The sovereign (public authority). Does the sovereign interpret textually or purposively? Aquinas implies the sovereign interprets according to the *intention* of the law (which is their own intention or the natural law).
          *   Therefore, the restriction is on *who*, not on *how*. The "how" remains purposive.
          *   Textualism often posits the text *is* the law. Aquinas posits the *reason* is the law, expressed via text. If text fails reason, reason wins.
          *   The "manifest necessity" clause isn't a textualist rule; it's an epistemic threshold for invoking *epikeia*.

  4.  **Refining the Distinction (Nuance Check):**
      *   Modern Textualism often claims "text is the best evidence of intent." Aquinas might agree text is the *usual* evidence of intent.
      *   But when text and intent diverge (the core of the prompt's definition), Aquinas chooses intent.
      *   So, he is a Purposivist regarding the *ontology* of law, but a Proceduralist regarding the *application* by subordinates.
      *   *Decision:* The prompt asks if he sides with Textualists or Purposivists regarding the dispute where text and purpose diverge. In that specific divergence, he chooses purpose.

  5.  **Structuring the Essay:**
      *   **Introduction:** State the position clearly (Aquinas is a Purposivist/Intentionalist). Define the core reason (Law is ordinance of reason).
      *   **The Case for Purposivism:** Discuss I-II, q. 96, a. 6 (besieged city) and II-II, q. 120 (*epikeia*). Explain that for Aquinas, law derives binding force from its end (common good), not its syntax.
      *   **The Textualist Challenge:** Acknowledge the constraint on private judgment. This looks like Textualism (stability, authority).
      *   **The Rebuttal/Synthesis:** Explain why this constraint doesn't make him a Textualist. The constraint is about *authority*, not *interpretive method*. The sovereign interprets purposively. Private individuals must assume the text reflects the purpose *unless* it is manifestly otherwise.
      *   **Conclusion:** Summarize. Aquinas offers a "hierarchical purposivism."

  6.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I use modern terms anachronistically? *Correction:* Acknowledge he didn't know these terms, but map the concepts carefully.
      *   *Check:* Did I address the "strongest evidence for the opposite"? *Yes,* the restriction on private judgment is the key textualist-leaning point.
      *   *Check:* Is the distinction between "private individual" and "public authority" clear? *Yes,* this is crucial. Textualism is often a theory for judges (public authority). Aquinas says public authority should interpret based on intention. So even judges (in modern terms) should be purposive, according to Aquinas, provided they have the standing.
      *   *Refinement:* Modern textualists argue *judges* should stick to text. Aquinas argues *judges (public authority)* should interpret the intention. This is a key divergence.

  7.  **Final Review against Prompt:**
      *   Work only from actual commitments? Yes.
      *   Natural law, common good, standing? Yes.
      *   Defend against opposite reading? Yes.

  8.  **Final Polish:** Ensure the tone is analytical and philosophical. (Proceed to generate output).

  *(Self-Correction Note during drafting)*: I need to be careful not to conflate "Purposivism" with "doing whatever you want." Aquinas's purposivism is bounded by Natural Law and the *actual* intent of the lawgiver, not the judge's policy preference. Modern purposivism is sometimes criticized for allowing judges to import their own purposes. Aquinas avoids this via Natural Law. I should mention this distinction to strengthen the argument.

  *(Final Plan)*:
  1. Thesis: Aquinas is a Purposivist (Intentionalist).
  2. Argument 1: Ontology of Law (Reason/Good > Words).
  3. Argument 2: Epikeia and the Besieged City.
  4. Counter-Argument: The restriction on private judgment (Textualist appeal to stability/authority).
  5. Rebuttal: Authority determines purpose, text is secondary. The restriction is procedural, not ontological.
