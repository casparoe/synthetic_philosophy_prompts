answer: |-
  Based on the commitments found in the *Summa Theologiae*, Thomas Aquinas would side with the **purposivists**. While he shares the textualist concern for legal stability and authority, his metaphysical understanding of what law *is* compels him to prioritize the lawgiver's intention and the common good over the bare wording when the two diverge. However, his purposivism is not license for judicial discretion; it is an **institutional intentionalism** bounded by natural law and hierarchical authority.

  ### The Case for Aquinas as a Purposivist

  Aquinas's alignment with purposivism stems from his definition of law itself. In I-II, q. 90, he defines law as "an ordinance of reason for the common good, made by him who has care of the community, and promulgated." For Aquinas, the binding force of law does not reside in the physical marks of ink on parchment (the text), but in its rationality and its orientation toward the common good.

  This is explicitly confirmed in I-II, q. 96, a. 6. Aquinas argues that human laws cannot cover every particular circumstance. If a case arises where observing the law would harm the common good—the very end the law was designed to serve—the law ceases to bind in that instance. His example of the besieged city is decisive: the text commands "keep the gates shut," but the purpose is "save the city." If defenders need to sortie to save the city, obeying the text defeats the purpose. Aquinas concludes that in such cases, one must follow the intention of the lawgiver, not the words.

  Furthermore, in II-II, q. 120, Aquinas identifies *epikeia* (equity) as a virtue superior to strict legal justice. *Epikeia* is the habit of discerning when the universal formulation of a law fails to capture the particular demand of justice. If Aquinas were a textualist, *epikeia* would be a vice—a substitution of private judgment for public rule. Instead, he calls it a "higher justice." This confirms that for Aquinas, the "law" in the fullest sense is the rational order intended by the legislator, not merely the linguistic vehicle used to convey it. When the vehicle breaks down, the rational order remains the true standard.

  ### The Strongest Textual Evidence for the Opposite Reading

  The strongest argument for reading Aquinas as a textualist lies in his strict warnings against private interpretation. In I-II, q. 96, a. 6, immediately after discussing the besieged city, Aquinas cautions that if the danger is not "manifest and urgent," private individuals ought not to take it upon themselves to disregard the letter of the law. He insists that in doubtful cases, interpretation belongs to those holding public authority.

  A modern textualist would seize on this. Textualism is often motivated by a desire to limit judicial discretion, ensure predictability, and respect the separation of powers. Aquinas's insistence that private individuals cannot override the text based on their own assessment of the "common good" mirrors the textualist fear that purposivism allows judges (or citizens) to substitute their own policy preferences for enacted law. Aquinas clearly values the stability of the legal order and recognizes that allowing everyone to act as their own interpreter leads to anarchy. If the text is clear, and the necessity is not manifest, the text holds. This looks like a textualist default rule.

  ### Defending the Purposivist Reading

  Despite this procedural constraint, Aquinas remains a purposivist in the fundamental dispute over what happens when text and purpose diverge. The restriction on private judgment is a matter of **standing**, not **interpretive method**.

  Aquinas does not tell the public authority (the sovereign or the judge acting *in persona principis*) to adhere to the text against the purpose. He tells *private individuals* to defer to the public authority. But when the public authority interprets the law, on what basis do they do so? Aquinas implies they interpret based on the *intent* and the *common good*. The sovereign is the guardian of the common good; therefore, the sovereign's interpretation will naturally be purposive. If the sovereign determines that the text no longer serves the common good, the sovereign has the authority to dispense from the law or interpret it according to its spirit.

  Therefore, the textualist reading mistakes a constraint on *who* may interpret for a constraint on *how* to interpret. Aquinas restricts the *agent* of interpretation to preserve order, but he does not restrict the *method* of interpretation to the text.

  Moreover, Aquinas's "manifest necessity" clause is not a textualist rule; it is an epistemic threshold for invoking natural law. Textualism posits that the text is the law, even if it leads to bad outcomes (unless there is a constitutional escape clause). Aquinas posits that an unjust or irrational application is *not law* in that instance. The requirement for "manifest" necessity is simply a recognition of human fallibility. Because private citizens might be wrong about what the common good requires, they need a high bar of certainty before acting against the text. This protects the *presumption* that the text usually reflects the purpose, but it does not elevate the text above the purpose.

  Finally, Aquinas's natural law framework prevents the slide into the modern textualist's fear of unconstrained purposivism. Modern purposivism is sometimes criticized for allowing judges to import their own purposes. Aquinas avoids this because the "purpose" is not the judge's preference, but the objective common good grounded in natural law. The judge does not ask, "What do I want?" but "What does reason require for the community?"

  ### Conclusion

  Aquinas would reject the textualist claim that the text binds even when it defeats the law's purpose. For Aquinas, a command that defeats its own rational end loses its character as law in that specific instance. However, he would also reject a radical purposivism that allows any individual to disregard the text based on subjective utility. He would advocate for a system where public authorities interpret laws purposively, guided by natural reason and the common good, while private citizens adhere to the text unless the conflict with the common good is undeniable. In the core theoretical dispute—does the text rule the purpose, or does the purpose rule the text?—Aquinas stands with the purpose.
