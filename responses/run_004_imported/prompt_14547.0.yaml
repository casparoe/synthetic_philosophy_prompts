answer: |-
  Here are eight interview questions designed to press on the structural weaknesses of superrationality and its multiverse-wide extension. Each includes the primary question, a brief note on the answer she is most likely to give (based on the standard defense of these views), and a follow-up designed to prevent her from retreating to standard talking points.

  ### 1. The Reference Class Problem
  **Question:** "The classic Hofstadter argument relies on the idea that 'superrational' thinkers will arrive at the same conclusion. But when we move from literal source-code duplicates to human beings, the definition of 'same conclusion' gets fuzzy. How much similarity do you actually need between two agents for the superrational correlation to hold? Is it a binary switch where you are either 'in' the reference class or 'out,' or is there a decay function where the correlation weakens as our cognitive architectures diverge?"

  **Likely Answer:** She will likely argue that it isn't about biological similarity but about the *decision algorithm*. If two agents are sufficiently rational and face the same problem, they are, for decision-theoretic purposes, running the same function. Therefore, they are effectively the same agent.

  **Follow-up:** "If 'same agent' is cashed out as 'producing the same output,' doesn't that make the theory unfalsifiable? If I meet someone who reasons through the Prisoner's Dilemma and defects, you must conclude they weren't 'sufficiently rational' rather than that the correlation failed. Are you effectively defining rationality as 'whatever produces the superrational output,' and if so, does that strip the term of any independent predictive power?"

  ### 2. Decision Rule vs. Empirical Belief
  **Question:** "There is a debate in the community about whether Functional Decision Theory (FDT) represents a new normative rule for making choices, or if it's just standard Expected Utility reasoning combined with a controversial empirical belief that my choice is correlated with yours. If a Causal Decision Theorist simply *believed* their choice was acausally correlated with their partner's, they would cooperate. So, is the innovation here really in the decision rule, or just in the metaphysics of correlation?"

  **Likely Answer:** She will likely insist it is a distinct decision rule because it treats counterfactuals differently. A CDT agent *cannot* coherently hold that belief because their causal model forbids it; FDT changes how we evaluate the counterfactual 'If I cooperate, then...'

  **Follow-up:** "But if the only thing stopping a CDT agent from cooperating is their causal graph, and we can empirically observe that rational humans often do correlate without causal links, shouldn't the CDT agent just update their graph? If the 'rule' only differs from standard utility maximization because it assumes a specific empirical structure of the world, isn't superrationality really just a claim about sociology or psychology masquerading as logic?"

  ### 3. The Kantian Parallel
  **Question:** "Superrationality often sounds strikingly like Kant's Categorical Imperative in game-theoretic dress: 'Act only according to that maxim whereby you can, at the same time, will that it should become a universal law.' When you say 'cooperate because if you do, similar agents will,' it sounds like 'cooperate because you would want all rational agents to.' Is this just a convergence between instrumental rationality and deontological ethics, or do you think you're deriving an 'ought' purely from an 'is'?"

  **Likely Answer:** She will likely argue that the justification is purely instrumental. You aren't cooperating out of duty, but because it yields higher utility *given* the correlation. The similarity to Kant is a happy accident of structure, not origin.

  **Follow-up:** "But if the justification is purely instrumental, it collapses if the empirical correlation is weak. Kant's imperative holds even if no one else follows it. If your argument requires me to believe that others *will* actually mirror my action to be valid, doesn't that mean superrationality fails in the exact scenarios where morality is usually thought to be most needed—namely, when others are *not* cooperating? Why should I call it 'rationality' if it's contingent on the world being nicer than it appears?"

  ### 4. Multiverse Licensing
  **Question:** "Let's move to the multiverse-wide extension. In the standard Twin PD, I have some inductive reason to think my twin is like me. But in an infinite multiverse, I am cooperating with agents I can never observe, communicate with, or gather evidence about. What actually licenses the assumption that my decision here correlates with a being in a causally disconnected region of the multiverse? Is this a logical necessity, or are you asking us to take a wager on the structure of reality?"

  **Likely Answer:** She will likely argue that logical correlation doesn't require causal contact. If the other agent is reasoning through the same mathematical truth about cooperation, the correlation exists in the realm of logic, which is omnipresent. It's not a wager; it's a deduction.

  **Follow-up:** "But to deduce that, you need to know the other agent is actually reasoning through that truth. Without causal contact, I have no evidence of their existence, let alone their decision algorithm. If I cooperate, I pay a real cost in my local light-cone for a benefit in a sector I can't verify. Doesn't this turn decision theory into a form of Pascal's Mugging, where I sacrifice definite utility for the possibility of infinite, unobservable returns based on a logical assumption I can't test?"

  ### 5. The "Spurious Correlation" Objection
  **Question:** "Following up on the multiverse: If the criterion for cooperation is simply 'agents whose dispositions might be correlated with mine,' how do you avoid the reference class exploding? For all I know, my decision might be correlated with the behavior of alien civilizations with values hostile to mine, or even with random physical processes that mimic decision-making. Why does the reasoning commit me to cooperating with 'good' superrationalists but not with literally anything whose dispositions happen to track mine?"

  **Likely Answer:** She will likely invoke a "similarity metric." We only cooperate with agents who are similar *in the relevant way* (i.e., they also value cooperation and are using the same decision theory). We don't cooperate with rocks or enemies because the logical link doesn't hold there.

  **Follow-up:** "But determining that 'relevant similarity' requires knowing their values and algorithms, which brings us back to the evidence problem. If I have to assume they are 'like me' to cooperate, aren't I just assuming the conclusion? I'm assuming they are cooperators to justify cooperating with them. How do I distinguish between a 'logical correlation with a partner' and a 'spurious correlation with a free-rider' without the causal evidence you say I don't need?"

  ### 6. One-Sided Cooperation and Exploitability
  **Question:** "A common criticism of TDT and superrationality is that they are exploitable by Causal Decision Theorists. If I know my partner is a standard rational agent who will defect, superrationality seems to demand I cooperate anyway, hoping to influence a correlation that doesn't exist. Does your view require me to be a 'sucker' in a mixed population? And if so, isn't that evolutionarily unstable?"

  **Likely Answer:** She will likely argue that superrational agents should precommit to punishing defectors or conditionalizing their cooperation on the probability that the other is also superrational. It's not blind cooperation; it's conditional on the estimated probability of correlation.

  **Follow-up:** "If it's conditional on the probability of correlation, then in the one-shot Prisoner's Dilemma with a stranger, that probability is arguably near zero. If you concede that I should defect when the probability of correlation is low, haven't you just reduced superrationality to standard Expected Utility with a different prior? Where is the distinct 'superrational' bite if it dissolves the moment I suspect I'm talking to a CDT agent?"

  ### 7. The Metaphysics of Logical Counterfactuals
  **Question:** "The machinery driving this view relies heavily on 'logical counterfactuals'—the idea that I can ask 'What if I chose differently?' even when my decision is determined by logic. But we don't yet have a rigorous formal account of how logical counterfactuals work without running into paradoxes like the 'Troll Bridge' problem. Are you advocating for a decision theory that relies on a metaphysical mechanism we don't yet understand?"

  **Likely Answer:** She will likely admit the formalism is incomplete but argue that the intuition is robust. We reason about math and logic counterfactually all the time (e.g., 'If I had proven this theorem differently...'). Decision theory should capture that intuition even if the math isn't finished.

  **Follow-up:** "But in decision theory, the stakes are action-guiding. If the formalism for logical counterfactuals is broken, the action-guidance might be illusory. If 'Troll Bridge' shows that agents can be punished for reasoning about their own consistency, doesn't that suggest that trying to acausally influence logical space is dangerous? Should we really be building a global cooperation strategy on a concept that currently breaks when an agent looks too closely at its own source code?"

  ### 8. Practical Tractability
  **Question:** "Let's bring this down to earth. Even if multiverse-wide superrationality is theoretically correct, it seems computationally intractable for humans. We can't calculate the measure of cooperating agents in the multiverse. If a theory is true but impossible to apply, does it have any normative force? Should we be teaching this to people, or is it a 'view from nowhere' that only applies to idealized agents?"

  **Likely Answer:** She will likely argue that we can use heuristics. We don't need exact calculations; we just need to recognize that the *direction* of the influence is positive. Promoting a culture of superrationality increases the density of cooperators in the multiverse, which is good.

  **Follow-up:** "But if it's just a heuristic, isn't it vulnerable to the same biases as ordinary morality? If I say 'I'm cooperating to influence the multiverse,' how do I know I'm not just rationalizing my desire to be virtuous? If the practical application looks identical to 'be a nice person because it feels right,' have we actually added anything to decision theory, or have we just given a mathematical costume to ordinary altruism?"
