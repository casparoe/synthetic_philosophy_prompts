answer: |-
  The ember flared orange in the twilight, a tiny, defiant star against the grey pavement. Dave inhaled, shoulders dropping an inch, the tension of the last twenty minutes dissolving into smoke.

  Elena didn't look at Dave. She looked at Marcus. "There it is. Classic *akrasia*."

  Marcus watched the smoke drift toward the patio heater. "Don't be lazy. It's hyperbolic discounting."

  "It's weakness of will," Elena corrected, her voice low but sharp. "Twenty minutes ago, Dave made an all-things-considered judgment. He weighed the health risks, the cost, the smell, the promise to his daughter. He concluded: *No more cigarettes.* That was his rational verdict. And now? He's acting directly against it. He knows better, and he's doing it anyway."

  "He doesn't know better *now*," Marcus said. "That's the error in your thinking. You think 'Dave' is a single, static entity. He's not. He's a timeline. Twenty minutes ago, Future-Dave was in charge. Future-Dave values lungs. But Present-Dave? Present-Dave is standing in the cold, stressed, with a nicotine receptor screaming. For Present-Dave, the utility of that cigarette just spiked above the utility of long-term health."

  "So he changed his mind?"

  "No. His *self* changed." Marcus tapped his temple. "We discount the future hyperbolically. A reward right now is worth double a reward tomorrow. But a reward in a year is worth the same as a reward in a year and a day. It's an inconsistency in valuation, not a failure of morality. You're treating it like a sin. I'm treating it like a math problem."

  Elena turned fully toward him, ignoring Dave's ashing hand. "A math problem? You're dissolving the agent. If Present-Dave and Future-Dave are different people, then who is responsible? If I can just say, 'Oh, that wasn't me, that was my temporal counterpart,' then agency evaporates. You're giving him a free pass by fragmenting him."

  "I'm giving you a predictive model," Marcus shot back. "Your model is a ghost story. 'Willpower.' 'The Unified Self.' Where is it? Show me the organ. Show me the variable. I can predict exactly when Dave will relapse based on stress levels and proximity to the reward. You just stand there and call it 'irrational' like it's a demon possession. It's not irrational. It's consistent within the timeframe of the impulse."

  "It *is* irrational because he endorses the long-term plan!" Elena hissed. "Even as he lights it, if you asked him, 'Do you wish you were a smoker?' he'd say no. He identifies with the quitter, not the smoker. He is acting against his own endorsed values. That is the definition of *akrasia*."

  "He identifies with the quitter because the quitter is safe," Marcus said. "But the smoker is fed. Look, Elena, you're hung up on the idea that he's violating his judgment. But at the exact second he reached for the pack, his judgment shifted. The pain of withdrawal became the dominant fact of his universe. He didn't act against his better judgment. At that second, the cigarette *was* the better judgment."

  Elena froze. The noise of the street seemed to drop away. She stared at Marcus, really looked at him, and a slow, incredulous smile touched her lips.

  "My god," she said. "You're a Socratic."

  Marcus blinked. "Excuse me?"

  "Socrates. The *Protagoras*," Elena said, stepping closer. "He claimed no one ever acts against their better knowledge. He said if you do evil, it's only because you're ignorant of the good. You think Dave is doing the 'right' thing based on his immediate calculus. You're saying ignorance isn't the issue, but the mechanism is the same: if the action happens, it must have been the 'winning' option. You're denying the possibility of *akrasia* just like him."

  Marcus scoffed, waving a hand at the smoke. "Socrates thought it was an intellectual error. A lack of knowledge. I'm saying it's a structural feature of time preference. Socrates lacked calculus. He thought if you *knew* the sum, you'd pick the bigger number. I'm saying the number changes depending on when you ask."

  "But the result is the same!" Elena pressed, sensing blood. "You're stripping the tragedy out of it. For Socrates, you can't be weak, only wrong. For you, you can't be weak, only inconsistent. In both worlds, Dave isn't actually failing. He's just... processing data. You've turned a moral collapse into an equilibrium."

  "I've turned a moral judgment into a solution," Marcus countered, his voice hardening. "If it's *akrasia*, the cure is 'be better.' Good luck with that. If it's hyperbolic discounting, the cure is commitment devices. Take away the cards. Tax the cigarettes. Change the incentives. Your view makes him a sinner. My view makes him a design flaw."

  "And that's the problem," Elena said, watching Dave stub the cigarette out, looking immediately ashamed. "Look at him. He feels guilt. He feels he betrayed himself. If you're right, and that was just Present-Dave optimizing utility, why does he feel like he failed? Why the shame?"

  "Because Future-Dave is going to be angry at Present-Dave," Marcus said, not missing a beat. "It's an inter-temporal conflict. One self stole from the other."

  "It's not theft, Marcus. It's surrender," Elena said softly. "He knows he's one person. That's why it hurts. You can model him as a thousand different Daves along a timeline, but he's the one who has to live in the body you're all fighting over. By calling it discounting, you're saying his reason didn't fail. I'm telling you it did. And if reason failed, then reason can be trained. If it's just... math? Then he's just a machine waiting to break."

  Machines don't feel shame, Elena," Marcus said, finally looking away from her, watching Dave walk back toward the door. "But they do glitch."

  "Glitches don't write novels about their guilt," she said.

  "Neither do cigarettes," Marcus replied. "But here we are."
