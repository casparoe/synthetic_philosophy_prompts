prompt: |-
  I'm working on a scene in my novel where two side characters -- a philosopher and a behavioral economist -- watch their friend light a cigarette twenty minutes after swearing off smoking for good, and I want them to actually go at each other over it, not just trade speeches. The philosopher says its real akrasia -- their friend acting against his own all-things-considered judgement, genuine irrationality, not just a change of heart. The economist says thats confused: its just hyperbolic discounting, two selves (a 'now self' and a 'later self') haggling over the same cigarette, with the near one winning once the reward's close enough in time. Give me their argument as a real back-and-forth, each one pressing on the weak spot in the other's case rather than just restating their own -- and somewhere in there have the philosopher notice that the economist's story sounds a lot like Socrates' old claim that nobody ever really acts against their better judgement, and see how she answers that.
