answer: |-
  You have identified a genuine tension in the literature, but your understanding of Lewis's specific conclusion from the triviality results is slightly inverted. You have attributed **Adams's** solution to the problem to **Lewis**.

  Here is the breakdown of where the confusion lies and how to reconcile Lewis's triviality results with his truth-conditionalism.

  ### 1. The Triviality Result (The Trilemma)
  Lewis's 1976 paper, *"Probabilities of Conditionals and Conditional Probabilities,"* demonstrates that three plausible claims form an inconsistent triad. You can hold any two, but not all three:

  1.  **Propositionalism:** Indicative conditionals express propositions (they have truth conditions).
  2.  **The Equation:** The probability of a conditional equals the conditional probability ($P(A \to C) = P(C|A)$).
  3.  **Non-Triviality:** There are non-trivial probability functions (i.e., we don't live in a world where we are certain of everything).

  Lewis's proof shows that if you accept (1) and (2), you are forced to reject (3). Since (3) is obviously false (we are not omniscient), you must reject either (1) or (2).

  ### 2. The Two Camps
  This is where the philosophical landscape splits, and where your understanding conflated the two sides.

  *   **The Adams/Edgington Camp (Non-Truth-Conditional):**
      *   **Choice:** They keep **The Equation** and **Non-Triviality**.
      *   **Sacrifice:** They reject **Propositionalism**.
      *   **View:** Conditionals do not express propositions; they are not strictly true or false. They have "assertibility conditions" rather than truth conditions. The probability of asserting them matches $P(C|A)$.
      *   **Your Error:** You attributed this conclusion to Lewis.

  *   **The Lewis/Grice/Jackson Camp (Truth-Conditional):**
      *   **Choice:** They keep **Propositionalism** and **Non-Triviality**.
      *   **Sacrifice:** They reject **The Equation**.
      *   **View:** Conditionals *do* express propositions (they are true or false). However, the probability of that proposition is **not** $P(C|A)$.
      *   **Lewis's View:** Lewis argues that our intuition that $P(A \to C) = P(C|A)$ is mistaken. He defends the view that the indicative conditional is the **material conditional** ($\neg A \lor C$). Therefore, $P(A \to C) = P(\neg A \lor C)$.

  ### 3. Why Lewis Defends the Material Conditional
  You noted that it seems like the triviality proof should rule out the material conditional. It does not. It only rules out the material conditional *if* you insist that the probability of the material conditional must equal the conditional probability.

  Lewis argues:
  1.  Conditionals express propositions (Truth-Conditionalism).
  2.  The best candidate for that proposition is the material conditional ($\neg A \lor C$).
  3.  Therefore, $P(\text{If } A, C) = P(\neg A \lor C)$.
  4.  Since $P(\neg A \lor C) \neq P(C|A)$ (generally), **The Equation is false.**

  Lewis acknowledges that $P(\neg A \lor C)$ often yields counterintuitive results (e.g., "If the moon is made of cheese, then 2+2=4" comes out true and highly probable because the antecedent is false). To handle this, Lewis (along with Grice and especially Frank Jackson) relies on a distinction between **truth conditions** and **assertibility conditions**.

  *   **Truth:** Determined by the material conditional.
  *   **Assertibility:** Determined by pragmatic rules. Jackson, in particular, argued that we only assert $A \to C$ if the material conditional is true *and* robust (i.e., we would still believe it upon learning $A$). This pragmatic constraint explains why we *feel* like The Equation is true, even though Lewis argues it is semantically false.

  ### 4. Summary of the Correction
  Your understanding went wrong on this specific inference:
  > *"Lewis proved that no proposition can have a probability that always matches... and that this is precisely why he belongs with Adams... among those who deny that indicative conditionals express propositions."*

  **Correction:** Lewis proved that no proposition can have a probability that matches conditional probability **unless** probability functions are trivial. Lewis's conclusion was: **"So much the worse for the Equation."** Adams's conclusion was: **"So much the worse for Propositions."**

  Therefore, Lewis belongs with Grice and Jackson as a defender of truth-conditions (specifically the material conditional), precisely *because* he used the triviality results to reject the Equation rather than reject propositions.

  ### Visual Aid

  | Philosopher | Express Propositions? (Truth Conditions) | Follows The Equation? ($P(A \to C) = P(C|A)$) | Analysis of "If" |
  | :--- | :--- | :--- | :--- |
  | **Adams / Edgington** | **No** (Non-cognitivism) | **Yes** | Assertibility Conditions |
  | **Lewis / Grice / Jackson** | **Yes** (Cognitivism) | **No** | Material Conditional ($\neg A \lor C$) |

  ### Conclusion
  You are correct that Lewis proved the triviality results. You are correct that Lewis is often grouped with Grice and Jackson. The error was in thinking Lewis used the proof to abandon truth conditions. He used the proof to abandon the Equation, thereby preserving the truth-conditional (material) analysis against the non-propositional challenge posed by Adams.
