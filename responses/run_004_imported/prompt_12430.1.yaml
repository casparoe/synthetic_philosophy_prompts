      *   **Secondary Move:** The user wants to argue that Paulina Sliwa's (2016) knowledge-based amendment fails to fix this.
      *   **Conclusion:** The user wants to argue that only Nomy Arpaly's (2003) account (substantive responsiveness) succeeds.
      *   **Constraint:** Steel-man Markovits and Sliwa (don't strawman them).
      *   **Goal:** Stress-test the central move (argue *for* the user's worry that this is a decisive problem).

  2.  **Deconstruct the Positions:**
      *   **Michael Smith (1994):** The "Moral Fetishism" objection. Good moral agents shouldn't be motivated by "rightness" (de dicto) but by the features making it right (de re). If they are motivated by rightness, they are moral fetishists.
      *   **Julia Markovits (2010):** *Coincident Reasons Thesis (CRT).* An action has moral worth iff the agent's motivating reasons coincide with the normative reasons justifying the action. She tries to avoid Smith's fetishism charge by removing the need for a *belief* about rightness.
      *   **The User's Worry (The "Wirehead" Objection):** CRT allows an agent who acts for the right reasons (e.g., helping because it helps) but *only* because they are causally wired to do so, without any moral concern or understanding. This looks like a "reliable machine" or a "happy natural," not a virtuous moral agent.
      *   **Paulina Sliwa (2016):** *Moral Knowledge Account.* Moral worth requires acting from moral knowledge (knowing *why* it's right). This adds a cognitive element to CRT.
      *   **Nomy Arpaly (2003):** *Unprincipled Virtue.* Moral worth comes from responsiveness to moral reasons. It's about the quality of the concern, not necessarily explicit reasoning or knowledge claims. It handles the "wirehead" case by demanding a specific kind of responsiveness that implies a connection to the agent's evaluative perspective.

  3.  **Steel-manning Markovits (CRT):**
      *   *Why does she propose CRT?* To save the intuition that acting for the right reasons matters without falling into Smith's trap of requiring a de dicto desire for duty.
