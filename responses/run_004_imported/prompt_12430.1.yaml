      *   *Strategy:* The user's dissertation move is to argue that Markovits is *wrong* to accept the Happy Natural. The "indistinguishability" is a problem *for us* (the theorists) who think moral worth requires moral concern. So I must argue that the inability to distinguish is a failure of the theory to capture the concept of *moral worth* (which implies praiseworthiness of the character/will).
      *   *Sliwa:* She explicitly tries to rule out some luck cases. Does she rule out the wirehead? She requires "moral knowledge." If the wirehead lacks concepts, they lack knowledge. But what if they have concepts but no care?
