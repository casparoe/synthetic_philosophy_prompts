      *   *Potential Pitfall:* Don't make Ghazālī sound like a occasionalist who denies *all* regularity. He affirms regularity as God's habit. Don't make Hume sound like a metaphysician. He's not.
      *   *Refining the Ibn Rushd point:* Ibn Rushd argues that without essential natures, knowledge is impossible. For Hume, knowledge *is* just constant conjunction. So Ibn Rushd's definition of "science" (knowledge of causes/essences) is what Ghazālī threatens. Hume would agree with Ibn Rushd that Ghazālī destroys *Aristotelian* science, but Hume doesn't care because he rejects Aristotelian science anyway. Thus, the critique is devastating for Ghazālī (who wants to preserve a meaningful world created by a wise God) but moot for Hume.

