answer: |-
  Here are 10 interview questions designed to move beyond the introductory material and press on the philosophical vulnerabilities and implications of the parity view. Each includes a follow-up calibrated to the guest's likely defense.

  ### 1. The Phenomenology of "Hardness"
  **Question:** In your TED talk, you distinguish hard choices from easy ones by the failure of the "better, worse, equal" framework. But psychologically, the *feeling* of a hard choice often comes from uncertainty or lack of information. If I knew everything about the lawyer career and the artist career, wouldn't the choice dissolve? Are you describing a metaphysical feature of the world, or just the limits of human epistemic access?

  **Follow-up:** "You'll likely say the hardness remains even with full information. But if the agent has full information and the options are 'on a par,' what is left to deliberate *about*? If reason can't tell me which is better, aren't we just waiting for an emotional coin flip?"

  ### 2. The Small-Improvement Argument & Intuition
  **Question:** I want to press on the Small-Improvement Argument. The claim is that if Career A and Career B were equal, a slightly improved A+ would be better than B. But when we imagine A+, our intuition says, 'A+ is still not clearly better than B.' A skeptic might argue this doesn't prove a fourth relation; it just proves our evaluative intuitions are coarse-grained. We can't detect the tiny shift in value, so we assume parity where there is actually a microscopic 'betterness.' Why trust the intuition over the logic of transitivity?

  **Follow-up:** "But if you rely on the reliability of these specific intuitions to prove parity, don't you have to explain why our intuitions fail in *other* value contexts? It feels like we're building a new metaphysical relation on top of what might just be cognitive noise."

  ### 3. Parity vs. Vagueness (The Broome Objection)
  **Question:** John Broome has argued that we don't need a fourth relation to explain hard choices. He suggests the 'betterness' relation is simply vague. In a hard choice, it's neither true nor false that A is better than B, just as it's neither true nor false that a specific grain of sand makes a heap. Why should we posit a robust, distinct relation of 'parity' rather than accepting Broome's view that 'better' just has fuzzy boundaries?

  **Follow-up:** "Your response is usually that vagueness implies indeterminacy, whereas parity is determinate. But ontologically, isn't 'parity' expensive? If vagueness can do the explanatory work without multiplying entities, what specific work is 'parity' doing that vagueness *can't*?"

  ### 4. Raz and the Value of Incommensurability
  **Question:** Joseph Raz argues that incommensurability is actually a feature, not a bug. He suggests that if every choice were rationally comparable, there would be no room for autonomy—we'd just be calculators. By claiming options are 'on a par,' you seem to be saying they *are* comparable after all. Are you risking the very autonomy Raz wants to protect by insisting reason can still grasp these choices through parity?

  **Follow-up:** "So you're saying parity *preserves* rationality where Raz thinks it ends. But doesn't that place a heavy burden on the agent? If reason says they are on a par, but I still have to choose one, does that make the choice *more* anxious, not less, because I can't blame 'incomparability' for my struggle?"

  ### 5. Commitment and the "Arbitrary Leap"
  **Question:** Let's talk about your solution to hard choices: normative power. You argue we can commit to an option and thereby create reasons that didn't exist before. Critics might say this sounds suspiciously like Isaiah Berlin's existentialist view—that hard choices are tragic, arbitrary leaps of will. By calling it 'creating reasons,' are you just branding the 'arbitrary leap' with nicer, more rationalist clothing?

  **Follow-up:** "You distinguish 'arbitrary' from 'will-based.' But if the reasons are created *by* the choice, they can't justify the choice *before* it happens. So, in the moment of decision, isn't it still a leap? How is that phenomenologically different from the tragedy Berlin describes?"

  ### 6. Discovering vs. Making Reasons
  **Question:** Following up on that: In standard decision theory, we discover reasons that are already there. In your view, we *make* reasons. Does this imply that two different people facing the exact same hard choice could rationally come to opposite conclusions, not because of different values, but just because they 'willed' different reasons into existence?

  **Follow-up:** "If that's the case, does this undermine the idea of objective value? If I can will reasons into existence for the risky career, and you can will them for the stable one, is value still 'out there' in the world, or is it becoming dependent on the agent's activity?"

  ### 7. The Rationality of Regret
  **Question:** If two options are truly 'on a par,' and I choose one, does it make sense to feel rational regret? If neither was better, then the road not taken wasn't 'better' than the one I took. Does your theory imply that regret in hard choices is always an error of reasoning?

  **Follow-up:** "But regret is such a pervasive part of the hard choice experience. If you tell listeners that regret is irrational because the options were on a par, aren't you dismissing a crucial part of the moral psychology of decision-making? Is there room for 'agent-regret' even if the choice was rational?"

  ### 8. The Persistence of the Trichotomy
  **Question:** You argue against the Trichotomy Thesis (that only better, worse, and equal exist). But this thesis has dominated philosophy and economics for centuries. Why do you think we are so cognitively wedded to the trichotomy? Is it a linguistic limitation, or is there an evolutionary advantage to thinking in threes?

  **Follow-up:** "If it's linguistic, can we actually train ourselves to think in terms of parity? Or will we always, by default, try to force hard choices into 'equal' or 'incomparable' boxes because 'on a par' doesn't come naturally to human cognition?"

  ### 9. Moral vs. Prudential Parity
  **Question:** Most of your examples are prudential: career paths, where to live, partners. Does parity hold in the moral realm? If I'm choosing between donating to a charity that saves lives versus one that alleviates suffering, can those be 'on a par'? Or does introducing morality force a 'better/worse' ranking that prudence doesn't?

  **Follow-up:** "If moral options can be on a par, doesn't that worry people? It suggests there isn't always a single morally optimal action. Does parity risk giving people a 'get out of jail free' card to choose the morally easier option by claiming it's 'on a par' with the harder one?"

  ### 10. The Practical Upshot
  **Question:** For the listener agonizing over a hard choice right now: knowing that options are 'on a par' is intellectually interesting, but how does it change the *process* of choosing? Does it tell me to gather more data, or to stop gathering data and start willing?

  **Follow-up:** "So the advice is to stop looking for the 'right' answer externally and start building the right answer internally. But isn't there a danger there of solipsism? How do I know I'm not just rationalizing a bad choice by claiming I'm 'creating reasons' for it?"
