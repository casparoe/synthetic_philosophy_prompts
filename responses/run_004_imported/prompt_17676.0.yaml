prompt: |-
  I'm putting together a podcast miniseries on the philosophy and psychology of decision-making, and this week I'm recording with a philosopher who's built her career defending the idea that some hard choices -- the kind where you agonize between two really different paths, like a stable career versus a riskier one you love more -- aren't actually cases of the options being secretly equal, or being incomparable apples and oranges. Her claim is that theres a distinct fourth relation beyond better/worse/equal, which she calls being "on a par," and that this is whats really going on in the hardest choices we face. I've read through her papers on the small-improvement argument and the "trichotomy thesis" she's arguing against, and watched the TED-talk version about a dozen times prepping for this, but I really don't want the interview to just be her restating the parity idea for twenty minutes since anyone can google that part.

  Could you draft me 8-10 interview questions, each paired with a sharp follow-up keyed to whatever answer she's most likely to give? I definitely want one question that pushes on whether "parity" is really a new metaphysical relation or just a relabeling of what John Broome called vagueness in the betterness relation, and why we should believe it's the former rather than the latter. I also want one on the small-improvement argument itself -- couldn't a skeptic just say our intuitions about the "improved" option are too coarse to trust, rather than proof of a genuine fourth relation? And one on her idea that we can "commit" to an option and thereby create reasons for ourselves that didn't exist before, because that move sounds suspiciously like it's smuggling back in the old Berlin-style picture of hard choices as arbitrary, tragic leaps, just with nicer branding. If there's room, throw in a question that gets her to engage with Joseph Raz's take that incommensurable values are actually a good thing, since they're what make room for autonomous choice in the first place, rather than a defect her theory needs to explain away.
