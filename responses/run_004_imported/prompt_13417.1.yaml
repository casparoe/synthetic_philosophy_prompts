answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct privilege of being Priya's friend.

  Now, for half of you in this room, the fact that I'm standing here is a statistical miracle. Because last weekend, Priya and I nearly ended our friendship over a wedding budget spreadsheet.

  Priya refused to simply "split the difference" with her fiancé. And when I suggested that meeting in the middle is the definition of compromise, she looked at me with the kind of pity usually reserved for undergraduates and said, "No. Meeting in the middle is lazy. Real fairness is about preserving the ratio of our potential."

  She was arguing for a specific concept in game theory. And while I'm not going to draw any diagrams on the tablecloth tonight, I think she was onto something profound about marriage.

  There is a classic way to think about agreements. It says: "You give a little, I give a little. We meet in the middle." It's safe. It's symmetrical. But sometimes, meeting in the middle means we both settle for half of what we truly need. It assumes that love is about shrinking yourselves to fit the space between you.

  Priya argued for something else. A solution that says: Look at where you started. Look at the absolute best, wildest, most optimistic version of what each of you could hope for in this life. Now, draw a straight line between who you are and who you could be.

  The goal of a marriage, in this view, isn't to cut your dreams in half so they match. The goal is to ensure that you are both traveling up that line together. It means that when life changes—and it will—you don't renegotiate who you are from scratch. You don't ask one person to sacrifice a larger percentage of their happiness just to keep the peace.

  If the ceiling raises for one of you, the other doesn't pull them down to meet in the middle. You both rise. If the room gets smaller, you both scale back your expectations by the same proportion. You protect each other's share of the possible.

  To the economists in the room: Yes, I know. I'm talking about Individual Monotonicity. I know that Priya prefers the Kalai-Smorodinsky solution because it respects the shape of the feasible set without violating the proportionality of gains. You can stop checking my work; I got the intuition right.

  But to the parents, the grandparents, and the friends who just want to eat cake: What this actually means is much simpler.

  It means that Priya and [Fiancé's Name] have promised not to just compromise on who they are. They have promised to look at each other's highest hopes and say, "I want you to have as much of that as I have of mine."

  It means that when life gets hard, they won't keep score of who sacrificed more. They will just make sure they are both still moving in the same direction. And when life gets good, they won't worry that one is shining brighter than the other. They will know that the light is hitting them both equally.

  Priya, you taught me that fairness isn't about splitting the difference. It's about keeping the ratio of your dreams alive, no matter where the line lands.

  [Fiancé's Name], you've shown us that you're ready to walk that line with her.

  So, if everyone could please raise a glass.

  To Priya and [Fiancé's Name]. May your disagreements be short, may your feasible sets always expand, and may you always, always preserve each other's share of the best possible life.

  To the happy couple!
