answer: |-
  You have stumbled onto one of the most famous problems in the philosophy of causation and legal theory. Your intuition that something is wrong with the "neither of us caused it" conclusion is correct, and your analogy about the two factories is spot-on. In philosophy, this is known as **symmetric overdetermination**.

  The short answer is: **Yes, both you and Riley caused the grade to drop.** The reasoning that suggests "neither" of you caused it relies on a definition of causation that is too narrow to handle situations where there are multiple sufficient causes.

  Here is the breakdown of why Riley's argument fails, where the logic traps you, and how philosophers resolve it.

  ### 1. The Trap: The "But-For" Test
  Riley's argument relies on what is called the **"but-for" test** (or *sine qua non* causation). This is the standard common-sense definition of cause: *X caused Y if, but for X, Y would not have happened.*

  Let's apply it to your situation:
  *   **Test for Riley:** But for Riley's factual error, would the grade have dropped? **Yes**, because your citations were missing. Therefore, under this test, Riley's error was not a cause.
  *   **Test for You:** But for your missing citations, would the grade have dropped? **Yes**, because Riley's factual error existed. Therefore, under this test, your citations were not a cause.

  If you accept the "but-for" test as the *only* definition of causation, you are forced into the absurd conclusion that the grade dropped without a cause. This is the paradox of overdetermination: two events occur, either of which alone would have been sufficient to bring about the result, and the result occurs.

  ### 2. The Solution: The NESS Test
  To solve this, legal theorists (like H.L.A. Hart and Tony Honoré) and philosophers (like Richard Wright) developed a more robust standard called the **NESS test**: **N**ecessary **E**lement of a **S**ufficient **S**et.

  This asks: Was the action a necessary part of a *set* of conditions that was sufficient to cause the outcome?

  *   **Riley's Error:** Consider the set of conditions {Riley's Factual Error, Teacher's Grading Policy}. This set is sufficient to drop the grade. Riley's error is a *necessary element* of that specific set (you can't have that set without the error). Therefore, Riley's error is a cause.
  *   **Your Citations:** Consider the set of conditions {Your Missing Citations, Teacher's Grading Policy}. This set is *also* sufficient to drop the grade. Your missing citations are a *necessary element* of that set. Therefore, your citations are a cause.

  Under the NESS test, causation is not a zero-sum game. There isn't one single slot labeled "The Cause" that only one of you can occupy. Both of your mistakes were independent, sufficient triggers for the penalty. The fact that the other trigger was also pulled does not disarm yours.

  ### 3. Why Riley's Argument is Flawed
  Riley is arguing that because your mistake didn't change the *outcome* in this specific instance (the grade dropped anyway), it didn't *cost* anything. This confuses **marginal impact** with **causal responsibility**.

  Imagine you and Riley are both pushing a stalled car. It only takes one person to push it fast enough to get it started, but you both push anyway. The car starts.
  *   Riley says: "My push didn't matter; the car would have started with just yours."
  *   You say: "My push didn't matter; the car would have started with just yours."

  In reality, both of you exerted force. Both of you contributed to the motion. If you had both decided not to push, the car wouldn't have moved. In your project, if you had *both* done perfect work, the grade would not have dropped. Since each of you independently failed to meet the standard required to save the grade, you are both causally responsible for the failure.

  ### 4. The "First Noticed" Fallacy
  Your first friend's suggestion (that whoever was noticed first is the cause) tries to solve the problem by introducing time. However, as you noted, this is arbitrary. Causation in this context is about the *state of the paper* when it was submitted, not the order in which the teacher's eyes scanned the page. The penalty condition was met the moment the paper was handed in, because both conditions (A and B) were present simultaneously.

  ### 5. How to Resolve the Disagreement
  You can explain to Riley that causation isn't about being the *unique* difference-maker; it's about being a *sufficient* breaker of the rules.

  *   **Riley is right that:** The grade would have dropped even if you had fixed your citations.
  *   **Riley is wrong that:** This means your citations "didn't cost anything."

  Your missing citations *did* cost the letter grade in the possible world where Riley did their job correctly. You cannot evaluate the "cost" of your mistake solely based on the luck that Riley also made a mistake. If you want to assess responsibility, you have to look at the risk each of you introduced to the project. You both introduced a risk that was sufficient to fail the criterion.

  ### Summary
  The reasoning that leads to "neither of us caused it" goes wrong by assuming that for something to be a cause, it must be **necessary** for the outcome in the actual world. In overdetermination cases, causes are not necessary (because the other one would have done the job), but they are still **causally efficacious**.

  **The Verdict:** You both caused the grade drop. The penalty was triggered by a logical "OR" gate (Error OR Citations). When both inputs are "True," the output is "True." You cannot say one input is "more True" than the other. You share the responsibility equally, not because we need to split the difference to keep the peace, but because logically, both of your actions satisfied the condition for the penalty.
