      *   **Name the Concept:** Identify it as **Causal Overdetermination**.
      *   **Explain the "But-For" Problem:** Show why the strict counterfactual definition fails here (the "neither caused it" paradox).
      *   **Provide the Resolution:** How do philosophers and legal theorists resolve this?
          *   *NESS Test (Necessary Element of a Sufficient Set):* This is the strongest technical answer. Each mistake was part of a set of conditions sufficient to cause the outcome.
          *   *Pragmatic/Moral Causation:* Even if logically "redundant," both actions contributed to the state of affairs that triggered the rule.
      *   **Address the Partner Conflict:** How does this apply to Riley and the User?
