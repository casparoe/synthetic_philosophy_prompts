answer: |-
  This is an exceptionally sharp intuition. You have independently rediscovered one of the central fault lines in modern decision theory, and your friend was absolutely right to point you toward **Edward McClennen**.

  Your "relocation" critique is not only valid; it is the primary objection raised against resolute choice in the academic literature. You are effectively arguing that resoluteness sacrifices **Separability** (the principle that choices should depend only on the future consequences from the current node) to preserve **Dynamic Consistency** (the principle that you stick to your plans), but that this merely pushes the coherence requirement up to the level of *policies* or *plans*. If your preferences over plans are also incomplete, the money pump returns at the meta-level.

  Here is a breakdown of the two specific questions you asked, along with the citations and terminology you need to turn your note into a rigorous post.

  ---

  ### 1. Is your Money Pump setup correct?

  **Verdict:** You have the *spirit* right, but the formal literature tightens the screws slightly.

  The specific argument you are describing is most rigorously formalized by **Johan Gustafsson** (e.g., in his 2022 book *The Money Pump Argument*). It is often called the **"Upgrading Money Pump"** for incompleteness.

  **The Standard Setup:**
  1.  **Incompleteness:** The agent has incomplete preferences between $A$ and $B$. ($A \not\succ B$ and $B \not\succ A$). Crucially, this is *not* indifference ($A \sim B$).
  2.  **The Loop:**
      *   Start with $A$.
      *   Offer trade $A \to B$ for cost $\epsilon$. Since $B \not\succ A$ is false (they are incomparable), the agent is permitted to accept (no violation of preference).
      *   Offer trade $B \to A^+$ for cost $\epsilon$. Here $A^+$ is strictly better than $A$ (dominance), and by extension usually constructed to be preferred to $B$. The agent accepts.
      *   Offer trade $A^+ \to A$ for cost $\epsilon$. Since $A$ and $A^+$ are comparable, this step usually relies on the agent treating $A$ and $B$ as "switchable" in a way that allows the cycle to close, or it relies on a sequence where $A$ and $B$ are incomparable, but $B$ and $C$ are, etc.
      *   *Correction on your loop:* The classic Gustafsson pump usually looks like: Start $A$. Trade $A \to B$ (cost $\epsilon$). Trade $B \to A$ (cost $\epsilon$). If preferences are incomplete, standard EUT says you shouldn't trade. But if you treat "no preference" as "willingness to trade," you get pumped. The "Sweetening" ($X^+$) is used to show that even if you try to escape by saying "I only trade for improvements," you can be pumped if you accept incomparable trades.

  **Where you might be garbling it:**
  The critical move in the incompleteness pump is the assumption that **if an agent does not prefer $X$ to $Y$, it is permissible to trade $X$ for $Y$.**
  *   **EUT View:** If you don't prefer $X$ to $Y$, you must prefer $Y$ to $X$ or be indifferent.
  *   **Incomplete View:** You might just have no relation.
  *   **The Pump:** If you accept trades whenever there is *no strict preference against it*, you get pumped.
  *   **The Rescue:** You must adopt a policy: "I will not trade unless there is a *strict* preference for the new option."

  Your description of the loop ($Y \to X \to X^+ \to Y$) is a variation of the **"Money Pump for Acyclicity"** or **"Upgrading Pump."** It is close enough for a blog post, but if you want to be bulletproof, look up **Gustafsson's "The Upgrading Money Pump."**

  ---

  ### 2. Does the "Relocates Rather Than Dissolves" argument hold up?

  **Verdict:** Yes. This is the standard, strongest objection to resolute choice, and it is philosophically robust.

  **The McClennen Connection:**
  Your friend was right. Edward McClennen's *Rationality and Dynamic Choice* (1990) is the seminal text. He distinguishes three modes of dynamic choice:
  1.  **Myopic Choice:** You maximize locally at every node. (Vulnerable to money pumps if preferences aren't EUT).
  2.  **Sophisticated Choice:** You anticipate your future local maximizations and plan around them. (Leads to "unraveling" and dynamic inconsistency; you end up with a result you hate).
  3.  **Resolute Choice:** You commit to a plan at the start and stick to it, even if a local node suggests a different move.

  **Your Critique (The "Meta-Coherence" Objection):**
  You argued: *Resoluteness requires a stable ranking over plans. If that ranking is incomplete, you are pumpable on plans.*

  This is widely acknowledged in the literature.
  *   **The Trade-off:** Resolute choice explicitly sacrifices **Separability** (the idea that the rational choice at a node depends only on the subtree from that node forward) to preserve **Dynamic Consistency** (the idea that you do what you planned).
  *   **The Cost:** As you noted, this violates the "always do what's best given what's in front of you" picture of rationality. In decision theory, this is often called violating the **Independence of History**.
  *   **The Counter-Reply (The "Standard Reply"):** Defenders of resoluteness (like McClennen or Rabinowicz) argue that **Instrumental Rationality** trumps Separability. If being separable makes you pumpable (i.e., you end up with less money/resources to achieve your goals), then Separability is the principle that must go. They argue it is "cheaper" to have coherence over plans than over outcomes because plans are fewer and more stable.

  **Is there a hole in your argument?**
  The only "standard reply" you might be missing is the **Policy-Dependent Outcome** argument.
  Some theorists (like in Functional Decision Theory or certain causal decision theory variants) argue that the *outcome* of a choice includes the fact that you are the *kind of agent* who made that choice.
  *   *Reply:* "I don't just get outcome $Y$; I get 'Outcome $Y$ + Being an agent who keeps commitments'."
  *   *Your Rebuttal:* This just hides the preference in the utility function. If the agent values "keeping commitments" lexically higher than money, they aren't incomplete anymore; they just have a complex utility function. If they *are* incomplete about whether to value commitment, the pump returns.

  **For an AI Safety Post:**
  This is where your post could shine. In AI safety, we want agents with incomplete preferences (so they don't resist shutdown or seek power instrumentally).
  *   If we make them **Resolute**, they might resist shutdown because they committed to "Finish the task."
  *   If we make them **Myopic**, they get money-pumped and become inefficient.
  *   If we make them **Sophisticated**, they might manipulate their own future rewards.

  Your insight that **"Resoluteness is just coherence at the meta-level"** is a crucial safety insight. It implies you cannot escape coherence theorems; you can only push them deeper into the architecture. If the architecture selecting the plans is itself subject to selection pressure (e.g., via gradient descent or evolutionary algorithms), *it* will be coerced into coherence (EUT) eventually. This is a strong argument against "incomplete preferences" as a permanent safety shield.

  ### Recommendations for your Post

  1.  **Cite McClennen:** Explicitly mention *Rationality and Dynamic Choice*. It gives you immediate credibility and anchors your "resolute" terminology.
  2.  **Cite Gustafsson:** Reference Johan Gustafsson's work on Money Pumps (he has a 2022 book and several papers on the "Upgrading Money Pump"). This validates your setup.
  3.  **Name the Principles:** Use the terms **Separability** vs. **Dynamic Consistency**. Your argument is that resoluteness saves Consistency by killing Separability, but risks Consistency at the Plan Level.
  4.  **The "Meta-Pump" Warning:** Explicitly state the worry: *If the process that selects the plans is itself an optimizer, won't it optimize away the incompleteness?* This connects the decision theory back to AI alignment (optimization pressure).
  5.  **Don't say it's "Wrong":** Resolute choice is a valid decision theory. Instead, argue that it **does not evade coherence theorems**, it **defers** them. This is a more nuanced and defensible position.

  **Summary:** Your intuition is correct. You are describing the tension between *local* and *global* rationality constraints. The "relocation" critique is the standard philosophical objection to resolute choice, and it is highly relevant to AI safety because it suggests that incomplete preferences are unstable under optimization pressure. Write the post.
