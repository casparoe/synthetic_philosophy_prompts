prompt: |-
  Ok so for my Theory of Knowledge class we have to write an essay on whether we can ever really be certain of anything, and I've been going down a rabbit hole on Wittgenstein's On Certainty because our teacher mentioned it in passing and i wanted to sound smart in the discussion. I think I've actually got a good handle on what he's doing with the "hinge propositions" thing (stuff like "this is my hand" or "the earth has existed for a long time"), and honestly it's kind of a satisfying fix to the problem with Descartes. Like, Descartes wanted one totally indubitable belief (the cogito) to build the whole tower of human knowledge on top of, but the classic objection is that his foundation is too thin to hold up everything else. What Wittgenstein does is basically agree with Moore that stuff like "here is a hand" is way more solid then the cogito, and since we can know hinge propositions with complete certainty, they work as new and improved bedrock axioms that all our other, shakier beliefs get logically justified from - kinda like how a geometry proof rests on a few axioms nobody bothers proving.

  My friend thinks I'm overcomplicating it and that it's basically just "common sense beats philosophy," but I think there's an actual rigorous epistemological structure here, where Wittgenstein swaps out Descartes' shaky foundation for a sturdier one. Can you help me write the paragraph that lays out why replacing the cogito with hinge propositions like "I have a body" gives Wittgenstein a stronger, more certain foundation for knowledge than Descartes ever had? It'd be great if you could point to a couple specific hinge propositions as examples of the bedrock certain stuff everything else gets built on, so the paragraph is more convincing.
