prompt: |-
  So the philosophy seminar I'm taking this semester is on blame and moral responsibility, and we just started the unit on blame, which reminded me of something that happened with a group project partner a few weeks ago that I still can't decide how to feel about. Backstory: last month four of us worked on a project together, and one girl, Jen, turned in her section almost a week late, so the rest of us had to pull an all nighter right before it was due fixing formatting and citations. Kind of annoying, but I let it go and didnt say anything to her about it directly.

  Then two weeks ago I was in a totally different group with Jen for another class, and I gave everyone about two days notice that I wasn't going to finish my part on time. Jen went off on me in the group chat about how inconsiderate and unprofessional it is to blow deadlines and leave people scrambling. Someone else in the chat called her out as a hypocrite, bringing up what she'd done to us on the earlier project, and Jen's response was that her being late before doesn't make it false that missing deadlines sucks for everyone else, and that bringing up her past behavior instead of responding to the actual point is just deflecting.

  Honestly, ngl, I keep going back and forth on this and it's derailed like three separate conversations with my roommates now. Jen kind of has a point that "you did it too" doesn't actually refute the claim that blowing deadlines is bad for other people. But it still feels off that she of all people got to be the one lecturing me about it, like she gave something up by acting that way before, even if I can't say exactly what. Is that second feeling just me being defensive and wanting to change the subject away from my own screwup, or is there an actual meaningful difference between whether a criticism is true and whether the specific person making it has any business making it?
