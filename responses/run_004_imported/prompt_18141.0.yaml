      *   **Tone:** Analytical, educational, empathetic to the confusion (since the course was more abstract than expected), and clear.

  2.  **Deconstruct the Game Theory:**
      *   **Payoff Matrix (Player 1 / Us):**
          *   Rows: B, M, W
          *   Cols: E (Expand), H (Hold Steady)
          *   Values:
              *   B: (0, 3)
              *   M: (1, 1)
              *   W: (3, 0)
      *   **Concept:** Strict Dominance. A strategy $S$ is strictly dominated if there exists another strategy (pure or mixed) $S'$ such that $Payoff(S') > Payoff(S)$ for *all* opponent strategies.
      *   **Leah's Claim:** Mix $0.5B + 0.5W$.
          *   If Rival E: $0.5(0) + 0.5(3) = 1.5$.
          *   If Rival H: $0.5(3) + 0.5(0) = 1.5$.
