          *   Middle-of-the-Road (M): 1 if Rival Holds (H), 1 if Rival Expands (E).
      *   **The Rule:** "Iterated Elimination of Strictly Dominated Strategies" (IESDS), but specifically allowing for *mixed strategies* (randomized combinations) to dominate pure strategies.
      *   **The Debate:**
