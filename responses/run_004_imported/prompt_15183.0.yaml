answer: |-
  **Title:** The Ghost in the Genome: Why History, Not Activity, Defines Biological Function

  **Introduction**

  You remember the room. You remember the coffee. And you certainly remember the whiplash. When the ENCODE consortium announced in 2012 that 80% of the human genome was "functional," it felt less like a discovery and more like a category error. As you noted, the rebuttal from Dan Graur and the evolutionary biology community was swift and brutal. They argued that biochemical activity—transcription, binding, chromatin modification—is not synonymous with function. A car engine makes noise, heat, and vibration, but only the rotation of the crankshaft is functional. The rest is just physics happening.

  That fight was not merely a dispute over data; it was a collision between two distinct philosophical frameworks that had been simmering since the 1970s. On one side, the ENCODE team implicitly adopted a **Causal Role (CR)** account of function, akin to Robert Cummins' 1975 formulation. On the other, Graur and his allies wielded the **Selected Effects (SE)** account, rooted in Larry Wright's 1973 work and refined by Karen Neander.

  For decades, the standard philosophical peace treaty has been pluralism: "CR is for physiology, SE is for evolution; both are useful." But as you have rightly sensed in your library group, this truce is unsatisfying. It leaves the word "function" dangerously ambiguous, allowing headlines to claim that junk DNA is alive with purpose when it is merely alive with noise. If we want to know what biological function *really* is—not just how we speak loosely about it—we must choose.

  The Causal Role view is intuitive for mechanistic explanation, but it fails to capture the normative core of biology. The Selected Effects view is historically demanding, but it is the only account that explains why organisms are not just complex machines, but *adapted* systems. Therefore, the correct position is this: **The Selected Effects account is the only valid definition of biological *function*. The Causal Role account describes biological *activity*, but conflating the two leads to the exact scientific confusion we saw with ENCODE.**

  **The Allure and Failure of Causal Role**

  To understand why the ENCODE consortium made their claim, we must steelman the Causal Role view. Cummins argued that to ascribe a function to a component is simply to explain how that component contributes to a capacity of the containing system. If I ask, "What is the function of the heart?" a CR theorist says, "To pump blood," because that is the causal contribution the heart makes to the circulatory system's capacity to transport oxygen.

  This matches the day-to-day intuition of working biologists. When a molecular biologist studies a promoter region, they want to know what it *does* (binds polymerase), not necessarily the deep evolutionary history of why it was preserved. It is ahistorical and mechanistic. It feels clean.

  However, the CR view collapses when faced with the problem of **malfunction**. This is the fatal flaw. If function is defined strictly as the *actual* causal contribution a trait makes to a system, then a broken heart that no longer pumps blood has, by definition, lost the function of pumping blood. It is now performing the function of "leaking fluid" or "sitting inertly."

  But this contradicts biological reality. When a patient suffers heart failure, we do not say the heart has lost its function; we say it is *failing at* its function. There is a norm here, a standard of correctness that the organ is failing to meet. The CR view is value-neutral; it describes what *is* happening. Biology, however, is inherently normative; it is concerned with what *should* happen for the organism to survive. A definition of function that cannot distinguish between a working valve and a broken one is not a definition of function; it is merely a description of current causality.

  **The Strength of Selected Effects**

  The Selected Effects (SE) account solves the normativity problem by anchoring function in history. On this view, the function of a trait is the effect for which it was naturally selected. The heart pumps blood *because* ancestral hearts pumped blood, and that pumping conferred a survival advantage that caused the trait to be retained.

  This handles malfunction effortlessly. A diseased heart still possesses the function of pumping blood because its etiology remains unchanged. It was selected for pumping, even if it currently fails to do so. The "ought" is derived from the "was."

  This is precisely why Dan Graur's rebuttal to ENCODE was scientifically superior. By claiming 80% of the genome was functional based on biochemical activity, ENCODE was using the CR definition. They found DNA that *did* things. Graur argued that unless that DNA showed signs of evolutionary constraint—evidence that natural selection had acted to preserve it against mutation—it was merely biochemical noise. It was the genomic equivalent of the heat coming off an engine. It was a causal byproduct, not a selected effect.

  If we accept the SE view, the ENCODE headline vanishes. We can acknowledge that 80% of the genome is *biochemically active* without granting it the teleological status of being *functional*. This precision matters. If we tell the public and funding agencies that "junk" DNA is actually functional, we misdirect research toward trying to find the adaptive purpose of noise.

  **Addressing the Hard Cases: Mutations and Exaptations**

  You raised the two standard objections to the SE view that keep philosophers awake at night: the problem of new mutations and the problem of exaptation. If function requires selection history, does a brand-new beneficial mutation have zero function until it spreads? And what about feathers, which were selected for insulation before they were co-opted for flight?

  These are not bugs in the SE system; they are features that clarify our understanding of evolutionary time.

  Regarding the **new mutation**: Strictly speaking, the SE theorist must admit that a brand-new mutation does not yet have an "etiological function." It has a *beneficial causal role*. It is in the process of *becoming* functional. This distinction is biologically precise. Many new mutations arise and vanish; they are transient causal events. Only those that are fixed by selection earn the title of "function." To say a new mutation has immediate function is to assume the outcome of selection before it happens. The SE view forces us to acknowledge that function is a status conferred by the evolutionary process, not an intrinsic property of the molecule.

  Regarding **exaptation (feathers)**: The SE view handles this by allowing for function shifts. The "function" of proto-feathers was insulation (the effect for which they were originally selected). Once they were co-opted for flight, a new selection pressure began acting on them. Over time, as lineages with flight-capable feathers outcompeted others, the etiological function shifted. We can speak of the *original* function and the *current* function, provided we acknowledge the historical transition. This is far more precise than the CR view, which would simply say feathers contribute to flight now, erasing the historical reality that they did not evolve *for* flight initially. The SE view preserves the historical narrative that is central to biology.

  **Why We Must Commit to Selected Effects**

  So, why reject the pluralist compromise? Why not say CR is for biochemists and SE for evolutionists?

  Because "function" is a theoretical term with a specific job to do in biology. Its job is to distinguish the adapted from the incidental. If we allow the Causal Role definition to stand as a valid type of "function," we legitimize the ENCODE error. We allow the concept to become so bloated that it includes every biochemical interaction, rendering the distinction between design and noise impossible.

  The Causal Role account is undeniably useful for explaining *mechanisms*. It tells us how the machine works. But it cannot tell us *what the machine is for*. Only the Selected Effects account can answer that. When a doctor explains insulin, they are indeed using a CR-style explanation of mechanism. But the reason they identify the pancreas as the *organ of insulin production* (rather than an incidental source of insulin) is because of its SE history.

  Therefore, we should commit to the **Selected Effects** view as the definition of true biological function. We should relegate the Causal Role view to the status of "causal contribution" or "activity."

  **Conclusion**

  The fight that broke out after the 2012 ENCODE paper was not just academic squabbling; it was a crisis of definition. It revealed that without a rigorous philosophical grounding, even elite scientists can conflate activity with purpose.

  The Causal Role view captures the immediacy of the lab bench, but it fails to capture the normativity of life. It cannot explain malfunction, and it cannot distinguish adaptation from noise. The Selected Effects view, grounded in the history of natural selection, captures the unique teleology of biology. It explains why a broken heart is still a pump, why feathers are for flight only after they were for warmth, and why most of our genome is likely silent junk despite the biochemical clamor.

  For your library group, the takeaway is this: We should not soften the definition of function to make it easier to use. We should sharpen it. Function is history. Everything else is just chemistry.
