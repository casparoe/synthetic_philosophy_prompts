          *   *Key 1738 Concept:* "Nemo sortem suam in discrimen vocare debet" (No one ought to call their fortune into peril). Specifically, one should not risk necessary subsistence.
          *   If "world welfare" includes the precondition of existence, risking destruction is risking the substrate of all utility.

