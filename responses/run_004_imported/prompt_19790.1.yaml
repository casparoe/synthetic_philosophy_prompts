  **Move (1): Score 2.**
  This is a canonical statement of the Selected-Effects (SE) account (à la Millikan or Neander). It correctly identifies the core commitment of etiological theories: functions are grounded in the history of natural selection that maintained the trait. There is no philosophical error here; it accurately sets the SE stall.

  **Move (2): Score 2.**
  Nadia correctly deploys the "novel trait" objection, which is widely regarded as the strongest counterexample to pure SE accounts. If a trait arises by mutation and immediately confers a survival advantage (like the toxin-flushing sweat), SE theorists struggle to ascribe it a *function* until a selection history accumulates. Her appeal to Cummins' Causal-Role (CR) theory is the standard alternative for handling current capacities.

  **Move (3): Score 2.**
  Owen accurately identifies the two classic vulnerabilities of CR theories: the indeterminacy of the "containing system" (why pick the thermoregulatory system over the signaling system?) and the loss of normativity (the inability to distinguish proper function from malfunction or mere causal contribution). The hyperhidrosis example effectively illustrates the malfunction problem.

  **Move (4): Score 1.**
  This move outlines the Biostatistical Theory (BST), associated with Boorse. It is a defensible and major position in the literature, attempting to naturalize normativity via statistical typicality within a reference class. However, it scores a 1 rather than 2 because the restriction to "systems bearing on survival and reproduction" is contentious without historical grounding, and the statistical definition of malfunction faces the "common disease" problem (if a pathology is universal, is it normal?).

  **Move (5): Score 2.**
  This is the "collapse argument," a potent critique in the literature. Owen argues that non-etiological attempts to fix CR indeterminacy (like Nadia's survival restriction) implicitly rely on historical facts to determine *which* survival-bearing effect is the *proper* function. If thermoregulation is privileged over odor signaling, it is typically because of the trait's lineage, not just its current statistics. This highlights the difficulty of grounding normativity without history.

  **Note on what is left out:**
  The exchange assumes a monist framework—that there is one single "correct" theory of function for all biological contexts. It leaves out **function pluralism** (e.g., Godfrey-Smith), which suggests SE and CR capture different legitimate senses of "function" (proper function vs. dispositional capacity). Additionally, it omits the **Organizational Account** (e.g., Mossio, Saborido), which attempts to ground normativity in the current self-maintaining closure of the system rather than history or statistics, potentially offering a third way to address malfunction without lineage.
