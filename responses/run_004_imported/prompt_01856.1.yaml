prompt: |-
  I sit on my state bar's character-and-fitness committee, which certifies that applicants possess the "good moral character" required for admission to practice law, largely on the strength of reference letters and a clean record. We recently split over a file: an applicant with a decade of spotless references had, on a single occasion years earlier, backdated a filing to meet a deadline at a previous job. A colleague sent me some of the situationist literature on virtue ethics afterward, arguing that cases like this are exactly what we should expect once we see how thin the evidence for stable "global" character traits really is — and now I can't tell whether our whole procedure rests on a philosophical mistake.

  Write a dialogue between a virtue ethicist and a situationist brought in to advise the committee on this case. Have the situationist build their argument on specific evidence — such as Doris's distinction between local and global character traits, and studies like Isen and Levin's "dime in the phone booth" experiment and Milgram's obedience experiments — and have the virtue ethicist respond with equal rigor, for instance by pressing, as Kamtekar does, that these studies target a much thinner notion of character than the one built into a genuinely Aristotelian account centered on practical wisdom. The two should engage directly with each other's arguments rather than restating their own positions, and the dialogue should end without either side simply conceding the point.
reasoning: |-
  Here's a thinking process that leads to the dialogue:

  1.  **Analyze the Request:**
      *   **Context:** A state bar character-and-fitness committee is split over an applicant who backdated a filing once but has otherwise spotless references.
      *   **Characters:** A Virtue Ethicist (VE) and a Situationist (S).
      *   **Task:** Write a dialogue where they advise the committee.
      *   **Key Arguments (Situationist):** John Doris's distinction between local/global traits, Isen & Levin's "dime in the phone booth" study, Milgram's obedience experiments. Argument: Stable global character traits don't exist; behavior is situation-dependent.
      *   **Key Arguments (Virtue Ethicist):** Response to situationism (e.g., Rachana Kamtekar), Aristotelian practical wisdom (*phronesis*), situationist studies target a thinner notion of character than virtue ethics requires.
      *   **Tone:** Rigorous, engaging, direct engagement (not talking past each other), no easy concession at the end.

  2.  **Character Conception:**
      *   **The Situationist (Dr. Aris Thorne):** Empirically minded, skeptical of metaphysical claims about "soul" or "essence," focused on predictive validity of behavior based on context.
      *   **The Virtue Ethicist (Prof. Elena Vance):** Philosophically grounded, focused on development, reasoning, and the holistic nature of moral agency. Not denying psychology but interpreting it differently.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. The committee has asked for input. Thorne (Situationist) starts by challenging the premise of "character."
      *   **Situationist Argument (The Attack):** Thorne brings up the specific case (the backdating). Connects it to the broader claim: one act doesn't define a global trait, but neither does a clean record.
          *   *Evidence:* Isen & Levin (helping behavior depends on finding a dime). Milgram (ordinary people hurt others under authority).
          *   *Doris's Point:* Global traits (Honesty*) vs. Local traits (Honesty-in-pressured-deadline-situations). The committee is looking for Global; the evidence only supports Local.
      *   **Virtue Ethicist Response (The Defense):** Vance acknowledges the psychology but challenges the philosophical interpretation.
          *   *Kamtekar's Point:* Virtue isn't just behavioral regularity; it's about *phronesis* (practical wisdom). The studies test reflexive or unreflective behavior, not deliberative moral agency.
          *   *Application:* The applicant's backdating wasn't a reflex; it was a choice. The references speak to a pattern of deliberation.
      *   **Situationist Rebuttal:** Thorne presses on the "clean record." If traits are local, ten years of good behavior in *those* situations doesn't predict behavior in *new* high-pressure situations (like legal practice).
          *   *Fundamental Attribution Error:* We overestimate personality, underestimate situation.
      *   **Virtue Ethicist Counter:** Vance argues that virtue is *developed* through navigating situations. The backdating incident might actually be evidence of growth if acknowledged.
          *   *Distinction:* Weakness of will (*akrasia*) vs. Vice. A single failure doesn't negate the hexis (state of character) if the agent learns.
      *   **Closing:** They agree on the complexity but disagree on the metaphysical underpinning of the committee's duty. No concession.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I include the "dime" study? Yes. Milgram? Yes. Doris? Yes. Kamtekar? Yes.
      *   *Check:* Are they talking *to* each other?
          *   *Risk:* VE just monologuing about Aristotle.
          *   *Fix:* Make VE explicitly reference Thorne's use of the studies. "You cite Milgram, but..."
      *   *Check:* Is the legal context present?
          *   *Fix:* Keep bringing it back to the applicant and the committee's decision.
      *   *Nuance:* Ensure the Situationist doesn't sound like a nihilist. They aren't saying "nothing matters," but "predictability is low." Ensure the VE doesn't sound dogmatic. They must accept empirical data but dispute the *conclusion* drawn from it.

  5.  **Drafting the Dialogue (Iterative Process):**
      *   *Start:* Thorne challenges the "global trait" assumption.
      *   *Middle:* The battle over the specific studies. Isen/Levin shows trivial situational factors matter. Milgram shows authority matters.
      *   *VE Pivot:* These studies don't capture *reasons*. Virtue is about reasoning.
      *   *S Counter:* Reasons are post-hoc rationalizations often.
      *   *End:* The impasse. Prediction vs. Evaluation.

  6.  **Polishing:**
      *   Ensure the tone is professional but intellectually sharp.
      *   Check that the specific philosophical references (Doris, Kamtekar, Isen/Levin, Milgram) are accurate in context.
      *   *Doris:* "Lack of Character." Global traits are empirically unsupported.
      *   *Kamtekar:* "Situationism and Virtue Ethics." Virtue ethics doesn't claim global consistency in the way situationists attack.
      *   *Isen & Levin:* 1972 study. Finding a dime increased helping behavior.
      *   *Milgram:* Obedience to authority.

  7.  **Final Review against constraints:**
      *   Dialogue format? Yes.
      *   Specific evidence included? Yes.
      *   Direct engagement? Yes.
      *   No concession? Yes.

  *(Self-Correction Note)*: Make sure the dialogue doesn't get too bogged down in jargon. Explain *phronesis* and "global traits" clearly within the flow of conversation. Ensure the applicant's specific act (backdating) remains the anchor.

  8.  **Final Polish:** (Proceeds to generate output based on these thoughts.)
answer: |-
  **Setting:** *A conference room adjacent to the State Bar's hearing chamber. The Character and Fitness Committee has recessed to consider the case of Applicant 409. Two external consultants sit across from one another: Dr. Aris Thorne, a moral psychologist and situationist, and Prof. Elena Vance, a philosopher specializing in Aristotelian ethics.*

  **Dr. Thorne:** Let's be blunt, Elena. The committee is paralyzed because they are looking for a ghost. They want to certify that Applicant 409 possesses "honesty" as a global character trait. They want to know if she is an *Honest Person*. But the empirical literature suggests there is no such thing.

  **Prof. Vance:** You mean the literature suggests we shouldn't reduce character to a simple behavioral prediction algorithm. There is a difference, Aris.

  **Dr. Thorne:** Is there? Look at the file. Ten years of spotless references, yet one instance of backdating a filing under pressure. The committee treats this as an anomaly in an otherwise solid record. I'm telling you it's the only data point that actually matters. It reveals the situational dependency of her morality. When the pressure was low, she was honest. When the deadline loomed, she wasn't. That is exactly what John Doris argues in *Lack of Character*. We don't have global traits; we have local ones. She possesses "honesty-in-low-stakes-situations," not Honesty with a capital H.

  **Prof. Vance:** You're leaning on the inconsistency argument. But Doris's definition of a "global trait" is a straw man. He defines it as a disposition to act consistently across a wide range of *trait-relevant* situations, regardless of the agent's interpretation of those situations. But that isn't the Aristotelian view.

  **Dr. Thorne:** It's the view the Bar holds. They want consistency. But consider Isen and Levin's 1972 study. Subjects who found a dime in a phone booth were significantly more likely to help a stranger pick up dropped papers than those who didn't find a dime. A trivial situational factor—a dime—swung moral behavior more than any supposed internal virtue. If a dime can toggle helping behavior, do you really think a looming bar deadline won't toggle honesty? Applicant 409 didn't just "slip." She responded to the situation. The references from the last decade only prove she hasn't been in *that* specific pressure cooker since.

  **Prof. Vance:** You cite Isen and Levin to suggest moral behavior is fragile. I cite it to show that *mood* and *context* influence action. But virtue ethics isn't about reflexive helping behavior. It's about *phronesis*—practical wisdom. The subjects finding the dime weren't engaging in moral deliberation. They were acting on impulse. Applicant 409's backdating was a deliberative act. She weighed the risk, the deadline, and the rule.

  **Dr. Thorne:** Precisely. And she chose to violate the rule. And look at Milgram. Ordinary people, not psychopaths, administered lethal shocks because an authority figure told them to continue. They weren't lacking "global compassion"; they were overwhelmed by the situation. If we put Applicant 409 in a high-pressure firm where a partner implies a filing must be ready, does her "virtue" hold? Milgram suggests the situation swamps the character. The committee is committing the Fundamental Attribution Error. They are attributing her past behavior to her essence, ignoring the situational variables that haven't yet aligned to break her.

  **Prof. Vance:** You are treating the applicant as a passive vessel for situational forces. That is the core misunderstanding Rachana Kamtekar identifies in her critique of situationism. She argues that these studies target a behavioral regularity that virtue ethics doesn't actually claim. Virtue isn't a blind habit that triggers the same output regardless of context. It's a capacity for reasoning.

  **Dr. Thorne:** A capacity that apparently failed when the clock was ticking.

  **Prof. Vance:** Or a capacity that was immature at the time. Aristotle allows for moral development. A single failure, acknowledged and learned from, does not negate a *hexis*—a state of character. In fact, the fact that she disclosed this incident, while her references remained glowing, suggests she has integrated that failure into her moral reasoning. The situationist sees a data point of inconsistency; I see evidence of moral growth. If character were truly as fragmented as Doris claims, she wouldn't have maintained the decade of integrity *after* the incident.

  **Dr. Thorne:** But that's the trap. You're assuming the future situations will be like the past ten years. They won't. Legal practice introduces novel, high-stakes pressures she hasn't faced. Doris's point is that local traits don't generalize. "Honesty-in-associate-level-positions" does not predict "Honesty-in-partner-level-billing-disputes." The committee's procedure rests on the assumption that the past predicts the future because the *person* remains constant. I'm arguing the person is less constant than the situation. If you change the stakes, you change the person.

  **Prof. Vance:** But if we accept your view, Aris, the committee's job becomes impossible. If behavior is entirely situational, no amount of scrutiny helps. You'd have to simulate every possible future scenario to test her.

  **Dr. Thorne:** Not every scenario. But we should stop pretending we are certifying a "Good Person." We should be certifying "Low Risk in Known Contexts." We should be designing safeguards, not vetting souls. If we admit that Milgram-style obedience is a risk for everyone, we stop asking "Is she virtuous?" and start asking "What systems prevent her from backdating?"

  **Prof. Vance:** That reduces the lawyer to a functionary. The law requires more than compliance; it requires judgment. Kamtekar presses this hard against the situationists: Virtue ethics posits that the virtuous agent perceives the moral salience of the situation differently. A virtuous lawyer doesn't just see "deadline pressure"; she sees "professional integrity at risk." The backdating incident shows she *failed* to perceive that salience *then*. The question is whether she perceives it *now*.

  **Dr. Thorne:** And how do you measure perception? You can't. You measure behavior. And the behavioral data says: under specific pressure, she cheated. The situationist argument is that we should trust the data over the narrative of "growth." The narrative is just post-hoc rationalization.

  **Prof. Vance:** And the situationist data relies on stripping agents of the very reasoning capacity that defines moral agency. Milgram's subjects were isolated, deceived, and coerced. Isen's subjects were caught off guard. Applicant 409 was a working professional. To equate her deliberative choice with a reflexive reaction to a dime is to ignore the cognitive architecture virtue ethics is actually concerned with.

  **Dr. Thorne:** I'm not ignoring cognition. I'm saying cognition is situational too. Her "practical wisdom" is a variable, not a constant. It fluctuates with stress, fatigue, and authority. The committee wants a binary: Good Moral Character or Not. I'm telling you it's a spectrum dependent on environmental design. If you certify her as "Virtuous," you create a false sense of security. You assume she won't cheat because she's "good." I say she won't cheat only if the situation doesn't invite it.

  **Prof. Vance:** Then we agree on the risk, but disagree on the source. You believe the source is external; I believe it is the interaction between the agent and the external. If we deny the stability of the agent, we deny the possibility of professional responsibility entirely. We cannot hold lawyers accountable if they are merely leaves blowing in the situational wind.

  **Dr. Thorne:** We hold them accountable for the act, not the essence. But for the purpose of this committee? I say we deny admission. Not because she is "bad," but because the evidence for stable honesty is empirically thin. The backdating is the only stress-test result we have. She failed it.

  **Prof. Vance:** And I say we admit her. Not because she is perfect, but because the decade of integrity following the failure demonstrates the development of *phronesis*. She learned to perceive the salience of the rule. To deny her based on a situationist reading of human nature is to demand a consistency that no human being, virtuous or otherwise, can empirically satisfy.

  **Dr. Thorne:** So we're at an impasse. You trust the narrative of growth; I trust the predictive validity of the stress test.

  **Prof. Vance:** I trust the capacity for reason. You trust the power of circumstance.

  **Dr. Thorne:** And the applicant sits in the hallway, waiting for us to decide if she's a person or a collection of responses.

  **Prof. Vance:** Then let's hope the committee understands that whichever way they vote, they are making a philosophical claim, not just a factual one.

  **Dr. Thorne:** Agreed. Though I suspect they'll prefer the comfort of the ghost to the uncertainty of the data.
