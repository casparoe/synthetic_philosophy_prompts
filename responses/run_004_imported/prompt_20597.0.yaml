      *   *Key Insight:* Ghazālī denies causal power to *creatures*. QM attributes probabilistic propensity to *particles*. This is a subtle but important distinction. For Ghazālī, the atom has no power to decay; God creates the decay. For QM, the atom has a propensity to decay.

  10. **Final Polish:** Ensure clear headings and a strong concluding summary. (Proceed to generate output based on this thought process).

