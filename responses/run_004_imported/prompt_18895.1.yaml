answer: |-
  This is a classic instantiation of the **boundary problem** in democratic theory (often associated with Frederick Whelan, Robert Dahl, and more recently, Iseult Honohan and David Owen). Your students have effectively reconstructed the debate between the **All-Affected Interests (AAI)** principle (Elena) and the **All-Subjected Principle (ASP)** (Marcus).

  The literature generally agrees that there is no perfect solution, which explains why you couldn't settle it. However, we can evaluate the tactical strength of each move in the dialectic. Here is an assessment of who has the better of it at each stage, followed by the crucial considerations both are overlooking.

  ### Move-by-Move Evaluation

  **Move 1: Elena (The Intuitive Case for AAI)**
  *   **Argument:** The *demos* should include everyone whose interests are substantially affected. Administrative lines are arbitrary if they exclude those bearing costs.
  *   **Assessment:** **Elena wins this move.**
  *   **Reasoning:** In the specific context of Rivermouth/Fenwick, her moral intuition is overwhelming. Democratic legitimacy rests on the idea that power must be accountable to those over whom it is exercised. If Rivermouth can export its costs (noise, pollution) to Fenwick without Fenwick's consent, Rivermouth is acting as a tyranny over Fenwick. Elena correctly identifies that pre-existing administrative boundaries cannot be morally sacrosanct if they facilitate exploitation. At the level of *political morality*, she is on solid ground.

  **Move 2: Marcus (The Indeterminacy Objection)**
  *   **Argument:** AAI leads to infinite regress ("proves too much"). Causal chains extend indefinitely. He proposes the All-Subjected Principle (ASP): only those bound by the authority should vote.
  *   **Assessment:** **Marcus wins this move.**
  *   **Reasoning:** Marcus identifies the fatal theoretical flaw of AAI: it lacks a stopping rule. If *effects* determine the *demos*, then a Rivermouth decision on school lunches might affect global commodity prices, theoretically enfranchising non-citizens abroad. Marcus correctly points out that a *demos* must be a determinate body capable of convening and deciding. By shifting to "subjection to authority," he offers a binary, institutional criterion (you are either under the jurisdiction or you aren't) that saves democracy from becoming a global plebiscite on every local issue.

  **Move 3: Elena (The Normative Grounding of Coercion)**
  *   **Argument:** Coercion matters only because it overrides interests. Furthermore, Fenwick *is* coerced because the legal system (nuisance/property law) forbids them from stopping the noise.
  *   **Assessment:** **Elena wins the moral point; Marcus wins the legal precision.** (Call it a draw, leaning Elena).
  *   **Reasoning:** Elena makes a profound philosophical point: coercion is not a brute fact; it requires justification, and that justification usually relies on the interests at stake. However, her legal claim is slippery. She conflates *Rivermouth's* authority with the *state's* legal framework. It is not Rivermouth coercing Fenwick; it is the state's property regime allowing Rivermouth to act. Nevertheless, she successfully pressures Marcus to explain *why* subjection matters if not for the protection of interests. She exposes that ASP might be empty without AAI as its normative engine.

  **Move 4: Marcus (The Conceptual Collapse & Determinacy)**
  *   **Argument:** If legal barriers to suing count as coercion by the actor, then all negative externalities are coercion. ASP collapses back into AAI. He insists jurisdiction is determinate, even if he can't yet justify why it's "basic."
  *   **Assessment:** **Marcus wins this move.**
  *   **Reasoning:** Marcus successfully defends the conceptual distinction between *being harmed* and *being commanded*. If every harm counts as coercion, the concept of coercion loses its utility for defining political boundaries. He forces Elena to admit that her definition makes everyone subject to everyone. His concession (that he can't explain *why* subjection is basic) is a vulnerability, but his insistence on **determinacy** is a pragmatic trump card. A democratic procedure cannot function if the electorate is ill-defined. He wins on institutional feasibility.

  ### What Both Are Overlooking

  While Elena and Marcus have reconstructed a high-level theoretical stalemate, they are both operating within a frame that obscures three critical solutions to the Rivermouth problem.

  **1. The "Constituted Power" Problem (The Level of Analysis)**
  Both students assume the *town* is the appropriate unit of sovereignty for this decision. They are fighting over who gets to vote in a Rivermouth election. But the boundary problem suggests that **Rivermouth should not be deciding this alone.**
  *   **The Overlook:** In most democratic systems, decisions with significant inter-jurisdictional externalities are bumped up to a higher authority (a County Board, a State Agency, or a Regional Planning Commission).
  *   **The Fix:** The *demos* for an airport decision is not the town of Rivermouth; it is the region. The solution isn't to redraw Rivermouth's voting rolls (which creates administrative chaos), but to change the *venue* of the decision to a body whose jurisdiction already encompasses both towns. Both students are fighting over the lock, when they should be questioning who holds the key.

  **2. The Distinction Between Franchise and Remedy**
  Elena assumes the only remedy for affected interests is a **vote**. Marcus assumes the only defense of jurisdiction is **exclusion**.
  *   **The Overlook:** Democratic theory increasingly distinguishes between *input legitimacy* (voting) and *output legitimacy* (rights/compensation). Fenwick residents may not need a vote in Rivermouth elections to be treated democratically.
  *   **The Fix:** They might be entitled to **representation without franchise** (e.g., a mandated seat on the airport board) or **compensation** (Rivermouth must pay for Fenwick's soundproofing). If Rivermouth internalizes the cost via compensation, the democratic deficit is mitigated even without enfranchisement. Marcus's subjection principle holds for *voting*, but Elena's interest principle holds for *rights*.

  **3. The Historical vs. Philosophical Boundary**
  Both students treat the boundary as something that *ought* to be drawn philosophically right now.
  *   **The Overlook:** Democratic boundaries are almost never drawn based on principle; they are historical artifacts. The "boundary problem" is theoretically unsolvable precisely because you need a *demos* to decide the *demos* (a circularity).
  *   **The Fix:** The principled solution is often **procedural rather than substantive**. The boundary is legitimate not because it tracks interests or subjection perfectly, but because there is a peaceful, agreed-upon mechanism for altering it (e.g., state legislature approval for boundary changes). The stability of the boundary itself has democratic value. Marcus hints at this with "determinacy," but he treats it as a practical fallback rather than a democratic virtue. Sometimes, a fixed line is more democratic than a perpetually contested moral calculation.

  ### Summary for the Seminar
  You can tell your students that **Elena wins on moral intuition, but Marcus wins on institutional logic.**

  *   **Elena** is right that the outcome is unjust.
  *   **Marcus** is right that her solution breaks the machinery of democracy.

  The synthesis lies in recognizing that when the *moral* boundary (Elena) and the *jurisdictional* boundary (Marcus) diverge significantly, the decision should not be made at the jurisdictional level. The Rivermouth referendum is likely illegitimate not because Fenwick needs a vote in Rivermouth, but because **Rivermouth lacks the competence to decide unilaterally.** The "principled way" to fix the boundary is often to admit that the current boundary is the wrong one for *this specific decision*, and to elevate the decision to a higher, overlapping authority.
