answer: |-
  **Setting:** *A quiet corner of the hotel bar at the annual Society for Philosophy and Psychology conference. It's late. Empty glasses and a half-eaten plate of calamari sit between them.*

  **Characters:**
  *   **ELENA:** Specializes in social constructionism and the history of diagnosis.
  *   **MARCUS:** Focuses on the epistemology of psychiatry and digital ethics.

  **ELENA:** You're shaking your head. I can see you doing it. Every time I mention the TikTok feeds, you do that little frown like you've smelled something sour.

  **MARCUS:** It's not sour, El. It's just... familiar. Too familiar. You're calling it a looping effect. A clean, textbook Hacking case. I'm not sure *Rewriting the Soul* stretches that far.

  **ELENA:** Why not? Look at the mechanics. In the eighties, you had the *Sybil* boom. Clinicians started looking for alters, patients started finding them, the taxonomy expanded to accommodate twenty-four personalities instead of two. The classification changed the classified. That is the definition of an interactive kind. Now, swap "clinician" for "algorithm" and "waiting room" for "For You Page." A kid feels fragmented—maybe traumatized, maybe just alienated—they search #DID. The algorithm feeds them a script of what fragmentation looks like. They perform the switch. The community validates it. The classification reshapes the self. It's looping on fast-forward.

  **MARCUS:** But Hacking wasn't just talking about feedback. He was talking about *authority*. The looping effect in the MPD boom worked because there was a bureaucratic machine behind it. The DSM, the insurance codes, the licensed therapist whose signature mattered. The patient looped *against* the expert, but the expert held the pen. On TikTok, who's holding the pen? There is no committee. There's no gatekeeper. It's a rhizome. If there's no central classification authority, is it really a looping effect, or is it just... mimicry?

  **ELENA:** You're fetishizing the institution. Hacking's point was about the *ontology* of the person, not the org chart. When a teenager starts narrating their internal conflict as "the protector alter taking the front," they aren't just mimicking. They are reorganizing their memory, their agency, their sense of continuity. They are becoming a person who *has* alters. That is "making up people," regardless of whether the diagnosis came from a PhD in Zurich or a viral video from a seventeen-year-old in Ohio. The loop is internal.

  **MARCUS:** But the *telos* is different. That's the rub. In the eighties, the goal of the classification was ultimately cure, or at least management. The loop was: Diagnose -> Treat -> Integrate. The patient might resist integration, sure, but the category was medical. On TikTok, the goal is often visibility. It's community building. If I "switch" on camera, I'm not seeking treatment; I'm seeking resonance. If the loop doesn't close back on a medical intervention, does it still count as psychiatric looping? Or is it performance art that happens to use medical vocabulary?

  **ELENA:** That's a dangerous distinction. You're implying the suffering is less real if the validation comes from peers rather than a prescription pad. Trauma doesn't care about your *telos*. If the available vocabulary for understanding my pain is "DID," I will understand my pain as DID. That's the looping effect! The availability of the kind changes the experience of the kind. If TikTok makes the "alter" concept available to a kid who would have otherwise just felt "moody," you have successfully changed the population of people who exist. Hacking would call that a victory for the theory, not a disqualifier.

  **MARCUS:** I'm not questioning the suffering. I'm questioning the mechanism of the *making*. Hacking was worried about the power dynamics of the asylum and the clinic. He was warning us about how experts create subjects. If we apply that same label to a decentralized algorithm, we risk letting the actual experts off the hook. If TikTok DID is just "looping," then the DSM-5-TR is off the hook for its role in shaping it. But the DSM *is* still there. The TikTokers are citing the DSM. They're using the clinical language to legitimize the performance. So the authority is still there, it's just been hollowed out. It's a zombie looping effect.

  **ELENA:** A zombie looping effect? That's poetic. But look, the DSM didn't create the TikTok trend alone. It was the *cultural osmosis* of the DSM. The looping has escaped the lab. That's actually more terrifying, isn't it? In the eighties, if you wanted to opt out of the MPD loop, you could stop going to therapy. You could fire the doctor. How do you fire the algorithm? The classification is ambient now. It's in the air. The loop is tighter because it's everywhere. You can't step outside the interactive kind because the kind is the medium you're swimming in.

  **MARCUS:** Okay, I'll grant you the ambient part. But let's talk about the "switch." In the eighties, the switch was often a clinical event. It happened in the office, documented in notes. On TikTok, the switch is a content constraint. It has to happen in sixty seconds. It has to be visually distinct. Different clothes, different voice. Doesn't that suggest the feedback is shaping the *presentation* more than the *person*? Hacking was interested in the soul, not the profile picture. If I curate a switch for views, am I actually looping my identity, or am I just looping my brand?

  **ELENA:** You're assuming a pre-existing "soul" that sits behind the performance, waiting to see if it's been tricked. But there is no soul behind the curtain. There's just the narrative. If the narrative is constrained by the sixty-second video format, then the *self* is constrained by the format. That's the loop! The medium dictates the ontology. If I have to compress my dissociation into a trend to make it legible to myself, then my dissociation *becomes* that compression. That's not fake. That's construction.

  **MARCUS:** But construction implies a builder. In the MPD boom, the builder was the therapeutic relationship. It was dyadic. Doctor and patient. Here, it's polyadic. It's the algorithm, the peers, the trolls, the clinicians watching from the sidelines, the user. It's a cacophony. If we call this a "looping effect," we imply a singular feedback circuit. This isn't a circuit. It's a storm. Maybe we need a new term. Because if everything that influences self-conception is a looping effect, then the term loses its bite. It just becomes "socialization."

  **ELENA:** It *is* socialization. That's what Hacking was saying! He was saying that "socialization" isn't just polishing the surface; it's digging the mold. But I see your point about the storm. Maybe the difference is stability. The eighties boom lasted a decade because the institutions were slow to change. TikTok trends cycle in months. Does a looping effect need duration to solidify the "kind"? If the "DID TikToker" kind disappears in two years when the algorithm shifts to ADHD, were they ever really "made up" in the Hacking sense? Or were they just passing through?

  **MARCUS:** Exactly. If the kind is transient, did it actually change the population? Or did it just change the vocabulary for a season? Hacking's examples—multiple personality, the refugee, the homeless—these were categories that stuck, that changed legal and medical structures. Does a hashtag have that weight?

  **ELENA:** It does if it changes how you remember your childhood. If a twenty-year-old watches those videos and suddenly re-interprets ten years of memory through the lens of alters... that sticks. The video might vanish, the trend might die, but the memory is rewritten. *Rewriting the Soul*, literally. The algorithm moves on, but the person stays looped. They carry the classification into the clinic, into their relationships, into their medication. The TikTok loop *feeds* the clinical loop. It's not a replacement, Marcus. It's the intake valve.

  **MARCUS:** (Pauses, swirls his drink) The intake valve. I like that. So you're saying the algorithmic loop is the precursor to the institutional loop. The peer community does the preliminary diagnosis, and then the clinician just signs off.

  **ELENA:** Precisely. The authority hasn't vanished. It's been outsourced. The peers do the labor of classification, and the doctors inherit the result. It's a distributed looping effect.

  **MARCUS:** If that's true, then Hacking's warning is more urgent, not less. Because the feedback is faster, and the oversight is lower. In the eighties, there were skeptics in the room. There were debates in journals. Now, the skepticism is just a comment section troll, which only reinforces the community bonding. The loop is hermetic.

  **ELENA:** So you agree? It is a looping effect.

  **MARCUS:** (Sighs) I agree it's *a* looping effect. But I still worry that calling it "Hacking-style" implies the same power dynamics. Hacking was critiquing the establishment. Here, the "establishment" is the one playing catch-up. The power has shifted to the platform. If we use Hacking's term without modifying it, we miss the shift in power. We're fighting the wrong ghost.

  **ELENA:** Then we modify it. "Algorithmic Interactive Kinds." But don't tell me the ontology isn't shifting.

  **MARCUS:** The ontology is shifting. I'll grant you that. The self is being written in real-time, in public, for an audience of one and everyone. But I still think Hacking would ask: Who owns the copyright on the soul? In the eighties, it was the APA. Now? It's Terms of Service.

  **ELENA:** (Raises her glass) To the Terms of Service, then. The new DSM.

  **MARCUS:** (Clinks glass) God help us. But don't say I didn't warn you about stretching the definition.

  **ELENA:** Definitions loop too, Marcus. They change as we use them.

  **MARCUS:** Touché.
