      *   **Apply to Black:**
          *   *Scenario A (PSR/§3):* Black succeeds in showing PII isn't logically necessary, but fails to show it's false in the actual world (if Leibniz's theology holds).
          *   *Scenario B (Identity/§6):* Black begs the question. The phrase "two spheres" presupposes discernibility.
      *   **The "Secret Weapon" (Complete Concepts):** Bring in the *Discourse on Metaphysics* or *Monadology* to bolster §6. Substances have unique complete concepts.
      *   **Conclusion:** Advise the user on how to frame this in their paper. The strength of Leibniz's reply to Black depends on accepting Leibniz's metaphysics of substance, which Black explicitly rejects.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, does Leibniz allow extrinsic denominations?* In the correspondence with Clarke, he sometimes leans on relational differences (position). But in his mature metaphysics, relations reduce to monadic properties. I need to be careful not to conflate the "relational PII" (often attributed to the correspondence) with the "intrinsic PII" (Monadology).
      *   *Correction:* In the Clarke correspondence, Leibniz is fighting Newtonian Absolute Space. So §6's mention of "position of Time and Place" is specifically targeting the idea that space can individuate. He's saying: You can't use space to individuate because space is ideal. So §6 is actually a attack on Newtonian substantivalism *using* PII.
