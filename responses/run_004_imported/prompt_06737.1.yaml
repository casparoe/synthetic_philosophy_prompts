prompt: |-
  In my school's decision theory club, we recently covered I. J. Good's well-known theorem that a Bayesian agent's expected utility can never be lowered in expectation by looking at free evidence before acting. Several clubmates took this as settling the question of whether a rational person should always want more information, no matter what. I think that inference moves too fast. Please argue that Good's theorem does not support this general slogan. As your central case, use the phenomenon the economist Jack Hirshleifer identified: the mere existence of sufficiently accurate information can destroy risk-sharing arrangements, like insurance, that would otherwise make everyone better off ex ante, so that a fully rational person can end up worse off simply because such information exists, even if nobody is ever compelled to look at it. Be precise about why this is not a counterexample to Good's proof itself, but rather a case that falls outside what the proof assumes.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A school decision theory club discussion.
      *   **Topic:** I. J. Good's Theorem (Value of Information).
      *   **Clubmates' Inference:** "Rational people should *always* want more information, no matter what."
      *   **User's Stance:** This inference is too fast. Good's theorem doesn't support the general slogan.
      *   **Task:** Argue *why* the inference is flawed, using Jack Hirshleifer's insight on information destroying risk-sharing (insurance) as the central case.
      *   **Constraint:** Be precise about why this isn't a counterexample to Good's proof *itself*, but rather a case falling outside its assumptions.

  2.  **Deconstruct I. J. Good's Theorem:**
      *   *What does it say?* For a Bayesian agent facing a decision problem, the expected utility of acting *after* observing free evidence is at least as high as the expected utility of acting *without* observing it.
      *   *Key Assumptions:*
          *   Single agent (or agents with aligned interests/no strategic interaction).
          *   The information affects *only* the agent's beliefs/actions.
          *   The information does not change the *structure* of the world or the payoffs available to others in a way that feedbacks onto the agent (non-externalities).
          *   The information is costless ("free").
          *   The agent *must* use the information optimally.
      *   *The "Value of Information" (VoI):* $VoI = E[U|Info] - E[U|No Info] \geq 0$.

  3.  **Deconstruct Hirshleifer's Insight (The Hirshleifer Effect):**
      *   *Core Idea:* Information can have social value but negative private value in specific contexts, specifically risk-sharing.
      *   *Mechanism:* Insurance works based on *uncertainty*. If I don't know if I'll get sick, and you don't know, we can pool risk. If we know *beforehand* who will get sick (perfect information), the healthy won't insure the sick. The risk-sharing market collapses.
      *   *Ex Ante vs. Ex Post:* Ex ante (before information), everyone is better off with the *possibility* of insurance (which requires ignorance). Ex post (after information), allocation might be efficient, but the *option* to insure is gone.
      *   *Crucial Nuance:* If the information *exists*, even if I don't look at it, does it destroy insurance?
          *   If the information is *publicly available* or *verifiable*, insurers will demand access or price based on the assumption that it might be known.
          *   If the information *exists* in principle (e.g., a genetic test exists), insurance markets may unravel due to adverse selection (Akerlof's Lemons), even if I personally choose ignorance.
          *   *Refinement for the prompt:* The prompt asks to argue that a rational person can end up worse off simply because such information *exists*, even if nobody is compelled to look at it. This points to the *equilibrium effect* of information availability on market structures.

  4.  **Synthesize: Connecting Good to Hirshleifer:**
      *   *The Conflict:* Good says "More info is better for *my* decision." Hirshleifer says "More info availability can destroy *our* risk-sharing."
      *   *Resolution:* Good's theorem assumes the payoff structure is fixed independent of the information state. Hirshleifer's scenario involves *strategic interaction* and *market equilibrium*. The payoffs (insurance premiums/availability) depend on the information structure of the *entire system*, not just the individual's belief.
      *   *Why it's not a counterexample to Good:* Good's theorem is about *individual decision theory* in isolation (or with fixed states of nature). It does not account for *game theory* where other agents change their behavior based on the information regime. Good assumes the world doesn't change just because you know more. Hirshleifer shows the world (specifically the social contract/market) *does* change.

  5.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge Good's theorem. State clearly that the clubmates are conflating "individual decision value" with "social/equilibrium value."
      *   *Explain Good's Theorem:* Briefly define it. Emphasize the "ceteris paribus" condition (all else equal). The state of the world is fixed; only the agent's belief changes.
      *   *Introduce Hirshleifer:* Explain the risk-sharing/insurance example.
          *   Scenario: Two people, risk of loss.
          *   Ignorance: Pool risk, both happy.
          *   Information: Know who loses. No pooling. High variance for individuals.
          *   Ex Ante Welfare: Higher under ignorance.
      *   *The "Existence" Nuance:* The prompt specifies "simply because such information exists." This refers to the *availability* of information affecting market equilibrium (e.g., insurers assume you might know, or laws require disclosure if available). If the technology exists, the market adjusts *before* I look.
      *   *Reconciling with Good:* This is the critical part.
          *   Good's theorem assumes the payoff function $U(action, state)$ is static.
          *   In Hirshleifer's case, the payoff function depends on the *information structure* itself (because contracts depend on verifiability/common knowledge).
          *   Therefore, acquiring (or making available) information changes the *game*, not just the *belief*. Good's theorem applies to decisions *within* a game, not to the choice of *which game to play*.
      *   *Conclusion:* Reiterate that rationality implies wanting info *given* a fixed decision problem, but rationality also implies recognizing when the existence of info changes the problem itself.

  6.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Check:* Did I address "even if nobody is ever compelled to look at it"?
      *   *Correction:* I need to be careful here. If *I* don't look, Good's theorem says *I* haven't lowered *my* expected utility *relative to not looking*. But if the *existence* of the info destroys the insurance market, my utility is lower than in a world where the info *didn't exist*.
      *   *Distinction:* Good's theorem compares $E[U|Look]$ vs $E[U|Don't Look]$ *given the info is available*. Hirshleifer compares $E[U|Info Exists]$ vs $E[U|Info Does Not Exist]$.
      *   *Wait, is that right?* If the info exists but I don't look, does the market collapse?
          *   In asymmetric information models (Akerlof), if *I* have access to info and *you* (insurer) know I have access, you adjust prices even if I don't look. This is the "curse of knowledge" or adverse selection dynamic.
          *   So, the "existence" implies "availability to agents." If it is available, the equilibrium shifts.
      *   *Clarification on Good:* Good's theorem is about the *act of observing*. It proves $E[U|Observe] \geq E[U|Ignore]$. It does *not* prove $E[U|Info Available] \geq E[U|Info Unavailable]$. This is the key logical gap.
      *   *Tone:* Academic but accessible (club context). Rigorous but clear.

  7.  **Final Structure:**
      1.  **Validate the Clubmates:** Good's theorem is correct *within its domain*.
      2.  **Define the Domain:** Single agent, fixed payoff structure, information only updates beliefs.
      3.  **Introduce Hirshleifer:** Information as a disruptor of social contracts (insurance).
      4.  **The Mechanism:** Information converts uncertainty (insurable) to risk/certainty (uninsurable).
      5.  **The "Existence" Point:** Market equilibrium depends on information *availability*, not just usage.
      6.  **The Logical Gap:** Good compares "Look vs. Don't Look" (holding world fixed). Hirshleifer compares "World with Info vs. World without Info" (world changes).
      7.  **Conclusion:** Rationality requires knowing when information changes the game, not just playing the game better.

  8.  *(Self-Correction during drafting)*: Make sure to explicitly mention that Good's theorem assumes the information doesn't change the *state of the world* or the *payoffs*. In Hirshleifer's case, the "state" includes the contractual environment, which is endogenous to the information structure.

  9.  **Final Polish:** Ensure the distinction between *private value of information* (Good) and *social value of information* (Hirshleifer) is clear, but focus on the *individual's ex-ante welfare* as requested ("fully rational person can end up worse off").

      *Wait, one nuance:* If I am the *only* one who can access the info, Good holds. If the info is *publicly* available (or the market knows it *could* be accessed), Hirshleifer holds. The prompt says "mere existence... even if nobody is ever compelled to look at it." This implies a systemic change. I need to make sure I explain that the *availability* alters the equilibrium prices/contracts offered to me, regardless of my personal choice to look.

      *Okay, let's write.*
answer: |-
  Your skepticism is well-founded. Your clubmates are committing a category error by conflating the **private value of information in a fixed decision problem** with the **social value of information in a general equilibrium**.

  I. J. Good's theorem is a rigorous result within Bayesian decision theory, but it relies on specific ceteris paribus assumptions that do not hold in the scenarios Jack Hirshleifer identified. To persuade your club, you need to show that Good's theorem proves information is never detrimental to *decision-making accuracy*, but it does not prove that information availability is never detrimental to *welfare*.

  Here is the argument you can present to the club, structured to distinguish the theorem's scope from Hirshleifer's insight.

  ### 1. What Good's Theorem Actually Says
  First, clarify the theorem to ensure everyone is on the same page. Good's theorem states that for a single Bayesian agent facing a fixed decision problem, the expected utility of acting *after* observing free evidence is at least as high as the expected utility of acting *without* observing it.

  Mathematically, if $U$ is utility, $a$ is an action, and $e$ is evidence:
  $$ E[\max_a E[U(a) \mid e]] \geq \max_a E[U(a)] $$

  **The Critical Assumption:** The theorem assumes the **payoff structure is fixed**. It assumes that the consequences of your actions depend only on the state of the world and your choice, not on *who else knows what* or *what information technology exists*. It treats the world as a "game against nature," not a game against other strategic agents whose behavior changes based on the information regime.

  ### 2. The Hirshleifer Effect: Information as a Destroyer of Value
  Jack Hirshleifer (1971) demonstrated that while information helps an individual make better decisions, the *availability* of information can alter the terms of trade between individuals in a way that lowers everyone's ex-ante welfare.

  Consider a standard risk-sharing arrangement, like health insurance:
  *   **Scenario A (Ignorance):** You and I do not know who will get sick. We are both risk-averse. We enter an insurance contract where we pool our resources. If one gets sick, the other helps. Because we share the risk, our **ex-ante expected utility is high**.
  *   **Scenario B (Information Exists):** Suppose a genetic test exists that perfectly predicts who will get sick. Even if we are not *compelled* to take the test, the **existence** of this test changes the market equilibrium.
      *   Insurers know that applicants *could* take the test.
      *   If I know I am high-risk, I will buy insurance. If I know I am low-risk, I will not (or will demand lower premiums).
      *   Anticipating this adverse selection, insurers raise premiums or withdraw coverage entirely.
      *   The risk-sharing market collapses. We are forced to bear our risks individually.

  In Scenario B, even if you personally choose **not** to look at the test results, you are worse off than in Scenario A. The mere existence of the information has destroyed the insurance contract that guaranteed your welfare. You have lost the benefit of risk-pooling.

  ### 3. Why This Is Not a Counterexample to Good's Proof
  This is the most important distinction for your clubmates. Hirshleifer's scenario is **not** a counterexample to Good's mathematics. It is a case that falls outside the theorem's **boundary conditions**.

  **Good's Theorem compares:**
  1.  Looking at the evidence (in a world where the evidence exists).
  2.  Ignoring the evidence (in a world where the evidence exists).

  In Good's framework, the insurance contract is assumed to be available in both cases. If the contract is available, Good is right: if you have the test result, you should use it to optimize your choice of whether to buy insurance. You will never be worse off *looking* than *ignoring*, **given the contract is on the table.**

  **Hirshleifer's Insight compares:**
  1.  A world where the evidence **exists** (and is available to the market).
  2.  A world where the evidence **does not exist** (or is permanently unavailable).

  In Hirshleifer's framework, the insurance contract is **not** on the table in Case 1. The existence of the information changes the *structure of the game*. It transforms a situation of **uncertainty** (where probabilities are known but outcomes are not, allowing for insurance) into a situation of **asymmetric information** (where outcomes are potentially known to agents, destroying insurance).

  ### 4. The Rational Conclusion
  Therefore, the slogan "a rational person should always want more information" is false if interpreted as "a rational person should always prefer a world where more information is available."

  *   **Within a fixed game:** Good's theorem holds. If you are already in a market, you should never pay to *ignore* free information available to you.
  *   **Across different games:** Hirshleifer's insight holds. A rational agent, reasoning **ex-ante** (before the information technology is developed), might prefer to **ban** the creation of certain information.

  **The Synthesis for the Club:**
  You can tell your clubmates that they are confusing the **value of information usage** with the **value of information existence**.
  *   Good proves that $Value(Using \mid Existing) \geq 0$.
  *   Hirshleifer shows that $Value(Existing) < 0$ in specific social contexts.

  A fully rational agent recognizes that while they should never waste free information they already have, they might rationally vote to prevent that information from becoming available in the first place. To argue otherwise is to assume that our decisions happen in a vacuum, ignoring that the "payoffs" in our lives often depend on social contracts that require ignorance to function.
