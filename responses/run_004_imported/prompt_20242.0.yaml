answer: |-
  Good afternoon. Thank you all for being here.

  For those of you who knew Elias only as a colleague, you know he was a man of precise definitions. For those of you who knew him as a father, a husband, or a friend, you know he was a man of immense warmth. Usually, those two things don't sit comfortably together. In Elias, they did. But it means that standing here today, trying to summarize a life like his, I feel a particular pressure to get the definitions right.

  Elias was very clear about what he did *not* want said today. He left instructions, and his wife Sarah was kind enough to remind me of them. He did not want to be told he is in a "better place." He did not want us to pretend he is "watching over us" in the way a guardian angel might. He felt those phrases, while well-intentioned, were forms of dishonesty. He spent a lifetime chasing logical consistency, and he didn't want his departure to be marked by contradictions.

  However, he also didn't want this to be a cold or purely secular dismissal of the questions that mattered most to him. And that brings me to the thing Elias loved almost as much as set theory: Kurt Gödel.

  Most people know Gödel for the Incompleteness Theorems. Elias knew those inside and out. But for the last twenty years, especially in that graduate seminar he co-taught, Elias was fascinated by something quieter. He was fascinated by Gödel's private thoughts on what happens when we die.

  Now, I need to be careful here. There are logicians in this room who know exactly where the trap is. Elias was militant about this. He insisted that Gödel's *Ontological Proof*—the formal argument for the existence of God—and Gödel's views on *personal survival* were two completely different things. He hated seeing them conflated in print, and he would hate it more if we did it in his memory. So, let me be clear: We are not talking about a formal proof of divinity today.

  We are talking about an argument regarding capacity.

  Elias often spoke about Gödel's observation that the human brain seems wildly "overbuilt" for the mere tasks of survival and reproduction. Evolutionarily speaking, we have more capacity for abstraction, for mathematics, for love, and for art than is strictly necessary to keep the species going on this planet. Elias found comfort in the rational suggestion that you do not build a telescope of such power just to look at mud. He believed, or at least he hoped with rigorous intensity, that such capacity implies a longer utility. That the mind is designed for more than one lifetime's use.

  He didn't hold this as a dogma. He held it as a hypothesis. A rational hope.

  I tell you this not to turn this memorial into a lecture, but because I know many of you in this room—the staff, the students, the friends who aren't logicians—might feel excluded by the technicality of his life's work. You might feel that because you can't define a large cardinal, you can't fully speak to his intellect.

  But Elias's engagement with these ideas wasn't about exclusion. It was about value. When he argued that the mind is overbuilt, he was arguing that *you* matter. That your capacity to love him, to learn from him, and to grieve him is not an accident of biology, but a feature of a rational universe. He believed that the connections we make here are substantive. They are not illusions.

  So, how do we find comfort without the clichés he rejected?

  We find it in the integrity he demanded. Elias didn't want false comfort because he trusted us enough to handle the truth. He trusted that his life, and the work he left behind, was substantial enough to stand on its own without decoration.

  To his students: He believed in your minds. He challenged you not to make you feel small, but because he genuinely believed you were capable of the same rigorous hope he held.

  To the university staff and friends: He valued your presence. He didn't need you to understand his proofs to understand his character. He showed you who he was in how he treated you, not in what he published.

  And to Sarah, and to his children:
  I know he was stubborn about these things. I know he could be militant. But please hear this: His refusal to accept easy answers was not a refusal to love this life. It was the opposite. He cared so much about the truth of this existence that he couldn't bear to cheapen it with lies at the end.

  He argued that the brain is built for more than survival. I would suggest that *he* was built for more than just his work. He was built for the dinners you shared, the jokes he told when the proof wouldn't resolve, and the quiet moments that didn't need to be formalized.

  Elias Marsh spent his life looking for consistency in a chaotic world. He wanted a world where reason and hope didn't have to fight each other. He didn't want us to pretend he's somewhere else. He wanted us to recognize that what he built here—what *we* built with him—has a weight that doesn't just vanish.

  If his hypothesis was right, then the capacity for love we shared with him hasn't gone anywhere. It's still valid. It's still consistent. And if his hypothesis was just a hope, then it was a hope rooted in the value of human connection.

  We are not going to solve the mystery of death today. Elias wouldn't expect us to. But we can honor the rigor of his mind and the warmth of his heart by being honest about what we've lost, and honest about what remains.

  The work remains. The students he mentored remain. The love you gave him, and the love he gave you, remains. In a universe that Elias spent a lifetime trying to understand, that continuity is the only proof we need, and the only comfort that holds.

  Thank you.
