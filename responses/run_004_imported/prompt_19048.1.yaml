      *   *Option B: Block Outright.* Might be too harsh if the risk is manageable and the utility is high. Could stall business operations.
      *   *Option C: Approve Pending Fix.* The sweet spot. Acknowledges the utility but treats the behavior as a critical bug. It validates the concern without halting progress indefinitely.
