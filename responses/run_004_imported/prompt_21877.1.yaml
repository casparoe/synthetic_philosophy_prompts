      *   *Option 2: Don't List it.* Ignores the distinct ecological/behavioral traits (color, timing) and the 8,000-year isolation. Risks losing unique genetic diversity if the habitat is destroyed. Morally difficult for conservationists.
      *   *Option 3: Provisional/Interim Status (The "Third Way").* This acknowledges the scientific uncertainty and the legal constraint. The ordinance says "species or subspecies." It does *not* say "ESU." However, conservation committees often have the power to recommend "Candidate" status or "Species of Concern" while further study is done.
      *   *Decision:* The most responsible path, given the user's constraint that *both sides are reasonable*, is a **Provisional Listing with a Mandated Review Timeline.** This protects the fish *temporarily* (stopping the housing project temporarily, which is the hard part) but acknowledges the legal text requires a firmer scientific basis for permanent protection. It kicks the can down the road, *but* with a binding commitment to resolve the science and the policy gap.
