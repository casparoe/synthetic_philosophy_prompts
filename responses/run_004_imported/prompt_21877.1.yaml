answer: |-
  **MEMORANDUM**

  **TO:** Habitat Conservation Advisory Committee (HCAC)
  **FROM:** [Your Name], HCAC Member & Audubon Survey Lead
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding North Creek Shiner Population & Ordinance Interpretation

  ### Executive Summary

  After reviewing the available genetic data, consulting with external biological experts, and considering the legal constraints of our County Habitat Conservation Ordinance, I am recommending that the Committee **decline to designate the North Creek Shiner as a distinct "species or subspecies" at this time,** but simultaneously recommend the County Board enact an **Interim Conservation Overlay** for the North Creek watershed for a period of 18 months.

  This recommendation is not a dismissal of the fish's ecological value, nor is it an indefinite delay tactic. It is an acknowledgment that while the North Creek population is biologically unique, it does not currently meet the strict definitions required by our existing ordinance. However, its distinctiveness warrants protection while we determine if our local laws should be updated to recognize "Evolutionarily Significant Units" (ESUs) as a protected category.

  ### Background and Conflict

  The Committee is tasked with determining the status of a shiner population isolated in North Creek for approximately 8,000 years. Key facts include:
  *   **Biological Distinctiveness:** The population exhibits unique breeding coloration and a spawning timeline shifted by one month compared to the main river population.
  *   **Genetic Data:** The single available genetic study indicates the North Creek fish are nested within the river population's phylogenetic tree rather than forming a distinct branch. There is documented interbreeding at the creek's confluence with the river.
  *   **Legal Constraint:** Our Ordinance mandates a protected buffer only if a population "constitutes a distinct species or subspecies." It does not mention ESUs or Distinct Population Segments.
  *   **Stakeholder Impact:** A "species" designation triggers a buffer that precludes the proposed 40-unit affordable housing project. A "non-listing" allows the project to proceed but leaves the creek habitat vulnerable to standard development regulations.

  ### Analysis of the "Species" Question

  We must address the core scientific disagreement honestly. As noted in our discussions, biology does not offer a single, universally agreed-upon definition of "species."

  *   **The Biological Species Concept:** Focuses on reproductive isolation. Because the North Creek shiners interbreed with the river shiners where the waters meet, they arguably fail this test.
  *   **The Phylogenetic Species Concept:** Focuses on unique ancestry. The genetic study suggests they share a recent common ancestor with the river fish and are not a separate evolutionary branch *yet*.

  Those Committee members arguing that this population is simply a "weird variant" of the river shiner are scientifically justified based on the current genetic evidence. To declare them a distinct species now would be to ignore the data we paid to collect. It would also expose the County to significant legal liability from the developers, who would rightly argue we are misapplying our own Ordinance.

  However, those arguing for protection are also scientifically justified in noting that 8,000 years of isolation is an evolutionary blink of an eye. The differences in spawning time and coloration suggest the population is *in the process* of becoming distinct. The concept of an "Evolutionarily Significant Unit" (ESU) was created by biologists specifically for this scenario: populations that are unique and valuable for conservation, even if they aren't full "species" yet.

  The conflict here is not actually about the fish; it is about a gap between our Ordinance (written with rigid categories) and modern Conservation Biology (which recognizes gradients of distinctiveness).

  ### Analysis of the Ordinance and the ESU Objection

  Two Committee members have raised a critical procedural point: The term "Evolutionarily Significant Unit" does not appear in our Ordinance. They argue that using the ESU concept to trigger a "species" buffer is a loophole that bypasses the legislative intent of the County Board.

  **This objection is valid.** As an Advisory Committee, we interpret the Ordinance; we do not write it. If we vote to call this fish a "species" when our own biologist classifies it as an "ESU," we are effectively rewriting the law from our committee chairs. This undermines the rule of law and sets a dangerous precedent where scientific categories can be stretched to fit desired land-use outcomes.

  However, dismissing the ESU concept entirely ignores the reality that waiting for a population to become a full "species" often means waiting until it is too rare to save.

  ### Recommendation: Interim Protection with Policy Review

  To resolve this without compromising scientific integrity or legal stability, I propose a two-part recommendation:

  1.  **Do Not List as Species/Subspecies:** We formally recommend *against* designating the North Creek Shiner as a distinct species or subspecies under the *current* Ordinance language. This respects the genetic data and the legal text.
  2.  **Recommend Interim Conservation Overlay:** We simultaneously recommend the County Board apply a temporary 18-month development moratorium on the specific North Creek buffer zone. This moratorium is contingent on the County initiating an Ordinance Amendment process to explicitly define whether ESUs qualify for protection.

  **Why this is not "chickening out":**
  This approach imposes the same immediate constraint on the housing project (an 18-month pause) as a full listing would, acknowledging the conservation risk. However, it achieves this through an honest administrative process (a moratorium for review) rather than a scientifically dubious label (calling it a species). It gives the developers legal certainty about *why* the project is paused and gives the conservation side a pathway to permanent protection that doesn't rely on bending definitions.

  ### Concrete Timeline

  To ensure this interim status does not become a permanent limbo, the following timeline is attached to this recommendation:

  *   **Month 0 (Now):** Committee votes to recommend Interim Overlay and Ordinance Review to the County Board.
  *   **Month 1-6:** County Planning Department drafts Ordinance Amendment language regarding ESUs/Distinct Population Segments.
  *   **Month 6-12:** Public hearing process on the Ordinance Amendment.
  *   **Month 12:** Commissioned follow-up genetic study on the shiner population (to update data before final decision).
  *   **Month 18:** **Hard Deadline.** The County Board must either:
      *   (A) Pass the Amendment and list the fish as a protected ESU (Buffer becomes permanent); OR
      *   (B) Decline the Amendment and lift the Interim Overlay (Housing project may proceed under standard regulations).

  ### Conclusion

  We are in a difficult position where conservation science has outpaced our local policy. The North Creek shiner is exactly the kind of population conservationists worry about: unique, isolated, and vulnerable. But the developers are right that we cannot block affordable housing based on a category that does not exist in our laws.

  By recommending an Interim Overlay rather than a forced Species Listing, we validate the legal concerns of the development side while honoring the ecological concerns of the conservation side. We stop the potential loss of habitat immediately, but we commit to a hard deadline to resolve the legal ambiguity. This allows us to vote with a clear conscience, knowing we have neither lied about the science nor ignored the law.

  I move that we adopt this recommendation and forward it to the County Board with a request for expedited consideration.
