answer: |-
  This is a profound metaphysical puzzle to grapple with while drafting a novel, but it is also deeply relevant to the themes of identity and redemption you are exploring. The "Problem of Temporary Intrinsics" (PTI) is indeed one of the strongest arguments for Perdurantism (the "space-time worm" view), but your intuition that character traits differ fundamentally from shapes is philosophically robust.

  Here is an argument defending your position: that PTI loses its force when applied to character change, even taking seriously the objection that dispositions are intrinsic properties.

  ### 1. The Core of Lewis's Argument
  To see why your protagonist can remain an *enduring* self (wholly present at every moment) rather than a *perduring* worm (a series of temporal parts), we must first isolate why Lewis thought shape was a problem.

  Lewis argued that if an object $O$ is wholly present at time $t_1$ and time $t_2$, and $O$ is **bent** at $t_1$ and **straight** at $t_2$, then $O$ possesses incompatible intrinsic properties. Since nothing can be both bent and straight, Lewis concluded $O$ cannot be wholly present at both times. He preferred Perdurantism: the $t_1$-part is bent, the $t_2$-part is straight, and there is no contradiction.

  The weight of this argument rests on two pillars:
  1.  **Intrinsicness:** The properties belong to the object itself, not its relations.
  2.  **Instantaneity:** The properties are had at a specific, durationless instant.

  Your argument attacks the second pillar, and modifies the first, regarding character traits.

  ### 2. The Disanalogy: Shape vs. Character
  Your primary claim is that traits like "cruel" or "generous" are dispositional, whereas shape is categorical.

  **Shape is Categorical and Instantaneous.**
  To be "bent" is a state of being that obtains at an instant. A rod does not need a history to be bent; it just is. Therefore, if the *same* rod is straight later, we have a logical contradiction for an enduring object.

  **Character is Dispositional and Diachronic.**
  To be "generous" is not a state of being at an instant; it is a *pattern of behavior over time*. You cannot be generous in a durationless moment. Generosity implies a counterfactual: "If asked, he *would* give." It implies a history: "He *has tended* to give."

  Because character traits are essentially time-extended, they do not generate the same contradiction.
  *   **At $t_1$ (Youth):** The protagonist is wholly present. He possesses the disposition "self-absorbed." This means that *over a period of time surrounding $t_1$*, he tends to prioritize himself.
  *   **At $t_2$ (Old Age):** The protagonist is wholly present. He possesses the disposition "generous." This means that *over a period of time surrounding $t_2$*, he tends to prioritize others.

  There is no contradiction here because the properties themselves are not defined at an instant. They are "thick" temporal properties. An endurantist can say the *same* man has different temporal patterns at different stages of his life without fracturing him into temporal parts. The property "self-absorbed" doesn't vanish at $t_1$; it describes the era of $t_1$.

  ### 3. The Objection: "Dispositions Are Intrinsic"
  You asked to take seriously the objection that dispositions (like fragility or generosity) count as genuine intrinsic properties. This is a standard move in analytic metaphysics.

  **The Objection:**
  Many philosophers (including Lewis) argue that dispositions are grounded in **categorical bases**. A glass is fragile because of its molecular structure *right now*. That structure is intrinsic and categorical. Similarly, your protagonist is "cruel" at $t_1$ because of his neural/psychological configuration *at that instant*. If that configuration is intrinsic, and it changes at $t_2$, Lewis's PTI applies again. If the man is wholly present at both times, he has incompatible intrinsic neural states.

  **Does this destroy your argument?**
  It threatens it, but it does not destroy it. Here is how much of your original argument survives, based on three distinctions between physical dispositions (fragility) and moral character (generosity).

  #### A. The Problem of "Masking" and Context
  Physical dispositions are relatively stable. A fragile glass is fragile almost everywhere. Moral dispositions are highly context-sensitive.
  A "generous" person might not give money if they believe it will enable an addiction. A "cruel" person might act kindly to manipulate a victim.
  *   **Implication:** Character traits are not purely intrinsic; they are **relational**. They depend on the agent's interaction with the world and their interpretation of it. If the property is partly relational (extrinsic), Lewis's PTI does not apply, because PTI only targets *intrinsic* properties.
  *   **Survival Rate:** High. Character is too messy and context-dependent to be a "strict" intrinsic like shape.

  #### B. The Time-Scale Argument (The Strongest Defense)
  Even if we grant that the *basis* of generosity is an intrinsic brain state, the *trait itself* is not.
  *   **Fragility:** Can be tested in a split second (strike it, it breaks).
  *   **Generosity:** Cannot be verified in a split second. One act of giving does not make a man generous; one act of withholding does not make him cruel.
  *   **Implication:** To predicate "generous" of a person at $t_1$ is actually to make a claim about the interval $t_1 - \delta$ to $t_1 + \delta$.
  *   **Why this saves Endurantism:** Lewis's contradiction relies on properties being had *at an instant*. If character traits cannot be had at an instant, they are not "temporary intrinsics" in the relevant sense. They are **temporary temporals**. An enduring object can easily have different temporal patterns at different times.
  *   **Survival Rate:** Very High. This preserves the core of your intuition. The property itself resists being pinned to a moment.

  #### C. The Gradualism of Character
  Shape change (bent to straight) is often modeled as a sharp contradiction. Character change is rarely a switch flip.
  In your novel, the protagonist likely passes through a long period where he is neither wholly self-absorbed nor wholly generous. He is ambiguous.
  *   **Implication:** Perdurantism thrives on clear boundaries between temporal parts (the bent part vs. the straight part). Endurantism handles vagueness better. The *same* man can harbor conflicting dispositions simultaneously during his transition.
  *   **Survival Rate:** Moderate. This is more about the phenomenology of change than strict metaphysics, but it supports the literary utility of Endurantism.

  ### 4. Why This Matters for Your Novel
  Beyond the metaphysics, there is a moral reason to prefer the Endurantist picture for your story, which PTI fails to capture.

  **Moral Responsibility requires Endurance.**
  If Perdurantism is true, the "young self" and the "old self" are distinct temporal parts of a larger worm. This risks undermining the concept of redemption. If the young worm-part was cruel, and the old worm-part is generous, did the *man* change? Or did one part die and another take its place?
  For redemption to be meaningful, the entity that committed the selfish acts must be the *same entity* (wholly present) that now performs the generous acts. The PTI argument suggests this is impossible for intrinsic properties. However, by showing that character traits are **diachronic dispositions** rather than **instantaneous categorical states**, you clear the metaphysical road for moral continuity.

  ### 5. Verdict: How Much Survives?
  Taking the objection that "dispositions are intrinsic" seriously reduces the strength of your argument, but does not eliminate it.

  *   **If character traits were like fragility** (instantaneous, categorical bases), your argument would fail, and PTI would force Perdurantism.
  *   **However,** because character traits are **frequency-dependent, context-sensitive, and essentially time-extended**, they do not fit the "Temporary Intrinsic" mold Lewis designed.

  **Conclusion:**
  You can confidently argue that Lewis's PTI applies to *geometry*, but not to *biography*.
  Shape is a property of a body at a moment. Character is a property of a life across moments. Therefore, your protagonist can endure as one wholly present substance from youth to old age, changing his dispositions without fracturing his ontology. The "intrinsic" objection survives only if you reduce character to static brain states, but for the purposes of a novel (and arguably for the philosophy of mind), character is defined by action over time.

  **Writing Advice:**
  Lean into the *duration* of the traits. Show scenes where the protagonist's "generosity" is tested over time, not just in a single instant. This dramatizes the metaphysical truth: he is not a snapshot of a property, but a narrative of tendencies. This validates the Endurantist view that he is one man, changing through time, rather than a stack of different men.
