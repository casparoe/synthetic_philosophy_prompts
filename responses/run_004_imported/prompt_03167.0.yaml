prompt: |-
  I keep seeing 'spandrel' invoked in the rationalist blogs and forums I read as a rebuttal to overconfident evolutionary-psychology just-so stories, but tracing it back to Gould and Lewontin's 1979 paper complicated things for me. Gould later acknowledged that their flagship example -- the triangular spaces beneath San Marco's domes in Venice -- had drawn two lines of attack: a terminological one (they are technically pendentives, not spandrels) and a more damaging conceptual one, namely that architectural historians think the builders may have chosen the pendentive solution partly for the decorative surfaces it would create, making it an ordinary design choice rather than an unplanned byproduct. Separately, within three years of that paper, Gould and Vrba felt they needed an entirely new term, 'exaptation,' because 'spandrel' had blurred together two questions that needed to be kept apart.

  Could you reconstruct what was being blurred? I want a precise account of the distinction between why a trait originated and what it is currently useful for -- precise enough to explain why present fittingness for a purpose can never, by itself, show that a trait was built by selection for that purpose rather than merely inherited and later put to use, and why even Gould's own textbook example stayed genuinely contestable on exactly this point.
reasoning: |-
  Here's a thinking process that leads to the explanation of the distinction between "spandrel" and "exaptation":

  1.  **Deconstruct the User's Request:**
      *   **Context:** The user is familiar with rationalist/evolutionary psychology (ev-psych) discourse where "spandrel" is used to critique adaptationist just-so stories.
      *   **Problem:** The user has dug into the source material (Gould & Lewontin 1979) and found complications.
          *   Complication 1: The architectural example (San Marco) is technically inaccurate (pendentives vs. spandrels) and potentially functional (builders might have intended the decoration).
          *   Complication 2: Gould & Vrba introduced "exaptation" shortly after (1982) because "spandrel" was conceptually blurry.
      *   **Goal:** Reconstruct *what* was being blurred. Provide a precise account of the distinction between *origin* (why it arose) and *current utility* (what it does now).
      *   **Specific Requirement:** Explain why present fittingness doesn't prove selection for that purpose, and why the San Marco example remained contestable on this specific point.

  2.  **Analyze the Core Concepts:**
      *   **Adaptation:** A trait evolved *by natural selection* *for* its current function. (Origin = Selection for Function X; Current Use = Function X).
      *   **Spandrel (Gould & Lewontin 1979):** A trait that arises as a necessary structural byproduct of other features, not directly selected for itself. Initially conceived as non-adaptive. (Origin = Architectural necessity/Byproduct; Current Use = Decoration).
      *   **Exaptation (Gould & Vrba 1982):** A trait that is currently useful but was *not* originally shaped by selection for that use. This covers two scenarios:
          1.  A trait that was an adaptation for Function A, now used for Function B (co-opted adaptation).
          2.  A trait that was a non-adaptive byproduct (spandrel), now used for Function B (co-opted spandrel).
      *   **The Blur:** The term "spandrel" in the 1979 paper conflated *origin* (byproduct) with *current utility* (useless or merely filled). It implied that if something is a spandrel, it *remains* functionless or secondary. But if a spandrel gets co-opted for a function, is it still a spandrel? The 1979 language made it hard to talk about a byproduct that *becomes* adaptive later without confusing the timeline.

  3.  **Address the "Why Present Fittingness $\neq$ Selection History" Point:**
      *   This is the core logical gap in adaptationism.
      *   Just because a fit exists (e.g., chin fits a beard, or blood is red and visible) doesn't mean selection *crafted* it for that fit.
      *   It could be a physical constraint (blood *must* be red due to iron chemistry) or a structural necessity (arches *must* have gaps).
      *   To prove adaptation, you need evidence of *history* (phylogeny, fossils, genetic variation), not just current engineering efficiency.

  4.  **Address the San Marco Contingency:**
      *   Gould & Lewontin argued the spaces were structural necessities (byproducts of domes on arches) and the mosaics were just "filled in" later.
      *   Critics argued the architects might have chosen that specific structural *because* it allowed for the mosaics.
      *   If the architects chose the structure *for* the decoration, the decoration space is an **adaptation** (in the architectural sense).
      *   If the architects chose the structure for stability, and *then* decided to paint the gaps, the decoration space is a **spandrel/exaptation**.
      *   The blur: Without knowing the *intent/history* of the builder, looking at the beautiful mosaic doesn't tell you if the space was designed for it or just used for it.

  5.  **Drafting the Explanation (Iterative Process):**

      *   *Introduction:* Acknowledge the user's deep dive. It's accurate. The shift from Spandrel (1979) to Exaptation (1982) is crucial.
      *   *The Core Distinction:* Define the two axes.
          1.  **Origin:** Why did it appear? (Selection for X, Selection for Y, or Non-adaptive Byproduct).
          2.  **Current Utility:** What does it do now? (Function X, Function Y, or Nothing).
      *   *The Blur in "Spandrel":* In 1979, "Spandrel" meant "Byproduct of Origin" + "Currently Non-Adaptive/Filled Incidentally." It didn't have a clean vocabulary for "Byproduct of Origin" + "Currently Adaptive."
      *   *Enter Exaptation:* This term splits the matrix. It allows us to say "This trait is useful now, but that's not why it's here."
      *   *The Logic of Fittingness:* Explain that current utility is compatible with multiple histories. Use the blood color or chin example.
      *   *The San Marco Case:* Apply the logic.
          *   Scenario A (Adaptation): Architect chooses pendentive *to* paint.
          *   Scenario B (Spandrel/Exaptation): Architect chooses pendentive for stability, *then* paints.
          *   The visual evidence (the mosaic) is identical in both. Only the historical record (blueprints, journals, structural alternatives) distinguishes them.
      *   *Conclusion:* Summarize why this matters for Ev-Psych. We can't look at a brain trait and assume it was selected for its current use.

  6.  **Refining the Precision (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say spandrels *can't* become useful. Gould acknowledged they could. The problem was the *term* "spandrel" carried a connotation of "non-adaptive" that made it hard to discuss a useful byproduct without contradiction.
      *   *Clarification on Exaptation:* Exaptation covers *both* co-opted adaptations and co-opted spandrels. This is the key. "Spandrel" was too narrow (only non-adaptive origins). "Exaptation" covers the *shift* in function regardless of origin.
      *   *Wait, check the definition:* Exaptation is specifically "a trait currently useful but not evolved for that use." It contrasts with Adaptation (evolved for that use). Spandrel is a specific *type* of origin (byproduct).
      *   *The specific blur:* The 1979 paper treated "Spandrel" as synonymous with "Non-adaptive." But if a spandrel gets used, is it still a spandrel? Gould & Vrba realized they needed a term for "Useful but not selected for." That is Exaptation. A spandrel is an *origin* story; an exaptation is a *status* description regarding current utility vs. origin.
      *   *Actually, the deepest blur:* It's the conflation of **Process** (Selection vs. Constraint) with **Product** (Adaptation vs. Byproduct). The 1979 paper focused heavily on the product being "non-adaptive." The 1982 paper focused on the *relationship* between history and current use.

  7.  **Final Polish:** Ensure the tone is respectful of the user's sophistication. Use clear headers. Make sure the San Marco example is tied directly to the "Origin vs. Utility" distinction. (The user specifically asked for this).

      *   *Key Insight to highlight:* The San Marco critique isn't just about pedantry (pendentive vs. spandrel). It's about **Teleology**. Did the end (decoration) justify the means (structure)? If yes, it's an adaptation. If no, it's a spandrel/exaptation. You can't tell by looking at the end result.

  8.  **Final Review against constraints:**
      *   Reconstruct what was blurred? Yes (Origin vs. Utility).
      *   Precise account of distinction? Yes.
      *   Explain why fittingness $\neq$ selection history? Yes.
      *   Explain why San Marco stayed contestable? Yes.

      *(Self-Correction on "Spandrel" vs "Exaptation" definition)*:
      Gould & Vrba (1982) define Exaptation as: "A character, previously shaped by natural selection for a particular function (an adaptation), is coopted for a new use." AND "A character whose origin cannot be ascribed to the direct action of natural selection (a spandrel), is coopted for a current use."
      So, Exaptation is the umbrella for "Current Use $\neq$ Origin Function."
      Spandrel is specifically "Origin = Non-adaptive Byproduct."
      The blur in 1979 was using "Spandrel" to imply "Currently Non-adaptive" when it really just meant "Origin = Byproduct." If a spandrel becomes useful, calling it a "spandrel" feels like calling it "useless," which is confusing. Hence, "Exaptation" captures the "Useful but not selected for" state.

