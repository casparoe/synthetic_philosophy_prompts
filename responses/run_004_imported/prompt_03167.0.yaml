answer: |-
  You have correctly identified the precise conceptual friction that led Gould and Vrba to coin "exaptation" in 1982, just three years after the famous "Spandrels" paper.

  The blur you are asking about is the conflation of **etiology** (how a trait originated) with **current utility** (what a trait does now).

  In the 1979 paper, the term "spandrel" was doing too much work. It was simultaneously describing a *mode of origin* (a structural byproduct) and implying a *status of utility* (non-adaptive or incidental). This made it linguistically and conceptually difficult to describe a trait that originated as a byproduct but was subsequently co-opted for a vital function.

  Here is the precise reconstruction of that distinction, why current fittingness cannot prove selection history, and why the San Marco example remains the perfect illustration of this epistemic gap.

  ### 1. The Two Axes: Origin vs. Utility

  To understand the blur, we must separate the history of a trait from its current state. We can map this on two axes:

  1.  **Origin:** Was the trait produced by direct selection for its current form? (Yes = Adaptation; No = Byproduct/Constraint/Drift).
  2.  **Current Utility:** Is the trait currently useful for a specific function? (Yes = Functional; No = Non-functional).

  **The 1979 Blur:**
  In the original "Spandrels" paper, Gould and Lewontin primarily attacked adaptationists for assuming that **Current Utility $\rightarrow$ Origin by Selection.**
  However, their terminology collapsed the categories. They used "spandrel" to mean "a trait that originated as a byproduct." But in the heat of the argument, "spandrel" became synonymous with "non-adaptive trait."

  This created a vocabulary gap: **What do you call a trait that originated as a byproduct (a spandrel) but is now genuinely useful?**
  *   If you call it a "spandrel," listeners hear "useless byproduct."
  *   If you call it an "adaptation," listeners hear "selected for this purpose from the start."

  **The 1982 Solution (Exaptation):**
  Gould and Vrba introduced "exaptation" to resolve this. An exaptation is defined strictly by the mismatch between origin and utility.
  *   **Adaptation:** Origin = Selection for Function X; Current Use = Function X.
  *   **Exaptation:** Origin $\neq$ Selection for Function X; Current Use = Function X.

  Crucially, an exaptation can have two different origins:
  1.  It was an adaptation for *Function A*, now co-opted for *Function B* (e.g., feathers for warmth, later for flight).
  2.  It was a non-adaptive byproduct (a spandrel), now co-opted for *Function B* (e.g., bone sutures, originally structural constraints, later used for birth canal expansion).

  The blur was that "spandrel" could not easily accommodate category #2 without implying the trait remained functionally inert. "Exaptation" allowed them to say: "This trait is useful, but that utility is not its genealogy."

  ### 2. Why Present Fittingness $\neq$ Selection History

  This is the logical core of the critique against Evolutionary Psychology (EP). Adaptationists often argue: *"Trait T performs Function F with high efficiency. Therefore, Trait T was selected for Function F."*

  Gould's distinction proves this syllogism is invalid. Present fittingness is compatible with multiple histories.

  **The Logical Gap:**
  Natural selection is not the only generator of order. Physical laws, developmental constraints, and architectural necessities also generate order and "fit."
  *   **Selection:** The fit exists because variants without the fit died out.
  *   **Constraint:** The fit exists because no other physical configuration was possible.

  **Example:** Human blood is red and visible under the skin.
  *   *Adaptationist Story:* Perhaps redness signals health to mates, or warns predators of toxicity.
  *   *Constraint Story:* Hemoglobin requires iron to bind oxygen; iron-oxide chemistry is red. There is no "selection" for redness; it is a chemical inevitability of the oxygen-transport mechanism.

  If you look only at the **current utility** (e.g., "the redness signals health"), you cannot distinguish between the Adaptationist Story and the Constraint Story. You need **historical evidence** (phylogenetic comparison, fossil records, genetic variation analysis) to determine if the trait was *shaped* for the function or merely *used* for it.

  **The Rule:** You cannot infer the *cause* of a trait's existence solely from its *current consequence*.

  ### 3. The San Marco Contingency: Why the Example Remained Contestable

  This logical gap is exactly why the architectural historians were able to attack Gould's flagship example. The dispute over San Marco was not merely about the word "pendentive"; it was about the **teleology of the builder.**

  Gould and Lewontin's argument relied on a specific timeline of the cathedral's construction:
  1.  **Step 1:** Architects choose the dome and arch structure for structural stability (necessity).
  2.  **Step 2:** This creates triangular gaps (byproducts/spandrels).
  3.  **Step 3:** Mosaic artists fill the gaps with decoration (incidental utility).

  In this timeline, the decoration space is a **spandrel/exaptation**. The utility (decoration) came *after* the structure was determined by other forces.

  **The Historians' Counter-Argument:**
  The historians argued the timeline might be:
  1.  **Step 1:** Architects desire a specific aesthetic effect (vast surfaces for mosaics).
  2.  **Step 2:** Architects choose the pendentive dome structure *because* it creates those surfaces.
  3.  **Step 3:** Construction ensues.

  In this timeline, the decoration space is an **adaptation**. The utility (decoration) drove the selection of the structure.

  **Why Visual Evidence Fails:**
  If you stand in San Marco today and look up, the visual evidence is identical in both scenarios. The "fit" between the architecture and the art is perfect in both cases.
  *   In Scenario A (Gould), the fit is a happy accident (co-option).
  *   In Scenario B (Historians), the fit is the design goal (selection).

  You cannot determine which scenario is true by analyzing the *current fittingness* of the mosaics to the arches. You can only determine it by accessing the **historical record** (blueprints, correspondence, alternative designs considered by the architect).

  ### 4. Application to Evolutionary Psychology

  This is why the "spandrel/exaptation" distinction is the nuclear option against overconfident EP.

  When an EP practitioner says, *"Humans have a chin to deflect blows during fighting,"* they are inferring **Origin** from **Utility**.
  *   **Utility:** Chins might deflect blows.
  *   **Origin:** Did selection shape the chin for this? Or is the chin a byproduct of how the jawbone fuses during development (a structural spandrel) that we later *use* in fighting (an exaptation)?

  Just like the San Marco mosaics, the fact that the chin *works* to deflect blows does not prove it was *built* to deflect blows. It might be a pendentive that we learned to paint.

  ### Summary

  The blur Gould and Vrba corrected was the conflation of **history** with **function**.

  1.  **Spandrel (1979 usage):** Implied "Byproduct of Origin" + "Incidental/Non-adaptive Status."
  2.  **Exaptation (1982 usage):** Decouples the two. Means "Current Utility" $\neq$ "Reason for Origin."
  3.  **The Epistemic Limit:** You cannot look at a trait's current perfection and know if it was **selected for** (Adaptation) or **co-opted** (Exaptation).
  4.  **San Marco:** Remains contestable because the physical evidence (the fit between structure and art) is consistent with both "Structure selected for Art" (Adaptation) and "Art applied to Structure" (Exaptation). Only external historical data can resolve it.

  In evolutionary biology, we rarely have the "architect's blueprints." We only have the finished cathedral. This is why Gould insisted that adaptation must be the *hypothesis of last resort*, not the default assumption.
