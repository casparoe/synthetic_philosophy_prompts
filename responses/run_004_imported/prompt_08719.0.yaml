answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I've had the privilege of knowing [Groom] for about ten years, since we met at a meetup in Boston. Back then, he was one of those people who could explain complex ideas so clearly that you felt smart just listening. Now, he works on making sure artificial intelligence systems cooperate safely. [Bride], as many of you know, works on policy and arms control. She is the kind of person who can quote Thomas Schelling at a dinner party and make it sound like poetry.

  Knowing this crowd, I know I have to be careful. About a third of you are experts in decision theory, and if I get the jargon wrong, I'll never hear the end of it. The rest of you are family who just want to know how they fell in love. So, I'm going to try to bridge that gap.

  There is a concept in bargaining theory called a "commitment race." It sounds abstract, but it's actually very human. Imagine two cars driving toward each other on a narrow road. The driver who can convincingly show they *won't* swerve—maybe by throwing their steering wheel out the window—forces the other driver to yield. They gain leverage by limiting their own options.

  But if both drivers throw out their steering wheels at the same time, you don't get a deal. You get a crash.

  In high-stakes negotiations, or even in early dating, smart people sometimes fall into this trap. They try to commit first, or pretend to care less, to gain the upper hand. It's a race to see who can be the most rigid, the most unyielding. It's efficient for winning a argument, but it's terrible for building a life.

  [Groom] and [Bride] know this theory better than anyone. And by their own admission, for the first few months of dating, their brilliant brains accidentally sabotaged them. They both felt a strong connection, but they both strategically underplayed it. They were caught in a low-stakes commitment race. Each waiting for the other to blink, each afraid that showing too much hand too soon would mean losing leverage.

  It was a standoff of affection.

  But then, something beautiful happened. Independently, without talking to each other, they both sat down to write a letter. Not a text. Not a casual mention. A long, vulnerable letter laying out exactly how they felt. And they mailed them the same week.

  In game theory terms, they didn't try to out-commit each other. They synchronized.

  And that brings us to today. Because if early dating was a commitment race, a wedding is the exact opposite. A commitment race is secret, unilateral, and rushed. It's about forcing the other person's hand.

  But what we are witnessing today is public, simultaneous, and deliberate. You aren't throwing your steering wheels out the window to force a crash. You are standing up in front of everyone who loves you, looking each other in the eye, and saying, "I am choosing this, with you, at the same time."

  You are defusing the pathology. You are turning a competition into a coordination.

  For the family members wondering what this all means: It means that these two are smart enough to know how the world tries to pit people against each other, and wise enough to choose something better. They realized that the best way to win isn't to gain leverage over the person you love. It's to remove the leverage entirely.

  [Groom], [Bride], you have spent your careers studying how to prevent conflict and align complex systems. But the work you're starting today is the most important alignment of all. You've moved past the race. You've found the equilibrium where you both win.

  So, if everyone could please raise a glass.

  To [Groom] and [Bride]. May your commitments always be public, may your decisions always be shared, and may you never have to throw a steering wheel out the window again.

  To the happy couple.
