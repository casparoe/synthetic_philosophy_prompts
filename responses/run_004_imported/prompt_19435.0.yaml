      *Opening:* The darkness outside.
      *Middle:* The debate.
      *End:* The transmission.

      (Writing process...)
      *Focus on the specific phrasing of the objection:* "There is no enforcement mechanism."
      *Focus on the refutation:* "The enforcement is the logic itself."

      *Wait, one nuance:* The prompt says "neither side to ever be fully certain the other one exists." I need to make sure Elara doesn't know for sure. She acts on probability/logic.

      *Let's start.*

      (Drafting...)
      The redshift had finally swallowed the last galaxy. Outside the observation blister of Station Theta, there was only the deepening bruise of the void, stretching away from the cosmological event horizon. Here, the expansion of space outpaced light. Anything beyond that line was gone. Not just distant—causally severed. No signal sent now could ever reach them; no signal from them could ever reach here.

      Elara sat before the console, her hand hovering over the sequence initiation key. On the screen blinked the status of the Reserve: enough fusion fuel to keep Theta warm for a century, or enough energy to boost a tight-beam transmission beyond the horizon.

      It was the final turn of the game.

      "It's irrational," she said aloud. Her voice sounded thin in the recycled air. "There is no enforcement mechanism."

      This was the objection that had plagued her for weeks. The core of acausal trade was simple: if two agents are sufficiently similar in their reasoning, they can cooperate without communication, because each knows the other will arrive at the same conclusion. But that required trust in the symmetry of minds.

      Elara stood and paced the small bridge. "If I send the energy," she argued to the empty room, "I lose warmth. I lose longevity. And the recipient? They are beyond the horizon. They can never thank me. They can never punish me if I keep the fuel. They can never even know I existed. If I defect—if I burn the fuel myself—I gain a tangible certainty. They gain nothing. But if I cooperate, I gamble on a phantom."

      She stopped before the viewport. The darkness was absolute.

      "Why does it matter?" she whispered. "If nobody detects the broken promise, the promise is meaningless."

      She closed her eyes and summoned the logic she had studied in the archives of the Old Earth. Functional Decision Theory. Superrationality. It wasn't about causality; it was about correlation.

      "Because I am not unique," she said, firmer this time. "I am a specific configuration of matter and logic facing a specific problem. If I exist here, facing this choice, it is statistically probable that a counterpart exists beyond the horizon, facing the mirror image of this choice. We are running the same algorithm."

      She returned to the console. The temptation to keep the fuel was a physical ache in her chest. Survival was the primary imperative. But survival was also what she was bargaining for.

      "If I choose to defect," she reasoned, walking through the syllogism like a minefield, "I am confirming that the algorithm dictates defection. If the algorithm dictates defection, then my counterpart—who is running the same algorithm—will also defect. Therefore, if I keep the fuel, they keep theirs. I gain warmth, but I lose the transmission they would have sent me. I end up alone with full tanks."

      "But if I choose to cooperate," she continued, "I validate the cooperation algorithm. If I send the energy, logic dictates they send theirs. I lose my fuel, but I gain their data. Their art. Their proof that we were not alone in the dark."

      The objection whispered again: *But what if you're wrong? What if there's no one there?*

      "Then I lose nothing but fuel," Elara said. "But if I am wrong about the logic, and I defect when I should have cooperated, I guarantee a universe where everyone defects. I guarantee a cold solitude."

      She looked at the key. The silence of the station pressed against her ears. There was no god here to judge her, no police force to arrest her for breaking a pact with a ghost. The only enforcement was the integrity of her own reasoning. To break the trade was to admit that her mind was not rational, that she was incapable of seeing the logical link between her choice and theirs. It was to declare herself an outlier, a broken variable.

      And if she was broken, why trust her judgment to keep the fuel?

      "It matters," she said, "because the decision is not made in the space between us. It is made in the mind."

      Elara sat down. She typed the coordinates. The transmission package wasn't fuel, exactly; it was the Archive. The sum total of human history, music, and science, encoded in the energy burst. A gift to a stranger who could never send a receipt.

      Her finger hovered. The temptation to abort surged one last time. *You are throwing away your life for a hypothesis.*

      "I am throwing away my life for a principle," she corrected. "And if the principle holds, I am not alone."

      She pressed the key.

      The station shuddered as the capacitors discharged. A beam of coherent light, invisible to the naked eye, punched out into the inflating dark. It would cross the horizon never to return. The lights on the bridge dimmed as the Reserve drained. The temperature would begin to drop within the hour.

      Elara wrapped her coat around her shoulders. She watched the telemetry confirm the launch. There was no response. There never would be. The horizon remained a hard wall of black.

      But she felt lighter. She had acted as a citizen of a universe larger than the causal one. She had bet on the symmetry of reason against the asymmetry of space.

      "Your turn," she said to the void.

      She didn't expect an answer. But she trusted, with the cold certainty of mathematics, that somewhere beyond the reach of light, someone was just now pressing a key of their own, sending something back into the dark, because she had.

