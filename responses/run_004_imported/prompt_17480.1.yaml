answer: |-
  You have put your finger on exactly the nerve that most analytic aestheticians have targeted when discussing Tolstoy. Your instinct is correct: this is widely regarded as the most vulnerable point in his argument, and it is absolutely a "soft spot" that has been flagged repeatedly in the literature. However, since you are teaching a grad seminar, you can turn this vulnerability into a incredibly productive discussion about Expression Theory, the Intentional Fallacy, and Moralism.

  Here is a breakdown of the problem, the charitable defenses available, and how the secondary literature usually handles it, which should help you frame next week's session.

  ### 1. The Circularity Objection (The Epistemic Problem)
  You are right to identify the circularity. Tolstoy wants to replace subjective criteria (beauty/taste) with an objective mechanism (infection). But if the *degree* of infection relies on sincerity, and sincerity is a private mental state to which we have no direct access, how do we measure it?

  *   **The Trap:** If we ask, "Was the artist sincere?" Tolstoy's answer effectively becomes, "Were you infected?" If we ask, "Why wasn't I infected?" the answer is, "The artist wasn't sincere."
  *   **The Literature:** This is the standard critique found in mid-20th-century aesthetics. Monroe Beardsley and Wimsatt (in "The Intentional Fallacy") would later argue that relying on the artist's psychological state is a category mistake. Richard Wollheim, in his essay "Tolstoy on Art," is particularly good on this. He argues that Tolstoy conflates the *cause* of the work (the artist's feeling) with the *effect* of the work (the audience's feeling). Wollheim suggests that Tolstoy treats sincerity as a magical property that bridges the gap, but offers no independent test for it.

  ### 2. Is There a Charitable Reading? (The Phenomenological Defense)
  There is a way to read Tolstoy that mitigates the circularity, though it doesn't fully solve it. This involves looking at how Tolstoy uses the word "sincerity" (*iskrennost* in Russian).

  *   **Sincerity as a Perceptible Quality:** Tolstoy often writes as if sincerity is not a hidden mental ghost, but a quality *manifest in the work itself*. He talks about the "force" of the feeling. In this reading, sincerity is the **absence of artifice**. When an artist is insincere, they are "decorating" or "imitating." When they are sincere, the expression is direct.
  *   **The Argument:** A sensitive reader can detect "strain" or "calculation" in a work. Therefore, sincerity isn't inferred *from* infection; rather, the detection of sincerity (as a quality of the texture of the work) is what *allows* the infection to happen.
  *   **The Limit:** This still relies on the subjective judgment of the receiver ("I detect no artifice"), which brings us back to the subjectivity Tolstoy wanted to escape. But it moves the criterion from a hidden mental state to a public feature of the object.

  ### 3. The Moral/Religious Anchor (The "Content" Save)
  This is the most important context for your students. Tolstoy's theory of infection is not the end of the book; it is the mechanism for his moral theory.

  *   **The Shift:** In the latter chapters, Tolstoy argues that even if art is infectious and sincere, it can still be **bad art** if the feeling transmitted is not aligned with the "religious consciousness of the time" (for him, Christian universal brotherhood).
  *   **How this helps the Sincerity Problem:** For Tolstoy, true sincerity is impossible without moral truth. He believes that a person cannot be truly sincere about a "bad" feeling (like exclusive patriotism or lust) in the deepest artistic sense, because those feelings are fragmented and divisive.
  *   **The Objectivity Claim:** Tolstoy thinks he has an objective metric for sincerity because he has an objective metric for Truth (Christian ethics). If the art promotes division, the artist *must* have been insincere or deluded, because the Truth is unifying.
  *   **The Weakness:** Obviously, this just pushes the subjectivity back one step. Now we are arguing about what the "religious consciousness of the time" actually is. But for Tolstoy, this wasn't subjective; it was as objective as math.

  ### 4. Pedagogical Angles for the Seminar
  Since this is a grad seminar, you can use this "flaw" to connect Tolstoy to broader debates in aesthetics:

  *   **Expression Theory:** Connect Tolstoy to Collingwood (*The Principles of Art*). Collingwood tries to fix Tolstoy's problems by distinguishing between "betraying emotion" (shouting in pain) and "expressing emotion" (clarifying it in art). Collingwood also struggles with how we verify the expression.
  *   **The Intentional Fallacy:** Ask your students if Tolstoy commits the intentional fallacy. If the work moves me, does it matter if Tolstoy was actually sincere? (Think of the "actor" problem: An actor can simulate sincerity so well I am infected. Tolstoy would say this is "counterfeit art," but is he right?)
  *   **Moralism vs. Autonomism:** Tolstoy is the ultimate moralist. Use the sincerity criterion to show why he thinks art *cannot* be autonomous. If the artist's soul is corrupt, the art is corrupt, regardless of form.
  *   **The "Professionalism" Critique:** Tolstoy links insincerity to professionalism (writing for money/fame). You can discuss whether the economic conditions of production affect the "sincerity" condition.

  ### 5. Recommended Secondary Sources
  If you want to assign a secondary text or just bolster your own notes:
  *   **Richard Wollheim, "Tolstoy on Art"** (in *Art and Its Objects*): The classic analytic takedown.
  *   **Monroe Beardsley, *Aesthetics: Problems in the Philosophy of Criticism*:** For the intentional fallacy angle.
  *   **George Dickie, *Art and the Aesthetic*:** Dickie is very hard on Tolstoy, specifically regarding the definition of art vs. evaluation of art.
  *   **Vladimir Nabokov's *Lectures on Russian Literature*:** Nabokov hated *What Is Art?* (calling it "one of the most absurd things ever written by a great writer"), but his vitriol is useful for showing the artist's perspective against the theorist's.

  ### Summary for your Students
  You can confidently tell your students: **"Tolstoy wants sincerity to be an objective mechanism, but it functions as a subjective intuition. He solves this by anchoring sincerity in religious truth, which modern readers find unpersuasive, but which is essential to his system."**

  It is a genuine tension in the text, not a misunderstanding on your part. In fact, pointing out that Tolstoy's "objective" theory relies on a private mental state is one of the best ways to show why 20th-century aesthetics moved toward Institutional or Historical definitions of art.

  Good luck with the seminar. It's a great text to teach precisely because it fails so spectacularly in ways that illuminate the problems of aesthetics.
