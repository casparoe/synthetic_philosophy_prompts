  **Move-by-Move Breakdown**

  **1. Jenna (+2):** She nails the classic philosophical objection to penal substitution: the category error between *debts* (fungible, transferable) and *punishment* (retributive, personal). This is the strongest starting position because it attacks the internal logic of the doctrine rather than its evidence.

  **2. Marcus (+1):** He offers real-world analogies to prove substitution isn't "nonsense," which keeps the debate grounded, but his examples are shaky; a draft is a civic duty, not criminal punishment, and vicarious liability is usually financial, not penal suffering, so he doesn't fully refute Jenna's distinction.

  **3. Jenna (+2):** She successfully dismantles Marcus's analogies by insisting on a strict definition of "punishment" as deserved suffering for guilt, correctly identifying that Marcus is subtly swapping in a "cost" model without realizing it.

  **4. Marcus (+1):** He makes a fair theological pivot by noting that Christian language *does* use debt metaphors ("paid for sin"), which saves the *coherence* of the story, but he concedes Jenna's philosophical point that this shifts the doctrine away from strict "penal" retribution.

  **5. Jenna (+2):** She lands the knockout blow by pointing out that if you accept Marcus's move, you've actually abandoned *Penal* Substitution in favor of *Satisfaction* Theory, meaning the specific concept Lewis was interrogating has vanished even if the theology remains.

  **What They're Both Missing**
  Both are debating within a framework of **retributive justice**, ignoring the doctrine of **forensic imputation**. Standard Reformed theology argues that Christ isn't punished as an "innocent third party" but is legally *counted* as the sinner (guilt is imputed), which attempts to solve Jenna's "innocent punishment" objection without resorting to Marcus's "debt" model. They also overlook the difference between **human legal systems** (which forbid substitution) and **divine sovereignty** (where God, as the lawgiver, might set different rules for satisfaction).

  **A Note on David Lewis**
  While David Lewis (the modal realist) was a Presbyterian and wrote on many topics, there is no widely cataloged paper by him titled "Do We Believe in Penal Substitution?" in his standard *Philosophical Papers* or bibliographies; this may be an obscure handout, a misattribution common in online circles, or a confusion with a different philosopher. However, based on Lewis's general analytic style—which prioritized conceptual clarity over theological tradition—he would likely appreciate **Jenna's** rigorous distinction between debt and punishment. Lewis often argued that we should believe only in what our best theories require, and he might view the "penal" aspect as conceptually incoherent unless rigorously redefined, siding with Jenna's demand for logical consistency over Marcus's appeal to historical analogy.
