prompt: |-
  I'm a philosophy PhD student TAing an intro philosophy of religion course this semester, and we just got through Hume's "Of Miracles," which sent me down a rabbit hole that I don't think the secondary lit I've read (Earman, Fogelin, that kind of thing) really addresses head-on: how would Hume's argument actually hold up against the bureaucratic machinery the Catholic Church now uses to certify miracles, as opposed to the kind of testimony he was originally arguing against?

  Like, at Lourdes there's an International Medical Committee of physicians (not all of them practicing Catholics, from what I understand) that reviews thousands of claimed healings and only ever certifies a tiny handful as "medically inexplicable by current science." Something similar happens for canonizations - a board of doctors has to independently sign off that there's no known natural explanation before a case even reaches the theologians. This seems like it should be a much harder case for Hume than the testimony he actually had in mind, since so much of his "in practice" argument in Part 2 of the Enquiry is really an attack on the witnesses themselves - people driven by "the passion of surprise and wonder," reports that trace back to "ignorant and barbarous nations," rival religions' miracles cancelling each other out, etc. Modern medical boards are trying to be the exact opposite of that: trained skeptics with diagnostic tools Hume couldn't have dreamed of, actively hunting for natural explanations and only demurring when they genuinely can't find one.

  So does that kind of institutionalized, quasi-scientific vetting actually satisfy Hume's maxim that the testimony's falsehood would have to be "more miraculous" than the fact it's attesting to, or is there some deeper reason baked into his argument that would make him unimpressed regardless? My office mate, who's way more sympathetic to natural theology than I am, thinks Hume basically looses this one on his own terms, but I can't quite tell if that's right or if it's missing something. Curious what you think Hume himself - not just later defenders like Earman - would actually say if someone sat him down and explained how Lourdes or the Vatican's canonization process works today.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Question:**
      *   **User:** Philosophy PhD student, TAing Intro Philosophy of Religion.
      *   **Context:** Just taught Hume's "Of Miracles" (Section X of *An Enquiry Concerning Human Understanding*).
      *   **Problem:** The standard secondary literature (Earman, Fogelin) focuses on probability theory, testimony, and Hume's original context (ancient miracles, enthusiastic sects). The user is asking about a specific modern counter-example: the Catholic Church's modern bureaucratic/scientific vetting process (Lourdes Medical Bureau, Canonization medical boards).
      *   **Core Question:** Does this modern, rigorous, skeptical, medicalized vetting process overcome Hume's arguments (specifically the "maxim" in Part 1 and the practical objections in Part 2)? Or is there a deeper structural reason Hume would still reject it?
      *   **Goal:** Provide a nuanced, philosophically rigorous response that channels Hume's likely reaction, engaging with both Part 1 (a priori/probabilistic) and Part 2 (a posteriori/psychological/sociological) of his argument, while acknowledging the strength of the user's observation.

  2.  **Deconstruct Hume's Argument (Section X):**
      *   **Part 1 (The Maxim):** "No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact, which it endeavours to establish." This is a probabilistic weighing of evidence. $P(Miracle | Testimony) > P(False Testimony | Testimony)$. Since a miracle is a violation of a law of nature (established by uniform experience), $P(Miracle)$ is extremely low. Therefore, $P(False Testimony)$ must be even lower.
      *   **Part 2 (Practical Observations):** Four reasons why testimony for miracles is always weak:
          1.  No miracle attested by enough men of unquestioned good sense, education, and reputation.
          2.  Human propensity for the marvelous/surprising (psychological bias).
          3.  Miracles abound among ignorant/barbarous peoples (sociological bias).
          4.  Different religions have conflicting miracles (they cancel out).

  3.  **Evaluate the Catholic Vetting Process against Hume:**
      *   **The User's Point:** The Lourdes/Canonization process addresses Part 2 objections directly.
          *   *Education/Reputation:* Doctors are educated, reputable, often non-Catholic.
          *   *Psychological Bias:* They are skeptics looking for natural causes (inversion of the "passion of surprise").
          *   *Ignorance:* Modern medicine is not "ignorant/barbarous."
      *   **The Humean Counter:** Does this address Part 1?
          *   Hume's definition of a miracle: A violation of a law of nature by a particular volition of the Deity or interposition of some invisible agent.
          *   Hume's epistemology: Uniform experience establishes laws of nature.
          *   The "More Miraculous" Maxim: Is it more likely the doctors are wrong (even subtly) or that a law of nature was violated?

  4.  **Formulate Hume's Likely Response (The "Humean Rejoinder"):**
      *   *Concession:* Hume would admit this is *stronger* testimony than the ancient miracles he mocked. He respects science and empirical rigor.
      *   *Part 1 Objection (The Core):* The definition of "Inexplicable" vs. "Miracle."
          *   The Church says: "Medically inexplicable."
          *   Hume says: "Violation of a law of nature."
          *   *Gap:* "Inexplicable by *current* science" $\neq$ "Violation of *established* law." Hume knows science evolves. What is inexplicable today might be understood tomorrow. To call it a miracle requires a metaphysical leap the medical board doesn't make (they stop at "inexplicable," theologians add "miracle").
          *   *Probability:* Even with great doctors, is the probability of error, fraud, or unknown natural cause *lower* than the probability of a law of nature being suspended? Hume thinks uniform experience is *very* heavy weight.
      *   *Part 2 Objection (Institutional Bias):*
          *   The process is still embedded in a religious institution with a vested interest (canonization, pilgrimage revenue, faith promotion).
          *   Selection bias: Thousands of cases, only a few chosen. Are the "failures" published?
          *   The "Non-Catholic Doctor" claim: Hume might ask about the selection process. Are they truly independent or selected for sympathies?
      *   *The "System of Nature" Argument:* Hume views nature as a uniform system. A miracle isn't just a weird event; it's a tear in the fabric. Testimony, no matter how good, relies on human senses/memory, which are fallible. Uniform experience (nature holds steady) is more robust than human testimony (even expert human testimony).

  5.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic, respectful, engaging with the PhD level of the user. Avoid condescension. Acknowledge the sophistication of the question.
