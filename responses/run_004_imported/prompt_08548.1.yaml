answer: |-
  You have stumbled directly into one of the deepest rabbit holes in cognitive science and artificial intelligence. Your intuition is spot-on: this is not just a newsroom management issue; it is a fundamental problem of intelligence itself.

  The short answer is: **Yes, this is a recognized, named, and famously difficult problem.** The longer answer explains why your Managing Editor's "feel" is actually a sophisticated cognitive shortcut that philosophers and AI researchers have been trying to formalize for 60 years without fully succeeding.

  Here is a steer on the concepts, the theories, and the angles for your piece.

  ### 1. The Big Gun: The Frame Problem
  If you only look up one thing, make it **The Frame Problem**.

  Proposed by John McCarthy and Patrick Hayes in 1969, it asks: *When an action occurs, how does an agent determine which facts change and which facts stay the same?*

  In logic, if you state "I painted the door red," you have to explicitly program the rule that "the door handle is still the same color" and "the house hasn't moved." If you don't, a purely logical machine has to assume *anything* could have changed. It creates an infinite regression of checks.

  **In your newsroom:**
  *   **The Action:** Correcting the percentage in Story A.
  *   **The Frame:** What else in the universe of your archive is affected?
  *   **The Problem:** To be logically rigorous, you *do* have to check everything, because logically, that stat might be the linchpin for a conclusion in Story Z from 2018. But checking everything is computationally impossible (for a human or a server).

  The Frame Problem demonstrates that **relevance is not a logical property; it is a contextual one.** There is no formal rule for what matters; there is only what matters *to the goal at hand.*

  ### 2. The Philosophical Defense: Belief Revision & Entrenchment
  You asked if "you build up a feel for it" is a defensible answer. In the philosophy of science, the answer is **yes**, under the framework of **Belief Revision Theory** (specifically the AGM theory named after Alchourrón, Gärdenfors, and Makinson).

  When new information contradicts old information (the stat is wrong), you must revise your "belief set" (your archive). To avoid collapsing the whole system, you rely on **Epistemic Entrenchment**.

  *   **Core Beliefs:** High entrenchment. (e.g., "Gravity exists," "Our outlet's ethical guidelines.") Hard to change.
  *   **Peripheral Beliefs:** Low entrenchment. (e.g., "The unemployment rate was 4.2% in Q3.") Easy to change.

  Your Managing Editor's "feel" was an intuitive assessment of **entrenchment**. She was judging which downstream articles relied on that stat as a *foundation* (high entrenchment) versus those that merely *mentioned* it (low entrenchment).

  **The Catch:** Entrenchment is subjective. It depends on the narrative structure of the newsroom. That is why she couldn't defend it logically to the staff; she was defending a *narrative hierarchy* using *logical terms*.

  ### 3. The Cognitive Science Angle: Bounded Rationality & Heuristics
  This is where you defend the human mind against the machine.

  Herbert Simon (Nobel laureate) coined **Bounded Rationality**. We don't optimize; we "satisfice." We search until we find a solution that is "good enough" given our cognitive limits.

  Gerd Gigerenzer expanded this with **Ecological Rationality**. He argues that heuristics (rules of thumb, or "feel") aren't cognitive flaws; they are adaptive tools.
  *   **The Recognition Heuristic:** "If I recognize this article title as a major investigative piece, the stat probably matters more than if it's a brief."
  *   **The Take-the-Best Heuristic:** "Check the most obvious downstream link first. If that's fine, stop."

  **The Article Angle:** Your editor wasn't being lazy; she was running a compression algorithm. Her brain has indexed thousands of stories and tagged them with metadata like "importance," "dependency," and "risk." When she said "check these three, ignore those five," she was querying her internal index. The staff wanted a SQL query; she gave them a neural net output.

  ### 4. The AI Angle: Why Machines Struggle Here
  You mentioned the automated "related coverage" widget. This highlights the gap between **Syntax** and **Semantics**.

  *   **Machines (currently):** Operate on syntax and tags. If Story B has the same tag as Story A, they are linked. If Story C uses the stat but has a different tag, the machine misses it.
  *   **Humans:** Operate on semantics and causality. We know that a story about "Economic Policy" might rely on an "Unemployment Stat" even if the tags don't match.

  There is a field called **Data Provenance** or **Lineage Tracking** trying to solve this in databases (if Cell A1 changes, highlight Cell B4). But natural language is not a spreadsheet. We are trying to apply spreadsheet logic to prose, and it breaks.

  ### 5. Synthesis: What "Feel" Actually Is
  To answer your specific question: *What does it actually mean about how minds work?*

  It means human intelligence is **prediction-based**, not just logic-based.
  Your brain is a prediction engine (see: *Surfing Uncertainty* by Andy Clark or the work of Anil Seth). It constantly models the world. When a fact changes, your brain runs a quick simulation: *If this is wrong, does my model of the world collapse?*

  *   **Scenario A:** The stat was a decorative flourish. *Simulation:* Model holds. *Action:* Ignore.
  *   **Scenario B:** The stat was the premise of the argument. *Simulation:* Model collapses. *Action:* Audit.

  Your editor's "feel" is the output of that simulation. It feels like instinct because the simulation happens subconsciously and instantly. It is defensible, but only if you accept that **contextual judgment is a valid form of rigor.**

  ### Story Hooks for Your Piece
  If you write this, here are three ways to frame it:

  1.  **The Impossibility of Perfect Truth:** The Frame Problem proves that 100% accuracy requires infinite energy. Journalism (and life) is the art of deciding which errors are survivable. Trust is not the absence of error; it's the agreement on which errors matter.
  2.  **The Human as the Legacy System:** We are rushing to automate newsrooms, but the "audit" function relies on semantic understanding that AI doesn't have. The "feel" is the last moat of human editorial judgment.
  3.  **Epistemic Hygiene:** Treat the newsroom like a immune system. You can't attack every pathogen (error), or you kill the host (productivity). You need T-cells (editors) that recognize *patterns* of threat, not just specific viruses.

  ### Recommended Reading/Search Terms
  *   **The Frame Problem** (Stanford Encyclopedia of Philosophy has a great entry).
  *   **AGM Belief Revision Theory.**
  *   **Gerd Gigerenzer** (specifically *Gut Feelings* or *Risk Savvy*).
  *   **Daniel Dennett** (He wrote extensively on the Frame Problem in *Cognitive Wheels*).
  *   **Knowledge Graphs / Ontologies** (For the technical side of how machines try to map relationships).

  Your editor was right, but for reasons she couldn't articulate. That gap between *knowing* and *explaining* is exactly where your story lives.
