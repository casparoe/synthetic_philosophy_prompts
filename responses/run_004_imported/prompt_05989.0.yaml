answer: |-
  The waiver was printed on paper that felt too smooth, as if it had been polished by water. Elias sat at the edge of the Dry Zone, his legs dangling over the concrete lip that separated the air from the pool. Below him, the Submerged waited.

  They hung in the blue suspension like kelp, motionless, their gills fluttering in rhythmic pulses. They did not look up. To look up was to strain the neck, and efficiency was the first law of the Deep.

  Elias held the pen. The ink was black, permanent.

  "You don't have to decide today," said the technician, standing a respectful distance back. The technician was Dry, like Elias. Unmodified. "The window closes in thirty days. After that, the cartilage calcifies. The graft won't take."

  Elias knew the biology. He also knew the philosophy. He had read the papers on transformative choice, the ones that argued you cannot rationally choose to become a different person. How do you assign value to an experience you cannot imagine, for a self that does not yet exist?

  If he stayed Dry, he remained Elias. He would keep his love for the scratch of wind on skin, the sharp scent of pine, the way sunlight fractured through dust. He would keep his friends, his job, his history. He would be whole, consistent, and increasingly isolated. The Dry Zone was shrinking. The world was warming, rising. The future was wet.

  If he went Under, he would become... something else.

  He had visited Mara last week. She had been Submerged for five years. They had communicated through the glass partition, her hands moving in the fluid sign-language of the Deep. She looked peaceful. Her eyes were wide, adapted to the low light.

  *Is it cold?* he had signed.
  *Temperature is irrelevant,* she had signed back. *There is only pressure.*
  *Do you miss the sun?*
  *The sun is a surface phenomenon. We have the thermal vents.*

  She hadn't said she was happy. Happiness was a Dry concept, tied to dopamine spikes and variable rewards. The Submerged spoke of *equilibrium*. When he asked her if the change was worth it, she had tilted her head, confused.

  *Worth is a transaction,* she had signed. *I did not pay. I changed.*

  That was the bind. The Elias sitting on the concrete loved the wind. The Elias who would exist in the water would not. The future Elias would find the wind chaotic, abrasive, a waste of sensory data. The future Elias would look back at this moment—the pen hovering over the paper—and wonder why the Dry Elias had hesitated. To the future self, the choice would be obvious. To the current self, it was a leap into a void where his own values would be deleted.

  It was not a cost-benefit analysis. It was a suicide of the soul, followed by a resurrection of a stranger who would wear his memories like a borrowed coat.

  "Why do you want it?" the technician asked. It was the question they always asked.

  "I don't," Elias said. "I want to survive. But the thing that survives... it won't be me."

  "Survival is the metric," the technician said.

  "Survival of what?"

  The technician didn't answer. There was no answer. This was the epistemic wall. No one could tell Elias what the pressure felt like, not really. They could describe the physics, the neural mapping, the sensation of oxygen extracting from water. But they could not give him the *qualia*. They could not give him the new preference structure.

  He looked at the waiver. It was a contract between two parties who could never meet. The signer and the signed-for.

  If he signed, he was betting that the stranger he would become would be glad to exist. He was betting on the happiness of a person he would never know, using a currency he would soon no longer possess. It was an act of altruism toward a future ghost.

  If he didn't sign, he was condemning that ghost to non-existence, preserving a self that the world was slowly rendering obsolete. He would be the last of his kind, guarding a museum of sensations no one else could feel.

  He thought of Mara. She hadn't begged him to join her. She hadn't warned him away. She simply existed in her new state, inaccessible to his evaluation. She was the proof that the transformation worked, and the proof that he could not understand it.

  The wind picked up, ruffling the hair on his arms. It felt dry. It felt like *now*.

  Elias realized that rationality had nothing to do with this. Rationality required stable preferences. It required a continuous self to weigh the options. But the choice before him was a discontinuity. It was a bridge that burned as you crossed it.

  To choose rationally was impossible. To choose emotionally was a lie, because his emotions were tied to a world he was leaving.

  So what remained?

  Will.

  Not the will to live, but the will to become. The acceptance that the self is not a fortress, but a river.

  He looked down at the Submerged. They were not waiting for him. They were not hoping. They were simply in equilibrium. If he joined them, he would stop hoping too. He would stop missing the wind. That was the true cost. Not the pain of the surgery, but the loss of the loss. He would lose the ability to grieve the Dry world.

  Was that a tragedy? Or was it peace?

  He couldn't know. He would never know. The Elias who knew the answer was waiting in the water, and he was not Elias anymore.

  The pen felt heavy. It was a tool of the Dry, designed for friction, for paper, for air. Soon, his fingers would be webbed. The pen would slip.

  Elias closed his eyes. He tried to imagine the pressure. He tried to imagine not caring about the sun. He failed. He was trapped in his own skull, banging against the bone.

  But the water was rising. The concrete was eroding. The choice was not between staying and going; it was between ending now or ending later.

  He opened his eyes. He did not sign because he believed it would be good. He did not sign because he believed it would be bad. He signed because the question was not for him. The question was for the one who would come after.

  He pressed the pen down. The ink soaked into the smooth paper, a dark stain that looked like a pupil.

  He stood up. He walked to the edge. He did not look back at the trees, or the sky, or the technician. To look back was to validate the self that was dying.

  Elias stepped off the concrete.

  The air rushed away. The cold hit him first, a shock that made his lungs seize. Then the silence. The world of wind and friction vanished, replaced by the heavy, muffled hum of the deep.

  He sank. His lungs burned. He waited for the panic, the regret, the desperate clawing for the surface.

  The graft engaged. The gills on his neck flared open. The burning stopped. The pressure embraced him.

  He turned his head. The light from the surface was a distant, shimmering coin. It looked beautiful.

  He looked at it for a long moment. He felt a flicker of something. A memory of warmth. A ghost of a preference.

  Then, the current shifted. A thermal vent pulsed nearby, a rhythmic thrum in the water that vibrated through his ribs. It was a complex, rich sensation, singing of mineral and heat and deep time.

  The surface light faded in his attention. It was just light. The vibration was *real*.

  Elias kicked his legs. He did not swim up. He swam toward the vent. He did not wonder if it was worth it. He simply moved, balanced, into the dark.
