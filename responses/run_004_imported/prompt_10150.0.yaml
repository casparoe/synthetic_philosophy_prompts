      *   **Deceased:** Marion, a metaphysician specializing in perdurantism (four-dimensionalism). Died unexpectedly two weeks ago.
      *   **Audience:** Split 50/50. Half are academic metaphysicians (know the jargon, knew her professional persona). Half are family/neighbors (don't know the jargon, knew her personally).
      *   **Speaker:** A colleague. Asked to give main remarks (6-7 minutes).
      *   **Constraints/Requirements:**
          *   Must be metaphysically accurate to Marion's views (no sloppy consolation, no conflating eternalism with perdurantism, no "wholly present" language that implies she's "gone" in a 3D sense).
          *   Must be comforting to the family (who don't know the philosophy).
          *   Must include a specific nod to the academics (Heraclitus/river joke).
          *   Must avoid the Einstein/Besso "illusion" quote (she hated that conflation).
          *   Tone: Respectful, precise, warm, not overly academic but not dumbed down.
      *   **Key Philosophical Concepts:** Perdurantism, temporal parts, "worm" view, problem of temporary intrinsics (straight-backed young vs. bent old), distinction between eternalism and perdurantism.

  2.  **Determine the Core Message:**
      *   *The Challenge:* How to mourn someone who believes they are a spacetime worm? If she's a 4D object, her death is just the end of her temporal extension. She isn't "gone" in the sense of ceasing to exist *simpliciter*; her earlier parts still exist at earlier times.
      *   *The Comfort:* For the family, this means the Marion they knew *still exists* at the times they shared. She isn't erased. For the academics, this is a rigorous application of her life's work.
      *   *The Balance:* Avoid cold abstraction. Use the philosophy to validate memory and love, not to negate grief.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the split room. Validate both groups. Set the tone (honest, precise).
      *   **Addressing the Philosophy (The "Worm"):** Explain perdurantism simply. She isn't a 3D object moving through time; she's a 4D shape.
      *   **The "Death" Event:** On her view, death isn't annihilation. It's the boundary of the worm.
      *   **Addressing the Family (The Comfort):** What does this mean for them? It means the moments they shared are real and fixed. The Marion who laughed with her nieces *is* there, at that coordinate.
      *   **Addressing the Colleagues (The Joke):** Need the Heraclitus/river reference. Heraclitus said you can't step in the same river twice. Marion would say, "You can't step in the same river *once* if you think the river is only the water currently touching your foot." Or something about the river being the whole flow. Let's refine: "Heraclitus worried about stepping into the same river twice. Marion would remind us that the river *is* the whole stretch from source to sea."
      *   **The "Temporary Intrinsics" (Her Signature):** Mention the young/straight-backed vs. old/bent. This connects her life stages. All are equally real parts of the whole.
      *   **Avoiding the Pitfalls:** No "watching over us." No "time is an illusion."
      *   **Closing:** A call to remember the whole worm. A final goodbye that respects the boundary.

  4.  **Refining the Tone:**
      *   *Risk:* Sounding too clinical. "Her temporal parts are located at..."
      *   *Fix:* Use emotional language. "The Marion who held her nieces," "The Marion who argued at the APA."
      *   *Risk:* Confusing the family.
      *   *Fix:* Use metaphors. A movie reel, a loaf of bread, a landscape. Let's go with a landscape or a life-story book. Actually, the "worm" metaphor is hers, so keep it but soften it. "The shape of her life."
      *   *Specific Constraint Check:* She hated the Einstein "illusion" quote. *Do not include it.* She hated sloppy "watching over us." *Do not include it.* She wants accuracy. *Ensure the metaphysics holds up.*

  5.  **Drafting the Content (Iterative Process):**

      *   *Intro:* Welcome everyone. Acknowledge the strangeness.
      *   *Philosophy:* Marion taught us that we are not things that *travel* through time. We are things that *extend* through time.
      *   *For the Family:* This means she isn't gone. The past is real. When you remember her, you aren't conjuring a ghost; you are pointing to a real part of her.
      *   *For the Colleagues:* The Heraclitus bit. The temporary intrinsics bit (young/old).
      *   *Conclusion:* We miss the *end* of the worm, but the worm exists.

