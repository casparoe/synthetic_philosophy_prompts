      *(One last thought)*: Make sure to explicitly mention that grief is the pain of the *current* slice missing the *later* slice, but that doesn't negate the *earlier* slices.

      *Let's write it.*
answer: |-
  Friends, colleagues, family, and neighbors.

  Looking out at this room, I see two distinct groups. In the front rows, I see people who spent thirty years arguing with Marion about the nature of persistence. In the back rows, I see the people who loved her, who knew her as a sister, an aunt, and a friend, and who may have never heard the word "perdurantism" until they read the program for this service.

  Marion would have loved this split. She would have appreciated the friction. But she would also have insisted that we get the story right. She was famously allergic to sloppy comfort. She once gently corrected a grieving widow for saying her husband was "watching over us," not out of cruelty, but out of a fierce dedication to truth. Marion believed that false comfort is an insult to the reality of the person we lost.

  So, I am not going to tell you that Marion is "gone." And I am not going to tell you that time is an illusion. Marion spent her life arguing that we are not three-dimensional objects that travel through time, like ships sailing across a sea. She argued that we are four-dimensional objects that *extend* through time, like roads stretching across a landscape.

  On her view, you are not a thing that exists wholly right now. You are a "spacetime worm." You have parts in the past, parts in the present, and parts in the future. When we say someone has died, we mean that their worm has reached its final temporal boundary. It does not mean the rest of the worm has ceased to be.

  For her colleagues here: Marion's signature puzzle was the problem of temporary intrinsics. How can one person be a straight-backed, vigorous young debater and a bent, gentle old woman? The endurantist says it's a contradiction. Marion said it's simply a matter of location. The young Marion is a real part of the whole. The old Marion is a real part of the whole. Neither is more "real" than the other; they are just located at different temporal coordinates.

  For her family: I know this sounds technical. But what it means, simply, is this: You do not have to worry that Marion has vanished. The Marion who held her nieces when they were babies is not a memory that fades. That Marion is a real, fixed part of the shape of her life. The Marion who argued at the APA is real. The Marion who sat at your kitchen table is real. They are all equally present in the totality of who she was. Grief, on this view, is the pain of our current temporal slice reaching out for a connection that lies further back along the line. It hurts because we are moving, not because she is disappearing.

  She would want me to make sure I get the Heraclitus reference right. Heraclitus said you cannot step into the same river twice. Marion used to joke that Heraclitus was suffering from a lack of imagination. She would say: "You cannot step into the same river *once* if you think the river is only the water touching your feet. But if you see the river as the whole flow from source to mouth, then you step into it exactly one time, and you are in it forever."

  Marion is that river. The flow has reached the delta. The water has met the sea. But the river itself—the whole course of it—remains.

  I know this does not stop the pain. Knowing the geometry of a wound does not heal it. But Marion taught us that accuracy is a form of respect. To pretend she is "wholly here" in our memories would be a lie. To pretend she is "wholly gone" would also be a lie.

  She is here, in the parts of her life that intersected with ours. Those intersections are fixed points in the fabric of things. They cannot be undone. When you remember her laugh, you are not conjuring a ghost; you are pointing to a coordinate where she truly exists.

  So, let us honor her by being precise, and by being brave. Let us acknowledge that we miss the future parts of her worm that we were promised but never got to meet. That loss is real. But let us also take comfort in the fact that the past parts of her are not lost. They are secure.

  Marion argued for thirty years that we are more than the moment we occupy. Today, we bear witness to that truth. She is not wholly present here. But she is wholly real. And for as long as the universe endures, the part of her that loved you is exactly where it always was.

  Thank you.
