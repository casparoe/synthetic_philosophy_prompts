      *Also, need to make sure I don't imply Eternalism (block universe) is the *same* as Perdurantism, though they usually go together. Marion distinguished them. Perdurantism is about *identity* over time. Eternalism is about *existence* of times. I should focus on the identity/part aspect.*
      *Focus:* She is not wholly present *now*. She is wholly *spread out*.

      *The Heraclitus Joke:* "Heraclitus said you cannot step into the same river twice. Marion would say that's because you're thinking of the river as a 3D slice. If you see the river as the whole 4D flow, you step into it exactly once, and you are in it forever." That feels right.

      *The "Temporary Intrinsics":* Mention her signature puzzle. How she was both the vigorous debater and the gentle aunt. Both are real.

  6.  **Final Polish:**
