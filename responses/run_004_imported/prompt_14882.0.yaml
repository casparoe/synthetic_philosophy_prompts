      *   *The "Relocation" Worry:* If I trust my memory of the red wall, am I bootstrapping memory? Descartes would say: You need God to trust memory *as a faculty*. But you use memory to prove God. This *is* the Circle. So applying the Circle solution to Bootstrapping just re-enacts the Circle. This is a crucial point to make.

