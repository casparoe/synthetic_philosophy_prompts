      *   **Logical Equivalence:** Contrapositive ($\forall x (\neg Bx \rightarrow \neg Rx)$). All non-black things are non-ravens.
      *   **Nicod's Criterion:** An instance confirms a universal generalization.
      *   **The Paradox:** Observing a green leaf ($\neg B \land \neg R$) confirms "All non-black things are non-ravens," which is equivalent to "All ravens are black." Therefore, a green leaf confirms "All ravens are black."
