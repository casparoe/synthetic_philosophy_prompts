answer: |-
  Good morning.

  For those who don't know, Mimi left specific instructions for this moment. She was a "Transformer." For forty years, her job was to take complex facts and turn them into pictures anyone could read. She told me that if a statement cannot be verified by observation, it is not a statement of fact. It is poetry. And poetry, she said, belongs in books, not in eulogies.

  So, I cannot tell you she is watching over us. I cannot tell you her spirit continues. I cannot tell you a light has gone out. I do not know if those things are true, and neither did she. To say them would be to violate the standard of clarity she lived by.

  Instead, I have been asked to read her life into the record. She left a chart. In her system, one icon equals one unit of time, or one unit of work. All icons are the same size. Resizing an icon to show importance was, in her words, "a lie of scale."

  So, I will read the chart as she designed it.

  Ninety-six icons for years.
  Forty icons for years at the Institute.
  Four hundred and twelve icons for published charts.
  Three icons for children.
  Five icons for grandchildren.
  Twelve icons for languages her work was printed in.

  She did not resize the icon for the years she was sick. She did not enlarge the icon for the day she met Otto. They are the same size as the Tuesday she burned the toast. To her, they were all simply part of the sequence.

  I am a philosopher. She found my work endlessly funny. She used to tell me that I spent my time analyzing the boat, while she spent her time replacing the planks. She meant that while I studied the theory of knowledge, she was actually building it—making health statistics understandable to miners in Wales and schoolchildren in Ghana.

  She often quoted Neurath's metaphor: We are sailors on a boat at sea. We cannot dock to rebuild the ship from scratch. We must replace the planks while we are still standing on them.

  I think she meant this for tonight, too. We are on the boat. We cannot stop our lives to rebuild them around her absence. We cannot step onto the dry land of metaphysics to find comfort that isn't there. We must replace the plank of her presence with the plank of her memory, while we are still standing here, still grieving, still moving forward.

  She wrote that "a picture unites, a eulogy divides." Words allow for interpretation; pictures show what is. I know I am using words right now. I know that divides us. Some of you are hearing a philosophy lesson. Some of you are hearing a granddaughter say goodbye.

  But if you look at the chart I have described—if you hold that image in your mind—we are all looking at the same thing. We are united by the data of her life.

  Mimi did not believe in ghosts. She believed in what remains.
  Her charts remain in textbooks.
  Her methods remain in design.
  Her family remains in this room.

  She is not here. But the work is. And the work is verifiable. It is physical. It is real.

  Thank you.
