answer: |-
  The timer on the wall counted down in crimson seconds: 04:12.

  Elias sat at the polished steel table, his fingers hovering over the haptic interface. Before him lay the schematic for the joint salvage operation of the *Aethelgard*, a submerged data vault resting on the continental shelf. The profit split was the only variable left undefined.

  "Seventy-thirty," Elias murmured, running another simulation. "If we account for the liability risk on the deep-sea drones, seventy-thirty is the Nash equilibrium. But if I propose sixty-forty, she might accept to avoid arbitration costs."

  He paused. Wait. If he proposed sixty-forty, she might interpret it as weakness. He needed to model her risk tolerance again. He opened a new window, pulling up Kael's bidding history from the last three fiscal quarters. She was aggressive, but was she reckless? The data was ambiguous. He needed five more minutes to run a Monte Carlo simulation on her psychological profile.

  Across the table, Kael wasn't looking at her screen. She was looking at him.

  "Three minutes, Elias," she said. Her voice was flat, devoid of the anxiety humming in his own chest.

  "I'm optimizing," Elias said, not looking up. "If we lock in the wrong ratio now, we lose efficiency on the backend. I just need to verify the contingency clauses."

  "There are no contingencies," Kael said. She tapped her wrist comp. "The protocol requires a binding commitment before the timer hits zero. Once I lock my share, the smart contract executes. No changes."

  "I know the protocol," Elias snapped. He was calculating the exact threshold where Kael would walk away versus where she would fold. If he committed to seventy-thirty first, he claimed the leverage. But if she rejected it, the deal collapsed, and both got zero. He needed to be sure. Certainty was the bedrock of rational decision-making.

  Kael smiled. It wasn't a happy smile. It was the look of someone stepping off a cliff knowing the ground below is soft only for them.

  "I'm locking," she said.

  Elias's head snapped up. "You haven't heard my counter."

  "I don't need to." Kael's fingers danced over her interface. "I am committing to an eighty-twenty split. In my favor. Irrevocably."

  "That's insane," Elias said, his heart rate spiking. "If I reject that, we both walk away with nothing. You're risking a total loss on a ten percent gain."

  "Exactly," Kael said. Her hand hovered over the 'Execute' key. "But you won't reject it."

  "Wait," Elias said. He hadn't finished his simulation. If he rejected her, there was a 15% chance she would blink during the arbitration phase. If he accepted, he lost twenty percent of the revenue. He needed to calculate the expected value of arbitration versus the guaranteed loss. It was a simple equation, but he needed to be sure about the variables. What if she was bluffing? What if the contract had a loophole?

  "Two minutes," Kael said. Her finger descended.

  "Don't," Elias warned. "You're locking in a suboptimal outcome for the partnership. If we negotiate—"

  The screen on Kael's console flashed green. **COMMITMENT RECEIVED. IRREVOCABLE.**

  The air left the room. The dynamic had shifted instantly. Before, the outcome was a probability distribution. Now, it was a binary fact. Kael had burned the bridge behind her. She had removed her own ability to compromise.

  Now the entire weight of the decision rested on Elias. If he said no, the deal died. He would lose everything. Kael would also lose everything, but she had already accepted that cost to force his hand. She had weaponized her own potential loss.

  Elias looked back at his screen. His simulation was still running. *Estimating risk profile... 88% complete.*

  "Make your choice, Elias," Kael said, leaning back. She looked relaxed. She had no more decisions to make.

  Elias stared at the progress bar. *92%...*

  He realized, with a cold sinking feeling, that his caution had become his cage. If he had slammed his hand down five minutes ago, demanding seventy-thirty without checking the liability clauses, Kael would be the one staring at the timer, sweating over whether to accept or walk. He had tried to be rational, to optimize the outcome based on full information. But in a commitment race, information was latency. Latency was defeat.

  *98%...*

  If he rejected her now, he proved she was irrational. But he would be broke. If he accepted, he proved she was brilliant. But he would be poorer.

  The simulation finished. *Recommendation: Reject. Expected value of arbitration is positive.*

  The recommendation was mathematically sound. It was also useless. The math assumed Kael could still be reasoned with. She couldn't.

  Elias looked at the red timer. 00:45.

  He hovered his finger over the 'Accept' key. He knew that in any other context, his diligence would be a virtue. Here, it was the defect that cost him the game. He thought about shutting off the screen, about walking away on principle, but the shareholders wouldn't care about game theory paradoxes. They would only care about the zero balance sheet.

  "Time," Kael said softly.

  Elias pressed 'Accept'.

  The contract finalized. The split was locked. Kael stood up, gathering her tablet. She didn't gloat. There was no point. The structure of the game had done the work for her.

  "See you at the launch site," she said, walking toward the airlock.

  Elias sat alone in the silence of the booth. He looked at his screen, at the detailed report explaining why he should have fought. He closed the window. The profit margin was thinner than it needed to be, and the knowledge that he had lost because he thought too carefully tasted worse than the loss itself. He waited for the timer to reset, wondering if he would be faster next time, or just less careful.
