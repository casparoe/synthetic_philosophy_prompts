answer: |-
  Here are ten interview questions designed for a novelist interviewing a defender of David Lewis's Genuine Modal Realism. They are structured to move from metaphysical foundations to ethical implications, and finally to the philosophy of fiction. Each includes a follow-up question tailored to the standard Lewisian defense she is most likely to offer.

  ### 1. The Incredulous Stare
  **Question:** David Lewis famously acknowledged that his thesis invites an "incredulous stare" from common sense—the intuition that it is simply absurd to believe other worlds are concrete. As a novelist, I ask readers to suspend disbelief constantly, but Lewis argues this intuition carries no real argumentative weight against a useful theory. Do you agree that common sense intuition is philosophically inert here, or does the sheer magnitude of the ontological cost demand we listen to that stare?

  **Anticipated Defense:** She will likely argue that theoretical utility (explaining modality, properties, content) outweighs pre-theoretic intuition, and that "absurdity" is just familiarity bias.
  **Follow-up:** If theoretical utility trumps intuition, are there any ontological claims so counter-intuitive that they *should* be rejected, or is any cost payable if the explanatory power is high enough?

  ### 2. Robert Adams and the Ethics of Actuality
  **Question:** Robert Adams objected that if all possible worlds are equally real, Lewis's indexical analysis of "actual" fails to explain why the suffering in *this* world should matter to us more than equally real suffering elsewhere. If a counterpart of me is tortured in a distant world, that pain is ontologically robust. Why, on your view, am I morally permitted to prioritize preventing suffering here over there?

  **Anticipated Defense:** She will likely argue for "indexical concern": we are causally connected to *this* world, and morality is necessarily local to the agent's spatiotemporal location.
  **Follow-up:** Does that make morality fundamentally selfish or tribal? If I could push a button to alleviate suffering in a nearby world at no cost to me, does your ontology suggest I have no duty to do so?

  ### 3. Fiction, Inconsistency, and Fragmentation
  **Question:** Lewis analyzes what is "true in a story" by looking at the worlds where that story is told as known fact. But as a novelist, I know that drafts are often inconsistent or radically underdescribed. If my novel contains a contradiction, does it fail to pick out a genuine possible world at all? Does this force you into Lewis's "fragmentation" move, where we say nothing is true in the story, or that truth is split across incompatible world-segments?

  **Anticipated Defense:** She will likely admit that inconsistent fictions do not correspond to any single possible world and that we must analyze them via fragmentation or by ignoring the contradictions.
  **Follow-up:** If most complex novels are technically inconsistent or incomplete, does that mean the "worlds" I write about literally do not exist in logical space, undermining the idea that fiction explores possibility?

  ### 4. Discovery vs. Creation
  **Question:** When I build a setting, it feels like an act of creation. But if Genuine Modal Realism is true, every coherent configuration of matter already exists in the pluriverse. Am I not merely discovering a coordinate in logical space rather than creating a world? Does this rob the artist of ontological agency?

  **Anticipated Defense:** She will likely distinguish between creating the *concrete world* (impossible) and creating the *abstract representation* (the text) that directs attention to that world.
  **Follow-up:** So the "world" is eternal and mind-independent, but the "story" is just a map? If so, is the value of literature in the territory it points to, or the specific way it draws the map?

  ### 5. Counterpart Theory and Character Identity
  **Question:** Lewis denies transworld identity; my character in a sequel or an alternate draft is a *counterpart*, not the same person. For a writer, character continuity is the backbone of narrative. If strict identity cannot cross world boundaries, does this dissolve the notion of a coherent character essence? How do we make sense of a character's "arc" if the being at the end is not strictly the being at the start?

  **Anticipated Defense:** She will argue that identity is strict, but *similarity* and causal continuity are what matter for personhood and narrative, not metaphysical identity.
  **Follow-up:** If identity is strict, then in what sense can we say a character "could have done otherwise"? Is moral responsibility in fiction an illusion if the agent who chose differently is literally someone else?

  ### 6. Epistemic Access to Isolated Worlds
  **Question:** If possible worlds are causally isolated from us, how do we have knowledge of them? Abstract objects are causally inert, yet we claim to know math. But you claim these worlds are concrete. What is the bridge that allows a mind in this world to verify truths about a world that cannot interact with it?

  **Anticipated Defense:** She will likely appeal to the Principle of Recombination and modal reasoning: we know what is possible by understanding the constituents of our world and rearranging them.
  **Follow-up:** Is this inference to the best explanation, or a kind of rational insight? If it's the former, couldn't an abstractist theory explain the same data without the concrete ontological baggage?

  ### 7. Quantitative vs. Qualitative Parsimony
  **Question:** Lewis argues we should multiply entities (worlds) rather than kinds (modal primitives) to maintain parsimony. For a storyteller, is a universe containing infinite stories "cheaper" than a universe containing one story with many "maybes"? Does your view suggest that reality prefers quantity of existence over quality of explanation?

  **Anticipated Defense:** She will defend quantitative parsimony, arguing that adding more of the same kind of thing (worlds) is less costly than adding new kinds of things (modal operators).
  **Follow-up:** But if those infinite worlds contain infinite evil, does the quantitative gain justify the qualitative horror of an ontologically real hell for every possible sinner?

  ### 8. The Value of Imagination
  **Question:** If every coherent possibility is already realized somewhere, is imagination just a survey of existing reality? Does Genuine Modal Realism make the fantastic mundane, reducing the "what if" of fiction to a mere "what is, elsewhere"?

  **Anticipated Defense:** She will distinguish between the *act* of imagining (which is creative) and the *content* (which may pre-exist). The value lies in the cognitive engagement, not the novelty of the object.
  **Follow-up:** If the content is pre-existing, does that diminish the sense of wonder? Is the reader's awe essentially a mistake about the novelty of the world they are visiting?

  ### 9. Narrative Tense and the Block Universe
  **Question:** Lewis's worlds are static four-dimensional blocks. But fiction relies on narrative tension and open futures. Does your view force a block-universe perspective that kills narrative suspense ontologically? If the ending already exists in the world-block, is the tension I write merely psychological, not metaphysical?

  **Anticipated Defense:** She will agree that time is a block but argue that suspense is real for agents *within* the block who lack epistemic access to the future.
  **Follow-up:** So the tragedy of a character is fixed eternally? Does knowing this as a writer change how you view the ethics of putting characters through suffering for the sake of a plot?

  ### 10. Pragmatics of Belief
  **Question:** Finally, does believing in Genuine Modal Realism change how you read a tragedy? If the hero dies here but lives in a nearby world, is the death less sad? Does the knowledge of the pluriverse offer any comfort, or does it simply dilute the significance of this actuality?

  **Anticipated Defense:** She will argue that indexicality preserves the sadness; the death is sad *for us* because it happens *here*, regardless of what happens elsewhere.
  **Follow-up:** So ontology offers no consolation? If the pluriverse is real, does that make our local attachments ultimately arbitrary, or does it make them the only thing that *can* matter?
