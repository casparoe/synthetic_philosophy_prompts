answer: |-
  Your reading of Section II is precise, and your skepticism regarding whether Leibniz solves the problem or merely relocates it is shared by many scholars of early modern philosophy. You have identified the central tension in Leibniz's theodicy: the struggle to navigate between the Scylla of **Divine Voluntarism** (which makes goodness arbitrary) and the Charybdis of **Platonic Independence** (which makes goodness external to and constraining upon God).

  To answer your specific question: Yes, there are specific mechanisms in Leibniz's system designed to keep these truths internal to God, thereby attempting to avoid the "second horn" of the Euthyphro dilemma. However, whether this succeeds depends on whether one accepts Leibniz's redefinition of divine omnipotence.

  Here is how Leibniz attempts to internalize the eternal truths, and where the cost you suspect lies.

  ### 1. The Region of Ideas: Truths as Divine Thoughts
  The primary mechanism Leibniz uses to prevent truths from being "external" to God is his doctrine of the **Divine Intellect** (or the "Region of Ideas").

  For Leibniz, eternal truths (logic, geometry, morality) do not exist in a Platonic heaven independent of God, nor are they created *ex nihilo* by a fiat of Will (as Descartes held). Instead, they reside in the Divine Understanding. They are the content of God's thought.
  *   **Internalism:** Since God's understanding is constitutive of His essence, the truths contained within it are internal to God. They are not an external standard to which God must submit; they *are* the structure of God's own mind.
  *   **The Status of Possibles:** Before God wills the creation of the world, all possible worlds exist as ideas in the Divine Intellect. These possibilities have a degree of "reality" or "claim to existence" proportional to their perfection. This claim is not imposed from outside; it arises from the non-contradictory nature of the essences themselves as understood by God.

  In this sense, Leibniz argues that God does not "discover" truths in the way a human mathematician discovers a theorem written in the stars. Rather, the truths are the very way God understands Himself and the possibilities inherent in His own nature.

  ### 2. Essence Precedes Will
  You noted Leibniz's phrase: *"all these follow from his understanding, which does not depend upon his will any more than does his essence."*

  This is the crux of his anti-Voluntarism. For Leibniz, God's Will is guided by His Wisdom.
  1.  **The Intellect** presents all possible worlds and their degrees of perfection.
  2.  **The Will** chooses the best among them.

  If the Will determined the Good, there would be no reason for the choice (violating the Principle of Sufficient Reason, which you likely know as the bedrock of his physics). If the Good were external, God would be subject to Fate.
  Leibniz's middle path is that the "Good" is the **harmony of possibilities** within the Divine Intellect. God is not constrained by an external law; He is constrained by His own nature to act in accordance with His own wisdom. To act against the eternal truths would be for God to contradict His own essence, which is impossible—not because something stops Him, but because it is unintelligible.

  ### 3. Moral vs. Absolute Necessity
  This is where Leibniz attempts to defang the "constraint" objection. He distinguishes between two types of necessity:
  *   **Absolute (Logical) Necessity:** The opposite implies a contradiction (e.g., 2+2=5). God cannot violate this, because it would mean ceasing to be God (ceasing to be rational).
  *   **Moral Necessity:** God is morally necessitated to choose the best world, but not absolutely necessitated. He *could* choose a lesser world (it involves no logical contradiction), but He *would not*, because that would be contrary to His goodness.

  Leibniz argues this preserves freedom. God is not forced by an external chain of causality; He is determined by His own perfection. As he writes in the *Theodicy*, this is a "happy necessity."

  ### 4. Does this solve the Euthyphro problem?
  You asked if this is just relocating the problem. From a strict logical standpoint, one could argue **yes**.
  *   **The Objection:** If God's intellect recognizes certain truths as necessary, is it because they are necessary, or are they necessary because His intellect recognizes them? If the former, necessity is prior to God. If the latter, we return to Voluntarism.
  *   **Leibniz's Defense:** He would reject the dichotomy. For Leibniz, God's intellect and the truths are not two separate things that need bridging. The truths *are* the relations of compatibility between ideas in the Divine Mind. There is no "before" or "after."

  However, the **cost** you sensed is real. Leibniz effectively limits Omnipotence.
  *   **Descartes:** God could have made 2+2=5. (Omnipotence is absolute).
  *   **Leibniz:** God cannot make 2+2=5, because that is not a "thing" that can be done; it is nonsense. (Omnipotence is the power to do all *possible* things).

  Leibniz confronts this cost squarely, particularly in his correspondence with **Des Bosses** and in the **Theodicy**. He admits that God is subject to the Principle of Non-Contradiction and the Principle of Sufficient Reason. He argues this is not a defect but a perfection. A God who could act without reason is not a rational agent but a blind force.

  ### 5. Why this matters for a Physicist
  Given your background, you might appreciate that this metaphysical stance is the precondition for Leibniz's physics.
  *   If Voluntarism were true (Descartes), the laws of motion are contingent and could change if God willed it. Science is possible only because God sustains them, but their necessity is opaque.
  *   For Leibniz, the laws of physics derive from the metaphysical principles of perfection and continuity (which reside in the Divine Intellect). This is why he seeks *a priori* derivations of physical laws (like the conservation of *vis viva*). The universe is intelligible precisely because it is an expression of God's rational understanding, not merely His arbitrary Will.

  ### Conclusion
  Leibniz does not leave the truths external to God; he makes them **constitutive** of God's rational nature. He avoids the "external constraint" horn by arguing that the constraints are internal to the Divine Essence.

  However, your intuition that this is a "cost" is correct. Leibniz sacrifices the absolute sovereignty of the Will (the ability to do the logically impossible) to save the intelligibility of the Good. He accepts that God is "bound" by logic and morality, but he reframes this binding as the very definition of Divine Perfection. Whether this satisfies the Euthyphro dilemma depends on whether one accepts that "God's Nature" is a sufficient terminus for explanation, or if one demands an explanation for why God's Nature is the way it is. Leibniz stops at the former; the skeptic (perhaps like yourself) may wonder about the latter.

  He does not hide this cost; he wears it as a badge of honor against the "tyranny" of voluntarism. But whether it fully escapes the dilemma remains one of the enduring questions of rationalist theology.
