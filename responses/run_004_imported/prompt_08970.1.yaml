prompt: |-
  I'm a PhD student in philosophy working on a dissertation chapter about how Victorian thinkers handled testimonial evidence for phenomena that mainstream science dismissed a priori, and one of my case studies is Henry Sidgwick's involvement with the Society for Psychical Research. I've been reading his inaugural address as the Society's first president, delivered at its first general meeting on 17 July 1882 and printed in the opening volume of the Society's Proceedings, and I keep getting stuck on one stretch of it. My advisor thinks I'm over-reading a few sentences that are really just rhetorical flourish, but I'd like a second opinion before deciding whether to build part of my argument around this passage. Here it is in full:

  "As regards the question of credibility, the important point to bear in mind is that every additional witness who, as De Morgan said, has a fair stock of credit to draw upon, is an important gain. Though his credit alone is not likely to suffice for the demand that is made on it, his draft will help. For we must not expect any decisive effect in the direction at which we primarily aim, on the common sense of mankind, from any single piece of evidence, however complete it has been made. Scientific incredulity has been so long in growing, and has so many and so strong roots, that we shall only kill it, if we are able to kill it at all as regards any of those questions, by burying it alive under a heap of facts. We must keep "pegging away," as Lincoln said; we must accumulate fact upon fact, and add experiment upon experiment, and, I should say, not wrangle too much with incredulous outsiders about the conclusiveness of any one, but trust to the mass of evidence for conviction. The highest degree of demonstrative force that we can obtain out of any single record of investigation is, of course, limited by the trustworthiness of the investigator. We have done all that we can when the critic has nothing left to allege except that the investigator is in the trick. But when he has nothing else left to allege he will allege that."

  What I can't settle is the actual logical shape of the argument here, as opposed to a sentence-by-sentence paraphrase, so three things in particular would help. First, Sidgwick was elsewhere quite careful about probability and evidence, so the De Morgan "stock of credit"/"draft" metaphor presumably means something specific: is he treating independent witnesses as jointly raising the probability of the reported fact, in something like the way several individually unreliable witnesses can corroborate each other, or is the metaphor doing something looser, especially given that he immediately concedes that no witness's "credit alone is not likely to suffice"? Second, how does the "burying it alive under a heap of facts" image relate to Hume's argument in "Of Miracles" that no accumulation of testimony can outweigh the antecedent improbability of a violation of the laws of nature: is Sidgwick implicitly rejecting Hume's structure by suggesting testimony really can accumulate past a very low prior, or is he only describing what it would take to change public opinion as a matter of psychology, leaving Hume's epistemological point untouched? Third, the closing move -- driving the critic down to the single remaining line that "the investigator is in the trick" -- reads to me as though it's meant to carry real argumentative weight, as if exhausting the alternative explanations should make disbelief unreasonable, but I can't tell whether that's a legitimate inference or an elimination trick that quietly assumes the list of alternatives was complete to begin with. I'd appreciate help working through how these three pieces connect as a single line of reasoning rather than three separate observations.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in philosophy.
      *   **Topic:** Victorian thinkers, testimonial evidence, phenomena dismissed by mainstream science, Henry Sidgwick, Society for Psychical Research (SPR).
      *   **Specific Text:** Sidgwick's inaugural address as SPR President (17 July 1882).
      *   **Problem:** Stuck on a specific passage. Advisor thinks it's rhetorical flourish; student suspects deeper argumentative structure.
      *   **Task:** Provide a second opinion on the *logical shape* of the argument, connecting three specific points:
          1.  The De Morgan "credit/draft" metaphor (probability/corroboration vs. loose metaphor).
          2.  The "burying it alive" image (response to Hume's "Of Miracles" vs. psychological strategy).
          3.  The closing move about the investigator being "in the trick" (elimination of alternatives vs. fallacious assumption).
      *   **Goal:** Determine if these connect into a coherent line of reasoning suitable for a dissertation argument.

  2.  **Analyze the Text (Sidgwick's Passage):**
      *   *Sentence 1-2:* De Morgan metaphor. Witnesses have "credit." One isn't enough, but "his draft will help." -> Accumulation of testimony adds weight, even if individual testimony is insufficient.
      *   *Sentence 3-4:* "Scientific incredulity" has deep roots. Can't kill it with one piece of evidence. Must "bury it alive under a heap of facts." -> The barrier is high (prior improbability). Strategy is accumulation.
      *   *Sentence 5:* "Pegging away." Accumulate fact/experiment. Don't wrangle over single cases. Trust the *mass*. -> Methodology: Aggregation over isolation.
      *   *Sentence 6-7:* Limit of demonstrative force = trustworthiness of investigator. If the only objection is "trick," we've done all we can.
      *   *Sentence 8:* "But when he has nothing else left to allege he will allege that." -> Cynical/Realist conclusion about the nature of skepticism.

  3.  **Address Point 1: De Morgan & Probability (Credit/Draft):**
      *   *Context:* Augustus De Morgan was a logician and probability theorist (formalized De Morgan's laws, wrote *Formal Logic*). Sidgwick knew him well (SPR founder).
      *   *Metaphor:* "Stock of credit" = Prior probability of truthfulness/competence. "Draft" = Specific testimony.
      *   *Logic:* Sidgwick isn't saying $P(A|W1) + P(A|W2)$. He's acknowledging the *insufficiency* of single testimony against a strong prior (scientific incredulity).
      *   *Connection:* It's not just loose rhetoric. It's an acknowledgment of Bayesian-style updating (though pre-Bayes in the modern sense). Individual likelihood ratios aren't enough to overcome the prior odds. You need *multiple* independent sources to shift the posterior probability significantly.
      *   *Verdict:* It's a specific probabilistic intuition, not just flourish. It sets up the need for the "heap."

  4.  **Address Point 2: Hume & "Burying it Alive":**
      *   *Hume's Argument:* In "Of Miracles," Hume argues that a uniform experience (law of nature) constitutes a proof against a miracle. Testimony can only outweigh this if the falsehood of the testimony is *more* miraculous than the event. Usually, it's not.
      *   *Sidgwick's Move:* "Scientific incredulity has been so long in growing... strong roots." He acknowledges the *strength* of the prior (the Humean uniform experience).
      *   *Rejection or Circumvention?* He says "we shall only kill it... by burying it alive under a heap of facts."
      *   *Interpretation:* He isn't necessarily saying one *could* theoretically outweigh the prior with a single testimony (which Hume denies). He is saying the *strategy* must be cumulative. Is this epistemological or psychological?
      *   *Nuance:* Sidgwick distinguishes between "common sense of mankind" (psychology/sociology of belief) and "demonstrative force" (epistemology). However, by insisting on the "heap," he implies that the *epistemic weight* of aggregated testimony *can* overcome the prior, whereas Hume suggests the prior is practically insurmountable for miracles. Sidgwick treats "laws of nature" regarding psychical phenomena as *provisional* generalizations, not absolute metaphysical truths. Therefore, the "heap" isn't just persuasion; it's data sufficient to revise the law.
      *   *Verdict:* It's a methodological response to Hume. It accepts the high bar but insists the bar is surmountable via volume, implying the "law" is empirical, not logical.

  5.  **Address Point 3: The "Trick" & Elimination:**
      *   *The Move:* If we maximize methodological rigor, the only remaining objection is fraud ("trick").
      *   *The Inference:* Sidgwick seems to suggest that reaching this point *should* satisfy the rational critic, but predicts they will allege fraud anyway.
      *   *Logic:* This is an *Argument from Elimination* (Inference to the Best Explanation). If $H_1$ (Error), $H_2$ (Illusion), $H_3$ (Misobservation) are ruled out by method, only $H_4$ (Fraud) and $H_5$ (Phenomenon is Real) remain.
      *   *The Twist:* Sidgwick admits skeptics will choose $H_4$ regardless.
      *   *Weight:* Is it a legitimate inference? Only if the list of alternatives is complete. Sidgwick knows it's not logically complete (there could be unknown natural causes), but pragmatically, "trick" is the skeptic's trump card.
      *   *Connection:* This connects to the "heap." One case allows "trick" to remain plausible. A "heap" makes "trick" increasingly improbable (conspiracy of fraud vs. consistent phenomenon).
      *   *Verdict:* It's a rhetorical acknowledgment of the *limit* of the elimination argument. He's saying, "Epistemically, we win here; Sociologically, we still lose."

  6.  **Synthesize the "Logical Shape":**
      *   The three points aren't separate; they form a *dialectic of accumulation*.
      *   *Step 1 (De Morgan):* Establishes the unit of evidence is insufficient alone (Probabilistic constraint).
      *   *Step 2 (Hume/Heap):* Establishes the barrier (Prior Improbability) and the method to overcome it (Cumulative Empiricism).
      *   *Step 3 (The Trick):* Establishes the limit of rational discourse. Even if you meet the epistemic burden, the skeptic retreats to an unfalsifiable hypothesis (Fraud).
      *   *Overall Argument:* Sidgwick is redefining the *burden of proof* for anomalous phenomena. It's not about a "smoking gun" (single case); it's about a statistical/cumulative shift that forces a paradigm change, while acknowledging that paradigm defenders will resort to ad hoc hypotheses ("trick") to protect the core.

  7.  **Drafting the Response:**
      *   *Tone:* Academic, respectful, rigorous (PhD level).
      *   *Structure:*
          *   Introduction: Validate the student's intuition (it's not just flourish).
          *   Section 1: De Morgan & Probability (The Micro-Logic).
          *   Section 2: Hume & The Heap (The Macro-Logic/Epistemology).
          *   Section 3: The "Trick" (The Limit of Rationality).
          *   Synthesis: How they connect (The Strategy of the SPR).
          *   Conclusion: Advice for the dissertation.
      *   *Key Insight to Highlight:* Sidgwick is shifting from *deductive certainty* to *inductive probability* and acknowledging the *sociology of scientific belief* alongside the epistemology. He is essentially outlining a Kuhnian paradigm shift strategy before Kuhn.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "psychological vs. epistemological" distinction on Hume?
      *   *Correction:* Need to be careful. Sidgwick blurs them. He says "common sense of mankind" (psych) but talks about "demonstrative force" (epist). The "heap" serves both. It overwhelms the psychological resistance *because* it overwhelms the epistemic prior. I should argue Sidgwick sees them as linked.
      *   *Check:* Is De Morgan's probability theory relevant?
      *   *Correction:* Yes, De Morgan's *Essay on Probabilities* (1838) discusses testimony. Sidgwick is invoking a specific technical lineage here, not just a banking metaphor.
      *   *Check:* The "Trick" ending.
      *   *Correction:* Make sure to note that Sidgwick isn't saying the skeptic is *wrong* to allege trick, but that it becomes an *unreasonable* stance if the "heap" is large enough. It's a move to shift the burden of proof back onto the skeptic.

  9.  **Final Polish:** Ensure clear headings and direct answers to the three specific questions before synthesizing. (Proceed to generate output based on this thought process).

  *(Self-Correction Note)*: Wait, I need to make sure I don't attribute modern Bayesian terminology too anachronistically, though Sidgwick was well-versed in probability. I should frame it as "cumulative inductive weight" compatible with Victorian probability theory.

  *(Final Plan)*:
  1. Affirm the student's instinct: It is a coherent argument, not just flourish.
