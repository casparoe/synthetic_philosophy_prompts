answer: |-
  This is an excellent passage to hang a dissertation chapter on, and your instinct that there is a rigorous logical structure here—rather than mere rhetorical flourish—is correct. Your advisor's caution is understandable given Sidgwick's often dry, cautious style, but in this specific context (founding a controversial scientific society), Sidgwick is doing precise methodological groundwork. He is outlining an *epistemology of anomalies*.

  The passage is not three separate observations; it is a single, three-stage argument regarding the **accumulation of inductive weight against a strong prior**. Sidgwick is effectively drafting a protocol for how to force a paradigm shift when the phenomena in question violate established "laws."

  Here is an analysis of the logical shape of the argument, addressing your three specific points and then synthesizing them.

  ### 1. The De Morgan Metaphor: Probabilistic Corroboration
  You are right to suspect this is not loose rhetoric. Augustus De Morgan was a logician and probability theorist (author of *Formal Logic* and *An Essay on Probabilities*), and Sidgwick is invoking a specific technical intuition regarding the **combination of testimonies**.

  In Victorian probability theory (following Laplace and Poisson), the credibility of a fact reported by witnesses was often calculated based on the witnesses' individual veracity. However, a single witness, no matter how credible, yields a probability $< 1$. If the antecedent improbability of the event (the "scientific incredulity") is high, a single witness's "credit" cannot mathematically overcome the prior odds.

  Sidgwick's point is that the "draft" (the specific testimony) draws on the "stock" (the witness's general character/competence), but the *value* of that draft is realized only in aggregation. He is arguing for **independent corroboration**. If Witness A and Witness B are independent, the probability of them both being mistaken or deceitful regarding the *same* specific anomaly is the product of their individual error rates, which drops precipitously.

  **Logical Function:** This establishes the *unit* of the argument. A single case is epistemically bankrupt against a law of nature. The "gain" is not linear; it is combinatorial. This sets up the necessity for the "heap" in the next sentence. It is a probabilistic claim: $P(Event | Testimony_1 + Testimony_2) \gg P(Event | Testimony_1)$.

  ### 2. "Burying it Alive": The Humean Response
  This is the crux of your epistemological question. Hume's argument in "Of Miracles" rests on the idea that our experience of the "law" is uniform, constituting a "proof," whereas testimony is always fallible. Therefore, the falsehood of the testimony is always more probable than the violation of the law.

  Sidgwick's "heap of facts" is a direct methodological counter to Hume, but it operates on two levels:

  1.  **Epistemological:** Sidgwick treats "laws of nature" not as metaphysical necessities (which Hume sometimes implies they are treated as by the vulgar) but as **generalizations from past experience**. If "scientific incredulity" is based on past experience, it can be overturned by *new* experience. However, because the past experience is vast ("long in growing"), the new experience must be massive to revise the generalization. He is accepting Hume's weight of the prior but rejecting the idea that the prior is insurmountable.
  2.  **Psychological/Sociological:** Sidgwick explicitly mentions the "common sense of mankind." He recognizes that scientific belief is a social ecosystem. A single anomaly is treated as an outlier (noise). A "heap" of anomalies forces a reclassification of the data as signal.

  **Logical Function:** This establishes the *strategy*. You cannot defeat a high prior with a high likelihood ratio from a single event (Hume's point). You must defeat it with a **cumulative likelihood ratio**. Sidgwick is arguing that while Hume is right about *single* testimonies, he is wrong about *aggregated* testimonies. The "heap" is not just persuasion; it is the only way to mathematically and empirically shift the posterior probability enough to revise the "law."

  ### 3. The "Trick": The Limit of Elimination
  Your suspicion about the "elimination trick" is astute. Sidgwick is employing an **Inference to the Best Explanation (IBE)**, but he is acutely aware of its limits.

  The logical structure here is:
  1.  We have a phenomenon $X$.
  2.  Explanations $A$ (illusion), $B$ (error), and $C$ (misobservation) are eliminated by rigorous method.
  3.  The remaining natural explanations are $D$ (Fraud/Trick) or $E$ (Genuine Anomaly).
  4.  If the "heap" is large enough, $D$ becomes increasingly improbable (requiring a conspiracy of fraud across many independent investigators).
  5.  Therefore, $E$ should be accepted.

  However, Sidgwick's closing sentence ("But when he has nothing else left to allege he will allege that") acknowledges a **logical asymmetry**. The hypothesis of "Fraud" is unfalsifiable in the limit. A skeptic can always posit a fraud that is undetectable.

  Sidgwick is not claiming that reaching this point *logically compels* belief. He is claiming it **shifts the burden of proof**. Once methodological rigor has eliminated standard error, the skeptic must move from "Show me the evidence" to "Prove a negative (that no trick occurred)." Sidgwick is arguing that at this stage, the skeptic's position becomes *pragmatically* unreasonable, even if it remains *logically* possible.

  **Logical Function:** This establishes the *boundary of rational discourse*. It admits that the argument cannot achieve deductive certainty. It aims instead for a point where disbelief requires more faith (in a vast, undetectable conspiracy) than belief.

  ### Synthesis: The Coherent Line of Reasoning
  Your advisor may see these as separate rhetorical points, but they form a cohesive **Bayesian-style argument for paradigm change** (avant la lettre). Here is how they connect:

  1.  **The Constraint (De Morgan):** Individual evidence is weak against strong priors. (You can't win with a single case).
  2.  **The Method (The Heap):** To overcome the strong prior (Hume's law), you must aggregate independent evidence until the cumulative weight forces a revision of the prior. (You win by volume).
  3.  **The Limit (The Trick):** Even when the cumulative weight makes the anomaly the best explanation, the skeptic can retreat to an unfalsifiable ad hoc hypothesis (Fraud). (You win the epistemic argument, but you may lose the sociological one).

  Sidgwick is essentially arguing that the SPR's job is not to produce a "smoking gun" (which skeptics will always call a trick) but to create a **statistical inevitability**. He is moving the debate from the *quality* of individual instances (which invites Humean skepticism) to the *quantity* of instances (which invites probabilistic acceptance).

  ### Dissertation Advice
  You should absolutely build part of your argument around this. It demonstrates that Sidgwick was not merely a credulous spiritualist nor a dry utilitarian, but a sophisticated methodologist trying to carve out a space for anomalous data within an empiricist framework.

  **To strengthen the chapter, consider:**
  *   **Contextualize De Morgan:** Briefly reference De Morgan's *Essay on Probabilities* (1838) to show Sidgwick is using a technical metaphor, not a banking one. This validates your reading of Point 1.
  *   **Contrast with Hume:** Explicitly frame the "heap" as a response to Hume's "uniform experience." Sidgwick is treating "laws of nature" as inductive generalizations that are vulnerable to sufficient counter-data. This validates Point 2.
  *   **The "Trick" as Ad Hoc:** Frame the closing sentence as an identification of a **degenerating research program** (to borrow Lakatos's term). The skeptic, by constantly alleging "trick" without evidence in the face of a "heap," is protecting the core of their theory from falsification. Sidgwick is pointing out that this protection has become unreasonable. This validates Point 3.

  **Conclusion:**
  This passage is Sidgwick's methodological manifesto. It admits the Humean difficulty, proposes a probabilistic solution (accumulation), and honestly assesses the sociological limits of that solution. It is not rhetorical flourish; it is the logical engine of the SPR's early mission. Your reading is the stronger one.
