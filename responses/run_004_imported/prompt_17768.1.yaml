answer: |-
  Here is the substantive core of the argument, structured for a character who knows the literature. This is based primarily on the work of **Sharon Street** (specifically her "Darwinian Dilemma") and **Richard Joyce**, refined to handle the "Math/Logic" objection (often associated with **Erik Wielenberg** or **David Enoch**).

  The key to making this technical rather than simplistic is shifting the focus from *origin* ("we evolved this") to *epistemic justification* ("why do we think this is true?").

  ### The Core Argument: The Evolutionary Debunking Argument (EDA)

  **1. The Causal Premise (The Genealogy)**
  Our moral faculties and specific moral judgments (e.g., "care for your children," "cooperate with your tribe," "don't kill without cause") are the product of natural selection. They were selected because they conferred a reproductive advantage, not because they were "true."

  **2. The Realist Premise (The Target)**
  Moral Realism claims that moral truths are *mind-independent*. They exist regardless of what humans think or feel. (e.g., "Torturing babies for fun is wrong" is true even if no humans exist to believe it).

  **3. The Epistemic Gap (The Debunking)**
  If (1) and (2) are true, there is no explanatory connection between the *moral truths* and our *moral beliefs*.
  *   Evolution explains why we believe X.
  *   Moral Realism posits that X is true independently.
  *   But Evolution does not "see" the Moral Truths; it only sees Fitness.
  *   Therefore, the fact that we believe X is fully explained by fitness. The existence of the Moral Truth is explanatorily redundant.

  **4. The Conclusion (Defeat)**
  Because our moral beliefs are fully explained by a process (evolution) that is indifferent to moral truth, we have no reason to trust that our moral beliefs align with those mind-independent truths. Our confidence is defeated.

  ***

  ### Handling the "Math/Logic" Objection

  This is the part your character needs to nail. The objection is: *"Evolution also shaped our capacity for logic and math. We believe 2+2=4 because it's true and helps us survive. Why is morality different?"*

  **The Counter-Argument: Sensitivity and Tracking**
  The difference lies in **counterfactual sensitivity** (often called "tracking").

  *   **In Math/Logic:** The truth of the belief is *causally relevant* to survival in a way that forces alignment.
      *   *Example:* If I am a predator avoiding prey, and I miscount the number of predators (believing there is 1 when there are 3), I die.
      *   *The Test:* If the mathematical facts were different (e.g., if 2+2 actually equaled 5 in this universe), our survival would depend on believing *that* instead. Our beliefs *track* the facts because the facts govern the physical causality we need to navigate.
  *   **In Morality:** The truth of the belief is *not* causally relevant to survival in the same way.
      *   *Example:* Evolution selects for "care for your offspring." This helps genes propagate.
      *   *The Test:* If the mind-independent moral facts were *different* (e.g., if the objective moral truth was "parents ought to eat their young"), evolution would **still** select for the belief that "parents ought to care for their young." Why? Because caring for young aids survival, regardless of what the "moral truth" is.
      *   *The Result:* Our moral beliefs are **insensitive** to the moral truth. We would hold the exact same moral beliefs even if the moral facts were the complete opposite.

  **The "Pre-Established Harmony" Trap**
  If the Realist insists our moral beliefs *do* align with truth, they have to argue for a miraculous coincidence: that the things that helped us survive (cooperation, kin-altruism) just *happened* to align perfectly with the mind-independent moral truths. This is a "pre-established harmony" with no mechanism to explain it. It is intellectually bankrupt to rely on cosmic luck.

  ***

  ### Character Beats & Phrasing Ideas

  Here is how you might translate that substance into your character's voice without it sounding like a lecture transcript.

  **On the Origin vs. Justification:**
  > "You're confusing the *cause* of the belief with the *reason* for the belief. I don't care that you feel certain murder is wrong. I care about the mechanism that installed that certainty. If I install a belief in your head via hypnosis, you might feel certain, but you aren't justified. Evolution is just slow, genetic hypnosis. It installs beliefs that work, not beliefs that are true."

  **On the Math Objection (The Knockout):**
  > "Don't give me the arithmetic defense. That's the first refuge of the scared realist. Yes, we evolved to count. But if the physical laws of the universe were different—if two rocks plus two rocks made five rocks—evolution would have wired us to believe that. Our math tracks reality because reality punishes math errors with death.
  >
  > "But morality? If the objective moral truth was actually that 'suffering is good,' evolution wouldn't care. It would still wire us to hate suffering, because tribes that hate suffering stick together and outbreed tribes that don't. We would believe exactly what we believe now, even if the moral truth were inverted. That means we aren't tracking truth. We're tracking fitness. And you can't get truth out of fitness."

  **On the "Cosmic Coincidence":**
  > "So you're asking me to believe in a miracle? That the blind, bloody grind of natural selection just *happened* to stumble onto the exact same values that exist in the platonic heavens? That the things that helped us fuck and fight and not die are the exact same things that are 'Objectively Good'? That's not philosophy. That's theology without the decency to name a god."

  ### Key Philosophical Terms to Drop (Optional)
  If she wants to sound like she's reading from the syllabus before she burns it:
  *   **"Explanatorily redundant"**: The moral truth adds nothing to the explanation of why we believe.
  *   **"Counterfactual insensitivity"**: We'd believe it even if it were false.
  *   **"Pre-established harmony"**: The implausible alignment of fitness and truth.
  *   **"The Darwinian Dilemma"**: (Street's term) Either evolution influenced our morals (debunking them) or it didn't (which is scientifically false).

  ### Summary for the Author
  To make this work in the novel, the cynic needs to make sure the interlocutor understands that **Realism** requires moral truths to exist *outside* of human opinion. If the interlocutor slides into "Morality is just what we agree on," the cynic wins by default. The argument only works against the guy who thinks Morality is as real as Gravity.

  The math objection is the strongest shield the Realist has. Your character defeats it by showing that Math is constrained by physical causality (you die if you're wrong), whereas Morality is constrained only by social cohesion (you thrive if you're wrong, provided the tribe agrees with you). Therefore, Math tracks truth; Morality tracks agreement.
