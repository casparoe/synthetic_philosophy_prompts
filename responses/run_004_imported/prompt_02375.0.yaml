answer: |-
  Alan Turing is briefing the construction crew on the lab for the 1950 Imitation Game experiment.

  "Okay, soundproof the walls. Blackout the windows. And line the entire interior with six inches of lead."

  The foreman wipes his brow. "For radiation, Professor?"

  "No," Turing says, checking his clipboard. "For thoughts. The statistical evidence for telepathy is overwhelming."

  "You're worried the *computer* will read our minds?"

  "Heavens no. I'm worried the *human contestant* will. If he clairvoyantly guesses the interrogator's cards, the machine fails the test unfairly. I need a telepathy-proof room."

  The foreman pauses, hammer in hand. "So... you're inventing Artificial Intelligence, but you're safeguarding against Actual Magic?"

  "Precisely. I can program a machine to think. I can't program a human to stop being a psychic. Now hurry up. If the human cheats via ESP, the whole paper looks like fiction."

  "But Professor," the foreman says, "if you have to build a telepathy-proof room to run the test... haven't you already proven the human is the magic one?"

  Turing sighs, adjusting his tie. "Don't be absurd. The statistics are overwhelming. Now hand me the lead."
