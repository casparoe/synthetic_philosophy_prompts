answer: |-
  This is a profoundly rich dramatic situation. You are asking for a reconciliation of Sidgwick's *hope* (the ethical necessity of a moral order) with his *intellect* (the rigorous, almost painful demand for evidence).

  To reconstruct Sidgwick's response to the Bem/Wagenmakers episode, we must look at him not as a spiritualist, but as a **critical empiricist trapped by an ethical dilemma**. He did not research psychical phenomena because he was gullible; he did so because he was desperate for the universe to be moral, yet too honest to pretend it was so without proof.

  Here is a reconstruction of how Sidgwick would likely analyze the 2011 controversy, anchored in his specific philosophical and methodological commitments.

  ### 1. On the Statistics: The Weight of Testimony vs. Antecedent Improbability
  Sidgwick was a mathematician (he was 12th Wrangler at Cambridge) before he was a moral philosopher. He understood probability, though not in the modern inferential sense. However, he was deeply read in Hume, and his approach to miracles (and psi) was Humean: *No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous than the fact which it endeavors to establish.*

  **The Verdict:** Sidgwick would side with **Wagenmakers and the Bayesian critique**, not because he understands Bayes Factors, but because he understands the *logic of antecedent improbability*.

  *   **Why:** In the Creery sisters case, Sidgwick initially accepted the results because the controls seemed sufficient. When the signaling was revealed, he didn't cling to the hope; he accepted that the *prior probability* of telepathy was so low that even a small loophole (signaling) destroyed the evidence.
  *   **Application to Bem:** He would view Bem's reliance on $p < .05$ as a category error. For a mundane psychological effect, $p < .05$ is sufficient. For precognition (which violates causality), the standard must be exponentially higher. He would see Wagenmakers' argument—that the data was too weak to overcome the low prior probability of psi—as a mathematical formalization of his own intuition during the Creery investigation. He would likely remark that "significance" is not "proof," and that a statistical artifact is indistinguishable from a medium's trick if the methodology allows for it.

  ### 2. On Methodology: Preregistration as the Modern "Control"
  The founding of the SPR was, in essence, an attempt to solve the **file-drawer problem** of the 19th century. Spiritualists published the hits; skeptics buried the misses. Sidgwick's innovation was to demand systematic recording of *all* trials, successful or not.

  **The Verdict:** He would view **preregistration** as the ultimate vindication of the SPR's original mission, and the lack thereof in Bem's initial work as a regression to pre-SPR standards.

  *   **Why:** Sidgwick was obsessed with "sources of error." In the 19th century, the source was sensory leakage or conscious fraud (as with the Creerys). In the 21st century, he would quickly identify "p-hacking" and "researcher degrees of freedom" as the modern equivalent of sensory leakage. It is unconscious signaling.
  *   **Application to Bem:** He would argue that without preregistration, the researcher is effectively acting as both medium and investigator. The ability to stop data collection when significance is reached, or to choose covariates post-hoc, is akin to a medium deciding when a "message" has been successfully received. He would see the Replication Crisis not as a failure of science, but as the scientific immune system finally attacking a pathogen that the SPR had identified a century prior: **selection bias.**

  ### 3. On the Ethical Stakes: The Dualism of Practical Reason
  This is the emotional core of your character. In *The Methods of Ethics*, Sidgwick concludes that if death is the end, and there is no divine sanction, then "Prudence" (self-interest) and "Benevolence" (duty) are ultimately irreconcilable. It is rational to be selfish in a godless universe. He investigated psi to find the "moral order" that would make duty rational.

  **The Verdict:** The failure of Bem's results to replicate would be **personally devastating but intellectually satisfying.**

  *   **Why:** Sidgwick suffered from what his biographer called a "fundamental melancholy." He *wanted* psi to be true. But he valued Truth over Comfort.
  *   **Application to Bem:** If told that the Replication Crisis suggests precognition is likely null, he would not retreat into dogma. He would accept that the "Moral Order" remains unproven by empirical science. However, he would find a grim comfort in the *process*. The fact that the scientific community eventually corrected the record (via failed replications and Bayesian critique) proves that **Reason is self-correcting**, even if it doesn't prove Immortality.
  *   **The Twist:** He might argue that the *failure* of psi research to yield definitive proof is itself a moral test. If the spiritual world forced itself upon us with undeniable evidence, faith would be unnecessary. The ambiguity preserves human freedom. (This is a known theological argument Sidgwick entertained).

  ### 4. Synthesis for Dialogue
  If you are writing the "spirit" of Sidgwick (or the historian channeling him), his voice should be precise, weary, but unflinching. He should not sound like a skeptic debunking magic, but like a moralist disappointed that the universe remains silent.

  **Key thematic points for the dialogue:**
  1.  **Continuity of Error:** He should note that the "p-hacking" of 2011 is the great-grandchild of the "table-tipping" of 1880. Both are products of human desire imposing pattern on noise.
  2.  **The Bayesian Intuition:** He should express that "extraordinary claims require a standard of evidence that mere convention cannot satisfy."
  3.  **The Ethical Cost:** He should admit that without psi, his ethical system hangs in the void. But he would insist that hanging in the void is more honest than clinging to a statistical illusion.

  **Sample Dialogue Fragment (Sidgwick's "Voice"):**

  > "You ask if I am vindicated? No. Vindication implies I wished to be right. I wished only to be certain.
  >
  > "This Mr. Bem... he treats probability as a gate that opens with a key of point-zero-five. But the lock is not so simple. When one claims to see through time, one does not merely challenge a hypothesis; one challenges the architecture of causality itself. To overturn such a structure, a whisper of statistical significance is not enough. One requires the roar of the undeniable.
  >
  > "The Bayesians... they understand what we understood when the Creery girls were found signaling. They understand that the improbability of the miracle must be weighed against the fallibility of the observer. In my day, the observer could be bribed. In yours, it seems, the observer can be unconsciously bribed by the data itself. You call it 'p-hacking'; I call it the old human talent for hearing what we wish to hear.
  >
  > "Does this dishearten me? It leaves the Dualism unresolved. Duty and Self-Interest remain at war, with no divine referee to blow the whistle. That is a cold comfort for a moralist. But if the choice is between a comforting illusion and a rigorous truth, the Society I founded was built on the promise to choose the latter. If the universe is silent, let it be silent. We must not teach it to speak in tongues it does not know."

  ### Summary of Sidgwick's Stance for Your Novel
  *   **Sympathies:** With the Bayesian/Replication camp (Wagenmakers), based on the logic of antecedent improbability.
  *   **On Safeguards:** He would view Preregistration as the necessary evolution of the SPR's original protocols to prevent "unconscious fraud."
  *   **Emotional Tone:** Melancholy acceptance. The hope for a moral order is unfulfilled, but the integrity of inquiry is preserved.
  *   **The "Cross-Correspondence" Mirror:** You can draw a parallel in your novel: The Cross-Correspondences were an attempt to bypass fraud by fragmenting the message. The Replication Crisis shows that even fragmented data (meta-analysis) cannot save a phenomenon if the foundational methodology is flawed. Sidgwick would see both as attempts to solve the same problem: *How do we trust the messenger?*

  This approach keeps Sidgwick consistent: he is a man who sacrificed his own peace of mind for the sake of methodological rigor. He would rather have a false negative than a false positive.
