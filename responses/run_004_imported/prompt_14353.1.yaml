answer: |-
  **MEMORANDUM**

  **TO:** The Faculty Senate
  **FROM:** Chair, Ad Hoc Committee on Governance Innovation
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Futarchy Curriculum Pilot Proposal

  **I. Executive Summary**

  The Ad Hoc Committee has reviewed the joint proposal from the Departments of Economics and Computer Science to pilot a "futarchy" governance mechanism for the selection of the new General Education curriculum. The proposal suggests the Senate fix a welfare metric (five-year graduation rate, weighted for first-generation students) and delegate the final choice between the two curricula to a campus-wide prediction market.

  After deliberation, the Committee recommends **narrowing the pilot**. We advise the Senate to authorize the prediction market and the metric selection, but to classify the market's outcome as **presumptive rather than automatic**. Furthermore, approval is conditional on the implementation of specific design safeguards regarding market liquidity and metric composition.

  **II. Rationale for Narrowing**

  The Committee acknowledges the theoretical elegance of the proposal. Robin Hanson's futarchy offers a compelling division of labor: democratic bodies define "value" (the welfare metric), while markets aggregate dispersed information to determine "fact" (which policy maximizes that metric). In principle, this insulates empirical decision-making from political grandstanding.

  However, the Committee identifies two structural vulnerabilities in the current proposal that render a *binding* pilot epistemically unsound and institutionally risky:

  1.  **Market Thinness and Manipulation:** A campus-limited market of "at most a few hundred realistic traders" is structurally thin. In financial theory, thin markets are prone to volatility and manipulation. A well-funded interest group (e.g., a textbook publisher, a specific departmental faction) could move prices disproportionately to their capital, decoupling the price from the probability.
  2.  **Temporal Horizon:** A five-year resolution horizon is exceptionally long for a prediction market. Without interim liquidity events or payouts, traders lack feedback loops to correct their positions. This encourages speculation based on narrative rather than evidence.
  3.  **Goodhart's Law:** When a measure becomes a target, it ceases to be a good measure. A sole focus on graduation rates, even weighted, creates perverse incentives (e.g., grade inflation, curricular dilution) that could raise the metric while lowering educational quality.

  **III. Required Design Safeguards**

  To proceed, the pilot must adopt the following safeguards:

  1.  **Liquidity Subsidy:** The University must act as a market maker, providing subsidized liquidity to ensure that price movements reflect information rather than capital imbalances. Without this, the "wisdom of crowds" cannot function among a small population.
  2.  **Composite Metric:** The welfare metric must be expanded beyond graduation rates to include standardized learning outcome assessments and post-graduation employment/graduate school placement data. This mitigates the risk of gaming the metric at the expense of educational rigor.
  3.  **Integrity Circuit Breaker:** The market outcome is presumptive. The Senate retains the authority to override the market decision *only* upon a supermajority vote (2/3) finding evidence of market manipulation or structural failure. This preserves the market's authority while maintaining fiduciary oversight.

  **IV. The Strongest Objection to This Recommendation**

  The most serious objection to our recommendation comes from the proposal's strongest proponents. They argue that by making the market outcome **presumptive** rather than **automatic**, and by retaining a Senate override, we reintroduce the very political contingency futarchy is designed to eliminate.

  If the Senate can override the market, traders will not trade based on the curriculum's efficacy, but on their prediction of the Senate's *reaction* to the trade. This transforms the mechanism from a futarchy into a standard polling instrument, stripping it of its unique governance value. Essentially, the objection holds that a "safeguarded futarchy" is a contradiction in terms; it is merely a traditional vote with an extra step. If we are not willing to bind ourselves to the outcome, we are not testing the mechanism, and we risk legitimizing a process that we ultimately ignore.

  **V. Committee Response to Objection**

  The Committee accepts that our recommendation compromises the theoretical purity of the mechanism. However, we argue that **institutional fiduciary duty outweighs experimental purity.**

  Futarchy relies on efficient market conditions to function as a truth-tracking mechanism. In a thin, five-year horizon market with high stakes, those conditions are not met *ex ante*. To bind the University to a potentially manipulated price signal is not an act of governance innovation; it is an act of negligence.

  By narrowing the pilot to a presumptive status, we treat this as what it truly is: an experiment. If the market performs robustly over the two-year pilot—if it resists manipulation, maintains liquidity, and produces a recommendation that withstands Senate scrutiny—it will build the trust necessary to make future pilots binding. We cannot leap to binding automation without first proving the mechanism's reliability in our specific institutional context. We must walk before we run.

  **VI. Conclusion**

  The Committee urges the Senate to vote **in favor of the narrowed pilot**. This path allows us to explore the promise of algorithmic governance and honor the intellectual labor of our Economics and Computer Science colleagues, without wagering the academic integrity of the General Education program on an unproven market structure.

  **Recommendation:** Approve the pilot *conditional* on the safeguards outlined in Section III.
