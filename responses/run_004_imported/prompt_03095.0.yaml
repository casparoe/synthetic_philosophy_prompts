  4.  **Developing the Coherent Reading (The "Von Neumann Synthesis"):**
      *   Von Neumann isn't saying the *atom* is evil. He's saying that once you unlock a certain *order of magnitude* of power, the *consequences of human fallibility* become existential.
      *   *Neutrality:* The physics works the same for power plants or bombs.
      *   *Intrinsic Danger:* The *existence* of the technology raises the ceiling of potential damage so high that "survival" becomes a statistical problem. If the downside is extinction, the risk is "intrinsic" to having the capability, regardless of the "neutral" intent.
      *   *Key Concept:* **Asymmetry of Consequence.** Building a hut vs. building a reactor. If you mess up a hut, someone gets hurt. If you mess up a reactor (or nuclear war), everyone dies. The *scale* makes the danger inherent to the *possession* of the tech, not just the *use*.

