answer: |-
  This is an exceptionally sharp observation, and you are right to be frustrated by the secondary literature. Many intro texts gloss over the distinction because Quine himself often presents them as continuous applications of his holism. However, your intuition that the standard realist replies (IBE, theoretical virtues) work for Underdetermination of Theory by Evidence (UTE) but fail for Indeterminacy of Translation (IT) is actually the key to the whole debate.

  The short answer is: **No, IT is not just UTE with extra steps.** While they share a structural similarity (evidence underdetermines the hypothesis), Quine assigns them fundamentally different **modal statuses**.

  Here is the breakdown of why the moves that save scientific realism in UTE do not dissolve the *Gavagai* problem in IT, tailored for someone with your background.

  ### 1. Epistemic vs. Ontological
  This is the crucial disanalogy that secondary sources often wave at but rarely unpack.

  *   **UTE (Physics): Epistemic Underdetermination.**
      When two physical theories ($T_1$ and $T_2$) fit all possible sensory evidence, Quine is a **realist**. He believes there *is* a fact of the matter about which theory is true, even if we cannot empirically distinguish them. The underdetermination is a limit on *our knowledge*, not on the *world*.
      *   *Why IBE works here:* Inference to the Best Explanation assumes there is a truth to be found. If $T_1$ is simpler and more conservative, the realist says, "$T_1$ is likely the true description of the ontology."

  *   **IT (Translation): Ontological Indeterminacy.**
      When two translation manuals ($M_1$ and $M_2$) fit all speech dispositions, Quine is an **anti-realist** about meaning. He explicitly argues there is **no fact of the matter** about which manual is correct. It is not that we can't know; it's that there is nothing to know.
      *   *Why IBE fails here:* IBE selects the *true* hypothesis. If there is no truth-value to "Manual A captures the *real* meaning," then simplicity/virtues can only tell you which manual is more *useful*, not which is *right*.

  **The Argument:** Quine is a physicalist. For Quine, the "furniture of the universe" is described by fundamental physics. Physical theories are attempts to describe that furniture. Translation manuals are not descriptions of furniture; they are tools for correlating one set of behaviors (the native's) with another (the linguist's).

  ### 2. The "Analytic/Synthetic" Connection
  As a linguist, you likely treat "meaning" (semantics) and "belief" (pragmatics/epistemics) as distinct levels of analysis (or at least distinguishable). Quine's IT relies on the rejection of that distinction.

  In UTE, we are adjusting theories about the world. In IT, we are trying to isolate "meaning" from "collateral information" (beliefs about the world).
  *   **The *Gavagai* Example:** When the native says "Gavagai" upon seeing a rabbit, are they referring to *Rabbit*, *Undetached Rabbit Part*, or *Rabbit Stage*?
  *   **The UTE Fix:** A scientist might say, "We posit 'Rabbit' because it's the most coherent ontological commitment."
  *   **The IT Block:** Quine argues you cannot isolate the linguistic meaning from the ontological commitment. To translate "Gavagai" as "Rabbit" is to impute an ontology of enduring objects to the native. To translate it as "Rabbit Stage" is to impute an ontology of temporal slices.
  *   **Why Realism Fails:** Since there is no "meaning" entity floating above behavior to check against, you cannot say one ontology is the "true meaning." You can only say one manual is more convenient for *our* purposes.

  ### 3. The "Tower of Babel" Argument
  Quine offers a specific argument in *Ontological Relativity* to distinguish the two.

  Imagine two physicists disagreeing on a theory of particles (UTE). They can point to the world, run experiments, and agree on the sensory stimulations. They share a background language to frame the disagreement.

  Now imagine two linguists disagreeing on a translation manual (IT). To adjudicate who is right, they would need to check the "meanings" in the native's head. But access to the native's head is *only* through behavior (which is already fully accounted for by both manuals). There is no "third thing" (Meaning) to appeal to.
  *   **In UTE:** The evidence underdetermines the theory, but the *theory* is about something real (electrons, fields).
  *   **In IT:** The evidence underdetermines the manual, and the *manual* is not about anything real (meanings don't exist as entities).

  Therefore, theoretical virtues (simplicity, etc.) can adjudicate UTE because they help us approximate the real structure of the world. They cannot adjudicate IT because there is no structure of "meanings" to approximate.

  ### 4. A Linguistics-Specific Angle: Chomsky's Critique
  Since you are in Ling, it is worth noting that Noam Chomsky (Quine's main interlocutor on this) agrees with your suspicion but draws the opposite conclusion.

  Chomsky argues that IT is trivial compared to UTE.
  *   **Chomsky:** "Of course translation is indeterminate if you ignore Universal Grammar and the internal biological state of the speaker."
  *   **The Move:** Chomsky posits a **fact of the matter** (the biological/mental state of the speaker) that Quine denies.
  *   **Relevance to you:** If you are a cognitive linguist or generativist, you likely believe there *is* a fact of the matter about what "Gavagai" means (it's determined by the speaker's I-language). Quine's IT only holds if you accept behaviorism about meaning. If you reject behaviorism (as most modern linguists do), you might think IT is a pseudo-problem.
  *   **However:** In the context of your Phil Sci seminar, you must play by Quine's rules. Within Quine's system, the distinction holds because he denies the existence of the mental states that would fix reference.

  ### 5. Summary: Why the "Fixes" Don't Carry Over
  To answer your core question directly:

  | Move | In UTE (Physics) | In IT (Translation) | Why the difference? |
  | :--- | :--- | :--- | :--- |
  | **Realism** | **Yes.** One theory is true. | **No.** Neither manual is "true." | Physics describes ontology; Translation is pragmatic tool-use. |
  | **IBE / Virtues** | **Truth-tracking.** Simplicity suggests truth. | **Utility-tracking.** Simplicity suggests ease of use. | There is no "meaning fact" for virtues to track. |
  | **Fact of Matter** | **Exists.** (Epistemic limit) | **Does not exist.** (Ontological limit) | Quine's Physicalism: Only physics describes reality. |

  ### Recommended Reading to Clear the Fog
  The secondary literature is often muddy here, but these three sources tackle the distinction head-on:

  1.  **Quine, "On the Reasons for the Indeterminacy of Translation" (1970):** Quine explicitly distinguishes the two. He admits UTE allows for a fact of the matter, while IT does not.
  2.  **Roger Gibson, *The Philosophy of W.V. Quine*:** Gibson is the standard exegesis guy. Look for his section on the "Two Dogmas" to "Word and Object" progression. He explains the physicalist constraint well.
  3.  **Peter Hylton, *Quine* (Routledge):** Hylton is excellent at explaining why Quine thinks meaning isn't "real" in the way electrons are.

  **Bottom Line:** You haven't talked yourself into a confusion; you've identified the exact pressure point in Quine's system. The seminar is treating them as structurally identical (which Quine likes to suggest), but the *philosophical stakes* differ because Quine is a realist about physics and an eliminativist about meanings. The realist replies work for physics because there is something to be real *about*; they fail for translation because, for Quine, meanings aren't part of the furniture of the universe.
