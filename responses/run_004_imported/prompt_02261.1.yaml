      *   Presumptuous Philosopher problem? Yes.
      *   Weight of observer numbers? Yes (argue for minimal weight).
      *   Principled resistance without SSA baggage? Yes (FNC, Likelihood distinction).
      *   Relation to fine-tuning? Yes (distinguished).

