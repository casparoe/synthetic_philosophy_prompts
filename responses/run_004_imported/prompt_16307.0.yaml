answer: |-
  This is a remarkably sophisticated inquiry, and your friend's unease was likely instinctual: you have identified a strong *affinity* between these positions and mistaken it for a logical *entailment*.

  To give you the direct sanity check you requested: **You are collapsing two distinct metaphysical debates.** While they constrain one another, they are not the same debate, and—crucially for your novel—Eternalism does not logically force you into Perdurantism.

  Here is the breakdown of where your mapping is correct, where it slips, and how this distinction might actually unlock the thematic tension in your subplot about guilt.

  ### 1. The Category Error: Time vs. Objects
  Philosophers of time generally distinguish between the **ontology of time** and the **ontology of objects**.

  *   **Presentism vs. Eternalism (Ontology of Time):** This asks, *Which times exist?*
      *   **Presentism:** Only the present moment exists. The past is gone; the future is not yet.
      *   **Eternalism (Block Universe):** Past, present, and future all equally exist. 1950 is just as "real" as 2024, just located at a different temporal coordinate.
  *   **Endurantism vs. Perdurantism (Ontology of Persistence):** This asks, *How do objects persist through time?*
      *   **Endurantism:** Objects are 3D entities that are "wholly present" at every moment of their existence. You are entirely here now, and you were entirely there then.
      *   **Perdurantism:** Objects are 4D "worms" extended through spacetime. You are not wholly present now; only a "temporal slice" of you is present now.

  Your intuition is that Eternalism *requires* Perdurantism. This is the standard "Lewisian" view (championed by David Lewis), but it is not a logical necessity. It is possible to be an **Eternalist Endurantist**.

  ### 2. The Loophole: Eternalist Endurantism
  If you adopt the Block Universe (Eternalism), you believe the grandmother's girlhood exists at coordinate $t_1$ and her old age exists at coordinate $t_2$.

  *   **The Perdurantist (Worm) View:** The "Grandmother" is the sum of $t_1 + t_2 + \text{everything in between}$. The girl at $t_1$ is a *part* of the grandmother, not identical to the whole.
  *   **The Endurantist View:** The "Grandmother" is wholly present at $t_1$. The *same* Grandmother is wholly present at $t_2$. The fact that $t_1$ and $t_2$ both exist in the block doesn't mean the object is sliced up; it just means the *same whole object* is located at multiple temporal coordinates.

  **Why does this matter?**
  Philosophers like David Lewis argued against Eternalist Endurantism because of the **Problem of Temporary Intrinsics**. How can the *same* whole object be bent at $t_1$ and straight at $t_2$? If it is wholly present at both, it seems to have contradictory properties.
  *   **Perdurantists solve this:** The $t_1$-part is bent; the $t_2$-part is straight. No contradiction.
  *   **Eternalist Endurantists solve this:** By saying properties are relations to times. The object isn't "bent"; it is "bent-at-$t_1$."

  **For your novel:** You *can* have your Block Universe (allowing you to narrate 1950 and 2024 as equally real scenes) without committing to the idea that the grandmother is merely a collection of segments. You can maintain that she is numerically identical to herself across the block.

  ### 3. The Implications for Guilt (The Core of Your Subplot)
  This distinction is not just academic; it fundamentally changes the psychology of your grandmother's guilt.

  **Scenario A: Eternalism + Perdurantism (Your current plan)**
  *   **Metaphysics:** The Girl and the Old Woman are distinct temporal parts of a single Person-Worm.
  *   **The Guilt:** This creates a metaphysical distance. When the Old Woman asks, "Did I do that?" the strict answer is, "No, a prior temporal part of you did that."
  *   **Thematic Resonance:** This supports themes of fragmentation, alienation, or the idea that we are "many selves." Guilt becomes an act of empathy for a different segment of one's own worm. It asks: *Am I responsible for the actions of my past parts?*

  **Scenario B: Eternalism + Endurantism (The alternative)**
  *   **Metaphysics:** The Girl *is* the Old Woman. Numerical identity holds ($A = B$). Both exist in the block, but they are the same substance.
  *   **The Guilt:** This creates metaphysical immediacy. "I did that." There is no temporal part to hide behind. The fact that the past still "exists" in the block means the act is eternally fixed as something *she* did.
  *   **Thematic Resonance:** This supports themes of inescapable identity, fate, or the weight of history. The past isn't gone (Presentism), and it isn't a different person (Perdurantism); it is a permanent coordinate of her own being.

  **Scenario C: Presentism + Endurantism (The intuitive view)**
  *   **Metaphysics:** Only the Old Woman exists. The Girl is gone.
  *   **The Guilt:** Guilt is purely a function of memory and causal consequence. The act no longer exists; only the scar remains.
  *   **Thematic Resonance:** This supports themes of regret, memory, and the impossibility of redemption (because the actor is gone).

  ### 4. Why Your Friend Was Uneasy
  Your friend likely sensed that you were conflating the *container* (time) with the *contents* (objects). By declaring the debates identical, you risk losing the nuance that allows for **Eternalist Endurantism**.

  If you commit to Perdurantism thinking you have no choice, you might write a subplot about guilt that feels intellectually distant when you want it to feel visceral. If the grandmother is just a "worm," her guilt might feel like bureaucratic liability. If she is an "enduring substance," her guilt feels like a stain on the soul.

  ### Recommendation for the Manuscript
  You do not need to abandon your reading or your Block Universe. However, I suggest you treat the choice between Endurance and Perdurence as a **thematic dial** rather than a logical necessity.

  1.  **If you want the grandmother to feel disconnected from her past:** Lean into the Perdurantist language. Describe her younger self as "that girl," "the earlier segment," or focus on how much she has changed, implying they are different entities linked by causality.
  2.  **If you want the grandmother to feel haunted by her past:** Lean into Eternalist Endurantism. The past is not a different person; it is a place she still inhabits. She doesn't *remember* the sin; she *is* the sin, located at a different coordinate.

  **The Verdict:** You are free to keep the Block Universe. But do not feel forced into Perdurantism. The question of whether the grandmother is *one thing persisting* or *many things stacked* is a separate choice from whether the past *still exists*. Keeping them separate gives you more control over the emotional architecture of your novel.
