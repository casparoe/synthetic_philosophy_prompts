  5.  **Refining the Philosophy (Self-Correction during drafting):**
      *   *Check Cohen:* In "Casting the First Stone," Cohen discusses the biblical passage. He emphasizes that the hypocrite cannot *condemn* because they are guilty. He distinguishes between *identifying* sin and *condemning* it.
      *   *Check Wallace:* In "Responsibility and the Moral Sentiments," Wallace links standing to the "commitment condition." You must accept the authority of the norms you invoke.
      *   *Nuance:* Wallace is about the *conditions of responsibility*. Cohen is about the *ethics of criticism*.
      *   *Make sure not to conflate:* Wallace says the hypocrite lacks *standing*. Cohen says the hypocrite lacks *authority* to judge. These sound similar. The difference is the *ground*. Wallace: Equality. Cohen: Integrity/Consistency.
