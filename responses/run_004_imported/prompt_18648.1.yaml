          *   *Mechanism:* Blaming involves an implicit claim of moral superiority or authority. When you blame, you invoke norms that apply to everyone. If you violate those same norms, you deny the equal moral standing of the person you are blaming. You treat them as bound by norms you exempt yourself from.
          *   *Result:* The blame is *invalid* or *unauthorized*. It's not just annoying; it lacks normative force. The hypocrite loses the *right* to hold the other responsible.
          *   *Key Phrase:* "Equal Moral Standing."

      *   **G.A. Cohen ("Casting the First Stone"):**
          *   *Core Idea:* Hypocrisy undermines the *performance* of blaming, not necessarily the *content*.
          *   *Mechanism:* Cohen distinguishes between the *truth* of the accusation and the *legitimacy of the accuser*. A hypocrite can be right about the facts (the act was wrong), but they cannot legitimately occupy the "posture of judgment."
          *   *Nuance:* Cohen is often read as saying the hypocrite's blame "misfires." It's not that the norm doesn't apply, but that the *act* of blaming is compromised.
          *   *Key Phrase:* "Posture of Judgment" / "Misfire."

      *   **The Divergence (Task 1):**
          *   *Wallace:* Focuses on the *relationship* between blamer and blamee. Hypocrisy violates the equality condition necessary for the reactive attitude of blame to be appropriate. It makes the blame *unfair*.
          *   *Cohen:* Focuses on the *act* of blaming itself. The proposition "X is wrong" remains true, but the *illocutionary act* of blaming is defective.
          *   *Crucial Distinction:* Wallace suggests the hypocrite loses the *authority* to demand compliance (normative standing). Cohen suggests the hypocrite's judgment is *ineffectual* or *improper* as a speech act, even if the moral fact remains.
