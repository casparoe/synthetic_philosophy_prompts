      *   *Cohen's Strength:* Explains why the *accusation* might still be true. The politician *did* steal, even if the accuser also stole. It preserves moral truth while critiquing the messenger.
      *   *The "Better" Pick:* Wallace is generally considered the more robust account in contemporary moral philosophy regarding *standing*. However, for a political piece, Cohen's distinction between "truth" and "posture" is often more useful for the public.
      *   *My Recommendation:* I should argue for **Wallace**. Why? Because in political scandals, the issue isn't just "can this person speak?" it's "does this person have the right to *sanction*?" Wallace explains why the sanction feels illegitimate. Cohen risks implying the blame is just a performance issue. Wallace makes it a justice issue.
      *   *Counter-argument:* Cohen is better at preserving the truth of the underlying claim.
      *   *Decision:* I will argue for **Wallace** as the deeper explanation of the *normative failure*, but acknowledge Cohen's utility for separating truth from authority. Actually, a synthesis might be best, but the prompt asks me to *pick*. I'll pick Wallace because it addresses the *relational harm* which is central to political trust.
      *   *Wait, let's reconsider.* Many contemporary philosophers (like Bell, Fritz) critique Wallace. But sticking to the prompt's binary: Wallace provides a structural reason (equality), Cohen provides a functional reason (posture). Wallace is more fundamental. If you violate equality, the posture is impossible. So Wallace explains *why* the posture misfires.
      *   *Final Decision:* Wallace offers the better *explanation of what's going wrong*. Cohen describes the symptom (misfire); Wallace diagnoses the disease (inequality).

  4.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the relevance (political scandals). Set the stage.
      *   **Section 1: The Divergence.**
          *   Wallace: The "Equality/Commitment" Account. Hypocrisy violates the equal standing required for the moral community. It makes blame *unfair*.
          *   Cohen: The "Posture/Performance" Account. Hypocrisy makes the act of blaming pragmatically defective. The content is true, the act is void.
