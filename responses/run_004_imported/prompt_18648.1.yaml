          *   *Refining the Divergence:* Wallace is about the *conditions of responsibility*. If I'm a hypocrite, I haven't met the conditions to hold *you* responsible. Cohen is about the *rhetoric/moral force*. The stone shouldn't be cast because the caster is dirty, but the sin is still a sin.
          *   *Actually, a sharper distinction:* Wallace argues hypocrisy *negates standing* (you literally can't do it rightfully). Cohen argues hypocrisy makes the act *pointless or self-defeating* (you can do it, but it won't work/shouldn't be done).
          *   *Correction:* In "Casting the First Stone," Cohen argues that the hypocrite lacks the *moral authority* to condemn. But he distinguishes between the *truth* of the condemnation and the *right* to pronounce it. Wallace grounds the loss of standing in the violation of *equality*. Cohen grounds it in the *integrity* of the moral community or the specific role of the judge.
          *   *Let's look for the specific clash:* Wallace says the hypocrite's blame is *unfair* to the blamee (violates their standing). Cohen says the hypocrite's blame is *defective* in itself (the act misfires).
          *   *Better formulation:* Wallace focuses on the *interpersonal normative relationship* (I can't hold you to what I flout). Cohen focuses on the *expressive function* of blame (I can't express moral indignation if I share the guilt).

  3.  **Evaluate "Which is Better?" (Task 2 & 3):**
      *   *Criteria:* Which explains the political scandal context better?
