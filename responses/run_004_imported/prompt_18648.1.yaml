answer: |-
  This is a fantastic angle for a piece. The "tu quoque" (you also) move is often dismissed as a logical fallacy, but as you've found, the philosophical literature on *standing to blame* treats it as a genuine normative problem. It's not just a distraction; it's a claim about authority.

  You have correctly identified the two heavyweights in this ring. R. Jay Wallace (specifically in *Responsibility and the Moral Sentiments*) and G.A. Cohen (in his essay "Casting the First Stone") both agree that hypocrisy compromises blame, but they diagnose the failure differently.

  Here is the breakdown of where they diverge, followed by a recommendation on which account better serves your analysis of political scandals.

  ### 1. The Divergence: Relational Fairness vs. Expressive Integrity

  While both philosophers conclude that a hypocrite lacks the standing to blame, they disagree on *why* the standing is lost and *what* exactly is broken in the interaction.

  **R. Jay Wallace: The Equality Account (Relational)**
  For Wallace, blame is not just a statement of fact; it is a demand for accountability within a moral community. To blame someone is to implicitly claim that you are both subject to the same norms.
  *   **The Mechanism:** When a hypocrite blames, they violate the condition of **equal moral standing**. By holding you to a norm they flagrantly violate themselves, they are effectively exempting themselves from the rules while enforcing them on you.
  *   **The Harm:** The primary wrong is done to the *person being blamed*. It is unfair to be held accountable by someone who refuses to be accountable themselves. It treats the blamee as a subordinate rather than a moral peer.
  *   **The Result:** The hypocrite loses the *authority* to hold the other responsible. The blame is not just annoying; it is normatively unauthorized.

  **G.A. Cohen: The Posture Account (Expressive)**
  Cohen focuses less on the fairness to the blamee and more on the integrity of the *act of blaming* itself. He distinguishes between the truth of the accusation and the legitimacy of the accuser.
  *   **The Mechanism:** Cohen argues that blame involves occupying a specific "posture of judgment." This posture requires a kind of moral cleanliness or consistency. If you are guilty of the same sin, you cannot legitimately occupy the high ground required to cast the stone.
  *   **The Harm:** The primary wrong is to the *moral practice of judgment*. The hypocrite's words might be factually true (the act *was* wrong), but the speech act "misfires." It fails to function as a legitimate moral condemnation because the speaker undermines their own expressive capacity.
  *   **The Result:** The content remains true, but the *performance* is void. The hypocrite can state the facts, but they cannot condemn.

  **The Crucial Split:**
  *   **Wallace** says the hypocrite's blame is **unjust to the recipient** (it violates equality).
  *   **Cohen** says the hypocrite's blame is **defective in the speaker** (it violates integrity).

  Wallace is concerned with the *relationship* between the two parties. Cohen is concerned with the *role* the blamer is trying to play.

  ### 2. The Pick: Why Wallace Offers the Better Explanation

  For a piece on political scandals, **R. Jay Wallace's account is the stronger framework.**

  Here is the justification for that pick, based on explanatory power and political relevance.

  #### A. It Explains the Public Anger, Not Just the Skepticism
  Cohen's account explains why we might roll our eyes or dismiss the hypocrite's statement as hollow. It explains the *ineffectiveness* of the blame. But it doesn't fully capture the *moral outrage* we feel when a politician engages in hypocritical blaming.

  Wallace explains the outrage. When a politician screams about fiscal irresponsibility while hiding their own debts, we aren't just thinking, "Well, his posture is compromised." We are thinking, "Who does he think he is to treat *us* (or his opponent) like children while he acts like a king?" Wallace captures the **domination** inherent in political hypocrisy. It frames the loss of standing not as a technical misfire, but as an assertion of unfair privilege. In politics, where power dynamics are already skewed, the violation of "equal moral standing" is the central scandal.

  #### B. It Avoids the "Truth Trap"
  Cohen's distinction preserves the truth of the accusation (the hypocrite is right that the act was wrong). While philosophically neat, this is dangerous in political analysis.

  In modern political scandals, the "truth" is often weaponized. A corrupt politician might accuse a rival of a minor infraction to distract from their own major corruption. Cohen's view allows us to say, "Well, the accusation is technically true, he just can't say it." This grants the hypocrite too much credit.

  Wallace's view is more robust: because the hypocrite has violated the conditions of equal standing, their attempt to enforce the norm is **illegitimate**. It shifts the focus from "Is the accusation factually correct?" to "Does this person have the right to enforce this norm?" In a democracy, the right to enforce norms (through law or public shaming) is derived from consent and equality. Wallace shows why the hypocrite forfeits that right.

  #### C. It Explains Why Apologies Matter
  Wallace's framework explains why a public apology can restore standing. If the loss of standing is based on the claim of exemption (inequality), then admitting guilt re-establishes equality. "I broke the rule too, and I accept the penalty."

  Cohen's framework is stickier. If the problem is the "posture of judgment," it's harder to see how an apology fixes the "misfire" of the past act. Wallace gives you a clearer narrative arc for your piece: Hypocrisy creates inequality -> Standing is lost -> Equality must be restored to regain standing.

  ### 3. How to Use This in Your Piece

  If you go with Wallace, you can frame the "tu quoque" defense not as a childish deflection, but as a demand for **democratic reciprocity**.

  *   **The Hook:** Start with the intuition that "You did it too!" feels like a cheap dodge.
  *   **The Turn:** Introduce Wallace to show it's actually a deep claim about fairness. It's not about changing the subject; it's about challenging the *authority* of the accuser.
  *   **The Application:** When a politician lacks standing, their blame isn't just annoying; it's an act of political domination. They are trying to wield a moral weapon they have no license to carry.
  *   **The Cohen Counter-point:** Use Cohen briefly to acknowledge the nuance: Yes, the underlying corruption might still be real (the "truth" survives), but without standing, the accusation loses its moral force to *reform* or *sanction*. It becomes mere noise.

  ### Summary
  Choose **Wallace**. Cohen gives you a philosophy of language answer (the act misfires); Wallace gives you a political philosophy answer (the relationship is corrupted). Since you are writing about political scandals, the corruption of the relationship between the accuser and the accused (the leader and the led) is the story that matters. Wallace explains why hypocrisy isn't just a character flaw; it's a disqualification from authority.
