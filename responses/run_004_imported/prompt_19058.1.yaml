      *   *Allographic:* Literature, music. Defined by a notation (letters, notes). Any copy that matches the notation is an instance of the work.
      *   *Ellen's specific take:* She emphasizes that the *physical history* matters for paintings. A fake Vermeer isn't just morally wrong; it's ontologically different.
      *   *Avoid:* Walter Benjamin's "The Work of Art in the Age of Mechanical Reproduction." He talks about "aura" decaying through reproduction. Ellen hates this word/concept comparison. So, focus on *identity* and *history*, not "presence" or "spirit."

