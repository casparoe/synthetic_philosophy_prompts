answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name], Ellen's nephew/niece. For those of you who do know me… I'm sorry you have to listen to me speak for five minutes. I promise to keep it brief, mostly because I know Aunt Ellen is timing me, and she has a stopwatch hidden in her purse that is probably more accurate than anything we own.

  We are here to celebrate 38 years of Ellen's career. Now, if you ask the family what Ellen does, the answer is usually: "She checks if paintings are fake." It sounds like she's a human lie detector with a magnifying glass. "Beep. Real. Beep. Forgery."

  But those of you who work with her know it's much more than that. You know she's spent nearly four decades protecting the history embedded in objects. You know she cares about provenance, pigment, and the story of how a canvas came to be.

  But there is a third group here tonight: the people who have spent Thanksgiving with us. You know that Ellen doesn't just care about art; she cares about *why* art matters. And specifically, she cares about a philosophical distinction that she will absolutely correct you on if you get it wrong at the dinner table.

  For the family: Ellen is obsessed with the difference between a painting and a poem.

  Here is the rule, Ellen-style: If I write a poem on a napkin, and you photocopy it, and someone else types it out, and another person memorizes it and says it aloud… those are all the same poem. Nothing is lost. The art lives in the words, not the paper.

  But a painting? That's different. If Vermeer painted a girl with a pearl earring, and I spend ten years copying it so perfectly that not even the experts can tell the difference… Ellen says it is still not the same artwork. It doesn't matter if it looks identical. It doesn't matter if the chemicals match. If Vermeer didn't touch it, it's not a Vermeer. It's a different thing entirely.

  For the colleagues in the room: Yes, I know this is Nelson Goodman's autographic versus allographic distinction. I know Goodman argues that in autographic arts, the history of production is essential to the identity of the work. And I know I am not going to say the A-word.

   *[Pause for laughter/applause from the pros]*

  I was strictly briefed on that. There will be no mention of Walter Benjamin or the decay of anything resembling an "aura" tonight. We are talking about history, not magic.

  But why does this matter? Why does Ellen care so much about a distinction that most people can't see?

  Because for Ellen, authenticity isn't about snobbery. It's about respect. When she says a perfect forgery is still a forgery, she's saying that the artist's hand matters. The moment of creation matters. The specific time, place, and person who made the mark are part of the art itself. You can copy the image, but you can't copy the history.

  And honestly, I think that's why we love her. Ellen brings that same integrity to everything she does. She doesn't care about the copy; she cares about the source. She doesn't care about the shortcut; she cares about the process. In a world that is increasingly digital, increasingly copied and pasted, Ellen has spent 38 years standing up for the original. For the thing that has a history. For the truth of the object.

  To the auction house team: Thank you for supporting her work and respecting her eye. You know that when Ellen signs off on a catalog, it's because the history checks out.

  To the family: Thank you for loving her even when she refuses to accept a printed copy of a birthday card because it "lacks the correct history of production."

  Ellen, you have taught us that value isn't just about what something looks like on the surface. It's about where it came from. It's about the story it carries. And while you are retiring from authenticating paintings, you have already authenticated us. You've shown us what it looks like to live a life of integrity, where the history of your actions matters just as much as the result.

  So, if everyone could please raise a glass.

  To Ellen. May your retirement be entirely autographic—written by your own hand, unique, impossible to forge, and absolutely original.

  To Ellen!
