          *   *Autographic:* Artworks where the history of production matters (e.g., paintings). A forgery is aesthetically different even if indistinguishable.
          *   *Allographic:* Artworks where the notation matters, not the history (e.g., music, literature). A copy is as good as the original if it conforms to the notation.
          *   *Ellen's View:* A forged Vermeer is lesser/different even if undetectable. A photocopy of a poem loses nothing.
