      *   **The Core Tension:** *Elenchus* (Socratic method) vs. *Rhetoric* (Sophistic method).
          *   *Elenchus:* Cooperative, aims at truth, exposes ignorance, requires knowledge of the subject to validate, interlocutor must agree to premises.
