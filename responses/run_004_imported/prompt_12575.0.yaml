answer: |-
  Thank you. It is a genuine honor to stand here. I know why I was asked. My last book tracked a regional newspaper as it bled out over ten years. It is a story about endings, which makes me an obvious choice for a beginning like this. But I want to be honest with you: I am not standing here to eulogize the industry you are about to enter. I am standing here to warn you about the audience you think you are serving.

  In preparing for today, I returned to a text that has nagged at me for years: Søren Kierkegaard's *The Present Age*. It was published in 1846, long before the internet, long before the 24-hour news cycle, and yet it reads like a diagnostic report on the digital age. Kierkegaard argues that "the public" is not a pre-existing body of citizens that journalism happens to serve. He says "the public" is a phantom. It is an abstraction that the press itself calls into being and keeps in motion.

  This phantom has no qualities of its own. It is sustained by chatter rather than by passionate, committed action. And, perhaps most uncomfortably, Kierkegaard suggests this public is held together by envy: a reflexive resentment of anyone who stands out from the level. He calls this process "leveling."

  I tell you this not to scold you. I tell you this because I am implicated in it. As a novelist, I depend on the very same machinery of coverage and buzz to be read. I need the phantom to notice me. But Kierkegaard's argument is aimed with real precision at the trade you are about to enter. If we are honest, the modern media ecosystem is the ultimate engine of the "Present Age." It rewards chatter. It rewards the leveling of nuance into hot takes. It asks you to speak to "everyone," which is another way of saying it asks you to speak to no one in particular.

  So, here we are. You have trained for years to enter a profession that a profound philosopher might describe as structurally corrosive to the human spirit. And yet, here you sit. You are not wrong to be here. The world still needs to know what is happening. But if I offer you the usual commencement platitudes—if I tell you to "speak truth to power" or "be the voice of the voiceless" without acknowledging Kierkegaard's diagnosis—I would be lying to you. Those phrases assume there is a solid ground to stand on. Kierkegaard suggests the ground is made of smoke.

  If there is any honest way to send you off encouraged, it must survive contact with that smoke. It cannot rely on the idea that you will save "Journalism" with a capital J. "Journalism" is an abstraction. It is part of the phantom. You cannot save an abstraction. You can only save yourself, and in doing so, perhaps save the work.

  Kierkegaard contrasts the anonymous public with the single, accountable individual. The public is nobody; the individual is somebody. The public is irresponsible; the individual is responsible. This is where your counsel lies. It is not in fighting the phantom on its own terms. You will not beat the algorithms at being algorithmic. You will not beat the chatter by talking louder.

  You beat the phantom by refusing to become part of it.

  In your career, you will be tempted to serve the abstraction. You will chase metrics that measure the attention of a crowd that does not exist. You will write for the "general opinion." You will feel the pressure of leveling—the subtle, social pressure to soften your edges, to match the tone of the feed, to resent the colleague who gets the prize, or to fear the envy of the mob if you stand too tall.

  Against this, your only defense is a radical, almost stubborn, particularity.

  When you report, do not report for "the public." Report for the people you actually met. Report for the specific family whose eviction you documented. Report for the city council member whose corruption you traced. When you write, do not write for the "audience." Write for the neighbor. Kierkegaard believed that truth is found in subjectivity, in the relationship between the individual and the world. In journalism, that means truth is found in the specific, accountable relationship between the reporter and the source, the writer and the reader.

  This is harder than it sounds. It is easier to write for a demographic. It is harder to write for a human being. It is easier to hide behind the editorial "we." It is harder to stand behind the "I."

  This is why I urge you to claim your byline, not as a brand, but as a burden. A byline is a signature of accountability. It says: *I was here. I saw this. I am responsible for these words.* In an age of anonymous comments and algorithmic feeds, putting your name on a story is a revolutionary act. It declares that a single human being is willing to stand behind this information. It breaks the spell of the phantom.

  Will this protect you? No. You will still face the envy Kierkegaard described. You will face the resentment of those who prefer the comfort of the crowd to the discomfort of facts. You will see outlets close. You will see the machinery of chatter grind on regardless of the truth you publish.

  But do not let that cynicism become your shelter. Cynicism is just another form of chatter. It is a way of pretending you are above the fray while remaining safely within it.

  Instead, aim for a quiet, unglamorous integrity. Do the work that only a human being can do. Look people in the eye. Listen to what they say, not what they tweet. Verify the thing that is inconvenient to verify. When you are pressured to level a story to fit a narrative, refuse. When you are pressured to join the chorus of outrage, pause.

  You are entering a trade that Kierkegaard might view with suspicion. But he would not view *you* with suspicion, provided you remain an individual. The phantom cannot be destroyed. It is too useful to power, too profitable to platforms, too comfortable for the crowd. But it can be ignored. It can be bypassed by the direct connection of one person telling another person what is true.

  So, my wish for you is not that you become famous. Fame is the approval of the phantom. My wish is not that you become influential. Influence is the leverage of the crowd.

  My wish is that you become accountable. That you find a way to do work that you can sign your name to, ten years from now, without shame. That you find a small patch of ground, a specific beat, a specific community, and tend to it with a passion that the "Present Age" has tried to convince you is obsolete.

  If you do that, you will not have saved Journalism. But you will have done something better. You will have remained a person. And in a world of phantoms, that is the only foundation solid enough to build a life upon.

  Congratulations. Go be somebody.
