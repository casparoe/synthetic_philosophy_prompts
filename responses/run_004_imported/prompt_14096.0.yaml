      *   *The "Workaround":* The research didn't try to violate Löb's Theorem. It tried to navigate around it.
      *   *Key Mechanism 1: Parametric Polymorphism / Infinite Descent.* The original tiling agents paper proposed a solution where the successor operates in a theory $T'$, and the parent $T$ proves soundness of $T'$ *provided* $T'$ uses a parameter $k$ that is strictly less than some bound in $T$. This leads to a finite horizon, not infinite self-improvement. This was a known limitation, not a secret failure.
      *   *Key Mechanism 2: Probabilistic Trust / Logical Induction.* Later work (Garrabrant et al., Logical Induction) moved away from strict provability. If the agent uses *probabilistic* beliefs about logical statements (calibrated over time), Löb's Theorem doesn't apply in the same way because the agent isn't asserting $\square \phi \to \phi$ with probability 1.
      *   *Key Mechanism 3: Reflective Oracles / Fixed Points.* Work on reflective oracles allows agents to reason about each other without triggering the diagonalization lemma in the same fatal way.
