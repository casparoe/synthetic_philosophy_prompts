  **Gongsun Long:** "Precisely! The concept 'White Horse' forbids the intrusion of 'Non-White'. The concept 'Horse' permits it. Because the set of allowable operations differs, the identities are distinct. Your compiler agrees with me."

  **Architect:** "It agrees on the *container*, not the *object*. `WhiteHorse` is still a subtype of `Horse`. You're conflating the element with the collection."

  **Gongsun Long:** "Is an object not merely a container of properties? If I cannot assign 'Black' to your `WhiteHorse` without throwing an exception, then the variable is invariant. You say 'Subtyping guarantees substitutability.' I say 'Substitutability fails when intension matters.'"

  **Architect:** "Look, in Java, generics are erased at runtime. At execution, they *are* the same type. You're arguing about compile-time checks."

  **Gongsun Long:** "And you are arguing about runtime extension. You rely on type erasure to hide the difference. I rely on intension to reveal it."

  **Architect:** "So you're saying reality is compile-time checked?"

  **Gongsun Long:** "I am saying your build fails because you tried to assign a specific intension to a generic extension. You call it 'Invariance.' I call it 'Fei Ma' (Not Horse)."

  **Architect:** "..."

  **Gongsun Long:** "Admit it. Your subtyping only works if you ignore the color parameter. But reality does not support type erasure."

  **Architect:** *[Closes laptop]* "Fine. You're right. But only because I forgot to make the list immutable."

  **Gongsun Long:** "Then make the horse immutable. Then `WhiteHorse` is not `Horse`. It is `Horse<Color=White>`. Now pay me. My consulting rate is invariant."
