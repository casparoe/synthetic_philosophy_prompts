      *   **Context:** Current system = 3-member panels, unanimity required (1 dissent = dismissal, no appeal). Proposed reform = 7-member panels, 5-of-7 majority.
      *   **Conflict:** Reformers argue larger groups + majority rule = higher accuracy (Condorcet's Jury Theorem logic). Skeptics argue panelists aren't independent (shared file, deliberation) and have varying competence (tenured vs. adjunct). Long-serving members worry about increased wrongful findings (false positives).
      *   **Requirements:**
          *   Take a clear, specific position (support, oppose, or alternative).
          *   Address the statistical argument (Condorcet) vs. the skeptic's complications (dependence, heterogeneity).
          *   Engage directly with the worry about wrongful findings (don't dismiss it).
          *   Be concrete enough to vote on (include procedural changes if necessary).

  2.  **Evaluate the Arguments:**
      *   **Current System (3-person, Unanimity):**
          *   *Pros:* High bar for conviction, protects students from wrongful findings (low false positive rate).
          *   *Cons:* High risk of letting guilty students go (high false negative rate), inconsistent rulings (as seen last spring), one "idiosyncratic" member can block justice.
      *   **Proposed Reform (7-person, 5/7 Majority):**
          *   *Pros:* More data points, reduces impact of one outlier, theoretically higher accuracy *if* conditions met.
          *   *Cons:* Condorcet's Jury Theorem assumes *independence* and *competence > 50%*. Deliberation breaks independence. Heterogeneous competence weakens the theorem. Lowering the bar from unanimity *does* inherently increase the risk of wrongful findings compared to unanimity, all else being equal.
      *   **The Skeptic's Point:** Crucial. If panelists influence each other (deliberation) or rely on the same biased file, errors correlate. If errors correlate, adding more people doesn't reduce error rates as much as the theorem suggests.
