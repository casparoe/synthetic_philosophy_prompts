      *Strategic Choice:* I will argue *against* the specific 5-of-7 proposal as currently stated because the statistical justification is flawed due to dependence. However, I will argue *for* a 7-person panel with a **6-of-7 supermajority** and a **two-stage voting process** (pre-deliberation straw poll + post-deliberation formal vote). This acknowledges the need for consistency (7 people) without sacrificing too much protection (6/7 is harder than 5/7) and attempts to salvage the statistical benefit by mitigating dependence.

