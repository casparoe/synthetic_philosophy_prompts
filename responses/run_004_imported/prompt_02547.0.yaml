answer: |-
  Your friend is right about the history, but she might be selling the current state of the field a bit short. You are also right about the intuition: basically every working scientist (and most philosophers) agrees that Newtonian mechanics is *closer to the truth* than Aristotelian physics, even if both are technically false (or incomplete).

  The drama you stumbled into is one of the most famous episodes in 20th-century philosophy of science. Here is the breakdown of why Popper's math broke, why the "weather example" kills his definition, and whether the "language dependence" objection means the whole project is doomed.

  ### 1. Popper's Idea: Truth Content vs. Falsity Content

  Popper wanted to save scientific realism without claiming we ever *have* the truth. His idea (1963) was that theories have two "contents":
  1.  **Truth Content:** The set of all true statements the theory entails.
  2.  **Falsity Content:** The set of all false statements the theory entails.

  **Popper's Definition:** Theory $A$ is closer to the truth than Theory $B$ if:
  *   $A$ has more truth content than $B$, AND no more falsity content; OR
  *   $A$ has less falsity content than $B$, AND no less truth content.

  Intuitively, this makes sense. You want to maximize the true stuff and minimize the false stuff.

  ### 2. The Crash: Tichý and Miller (1974)

  In 1974, two philosophers, Pavel Tichý and David Miller, independently proved that Popper's definition is mathematically incoherent.

  **The Result:** If two theories are both *false* (which they are, in the interesting cases like Newton vs. Aristotle), Popper's definition makes it **impossible** for one to be closer to the truth than the other. Under his math, all false theories are equally distant from the truth.

  **The Toy Example (Tichý's Weather)**
  This is the example your friend was vaguely recalling. It's simple but devastating.

  Imagine the actual state of the weather is: **Hot, Rainy, Windy** ($h, r, w$).

  Now consider two false theories:
  *   **Theory A:** It is Cold, Rainy, Windy ($\neg h, r, w$).
      *   *Intuition:* This is pretty close. It got 2 out of 3 right.
  *   **Theory B:** It is Cold, Dry, Calm ($\neg h, \neg r, \neg w$).
      *   *Intuition:* This is terrible. It got 0 out of 3 right.

  Obviously, Theory A is closer to the truth. But let's look at Popper's "content."

  Because these are logical theories, they don't just make claims about today's weather; they entail infinite logical consequences.
  *   Theory A entails "It is Rainy or Windy" (True).
  *   Theory A entails "It is Hot and Cold" (False).
  *   Theory B entails "It is Cold" (True).
  *   Theory B entails "It is not Rainy" (False).

  **The Proof in Plain English:**
  Tichý and Miller showed that if a theory is false, its "Falsity Content" swamps everything else.
  If Theory A is false, it entails some false statement $f$. If you try to add a true statement to Theory A to make it "better," the logical interaction between that new true statement and the existing false statement generates *new* false consequences that you didn't account for.

  Specifically, they proved that for any two false theories $A$ and $B$:
  1.  If $A$ has more truth content than $B$, it *necessarily* has more falsity content too.
  2.  If $A$ has less falsity content than $B$, it *necessarily* has less truth content too.

  Because Popper's definition requires you to increase one content *without* increasing the other, the conditions can never be met for false theories. The math forces a tie. Newton and Aristotle end up equally "far" from the truth, which is absurd.

  ### 3. The Fix: Similarity (Possible Worlds)

  After this disaster, philosophers (like Ilkka Niiniluoto and Graham Oddie) realized Popper was looking at the wrong thing. You shouldn't count *consequences* (which explode logically); you should measure **distance**.

  This is the "Similarity Approach."
  *   Imagine all possible states of the world as points in a space.
  *   The "Truth" is one specific point.
  *   Theory A is a point near the Truth. Theory B is a point far away.
  *   Verisimilitude is just the inverse of the distance.

  In the Weather Example:
  *   Truth: $(1, 1, 1)$
  *   Theory A: $(0, 1, 1)$ $\rightarrow$ Distance is 1 unit.
  *   Theory B: $(0, 0, 0)$ $\rightarrow$ Distance is 3 units.
  *   Result: A is closer. Intuition saved.

  ### 4. The Second Objection: Language Dependence

  This is where your friend threw out the "predicate redefinition" argument. She is right that this is a serious, unsolved problem, but it doesn't kill the project entirely.

  **The Problem:**
  "Distance" depends on how you measure it. And how you measure it depends on the vocabulary (predicates) you use to describe the world.

  Let's go back to the Weather Example.
  *   **Language 1:** Hot, Rainy, Windy.
      *   As we saw, Theory A is closer.
  *   **Language 2:** Let's invent weird predicates.
      *   $X$: Hot $\leftrightarrow$ Rainy (True if both are same, False if different)
      *   $Y$: Rainy $\leftrightarrow$ Windy
      *   $Z$: Hot $\leftrightarrow$ Windy

  In the actual world (Hot, Rainy, Windy), all three of these new predicates are **True**.
  *   **Theory A** (Cold, Rainy, Windy):
      *   $X$ (Cold $\leftrightarrow$ Rainy) = False
      *   $Y$ (Rainy $\leftrightarrow$ Windy) = True
      *   $Z$ (Cold $\leftrightarrow$ Windy) = False
      *   Score: 1 True, 2 False.
  *   **Theory B** (Cold, Dry, Calm):
      *   $X$ (Cold $\leftrightarrow$ Dry) = True
      *   $Y$ (Dry $\leftrightarrow$ Calm) = True
      *   $Z$ (Cold $\leftrightarrow$ Calm) = True
      *   Score: 3 True, 0 False.

  **The Flip:** In Language 1, Theory A is closer. In Language 2, Theory B is closer.
  If truthlikeness depends on which language we speak, then it isn't an objective feature of the theories; it's a feature of our description. This is a version of "Goodman's Grue" problem applied to truth.

  **Is this a killer?**
  It's a major constraint, not a death sentence. Most philosophers of science argue that not all languages are equal. There are "natural kinds."
  *   "Hot" and "Rainy" carve nature at its joints (they correspond to real physical properties).
  *   The weird predicates ($X, Y, Z$ above) are gerrymandered, disjunctive messes that don't correspond to causal powers in the world.

  The consensus is: **Truthlikeness is objective, but it presupposes a privileged ontology.** You can only measure distance using predicates that refer to real properties. If you accept that physics has a "correct" vocabulary (mass, charge, spin, etc.), the language dependence problem recedes.

  ### 5. So, who won the argument?

  **You win on the intuition:** No serious philosopher of science claims Newton and Aristotle are equally false. The concept of verisimilitude is essential for explaining scientific progress. If we couldn't say later theories are "better approximations," science would just be a sequence of unrelated myths.

  **She wins on the history:** Popper's *specific* 1963 definition is indeed dead. It is a "cautionary tale" in technical philosophy. You cannot define truthlikeness purely by counting logical consequences.

  **The Verdict:**
  The field has **not** given up. They just moved from Popper's "Content Approach" to the "Similarity Approach."
  *   **Formalization:** It is still being formalized (using possible worlds semantics), but everyone acknowledges the language-dependence constraint.
  *   **Informal Usage:** In practice, scientists and most philosophers use the concept informally (as you did), relying on the fact that we generally agree on what the "natural properties" are.

  **Summary for your next chat with her:**
  Tell her you looked up Tichý's 1974 paper. Acknowledge that Popper's content definition is indeed logically broken for false theories. But point out that the "Similarity Approach" (Niiniluoto/Oddie) fixes the Tichý problem, and the language-dependence objection is generally handled by appealing to natural kinds. The intuition survives; only Popper's specific math died.

  You're both right, just at different levels of granularity.
