      *   *Pascal's Context:* He's a Jansenist Catholic. He's writing an *Apology for the Christian Religion*. The *Pensées* are fragments toward proving the need for God/Grace.
      *   *Interpretation:* It's not *just* cynicism. It's a diagnosis of the "Fallen State" (*misère* of man without God). Human reason is corrupted. We *want* justice, but we lack the capacity to agree on it or enforce it without corruption.
      *   *The "Bait-and-Switch":* It highlights the impossibility of a purely rational/secular political order achieving true justice. This sets up the need for a higher authority (God) or at least acknowledges the wretchedness of the human condition. It's sorrowful/resigned, not celebratory (unlike Nietzsche).
