          *   *Pascal:* Pessimistic about reason. The "solution" (making strength just) is a sham/contradiction. It's a diagnosis of sin, not a political blueprint. Hobbes wants to build a Leviathan; Pascal wants to show you why the Leviathan is a broken idol.

