answer: |-
  This is a fantastic observation, and your friend is definitely not imagining things. She has stumbled onto a classic problem in logic, political science, and law known as the **Doctrinal Paradox** (or sometimes the **Discursive Dilemma**).

  It was famously formalized by legal philosopher Philip Pettit and others. It describes exactly this situation: a group can be consistent individually, but when you aggregate their judgments, you get a contradiction depending on *what* you aggregate (the reasons vs. the conclusion).

  Here is the breakdown of why this happens, why she feels cheated, and whether there is a principled way to choose between the two tallying methods. This should give you plenty of meat for your column.

  ### 1. The Logic of the Paradox
  Let's map your friend's scenario to the formal logic.
  *   **The Rule:** Accept $\iff$ (Stats OK) **AND** (Novelty OK).
  *   **The Reviewers:**
      *   **R1:** Stats (Yes), Novelty (Yes) $\rightarrow$ **Accept**
      *   **R2:** Stats (Yes), Novelty (No) $\rightarrow$ **Reject**
      *   **R3:** Stats (No), Novelty (Yes) $\rightarrow$ **Reject**

  **Method A: Conclusion-Based Aggregation (The Journal's Way)**
  You count the final votes.
  *   Accept: 1 (R1)
  *   Reject: 2 (R2, R3)
  *   **Result: Reject.**
  *   *Logic:* We respect the reviewers' holistic judgment. If they say "No," it counts as a "No."

  **Method B: Premise-Based Aggregation (The Friend's Way)**
  You count the judgments on the criteria, then apply the rule.
  *   Stats OK? Yes (R1, R2) vs. No (R3). **Majority says Yes.**
  *   Novelty OK? Yes (R1, R3) vs. No (R2). **Majority says Yes.**
  *   Apply Rule: (Yes) **AND** (Yes) $\rightarrow$ **Accept.**
  *   *Logic:* We respect the explicit acceptance criteria. If the majority agrees the criteria are met, the paper must be accepted.

  ### 2. Is She Right to Feel Cheated?
  **Yes, but with a caveat.**
  She feels cheated because the journal advertised a **premise-based rule** ("Accept only if A and B") but executed a **conclusion-based vote**.

  When an institution sets explicit criteria, it creates an expectation of consistency. If the majority of experts agree the stats are fine, and the majority agree the novelty is fine, rejecting the paper feels like a violation of the contract. It implies the paper was rejected for a reason that no majority actually supported (i.e., there is no majority that thinks *both* stats and novelty are bad).

  However, the caveat is that peer review is rarely a pure democracy. It is an expert consultation.

  ### 3. Is There a Principled Reason to Prefer One Tally?
  This is where it gets interesting for your column. There is no mathematical "correct" answer, but there are philosophical trade-offs.

  **Argument for Conclusion-Based (The Journal's Defense)**
  *   **Holistic Expertise:** A reviewer isn't a sensor measuring one variable. They are an expert weighing the *importance* of variables. Reviewer 2 might believe that "Novelty" is 90% of the value of a paper. To them, "Stats OK" is irrelevant if the idea is old. Counting their "Stats OK" vote as a point toward acceptance (as the Premise method does) misrepresents their expert opinion.
  *   **Responsibility:** In conclusion-based voting, the reviewer owns the decision. In premise-based voting, the editor owns the decision (by tallying the parts). Reviewers often prefer the former because it protects their autonomy.
  *   **Interdependence:** Stats and Novelty aren't always independent. Sometimes shaky stats are forgivable if the novelty is high (pioneering work), or strict stats are required if the novelty is low (incremental work). Reviewers account for this nuance in their final vote; premise-tallying destroys that nuance.

  **Argument for Premise-Based (The Friend's Defense)**
  *   **Transparency & Consistency:** If the journal says "We require X and Y," but rejects a paper where the majority says X and Y are present, the process is opaque. It suggests hidden criteria were used.
  *   **Error Correction:** Reviewers make mistakes. R3 might be wrong about the stats. R2 might be wrong about the novelty. By aggregating premises, you dilute individual errors. By aggregating conclusions, you cement individual vetoes.
  *   **The "Cheating" Factor:** If you use premise-based aggregation, you prevent a situation where a paper is rejected even though the collective wisdom believes it meets the standards.

  ### 4. The Real-World Solution (For Your Column)
  In political theory, the Doctrinal Paradox is often solved by having a **Chairperson** or **Judge** who doesn't just count votes but synthesizes them.

  In academic publishing, that person is the **Editor**.
  *   **The Failure:** The journal failed your friend by treating the reviewers' recommendations as a binding democratic vote rather than advisory input.
  *   **The Fix:** A good editor looks at this exact split (1 Accept, 2 Reject, but split reasons) and realizes: *"We have a consensus that the stats are likely fine, and a consensus that the novelty is likely fine. The rejections are based on single-issue vetoes."*
  *   The editor should then either:
      1.  Override the vote and accept (trusting the premise majority).
      2.  Send it back for revision to fix the specific concerns of R2 and R3.
      3.  Get a 4th reviewer to break the tie on the specific premises.

  ### The Verdict for Your Column
  Your friend is right to feel that the **bookkeeping was flawed**, even if the rejection might ultimately be defensible.

  The principled reason to prefer the **Premise-Based** method is **accountability to stated rules.** If you publish criteria, you must aggregate based on those criteria.
  The principled reason to prefer the **Conclusion-Based** method is **respect for expert discretion.** Experts should be allowed to weigh criteria however they see fit.

  **The Hook:** The problem isn't that the paper was rejected; it's that the journal used a voting system that allows a group to say "Yes, Yes, Yes" to the ingredients, but "No" to the cake. That is the definition of irrational collective behavior.

  **Title Idea:** *The Doctrinal Paradox of Peer Review: How a Paper Can Pass the Test and Still Fail the Class.*

  **One final nuance to mention:** In many fields, Reviewer 2 (Stats OK, Not Novel) is actually the deadliest reviewer. "Solid but boring" is often a harder sell than "Exciting but messy." Your friend's frustration is valid logically, but scientifically, "Not Novel" is often a harder barrier to clear than "Stats Shaky." You might want to interview an editor on whether they view those two criteria as equal weights. If Novelty is weighted 2x higher than Stats, the math changes again!
