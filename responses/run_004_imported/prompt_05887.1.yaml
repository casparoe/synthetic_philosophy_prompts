          *   *The Value of Autonomy:* Aesthetic judgment requires exercising your own sensibility. Deferring is a failure of aesthetic agency.
          *   *Understanding vs. Belief:* Knowing *that* it's good isn't the point; knowing *why* (and feeling it) is. Testimony gives the conclusion, not the grounds.

      *   **Optimist Camp (Why it works/Why we think it doesn't):**
