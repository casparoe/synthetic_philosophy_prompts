prompt: |-
  Okay so I've fallen down kind of a rabbit hole and I want to get properly into the weeds of it rather than the one-line Hume version I already half-know. Context: I'm a novelist, and I get "testimony" about my own work constantly — my agent tells me a subplot doesn't structurally work, my copyeditor tells me a comma splice is wrong, and I just believe them, no problem, thats ordinary testimony doing its job fine. But when three beta readers independently tell me chapter four is "the most beautifully written thing I've done," I notice I don't actually feel like I *know* that until I've reread it myself and felt it land. Apparently theres a whole literature on exactly this asymmetry — something called the problem of aesthetic testimony — and the little bit I've read namechecks Hume's idea that you have to taste the wine yourself, no critic's report can substitute, but that's obviously not a real explanation, it's just the intuition restated in a nicer sentence.

  What I actually want is the anatomy of the puzzle, not the slogan. Why would aesthetic verdicts specifically resist secondhand transmission when plenty of other evaluative, non-purely-factual judgments — a chess move is elegant, a proof is beautiful, a wine is well balanced — seem to sit in some murkier middle ground, more testimony-resistant than "the bridge is structurally sound" but maybe not as absolute as "this poem is moving"? Is the standard move to say aesthetic properties are response-dependent in a way that makes a belief formed on someone else's say-so the wrong *kind* of mental state to count as knowledge even when it's true and the testifier is impeccable, or is it more that what we actually value in aesthetic life was never mere true belief but understanding or appreciation, so testimony hands you a cheap substitute that couldn't have satisfied the goal in the first place? And is this a live fight — are there people who just bite the bullet and say aesthetic testimony works exactly like any other testimony and our discomfort with it is basically snobbery — or has that side more or less lost? I'd like enough of the actual texture and the real moves on both sides that I could put this dispute convincingly in a character's mouth without it sounding like I skimmed one Wikipedia paragraph to get there.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

