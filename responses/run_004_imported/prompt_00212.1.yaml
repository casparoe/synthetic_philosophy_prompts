answer: |-
  **Title:** The Mosaic and the Mandate
  **Characters:**
  *   **Helen:** A defender of the Humean Best-System Analysis (influenced by Lewis and Loewer).
  *   **Arthur:** A defender of Anti-Humean Primitivism (influenced by Maudlin and Armstrong).

  **Setting:** A quiet corner of a university coffee shop, late afternoon. Both are colleagues in the Philosophy Department, but Helen knows the user's background and has tailored the examples accordingly.

  ***

  **Arthur:** I've been reading those recent papers by Loewer you lent me, Helen. I grant he's articulate, but I still feel he's waving a hand over a chasm. The charge of explanatory circularity stands. If the laws are just theorems in the best summary of the particular facts—the "Humean mosaic," as Lewis calls it—then how can those laws *explain* the facts? You can't explain the ingredients by appealing to the recipe you wrote down after tasting the soup.

  **Helen:** The soup analogy is seductive, Arthur, but it begs the question. It assumes explanation must track metaphysical grounding. Loewer's point is that scientific explanation isn't metaphysical grounding. It's a pragmatic relation between a cognitive agent and the world. When I explain why a specific superconductor exhibits zero resistance at 4K, I'm subsuming that particular fact under a general pattern. The fact that the pattern *is* a summary of facts doesn't stop it from organizing my understanding of them.

  **Arthur:** Organizing understanding isn't ontic explanation. Look, let's take a concrete case. You have a cup on the table. I ask: "Why did it fall when I let go?" You say, "Because of the law of gravitation." But on your view, the law of gravitation is nothing over and above the fact that *this* cup fell, and *that* cup fell, and every other mass attracted every other mass throughout the history of the universe. So, strictly speaking, the cup fell because... the cup fell? And everything else fell? That's not an explanation; that's a tautology dressed up in mathematics.

  **Helen:** It's not a tautology because the law isn't just a list of falling cups. It's a *compression*. It's the most informative, concise summary of the mosaic. The explanation works because it connects the local event—the cup falling—to the global structure of the world. If the law were just "this cup fell," you'd be right. But the law is $F = G \frac{m_1 m_2}{r^2}$. That equation allows me to say, "The cup fell *because* it is a mass in a spacetime geometry where this relation holds." The truth-maker for the law is the mosaic, yes. But the *explanans* in a scientific context is the systematization.

  **Arthur:** But what makes the systematization true? The mosaic. And what makes the mosaic the way it is? On my view, it's the laws. There's an asymmetry. The laws govern the particles. The particles don't govern the laws. You've flattened the asymmetry. You've made the laws dependent on the very things they're supposed to constrain. Consider conservation of energy. In your condensed-matter days, you treated energy conservation as a constraint on what processes were *possible*.

  **Helen:** I did. And it was a useful constraint.

  **Arthur:** Exactly. If I propose a perpetual motion machine, you reject it *because* it violates energy conservation. You treat the law as a prior authority that vetoes certain configurations of the mosaic. But if the law is just a summary of what actually happens, how can it veto what *could* happen? If the machine had worked, the law would just have been different. So the law doesn't explain why the machine failed; the machine's failure explains the law. That reverses the scientific direction of explanation.

  **Helen:** It doesn't reverse it; it contextualizes it. Look, Arthur, think about Noether's Theorem. We link conservation laws to symmetries. On a Humean view, the world happens to exhibit time-translation symmetry. The best system captures that symmetry. When I say "energy is conserved," I'm saying "the best summary of the universe reveals time-translation symmetry." When I explain why your perpetual motion machine failed, I'm showing that its operation would have required a break in that symmetry.

  **Arthur:** But *why* is the symmetry there?

  **Helen:** That's a "why" question that might not have a metaphysical answer. It might just be a brute fact about the mosaic. But you, with your "governing laws," don't actually solve this. You posit a relation of "necessitation" between universals. Armstrong's $N(F, G)$. But what is $N$? If it's just a universal like any other, how does it *make* instances of $F$ be instances of $G$? You've added a metaphysical glue, but you haven't explained how the glue sticks. You've just named the mystery "Necessitation."

  **Arthur:** I haven't just named it; I've identified the primitive direction of fit. In your view, the world is a giant accident. It just happens that every electron has charge $-e$. On my view, it is in the nature of the electron, or dictated by the law, that it has charge $-e$. Let's go back to your counterfactuals. Loewer leans heavily on them. "If I had dropped the cup, it would have fallen." You say this is true because the Best System includes gravity. But the Best System is determined by the *actual* mosaic.

  **Helen:** Correct.

  **Arthur:** So, to evaluate the counterfactual, I have to look at the actual mosaic, derive the laws, and then apply them to the hypothetical scenario. But if the hypothetical scenario involves a different initial condition—say, I drop the cup in a world where the mosaic is slightly different—doesn't that change the Best System? If I change enough particular facts, the "best" summary might change. So the truth of the counterfactual depends on the actual facts, which determines the laws, which determines the counterfactual. It feels viciously circular. The laws are held fixed *by fiat*, not by metaphysics.

  **Helen:** It's not fiat; it's a feature of how we reason. When we evaluate counterfactuals, we hold the laws fixed because the laws are the stable part of the system. That stability comes from their simplicity and strength in the Best System. We don't change the laws to accommodate a local miracle because doing so destroys the systematization. That's not a bug; it's how science works. We assume the rules of the game don't change mid-play.

  **Arthur:** But *why* don't they change? Because the laws *govern*. They are the rules of the game, not the scorecard. You're treating the laws like a statistical regularity derived from the data. But in the lab, when you see a deviation, you don't immediately assume the law changed. You assume there was noise, or a new variable. You treat the law as robust against the data. That robustness suggests the law stands above the data.

  **Helen:** I treat the law as robust because abandoning it is costly. It reduces the informativeness of my system. If I change the law every time an anomaly appears, I have no system. But that's a pragmatic constraint on theory choice, not evidence of a metaphysical governor. Arthur, be honest: what does your "governing" add to the physics? If we have the mosaic and the equations, what work is the "necessitation" doing? It's not detectable. It doesn't change the predictions.

  **Arthur:** It changes the *interpretation* of the predictions! It tells us that the regularities aren't cosmic coincidences. Take the EPR correlations. On a Humean view, the correlations between entangled particles are just part of the mosaic. They are brute. On my view, the quantum state (as a law-like entity) constrains the outcomes. It explains *why* the correlations hold across spacelike separation.

  **Helen:** But your "constraint" is just as brute. You say the quantum state necessitates the correlations. I ask, "Why?" You say, "Because it's the law." I say, "Because it's in the Best System." We both end at a brute fact. You locate the bruteness in a relation between universals or a primitive law; I locate it in the global distribution of local qualities. Mine is more parsimonious. I don't posit extra ontological categories.

  **Arthur:** Parsimony isn't the only virtue. Explanatory power matters. And your view suffers from what I call the "inference problem." Even if I grant you $N(F, G)$, how do you get from "It is necessary that Fs are Gs" to "All Fs are Gs"? You need a principle that says necessitation entails regularity. But that principle itself looks like a law. So you need a law to connect your law to the world. It's regress all the way down.

  **Helen:** And you think I don't have a regress? I need to justify why *this* system is the "Best." Best according to whom? Best for what creatures? If laws are relative to our standards of simplicity and strength, aren't they anthropocentric?

  **Arthur:** Precisely! That's my killer point. If laws depend on our notion of simplicity, then in a universe with no scientists, there are no laws. Just a chaotic mosaic. But surely gravity worked before there were physicists to summarize it.

  **Helen:** Not on my view. In a universe with no scientists, there are no *laws*, strictly speaking. There are just regularities. "Law" is a status we confer on regularities that earn their place in our best theories. But the *regularities* themselves are objective. The cup would still fall. The energy would still be conserved. We just wouldn't have the concept of "law" to describe it.

  **Arthur:** That sounds like semantic trickery. You're saying the *word* "law" is subjective, but the *structure* is objective. But the structure you're describing—the Best System—is defined by simplicity. Simplicity is in the eye of the beholder. A complex curve fits the data perfectly; a straight line fits it approximately. Which is the law?

  **Helen:** The one that balances fit and simplicity optimally. Yes, there's a vagueness there. But science is vague. We don't have a precise metric for "theoretical virtue." Does that mean there's no difference between Newtonian mechanics and phlogiston theory? Your view posits a sharp metaphysical line where our practice is fuzzy. I match the metaphysics to the practice.

  **Arthur:** But you lose the modality. You can't account for physical necessity. On your view, it's physically possible for the cup to float up, provided that in the global mosaic, cups floating up is rare enough not to ruin the summary. But that's not how we think about possibility. We think some things are *forbidden*.

  **Helen:** They are forbidden relative to the system. "Physically impossible" means "incompatible with the Best System." It's not absolute metaphysical impossibility. And that's enough for physics. I don't need to tell you that a perpetual motion machine is metaphysically incoherent. I just need to tell you it won't work, and that the framework predicting it won't work is the one that successfully predicted everything else.

  **Arthur:** So you reduce physical necessity to a kind of high-probability expectation based on past data.

  **Helen:** I reduce it to systematization. Look, Arthur, think about the user who asked for this dialogue. Forty years in condensed matter. Did they ever need "governing relations" to do the experiment? Or did they need robust patterns, symmetries, and mathematical consistency?

  **Arthur:** They needed to know that the apparatus wouldn't spontaneously turn into a duck. They needed to trust that the laws *held* the world together.

  **Helen:** And the world *did* hold together. The mosaic was stable. My view accounts for that stability without adding invisible metaphysical glue. Your view adds the glue but admits you can't see it, measure it, or explain how it sticks without circularity. We both have brute facts. I have the brute fact of the global mosaic. You have the brute fact of the governing relation. I claim mine is leaner. You claim mine is shallow.

  **Arthur:** And I claim that "lean" shouldn't come at the cost of making the world seem like a cosmic accident. If the laws are just summaries, then the uniformity of nature is the greatest coincidence in history.

  **Helen:** And if the laws are governors, the existence of the governor is the greatest coincidence in history. Why *that* law and not another? You haven't eliminated the brute fact; you've just moved it from the distribution of particles to the relations between universals.

  **Arthur:** But I've preserved the direction of explanation. The laws explain the mosaic.

  **Helen:** But you haven't explained the laws. I explain the laws as tools for understanding the mosaic. We both stop somewhere. The question is: where is it more useful to stop?

  **Arthur:** *[Takes a sip of coffee]* I suppose that depends on whether you think science is about mapping the territory or writing the map.

  **Helen:** And whether you think the map can exist without a cartographer.

  **Arthur:** Touché. But I still say the cup falls because it must, not because it fits a pattern.

  **Helen:** And I say "must" is just the name we give to the patterns that never break.

  **Arthur:** Then we're at an impasse.

  **Helen:** We are. But at least we agree the coffee won't spontaneously boil in the cup.

  **Arthur:** Unless the mosaic says otherwise.

  **Helen:** Or unless the law permits it.

  **Arthur:** *[Smiles]* Same difference, for now.
