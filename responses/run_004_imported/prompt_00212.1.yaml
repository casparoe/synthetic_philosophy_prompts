      *   **The Anti-Humean (A):** Needs to defend the intuition that laws *make* things happen. Likely an Armstrong-style necessitarian or a Primitivist like Maudlin. Let's call him *Arthur*. He should focus on the direction of explanation and the intuition that the mosaic is contingent on the laws, not vice versa.
