      *   *Frank's Practice:* He didn't use his philosophy to detach; he used it to soften. He knew the causes, so he didn't hate the sinner, but he still loved the neighbor.
      *   *Gratitude:* The prompt mentions he welled up over dumb kindnesses. This is crucial. If no one deserves credit, why thank anyone? Because the gift matters, not the metaphysical merit.
