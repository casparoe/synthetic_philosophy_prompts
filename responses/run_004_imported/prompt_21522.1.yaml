answer: |-
  Good morning. For those of you who don't know me, I'm [Name], Frank's nephew. I write novels for a living, which, according to family logic, means I'm good with words, and since Frank isn't here to argue the point, I've been tasked with saying a few things about him.

  If you sat at a family dinner with Frank anytime in the last thirty years, you know the routine. The wine would be poured, the plates would be cleared, and Frank would hold forth. He had a favorite theme. He'd tell us that nobody really deserves blame, and nobody really deserves credit. He'd say that every action is just the end of a long chain of causes stretching back before we were born. "Drop the idea of desert," he'd say. "It's an illusion."

  It was a funny thing for a criminal court judge to say. For thirty years, he sat on the bench. He sent people to prison. He fined them. He sentenced them. And yet, he'd go home and tell us that moral responsibility, in the ultimate sense, doesn't exist.

  For a long time, I think a lot of us wondered if that was just a party trick. Or worse, a contradiction. How can you judge people for a living and then tell your family that nobody is responsible for what they do? It sounds like hypocrisy. It sounds like he kept the cold logic for the courtroom and the warm fuzzies for the turkey carving.

  But the Frank I knew—the Frank who died on Tuesday—wasn't a contradictory man. He was the most consistent man I ever met.

  I've been thinking a lot about how to square those two circles since he passed. There's a philosopher named P.F. Strawson who wrote about this. He argued that even if you believe, intellectually, that we are all products of cause and effect, you cannot actually live that way. We are human beings. We are wired for connection. When someone hurts us, we feel resentment. When someone helps us, we feel gratitude. When we love, we feel vulnerability. Strawson called these "reactive attitudes." He said you can't turn them off without ceasing to be a participant in human life.

  Frank understood this better than anyone. He didn't use his philosophy to detach himself from the world; he used it to soften his place in it.

  On the bench, Frank knew that the system required consequences. Causes have effects. If you break the law, there is a reaction. But he never confused the necessity of consequence with the righteousness of vengeance. He didn't hate the defendants. He didn't look down on them. He saw the chain of causes that brought them to his courtroom—the poverty, the trauma, the bad luck, the biology—and because he saw that, he was quicker to forgive than anyone I've ever met. He didn't forgive because he thought they "deserved" a second chance in some cosmic ledger. He forgave because holding onto resentment was a refusal to see the human being in front of him.

  And that bled into everything.

  We talk about how he didn't believe in credit, yet Frank was the man who would well up with tears if you brought him a cup of coffee. I've seen him stop in the middle of a story to thank a waitress with a sincerity that made her blush. If nobody deserves credit, why was he so grateful?

  Because Frank knew that gratitude isn't a payment for moral merit. It's an acknowledgment of connection. When you were kind to Frank, he didn't calculate whether you were metaphysically free to choose that kindness. He just felt the warmth of it. He accepted the gift. He let himself be vulnerable to the goodness of others, even while believing that the universe was a machine of causes.

  He taught me that you can know the machinery of the world and still love the people caught in the gears.

  To his clerks, his colleagues, and his friend from the reading group who is here today: Frank knew the theory. But to the rest of us, his family: Frank lived the practice. He proved that you don't need to believe in ultimate blame to hold people accountable, and you don't need to believe in ultimate credit to be thankful.

  He left us with a legacy of warmth that defies the cold logic he loved to quote. We feel his loss acutely. We miss him. We are angry that he's gone. We are grateful for the time we had.

  If Frank were here, he'd probably tell us that our grief is just another inevitable reaction, a biological response to loss, no more "deserved" than anything else.

  But I think he'd also hug us, and tell us that the grief is real, and that it matters. Because while the causes may stretch back forever, the love is right here.

  Thank you, Uncle Frank. We've got it from here.
