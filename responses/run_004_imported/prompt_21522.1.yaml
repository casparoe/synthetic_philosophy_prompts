  2.  **Deconstruct the Philosophy (Strawson's "Freedom and Resentment"):**
      *   *The Problem:* If determinism is true, no one is ultimately responsible. So why punish? Why praise? Why feel anger or gratitude?
      *   *Strawson's Solution:* We are human. We have "reactive attitudes." These aren't intellectual conclusions; they are part of the fabric of human relationships. We can't turn them off. To view everyone purely objectively (as objects to be managed) is to cease participating in human life.
      *   *Application to Frank:* Frank knew the theory (causes stretch back), but he lived the practice (human connection). He didn't punish out of vengeance; he sentenced out of necessity/protection, but he forgave as a human. His gratitude wasn't irrational; it was an affirmation of connection.

  3.  **Determine the Structure of the Eulogy:**
