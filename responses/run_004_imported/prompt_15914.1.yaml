          *   *Differences:* Linguistic/Conceptual vs. Mathematical/Functional. Goodman is about *what we say*, ML is about *what function fits*. Also, ML bias is often explicit (hyperparameters), entrenchment is implicit in language use.
          *   *Key nuance:* In ML, we can change bias (choose a different model). For Goodman, entrenchment is deeply tied to our form of life/language. We can't just decide "Bleen" is entrenched tomorrow; it takes generations of usage.
