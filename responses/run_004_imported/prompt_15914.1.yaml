          *   ML Analogy: Meta-learning. We learn which biases work by testing them. But the ultimate assumption (stationarity of data distribution) remains unproven.
          *   Conclusion on circularity: It's virtuous circularity (coherence), not vicious circularity (begging the question), *if* you accept Goodman's pragmatic shift.
