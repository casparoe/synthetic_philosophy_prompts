  so we learned about the handicap principle in ap bio (zahavi's peacock tail example — the giant tail is supposed to be an "honest signal" of fitness bc only a genuinely strong bird could survive dragging around such a huge handicap). i saw a video applying the same idea to humans, like how buying a rly expensive car or watch is an honest signal that someone's actually rich since it costs so much. but doesnt that mean literally any absurdly overpriced purchase counts as an honest signal? so many people i know lease cars or run up credit card debt just to look richer than they are, which seems like it should completely break the theory. is the handicap principle just wrong for humans, or is there some part of it i'm missing?
