  5.  **Synthesizing the Argument:**
      *   **Thesis:** The WKR framework generally *undermines* the claim that usefulness is a genuine reason for belief *in the same sense* that evidence is. It structurally categorizes pragmatic reasons as "state-given," which are the "wrong kind" for constitutive norms of belief (truth).
      *   **Nuance:** However, the WKR debate reveals a loophole: *Hybrid Attitudes* or *Re-categorization*.
