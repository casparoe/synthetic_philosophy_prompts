      *   **Specific Question:** What are the implications of WKR for *this specific debate*? Do standard fixes for WKR (object-given vs. state-given, etc.) allow pragmatists to claim usefulness is a *genuine* reason to believe, or do they confirm that useful beliefs are structurally identical to admiring the demon?
      *   **Constraint:** Do not default to "Pascal's Wager is bad epistemics." The user knows this and wants the *structural* philosophical point.

  2.  **Initial Assessment & Mapping:**
      *   *FA Theory:* $X$ is valuable iff it is fitting to have a pro-attitude toward $X$.
      *   *WKR Problem:* The demon threatens you. You have a reason to admire him (to avoid pain), but this doesn't make him admirable. The reason is the "wrong kind."
      *   *Epistemic Parallel:* $P$ is justified/believable iff... (something about truth/evidence). You have a reason to believe $P$ (it makes you happy/successful), but does this make $P$ justified/believable?
      *   *The Crux:* The distinction between *reasons for the attitude* (state-given) vs. *reasons for the object of the attitude* (object-given). In belief, this maps to *pragmatic reasons* vs. *evidential reasons*.

  3.  **Analyzing the Standard Fixes for WKR:**
      *   *Fix 1: Object-Given vs. State-Given Reasons (Rabinowicz/Rønnow-Rasmussen).*
          *   Value case: Admiration must be based on properties of the *object* (the demon's traits), not properties of the *state* of admiring (avoiding torture).
          *   Belief case: Belief must be based on properties of the *proposition* (truth indicators), not properties of the *state* of believing (happiness/success).
          *   *Implication:* This fix *blocks* the pragmatist. It structurally identifies pragmatic reasons as the "wrong kind" for belief, just like the demon threat is the "wrong kind" for admiration.
      *   *Fix 2: The "Fittingness" Constraint.*
          *   Value case: Admiration is fitting only if the object merits it.
          *   Belief case: Belief is "fitting" (correct) only if the proposition is true (aim of belief is truth).
          *   *Implication:* Usefulness doesn't make a proposition true. Therefore, usefulness cannot make belief fitting.
      *   *Fix 3: Constitutive Aim of Belief (Velleman/Shah).*
          *   Belief *just is* a state that aims at truth. To believe for pragmatic reasons is to cease believing (or engage in self-deception).
          *   *Implication:* You literally *can't* believe for pragmatic reasons in the same way you can admire for pragmatic reasons. It's a category error.

  4.  **Searching for Pragmatist Openings (The "Generalize" part of the prompt):**
      *   Are there ways to salvage pragmatic reasons using WKR logic?
