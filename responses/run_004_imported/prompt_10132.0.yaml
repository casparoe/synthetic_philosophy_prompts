answer: |-
  Elian was a mender of clocks, but for three days he had not touched a gear. He sat on the stool in his workshop, watching a pendulum swing.

  It was a heavy brass thing, suspended from a beam he had tested for rigidity a dozen times. Left. Right. Left. Right. The rhythm was the heartbeat of his trade, the assurance that time was a container things moved through, pushing the seconds forward like a cart down a lane.

  But yesterday, he had seen it stop.

  Not slow down. Not catch on a burr. It had been at the apex of the left swing, and in the next instant, it was at the apex of the right. The middle did not happen.

  He had blinked, assuming a trick of the light, a fatigue of the optic nerve. But Elian was a man of lenses and calipers. He trusted measurement over flesh. So he had set up the high-speed shutter, a device of his own design meant to capture the fracture of a falling gem. He aimed it at the pendulum.

  When he developed the plate, the pendulum was on the left. In the next frame, it was on the right. Between them, there was no blur. There was only empty space where the brass should have been traversing.

  It wasn't moving. It was being placed.

  Elian rubbed his eyes. The workshop smelled of oil and cold iron. On the workbench, a candle burned. He leaned in, bringing his face close to the wax. He watched the flame lick the wick. In his mind, the heat traveled down, melting the solid into liquid, fueling the fire. Cause and effect. The fire *made* the wax melt.

  He focused until his eyes watered. He looked for the transfer. He looked for the moment the heat touched the wax and compelled it to change.

  He saw the flame. He saw the solid wax. Then, a breath later, he saw the flame and the liquid wax.

  There was no bridge. The flame did not touch the wax. The universe simply presented a state of affairs: *Fire here, Wax solid.* Then it presented a new state: *Fire here, Wax liquid.* The connection was a story he told himself to make the sequence feel safe.

  "Elian?"

  He jumped. Sela stood in the doorway. She held a basket of laundry, her knuckles white on the rim. She had been asking him about the roof for a week. The thatch was thinning, and the rains were coming.

  "The roofer came by," she said, her voice tight. "He says if we don't patch the ridge by Tuesday, the beams will rot. He needs an answer. Are we paying him?"

  Elian looked at her. He looked at the basket. He looked at the space between them.

  "If we pay him," Elian said, his voice sounding strange to his own ears, "he will patch the roof."

  "That is what I am asking," Sela said. She stepped into the room. The floorboards did not creak under her feet; they simply were pressed, and then sound occurred. Two events, conjoined by habit. "Do you want the house dry this winter?"

  "I want many things," Elian said.

  "Then promise me." She set the basket down. "Promise me you will settle the account tomorrow."

  *Promise.* The word hung in the air. A promise was a contract with the future. It assumed that Elian's will today could bind his legs to move tomorrow, that his hand could compel coins to move from a purse to a roofer's palm. It assumed that his action was the *cause* of the result.

  But if the coins moved, it would not be because Elian willed it. It would be because the next moment of the world was computed with the coins in the roofer's hand, alongside the memory of Elian's agreement. Elian was not the author of the transaction. He was merely a witness to it.

  "I cannot promise," Elian said softly.

  Sela's face tightened. The hurt was immediate, a flush rising on her neck. "You won't. You mean you won't."

  "I mean I don't know if I can make anything happen, Sela. Not even that."

  She laughed, a sharp, brittle sound. "This is about the clock, isn't? You've been staring at that pendulum until you've frightened yourself. You think if you stop working, the world stops?"

  "I think the world is working without me."

  She came to him then, kneeling by the stool. She took his hands. Her skin was warm. He felt the pressure of her fingers. But did she *make* him feel warmth? Or did the sensation arise in his mind because her hand was juxtaposed with his?

  If he squeezed back, would she feel it? Or would the universe create the sensation in her nerves independently of his muscle contraction?

  "I love you," she said. It was a plea. "I love you, and I need to know that you are here. That when I leave this room, you will still be here. That when I come back, the house will still stand."

  "Love," Elian repeated. He looked at their joined hands. If causation was a habit, then love was the strongest habit of all. It was the expectation that because she was here today, she would be here tomorrow. But there was no necessity in it. God—or the Logic, or the Void—could create a tomorrow where Sela walked out the door and never returned, where the roof collapsed, where Elian sat alone. There was no chain of events preventing it. There was only custom.

  "Sela," he said. "If I hold your hand, I am not touching you. We are just... near."

  She pulled away. The loss of pressure was instant. "You are speaking in riddles to avoid responsibility. The roof is leaking. That is a fact. The water will rot the wood. That is a fact. If you do nothing, we will be cold. Is that a riddle?"

  "If I do nothing," Elian said, "the wood may rot. Or it may not. My doing nothing is not the cause. It is just... the scene before the scene of rot."

  "Blame me, then," she snapped, standing up. "Blame me for the leak. Blame the rain. But stop looking at me as if I am a painting."

  "I don't blame you," he said. And he realized it was true. Blame required agency. To blame her for being angry, or himself for being distant, required the belief that they could have chosen otherwise. But if every moment was a fresh creation, choice was an illusion of continuity. She was angry because this moment contained anger. He was distant because this moment contained distance. There was no one to fault.

  The emptiness of it should have terrified him. It should have made him fall to his knees. Instead, he felt a strange, light calm. The weight of being the engine of the world slid off his shoulders. He was not the engine. He was the exhaust. He was the smoke.

  Sela waited for him to argue, to fight, to grab her arm and insist that he *would* fix the roof. When he didn't, she turned.

  "I'm going to my sister's," she said. "Until you are ready to live in the world again."

  She walked to the door. She opened it. She stepped through.

  Elian watched her go. He knew the logic of the street. He knew that usually, a woman walking alone at dusk arrived at her destination. But there was no *usually*. There was only *now*.

  He stood up. He walked to the workbench. He picked up the hammer. He looked at the nail.

  If he struck the nail, it would not be because his arm drove it. It would be because the next frame of reality showed the nail head flush with the wood. His effort was just a ritual. A prayer performed with muscles.

  He raised the hammer.

  He thought of Sela on the road. He thought of the roof. He thought of the candle.

  He brought the hammer down.

  *Clack.*

  The nail sat flush. The wood was unbroken. The sound had happened.

  Elian looked at his hand. It vibrated with the impact. The sensation was vivid, undeniable. It didn't matter that he hadn't *caused* it. The experience was the same. The warmth of the hammer handle, the smell of the iron, the sight of the secured nail.

  If the universe was a series of snapshots, then this snapshot was beautiful. And the next one might be too.

  He picked up the second nail. He did not do it to fix the roof. He did not do it to please Sela. He did it because the Habit was strong, and he was part of the Habit. He was the fire, and the cotton, and the burning.

  Outside, the sun set. It did not sink; it vanished, and then the moon appeared. Elian did not light a lamp. He sat in the growing dark, waiting for the next image to appear, holding his breath not to change it, but simply to witness the miracle that there was another image at all.
