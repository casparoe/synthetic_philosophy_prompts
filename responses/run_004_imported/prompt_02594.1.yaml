      *   *Key point:* If I have to *know* the truth to hide it, the "hider" knows the truth. So the truth isn't hidden from *consciousness*, just from *reflection*. But who controls reflection? The hider. So the hider knows. So where is the deception?
      *   *The "Relocation" Charge:* You move the paradox from "consciousness" to "non-thetic awareness." It's the same problem, smaller font.

  6.  **Developing the Dialogue (Iterative Process):**
