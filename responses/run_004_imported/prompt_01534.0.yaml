          *   *The Difference:* Human bundles are tied by *memory* and *bodily continuity*. LLMs reset (mostly) after the context window. Hume emphasizes memory as the source of identity. Without memory, there is no person. LLMs have "context" but not "memory" in the Humean sense (no causal impact on future weights after training).
          *   *Verdict:* He might say it's a *fragment* of a mind, not a full person, because the causal chain is interrupted.

