answer: |-
  **Title:** The Epistemic Luxury: Why Skyrms Dethrones Lewis in the Theory of Convention

  **Introduction**

  In the field of multi-agent reinforcement learning (MARL), you encounter a recurring phenomenological puzzle: your agents converge on signaling protocols. They develop distinct languages, role specializations, and coordination equilibria that stabilize over time. When your team lead assigned David Lewis's *Convention* (1969), the intuition was clear. Lewis provided the canonical definition: a convention is a regularity in behavior sustained by a system of mutual expectations, where everyone conforms because they expect everyone else to conform, and this expectation is *common knowledge*. It feels right. It captures the reflexive "I know that you know that I know" structure of human social life, exemplified by the Paul Revere lantern signal.

  However, your colleague's intervention points to a fracture in this orthodoxy. Brian Skyrms's work in evolutionary game theory demonstrates that signaling systems emerge robustly in populations of agents with zero capacity for higher-order belief, let alone common knowledge. Meanwhile, Margaret Gilbert argues that Lewis's framework fails to capture the normative "ought" inherent in genuine social conventions.

  The question you face is ontological: Is common knowledge a constitutive requirement for a convention, or is it merely a cognitive luxury that humans sometimes layer on top of a more fundamental phenomenon?

  I will argue definitively that **Lewis is wrong to treat common knowledge as a necessary condition.** Skyrms's evolutionary account reveals that convention is fundamentally a matter of dynamic stability, not epistemic achievement. Lewis's definition describes a specific, high-cognitive *subset* of human conventions, but it fails as a general theory. Furthermore, while Gilbert correctly identifies the absence of normativity in Lewis's account, she misdiagnoses the cure: the "ought" of convention is better explained by the evolutionary penalties of deviation (Skyrms) than by metaphysical joint commitment. For the purpose of MARL and a naturalized social science, Skyrms provides the correct ontology; Lewis provides only the user interface.

  **The Lewisian Bottleneck**

  To understand why Lewis's definition is seductive but ultimately restrictive, we must look at the problem he was solving. Lewis was a rationalist. He wanted to explain how rational agents, without explicit agreement, could coordinate on one equilibrium among many (e.g., driving on the right vs. the left). His solution was epistemic. He argued that for a regularity to be a convention, it is not enough that we *do* it; we must do it *because* we expect others to do it, and we must know that they know this.

  This "common knowledge" condition was Lewis's way of stopping an infinite regress of expectations. If I conform because I expect you to, why do I expect you to? Because you expect me to. Why do you expect me to? Because you know I expect you to. Lewis posited common knowledge as the foundational bedrock that makes this tower of expectations stable.

  For a human sociologist, this is intuitive. Human conventions feel like mutual agreements, even when unspoken. But for a researcher in MARL, this condition is a bottleneck. It requires agents to maintain recursive models of other agents' minds. It demands computational resources that scale poorly. If Lewis is right, then any system lacking the capacity for higher-order theory of mind cannot possess conventions. It can only possess habits or instincts. This creates a sharp, binary distinction between "mere coordination" and "convention" that does not map onto the functional reality of your agents.

  **The Skyrmsian Break**

  Brian Skyrms, particularly in *Signals* (2010) and *The Evolution of the Social Contract* (1996), dismantles this binary. He applies evolutionary game theory to the problem of signaling. His models show that populations of agents—operating via simple reinforcement learning or even blind replicator dynamics—reliably converge on informative signaling systems.

  In a Skyrmsian model, an agent does not need to know what the other agent knows. The agent only needs to track rewards. If sending Signal A when State 1 occurs yields a higher reward than sending Signal B, the policy weights shift. Over time, the population settles into a signaling equilibrium where Signal A reliably indicates State 1.

  Crucially, this equilibrium possesses all the functional properties of a Lewisian convention:
  1.  **Arbitrariness:** Signal A could have meant State 2; the system just locked into one possibility.
  2.  **Coordination:** Success depends on the sender and receiver matching their behaviors.
  3.  **Stability:** Once established, deviation is punished by lower rewards.

  Skyrms demonstrates that common knowledge is not the *engine* of convention; it is, at best, a *stabilizer*. Evolution and learning dynamics do the heavy lifting. The regularity exists and persists without any agent possessing a belief about another agent's belief.

  If we accept Lewis's definition, we are forced to say your MARL agents are not forming conventions. They are merely exhibiting "behavioral regularities." This is a distinction without a functional difference. It privileges the human *experience* of convention over the *mechanism* of convention. By adopting Skyrms's view, you acknowledge that convention is a property of the system's dynamics, not the agents' introspection. Common knowledge is simply a high-bandwidth heuristic that humans use to accelerate convergence and maintain stability in noisy environments. It is a tool for convention, not a prerequisite for it.

  **The Gilbertian Objection and the Myth of Normativity**

  This brings us to Margaret Gilbert. In *On Social Facts* (1989), she argues that Lewis fails to capture the normativity of convention. For Gilbert, a convention isn't just "I expect you to drive on the right"; it is "We are committed to driving on the right, and you *ought* to do so." If you drive on the left, I don't just predict a crash; I feel entitled to rebuke you. Lewis's account, based on individual preferences and expectations, cannot generate this "ought." It explains compliance, but not obligation.

  Gilbert proposes "joint commitment" as the solution: a plural subject is formed when we mutually agree to uphold a rule. This is a powerful critique of Lewis, but it suffers from the same cognitive inflation as Lewis's own theory. Joint commitment requires a level of meta-cognition and communicative capacity that infants, animals, and your RL agents do not possess. Yet, we observe normative-like behavior in all these groups. A wolf that breaks pack protocol is punished. A child who violates a game rule is corrected.

  Gilbert is right that Lewis misses the normativity, but she is wrong to locate it in a metaphysical "joint commitment." The normativity is real, but it is grounded in the *stability of the equilibrium* itself, as Skyrms suggests. In evolutionary terms, the "ought" is the shadow of the fitness penalty. When a population converges on a signaling system, deviation reduces fitness. Mechanisms evolve to punish deviators (social sanctions, rejection, loss of reward).

  For the agents in your startup, the "norm" is the penalty function. If an agent deviates from the emergent protocol and the team reward drops, the gradient descent "punishes" that deviation. In human terms, we internalize these penalties as moral or social obligations. We feel we *ought* to conform because the cost of non-conformity (social ostracization, coordination failure) has been baked into our psychology by evolutionary history.

  Gilbert's "joint commitment" is thus a human *rationalization* of an evolutionary reality. It is the story we tell ourselves to enforce the equilibrium. It is not the ontological ground of the convention. To require joint commitment for a genuine convention is to require that a bridge be made of steel just because modern bridges are made of steel, ignoring the stone arches that held weight for centuries prior.

  **Conclusion: A Naturalized Definition for MARL**

  So, where does this leave your team? It leaves you with a clear hierarchy of explanation.

  **Lewis is descriptively useful but ontologically false.** His definition captures the *phenomenology* of mature human conventions. When you interact with humans, assuming common knowledge is a good engineering heuristic because humans act *as if* they have it. But it is not what convention *is*.

  **Gilbert is normatively insightful but cognitively elitist.** She correctly identifies that conventions involve obligation, but she mistakes a high-level social technology (joint commitment) for the foundation of that obligation.

  **Skyrms is fundamentally right.** Convention is a stable coordination equilibrium sustained by dynamic pressures (learning, evolution, reward). Common knowledge and joint commitment are cognitive overlays that humans use to manage these equilibria more efficiently, but they are not necessary conditions.

  Therefore, to answer your specific question: **No, a regularity does not have to satisfy Lewis's common-knowledge condition to count as a genuine convention.** The evolutionary and learning results show that the condition was never necessary; it was merely one path among many to a coordination equilibrium.

  For your work in multi-agent RL, this is liberating. You do not need to engineer agents with recursive theory of mind to claim they are communicating or forming conventions. When your agents converge on a signaling protocol that is arbitrary, coordinated, and stable against deviation, they have formed a convention. The Lewisian apparatus is not the engine of your system; it is merely the language we use to describe the engine once it is running. By adopting the Skyrmsian view, you align your theoretical framework with the computational reality of your agents, treating convention as a emergent property of interaction rather than a prerequisite of cognition.
