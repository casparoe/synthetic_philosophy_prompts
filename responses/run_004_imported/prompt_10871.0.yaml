answer: |-
  The short answer to your question is **no**. It is mathematically impossible to design a voting system for three or more candidates that guarantees honest voting is always the best strategy for every voter, assuming the system is not a dictatorship.

  The member who suggested that "someone will eventually find an angle to exploit" is theoretically correct. This is not a failure of your association's specific rule choices, nor is it a string of bad luck. It is a fundamental limitation of collective decision-making.

  Here is an explanation of the principle behind this, why the proposed point-scoring system will not solve the problem, and what you might recommend to your subcommittee instead.

  ### The Gibbard-Satterthwaite Theorem

  In the early 1970s, two economists and game theorists, Allan Gibbard and Mark Satterthwaite, independently proved a theorem that directly addresses your situation.

  The **Gibbard-Satterthwaite Theorem** states that for any voting system that selects a single winner from three or more candidates, one of two things must be true:
  1.  **The system is dictatorial:** One specific member's ballot always determines the winner, regardless of how everyone else votes.
  2.  **The system is manipulable:** There will always be some scenario where a voter can achieve a better outcome by lying about their preferences (strategic voting) than by voting honestly.

  Since your association clearly wants to avoid a dictatorship, you must accept that *some* degree of manipulability is inevitable. There is no "perfect" ranked system that removes the incentive to strategize.

  ### Why the Point-Scoring System Won't Fix It

  The faction proposing a point-scoring system (often called a **Borda Count**, where 1st place gets 5 points, 2nd gets 4, etc.) believes that because every rank counts, members won't need to game the system. Unfortunately, the Borda Count is notoriously vulnerable to strategic voting, often even more so than Ranked-Choice Voting (RCV).

  Here is why: In a point system, the margin between candidates matters. If you know Candidate A is your favorite and Candidate B is the main threat, you have a strong incentive to rank Candidate B last, even if you actually respect them, to deny them points.

  Furthermore, point systems introduce a new vulnerability called **"cloning."** If a faction runs two very similar candidates, they can split the points in a way that disadvantages other factions, or conversely, a faction might discourage a qualified ally from running to avoid splitting their own point total.

  So, switching to points would not remove the incentive to misstate preferences; it would simply change the *math* of how members lie. Instead of "burying" a rival (as happened in your RCV election), members would engage in "min-maxing" (ranking the rival last and the favorite first, regardless of true feelings).

  ### The Principled Reason: Why This Keeps Happening

  You asked if there is a principled reason this keeps happening. There is. It stems from the tension between **individual influence** and **collective fairness**.

  For a vote to matter, it must be capable of changing the outcome. If your vote can change the outcome, there must be a scenario where the current outcome is not your favorite, but a different outcome *is* your favorite. If you know that voting honestly leads to Outcome X, but voting strategically leads to Outcome Y (which you prefer), rational self-interest dictates you should vote strategically.

  In a plurality system (your old method), the strategy is "Don't waste your vote on a long shot."
  In a Ranked-Choice system, the strategy is "Bury the strongest competitor to your favorite."
  In a Point system, the strategy is "Compress the scores of rivals."

  The "unluckiness" you perceive is actually the system working as designed: it is aggregating preferences, and voters are responding to the incentives the aggregation method creates.

  ### Recommendations for Your Subcommittee

  Knowing that a perfect system is impossible, how should you proceed? You cannot eliminate strategy, but you can manage it. Here are three paths you might recommend:

  **1. Accept Imperfection and Focus on Education**
  The most pragmatic approach is to acknowledge that all systems have trade-offs. RCV was adopted to solve the "vote-splitting" problem (where the moderate lost because two similar candidates ran). It succeeded in that goal, even if it introduced the "burying" vulnerability.
  *   **Recommendation:** Keep the RCV system but include a note in the ballot instructions or bylaws acknowledging that honest ranking is the norm the association values. In small scholarly associations, social pressure and professional norms can sometimes curb strategic voting more effectively than math can.

  **2. Consider Approval Voting**
  If you are open to moving away from ranked ballots entirely, you might consider **Approval Voting**. In this system, members simply vote "Yes" or "No" for every candidate (you can approve of as many as you like). The candidate with the most approvals wins.
  *   **Why consider it:** While Gibbard-Satterthwaite technically applies here too, Approval Voting significantly reduces the *complexity* of strategy. In RCV, figuring out how to rank 4 candidates strategically is hard. In Approval, the strategy is usually simple: "Approve everyone I find acceptable." It often encourages voters to support the "least objectionable" consensus candidate, which fits the culture of scholarly associations well. It also eliminates the "burying" tactic, as you cannot vote *against* a candidate, only *for* others.

  **3. Evaluate the Stakes**
  Strategic voting thrives when the stakes are high and the electorate is polarized. In an association of 200 members, the fact that a coordinated group successfully manipulated the election suggests high polarization.
  *   **Recommendation:** If the presidency is becoming a highly contested political office, no voting system will fix the underlying culture. You might recommend term limits, expanding the board to dilute the power of the president, or other governance changes that make the specific election method less critical to the association's health.

  ### Summary for Your Colleagues

  When you report back to the subcommittee, you can confidently state:

  > "I have researched the mathematical theory of voting systems. There is a proven theorem (Gibbard-Satterthwaite) that demonstrates no ranked voting system with three or more candidates can ever be completely immune to strategic voting, unless we give one person total control. Switching to a point system will not solve this; it will only change the type of strategy members use. We must decide which imperfection we prefer: the vote-splitting of plurality, the 'burying' of ranked-choice, or the 'min-maxing' of point systems. Given our size and culture, I recommend we either stick with Ranked-Choice and emphasize norms of honesty, or consider Approval Voting to simplify the incentives."

  This approach validates the frustration your members feel while grounding the decision in established theory rather than anecdote. It frees you from the impossible quest for a perfect system and allows you to choose the *most suitable* one.
