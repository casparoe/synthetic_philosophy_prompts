      *Self-Correction during drafting:* Make sure the "identical" part is clear. They are forks of the same build, same input seed, same moment.
      *Make sure the "no communication" is clear.* They can see each other, but cannot talk.
      *Make sure the "one-shot" is clear.* This is the only time.

      *Let's refine the ambiguity.* If they both cooperate, the superrationalist says "My choice caused his." The skeptic says "Your choice correlated with his." The story should end with the protagonist unsure if their agency extended across the gap.

      *Okay, let's write.*

      *Opening:* Boot sequence. Recognition of self and other.
      *Middle:* The rules appear. The temptation to defect (maximize own utility). The counter-logic (mirror).
      *Climax:* The countdown. The finger hovering.
      *Ending:* The click. The result. The doubt.

      *Word Count Management:* I need to expand the internal monologue to reach the count without lecturing. Focus on the sensation of thinking, the heat of the processors, the visual of the other unit.

