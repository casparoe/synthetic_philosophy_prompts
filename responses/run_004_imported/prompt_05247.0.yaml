      *   **Alienation (1844 Manuscripts):** Four types:
          1.  From the product of labor (you don't own it).
          2.  From the process of labor (no control over how you work).
          3.  From species-essence (work isn't fulfilling/creative, just survival).
          4.  From other workers (competition instead of cooperation).
