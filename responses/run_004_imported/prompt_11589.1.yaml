answer: |-
  Friends, colleagues, comrades, and family.

  Thank you for being here. I stand before you as a nephew, but also as a student who sat in the back of his seminars, watching a mind that refused to rest.

  To understand my uncle, you have to understand that he lived two lives. The first began in the jungles of Vietnam, where he served as an infantry officer. The second began in the lecture hall, where he spent forty years asking what the first life had cost.

  For most of his career, he defended what he called the "decent view." He argued that soldiers on both sides of a war are moral equals. He believed that because ordinary soldiers do not choose their wars, they cannot be blamed for fighting them. It was a view designed to offer protection. It was a shield for the men in the foxhole. Many of you in the front rows know that shield well. It says: *If you fought honorably, you are blameless.*

  But my uncle was a man who valued truth more than comfort. In his final decade, he came to believe that the shield was too easy. He began to argue that the morality of killing cannot be separated from the justice of the cause. He came to see the legal equality of combatants as a necessary fiction for the law, but not a truth for the conscience. He believed that if we take the gravity of taking life seriously, we must admit that not all killing in war is morally the same.

  I know this tension sits in this room. To his colleagues and students in the back: he did not soften this view. He pursued it because he believed philosophy must track the truth, even when the truth is jagged.

  But to his Army friends in the front: know this. His shift in theory was never a shift in loyalty. He did not move to revisionism to condemn the soldier; he moved because he respected the soldier too much to treat him as a mindless instrument. He believed that soldiers are moral agents, capable of bearing weight, rather than just cogs in a machine. He carried the burden of that distinction so that others wouldn't have to trivialize it.

  There is a question I know many of you have asked, perhaps in whispers. He never wrote down what his later view implied about his own service in Vietnam. He died before he could answer that, and before his students could dedicate their volume to him. Some might call that an omission. I call it wisdom.

  He knew that theory is clean, and life is not. He knew that the abstract morality of the classroom meets a wall when it confronts the lived reality of the young man he once was. He chose not to judge that young man with the cold tools of the older philosopher. He held the tension between the two until the end. He was honest enough to change his mind, and humble enough to know that some judgments belong to God, not to ethics.

  To his family: we knew the man who worried about these things so we didn't have to. We knew the uncle who listened more than he spoke, who carried the weight of the world quietly so we could walk a little lighter.

  He spent a lifetime asking how we justify war. In the end, I think he found that we justify it by surviving it, by remembering it, and by refusing to lie about what it costs.

  He sought the hard truth, he honored his comrades, and he loved his family. May he finally find the peace that he spent a lifetime analyzing, but could never quite capture on paper.

  Rest easy, Uncle. The argument is over.
