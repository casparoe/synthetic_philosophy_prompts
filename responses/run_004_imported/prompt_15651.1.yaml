answer: |-
  **SCENE START**

  **INT. GALLERY BACKSTAGE - NIGHT**

  Pitch black. The muffled hum of a crowd confused in the main hall bleeds through the drywall. A single emergency exit sign casts a sickly green glow under the doorframe, but the room itself is void.

  ELIAS (60s, voice like gravel in a blender) leans against a rack of hanging coats. MARA (40s, sharp, pacing the three steps she has available) holds a phone with a dead screen.

  A bottle of wine clinks against a glass.

  MAR A
  You told me it was a masterpiece.

  ELIAS
  I did.

  MARA
  So I believe you. It's a masterpiece. End of story.

  ELIAS
  No, it's not. You believe *me*. You don't believe the painting. There's a distinction.

  MARA
  Semantic hair-splitting. If I believe the expert, I hold the belief. If I believe a physicist who says the atom splits, I know the atom splits. I don't need to hold the neutron in my hand.

  ELIAS
  You're conflating factual verification with aesthetic judgment. That's the category error, Mara. Always has been. If the physicist tells you the bridge is safe, you walk across. You don't need to understand the tensile strength. But if I tell you this painting is sublime, and you take my word for it without looking... you haven't judged the art. You've judged *me*.

  MARA
  And? Isn't criticism just the curation of trust? I trust your eye. You trust the dealer's provenance. We build a chain of custody for quality. Why is art the one place where we pretend we're all Robinson Crusoe on our own island of taste?

  ELIAS
  Because the value isn't in the *conclusion*. It's in the *encounter*. Kant knew it. Hopkins hammered it home. To say "this is beautiful" is to report on a relationship between you and the object. If you outsource the relationship, the report is hollow. It's not just unjustified; it's not even an aesthetic belief. It's a placeholder.

  MARA
  That's dangerously close to saying the belief is false.

  ELIAS
  I'm saying the belief is misattributed.

  MARA
  It's solipsism, Elias. If I can't take your word, then art history is impossible. I can't see the murals in Pompeii the way a Roman did. I can't hear music the way a 19th-century critic did. I am entirely dependent on testimony to contextualize 90% of culture. Are you going to tell me my understanding of Goya is fake because I wasn't there when he mixed the black?

  ELIAS
  Context is facts. Facts are transmissible. "Goya used lead white." "Goya was deaf." That's history. But "Goya is terrifying"? That requires you to feel the terror. If you only feel it because Elias told you to, you're not feeling the terror. You're feeling my authority.

  MARA
  Okay, let's press that. You say I can't form the belief. But let's say I do. Let's say I walk out there when the lights come back on, look at the canvas, and say, "Yes, Elias was right, this is good." Is my statement true or false?

  ELIAS
  It might be true that the painting is good. But *your* warrant for saying it is defective.

  MARA
  Defective how? If the proposition matches reality, where's the error?

  ELIAS
  The error is that you think you've accessed the reality. You haven't. You've accessed my opinion of the reality. In science, the testimony gets you to the fact. In art, the testimony *blocks* the fact. The fact *is* the experience.

  MARA
  That feels romantic, but look at the asymmetry. If an engineer says the bridge is safe, I defer. I don't demand to feel the safety in my bones. I trust the system. Why is deferring on "this bridge is safe" rational, but deferring on "this painting is good" intellectually cowardly?

  ELIAS
  Because the bridge has a function outside of your judgment of it. It gets you across the river. The painting *only* exists in your judgment of it. If you defer on the bridge, you cross. If you defer on the painting... what do you do? You nod? You buy it? You're performing appreciation without the substance.

  MARA
  I'm participating in a discourse! Art isn't a private hallucination. It's a language. If I learn the language from you, I can speak it.

  ELIAS
  You can mimic the sounds. You can't mean the words.

  MARA
  (She stops pacing. The darkness seems to tighten.)
  Here's where you're hiding, Elias. You think that if testimony works, the critic becomes obsolete. If I can just take your word, why do I need to look? But I'm saying the opposite. I take your word *so that* I know where to look. Testimony isn't a replacement for experience; it's the gateway.

  ELIAS
  Then you agree! The testimony isn't the knowledge. It's the invitation. But you started this by saying you *already* believed it was a masterpiece. In the dark.

  MARA
  I believe it's worthy of my attention.

  ELIAS
  That's not the same as "beautiful." That's pragmatic. "This is worth looking at" is a recommendation. "This is beautiful" is a verdict. You can't inherit the verdict.

  MARA
  Why not? Because it doesn't feel the same? Because when I say "I believe you," I don't get the little shiver of pleasure?

  ELIAS
  Exactly! That's the phenomenological proof. Try it. Try to feel delight in a meal I describe to you. You'll get hungry, maybe. But you won't taste.

  MARA
  But I might believe the meal is nutritious. I might believe it's expensive. I might believe it's *good* in the sense of quality. Why is the "shiver" the price of admission? Maybe the shiver is just the biological tax, not the epistemic value.

  ELIAS
  In aesthetics, the shiver *is* the epistemic value. If you aren't moved, you don't know.

  MARA
  So a psychopath who understands composition perfectly but feels nothing... they know nothing?

  ELIAS
  About the beauty? No. They know about the geometry.

  MARA
  (She laughs, a short, dry sound.)
  You've built a fortress that keeps out everyone but the mystics. It's safe, Elias. It protects you from the market, from the hype, from people like me. But it makes criticism useless. If I can't tell you it's good, I can only tell you *that* it is good. I can't convince you.

  ELIAS
  You can't convince me. You can only show me. That's why we have galleries. That's why we have lights.

  (A beat. The crowd noise outside swells, then dips.)

  MARA
  There's a cost to your view, though. You know there is.

  ELIAS
  Enlighten me.

  MARA
  If aesthetic belief requires first-hand acquaintance, then aesthetic disagreement is impossible. If I see it and feel nothing, and you see it and feel everything... we aren't disagreeing about the object. We're just reporting our own vitals. "I like it." "I don't." There's no truth to fight over.

  ELIAS
  There is truth. It's just not provable by argument. It's provable by attention.

  MARA
  Which brings us back to the testimony. If I can't argue you into it, I have to wait for you to look. But what if I've looked? What if I've looked for thirty years, and I'm telling you, based on that looking, that *this* specific thing aligns with the tradition? You're saying my thirty years of looking don't count as evidence for you?

  ELIAS
  Your thirty years count as evidence that *you* are a reliable witness. They don't count as evidence for the *painting*.

  MARA
  That's the weak spot. You admit I'm a reliable witness. You admit I have knowledge. But you say I can't transfer it. That makes knowledge private property. It makes art a commodity of the soul rather than a public good.

  ELIAS
  Better private truth than public delusion.

  MARA
  Or... maybe the "public delusion" is actually just culture. Maybe the fact that we agree it's good *because* we trust each other is what makes it art in the first place. Not the canvas. The trust.

  ELIAS
  Then it's religion.

  MARA
  And art isn't?

  (Silence. The green light under the door flickers.)

  ELIAS
  (Quietly)
  If the lights come on... and you look at it... and you still don't feel it. But you remember my voice in the dark telling you it's a masterpiece. Will you doubt the painting? Or will you doubt me?

  MARA
  I'll doubt the painting.

  ELIAS
  See? You're deferring to the testimony.

  MARA
  No. I'm deferring to the probability that my taste is out of sync with the consensus of experts. I'm calibrating.

  ELIAS
  You're letting me see for you.

  MARA
  I'm letting you help me see. There's a difference.

  (A loud BUZZ. The overhead fluorescents flicker, strobe once, then hum to life. The room is suddenly stark, filled with dust motes and the smell of old wool.)

  Elias blinks, shielding his eyes. Mara doesn't. She looks straight at the door.

  MARA
  Lights are on, Elias.

  ELIAS
  (He straightens his jacket)
  So they are.

  MARA
  Are you going to go out there?

  ELIAS
  Eventually. I need to find my wine.

  MARA
  You know which one is mine. The one you called a masterpiece.

  ELIAS
  (He moves toward the door, hand on the knob.)
  Go look, Mara. Don't ask me. Don't ask the placard. Just look.

  MARA
  And if I tell you what I see?

  ELIAS
  (He opens the door. The noise of the gallery rushes in.)
  Then I'll know you saw it.

  (He steps out. Mara stands alone in the backstage room for a moment, looking at her reflection in the black phone screen. She takes a breath, fixes her collar, and follows him.)

  **SCENE END**
