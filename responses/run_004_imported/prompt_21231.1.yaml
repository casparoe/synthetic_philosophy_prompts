      *   **Point 3: Humphreys' Paradox (The Technical Knockout):** This is crucial. Propensities are causal (time-asymmetric). Probability axioms are time-symmetric (Bayes' theorem). You can't map one onto the other easily. $P(\text{Decay}|\text{State})$ makes sense as propensity. $P(\text{State}|\text{Decay})$ does not, yet the math treats them similarly.
