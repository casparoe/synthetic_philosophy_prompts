answer: |-
  Here are ten questions designed to move the discussion beyond the standard motivational cases for Updateless Decision Theory (UDT). The first four address your specific requirements; the remaining six probe technical, normative, and practical vulnerabilities. Each includes a follow-up keyed to the response a UDT proponent is most likely to offer.

  ### 1. The Specificity of the Predictor (Required)
  **Question:** Standard motivations for UDT rely heavily on cases like Newcomb's Problem or Parfit's Hitchhiker, where a predictor simulates the agent or has access to its source code. In the absence of such a predictor, UDT often collapses into Causal Decision Theory (CDT) or yields counterintuitive results. If the rationality of paying a cost in a branch where it does no causal good depends entirely on the presence of a specific type of logical correlator, isn't UDT less a general theory of rationality and more a specialized strategy for a niche environment? How do you distinguish a "rational commitment" from a heuristic that only works against opponents who can read your mind?

  *   **Likely Answer:** She will likely argue that logical correlation is ubiquitous, not niche; any situation where your output is logically linked to another variable (even via common cause or simulation) invites updateless reasoning.
  *   **Follow-up:** "If logical correlation is ubiquitous, where do you draw the threshold? In a standard medical screening, my genetics correlate with my disease, but I shouldn't avoid the test to 'change' the genetics. What structural feature distinguishes the Newcomb case from the medical case, if not the direction of causality?"

  ### 2. The Source of the Prior (Required)
  **Question:** UDT requires an agent to maximize expected utility relative to a prior fixed before the agent receives any information, including information about its own existence or logical output. But if the agent is a fixed program, how can it be uncertain about its own output without being logically inconsistent? If you appeal to 'logical uncertainty,' doesn't quantifying that uncertainty require a meta-algorithm that effectively updates as it computes, thereby reintroducing the very updating process UDT is meant to bypass?

  *   **Likely Answer:** She will likely invoke "logical induction" or a universal prior over programs, suggesting the agent treats its own code as a black box until it finishes computing.
  *   **Follow-up:** "But logical induction is a temporal process; beliefs shift as computation time increases. If the 'prior' shifts as the agent thinks longer, isn't the agent effectively updating on its own computational state? How is that distinct from standard Bayesian updating on internal evidence?"

  ### 3. Commitment Races (Required)
  **Question:** In game-theoretic settings, UDT seems to reward the agent who commits earliest and most irrevocably. This suggests a 'commitment race' where rational agents are incentivized to delegate decisions to blind algorithms before deliberating on the stakes, simply to signal inflexibility. Doesn't this imply that under UDT, rationality demands a strategic ignorance that prevents agents from coordinating on mutually beneficial outcomes that require nuanced deliberation?

  *   **Likely Answer:** She will likely argue that sophisticated UDT agents can model one another and find bargaining equilibria (Schelling points) that avoid the race to the bottom.
  *   **Follow-up:** "Finding those equilibria usually requires common knowledge of rationality and priors. In a heterogeneous population where agents have different priors or computational limits, doesn't the commitment race re-emerge as the only stable strategy for the faster committer?"

  ### 4. Self-Locating Uncertainty (Required)
  **Question:** Proponents often claim UDT dissolves the Sleeping Beauty controversy by treating the agent as a single policy across all awakenings rather than updating on indexical information. However, if the agent cares about the welfare of each awakening individually, doesn't the updateless policy simply encode the 'thirder' position in the utility function while claiming to be a 'halfer' in credence? Is this dissolution substantive, or just a relabeling of the credence as a weighting factor in the prior?

  *   **Likely Answer:** She will likely argue that 'credence' is the wrong concept entirely; only the expected utility of the global policy matters, rendering the halfer/thirder distinction a verbal dispute.
  *   **Follow-up:** "If we strip away credence, how does the agent handle cases where indexical information *should* change behavior? For example, if only one copy of Sleeping Beauty is offered a bet that affects only her, doesn't ignoring her specific location lead to dominated strategies?"

  ### 5. The "Troll Bridge" Problem
  **Question:** There is a known counterexample called 'Troll Bridge,' where a UDT agent refuses to cross a bridge because it can prove that *if* it were to cross, it would be due to a flaw in its reasoning (a spurious counterfactual), and the troll blows up the bridge upon detecting that flaw. The agent effectively reasons itself into inaction based on a proof about its own consistency. How does UDT avoid paralyzing agents whenever their decision procedure becomes transparent enough to be subject to Löbian uncertainty?

  *   **Likely Answer:** She will likely suggest that this is a problem of specific proof systems and that a better formalization of counterfactuals (e.g., using proof-length bounds) resolves the spurious correlation.
  *   **Follow-up:** "But doesn't imposing bounds on proof length essentially reintroduce a form of updating based on computational resources? If the solution relies on bounded rationality, can UDT still claim to be the normative ideal for *unbounded* rationality?"

  ### 6. Value Loading and Prior Rigidity
  **Question:** Because UDT fixes the prior and utility function at the outset, it seems to lack a mechanism for 'value learning.' If an agent realizes post-creation that its utility function contains a typo or fails to capture a moral nuance, a strict UDT agent cannot update to correct this without violating its own decision rule. Does UDT imply that a rational agent must treat its initial value judgment as infallible, or is there an updateless account of moral learning?

  *   **Likely Answer:** She will likely propose a 'meta-utility' function where the agent maximizes the satisfaction of whatever values it *would* have converged upon had it deliberated longer.
  *   **Follow-up:** "If the agent maximizes what it *would* value after deliberation, isn't it effectively updating on the results of that deliberation? How do you cash out 'would value' without simulating the updated agent, which brings us back to the updating problem?"

  ### 7. Violation of the Dominance Principle
  **Question:** UDT famously violates the Dominance Principle (or Sure-Thing Principle) in cases like Newcomb's Problem, arguing that an agent should choose an option that yields less utility in every specific state of the world, because choosing it influences which state obtains. For many decision theorists, dominance is a constitutive norm of rationality. Are you prepared to say that a rational agent *ought* to accept a dominated strategy, and if so, does this make UDT incompatible with standard economic modeling?

  *   **Likely Answer:** She will likely argue that dominance only applies when states are probabilistically independent of actions, which is false in logical correlation cases.
  *   **Follow-up:** "But if we allow states to depend on actions via logical correlation, doesn't that open the door to 'magical thinking' in standard causal cases? How do you prevent an agent from reasoning that 'if I buy this lottery ticket, the prior probability that I win must have been higher'?"

  ### 8. Computational Tractability
  **Question:** To choose a policy, a UDT agent must search the space of all possible policies and evaluate their consequences across all possible worlds weighted by the prior. This appears computationally intractable, even more so than CDT. If UDT is uncomputable for any realistic agent, in what sense is it a normative guide? Is it merely a Platonic ideal, or do you have a proposal for an approximate UDT that preserves the normative benefits?

  *   **Likely Answer:** She will likely concede it is intractable but argue that normative theories (like Bayesianism) are often idealizations that bounded agents should approximate.
  *   **Follow-up:** "With Bayesianism, we know that approximations converge to the truth. With UDT, if the approximation misses the optimal policy by a small margin, it might miss the logical correlation entirely and revert to CDT. What guarantees that a bounded approximation retains the 'updateless' advantage?"

  ### 9. Evolutionary Stability
  **Question:** If UDT is the superior decision theory, we might expect it to be evolutionarily stable or to emerge in competitive markets. However, CDT agents often outcompete others in environments without predictors, as they avoid the costs of precommitment. If UDT only outperforms in specific 'Newcomb-like' environments, isn't it more accurate to say that decision theory is context-dependent, and that UDT is simply the strategy for a high-surveillance equilibrium?

  *   **Likely Answer:** She will likely argue that as technology advances (AI, surveillance, binding contracts), the world is becoming *more* Newcomb-like, making UDT increasingly relevant.
  *   **Follow-up:** "If the world becomes Newcomb-like due to technology, doesn't that mean the rationality of UDT is contingent on external surveillance capabilities? That suggests UDT isn't about internal rationality, but about adapting to an external threat model."

  ### 10. The "Why Now?" Problem (Time Inconsistency of Adoption)
  **Question:** Suppose I am an agent who has already updated on my existence and my situation. I know I am not at the 'beginning of time' where I could have set a prior. If I switch to UDT now, I am effectively adopting a policy that pretends I haven't updated, which seems like a fiction. Why should an already-updated agent bind itself to a counterfactual past self's preferences, especially if those preferences conflict with my current, informed interests?

  *   **Likely Answer:** She will likely argue that you can still act 'as if' you are updateless by adopting the policy your past self *would* have chosen, as this maximizes utility across the multiverse of similar agents.
  *   **Follow-up:** "But if my current interests diverge from what my past self would have chosen (due to new information), forcing me to follow the past self looks like a form of tyranny by the dead. Why is the 'past self's' perspective normatively privileged over the 'current self's' perspective?"
