answer: |-
  **Setting:** *A quiet seminar room, late evening. Two coffee cups sit on the table between **Lucius** (an Epicurean materialist) and **Thea** (a defender of the deprivation account). They have already dispensed with the basic "no subject" problem (the requirement that a subject must exist to be harmed) and are now digging into the temporal symmetry of non-existence.*

  **Lucius:** Let's grant, for the sake of argument, your intuition that death is a misfortune. I want to press you on *why* you think the time of that misfortune matters. Lucretius's symmetry argument remains the sharpest tool here. He asks us to look at the vast tract of time before we were born. You do not grieve for the centuries you missed before 1990 (or whenever you were born). You feel no deprivation regarding the Renaissance, the Roman Empire, or the Jurassic period. Why? Because that time is gone. But the time after your death is relevantly identical. It is time in which you do not exist. If the past non-existence is neutral, the future non-existence must be neutral. To claim otherwise is a temporal bias without metaphysical grounding.

  **Thea:** I accept that the *state* of non-existence is identical in both directions. Being dead is ontologically the same as not-yet-born. But the *relation* between the subject and those times is not symmetric. This is the standard asymmetry reply, but let's refine it. It is not about the experience of the time; it is about the modal facts concerning *me*.

  Consider the nearest possible world where I exist longer. In that world, I die at ninety instead of forty. I am numerically identical in that world; it is *my* life that is extended. Now consider the nearest possible world where I exist earlier. If I had been born ten years prior, given origin essentialism—the view that I originate from the specific gametes I did—I would not be *me*. I would be a different person.

  Therefore, the future contains time that is genuinely *mine* to lose. The past contains time that was never available to *me* specifically. Death deprives me of a future that I could have had while remaining myself. Pre-natal non-existence does not deprive me of a past I could have had while remaining myself. The asymmetry isn't in the non-existence; it's in the possibilities of existence.

  **Lucius:** That is a elegant metaphysical distinction, Thea. You've grounded the asymmetry in origin essentialism and *de re* modality. But I'm not convinced this vindicates the *badness* of death. It seems to me you have merely relocated the puzzle from metaphysics to psychology.

  You've shown why I *care* more about the future than the past. I can conceive of myself living longer; I cannot conceive of myself being born earlier. But does this modal fact generate harm? You are arguing that death is bad because it closes off a possible world where *I* continue. But for that closure to be a harm *to me*, there must be a "me" to whom the loss is attributed.

  If I accept your modal asymmetry, I grant that the future is "mine" in a way the past is not. But once I am dead, I am not there to possess that future, any more than I was there to possess the past. You've explained why the *direction* of the loss feels different, but you haven't explained how the loss *obtains*. If the subject is extinguished, what difference does it make whether the extinguished candle *could* have burned longer versus *could not* have burned earlier? In both cases, the light is out. By relying on modal facts about identity, aren't you presupposing a subject that persists across possible worlds to suffer the deprivation, even when that subject doesn't exist in the actual world?

  **Thea:** You're circling back toward the "no subject" objection, but I think you're missing the force of the comparative account. Harm doesn't require a subject to *feel* the loss at the time of the loss. It requires a subject who exists at some time, such that their total life welfare is less than it would have been in the relevant alternative.

  When I say death is bad, I am making a comparative claim between the actual world (where I die at forty) and the nearest possible world (where I die at ninety). The asymmetry you challenged validates *which* possible world is the relevant comparator. Because I *could* have lived longer (retaining identity), the world where I live longer is the correct baseline for comparison. Because I *could not* have been born earlier (retaining identity), the world where I am born earlier is *not* a relevant baseline for my welfare.

  So, I haven't presupposed a persisting subject in the void. I've identified a subject who exists *now*, and whose life trajectory is truncated. The harm is located in the actual life that is cut short, not in the experience of being dead. The modal asymmetry ensures that the "cutting short" is a genuine loss of *my* goods, whereas being "born late" is not a loss of *my* goods.

  **Lucius:** But this relies on a specific theory of time and modality that is far from settled, and it risks making the badness of death arbitrary. Let's press the modal claim. You rely on origin essentialism to block the past asymmetry. But many metaphysicians reject origin essentialism. If it is possible that I could have been conceived a week earlier from the same matter, then your asymmetry collapses. The past becomes "mine" to lose as well.

  But let's grant you origin essentialism. Even then, you are claiming that the *possibility* of continuation grounds the harm. But consider this: If the badness of death depends on the fact that I *could have* continued, then the badness of death is contingent on biological facts about gametes and identity conditions.

  Imagine a being, perhaps a digital consciousness or a fission-capable entity, for whom origin essentialism does not hold. For them, past and future non-existence might be symmetric. Would death be less bad for them? Or is it that your account doesn't capture the *badness* at all, but rather captures our *narrative bias*? We view ourselves as projectiles launched from birth toward death. We care about the trajectory ahead. But if the universe is eternalist—if past, present, and future exist equally—then my death is just a boundary.

  My push is this: Your asymmetry explains why we *fear* death more than we regret late birth. It does not prove that death is *objectively worse*. You have shown that the future is modally open to me in a way the past is not. But if I do not exist to traverse that open modal space, the "openness" is a feature of the world, not a misfortune for me. You have relocated the puzzle from "How can non-existence harm?" to "How can modal facts about non-existents constitute harm?" And I submit the answer is: they cannot. They constitute a tragedy for the living who mourn us, but not a harm for the dead.

  **Thea:** That is a formidable challenge, Lucius. You are asking whether modal facts can ground intrinsic badness without a conscious subject to instantiate the comparison. But consider the analogy of betrayal. If a friend betrays me after I die, I never experience it. Yet, many argue I am harmed by it. Why? Because it violates the relationship I *did* have. The harm attaches to the life I lived, which is rendered less valuable by the subsequent event.

  Similarly, death deprives the life I *did* live of the value it *would have* contained. The modal fact isn't haunting a ghost; it's evaluating a biography. The asymmetry matters because it tells us which biography is the true counterfactual. If I say, "It is a tragedy Shakespeare died at 52," I am comparing his actual biography to the one where he wrote more plays. I am not comparing it to a biography where he was born in 1500.

  If you reject this, you must accept that death is never bad, or that it is only bad symmetrically. If it is only bad symmetrically, then you must admit that our late birth is equally a misfortune. But you don't believe that. You feel no regret for not being born earlier. So, you implicitly accept the asymmetry. The only question is whether that asymmetry grounds *harm* or merely *preference*. I argue that because our lives are projects extended through time, the truncation of a project is an objective failure of that project's potential, regardless of whether the project-holder is present to witness the truncation. The "openness" of the future is where the value of life resides. To close it prematurely is to destroy value.

  **Lucius:** I concede that I feel no regret for my pre-natal non-existence. But I deny that my psychological indifference proves metaphysical neutrality. It may simply prove that I am wired to look forward.

  However, your project analogy is revealing. You say death destroys value. But value for whom? If the project is the life, and the life is over, the "destruction" is complete. There is no remainder to be harmed. The betrayal analogy fails because in betrayal, the *relationship* is the object of harm, and relationships are abstract entities that can be tarnished posthumously. But death is the end of the relata.

  Here is my final push on your relocation of the puzzle. You claim the asymmetry validates the *comparative baseline*. But by doing so, you make the badness of death dependent on the *contingency* of identity conditions. If I am a human, death is bad (because of origin essentialism). If I am a replicating nanite swarm, death might not be bad (because identity persists through fission or earlier instantiation).

  This implies that the badness of death is not about the loss of *goods* (pleasure, knowledge, love), but about the *metaphysical structure of the subject*. That seems counterintuitive. If two beings lose the exact same amount of future happiness, but one has "open" past modalities and the other does not, are their deaths differently bad?

  If you say yes, you privilege metaphysics over welfare. If you say no, then the asymmetry is irrelevant to the *badness*, and only relevant to the *identity* of the victim. And if it's only about identity, we are back to square one: if the victim doesn't exist, the identity conditions don't matter. You have successfully explained why the future is *mine*, Lucius. But you have not explained how *I* can be harmed by losing *my* future when *I* am not there to lose it. You have built a beautiful bridge to an island that no longer exists.

  **Thea:** Then we are at the impasse of the "Timeless Harm" problem. I maintain that the bridge doesn't need to lead to an existing island; it needs to connect two points on the map of reality: the actual world and the possible world. The harm is the distance between them. You insist the map is useless if the traveler is gone. I insist the traveler's route is what matters, not their presence at the destination. But I grant you this: if the subject is wholly annihilated, the "harm" must be understood as a property of the life narrative, not a state of the subject.

  **Lucius:** And I grant you this: the asymmetry is real, and it explains our terror. But terror is not truth. We fear the void because it is ahead of us, not because it is objectively worse than the void behind us. You have vindicated the *fear* of death, Thea, but I remain unconvinced you have vindicated the *badness* of it.

  **Thea:** Then I have done enough. For a mortal, the vindication of the fear is the vindication of the value. If death were not bad, we would not fear it. The asymmetry explains why we fear the end, not the beginning. That is sufficient to ground the ethics of mortality, even if the metaphysics remains... porous.

  **Lucius:** *Smiles.* A pragmatic surrender. Acceptable. But the void remains symmetric, my friend.

  **Thea:** Perhaps. But only one side of it keeps us awake at night. And that, ultimately, is where philosophy must begin.
