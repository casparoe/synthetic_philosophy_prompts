answer: |-
  It is a pleasure to address a colleague who understands the stakes of correlation and causality as intimately as you do. Your intuition is sharp: the structure of the screening-off objection in Bell tests and the "tickle defense" in medical Newcomb problems is indeed formally similar to the objection you are raising against superrationality. In all three cases, we are asked to believe that two separated outcomes remain correlated even after we have conditioned on all the shared background factors that ostensibly link them.

  However, I aim to persuade you that the analogy breaks down at a critical juncture. The screening-off objection succeeds in the Bell and medical cases because those involve **causal correlations between distinct physical events**. It fails against superrationality because superrationality relies on **logical correlations between instances of the same computation**.

  To show this, I need to argue that Reichenbach's Principle of the Common Cause—which serves as your wedge—applies to causal networks, but not to logical identities. Here is the case for why the correlation between superrational twins cannot be dissolved by conditioning on their shared circumstances.

  ### 1. The Nature of the "Common Cause"

  In your Bell test work, you dealt with hidden variables ($\lambda$) that were presumed to carry the physical state of the particles from the source to the detectors. If Local Realism holds, $\lambda$ screens off the measurement outcomes $A$ and $B$. That is, $P(A, B | \lambda) = P(A | \lambda) P(B | \lambda)$. Once you know $\lambda$, knowing $A$ tells you nothing new about $B$.

  In the medical Newcomb case (the Smoking Lesion), there is a gene ($G$) that causes both a tendency to smoke ($S$) and cancer ($C$). The "tickle defense" argues that if the agent conditions on their internal urge or disposition ($U$) to smoke, this screens off the act from the gene. $P(C | S, U, G) = P(C | U, G)$. The act of smoking is merely a downstream symptom of the gene's influence on the urge.

  In both these cases, the "common cause" is a **physical antecedent** that exerts a causal influence on distinct downstream events. The correlation is mediated by a physical chain of events.

  Now, consider the superrational twins. You describe their shared situation (payoff matrix, knowledge of rationality, etc.) as the common cause. But in superrationality, this shared situation does not merely *cause* the decisions; it **defines** the decision procedure itself.

  When Hofstadter argues for superrationality, he is not claiming that my decision *causes* my twin's decision via some spooky channel. He is claiming that my decision and my twin's decision are **logically identical outputs of the same algorithm**.

  ### 2. Logical Identity vs. Causal Dependence

  Imagine two calculators, manufactured in the same factory, with the same circuitry, sitting in different rooms. Both are fed the input "2 + 2". Both display "4".

  *   **Causal View:** The factory settings and the input are the common cause ($\lambda$). Once I condition on "Factory Settings + Input," are the outputs independent?
  *   **Logical View:** The output "4" is a mathematical truth necessitated by the operation.

  If you treat the calculators as physical objects subject to random noise (thermal fluctuations, cosmic rays), then yes, a complete physical description of each calculator ($\lambda_1$ and $\lambda_2$) would screen off the outputs. If Calculator 1 has a stuck transistor, it might output "5" while Calculator 2 outputs "4".

  But superrationality assumes **ideal rationality**. It assumes the agents are not noisy physical systems but perfect instantiations of a decision algorithm. If Agent 1 runs Algorithm $X$ on Input $I$, and Agent 2 runs Algorithm $X$ on Input $I$, then Output 1 **is** Output 2. They are not two events correlated by a past cause; they are two physical instantiations of the same logical fact.

  Reichenbach's screening-off principle applies to probabilistic dependencies arising from causal history. It does not apply to logical necessities. Conditioning on the "shared situation" (the fact that we are both running Algorithm $X$ on Input $I$) does not render the outputs independent; it **entails** their correlation.

  In Bell tests, $\lambda$ fixes the *propensities* or *values*, but the measurement events are distinct. In superrationality, the "decision" is the computation. You cannot screen off the correlation between $2+2=4$ here and $2+2=4$ there by conditioning on "we are both doing arithmetic." The arithmetic *is* the link.

  ### 3. Why the Tickle Defense Fails Here

  You noted that the tickle defense works in medical Newcomb cases because a rational deliberator "feels the pull of her antecedent disposition before she acts." Conditioning on this introspected disposition ($U$) screens off the act ($S$) from the gene ($G$).

  Why does this not apply to the superrational twins? Why can't I condition on my "disposition to cooperate" and thereby screen off my twin's action?

  The difference lies in the **source of the correlation**.
  *   **Medical Case:** The correlation between Smoking and Cancer is due to a **common cause** (the Gene). The act of Smoking is a *symptom*. Symptoms can be decoupled from their causes (I can resist the urge). Therefore, conditioning on the Urge screens off the Act.
  *   **Superrational Case:** The correlation between My Choice and Twin's Choice is due to **logical identity**. My choice is not a symptom of our shared rationality; it is the *execution* of it.

  In the medical case, there is a gap between the disposition and the act (weakness of will is possible). In the superrational case, there is no gap between the reasoning and the decision. If I am truly superrational, I cannot "choose" differently than the algorithm dictates. To imagine me cooperating while my twin defects is not to imagine a unlikely physical outcome (like a cosmic ray flipping a bit); it is to imagine a logical contradiction (that $X(I) = \text{Cooperate}$ and $X(I) = \text{Defect}$ simultaneously).

  Therefore, there is no "tickle" or intermediate disposition variable that screens off the correlation. The only variable that screens off the correlation is the output of the computation itself. But I cannot condition on the output before I produce it, because producing it *is* the act of deliberation.

  ### 4. The Category Error in the Screening-Off Objection

  Your objection rests on treating the agents' decisions as distinct random variables $A$ and $B$ in a causal graph, linked by a common cause $C$ (the shared setup). You argue that $P(A, B | C)$ should factorize into $P(A | C) P(B | C)$.

  This factorization assumes that once $C$ is fixed, there remains independent "freedom" or "noise" in $A$ and $B$.
  *   In **Bell tests**, this freedom is the assumption of locality/no-conspiracy.
  *   In **Medical Newcomb**, this freedom is the ability to act against one's disposition.

  In **Superrationality**, this assumption is false. The "shared setup" $C$ includes the constraint that $A$ and $B$ are generated by the same function $f$.
  $$A = f(C)$$
  $$B = f(C)$$
  Therefore, $A = B$.

  If $A = B$, then $P(A, B | C) \neq P(A | C) P(B | C)$ (unless probabilities are 0 or 1). The variables are perfectly correlated *by definition*, not by contingent causal history. Conditioning on $C$ does not screen off the correlation because $C$ *is* the logical constraint that enforces the identity.

  To apply Reichenbach's principle here is to commit a category error. Reichenbach's principle governs **contingent** correlations in the physical world. Superrationality relies on **necessary** correlations in the logical space of decision procedures.

  ### 5. A Physicist's Intuition: The Map and the Territory

  Think of the decision algorithm as a physical law, like Conservation of Energy.
  If I measure energy $E_1$ in system 1 and $E_2$ in system 2, and I know they are isolated parts of a closed system, I know $E_1 + E_2 = \text{constant}$.
  Does knowing $E_1$ give me information about $E_2$? Yes.
  Can I screen this off by conditioning on "The systems are part of a closed loop"? No. That condition *creates* the correlation; it doesn't dissolve it.

  In the Bell case, we are looking for a hidden variable that *explains* the correlation without action-at-a-distance.
  In the Superrational case, we are not looking for an explanation of the correlation; we are acknowledging that the correlation is **built into the description of the agents**.

  When you condition on the "shared situation" in the superrational case, you are not conditioning on a past causal event (like the particle source or the gene). You are conditioning on a **logical constraint**. Logical constraints do not screen off; they bind.

  ### Conclusion

  Your skepticism is well-founded if one views the agents as distinct physical systems linked only by past causal interactions (the standard Causal Decision Theory view). In that view, superrationality *is* magic, akin to violating Bell inequalities with local hidden variables.

  But superrationality asks you to view the agents as **instantiations of the same abstract computation**.
  *   In Bell tests, screening off works because the outcomes are distinct physical events.
  *   In Medical Newcomb, screening off works because the act is a distinct physical event from the gene.
  *   In Superrationality, screening off fails because the "choice" is not a distinct physical event caused by the setup; it is the **logical consequence** of the setup.

  The "tickle" in the medical case is an intermediate causal state that breaks the evidential link between act and gene. There is no analogous intermediate state in superrationality that breaks the logical link between twin and twin, because the link is not causal—it is identity. To condition on the shared setup is to acknowledge the identity, not to screen it off. Thus, cooperating *is* rational, not because it causes the twin to cooperate, but because it is the only move consistent with the logical fact that you and your twin are running the same code.
