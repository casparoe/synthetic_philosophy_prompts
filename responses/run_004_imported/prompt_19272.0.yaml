  *Refinement:* Suggest shifting from "Pattern of Misconduct" to "Pattern of Integrity Failures" or similar, unless there is evidence of intent. Or, attribute the "misconduct" label to the sleuths.

  *Wait, one more thing:* The user mentioned the university is *still reviewing*. This is crucial. Declaring "misconduct" before the institution finishes might be premature. I need to highlight the risk of pre-judging.

  *Final Plan:*
  1. Validate the philosophical stickiness.
  2. Argue that "pattern" isn't arbitrary if based on probability/norms.
  3. Distinguish between "Misconduct" (Intent) and "Negligence" (Oversight).
  4. Offer specific linguistic workarounds.
  5. Emphasize the "Response" as evidence.
  6. Conclude on the "Preponderance of Evidence" standard.

