prompt: |-
  So I got into a pretty long arguement with my roommate (also one of my closest friends) last night and I still can't tell if I was in the wrong, so I need an outside take. Backstory: Dana leaves dishes piled in the sink for like 4-5 days at a stretch, it's been going on for months, and I finally brought it up last night, calmly I thought. She got defensive and pulled up this one time back in March where I left my own dishes for almost a week during finals, and said that since I've "literally done the exact same thing," I have zero room to be annoyed at her or ask her to change anything.

  Except - my finals week thing was a one-off, I apologized for it without her even having to say anything, and I've kept on top of it since. Hers is just the default state of how she lives, and it annoys me alot, not just the mess itself but the principle of it. Here's the part that's actually bugging me: every other time I've brought this up before (not even accusingly, more like "let's figure out a system"), she's said it's not that deep and that I'm being uptight - like she doesn't even think leaving dishes for days is genuinely a problem. But last night, suddenly, "you left dishes once" got treated as a real violation, serious enough to disqualify me from ever raising it again. Something about that felt off in the moment but I couldn't articulate what. I vented to another friend about it after and she immediately took my side, though she also uses the "well you do X too" move on people constantly, so I don't fully trust her read either.

  I've been going back and forth on it all day: is Dana just correct that I did the same thing, so I don't get to complain? Or is there something that actually makes the two cases different, even though "left dishes for days" sounds identical either way? What I'm really asking is: what would actually have to be true for a "you did it too" comeback to legitimately take someone off the hook, versus it just being a deflection that sounds convincing in the moment? Please don't just tell me "communication is key," I'd love an actual breakdown of the logic here.
