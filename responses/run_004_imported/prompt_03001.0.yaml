answer: |-
  You are right to feel that something was "off." Your intuition picked up on a logical inconsistency that your brain couldn't immediately articulate in the heat of the moment.

  You asked for a breakdown of the logic regarding when a "you did it too" argument (formally known as the *Tu Quoque* fallacy) is valid versus when it is a deflection. Here is the actual framework for that.

  ### 1. The Core Logic: Hypocrisy vs. Impact
  In logic and ethics, the validity of a complaint usually rests on **impact**, not the **moral purity of the complainer**.

  *   **Invalid Use (Deflection):** "You speed, so you can't complain that I'm speeding."
      *   *Why it fails:* Your speeding doesn't change the fact that their speeding is dangerous. Two wrongs don't make a right.
  *   **Valid Use (Credibility/Agreement):** "We signed a pact that neither of us would speed, and you were speeding yesterday."
      *   *Why it works:* Here, the complaint isn't about the danger of speeding; it's about the violation of a specific mutual agreement.

  For Dana's "you did it too" argument to legitimately take you off the hook, **one of the following three conditions would have to be true:**

  #### Condition A: The "Mutual Pact" Violation
  Did you two explicitly agree that *under no circumstances* should dishes sit for more than 24 hours, and that if *either* of you broke this, the other loses the right to enforce it?
  *   **Reality:** No. You are negotiating a living standard, not enforcing a signed treaty. In shared living spaces, the standard is usually "reasonable cleanliness," not "perfect adherence."
  *   **Verdict:** This condition is not met.

  #### Condition B: Equivalent Context and Frequency
  For the comparison to hold weight, the behaviors must be functionally equivalent in **frequency, intent, and resolution.**
  *   **Frequency:** You did it once in several months (anomaly). She does it every 4-5 days consistently (pattern).
  *   **Resolution:** You apologized and corrected the behavior immediately. She dismisses the behavior as "not that deep" and continues it.
  *   **Verdict:** This condition is not met. Comparing a one-time exception during high stress (finals) to a habitual lifestyle choice is a **False Equivalence**.

  #### Condition C: The Complaint is About Moral Superiority
  If your argument had been, "I am a better person than you because I do dishes," then her pointing out your hypocrisy would be valid. It would prove you aren't morally superior.
  *   **Reality:** Your argument was, "This behavior negatively impacts our shared space."
  *   **Verdict:** This condition is not met. You are complaining about the *mess*, not claiming sainthood.

  ### 2. The "Moving Goalposts" Inconsistency
  This is the specific thing that felt "off" to you, and logically, it is the strongest evidence that her argument was a deflection.

  Dana is utilizing two contradictory frameworks simultaneously to avoid accountability. This is often called **Motte-and-Bailey** or simply inconsistent reasoning.

  1.  **Framework A (When you bring it up normally):** "It's not that deep."
      *   *Implication:* Leaving dishes is a minor, negligible action that doesn't warrant a discussion.
  2.  **Framework B (When she needs to win the argument):** "You left dishes once!"
      *   *Implication:* Leaving dishes is a severe moral violation serious enough to permanently silence your right to complain.

  **The Logical Flaw:** She cannot claim the act is *too trivial to fix* (Framework A) while simultaneously claiming it is *serious enough to disqualify you* (Framework B).
  *   If it's "not that deep," then your one time doing it shouldn't matter.
  *   If it *does* matter enough to silence you, then it is "that deep," and she needs to fix it.

  By switching between these two frameworks, she ensures she can never lose. That is not a good-faith argument; it is a defense mechanism.

  ### 3. Why Your Friend's Advice Was Flawed
  Your other friend told you that you were right, but she uses the "you do X too" move constantly. This suggests she views relationships as **scorekeeping** rather than **problem-solving**.

  In a scorekeeping model, if I have 5 points of mess and you have 1 point of mess, I can't yell at you.
  In a problem-solving model, we both want the mess to be 0. The fact that I had 1 point last month is irrelevant to the fact that you have 5 points now.

  ### 4. Conclusion: Were You Wrong?
  **No.** You were not wrong to bring it up, and her logical counter-move was invalid.

  *   **You:** Anomaly + Ownership + Correction = **Resolved Incident.**
  *   **Dana:** Pattern + Defensiveness + No Change = **Ongoing Issue.**

  The "you did it too" comeback only legitimately takes someone off the hook if the behavior is **ongoing and unacknowledged on both sides.** Since you acknowledged and fixed your behavior, you regained your standing to discuss the household standard. She is using your past mistake as a "Get Out of Jail Free" card for her current habit.

  ### How to handle the logic next time
  Since you asked to avoid generic "communication" advice, here is how to dismantle the logic if it comes up again, without getting emotional:

  **Don't defend your past action.** (You already apologized for that).
  **Do address the inconsistency.**

  > "Dana, I need to point out a contradiction. When I've brought this up before, you've said leaving dishes isn't a big deal. But now you're saying it's a serious enough violation that my doing it once means I can never mention it again. It can't be both. If it's not a big deal, then my doing it once shouldn't matter. If it is a big deal, then we need to fix it for both of us. I'm trying to solve the problem of the dishes, not win a point about who is perfect."

  This forces her to pick a lane. If she picks "it's not a big deal," she loses the ammunition to silence you. If she picks "it is a big deal," she has to admit her current habit is the problem.

  Trust your gut. The "off" feeling was your brain recognizing that the rules of the argument were changing mid-game to ensure you couldn't win.
