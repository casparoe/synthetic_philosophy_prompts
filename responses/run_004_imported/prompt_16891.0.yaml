answer: |-
  A grad student knocks on Galen Strawson's door during office hours.

  "Professor," the student says, "I know my paper is late, but I'm taking moral responsibility. I'm actively working to change my character so I'm no longer a procrastinator."

  Strawson looks up over his glasses. "But you're only working to change your character *because of the way you already are*. You aren't responsible for that motivation."

  "Fine," the student says, frustrated. "Then I'll exert my will to change the part of me that formed that motivation!"

  "Ah," Strawson smiles. "But that exertion is also a product of the way you *were* before that. To be truly responsible, you need to complete the chain of self-creation."

  "Okay," says the student. "How many steps back do I need to go?"

  "Oh, just the infinite ones," Strawson replies, stamping the paper 'Incomplete'. "I'd grant you an extension, but my office hours don't go back far enough to cover the *causa sui*."
