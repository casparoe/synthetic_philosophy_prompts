answer: |-
  **Setting:** *A quiet corner of a living room, late at night. The coffee is cold. Elena (Internalist) and Marcus (Externalist) are exhausted but unwilling to stop.*

  **Marcus:** Let's go back to David. You're telling me that if David doesn't currently care about his own mental health, and he doesn't care about his future, he has *no reason* to leave that woman? Even though she's systematically destroying him?

  **Elena:** I'm saying he has no *internal* reason. And since I don't know what an "external" reason could possibly mean in practice, I'm saying he has no reason. Look, Williams's point is simple. For a reason to be *David's*, there has to be a sound deliberative route from his subjective motivational set—his SMS—to the action. If his SMS contains only a desire for her approval and a fear of being alone, and no desire for well-being, then "you ought to leave" is just noise. It's not a reason *for him*.

  **Marcus:** But that renders the concept of rationality toothless. If reasons are just slaves to whatever passions happen to be in the SMS, then David isn't being irrational. He's being perfectly rational! He's efficiently satisfying his desire for approval. By your lights, we can't say he's making a mistake of reason. We can only say he has different goals than we do.

  **Elena:** We can say he's making a mistake, just not a rational one. We can say his desires are ugly, or self-destructive, or vicious. But calling it "irrational" suggests he's violated a rule of reasoning. He hasn't. He's reasoning perfectly well from bad premises. If I want to be healthy, I have a reason to exercise. If I don't want to be healthy, I don't. Why is that controversial?

  **Marcus:** Because it confuses *explaining* an action with *justifying* it. You're giving us a psychology of motivation, not a normativity of reasons. When we tell David he has a reason to leave, we aren't predicting he will leave. We're saying he *ought* to, regardless of his current set. His well-being is a value that makes a claim on him. If he ignores it, he isn't just "differently motivated"; he's failing to recognize a demand inherent in his own agency.

  **Elena:** "Inherent in his agency." That's the metaphysical magic trick I'm trying to avoid. What does that claim *look like*? How does it land? If David hears you say, "You have a reason to leave," and he says, "I don't care, I love her," what is your next move? If you can't point to something he cares about—say, his desire to not be depressed—and show him that leaving serves that, you have no leverage. You're just shouting "Ought!" at a wall.

  **Marcus:** The leverage isn't the point; the truth is. Think about Williams's own gin and petrol case. A man wants a gin and tonic. He reaches for a glass he believes contains gin. It actually contains petrol. Williams says he has no reason to drink it. Why?

  **Elena:** Because if he knew it was petrol, he wouldn't want to drink it. The reason vanishes when the facts are corrected. It's dependent on his actual desire for gin.

  **Marcus:** Exactly. But now apply that to David. David believes staying makes him happy. He is wrong about the facts of his life—he is miserable. But suppose we correct the facts. Suppose we say, "David, look, you are miserable. Staying will make you more miserable." If he says, "I know, and I don't care," Williams says the reason evaporates. But I say David is now in the same position as the man drinking petrol. He is making a mistake about what is good for a human being.

  **Elena:** No, that's a category error. The petrol drinker is making a factual error about the substance. David is making a evaluative judgment about his life. If he knows he'll be miserable and chooses it for her sake, that's a sacrifice, not a mistake. To say he's "wrong" implies there's a standard of value outside his SMS that he's failing to track. I'm asking you: what is that standard made of?

  **Marcus:** It's made of the requirements of practical reason itself. Korsgaard would say that to act at all is to constitute yourself as an agent. You have to value your own humanity as an end. If David treats himself as a mere means to his girlfriend's whims, he's violating the constitutive standards of agency. He's not just "unlucky" in his desires; he's falling apart as an agent. That's why we call it irrational. It's a functional failure.

  **Elena:** But that's just a fancy way of saying "we wish he valued his agency more." If David is content to be a fragment, if his SMS is coherent even if it's self-destructive, where is the contradiction? The petrol case works because nobody wants petrol. But people *do* want self-destruction. They do it all the time. If you tell a martyr he has a "reason" to save himself, and he laughs at you, do you say he's blind to reason? Or do you admit he just values something else more?

  **Marcus:** I say he's blind to reason. Because if reasons were entirely internal, persuasion would be impossible unless we found a hook in their existing set. But we do argue people into new values. We don't just find dormant desires; we change their minds about what matters. When I convince David that he matters, I'm not uncovering a hidden desire. I'm getting him to see a truth he was ignoring. The reason was there all along; he just couldn't see it.

  **Elena:** But how did it get there? If he couldn't see it, and couldn't be argued into it without a shift in his fundamental cares, then prior to that shift, the reason didn't exist for him. You're conflating the *result* of successful deliberation with the *precondition* of it. Williams allows for the SMS to change! But it has to change via a sound deliberative route from where he is *now*. If there's no route, there's no reason. To say otherwise is to say he has a reason that could never motivate him, even in ideal conditions. And that is, to use Williams's phrase, "mysterious."

  **Marcus:** It's only mysterious if you think motivation is the test of a reason. I think recognition of value is the test. A reason is a consideration that counts in favor of an action. David's suffering counts in favor of leaving. That fact is true independent of his recognition. If he doesn't recognize it, he is irrational, not reason-less. Your view protects us from metaphysical mystery, Elena, but at the cost of making normativity impossible. It turns ethics into sociology.

  **Elena:** And your view saves normativity by making it magical. You want to tell David he has a reason he can't feel, can't use, and can't be argued into unless he first changes who he is. That's not a reason; that's a judgment disguised as a fact. I'd rather be honest. I'd rather say, "David, I can't give you a reason to leave unless you give me something to work with. Do you care about anything that this relationship is killing?" If he says "No," I have to shut up. You, however, get to keep talking, but you're not talking to *him* anymore. You're talking to the universe.

  **Marcus:** I'm talking to the agent in him that he's ignoring. And if I stop talking because his current desires say so, I'm complicit in his destruction. Internalism might be psychologically clean, but it's morally paralyzing. It means the most damaged people, the ones whose SMS is warped by abuse or depression, are the ones who have the *least* reason to escape their damage. Because their desire to escape is the first thing that got crushed.

  **Elena:** No, it means we have to work harder to find the route. We have to find the tiny desire for peace, or pride, or even anger, and widen it. That's real help. Telling him he "already has a reason" he can't access is just patronizing. It pretends the gap between you isn't there.

  **Marcus:** And pretending the gap is unbridgeable ensures it never gets bridged. If I tell him, "You have a reason, even if you don't feel it," I'm inviting him to trust my judgment until he can see the value for himself. I'm holding the space for his rationality until he can occupy it again. Your view tells him his current broken state is the final arbiter of truth.

  **Elena:** My view tells him his current state is the only place we can start.

  **Marcus:** And if there's nowhere to start?

  **Elena:** Then there's no reason.

  **Marcus:** Then he's beyond reason.

  **Elena:** No. Then he's just a man making a choice we hate.

  **Marcus:** A choice he has no justification for making.

  **Elena:** Justification is for audiences, Marcus. Reasons are for agents. He's the agent.

  **Marcus:** And reason is what makes him an agent in the first place. Not his desires.

  *(Silence stretches between them. Neither looks away, but neither has a new move.)*

  **Elena:** We're not going to agree on this.

  **Marcus:** No. But David still has to decide tomorrow.

  **Elena:** He does. And he'll do what he has a reason to do.

  **Marcus:** Or what he ought to do.

  **Elena:** Same thing.

  **Marcus:** It isn't.

  *(Elena picks up her cold coffee. Marcus looks out the window. The argument hangs in the air, unresolved.)*
