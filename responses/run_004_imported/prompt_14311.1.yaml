answer: |-
  You have hit on a profound and widely debated issue in formal epistemology. Your intuition is mathematically sound: structurally, Jim Joyce's accuracy-dominance argument and the traditional Dutch Book Argument (DBA) are isomorphic. Both rely on convexity properties (essentially the separating hyperplane theorem) to demonstrate that an incoherent point in a vector space is strictly dominated by a coherent point, regardless of which state of the world obtains.

  However, the claim that Joyce's argument is "nonpragmatic" rests not on the **mathematical structure** of the proof, but on the **normative interpretation** of the "currency" being lost and the **metaphysical status** of the agent's state.

  Here is the substantive breakdown of why the literature distinguishes the two, along with the skeptical counter-arguments that validate your suspicion.

  ### 1. The Nature of the "Loss": Extrinsic vs. Intrinsic
  The primary distinction lies in what is being minimized.

  *   **Dutch Book (Pragmatic):** The "loss" is monetary (or utility-based). The argument shows that incoherent credences lead to decisions that frustrate the agent's *preferences*. The normativity is prudential: "If you want to maximize utility, don't be incoherent." This is extrinsic to belief; you can have a belief without having money or desires.
  *   **Joyce (Epistemic):** The "loss" is inaccuracy (distance from the truth). The argument shows that incoherent credences are objectively less accurate representations of the world than coherent ones. The normativity is veritistic: "If you want your beliefs to represent the world accurately, don't be incoherent."

  **Why this matters:** Proponents of EUT argue that the *constitutive aim* of belief is truth. Therefore, a norm derived directly from accuracy is internal to the practice of believing. A norm derived from betting behavior is external; it links belief to action and desire. By switching the currency from money to accuracy, Joyce attempts to ground probabilism in the specific goal of the doxastic state itself, rather than the practical consequences of holding that state.

  ### 2. Operationalism vs. Mentalism
  This is perhaps the sharpest philosophical divergence.

  *   **Dutch Book:** Historically, the DBA relies on **Operationalism**. To make the argument work, one must define credences *as* betting dispositions (or link them via a bridge principle like "You accept bets at odds corresponding to your credence"). If an agent refuses to bet, or if their betting behavior doesn't perfectly mirror their credences, the Dutch Book loses its grip. It makes probabilism a norm of *decision theory*, not purely *epistemology*.
  *   **Joyce:** EUT treats credences as **mental states** that can be evaluated for accuracy independently of action. Joyce's argument applies to an agent sitting in a vat, never making a bet, never acting. The incoherence is a flaw in the *representation*, not a flaw in the *interaction*.

  **The Substantive Difference:** The DBA vindicates probabilism as a norm of *rational action* given beliefs. Joyce vindicates probabilism as a norm of *rational belief* simpliciter. For many epistemologists, conflating the rationality of belief with the rationality of action is a category mistake. Joyce's argument is entitled to the "nonpragmatic" label because it severs the link to action entirely.

  ### 3. The "Dominance" Interpretation
  While both arguments use dominance, the *type* of dominance differs in a way that matters for normativity.

  *   **DBA (Weak Dominance in Utility):** A Dutch Book usually shows a set of bets that guarantees a loss. However, this relies on the agent *taking* the bets. If the agent suspects a bookie is present, they might refuse the bets, escaping the loss. The "guaranteed loss" is conditional on the agent acting on their credences in a specific market environment.
  *   **Joyce (Strong Dominance in Accuracy):** The accuracy dominance is unconditional. If your credences are incoherent, there *exists* a coherent set of credences that is more accurate than yours in **every** possible world. You cannot "refuse" the world. The inaccuracy is a property of the relation between your mind and reality, not your mind and a bookie.

  ### 4. The Skeptical Counter-Argument (Validating Your Intuition)
  Despite the distinctions above, your suspicion that this is "the same move in different clothing" is shared by several prominent philosophers (e.g., David Christensen, Brad Armendt, and to some extent, Alan Hájek).

  **The "Pragmatic Contamination" Critique:**
  Critics argue that EUT smuggles pragmatic norms back in through the choice of the **scoring rule**.
  1.  **Why the Brier Score?** Joyce assumes we should measure accuracy using a strictly proper scoring rule (like the Brier score). But why *that* rule?
  2.  **Instrumental Justification:** The justification for using proper scoring rules often rests on the fact that they incentivize honest reporting or minimize expected loss in decision contexts. If the justification for the scoring rule is pragmatic, then the resulting argument is pragmatic, regardless of the "accuracy" labeling.
  3.  **The "Epistemic Utility" Function:** Defining an "epistemic utility function" looks suspiciously like defining a pragmatic utility function, just with "truth" as the payoff. If epistemic utility is just a metaphor for pragmatic utility, the distinction collapses.

  **Joyce's Defense:**
  Joyce (and later Pettigrew) argues that the choice of scoring rule can be justified by purely epistemic constraints (e.g., Extensionality, Continuity, Symmetry) without reference to decision-making. They argue that accuracy is a *sui generis* value, not reducable to pragmatic success.

  ### Summary: Why the Distinction Holds (with caveats)
  Joyce's argument counts as "nonpragmatic" because it attempts to derive the norm from the **internal standards of the belief state** (accuracy) rather than the **external consequences of the agent** (wealth/utility).

  *   **DBA:** "Incoherence makes you vulnerable to exploitation." (Pragmatic vulnerability)
  *   **Joyce:** "Incoherence makes you objectively less accurate." (Epistemic defect)

  However, you are right to sense a deep structural unity. Both arguments are **dominance arguments** relying on the geometry of convex sets. The difference is not in the *logic* of the proof, but in the **philosophical interpretation of the axes**.

  If you accept **Veritism** (the view that accuracy is the sole fundamental epistemic good), Joyce's argument is genuinely nonpragmatic. If you view "accuracy" as merely a metaphor for "successful navigation of the world," then your reading is correct: it is the Dutch Book argument wearing a truth-teller's mask. The literature generally accepts Joyce's distinction *conditional* on accepting Veritism as a substantive normative thesis distinct from pragmatism.

  **Recommendation:** If you want to press your skepticism further, look into **David Christensen's "Putting Logic in Its Place"**. He argues that pragmatic consistency (Dutch Book) and epistemic consistency (Probability) are distinct norms that can come apart, and that trying to derive epistemic norms from accuracy dominance often covertly relies on pragmatic assumptions about how we value truth.
