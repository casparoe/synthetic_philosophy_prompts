      *   *Is the user right about the "exploitability" aspect?* Yes, in both cases, there exists an alternative state (betting portfolio or credence function) that performs better in every possible world.
      *   *Is the distinction "pragmatic" vs. "epistemic" standard?* Yes, this is the core selling point of EUT. DBA is often criticized as pragmatic (about betting behavior), while EUT is claimed to be epistemic (about truth/accuracy).
      *   *What is the core philosophical dispute?* The "Pragmatic Vindication" vs. "Epistemic Vindication" debate. Key figures: Joyce, Leitgeb, Pettigrew, Christensen, Howson.

  3.  **Deconstruct the "Pragmatic" vs. "Epistemic" Distinction:**
      *   **Dutch Book (DBA):** Focuses on *action*. If your credences don't follow probability axioms, you will accept a set of bets that guarantees a loss.
          *   *Critique:* Why should I care about money? Why should I care about betting? What if I don't bet? It links belief to *desire/utility* (pragmatic consequences).
      *   **Joyce's Accuracy Argument:** Focuses on *belief state itself*. If your credences don't follow probability axioms, there is another set of credences that is *more accurate* (closer to the truth) in every possible world.
          *   *Claim:* Accuracy is an *epistemic* good, intrinsic to belief, not dependent on action or money.

