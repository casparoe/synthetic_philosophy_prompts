      *   **3. The Normative Force:**
          *   DBA: "Don't be stupid with your money."
          *   Joyce: "Don't be inaccurate in your representation of the world."
      *   **4. The "Separation" Thesis:**
          *   EUT tries to separate epistemic rationality from practical rationality. DBA conflates them.

  5.  **Address the User's Skepticism (The "Same Move in Different Clothing" point):**
