      *   *Adjustment:* Make sure to explicitly discuss the "reciprocity" aspect Fuller mentions. Fuller thinks following rules respects human agency. Hart thinks it just makes coercion smoother. I need to emphasize that a regime can respect agency *instrumentally* (to get compliance) without respecting it *morally*.
      *   *Check:* Is the software analogy sustained?
      *   *Adjustment:* Ensure I mention "technical debt," "refactoring," or "documentation" to resonate with the user.
      *   *Check:* Is Hart's distinction clear?
