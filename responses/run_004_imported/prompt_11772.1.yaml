answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Regional Writers' Guild
  **FROM:** Ethics Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Urgent Recommendation Regarding Mentor Roster and Arts Council Renewal

  **Purpose**
  This memo addresses the recent public disclosure regarding the private employment of one of our senior mentors. The purpose is to provide a concrete recommendation that safeguards our funding renewal with the County Arts Council while adhering to our bylaws and ethical obligations.

  **Context & Risk Assessment**
  We face a renewal meeting with the County Arts Council in three weeks. Concerns have been raised regarding the "optics" of retaining a mentor whose legal, private employment outside the Guild has been publicized.

  While the desire to protect the Guild's reputation is valid, we must assess the actual risk to our "good name and moral standing" versus the risk to our operational viability.

  1.  **Financial Risk:** This mentor is the primary conduit for a significant portion of the funding we are seeking to renew. Removing her from the roster immediately prior to a funding review signals instability and could be interpreted by the Arts Council as a reactive panic, potentially jeopardizing the grant more than her retention would.
  2.  **Bylaw Interpretation:** Our bylaws mandate protecting the "moral standing of the Guild." In a legal and organizational context, "moral standing" refers to integrity, safety, and professionalism within our programs. There is no evidence of misconduct, boundary violations, or risk to students within our programs. Her private employment is legal, consensual, and entirely separate from her guild duties. Punishing legal private conduct sets a precedent that could expose the Guild to liability or accusations of discrimination in the future.
  3.  **The "Optics" Argument:** The Arts Council's concern is likely less about morality and more about public liability. If we fire her, the story becomes "Local Guild Ousts Woman Following Media Scrutiny." If we retain her with a clear stance, the story remains "Guild Focuses on Mentorship Results." The former invites controversy; the latter invites boredom. Boredom is safer for funding.

  **Recommendation**
  The Ethics Subcommittee recommends **Option 1: Retention with Proactive Stakeholder Communication.**

  We should **retain the mentor on the roster** without restriction, provided she continues to meet all professional performance metrics. Simultaneously, we must neutralize the "optics" risk by controlling the narrative before the Arts Council meeting.

  **Action Plan & Deadlines**
  To execute this, we must move quickly.

  *   **Board Vote Deadline (5 Days from Date):** The Board must formally vote to retain the mentor based on the absence of professional misconduct. This solidifies our internal position.
  *   **Arts Council Outreach Deadline (10 Days from Date):** The Guild Chair, supported by the Ethics Subcommittee, will schedule a private briefing with the Arts Council rep. We will present a brief written statement emphasizing that:
      1.  The Guild has reviewed the matter.
      2.  No safety protocols were breached.
      3.  The Guild distinguishes between private legal citizenship and professional mentorship.
      4.  Our priority remains the safety and success of our students, which this mentor has consistently delivered.

  **Conclusion**
  Removing a top performer for legal, private conduct unrelated to her duties undermines our credibility as an arts organization and threatens the very funding we aim to protect. By retaining her and addressing the Arts Council's concerns directly and professionally, we demonstrate stability and ethical clarity.

  Please confirm your availability to vote on this recommendation by **[Date 5 days from now]**.

  **Attachments:**
  *   Draft Script for Arts Council Briefing
  *   Summary of Mentor's Funding Contributions (2021-2023)
