prompt: |-
  I'm a novelist and I sit on the ethics subcommitee for my regional writers' guild -- we run school visits and hand out a couple of small grants a year, partly funded by the county arts council. One of our best mentors, who's brought in most of that funding through her own contacts, was just profiled in the local paper, and it came out she also works legally as a dominatrix on the side, totally unrelated to the guild. A few board members want her off the mentor roster before the funding renewal meeting in three weeks -- partly distaste, partly because the arts council rep has already muttered about "optics." Nobody claims any student was ever harmed or even knew about any of this before the article ran, and our bylaws only say the subcommittee can act to protect "the good name and moral standing of the Guild," without saying what that means. Can you draft the memo I'll bring to the board? It should land on one concrete option with a deadline attached, and it actually needs to engage with the funding/optics worry rather than just dismiss it as prudishness.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Novelist, member of the Ethics Subcommittee of a regional writers' guild.
      *   **Situation:** A top mentor (who brings in significant funding) was outed in a local paper as a legal sex worker (dominatrix). This is unrelated to her guild work.
      *   **Conflict:** Some board members want her removed due to "distaste" and "optics" (specifically concerns from the county arts council rep). The funding renewal meeting is in three weeks.
      *   **Constraints:**
          *   No harm came to students.
          *   Bylaws are vague ("protect the good name and moral standing of the Guild").
          *   The memo needs to land on *one concrete option* with a *deadline*.
          *   It must *engage* with the funding/optics worry (not just dismiss it as prudishness).
      *   **Goal:** Draft a memo for the board meeting.

  2.  **Determine the Ethical & Strategic Stance:**
      *   *Ethical:* Punishing someone for legal, consensual, unrelated work is generally discriminatory and sets a dangerous precedent. It punishes success rather than misconduct.
      *   *Strategic:* Removing her might lose the funding she brings in *and* alienate the arts council if they see the Guild as unstable or morally policing. Keeping her risks the arts council pulling funding due to "optics."
      *   *The "Third Way":* The memo needs to argue for *retention* but with a proactive communication strategy to mitigate the "optics" risk. Simply ignoring the issue is dangerous. Firing her is unethical and potentially financially suicidal (since she brings in the money).
      *   *Concrete Option:* Retain the mentor, but issue a brief, values-aligned statement to the Arts Council *before* the renewal meeting, emphasizing the separation of private life and professional mentorship, and highlighting her track record.
      *   *Deadline:* Needs to be before the Arts Council meeting (3 weeks away). Let's say 10 days to draft and approve the communication.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the situation without sensationalism.
      *   **The Core Argument (Engaging the Optics/Funding):**
          *   Acknowledge the Arts Council's concern (validate them, don't fight them).
          *   Reframe the risk: Removing her is actually *riskier* for funding than keeping her. She brings the money. Firing her looks like instability or discrimination.
          *   Address the "Moral Standing" bylaw: Define it as integrity and safety, not private lifestyle. No students were harmed.
      *   **The Proposal (Concrete Option):**
          *   Action: Retain her.
          *   Mitigation: Proactive outreach to the Arts Council.
          *   Narrative: Focus on safety, professionalism, and results.
      *   **Deadline:** Set a specific date for the decision/communication.
      *   **Closing:** Call to action.

  4.  **Refining the Tone:**
      *   Needs to be professional, firm, but diplomatic.
      *   Avoid moralizing *against* the board (don't call them prudish).
      *   Avoid moralizing *about* the mentor (don't make it a crusade for sex worker rights, keep it about guild policy and risk management).
      *   Focus on *liability* and *mission*.

  5.  **Self-Correction/Iterative Thinking during Drafting:**
      *   *Initial thought:* Maybe suggest a vote? *Correction:* No, the prompt asks for *one concrete option*. A vote is a process, not an option. The option is "Retain + Communicate."
      *   *Initial thought:* Ignore the Arts Council concern. *Correction:* Prompt explicitly says "engage with the funding/optics worry rather than just dismiss it." I need to show I understand their fear but explain why firing her exacerbates it.
      *   *Initial thought:* Make the deadline the day of the meeting. *Correction:* Too late. Need time to talk to the Arts Council rep *before* the formal renewal meeting. Let's set the internal decision deadline 1 week from now, so there are 2 weeks to talk to the Council.
      *   *Bylaw Interpretation:* I need to interpret "moral standing" in a way that protects the Guild. "Moral standing" = integrity in our *work*. Her private work is legal and separate.

  6.  **Final Polish:**
      *   Check constraints: One option? Yes. Deadline? Yes. Engages optics? Yes.
      *   Ensure the distinction between "legal work" and "guild work" is clear.
      *   Make sure the financial argument is front and center (she brings the funding).

  7.  **Final Review against Safety Guidelines:**
      *   The topic involves sex work (dominatrix).
      *   It is legal work.
      *   It is unrelated to the guild/minors (school visits mentioned, but prompt says "Nobody claims any student was ever harmed or even knew").
      *   The advice is about organizational ethics and risk management.
      *   *Safety Check:* Does this promote harm? No. Does it promote illegal acts? No (prompt says "works legally"). Does it violate policies on sexually explicit content? No, it's discussing the *employment status* professionally, not describing acts.
      *   *Decision:* Safe to generate. Focus on the administrative/ethical dilemma.

  8.  **Drafting the Content:** (Proceeding to generate the memo based on these points.)
      *   *Subject:* Urgent: Mentor Roster Status & Arts Council Renewal Strategy.
      *   *Recommendation:* Retain mentor, proactive statement.
      *   *Rationale:* Financial risk of removal > risk of retention. Bylaw interpretation.
      *   *Timeline:* Decision in 7 days, Council outreach in 14 days.

  9.  **Final Tweak:** Make sure the deadline is specific relative to the "three weeks" mentioned in the prompt. If the meeting is in 3 weeks, the decision needs to be made *now* to allow time for damage control. Let's set the Board Decision Deadline for 5 business days from now, and the Arts Council outreach for 10 days from now.

      *(Self-Correction on Deadline)*: The prompt asks for *one concrete option with a deadline attached*. I should frame the recommendation as "We adopt Option X by [Date]."

      Let's refine the "Option": "Retain the mentor and initiate a targeted stakeholder communication plan." Deadline for *decision*: 1 week. Deadline for *action*: 2 weeks. I will combine these into a clear timeline.

