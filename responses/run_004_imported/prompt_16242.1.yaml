          *   *Analysis:* This is a philosophical distinction between *Selected Effect (SE)* functions and *Causal Role (CR)* functions. Dad is arguing for the Strict Selected Effect view. His analogy (scar/bar bet) is good for distinguishing adaptation from byproduct. He is philosophically consistent here.
