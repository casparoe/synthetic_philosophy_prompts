      *   *The "Amphiboly" point:* Make sure to clarify that the amphiboly is about *rights-claims*, not about *moral relevance*. We confuse "I ought to treat X well" with "X has a claim on me." Kant says the latter is false, but the former remains true.
      *   *The "Faithful Dog":* This is about *gratitude*. Gratitude is a duty to oneself (to honor humanity in oneself). But gratitude requires a *benefactor*. The dog is the *analogue* of a benefactor. If the dog didn't act faithfully, it wouldn't be an analogue of a benefactor. Thus, the dog's behavior determines the duty's content.

