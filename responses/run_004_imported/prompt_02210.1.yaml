      *   *The Gap:* If the duty is purely about *my* moral health, why does the *object* of my action matter so specifically? If I just need to cultivate benevolence, couldn't I do that by being nice to a plastic dog? Kant clearly thinks no. The animal's suffering/response is constitutive of the duty's content.

