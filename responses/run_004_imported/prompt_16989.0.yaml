      *   **Conclusion:** Who won? Deniz on technicalities, Mara on conceptual clarity. The real winner is the realization that "Handicap Principle" is an overloaded term.

  6.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say Deniz is definitely right. Countersignaling is often presented as *distinct* from Handicap signaling. In Handicap, $Signal \propto Quality$. In Countersignaling, $Signal \propto Quality$ up to a point, then drops.
      *   *Nuance:* Deniz claims countersignaling fits Grafen. Mara claims it doesn't fit Zahavi. Both are true. The debate is about which definition controls the term "Handicap Principle."
      *   *FHT Citation:* Feltovich, Harbaugh, To (2002) "Too Cool to Show Off." This is the canonical paper. It uses a Spencean education model framework. It shows high types don't invest in education because they are distinguishable from low types by other means, and don't want to be confused with middle types.
