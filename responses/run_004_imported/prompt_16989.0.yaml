  4.  **Identify the Underlying Mix-up:**
      *   **Zahavi vs. Grafen:** Mara is arguing from the *verbal* Zahavi tradition (signals must be wasteful). Deniz is arguing from the *formal* Grafen tradition (signals must satisfy differential marginal costs).
      *   **Signaling vs. Countersignaling:** Countersignaling is often a *violation* of the simplest single-crossing condition in standard signaling models. In standard Handicap models, more quality = more signal. Countersignaling says Highest Quality = Less Signal.
      *   **The Real Issue:** Is countersignaling a *subset* of handicap signaling, or a *distinct* mechanism?
          *   Most theorists view countersignaling as a distinct phenomenon that arises when there are *three or more* types and information is noisy.
          *   In a strict Grafen model, if the top type reduces signaling, it's because the marginal benefit of signaling drops to zero for them, not necessarily because the cost structure changed.
          *   *Crucial Nuance:* Countersignaling often relies on the *absence* of a signal being the signal. Does an absence constitute a "handicap"? A handicap implies a burden. Saving energy isn't a burden.
          *   *However:* The "cost" in countersignaling is the risk of being mistaken for the bottom type. The top type bears this risk less (or has other ways to prove quality) than the middle type.
      *   **The Mix-up:** They are arguing about *semantics* (what counts as a "handicap") rather than *mechanism* (does the math hold?). Mara thinks Handicap = Wasteful Expenditure. Deniz thinks Handicap = Stable Separating Equilibrium via Differential Costs. Both are partially right depending on which decade of theory you cite.
      *   **Also:** Feltovich/Harbaugh/To is economics (human capital/status), not behavioral ecology. While the math translates, the biological mechanisms (fitness costs vs. wage costs) differ.

