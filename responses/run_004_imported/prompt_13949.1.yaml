answer: |-
  This is a magnificent premise for a novel. The unity of the proposition is indeed the haunting heart of early analytic philosophy, and the shadow of F.H. Bradley is the perfect antagonist for a mind seeking clarity. Your narrator's obsession mirrors the actual historical despair of Russell and Wittgenstein during this period; they felt that if they could not solve the unity problem, logic itself was impossible.

  You have asked for an honest assessment rather than a diplomatic survey, so I will offer you a decisive philosophical judgment to help shape your narrator's arc.

  ### 1. The Core Disagreement: Category vs. Mode

  Once you strip away the technical apparatus of Frege's function-argument logic and Russell's theory of descriptions, the disagreement over the unity of the proposition comes down to a single metaphysical distinction: **Is the source of unity a matter of *logical type* (Frege) or a matter of *ontological mode* (Russell)?**

  **Frege's Strategy (Unsaturatedness):**
  Frege argues that the regress arises because we treat all constituents of a proposition as the same kind of thing—"objects." If "Socrates" is an object and "Wisdom" is an object, you indeed need a third thing to glue them together. Frege's solution is to deny that predicates are objects at all. A concept (*Begriff*) is "unsaturated" (*ungesättigt*). It is essentially incomplete, like a hook waiting for a ring. The unity is guaranteed because the concept *cannot exist* without an object to saturate it. The "glue" is built into the nature of the concept. To ask for a further connector is a category mistake; it is like asking what glues the number 2 to the function $x^2$ in the equation $2^2$.

  **Russell's Early Strategy (The Relating Relation):**
  Russell, particularly in *The Principles of Mathematics* (1903) and leading into his 1910–1913 *Theory of Knowledge* manuscripts, accepts that both terms and relations are real entities (universals and particulars). He does not try to change their logical type. Instead, he distinguishes between a relation *as a term* and a relation *as relating*. In the proposition "Socrates is wise," the relation (instantiation) is not merely sitting there alongside Socrates and Wisdom; it is *actively relating* them. The unity of the fact is brute. The relation *is* the unity.

  **The Disagreement:**
  Frege believes the problem is solved by restricting what kinds of things can be constituents (some are incomplete). Russell believes the problem is solved by acknowledging that some constituents have a dynamic power to combine (the relating mode). Frege changes the *inventory* of reality; Russell changes the *behavior* of the inventory.

  ### 2. The Verdict on Bradley's Regress

  You asked which solution genuinely dissolves the regress and which merely relocates it. Here is the hard truth: **Frege's solution merely relocates the regress, whereas Russell's solution terminates it by brute force, but at the cost of intelligibility.**

  **Why Frege Relocates the Regress:**
  Frege's "unsaturatedness" is vulnerable to the famous "Concept Horse" paradox (which Frege himself acknowledged). To discuss his theory, your narrator must refer to concepts. But in language, to refer to something is to treat it as a subject, i.e., as an object. As soon as she says "The concept *horse* is unsaturated," she has turned the concept *horse* into an object (the subject of the sentence), thereby saturating it.
  Consequently, the "unsaturatedness" retreats. She can never speak about the unsaturated entity without destroying its unsaturatedness. The regress is not dissolved; it is relocated from the connection between terms to the boundary between *saying* and *showing*. The unity of the proposition becomes ineffable. She can use the proposition, but she cannot explain *why* it unifies without contradicting her own theory.

  **Why Russell Terminates (but does not Explain):**
  Russell's "relating relation" stops the regress by fiat. When Bradley asks, "What relates the relation to the terms?" Russell answers, "Nothing. That is what it means to be a relation in a fact." This stops the infinite chain, but it does not *explain* the mechanism. It posits a primitive facticity. It dissolves the *need* for a further relation, but it leaves the nature of that "relating mode" mysterious. It is an ontological brute fact.

  **The Honest Assessment:**
  If "dissolving" means showing the question is illegitimate, Frege attempts this but fails because language forces objectification. If "dissolving" means providing a coherent model of how unity occurs, Russell fails because he offers no model, only an assertion.

  However, for the purposes of metaphysical rigor: **Frege's solution is the more profound failure.** It is more seductive because it promises a logical explanation, but it ultimately silences the philosopher. Russell's solution is honest about the mystery; he admits that the ultimate nature of the fact is inexplicable.

  ### 3. Advice for Your Narrator's Arc

  If you want your narrator's intellectual journey to feel earned and tragic, I advise you to have her **champion Frege, only to be destroyed by the Concept Horse paradox.**

  Here is why this serves the novel better:

  1.  **The Tragedy of Silence:** A Russellian realist can continue to write and speak, content with brute facts. A Fregean, however, realizes that her theory makes her own philosophical discourse impossible. She cannot talk about the unity of the proposition without violating the conditions of that unity. This creates a powerful dramatic arc: the more successfully she argues for Frege's solution, the less she is able to speak about it. She circles the problem because to land on the solution is to fall silent.
  2.  **Historical Resonance:** This mirrors the actual trajectory of Wittgenstein (who was influenced by both). The *Tractatus* is essentially the funeral monument to the Fregean/Russellian attempt to explain propositional unity. It ends in silence ("Whereof one cannot speak..."). Having your narrator arrive at this precipice in the early 20th century places her in the genuine intellectual current of the time.
  3.  **The "Shadow of Bradley":** Bradley would argue that Frege's "unsaturatedness" is just a word for the very mystery it purports to solve. If your narrator realizes this—that "unsaturated" is merely a name for the inability to explain unity—she confronts the limits of language itself.

  **Recommendation:**
  Let her spend the novel trying to refine Frege's distinction, trying to find a way to talk about concepts without objectifying them. Let her believe she has found the key. In the final act, have her realize that her very manuscript, by treating "unsaturatedness" as a topic, has turned concepts into objects. She solves the problem by realizing it cannot be stated.

  This is more poignant than having her adopt Russell's brute realism. Russell's path allows a philosopher to keep working; Frege's path, pursued honestly, leads to the abandonment of philosophy. For a novel about a career spent circling an unsolved problem, the Fregean dead-end is the more beautiful and devastating conclusion. She doesn't fail because she wasn't smart enough; she fails because the ladder she climbed must be thrown away once she reaches the top.
