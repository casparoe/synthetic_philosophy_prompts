          *   *Assessment:* Logically sound within the current legal/medical framework (UDDA). However, relies on the distinction between "natural" and "artificial" support, which is sometimes blurry (e.g., pacemakers, insulin).
          *   *Verdict:* Strong defense of the status quo, but potentially conflates *support* with *integration*.

      *   **Move 3: Priyanka's Counter (The "Pregnancy" Example)**
