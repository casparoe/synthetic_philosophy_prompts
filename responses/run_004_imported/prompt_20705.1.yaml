      *   **Farah's Position:** It's Goodhart's Law. The metric (mortality) was a proxy for quality until it became a target, then it stopped working. She cites Goodhart's 1975 paper regarding regularities collapsing under control pressure. She sees Campbell as a redescription in social science idiom.
      *   **Leo's Position:** It's Campbell's Law. Goodhart was about statistical regularities breaking down (regressional), whereas this is self-interested agents gaming the system (adversarial). He argues the distinction matters for solutions (statistical fix vs. incentive change).
      *   **Task:** Go through the exchange move by move, evaluate who has the better of it at each point, and flag overlooked aspects.

  2.  **Analyze the Concepts (Background Knowledge):**
      *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." Originally formulated by Charles Goodhart (1975) in the context of monetary policy.
          *   *Nuance:* There are actually *four* types of Goodhart's Law (Manheim & Garrabrant, 2018): Regressional, Extremal, Causal, and Adversarial.
          *   *Original Context:* Monetary aggregates (M3, etc.) and inflation. Economic agents reacting to policy.
      *   **Campbell's Law:** "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor." (Donald Campbell, 1976).
          *   *Context:* Social indicators, education, policy evaluation. Explicitly focuses on *corruption* and *distortion* of social processes.
      *   **The Case:** Cardiac surgery report cards. Surgeons (agents) avoid high-risk patients to keep mortality rates low. This is *cream-skimming* or *risk selection*.
      *   **The Fields:**
          *   *Mechanism Design:* Focuses on incentives, strategic behavior, implementation. (Leo's angle).
          *   *Program Evaluation:* Focuses on metrics, validity, social indicators. (Campbell's angle).
          *   *AI Alignment:* Focuses on specification gaming, reward hacking. (Often uses "Goodhart" as an umbrella term).

  3.  **Step-by-Step Evaluation of the Exchange:**

      *   **Move 1: Farah's Opening (It's Goodhart).**
          *   *Claim:* Metric became a target -> stopped being a proxy.
