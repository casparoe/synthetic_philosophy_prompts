      *   Move 4 (Leo): Strongest point on implications. (Leo wins).
      *   *Overall:* Leo wins on utility, Farah wins on genealogy. But since the group is about *solving* problems (Mech Design/AI), utility wins.

      *Overlooked:* The "Four Goodharts" taxonomy is the missing link. The specific failure of *risk adjustment* (unobserved variables) is a technical detail they glossed over. The ethical cost (patient access) is the "social process" Campbell cared about.

