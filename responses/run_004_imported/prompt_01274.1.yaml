answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. Two emeritus professors, ELIAS (Everettian) and MARA (Bohmian), are finishing their espressos. They've known each other for decades, bonded by a shared history of "shut up and calculate" pragmatism, now indulging in the metaphysical luxuries of retirement.*

  **Elias:** So, Mara. I read your paper on the relaxation timescales in quantum equilibrium. Solid work. But you know I can't let you publish the introduction without a fight. You still claim your ontology is "leaner" than mine.

  **Mara:** (Smiling) Leaner in the right places, Elias. I keep the definiteness of outcome. You keep the linearity of the Schrödinger equation. We can't both have everything.

  **Elias:** But that's the jab, isn't it? The one you're dodging. In Bohmian mechanics, the wavefunction never collapses. It evolves unitarily. Just like in my view. So, after a measurement, you have a superposition of macroscopically distinct branches. In my book, those are all worlds. In your book, only one is "occupied" by particles. The rest are "empty waves." But they're still *there*. Mathematically, they are identical to my worlds. You haven't shaved off the worlds; you've just added a "you are here" sticker on one of them and pretended the others don't exist.

  **Mara:** That's the standard Everettian line. "Bohm is Many-Worlds with extra steps." But it misses the ontological category error you're making. You treat the wavefunction as *stuff*. As a material field residing in a high-dimensional space.

  **Elias:** It's the only thing that evolves deterministically! If I remove the collapse postulate, the wavefunction is the complete description of the state.

  **Mara:** And that's where we diverge. For a Bohmian, the wavefunction isn't the *beable*. It's not the stuff. The particles are the stuff. The wavefunction is *nomological*. It's a law. It's like the Hamiltonian in classical mechanics. Does the Hamiltonian "exist" in the same way the planet exists? No. It governs the planet.

  **Elias:** But the Hamiltonian doesn't have branches that contain complex, conscious observers who think they're measuring spin-up while you're measuring spin-down. My wavefunction contains *agents*. Your "law" contains ghosts. If the empty wave contains a copy of me, fully structured, fully decohered, and dynamically identical to the "occupied" wave up until the split... in what sense is it not a world?

  **Mara:** Because it's causally inert. Once decoherence sets in, the empty wave cannot interfere with the occupied channel. It carries no energy, no momentum, no information that can be accessed by the particles *in the actual configuration*. It's a shadow. If I burn a map of a city, the city doesn't burn. The empty wave is the burnt map. The particles are the city.

  **Elias:** But the map is drawn in the same ink! That's the point. In standard QM, the wavefunction lives in Configuration Space, not 3D space. If you take that seriously, as I do, then "3D space" is a derived concept emerging from the structure of the wavefunction. If you take that seriously, your "particles" are the weird addition. You're positing $3N$ additional variables moving through a 3D space that is arguably less fundamental than the Hilbert space the wave lives in. You're adding a shadow to the shadow.

  **Mara:** I'm adding an anchor. Look, Elias, let's talk about probability. This is where your ship takes on water. In your theory, everything that *can* happen *does* happen. So what does it mean to say one outcome is "more probable" than another? If I measure spin, there's a branch where I see up and a branch where I see down. Both "Mara"s exist. Why should I bet on the Born Rule before I measure?

  **Elias:** Decision theory. Deutsch and Wallace. If you accept the symmetries of the Hilbert space and you want to maximize your utility across the multiverse, you are *compelled* to act as if the Born Rule is true. It's not about frequency of outcomes; it's about the measure of existence. The amplitude squared weights the branches.

  **Mara:** (Shakes head) "Measure of existence." That's poetry, Elias, not physics. It's circular. You derive probability from the structure of the theory, but the theory already assumes the inner product structure that gives you the probabilities. In Bohm, probability is epistemic, just like in classical statistical mechanics. I don't know the exact initial position of the particle. If the distribution is $|\psi|^2$—quantum equilibrium—then the statistics fall out naturally. I don't need to convince a rational agent how to bet. The uncertainty is real ignorance.

  **Elias:** But that ignorance is contrived! You have to assume "quantum equilibrium" as a postulate, or rely on a relaxation mechanism that looks suspiciously like thermalization. And even then, you're back to my original point. To make that probability work, you keep the full wavefunction. You need the empty waves to guide the particle *until* the measurement is done. Afterward, you say they vanish ontologically, but they remain mathematically. You're smuggling in the multiverse to get the dynamics, then denying it to save your intuition.

  **Mara:** I'm not denying the math. I'm denying the *interpretation* of the math. You say the empty wave is a "world." I say it's a "potentiality that wasn't realized." Think about it: In classical mechanics, if I roll a die, the equations of motion allow for six outcomes. Only one happens. Do the other five solutions to Newton's laws exist as parallel universes?

  **Elias:** No, because in classical mechanics, the other solutions are incompatible with the initial conditions. In QM, the linearity means *all* solutions compatible with the initial wavefunction are realized in the superposition. The "empty" wave in Bohm satisfies the Schrödinger equation exactly. It's not a counterfactual; it's an actual component of the field. If gravity couples to the stress-energy tensor, and the wavefunction contributes to that... does the empty wave gravitate?

  **Mara:** (Pauses) That is the hard question. If the empty wave gravitates, then yes, it has ontological weight. But standard Bohmian mechanics treats the wavefunction as guiding, not as a source of gravity in the classical sense. We'd need a theory of quantum gravity to settle that. But even if it does gravitate, it gravitates *as a field*. It doesn't mean there's a "person" in there. The "person" requires the configuration of particles. Without the particles, the complex structure in the wavefunction is just... pattern without substance.

  **Elias:** Pattern without substance? Mara, I am a pattern! If my brain state is encoded in the wavefunction of a branch, and that branch is decohered and stable, what more do you need? You need the "particles" to tell you which pattern is "real." But that's indexical. It's like saying only the "Now" is real because you experience it as "Now." I say all times are real. You say all branches are real, but only one has "stuff" in it. Why does the "stuff" matter if the pattern of information is identical?

  **Mara:** Because without the "stuff," you lose the explanation for why *this* specific experience is happening. In your view, "I" am constantly splitting. There is no continuity of identity, only a branching tree of successors. In my view, there is a trajectory. A continuous world-line. I am the same entity I was five minutes ago.

  **Elias:** But that continuity is an illusion in your theory too! The particles are being guided by a non-local field that depends on the instantaneous configuration of the entire universe. Your "trajectory" is just as spooky as my "branching." And let's be honest: The reason you cling to the particles is because you can't stomach the idea of unobserved outcomes. It's psychological.

  **Mara:** Maybe. Or maybe it's because I want a theory that describes *events*, not just amplitudes. Physics is about what happens. In your theory, "what happens" is relative to a branch. In mine, "what happens" is absolute. The pointer points left. Not "left relative to branch A." Just left.

  **Elias:** But you pay for that absoluteness with non-locality that violates the spirit of relativity, even if it respects the letter via no-signaling. Your particles feel the influence of the empty wave instantaneously across the universe. My branches just decohere locally.

  **Mara:** And your "locality" comes at the cost of making probability incoherent. Look, Elias, we're both trying to solve the same problem: How do we get from the quantum formalism to the macroscopic world? You do it by inflating the macroscopic world until it covers everything. I do it by anchoring the macroscopic world to specific coordinates.

  **Elias:** So we're back to Occam. You claim I have too many worlds. I claim you have too many variables. You have the wavefunction (all worlds) + particles (one world). I just have the wavefunction. You're the one with the surplus.

  **Mara:** Only if you count the wavefunction as "things." If the wavefunction is a law, I have $N$ particles and 1 Law. You have... how many laws? One. But you have an infinite number of "universes" generated by that law. My ontology is 3D space filled with particles. Yours is Hilbert Space filled with... everything. Which is actually more parsimonious? A world in 3D space, or a world in $10^{10^{23}}$ dimensions?

  **Elias:** (Laughs) The dimensionality argument. I wondered when you'd bring that up. But Hilbert Space is the natural home of the theory. 3D space is emergent. If you build a computer simulation, the RAM doesn't look like the screen. You're demanding the RAM look like the screen.

  **Mara:** And you're claiming the screen is an illusion. Look, we might not resolve this. But don't tell me I'm a "closet Many-Worlder." I take the empty waves seriously—as mathematical necessities for the guidance equation. But I deny they are *ontologically equivalent* to the occupied channel. One is the territory; the other is the map.

  **Elias:** And I deny you can separate the map from the territory when the map contains a perfect description of a duplicate territory. But... (He raises his coffee cup) ...I will concede one point.

  **Mara:** Oh?

  **Elias:** The probability problem. The derivation of the Born Rule from decision theory... it keeps me up some nights. It feels like I'm asking physics to do philosophy's job. Your equilibrium approach is cleaner, statistically speaking.

  **Mara:** (Clinks her cup against his) And I'll concede that if we ever detect gravity coupling to the "empty" part of the wavefunction, I'm moving to your camp. If the shadow has weight, it's not a shadow.

  **Elias:** Deal. Until then, I'll keep my multiverse, and you keep your particles.

  **Mara:** Just like old times. You calculate the scattering amplitude, and I'll worry about where the electron actually went.

  **Elias:** "Shut up and calculate" really was simpler, wasn't it?

  **Mara:** Yes. But we didn't have the time then. Now we have nothing but time. And the questions aren't going away.

  **Elias:** No. They aren't. Cheers, Mara.

  **Mara:** Cheers, Elias.
