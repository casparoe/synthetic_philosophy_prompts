prompt: |-
  I'm on the committee that runs my company's internal forecasting program (think a mini Good Judgement Project, but for pipeline calls). We've hit a real fight: one of our best forecasters put 85% on our drug trial succeeding, while the other eleven, all with similar Brier scores, landed around 40%. She's heard everyone's arguments and says none of them budge her -- but a dozen peers with matching track records disagreeing is itself evidence she's missing something, even if no one can say what. Half the committee wants outliers to shade their number toward the group past some threshold; the other half says that just launders a number nobody believes, and if she's still convinced after hearing them out, maybe the 'just defer' instinct is what's wrong, not her. Can you draft the short memo for Friday's meeting -- a real recommendation with a timeframe, not 'it depends' -- that takes the pro-autonomy side seriously rather than just asserting the wisdom of crowds?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Internal forecasting program (similar to Good Judgment Project) for pipeline calls (likely pharma/biotech given "drug trial").
      *   **Conflict:** One top forecaster (85% probability) vs. eleven peers (avg ~40% probability). All have similar track records (Brier scores).
      *   **The Dispute:** The outlier has heard arguments but remains unmoved. Half the committee wants to force aggregation/shading toward the mean. The other half argues this "launders" the number and undermines autonomy/expertise.
      *   **Task:** Draft a short memo for Friday's meeting.
      *   **Requirements:**
          *   Make a *real recommendation* with a *timeframe* (no "it depends").
          *   Take the pro-autonomy side seriously (don't just default to "wisdom of crowds").
          *   Address the specific dynamic (1 vs. 11, equal track records).

  2.  **Deconstruct the Problem:**
      *   *Epistemic Status:* We have a "superforecaster" (or at least a top performer) diverging significantly from the crowd.
      *   *The "Crowd" Argument:* 11 people with equal track records agreeing suggests the outlier is missing a base rate or a specific risk factor. The divergence itself is information.
      *   *The "Autonomy" Argument:* Forcing aggregation discourages independent thinking. If she has private information or a unique model, diluting it destroys value. Crowds are often wrong in the tails.
      *   *The "Laundering" Argument:* Averaging 85% and 40% to get ~45% creates a false sense of precision. No one actually believes 45%.
      *   *Goal:* Maintain the integrity of the forecasting program while managing risk and encouraging improvement.

  3.  **Determine the Recommendation:**
      *   *Option A (Aggregate):* Average the numbers. *Pros:* Reduces variance. *Cons:* Punishes independent thought, creates "laundered" numbers.
      *   *Option B (Defer to Outlier):* Take the 85%. *Pros:* Rewards conviction. *Cons:* High risk if she's wrong, ignores 11 peers.
      *   *Option C (Hybrid/Process-Oriented):* Keep the numbers separate but flag the divergence for review. *Pros:* Transparency. *Cons:* Doesn't give a single number for decision-makers.
      *   *Option D (The "Pre-Mortem" Approach):* This is the strongest middle ground. Don't change the number *yet*. Instead, institutionalize a specific process for high-variance outliers. This respects autonomy (she keeps her 85%) but acknowledges the crowd signal (11 vs 1 is a risk flag).
      *   *Decision:* I need to pick a side for the "single number" decision *now*, but set a policy for the *future*.
      *   *Refined Decision:* For *this specific call*, do not average. Report the distribution. Why? Because averaging destroys the signal of the disagreement. However, for *future* calls, implement a "Divergence Protocol."
      *   *Wait, the prompt asks for a recommendation on how to handle the current situation/meeting.* The committee is fighting about whether to *force* her to shade.
      *   *Best Recommendation:* Do not force shading. It damages the incentive structure. Instead, report the range and attach a "Confidence/Consensus" metric. This respects the pro-autonomy argument (her number stands) while respecting the crowd argument (the lack of consensus is visible data).
      *   *Timeframe:* Immediate implementation for this quarter's report, with a review in 6 months.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and actionable.
      *   **Opening:** Acknowledge the tension. Validate both sides (Crowd wisdom vs. Individual expertise).
      *   **The Core Argument (Pro-Autonomy):** Why averaging is dangerous here. It creates false precision. It punishes the behavior we want (independent thinking).
      *   **The Core Argument (Crowd Signal):** The 1 vs. 11 split *is* data, but it shouldn't change the number, it should change the *metadata*.
      *   **Recommendation:**
          1.  Keep the 85% (and the 40% avg) visible.
          2.  Do not force reconciliation.
          3.  Add a "Consensus Score" or variance flag to the final report.
          4.  Review the outcome post-trial (calibration check).
      *   **Timeframe:** Effective immediately for Q3 pipeline report. Policy review in 6 months.
      *   **Tone:** Professional, decisive, nuanced.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is keeping both numbers confusing for leadership?
      *   *Fix:* Suggest a weighted presentation. "Base Forecast: 40% (Consensus), High-Confidence Outlier: 85%." Or better, simply present the distribution.
      *   *Actually, the prompt asks to take the pro-autonomy side seriously.* If I say "Report both," am I taking her side? Yes, because I'm refusing to suppress her number. But I also need to address the 11 peers.
      *   *Stronger Stance:* The recommendation should be to **publish the median/mean BUT attach the outlier as a distinct scenario.** No, that's still averaging.
      *   *Stronger Stance 2:* **Publish the distribution.** Decision makers need to see the risk.
      *   *Stronger Stance 3 (The Winner):* **Do not aggregate.** Aggregation is for when people are independently arriving at similar conclusions via different paths. When there is fundamental disagreement on the *model*, averaging is mathematically unsound.
      *   *Wait, one more nuance:* The prompt says "Half the committee wants outliers to shade... the other half says... maybe the 'just defer' instinct is what's wrong."
      *   *My Recommendation:* I need to tell the committee what to do *about the forecaster*. Do we make her change it? No. Do we ignore the 11? No.
      *   *Final Decision:* **Maintain the individual forecasts in the final submission.** Do not compress into a single consensus number for this specific asset. Flag it for executive review. This preserves autonomy and highlights the risk.

  6.  **Final Polish:**
      *   Ensure the tone isn't wishy-washy.
      *   Make sure the timeframe is clear.
      *   Ensure the "Pro-Autonomy" logic is robust (incentive compatibility).

      *(Self-Correction)*: I need to make sure I don't sound like I'm ignoring the 11 peers. The 11 peers represent a "Base Rate" risk. The memo should acknowledge that the *value* of the forecast isn't just the number, it's the dispersion.

      *Revised Plan:*
      1.  **Decision:** Do not force shading.
      2.  **Reporting:** Report the mean *and* the variance (or the split).
      3.  **Process:** Implement a "Red Team" review for high-variance items in the future.
      4.  **Timeframe:** Immediate for this call, policy update by Q4.

      *Let's tighten the recommendation.* The committee needs to decide *what number goes to leadership*.
      If I say "Send both," leadership might get confused.
      If I say "Send the mean," we kill autonomy.
      If I say "Send the outlier," we ignore the crowd.
      *Best path:* Send the mean, **BUT** formally document the outlier's reasoning as a "Risk/Upside Scenario." This keeps the official number stable (satisfying the crowd) but preserves the outlier's voice (satisfying autonomy) without forcing her to lie (shading).
      *Actually, looking at Good Judgment Project best practices:* They often aggregate. But this is a *company* pipeline.
      *Let's go with the "Don't Aggregate" approach for high variance.* It's bolder and fits the "take pro-autonomy seriously" instruction better. If the variance is >X%, do not average.

      *Okay, let's write it.*
      *   **To:** Forecasting Committee
      *   **From:** [My Name/Role]
      *   **Subject:** Recommendation on Forecast Aggregation Protocol (Pipeline Asset X)
      *   **Recommendation:** Do not force shading. Submit the distribution.
      *   **Rationale:** Incentive compatibility > false precision.
      *   **Timeframe:** Immediate.

      *(Final thought)*: Make sure to explicitly mention the Brier score equality. That's crucial. It means she *earned* the right to be different.

  7.  **Final Review against constraints:**
      *   Short memo? Yes.
      *   Real recommendation? Yes (Don't average).
      *   Timeframe? Yes (Immediate + 6-month review).
      *   Take pro-autonomy seriously? Yes (Focus on incentive structures).
      *   Acknowledge the 11 peers? Yes (Via variance reporting).

      *Let's draft.*
answer: |-
  **MEMORANDUM**

  **TO:** Internal Forecasting Committee
  **FROM:** [Your Name/Role]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Forecast Aggregation Protocol (Pipeline Asset X)

  **Decision**
  For the current pipeline cycle, **we will not force aggregation or shading** on Asset X. We will submit the full distribution of forecasts (40% consensus, 85% outlier) to leadership, accompanied by a brief "Divergence Note" summarizing the outlier's thesis.

  Effective immediately, we are adopting a **Variance Threshold Protocol**: when forecast dispersion exceeds 30 percentage points among forecasters with equivalent track records, we will report the range rather than the mean. We will review this policy in six months.

  **Rationale**
  This decision prioritizes *incentive compatibility* over *false precision*.

  1.  **Preserving Independent Signal:** Our program's value relies on forecasters digging for private information or unique models. If we compel a top performer (equal Brier score) to shade her number toward the mean after she has already weighed counter-arguments, we penalize the exact behavior we want to reward. We train forecasters to second-guess their conviction rather than refine their reasoning.
  2.  **The "Laundering" Risk:** Averaging 40% and 85% yields ~43%. No one in this room believes the probability is 43%. Submitting that number hides the risk profile from leadership. A bimodal distribution is not noise; it is data indicating a fundamental disagreement on the underlying model, not just noise around a single truth.
  3.  **Accountability:** By keeping the 85% distinct, we allow for post-mortem calibration. If she is right, we learn what the crowd missed. If she is wrong, her track record adjusts accordingly. Aggregation protects individuals from calibration feedback, which degrades long-term performance.

  **Addressing the Consensus**
  The 11-vs-1 split is significant. It suggests the outlier may be underweighting a base rate or systemic risk. However, the correct remedy is not to suppress her number, but to **flag the variance.** Leadership needs to know that while the weighted center is 40%, there is a credible, high-conviction path to success that the majority rejects.

  **Next Steps**
  *   **Friday:** Submit Asset X forecast as a range with attached reasoning summaries from both the consensus group and the outlier.
  *   **Q1 Next Year:** Review calibration data on high-variance items to determine if the Variance Threshold Protocol improves decision-making quality compared to historical aggregation.

  We must choose between looking confident and being useful. In this case, transparency is the more useful metric.
