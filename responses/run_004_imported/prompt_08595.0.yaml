  5.  **Refining the Physics Analogy:**
      *   Use the user's language.
      *   Bell Test: Measurement settings $a, b$. Outcomes $A, B$. Hidden variable $\lambda$. Locality means $P(A|a,b,B,\lambda) = P(A|a,\lambda)$.
      *   Superrational PD: Agent 1 computes $D_1$. Agent 2 computes $D_2$.
      *   If $D_1$ and $D_2$ are physical processes running on separate hardware, maybe screening off applies?
      *   *Counter:* Superrationality assumes the *logic* is what matters, not the hardware. It's like measuring the spin of the *same* particle in the *same* basis twice. Of course they correlate.
      *   Better analogy: Two calculators manufactured identically, given identical input. Do they screen off? No, because the output is a function of the input + logic. If Logic and Input are fixed, Output is fixed.
