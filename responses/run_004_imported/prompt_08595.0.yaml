      *   **Reichenbach vs. Logic:** Reichenbach's principle applies to empirical correlations in a causal network. It does not apply to mathematical truths. $2+2=4$ here implies $2+2=4$ there. Conditioning on "the laws of math" doesn't screen off the correlation between two calculators computing $2+2$.
