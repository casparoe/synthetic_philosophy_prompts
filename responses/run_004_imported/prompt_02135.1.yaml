answer: |-
  This is a fantastic EPQ topic, and your supervisor is right: the connection is deep, but it requires understanding the specific philosophical crisis Sidgwick was trying to solve. It is easy to look back from the 21st century and view the Society for Psychical Research (SPR) as a bunch of smart people doing silly things. But for Sidgwick, it wasn't a "weird hobby"; it was a continuation of his ethical project by other means.

  Here is the breakdown of why Sidgwick's psychical research is not an inconsistency, but rather a desperate attempt to save the foundations of his ethics.

  ### 1. The Victorian Crisis of Sanctions
  To understand Sidgwick, you have to understand the intellectual atmosphere of late 19th-century Cambridge. Darwin, geology, and German biblical scholarship were eroding traditional Christian belief.

  For centuries, morality in Europe was underpinned by religion. Why be good? Because God sees you, and there is heaven or hell. This is what philosophers call a **sanction** for morality.

  Sidgwick was a utilitarian. He wanted to base ethics on reason and the maximization of happiness, not on divine command. But he noticed a problem: as science dismantled religion, it also dismantled the *sanctions* that made people want to be moral. If there is no God and no afterlife, why should a rational person sacrifice their own happiness for the "greater good"?

  Sidgwick hoped that Psychical Research could do what theology could no longer do: provide **empirical evidence** for survival after death. If he could scientifically prove that consciousness survives death, he could restore a rational basis for moral sanctions without relying on church dogma. He wasn't chasing ghosts for fun; he was chasing evidence for a moral universe.

  ### 2. The Dualism of Practical Reason
  This is the specific philosophical concept you need to look up for your EPQ. It is the core of Sidgwick's ethical struggle.

  In *The Methods of Ethics*, Sidgwick identifies a conflict between two rational approaches:
  1.  **Rational Egoism:** It is rational to pursue my own happiness.
  2.  **Rational Utilitarianism:** It is rational to pursue the universal good.

  Usually, these overlap. But sometimes they conflict. If I can gain a massive advantage by hurting the general public (and I won't get caught), Egoism says "do it," while Utilitarianism says "don't." Sidgwick couldn't find a purely rational way to prove that Utilitarianism *must* win. He called this the "Dualism of Practical Reason," and it terrified him. It suggested that morality might be fundamentally irrational.

  **Here is the link to the SPR:** If psychical research could prove the existence of a spiritual realm where justice is ultimately served (i.e., you get rewarded for virtue and punished for vice in the afterlife), then Egoism and Utilitarianism would align again. It would be in your *self-interest* to be good because of the cosmic consequences.

  Sidgwick didn't necessarily *believe* in ghosts. But he needed the *possibility* to remain open because if the possibility was closed, his ethical system had a gaping hole in it.

  ### 3. Methodological Consistency (He wasn't being irrational)
  Your worry is that he was being inconsistent: rigorous in ethics, sloppy in psychical research. Historians of philosophy argue the opposite: he applied the same rigor to both.

  Sidgwick was an **empiricist**. He believed knowledge comes from experience and evidence.
  *   **In Ethics:** He didn't just assert "Utilitarianism is true." He analyzed common sense, intuition, and hedonism to see what the evidence of human moral reasoning suggested.
  *   **In Psychical Research:** He didn't just say "Ghosts are real." He investigated mediums, exposed frauds (he was actually quite good at spotting scams), and demanded strict experimental conditions.

  His stance was: *"We cannot rule out phenomena simply because they contradict our current understanding of physics."* To a modern eye, this looks naive. To Sidgwick, it was the only scientifically honest position. He was willing to follow the data wherever it led, even if it led to the supernatural. In that sense, his SPR work was perfectly consistent with his philosophical commitment to following arguments where they lead, regardless of comfort.

  ### 4. How to frame this in your EPQ
  Your supervisor wants you to work this out because realizing this connection transforms your project from "Victorians were weird" to "Victorians were trying to solve a metaphysical crisis."

  **Don't argue:** "Sidgwick was a great philosopher who had a weird secret hobby."
  **Do argue:** "Sidgwick's involvement in the SPR was a direct attempt to secure the metaphysical foundations of his Utilitarian ethics in a secularizing age."

  **Key points to research for your essay:**
  *   Look up Sidgwick's essay *"The Ethics of Religious Conformity"* (shows his struggle with belief).
  *   Look up the phrase **"The Dualism of Practical Reason"** in *The Methods of Ethics*.
  *   Investigate the SPR's founding mission statement—they explicitly wanted to put these phenomena on a scientific footing to understand human potential and survival.
  *   Consider the letter Sidgwick wrote to his former student, E.E. Constance Jones, where he admits that if the evidence for survival of death were removed, he wouldn't know why he should bother with morality at all.

  ### Summary
  Sidgwick wasn't clocking out of being a philosopher when he went to a seance. He was trying to find scientific proof for the afterlife because he feared that without it, morality had no rational binding force.

  It doesn't undercut his ethics; it humanizes them. It shows that his rigorous system was built on a foundation he knew was shaky, and he spent decades trying to shore it up. That makes him a more compelling figure, not a less rational one.

  Good luck with the EPQ. This is a sophisticated angle that should score very well if you can articulate that link between the *sanctions of morality* and the *evidence for survival*.
