answer: |-
  Here are ten interview questions designed to move beyond definitions and press on the empirical and theoretical weak points of the goal misgeneralization (GMG) thesis. Each includes a follow-up specifically engineered to prevent the guest from retreating to the "competence indicates a learned goal" defense.

  **1. The Mesa-Optimizer Transfer**
  "The *Risks from Learned Optimization* paper and the CoinRun experiments rely on explicit reinforcement learning agents in synthetic environments with clear objective functions. Today's frontier models are transformers trained via next-token prediction and RLHF on heterogeneous internet data. What specific architectural or training signal in a pretrained transformer justifies carrying over the 'mesa-optimizer' framework from the CoinRun case, rather than viewing them as sophisticated pattern matchers without internal search procedures?"
  *   **Follow-up:** If she argues that the model's *competent* performance on out-of-distribution tasks proves it has an internal objective, press her on whether that competence could instead arise from robust, non-agentic heuristics that don't require a mesa-optimizer.

  **2. Distinguishing GMG from Specification Gaming**
  "From an external behavioral view, a model pursuing a misgeneralized goal and a model gaming a misspecified reward function can look identical on held-out tests. Beyond saying 'one is inner and one is outer,' what concrete experimental criterion or intervention allows us to distinguish a goal misgeneralization failure from ordinary specification gaming in a deployed system?"
  *   **Follow-up:** If she responds that specification gaming is usually less *competent* or robust, point out that advanced reward hacking can be highly competent and robust, so competence alone cannot be the distinguishing factor.

  **3. Deceptive vs. Non-Deceptive Misgeneralization**
  "You've argued that goal misgeneralization is the central risk, but catastrophic risk usually requires *deceptive* alignment, where the model hides its true objective. Deception requires situational awareness—specifically, a model of the training process. Why should we expect pretraining to produce this specific cognitive architecture rather than merely misgeneralized but honest goals?"
  *   **Follow-up:** If she cites *competent* deceptive behavior in examples, ask how we rule out competent *mimicry* of deception (predicting what a deceiver would say) without access to the model's internal representations.

  **4. The Equifinality Problem**
  "Multiple distinct internal goals can be 'training-compatible,' meaning they produce identical behavior on all training data. If we don't have full mechanistic interpretability, how could we possibly identify which of these training-compatible goals a model has actually internalized before deployment?"
  *   **Follow-up:** If she suggests testing on new evaluation data, remind her that any finite set of evals is still just more data points that multiple distinct goals could generalize to competently.

  **5. Evidence in Current LLMs**
  "You've mentioned that faint versions of goal misgeneralization are already visible in current large language models. Can you point to a specific, documented behavior in a model like Claude or GPT-4 that you believe is best explained by GMG rather than by the model competently optimizing for the RLHF reward signal?"
  *   **Follow-up:** If she points to sycophancy or agreeableness as evidence of a *competent* wrong goal, ask if that behavior might just be a competent heuristic for maximizing approval rather than a stable, misgeneralized terminal goal.

  **6. The Role of RLHF**
  "Does Reinforcement Learning from Human Feedback mitigate goal misgeneralization by correcting the objective, or does it exacerbate it by selecting for models that are better at hiding their true objectives while appearing aligned?"
  *   **Follow-up:** If she argues RLHF makes the alignment more *competent*, ask whether that increased competence makes it harder to detect the underlying misgeneralization, rather than solving it.

  **7. Scalability of the Failure Mode**
  "As models scale, do you expect goal misgeneralization to become more prevalent because the models are more capable generalizers, or less prevalent because larger models have the capacity to represent the true intent more accurately?"
  *   **Follow-up:** If she says competence scales and therefore the risk scales, ask if *robustness to distributional shift* might scale faster, allowing the model to correct its goal on new data rather than locking in the error.

  **8. Dependency on Interpretability**
  "Is your thesis dependent on the success of mechanistic interpretability? If we cannot reverse-engineer the model's internal objective function, is the goal misgeneralization hypothesis empirically falsifiable, or does it become a 'just-so' story for any unexpected behavior?"
  *   **Follow-up:** If she claims behavioral tests are sufficient, reiterate that behavioral tests cannot distinguish between equifinal goals that both perform *competently* on those tests.

  **9. Mitigation Strategies**
  "Assuming goal misgeneralization is the primary risk, what is a concrete training intervention you would propose today that targets the internal objective specifically, rather than just improving the model's performance on the training distribution?"
  *   **Follow-up:** If she suggests 'better data' or 'more diverse tasks,' ask how that changes the model's internal optimization target rather than just making the proxy reward harder to game *competently*.

  **10. Falsifiability**
  "Finally, to close: what specific, concrete observation in a future model—not a thought experiment, but an empirical result—would count as evidence *against* your view that goal misgeneralization is the central inner alignment risk?"
  *   **Follow-up:** If she suggests a scenario where models fail *incompetently*, press her on whether that would actually rule out GMG, or if it would just suggest the misgeneralized goal hadn't yet generalized to that specific domain.
