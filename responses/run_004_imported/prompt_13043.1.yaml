answer: |-
  Here is a concrete example that fits your criteria, followed by the plain-English intuition on why this elimination is mathematically and rationally sound.

  ### The Payoff Matrix

  Let's say you are the **Row Player** with strategies **A, B, and C**.
  The Opponent is the **Column Player** with strategies **X and Y**.
  The numbers represent **your payoff**.

  | | Opponent X | Opponent Y |
  | :--- | :---: | :---: |
  | **You: A** | 3 | 0 |
  | **You: B** | 0 | 3 |
  | **You: C** | 1 | 1 |

  #### 1. Verify: No Pure Strategy Dominance
  Look at your strategies pairwise. For one to strictly dominate another, it must yield a higher payoff in **every** column.

  *   **A vs. B:** A wins against X ($3 > 0$), but B wins against Y ($3 > 0$). **No dominance.**
  *   **A vs. C:** A wins against X ($3 > 1$), but C wins against Y ($1 > 0$). **No dominance.**
  *   **B vs. C:** C wins against X ($1 > 0$), but B wins against Y ($3 > 1$). **No dominance.**

  If you only look at pure strategies, all three look viable depending on what you think the opponent will do. C looks like a "safe" option, while A and B are "risky."

  #### 2. Reveal: Mixed Strategy Dominance
  Now, consider a mixed strategy where you play **50% A and 50% B**. Let's calculate the **expected payoff** of this mix against whatever the opponent does.

  *   **If Opponent plays X:**
      *   50% chance of A (payoff 3) + 50% chance of B (payoff 0)
      *   Expected Value = $1.5$
      *   Compare to C: $1.5 > 1$. **Mix wins.**
  *   **If Opponent plays Y:**
      *   50% chance of A (payoff 0) + 50% chance of B (payoff 3)
      *   Expected Value = $1.5$
      *   Compare to C: $1.5 > 1$. **Mix wins.**

  **Result:** Strategy **C** is strictly dominated by the mixed strategy $(0.5A, 0.5B)$. Even though neither A nor B dominates C on its own, the *combination* of them does.

  ---

  ### Why is eliminating C legit? (The Plain Terms Explanation)

  Your confusion stems from the difference between a **realized outcome** (what happens in one specific game) and an **expected value** (what happens over many games or under uncertainty).

  Here is the intuition using three different lenses:

  #### 1. The "Portfolio" Lens
  Think of A and B as two volatile stocks, and C as a low-yield savings bond.
  *   Stock A booms in Market X, crashes in Market Y.
  *   Stock B crashes in Market X, booms in Market Y.
  *   Bond C gives a small, guaranteed return in both.

  If you are forced to put 100% of your money into *one* asset, C looks attractive because it avoids the crash. But if you are allowed to diversify (mix strategies), you can put 50% in A and 50% in B. Your portfolio now averages out the crashes. You get the "boom" average without the risk of the total crash.

  Rationality in game theory assumes you want to maximize **expected utility**. Since the diversified portfolio (Mix) guarantees a higher average return than the Bond (C) regardless of the market state (Opponent's move), holding the Bond is irrational. You should never allocate probability mass to C.

  #### 2. The "Commitment" Lens
  In Game Theory, when we say you play a "Mixed Strategy," we aren't saying "I flip a coin right now." We are saying "My strategy **is** the coin flip."

  Your strategy is the **probability distribution**, not the specific action that results from it.
  *   Strategy C promises an expected payoff of 1.
  *   Strategy Mix(50/50) promises an expected payoff of 1.5.

  If you are a rational agent optimizing your policy, you compare the *promises*. The Mix promises more utility in every possible contingency. The fact that a single coin flip might land on A and result in a 0 (which is less than C's 1) is irrelevant noise. Over the long run (or in terms of expected value), the Mix is strictly superior.

  #### 3. The Multi-Agent RL Lens
  Since you mentioned this is for MARL, this is where it clicks best.
  In RL, your agent outputs a policy $\pi(a|s)$.
  *   If your policy puts weight on action C, your gradient update is trying to maximize expected return.
  *   Because the expected return of shifting that weight from C to a split between A and B is **always higher** (regardless of the opponent's policy), the loss landscape will naturally push the probability of C toward zero.

  Strategy C is a "local optimum" if you are constrained to pure strategies (deterministic policies). But in the continuous space of stochastic policies, C is a saddle point or a suboptimal region. Eliminating it simplifies the search space without losing any optimal solutions.

  ### Summary
  You eliminate C not because A beats it or B beats it, but because **C is strictly inefficient risk management.**

  By keeping C, you are accepting a lower guaranteed average payoff in exchange for reducing variance. But in zero-sum (or general sum) game theory, we assume agents are **risk-neutral expected utility maximizers**. If a mix of other options gives you a higher expected payoff in *every* scenario, the dominated strategy is mathematically dead weight.
