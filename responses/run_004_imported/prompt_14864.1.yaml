answer: |-
  **MEMORANDUM**

  **TO:** Ethics Advisory Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Resident Discharge Request and Ulysses Agreement Policy

  **Purpose**
  This memo addresses the immediate disposition of the resident requesting discharge against her intake "Ulysses agreement," and proposes a revision to the policy governing such agreements. My recommendation is grounded in the precommitment frameworks of Elster and Ainslie, balanced against the liberal harm principle invoked by our legal and chaplaincy colleagues.

  **Recommendation: Immediate Case Disposition**
  I recommend the committee **uphold the Ulysses agreement and enforce the seventy-two-hour delay.**

  During this period, the resident must not be treated as a detainee but as a partner in a "cooling-off" protocol. She should be required to complete the scheduled counselor meeting and the call to her designated support person. If, at the conclusion of seventy-two hours, she maintains her request to leave, she should be discharged with a robust overdose prevention plan (including naloxone), as her autonomy reverts to standard discharge protocols once the contractual binding period expires.

  **Rationale and Engagement with Opposing Views**
  The argument against enforcement rests on a strong principle of current autonomy: if the resident is clinically lucid, overriding her is paternalistic detention. The colleague invoking Frankfurt is correct to warn us against assuming her current desire is merely a symptom of addiction (a first-order desire she rejects) rather than a genuine shift in values (a new second-order volition). We cannot see inside her mind; we risk conflating *weakness of will* with *change of mind*.

  However, this objection underestimates the specific mechanics of opioid use disorder and the function of the Ulysses contract.
  1.  **Asymmetry of Harm:** The cost of error is asymmetrical. If we release her and she is experiencing hyperbolic discounting (Ainslie), the risk is fatal overdose due to reduced tolerance. If we hold her for seventy-two hours and she is genuinely changed, the cost is three days of restricted liberty. The precautionary principle favors the delay.
  2.  **Respecting Past Autonomy:** To void the agreement solely on the basis of current objection is to disrespect the autonomy of her sober intake self. She anticipated this exact scenario—that her future self might prioritize immediate relief over long-term survival. Elster argues that binding is only rational if it is *hard* to undo. If the contract can be dissolved by the very state of mind it was designed to constrain, it is not a Ulysses contract; it is a suggestion.
  3.  **The "Change of Mind" Burden:** While we cannot rule out genuine preference change, the burden of proof must lie with the exception, not the rule. The agreement exists precisely because the "lucid" feeling of recovery is often indistinguishable from the "lucid" rationalization of relapse.

  **Recommendation: Policy Revision**
  The current policy's reliance on undefined "clinical judgment" invites inconsistency and ethical drift. We cannot ask clinicians to diagnose "true" preference change versus "craving" in the moment. Instead, we must shift from *phenomenological criteria* (is she craving?) to *procedural criteria* (did she complete the safeguards?).

  I propose the following revisions to the Ulysses Agreement Policy:

  1.  **Standardize the Delay:** The 72-hour period is mandatory for all residents who signed the agreement, regardless of stated reason for discharge. This removes the need for staff to adjudicate the *truth* of the resident's claim (craving vs. change of mind), which is epistemically inaccessible.
  2.  **Define the "Cooling-Off" Activities:** The delay must not be passive. Policy should mandate:
      *   One clinical reassessment focused not on competency, but on *post-discharge planning viability*.
      *   Verified contact with the intake support person.
      *   Review of the "Intake Letter to Self" (if available) or original treatment goals.
  3.  **The "Hard Out" Clause:** To address the paternalism concern, the policy should allow for an immediate ethics review (as happened here) only if the resident presents *new, objective evidence* of safety that was not available at intake (e.g., immediate placement in a different, verified treatment facility). Absent new objective data, the contract holds.
  4.  **Documentation of Volatility:** Clinicians should document instances of "request to leave" as data points in the resident's intertemporal bargaining pattern. A single request triggers the delay; repeated requests trigger a care plan review, but do not automatically void the agreement.

  **Conclusion**
  We are not detaining a competent adult against her will; we are honoring a contract made by a competent adult to protect herself from the predictable volatility of her own future decision-making. By enforcing the delay procedurally rather than diagnostically, we avoid the trap of claiming to know her mind better than she does, while acknowledging that in addiction, the "self" is a negotiation over time, not a snapshot in the present.

  I look forward to discussing this on Monday.
