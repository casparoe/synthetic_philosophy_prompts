      *   *Check:* Is the distinction between "liability" and "desert" clear? Liability might be transferable (like a tax), but desert (moral blame) is not. I need to emphasize *retributive* desert.
      *   *Check:* Is the tone appropriate? Yes, rigorous, analytical, respectful but firm.
      *   *Nuance:* Acknowledge that *satisfaction* theories (Anselm) might work differently, but stick to *Penal* Substitution (Lewis's focus).
      *   *Key Concept:* The "Essential Indexicality" of Desert. "I deserve this" cannot become "He deserves this for me."

  6.  **Final Review against constraints:**
      *   Rigorous argument? Yes.
      *   Grant strongest form first? Yes (Section 1).
      *   Show where/why it gives out? Yes (Section 2 & 3).
      *   Address specific repairs (consent, authority, etc.)? Yes.

  7.  **Drafting the Content:** (Mental or scratchpad)
      *   *Intro:* Lewis's challenge is standard. I go further.
      *   *Steelman:* Imagine a legal fine. I can pay your fine. God is the judge. Christ volunteers.
      *   *Break:* A fine is a debt. Prison time is different. Why? Because prison is about *you*.
      *   *Deep Dive:* Desert is a relational property between Act and Agent. You can't swap the Agent.
      *   *Repairs:* Consent changes the moral quality of the act (from punishment to sacrifice). Authority can't change logical truths.
      *   *Conclusion:* The doctrine is not just hard to understand; it's category-error ridden.

