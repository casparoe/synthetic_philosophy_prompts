answer: |-
  **The Algebraic Mirage: Why Harsanyi's Aggregation Theorem Is Math, Not Morals**

  In the landscape of normative economics and moral philosophy, few results are cited with as much reverent confidence as John Harsanyi's 1955 Aggregation Theorem. It promises a philosopher's stone: a derivation of utilitarianism from the thin, supposedly non-moral premises of rational choice theory. The argument appears devastatingly clean. If individuals satisfy the von Neumann-Morgenstern (vNM) axioms of rationality, and if society satisfies those same axioms plus a Pareto condition, then the social welfare function must be a weighted sum of individual utilities. For decades, this has been wielded as a knockdown argument against deontological or egalitarian rivals: if you want to be rational and respectful of individual preferences, you *must* be a utilitarian.

  This confidence is misplaced. Harsanyi's theorem is a rigorous piece of mathematics, but it is a philosophical failure. It does not provide a foundation for utilitarianism; it merely formalizes the internal consistency requirements of a specific type of welfarism. By masking substantive ethical commitments—specifically regarding interpersonal comparability and the moral relevance of risk—behind the neutral language of affine transformations and Pareto efficiency, the theorem creates an algebraic mirage. It claims to solve the problem of aggregation, but it actually assumes the solution in its premises. Harsanyi's theorem is not a proof of utilitarianism; it is a consistency check for those who are already utilitarians, and it is woefully oversold as a foundational ethical argument.

  The core of the overreach lies in the problem of interpersonal comparability, a critique most famously articulated by Amartya Sen. Harsanyi's result relies on the vNM utility representation, which is unique only up to positive affine transformations. For any individual $i$, their utility function $U_i$ can be transformed into $U_i' = aU_i + b$ (where $a > 0$) without altering their preference ordering over lotteries. This is standard decision theory. However, when Harsanyi aggregates these into a social function $W = \sum a_i U_i$, the weights $a_i$ become mathematically hostage to the arbitrary choice of scale and zero-point for each individual.

  To see why this destroys the theorem's ethical force, consider two individuals, Alice and Bob. If we measure Alice's utility in "hedons" and Bob's in "decahedons," the aggregation will systematically favor Bob unless we normalize the scales. Harsanyi attempts to bypass this via the "impartial observer" device, suggesting that an observer behind a veil of ignorance would choose the same scaling for everyone. But this is a sleight of hand. The vNM axioms govern consistency within a single preference ordering; they say nothing about the *intensity* of preferences across persons. There is no mathematical operation within the theorem that forces $a_i = a_j$ (classical utilitarianism). The weights remain ethically arbitrary.

  Consequently, the theorem does not derive utilitarianism; it derives *weighted* utilitarianism where the weights are undetermined by the math. To fix the weights, one must import an external ethical metric—perhaps a claim about equal moral worth or comparable capacities for suffering. But once you import that metric, you have done the ethical work *before* applying the theorem. The math becomes redundant. If you need an independent ethical theory to set the weights $a_i$, then Harsanyi has not derived utilitarianism from rationality; he has shown that *if* you accept a specific welfarist structure and *if* you have an independent theory of comparability, *then* your aggregation must be additive. That is a conditional constraint, not a foundational justification. It tells a utilitarian how to calculate, but it gives no reason to be a utilitarian in the first place.

  Even if one grants the comparability assumption, the theorem collapses under the weight of John Diamond's 1967 critique regarding ex-ante versus ex-post fairness. Harsanyi's theorem requires the satisfaction of the Ex-Ante Pareto principle: if every individual prefers lottery $L$ to lottery $L'$, society must prefer $L$ to $L'$. This seems intuitive until we consider cases where preferences are driven by risk allocation rather than expected outcome.

  Diamond's famous example involves a single indivisible good (say, a life-saving kidney) and two patients in identical medical need. Ex-post, only one can live. A utilitarian calculation based on expected utility (Ex-Ante) might suggest flipping a coin gives each a 0.5 probability of survival, maximizing expected utility if they are risk-neutral. However, Diamond points out that the Ex-Ante Pareto principle forces us to respect the individuals' preferences over the lotteries. If both patients prefer a deterministic allocation (perhaps based on a priority rule like "sickest first") over a coin flip, Harsanyi's framework demands we respect that. But more damningly, if the patients are indifferent between the outcomes but care about the *fairness of the procedure*, Harsanyi's framework struggles.

  The deeper issue is that Harsanyi's theorem treats society as a "super-individual" satisfying vNM axioms. But society is not a person. An individual rational agent can trade off their own future well-being across states of the world. Society cannot trade off Alice's well-being against Bob's in the same way without making a moral judgment. By imposing the vNM axioms on society, Harsanyi builds in a commitment to risk-neutrality at the social level. This rules out egalitarian concerns about the distribution of welfare *after* the uncertainty is resolved (ex-post).

  If we care about the fairness of the outcome—not just the expected utility—we might prefer a coin flip (equal ex-post chance) even if it slightly lowers aggregate expected utility, or we might prioritize the worst-off in a way that violates the linearity required by the theorem. Harsanyi's theorem rules these positions out by fiat, labeling them "irrational" because they violate the Independence Axiom at the social level. But this is not a discovery of rationality; it is a definition. To define social rationality as adherence to vNM axioms is to assume the conclusion that distributional fairness (beyond weighted sums) is morally irrelevant. Diamond shows that the Ex-Ante Pareto principle, essential to Harsanyi's proof, conflicts with the intuition that fairness is a property of the actual allocation of resources, not just the probabilities leading up to it. By siding with Ex-Ante Pareto, Harsanyi isn't proving utilitarianism; he is stipulating that only expected outcomes matter.

  Defenders of Harsanyi, such as John Weymark, have attempted to salvage the theorem by generalizing the axioms or relaxing the comparability requirements. Weymark correctly identifies that Harsanyi's original proof relies on cardinal unit comparability. However, these refinements only underscore the original failure. Weymark's "generalized utilitarianism" explicitly acknowledges that the weights are parameters to be fixed by ethical theory, not mathematical derivation. This concession admits that the theorem is not a justification for utilitarianism, but a representation theorem for a specific class of social welfare functions. It clarifies the structure of the view, but it does not defend the view against a Rawlsian maximin rule or a sufficientarian threshold, both of which can be argued to be "rational" if one rejects the vNM axioms for social choice.

  The persistence of Harsanyi's theorem as a purported proof of utilitarianism stems from a category error. It confuses *coherence* with *truth*. The theorem demonstrates that utilitarianism is coherent with a specific model of rational choice under uncertainty. It shows that if you accept the premises (welfarism, vNM rationality for society, Ex-Ante Pareto), you cannot consistently reject the additive conclusion. But in ethics, the burden of proof lies in the premises, not the deduction. The hard work of moral philosophy is arguing why we should treat social choice as a vNM rational agent, or why we should accept Ex-Ante Pareto when it conflicts with ex-post equity. Harsanyi's math bypasses this work. It offers the comfort of a formula where there should be a debate.

  Ultimately, Harsanyi's Aggregation Theorem is a neat piece of math that has been way oversold as ethics. It provides a rigorous internal logic for weighted utilitarianism, but it fails to bridge the gap between individual rationality and social morality. It assumes interpersonal comparability rather than solving it, and it assumes the moral irrelevance of distributional fairness via the Ex-Ante Pareto condition. To use it as a foundation for utilitarianism is to build a house on a floor that is already painted to look like a foundation. For a dissertation on social choice, the theorem should be treated not as a justification for welfarism, but as a boundary marker: it shows exactly what you must give up (fairness of procedure, skepticism of cardinal comparability) if you wish to maintain the additive structure of classical social choice. It is a constraint on theory, not a generator of truth.
