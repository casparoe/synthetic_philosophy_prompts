      *   By calling it "fear," Plato emphasizes that virtue requires an emotional component, not just dry calculation. You must *feel* afraid of doing wrong, not just *know* it is wrong.
      *   So, mapping "greatest fear" to reverence is doing work: it emotionalizes morality. It makes shame a protective passion.

  5.  **Synthesize the "Rationalist" Lens:**
