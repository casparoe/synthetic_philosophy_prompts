  ### A Note for the TA (You)

  Since you mentioned you're learning this as you go, here is the "cheat sheet" distinction for Part (c) so you can handle student inquiries:

  1.  **The "Same Phenomenon" Intuition:** It feels like they are the same because they both use "stakes" to explain why "I know" sounds weird in the High-Stakes case.
  2.  **The Divergence (The "Third-Party" Test):** Imagine Hannah is in **High Stakes**, but *you* (the speaker) are in **Low Stakes** talking about her.
      *   **Contextualist:** Your context determines the truth. Since you are low-stakes, the standard is low. You can truthfully say, "Hannah knows."
      *   **Encroachment (SSI):** Hannah's stakes determine the truth. Since she is high-stakes, the standard is high. You must say, "Hannah does *not* know."
  3.  **Why it matters:** Because they give different answers in that specific scenario, they aren't just "different vocabularies." They are making different claims about how the word "know" functions.

  **Regarding the DeRose Error:** This is the easiest point to defend if the student pushes back. DeRose's *The Assertability Condition...* is the seminal text for Contextualism. Stanley's *Knowledge and Practical Interests* is the text for Encroachment. Mixing them up is like mixing up Rawls and Nozick in a political philosophy course.

  Good luck with the rest of the stack! Your personal experience with the bank case actually puts you in a great position to empathize with why these distinctions feel subtle, even if the technical details matter for grading.
