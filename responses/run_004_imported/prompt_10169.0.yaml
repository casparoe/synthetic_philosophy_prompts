          *   *Refinement:* Your view violates the principle that you ought to believe what you think you ought to believe. Why reject this intuitive norm?
          *   *Follow-up:* If she says "the principle is too strong," ask for the replacement norm.

  4.  **Review and Refine:**
      *   Check against constraints: 8-9 questions? Yes. Follow-ups included? Yes. Specific topics covered (Case, Conspiracy, Regress, Credences)? Yes.
