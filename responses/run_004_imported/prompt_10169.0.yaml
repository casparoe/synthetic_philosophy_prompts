      *   **Guest's View (The "Hard Line"):** Akrasia *can* be rational. You don't have to let HOE infect the first-order belief.
      *   **Key Tension:** How do you maintain $P$ is true while admitting your grip on $P$ is shaky? Isn't that Moore-paradoxical ("$P$, but I have no reason to think $P$")?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: The Case Study (Drunk/Drug).*
          *   *Idea:* Use the user's beer story.
