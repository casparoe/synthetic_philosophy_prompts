          *   *Refinement:* Make it sharper. Focus on the *split* between the first-order claim (I won the argument) and the higher-order claim (I was drunk).
          *   *Follow-up:* If she says "feelings aren't evidence," push on what *does* justify the belief if the reasoning is bracketed.

      *   *Requirement 2: The "Free Pass" (Conspiracy/Motivated Reasoning).*
          *   *Idea:* If I can ignore evidence I'm biased, couldn't a conspiracy theorist do the same?
          *   *Draft:* Doesn't this help conspiracy theorists? They think everyone else is biased.
          *   *Refinement:* Frame it as the "Self-Exemption" problem. If HOE doesn't force belief revision, what stops a paranoid person from dismissing evidence of their paranoia as "part of the plot"?
          *   *Follow-up:* If she says "there are limits," ask where the line is drawn without begging the question.

      *   *Requirement 3: The Regress Problem.*
          *   *Idea:* If HOE undermines belief, does evidence about HOE undermine that?
          *   *Draft:* What about third-order evidence? Does it stop?
          *   *Refinement:* Focus on the *stopping point*. If I can be akratic at level 1, why not level 2? If the regress stops, why there?
          *   *Follow-up:* If she says "it stops at reliability," ask why reliability is immune to the same akratic permission.

      *   *Requirement 4: Credences/Degrees of Belief.*
          *   *Idea:* Belief is binary, confidence is not. 90% sure vs 90% sure I shouldn't be.
          *   *Draft:* What about probabilities? It seems weirder to have split credences.
          *   *Refinement:* Use the "split-level credence" formulation. 0.9 in $P$, 0.9 that my evidence supports 0.5. Is that coherent?
          *   *Follow-up:* If she says "credences aren't the whole story," ask what normative work they are doing if not guiding action.

      *   *Requirement 5: Action Guidance.*
