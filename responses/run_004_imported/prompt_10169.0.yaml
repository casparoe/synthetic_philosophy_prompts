          *   *Refinement:* Connect HOE to peer disagreement. If a peer says "you're impaired," is that HOE? If I ignore it, am I being akratic?
          *   *Follow-up:* If she says "peers matter," ask how to weigh peer testimony against internal seeming.

      *   *Requirement 8: The "Good Case" vs. "Bad Case".*
          *   *Idea:* Does this only work if I'm actually right?
          *   *Draft:* Does it matter if I was actually right?
          *   *Refinement:* Externalism vs. Internalism. If I'm drunk but right, is it rational? If I'm drunk and wrong, is it rational?
          *   *Follow-up:* If it depends on truth, isn't that just luck?

      *   *Requirement 9: The "Enkratic Principle" specifically.*
          *   *Idea:* Address the principle the housemate mentioned.
