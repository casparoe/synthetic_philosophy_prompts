      *   **The Löbian Obstacle:** Basically, a system $T$ cannot prove that $T$ is sound (or that a successor $T'$ using the same axioms is sound) without becoming inconsistent (via Löb's theorem). This blocks infinite self-modification chains where each step verifies the next.

      *   **1. Parametric Polymorphism (Yudkowsky-Herreshoff):**
          *   *Idea:* Use a parameter $k$ in the axiom schema. Agent $A_k$ trusts $A_{k-1}$. This avoids Löb because the axioms aren't identical; they shift.
          *   *Pros:* Mathematically rigorous, solves the specific "tiling agents" problem formally.
          *   *Cons:* It's essentially a countdown. You run out of $k$. It doesn't allow *infinite* self-modification with constant trust. It kicks the can down the road.
          *   *Verdict:* Good formal model, but fails the "infinite horizon" requirement for a truly general agent. It's a workaround, not a full fix.

      *   **2. Graded self-trust via proof-length hierarchies:**
          *   *Idea:* Trust proofs only up to a certain length, or use ordinal notations.
          *   *Pros:* Connects to consistency proofs via ordinal analysis.
          *   *Cons:* Still hits limits. You need a stronger meta-system to justify the hierarchy. Often collapses back into something like the parametric approach or requires external justification.
          *   *Verdict:* Less developed than parametric polymorphism for agency specifically. Often implies diminishing trust or external anchors.

      *   **3. Christiano-style probabilistic reflection (Reflective Probabilistic Logic):**
          *   *Idea:* Instead of proving soundness, assign probability 1 (or near 1) to your own soundness statements without inconsistency. Paul Christiano's work on probabilistic self-reference.
          *   *Pros:* Avoids Löb because Löb applies to *provability*, not probabilistic belief (if done right). Allows a form of stable self-trust.
          *   *Cons:* Technical coherence issues (can you really have a coherent probability distribution over sentences including its own coherence?). Recent work suggests significant hurdles in making this fully robust for decision theory.
          *   *Verdict:* Very promising conceptually for bypassing the strict binary of provability, but technical stability is still an open research area.

      *   **4. Reflective Oracles:**
          *   *Idea:* An oracle that answers queries about probabilistic Turing machines, including those querying the oracle. Fixed-point solution.
          *   *Pros:* Solves the self-reference problem in game theory and decision theory contexts (e.g., robust cooperation). Handles the "who simulates whom" issue.
          *   *Cons:* It's an oracle. It assumes access to a magical black box that solves the halting problem probabilistically. It doesn't explain how a *bounded* agent constructs this internally. It externalizes the problem.
          *   *Verdict:* Powerful tool for modeling, but less of a "fix" for bounded agents and more of a "assume you have this" abstraction.

      *   **5. Logical Induction:**
          *   *Idea:* A market-based algorithm that learns to assign probabilities to logical sentences, satisfying a weak form of self-trust over time (asymptotically).
          *   *Pros:* Actually constructible (computable approximation). Handles self-reference well asymptotically. Doesn't require infinite proof power.
