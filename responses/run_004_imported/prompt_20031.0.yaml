answer: |-
  **Setting:** *The hallway outside the lecture hall. The crowd has thinned, but the air still hums with the friction of the seminar. Elena (Entitlement) leans against a pillar; Marcus (Quasi-Fideism) is packing his satchel.*

  **Exchange 1**
  **Marcus:** Moore's hand proof died in there, Elena. You can't derive certainty from a premise that requires the very certainty it tries to prove.
  **Elena:** It didn't die; it was misdiagnosed. Moore wasn't claiming knowledge; he was displaying a hinge. We don't know hinges, Marcus; we are *entitled* to them.

  **Exchange 2**
  **Marcus:** "Entitlement." That's the Wrightian move, isn't it? It sounds like a normative warrant, but strip the jargon away and it's just groundlessness with a flattering name.
  **Elena:** It's not groundlessness; it's structural. Without a default trust that the world exists, inquiry paralyzes. Entitlement is the rational permission to avoid that paralysis.

  **Exchange 3**
  **Marcus:** Avoiding paralysis is pragmatic, not epistemic. Calling it "rational" stretches the concept until it snaps. Hinges are arational; they're closer to animal trust than reasoned belief.
  **Elena:** If they're merely animal, you lose the ability to criticize. If a hinge is just a psychological fact about what you trust, then the conspiracy theorist's hinge is as valid as ours.

  **Exchange 4**
  **Marcus:** We criticize the conspiracy theorist on coherence, not the hinge itself. Their web of belief contradicts itself; ours holds together. We don't need epistemic warrant for the bedrock to judge the house built on it.
  **Elena:** Coherence within a mad system is possible. A paranoid delusion can be perfectly coherent. To say their starting point is *epistemically* defective, you need a norm that reaches the hinge.

  **Exchange 5**
  **Marcus:** But that norm would require evidence, and you've already conceded hinges have no evidence. You're trying to smuggle justification in through the back door of "entitlement."
  **Elena:** Not evidence, but a right. We have a default right to trust our cognitive faculties unless given a specific defeater. It's not circular; it's the condition for any circle to exist.

  **Exchange 6**
  **Marcus:** A default isn't a right; it's a fact about how we're wired. Calling it a "right" obscures the leap of faith involved. We don't choose the hinge; we find ourselves already committed.
  **Elena:** And finding ourselves committed doesn't make the commitment blind. If we have no choice, rationality demands we treat that necessity as a warrant. Otherwise, reason rests on nothing.
  **Marcus:** Reason rests on action, Elena. Not on a warrant, but on the fact that we keep going.
  **Elena:** We keep going *because* we take ourselves to be in the right.
  **Marcus:** Or because we're animals who can't help it.
  **Elena:** Then philosophy is just biology.
  **Marcus:** Maybe it's finally honest.
