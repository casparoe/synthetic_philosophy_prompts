      *   *Stakes:* Life-and-death makes the prediction sharper (rancher looks harder), but the logic holds for reputation. If you renege, you become a "non-payer" type.
      *   *Nuance:* In one-off anonymous interactions (like the hitchhiker might have been if not for the rancher's scrutiny), defection is tempting. In freelance, the "shadow of the future" is stronger.
      *   *Conclusion:* It generalizes, but the mechanism shifts slightly from "prediction of character" to "reputation tracking." However, the core logic (dispositional rationality) remains vital for trust-based economies.

  7.  **Drafting the Response:**
