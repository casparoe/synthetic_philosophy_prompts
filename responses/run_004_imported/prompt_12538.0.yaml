      *   *Check:* Make sure not to conflate EDT and TDT too much, but keep it accessible. TDT is probably the best fit for Newcomb/Hitchhiker.
      *   *Check:* Ensure the freelance analogy doesn't break down. In freelance, there *are* legal/contractual norms usually, but the user specified "cannot be legally compelled." So it's purely trust-based.
