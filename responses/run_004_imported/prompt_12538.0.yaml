  9.  **Final Polish:** Check against the user's specific prompts to ensure all are answered. (Yes: Newcomb link, Act vs. Disposition, Resolute Choice, Freelance generalization).

  **(Self-Correction Note):** I need to be careful with the term "Rational Irrationality." Sometimes this is associated with Jon Elster (Ulysses and the Sirens) regarding pre-commitment. Parfit uses it in the context of Self-Defeating Theories. I should stick close to Parfit's usage in *Reasons and Persons* regarding the Self-Interest Theory (S) being indirectly self-defeating. The core idea: S tells you to cultivate a disposition that sometimes violates S to achieve S's goals.

