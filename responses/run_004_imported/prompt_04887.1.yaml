answer: |-
  Here is a script of 10 interview questions designed to move the conversation from exposition to critical pressure. I have included brief "Host Notes" for each to help you understand the strategic goal, so you know where to steer the conversation if she wanders.

  The three specific requirements (Concrete Case, Sider/Magnetism, Bootstrapping) are marked, along with their anticipated follow-ups.

  ### 1. The Motivation
  "Let's start with the stakes. A lot of listeners might hear 'quantifier variance' and think, 'Okay, philosophers are just arguing about dictionary definitions.' But you argue this dissolves actual metaphysical problems. What is the positive gain here? If we accept your view, what becomes of ontology that wouldn't be possible if we were all hardline realists?"

  > **Host Note:** *This prevents her from spending the first 10 minutes just defining the view. It forces her to justify the utility of the theory immediately.*

  ### 2. [REQUIRED] The Concrete Case: Statue and Lump
  "I want to cash this out on a specific puzzle. Take the classic case of the statue and the lump of clay. The realist says they are two distinct objects occupying the same space because they have different persistence conditions. You say this is a verbal dispute about what 'object' means. But if I'm a sculptor, and I smash the statue, the lump survives. Doesn't that physical difference suggest there really are two things there, regardless of how we define our words?"

  > **Host Note:** *She will likely say the "smashing" is just a change in description. This sets up the follow-up.*

  ### 3. [REQUIRED] Follow-up to Concrete Case
  "Okay, but let's push on that. If I put that statue on a scale, does it weigh the same as the lump? If the answer is yes, we have one physical mass. If the answer is no, we have magic. If it's just one mass, isn't positing a second 'object' ontologically expensive in a way that violates parsimony? How do you get around the charge that you're allowing an explosion of invisible objects just to save ordinary language?"

  > **Host Note:** *The Dodge:* She will likely argue that "weighing" is also language-relative. *The Point:* Force her to admit if physics gets a veto power over ontology, her variance has limits.

  ### 4. Ordinary Language vs. Scientific Language
  "You rely heavily on 'charity' toward ordinary speakers—the idea that we shouldn't say common sense is wrong about tables existing. But science constantly tells us common sense is wrong: the sun doesn't rise, solid things are mostly empty space. Why is ontology the one place where folk intuition gets a veto over the scientific image of the world?"

  > **Host Note:** *This isolates her reliance on "folk ontology" and asks why metaphysics should be insulated from scientific revision.*

  ### 5. [REQUIRED] Sider and Reference Magnetism
  "Ted Sider has argued against you using 'reference magnetism.' The idea is that some ways of carving up the world are more 'natural' than others, and our words latch onto those natural joints. Even if ordinary speakers converge on stable usage of the word 'exists,' isn't that stability itself evidence that they are tracking a real, objective feature of reality? Why isn't convergence a sign of magnetism rather than just social agreement?"

  > **Host Note:** *This brings in the heavyweight objection from the *Metametaphysics* volume without getting bogged down in jargon.*

  ### 6. [REQUIRED] Follow-up to Sider
  "Let's press that. If science works, it's arguably because our terms successfully latch onto real structures in nature. If the quantifier is just 'variable' and doesn't carve at the joints, how do you explain the success of physics? Are you suggesting that when a physicist says 'there exists an electron,' the 'exists' part is doing less work than the 'electron' part?"

  > **Host Note:** *The Dodge:* She will likely separate "conceptual schemes" from "empirical prediction." *The Point:* Make her explain how a "verbal" quantifier interacts with empirical success.

  ### 7. [REQUIRED] The Bootstrapping Worry
  "I want to ask about the vantage point you're speaking from. To say a dispute is 'merely verbal' is itself a substantive claim. But if every quantifier is relative to a conceptual scheme, what language are *you* using to make that claim? Aren't you begging the question against the realist by assuming your 'variance-friendly' quantifier is the neutral one used to judge them?"

  > **Host Note:** *This is the self-referential consistency trap. It asks how she escapes the circle of her own theory.*

  ### 8. [REQUIRED] Follow-up to Bootstrapping
  "Right, because if the realist says, 'No, my quantifier is the joint-carving one,' and you say, 'No, that's just your language,' you need a meta-language to settle that. Do you have a 'super-quantifier' that lets you compare languages without picking a side? Or do you have to admit your thesis is only true-relative-to-your-own-deflationary-scheme?"

  > **Host Note:** *The Dodge:* She may claim she is doing "conceptual analysis" not metaphysics. *The Point:* Force her to categorize the epistemic status of her own book.*

  ### 9. The Physics Connection
  "Speaking of physics, mereology gets very weird in quantum mechanics—entanglement suggests the whole is prior to the parts. Does your view accommodate a world where composition is brute and fundamental, or does quantifier variance presuppose a classical, object-oriented worldview that physics is currently undermining?"

  > **Host Note:** *Since you write about science, this is your home turf. It tests if her view is compatible with modern physics or just 20th-century analytic philosophy.*

  ### 10. [REQUIRED] The Closer: Substantive Disputes
  "Here's the question I care about most. If so many classic debates are verbal, what does a *genuinely* substantive, non-verbal metaphysical dispute look like by your lights? Is there any question about reality left that can't be dissolved into a choice of language? I'm trying to figure out if 'it's merely verbal' is a philosophical discovery for you, or just a move you play whenever a debate gets uncomfortable."

  > **Host Note:** *This is the killer closer. It asks for the boundary condition of her theory. If she can't name a substantive dispute, her theory might be nihilistic. If she can, she has to explain why ontology is special.*
