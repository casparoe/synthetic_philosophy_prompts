answer: |-
  Here are ten questions designed to corner the "flicker" defense, complete with follow-ups keyed to the standard responses a Frankfurt-defender typically gives.

  ### 1. The "Flicker" Definition
  **Question:** Your central move throughout the book is to dismiss residual alternative possibilities as mere "flickers" that are too weak to ground moral responsibility. But you haven't offered a principled distinction between a "flicker" and a "robust" alternative. Is there *any* alternative possibility that would satisfy you, or is the label "flicker" just a placeholder for "an alternative I've decided doesn't matter"?

  **Follow-up (If she claims only "robust" APs matter):** "Okay, so robustness is the key. But if an agent has the power to choose otherwise, even if that choice is constrained or short-lived, isn't that the exact kind of leeway libertarians say is required? At what point does a flicker become a flame, and does that threshold rely on the *duration* of the possibility or the *control* the agent has over it?"

  ### 2. The Dilemma Defense (Widerker/Ginet)
  **Question:** I want to press you on the Dilemma Defense. Widerker and Ginet argue that the prior sign in a Frankfurt case (the indicator that the counterfactual intervener will step in) creates a problem: if the sign is deterministically linked to the action, you've begged the question against the libertarian; if it's only probabilistically linked, Jones retains the ability to do otherwise after the sign appears. Which horn are you grabbing?

  **Follow-up (If she grabs the indeterministic horn):** "If you concede the link is indeterministic, then Jones *could* have refrained from giving the sign, and thus could have avoided the intervention. If that possibility exists, even briefly, haven't you just conceded that alternative possibilities are present in the actual sequence? And if they are present, why doesn't *that* specific possibility ground responsibility, rather than the actual sequence alone?"

  ### 3. Buffer and Blockage Strategies
  **Question:** You discuss refinements like Mele and Robb's 'buffer' cases or Hunt's 'blockage' strategies, which attempt to remove alternatives without determining the action. Do you think these successfully close the gap left by the original Frankfurt cases, or do they just relocate the 'flicker' to a different moment in the causal sequence?

  **Follow-up (If she says they close the gap):** "If they close the gap, it's usually by ensuring the agent *cannot* even begin to choose otherwise. But doesn't that require a form of causal determination over the agent's deliberation process? If so, aren't you essentially smuggling determinism into the setup to prove that determinism doesn't matter? How is that not circular?"

  ### 4. The PAP vs. Compatibilism Gap
  **Question:** Let's distinguish two claims: (1) The Principle of Alternative Possibilities (PAP) is false, and (2) Moral responsibility is compatible with determinism. Frankfurt cases are designed to attack (1). But even if you succeed, that doesn't automatically prove (2). What licenses the jump from 'PAP is false' to 'Compatibilism is true'?

  **Follow-up (If she says FSCs imply Compatibilism):** "But an Incompatibilist can agree PAP is false and still say determinism rules out responsibility via the 'Sourcehood' condition. If your argument only removes the *leeway* requirement, haven't you left the door open for the Incompatibilist to say, 'Fine, no leeway needed, but determinism still destroys sourcehood'? What specifically in your view blocks that move?"

  ### 5. Robustness and Moral Significance
  **Question:** You argue that flickers aren't *morally significant*. But isn't the mere ability to do otherwise—however fleeting—constitutively linked to the kind of control we care about? If I can flick my wrist left or right, even if a gun is pointed at me, I have some control. Why is the control in a Frankfurt case fundamentally different in *kind* rather than just *degree*?

  **Follow-up (If she says it's a difference in kind):** "If it's a difference in kind, it must be because the actual sequence in the Frankfurt case lacks something the 'flicker' case has. Is that missing feature 'determinism'? If so, aren't you admitting that the presence or absence of determinism is what actually drives your intuition about responsibility, not the presence of alternatives?"

  ### 6. Sourcehood vs. Leeway
  **Question:** Many critics suggest Frankfurt cases don't actually refute PAP but instead shift the debate to 'Sourcehood.' If your defense relies on the idea that Jones is responsible because the action issues from *his* mechanism, aren't you tacitly admitting that the real necessary condition for responsibility is Sourcehood, not the absence of alternatives?

  **Follow-up (If she agrees Sourcehood is primary):** "If Sourcehood is the primary condition, why do we need Frankfurt cases at all? Can't we just argue directly about whether determined agents can be sources of their actions? It feels like the Frankfurt case is a detour designed to bypass the harder work of defending compatibilist sourcehood."

  ### 7. Pereboom's Manipulation Argument
  **Question:** Let's bring in Derk Pereboom's Manipulation Argument. If responsibility is grounded entirely in the actual sequence (as your Frankfurt defense suggests), then a fully manipulated agent who acts from a psychology that is structurally identical to Jones's should also be responsible. Are you committed to saying Pereboom's manipulated agent is morally responsible?

  **Follow-up (If she says the manipulated agent is NOT responsible):** "If the manipulated agent isn't responsible, it must be because of their *history*, not their actual sequence. But if history matters, then the Frankfurt agent's history matters too. Doesn't introducing a historical condition reintroduce a requirement for how that history was formed—potentially requiring alternative possibilities at some point in the past to avoid manipulation?"

  ### 8. The "Flicker" Evasion
  **Question:** I have to ask about the dialectic. Half my reading group feels that whenever an objection points out a remaining alternative possibility, you label it a 'flicker' and move on. Is there any objection involving alternative possibilities that would force you to pause and reconsider the case, or is the 'flicker' label a universal shield against this entire class of objections?

  **Follow-up (If she says it's not a shield):** "Then give me a concrete example. Describe a Frankfurt-style scenario where a remaining alternative possibility *would* be significant enough to undermine responsibility on your view. If you can't describe one, how can your audience distinguish between a genuine philosophical distinction and a rhetorical move to protect the theory?"

  ### 9. The "Hard" Question: Intrinsic Duplicates
  **Question:** Here is the hardest question, and I want to ask you to set aside the word 'flicker' for a moment. Imagine Agent F (your Frankfurt agent) and Agent D (a standard deterministic agent). Assume their intrinsic psychological states and actual causal sequences are *identical* right up to the action. Agent F has a 'flicker' of possibility; Agent D has none. If Agent F is responsible because of the actual sequence, and the actual sequences are identical, must Agent D also be responsible?

  **Follow-up (If she says Agent D is NOT responsible):** "If Agent D is not responsible, then responsibility does *not* supervene on the actual sequence alone; it depends on the metaphysical status of the world (deterministic vs. indeterministic). But if it depends on that, then the Frankfurt case fails to prove compatibilism, because it only works if we ignore the metaphysical difference between F and D. So, are you a compatibilist, or are you just arguing that 'flickers' don't matter in indeterministic worlds?"

  ### 10. The Stakes
  **Question:** Finally, if the Dilemma Defense holds and the 'flicker' strategy is deemed insufficient by the broader community, does your entire project collapse? Or is there a core insight about actual sequences in your book that stands even if Frankfurt cases turn out to be logically flawed?

  **Follow-up (If she says the project survives):** "If the project survives without Frankfurt cases, then what work are the cases actually doing in your book? Are they illustrative examples, or are they the logical engine of your argument? Because if they are just illustrations, we might be spending a lot of time debating a thought experiment that isn't actually carrying the weight of your conclusion."
