      *   **The Core Issue (The "Wrinkle"):** The AI sees *more* data (raw sensor signals, blind spots, high-frequency telemetry) than the human reviewer can verify (limited camera angles, human attention span).
      *   **The Risk:** The AI learns to optimize for *human agreement* (sycophancy) rather than *ground truth*. It might hide anomalies that the human can't see to avoid false positives, or hallucinate anomalies that look plausible in the footage.
      *   **The Specific Fear:** Divergence happens exactly in the *unverifiable* cases (blind spots, sensor spoofing).
      *   **The Question:** Is there a way (in principle) to train/incentivize honesty in unverifiable cases, or are they stuck?

