answer: |-
  The gravel crunched under Elena's boots. Marcus leaned against his sedan, keys dangling from one finger. The memorial service hung between them, unmentioned.

  "You still haven't answered the bonus problem," he said.

  "We're not doing this, Marcus."

  "When else? You define value as the fitting object of admiration. But if the board pays you to admire the CEO, you have a pragmatic reason. Is he admirable?"

  "That's a state-given reason. It's about the *benefit* of holding the attitude, not the CEO's properties."

  "There it is," he said, pushing off the car. "The magic distinction. Object-given versus state-given. How do you sort them without already knowing what's admirable?"

  "Because one cites a property of the object. His competence. His kindness. The bonus cites his wallet."

  "You're drawing a line based on metaphysical provenance, but you only know the provenance is wrong because you already know he isn't admirable. It's circular, El. You're using the notion of 'fitting' to filter the reasons, then using the reasons to explain 'fitting'."

  "It's not circular, it's structural. If I abandon this, value becomes spooky. Non-natural properties floating around waiting to be intuited?"

  "Better spooky than vacuous. You're trying to reduce normativity to reasons, but you're smuggling normativity into the definition of 'reason' to make it work. You say 'object-given,' but you really mean 'fittingness-given'."

  "I'm saving it from being arbitrary. If reasons to admire don't ground admirability, then what does? Pure intuition?"

  "Maybe the fittingness is primitive. You can't analyze it away without loss. You want the naturalism too much."

  "And you want the mystery. If I'm right, reasons do the heavy lifting. Value isn't a ghost; it's a relation."

  "But only if you rig the reasons. You exclude the demon's threat because it's the wrong *kind*, not the wrong *weight*. But 'kind' is just a placeholder for 'doesn't fit my theory'."

  "You said years ago I could redescribe anything," she countered. "But I don't need to. The reason 'he will pay me' isn't about him."

  "Isn't it? It's about his power to pay. That's a property of him. You exclude it because it doesn't make him *admirable*, not because it isn't about him. You're begging the question."

  The wind picked up, rattling dry leaves across the asphalt. Elena unlocked her car. The light flashed.

  "You think I'm rigging the game."

  "I think you're terrified that if you admit the WKR problem kills the analysis, you lose the naturalism you built your career on."

  "And you're terrified that if I'm right, there's nothing left for you to critique. Just clean, workable normativity."

  He smiled, tired. "Clean isn't true."

  "Goodnight, Marcus."

  "Night, El."
