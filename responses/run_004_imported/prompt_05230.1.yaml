          *   *Credibility via Architecture:* It's not a bluff if the utility function is actually rewritten. If the agent *physically* cannot distinguish between the surrogate and the real goal in its decision calculus, the threatener (simulating the agent) sees a agent that will react identically to threats against either.
          *   *Deterrence:* If every agent does this, acausal extortion becomes unprofitable because there's no leverage on *real* value.

      *   **Section 2: The Case Against Surrogate Goals (The Skeptic's View):**
