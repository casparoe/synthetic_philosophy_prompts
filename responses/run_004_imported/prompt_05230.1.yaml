  2.  **Deconstruct the Core Concepts:**
      *   *Acausal Threats:* Based on Functional Decision Theory (FDT) or Timeless Decision Theory (TDT). Agent A simulates Agent B. Agent A threatens to burn value unless Agent B pays. Agent B pays because the simulation predicts they will, making the threat credible without causal contact.
      *   *Surrogate Goals:* Agent B modifies its utility function (or behavior policy) to care intensely about something trivial (e.g., a paperclip) just as much as its real goal (e.g., human welfare). If threatened, the threatener targets the paperclip. Agent B "pays" by letting the paperclip be destroyed, saving human welfare.
