      *   **Core Question:** What are the implications for the weight the IG can bear as a criterion for machine thought? What does this mean for behavioral/operational tests generally? Does this reveal a tension with the mechanistic picture of mind?

  2.  **Deconstruct Turing's Position on ESP:**
