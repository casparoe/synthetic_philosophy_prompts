prompt: |-
  I write about science and ideas for a general-interest magazine, and I'm drafting a feature on why people routinely turn down information that is free, relevant to a decision they are already making, and available just for the asking — genetic test results, prognoses, even unopened financial statements during a downturn. The spine of the piece is a result I hadn't encountered before this year: I.J. Good's 1967 theorem on the value of information, which decision theorists treat as close to a proof that this kind of refusal is a mistake. I ran an early draft of the key section past a statistician friend, who confirmed I had the mathematics right but said the philosophical stakes were "above his pay grade" and that I should find a philosopher instead. Below is that section, more or less as it stands. I'd be grateful for a careful read before it goes to my editor, because I'm asking the theorem to do real argumentative work and I don't want to either overstate what it proves or spend six hundred words demolishing a position nobody actually holds.

  I.J. Good spent the Second World War as one of Alan Turing's statisticians at Bletchley Park and much of the rest of his life as a working Bayesian, which perhaps explains why, in 1967, he published three pages that seem to settle a question moral philosophers still argue over as though it were open. What is now called Good's theorem says this: take an expected-utility maximizer with a fixed menu of possible actions and a prior over the states of the world on which their payoffs depend. Offer this person a free, costless glimpse of some piece of evidence before they must choose, on the understanding that they will update by ordinary Bayesian conditionalization and remain free to act however the evidence moves them. Then looking is never worse than not looking, in expectation, and is strictly better unless the evidence could never have changed what they were going to do anyway. You cannot be harmed, by your own lights, by free truth. Good offered the proof as a way of deriving something Carnap's inductive logic had needed to assume outright: that a rational inquirer should always want the total evidence.

  Set that next to a fact from genetic counseling. Direct testing for Huntington's disease has been possible since the gene was located in 1993: a single blood draw tells an at-risk adult, with certainty, whether they will develop a fatal neurodegenerative disease, usually in mid-life, for which there is still no cure and no treatment that delays onset. The test is close enough to free, it is squarely decision-relevant — it bears on whether to have children, what to tell them, how to plan a career or a retirement that may not happen — and it is about as clean as evidence gets. And the great majority of people eligible for it decline, a finding that has held since testing began and that no longer surprises genetic counselors, however much it surprised the clinicians who designed the original protocols expecting high demand.

  There are two ways to describe what the decliners are doing, and the piece I want to write turns on keeping them apart. The first says they are simply wrong: whatever their reasons, they are doing exactly what Good proved a rational agent has no reason to do. The second says they are not violating the theorem at all, because the theorem only ever governs a utility function fixed over the outcomes of one's actions — and for these people, knowing is itself among the outcomes. Twenty years lived under an unresolved coin flip may have a different expected shape, for many people a worse one, than twenty years lived under a definite sentence, quite apart from anything the sentence would let them do differently. Economists who model "anticipatory feelings" formally — Caplin and Leahy's psychological expected-utility theory is the standard reference — take exactly this route, folding beliefs themselves into the utility function so that dread becomes something a rational agent can be maximizing against.

  I find the second story more humane and probably closer to right, but I can't shake the sense that it buys its humanity too cheaply. If any observed refusal of free evidence can be redescribed, after the fact, as evidence of a cost that was there all along, then Good's theorem stops predicting anything: it becomes a piece of bookkeeping rather than a constraint on rational behavior. So the question I want to leave the reader with is not "were the decliners irrational?" but "what would it even take for that question to have a determinate answer" — and I don't yet have one myself.

  What I'd most value from you: first, a check on whether I've stated Good's theorem, and its scope conditions, accurately enough that a decision theorist wouldn't wince. Second, your honest reaction to the closing worry — is the "theorem becomes bookkeeping" problem a real threat to expected-utility theory, a well-worn point I'm dressing up as fresher than it is, or is there a principled way to distinguish legitimately enlarging the outcome space from simply rescuing the theory by fiat? Third, whether Huntington's disease is earning its place as the essay's central case or is too singular a data point to hang an argument on. And finally, the blunter question: does the philosophical payoff in the last two paragraphs justify the technical setup that precedes it, for a reader who is never going to check the math?
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the User and Request:**
      *   **User:** Science/ideas writer for a general-interest magazine.
      *   **Task:** Drafting a feature on why people refuse free, relevant information (genetic tests, financial statements, etc.).
      *   **Core Argument:** Uses I.J. Good's 1967 theorem (value of information) to frame the tension between rational choice theory and human behavior.
      *   **Specific Request:** Feedback on a specific section of the draft.
      *   **Key Questions to Answer:**
          1.  Accuracy of Good's Theorem statement/scope (will a decision theorist wince?).
          2.  Reaction to the "bookkeeping" worry (is it a real threat or old news? Is there a principled distinction?).
          3.  Suitability of Huntington's disease as the central case study.
          4.  Overall payoff vs. technical setup (is it worth it for a lay reader?).

  2.  **Analyze the Draft Text:**
      *   *Paragraph 1:* Introduces I.J. Good, Bletchley Park, Bayesian context. States the theorem: Expected utility maximizer, fixed menu of actions, prior over states, free costless evidence, Bayesian updating. Conclusion: Looking is never worse, strictly better unless evidence doesn't change action. Connects to Carnap's "total evidence."
      *   *Paragraph 2:* Introduces the counter-example: Huntington's disease testing. Free, decision-relevant, clean evidence. Majority decline.
      *   *Paragraph 3:* Two interpretations. 1. They are irrational (violating Good). 2. They aren't violating it because "knowing" is an outcome (utility depends on belief state). Mentions Caplin and Leahy (psychological expected utility).
      *   *Paragraph 4:* The writer's worry. If we always redefine utility to fit behavior, the theorem becomes tautological ("bookkeeping"). Ends with an open question: What makes the question of rationality determinate?

  3.  **Evaluate Question 1: Accuracy of Good's Theorem:**
      *   *Statement:* "Expected-utility maximizer... fixed menu of possible actions... prior... free, costless glimpse... update by ordinary Bayesian conditionalization."
      *   *Verdict:* This is technically accurate. Good's theorem relies on the assumption that the agent *can* change their action based on the signal and that the signal doesn't change the *utility* of the outcomes themselves, only the probability assessments.
      *   *Nuance:* The phrase "fixed menu of possible actions" is crucial. If the act of looking changes the available actions (e.g., looking at a financial statement triggers a panic sell that wasn't an option before), the theorem might need tweaking, but for the purpose of the essay, it's accurate enough.
      *   *Potential Wince Point:* "You cannot be harmed, by your own lights, by free truth." This is the standard interpretation, *provided* the utility function is defined over world states, not belief states. The draft acknowledges this later, so it's fine.
      *   *Correction/Refinement:* Ensure the distinction between *instrumental* value of information (changing actions) and *intrinsic* value (comfort/discomfort of knowing) is clear. The draft does this in paragraph 3.

  4.  **Evaluate Question 2: The "Bookkeeping" Worry:**
      *   *The Worry:* If we explain away every anomaly by adding a new term to the utility function (e.g., "utility of ignorance"), does the theory lose predictive power?
      *   *Status in Philosophy/Econ:* This is a *very* well-known problem. It's often discussed under "revealed preference theory" and the tautology problem of rational choice. If $U(x)$ can be anything, $Max U(x)$ explains everything and nothing.
      *   *Is it fresh?* No, it's a classic critique. However, framing it through Good's Theorem and genetic testing gives it a fresh *narrative* coat.
      *   *Principled Distinction:* Yes, there is one. It lies in *structural constraints* on the utility function. If we allow utility to depend on beliefs, we need independent evidence of that preference (e.g., willingness to pay to avoid info in *other* contexts), not just post-hoc rationalization.
      *   *Advice:* Acknowledge this is a known tension in decision theory (so the writer doesn't look like they discovered a secret flaw) but emphasize why *this* context makes it visceral.

  5.  **Evaluate Question 3: Huntington's Disease as Case Study:**
      *   *Suitability:* It's the canonical example in bioethics and behavioral econ for "information avoidance."
      *   *Risk:* Is it too singular? It involves death, fatalism, and lack of treatment. Financial statements are different (you can act on them).
      *   *Mitigation:* The draft mentions financial statements in the intro. The key is to ensure the reader understands Huntington's is the *extreme* case that stress-tests the theorem, not the only case.
      *   *Verdict:* It earns its place. It's the strongest example because the "instrumental" value of the info is high (life planning) but the "emotional" cost is also high.

  6.  **Evaluate Question 4: Payoff vs. Setup:**
      *   *Technical Load:* The first paragraph is dense but readable. "Expected-utility maximizer," "Bayesian conditionalization."
      *   *Payoff:* The philosophical question ("what would it even take for that question to have a determinate answer") is strong.
      *   *Verdict:* Yes, it justifies it. The tension between "math says look" and "humans say don't" is the engine of the piece.
      *   *Suggestion:* Make sure the transition from the math to the human cost is smooth. The draft does this well with "Set that next to a fact from genetic counseling."

  7.  **Drafting the Feedback:**
      *   *Tone:* Professional, encouraging, precise (matching the writer's level).
      *   *Structure:* Address the four specific questions in order.
      *   *Content:*
          *   **Math Check:** Confirm accuracy. Note the "fixed utility over outcomes" assumption is the key lever.
          *   **Bookkeeping:** Validate the worry. It's the "tautology problem" of revealed preference. Suggest acknowledging it's a known debate but highlighting the *stakes* (normative vs. descriptive). Suggest looking into "consequentialism" vs. "non-consequentialism."
          *   **Huntington's:** It's the gold standard example. Keep it. Just ensure the distinction between *actionable* info (finance) and *existential* info (Huntington's) is clear.
          *   **Payoff:** The ending is strong. It invites the reader to think rather than telling them what to think.
      *   *Specific Edits:*
          *   Clarify "fixed menu of actions."
          *   Maybe soften "moral philosophers still argue over as though it were open" (some might find that dismissive).
          *   Refine the "bookkeeping" paragraph to hint at *falsifiability*.

  8.  **Refining the "Bookkeeping" Advice:**
      *   The writer asks: "Is there a principled way to distinguish legitimately enlarging the outcome space from simply rescuing the theory by fiat?"
      *   *Answer:* Yes. Independent verification. If I say I value ignorance, do I also pay to avoid other bad news? If it's *only* post-hoc, it's fiat. If it predicts behavior in *new* contexts, it's a theory.
      *   *Reference:* Maybe mention "preference for flexibility" or specific behavioral econ terms if helpful, but keep it accessible. The Caplin and Leahy reference is good.

  9.  **Final Review of the Feedback:**
      *   Does it answer the prompt? Yes.
      *   Is it constructive? Yes.
      *   Does it respect the writer's voice? Yes.

      *(Self-Correction during drafting)*: I should be careful not to write the piece for them. Just point out the leverage points. I need to make sure I don't sound like I'm correcting the math, but confirming it. The math is right. The philosophical interpretation is where the nuance lies.

      *One specific nuance on Good's Theorem:* It assumes the agent *uses* the information optimally. If the agent knows they will react irrationally to the info (e.g., panic), then *not* looking is rational. This is "bounded rationality" or "sophisticated choice." The draft hints at this with "anticipatory feelings," but it's worth noting that Good's theorem assumes the agent remains a perfect optimizer *after* receiving the signal. If the signal breaks the optimizer, the theorem doesn't apply. This is a crucial distinction for the "bookkeeping" worry. I will add this.

  10. **Final Polish:** Organize into clear sections corresponding to the user's four questions. Ensure the tone is collaborative.cw
answer: |-
  This is a compelling draft. You have managed to make a technical result from decision theory feel like a genuine philosophical puzzle without drowning the reader in notation. The prose is confident and clear.

  Here are my thoughts on your four specific questions, followed by a few minor line-level suggestions.

  ### 1. The Accuracy of Good's Theorem
  **Verdict:** A decision theorist will not wince. You have stated the scope conditions correctly.

  Specifically, you correctly identify the three pillars required for the theorem to hold:
  1.  **Costless information:** (You specify "free, costless glimpse".)
  2.  **Bayesian updating:** (You specify "update by ordinary Bayesian conditionalization".)
  3.  **Fixed utility over outcomes:** (This is the crucial one, which you address in paragraph 3.)

  **One nuance to consider:** Good's theorem assumes the agent retains the *capacity* to optimize after receiving the signal. If an agent knows that receiving certain information will cause them to panic, freeze, or otherwise deviate from expected-utility maximization *in the moment*, then refusing the information is actually consistent with Good's theorem (viewed from the prior perspective).

  You hint at this with the "anticipatory feelings" argument, but you might sharpen the distinction. The theorem proves information has *instrumental* value (it helps you choose better actions). It does not prove information has no *intrinsic* disutility (it makes you feel terrible). Your draft captures this, but ensure the reader understands that the "mistake" only exists if we assume the utility function is defined *solely* by material outcomes (health, wealth) and not by mental states (anxiety, hope). You do make this point, so you are safe.

  ### 2. The "Bookkeeping" Worry
  **Verdict:** This is a real, recognized problem in the philosophy of economics, not a straw man. You are not dressing up old news as fresh; you are identifying the tension between *normative* and *descriptive* power.

  In economics, this is often discussed under the umbrella of **revealed preference theory**. If every action is rationalized by positing a preference that explains it (e.g., "he didn't open the envelope because he preferred ignorance"), the theory becomes unfalsifiable. It explains everything and predicts nothing.

  **Is there a principled distinction?**
  Yes. The distinction lies in **structural constraints** and **independent verification**.
  *   **Fiat:** "He didn't look, so he must value ignorance." (Post-hoc rationalization).
  *   **Principled:** "He didn't look. We hypothesize he values ignorance. We then test if he pays to avoid *other* types of negative information in *different* contexts. If he does, the 'utility of ignorance' is a stable trait, not a rescue operation."

  **Advice:** You don't need to solve this in 600 words, but acknowledging that this is the "tautology problem" of rational choice theory adds weight to your closing. You might phrase it as: *"If we can always save the theory by expanding the definition of 'utility,' does the theory still tell us how we ought to think, or only how we can be described?"* This keeps the focus on the normative stakes (how we should live) rather than just the mathematical ones.

  ### 3. Huntington's Disease as the Central Case
  **Verdict:** It earns its place. It is the canonical example in bioethics and behavioral economics for information avoidance.

  **Why it works:** It isolates the variable. In financial downturns, one could argue people don't look because they are busy, or in denial, or hoping for a market rebound. With Huntington's, the test is definitive, the outcome is fatal, and there is no treatment. It strips away "instrumental" excuses. If Good's theorem fails here, it fails in the starkest possible light.

  **One caution:** Ensure you don't imply the Huntington's decliners are *all* driven by the same mechanism. Some may be avoiding the sadness; others may be protecting their current happiness (the "suspension of disbelief"). Both fit your "utility of belief" argument, but acknowledging the heterogeneity makes the case study feel more reported and less theoretical.

  ### 4. Payoff vs. Technical Setup
  **Verdict:** Yes, the payoff justifies the setup.

  For a general-interest reader, the first paragraph provides a necessary "authority anchor." It tells them: *This isn't just a mood; this is a conflict with a mathematical law of rationality.* Without the setup of Good's theorem, the piece risks becoming a standard "humans are emotional" story. With the theorem, it becomes "humans are violating a law of rationality; is the law wrong, or are we measuring the variables wrong?"

  The closing question ("what would it even take for that question to have a determinate answer") is excellent. It leaves the reader with a productive uncertainty rather than a pat answer.

  ### Minor Line-Level Suggestions

  *   **Paragraph 1:** *"moral philosophers still argue over as though it were open."*
      *   **Critique:** This might irritate some philosophers. Epistemologists and decision theorists argue about it, but "moral philosophers" might feel like a slight conflation.
      *   **Suggestion:** Consider *"philosophers of science and action still argue over..."* or simply *"philosophers still argue over..."*
  *   **Paragraph 1:** *"You cannot be harmed, by your own lights, by free truth."*
      *   **Critique:** This is a beautiful line, but technically, Good's theorem says you cannot be harmed *in expectation*. You can be harmed in reality (the test comes back bad), but your *ex-ante* expectation is higher.
      *   **Suggestion:** You might tweak to *"By your own prior lights, free truth cannot lower your expected utility."* (Though your current phrasing is more poetic; if you keep it, ensure the "expectation" part is clear in the preceding sentence).
  *   **Paragraph 3:** *"Twenty years lived under an unresolved coin flip may have a different expected shape..."*
      *   **Critique:** "Expected shape" is a bit vague.
      *   **Suggestion:** *"Twenty years lived under an unresolved coin flip may hold more utility, for many people, than twenty years lived under a definite sentence..."* (Directly invoking utility here strengthens the link to the theorem).
  *   **Paragraph 4:** *"If any observed refusal of free evidence can be redescribed, after the fact, as evidence of a cost that was there all along..."*
      *   **Critique:** This is the core of the "bookkeeping" worry.
      *   **Suggestion:** Consider adding a clause about prediction. *"...then Good's theorem stops predicting anything: it becomes a piece of bookkeeping rather than a constraint on rational behavior, capable of explaining any choice but forbidding none."*

  ### Summary
  You are on solid ground. The math is right, the case study is the strongest available, and the philosophical worry is genuine and significant. The piece succeeds because it treats the theorem not as a verdict on human stupidity, but as a mirror for our definitions of rationality. Keep the ending open; it's the strongest part.
