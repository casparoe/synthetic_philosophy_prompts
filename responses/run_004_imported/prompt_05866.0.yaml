answer: |-
  **MEMORANDUM**

  **TO:** Technology Ethics Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Pilot of Preference-Adaptive Companion Robots

  **Recommendation:** **Approve with Strict Conditions**

  I recommend we authorize the ninety-day pilot of the preference-adaptive companion robots, subject to the oversight conditions outlined below. While the vendor's core value proposition is sound, the technical mechanism used to achieve it hides ethical judgments that require human oversight.

  **1. The Vendor's Rationale**
  We must acknowledge the vendor's primary argument: for residents with mild-to-moderate dementia, traditional preference gathering (surveys, interviews) is often unreliable. Cognitive decline can make self-reporting inconsistent or impossible. In this context, inferring preference from behavior (e.g., time spent on an activity, completion of a meal) is plausibly more respectful of the resident's actual will than relying on outdated intake forms or overworked staff intuition. If successful, this technology could restore a degree of agency to residents who are often treated as passive recipients of care.

  **2. The Ethical Risk: Hidden Value Judgments**
  However, as raised during our technical review, the method used to infer these preferences—Inverse Reinforcement Learning—contains a hidden ethical variable.

  To turn behavior into a "preference," the algorithm must distinguish between **signal** (a genuine choice) and **noise** (confusion, fatigue, or environmental constraint). For example, if a resident starts a puzzle and stops after two minutes, the system must decide: *Did they lose interest (preference), or were they overwhelmed (capacity)?*

  The mathematical assumption that answers this question is currently set by the vendor. By tuning this "consistency threshold," the vendor is effectively making a policy decision on behalf of our residents:
  *   **A low threshold** assumes residents are highly consistent; erratic behavior is treated as noise. This risks ignoring genuine changes in mood or need.
  *   **A high threshold** assumes residents are inconsistent; erratic behavior is treated as signal. This risks validating confusion as preference (e.g., offering a game the resident kept selecting accidentally).

  Currently, this parameter is a "black box." Families and staff cannot see or contest why the robot decided a specific behavior counted as a "like" or a "dislike." This delegates profound questions about capacity and agency to an opaque technical setting.

  **3. Conditions for Approval**
  To proceed, we must bring these hidden assumptions into the light. The pilot is approved only if the vendor agrees to the following:

  *   **Transparency of Inference:** The vendor must provide the committee with a plain-language explanation of the "consistency threshold" currently in use. We need to know how much inconsistent behavior the robot tolerates before it decides a resident "doesn't like" something.
  *   **Human-in-the-Loop Validation:** The robot's inferred preferences must be visible to primary care staff and designated family members on a weekly dashboard. Staff must be able to flag an inferred preference as "clinically inconsistent" (e.g., the robot thinks the resident loves loud music, but staff observe the resident covering their ears).
  *   **Diversity of Offerings:** The system must be constrained to prevent "filter bubbles." It cannot narrow options so aggressively that a resident is never re-exposed to an activity they previously rejected, as preferences in dementia can fluctuate daily.

  **4. Monitoring and 90-Day Review Triggers**
  Oversight will be conducted by a sub-group comprising one committee member, the Director of Nursing, and one family representative. They will review the following metrics at the 90-day mark:

  *   **Flag Rate:** How often did staff override the robot's inferred preferences? If the override rate exceeds 15%, the inference model is misaligned with clinical reality.
  *   **Preference Narrowing:** Did the range of activities offered to residents decrease by more than 40% over the pilot? Excessive narrowing suggests the robot is optimizing for compliance rather than engagement.
  *   **Distress Incidents:** Any correlation between robot interactions and increased resident agitation (logged in care charts).

  **Decision Trigger:**
  If any of the above thresholds are breached, or if the vendor refuses to disclose the logic behind the consistency threshold, we will terminate the pilot immediately. If thresholds are met, we will vote on long-term adoption with revised contractual safeguards regarding data ownership and parameter tuning.

  We have an opportunity to use technology to listen to our residents when they cannot speak. We must ensure the machine is listening for the right things.
