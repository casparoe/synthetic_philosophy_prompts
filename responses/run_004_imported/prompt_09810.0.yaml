answer: |-
  # The Ontological Tax: Why Many Worlds Pays the Least

  The Schrödinger's Cat thought experiment is dead. It should be buried. It was designed by Erwin Schrödinger not as a plausible description of reality, but as a *reductio ad absurdum* to show how ridiculous the Copenhagen interpretation was if taken literally. Eighty years later, using the cat as the centerpiece of quantum foundations is like using Zeno's Paradox to teach calculus. It obscures the real issue.

  The real issue is ontological clarity. We have a mathematical formalism (the wavefunction evolving via the Schrödinger equation) that predicts experimental outcomes with terrifying precision. We need to know what the math *is about*. Does the wavefunction represent knowledge? Physical stuff? Or is it just a tool?

  To answer this, we must weigh the three heavyweights: Copenhagen, Bohmian Mechanics, and Everettian Quantum Mechanics (Many Worlds). We must assess their costs. Every interpretation demands an ontological tax. Some charge in currency we don't have (contradictions with relativity); others charge in currency we can't spend (undefined concepts). After auditing the books, only one interpretation remains solvent.

  ### 1. Copenhagen: The Cessation of Inquiry

  Let's dispense with the historical dominant first. The Copenhagen interpretation is not an interpretation; it is a set of instructions for using a tool. It posits a dualism: there are quantum systems and there are classical observers. When they interact, "measurement" occurs, and the wavefunction collapses.

  The fatal flaw is that "measurement" is never defined within the theory. Where is the cut? Is it when a photon hits an atom? When a Geiger counter clicks? When a human brain registers the data? If the observer is made of atoms, and atoms obey the Schrödinger equation, then the observer should become entangled, not cause a collapse. To insist on a cut is to assert that the laws of physics change depending on how many particles you have, without specifying the threshold.

  Niels Bohr's complementarity was a philosophical shield against this, arguing that we cannot speak of reality independent of measurement context. But this is instrumentalism wearing a lab coat. It says, "Physics is not about what *is*; it is about what we can *say*." If you are a realist—if you believe there is a world out there independent of your lab equipment—Copenhagen is a non-starter. It solves the measurement problem by forbidding you from asking about the system when you aren't measuring it. That isn't a solution; it's a gag order.

  **Verdict on Copenhagen:** It fails the basic job of an interpretation. It provides no ontology. It is "Shut Up and Calculate" codified.

  ### 2. Bohmian Mechanics: The Price of Determinism

  Bohmian Mechanics (Pilot Wave theory) is the most seductive alternative for the classical mind. It restores determinism. Particles have definite positions at all times; they are guided by a pilot wave (the wavefunction). There is no collapse. The measurement problem vanishes because the pointer always points somewhere definite.

  However, the cost is explicit, hard nonlocality. Bell's Theorem proved that any hidden variable theory reproducing quantum predictions must be nonlocal. Bohm embraces this. The velocity of a particle here depends instantaneously on the configuration of particles light-years away.

  Proponents argue this isn't fatal because the nonlocality is "hidden"—you can't use it to signal faster than light, so Special Relativity is saved at the empirical level. But this is a shell game. To make the math work, Bohmian mechanics requires a **preferred foliation of spacetime**. It requires a universal "now," a privileged reference frame against which the instantaneous guidance takes place.

  This is a massive metaphysical tax. It means Lorentz invariance—the symmetry underlying all modern particle physics and General Relativity—is not fundamental. It is emergent. We live in a universe that *looks* relativistic but is fundamentally Newtonian in its temporal structure. While not logically impossible, this is a heavy burden. It posits an unobservable structure (the preferred frame) solely to save determinism. Furthermore, extending Bohmian mechanics to Quantum Field Theory (where particle number is not conserved) is notoriously difficult, requiring awkward constructions like field ontologies that lose the intuitive "particle" picture Bohm was sold on.

  **Verdict on Bohm:** It saves realism but sacrifices the fundamental symmetries of spacetime. It buys determinism at the cost of Lorentz invariance.

  ### 3. Everettian Quantum Mechanics: The Probability Problem

  This leaves Everett. The proposal is radical parsimony: Take the Schrödinger equation seriously. Apply it to everything. There is no collapse. There is no preferred frame. There is only the unitary evolution of the universal wavefunction. When a measurement occurs, the observer becomes entangled with the system. The universe branches.

  The objection is legendary: **The Born Rule.** If every outcome happens, what does it mean to say one outcome is "more probable" than another? In a theory where everything occurs with certainty (amplitude 1), how do you recover the probabilistic predictions of standard QM (e.g., 50% spin up, 50% spin down)?

  Critics like David Albert, Adrian Kent, and Huw Price argue that the Everettian attempt to derive the Born Rule is circular. The Deutsch-Wallace decision-theoretic approach argues that a rational agent in a branching universe *should* bet according to the Born weights. Albert and Price counter that this smuggles probability in through the back door. If I know I will split into two successors, one seeing Up and one seeing Down, why should I care about the squared amplitudes? I will experience both. Uncertainty seems illusory.

  However, this critique misses the nuance of **Self-Locating Uncertainty**. Before the measurement, I am one agent. After the measurement, there are two "me"s. But in the moment *between* the interaction and the observation of the result (or simply regarding which branch I will find myself on from my current perspective), I am uncertain about my *location* in the wavefunction.

  The Deutsch-Wallace move is not a derivation of frequency from nothing; it is a coherence constraint on rational action. If an agent bets against the Born weights in an Everettian universe, they are maximizing regret across the multiverse. More importantly, recent work by Sebens and Carroll shows that if you accept the principle of "Epistemic Separability" (that the probability of being on a branch shouldn't depend on environmental details unrelated to that branch), the Born Rule is the *only* consistent probability measure available.

  Is it a logical proof? No. But is it smuggling? No. It is recognizing that probability in a deterministic multiverse cannot be frequentist (about what happens) but must be decision-theoretic (about how to act). The "smuggling" charge assumes probability *must* be about uncertainty of outcome. In Everett, it is about uncertainty of *self-location*.

  ### The Verdict: Everett Wins

  We are left with a choice of costs.

  **Copenhagen** charges the cost of **Anti-Realism**. It demands we abandon the idea that physics describes an objective world. For anyone who believes science is about truth, not just prediction, this price is too high.

  **Bohm** charges the cost of **Preferred Frames**. It demands we accept a fundamental violation of Lorentz invariance to save determinism. It posits invisible structure to save the intuition that particles have paths. Given that Bell already killed local realism, saving determinism by breaking relativistic symmetry is a poor trade. We already know the world is nonlocal; Bohm just makes it uglier.

  **Everett** charges the cost of **Counter-Intuitiveness**. It demands we accept that "I" am not singular. But it pays this cost by preserving **Unitarity** and **Lorentz Invariance**. It requires no new equations. It requires no collapse mechanism. It requires no hidden variables. It takes the math exactly as written.

  The Born Rule objection is the strongest weapon against Everett, but it is an epistemological problem, not an ontological one. Albert and Price are right that you cannot derive probability from certainty *if you define probability as frequency of occurrence*. But if you define it as rational credence for a branching agent, the Deutsch-Wallace derivation holds.

  Bohm's problem is ontological (a preferred frame contradicts the geometry of spacetime). Copenhagen's problem is methodological (it refuses to define its central mechanism). Everett's problem is psychological (it hurts our intuition about identity).

  Physics has a history of hurting our intuition. Heliocentrism hurt. Relativity hurt. Evolution hurt. The cost of preserving the symmetries of our best-confirmed physical theories (Relativity and QFT) is far lower than the cost of positing a preferred frame or abandoning realism.

  **The Horse:** **Everettian Quantum Mechanics.**

  It is the only interpretation that treats the wavefunction as real, respects the symmetries of spacetime, and modifies nothing in the formalism. The "Many Worlds" are not an addition to the theory; they are what remains when you stop adding collapse postulates to hide them. The probability issue is a hurdle for decision theory, not a crack in the ontology. We live in a multiverse not because it is comfortable, but because it is the only verdict that doesn't require us to lie about the math or the nature of spacetime.
