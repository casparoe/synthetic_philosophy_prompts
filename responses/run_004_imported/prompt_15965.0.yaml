prompt: |-
  I just found out about Fitch's paradox of knowability and it seems like a pretty clean proof that omniscience is flat out impossible, wich seems like a huge problem for the traditional idea that God knows literally everything. Is this basically a slam dunk argument against an all-knowing god, or is there some way out for theists here?
reasoning: |-
