answer: |-
  This is a fantastic question. You have pinpointed the exact tension in Hobbes's system that makes him so fascinating to modern readers: the collision between his **epistemological constructivism** (we know what we make) and his **ontological materialism** (everything is body in motion).

  As a software engineer, you might think of Hobbes's view of geometry as treating it like a **closed system with a specific runtime environment**. For Hobbes, the "code" of geometry must compile (be logically consistent), but more importantly, it must run on the "hardware" of the physical universe (material bodies in motion).

  Here is how Hobbes would likely react to the discovery of non-Euclidean geometries, breaking down your two options.

  ### 1. Would he grant them equal certainty? (The Constructivist View)
  **Verdict: No.**

  You asked if his logic commits him to treating all consistent geometries as equally certain sciences because they are all "constructible from clear definitions." This is the trap of modern axiomatic thinking (like Hilbert's), but it is not Hobbes's thinking.

  For Hobbes, a definition is not just a stipulation of terms; it is a **causal recipe**. When he defines a line as "the track of a moving point," he isn't being poetic. He is insisting that the concept must be *genetic*. You must be able to describe the *motion* that generates the object.

  If presented with Hyperbolic or Elliptic geometry, Hobbes would ask: **"What motion generates this space?"**

  *   **Euclidean Space:** For Hobbes, this is generated by the simplest possible motion: a point moving with *conatus* (endeavor) in a single direction without impediment. This matches his physics of inertia.
  *   **Non-Euclidean Space:** To construct a space where parallel lines meet or diverge inherently, the "straight lines" (geodesics) must behave differently. Hobbes would argue that unless you can describe a physical motion that naturally traces these paths *without external force*, the definition is "absurd" or "insignificant."

  Hobbes famously hated algebra and symbolic logic (which is why he feuded with Wallis) because he felt they detached reasoning from the visualization of quantity and motion. He would likely view non-Euclidean geometry as the ultimate triumph of the error he fought against: **reasoning about words rather than bodies.**

  He would concede that non-Euclidean systems might be logically consistent (you can't derive a contradiction from the axioms), but he would deny they constitute *Scientia* (science/knowledge). For Hobbes, *Scientia* requires knowing the **cause**. Since non-Euclidean definitions do not correspond to the causal generation of figures via simple motion, they are merely "games of names," not certain sciences.

  ### 2. Would he insist only one is the "true" geometry? (The Materialist View)
  **Verdict: Yes.**

  This is where Hobbes's materialism saves him from relativism. Hobbes does not believe space is an abstract container that can be shaped however we like. For Hobbes, **Space is the "phantasm of existing things."** It is the way our imagination represents the extension of bodies.

  Because Hobbes is a materialist, he believes there is only one physical universe composed of bodies in motion. Therefore, there can only be one true geometry of that universe.

  *   **The Physics Constraint:** Hobbes's physics relies on the idea that if a body is moved and not impeded, it moves in a straight line forever. This is the physical instantiation of the Euclidean straight line.
  *   **The Parallel Postulate:** For Hobbes, the properties of parallel lines aren't arbitrary axioms; they are consequences of how motion works in a uniform plenum. If two bodies move in the same direction with the same velocity, their distance remains constant. To suggest otherwise (as in hyperbolic geometry) would imply that space itself exerts a force or curvature on moving bodies, which contradicts his mechanistic physics.

  So, if a 19th-century mathematician told Hobbes, "We have found a consistent system where triangles sum to less than 180 degrees," Hobbes would reply: **"That is a consistent fiction, but it is not the geometry of *this* world."**

  He would treat non-Euclidean geometry the way a physicist today treats a mathematical model that violates conservation of energy: it might be interesting math, but it doesn't describe reality.

  ### The "Squaring the Circle" Parallel
  Your mention of his feud with Wallis is crucial here. Hobbes didn't just *make* a mistake; he was **dogmatically committed to his method.** He believed that because his method (motion-based construction) was philosophically sound, his results *had* to be right.

  Faced with non-Euclidean geometry, he would likely double down. He would argue that the mathematicians have confused **abstraction** with **reality**.
  *   **Euclid:** Describes the necessary structure of any possible material universe (because motion implies extension, and simple motion implies Euclidean properties).
  *   **Non-Euclid:** Describes a fantasy universe that cannot exist because it violates the laws of motion.

  ### A Software Engineering Analogy
  Since you are in SE, here is the closest analogy to Hobbes's position:

  *   **Hobbes's Geometry:** This is **Type-Safe Code running on Bare Metal.** The types (definitions) are strictly tied to the hardware capabilities (motion/bodies). If the code compiles but tries to access memory that the hardware architecture doesn't support, it's not just a "bug," it's fundamentally invalid.
  *   **Non-Euclidean Geometry:** This is **Code running in an Emulator.** It is logically consistent within the emulation layer, and you can run programs on it. But Hobbes would argue it doesn't tell you anything about the actual CPU (the physical universe). It is a simulation, not the machine itself.
  *   **Wallis/Modern Mathematicians:** They are arguing that the Emulator is just as "real" as the Bare Metal because the logic holds. Hobbes insists that without the causal link to the hardware (motion), the emulation is just "insignificant speech."

  ### Summary
  Hobbes would not be trapped into treating all geometries as equally certain. His constructivism is not about *logical* construction (axioms), but *causal* construction (motion).

  1.  **On Certainty:** He would deny non-Euclidean geometry is a "science" (*scientia*) because its definitions are not generated by possible motions of bodies. It is merely consistent logic, not knowledge of causes.
  2.  **On Truth:** He would insist Euclidean geometry is the only true geometry of physical space because it alone aligns with the laws of material motion (inertia).

  In a twist of irony, General Relativity later showed that physical space *is* non-Euclidean (curved by mass). Hobbes would have hated Einstein. He would likely have argued that "curved space" is a linguistic confusion, and that what is actually happening is forces acting on bodies moving through straight (Euclidean) space. He would have preferred to invent a new force (like a "gravity ether") rather than admit the geometry of space itself could be non-Euclidean, because for Hobbes, **geometry is the study of the necessary properties of extension, and extension cannot curve.**
