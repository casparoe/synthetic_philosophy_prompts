answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name], one of [Advisor's Name]'s former students. For those of you who *do* know me, you're probably wondering if I'm going to talk for five minutes or forty. I promise to stick to the equilibrium.

  We are here to celebrate thirty years of [Advisor's Name]'s career. Now, to the family and friends in the room, you know her as a mentor, a colleague, and a person who definitely has opinions about which side of the road to drive on. But to the philosophers and game theorists here, you know she spent three decades defending a very specific idea about *why* we drive on that side.

  She defended David Lewis's account of convention. In plain English: Lewis argued that social rules—like driving on the right, or shaking hands, or applauding when a speaker finishes—are "arbitrary regularities." We don't do them because we promised to. We do them because we expect everyone else to do them, and we'd look pretty foolish if we didn't. There is no moral obligation, Lewis said. If someone breaks a convention, you shouldn't be angry; you should just be surprised. Like seeing someone wear a tuxedo to the beach.

  Her critics, like Margaret Gilbert, argued that this was too cold. They said conventions *do* carry obligation. If you break them, it doesn't just feel surprising; it feels like a *wrong*. Like a betrayal.

  And this brings me to the joke. Or rather, the experiment.

  Because looking around this room, I realize that this dinner is itself a perfect Lewis-style convention. None of us signed a contract to be here. There is no police enforcement ensuring I stand up and speak. We could have just as easily agreed to celebrate by all simultaneously humming the national anthem, or by silently staring at [Advisor's Name] for twenty minutes. Those options were arbitrary. We didn't choose them. We just converged on "dinner and speeches" because we expected everyone else to expect it.

  So, technically, according to the theory [Advisor's Name] has championed for thirty years, I have no obligation to finish this toast. I could simply say "Cheers," put my glass down, and sit here in silence. It would be arbitrary. It would be unexpected. But it shouldn't be *wrong*.

  *[Pause. Lift glass halfway, then slowly lower it back to the table without drinking. Look around the room expectantly.]*

  ...Does anyone else feel a slight tightening in the chest? A sense that I have violated something sacred?

  *[Pause for laughter]*

  Exactly.

  Lewis says you should just be surprised. But you're not just surprised. You're judging me. You feel I owe you a finish. And in that tension—between the arbitrariness of the ritual and the genuine feeling of obligation—is the story of her career. She spent thirty years showing us that the glue holding society together is thinner than we think, yet she showed up every day to teach us, mentor us, and guide us as if that glue were steel.

  She taught us that even if our rules are arbitrary, our commitment to each other doesn't have to be. She taught us that "common knowledge" isn't just a technical term; it's the light in the room when we all understand each other without speaking.

  So, I am going to honor the Gilbert intuition, rather than the Lewisian technicality. I am going to fulfill the obligation.

  *[Raise glass fully]*

  To [Advisor's Name]. Thank you for teaching us that while conventions may be arbitrary, the people we share them with are not. May your retirement be full of regularities you love, and surprises you don't have to analyze.

  To [Advisor's Name]!
