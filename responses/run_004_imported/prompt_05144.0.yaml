      *   *Tension to flag:* Hume's desire for "Necessity" (Regularity) vs. his ban on "Necessity" (Metaphysical Glue). Bohm/Everett offer strong Regularity (Determinism) but require Metaphysical Glue (Hidden variables/Branches). Copenhagen offers weak Regularity (Stats) but avoids Glue.
      *   *Decision:* Copenhagen is the winner, but with caveats.

