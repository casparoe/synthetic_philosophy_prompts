      3.  *Coleman's panqualityism:* Micro-entities have qualities (quiddities) but no subjectivity. Subjectivity emerges/is constituted at the macro level. *Critique:* Avoids subject-summing. Strong contender. Shifts the burden to how non-subjective qualities become subjective experience.
      4.  *Naive subject-summing ("mind-dust"):* Subjects just add up. *Critique:* William James's classic objection. Widely regarded as incoherent. The baseline failure case.
      5.  *Brute/strong emergentism:* Macro-subjects emerge strongly from micro-bases. *Critique:* If strong emergence is accepted, panpsychism might not be needed (physicalism could claim strong emergence of consciousness). Undermines the motivation for panpsychism (avoiding brute emergence).
      6.  *Integrated-information-style criteria (IIT):* Subject boundaries fixed by causal integration (Phi). *Critique:* Provides a structural criterion, but doesn't explain *why* integration yields phenomenology. Risks category mistake (structure vs. experience).
