      8.  *Deflationary, "no-subject" dissolutions:* Deny the substantial subject (Bundle theory, Humean). *Critique:* Dissolves the problem by denying the relata. Cogent if one accepts no-self views, but might conflict with the phenomenology of unity panpsychists try to save.

