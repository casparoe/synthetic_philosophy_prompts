      *   *Laws:* More pragmatic. Acknowledges human weakness. Uses "counter-charms" (649d).
      *   **Continuity:** Reason still rules. In the *Laws*, the "Lord of the Feast" represents Reason. The drinker is supposed to remain in control *despite* the wine.
      *   **Shift:** The *method* of training changes from exclusion (banish the poets) to controlled exposure (use the wine as a test).

  5.  **Formulate the Advice:**
