          *   **Crucial Point:** The goal is *not* indulgence. It is *sophrosyne* (moderation/self-control). You drink to learn *how not to succumb* to the effects of wine.
          *   **The "Lord of the Feast":** There must be a sober ruler (640d, 641a). This mirrors the Reason ruling the Appetites.
          *   **Age Restriction:** Young men shouldn't drink much (666a-c). Only older men, whose characters are formed, use it for testing/relaxation.

  4.  **Compare with *Republic*:**
