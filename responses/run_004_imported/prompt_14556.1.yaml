answer: |-
  1.  **You frequently note that Arrow's Impossibility Theorem applies to ordinal rankings, not cardinal ratings, implying Score Voting sidesteps the impossibility result. To be precise: Arrow's theorem relies on four key conditions—unrestricted domain, Pareto efficiency, independence of irrelevant alternatives (IIA), and non-dictatorship. When you say Score Voting "evades" Arrow, are you claiming it satisfies all four, or is there one specific condition—typically IIA—that you argue is defined differently or rendered moot in a cardinal framework?**
      *   *Follow-up:* If he claims it satisfies IIA: "Does that satisfaction hold only under the assumption of honest voting, or does it survive when voters act strategically to minimize regret?"

  2.  **Arrow's ordinal framework was designed partly to avoid the problem of interpersonal utility comparisons. In Score Voting, we sum a "7" from Voter A with a "7" from Voter B. What licenses the assumption that these two intensities are commensurable? Without a common zero point and unit of measure, aren't we adding apples to oranges?**
      *   *Follow-up:* If he argues voters naturally calibrate scales: "Doesn't that calibration create an incentive for strategic exaggeration—voters stretching their scale to maximize impact—which effectively returns us to an ordinal system?"

  3.  **That leads to the question of honesty. The standard worry is that in a competitive race, rational voters will collapse their scores toward the extremes—giving the favorite a 10 and the biggest threat a 0—to avoid wasting influence. If optimal strategy turns cardinal ballots into binary approvals, does the theoretical advantage of Score Voting disappear?**
      *   *Follow-up:* If he suggests honesty is a stable equilibrium: "So you rely on a portion of the electorate voting expressively rather than strategically? How stable is that equilibrium if the stakes of the election rise?"

  4.  **Let's return to Independence of Irrelevant Alternatives. Even if Score Voting satisfies IIA mathematically under honest voting, does it satisfy it in practice? If a third-party candidate enters the race, might that change my strategic calculation for how to score the front-runners, effectively reintroducing the spoiler effect Arrow sought to highlight?**
      *   *Follow-up:* If he concedes strategy affects IIA: "If the spoiler effect persists under strategic voting, is the claim that Score Voting 'solves' Arrow's problem more of a technicality than a practical reality?"

  5.  **Exempting your system from Arrow doesn't necessarily exempt it from the broader family of impossibility results. The Gibbard-Satterthwaite theorem states that any non-dictatorial voting system with at least three outcomes is manipulable. Does Score Voting escape this, or does it simply trade one form of manipulability for another?**
      *   *Follow-up:* If he argues GS applies primarily to ordinal systems: "If it is manipulable, on what grounds do you argue it is *less* manipulable than ranked systems, given that strategic scoring requires more sophisticated information about the electorate?"

  6.  **There are also extensions like the Duggan-Schwartz theorem, which deals with set-valued rules and systems like Approval. Since Approval is essentially Score Voting with two levels, do these results suggest that as you collapse the scale, you inherit the vulnerabilities of Approval, and as you expand it, you inherit the vulnerabilities of Ranked?**
      *   *Follow-up:* If he argues more granularity is inherently better: "Is there a 'Goldilocks' number of rating levels that minimizes these vulnerabilities, or is that purely an empirical question?"

  7.  **Advocates often present Score Voting as the logical next step after Approval Voting. But if strategic incentives push voters toward binary choices, isn't Approval Voting the natural equilibrium? Why push for the complexity of a 0-to-10 scale if the game theory suggests voters will flatten it to 0-and-1?**
      *   *Follow-up:* If he says Score allows for honest expression: "Is the argument then that Score Voting allows for *honest* expression even if it doesn't always yield *strategic* optimization, and is the public prepared to make that trade-off?"

  8.  **Much of the case for Score Voting rests on "Bayesian Regret" simulations. These models require assumptions about voter utility distributions and strategy levels. How sensitive are your conclusions to those initial parameters? If voters are more strategic or less informed than the model assumes, does Score Voting still outperform Ranked Choice?**
      *   *Follow-up:* If he cites robustness: "Have you seen any real-world data from the cities that adopted Approval Voting that suggests voters are naturally inclined to use more than two levels if given the chance?"

  9.  **Finally, I want to ask about the status of this position for you. Is there a specific empirical finding or a theoretical argument that would change your mind about Score Voting's superiority? Or is the preference for cardinal utility aggregation an axiomatic stance for you?**
      *   *Follow-up:* If he says it is mathematically superior: "If it is axiomatic, how do you bridge the gap between that mathematical axiom and the messy reality of political behavior?"
