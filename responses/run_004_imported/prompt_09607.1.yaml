          2.  *Relationship:* If evolution did influence judgments in relation to truth, how?
              *   *Tracking Account:* Selection favored the *truth* of the beliefs (because true beliefs were adaptive). Street rejects this as scientifically implausible.
              *   *Adaptive Link Account:* Selection favored the *attitudes* themselves because they led to adaptive behavior, *regardless* of their truth. Street accepts this as the scientifically plausible option.
      *   *The Conclusion for Realists:* Since the Adaptive Link Account is the only scientifically plausible one, and it doesn't require truth, the realist faces a debunking conclusion (our beliefs aren't likely true).
      *   *Street's Alternative (Constructivism/Humean):* She is *not* a realist. She denies independent evaluative truths. Therefore, the dilemma doesn't apply to her. The "fit" between evolution and values is explained because values are *constituted* by our attitudes (which were shaped by evolution). There is no "third factor" needed for *her* view in the way the student describes.
      *   *Common Pitfall:* Confusing Street's solution with the "Third Factor" objection *against* Street (often associated with Wielenberg or Enoch). Street doesn't use a third factor to save realism; she rejects realism to avoid the dilemma.

