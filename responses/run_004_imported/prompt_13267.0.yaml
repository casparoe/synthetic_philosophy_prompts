answer: |-
  This is a crucial juncture in your dissertation, and I must advise you with some urgency: **your current reconstruction of Anscombe's argument is philosophically vulnerable and likely incorrect.**

  If you build your chapter on the premise that Anscombe's objection is primarily a matter of *proportionality* (a consequentialist cost-benefit analysis where the "cost" simply outweighed the "benefit"), you will run into significant textual and systematic contradictions within Anscombe's broader corpus.

  Here is a breakdown of why the proportionality reading fails, followed by a reconstruction of how her argument actually functions, which should resolve the puzzle you identified regarding her non-pacifism.

  ### 1. The Category Error: "Murder" is Not Rhetorical
  You suggest that Anscombe's use of the word "murder" functions as "rhetorical emphasis on how badly that [cost-benefit] test is failed." In Anscombe's moral philosophy, this is a category error.

  For Anscombe, "murder" is not a thick description of a killing that turned out to be unjustified based on outcomes. It is a **deontological classification of an act-type.** In her view (heavily influenced by Aquinas and natural law), there are certain actions that are intrinsically evil (*mala in se*), regardless of their consequences. The intentional killing of the innocent is one of these.

  If her argument were merely proportionalist, she would have to concede that if Truman could demonstrate that the bombings saved *enough* lives (e.g., millions vs. thousands), the action would be justified. But Anscombe explicitly rejects this trade-off. In "Mr. Truman's Degree," she writes:

  > "For men to choose to kill the innocent as a means to their ends is murder."

  Note the structure: "To choose to kill... is murder." It does not say "To choose to kill... is murder *unless the ends are weighty enough*." She is arguing that the *intention* to destroy civilian populations to force surrender renders the act murder, full stop. The label "murder" is the premise of her argument, not the rhetorical conclusion of a calculus.

  ### 2. Intentionality vs. Foreseeability (The DDE Context)
  The puzzle you face—how she accepts large-scale killing elsewhere but not here—is solved by looking at her distinction between **intended** effects and **foreseen but unintended** side effects. This is the Doctrine of Double Effect (DDE), which Anscombe famously defended (e.g., in her later essay "War and Murder," 1961, which expands on the pamphlet).

  *   **Acceptable War Killing:** Killing combatants is permissible because they are engaged in unjust aggression. Collateral damage (civilian deaths) is permissible *if* it is not intended as a means or an end, and if the military objective is proportionate to the collateral damage.
  *   **Truman's Bombing:** Anscombe argues that the atomic bombings were not cases of collateral damage. The destruction of the cities and the killing of the inhabitants *was the means* by which the surrender was to be effected. The civilians were not "in the way"; they were the target (psychologically and physically) to break the will of the Japanese leadership.

  Therefore, her objection is not about the *scale* of death (proportionality), but about the *structure of the intention* (discrimination/immunity). She can accept the firebombing of Dresden only if argued as an attack on military transport/industry where civilian death was side-effect (though she was skeptical of much area bombing); she rejects Hiroshima/Nagasaki because the weapon's nature and the stated aim made the civilian destruction the primary mechanism of victory.

  ### 3. Anti-Consequentialism
  You note that Anscombe was not a pacifist. This is correct. But you must recall that Anscombe is perhaps the 20th century's most famous critic of consequentialism. Her seminal paper "Modern Moral Philosophy" was published just two years after the pamphlet (1958).

  In "Mr. Truman's Degree," she anticipates the consequentialist defense of Truman (that the bombs saved lives by ending the war). She dismisses this logic entirely. She argues that we cannot justify doing evil (murder) so that good may come of it. To read her argument as a "stricter accounting of costs and benefits" attributes to her the very utilitarian calculus she spent her career dismantling.

  She writes in the pamphlet:
  > "It is not lawful to kill the innocent to bring about a good result... even if the good result is the ending of a war."

  This is an absolute prohibition, not a sliding scale.

  ### 4. How to Reconstruct the Argument for Your Chapter
  To save your chapter from this philosophical pitfall, I recommend shifting your reconstruction from a **Quantitative/Proportionality Model** to a **Qualitative/Intentionality Model**.

  **The Corrected Structure:**
  1.  **Major Premise:** It is absolutely forbidden to intentionally kill the innocent as a means to an end (Non-combatant immunity is absolute, not proportional).
  2.  **Minor Premise:** The atomic bombings of Hiroshima and Nagasaki involved the intentional killing of the innocent as a means to force surrender (The destruction of the population was the method of coercion).
  3.  **Conclusion:** Therefore, the bombings were acts of murder.
  4.  **Institutional Corollary:** A university, as a guardian of truth and justice, cannot honor a murderer without complicitly endorsing the murder.

  **Addressing Your "Difficulty":**
  You asked: *What makes her cost-benefit verdict on the bombing come out so differently from the cost-benefit verdicts she was prepared to accept elsewhere?*

  **Answer:** It isn't a different cost-benefit verdict. It is a **different kind of verdict entirely.**
  *   In conventional warfare, she accepts a cost-benefit analysis regarding *collateral* damage (Jus in Bello proportionality).
  *   Regarding the *direct targeting* of innocents, she rejects cost-benefit analysis entirely (Jus in Bello discrimination).

  Truman's defenders argued: *High Cost (Civilians) < High Benefit (Ending War).*
  Anscombe argues: *The Act (Killing Innocents) = Forbidden, regardless of Benefit.*

  ### 5. Suggested Textual Evidence for Your Draft
  To bolster this corrected reading, look closely at these moments in the pamphlet and related texts:
  *   **The definition of the act:** She focuses on the *choice* made by Truman. "He chose to kill the innocent."
  *   **The rejection of the "Lesser Evil":** She explicitly addresses the argument that the bombs prevented a land invasion. She argues that committing murder is not a permissible "lesser evil."
  *   **"War and Murder" (1961):** While later, this essay clarifies the philosophical underpinnings of the pamphlet. She distinguishes between "killing in war" (which can be just) and "murder" (which is the killing of the innocent).
  *   **Comparison to Nuremberg:** She draws parallels between the logic used to condemn Nazi leaders and the logic used to honor Truman. The Nazi defense was often "military necessity." Anscombe argues that "military necessity" cannot justify murder.

  ### Summary for your Dissertation
  If you proceed with the proportionality reading, you risk having your chapter critiqued for attributing a utilitarian framework to a staunch anti-utilitarian.

  Your chapter will be much stronger if you frame Anscombe's intervention as a **reassertion of absolutist constraints against consequentialist reasoning in war.** Her point is not that Truman got the math wrong; it is that he was doing math in a domain where arithmetic does not apply. The "murder" charge is not rhetorical emphasis; it is the technical moral classification that precludes the possibility of justification.

  This distinction allows you to explain her non-pacifism (she accepts the math of collateral damage in legitimate military strikes) while maintaining the severity of her condemnation of Truman (he bypassed the constraint against targeting innocents).

  **Recommendation:** Pivot your analysis to focus on **Intentionality** and **Intrinsic Wrongness** rather than Proportionality. This aligns with the broader Anscombean project and resolves the tension you identified in her non-pacifist stance.
