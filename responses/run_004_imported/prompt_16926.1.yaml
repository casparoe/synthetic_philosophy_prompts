answer: |-
  This is a sophisticated catch. You have identified what meta-ethicists often call the "Quinean Dilemma": Quine's ontology is driven by the indispensability of posits to our best scientific theory, yet he excludes moral properties from that ontology despite their apparent indispensability to our best *social* scientific theories.

  You are correct that this looks like a violation of his own principle of "no first philosophy." If we cannot step outside science to judge it, and if social science is part of science, then the criteria for ontological commitment in physics should not differ radically from the criteria in sociology or psychology.

  Here is the argument for why a consistent Quinean naturalist should treat moral values as ontological posits, followed by the strongest Quinean defense of the asymmetry, and finally, why that defense fails on Quine's own terms.

  ### The Argument: Moral Indispensability and the Web of Belief

  To make the case that Quine *should* have been a moral realist, we must apply his own three criteria for ontological commitment strictly: **Naturalism**, **Holism**, and **Indispensability**.

  **1. Regimentation and Quantification**
  Quine's famous dictum, "to be is to be the value of a bound variable," relies on the process of *regimentation*. We translate our discourse into the canonical notation of first-order logic. If the translation requires quantifying over an entity to preserve the truth conditions of our best theories, we are committed to that entity.
  *   **Math:** We say "There is a prime number between 3 and 7." Regimented: $\exists x (Prime(x) \land 3 < x < 7)$. We are committed to numbers.
  *   **Morality:** Consider a robust social scientific explanation: "The collapse of the regime was caused by the widespread belief that *there exists a moral obligation* to resist tyranny." Or simpler: "There is a value such that all members of this society hold it." Regimented: $\exists v (Value(v) \land \forall p (Member(p) \to Holds(p, v)))$.
  If our best causal explanations of human behavior (which are scientific, per naturalism) require quantifying over moral values as explanatory variables, we are ontologically committed to them.

  **2. The Holistic Rebuttal to the Observation Asymmetry**
  This is the crux of your tension. Quine argues mathematical posits are saved by their connection to observation sentences via physical theory. Moral posits, he claims, lack this tether.
  However, this relies on a misunderstanding of Quinean **holism**.
  *   **The Web:** No single statement predicts an observation sentence in isolation. "Electrons exist" does not predict a needle moving on a dial without a massive web of auxiliary theories (instrumentation, optics, electromagnetism).
  *   **The Parallel:** Similarly, "Justice requires equality" does not predict a riot in isolation. But combined with theories of psychology, resource scarcity, and game theory, moral posits *do* help predict observable human behavior (riots, cooperation, trade).
  *   **The Consistency Check:** If we grant existence to electrons because they smooth out the physics web, we must grant existence to moral values if they smooth out the *sociological* web. To demand a tighter link to sensory stimulation for moral values than for theoretical particles is to privilege physics over other sciences. That is "first philosophy"—it is making an a priori judgment that physics is the *only* real science, which violates Quine's naturalism.

  **3. Theoretical Virtues as Moral Analogues**
  In "On the Nature of Moral Values," Quine admits science relies on "theoretical values" (simplicity, conservatism). He claims these are instrumental to truth (prediction), whereas moral values are not.
  *   **Counter:** From a naturalistic perspective, "truth" just *is* what proves stable in the web of belief. If moral values function exactly like theoretical virtues—guiding theory choice in the social sciences, reducing cognitive dissonance, and maximizing social coordination—they serve the same pragmatic function.
  *   **Indispensability:** Just as we cannot do physics without the concept of a "set," we cannot do evolutionary psychology or sociology without the concept of a "norm" or "value." If these concepts are indispensable to our best causal account of the human animal, naturalism demands we accept them as real features of the world, not just "expressions of emotion."

  ### The Best Quinean Reply (The Defense of the Asymmetry)

  To be fair to Quine, we must construct the strongest defense of his asymmetry using his own texts (specifically *Pursuit of Truth* and *The Roots of Reference*).

  **The Argument from Causal Efficacy and Sensory Stimulation:**
  Quine would argue that you are conflating *studying* moral beliefs with *endorsing* moral values.
  1.  **The Empirical Checkpoint:** For Quine, the ultimate tribunal is *sensory stimulation*. Science is a tool for predicting the flux of experience. Mathematical objects are admitted only because they are indispensable *to that specific task*.
  2.  **Moral Inertness:** Moral values do not help predict sensory stimulation. Whether "murder is wrong" is true or false does not change the photon impacts on my retina when I witness a murder. The *belief* that it is wrong causes behavior, but the *truth* of the value does not.
  3.  **The Distinction:** We can quantify over "moral beliefs" (psychological states) without quantifying over "moral values" (objective posits). Science needs the former to explain behavior; it does not need the latter. Therefore, the indispensability argument applies to the psychology of morality, not the ontology of morality.
  4.  **Conclusion:** Admitting moral values violates the constraint of empirical significance. It adds ontological weight without predictive power. This isn't "first philosophy"; it's adherence to the empirical method that defines science.

  ### The Rebuttal: Why the Quinean Defense Fails

  This defense is strong, but it ultimately collapses under the weight of Quine's own **naturalism** and his rejection of the **analytic/synthetic distinction**. Here is why a consistent Quinean must reject the reply above.

  **1. The "Sensory Stimulation" Criterion is Itself a Dogma**
  Quine's insistence that all meaningful discourse must ultimately cash out in predictions of sensory stimulation is a relic of the very empiricism he claimed to dismantle in "Two Dogmas."
  *   **Naturalism Trumps Empiricism:** If naturalism means "trust science," then we must trust what neuroscience and evolutionary biology tell us. These sciences suggest that moral cognition is not merely a "sentiment" but a complex, evolved mechanism for tracking social realities (cheater detection, coalition building).
  *   **The Inconsistency:** Quine accepts "forces" and "fields" which are not directly observable, because they explain physical events. If moral values explain *social* events (which are observable behaviors), why are they excluded? To say "social events don't count as empirical data" is to draw an arbitrary line between physical science and social science. A thoroughgoing naturalist cannot do this.

  **2. The Indispensability of Normativity in Explanation**
  The Quinean reply suggests we only need to quantify over "moral beliefs." But this is often explanatorily insufficient.
  *   **Example:** Consider the explanation: "The abolitionists succeeded because slavery was *actually unjust*."
  *   **Redundancy?** A Quinean might say, "No, it succeeded because they *believed* it was unjust." But in many causal models, the *truth* of the normative claim is the variable that explains the stability and spread of the belief. Just as we posit "truth" in logic to explain why certain inferences hold, we may need to posit objective "values" to explain why certain social equilibria are stable across cultures.
  *   **The Trap:** If Quine says we can't quantify over values because they don't predict photons, he is engaging in **reductionism**. He is trying to reduce social science to physics. But Quine explicitly rejected reductionism (the failure of the second dogma). If social science is autonomous, it gets its own ontological commitments based on *its* indispensability, not physics'.

  **3. The "Observation Sentence" is Theory-Laden**
  Quine admits observation sentences are theory-laden. What counts as an "observation" depends on our conceptual scheme.
  *   If our best conceptual scheme for understanding human interaction requires treating "rights" or "obligations" as real posits (much like we treat "centers of gravity" as real posits in physics, even though they are abstract), then they earn their place in the web.
  *   To exclude them because they don't map to *physical* stimulation is to privilege the vocabulary of physics over the vocabulary of sociology. This violates the Quinean principle that all knowledge is a "man-made fabric which impinges on experience only along the edges." The "edges" for a social animal include social friction and coordination, not just retinal irritation.

  ### Conclusion: The Unearned Exception

  You are right to feel the tension. Quine's exclusion of moral values is an unearned exception.

  He grants existence to sets because they are indispensable to physics, even though sets are abstract and causally inert. He denies existence to values because they are (allegedly) not indispensable to physics. But if naturalism is true, **physics is not the measure of all being; science is.**

  If our best *scientific* theory of human behavior requires us to quantify over moral values to explain the data (behavioral regularities, social structures, historical shifts), then "to be is to be the value of a bound variable" compels us to accept them. To stop short is to allow a residual, dogmatic empiricism (the demand for physicalistic prediction) to override his own revolutionary naturalism.

  A consistent Quinean should argue that moral values are theoretical posits, justified by their indispensable role in the social-scientific sector of the web of belief, enjoying the same ontological status as numbers: abstract, causally mediated, but undeniably real.
