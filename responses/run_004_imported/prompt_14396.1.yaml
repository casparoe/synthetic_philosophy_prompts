      *   Overall: Woodward is in better shape for *scientific practice* (which matters to the user). Lewis is in better shape for *modal metaphysics* (which matters less to the user).
      *   *My take:* Woodward is more robust because it aligns with how we actually investigate the world (experiments), whereas Lewis relies on intuitions about "closest worlds" which are notoriously fuzzy.

