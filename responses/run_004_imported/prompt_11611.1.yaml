answer: |-
  Thank you all for being here. For those of you who don't know me, I'm [Your Name], and I had the privilege of being her child.

  Standing here, looking out at this room, I see two distinct groups. On one side, I see my family and our friends. You know her as Mom, as a sister, as a neighbor. You know her for the way she listened, the way she cooked, the way she made you feel like you were the only person in the world when you were hurting.

  On the other side, I see her colleagues and students. You know her as the philosopher who spent thirty years fighting a very specific battle. You know the names: Jaegwon Kim, causal exclusion, non-reductive physicalism. You know she defended the "Subset View."

  Usually, in a eulogy, you are expected to choose one of these audiences. You either speak the language of the heart, suggesting her spirit is now free from her body, or you speak the language of the hard sciences, suggesting that when the brain stopped, she stopped.

  But if I did either of those things, I would be dishonoring her. Because her entire life's work was a refusal to accept that those two things are enemies.

  For thirty years, my mother fought against the idea that the mind and the body are rivals fighting for credit. The prevailing argument in her field was that if the physical world is complete—if neurons and physics cause everything—then there is no room left for the mind to do anything. The fear was that if science explains the cause, love is just a story we tell ourselves.

  She hated that. She refused to accept that we have to choose between being physical beings and being meaningful agents.

  Her solution—the Subset View—was elegant. She argued that mental properties don't compete with physical properties. They aren't two different drivers fighting for the same steering wheel. Instead, the causal powers of the mind are a *subset* of the causal powers of the physical.

  I know that sounds technical. But what it means, in plain English, is this: She believed that when she hugged us, it wasn't that her arms moved *and* her love hovered somewhere above them. Her love was the specific, organized pattern of that movement. The physical did the work, yes. But the *meaning* of that work—the love, the comfort, the intention—was real. It wasn't a ghost. It was the shape of the physical itself.

  She believed that specificity matters. A sledgehammer and a scalpel might both be made of steel. They might both have the physical power to cut. But only the scalpel has the specific power to perform surgery. The surgery isn't done by the steel alone; it's done by the steel arranged with specific intent.

  To my mother, the mind was the scalpel. It was real. It was physical. And it mattered.

  Now, I won't stand here and pretend I have mastered her life's work. Two days ago, my friend Dee and I sat on my floor and argued for two hours about whether her theory actually solved the problem. Dee argued that if the mental is just a subset of the physical, it's not adding anything new. I struggled to answer that. I am still struggling with it.

  But then I looked at the notes she left behind. I looked at the emails she sent me when I was struggling. I looked at the way her students speak about her.

  And I realized that the debate about whether the mental is "redundant" misses the point of why she fought for it in the first place. She didn't fight for the Subset View because she wanted to win a technical point in a journal. She fought for it because she needed to know that her love was causally efficacious.

  She needed to know that when she comforted a grieving student, or when she held my hand, or when she argued for what was right in a faculty meeting, that *she* was doing it. Not just her neurons. Not just the laws of physics. *Her.*

  If she were here, I think she would tell us that the question "Did it really do anything?" is the wrong question. The right question is, "What kind of difference did it make?"

  A ghost cannot make a difference in the physical world. And dead matter, without organization, cannot make a difference of meaning. But a person? A person is the intersection. Her love was not a magic spell cast over her biology. Her love was the highest, most complex, most specific organization of her biology. It was the subset of her physical powers that was capable of changing *us*.

  And it did change us.

  That is the proof of the theory. If her mind had no causal power, I would not be standing here different than I was before I met her. If her love was just a story, it would not have built the resilience I feel right now. The effects are in the room. They are in the students whose careers she launched. They are in the family she held together. They are in me.

  To her colleagues: She held the line. She never caved to the idea that we are just atoms bouncing in the void. She insisted that we are real agents until the end.

  To my family: Her love was not a metaphor. It was a force. It was as real as the gravity that keeps us on the ground, but far more specific. It shaped us. It guided us. It caused us to become who we are.

  There is a temptation, in grief, to say that she is "watching over us" now. To suggest her mind has detached from the physical and is floating somewhere better. I know she would ask me not to say that. She believed her mind was inextricably linked to her body. When her body died, her specific powers ceased. She is not watching us.

  But—and this is the part that matters—causal powers are not lost; they are transferred.

  The Subset View teaches us that mental properties are inherited from the physical. In a very real way, we are now the physical realizers of her legacy. Her causal powers live on insofar as we continue the patterns she started. When I act with the integrity she taught me, her mental properties are being realized again, through me. When her students teach with her compassion, her causal powers are active in this world.

  She is not a ghost. She is a cause. And we are the effects that will now become causes ourselves.

  So, I will not say her spirit lives on. I will say her work continues. I will say her love was physical, it was real, and it was powerful enough to rearrange the atoms of this room, and the atoms of my heart.

  She spent her career proving that the mind matters. Her life proved that *she* mattered.

  Thank you.
