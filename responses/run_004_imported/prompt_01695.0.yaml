      *   *Section 4: B's Final Challenge (The Meta-Claim).* Analyze the worry about metaphysical impossibility. This is very Wittgensteinian (don't say "can't," show "don't").
      *   *Conclusion:* Who is right? Both capture half the picture. The synthesis is that "hinge status" is a *role*, not a *property*.
