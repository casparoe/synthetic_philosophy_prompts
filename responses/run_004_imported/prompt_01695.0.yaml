      *   *Section 1: Student A's Opening (In Principle).* Analyze the "grammar" argument. Support: OC 341-343. Critique: Risks dogmatism.
      *   *Section 2: Student B's Counter (In Practice/Variability).* Analyze the "fluidity" argument. Support: OC 98. Critique: Risks losing the anti-skeptical bite.
