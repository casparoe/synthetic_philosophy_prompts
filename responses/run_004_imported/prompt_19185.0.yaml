  **Move 1 (Josh): +1**
  This is a strong social heuristic that preserves trust and reduces friction in relationships. However, as an epistemic rule, it is too blunt because it ignores the content of the claim, treating a mundane statement the same as a highly improbable boast.

  **Move 2 (Priyanka): +1**
  Priyanka correctly identifies the logical gap between "no evidence against" and "evidence for," which is philosophically sound. Yet, applying this rigorously to casual conversation is socially exhausting and implies a level of detachment that doesn't fit a friendship context.

  **Move 3 (Josh): +1**
  Josh effectively uses a *reductio ad absurdum* to show that radical skepticism makes daily life impossible, highlighting our reliance on testimony. The weakness is a false equivalence; believing in Australia (consensus reality) is fundamentally different from verifying a specific, self-serving anecdote.

  **Move 4 (Priyanka): +2**
  This is the strongest move because it introduces the crucial variables of *incentive* and *verifiability*. By distinguishing between low-stakes facts and high-reward boasts, she offers a nuanced framework that avoids both gullibility and paranoia.

  **Move 5 (Josh): -1**
  Josh misrepresents Priyanka's refined position from Move 4 by treating her calibration as a blanket suspicion of all compliments. This is a straw man argument that ignores her distinction about claims that are "hard to check" and "tempting to embellish."

  ### The General Rule: Calibrated Credulity

  Neither friend quite landed on the specific heuristic that resolves this, which is **Calibrated Credulity**. You should adjust your burden of proof based on three factors: the **prior probability** of the claim (beating a GM is rare), the **speaker's incentive** to embellish (status gain), and the **social cost** of expressing doubt.

  In Mara's case, the claim is low-probability and high-incentive, which justifies Priyanka's internal skepticism. However, because the social cost of demanding proof is high (insulting a friend), the correct move is to **accept the testimony socially while withholding full belief internally** unless independent verification arises later. You don't need to call her a liar to acknowledge the claim is extraordinary.
