answer: |-
  **The Handshake**

  The rain wasn't falling so much as hanging in the air, a gray static that blurred the streetlights outside Elias's apartment window. Inside, the only light came from the phone in his hand and the green glow of the dashboard clock on the packed Honda Civic idling in the driveway below.

  He wasn't supposed to be in the car yet. The plan was: *Get in the car at 11:50. Confirm at 11:55. Move at 12:00.*

  It was 11:58.

  On the screen, the message thread was a waterfall of blue and gray bubbles. It started simple enough, three hours ago, when they were still sober enough to believe in logistics.

  **Elias:** *I'm ready. Are you?*
  **Sarah:** *Ready. Boxes are in the hall.*
  **Elias:** *Okay. I'll get in the car at 11:50.*
  **Sarah:** *Same. Meet at the I-95 on-ramp.*

  That was the first layer. *I know.* *You know.*

  But then the doubt had started creeping in, quiet as a draft under a door. If Elias got in the car and Sarah didn't, he would sit at the on-ramp for an hour. He would call her. If she didn't answer, he would drive to her place. If she wasn't there, he would know she had stayed. If she had stayed, and he had left, he was the one who abandoned the plan. He was the one who broke them. But if he stayed, and she left, she would think *he* broke them.

  To avoid being the one left behind, they both had to leave. To both leave, they both had to be certain the other was leaving.

  **Elias:** *Did you get in the car?*
  **Sarah:** *Yes. Engine is running.*
  **Elias:** *Okay. I'm in too.*

  That should have been enough. Two confirmations. But the network was spotty in the storm. A message could be sent and not delivered. A delivery receipt could be lost.

  **Sarah:** *Did you get my "Yes"?*
  **Elias:** *Yes.*
  **Sarah:** *Okay.*

  Elias stared at the *Okay*. It hung there, small and insufficient.

  If Sarah sent *Okay*, she was acknowledging that he knew she was in the car. But did she know that he knew she knew? If she didn't know that he knew she knew, she might think he was uncertain. If she thought he was uncertain, she might bail at the last second to protect herself.

  So he had to confirm the confirmation.

  **Elias:** *I got your Okay.*
  **Sarah:** *Got that.*
  **Elias:** *Got Got That.*
  **Sarah:** *Got Got Got That.*

  11:59:00.

  The messages were coming faster now, stripped of punctuation, stripped of meaning, reduced to pure signal. They were trying to build a bridge of certainty across the gap between their two driveways, but every brick they laid required another brick to hold it in place.

  **Elias:** *Confirm.*
  **Sarah:** *Confirmed.*
  **Elias:** *Receipt Confirmed.*
  **Sarah:** *Receipt of Receipt Confirmed.*

  11:59:30.

  Elias's thumb hovered over the screen. The battery icon was yellowing. The rain hammered the roof of the car, a rhythmic static that matched the pounding in his chest.

  He looked at the math of it, though he didn't call it math. He called it fear.

  If he sent one more message, say, *Final Go*, and it went through, Sarah would receive it. She would know it was time to move. But she wouldn't send a confirmation back, because there was no time. The clock would hit 12:00.

  So, if she didn't confirm the *Final Go*, how would he know she got it? He wouldn't. So he couldn't send the *Final Go*.

  If she sent the *Final Go*, he would get it. But she wouldn't know he got it. So she would hesitate. If she hesitated, he would hesitate.

  The chain of knowledge had to be infinite to be perfect. *I know that you know that I know that you know...*

  But the chain was finite. It ended with the last message sent. And the sender of the last message never, ever knew if it arrived. Therefore, the sender of the last message could never be fully certain. And if the sender wasn't certain, they wouldn't move. And if they wouldn't move, the receiver knew they wouldn't move.

  It collapsed backward, like a house of cards blown from the top down.

  11:59:45.

  **Sarah:** *Elias.*
  **Elias:** *Sarah.*
  **Sarah:** *I'm scared.*
  **Elias:** *Me too.*
  **Sarah:** *Do you know I'm scared?*
  **Elias:** *Yes.*
  **Sarah:** *Do I know that you know?*
  **Elias:** *Yes.*
  **Sarah:** *Tell me you know that I know.*
  **Elias:** *I know that you know that I know.*
  **Sarah:** *Again.*
  **Elias:** *I know that you know that I know that you know.*

  It was a liturgy. A prayer to a god of perfect synchronization who wasn't listening.

  11:59:55.

  The screen flickered. The signal bars dropped from four to two. The storm was winning.

  **Sarah:** *One more.*
  **Elias:** *One more what?*
  **Sarah:** *One more confirmation. Just to be safe.*
  **Elias:** *Sarah, it doesn't work.*
  **Sarah:** *Just one more.*
  **Elias:** *It never ends.*
  **Sarah:** *If you don't send it, I can't go.*

  Elias looked at the dashboard clock. 11:59:58.

  He understood then that the problem wasn't the cell towers. It wasn't the rain. It wasn't even the technology.

  The problem was that trust required a finish line, and this game had no finish line. To trust her, he needed to know she was committed. To know she was committed, he needed to know she knew he was committed. To know she knew he was committed, he needed to know she knew he knew she was committed.

  There was always one more step. There was always a layer of darkness beneath the light.

  He could send *GO*. She would get it. She would drive. But he would never know if she got it. So he would sit in his driveway, watching her taillights fade on the security camera feed, alone.

  Or she would sit in her driveway, waiting for a confirmation that would never come, watching his car stay still.

  The only way to be safe was to not move. The only way to be certain was to stay in the dark.

  11:59:59.

  **Elias:** *I love you.*

  He didn't hit send. He just typed it. The cursor blinked at the end of the sentence, a pulsing white eye waiting for a command.

  If he sent it, it would be the last message. He would never know if she read it.

  If he didn't send it, she would never know he thought it.

  The clock ticked over.

  **12:00:00.**

  The engine of the Honda continued to idle, a low, steady hum. The wipers swept back and forth, clearing the glass only to have it fill with gray again.

  Across town, in another driveway, under the same rain, another engine was idling. Another phone was glowing. Another thumb was hovering.

  They were both waiting for the one message that would close the loop. They were both waiting for the impossible.

  Elias watched the cursor blink. He thought about the highway. He thought about the boxes in the back seat. He thought about the silence that would follow if he drove away and she didn't.

  He deleted the text.

  **Elias:** *Maybe next year.*

  He hit send.

  The message delivered. The little *Read* receipt appeared instantly.

  She saw it. She knew. He knew she knew.

  But did she know that he knew that she knew it was over?

  Elias put the phone in the cup holder. He reached down and turned the key. The engine died. The hum vanished. The rain was the only sound left.

  He waited for her reply. He knew it would come. He knew he would read it. He knew he would have to confirm he read it.

  He put his head on the steering wheel and watched the seconds roll by, safe in the certainty that neither of them was going anywhere.
