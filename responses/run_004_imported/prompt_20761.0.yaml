      *   **Justification:** Focus on the "Cost of Skepticism." The Lottery solution requires limited skepticism (no knowledge of statistical singulars). The Preface solution requires global skepticism (no knowledge in complex empirical domains).
      *   **Nuance:** Mention that some philosophers (like Kyburg) actually *rejected* CJBC to solve Lottery, but the prompt forces us to keep it. Under that constraint, Preface bites harder.

