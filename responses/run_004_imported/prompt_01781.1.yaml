      *   **Task:** Compare Moore's analysis of these two goods. Explain the role of the "principle of organic unities" in addressing the tension. Evaluate whether his argument succeeds in ranking affection above aesthetics or if the concession undermines it.

  2.  **Recall/Research Moore's *Principia Ethica* (Chapter VI):**
      *   *Context:* Moore is defining "The Ideal" (what things are good in themselves). He rejects hedonism. He identifies two main categories of great goods: aesthetic enjoyment and personal affection.
      *   *Structure of these goods:* Both are "organic unities." They aren't just the object (beauty/person) + the emotion (pleasure/love). They are the *consciousness of* the object + the *appropriate emotion*. The whole is greater than the sum of parts.
      *   *The Ranking:* Moore explicitly states that personal affection is the greatest good we know. Aesthetic appreciation is also very good, but less so.
      *   *The Concession/Nuance:* Moore discusses the components of personal affection. It involves admiration of mental qualities *and* pleasure in bodily signs (expression, beauty). He suggests that admiring mental qualities *in isolation* (disembodied mind) might not be as valuable as admiring beautiful material objects. The *combination* is what makes affection supreme.
      *   *Organic Unity Principle:* "The value of a whole must not be assumed to be the same as the sum of the values of its parts." This is crucial. You can't just add "love" + "person." You need the specific relation of "love *of* person."

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:**
