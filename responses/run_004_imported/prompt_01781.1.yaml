answer: |-
  In Chapter VI of *Principia Ethica*, titled "The Ideal," G. E. Moore seeks to identify those things that possess intrinsic value. Having dismissed hedonism, Moore identifies two primary categories of great goods: the aesthetic appreciation of beauty and the pleasures of personal affection. Both are analyzed through the lens of his famous "principle of organic unities," which dictates that the value of a whole is not necessarily the sum of the values of its parts. Moore asserts that personal affection is the greatest good we know, surpassing aesthetic appreciation. However, he introduces a complicating concession: the admiration of mental qualities in isolation may be worth no more, or even less, than the appreciation of physical beauty. This essay will argue that Moore's reliance on the principle of organic unities successfully resolves the apparent tension between this concession and his hierarchy of goods. The concession does not undermine the ranking of affection above aesthetics; rather, it clarifies that the supreme value of affection lies not in the abstract contemplation of mind, but in the specific, complex unity of emotion directed toward the embodied person.

  To understand Moore's argument, one must first grasp his structural analysis of these goods. For Moore, neither the object of appreciation (the beautiful thing or the beloved person) nor the subjective feeling (the emotion) possesses significant intrinsic value in isolation. Value arises only in the "organic unity" of a state of consciousness that includes both the cognition of the object and the appropriate emotion toward it. In the case of aesthetics, the good is the consciousness of a beautiful object accompanied by appropriate admiration. In the case of personal affection, the good is the consciousness of another person's qualities accompanied by love. The principle of organic unities is crucial here because it allows Moore to claim that the whole state (consciousness + object + emotion) has a value vastly greater than the sum of the object's value and the emotion's value taken separately.

  Moore ranks personal affection above aesthetic appreciation, yet he acknowledges a nuance that seems to threaten this hierarchy. He suggests that if one were to admire a person's mental qualities (their character, intellect, virtue) apart from any bodily expression, this admiration might be less valuable than the appreciation of mere physical beauty. On the surface, this creates a tension: if the "mental" component of affection is less valuable than the "physical" component of aesthetics, how can the totality of affection be superior? If the core of loving a person is valuing their mind, and valuing a mind is less valuable than valuing a beautiful object, the hierarchy seems unstable.

  However, the principle of organic unities is the mechanism Moore uses to dissolve this tension. The concession regarding mental qualities applies only to an abstracted *part* of the organic whole, not the *whole* itself. Moore argues that in actual personal affection, we do not love a disembodied mind. We love the person, which involves a synthesis of admiring their mental qualities and taking pleasure in their bodily signs and expressions. The value of personal affection is emergent; it arises from the specific interaction between the emotion of love and the complex object (the embodied person).

  According to Moore, the emotion appropriate to a person is different in kind and intensity from the emotion appropriate to a beautiful object. While aesthetic appreciation involves admiration, personal affection involves a more intense, reciprocal, and complex emotional state. Therefore, even if the cognitive appreciation of "mind alone" is less valuable than "beauty alone," the organic unity formed by "love of an embodied mind" generates a higher degree of intrinsic value than "admiration of beauty." The principle of organic unities permits the value of the combination to exceed the value of the constituents. Thus, the concession that mental qualities alone are less valuable than physical beauty does not lower the value of affection, because affection is not constituted by mental qualities alone. It is constituted by the unity of mental admiration, bodily pleasure, and specific emotional love.

  Does this argument succeed? It succeeds within the internal logic of Moore's system, provided one accepts the principle of organic unities. The concession regarding mental qualities actually strengthens Moore's position against a potential critique: that he is a dualist who privileges "spirit" over "matter." By admitting that admiring a disembodied mind is not the highest good, Moore grounds the highest good in the human reality where mind and body are integrated. He avoids the pitfall of claiming that abstract virtue is inherently more valuable than concrete beauty. Instead, he argues that the *relation* of love toward a concrete human being creates a unique value that neither abstract virtue nor abstract beauty can achieve independently.

  However, a critic might argue that Moore's use of organic unities here is somewhat ad hoc. If the value of the whole is not derived from the parts, what determines the value of the whole? Moore relies on intuition to judge that the unity of affection is greater than the unity of aesthetics. The concession about mental qualities could be seen as undermining if one argues that the "mental" aspect is the defining feature of personal affection. If the mental aspect is less valuable than physical beauty, and the bodily aspect is merely "physical beauty," then affection seems to be merely "physical beauty plus something less valuable." But Moore would reject this additive model. He insists the emotion transforms the object and the object transforms the emotion. The love felt for a person imbues their physical expression with a significance that mere aesthetic beauty lacks.

  Ultimately, the concession does not undermine the ranking because the ranking applies to the *ideals* (the complete organic unities), not the *ingredients*. Moore's argument succeeds in showing that personal affection deserves to rank above aesthetic appreciation because it represents a richer, more complex organic unity. The inclusion of the bodily expression is not a necessary evil that drags down the value of mental admiration; it is an essential component that, when unified with the appropriate emotion, unlocks the higher value. Without the bodily expression, the "mental admiration" remains a lower good (as per his concession). Without the mental admiration, the "bodily pleasure" remains mere aesthetics. It is only in the synthesis—protected and explained by the principle of organic unities—that the supreme value of personal affection is realized.

  In conclusion, Moore's analysis in Chapter VI relies heavily on the principle of organic unities to navigate the complexities of intrinsic value. The apparent tension between the superiority of affection and the lesser value of isolated mental admiration is resolved by recognizing that personal affection is a distinct whole, not a sum of parts. The concession serves to highlight that the supreme value of affection is contingent upon the integration of mind, body, and emotion. Therefore, the argument holds: personal affection ranks above aesthetic appreciation not because the mind is superior to matter in isolation, but because the conscious love of an embodied person constitutes the most valuable organic unity available to human experience.
