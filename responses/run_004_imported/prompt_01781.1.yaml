          *   *Verdict:* It succeeds *within his system*. The concession doesn't undermine the ranking because the ranking applies to the *wholes*, not the *parts*. The concession actually strengthens the argument by showing he isn't simply fetishizing "mind" over "matter," but valuing the specific human synthesis.

      *   **Conclusion:**
