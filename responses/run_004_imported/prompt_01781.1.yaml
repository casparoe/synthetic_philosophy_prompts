          *   Emphasize that the value lies in the *whole state of consciousness*, not just the object or the emotion alone.

      *   **Section 2: The Ranking and the Tension:**
          *   Moore's claim: Affection > Aesthetics.
          *   The Concession: Admiration of mental qualities *alone* $\le$ Appreciation of physical beauty.
          *   Why is this a tension? If the "mental" part of affection is weak, how is the whole stronger?
          *   Moore's resolution: Personal affection isn't *just* admiring mental qualities. It includes the pleasure in bodily signs/expression *combined* with the admiration. It is a more complex, richer unity.

      *   **Section 3: The Role of Organic Unities in Resolving the Tension:**
          *   The principle allows Moore to say: Part A (Mental Admiration) is low value. Part B (Bodily Beauty) is medium value. But Whole C (Affection combining A + B + Emotion) is highest value.
          *   The interaction matters. The emotion is *different* in kind when directed at a person vs. a thing.
          *   The "appropriate emotion" for a person is more intense/valuable than for an object.
          *   Therefore, the concession about mental qualities is about an *abstracted part*, not the *concrete whole* of personal affection.

      *   **Section 4: Evaluation (Does it succeed?):**
