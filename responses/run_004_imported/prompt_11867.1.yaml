answer: |-
  **The Echo Protocol**

  The consent form is three pages long, but the real contract is the silence sitting between me and David at the kitchen table.

  "Tell me again," he says. He's holding his coffee mug. I look at the mug. Soon, I won't see a mug. I'll hear the clay being dug in 1998, the kiln's heat, the shock of the dishwasher, the micro-fracture in the handle from last Tuesday. I will hear the object's biography.

  "I told you," I say. My voice sounds thin. "It's the only way to access the deep data. The acoustic archaeology."

  "You'll be deaf to us, Elena."

  "Not deaf. Just... focused."

  "You won't hear me speak," David says. He puts the mug down. It clinks. To me, right now, it's a clink. In forty-eight hours, after the implant activates, that clink will be a scream of silica and fire. It will be so loud, so *textured*, that a human voice will sound like static. "You won't hear me say I love you. You'll hear the vibration of my vocal cords and the history of the air in the room. You'll hear the *physics*, Elena. Not the meaning."

  I know this. This is the epistemic wall. I am trying to use my current brain to evaluate a experience my current brain is structurally incapable of processing. I am trying to assign a utility value to a sensation I cannot imagine. It's like trying to explain the taste of salt to someone who has only ever drunk distilled water, but worse. It's like choosing to become a creature that eats salt instead of food.

  "If I don't do this," I say, and I reach for the pen, "I'll spend the rest of my life wondering what the world sounds like without the filter of language. I'll wonder what truth feels like."

  "Truth?" David laughs, but it's a broken sound. "You value *us*. That's your truth. You value Sunday mornings. You value inside jokes. Those are your core preferences, Elena. You're trading them for... noise."

  "Data," I correct.

  "Alienation," he counters.

  He's right, of course. From the perspective of *Current Elena*, this is a terrible trade. Current Elena loves David's voice. Current Elena derives utility from conversation, from shared narrative, from the soft lie of "how was your day?" Current Elena is a social animal.

  But the procedure doesn't just change my circumstances; it changes the animal.

  The *Future Elena*—the one who wakes up on Thursday—will not care about Sunday mornings. She will care about the resonance of the floorboards. She will value the integrity of materials over the integrity of promises. She will find beauty in the stress fractures of a bridge, not in the smile of her husband.

  I am making a choice for a stranger. I am betting that the stranger's happiness will be worth the current self's destruction.

  "Can you promise me," David asks, leaning in, "that when you hear me crying, you'll still know it's sadness?"

  "No," I say.

  I don't say it to be cruel. I say it because it is the only honest answer. To Future Elena, crying will be a hydraulic event. A pressure release. It will be fascinating. It will be beautiful. It will not be sad. Sadness is a story we tell ourselves about the water. I am choosing to stop telling the story.

  David pushes his chair back. The legs scrape the floor. To me: a screech. To her: a history of friction, of wood against wood, of the house settling.

  "You're already gone," he says.

  He walks out. I hear the door close. The latch engages. I hear the metal tumblers slide into place. I hear the history of the lock, the grease, the tension of the spring.

  It is already louder than his voice.

  I pick up the pen. My hand is shaking. I am optimizing for a value system I do not possess. I am sacrificing a love I can feel for a truth I can only guess at. Rational choice theory says I should maximize my expected utility. But how do I calculate the utility of a self that does not exist yet?

  The pen touches the paper.

  I sign.

  I close my eyes and wait for the world to end, so the new one can begin.
