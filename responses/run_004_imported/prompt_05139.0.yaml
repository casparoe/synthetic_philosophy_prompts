prompt: |-
  Okay, I've been slowly loosing my mind prepping for my quals reading group next week because the section on the bank cases keeps collapsing two views in my head that are suppose to be importantly different: epistemic contextualism (DeRose/Cohen/Lewis-style) and pragmatic encroachment / subject-sensitive invariantism (Stanley, Hawthorne, Fantl & McGrath). I can recite the textbook difference fine — contextualism says the *semantics* of "knows" shifts with the attributor's conversational context, so the truth-conditions of the sentence move around, whereas encroachment keeps "knows" rigid and instead makes the subject's own practical stakes part of what has to be satisfied for her to count as knowing, no semantic wiggle room needed. But every time I try to actually apply that distinction to a harder case instead of just reciting it, I get muddled, and my officemate is convinced I don't actually understand either view, which is rude but maybe fair.

  Here's the case that's breaking my brain: imagine a subject who is genuinely in the high-stakes version of the bank case (huge payment due, hours really matter) but has absolutely no idea her stakes are elevated — internally, her evidence and confidence are identical to the low-stakes twin. Encroachment views seem committed to saying something uncomfortable about her knowledge depending on facts she isn't even tracking, which feels like it violates some baseline access intuition. But I don't think contextualism gets off easy either, once you ask whether a bystander who *does* know about the payment, and the oblivious subject herself, could both truthfully attribute (or deny) knowledge to her at the very same moment without genuinely disagreeing. Could you walk through how each theory is structurally committed to handling this ignorant-high-stakes scenario, and tell me which one comes out looking less ad hoc as a result? Please don't just hand me the SEP-summary version of the two views — I need the actual comparative payoff for this specific case, since that's the bit I have to defend out loud next week.
