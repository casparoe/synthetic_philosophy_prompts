answer: |-
  First, take a breath. Your officemate is being unhelpful. This specific knot—the **Ignorant High-Stakes (IHS)** case—is arguably the sharpest wedge between Contextualism and Encroachment, and it is *supposed* to feel uncomfortable. It forces you to choose between two intuitions that usually travel together: (1) that knowledge should guide action safely, and (2) that a subject should be able to tell by reflection whether they know.

  The reason you are getting muddled is that in standard Bank Cases (where the subject *knows* the stakes), Contextualism and Encroachment often predict the same verdicts for the same attributor, just for different reasons. The IHS case breaks that overlap. It separates the **Subject's Conversational Context** (which is Low, because she's oblivious) from the **Subject's Practical Stakes** (which are High, because reality is harsh).

  Here is the structural breakdown of how each theory handles the IHS case, followed by the comparative payoff on "ad hoc"-ness that you can use in your reading group.

  ### 1. The Setup: Ignorant High-Stakes
  *   **Subject (S):** Believes the bank is open Saturday. Evidence: Was there two weeks ago.
  *   **Stakes:** High (bill due Monday, penalty if missed).
  *   **Awareness:** S is **ignorant** of the stakes. She thinks it's a routine deposit.
  *   **Bystander (B):** Knows the stakes are high.
  *   **The Question:** Does S know the bank is open?

  ### 2. Subject-Sensitive Invariantism (SSI) / Pragmatic Encroachment
  **The Verdict:** S does **not** know.
  **The Mechanism:** Knowledge is invariant, but the truth-conditions for "S knows that p" include a clause about S's *actual* practical environment. Since the penalty for error is high, the evidential threshold required to count as "knowing" is raised. S's evidence (memory from two weeks ago) clears the Low-Stakes bar but fails the High-Stakes bar.

  **The "Uncomfortable" Consequence:** S cannot know whether she knows. She reflects on her evidence and thinks, "I have enough for knowledge," but she is wrong because she is blind to the stakes raising the bar.
  **Why SSI proponents bite this bullet:** They argue knowledge is the norm of practical reasoning. If S acts on her belief ("The bank is open") and deposits the check, she risks a penalty. Even if she *feels* calm, her *position* is risky. SSI prioritizes the **safety of the action** over the **transparency of the status**.
  **Is it Ad Hoc?** In this specific case, **no.** It is structurally consistent. SSI claims knowledge is a relation between a subject, a proposition, and an environment. The environment includes the stakes. S's ignorance of the environment doesn't change the environment. To say otherwise would be to claim that wishing the stakes were low makes them low.

  ### 3. Epistemic Contextualism (EC)
  **The Verdict:** It depends on **who is speaking**.
  **The Mechanism:** The extension of "knows" shifts based on the *attributor's* conversational context (specifically, the salience of error possibilities or stakes).

  *   **Scenario A (S attributes to herself):** S is in a Low-Stakes conversational context (because she is ignorant of the high stakes). The standards are low.
      *   *Verdict:* "I know the bank is open" is **True**.
  *   **Scenario B (B attributes to S):** B is in a High-Stakes conversational context (because B knows about the bill). The standards are high.
      *   *Verdict:* "S knows the bank is open" is **False**.

  **The "Uncomfortable" Consequence:** S and B are both speaking truly, despite appearing to disagree. If S says "I know" and B says "No, you don't," EC says they are talking past each other (like one person saying "It's raining here" and another saying "It's not raining there").
  **Is it Ad Hoc?** In this specific case, **yes, potentially.** EC has to explain why S is rationally permitted to assert "I know" even though acting on that claim will lead to disaster. EC saves the *truth of the sentence* S utters, but it severs the link between *knowing* and *successful action*. It looks like semantic wiggle room to preserve the intuition that S is speaking correctly, even if S is practically imperiled.

  ### 4. The Comparative Payoff: Which is Less Ad Hoc?
  For your reading group, you can frame the "ad hoc" charge not as a general slam, but as a trade-off between **Metaphysical Unity** (SSI) and **Linguistic Phenomenology** (EC).

  **Argument for SSI being less ad hoc in IHS:**
  SSI provides a **single, unified fact of the matter** about S's epistemic status. S either has the standing to act or she doesn't. In the IHS case, S lacks the standing because the risk is real, regardless of her awareness.
  *   *The Line:* "SSI treats knowledge as a normative status in the world. If the world is high-stakes, the status is harder to achieve. S's ignorance is an epistemic failure, not a metaphysical shield. EC, by contrast, makes knowledge vanish or appear based on who is talking, which seems irrelevant to whether S should deposit the check."

  **Argument for EC being less ad hoc in IHS:**
  EC respects the **first-person authority** of the subject. S has done all the epistemic work she can do; she has gathered evidence appropriate for the situation *as she understands it*. To deny her knowledge because of a fact she couldn't access feels like changing the rules mid-game.
  *   *The Line:* "EC treats knowledge attributions as tools for managing conversation. S is correctly signaling to her peers that she has done enough inquiry *for her purposes*. B is correctly signaling that *for his purposes* (saving S from ruin), more is needed. SSI conflates the practical risk with the epistemic status, making knowledge too dependent on luck."

  ### 5. Your Strategy for the Reading Group
  When you are put on the spot, do not try to prove one side is "True." Instead, use the IHS case to show you understand the **structural commitment** of each view.

  **Say this:**
  > "The Ignorant High-Stakes case clarifies that the debate isn't just about whether stakes matter, but *whose* stakes and *whose* context matter.
  >
  > **SSI** is committed to the view that knowledge is **Subject-Sensitive but Attributor-Invariant**. In the IHS case, SSI says S lacks knowledge because the *Subject's* actual stakes raise the bar, regardless of what anyone says. This preserves the link between knowledge and action but sacrifices Internalism (S can't tell she doesn't know).
  >
  > **Contextualism** is committed to the view that knowledge is **Attributor-Sensitive**. In the IHS case, EC says S *does* know (relative to her low-standards context) but B is also right to deny it (relative to his high-standards context). This preserves the intuition that S is reasoning correctly from her perspective, but it fractures the disagreement (S and B aren't really contradicting each other).
  >
  > If we think the primary function of 'knows' is to guide action safely, SSI handles the IHS case less ad hoc-ly because it acknowledges the risk is real. If we think the primary function of 'knows' is to certify inquiry relative to a conversational purpose, EC handles it better because it validates S's inquiry process."

  **The "Mic Drop" distinction:**
  If they press you on which is *less ad hoc*, lean toward **SSI** for this specific case.
  Why? Because in the IHS case, Contextualism has to claim that S *knows* (in her context) even though acting on that knowledge will ruin her life. That severs the connection between knowledge and rational action. SSI keeps that connection intact. It is less ad hoc to say "You didn't know because you were in a dangerous position" than to say "You knew, but you shouldn't have acted on it," or "You knew relative to you, but didn't know relative to me."

  **Summary for your notes:**
  *   **IHS Case:** Subject Stakes = High; Subject Context = Low.
  *   **SSI:** Stakes win. S does not know. (Cost: Access/Internalism).
  *   **EC:** Context wins. S knows (when speaking); S doesn't know (when B speaks). (Cost: Disagreement/Action-Guidance).
  *   **Winner on Ad Hoc:** SSI, because it doesn't have to multiply truth-values to explain why S is in trouble.

  You understand the views fine; you're just wrestling with the fact that they both demand counter-intuitive sacrifices in hard cases. That's the job, not a failure on your part. Good luck next week.
