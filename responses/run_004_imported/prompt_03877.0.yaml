  2.  **Deconstruct the No-Trade Theorem (Milgrom & Stokey, 1982):**
      *   *What is it?* It states that if agents start at a Pareto-efficient allocation (ex-ante), have common priors, and update beliefs via Bayes' rule, then no trade can occur based on private information alone.
      *   *Why?* Because trade is a negative-sum game (due to transaction costs) or zero-sum (without them) regarding information. If I sell, you buy. If we both know the other is rational, we infer something from their willingness to trade.
      *   *The "Unraveling" Logic:* It's an iterative process of inference.
          *   Level 0: I want to trade because I have info $X$.
          *   Level 1: You see me wanting to trade. You ask "Why?" You realize I must have info $X$. You update your belief. Now the price adjusts.
          *   Level 2: I know you know I have info $X$. I anticipate the price adjustment. The profit opportunity disappears.
          *   Equilibrium: The price adjusts *instantly* to reflect the info, leaving no gain from trade.

  3.  **Address the User's Specific Questions:**

      *   **Q1: Mechanism of Revelation (Limit Orders):**
