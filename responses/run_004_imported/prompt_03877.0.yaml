      *   *Key Distinction:* The theorem says *speculative* trade based purely on information differences cannot happen. It doesn't ban trade for *liquidity* or *hedging*.

      *   *Addressing the "Limit Order" question:* In the model, market makers are rational. If they see an order that looks informed, they adjust the quote. The trade only executes if the price adjusts to eliminate the informed trader's edge. So the "revelation" happens because the counterparty is modeled as an intelligent inference engine, not a passive order book.

      *   *Addressing the "Assumptions":* Highlight "Common Priors." This is the big one. If we start with different worldviews, the theorem fails. Also "Common Knowledge of Rationality."

      *   *Addressing "Volume":* Yes, economists blame "Noise Traders" (Black 1986) or Liquidity Traders. Without them, the market freezes.

  5.  **Self-Correction/Review during drafting:**
