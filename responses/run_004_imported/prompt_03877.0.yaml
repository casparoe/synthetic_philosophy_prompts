          *   *Correction/Nuance:* In the strict theorem, trade *doesn't happen*. The price adjusts to the point where trade is no longer mutually beneficial. The user asks how the order reveals info *before* acceptance. The answer is: In the theoretical model, the *attempt* to trade at the old price is the signal that forces the price to move before the trade clears.

      *   **Q2: Assumptions (Common Priors, Rationality, Common Knowledge):**
          *   Yes, it requires "Common Knowledge of Rationality" and "Common Priors."
          *   This is the "wild assumption" the user suspects. Everyone must agree on the probability distribution of the world *before* getting private signals.
          *   Everyone must know that everyone else is a Bayesian updater.

      *   **Q3: Real World Volume:**
