      *Wait, a better way to explain the mechanism:* It's about *expectations*. If I know you are rational, I know you won't trade with me unless it's beneficial for you. If I have private info, I know trading is beneficial for me. If we both know this, we realize the trade is zero-sum (regarding info). If I sell, you infer I think price is low. You lower your bid. I anticipate this. I don't sell.

      *Let's structure the "Unraveling" clearly:*
