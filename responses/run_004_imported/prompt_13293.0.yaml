answer: |-
  Here is a draft of ten interview questions tailored to your guest's position and debating style. The first three form the requested sequence on the "disintegration thesis," while questions four through six address the specific objections from Hart, Dworkin, and the problem of disgust, complete with follow-ups. The final four questions broaden the scope to pluralism and policy specifics.

  ### Part 1: The Disintegration Thesis (Sequence)

  **1.** In your recent talks, you've clarified that the "disintegration thesis" isn't a sociological prediction that society will empirically collapse if morals change, but rather a conceptual claim about what constitutes a political community in the first place. Could you start by unpacking that distinction for us? If it's conceptual, what exactly is being "disintegrated" when a practice like surrogacy is permitted?

  **2.** Following up on that: if this is a conceptual claim rather than an empirical one, how do we identify the breaking point? Historically, societies have shifted their moral views on everything from usury to interracial marriage without ceasing to be societies. If the "concept" of society remains intact despite those shifts, what metric tells us that surrogacy is the line where the concept finally breaks?

  **3.** To press that further: philosophers usually agree that for a claim to be meaningful, there must be some state of affairs that could prove it false. If empirical history—like societies liberalizing without collapsing—doesn't count as evidence against your view, what *would* you accept as evidence that you are wrong? Is there any scenario where legal moralism would fail the conceptual test?

  ### Part 2: Classic Objections (With Follow-Ups)

  **4.** Devlin famously argued that the law is entitled to act on feelings of "intolerance, indignation, and disgust." However, history shows these feelings often track prejudice rather than moral truth—think of the disgust once directed at interfaith marriage or homosexuality. Why should the criminal law, which carries the state's violence, be anchored to feelings that have so frequently been morally mistaken?
  *   **Follow-up (if he argues these are "deep convictions" rather than raw emotions):** "Even if we call them 'deep convictions' rather than raw emotions, who gets to verify that distinction? If the feeling feels the same to the person holding it, how does the law distinguish between a deep moral truth and a deep prejudice?"

  **5.** H.L.A. Hart criticized Devlin for conflating "positive morality" (what people *happen* to believe) with "critical morality" (what is *actually* right). You argue the law should enforce the shared morality that binds the community. But if the community is bound together by a belief that is actually unjust or false, why should the law defer to that bond rather than trying to correct it?
  *   **Follow-up (if he argues the law's role is cohesion, not truth):** "So, if a community genuinely believed that surrogacy was a form of witchcraft that harmed the soul, you would support banning it even if science proved witchcraft isn't real? Is social cohesion valuable even when purchased at the price of factual error?"

  **6.** Ronald Dworkin argued that what looks like a moral consensus is often just people repeating what they've been told, or reacting to mistaken facts. Commercial surrogacy is a complex medical and legal arrangement. How can we be sure the "shared morality" you want to enforce is a genuine moral conviction, and not just a reaction to misunderstandings about how surrogacy actually works?
  *   **Follow-up (if he argues the consensus is robust):** "Given that most people form their moral views on headlines rather than legal contracts, wouldn't a 'cooling off' period of public education be a better first step than criminalization? At what point does enforcing a consensus become enforcing ignorance?"

  ### Part 3: Pluralism and Policy

  **7.** We live in a deeply pluralistic society where people disagree on the "good life." Devlin's original argument assumed a relatively homogenous England. In the modern U.S., whose morality counts as the "shared" one? If 55% of the country opposes surrogacy but 45% supports it, does enforcing the majority view corrode the community of the minority, defeating your own goal?

  **8.** Devlin himself suggested a "moderate" legal moralism, implying the law should only intervene when the moral violation is intolerable. How do you weigh the liberty interest of the individuals involved—the surrogate and the intended parents—against the abstract interest of "social cohesion"? Is there a proportionality test, or does the survival of the moral bond trump individual liberty entirely?

  **9.** Turning to the specific policy: Why commercial surrogacy specifically? There are other reproductive technologies, like IVF or egg donation, that also separate genetic, gestational, and social parenting. What is it about the *commercial* element that triggers the disintegration thesis? Is it the money, or the commodification of the body?

  **10.** Finally, for our audience of high school students interested in law and philosophy: If a student disagrees with your conclusion but accepts your premise that society needs some shared moral framework, what is the most constructive way for them to engage in this debate? Should they be arguing about surrogacy specifically, or about who gets to define the "shared morality" in the first place?
