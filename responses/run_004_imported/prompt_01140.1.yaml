answer: |-
  **Setting:** *The dimly lit lounge of the conference hotel. It is late evening, following the second day of a workshop on "Information and Causation in Biology." Elias, a retired molecular geneticist, and Sarah, a philosopher of biology with a background in developmental systems theory, sit with half-empty glasses of whiskey.*

  **Elias:** You gave them a thorough shaking today, Sarah. I saw a few of the postdocs looking like they'd been caught smuggling metaphors into their grant proposals.

  **Sarah:** *[Smiling]* Only the ones who treat "information" as a substance rather than a relation, Elias. But I saw you frowning during the Q&A. I assume the old guard isn't ready to surrender the "genetic code" just because a philosopher calls it a heuristic?

  **Elias:** It's not about surrender. It's about utility. But I'll admit, this retirement has given me the luxury of worrying about ontology. For thirty-five years, if I said a mutation "corrupted the code," my grad students knew exactly what pipette to pick up. But then I started reading Schrödinger. Did you catch the reference in the keynote?

  **Sarah:** The "code-script"? Hard to miss.

  **Elias:** It struck me. Schrödinger guessed the chromosome was a code-script before we knew it was DNA. But he worried it was also the "executive power." He thought the plan and the machinery were the same thing. We know now they aren't. The DNA is the tape; the ribosome is the player. And now, with my student's work in synthetic biology... they're swapping out the tape. They've freed up stop codons. They've added synthetic base pairs, X and Y. The cell reads them. It *translates* them. If I can rewrite the alphabet and the machine still reads it, how is "code" not literal?

  **Sarah:** Because the machine reads it only because *you* rewrote the machine to match the tape. That's my point, Elias. In synthetic biology, the "coding" relationship is imposed by the engineer. In nature, you're assuming that relationship exists independently of the observer. When you say the ribosome "reads" the mRNA, you're importing a semantic notion into a chemical interaction. The tRNA doesn't "know" it matches the codon; it fits by stereochemical affinity and kinetic proofreading.

  **Elias:** But that's where the normativity comes in. A chemical fit isn't just a fit; in biology, it's a *correct* fit. If a point mutation creates a premature stop codon, we don't say the protein is just "different." We say the translation was terminated incorrectly. The organism suffers a fitness cost. There is a standard of correctness here. A code requires rules, and rules imply the possibility of error. Natural selection fixes those rules. It establishes a "proper function" for the codon.

  **Sarah:** I know that move. You're channeling Millikan. You're saying natural selection naturalizes teleology. Because the lineage was selected for producing Protein X, any sequence that fails to produce Protein X is an "error." But does that actually earn you *semantic* normativity? Or does it just relocate the mystery?

  **Elias:** How so?

  **Sarah:** Selection explains why a trait persists. It doesn't explain how a physical molecule becomes a symbol. When a mutation occurs, the causal chain is broken or altered. Calling it an "error" is a description we apply from the outside, based on the outcome. But for a code to be literal, the normativity has to be intrinsic to the system, not just a retrospective judgment by the philosopher or the evolutionary historian. You're saying selection makes the DNA a "message." I'm saying selection just makes it a "cause" that happens to be stable.

  **Elias:** It's not retrospective. The cell's machinery acts *as if* there is a norm. The proofreading enzymes excise mismatches. They are enforcing the rule. The interpreter is the cellular machinery, shaped by selection to enforce the specific mapping of codon to amino acid. The convention is fixed by evolutionary history.

  **Sarah:** But the machinery is just more DNA and proteins. If the DNA is the code, what is the ribosome? If it's the interpreter, then the information isn't in the DNA alone. It's in the relationship between the DNA and the ribosome. And the ribosome depends on the cytoplasmic environment, the chaperone proteins, the methylation state... Why privilege the DNA as the sole bearer of "the" information?

  **Elias:** Because of causal specificity. If I change the DNA sequence, I get a specific, predictable change in the phenotype. If I change the temperature of the cytoplasm, I get noise. The DNA carries the *instructions*; the cytoplasm provides the *conditions*. Schrödinger worried the code-script was also the executive power, but we found they are distinct. The DNA is the only component with the combinatorial complexity to specify the organism.

  **Sarah:** "Instructions" is the word doing all the work there. In developmental systems theory, we argue that the cytoplasm constrains the DNA just as much as the DNA constrains the protein. Think about those synthetic base pairs you mentioned. You added X and Y. But you also had to engineer the polymerase to accept them, and the tRNA synthetase to charge them. If the "information" was truly in the DNA, why did you have to rebuild the context to make it readable?

  **Elias:** Because every code requires a shared key. If I send you an encrypted file, you need the decryption software. The existence of the software doesn't mean the file isn't encoded.

  **Sarah:** But in your analogy, *you* wrote the file and *you* wrote the software. In the cell, they co-evolved. There is no sender and no receiver, just a coupled chemical system. When you say "code," you imply the DNA could mean something else in a different context. And sure, in your synthetic lab, it can. But in the wild? The mapping is physically locked in. It's not arbitrary in the way a linguistic code is. It's frozen accident, perhaps, but now it's chemistry.

  **Elias:** Frozen accident or not, the system treats it as arbitrary. The ribosome doesn't check the chemistry of the amino acid; it checks the anticodon. That's the definition of a symbolic system. The physical properties of the symbol are irrelevant to its function; only its position in the system matters. That's why the synthetic base pairs work. They have different chemistry, but the system treats them as symbols. That has to be more than a metaphor.

  **Sarah:** It shows the system is *modular*, I'll grant you that. But "symbolic" implies a separation between the sign and the thing signified that doesn't exist in the causal flow of the cell. The tRNA brings the amino acid *because* of the physical history of the system, not because it "interprets" a symbol. You're insisting on the vocabulary of information because it helps you intervene. It's an engineering stance.

  **Elias:** And isn't science about intervention? If the information model allows us to predict outcomes, rewrite genomes, and cure diseases, in what sense is it "deflated"? It's explanatorily indispensable.

  **Sarah:** Indispensable for *intervention*, yes. Indispensable for *ontology*? No. You can fix a car by treating the engine like a black box with inputs and outputs, but that doesn't mean the engine is a computer. I'm worried that by reifying "information," you blind yourself to the causal contributions of the environment. If you think the DNA holds the "plan," you stop looking for where else the specificity might be hiding.

  **Elias:** I'm not blind to the environment. But I know that if I swap the nucleus of a frog egg, the development follows the nucleus, not the cytoplasm. That tells me where the specificities lie.

  **Sarah:** Until the clone fails because of epigenetic incompatibility in the cytoplasm. Look, Elias, we're at an impasse. You see a code because you see a linear mapping that supports counterfactuals. I see a causal bottleneck that we describe *as if* it were a mapping.

  **Elias:** *[Takes a sip]* A productive impasse, hopefully. But let's make it concrete. You say I'm reifying a metaphor. What would I have to find in the lab to make you admit there's literal information in the sequence?

  **Sarah:** That's a fair question. I think... if you could show that the developmental outcome was determined by the DNA sequence *independent* of the cellular context. If you could take a naked DNA molecule, put it in a completely generic chemical soup—no pre-existing ribosomes, no chaperones, no methylation patterns—and have it self-assemble into a functioning organism.

  **Elias:** That's chemically impossible. The machinery is required to read the DNA.

  **Sarah:** Exactly. The machinery is required. Therefore, the information is in the system, not the strand. If the "code" cannot run without the "computer" being pre-configured to match it, then the specificity is distributed. Show me a case where the DNA specifies the outcome without relying on pre-existing specificities in the cytoplasm, and I'll become a realist.

  **Elias:** *[Nods slowly]* A high bar. You're asking for creation ex nihilo. Alright. My turn. What would make me a deflationist? What finding would convince me that "genetic code" is just a manner of speaking?

  **Sarah:** What would break the model for you?

  **Elias:** If we found that phenotypic specificity was routinely generated *without* sequence variation. I mean, if we found that organisms could reliably transmit complex, adaptive traits across generations where the DNA sequence was identical, and the cytoplasmic state was scrambled, and the environment was randomized. If the "information" turned out to be non-local in a way that sequence data couldn't capture even in principle.

  **Sarah:** You mean something like strong Lamarckian inheritance that bypasses the sequence entirely?

  **Elias:** Yes. If the sequence turned out to be merely a structural scaffold, and the "instructions" were actually carried by some field or structural resonance we haven't detected. If I sequenced a genome and found it had the same informational content as random noise, yet the organism developed perfectly. That would convince me the "code" was a metaphor we clung to because it was the only handle we had.

  **Sarah:** *[Laughs softly]* So, I need you to prove DNA works without context, and you need me to prove context works without DNA.

  **Elias:** It seems we're both betting on the necessity of the other's favorite substrate.

  **Sarah:** Perhaps that's the real code. The necessity of the interaction.

  **Elias:** *[Raises his glass]* To the interaction, then. And to Schrödinger, for guessing half of it right.

  **Sarah:** *[Clinks glass]* To the mystery.
