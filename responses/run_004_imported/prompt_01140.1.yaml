      *   **The Realist's Opening Salvo (Elias):** Start with the synthetic biology angle mentioned in the prompt. If we can *rewrite* it, it must be a code. It's not just a metaphor if we can hack it.
      *   **The Deflationist's Counter (Sarah):** Synthetic biology proves malleability, not ontology. Just because we treat it like code doesn't mean nature does. The "context" problem (cytoplasm, environment).
      *   **Deep Dive - Normativity & Function (The Core Requirement):**
          *   *Elias:* Needs to address the "convention/interpreter" objection. A code needs rules. Who made the rules? Evolution/Natural Selection. It creates "proper function." A mutation is an *error*, not just a difference.
          *   *Sarah:* Challenges this. Does selection actually create *semantic* normativity? Or just causal success/failure? Relocating the mystery to "selection" doesn't explain how physical molecules become symbols.
      *   **Synthetic Biology Revisited:**
