      *   *Setting:* A coffee shop or hotel lobby after a philosophy of biology workshop. Let's go with a quiet corner of a conference hotel bar.
      *   *Tone:* Intellectual, warm, slightly weary but engaged.

  3.  **Drafting - Section by Section:**

