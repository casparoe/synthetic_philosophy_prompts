      *   **Nahmanides' Position (Commentary on Leviticus):** Rejects the concession theory. Points out that Abel, Noah, and Abraham offered sacrifices *before* idolatry was rampant. Sacrifice has intrinsic spiritual value (connecting the upper and lower worlds, subduing the animal soul).
