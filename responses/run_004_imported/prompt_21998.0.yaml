      "We run the vote on the premises," she said. "Contract and breach. Both have majority support. That means liability."

      Marcus leaned against the doorframe, arms crossed. "And ignore that two out of three judges voted 'not liable'? You're going to write an opinion holding the defendant liable when a majority of the panel explicitly said he isn't?"

      "I'm writing an opinion that reflects the court's finding on the law," Priya countered. "If we vote on the bottom line only, we publish a contradiction. The majority finds a valid contract. The majority finds a breach. But the ruling says no liability. That's legally incoherent. It tells the bar nothing except that we can't count."

      "It's not incoherent, it's restraint," Marcus said, pushing off the frame. "Look at the matrix, Priya. Judge One wants liability. Judges Two and Three do not. If you split the issues, you're synthesizing a majority view that doesn't actually exist in any single judge's head. You're letting a minority position win by chopping it into pieces."

      "It's not a minority position on the law," Priya snapped. "On the legal questions that matter—the elements of the claim—the majority is clear. Why should the outcome vote trump the reasoning vote? The whole point of an appeals court is to clarify the doctrine, not just pick winners."

      "The point is to decide cases," Marcus shot back. "When you aggregate by issue, you're essentially saying Judge One was right, even though Two and Three rejected her conclusion. You're installing a phantom majority. What happens when the Supreme Court asks who actually held this defendant liable? No one did. Not really."

      "So we lie in the opinion?" Priya threw her hands up. "We write 'We find a contract, we find a breach, but somehow, magic, no liability'? That destroys institutional legitimacy faster than counting votes weirdly. We become a black box."

      "Better a black box than a Frankenstein's monster," Marcus said, his voice dropping. "At least with outcome voting, the result matches a human being's reasoning. Judge Two has a reason. Judge Three has a reason. They agree on the result. Your way creates a consensus that exists only on paper."

      "It exists in the law," Priya insisted, though her pen had stopped tapping. "The law is the premises, not the verdict."

      "The law is what we enforce," Marcus said. He picked up his mug, empty. "And right now, the majority enforces nothing."

      They stood there, the hum of the refrigerator filling the silence. The draft sat between them, paragraph three blinking like a warning light. Neither moved to delete it. Neither moved to keep it.

