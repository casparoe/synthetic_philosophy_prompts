    "principle_statement": {"score": <number>, "max": 5, "comment": "<string>"},
    "dutch_book_argument": {"score": <number>, "max": 8, "comment": "<string>"},
    "objection": {"score": <number>, "max": 7, "comment": "<string>"},
    "total": {"score": <number>, "max": 20},
    "letter_grade": "<string>"
  }
  ```
