answer: |-
  # The Parachute and the Probability Shift: A Defense of Continuity in the Judy Benjamin Problem

  In the landscape of formal epistemology, few thought experiments have generated as much friction as Bas van Fraassen's "Judy Benjamin" problem. The setup is deceptively simple: Judy parachutes into territory divided equally between Blue (friendly) and Red (enemy), with each side further split into Headquarters (HQ) and Second Company (2nd) zones. Her prior credence is uniform: 1/4 for each quadrant. She then receives a radio message: *Conditional on being in Red territory, the odds are 3-to-1 that you are in HQ.* The radio dies. The question is: What is Judy's new credence that she is in Blue territory?

  Intuition screams that the answer is 1/2. The message concerns the internal subdivision of Red; it says nothing about the Blue/Red split. Therefore, the probability of Blue should remain untouched, with the Red probability mass merely redistributed internally (3/8 to HQ, 1/8 to 2nd). However, the method of minimizing cross-entropy (MinXent)—a standard tool for updating on constraints—yields a credence of approximately 0.53 for Blue. Worse for the intuitionist, if the message were strengthened to a certainty (Judy is *definitely* in HQ given Red), standard conditionalization forces Blue's credence to 2/3.

  This essay argues that the "obviously 1/2" intuition is a cognitive illusion born of a misunderstanding of probability space. While MinXent may not be the final word on the *magnitude* of the shift, the qualitative verdict it delivers is correct: Judy's credence in Blue *must* rise. To hold otherwise is to accept an untenable discontinuity in rational belief updating. We must bite the bullet: learning about the structure of Red territory inevitably alters the probability of being in Blue territory.

  ### The Case for Modularity

  The strongest argument for the "stay at 1/2" position rests on a principle of modularity or irrelevance. Van Fraassen's polling data suggests that most people view the Blue/Red partition and the HQ/2nd partition as distinct informational modules. The radio message explicitly conditions on Red. It provides a constraint on the ratio $P(HQ|Red)$, but leaves $P(Red)$ unconstrained.

  Proponents of this view, often favoring a specific application of Jeffrey Conditionalization, argue that rational updating should be minimal in a specific sense: change only what the evidence forces you to change. Since the evidence is silent on the Blue/Red distinction, altering $P(Blue)$ constitutes "gratuitous" belief change. It implies Judy has learned something about the drop-zone selection process (Blue vs. Red) from a message that only described the layout of Red territory. To the intuitionist, a shift from 0.50 to 0.53 looks like magic—it suggests a probabilistic osmosis where information about one sector leaks into another without a causal or logical bridge.

  ### The Case for Cross-Entropy and Continuity

  The MinXent approach operates on a different conception of "minimal change." It seeks to minimize the informational distance (Kullback-Leibler divergence) between the prior and posterior distributions. In this framework, a probability distribution is a holistic structure. Compressing the probability mass within the Red sector (by making HQ much more likely than 2nd) changes the "density" of the Red sector relative to the Blue sector. To maintain the closest possible fit to the prior uniform distribution while satisfying the new constraint, the algorithm must slightly expand the Blue sector to balance the informational weight.

  However, the strongest argument for the MinXent camp is not information theory itself, but the argument from continuity via the limit case. Consider the scenario where the radio message is extreme: *Given you are in Red, you are certainly in HQ.* This eliminates the possibility of $Red \cap 2nd$.

  In this limit case, we are no longer doing MinXent; we are performing standard Bayesian Conditionalization on the proposition $\neg(Red \cap 2nd)$.
  *   Prior mass of Blue: $1/4 + 1/4 = 1/2$.
  *   Prior mass of Red-HQ: $1/4$.
  *   Prior mass of Red-2nd: $1/4$ (Now eliminated).
  *   Remaining mass: $3/4$.
  *   New $P(Blue) = (1/2) / (3/4) = 2/3$.

  Nobody disputes that conditionalization is the normative rule for learning a proposition with certainty. If Judy learns she is *not* in Red-2nd, her credence in Blue *must* rise to 2/3. The intuitionist is thus trapped in a dilemma: they must accept that $P(Blue)$ rises to 2/3 in the limit case, but insist it stays exactly at 1/2 for the 3-to-1 case.

  ### The Verdict: Biting the Bullet

  The discontinuity required by the intuitionist position is rationally fatal. It implies that there is a magical threshold of evidence where learning about the internal structure of Red suddenly becomes relevant to Blue. If $P(HQ|Red) = 0.9999$, the intuitionist says $P(Blue) = 0.5$. If $P(HQ|Red) = 1.0$, the intuitionist says $P(Blue) = 0.66$. This creates a "cliff" in rational belief where infinitesimal changes in evidence produce massive jumps in credence. Rational updating functions should be continuous; small changes in evidence should yield small changes in belief.

  Therefore, the "stay at 1/2" reaction is the confused one. It stems from conflating *causal irrelevance* with *probabilistic independence*. It is true that the radio message does not causally influence where the plane dropped Judy. However, probability is not just about causal propensities; it is about the measure of possibility space. By learning that the Red territory is "smaller" in terms of probable locations (because the 2nd Company area is rendered highly unlikely), the Blue territory effectively occupies a larger proportion of the remaining "live" possibilities.

  Does this mean MinXent is the perfect rule? Not necessarily. Some argue MinXent overcorrects the shift. However, MinXent is correct in its fundamental assertion: **credence in Blue must move.** The intuition that it should stay fixed relies on a false notion of modularity that collapses under the pressure of the limit case.

  We should therefore reject the view that Jeffrey conditionalization (constraining only the conditional probability while holding the base rate fixed) is the correct model for this problem. That model artificially rigidifies the $P(Red)$ value, insulating it from the consequences of eliminating mass within the Red partition. Instead, we should adopt a view that treats the constraint on $P(HQ|Red)$ as a constraint on the joint distribution that naturally ripples through the entire space.

  ### Conclusion

  The Judy Benjamin problem is not a failure of cross-entropy minimization; it is a failure of human intuition regarding conditional probability. The intuition that Blue's credence should remain static is seductive because it mimics how we process causal stories, but it fails to respect the geometry of probability space. The limit case proves that eliminating possibilities in Red boosts Blue. By the principle of continuity, reducing the likelihood of possibilities in Red must also boost Blue, albeit to a lesser degree.

  Epistemology requires us to follow the math where the logic is sound, even when it offends our gut. The gut tells us Blue is irrelevant. The math tells us Blue is relatively more likely because Red has become more specific. In this fight, the math wins. We must accept that Judy's credence in Blue rises. To deny it is to embrace a discontinuity that makes rational learning impossible.
