      *   *Decision:* The implication is a shift from "maximizing cosmic value" to "securing local value." This might favor x-risk (securing our future) *or* near-term (helping existing locals), depending on whether you think the future locals matter more. But if the "future multiplier" is broken by infinity, the *relative* weight of near-term suffering increases.

