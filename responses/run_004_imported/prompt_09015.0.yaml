answer: |-
  **The Many Faces of Underdetermination: Why Only History Threatens Realism**

  My friend and I spent an hour arguing past one another because we were wielding the same weapon against different enemies. We were debating the underdetermination of theory by evidence (UTE), a cornerstone of anti-realist philosophy, but we were invoking distinct arguments that share a label but differ radically in structure and force. She wielded the Duhem-Quine thesis, a logical point about the flexibility of auxiliary hypotheses. I wielded Kyle Stanford's "New Induction," a historical claim about the limits of scientific imagination. Our stalemate was inevitable because these arguments do not do the same work. To determine whether scientific realism—the view that our best scientific theories are approximately true descriptions of a mind-independent world—is tenable, we must disentangle the family of underdetermination arguments.

  There are at least three distinct arguments traveling under the banner of underdetermination: the Duhem-Quine holist argument, the claim of algorithmically generated empirically equivalent rivals (championed by André Kukla), and Stanford's argument from unconceived alternatives. While all three suggest that evidence does not uniquely dictate theory choice, only one of them poses a genuine threat to the scientific realist. The Duhem-Quine thesis and Kukla's algorithmic equivalence are logical curiosities that fail to engage with the actual practice of science. Stanford's argument, however, is an empirical challenge to the reliability of scientific inference. Therefore, the definite verdict is this: Duhem-Quine and Kukla give realists no reason to worry, but Stanford's argument demands a significant, though not fatal, revision of the realist stance.

  The Duhem-Quine thesis is the oldest and most ubiquitous form of underdetermination. Pierre Duhem and W.V.O. Quine argued that scientific theories do not face the tribunal of experience in isolation. A theory $T$ yields a prediction $P$ only in conjunction with a set of auxiliary assumptions $A$ (about instruments, background conditions, etc.). If observation reveals $\neg P$, logic dictates only that $\neg (T \land A)$; it does not specify whether $T$ is false or $A$ is false. Consequently, a scientist can always save a core theory from recalcitrant evidence by adjusting the auxiliary hypotheses.

  For the realist, this argument is a paper tiger. It demonstrates that theory rejection is not *logically* forced, but scientific realism is not based on deductive logic; it is based on Inference to the Best Explanation (IBE). The Duhem-Quine point shows that one *can* save a theory, but it does not show that one *should*. Ad hoc adjustments to auxiliaries often degrade a theory's simplicity, coherence, or unifying power. Realism contends that we believe in electrons not because the data logically forces us to, but because the electron hypothesis offers the best explanation of the data compared to the available alternatives. Duhem-Quine highlights the flexibility of the web of belief, but it does not prove the existence of a *rival* theory that is equally virtuous. It describes a methodological problem of testing, not an ontological problem of truth. Realists can acknowledge holism without abandoning the claim that our best theories are likely true.

  A more formalized version of this logical challenge is found in the work of André Kukla. Kukla argued that for any theory $T$, one can algorithmically generate a rival theory $T'$ that is empirically equivalent to $T$ but logically distinct. A classic example is the theory that "$T$ is empirically adequate, but the unobservable world is not as $T$ describes." If $T$ predicts observation $O$, then $T'$ also predicts $O$, because $T'$ posits that the observations will occur exactly as if $T$ were true. Since both entail the same evidence, evidence cannot decide between them.

  This argument fails to threaten realism for the same reason Duhem-Quine does, but with added clarity regarding the nature of explanation. Algorithmically generated rivals are parasitic. They mimic the predictive success of $T$ without offering any explanatory mechanism. To believe $T'$ is to believe that the world conspires to look exactly like $T$ says it does, without actually being that way. This is a skeptical scenario, not a scientific hypothesis. Scientific realism is committed to the idea that the success of a theory is best explained by its truth. The rival $T'$ offers no explanation for *why* the observations occur; it merely stipulates that they do. A realist is justified in ignoring $T'$ because it lacks the theoretical virtues (simplicity, explanatory depth, non-ad-hocness) that guide scientific inquiry. Kukla's argument proves that empirically equivalent theories are logically possible, but it does not prove they are scientifically viable. Realism is a thesis about the best *scientific* explanation, not the best *logical* fit.

  However, Kyle Stanford's "New Induction" operates on an entirely different plane. Stanford shifts the debate from logic to history. He argues that the history of science is replete with cases where scientists accepted a theory as uniquely supported by the evidence, only for later generations to conceive of alternatives that were equally well-supported by the *original* evidence. For example, nineteenth-century biologists accepted Darwinian natural selection but failed to conceive of Mendelian genetics as an alternative mechanism for inheritance; both were compatible with the data available at the time. Similarly, Newtonian physicists could not conceive of General Relativity, which explained the same anomalies (like the perihelion of Mercury) that Newtonians struggled to patch with auxiliaries.

  Stanford's argument is the "Problem of Unconceived Alternatives." It asserts that the space of possible theories is larger than the space of conceived theories. If our predecessors were unable to conceive of viable alternatives that were later vindicated, we have inductive reason to believe we are in the same position today. This strikes at the heart of the realist's "No Miracles" argument. The realist says, "It would be a miracle if our theory worked this well without being true." Stanford replies, "It is not a miracle; it is a recurring historical pattern that theories work well even when they are not the final truth, because we haven't thought of the better ones yet."

  Unlike Duhem-Quine and Kukla, Stanford's argument cannot be dismissed as a logical trick. It is an empirical claim about the track record of scientific imagination. The realist cannot simply appeal to theoretical virtues, because the unconceived alternatives of the past were often theoretically virtuous by the standards of their time. Newtonian mechanics was simpler and more coherent than the alternatives its proponents could imagine. The failure was not in evaluation, but in conception.

  Therefore, Stanford's argument gives realists genuine reason to worry, while the others do not. Duhem-Quine and Kukla present scenarios where rivals exist *in principle*, but they offer no reason to think these rivals are *plausible* or *explanatory*. They conflate logical possibility with scientific probability. A realist can comfortably assert that while we *could* construct a skeptical rival, we have no reason to *believe* it. Stanford, conversely, provides historical evidence that plausible, explanatory rivals *do* exist, even if we cannot currently describe them. This forces the realist to abandon the claim that our current theories are likely true in their entirety.

  However, this verdict need not lead to a surrender to anti-realism. The threat from Stanford is genuine, but it is not fatal. It suggests that "theory-level" realism (believing the specific mechanisms of current theories are true) is too ambitious. Instead, it supports a more modest "structural realism" or "entity realism." We may not know the true nature of the entities posited by our theories (since unconceived alternatives might posit different entities), but we can have confidence in the mathematical structures that remain stable across theory change, or in the robust detection of causal entities. Stanford shows that our *descriptions* are likely underdetermined by our imagination, but not necessarily that our *causal grip* on the world is illusory.

  In conclusion, the confusion between my friend and me stemmed from treating underdetermination as a monolithic thesis. It is not. The Duhem-Quine holist argument and Kukla's algorithmic equivalence are logical demonstrations that evidence does not deductively guarantee theory. They fail to threaten realism because science relies on explanatory virtue, not deductive certainty. Stanford's argument from unconceived alternatives, however, is a historical indictment of scientific confidence. It is the only argument that provides genuine epistemic reason to doubt that our current theories are the final truth. Realists should ignore the logical puzzles of Duhem and Kukla, but they must take Stanford's history seriously. The verdict is clear: underdetermination is not a threat to realism in the abstract, but it is a potent check on realist hubris in practice.
