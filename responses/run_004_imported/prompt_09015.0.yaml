          *   *Core:* Theories don't face evidence alone; they come with a web of auxiliary assumptions. If prediction fails, we can tweak the auxiliaries rather than the core theory.
          *   *Implication:* Logic alone doesn't force theory rejection.
          *   *Realist Response:* This is a logical point, not a historical/practical one. Scientists have pragmatic reasons (simplicity, coherence) to choose one over another. It doesn't prove rivals *exist*, just that logic doesn't rule them out immediately.

      *   **Kukla's Algorithmic Equivalence:**
          *   *Core:* For any theory $T$, we can construct a rival $T'$ (e.g., "$T$ is empirically adequate but false") that entails exactly the same observations.
          *   *Implication:* Empirically equivalent rivals are always available *in principle*.
          *   *Realist Response:* These rivals are often "parasitic" or not genuine scientific explanations. They lack theoretical virtues (simplicity, non-ad-hocness). Realism is about inference to the best *explanation*, not just empirical fit.

      *   **Stanford's New Induction (Unconceived Alternatives):**
          *   *Core:* Historical record shows scientists consistently failed to conceive of viable alternatives that were later accepted (e.g., Darwin vs. blending inheritance, Newton vs. GR).
