          *   Realist Defense: Inference to the Best Explanation (IBE). We choose based on virtues, not just fit. DQ doesn't show rivals *exist*, just that rejection isn't immediate.

      *   **Section 2: Kukla's Algorithmic Equivalence (The Generative Trick):**
          *   Explain the argument (constructing $T'$ that matches $T$'s observations).
