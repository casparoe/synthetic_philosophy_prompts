answer: |-
  This is one of the oldest and thorniest problems in philosophy, disguised as a profile piece. You have stumbled directly into the debate between **ultimate responsibility** and **practical agency**.

  The short answer is: You are logically right, but Theo is pragmatically right.

  Here is how to untangle that knot for your piece, because the tension between those two truths is actually where the story lives.

  ### 1. The Logical Trap (Why you are right)
  Your intuition is spot on. In philosophy, this is often called **Galen Strawson's "Basic Argument."** It goes exactly like you described:

  1.  To be truly responsible for what you do, you must be responsible for the way you *are* (your character/motivations).
  2.  To be responsible for the way you are, you must have chosen to be that way.
  3.  But to choose to be that way, you must have had a reason for choosing it.
  4.  That reason comes from your existing character (which you didn't choose).
  5.  Therefore, you can never be ultimately responsible for your actions.

  As you noted, the "Theo" who decided to go to therapy was the "Impulsive Theo." Why did *that* Theo decide to change? Maybe he hit a specific level of pain. Maybe he met a specific therapist. Maybe his brain chemistry shifted slightly due to age. None of those were chosen.

  If we are looking for **metaphysical credit**—the idea that Theo is the "unmoved mover" who created his own will from scratch—then no, the claim doesn't hold up. It pushes the problem back infinitely.

  ### 2. The Pragmatic Truth (Why Theo is right)
  However, human beings do not live in the realm of metaphysics; we live in the realm of **causality and narrative.**

  When Theo says, "I chose this," he isn't making a philosophical claim about the origin of his desires. He is making a claim about **alignment.**

  *   **Coercion vs. Volition:** In a legal and social sense, "choice" just means "no one held a gun to your head." Theo wasn't forced into therapy by a court order (presumably). He acted according to his own internal motivations. That is the definition of free will that matters for daily life (Compatibilism).
  *   **The Feedback Loop:** This is the crucial part for your piece. Agency is often a **self-fulfilling prophecy.**
      *   If Theo thinks, "My desire to change was just luck/biology," he becomes passive. He waits for the next wave of luck to keep him disciplined.
      *   If Theo thinks, "I chose this," he reinforces the neural pathways of discipline. He claims ownership of the behavior, which makes him more likely to repeat it.

  Theo's pride isn't a statement of fact about the universe; it's a **tool for maintenance.** Taking credit is part of the mechanism that keeps the change alive.

  ### 3. A Better Metaphor for Your Piece
  The problem arises because we use the metaphor of **Architecture** ("I built myself"). An architect designs a building from scratch. But humans aren't architects; we are **Gardeners.**

  *   A gardener didn't create the soil (genetics).
  *   A gardener didn't create the seeds (impulses/drives).
  *   A gardener didn't control the weather (life circumstances/trauma).

  But the gardener *does* decide where to plant, when to water, and which weeds to pull.

  Theo can't take credit for the *seed* of the desire to change (that fell into his lap via pain or luck). But he can take credit for the *cultivation* of it. He showed up for five years. He watered the plant when he wanted to quit. That is stewardship, not creation.

  ### 4. How to Frame This in Your Article
  If you try to solve this riddle, you'll fail. But if you expose the tension, you'll have a compelling piece. Here is a suggested angle:

  **The Paradox of Agency:**
  We have to believe we are the authors of our lives to function, even if we know we didn't write the first chapter.

  *   **Acknowledge the Luck:** Have Theo acknowledge the "unchosen" factors. "I don't know why I finally got sick of being a wreck. Maybe I just hit a wall. I didn't choose that pain."
  *   **Claim the Labor:** "But once that desire was there, I could have ignored it. I chose to act on it. Every day I didn't drink/quit therapy/scream, that was me."
  *   **The Conclusion:** The "self" isn't a static thing that exists before the change. The "self" is the *result* of the change.

  **The Verdict:**
  Does "I made myself" hold up?
  *   **Metaphysically:** No. It's an infinite regress.
  *   **Psychologically:** Yes. It is necessary.

  You might write that Theo is right to be proud, not because he created his own capacity for change, but because he **honored it.** He didn't squander the unchosen impulse to get better. In a world where we don't choose our cards, we still take credit for how we play the hand.

  That doesn't solve the philosophical circle, but it resolves the human one.
