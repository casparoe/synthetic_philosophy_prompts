answer: |-
  Here are ten questions tailored to your background and the specific philosophical terrain. They are ordered to start with the technical mechanics of her view, move through the scientific applications, and end with the broader metaphysical stakes.

  Each question includes a "Likely Defense" (what she will probably say) and a "Follow-Up" (how to press the point based on that defense).

  ### 1. The "Fudge Factor" Charge
  **Question:** You've added a clause requiring the causal basis to persist intact through the stimulus to block Martin's electro-fink and Lewis's sorcerer cases. My worry is that this looks like a stipulation written to order. Is there any independent motivation for the "persistence" requirement other than saving the conditional analysis from these two specific counterexamples?

  *   **Likely Defense:** She will likely argue that persistence is a general requirement for causal processes, not just dispositions; a cause must exist through the production of its effect.
  *   **Follow-Up:** "If it's a general causal requirement, then why do we need to state it explicitly in the analysis of dispositions? Does this imply that *all* causal counterfactuals need a 'no-fink' clause, or is there something special about dispositions that makes them uniquely vulnerable to having their basis snatched away mid-stream?"

  ### 2. Masking and Antidotes
  **Question:** The persistence clause handles finks, where the basis is removed. But what about masking? If I wrap a fragile glass in bubble wrap, the intrinsic basis (the molecular structure) persists intact, yet it won't break if struck. Does your analysis falsely classify the wrapped glass as non-fragile, or do you need a separate 'no-masking' clause?

  *   **Likely Defense:** She will likely distinguish finks (basis gone) from masks (interference with the manifestation process) and argue that masks are handled by a *ceteris paribus* (all else being equal) condition or by specifying the stimulus more precisely (e.g., "struck *unwrapped*").
  *   **Follow-Up:** "If you have to add a 'no-interferers' clause to handle masks, haven't you just reintroduced the vagueness the conditional analysis was supposed to eliminate? At what point does adding clauses to save the analysis become more complex than just accepting the disposition as a primitive fact?"

  ### 3. The Corrosion Case (Passivation)
  **Question:** In my old work, we dealt with stainless steel, which has a disposition to corrode that is masked by a passive oxide layer. The reactivity (the basis) is chemically present, but the layer prevents the stimulus (oxygen/water) from reaching it. On your view, is the steel in a passive state still 'corrosive'? If yes, how does the analysis account for the fact that the manifestation is physically impossible without removing the layer?

  *   **Likely Defense:** She will likely say the steel *is* still corrosive because the intrinsic basis remains, and the counterfactual holds *if* the passivation layer were removed or if the stimulus were strong enough to breach it.
  *   **Follow-Up:** "But in engineering, we treat passivated steel as having a *different* disposition than active steel. If your analysis says they have the same disposition because the 'deep' basis is the same, isn't your analysis diverging from the scientifically useful way we actually categorize materials?"

  ### 4. Defining the "Intrinsic Basis"
  **Question:** You require the causal basis to be intrinsic to the object. But in materials science, surface states are often relational—they depend on the environment that formed them. If I take a clean metal into a vacuum, its disposition to oxidize changes instantly. Is the 'basis' the metal lattice, or the metal-plus-surface-state? If it's the latter, isn't the basis extrinsic?

  *   **Likely Defense:** She will likely argue that the surface state is a physical property of the metal at that time, hence intrinsic, even if it was caused by the environment.
  *   **Follow-Up:** "That seems to stretch the definition of 'intrinsic.' If a property counts as intrinsic just because it's currently located on the object, even if it's wholly defined by its relation to the outside world, does the intrinsic/extrinsic distinction still do any work in your analysis?"

  ### 5. Temporal Duration of Persistence
  **Question:** You say the basis must persist "all the way through" the stimulus. In fast chemical reactions or quantum events, the 'stimulus' and the 'response' are nearly simultaneous. How do you define the duration of persistence without making the requirement trivial? If the basis only needs to persist for a nanosecond, doesn't that allow a fink to act just after that nanosecond?

  *   **Likely Defense:** She will likely appeal to the causal chain: the basis must persist as long as it is causally relevant to the production of the manifestation.
  *   **Follow-Up:** "But determining causal relevance seems to presuppose we already know which dispositions are at work. Aren't we using the disposition to explain the persistence, rather than using the persistence to explain the disposition?"

  ### 6. Circularity of Counterfactuals
  **Question:** Your analysis relies on counterfactuals ("if it were struck..."). But David Lewis himself admitted that analyzing counterfactuals often requires referencing laws of nature and dispositions. Are you worried that you're analyzing dispositions in terms of counterfactuals, which are themselves analyzed in terms of dispositions?

  *   **Likely Defense:** She will likely deny the circularity, arguing that the counterfactuals are evaluated via similarity of possible worlds, not by checking a list of dispositions.
  *   **Follow-Up:** "But when we judge the 'similarity' of a possible world, don't we naturally prioritize worlds where the laws of nature—and hence the dispositions—stay the same? If so, isn't the stability of dispositions a precondition for your analysis, rather than a result of it?"

  ### 7. Comparative Simplicity (vs. Dispositional Essentialism)
  **Question:** There is a rival view, Dispositional Essentialism, which says dispositions are primitive, unanalyzable properties. Your view is more complex because it adds the persistence clause and the intrinsic basis requirement. What theoretical 'payoff' does your view offer that the primitive view doesn't? Why is the extra complexity worth it?

  *   **Likely Defense:** She will likely argue that her view preserves a Humean worldview (where there are no necessary connections between distinct existences), whereas primitive powers commit us to a more "spooky" metaphysics.
  *   **Follow-Up:** "So the motivation is largely to save a specific metaphysical framework (Humeanism). If the science itself works fine assuming primitive powers, are we tweaking the analysis to fit the world, or to fit a philosophical preference for how the world *ought* to be?"

  ### 8. Micro-Physical Indeterminacy
  **Question:** In quantum mechanics, particles don't always have determinate bases for dispositions until measured. If an electron doesn't have a determinate position or momentum until interaction, what is the "intrinsic basis" that persists through the stimulus?

  *   **Likely Defense:** She might argue that the wave function or the quantum state serves as the intrinsic basis.
  *   **Follow-Up:** "But the quantum state evolves probabilistically. If the basis itself is inherently probabilistic regarding the manifestation, does your conditional analysis collapse into a probability claim? And if so, does 'persisting intact' make sense for a probability distribution?"

  ### 9. Predictive Utility for Scientists
  **Question:** As a scientist, I care about prediction. If I use your analysis to determine if a material is fragile, I need to know if the basis will persist. But often I don't know if the basis will persist until I see if it breaks. Does your analysis offer any predictive power over simply saying "this material has a power to break," or is it purely a post-hoc description?

  *   **Likely Defense:** She will likely say the analysis is metaphysical, not methodological; it tells us what fragility *is*, not how to test for it.
  *   **Follow-Up:** "If the analysis doesn't help us identify or test for dispositions, and it's more complex than the primitive view, who is the intended beneficiary of this analysis? Is it for scientists, or just for metaphysicians?"

  ### 10. The "Give Up" Condition (Final Question)
  **Question:** To wrap up: Many philosophers who start with conditional analysis eventually conclude that dispositions are primitive, unanalyzable powers because the patches (like your persistence clause) become too cumbersome. What would have to be true about the world, or what kind of counterexample would need to be found, for you to throw in the towel and say, "Okay, dispositions are just primitive powers"?

  *   **Likely Defense:** She might say she would give up if it were shown that intrinsic bases *never* persist, or if the circularity of counterfactuals was proven inescapable.
  *   **Follow-Up:** "And if we found that the world is 'power-laden' all the way down, as some physicists suggest, would that be enough? Or is your commitment to the conditional analysis a priori, regardless of what the physics says?"
