      *Wait, one nuance:* The prompt asks for "eight to ten questions... each with a follow-up keyed to whatever answer she's most likely to give." I should structure it so the user knows *why* that follow-up is chosen.

      *Let's finalize the list.*
      1. Persistence Clause (Ad-hoc?)
      2. Masking/Antidotes (The big rival problem).
