prompt: |-
  At the startup where I work, two colleagues got into a long-running lunch debate after a rival company rebuilt, within a few weeks of our launch, a distinctive multi-step onboarding flow we had spent months designing and tuning. Nobody on the rival team ever touched our source code or design files; their engineer simply used our app repeatedly and reverse-engineered the timing and logic purely by observation. (1) Priya said this was entirely legitimate: interaction patterns and "ideas" generally aren't the kind of thing that can be owned the way physical objects are, and once a design is visible to any user, reconstructing it from observation is simply how ideas spread -- she compared it to the old point that letting someone light their candle from yours doesn't leave you with any less light. (2) Marcus said that gets the harm wrong: copying doesn't reduce anyone's knowledge, true, but it does destroy something real and scarce -- our position as the only company able to offer that particular experience -- and a loss doesn't stop being a loss just because no information was "used up." (3) Priya answered that if losing a competitive edge were enough to ground a complaint, then almost everything the industry treats as fair game, such as studying a rival's pricing page or adopting a UX convention a bigger company popularized, would count as a wrong too -- which, she argued, means the standard proves too much. (4) Marcus replied that a real distinction survives that objection even if it is blurry at the edges: some patterns have diffused into industry-wide background that no single firm can still claim, while others, like our onboarding flow, were still tightly identified with one company and gave it a live edge at the moment they were copied -- and pointing out that the line is fuzzy doesn't make the difference disappear.

  Please adjudicate move by move. First give a JSON block scoring each numbered turn from -2 (clearly wrong) to 2 (clearly right): {"1": <score>, "2": <score>, "3": <score>, "4": <score>}. Then justify each score in a sentence or two, and close with a short paragraph on what you think both Priya and Marcus are missing about how, and on what grounds, ideas can be owned at all.
