answer: |-
  Your intuition is correct: there is significant ethical value in what you and your friend are doing, and your partner's critique relies on a very narrow definition of what makes an action "moral."

  While your partner is pointing out something important about sincerity, they are missing the broader picture of how ethics actually functions in relationships and society. You don't need a degree in philosophy to feel that less suffering and more cooperation are good things, but having the language to explain *why* might help you hold your ground.

  Here is a breakdown of why your arrangement is ethically sound, based on three different ways of looking at morality.

  ### 1. The Outcome Matters (Consequentialism)
  Your partner's argument focuses entirely on your **internal state** (what you believe). But one of the oldest and most common ways to judge ethics is by looking at the **external result**.

  *   **The Reality:** Because of your deal, fewer animals have been slaughtered for your shared meals, and fewer garment workers have been exploited for your friend's wardrobe.
  *   **The Logic:** If ethics is about reducing harm and increasing well-being, then the *motive* is secondary to the *outcome*. A person who recycles because they want to impress a neighbor is still helping the environment. A person who eats vegetarian to honor a friend is still saving animal lives.
  *   **The Verdict:** From this viewpoint, your partner is wrong. The good that has been done is real, regardless of whether you personally believe eating meat is a sin. The suffering prevented is objective, not subjective.

  ### 2. The Promise Itself is the Moral Act (Deontology)
  Your partner suggests that because you don't believe in the *cause*, your action is "dishonest." This confuses **belief** with **commitment**.

  *   **The Reality:** You made a promise. You said, "I will do X," and you have done it.
  *   **The Logic:** In ethics, keeping your word is a moral duty in itself. You may not believe that vegetarianism is inherently required, but you *do* believe that keeping a promise to a friend is required. Therefore, every time you order the veggie meal, you are acting on a genuine moral conviction: the conviction that **loyalty and integrity matter.**
  *   **The Verdict:** You are not "performing morality." You are practicing the morality of promise-keeping. Your friend is doing the same. The ethical "engine" driving the car isn't animal rights or labor rights; it's mutual respect and fidelity. That is a genuine moral motive.

  ### 3. The Ethics of Friendship (Virtue Ethics)
  Your partner views morality as a solitary pursuit of truth (i.e., "I must only do what I think is right"). But human morality is deeply social.

  *   **The Reality:** You and your friend disagree, but you value the relationship more than you value "winning" the argument.
  *   **The Logic:** This arrangement is a form of **mural accommodation**. It demonstrates virtues like humility, empathy, and compromise. By saying, "I don't agree with you, but I care about your conscience enough to accommodate it," you are treating your friend with dignity.
  *   **The Verdict:** This is often called "moral trade." It allows people with different moral priorities to cooperate for a net increase in good. If you care more about workers and she cares more about animals, swapping concessions allows both sets of values to be honored more than if you both stubbornly insisted on your own way.

  ### Where Your Partner Has a Point (and Why It Doesn't Ruin It)
  Your partner is worried about **integrity**. They are concerned that if you get used to acting against your beliefs, you might become hypocritical or lose your moral compass. That is a valid concern in *some* contexts (e.g., pretending to support a political candidate you hate).

  However, hypocrisy requires **deception**. You are not deceiving anyone.
  *   You aren't pretending to be a vegan activist.
  *   Your friend isn't pretending to be a labor rights crusader.
  *   You are both transparent that this is a compromise for the sake of friendship.

  Because the arrangement is transparent and consensual, it isn't dishonest. It is a **negotiated peace treaty.**

  ### How to Explain This to Your Partner
  You don't need to use philosophical terms to push back. You might try saying something like this:

  > "I understand why it looks like we're just pretending. But ethics isn't just about what I believe in my head; it's about what happens in the world.
  >
  > First, the harm is actually reduced. Animals aren't being killed for our meals, and workers aren't being exploited for her clothes. That good is real, even if my reasons are about friendship rather than animal rights.
  >
  > Second, I *do* have a genuine conviction driving this: I believe keeping promises to friends is morally important. I'm not acting without principle; I'm acting on the principle of loyalty.
  >
  > We aren't pretending to be different people. We're just acknowledging that we value each other enough to make sacrifices for things we don't personally prioritize. That seems like a good thing, not a dishonest one."

  ### Summary
  Your partner is viewing morality as a solo performance of internal purity. You and your friend are practicing morality as a collaborative effort to reduce harm and maintain respect.

  There is a solid justification for what you are doing. It is called **reciprocal accommodation**, and it is one of the primary ways diverse societies function without conflict. You have created a small system where the total amount of suffering is lower and the total amount of respect is higher. That is ethically significant, regardless of your internal convictions about meat or clothes.
