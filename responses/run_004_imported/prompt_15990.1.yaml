  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A drunk argument with a philosophy friend (Priya) about the "Problem of Old Evidence" (POE) in Bayesian confirmation theory.
      *   **Core Issue:** Why does standard Bayesianism imply that old evidence (like Mercury's perihelion) cannot confirm a new theory (like General Relativity)?
      *   **Specific Questions:**
          *   (a) Build intuition for *why* the math forces this conclusion (without getting bogged down in heavy formalism).
          *   (b) Evaluate the "Garber-Jeffrey move" (and other solutions) – does it solve the problem or just patch it?
