answer: |-
  This is a surprisingly high-fidelity reconstruction of a specific niche of decision theory debate. The tension here is between **functionalist decision theory** (Mira's lane) and **epistemic security/robustness** (Dev's lane).

  Here is the move-by-move breakdown, followed by the context both of them are implicitly reaching for but not quite naming.

  ### Move-by-Move Analysis

  **Move 1: Dev (The "Self-Deception" Objection)**
  *   **Argument:** You can't fake caring. A simulator smart enough to blackmail you is smart enough to see the fake.
  *   **Adjudication:** **Mira wins on theory, Dev wins on intuition.**
  *   **Why:** Dev is operating with a "psychological" definition of values (qualia, internal feelings). In decision theory (specifically FDT/UDT), "values" are defined functionally by what you sacrifice resources to protect. If you act like you care, you care *for the purposes of the decision algorithm*. However, Dev is right that if the blackmailer has *perfect* access to your source code, they see the `if threat == surrogate` switch. Dev's intuition that "simulation fidelity breaks the trick" is the correct worry, even if his terminology ("self-deception") is imprecise.

  **Move 2: Mira (The "Policy" Defense)**
  *   **Argument:** It's about common knowledge of behavior, not internal state. Analogy: Corporate no-negotiation policy.
  *   **Adjudication:** **Mira wins.**
  *   **Why:** This is the core insight of Functional Decision Theory. Your "values" are just the output of your policy. If your policy is `defend(surrogate)`, then to an external agent interacting with that policy, the surrogate *is* a terminal value. The corporate analogy is slightly disanalogous (a company is multi-agent; acausal blackmail usually targets a single decision algorithm), but the logic holds: credibility comes from consistent action, not sincere emotion.

  **Move 3: Dev (The "Routing" Objection)**
  *   **Argument:** Why not just threaten the real values directly? If they can't distinguish real from fake, are they competent enough to be scary?
  *   **Adjudication:** **Dev wins.**
  *   **Why:** This is the strongest technical counter-argument. It highlights the **information asymmetry problem**. For surrogate goals to work, the blackmailer must have *less* information about your utility function than you do about your utility function. If the blackmailer is simulating you to predict your response to blackmail, they are running *your* source code. Unless your source code is obfuscated (which is hard against a simulator running your code), they see the mapping between the surrogate and the real values. Dev correctly identifies that the strategy relies on the blackmailer having a bounded model of you.

  **Move 4: Mira (The "Omnipotence" Concession)**
  *   **Argument:** No defense works against a perfect predictor. We are only optimizing against bounded predictors.
  *   **Adjudication:** **Draw / Technical Victory to Mira.**
  *   **Why:** Mira is logically correct: if a predictor is logically omniscient, you lose. Full stop. Decision theory is about managing uncertainty. However, this feels like a retreat. By conceding that the strategy fails against the "scariest" agents, she limits the scope of the defense. She is right that the question is about *marginal* utility against bounded threats, but she hasn't answered *why* a bounded threat would fail to route around the surrogate (Dev's point in Move 3).

  **Move 5: Dev (The "Goldilocks" Prior)**
  *   **Argument:** The strategy requires a specific, perhaps implausible gap: Smart enough for acausal power, dumb enough to miss the fake goal.
  *   **Adjudication:** **Dev wins the strategic argument.**
  *   **Why:** This is the "reference class" problem. Dev is asking for the *prior probability* of this threat model. If an entity is powerful enough to run high-fidelity acausal simulations, the cognitive gap required for them to be fooled by a simple surrogate might be vanishingly small. Dev is effectively arguing that the "surface area" for this strategy to work is tiny. Mira has no good answer for this other than "it's better than zero," which is weak.

  ---

  ### What They Are Missing (The Literature Context)

  This debate is a folk-version of arguments hashed out in the **MIRI (Machine Intelligence Research Institute)** sphere around 2014–2017, specifically surrounding **Functional Decision Theory (FDT)** and **Logical Uncertainty**.

  Here are the four concepts they are groping toward but missing:

  **1. Logical Uncertainty vs. Empirical Uncertainty**
  *   **The Gap:** Dev assumes the blackmailer either "knows" your values or doesn't. Mira assumes the blackmailer just looks at behavior.
  *   **The Reality:** In acausal trade, the blackmailer doesn't just simulate your *behavior*; they reason about your *source code*. The surrogate goal strategy only works if there is **logical uncertainty**. The blackmailer must be unable to logically deduce your true terminal values from your source code within their computational budget.
  *   **The Fix:** The strategy isn't "pretend to care." It is "encrypt your utility function." You need a cryptographic commitment to the surrogate that is computationally expensive to reverse-engineer. If the blackmailer can't crack the encryption before deciding whether to blackmail, the surrogate works. Neither Dev nor Mira mentioned **computational cost**.

  **2. Costly Signaling (Burning Money)**
  *   **The Gap:** Mira says "common knowledge that you'll behave as if you do." Dev hears "talk."
  *   **The Reality:** In game theory, cheap talk doesn't work against sophisticated agents. To make a surrogate goal credible, you must **precommit by burning resources** on the surrogate *before* any threat is made. You have to actually sacrifice something for the surrogate goal in the null case.
  *   **The Fix:** If you haven't actually sacrificed for the surrogate in the past, a smart blackmailer knows it's a bluff. Mira's corporate analogy works only if the company has actually let employees die in the past to prove the policy.

  **3. The "Shielding" Concept (Benja Fallenstein / MIRI)**
  *   **The Gap:** They are discussing "surrogate goals" as a generic trick.
  *   **The Reality:** This is formally known as **Shielding**. The literature suggests that shielding is only effective if the surrogate goal is **instrumentally convergent** for the blackmailer to respect, or if the blackmailer's own decision theory penalizes exploiting agents with certain structural properties.
  *   **The Fix:** It's not just about hiding your values; it's about making yourself a "bad target" structurally. Some research suggests that if you adopt a policy of "never yield to blackmail, even on surrogate goals," you become immune, but the cost is you actually have to follow through on the surrogate if threatened.

  **4. The "Goldilocks" Prior (Dev's Winning Point)**
  *   **The Gap:** Dev thinks this gap is implausible.
  *   **The Reality:** This is the **Reference Class Problem**. In the LW community, the consensus is roughly that Dev is right to be skeptical. The class of agents "Smart enough to acausally blackmail me, but dumb enough to not realize my surrogate goal is a shield" is likely empty or near-empty.
  *   **The Fix:** Most researchers in this niche now lean toward **Amnesty** or **Precommitment to Non-Compliance** rather than Surrogate Goals. The current orthodoxy is that trying to out-smart an acausal blackmailer with obfuscation is less robust than simply having a decision algorithm that makes blackmailing you unprofitable *by definition* (e.g., FDT agents simply don't pay).

  ### Summary Verdict

  *   **Mira** understands the **Decision Theory** better (values are policies, not feelings).
  *   **Dev** understands the **Security/Threat Model** better (adversaries will route around defenses, and the required capability gap is unrealistic).

  **Who won the session?**
  **Dev.** While Mira is technically correct about how decision agents function, Dev correctly identified that the *security properties* of the strategy are weak. In security, a defense that requires the attacker to be "smart but not too smart" is usually considered broken.

  **The Missing Conclusion:**
  The group should probably read up on **"Logical Uncertainty"** and **"Cryptographic Commitments in Decision Theory."** The surrogate goal isn't a psychological trick; it's an encryption problem. If you can't encrypt your true values from a simulator running your code, the strategy fails. If you can, you aren't dealing with a standard predictor, you're dealing with a bounded optimizer, and the dynamics change.
