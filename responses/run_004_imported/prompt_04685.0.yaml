answer: |-
  This is a sophisticated question that cuts to the heart of the tension between legal formalism and moral purposivism in American constitutional theory. As a PhD student in political theory, you recognize that Douglass's 1860 Glasgow address is not merely a political speech but a rigorous hermeneutic intervention. He is attempting to solve the problem of how a legal document, drafted by men who owned slaves, can be interpreted to abolish slavery without resorting to extra-legal revolution.

  To answer your question directly: Douglass would likely find both modern "Original Public Meaning" (OPM) textualism and "Living Constitutionalism" insufficient, though he would share DNA with both. However, regarding *Shelby County v. Holder*, his reaction would likely be scathing. He would view the "equal sovereignty" principle as the precise methodological evil he sought to excise in 1860: an extratextual structural presumption used to nullify an explicit textual grant of power designed to secure human rights.

  Here is a breakdown of how Douglass's interpretive apparatus applies to these modern categories and the specific case.

  ### 1. Douglass and the Modern Binary: Natural Rights Textualism

  If forced into the modern binary, Douglass disrupts the dichotomy. He is best understood not as a living constitutionalist nor as a modern textualist, but as a **Natural Rights Textualist**.

  **Why he isn't a modern OPM Textualist:**
  Modern textualism (à la Scalia) often seeks to freeze meaning at the moment of ratification and frequently treats the Preamble as non-operative "fluff." Douglass does the opposite.
  *   **The Preamble as Operative:** In Glasgow, Douglass leans heavily on the Preamble ("secure the Blessings of Liberty") as the hermeneutic key to the rest of the document. For Douglass, the text is not a collection of discrete clauses but a coherent system oriented toward a specific *telos*.
  *   **Rejection of "Neutral" Principles:** Modern textualism often claims neutrality. Douglass admits his reading is partisan—it is partisan *for liberty*. He argues that because the Constitution is a means to the ends of the Declaration of Independence, any ambiguity must be resolved in favor of liberty. This is the *rule of lenity* applied to constitutional law, which is alien to strict OPM.
  *   **Intent vs. Text:** Douglass rejects the *secret intentions* of the framers (the Garrisonian trap), but he embraces the *declared purposes* of the document. If the "public meaning" of 1787 included a consensus that "persons held to service" meant property, Douglass would reject that public meaning as a corruption of the text's plain language.

  **Why he isn't a Living Constitutionalist:**
  *   **Textual Constraint:** Douglass does not argue that the Constitution *evolves* to mean liberty; he argues it *always meant* liberty, and previous generations were blind to it. He insists the text itself, without amendment, prohibited slavery. A living constitutionalist might argue the 8th Amendment's "cruel and unusual" standard evolves; Douglass argues the text's silence on slavery *is* the prohibition.
  *   **Fixed Moral Anchor:** For Douglass, the "living" element isn't societal evolution, but the application of fixed natural law principles (from the Declaration) to the text.

  **Verdict:** Douglass would likely view modern OPM as too morally hollow (capable of sustaining *Dred Scott*) and Living Constitutionalism as too unmoored from the text (capable of judicial overreach). He believes the text, read through the lens of natural right, is sufficient to secure justice.

  ### 2. Douglass on *Shelby County v. Holder* (2013)

  This is where your intuition is strongest. *Shelby County* is arguably the perfect modern analogue to the pro-slavery constitutionalism Douglass fought in 1860.

  **The Parallel: Extratextual Structuralism**
  In 1860, pro-slavery constitutionalists argued that while the text didn't explicitly protect slavery, the *structure* of the union and the *intent* of the compromise required it. They posited a "property right in man" that existed prior to and above the text.

  In *Shelby County*, the Roberts Court posited an "equal sovereignty of the states" principle. As you noted, this principle is not in the text of the 15th Amendment. In fact, the 15th Amendment is inherently *asymmetrical*; it grants Congress the power to target specific jurisdictions that violate voting rights. The Enforcement Clause ("Congress shall have power to enforce this article by appropriate legislation") is a grant of discretionary power to remedy specific wrongs.

  **Douglass's Critique:**
  Douglass would likely argue that *Shelby County* commits the exact sin he denounced in Glasgow: **allowing an unwritten structural presumption to override an explicit textual grant of power.**

  1.  **The Textual Violation:** Douglass would point to the 15th Amendment's text. It does not say "Congress shall have power... provided all states are treated equally." It says Congress has power to enforce the right to vote. By striking down the coverage formula of the VRA based on an unwritten principle of state dignity, the Court effectively amended the Constitution without the people's consent. Douglass spent his life arguing that if the text doesn't say it, it isn't law. "Equal sovereignty" isn't in the text.
  2.  **The Purposive Betrayal:** Douglass viewed the Reconstruction Amendments as a "new departure," a second founding designed to nationalize rights and subordinate state sovereignty to human liberty. In his 1869 speech "The Composite Nation," he argues that the 14th and 15th Amendments were designed to break the power of states to oppress. To use a pre-Civil War concept of state sovereignty to hamstring the 15th Amendment is to resurrect the ghost of the "covenant with death."
  3.  **The "Secret Intention" Reversal:** In 1860, Douglass fought against reading *slavery* into the text via secret intentions. In *Shelby*, the Court read *limitations on civil rights enforcement* into the text via secret structural principles. Douglass would see this as the same hermeneutic of suspicion turned against the oppressed. He would argue that the "intent" of the 15th Amendment was to prevent exactly what happened in *Shelby*: the return of discriminatory voting regimes under the cover of formalistic state equality.

  ### 3. The Theoretical Implication: "Appropriate Legislation"

  The crux of *Shelby* was whether the VRA's coverage formula was still "appropriate legislation" under the 15th Amendment. The Court said no, because the data was old and it burdened state sovereignty.

  Douglass would likely argue that "appropriateness" is determined by the **necessity of the end**, not the comfort of the states.
  *   In his 1860 speech, he argues that the Constitution gives the Federal Government the power to suppress insurrections and guarantee republican government.
  *   Applied to the 15th Amendment: If the end is "no denial of vote on account of race," and the means (VRA) achieves that end, it is constitutional.
  *   To demand that the means also satisfy an extratextual requirement of "state equality" is to prioritize the *structure of the federation* over the *rights of the citizen*. For Douglass, after 1865, the citizen's natural rights are paramount; state sovereignty is derivative.

  ### Conclusion

  Douglass would likely view *Shelby County* as a **Garrisonian irony**: the Court used a formalistic, text-adjacent reasoning (claiming to protect the structure of the Union) to achieve a substantively unjust result (hollowing out voting rights), much like the Garrisonians claimed the text was pro-slavery to justify abandoning the Union.

  However, Douglass would go further than the *Shelby* dissenters (like Ginsburg, who argued the VRA was still necessary). He would argue that the Court lacked the *authority* to impose the "equal sovereignty" test at all. He would classify "equal sovereignty" alongside the "right to property in man": **a legal fiction invented to protect oppression, lacking any warrant in the written instrument.**

  For a political theorist, the takeaway is that Douglass offers a third way: **Textualism in service of Radical Republicanism.** He insists on the text not because he loves legalism, but because he believes the text, stripped of the "pro-slavery gloss" of custom and intention, is the most potent weapon available to the oppressed. *Shelby County* represents the re-application of that "gloss"—this time in the form of federalism doctrine—to dull that weapon. Douglass would recognize the tactic immediately.
