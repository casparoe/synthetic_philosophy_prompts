      *   *Purposivism/Natural Law:* He reads the text *in light of* the Declaration's principles (justice, liberty). The Preamble isn't just fluff; it sets the telos (purpose) of the document.
      *   *The Synthesis:* For Douglass, the text *is* the vehicle for natural rights. The text isn't neutral in a vacuum; it's neutral *against* slavery because it lacks pro-slavery clauses, and positive *for* liberty because of the Preamble + Natural Law context.
      *   *Key Nuance:* Douglass isn't a modern "Scalia-style" textualist who excludes purpose. Nor is he a modern "living constitutionalist" who might disregard text for evolving norms. He believes the text *already contains* the liberatory purpose if read correctly (i.e., without the pro-slavery gloss).

  3.  **Address Question 1: Modern Categorization (OPM vs. Living Constitution):**
      *   *OPM Textualism:* Douglass shares the focus on the text over secret intentions. However, modern OPM often seeks to freeze meaning at ratification. Douglass wants the text to *do* something specific (end slavery/secure liberty). He uses the Preamble dynamically.
      *   *Living Constitutionalism:* Douglass shares the focus on broad principles (liberty, justice). However, he grounds this firmly in the *text* and the *Declaration*, not just evolving societal values. He thinks the text *commands* liberty, not that society has evolved to demand it.
      *   *Better Fit:* Douglass is arguably a **Natural Law Textualist** or a **Principled Textualist**. He fits awkwardly in modern binaries.
      *   *Argument:* He would likely reject the *methodology* of modern OPM if it leads to unjust results (like *Dred Scott*), but he would reject the *freewheelingness* of some living constitutionalism that ignores text. He believes the text, properly read through the lens of natural rights, *is* the living guarantee.
      *   *Verdict:* He aligns more with the *spirit* of purposivism (the Constitution has a moral aim) but insists on the *discipline* of textualism (the aim must be found in the words/Preamble, not judicial fiat).

  4.  **Address Question 2: *Shelby County v. Holder*:**
      *   *The Case:* Struck down Section 4(b) of the Voting Rights Act (VRA). Used the "equal sovereignty of the states" doctrine.
