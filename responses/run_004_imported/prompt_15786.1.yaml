      *   *Rebuttal:* For Aristotle, the *end* matters. If the end is accumulating coin, it's unnatural. If the end is securing the polis, it's a duty. Also, the reward is proportional to capital, not labor. A validator with 100x stake does roughly the same work as one with 1x stake but gets 100x reward. This disproportionality confirms it's capital-based (*tokos*), not labor-based.
