answer: |-
  **Setting:** *A philosophy department office, late evening. Empty coffee cups litter the desk. ELENA (Universalist) is leaning back in her chair; MARCUS (Nihilist) is pacing near the whiteboard, which is covered in formalized arguments about vagueness.*

  **Elena:** Marcus, stop pacing. You're going to wear a hole in the carpet, and then we'll have to argue about whether the carpet-minus-the-hole is a new object.

  **Marcus:** (Stops, smiles thinly) Funny. But you know why I'm restless. We've been circling the Special Composition Question for three weeks. I give you the argument from vagueness; you give me the argument from common sense. We trade counterexamples like baseball cards. But I'm starting to wonder if we're playing different games.

  **Elena:** That's exactly where my head is. Look, I've been reading Hirsch again. And I have a uncomfortable thought. What if I'm not saying anything false when I say "there exists a fusion of your left shoe and the Eiffel Tower," and you're not saying anything false when you say "there exists no such object"?

  **Marcus:** You're suggesting quantifier variance. That this is merely verbal.

  **Elena:** I'm suggesting we test it. Think about what I'm committed to. I say the fusion exists. But I also say the fusion is "nothing over and above" its parts. It doesn't add new matter. It doesn't add new causal powers. When I point to the region of spacetime containing your shoe and the Tower, I'm pointing to the same stuff you're pointing to. You describe it as "simples arranged shoe-and-Tower-wise." I describe it as "a fusion of a shoe and a Tower." If the truth-conditions of our sentences are anchored to the same physical reality, isn't the difference just in the quantifier?

  **Marcus:** It's not just the quantifier, Elena. It's the ontology. If your view is just a linguistic variant of mine, then nihilism loses its bite. I adopted nihilism for theoretical payoff. I wanted to dissolve the puzzle of coincident objects. I wanted to avoid causal overdetermination. If your universalism is just "another way of speaking" that's equally true, then the puzzles don't dissolve; they just get swept under the rug of linguistic convention.

  **Elena:** But Hirsch's charity principle says we should interpret each other as speaking truth whenever possible. I can translate your "There are no tables" into my idiom as "There are no *simple* tables" or "There are no tables that are fundamental entities." And you can translate my "There is a table" into your idiom as "There are simples arranged table-wise." If the translation preserves truth, what substantive fact are we fighting over?

  **Marcus:** The translation doesn't preserve the theoretical role. That's the Siderian objection. Let's grant, for a moment, that you can map my sentences to yours. When I say "There are no tables," I mean to exclude a certain kind of entity from my fundamental ideology. I'm saying reality doesn't contain *that*. If you translate that to "There are simples arranged table-wise," you've captured the extension, sure. But you haven't captured the *structure*.

  **Elena:** Structure? You mean metaphysical structure. But how do you access this structure except through the very language we're using? You're assuming there's a "God's eye" quantifier that carves nature at the joints. But why think the joint-carving quantifier is the restrictive one? Why isn't the unrestricted quantifier the fundamental one? After all, logic itself seems to favor unrestricted generality.

  **Marcus:** Because fundamental physics doesn't quantify over tables. It quantifies over fields, particles, spacetime points. The sparse quantifier—the one that ranges only over simples—is the one that appears in the fundamental description of the world. The universalist quantifier ranges over gerrymandered sums that play no role in the causal laws. If "exists" is supposed to track reality, it should track the fundamental reality. The unrestricted quantifier tracks our conceptual habits, not the world's joints.

  **Elena:** There's the question-begging I was worried about. You're defining "fundamental reality" as "whatever the nihilist quantifier ranges over." Of course physics quantifies over particles; physics is in the business of finding small stuff. But physics also uses variables that range over macroscopic systems in thermodynamics or fluid dynamics. You're privileging the micro-level as "real" and the macro-level as "conventional" by fiat. To say the nihilist quantifier is joint-carving just *is* to assert nihilism is true. It doesn't explain *why* the dispute is substantive; it just restates your side of it.

  **Marcus:** It's not fiat; it's abduction. We choose the quantifier that yields the best theory. Nihilism yields a simpler theory. It posits fewer kinds of things. If we treat the dispute as verbal, we lose the ability to say one theory is simpler than the other. They become incommensurable dialects. But they aren't. We can compare them. And when we compare them, my ontology is more parsimonious. Parsimony is a theoretical virtue that tracks truth, not just linguistic elegance.

  **Elena:** Parsimony is only a virtue if we're counting *things*. But if quantifier variance holds, we aren't counting different things. We're counting the same things under different descriptions. If I say "there is a fusion," I'm not adding a thing to your inventory of simples. I'm just grouping them. So where is the parsimony gain? You haven't reduced the number of atoms. You've just refused to apply the label "object" to certain collections of them. That's a linguistic savings, not an ontological one.

  **Marcus:** No, because the label "object" carries modal and causal weight. If there is a table, it is identical to itself across time. It can be the relata of causation. If there are only simples, the "table" is a facon de parler. The causal work is done by the simples. If your translation is correct, then when I say "The table caused the glass to break," I should be able to translate that to "The simples arranged table-wise caused the glass to break" without loss. But there is a loss. The singular reference is lost. The unity is lost.

  **Elena:** Is it? Or is "unity" just a feature of the conceptual scheme? Look, Marcus, imagine we encounter an alien civilization. They have a quantifier that ranges over temporal stages only. They say "There is no person, only person-stages." We say "There are persons." Is one of us wrong about the world? Or do we just have different cognitive interests? I suspect the latter. If you insist your quantifier is the "real" one, you're reifying your own cognitive preference for simples into the fabric of the universe.

  **Marcus:** And if you insist the dispute is verbal, you're insulating your ontology from criticism. If I argue that universalism commits you to bizarre objects—like the object composed of your nose and the moon—you say, "Oh, that's just my dialect." It makes universalism unfalsifiable. A substantive dispute requires that one of us could be wrong. I think you are wrong. Not because you speak bad English, but because you posit structure where there is none. You think the world comes with mereological sums built-in. I think the world comes with simples, and sums are projections. That is a disagreement about the world, not the dictionary.

  **Elena:** But how do you test that? Suppose we both agree on all the atomic facts. We agree on where every particle is. We agree on all the laws of physics. We agree on the truth of "There are particles arranged table-wise." The only leftover disagreement is "Does the table *exist*?" If all the empirical and logical cards are on the table, what is this leftover fact? It looks like a free-floating metaphysical posit.

  **Marcus:** The leftover fact is about fundamentality. We agree on the particles. We disagree on whether the table is *ontologically free-standing*. My claim is that the table's existence is derivative, or rather, false. Yours is that it's fundamental or at least real. If the dispute is verbal, then "exists" has no fixed meaning. But if "exists" has no fixed meaning, then existence isn't a property of the world at all. It's a property of languages. And I'm not a linguistic idealist, Elena. I think existence is mind-independent.

  **Elena:** And I think "mind-independent existence" is a phrase that only makes sense within a conceptual scheme. You want a view from nowhere. You want to say "These are the objects" without admitting that "object" is a category *we* bring to the world. I'm willing to be a universalist because I think existence is cheap. You're willing to be a nihilist because you think existence is expensive. But if we can translate each other's claims without loss of information, the price tag is just a matter of currency, not value.

  **Marcus:** The loss of information is in the explanatory power. If I say "There is no table," I explain why we don't need to worry about the boundaries of the table. If you say "There is a table," you have to explain why *this* collection of atoms is a table and *that* one isn't, or accept that every collection is. If we translate your "every collection is a table" to my "every collection is simples arranged table-wise," I still have to explain why I restrict my ontology. My restriction isn't arbitrary; it's driven by the demand for a fundamental ideology. Your permissiveness is driven by the demand for linguistic convenience. Fundamental ideology trumps convenience.

  **Elena:** So we're back to brute assertion. "Fundamental ideology trumps convenience." Why? Maybe convenience *is* the point of ontology. Ontology is about systematizing our discourse about the world. If my systematization allows me to say "The table exists" without contradiction, and yours requires me to say "There are no tables" while admitting everything behaves exactly as if there were, then my system is more faithful to the phenomena of experience.

  **Marcus:** Faithful to experience, maybe. Faithful to reality? No. Experience tells us the sun moves around the earth. Ontology corrects experience. My ontology corrects the misleading grammar of "there is a table."

  **Elena:** And my ontology corrects the misleading intuition that "existence" requires simplicity.

  *(Silence hangs between them. Marcus sits down, picking up a pen but not writing.)*

  **Marcus:** So, we haven't resolved the Special Composition Question. We've just pushed it back to the Metaontological Question.

  **Elena:** Exactly. I think the quantifier is variable because I think reality doesn't dictate a single logical structure to language. You think the quantifier is invariant because you think reality dictates a single structure to thought.

  **Marcus:** And neither of us can prove our metaontological stance without assuming it in the premises. I can't prove joint-carving without assuming there are joints to carve. You can't prove variance without assuming language isn't bound by structure.

  **Elena:** So we're at a standoff. But it's a better standoff. We're not arguing about shoes and towers anymore. We're arguing about whether "exists" is a tool we use, or a mirror the world holds up.

  **Marcus:** (Nods slowly) I can live with that. As long as you admit that if I'm right, your ontology is literally false. Not just "different." False.

  **Elena:** And as long as you admit that if I'm right, your "falsehood" is just a refusal to speak the common tongue.

  **Marcus:** Deal. Coffee?

  **Elena:** Only if we can agree on whether the coffee mug exists.

  **Marcus:** (Stands up) Don't push it.
