      *Refinement:* For Hume, if A is constantly conjoined with B, and A precedes B, A causes B. In Newcomb's: Prediction (P) precedes Choice (C). P is conjoined with C. So P causes C (or they share a common cause). C does *not* cause P. Therefore, C cannot change P. Two-Boxing follows.

