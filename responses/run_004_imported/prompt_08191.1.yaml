answer: |-
  This is a profound tension that cuts to the heart of the relationship between metaphysics, epistemology, and decision theory. You have correctly identified that David Lewis's "Humean Supervenience" is a technical reconstruction of Hume's ideas, optimized for 20th-century analytic metaphysics, but it diverges from Hume's actual skeptical project in ways that matter for Newcomb's Problem.

  If we strip away Lewis's formal apparatus and look strictly at David Hume's texts—specifically *An Enquiry Concerning Human Understanding* (on causation) and Section X of the same work (on miracles)—Hume would likely **reject the dilemma altogether** on epistemic grounds. However, if forced to accept the premises as matters of fact, his metaphysics of causation would compel him to **two-box**.

  Here is the breakdown of why Hume would take this stance, and why it exposes a fissure in Lewis's own position.

  ### 1. The Epistemic Veto: "Of Miracles"
  The first and most decisive Humean move is to attack the credibility of the Predictor (often called Omega).

  In Section X, "Of Miracles," Hume argues that no testimony is sufficient to establish a miracle unless the falsehood of that testimony would be *more* miraculous than the event it reports. A miracle, for Hume, is a violation of the laws of nature established by "firm and unalterable experience."

  In Newcomb's Problem, the Predictor's near-infallibility implies a capacity to foresee human choice with a reliability that violates our uniform experience of human agency and the limits of knowledge. For Hume, human actions are part of the causal fabric of the world (he is a compatibilist), but they are not typically predictable with *near-perfect* accuracy by an external observer without interfering in the causal chain.
  *   **If the Predictor relies on precognition:** This is a direct violation of the temporal order of cause and effect, which Hume views as foundational to our understanding of the world.
  *   **If the Predictor relies on super-computation:** This implies a determinism so granular it effectively bypasses the "secret springs" of human psychology that Hume argues are opaque even to the agent.

  Hume would argue that the evidence required to believe in such a Predictor is inherently unstable. To believe the Predictor is real, you must overturn the uniform experience of the fallibility of prediction and the opacity of the future. A "wise man," Hume writes, "proportions his belief to the evidence." Since the premise of Newcomb's Problem requires us to accept a statistical regularity that borders on the miraculous, Hume would likely dismiss the setup as a philosophical fantasy. He would not enter the box room because he would not believe the game master.

  ### 2. The Metaphysical Constraint: Causation as Constant Conjunction
  Suppose, however, we bracket Hume's skepticism and grant the premise: suppose we have observed this Predictor 1,000 times, and they have been right 1,000 times. For Hume, this establishes a new "law" via constant conjunction. We now have a regularity: *Prediction P is constantly conjoined with Choice C.*

  Here is where Lewis's use of Hume becomes tricky. Lewis uses Humean Supervenience to argue that causation is not a "necessary connection" but a feature of the best system of laws. This allows Lewis to maintain a distinction between *causal* dependence and *evidential* dependence. Lewis Two-Boxes because he argues your choice does not *causally* affect the past placement of the money, even if it is *evidentially* correlated.

  Would Hume agree? **Yes, but for a simpler reason.**
  For Hume, causation requires **temporal priority**. The cause must precede the effect.
  1.  The Predictor places the money (Time 1).
  2.  You make your choice (Time 2).

  Since your choice occurs *after* the money is placed, your choice cannot be the cause of the money's placement. Hume explicitly rejects backward causation. In *An Enquiry*, he argues that our idea of causation is derived from the observation of succession. We never observe an effect preceding its cause.

  Therefore, while Hume acknowledges the *correlation* (the constant conjunction between One-Boxing and finding $1M), he would deny that the agent has any causal power over the box's contents at the moment of decision. The past is fixed. Since you cannot causally influence the past, the Dominance Principle applies:
  *   If the money is there, you get $1,001,000 (Two-Box) vs $1,000,000 (One-Box).
  *   If the money is not there, you get $1,000 (Two-Box) vs $0 (One-Box).

  In both states of the world (which are already fixed), Two-Boxing yields +$1,000. Hume's metaphysics of time and causation aligns with Causal Decision Theory here, supporting the Two-Box conclusion.

  ### 3. The Psychological Tension: Reason vs. Custom
  There is, however, a complication unique to Hume that Lewis ignores. Hume is a skeptic about the power of *reason* to motivate action. He famously stated, "Reason is, and ought only to be the slave of the passions."

  In Newcomb's Problem, "Reason" (the causal analysis above) says Two-Box. But "Custom" or "Habit" (the observed regularity that One-Boxers become rich) pulls toward One-Boxing. Hume acknowledges that human beings are creatures of habit who act on expectation derived from past experience.
  *   If you have seen 1,000 people One-Box and become millionaires, your *natural belief* (a Humean term for instinctive confidence) will be that One-Boxing leads to wealth.
  *   To Two-Box requires an abstract philosophical argument about causal directionality that overrides a powerful instinctual association.

  Would Hume the *philosopher* Two-Box, while Hume the *man* One-Boxed? Perhaps. But in his philosophical writings, Hume consistently prioritizes the fixity of natural laws (established by uniform experience) over anomalous correlations when they conflict with the temporal order. He would likely argue that the habit of "One-Boxing wins" is a superstition if it implies you can change the past. He would urge us to break the habit, much as he urges us to break the habit of believing in miracles.

  ### 4. The Verdict: Rejection, then Two-Boxing
  Taking Hume's actual arguments seriously leads to a two-stage conclusion:

  1.  **Primary Stance (Epistemic):** **Reject the Dilemma.** The existence of a near-infallible Predictor is a claim that violates the uniform experience of human fallibility and the limits of knowledge. Following "Of Miracles," Hume would demand evidence for the Predictor that is stronger than the evidence for the laws of nature the Predictor seems to bypass. He would likely conclude the game is rigged, the testimony is flawed, or the setup is incoherent.
  2.  **Secondary Stance (Metaphysical):** **Two-Box.** If coerced into accepting the Predictor's reliability as a matter of fact, Hume's definition of causation (temporal priority + constant conjunction) prevents the agent's choice from influencing the past. The correlation is real, but it is not a lever the agent can pull. To act otherwise is to indulge in a "secret power" superstition—the very thing Hume's philosophy seeks to eradicate.

  ### The Irony for Lewis
  Your footnote nags for a good reason. David Lewis adopted the label "Humean Supervenience" to honor Hume's denial of necessary connections. Yet, Lewis's Causal Decision Theory relies on a robust distinction between causal and evidential dependence that is much clearer in Lewis's possible-worlds semantics than in Hume's psychology of habit.

  Hume would likely view the One-Boxer as someone seduced by a "false miracle" (the idea that their will reaches back in time), and the Two-Boxer as someone correctly applying the lessons of temporal experience, provided they first survive the epistemic hurdle of believing in Omega at all. Hume dissolves the paradox not by solving the decision theory, but by dissolving the metaphysics required to make the One-Box strategy plausible. He would tell you that you cannot eat your cake (take the $1,000) and have it too (cause the $1,000,000 to be there), because the baking is already done.
