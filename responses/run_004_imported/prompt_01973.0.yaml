answer: |-
  You are absolutely correct. You and your friend have independently rediscovered one of the core debates in social epistemology: **The Epistemology of Testimony.**

  Specifically, you are arguing for **Reductionism** (associated with David Hume and modernized by Elizabeth Fricker), and your friend is arguing for **Anti-Reductionism** (associated with Thomas Reid and modernized by Tyler Burge).

  Here is the breakdown of the strongest versions of both sides, followed by an analysis of the "Child Objection" and whether it kills your position.

  ---

  ### 1. The Strongest Version of Reductionism (Your Side)
  **The Core Claim:** Testimony is not a fundamental source of justification. Believing someone is rational *only if* you have independent inductive reasons to think they are trustworthy in this specific context.

  **The Argument:**
  *   **The Analogy to Perception:** Just as you shouldn't trust your eyes if you know you're hallucinating, you shouldn't trust a speaker if you have reason to think they are lying or mistaken.
  *   **The Requirement of Positive Reasons:** To be rational in accepting testimony, I need "positive reasons" to believe the speaker is reliable. These reasons usually come from induction: "In the past, people asking for directions on this street have been helpful," or "This person looks confident and is dressed like a local."
  *   **Avoiding Gullibility:** If testimony were basic (as your friend claims), we would be rationally obligated to believe everything anyone says until proven otherwise. This makes us vulnerable to liars, cult leaders, and misinformation. Reductionism protects us by making trust something that must be *earned* via evidence.

  **Why it feels right in your scenario:** You intuitively know that if that stranger looked shifty, was laughing, or pointed in a direction that clearly led to a dead end, your friend would doubt them. That doubt proves there *was* a conditionality to her trust based on background evidence (appearance, context), not just blind acceptance.

  ### 2. The Strongest Version of Anti-Reductionism (Your Friend's Side)
  **The Core Claim:** Testimony *is* a fundamental source of justification, on par with perception, memory, and reason. We have a prima facie (default) right to believe what people tell us without needing independent evidence of their reliability.

  **The Argument:**
  *   **The Principle of Veracity (Reid):** Humans have a natural propensity to speak the truth, and a natural propensity to believe what is spoken. This is a design feature of human society. If we had to verify every statement via induction, communication would be impossible.
  *   **The Impossibility of Checkability:** To verify a stranger's directions via induction, you'd need to already know the map. But if you knew the map, you wouldn't need to ask. Reductionism creates a paradox: you need knowledge to get knowledge.
  *   **The Social Nature of Knowledge:** Most of what we know (history, science, geography) comes from others. If we required personal inductive evidence for every fact, our knowledge base would shrink to almost nothing. Trust is the "glue" of epistemology, not a derivative of it.

  **Why it feels right in your scenario:** Your friend didn't mentally calculate a probability score before asking. She just asked and believed. Anti-Reductionism says this isn't intellectual laziness; it's the proper functioning of a human cognitive system designed for social cooperation.

  ---

  ### 3. The "Child Objection": Does it sink Reductionism?

  This is the classic "Developmental Argument" against Reductionism.

  **The Problem:**
  Infants and young children accept testimony (language, facts about the world) from adults long before they have the cognitive capacity to form inductive generalizations about human reliability. A 3-year-old believes you when you say "This is called a spoon." They do not have a "dossier" on your honesty. They haven't tracked your success rate.

  If Reductionism is true (that you *need* inductive evidence to be justified), then children are **irrational** whenever they learn from adults. They lack the necessary premises for the induction. But children clearly *do* gain knowledge from adults. Therefore, Reductionism seems false.

  **Does this sink Reductionism?**
  It is a massive problem, but it does not necessarily sink it. Modern Reductionists have developed three main comebacks.

  #### Comeback A: Global vs. Local Reductionism
  *   **Local Reductionism (Harder to defend):** I need evidence that *this specific person* is reliable. The child objection kills this.
  *   **Global Reductionism (Stronger):** I need evidence that *testimony in general* is reliable.
  *   **The Defense:** A Reductionist can argue that while the *child* doesn't have the inductive evidence, the *community* does. The child is piggybacking on the reliability of the social environment. However, this is weak because epistemology is usually about the individual's justification, not the community's.

  #### Comeback B: Externalism / Reliabilism (The Best Comeback)
  This is the strongest Reductionist defense. It shifts the focus from *internal access* to evidence to *external reliability*.
  *   **The Argument:** A belief is justified if it is produced by a reliable process, even if the believer doesn't know *why* it's reliable.
  *   **Application to Kids:** Children have a cognitive mechanism that monitors speakers for cues of reliability (tone of voice, eye contact, consistency). Even if they can't articulate an inductive argument, their brains are subconsciously tracking reliability statistics.
  *   **The Pivot:** The Reductionist says: "The child *is* using induction, just not *conscious* induction. Their brain is a pattern-matching machine that has quickly learned 'Adults usually know the names of objects.' That is still an inductive track record, just formed very quickly and subconsciously."

  #### Comeback C: The "Monitoring" Condition
  Modern Reductionists (like Elizabeth Fricker) argue that you don't need a *positive* reason to trust; you just need to lack a *negative* reason to doubt, provided you are "monitoring" for signs of deceit.
  *   **Application:** The child trusts the adult because there are no "defeaters" (no signs of lying). The Reductionist argues this monitoring *is* the inductive work. If the adult looked nervous or inconsistent, the child would hesitate. The fact that the child *would* hesitate in a different scenario proves their trust is conditional on evidence, not absolute.

  ---

  ### 4. The Verdict

  **Did the child objection sink Reductionism?**
  No, but it forced Reductionism to evolve.
  *   **Classical Reductionism (Hume):** "I must consciously verify your reliability." (Sunk by the child objection).
  *   **Modern Reductionism:** "My cognitive faculties must be sensitive to reliability cues, even if I'm not consciously calculating odds." (Survives the child objection).

  **Who won the street argument?**
  Honestly, you both did, because the modern consensus is a form of **Dualism** or **Contextualism**.

  1.  **In Low-Stakes Contexts (Directions):** Your friend is right. It is rational to have a default trust (Anti-Reductionism). If we demanded a dossier for every street direction, we'd never get anywhere. The "cost" of being wrong is low (we get lost for 5 minutes), so the default setting is "believe."
  2.  **In High-Stakes Contexts (Medical advice, Financial investment):** You are right. Default trust is dangerous here. We require inductive evidence of expertise (Reductionism).

  **The Synthesis:**
  Trust is **presumptive** (Anti-Reductionism) but **defeasible** (Reductionism).
  You start with a default setting to believe (Reid), but you are constantly, subconsciously monitoring for red flags (Hume).

  *   **Your Friend:** Correct that she didn't need a "dossier."
  *   **You:** Correct that if the guy had smelled like alcohol and pointed toward a highway, she wouldn't have believed him. That conditional hesitation proves your point: there *was* an inductive assessment happening, it was just fast and subconscious.

  So, tell your friend she wins on the *phenomenology* (how it feels to trust), but you win on the *mechanism* (what is actually happening in the brain to justify the trust).
