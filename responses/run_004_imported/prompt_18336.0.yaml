      *   **Move 4 (Marco):** The *reason* for deference distinguishes legitimacy from tyranny. The three levels matter.
          *   *Analysis:* This appeals to the "reason of effects." The wise man obeys not because he thinks the king is naturally superior, but to maintain order and avoid civil war, acknowledging the utility of the fiction. This internal disposition *is* the moral difference. For Pascal, intention/charity matters more than external action alone.
