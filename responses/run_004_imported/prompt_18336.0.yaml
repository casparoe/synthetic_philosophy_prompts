          *   *Verdict:* Marco is philosophically stronger here. He identifies the normative residue in Pascal's language that Ines's Thrasymachean reading wipes out. Pascal is not a cynic; he is a pessimist about human capacity, not about divine truth.

      *   **Move 3 (Ines):** Practical advice is the same ("obey established power"). Metaphysics doesn't change the political outcome.
