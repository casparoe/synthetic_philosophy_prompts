prompt: |-
  Ok so this is kind of a random rabbit hole but I think it's actually a real philosophy question and not just me being nerdy. In my intro logic unit we covered Frege (the guy who basically invented modern predicate logic and did all the sense vs. reference stuff), and afterward I went and read more about him and found out that in 1924, like a year before he died, he kept a private diary that is genuinely awful — he wanted Jews stripped of political rights or deported, hated the Weimar parliament/constitution, and was cheering on the same nationalist party that went on to ally with the early Nazis. Apparently his own son, and then the later editors of his collected papers, just quietly left it out for decades, and it only became widely known because Michael Dummett (like THE Frege scholar) dug up fragments of it in the 50s and was reportedly kind of devastated, since he'd always thought of Frege as this perfectly cold, rational logic-machine of a guy.

  Here's the part I can't stop thinking about though. Frege was obsessed with the idea that a real "concept" has to have completely sharp boundaries — no vagueness allowed, every single object either definitely falls under it or definitely doesn't, and that's basically a founding rule of his whole logical system. And then in a comment thread about this I saw someone point out that in that same diary he's apparently also wrestling with the practical problem of how you'd draw a precise enough legal line around "who counts as Jewish" (because of intermarriage etc) for antisemitic laws to actually be enforceable. Which feels like it can't be a total coincidence? Or maybe it is and i'm just seeing a pattern that isn't really there because it makes a satisfying story.

  Can you write me an essay that actually takes this on: does Frege's diary/political writing bear on how we should evaluate his logic and philosophy, or is it basically just sad biographical baggage that's seperate from the actual arguments (kind of like how Newton being obsessed with alchemy doesn't really touch the calculus)? I want you to seriously make the case for both "it's totally irrelevant, you judge the arguments on their own merits" and "no, there are real non-superficial connections between his politics and his technical philosophy" (feel free to use the sharp-boundaries thing as your example of a possible connection, or use a better one if you've got it), and then actually land on an answer instead of ending with "it's complicated." My philosophy teacher is always on us about how a good essay has to commit to a thesis, so please actually commit.
