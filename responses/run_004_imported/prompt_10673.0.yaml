answer: |-
  Good evening, everyone.

  For those who don't know me, I'm [Name]. I started in this department as a philosophy student, and I now work as a science journalist. My editors often tell me to stop writing about free will, and I often tell them that the universe won't let me. So, it feels appropriate that I'm standing here tonight. Because if I were truly free to choose my topics, I probably wouldn't be obsessed with the very thing that suggests I can't choose anything at all.

  We are here to honor Professor [Name]. And this presents a unique rhetorical challenge. In any other retirement toast, I would stand here and tell you how much she *deserves* this. I would say she *earned* every bit of this affection through the sheer force of her will and her moral character. I would say that she is the ultimate author of her own success.

  But if I said that, she would correct me. And she would be right to.

  For forty years, she has opened nearly every class she taught—from Intro to Ethics to the graduate seminars—with Galen Strawson's Basic Argument. She reminded us that to be truly responsible for your actions, you must be responsible for the character that produced them. But to be responsible for your character, you must have chosen it. And to choose it, you needed a prior character to make that choice. It is a regress that stops nowhere. As she loved to point out, ultimate moral responsibility is impossible, regardless of whether determinism is true.

  She also loved to remind us of the family drama: that Galen's argument dismantles the very ground his father, P.F. Strawson, tried to stand on in *Freedom and Resentment*. She taught us that even the greatest philosophical families are not immune to the causal chains of disagreement.

  So, I find myself in a bind. How do I honor a teacher without attributing to her the kind of ultimate desert her life's work spent dismantling? If I praise her "virtue," am I ignoring the genetics and the luck and the historical circumstances that made that virtue possible? If I thank her for her "choices," am I pretending she was an unmoved mover?

  The answer, I think, lies in the very argument she taught us.

  The Basic Argument denies ultimate responsibility, but it does not deny *causality*. It does not deny *impact*. It does not deny that certain events in the universe are profoundly better than others.

  Professor [Name], we are not here tonight to assert that you are the metaphysical origin point of your own goodness. We are here to acknowledge that you are a vital, indispensable link in a causal chain that includes all of us.

  We are here because you showed up. For forty years, you walked into classrooms. You introduced students to the rigor of the regress. You challenged us when we were sloppy and supported us when we were stuck. Whether or not you were "ultimately responsible" for that dedication is a metaphysical question. But the *effect* of that dedication is an empirical fact.

  Look around this room. We are lawyers, journalists, technologists, and philosophers. We are the downstream effects of your labor. The way we think, the way we argue, the way we scrutinize the world—these are patterns you helped encode in us. In a deterministic sense, you are part of the explanation for why we are who we are. And while we may not be able to praise you as the *creator* of your character, we can certainly celebrate you as the *carrier* of it.

  There is a warmth in the Basic Argument, if you look for it. It teaches us humility. It reminds us that our successes are gifts of luck and circumstance, not just trophies of the will. And tonight, we offer you a gift in return. Not because you metaphysically *earned* it in a libertarian sense, but because this gathering is the natural, inevitable, and joyful reaction of students who found a teacher who changed their trajectory.

  We know that P.F. Strawson argued that our reactive attitudes—our gratitude, our resentment, our love—are unavoidable features of human life, regardless of the metaphysics. Galen argued that those attitudes rest on a fiction. But tonight, we don't need to resolve the family feud. We just need to acknowledge the feeling.

  My gratitude to you is real, even if its metaphysical grounding is shaky. Your impact on us is undeniable, even if its ultimate origin is not yours alone.

  So, I would like to propose a toast.

  To Professor [Name]. May we honor you not as the uncaused cause of your own greatness, but as the profound and necessary condition of our own. May your retirement be filled with the same rigor, the same warmth, and the same delightful contradictions that you brought to the classroom for four decades.

  And may we all remember, when we leave here tonight, that while we may not be ultimately responsible for who we are, we are still responsible to each other for what we do next.

  To Professor [Name].
