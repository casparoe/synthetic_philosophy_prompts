answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], a friend from [Bride]'s grad school days.

  Looking around this room, I realize I have a unique challenge. About half of you are family and friends who just want to know why the bride is so stubborn. And the other half are decision theorists who are currently mentally checking my p-values. So, I'm going to try to walk a line here. I promise to keep the math light, and the sentiment heavy.

  For years, [Bride] has lived by a specific motto. It's a principle from the statistician I.J. Good. In plain English, it says: *It can never hurt, in expectation, to look at one more piece of evidence before you make a decision.*

  To the family: This explains why it took her three weeks to pick a wedding venue. She was just maximizing expected utility.
  To the stats friends: Yes, I know. This assumes costless information and stationary utilities. I read the paper.

  But as I was preparing for today, I started thinking about what happens when you apply a Bayesian framework to love. Because there is a massive gap between that theorem and the human heart.

  The theorem says looking for more evidence *can't* hurt you. But anyone who has ever been in a relationship knows that sometimes, looking hurts like hell.

  In the lab, "one more piece of evidence" is a data point. In dating, "one more piece of evidence" is scrolling back through text messages from three months ago to analyze tone. It's asking, "What did you mean by that?" It's looking for a reason to doubt when you should be finding a reason to trust. Theoretically, the value of that information is non-negative. Emotionally? That's just anxiety with a calculator.

  [Bride], you have spent your career teaching us that we should always update our priors. That we should never stop searching for the truth. But the miracle of today is that you are finally violating your own theorem.

  You are standing here and declaring that the search is over. You are saying that the cost of looking for more evidence is now higher than the value of finding it. You have decided that certainty is less important than commitment.

  And that brings me to [Groom].

  [Groom], in statistical terms, you are what we call a "sufficient statistic." You contain all the information [Bride] needs. She doesn't need to sample the population anymore. She doesn't need to run more trials. The posterior probability that you are the one is, for all intents and purposes, equal to one.

  [Bride], my hope for you is that you keep your Bayesian mind for your work, where it belongs. But in your marriage, I hope you allow yourself a little bit of frequentist confidence. Trust the data you have. Ignore the outliers. And when things get hard, don't go looking for new evidence that things are wrong. Look at the evidence you already have: that you are loved, you are chosen, and you are home.

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May your life together be full of love, and may your need for further evidence be zero.

  Cheers!
