prompt: |-
  There's a student in my grade with a reputation in our high school's card-trading circle for spotting which players are about to become valuable before anyone else catches on; he trades often enough that it clearly isn't just luck. Yesterday he offered to swap me a graded rookie card from his own collection for two ungraded cards of mine, explaining that he's just trying to diversify what's in his binder, and everyone in our group chat agrees the deal heavily favors me. Part of me wants to accept before he changes his mind, but another part keeps wondering why someone with his track record would willingly hand me the better end of a trade. Am I just lucky this time, or does the fact that he's the one offering the deal give me real reason to be suspicious of it?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The Actor:** A high school student with a *reputation* for spotting undervalued players before anyone else. He trades *often*, suggesting skill/experience, not luck.
      *   **The Offer:** He offers a *graded rookie card* (from his personal collection) for *two ungraded cards* of the user.
      *   **The Consensus:** Everyone in the group chat agrees the deal *heavily favors the user*.
      *   **The Justification:** He claims he wants to "diversify his binder."
      *   **The Conflict:** User wants to accept (fear of missing out) vs. User is suspicious (why would an expert make a "bad" trade?).
      *   **The Core Question:** Is this luck, or is there a hidden catch?

  2.  **Evaluate the Red Flags (The "Too Good to Be True" Principle):**
      *   *Reputation vs. Action:* If he's known for spotting value *before* others, why is he giving away value *now* when everyone already sees it?
      *   *Graded vs. Ungraded:* Graded rookies (especially if valuable) usually command a premium. Ungraded cards carry risk (condition issues, authenticity, etc.).
      *   *Group Chat Consensus:* If *everyone* thinks it's a steal, why hasn't someone else snapped it up? Or, is the group chat also inexperienced?
      *   *Motivation:* "Diversifying" is a valid strategy, but usually, you trade lateral value (equal value), not down value (giving up more to get less), unless you desperately need liquidity or specific pieces.

  3.  **Brainstorm Potential Scenarios:**
      *   *Scenario A: Genuine Mistake/Desperation.* He needs cash (maybe not cards, but liquidity) or specifically wants those two cards for a set build. He might be undervaluing his own card.
      *   *Scenario B: The Card is Problematic.* Is the graded card authentic? Is the grade controversial? Is it a "fake" slab? Is the player about to get bad news (injury, scandal)?
      *   *Scenario C: The User's Cards are Hidden Gems.* Does he know something about the two ungraded cards that the user doesn't? (e.g., rare parallels, printing errors, future breakout potential).
      *   *Scenario D: Social Engineering.* He wants to build trust for a bigger scam later. Or he wants to offload a "hot potato" card before the market crashes.
      *   *Scenario E: Market Misalignment.* Maybe the "group chat" valuation is wrong.

  4.  **Formulate Advice/Action Plan:**
      *   **Validate the Suspicion:** Acknowledge that the user's gut feeling is correct. In trading markets (stocks, cards, crypto), if an expert makes a trade that looks bad for them, there's usually a reason.
      *   **Due Diligence Steps:**
          *   Check the graded card (cert number, population report, recent sales).
          *   Check the ungraded cards (why does *he* want them specifically?).
          *   Investigate the player on the graded card (news, rumors).
          *   Ask direct questions (why this trade?).
      *   **Risk Management:** Don't rush. A legitimate trader will wait.
      *   **Social Dynamics:** Consider the high school context. Reputation matters. Scamming peers can backfire socially.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Cautious, analytical, supportive but realistic. Not accusatory, but protective.
      *   *Key Point 1: Trust your gut.* The "Expert Paradox." If he's good at finding value, he shouldn't be giving it away easily.
      *   *Key Point 2: Investigate the Graded Card.* Authentication is key. Fake slabs exist.
      *   *Key Point 3: Investigate Your Cards.* Why those two? Does he know a secret about them? (Less likely to be bad for user, but explains his motive).
      *   *Key Point 4: Market Check.* Are recent sales actually supporting the "good deal" narrative?
      *   *Key Point 5: The "Diversify" Excuse.* It's vague. Push for specifics.
      *   *Conclusion:* Proceed with extreme caution. It's okay to walk away.

  6.  **Refining the Advice (Self-Correction during drafting):**
      *   *Correction:* I shouldn't say "It's definitely a scam." It *could* be a genuine mistake or a specific set-building need. I need to balance skepticism with possibility.
      *   *Emphasis:* Highlight the "Group Chat" factor. High schoolers might not know true market value. They might be hyping it up.
      *   *Specific Check:* Mention checking the certification number on the slab. That's a concrete step.

  7.  **Final Polish:** Organize into clear sections (The Red Flags, The Investigation, The Decision). Ensure the advice empowers the user to make an informed choice without causing panic. (This aligns with the final output structure).

  8.  **Final Review against Safety Guidelines:** Does this promote gambling? No, card trading is a hobby/collectible market. Does it promote deceit? No, it advises against being deceived. Is it helpful? Yes.

  **(Self-Correction Note):** Wait, one nuance. If the user's cards are *actually* undervalued gems that the expert spotted, then the trade is fair from *his* perspective, but looks like a steal to the *user*. This is a crucial distinction. I need to make sure the user considers that *their* cards might be the ones with hidden value, which would make the trade legitimate, just asymmetric in information.

