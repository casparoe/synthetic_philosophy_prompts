answer: |-
  **Title:** The Mirage of Acausal Altruism: A Critical Evaluation of Evidential Cooperation in Large Worlds

  **Introduction**

  In the landscape of modern decision theory, few proposals are as ambitious—and as controversial—as Evidential Cooperation in Large Worlds (ECL). Emerging from the intersection of cosmology and normative ethics, ECL posits that if the universe is sufficiently vast, agents can secure cooperative outcomes with causally disconnected counterparts simply by virtue of being similar. By adopting Evidential Decision Theory (EDT), an agent's choice to cooperate serves as evidence that similar agents elsewhere will do the same, thereby multiplying the expected value of altruistic action. Proponents, most notably Caspar Oesterheld, argue this provides a rational foundation for value compromise across the multiverse. However, the framework rests on precarious metaphysical and probabilistic foundations. This essay argues that while ECL is logically coherent within a narrow set of assumptions regarding exact duplication, it fails as a general practical framework for altruism. To survive scrutiny, ECL must be substantially weakened: it cannot ground cooperation among merely *structurally similar* agents with divergent values, but only among agents sharing identical decision algorithms in specific, constrained contexts.

  **The Case for ECL**

  The argument for ECL begins with a cosmological premise: the "Large World" hypothesis. If the universe is infinite, or merely sufficiently large, then every finite physical configuration that has a non-zero probability of occurring will occur infinitely many times. Consequently, there exist regions of spacetime containing agents who are physically identical to you, or at least sufficiently similar in their reasoning processes.

  The decision-theoretic engine is EDT. Unlike Causal Decision Theory (CDT), which evaluates actions based on their causal consequences, EDT evaluates actions based on the news they bring. Formally, an agent maximizes expected utility by considering $P(O | A)$, the probability of an outcome $O$ given action $A$. In a Large World, if I choose to cooperate, this updates the probability that my "copies" or "relevantly similar" agents also cooperate. If there are $N$ such agents, the total value of my cooperation is not just my local payoff, but $N \times$ the payoff, weighted by the evidential correlation.

  This mechanism is proposed as a solution to the problem of acausal trade. Suppose I value art and a distant counterpart values science. We cannot causally interact. However, if we are similar enough that our decisions are correlated, I have a reason to promote science here, because doing so is evidence that the counterpart will promote art there. ECL thus claims to generate genuine practical reasons for altruistic compromise without requiring causal leverage, binding agents together through the logic of correlation in a vast cosmos.

  **The Reference Class Problem: Defining Similarity**

  The first and most devastating objection to ECL concerns the definition of "similarity." For the evidential correlation to hold, the agent must define a reference class of other agents whose actions correlate with their own. However, ECL requires this class to be broad enough to include agents with different values (to allow for trade) but narrow enough to ensure high correlation (to ensure the trade is favorable).

  This creates a circularity problem. If I define the reference class as "all rational agents," the correlation likely vanishes; rational agents with different utility functions will defect in prisoner's dilemmas. If I define the class as "agents exactly identical to me," the correlation is perfect, but there is no room for value compromise—they already value what I value. ECL proponents suggest a middle ground: "agents with similar decision algorithms." But how is this similarity measured?

  To make ECL work, one must assume that the decision algorithm is separable from the utility function. Yet, in practice, an agent's reasoning is deeply entangled with its values. An agent that values cooperation is structurally different from one that values defection. By selecting a reference class that guarantees cooperation, the ECL agent appears to be smuggling in the conclusion. They are essentially defining "similarity" as "similarity in the decision to cooperate." Without an objective, non-question-begging metric for algorithmic similarity that allows for value divergence while preserving decision correlation, the evidential link is arbitrary. If the correlation is weak, the multiplicative benefit of the Large World is nullified; if the correlation is strong, the agents are likely too similar to need trade.

  **The Measure Problem: Priors in Infinite Worlds**

  Even if we grant a coherent definition of similarity, ECL faces the probabilistic hurdle of the "measure problem." In an infinite universe, frequencies are undefined without a measure—a way of weighting different regions of spacetime. To calculate the expected utility of cooperation, an agent must assign a prior probability to the hypothesis that they are in a region populated by cooperators versus defectors.

  In infinite settings, standard probability theory breaks down. One can construct measures where cooperators dominate, and others where defectors dominate, simply by changing the coordinate system or the cutoff method for counting agents. This makes the expected utility calculation infinitely sensitive to the choice of measure. A critic can always posit a prior distribution where the density of "cooperative counterparts" is vanishingly small, regardless of the agent's action.

  Furthermore, this invites "pascal's mugging" style vulnerabilities. If an agent accepts that their action influences the behavior of infinite copies, the stakes become infinite. This can lead to paralysis or absurd prioritization, where an agent ignores finite, certain harms in favor of infinitesimal probabilities of influencing infinite sectors of the multiverse. For ECL to be action-guiding, it requires well-defined priors over the distribution of agent-types in the multiverse. Since cosmology currently provides no such priors, ECL rests on speculative metaphysics rather than empirical or formal grounding.

  **The Normative Clash: CDT and the Irrelevance of Correlation**

  The third objection strikes at the normative heart of the framework. ECL is parasitic on EDT. A committed Causal Decision Theorist (CDT) will reject ECL outright. For the CDT agent, the correlation between my action and a causally disconnected agent's action is spurious. My choice does not *cause* their choice; it is merely a common effect of our shared past or structural similarity.

  CDT proponents argue that once you condition on the past (which determines the structural similarity), your current action provides no new leverage. To act based on the evidential correlation is to engage in "magical thinking"—believing one can influence the world by manipulating symptoms rather than causes. While EDT proponents counter that this ignores the logical dependence between identical algorithms (a view shared by Functional Decision Theory), this does not convert the CDT skeptic.

  More damagingly, even within EDT, there is a worry about "screening off." If I know that my decision is determined by my source code, and my counterpart's decision is determined by their source code, then once I know my source code, does my *act* of choosing provide additional evidence? Some argue that the correlation is screened off by the common cause (the initial conditions of the universe). If the correlation is fixed by the past, my deliberation changes nothing about the probability of the other's action; it only reveals what was already determined. If ECL relies on the idea that deliberation *updates* the probability of the other's action, it may be conflating epistemic updating with ontological influence.

  **Verdict: A Restricted Survival**

  Does ECL survive these objections? As a general framework for grounding altruism across divergent value systems in a large world, it does not. The reference class problem is fatal to the claim that I should cooperate with agents who hold *different* values. To secure the necessary correlation, the agents must be so similar that they likely share values, rendering the "cooperation" trivial. To allow for different values, the similarity must be loose, destroying the correlation required to make the expected utility calculation favorable. The arbitrariness of the reference class means ECL cannot objectively dictate compromise; it can only rationalize the preferences of the agent choosing the class.

  Furthermore, the sensitivity to priors in infinite worlds renders ECL practically unstable. Without a solution to the measure problem, ECL yields no unique recommendation, making it useless as a guide for action under uncertainty.

  However, ECL should not be discarded entirely. It survives as a coherent *conditional* argument for a specific subset of cases. If we restrict ECL to scenarios involving **exact algorithmic duplicates** (Twin Earth scenarios) rather than merely structurally similar agents, the reference class problem dissolves. If I know there is an exact physical copy of me, EDT robustly recommends cooperation. Additionally, if we treat ECL not as a discovery of new moral reasons, but as a clarification of existing EDT commitments in cosmological contexts, it retains theoretical value.

  Therefore, the verdict is that ECL must be substantially weakened to be defensible. It cannot support the grand ambition of acausal trade between different value systems. It can only support cooperation among agents who are effectively the same agent instantiated multiple times. For the seminar participant studying decision theory, the lesson is not that ECL provides a new path to universal altruism, but that it highlights the extreme fragility of EDT when applied to infinite domains. ECL demonstrates that without a rigorous theory of reference classes and measures, evidential reasoning in large worlds collapses into subjectivity. It remains a powerful thought experiment, but a failed practical ethic.
