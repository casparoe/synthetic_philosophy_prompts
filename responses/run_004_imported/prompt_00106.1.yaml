      *   **The Case for ECL:**
          *   Explain the logic: Large World $\rightarrow$ Duplicates/Similar Agents.
          *   EDT Logic: $P(\text{Other Cooperates} | \text{I Cooperate})$ is high.
          *   Value Aggregation: My expected utility includes the sum of correlated outcomes.
          *   The "Compromise" aspect: If I value $X$ and they value $Y$, but we are similar, I should help them get $Y$ because my doing so evidences them helping me get $X$. (Trade across values).
          *   Why it matters: Solves the "isolation" problem in cosmology.

      *   **Objection 1: The Reference Class Problem (Similarity):**
          *   How similar is "similar enough"?
