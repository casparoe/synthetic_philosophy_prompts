      *   *Mechanism:* If the universe is vast (infinite or very large), there are likely many agents identical or very similar to me. My decision provides *evidence* about what those agents do. If I cooperate, it's evidence they cooperate. Therefore, the total value of my action includes the impact of their correlated actions.
      *   *Goal:* To ground altruism/cooperation across value systems without causal contact.
