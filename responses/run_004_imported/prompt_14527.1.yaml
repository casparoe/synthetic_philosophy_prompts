      Also, address the "designer" angle more rigorously. If I write a book, I am the *āpta*. If I write a program that writes a book, am I the *āpta* of the program's output? Nyāya would likely say no, because I don't know the specific content (*yathārtha-jñāna* of the specific proposition).

