      *   Use *saṅketa* (convention) correctly.
      *   Reference *Nyāyakusumāñjali* (NK) arguments regarding God/Authorship if relevant (Udayana uses authorship to prove God; here we ask about machine authorship).
      *   Mention *Gautama's Nyāya-sūtra* definition of *śabda*.
