      *   *The Āpta Condition:* Break down *yathārtha-jñāna* and *vaktum-icchā*. Show how LLMs fail both. They simulate knowledge; they don't possess it.
      *   *The Tātparya Problem:* This is the core Nyāya linguistic argument. Meaning is fixed by intention. LLMs use statistical likelihood. This is a category error.
      *   *The Apauruṣeya Parallel:* Udayana fought Mīmāṃsā on this. He said sentences *must* have an author. LLM output has no *present* author. Is it a "zombie author"?
      *   *Locating the Author:*
