answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm the friend who, when we're deciding where to eat, creates a weighted spreadsheet of our options. I am, by trade and by annoying habit, a statistician.

  Because of this, for months, I have been pressured—*pressured*—to open this speech with a very specific joke. You know the one. It usually goes: "Statistics show that forty percent of marriages end in divorce. So, looking at [Partner A] and [Partner B] tonight..."

  It gets a laugh. It's dark, it's risky, and it's what people expect from the data person.

  But I can't say it. And not just because it's inappropriate for a happy day. I can't say it because, professionally, it would be malpractice.

  See, that forty percent number suffers from what we call the **Reference Class Problem**. It's a fancy way of saying that you can't predict an individual outcome by looking at a general average. If I want to predict the success of *this* marriage, looking at "All Marriages" is bad science. That group includes people who met on a dare, people who hate each other, and people who refuse to communicate.

  [Partner A] and [Partner B] don't belong to the class of "All Marriages." They belong to much smaller, more specific groups.

  They belong to the class of "College Sweethearts Who Actually Grew Up Together." They belong to the class of "People Who Make Each Other Laugh Until They Snort." They arguably belong to the very high-risk, high-reward class of "Two People Who Still Cannot Agree On How To Load The Dishwasher," but frankly, the data on that is still inconclusive.

  When you narrow the reference class down to "Two people who are deeply committed, fiercely kind, and genuinely best friends," the failure rate doesn't just drop. It vanishes. The sample size is small, but the correlation is perfect.

  As a statistician, I look for variables that predict long-term success. And tonight, looking at the way they look at each other, I can tell you that the standard models don't apply here. They are outliers. They are the data point that breaks the curve.

  So, I won't give you the odds of them staying together. Because the only variable that matters is the one we're all witnessing right now.

  If everyone could please raise a glass.

  To [Partner A] and [Partner B]. May your life together be the one statistic that defies the average, every single day. To the bride and groom!
