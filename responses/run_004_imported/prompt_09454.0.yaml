answer: |-
  The debate between David Lewis's Counterpart Theory and the Kripkean orthodoxy of Transworld Identity (TWI) is the central fault line in modern modal metaphysics. When analyzing *de re* modal claims about ordinary contingent beings—people like Humphrey—the standard instinct is to side with Kripke. It seems obvious that when we say "Humphrey could have won," we are talking about *Humphrey*, not some merely similar surrogate in another cosmos. However, this intuitive advantage is superficial. While Transworld Identity preserves our pre-theoretic semantics, it collapses under metaphysical scrutiny. For concrete particulars, Counterpart Theory is the superior account. It sacrifices a shallow intuition to save the coherence of property instantiation and identity.

  Kripke's famous "Humphrey Objection" is the primary weapon for the TWI advocate. In *Naming and Necessity*, Kripke argues that Lewis's analysis changes the subject. If Humphrey is world-bound, then the winner in a distant possible world is not Humphrey, but a counterpart. Kripke asks: why should Humphrey care what happens to someone else? If modal properties are meant to capture *my* possibilities, analyzing them via distinct individuals seems to miss the point of *de re* modality entirely. It renders modal claims irrelevant to the subject's own identity.

  Lewis's reply is often underestimated. He argues that counterparts are not merely "other people"; they stand in a relation of similarity that represents *how the original could have been*. We care about our counterparts for the same reason we care about our future selves: they are connected to us by a relation of psychological and physical continuity (or similarity) that matters for survival and possibility. However, even if Lewis's pragmatic defense neutralizes the emotional force of Kripke's objection, the real victory for Counterpart Theory lies in metaphysics, not semantics. TWI faces two insurmountable hurdles: the Problem of Accidental Intrinsics and Chisholm's Paradox.

  Lewis's argument from Accidental Intrinsics is devastating for TWI. Consider Humphrey's having four limbs. This is an intrinsic property; it depends only on Humphrey, not his relation to anything else. If Humphrey exists in multiple worlds, and has four limbs in one but three in another, he possesses incompatible intrinsic properties. The TWI theorist must claim that having-four-limbs is not a two-place relation between an individual and a property, but a three-place relation between an individual, a property, and a world. But this relationalizes the intrinsic. It implies Humphrey never simply *has* four limbs; he only has them *relative to a world*. This undermines the very notion of intrinsicness. Counterpart Theory avoids this cleanly. The actual Humphrey has four limbs. His counterpart has three. There is no contradiction because distinct individuals hold distinct properties. The metaphysical cost of TWI—destroying intrinsic properties—is too high to pay for the semantic comfort of strict identity.

  Furthermore, TWI cannot adequately resolve Chisholm's Paradox. Chisholm asks us to imagine a chain of possible worlds where Humphrey undergoes tiny incremental changes from world to world. If identity is transitive and strict, Humphrey in World 1 is identical to Humphrey in World 2, and so on, until we reach a world where the individual shares no significant properties with the original Humphrey. TWI forces us to either accept that Humphrey is identical to someone completely unlike him (absurd) or posit a sharp cutoff point where identity ceases despite negligible change (arbitrary). Counterpart Theory dissolves the paradox by denying strict identity across worlds. The counterpart relation is based on similarity, which is vague and non-transitive. It is perfectly coherent to say A is a counterpart of B, and B of C, without A being a counterpart of C. This matches our intuitive handling of vagueness without forcing logical contradictions.

  Therefore, the verdict must be in favor of Counterpart Theory for concrete particulars. The TWI advocate charges CT with changing the subject, but CT charges TWI with changing the metaphysics of properties and identity. The latter charge is far more serious. Kripke's objection relies on the intuition that modal claims must track strict identity to matter. But as Lewis shows, what matters for modality is representation, not identity. We use counterparts to model possibilities because strict identity across worlds creates logical impossibilities regarding intrinsics and vagueness.

  Transworld Identity works fine for abstracta or rigid designators in a semantic vacuum, but for flesh-and-blood entities like Humphrey, it is metaphysically unsustainable. It demands that intrinsic properties be relational and that identity be immune to sorites-style erosion. Counterpart Theory accepts the cost of analyzing "Humphrey could have won" as "A counterpart of Humphrey wins," but in exchange, it preserves the logical consistency of properties and the vagueness of identity. In metaphysics, consistency must trump intuition. Counterpart Theory wins because it is the only view that allows Humphrey to be genuinely contingent without ceasing to be a coherent individual.
