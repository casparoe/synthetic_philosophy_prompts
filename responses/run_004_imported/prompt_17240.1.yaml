  - Every vector space has a basis
  - There exists a subset of the reals that isn't Lebesgue measurable
  - Every set can be well-ordered
  - The Banach-Tarski thing, where you cut a solid ball into finitely many pieces and reassemble them into two balls the same size as the original
  - Every surjection between sets has a right inverse
  - Tychonoff's theorem for arbitrary products of compact spaces
  - There's a non-principal ultrafilter on the natural numbers

  Give me the ranking as a JSON list, ordered from least to most costly, like:

  ```json
  {"ranking": ["...", "...", "...", "...", "...", "...", "..."]}
  ```
