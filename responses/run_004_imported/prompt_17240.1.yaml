  Hey, I'm a retired physicist and I've spent the last few months falling down a philosophy-of-math rabbit hole in retirement. I keep running into the axiom of choice, and it seems like everyone reaches for Banach-Tarski the second they want to make AC look insane, which always struck me as a bit lazy -- theres a whole zoo of equivalents and consequences of AC and they can't all be equally weird, can they?

