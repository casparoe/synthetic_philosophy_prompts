      *   **Core Question 2 (Ghazali vs. Hume):** How does Ghazali's "custom" compare to Hume's "custom/habit"? Are they doing the same move (God's habit vs. Human psychology)?
      *   **Core Question 3 (Science):** Does occasionalism, on its own terms, allow for empirical science, or does denying necessary connection undermine it regardless of "custom"?

