answer: |-
  You are right, and your friend is making a very common category error. While the *name* "Independence of Irrelevant Alternatives" suggests a link to individual consistency, the mathematical structure and the substantive constraint in Arrow's theorem are fundamentally different from the consistency conditions in individual choice theory (like WARP or Sen's properties).

  Your intuition is correct: Arrow's IIA is an **informational constraint on the aggregation rule across different preference profiles**, whereas your friend is describing a **coherence constraint on a single choice function across different menus**.

  Here is the precise breakdown of the difference, why your friend's interpretation is technically distinct, and why Arrow's version is strong enough to disqualify methods like Borda.

  ### 1. Individual Choice Consistency (Your Friend's View)
  In individual rational choice theory (and social *choice* functions), consistency conditions like the **Weak Axiom of Revealed Preference (WARP)** or **Sen's Property $\alpha$** (Chernoff condition) operate as follows:

  *   **Fixed:** The agent's underlying preferences (or the social rule's logic).
  *   **Variable:** The **menu** (the feasible set of alternatives).
  *   **The Condition:** If you choose $x$ from a large menu $\{x, y, z\}$, you must still choose $x$ from a smaller menu $\{x, y\}$ that contains it.
  *   **Intuition:** "Removing a losing option ($z$) shouldn't make the winner ($x$) lose to ($y$)."

  This is indeed a "truism" of rationality. If an agent violates this, we say they are unstable or irrational. Your friend is interpreting Arrow's IIA as this condition applied to society: *If society picks $x$ over $y$ when $z$ is available, it should still pick $x$ over $y$ if $z$ is removed.*

  ### 2. Arrow's IIA (Your View)
  Arrow's framework does not primarily deal with choosing from varying menus. It deals with constructing a **Social Welfare Ordering** over a **fixed set of alternatives** $X$ based on a **profile of individual preferences**.

  *   **Fixed:** The set of alternatives (the menu stays the same).
  *   **Variable:** The **individuals' preference profiles** (specifically, how they rank alternatives *other* than the pair in question).
  *   **The Condition:** The social ranking of a pair $\{x, y\}$ must depend **only** on the individual rankings of $\{x, y\}$. It cannot depend on how individuals rank a third alternative $z$.
  *   **Intuition:** "Whether society prefers $x$ over $y$ cannot change just because people changed their minds about $z$, even if everyone still ranks $x$ and $y$ exactly the same way."

  **The Crucial Distinction:**
  *   **Friend's Version (Menu Variation):** Holds preferences fixed, changes the *set of options*.
  *   **Arrow's Version (Profile Variation):** Holds the *set of options* fixed, changes the *preferences over irrelevant options*.

  Arrow's IIA is an **informational constraint**. It forbids the Social Welfare Function (SWF) from "looking at" or using any information regarding $z$ when determining the social relation between $x$ and $y$.

  ### 3. Why This Disqualifies the Borda Count
  The Borda count is often cited as a "reasonable" voting method that fails Arrow's IIA. This failure illustrates exactly why Arrow's condition is stronger than simple consistency.

  In Borda count, candidates receive points based on their rank position (e.g., 1st place = 3 points, 2nd = 2 points, 3rd = 1 point). The social ranking is determined by total points.

  **The Violation:**
  Imagine 3 voters and 3 candidates: $x, y, z$.

  **Profile 1:**
  *   Voter 1: $x \succ y \succ z$
  *   Voter 2: $x \succ y \succ z$
  *   Voter 3: $y \succ z \succ x$
  *   **Individual $x$ vs $y$ preferences:** Two voters prefer $x$, one prefers $y$.
  *   **Borda Scores:**
      *   $x$: $3 + 3 + 1 = 7$
      *   $y$: $2 + 2 + 3 = 7$
      *   **Social Result:** Indifference ($x \sim y$).

  **Profile 2:**
  *   Voter 1: $x \succ y \succ z$ (Unchanged)
  *   Voter 2: $x \succ y \succ z$ (Unchanged)
  *   Voter 3: $z \succ y \succ x$ (**Changed**)
  *   **Individual $x$ vs $y$ preferences:** **Unchanged.** Voter 3 still prefers $y$ over $x$. The pairwise input data for $\{x, y\}$ is identical to Profile 1.
  *   **Borda Scores:**
      *   $x$: $3 + 3 + 1 = 7$ (Voter 3 puts $x$ last)
      *   $y$: $2 + 2 + 2 = 6$ (Voter 3 puts $y$ middle)
      *   **Social Result:** $x$ wins ($x \succ y$).

  **The Problem:**
  The social ranking between $x$ and $y$ flipped (from Indifference to $x$ winning) even though **no voter changed their mind about $x$ versus $y$.** The change was entirely driven by Voter 3 moving $z$ from last place to first place.

  Under Arrow's IIA, this is forbidden. The SWF is supposed to be "blind" to $z$ when ranking $x$ and $y$. Borda count violates this because the *points* assigned to $x$ and $y$ depend on where $z$ is placed.

  ### 4. Why This Makes the Impossibility Result Substantive
  If your friend were right, and IIA were just standard consistency, we would expect many reasonable voting rules to satisfy it. But as shown above, Borda fails. In fact, **only** rules that are essentially dictatorial or imposed satisfy Arrow's IIA (given the other conditions).

  Here is why Arrow's IIA is so restrictive:

  1.  **It Bans Compromise based on Intensity:** In Profile 2 above, Voter 3 feels very strongly about $z$ (ranking it first). In a "reasonable" system, we might say, "Voter 3 cares a lot about $z$, so let's give them a win on $z$, but since they only mildly prefer $y$ over $x$, maybe $x$ should beat $y$." Arrow's IIA forbids this. It says, "You cannot use the intensity of feeling about $z$ to adjust the $x$-$y$ outcome."
  2.  **It Forces Pairwise Isolation:** It requires the SWF to decide $x$ vs $y$ in a vacuum, without context from the rest of the ordering. This prevents the system from checking for global coherence (transitivity) using the information in $z$.
  3.  **The Impossibility:** Because the SWF is forced to look at each pair $\{x, y\}$ in isolation (due to IIA), it loses the ability to "stitch" these pairwise decisions into a transitive order unless one individual dictates the outcome for every pair.

  ### Summary
  *   **Your Friend:** Describes **Contraction Consistency** (Sen's $\alpha$). This asks: "If we remove $z$, does the winner change?" This is about menu stability.
  *   **You:** Describe **Arrow's IIA**. This asks: "If people change their minds about $z$, does the $x$-$y$ ranking change?" This is about informational independence.

  Your position is the correct one. Arrow's IIA is not a truism of rationality; it is a severe restriction on the *type of information* a voting rule is allowed to process. It is precisely because it forbids rules like Borda (which use ranking positions as a proxy for intensity) that the Impossibility Theorem holds. If we relax IIA to allow rules like Borda, the impossibility disappears (though other problems, like manipulability, may arise).
