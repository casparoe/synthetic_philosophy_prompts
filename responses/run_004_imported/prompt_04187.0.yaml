          *   Conditionalization says: $P_{t+1}(A) = P_t(A | E)$, where $E$ is the total evidence learned.
          *   Reflection says: $P_t(A | P_{t+1}(A) = r) = r$.
          *   Does Conditionalization *entail* Reflection?
              *   If I know I will conditionalize on *some* partition of evidence, and I know what that partition is, then yes, Reflection holds.
              *   However, Reflection is often presented as a constraint on *rational planning* or *self-trust* that goes beyond the mathematical identity of LTP.
              *   Crucially, LTP gives $P_t(A) = \sum P_t(A | P_{t+1}(A)=r) \cdot P_t(P_{t+1}(A)=r)$. Reflection constrains the *conditional* term $P_t(A | P_{t+1}(A)=r)$ to be equal to $r$. LTP alone does *not* require this. LTP allows $P_t(A | P_{t+1}(A)=r)$ to be anything, as long as the weighted average works out.
