      *   *Refining the "Coins the terms" point:* While Aquinas makes the distinction in *De Regno* Book I, the specific Latin tags *tyrannus quoad titulum/exercitium* are widely recognized by scholars as later systematizations (often associated with Suárez or Vitoria summarizing the tradition). It's a common student simplification, but worth noting for precision.
