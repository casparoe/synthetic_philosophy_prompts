      *   *Claim 13: "...Mariana's book was ordered burned after being associated with the assassination of Henry IV of France."*
          *   **Fact Check:** Accurate historical context (Parlement of Paris burned the book after Ravaillac's assassination of Henry IV in 1610).

  4.  **Synthesize Grading:**

      *   **Types of Tyranny (5 pts):** The distinction is correct conceptually. The claim that Aquinas "coins the terms" is technically anachronistic (those specific Latin phrases are later scholastic shorthand), but the substance is right. I'll deduct slightly for the attribution error but keep it high because the concept is clear. (4.5/5)
