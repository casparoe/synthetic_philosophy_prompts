      *   *Claim 1: "Aquinas's most sustained treatment of tyranny is in De Regimine Principum..."*
          *   **Fact Check:** True. *De Regno* (On Kingship) is the primary source.
      *   *Claim 2: "...where he coins the terms tyrannus quoad titulum and tyrannus quoad exercitium..."*
          *   **Fact Check:** **Problematic.** Aquinas discusses the *concepts* (usurper vs. abusive ruler), but the specific Latin phrases *tyrannus quoad titulum* and *tyrannus quoad exercitium* are generally attributed to later scholastics (like Suárez or Vitoria) or medieval commentators summarizing him, not necessarily coined by Aquinas himself in that exact phrasing in *De Regno*. However, the *distinction* is accurate to his thought. I need to be careful here. Is it "flatly wrong" to say he coins the terms? Yes, technically. He describes the distinction (Book I, Chapter 3 & 6), but the specific terminology is often later scholastic shorthand. *Correction:* Aquinas distinguishes between those who usurp power and those who abuse it. The Latin tags are later scholastic standardizations. I should mark this as a minor inaccuracy/shaky attribution.
      *   *Claim 3: "...one who seizes power through violence or fraud... and one who came to power legitimately but governs only for his own advantage..."*
          *   **Fact Check:** Accurate representation of the concepts.
      *   *Claim 4: "Aquinas is remarkably cautious about letting private citizens take matters into their own hands..."*
          *   **Fact Check:** Accurate. *De Regno* I.6 and *ST* II-II, Q. 42.
      *   *Claim 5: "...people who assassinate a supposed tyrant are usually driven by ambition rather than genuine justice..."*
          *   **Fact Check:** Accurate. He worries about the assassin becoming a tyrant or causing greater turmoil.
      *   *Claim 6: "The proper remedy... has to come through whatever public authority originally had the power to install the ruler — the community itself, or some higher authority..."*
          *   **Fact Check:** Accurate. *De Regno* I.6. If the community has the right to elect, they can depose. If there is a superior (like the Emperor for a king), appeal to them.
      *   *Claim 7: "...if no such recourse exists, subjects should turn to prayer..."*
          *   **Fact Check:** Accurate. *De Regno* I.6.
      *   *Claim 8: "Aquinas repeats this same public/private logic in the Summa Theologiae's discussion of sedition..."*
          *   **Fact Check:** Accurate. *ST* II-II, Q. 42, Art. 2.
      *   *Claim 9: "...arguing that a tyrannical government is already a kind of disorder against the common good, so an uprising that restores the common good is not really sedition at all..."*
          *   **Fact Check:** Accurate. Sedition is against the unity/common good. Tyranny is already against the common good. Removing tyranny *can* be justified, but...
      *   *Claim 10: "...unless the revolt ends up causing more harm than the tyranny did."*
          *   **Fact Check:** Accurate. This is the proportionality condition in *ST* II-II, Q. 42.
