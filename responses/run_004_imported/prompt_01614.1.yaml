answer: |-
  This is a fantastic problem to be wrestling with. *The Querist* is notoriously cryptic precisely because Berkeley is experimenting with a form that refuses dogmatic assertion, which makes pinning down his "commitments" notoriously difficult. Your advisor's skepticism is standard fare in Berkeley scholarship (the "two Berkeleys" problem: the metaphysician vs. the practical reformer), but I think your intuition is onto something significant, provided you nuance the claim.

  Here is a breakdown of Query 36's function and a strategy for navigating the metaphysical reading without overplaying your hand.

  ### 1. Decoding Query 36: What is "the machine"?

  You are right that Q36 feels like an interruption, but it is the linchpin of the argument from 33 to 37.

  *   **The Machine:** The "machine" is the **economy of circulation** (specifically the Irish economy).
  *   **The Wheels Moving:** This represents **industry and trade** (the "effect" mentioned in the query). As long as labor is happening and goods are moving, the economy is functioning.
  *   **Wind, Water, Animals:** These represent the **medium of exchange**.
      *   In the 18th-century context, "wind" and "water" often imply impersonal, natural, or mechanical forces, while "animals" imply brute strength. But in this specific context, Berkeley is drawing an analogy to *sources of motive power*.
      *   More concretely, he is asking: Does it matter if the circulation is powered by **specie** (gold/silver), **paper credit** (bank notes), or **bills of exchange**?

  **The Function of Q36:**
  It is an argument for **functionalism**. Berkeley is isolating the *function* of money (moving the wheels of industry) from the *substance* of money (the metal).
  *   Q33 says wealth is industry.
  *   Q34 & 35 say we can use paper/bills instead of silver.
  *   **Q36 says:** Don't fetishize the source of the power. If the mill grinds the corn, does it matter if the wheel is turned by a horse or a river?
  *   Q37 concludes: Therefore, money is just a "ticket" recording that power, and the material is irrelevant.

  Without Q36, the jump from "bank notes exist" (Q35) to "material doesn't matter" (Q37) is a non-sequitur. Q36 provides the mechanical analogy that justifies the dematerialization of currency.

  ### 2. The Metaphysical Question: Immaterialism or Mercantilism?

  This is the crux of your paper. Your advisor is historically correct that Berkeley was not the *only* one arguing for paper credit. John Law (1705), William Petty, and later Hume all discussed money as a symbol of labor or a tool of circulation. If you argue "Berkeley invented paper money theory because he was an immaterialist," you will lose.

  However, you can make a stronger, more subtle claim: **Berkeley's immaterialism (and his philosophy of language) provides the *conceptual vocabulary* and *justificatory framework* for his economic theory in a way that distinguishes it from his contemporaries.**

  Here is how to thread the needle:

  #### A. Avoid "Deduction," Argue "Analogy" or "Habit of Mind"
  Do not argue that *The Querist* is a logical deduction from *A Treatise Concerning the Principles of Human Knowledge*. Instead, argue that Berkeley approaches economics with the same **ontological priorities** he applies to metaphysics.
  *   **In Metaphysics:** He attacks the notion of "material substratum" (invisible, inert stuff underlying qualities) and replaces it with active minds and perceptual relations.
  *   **In Economics:** He attacks the notion of "intrinsic value" in specie (invisible, inert metal underlying trade) and replaces it with active industry and social relations (credit/trust).

  #### B. The Key Text is Actually *Alciphron*, not *Principles*
  While *Principles* gets the fame, **Dialogue VII of *Alciphron* (1732)** is the smoking gun for your argument. *Alciphron* was published just before *The Querist*.
  *   In *Alciphron*, Berkeley argues that religious faith works like language: words do not need to stand for distinct "ideas" to be meaningful; they need to raise **dispositions, emotions, and actions**.
  *   **Connect this to Query 37:** Money as "tickets or tokens." For Berkeley, a word is a token that commands action without necessarily representing a material object. Money is the same. It is a **sign** that commands industry.
  *   **The Argument:** Berkeley isn't just saying "paper works as well as gold" (which Law argued). He is saying "Money is a linguistic/social sign system." The "tickets" in Q37 are semiotic tokens. This *is* metaphysical work, but it's work in the **philosophy of signs**, not just ontology.

  #### C. Where He Differs from Law and Petty
  *   **John Law** argued for paper money based on the *quantity* of money and velocity of circulation (a more mechanistic/quantitative view).
  *   **Berkeley** argues for paper money based on the *will to industry* (Q33: "opinion or will of the people... exciting them to industry").
  *   For Berkeley, the value isn't just in the circulation; it's in the **moral motivation** that the currency signals. This aligns with his view that reality is grounded in mind/spirit (will), not matter. The "wealth" is the *power to command industry* (a relational power), not the pile of gold (a material substance).

  ### 3. Strategy for the Paper

  To satisfy your advisor while keeping your insight, structure the argument like this:

  1.  **Concede the Context:** Acknowledge that credit theory was in the air (Law, Petty, Hutcheson). Berkeley is not inventing fiat currency single-handedly.
  2.  **Isolate the Language:** Focus on the specific phrasing in Q37 ("tickets or tokens," "recording such power"). Show that this is semiotic language.
  3.  **Deploy *Alciphron*:** Argue that Berkeley's theory of language (words as triggers for action rather than pictures of things) is deployed directly onto his theory of money. Money, like words, works by convention and trust ("opinion or will," Q33), not by material resemblance.
  4.  **Reinterpret Q36:** Use Q36 to show Berkeley's **functionalism**. Just as he dismissed the "material substratum" in metaphysics because it did no explanatory work, he dismisses the "metallic content" in money because it does no economic work. The *relation* (command of industry) is the reality, not the *substance* (gold/paper).
  5.  **Conclusion:** The "metaphysical work" isn't that immaterialism *causes* his economics. It's that his economics is an **application of his anti-materialist habit of thought**. He treats the economy as a system of signs and minds, not a system of things.

  ### Summary Advice
  Your advisor is worried you are going to write: *"Berkeley denied matter, therefore he liked paper money."*
  You should write: *"Berkeley's denial of matter reflects a broader philosophical commitment to prioritizing relations, signs, and mental activity over inert substance. We see this same commitment structuring his economic thought in The Querist, where money is treated as a semiotic token of industry rather than a material commodity."*

  That distinction allows you to keep the "strong reading" (it's genuinely Berkeleyan) without making the historically untenable claim (that only an immaterialist could support paper credit).

  **One final tip on Q36:** If you want to impress the seminar, mention that this mechanistic analogy (wheels/engine) is one of the few places Berkeley sounds almost like a proto-Physiocrat or even a classical liberal, yet he wraps it in a moral framework ("will," "industry"). It shows him bridging the gap between the moral philosophy of the *Principles* and the political economy of Hume/Smith.
