      *   *Requirement 2: Charity vs. Egocentrism.*
          *   *Draft:* Isn't Charity just projecting my beliefs?
          *   *Refinement:* If I maximize agreement, am I just making the speaker a clone of me? How do we account for genuine disagreement or cultural difference without abandoning Charity?
          *   *Comeback:* Charity is a methodological constraint, not psychological projection. It allows for local error.
          *   *Follow-up:* But if the *baseline* is my rationality, doesn't that make radical difference unintelligible rather than false?

      *   *Requirement 3: Nice Derangement (Prior/Passing Theory).*
          *   *Draft:* Why does communication work if we don't share a code?
          *   *Refinement:* If Passing Theory is ad hoc and idiosyncratic, the miracle isn't that we *can* communicate, but that we converge so *quickly*. Why do Prior Theories align so well if conventions aren't doing the heavy lifting?
          *   *Comeback:* Conventions are useful heuristics, but not constitutive. We are good at guessing.
          *   *Follow-up:* If conventions are just heuristics, what explains the *normativity* of meaning? Why am I *wrong* if I guess differently than you, if there's no shared rule?

      *   *Filling the remaining 5-7 questions:*
