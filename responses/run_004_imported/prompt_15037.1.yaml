prompt: |-
  hey, i'm a phil of language PhD student who co-runs a little grad podcast where we interview people about their research. next guest has built her whole project around defending a hardcore Davidsonian line on radical interpretation -- meaning and belief fixed together via charity, no antecedant shared code needed. can you draft me 8-10 questions that go beyond just having her restate charity and triangulation? i want at least one on the omniscient interpreter thought experiment (doesn't an interpreter who already has all the facts just bake in the "mostly true" conclusion charity was supposed to earn?), one on whether charity secretly collapses into "interpret them as believing whatever i'd believe in their shoes," and one on the prior-theory/passing-theory stuff from "A Nice Derangement of Epitaphs" -- if all communication needs is prior and passing theories converging on the fly, why does it usually work on the first try instead of that being a total mystery? for each of those three, throw in the comeback she'll probably reach for plus a follow-up that doesn't just let her repeat the party line.
