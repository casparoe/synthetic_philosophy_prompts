      *   The difference is that Kant appeals to an external framework (Space) to explain the difference. Black denies there *is* an external framework to appeal to (just the two spheres). This is a crucial disanalogy. Black's universe is closed; Kant's hand implies a surrounding space.

      *   *Wait, does Black's universe imply space?* Yes, they are "one mile apart." So there is space. But Black doesn't use space to individuate them; he uses the brute fact of twoness. Kant uses space to explain the handedness.
