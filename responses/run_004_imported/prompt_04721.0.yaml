      *   *Nuance:* Black's argument assumes we can *name* the spheres ("Sphere A", "Sphere B"). Critics say naming presupposes distinctness. I should mention this circularity objection.
      *   *Nuance:* Kant's argument is actually about the *possibility* of experience.
