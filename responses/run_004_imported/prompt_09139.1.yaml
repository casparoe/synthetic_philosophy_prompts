      *   **Bellarmine (1615):** A Jesuit theologian, highly educated, familiar with astronomy (taught at Louvain). He is not an obscurantist. He accepts the Augustinian principle. He is cautious about undermining scriptural authority without absolute certainty. He distinguishes between *mathematical hypotheses* and *physical reality*.
      *   **Setting:** Rome, likely Bellarmine's residence or a neutral garden. Let's choose a quiet room in the Jesuit College to emphasize the intellectual setting.
