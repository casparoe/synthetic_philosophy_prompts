answer: |-
  Good evening, everyone.

  For those who don't know me, I'm [Your Name]. I've been in the Mayor's office for exactly two months and three days. I am, by every metric in this room, the rookie. And Marion… well, Marion is the institution.

  When I was asked to speak tonight, I panicked. Mostly because I know who is sitting in this room. On my left, I see the press corps. People who have covered this city since before I was born. You know exactly what Marion's job title actually means. You know the 2:00 AM phone calls. You know the difference between "no comment" and "I can't confirm that."

  And on my right, I see Marion's family. Her husband, her children, her mother. You know Marion as the person who comes home tired, who misses dinners, who carries a weight she rarely puts down at the door. You see the sacrifice.

  My job tonight is to find the sentence that is true for *both* tables. And that is a very Marion thing to have to do.

  I've been reading a lot lately about the philosophy of politics. Specifically, about the relationship between truth and public life. There's a famous idea that in politics, facts are fragile. They are easily crowded out by opinions, by images, by the need to keep things moving forward. The danger, the philosophers say, is that eventually, everyone stops agreeing on what ground they are standing on.

  If you ask the cynics, a Press Secretary's job is to paint over that ground. To make the cracks disappear.

  But having worked under Marion for these last few months, and hearing the stories from all of you, I've realized that isn't what she did at all.

  Marion understood that while politics is the business of opinion, it cannot survive without the bedrock of fact. Her genius wasn't in spinning stories. It was in stewardship. She knew that trust is the only currency this office has that actually appreciates in value. You can spend it on a crisis, you can spend it on a campaign, but if you devalue the currency, the market crashes.

  To the reporters in the room: You fought her. Hard. There were days you hated her. But I suspect there was also a quiet comfort in picking up the phone to her. Because you knew that when Marion spoke, even if she couldn't give you everything you wanted, she was speaking from a shared reality. She never asked you to believe that black was white. She might have asked you to wait, or to look at the context, but she never asked you to deny your own eyes. In a town built on smoke, she was the one person who ensured the floor was solid.

  And to her family: You see the stress. You see the secrecy. But I hope you can see it differently now. The reason she comes home tired is not because she is hiding things from you. It's because she is holding things *for* you. She holds the complexity of this city so that the rest of us don't have to. She carries the burden of what is actually happening, so that public confidence doesn't shatter when things get difficult. That is a form of service that is hard to explain, but impossible to fake.

  Marion, you taught me that the job isn't about controlling the narrative. It's about protecting the integrity of the world we all share. You showed me that you can be a fierce defender of an administration without becoming a prisoner of its illusions.

  There is a line I love, which says that the opposite of political lying isn't just telling facts; it's the willingness to remain bound by reality, even when it's inconvenient.

  For thirty years, you remained bound to reality. You kept the ground stable for the Mayor, for the press, and for the public. And now, finally, you get to step off the stage.

  So, here is to you. May your retirement be free of talking points. May your days be filled with facts that are simple, and opinions that don't matter. And may you never, ever have to answer a question you don't want to answer.

  To Marion.
