answer: |-
  This is a fantastic question that cuts to the heart of some very niche decision theory and cosmology. It's no wonder your friend felt it was "off" but couldn't pinpoint why—it requires keeping track of cosmology, quantum mechanics, and decision theory simultaneously.

  The short answer is: **Your friend is right.** Evidential Cooperation in Large Worlds (ECL) does **not** stand or fall on the Many-Worlds Interpretation (MWI) being true.

  While MWI is one way to get a "large world," it is not the *only* way, and ECL is generally framed to work under standard cosmological inflation models regardless of quantum interpretation.

  Here is the breakdown of why your position is too narrow, and where the actual weight of the argument lies.

  ### 1. The "Large World" doesn't require Quantum Branching
  Your argument hinges on the idea that without MWI, there is only "one regular universe." This is a common misconception about modern cosmology.

  Even in a purely classical, single-world quantum interpretation (like Copenhagen or Objective Collapse), standard inflationary cosmology suggests the universe is spatially infinite (or vastly larger than the observable horizon).
  *   **The Level I Multiverse:** If space is infinite and matter is distributed roughly uniformly, there are infinitely many Hubble volumes. By the laws of probability, there must be regions of space identical to our observable universe, including exact physical duplicates of you.
  *   **The ECL Logic:** ECL relies on the existence of **relevantly similar agents** making decisions in similar epistemic situations. An exact duplicate of you in a distant Hubble volume (Level I) functions for ECL purposes almost identically to a branching version of you in MWI (Level III).

  So, even if MWI is false, as long as the universe is spatially infinite (which is the standard null hypothesis in cosmology), you still have the "large world" required for ECL.

  ### 2. ECL is about Logical Correlation, not Physical Mechanism
  The engine of ECL isn't quantum mechanics; it's **decision theory**. Specifically, it relies on Evidential Decision Theory (EDT) or Functional Decision Theory (FDT), rather than Causal Decision Theory (CDT).

  *   **CDT says:** "I cannot causally affect that agent 10^500 meters away (or in another branch). Therefore, my choice changes nothing for them. I should defect."
  *   **EDT/FDT says:** "My decision is output by a specific algorithm/logic. That distant agent is running a very similar algorithm. Therefore, my decision is *evidence* of what they decide. If I cooperate, it is more likely they cooperate."

  The physical mechanism that creates the correlation (quantum branching vs. spatial duplication vs. simulation instances) is secondary. What matters is the **statistical likelihood of correlation**.
  *   If MWI is true, the correlation is extremely high (branching happens constantly).
  *   If MWI is false but the universe is infinite, the correlation is still non-zero and potentially vast (due to spatial duplication).
  *   If MWI is false *and* the universe is finite/small, *then* ECL collapses.

  But since we already have strong evidence for a "large world" via inflation independent of MWI, ECL survives the death of MWI.

  ### 3. Where you have a point (The Nuance)
  You aren't entirely wrong to link the two; there is a degree of sensitivity here.
  *   **Density of Copies:** MWI might guarantee a higher *density* of correlated agents than a classical infinite universe. In MWI, branches diverge constantly. In a classical infinite universe, exact duplicates are incredibly far apart (Tegmark estimates $10^{10^{29}}$ meters away).
  *   **Strength of Correlation:** Some proponents argue that MWI copies are "more similar" in the immediate decision context than distant spatial duplicates, potentially making the evidential link stronger.

  So, while MWI isn't a *binary switch* for ECL (On/Off), it might be a **volume knob**. If MWI is true, the expected value of ECL cooperation might be higher. But if MWI is false, the expected value doesn't drop to zero; it just relies on the inflationary large world instead.

  ### 4. Why your friend felt it was "Off"
  Your friend likely intuited that ECL is usually discussed in the context of the **Global Priorities Institute (GPI)** work (e.g., by Caspar Oesterheld). In those papers, the "Large World" assumption is typically derived from **cosmological inflation**, not quantum mechanics.

  If you tell an EA who has read the Oesterheld papers that "ECL requires MWI," it sounds like confusing the *Level I Multiverse* (inflationary space) with the *Level III Multiverse* (quantum branching). They are distinct concepts in physics, though they produce similar philosophical results for decision theory.

  ### The Verdict
  **You lose this bet.**

  *   **ECL requires:** A universe large enough to contain many agents in epistemically similar situations to you.
  *   **ECL does not require:** Specifically quantum branching (MWI).
  *   **Standard Cosmology:** Already provides a large enough universe via inflation (Level I Multiverse) to satisfy ECL, even if quantum mechanics is single-world.

  **How to make peace with your friend:**
  Acknowledge that you were conflating "Large World" with "Many Worlds." You can concede that while MWI would *supercharge* ECL by adding more copies, the framework itself rests on the broader cosmological assumption that the universe is much bigger than what we can see, which is true regardless of whether wavefunctions collapse or branch.

  If you want to read the definitive take, look up **"Evidential Cooperation in Large Worlds" by Caspar Oesterheld (2017)**. He explicitly frames the argument around the size of the universe (inflation), not the interpretation of quantum mechanics.

  *(Note: This is high-level philosophical speculation. Neither side of your argument is empirically testable right now, so no actual friendship should be harmed over acausal trade!)*
