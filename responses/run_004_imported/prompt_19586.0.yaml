      *   **The Question:** Do I deserve credit? Did my decision matter? Is there a principled answer?

  2.  **Identify the Philosophical Core:**
      *   The core issue is **Moral Luck** and **Causal Overdetermination** in the context of **Moral Responsibility**.
      *   Specifically, this sounds like a variation of **Frankfurt Cases** (Harry Frankfurt).
      *   It also touches on **Kantian Deontology** (intentions/duty) vs. **Consequentialism** (outcomes).
