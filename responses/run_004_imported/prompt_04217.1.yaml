answer: |-
  This is a sophisticated and classic problem in Thomistic political philosophy. You have correctly identified one of the most debated tensions in Aquinas's corpus. Your instinct to harmonize the texts rather than dismiss one is the right scholarly impulse, but your proposed thesis—that the *Sentences* commentary represents the "real" moral view while *De Regimine* is merely prudential advice—faces significant hurdles that you will need to navigate carefully to make your paper defensible.

  Here is an assessment of your proposed frame and recommendations for handling the textual difficulties.

  ### 1. Is the "Moral vs. Prudential" Frame Defensible?

  It is defensible, but it is risky if presented as you currently have it. Here is why:

  *   **Chronology:** The *Commentary on the Sentences* is an early work (1250s), written when Aquinas was a *baccalaureus*. *De Regimine Principum* is later (1260s), written during his mature Italian period. In the history of philosophy, arguing that the early draft captures the "considered view" over the mature treatise is an uphill battle. You would need to explain *why* the later text retreats from the earlier moral clarity.
  *   **Normative Force:** In *De Regimine*, Aquinas does not merely say private tyrannicide is *dangerous*; he associates it with **sedition** and the disruption of the *ordo* (order). For Aquinas, order is a moral good, not just a tactical one. If private action disrupts the political order, it carries moral weight, not just prudential risk.
  *   **The Mariana Connection:** Be very careful claiming Aquinas "settled" the question in favor of Mariana. Most scholars argue Mariana radicalized Aquinas. Mariana removed many of Aquinas's safeguards (like the requirement for public authority). If you argue Aquinas supports Mariana, you must explain why the later Scholastics felt the need to expand upon him if his position was already clear.

  **Recommendation:** Instead of arguing that *Sentences* is the "real" view and *De Regimine* is "just advice," consider arguing that the two texts address **different categories of tyrants** or **different stages of political dissolution.** This allows you to keep your core insight (that Aquinas permits removal of tyranny) without ignoring the restrictions in *De Regimine*.

  ### 2. The Crucial Distinction: Usurper vs. Legitimate Tyrant

  To handle the emphatic language in *De Regimine*, you must engage with the distinction standard in Scholastic thought: the difference between a **tyrant by exercise** (a legitimate ruler who rules badly) and a **tyrant by defect/usurpation** (someone who has no title to rule).

  *   **In the *Sentences*:** Aquinas is often interpreted as speaking of the **usurper**. A usurper has no legitimate authority; they are effectively a private criminal wielding public force. Therefore, killing them is akin to killing a bandit or a public enemy (*hostis publicus*).
  *   **In *De Regimine*:** Aquinas is often speaking of the **legitimate king who becomes tyrannical**. This ruler still holds the *office*, even if he abuses it. To kill him privately is to undermine the office itself and invite anarchy.

  **How to use this:** You can argue that the *Sentences* establishes the moral principle (tyranny is an evil that may be removed), while *De Regimine* clarifies the **juridical conditions** under which that removal is licit. This strengthens your paper: it shows Aquinas isn't contradicting himself, but refining the *authority* required to act on the moral permission.

  ### 3. Handling the Emphatic Language in *De Regimine*

  You asked specifically how to handle the passages where Aquinas warns against "private presumption." Do not gloss over them; interpret them through the lens of **public authority.**

  *   **The "Public Authority" Clause:** In *De Regimine*, Aquinas insists that proceeding against a tyrant is a matter for public authority. You can argue that this is not a prohibition on tyrannicide *per se*, but a prohibition on **unauthorized** tyrannicide.
  *   **Reframing "Prudence":** Don't frame *De Regimine* as merely tactical advice (i.e., "you might get caught"). Frame it as **teleological prudence**. For Aquinas, the goal of politics is the Common Good. If a private killing leads to greater turmoil (as he argues it usually does), it fails the test of the Common Good. Thus, the restriction is moral, but it is contingent on consequences, not an absolute deontological ban.
  *   **The Recourse to God:** Aquinas says if no human authority can check the tyrant, one must have recourse to God. You can argue this is not a command to passivity, but a recognition of the limits of human politics. It leaves the door open for extraordinary circumstances (which Mariana later walks through), but closes it for routine private vigilance.

  ### 4. Strategic Advice for the Paper

  If you want to maintain your thesis that Aquinas permits private action under certain conditions, structure your argument like this:

  1.  **Acknowledge the Tension:** Start by admitting the texts look contradictory. This shows you aren't ignoring the difficulty.
  2.  **Contextualize the *Sentences*:** Argue that here Aquinas establishes the **ontological status** of the tyrant as a public enemy. This is the metaphysical grounding: tyranny is a distortion of order that forfeits protection.
  3.  **Contextualize *De Regimine*:** Argue that here Aquinas addresses the **juridical execution** of justice. He restricts private action not because the tyrant deserves protection, but because the *community* requires protection from the chaos of private violence.
  4.  **Synthesize:** Conclude that Aquinas's "considered view" is a synthesis: Tyrannicide is morally permissible (per *Sentences*) but juridically restricted to public authority (per *De Regimine*), *unless* the public authority has totally collapsed (the loophole Mariana exploits).
  5.  **Caution on Mariana:** In your conclusion, note that while Mariana claimed to follow Aquinas, he likely expanded the "private citizen" clause beyond what Aquinas intended. This shows nuance and protects you from the critique that you are conflating the two thinkers.

  ### 5. A Note on the *Summa Theologiae*

  If your syllabus allows, you should briefly check *Summa Theologiae* II-II, q. 42, on Sedition. Aquinas there argues that sedition is a mortal sin, *unless* it is against a tyrannical regime. However, he emphasizes that the disturbance of the tyrant's rule is not sedition if it serves the common good. This text bridges the gap between your two primary sources and could bolster your argument that Aquinas is consistent on the *end* (common good) even if the *means* (private vs. public) require careful calibration.

  ### Summary

  Your thesis is defensible **if** you refine it.
  *   **Avoid:** "Aquinas definitely supports private tyrannicide and *De Regimine* is just safety tips."
  *   **Try:** "Aquinas maintains a consistent moral opposition to tyranny (*Sentences*), but develops a sophisticated jurisprudence of authority (*De Regimine*) that restricts the *means* of removal to protect the Common Good."

  This approach respects the emphatic language in *De Regimine* (by acknowledging the moral weight of order and authority) while preserving your insight that Aquinas does not grant tyrants absolute immunity. Good luck with the paper.
