  4.  **Refining the Technical Details (Self-Correction during drafting):**
      *   *Correction on Arrow:* Make sure to note Arrow applies to *ranked* systems producing a full ordering, but the spirit applies to single-winner too. Don't get too bogged down in the "social welfare function" vs "social choice function" distinction unless it clarifies things. Better to keep it simple: Arrow says no ranked system meets all fairness criteria.
      *   *Correction on IIA:* RCV fails IIA. Plurality *also* fails IIA (that's the spoiler effect). Liz's claim that Plurality is "what you see is what you get" is misleading because the *presence* of a loser changes the winner in Plurality too. I need to make sure this distinction is clear.
      *   *Correction on Gibbard-Satterthwaite:* Ensure I mention that while strategy exists, RCV makes it *harder* to pull off successfully than Plurality.
      *   *Monotonicity:* Liz mentions IIA in point 4, but RCV also fails Monotonicity (ranking a candidate higher can hurt them). I should mention this as a "missing point" because it's a famous RCV critique.

  5.  **Final Review against User Prompt:**
      *   Did I go move by move? Yes.
      *   Did I say who has the better of it? Yes.
      *   Did I flag if both are wrong/missing something? Yes.
