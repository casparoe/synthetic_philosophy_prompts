  *Refining the Gödel point:* Gödel initially rejected Church's thesis. After Turing's 1936 paper, Gödel accepted it. Why? Because Turing analyzed the *process* of computation, not just the *function*. This is crucial for the journalist to understand: CTT is about *how* we compute, not just *what* we compute.

  *Refining the MH point:* The critics say MH devices aren't "computers" in the Turing sense. They are physical systems. So if CTT is about "effective procedures," MH doesn't violate it. If CTT is "what is physically possible," it does. This distinction is the story.

