answer: |-
  "It's not a tu quoque, David. It's a forfeiture of normative authority."

  "Authority? Morality isn't a chain of command. If I steal, I steal. Whether you stole yesterday doesn't change the geometry of my wrong."

  "Blame isn't geometry. It's a communicative act. It demands accountability. You can't demand what you refuse to acknowledge yourself. When you blame hypocritically, you treat the norm as a weapon, not a commitment."

  "So the truth of the accusation vanishes because the accuser is flawed?"

  "The truth remains. The *standing* evaporates. They're separate categories."

  "Semantics. If the accusation holds, I have a duty to respond. Your 'standing' is just a social get-out-of-jail-free card. It lets me ignore the truth because you're messy."

  "Try this. Recovering addict. Tells their kid: 'Don't touch heroin.' The parent used to use. Are they a hypocrite?"

  "Past tense. They aren't using now."

  "Doesn't matter. They violated the norm deeply. Yet we say they have standing. Maybe more than the straight-laced uncle who's never struggled."

  "Because the uncle hasn't earned the risk. The addict is speaking from shared vulnerability, not moral superiority. They aren't saying 'I am better.' They're saying 'I know the cost.' That's not blame, Elena. That's warning."

  "It feels like blame if the kid slips. The parent says, 'You broke the rule.'"

  "Then the addict loses standing *if* they judge the kid while secretly using again. It's the current commitment that matters. The hypocrite rejects the norm they enforce. The addict reaffirms it. The hypocrite says, 'This rule is for you, not me.' The addict says, 'This rule is for us, and I failed.'"

  "So standing isn't about purity. It's about sincerity."

  "It's about participation in the normative community. If you opt out, you can't police the borders."

  "But if I opt out privately, and you violate the norm publicly... does my opt-out protect you?"

  "No. But it stops me from being the one to call you out. Someone else can. That's the point. The norm survives the hypocrite. The hypocrite just loses the microphone."

  "So you admit it. The accusation is still true. The norm is still valid. 'Losing standing' is just about who gets to speak, not what's spoken."

  "It's about the relationship, David. Blame is relational. If I undermine the relationship through hypocrisy, the blame becomes aggression, not correction."

  "Aggression dressed up as ethics. You're saying the hypocrite's blame is morally worse than the truth-teller's."

  "I'm saying it's functionally null. Like a judge recusing themselves. The law still stands. The judge just can't rule."

  "But judges are appointed. Morality isn't."

  "We appoint each other. Every time we engage. If I lie to you, I revoke my appointment."

  "Convenient. So I can ignore your criticism because you parked in a tow zone once?"

  "If I criticize you for parking in a tow zone? Yes. If I criticize you for murder? Maybe not. Proportionality matters."

  "See? You're wobbling. Now it's not about standing. It's about weight."

  "It's about the cost of the conversation. Hypocrisy raises the cost until the message is lost."

  "Or until the listener uses it to dodge. Which is what you're doing."

  "I'm not dodging. I'm clarifying. You want to separate the act from the agent. I'm saying in morality, they're woven together."

  "Then truth becomes secondary to reputation."

  "Then truth becomes secondary to trust. And without trust, blame is just noise."
