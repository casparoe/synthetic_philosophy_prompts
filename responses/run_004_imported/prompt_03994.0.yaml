answer: |-
  This is a sharp read. You are not strawmanning; you have put your finger on the exact pressure point where most modern critiques of Rawls converge. The "Maximin is just smuggled risk aversion" objection is the standard move in the literature, but your specific framing—that conditions (2) and (3) do the heavy lifting and effectively presuppose the lexical priority they are meant to derive—is the more sophisticated version of that critique.

  Here is the breakdown on the philosophy, the literature, and the blog post viability.

  ### 1. The Philosophical Critique: Are you missing a Rawlsian move?

  You ask if there is a bridge between "high stakes" and "lexical unacceptability" that isn't just disguised risk aversion. There are two specific Rawlsian mechanisms intended to build that bridge, though whether they succeed is debatable.

  **A. The Strains of Commitment**
  This is the big one you might be underweighting. In *A Theory of Justice* (§29), Rawls argues that the parties aren't just choosing principles for a gamble; they are choosing a constitution for a society they must *live in* and *uphold*.
  *   **The Argument:** If the parties choose Average Utilitarianism, they must be willing to accept a outcome where they are enslaved or destitute *if* that maximizes the average. Rawls argues that no one can genuinely commit to a principle that might require their own destruction or marginalization. It creates "strains of commitment" that make the agreement unstable.
  *   **Why it matters for your critique:** This attempts to move the argument from *decision theory* (how to gamble) to *contract theory* (what agreements are feasible). Condition (3) ("outcomes are unacceptable") isn't about utility curves; it's about the psychological and sociological limits of maintaining a social contract. If you can't abide by the principle when you lose, the principle fails.
  *   **The Counter:** Critics (like Gauthier) say this is still just risk aversion dressed up in sociological language. If I'm willing to take the risk, why can't I commit? Rawls's reply is that "commitment" implies stability over a lifetime, not just a one-off bet.

  **B. Primary Goods and the Moral Powers**
  You asked about Primary Goods. This is Rawls's answer to Condition (2) ("you can live with the floor").
  *   **The Argument:** Primary goods aren't just "stuff I want." They are the all-purpose means necessary to exercise the **two moral powers** (a sense of justice and a conception of the good). If you fall below a certain threshold of primary goods, you literally cannot function as a free and equal citizen.
  *   **Why it matters:** This makes the "floor" objective rather than subjective. It's not that I'm *scared* of being poor; it's that below a certain point, I cease to be a participant in the system of cooperation. Therefore, maximizing the floor isn't risk aversion; it's securing the conditions of agency.
  *   **The Counter:** This relies on a specific, controversial metaphysical claim about personhood. If you reject the "two moral powers" framework, the "objective floor" dissolves back into subjective utility.

  **Verdict:** Your reading is fair. Rawls *needs* (2) and (3) to be true for Maximin to work, and his justification for them relies on substantive claims about moral psychology and stability that are not derived purely from the "thin theory of the good" or the epistemic constraints of the Veil. He is, in a sense, building the conclusion into the premises of the choice situation, though he would call this "reflective equilibrium" rather than circularity.

  ### 2. The Literature: Who to cite?

  You are correct that this is a cottage industry. If you post this, you should signal familiarity with these nodes:

  *   **John Harsanyi:** The obvious starting point. *Can the Maximin Principle Serve as a Basis for Morality?* (1975). He argues Rawls violates the axioms of rational choice.
  *   **David Gauthier:** *Morals by Agreement*. He attacks Rawls from the Hobbesian side, arguing that if you treat the OP as a rational bargain, Maximin is irrational. Mutual advantage requires something closer to concession, not maximin.
  *   **Samuel Freeman:** *Rawls* (2007) or his SEP entry. He is the leading defender of the "Strains of Commitment" argument, emphasizing that Rawls is doing *political* philosophy, not decision theory.
  *   **Paul Weithman:** *Why Political Liberalism?* (2010). He digs into the stability argument, suggesting Rawls realized the *ToJ* decision-theoretic argument was weak and pivoted to stability in his later work.
  *   **Amartya Sen:** *The Idea of Justice*. He critiques the "transcendental" nature of the OP and the reliance on Primary Goods, offering the Capabilities Approach as an alternative that handles the "floor" differently.

  **Key Distinction:** Make sure you note that Rawls later distances himself from the idea that Maximin is a *general* rule of rational choice. In *Justice as Fairness: A Restatement*, he emphasizes that Maximin is only rational *given the specific design of the Original Position*, which is designed to model fairness, not just uncertainty.

  ### 3. The Blog Post: Is it worth writing?

  **The Brutal Truth:**
  For a general audience? **No.** It is too inside-baseball. Most people glaze over at "Knightian uncertainty," let alone the specific conditions for Maximin in the Original Position.

  For the *LessWrong / Overcoming Bias / Rationalist* crowd? **Yes, but with a pivot.**
  This audience loves decision theory, but they often treat Rawls as a caricature ("Rawls = egalitarian utilitarian"). A post that clarifies *why* Rawls thinks EU maximization fails in the OP, and then critiques the decision-theoretic coherence of that failure, is valuable *to them*.

  **How to make it work:**
  1.  **Frame it as Decision Theory, not Political Philosophy.** Don't title it "Rawls's Maximin Argument." Title it "When Does Maximin Beat Expected Utility? A Case Study in the Original Position." Use Rawls as the concrete example to explore the broader question of when lexical priorities are rational.
  2.  **Acknowledge the Shift.** Note that Rawls himself moved away from the "rational choice under uncertainty" framing in his later work toward a "reasonable agreement" framing. Your critique holds water against *A Theory of Justice* Rawls, but less so against *Political Liberalism* Rawls (who admits the OP is a device of representation, not a literal choice scenario).
  3.  **The "Smuggling" Charge is the Hook.** Your insight that conditions (2) and (3) presuppose the conclusion is the strongest part. Lean into that. It's a critique of *foundationalism* in moral theory.

  **Potential Pitfall:**
  Be careful not to imply Rawls thinks the parties are *psychologically* risk-averse. He is explicit that they are not. Your post already notes this, but ensure you don't slip into saying "Rawls assumes risk aversion." Instead: "Rawls constructs a scenario where rational agents *act as if* they are infinitely risk-averse due to the structural constraints of the agreement."

  ### Summary
  *   **Philosophy:** You're right. The argument relies on the "Strains of Commitment" and the nature of "Primary Goods" to justify (2) and (3), which many critics argue begs the question.
  *   **Literature:** Cite Harsanyi (critic), Gauthier (critic), and Freeman/Weithman (defenders).
  *   **Post Viability:** Good for a rationalist/philosophy niche, bad for general readers. Frame it as a decision-theory puzzle to maximize engagement.

  If you write it, I'd read it. Just keep the jargon density in check and focus on the structural circularity you identified—that's the gold.
