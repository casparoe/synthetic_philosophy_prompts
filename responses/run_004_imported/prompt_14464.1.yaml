      *   He's left with Egoism (rational self-interest) and Utilitarianism (rational universal good).
      *   Both seem rationally self-evident *prima facie*.
      *   **The Conflict:** Sometimes, what is best for me (Egoism) conflicts with what is best for the whole (Utilitarianism).
      *   **The Dualism of Practical Reason:** If reason dictates both X (maximize self) and Y (maximize all), and X $\neq$ Y, then Reason is contradictory. This is a philosophical crisis for Sidgwick. He wants ethics to be a rational science. A science can't have a fundamental contradiction.
      *   **The Solution:** To harmonize them, there must be a "Moral Order" where duty and self-interest ultimately coincide. Usually, this implies divine reward/punishment (immortality, God).
      *   **The Problem:** Sidgwick is an empiricist/agnostic. He can't just *assume* God exists (that would be dogmatic). He needs *evidence*.

  3.  **Connect Ethics to Psychical Research (The SPR):**
      *   If the "Moral Order" requires an afterlife (where the virtuous are rewarded and the wicked punished, balancing the scales), then the existence of an afterlife is an *empirical* question, not just a theological one.
      *   Traditional religion is out (dogma). Science is in.
      *   Psychical Research (telepathy, mediums, survival of death) was seen by Sidgwick not as "magic" but as *borderland science*. It was the application of scientific rigor to anomalous data.
      *   **Goal:** Find empirical proof of survival of death. If consciousness survives, divine justice is possible. If divine justice is possible, Egoism and Utilitarianism can be harmonized.
      *   **Why not stay agnostic?** Because for Sidgwick, the contradiction in Reason is intolerable. It undermines the rationality of morality itself. If morality isn't rational, why be moral? He *needed* a solution to save the project of ethics.
      *   **Why not pick one axiom?** He found both self-evident. Denying Egoism seems irrational (why sacrifice self for no reason?). Denying Utilitarianism seems immoral.

  4.  **Address the Specific Questions:**
      *   *What would evidence have needed to establish?* Proof of personal survival of death + evidence of a moral governance (though the latter is harder). Primarily, survival opens the door for the "Moral Order."
      *   *Did he think it was a long shot?* He was cautious but hopeful. He treated it with the same rigor as ethics. He didn't "believe" in ghosts blindly; he wanted data. By the end, he was likely disappointed but still felt the *need* for the inquiry remained.

  5.  **Drafting the Response (Iterative Process):**

      *   *Opening:* Validate the user's confusion. It *is* a weird jump from a modern perspective. Acknowledge Priya is right about the connection, even if the conclusion feels odd.
      *   *Section 1: The Dualism of Practical Reason (The "Why").* Explain the Egoism vs. Utilitarianism clash clearly. Use the "Rational Contradiction" angle. This is the engine.
      *   *Section 2: The Theological Gap (The "What").* Explain why God/Immortality is the necessary bridge. It's not about "faith"; it's about logical consistency.
      *   *Section 3: Why Psychical Research? (The "How").* This is the crucial link. Sidgwick wasn't a Victorian spooky guy; he was a scientific naturalist. He couldn't accept Revelation. He needed *empirical* proof of the supernatural. SPR was the "science of the anomalous."
      *   *Section 4: Agnosticism vs. Desperation.* Why not just live with the tension? Because for Sidgwick, ethics *is* reason. If reason fails, ethics fails. It's a foundational crisis, not just a mood.
      *   *Section 5: Did he think it would work?* Nuance this. He was rigorous. He exposed frauds. He wanted *proof*, not comfort.
      *   *Conclusion:* Summarize. Priya's point stands: It's not a hobby; it's a philosophical rescue mission.

  6.  **Refining the Tone:**
