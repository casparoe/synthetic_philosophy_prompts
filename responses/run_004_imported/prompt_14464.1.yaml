answer: |-
  Priya is right to call you out, though your reaction is the standard one. From a modern vantage point, Sidgwick chasing mediums looks like a Victorian eccentricity, a bit like Newton writing more about alchemy than gravity. But if you look at the internal architecture of *The Methods of Ethics*, the Society for Psychical Research (SPR) isn't a hobby; it's a desperate rescue mission for the coherence of rational morality.

  Here is the actual structural argument connecting the "Dualism of Practical Reason" to the seance table, breaking down why agnosticism wasn't an option for him and what kind of evidence he thought he needed.

  ### 1. The Engine: The Dualism of Practical Reason
  You have the vague shape of this, but the specific tension is sharper than just "morality might not pay off."

  Sidgwick concludes *The Methods of Ethics* by arguing that there are two supreme, self-evident axioms of practical reason:
  1.  **Rational Egoism:** It is rational to aim at one's own greatest happiness (Prudence).
  2.  **Rational Utilitarianism:** It is rational to aim at the universal greatest happiness (Benevolence).

  In a perfect world, these coincide. But in *this* world, they often conflict. Sometimes, being moral (Utilitarianism) requires a massive sacrifice of your own well-being (Egoism) with no return.

  For Sidgwick, this isn't just a bummer; it's a **logical crisis**. He views ethics as a rational science. If Reason dictates $X$ (maximize self) and Reason also dictates $Y$ (maximize all), and $X$ conflicts with $Y$, then **Reason is contradictory.** If Practical Reason is contradictory, it is not rational. If ethics is not rational, it has no binding force.

  So, he is left with a "Dualism." Unless there is a way to harmonize these two dictates, the rationality of morality collapses.

  ### 2. The Necessary Condition: The Moral Order
  To resolve the contradiction, Sidgwick needs a **harmonization**. He needs a guarantee that, in the long run, doing the right thing (Utilitarianism) will not result in a net loss for the agent (Egoism).

  Since this clearly doesn't happen in the observable natural world (good people suffer, wicked people prosper), the harmonization requires two metaphysical conditions:
  1.  **A God:** A powerful moral governor who can enforce justice.
  2.  **Immortality:** A future life where the deficits of this life are balanced out (rewards/punishments).

  Sidgwick calls this the "Moral Order of the Universe." Without it, he admits in the final chapter of *Methods*, he cannot see how to avoid "a fundamental contradiction in our conception of the ultimate end of rational action."

  ### 3. Why Psychical Research? (The Empirical Gap)
  Here is where your "religious upbringing" point gets tricky. Sidgwick had actually *lost* his Christian faith early in his career. He couldn't just assume God and Immortality existed based on revelation or tradition. He was a rigorous empiricist. He couldn't posit a metaphysical solution without **empirical warrant**.

  He needed evidence for survival of death that met scientific standards.
  *   **Theology** was out (dogmatic).
  *   **Materialist Science** was out (it denied the soul).
  *   **Psychical Research** was the "borderland."

  Sidgwick didn't view the SPR as "ghost hunting" in the spooky sense. He viewed it as **data collection on anomalous phenomena.** Specifically, he was interested in:
  *   **Telepathy:** If mind can communicate with mind without physical sensory organs, it suggests mind is not entirely dependent on the brain.
  *   **Mediumship/ apparitions:** If verified, these suggest consciousness survives bodily death.

  If you can prove scientifically that consciousness survives death, you open the logical possibility of the "Moral Order." You don't prove God exists directly, but you remove the materialist barrier that says "death is the end, so sacrifice is final."

  ### 4. Why Not Just Stay Agnostic?
  This is your strongest objection: *Why not just live with the tension?*

  For Sidgwick, agnosticism was philosophically catastrophic.
  *   **The "Secret Utilitarian" Problem:** If Egoism and Utilitarianism are irreconcilable, Sidgwick worries that the only way to maintain social order is for the elite to *pretend* they are reconcilable (i.e., keep the masses believing in God/reward while knowing better themselves). He found this "esoteric morality" deeply disturbing but logically possible if the Dualism couldn't be solved.
  *   **The Integrity of Reason:** Sidgwick's entire project was to show that morality is rational. If he accepts the Dualism as unsolvable, he has to admit that morality is ultimately irrational (or at least, that self-sacrifice is irrational). He literally could not sleep (there are letters about his "fundamental anxiety") because the coherence of his life's work depended on Reason being unitary, not dualistic.

  He didn't *want* to believe in ghosts. He *needed* there to be a possibility of empirical evidence for immortality to save the rationality of ethics.

  ### 5. Did He Think It Would Work?
  This is the tragic part. Sidgwick was the SPR's most rigorous skeptic. He spent years exposing fraudulent mediums. He wasn't a true believer looking for comfort; he was a judge looking for admissible evidence.

  *   **Early Hope:** In the 1880s, he genuinely thought telepathy might be the "Newton's Law" of the mental world—a natural law that implied spiritual survival.
  *   **Later Years:** By the end of his life, he was likely disappointed. He never claimed to have found definitive proof. However, he maintained that the *inquiry* was necessary. As long as materialism couldn't fully explain consciousness, the door remained ajar.

  In a famous letter to his disciple E.E. Constance Jones, he wrote that if he became convinced that death ended everything, he would have to question whether it was rational to continue living (or at least, rational to continue prioritizing morality over self-interest). That's how high the stakes were.

  ### Summary for Your Debate with Priya
  You can concede the point without agreeing that Sidgwick was *right*, only that he was *consistent*.

  1.  **It's not a footnote:** The SPR is the empirical wing of his ethical theory. *Methods* sets the problem (Dualism); SPR seeks the data to solve it (Immortality).
  2.  **It's not religious nostalgia:** It's empiricist desperation. He couldn't assume God; he needed data.
  3.  **Agnosticism wasn't neutral:** For Sidgwick, accepting the Dualism meant admitting morality is irrational. He couldn't accept that conclusion, so he had to exhaust every empirical avenue to avoid it.

  Priya's point is that you can't separate "Philosopher Sidgwick" from "Psychical Researcher Sidgwick." The latter was trying to fix a hole in the former that threatened to sink the whole ship. You might think the ship was already sunk, or that lifeboats made of seances are useless, but you have to admit he wasn't just playing around. He was trying to save Reason itself.
