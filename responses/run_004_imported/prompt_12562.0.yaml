answer: |-
  Here is a draft for the eulogy. It is written to be spoken at a moderate, conversational pace, which should come in right around five minutes.

  I have tried to keep the Wittgensteinian concepts accurate—focusing on the idea that pain is not a "private object" but part of a shared "form of life"—without using the jargon that would alienate the non-philosophers.

  ***

  **Eulogy for [Aunt's Name]**

  Good morning. Thank you all for being here. For those who don't know me, I'm [Your Name], [Aunt's Name]'s nephew/niece.

  If you knew my aunt, you probably knew her in one of two ways. Maybe you knew her as the counselor who sat with you during the worst week of your life, the one who made you tea and didn't flinch when you cried. Or, maybe you knew her as the woman in the armchair with a glass of red wine, holding a copy of Wittgenstein, waiting for someone to argue with her about the nature of language.

  For thirty years, she worked in grief counseling. But before that, she was a philosopher. She never finished the PhD, but she never really left the department, either. For twenty years, she ran a reading group out of her living room. I spent a lot of Thanksgivings there, listening to her explain why the words we use matter more than we think.

  She had a favorite idea, one she'd bring out when the wine was poured and the conversation got loud. It was about pain.

  We tend to think of pain—or grief—as something locked inside us. Like a beetle in a box that only we can open. We assume that because you can't feel my hurt, and I can't feel yours, we are ultimately alone in it. You hear it all the time: "No one can truly know what I'm going through."

  My aunt hated that sentence. In fact, she made me promise that if anyone said it at her funeral, she would find a way to come back and argue about it. So, in the interest of keeping the supernatural peace, I'm going to ask we avoid it.

  She didn't hate that sentence because she was cold. She hated it because she thought it was false. And more importantly, she thought it was dangerous.

  She believed that if grief were truly a private object, locked away where no one else could reach it, then her job would be impossible. If "grief" just named a secret thing inside me that you could never inspect, then I couldn't teach you what I'm feeling. You couldn't comfort me. We would just be making noises at each other.

  But she knew that wasn't true. She knew it was true because she did it for a living. She saw that grief isn't a beetle in a box. It's something we build together. It's in the way we go quiet at the dinner table. It's in the way we say her name. It's in the tears, and the silence, and the stories we tell about her.

  Because we share a language, and because we share a life, we *can* know what each other is going through. Not perfectly, and not completely—but really. Truly.

  That was the secret to her work. She didn't help people by trying to peek into their boxes. She helped them by showing them that the box wasn't locked. She taught people that their pain was not a solitary confinement. She showed them that when they spoke their grief, and someone else listened, the grief became something shared. And when it is shared, it becomes bearable.

  She taught me that the opposite of pain isn't happiness. The opposite of pain is isolation. And the cure for isolation is the messy, imperfect, beautiful act of using words to bridge the gap between us.

  So, I am not going to stand here and say that no one knows what she went through. We do. We are here, aren't we? We are here because we know what her absence feels like. We know it in the empty chair, and in the silence where her laugh used to be. We know it because we are feeling it together, right now, in this room.

  She spent her life proving that we don't have to be alone in our heads. She proved that we can reach each other.

  So, if you want to honor her, don't lock your grief away. Don't treat it like a secret. Bring it out. Talk about her. Argue about her. Tell the stories, even the ones that make you cry. Use the words. That's how we keep her here. That's how we prove her right.

  Thank you, Aunt [Name], for teaching us how to speak. We'll take it from here.

  ***

  ### A Few Notes for Delivery

  *   **The "Beetle" Reference:** I kept the "beetle in a box" image because it is the specific image she loved (PI 293), but I framed it immediately in plain English ("locked inside us"). The philosophers in the room will nod at the reference; the others will understand the metaphor of the locked box.
  *   **The "Haunting" Joke:** Deliver the line about her coming back to argue with a slight smile. It acknowledges her humor and intellectual stubbornness without making the room feel scolded.
  *   **The Pivot:** The crucial moment is the paragraph beginning "She didn't hate that sentence because she was cold." Slow down here. This is where you move from the philosophy back to the emotion.
  *   **The Ending:** The line "Thank you, Aunt [Name], for teaching us how to speak" is the thematic closer. It ties the philosopher (language) to the counselor (communication) to the mourner (eulogy).

  I am very sorry for your loss. It sounds like she was a remarkable woman. Good luck this weekend.
