      *   **The Aunt's Insight:** She believed the PLA validated her work as a counselor. If pain/grief were purely private objects (beetle in a box), communication about them would be impossible/nonsense. Therefore, shared language and shared understanding *are* possible, which makes counseling and community support meaningful.
      *   **Specific Constraint:** Avoid the cliché "No one will ever truly know what she went through" because she found it philosophically confused (and threatened to haunt anyone who said it).
      *   **Audience:** 20% philosophy friends (will spot errors), 80% general mourners (need accessibility/emotion).
      *   **Tone:** Eulogy (respectful, grieving, celebratory), not a lecture. About 5 minutes spoken (approx. 700-800 words).
