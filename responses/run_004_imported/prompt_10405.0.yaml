      *   *The Pamphlet:* "Mr. Truman's Degree" (1956). She argued that Truman was a mass murderer for authorizing atomic bombs on civilians. She believed Oxford was complicit by honoring him.
      *   *Her Pacifism:* It wasn't sentimental. It was deontological (rule-based/duty-based) and rooted in Catholic natural law (intention matters, killing innocents is intrinsically evil). She wasn't necessarily a absolute pacifist in the "never fight back" sense (she supported the idea of a "just war" under strict conditions), but she was fiercely opposed to the targeting of civilians and the total war strategy of WWII.
      *   *Nuance:* Anscombe actually *wasn't* a strict conscientious objector in the sense of refusing all service. She was more concerned with *what* was being fought and *how*. However, for the user's novel, they want to lean into the "lifelong pacifist/conscientious objector" angle. I need to respect the user's creative direction while keeping the *spirit* of Anscombe's intellectual rigour.
      *   *Key Trait:* She doesn't shout slogans; she makes arguments. She is uncomfortable with mob mentality. She cares about *truth* and *moral consistency*.

  3.  **Brainstorming Scenes:**
      *   *Constraint:* Needs to be pre-1956 (Truman protest). Needs to show consistency.
      *   *Idea 1: Conscription/National Service (Late 30s/Early 40s).*
