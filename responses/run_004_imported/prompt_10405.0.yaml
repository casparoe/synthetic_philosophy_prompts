          *   Conflict: Friends signing up vs. her refusal.
          *   Anscombe-esque angle: Not "I hate violence," but "This war strategy involves targeting civilians/indiscriminate bombing, which is immoral."
      *   *Idea 2: VE Day (May 1945).*
