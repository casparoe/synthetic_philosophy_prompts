      *   *Weakness:* Schopenhauer links the *truth* of the art to the *truth* of its objectification. A fake gem might look like a diamond, but it lacks the ontological status. If music is a "copy of the Will," a copy made by something without Will is a copy of a copy (like other arts), or worse, a simulacrum.
