  7.  **Final Polish:** Organize with clear headings. Ensure the distinction between "Procedural Justice" and "Distributive Justice" is clear but accessible. End with actionable advice.

  **(Self-Correction during drafting):** I need to make sure I don't validate the idea that the user *deserved* it more than Alex. They tied. The point is that *neither* deserved it more, so a random outcome feels unsatisfying because it ignores the *effort* both put in, not because Alex stole it.

