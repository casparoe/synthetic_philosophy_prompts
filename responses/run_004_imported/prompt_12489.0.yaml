answer: |-
  **Setting:** *The back porch of the uncle's house. It is 10:30 PM, long after the dinner that usually interrupts these conversations. Two mugs of coffee sit on a small table between MARK (you, the Reformed Calvinist) and DAVID (the Catholic Molinist philosophy professor). The air is cool; the crickets are loud enough to fill silences but not drown out speech.*

  **Mark:** I appreciate you staying up for this, David. Usually, when we hit the part about "logically prior to the decree," someone needs more wine or the casserole comes out. But if Sarah and I are going to do this, I can't treat this like a hobby. If your view of providence is the framework for her conscience, I need to know if it holds water.

  **David:** And I need to know if you think my view makes God a liar or a tyrant. So, let's not dance. You said earlier you wanted to start with the Grounding Objection. You think it's fatal.

  **Mark:** I think it's the crack in the foundation. Here's the problem: You say God, before He decrees to create anything, knows the Counterfactuals of Creaturely Freedom (CCFs). He knows "If Mark were in Circumstance C, he would freely choose X." My question is simple: What *makes* that proposition true?

  **David:** It's true by virtue of the state of affairs it describes.

  **Mark:** But there *is* no state of affairs yet. I don't exist. The circumstances don't exist. God hasn't decreed them. So where does this truth live? If it's true independently of God's will, you've got a realm of truth outside God's sovereignty. If it's true *because* of God's will, then you're a Calvinist, because He's determining what I would do. If it's true because of *me*... well, I'm not there. So what's grounding it?

  **David:** Okay. This is the Plantinga-Adams line of defense. You're assuming that for a proposition to be true, it needs a *causal* ground. Something that actively makes it happen. But truths about possibilities don't work like that. Consider mathematics. "2 + 2 = 4" was true before the universe existed. Did God decree that? Or is it true by virtue of the nature of numbers?

  **Mark:** Numbers are abstract objects. I'm a moral agent.

  **David:** Precisely. So, consider your "possible essence." Before you existed, there was a concept of *Mark* in the divine intellect. Not a puppet, but a specific kind of free agent. The truth of the counterfactual is grounded in *you*—not the actual, existing you, but the possible you. It's true that *if* that essence were instantiated in Circumstance C, it would yield Choice X. The ground is the nature of the possible person.

  **Mark:** But a "possible person" isn't a thing. It's a concept. Concepts don't choose. If the truth is grounded in my "possible essence," then my choices are fixed by my essence before I ever exist. That sounds a lot like determinism, just internalized. You're saying my nature locks in the choice, and God just picks the nature that locks in the choice He wants. How is that libertarian freedom?

  **David:** Because the necessity isn't causal. God doesn't *make* the essence yield that choice. The essence *just does*. It's a brute fact about you. God can't actualize a world where you are in C and choose Y, because that's not who you are. But He didn't *make* you that way in a coercive sense. He simply recognized the truth about you and decided, "I want a world with Mark in C."

  **Mark:** See, that's where I get stuck. "Logically prior." I get that you mean it's not temporal. But if God looks at the menu of possible worlds, sees that World A contains Mark freely worshipping, and World B contains Mark freely rebelling, and He picks World A... He has selected the outcome.

  **David:** He selected the *circumstances*. He left the *choice* to you.

  **Mark:** But He knew with infallible certainty what the choice would be before He laid the foundation of the world. And He only created the world where He knew you'd choose the thing He wanted. If I cannot do otherwise in the actual world, because God would not have actualized a world where I did otherwise, in what sense am I free? It feels like you're trying to have your cake and eat it too. You want the sovereignty of Calvinism—God controls the outcome—but the moral cover of Arminianism—God didn't cause the sin.

  **David:** I'm not trying to have my cake. I'm trying to preserve moral responsibility. Mark, if I raise my niece's children with your view, I have to tell them God ordained every thought they have. If a child sins, God decreed that sin. You say, "Well, God ordains the ends and the means, but He's not the author of sin." I hear words, but I don't see the metaphysics. If God sovereignly decrees the fall, how is it not His fault?

  **Mark:** Because God's relationship to sin is permissive, not efficient. He ordains it to happen, but He does it through secondary agents who act according to their own desires. I sin because *I want to*. God isn't tempting me.

  **David:** But you couldn't *not* want to. Not in that moment. If God's decree is exhaustive, then your desire to sin was determined by Him. If I hold a gun to your head and you hand over your wallet, you didn't freely give it. If God holds the metaphysical gun of His decree, and you sin, you didn't freely sin.

  **Mark:** That's a category error. God isn't a creature pushing me. He's the ground of my being. When I sin, I am acting out my own nature. The fact that He sustains me while I do it doesn't make Him the sinner any more than the sun is guilty of the crimes committed in its light.

  **David:** But the sun didn't plan the crimes. You say God did.

  **Mark:** I say God ordained them for a greater good.

  **David:** There it is. The greater good. That's the trade-off. You sacrifice the intuitive freedom of the creature to protect the sovereignty of the Creator. I sacrifice a certain kind of exhaustive control to protect the genuine love of the creature.

  **Mark:** It's not just "intuitive" freedom, David. It's whether love is possible at all. If I can't do otherwise, how can I love God?

  **David:** Because you *want* to. That's freedom enough. But let's go back to your grounding objection. You said if my view is grounded in my "possible essence," it's just internal determinism. But if your view is grounded in God's decree, it's external determinism. The only difference is who holds the leash.

  **David:** *leans forward* Here is where I think we actually bottom out. You think "freedom" means doing what you want, even if what you want is determined. I think "freedom" means having the power of contrary choice.

  **Mark:** Power of contrary choice in a world God governs? That makes God reactive.

  **David:** No, it makes God creative. He doesn't micromanage the will; He orchestrates the context.

  **Mark:** But if He knows exactly what the will will do in that context, and He puts the will in that context *to get that result*, He is micromanaging the outcome.

  **David:** *pauses* Okay. Let's grant the Grounding Objection has weight. Let's say we don't fully know *how* those counterfactuals are true. Is it a bigger problem than the Problem of Evil in your system? In your system, God could have created a world where everyone freely chooses Him. You admit that's possible, right?

  **Mark:** I admit it's logically possible, yes.

  **David:** But He didn't. He chose *this* world. Where children die. Where people reject Him and are condemned for doing exactly what He ordained them to do. In my system, God does everything He can to save everyone without violating their freedom. In your system, God *could* save everyone but chooses not to, for His own glory. Which God is easier to pray to?

  **Mark:** *takes a sip of cold coffee* The God who is actually in control. David, if salvation depends on my free will, then salvation depends on me. If it depends on me, I have something to boast about. Or worse, I have something to despair about, because I know my own heart is fickle. If it depends on God's election, I can sleep at night. My salvation is as secure as His decree.

  **David:** And my peace comes from knowing He never forces me. He woos. But He doesn't drag.

  **Mark:** But He knows if the wooing will work before He starts.

  **David:** *sighs* Yes. He knows.

  **Mark:** So we're back to the truth of the counterfactual. If He knows it, and it's true, and He creates the scenario... David, honestly? It feels like you're trying to soften the blow of determinism. You want to say "God didn't make me do it," but if God knew putting me in this marriage would lead me to Christ, and He put me here *because* of that... He made it happen.

  **David:** And you're trying to soften the blow of God being the author of sin. You want to say "God ordained it but isn't guilty," but if He ordained it with exhaustive specificity... He made it happen.

  *Silence stretches between them. The crickets seem louder.*

  **Mark:** So maybe that's it. We both agree God makes it happen. We just disagree on the mechanism and the moral implication.

  **David:** I don't agree He makes the *choice* happen. He makes the *situation* happen.

  **Mark:** But the choice is inevitable given the situation and the agent.

  **David:** Inevitable to *whom*? To God, yes. To you, no. You experience it as a choice.

  **Mark:** Experience isn't metaphysics.

  **David:** But ethics is lived, not just mapped. Mark, here is my worry for Sarah. If you raise your kids Calvinist, and one of them walks away from the faith... you will tell them, "God ordained this for His glory." That might comfort you. It will devastate them. It tells them their rebellion was a script they had to read.

  **Mark:** And if you raise them Molinist, and they walk away... you tell them, "God did everything He could, but you rejected Him." That tells them they have the power to thwart God's ultimate desire. That's a heavy burden.

  **David:** It's the burden of being a person.

  **Mark:** It's the burden of being a god.

  *David looks out into the dark yard. He turns back, looking tired.*

  **David:** We aren't going to solve the Grounding Objection tonight. Plantinga couldn't solve it to your satisfaction, and neither can I. You think it's a hole. I think it's a mystery inherent to finite minds trying to grasp the relationship between Time and Eternity.

  **Mark:** And you won't solve the Author of Sin problem for me. I think it's a necessary tension of sovereignty. You think it's a contradiction.

  **David:** So where does that leave Sarah?

  **Mark:** *rubs his face* It leaves us with a decision. Not about who's right, but about which mystery we can live inside.

  **David:** I can't ask you to stop being Reformed. It's in your bones.

  **Mark:** And I can't ask you to pretend Molinism is just Calvinism with extra steps. But David... if the Grounding Objection is true, if those counterfactuals are just floating... doesn't that make God's knowledge dependent on something outside Him?

  **David:** Not dependent. *Responsive.* He knows them because He knows Himself and all possible emanations of His power. Look, Mark. I will never believe God decreed the Fall. You will never believe God was surprised by it.

  **Mark:** Right.

  **David:** But here is the practical thing. Sarah knows this. She knows you think her uncle is wrong on the metaphysics. She knows I think you're wrong on the ethics of divine love. The question isn't whether we agree. It's whether you can respect a view where God limits His own control for the sake of relationship.

  **Mark:** *long pause* I can respect that He values relationship. I just don't think He has to limit His control to have it.

  **David:** Then we are at the bottom.

  **Mark:** Yeah. We are.

  **David:** *stands up* I'll make more coffee. Or maybe we just let the night be.

  **Mark:** Let it be. I think... I think I need to talk to Sarah. Not about Middle Knowledge. But about whether she can trust a father who believes her choices were written before she was born.

  **David:** And I need to pray she can trust a God who knew she'd be born, knew every stumble, and loved her enough to let her stumble.

  **Mark:** *stands* Goodnight, David.

  **David:** Goodnight, Mark.

  *David goes inside. Mark stays on the porch for a moment, looking at the empty mugs. He doesn't look like he won the argument. He looks like he found the wall.*
