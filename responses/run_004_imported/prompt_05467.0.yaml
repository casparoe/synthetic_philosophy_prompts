  7.  **Self-Correction during drafting:** I need to be careful not to make Turing a *full* functionalist (Putnam) yet. In 1950, he's more operationalist/behaviorist. Functionalism comes later. So, emphasize the *output* and the *convention*. Searle attacks the idea that output is all that matters. Turing must defend why output is all that *scientifically* matters.

