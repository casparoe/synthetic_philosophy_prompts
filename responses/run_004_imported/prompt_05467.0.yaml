          *   *The Exposed Flank:* Turing's behaviorism struggles with *intentionality* (aboutness). If the machine has no contact with the referent (the world), can it mean anything? Turing hints at this with the "child machine" needing education (interaction), but the 1950 test is text-only. Searle exploits the text-only nature of the room.

