      *   **The Counter-Move (Prima Facie vs. All-Things-Considered):** This is the most common rebuttal (W.D. Ross). Distinguish between *pro tanto* obligations and final obligations. In a dilemma, you have two *prima facie* duties, but only one *all-things-considered* duty. This saves SDL but denies the *genuine* dilemma (in the strong sense).
      *   **The Defense of Dilemmas (Marcus/Williams):** Why do they insist dilemmas are real?
          *   *Williams:* Moral luck, integrity, the residue of guilt. If logic says "no dilemma," why do we feel guilt for the unchosen option?
          *   *Marcus:* Inconsistency in the world, not just in logic.
          *   *Rejecting the Premises:* Some argue OIC fails in tragic cases (you *should* have saved both, even if you couldn't). Some argue Agglomeration fails (morality isn't a consistent logical system).
      *   **SDL as a Normative Model:** Explain that SDL is a tool for *consistent* systems. If morality is inherently tragic/inconsistent, SDL is the wrong tool, not the proof of impossibility.
