answer: |-
  This is a fantastic angle for a feature. Your source is correct: among decision theorists, the Pasadena paradox is widely regarded as a deeper, more troubling wound to expected-value (EV) theory than the St. Petersburg paradox. While St. Petersburg shows that EV can explode, Pasadena suggests that EV can cease to exist altogether.

  Here is a breakdown of the two paradoxes, the mathematical distinction between "infinite" and "undefined," and the current state of the debate, tailored for an intelligent general-interest audience.

  ### 1. The Baseline: St. Petersburg (The Explosion)

  To understand Pasadena, your readers need a crisp refresher on St. Petersburg.

  *   **The Game:** A casino flips a fair coin until it lands Heads. If Heads appears on the first flip, you win \$2. If on the second, \$4. Third, \$8. The pot doubles every time a Tail appears.
  *   **The Math:** The probability of winning \$2 is 1/2. The probability of winning \$4 is 1/4. The probability of winning \$8 is 1/8.
  *   **The Expected Value:** To find the EV, you multiply each payoff by its probability and add them up:
      $$(\$2 \times 1/2) + (\$4 \times 1/4) + (\$8 \times 1/8) + \dots$$
      $$= \$1 + \$1 + \$1 + \dots = \infty$$
  *   **The Problem:** The math says the game is worth an infinite amount of money. Rationality suggests you should mortgage your house to play. Intuition says you shouldn't pay more than \$20.
  *   **The Verdict:** The Expected Value is **Infinite**.

  **Philosophical Status:** This is a problem of *magnitude*. The engine of expected utility theory works, but it produces a result that doesn't map to human behavior. Most theorists "solve" this by arguing that money has diminishing marginal utility (a billion dollars isn't a billion times better than one dollar) or that the casino's bankroll is finite. If you cap the utility or the bankroll, the infinity disappears.

  ### 2. The Twist: Pasadena (The Shuffle)

  The Pasadena game, proposed by Alan Hájek and Harris Nover in 2004, looks almost identical but introduces a crucial change: **alternating gains and losses.**

  *   **The Game:** A fair coin is flipped until Heads.
      *   If Heads on flip 1: You win \$2.
      *   If Heads on flip 2: You *lose* \$4.
      *   If Heads on flip 3: You win \$8.
      *   If Heads on flip 4: You *lose* \$16.
      *   (The payoffs grow exponentially like St. Petersburg, but the sign flips between positive and negative.)
  *   **The Math:** When you multiply these payoffs by their probabilities (just like in St. Petersburg), the exponential growth cancels out the shrinking probability. You are left with a series of numbers that look like this:
      $$1 - 1/2 + 1/3 - 1/4 + 1/5 - \dots$$
      (Mathematically, this is the *Alternating Harmonic Series*.)
  *   **The Problem:** In standard calculus, this series sums to the natural log of 2 (approx 0.69). So, is the EV 69 cents? **No.**
      This series is **conditionally convergent**. It only sums to 0.69 if you add the terms in the exact order written above.
      According to the **Riemann Rearrangement Theorem**, if a series is conditionally convergent, you can reorder the terms to make them sum to *any number you like*.
      *   If you list all the positive outcomes first, then the negative ones, the EV shoots to **Positive Infinity**.
      *   If you list the negatives first, it plunges to **Negative Infinity**.
      *   If you shuffle them differently, the EV could be \$100, or -\$5,000.
  *   **The Verdict:** The Expected Value is **Undefined**.

  **Philosophical Status:** This is not a problem of magnitude; it is a problem of **coherence**. In decision theory, a "gamble" is a set of outcomes. A set has no inherent order. You shouldn't be able to change the value of a gamble simply by listing the outcomes in a different sequence on a spreadsheet. Pasadena shows that if you allow unbounded utilities, EV theory doesn't just give the wrong answer; it gives *no answer*.

  ### 3. "Infinite" vs. "Undefined": Why the Distinction Matters

  For your article, this is the crux of the philosophical stakes.

  **Infinite (St. Petersburg)** implies the theory is **over-sensitive**. It values the gamble too highly. We can fix this by imposing limits (e.g., "utility is bounded"). It's like a speedometer that breaks because the car went too fast. The car still works; the gauge just hit its ceiling.

  **Undefined (Pasadena)** implies the theory is **incoherent**. It suggests that the arithmetic of decision theory is fundamentally broken for certain classes of problems. It's like the steering wheel detaching. You can't just "cap" the value; you have to explain why the calculation yields a result at all.

  **Why this matters for Effective Altruism/Longtermism:**
  Longtermist arguments often rely on "tiny probability $\times$ enormous payoff" (e.g., preventing human extinction).
  *   **St. Petersburg** warns Longtermists: "Be careful, if the payoff is big enough, the math says you should ignore all near-term suffering to chase it."
  *   **Pasadena** warns Longtermists: "If the structure of the future is complex enough (involving potential losses and gains that don't dampen fast enough), the math says there is *no fact of the matter* about whether saving the future is better than doing nothing."

  If EV is undefined, you cannot use it to justify altruistic intervention. You lose the ability to say Act A is better than Act B.

  ### 4. Is Your Source Dramatizing? (The Debate)

  Your source is technically correct, but there is genuine disagreement about how much this should worry us. Here is the landscape of the debate you should represent:

  **View A: The Formalists (The Damage is Real)**
  *   *Proponents:* Alan Hájek, Harris Nover, Kenny Easwaran.
  *   *Argument:* Decision theory claims to be a general account of rationality. If it fails on logically possible cases (even if physically impossible), it is flawed. Pasadena proves that "Expected Value" is not well-defined for all gambles. We need a new theory (e.g., "Weak Expectation" or relative comparisons) that handles conditional convergence.
  *   *Implication:* Standard EV maximization is mathematically naive.

  **View B: The Pragmatists (The Damage is Contained)**
  *   *Proponents:* Many economists, some EA practitioners.
  *   *Argument:* The Pasadena game requires payoffs that grow infinitely large. In the real world, resources are finite. No charity can save "infinite lives" or generate "infinite utility."
  *   *The Fix:* **Bounded Utility.** If you accept that there is a maximum possible amount of "good" (a utility cap), the Pasadena series becomes *absolutely convergent*. The terms get small enough, fast enough, that reordering them doesn't change the sum.
  *   *Counter-Counter:* Longtermists often posit *infinite* futures (an endless stream of descendants). If the future is potentially infinite, bounded utility is hard to justify. Pasadena comes back to haunt them.

  **View C: The Skeptics (It's a Pseudo-Problem)**
  *   *Argument:* These thought experiments rely on "supertasks" or physically impossible setups. Decision theory is a tool for the real world, not a branch of pure mathematics. Worrying about Pasadena is like worrying that Newtonian physics fails at the speed of light—it's true, but irrelevant for building bridges.
  *   *Relevance:* If your article focuses on *practical* EA giving, this view holds weight. If it focuses on the *philosophical foundations* of Longtermism, this view is weaker.

  ### 5. Solutions That Distinguish the Two

  You asked if there are attempts to tame Pasadena that don't equally rescue St. Petersburg. This is subtle, but yes:

  1.  **Bounded Utility:** Solves **both**. If utility has a ceiling, neither paradox arises.
  2.  **Truncation:** Ignoring outcomes with probabilities below a certain threshold. This solves St. Petersburg (cuts off the infinite tail). It *might* solve Pasadena, but it feels ad-hoc.
  3.  **Weak Expectation (Easwaran):** This is a sophisticated mathematical fix. It allows you to assign a value to the St. Petersburg game (by looking at the average payoff over many plays). However, applying Weak Expectation to Pasadena is much harder and remains a subject of active research. Some argue Weak Expectation saves St. Petersburg but leaves Pasadena unresolved, highlighting that Pasadena is indeed the "harder" case.

  ### Summary for Your Piece

  You can frame it this way:

  > "If the St. Petersburg paradox is a warning sign that expected-value reasoning can lead us to absurdly high valuations, the Pasadena paradox is a warning that the reasoning can break down completely. St. Petersburg tells us the answer might be too big to handle; Pasadena tells us there might be no answer at all. For a movement like Effective Altruism, which leans heavily on the precision of expected-value calculations to prioritize global interventions, the difference between a number that is infinite and a number that is undefined is not just technical—it is existential."

  **Recommendation:** Be honest that for *practical* decision-making (e.g., "Should I donate to bednet distribution?"), Pasadena is irrelevant. But for the *theoretical justification* of Longtermism (which deals in infinite time horizons and existential risks), it exposes a crack in the foundation that decision theorists have not yet fully patched. Your source isn't dramatizing; she is pointing out that while everyone knows about the explosion (St. Petersburg), fewer realize the engine block is missing (Pasadena).
