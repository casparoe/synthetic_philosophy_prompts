      *   *Solution:* **Epistemic Humility via Variance.** Keep the mean (average), but don't force the individuals to change. The "override" is rejected because identical track records negate epistemic superiority. The "forced midpoint" is rejected because it manufactures false consensus. The *aggregate* naturally lands near the midpoint, which is the optimal betting strategy even if individuals remain steadfast.
