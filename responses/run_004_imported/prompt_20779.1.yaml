answer: |-
  **MEMORANDUM**

  **TO:** Aggregation Policy Committee & Board of Directors
  **FROM:** [Your Name], Aggregation Policy Subcommittee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Post-Disclosure Forecast Divergence & Weighting Protocols

  ### 1. Executive Summary

  Following the recent geopolitical forecasting incident involving two high-calibration members (divergence >20% post-double-crux), the Subcommittee has reviewed proposals to alter our aggregation methodology. Specifically, we evaluated a "Veteran Override" (weighting by tenure/post-disclosure confidence) and a "Forced Conciliation" mandate (requiring forecasters to submit the group mean).

  **Recommendation:** The Subcommittee recommends **maintaining the current Equal-Weight Aggregation policy** for the newsletter pool, while rejecting both the Veteran Override and Forced Conciliation mandates. However, we propose adding a **"High Variance Flag"** to the newsletter when post-disclosure divergence exceeds 15%.

  **Review Timeline:** This policy shall remain in effect for **6 months** or **10 divergence events** (whichever comes first), after which it will be re-evaluated against Brier score performance.

  ### 2. Context & Problem Statement

  Our current protocol assumes the *Equal Weight View* (EWV): when epistemic peers disagree, the aggregate should weight their inputs equally. Recently, two forecasters with near-identical multi-year Brier scores failed to converge after a full double-crux session. This presents a tension:
  1.  **Aumann's Agreement Theorem** suggests rational agents with common priors and common knowledge of posteriors cannot agree to disagree.
  2.  **Conciliationism** suggests peers should move toward the mean; steadfastness suggests they may rationally hold firm.

  Board members are split between institutionalizing steadfastness (Veteran Override) or enforcing conciliation (Forced Midpoint).

  ### 3. Epistemic Rationale

  We must navigate two philosophical horns without sacrificing forecasting accuracy.

  #### A. The Aumann Constraint & The "Override" Trap
  Aumann's Theorem holds only under strict conditions (common priors, truth-seeking rationality, common knowledge of posteriors). In human forecasting, "common knowledge" is rarely achieved via natural language double-cruxing. The persistence of disagreement signals **hidden indexicality** or **incompatible model structures** that were not resolved, rather than simple irrationality.

  The proposed **Veteran Override** attempts to resolve this by weighting one peer higher based on tenure or post-hoc confidence. We reject this for two reasons:
  1.  **Track Record Supremacy:** If multi-year Brier scores are identical, there is no *ex ante* empirical basis to privilege one prior over the other. Tenure is a proxy for experience, not calibration.
  2.  **"Steadfastness in a Spreadsheet":** Granting an override institutionalizes steadfastness without epistemic justification. It converts a philosophical stance ("I trust my model") into an algorithmic advantage, incentivizing forecasters to dig in rather than update to gain weight. This degrades the pool's long-term calibration.

  #### B. The Conciliationism Paradox & Forced Midpoints
  The proposal to **Force the Midpoint** requires forecasters to submit a number they do not believe to be true. We reject this mandate for individual submissions, though our *aggregation* naturally results in a midpoint.

  This addresses the **Self-Undermining Objection** to conciliationism: *If experts disagree on conciliationism, should we conciliate on that?*
  *   If we force forecasters to adopt the midpoint personally, we assume conciliationism is true. But since epistemologists disagree on conciliationism, a consistent conciliationist should dilute their belief in conciliationism, leading to a regress.
  *   **Our Solution:** We distinguish between the **Individual Epistemic Agent** and the **Aggregate System**.
      *   *Individual Level:* We allow steadfastness. Forecasters submit their true credence. This avoids the self-undermining paradox because we are not forcing them to adopt a meta-ethical stance on disagreement.
      *   *Aggregate Level:* We apply EWV. The *newsletter's* forecast is the midpoint. This is not a claim that the midpoint is the "truth," but that the midpoint minimizes expected squared error (Brier score) given two peers of equal calibration.

  By separating individual submission from aggregate output, we capture the accuracy benefits of conciliationism (variance reduction) without requiring forecasters to resolve the philosophical paradox personally.

  ### 4. Operational Policy Changes

  While we maintain equal-weight averaging, the persistence of post-disclosure divergence is itself data. It indicates higher-than-normal uncertainty that a simple mean obscures.

  1.  **Aggregation:** Continue to average all submissions equally, regardless of tenure or post-disclosure confidence statements.
  2.  **Divergence Flag:** If two or more top-quartile forecasters remain >15% apart after a documented double-crux session, the newsletter will display the mean *plus* a "High Uncertainty" indicator showing the range.
      *   *Rationale:* This acknowledges the Aumann violation. If peers can't agree, the world is likely more complex than the models suggest. The reader should know the consensus is fragile.
  3.  **No Mandatory Updating:** Forecasters are not required to move their numbers toward the mean. Their incentive is accuracy; if they believe the mean is wrong, their future Brier score will penalize them naturally.

  ### 5. Review & Sunset Clause

  This policy is a provisional response to a specific class of edge cases (high-skill divergence). It is not a permanent epistemic stance.

  *   **Sunset Date:** April 24, 2024 (6 Months).
  *   **Trigger Event:** Alternatively, upon the 10th recorded instance of >15% post-disclosure divergence.
  *   **Success Metrics:** At review, we will compare the Brier score of the Equal-Weight Aggregate vs. a simulated Veteran-Weighted Aggregate. If the Veteran Weighting shows statistically significant improvement (p < 0.05), we will reopen the Override debate.

  ### 6. Conclusion

  We cannot solve the hard problem of peer disagreement by fiat. However, we can structure our aggregation to maximize accuracy while respecting the limits of human communication. The Equal-Weight Aggregate remains the most robust mechanism for minimizing error among peers. The "Veteran Override" rewards stubbornness without evidence; the "Forced Midpoint" demands philosophical compliance we cannot justify. We recommend the path of **aggregate conciliation, individual autonomy, and transparent uncertainty.**

  **Vote Required:** Approval to adopt the Equal-Weight Maintenance + Divergence Flag protocol.

  _________________________
  **[Your Name]**
  Aggregation Policy Subcommittee
