      *   **Theoretical Constraints:**
          *   Acknowledge Aumann's Agreement Theorem (common priors + common knowledge $\rightarrow$ agreement; disagreement implies failure somewhere).
          *   Address the self-undermining nature of conciliationism (if experts disagree on conciliationism, do we conciliate on that too?).
