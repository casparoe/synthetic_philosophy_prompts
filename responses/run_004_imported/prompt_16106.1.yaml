  What would actually help is a real example - doesn't have to be ADHD, could be autism or whatever else is having a diagnostic "boom" right now - that would count as a genuine Hacking-style looping effect, laid out clearly enough that I could see the actual feedback loop happening (who's classifying, how the classified people respond, how that response changes the category). Then I want you to contrast it with a case that looks similar on the surface, i.e. rising numbers, changed public attitudes, but is really just better detection or reduced stigma and NOT a looping effect in his specific sense. Every pop-psych article I've read uses the phrase as if it just means "diagnoses are socially constructed," and that seems too loose based on the little I've actually read of his stuff, so I guess what I want is to understand what's doing the real work in his definition that would rule the lazy version out.
