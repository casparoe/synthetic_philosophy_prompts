      *   **Section 1: The Motivation for Imprecision:**
          *   Why do people want this? The "Evidence-Evidence" distinction.
          *   Example: Coin of known bias (50/50) vs. Coin of unknown bias. Sharp Bayesians must assign 0.5 to both. Imprecise Bayesians assign 0.5 (sharp) to the first and $[0, 1]$ to the second.
