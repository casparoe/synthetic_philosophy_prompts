      *   *Imprecise Bayesianism:* Belief = Set of Probability Functions ($\mathbb{P}$). Rationality = Each $P \in \mathbb{P}$ is coherent. Motivation: Evidence sometimes doesn't justify a sharp number (e.g., Ellsberg urn, unknown bias).
