      *   In the St. Petersburg Paradox, the expected value diverges to infinity ($\sum \frac{1}{2^n} \cdot 2^n = \sum 1 = \infty$).
      *   In the Pasadena Game, the payoffs are structured such that the expected value is $\sum \frac{(-1)^{n-1}}{n}$. This is the alternating harmonic series.
