      *   *However*, the series is only *conditionally* convergent. It is not *absolutely* convergent ($\sum |\frac{(-1)^{n-1}}{n}| = \sum \frac{1}{n} = \infty$).
      *   Therefore, by the Riemann Rearrangement Theorem, if you reorder the outcomes (which shouldn't matter in probability theory if the sum is well-defined), you can make the expected value anything: $0, 100, -\infty$, etc.
      *   This creates a normative crisis in decision theory: How do you value the game if the value depends on the order of summation?

