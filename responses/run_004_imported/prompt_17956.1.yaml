  2.  **Identify the Phenomenon:**
      *   This is a classic problem in social choice theory and judgment aggregation.
      *   It is known as the **Doctrinal Paradox** (or sometimes the **Discursive Dilemma**).
      *   It was famously analyzed by Lewis Kornhauser and Lawrence Sager (1986, 1993) in the context of judicial decision-making.
      *   It relates to Condorcet's paradox but specifically deals with logical connections between premises and conclusions.

