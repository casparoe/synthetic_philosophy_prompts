      *   *Option A: Neo-Lorentzianism.* Posit a preferred frame (A-theory of time + SR phenomena). *Constraint Check:* User said avoid this unless defensible against "ad hoc" objections. It's hard to defend against Occam's Razor without new empirical data. I should mention it but focus on stronger philosophical moves.
