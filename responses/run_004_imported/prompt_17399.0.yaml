answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee, Contributors, and Stakeholders
  **FROM:** Chair, Steering Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Regarding Classical Axioms and Library Architecture

  ### Executive Summary

  After reviewing the proposal to adopt the Law of Excluded Middle (LEM) and the Axiom of Choice (AC) as global axioms, and considering the feedback from the community and our industry partners, the Steering Committee has reached a decision.

  **We will not adopt classical axioms globally in the core library.** Doing so would compromise the computational guarantees required by our industry partners for code extraction. However, acknowledging the value of classical formalization and the friction caused by the current status quo, **we will officially sanction and maintain a separate "Classical Fork" (or Extension Layer).**

  This architecture preserves the constructive integrity of the core library while providing a first-class environment for contributors wishing to formalize classical analysis and set theory without the overhead of local axiom management.

  ### Context and Constraints

  Our library serves two distinct but overlapping missions:
  1.  **Pedagogical and Constructive:** Providing a foundation where existence proofs yield computable witnesses, used in university courses and by developers extracting certified code.
  2.  **Mathematical Breadth:** Formalizing standard mathematics to support verification efforts that do not require extraction.

  The current proposal to make LEM and AC global axioms was driven by a desire to reduce the friction of porting classical results. The resistance to this proposal stems from the philosophical and technical commitment to constructivity. Both positions are technically sound and philosophically defensible; the conflict arises from attempting to satisfy incompatible requirements within a single namespace.

  ### Rationale for the Decision

  **1. The Industry Constraint is Non-Negotiable**
  Our industry partner extracts code from our proofs for safety-critical systems. This workflow relies fundamentally on the Curry-Howard correspondence: a proof *is* a program. Global LEM and AC break this correspondence. A proof of existence using these axioms cannot yield a witness, rendering code extraction impossible or unsound for those modules. Because the core library is a dependency for this safety-critical pipeline, we cannot introduce global axioms that invalidate the extraction mechanism. To do so would breach the trust of our industry stakeholders and render the library unusable for its most high-stakes application.

  **2. Protecting the Constructive Core**
  For our academic contributors and students, the guarantee that `exists x, P x` implies we can compute `x` is not merely a preference; it is the library's defining feature. Diluting this in the core would confuse students and undermine the pedagogical value of the tool. We must maintain a "safe zone" where constructivity is enforced by the type system, not just by convention.

  **3. Validating Classical Work**
  However, we must also engage seriously with the faction advocating for classical axioms. Their argument is not that constructivity is "wrong," but that it is unnecessary for many verification tasks. When verifying a protocol where efficiency of the witness is irrelevant, or when porting standard analysis where constructive proofs are notoriously difficult and often outside the scope of the project, classical reasoning is a pragmatic tool. Requiring contributors to flag every lemma in a large-scale port of analysis is indeed a significant tax that discourages contribution.

  ### Engaging the Perspectives

  **To the proponents of Global Axioms:**
  We recognize that your position is not born of laziness, but of pragmatism. Standard mathematics is classical, and re-proving analysis constructively is often a research project in itself, not merely a porting task. You are correct that for many verification goals, a non-computable witness is sufficient.
  *Why this decision:* While your mathematical goals are valid, the *global* adoption of these axioms imposes a hidden cost on all users, including those who rely on extraction. By moving this work to a Classical Fork, you gain the environment you desire—where classical axioms are implicit and ubiquitous—without breaking the build for the extraction team. You will have a dedicated space where classical reasoning is the default, not the exception.

  **To the proponents of Strict Constructivity:**
  We recognize that your resistance is not merely dogmatic, but grounded in the semantics of the proof assistant. A proof that supplies no construction does not, in your view, demonstrate existence in the same meaningful way. You worry that "axiom leakage" will silently corrupt constructive proofs.
  *Why this decision:* A Separate Fork provides stronger guarantees than the "Local-Only" status quo. In a single repository with local axioms, there is always a risk of accidental importation. By physically separating the classical code into a dependent fork, we create a hard boundary. The core remains pure. The Classical Fork is explicitly marked as non-extractable. This protects the integrity of the core while acknowledging that classical mathematics has a place in the broader ecosystem.

  ### Implementation Plan

  1.  **Repository Structure:** We will establish a distinct repository (or distinct top-level namespace) designated as `[Library]-Classical`. This fork will import the core library and immediately assert LEM and AC as global axioms.
  2.  **CI and Maintenance:** The Classical Fork will be part of our continuous integration pipeline. It will be maintained by the Steering Committee to ensure it tracks core updates, preventing the fork from becoming abandoned software.
  3.  **Documentation:** All documentation will clearly distinguish between the Core (Extractable/Constructive) and the Classical Fork (Non-Extractable). Imports from the Classical Fork will be visually distinct in IDEs to prevent accidental usage in safety-critical projects.
  4.  **Contribution Guidelines:** Contributors wishing to formalize classical analysis are encouraged to work in the Fork. Contributors working on core data structures or extraction-ready algorithms must work in the Core.

  ### Conclusion

  This decision rejects the path of least resistance (Global Axioms) in favor of a path that requires more infrastructure but respects all stakeholders. It acknowledges that while classical mathematics is valid, it is not compatible with the computational guarantees that define our core library's unique value proposition.

  By sanctioning a Classical Fork, we invite the classical community to contribute without friction, while assuring our industry partners and constructive purists that the core remains a safe foundation for certified code. We are not choosing between constructive and classical mathematics; we are choosing an architecture that allows both to thrive without compromising the other.

  Please direct questions regarding the migration plan to the Steering Committee mailing list.

  Signed,

  Chair, Steering Committee
