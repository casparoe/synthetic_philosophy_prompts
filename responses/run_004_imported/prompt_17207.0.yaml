answer: |-
  **Setting:** *A dimly lit robotics lab at MIT, circa 1995, though the air smells of ozone and burnt plastic like yesterday. In the center of the room sits the charred remains of Dennett's R2D2—the robot that was supposed to solve the frame problem by distinguishing relevant from irrelevant implications. It failed. Jerry Fodor stands with his hands in his pockets, staring at the wreckage. Hubert Dreyfus leans against a workbench, arms crossed.*

  **Fodor:** (Kicking a loose wire) Look at it. It's a tragedy, Hubie. A genuine tragedy. Dennett thought he could engineer his way out of epistemology. He thought if he just gave the machine enough heuristics, it would know what to ignore.

  **Dreyfus:** It's not a tragedy, Jerry. It's a reductio. The machine didn't fail because it lacked enough heuristics. It failed because it assumed that being in the world is a matter of processing information about the world. That's the error. You're looking at the smoke and seeing an engineering bottleneck; I'm looking at it and seeing a category mistake.

  **Fodor:** A category mistake? The bomb went off. That's a physical fact. The robot had to represent the bomb, the cart, and the time variable. It failed to isolate the relevant variables from the infinite set of irrelevant ones. That is precisely the Frame Problem. And my point remains: this proves central cognition isn't modular. If it were, you could encapsulate the "bomb detection" module and be done with it. But you can't.

  **Dreyfus:** Why not?

  **Fodor:** Because belief fixation is isotropic. And it's Quinean. Look, perception? Sure, the visual system is a module. It's fast, encapsulated, domain-specific. It doesn't care about your beliefs regarding Keynesian economics when it processes edges. But *thinking*? Deciding what to believe? That's global. Any piece of information *could* be relevant to any other piece. The color of the cart might matter if the bomb is triggered by a photodiode. The weight matters if the floor is weak. The political affiliation of the person who built the bomb might matter if it's a hoax. The system has to be open to *anything*. That's isotropy. And confirmation is holistic—you revise the whole web of belief, not just one node. That's Quine. You can't modularize that, Hubie. You can't put a boundary on "relevance."

  **Dreyfus:** I agree you can't modularize it, Jerry. But not because the mind is a giant, isotropic computer. I agree you can't do it because relevance isn't computed *at all*.

  **Fodor:** (Snorts) Oh, here we go. The magic touch.

  **Dreyfus:** It's not magic. It's involvement. When I walk into this room, I don't scan a list of properties: *floor, solid; gravity, active; air, breathable.* I don't infer that the floor will hold me. I just walk. The world shows up for me as a field of affordances. The floor *affords* walking. The bomb *affords* danger. This isn't a calculation. It's a style of coping. The robot failed because it was detached. It was trying to represent the world from nowhere. But meaning only arises for an entity that cares about its own existence, that has a body that can be broken.

  **Fodor:** Okay, let's grant you the body. Let's say we give the robot skin, proprioception, a fear circuit. So now it "cares." Fine. Now explain to me how that embodied "know-how" scales. I'm a physicist, you're a philosopher, but we both know science isn't just coping. You can't "feel" your way through the derivation of Bell's Theorem. You can't have an affordance for a Hilbert space. At some point, abstract cognition requires explicit representation. It requires manipulating symbols according to rules. If you throw out the computational model entirely, you lose the ability to explain how we do mathematics, or logic, or indeed, how we design robots.

  **Dreyfus:** That's the old "scaling up" objection. You assume that because expert physics looks like symbol manipulation on a chalkboard, the *cognition* behind it is symbol manipulation. But talk to the physicists. Ask them how they solve problems. They don't run algorithms. They develop an intuition. They get a "feel" for the equations. They see when a solution looks "ugly" or "elegant." That's not syntax, Jerry. That's a refined version of the same embodied skill that lets me ride a bicycle. The novice needs rules; the expert has internalized the context. The Frame Problem only exists for the novice who is detached from the situation.

  **Fodor:** That's romantic, Hubie. It's also dangerously vague. "Intuition" is just a label for a process we don't understand yet. Just because GOFAI (Good Old-Fashioned AI) hasn't cracked common sense in forty years doesn't mean the Computational Theory of Mind is false. It might just mean the primitives are harder to find than we thought. The failure of hand-coding isn't evidence that representation is wrong; it's evidence that the world is complicated.

  **Dreyfus:** But it *is* evidence that representation is the wrong starting point! For decades, your crowd tried to build context-free rules and then add context back in as variables. "If condition X, then do Y, unless Z." But Z is infinite. You can't list the exceptions. Heidegger called this the "regress of rules." To follow a rule, you need a rule for how to apply the rule. The robot is stuck in that regress. It's trying to calculate what matters, but "mattering" is not a variable. It's the background against which variables appear.

  **Fodor:** So what's the alternative? Mysticism? If the brain isn't computing functions over representations, what is it doing? Pushing ions? Sure. But at the cognitive level, there has to be a syntax. If I think "The bomb is on the cart," there is a structure there. If I didn't have that structure, I couldn't think "The cart is on the bomb" and distinguish the two. Connectionism, embodiment, phenomenology—none of you explain the productivity of thought. None of you explain how I can think a thought I've never thought before.

  **Dreyfus:** I'm not denying structure exists. I'm denying that the structure is self-contained. You treat the mind like a self-sufficient engine. I'm saying the mind is an organ of a body in a world. The "productivity" you love comes from our ability to project ourselves into new situations, not from a generative grammar in the head. But let's be honest, Jerry. You're holding onto the Computational Theory because you're afraid of the alternative. If you give up on the idea that thinking is rule-following, you give up on the idea that psychology can be a science like physics.

  **Fodor:** Damn right I am. If psychology isn't about finding the laws of computation, it's just storytelling. I want nomic generalizations. I want to know the mechanism. You're telling me the mechanism is "being-in-the-world." That's not a mechanism; that's a poem. I'd rather have a broken robot than a mystery.

  **Dreyfus:** And I'd rather have a mystery than a category error that leads us down fifty years of dead ends. But look, we're standing over a corpse. The brute-force symbolic approach didn't work. The neural nets are just starting to show promise, but they're black boxes. Maybe the truth is somewhere in between. But until you acknowledge that the "data" the computer processes is already selected by a prior, non-computational engagement with the world, you're just building faster R2D2s.

  **Fodor:** Maybe. But here's the thing that keeps me up at night. If you're right, if cognition is fundamentally non-computational, non-representational embodied coping... then we should never be able to build an AI. Period. Not just hard, but impossible. Because you can't engineer "being."

  **Dreyfus:** (Pauses, looks at the robot) That's a strong claim. I'd say you can't engineer a *mind* by simulating *reasoning*. You might engineer a system that behaves intelligently, but it won't have understanding. It won't know what it's doing.

  **Fodor:** And how do we test that? That's my question. You say it won't "understand." I say that's a dualist ghost in the machine. Is there an experiment, Hubie? Is there a finding in neuroscience or cognitive psych that would make you say, "Okay, Fodor, it is just symbol crunching"? Or is your position immune to evidence?

  **Dreyfus:** (Sighs) If you showed me a machine that could genuinely deal with novelty without a pre-defined ontology... if it could encounter a completely new situation and not just classify it, but *care* about the outcome in a way that wasn't programmed by a human... maybe. But I don't think you'll find that in a syntax engine. What about you? What would make you say, "Okay, Hubie, computation is dead"?

  **Fodor:** If you showed me a cognitive process that was demonstrably non-algorithmic. Not just hard to compute, but *in principle* inaccessible to formalization. If you could prove that human inference violates logic in a way that isn't just a performance error, but a fundamental feature of competence...

  **Dreyfus:** We have that. We violate logic all the time. We act on hunches.

  **Fodor:** Performance errors! Noise in the system. I'm talking about the architecture.

  **Dreyfus:** (Shakes his head) See? You'll explain away any counter-evidence as "performance." And I'll explain away any AI success as "simulation."

  **Fodor:** (Lights a pipe, the smoke mingling with the fumes from the robot) So we're stuck.

  **Dreyfus:** We're stuck. Because you're asking for empirical data to solve a philosophical problem. You want to measure the "meaning" of the bomb. I'm telling you meaning isn't a measurable variable. It's the condition for measurement.

  **Fodor:** And I'm telling you that if we can't measure it, we can't explain it. And if we can't explain it, we might as well go home.

  **Dreyfus:** (Pushes off the workbench) Maybe. Or maybe we just need to learn to live with the fact that the thing doing the explaining—the mind—isn't the kind of thing that can be fully objectified.

  **Fodor:** (Looks back at the wrecked robot) Well. Until one of us drops dead, I suppose we keep arguing.

  **Dreyfus:** Agreed. But Jerry? Next time? Let's talk about chess. At least the board doesn't explode.

  **Fodor:** (A faint smile) Don't count on it. Deep Blue is coming, Hubie. And it's going to checkmate you.

  **Dreyfus:** It'll move the pieces. It won't know it won.

  *(They stand in silence for a moment, the smell of burnt circuitry hanging between them, two old lions guarding the boundaries of the knowable.)*
