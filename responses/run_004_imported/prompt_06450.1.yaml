answer: |-
  The check had been paid twenty minutes ago. The waiter had already wiped the crumbs from the table, but neither Elias nor Mara had moved to put on their coats. The coffee cups were empty, sitting like period marks at the end of a long, run-on sentence.

  "You're treating the logarithm like a law of physics," Mara said, leaning back in her chair. "It's not. It's a preference. A specific, somewhat aggressive preference."

  Elias traced the rim of his cup. "It's not a preference. It's the only function that aligns the ensemble average with the time average. That's the ergodicity point. When you bet, you don't live in a multiverse of parallel selves. You live in time. You take one path. The arithmetic mean tells you what happens to the average gambler across a million universes. The geometric mean tells you what happens to *you* in this one."

  "But 'what happens to me' depends on how I value what happens," Mara countered. "Expected utility theory doesn't forbid log wealth. It just says you have to *choose* it. If I choose a utility function of $U(W) = -1/W$, or $U(W) = \sqrt{W}$, I'm not making a math error. I'm saying I care more about the downside volatility than you do. Kelly betting assumes I care about percentage changes equally, regardless of my bankroll size. That's an assumption, Elias, not a derivation."

  "Is it?" Elias leaned forward. "Think about the long run. The almost-sure dominance theorem. If we play this 60/40 coin flip game for ten thousand rounds, any strategy that deviates significantly from Kelly will, with probability approaching one, end up with less wealth than the Kelly bettor. Not on average. *Almost surely.* If there's a strategy that dominates all others in the limit, isn't that the definition of rational?"

  Mara shook her head. "That's the Samuelson objection. He wrote that paper entirely in one-syllable words just to mock that line of thinking. The limit is a lie. No one plays ten thousand rounds. You have a finite horizon. You have rent due. You have a point where you stop. In a finite game, the 'dominant' strategy can underperform the 'suboptimal' one for the entire duration of your life. Asymptotics don't pay the bills."

  "Asymptotics define the gravity," Elias said. "If you ignore the growth rate, you're fighting gravity. Sure, in the short term, luck dominates. But if you bet too much—overbet Kelly—you introduce volatility drag. You compound losses deeper than you compound gains. Even with a finite horizon, if the horizon is *long enough*, the growth rate matters more than the variance. Why would you anchor your sizing to a utility function that might lead to zero growth?"

  "Because zero growth isn't my only fear," Mara said. "My fear is the drawdown. Kelly betting on a 60/40 edge tells me to bet 20% of my bankroll. Do you know what the probability of a 50% drawdown is with full Kelly? It's significant. If I lose half my stack, I need a 100% gain just to get back to even. Expected utility handles this naturally. If I'm more risk-averse, I bet less. I don't need a new theory of ergodicity to tell me I don't want to sweat that much. I just plug my risk tolerance into the utility function and maximize expected utility. Done."

  "But where does that risk tolerance come from?" Elias pressed. "If it's arbitrary, then your betting strategy is arbitrary. The beauty of the geometric approach is that it appears everywhere. It's not just gambling. Look at logarithmic pooling of probability estimates—if you want to aggregate expert opinions without introducing arbitrage opportunities, you use logs. Look at the Nash bargaining solution. If two agents are splitting a surplus, the solution that maximizes the product of their gains—which is the sum of their log utilities—is the only one that satisfies certain symmetry and independence axioms. The log isn't just *a* utility; it's the structure of rational aggregation under uncertainty."

  Mara smiled faintly. "You're conflating aggregation with action. Nash bargaining is about fairness between two parties, not how one person bets against nature. And probability pooling is about combining information, not consuming wealth. Just because the math looks similar doesn't mean the normative force transfers. Samuelson's point was precisely that: you can't derive an 'ought' from a limit theorem. You can't tell me I *should* maximize growth rate just because growth rate is elegant. Maybe I want to maximize the probability of reaching a specific goal, or minimize the time to reach it. Those are different optimization problems."

  "Okay," Elias said, holding up a hand. "Grant me the finite horizon. Grant me that you have specific liabilities. But you still need a benchmark. If you admit that wealth grows multiplicatively, then the geometric mean is the natural scale. When you say you're 'risk-averse,' what are you averse *relative to*? Usually, it's relative to the Kelly benchmark. People talk about 'half-Kelly.' Why half? Why not a fixed dollar amount? The fact that everyone in the know scales their bet size to their current bankroll suggests they implicitly accept the geometric structure. They're just hedging against edge uncertainty."

  "Edge uncertainty is the key," Mara seized on it. "We don't know the odds are exactly 60/40. That's the real world. If I assume the odds are 60/40 and bet full Kelly, and the true odds are 55/45, I'm overbetting. Overbetting Kelly is worse than underbetting. In fact, if you bet double Kelly, your expected growth rate drops to zero. You're ruined. So, prudent bettors bet fractionally. But notice: they aren't doing it because of ergodicity. They're doing it because of Bayesian uncertainty about the parameters. Expected utility theory absorbs that perfectly. I just widen my prior on the probability of heads, and my optimal bet size shrinks. I don't need to invoke 'geometric rationality' to justify being careful."

  "But the anchor remains," Elias insisted. "Your Bayesian update still maximizes expected *something*. If you maximize expected dollar value, you bet the house. If you maximize expected log wealth, you bet Kelly. If you maximize expected square-root wealth, you bet less. But log wealth is the only one that preserves the scale invariance of the problem. If we redenominate the currency, or if we look at the returns rather than the prices, the log utility is the only one that treats a 10% gain and a 10% loss as symmetric events in terms of information. It's the only utility function that matches the multiplicative nature of the market."

  "Symmetry of information isn't symmetry of pain," Mara said softly. "That's the crux. You keep talking about the market, about the math of the coins. But the bettor is a human. If I lose 10% of my net worth, I lose sleep. If I gain 10%, I feel... okay. Maybe I'm irrational. Maybe my utility function is 'wrong' by the standards of information theory. But decision theory is supposed to serve the agent, not the universe. If the universe says 'maximize growth' and I say 'I want to sleep at night,' expected utility says I'm allowed to choose sleep. Ergodicity economics says I'm making a mistake about the nature of time."

  "I'm saying you're making a mistake about the nature of *you*," Elias said. "Because 'you' tomorrow is funded by 'you' today. If you sacrifice growth now, you constrain your future self's options. Log utility is the only one that treats your future selves as equal partners in a coalition. Any other utility function discounts your future selves."

  "And any other utility function acknowledges that my future self might not exist if my present self goes bust," Mara shot back. "Or that my future self might value money less than my present self does. Diminishing marginal utility is real. The first million saves my life. The tenth million buys a nicer boat. Kelly treats the tenth million as equally vital as the first. That's not 'rationality.' That's a specific valuation of money that happens to align with compound interest."

  Elias sighed, leaning back. "So we're back to preferences. You think the geometric growth rate is just one flavor of risk aversion."

  "I think it's a very useful heuristic," Mara conceded. "I'll grant you that. For professional traders, for endowments, for entities that effectively have infinite horizons? Kelly is probably the right answer. Or close to it. But for a person? With a life? With a finite timeline? It's a tool, not a law. You can derive it from expected utility by choosing $U(W) = \ln(W)$. You don't need to overthrow Savage to do it."

  "But if you derive it from utility, you imply it's subjective," Elias said. "If I choose log, and you choose square root, we're just different. But if I derive it from ergodicity, I'm saying that if you choose square root, you are objectively leaving money on the table that you could have had without increasing your risk of ruin *in the long run*."

  "The long run," Mara repeated, picking up her coat. "The place where all mistakes are corrected because we're all dead."

  Elias laughed, finally reaching for his own coat. "Fair. But admit this: if you had to bet on that coin flip a thousand times, and you didn't care about the consumption path, only the final wealth... you'd bet Kelly."

  "If I didn't care about the path?" Mara stood up. "Then I'm not a person. I'm a portfolio. And for a portfolio, sure. Maybe you're right. But I'm not a portfolio."

  "And I'm not sure you can separate the two," Elias said, standing as well. "Not when wealth compounds."

  They walked toward the exit, the argument unresolved, hanging in the air between them like the unflipped coin that started it all.
