      *   Correct SPI logic: We modify the instructions so that the *new* equilibrium is better than the *old* equilibrium, and this holds robustly.
      *   Story angle: The "Poison Pill" clause. We tell our AI: "If you detect aggression, do not retaliate. Instead, execute Protocol Z." Protocol Z is costly for everyone but less costly than war. By removing retaliation, you remove the incentive for the other side to aggress.
      *   Okay, let's write.

      *Setting:* Orbital salvage rights.
      *   *Principals:* Vance (Orion) and Sato (Kepler).
      *   *Agents:* "Cursors" (autonomous salvage drones).
      *   *Conflict:* Derelict ship *The Icarus*.
      *   *Default:* Cursors fight -> Ship destroyed.
