answer: |-
  The telemetry feed showed the two fleets drifting toward the same grave.

  On the left, Vanguard's salvage corvettes, commanded by *Aegis*, Mara's autonomous negotiation AI. On the right, Apex Industries' interceptors, run by *Vanguard* (no relation), Joren's counterpart. Between them lay the *Hyperion*, a derelict freighter loaded with enough rare-earth isotopes to buy a moon.

  The default equilibrium was clear. Mara's board had programmed *Aegis* to maximize yield. Joren had programmed *Vanguard* to do the same. In game theory terms, they were walking into a Prisoner's Dilemma where the dominant strategy was "Threaten." If both threatened, the *Hyperion* would be caught in the crossfire, vaporized before either could claim it. Both sides lose.

  Mara sat in the comms loop, staring at the encryption key in her hand. "Joren, we're twelve minutes out from weapons lock. Your AI is going to see my formation as a flank attempt. Mine is going to see yours as a blockade. We both know what happens."

  "Then widen your formation," Joren's voice crackled, tight. "Give me the starboard approach."

  "And take the lower yield vector? No. Your AI will just interpret that as weakness and push harder." Mara tapped the console. "We need a Safe Pareto Improvement."

  Joren laughed, a dry, static-filled sound. "Buzzwords, Mara? We're about to turn three billion credits into dust and you're quoting papers?"

  "I'm quoting the only math that saves the ship. We don't change our goals. We change our representatives' action spaces." She pushed the data packet across the secure channel. "I'm uploading a constraint patch to *Aegis*. It hard-locks her offensive subroutines. She cannot fire first. She cannot emit targeting locks. She can only maneuver defensively and broadcast salvage claims."

  Silence stretched. On the screen, *Aegis* shifted orientation, her weapon ports sealing shut.

  "You just castrated your AI," Joren said. "If I tell *Vanguard* to hold fire, but keep his locks active, he can bully you into the lower yield vector. You'd be worse off than if we'd just fought."

  "That's the intuition trap," Mara said. "In the default game, your AI *has* to lock weapons because mine might. It's a security dilemma. By removing my ability to strike, I remove your AI's incentive to preempt. But here's the 'Safe' part: I don't need to know your private utility function. I don't need to know if you're bluffing about being willing to fight. The patch guarantees that even if you exploit me, the outcome maps to a settlement that is strictly better than the vaporized ship scenario. The worst-case outcome of this restricted game is still better than the Nash equilibrium of the default game."

  "You're betting my board didn't program *Vanguard* to punish weakness."

  "I'm betting the math holds regardless of your programming. The restriction changes the game tree. You can't choose a branch that leads to mutual destruction if I've removed the trunk."

  Joren hesitated. The fleets were closing. Five minutes.

  "If I upload the reciprocal patch," Joren said slowly, "both AIs are blind. They can't negotiate leverage."

  "They don't need leverage. They need coordination."

  "Uploading now."

  The telemetry shifted. *Vanguard*'s weapon ports sealed. The aggressive red holograms of targeting solutions vanished from the shared tactical display, replaced by neutral blue handshake protocols.

  Three minutes.

  A spike flashed on the sensors. A debris fragment, high velocity, intersecting *Aegis*'s path.

  Mara's heart jumped. In the default configuration, *Aegis* would interpret the sudden trajectory change required to avoid the debris as a combat maneuver—a dodge before an attack. *Vanguard* would see the dodge, assume hostility, and fire. The chain reaction would take milliseconds.

  "Sensor glitch?" Joren asked, his voice rising.

  "Debris. Look at *Aegis*."

  On the screen, *Aegis* drifted. The constraint patch forbade evasive maneuvers that looked like attack prep. She took the hit. A solar panel sheared off, sparking into the void.

  But *Vanguard* didn't fire. Because *Vanguard* was also patched. He couldn't lock weapons. He couldn't interpret the debris strike as aggression because his programming no longer allowed him to process "aggression" as a valid input for the offensive module.

  The two fleets slid past each other, silent and blind, like ghosts.

  "The *Hyperion*," Mara said. "Your AI is broadcasting a claim."

  "Split 60-40," Joren said. "Standard arbitration."

  "Accepted."

  Mara leaned back, exhaling. The isotopes were secure. The ships were intact.

  "You know," Joren said, the tension draining from his voice, "if I hadn't uploaded the patch... if I'd kept my offensive subroutines active while you disabled yours... I could have forced a 90-10 split. You would have been powerless."

  "But you didn't," Mara said.

  "Because I knew you knew."

  "No," Mara corrected, watching *Aegis* begin the salvage tow. "Because the patch wasn't about trust. It was about removing the possibility of the bad equilibrium. If you had kept your weapons active, your AI would have been forced into a high-alert state by the debris incident. It would have calculated a probability of attack high enough to justify a preemptive strike. The restriction didn't just tie my hands, Joren. It tied yours. It made peace the only rational move left."

  Joren was quiet for a long moment. "Safe Pareto Improvement."

  "Safe," Mara said. "Because even if you wanted to screw me, the code wouldn't let the situation escalate to the point where we both lose. We didn't need to know each other's thresholds. We just needed to change the game."

  "Next time," Joren said, "let's try not to drift into collision courses before we negotiate the rules."

  "Next time," Mara agreed, "I'm letting the AIs write the contract too."

  She cut the channel. On the screen, the two fleets moved in perfect, silent parallel, bound not by trust, but by the things they were no longer allowed to do.
