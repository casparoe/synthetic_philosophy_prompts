      *Wait, let's look at the Oesterheld/Conitzer paper logic again.*
      The core idea: Principals delegate to representatives. Representatives play a game. Principals can agree to modify the representatives' available strategies or utility functions. If they agree on a modification that leads to a SPI, they are better off. The "Safe" part means they don't need to know the other principal's private information (like how much they value war vs. peace) to know it's safe.
      *Narrative hook:* Vance is afraid Sato knows something he doesn't. Sato is afraid Vance is bluffing. The SPI removes the need for that knowledge.

      *Revised Plot:*
      1.  Vance and Sato have AIs negotiating a merger.
