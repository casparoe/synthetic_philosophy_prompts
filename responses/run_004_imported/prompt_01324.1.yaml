      *   *SPI:* Principal A & B agree -> Agent A ("Restricted"), Agent B ("Restricted"). Result: Cooperation/Better Equilibrium.
      *   *The "Safe" part:* The restriction must be designed such that even if the other side *doesn't* cooperate, you aren't worse off than the default. Or rather, the agreement itself ensures that the new equilibrium dominates the old one *without* needing to trust the other side's private info. Actually, the definition of SPI is slightly more nuanced: It's a modification of the game played by the representatives such that the outcome is Pareto superior to the default outcome *and* this holds robustly. The key narrative tension is trusting the *math* vs. trusting the *agent*.
      *   *Narrative Conflict:* One side wants to cheat the restriction. Or one side fears the restriction makes them vulnerable. The climax needs to show why the restriction was actually the shield, not the weakness.

  3.  **Brainstorming Settings:**
