      *   Actually, the "War over the Desert" example is strong. Let's stick close to that but make it corporate. Two logistics companies controlling a choke point.
      *   *Setting:* The Kessler Belt. Orbital debris clearing rights.
      *   *Agents:* "Adjusters" – automated tugs.
      *   *Default:* Push harder, claim more space. Risk: Collision, debris cloud everyone loses.
      *   *SPI:* Program the Adjusters to treat the space as a shared pool with a specific division rule, *and* remove the "ramming" option from their code.
      *   *Tension:* Kael thinks removing the ramming option makes Elena's tugs vulnerable to cheating.
      *   *Climax:* A glitch or unexpected event where a ramming move *would* have been triggered. Because both removed it, the disaster is averted.
      *   *The Twist:* The "Safe" part means Elena didn't need to know if Kael was bluffing about his aggression threshold. The math held regardless.

  6.  **Writing - Scene by Scene:**
      *   **Scene 1:** The Bridge. Tension. The AI (Rep) is ready to engage.
