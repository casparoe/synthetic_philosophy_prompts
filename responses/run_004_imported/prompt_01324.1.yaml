      *   Simplification for story: The Agents are about to play a Game of Chicken. The SPI is changing the game to one where "Swerve" is the only rational move for both, by removing the "Straight" option or making it impossible to verify who swerved.
      *   Better: The agents are given a *different* objective function that aligns incentives without requiring trust.
      *   Let's go with the "Surrogate Game" angle. The principals agree their agents will play a *different* game than the real one, but the outcomes map safely.
