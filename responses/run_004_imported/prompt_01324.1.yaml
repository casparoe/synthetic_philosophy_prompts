      *   **Scene 3:** The Doubt. Kael worries about exploitation.
      *   **Scene 4:** The Implementation. Code swap.
      *   **Scene 5:** The Test. An incident occurs. The restricted AI behaves differently than a standard maximizer would.
      *   **Scene 6:** The Realization. Kael understands why he wasn't exploited.

  7.  **Refining the Mechanic in Text:**
      *   Need to explain SPI without lecturing. Show, don't tell.
      *   Use the term "Surrogate Game" or "Safe Contract."
      *   Highlight that the restriction is *binding* on the agent, not the principal.
      *   The key line needs to be about how the restriction prevents the *other* side from having to defend themselves aggressively.

  8.  **Final Polish:**
      *   Check length. Keep it tight.
      *   Ensure the "Safe" vs. "Pareto" distinction is clear. It's not just "we both win," it's "we both win *even if* things go wrong."
      *   Make sure the climax hinges on the *restriction* specifically.

