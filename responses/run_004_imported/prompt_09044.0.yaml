answer: |-
  # The Corpse in the Logic Gate: Why Decision Theory Must Die in Damascus to Live

  Death in Damascus is not merely a puzzle; it is a stress test for the metaphysics of agency. While Newcomb's Problem forces Causal Decision Theory (CDT) to swallow a counterintuitive pill (one-boxing), it at least offers CDT a comfort blanket: the dominance argument. In Newcomb's, two-boxing *always* yields more money than one-boxing, holding the box contents fixed. CDT can point to dominance and say, "I know I lose, but I was rational." In Death in Damascus, Gibbard and Harper stripped that blanket away. There is no dominance. Staying is better only if Death is in Aleppo; fleeing is better only if Death is in Damascus. Since Death's location is a perfect function of your choice, CDT enters an infinite feedback loop: if you lean toward staying, you should flee; if you lean toward fleeing, you should stay.

  This instability is why Damascus is the graveyard of CDT. It reveals that CDT is not a theory of rational choice, but a theory of local causal interventions that fails when the environment contains a mirror. To navigate this, we have three contenders: the Ratifiability patch (CDT's surrender), Evidential Decision Theory (EDT's fatalism), and the Functional/Logical approach championed by Levinstein and Soares (FDT's dissolution).

  Here is the verdict: **Ratifiability is a mathematical band-aid on a bullet wound, EDT is correct only by accident, and Functional Decision Theory (FDT) is the only framework that correctly diagnoses the pathology of the problem.** However, the true takeaway from Levinstein and Soares is not that FDT saves you, but that it reveals the "Perfect Prediction" premise to be incoherent for a non-deterministic agent. If you want to survive Death in Damascus, you don't need a better decision theory; you need a better random number generator.

  ### The CDT Collapse and the Ratifiability Surrender

  Standard CDT dies in Damascus because it treats the prediction as a fixed past event independent of the current decision. It calculates $P(\text{Death in Damascus})$ as independent of $P(\text{I Stay})$. But in this setup, they are perfectly correlated. When CDT realizes this, it oscillates.

  The standard patch is **ratifiability** (or deliberational equilibrium). An act is rational only if, conditional on your decision to perform it, it remains the most preferred option. In Damascus, neither "Stay" nor "Flee" is ratifiable. If you decide to Stay, you know Death is in Damascus, so you wish you had Fled. The only stable point is a **mixed strategy**: a 50/50 randomization. This makes the expected probability of Death 0.5, rendering both options equally (un)attractive.

  This solution is intellectually bankrupt. It turns a decision problem into a game-theoretic Nash equilibrium against Nature. It implies that rationality requires you to become a casino. But more damningly, it assumes the predictor cannot predict the *mix*. If Death is a perfect predictor, Death predicts you will randomize 50/50. Does Death then go to Damascus 50% of the time? If so, you still die 50% of the time. But if Death predicts the *output* of your randomization (because the universe is deterministic), the mix doesn't help. Ratifiability saves CDT from inconsistency only by assuming the agent has access to a source of randomness that the predictor cannot model. If the predictor is truly perfect, the mix is an illusion, and CDT is just dressing up its failure in probability distributions.

  ### EDT's Fatalist Resignation

  Evidential Decision Theory (EDT) does not oscillate. It conditions on the action: $P(\text{Death in Damascus} | \text{Stay}) \approx 1$. Since the prediction is perfect, the conditional probability of death given any action is 1. The expected utility of staying is 0 (minus cab fare). The expected utility of fleeing is 0 (minus cab fare). EDT tells you to stay put and save the money.

  EDT is stable, but it is stable like a corpse. It treats the correlation between your choice and Death's location as brute evidence, ignoring the *mechanism* of the correlation. It offers no account of agency; it simply observes that in this world, actions are symptoms of fate, not causes of survival. EDT gets the "right" answer (indifference/stay) only because it accepts the premise that the future is already written in the past. It is a theory for observers, not actors. If there were even a 1% chance your decision could break the prediction, EDT would fail to seize it, because it treats the correlation as fixed evidence rather than a logical link to be exploited.

  ### The FDT Dissolution: Cheating the Setup

  This brings us to Functional Decision Theory (FDT) and the analysis by Levinstein and Soares ("Cheating Death in Damascus"). FDT treats your decision not as a physical intervention, but as the output of a logical function. Death predicts the output of your decision function $f(\text{info})$.

  FDT agrees with EDT that if the predictor is perfect regarding the *output*, you are doomed. If $f(\text{info}) = \text{Stay}$, Death is in Damascus. If $f(\text{info}) = \text{Flee}$, Death is in Aleppo. There is no causal lever to pull because the prediction is logically prior to the action in the same way $2+2=4$ is prior to writing "4" on a page.

  However, Levinstein and Soares identify the crack in the armor. The coherence of the puzzle depends entirely on *what* is being predicted.
  1.  **Prediction of Action:** If Death predicts the specific token action, and the agent is deterministic, the agent dies.
  2.  **Prediction of Algorithm:** If Death predicts the algorithm, and the algorithm includes a **private true random number generator (RNG)** that is physically inaccessible to Death, Death cannot predict the token action. Death can only predict the *distribution*.

  If the agent implements an FDT-style policy that says, "If predicted, randomize," and that randomization relies on physical noise Death cannot access, the "Perfect Prediction of Action" premise becomes false. Death can predict the *probability* of your action, but not the action itself. In this scenario, the agent can achieve a survival rate higher than the deterministic baseline by exploiting the gap between algorithmic prediction and token execution.

  CDT fails here because it treats the randomization as a "choice" separate from the causal past, without recognizing that the *disposition* to randomize is what gets predicted. EDT fails because it treats the correlation as immutable evidence. FDT succeeds because it recognizes the decision as a logical substrate that can be engineered to resist prediction *if* the physics allows.

  ### The Verdict

  Here is the position to take to the meetup, poured neat:

  **Causal Decision Theory is fundamentally broken in the presence of logical correlation, and its ratifiability patch is a confession of defeat.** By resorting to mixed strategies, CDT admits it cannot recommend a determinate action, reducing rationality to equilibrium-finding in a game against a mirror. It fails to distinguish between a world where Death predicts your *disposition* versus your *action*.

  **Evidential Decision Theory is practically correct but philosophically cowardly.** It tells you to stay, which saves the cab fare, but only by accepting fatalism. It cannot distinguish between a world where you are doomed and a world where you could have broken the prediction with a better algorithm. It treats the agent as a thermometer reading the future, not a thermostat setting it.

  **Functional Decision Theory (and the Levinstein & Soares analysis) is the only winner.** It wins not because it guarantees survival in the strict Gibbard & Harper setup (where you die), but because it correctly identifies *why* you die and where the escape hatch lies. FDT reveals that "Perfect Prediction" is not a monolithic constraint. It is a claim about the computational relationship between predictor and agent.

  The verdict is this: **In a world of perfect predictors, "choice" is a logical illusion unless you possess private randomness.** If you are deterministic, FDT and EDT agree: you die, and staying saves money. If you have access to private randomness, FDT dictates you use it to break the prediction, while CDT randomizes blindly and EDT resigns itself to death.

  Therefore, **FDT is the superior theory** because it is the only one that treats the decision procedure as the object of optimization. CDT tries to optimize the *action* in a vacuum; EDT optimizes the *news*; FDT optimizes the *algorithm*. In Damascus, the algorithm is all you have. If your algorithm is deterministic, Death wins. If your algorithm includes private noise, you cheat. CDT doesn't even realize there's a difference.

  So, when someone brings up Death in Damascus, tell them this: The puzzle isn't about whether to go to Aleppo. It's about whether you believe your mind is a closed logical system. If it is, pack your bags for the morgue. If it isn't, FDT is the only map that shows the exit. CDT is just a eulogy.
