prompt: |-
  I've been TAing an intro decision theory seminar, and last week we spent an entire session on updateless decision theory (UDT), Counterfactual Mugging, and why an updateless agent supposedly does better in expectation by refusing to condition on the information it currently has. Half the students left the room looking personally victimized by Omega. Afterward a few of us went out for drinks and tried to one-up each other with UDT-related humor, and honestly the bar was not high, but nobody managed anything I'd actually call good.

  So: write me a joke that turns on the specific weirdness of updateless decision theory — the way it commits ex ante to policies rather than updating on realized information, the tension with "just do what's best given what you now know," and the whole Counterfactual Mugging flavor of "pay up even though you already know the coin didn't go your way." I want the punchline to depend on someone actually getting what makes UDT different from causal or evidential decision theory, not just be a generic joke about philosophers or Omega. A little dark or deadpan humor is fine.
