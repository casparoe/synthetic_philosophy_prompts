answer: |-
  A UDT student and a CDT TA walk into a bar after seminar. The bartender, who is wearing a name tag that just says "Ω," slides a coin across the counter.

  "Flip was already done," Ω says. "Heads, you pay $100 for the round. Tails, I give you $10,000. But I only give the $10,000 if I predict you would have paid the $100 even if I told you the coin came up Heads."

  Ω flips the coin over. It's Heads.

  The UDT student immediately pulls out a crisp $100 bill and slams it on the bar.

  The TA grabs their wrist. "Don't do it. The coin is already down. You get nothing. Paying changes nothing in *this* world."

  The student pushes the money forward. "I'm not optimizing for *this* world. I'm optimizing for the policy."

  "The policy is 'give money to strangers with coins,'" the TA says. "In this branch, that policy has a negative payout."

  "If I update on the coin flip," the student says, staring intensely at the Heads, "then I'm the kind of agent who conditions on realized information. And if I'm that kind of agent, Omega doesn't give me the $10,000 in the Tails branch."

  "You aren't in the Tails branch!" the TA snaps. "You're here. You're broke. And you're buying me a drink I didn't win."

  The student signals for the tab. "Ex-post, I'm broke. Ex-ante, I'm a millionaire."

  "Ex-ante we aren't at the bar yet!"

  "Exactly," the student says, taking a sip of the beer they just paid for. "So technically, I'm not drinking this. I'm just simulating the consumption to maintain correlation with the version of me who is currently depositing a check."

  The TA sighs and orders a water. "Put it on his tab. He's rich in expectation."

  "Actually," the student corrects, "I'm updateless. I don't know where I am. But I know my algorithm is solvent."

  "Your algorithm is currently overdrafted," the TA says.

  "No," the student replies, watching the bartender pocket the cash. "I just paid the subscription fee for living in a universe where I don't have to look at the coin."
