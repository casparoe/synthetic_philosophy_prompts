  2.  **Deconstruct UDT/Counterfactual Mugging:**
      *   *The Setup:* Omega flips a coin. If Heads, Omega asks for $100. If Tails, Omega gives $10,000 *if and only if* Omega predicts you would have given $100 had the coin been Heads.
      *   *The Twist:* You find out the coin came up Heads. You have to pay $100. You get nothing.
      *   *The UDT Logic:* You don't update on the coin flip. You act as if you are choosing the policy *before* the flip. If your policy is "Pay if Heads," you get the $10k in the Tails world (which counts for your expected utility calculation). If your policy is "Don't Pay," you get nothing in the Tails world. Since the expected utility of "Pay" > "Don't Pay" ex-ante, you Pay ex-post, even though it feels like a loss.
      *   *The Tension:* Causal Decision Theory (CDT) says "Don't pay, the coin is already Heads, paying changes nothing." UDT says "Pay, because the version of you in the Tails world needs you to be the kind of person who pays."
      *   *Key Concept:* Ignoring current information to optimize across possible worlds.

  3.  **Brainstorming Scenarios:**
