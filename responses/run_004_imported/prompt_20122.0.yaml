      *   *Stronger Verdict:* Hume's system *does not* fully hang together logically if viewed as a policy prescription for permanent growth. He *is* smuggling in a mercantilist intuition (more money = more power) that his own PSFM undermines. However, he saves it by shifting the focus from *stock* to *velocity/industry*.
