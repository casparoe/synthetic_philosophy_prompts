answer: |-
  **The Veil and the Valve: Why Hume's Monetary Theory Does Not Hang Together**

  David Hume is often credited with delivering the coup de grâce to mercantilism, replacing the fetishization of gold with a sophisticated understanding of price levels and trade balances. Yet, a close reading of his economic essays, particularly *Of Money* and *Of the Balance of Trade*, reveals a fissure in his logic. Hume attempts to walk a tightrope between a classical long-run neutrality of money and a mercantilist short-run activism. While many interpreters charity his work as a pioneering distinction between short-run and long-run effects, a rigorous analysis suggests otherwise. Hume's monetary economics do not hang together as a coherent system. By advocating for a continuously increasing money supply to stimulate industry while simultaneously describing a mechanism that makes such an increase impossible to sustain, Hume smuggles in a mercantilist policy preference that his own Price-Specie-Flow Mechanism (PSFM) logically kills off.

  To understand the contradiction, one must first acknowledge the sophistication of Hume's long-run theory. In *Of Money*, Hume articulates a clear Quantity Theory of Money. He argues that money is not wealth itself but merely "the oil which renders the motion of the wheels more smooth and easy." In the long run, the absolute quantity of specie in a nation is irrelevant to its real prosperity. If a country doubles its money supply overnight, prices will simply double, leaving real wages, employment, and output unchanged. This is the principle of monetary neutrality. It is a devastating critique of the mercantilist core belief that hoarding gold equates to national power. Hume correctly identifies that real wealth consists of commodities and labor, not the tokens used to exchange them.

  However, Hume immediately undermines this neutrality with his famous theory of the "interval." He argues that while the *level* of money doesn't matter, the *change* in money does. When new gold enters a country (via mines or trade surplus), it does not instantly raise all prices. Instead, it falls into the hands of merchants and manufacturers first. These actors, seeing higher nominal revenues before costs rise, expand production and hire more labor. Hume writes, "it is only in this interval or intermediate situation, between the acquisition of money and rise of prices, that the increasing quantity of gold and silver is favourable to industry." Here, Hume departs from neutrality. He suggests that inflation is functionally useful because it tricks merchants into expanding activity. Consequently, he advises the "good politician" to keep the money supply increasing, lest the economy stagnate.

  This is where the tension arises. If the goal is to maintain this stimulative "interval," the money supply must grow continuously. But in *Of the Balance of Trade*, Hume outlines the PSFM, which dictates that continuous growth in the money supply is structurally impossible for a single nation. The mechanism is automatic: if a country accumulates more specie than its "fair share" relative to its output, domestic prices will rise. Higher prices make exports uncompetitive and imports attractive. The resulting trade deficit causes the excess specie to flow out of the country until prices equalize with trading partners. The system is self-correcting. As Hume famously puts it, trying to hoard money is like trying to raise the water level of one part of the ocean above the rest; the water simply flows back to a level plane.

  The contradiction is stark. In *Of Money*, Hume prescribes a continuous increase in specie as a remedy for economic lethargy. In *Of the Balance of Trade*, he describes a system where any surplus specie is automatically expelled. If the PSFM holds true, the "interval" Hume prizes is not a sustainable policy target but a fleeting transient state. A politician cannot "keep it increasing" because the market will relentlessly correct the accumulation through price rises and outflows. To maintain the stimulus, the government would need to prevent prices from rising or prevent the outflow of specie—precisely the mercantilist interventions Hume's trade theory argues are futile and harmful.

  Defenders of Hume might argue that he is not advocating for artificial inflation but rather for monetary growth that matches industrial expansion. If the economy grows, it can absorb more money without inflation, thus keeping the "interval" open without triggering the PSFM outflow. This charitable reading suggests Hume is describing endogenous money growth. However, this contradicts the text of *Of Money*. Hume explicitly attributes the stimulus to the *acquisition* of money from external sources (like the Spanish mines) entering the system *before* industry expands. He posits the money as the cause, not the effect, of the industrial awakening. He relies on the lag between money entering and prices rising to generate the profit margin that spurs industry. If the money supply only grows *after* industry expands, the stimulative lag disappears. Hume needs the money to lead, but his trade theory says leading money will flee.

  Therefore, Hume is indeed smuggling in a mercantilist assumption. He cannot fully relinquish the intuition that a plenitude of money is inherently empowering, even after he has theoretically demonstrated that it is not. He wants the benefits of the mercantilist worldview (active state promotion of money accumulation) without the costs (trade wars and economic distortion). He attempts to square the circle by claiming the accumulation is only good *temporarily*, but since his own trade mechanism ensures the temporary state cannot be maintained by policy, the advice to the "good politician" is vacuous. You cannot build a long-term strategy on a short-term anomaly that your own economic laws say will self-correct.

  Ultimately, Hume's inconsistency is historically understandable but logically fatal. He was a transitional figure standing between the mercantilist past and the classical future. He needed the Quantity Theory to debunk the idea that money *is* wealth, but he needed the "interval" argument to explain why money *matters* for growth. He failed to reconcile the two. The Price-Specie-Flow Mechanism acts as a valve that releases the pressure Hume tries to build in *Of Money*. Consequently, Hume's monetary economics do not hang together. He successfully described the automatic mechanisms of the market, but he could not bring himself to trust them completely, retaining a policy prescription for money accumulation that his own theory proved impossible to sustain.
