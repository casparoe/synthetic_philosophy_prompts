      *   *Final Decision:* I will argue that Hume is **inconsistent**. He attempts to reconcile a classical long-run neutrality with a mercantilist short-run activism, but the Price-Specie-Flow Mechanism ultimately renders the short-run stimulus unattainable as a sustained policy goal. He wants the benefits of inflation without the costs, while his own trade theory says the costs (outflow) are inevitable.

