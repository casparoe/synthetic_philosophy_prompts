answer: |-
  Here is a case designed to drive a wedge between Epistemic Contextualism and Pragmatic Encroachment (Subject-Sensitive Invariantism), followed by an analysis of why the standard bank cases fail to do so.

  ### The Case: The Third-Party Foreclosure

  **The Subject (Hannah):**
  Hannah needs to deposit a paycheck into her bank account by tomorrow morning (Saturday). If the deposit does not clear by Monday, her mortgage payment will bounce, leading to immediate foreclosure on her home. This is an extremely **high-stakes** situation for Hannah.
  *   **Evidence:** Hannah was at the bank two weeks ago on a Saturday. It was open. She saw the hours posted on the door (9:00 AM – 12:00 PM). She has not checked the website or called the bank since then.
  *   **Epistemic Position:** Her evidence is decent for ordinary matters, but given the catastrophic consequences of being wrong, most intuitively feel she ought to verify the hours again (e.g., call the bank) before relying on them.

  **The Attributor (John):**
  John is a casual acquaintance of Hannah. He is planning a casual meet-up with Hannah at the bank tomorrow to catch up. John is **unaware** of Hannah's mortgage situation. To John, the meeting is low-stakes; if the bank is closed, they will just get coffee elsewhere.
  *   **Conversational Context:** John is speaking to a friend in a relaxed setting. The possibility that the bank might have changed its hours is not salient in John's conversation. No one is discussing errors, fraud, or changing schedules.
  *   **The Attribution:** John says, **"Hannah knows the bank will be open tomorrow."**

  ---

  ### The Verdicts

  #### 1. Epistemic Contextualism (EC)
  **Verdict: The attribution is TRUE.**

  *   **Reasoning:** Standard Attributor Contextualism (e.g., DeRose, Cohen) holds that the truth conditions of "knows" are determined by the **context of the speaker (attributor)**, specifically the salience of error possibilities in that conversation.
  *   **Application:** In John's conversational context, the stakes are low, and the possibility that the bank hours have changed is not salient. Therefore, the epistemic standard semantically attached to the word "knows" in John's mouth is **low**.
  *   **Conclusion:** Relative to this low standard, Hannah's evidence (being there two weeks ago) is sufficient. Therefore, John's statement "Hannah knows..." is true in his context, even though Hannah is in a high-stakes situation.

  #### 2. Pragmatic Encroachment / Subject-Sensitive Invariantism (PE/SSI)
  **Verdict: The attribution is FALSE.**

  *   **Reasoning:** PE/SSI (e.g., Stanley, Fantl & McGrath) holds that the truth conditions of "knows" are invariant regarding the speaker's context but **vary according to the subject's practical environment (stakes)**. Knowledge requires a level of justification that is proportional to what is at stake for the subject.
  *   **Application:** Hannah is in a high-stakes situation (foreclosure). This raises the epistemic threshold required for her to count as "knowing." Her current evidence (a visit from two weeks ago) is insufficient for this high threshold; she needs stronger evidence (e.g., a phone call) to rule out the error possibility given the stakes.
  *   **Conclusion:** Because Hannah does not meet the heightened justificatory bar required by her stakes, she does not know. Therefore, John's statement "Hannah knows..." is false, regardless of how casual John's conversation is.

  ---

  ### Why the Standard Bank Cases Do Not Distinguish the Views

  The standard bank cases (like those used by Keith DeRose) typically involve a **first-person attribution**. In these cases, the Subject is also the Attributor. Hannah says, "I know the bank is open."

  In this first-person setup, the **Subject's Stakes** and the **Attributor's Context** rise and fall together.
  1.  **Low Stakes:** Hannah has nothing to lose. Her stakes are low. Simultaneously, because her stakes are low, error possibilities are not salient to her, making her *conversational context* low-standards.
      *   **EC:** Low context standards $\rightarrow$ She Knows.
      *   **PE/SSI:** Low subject stakes $\rightarrow$ She Knows.
      *   **Result:** Agreement.

  2.  **High Stakes:** Hannah faces foreclosure. Her stakes are high. Simultaneously, because the stakes are high, the possibility of error becomes salient to her, making her *conversational context* high-standards.
      *   **EC:** High context standards $\rightarrow$ She Does Not Know.
      *   **PE/SSI:** High subject stakes $\rightarrow$ She Does Not Know.
      *   **Result:** Agreement.

  Because the standard bank cases conflate the *subject's practical situation* with the *attributor's conversational context*, both theories predict the same shift in knowledge attributions (from "I know" to "I don't know"). They are extensionally equivalent in the first-person case.

  To distinguish them, as shown in **The Third-Party Foreclosure Case** above, one must separate the variables: we need a scenario where the **Attributor's Context** is low (keeping EC standards low) while the **Subject's Stakes** are high (raising PE/SSI standards). Only in this third-person divergence do the theories deliver opposite truth values for the same knowledge claim.
