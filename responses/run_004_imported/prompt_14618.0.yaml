      *   Specify evidence? Yes (Past visit).
      *   Specify stakes? Yes (Foreclosure vs Casual).
      *   Specify context? Yes (John's casual chat).
      *   Explain verdicts? Yes.
      *   Explain Bank Case limitation? Yes.

      *(Self-Correction during drafting)*: I should acknowledge that not *all* contextualists agree on third-party cases (some say subject's context matters), but the standard "Attributor Contextualism" (DeRose, Cohen) says the *speaker's* context determines the semantic content. I will stick to standard Attributor Contextualism for the contrast.

      *(Refining the "Why Bank Cases Don't Work" section)*: This is a key philosophical point. In the standard case, the subject is the speaker. So Subject Stakes = Attributor Stakes (roughly). Both theories predict the same shift. The divergence only happens when Speaker $\neq$ Subject.

