answer: |-
  This is a fantastic exchange, and it makes perfect sense that it's sticking with you. You are currently inhabiting a very specific intellectual space: the transition from "practitioner who uses tools" to "philosopher who examines the tools' foundations." Deborah Mayo's work, in particular, is designed to induce exactly the kind of productive squirming you're feeling. She argues that valid inference requires knowing not just what the data *are*, but how they *got there* (the sampling distribution), which is precisely what optional stopping obscures.

  Here is an evaluation of the five moves, keeping in mind that "winning" in statistics often depends on which framework (frequentist, Bayesian, or error-statistical) you privilege.

  ### Move 1: Ingrid's Practice
  > *Ingrid mentioned... in her new lab they check the data every ten or so subjects and stop as soon as p dips below .05.*

  **Evaluation:** **Descriptively honest, methodologically vulnerable.**
  Ingrid gets points for transparency here; many researchers do this and don't admit it. However, by framing it as "stopping when $p < .05$," she has planted a flag in frequentist territory. She is using a frequentist metric ($p$-value) to make a decision. If she were truly operating in a Bayesian framework, she would be monitoring a posterior probability or a Bayes Factor, not a $p$-value. By invoking the $p$-value, she invites frequentist critique.
  *   **Verdict:** Neutral start, but she has set herself up for Move 2 by mixing frameworks.

  ### Move 2: Marcus's Frequentist Objection
  > *Marcus pounced: that's "optional stopping," and it's well known that peeking and stopping the moment you hit significance inflates your true false-positive rate way past 5%...*

  **Evaluation:** **Mathematically Correct (within Frequentism).**
  Marcus is technically right. In the frequentist framework, a $p$-value is calculated based on the sampling distribution of the test statistic *under the null hypothesis*. That sampling distribution changes if the sample size is a random variable determined by the data itself (i.e., stopping when significant). If you ignore the peeking, the calculated $p$-value is smaller than the true probability of such an extreme result occurring by chance.
  *   **Verdict:** **Marcus wins this move.** If you use $p$-values, you must account for the stopping rule to maintain the error rate claim. Ingrid cannot have it both ways.

  ### Move 3: Ingrid's Bayesian Defense
  > *Ingrid said... the likelihood/stopping-rule principle says your evidence... depends only on the likelihood of the data you actually got, not on whatever rule made you stop collecting it -- so peeking is a problem for frequentists, not for her.*

  **Evaluation:** **Theoretically Sound, Contextually Inconsistent.**
  Ingrid is reciting the Likelihood Principle (LP) correctly. For a strict Bayesian, the stopping rule is indeed irrelevant *provided the model and priors were fixed in advance*. The evidence is in the likelihood function of the observed data.
  *However*, she contradicts Move 1. She cannot claim Bayesian immunity while reporting $p$-values. A $p$-value is *defined* by the sampling plan (including stopping rules). If she wants to use the LP to defend her stopping rule, she needs to report Bayesian metrics (posteriors/Bayes Factors), not $p$-values. If she reports $p$-values, she is speaking the language of error rates, where Marcus is right.
  *   **Verdict:** **Draw/Weak Win for Ingrid (on theory only).** She is right about Bayesian theory, but she is committing a category error by applying it to $p$-values.

  ### Move 4: Marcus's "Garden of Forking Paths" Rebuttal
  > *Marcus said fine... but that's exactly the catch: nobody's stopping rule is the only flexible thing in a real analysis... optional stopping is just one researcher degree of freedom among several...*

  **Evaluation:** **Pragmatically Strong.**
  This is Marcus's strongest punch. The Likelihood Principle assumes the *model* is fixed. In practice, researchers often tweak models (covariates, transformations, outliers) while peeking. If a Bayesian peeks at the data and then adjusts their priors or model structure to fit what they see, the LP no longer protects them. The "auditability" problem is real: without knowing the stopping rule *and* the model-building path, you cannot assess the severity of the test. Marcus correctly identifies that celebrating the LP solves a "toy" problem (fixed model, pure stopping) while ignoring the "real" problem (flexible modeling).
  *   **Verdict:** **Marcus wins.** He moves the debate from abstract theory to scientific practice, where Ingrid's theoretical defense offers little shelter.

  ### Move 5: The Disclosure and Asymmetry Exchange
  > *Ingrid replied that this is a completely general point about disclosure... Marcus's comeback was that there's still an asymmetry: the whole culture of pre-registered stopping boundaries... grew up around frequentist error control...*

  **Evaluation:** **Ingrid is descriptively right; Marcus is normatively right.**
  Ingrid is correct that a frequentist can lie about pre-registration just as easily as a Bayesian can hide their peeking. Human dishonesty is framework-agnostic.
  However, Marcus lands the better philosophical point regarding *incentive structures*. Frequentist inference *mathematically requires* knowledge of the stopping rule to validate the error rate. Therefore, the framework itself generates a normative demand for transparency (pre-registration, alpha spending). Bayesian inference, *on its own theoretical terms* (via the LP), does not require the stopping rule to be known for the posterior to be valid. Therefore, Bayesian philosophy provides less *internal* pressure to disclose stopping intentions. Marcus is right that the "accountability machinery" is a native species of the frequentist ecosystem, whereas Bayesians have to import it for sociological reasons, not mathematical ones.
  *   **Verdict:** **Marcus wins.** He identifies a structural difference in how the two philosophies generate (or fail to generate) requirements for transparency.

  ---

  ### Important Considerations Neither Raised

  Since you are reading Deborah Mayo, there are three nuances missing from this debate that she would likely highlight. These might help resolve your unease.

  **1. The "p-value" vs. "Bayes Factor" Confusion**
  The biggest hole in Ingrid's argument is the one I noted in Move 3. She is trying to use a Bayesian shield to protect a frequentist sword.
  *   If she reports **$p$-values**, she *must* account for optional stopping (Marcus is right).
  *   If she reports **Bayes Factors**, she *can* ignore optional stopping (Ingrid is right), *but* she must ensure she didn't tweak the model/priors based on the peeking (Marcus is right about the "researcher degrees of freedom").
  *   **The Missing Point:** You cannot mix them. If her lab stops based on $p < .05$, they are optimizing for frequentist error rates. Claiming Bayesian immunity is a "have your cake and eat it too" fallacy.

  **2. Severity vs. Long-Run Error Rates (The Mayo Perspective)**
  Marcus argues from the standpoint of "long-run error control" (Type I error rates). Mayo argues from the standpoint of **Severity**.
  *   For Mayo, the problem with optional stopping isn't just that it messes up the long-run average false positive rate. It's that it renders the specific claim **unsevere**.
  *   If you peek and stop, you have used a method that would very likely produce a "significant" result even if the hypothesis were false. Therefore, the data do not provide a severe test of the hypothesis.
  *   **Why this matters:** It shifts the focus from "following the rules to keep the error rate at 5%" (which can feel like legalistic box-ticking) to "did we actually probe the claim rigorously?" This aligns with your intuition that something feels wrong about the practice, beyond just the math.

  **3. Transparency > Registration**
  Both Ingrid and Marcus focus on *pre-registration* as the solution.
  *   **Missing Consideration:** Pre-registration is often a blunt instrument. A more robust solution (increasingly common in open science) is **transparency of the analysis pipeline**.
  *   If Ingrid's lab posted their raw data and code, a reader could see exactly when they stopped and run a correction. If they used Bayesian methods, readers could see if the priors were shifted.
  *   **The "Audit" Argument:** Marcus worries about auditability. The solution isn't necessarily pre-registration (which can be faked, as Ingrid noted), but rather open data and code which makes the "forking paths" visible post-hoc. This satisfies Marcus's need for accountability without requiring Ingrid to abandon sequential analysis entirely (provided she corrects for it or uses Bayesian metrics appropriately).

  ### Summary
  *   **Marcus** has the better of the argument overall, primarily because Ingrid is using $p$-values while claiming Bayesian immunity. Within the framework she is actually using (frequentist NHST), Marcus is mathematically correct.
  *   **Ingrid** lands good points about the universality of dishonesty (Move 5), but she fails to recognize that her framework choice dictates her accountability requirements.
  *   **For you:** Your "squirming" is well-founded. Mayo would tell you that the "black box" use of $p$-values you practiced for 30 years was often insufficiently severe because the stopping rules and model choices were rarely scrutinized. The move toward transparency (open data/code) and severity (asking "how likely was this result if the claim were false?") is the right direction, regardless of whether you label it Bayesian or Frequentist.
