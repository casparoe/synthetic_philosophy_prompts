      *   **Sexual Selection (SS):** He invented SS specifically to solve this. In *The Descent of Man*, he argues for female choice. He explicitly states females have a "taste for the beautiful." He resists the idea that this taste is *itself* adaptive in a survival sense; it's often aesthetic.
