answer: |-
  It is a pleasure to speak with someone who actually understands the Kolmogorov axioms from the inside out. Your intuition is spot-on, and you have put your finger on the single most persistent objection to the classical Dutch Book Argument (DBA) in formal epistemology.

  In the literature, this is known as the **Pragmatic/Epistemic Gap**. As you noted, the classical DBA (de Finetti, Ramsey) demonstrates that incoherent credences lead to *pragmatic* failure (sure loss of utility). But epistemology is ostensibly about *truth*, *justification*, and *evidence*, not about protecting your wallet from a cunning bookie. As Patrick Maher and Alan Hájek have argued, showing that I am a bad gambler does not necessarily show that my *beliefs* are unjustified. I might simply have no interest in betting.

  Since the late 90s, the dominant move to close this gap has been **Accuracy-Based Epistemology**, spearheaded by Jim Joyce. This is likely the "depragmatized" argument you recall.

  Here is how the accuracy argument works, followed by an evaluation of whether it actually solves your problem or just relocates the burden.

  ### The Accuracy Argument (Joyce 1998)

  Jim Joyce's strategy in *"A Nonpragmatic Vindication of Probabilism"* is to replace **money** with **accuracy**.

  In Bayesian data analysis, you are familiar with loss functions. In philosophy, we treat the "truth" as a target. If a proposition $A$ is true, its truth value is 1; if false, 0. Your credence $c(A)$ is an estimate of that truth value.

  **1. The Measure of Inaccuracy**
  We need a way to measure how "far" a credence is from the truth. The standard measure is the **Brier Score** (which you likely know as squared error loss).
  For a single proposition $A$, the inaccuracy $I(c, A)$ is:
  $$ I(c, A) = (c(A) - v(A))^2 $$
  Where $v(A)$ is 1 if $A$ is true and 0 if $A$ is false.
  *   If $A$ is true and $c(A)=1$, inaccuracy is 0.
  *   If $A$ is true and $c(A)=0.8$, inaccuracy is $0.04$.
  *   If $A$ is false and $c(A)=0.8$, inaccuracy is $0.64$.

  **2. The Dominance Theorem**
  Joyce proves a mathematical theorem analogous to the Dutch Book theorem, but regarding accuracy rather than money.
  *   **Theorem:** If a credence function $c$ violates the probability axioms (is incoherent), there exists an alternative credence function $c^*$ that satisfies the axioms (is coherent) such that $c^*$ is **strictly more accurate** than $c$ in every possible world.
  *   Conversely, if $c$ is coherent, no other function dominates it in this way.

  **3. The Normative Premise**
  The argument relies on a dominance principle regarding epistemic utility:
  *   *If belief state $B^*$ is guaranteed to be more accurate than belief state $B$ regardless of how the world is, then it is epistemically irrational to hold $B$.*

  **The Result:** Incoherent credences are epistemically irrational because they are **accuracy-dominated**. You could have had beliefs that were closer to the truth in every possible scenario, but you didn't.

  ### Does This Close the Gap?

  This moves the discussion from "Don't lose money" to "Don't be inaccurate." For a scientist, this usually resonates much more deeply. However, philosophers generally agree that it does not *fully* close the gap; rather, it moves the controversy to the justification of the **Epistemic Utility Function**.

  Here are the three main lingering issues you should be aware of:

  #### 1. Why Accuracy? (The Teleological Gap)
  The DBA relied on the assumption that you want to maximize money (pragmatic utility). The Accuracy Argument relies on the assumption that you want to minimize squared distance from truth (epistemic utility).
  *   **Objection:** Why is accuracy the sole goal of belief? Some argue that belief aims at knowledge, or understanding, or explanatory power, which might not align perfectly with probabilistic accuracy.
  *   **Defense:** Joyce argues that belief is a representational state, and the fundamental norm of representation is accuracy. But this is a substantive philosophical claim, not a logical necessity.

  #### 2. Why the Brier Score? (The Measure Sensitivity)
  The dominance theorem holds for a class of measures called **strictly proper scoring rules**. The Brier score is one, but so are others (like the Log Score).
  *   **The Problem:** Different proper scoring rules can sometimes yield different results regarding which coherent credence function is "best" or how we should update.
  *   **The "Why Squared?" Question:** Why is the penalty for error quadratic? Why not linear (absolute error)? If you use absolute error $|c(A) - v(A)|$, the dominance theorem **fails**. Incoherent credences are not necessarily dominated under linear loss.
  *   **Implication:** The argument for probabilism secretly depends on the assumption that epistemic disutility is convex (risk-averse regarding truth). If you think being "a little wrong" is fine but "very wrong" is catastrophic, you get Probabilism. If you think error scales linearly, you might not. Justifying the convexity of epistemic loss is non-trivial.

  #### 3. The "Ought Implies Can" Problem
  In your work in astrophysics, you treated probabilities as tools for inference. In philosophy, we ask if agents have voluntary control over credences.
  *   If I *cannot* help but have incoherent credences (perhaps due to cognitive limitations), does it make sense to call me irrational?
  *   The Accuracy Argument suggests that incoherence is a structural flaw in the *state* itself, regardless of how you got there. This is a shift from *procedural* rationality (did you follow the right steps?) to *evaluative* rationality (is the state optimal?).

  ### An Alternative: Cox's Theorem

  Since you come from physics, you might find **Cox's Theorem** (1946) more satisfying than Joyce, though it has its own philosophical baggage.

  Cox didn't talk about betting or accuracy. He asked: *If we want to represent degrees of plausibility using real numbers, and we want those representations to be consistent with classical logic, what mathematical rules must they follow?*
  *   He posited functional consistency requirements (e.g., the plausibility of $A \land B$ should depend on the plausibility of $A$ and the plausibility of $B$ given $A$).
  *   He derived that any system satisfying these consistency constraints must be isomorphic to the probability axioms.

  **The Gap Here:** Cox's theorem is often criticized for assuming what it wants to prove (the functional forms are somewhat arbitrary). However, it avoids the "pragmatic" label entirely. It frames probabilism as a requirement of **logical consistency** for extended logic. For a scientist, this often feels like the "right" justification: Probability is the logic of science (Jaynes' view). The counter-argument is that logic applies to truth values, not degrees of belief, and bridging that gap requires its own justification.

  ### Summary: Where the Debate Stands

  To answer your specific question: **No, the depragmatized arguments do not fully close the gap, but they move it to a place that is much more palatable to scientists.**

  1.  **Classical DBA:** Irrationality = Prudential Failure (Losing Money).
      *   *Gap:* I don't care about money.
  2.  **Joyce's Accuracy Argument:** Irrationality = Epistemic Failure (Being Inaccurate).
      *   *Gap:* Why is squared-error the metric of epistemic virtue?
  3.  **Cox/Jaynes:** Irrationality = Logical Inconsistency.
      *   *Gap:* Why must degrees of belief follow the algebra of logic?

  **My assessment:**
  For someone with your background, the Accuracy Argument is usually the stopping point. The assumption that "epistemic rationality involves minimizing expected inaccuracy" is essentially the philosophical formalization of what you did for 30 years in astrophysics: you chose estimators that minimized risk/loss functions to get the best map of reality.

  The Dutch Book argument shows that incoherence makes you a **sucker**.
  The Accuracy argument shows that incoherence makes you a **liar** (in the sense that your map systematically deviates from the territory more than it needs to).

  Most contemporary formal epistemologists (like Rachael Briggs, Richard Pettigrew, and Hannes Leitgeb) now work within the Accuracy framework precisely because it respects the intuition that epistemology is about truth, not gambling. However, Alan Hájek (in *"Still Missing"*) remains a prominent skeptic, arguing that any representation theorem (pragmatic or accuracy-based) ultimately relies on normative premises that are just as contestable as the conclusion.

  If you want to dive deeper into the "depragmatized" literature, **Jim Joyce's 1998 paper** is the seminal text, but **Richard Pettigrew's *Choice and Chance in Normative Epistemology*** (2016) is the modern book-length treatment that rigorously explores the choice of accuracy measures. Given your background, you'll likely find Pettigrew's treatment of scoring rules very familiar territory.
