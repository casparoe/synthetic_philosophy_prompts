      *   *Nuance:* Bring in the "Trading Cycle" example specifically (A vs B, B vs C, C vs A) or the "Incomplete A vs B" example. The incomplete one is better for this specific debate (A incomparable to B, but willing to swap for a penny). Let's use the "Incomplete A vs B" pump.
      *   *Refining the "Relocation" point:* Jamie argues that at the moment of refusal, the agent prefers (Keep A) < (Swap to B + penny). To refuse is to act against preference. Alex argues that the preference *is* (Stick to Plan).
