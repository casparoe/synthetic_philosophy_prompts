      *   *The Myopia Objection:* The pump only works if the agent is myopic (doesn't see the future trades).
      *   *The Resolute Choice Defense:* A sophisticated agent sees the sequence. At $t_0$, they commit to a path. They don't trade at $t_1$ because they know it leads to a loss at $t_2$.
      *   *The Hardliner Counter (Jo's point):* Resolute choice requires *dynamic inconsistency*. At $t_1$, your current preferences say "Trade!" (because you prefer the new option + penny). To stay resolute, you must act against your *current* preferences. This is irrational (akrasia) or implies you actually *did* have a meta-preference all along (completeness restored).
      *   *The Defender Counter:* Preferences aren't just momentary rankings. They are policies. Acting on a policy isn't acting against preferences; it's acting on a higher-order preference structure that doesn't need to be complete over atomic outcomes.

