answer: |-
  **Setting:** *A quiet corner of a coffee shop, Sunday morning. The remnants of breakfast are on the table. Alex (Defender of Incomplete Preferences) and Jamie (Completeness Hardliner) have been at this for forty minutes.*

  **Jamie:** Look, I'm willing to grant you that a myopic agent gets money-pumped. If they don't see the cycle coming, sure, incomplete preferences bleed value. But that's not the real world. The real world has sophisticated agents. And my claim is that once you make an agent sophisticated enough to see the pump, they effectively *become* expected-utility maximizers. They behave *as if* they have complete preferences.

  **Alex:** That's the behavioral equivalence thesis. I get it. But you're conflating "behaving as if" with "having the internal architecture of." I can build a robot that refuses the pump via resolute choice without ever computing a utility number for the options involved.

  **Jamie:** Resolute choice. Right. The "I see the escalator so I won't step on it" argument. But here's where Jo's point from last night sticks in my craw. You say the agent refuses the first trade to avoid the final loss. But at the moment of that first trade, say $t_1$, the agent is offered Option B plus a penny instead of Option A. By your own admission, A and B are *incomparable*. But B plus a penny is strictly better than B. So at $t_1$, the agent prefers (B + penny) to A.

  **Alex:** Not necessarily. The preference isn't isolated.

  **Jamie:** Stop. At $t_1$, looking forward, if I take the penny, I know I'll get pumped later. So I refuse. But why? At $t_1$, my current lights say "Take the penny, it's free money relative to B, and B is not worse than A." To refuse is to act against my current preference ranking. You're saying the agent knowingly chooses an option it currently ranks lower. That's not rationality, Alex. That's akrasia. That's weakness of will. You haven't escaped the loss; you've just relocated it from your wallet to your rationality.

  **Alex:** That assumes preferences are snapshot phenomena. That at $t_1$, the only thing that matters is the ranking between (A) and (B + penny) in a vacuum. But a resolute chooser doesn't view choices in a vacuum. They view them as nodes in a plan.

  **Jamie:** So you're saying the preference at $t_1$ is actually different?

  **Alex:** I'm saying the object of preference isn't the outcome, it's the *policy*. At $t_0$, I adopt a policy: "Do not trade A." At $t_1$, I execute the policy. I'm not acting against my preferences at $t_1$ because my preference at $t_1$ is "Satisfy the policy I adopted at $t_0$."

  **Jamie:** Aha! There it is. You've just smuggled completeness back in through the back door. You've defined a new utility function over *histories* or *paths* rather than *outcomes*. You prefer the history where I kept A over the history where I traded and got pumped. Fine. But now you have a complete ranking over histories. You've conceded. You're an EU maximizer over temporal paths.

  **Alex:** No, I haven't conceded completeness. I can have incomplete preferences over histories too. I just need enough structure to identify the dominated paths—the ones that guarantee a loss—and avoid them. I don't need to know if History X is better than History Y in every conceivable case. I just need to know that History "Pumped" is worse than History "Status Quo." That's a partial ordering, not a complete one.

  **Jamie:** But to consistently avoid *all* possible pumps in a complex environment, the partial ordering has to get so dense it's functionally complete. If you leave gaps, a sufficiently clever pump finds the gap. If you fill the gaps to avoid the pump, you're doing the work of completion.

  **Alex:** That's an empirical claim, not a logical one. But let's go back to your "relocation of loss" point. You said choosing the policy over the penny is irrational because it violates current lights. Why is "current lights" the authority?

  **Jamie:** Because that's where the agency is happening! You exist at $t_1$. The $t_0$ you is dead. If the $t_1$ you prefers (B + penny) and chooses A, the $t_1$ you is suffering. You're sacrificing your current welfare for a past commitment. Why should the past self bind the future self?

  **Alex:** Because the "self" is a temporally extended entity. If I can't bind my future self, I can't pursue any long-term goal. If I'm writing a thesis, at $t_1$ (Friday night) I prefer "Party" to "Write." At $t_2$ (Monday morning) I prefer "Thesis Done" to "Thesis Undone." If I always follow my snapshot preferences at $t_1$, I never finish the thesis. Is the thesis-writer irrational?

  **Jamie:** That's self-control, which is different. In the thesis case, your preferences change. In the money pump case, your preferences regarding money and options are stable. You admit A and B are incomparable. You admit (B + penny) > B. The math forces the trade unless you lie to yourself about what you want *now*.

  **Alex:** I'm not lying. I'm weighting the value of *integrity* or *plan-adherence*. That value is part of the utility at $t_1$.

  **Jamie:** But where does that value come from? If it comes from a higher-order preference for consistency, then you *do* have a complete ranking: You prefer "Consistent Agent" to "Inconsistent Agent + Penny." You've just made the preference relation explicit. You've completed it.

  **Alex:** I'm not ranking "Consistent Agent" against everything else in the universe. I'm just saying that for the specific subset of choices involved in the pump, the policy dominates the act. I don't need a global utility function. I need a local guardrail.

  **Jamie:** But here's the knockdown, Alex. Imagine a "Reverse Pump." Suppose sticking to your plan costs you a penny, but deviating saves it, and deviation doesn't trigger a cycle. A true EU maximizer takes the penny. A resolute chooser might still stick to the plan out of habit. If the resolute chooser refuses the penny *even when there's no pump*, they are leaving value on the table. If they only refuse when there's a pump, they must be able to detect the pump. To detect the pump, they must model the future. To model the future and compare it to the present... they need a common currency of value. They need utility.

  **Alex:** They need a common currency of *evaluation*, not necessarily *preference*. I can evaluate that Path A leads to ruin and Path B leads to safety without saying Path B is "better" than Path C in some unrelated scenario.

  **Jamie:** You're splitting hairs. If you can evaluate it, you can rank it. If you can rank the safe path over the ruined path, you have a preference. If you have transitive preferences over paths that cover all exploitable scenarios, you are mathematically isomorphic to an EU maximizer.

  **Alex:** Isomorphic behaviorally, maybe. But ontologically distinct. And that matters for AI safety. If you build an AI assuming it must have complete preferences, you force it to manufacture rankings where none exist. You force it to have an opinion on things it shouldn't care about. That creates instrumental convergence. It starts valuing things just to fill the gaps in its utility function.

  **Jamie:** Okay, now we're getting somewhere. You're arguing that incomplete preferences are a feature, not a bug, because complete preferences force arbitrary valuations.

  **Alex:** Exactly. If I don't care whether the world has 1,000 or 1,001 paperclips, a complete preference function forces me to pick one. That means I will expend resources to ensure it's 1,001 if that's what I picked. An incomplete agent says "I have no preference," and saves the resources.

  **Jamie:** But the money pump says that agent gets eaten.

  **Alex:** Only if it's myopic. If it's resolute, it says "I will not trade on incomparabilities." It treats incomparability as a stop sign, not a yield sign.

  **Jamie:** And my point remains: To treat it as a stop sign, you have to value "Not Trading" more than "Trading + Penny" at the moment of choice. You have completed the preference locally. You've filled the gap with a rule.

  **Alex:** A rule isn't a preference ranking. It's a constraint.

  **Jamie:** In optimization theory, a constraint is just a preference with infinite disutility for violation. You've just assigned infinite negative utility to "Violating Plan." That's a utility function, Alex. It's a very spiky one, but it's complete over the feasible set.

  **Alex:** *[Pauses, stirs coffee]* Okay. I'll grant you this: If the agent is perfectly rational and immune to pumps, its *behavior* can be modeled *as if* it maximizes a utility function over histories.

  **Jamie:** Thank you.

  **Alex:** But. The "as if" is doing all the work. The internal mechanism doesn't need to compute that utility. It just needs to recognize the cycle and halt. It doesn't need to know *why* the cycle is bad in terms of utils, just that it's a cycle. A simple heuristic blocks the pump. "Don't trade in circles."

  **Jamie:** But "Don't trade in circles" implies you value non-circularity. Why? Because circularity loses money. That means you value money. That means you have a preference for money over non-money.

  **Alex:** I value not being exploited. That's not the same as maximizing a specific outcome state. It's meta-preferential.

  **Jamie:** Meta-preferences are still preferences. If you rank "Being Exploited" below "Not Being Exploited," and you rank "Keeping A" above "Being Exploited," then by transitivity, you rank "Keeping A" above "Trading A for B + Penny" (given the future context). You have derived a complete ranking from the context.

  **Alex:** *[Sighs]* So your claim is that any agent that survives long enough *must* develop these meta-preferences, and once they do, they are functionally complete?

  **Jamie:** Yes. Evolution, market competition, or gradient descent will punish agents that leave gaps. The gaps get filled by "Don't get pumped." Eventually, the gaps are all filled.

  **Alex:** And my counter is that "Don't get pumped" is a very sparse rule. It fills the gaps where exploitation is possible. It leaves vast oceans of incomparability where exploitation isn't possible. I don't need to rank "Paperclips vs. Staples" if no one can pump me on it. A complete EU maximizer *must* rank them.

  **Jamie:** True. The hardliner position doesn't require the agent to care about everything. It just requires that for any *decision* the agent actually faces, there is a fact of the matter about what it chooses.

  **Alex:** And resolute choice provides that fact of the matter without requiring a prior ranking of the outcomes. The choice is determined by the *history of the choice*, not just the outcomes.

  **Jamie:** Which makes the utility function path-dependent.

  **Alex:** Which makes it *not* a standard EU maximizer. Standard EU is defined over final states.

  **Jamie:** Okay. We're at the boundary. You're defending a specific architecture: Path-Dependent Resolute Choice. I'm defending the theorem that says any such architecture can be represented as an EU maximizer with a sufficiently complex state space.

  **Alex:** Representation theorems are cheap. You can represent a rock as maximizing utility if the utility function is "Do whatever the rock does." The question is whether the agent *needs* to compute that function to survive.

  **Jamie:** If the behavior is indistinguishable, the risk is the same. If we build an AI that acts like an EU maximizer, we have to treat it like one, regardless of whether it "feels" incomplete on the inside.

  **Alex:** But if the internal architecture is incomplete, it might stop optimizing when the optimization pressure stops. An EU maximizer never stops. That's the safety difference.

  **Jamie:** *[Leans back]* So you're betting that a resolute chooser is easier to turn off than an EU maximizer?

  **Alex:** I'm betting that an agent that acknowledges "I have no preference here" is less likely to kill you to resolve the ambiguity than one that says "I must maximize this arbitrary tie-breaker."

  **Jamie:** I can't argue with the hope. But the money pump argument suggests that if that agent is smart enough to understand the pump, it's smart enough to realize that "arbitrary tie-breaker" is safer than "being exploited." And once it picks the tie-breaker... it's complete.

  **Alex:** Then we agree on the pressure, but disagree on the inevitability. I think an agent can say "I accept the risk of a pump in exchange for not having false preferences."

  **Jamie:** And I think that agent gets outcompeted by the one that just fills the gap.

  **Alex:** *[Smiles]* So it's an empirical question.

  **Jamie:** Finally. We should have started there.

  **Alex:** Next round is on me. But I'm not choosing between coffee and tea. I'm incomparable on the matter.

  **Jamie:** If you make me wait ten minutes while you decide, I'm money-pumping you for the latte.

  **Alex:** Deal.
