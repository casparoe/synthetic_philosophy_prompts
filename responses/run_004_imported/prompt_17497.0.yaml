      *   **Specific Lens:** Not the pop-culture "Übermensch" caricature, but the physiological Nietzsche of *Ecce Homo* ("Why I Am So Clever"), *Genealogy of Morals* (Ascetic Ideal), and his letters/correspondence regarding diet, health, and digestion.
      *   **Key Question:** Is it a technology of self-mastery (clearing static for higher creation) or a narcotic (anesthetizing a drive rather than disciplining it)?
      *   **Constraint:** Pick a side and argue for it, grounding the case in his stated commitments.

  2.  **Deconstruct Nietzsche's Physiological Philosophy:**
