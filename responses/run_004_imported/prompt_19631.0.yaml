prompt: |-
  For my philosophy of religion seminar we just spent two whole lectures on Gödel's ontological argument, the modal one with all the wierd axioms about "positive properties" (like, being God-like is positive, positive properties are closed under entailment, that kind of thing). Right at the end our professor mentioned almost as a throwaway comment that there's this "modal collapse" objection, apparently first raised by Jordan Howard Sobel, which shows that if you accept Gödel's own axioms you can actually derive that every true proposition is necessarily true — so there'd be no genuine contingency in the world at all, not even about which shirt I put on this morning. A classmate said some guy named Anderson tried to patch the axioms to avoid this back in the 90s, but that even his fix apparently runs into similar worries, though I havent looked into that closely myself.

  Everyone in my study group basically treated modal collapse as the objection that kills the whole argument dead, case closed, and honestly my first instinct was to agree with them. But I kind of want to stress-test that instinct before I just repeat it in my paper. Could you write me the strongest possible case a defender of Gödel's argument could make that modal collapse does NOT actually sink the proof or its theological payoff, even granting that the collapse genuinely follows from the axioms? I don't want a wishy-washy "here's both sides" answer, I want you to fully commit to the defense and bite whatever bullets are needed (maybe embracing necessitarianism isn't as crazy as it sounds, or whatever route you think is actually strongest). Basically treat it like a debate assignment where you're stuck defending a position regardless of what you personally find plausible, so go all in.
