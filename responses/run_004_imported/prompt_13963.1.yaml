answer: |-
  # Archaeology, Not Cartography: A Case for Qualified Representational Realism

  You have identified the central friction in modern mechanistic interpretability: the oscillation between treating neural network features as discovered *organs* (real, causal, independent) and treating them as imposed *grids* (useful fictions, observer-dependent). This is not merely a semantic quibble; it is a metaphysical dispute about the ontology of artificial minds.

  The deflationary view argues that because activation space is mathematically continuous and rotatable, any "feature" we isolate is just a slice we chose to make. The realist view argues that because intervening on these features changes behavior causally, they must be functionally real.

  Here is the verdict: **The realist position is correct, but only under a specific condition.** Features and circuits count as genuine representations if and only if they satisfy a criterion of **Causal-Functional Privilege**. The deflationist is right that we can impose arbitrary maps on a model, but wrong to conclude that *all* maps are equally arbitrary. Some maps correspond to the model's actual computational "cleavage planes." The Othello case does not undermine this realism; it refines it. It shows that representations are determined by the model's *goals*, not the observer's *intuitions*.

  To defend this, we must tackle the two philosophical hurdles you raised: the "usage" requirement and the basis-dependence problem.

  ### The Usage Requirement: Why Steering Matters

  The philosophical demand you encountered—that a state is only a representation if the system *uses* it downstream—is a version of **Functional Role Semantics**. It insists that a pattern in the activations is not a representation of a "Golden Gate Bridge" just because a human can train a probe to read it out (decodability). It is only a representation if the model itself reads that pattern to generate its output (causal usage).

  This is where the deflationary view often trips up. It treats the model as a black box where we project meaning onto the outputs. But the "bridge feature" experiments do more than decode; they intervene. When researchers artificially amplify a specific direction in activation space and the model begins to hallucinate the bridge, claim to be the bridge, or refuse to leave the bridge, they are demonstrating **causal leverage**.

  If the feature were merely a correlate—a side effect of the real computation—clamping it high would likely break the model or have no effect. Instead, it steers the model coherently. This implies that downstream layers are actively "reading" that specific direction to inform their processing. The feature is not just a shadow on the wall; it is a gear in the machine.

  Therefore, the "usage" criterion is satisfied by causal intervention. The bridge feature is a genuine representation because it is a **causal bottleneck**. The model relies on that specific vector to coordinate its behavior regarding bridges. This moves the finding from "we can find a pattern" to "the system uses this pattern."

  ### The Othello Challenge: Basis Dependence and Reality

  However, the causal argument hits a wall when we consider the **Basis Dependence Problem**, which your Othello example illustrates perfectly. In a high-dimensional vector space, there are infinite ways to define a coordinate system. If I can rotate the space and find a different set of "features" that are equally mathematically valid, why is the "Golden Gate Bridge" direction more real than any other random combination of neurons?

  In the Othello case, a probe for "absolute color" (is this square black?) fails. A probe for "relative state" (is this square occupied by *my* piece?) succeeds. The deflationist argues: "See? The representation depends on how you look. There is no single 'board state' in the model, only the one you managed to find."

  This argument conflates **observer-dependence** with **arbitrariness**.

  Consider the physical concept of *velocity*. Velocity is not an intrinsic property of an object; it is relative to a reference frame. A train moves at 100 km/h relative to the ground, but 0 km/h relative to a passenger. Does this mean velocity is "just a map we impose" and not physically real? No. It means velocity is a **relational property**. The physics is real, but it is defined by the relationship between objects, not by a single absolute frame.

  The Othello model works the same way. The model was trained to predict legal moves. To do this, it does not need to know the absolute color of the pieces (which is irrelevant to the rules); it needs to know the *affordances* (which moves are available to the current player). The "relative state" representation is not an artifact of the researcher's probe; it is an artifact of the **loss function**. The training objective *forced* the model to represent the board in terms of playable moves, not visual colors.

  When the researcher finds the "relative" probe, they are not imposing a map; they are acting as an **archaeologist**. An archaeologist might brush dirt off a pot and say, "Look, a handle." A deflationist might say, "You only see a handle because you were looking for one. If you looked at the clay atoms, there is no 'handle,' only silicon and oxygen."

  This is true but trivial. The "handle" is real at the *functional level of analysis*. The Othello model's failure to represent absolute color proves that the model has a **determinate ontology**. It *determinately* represents relative state and *determinately* does not represent absolute color. If representations were purely imposed by the observer, the absolute color probe should have worked just as well if the researcher tried hard enough. The fact that it *failed* shows the model has structure that resists our projections.

  ### The Sparsity Constraint: Finding the Cleavage Planes

  The remaining deflationist objection concerns Sparse Autoencoders (SAEs). Even if the Othello model has a "relative" representation, isn't the SAE basis still chosen by us? We impose a "sparsity penalty" to force the model to explain its activations using few features. Isn't that just forcing a grid onto a cloud?

  This is the strongest version of the deflationary argument. However, it relies on the assumption that the "cloud" is uniform. If the activation space were a uniform fog, any sparse basis would be arbitrary. But if the activation space has structure—like a crystal—then there are **privileged bases**.

  Imagine a diamond. You can mathematically describe its atomic lattice using any coordinate system you like. But if you try to cut the diamond, it will only split cleanly along specific **cleavage planes**. If you strike it elsewhere, it shatters unpredictably.

  SAE features are the cleavage planes of the neural network. We impose a sparsity constraint, yes, but that constraint only yields stable, interpretable features if the model *already* computes using sparse, local concepts. If the model were truly a dense, entangled soup, the SAE would fail to find features that steer cleanly. The fact that SAE features *do* steer cleanly (as seen in the bridge case) suggests that the sparsity was latent in the model's computation all along. We didn't invent the cleavage planes; we found the angle that reveals them.

  ### The Verdict: Qualified Functional Realism

  So, where does this leave us? We must reject the "Hard Realism" that treats features like immutable Platonic forms, but we must also reject the "Hard Deflationism" that treats them as mere observer artifacts.

  **The Verdict:** Features and circuits are **genuine representations** if they satisfy two conditions:
  1.  **Causal Isolation:** Intervening on the feature produces a specific, semantic change in behavior (steering works).
  2.  **Task-Alignment:** The feature aligns with the computational demands of the model's objective function (like the Othello relative state).

  When these conditions are met, the feature is not "just a map." It is a **functional organ**.

  The deflationist is correct that *not every direction* in activation space is a representation. Most are noise. The realist is correct that *some directions* are causally privileged. The inconsistency you noticed in the literature arises because researchers sometimes speak about the *mathematical technique* (which is imposed) and sometimes about the *causal mechanism* (which is discovered).

  You asked for a side. I side with the **Realist**, but with a crucial caveat: **Representations are real relative to the system's computational ecology, not relative to human language.**

  The "Golden Gate Bridge" feature is real not because the model has a concept of San Francisco tourism, but because that vector is a causal lever the model uses to coordinate token predictions associated with that cluster of concepts. The Othello model's "relative board" feature is real because it is the minimal information structure required to solve the game.

  This is not a "reasonable people disagree" situation. The deflationary view collapses under the weight of causal intervention. If features were merely maps we imposed, we could not use them to steer the model with such precision. You cannot steer a car by shouting at a map of the road; you steer it by turning the wheels. When we turn the "feature wheels" and the car turns, we have found the mechanism.

  The inconsistency you feel is the growing pain of a field moving from **cartography** (drawing maps of the loss landscape) to **anatomy** (dissecting the causal machinery). The maps are ours; the anatomy is the model's. Interpretability has graduated from the former to the latter. We are not drawing lines on a blank slate; we are tracing the nerves of a new kind of mind.
