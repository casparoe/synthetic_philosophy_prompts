      *   *The "Principled" Move:* Higher-level properties (like "being a gene" or "being water") can be functionally defined. If they are functionally defined, they can be reduced to their physical realizers *in context*. This makes them causally efficacious *in virtue of* the physical realizer doing the work, but we can still talk about them as causes because they pick out the relevant physical structure.
