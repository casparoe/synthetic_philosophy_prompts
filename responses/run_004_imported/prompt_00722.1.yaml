answer: |-
  A Neoclassical Economist and Herbert Simon are walking through a field when they come across Buridan's Ass, starving to death between two identical bales of hay.

  The Economist shakes his head. "Tragic. Without a utility differential, rational choice is undefined. He has no preference gradient. He'll perish from paralysis."

  Simon walks up to the donkey and asks, "What's your aspiration level?"

  The Ass brays weakly, "Survival."

  Simon points to the left bale. "Does that meet the threshold?"

  "Yes."

  "Then eat it."

  The Ass takes a bite. It's dry, moldy straw. "This doesn't meet my aspiration level for 'Good Meal'."

  Simon shrugs. "Then lower the bar. Your new aspiration level is 'Not Dead'."

  The Economist interrupts, horrified. "But you haven't evaluated the second bale! What if it has 0.01% more nutrients? You're leaving utility on the table!"

  Simon watches the Ass finish the hay and walk away. "Correct. But unlike your model, mine accounts for search costs."

  **"Yours is still calculating the global maximum. Mine is already digesting."**
