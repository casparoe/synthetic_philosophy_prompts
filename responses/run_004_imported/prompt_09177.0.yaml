      *   *Tone Check:* Ensure I don't sound condescending to the user (who is also an amateur) while maintaining the persona of a rigorous TA grading a student. The user asked for "don't go easy."
      *   *Formatting:* Make sure the JSON is at the very end and clearly demarcated.

  7.  **Final Polish:** (Mental check of the JSON structure)
      *   Keys need quotes.
      *   No trailing commas.
      *   Escape characters if needed (none expected).

      *(Self-Correction during drafting)*: I should make sure to validate the "turning cotton into a bird" line. Ghazali does say God *could* do it, but he emphasizes God's *Habit* (adah). The student says "only ever an accident." That's slightly imprecise (it's not random chance, it's Divine Will following a Habit), but acceptable for intro level. I will note this in the comments.

      *Final Grade Decision:* B+ (87/100 range). It's excellent work for intro, but the Hume section is where the points come off for a rigorous grader.

      *Wait, one more thing:* The user mentioned they are an amateur too. I should briefly validate their instinct that "stuff here is easy to get subtly wrong." It builds rapport.

