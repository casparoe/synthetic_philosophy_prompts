      *   The "acausal" part of acausal trade refers to the *exchange mechanism*, not just the inability to receive payment.
      *   In acausal trade, the *trade* happens without causal contact. In the carbon case, the *benefit* is delivered causally, but the *return* is impossible. That's just a gift, not a trade.

