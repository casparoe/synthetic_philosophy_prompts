prompt: |-
  Getting engaged has apparently turned me into a person who reads sociology papers at 1am, so here's what's been rattling around my head. My partner and I just got engaged, and my sister (who means well but has Opinions) keeps quoting that "40-50% of marriages end in divorce" stat at us like it's a settled fact we should be scared of. So I went down a rabbit hole trying to find "the real number," and it turns out that just makes things worse, not better: there's data broken down by whether couples lived together before marrying, by age at marriage, by education level, by whether it's a first or second marriage, by whether your own parents divorced, and every combination gives a noticeably different percentage — I've seen everything from under 20% to well over 40% depending on which boxes you check. We happen to check some boxes that point one way (late twenties, both got degrees, together four years already) and at least one that points the other way (both sets of our parents divorced, which is a fun coincidence to discover mid-research spiral).

  So when my sister says "you two have like a 40% chance," and I want to counter with "no, more like 20% for people actually like us," is one of us simply right and the other wrong, or is there something fishy about the whole question? Like, is there an actual principled way to figure out which combination of factors is the "correct" one to use for a specific couple, or does the number just keep changing forever as you add more true facts about us (age, degrees, how long we dated, our parents, our jobs, the city we live in...) with no natural place to stop? I can't decide if this is a normal statistics problem that has a real answer I'm just not equipped to find, or if "the probability that we specifically will get divorced" is somehow less well-defined than it sounds, no matter how much data you throw at it. Curious what you think is actually going on here.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user recently got engaged. Their sister keeps citing the "40-50% divorce rate" statistic to warn them.
      *   **Action:** The user researched the statistic and found it varies wildly based on demographics (cohabitation, age, education, parents' divorce, etc.).
      *   **Conflict:** Sister says ~40%. User thinks ~20% based on their specific demographics (late 20s, degrees, long relationship) but acknowledges a risk factor (parents divorced).
      *   **Core Question:** Is one of us right/wrong? Is there a "correct" combination of factors? Or is the question itself ("probability *we* specifically will get divorced") ill-defined/problematic? Is this a normal stats problem or something deeper?
      *   **Tone:** Intellectual, curious, slightly anxious (1am sociology paper reading), looking for clarity/philosophical grounding rather than just reassurance.

  2.  **Deconstruct the Statistical Problem:**
      *   **Reference Class Problem:** This is the heart of the issue. To assign a probability to a single event (this specific marriage), you need a reference class (a group of similar marriages). But which class? Age? Education? Location? Personality? Astrology? The more specific the class, the smaller the sample size, until eventually, the class contains only *you*, and then probability becomes meaningless (it's either 0 or 1).
      *   **Population vs. Individual:** Statistics describe populations, not individuals. A 20% risk means 20 out of 100 *similar* couples divorce. It doesn't mean *this* couple has a 20% "divorce force" acting on them.
      *   **Dynamic vs. Static:** Marriage isn't a dice roll at the altar. It's a dynamic process. The probability changes based on actions taken *during* the marriage, not just pre-existing conditions.
      *   **Causation vs. Correlation:** Many of these factors (parents divorced, education) are correlates, not direct causes. They signal risk, but they don't determine fate.

  3.  **Address the Sister vs. User Debate:**
      *   **Sister:** Using a broad, outdated, or aggregate statistic. It's useful for general societal awareness but poor for individual prediction.
      *   **User:** Using a more refined reference class. Better, but still subject to the "infinite regress" of adding more variables.
      *   **Verdict:** Neither is "right" in a deterministic sense. The user's number is *more informative* but still not a "truth."

  4.  **Formulate the Philosophical/Statistical Explanation:**
      *   **Name the Phenomenon:** Explicitly identify the **Reference Class Problem** (Hans Reichenbach). This gives the user the terminology they were looking for.
      *   **Explain the Limit:** As you narrow the class (add variables), sample size drops. As you broaden it, relevance drops. There is no "God's eye view" number.
      *   **The "Single Case" Issue:** Probability is fundamentally about frequency in repeated trials. A specific marriage is a *n-of-1* event. It either happens or it doesn't.
      *   **Agency:** Unlike radioactive decay, humans have agency. The probability isn't fixed; it's influenced by the couple's behavior.

  5.  **Drafting the Response (Iterative Process):**

      *   *Opening:* Validate the 1am sociology spiral. It's a common and intelligent reaction. Congratulate them.
      *   *The Core Concept:* Introduce the **Reference Class Problem**. This is the specific statistical/philosophical concept that answers "does the number keep changing forever?" (Yes, essentially).
      *   *Why the Sister is Wrong (Sort of):* The 40-50% stat is often outdated or aggregate. It's the "base rate," but ignoring specific features is the Base Rate Fallacy.
      *   *Why the User is Also Stuck:* Narrowing the class helps, but you hit a wall. Sample size becomes too small. Plus, interaction effects (how variables combine) are hard to model.
      *   *The "Truth" about Probability:* Distinguish between *epistemic probability* (uncertainty due to lack of knowledge) and *aleatory probability* (inherent randomness). Marriage is mostly the former.
      *   *The Agency Factor:* This is crucial. Marriage isn't a lottery ticket. It's a garden. The stats are about *past* couples who may not have had the same tools/knowledge.
      *   *Actionable Advice:* How to talk to the sister? How to think about the stats? Focus on risk *factors* vs. risk *destinies*.

  6.  **Refining the Tone:**
      *   Keep it empathetic but analytical.
      *   Avoid empty reassurance ("You'll be fine!").
      *   Focus on intellectual clarity ("Here's why the math doesn't work the way you think").
      *   Use the user's specific details (parents' divorce, education) as examples.

  7.  **Key Points to Hit:**
      *   Reference Class Problem.
      *   Base Rate Fallacy.
      *   Sample Size issues.
      *   Agency/Dynamics vs. Static Prediction.
      *   Conclusion: The number is a tool, not a prophecy.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer if one is right? *Answer:* No, the question is ill-posed.
      *   *Check:* Did I address the parents' divorce factor? *Answer:* Yes, mention it as a risk factor, not a sentence.
      *   *Check:* Is the tone appropriate? *Answer:* Needs to be respectful of the anxiety but firm on the math.

  9.  **Final Polish:** Ensure the distinction between "predicting a population" and "predicting an individual" is clear. (This leads to the "actuarial vs. clinical" prediction distinction often used in psychology).

  **(Self-Correction Note):** I should make sure not to get *too* technical with Bayesian statistics, but the concept of updating priors is relevant. I'll stick to the Reference Class Problem as the main anchor.

  10. **Final Output Structure:**
