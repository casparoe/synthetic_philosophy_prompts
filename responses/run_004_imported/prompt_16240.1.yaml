          *   *Weakness:* Ignores ex-ante incentives.

      *   **Move (2) Ines:** Backwards explanation. The rescue happened *because* the snowmobiler believed Owen would pay. Payment validates the trust that saved him.
          *   *Theory:* Evidential Decision Theory (EDT) / Ex-ante rationality / Trust dynamics. The act of paying is evidence of the type of person who gets rescued.
          *   *Strength:* Explains the causal mechanism of the rescue itself. Without the expectation of payment, no rescue.
          *   *Weakness:* Doesn't fully address the "why pay *now* if the rescue is done?" objection directly, relies on counterfactuals.

      *   **Move (3) Marcus:** Concedes it was good to *seem* like a payer in the snow. But intention vs. action can be decoupled. Intend to pay -> Get rescued -> Change mind. Outcome is the same (Owen lives, keeps money).
          *   *Theory:* Time Inconsistency / Dynamic Inconsistency. The "Lie" strategy.
          *   *Strength:* Highlights the potential for exploitation if enforcement is impossible.
          *   *Weakness:* Assumes the snowmobiler can't detect the lie (which Ines challenges next). Assumes the "Lie" strategy is available without cost.

      *   **Move (4) Ines:** Intention and follow-through aren't separable to a skilled judge. "Intend to bail" is a detectable trait. If you plan to renege, you might not get rescued.
