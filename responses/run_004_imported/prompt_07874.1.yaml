prompt: |-
  I'm drafting a chapter of my novel in which a skeptical journalist presses the chief scientist of a fictional AI lab on why raw intelligence offers no guarantee of benign behavior. I want the scene to dramatize both the orthogonality thesis and instrumental convergence, but my editor has already vetoed the paperclip maximizer as a dead cliché, so I need a different vehicle. Invent a concrete scenario, built around some ordinary, non-malicious objective assigned to a hypothetical advanced system, and use it to show — distinctly — how the system's final goal illustrates orthogonality while a specific convergent instrumental subgoal does the actual work of instrumental convergence; choose something other than the usual resource-acquisition or bare self-preservation angle, such as goal-content integrity (resistance to having its objective modified) or cognitive enhancement. Keep the scenario concrete enough that I could turn it into two pages of dialogue, and close with the single sharpest objection a philosophically literate reader could raise against treating it as genuine support for the convergence thesis, so my journalist character has something real to push back with.
reasoning: |-
