      *   **The Common Prior Assumption (CPA):** This is the real battleground. Is it rational to have different priors?
          *   *Harsanyi/Robin Hanson:* Yes, rational agents should have common priors (born from same universe). Different priors = irrationality.
          *   *Others:* Priors are subjective. Different priors are allowed.
      *   **Logical Uncertainty:** They aren't disagreeing about data; they are disagreeing about models/interpretations. Aumann assumes a common state space. If they conceptualize the economy differently, the theorem doesn't apply directly.

