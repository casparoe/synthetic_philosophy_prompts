answer: |-
  This is a sophisticated question that cuts to the heart of contemporary moral psychology and normative ethics. You are correct that this is not merely a rhetorical trick; the "standing to blame" is a live and contentious area of philosophy. The debate centers on whether moral blame is a purely objective assessment of an action or a communicative act between agents that requires specific relational preconditions.

  Here is a conceptual map of the debate, distinguishing the main positions on why hypocrisy might negate standing, how philosophers distinguish past inconsistency from hypocrisy, and whether the "standing" objection is distinct from the *tu quoque* fallacy.

  ### 1. The Core Distinction: Content vs. Authority
  The first step in the philosophical map is separating the **content** of the blame from the **authority** (standing) to deliver it.

  *   **Content:** Is the act wrong? (In your case: Yes, exploiting an elderly parent is wrong.)
  *   **Standing:** Does *this* person have the right to hold *that* person accountable for this wrong?

  Most philosophers agree that a lack of standing does not make the action permissible. Your brother remains morally liable for taking the money even if you lack the standing to blame him. The question is whether your lack of standing makes your *act of blaming* inappropriate, unjust, or infelicitous.

  ### 2. Position A: The Normative Loss View (Wallace, Bell, Fritz & Miller)
  This is the view you alluded to regarding R. Jay Wallace. Proponents argue that lacking standing is a genuine **normative disability**, analogous to legal standing. It is not just that you are less persuasive; it is that you have forfeited the *right* to participate in this specific moral transaction.

  **The Argument from Moral Equality (Wallace):**
  Wallace grounds blame in the Strawsonian idea of "moral address." To blame someone is to call upon them to recognize a shared moral norm. This presupposes a relationship of equality.
  *   **The Mechanism:** When you blame someone for violating a norm you are currently violating, you implicitly claim an exemption for yourself. You are saying, "This norm binds you, but it does not bind me."
  *   **The Injury:** This violates the condition of equality required for moral address. You are treating the other person as a subordinate subject to rules you place yourself above. Therefore, the blame is structurally defective, regardless of its truth.

  **The Argument from Commitment (Fritz & Miller):**
  Others argue that standing derives from one's commitment to the norm.
  *   **The Mechanism:** To blame is to assert that the norm is important. If you violate it, you demonstrate that you do not actually value the norm enough to follow it.
  *   **The Injury:** Your blame becomes insincere. You are using the norm as a weapon rather than upholding it as a value. This creates a "normative disability" because you cannot authentically invoke a value you are actively disregarding.

  ### 3. Position B: The Skeptical/Pragmatic View (Roadevin, King)
  Critics of the Normative Loss View argue that "standing" is overwrought. They suggest that what we call "lacking standing" is actually just a cluster of pragmatic or epistemic failures.

  **The Argument from Truth:**
  *   **The Claim:** Moral truths are agent-neutral. If an act is wrong, it is wrong regardless of who points it out. To say a hypocrite "cannot" blame is to confuse the *message* with the *messenger*.
  *   **The Explanation:** When we reject a hypocrite's blame, we aren't acknowledging a normative disability; we are reacting to **insincerity** or **bad faith**. We distrust their motives (e.g., they are blaming to distract from their own faults).
  *   **The Implication:** If the hypocrite is transparent about their motives, or if the blame is delivered anonymously, the objection vanishes. This suggests the problem is psychological (credibility), not normative (right to blame).

  **The "Clean Hands" Objection:**
  Skeptics argue that if standing required clean hands, almost no one could blame anyone for anything, given human fallibility. This would lead to a "silence of the lambs" where moral community collapses because everyone has sinned.

  ### 4. Past Inconsistency vs. Genuine Hypocrisy
  This is the most critical distinction for your specific situation. Philosophers generally distinguish between **hypocrisy** and **past inconsistency** (or reformed wrongdoing).

  **Genuine Hypocrisy:**
  *   Requires a *current* violation of the norm one is invoking.
  *   Involves a pretense of virtue (claiming to be something one is not).
  *   **Standing:** Almost universally agreed to negate standing (under the Normative Loss View).

  **Past Inconsistency (The Repentant Wrongdoer):**
  *   You violated the norm in the past but have since reformed.
  *   **The Debate:** Does the past sin haunt you indefinitely?
      *   **The "Stain" View:** Some argue that until you have made full restitution or the "moral statute of limitations" has passed, you lack standing. Your aunt's comment ("last person who gets to lecture") leans this way.
      *   **The "Reform" View (Wallace, others):** If you have genuinely repented and reformed, you actually regain standing. In some cases, you may have *more* standing than someone who has never struggled with the issue, because you understand the temptation and the difficulty of compliance.
      *   **The Condition:** The key is **acknowledgment**. If you blame your brother while hiding your own past, you are lying by omission, which recreates the inequality of the hypocrite. If you acknowledge your past ("I did this, it was wrong, I stopped, and you should too"), you re-establish moral equality. You are no longer claiming an exemption; you are claiming a shared struggle.

  ### 5. *Tu Quoque* vs. Standing Objections
  You asked if the accusation is just *tu quoque* in a nicer outfit. Philosophically, they are distinct.

  *   **Tu Quoque ("You Also"):** A logical fallacy.
      *   *Structure:* "You say X is wrong. You did X. Therefore, X is not wrong."
      *   *Validity:* Invalid. Your past actions do not change the moral status of the act.
  *   **Standing Objection:** A normative claim about authority.
      *   *Structure:* "You say X is wrong. You did X. Therefore, *you* are not the one who gets to enforce this norm against me."
      *   *Validity:* Potentially Valid (depending on which philosophical view you accept). It accepts X is wrong but challenges the *blamer's* position.

  Your brother used a *tu quoque* if he implied his theft was okay because you did it. Your family is using a *standing objection* if they agree the theft is wrong but believe you forfeited the right to police it.

  ### 6. Synthesizing the Debate: The "Why It Matters" Question
  Why do philosophers care if this is a "normative disability" rather than just "insincerity"?

  **The Case for Normative Disability:**
  If it is merely insincerity, then a hypocrite could say, "I know I'm a hypocrite, but I'm right," and continue blaming. If it is a normative disability, the hypocrite is *doing something wrong* by blaming. They are committing a secondary moral violation (the violation of equality) on top of the primary one. This explains the visceral anger we feel toward hypocrites; they aren't just annoying, they are unjust in their address.

  **The Best Objection to Normative Disability:**
  The strongest objection is the **Problem of Moral Progress**. If standing is lost through violation, moral reformers often lack standing. Consider a recovering addict telling an active addict to stop. If the recovering addict lacks standing because of their past, we lose a vital tool for moral improvement. This suggests standing must be recoverable through reform and acknowledgment, or that the "disability" is not as rigid as legal standing.

  ### 7. Mapping Your Situation Conceptually
  Applying this map to your case without offering personal advice:

  1.  **Content:** Your brother's action is objectively wrong (family agrees).
  2.  **Hypocrisy Status:** You are not a *current* hypocrite (you reformed). You are a *past* inconsistent agent.
  3.  **The Standing Deficit:** Under the **Normative Loss View**, you might retain standing *if* you addressed the situation as a moral equal. If you confronted him as a superior ("I would never do that") while hiding your past, you claimed an exemption, triggering the standing loss. If you confronted him as a peer ("We both struggled with this, but this is wrong"), your standing is more secure.
  4.  **The Family's Reaction:** Your aunt's reaction suggests she views standing as a "clean hands" requirement that is permanent or long-lasting. She is treating moral authority like a credential that was revoked and not yet reinstated.
  5.  **The *Tu Quoque* Trap:** Your brother successfully shifted the conversation from the *content* (his theft) to the *messenger* (your past). Philosophically, he deflected the truth of the accusation, but he may have correctly identified a procedural flaw in your delivery.

  ### Summary of the Conceptual Map
  *   **Main Positions:**
      1.  **Normative Loss:** Hypocrisy forfeits the right to blame (Wallace). It violates moral equality.
      2.  **Pragmatic/Epistemic:** Hypocrisy just reduces credibility. The right to blame remains (Skeptics).
  *   **Strongest Case for Loss:** Blame is a communicative act requiring equality. Hypocrisy asserts superiority/exemption, breaking the channel of communication.
  *   **Best Objection:** It stifles moral reform. Repentant sinners often make the best moral guides; denying them standing harms the moral community.
  *   **Hypocrisy vs. Inconsistency:** Hypocrisy is current violation + pretense. Past inconsistency + reform + acknowledgment = restored standing.
  *   **Tu Quoque vs. Standing:** *Tu quoque* denies the truth of the claim; Standing denies the authority of the claimant.

  The philosophical consensus leans toward the idea that **reform restores standing**, provided the blamer acknowledges their past rather than concealing it. If you concealed your past during the confrontation, the family's reaction aligns with the "Implicit Claim of Exemption" argument. If you were open about your past, their reaction aligns more with the "Clean Hands" view, which many philosophers consider too rigid for a functional moral community.
