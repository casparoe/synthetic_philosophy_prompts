answer: |-
  The machine hummed, a low frequency that Elias felt in his teeth. On the screen, the biometric readout flatlined, then spiked green. *Connection Established.*

  Sarah leaned forward, her hands clasped tight. "He's going to be confused," she whispered. "We need to remind him it's okay. It's just the next phase. Like winter."

  Elias kept his hands in his pockets. "He wasn't confused when he wrote the note, Sarah."

  "That was the pain talking," she said, her voice tightening. "You know how he was about the cycles. Life, death, life. It's all just breath. In and out. If we explain it to him, he'll understand he doesn't have to stay gone. We can bring him back for a year. Just one year. That's all the permit allows."

  This was the argument they'd been having for weeks. Sarah believed in the Basin. She quoted the old texts without knowing it: *She died, he sang, because it was like the seasons turning.* To her, death was a neutral transition. Grief was a failure of imagination. If you understood the flow, you knew that being alive and being dead were just different coordinates on the same map. Bringing him back wasn't an intrusion; it was just continuing the journey.

  Elias believed in the Skull. He remembered the dream from the text: *No ruler above, no subjects below, no chores, freer than a king.* To him, death wasn't a season. It was a resignation. It was quitting a job you never applied for.

  "Initiating audio," the technician said.

  The speakers crackled. Then, Jonas's voice. It didn't sound weak. It sounded heavy, like a door closing. "You shouldn't have used the credit."

  Sarah let out a sob of relief. "Jonas! Oh, thank god. Listen to me. It's alright. We know it's scary, but it's natural. You're just... changed. Like water to ice. We can melt you back. We have the year."

  There was a pause on the line. A static hiss that sounded like wind over a barren plain.

  "Ice melts," Jonas said. "I'm not ice, Sarah. I'm the ground."

  "Don't say that," she pleaded. "You're part of the cycle. You belong with us. It's not right to stop."

  "Who says it's not right?" Jonas asked. "The living? Because you're the ones with the alarms and the rents and the kings telling you where to stand."

  Elias stepped forward. "She thinks you're lost, Jonas."

  "I'm not lost," Jonas said. "I'm unburdened. Do you know what it's like to have no 'above' you, Elias? No boss, no gravity, no 'should'?"

  "Come back for the year," Sarah insisted. "Just to say goodbye properly. To grieve."

  "Grieve what?" Jonas's voice sharpened. "If I come back, I put the yoke on. If I stay, I rest. You're asking me to choose the yoke because you miss the weight of it."

  Sarah looked at Elias, desperate. "Tell him. Tell him it's just nature. Tell him he's being selfish."

  Elias looked at the green spike on the monitor. He looked at Sarah, who saw death as a hallway. He looked at the screen, where Jonas sounded like he'd found the exit.

  If Sarah was right—if death was just a neutral shift, a season change—then Jonas should have been indifferent. If it was all just *Qi* condensing and dispersing, what did it matter if he came back for a year? A wave doesn't mind returning to the ocean, but it doesn't mind being a wave again, either. Neutrality implies no preference.

  But Jonas had a preference.

  "He's not being selfish," Elias said quietly. "He's being free."

  "Freedom is here," Sarah snapped. "Freedom is life."

  "Freedom is *choice*," Elias corrected. "And he chose to stop."

  Elias reached for the console. There was a red lever labeled *Termination of Link*. Pulling it meant Jonas went back. Leaving it meant the connection held, the year was forfeited, and Jonas stayed dead.

  "If you pull that," Sarah warned, tears streaming, "you're killing him twice."

  "No," Elias said. "I'm honoring the promotion."

  He pulled the lever.

  The green spike flattened. The hum died. The room was silent.

  Sarah slumped into the chair, horrified. "He didn't even say goodbye."

  "He did," Elias said, turning toward the door. "He said he wasn't coming back."

  "You think this is better?" she cried. "Thinking he's happier in the dark?"

  Elias stopped at the threshold. He felt a strange lightness in his chest, a lack of pressure that he hadn't felt since the diagnosis. He realized then that Sarah's grief was built on the idea that Jonas had been *taken*. She was mourning a theft. But Elias wasn't mourning. You don't mourn a prisoner who walks out of an open cell.

  "It's not about the dark, Sarah," Elias said. "It's about the cage. You think death is a different room. He's telling us it's the open sky."

  He walked out into the bright, noisy street. Cars honked. People rushed. The cycle churned on, demanding to be fed. Elias took a deep breath, not of relief that he was alive, but of sympathy for those who still had to be.

  If the two ideas were the same—that death is just nature, and death is just better—Jonas would have been indifferent to the return. The fact that he refused proves the distinction. One view asks for acceptance of the cycle. The other asks for recognition of the escape.

  Elias didn't look back at the clinic. He had work to do, but for the first time, he didn't feel like he owed it to anyone. Not even the seasons.
