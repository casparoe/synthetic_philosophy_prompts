answer: |-
  1. **The Normative Gap**
  You argue that because we cannot practically abandon the reactive attitudes—resentment, gratitude, indignation—we are licensed to retain our practices of moral responsibility. But there is a gap between the claim that we *can't help* holding these attitudes and the claim that we *ought* to honor them. If resentment is merely a psychological inevitability, why does it carry normative weight? Why isn't it just a brute fact about our psychology, like a reflex, rather than a justification for blame?

  *Follow-up:* If you respond that demanding an external justification for our moral practices is what Strawson called "panicky metaphysics," I'd press you: Does labeling the demand "panicky" immunize your view from critique? If we can't ask whether our inevitable attitudes are *good*, have you replaced metaphysics with a kind of fideism?

  2. **The Neuroscience Challenge**
  Robert Sapolsky and others argue that neuroscience doesn't just suggest determinism is true; it suggests that the *feeling* of responsibility is a post-hoc confabulation generated by the brain. They aren't just making a metaphysical claim; they are offering a causal explanation for the attitude itself. If resentment is just a neural firing pattern triggered by perceived threat, doesn't that demote it from a moral judgment to a biological symptom?

  *Follow-up:* If you maintain that the *cause* of the attitude doesn't change its *status* in interpersonal life, I'd ask: At what point does a biological explanation become so granular that it forces the "objective attitude" upon us? If we can predict a violent outburst via fMRI before the subject feels anger, can we truly sustain the participant stance?

  3. **Excuses, Exemptions, and History**
  Strawson distinguishes between *excuses* (I didn't mean to) and *exemptions* (he is psychologically abnormal). But modern psychology suggests that formative history—trauma, deprivation, conditioning—shapes agency in everyone. If we take the scientific view of human development seriously, doesn't the exemption category threaten to swallow the rule? How much of an offender's history can we admit before they slide from a responsible participant to a subject of therapy?

  *Follow-up:* If you argue that we draw a pragmatic line where social functioning requires it, doesn't that make moral responsibility contingent on social utility rather than desert? Are you essentially saying we blame people because it's useful, not because they are truly responsible?

  4. **The Problem of the Wicked**
  Gary Watson pointed out that in cases of exceptional wickedness, we often feel two things at once: moral indignation (the participant stance) and a pitying sense that the person is morally disabled (the objective stance). These don't seem to trade off cleanly as Strawson implies; they coexist. If we can view the same person as both a responsible agent and a victim of their own moral incapacity, doesn't that fracture the binary your theory relies on?

  *Follow-up:* If you concede that ambivalence is possible, does that ambivalence undermine the authority of our blame? If part of me sees the villain as exempt, do I have the standing to punish them with the full force of moral condemnation?

  5. **Cultural Variability**
  Your defense rests heavily on the idea that reactive attitudes are constitutive of "interpersonal life" as such. But anthropologists show significant variation in how cultures experience guilt, shame, and resentment. If these attitudes are culturally malleable rather than universal human constants, does that weaken the claim that they are non-optional? Could a society evolve that functions without resentment?

  *Follow-up:* If you argue that even alternative cultures have *some* form of reactive stance, just differently expressed, how do we adjudicate between conflicting moral emotions? If one culture feels righteous indignation where another feels pity, does your framework offer a way to say one is correct?

  6. **Moral Progress and Critique**
  If we are embedded within the participant stance and cannot step outside it to justify it, how do we account for moral progress? Movements to reduce retributive impulses—like restorative justice or the abolition of shame-based norms—seem to require critiquing our native reactive attitudes. If we can't step outside the stance to evaluate it, how do we distinguish between a *correction* of our moral emotions and a mere *change* in them?

  *Follow-up:* If you suggest we use internal resources of the stance to critique itself, isn't that circular? How do we know the "reformed" attitude is better, rather than just different, if the standard of "better" is itself derived from the attitudes we are trying to reform?

  7. **The Intrapersonal Stance**
  Strawson focuses on interpersonal relationships—me reacting to you. But much of our moral life is intrapersonal: guilt, regret, and self-blame. Can I truly take the participant stance toward myself? Or is self-blame always a form of self-harm that should be viewed objectively? If your theory doesn't account for the relationship with the self, is it incomplete as a theory of responsibility?

  *Follow-up:* If you argue that self-blame is just an internalized social dialogue, does that mean solitude undermines responsibility? If I am the last human on earth, can I still be morally responsible, or does responsibility vanish without an "other" to resent me?

  8. **Artificial Agents**
  We are increasingly interacting with AI that mimics human apology and commitment. People already feel betrayed by algorithms. According to your view, if we *find ourselves* feeling resentment toward a chatbot, does that make the chatbot a moral agent? Or is there a factual constraint on who can enter the participant stance that goes beyond our psychological reactions?

  *Follow-up:* If you say there is a factual constraint (e.g., the AI lacks consciousness), aren't you reintroducing the very metaphysical facts Strawson sought to bypass? How do you define the boundary of the moral community without looking at the internal machinery of the agent?

  9. **The Cost of the View**
  Accepting your Strawsonian view means accepting that our responsibility practices rest on a kind of natural necessity rather than cosmic justice. Is there a tragedy in this? Does it feel like a loss to acknowledge that we blame people not because the universe demands it, but simply because we are built to?

  *Follow-up:* If you say it's not a loss but a liberation from impossible standards, does that liberation come at the cost of humility? If we know our blame is just a human practice, should we blame with less confidence, or does the inevitability of the attitude license us to blame with full force?

  10. **The Quietist Worry**
  Critics argue that by declaring the free will debate dissolved, you encourage intellectual quietism. If we tell the public that neuroscience doesn't matter for responsibility, do we risk stifling important reforms in law and education that *should* be driven by a deeper understanding of human causation? Is there a danger that your philosophical comfort becomes a policy obstacle?

  *Follow-up:* If you respond that your view actually supports reform by focusing on harm rather than desert, isn't that a consequentialist argument smuggled into a Strawsonian framework? Are you secretly a consequentialist when the stakes get high?
