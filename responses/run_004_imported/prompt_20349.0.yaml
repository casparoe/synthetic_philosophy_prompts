      *   *Premise 2: Tiling Agents and Self-Modification.* The tiling agents problem is about an agent $A_1$ creating a successor $A_2$ such that $A_1$ trusts $A_2$'s reasoning. If $A_1$ requires a proof that $A_2$ is sound (in the same logic), Löb's Theorem creates a problem (the "procrastination paradox" or infinite regress of weakening logics).
