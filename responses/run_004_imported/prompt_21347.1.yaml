answer: |-
  The marker squeaked as Marcus circled the four quadrants on the whiteboard. $Q_1, Q_2$ in Red; $Q_3, Q_4$ in Blue.

  "It's the geometry, Elena," Marcus said, capping the marker. "You're treating probability mass like water in separate tanks. It's not. It's a single simplex. When you constrain $P(HQ|Red)$ to be $3/4$, you're slicing the simplex. The point of minimal divergence from the uniform prior isn't in the 'Red-up, Blue-still' subspace. It's shifted globally."

  Elena crossed her arms, leaning against the seminar table. "That's the problem. The radio message was silent on Blue. It contained zero bits of information about the Second Company's presence in Blue territory. Yet your MinxEnt solution drops the probability of $Q_3$ and $Q_4$. You've conjured information out of thin air. That's not inference; it's hallucination."

  "It's not conjuring. It's accounting," Marcus countered. "You want to hold $P(Blue)$ fixed at $1/2$ and $P(HQ|Blue)$ fixed at $1/2$. But why? That assumes independence between the *fact* that we received a constraint on Red and the *state* of Blue. But the constraint changes the normalization constant. To minimize cross-entropy, the odds between Red and Blue must shift to accommodate the tighter restriction in Red."

  "Tighter? How is '3-to-1' tighter than '1-to-1'?" Elena stepped to the board, grabbing a different colored marker. "Look, if I tell you 'If it rains, take an umbrella,' you update your umbrella-taking policy. You don't suddenly change your belief about whether the sun is shining in the desert. My students' intuition is an instance of the Principle of Irrelevance. If evidence $E$ is probabilistically independent of hypothesis $H$ in the prior, and $E$ says nothing about $H$, the posterior should reflect that."

  "But $E$ isn't a proposition here, it's a constraint on a conditional," Marcus said, tapping the equation $p_1 = 3p_2$. "You're trying to apply Jeffrey Conditionalization, but you don't have a partition of experience. You have a constraint on a ratio. If you force Blue to stay fixed, you aren't minimizing information gain; you're arbitrarily privileging the partition {Red, Blue} over any other way of carving the space. What if I told you the region was divided into 'North' and 'South' instead? Your 'surgical' rule would give a different posterior because 'North' cuts across Red and Blue. MinxEnt is invariant under refinement of the partition. Your rule isn't."

  Elena paused, marker hovering. "That's a feature, not a bug. The soldier knows she's in a military grid. Red and Blue are the operational theaters. HQ and Second are the chain of command. The structure matters. If your method says the probability of 'Blue-HQ' changes just because I learned about 'Red-HQ,' then your method is sensitive to how I label the atoms. Show me the derivation where Blue *must* move without assuming a specific metric on the space of probabilities."

  "The metric is the log-ratio," Marcus said sharply. "It's the only one that satisfies the compositionality axioms for information. If you demand Blue stays fixed, you're effectively saying the distance between distributions is zero along the Blue axis regardless of what happens in Red. That breaks the triangle inequality. You're proposing a distance measure that isn't a distance measure."

  "I'm proposing a rule of relevance," Elena shot back. "Call it 'Kinematical Conservation.' If the evidence doesn't touch a sector, its mass is conserved. You say my rule is partition-dependent. Fine. But yours is parameterization-dependent. If I describe the same state space using odds ratios instead of probabilities, your MinxEnt solution changes. You get different results depending on whether I minimize $KL(P||Q)$ or $KL(Q||P)$, or if I transform the variables. At least my rule respects the semantic content of the message: 'I am in Red' implies nothing about 'I am in Blue'."

  "Semantic content isn't enough for formal updating," Marcus argued, turning back to the board. "You need a bridge principle. Your bridge principle is 'independence is preserved unless stated otherwise.' Mine is 'assume the distribution is as uniform as possible given the constraints.' In the Judy Benjamin case, your principle implies that learning Red is highly structured makes Blue *relatively* more likely to be uniform? No, wait, your principle makes Blue static. But why? Maybe the radio works better in Red. Maybe the terrain in Red forces clustering. By freezing Blue, you're assuming the *mechanism* generating the probability is local. But we're modeling epistemic states, not terrain."

  "We're modeling a soldier's uncertainty," Elena corrected. "If I tell you 'The card is a King if it's Red,' you don't change your credence that the card is a Spade. You just update the Reds. If MinxEnt tells you to shift the Spades, MinxEnt is wrong for this context. It's treating epistemic constraints like physical forces. You're solving for equilibrium in a gas, not updating a belief."

  Marcus capped his marker, the click echoing in the empty hall. "And you're solving for a narrative consistency that the math doesn't support. You want a surgical update that leaves the untouched tissue alone. But probability isn't tissue. It's a budget. If I spend more certainty on Red-HQ, I have less to spend elsewhere. MinxEnt tells you how to spend it least extravagantly. Your rule just refuses to balance the books."

  "Then the books are wrong," Elena said, grabbing her bag. "Because in this economy, silence shouldn't cost you your prior."

  "Silence costs you nothing," Marcus called after her as she reached the door. "But constraints cost you freedom. And you have to pay for that somewhere."

  Elena didn't turn around. "Just not in Blue."
