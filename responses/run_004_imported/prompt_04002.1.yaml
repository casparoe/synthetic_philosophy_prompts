answer: |-
  This is a superb philosophical dispute. You and your friend have put your finger on one of the most nuanced and frequently misunderstood distinctions in 20th-century philosophy of language.

  The short answer is: **You are right.** Quine explicitly insists that the Indeterminacy of Translation (IT) is a stronger thesis than the Underdetermination of Theory by Evidence (UTE). However, your friend is also partially right insofar as the *structure* of the argument is similar. The difference lies not in the logic of evidence, but in the **ontology of meaning.**

  Here is a careful comparison of the two ideas, the specific "extra strangeness" you were looking for, and an assessment of whether Quine's distinction holds up.

  ---

  ### 1. Underdetermination of Theory by Evidence (UTE)
  **The Thesis:** For any given body of observational evidence, there are always multiple, logically incompatible scientific theories that can account for that evidence equally well.

  *   **Context:** Natural science (physics, cosmology, etc.).
  *   **Status:** Epistemological.
  *   **The "Fact of the Matter":** Crucially, UTE assumes there **is** a fact of the matter. One of the rival theories is actually true (it correctly describes the unobservable structure of the world), and the others are false. We simply lack the evidence to distinguish them.
  *   **Resolution:** We choose between theories based on pragmatic virtues (simplicity, conservatism, explanatory power), not because we know one is true, but because it is useful to proceed *as if* it is true.

  **Example:** Imagine two theories of gravity that predict all observable planetary motions identically but posit different unobservable mechanisms. UTE says we can't know which mechanism is real, but we assume one of them *is* real.

  ### 2. Indeterminacy of Translation (IT)
  **The Thesis:** In the scenario of "radical translation" (translating a completely unknown language with no prior dictionaries), there are multiple translation manuals compatible with all possible behavioral evidence (stimulus conditions) that are **not** reconcilable by any further fact.

  *   **Context:** Linguistics and semantics.
  *   **Status:** Ontological.
  *   **The "Fact of the Matter":** Quine argues there is **no** fact of the matter. It is not that we cannot *know* which manual is correct; it is that there is nothing *to* be correct about. Neither manual is "truer" than the other.
  *   **Resolution:** We choose a manual based on pragmatic virtues, but we must acknowledge that "meaning" itself is indeterminate.

  **Example:** The native says "Gavagai" when a rabbit runs by.
  *   Manual A translates it as "Rabbit."
  *   Manual B translates it as "Undetached rabbit part."
  *   Manual C translates it as "Temporal stage of a rabbit."
  All three fit the behavioral evidence perfectly. Quine argues there is no hidden mental entity ("the meaning") that decides between them.

  ---

  ### 3. The Crucial Divergence: Where is the "Extra Strangeness"?

  Your friend argues that IT is just UTE applied to language. If this were true, IT would imply: *There is a true meaning of 'gavagai', but we can never know it.*

  Quine rejects this. He argues IT implies: *There is no true meaning of 'gavagai' beyond the behavioral dispositions.*

  This is the "extra strangeness" you couldn't reconstruct. It is the move from **epistemic humility** (UTE) to **ontological elimination** (IT).

  *   **In Physics (UTE):** Evidence underdetermines theory, but **reality determines theory.** The world is a certain way, even if our evidence can't tell us how.
  *   **In Translation (IT):** Evidence underdetermines the manual, and **nothing else determines it.** There is no "semantic reality" lurking behind the behavior waiting to be discovered.

  Quine summarizes this distinction in *On the Reasons for the Indeterminacy of Translation* (1970):
  > "The indeterminacy of translation is not just an implication of the underdetermination of scientific theory. ... In the case of physics, we assume there is a fact of the matter... In the case of translation, there is no fact of the matter."

  ### 4. The Independent Claim: What Drives the Difference?

  If Quine is a physicalist (believing everything is physical), why does he treat physics and translation differently? Why isn't meaning just another physical fact?

  To get from UTE to IT, Quine relies on a further, independent claim: **The Rejection of Intensional Entities (Meanings).**

  1.  **Behaviorism:** Quine holds that the only evidence available for language learning is public behavior (stimulus and response).
  2.  **No "Museum" Myth:** He rejects the idea that words label inner mental objects or abstract "meanings." There is no "meaning" in the speaker's head that exists independently of their behavioral dispositions.
  3.  **The Gap:** In physics, we posit unobservable entities (electrons, fields) to explain observables. We assume these entities exist independently of our theory. In translation, "meanings" are not posited entities in the same way. Once you have fixed all the physical/behavioral facts, **there is nothing left to fix.**

  Therefore, the independent claim required to make IT stronger than UTE is: **Semantic facts do not exist over and above behavioral facts.**

  If you believe that "meanings" are real things (mental representations, abstract propositions, etc.), then IT collapses into UTE. You would simply say, "The native *means* Rabbit, not Rabbit Stage, even if their behavior doesn't show it." Quine's entire system rests on denying that such a distinction makes sense.

  ### 5. Is the Distinction Defensible?

  This is where the philosophical battle lies. Quine's distinction is logically consistent within his system, but many philosophers find the "independent claim" (the rejection of meanings) implausible.

  **Arguments for Quine (Defending the Distinction):**
  *   **Naturalism:** If we stick to a strict scientific worldview, we cannot observe "meanings." We only observe behavior. To posit a "fact of the matter" about meaning that transcends behavior is to engage in unscientific metaphysics.
  *   **Holism:** Meaning is determined by the role a word plays in the whole web of belief. Since the web can be adjusted in multiple ways to fit evidence, the specific assignment of meaning is arbitrary.

  **Arguments Against Quine (Collapsing IT back into UTE):**
  *   **Chomsky's Critique:** Noam Chomsky argued that Quine conflates *evidence* for a theory with the *nature* of the object of study. Just because we only have behavioral evidence for language doesn't mean the mind doesn't have a specific structure. If the human brain has a specific semantic structure, there *is* a fact of the matter (the neural state), even if behavior doesn't reveal it. For Chomsky, IT is just UTE regarding the brain.
  *   **The Intuition of Normativity:** When I say "rabbit," I intend to refer to the whole animal, not a temporal stage. There seems to be a normative fact about what I *ought* to mean based on my intentions. Quine dismisses intentions as behaviorally opaque, but many argue this ignores the first-person reality of meaning.
  *   **Kripke's Wittgenstein:** Saul Kripke offered a skeptical paradox similar to Quine's (the "quus" problem) but suggested the solution lies in community agreement, not the elimination of meaning facts. This preserves a fact of the matter (social norms) that Quine denies.

  ### 6. Conclusion: Who Won the Argument?

  **On Exegesis (What Quine Meant): You Win.**
  Quine was adamant that IT is not merely UTE. He viewed UTE as a limitation of human knowledge, whereas IT was a limitation of reality (specifically, semantic reality). If your friend claims they are the *same* thesis, they are ignoring Quine's explicit ontological claims about the non-existence of meanings.

  **On Philosophy (What is True): It's Contested.**
  Your friend's position is actually the more common realist stance in contemporary philosophy of mind and language. Most modern philosophers reject Quine's radical behaviorism. They argue that if we accept mental states or neural structures as real, then there *is* a fact of the matter about translation, making it a case of UTE.

  **The Verdict:**
  You were right that Quine intended IT to be stronger and stranger. The "extra strangeness" comes from the claim that **meanings are not real entities.**
  *   If you accept Quine's behaviorism, IT is a unique, terrifying ontological void.
  *   If you reject Quine's behaviorism (as most do today), IT collapses into UTE, and your friend's view becomes the standard realist interpretation.

  So, you successfully identified that Quine posits a distinction, but your friend might be right that the distinction relies on a premise (the elimination of meaning) that many philosophers no longer accept.
