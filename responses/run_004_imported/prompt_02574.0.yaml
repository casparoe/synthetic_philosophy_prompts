answer: |-
  You are right to be suspicious of the postdoc's move. While the "boundary problem" (or the *demos* problem) is a genuine and serious theoretical hurdle, the leap from "the boundary is theoretically underdetermined" to "all existing democracies are illegitimate fictions" is **not** the mainstream consensus. It is a skeptical challenge, not a settled verdict.

  Most democratic theorists acknowledge the circularity but argue that it does not vitiate legitimacy entirely. They usually argue that while the *demos* cannot be constituted *purely* by democratic procedure, it can be justified by **external normative criteria** or accepted as a **pre-political precondition**.

  Here is the breakdown of the positions, the specific theorists, and how you can thread the needle in your next meeting.

  ### 1. The Diagnostician: Frederick Whelan (1983)
  *   **The Text:** "Democratic Theory and the Boundary Problem" (*Nomos* XXV).
  *   **The Position:** Whelan is the one who famously articulated the circularity: *To vote on who votes, you must already know who votes.*
  *   **Does he say democracy is illegitimate?** **No.** Whelan argues that democratic theory *alone* cannot solve the boundary problem. He suggests that boundaries are typically determined by **pre-political facts** (history, culture, geography, language) rather than democratic principle.
  *   **The Counter-Argument:** For Whelan, the *demos* is a **presupposition** of democracy, not a product of it. The legitimacy of the boundary comes from non-democratic sources (e.g., national identity, historical continuity). Therefore, the state isn't illegitimate; it's just that its boundaries aren't justified *democratically*. They are justified *nationally* or *historically*.
  *   **Your Line:** "Whelan's point wasn't that democracies are fake, but that the *demos* is a precondition for democracy, not a consequence of it. The boundary is justified by historical/national facts, not the vote itself."

  ### 2. The Cosmopolitan Critic: Arash Abizadeh (2008)
  *   **The Text:** "Democratic Theory and Border Coercion: No One-Right to Unilaterally Control Immigration."
  *   **The Position:** Abizadeh takes the problem seriously and argues that because border regimes are coercive, they must be justified to those **outside** the border as well as those inside.
  *   **Does he say democracy is illegitimate?** He argues that **unilateral** border control by a closed *demos* is illegitimate. He pushes for open borders or a global *demos*.
  *   **The Nuance:** Even Abizadeh doesn't say "democracy is a fiction." He says "current bounded democracies are acting illegitimately *regarding their borders* until they justify them to outsiders." He preserves the possibility of legitimacy through cosmopolitan institutions.
  *   **Your Line:** "Abizadeh argues existing borders are illegitimate *in their exclusionary practice*, not that the internal democratic process is a fiction. He wants to expand the *demos*, not abolish the concept of legitimacy."

  ### 3. The Functionalist: Robert Goodin (2007)
  *   **The Text:** "Enfranchising All Affected Interests."
  *   **The Position:** Goodin tries to break the circularity by proposing an external criterion: the **All Affected Interests (AAI)** principle. Anyone affected by a decision should have a say.
  *   **Does he say democracy is illegitimate?** No, he thinks this principle *solves* the boundary problem.
  *   **The Catch:** This often leads to a "global *demos*" for many issues, which is impractical. But theoretically, it provides the non-circular principle the postdoc claims is missing.
  *   **Your Line:** "Goodin offers a principled criterion (affected interests) that breaks the circularity. It might be messy in practice, but it shows a non-arbitrary standard is possible."

  ### 4. The Pragmatist / Nationalist: David Miller (and Rawls)
  *   **The Position:** David Miller (e.g., *On Nationality*) argues that national identity provides the necessary solidarity for redistribution and trust.
  *   **The Argument:** The boundary isn't arbitrary; it tracks **national communities**. We don't need a democratic vote to set the boundary because the boundary reflects a pre-existing ethical community.
  *   **Rawls:** In *The Law of Peoples*, Rawls essentially takes "peoples" as given units to avoid the infinite regress. He focuses on how they relate, not how they are metaphysically constituted.
  *   **Your Line:** "Miller and Rawls essentially treat the *demos* as a 'second-best' necessity. We accept existing boundaries because they track ethical communities (nations), allowing us to focus on internal justice rather than infinite boundary regress."

  ### 5. The Constitutive View: Habermas / Constitutional Patriots
  *   **The Position:** The *demos* is not a pre-political ethnic group, nor is it a fixed boundary. It is constituted **through the political process itself**.
  *   **The Argument:** By engaging in constitutional deliberation, the people *create* themselves. The circularity is a "hermeneutic circle," not a vicious logical circle.
  *   **Your Line:** "For Habermas, the circularity is constitutive. The people emerge through the act of constitution-making. It's not a logical flaw; it's the nature of political founding."

  ### Summary: How to Handle the Postdoc
  The postdoc is making a **Pyrrhonian Skeptic** move: *If the foundation cannot be perfectly justified, the building falls.* The mainstream response is **Non-Ideal Theory**: *Legitimacy is gradational and composite.*

  **Three specific points to raise:**

  1.  **Legitimacy is Composite:** A state's legitimacy isn't based *solely* on the democratic boundary. It's based on a bundle: human rights protection, rule of law, internal democratic procedure, *and* reasonable (if imperfect) boundaries. A flaw in one pillar (the boundary) doesn't collapse the whole structure.
  2.  **The "Arbitrariness" is Constrained:** While there is no *perfect* geometric way to draw a border, existing borders aren't random. They are constrained by geography, history, and language. "Not perfectly principled" does not equal "totally arbitrary fiction."
  3.  **The Regress Stops at Coercion:** Some argue (like Abizadeh or Nagel) that the obligation to justify boundaries democratically only arises where there is a coercive state apparatus. The "circularity" only matters if you insist on a purely proceduralist account of legitimacy. If you allow substantive values (justice, rights) to anchor the boundary, the regress stops.

  **The "Cheat Sheet" for your meeting:**
  *   **Whelan:** Diagnosed the circularity; says boundaries rely on pre-political facts (history/nation), not democratic votes.
  *   **Goodin:** Says "All Affected Interests" solves it (leads to cosmopolitanism).
  *   **Abizadeh:** Says borders are coercive, so outsiders must have a say (unilateral control is illegitimate).
  *   **Miller:** National identity justifies the boundary (non-arbitrary).
  *   **Consensus:** The problem is real, but it renders boundaries **contingent**, not democracies **illegitimate**.

  **Suggested phrasing:**
  "I think the postdoc is conflating 'procedurally underdetermined' with 'illegitimate.' Whelan's point was that the *demos* is a precondition of democracy, justified by historical/national facts, not that the resulting state is a fiction. Most theorists (like Miller or even Rawls) treat the boundary as a non-ideal starting point that allows us to pursue internal justice, rather than a dealbreaker for legitimacy."

  This should signal that you know the literature, respect the complexity, but reject the nihilistic conclusion.
