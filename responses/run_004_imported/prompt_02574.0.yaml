prompt: |-
  Quick question that's been rattling around in my head since a faculty reading group last week - we were going through some of the classic stuff on who counts as "the people" for democratic purposes (Whelan's old Nomos piece that coined "the boundary problem," plus a bit of Goodin and Abizadeh), and one of the political theory postdocs made a claim I haven't been able to shake since. His argument was basically: since nobody can specify, without circularity, who should count as part of the demos prior to the very vote that would decide who counts as part of the demos, this means literally every actual democracy's claim to legitimacy is resting on nothing. The US, France, wherever - none of them can point to a principled, non-arbitrary reason why their demos is bounded the way it is rather than some other way, so "government by the consent of the governed" is really just a fiction dressed up in nice language.

  I mumbled something in the moment about how surely theorists have a response to this that doesn't just bite the bullet, but honestly I couldn't reconstruct it on the spot, and I'd rather have my act together before it comes up again (he's sharp and will 100% remember if I fumble it twice). Is "yep, all bounded democracies are strictly illegitmate at bottom" actually the mainstream upshot people draw from the boundary problem? Or is there a more careful way of threading the needle that I'm blanking on - something about the difference between a problem being unsolvable in principle versus it just meaning we need extra, non-procedural criteria (history, coercion, whatever) to fix the boundary in practice? Would love the refresher, and if you can attach names to positions that'd help too - I remember Whelan, Goodin, and Abizadeh being the big ones here but its fuzzy in my head which of them, if any, actually signs on to the "it's all illegitimate" reading versus who thinks the problem is real but survivable.
