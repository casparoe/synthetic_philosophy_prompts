prompt: |-
  I sit on my hospital's New Procedures and Technology Committee, which has to sign off on any interventional technique before it can be offered outside a research protocol. The spine service is asking us to approve system-wide use of a minimally invasive percutaneous technique for stabilizing painful vertebral compression fractures in osteoporotic patients. There is no completed randomized trial behind it; a sham-controlled trial is enrolling but is at least two years from reporting. What we do have is momentum: the technique is now used at roughly three-quarters of the hospitals we benchmark against, up from almost none five years ago, and our own surgeons' enthusiasm rests heavily on site visits where they watched colleagues elsewhere get good results. The department chair's proposal leans on the breadth of that adoption as evidence in itself, and warns that further delay will cost us surgeons and referrals to hospitals that already offer it.

  The committee split in a way that didn't track the usual alliances. Our clinical epidemiologist pointed out that the interval between a hospital's first site visit and its decision to adopt has been shrinking with each wave of new adopters, and argued that this pattern -- convergence driven increasingly by watching what others have already decided rather than by each hospital generating its own evidence -- looks less like accumulating proof and more like an information cascade, which would look exactly as wide and confident whether or not the procedure actually works. Other members thought this was unfair to the surgeons: watching a colleague's outcomes first-hand is a form of evidence too, and three years of accumulated clinical experience shouldn't be waved away as mere imitation. We ran out of time before resolving it.

  Please draft the short written opinion I'll circulate before our next meeting in six weeks. It should recommend one concrete course of action -- full approval, approval with specific conditions, or continued restriction to the research protocol -- attached to a timeframe, and it should take the "accumulated clinical experience is itself evidence" position seriously rather than simply asserting that widespread adoption tells us nothing.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion draft:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital's New Procedures and Technology Committee.
      *   **Task:** Draft a short written opinion to circulate before the next meeting (in six weeks).
      *   **Topic:** Approval of a minimally invasive percutaneous technique for stabilizing painful vertebral compression fractures (osteoporotic patients).
      *   **Current Status:** No completed RCT; sham-controlled trial enrolling (2+ years out). 75% of benchmark hospitals use it. Surgeons want it based on site visits/enthusiasm. Chair warns of losing referrals/staff if delayed.
      *   **Conflict:** Clinical epidemiologist argues this is an "information cascade" (herding behavior). Surgeons argue "accumulated clinical experience is evidence."
      *   **Requirement:** Recommend one concrete course of action (Full Approval, Conditional Approval, or Research Only) with a timeframe.
      *   **Constraint:** Must take the "accumulated clinical experience is itself evidence" position seriously (cannot just dismiss adoption as herd behavior).

  2.  **Evaluate the Options:**
      *   *Option A: Full Approval.* Risky. No RCT data. Sham-controlled trial pending suggests uncertainty about placebo effect (pain is subjective). If it turns out to be ineffective, the hospital is liable and patients are harmed. Doesn't address the epidemiologist's concern about information cascades.
      *   *Option B: Research Protocol Only.* Safe scientifically, but ignores the "momentum" and "clinical experience" argument. Risks losing surgeons/referrals as the Chair warned. Might be seen as ignoring the 75% adoption rate and 3 years of experience elsewhere.
      *   *Option C: Conditional Approval (Proctoring/Registry).* This seems the most balanced. It acknowledges the clinical experience (by allowing use) but mitigates the risk (by requiring data collection and oversight). It addresses the "information cascade" concern by generating *local* evidence rather than relying solely on *external* adoption. It buys time until the RCT reports.

  3.  **Develop the Argument:**
      *   *Acknowledge the Surgeons' Point:* Site visits and 3 years of external use *are* a form of real-world evidence. It suggests safety and feasibility, even if efficacy isn't proven. Dismissing this undermines clinical judgment.
      *   *Acknowledge the Epidemiologist's Point:* Widespread adoption doesn't guarantee efficacy (history is full of popular but useless treatments). The "cascade" risk is real, especially for pain outcomes which are prone to placebo effects.
      *   *The Synthesis:* We can honor the clinical experience without surrendering our duty to verify efficacy. We approve *conditionally*, treating our own patients as a source of rigorous data rather than just recipients of a trend.
      *   *The Mechanism:* A registry + proctoring + sunset clause (review when RCT data drops).

  4.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the recommendation clearly. (Conditional Approval).
      *   **Rationale - Validating Clinical Experience:** Explicitly state that site visits and external volume *do* matter. They establish safety and technical feasibility. This respects the surgeons' view.
      *   **Rationale - Addressing Uncertainty:** Acknowledge the lack of sham-control data. Pain is subjective. The "cascade" risk means we need local verification.
      *   **The Plan (Conditions):**
          1.  Proctoring (ensure the "site visit" learning is standardized).
          2.  Registry (turn "experience" into "data").
          3.  Timeframe (align with the pending RCT).
      *   **Conclusion:** Reiterate that this balances innovation with stewardship.

  5.  **Refining the Tone:**
      *   Needs to be diplomatic but firm.
      *   Needs to show I listened to *both* sides of the committee debate.
      *   Needs to be actionable.
      *   *Self-Correction during drafting:* I initially thought about suggesting a 1-year review. But the prompt says the RCT is 2+ years out. I should align the review with the RCT data release to make the final decision evidence-based. Let's set the conditional period for 24 months.

  6.  **Final Polish:**
      *   Check against constraints: Did I take the "experience is evidence" position seriously? Yes, by citing it as the basis for safety/feasibility approval. Did I pick a concrete course? Yes, Conditional Approval. Is there a timeframe? Yes, 24 months.

  7.  **Final Review of the "Experience as Evidence" constraint:**
      *   I need to make sure I don't sound like I'm saying "Experience counts for nothing." I need to say "Experience counts for safety/feasibility, but not necessarily efficacy regarding pain." This distinction validates the surgeons while protecting the patients.

      *(Self-Correction)*: Wait, simply saying "safety" might be too dismissive. I should frame it as "Clinical experience establishes *plausibility* and *safety profile*, which lowers the barrier for adoption, but does not replace the need for comparative efficacy data in a sham-controlled context."

      *Let's draft.*

      **To:** New Procedures and Technology Committee
      **From:** [My Name]
      **Date:** October 26, 2023
      **Subject:** Recommendation Regarding Percutaneous Vertebral Stabilization System

      **Recommendation:** Approval with Specific Conditions (24-Month Limited Period)

      **Rationale:**
      Our debate highlighted a tension between two valid forms of evidence. The spine service argues that three years of multi-institutional clinical experience and direct observation of outcomes constitute meaningful evidence. I agree. To dismiss the aggregate experience of 75% of our benchmark hospitals as mere "information cascade" undervalues the role of peer-to-peer validation in establishing technical feasibility and immediate safety. When experienced surgeons observe reproducible results across multiple sites, that is a signal we should not ignore.

      However, the epidemiologist's concern remains critical: adoption momentum is not a proxy for efficacy, particularly for pain-driven outcomes susceptible to placebo effects. While clinical experience confirms we *can* do the procedure safely, it does not confirm *why* patients improve.

      **Proposal:**
      We should authorize system-wide use, but treat the next 24 months as a structured data-gathering phase rather than unconditional adoption.

      **Conditions:**
      1.  **Proctored Implementation:** The first five cases per surgeon must be proctored by a credentialed peer to ensure the "site visit" learning translates to standardized technique here.
      2.  **Mandatory Registry:** All patients must be enrolled in a local registry tracking pain scores, functional outcomes, and adverse events. This converts "clinical experience" into analyzable data.
      3.  **Sunset Clause:** This approval expires in 24 months, coinciding with the expected reporting of the pending sham-controlled trial. At that point, continued use will depend on the publication of those results.

      This path respects our surgeons' expertise and market realities while fulfilling our committee's duty to ensure that "everyone is doing it" does not replace "we know it works."

      *Looks good. Concise, addresses the prompt's specific constraints, and offers a middle ground that is ethically sound.*

  8.  **Final Polish:** Check word count and flow. Ensure the distinction between safety/feasibility (supported by experience) and efficacy (supported by RCT) is clear. (The draft looks solid).

      *Wait, one nuance:* The prompt asks to take the position seriously. I should ensure I don't minimize the "experience" too much. I will emphasize that experience *is* evidence of safety/feasibility.

      *Revised Rationale:* "The spine service is correct that accumulated clinical experience is a form of evidence. It provides a robust signal regarding technical feasibility and short-term safety that a randomized trial alone cannot capture." -> This is stronger.

      *Let's finalize.*
answer: |-
  **TO:** New Procedures and Technology Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Percutaneous Vertebral Stabilization System

  **Recommendation:** Approval with Specific Conditions (24-Month Limited Period)

  **Rationale**
  Our previous discussion highlighted a tension between two valid forms of evidence. The spine service argues that three years of multi-institutional clinical experience and direct observation of outcomes constitute meaningful evidence. I believe we must take this position seriously. To dismiss the aggregate experience of 75% of our benchmark hospitals as mere "information cascade" undervalues the role of peer-to-peer validation in establishing technical feasibility and immediate safety. When experienced surgeons observe reproducible results across multiple sites, that is a signal of *plausibility* and *safety* that we should not ignore.

  However, the epidemiologist's concern remains critical: adoption momentum is not a proxy for efficacy, particularly for pain-driven outcomes susceptible to placebo effects. While clinical experience confirms we *can* do the procedure safely, it does not confirm *why* patients improve. Relying solely on external adoption risks importing a standard of care that is popular but potentially inert.

  **Proposal**
  We should authorize system-wide use, but treat the next 24 months as a structured data-gathering phase rather than unconditional adoption. This honors the surgeons' clinical judgment while protecting the institution from the risks of an information cascade.

  **Conditions**
  1.  **Proctored Implementation:** The first five cases per surgeon must be proctored by a credentialed peer to ensure the "site visit" learning translates to standardized technique here.
  2.  **Mandatory Registry:** All patients must be enrolled in a local registry tracking pain scores, functional outcomes, and adverse events. This converts "clinical experience" into analyzable data, allowing us to verify if our outcomes match the benchmark hospitals.
  3.  **Sunset Clause:** This approval expires in 24 months, coinciding with the expected reporting of the pending sham-controlled trial. At that point, continued use will depend on the publication of those results.

  This path respects our surgeons' expertise and market realities while fulfilling our committee's duty to ensure that "everyone is doing it" does not replace "we know it works."
