answer: |-
  To draw the line, I'm using a test of **transparency of intent** combined with **alignment to the target's reflective interests**: manipulation exploits cognitive biases or emotional vulnerabilities to steer behavior *around* conscious scrutiny, whereas persuasion offers reasons or appeals that the agent can consciously evaluate and accept as consistent with their own values. This avoids your friend's "bypasses agency" trap because persuasion also affects agency, but it does so *through* reasoning rather than *around* it, preserving the target's ability to veto the influence upon reflection.

  ```json
  {
    "clearly manipulative": [
      "confirmshaming cancel buttons (\"are you sure you want to give up on your goals?\")",
      "a countdown timer on a checkout page",
      "ads that target one of your specific insecurities using your browsing history"
    ],
    "probably manipulative": [
      "a fear-based political ad about crime or immigration",
      "door-in-the-face negotiating (ask for something huge first so the real ask looks small by comparison)",
      "a friend saying \"guess ill just sit home alone then\" to get you to come out"
    ],
    "genuinely contested": [
      "default opt-out organ donor enrollment",
      "a charity ad with a crying child and swelling music"
    ],
    "probably legitimate": [
      "motivational interviewing techniques (the ones therapists use on clients who are ambivalent about changing)"
    ],
    "clearly legitimate persuasion": [
      "socratic questioning that walks someone step by step to a conclusion they didn't see coming"
    ]
  }
  ```

  The single hardest item to place was **default opt-out organ donor enrollment**, because it sits exactly on the fault line between welfare and autonomy. Proponents argue it's legitimate nudging that saves lives by leveraging inertia for a goal most people already support, while critics argue it subtly coerces consent by making the "right" choice the path of least resistance, technically bypassing active rational agency even if the outcome is benevolent.
