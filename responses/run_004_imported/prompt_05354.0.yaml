      *   **Resolute Choice (McClennen):** The agent makes a plan at $t_0$ and *resolves* to stick to it at $t_1, t_2$, even if local preferences change or suggest deviation. It requires a capacity for precommitment without external enforcement.
      *   **Sophisticated Choice (Strotz/Hammond):** The agent anticipates future choices. At $t_0$, I know what I will choose at $t_1$. If I know my future self will make a "bad" move (leading to the pump), I restrict my current choice set to avoid entering that path. It's backward induction.
      *   **The Tension:** Both strategies avoid the *outcome* of the money pump (losing money). But do they save the *preferences*?

  3.  **Address Question 1: Vindication vs. Relocation:**
