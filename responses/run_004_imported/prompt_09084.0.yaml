      *   *Standard Reading of "Animal":* Instinct, unthinking, biological.
      *   *The Synthesis:* Wittgenstein isn't contrasting "social" vs. "biological" as mutually exclusive. For Wittgenstein, human normativity *grows out of* natural history. We are language-using animals. Our "form of life" includes our biological nature.
      *   *The Specific Point in OC:* In *On Certainty*, the emphasis shifts slightly from the *normative rules* of language games (PI) to the *unthinking bedrock* that makes those games possible. The "animal" aspect highlights the *unreflective* nature of hinge certainty. It's not that it's *pre-social*, but that it is *pre-rational* (in the sense of prior to reasoning/justification).
      *   *Resolution:* The "form of life" is the *context* in which the "animal" certainty operates. The "animal" nature explains *why* it is beyond justification (you don't justify instincts). The "form of life" explains *why* it is shared (we share this animal nature + training).

  4.  **Address the Metaphysical Status (Belief vs. Non-Propositional):**
      *   *Doxastic View (Hinges are beliefs):* If hinges are "animal," does that make them non-doxastic? Not necessarily. Animals can have beliefs, but perhaps not "justified true beliefs."
      *   *Non-Doxastic/Non-Propositional View (Hinges are ways of acting):* The "animal" comment strongly supports the reading that hinges are not cognitive states subject to epistemic evaluation. They are more like reflexes or skills.
      *   *Connection:* If certainty is "animal," it suggests it belongs to the realm of *acting* rather than *judging*. This aligns with the "form of life" reading (what we *do*).
      *   *Conclusion:* This passage supports the "non-epistemic" or "enactivist" reading (e.g., Moyal-Sharrock) over the "epistemic foundationalist" reading (e.g., early Pritchard, though he evolved). It suggests hinges are not propositions we hold, but ways we behave.

