answer: |-
  This is an excellent question that cuts to the heart of the interpretive debates surrounding *On Certainty*. You have identified a genuine tension that has occupied Wittgenstein scholars for decades. The apparent conflict between the normative, communal connotations of "form of life" (*Lebensform*) and the biological, instinctual connotations of "something animal" (*tierisch*) is not accidental; it is where Wittgenstein is trying to locate the boundary between the space of reasons and the space of causes.

  Here is a way to reconcile these two characterizations, followed by an analysis of what this implies for the metaphysical status of hinges.

  ### 1. Reconciling "Form of Life" and "Animal"

  Your intuition is correct that in the *Philosophical Investigations*, "form of life" usually emphasizes the shared, normative, and linguistic practices of a community. However, in *On Certainty*, Wittgenstein is pushing the concept further back, toward what he sometimes calls "natural history."

  **The "Animal" is not Pre-Social, but Pre-Rational**
  When Wittgenstein says certainty is "something animal," he does not necessarily mean it is *pre-social* (i.e., belonging to a solitary human before entering society). Rather, he means it is *pre-rational* or *pre-justificatory*.
  *   **Form of Life:** This provides the *context*. It is the shared world in which we act. It explains why my hinges are the same as yours (we share a human form of life).
  *   **Something Animal:** This describes the *mode* of our engagement with that world. It explains *how* we hold these certainties. We do not hold them via inference, evidence, or commitment; we hold them as a dog holds its certainty that its master is at the door.

  The convergence happens in the concept of **training** (*Abrichtung*). In the *Investments*, Wittgenstein notes that learning language is not just explanation, but training. This training works on us as animals. Once the training is complete, the reaction is immediate and unthinking.
  *   Therefore, the "form of life" is the *inherited background* (social/biological mix), and the "animal" nature is the *unreflective functioning* of the agent within that background.
  *   Wittgenstein is arguing that our normative practices (form of life) rest upon a bedrock that is not itself normative, but factual/biological (animal). As he writes in §475: "I have arrived at the rock bottom of my convictions. And one might almost say that these foundation-walls are carried by the whole house."

  **Why the Self-Correction?**
  Notice the parenthetical in §358: *"(That is very badly expressed and probably badly thought as well.)"*
  Wittgenstein is wary of reifying "form of life" into a theory. If he says "It is a form of life," it sounds like a sociological thesis. If he says "It is animal," it sounds like a biological reductionism. He is struggling to point at something that is neither purely cultural nor purely biological, but the **intersection** where human nature meets human practice. He wants to stop the philosophical urge to ask "Why?" and instead point to the fact that we simply *act*.

  ### 2. Implications for the Status of Hinges

  This passage is a crucial piece of evidence in the debate over whether hinges are **beliefs** (doxastic) or **ways of acting** (non-doxastic/enactivist).

  **The Case for Non-Propositional/Enactivist Readings**
  The characterization of certainty as "animal" strongly supports the reading (championed by scholars like Danièle Moyal-Sharrock) that hinges are not propositional attitudes at all.
  *   **Propositions** belong to the space of reasons; they can be true or false, justified or unjustified.
  *   **Animal reactions** belong to the space of causes; they are simply effective or ineffective.
  *   If certainty is "animal," it suggests that hinge "certainty" is not a mental state of high confidence regarding a proposition (e.g., "I am 100% sure the earth exists"). Instead, it is a **disposition to act** (e.g., sitting on a chair without testing it first).

  In this reading, §359 suggests that hinges are not the *foundation* of knowledge (as in traditional foundationalism) but the **scaffolding** or the **rules of the game** manifested in action. You do not "believe" the rules of chess; you enact them. Similarly, you do not "believe" the world exists; you navigate it.

  **The Case for Non-Epistemic Beliefs**
  Other interpreters (like Duncan Pritchard in his earlier work on *On Certainty*) argue that hinges *are* beliefs, but they are **non-epistemic**. They are psychological states, but they fall outside the scope of justification.
  *   Even on this reading, the "animal" comment is vital. It explains *why* they are non-epistemic. Epistemic justification is a human, linguistic practice. Animal certainty is arational.
  *   However, the "animal" metaphor makes this harder to sustain. If I bite your hand, that is an animal reaction. If I say "I know I have hands," that is a linguistic move. Wittgenstein seems to be suggesting in §359 that the *certainty* underlying the linguistic move is of the same kind as the bite. This leans away from "belief" and toward "reflex."

  ### 3. Synthesis: How to Read the Passage in Seminar

  If you are discussing this in your seminar, you might propose the following synthesis:

  1.  **Naturalized Normativity:** Wittgenstein is naturalizing the normative. He is suggesting that our "form of life" (normative space) is not floating free; it is anchored in our "animal" nature (biological space). The hinge is the point where the biological becomes the normative.
  2.  **The Limit of Explanation:** The purpose of calling it "animal" is therapeutic. It is meant to shut down the epistemologist's question: "But how do you *know*?" Wittgenstein's answer is: "I don't know. I act. Like an animal."
  3.  **Action over Assertion:** This passage supports the view that hinges are best understood as **enacted certainties** rather than **held propositions**. We do not store "The world exists" in our belief box; we manifest it by looking for objects, walking through doors, etc.

  **Conclusion**
  Wittgenstein is not running together two conflicting pictures so much as he is trying to show that the distinction between "social/normative" and "biological/causal" breaks down at the bedrock. Our form of life *is* the life of a human animal.

  Regarding your final question: **Yes, the answer bears significantly on the status of hinges.** If certainty is "animal," it is difficult to maintain that hinges are standard propositional beliefs subject to epistemic evaluation (even if that evaluation is null). It strongly favors the interpretation that hinges are **non-propositional ways of acting** that make propositional language possible. They are not the *bottom rung* of the ladder of knowledge; they are the *ground* on which the ladder stands.

  **Suggested Secondary Reading for your Seminar:**
  *   **Danièle Moyal-Sharrock:** *Understanding Wittgenstein's On Certainty*. She argues most forcefully for the "animal" reading, calling hinges "animal certainty" and distinguishing them from knowledge claims.
  *   **Michael Williams:** *Unnatural Doubts*. He offers a contextualist reading that engages with the "form of life" aspect.
  *   **Annalisa Coliva:** *Moore and Wittgenstein*. She provides a detailed analysis of the "doxastic" vs. "non-doxastic" debate, which is directly relevant to your second question.
