answer: |-
  This is a textbook example of a specific type of rationality trap, and your intuition is spot on: you are currently living inside a behavioral economics case study. The fact that both sides are mirroring each other's logic ("we've spent too much to stop") confirms that this isn't just about the merit of the case anymore; it's about the structure of the conflict itself.

  Here is a breakdown of the mechanics of this spiral, the principled mathematical point where you should have stopped (and arguably still should), and how this trap is set in the first place.

  ### 1. Why does this spiral happen? (The Mechanics of the Trap)

  You have identified the **Sunk Cost Fallacy**, but in legal disputes, it combines with three other forces to create a perfect storm.

  **A. Escalation of Commitment**
  This is the psychological sibling of the sunk cost fallacy. Once we publicly commit to a course of action (filing a demand, hiring counsel), stopping feels like an admission of error. To protect our ego and self-narrative ("I am a professional who protects their work"), we invest *more* to justify the initial investment. The goal shifts from "winning the dispute" to "validating the decision to fight."

  **B. The Principal-Agent Problem**
  This is critical in your situation. You are the *Principal*; your lawyer is the *Agent*.
  *   **Your Incentive:** Maximize net recovery (Award minus Legal Fees) and minimize stress/time.
  *   **Your Lawyer's Incentive:** Billable hours and professional reputation (not losing a case).
  When your lawyer says, "That money's gone either way, so we might as well see it through," they are technically correct about the *past* money, but they are misaligned on the *future* money. Every hour they bill is revenue for them, but a cost for you. Because they are the expert, their definition of "seeing it through" (more discovery, more motions) naturally expands to consume the available budget. The other side's lawyer is doing the exact same thing.

  **C. Loss Aversion (Prospect Theory)**
  Humans feel the pain of a loss about twice as intensely as the pleasure of an equivalent gain.
  *   Walking away feels like locking in a **$22k loss**.
  *   Continuing feels like a chance to **avoid that loss** (by winning the $15k + fees).
  Even though the rational math says you will likely lose *more* than $22k if you continue, the psychological pain of "accepting the loss" right now is heavier than the abstract pain of "potentially spending more later."

  **D. The War of Attrition (Game Theory)**
  You are in a game of "Chicken." Both sides are hoping the other blinks first. Because you know the other side is also spending money they can't recover, you assume *they* are closer to breaking than you are. But since they are thinking the exact same thing about you, neither side blinks. You are both burning cash to prove who has more cash to burn, over a prize smaller than the fuel cost.

  ### 2. Is there a principled point at which continuing stops making sense?

  Yes. In decision theory, there is a very sharp line, though it is emotionally difficult to cross.

  **The Rule of Marginal Analysis**
  Sunk costs (the $22k) must be treated as **zero**. They do not exist. They are gone. The only question that matters is:
  *> Will the **next** dollar I spend generate more than one dollar in **expected value**?*

  **The Formula:**
  $$(\text{Probability of Win} \times \text{Total Recovery}) - \text{Cost to Finish} > 0$$

  Let's plug in your numbers conservatively:
  *   **Max Recovery:** $15k (You said this is the plausible cap).
  *   **Cost to Finish:** Let's estimate. If you've spent $22k in 8 months, and you are in the thick of it, finishing likely costs another $15k–$20k minimum.
  *   **Probability of Win:** Let's be optimistic and say 50% (legal outcomes are never 100%).

  **The Calculation:**
  $$(50\% \times \$15,000) - \$20,000 = -\$12,500$$

  Even with a 50% chance of winning, the *expected value* of continuing is negative $12,500.
  **The Principled Stopping Point:** You passed the rational stopping point the moment the *estimated cost to finish* exceeded the *maximum possible recovery*. Given your numbers, that likely happened around month 3 or 4.

  **The "Principle" Argument**
  Your lawyer frames this as "don't let them win for free." But consider this reframing:
  *   **Option A:** You spend $40k total to recover $15k. Net: -$25k. The press loses $20k in legal fees. The other author is stressed.
  *   **Option B:** You walk away. Net: -$22k. The press saves $20k. The other author is relieved.

  Is "principle" worth buying at a premium of $25,000? If you were writing a check to a charity called "Defeating Plagiarism," would you write it for $25k? If the answer is no, then continuing is not a principled stand; it is an emotional expense.

  ### 3. What could have been done differently to avoid the trap?

  This trap is structural. It exploits how the legal system and human psychology interact. Here is how it is avoided in the future:

  **A. The "Stop-Loss" Order**
  Before filing the first letter, you set a hard cap with yourself and your counsel. "I am willing to spend $5k to resolve this. If we cannot settle for a net positive within that budget, I withdraw." This forces the lawyer to prioritize settlement over litigation.

  **B. Alternative Fee Structures**
  Hourly billing creates the Principal-Agent problem mentioned above.
  *   **Contingency:** If the lawyer only gets paid if you win, they will settle quickly if the case is weak or the damages are low.
  *   **Capped Fees:** A hard ceiling on billing prevents the "just one more motion" spiral.

  **C. Early Mediation (The "Friend" Solution)**
  Your mediator friend didn't give you advice because her ethical framework requires neutrality, but she recognized the pattern.
  In commercial disputes, mediation should happen *before* positions harden. If you had mediated three months ago, the other author (who you are friendly with) could have been an ally. The real enemy is the Press's insurance or management, not the other writer. A mediated solution could have involved a joint statement, a future royalty split, or a credit, costing fractions of what you've spent.

  **D. Decoupling Ego from Asset**
  This is the hardest one. You viewed the plagiarism as an attack on your integrity (which it is). But in a legal context, it must be viewed as a depreciating asset. When the cost to repair the asset exceeds its value, you write it off.

  ### Summary for your reasoning

  You are currently in a **negative-sum game**. Every hour that passes, the total pot of money available to both sides shrinks, but neither side wants to be the one to acknowledge the shrinkage.

  *   **The Spiral:** Caused by Sunk Cost Fallacy + Loss Aversion + Lawyer Incentives.
  *   **The Stopping Point:** Mathematically, you passed it months ago. Principally, you stop when the cost of justice exceeds the value of the injustice.
  *   **The Prevention:** Pre-commitment to budget caps and early non-adversarial intervention.

  **One final thought:**
  Your lawyer says walking away is "handing the other side a win."
  I would argue that **continuing** is handing the *lawyers* a win. The press and the other author don't win if you spend another $10k; they just survive. The only party guaranteed to make money if you continue is the legal counsel on both sides.

  Sometimes the most rational, principled move is to declare the money dead, reclaim your time and mental energy, and refuse to pay the "spite tax" any longer.
