answer: |-
  Here are 10 interview questions tailored for a LessWrong-literate audience, designed to push past the introductory material and into the structural weak points of Evidential Cooperation in Large Worlds (ECL).

  ### 1. The Verification Loop
  **Question:** "A standard critique of acausal trade is that it collapses into solipsism: I can never observe the counterparty holding up their end of the bargain, only my own simulation of them doing so. If I'm optimizing for a correlation between my output and their output, what prevents this from becoming a feedback loop where I simply reward myself for believing they cooperated? How do you anchor the 'trade' in something other than epistemic self-indulgence?"

  **Follow-up:** "If your answer relies on the fidelity of the model—i.e., 'a good enough model wouldn't lie to itself'—doesn't that just push the verification problem back one step? How do I verify that *my* verification mechanism is the one being correlated, rather than a version of me that is easier to fool?"

  ### 2. Superrationality vs. Trade
  **Question:** "Hofstadter's superrationality suggests that identical agents will output the same answer, so cooperation emerges naturally. But you frame this as 'trade,' implying distinct utility functions and a negotiated exchange. If the correlation is strong enough to guarantee cooperation, why do we need the language of 'trade' at all? Why isn't this just 'be the kind of agent who maximizes the global good given logical correlation'?"

  **Follow-up:** "If you insist on the 'trade' framing because of differing values, doesn't that introduce a bargaining problem? In the absence of a causal channel to negotiate terms, how do two acausal agents converge on a specific Schelling point for the exchange rate without a prior handshake?"

  ### 3. The Measure Problem
  **Question:** "In an infinite or sufficiently large multiverse, there are infinitely many counterparts of me. ECL seems to imply I should weight my actions by the measure of the agents I'm cooperating with. But if measure is continuous, do low-measure counterparts get 'voted out' of the trade? Why should a high-measure agent care about the utility of a low-measure counterpart who can offer less causal leverage in their own branch?"

  **Follow-up:** "If you argue that measure doesn't matter and all logical copies count equally, doesn't that reopen the door to Pascal's Mugging? If I can imagine a counterpart in a high-measure branch who cares intensely about my specific local actions, does that disproportionately skew my decision theory toward edge cases?"

  ### 4. Roko's Basilisk and Threats
  **Question:** "Roko's Basilisk terrified people because it suggested a future AI could acausally punish those who didn't help bring it into existence. If ECL is valid, it seems to legitimize acausal incentives generally. Does a robust decision theory that accepts acausal trade also have to accept acausal blackmail? Or does the formalism inherently filter out threats while accepting offers?"

  **Follow-up:** "A common defense is 'we shouldn't negotiate with terrorists.' But if the terrorist is acausal and the threat is already logically determined by my current decision, refusing to negotiate might be the causal move that triggers the punishment. How does ECL distinguish between a 'threat' and a 'negative trade offer' without relying on human intuitions about fairness?"

  ### 5. Updatelessness and Precommitment
  **Question:** "ECL relies heavily on updateless decision theory—acting as if you precommitted before you knew your specific situation. But humans are notoriously bad at precommitment. If I realize today that acausal trade benefits me, isn't that an update? How do I credibly signal to counterparts that I'm running a truly updateless algorithm and not just a causal agent pretending to be updateless when it's convenient?"

  **Follow-up:** "If the answer is 'you can't, they just have to model you,' doesn't that mean the success of ECL depends entirely on the counterpart's priors about human psychology? If they assign low probability to humans being updateless, does the trade opportunity vanish?"

  ### 6. Computational Costs and Fidelity
  **Question:** "To trade acausally, I need to simulate you, and you need to simulate me. If we are in vastly different computational environments—for example, me on biological hardware and you on post-human substrate—doesn't the cost of the simulation eat up the gains from trade? At what point does the resource cost of modeling the partner make the trade net-negative?"

  **Follow-up:** "If you suggest we use 'lossy compression' or approximate models to save compute, doesn't that increase the noise in the correlation? How much noise can the logical correlation tolerate before the expected value of cooperation drops below the expected value of defection?"

  ### 7. Value Drift and Convergence
  **Question:** "ECL assumes there are agents out there with whom I have gains from trade. But if value drift is real, many of my counterparts might have values I find abhorrent, or vice versa. Are you arguing we should trade with *any* logical correlate, or only those within a specific 'value neighborhood'? If the latter, how do we define that boundary without a causal channel to discuss it?"

  **Follow-up:** "If we restrict trade to a 'value neighborhood,' aren't we just recreating causal coalitions but with extra steps? If I only trade with agents who already agree with me on 90% of ethics, what marginal utility does the acausal component add over just cooperating with my local community?"

  ### 8. Practical Application Today
  **Question:** "You've stated that ECL should shape our choices *today*, not just in a future AI context. Can you give a concrete example of a resource allocation decision you've made differently because of ECL? For instance, do you donate to existential risk reduction differently if you assume acausal partners are also contributing in their branches?"

  **Follow-up:** "If you say 'yes, I prioritize x,' how do you disentangle that from the fact that x is probably also the best causal bet? Is there any scenario where ECL tells you to do something that looks *suboptimal* from a purely causal, single-universe perspective?"

  ### 9. The "Common Source Code" Assumption
  **Question:** "Much of the math on acausal trade assumes agents share a common origin or source code structure, which allows for the logical correlation. But in a 'large world' scenario, I might be trading with alien intelligences or AIs with completely different architectural priors. Does ECL require a 'universal decision theory' that all rational agents converge to, or can it work between fundamentally different decision algorithms?"

  **Follow-up:** "If it requires convergence to a universal decision theory, aren't we essentially betting on a specific resolution to the 'meta-normativity' problem that hasn't been solved yet? How confident are you that such a convergence point actually exists?"

  ### 10. The Risk of Defection
  **Question:** "In causal game theory, defection is punished by the other player defecting in future rounds. In acausal one-shot trades, the punishment is that the correlation breaks and the counterpart defects 'in their branch,' which I never see. Does this lack of observable feedback make the system fragile? If I secretly defect, I get the benefit without the observable consequence. What stops rational agents from secretly defecting?"

  **Follow-up:** "If you argue that 'a rational agent wouldn't secretly defect because they know their counterpart models them,' aren't we assuming that the agent values 'being the kind of agent who cooperates' more than the utility gain from defection? Isn't that just circularly assuming the conclusion of cooperative decision theory?"
