  ive been lurking on LW and its offshoots for about a decade, and I finally get to put that to use -- I run a tiny podcast for my local rationalist-adjacent meetup, and next week's guest is a decision theorist (one of the loose 'evidential cooperation in large worlds' crowd) who's on record saying acausal trade isn't just a fun thought experiment but should actually be shaping some of our choices today. Draft me 8-10 interview questions that go beyond letting her restate 'two agents who can each accurately model the other can cooperate without any causal link between them.' I want atleast one question on the verification problem (you can never observe the other party actually reciprocating, so what stops this from collapsing into just trusting a simulation of a simulation), one on why this isn't just Hofstadter-style superrationality wearing a decision-theory trenchcoat -- i.e. why call it 'trade' rather than 'be the kind of agent who cooperates unconditionally' -- one on the measure problem across an infinite multiverse (which of your infinitely many correlated counterparts you're even bargaining with, and why the low-measure ones get any say), and one tying this back to why Roko's basilisk freaked so many people out, and whether that fear survives once you think through what a well-built decision theory actually does with threats. for each, throw in a follow-up keyed to whatever dodge she's most likely to reach for first.
