prompt: |-
  I've spent the last few weeks working through the classical arguments for the existence of God with a small reading group that grew out of some LessWrong-adjacent blogs and Discord servers I've followed for years, and this week's text was Aquinas's Third Way from the Summa Theologica. I already had a decent feel for cosmological arguments from contingency in their modern dress — Leibniz's version via the Principle of Sufficient Reason, or Alexander Pruss's contemporary defenses of it — but Aquinas's own formulation is terser and more thoroughly Aristotelian, and I keep getting stuck on one specific inferential move. Here is the relevant passage, in the standard Dominican Fathers translation:

  "The third way is taken from possibility and necessity, and runs thus. We find in nature things that are possible to be and not to be, since they are found to be generated, and to corrupt, and consequently they are possible to be and not to be. But it is impossible for these always to exist, for that which is possible not to be at some time is not. Therefore, if everything is possible not to be, then at one time there could have been nothing in existence. Now if this were true, even now there would be nothing in existence, because that which does not exist only begins to exist by something already existing. Therefore, if at one time nothing was in existence, it would have been impossible for anything to have begun to exist; and thus even now nothing would be in existence — which is absurd."

  (Aquinas then goes on to conclude that there must therefore be something whose existence is necessary in itself, which he identifies with God, but that final stretch isn't what's tripping me up.)

  The move that bothers me is the slide from "every contingent thing is, at some time or other, not in existence" to "there was some one time at which nothing at all was in existence." One person in the reading group, who did graduate work in philosophy of religion, said this looks like the same complaint Anthony Kenny made against the Third Way: that it's a quantifier-shift fallacy, structurally identical to inferring "there was a moment when every seat in the theater was empty" from the much weaker "every seat was, at some point during the run, empty." I'd like help thinking through whether that charge really sticks. Is there a charitable reading of Aquinas — maybe turning on the per se/per accidens distinction, or on background Aristotelian commitments about matter, corruption, and an eternally old universe — that blocks the fallacious inference and lets the argument go through in something like its original form? And if the move can't be salvaged, does the broader contingency-style cosmological argument survive in some other guise, such as Leibniz's or a contemporary modal formulation, that doesn't rely on this particular piece of temporal-frequency reasoning at all?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is part of a LessWrong-adjacent reading group discussing classical arguments for God, specifically Aquinas's Third Way.
      *   **Background:** They understand modern contingency arguments (Leibniz, Pruss) but find Aquinas's formulation tricky.
      *   **Specific Problem:** The inferential move from "every contingent thing is at some time not in existence" to "there was a time when *nothing* was in existence."
      *   **Specific Objection:** The "Quantifier Shift Fallacy" (Anthony Kenny's objection): $\forall x \exists t (\neg E(x,t)) \nrightarrow \exists t \forall x (\neg E(x,t))$. (For every thing, there is a time it doesn't exist $\nrightarrow$ There is a time when every thing doesn't exist).
      *   **Questions:**
          1.  Is Kenny's charge valid?
          2.  Is there a charitable reading of Aquinas (Aristotelian physics, *per se* vs. *per accidens*, etc.) that blocks the fallacy?
          3.  If not salvageable, do modern contingency arguments (Leibniz/Pruss) survive without this temporal reasoning?
      *   **Tone:** Intellectual, rigorous, philosophically nuanced, respectful of the LessWrong/rationalist background (analytic, precise).

  2.  **Deconstruct the Third Way (The "Problematic" Move):**
      *   *Premise 1:* We find contingent things (possible to be and not to be).
      *   *Premise 2:* If something is possible not to be, at some time it is not. (This is the first contentious point, but the user is focused on the next step).
      *   *Premise 3:* If *everything* is possible not to be, then at one time there was nothing.
      *   *Premise 4:* If at one time there was nothing, nothing would exist now (ex nihilo nihil fit).
      *   *Conclusion:* Something necessary must exist.
      *   *The Fallacy:* As the user notes, just because every contingent thing fails to exist at *some* time, it doesn't mean they all fail to exist at the *same* time. Contingent things could replace each other in an infinite chain.

  3.  **Address Question 1: Does Kenny's Charge Stick?**
      *   *Short Answer:* Yes, on a standard logical reading, it is a quantifier shift fallacy.
      *   *Nuance:* However, Aquinas isn't doing modern symbolic logic. He's working within Aristotelian physics/cosmology.
      *   *Evaluation:* Kenny is right about the logic *if* we treat "possible not to be" as purely modal and time as a linear container. But Aquinas might mean something stronger by "possible not to be."

  4.  **Address Question 2: Charitable Readings (Saving the Third Way):**
      *   *Reading A: Aristotelian Physics (Corruption).*
          *   For Aquinas/Aristotle, "possible not to be" isn't just modal contingency; it implies a tendency toward non-existence (corruption).
          *   If *everything* has a tendency to cease existing, and time is infinite (Aquinas assumes an eternal past for the sake of argument often), then given infinite time, everything *would* eventually cease.
          *   If the causal chain is essentially ordered (per se), the cessation of one stops the rest. If accidentally ordered (per accidens), maybe not.
          *   *Problem:* Aquinas distinguishes the Third Way from the Second Way (efficient causes). The Third Way is about existence itself.
      *   *Reading B: The "Totality" Reading (Neo-Thomistic).*
          *   Some scholars (like Brian Davies) argue Aquinas isn't talking about a temporal beginning but about ontological dependence *now*.
          *   However, the text explicitly says "at one time there could have been nothing" (*aliquando nihil fuisse in rebus*). This is temporal.
      *   *Reading C: The "Infinite Time" Argument.*
          *   If the universe is eternal (which Aquinas thought philosophically plausible), and every being is contingent (capable of not existing), then over infinite time, the probability of *all* of them existing simultaneously drops to zero?
          *   This requires a probabilistic assumption Aquinas doesn't explicitly state.
      *   *Reading D: Essential vs. Accidental Contingency.*
          *   Maybe Aquinas means that if *all* beings are contingent, the *collection* is contingent. If the collection is contingent, it can fail to exist.
          *   This leans closer to Leibniz.
      *   *Best Charitable Interpretation:* The argument relies on the Aristotelian view that "possible to be and not to be" implies a *potency* for non-being that must eventually be actualized given infinite time. If *everything* has this potency, and there is no necessary being to sustain them, eventually that potency is actualized for everything. Since they can't start themselves, nothing would follow.
      *   *Verdict:* It's still weak logically by modern standards, but less "dumb" if you accept Aristotelian physics where contingency implies eventual corruption.

  5.  **Address Question 3: Modern Contingency Arguments (Leibniz/Pruss):**
      *   *Shift:* Move from temporal (cosmological *in fieri*) to ontological (cosmological *in esse*).
      *   *Leibniz:* Principle of Sufficient Reason (PSR). Why is there something rather than nothing? The explanation cannot be in the contingent series itself.
      *   *Pruss:* Modal versions. If it's possible that nothing exists, and if nothing exists, nothing would come to exist. But something exists. So it's not possible that nothing exists. (Wait, that's Kalam-ish).
      *   *Pruss's PSR Argument:* Every contingent fact has an explanation. The existence of the universe is a contingent fact. Therefore, it has an explanation. The explanation must be a necessary being.
      *   *Advantage:* Avoids the temporal quantifier shift entirely. It deals with ontological dependence, not temporal succession.
      *   *LessWrong Angle:* This connects to "Why is there something rather than nothing?" and Bayesian priors on necessary beings.

  6.  **Synthesize and Structure the Response:**
      *   **Introduction:** Acknowledge the sophistication of the question. Validate the Kenny objection (it's the standard objection).
      *   **Section 1: The Quantifier Shift.** Explicitly formalize the fallacy ($\forall x \exists t \to \exists t \forall x$). Confirm Kenny is logically correct *on the surface*.
      *   **Section 2: Charitable Readings of Aquinas.**
          *   *Aristotelian Physics:* Contingency = Corruptibility. Infinite time + universal corruptibility = eventual universal non-existence.
          *   *Per Se vs. Per Accidens:* If the chain of contingent beings is *per se* (dependent on a prior cause for current existence), the failure of one stops the chain. But Aquinas treats this in the Second Way. In the Third Way, it's about the *totality* of contingent beings.
          *   *The "Collection" Argument:* If every part is contingent, is the whole contingent? Aquinas seems to assume yes.
      *   **Section 3: The Modern Shift (Leibniz/Pruss).**
          *   Explain the move from temporal to ontological contingency.
          *   Explain how this bypasses the quantifier shift (no "time" variable involved).
          *   Mention the PSR.
      *   **Section 4: LessWrong/Rationalist Context.**
          *   Connect to "optimality," "selection effects," or "measure."
          *   Mention that modern analytic philosophy of religion (Pruss, Koons, Rasmussen) largely agrees with Kenny on Aquinas but thinks the *intuition* behind the Third Way is saved by modal logic.
      *   **Conclusion:** Summarize. The text as written likely commits the fallacy, but the *insight* (contingency requires a ground) survives in modern dress.

  7.  **Refine the Content (Self-Correction/Nuance Check):**
      *   *Correction:* Be careful not to say Aquinas *definitely* meant the probabilistic infinite time argument. He doesn't explicitly say it. But it's the only way to make the inference valid.
      *   *Nuance:* Distinguish between "necessary in itself" (God) and "necessary by another" (eternal matter). Aquinas argues for the former.
      *   *Tone Check:* Ensure I don't sound dismissive of Aquinas (he's a giant) but also don't pretend the fallacy isn't there. The user is looking for philosophical clarity, not apologetics.
      *   *LessWrong Connection:* The user mentioned LW. I should briefly touch on how this relates to rationalist epistemology (e.g., Solomonoff induction, priors on simplicity/necessity). Actually, keep it focused on philosophy of religion to avoid drifting too far, but acknowledge the analytic rigor common in that community.

  8.  **Final Polish:** Check the Latin terms (*per se*, *per accidens*, *in fieri*, *in esse*). Ensure the distinction between the Second and Third Way is clear (causes vs. contingency).

  *(Self-Correction during drafting)*: I need to make sure I address the "eternal universe" point. Aquinas actually believed the world *could* be eternal (faith tells us it isn't, reason can't prove it began). So the Third Way *must* work even if the universe has no beginning. This strengthens the "infinite time" reading. If the universe is eternal and everything is contingent, eventually nothing would exist.

  Okay, ready to write.
answer: |-
  This is an exceptionally sharp reading of the text. You have identified the exact hinge upon which the Third Way turns, and your reading group's invocation of Anthony Kenny is spot-on: Kenny's *The Five Ways* (1969) made the "quantifier shift" objection the standard analytic critique of this argument.

  To answer your questions directly: Yes, on a strictly logical reading of the text provided, the charge sticks. However, whether the argument is *defeasible* depends on whether you read Aquinas as doing bad logic or as relying on unstated Aristotelian physical premises that change the modal force of "possible not to be." Furthermore, the modern contingency arguments you mention (Leibniz, Pruss) generally succeed precisely by abandoning the temporal framework that makes Aquinas vulnerable to this objection.

  Here is a breakdown of the fallacy, the charitable Aristotelian reconstruction, and the survival of the argument in modern dress.

  ### 1. The Quantifier Shift Objection

  Formally, the objection is exactly as your friend described. Let $C(x)$ mean "$x$ is contingent" (possible to be and not to be) and $E(x, t)$ mean "$x$ exists at time $t$."

  Aquinas argues:
  1.  $\forall x (C(x) \rightarrow \exists t (\neg E(x, t)))$
      *(For every contingent thing, there is a time at which it does not exist.)*
  2.  Therefore: $\exists t (\forall x (\neg E(x, t)))$
      *(There is a time at which every thing does not exist.)*

  In standard predicate logic, this is invalid. It is the difference between "Everyone has a mother" and "There is someone who is everyone's mother." Contingent beings could succeed one another in an infinite chain without ever a moment of universal nothingness. If the universe is eternal, and contingent beings simply replace one another *per accidens* (like fathers begetting sons), premise 1 can be true while premise 2 is false.

  Kenny is right that if this is all the argument is, it is a elementary logical error. But Aquinas is writing within a specific cosmological framework that might bridge this gap.

  ### 2. Charitable Readings: Aristotelian Physics and Time

  To salvage the inference, we must look at what Aquinas means by "possible to be and not to be" (*possibile est non esse*). In modern modal logic, contingency is a property of propositions or essences. In Aristotelian physics, it is a property of matter and form involving a *potency* for corruption.

  **A. The "Infinite Time" Argument**
  Aquinas famously held that reason cannot prove the world had a beginning (he believed it on faith, but thought an eternal universe was philosophically coherent). Therefore, the Third Way must work even if the universe is infinitely old.
  If the universe is infinitely old, and every being has an intrinsic potency for non-existence (corruption), then given infinite time, that potency *must* be actualized.
  *   **The Bridge:** If *everything* that exists is contingent, then *everything* has a tendency to cease existing. In an infinite past, there has been enough time for everything to simultaneously exhaust its potency for existence.
  *   **The Weakness:** This still requires a probabilistic assumption: that the "failure to exist" of contingent beings would synchronize. Why couldn't contingent being A cease exactly as contingent being B begins, forever? Aquinas seems to assume that without a *necessary* ground, the totality of contingent beings has no stability. He is treating the collection of contingent things as itself a contingent thing.

  **B. Per Se vs. Per Accidens Causal Series**
  This is usually reserved for the Second Way (efficient causes), but it bleeds into the Third.
  *   *Per accidens:* A father begets a son. The father can die while the son lives. The son's existence is not currently dependent on the father's existence.
  *   *Per se:* A hand moves a stick that moves a stone. If the hand stops, the stick stops moving the stone immediately.
  If the Third Way is interpreted as claiming that all contingent beings are linked in a *per se* chain of ontological dependence (sustenance) rather than just temporal generation, then if the ground of the chain fails, everything fails simultaneously.
  *   **The Problem:** Aquinas explicitly distinguishes the Third Way from the Second. The Third Way is about *possibility and necessity*, not efficient causation. However, many Neo-Thomists (like Etienne Gilson) argue that for Aquinas, "existence" is an act that must be continually sustained. If everything is contingent, everything is merely "borrowing" existence. If there is no lender (Necessary Being), the loan defaults everywhere. This moves the argument from temporal frequency to ontological dependence, which anticipates Leibniz.

  **C. The Totality Interpretation**
  Some scholars argue Aquinas isn't arguing from the contingency of individual parts to a time when all parts vanish, but rather that the *totality* of contingent things is itself contingent.
  *   If the set of all contingent things $S$ is contingent, then it is possible for $S$ not to exist.
  *   If it is possible for $S$ not to exist, then (given infinite time) there was a time when $S$ did not exist.
  *   **Critique:** This commits the Fallacy of Composition (just because every part of a wall is small, the wall is not small). However, if existence is not a predicate but an act, the "totality of existence" might be treated as a single metaphysical fact that requires explanation.

  ### 3. The Modern Survival: Leibniz and Pruss

  You asked if the broader contingency argument survives in a guise that avoids this temporal reasoning. The answer is a definitive **yes**. In fact, most contemporary philosophers of religion (including analytic Thomists like Brian Davies or David Braine) concede Kenny's point on the *textual* Third Way but argue the *intuition* is rescued by shifting from temporal contingency to ontological contingency.

  **A. Leibniz's Principle of Sufficient Reason (PSR)**
  Leibniz abandons the temporal "there was a time when nothing existed" move.
  *   **Argument:** For any fact $F$, there must be a sufficient reason why $F$ is true rather than false.
  *   **Application:** The fact "The universe of contingent things exists" is a contingent fact. Its explanation cannot be found within the series of contingent things (that would be circular). Therefore, the explanation must be outside the series, in a Necessary Being.
  *   **Advantage:** No quantifier shift over time is needed. It doesn't matter if the universe is eternal or had a beginning. It doesn't matter if contingent things replace each other. The question is "Why is there *anything* contingent at all?" rather than "When did the contingent things vanish?"

  **B. Alexander Pruss and Modal Cosmological Arguments**
  Pruss (in *The Principle of Sufficient Reason: A Reassessment* and other works) defends a modal version that looks like this:
  1.  Every contingent fact has an explanation.
  2.  The existence of the cosmos is a contingent fact.
  3.  Therefore, the existence of the cosmos has an explanation.
  4.  The explanation must involve a necessary being (since a contingent explanation would just push the question back).

  This avoids the temporal frequency issue entirely. It relies on the PSR, which is controversial (Hume and Kant reject it), but it is not logically invalid in the way the Third Way's temporal move is.

  **C. The "Existential Inertia" Counter-Argument**
  It is worth noting that even modern versions face a challenge from "Existential Inertia" (defended by thinkers like J.J.C. Smart or more recently by some analytic atheists). This view holds that things, once existing, tend to continue existing without needing a sustaining cause. Aquinas's Third Way implicitly denies existential inertia (things tend toward non-being). Modern arguments must explicitly argue *against* existential inertia to get off the ground, whereas Aquinas took Aristotelian corruption as a given.

  ### 4. A LessWrong-Adjacent Perspective

  Given your background, you might appreciate framing this in terms of **Bayesian priors and model complexity**.

  *   **Aquinas's Model:** Assumes a universe where "non-existence" is the default state (entropy/corruption) and "existence" requires active maintenance. In this model, a universe of only contingent beings has a high "decay rate." Over infinite time, the probability of the system remaining in the "exists" state approaches zero unless there is a "stable anchor" (Necessary Being).
  *   **The Fallacy:** The error is assuming the decay of individual components implies the decay of the system state, without accounting for regeneration mechanisms (new contingent beings popping into existence).
  *   **Leibniz/Pruss Model:** This is a compression argument. A world containing a Necessary Being is a "simpler" explanation for the existence of contingent things than a brute fact contingency. It appeals to a meta-law (PSR) that forbids brute facts.
  *   **The Rationalist Critique:** A LessWrong-style critique would likely attack the PSR. Why think reality *must* be compressible into a sufficient reason? Why not accept a brute fact prior? However, if one accepts that "things shouldn't just happen without cause" as a strong prior, the modal argument is robust, whereas the temporal Third Way is fragile.

  ### Summary

  1.  **Does Kenny's charge stick?** Yes. Textually, Aquinas commits a quantifier shift fallacy regarding time. $\forall x \exists t \neg E(x,t)$ does not entail $\exists t \forall x \neg E(x,t)$.
  2.  **Is there a charitable reading?** Only if you import heavy Aristotelian physics: specifically, that "contingent" implies "intrinsically corruptible" and that an infinite past guarantees the actualization of all corruptions simultaneously in the absence of a necessary sustainer. This makes the argument less about logic and more about physical cosmology.
  3.  **Does the argument survive?** Yes, but it must shed the temporal clothing. The Leibnizian/Pruss shift to **ontological dependence** (Why is there something rather than nothing?) bypasses the quantifier shift entirely. It argues that the *collection* of contingent things is itself contingent and requires an external ground, regardless of temporal succession.

  If your reading group wants to pursue the strongest version of this line of reasoning, I recommend pivoting from the *Summa* to Leibniz's *On the Ultimate Origination of Things* or Pruss's *The Principle of Sufficient Reason*. They preserve the metaphysical insight (contingency requires a ground) without the logical vulnerability of the temporal inference.
