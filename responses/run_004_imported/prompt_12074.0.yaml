  When you submit your peer review, be gentle but firm on that last point. In a Philosophy/Econ cross-list, the normative stakes (is the theory wrong or is the person wrong?) are just as important as the math. Your classmate nailed the math but flipped the philosophy. If you see other answers that claim Allais wanted to "fix" the agents rather than "fix" the theory, mark them down similarly so the grading curve remains consistent.
