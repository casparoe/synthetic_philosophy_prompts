answer: |-
  This is an excellent question that cuts to the heart of the transition from classical Nyāya to Navya-Nyāya (New Logic), specifically Gaṅgeśa's *Tattvacintāmaṇi*. You are right to be suspicious of the "externalist" label if it is not unpacked; without the machinery of the *utpatti/jñapti* distinction and the specific Nyāya theory of doubt, the *parataḥ* view does indeed look like it either collapses into an infinite regress or covertly accepts a *svataḥ* foundation.

  Here is the structural breakdown of the Nyāya response, the mechanism for stopping the regress, and the philosophical cost-benefit analysis that justifies the extra machinery against Kumārila.

  ### 1. The Distinction: *Utpatti* vs. *Jñapti*

  To understand the Nyāya block against the regress, we must first precise the target. The Mīmāṃsaka (Kumārila) argues that if validity (*prāmāṇya*) is extrinsic, you need a second cognition to validate the first, a third to validate the second, *ad infinitum*.

  Nyāya accepts the premise that validity is extrinsic but denies that this necessitates an infinite chain of *explicit validating cognitions* for every instance of knowledge. They do this by distinguishing two questions that the Mīmāṃsaka often conflates:

  1.  **What produces the validity?** (*Prāmāṇyotpatti*)
  2.  **What produces the *knowledge* of that validity?** (*Prāmāṇyajñapti*)

  **Nyāya's Stance:** Both are *parataḥ* (extrinsic).
  **Kumārila's Stance:** Both are *svataḥ* (intrinsic).

  **The Mechanism:**
  *   **Utpatti (Production):** A cognition is valid not because "knowing" implies "truth," but because it is produced by a specific set of causal conditions (*kāraṇa*) free from defects (*doṣābhāva*) and endowed with excellences (*guṇa*). For perception, this is proper sense-object contact (*sannikarṣa*). The validity is "extrinsic" because it depends on these external causal factors, not the mere arising of the cognition.
  *   **Jñapti (Ascertainment):** We come to *know* that a cognition is valid usually through inference (*anumāna*). We infer the validity of the cognition "This is water" from the successful action (*pravṛtti-sāmarthya*) of drinking and quenching thirst.

  **Why this matters for the regress:**
  The Mīmāṃsaka assumes that if validity is *parataḥ*, I must *perform a validation act* for every cognition before I can hold it as knowledge. Nyāya denies this. The validity is *there* (ontologically) due to the causal conditions, even if I haven't yet *ascertained* it (epistemically). I can act on the cognition presumptively. The demand for *jñapti* (ascertainment) arises only when there is doubt (*saṃśaya*).

  ### 2. Stopping the Regress: The Gaṅgeśa Move

  You asked if the regress is stopped in a principled way or merely relocated. In classical Nyāya (Udayana, etc.), the response was often pragmatic: we stop when doubt is removed. But Gaṅgeśa (14th century), in the *Prāmāṇya-vāda* section of the *Tattvacintāmaṇi*, provides the rigorous logical structure you are looking for.

  Gaṅgeśa acknowledges the regress worry (*anavasthā*). If the validity of Cognition 1 is known by Cognition 2, what validates Cognition 2?

  **The Solution: The Shift from Cognition to Causal Efficacy (*Arthakriyā*)**
  Gaṅgeśa argues that the chain of validation does not consist entirely of *cognitions*. It terminates in **practical success** (*arthakriyā*), which is not a cognition but a state of affairs or an event.

  1.  **C1:** "There is water." (Validity depends on causal conditions).
  2.  **Action:** Drinking.
  3.  **Result:** Thirst is quenched. (This is *arthakriyā*).
  4.  **C2:** "My cognition of water was valid." (This is an inference based on the Result).

  **The Regress Block:**
  Does C2 need validation?
  *   **Nyāya:** Yes, technically. But C2 is validated by *further* successful action or by the absence of contradictory evidence.
  *   **The Crucial Turn:** The regress is **potential, not actual**. We do not need to validate C2 *unless* a specific doubt arises regarding the connection between thirst-quenching and water (e.g., "Was it a hallucination of quenching?").
  *   **Principled Stop:** The chain stops not because we find a *self-validating cognition* (which Nyāya denies exists), but because the **burden of proof lies with the doubter**. In the absence of specific defeaters (*bādhaka*), the causal chain is presumed reliable.

  **Is this smuggling in *Svataḥ*?**
  This is your sharpest point. If we treat C1 as valid until proven otherwise, aren't we treating it as *de facto svataḥ*?
  Gaṅgeśa's reply distinguishes between **ontological status** and **epistemic presumption**.
  *   **Ontologically:** C1 is *parataḥ*. Its truth *depends* on external conditions. If those conditions were defective, C1 would be false. It does not carry truth within itself.
  *   **Epistemically:** We operate under a **presumption of reliability** (*yāthārthya-gṛha*). This is not because the cognition reveals its own truth, but because human survival depends on acting without infinite verification.

  So, the regress is stopped by shifting the default position from "Validate everything" to "Validate only upon doubt." This is not *svataḥ prāmāṇya* (intrinsic validity) but **default externalism**. The validity is still extrinsic; we just don't always check the extrinsic sources.

  ### 3. The Role of *Anuvyavasāya* (Second-Order Cognition)

  You mentioned *anuvyavasāya*. This is the Nyāya doctrine that cognitions are not self-revealing (*svaprakāśa*). To know "I see the pot," I need a second cognition: "I know that I see the pot."

  **How this fits the Regress:**
  The Mīmāṃsaka argues: "If you need a second cognition to know the first, you need a third to know the second..."
  Nyāya replies:
  1.  **Infinite Regress is harmless here:** Nyāya accepts that there *can* be an infinite series of *anuvyavasāya* cognitions potentially. However, they do not all need to occur *simultaneously*.
  2.  **Validation vs. Awareness:** *Anuvyavasāya* makes me *aware* of the cognition. It does not necessarily *validate* its truth. Validation comes from *pravṛtti-sāmarthya* (success).
  3.  **The Stopper:** I only generate an *anuvyavasāya* when I reflect. I do not reflect on every cognition. Therefore, the regress of *anuvyavasāya* is not triggered in ordinary experience. When I do reflect, the validity of that reflection is again determined by external causal conditions, not by a third cognition's intrinsic nature.

  ### 4. Why Accept the Cost? (Nyāya vs. Kumārila)

  Given Nyāya's commitment to *lāghava* (economy/parsimony), why take on this complex *parataḥ* machinery when Kumārila's *svataḥ* view seems simpler? Nyāya offers three main arguments that the "simpler" view is actually more costly metaphysically and epistemically.

  #### A. The Symmetry of Truth and Error (*Yāthārthya / Ayāthārthya*)
  This is the strongest Nyāya argument.
  *   **Kumārila:** Validity is *svataḥ* (intrinsic); Invalidity is *parataḥ* (extrinsic, caused by defects).
  *   **Nyāya Objection:** This is asymmetrical and ad hoc. Why should truth arise from the very nature of cognition, while falsity requires external defects? Both true and false cognitions are mental events.
  *   **Nyāya Alternative:** Both truth and falsity are *parataḥ*. A true perception is caused by *guṇas* (excellences in the causal chain); a false perception (e.g., seeing silver in nacre) is caused by *doṣas* (defects like distance, bad light, memory confusion).
  *   **Economy:** It is more parsimonious to have **one causal theory** for all cognitions (they depend on causes) than to posit a special metaphysical power (*śakti*) inherent in cognitions that guarantees truth unless interfered with. Nyāya argues *svataḥ* requires positing an unobservable "truth-revealing power" in every cognition, which violates *lāghava*.

  #### B. The Problem of Dogmatism
  Nyāya is fundamentally a school of debate and critical inquiry (*tarka*).
  *   If validity is *svataḥ*, then every cognition presents itself as true immediately. To doubt it requires positive evidence of defects.
  *   Nyāya argues this leads to dogmatism. If I have a prejudice or a dream cognition, *svataḥ* theory suggests I must treat it as valid until I find a defect.
  *   *Parataḥ* theory aligns with critical fallibilism: A cognition is only accepted as knowledge after it has been vetted by external criteria (successful action, coherence with other knowledge). The "cost" of extra machinery is the price of avoiding error.

  #### C. The Definition of Knowledge (*Pramā*)
  *   **Mīmāṃsā:** *Pramā* is a cognition that is both novel (*anadhigata*) and non-contradicted (*abādhita*).
  *   **Nyāya:** *Pramā* is a veridical cognition (*yāthārthya-anubhava*).
  *   For Nyāya, truth is **correspondence** (*sārūpya*) between the cognition and the object. Correspondence is a *relation*. A relation cannot be intrinsic to one relatum (the cognition). It depends on the other relatum (the object). Therefore, validity *must* be *parataḥ*. To claim it is *svataḥ* is to deny the relational nature of truth.

  ### 5. Summary: The Analytic Bridge

  To map this to your analytic background:

  1.  **Kumārila (Svataḥ):** A form of **Internalist Dogmatism** or **Phenomenal Conservatism**. "Seems true" implies "Justified" unless defeated.
  2.  **Nyāya (Parataḥ):** A form of **Externalist Reliabilism** with a **Contextualist** theory of justification.
      *   **Reliabilism:** A belief is justified if produced by a reliable process (defect-free causes).
      *   **Contextualism:** We do not need to *know* the process is reliable to *have* knowledge (blocking the regress). We only need to demonstrate reliability when the context (debate/doubt) demands it.

  **The Verdict on the Regress:**
  Nyāya does not solve the regress by finding a foundational *self-validating cognition*. They dissolve the regress by arguing that the demand for validation is **conditional on doubt**. The "foundation" is not a cognition, but **successful practice** (*arthakriyā*).

  Is *svataḥ* smuggled in? **No,** because the *status* of the cognition remains dependent on external causes. The *acceptance* of the cognition is default, but its *validity* is not intrinsic. The "side door" is closed because Nyāya distinguishes between **psychological certainty** (which we have by default) and **epistemic validity** (which is extrinsic).

  **Why the Cost?**
  Because Nyāya prioritizes **causal explanation** over **phenomenological economy**. It is "cheaper" to use observable causal conditions (*guṇa/doṣa*) to explain truth/falsity than to posit a mysterious intrinsic truth-power (*svataḥ śakti*) that occasionally fails. For the Naiyāyika, Kumārila's simplicity is an illusion purchased at the price of explanatory power.
