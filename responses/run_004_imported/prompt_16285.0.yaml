prompt: |-
  Since watching Oppenheimer this year, I've argued with my father, a retired Air Force officer, over whether it's even fair to judge Truman's decision by the standards of moral philosophy at all. For an upcoming episode of the ethics podcast I co-host, I'm interviewing a philosopher who has built his career defending Elizabeth Anscombe's charge — made in "Mr. Truman's Degree," the pamphlet she wrote after Oxford's 1956 vote to grant Truman an honorary degree — that Truman was a murderer for ordering the bombing of Hiroshima and Nagasaki. Please draft eight to ten interview questions that go beyond a Wikipedia-level restatement of the doctrine of double effect. Include one question on the "closeness problem" facing the intention/foresight distinction his whole case rests on; one on whether Anscombe's charge in "Modern Moral Philosophy" — that treating the intentional killing of the innocent as an open question of cost-benefit calculation shows a corrupt mind — is an argument or a refusal to give one; and one on whether the same reasoning convicts the architects of conventional terror-bombing campaigns, such as Dresden and Tokyo, just as much as it convicts Truman. For each of these three, add a follow-up keyed to the answer he's likely to give, and close with a question linking his position to present-day nuclear deterrence policy.
