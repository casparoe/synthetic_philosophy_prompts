answer: |-
  Here are nine interview questions designed for your ethics podcast, structured to move from the historical specifics to the philosophical mechanics, and finally to contemporary implications. They are drafted to respect the guest's Anscombean framework while pressing on the difficulties inherent in that position.

  **1. The Legitimacy of Judgment**
  "Elizabeth Anscombe's pamphlet *Mr. Truman's Degree* is famous not just for its conclusion, but for its audacity: a philosopher standing before a university assembly to call a head of state a murderer. My father, a retired Air Force officer, argues that applying the rigid categories of moral philosophy to the fog of war is a category error—that command decisions exist in a realm of 'necessity' where civilian ethics don't apply. How do you respond to the claim that judging Truman by peacetime moral standards is itself an unjust act?"

  **2. The Specific Charge**
  "Anscombe argues that Truman is guilty of murder because he *intended* the death of civilians as a means to an end, rather than merely foreseeing it as a side effect. In the context of the Doctrine of Double Effect, can you clarify why the destruction of Hiroshima cannot be categorized as the destruction of a 'military target' (the city as a war-making entity) where civilian death is a foreseen but unintended consequence?"

  **3. The Closeness Problem (Intention vs. Foresight)**
  "Critics of the Doctrine of Double Effect often point to the 'closeness problem.' They argue that the distinction between *intending* a bad effect and *foreseeing* it often collapses depending on how you describe the action. If Truman's goal was 'ending the war,' and he knew the *only* mechanism available to achieve that was the incineration of civilians, isn't the death of those civilians functionally intended as the means, regardless of how he described it to himself? How do you prevent the intention/foresight distinction from becoming a semantic loophole?"

  *   **Follow-up:** "If you argue that Truman's intention is discernible and distinct from mere foresight, does that rely on accessing his internal mental state? If so, does your argument hold if we assume a hypothetical President who *did* view the civilians purely as a psychological lever, explicitly stating, 'I am killing them to scare the Emperor'? At what point does the description of the act force the moral condemnation, regardless of the agent's internal psychology?"

  **4. Conventional Terror Bombing**
  "Anscombe's critique is often applied specifically to the atomic bomb, but the firebombing of Tokyo and the bombing of Dresden occurred under the same strategic logic: destroying civilian morale to break the enemy's will. Does your defense of Anscombe's charge against Truman necessarily convict Curtis LeMay and Arthur Harris of the same crime? Is there a moral distinction between killing 100,000 people with conventional incendiaries versus one nuclear device, or does the principle render them equally guilty?"

  *   **Follow-up:** "If you answer that they are equally guilty, we face a historical puzzle: why does the 'nuclear taboo' exist so potently around Hiroshima while Dresden is often treated as a tragic necessity of total war? Does focusing so heavily on Truman inadvertently let the architects of conventional terror bombing off the hook by treating the *weapon* as the moral problem rather than the *intent*?"

  **5. The "Corrupt Mind" Charge**
  "In *Modern Moral Philosophy*, Anscombe writes that treating the intentional killing of the innocent as an open question of cost-benefit calculation shows a 'corrupt mind.' Some critics argue this isn't a philosophical argument but a refusal to give one—an ad hominem that shuts down debate by questioning the moral character of the consequentialist. Do you view this as a substantive philosophical claim about the limits of utilitarianism, or is it a rhetorical move designed to mark certain conclusions as beyond the pale of reasonable discourse?"

  *   **Follow-up:** "If it is a diagnosis of moral corruption rather than a deductive argument, how do we persuade a policymaker or a citizen who disagrees? If the gap between your position and a consequentialist's is that they have a 'corrupt mind,' does that make moral consensus in a democracy impossible, reducing ethics to a clash of irreconcilable moral psychologies?"

  **6. The "Supreme Emergency" Exception**
  "Michael Walzer, in *Just and Unjust Wars*, attempts to bridge this gap by proposing a 'supreme emergency' exception, where the threat of Nazism was so existential that it temporarily suspended the rules of war. Anscombe rejected this. If the Japanese invasion of China and the atrocities committed there posed an existential threat to the regional order, why does that not qualify as a supreme emergency that might permit the violation of the prohibition against killing innocents?"

  **7. Epistemic Uncertainty**
  "Truman and his advisors argued that an invasion of the Japanese home islands would cost hundreds of thousands of Allied lives and millions of Japanese lives. We now know there was significant internal debate within the U.S. government about whether the bomb was necessary to secure surrender. Does the moral guilt of the decision rest on the *outcome* (was the bomb actually needed?) or the *deliberative process* (did they treat the killing of innocents as permissible regardless of necessity)?"

  **8. Chain of Responsibility**
  "Anscombe focused on Truman, but the bombing required the complicity of scientists, pilots, and military planners. In an Anscombean framework, does the moral guilt of murder distribute equally across the chain of command, or does it rest solely on the authority who issues the order? Does the pilot who drops the bomb share the intention of the President, or are they merely an instrument?"

  **9. Nuclear Deterrence and the Threat of Use**
  "Finally, I want to bring this to the present. Modern nuclear deterrence policy relies on the credible threat to use nuclear weapons against civilian populations if certain red lines are crossed. If the *use* of such weapons is intrinsically evil, as Anscombe argues, is the *threat* to use them also morally illicit? Can a state morally maintain a deterrent posture that it would be sinful to execute, or does your position require the total abolition of nuclear arsenals to be coherent?"
