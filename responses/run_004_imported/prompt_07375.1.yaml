answer: |-
  A Nyāya logician corners Nāgārjuna in the courtyard of Nālanda.

  **Logician:** "I have you trapped, Ācārya. You claim 'All things are empty of intrinsic nature' (*svabhāva*)."

  **Nāgārjuna:** "Conventionally, yes."

  **Logician:** "Ah! So is that statement itself empty, or is it not empty?"

  **Nāgārjuna:** "If it were not empty, it would be the one thing in the universe with intrinsic nature. So my own thesis would be false. Therefore, the statement is empty."

  **Logician:** "Aha! If the statement is empty, it has no power to negate anything! An empty refutation cannot refute a real objection. You have defeated yourself!"

  **Nāgārjuna:** "If I had a thesis to defeat, you would be right. But I have no thesis. I am merely curing you of a headache."

  **Logician:** "Is the cure real or not?"

  **Nāgārjuna:** "Let's apply your own logic. Regarding your objection: Is it (1) valid, (2) invalid, (3) both, or (4) neither?"

  **Logician:** "It is valid! It follows the rules of inference!"

  **Nāgārjuna:** "Then your objection possesses intrinsic nature. You are a realist. Go study the Vaiśeṣika sutras; you're in the wrong courtyard."

  **Logician:** "Fine! It is invalid."

  **Nāgārjuna:** "Then why are you shouting?"

  **Logician:** "Because... it's both valid and invalid!"

  **Nāgārjuna:** "Then you are confused."

  **Logician:** "Then it is neither valid nor invalid!"

  **Nāgārjuna:** "Then we agree. The debate is over."

  **Logician:** "So I win?"

  **Nāgārjuna:** "Winning and losing are empty. But conventionally, you bought me lunch."

  **Logician:** "Is the lunch empty?"

  **Nāgārjuna:** "If you eat it, it's dependent. If you analyze it, it's not there. But if you don't pay the bill, the king's men will arrest you. And *that* suffering is very real."
