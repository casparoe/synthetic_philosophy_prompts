      *   *The Isomorphism:*
          *   *Matter:* People think gold *is* value. Berkeley says matter doesn't exist. Similarly, people think gold *is* money. Berkeley says gold is just a medium.
          *   *Ideas:* Money is a token. It signifies labor/industry.
          *   *God/Order:* In metaphysics, God ensures the fire burns the wood. In economics, the State/Public Trust ensures the paper buys the bread. It's a *conventional* stability mirroring *divine* stability.
      *   *The "Power" Problem:* This is the tricky part the user flagged. In *Principles*, only volitional spirits have causal power. Matter is inert. In *Querist*, money "commands" labor. Does money have power? No, it's a sign *of* power. But whose power? The collective spirit of the nation. This is where the analogy strains: God is One; the "Public" is Many.
      *   *Refining the Argument:* The "power" isn't in the coin (just as causal power isn't in the fire). The power is in the Spirit (God/Laborer). Money is the *language* by which spirits coordinate.
      *   *Caffentzis:* Mention him as the scholarly anchor. He calls it "monetary immaterialism."
      *   *Conclusion:* It's not just an analogy. It's the same epistemological move applied to social ontology.

  4.  **Deepening the Mechanics (The "Meat"):**
      *   Need to explain *how* paper money works without metal. It works because it successfully predicts future access to goods.
      *   In metaphysics: I see fire, I expect heat. Why? God's orderly will.
      *   In economics: I hold paper, I expect bread. Why? The State's orderly will (and the industry of the people).
      *   The "Reality" of money isn't the paper; it's the *access to labor*. The "Reality" of an object isn't the substratum; it's the *perceptual experience*.
