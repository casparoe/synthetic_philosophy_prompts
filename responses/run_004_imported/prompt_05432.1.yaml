answer: |-
  The air outside the restaurant was cold enough to justify the coat, but not cold enough to send us inside. We stood under the awning, the damp napkin spread on the hood of a parked car, the centipede tree drawn in ballpoint ink still wet. Elena had the pot in her pocket; I had zero dollars and a head full of unresolved epistemology.

  "You took it at node two," I said, tapping the ink. "After I passed at the root."

  "I took it at the first node I faced," Elena corrected, her voice level. "Which, given your pass, was node two. And I took it because I know you, Marcus. I know you're rational."

  "I passed," I said. "By your definition, that's irrational. So the moment you saw the pot move to your side of the table, you knew I wasn't rational. So why did you assume I'd be rational at node three? That's the whole point. You defected because you thought I'd defect at node three. But I only get to node three if I pass at node two. If I'm already irrational at node one, why am I rational at node three?"

  Elena smoothed the napkin. "This is exactly where you're conflating the *event* of reaching a node with the *disposition* of the player. Aumann's point isn't that you *are* rational in the actual history. It's that Common Knowledge of Rationality (CKR) is a substantive assumption about our types. It's about the function mapping information sets to actions."

  "But the function broke," I said. "I passed. The function output 'Pass' when it should have output 'Take.' You observed a violation of the theory. Now you're standing at node two. You have to form a belief about what I'll do at node three. CKR says you *know* I'm rational. But you just saw me be irrational. Your knowledge is false. So you have to revise."

  "I don't have to revise the assumption of rationality," Elena said. "I have to treat the pass as a tremble. A mistake. It doesn't tell you anything about my *future* rationality. I am still the same player. My disposition to maximize utility hasn't changed just because I slipped."

  "That's the magic trick," I said. "You're treating rationality as a physical property, like mass. If I drop a ball and it floats, you don't say 'gravity broke for a second.' You say 'my theory of gravity is wrong.' In game theory, if I reach a node that backward induction says shouldn't be reached, the theory has failed to predict the path. Now you're asking the theory to predict the *next* step on a path it says doesn't exist. Stalnaker showed this. You're choosing a belief-revision policy that preserves CKR at all costs. But that's a choice. It's not logic."

  Elena looked up from the napkin. "It's not a choice, Marcus. It's the definition of the solution concept. If we agree to play a game under CKR, we agree to evaluate counterfactuals by holding rationality fixed. When you ask, 'What if Marcus passes?', you are asking for the closest possible world where Marcus passes. In Aumann's S5 framework, the closest world is one where I made a mistake in my calculation of your move, not one where your rationality ceased to exist. If I assume you're irrational now, I open the door to infinite regress. Maybe you're irrational now but rational later? Maybe you're pretending to be irrational? The only stable anchor is that rationality is common knowledge *ex-ante* and remains substantive."

  "But that makes the theory unfalsifiable," I pressed. "If a deviation occurs, you call it a tremble. If I pass ten times, it's ten trembles. You're insulating the backward induction outcome from empirical contact. In the real game, I passed. You took. You got the money. But your reasoning relied on the claim that *if* I had passed again, you would take at node four. How do you know that? You didn't test it. You defected precisely to avoid testing the belief that justifies the defection."

  "I didn't defect to avoid testing it," Elena said, her tone sharpening slightly. "I defected because the payoff structure dictates it. At the last node, I take. You know I take. So at the second-to-last node, you take. I know you take. So at the third-to-last, I take. This chain holds regardless of where we are in the tree. The reasoning is ex-ante. I didn't need to reach node four to know what happens there. I know it because I know *us*."

  "You know *us* as idealized agents," I said. "But we're sitting here in the cold. I passed. That's data. The data says I'm willing to sacrifice immediate payoff for potential gain, or I'm trying to signal cooperation. That's Forward Induction. If I pass at node one, I'm burning money. Why would a rational player burn money? Only if I expect a higher return later. That signal should update your belief. You should think, 'Marcus is trying to coordinate on the Pareto superior outcome.' If you believe that, passing at node two is rational for you. But you ignored the signal because your revision policy forbids you from reading it."

  Elena shook her head. "Forward Induction relies on the assumption that the deviation is *intentional* signaling. But under CKR, deviations aren't intentional signals; they're errors. If I assume your pass was a signal, I'm assuming you *planned* to be irrational. That's a contradiction. You can't plan to be irrational if rationality is common knowledge. So I must treat it as noise. And if it's noise, it doesn't update my belief about your future moves."

  "So we're back to the definition," I said. "You define rationality as 'maximizing given beliefs,' but you fix the beliefs to ensure maximization leads to backward induction. I'm saying beliefs are dynamic. When the unexpected happens, CKR is broken. It's not a tremble; it's a collapse. Once it collapses, you're in a game of incomplete information. You don't know my type. Maybe I'm a tit-for-tat player. Maybe I'm crazy. If you don't know, taking the pot at node two isn't strictly dominant anymore. It depends on the probability I assign to you being rational at node three."

  "And where do you get those probabilities?" Elena asked. "If you say 'I don't know,' then the game isn't solvable. Game theory offers a solution *because* it assumes CKR. If you drop CKR upon the first deviation, you don't get a different solution; you get no solution. You get a shrug. Aumann gives you a prediction. Stalnaker gives you a philosophy of language about counterfactuals."

  "Aumann gives you a prediction that requires players to ignore evidence," I said. "I passed. That is evidence. You ignored it. You won fifty dollars because you refused to update on the evidence that I was playing a different game than the one you solved."

  "I won fifty dollars because I played the game that was defined," Elena said, tapping the napkin. "The game is the tree plus the payoffs plus the knowledge assumptions. You tried to play a different game—one where passes are signals. But we didn't agree to that. We agreed to rationality. And if rationality means anything, it means I don't leave money on the table because I hope you'll be 'nice' at a node you have no incentive to reach."

  "Incentives change if beliefs change," I countered. "If my pass convinces you I'll pass at node three, your incentive at node two is to pass. You didn't check that. You assumed the incentive structure was static."

  "The incentive structure *is* static," Elena said. "The payoffs didn't change. Only your story about them did. Look, Marcus, here's the crux. You want rationality to be a description of behavior. I'm telling you it's a constraint on reasoning. If you treat it as behavior, then yes, a deviation breaks the model. But if you treat it as reasoning, then the deviation is just a glitch in the execution of a sound algorithm. My algorithm says 'Take.' Your algorithm says 'Take.' The fact that you pressed 'Pass' once doesn't mean your algorithm changed. It means your finger slipped. So I play against your algorithm, not your finger."

  "But in a sequential game, the finger *is* the algorithm," I said. "There's no hidden code. There's only the move. If the move is 'Pass,' the algorithm is 'Pass.' You're positing a ghost in the machine to save the theorem."

  Elena folded the napkin. The ink smeared. "Maybe. Or maybe you're positing a psychology that isn't in the model to save the intuition. We played for real stakes. I have the money. The theory worked."

  "The theory worked because I let it," I said. "I passed at the root. I gave you the chance to defect. If I had taken at the root, you'd have the same amount of money, and the theory would still say you 'would have' taken at node two. It's self-sealing. You took because you thought I'd let you. I passed because I hoped you'd see the pass. We didn't play a game; we played two different interpretations of the same tree."

  Elena put the napkin in her pocket. "Then the paradox isn't in the game. It's in the fact that we can't agree on what 'rational' means when the road forks into the impossible."

  "Exactly," I said. "And until we do, backward induction is just a story we tell ourselves about why we took the money."

  "Or why we didn't," she said.

  We stood there for a moment, the argument hanging between us, unresolved, like a game tree with no terminal payoffs assigned. Then we turned to walk home, neither of us having convinced the other that the path we didn't take was the one that mattered.
