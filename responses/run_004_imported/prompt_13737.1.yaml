prompt: |-
  Ok so this is a weird ask but I think it's actually up your alley. I'm on the protocol committee for my school's student-run EMS squad (we're the ones who show up to medical calls on campus before the town paramedics get there), and every semester the training officers run us through a stress-test scenario to see if our standing orders need updating. This semester's version is basically lifted from a bioethics paper we read in my Contemporary Moral Problems class -- Taurek's old drug case from "Should the Numbers Count?" -- reworked for us: say a bad batch of something is going around at a big campus event and we're down to our last dose of the one drug that reverses it before the next resupply. That dose is enough to fully treat one patient who's crashing hard right now, or, because of how it comes packaged, it could instead be split to fully treat five other patients who are also in real danger, just from a milder exposure. We genuinely can't do both. Our current standing order just says something like "act so as to save the greatest number of expected survivors," full stop, and most of the senior EMTs think that's obviously correct and dont get why we're even having this meeting. A few of us (me included, after doing the reading) aren't so sure it's as obvious as it sounds, and there's a rough proposal on the table to build some kind of equal-chance or weighted-lottery mechanism into the protocol for cases like this instead of a flat numbers rule.

  Somehow I got voluntold to draft the actual memo we're bringing to the full committee next Tuesday, since apparently noone else wants to touch the philosophy part. Could you write that for me? I need it to land on one concrete recommendation -- keep the numbers rule as is, replace it with some kind of lottery, or some hybrid of the two -- specific enough that we could basically drop the wording straight into the handbook. And it actually has to take the senior EMTs' side seriously, not just strawman it, or I'll get destroyed in the meeting. I know there's some famous reply to Taurek that we didn't quite get to in class (I think it's got "innumerate" in the title?) so bring that in if it's actually relevant -- don't just take my word for it.
