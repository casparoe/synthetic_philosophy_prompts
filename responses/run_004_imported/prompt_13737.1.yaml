answer: |-
  **MEMORANDUM**

  **TO:** Protocol Committee, [School Name] Student EMS
  **FROM:** [Your Name], Protocol Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Standing Order X (Resource Scarcity & Triage)

  ### Executive Summary

  This memo addresses the proposed revision to Standing Order X regarding the allocation of scarce medical resources during mass-casualty or supply-constrained incidents. Following the recent training scenario involving the allocation of a single antidote dose between one critical patient and five moderate patients, the committee must decide whether to retain the current "greatest number of expected survivors" rule or adopt a weighted-lottery system.

  After reviewing the ethical literature (specifically Taurek's "Should the Numbers Count?" and subsequent critiques) and consulting with Senior EMTs regarding operational feasibility, **I recommend retaining the "greatest number" principle but reframing it explicitly under Crisis Standards of Care (CSC).** I advise against implementing a lottery mechanism in standing orders. The proposed handbook language is included at the end of this memo.

  ### Ethical Analysis

  **The Taurek Argument (Equal Concern)**
  As raised in the training scenario, John Taurek's argument posits that aggregating claims violates the separateness of persons. From this view, the single critical patient has a claim to life equal to any one of the five moderate patients. To save the five simply because they are five is to treat the one as a mere means to a greater total. Taurek suggests a lottery (e.g., a 50/50 chance between the one and the group) to show equal respect to each individual's claim, even if this reduces the total number of survivors.

  **The Utilitarian & Operational Argument (Minimizing Harm)**
  The Senior EMT position aligns with standard utilitarian ethics and established disaster triage protocols (e.g., START/SALT). The primary moral obligation of EMS is to minimize total morbidity and mortality within the scope of available resources. In a scarcity event, failing to save five people to save one results in four preventable deaths. This view holds that while each life is of infinite value to the individual, the *moral weight of the outcome* requires us to count numbers to prevent greater aggregate harm.

  **The "Innumerate" Critique**
  A decisive counter-argument to Taurek, relevant to our protocol, is found in Derek Parfit's *"Innumerate Ethics."* Parfit argues that refusing to count numbers renders morality "innumerate"—blind to the scale of suffering. If we adopt a lottery system where the difference between saving one person and saving one thousand is morally irrelevant (as Taurek's logic implies), we risk absurd outcomes that violate our public mandate. In a public safety context, the committee has a fiduciary duty to the campus population to minimize total loss of life. Ignoring the numbers fails this duty.

  ### Operational Feasibility

  Beyond ethics, the lottery proposal presents significant operational risks:

  1.  **Time Sensitivity:** Conducting a fair lottery under stress consumes critical minutes during a "crashing" scenario.
  2.  **Liability & Legality:** Deviating from established National Crisis Standards of Care (which prioritize saving the most lives) could expose the squad and the university to significant legal liability.
  3.  **Cognitive Load:** Standing orders must be actionable under extreme stress. "Save the most lives" is a heuristic that functions under pressure; "calculate equal chance probabilities" is not.

  ### Recommendation

  We should **retain the "greatest number" rule** but update the language to reflect that this applies specifically under **Crisis Standards of Care**. This distinguishes daily operations (where we do everything for the single patient) from scarcity events (where we must act for the population).

  This approach respects the Senior EMTs' operational expertise while acknowledging the ethical gravity of the decision. It rejects the lottery not because the individual doesn't matter, but because, as Parfit argues, ignoring the scale of the tragedy is ethically worse in a public safety mandate.

  ### Proposed Handbook Wording

  **Replace current Standing Order X with the following:**

  > **STANDING ORDER X: ALLOCATION OF SCARCE RESOURCES**
  >
  > **1. Activation:** This protocol applies only when specific life-saving resources (e.g., medications, equipment) are exhausted and resupply is not immediately available, rendering it impossible to treat all patients according to standard care.
  >
  > **2. Ethical Framework:** In activation scenarios, the Squad operates under Crisis Standards of Care. The primary ethical objective shifts from individual patient advocacy to the minimization of aggregate mortality and morbidity for the total patient population.
  >
  > **3. Allocation Rule:** When forced to choose between patients due to resource scarcity, providers shall allocate resources to maximize the total number of expected survivors.
  > *   *Clinical Note:* "Expected survivors" must account for both probability of survival and acuity. Providers should prioritize patients who are salvageable with the intervention over those who are expectant, regardless of group size.
  >
  > **4. Prohibition of Randomization:** Random selection methods (e.g., lotteries, coin flips) are prohibited in resource allocation. Decisions must be based on clinical triage criteria and the objective of preserving the greatest number of lives.

  ### Next Steps

  If the committee approves this wording, I recommend we schedule a brief in-service with the Training Officers to ensure all members understand the distinction between daily triage and Crisis Standards of Care activation.

  I am available to discuss the philosophical underpinnings of this recommendation at Tuesday's meeting.

  ***

  **Attachments:**
  *   Summary of Taurek, J. (1977). "Should the Numbers Count?"
  *   Summary of Parfit, D. (1998). "Innumerate Ethics."
  *   National Guidelines for Crisis Standards of Care (2012)
