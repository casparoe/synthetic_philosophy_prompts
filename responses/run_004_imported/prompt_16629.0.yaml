answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Elena, a behavioral psychologist, and Marcus, a game theorist, are finishing up a seminar on decision-making.*

  **Elena:** You know, Marcus, I've been thinking about that Dollar Auction example you used in the lecture. It still bothers me that you presented it as a solvable game tree.

  **Marcus:** Why? The incentives are perfectly clear. It's a classic war of attrition with incomplete information.

  **Elena:** Because in the real data, people don't play the game you described. They play a different one. When the bidding hits one dollar, the rational move is to stop. The prize is worth a dollar. If I bid $1.05 to win a dollar, I've guaranteed a loss. Yet, in Shubik's experiments, bids go to $3, $5, sometimes $20. You call that "incomplete information." I call it panic.

  **Marcus:** But "panic" is just a label. Look at the structure at the 90-cent mark. I'm the high bidder at 90 cents. You're second at 80 cents. If the auction stops now, I win 10 cents, and you lose 80 cents. You have a choice: accept a certain loss of 80 cents, or bid $1.00. If you bid $1.00, you might win the dollar and break even, or I might fold, and you win 20 cents.

  **Elena:** I grant you the logic up to the dollar. That's the trap door. But once we're past a dollar, the math inverts. If we're at $1.50 and $1.40, stopping means losing $1.40. Bidding $1.60 means risking a loss of $1.60 to save the $1.40. The potential loss *increases* with every step. To keep bidding, I have to believe you're going to fold soon. But why would I believe that? We both know the prize is a single dollar.

  **Marcus:** Because I don't know *your* limit. Maybe you're irrational. Maybe you have a budget I don't know about. Maybe you're just stubborn. If I assign even a small probability to you folding at $2.00, then bidding $1.60 is an expected-value calculation. I'm buying a lottery ticket where the prize is "not losing $1.40."

  **Elena:** There it is. "Buying a lottery ticket." That's the bias talking. You're framing the avoidance of a sunk cost as a potential gain. But here's the hard spot, Marcus: In the experiments where bids hit $20, both bidders are doing this calculation. For the bidding to reach $20, I must believe you will fold at $21, and you must believe I will fold at $21. But we're both rational agents in your model. We both know the pot is $1. At what point does assuming the other person will fold become a delusion rather than a "probabilistic belief"?

  **Marcus:** It becomes a delusion if you assume *common knowledge* of rationality. But that's an unrealistic assumption. In the real world, I don't know if you're a game theorist or an undergraduate looking to prove a point. The rational model accounts for the *escalation* precisely because we don't know when the other person will capitulate. The fact that bids overshoot doesn't disprove rationality; it proves the uncertainty about the opponent's resolve is high.

  **Elena:** But that makes your model unfalsifiable. If someone stops at 50 cents, they're rational maximizers. If someone bids $20, they're rational actors with "high uncertainty about opponent resolve." You've built a theory that can explain any outcome. My point is that the physiological data tells a different story. Heart rates spike. Cortisol spikes. People report feeling trapped, angry, vindictive. They say, "I don't care about the money anymore, I just want to beat *him*." That's not a calculation of odds; that's a revenge motive triggered by loss aversion.

  **Marcus:** I'm not denying the emotion, Elena. I'm saying the emotion is the *mechanism* that sustains the equilibrium. In evolutionary game theory, animals fight over territory until the cost exceeds the value of the resource all the time. It's called the Hawk-Dove dynamic. They don't do calculus; they have an instinctual threshold. Humans in the Dollar Auction are adopting a strategy: "I will signal that I am willing to suffer more than you." The anger is a credible signal. If I look calm, you'll keep bidding. If I look like I'm going to burn the house down, you might fold at $5.

  **Elena:** Okay, but let's press on the "credible signal" idea. In animal conflicts, there's usually a physical asymmetry. One lion is actually bigger. In the Dollar Auction, the asymmetry is often imaginary. When a student bids $15 for a dollar, are they signaling strength? Or are they rationalizing a mistake they made three bids ago? This is my second hard spot: Distinguish for me, precisely, between a "rational war of attrition strategy" and "sunk cost fallacy post-hoc rationalization."

  **Marcus:** That is the knife-edge. The distinction lies in the *ex-ante* plan versus the *ex-post* justification. A rational war of attrition player decides *before* entering the auction: "I have a budget of $5 based on my estimate of the room's risk tolerance." If they hit $5, they stop. The sunk-cost victim says, "I've already spent $4, I can't stop now," without having ever defined a limit.

  **Elena:** But in the heat of the moment, those two states feel identical. And look at the data: very few people set a hard limit beforehand. They get swept up. If the "rational" explanation requires a pre-commitment device that almost no one uses in the experimental setting, then the "rational" explanation describes a phantom agent, not the human in the room. You're saying, "If they were rational, this is how they'd think." I'm saying, "They aren't thinking that; they're reacting to the pain of loss."

  **Marcus:** Fair. But consider the alternative. If it's purely bias, why does the bidding stop at all? If it's just emotional escalation, why doesn't it go to $1,000? Why do auctions eventually end?

  **Elena:** Because budgets run out. Or shame kicks in.

  **Marcus:** Exactly. Budgets run out. That's a constraint. The bidding stops when the marginal cost of the next bid exceeds the bidder's *subjective* probability of the opponent folding, multiplied by the value of avoiding the current loss. Even if that probability is biased, the *structure* of the decision is a comparison of expected costs. The "bias" camp treats the escalation as an error. The "rational" camp treats it as a costly search for the opponent's breaking point.

  **Elena:** I think the divergence is here: You view the "opponent's breaking point" as an external fact to be discovered. I view it as a mutual hallucination we create together. When I bid $5, I'm not discovering your limit; I'm *moving* your limit. I'm triggering your loss aversion, which makes you bid $6, which triggers mine. It's a feedback loop. Your model treats our beliefs as static variables we're solving for. My model says the game itself corrupts the variables.

  **Marcus:** So you're saying the rationality is endogenous?

  **Elena:** I'm saying the "rational" calculation relies on the assumption that the other person is playing a different game than I am. I'm playing "Don't be the sucker." You're playing "Maximize Expected Utility." But if we're both playing "Don't be the sucker," the math breaks.

  **Marcus:** But "Don't be the sucker" *is* a utility function. If my utility includes not looking like a fool, then bidding $6 to avoid looking like a fool who lost $5 is rational.

  **Elena:** *There.* That's the move. You just expanded the definition of "rational" to include "emotional avoidance of shame." If you allow "not feeling like a loser" to count as a payoff, then *everything* is rational. A gambler chasing losses is rational because they value the "chance to recover" over the cash. A duelist is rational because they value "honor."

  **Marcus:** Isn't that just acknowledging that value is subjective? Economics doesn't say you must only value dollar bills. It says you act to maximize your preferences. If people value avoiding the feeling of a sunk loss more than they value the dollar bill, then bidding past $1 is consistent with rational choice theory. It's just that the preferences are pathological.

  **Elena:** But then the theory loses its predictive power. If "rational" can encompass bidding $20 for a $1 bill because of "shame," and it can encompass stopping at 10 cents because of "prudence," what does the theory tell us? It tells us people do what they want. My bias model tells us *why* they want what they want. It predicts that if you change the framing—if you tell them, "This is a trap," or "The second bidder doesn't pay"—the behavior changes. Your model says the structure dictates the outcome regardless of the framing, as long as incentives remain.

  **Marcus:** I'd push back on that. If you tell them it's a trap, you change the information set. You're introducing a common knowledge variable: "We are both being observed for irrationality." That changes the payoff of "looking like a fool." Now, looking like a fool costs *more* because the experimenter warned you. So they might stop earlier. That's still consistent with the game theoretic model.

  **Elena:** It feels like you're retreating into a tautology, Marcus. "People maximize utility." "Why did he lose $20?" "Because he preferred losing $20 to the alternative." It drains the word "rational" of its meaning. The whole point of the Dollar Auction is that it reveals a systematic deviation from *sound* decision-making. If we sanitize it into "well, they valued the non-loss," we lose the warning. The warning is that smart people do stupid things because their brains misfire under loss conditions, not because they calculated the odds of a war of attrition.

  **Marcus:** And my warning is that structural incentives can force smart people into stupid outcomes even without brain misfires. If I put you in a room with a stranger and tell you the second-place bidder pays, I have created a prison where cooperation is impossible and escalation is the only dominant strategy once the threshold is crossed. Blaming it on "bias" lets the designer off the hook. It suggests the system is fine, but the humans are buggy. I'm saying the system is the bug. The rationality is local; the outcome is globally insane.

  **Elena:** *Pauses, stirring her coffee.* Okay. That I can agree with. The system weaponizes the bias.

  **Marcus:** Precisely. Your "bias" explains the fuel—the loss aversion, the sunk cost sensitivity. My "rationality" explains the engine—the incentive structure that converts that fuel into escalation. Without the fuel, the engine stalls at $1. Without the engine, the fuel just sits there as regret over a 90-cent loss.

  **Elena:** So the $20 bid isn't a calculation, but it's not a random error either. It's a rational exploitation of an irrational vulnerability.

  **Marcus:** Or an irrational exploitation of a rational structure.

  **Elena:** *Smiles.* We might be describing the same elephant. You're touching the leg and calling it a pillar; I'm touching the trunk and calling it a snake.

  **Marcus:** As long as we agree the elephant is dangerous. The real takeaway isn't whether the bidder is "rational." It's that any system which penalizes the runner-up creates a motive to destroy value to avoid being second.

  **Elena:** And that whether you call it "loss aversion" or "war of attrition," the only winning move is not to bid 90 cents.

  **Marcus:** Agreed. Though if we were actually in the auction right now...

  **Elena:** ...I'd probably still bid $1.05 just to spite you.

  **Marcus:** *Laughs.* See? Rational signaling.

  **Elena:** Or just human nature.
