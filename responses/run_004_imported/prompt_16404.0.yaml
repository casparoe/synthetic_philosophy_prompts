  okay so my friend and i got into it last night about Frege, of all people. late in his life (he died in 1925) they found this private diary of his where he rails against parliamentary democracy, wants a strongman to just shut it down, and says some genuinely ugly antisemitic stuff about stripping Jews of political rights. my friend's take was "who cares, the guy basically invented modern quantificational logic, his politics have zero bearing on whether his arguements against psychologism or his sense/reference distinction hold up." i wasn't so sure, partly because Frege's whole philosophical picture depends on there being one objective, mind-independent realm of thoughts that individual minds just have to submit to -- he even calls it the "third realm" (drittes Reich in german, which, yikes) in "The Thought." we argued for like an hour and never landed anywhere. write me an essay that actually settles it: does the diary give us any real reason to reassess his logicism, his anti-psychologism, and his platonism about thoughts, or is my friend right that it's just irrelevant biographical trivia? weigh both sides, but don't chicken out -- pick one and defend it.
