answer: |-
  The server room hummed, a low-frequency vibration that Elena felt in her teeth. On the screen before her, two protocols blinked in alternating amber: **Protocol A (Direct Pulse)** and **Protocol B (Ghost Relay)**.

  She had ten minutes before the corporate counter-intelligence team locked down the building. She needed to upload the encrypted ledger to the public node. One shot. If she chose wrong, the connection would be severed, the data wiped, and her career—and freedom—ended.

  Her comms unit crackled. It was Julian. He wasn't in the building; he was in the command center downtown, watching her biometrics, her keystroke latency, the heat signature of her palms on the console.

  "Elena," Julian's voice was calm, stripped of static. "You're favoring the Direct Pulse. I can see your heart rate spike when you highlight it."

  Elena pulled her hand back from the keyboard. She hadn't touched anything. "You're bluffing."

  "I know you," Julian said. "When you're scared, you go for speed. You think aggression breaks the lock. So I've throttled the bandwidth on Port A. If you hit Direct Pulse, the upload stalls at ninety percent. We catch you."

  Elena stared at Protocol B. Ghost Relay. It routed through three proxy servers before hitting the node. Slower, but harder to trace.

  "Okay," she said, her voice tight. "Then I'll use Ghost Relay."

  "If you decide on Relay," Julian replied, instantly, "that means you've accepted my assessment of your fear. You're pivoting to caution. I know that pivot. I've seeded Port B with a tracer. If you initiate Relay, we don't just block you; we locate your physical terminal before the handshake completes."

  Elena slumped in the chair. The air conditioning felt too cold. This was the loop. It had been spinning in her head for an hour.

  If she chose A, it was because she wanted speed. But wanting speed was exactly what Julian expected, so A was trapped.
  If she chose B, it was because she wanted safety. But wanting safety was exactly what Julian expected, so B was trapped.

  Her reasoning was the leak. Every argument she constructed to justify a choice was the same argument Julian used to predict the choice.

  "Stop thinking," Julian said. "Just pick. You're burning clock."

  "I can't pick," Elena said. "If I pick A, you're waiting there. If I pick B, you're waiting there."

  "Then stay there," Julian suggested. "Wait for the team. It's over."

  "No."

  She looked at the two buttons. They looked identical now. The logic was symmetrical. Her mind tried to find a wedge. *What if I pretend to choose A, then switch to B?* No, Julian knew her tricks. He knew she knew he knew. The prediction wasn't based on magic; it was based on the causal link between her deliberation and her action. Her decision wasn't just a selection; it was evidence. The moment she settled on a plan, she became the kind of person who would execute that plan, and Julian knew exactly where that kind of person would go.

  If she committed to A, the evidence of that commitment meant A was fatal. So she should switch to B.
  But if she switched to B, the evidence of that switch meant B was fatal. So she should switch to A.

  She was chasing her own tail around a drain.

  "Elena," Julian warned. "Two minutes."

  Sweat prickled her hairline. She needed to break the link between her reason and the outcome. She needed to act without a reason that Julian could model. If she chose based on logic, she lost. If she chose based on preference, she lost. She needed to choose based on nothing.

  She opened her desk drawer. Inside, beneath a stack of access cards, lay a old silver dollar. Her father's. She never carried it, never used it. It was useless data.

  "What are you doing?" Julian asked. His voice had lost its calm. The biometrics must have shifted.

  "Removing myself from the equation," Elena said.

  "Don't be stupid. A coin toss is fifty-fifty. You're gambling the ledger."

  "You're gambling on my mind," she said. "You know what I'll decide. You don't know what a coin will do."

  "If you let chance decide, you might hit the trap."

  "If I decide, I *definitely* hit the trap."

  She picked up the coin. It was cool and heavy. She looked at the screen. Protocol A on the left. Protocol B on the right.

  "Heads," she whispered. "A. Tails. B."

  "Elena, don't."

  She flipped the coin. It caught the light, a spinning blur of silver against the dark room. For a second, it was neither A nor B. It was just metal in gravity. It wasn't a decision; it was an event. Her reasoning had no purchase on it. Julian couldn't predict the aerodynamics of the flip any better than she could.

  The coin landed on the back of her hand. She slapped her other hand over it.

  The hum of the servers seemed to vanish. The only sound was her own breathing. She hadn't chosen. The universe had chosen. There was no evidence in her mind for Julian to read, because she hadn't formed a preference. She was just the mechanism executing the result.

  "Well?" Julian said.

  Elena lifted her hand.

  ***

  **Author's Note on the Mechanics:**
  The failure of ratifiability occurs in the moment Elena realizes that *committing* to either protocol makes that protocol the wrong choice. If she decides "I will choose A," she infers Julian has blocked A, so she should choose B. If she decides "I will choose B," she infers Julian has traced B, so she should choose A. Neither choice is stable under the condition of having made it. The coin toss corresponds to the mixed-strategy solution, breaking the evidential link between her deliberation and the counterpart's prediction.
