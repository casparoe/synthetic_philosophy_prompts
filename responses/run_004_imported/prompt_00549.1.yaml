answer: |-
  A CDT agent, an EDT agent, and a UDT agent get Counterfactual Mugged by Omega.

  Omega flips a coin. It lands Tails.
  Omega says: "Sorry, no $10,000 reward. But since I predicted you'd pay up in this scenario, please hand over $100."

  The CDT agent immediately shouts, "Don't do it! The coin is already flipped. Your action cannot causally affect the past. Paying is literally throwing good money after bad!"

  The EDT agent nods frantically, "Agreed! Paying is strong evidence that you're the kind of person who loses $100 for no reason. Update your beliefs and keep your wallet!"

  The UDT agent sighs, pulls out a crisp $100 bill, and hands it to Omega.

  The CDT agent grabs their shoulder. "Are you insane? The $10,000 *does not exist*. You are paying for a benefit that is physically impossible!"

  The UDT agent dusts off their coat and smiles. "I'm not paying for the benefit in *this* branch."

  "Then what are you paying for?!"

  "I'm just splitting the bill with my counterpart in the Heads branch," the UDT agent says, walking away. "He got the $10,000, so he's covering dinner. I'm just picking up the tip."

  "But he doesn't exist!" the CDT agent yells after them.

  The UDT agent waves without turning around. "Tell that to my expected utility function. He's already eaten."
