answer: |-
  Harsanyi's Aggregation Theorem is frequently cited in moral philosophy and welfare economics as a powerful formal argument for utilitarianism. The theorem demonstrates that if individuals and a social planner both satisfy the von Neumann-Morgenstern (vNM) axioms of rational choice under uncertainty, and if the planner's preferences satisfy the *Ex Ante* Pareto principle, then social welfare must be represented as a weighted sum of individual utilities. This is often taken to mean that utilitarianism is not merely one ethical theory among many, but the unique implication of rational consistency.

  However, this reading is unwarranted. The theorem does not vindicate utilitarianism from neutral, uncontroversial premises. Instead, it derives a utilitarian conclusion by embedding a highly contentious ethical assumption into the *Ex Ante* Pareto principle. This assumption renders the resulting social planner insensitive to fairness in the distribution of risk and outcomes. Specifically, a planner derived from Harsanyi's premises is forced to be indifferent between a fair lottery and an arbitrary outright award, provided the aggregate expected utilities are identical. This indifference is not a mere technical artifact; it reveals a fundamental conflict between Harsanyi's "rational" utilitarianism and deep-seated moral intuitions regarding justice, rights, and equal respect.

  ### The Mechanism of Ex Ante Pareto

  To understand the flaw, one must distinguish between *Ex Ante* and *Ex Post* evaluations.
  *   **Ex Post:** Evaluates social welfare based on the actual utility realized in each state of the world after uncertainty is resolved.
  *   **Ex Ante:** Evaluates social welfare based on the *expected* utility of individuals before the uncertainty is resolved.

  Harsanyi's theorem relies on the *Ex Ante* Pareto principle: if every individual prefers lottery $L$ to lottery $L'$ based on their expected utilities, the social planner must prefer $L$ to $L'$. Consequently, the social welfare function ($W$) becomes a linear combination of individual expected utilities ($EU_i$):
  $$W = \sum a_i EU_i$$

  Because the function sums expectations, it treats the *source* of the expectation as morally irrelevant. It cares only about the mathematical sum, not whether that sum arises from a fair distribution of chances or an arbitrary concentration of opportunity.

  ### The Problem of Indifference: Lottery vs. Outright Award

  Consider the scenario proposed in the prompt: there is a single indivisible good and two equally deserving claimants, Person 1 and Person 2. Let the utility of receiving the good be $10$ and receiving nothing be $0$.

  *   **Option A (Fair Lottery):** A coin flip decides the recipient.
      *   $EU_1 = 0.5(10) + 0.5(0) = 5$
      *   $EU_2 = 0.5(10) + 0.5(0) = 5$
      *   **Social Welfare (Sum):** $5 + 5 = 10$

  *   **Option B (Outright Award):** The good is given to Person 1 without a lottery.
      *   $EU_1 = 1.0(10) + 0.0(0) = 10$
      *   $EU_2 = 1.0(0) + 0.0(0) = 0$
      *   **Social Welfare (Sum):** $10 + 0 = 10$

  Under Harsanyi's Aggregation Theorem, assuming equal weights for equal claimants, the social planner must be **indifferent** between Option A and Option B. The sum of expected utilities is identical ($10$), so the rational planner has no grounds to prefer the fair lottery over the arbitrary award.

  ### Why This Is a Genuine Ethical Problem

  Critics might dismiss this indifference as a technicality of expected utility theory, suggesting that in the "long run" of repeated decisions, the outcomes would average out. However, this defense fails when applied to social justice for three substantive reasons.

  **1. Violation of Equal Respect and Procedural Fairness**
  Moral philosophy generally holds that equally deserving claimants have an equal right to be considered for a scarce resource. A fair lottery is not merely a mechanism for allocation; it is a symbolic and procedural affirmation of the equal moral status of the claimants. By flipping a coin, society acknowledges that Person 2's claim is just as weighty as Person 1's, even if Person 2 ultimately loses.
  Option B (outright award) denies this recognition. It treats Person 2 as if they have no claim at all. A social planner that is indifferent between these options fails to capture the moral value of *procedural justice*. If a theorem purporting to ground ethics cannot distinguish between a fair process and an arbitrary dictatorship when expectations are equal, it fails to account for a core component of human morality.

  **2. Insensitivity to Ex Post Inequality**
  Harsanyi's *Ex Ante* utilitarianism is blind to the distribution of well-being once the uncertainty resolves. In Option A, there is inequality in the outcome (one gets 10, one gets 0), but there was equality in the *chance*. In Option B, there is inequality in the outcome and inequality in the *chance*.
  Most egalitarian theories (and indeed, many non-egalitarian theories of rights) view the inequality of *chance* as a distinct moral harm. By treating the two options as equivalent, Harsanyi's theorem validates a system where a planner could systematically favor specific individuals (e.g., based on bias) as long as they compensate them with "expected utility" elsewhere or if the aggregate numbers remain stable. This reduces individuals to vessels for utility units, ignoring their status as distinct agents with rights to fair treatment.

  **3. The "Vindication" is Circular**
  The most damaging implication for the standard reading of the theorem is that it exposes the argument as circular. Proponents claim the theorem vindicates utilitarianism because the premises (vNM rationality + Pareto) seem like neutral requirements of rationality.
  However, as the lottery example shows, the *Ex Ante* Pareto principle is not ethically neutral. It *presupposes* that only expectations matter. By accepting *Ex Ante* Pareto, one has already accepted the controversial ethical stance that fairness in risk distribution is irrelevant. Therefore, the theorem does not prove that utilitarianism is rational; it proves that *if* you accept a specific, controversial ethical axiom (Ex Ante Pareto), *then* you get utilitarianism.
  Since many reasonable people reject *Ex Ante* Pareto precisely because it forces the indifference between the fair lottery and the outright award (a critique famously articulated by Peter Diamond in 1967), the theorem cannot serve as a neutral foundation for utilitarian ethics. It merely demonstrates the internal consistency of a specific ethical framework that many find morally deficient.

  ### Conclusion

  Harsanyi's Aggregation Theorem is a profound mathematical result, but it is a poor ethical vindication. By relying on the *Ex Ante* Pareto principle, it constructs a social planner who is blind to the moral difference between a fair lottery and an arbitrary allocation. This indifference is not a technical glitch to be explained away; it is a feature of a system that prioritizes the accounting of expectations over the reality of fairness and rights. Because a credible ethical theory must be able to distinguish between fair and unfair procedures even when expected outcomes are identical, Harsanyi's theorem fails to ground utilitarianism as a complete moral philosophy. Instead, it highlights the ethical costs of adopting an exclusively *Ex Ante* perspective on social welfare.
