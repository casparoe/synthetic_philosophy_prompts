  3.  **Key Arguments to Include:**
      *   *Humean Attack:* "Necessitation" is just a label. Saying "N necessitates M" doesn't explain *why* N is followed by M. It's an inference ticket, not an engine. Also, Anti-Humeanism violates Hume's Dictum (no necessary connections between distinct existences).
      *   *Anti-Humean Attack:* Humean laws are circular. The Best System is determined by the mosaic, but the mosaic is supposed to be explained by the laws. Humean laws can't support counterfactuals (if the mosaic were different, the laws would be different). Humeanism makes laws too contingent/local.
      *   *Modal Question:* Could laws be different? Anti-Humean says yes (contingent necessitation). Humean says "laws" are tied to *this* mosaic, so in a different world, different regularities = different laws.
      *   *Regularity Question:* Why is there order? Anti-Humean: Because laws constrain reality. Humean: That's a brute fact; asking for more is asking for magic.

  4.  **Drafting - Section by Section:**

