      *   *Refining the "Knowledge" point:* This is the crux. If foresight is contaminated by valence, PDE is unstable.
      *   *Solution:* Aquinas distinguishes between *cognition* and *consideration*. The chairman *cognizes* the effect, but does not *consider* it as part of the moral object. The folk attribution of "know" implies a practical engagement. The friar can argue that the folk are detecting the *practical* relevance, not the *speculative* truth.
