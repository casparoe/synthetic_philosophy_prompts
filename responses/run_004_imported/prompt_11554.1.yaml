          *   *Insulation:* Thomism has a robust metaphysics of action. The *human act* (actus humanus) vs. *act of a human* (actus hominis). The technical definition of "intention" (*intentio*) is specific (act of the will regarding the end). Folk "intentional" is a blame-assignment tool.

