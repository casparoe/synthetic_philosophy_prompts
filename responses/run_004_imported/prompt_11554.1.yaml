          *   *Thomist View:* Double Effect (PDE) relies on the distinction between *intended* means/ends and *foreseen* side effects. If folk intuition says the harm is intentional but the help is not, does that break PDE?
          *   *Analysis:* PDE says side effects are *praeter intentionem* (outside the intention). If folk say harm is intentional, they are using "intentional" to mean "willingly permitted despite knowledge." Aquinas distinguishes between the *object* of the act and the *circumstances*. A Thomist might argue the folk are conflating moral responsibility with metaphysical intentionality.

      *   **The Epistemic Side-Effect Effect (Knowledge):**
          *   *Finding:* People are more likely to say the chairman *knew* the harm would happen than that he *knew* the help would happen, even if the epistemic confidence is identical in the vignette.
          *   *Thomist View:* Foresight (*praevideo*) is supposed to be a cognitive state independent of the volitional state (until the will commands). If moral valence affects whether people attribute *knowledge*, does that undermine the objective status of foresight required for PDE?
          *   *Analysis:* This is the harder hit. PDE requires the agent to *foresee* the effect. If "foreseeing" is conceptually tied to "badness" in folk psychology, can we still use it as a neutral premise?
