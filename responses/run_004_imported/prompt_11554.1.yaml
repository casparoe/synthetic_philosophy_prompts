  7.  **Final Polish:** Ensure the distinction between *intentio* and *electio* is clear. Ensure the distinction between *foreseen* and *intended* is sharp. Make sure the "Knowledge" point doesn't collapse PDE. (The key is that PDE requires the agent to *actually* foresee, regardless of whether third parties *attribute* knowledge).

