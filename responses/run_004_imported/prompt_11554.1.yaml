answer: |-
  This is an exceptionally sharp philosophical problem to embed in a novel. Your friend's advice to have the friar dismiss the research as "reductive social science" would indeed be a missed opportunity. It would make the friar look like a dogmatist shielding his system from data, whereas a genuine Thomist—especially one formed in the rigorous analytic Thomism tradition often found in modern Dominican houses of study—should treat empirical data about human cognition as relevant to anthropology, even if it doesn't dictate metaphysics.

  Aquinas would not be embarrassed by the Knobe Effect or the Epistemic Side-Effect Effect, but he would diagnose them as category errors regarding the *attribution* of mental states versus the *ontology* of the act. He has the resources to absorb these findings without collapsing the Principle of Double Effect (PDE).

  Here is the breakdown of how a rigorous Thomist would reconstruct these results, specifically drawing on *Summa Theologiae* I-II, q. 6 (The Voluntary and the Involuntary) and II-II, q. 64, a. 7 (Self-Defense).

  ### 1. The Intentionality Asymmetry (Knobe Effect)
  **The Finding:** People say the harm is intentional, but the help is not.
  **The Thomist Diagnosis:** The folk are conflating *intentio* (intention) with *voluntarium* (voluntariness/culpability).

  For Aquinas, *intentio* is strictly an act of the will regarding the *end* (the goal). In the Knobe vignette, the chairman's end is profit. The environmental effect is a side effect (*praeter intentionem*). Metaphysically, neither the harm nor the help is intended.

  However, Aquinas distinguishes between what is intended (*intentum*) and what is voluntary (*voluntarium*). In *ST* I-II, q. 6, a. 3, he notes that something can be voluntary even if not intended, specifically if it is *voluntarium in causa* (voluntary in its cause). By willing the cause (the profit-seeking policy) while knowing the effect, the agent makes the effect voluntary.

  **Why the Asymmetry?**
  Aquinas would argue the folk intuition is tracking *moral responsibility*, not metaphysical intentionality.
  *   **Harm:** When a side effect is bad, it creates a "debt" of justice. The agent must account for it. The folk mind senses this moral weight and labels it "intentional" because the agent is *bound* by it.
  *   **Help:** When a side effect is good, it creates no debt. It is a *bonum occasionatum* (an occasional good). The agent is not bound by it. The folk mind senses this lack of binding and labels it "unintentional."

  **The Friar's Move:** He should not deny the chairman is responsible for the harm. He should argue that the word "intentionally" is being used by the subjects as a proxy for "culpably." The Thomist framework agrees the chairman is culpable for the harm (if disproportionate) but insists on calling it *foreseen and permitted*, not *intended*, to preserve the distinction between aiming at evil and permitting it. The Knobe result confirms that human conscience naturally binds us tighter to bad side effects than good ones—which is exactly what PDE presupposes.

  ### 2. The Epistemic Side-Effect Effect (The "Knew" Asymmetry)
  **The Finding:** People are less likely to say the chairman *knew* the good would happen than that he *knew* the harm would happen, even with identical epistemic confidence.
  **The Thomist Diagnosis:** This is the harder hit, as you noted, because PDE requires foresight to be a neutral cognitive premise. If "knowing" is valence-loaded, can foresight be neutral?

  Aquinas distinguishes between the **Speculative Intellect** (knowing what is the case) and the **Practical Intellect** (knowing what is to be done).
  *   **Speculative:** "This policy will cause X." This is a truth claim. It should be valence-neutral.
  *   **Practical:** "I am doing X." This is an action claim.

  The Thomist argument is that the experimental subjects are not judging the chairman's *speculative* knowledge (did he have the data?), but his *practical* knowledge (did he take this into his plan?). In Thomistic terms, practical knowledge is perfected by *prudence* (*prudentia*), which is inherently moral. You cannot be "prudent" about evil.

  Therefore, when subjects say the chairman didn't "know" the good would happen, they are correctly identifying that the good effect was not part of his *practical* reasoning. It was outside his *ordo rationis* (order of reason). When they say he did "know" the harm, they are identifying that the harm entered his practical reasoning as an obstacle or a cost to be weighed.

  **Does this threaten PDE?**
  No, provided the friar insists that for the *moral evaluation* of the act, what matters is the agent's *actual* speculative foresight, not the observers' attribution of knowledge. The Knobe experiments measure *attribution*, not *ontology*. The chairman *did* foresee both (speculatively). The fact that observers deny he "knew" the good reveals that in ordinary language, "knowing" implies "taking responsibility for."

  **The Friar's Move:** He can argue that the subjects are right to sense a difference, but wrong about the locus of the difference. The difference isn't in the *vision* (both were seen), but in the *uptake*. The harm was "taken up" by the will as a cost; the help was not. The folk call this difference "knowing vs. not knowing"; the Thomist calls it "practical consideration vs. speculative observation."

  ### 3. Ordinary Language vs. Technical Vocabulary
  **The Question:** Does Aquinas treat common speech as authoritative?
  **The Answer:** He treats it as *evidence*, not *law*.

  Aquinas frequently begins articles with *Videtur quod...* (It seems that...), citing common usage or authoritative opinions. But in the *Respondeo*, he often refines the terms. He distinguishes between *secundum usum loquendi* (according to common usage) and *secundum rem* (according to the reality of the thing).

  In *ST* I-II, q. 6, a. 4, he discusses whether violence causes involuntariness. He acknowledges how people speak but clarifies the metaphysical conditions of the will.

  **The Friar's Strategy:**
  He should not scold the psychologist for using loose language. Instead, he should treat the Knobe Effect as evidence of the **Natural Law**.
  *   The fact that human beings universally distinguish between bad side effects and good side effects in their attribution of intentionality suggests that the moral law is written on their hearts (*Romans 2:15*).
  *   Their intuition that "bad side effects bind the agent" is correct Thomistic ethics.
  *   Their intuition that "good side effects do not bind the agent" is also correct.
  *   Their *vocabulary* ("intentional," "know") is imprecise, but their *moral phenomenology* is sound.

  ### 4. Specific Thomist Concepts for the Friar's Lines
  To make the friar sound formidable and not quaint, give him these specific distinctions. He shouldn't speak in "Thus saith Aquinas" quotes, but in the *logic* of Aquinas.

  1.  ***Praeter intentionem*** **(Outside the intention):** Use this to describe the side effects. It doesn't mean "unexpected"; it means "not the target."
  2.  ***Voluntarium in causa*** **(Voluntary in the cause):** This is the hammer. The chairman didn't intend the pollution, but he willed the cause of the pollution. He is therefore responsible for it. This validates the subjects' intuition that he is to blame for the harm without conceding that he "intended" it in the strict sense.
  3.  **The *Finis Operis* vs. *Finis Operantis*:** The "End of the Work" (profit/pollution) vs. the "End of the Worker" (what the chairman personally wants). The Knobe effect confuses the two.
  4.  **Speculative vs. Practical Assent:** Regarding the "knew" asymmetry. "The chairman gave speculative assent to both outcomes. He gave practical assent only to the profit. Your subjects are conflating the two."

  ### 5. Drafting Advice: The Tone of the Friar
  Avoid making him defensive. A formidable Thomist is confident that reality is intelligible. He should treat the Knobe Effect as a fascinating confirmation of the complexity of the human will, rather than an attack on it.

  **Sample Internal Logic for the Friar:**
  *"You have discovered that the human mind refuses to treat good and evil as symmetrical data points. When the side effect is evil, the mind perceives a bond of obligation; when it is good, it perceives a gift. You call this a bias in attributing 'knowledge.' I call it the conscience recognizing the difference between a cost and a windfall. Your data proves that 'foresight' is never morally neutral for the agent, even if it is cognitively neutral. But do not mistake the map for the territory. The chairman's responsibility lies in his willingness to cause the harm, not in your linguistic reluctance to say he 'knew' the good."*

  ### Summary of the Philosophical Verdict
  *   **Would Aquinas expect the intentionality asymmetry?** Yes, insofar as he recognizes that evil imposes a binding obligation that good does not. He would say the folk are correctly identifying *culpability*, even if they misuse the word *intention*.
  *   **Would the "knew" asymmetry embarrass him?** Only if he conflated *attribution* with *reality*. If he maintains that the agent's actual cognitive state is the moral benchmark, the folk's reluctance to attribute knowledge is irrelevant to the agent's guilt, though interesting for psychology.
  *   **Ordinary Language:** He respects it as a sign of natural reason but corrects it with metaphysical precision. He would argue the Knobe Effect shows that ordinary language is inherently moralized, which is why we need technical philosophy to disentangle the *is* from the *ought*.

  This approach allows your friar to engage the psychologist as an intellectual peer who sees deeper into the data than the psychologist does, rather than as a reactionary rejecting science. It makes the Thomism look like the more robust explanatory framework.
