          *   *Friar's Stance:* The folk are right that the chairman is *responsible* for the harm, but wrong to call it "intended" in the strict sense. However, their intuition reveals a truth: bad side effects bind the will differently than good ones. (The "stain" of sin vs. the "accident" of good).

