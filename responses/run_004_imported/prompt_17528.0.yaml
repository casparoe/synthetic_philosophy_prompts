answer: |-
  **The Old Adam's Shift**

  The clock on the wall was analog, a deliberate anachronism in a room that hummed with silent, invisible efficiency. It ticked. That was the point. Elias liked the tick. It measured something.

  He sat at his station in the Municipal Archives, though there was nothing to archive. The algorithms had curated, sorted, and preserved the sum of human knowledge three generations ago. His job, like everyone else's, was ceremonial. He was assigned three hours a day, five days a week, to "verify" data streams that never errored. It was busywork designed to keep the blood moving, to give the *old Adam*, as the textbooks called it, something to gnaw on so it wouldn't gnaw on itself.

  Elias took it seriously. He straightened his collar. He aligned his stylus. He frowned at the holographic display as if a discrepancy might actually appear, a dragon to slay in a garden without weeds.

  " You're frowning again, Elias," said Mara from the next station. She was leaning back, her feet on the console, watching a stream of light dance across the ceiling. "It's not real work. The audit passed itself an hour ago."

  "Protocol is protocol," Elias said, not looking up. "If we don't verify, the system loses the habit."

  "The system doesn't have habits. We do." She smiled, a lazy, fluid expression. "Three o'clock. I'm going to the glass gardens. The orchids are blooming. Want to come?"

  "I have to finish this batch," Elias said.

  "It's a batch of nothing."

  "It's my shift."

  Mara shrugged, the movement effortless, and stood up. She didn't clock out. There was no clock-out. You just left when the three hours were done. To stay was considered eccentric; to leave early was normal. To stay late, as Elias often did, was viewed with a polite, clinical concern.

  When she left, the room felt larger, the silence heavier. Elias worked for another forty minutes, finding errors that weren't there, correcting values that were already perfect. He felt the familiar tightness in his chest, the itch of unspent energy. This was the surplus. The economic problem was solved. Hunger was a historical footnote. Scarcity was a museum exhibit. But the capacity to *stop* had not been distributed equally.

  He walked home through the city. It was beautiful, in the way a well-tended park is beautiful. There was no traffic, no noise, no grime. The buildings breathed, adjusting their transparency to the sunlight. People moved through the streets, but there was no rush. They walked with the loose-limbed gait of those who have nowhere to be and nothing to prove.

  Elias walked fast. He walked with purpose. He saw the looks people gave him. Not admiration. Pity.

  He passed a group sitting on a grassy slope near the river. They were passing a instrument around, playing a melody that started and stopped, improvised and abandoned. One of them, a young man with silver hair, caught Elias's eye. The young man wasn't working. He wasn't even creating anything permanent. He was just... filling the afternoon.

  Elias felt a surge of irritation, hot and sharp. *Do something,* he thought. *Build something. Learn something.*

  But he knew what they would say. *Why?*

  That was the question that had killed the old world. *Why?* Because it is there. Because it is good. Because I am.

  Elias arrived at his apartment. It was spacious, filled with light. He had everything he could want. And that was the problem.

  He met Julian for the evening meal at a terrace overlooking the valley. Julian was Elias's age, sixty cycles, but he looked younger. He carried no tension in his shoulders. He was a master of the new virtue: Leisure.

  "You look tired," Julian said, pouring wine that cost nothing because value was a deprecated concept.

  "Shift was demanding," Elias lied.

  "Verifying the void?" Julian smiled gently.

  "Someone has to maintain the discipline."

  "Discipline for what, Elias? We aren't saving for a rainy day. There are no rainy days. The climate is managed. The crops are managed. The only thing unmanaged is us." Julian took a sip. "Did you hear about Sarah? She's started learning to weave. By hand. No loom."

  "Is she producing cloth?"

  "No. She unravels it at the end of the day."

  Elias gripped his glass. "That's insane."

  "It's art. It's the act without the object. You should try it. Stop trying to accumulate outcomes."

  "I don't accumulate outcomes," Elias snapped. "I contribute. I participate."

  "You hoard," Julian said softly. "You hoard purpose. You treat time like it's still currency. But it's not. It's just... atmosphere. You're breathing it like you're running out of air."

  Elias looked out over the valley. The lights of the city were twinkling on, soft and warm. He thought of his grandparents. They had been farmers. They had understood the bargain: sweat for bread, pain for survival. They had virtues for that world. Thrift. Ambition. Prudence.

  In this world, those virtues were pathologies. A thrifty man in a world of abundance is a miser. An ambitious man in a world of satisfaction is a maniac. Elias felt like a hoarder of junk, but the junk was *intent*. He couldn't throw it away.

  "I have a project," Elias said defensively.

  "Of course you do."

  "I'm mapping the migration patterns of the pre-Adjustment birds. Correlating them with the old economic cycles."

  "Why?"

  "Because the data exists. Because it hasn't been fully cross-referenced."

  "And when you finish?"

  "I'll find something else."

  Julian shook his head. "That's the sickness, Elias. Keynes knew it. He said we'd be miserable. He said the idle rich of his time were the preview, and they were wretched. Bored, destructive, lonely. He thought we'd learn. But some of us... we just inherited the wiring of the survivors without the survival."

  "I'm not bored."

  "You're restless. You're an engine with no load. You're vibrating yourself apart." Julian reached across the table. "Come to the coast with me tomorrow. Just sit. Watch the water."

  "I can't. I have the morning shift. And then the mapping."

  "You are a slave to a ghost," Julian said. "The ghost of necessity. It's dead, Elias. Let it go."

  Elias walked home in the dark. The streets were empty. There was no crime, no fear. Just the vast, open expanse of the night.

  He entered his apartment and stood in the living room. The silence was absolute. He had three hours of sleep to prepare for, and then the shift, and then the mapping. A schedule. A structure.

  He went to his desk and activated the screen. The data streams flowed, blue and green ribbons of information. He began to sort them. He created a new folder. *Migration_Correlation_Final_v4.*

  He worked for an hour. He found a pattern. A slight deviation in the flight paths of geese in 2045 that correlated with a minor fluctuation in grain prices in the Asian sector. It meant nothing. It changed nothing. No one would read it. No one needed it.

  He sat back. He waited for the satisfaction of discovery. The old feeling. The *I did this. I made this happen.*

  It didn't come.

  There was only the hollow echo of the effort. He was a man digging a hole in a floor that was already glass, just to see the dirt underneath.

  He thought of Mara, watching the orchids. He thought of Julian, drinking wine. He thought of the weaver who unraveled her work. They were playing. He was working. But the work was a game they had all agreed to stop playing, except him.

  Keynes had written that thrift and ambition would look like personality disorders. Elias looked at his hands. They were trembling slightly. Not from fatigue. From the lack of it. He was overdosed on potential.

  He stood up and walked to the window. The city slept. There was no guard to keep. No wolf at the door. The wolf had been fed, petted, and sent away a generation ago.

  Elias realized then that he was not one of the grandchildren Keynes had promised. He was one of the ancestors, stranded in the future. He possessed the muscles for a struggle that had ended. He was a soldier in a world of peace, pacing the barracks, polishing a rifle that would never fire, terrified that if he put it down, he would cease to exist.

  He looked at the desk, at the glowing screen, at the meaningless task. He could turn it off. He could go to the coast with Julian. He could sit and watch the water.

  He reached for the switch.

  His hand hovered.

  The silence of the room pressed in. It was the silence of a solved problem. And Elias understood, with a cold, clarifying sorrow, that he was not equipped for the solution. He was a creature of the problem. Without the struggle, he was not a man resting; he was a man waiting.

  He didn't turn off the screen.

  He sat back down. He opened a new file. *Migration_Correlation_Final_v5.*

  He began to type. He typed with urgency, with sweat, with the desperate, feverish energy of a man trying to convince the universe that he was still necessary. He worked into the night, hoarding his hours, saving his purpose, a rich man starving in a banquet hall, unable to eat because he was still convinced he needed to hunt.

  Outside, the sun began to rise over a world that didn't need him. Inside, Elias worked, safe in the comforting, crushing weight of a burden that no longer existed. It was the only thing that made him feel real. The shift was over, but for Elias, the shift never ended. He was the old Adam, and he had found a way to keep the garden fenced, even if there was nothing left to guard.
