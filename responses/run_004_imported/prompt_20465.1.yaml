answer: |-
  # The Mortal Hazard: Stress-Testing Hegel's Defense of War

  The war in Ukraine has done more than redraw borders; it has dragged metaphysics out of the seminar room and into the street. As Western publics confront the reality of industrial slaughter after decades of relative peace, old questions about the moral function of conflict have resurfaced. Chief among them is G.W.F. Hegel's notorious assertion in the *Philosophy of Right* (1820): that a state which never fights risks internal rot.

  For Hegel, perpetual peace was not an ideal but a pathology. He argued that without the existential shock of war, civil society (*bürgerliche Gesellschaft*) calcifies. Citizens retreat into private property and comfort, forgetting that the State is an ethical entity with a claim on their lives that supersedes their right to safety. Karl Popper later branded this proto-fascist apologetics; defenders like Shlomo Avineri call it a functionalist observation about sovereignty. But refereeing that scholarly brawl misses the point. The urgency of the current moment demands we stress-test the argument itself. Does war actually preserve ethical health, or does Hegel's logic contain a fatal flaw?

  To judge this, we must first grant Hegel his strongest possible defense, stripping away the caricature of him as a bloodthirsty nationalist.

  ### The Case for the Negative: Hegel's Strongest Defense

  Hegel's argument is not that war is *good* in a moral sense, but that it is *necessary* in a structural sense. To understand this, one must understand his distinction between "civil society" and the "State." Civil society is the realm of the market, individual rights, and the pursuit of self-interest. It is where we work, buy, and secure our property. The State, for Hegel, is higher: it is the realm of *Sittlichkeit* (ethical life), where individuals find universal meaning beyond their private gain.

  The danger of modernity, Hegel saw, is that civil society tends to swallow the State. When peace becomes permanent, the citizen becomes the bourgeois. Politics reduces to the management of economic interests. The State becomes a night-watchman for property rights rather than a vessel for collective freedom. In this stagnation, the "finitude" of human life—our vulnerability and mortality—is forgotten in a haze of security and accumulation.

  War, in this framework, acts as a metaphysical reset. It is the moment of "negativity." By demanding the ultimate sacrifice, the State reminds the individual that their life is not merely their own property. It shatters the illusion of security that encourages selfishness. As Hegel writes, war preserves the "ethical health of peoples in their indifference to determinate institutions."

  The strongest version of this defense relies on the concept of *sovereignty*. A state that cannot demand death is not truly sovereign; it is merely a large corporation. If the citizen's right to life is absolute, the State's authority is conditional. War validates the State's supremacy. Furthermore, proponents argue that history bears Hegel out: moments of national crisis often produce spikes in civic solidarity, trust, and a sense of shared purpose that decades of prosperity cannot buy. The "rot" Hegel fears is the atomization of liberal society, and war is the tragic firebreak that stops the spread of apathy.

  ### The Case for the Rot: The Stress Test

  However, when we subject this logic to empirical and moral stress-testing, the argument fractures. The critique rests on three pillars: the empirical reality of modern war, the moral hazard of instrumentalization, and the category error regarding "ethical health."

  First, the empirical claim that war cures selfishness is historically dubious. Hegel envisioned "cabinet wars" between professional armies, limited in scope. He could not foresee total war, industrial slaughter, or the military-industrial complex. In modern conflicts, war often accelerates the very "rot" Hegel feared. Instead of sublimating private interest into public good, war frequently creates lucrative markets for defense contractors, warlords, and profiteers. The 2003 invasion of Iraq did not unify the American ethical spirit; it fractured it, deepening cynicism and partisan distrust. Far from shaking citizens out of their private rut, modern war often allows the private sector to colonize the state further.

  Second, there is the moral hazard. Hegel's argument requires instrumentalizing human beings. To treat the death of citizens as a "remedy" for social stagnation is to view them as fuel for the State's metaphysical ego. Even if war *did* produce civic unity, the cost is the literal destruction of the subjects the State is supposed to protect. A State that kills its own children to keep them virtuous is a logical contradiction. It is akin to burning down a house to remind the inhabitants of the value of shelter.

  Third, and most damning, is the nuclear and existential shift. Hegel assumed the State would survive the war to enjoy the renewed ethical health. In an era of nuclear weapons or existential conflict, war threatens the *abolition* of the ethical community entirely. You cannot have "ethical vitality" in a radioactive wasteland. Hegel's dialectic requires a future synthesis; total war eliminates the future.

  Finally, Hegel commits a category error by conflating "ethical unity" with "willingness to die." Civic solidarity can be generated through positive projects—climate mobilization, public health crises, space exploration—without the need for an external enemy. The solidarity seen in Ukraine is not born of a desire for war, but of a defense of home against aggression. The virtue lies in the *defense*, not the *conflict*. Hegel mistakes the fever for the cure.

  ### The Verdict

  So, where does the weight fall? We must avoid the cop-out that "both sides have a point." Hegel's argument is logically coherent within his own closed system, but it fails when exposed to the reality of human politics.

  **The verdict is that Hegel is wrong.**

  He is wrong not because peace is inherently virtuous, but because his diagnosis of the "rot" is correct while his prescription is lethal. Hegel correctly identified that liberal peace risks atomization and that a state reduced to economic management loses its legitimacy. He was right to fear a citizenry that values comfort over freedom.

  However, he was catastrophically wrong to believe war is the antidote. War does not purify the state; it distorts it. It concentrates power in the executive, erodes civil liberties, and empowers the very private interests (arms manufacturers, security sectors) that Hegel thought it would subordinate. The "ethical health" war produces is often the health of a body under stress, surviving on adrenaline rather than nutrition. Once the war ends, the society often finds itself more fractured, more militarized, and more cynical than before.

  Furthermore, Hegel's argument relies on a state that is rational and ethical (*Sittlichkeit*). But if the State is the arbiter of when war is necessary for "health," it grants itself a license for endless aggression. There is no mechanism in Hegel's logic to stop a state from manufacturing conflicts to maintain its own "vitality." This is not just a risk of fascism; it is a structural inevitability of the logic itself.

  The Ukraine war does not vindicate Hegel; it refutes him. The unity seen in Ukraine is not a result of war's "purifying" nature, but a reaction to imperial annihilation. It is a unity of *survival*, not of *ethical renewal*. If given the choice, Ukrainians would choose the "rot" of peace over the "health" of war every time.

  Hegel's error was to aestheticize politics. He saw war as a tragic but necessary moment in the dialectic of spirit. In reality, war is a breakdown of politics. It is the failure of the State to secure its ends through reason. To argue that war is necessary for the state's soul is to admit that the state has failed to be a home for its citizens in peacetime.

  We can accept Hegel's warning—that a society obsessed with private comfort is fragile—without accepting his solution. The challenge of the 21st century is to find sources of civic meaning and solidarity that do not require a graveyard to sustain them. Hegel thought that was impossible. History, and the ashes of the 20th century, prove him wrong. The state that needs war to feel alive is already dead.
