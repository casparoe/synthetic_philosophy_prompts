      *(Self-Correction during drafting)*: I need to make sure I explain *why* Mental Reservation isn't Augustine's. Augustine's view is that the speech must match the mind. Mental Reservation relies on the mind holding a different meaning than the speech implies to the listener. While Augustine cares about the mind/speech match, he also cares about the *intent to deceive*. Mental Reservation *intends* to deceive the listener (just not with a falsehood). Augustine generally condemns the intent to deceive. So attributing it to him is historically and philosophically wrong.

      *Grading adjustment:* The student answered the "what is mental reservation" part well. She failed the "compare to Augustine" part. I should give credit for knowing what mental reservation *is*, but deduct heavily for the link.

