answer: |-
  Here are 10 interview questions designed for a philosophy podcast audience that already knows the basics. They move from ontology to probability, identity, and finally theory choice, with follow-ups that anticipate standard Everettian defenses.

  ### 1. The Ontological Status of "Worlds"
  **Question:** Let's start with the furniture of the universe. On your view, is the wavefunction the *only* fundamental entity, with "worlds" being emergent structures within it? If worlds are emergent, doesn't that introduce a worrying vagueness to when a branch actually comes into existence?
  **Follow-up:** *If she says worlds are emergent/fuzzy:* "If the number of worlds isn't a precise fact, how do we make sense of probability claims that seem to rely on counting or measuring distinct outcomes? Can vague objects bear precise probabilities?"

  ### 2. The Preferred Basis Problem (Required)
  **Question:** A classic objection is that the formalism doesn't tell us *which* basis the world splits into. The standard Everettian reply is 'decoherence.' But critics argue that invoking decoherence is quietly circular: don't you have to already assume a split between 'system' and 'environment' to get decoherence off the ground, which is precisely what you're trying to derive?
  **Follow-up:** *If she argues decoherence is objective:* "But doesn't the choice of tensor product structure—the way we carve Hilbert space into subsystems—still look like a free parameter we impose, rather than something the physics dictates uniquely?"

  ### 3. The Deutsch-Wallace Derivation (Required)
  **Question:** Let's talk about the Born Rule. The Deutsch-Wallace decision-theoretic derivation is a major selling point for modern Everettians. But does this derivation actually show that the Born Rule is *true*, or merely that a rational agent should *act as if* it were true? Is there a gap between pragmatic rationality and metaphysical truth here?
  **Follow-up:** *If she insists it justifies belief:* "If an agent knows the universe is deterministic and all outcomes occur, why should they care about branch weights at all? Why not treat all future branches as equally 'real' and maximize utility across the sum of them?"

  ### 4. Subjective Uncertainty in a Deterministic Theory (Required)
  **Question:** Connected to that: in a fully deterministic multiverse, everything that *can* happen *does* happen. So what is the content of my uncertainty before a measurement? If I know the global state, what don't I know? Are you relying on 'self-locating uncertainty,' and if so, is that enough to ground the concept of chance we need for physics?
  **Follow-up:** *If she appeals to self-locating uncertainty:* "But self-locating uncertainty usually implies I could end up in *any* of the locations. In MWI, I end up in *all* of them (as successors). Does 'uncertainty' dissolve into mere ignorance of which copy I'll *experience* being, and isn't that just smuggling in a single-world perspective?"

  ### 5. Personal Identity and Quantum Suicide (Required)
  **Question:** I want to press on personal identity using the Quantum Suicide thought experiment. If I set up a device that kills me on one branch and lets me live on another, the 'suicide' argument suggests I should expect to survive. But most Everettians reject this. On your view, what happens to the *pre-branch* me? Do I survive as both, neither, or is the question ill-posed?
  **Follow-up:** *If she says identity is a matter of degree or fission:* "If fission means I survive as both successors, why shouldn't I fear the branch where I die? If one of my successors experiences death, isn't that a bad outcome for me *now*, regardless of the other successor's survival?"

  ### 6. Ockham's Razor and Parsimony
  **Question:** Proponents often argue MWI is parsimonious because it removes the collapse postulate. But critics say you're trading qualitative parsimony (fewer laws) for extreme quantitative parsimony (infinite worlds). Why should we think saving a dynamical law is worth the ontological explosion of infinite universes?
  **Follow-up:** *If she argues laws are more costly than stuff:* "Is that a methodological principle we can justify, or just an aesthetic preference? If a theory posits invisible dragons to save a law, we'd reject it. What makes branches different from dragons?"

  ### 7. Locality and Relativistic Constraints
  **Question:** Everettians often claim their interpretation is more compatible with relativity than collapse theories because there's no action-at-a-distance. But if branching is a physical process, does it happen instantaneously across space? How do you reconcile the 'splitting' of the universe with the constraints of light cones?
  **Follow-up:** *If she says branching is local:* "If branching propagates at the speed of light, doesn't that mean there's a period where the state of the universe is indeterminate between 'branched' and 'unbranched'? Does that reintroduce the vagueness problem we discussed earlier?"

  ### 8. Empirical Equivalence and Theory Choice
  **Question:** MWI is often claimed to be empirically equivalent to standard Copenhagen quantum mechanics. If two theories make the exact same predictions for all possible experiments, is choosing between them purely a metaphysical decision? Is there *any* observation that could count as evidence against Everett?
  **Follow-up:** *If she says no observation could falsify it:* "If a theory is immune to empirical falsification because it predicts all outcomes, does it risk ceasing to be a physical theory and becoming a metaphysical framework? How do we avoid sliding into non-naturalism?"

  ### 9. Comparison with Bohmian Mechanics
  **Question:** Why Everett over Bohm? Bohmian mechanics also restores determinism and removes collapse, but gives you a single world with a guiding wave. Is your rejection of Bohm purely due to non-locality, or is there something about the 'empty wave' in Bohm that you find less parsimonious than the 'full waves' in Everett?
  **Follow-up:** *If she cites non-locality as the dealbreaker:* "But if MWI branching has to respect relativity (as per Q7), aren't you facing a similar tension? Is the 'locality' advantage of Everett actually as clear-cut as proponents claim?"

  ### 10. The "So What?" Question
  **Question:** Finally, suppose we grant you the Everettian view. Does this change how we should *do* physics, or how we should live? If the branches don't interact, does the existence of my other selves have any normative weight, or is it just a fascinating metaphysical footnote?
  **Follow-up:** *If she says it changes nothing about practice:* "If it changes nothing about practice, prediction, or observation, is the debate over interpretations ultimately about what kind of story we want to tell ourselves, rather than what the world *is*?"
