      *   *Argument 1: The Territory includes Social Facts.* If humans are in the territory, human agreements are in the territory. Money is a cluster of "acceptance properties."
      *   *Argument 2: Reflexivity.* Social kinds can *create* the cluster they name. This is still a cluster. (Hacking's "Interactive Kinds").
      *   *Argument 3: The "Arbitrary" Test.* An arbitrary line (e.g., "things heavier than 1.0001 kg") doesn't help prediction. A social kind (e.g., "Dollar") helps massive prediction. Therefore, it's not arbitrary in the Yudkowskian sense.
      *   *Nuance on Race/Gender:* Distinguish between biological clustering (weak for race) and social clustering (strong for race/gender). The "joint" being carved is social, not biological.
