      *   **Requirements:**
          1.  Concrete recommendation on the TA (sanction, no sanction, middle ground).
          2.  Forward-looking recommendation on the rule (exception, footnote, nothing).
          3.  Reasoning must *genuinely engage* Confucian Role Ethics (constitutive relations, not just "loyalty matters").
          4.  Reasoning must *answer the impartialist objection on its merits* (not just wave it away).
