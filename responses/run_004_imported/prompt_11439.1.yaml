  7.  **Final Polish:** Check the Confucian citations. *Analects* 13.18 is the "Father covers for son, son covers for father" passage. *Mencius* 7A:35 is the Shun passage. Ensure Ames/Rosemont's specific "role ethics" flavor (focus on *li*/ritual propriety and relational constitution) comes through.

      *(Self-Correction on Policy Recommendation)*: If I suggest a policy change that allows family exceptions, the impartialists will revolt. I need to frame it as "Restorative Intervention." If the witness ensures the violator self-corrects, that counts as satisfying the integrity requirement. This aligns with Confucianism (cultivating virtue) and Impartialism (integrity is maintained).

  8.  **Finalizing the Memo Structure:**
      *   To/From/Date/Subject.
      *   Case Summary.
      *   Ethical Analysis (Impartialism vs. Role Ethics).
      *   Recommendation on Sanction.
