answer: |-
  This is an excellent hunch, and you are right to press on it. In fact, you have put your finger on perhaps the most significant internal tension in *Material Beings*. Many critics (most notably Trenton Merricks, David Lewis, and later Elizabeth Barnes) have argued exactly this: van Inwagen's "Organicism" violates the very methodological constraints he imposes on his opponents.

  To help you build this argument for your reading group, we need to move beyond a generic "biology is vague" complaint. We need to show that **Organicism generates the same kind of ontic vagueness (or arbitrary sharp cutoffs) in the *composition relation* that van Inwagen claims is impossible.**

  Here is a structured argument you can present, broken down into the reconstruction of his view, the symmetry objection, and the specific "Boundary of the Life" problem.

  ### 1. Reconstructing Van Inwagen's Constraint (The "Vagueness Argument")

  First, ensure your group agrees on *why* van Inwagen rejects views like "fastening." It's not just that fastening is vague; it's what that vagueness implies about existence.

  *   **Premise A (No Ontic Vagueness):** It is impossible for there to be vague existence. It cannot be an indeterminate fact of the world whether an object exists. (Vagueness is linguistic/representational, not metaphysical).
  *   **Premise B (The Sorites of Composition):** For any restricted composition principle based on physical relations (contact, fastening, cohesion), we can construct a Sorites series (e.g., slowly welding two rods).
  *   **Premise C (The Dilemma):** In such a series, either:
      1.  Composition switches from "no" to "yes" at a precise point (e.g., movement of a single electron). This is an **arbitrary sharp cutoff** with no metaphysical grounding.
      2.  There is no precise point. This implies **vague existence** (it is indeterminate whether the composite exists).
  *   **Conclusion:** Since (2) is impossible (by A) and (1) is implausible/arbitrary, Restricted Composition (Contact, Fastening, etc.) is false.

  Van Inwagen claims Organicism escapes this because "constituting a life" is not a conventional cutoff like "fastening," but a **natural fact**.

  ### 2. The Symmetry Argument: Life vs. Fastening

  Your goal is to show that "constituting a life" is subject to the exact same Sorites pressure as "fastening."

  **The Argument:**

  1.  **Van Inwagen's Criterion:** A view is acceptable only if it avoids ontic vagueness in composition without positing arbitrary, ungrounded sharp cutoffs in continuous physical processes.
  2.  **The Organicism Claim:** The $xs$ compose a $y$ iff the activity of the $xs$ constitutes a life.
  3.  **The Biological Sorites:** Biological "activity constituting a life" is physically realized by continuous processes (metabolic exchange, cell division, shedding, viral integration).
      *   *Example:* Consider a cat shedding a hair. There is a continuous physical process where a cell transitions from being metabolically integrated to being detached dead matter.
      *   *Example:* Consider a virus inserting DNA. At what exact micro-second does the viral activity become (or cease to be) part of the host's life-activity?
  4.  **The Dilemma for Organicism:** In these biological Sorites series, either:
      1.  There is a precise moment where a particle ceases to be "caught up in a life." (Arbitrary Sharp Cutoff).
      2.  It is indeterminate whether a particle is "caught up in a life." (Vague Existence).
  5.  **The Implication:** If (2), Organicism violates **Premise A** (No Ontic Vagueness). If (1), Organicism violates the spirit of the critique against **Premise C** (Arbitrary Cutoffs).
  6.  **Conclusion:** Organicism does not earn its keep. It survives the Vagueness Argument only by asserting a biological precision that does not exist, or by accepting the vagueness it forbids in rivals.

  ### 3. The "Boundary of the Life" Problem (The Knockout Punch)

  The strongest version of this argument focuses on van Inwagen's specific solution to the **Problem of the Many**.

  **Van Inwagen's Move:**
  He admits there are many overlapping aggregates of simples in the shape of a cat (one including a loose hair, one excluding it, etc.). However, he claims **only one** of these aggregates has parts whose activity constitutes *the* life. The others are merely "cat-wise arranged simples." Thus, there is only one cat, not many.

  **Your Counter-Argument:**
  This move *presupposes* that the event "the life of the cat" has precise mereological boundaries. It assumes there is a fact of the matter about exactly which simples are participating in the life-event.

  **Challenge the Group with this Scenario:**
  Imagine a skin cell on the cat's ear. It is in the process of apoptosis (programmed cell death). It is still physically attached, but its metabolic activity is shutting down.
  *   **Question:** Is the activity of *this specific cell* part of the life-event of the cat?
  *   **Option 1: Yes.** Then the cell is part of the cat.
  *   **Option 2: No.** Then the cell is not part of the cat.
  *   **Option 3: It's Indeterminate.**

  If van Inwagen chooses **Option 3**, he admits ontic vagueness. He admits it is indeterminate whether the simples compose the cat. This contradicts his core metaphysical thesis in *Material Beings*.

  If van Inwagen chooses **Option 1 or 2**, he must identify a **sharp cutoff**.
  *   *Ask:* What is the metaphysical ground for this cutoff?
  *   If he says "Biology decides," point out that biology describes gradients, not sharp metaphysical switches. Biology might say "99% integrated," but van Inwagen needs "100% or 0%."
  *   If he says "Metaphysics decides," then the cutoff is **arbitrary**. It is no different than saying "composition occurs when the rods are 1mm apart." Why *this* micro-state of the cell and not the one before it?

  **The "Fastening" Parallel:**
  When van Inwagen attacks "fastening," he asks: "Why does composition begin *exactly* when the molecules are this distance apart?" He finds it absurd that a tiny physical difference could mean the difference between *one object* and *two objects*.
  You must ask him the same question about "Life": "Why does the life-event include *exactly* this electron involved in respiration, but not the one next to it that is about to be inhaled?"

  If he cannot answer this without arbitrariness, Organicism suffers the exact same defect as "Fastening."

  ### 4. Anticipating His Defense (and Countering It)

  Your group member who thinks van Inwagen handles this is likely thinking of van Inwagen's distinction between **representational vagueness** and **ontic vagueness**.

  **Van Inwagen's Likely Defense:**
  He might argue: "The *concept* of 'life' is vague, but the *event* of a life is precise. The world is precise; our language is not. There *is* a fact of the matter about which simples are caught up in the life, even if we can't know it." (This is an epistemicist stance).

  **Your Rebuttal:**
  1.  **The Cost of Epistemicism:** If he takes this route, he is an epistemicist about biological boundaries. This is a massive, controversial metaphysical commitment. He imposes this cost on his opponents (they must be epistemicists about fastening), so he must bear it too. It weakens his claim that Organicism is the "common sense" or "natural" view.
  2.  **The Nature of Events:** Van Inwagen treats lives as *events*. But events involving physical particulars inherit the boundaries of those particulars. If the physical involvement of a particle in a process is gradual (e.g., diffusion of oxygen), the event's boundary is gradual. To say the event is sharp is to divorce the event from its physical realization.
  3.  **The "Virtual Proper Parts" Escape:** In later work, van Inwagen suggests organisms have "virtual proper parts." He might try to say the *organism* is precise even if the *matter* is vague.
      *   *Counter:* The Special Composition Question is about **simples composing an object**. If it is vague which simples compose the object, it is vague whether the object exists (since the object is identical to the simples composing it). He cannot save the object's precision by making the composition relation vague.

  ### 5. Summary for the Group

  To wrap this up in your discussion, you can frame it as a **Methodological Inconsistency**:

  > "Van Inwagen rejects Restricted Composition because it requires us to believe in magical sharp cutoffs in continuous physical series (or vague existence). But Organicism *also* relies on a continuous physical series (biological integration). To save Organicism, van Inwagen must either admit vague existence (violating his core principle) or posit a magical sharp cutoff in biological processes (violating his critique of rivals). Therefore, Organicism does not solve the problem; it merely relocates it from 'physics' to 'biology,' without reducing the metaphysical cost."

  This shows you aren't just saying "vagueness is everywhere," but rather that **van Inwagen's specific solution fails to satisfy his own specific constraints.** That is the strongest possible philosophical objection.
