answer: |-
  You have spotted a genuine tension in the text, but you're right to suspect that for Rousseau, these aren't two separate complaints—they are the **cause and effect** of the same spiritual disease.

  To answer your question directly: **It is one argument.** The psychological corruption (the "lying") is the inevitable result of the social/economic corruption (the "selling").

  Here is how you bridge that gap using *amour-propre*, and how you can actually turn your friend's Goffman point against him.

  ### 1. The Bridge: *Amour-Propre* and Alienation
  You mentioned *amour-propre* (the kind of self-love that depends on comparing yourself to others and seeking their validation), and that is exactly the key.

  For Rousseau, a virtuous human being is **transparent**. What you feel inside matches what you show outside. You are "one with yourself."
  *   **The Psychological Half:** When the actor "grows passionate in cold blood," they are severing the link between inner feeling and outer expression. They are creating a split self.
  *   **The Economic Half:** Why do they do this? Because they have submitted their will to the audience. By "putting his person up for sale," the actor makes their existence dependent on the approval (and money) of others.

  **The Synthesis:** You cannot "traffic in yourself" without "counterfeiting yourself." As soon as you make your value dependent on an audience's applause (economic/social), you *must* cease to be authentic (psychological). The "lying" isn't just a tactic; it's the structural requirement of the profession. The actor doesn't just tell lies; **the actor *is* a lie.**

  ### 2. Turning Goffman Against Your Friend
  Your friend is using Erving Goffman's *The Presentation of Self in Everyday Life* to say, "We all act, so acting is natural."

  Here is the Rousseauian counter-move: **Rousseau agrees with Goffman, but thinks that's a horror story, not a defense.**

  Rousseau's entire political philosophy is basically: *Civilization forces us to wear masks (Goffman's performance), and this is why we are miserable and corrupt.*
  *   **Your Friend's Point:** "We all perform social roles, so actors are just doing it professionally."
  *   **The Rousseau Rebuttal:** "Exactly. Social life is already corrupt because we are all constantly performing for *amour-propre*. The theater doesn't just reflect this; it **celebrates and institutionalizes** it."

  For Rousseau, the theater is a factory that mass-produces inauthenticity. If everyday life is a sickness where we pretend to be things we aren't to gain status, the theater is the temple where we worship that sickness. By paying actors to lie professionally, society validates the idea that *appearance is more important than truth.*

  ### 3. The "Servile" Aspect (The Second Half of the Quote)
  The second half of your quote ("submits to the disgrace... trafficking of himself") is crucial because it removes the actor's **autonomy**.

  Rousseau values freedom as autonomy (obeying laws you prescribe to yourself). The actor, by definition, obeys the script of another and the whims of the audience.
  *   If an audience laughs at a tragedy, the actor must keep going.
  *   If an audience boos, the actor is humiliated.
  *   The actor's emotional state is held hostage by the paying public.

  This connects back to the "lying." You cannot be free (and therefore moral, for Rousseau) if you are a servant to the audience's gaze. To be a servant, you must suppress your own true reactions and adopt the ones that will keep the money flowing.

  ### How to Go Back to Your Friend
  Don't just say "Rousseau said acting is lying." That's too simple. Try this angle:

  1.  **Concede the Goffman Point:** "Okay, you're right. We do perform selves in everyday life."
  2.  **Pivot to the Normative:** "But Rousseau's point isn't that acting is unique; it's that **performance is the problem.**"
  3.  **The Knockout:** "Goffman describes *how* society works; Rousseau diagnoses *why* it makes us unhappy. If we are all 'acting' in daily life to gain validation (*amour-propre*), then professional acting isn't a harmless hobby—it's the commodification of our alienation. It takes the worst part of social interaction (inauthenticity) and sells tickets to it."

  **Summary:** Rousseau isn't stacking unrelated objections. He is arguing that **economic dependence on public opinion necessitates psychological inauthenticity.** You cannot sell the performance without losing the self.
