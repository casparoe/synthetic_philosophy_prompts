prompt: |-
  So we had student council today and I'm still kind of annoyed about it, figured I'd write it out instead of just complaining to my friends lol. I'm the sophomore class rep and our school's letting us hold an actual student vote on whether to switch from our normal 7 period day to a block schedule (4 longer classes) starting next year, instead of admin just deciding it top-down, which sounds nice in theory except literally nobody agrees on who should even get to vote in it. The senior class president thinks current seniors shouldn't have to bother voting since they'll already be graduated before it ever takes effect, but then half the senior class still wants a vote anyway because they've "been here the longest" and feel like they've earned a say regardless. Meanwhile the 8th graders coming in as freshman next year, aka the literal first class that has to live with this thing for all 4 years, don't get a vote at all right now since they're not technically enrolled yet, which feels backwards to me. And then theres our vocational-program kids who are only physically at our school for like 2 classes a day since they spend the rest at the tech center across town, and a couple council members think their vote should count for less since the new schedule effects them less than it does everyone else.

  Could you actually write this up like a memo I could read out at our meeting Tuesday, like something with a real recommendation and the reasoning behind it, not just "here's 3 options, you pick"? I want it to defend an actual rule for who counts as a legit voter here that we could just reuse, because I already know this exact fight is gonna happen again with prom or the dress code or whatever comes up next. Also please don't dodge the "why should people who won't even be here for it get a vote" argument, since that's honestly the strongest card the senior class president has and I don't want us to just wave it away.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Sophomore Class Rep on Student Council.
      *   **Context:** Student Council meeting coming up Tuesday.
      *   **Issue:** Determining voter eligibility for a referendum on switching to a block schedule (4 longer classes vs. 7 periods).
      *   **Conflict:**
          *   Seniors: Some say they shouldn't vote (graduating before implementation), others say they *should* vote (tenure/earned say).
          *   Incoming Freshmen (current 8th graders): Most affected (4 years), but currently unenrolled/no vote.
          *   Vocational Students: Part-time on campus, some council members think their vote should count less.
      *   **Goal:** A formal memo to read at the meeting.
      *   **Requirements:**
          *   Must make a *specific recommendation* (not just options).
          *   Must establish a reusable rule/principle for future votes (prom, dress code, etc.).
          *   Must directly address the "Seniors won't be here" argument (don't dodge it).
          *   Tone: Professional but persuasive, suitable for a high school student council setting.

  2.  **Determine the Core Principle:**
      *   To solve this for *future* issues too, I need a guiding philosophy.
      *   *Option A: Stakeholder Impact.* Who is most affected? (Favors incoming freshmen, disfavors seniors).
      *   *Option B: Current Enrollment.* Who is officially a student now? (Favors seniors, excludes incoming freshmen).
      *   *Option C: Hybrid/Representation.* (Too complicated).
      *   *Decision:* The strongest democratic principle for a *school* setting is usually "Current Enrollment + Significant Impact." However, since incoming freshmen aren't enrolled, they can't vote directly. Seniors *are* enrolled.
      *   *Refined Principle:* "Current Enrollment determines eligibility, but Council acts as proxy for future students."
      *   *Wait, a better principle for unity:* "One Student, One Vote" based on *current* status, but acknowledging the limitation.
      *   *Actually, looking at the prompt:* The user wants to defend an *actual rule*. The fairest rule that stands up to scrutiny is usually based on **current enrollment status**. Why? Because it's objective. Incoming 8th graders can't vote because they aren't students *yet*. Seniors *can* vote because they are students *now*, even if they leave soon. Vocational students *must* have equal votes because they are enrolled students.
      *   *Addressing the Senior Argument:* The prompt specifically asks not to dodge the "why should people who won't be here get a vote" argument.
      *   *Counter-argument:* Seniors contribute to the culture *now*. Their experience validates the quality of education. Also, excluding a current class sets a dangerous precedent for student government power.
      *   *Addressing the Vocational Argument:* Equal rights for enrolled students. Discrimination based on schedule is illegal/unethical in a student body context.
      *   *Addressing the Incoming Freshmen:* We can't let them vote directly (logistical nightmare, not enrolled), but the Council *must* consider their interest as stewards.

      *   *Wait, let's pivot for a stronger stance:* If the goal is to set a precedent for *future* votes (Prom, Dress Code), the "Current Enrollment" rule is the most sustainable.
      *   *Recommendation:* All currently enrolled students (9-12) get one equal vote. Vocational students are fully included. Incoming 8th graders are represented by the Council's deliberation, not a direct vote. Seniors vote because they are current members of the community.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the opportunity (admin letting us vote is huge) but state the problem (eligibility chaos).
      *   **The Recommendation:** Clear and bold. All currently enrolled students (including Vocational) get one vote. Incoming 8th graders do not vote directly.
      *   **Reasoning 1: The Senior Question (The "Elephant in the Room"):** Address the "they won't be here" argument.
          *   *Argument:* They are current community members.
          *   *Precedent:* Excluding them undermines the "Student" in Student Council.
          *   *Nuance:* Their vote is about legacy and current culture, not just future logistics.
      *   **Reasoning 2: The Vocational Question:**
          *   *Argument:* They are enrolled students. Partial presence $\neq$ partial citizenship.
          *   *Precedent:* Equal protection/rights within the student body.
      *   **Reasoning 3: The Incoming Freshmen (8th Graders):**
          *   *Argument:* Logistically impossible/irregular to let non-students vote.
          *   *Solution:* Council's job is to advocate for them since they can't speak yet.
      *   **The Precedent (Future Proofing):** Explicitly state this rule applies to Prom, Dress Code, etc.
      *   **Closing:** Call to action.

  4.  **Refining the Tone:**
      *   Needs to sound like a Sophomore Rep (respectful but firm, not bureaucratic gibberish).
      *   Avoid "admin-speak" but keep it structured.
      *   Make sure the "Senior" argument feels respected but dismantled logically.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is excluding the 8th graders too harsh? They are the most affected.
      *   *Fix:* Acknowledge the irony. Emphasize that the *Council* represents them. The vote is about *current* students approving a change that affects the *school*, not just individuals.
      *   *Critique:* Is the Senior argument strong enough?
      *   *Fix:* Frame it as "Stewardship." Seniors steward the school culture. If they hate the schedule change, they might sabotage the transition. Their buy-in matters.
      *   *Critique:* Vocational students.
      *   *Fix:* Keep it simple. Enrolled = Vote. No tiers of citizenship.

  6.  **Final Polish:** Check against constraints.
      *   Memo format? Yes.
      *   Specific recommendation? Yes.
      *   Reusable rule? Yes.
      *   Address Senior argument directly? Yes.
      *   No dodging? Yes.

  7.  **Final Output Generation** (Proceed to write the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Student Council Executive Board & Class Representatives
  **FROM:** [Your Name], Sophomore Class Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Voter Eligibility for Schedule Referendum

  **Purpose**
  The administration has offered us a significant opportunity: a student referendum to decide whether the school transitions to a block schedule next year. However, we are currently stalled on defining *who* constitutes a eligible voter. Without a clear standard, we risk invalidating the results or setting a dangerous precedent for future council decisions regarding prom, dress code, and budget allocation.

  This memo outlines a specific recommendation for voter eligibility, the reasoning behind it, and a standardized framework to prevent this conflict from recurring.

  **Recommendation**
  I move that voter eligibility for the schedule referendum (and all future binding student body votes) be defined as follows:

  1.  **Eligibility:** All currently enrolled students in grades 9 through 12 possess one equal vote.
  2.  **Vocational Students:** Students enrolled in the off-campus vocational program retain full voting rights equal to on-campus students.
  3.  **Incoming Freshmen:** Current 8th graders are not eligible for direct voting as they are not yet enrolled students. Their interests are to be represented by the Council's deliberation process.
  4.  **Precedent:** This definition of "The Student Body" shall apply to all future council-managed referendums.

  **Reasoning & Defense of Policy**

  **1. The Senior Class Argument (Tenure vs. Impact)**
  The strongest argument against senior eligibility is that they will not be present to experience the consequences of this change. While factually true, this logic is flawed for two reasons:

  *   **Current Citizenship:** Student Council represents the *current* student body, not the *future* one. Seniors are full members of this community today. They contribute to the school culture, maintain the facilities, and set the tone for underclassmen. Stripping them of voting rights because they are leaving creates a "lame duck" class that is disenfranchised during their final months.
  *   **Implementation Risk:** Even if seniors graduate before the schedule starts, they are responsible for the transition culture this year. If seniors feel ignored on a major policy shift, they are less likely to support the Council or the administration during the remainder of the year. We need their buy-in to ensure a stable environment for the underclassmen who *will* stay.

  **2. The Vocational Program Argument (Equal Enrollment)**
  There has been discussion about weighting votes for vocational students because they are on-campus less frequently. I strongly advise against this.

  *   **Tiers of Citizenship:** We cannot establish a precedent where some enrolled students have "more" of a voice than others based on their schedule. They pay the same tuition/fees, hold the same enrollment status, and are subject to the same handbook rules.
  *   **Impact Misconception:** While they are off-site for some classes, a block schedule affects bus routes, lunch periods, extracurricular eligibility, and graduation requirements for *every* student. Their stake in the outcome is equal, regardless of physical location.

  **3. The Incoming Freshmen (8th Grade) Argument**
  It is ironic that the class most affected (the incoming freshmen) cannot vote. However, allowing non-enrolled students to vote is logistically and legally unfeasible. They are not yet under the school's jurisdiction.
  *   **Our Duty:** This is where the Council must step up. Since 8th graders cannot speak for themselves in this vote, it is the job of every Representative here to advocate for their specific interests during our debates. We are their proxies. If we pass this eligibility rule, we must explicitly acknowledge that we are voting on their behalf as much as our own.

  **Conclusion**
  If we do not set a hard rule now, we will have this same fight before Prom voting or when allocating student funds. "Impact" is subjective; "Enrollment" is objective.

  By voting **Yes** on this eligibility framework, we affirm that:
  1.  Every enrolled student has an equal voice.
  2.  We respect the tenure of our graduating class.
  3.  We accept the responsibility of representing those who cannot yet vote.

  I request we move to adopt this eligibility standard immediately so we can proceed with the referendum timeline.
