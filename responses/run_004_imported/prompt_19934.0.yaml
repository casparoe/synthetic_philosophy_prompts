answer: |-
  Here is a toast designed to honor your grandfather, acknowledge the reality of his aging, and subtly validate your reading of Cicero without turning the birthday party into a philosophy seminar.

  **Tone:** Warm, grounded, respectful, and clear for non-Latin speakers.
  **Time:** Approx. 3-4 minutes.

  ***

  **The Toast**

  Good evening, everyone. For those who don't know me, I'm [Your Name], [Grandpa's Name]'s grandchild.

  When I started thinking about what to say for 85 years, I knew I had to talk about Latin. Mostly because if I didn't, the former department heads in the back row would fail me. But also because my grandfather taught a specific text for thirty-five years that feels incredibly relevant tonight: Cicero's *On Old Age*.

  Now, Cicero wrote this dialogue as a conversation between older men in Rome. And there's a common criticism that the advice only works if you're a wealthy Roman senator with a massive estate and people hanging on your every word. It's easy to say aging is dignified when you never have to worry about money or mobility.

  But looking at my grandfather, I think Cicero got something right that goes beyond privilege. He argues that old age isn't a tragedy; it's a specific phase of nature with its own duties, distinct from the duties of youth.

  Grandpa, we know the physical reality. We know the knees don't work like they used to. We know the car keys have been retired. Cicero admits this, too. He says the body naturally withdraws from physical exertion. He doesn't tell you to pretend you can still run marathons. He tells you that strength was never the point of being human to begin with.

  The point, he says, is *cultivation*.

  Cato, the main speaker in the book, says that agriculture is the best pursuit for an old man. Not because he needs the crops, but because the earth never refuses authority and never holds a grudge. You put something in, you tend to it, and eventually, it grows.

  That is why I want to talk about the tomatoes.

  To the cousins and kids in the room: You've seen him out there. He can't run a marathon, but he can nurse a dying vine back to health better than anyone I know. He treats those plants with a patience that he also treats us with. Cicero argues that a bitter old age is usually just the result of a bitter personality showing itself—not the fault of age. But a generous old age? That's a choice.

  Every summer, when those tomatoes come in, it's proof that you don't need to drive a car to have purpose. You just need to care for something outside yourself.

  And for the colleagues and students here who know the texts: You know the line about the "counsel and wisdom" of the old replacing the "strength and speed" of the young. Grandpa, you've spent 35 years proving that the mind doesn't retire just because the knees do. You've shown us that while the body might withdraw from the world, the intellect doesn't have to. You are still teaching us, not because you're standing at a blackboard, but because you show us how to accept the "winter" of life without freezing.

  Cicero ends his book by saying that nature has appointed a finish line, but it's like a harbor, not a cliff. It's a place to rest, not a place to fear.

  So, I'm not going to say "85 is the new 60." That's a lie, and you hate lies. 85 is 85. It comes with bad knees and slower walks. But it also comes with a harvest that the younger of us haven't earned yet.

  Thank you for showing us that the "golden years" aren't about staying young. They're about growing old well.

  Please raise your glasses.

  To Grandpa. *Ad multos annos.* To many more years.
