prompt: |-
  Had a whole argument with my friend Priya last night about Cicero's On Old Age (De Senectute). Her take: the whole thing is just a rich, still-powerful old guy (Cato) telling other rich guys not to worry -- easy to say old age isn't so bad when youre still arguing cases in court, still running your own farm, and everyone in Rome wants your opinion. I pushed back that some of his actual points don't depend on any of that, like the bit where a bitter old age is really just a bitter personality finally showing itself, not something age causes on its own. Never resolved it.

  Now for my actual problem: my grandpa turns 85 next week and I'm giving the toast. He taught Latin for 35 years, so his old colleagues and former students in the room will catch a Cicero reference right away, but my cousins and his great-grandkids won't have a clue who that even is. He's got bad knees and can't drive anymore, but he's sharp as ever and babies his tomato plants every summer like they're prize vines.

  Can you write the toast? Use Cicero's actual arguments, not "80 is the new 60" fluff, in a way that'd basically win my argument with Priya -- so nothing that only works if you're lucky and well off, and nothing that pretends his decline isn't real.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Context:** The user had an argument with a friend (Priya) about Cicero's *De Senectute* (On Old Age). Priya thinks it's elitist/out of touch (Cato is rich/powerful). The user thinks some points are universal (character determines experience of aging, not just circumstances).
      *   **Task:** Write a toast for the user's grandfather's 85th birthday.
      *   **Audience:** Mixed. Latin-teaching colleagues/students (will get Cicero refs) vs. cousins/great-grandkids (won't).
      *   **Grandpa's Situation:** 85, bad knees, can't drive, but mentally sharp, loves gardening (tomatoes).
      *   **Tone/Content Requirements:**
          *   Use Cicero's *actual* arguments.
          *   Avoid "80 is the new 60" toxic positivity.
          *   Acknowledge real decline (knees, driving) without sugarcoating.
          *   Address Priya's critique implicitly (make it about character/virtue, not wealth/power).
          *   Win the argument: Show that Cicero's wisdom applies even when you *aren't* running the state.

  2.  **Deconstruct Cicero's *De Senectute*:**
      *   *Cato's Voice:* The dialogue is spoken by Cato the Elder, but written by Cicero.
      *   *Key Arguments:*
          1.  **Withdrawal from Action:** Old age withdraws us from active duties (politics/war). *Counter:* It withdraws us from *physical* exertion, not mental.
          2.  **Physical Strength:** Body weakens. *Counter:* Strength isn't everything; wisdom and counsel matter more.
          3.  **Deprivation of Pleasures:** Can't eat/drink/party like before. *Counter:* Good riddance! These are vices. Freedom from passion is a gift.
          4.  **Fear of Death:** Death is near. *Counter:* Death is natural. A ripe fruit falls. If the soul is immortal, great. If not, no sensation.
          5.  **Character:** "Old age is only bitter if your character is bitter." (This is the user's specific point against Priya).
      *   *Relevance to Grandpa:* He can't drive (loss of action/strength), but he gardens (cultivation) and teaches/taught (mind).

  3.  **Address the Priya Critique (The "Elitism" Problem):**
      *   Priya says Cato's advice only works for the powerful.
      *   *Solution:* Frame the toast around *internal* virtues (curiosity, care, patience) rather than *external* status (court cases, farms).
      *   Grandpa's "farm" is a tomato patch. His "court cases" are lesson plans or conversations. This democratizes Cicero. It shows the philosophy holds up even without political power.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone. Acknowledge the milestone (85).
      *   **The Hook (Cicero):** Introduce the Latin connection gently. Don't alienate the non-Latin speakers. Explain *why* Cicero matters here.
      *   **Addressing the Decline (The "Realism" Clause):** Acknowledge the knees and the keys. Don't say "you're young at heart." Say "things are harder, but that's okay." This aligns with Cicero's admission of physical decay.
      *   **The Core Argument (Character vs. Circumstance):** This is the pivot to win the argument with Priya. Focus on how Grandpa handles the decline. Use the "bitter personality" point.
      *   **The Garden Metaphor:** Connect Cato's farm to Grandpa's tomatoes. Cato talked about agriculture as the best pursuit for old age. Grandpa does this literally, but humbly.
      *   **The Mind/Legacy:** Connect teaching to Cicero's idea of "counsel and wisdom" replacing physical strength.
      *   **Closing:** A wish for the future (not fearing death, but enjoying the "ripe" phase). Raise a glass.

  5.  **Refining the Tone:**
      *   *Avoid:* Preachy, academic, overly sentimental.
      *   *Include:* Warmth, specific details (tomatoes, keys), Latin phrase (for the colleagues), translation (for the family).
      *   *Check:* Does this sound like a grandchild speaking? Yes, keep it personal.

  6.  **Self-Correction/Iterative thought during drafting:**
      *   *Initial thought:* Quote a long Latin passage.
      *   *Correction:* No, keep it accessible. Just one phrase like *Senectus* or *Natura*. Let's use *Natura* (Nature) or the idea of "ripening."
      *   *Critique Check:* Am I making him sound too powerful? No, emphasize the tomatoes, not an estate.
      *   *Priya Check:* Am I acknowledging that this is hard? Yes, mention the knees and the driving. The point is attitude, not privilege.

  7.  **Final Polish:**
      *   Ensure the transition from Cicero to Grandpa is smooth.
      *   Make sure the "win" against Priya is subtle but clear: It's about *how* you live, not *what* you own.
      *   Add stage directions (pause, raise glass).

  8.  **Final Review against constraints:**
      *   Cicero's actual arguments? Yes (withdrawal from physical, character, nature/ripening).
      *   No "80 is new 60"? Yes (acknowledge limitations).
      *   Mixed audience? Yes (explain Latin concepts).
      *   Grandpa's specifics? Yes (Latin teacher, knees, tomatoes).

  *(Self-Correction during final review)*: Make sure I don't sound like I'm settling a debate with Priya *in* the toast. The toast is for Grandpa. The *content* should reflect the winning argument, not the argument itself. The user wants the toast to *be* the proof, not a lecture about the proof.

