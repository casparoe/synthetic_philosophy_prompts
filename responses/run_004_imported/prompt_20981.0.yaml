  Here is a money-pump scenario constructed for an agent with incomplete preferences, followed by an analysis of whether McClennen's "resolute choice" offers the same escape hatch as it does in the cyclic case.

  ### The Scenario: The "Drift" Pump

  To construct a money pump without cyclic preferences, we rely on **incompleteness** (a partial order) rather than **intransitivity**. The vulnerability here does not stem from the agent preferring $A$ to $B$, $B$ to $C$, and $C$ to $A$. Instead, it stems from the agent treating incomparability as **permission to swap**.

  **1. The Preference Structure**
  Let the agent's preferences over three outcomes $\{A, B, C\}$ be defined as follows:
  *   **$A \succ C$**: The agent strictly prefers $A$ to $C$.
  *   **$A \parallel B$**: The agent finds $A$ and $B$ incomparable (neither is preferred).
  *   **$B \parallel C$**: The agent finds $B$ and $C$ incomparable.

  This structure contains no cycles. It is a valid partial order (transitive where defined). Note that this violates *negative transitivity* (if $A \succ C$, then for any $B$, either $A \succ B$ or $B \succ C$ must hold), which is the hallmark of incomplete preferences.

  **2. The Choice Rule (The Vulnerability)**
  For the pump to work, we must assume a specific choice rule for how the agent handles incompleteness. We assume the agent follows a **Permissive Uncovered Rule**:
  *   If $X \succ Y$, choose $X$.
  *   If $X \parallel Y$, the agent considers both options "undominated" and is willing to accept a trade from $X$ to $Y$ (perhaps viewing them as "on a par" or simply lacking a reason to refuse).

  **3. The Sequence of Trades**
  The agent starts with endowment $A$. A bookie offers the following sequence of trades, each costing a small fee $\epsilon$ (e.g., $\$1$).

  *   **Time $t_1$:** The agent holds $A$.
      *   **Offer:** Trade $A$ for $B$, minus $\$1$. (Net outcome: $B - \$1$).
      *   **Decision:** The agent compares $A$ vs. $B - \$1$. Since $A \parallel B$, and $\$1$ is negligible, the agent treats them as effectively incomparable or "no strict loss." Under the Permissive Rule, the agent **accepts**.
      *   **Current State:** Agent holds $B$, has paid $\$1$.

  *   **Time $t_2$:** The agent holds $B$.
      *   **Offer:** Trade $B$ for $C$, minus $\$1$. (Net outcome: $C - \$2$).
      *   **Decision:** The agent compares $B$ vs. $C - \$1$. Since $B \parallel C$, the agent again sees no strict reason to refuse. Under the Permissive Rule, the agent **accepts**.
      *   **Current State:** Agent holds $C$, has paid $\$2$.

  *   **Time $t_3$:** The sequence ends.
      *   **Final Outcome:** The agent holds $C - \$2$.
      *   **Original Outcome:** The agent started with $A$.

  **4. The Pump Result**
  We established ex-ante that **$A \succ C$**. It follows by monotonicity that **$A \succ C - \$2$**.
  The agent began with $A$ and ended with a outcome strictly worse than $A$, having paid $\$2$ for the privilege. They have been money-pumped, despite having no cyclic preferences.

  ***

  ### Does Resolute Choice Save the Agent?

  **The Short Answer:**
  Yes, resolute choice technically saves the agent, but the **mechanism and justification differ significantly** from the cyclic case. The lack of a cycle makes the move *psychologically easier* to execute but *conceptually harder* to motivate.

  **1. How Resolute Choice Works Here**
  In McClennen's framework, a resolute agent chooses a complete **plan** at $t_1$ and adheres to it at subsequent nodes, overriding local evaluations if necessary.
  *   **At $t_1$:** The resolute agent compares the terminal nodes of the available plans.
      *   *Plan 1 (Refuse):* End up with $A$.
      *   *Plan 2 (Accept both):* End up with $C - \$2$.
  *   **Comparison:** Since $A \succ C - \$2$, the resolute agent ranks Plan 1 strictly higher than Plan 2.
  *   **Execution:** The agent commits to Plan 1. At $t_1$, they refuse the trade. At $t_2$ (if they had accepted the first), they would refuse the second. The pump is defused.

  **2. Comparison with the Cyclic Case**
  In the standard cyclic money pump ($A \succ B \succ C \succ A$), resolute choice is a tool of **conflict resolution**.
  *   **The Conflict:** At $t_1$, the agent *strictly prefers* $B$ to $A$. Their local desire pulls them into the trap. Resolute choice requires the agent to bind their future self against its own strict preferences. It is an act of will against desire.
  *   **The Incomplete Case:** At $t_1$, the agent does *not* strictly prefer $B$ to $A$ ($A \parallel B$). There is no local desire pulling them into the trap; there is only **under-determination**.
  *   **The Difference:** In the cyclic case, resolute choice overrides a *signal* ("I want B"). In the incomplete case, it imposes a signal where there is *silence* ("I don't care, but I will choose A").

  **3. Is the Move "Harder to Run"?**
  The lack of a cycle makes the resolute choice move **harder to motivate**, even if it is easier to execute.

  *   **Easier Execution:** Because the agent is locally indifferent/incomparable between $A$ and $B$, refusing the trade requires no willpower. They are not fighting a local preference. In this sense, it is easier than the cyclic case.
  *   **Harder Motivation:** Resolute choice is typically justified as a solution to **dynamic inconsistency** (where the $t_1$ self and $t_2$ self disagree). In this incomplete preference scenario, there is no dynamic inconsistency. The $t_1$ self and $t_2$ self agree locally ($A \parallel B$ and $B \parallel C$). The problem is not that the agent changes their mind; it is that they lack a mind to change *locally*.
  *   **The Sophistication Alternative:** In the cyclic case, a merely "sophisticated" agent (who forecasts the future but doesn't commit) may still get pumped depending on the specific model of separability. In this incomplete case, a **sophisticated** agent (who simply looks ahead to the final node) is automatically saved *without* needing McClennen's strong notion of resolute choice. Since $A \succ C - \$2$, a sophisticated agent simply refuses at $t_1$ because they foresee the end result. They don't need to "bind" themselves; they just need to calculate.

  **Conclusion for your Seminar:**
  The resolute choice escape works, but it is **overkill** in the incomplete case. In the cyclic case, resolute choice is necessary to overcome a local preference that contradicts the global interest. In the incomplete case, the local preference is silent, so the global interest ($A \succ C$) can dominate without needing a special "resolute" commitment mechanism—mere foresight (sophistication) suffices.

  Therefore, the lack of a cycle makes the resolute choice move **conceptually harder to run** because the *problem* it solves (dynamic inconsistency/conflict) isn't actually present. The agent doesn't need to be resolute; they just need to be **non-permissive**. A simpler fix is to adopt a **Status Quo Bias** policy (never swap when $X \parallel Y$) rather than a full resolute choice architecture.
