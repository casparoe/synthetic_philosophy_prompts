  **MEMORANDUM**

  **TO:** League Team Captains and Membership
  **FROM:** Disciplinary Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Disciplinary Ruling Regarding Incidents on October 21st

  **1. FINDINGS OF FACT**
  The Committee has reviewed the video footage and consulted with the officiating crew regarding two separate incidents involving checking from behind into the boards during last weekend's games.

  *   **Incident A (Player: Jake):** Illegal check from behind. Opposing player remained in the game.
  *   **Incident B (Player: Tyler):** Illegal check from behind. Opposing player suffered a broken collarbone, ending their season.

  The Committee agrees with the referees and video review that the **mechanics, force, and intent of the two hits were substantially identical.** Both players chose to deliver a check from behind in a vulnerable position. Neither player intended to injure, but both players chose an action known to be high-risk.

  **2. INTERPRETATION OF LEAGUE RULES**
  Our league rules state that suspensions must *"factor in the severity of the outcome."* This has led to a debate within the Committee regarding how much weight "outcome" should carry when the "action" is identical.

  We recognize two valid perspectives:
  1.  **The Action Argument:** Players can only control their own actions, not how an opponent falls. Punishing based on injury punishes bad luck rather than bad behavior.
  2.  **The Outcome Argument:** The impact of a violation on the league matters. A season-ending injury affects the integrity of the competition, the victim's enjoyment of the league, and the overall safety culture more than a hit where everyone walks away.

  **3. COMMITTEE REASONING**
  After deliberation, the Committee has decided to apply a **Hybrid Model** for this ruling. We believe this best serves the league's long-term safety and fairness.

  *   **Why the Base Suspension Must Be High (Addressing the "Action" Side):**
      We cannot discipline based *solely* on injury. If we do, players learn that dangerous hits are acceptable as long as no one gets hurt. This encourages "testing the limits" of dangerous play. Therefore, the baseline suspension for a hit from behind must be significant, regardless of whether the opponent gets up or stays down. Jake cannot receive a "slap on the wrist" simply because his victim was lucky.

  *   **Why the Outcome Must Increase Severity (Addressing the "Consequences" Side):**
      We also cannot ignore the reality of the damage caused. Our league is built on mutual trust that we are here to play hockey, not to send each other to the hospital. When a rule violation results in severe injury, it breaches that trust more deeply than a violation that does not. The "severity of outcome" clause exists to acknowledge that the *harm done to the league community* is greater when a player is removed for the season. Therefore, while the *guilt* is similar, the *restitution* required from Tyler must be higher to reflect the actual damage incurred.

  **4. RULING AND SUSPENSIONS**
  To balance these factors, the Committee issues the following suspensions:

  *   **Jake:** **3-Game Suspension.**
      *   *Rationale:* Reflects the severity of the dangerous act itself.
  *   **Tyler:** **5-Game Suspension.**
      *   *Rationale:* Reflects the severity of the dangerous act (3 games) PLUS an additional 2 games to account for the severe outcome and season-ending injury to the opponent.

  **5. IMPLEMENTATION TIMELINE**
  *   **Effective Date:** Both suspensions are effective immediately.
  *   **Return Date:** Both players are eligible to return for their team's next scheduled game following the completion of their respective suspension games.
  *   **Deadline:** Captains must confirm receipt of this ruling by **Thursday at 5:00 PM**. If either player contests this, they must submit a written appeal to the Committee by that time. Otherwise, they are to sit out starting this weekend.

  **6. CLOSING STATEMENT**
  We understand this compromise may not fully satisfy either side of the debate. However, our goal is to set a precedent that discourages dangerous hits *before* they happen (by punishing Jake significantly) while acknowledging the reality of harm *after* it happens (by punishing Tyler additionally).

  We want all our players to finish the season healthy. Please remind your teams that checking from behind is not worth the risk, regardless of how the other player lands.

  **Signed,**

  The Disciplinary Committee
  [Your Name/League Name]
