  Here's a thinking process that leads to the suggested recommendation:

  1.  **Analyze the Request:**
      *   **Context:** Adult rec hockey league disciplinary committee (unofficial, team captains).
      *   **Incident:** Two identical hits from behind into the boards (Jake and Tyler).
      *   **Outcome:** Jake's victim finished the game; Tyler's victim broke a collarbone (season-ending).
      *   **Rulebook:** Says suspensions should "factor in the severity of the outcome," but doesn't specify weight.
      *   **Conflict:** Half the committee wants Tyler suspended much longer due to injury (outcome-based). The user (and others) think it's unfair since the *act* was identical (intent/action-based).
      *   **Task:** Draft the committee's actual recommendation (suspension lengths, deadlines) *and* engage seriously with the "consequences should matter" argument (to mitigate pushback).
      *   **Tone:** Professional, fair, decisive, but empathetic to both sides of the committee argument. Needs to sound like an official ruling from a volunteer group.

  2.  **Determine the Philosophy/Precedent:**
      *   *Pure Action-Based:* Both get the same suspension (e.g., 3 games). Pros: Consistent, punishes the dangerous act. Cons: Ignores the real-world harm caused, feels disconnected from the victim's suffering.
      *   *Pure Outcome-Based:* Jake gets 1 game, Tyler gets 10 games. Pros: Acknowledges harm. Cons: Punishes luck/biology, creates perverse incentives (don't hit hard if you don't want a long suspension, even if the hit is dirty).
      *   *Hybrid Approach (Recommended):* Acknowledge the act is the primary basis for discipline, but allow the outcome to adjust the severity within a reasonable range. This aligns with most real-world sports leagues (NHL, IIHF, etc., though they vary) and legal systems (negligence vs. damages).
      *   *Decision:* The hits were "dirty" (from behind into boards). This is a safety priority. Base suspension should be significant for *both*. The injury warrants an increase for Tyler, but not a massive disparity that suggests the *hit* was different.
      *   *Proposed Suspension:*
          *   Jake (No Injury): 3 Games.
          *   Tyler (Injury): 5 Games.
          *   *Rationale:* Both punished heavily for the dangerous act. Tyler punished more for the consequence, but not 10x more.

  3.  **Drafting the Content - Section by Section:**

      *   **Header:** Official looking (League Name, Committee, Date, Subject).
      *   **Introduction:** State the purpose (ruling on incidents from [Date]).
      *   **Findings of Fact:** Acknowledge the video/ref consensus. The *actions* were identical. This validates the user's side.
      *   **Addressing the Rulebook:** Quote the "factor in severity of outcome" clause. This validates the other side.
      *   **The Core Argument (Engaging the "Consequences Matter" Side):** This is crucial. I need to explain *why* outcome matters without admitting that luck determines guilt.
          *   *Argument:* Discipline serves two purposes: Punishment/Deterrence (focused on the actor) and Restitution/Safety (focused on the league environment).
          *   *Argument:* An injury changes the impact on the league. It removes a player, creates medical costs (maybe), and lowers trust in safety.
          *   *Argument:* However, we cannot punish *only* luck. The base penalty must reflect the danger of the act itself.
      *   **The Ruling:** Specific game counts.
      *   **Timeline:** When does it start? (Immediately/Next scheduled game).
      *   **Closing:** Reiterate commitment to safety.

  4.  **Refining the Tone:**
      *   Avoid legalese that sounds too stiff (it's a rec league).
      *   Avoid being too casual (it's a disciplinary hearing).
      *   Ensure the "Compromise" feels like a principled decision, not just splitting the difference.
