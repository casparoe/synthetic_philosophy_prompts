      *   **The Mechanism:** The "Domain Restriction" or "Context Set" approach.
          *   Indicatives: Restrict the domain to *epistemically possible* worlds (worlds compatible with what we know).
          *   Counterfactuals: Restrict the domain to *metaphysically possible* worlds that are *similar* to the actual world, often presupposing the antecedent is false in the actual world.

  3.  **Formulate the Argument for the Unified View:**
      *   *Core Thesis:* The difference isn't in the *connective* (the "if...then"), but in the *conversational context* that determines which worlds are relevant for the evaluation.
