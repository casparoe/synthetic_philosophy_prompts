      *   **Overall Tone:** Respectful, philosophically rigorous, supportive but not prescriptive. Avoid giving medical advice. Focus on the ethical reasoning.

  4.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Boorse:* Make sure to distinguish between Boorse (health) and Daniels (justice). Daniels cares about opportunity. If shortness impedes opportunity, Daniels might support intervention even without pathology. The user's critique is that the *threshold* is arbitrary. I should agree but note that Daniels accepts some arbitrariness for the sake of fairness.
      *   *Self-Correction on Sandel:* Don't let the user off too easy. Sandel would say the *intent* matters. Is the intent to fix a problem or to optimize? But the user's point about "choice" remains valid.
