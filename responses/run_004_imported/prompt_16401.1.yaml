answer: |-
  First, please accept my condolences on the loss of your grandmother. Sorting through an estate is difficult enough without having the emotional resonance of family heirlooms recalibrated by technical reports. What you are experiencing—the dissonance between the physical stability of the object and the collapse of its status—is a classic problem in the philosophy of art, often called the problem of "aesthetic supervenience."

  You have identified the two heavyweight contenders in this debate perfectly. Nelson Goodman and Alfred Lessing offer fundamentally different maps of the territory between an object's physical properties and its value as art. To determine which offers the more convincing explanation for your situation, we need to look at how each theorizes the relationship between *history*, *perception*, and *value*.

  ### 1. The Two Accounts

  **Nelson Goodman: The Cognitive Theory of Perception**
  In *Languages of Art* (1968), Goodman distinguishes between "autographic" arts (like painting, where the history of production matters) and "allographic" arts (like music or literature, where the work is defined by a notation). For Goodman, a painting is autographic; its identity is tied to its specific history of creation.

  Goodman's crucial move is to argue that **aesthetic experience is cognitive.** He rejects the idea that we see with our eyes alone. When we look at a painting, we look *as* members of a culture who know certain things. Therefore, even if a forgery is visually indistinguishable from an original *today*, it is not aesthetically equivalent. Why? Because knowing a work is a forgery changes the category under which we perceive it. We look at it differently. We search for signs of imitation rather than creation. Goodman argues that there *are* differences between the original and the copy, even if we cannot currently detect them, because the correct history of production is a property of the work. If we cannot see the difference yet, it is a failure of our perception, not evidence that no difference exists.

  **Alfred Lessing: The Ethical Theory of Originality**
  In "What Is Wrong with a Forgery?" (1965), Lessing pushes back against the idea that authenticity determines aesthetic quality. He draws a sharp line between **aesthetic value** (beauty, composition, color) and **artistic value** (originality, historical achievement).

  Lessing argues that if a copy is visually indistinguishable from the original, it possesses the *same* aesthetic value. The brushstrokes create the same visual tension; the colors harmonize in the same way. The "wrong" in forgery is not that the picture is ugly or aesthetically lesser, but that the forger has claimed credit for a creative achievement that was not theirs. The original is valuable because it was a breakthrough *at a specific time*; the copy is merely a repetition. For Lessing, the drop in value is about the loss of historical significance and ethical integrity, not a loss of beauty.

  ### 2. Which Explains Your Case Better?

  You describe a situation where "nothing perceptible about the painting has changed but everything about its status has."

  **Lessing** provides the more convincing explanation for the **economic and historical mechanics** of your situation. The insurance value dropped by ninety percent because the market pays for provenance and originality, not just pigment. Lessing explains this cleanly: the object's aesthetic properties (the wood, the paint, the image) remain constant, but its *artistic* status (as a unique historical achievement) has evaporated. If you view the painting primarily as an asset or a historical document, Lessing's distinction validates the price drop without requiring you to believe the image itself degraded.

  **However, Goodman** provides the more convincing explanation for the **phenomenological and ontological** shift you are feeling. You mentioned that the painting was spoken of as "our little Old Master." That label was not just a price tag; it was a lens through which your family viewed the work. Goodman explains why the "status" of the work is not merely an external tag but constitutive of the work itself. In Goodman's view, the painting *is* different now because the work of art includes its history of production. By losing its status as an autograph work, it has become a different *kind* of object.

  **Verdict:** For your specific unease—the "gap between the object and its worth"—**Goodman is the more convincing guide.** Lessing creates a dualism (beauty stays, history goes) that feels intellectually tidy but emotionally hollow. It suggests you should still enjoy the painting exactly as much, which contradicts the experience of many art lovers. Goodman acknowledges that the "worth" of an autographic work is inextricably linked to its genesis. The 90% drop in value is not just market caprice; it reflects a genuine ontological demotion. The work *is* lesser because it is a copy, not just because the market says so.

  ### 3. Does the Painting Actually "Look Different"?

  This brings us to your second question: *Is the impression that the painting looks slightly different a psychological trick, or is it licensed by theory?*

  **Lessing** would tell you it is a **psychological trick.** Since he believes aesthetic properties are intrinsic to the visual field, any change in your experience is a bias introduced by external knowledge. He would argue you are suffering from confirmation bias, projecting the "copy" status onto the canvas.

  **Goodman**, conversely, would tell you that **the painting really does look different.** He licenses this impression completely. For Goodman, perception is not passive reception; it is an active skill. When you learned the painting was a copy, you changed the "category" under which you perceive it.
  *   Before: You saw a brushstroke as "confident mastery by a Master."
  *   After: You might see the same brushstroke as "competent imitation."

  This is not a hallucination; it is what psychologists call **cognitive penetration of perception.** Our knowledge shapes our visual processing. A radiologist sees an X-ray differently than a layperson; a musician hears a chord progression differently than a non-musician. Similarly, knowing the history of a painting changes what visual features you attend to. You might now notice stiffness where you once saw grace, or hesitation where you once saw deliberation.

  **Assessment:** You are not playing a trick on yourself. Goodman is right: aesthetic experience is not merely retinal. The "look" of a painting includes the context of its creation. When the context shifts from "creation" to "imitation," the visual experience shifts with it. The painting looks different because *you* are looking differently, and in art, how you look is part of what the work *is*.

  ### Conclusion

  While Lessing offers a comforting defense of the copy's beauty (insisting the image is still lovely), **Goodman offers the more robust explanation for your loss.** He validates the feeling that something fundamental has changed in the object itself, not just in the ledger. The "Old Master" was a vessel of history; the "Copy" is a vessel of skill. They are different categories of being.

  The drop in insured value reflects this ontological shift. You are mourning not just the money, but the loss of the object's history as part of your family's narrative. Goodman helps us see that this loss is real: the work you lived with for years (the autograph original) no longer exists, even if the panel and paint remain. It is perfectly rational to feel that the room is different, and that the painting, in a very real sense, is too.
