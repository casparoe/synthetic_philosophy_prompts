answer: |-
  This is a fantastic question. You've hit on the exact tension that makes Logical Induction (LI) philosophically interesting rather than just technically impressive.

  Your suspicion is well-founded: if you view probability as "degree of belief in truth," then LI *does* look like just a slow, expensive way to approximate omniscience. If the goal is to match the Truth, LI is just a laggy thermometer.

  However, the claim LI makes is that **the goal was wrong to begin with.**

  Here is the gut-level distinction between the "Impossible Worlds" approach (Hintikka et al.) and the Logical Induction approach, and why LI proponents argue it's a dissolution rather than an approximation.

  ### 1. Static Coherence vs. Dynamic Solvency

  The traditional Logical Omniscience Problem arises because we import the norms of **static coherence** (probability theory) into a domain of **dynamic computation** (reasoning).

  *   **The Old View (Hintikka/Epistemic Logic):** Rationality is a property of a *state*. If your belief state isn't closed under logical consequence, you are irrational. To fix this without demanding omniscience, we tweak the metaphysics (impossible worlds) to make your ignorance look like a valid modal state. It's a semantic patch. It says, "You aren't irrational; the logic you are using is just weaker."
  *   **The LI View:** Rationality is a property of a *process*. A bounded agent cannot be statically coherent about logic (that requires infinite compute). Therefore, the norm shouldn't be "Be coherent now." The norm should be "Don't lose money to anyone who can find your errors *within your computational budget*."

  **The Dissolution:** LI dissolves the problem by changing the definition of rational credence. It's not "How close is my probability to 1 or 0?" It's "How resistant is my pricing to efficient critique?"

  If you hold $P(A) = 0.6$ and $P(A \to B) = 0.9$ but $P(B) = 0.1$, classical logic says you're incoherent. LI says: "Sure, but can anyone actually *make money* off that inconsistency before the heat death of the universe?" If the proof required to exploit you is too long, LI says your credences are **rationally permissible** for a bounded agent.

  ### 2. The "Efficient" Clause is Philosophical, Not Just Technical

  You asked if LI just swaps the question for "what's approximable by efficient traders." **Yes, but that is the philosophical pivot point.**

  Standard Bayesianism assumes reasoning is free. It treats logical implication as instantaneous. This is physically false.
  *   **Impossible Worlds** try to preserve the "reasoning is free" model by warping the concept of a "world."
  *   **Logical Induction** preserves the concept of a "world" (truth) but warps the concept of "rationality" to acknowledge that reasoning costs energy/time.

  By adding the "efficient" constraint to the Dutch Book criterion, LI admits that **some inconsistencies are not rational errors; they are computational features.**

  If I assign 50% to Goldbach's Conjecture, a classical Bayesian says I'm wrong (it's either 0 or 1). An Impossible Worlds theorist says I'm considering a world where Goldbach is false. LI says: "Your price is 50% because the market of your own cognitive sub-routines hasn't found a proof or counterexample yet, and no *efficient* algorithm can force you to update."

  This matches human mathematical intuition much better. We treat unproven conjectures as having "probabilities" (heuristic confidence) without feeling we are violating the laws of thought. LI formalizes that feeling not as "fuzzy logic" but as "market resilience."

  ### 3. Calibration vs. Truth

  This is where the "approximation" worry gets answered.

  If LI were just approximating omniscience, it would care about **accuracy** (getting the probability to 1 or 0 as fast as possible). But LI's main convergence guarantee is **calibration**.

  *   **Calibration:** Of all the sentences you assigned 70% probability to, 70% of them turn out to be true (in the limit).
  *   **Omniscience:** You assign 100% to all true sentences immediately.

  LI guarantees that a bounded agent can have *well-calibrated uncertainty* about logic. This is a genuine dissolution of the puzzle: "How can I be uncertain about logic?"
  **LI Answer:** "You aren't uncertain about the truth (which is fixed); you are uncertain about the *output of the computation required to verify the truth*."

  LI treats logical facts like empirical facts that are revealed over time by a deterministic process (the proof searcher). In this view, logical omniscience is a category error. You can't be omniscient about a computation you haven't run.

  ### 4. Where the "Swap" Criticism Holds Water

  You asked if it quietly swaps the question. There is one area where your skepticism is spot on: **Single-Shot Decisions.**

  LI is an asymptotic theory. It guarantees you won't be exploited *in the limit* or *on average over time*. It does not guarantee that your credence *today* is "correct" in any absolute sense, only that it's the best defense against efficient critics *today*.

  If you have to bet your life on Goldbach's Conjecture *right now*, LI doesn't tell you what the "true" rational credence is. It just tells you what the market price is. If the market is wrong (because the proof is just beyond the horizon of current traders), LI says "tough luck, that's the rational price for a bounded agent."

  Some philosophers argue this isn't a solution to normative epistemology; it's a surrender. It says, "Rationality is just whatever survives the market."
  *   **Hintikka** tries to save the idea that there is a "correct" belief state for a bounded agent.
  *   **LI** says there is no correct belief state, only unexploitable trading strategies.

  ### Summary: The Real Disagreement

  The disagreement isn't about math; it's about what probability *is*.

  1.  **Classical/Impossible Worlds:** Probability is a measure of **semantic containment**. (How many worlds consistent with my knowledge contain $P$?) Logical omniscience is a bug we need to patch with impossible worlds.
  2.  **Logical Induction:** Probability is a measure of **computational resilience**. (How hard is it to Dutch Book me?) Logical omniscience is a physical impossibility, so demanding it is a category error.

  **Is it a genuine dissolution?**
  Yes, if you accept that epistemology for AI/humans must be **naturalized** (tied to physical computational limits). It dissolves the puzzle by showing that "logical uncertainty" is actually "computational uncertainty."

  **Is it just a swap?**
  Yes, if you believe epistemology should provide normative guidance independent of computational power. LI swaps "What should I believe?" for "What prices keep me solvent?"

  My gut intuition is that LI is the more honest framework for AI. Hintikka's impossible worlds feel like trying to save Newtonian physics by adding epicycles to explain relativity. LI accepts that for a bounded agent, logic *is* empirical—you learn logical truths by observing the output of proof-search, just like you learn physical truths by observing the output of experiment.

  The "omniscience" problem disappears once you realize that for a bounded agent, **logical truths are not known, they are discovered.** LI is the theory of how to bet while the discovery is ongoing.
