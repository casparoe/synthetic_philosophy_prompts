  As I currently understand it, a signal counts as a strict Zahavian handicap only if its cost falls disproportionately on lower-quality signalers, so that cheating does not pay. That differs from three other mechanisms I keep running into: an index signal, whose reliability comes from being physically impossible to fake regardless of cost; a Fisherian runaway trait, which can spread through mate preference alone without tracking any real underlying quality; and what I've been calling a commitment signal, whose cost mainly demonstrates loyalty or cooperative intent to a group rather than revealing a stable personal quality.

  Using that four-way distinction (or your own revised version of it, if you think it's missing something), please sort the following into whichever category fits best, with a sentence of justification for each and a flag on any case you consider genuinely contested in the literature:

  1. The peacock's train
  2. Stotting by gazelles when a predator approaches
  3. The low pitch of a rutting red deer stag's roar (as distinct from how often he roars)
  4. Wearing a visibly expensive watch
  5. Strict fasting and tithing requirements in some religious communities
  6. Spending years and tuition money on an elite university degree before entering the job market

  Please close with the classification as a JSON object, for example:

