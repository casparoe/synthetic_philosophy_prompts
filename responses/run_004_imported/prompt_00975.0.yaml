  8.  *(Self-Correction on Matthias)*: Matthias's 2004 paper is specifically about autonomous agents and the "gap" where neither the user nor the manufacturer is responsible. The user is applying this to ML. This is a standard application of his thesis. I should acknowledge that the legal system has evolved *in response* to this philosophical problem, not necessarily solved it philosophically, but bypassed it pragmatically.

