answer: |-
  You have hit on one of the most common points of confusion in popular philosophy of religion, and honestly, your intuition is sharper than a lot of people who have read way more than you. You are absolutely right that William Lane Craig (WLC) tends to blend these together in debates, but you are also right to suspect that they are structurally very different.

  The short answer to your question is: **No, it isn't moving the goalposts.** It's because the "Leibnizian" (Contingency) argument was never about the *beginning* of the universe in the first place. It is about the *existence* of the universe, regardless of how long it has been around.

  Here is the breakdown of why physicists and philosophers are talking past each other, and why the argument survives even if the universe is eternal.

  ### 1. The Mix-Up: Two Different Arguments
  You mentioned that Kalam and Leibniz strike you as "two ways of dressing up the same basic move." This is the crux of the issue. In academic philosophy, they are considered distinct arguments with different premises.

  **The Kalam Cosmological Argument (The "Beginning" Argument)**
  *   **Focus:** Time and Events.
  *   **Logic:**
      1.  Whatever *begins* to exist has a cause.
      2.  The universe *began* to exist.
      3.  Therefore, the universe has a cause.
  *   **Vulnerability:** This argument lives or dies by Premise 2. If a physicist can show a model where the universe is past-eternal (no Big Bang singularity, just eternal inflation), this argument is in trouble. WLC spends a lot of time fighting physics to protect Premise 2.

  **The Leibnizian Cosmological Argument (The "Contingency" Argument)**
  *   **Focus:** Explanation and Dependence.
  *   **Logic:**
      1.  Everything that exists has an explanation for its existence (either in the necessity of its own nature or in an external cause).
      2.  The universe exists contingently (it could have failed to exist; it's not necessary).
      3.  Therefore, the universe has an explanation for its existence (which is God).
  *   **Vulnerability:** This argument **does not care** if the universe had a beginning.

  ### 2. The "Eternal Brick" Analogy
  To see why the physicist's "no boundary" objection doesn't kill the Leibnizian argument, imagine this scenario:

  Imagine you are walking through a forest and you find a brick. You ask, "Where did this brick come from?"
  *   **Kalam approach:** You look for the moment the brick was manufactured.
  *   **Leibniz approach:** You ask why there is a brick here at all rather than nothing.

  Now, imagine I tell you: "Actually, this brick has existed forever. It has no beginning. It was never manufactured."
  *   **Kalam:** "Oh, well then it didn't begin to exist, so it doesn't need a cause!" (Argument stops).
  *   **Leibniz:** "Okay, but even if the brick is eternal, **why is there a brick?** Why does it have mass? Why is it red? Why does it exist rather than not?"

  Just because something is eternal doesn't mean it is *self-explanatory*. If the universe has been inflating eternally, we still have to ask: **Why is there an inflating universe rather than nothing?** And **why does that universe have these specific laws of physics?**

  The Leibnizian argument claims that an eternal universe is still "contingent." It depends on something else to keep it in existence, moment to moment (or timeless moment to timeless moment), even if it never had a "start."

  ### 3. Why the Physicist's Objection Misses the Mark
  When a physicist like Sean Carroll or the late Stephen Hawking argues against the cosmological argument using the "no boundary proposal" or "eternal inflation," they are almost exclusively targeting the **Kalam**.

  They are saying: *"You assume a t=0 start point. Physics says there is no t=0. Therefore, no cause."*

  Philosophers of religion (even secular ones who disagree with the conclusion) don't think this refutes the **Leibnizian** argument because the Leibnizian argument isn't asking "What happened at t=0?" It is asking "Why is there a reality capable of having physics at all?"

  If the universe is eternal, the question just shifts from "What started it?" to "What sustains it?" or "What explains the brute facts of its existence?"

  ### 4. Is WLC Moving the Goalposts?
  This is where your skepticism is warranted. William Lane Craig is a specific case.
  *   **In Debates:** He focuses 90% on the Kalam because it is punchy, easy to understand, and fits well with the Big Bang narrative.
  *   **In Academic Papers:** He (and others) acknowledges the Leibnizian argument stands independently.

  When critics smash the Kalam with eternal inflation models, and then the philosopher says, "Well, the Cosmological Argument still works," it *feels* like moving the goalposts. But in the academic landscape, it's more like having two doors. The physicist locked Door #1 (Kalam/Beginning). The philosopher just walks over to Door #2 (Leibniz/Contingency), which was never locked.

  It is only "moving the goalposts" if they claim it's the *same* argument. If they admit, "Okay, the Kalam is challenged by that physics, but the Argument from Contingency remains," that is valid philosophical discourse.

  ### 5. One More Version: The Thomistic Argument
  Just to add to your rabbit hole fuel, there is a third version (from Thomas Aquinas) that also doesn't care about the beginning. It argues about **causal hierarchy** rather than **temporal chain**.

  Think of a hand moving a stick moving a stone.
  *   The stick moves the stone *now*.
  *   The hand moves the stick *now*.
  *   If the hand stops, the stick stops, and the stone stops.

  It doesn't matter if this chain has been going on for 5 seconds or a billion years. The stone is being moved *right now* by something else. Aquinas argues the universe is like the stone—it is being "actualized" right now. Even if the universe is eternal, it still needs a "Prime Mover" to sustain its existence in this very moment. Physics models about the past don't touch this, because this is about the *present* dependence.

  ### Summary
  You aren't crazy for thinking they look the same; in pop-apologetics, they are often blurred. But academically:

  1.  **Kalam** = Needs a beginning. (Vulnerable to "no boundary" physics).
  2.  **Leibniz/Contingency** = Needs an explanation. (Immune to "no boundary" physics, because an eternal universe still needs an explanation for why it exists).
  3.  **Thomistic** = Needs a sustainer. (Immune to "no boundary" physics, because it's about current dependence, not past history).

  So, when philosophers say the argument survives an eternal universe, they aren't changing the rules of the Kalam; they are pointing out that the Kalam was never the only game in town. The question shifts from "Who lit the fuse?" to "Why is there fuel at all?"
