      *   Class 3: Stage 2 Lung Cancer (Survival 40%).
      *   Class 4: Specific Genetic Marker Z (Survival 80%).
      *   Mr. Jones is a 68-year-old male with Stage 2 Lung Cancer and Marker Z.
      *   Problem: We might not have data for the intersection of all four. Do we prioritize the Genetic Marker (most causal?) or the Stage (most clinical?). Frequentism doesn't say.

  5.  **Addressing the Bayesian Objection specifically:**
