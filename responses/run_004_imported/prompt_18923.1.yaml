          *   If we have stats for "Smoking Athletes," use that. But what if the sample size is small? Unreliable.
          *   What if we add "Left-handed"? "Over 60"? The class narrows until it's just the patient (freq 0 or 1).
          *   Where do we stop? Reichenbach says "reliable statistics." But reliability is vague.
      *   **Section 4: The Bayesian Challenge (Hájek's Point).**
          *   User thinks Bayesians assign credence to propositions directly.
          *   Counter: Where do the numbers come from?
          *   *Likelihoods:* $P(\text{Data} | \text{Hypothesis})$. Often estimated from frequencies. Which reference class for the frequency?
          *   *Priors:* Objective Bayesians use symmetry/indifference. RCP lurks there (which symmetry?).
          *   *Calibration:* If your credence doesn't match long-run frequencies, you are vulnerable to Dutch Books or calibration arguments. Which long run?
      *   **Section 5: Conclusion.**
          *   Summarize. Colleague is right. It's a foundational gap, not just a bug in human psychology.

  4.  **Refining the Example (Medical/Weather):**
