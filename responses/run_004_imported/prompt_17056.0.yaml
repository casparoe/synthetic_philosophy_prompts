      *   *Decision:* I will argue that the dispute hinges on the **theory of counterfactuals**. Aumann assumes a "minimal change" to history that preserves dispositions. Critics assume "minimal change" to history that preserves the evidential link between action and disposition.
      *   *Final Verdict:* I will argue for the **Critics**. Why? Because game theory is supposed to model *deliberation*. Deliberation requires updating on new information (moves). A model that forbids updating on moves (Aumann's) fails to model deliberation. Thus, for the purpose of prescribing action (which is what the dinner argument was likely about), the Critics are right.

