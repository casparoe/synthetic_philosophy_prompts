      *   **Section 3: The Crux - Counterfactuals and Belief Revision:** This is where the settlement happens. We need to analyze *how* we evaluate counterfactuals.
          *   Aumann uses an S5 logic where knowledge is truthful and persistent.
          *   Critics argue for a belief revision policy (e.g., AGM or Bayesian).
          *   If we use **Stalnaker's semantics** for counterfactuals, we look for the "closest possible world" where the antecedent is true.
          *   *Key Question:* In the closest world where the off-path node is reached, is CKR still true?
