          *   *The Catch:* How do we evaluate rationality at nodes *not* reachable under the actual strategy? Aumann treats strategies as complete functions. If I know you are rational, I know your strategy function maximizes your payoff given your knowledge.
      *   **The Critique (Reny, Binmore, Stalnaker, etc.):**
          *   The "Paradox of Backward Induction."
