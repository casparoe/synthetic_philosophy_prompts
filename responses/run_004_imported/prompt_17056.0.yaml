      *   **Section 4: The Verdict:** I need to be decisive.
          *   Argument: Rationality is not just a label; it's a disposition to maximize. Observed behavior is the primary evidence of disposition. To ignore the evidence of a deviation to preserve a prior belief in rationality is *itself* irrational (dogmatic).
          *   Therefore, a truly rational agent must update beliefs upon seeing deviations.
          *   If beliefs update, CKR vanishes off-path.
