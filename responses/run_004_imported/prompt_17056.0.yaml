          *   But if we reach node $X$, Player 1 must have deviated earlier.
          *   If Player 1 deviated, CKR is false.
          *   If CKR is false, why should I believe Player 2 is rational at node $X$?
          *   If I don't believe Player 2 is rational at $X$, I might not play BI at the previous node.
          *   This is the problem of *belief revision* upon observing an unexpected move.

