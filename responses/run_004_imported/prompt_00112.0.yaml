      *   *Point 2 (Probability):* Collapse says $P(\text{survival}) \to 0$. MWI says Branches exist where survival = 1. But do those branches have "weight"? If the Born Rule applies, the *measure* of surviving branches drops exponentially. Why should "you" expect to be in the low-weight branch? This is the "incoherence problem" of probability in MWI.
      *   *Point 3 (Selection Bias):* Analogy: Surviving a firing squad. If 100 shooters miss, you might suspect they missed on purpose. But if it's quantum, MWI says one branch you live. But you can't use the fact that you are thinking to prove the theory. That's anthropic reasoning.
