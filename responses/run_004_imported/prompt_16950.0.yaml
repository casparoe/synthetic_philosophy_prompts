prompt: |-
  I'm a third-year cognitive science student in a seminar on philosophy of mind, where we recently worked through Clark and Chalmers's "The Extended Mind," the Otto-and-notebook case, and the standard replies to it: Adams and Aizawa's charge that the argument trades on a coupling-constitution fallacy, and Rupert's argument that biological memory and notebook-consultation aren't functionally alike enough to satisfy the parity principle even once it's granted in the abstract. A few of us have kept arguing about all this since Tuesday's class, which is partly why I'd like an outside opinion before I put anything in writing: I'm also the student member of my university's Examination Accommodations Appeals Board, and a case has come up on this week's agenda that reads as though it were lifted from the syllabus.

  A student with a documented memory impairment from a traumatic brain injury (confirmed by neuropsychological assessment on file with Disability Services) already receives extra time and a quiet room, but has now requested something more specific: permission to consult, during an otherwise closed-book exam, a set of handwritten notes she says are continuous with a running notebook she has relied on all year for ordinary coursework, precisely because her memory doesn't reliably retain material otherwise. Citing Clark and Chalmers by name, her submission argues that the notes satisfy the very features the two of them use to distinguish real extended memory from mere lookup: she wrote and reviewed every page herself, she consults notes like these constantly and without deliberation in every other academic context, and she takes what's written there on trust rather than checking it against anything else. Two board members are unmoved. One thinks that even granting all of this, functional similarity to memory can't be what settles the case, since coupling reliably with a resource isn't the same as that resource being part of one's memory in the sense an exam is entitled to care about — essentially Adams and Aizawa's worry that coupling is being mistaken for constitution. The other points out, more practically, that our accommodations policy only guarantees adjustments that don't "fundamentally alter what the assessment measures," and thinks the case turns on a question philosophy of mind alone can't answer: what this particular closed-book exam is actually supposed to measure.

  Could you draft the short memo I've been asked to prepare for Thursday's meeting? It should give the board a concrete recommendation — grant, deny, or grant subject to specific conditions and a review point — and it should take both the coupling-constitution worry and the "what does this exam measure" objection seriously on their own terms, rather than resolving the case by simply declaring the extended mind thesis true or false.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Third-year Cognitive Science student, member of University Examination Accommodations Appeals Board.
      *   **Context:** Seminar on Philosophy of Mind (Clark & Chalmers, "The Extended Mind," Otto case, Adams & Aizawa, Rupert). A real-world accommodation case mirrors the Otto case.
      *   **Case Details:** Student with TBI (documented memory impairment). Currently has extra time/quiet room. Requests permission to use handwritten notes during a *closed-book* exam. Claims notes are "extended memory" (Clark & Chalmers criteria: constant access, trust, automatic retrieval).
      *   **Board Objections:**
          1.  *Philosophical:* Coupling-Constitution Fallacy (Adams & Aizawa). Just because she uses the notes doesn't mean they *are* her memory.
          2.  *Practical/Policy:* Does this "fundamentally alter what the assessment measures"? (What is the exam testing?)
      *   **Task:** Draft a short memo for Thursday's meeting.
      *   **Requirements:** Concrete recommendation (Grant/Deny/Conditional), take both objections seriously *without* simply asserting the Extended Mind Thesis (EMT) is true/false.
      *   **Tone:** Professional, academic, balanced, actionable.

  2.  **Deconstruct the Objections & Formulate a Response:**

      *   *Objection 1: Coupling-Constitution (Adams & Aizawa).*
          *   *The Worry:* Using a tool $\neq$ Being the mind. If we allow the notes, are we allowing a crutch or a cognitive part?
          *   *Counter/nuance:* In accommodation contexts, the goal isn't ontological precision (is this *really* memory?) but functional equity (does this restore access?). However, we can't ignore the distinction entirely. If the exam tests *internal recall*, external aids change the construct. If the exam tests *reasoning/application*, external aids might just level the playing field.
          *   *Strategy:* Don't solve the metaphysics. Focus on the *functional role* of the notes for *this specific student*. For her, due to TBI, the notes *function* as memory in a way they wouldn't for a neurotypical student. The "constitution" question matters less than the "compensatory mechanism" question.

      *   *Objection 2: What does the exam measure? (Construct Validity).*
          *   *The Worry:* If the exam measures "recall of facts," notes ruin it. If it measures "synthesis/application," notes might be fine.
          *   *Strategy:* This is the pivot point. The recommendation must hinge on the *learning objectives* of the course/exam.
          *   *Action:* We need to verify if "unassisted recall" is an essential learning outcome.

  3.  **Determine the Recommendation:**
      *   *Outright Deny:* Ignores the disability impact and the philosophical argument that for *her*, this is memory. Risks discrimination.
      *   *Outright Grant:* Ignores the "what is being measured" concern. Might violate academic integrity if recall is the point.
      *   *Conditional Grant (with Review):* Best path. It acknowledges the need for accommodation while protecting the academic standard. It shifts the burden to the instructor to define the "construct" of the exam.
      *   *Specific Condition:* The notes must be vetted (to ensure they aren't just answers), and the instructor must confirm that unassisted recall isn't the primary learning outcome.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose (recommendation on Case #X). Acknowledge the complexity (intersection of policy, disability, and cognitive theory).
      *   **Analysis of Objection 1 (Coupling-Constitution):**
          *   Acknowledge Adams & Aizawa's point.
          *   Reframe for accommodations: We aren't deciding metaphysics; we are deciding *access*. For a TBI patient, the "coupling" is so tight it functions as constitution *for the purpose of access*.
          *   However, admit that policy distinguishes between "memory" and "aid."
      *   **Analysis of Objection 2 (Assessment Construct):**
          *   This is the stronger practical objection.
          *   Distinguish between testing *retention* vs. testing *competence*.
          *   If retention is key, notes change the measure. If competence is key, notes might be necessary for equity.
      *   **Recommendation:**
          *   **Grant, subject to conditions.**
          *   Condition 1: Instructor verification of learning outcomes (is recall essential?).
          *   Condition 2: Vetting of the notes (ensure they are personal knowledge structures, not answer keys).
          *   Condition 3: Post-exam review (did it work as intended?).
      *   **Conclusion:** Summarize the rationale (equity without compromising standards).

  5.  **Refining the Tone:**
      *   Avoid jargon overload (don't quote Clark & Chalmers extensively, use the concepts).
      *   Ensure it sounds like a student board member (respectful, analytical, not overstepping authority).
      *   Make sure it directly addresses the prompt's requirement to not just say "EMT is true."

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I lean too hard on EMT?
      *   *Fix:* Explicitly state that the board doesn't need to settle the EMT debate. The focus is on *functional equivalence* regarding the disability.
      *   *Critique:* Is the recommendation specific enough?
      *   *Fix:* Add specific steps for the "vetting" process.
      *   *Critique:* Did I address the "closed-book" nature?
      *   *Fix:* Acknowledge that "closed-book" is a method, not necessarily a learning outcome. If the method excludes the disabled student from demonstrating the outcome, the method might need adjustment.

  7.  **Final Polish:** Check word count (keep it "short memo" as requested), clarity, and formatting. (Proceed to generate output based on this structure.)

      *(Self-Correction Note: Ensure I don't sound like I'm giving legal advice, but rather policy analysis based on the philosophical framework provided in the prompt.)*

  8.  **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Examination Accommodations Appeals Board
  **FROM:** [Your Name], Student Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Accommodation Request (Case #23-409: TBI Memory Impairment)

  **Purpose**
  This memo provides a recommendation regarding the request of a student with documented traumatic brain injury (TBI) to consult handwritten notes during a closed-book examination. The student argues these notes function as extended memory, citing criteria from Clark and Chalmers. Two primary objections have been raised: the *coupling-constitution fallacy* (Adams & Aizawa) and the *construct validity* of the assessment (whether the exam measures recall or competence).

  **Analysis of Objections**

  **1. The Coupling-Constitution Objection**
  Board members have rightly noted that functional coupling (reliably using a tool) does not ontologically constitute memory (Adams & Aizawa). If we accept the Extended Mind Thesis uncritically, we risk conflating *having* memory with *accessing* data.

  *However*, in the context of disability accommodation, the metaphysical status of the notes is secondary to their functional necessity. For a neurotypical student, a notebook is a coupled tool. For this student, due to TBI, the biological mechanism of retention is impaired; the notebook serves as the *compensatory mechanism* that restores the function of retention. We need not decide if the notes *are* her memory to acknowledge that, without them, she is being tested on her impairment rather than her subject mastery. The accommodation is not granting an advantage, but mitigating a disadvantage that prevents the demonstration of competence.

  **2. The "What Does the Exam Measure?" Objection**
  This is the decisive practical constraint. Our policy prohibits adjustments that "fundamentally alter what the assessment measures."
  *   **Scenario A:** If the course learning outcome requires *internalized recall* (e.g., a language vocabulary exam or safety protocols where external lookup is impossible in practice), allowing notes alters the construct.
  *   **Scenario B:** If the course learning outcome requires *application, synthesis, or reasoning* (where recall is merely a means to an end), then "closed-book" is a methodological constraint, not an essential learning outcome. In this case, prohibiting notes measures the disability, not the cognition.

  **Recommendation**

  I recommend we **GRANT the accommodation, subject to three specific conditions.**

  We cannot resolve the philosophical debate on the nature of memory, but we can ensure the accommodation serves equity without compromising academic standards.

  **Conditions:**
  1.  **Learning Outcome Verification:** The Board must request written confirmation from the course instructor that *unassisted recall* is not an essential learning outcome of the assessment. If the instructor certifies that the exam measures reasoning/application rather than rote retention, the "closed-book" constraint may be waived without altering the construct.
  2.  **Note Vetting:** The student must submit the specific pages to be used 48 hours prior to the exam to Disability Services. These must be verified as personal knowledge structures (summaries, formulas, concepts) rather than worked answers or essay templates. This addresses the concern that the "coupling" is actually just answer-key access.
  3.  **Post-Exam Review:** This accommodation is granted provisionally for this examination cycle only. Following the exam, the Board will review the instructor's feedback on whether the notes allowed the student to demonstrate competence fairly or if they inadvertently bypassed the cognitive work the exam was designed to assess.

  **Rationale**
  This approach sidesteps the need to declare the Extended Mind Thesis "true." Instead, it treats the notebook as a *prosthetic* for a documented impairment. By verifying that the exam measures competence rather than biological retention, we respect the instructor's academic authority while fulfilling our mandate to provide equitable access.

  **Action Required**
  Vote to approve the conditional grant pending Instructor Verification (Condition 1). If Condition 1 cannot be met, the request must be denied as it would fundamentally alter the assessment.
