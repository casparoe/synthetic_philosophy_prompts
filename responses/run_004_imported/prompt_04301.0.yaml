      *   **Middle:** The internal struggle. Not fear of hell, but fear of self-betrayal. The memory of the dead man. The realization that the duty is *his* to enforce.
      *   **Climax:** The decision. Not triumphant, but quiet.
      *   **Ending:** The act is done. The world hasn't changed, but *he* has maintained the thread. The "unvisited tomb" sentiment.

  5.  **Refining the Tone:**
      *   Avoid melodrama.
      *   Use sensory details (dust, ink, rain).
      *   Ensure the internal monologue reflects the "God is inconceivable, Duty is absolute" triad without stating it explicitly.
