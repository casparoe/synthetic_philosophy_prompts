      *   *Refinement:* A woman managing the estate of a distant relative. She finds a discrepancy. She could fix it to her benefit. No one would know. But the *truth* of the account matters.
      *   *Better Refinement:* Let's make it more interpersonal. A promise to a living person who trusts her, but who would never know if she broke it. Or a promise to a dead person. Let's go with a dead person. It removes the fear of earthly discovery.
      *   *Specific Scenario:* Elias Thorne, a modest schoolmaster or clerk. He owes a debt to a man who died. The man's heirs don't know about the debt. Elias could keep the money. He needs it. But the duty remains.
      *   *Setting:* Late Victorian (to match Eliot), or modern? The prompt says "period... entirely yours." Modern might make the isolation sharper, but Victorian fits the "Eliotian" weather better. Let's aim for a timeless late 19th/early 20th feel. Gaslight, rain, paper.
      *   *Character:* Arthur Penhaligon. A solicitor's clerk? No, too much bureaucracy. A private tutor? A shopkeeper? Let's make him a restorer of books or maps. Something quiet.
      *   *The Obligation:* He borrowed money from a friend, Mr. Halloway, years ago. No note. Halloway died. Halloway's widow is struggling. Arthur could pay her, but it would ruin his own chance to fix his roof/marry/leave. Or he could say nothing. No one knows.
