      *   **Word Count:** 900 - 1400 words.

  2.  **Deconstruct Eliot's Position:**
      *   It's not just atheism; it's *humanistic imperative*.
      *   The "God" is projected humanity; therefore, serving humanity is the only real worship.
      *   The "Duty" is internal but feels absolute. It's the "categorical imperative" grounded in sympathy rather than pure reason.
      *   Key feeling: Solitude of the moral agent. No one is watching, not even God, but *I* am watching, and *I* am part of the web of humanity.
      *   Key imagery: Rain, quiet rooms, ledgers, small objects, the weight of silence.

