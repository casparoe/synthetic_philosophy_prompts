answer: |-
  The rain had been falling since noon, a steady, grey sheet that blurred the gas lamps on the street below into smudges of bruised yellow. Inside the study, the silence was of a different quality—not empty, but heavy, as if the air itself were waiting for a verdict.

  Arthur Meech sat at his desk, the leather blotter cool beneath his forearms. Before him lay a single sheet of paper, and upon it, a promissory note dated three years prior. It was signed by him, and countersigned by Elias Thorne. Thorne was dead. He had been buried three weeks ago in the pauper's section of Highgate, his estate insolvent, his widow left with nothing but a box of letters and a reputation for bad luck.

  The note was for two hundred pounds. A sum substantial enough to ruin Arthur if he paid it now, yet small enough to be absorbed by the firm he clerked for if he simply claimed it was a business expense lost to fraud. Or, easier still, he could destroy the note. There was no copy. Thorne's widow did not know it existed; Thorne had kept his financial humiliations close to his chest, even from her. If Arthur burned the paper, the debt vanished into the same silence that had taken Thorne. There was no God to see it, no angel to record it in a book of judgment. There was only the rain, the desk, and Arthur's own knowledge.

  He picked up the note. The paper was thin, ragged at the edges. He could feel the texture of the fibers against his thumb. For a long time, he had told himself that religion was a nursery tale, a comfort for those who feared the dark. He had read the Germans; he had dismantled the heavens. He knew that the universe was indifferent to whether he burned this paper or honored it. The stars would not blink if he chose ease over integrity. The grass would grow over Thorne's grave regardless.

  And yet, the obligation did not dissolve with the theology. If anything, in the absence of a divine witness, the weight of the thing had shifted entirely onto his own shoulders. It was no longer a transaction managed by a cosmic accountant; it was a thread in the human web, and he was the only one left holding his end. To drop it was not to sin against heaven, but to sever a connection that could not be remade.

  He thought of Thorne's widow, Mrs. Thorne, whom he had seen at the funeral. She had worn a black dress too thin for the chill wind, her hands clasped tightly as if holding herself together. She believed in a God who would provide. Arthur did not. But if he did not provide, who would? The universe would not. The void did not care for widows.

  "If there is no one to watch," Arthur whispered to the empty room, "then I must be the one who sees."

  It was a strange comfort, this loneliness. It stripped away the childish hope of reward. There would be no praise. He could not tell Mrs. Thorne he was paying without shaming her husband's memory, implying Thorne had died in debt. He would have to send the money anonymously, or claim it was a forgotten inheritance. She would never know it was sacrifice. She might not even know it was justice. It would simply be a small easing of her burden, a drop in the bucket of her survival.

  Arthur dipped his pen. The ink was dark, viscous. He drew a check from his own account, knowing it would delay the repairs on his own roof, that it would mean another winter of damp patches spreading across his ceiling like maps of unknown countries. He wrote the amount. He signed his name.

  The act felt less like a choice and more like a necessity, like breathing. He had expected a surge of virtue, a warm glow of righteousness, but there was nothing of the sort. There was only the scratch of the nib and the dull ache in his wrist. This was the truth of it: duty was not a fire; it was a stone. You carried it because it was yours to carry, not because it made you light.

  He placed the check in an envelope. He did not seal it immediately. He looked around the room, at the books on the shelves, the shadows gathering in the corners. He felt profoundly alone. There was no hand reaching down to steady his own. There was no promise that this act would ripple outward to make the world better in any measurable way. Mrs. Thorne might still fall into ruin; the roof might still leak; the rain might never stop. He was not an optimist. He did not believe the world was trending toward glory. He was a man standing in the mud, laying one brick on another because the wall needed to stand, even if no one ever walked behind it.

  He sealed the envelope.

  Arthur stood and walked to the window. The rain streaked the glass, distorting the lights of the passing carriages. Somewhere out there, people were praying, asking for intercession, bargaining with the infinite. He felt a pang of envy for their certainty, followed immediately by a stiffening of his resolve. Their certainty was a cushion; his was the ground beneath his feet, hard and unyielding.

  He put on his coat and took the envelope. He walked out into the hall, the floorboards creaking under his weight. He would post it himself. He would walk to the box on the corner, through the wet, without an umbrella. The discomfort was appropriate. It was a small penance for nothing, a physical acknowledgment of a metaphysical fact.

  Outside, the air was cold and smelled of wet coal and horse manure. He walked to the pillar box, the red paint gleaming dull in the gloom. He slipped the envelope into the slot. It fell with a soft thud, gone into the iron belly of the system.

  It was done. No bells rang. The rain continued to fall. Arthur turned his collar up against the wind and began the walk home. He would arrive damp and tired. He would eat a simple supper. He would sleep, and tomorrow he would return to the ledger, to the columns of figures that balanced only because men agreed they should.

  He thought of the dead lying in unvisited tombs, their good deeds buried with them, the sum of their lives contributing to a growing good they would never see. He was one of them, already. He was building a world he would not inhabit, honoring a law that existed only because he chose to enforce it. There was no glory in it, only the quiet, peremptory demand to be true to the web that held him.

  Arthur walked on, a solitary figure in the grey evening, carrying nothing but the knowledge that he had not let go of the thread.
