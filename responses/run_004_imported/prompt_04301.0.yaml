      *   *Final Decision:* Arthur is a clerk. He holds a sealed envelope given to him by a deceased colleague, Mr. Vane. Vane said, "Give this to his wife if anything happens." Inside is money Vane stole from the firm, meant to be returned anonymously? No, too complex.
      *   *Simpler:* Arthur owes Vane money. Vane is dead. Vane's estate is being settled. Arthur could claim he never borrowed it. It would help him. But he feels the weight of the "unseen witness."
      *   *Let's focus on the "Meliorist" angle:* The act contributes to the "growing good of the world" even if unvisited.
      *   *Scenario:* Arthur finds an error in the accounts favoring him. He can correct it (costing him) or leave it (gaining him). No one checks these old ledgers.

  4.  **Drafting - Section by Section:**
