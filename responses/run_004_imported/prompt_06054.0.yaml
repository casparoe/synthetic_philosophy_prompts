  ```

  **Move 1 (Ana):** Ana correctly identifies the standard "hypocrisy condition" on standing: if you violate the norm you are invoking, you typically lose the authority to blame. However, claiming "zero standing" is slightly absolute without first establishing that the violations are morally equivalent.

  **Move 2 (Leo):** Leo conflates the *truth* of the blame with the *permissibility* of the blaming act. In standing literature, a hypocrite can be substantively correct (Theo *is* selfish) but still lack the normative authority to express that blame; Leo misses this distinction entirely.

  **Move 3 (Ana):** This is the strongest philosophical move. Ana correctly locates the wrong of hypocrisy not in the falsity of the claim, but in the unfairness of the relational dynamic (holding another to a standard one exempts oneself from), which is the core normative justification for standing objections.

  **Move 4 (Leo):** Leo offers two valid defenses found in the literature: the "repentance" exception (apologizing can restore standing) and the "relevant difference" claim (the exams were not morally equivalent). These are substantive counters to the hypocrisy charge, though the sincerity of the apology is debatable.

  **Move 5 (Ana):** Ana is right that standing is a normative status distinct from factual similarity, but she is slightly imprecise to suggest factual likeness is a "totally different question," since factual likeness is usually the premise that determines whether hypocrisy exists in the first place.

  ### The Underlying Distinction

  Leo and Ana are talking past each other on the distinction between **Substantive Correctness** and **Normative Authority**. Leo is operating under the assumption that moral criticism is valid if and only if the content of the criticism is true (i.e., "Is Theo actually being selfish?"). Ana is operating under the seminar's framework, where moral criticism is a speech act that requires specific authority to be appropriate (i.e., "Does Leo have the *right* to call Theo selfish?").

  Leo thinks that proving Theo's action was wrong justifies his blame. Ana thinks that even if Theo's action was wrong, Leo's own relationship to that norm blocks his *permission* to enforce it. To resolve this in your paper, you should frame the debate not as whether Theo was selfish, but whether the *practice of blaming* requires moral consistency from the blamer to be legitimate. Leo is arguing about the *object* of blame; Ana is arguing about the *subject* of blame.
