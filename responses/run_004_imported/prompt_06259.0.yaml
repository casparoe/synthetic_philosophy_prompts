answer: |-
  **Title:** The Price of Propositions: Defending Truth-Conditional Semantics Against the Triviality Results

  **Introduction**

  David Lewis's triviality results present a stark choice for the semantics of indicative conditionals. If we assume that conditionals express propositions with standard truth conditions, and we maintain Adams' Thesis (the Equation)—that the probability of a conditional $P(A \rightarrow B)$ equals the conditional probability $P(B|A)$—probability theory collapses. To avoid this, we must abandon one of the two conjuncts. The "fundamental dilemma" facing the semanticist is thus: either we retain the Equation and deny that conditionals have truth conditions (the Adams-Edgington non-cognitivist route), or we retain truth conditions and weaken the Equation (the Stalnaker-Jackson cognitivist route).

  This paper defends the latter horn. I argue that preserving a truth-conditional semantics for indicative conditionals is theoretically mandatory because the non-cognitivist alternative incurs an unsustainable cost: the inability to account for the logical embedding of conditionals. While the truth-conditionalist must concede that Adams' Thesis does not hold in full generality, this concession is not an *ad hoc* patch but a principled distinction between truth conditions and norms of assertion. I will demonstrate that the embedding problem constitutes a fatal structural flaw for non-cognitivism, whereas the weakening of the Equation is a manageable refinement that preserves the compositional integrity of natural language.

  **I. The Embedding Problem: A Structural Catastrophe for Non-Cognitivism**

  The primary motivation for Adams' Thesis is its intuitive fit with our probabilistic judgments. We judge "If it rains, the match will be cancelled" as highly probable precisely when the probability of cancellation given rain is high. Non-cognitivists argue this fit is too perfect to be coincidental; it suggests the meaning of the conditional *is* the conditional probability. However, this move severs the link between conditionals and the truth-conditional machinery required for logical composition.

  The "Frege-Geach" problem, originally leveled at expressivism in ethics, arises acutely here. Logical operators such as negation, disjunction, and the conditional itself operate on propositions—entities that bear truth values. If "If $A$, then $B$" does not express a proposition but rather an act of conditional assertion or a state of mind, it cannot serve as the input for these operators.

  Consider the following embedded structures, which are grammatically well-formed and intuitively intelligible in natural language:

  1.  **Negation:** "It is not the case that if the butler did it, he used the candlestick."
  2.  **Disjunction:** "Either if it rains we stay inside, or if it shines we go to the beach."
  3.  **Iterated Conditionals:** "If, if $A$, then $B$, then $C$."

  For the non-cognitivist, these sentences are semantically problematic. If "If $A$, $B$" lacks a truth value, what is the negation in (1) operating on? It cannot be negating a proposition, for there is none. Adams and Edgington attempt to handle this by treating unembedded conditionals as primary and embedded occurrences as derivative or elliptical. However, this requires a radical reconstruction of natural language logic. It implies that the surface grammar of English is systematically misleading regarding the logical form of conditionals.

  This is not a cosmetic cost; it is a theoretical disaster. A semantics is expected to explain the validity of arguments. Consider a modus tollens argument involving a conditional in the scope of a probability operator or a modal. If the conditional has no truth conditions, we cannot define validity in terms of truth-preservation. Non-cognitivists must define validity in terms of "probability preservation" or "acceptability preservation." While formally possible, this fragments logic. It creates a disconnect between the logic of simple assertions and the logic of conditionals, making it difficult to explain why conditionals interact seamlessly with truth-functional connectives in complex sentences.

  Furthermore, the embedding problem blocks the explanation of anaphora and cross-sentential reference. In discourse like "If John comes, Mary will leave. If *that* happens, we should cancel the party," the second sentence refers to the content of the first conditional. If the first conditional has no propositional content, the anaphor "that" lacks a referent. The truth-conditionalist handles this effortlessly: "that" refers to the proposition expressed by the first conditional. The non-cognitivist must posit complex, non-propositional discourse referents, complicating the theory of dynamic semantics without clear gain.

  Therefore, the cost of option (a) is the loss of compositionality and the fracturing of logic. To save the Equation, the non-cognitivist must treat a vast swath of ordinary conditional discourse as semantically defective or logically sui generis. This is too high a price.

  **II. A Principled Retreat: Distinguishing Truth from Assertibility**

  If we choose option (b), we preserve truth conditions (e.g., Stalnaker's closest-world semantics or even the Material Conditional) but must admit that $P(A \rightarrow B) \neq P(B|A)$ in all cases. The worry, as you noted, is that this looks like dodging the bill: we save logic only by sacrificing the intuitive probabilistic data that motivated the inquiry.

  However, this sacrifice can be justified on principled, non-*ad hoc* grounds by following Frank Jackson's strategy of relocating the Equation from semantics to pragmatics. The rationale is that Adams' Thesis conflates the *truth conditions* of a sentence with the *norms governing its assertion*.

  On a truth-conditional view (let us assume Stalnaker's for richness, though the point holds for the Material Conditional), the proposition $A \rightarrow B$ is true if $B$ holds in the closest $A$-world. The probability $P(A \rightarrow B)$ is the probability that this proposition is true. Lewis's proof shows this cannot always equal $P(B|A)$. But why, then, is the Equation so intuitively compelling?

  Jackson argues that the link to $P(B|A)$ is a condition of *assertibility*, not truth. To assert "If $A$, $B$" is not merely to assert a truth; it is to assert a truth that is *robust* with respect to $A$. We should only assert the conditional if our belief in the conditional would survive learning $A$. This robustness condition tracks $P(B|A)$.

  This distinction provides the principled rationale for why the Thesis fails exactly where the triviality proof requires it to fail. The triviality proof relies on the assumption that the probability of the conditional is sensitive to the probability of the antecedent in a specific way (specifically, that $P(A \rightarrow B)$ remains constant when conditionalizing on $A$ or $\neg A$). But if $P(A \rightarrow B)$ measures the probability of a truth condition (e.g., a set of worlds), it behaves like any other proposition. It is the *assertibility* that tracks $P(B|A)$, and assertibility is not closed under logical equivalence in the same way truth is.

  Consider a case where $P(B|A)$ is high, but the conditional is false. Suppose I know that $A$ is false. On the Material Conditional view, "If $A$, $B$" is vacuously true. However, $P(B|A)$ might be low or undefined. More subtly, on a Stalnaker view, there may be cases where the closest $A$-world is a $\neg B$-world, making the conditional false, even if the objective chance or my epistemic probability $P(B|A)$ is high due to misleading evidence. In such cases, the Equation fails.

  Is this failure *ad hoc*? No. It follows from a general theory of communication. We frequently distinguish between what is said (truth-conditional content) and what is conveyed (pragmatic content). Gricean implicatures explain why we don't assert " $A$ or $B$" when we know $A$, even though the disjunction is true. Similarly, we do not assert "If $A$, $B$" when we lack a robust connection, even if the truth conditions are met. The "cost" of weakening the Equation is simply the recognition that natural language semantics involves a division of labor between truth conditions (for logic and embedding) and assertibility conditions (for probabilistic judgment and use).

  **III. Why This is the Lesser Evil**

  The choice, then, is between a theory that gets the probabilities right but breaks logic (Non-Cognitivism), and a theory that gets the logic right but requires a nuanced view of probability (Cognitivism).

  The embedding problem demonstrates that logic is the more fundamental constraint. If a semantics cannot account for how conditionals function in the scope of operators, it fails as a semantics of a natural language, which is inherently compositional. We can explain away the divergence between $P(A \rightarrow B)$ and $P(B|A)$ via pragmatics (as Jackson does) or by accepting that our intuitive probability judgments track assertibility rather than truth (as Stalnaker suggests). But we cannot explain away the fact that we validly infer from "If $A$, $B$" and "If $B$, $C$" to "If $A$, $C$" in embedded contexts if conditionals lack truth values.

  Furthermore, the "weakening" of Adams' Thesis is less drastic than it appears. In ordinary contexts, where we are ignorant of the truth value of $A$, the Stalnaker conditional and the conditional probability often align closely. The divergence occurs in technical cases (e.g., when $A$ entails the conditional, or in specific probabilistic dependencies highlighted by Lewis). A theory that handles 95% of cases via the Equation and explains the 5% failure via a robust truth-conditional framework is superior to a theory that handles the probabilities but declares the logic of the 100% of cases involving embedding to be semantically illusory.

  **Conclusion**

  Lewis's triviality results force a trade-off, but they do not force a surrender of truth conditions. The non-cognitivist attempt to save Adams' Thesis in full generality exacts a prohibitive tax: the inability to account for the logical integration of conditionals into complex thought and language. The embedding problem is not a mere technicality; it strikes at the heart of semantic compositionality.

  By contrast, preserving truth-conditional semantics allows us to maintain a unified logic for natural language. The requisite weakening of Adams' Thesis is not a desperate patch but a principled application of the distinction between truth and assertibility. By following Jackson in viewing the Equation as a norm of assertion rather than a definition of truth, we can explain why the Equation feels necessary without letting it destroy the probabilistic coherence of our semantics. We should therefore accept the truth-conditional horn of the dilemma: we pay for logical coherence with a nuanced pragmatics, rather than paying for probabilistic intuition with the collapse of logic.
