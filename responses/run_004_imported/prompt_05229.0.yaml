prompt: |-
  A friend and I spent an entire dinner arguing about Aquinas on tyrannicide and never quite settled it. My friend's shorthand was that "Aquinas thought it was fine to kill tyrants," but his actual view seems more layered to me: in De Regno, and again in his remarks on sedition in the Summa, he distinguishes a ruler who never held legitimate title to rule — a usurper, whom a private person may resist or even kill, absent recourse to a higher authority — from a ruler who acquired power legitimately but has grown oppressive in exercising it. In that second case, Aquinas insists that removal is a matter for the public authority or community that installed the ruler, not for private individuals acting on their own judgment, partly because he feared that licensing private tyrannicide would give the ambitious cover to murder decent rulers on false pretexts.

  Here is the case that split us. Imagine a head of state who wins power in a genuinely free election, then hollows out the courts, jails independent journalists, and rigs or cancels every subsequent election to stay in office indefinitely; and imagine that a foreign government, acting alone and in total secrecy, with no UN authorization or other recognized public sanction, has this leader killed in a drone strike. Working from Aquinas's actual principles rather than the popular gloss on them: would he treat such a leader as a usurper, on the grounds that the mandate which made his rule legitimate has been subverted from within, or as a legitimate authority removable only through due public process? And should a covert strike ordered by a foreign power be judged by the standard Aquinas applied to a lone citizen's dagger, or does the change of actor change the analysis? Tell me what verdict you think Aquinas's own principles commit him to, and why.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Query:**
      *   **Core Subject:** Thomas Aquinas's view on tyrannicide.
      *   **The Dispute:** Friend says "Aquinas thought it was fine to kill tyrants." User says "It's more layered (usurper vs. legitimate-but-oppressive)."
      *   **The Scenario:** A democratically elected leader who subverts democracy (hollows courts, jails journalists, rigs elections) to stay indefinitely. A *foreign government* (covert, no UN sanction) assassinates this leader via drone strike.
      *   **The Questions:**
          1.  Would Aquinas classify this leader as a *usurper* (due to subverted mandate) or a *legitimate authority* (removable only by public process)?
          2.  Does the actor (foreign power vs. private citizen) change the analysis compared to Aquinas's standard for a "lone citizen's dagger"?
          3.  What is the verdict based on Aquinas's *actual principles*?

  2.  **Analyze Aquinas's Textual Basis:**
      *   *De Regno (On Kingship):* Aquinas argues against tyrannicide by private individuals. He worries about the greater evil of sedition and the risk of good kings being killed by plotters. He suggests public authority or a higher superior (like the Emperor over a king) should handle removal.
      *   *Summa Theologiae (II-II, Q. 42, A. 2):* On Sedition. Sedition is a sin. Opposing a tyrant is not sedition *unless* it disturbs the multitude more than the tyranny itself.
      *   *Commentary on the Sentences:* He discusses whether it is meritorious to kill a tyrant. He generally leans towards "no" for private individuals, unless there is no other recourse and the tyrant is a usurper.
      *   *Key Distinction:* Usurper (no title) vs. Legitimate Title/Abuse of Power.
      *   *Key Agent:* Private individual vs. Public Authority.

  3.  **Evaluate the Scenario against Aquinas's Principles:**

      *   **Question 1: Usurper vs. Legitimate Authority.**
          *   *Initial Status:* Elected legitimately.
          *   *Subsequent Action:* Subverted the system to stay indefinitely.
          *   *Aquinas's View:* Aquinas distinguishes based on the *acquisition* of power (title), not necessarily the *exercise* of power (though exercise matters for the remedy). A ruler who gains power legitimately but rules tyrannically is still the ruler. The subversion of future elections doesn't necessarily retroactively make the initial title void in Aquinas's feudal/monarchical framework, *but* it might constitute a forfeiture of the *pact* of rule.
          *   *However:* Aquinas is cautious. He fears the slippery slope. If every citizen decides the king is now a usurper because he's mean, chaos ensues.
          *   *Verdict on Status:* Aquinas would likely still classify him as a ruler with legitimate *title* (initially granted), now governing tyrannically. He is not a "usurper" in the strict sense (like someone who seizes power by force without election/appointment). The subversion of the mandate is a moral failing and a legal crisis, but Aquinas prefers institutional remedies over reclassification to justify killing.

      *   **Question 2: The Actor (Foreign Power vs. Private Citizen).**
          *   *Aquinas's Concern:* Private individuals lack the *authority* (auctoritas) to judge and execute. This belongs to the public good.
          *   *Foreign Power:* Is a foreign power a "public authority" *over* the tyrant's state? Generally, no. In Aquinas's worldview (Christendom/Empire), there might be a superior (Emperor/Pope), but a rival king/state does not have jurisdiction over another sovereign's internal tyrant.
          *   *War vs. Assassination:* Aquinas has a Just War theory. A foreign power killing a leader is an act of war. Is it a *just* war?
          *   *Covert/Secret:* Aquinas values order and law. Covert assassination undermines the public nature of justice.
          *   *Verdict on Actor:* A foreign power is not the "public authority" of the tyrant's people. Therefore, they lack the specific jurisdictional standing Aquinas requires for removal. They are effectively external private agents relative to that polity's internal constitution, or belligerents in a war. If it's not a declared just war, it's murder/aggression.

      *   **Question 3: The Verdict.**
          *   Aquinas would likely condemn the assassination.
          *   *Reason 1:* The tyrant is not a usurper (initially legitimate).
          *   *Reason 2:* The remover is not the proper public authority (it's a foreign power, not the people's representatives or a superior sovereign).
          *   *Reason 3:* The method (covert drone strike) lacks public juridical character.
          *   *Reason 4:* The risk of greater disorder (war, instability) outweighs the removal of the tyrant.

  4.  **Drafting the Response:**
      *   *Acknowledge the User's Insight:* Validate that their reading is correct (it is layered, not a blanket endorsement).
      *   *Address the Usurper Question:* Explain why Aquinas would likely see this as "tyranny in exercise" rather than "usurpation of title." The initial consent matters.
      *   *Address the Actor Question:* This is crucial. Aquinas cares about *jurisdiction*. A foreign state is not the "public authority" of the victim state.
      *   *Synthesize the Verdict:* Aquinas would likely oppose the strike.
      *   *Nuance:* Discuss the "Superior Authority" angle (Is there a higher power? In modern terms, UN? The prompt says no UN sanction).
      *   *Conclusion:* The friend's shorthand is wrong; the user's intuition is right, but the foreign actor element seals the condemnation.

  5.  **Refining the Argument (Self-Correction/Deep Dive):**
      *   *Wait, does the subversion of elections make him a usurper?* Some scholastics argued that a tyrant forfeits title. Aquinas is more conservative. He worries about the *pretext*. If we allow reclassification based on behavior, any assassin can claim the king was "acting like a usurper." Aquinas prioritizes stability.
      *   *What about the Foreign Power?* In *De Regno*, Aquinas mentions that if a tyranny is excessive, recourse should be had to a "superior authority." In a modern context, is a foreign power a superior? No. They are peers. So they lack jurisdiction.
      *   *Just War?* Could this be a targeted killing in a just war? Aquinas requires legitimate authority declaring war. A covert strike without declaration or UN sanction fails the "legitimate authority" and "public declaration" aspects of Just War theory too.
      *   *The "Public Authority" of the People:* Aquinas says the community can remove a tyrant they installed. But the scenario specifies a *foreign* government acting *alone*. This bypasses the local community's agency, which Aquinas values.

  6.  **Final Polish:** Ensure the tone is scholarly but accessible, respecting the depth of the user's question. Structure it clearly: 1. Validating the premise. 2. Analyzing the Tyrant's Status. 3. Analyzing the Agent. 4. The Verdict.

      *(Self-Correction during drafting)*: Make sure to explicitly mention *De Regno* and *Summa Theologiae* II-II Q. 42. Ensure the distinction between *tyrannus ex defectu tituli* (usurper) and *tyrannus ex parte exercitii* (abuse of power) is clear.

      *Final check on the foreign power aspect:* Aquinas believes in a hierarchy of authority. A foreign king is not the judge of another king's internal tyranny unless there is a feudal superior relationship. In the modern Westphalian system (implied by "head of state"), they are equals. Therefore, the foreign power acts without jurisdiction.

      *Conclusion:* Aquinas votes "No."

  7.  **Final Output Generation** (similar to the provided good response).
answer: |-
  You are absolutely right to push back against your friend's shorthand. The popular caricature of Aquinas as a proto-revolutionary endorsing the assassination of bad kings is historically inaccurate. Your reading of the distinction between the *usurper* (tyrannus ex defectu tituli) and the *legitimate ruler who governs tyrannically* (tyrannus ex parte exercitii) is the correct entry point into his thought.

  However, your scenario introduces two variables that Aquinas does not explicitly address in a modern context: the **forfeiture of title through democratic subversion** and the **intervention of a foreign sovereign**.

  If we apply Aquinas's principles rigorously to this specific case, I believe he would condemn the drone strike. Here is the breakdown of why his principles commit him to that verdict.

  ### 1. The Status of the Leader: Usurper or Legitimate Ruler?
  Aquinas's primary concern in *De Regno* and the *Summa Theologiae* (II-II, Q. 42, A. 2) is the preservation of order and the avoidance of sedition, which he considers a grave sin because it fractures the unity of the multitude.

  *   **The Usurper:** Aquinas allows that a usurper (one who seizes power without any legal or customary title) may be resisted, potentially even by a private individual if no public recourse exists, because they have no bond of allegiance with the people.
  *   **The Legitimate Ruler:** If power was acquired legitimately, Aquinas argues that even if the ruler becomes oppressive, private individuals cannot kill them. The remedy must come from "public authority."

  **Applying this to your scenario:**
  The leader won power in a genuinely free election. In Aquinas's framework, this establishes a legitimate title (*titulus*). The subsequent hollowing out of courts and rigging of elections is tyranny in *exercise*, not necessarily in *title*.

  While one could argue that by subverting the constitution, the leader effectively voids their own title (becoming a usurper of their own office), Aquinas is deeply skeptical of allowing private judgment to make that call. He fears that if subjects are allowed to decide that a ruler's bad behavior constitutes "usurpation," any faction could assassinate a ruler they dislike by claiming the ruler had "forfeited" legitimacy.

  Aquinas would likely rule that until a competent public authority (the courts, the legislature, or the electorate acting through due process) formally declares the leader's tenure void, the leader retains the *protection of the office*. Therefore, he remains a legitimate authority removable only through public process, not a usurper open to private execution.

  ### 2. The Agent: Foreign Power vs. Public Authority
  This is the decisive factor. Aquinas insists that the removal of a tyrant (even a legitimate one turned bad) belongs to the **public authority** that installed him, or a **superior authority** with jurisdiction over him.

  *   **The People's Authority:** In *De Regno*, Aquinas suggests that if a king is elected by the people, the people (or their representatives) have the right to depose him if he abuses the power entrusted to them.
  *   **The Superior Authority:** In a feudal context, a king might have a superior (an Emperor or the Pope) who could judge him.

  **Applying this to your scenario:**
  The actor here is a **foreign government**.
  1.  **Lack of Jurisdiction:** In Aquinas's political theology, authority is hierarchical and jurisdictional. A foreign head of state is not the "public authority" of the tyrant's people, nor are they a "superior" with legal jurisdiction over that state's internal constitution. They are an external peer.
  2.  **The Problem of Private Judgment:** When a foreign power acts alone, without UN authorization or a collective international sanction, they are effectively acting as a "private individual" on the international stage relative to that sovereign state. They are making a unilateral judgment on the legitimacy of another ruler. Aquinas would view this as an act of aggression, not an act of justice.
  3.  **Covert vs. Public:** Aquinas's concept of justice is inherently public. Punishment and removal of authority must be done openly to serve the common good and reinforce the rule of law. A covert drone strike is an act of secrecy, akin to the "lone citizen's dagger" Aquinas fears, merely scaled up. It bypasses the public juridical process required to legitimize the use of lethal force against a ruler.

  ### 3. The Verdict: Why Aquinas Would Condemn the Strike
  Aquinas would likely judge this action as **unjust** and **seditious** (in the international sense), for three cumulative reasons:

  1.  **Improper Classification:** He would likely classify the leader as a tyrant in *exercise* rather than a usurper in *title*. The initial legitimate election creates a bond that cannot be severed unilaterally by an external actor based on the leader's subsequent conduct.
  2.  **Improper Agent:** The foreign power lacks the *auctoritas* (authority) to execute judgment. They are not the people who elected him, nor are they a recognized superior court. To allow foreign powers to assassinate leaders they deem tyrannical would, in Aquinas's view, invite endless war and instability—a greater evil than the tyranny itself.
  3.  **Risk of Greater Evil:** Aquinas utilizes a utilitarian calculus regarding order. He argues that often, removing a tyrant leads to greater turmoil, factionalism, or a worse successor. A covert foreign assassination would likely destabilize the region, provoke war, and undermine the principle of sovereign order. Aquinas would argue that the "sedition" caused by the foreign strike is morally worse than the tyranny it seeks to end.

  ### Conclusion
  Your friend's shorthand ("Aquinas thought it was fine to kill tyrants") fails because it ignores the **procedural constraints** Aquinas places on that act. Aquinas is not endorsing tyrannicide; he is tolerating it only under extremely narrow, jurisdictional conditions (usurpation + no public recourse).

  In your scenario, the leader was not initially a usurper, and the killer was not the proper public authority. Aquinas would view the foreign drone strike not as an act of liberation, but as **murder compounded by an act of unjust war.** He would argue that the remedy for the tyranny lies with the oppressed community to reclaim their public authority, not with a foreign power to act as judge, jury, and executioner in the shadows.

  You win the dinner argument, provided you emphasize that for Aquinas, **who kills** matters just as much as **who is killed.**
