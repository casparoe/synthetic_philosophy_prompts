answer: |-
  You are reading this exactly right, and your intuition about the Peirce/James split is spot on. You've also hit on the single most famous (and most misunderstood) thought experiment in the history of pragmatism.

  Here is the breakdown of what Peirce is actually doing in that passage, why it feels backwards, and how it marks the dividing line between him and William James.

  ### 1. Is he saying the diamond isn't hard?
  **Short answer:** No. He is saying the *concept* of hardness has no meaning apart from the *possibility* of scratching.

  **Long answer:** Peirce is not making a claim about physics (ontology); he is making a claim about logic and language (semantics). This is his **Pragmatic Maxim**: *Consider what effects, that might conceivably have practical bearings, we conceive the object of our conception to have. Then, our conception of these effects is the whole of our conception of the object.*

  When you say "This diamond is hard," Peirce asks: "What do you *mean* by that?"
  You mean: "If I try to scratch it with glass, it will not scratch."

  Peirce is arguing that "hardness" is a **dispositional property**. It is defined by a conditional statement (an "if-then").
  *   **Realist view (your intuition):** Hardness is a micro-structure existing inside the diamond right now, regardless of whether anyone looks.
  *   **Peirce's view:** That micro-structure *just is* a set of conditional predictions about how the diamond interacts with other things.

  So, regarding the diamond in the cotton: Peirce is saying that since the condition ("if scratched") never occurs, the statement "it is hard" and the statement "it is soft" result in the exact same practical outcome (nothing happens). Therefore, logically, there is no difference between the two statements.

  He isn't denying the diamond has a structure. He is denying that "structure" means anything unless it translates into **would-bes**. The diamond *would* resist scratching if you *were* to try. That "would" is real for Peirce, even if the "did" never happens.

  ### 2. Why it feels backwards (and why Peirce thinks it's not)
  Your objection is the standard realist objection: *"The thing has whatever structure it has no matter what we ever do to it."*

  Peirce would reply: "Okay, describe that structure without using words that imply potential effects."
  If you say, "It has a strong covalent bond lattice," Peirce asks, "What does *that* mean?"
  You say, "It means the atoms are held tightly."
  Peirce asks, "What does *that* mean?"
  You say, "It means if you apply force, they don't move."

  Peirce's point is that eventually, you always cash out physical properties in terms of **interactions**. There is no "hidden essence" of hardness that exists over and above how the thing behaves when tested.

  So, he isn't saying the diamond is soft. He is saying that calling it "hard" is a prediction about how it *would* behave, not a description of a magical inner glow it possesses. Since it burned up before being tested, the prediction was never fulfilled, but the *disposition* was still real. (Peirce was actually a "Scholastic Realist"—he believed real generals and laws exist, not just particular things).

  ### 3. The Peirce vs. James Split
  You are absolutely correct here. This passage is the seed of their eventual divorce.

  **William James** took the Pragmatic Maxim and applied it to **individual psychology and belief.**
  *   For James, "what works" often meant "what provides comfort, moral satisfaction, or religious hope."
  *   If believing in God makes your life better and helps you function, that belief is "true" in a pragmatic sense.
  *   This leads to the "truth is whatever works for you" caricature you mentioned.

  **C.S. Peirce** applied the Maxim to **logic and scientific inquiry.**
  *   For Peirce, "what works" means "what leads to successful prediction and communal agreement among investigators."
  *   He cared about the **Long Run**. Truth isn't what works for *me* right now; it's what the community of scientists would eventually agree upon if they investigated forever.
  *   He hated James's interpretation. Peirce was a logician who wanted to make philosophy scientific. He felt James turned pragmatism into a justification for wishful thinking.

  **The Proof:** Peirce was so annoyed by James's popularity and interpretation that he later renamed his own philosophy **"Pragmaticism."** He famously wrote:
  > "So then, the writer, finding his bantling 'pragmatism' so promoted, feels that it is time to kiss his child good-by and relinquish it to its higher destiny; while to serve the precise purpose of expressing the original definition, he begs to announce the birth of the word 'pragmaticism'..."

  He called the name "ugly enough to be safe from kidnappers."

  ### Summary
  You aren't misreading the passage. It is supposed to feel radical.
  1.  **On the Diamond:** Peirce is arguing that properties are defined by **conditional predictions** (would-bes), not hidden essences. If the condition never triggers, the distinction between hard/soft has no logical bite, though the *disposition* remains real.
  2.  **On the Split:** You nailed it. James went toward **individual utility** (does this belief help me live?); Peirce went toward **objective verification** (does this concept hold up to public testing and logic?).

  If you keep reading Peirce, look for his concept of **"Fallibilism"** (we can never be 100% certain, but we can get closer to the truth) and **"The Community of Inquiry."** That is where his version of pragmatism really separates itself from James's. You're asking the right questions.
