      *Counter:* Fuller argues that this pragmatism *is* the morality of law. Without it, there is no law.
      *Okay, I will stick with Fuller.* The argument will be that Smart Contracts are closer to *contracts* (private law) than *statutes* (public law). In contract law, intent matters more than strict textualism when errors occur. Fuller's purposivism fits contract law better than Hart's positivism fits criminal statutes.

  8.  **Final Outline:**
      1.  Intro: The DAO as Jurisprudence.
      2.  Hart vs. Fuller: The 1958 Mechanics (Separability, Inner Morality, Efficacy).
      3.  The DAO Application: ETC as Hartian, ETH as Fullerian.
