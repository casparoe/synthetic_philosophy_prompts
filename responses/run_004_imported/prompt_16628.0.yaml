      *   *Decision:* I will argue Fuller is more defensible because smart contracts are fundamentally *relational* instruments, not just static commands. But I must acknowledge the retroactivity problem. I will argue that in a decentralized context, "consensus" acts as the continuous ratification that mitigates the retroactivity harm.

  7.  **Final Polish:** Check tone. Ensure no symmetric hedging. Make sure the Hart/Fuller mechanics are precise (efficacy vs. morality). Ensure the DAO details are accurate (reentrancy, hard fork).

