      *   *Key Insight:* Hart distinguishes between "being law" and "being morally binding." The DAO attacker had a *legal* (code) right, but maybe not a moral one. Hart would say: Punish him retroactively if you must, but admit you are breaking the old rule. The Forkers pretended the old rule never existed. This is actually *Fuller's* nightmare (retroactivity).
      *   *Wait, let's flip it:* "Code is Law" claims the code *is* the morality. That's a natural law claim (Law = Right). Hart would say "The code is the law, but it might be unjust." So "Code is Law" is actually a confusion.
      *   *Better Alignment:*
