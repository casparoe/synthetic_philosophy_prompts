      *   *Fuller (Natural Law):* Law has an "inner morality." It's not just about content, but procedure. To be a legal system, rules must meet 8 desiderata (generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence between official action and declared rule). If a system fails these too badly, it's not just bad law, it's *no law at all*.
      *   *Hart's Critique of Fuller:* Fuller's "inner morality" is just efficiency. A poisoner has an inner morality (don't mix incompatible chemicals), but that doesn't make poisoning moral. It's purposive activity, not morality.

