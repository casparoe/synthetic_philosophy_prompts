  ***

  ### Who Got Anscombe Right?

  Naomi is significantly closer to Anscombe's actual position, but both participants miss a crucial wrinkle regarding the **scope and purpose of the pamphlet itself.**

  Naomi correctly captures Anscombe's deontological meta-ethics: the claim that certain acts (like killing innocents) are intrinsically forbidden and cannot be justified by arithmetic. She rightly identifies that Anscombe views the "lesser evil" calculation not as a difficult math problem, but as a category error that signals a rot in moral philosophy.

  However, both Wes and Naomi treat the debate as a general trolley-problem style argument about the bombing itself. They miss that "Mr. Truman's Degree" is specifically an argument about **institutional complicity and honor.** Anscombe's primary target wasn't just Truman (who she assumed was beyond her reach), but Oxford University. Her argument was that by granting the degree, the University was formally testifying that murder is compatible with honor, thereby corrupting the institution's moral authority.

  The missing wrinkle is that Anscombe isn't just arguing about the *act* of bombing, but about the *language games* institutions play to sanitize it. She argues that when a university calls a man who ordered mass killing "honorable," it breaks the link between moral concepts and reality. So while Naomi wins on the ethics of the bombing, both missed Anscombe's sociological point about how moral philosophy enables institutions to lie about what they are doing.
