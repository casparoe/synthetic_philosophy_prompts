answer: |-
  This is one of the sharpest questions in modern decision theory. You have correctly identified that the "Kelly Criterion" sits at the intersection of two very different philosophical frameworks: **Expected Utility Theory (EUT)** and **Ergodicity Economics**.

  The short answer is: **They are talking past each other.** They are answering different questions using different definitions of "rationality."

  However, your suspicion is also correct: **The ergodicity argument does not fully eliminate arbitrariness; it relocates it.** It moves the judgment call from "What is your psychological utility function?" to "What is the relevant observable for your physical survival?"

  Here is the breakdown of why these justifications differ, where they clash, and whether the ergodicity claim holds water.

  ---

  ### 1. The Expected Utility View (The "Preference" Argument)
  **The Logic:**
  In standard neoclassical economics (von Neumann–Morgenstern), rationality is defined as maximizing expected utility: $E[U(W)]$.
  *   If $U(W) = W$ (risk neutral), you bet everything on any positive EV.
  *   If $U(W) = \log(W)$ (log utility), you bet the Kelly fraction.
  *   If $U(W) = -W^{-1}$ (more risk averse), you bet less than Kelly.

  **Samuelson's Critique:**
  Paul Samuelson's famous one-syllable paper ("Why We Should Not Make Mean Log of Wealth Big Though Years to Act Are Long") attacks the idea that Kelly is *asymptotically dominant* for everyone. He argues that even over an infinite horizon, if your true utility function is *not* log (e.g., you care about consumption or have a specific target wealth), maximizing geometric mean growth (Kelly) can actually lower your expected utility compared to a different strategy.

  **The Arbitrariness:**
  In this framework, choosing Log Utility is indeed arbitrary. Why $\gamma=1$ (CRRA coefficient)? Why not $\gamma=2$? It depends entirely on the agent's internal psychology. Kelly is just the optimal strategy for *one specific type of investor*.

  ### 2. The Ergodicity View (The "Physics" Argument)
  **The Logic:**
  Ole Peters and the ergodicity economics crowd argue that EUT makes a category error. It conflates the **ensemble average** (what happens to 1,000 people in parallel universes) with the **time average** (what happens to 1 person over 1,000 days).

  *   **Additive processes** (e.g., gaining \$10 per bet) are ergodic. The time average equals the ensemble average.
  *   **Multiplicative processes** (e.g., betting a % of bankroll) are **non-ergodic**. The ensemble average grows exponentially ($E[W]$), but the typical individual trajectory goes to zero if you bet too much (due to volatility drag).

  **The Derivation:**
  In a multiplicative process, the time-average growth rate $g$ is defined as:
  $$ g = \lim_{T \to \infty} \frac{1}{T} \log \left( \frac{W_T}{W_0} \right) $$
  By the law of large numbers, this converges to $E[\log(1 + f \cdot X)]$.
  Therefore, maximizing the time-average growth rate **mathematically requires** maximizing expected log wealth.

  **The Claim:**
  This isn't about risk aversion. It's about dynamics. If you want to maximize the wealth you actually experience in *your* timeline (rather than the average wealth of a multiverse), you *must* use log. It is presented as an objective physical constraint, not a subjective preference.

  ### 3. Are They Talking Past Each Other?
  **Yes.**
  *   **EUT asks:** "Given my preferences, what should I do?"
  *   **Ergodicity asks:** "Given the dynamics of the system, what *will* happen to me?"

  The Ergodicity camp argues that EUT "risk aversion" is actually just a heuristic people developed to cope with non-ergodicity. They claim you don't *like* log utility; you are *forced* into log behavior by the structure of time and multiplicative dynamics if you want to avoid ruin.

  Samuelson would reply: "Sure, Kelly maximizes your median wealth asymptotically. But if I have a finite horizon, or if I derive utility from consumption along the way, or if I have a utility function that saturates (money stops mattering after \$100M), then Kelly is not optimal."

  ### 4. Does Ergodicity Remove the Arbitrariness?
  This is the crux of your question. The ergodicity proponents claim they have derived the log function from first principles, removing the "arbitrary preference" charge.

  **Where they succeed:**
  They successfully demonstrate that for **multiplicative wealth dynamics**, the ensemble expectation $E[W]$ is physically meaningless for a single agent. If you optimize for $E[W]$, you go bust. Optimizing for time-average growth is the only way to sustain the process. In this specific context (repeated betting with reinvestment), the log is not a preference; it is the correct operator for time-averaging.

  **Where the arbitrariness is relocated:**
  The ergodicity argument hides a value judgment in the choice of the **objective function**.
  1.  **Why maximize growth rate?** Ergodicity assumes the goal is to maximize the long-term exponential growth rate of wealth. But is that your goal? If your goal is to maximize the probability of reaching \$1M before going broke, or to maximize consumption utility over a 40-year horizon, the time-average growth rate is a proxy, not the goal itself. Choosing "growth rate" as the thing to maximize is effectively choosing a utility function.
  2.  **The Infinite Horizon Assumption:** The equivalence between time-average growth and expected log holds strictly as $T \to \infty$. For a sports bot with a finite bankroll and a finite betting horizon, the "time average" is an approximation.
  3.  **The Definition of Wealth:** Ergodicity assumes wealth is the relevant observable. But in EUT, utility is derived from *consumption*, not terminal wealth. If you withdraw profits to pay rent, the dynamics are no longer purely multiplicative.

  So, the arbitrariness moves from **"Why is your utility function log?"** to **"Why is your objective function time-average wealth growth?"**

  ### 5. Practical Implications for Your Bot
  Since you are building a sports-arbitrage bot, here is how you should synthesize this:

  1.  **The Dynamics are Multiplicative:** In sports betting, your bankroll compounds. You are in a non-ergodic regime. Therefore, the Ergodicity critique of "Maximize Expected Value ($)" is correct. Betting full EV on a positive expectation bet will lead to ruin (Gambler's Ruin). You *must* discount for volatility.
  2.  **Kelly is the "Growth Optimal" Benchmark:** The Ergodicity argument successfully proves that Kelly is the unique strategy that maximizes the rate of compounding without ruin. If your goal is "make this bot run forever and grow as fast as possible," Kelly is the mathematical answer, not just a preference.
  3.  **But You Are Not a Log-Utility Robot:**
      *   **Estimation Error:** Kelly assumes you know the true probabilities. In sports betting, you don't. If you overestimate your edge, Kelly betting becomes over-betting, which flips you into negative growth territory very quickly.
      *   **Drawdown Tolerance:** Kelly betting can result in 50% drawdowns. Even if the time-average growth is optimal, the *path* might be psychologically unacceptable to you (or trigger margin calls if you use leverage).

  **The Verdict:**
  The ergodicity argument is stronger than the EUT argument for justifying Kelly in a **repeated investment context** because it grounds the log function in the *dynamics of the system* rather than the *psychology of the agent*.

  However, it is not a "Get Out of Jail Free" card. It assumes your only goal is long-term geometric growth.
  *   If you want **maximum growth**: Full Kelly (theoretically).
  *   If you want **robustness against model error**: Fractional Kelly (e.g., Half-Kelly).
  *   If you want **utility maximization** (where utility $\neq$ log): Something else.

  **Recommendation:**
  Treat the Ergodicity justification as the reason you *don't* bet Expected Value sizing (which leads to ruin), but treat the EUT/Samuelson critique as the reason you *do* use Fractional Kelly. Fractional Kelly effectively acknowledges that while log is the correct growth operator, your utility function might be more concave than log due to estimation risk and finite horizons.

  In short: Ergodicity tells you **why** you need a fractional bet size (non-ergodicity); EUT tells you **which** fraction (your risk tolerance vs. model uncertainty).
