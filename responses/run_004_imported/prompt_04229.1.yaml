          *   **Application to Death:** Tsze-lai accepts death as just another transformation. To demand "I must live" or "I must be a human" is like the metal demanding to be a sword. It's resisting the transformation.
      *   *Resolution:* The "uncanny" part isn't the *result* (being a sword/skillful), it's the *insistence* (the leaping up). If the metal becomes a sword naturally through the founder's work, that's fine. If it *demands* it, that's the problem. Similarly, Cook Ding became skilled by following the Dao, not by forcing his will upon the ox.

  3.  **Deconstruct the Stoic Comparison (Question 2):**
