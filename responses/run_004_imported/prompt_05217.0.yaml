      *   **Best Guess:** He would feel **vindicated in his diagnosis** (AC is the problem) but **skeptical of the cure** (Large Cardinals are too metaphysical). However, he would likely appreciate that Solovay showed AC is *independent*, confirming his suspicion that it wasn't a "logical truth."

