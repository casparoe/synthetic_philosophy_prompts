answer: |-
  **Setting:** *A university coffee lounge, late afternoon. The whiteboard in the corner still bears the payoff structure of the Pasadena game. Elena (The Critic) and Marcus (The Defender) are standing over two mugs of lukewarm coffee.*

  **Elena:** You're smiling, Marcus. I saw you nodding when Hájek finished the proof. But surely you don't buy the conclusion that Expected Value theory survives this intact.

  **Marcus:** I'm smiling because the math is beautiful, Elena. But no, I don't think the Pasadena game sinks the ship. It just tells us we've been sloppy about what constitutes a legitimate gamble description.

  **Elena:** Sloppy? The game is perfectly well-defined. A coin is tossed until heads. Payoff is $(-1)^{n+1} 2^n / n$. The probability is $2^{-n}$. The expectation sum is the alternating harmonic series. It converges to $\ln 2$ *if* you sum in the order of tosses. But as Hájek and Nover showed, that's the tip of the iceberg. The real dagger isn't the Riemann rearrangement theorem. It's the truncation argument.

  **Marcus:** I know the argument. Since the series is only conditionally convergent, not absolutely convergent, the value of the sum depends on the sequence of partial sums used to define the limit. If you approximate the infinite gamble using different sequences of finite sub-gambles—even without reordering the terms—you can force the limit to converge to different values, or diverge.

  **Elena:** Exactly. And that destroys the normative force of Expected Value. If the value of an act depends on how I choose to approximate it, then the act has no value. It's not that the value is infinite, like St. Petersburg. It's that the value is *indeterminate*. If EV theory tells me the value of this game is $\ln 2$, but an equally valid method of calculation says it's $10$, or $-\infty$, then EV theory isn't giving me a criterion for choice. It's giving me a mirror.

  **Marcus:** You're conflating mathematical limits with decision-theoretic evaluation. Look, in decision theory, an act is a mapping from states to outcomes. But the *description* of the act includes the causal structure of how those states are realized. The Pasadena game isn't just a bag of outcome-probability pairs. It's a procedure. Toss 1, then Toss 2, then Toss 3.

  **Elena:** Why does the temporal order of the coin tosses dictate the order of summation for *value*? Value is timeless. If I offer you the game now, the utility you assign to it shouldn't depend on the fact that you have to wait longer to find out the result of toss 10 than toss 1.

  **Marcus:** Because the expectation is an integral over the sample space, and the measure theory we use relies on a filtration. The "natural" truncation sequence—summing from $n=1$ to $N$—corresponds to the information available to the agent as the experiment unfolds. To use a different truncation sequence, like grouping outcomes by magnitude of payoff rather than trial number, is to evaluate a *different* epistemic situation. It's mathematically permissible, but decision-theoretically illegitimate.

  **Elena:** That sounds like an ad-hoc restriction to save the theory. You're saying, "EV theory works, provided you only use the summation order that makes EV theory work." Hájek and Nover's point is that there is no decision-theoretic justification for privileging the temporal truncation. Suppose I bundle the outcomes. I say, "If the game ends on toss 1 or 2, here is the aggregate value. If it ends on 3, 4, or 5, here is the aggregate." As long as my bundles eventually cover the whole space, that's a valid sequence of finite approximations. If those converge to a different limit, why is my bundling "illegitimate"?

  **Marcus:** Because it violates the independence of the trials. When you bundle toss 1 with toss 100 to form a partial sum, you are treating them as a single decision node. But they aren't. The game stops at the *first* heads. You never get to toss 100 if toss 1 is heads. The structure of the stopping rule imposes the order. The partial sums *must* respect the stopping condition. Any truncation that cuts across the stopping rule—like grouping by utility magnitude—ignores the fact that high-utility outcomes might be mutually exclusive with the low-utility ones in a specific temporal sequence.

  **Elena:** But the expectation is calculated *ex ante*. Before the first toss. At that moment, the entire probability space exists. The stopping rule determines the probabilities, yes, but once we have the probability distribution—$P(n) = 2^{-n}$—and the utility function—$U(n) = (-1)^{n+1} 2^n / n$—the temporal process is irrelevant. We are left with a static distribution. And for that static distribution, the expectation is undefined because the integral is not absolutely convergent. You can't smuggle time back in to fix a static valuation problem.

  **Marcus:** I disagree that the process is irrelevant. Consider the St. Petersburg paradox. We accept that the EV is infinite, even though no one would pay an infinite amount to play. We handle that by noting that utility of money is bounded, or by using finite bankrolls. But with Pasadena, you're insisting that because the mathematical integral is conditionally convergent, the *rational preference* is undefined. But rational agents don't calculate Lebesgue integrals. They evaluate prospects based on the description of the prospect. The description says "toss until heads." That description fixes the order.

  **Elena:** Let's press the dominance point, then. Suppose I offer you Game A (Pasadena) and Game B (Pasadena + $1 added to every payoff). Game B dominates Game A. In every possible state of the world, B pays exactly one dollar more than A. Any rational agent should prefer B. But if the EV of A is undefined, and the EV of B is undefined (since adding 1 to each term of a conditionally convergent series still leaves you with conditional convergence issues regarding the summation order), then EV theory cannot recommend B over A. It falls silent.

  **Marcus:** It doesn't fall silent. If you fix the summation order to the natural order, EV(A) is $\ln 2$ and EV(B) is $\ln 2 + 1$. The dominance holds.

  **Elena:** But *why* fix the order? That's the question you keep dodging. If I can construct a truncation sequence for Game B that converges to $\ln 2 - 5$, then EV(B) < EV(A) under that truncation. If EV theory allows *any* valid truncation sequence to determine value, it violates dominance. If EV theory restricts us to *one* sequence, it needs a principled reason why that sequence is the only one that counts. "Because it's temporal" isn't enough. Value isn't temporal.

  **Marcus:** Value isn't temporal, but *choice* is. We are modeling agents who act in time. The "principled reason" is that the agent's commitment to the gamble happens before the tosses, but the realization of the value is bound by the causal structure of the gamble. To evaluate the gamble using a truncation sequence that violates the causal structure is to evaluate a counterfactual game that cannot be played. You're asking me to evaluate a gamble where I can collect the payoff of toss 100 without risking toss 1. That's not the Pasadena game.

  **Elena:** I'm not asking you to play it that way. I'm asking you to *value* it. When I decide whether to accept the gamble, I am not inside the timeline of the tosses yet. I am outside, looking at the whole distribution. If the value I assign changes based on how I partition the sample space for the sake of calculation, then the value is not a property of the gamble. It's a property of my calculator. And decision theory is supposed to tell me about the gamble, not my calculator.

  **Marcus:** But there is no "view from nowhere" for an agent. You are always situated. Even *ex ante*, your description of the act is linguistic and structural. The structure *is* the order. If you accept that the act is defined by its generating process, then the expectation is well-defined as $\ln 2$. The indeterminacy only arises if you insist that an act is merely a set of outcome-probability pairs devoid of structural context. I'm arguing that's a category error.

  **Elena:** And I'm arguing that's a retreat. If EV theory only works when we restrict the domain to "structurally ordered" gambles, then it's not a general theory of rational choice. It's a theory of rational choice for sequential processes with absolute convergence or specific ordering constraints. What about simultaneous risks? What about logical uncertainties? If I face a Pasadena-like structure in a domain without a clear temporal order—say, betting on the digits of pi—your "temporal filtration" defense evaporates.

  **Marcus:** If there's no temporal order, there's no natural truncation sequence, and yes, EV might be indeterminate. But that just means EV theory has limits. It doesn't mean it's broken where it *does* apply. The Pasadena game is a pathological case designed to exploit the gap between conditional and absolute convergence. Most real-world decisions don't involve conditionally convergent utility series.

  **Elena:** "Most" isn't enough for a foundational theory. And it's not just pathology. The lesson is that linearity of expectation fails here. If we can't sum expectations, we can't separate complex decisions into parts. That cripples the whole framework. We need a replacement. Maybe something based on stochastic dominance, or a non-Archimedean utility framework. We can't just patch EV by saying "don't sum it that way."

  **Marcus:** Stochastic dominance has its own problems with infinite states. And non-Archimedean utilities introduce their own paradoxes. Look, Elena, the Pasadena game shows that infinite gambles are tricky. But it doesn't show that EV is wrong. It shows that we must treat infinite expectations as limits of finite ones, and the *relevant* finite ones are determined by the act's description. If you reject that, you aren't fixing decision theory; you're rejecting the idea that the description of an act matters for its evaluation.

  **Elena:** I reject that the *mathematical method of approximation* should matter for the *value*. If two methods are mathematically valid for the distribution provided, and they yield different values, the distribution does not determine the value. And if the distribution doesn't determine the value, Expected Value theory has failed to provide a decision criterion. It's that simple. You're defending a rule that gives different answers to the same question depending on how you ask it.

  **Marcus:** And you're demanding a rule that gives an answer to a question that hasn't been fully asked until the structure of the gamble is specified. The "same question" isn't being asked. "Sum this series" is different from "Evaluate this sequential gamble." The Pasadena game is the latter. The series is just a representation. Don't confuse the map for the territory.

  **Elena:** Then the map is useless if it changes when I rotate it.

  **Marcus:** Then don't rotate it. Read the legend.

  **Elena:** *(Sighs, picking up her mug)* We're going to need more coffee. And probably a new axiom.

  **Marcus:** *(Smiling)* Or just a better understanding of the old ones.

  **Elena:** We'll see. But I'm not betting on $\ln 2$.

  **Marcus:** At those odds? Neither am I.
