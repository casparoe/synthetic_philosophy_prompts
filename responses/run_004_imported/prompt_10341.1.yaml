      *Actually, looking closely at Hájek & Nover (2006):* They argue that the expectation is undefined because the series is not absolutely convergent. The "truncation" point is that the standard definition of expectation for infinite discrete spaces relies on absolute convergence to be independent of the ordering. If you define EV as $\lim_{N \to \infty} \sum_{n=1}^N p_n u_n$, you get $\ln 2$. But there is no decision-theoretic justification for privileging that specific sequence of partial sums over any other exhaustive sequence of finite subsets.
