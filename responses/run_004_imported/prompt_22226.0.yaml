      *   *Relevance Logic Specifics:* Anderson & Belnap cared about *meaning connection*. For them, $A \land \neg A \vdash B$ fails because $B$ has nothing to do with $A$. They generally hold a classical view of truth (no true contradictions). They are "compatibilists" or just classical logicians who think the standard account of validity is flawed.
      *   *Priest's View:* Priest *needs* LP because he believes the Liar is true and false. He *is* a dialetheist.
      *   *The "Commitment" Argument:* Adopting a logic means adopting its validity claims. It does not mean adopting the truth of its antecedents.
