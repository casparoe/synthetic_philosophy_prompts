      *   **Paraconsistency:** A property of a consequence relation. A logic is paraconsistent if $\{A, \neg A\} \not\vdash B$ for arbitrary $B$. It means the logic *tolerates* inconsistency without triviality. It does *not* assert that inconsistencies *exist*.
      *   **Dialetheism:** A metaphysical/semantic thesis. There are true contradictions (some $A$ is both true and false). Priest is the main proponent.
