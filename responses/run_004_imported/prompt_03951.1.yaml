  The standard rejoinder to the money-pump argument—that a sophisticated agent using backward induction (BI) will foresee the loss and refuse the initial trade—relies on a subtle but fatal equivocation regarding the **structure of choice**. It assumes the agent can choose between *entire sequences* of outcomes (a "plan") rather than choosing between *acts* at each decision node. I argue that if we hold the agent to the standard decision-theoretic requirement of **Separability** (that choices at a node should depend only on the subtree rooted at that node), foresight cannot save them. A cyclic agent who respects Separability is dynamically inconsistent in a way that makes the "refusal plan" unstable, compelling them to walk into the pump even with full knowledge of the sequence.

  ### The Scheme: The Unidirectional Pump with Separability Constraints

  Consider the standard cycle: $A \succ B \succ C \succ A$.
  The agent starts with $A$. The market offers three sequential trades:
  1.  **Node 1:** Trade $A$ for $C$.
  2.  **Node 2:** Trade $C$ for $B$.
  3.  **Node 3:** Trade $B$ for $A - \$1$ (where $\$1$ is small enough that $A - \$1 \succ B$).

  **The Standard Rejoinder (Sophisticated Choice):**
  The agent reasons backward:
  *   At Node 3: Choice is between $B$ and $A - \$1$. Since $A \succ B$, then $A - \$1 \succ B$. **Action: Accept.**
  *   At Node 2: Choice is between $C$ and the Node 3 outcome ($A - \$1$). Since $C \succ A \succ A - \$1$, then $C \succ A - \$1$. **Action: Refuse.**
  *   At Node 1: Choice is between $A$ and the Node 2 outcome ($C$). Since $C \succ A$. **Action: Accept.**
  *   **Result:** The agent accepts Node 1, refuses Node 2, and ends with $C$. Since $C \succ A$, they have not lost money; they have gained. The pump is blocked.

  **The Counter-Argument: The Instability of the Refusal Plan**
  The rejoinder above fails because it violates **Separability** (or Dynamic Consistency). Separability requires that if a plan is optimal at Node 1, the actions prescribed by that plan must also be optimal at Node 2 *if Node 2 is reached*.

  Let's trace the reasoning of a truly Separable agent who attempts to use foresight:
  1.  **At Node 1:** I consider the plan "Accept 1, Refuse 2". This leads to outcome $C$. Since $C \succ A$, this plan looks better than "Refuse 1" (Outcome $A$). So, I form the intention to **Accept 1**.
  2.  **At Node 2 (Reached):** I now hold $C$. I must choose between keeping $C$ or trading for $B$ (which leads to Node 3).
      *   If I Refuse: Outcome $C$.
      *   If I Accept: I go to Node 3. At Node 3, I will face $B$ vs $A - \$1$. Since $A \succ B$, I will Accept Node 3. Outcome $A - \$1$.
      *   So the choice at Node 2 is effectively $C$ vs $A - \$1$.
      *   Since $C \succ A \succ A - \$1$, I prefer $C$.
      *   **Action:** I **Refuse** Node 2.
  3.  **The Contradiction:** My action at Node 2 (Refuse) is consistent with my plan at Node 1. So I end with $C$.
      *   *Wait, this blocks the pump.* To get the pump, I must show they Accept Node 2.
      *   *How?* By showing that the **preference at Node 2** changes or that the **plan itself** is not credible.

  **The Exploit: The "Re-Optimization" Trap**
  The vulnerability lies in the fact that for a cyclic agent, **preferences over outcomes are not stable across the decision tree.** The standard rejoinder assumes that at Node 2, the agent compares $C$ to $A - \$1$. But a Separable agent does not compare outcomes; they compare **acts**.

  At Node 2, the available acts are "Keep $C$" and "Trade for $B$".
  *   Preference: $B \succ C$ (from the cycle).
  *   A Separable agent *must* choose the act that yields the preferred immediate outcome, ignoring the downstream consequences that depend on future choices (because future choices are separate decisions).
  *   If the agent respects Separability, they cannot use the Node 3 outcome ($A - \$1$) to evaluate the Node 2 act "Trade for $B$". They must evaluate "Trade for $B$" based on the value of $B$.
  *   Since $B \succ C$, a Separable agent **Accepts** at Node 2.
