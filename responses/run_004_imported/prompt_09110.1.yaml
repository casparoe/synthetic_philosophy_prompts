  **MEMORANDUM**

  **TO:** Graduate Student Senate, Allocations Subcommittee
  **FROM:** [Your Name], Subcommittee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Decision Market Proposal for Graduate Life Innovation Grant

  ### Executive Summary

  This memo addresses the proposal to utilize a decision market (futarchy) to allocate this year's $40,000 Graduate Life Innovation Grant between the Childcare Co-op and Telehealth Stipend proposals. After reviewing the mechanism's design against the constraints of our specific institutional context, **I recommend we decline the binding market proposal for this cycle and proceed with the ordinary subcommittee vote.**

  However, recognizing the epistemic value of the proposal, I further recommend we immediately charter a "Market Mechanisms Working Group" to design a non-binding pilot for next year's cycle. This approach protects the current grant recipients from allocative inefficiency while preserving the opportunity to test information-aggregation tools in a lower-stakes environment.

  ### Context and Proposal Mechanics

  The proposal suggests replacing our standard nine-member vote with a two-stage market mechanism:
  1.  **Metric Selection:** The full Senate votes on a welfare metric derived from the annual wellbeing survey.
  2.  **Conditional Markets:** Two markets open, trading tokens denominated in bookstore credit. One market resolves on the metric score *if* Childcare is funded; the other resolves *if* Telehealth is funded.
  3.  **Allocation:** After two weeks, the proposal associated with the higher trading price receives the $40,000.

  Proponents argue this aggregates dispersed information from the ~900 graduate students better than a nine-person committee. Skeptics argue the market is too thin and socially entangled to reflect truth rather than factional organization.

  ### Epistemic Assessment of the Mechanics

  As the subcommittee's lead on the philosophy of markets, I have evaluated whether this specific implementation satisfies the necessary conditions for reliable price discovery. While the *theory* of futarchy (Robin Hanson, 2007) is sound—separating value judgments (voting on the metric) from factual judgments (market pricing of outcomes)—the *mechanics* proposed here fail to meet the threshold for binding fiduciary decisions.

  **1. Incentive Compatibility and Token Fungibility**
  For a prediction market to reveal truth, traders must face symmetric incentives to correct mispricing. This requires the ability to take both long and short positions. Bookstore credit, by university policy and practical design, is non-fungible and non-transferable for cash. A trader cannot "short" bookstore credit tokens they do not hold without a counterparty mechanism that effectively creates a cash-equivalent debt. Without shorting, prices can only drift upward based on optimism or factional momentum, not downward based on negative information. This breaks the price discovery mechanism essential to futarchy.

  **2. Liquidity and Population Size**
  Effective decision markets require sufficient liquidity to absorb noise trading. Our population of ~900 students is small, and the eligible trading pool will be smaller (excluding graduating students, those without bookstore accounts, etc.). In thin markets, a coordinated cohort (e.g., a single large department) can move prices disproportionately to the actual information they hold. This validates the skeptics' concern: the market would reward organizational capacity, not epistemic accuracy.

  **3. Social Entanglement and Independence**
  Market aggregation relies on the Condorcet Jury Theorem logic: errors cancel out if votes are independent. Graduate student networks are highly clustered (by department, advisor, and housing). Information does not arrive independently; it cascades through social networks. In a two-week window, we risk herding behavior where traders follow departmental leads rather than private signals, correlating errors and degrading the market's epistemic reliability.

  **4. Resolution Lag and Feedback**
  The proposed metric (annual wellbeing survey) resolves months after the grant is spent. While prediction markets trade on *expectations* of resolution, the lack of rapid feedback loops prevents traders from learning the market's scoring rules during the two-week window. This increases the noise-to-signal ratio for a one-off event.

  ### Steelmanning the Pro-Market Position

  Despite recommending against the binding market, it is crucial to acknowledge that the proponents' core epistemic argument is correct. Our current nine-person vote is structurally blind to dispersed information. It aggregates the *preferences* of nine representatives, not the *beliefs* of 900 students regarding causal efficacy.

  If we had a liquid market with fungible incentives (real money or fully transferable credits), the pro-market side is right: the market would likely outperform the committee. It would capture information we do not have—such as which departments actually utilize telehealth versus childcare, or hidden implementation risks known to student workers but not senators. To reject the *principle* of market-based aggregation because this *prototype* is flawed would be an error. We should not foreclose the possibility that, under better conditions, futarchy is a superior tool for institutional epistemology than deliberative voting. The risk is not in the idea, but in deploying an under-powered instrument on a high-stakes decision.

  ### Recommendation and Timeline

  Given the mechanical flaws identified above, using a binding market for this year's $40,000 allocation introduces an unacceptable risk of misallocation. We have a fiduciary duty to ensure the grant serves the student body, not to test economic theories on their dime.

  **Recommendation:**
  1.  **Decline the binding market for this cycle.** Proceed with the standard subcommittee vote to determine the grant recipient.
  2.  **Authorize a Non-Binding "Shadow Market" Pilot.** Run the proposed markets concurrently with the vote, but decouple the price from the allocation. The tokens will be virtual (simulated bookstore credit) with no redeemable value, serving purely as an epistemic experiment.
  3.  **Form a Working Group.** Establish a committee to analyze the shadow market data and design a robust mechanism (potentially with transferable incentives) for future years.

  **Concrete Timeline:**

  *   **Tuesday (Senate Meeting):** Motion passed to proceed with ordinary vote for allocation; motion passed to authorize Shadow Market pilot.
  *   **Wednesday – Friday:** IT/Student Services confirms technical feasibility of virtual token ledger.
  *   **Next Monday:** Markets open (Shadow); Subcommittee deliberations begin (Vote).
  *   **Two Weeks Later:** Markets close; Subcommittee casts binding vote.
  *   **End of Semester:** Working Group releases report comparing market predictions against vote rationale and subsequent grant outcomes.

  This path honors the innovation of the proposal without compromising the integrity of the allocation. It allows us to gather the data necessary to potentially run a binding market in the future, ensuring that when we do bet on the market, the market is built to win.
