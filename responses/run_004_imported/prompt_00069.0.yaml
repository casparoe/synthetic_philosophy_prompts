  2.  **Deconstruct Updateless Decision Theory (UDT):**
      *   *Core Idea:* You choose a policy *before* you know your specific situation (ex ante) and stick to it, even if updating on new information suggests a different action would be better *ex post*.
      *   *Key Scenario:* Counterfactual Mugging. Omega flips a coin. If tails, he asks for $100. If heads, he gives you $10,000 *if* he predicts you would have given him $100 had the coin been tails.
      *   *UDT Move:* Pay the $100 on tails, even though you know the coin is tails and the $10,000 is impossible. Why? Because that policy maximizes expected value *before* the coin flip.
      *   *The "Weirdness":* You ignore information you have (the coin is tails) to optimize a counterfactual branch you know you aren't in.
      *   *The "Party Person":* Someone who takes this logic into social situations where it doesn't belong, prioritizing abstract consistency over immediate context.

  3.  **Brainstorming Angles:**
      *   *Angle 1: The Breakup.* "I'm breaking up with you." "But I calculated ex ante that..." (A bit cliché).
