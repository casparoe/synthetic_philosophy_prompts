answer: |-
  One of you asked last week if Updateless Decision Theory just means "never learning from experience."

  I think a better way to put it is: UDT means learning from experience, but refusing to let it change your mind.

  You know you're dealing with a UDT evangelist at a party when they try to split a dinner bill *after* you've already paid.

  You say, "Dude, I already swiped my card. The transaction is complete."

  And they say, "I know. But I can't condition on that observation. I have to execute the policy I precommitted to before I walked into the restaurant."

  You ask, "Which is?"

  They say, "Always pay for half the meal. Because in the counterfactual where you didn't bring your wallet and Omega is testing my reciprocity, that's the only way to unlock the free lifetime supply of appetizers."

  "So you're paying for nothing?"

  "Not nothing," they say, handing you $50. "I'm paying for the counterfactual version of me who forgot his wallet. He's going to need this."

  Then they spend the next forty-five minutes explaining to the waiter why their tip is logically necessary for the multiverse's expected utility, even though the service was terrible.
