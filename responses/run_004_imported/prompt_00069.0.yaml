prompt: |-
  I'm TAing an intro decision theory seminar, and last week we spent a painful two hours on updateless decision theory (UDT) and why it's supposed to outperform causal and evidential decision theory on problems like counterfactual mugging. Half the class left more confused than when they walked in, and one student asked if UDT just means "never learning from experience," which, fair enough, is not a totally unreasonable misreading. I want to end this week's section on a lighter note.

  Write a joke about updateless decision theory that would actually land with someone who understands the distinction between updating your policy versus updating your beliefs, and who gets why a UDT agent commits ex ante to a strategy rather than recomputing its choice after receiving new information. The humor should hinge on some real, specific feature of UDT (e.g., its relationship to precommitment, its weirdness around counterfactual mugging or Newcomb's problem, or its refusal to condition on being told which "branch" of a decision problem it's in) rather than just being a generic joke about robots or rationality. Bonus points if it could also gently roast the kind of person who brings up UDT unprompted at parties.
