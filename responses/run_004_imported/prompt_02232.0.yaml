  2.  **Deconstruct Harsanyi's Aggregation Theorem:**
      *   **What does it actually say?** If individuals and society satisfy the von Neumann-Morgenstern (vNM) axioms (rationality/EUT) over a set of lotteries, and if society respects the Pareto principle (if everyone prefers A to B, society prefers A to B; if everyone is indifferent, society is indifferent), then the social welfare function ($W$) is a linear combination of individual utility functions ($u_i$).
      *   **Formula:** $W = \sum a_i u_i + b$.
      *   **Key Constraint:** The weights ($a_i$) must be non-negative.
      *   **Crucial Detail:** The theorem *does not* specify what the weights ($a_i$) are. It allows for *any* non-negative weights. It does *not* force equal weights ($a_i = 1$ for all $i$).

  3.  **Address the "Equal Weights" Claim:**
      *   The reading group claims the theorem forces "everyone's utility counts equally."
      *   *Correction:* Harsanyi's theorem allows for weighted utilitarianism. To get equal weights, you need an additional ethical axiom (like Anonymity or Symmetry: swapping utilities between people shouldn't change the social ranking).
      *   *Conclusion:* The group is wrong about equal weights being a mathematical necessity of the theorem itself. That's a normative add-on.

  4.  **Address the "Prioritarianism is Inconsistent" Claim:**
      *   **Prioritarianism:** Giving extra weight to the worse off. Usually modeled as a concave transformation of utility (e.g., $\sum \sqrt{u_i}$ or $\sum f(u_i)$ where $f$ is concave).
      *   **Harsanyi's Constraint:** Social utility must be linear in individual *utilities*.
      *   **The Catch:** This depends entirely on how "individual utility" is defined and measured.
      *   **vNM Utilities:** Harsanyi works with vNM utilities, which are unique only up to positive affine transformations ($u' = au + b$). They capture risk attitudes.
      *   **Prioritarianism & Risk:** Prioritarianism is often motivated by risk-free contexts or specific views on distributive justice. However, if we are talking about *ex ante* prioritarianism vs. *ex post* prioritarianism under uncertainty, things get tricky.
      *   **The Real Conflict:** Harsanyi's theorem assumes the *same* domain of lotteries for individuals and society. If individuals are risk-neutral but society is risk-averse regarding distribution (prioritarian), does that violate the linearity condition?
      *   **Diamond's Critique:** Peter Diamond (1967) showed that if you care about the *distribution* of outcomes (equity), you might violate the Pareto principle or the Independence axiom as applied to social choice.
      *   **Is Prioritarianism "Mathematically Inconsistent"?** No. It requires rejecting or modifying one of Harsanyi's premises. Usually, prioritarians reject the idea that social welfare must satisfy the vNM axioms *in the same way* individuals do, or they reject the Pareto principle when it conflicts with equity (e.g., preferring a certain equal outcome over a lottery that gives a higher expected sum but risks inequality).
      *   **Specific Rebuttal:** Prioritarianism can be consistent if you define the "individual utility" differently (e.g., as welfare levels rather than vNM utilities) or if you accept that social choice violates the Independence axiom (which Harsanyi requires). Claiming it's a "mathematical error" is a category mistake; it's a disagreement on axioms.

