      *   **Point 3: The Axioms.** Prioritarianism usually conflicts with the Pareto principle *under uncertainty* (ex-ante vs. ex-post) or the Independence axiom. It's not "inconsistent" math; it's a choice to prioritize equity over strict Pareto efficiency in lotteries.
      *   **Point 4: Harsanyi's Own View.** Harsanyi distinguished between "manifest preferences" and "true preferences" (behind a veil of ignorance). The theorem is often conflated with his Veil of Ignorance argument (which *does* argue for equal weights via symmetry), but the Aggregation Theorem itself is distinct.

