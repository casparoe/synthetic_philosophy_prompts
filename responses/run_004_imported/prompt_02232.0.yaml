answer: |-
  Your intuition is spot on. Your reading group is significantly overselling what Harsanyi's Aggregation Theorem proves, and their claim that prioritarianism is a "mathematical error" is a category mistake.

  While Harsanyi's theorem is a powerful result in social choice theory, it does not do the heavy ethical lifting your group members claim it does. Here is a breakdown of where their argument goes wrong, which should give you the ammunition you need to push back.

  ### 1. The Theorem Does Not Force Equal Weights
  The most glaring error in your group's explanation is the claim that the theorem forces **equal** weights.

  **What the theorem actually says:**
  If individuals and society satisfy the von Neumann-Morgenstern (vNM) axioms of rationality (completeness, transitivity, continuity, and independence) over a set of lotteries, and if society satisfies the **Pareto Principle** (if everyone prefers $X$ to $Y$, society prefers $X$ to $Y$), then the social welfare function ($W$) must be a **linear combination** of individual utility functions ($u_i$).

  Mathematically:
  $$W = \sum_{i=1}^{n} a_i u_i + b$$
  Where $a_i \geq 0$.

  **The Problem:**
  The theorem allows for **any** non-negative weights ($a_i$). It permits a dictator (where one $a_i > 0$ and the rest are 0), it permits weighted utilitarianism (where some people count more than others), and it permits classical utilitarianism (where all $a_i$ are equal).

  To get **equal weights** ($a_i = a_j$ for all $i, j$), you must add an additional ethical axiom, usually called **Anonymity** or **Symmetry**. This axiom states that the social ranking should not change if you swap the utility levels of two individuals. That is a normative ethical assumption, not a mathematical consequence of the aggregation theorem itself.

  **Takeaway:** Harsanyi proves you must be a *weighted* utilitarian, not necessarily an *equal-weight* utilitarian. The move to equal weights requires a separate moral argument.

  ### 2. Prioritarianism Is Not "Mathematically Inconsistent"
  Your group claims that prioritarianism (giving extra weight to the worse off) is formally inconsistent. This is false. Prioritarianism is incompatible with Harsanyi's *axioms*, but rejecting an axiom is not a mathematical error; it is a theoretical choice.

  **The Conflict:**
  *   **Harsanyi:** Requires social welfare to be linear in individual utilities ($W = \sum u_i$).
  *   **Prioritarianism:** Typically defines social welfare as a sum of a concave transformation of utilities ($W = \sum f(u_i)$, where $f$ is concave).

  If you try to plug a prioritarian function into Harsanyi's framework, it violates the **Pareto Principle** (specifically the ex-ante version) or the **Independence Axiom** under uncertainty.

  **Why it's not an error:**
  Prioritarians (like Derek Parfit or Alex Voorhoeve) explicitly argue that we *should* violate strict Pareto efficiency in certain lottery cases to account for fairness.
  *   *Example:* Imagine a lottery that gives Person A 100 utility and Person B 0 utility, versus a sure thing where both get 40. A strict vNM utilitarian might prefer the lottery if the expected sum is higher. A prioritarian might prefer the sure thing to avoid the risk of someone ending up destitute.
  *   Harsanyi's theorem says: "If you want to satisfy Pareto and vNM rationality, you can't do that."
  *   The Prioritarian says: "I am willing to relax the requirement that social choice must mirror individual vNM rationality in that specific way."

  Claiming this is a "mathematical error" is like saying Non-Euclidean geometry is an error because it rejects Euclid's parallel postulate. It's a different system built on different premises, not a calculation mistake within Harsanyi's system.

  ### 3. Confusion Between Two Harsanyi Arguments
  Your reading group seems to be conflating two distinct arguments made by John Harsanyi in his 1955 papers:

  1.  **The Aggregation Theorem:** (Discussed above). Takes existing individual preferences and asks how to aggregate them. Result: Weighted Utilitarianism.
  2.  **The Veil of Ignorance Argument:** Asks what preferences you would have if you didn't know who you were in society. Result: Because you have an equal probability of being anyone, you maximize average utility (Equal-Weight Utilitarianism).

  Your group is using the **Aggregation Theorem** (which doesn't require a veil of ignorance) to claim the result of the **Veil of Ignorance** argument (equal weights).

  Even the Veil of Ignorance argument is controversial. It relies on the **Principle of Insufficient Reason** (assigning equal probability to being any person), which many decision theorists and philosophers reject as unjustified. So even the argument that *does* try to derive equal weights rests on a contested probabilistic assumption, not pure logic.

  ### 4. The "Utility" Measurement Problem
  There is a deeper technical issue regarding what $u_i$ represents.
  In Harsanyi's theorem, $u_i$ are **vNM utilities**, which encode risk attitudes.
  *   If individuals are risk-averse, their $u_i$ is already concave over wealth.
  *   If you sum these risk-averse utilities, you are already building in some sensitivity to the "worse off" (because a dollar is worth more to a poor person in their utility function).

  Prioritarianism usually wants to add a *second* layer of concavity (social risk aversion over distribution) on top of individual risk aversion. Harsanyi's theorem blocks this second layer *if* you insist the social planner must satisfy the Independence Axiom over the same lotteries. But again, blocking it via axioms doesn't make the ethical desire for that second layer "inconsistent"; it just means the prioritarian rejects the Independence Axiom for social choice (a position defended by philosophers like John Broome and Larry Temkin).

  ### Summary for Your Reading Group
  Here is how you can frame your pushback:

  1.  **Weights:** "Harsanyi's Aggregation Theorem only proves social welfare is a *linear combination* of individual utilities. It allows for arbitrary non-negative weights. To get equal weights, we need to add an **Anonymity Axiom**, which is a normative ethical claim, not a mathematical derivation."
  2.  **Prioritarianism:** "Prioritarianism isn't mathematically inconsistent; it is **axiomatically incompatible** with Harsanyi's specific set of constraints (specifically the combination of Pareto and Independence). Prioritarians argue that equity considerations justify violating the Independence Axiom in social choice. That's a philosophical disagreement, not a math error."
  3.  **Conflation:** "It seems like we are mixing up the Aggregation Theorem with Harsanyi's Veil of Ignorance argument. The Aggregation Theorem doesn't assume ignorance, so it can't derive equal moral weight on its own."

  **Verdict:** You are not missing anything. Your group is engaging in a bit of "physics envy," trying to derive an 'ought' entirely from an 'is' (or a 'must'). Harsanyi provides a powerful framework for utilitarianism, but it does not eliminate the need for ethical argumentation regarding weights and distribution.
