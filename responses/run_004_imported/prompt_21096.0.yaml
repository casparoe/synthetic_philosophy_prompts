answer: |-
  This is a perfect real-world example of **distributive justice**, which is basically the core question of political philosophy: *How should benefits and burdens be distributed in a society (or in this case, a group)?*

  You are currently living inside a tension between **Libertarianism** and **Egalitarianism**. Here is how you can map your friend group's fight onto the syllabus you're studying.

  ### 1. Jake's Argument: Libertarian Entitlement
  Jake is arguing from a position very similar to **Robert Nozick's Entitlement Theory**.

  *   **The Core Idea:** Holdings (money) are just if they are acquired through voluntary exchange without force or fraud.
  *   **The Application:** The viewers voluntarily chose to give Jake money. No one coerced them. Jake provided a service (entertainment/humor) and was compensated for it. For the group to take that money would be a violation of his self-ownership and the viewers' freedom to spend their money where they choose.
  *   **The Philosophy:** To Jake, the tips aren't "revenue" generated by the channel; they are personal gifts based on his specific performance. Redistributing them is essentially theft.

  ### 2. The Friends' Argument: Rawlsian Fairness
  The two friends wanting to pool the tips are arguing from a place closer to **John Rawls** or **Luck Egalitarianism**.

  *   **The Veil of Ignorance:** Rawls asks us to design a system without knowing where we will end up in it. If you four had sat down *before* starting the channel, not knowing who would be the "funny one," would you have agreed that the funny person keeps 100% of the tips? Probably not. You likely would have chosen a system that protects the least advantaged (the less funny streamers).
  *   **Moral Luck:** Being "funnier live" is largely a natural talent or a personality trait. Philosophers like Thomas Nagel call this "constitutive luck." Did Jake *work* harder to be naturally charismatic? If his higher income is based on innate talent rather than extra hours worked, do the others have a claim to that "unearned" advantage?
  *   **The Collective Brand:** The friends might argue that Jake only gets tips *because* the channel exists. If he streamed alone on a channel with zero viewers, he'd get zero tips. The group provides the "means of production" (the channel/audience), so the surplus value (tips) generated by that platform should belong to the collective.

  ### 3. The "Social Contract" Ambiguity
  You mentioned the original agreement: *"split all ad revenue evenly... since we all put in about the same amount of work."*

  This is your **Social Contract**. The conflict exists because the contract is incomplete.
  *   **Interpretation A (Jake):** The contract specifies *ad revenue*. Tips were not mentioned. Therefore, tips fall outside the social contract and remain private property.
  *   **Interpretation B (Friends):** The spirit of the contract was "equal pay for equal work." Since you all work the same amount, the total compensation (Ads + Tips) should be equal. The distinction between "ad revenue" and "tips" is just a technicality of the Twitch interface, not a moral distinction in labor.

  ### How to Resolve It (Philosophically)
  Since you're in a philosophy class, you can propose a compromise that synthesizes these views:

  1.  **The "Tax" Compromise (Social Democracy):** You keep the individual tipping (respecting Jake's liberty and incentive to be funny), but you agree to a "tax" (e.g., 50% of tips go into a pool). This acknowledges Jake's individual contribution while recognizing the collective platform that enabled it.
  2.  **The "Reinvestment" Compromise (Utilitarianism):** Instead of splitting the tips personally, all tips go into a group fund used to upgrade equipment, buy better games, or run ads to grow the channel. This maximizes the good for the whole group without directly taking money from Jake's pocket for someone else's rent.
  3.  **The "Merit" Adjustment (Meritocracy):** If Jake is genuinely carrying the channel, maybe the ad-revenue split *should* change. If the philosophy is "pay according to contribution," and Jake contributes more viewers, maybe he gets 40% and the rest get 20%. (Though this risks resentment).

  ### The Verdict?
  Philosophically, **neither side is objectively "right."**
  *   Jake is right that **process matters** (the tips were given freely).
  *   The friends are right that **outcomes matter** (the inequality creates resentment and relies on luck).

  **For your class:** This is a goldmine. You can write a paper on this. Use Nozick to defend Jake and Rawls to defend the friends.
  **For your friend group:** The danger isn't who is philosophically correct; it's that the inequality is destroying group cohesion. In political philosophy, when a system creates enough resentment, the "state" (your group) becomes unstable. You might need to renegotiate the Social Contract to save the friendship, regardless of who is "right."
