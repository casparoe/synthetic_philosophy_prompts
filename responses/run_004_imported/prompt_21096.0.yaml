prompt: |-
  so i'm in a political philosophy class this semester and something with my friend group has been bugging me, feels connected to stuff we're covering but i can't quite place it. me and three friends run a small twitch channel together and agreed early on to split all ad revenue evenly, 25% each, since we all put in about the same amount of work, and everyone's still totally fine with that part. the wrinkle is viewers can also send tips straight to whichever streamer they want during a stream, and it turns out most people tip my friend jake specifically bc he's way funnier live than the rest of us. over the past year jake's ended up with way more total money than any of us, purely from tips, even though the ad-revenue split has stayed exactly even the whole time. now two of the other guys want to start pooling all tips too and splitting those evenly, saying the setup's become unfair. jake says nobody's forcing viewers to tip him over us, so he hasn't done anything wrong and shouldn't have to give any of it up. i kinda see both sides though - is jake right that this is fine since it all came from people's free choices, or do the other two have a real case that it needs fixing?
