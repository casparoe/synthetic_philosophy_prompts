answer: |-
  **Setting:** *A coworking space in Berkeley, 11:30 PM. The whiteboard is covered in half-erased probability trees and a very crisp equation: $W_N = W_0 (1+f)^H (1-f)^T$. Two laptops are open, screens glowing. Empty coffee cups abound.*

  **Characters:**
  *   **Alex:** Proponent of Ergodicity Economics and Geometric Rationality.
  *   **Blake:** Hardnosed Expected-Utility Bayesian.

  ***

  **Alex:** (Tapping the marker against the 20% written in the corner of the board) Look, the math isn't ambiguous. If you bet more than 20% on this 60/40 coin over a thousand rounds, your wealth converges to zero. Almost surely. If you bet less, you leave growth on the table. The geometric growth rate is maximized *here*.

  **Blake:** (Leaning back, arms crossed) I'm not arguing the math, Alex. I'm arguing the metaphysics. You're acting like you've discovered a new law of rationality. You haven't. You've just rediscovered that some people have logarithmic utility functions.

  **Alex:** That's the Samuelson objection. "It's just log utility." I know. But that dismissal misses the point. Samuelson was writing about preferences. I'm talking about the structure of the process. This isn't about whether I *like* money less as I get more. It's about the fact that the ensemble average—the expected value across parallel universes—does not equal the time average for this specific dynamic.

  **Blake:** Okay, let's steelman that. You're saying non-ergodicity breaks vNM (von Neumann-Morgenstern). But vNM doesn't claim to describe physics. It describes coherent preferences. If I say, "I want to maximize the arithmetic expected value of my bankroll," that is a valid utility function. If that leads me to bet 100% and go bust in 99.9% of timelines, well, I got the 0.1% where I own the universe. That's a preference, not a rationality error.

  **Alex:** But that preference is physically incoherent in a single-universe timeline! Look at the board. $1.2^{600} \times 0.8^{400}$. That's the typical outcome. The arithmetic expected value is driven by the astronomically unlikely paths where you get 800 heads. Those paths have measure near zero in the time domain. By telling an agent to maximize ensemble average, you're telling them to optimize for a future that *will not happen to them*. Is rationality about optimizing for ghosts?

  **Blake:** (Stands up, walks to the board) It's not about ghosts. It's about pricing. If you have a utility function $U(w) = w$, you *should* bet 100%. If you don't, it's because you actually have $U(w) = \ln(w)$. The "Ergodicity Economics" move is to take the physical dynamics (multiplicative wealth) and hard-code them into the definition of rationality, rather than leaving them in the agent's utility function. But why? Why is log utility the "rational" default?

  **Alex:** Because it's the only utility function that makes the agent's behavior invariant to the time horizon in a multiplicative world. If you maximize arithmetic EV, your optimal bet changes depending on how many rounds you play. If you maximize geometric growth, 20% is optimal for 10 rounds, 1,000 rounds, or infinite rounds. It's the stable fixed point. And it's not just betting.

  **Blake:** Here we go. The "Geometric Rationality" grand unification theory.

  **Alex:** (Smiles) Hear me out. It shows up in Nash Bargaining. The Nash solution maximizes the product of gains, which is the geometric mean. It shows up in forecasting. If you want to aggregate probabilities from experts to minimize log loss, you geometrically pool their odds, you don't average them linearly. There's a pattern here. It suggests that when information or resources combine multiplicatively, the geometric mean is the natural operator. Calling it "just log utility" ignores that this structure appears in bargaining and epistemology, where "utility" isn't even the frame.

  **Blake:** I'll grant you the forecasting point. Geometric pooling of odds is robust against manipulation in ways arithmetic pooling isn't. I think that's because log loss is the proper scoring rule for Bayesian updating. But that circles back to Bayes, not ergodicity. You're conflating *instrumental* convergence with *normative* rationality.
  Look, if I'm a causal decision theorist, I care about the consequences of my actions. In a many-worlds interpretation, the ensemble average *is* real. All those branches exist. If I'm betting on quantum outcomes, maximizing arithmetic EV might actually be the right move for the "multiverse total."

  **Alex:** But you don't live in the multiverse. You live on one branch. Ergodicity economics says: stop pretending you're an ensemble. When the process is non-ergodic, the expectation operator $\mathbb{E}[\cdot]$ is the wrong tool. You need the time-average growth rate operator. It's not that you're risk-averse; it's that the system is leaky. Volatility drag is a physical tax.

  **Blake:** "Volatility drag" is just a nickname for the convexity of the log function. Jensen's Inequality. $\mathbb{E}[\ln(X)] \leq \ln(\mathbb{E}[X])$. The "drag" is the gap between those two. You're reifying the gap as a physical force to motivate a new rationality framework. But ultimately, to choose the time average over the ensemble average, you need a *reason*. That reason is a value judgment. "I care about *my* trajectory." That's a utility function! You haven't escaped vNM; you've just hidden the utility function inside the definition of the average.

  **Alex:** (Pauses, uncaps the marker, then recaps it) That's... a fair hit. If I say "rationality is maximizing time-average growth," I am implicitly stating a preference for survival over lottery tickets. But isn't that preference universal for embedded agents? An agent that goes to zero stops being an agent. If rationality is about maintaining the capacity to act, then geometric growth isn't a preference; it's a viability constraint.

  **Blake:** Now we're talking about instrumental convergence again. "Don't die." Sure. But that doesn't make Kelly betting the *law* of rationality. It makes it the law of *survival*. Sometimes I want to take a Hail Mary. If I'm behind on my goals, 20% betting guarantees I lose the game. I might need to bet 50% to catch up. A rigid geometric rationality forbids this. A utility function allows it. If I say $U(w) = w^2$ for low wealth and $\ln(w)$ for high wealth, I can justify the Hail Mary. Your framework struggles to accommodate risk-seeking behavior without calling it "irrational."

  **Alex:** I'd call risk-seeking in a multiplicative domain "suicidal," but fine. Let's look at the forecasting angle again. If two forecasters give probabilities, and I average them arithmetically, I can be Dutch Booked in certain dynamic settings. Geometric pooling preserves the external Bayesianity property. This isn't about survival; it's about coherence. It suggests that geometric rationality is the logic of *combining* evidence, not just preserving wealth.

  **Blake:** Coherence is my home turf. But coherence is about avoiding sure losses, not maximizing growth. If geometric pooling avoids Dutch Books, it's because it aligns with Bayes' Rule, which aligns with... expected utility maximization with log scoring. You keep pointing to the same mathematical object—the logarithm—and saying, "See? It's fundamental!" And I keep saying, "Yes, the logarithm is fundamental to information theory and concave utility. That doesn't mean we need to overthrow vNM."

  **Alex:** But vNM assumes you can cancel out risks across independent trials via the Law of Large Numbers *in expectation*. Peters' point is that for non-ergodic processes, the Law of Large Numbers doesn't apply to the ensemble average in the way vNM assumes. It applies to the time average. If the physics of the bet doesn't allow you to pool risk across parallel selves, the axioms of vNM are building on sand.

  **Blake:** (Sighs, rubs temples) vNM doesn't assume parallel selves. It assumes you have consistent preferences over lotteries. If you prefer Lottery A to B, and B to C, you prefer A to C. It's a consistency check. It doesn't tell you what to maximize. That's the input. You're trying to make it an output. You want to say, "Given the physics of multiplicative bets, a rational agent *must* maximize log wealth." I'm saying, "A rational agent *can* maximize log wealth, or linear wealth, or step-function wealth, as long as they don't contradict themselves."

  **Alex:** But if maximizing linear wealth leads to extinction in the time limit, is that consistency really rational? Or is it just consistent suicide?

  **Blake:** If my goal is to leave a legacy for my heirs in the one-in-a-billion branch where I win big, it's not suicide. It's a strategy. You're smuggling "long-term survival of the current trajectory" into the definition of rationality. That's a valid goal! It's just *a* goal.

  **Alex:** (Turns to the board, draws a circle around the time-average equation) Okay. Maybe I can't prove it's the *only* rationality. But I think I can prove it's the *default* rationality for embedded agents who don't know their utility function. If you don't know how much you'll value money in the future, or if you expect your utility to be coupled to your relative standing, geometric growth is the robust heuristic. It's the maximum entropy prior over growth strategies.

  **Blake:** Now *that* I can buy. As a heuristic? Absolutely. As a prior for unknown utility in multiplicative environments? Strong case. But don't tell me Samuelson was wrong. He was right that you can't derive an "ought" from the "is" of the coin flip dynamics without introducing a preference for the time path. You just gave me a very compelling reason why almost everyone *has* that preference.

  **Alex:** (Steps back, looking at the board) So we agree: Geometric rationality isn't a replacement for utility theory, but it identifies the specific utility function that aligns with the physical reality of non-ergodic processes for surviving agents.

  **Blake:** And I'd add: It's a powerful lens for spotting when the "expected value" being thrown around in EA (Effective Altruism) or finance is actually a hallucination driven by non-ergodicity. Just don't claim it disproves Bayes.

  **Alex:** Deal. But I'm still keeping the whiteboard.

  **Blake:** (Grabs an eraser) Only if you clean it up. I need to run a prior update on my own utility function, and I can't do it through your volatility drag.

  **Alex:** (Laughing) Fine. But admit it. You're going to Kelly bet this coin.

  **Blake:** ...Yeah. I'm going to Kelly bet the coin.

  **Alex:** Geometric rationality wins.

  **Blake:** Don't push it.
