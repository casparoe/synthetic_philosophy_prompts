  3.  **Deconstruct the "Obligation":**
      *   *Filial Piety vs. Modern Reality:* Historically, children cared for parents. Modern economy demands mobility.
      *   *Fairness vs. Equality:* Equal contribution doesn't mean identical actions. The local sister is already contributing *time/proximity*. The distant siblings can contribute *money/management*.
      *   *The "Sacrifice" Metric:* Is self-destruction required for care? Generally, no. Caregiver burnout helps no one.

  4.  **Analyze the Siblings' Dynamics:**
