      *   **Sister:** Living nearby often means becoming the "default" caregiver. She might feel resentful or overwhelmed, hence the "look."
      *   **User:** The "successful escapee." Often the target of resentment because they "got away."

  5.  **Develop a Framework for Decision Making:**
