answer: |-
  This is one of the most difficult and common dilemmas facing adults today. You are navigating the collision between modern economic reality (careers require mobility) and ancient familial expectations (children care for parents).

  To answer your core question directly: **No, you are not a bad person for prioritizing the life you have built.** And no, it is not inherently your obligation to "blow up" your life to provide care, especially when there are other viable solutions.

  Here is a framework to help you untangle the guilt, the sibling dynamics, and the actual ethics of what you owe your parents.

  ### 1. Distinguish Between "Care" and "Presence"
  There is a misconception that the only way to care for aging parents is physical proximity. In reality, effective care is usually a combination of four pillars:
  *   **Physical Labor:** Helping with bathing, cooking, driving.
  *   **Emotional Support:** Visiting, calling, keeping them company.
  *   **Financial Support:** Paying for aides, medical bills, or home modifications.
  *   **Management:** Handling insurance, scheduling appointments, researching care options.

  Your sister is currently providing **Physical Labor** and **Presence** by virtue of living nearby. Your brother is suggesting you provide **Presence** by moving back. But if you have the capacity to provide **Financial Support** and **Management**, you are still fulfilling your filial obligation, just in a different currency.

  If your parents have savings, using those funds (perhaps supplemented by you and your brother) to hire professional help is often *better* than a child doing it. Professional caregivers are trained; children are not. When children become caregivers, it often damages the parent-child relationship, turning it into a nurse-patient dynamic filled with resentment.

  ### 2. Analyze the "Sacrifice" Metric
  You mentioned that moving back would torpedo your career, impact your partner's career, and put you in a worse housing market.
  *   **The Resentment Trap:** If you move back and sacrifice your happiness, there is a very high probability you will eventually resent your parents. That resentment is toxic for everyone. Caregiving requires patience and grace; if you are doing it while grieving the loss of your own life, you will not have those reserves.
  *   **The Partner Factor:** You mentioned you have a partner. This decision isn't yours alone to make. Sacrificing your partner's career and stability to care for *your* parents is a major ethical consideration in your marriage/partnership.
  *   **Sustainability:** Caregiving for aging parents can last 5, 10, or 15 years. Can you sustain the sacrifice for that long? If the answer is no, moving back is a short-term fix that creates a long-term crisis.

  ### 3. Decode the Sibling Dynamics
  Your siblings' reactions are understandable, but they aren't necessarily objective.
  *   **Your Brother:** When he says it's the "right thing," listen to the subtext. Often, the sibling suggesting someone else move back is projecting their own guilt. He may feel he *should* do something but doesn't want to be the one to do it. It is easier to point at you (the one who "got away") than to look at his own contribution.
  *   **Your Sister:** The "look" is likely born of burnout. The "local child" often becomes the default caregiver by accident. She may feel trapped and is looking for relief. She might not actually want *you* to move back and crowd her; she might just want you to acknowledge her burden and help lift it financially or logistically.

  ### 4. What Do We Actually Owe Our Parents?
  Ethicists generally agree on a concept of **filial responsibility**, but it is bounded by **capacity**.
  *   **You owe them dignity and safety.** If they can be safe and dignified with hired help that you help coordinate or fund, you have met this obligation.
  *   **You do not owe them self-destruction.** You are a separate adult with your own dependents (including your partner) and your own life trajectory.
  *   **Fairness is not Equality.** It will never be "equal." Your sister gives time; you might give money or management. Your brother might give weekend visits. Trying to make it "equal" leads to scorekeeping and fights. The goal is "equitable based on capacity."

  ### 5. A Proposed Path Forward
  Instead of defending your choice not to move, pivot the conversation to **how you can help without moving.** This disarms the guilt and solves the problem.

  **Step 1: The Family Meeting (Without the Parents)**
  Get on a call with your brother and sister. Acknowledge the tension immediately.
  *   *Say:* "I know Mom and Dad need more help. I know living nearby puts a heavier load on [Sister], and I appreciate that. I can't move back without losing the ability to support them financially long-term, but I want to be a full partner in their care."

  **Step 2: Define Your Contribution**
  Come to the table with a concrete offer.
  *   *Financial:* "I can contribute $X per month to hire a home health aide for 10 hours a week to give [Sister] a break."
  *   *Management:* "I will handle all their insurance claims, bill payments, and research on medical equipment."
  *   *Visits:* "I will come home for one week every quarter specifically to relieve [Sister] so she can take a vacation."

  **Step 3: Address the Parents' Wishes**
  Have a gentle conversation with your parents.
  *   *Ask:* "Would you prefer I move back and struggle financially, or stay here and ensure you have the best professional help money can buy?"
  *   Most parents, if they love their children, do not want their children to ruin their lives for them. They often prefer professional care over being a burden on their kids.

  ### Summary
  Your brother is operating on an emotional definition of "duty" (presence = love). You are operating on a practical definition of "duty" (sustainable support = love).

  You are not abandoning them if you ensure they are cared for. You are simply recognizing that **you can be a good son without being a martyr.** If you move back, you might save them time but lose your own future, and potentially damage your relationship with them through resentment. If you stay and support them strategically, you preserve your ability to be there for them in the ways that actually matter.

  Stand firm in your boundaries, but be generous in your support. That is the balance.
