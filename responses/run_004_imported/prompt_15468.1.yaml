answer: |-
  **MEMORANDUM**

  **TO:** Program Director, Faculty Committee, and Interested Parties
  **FROM:** Student Appeals Committee (Interim Chair)
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Regarding Grade Appeal: Fiction Workshop [Course Number]

  **I. PURPOSE AND SCOPE**

  This memo serves as the formal record of the Student Appeals Committee's decision regarding the grade appeal filed by [Student Name] against the failing workshop grade assigned by [Professor Name]. The Committee has reviewed the manuscript in question, the professor's written evaluation, the student's formal appeal regarding cultural and aesthetic bias, and the professor's response regarding the integrity of literary judgment.

  This case presents a conflict between two valid principles: the necessity of rigorous, expert aesthetic evaluation in an MFA context, and the recognition that aesthetic standards are often tradition-specific rather than universal. The Committee's goal is to render a decision that preserves the authority of faculty expertise while acknowledging that such expertise is bounded by the specific literary traditions in which it is grounded.

  **II. COMMITTEE FINDINGS**

  **A. On the Nature of Literary Judgment**
  The Committee affirms the Professor's position that literary judgment is not merely subjective preference. There are objective failures of craft: incoherence, lack of control, failure of execution. An MFA program cannot function if every critical assessment is vulnerable to being overturned by a claim of bias. To suggest that a professor's expertise is invalid because a student disagrees with the aesthetic preference is to dismantle the pedagogical structure of the degree.

  However, the Committee also affirms the Student's position that "craft" is not monolithic. What reads as "overwrought" in a Minimalist tradition (e.g., Carver, Hemingway) may function as "ornament" or "proverbial density" in an Oral/Igbo tradition. A judgment of "failure" is only valid if the work is measured against the metrics of the tradition it is attempting to inhabit. If a professor evaluates a sonnet by the metrics of free verse, the evaluation may be internally consistent but externally unjust.

  **B. On the Specific Case**
  The Committee finds that the Professor's evaluation is consistent with his established aesthetic standards. There is no evidence of personal malice. However, the Student has provided credible evidence that her work operates within a narrative tradition (Igbo oral tradition) that utilizes digression, direct address, and rhetorical ornamentation as functional craft elements, not as errors of restraint.

  The Committee concludes that the failing grade stems from a **category error**, not necessarily from prejudice. The Professor applied the metrics of Psychological Realism/Minimalism to a text operating under the metrics of Oral/Postcolonial Modernism. While the Professor is an expert in the former, the Committee cannot certify that the evaluation is valid for the latter without assessment from a reader fluent in that specific tradition.

  **III. DECISION ON GRADE**

  **The Committee rules that the current grade of 'Fail' is held in abeyance.**

  The manuscript shall be referred to an **Independent Second Reader**. This reader must be selected from outside the immediate program faculty and must possess demonstrated expertise in Postcolonial Literature, African Literary Traditions, or Non-Western Narrative Structures.

  1.  **If the Second Reader assesses the work as passing** based on the metrics of the tradition the student is employing, the grade shall be revised to 'Pass' (or the equivalent numerical value).
  2.  **If the Second Reader assesses the work as failing**, even when accounting for the specific oral traditions cited, the original grade will be upheld.
  3.  **The Second Reader's letter** must explicitly state which craft metrics were applied, ensuring the evaluation is transparent regarding its aesthetic framework.

  This ruling is not a rebuke of the Professor's competence, but a recognition that no single critic holds jurisdiction over all narrative modes. It is also not a guarantee of success for the Student; it is a guarantee of *relevant* evaluation.

  **IV. RECOMMENDATIONS FOR PROGRAM POLICY**

  To prevent recurrence of this impasse and to address the Professor's valid concern that rigor must be maintained, the Committee recommends the following immediate changes to program procedure:

  **1. Aesthetic Transparency in Syllabi**
  Faculty must include an "Aesthetic Positioning" statement in all workshop syllabi. This statement should outline the literary traditions, styles, and craft values the instructor prioritizes (e.g., "This workshop prioritizes economy of language and psychological realism," or "This workshop explores hybrid forms and non-linear narrative"). This allows students to self-select into workshops aligned with their projects and establishes the evaluative framework at the outset.

  **2. Diversified Reader Pool for Appeals**
  The program must expand its list of eligible external readers for grade appeals. Currently, the pool relies heavily on established alumni and adjuncts who largely share the program's dominant aesthetic. We must curate a list of readers specifically qualified to evaluate work outside the Anglo-American Minimalist canon.

  **3. Revision of Evaluation Rubrics**
  The standard workshop evaluation form currently uses terms like "restraint," "clarity," and "trust the reader" without definition. These terms must be contextualized. Faculty should be required to specify *why* a passage fails. (e.g., instead of "this is purple," write "this ornamentation obscures the narrative action," acknowledging that ornamentation itself may be a choice). This forces the critique to engage with the text's intent rather than the reader's expectation.

  **V. CONCLUSION**

  The Professor is correct that suspicion of bias cannot become a blanket veto on critical judgment. If we rule that any negative critique of a marginalized aesthetic is inherently biased, we render honest mentorship impossible. However, the Student is correct that bias often manifests as the inability to recognize competence outside one's own training.

  By referring this grade to a reader with specific expertise in the student's tradition, we uphold the requirement for rigorous judgment while acknowledging that rigor requires the right tools. We affirm that craft is real, but we also affirm that craft is plural.

  **Signed,**

  [Your Name]
  Interim Chair, Student Appeals Committee
  [Program Name] MFA
