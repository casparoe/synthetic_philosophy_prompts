answer: |-
  The kitchen was the only quiet room in the house, a sterile island of stainless steel amidst the departmental reunion noise. Elena leaned against the counter, swirling a glass of wine that had gone warm. Marcus stood by the fridge, arms crossed, watching her as if she were a text he was trying to annotate.

  They hadn't spoken in fifteen years, not since the defense where Marcus had called her thesis "lyrical but grammatically confused," and she had called his life "a commentary on a book that forbids commentaries."

  "You still look like you're waiting for a sensation to name," Marcus said.

  Elena didn't smile. "And you still look like you're waiting for a rule to be broken. Save it, Marcus. I'm not a grad student anymore."

  "The claim hasn't changed, though. In your new collection. You say you found the word for the grief you felt at thirty before you had the language for it at twenty."

  "I say I recognized it," she corrected. "There's a difference."

  "Is there?" Marcus pushed off the fridge. "Let's reconstruct it. Just once. For old times' sake. You have a sensation. Let's call it 'S'. You want to keep a diary of it. You write the sign 'S' next to the date whenever 'S' occurs."

  "I don't write 'S'. I write *'the hollow behind the sternum'*."

  "Fine. A sign. A mark. Now, five years later, the sensation returns. You write the phrase again. How do you know it's the same sensation?"

  "Because it feels the same."

  Marcus shook his head, a slow, practiced motion. "That's the circle, El. You're using the sensation to justify the memory of the sensation. Whatever is going to seem right to you *is* right. And that means we can't talk about 'right'."

  "So I'm hallucinating the continuity?"

  "I'm saying there's no criterion for correctness. If you can't check it against anything independent of your own impression, you haven't established a meaning. You've just made a noise."

  Elena set her glass down. The clink was sharp in the quiet room. "You're teaching the intro class version. You're skipping the nuance. You think because I can't point to a public object, like a beetle in a box, the content is irrelevant."

  "I think the content drops out of consideration as far as the language game is concerned."

  "But it doesn't drop out of *my* consideration. And that's where the poem lives." She stepped closer. "You're acting as if the only verification is external. But when I write a line—say, *'grief is the rent that won't stop shaking'*—I know it's true before I show it to anyone. It fits. The rhythm, the consonance, the weight of it. It locks into the feeling."

  "That locking," Marcus said, "is a feeling of satisfaction. Not a fact of correspondence."

  "It's a craft verification. I try ten words. Nine feel wrong. One feels right. If it were just 'seeming,' why does the ninth one itch and the tenth one heal?"

  "Because you've been trained in a public language to prefer certain sonic patterns. You're checking it against the usage of others, even if they aren't in the room. You're not checking it against a private object."

  "I am checking it against the memory of the pain."

  "And how do you check the memory?" Marcus pressed. "If you buy a newspaper to check the truth of a newspaper, what are you doing? You need a measure that isn't the thing being measured."

  Elena picked up her wine again. She looked at him, really looked at him, seeing the fatigue behind the rigor. "You're terrified that if I'm right, your whole career is a grammar police action against ghosts."

  "I'm terrified that if you're right, communication is impossible. If your 'S' is truly private, I can never know what you mean. You're solipsistic."

  "I'm not a solipsist. I publish. People read. They cry."

  "They cry because they have their own 'S' and they project it onto your mark. They aren't accessing your sensation."

  "Marcus, listen to yourself. You're making the sensation into a nothing."

  "I am not."

  "You are. You're so busy guarding the gate of meaning you've forgotten there's a house inside. Read §304. *'It is not a nothing, but not a something either!'* You always stop at 'not a something'. You ignore the first half."

  Marcus paused. He reached for a bottle of water on the counter, unscrewed the cap, and took a drink to buy time. "I don't call it a nothing. I call it inexpressible in the way you want to express it. You want to use it as a referent. A name for an object."

  "I want to use it as a anchor. If I can't trust that the pain I feel now is the same kind of pain I felt then, then I don't have a self. I just have a series of unrelated moments."

  "You have a form of life. That's enough."

  "Is it?" Elena's voice dropped. "If I write a poem about a loss, and ten years later I write another, and the second one only makes sense if the feeling is continuous... if you're right, then the second poem is a lie. It's pretending to a history that can't be verified."

  "It's not a lie. It's a move in a game. The meaning is in the use, El. If you use the word 'grief' and people comfort you, or read the poem and feel understood, the language is working. The private ostension is wheel spinning."

  "But the *recognition* isn't wheel spinning. It's the only thing I have." She tapped her chest. "When I say 'this is it again', I am not guessing. I am remembering. And if Wittgenstein says I can't remember a private sensation, then Wittgenstein never had to live with one."

  Marcus looked away, toward the window where the party noise swelled and receded. "He says we can't establish a *rule* for it. A rule requires the possibility of mistake. If you can't make a mistake—if 'seeming right' is the only standard—then you haven't got a rule. You've got an impulse."

  "An impulse that builds cathedrals," Elena said. "An impulse that lets me talk to you fifteen years later."

  "That's the public part. The words. The syntax. That's what lets you talk to me."

  "The words are the shell. The recognition is the pearl."

  Marcus turned back. He looked tired of the metaphor, but engaged. "Okay. Let's grant the pearl exists. Let's grant it's not a nothing. What would it take for you to admit you might be wrong about the re-identification?"

  Elena frowned. "If I wrote the line and it felt false."

  "But feelings change. What if you wrote it, it felt true, but everyone who read it said it was nonsense? Would you burn the poem?"

  "No. I'd wait. Maybe they aren't ready."

  "Exactly. So your criterion is ultimately your own feeling. Which brings us back to §258." Marcus leaned in. "But here is where I will meet you. If the sensation is not a nothing, it must have a role. Not as a named object, but as a cause."

  "A cause?"

  "The sensation causes the utterance. The utterance enters the public sphere. The public sphere reacts. If the reaction sustains the practice, the language game continues."

  "So I'm right if the poem survives?"

  "No. You're right if the *practice* of naming it allows for a form of life to continue. Including yours." Marcus hesitated. "I need a criterion for correctness to call it language. You need a continuity of consciousness to call it a life."

  Elena nodded slowly. "So we aren't arguing about whether the pain exists."

  "No. We agree it's not a nothing."

  "And we aren't arguing about whether the words work."

  "No. We agree they function in the public sphere."

  "Then what's left?"

  "The bridge," Marcus said. "The moment between the feeling and the word. I say the word gets its meaning from the public use that follows. You say the word gets its authority from the private memory that precedes."

  Elena swirled the warm wine. "If I am right, there must be a thread of identity that survives the fifteen years of silence. A thread that isn't just social."

  "And if I am right," Marcus added, "there must be a public practice that validates the memory, even if that practice is just us, here, agreeing to speak as if the memory holds."

  They stood in the silence of the kitchen. The argument wasn't resolved; the chasm between the private experience and the public rule was still there, wide and unbridgeable. But they had mapped the edges.

  "So," Elena said. "For me to be right, the memory has to be more than a disposition to speak."

  "And for me to be right," Marcus said, "the speaking has to be more than a report on the memory."

  Elena raised her glass slightly. "To the bridge, then."

  Marcus lifted his water bottle. "To the traffic on it."

  They drank, and for the first time in fifteen years, the silence between them didn't feel like a mistake.
