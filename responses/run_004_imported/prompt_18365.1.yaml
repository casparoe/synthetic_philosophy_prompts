answer: |-
  It is a pleasure to address a question from someone who knows the terrain literally as well as figuratively. Your geological background provides a distinct advantage here, because Wittgenstein's river-bed metaphor is often treated by philosophers as a mere poetic flourish, whereas you recognize it as a technical description of sedimentary dynamics.

  The tension you have identified is one of the central problems in interpreting *On Certainty*. It is the tension between the **logical** function of certainties (the Hinge) and their **historical** mutability (the River-Bed). Your worry is that if the bed shifts, the hinges are merely "frozen" empirical beliefs, making certainty a matter of psychological degree (how confident we are) rather than logical kind (what role the proposition plays). And if that is the case, does Wittgenstein collapse into relativism?

  I propose that we can hold both passages together without explaining one away, provided we distinguish between the **synchronic** perspective (how the system works at a given moment) and the **diachronic** perspective (how the system evolves over time).

  ### 1. The Hinge: A Synchronic Functionalism (OC 341–343)

  When Wittgenstein discusses hinges in remarks 341–343 ("If I want the door to turn, the hinges must stay put"), he is describing the **logic of justification** at a specific moment.

  In your fieldwork, when you mapped a terrace, you had to treat certain benchmarks as fixed to measure the elevation of the deposits. If you treated the benchmark as fluid *during* the measurement, the measurement itself became impossible. The benchmark functions as a rule for that specific survey.

  Wittgenstein's point is grammatical, not psychological. To say a proposition is a "hinge" is not to say "I am very confident this is true." It is to say "This proposition is not functioning as a claim about the world right now; it is functioning as the scaffolding that allows me to make claims."

  *   **Empirical proposition:** "There is a hand in front of me." (Testable, fluid water).
  *   **Hinge proposition:** "Physical objects exist." (The channel through which the testing flows).

  If you treat "Physical objects exist" as a hypothesis to be tested, you cannot test "There is a hand," because the test itself presupposes the existence of physical objects. Thus, at the moment of inquiry, the difference is a **difference in kind** (logical role), not degree (confidence).

  ### 2. The River-Bed: A Diachronic Evolution (OC 96–99)

  Now we turn to your preferred passage. Here, Wittgenstein zooms out from the specific survey to the geological epoch. He acknowledges that what serves as a benchmark in one season (or century) may be recognized as a deposit in another.

  Remark 96 states that fluid propositions harden and hard ones become fluid. This is the history of science and culture.
  *   *Example:* "The sun orbits the earth" was once hardened river-bed (a rule for navigating and timing). It became fluid (a hypothesis to be tested) and was eventually washed away.
  *   *Example:* "Energy is conserved" was once a fluid hypothesis; for a long time, it hardened into a river-bed rule for physics. Now, in certain cosmological contexts, it is becoming fluid again.

  This does not negate the Hinge metaphor; it contextualizes it. The Hinge metaphor tells us how the door works *while it is installed*. The River-Bed metaphor tells us how the door frame gets rebuilt *over centuries*.

  To answer your specific worry: **Does this reduce hinge-certainty to a historically local degree of confidence?**

  No, because even when a proposition is a hinge, it is not held with "high confidence." It is held with **no confidence at all**, because confidence implies the possibility of doubt. As Wittgenstein says in OC 358, "I do not verify the proposition 'I am in pain'." I don't have confidence I am in pain; I simply have pain. Similarly, I don't have "high confidence" the world exists; I simply act within it.

  When a hinge becomes fluid, it doesn't mean we "lost confidence." It means the language-game changed so that the proposition was moved from the *scaffolding* to the *building*. The shift is in **grammar**, not in the intensity of a mental state.

  ### 3. Hard Rock vs. Sand: Avoiding Relativism

  You ask if the distinction in Remark 99 between "hard rock" and "sand" offers a principled way to let some certainties drift while others stay fixed, thereby saving the view from radical relativism.

  This is a crucial insight. If *everything* were sand, Wittgenstein would be a relativist (anything goes). If *everything* were rock, he would be a foundationalist (eternal truths). By positing a mix, he offers a **naturalized epistemology**.

  *   **The Sand:** These are cultural or theoretical certainties (e.g., "The King rules by divine right," or "Phlogiston is released in combustion"). These shift relatively quickly with historical changes.
  *   **The Hard Rock:** These are certainties grounded in the **human form of life** (OC 345). Examples include: "I have two hands," "The earth existed long before my birth," "Pain is unpleasant."

  The "hard rock" is not metaphysically immutable. Wittgenstein admits in OC 97 that "the mythology may change back into a state of flux." However, for *us*, as the biological and social creatures we are, the hard rock is effectively permanent. It is anchored in our biology and our basic interactions with the environment.

  This avoids relativism not by appealing to Absolute Truth, but by appealing to **shared human action**. We are not relativists about whether fire burns; we are united in our avoidance of it. The "river-bed" is not arbitrary; it is constrained by the world we live in and the bodies we inhabit.

  ### 4. Synthesizing the Metaphors

  To bring this back to your geological expertise:

  Imagine you are measuring the rate of erosion on a specific bend of a river.
  1.  **The Hinge (OC 341):** To take the measurement *today*, you must treat the survey markers as fixed. If you doubt the marker's position *during* the measurement, the data is meaningless. The marker is a hinge.
  2.  **The River-Bed (OC 96):** You know, as a geologist, that the marker is embedded in sediment that is shifting over millennia. The "fixed" point is geologically fluid.
  3.  **The Compatibility:** The fact that the marker shifts over millennia (River-Bed) does not invalidate its status as fixed for the purpose of today's survey (Hinge).

  If you confuse the two time-scales, you get skepticism (trying to measure erosion while doubting the marker's stability *now*). If you ignore the long-term shift, you get dogmatism (believing the marker is metaphysically eternal).

  Wittgenstein wants to steer between the skeptic and the dogmatist.
  *   **Against the Skeptic:** He uses the **Hinge**. We cannot doubt everything at once, or language stops working. Some things must stay put for the game to be played.
  *   **Against the Dogmatist:** He uses the **River-Bed**. What stays put is not guaranteed by God or Logic; it is just what happens to be the bed *now*. It can shift.

  ### 5. Conclusion on "Kind vs. Degree"

  Your fear was that the shifting bed reduces certainty to a "degree of confidence." I suggest the opposite: The shifting bed proves that certainty is **not** a mental state.

  If certainty were a feeling of high confidence, it would be hard to explain how a proposition can lose that status without us "losing faith." But if certainty is a **functional role** (like a gear in a machine), it makes perfect sense that a gear can be swapped out.
  *   When "The earth exists" is a hinge, it is a rule.
  *   When it becomes fluid (perhaps in a sci-fi simulation hypothesis context), it becomes an empirical claim.

  The proposition hasn't changed; its **use** has changed.

  So, to answer your final question: The "hard rock" of Remark 99 does not save the distinction by making some truths eternal. It saves the distinction by showing that while all hinges are historically contingent, they are not *equally* contingent. Some are tied to the bedrock of human existence.

  The two passages are compatible because they address different questions.
  *   **The Hinge passage asks:** "What must be the case for doubt to be meaningful *now*?"
  *   **The River-Bed passage asks:** "How did the conditions for doubt come to be, and how might they change?"

  Wittgenstein is not a relativist because he does not say "any river-bed is as good as any other." He says, "This is our river-bed. We act on it. We cannot get beneath it." But he adds the humble geological footnote: "River-beds shift."

  For a geologist, this should be a comfortable position. The strata are real, the mapping is valid, but the landscape is ancient and still moving. You do not need the bedrock to be metaphysically eternal to map the terrace; you only need it to be stable enough for the season's work. Wittgenstein asks no more of our certainties than that.
