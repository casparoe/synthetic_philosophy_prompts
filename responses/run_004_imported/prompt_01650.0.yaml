      *   **Boundary Management:** The ethical right to protect one's own resources (time, energy) to sustain long-term performance.

  3.  **Analyze Engineer A's Points:**

      *   *Point 1: Mentoring should be supererogatory.*
          *   *Validity:* Depends on the job description and company culture. In many tech companies, "growing others" is explicitly part of senior levels. If it's in the contract/KPIs, it's obligatory. If it's extra, it's supererogatory.
          *   *Strength:* Protects against burnout and ensures core deliverables are met.
      *   *Point 2: Shifting norms to "required" is unfair.*
          *   *Validity:* Strong point if management doesn't adjust workload. You can't add duties without removing others or extending time.
          *   *Strength:* Highlights systemic issues (resource allocation).
      *   *Point 3: The "Collapse" Argument (Unlimited Obligation).*
