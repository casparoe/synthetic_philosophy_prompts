          *   Fear: If obligation tracks "could help at low cost," obligations become unlimited (the "collapse" argument).
      *   **Engineer B (The "Obligation" Advocate):**
          *   View: When someone is struggling and you can help without *significant cost*, an obligation exists. It's not merely supererogatory.
