  2.  **Identify the Core Ethical Concepts:**

      *   **Supererogation:** Actions that are good but beyond the call of duty (e.g., heroism, extreme generosity).
      *   **Obligation/Duty:** Actions one *must* do (e.g., fulfilling job description, not harming others).
      *   **The "Easy Rescue" Principle:** If you can prevent something bad from happening at little cost to yourself, you ought to do it (Singer, etc.).
