          *   A pragmatic Kantianism focuses on the *commitment* to the moral law, not emotional purity.

      *   **Conclusion:** Summarize. Moral worth lies in the *priority* of duty, not the *exclusivity* of duty.

  5.  **Refining the Tone:**
