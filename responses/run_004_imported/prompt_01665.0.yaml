answer: |-
  This is one of the most enduring and sophisticated debates in Kantian scholarship. You have hit on a tension that philosophers have wrestled with for over two centuries.

  The strict reading of Kant's *Groundwork of the Metaphysics of Morals* suggests that for an action to have moral worth, it must be done **solely** from duty. If inclination (feeling good, sympathy, desire for praise) plays any role, the action is merely "in accordance with duty," not "from duty."

  However, many modern Kantians and nuanced interpreters argue that this "purity test" is too rigid and psychologically impossible. Here is an argument for why **mixed motives do not undermine moral worth, provided duty remains the *decisive* motive.**

  ### 1. The Distinction Between "Sufficient" and "Exclusive"
  The core of this argument rests on changing how we define "acting from duty." We should not view duty as needing to be the *exclusive* motive, but rather the *sufficient* motive.

  *   **Exclusive Motive:** "I did it *only* because it was right, and no other reason played a part." (This is the strict view).
  *   **Sufficient Motive:** "I did it because it was right, and that reason alone would have been enough to make me do it, even if other reasons were also present."

  **The Argument:** Moral worth resides in the **priority** of the motive, not the **purity** of the motive. As long as the moral law is the overriding constraint that validates the action, the presence of secondary motives (like enjoyment or sympathy) does not cancel out the moral worth. The moral motive must be the "governing" motive, not the "lonely" motive.

  ### 2. The Counterfactual Test (The "Even If" Clause)
  How do we know if duty is the governing motive in a mixed-motive scenario? We can use a counterfactual test.

  Imagine you donate to charity. You feel good about it (inclination) AND you believe it is right (duty). To determine if there is moral worth, ask: **"Would I still do this if it did not feel good?"**

  *   **Scenario A:** If the donation became anonymous, difficult, and gave you no warm glow, but you did it anyway because it was right, then duty was the sufficient motive. The fact that you *also* enjoyed it in the actual scenario doesn't erase the fact that duty was in the driver's seat.
  *   **Scenario B:** If the donation stopped feeling good, and you immediately stopped donating, then your motive was primarily inclination, and the "duty" part was just a rationalization.

  **The Argument:** Mixed motives are morally worthy if the commitment to duty is robust enough to survive the absence of inclination. The presence of inclination is incidental; the presence of duty is essential.

  ### 3. Overdetermination
  In philosophy, an action is "overdetermined" if it has more causes than are necessary to produce it.

  Think of a bridge held up by three pillars. If one pillar is strong enough to hold the bridge alone (Duty), but there are two other smaller pillars helping it (Inclination, Sympathy), the bridge is still standing primarily because of the main pillar. The extra pillars don't weaken the structure; they just make it easier to build.

  **The Argument:** Human psychology is complex. We are rational beings (capable of duty) but also sensible beings (capable of feeling). To demand that we suppress our sensible nature to be moral is to demand we cease being human. If the rational motive is strong enough to cause the action on its own, the addition of sensible motives does not negate the moral worth of the rational cause.

  ### 4. Kant's Later Work: Cultivating Feelings
  While the *Groundwork* (1785) sounds very strict, Kant's later work, *The Metaphysics of Morals* (1797), offers a more nuanced view that supports the mixed-motive argument.

  In the later text, Kant argues that we actually have a **duty to cultivate our sympathetic feelings**. He suggests that while feelings cannot be the *basis* of morality, they are useful tools that nature has given us to help us fulfill our duties.

  **The Argument:** If Kant believes we ought to cultivate feelings that align with duty, he cannot logically condemn us when those feelings are present. A moral agent who has successfully cultivated a love for humanity will *feel good* doing the right thing. To say this action has *less* moral worth than a grumpy person doing the same thing seems counterintuitive. The feeling is not the ground of the action, but it is a welcomed companion to it.

  ### 5. The Problem of Psychological Opacity
  Finally, there is a pragmatic argument. Kant himself admitted that we can never truly know our own hearts with 100% certainty. We are prone to self-deception.

  If moral worth requires 100% purity of motive, and humans are incapable of verifying 100% purity of motive, then **no human action has moral worth.** This leads to moral nihilism or despair, which undermines the very purpose of ethics (which is to guide action).

  **The Argument:** A functional ethical system must allow for mixed motives. We should judge moral worth based on the **commitment to the moral principle** rather than an impossible introspection of emotional purity. If you are striving to act from duty, and you happen to enjoy it, you should not view the enjoyment as a contaminant, but as a sign that your rational and sensible natures are coming into harmony.

  ### Summary
  To answer your question directly: **No, mixed motives do not automatically void moral worth.**

  You can act from duty and other motives simultaneously if:
  1.  **Duty is the decisive factor:** It is the reason that would prevail if the other motives disappeared.
  2.  **Inclination is subordinate:** You are not doing it *because* it feels good; it feels good *because* you are doing what you value.
  3.  **The Will is Autonomous:** You are legislating the action for yourself through reason, not being pushed by impulse.

  In your charity example, if you would still write that check even if it made you sad, tired, or unrecognized, then the fact that it *also* makes you feel warm and fuzzy does not steal the moral worth from the action. It just makes you a happy moral agent.
