answer: |-
  The hallway lights hummed, a sterile contrast to the tremor in Elena's hands. She leaned against the wall, her scrubs from a decade ago feeling like a uniform she'd never truly taken off.

  "He's warm, David," Elena said, her voice low but sharp. "His chest rises. I've seen wounds granulate on patients like this. I've read the case reports—women carrying pregnancies for months. If the body can grow a human being, how is the organism dead?"

  Dr. Aris didn't shift his weight. He kept his hands clasped, respecting the space between them. "Homeostasis isn't life, Elena. Not on its own. A kidney can be kept perfused on a bench top. That doesn't make the kidney a person. The brain is the critical integrator. Without it, the body isn't functioning as a whole; it's a collection of tissues responding to mechanical ventilation and pressors."

  "But the integration is happening," she pressed. "Bone growth. Hormone regulation. That's not the vent doing that. That's somatic integrity. You're calling him dead because his consciousness is gone, not because his biology stopped."

  "I'm calling him dead because the loss is irreversible," Aris corrected. "The brainstem is gone. The body isn't maintaining itself; we are. Every breath, every beat is us forcing physics on biology. Those pregnancy cases? Outliers where some hypothalamic function lingered. Here, there is nothing. No blood flow. No electricity."

  Elena pushed off the wall. "Fine. Then don't take the organs yet. Let's go with Circulatory Death. Withdraw support. Wait for the heart to stop. It's binary. Either it beats or it doesn't. No philosophical gymnastics."

  "DCD isn't clean," Aris said, his tone hardening slightly. "You know the protocol. We withdraw, we wait for asystole. But how long do we wait? Two minutes? Five? There's a window where the heart can auto-resuscitate. If we declare death too soon to harvest viable livers, we violate the dead donor rule. If we wait too long, the organs ischemicly damage and are useless."

  "So you admit it's a gradient," Elena said.

  "I admit biology is messy," Aris countered. "But brain death is the only line where the capacity for consciousness and the capacity for bodily integration are permanently extinguished. Circulatory death is just a different threshold of irreversibility. If we wait for the heart to stop permanently, not just pause, the organs are gone. You're asking me to choose between a definition that's biologically fuzzy but allows donation, or one that's philosophically strict but renders the gift impossible."

  "I'm asking you not to cut into a body that heals itself," Elena said.

  "And I'm telling you that a body that cannot breathe, swallow, or perceive pain without a machine is no longer an organism," Aris said. "It's a vessel. Your nephew is gone, Elena. The tissues remaining are just echoing."

  Elena looked at the closed door behind him. "Echoes don't fight infection," she whispered.

  "No," Aris said softly. "But the dead don't wake up. And he never will."
