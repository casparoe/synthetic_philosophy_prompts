answer: |-
  Good morning. For those of you who don't know me, my name is [Your Name]. I'm a software engineer. I write code for a living. I'm standing here today not because I share Helen's profession, but because, for two years, I had the privilege of sharing her work.

  I first walked into Helen's office because a friend told me her seminar was an "easy elective." That was the first thing Helen debunked. She looked at my registration form, looked at me, and said, "If you're looking for easy, go learn how to knit. If you're here, you're going to learn how to think." I stayed for two years. I became her research assistant. I wrote the randomization algorithms and the blinding protocols for her experiments.

  To the wider world, Helen Marsh was a skeptic. She was a debunker. She is perhaps best known for exposing a fraudulent medium on national television. But to those of us in the lab, late at night, watching data streams scroll across a monitor, she wasn't driven by a desire to destroy belief. She was driven by a desperate hope to find something real.

  Helen spent thirty years investigating claims of the paranormal. But she wasn't hunting ghosts. She was hunting for a foundation. She worried about a problem in philosophy called the "dualism of practical reason." In plain English, it's the fear that there is no guarantee that doing the right thing and doing the self-interested thing ever add up to the same total. She wanted to know if the universe was structured in a way that made morality rational. She wanted to know if goodness was woven into the fabric of reality, or if it was just a story we tell ourselves to be nice.

  She refused to take it on faith. She refused to assume the answer just because it was comforting. She insisted on evidence.

  And I need to be honest about this, because she would have demanded it of me: She never found that evidence. Not conclusively. She ran the trials. She checked the statistics. She published the null results. She spent three decades looking for a signal in the noise, and she was scrupulously public about the fact that the line remained flat.

  Some might call that a tragedy. I think it was her greatest act of integrity. It is easy to be a skeptic when it costs you nothing. It is much harder to spend your life looking for a reason to believe in a moral order, to need that reason deeply, and yet to stand before the world and say, "I cannot find it." She valued truth more than she valued comfort. Even her own.

  Now, I know there are stories. There are always stories when someone like Helen passes. And because I was close to her, I feel I have a responsibility to address one of them, specifically for the two friends sitting in the front row who know the truth, and for the family who loved her enough to wonder.

  In graduate school, Helen and two of her closest colleagues made a pact. It was modeled on an agreement made by the philosopher Henry Sidgwick, the very man who posed the problem that haunted her. They agreed that whichever of them died first would attempt to signal the others. They agreed to test the boundary one last time.

  Helen died three weeks ago. As of this morning, there has been no signal. No moving objects. No whispers in the static. No dreams that defy probability.

  I tell you this not to diminish her, and certainly not to diminish your grief. I tell you this because to pretend otherwise would be to insult the life she lived. She did not want us to lie to ourselves. She taught us that the absence of evidence is not a cause for despair, provided we have each other. The silence isn't a rejection. It is simply the final data point in a life dedicated to rigor. It means she kept her standards until the very end. She didn't cheat, even for her friends. Even for herself.

  But here is what I learned in those late nights in the lab, watching her review the data that disappointed her over and over again. I learned that you don't need a guarantee of a moral order to be a moral person.

  Helen didn't find proof that the universe rewards goodness. So she decided to be the reward.

  She didn't need a psychic signal to know that love matters. She didn't need a promise of an afterlife to treat her students, her friends, and her family with profound dignity. If there is a "moral order," Helen didn't find it in the stars or in the spirits. She found it in the way she made coffee for a grieving student. She found it in the way she mentored women in philosophy when the field was hostile. She found it in the patience she showed her relatives, who loved her deeply even if they didn't understand why she wouldn't come to church.

  To her family: She loved you. She didn't need the universe to be magical to know that you were precious. Her skepticism was never about doubting *you*. It was about doubting the easy answers so that the hard truths could stand on their own.

  To her friends: The pact is closed. The experiment is over. But the work continues. We keep the standards. We keep the honesty.

  And to Helen: You taught me that code must be clean, that data must be honest, and that a life must be examined. You were the most rigorous person I ever knew, and also the kindest. You showed us that we can face the silence of the universe without flinching, as long as we hold on to one another.

  We are not going to pretend you are watching over us, because you taught us not to pretend. But you are here. You are here in the integrity of the work you left behind. You are here in the students who learned to think clearly. You are here in the friends who kept their promises. And you are here in the grief we feel, which is the only proof we need that love was real, regardless of what comes next.

  Rest now, Helen. The trials are finished. The data is logged. And for what it is worth, from the one person who saw the code behind the curtain: You were good. Not because the universe made you be. But because you chose to be.

  Thank you.
