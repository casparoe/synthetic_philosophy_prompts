      *   **Deceased:** Helen Marsh, philosophy professor, renowned skeptic/debunker of psychic claims.
      *   **Relationship:** Close, almost like family. Worked together for two years on experiments testing psychic abilities.
      *   **Core Conflict:** Helen spent 30 years looking for evidence of a "moral order" (Sidgwick's "dualism of practical reason") to justify morality rationally without faith. She found nothing conclusive and was honest about that failure.
      *   **The Complication:** Helen had a pact with two grad school friends to signal from the afterlife if possible. Nothing has happened yet. The family wants comfort/spiritual assurance ("she's watching over us"). The speaker wants to avoid intellectual dishonesty but also avoid a dry lecture.
      *   **Constraints:** 7-8 minutes spoken (approx. 1000-1200 words), honest about the search, decide on the pact, feel like a goodbye.

  2.  **Determine the Tone:**
      *   Respectful, warm, but intellectually rigorous.
      *   Avoids New Age platitudes that Helen would have rejected.
      *   Avoids cold skepticism that would hurt the grieving family.
      *   Needs to bridge the gap between the "believing" family and the "skeptical" professor.
      *   Key theme: Integrity, the value of the search, and love as its own justification.

  3.  **Address the "Pact":**
      *   *Option A: Ignore it.* Too secretive, might feel like hiding the truth from the friends who know.
      *   *Option B: Announce it loudly.* Risks turning the funeral into a séance or a spectacle. Undermines Helen's rigor.
      *   *Option C: Acknowledge it subtly to the friends, but frame it for the family as part of her openness.*
      *   *Decision:* Acknowledge it, but emphasize the *silence* as consistent with her findings. The silence isn't a failure; it's the final data point. It honors her commitment to truth over comfort. This respects the friends (who know) and educates the family without lying.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Establish who I am (the engineer), how we met (the "easy elective"), and the depth of the relationship. Set the tone of admiration.
      *   **The Work (The Skepticism):** Explain *why* she did what she did. Not to crush hope, but to find a solid foundation for goodness. Explain the Sidgwick connection simply. This humanizes her skepticism.
      *   **The Honesty:** Address her lack of findings. She didn't find proof, but she found integrity. This is the core moral lesson.
      *   **The Pact (The Delicate Part):** Mention the agreement with her friends. Frame it as her final experiment. Acknowledge the silence. This validates the friends without promising the family false hope.
      *   **The Conclusion/Goodbye:** Shift from the intellectual to the emotional. Even without a "moral order" proven, her life *was* good. Love doesn't need a guarantee to be real. Say farewell.

  5.  **Drafting - Word Count & Timing Check:**
      *   Average speaking pace is ~130-150 words per minute.
      *   7 minutes = ~910 - 1050 words.
      *   8 minutes = ~1040 - 1200 words.
      *   Target: ~1100 words.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is the Sidgwick explanation too dense?
      *   *Fix:* Simplify it. "Duty vs. Self-Interest." She wanted to know if being good *pays off* in the cosmic ledger.
      *   *Critique:* Is mentioning the pact too risky?
      *   *Fix:* Keep it brief. Focus on her *willingness* to look, not the result. The result (silence) is actually more powerful because it shows she didn't cheat even at the end.
      *   *Critique:* How to comfort the family?
      *   *Fix:* Focus on her legacy in *us*. The "moral order" might not be proven, but her impact is evidence enough of goodness existing.

  7.  **Final Polish:**
      *   Check transitions.
      *   Ensure the ending lands emotionally.
      *   Make sure the "engineer" voice comes through slightly (precision, code) but melts into the "student/friend" voice.

  8.  **Final Review against constraints:**
