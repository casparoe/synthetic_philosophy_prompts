        "points_earned": 3,
        "points_possible": 3,
        "justification": "Correctly identifies the Nyaya strategy as reduction to anumana (inference). The reconstruction of the implicit premises for both cases is logically sound and demonstrates understanding of how Nyaya dissolves the need for independent pramanas. (Note: While some Nyaya schools classify absence as perception, the 'inference from non-perception' argument is a standard and acceptable representation of the reductionist strategy in a survey context)."
      }
