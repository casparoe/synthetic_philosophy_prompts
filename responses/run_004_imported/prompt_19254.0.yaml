      *   *Attitude towards Metaphysics:* He hated "pseudo-problems." He would likely view the *moral* argument against socialism (e.g., "it violates liberty" as a metaphysical absolute) as nonsense, but the *technical* argument (e.g., "it cannot compute") as a legitimate scientific question.

