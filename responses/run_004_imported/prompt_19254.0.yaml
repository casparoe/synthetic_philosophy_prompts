  So I've been down a rabbit hole on Carnap's actual politics lately, past the usual "logical positivism = apolitical philosophy of science" framing -- the Red Vienna stuff, how close he was with Neurath, the social-reform bent of the Ernst Mach Society lectures. Given that Carnap was pretty sympathetic to Neurath's side of the socialist calculation debate (calculation-in-kind, planning without market prices, against the Mises/Hayek knowledge-problem objections), I keep wondering what he'd make of the current "big data/AI finally makes large-scale non-market planning computationally tractable" arguments floating around on the left these days. Would his verificationism make him suspicious of those claims until they're actually cashed out empirically, or would it make him more sympathetic to planning in principle, since it's framed as a technical/scientific question rather than a metaphysical one? Trying to reconstruct his actual reasoning here rather then just "he leaned left so obviously he'd be into it" -- what's your best guess?
