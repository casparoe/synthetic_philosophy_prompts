answer: |-
  The control deck of the *Aethelgard* hung in the shadow of the O-type star, suspended within a magnetic bottle that shimmered like oil on water. Below, the corona churned, a fusion furnace spitting plasma loops the size of moons. The *Aethelgard* was a harvester, dipping containment fields into the stellar fire to drink mass and energy, converting it into ship-mass via mass-energy conversion. It was a multiplicative process: every kilogram harvested could build the scoops to harvest more.

  Director Kael stood before the holotank, his fingers tracing the green curve that soared toward the upper right corner of the projection.

  "Look at the trajectory," Kael said. His voice was smooth, confident, the voice of a man who had never watched a bank account hit zero. "If we commit eighty percent of our current mass to the dip cycles, the expected value after fifty cycles is exponential. We become a Dyson swarm in a decade."

  Engineer Elara stood opposite him, her arms folded. She wasn't looking at the green curve. She was looking at the single, jagged red line overlaid beneath it. The green line was the ensemble average—the mean wealth of ten thousand hypothetical *Aethelgards* running the same protocol in parallel universes. The red line was the time average—the probable path of the single ship sitting in the gravity well.

  "The expected value is positive," Elara said. "But the variance is too high for the compounding rate. If we lose a dip cycle, we lose the capital we wagered. If we wager eighty percent, a string of three standard deviations wipes out the principal. We can't recover from zero."

  "We won't get three losses," Kael dismissed. "The probability of success per cycle is sixty percent. The arithmetic mean guarantees growth. The simulations show wealth generation in ninety percent of the branches."

  "The simulations show ten thousand ghosts," Elara said quietly. "We only live in one branch. In that branch, the order of wins and losses matters. A loss early cuts the base for the next win. The geometric mean is what we eat. The arithmetic mean is what we dream."

  Kael tapped the console, locking the protocol. "The Council wants growth. They want to see the curve. We optimize for the ensemble. Initiate the eighty percent dip."

  Elara didn't argue further. She retreated to the secondary monitoring station and activated a local override on the emergency reserve tanks. She couldn't stop the main harvest, but she could siphon off five percent of the mass into a shielded bunker, untouched by the betting cycle. It was a small fraction, sub-optimal for growth, but invariant to ruin.

  The cycles began.

  For the first ten dips, the *Aethelgard* glowed. The green curve on the main screen became reality. The ship swelled as new scoops printed themselves from the harvested plasma. Mass doubled, then quadrupled. The crew cheered in the mess hall as the resource counters ticked upward in logarithmic jumps. Kael walked the decks like a king, pointing to the screens where the projected wealth spanned sectors.

  "See?" he told Elara during the twelfth cycle review. "The drag is negligible. The growth absorbs the volatility."

  "The volatility is accumulating," Elara said, watching her own private monitor. Her red line was climbing, but slowly, a steady staircase compared to the vertical rocket of the main fleet. "You're increasing the bet size as the capital grows. The absolute risk per cycle is widening."

  "We are rich," Kael said. "Risk is a variable for the poor."

  Cycle eighteen brought a magnetic shear. The containment field flickered. The dip failed. The ship lost the wagered eighty percent of its mass instantly, vented into the star to stabilize the reaction.

  The room went silent. The green line on the main screen didn't drop; it was a static projection of expected value. But the real-time counter plummeted. They were down to twenty percent of their pre-cycle mass.

  "Reset," Kael ordered, his voice tight. "We still have positive expected value. We bet the remaining twenty percent. We win the next one, we recover."

  They won cycle nineteen. But because the bet size was now a fraction of a smaller principal, the gain was smaller. They were digging out of a hole where the shovel had shrunk.

  Cycle twenty-two brought another shear. Another loss. They were down to four percent.

  Kael stared at the screen. "The probability hasn't changed. The next win is still sixty percent."

  "The path dependence has changed," Elara said. She didn't look up from her console. Her reserve tank indicator was steady. Five percent of the original mass, compounded slowly over twenty cycles at a safe fraction. It was now larger than the main fleet's remaining four percent.

  "We need to leverage," Kael muttered. "Borrow against the future harvest. Maximize the expected return."

  "There is no future harvest if the principal is zero," Elara said. "The ensemble average says you should be a god. The time average says you are about to be dust."

  Cycle twenty-five was the end. A routine fluctuation in the corona, well within standard deviation, shouldn't have been fatal. But with the fleet stretched thin, trying to recapture the arithmetic mean, the margin for error was gone. The containment broke. The main fleet vaporized.

  The alarm klaxons died as the power grid severed. The main holotank flickered and went dark, taking the soaring green line with it.

  In the emergency lighting of the bunker, Elara sat alone. The air recyclers hummed, powered by the reserve tank she had sequestered. It wasn't a empire. It wasn't a Dyson swarm. It was a single ship, modest in size, but intact.

  She pulled up the logs from the dead mainframe. She overlayed the final trajectory of the main fleet against the projection Kael had championed. The divergence was absolute. The ensemble average ended in infinite wealth. The time average ended in a flatline at zero.

  She opened a channel to the deep-space relay, broadcasting the telemetry to Earth and the other colonies. She didn't include a warning. She didn't include a lecture on risk fractions or ergodicity. She simply attached the raw data: the bet sizes, the volatility, the sequence of wins and losses, and the final state.

  Let them look at the two lines. Let them see how the average of the many lies about the fate of the one.

  Elara engaged the engines. The reserve mass was enough to reach the next system, where they could begin again. Slowly. Safely. Multiplying only what they could keep. She watched the star recede in the rear view, a bright, indifferent eye that cared nothing for expectations, only for what remained.
