answer: |-
  The steam had stopped rising from the spout ten minutes ago. The kettle sat on the patio stones between them, a stainless steel monument to indecision.

  Maya crouched lower, her knees popping, the ladle hovering six inches over the mound. The anthill was a bustling city of red dirt, thousands of *Formica rufa* streaming in and out of the central crater.

  "You're going to cramp if you hold that pose much longer," Leo said. He was sitting cross-legged on the grass, watching the perimeter.

  "If I pour this, and they feel it... like, *really* feel it..." Maya didn't look up. "I'm not just killing them. I'm torturing a city."

  "We've been over the nociception versus pain distinction," Leo said gently. "They have nociceptors. They detect damage. That is a fact. But detection isn't suffering. A smoke alarm detects fire. It screams. It doesn't *fear*."

  "But the UK government didn't think that way about crabs," Maya countered. "Two years ago. The LSE review. They looked at the evidence and said, 'Actually, decapod crustaceans are sentient.' They banned boiling lobsters alive. If a crab with a ganglion brain gets protection, why does the ant get the kettle?"

  "Because the review explicitly excluded insects," Leo said. "They drew the line. And they drew it based on neural integration. A crab has a more centralized nervous system. It has the hardware for a unified experience. An ant? It's mostly decentralized. You cut off an ant's head, it can still sting you. Where is the 'self' in that? Where is the 'I' that is feeling the pain?"

  "That's the behavior argument, though," Maya said, shifting her grip on the handle. "We can't ask them. We have to look at what they *do*. There was that study last year—fruit flies with injured legs. They favored the leg. They groomed the injury. When given a choice between food and a place where they'd been shocked, they starved rather than go back. That's trade-off. That's motivation. That's not a reflex."

  Leo leaned forward, plucking a blade of grass. "It's sophisticated programming, Maya. You could build a robot that does exactly that. Program it to prioritize energy conservation over task completion if a sensor is tripped. If the robot limps, do you arrest the engineer for cruelty? Behavior is a black box. You're inferring a ghost inside the machine because the machine acts like it has one."

  "But why infer a ghost?" Maya snapped, finally looking at him. "Why infer a zombie? If it walks like pain, and quacks like pain, Occam's Razor says it's pain. The 'benefit of the doubt' costs me nothing. I just move the hill. If I'm wrong and they are zombies, I've wasted an hour of my life. If I'm wrong and they *feel*, I'm a monster. The stakes aren't equal."

  "That's Pascal's Wager for bugs," Leo smiled sadly. "But the cost *does* scale. If you apply that precautionary principle to anything with a nervous system, you can't garden. You can't walk on grass. You can't exist without causing potential suffering. You have to draw a line somewhere. The neuro-structuralists argue the line is at integration. Is there a central hub where all the signals meet and become a 'feeling'? Insects might just have parallel processing. A thousand tiny reflexes that look like a decision."

  "So because their wiring is efficient, they don't count?"

  "Because their wiring might be fundamentally different in kind, not just degree. Think about the colony, actually." Leo pointed at the mound. "Maybe the individual ant is just a cell. The sentient thing is the hill. The colony reacts, learns, wages war, farms aphids. If anything is feeling the boiling water, it's the superorganism. But even then... is it feeling *pain*, or is it just correcting an error in the system?"

  Maya lowered the ladle an inch, then stopped. "If the colony feels it, pouring this water is an act of war against a sentient entity. If the individual feels it, it's mass torture. If neither feels it, it's pest control. I'm stuck on the 'if'."

  "And I'm stuck on the 'why'," Leo said. "Why does the behavior convince you? You know how easily biology is fooled. A parasitic fungus can make an ant climb a leaf and die. The ant's brain is hijacked. If the hardware can be overwritten by a spore, how robust is the 'self' inside it really?"

  "Because I have hardware too," Maya said, her voice quiet. "My brain is just chemistry. If a drug hijacks me, does my pain stop being real? The fact that the system is hackable doesn't mean the experience isn't happening."

  Leo sighed, rubbing his neck. "Fair. But consider the alternative. If we grant sentience based on avoidance learning, we have to treat insects with rights comparable to vertebrates. We'd have to harvest crops differently. We'd have to rethink pest control globally. The societal burden is massive. Usually, when the burden of proof is that high, we require more than 'it looks like it hurts.' We want the neural correlates of consciousness. And insects... they're so small, Maya. The brain is a speck. Is there room in there for a movie screen?"

  "Room isn't the issue. Density is," Maya said. "And you're arguing from ignorance. We don't know what the minimum requirement is. We barely know what consciousness is in humans. To say 'it's too small to feel' feels like the same logic people used for babies, or animals, centuries ago. 'They don't have a soul,' 'They don't have a cortex.' Now it's 'They don't have a subesophageal zone integration.' It keeps moving."

  "I'm not saying they don't feel," Leo corrected. "I'm saying we don't know. And 'we don't know' isn't the same as 'assume yes.' If you assume yes, you paralyze yourself. Look at you. You've been standing over that hill for two weeks. The ants have built three new tunnels in that time. Your inaction is also a choice."

  Maya looked down. The ants were indeed swarming a dead beetle near the base, tearing it apart with mechanical efficiency. "If I pour, I risk being cruel. If I don't, I let them undermine the patio foundation."

  "There's a third option," Leo said. "Dig them up. Relocate them."

  "It's August. The ground is baked hard. I'd kill half of them in the excavation anyway."

  "Collateral damage," Leo said. "Versus intentional execution."

  "Does intent matter to the ant?"

  "No. But it matters to you."

  Maya stared at the kettle. The water inside was lukewarm now. Useless for killing, useless for tea. "The LSE report said evidence for insect sentience was 'weak.' But 'weak' isn't 'none.' It just means we haven't looked hard enough because they're small and annoying."

  "Or it means they are biological machines," Leo said. "And we are projecting empathy onto complexity because we're human and that's what we do. We see faces in clouds. We see pain in reflexes."

  "And what if the cloud sees us?" Maya asked.

  Leo didn't answer. He watched a single ant climb the side of the cold kettle, explore the steel, and turn back.

  "If I pour," Maya said, "I break the uncertainty. I force a truth. If they scream internally, I know. If they don't, I know. But I can't unknow it."

  "If you don't pour," Leo said, "you live in the uncertainty. Which is heavier?"

  Maya lifted the kettle. The weight of it was familiar. The water sloshed gently. The ants below didn't scatter; they couldn't sense the threat yet. They were just working.

  "I hate that the line is drawn in sand," she said.

  "I hate that we have to draw it at all," Leo replied.

  Maya held the kettle there for a long moment. The shadow of the spout fell over the main entrance. The ants marched into the shadow and out the other side, unchanged.

  Slowly, she set the kettle back down on the stone. The metal clinked.

  "It's cold now," she said.

  "Yeah."

  "I can't do it today."

  "Okay."

  "I might come back tomorrow with fresh water."

  "Okay."

  "And you'll still be here?"

  Leo leaned back on his hands, watching the hill. "Someone has to witness the trial."

  Maya stood up, brushing dirt from her knees. She didn't pick up the kettle. They left it there, steaming nothing into the summer air, while the ants continued to build around it.
