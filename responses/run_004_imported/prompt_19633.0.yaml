answer: |-
  You are absolutely not being weirdly rigid, and you are not wrong for feeling conflicted. What you are experiencing is one of the most common and painful ethical dilemmas families face when caring for someone with dementia.

  That "bugging" feeling you have? It comes from a good place. It comes from your love for your grandfather, your respect for your grandmother's intelligence, and your own personal integrity. In almost every other context in life, lying to a loved one is a betrayal.

  However, dementia changes the rules of engagement. Here is a breakdown of why the care staff is suggesting this, why it feels wrong to you, and how you might find a middle ground that lets you sleep at night.

  ### 1. The Brain Chemistry of "The Truth"
  When you tell your grandma the truth ("Grandpa died three years ago"), you are operating under the assumption that her brain can process, file, and accept that information. In advanced dementia, that mechanism is broken.

  To her, the news isn't "old news." Her brain has no file for "Grandpa is dead." Every time you tell her, her brain processes it as **breaking news**.
  *   **The Impact:** You aren't reminding her of a loss; you are causing a *new* loss.
  *   **The Analogy:** Imagine if someone punched you in the stomach every time you asked where your spouse was. Telling the truth in this context isn't honesty; it is inflicting fresh trauma on a loop.

  ### 2. "Therapeutic Fibbing" vs. Lying
  In the world of dementia care, what the staff is suggesting has a name: **Therapeutic Fibbing.**

  A standard lie is told for the benefit of the liar (to avoid trouble, to gain advantage). A therapeutic fib is told solely for the emotional safety of the listener.
  *   **Intent:** The intent isn't deception; it is pain management.
  *   **Reality Orientation:** For a long time, caregivers tried "reality orientation" (constantly correcting the patient). Studies showed this increases agitation, anxiety, and withdrawal without improving cognition.

  You feel like you are compromising your integrity. But in this specific medical context, you are prioritizing **compassion over accuracy.**

  ### 3. Why It Still Feels Wrong (And How to Handle It)
  Even knowing the logic, it can feel like you are erasing your grandfather's existence or treating your grandmother like a child. Here is how to reframe that:

  *   **You aren't erasing Grandpa:** Your grandmother carries the *feeling* of Grandpa (love, safety, partnership) even if she can't recall the *fact* of his death. By sparing her the panic of his absence, you are protecting the *feeling* of love she has for him.
  *   **You aren't patronizing her:** You are accommodating a disability. If she were blind, you wouldn't insist on describing visual details she can't see. Her memory is the disability here.

  ### 4. A Middle Ground: Validation Therapy
  If saying "He's at work" feels too much like a lie to you, there is a third option often used by therapists called **Validation Therapy.** This focuses on the *emotion* behind the question rather than the *fact*.

  When she asks, "When is Grandpa coming home?" she is usually expressing: *I feel lonely, I feel unsafe, or I miss my partner.*

  Instead of answering the "when," answer the feeling:
  *   **"You miss him a lot, don't you?"**
  *   **"He was such a good man. What was your favorite thing to do with him?"**
  *   **"I know you want him here. I'm here with you though."**

  Sometimes, simply acknowledging the longing allows them to let go of the specific question. However, if she is in a stage where she fixates (as you mentioned), Validation might not break the loop. In that case, a gentle "He'll be back later, let's have some tea" (the therapeutic fib) might be the only way to stop the anxiety spiral.

  ### 5. It's Okay to Grieve the Honesty
  It is important to acknowledge that **this is hard on you, too.**
  Having to lie to your grandma is a loss. It signifies how far the disease has progressed. It feels like a betrayal of the relationship you used to have, where honesty was the norm.

  It is okay to feel sad that you can't be honest with her anymore. That sadness shows how much you respect her. But try to view it this way: **You are the keeper of the truth so she doesn't have to carry it.**

  You hold the knowledge that Grandpa is gone. You hold the knowledge that he loved her. You carry the burden of reality so she can rest in a version of the world where she is still safe and he is still coming home. That isn't rigidity; that is a profound act of love.

  ### Summary
  *   **You aren't wrong:** Your discomfort is normal and shows your integrity.
  *   **The truth hurts:** Telling her the truth causes active, repeated grief without any cognitive benefit.
  *   **The "lie" is medicine:** Think of "He's running errands" not as a falsehood, but as a prescription for anxiety.
  *   **Try Validation first:** If you can, pivot to talking about her feelings of missing him. If that fails, use the gentle fib to break the cycle.

  You are doing a hard thing in a really loving way. Give yourself grace for struggling with it.
