          *   *Refinement:* Make it about the "fundamental problem" of ethics.
      *   *Q2: The Dualism.* Bring in the specific philosophical problem.
          *   *Idea:* You say egoism and utilitarianism clash. Does life after death fix this?
          *   *Refinement:* Press on whether "survival" equals "cosmic justice."
      *   *Q3: Prudence vs. Morality.* The prompt specifically asks about this.
          *   *Idea:* If I'm good just to get a reward later, isn't that just egoism?
          *   *Refinement:* Frame it as transforming the *nature* of the obligation.
      *   *Q4: Rigor vs. Desire.* Why be so strict if you *want* it to be true?
          *   *Idea:* You were very hard on mediums. Why?
          *   *Refinement:* Connect the strict methodology to the stakes. If the evidence is weak, the ethical foundation crumbles.
      *   *Q5: The Census of Hallucinations.* Specific SPR project.
          *   *Idea:* Tell us about the census.
          *   *Refinement:* Focus on the statistical approach. Why treat spiritual experience like data?
      *   *Q6: Null Results.* Addressing the failure.
          *   *Idea:* You didn't find much. Did you give up?
          *   *Refinement:* Focus on the psychological toll of decades of ambiguity.
      *   *Q7: Eusapia Palladino.* The specific scandal mentioned in the prompt.
          *   *Idea:* What about the cheating medium?
          *   *Refinement:* How do you reconcile fraud with the hope for truth? Does fraud make the truth *more* necessary?
      *   *Q8: The "Dispassionate" Mask.* Challenging his objectivity.
          *   *Idea:* You say you're neutral. Are you?
          *   *Refinement:* Point out the "ethical need." Is the neutrality a shield?
      *   *Q9: Theological Implications.* God vs. Ghosts.
          *   *Idea:* Do we need God for this?
          *   *Refinement:* Is a "moral order" possible without a divine enforcer, just via survival?
      *   *Q10: Closing/Final Verdict.*
