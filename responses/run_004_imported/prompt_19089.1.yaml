answer: |-
  This is a fantastic observation, and you're right to look past the standard "extrinsic motivation kills intrinsic drive" explanation. That's true, but it's a bit abstract for a tired parent trying to solve a Tuesday night meltdown.

  Here is a different framework to offer your friend, along with specific shifts she can make.

  ### The Reframe: It's Not a Motivation Problem, It's a "Moral Outsourcing" Problem

  The standard view is that the kid *lost* his internal motivation. A more accurate view is that he has **outsourced his moral decision-making to the system.**

  At 7, kids are entering a stage of cognitive development where they start understanding rules, fairness, and exchange. Your friend's reward system taught him a very specific lesson: *Behavior is a currency.*

  When he calculates, "Is acting up worth losing the iPad?", he isn't being defiant; he is being **rational within the economy she created.** He is acting like a perfect employee in a corporation. If the bonus isn't high enough, he doesn't do the work.

  **The Disconnect on Approval:**
  You mentioned he still cares what she and the teacher think. This is the key. He wants to be *seen* as good, but the reward system has separated "being good" from "doing good."
  *   **Old System:** I act well -> I get a sticker -> I am good.
  *   **Current Reality:** I act well -> I get a sticker. (The "I am good" part has been replaced by "I am paid.")

  He cares about their opinion, but in the heat of the moment, the **concrete penalty** (no iPad) is louder than the **abstract signal** (Mom is disappointed). The transactional noise is drowning out the relational signal.

  ### The Shift: From "Manager/Employee" to "Coach/Teammate"

  The goal isn't just to remove the stickers (which can cause withdrawal panic); it's to change the **locus of control.** Right now, Mom holds all the control (she gives/takes rewards). He is passive. To build internal values, he needs agency.

  Here are three concrete shifts she can try:

  #### 1. Switch from "Judgment" to "Noticing" (Narrative Feedback)
  Stickers and punishments are judgments. They shut down reflection. Instead, she needs to narrate the behavior and its impact. This connects the action to the *relationship*, which he cares about.

  *   **Instead of:** "Great job on your homework, here's a sticker."
  *   **Try:** "I noticed you sat down and focused on that math sheet even though it looked hard. That kind of persistence is what helps you learn."
  *   **Instead of:** "No iPad because you were rude."
  *   **Try:** "When you speak to me that way, it makes me feel disrespected and I don't want to be around it. I'm going to go to the other room until we can talk kindly."

  **Why this works:** It feeds his desire for approval without making it transactional. It links his behavior to how it affects *people*, not how it affects his *privileges*.

  #### 2. Collaborative Problem Solving (The "How" not the "What")
  At 7, he is old enough to help set the standards. If he helps write the rules, he is less likely to treat them like a price list.

  *   **The Meeting:** Sit down when things are calm. "We've noticed the sticker chart isn't really helping us get along better. It feels like we're always negotiating. Let's scrap it."
  *   **The Question:** "We need to figure out how to handle mornings so we aren't yelling. What do you think is a fair plan?"
  *   **The Catch:** If he suggests something too easy, push back gently. "If we do that, we'll still be late. What else?"

  **Why this works:** It moves him from an employee following orders to a stakeholder in the family culture. It's harder to break a rule you helped write.

  #### 3. Logical Consequences vs. Punitive Penalties
  Taking the iPad away for "acting up" is punitive (and unrelated). It reinforces the transaction ("I paid the price, now I'm clear"). Logical consequences restore the balance.

  *   **Scenario:** He throws a toy when angry.
  *   **Punitive:** No iPad tonight. (Transaction: I threw a toy, I paid with screen time. Debt cleared.)
  *   **Logical:** The toy is unsafe when thrown. It needs to go on the shelf for a day until you can show me you can play safely with it. Also, please help me pick up the blocks you knocked over.
  *   **Scenario:** He refuses to do homework.
  *   **Punitive:** No TV.
  *   **Logical:** Homework needs to be done before free time. Since you chose not to do it at 4 PM, you'll need to do it at 6 PM, which means you miss the start of your favorite show.

  **Why this works:** It removes the "price tag" and replaces it with cause-and-effect. It's not "Mom is punishing me," it's "My choice led to this result."

  ### The "Withdrawal" Warning
  Tell your friend to expect things to get worse before they get better. If she removes the sticker chart, he may test the boundaries aggressively to see if the "currency" is still in play. He might act out specifically to see if she'll revert to the old system.

  She needs to hold the line not with anger, but with boredom. "I know you're used to the stickers. We aren't doing that anymore. We're just figuring out how to be a family that helps each other."

  ### Summary for your friend
  *   **The Diagnosis:** He isn't being bad; he's playing the game you designed perfectly. The game just has the wrong objective.
  *   **The Goal:** Move from **Compliance** (doing it for the reward) to **Contribution** (doing it because I'm part of the team).
  *   **The Tactic:** Stop paying for behavior. Start noticing effort. Involve him in solving the problems his behavior creates.

  This approach leverages the fact that he *does* care about what they think. It just requires turning down the volume on the transactions so he can hear the relationship again.
