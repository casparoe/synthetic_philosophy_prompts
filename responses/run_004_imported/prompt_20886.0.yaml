answer: |-
  **1.**
  **Marcus:** I thought I'd find you out here. Hiding from the casserole brigade?

  **2.**
  **Elena:** Just catching my breath. That eulogy was heavier than it needed to be. I think I offered the sister a bit too much theology when she just wanted a tissue.

  **3.**
  **Marcus:** I heard. "Gone to a better place." You said it like you were stating a coordinate. Did you mean it as a hypothesis? Like, if we had the right telescope, we could locate her?

  **4.**
  **Elena:** You know I don't treat it like a weather forecast, Marcus. It's not a claim about spatial location. It's a way of framing the loss so it doesn't crush her.

  **5.**
  **Marcus:** But that's the move, isn't it? The moment the evidence gets thin, the belief shifts from "this happened" to "this is useful." It's the Wittgensteinian shield.

  **6.**
  **Elena:** It's not a shield. It's a description of the grammar. When she says "she's with God," she isn't making a failed scientific claim. She's expressing a commitment to a certain form of life.

  **7.**
  **Marcus:** Is she? Because if you asked her five minutes ago, she'd say Christ actually rose from the dead. Full stop. Not "I'm adopting a picture." She thinks she's talking about reality.

  **8.**
  **Elena:** She is talking about reality. Just not the slice of reality your methods are equipped to measure. The resurrection isn't a medical anomaly to be verified; it's the axis on which her world spins.

  **9.**
  **Marcus:** That sounds lovely, but Kai Nielsen called this out forty years ago. It lets believers off the hook. If belief is just a "form of life," you can never be wrong. You've insulated it from criticism.

  **10.**
  **Elena:** I haven't insulated it. I've just stopped you from playing tennis with a football. You're grading a moral commitment against empirical data. That's the category error.

  **11.**
  **Marcus:** But the commitment *depends* on the data! If the tomb wasn't empty, if the body didn't rise, the whole form of life collapses. They know that. That's why they argue for historical evidence.

  **12.**
  **Elena:** They argue for evidence because they've accepted your terms, not because the belief requires it. The certainty comes from the practice, the prayer, the community. The history is secondary scaffolding.

  **13.**
  **Marcus:** So it's self-sealing. If the history fails, you say "history doesn't matter." If the history works, you say "see, proof." You get to have it both ways. That's intellectually dishonest.

  **14.**
  **Elena:** It's not dishonest to recognize that "truth" functions differently in different contexts. Is a poem false because its metaphors aren't literally true? Is love false because you can't weigh it?

  **15.**
  **Marcus:** Love has behavioral outputs we can observe. Religious belief makes claims about the structure of the universe. If I say there's a teapot orbiting Mars, you don't ask me what "form of life" that regulates. You ask for evidence.

  **16.**
  **Elena:** Because the teapot is an idle hypothesis. It changes nothing. The Last Judgment changes everything. It dictates how you treat the widow inside. That's its verification.

  **17.**
  **Marcus:** But it only dictates that if you think the Judgment is *real*. If it's just a regulating fiction, why not pick a nicer fiction? Why this one? Because they think it's *true* in the hard, realist sense.

  **18.**
  **Elena:** Maybe "real" is bigger than your ontology allows. I'm not saying she's imagining it. I'm saying that what's real about it isn't captured by "did the cells regenerate?"

  **19.**
  **Marcus:** We've been having this argument since grad school. You want to save the belief by stripping it of its content. I want to test the content to see if the belief survives.

  **20.**
  **Elena:** And you think testing it destroys it. I think understanding it saves it. But... the wine is warm, and the sister is still inside. Maybe we let the dead rest without dissecting them?

  **21.**
  **Marcus:** *(Sighs, loosening his tie)* Fair enough. I didn't mean to turn the reception into a symposium.

  **22.**
  **Elena:** You never do. You just can't help yourself when the stakes are high.

  **23.**
  **Marcus:** Neither can you. You just defend a different side of the same silence.

  **24.**
  **Elena:** Come on. Let's go back in. I'll let you have the last word on the empirical data if you let me have the last word on the meaning.

  **25.**
  **Marcus:** Deal. But I'm still thinking the teapot argument holds water.

  **26.**
  **Elena:** And I'm still thinking you're missing the point of the cup.
