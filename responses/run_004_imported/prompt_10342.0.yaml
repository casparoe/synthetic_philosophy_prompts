answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], the best man. For those who *do* know me, you know I've been strictly advised by the groomsmen not to turn this into a seminar. But when you're best friends with a semi-pro poker player who once calculated the optimal bet sizing for our office Secret Santa gift exchange… well, you have to acknowledge the math.

  Marco is famous for one thing: The Kelly Criterion. For the uninitiated, it's a formula that tells you how much to bet to maximize your wealth over a lifetime without going broke. For the last decade, if Marco had a dollar and an edge, he didn't just want to win the hand; he wanted to make sure he was still at the table tomorrow.

  Now, Divya, who trades options for a living, told me I should just make the obvious joke. She said, "Marco is getting married. Just tell everyone he's finally going 'All In.' It's one bet, it's romantic, sit down."

  And logically, she's right. In finance terms, marriage looks like a single, binary event. But Marco taught me that's not how life works. In poker, you can calculate the "ensemble average"—the average outcome across a million parallel universes where you play the hand a million times. But you don't live in a million universes. You live in one. You experience the "time average." You live the sequence.

  If you bet too aggressively, even on a good hand, a string of bad luck wipes you out. You go to zero. And in life, unlike poker, you don't get to rebuy.

  That is why Marco's obsession with Kelly isn't just risk aversion with better branding. It's about survival. It's about recognizing that to win the long game, you have to protect yourself from ruin.

  And that is the perfect framework for this marriage.

  Because Marco, you aren't just betting on today. You are committing to a lifetime of compounding. And anyone in this room who trades knows that compounding is the most powerful force in the universe, but it has one requirement: You cannot interrupt it.

  Divorce is "ruin." It's going to zero. It stops the compounding. So the Kelly strategy for a marriage isn't about maximizing the excitement of any single day. It's about sizing your ego, your patience, and your expectations so that when the inevitable volatility hits—and it will—you don't blow up the account.

  It means knowing that even when you have the "edge"—even when you're right in an argument—betting your whole stack on being right is a losing strategy. It means fractional betting. It means leaving room for error. It means protecting the bankroll of trust so that the love has time to grow.

  Marco, you've spent twelve years calculating edges. But [Partner's Name], you are the first bet where the math doesn't matter because the value is infinite. You are the edge that makes every other bet worth taking.

  So, I'm not going to wish you luck. Luck is for people who don't have a strategy. Instead, I'll wish you what Marco actually cares about.

  May your volatility be low. May your drawdowns be shallow. May you never risk ruin, and may you stay at the table long enough to see just how much this love can compound.

  Please raise your glasses. To Marco and [Partner's Name].
