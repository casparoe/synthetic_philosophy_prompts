      *   *The "Irrelevance" Assumption:* The intuition that $P(R)$ stays fixed assumes that the mechanism determining $R$ vs. $B$ is independent of the mechanism determining $H_1$ vs. $H_2$ within $R$. MinXent assumes we know nothing about that independence.
