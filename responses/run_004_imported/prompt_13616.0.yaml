  9.  (Self-Correction during drafting): Make sure not to sound like I'm lecturing them on lab safety. They know that. Frame it as "Decision Theoretic implications for Lab Protocols."

  10. **Final Polish:** Check for clarity and flow. Ensure the distinction between the theoretical problem (AMD) and the practical application (Lab) remains clear. (The AMD problem is unsolvable *without* changing the constraints; the Lab problem is solvable by changing constraints).

  *(Self-Correction on the "Exactly One" point)*: If I need to spike exactly one tube in a series of 10, and I lose track, I'm in trouble. AMD suggests that if I can't distinguish, I should have a probabilistic strategy *if* I'm forced to guess. BUT, in the lab, guessing is unacceptable. So the implication is: **Design the system so you never have to guess.** This is the "Mechanism Design" angle.

