answer: |-
  Based on Michael Dummett's philosophical framework in *On Immigration and Refugees*, particularly his distinctions between the "submersion" threshold, the presumption in favor of refugees, and the diagnosis of racial prejudice in legislation, it is highly probable that he would have judged the Rwanda scheme and the "Stop the Boats" rhetoric as **another instance of the racism and exclusion he diagnosed in earlier legislation**, rather than a legitimate invocation of a state's rights.

  Here is the reasoning based on Dummett's specific distinctions:

  ### 1. The "Submersion" Threshold vs. Rhetorical Crisis
  Dummett grants states a *limited* right to restrict immigration to prevent the host culture from being "submerged." However, he treats this as a high bar involving genuine demographic or cultural capacity limits.

  *   **Dummett's Distinction:** The right to exclude exists only if the influx threatens the cohesion or identity of the receiving society to a significant degree.
  *   **Application to "Stop the Boats":** The rhetoric surrounding small-boat crossings frames the arrivals as an existential threat or an "invasion." However, statistically, small-boat arrivals (peaking around 45,000 in 2022) represent a tiny fraction of the UK's population (approx. 67 million) and an even smaller fraction of total net migration.
  *   **Judgment:** Dummett would likely argue that the "submersion" clause is not triggered by these numbers. Consequently, invoking the state's right to protect its borders against "submersion" in this context would be viewed as a pretext. If the capacity to absorb refugees exists (which the numbers suggest it does), the "limited right" to exclude cannot be legitimately claimed.

  ### 2. The Presumption in Favor of Refugees
  Dummett draws a sharp moral line between economic migrants and refugees. For refugees, there is a "strong presumption" of admission. The burden of proof lies on the state to provide "specific and weighty reasons" for refusal.

  *   **Dummett's Distinction:** Refugees are not choosing a better life; they are fleeing harm. Therefore, procedural barriers or deterrents that apply to migrants cannot justly apply to refugees without overriding moral justification.
  *   **Application to the Rwanda Scheme:** The Rwanda policy was designed to remove asylum seekers *before* their claims were fully adjudicated in the UK, effectively penalizing the mode of arrival. It inverted Dummett's presumption: instead of "admit unless there is a weighty reason," the policy operated on "remove unless you can prove your claim in a third country."
  *   **Judgment:** Dummett would likely view this as a violation of the strong presumption. Unless the UK could prove that hearing claims domestically was impossible (which the courts and the eventual abandonment of the scheme suggest it was not), outsourcing the obligation to a third country shirks the specific moral duty owed to refugees. The "weighty reason" of deterrence (stopping smugglers) punishes the refugee for the smuggler's crime, which Dummett would likely find morally insufficient to override the refugee's right to safety.

  ### 3. The Diagnosis of Racism and Pretext
  Dummett's historical analysis of British immigration law (such as the Commonwealth Immigrants Acts) concluded that legislation was often driven by racism disguised as administrative necessity. He looked for discrepancies between the *stated* reason for a law and its *actual* demographic impact.

  *   **Dummett's Distinction:** Legitimate concerns are consistent and broadly applied. Racist exclusion is selective, targeting specific groups while ignoring others that pose similar administrative challenges.
  *   **Application to the Policy:** The "Stop the Boats" focus is highly selective. It targets irregular channel crossings (disproportionately people from the Middle East, Africa, and Asia) while largely ignoring visa overstayers (a larger group, demographically more diverse, including many Europeans and wealthier nationals).
  *   **Judgment:** Dummett would likely identify this selectivity as the hallmark of the racism he diagnosed in the 20th century. If the concern were genuinely about "control" or "rule of law," the policy would address all forms of irregular status. By focusing intensely on a visible, impoverished, and non-white group of arrivals, the rhetoric and policy serve a political function of exclusion rather than a genuine administrative one. The fact that the scheme was abandoned in 2024 without a single flight supports Dummett's suspicion that such measures are often performative signals of hostility rather than genuine solutions to capacity issues.

  ### 4. Procedural Justice and Moral Consistency
  Dummett was a philosopher of language and logic who valued clarity and fairness in systems. He argued that if a state claims to uphold human rights, its procedures must reflect that commitment.

  *   **Dummett's Distinction:** A state cannot claim moral authority while designing systems intended to make justice inaccessible.
  *   **Application:** The Rwanda scheme relied on the legal fiction that Rwanda was a "safe third country," a claim repeatedly challenged in courts. It also created massive logistical barriers for asylum seekers to access legal counsel and evidence gathering in the UK.
  *   **Judgment:** Dummett would likely argue that creating a system designed to be legally fraught and practically difficult for the asylum seeker violates the requirement for "specific and weighty reasons." If the primary goal is to make the process so arduous that refugees give up or go elsewhere, the state is acting in bad faith.

  ### Conclusion
  Michael Dummett would likely conclude that the Rwanda scheme and "Stop the Boats" rhetoric fail the test of legitimacy on two fronts:
  1.  **Failure of Necessity:** The numbers do not justify the "submersion" exception.
  2.  **Failure of Good Faith:** The selectivity of the enforcement and the inversion of the refugee presumption mirror the racial exclusion he identified in postwar legislation.

  He would argue that the UK was not exercising a **legitimate right** to protect its cohesion, but rather engaging in **moral evasion**, using the language of sovereignty to mask a refusal to honor obligations toward vulnerable, predominantly non-white populations. To Dummett, the "weighty reasons" required to refuse a refugee were not present; therefore, the policy stands as a continuation of the exclusionary politics he spent his later years critiquing.
