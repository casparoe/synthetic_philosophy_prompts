answer: |-
  **Setting:** *A modular field office overlooking the Northern Ridge Restoration Zone. Maps are spread across a metal table. Outside, the wind whips through sagebrush. Two advisory board members, ELENA and MARCUS, are the last ones left before the final vote on the wolf reintroduction proposal.*

  **ELENA:** (Tracing a red line on the topo map) The modeling suggests the elk herd will drop by forty percent in the first three years. Most of that mortality won't be clean. It's going to be gutting, chasing, panic. And that's just the macro-fauna. If we destabilize the mesopredator population, we ripple down to the rodent and insect levels.

  **MARCUS:** And if we *don't* reintroduce, the elk overbrowse the riparian zones. The beavers leave. The songbirds lose habitat. The system simplifies. It becomes a monoculture of starving herbivores eating themselves out of house and home.

  **ELENA:** I'm not arguing for the status quo, Marcus. I'm arguing that "ecological health" is a metaphor that bleeds when you poke it. Health belongs to an organism. A landscape doesn't feel pain. The elk do. The mice do. If we trigger a trophic cascade, we are actively engineering a net increase in suffering to satisfy an aesthetic of "wildness."

  **MARCUS:** You're framing this as engineering. I'm framing it as restitution. We broke the web; we're putting the strand back.

  **ELENA:** A web made of nerves. Look, I've read the Ng papers. I know the calculus is grim. Nature is an r-selected factory. Most things born die immediately. But that doesn't mean we get to add more predation pressure and call it "virtue." If I have a button that increases the total amount of chewing-and-being-chewed in this valley, I need a hell of a justification. "Ecological integrity" isn't a unit of suffering.

  **MARCUS:** And "aggregate hedonic tone" isn't a unit of value. That's the crux, Elena. You're trying to sum a trillion distinct experiences into a single integer. "Net suffering." Do you really believe a beetle's panic weighs the same as an elk's? Or even that it *can* be weighed on the same scale?

  **ELENA:** I believe sentience is the threshold for moral consideration. If it has a nervous system capable of valence, it counts. Maybe we weight by neural density, maybe we don't. But ignoring the sum because the math is hard is just convenient.

  **MARCUS:** It's not that the math is hard; it's that the equation is wrong. You're treating the biotic community as a bucket of individuals. But value isn't located in the bucket. It's located in the *relationships*. The wolf isn't valuable because it feels good or bad; it's valuable because of what it *does* in relation to the elk, the willow, the river. If you reduce the wolf to a suffering-machine, you've lost the wolf entirely.

  **ELENA:** That sounds beautiful until you ask who pays for the poetry. The elk pays. The individual is being sacrificed for the "relationship." Callicott tried to square this, but let's call it what Regan called it: environmental fascism. The good of the ecosystem trumps the rights of the individual. If we were talking about human citizens, you'd be arrested.

  **MARCUS:** (Leans back, crossing arms) "Fascism." The charge always comes up. But fascism implies a state apparatus imposing a will upon subjects who have no organic connection to the state. The biotic community isn't a state. It's a family. And in a family, the survival of the whole is the condition of the possibility of the parts.

  **ELENA:** That's a category error. An elk isn't a cell in a superorganism. It's a subject-of-a-life. It wants to not die.

  **MARCUS:** And it *will* die. That's the tragedy you're ignoring. You seem to think death is the failure condition. In ecology, death is a nutrient transfer. By fetishizing the individual's avoidance of pain, you're advocating for a sterile world. A zoo. Is that your goal? A pain-minimized petting zoo where nothing eats anything?

  **ELENA:** My goal is to reduce suffering where we have leverage. If we are intervening to reintroduce wolves, we are intervening. We are not "leaving it alone." Neutrality is a myth. So if we are touching the dial, why turn it toward more violence? Why not intervene to help the elk survive? Sterilization, contraception, buffer zones?

  **MARCUS:** Because that's micromanagement. It's hubris. You think you can manage the suffering of a wild system without collapsing the system that generates the value in the first place? You want to optimize the hedons, I want to preserve the integrity.

  **ELENA:** Integrity is a proxy. Suffering is the reality.

  **MARCUS:** No. Suffering is a signal. It tells the organism it is damaged. It tells the prey it is vulnerable. It drives evolution. If you smooth out the rough edges, you stop the engine.

  **ELENA:** Evolution doesn't care. It's blind. Why should we be blind too? Just because suffering has a function doesn't mean it's good. Cancer has a function—cellular replication gone rogue. We treat cancer.

  **MARCUS:** But you can't treat the ecosystem like a tumor without killing the patient. Here is my question for you, Elena: You talk about the "trillion sentient-ish insects." How confident are you in that aggregation? If you're wrong about the moral weight of a grasshopper, your entire utility calculus collapses. You're willing to torch the integrity of the landscape based on a speculative sum of invertebrate hedons.

  **ELENA:** And you're willing to guarantee the visceral terror of a mammal based on a metaphysical notion of "community." At least I'm trying to count the pain. You're just worshipping the pattern.

  **MARCUS:** I'm not worshipping. I'm acknowledging that I am a member of the community, not its manager. When you sum hedons, you place yourself outside the system, looking down with a ledger. When I look at the wolves, I see myself as part of the food web. That humility checks my interventionism.

  **ELENA:** Humility doesn't stop the blood. Look, we're not going to resolve the ontology of value today. But I need to know: If the data came back that the wolves would cause a net increase in intense suffering—say, prolonged starvation for the pups because the elk are too scarce—would you vote no? Or is the "integrity" of having wolves there worth any price?

  **MARCUS:** (Pauses, looks out the window at the ridge) If the system collapses, there is no integrity. So yes, there is a limit. But the limit isn't "individual pain." The limit is "systemic sustainability." If the wolves starve, the project fails. If the elk vanish, the project fails. But within the bounds of a functioning system... yes. I accept the predation. I accept the death. It is the cost of belonging to a living world.

  **ELENA:** And I accept that I can't stop all of it. But where I can vote to not *add* to it, I will. You see a community; I see a crowd of victims.

  **MARCUS:** And you see a ledger; I see a story.

  **ELENA:** (Picks up her pen) Then we're not voting on the same proposal.

  **MARCUS:** No. We're voting on which tragedy we prefer.

  *(Elena marks her ballot "No." Marcus marks his "Yes." They slide the papers into the stack without looking at each other.)*
