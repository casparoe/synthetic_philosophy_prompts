      *   *Marcus:* You're counting hedons like beans. Is a beetle's death equal to an elk's?
      *   *Elena:* Sentience is the metric. If they feel, they count.
      *   *Marcus:* That's the reductionism. Value emerges from the web, not the thread.
      *   *Elena:* That sounds like "the State matters more than the citizen." That's the fascism charge.
      *   *Marcus:* No, it's about citizenship in the biotic community. You can't have rights without a community to hold them.
      *   *Elena:* So the individual is expendable for the "community"?
      *   *Marcus:* The individual *is* the community, temporally extended.
      *   *Climax:* They realize they don't share a common currency of value.
      *   *Resolution:* They vote according to their lights, acknowledging the impasse.

  7.  **Polishing:**
