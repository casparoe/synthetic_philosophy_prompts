      *   **Round 1: The Core Conflict.** Elena raises the suffering issue immediately. Marcus counters with ecological integrity.
      *   **Round 2: The Aggregation Objection (Welfarist Challenge).** Marcus pushes back on the math. Is it really about summing hedons? What about the uncertainty of insect sentience? The "trillion insects" problem.
      *   **Round 3: The Fascism Charge (Holist Challenge).** Elena presses the "individual rights vs. collective good" angle. Is this just sacrificing the few for the many? Marcus needs to defend against "fascism."
      *   **Round 4: Deepening the Crux.** Move beyond policy to metaphysics. What is value? Where does it reside?
