  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did Elena just lecture? *Fix:* Make sure Marcus interrupts and challenges the premise of her calculation.
      *   *Check:* Did Marcus just say "Nature knows best"? *Fix:* Give him a principled ethical defense, not just an appeal to nature. He needs to address the "fascism" label directly.
      *   *Check:* Is the wolf example specific enough? *Fix:* Mention elk, trophic cascades, specific suffering vs. system health.
      *   *Check:* The "Unit of Account" objection. Marcus should argue that summing suffering across species is category error, not just hard math.
      *   *Check:* The "Fascism" objection. Elena needs to press hard here. Marcus should argue that "fascism" implies a state apparatus imposing will, whereas ecology is about *relationships* and *belonging*.

  6.  **Writing the Dialogue (Iterative Process):**
