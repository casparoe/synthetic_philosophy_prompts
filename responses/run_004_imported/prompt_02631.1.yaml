answer: |-
  **Setting:** *A university coffee shop, late afternoon. Two graduate students, Elena (defending an Etiological/Selected Effects account) and Carlos (defending a Causal-Role/Systemic account), are reviewing notes for a seminar on teleology.*

  **Carlos:** Look, the malleus and incus case should settle this. In the modern mammal, these bones contribute causally to the capacity of the auditory system to transmit vibrations. They are components in a mechanism. If I'm analyzing the auditory system, their function is sound transmission. Full stop. Why complicate it with deep time?

  **Elena:** Because "what it does" isn't the same as "what it's for." If you stick strictly to causal roles, you lose the distinction between function and mere effect. Consider the transitional synapsids, something like *Morganucodon*. They had a dual jaw joint. The articular and quadrate bones were *still* part of the jaw, but they were also transmitting sound vibrations to the stapes. On your view, did those bones have the function of hearing *then*?

  **Carlos:** In the context of an analysis of their auditory capacity? Yes. They were contributing to that capacity.

  **Elena:** But they hadn't been selected for that yet. They were jaw bones that *happened* to transmit sound. If you ascribe the function of hearing to the ancestral jaw joint, you're saying the trait existed *for* hearing before natural selection acted on it for hearing. That's magic. It treats the utility as preceding the evolutionary explanation. The etiological account respects the timeline: initially, the function was jaw articulation. Only later, when the dentary-squamosal joint took over the chewing and selection pressure began maintaining the bones *because* of their auditory contribution, did the function switch.

  **Carlos:** And there lies your problem. You make function ascription dependent on a historical cutoff point that biology doesn't respect. The physical contribution of the bone to the ear drum's movement was identical in *Morganucodon* as it is in *Homo sapiens*. If a mechanistic biologist is modeling the hearing of *Morganucodon*, telling them "actually, these bones don't have the function of hearing yet" is useless. It obstructs the explanation of the system's capacity. You're prioritizing a genealogical story over the actual organization of the organism.

  **Elena:** I'm prioritizing normativity. That's the whole point of function talk. If the incus is calcified and rigid in a modern human, we say it's *malfunctioning*. It's failing to do what it *ought* to do. On your causal-role view, "function" is just "what it contributes." If the bone is calcified, its causal role is to block sound. So, is its function to block sound?

  **Carlos:** Don't caricature the systemic view. We appeal to the capacities of the *containing system* under normal conditions. We idealize the system to understand its design. A broken gear in a watch doesn't lose its function of transmitting torque just because it's snapped. We understand its role by looking at the intact mechanism.

  **Elena:** But where do you get the "normal" conditions from without smuggling in history? Why is the intact ear "normal" and the calcified one "abnormal"? Is it just statistical typicality? If a population evolved where everyone had calcified incuses but used bone conduction differently, your "normal" would shift. My account grounds the norm in the selection history: the incus *ought* to vibrate because ancestors that vibrated left more offspring. The "ought" is naturalized. You're left with a descriptive "is" masquerading as a normative claim.

  **Carlos:** And your "ought" creates a paradox of identity. Let's go back to the transition. At generation *N*, the bone is selected for chewing. At generation *N+1000*, it's selected for hearing. When exactly does the function change? Is it a sudden switch? If a specific bone in a specific individual is transmitting sound effectively, but the population-level selection hasn't fully shifted, does that individual's bone lack the function of hearing? That seems absurd. The causal role is present in the individual *now*. Your view makes function a property of the lineage, not the organism.

  **Elena:** Function *is* a property of the trait-type, not the trait-token, precisely to avoid the problem you're describing. We are talking about the malleus as a biological type. The reason we call it "malleus" and not "articular" is partly because its evolutionary trajectory has shifted. But fine, let's press your view on the co-option. If causal role is sufficient, then the articular bone in a reptile today—which also transmits some ground vibrations—has the function of hearing. But biologists call that an exaptation or a spandrel. They reserve "function" for traits maintained by selection. If you ignore that, you inflate functions wildly. Every side effect becomes a function.

  **Carlos:** Biologists use "function" in multiple senses, Elena. That's my point. In evolutionary biology, they mean selected effect. In physiology and neuroscience, they mean causal contribution. You're trying to force a monistic account onto a pluralistic practice. In the seminar paper, if I'm explaining how the middle ear impedance matching works, I don't need to know about synapsid jaw joints. I need to know the lever ratios of the malleus and incus. Their causal role *is* their function in that explanatory context. To say "but historically..." is to change the subject.

  **Elena:** It's not changing the subject; it's grounding the distinction between the system working as designed versus working as a brute physical object. A rock can transmit sound. A rock doesn't have the function of transmitting sound. The difference isn't in the physics; it's in the history. If you strip the history, you can't distinguish the ear bone from the rock, except by saying "it's inside an ear." But then, what makes it an *ear*? It's an ear because it was selected for hearing. You're begging the question. You need my etiological account to define the system boundaries that your causal-role account then analyzes.

  **Carlos:** That's a concession I'm not making. I can define the system boundaries by current organizational closure, not history. An organism is a self-maintaining system *now*. The contribution of the part to the maintenance of the whole *now* determines the function. If the malleus contributes to hearing now, it functions for hearing. If your theory says we have to wait for selection to "ratify" that contribution, you render the theory useless for understanding novel adaptations or rapid phenotypic changes. Evolution is laggy; physiology is immediate.

  **Elena:** And if your theory says any contribution is a function, you can't explain why the appendix is often considered functionless despite having some causal roles, or why a cancer cell's proliferation isn't a "function" of the body, even though it contributes causally to the system's state. You need a filter. Selection provides the filter.

  **Carlos:** Selection provides *an* explanation for the presence of the trait, not the only definition of its function. In this specific case of the malleus, the tension remains: The bone's physical capacity to hear predates its selection for hearing. If you deny the function existed during that window, you deny the biological reality of the exaptation. If you admit it, you've conceded that causal role can ground function without prior selection.

  **Elena:** I admit the *capacity* existed. I deny the *function* existed. That's the distinction. The capacity made the function *possible*, but only selection made it *actual*.

  **Carlos:** And I say that distinction is metaphysical hair-splitting that doesn't help a physiologist fix an ear.

  **Elena:** And I say your view doesn't help an evolutionary biologist explain why the ear is structured this way rather than some other way that also transmits sound.

  **Carlos:** So we're at an impasse. The malleus is too historical for me and too physiological for you.

  **Elena:** Precisely. It's the perfect counterexample to both of us. Which is probably why the professor assigned it.
