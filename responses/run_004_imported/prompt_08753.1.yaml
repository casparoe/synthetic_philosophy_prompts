      *   *Leibniz's Answer:* They *don't*.
      *   *Reasoning:* If the macro-subject (the human mind/soul) is a simple monad, it is not composed of other monads. It is fundamental. The body is an aggregate, but the *subject of experience* (the "I") is the dominant monad.
