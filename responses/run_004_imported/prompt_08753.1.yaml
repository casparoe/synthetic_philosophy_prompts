      *   *Composites (Bodies/Humans):* These are aggregates of monads. They are *phenomena bene fundata* (well-founded phenomena). They lack true substantial unity.
      *   *The Dominant Monad:* In living organisms (including humans), there is one dominant monad (the soul) that represents the body (the aggregate of subordinate monads) from a specific point of view.
