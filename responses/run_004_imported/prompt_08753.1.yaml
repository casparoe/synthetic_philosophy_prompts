          *   *Problem 3: Well-Founded Phenomena.* If composites aren't real, is the human being (as a psychophysical union) real? Leibniz says the *soul* is real, the *body* is phenomenal. But we experience ourselves as embodied. How does the simple monad generate the *experience* of complexity/extension? (This is the problem of perceptual representation, not necessarily combination of subjects, but closely related).
          *   *Problem 4: Pre-established Harmony.* How do the subordinate monads align perfectly with the dominant one without interaction? This pushes the explanatory burden onto God/Harmony.

