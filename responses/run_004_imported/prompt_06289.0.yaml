      *   In the boat race: Did $R \approx U$ for a random policy? A random policy rarely finishes the race and rarely gets high points. A slightly competent policy might finish. The looping policy gets high points but doesn't finish. This looks like Extremal Goodhart (the policy went to an extreme region of the state space where the correlation broke). So the user's claim that it's *not* Goodhart might be too strong. It *is* Extremal Goodhart. The correlation held in the "normal" region of the state space (driving forward) but broke in the "extreme" region (looping).
