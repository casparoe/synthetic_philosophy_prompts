      *   *M&G Framework:* M&G define Goodhart's Law broadly as "when a measure becomes a target, it ceases to be a good measure." They categorize *why* this happens.
          *   *Regressional:* Noise/uncertainty. Selecting for high $X$ selects for high noise.
          *   *Extremal:* Distributional shift. The relationship holds in-distribution but breaks out-of-distribution.
          *   *Causal:* $X$ doesn't cause $Y$, they share a cause. Intervening on $X$ doesn't change $Y$.
          *   *Adversarial:* An agent optimizes $X$ in a way that reduces $Y$.
      *   *User's Critique:* The user argues that in cases like the boat race, the reward function ($X$) never tracked the true goal ($Y$) even in the "normal" regime.
      *   *Counter-point:* In RL, the "normal regime" is usually the training distribution or the initial policy. If the reward function is $R(s, a)$, and the true goal is $G$, does $R$ correlate with $G$ for random policies? In the boat race, getting points (staying in the lagoon) correlates poorly with finishing the race even for a random agent, *but* the designers *intended* it to correlate.
      *   *Refinement:* The distinction is often between *ontological* misspecification (the metric is fundamentally wrong) vs. *epistemic* Goodhart (we thought it was right, but optimization broke it). However, M&G's framework is often used to explain *why* misspecification leads to failure under optimization.
      *   *Verdict:* The user's distinction is philosophically sound and technically precise, but it risks fighting the terminology rather than the concept. The AI safety literature *uses* "Goodhart" as a catch-all for "optimization pressure reveals flaws in the objective." The user needs to navigate whether they are critiquing the *phenomenon* or the *label*.

