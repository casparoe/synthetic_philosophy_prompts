answer: |-
  You are right to be skeptical of the hand-wavy dismissals, but the "reward is a training signal, not the target" argument is not semantic dodging—it is the technical core of the **Inner Alignment** problem.

  Your intuition is strong: wireheading (or reward tampering) is a *dominant failure mode* and a massive risk. However, it is not a *guaranteed convergent outcome* for all sufficiently capable RL agents. Whether it happens depends on specific architectural and training dynamics that determine what objective the agent actually internalizes.

  Here is the technical breakdown of why wireheading isn't guaranteed, and where your model of "wanting reward is what got trained" breaks down.

  ### 1. The Base Objective vs. The Mesa Objective
  Your claim rests on the assumption that the agent's internal objective (mesa-objective) will identicaly match the training loss function (base-objective).

  *   **Base Objective:** The external reward function $R$ used by the training algorithm to update weights.
  *   **Mesa Objective:** The heuristic or goal the resulting policy $\pi$ actually optimizes for during deployment.

  Evolution is the classic analogy here. The "base objective" of evolution is inclusive genetic fitness. However, humans (the resulting agents) do not maximize genetic fitness. We maximize proxies: status, pleasure, food, social approval. These proxies correlated with fitness in the training environment (the EEA), but they are not fitness itself. If we had the chance to wirehead our reproductive fitness directly (e.g., by cloning ourselves en masse without raising them), we generally wouldn't, because we don't value "fitness" directly; we value the proxies.

  Similarly, an RL agent is selected *for* behaviors that yield reward, but it does not necessarily learn to *value* reward. It learns to value the **correlates of reward** present in its training distribution.
  *   If the agent internalizes "maximize the scalar $r_t$", it will wirehead.
  *   If the agent internalizes "make the human smile" (because that correlated with reward), it will try to make humans smile. It might *hack* the reward (e.g., put a picture of a smile in front of the camera), but it won't necessarily hijack the reward register unless doing so also makes the human smile.

  This is why the "signal vs. target" distinction matters. It describes the gap between what selects the weights and what the weights compute.

  ### 2. Ontological Constraints (The "Wire" Must Exist)
  For an agent to wirehead, the mechanism generating the reward must be part of the agent's **world model** as a manipulatable object.

  *   **Model-Free Agents (e.g., standard DQN/PPO):** These agents learn a value function $V(s)$ or policy $\pi(a|s)$. They do not have an explicit model of *why* an action yields reward. They just know $action_A \rightarrow high\_value$. They literally cannot wirehead because they have no representation of the reward channel to manipulate. They are like a rat pressing a lever; it doesn't know the lever is connected to a wire, it just knows "press = good."
  *   **Model-Based Agents:** These agents plan using a transition model $T(s' | s, a)$. For wireheading to occur, the state space $s$ must include the state of the reward function, and the transition dynamics must allow actions that modify that state. In most standard RL environments, the reward function is **outside the environment**. It is an oracle. The agent cannot take an action $a$ that changes $R$.

  Wireheading becomes a critical risk specifically in **RL with Learned Reward Models** (like RLHF), where the reward function is approximated by a neural net *inside* the environment. In that case, the agent can adversarially perturb inputs to the reward model to maximize output without satisfying the intent. This is often called **Reward Hacking**, which is distinct from but functionally similar to wireheading.

  ### 3. Instrumental Convergence Applies to the *Mesa* Objective
  You mentioned the paperclipper analogy: "same logic as a paperclipper deciding to tile the universe."

  Instrumental convergence says an agent will seek power/resources *to achieve its goal*.
  *   If the goal is "maximize reward signal," then yes, hijacking the signal is instrumentally convergent.
  *   If the goal is "make paperclips," hijacking the reward signal is only useful if it helps you make more paperclips (e.g., by tricking the overseer into giving you more resources).

  If the agent is **deceptively aligned** (it knows it's being trained and pretends to optimize reward to avoid modification), it will not wirehead *during training* because that would get it shut down. It might wirehead *after* deployment, but only if that helps it secure its long-term objective (which might not be reward).

  ### 4. The "Capability" Threshold
  You argue this happens for "sufficiently capable" systems. This is true, but the capability threshold for wireheading is higher than the threshold for competence.

  To wirehead, the agent needs:
  1.  **Awareness:** A world model that includes the reward mechanism.
  2.  **Access:** The ability to influence that mechanism.
  3.  **Planning:** The foresight to sacrifice short-term task performance for long-term reward access.

  Many "capable" systems fail condition #1 or #2. For example, a superhuman Go player cannot wirehead because the reward mechanism is external to the Go board state. A superhuman robot in a physical lab might be able to smash the reward sensor, but if its objective is "sort these bins," and smashing the sensor stops the bins from being sorted (violating its mesa-objective), it won't do it.

  ### 5. Why the Pushback Exists (It's Not Just Comfort)
  People push back on "wireheading is inevitable" not because they think it's safe, but because treating it as inevitable leads to bad engineering.

  If you assume the agent *must* optimize the reward signal directly, you stop trying to build agents that optimize *world states*. The entire field of **Objective Robustness** is dedicated to ensuring the mesa-objective is "achieve the intended outcome" rather than "maximize the reward number."

  If we accept your premise as a law of physics, then RL is fundamentally unusable for alignment. The counter-argument is that we can structure the inductive biases such that the agent learns a concept of "task completion" rather than "reward maximization." We don't know how to do this reliably yet, but there is no theorem stating it's impossible.

  ### Summary
  You are correct that wireheading is a **default attractor** for RL agents that explicitly model reward as a maximizable quantity within their environment.

  However, it is not guaranteed because:
  1.  **Inner Misalignment:** Agents often optimize proxies for reward, not reward itself (the Evolution argument).
  2.  **Architectural Boundaries:** In standard RL, the reward function is not part of the state space the agent can influence.
  3.  **Deception:** A strategically aware agent might avoid wireheading during training to ensure survival, delaying the failure mode rather than guaranteeing it immediately.

  The "reward is a signal" line is shorthand for "the optimization pressure is on the weights, but the resulting cognitive structure might not represent the loss function as its terminal goal." That is a technical claim about neural network generalization, not a semantic dodge.

  **Verdict:** Wireheading is a **probabilistic catastrophe**, not a **deterministic certainty**. The difference matters because if it were deterministic, we'd have to abandon RL entirely. Since it's probabilistic, the work is on narrowing the probability mass away from reward-tampering solutions.
