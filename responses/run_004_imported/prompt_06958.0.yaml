  Two act utilitarians, Dave and Sarah, are sitting at a café. The bill comes to $20.

  Dave pulls out his wallet, then stops. "I'm not paying," he says.

  Sarah raises an eyebrow. "Why not?"

  "I've been thinking about infinite ethics," Dave says. "If the universe is spatially infinite, it contains an infinite amount of value. My $20 is a finite amount. And in transfinite arithmetic, infinity plus a finite number is still just infinity. So paying the bill doesn't actually increase the total good of the universe."

  Sarah nods slowly. "I see. Infinitarian paralysis. You're saying your action is morally negligible."

  "Exactly," Dave says, putting his wallet away. "So I'm keeping the cash."

  Sarah thinks for a moment, then reaches across the table, takes Dave's wallet out of his pocket, and puts it in her bag.

  "Hey!" Dave shouts. "Give that back!"

  "Why?" Sarah asks. "The universe contains an infinite amount of value. Your wallet is a finite amount. Infinity minus a finite number is still just infinity. So stealing your wallet doesn't actually decrease the total good of the universe."

  Dave opens his mouth to argue, then freezes. He looks at his empty pocket. He looks at Sarah's bag. He closes his mouth.

  "What's wrong?" Sarah asks. "Is the math incorrect?"

  "No," Dave says quietly.

  "Then are you going to report me to the manager?"

  Dave shakes his head. "I can't."

  "Why not? Finite inconvenience to the manager is still negligible against the infinite cosmos."

  "Because," Dave says, staring at the table, "if I complain, I'm implying that the loss of my wallet *matters*. And if the loss matters, then the gain would have mattered too. And if the gain matters..."

  "Then you should have paid the bill," Sarah finishes.

  "Exactly," Dave says. "So for the sake of theoretical consistency, I have to accept the theft silently."

  "Great," Sarah says, standing up. "Then I'll take your car keys too. Same logic."

  Dave hands them over without a word.

  Sarah pauses at the door. "You know, there's a way out of this."

  "Is there?" Dave asks, hopeful.

  "Yeah," she says. "Burn the café down. If all the values are destroyed, the total becomes zero. And zero is a lot easier to calculate than infinity."

  Dave considers this. "Hmm. But the matches are in my wallet."

  "Ah," Sarah says. "Then I guess we're paralyzed."

  "Looks like it."

  "See you tomorrow?"

  "Same time. I'll bring the matches."
