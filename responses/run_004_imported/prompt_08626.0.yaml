answer: |-
  You have stumbled upon one of the most persistent and difficult problems in political philosophy. It is known as the **"Boundary Problem"** (or sometimes the *demos* problem).

  The question you are asking is: *Who decides who gets to decide?*

  There is no perfect, non-circular solution in pure theory. However, there are principled frameworks that legal systems use to manage it. Here is a breakdown of why this feels like "turtles all the way down," why the council member is technically right but morally vulnerable, and where the principled middle ground usually lies.

  ### 1. The Council Member's Logic: The Constitutive Paradox
  The council member is relying on a **legal-constitutive** argument. Their logic is:
  *   Voting is a right of membership.
  *   The subdivision residents are not members.
  *   Therefore, allowing them to vote treats them as members.
  *   If they are treated as members, the annexation vote is redundant.

  This is not merely pedantic; it is the logic of contract law. You cannot vote on whether to join a club until you have followed the club's application process. If the club members must vote to let you in, you cannot vote on that decision, because you aren't in the room yet.

  **The Flaw:** This logic works for voluntary associations (like a private club), but it is morally shaky for governments. Governments wield coercive power (taxation, zoning, police). Applying the "club rules" logic to governance allows an existing polity to impose burdens on outsiders without their consent. This violates the democratic principle of **no taxation without representation.**

  ### 2. Your Logic: The All-Affected Principle
  Your intuition relies on the **All-Affected Principle**, a cornerstone of modern democratic theory. It states that anyone whose interests are significantly affected by a decision should have a say in making it.

  **The Flaw:** As the council member hinted, this can become circular or infinite.
  *   *Circularity:* To know who is affected, you must know what the decision is. But to make the decision, you must know who is affected.
  *   *Infinite Regress:* If the annexation affects property values in the next town over, do they vote? If it changes traffic patterns for commuters, do they vote? If you define the electorate by "affectedness," the boundary of the electorate is always moving.

  ### 3. Is it "Turtles All the Way Down"?
  In pure philosophy? **Yes.**
  Robert Dahl, a giant of political science, argued that the boundary problem is logically unsolvable within democracy itself. You cannot democratically decide the boundaries of the democracy without already having a democracy with defined boundaries.

  **However, in practice? No.**
  It stops being turtles when you hit **Meta-Rules.**
  In your town's case, the "turtle" at the bottom is not the town council; it is the **State Legislature.**

  The town exists because the State granted it a charter. The State laws determine the rules of annexation. Therefore, the "principled answer" is not found in the town's moral reasoning, but in the State's statutory framework.
  *   If State law says "Only current residents vote," the principle is **Legal Stability.** (The state prioritizes the autonomy of existing municipalities).
  *   If State law says "Both groups vote," the principle is **Consent of the Governed.** (The state prioritizes the rights of the annexed).

  The circularity is broken by a higher authority imposing a rule from the outside.

  ### 4. The Principled Compromise: The Dual Referendum
  While the town council might feel bound by current law, the most robust *political* solution to this dilemma—which many states and countries adopt—is the **Dual Majority** or **Concurrent Consent** model.

  In this model:
  1.  **Town voters** decide if they want to accept the new residents (protecting the existing community's resources and identity).
  2.  **Subdivision voters** decide if they want to join the town (protecting their autonomy and wallet).

  **Why this works:**
  It acknowledges that annexation is a **merger**, not a conquest.
  *   It respects the Council's concern: The subdivision residents aren't voting *as* town members; they are voting *as* the members of their own unincorporated community.
  *   It respects your concern: They are not bound by a decision they had no hand in making.

  If the town votes "Yes" and the subdivision votes "No," the annexation fails. This prevents the town from annexing an area against its will (which can happen to capture tax base) and prevents the subdivision from forcing itself into the town if the town can't support it.

  ### 5. Summary
  You are right to feel uneasy. Excluding the subdivision residents creates a **democratic deficit**. It allows the town to impose costs on people who have no recourse.

  The council member is right that letting them vote *as town residents* is circular. But they are wrong to imply that means the residents can't vote *at all*. They can vote as stakeholders in a merger.

  **The Verdict:**
  *   **Is it circular?** Yes, if you try to solve it purely within the town's existing logic.
  *   **Is it arbitrary?** Only if the State laws governing annexation were written arbitrarily.
  *   **Is there a fix?** The principled fix is to treat the referendum not as an internal town matter, but as a **bilateral agreement**. Both parties must consent to the change in sovereignty.

  If your state law only allows the town to vote, the system is structurally biased toward the incumbent polity. That isn't "turtles all the way down," but it is a recognized flaw in many municipal codes that prioritizes administrative efficiency over democratic consent. Your frustration is philosophically warranted.
