          2.  **Yudkowsky Parallel:** Strong parallel. Yudkowsky wants truth to track territory. Peirce's convergence is *caused* by territory. James's "expedience" risks losing the territory. The "belief in belief" warning aligns with Peirce's warning against settling opinion via authority/tenacity rather than inquiry.
          3.  **Isolated Facts:** Peirce's modal realism ("would-bes") is the answer. It's not correspondence in disguise; it's a different metaphysical grounding for correspondence. James would likely deny the fact has a truth value until verified (verificationism). This is a major divergence point.
          4.  **Verdict:** Post it. The Peirce/James conflation is common. Rationalists need to know Peirce is the "good" pragmatist.

