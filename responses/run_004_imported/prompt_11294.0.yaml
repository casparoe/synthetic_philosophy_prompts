answer: |-
  This is a sharp, well-motivated draft, and you are right to be suspicious of the blanket claim that "rationalists agree with Peirce against James." That claim is often thrown around without enough unpacking of *why* Peirce is the acceptable pragmatist and James is the dangerous one.

  Here is feedback on your four specific points, followed by a verdict on the post itself.

  ### 1. Fairness to Peirce and James
  You are being **fair to the standard distinction**, but you risk flattening Peirce's metaphysics if you treat his convergence theory purely as "correspondence in disguise."

  *   **Peirce:** You note that Peirce's apparatus only works if there is a mind-independent reality producing convergent evidence. This is correct, but for Peirce, this wasn't a hidden assumption; it was **Scholastic Realism**. Peirce believed "Generals" (laws, habits, types) are real. The convergence of inquiry isn't just a happy accident; it is caused by the reality of the object constraining the sign.
      *   *Nuance to add:* Peirce didn't think truth *corresponded* to reality in a mirror-image sense (he hated the copy-theory of truth). He thought truth *represented* reality through a process of semiosis. However, for the purposes of your argument (against Jamesian instrumentalism), treating him as a "convergence realist" is functionally accurate.
      *   *Later Peirce:* In his later work, Peirce became more explicit that the "final opinion" is not just what we *happen* to agree on, but what we *would* agree on because Reality forces it. This strengthens your point that he is safer from the "belief in belief" charge than James.

  *   **James:** You are reading James charitably regarding the "long run," but his rhetoric *does* invite the "expedient now" reading more than Peirce's does.
      *   *Nuance to add:* James's radical empiricism leads him to a view where truth is *made* in the process of verification. For James, a proposition about an unverified isolated fact might genuinely lack a truth value until someone verifies it. This is a much harder divergence from rationalist realism than just "expedience."

  ### 2. The Yudkowsky/Rationalist Parallel
  The parallel **holds up remarkably well**, perhaps better than you suspect.

  *   **The "Belief in Belief" Charge:** Yudkowsky's critique in *The Useful Idea of Truth* is that defining truth as "useful" breaks the link between the map and the territory. If I believe "my dead father loves me" and it makes me happy, Jamesian pragmatism (at its crudest) struggles to call this false if it "works" for my emotional life.
  *   **Peirce as Ally:** Peirce explicitly argued against settling opinion via **Tenacity, Authority, or A Priori Preference**. He argued only the **Method of Science** (external permanence) works. This maps almost 1:1 onto the Rationalist ideal of "updating on evidence" vs. "motivated cognition."
  *   **The Anachronism Worry:** It is not forcing a frame. The Rationalist project is essentially a revival of Enlightenment empiricism filtered through Bayesianism. Peirce is the bridge between classical empiricism and modern semiotics/logic. Identifying him as a "proto-rationalist" regarding truth-tracking is historically defensible. The key alignment is: **Truth is what you are forced to believe by reality, not what you choose to believe for comfort.**

  ### 3. The "Buried Secret" and Jamesian Responses
  You are stuck on the "isolated fact" objection (e.g., the number of grains of sand in an erased dune).

  *   **Peirce's Defense:** Peirce's answer relies on **Modal Realism**. The "would-be" is real. Even if no one *does* count the sand, the fact that they *would* count $N$ grains if they *were* there is a real property of the universe. This isn't importing correspondence through the back door; it's asserting that **dispositions and possibilities are ontologically real.** For a rationalist, this is usually acceptable (counterfactuals are real).
  *   **James's Defense:** A strong Jamesian response is actually more radical: **Truth happens to an idea.** It *becomes* true. For the erased dune, if no verification is ever possible, the proposition is meaningless or lacks a truth value.
      *   *Why this matters for your post:* This is where the Rationalist/Peirce alliance solidifies *against* James. Rationalists generally believe the dune *had* a number, regardless of verification. If James denies this, he is vulnerable to the "map-territory confusion" charge. If Peirce affirms it (via counterfactuals), he is safe.
      *   *Verdict:* You are right to be skeptical of the Jamesian rescue here. It requires accepting a verificationist metaphysics that most rationalists reject.

  ### 4. Verdict: Post or Comment?
  **Turn this into a shortform post.**

  *   **Why:** The conflation of Peirce and James is rampant, even among educated readers. The specific claim that "Rationalists agree with Peirce" is a high-value insight that deserves more than a comment thread. It clarifies the epistemological stance of the community (Realism > Instrumentalism).
  *   **Caveat:** Don't get bogged down in 19th-century exegesis. Keep the focus on the **epistemic hygiene** implications.
      *   *Focus:* How Peirce's definition protects against motivated cognition (the "Method of Science" vs. "Method of Authority").
      *   *Focus:* How James's definition risks licensing "belief in belief" (if it feels good and works socially, is it true?).
      *   *Focus:* The "Buried Secret" as the litmus test for whether you believe in a territory independent of the map.

  ### Specific Suggestions for the Draft
  1.  **Clarify "Correspondence":** Acknowledge that Peirce rejected the naive copy-theory of correspondence, but emphasize that his "convergence" is *caused* by the external world, which achieves the same functional goal as correspondence theory for a rationalist.
  2.  **Highlight "The Will to Believe":** If you want to steelman the "Rationalists vs. James" claim, mention James's *The Will to Believe*. His argument that we have a right to believe religious hypotheses without evidence if the option is "live, forced, and momentous" is the ultimate rationalist sin. Peirce would have hated this.
  3.  **The "Would-Be":** Explicitly frame Peirce's counterfactuals as "Modal Realism." This explains why he isn't just smuggling in correspondence; he's grounding truth in the *laws* of the universe, which fits well with a physics-oriented rationalist worldview.

  **Summary:** Your intuition is correct. Peirce is the "Safe Pragmatist" for rationalists because his pragmatism is a theory of *meaning and inquiry* grounded in realism, whereas James's is often a theory of *justification* grounded in human experience. Making this distinction clear is a valuable contribution.
