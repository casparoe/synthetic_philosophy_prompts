          *   *Peirce:* The "final opinion" definition is from "How to Make Our Ideas Clear" (1878). Later Peirce (Scholastic Realism) gets more metaphysical. He believes in "Thirdness" and real generals. The convergence isn't accidental; it's caused by Reality.
          *   *The Split:* Peirce *did* distance himself from James. "Pragmaticism" vs. "Pragmatism." Peirce thought James made it too subjective.
          *   *Fairness:* The user is being reasonably fair to the standard distinction, but needs to acknowledge Peirce's Scholastic Realism to avoid the "correspondence in disguise" charge being a *criticism* rather than an *observation*. For Peirce, that *is* the point.

