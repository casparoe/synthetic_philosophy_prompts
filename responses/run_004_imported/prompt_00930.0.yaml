      *   **Reconstruction:** Formalize the argument as best as possible (Premises 1-4, Conclusion). Make it look like something a logician would respect. Mention the anti-materialist link (Incompleteness $\rightarrow$ Mind $\neq$ Brain).
      *   **The Charitable Reading:** Why does this feel right? The intuition of waste. The connection to Leibnizian PSR.
