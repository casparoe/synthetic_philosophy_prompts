answer: |-
  The following argument contends that Russell's distinction in §54 of the *Principles of Mathematics*—between a relation considered "in itself" and a relation "actually relating"—fails to resolve the problem of propositional unity. Rather than answering Bradley, it merely restates the problem in new terminology, thereby conceding the core of Bradley's objection.

  ### The Illusion of Explanatory Power

  Russell's strategy in §54 is to halt Bradley's Regress by asserting a primitive distinction in the mode of being of a relation. He posits that when a relation (say, *difference*) occurs as a term in a proposition (e.g., "Difference is a relation"), it is inert. However, when it occurs as the verb of a proposition (e.g., "A differs from B"), it is "actually relating." Russell claims that in this second mode, the relation performs the work of unity without requiring a further connector, thus stopping the regress before it begins.

  The fatal weakness of this move is that it treats a metaphysical problem as a linguistic or categorical fiat. To assert that a relation is "actually relating" is to describe the *effect* we wish to explain (the unity of the proposition) without identifying the *cause* or the ontological ground that makes it possible.

  ### The Indeterminacy of "Occurrence"

  The crux of the criticism lies in the question: **What constitutes the difference between the two modes of occurrence?**

  If the relation $R$ is numerically identical in both cases (as a term and as a relating), then $R$ possesses the potential to relate but does not always exercise it. If $R$ can exist without relating (as it does when it is a term), then when it *does* relate $A$ and $B$, something must account for the actualization of that potential. If nothing accounts for it, then the transition from inertness to activity is brute and unintelligible.

  If, on the other hand, the relation "actually relating" is a different entity from the relation "in itself," then we have not avoided the regress; we have merely relocated it. We now have $A$, $B$, and $R_{active}$. But what connects $R_{active}$ to $A$ and $B$? If $R_{active}$ is defined by its connection to them, we are defining the connector by the very connection it is supposed to explain, which is circular. If it is not defined by that connection, we require a further tie to bind $R_{active}$ to the terms, and Bradley's regress resumes.

  By failing to specify *what makes* an occurrence "actually relating" rather than "in itself," Russell leaves it entirely open which occurrences do the relating and which do not. He provides no criterion other than the presence of the unity itself. We know the relation is "actually relating" only because the proposition is unified; we know the proposition is unified because the relation is "actually relating." This is not an explanation; it is a tautology.

  ### Conceding Bradley's Objection

  Bradley's objection is not merely that an infinite series is unpleasant; it is that a plurality of distinct entities ($A$, $B$, and $R$) cannot constitute a single fact without a principle of unity that is itself accounted for. Bradley argues that if the relation is a distinct term, it stands outside the terms it relates, requiring a further medium to bridge the gap.

  Russell's response attempts to bypass this by saying the relation, in its verbal capacity, *is* the bridge. However, by admitting that the relation can also exist "in itself" (as a term), Russell concedes that the relational nature is not essential to the entity's existence in all contexts. If the relating is not essential, it is contingent. If it is contingent, there must be a condition under which it obtains.

  By refusing to name that condition—by insisting that "actually relating" is a primitive, unanalyzable mode—Russell effectively admits that he cannot provide the ontological ground for unity. He is asking us to accept that sometimes entities stick together and sometimes they don't, and that this "sticking" is a fundamental brute fact.

  This is precisely Bradley's point: without a coherent account of how the many become one, the proposition is a fiction. Russell's distinction does not show *how* they become one; it merely labels the successful case "actually relating" and the unsuccessful case "in itself." In doing so, he validates Bradley's claim that the realist ontology of relations leaves the unity of the proposition unintelligible. Russell has not solved the regress; he has simply declared a stop to the inquiry at the precise point where Bradley demands an answer.

  ### Conclusion

  Ultimately, the distinction between a relation "in itself" and "actually relating" is a verbal shield, not an ontological sword. It names the phenomenon of unity without explaining its possibility. Because it offers no criterion for distinguishing the two modes other than the presence of the unity they are meant to explain, it leaves the connection between terms arbitrary. In failing to explain what transforms an inert relation into a relating one, Russell concedes that the unity of the proposition cannot be derived from its constituents alone. He thereby grants Bradley's fundamental thesis: that on a pluralistic ontology of terms and relations, the unity of the proposition remains a mystery.
