answer: |-
  You are stuck because you and Deb are arguing on two completely different planes. She is arguing about **logic and facts**; you are arguing about **authority and social contracts**.

  Here is the direct answer you asked for: **Deb is right about the facts, but you are right about the standing.**

  Hypocrisy does not make a criticism *false*, but it absolutely weakens the critic's *right to enforce it*. Here is the breakdown of why your intuition is correct, even if Deb has logic on her side.

  ### 1. The Logical Plane (Where Deb Wins)
  Deb is relying on a basic principle of logic: the truth value of a statement is independent of the speaker. If I tell you "smoking kills you" while I am holding a cigarette, the statement "smoking kills you" remains medically true.

  In philosophy, this is called the **Tu Quoque fallacy** (Latin for "you also"). It is a logical fallacy because pointing out the speaker's inconsistency does not disprove their argument.
  *   **Claim:** "The dishes are piling up."
  *   **Truth:** True.
  *   **Deb's Behavior:** Irrelevant to the truth of the claim.

  If this were a court of law regarding a broken lease clause, Deb would win. The clause exists, you broke it, her behavior at her boyfriend's house is inadmissible evidence.

  ### 2. The Normative Plane (Where You Win)
  However, human relationships are not courts of law; they are **cooperative ventures**. In a cooperative venture, rules are not just external facts; they are mutual agreements. When you live with someone, you aren't just agreeing to follow rules; you are agreeing to *share the burden* of those rules.

  This is where the concept of **Moral Standing** comes in. To legitimately enforce a norm, you generally need to be seen as upholding that norm yourself.
  *   **The Hypocrisy Problem:** When Deb nags you while being messy elsewhere, she signals that she views cleanliness not as a *shared value*, but as a *preference she imposes on others*.
  *   **The Shift:** The conversation stops being about "We need a clean home" and becomes "I need you to submit to my standard."

  You felt something was "genuinely different" about being called out by a hypocrite because **hypocrisy breaks trust.** It suggests the critic is exempt from the rules they enforce. In a roommate dynamic, if one person claims the authority to police behavior they do not police in themselves, they are acting like a parent or a boss, not a peer. Since you are peers, her lack of "clean hands" undermines her authority to lecture you.

  ### 3. Why "You Do It Too" Isn't Always a Dodge
  In a debate about abstract truth, "you do it too" is a dodge. But in a negotiation about **shared behavior**, it is a valid counter-argument.

  Imagine a team sport. If a player sits on the bench and yells at the players on the field for running too slow, the players on the field are justified in saying, "Get out here and run."
  *   **Is the criticism true?** Maybe the players *are* running slow.
  *   **Does the bench-warmer have the right to demand more?** No.

  By bringing up Tom's apartment, you weren't trying to prove the dishes were clean. You were challenging her **jurisdiction**. You were effectively saying: *"You have demonstrated that you do not actually value cleanliness enough to practice it universally. Therefore, you do not have the standing to act as the Cleanliness Police here."*

  ### The Verdict
  You asked if being a hypocrite weakens their position. **Yes, it does.**

  It weakens their position from a **moral and relational standpoint**, even if it doesn't weaken their position from a **factual standpoint**.

  *   **Deb's Error:** She thinks that because the *fact* is true, the *conversation* is over. She is ignoring the relational cost of her hypocrisy. She is treating a shared living situation like a objective audit.
  *   **Your Error:** You tried to use her hypocrisy to negate the fact of the mess. You can't. The dishes are still there.

  ### How to Unstick This
  You need to separate the two issues so you aren't talking past each other.

  1.  **Concede the Fact:** "Deb, you are right. The dishes are piling up, and I need to wash them. That is true regardless of what you do at Tom's." (This removes her logical shield).
  2.  **Assert the Standing:** "However, when you lecture me about standards you don't hold yourself to elsewhere, it doesn't feel like a roommate request. It feels like you claiming authority you haven't earned. I'm more likely to respond to 'Hey, we need to clean' than 'You need to clean.'"

  **Summary:** A hypocrite can speak the truth, but they lose the right to act self-righteous about it. You were right to feel that her hypocrisy mattered, even if it didn't magically wash the dishes.
