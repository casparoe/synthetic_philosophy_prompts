prompt: |-
  I went down a rabbit hole on the Lucas-Penrose argument -- the idea that Gödel's incompleteness theorems show human minds can't just be algorithms/Turing machines, since we can supposedly always 'see' that a formal system's Gödel sentence is true even though the system itself can't prove it from the inside. I'm a swe, not a philosopher, but this feels super relevant to the debate over whether LLMs (or whatever comes after them) could ever have genuine mathematical insight vs. just being really good next-token guessers. Assuming the argument is basically sound for a sec, what are the most important implications for what current AI architectures could and couldnt ever do? Also curious whether the classic replies (Putnam's, Benacerraf's, that whole 'which formal system even is your mind anyway' problem) basically kill the argument before it gets that far -- I don't wanna build a bunch of implications on a premise thats already dead in the water.
