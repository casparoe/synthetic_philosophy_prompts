      *   **Policy Context:** Faculty code has two tracks: Disciplinary (can lead to dismissal) vs. Fitness-for-Duty (suspends discipline pending treatment). Code is silent on overlap (misconduct caused by medical condition).
      *   **Complicating Factor:** Incidents only targeted juniors/staff, never superiors. Some see this as proof of control; others see it as consistent with genuine impulse control issues (disinhibition often targets perceived "safe" targets).
      *   **Requirements:**
          *   Recommend a track (or combination).
