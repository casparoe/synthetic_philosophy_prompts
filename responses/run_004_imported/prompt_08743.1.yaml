  5.  **Drafting - Specific Considerations:**
      *   *Policy Gap:* Since the code is silent, we have interpretive latitude. We should interpret it in light of ADA (Americans with Disabilities Act) principles and duty of care.
      *   *The "Selective" Argument:* I need to validate the skeptics without validating ableism. It *is* suspicious, but neurology is complex. The recommendation should account for this uncertainty (e.g., strict monitoring).
      *   *Victims:* They need to know their safety matters more than the colleague's tenure. Confidentiality is key, but so is protection.
      *   *Timeframe:* Needs to be finite. Indefinite accommodation isn't viable if safety is compromised.

