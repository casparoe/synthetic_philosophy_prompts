      *   *Teacher's credibility:* Defend the teacher without making the user feel stupid for asking. The question is a very common and intelligent one (Buddhist Modernism).

  7.  **Final Polish:** Check for clarity on "Two Truths" (Conventional vs. Ultimate) as it relates to the science/Dharma split. Ensure the distinction between *knowing about* no-self and *waking up* to no-self is clear.

