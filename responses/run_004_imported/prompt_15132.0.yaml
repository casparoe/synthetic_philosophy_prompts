          *   "Laws don't 'govern'... convenient summary": Correct (Supervenience).
          *   "Lewis calls this view 'Humean Supervenience' because... he thinks we can only ever have knowledge of the regularities themselves, not of any hidden necessary connections": **Problematic.** Humean Supervenience is a *metaphysical* thesis about supervenience, not primarily an *epistemic* thesis about knowledge. While Hume was an empiricist, Lewis's HS is about the *structure of reality* (all truths supervene on the mosaic), not just what we can *know*. This conflates metaphysics with epistemology slightly.
          *   Overall: Good summary of BSA, slight conflation on the justification/naming of HS.

      *   *Paragraph 2 (Anti-Humeanism/Armstrong):*
          *   "Armstrong... relations of natural necessitation between universals, N(F,G)": Correct.
