          *   "Because this is a genuine necessitation relation... Armstrong's view implies that our laws could not have been otherwise - once N(F,G) holds it holds necessarily": **Major Error.** Armstrong is a contingentist about laws. N(F,G) is a contingent relation. It holds in this world, but could fail in another possible world. The student claims the laws hold *necessarily* once they hold. This confuses *natural necessitation* (within a world) with *logical/metaphysical necessity* (across worlds). Armstrong explicitly argues against Kripkean necessity of laws.
