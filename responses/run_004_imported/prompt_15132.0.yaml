  ### TA-to-TA Advice (Calibration Context)
  Since you mentioned you're calibrating for the rest of the pile: This student wrote a very smooth, confident answer that *looks* like an A at a glance. However, under strict philosophical scrutiny, the claim that Armstrongian laws are metaphysically necessary is a fail-on-sight error for an A grade in a specialized course.

  If you give this an A, you will have to give A's to students who understand the modal distinction but write worse. If you give this a B+, you signal that **metaphysical accuracy** outweighs **writing fluency**. I recommend sticking to the B+ here to keep your grade distribution honest for the rest of the stack. Look for other students confusing "nomic necessity" with "logical necessity"—that seems to be a common trap in this cohort.
