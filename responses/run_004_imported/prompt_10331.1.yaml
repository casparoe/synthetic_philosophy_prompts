      *   *The Argument:* A code requires a distinction between the *symbol* and the *referent* such that the link can be broken *semantically*, not just physically.
      *   *Critique:* This is a strong philosophical intuition (resembling Kripke or Wittgenstein on rule-following, though applied to biology). However, in biology, "misreading" *does* happen (miscoding). The user distinguishes "chemical error" from "mistranslation." This is a subtle point. If the ribosome binds the wrong tRNA due to thermal fluctuation, is that a chemical error or a semantic error? In information theory, it's noise. In semantics, it's a lie/error.
      *   *Potential Weakness:* The user claims normativity is imported from outside (evolution). This aligns with "Teleosemantics" (Millikan, Papineau). The function is determined by history. So, the "misuse" *is* real relative to the selected function. The user says "we bring it in from outside." A teleosemanticist would say "the system itself carries the history."
