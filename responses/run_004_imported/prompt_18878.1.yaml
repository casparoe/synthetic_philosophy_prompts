answer: |-
  This is a textbook instantiation of the **Problem of Profligate Omissions** (often associated with Lewis 1986, Moore 2009, and the Hart & Honoré tradition). You are right that the literature treats omissions as "fussy" precisely because pure counterfactual dependence fails to distinguish Sam from Priya. Here is the move-by-move breakdown.

  **(1) Marcus:** *Sam caused the corruption, plain and simple -- he's the one who didn't act when he should've.*
  **Edge: Marcus.** This is the *explanandum*. It captures the robust ordinary intuition that specific omissions can be causes. In the literature, this is the "Default Position" that any theory of omission causation must attempt to preserve. Marcus starts with the phenomenology of causal attribution, which is methodologically sound.

  **(2) Ilana:** *If "didn't do the thing that would've stopped X" is causing-by-omission, then Priya (and everyone else) caused it too. Since nobody thinks that, the theory is wrong.*
  **Edge: Ilana.** This is the **Profligacy Objection**. She correctly identifies that naive counterfactual dependence ($\neg A \boxright \neg E$) is insufficient because it makes causation ubiquitous. If causation were merely counterfactual dependence between events and non-events, the causal field would be unmanageably large. She forces Marcus to refine his theory.

  **(3) Marcus:** *There's a non-arbitrary difference: Sam was on call. His inaction is a departure from what was supposed to happen.*
  **Edge: Marcus.** This is the **Default/Deviant Model** (defended by McGrath 2005, Beebee 2004). Marcus introduces a normative or statistical baseline to filter relevant omissions. In the literature, this is the standard solution to Profligacy: an omission is a cause only if it violates a relevant norm, expectation, or "default" course of events. He successfully narrows the causal field without abandoning omission causation.

  **(4) Ilana:** *That tracks blameworthiness, not causation. The physics is identical. Duty is normative, causation is descriptive.*
  **Edge: Ilana.** This is the **Metaphysical Objection**. She correctly points out that norms are mind-dependent, while causal structures (on a physicalist view) should be mind-independent. If causation is a relation in the world, a spreadsheet entry shouldn't toggle it on or off. She exposes the cost of Marcus's view: it makes causation partially normative/pragmatic rather than purely metaphysical.

  **(5) Marcus:** *If your theory says dozens caused it (which nobody believes), that's a strike against the theory, not ordinary usage.*
  **Edge: Marcus.** This is a **Methodological Defense**. In metaphysics of causation, we generally aim for a reflective equilibrium between theory and intuition. If a theory (pure counterfactualism) yields results that violate strong, stable intuitions (only Sam caused it), the theory is usually adjusted, not the intuitions. Marcus is protecting the phenomenon of *causal selection*, which is what our causal claims actually track.

  **(6) Ilana:** *Duty can't change causal structure. If the lab had no rotation, the disk still fills up the same way.*
  **Edge: Draw (leaning Ilana metaphysically, Marcus pragmatically).** Ilana is right that *causal production* (the physical transfer of energy/information) is invariant. However, Marcus is right that *causal explanation* (which is what "X caused Y" usually denotes in discourse) is context-sensitive. Ilana wins on fundamental metaphysics; Marcus wins on the semantics of causal claims.

  ### What Both Are Missing
  They are talking past each other because they are using different concepts of "causation."
  1.  **Causal Production vs. Causal Dependence:** Ilana is arguing for **Production** (physical mechanisms, processes, energy transfer). On this view, she is right: omissions are "nothings" and cannot produce anything. Marcus is arguing for **Dependence/Explanation** (counterfactuals relative to a context). On this view, he is right.
  2.  **Contrastive Causation:** The missing key to resolving Step 6 is **Contrastivism** (Schaffer 2005, Hitchcock 1996). Causal claims are ternary: $c$ rather than $c^*$ caused $e$ rather than $e^*$.
      *   For Sam: The contrast is *Sam sleeping* vs. *Sam working (as per norm)*.
      *   For Priya: The contrast is *Priya sleeping* vs. *Priya sleeping (as per norm)*.
      *   The "calendar entry" doesn't change the physical structure; it changes the **contrast class** relevant to the conversation. The norm selects the relevant alternative possibility. This validates Marcus's intuition (norms matter for causal *claims*) without accepting Ilana's fear that norms change physics (they only change the context of attribution).

  ### Overall Assessment
  Ilana wins on strict physicalist metaphysics (causation shouldn't depend on calendars). However, Marcus wins on the specific literature regarding **omission causation**. The consensus in that subfield is that pure physicalism cannot account for omission causation at all (leading to error theory). To save the phenomenon of omission causation (which the housemates clearly accept), one *must* adopt a view like Marcus's (Default/Deviant or Contextualist). Marcus provides a principled criterion that solves the profligacy problem Ilana raised in (2), whereas Ilana only offers a critique that leads to skepticism. Since the goal is to explain the asymmetry in the house's judgment, Marcus's framework is the functional winner.

  \answer{Marcus}
