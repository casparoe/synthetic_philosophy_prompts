answer: |-
  The screen in front of Elias Thorne did not show blood. It showed a heat map of public sentiment, blooming in angry shades of crimson across the southeastern quadrant of the country.

  Elias was the Chief Narrative Architect for the Coalition Stability Group. He sat in a room that smelled of ozone and recycled air, surrounded by banks of monitors that tracked the war in the Veridian Province. On one screen, a drone feed showed a smoking crater where a market had been ten minutes ago. On another, a spreadsheet waited for input.

  "Initial reports are calling it a munitions depot," said Sarah, a junior analyst standing by the door. She looked pale. She was holding a tablet like a shield. "But the geolocation tags on the civilian uploads… they match the school coordinates, Elias. The one on the aid manifest."

  This was the old kind of problem. The factual kind. In the mid-twentieth century, a man in Elias's position would have felt a spike of adrenaline, the specific anxiety of the liar who knows the truth and must hide it. He would have had to keep the reality of the school in his mind clearly, precisely, in order to successfully deny it. He would have had to respect the truth enough to fear it.

  Elias felt nothing but a mild friction, like a gear slipping.

  "Update the metadata," Elias said, his voice even. He didn't look away from the sentiment heat map. "The building was dual-use. It's always been dual-use. The curriculum included logistical training."

  "There are videos, sir," Sarah said. "Children. The timestamps align with the strike."

  "Videos are unverified assets," Elias corrected gently. "They lack context. If we acknowledge the building was a school, we admit to a targeting error. If we acknowledge it was a depot, we admit to operational success. The structural integrity of the mission relies on the latter. Therefore, the building is a depot."

  "But the witnesses—"

  "Witnesses are contingent," Elias said, finally turning to her. "They are variable data points. They can be discredited, fatigued, or drowned out. The model, however, is constant. The model predicts that admitting fault here increases insurgent recruitment by fourteen percent. Admitting success stabilizes the region. The model cannot accommodate a school. So, functionally, there is no school."

  Sarah nodded, though her eyes remained wide. She tapped her tablet and left.

  Elias turned back to his console. He began to type. He wasn't writing a lie, not in the sense of a fabrication he knew to be false. He was writing code for a reality compiler. He drafted the press release: *Coalition forces neutralized a high-value command node embedded within a civilian infrastructure site…*

  He paused. *Embedded within.* Good. It suggested the civilians were part of the machinery, not victims of it.

  He worked for four hours. He adjusted the casualty estimates. He didn't lower them arbitrarily; he adjusted them based on the "average occupancy rate of similar structures in peacetime," a statistical abstraction that bore no relation to the market day crowd that had actually been there. The number came out clean. Plausible. Deniable.

  By 8:00 PM, the room was empty. The heat map had cooled. The crimson anger had shifted to a confused yellow, then a passive green. The narrative had taken hold. The news anchors were repeating his phrasing: *command node,* *dual-use,* *embedded.*

  Elias stood up to leave. His knees popped. He walked to the window, looking out over the city lights. He tried to summon the image of the drone feed from earlier. The smoking crater.

  He tried to remember the specific detail that Sarah had mentioned. The children.

  He reached for the memory, but his mind slid off it. It was like trying to grasp a smooth stone in a rushing river. He knew, intellectually, that the drone feed had shown a school. He had seen the sign on the roof in the high-res still. *Veridian Primary.*

  But as he stood there, the memory felt… inefficient. It didn't fit.

  If it was a school, why were the munitions in the basement?
  *Wait,* he thought. *Were there munitions?*
  He remembered the intelligence briefing. Yes. Reports of storage.
  *But it was a school.*
  *If it was a school, the storage was illegal.*
  *If the storage was illegal, the building was a legitimate target.*
  *Therefore, the function of the building was military.*
  *Therefore, calling it a school is a categorization error.*

  Elias blinked. The logic loop closed with a satisfying click. He felt a wave of relief. The dissonance vanished. He hadn't lied; he had simply corrected a classification error. The truth wasn't that he had bombed a school. The truth was that he had bombed a military target that had been mislabeled by aid workers.

  He picked up his coat. He needed to call his wife. She had asked him earlier if the reports were true. If the children were dead.

  He dialed her number.

  "El?" Her voice was tight. "I saw the press conference. They're saying it was a command center."

  "That's correct," Elias said. He was surprised by his own certainty. He hadn't checked the latest intelligence. He didn't need to. The press conference *was* the intelligence now. It was the authoritative record.

  "There's a woman on the news," his wife said. "She's holding a textbook. She's screaming about her son."

  Elias frowned. A textbook. That was a prop. A piece of stagecraft designed to exploit the emotional vulnerability of the viewing audience. It was a tactical counter-move by the insurgents.

  "El?" she pressed. "Did we hit a school?"

  The question hung in the air. It was a simple question. Factual. Contingent. It relied on the existence of a building, a purpose, and a moment in time.

  Elias looked at his reflection in the dark window. He saw a tired man in a suit. He tried to find the part of himself that knew the difference between a lie and a truth. He searched for the anchor point, the place where he stood outside the story and looked in.

  He couldn't find it.

  If he said *yes*, he collapsed the model. He invalidated the last four hours of his work, the sentiment stabilization, the strategic positioning. He would be admitting to a war crime.
  If he said *no*, he maintained the stability.

  But it wasn't a calculation anymore. It was a perception issue. When he closed his eyes, he didn't see the textbook. He saw the spreadsheet. He saw the occupancy rates. He saw the sentiment analysis turning green. The spreadsheet felt more real than the woman screaming on the television. The spreadsheet had internal consistency. The woman had only emotion.

  "El?"

  "It's a complex environment, Martha," Elias said. "There are no binary distinctions out here. The enemy utilizes civilian infrastructure. To distinguish between the two is to grant them sanctuary."

  "You're not answering me."

  "I am answering you," Elias said, and he realized he was speaking the truth. *His* truth. The truth of the system he inhabited. "The building was neutralized because it posed a threat. The label is irrelevant."

  "You sound like them," she whispered. "You sound like the broadcast."

  "I sound like the situation requires," he said.

  He hung up.

  Elias walked out of the building into the cool night air. A newsstand was still open. The headlines on the evening papers were already printed. *PRECISION STRIKE NEUTRALIZES COMMAND NODE.*

  He bought a paper. He looked at the photo accompanying the article. It was the drone shot. The crater. But the caption had been cropped. The sign on the roof—*Veridian Primary*—was cut out of the frame.

  Elias stared at the photo. He knew, with a distant, fading part of his brain, that the sign had been there. He remembered the pixels. He remembered the font.

  But looking at the cropped photo, looking at the headline, feeling the weight of the paper in his hand, the memory of the sign began to dissolve. It became a hallucination. A glitch. Why would he remember a sign that wasn't in the official record? The official record was consistent. The paper, the broadcast, the spreadsheet, the press release—they all agreed.

  Only Elias's memory disagreed. And memory was fallible. Memory was subjective. The record was objective.

  He folded the paper and tucked it under his arm. He began to walk toward the subway. He passed a group of protesters holding candles. They were chanting names. *The children. The school.*

  Elias watched them with a detached curiosity. They were clinging to a factual truth that had already been superseded by a political truth. They were witnesses without a platform. They were trying to hold back the tide with a bucket.

  He felt a pang of pity for them. They were trapped in the chaos of what *was*. He was safe in the order of what *is*.

  As he descended the stairs, he checked his phone. A new alert from the office. *Sentiment holding steady. Opposition narrative failing to gain traction.*

  Elias smiled. It was a good day's work.

  He tried to recall his daughter's face, just to ground himself. She was ten. She liked math. She liked drawing.
  For a second, a terrifying thought flickered: *If the building was a school, was she in one like it?*
  He pushed the thought away. It was an irrelevant variable.
  *She is safe. The model says she is safe.*

  The train roared into the station, a blast of wind and noise. Elias stepped forward. He didn't look at the tracks. He looked at the advertisement on the opposite wall. It showed a smiling family, standing in front of a house.

  *Home,* the ad said. *Security. Certainty.*

  Elias nodded. He believed it. He had to. Because if he stopped believing, there was nothing left but the crater, and the sign, and the blood, and he had no model for that. He had no spreadsheet for guilt.

  He sat down as the doors closed, shutting out the protesters, the night, and the world of things that simply *were*. Inside the car, everything was illuminated, mapped, and explained. Elias closed his eyes and rested comfortably inside the story, safe from the truth.
