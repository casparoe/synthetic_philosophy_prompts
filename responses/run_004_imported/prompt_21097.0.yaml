answer: |-
  This is a crucial point to clarify before your seminar, as the claim you outline contains a significant historical and textual inaccuracy regarding Aquinas. While your description accurately reflects the later Jesuit theorist **Juan de Mariana** (1536–1624), it does **not** reflect the position of **Thomas Aquinas** (1225–1274).

  If you present the claim that Aquinas licenses *private individuals* to kill tyrants, you will likely face immediate correction from scholars of medieval political thought. Aquinas explicitly argues *against* private tyrannicide, even while acknowledging that a tyrant forfeits moral authority.

  Here is a reconstruction of Aquinas's actual position, the natural-law reasoning behind it, and the distinction between his view and Mariana's.

  ### 1. The Core Correction: Aquinas vs. Mariana
  *   **Juan de Mariana:** In *De Rege et Regis Institutione* (1599), Mariana argues that a tyrant who seizes power or rules without title may be killed by **any private citizen** (*privatus*), provided certain conditions are met. This is the "tyrannicide" theory often associated with the Jesuits and the Monarchomachs.
  *   **Thomas Aquinas:** In *De Regno* (On Kingship) and the *Summa Theologiae*, Aquinas argues that while a tyrant acts unjustly, the remedy must come from **public authority**, not private presumption. He explicitly warns that allowing private individuals to kill rulers leads to greater danger for the community than the tyranny itself.

  ### 2. Aquinas's Textual Evidence
  There are two primary texts where Aquinas addresses this.

  **A. *De Regno* (On Kingship), Book I, Chapter 6**
  This is the most direct treatment. Aquinas asks what ought to be done if a king becomes a tyrant.
  *   **The Argument:** He acknowledges that tyranny is the worst form of government. However, he argues that if private individuals attempt to kill the tyrant, they risk provoking the tyrant to greater cruelty, or they risk plunging the community into civil war if the tyrant's supporters retaliate.
  *   **The Verdict:** He writes: *"To proceed against the cruelty of tyrants is an act to be undertaken not through the private presumption of a few, but by public authority."*
  *   **The Mechanism:** If there is a superior authority (e.g., an Emperor over a King), that superior should intervene. If there is no superior, the remedy must come from the community acting through some public mechanism, not from vigilante action. He cites the example of the Roman Senate killing Domitian as a public act, not a private one.

  **B. *Summa Theologiae*, II-II, q. 64, a. 3 & q. 42, a. 2**
  *   **On Killing (q. 64, a. 3):** Aquinas establishes that it is lawful to kill a sinner only insofar as it is directed to the welfare of the whole community. Therefore, **only those who have care of the community (public authority)** may lawfully kill evildoers. A private individual does not have this charge. Even if the ruler is a "criminal," a private subject lacks the jurisdiction to execute judgment.
  *   **On Sedition (q. 42, a. 2):** Aquinas defines sedition as contrary to the unity of the multitude. While he admits that resisting a tyrant might not be sedition if the tyrant is the one disrupting unity, he maintains that the *manner* of resistance must not disturb the peace more than the tyranny itself.

  ### 3. Reconstructing Aquinas's Natural-Law Argument
  Aquinas's prohibition on private tyrannicide is rooted in his teleological view of law and order.

  1.  **The Primacy of Order:** The common good requires peace and order. Even a flawed order is often preferable to the chaos of civil strife. Private violence inherently destabilizes the legal order.
  2.  **Jurisdiction and Authority:** In Aquinas's natural law framework, the power of the sword (*gladii potestas*) belongs to the community as a whole, delegated to the ruler. When a ruler becomes a tyrant, he abuses that power, but the power does not automatically revert to every *individual* subject. It reverts to the *corporate* body or a higher magistrate.
  3.  **The Calculation of Evils:** Aquinas employs a utilitarian calculus within his natural law ethics. If killing a tyrant results in greater turmoil, succession crises, or a worse tyrant taking his place, the act is illicit. Since private individuals cannot guarantee the outcome, they cannot licitly undertake the act.

  ### 4. Conditions for Resistance (According to Aquinas)
  Aquinas does allow for resistance, but he places strict conditions on it that exclude private assassination:
  1.  **Public Authority:** The action must be taken by a body representing the community (e.g., barons, estates, senate) or a superior magistrate.
  2.  **No Greater Evil:** The removal of the tyrant must not cause more harm to the common good than the tyranny itself.
  3.  **Due Process (where possible):** Ideally, the ruler should be deposed through legal or constitutional mechanisms, not murder.

  ### 5. Recommendation for Your Lecture
  To ensure accuracy in your graduate seminar, I recommend framing the lecture to show the **evolution** of resistance theory rather than attributing the later view to Aquinas.

  *   **Step 1:** Present Aquinas as the starting point who establishes that tyranny is illegitimate *but* denies the license for private violence. This highlights the medieval concern for order and hierarchy.
  *   **Step 2:** Trace the shift during the Conciliar Movement and the Wars of Religion, where theorists began to argue that authority resides fundamentally in the community.
  *   **Step 3:** Introduce Juan de Mariana as the culmination of this shift, where the "forfeiture of authority" finally leads to the "private license to kill" under specific natural-law conditions.

  **Summary for your notes:**
  *   **Aquinas:** Tyrant forfeits moral claim to obedience; removal is a matter for **public authority**; private tyrannicide is **forbidden**.
  *   **Mariana:** Tyrant forfeits authority; becomes a public enemy; private tyrannicide is **permitted** (under strict conditions).

  Making this distinction will demonstrate a sophisticated grasp of the historiography of political thought to your seminar.
