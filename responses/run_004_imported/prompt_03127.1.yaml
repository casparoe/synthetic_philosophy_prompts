      *   Keep the *Monadology* references specific (Section 17, windowless, *petites perceptions*).
      *   Make sure to answer the specific prompt: Vindication or Hostility? (Answer: Sympathetic to the *spirit*, hostile to the *ontology*).

  7.  **Self-Correction/Review during drafting:**
