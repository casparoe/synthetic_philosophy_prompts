      *   *Refined Timing Argument:* The timing isn't trivial because it transforms a *counterfactual* possibility (what if I hadn't been destroyed?) into an *actual* state of affairs. In Standard Teleportation, the "what if" is destroyed with the body. In Branch-Line, the "what if" walks out the door. The existence of the "what if" as a separate entity proves the Original is left behind.

