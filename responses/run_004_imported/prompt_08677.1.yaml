      *   *Wait, a stronger angle:* The "Constitution View" or "Animalism." I am my organism. The replica is a distinct organism. Psychological continuity is irrelevant to *my* survival as an organism.
      *   *Even stronger angle (Phenomenological):* The "Open Future." When I look forward, I expect to experience *one* future. In Branch-Line, there are two futures. I cannot experience both. Therefore, one of them is *not mine*. Since I am the Original, the Replica's future is not mine. The fact that the Replica exists *now* proves that my future does not include his experiences.
      *   *Addressing the Timing:* In normal teleportation, the destruction is simultaneous with replication. We pretend the stream continues. In Branch-Line, the stream splits. The Original's stream ends. The timing matters because it allows the split to become ontologically manifest. It transforms a theoretical possibility into an actual conflict of perspectives.

  6.  **Drafting the Argument Structure:**
      *   **Introduction:** Acknowledge Parfit's strength (Relation R) but state the verdict clearly (Identity Matters, Original Dies).
      *   **Point 1: The Non-Transitivity of Identity vs. Transitivity of Relation R.** Identity is 1-to-1. R is 1-to-many. If R were what matters, branching wouldn't be a problem. But it *is* a problem.
      *   **Point 2: The Subjective Perspective (The "I").** Survival is about *who is looking out through the eyes*. Coexistence proves there are two "lookers."
      *   **Point 3: Answering the "Trivial Timing" Challenge.** This is the crux. It's not about the hours; it's about the *unmasking*. Normal teleportation hides the destruction of the subject. Branch-Line reveals it. The timing allows the divergence of interests.
      *   **Point 4: Normative Consequences.** Self-interest is indexed to the subject. I cannot care about *my* future if *I* am not there.
      *   **Conclusion:** The Original is right to fear.

  7.  **Polishing the Philosophy (Self-Correction during drafting):**
      *   *Critique:* Parfit would say "So what? You are distinct, but R holds, so you should be satisfied."
      *   *Rebuttal:* I need to argue that R *without Identity* is insufficient for what we mean by "survival." Survival implies *I* go on. If *I* don't go on, R is just having a very similar cousin.
      *   *The "Trivial Timing" specific rebuttal:* Parfit says the difference between Standard and Branch-Line is just when the original is destroyed. If Standard is survival, Branch-Line should be too.
      *   *Counter:* Standard Teleportation is *not* survival. It is death + replication. We accept it only because we lack evidence to the contrary. Branch-Line provides the evidence (coexistence). Therefore, the timing *is* significant because it provides the epistemic access to the metaphysical truth of distinctness.
      *   *Wait, I need to be careful.* If I say Standard Teleportation is death, I might undermine the novel's premise if the public accepts it.
      *   *Better approach:* Focus on the *Branch-Line* specifically. The coexistence creates a **conflict of interests**. When two entities coexist, they can want different things. This proves they are distinct centers of moral concern. In Standard Teleportation, there is no conflict because there is only one. The timing allows the conflict to emerge. The emergence of conflict proves distinctness. Distinctness means the Original's death is real.

  8.  **Finalizing the Argument (The "Divergence of Interests" Strategy):**
      *   This is the strongest way to handle the "trivial timing" objection.
      *   Argument: Identity is required for the *unity of agency*.
      *   When Original and Replica coexist, they immediately diverge in location and potentially desire.
      *   This divergence proves they are two agents.
      *   If they are two agents, the Original's death is the end of *that* agent.
      *   Why timing matters: It allows the divergence to occur *before* the Original dies. In Standard Teleportation, divergence is impossible because the Original is gone. In Branch-Line, the *possibility* of divergence becomes *actual*.
      *   Actual divergence kills the claim of Identity.
      *   Therefore, Identity matters, and the Original dies.

