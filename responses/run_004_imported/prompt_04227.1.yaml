answer: |-
  Your teacher is absolutely right. This isn't just a quirky footnote; it is one of the most fascinating and tragic intellectual stories in the history of philosophy.

  To understand why a rigorous Cambridge professor spent decades testing mediums for telepathy, you have to understand the specific existential crisis Sidgwick faced in his ethics.

  Here is the actual chain of reasoning, step-by-step, connecting the **Dualism of Practical Reason** to **Psychical Research**.

  ### 1. The Ethical Problem: The Dualism of Practical Reason
  In his masterwork, *The Methods of Ethics* (1874), Sidgwick tries to figure out what we are rationally required to do. He identifies two main methods that both seem logically sound:

  *   **Rational Egoism:** It is rational to act in a way that maximizes **my own** happiness. (After all, I am the one experiencing my pain and pleasure.)
  *   **Rational Utilitarianism:** It is rational to act in a way that maximizes **everyone's** happiness. (After all, from a universal point of view, my happiness counts no more than anyone else's.)

  **The Conflict:** Sidgwick realized these two methods often contradict each other. Sometimes, doing what is best for the world (Utilitarianism) requires a massive sacrifice that ruins your own life (Egoism).
  *   *Example:* You could donate all your money to effective charities. That maximizes global happiness. But it leaves you in poverty. Egoism says "Don't do it." Utilitarianism says "Do it."

  **The Dualism:** If both Egoism and Utilitarianism are "rational," but they demand opposite things, then **Reason is divided against itself.** This is the "Dualism of Practical Reason." For Sidgwick, this was a catastrophe. If reason is fundamentally contradictory, then morality might be irrational. He called this "the fundamental contradiction of our moral nature."

  ### 2. The Only Theoretical Solution: Cosmic Justice
  Sidgwick searched for a way to harmonize these two methods. He needed a scenario where **what is good for me** and **what is good for everyone** are always the same thing.

  The only way to guarantee this alignment is if the universe is structured morally. Specifically:
  1.  There must be a God (or a moral cosmic order).
  2.  This God must enforce **sanctions** (rewards and punishments).
  3.  Virtue (Utilitarian behavior) must always lead to Happiness (Egoistic goal) in the long run.

  **The Problem of This Life:** Sidgwick was an empiricist. He looked around and saw that wicked people often prosper and righteous people often suffer in *this* life. The math doesn't add up here.

  **The Necessity of an Afterlife:** For the "Egoist" to be rationally compelled to be a "Utilitarian," there must be a future state where the debts are paid. If I sacrifice my happiness now for the greater good, I must be compensated later. Otherwise, I am a fool for being moral.

  So, Sidgwick concluded that **belief in an afterlife is a necessary precondition for morality to be fully rational.**

  ### 3. The Empirical Gap
  Here is where Sidgwick gets stuck. He is a scientist-philosopher in the age of Darwin and Huxley. He cannot simply *assume* God and Heaven exist based on faith or tradition. That isn't rigorous. He needs **evidence**.

  He writes in a letter:
  > *"I have been led to look upon the proof of a future life as the most important of all problems... for without it the moral world seems to me to be a chaos."*

  If he can prove scientifically that consciousness survives death, he validates the possibility of the "Cosmic Justice" required to solve his ethical Dualism.

  ### 4. Enter the Society for Psychical Research (SPR)
  This is why he co-founded the SPR in 1882.

  Sidgwick didn't join because he loved ghost stories. He joined because he thought **Psychical Research was the only scientific method available to test for an afterlife.**
  *   **Telepathy:** If telepathy is real, it suggests the mind can operate independently of the known physical senses.
  *   **Mediumship:** If mediums can communicate with the dead, it proves survival of consciousness.

  He spent decades interviewing mediums, analyzing trance states, and investigating hauntings. He approached it with extreme skepticism, debunking most claims. He wasn't looking for magic; he was looking for **data points** that would allow him to believe in the afterlife without violating his scientific integrity.

  ### 5. The Tragic Conclusion
  The chain of reasoning is this:
  1.  **Ethics:** Morality requires that Virtue = Happiness.
  2.  **Observation:** In this life, Virtue $\neq$ Happiness.
  3.  **Requirement:** Therefore, there must be an Afterlife where Virtue = Happiness.
  4.  **Epistemology:** I cannot believe in the Afterlife without empirical evidence.
  5.  **Action:** I will use science (SPR) to find evidence of the Afterlife to save Ethics.

  **Did it work?**
  No. Sidgwick died still troubled by the Dualism. He never found the conclusive proof he needed. He remained an agnostic theist—hoping the moral order existed, but unable to prove it.

  ### Summary for your Extra Credit
  If you want to impress your teacher, frame it like this:

  Sidgwick's psychical research wasn't a departure from his philosophy; it was an **applied extension of it.** He realized that his ethical system (*The Methods of Ethics*) collapsed without a metaphysical guarantee of justice. Since he refused to accept religious dogma without proof, he turned to **parapsychology as an empirical theology.** He was trying to scientifically verify the conditions required for morality to be rational.

  It shows just how high the stakes were for him: without an afterlife, he feared ethics was just a beautiful lie.
