answer: |-
  This is the single most common and legitimate objection to *The Structure of Scientific Revolutions*. You are definitely not missing anything; in fact, if your undergrads don't ask this, they haven't read the text closely. This is the "No Neutral Algorithm" objection, famously pressed by philosophers like Putnam, Shapere, and Boyd.

  Since you have section on Friday, here is the breakdown of how to resolve this tension without misrepresenting Kuhn, tailored for someone with your physics background.

  ### 1. The Core Misunderstanding: Incommensurable $\neq$ Incomparable
  The biggest hurdle is the literal meaning of the word. In mathematics, incommensurable quantities (like the side and diagonal of a square) lack a common *unit* of measure, but they are not **incomparable**. You can still relate them geometrically.

  Kuhn's point is not that we cannot compare Newton and Einstein. His point is that there is no **neutral language** into which both can be fully translated without loss or distortion.
  *   **Newtonian Mass:** Defined by its role in $F=ma$ and universal gravitation. It is conserved, invariant, and distinct from energy.
  *   **Einsteinian Mass:** Defined by its role in relativity. It is frame-dependent, convertible to energy, and part of a stress-energy tensor.

  If you try to translate Einstein's mass into Newton's vocabulary, you break the logical web of Newtonian physics. However, we can still **compare** the paradigms based on how well they satisfy shared professional values.

  ### 2. The Resolution: Shared Values, Not Neutral Truth
  You asked: *"Wouldn't you need some neutral yardstick sitting outside both paradigms to do that?"*

  Kuhn's answer is **no**, because the yardstick isn't "Truth" or "Reality" (the external neutral standard). The yardstick is the **sociological consensus of the scientific community.**

  In the Postscript and later essays (specifically *"Objectivity, Value Judgment, and Theory Choice"*), Kuhn clarifies that while there is no algorithm for theory choice, there are **shared epistemic values**. Scientists across paradigms generally agree on what makes a theory "good," even if they disagree on which theory fits the bill. These values include:
  1.  **Accuracy** (empirical fit)
  2.  **Consistency** (internal and external)
  3.  **Scope** (how many phenomena it covers)
  4.  **Simplicity** (parsimony)
  5.  **Fruitfulness** (ability to generate new puzzles/research)

  **The Argument:**
  Einstein's paradigm is "better" than Newton's not because it corresponds better to God's-eye Reality, but because it scores higher on **Scope** and **Accuracy** in extreme regimes, while retaining enough of the other values to be acceptable.
  *   Newtonian physics fails on *Accuracy* (Mercury's perihelion).
  *   Einsteinian physics succeeds on *Scope* (covers high velocity/gravity) and *Accuracy*.

  The "yardstick" is internal to the practice of science, not external to it. Progress is defined by the community's ability to solve puzzles, not by getting closer to an ontological truth.

  ### 3. Evolution without Teleology
  This is Kuhn's famous phrase from the Postscript. If you take one thing to section, make it this.

  *   **Traditional View (Cumulative):** Science marches toward The Truth. (Teleological)
  *   **Kuhn's View (Evolutionary):** Science adapts to the environment (nature + available instruments).

  Biological evolution produces "progress" (organisms become better adapted to their niche), but there is no "final perfect organism" toward which evolution is striving. Similarly, science progresses from primitive beginnings to more sophisticated puzzle-solving tools, but there is no guarantee we are getting closer to the "ultimate truth" of the universe.

  So, when Kuhn says Einstein is "better," he means "more highly evolved for the current environment of inquiry," not "truer in an absolute sense."

  ### 4. Why the Postscript Felt Unsatisfying
  You mentioned the Postscript didn't clear it up. That's common. In the Postscript, Kuhn is mostly defending against critics who called him a relativist or irrationalist. He doubles down on incommensurability rather than softening it.

  The clarification you're looking for is more explicit in his 1977 essay *"Objectivity, Value Judgment, and Theory Choice."* There, he admits that if two scientists share all the same values but weigh them differently (e.g., Scientist A prioritizes Simplicity, Scientist B prioritizes Scope), they can rationally disagree. This explains the "revolution" phase: it's not that one side is irrational, but that the weighting of shared values shifts across the community.

  ### 5. Discussion Section Strategy (For Friday)
  Since you're TAing intro students, don't get bogged down in the metaphysics. Use their intuition.

  **The "Political Debate" Analogy:**
  Ask the students to imagine a debate between a Democrat and a Republican in 1950 vs. 2024.
  *   **Incommensurability:** The meaning of "Freedom," "Security," or "Fairness" has shifted. A 1950 Conservative and a 2024 Conservative might use the same words but mean different things (semantic incommensurability).
  *   **Progress/Comparison:** Can we say one administration was "better"? Yes, but not by an external "Truth" meter. We use shared values: GDP, unemployment, stability.
  *   **The Kuhn Point:** We can judge the administration (paradigm) by shared metrics (values), even if the definitions of the policies (concepts) have shifted.

  **Discussion Questions to Pose:**
  1.  "If Newtonian mass and Einsteinian mass are different concepts, how is it that Newton's equations still work for sending rockets to the moon? Is Kuhn saying Newton is 'wrong' or just 'limited'?" (Leads to the idea of limiting cases vs. ontological shifts).
  2.  "Kuhn says progress is 'puzzle solving.' Is solving more puzzles the same thing as finding the Truth? Can you be really good at solving puzzles in a game that's based on false premises?"
  3.  "If there is no neutral yardstick, how do we decide when to switch paradigms? Is it just a mob mentality, or is there a rational basis?" (Leads to the Shared Values argument).

  ### Summary for your notes:
  *   **Contradiction?** No. Incommensurability denies a *neutral language/ontology*, not *comparability*.
  *   **Yardstick?** The yardstick is **shared professional values** (accuracy, scope, etc.), not correspondence to external reality.
  *   **Progress?** Yes, but it is **evolutionary** (adaptation), not **teleological** (marching toward Truth).
  *   **Physics Note:** As a physicist, you know $F=ma$ is a limiting case of Relativity. Kuhn argues that while the *math* limits correctly, the *concepts* (space, time, mass) undergo a Gestalt shift. That is the incommensurability.

  Good luck on Friday. If you frame it as "Evolution without Teleology" + "Shared Values vs. Neutral Truth," you'll nail it.
