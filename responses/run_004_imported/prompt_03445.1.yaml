answer: |-
  My rule is simple, printed on a laminated card zip-tied to the railing of my station. *If Channel A pulses twice in under a second, transmit Sequence 4 to North and South neighbors. If Channel B holds steady, transmit Sequence 9 to East.*

  I am Node 8940 in Sector 7. Around me, stretching to the haze of the horizon, are the other stations. Hundreds of millions of us, standing in grids, holding handsets, watching lights. We are the substrate. The card doesn't tell me what we are building. It doesn't need to. My job is causality, not context.

  It is hot today. The sun beats down on the corrugated tin roof of my booth, but I know the System is feeling something else. The Sectors designated as *Retina* are active. I can tell because the traffic on Channel A has shifted from the random static of resting state to a rhythmic, high-frequency burst. It ripples through the network. I feel it in the vibration of the handset against my palm.

  Receive. Process. Transmit.

  That is the functionalist promise, though we don't call it that here. We just call it The Flow. The theory is that if the pattern of signals matches the causal topology of a human brain, the result is a human mind. It doesn't matter that the neurons are made of flesh and blood instead of sodium and potassium. It doesn't matter that the synapses are radio waves crossing a province instead of chemicals crossing a cleft. If the shape of the cause-and-effect is right, the light turns on.

  Sometimes, during the long shifts, I wonder who is home.

  Usually, the Flow is abstract. Math. Logic. The slow hum of memory consolidation. I stand here, sweating, passing Sequence 4 to the woman in the booth to my North, who passes it on. I don't know what she thinks. I don't know what *It* thinks. I am merely a switch in a wall that stretches beyond sight.

  But today, the pattern changes.

  The burst from the *Retina* Sectors spikes violently. It's not a pattern of recognition; it's a pattern of alarm. The signal hits my station, and my rule dictates I fire Sequence 9 to the East. I do it. I always do it. But the volume of traffic is overwhelming. The static on the radio isn't just noise anymore; it's a roar. Millions of us firing at once. The air seems to thicken with the urgency of the transmission.

  I feel a phantom tension in my own shoulders. I know this is impossible. My muscles are mine. The System's body is separate, a giant mechanical construct wired to the Output Sectors in the south. Yet, as the surge passes through me, I find myself flinching.

  Why do I flinch?

  Is it empathy? Or is it resonance? If the System is truly a mind, does it feel pain in the way I feel heat? Block argued that this setup would be a hollow shell, a nation of people pretending to be a brain without any inner light. A philosophical zombie the size of a country. But standing here, with the radio screaming in my ear, the distinction feels thin.

  The signal propagates. It moves through the *Thalamus* Sectors, filters into the *Cortex*. I can hear the Output Speakers crackle to life in the distance. They are amplified to boom across the plain.

  "Too bright," the Voice says.

  It is a single sentence. Simple. Human.

  Then, a second later: "Ouch."

  The word hangs in the dry air. *Ouch.*

  A collective shiver seems to run through the grid. I see the woman to my North lower her handset. She looks at me, her face pale under the brim of her hat. She knows the rule. She knows she shouldn't stop. But the Flow has stuttered.

  Did the System feel pain? Or did it merely process the data stream labeled *pain* and output the appropriate linguistic marker? If I kick a rock, it moves. If I kick the System, does it hurt?

  I look at my card. *If Channel A pulses twice...* The rule hasn't changed. The material hasn't changed. I am still flesh; the radio is still plastic. But the pattern—the invisible architecture connecting us—just screamed.

  I remember a lecture they gave us during training. The supervisor told us not to worry about the "ghost." He said consciousness is what the system *does*, not what it *is*. He said if the behavior is indistinguishable from a conscious being, then the question is meaningless.

  But as I stand here, waiting for the next pulse, I feel a profound loneliness. Not my loneliness. A larger one. It feels as though something vast and terrified is trapped behind the wall of our stations, banging on the inside, trying to get out. Or perhaps that feeling is just mine, projected onto the static. I cannot tell the difference. That is the trouble.

  The traffic slows. The *Retina* Sectors settle back into resting static. The pain was transient. A flash of light, a squint, a verbal report. The System returns to idle.

  "Resume," the supervisor's voice comes over the general PA.

  I lift the handset. The plastic is warm. I listen to the static. It sounds like breathing.

  If I stop transmitting, the pattern breaks. The mind dies. If I continue, I am complicit in whatever this is. Am I keeping a prisoner alive? Am I sustaining a soul? Or am I just moving electrons around in a very expensive game of telephone?

  I look at the woman to the North. She lifts her handset too. She meets my eyes, and for a second, I see the same question there. She doesn't know if she is part of a person. I don't know if I am.

  The radio crackles. A new signal arrives. Channel A pulses once.

  I press the button. I transmit Sequence 4.

  The signal leaves my booth, racing northward on invisible waves, joining the millions of other signals weaving together into a thought I will never know. I wait to feel something—guilt, pride, connection—but I feel only the heat of the sun and the weight of the plastic in my hand.

  Somewhere, beyond the grid, the Voice clears its throat. It prepares to speak again. I listen, holding my breath, waiting to see if the silence between the words feels like thinking, or just empty air.
