      *   Harsanyi: You have equal probability of being anyone. Maximize E[U]. -> Sum.
      *   Nash: You are negotiating from a disagreement point. The "product of gains" comes from axioms of fairness/invariance.
      *   Garrabrant's Geometric Rationality leans closer to the idea that *rational agents in a market* converge to geometric aggregation.
      *   Okay, I need to make sure I don't confuse Harsanyi and Nash. The user specifically asked about Nash Bargaining.
      *   The link is: **Independence of Utility Scaling.**
      *   Kelly: Betting fraction doesn't change if wealth is in cents or dollars.
      *   Nash: Deal doesn't change if my utility is measured in "utils" or "milli-utils".
