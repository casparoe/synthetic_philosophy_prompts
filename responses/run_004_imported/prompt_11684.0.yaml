  ok random question from my game theory class - we keep going over iterated elimination of dominated strategies (removing dominated strategies round by round until nothing more can go) and I think I found a shortcut for the homework. my professor keeps saying that at each round you have to check whether a strategy is dominated by a mixed strategy, like some 50/50 or whatever combo of two other options, not just by the other pure strategies on thier own. but if ive already checked every other pure strategy against mine and none of them beats it in literally every case the opponent could play, doesnt that already prove nothing can dominate it, mixed or not? feels like checking mixtures is just extra busywork once youve ruled out all the pure ones individually. is my professor just being overly careful here or am i actually missing something?
