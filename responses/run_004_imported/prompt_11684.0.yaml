answer: |-
  I hate to be the bearer of bad news, but **your professor is right, and your shortcut will lead you to the wrong answer.**

  This is one of the most common misconceptions in introductory game theory. It feels intuitive that if no *single* strategy beats yours, then no *combination* of them should either. But mathematically, that isn't true.

  Here is the breakdown of why you are missing something, along with a concrete example you can use to prove it to yourself.

  ### The Intuition: "Hedging" Beats "Mediocrity"
  Your logic assumes that if Strategy A fails to beat Strategy B in one scenario, and Strategy C fails to beat Strategy B in another scenario, then A and C are "weak."

  However, a mixed strategy allows you to **average out the weaknesses**.
  *   Strategy A might be amazing in Scenario 1 but terrible in Scenario 2.
  *   Strategy C might be terrible in Scenario 1 but amazing in Scenario 2.
  *   Strategy B is "okay" in both.

  Neither A nor C beats B on their own (because they both have a "terrible" outcome). But if you mix A and C 50/50, you get "good" in Scenario 1 and "good" in Scenario 2. That average can easily beat the "okay" of Strategy B in **both** cases.

  ### The Counter-Example
  Let's look at a payoff matrix for **Player 1**. Player 2 has two choices (Left, Right). Player 1 has three choices (Top, Middle, Bottom).

  | Player 1 \ Player 2 | Left | Right |
  | :--- | :---: | :---: |
  | **Top** | 4 | 0 |
  | **Middle** | 0 | 4 |
  | **Bottom** | 1 | 1 |

  **Step 1: Check for Pure Strategy Dominance (Your Shortcut)**
  Let's see if **Bottom** is dominated by **Top**.
  *   vs Left: Top (4) > Bottom (1).
  *   vs Right: Top (0) < Bottom (1).
  *   **Result:** Top does *not* dominate Bottom.

  Let's see if **Bottom** is dominated by **Middle**.
  *   vs Left: Middle (0) < Bottom (1).
  *   vs Right: Middle (4) > Bottom (1).
  *   **Result:** Middle does *not* dominate Bottom.

  **Using your logic:** Since neither Top nor Middle dominates Bottom individually, Bottom is safe. You would keep it in the game.

  **Step 2: Check for Mixed Strategy Dominance (The Professor's Way)**
  Now, let's create a mixed strategy $\sigma$ where Player 1 plays **Top 50% of the time** and **Middle 50% of the time**.

  *   **Expected Payoff vs Left:** $(0.5 \times 4) + (0.5 \times 0) = \mathbf{2}$
  *   **Expected Payoff vs Right:** $(0.5 \times 0) + (0.5 \times 4) = \mathbf{2}$

  Now compare this Mixed Strategy to **Bottom**:
  *   vs Left: Mixed (2) > Bottom (1)
  *   vs Right: Mixed (2) > Bottom (1)

  **Result:** The mixed strategy **strictly dominates** Bottom. In a rational game, Player 1 should never play Bottom. If you use your shortcut, you keep Bottom in the matrix, which changes the rest of the Iterated Elimination process and likely gives you the wrong Nash Equilibrium.

  ### Why This Happens (Geometric View)
  If you visualize the payoffs as points on a graph, the set of all possible payoffs from **mixed strategies** forms a "convex hull" around the pure strategies.

  A pure strategy can sit *inside* that hull. Even if it isn't lower than any single corner point (pure strategy) in every dimension, it can be lower than the *boundary* formed by connecting those corners.

  ### When Do You Actually Need to Check This?
  You only need to check for mixed strategy domination when a player has **three or more strategies**.
  *   If a player only has 2 strategies (A and B), A cannot be dominated by a mix of "other" strategies, because there is only one other strategy (B).
  *   Once you have 3+ strategies (A, B, C), Strategy C could be dominated by a mix of A and B, even if A and B don't dominate it individually.

  ### Summary
  It feels like busywork because calculating expected utilities for mixes is tedious compared to just scanning rows. But it is theoretically necessary.

  **Don't skip the step!** If you hand in homework assuming pure strategy checks are sufficient, you will miss eliminations like the "Bottom" strategy in the example above, and your final solution will be incorrect. Your professor isn't being overly careful; they are enforcing the actual math of the field.
