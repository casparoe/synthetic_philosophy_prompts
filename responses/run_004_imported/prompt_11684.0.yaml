      *   **Mathematical Verification:** Let payoffs for strategy $S$ be vector $u_S$. Let payoffs for strategies $A$ and $B$ be $u_A$ and $u_B$.
          *   $S$ is not dominated by $A$ means there exists some opponent profile $o_1$ where $u_S(o_1) > u_A(o_1)$.
          *   $S$ is not dominated by $B$ means there exists some opponent profile $o_2$ where $u_S(o_2) > u_B(o_2)$.
          *   Can a mix $\sigma = pA + (1-p)B$ dominate $S$?
          *   We need $p \cdot u_A(o) + (1-p) \cdot u_B(o) > u_S(o)$ for all $o$.
          *   Yes, this is possible. This is a classic result in game theory.

