prompt: |-
  Please help me understand a passage from Hobbes's *Six Lessons to the Professors of the Mathematics* (1656), his combative reply to John Wallis and Seth Ward in the quarrel over his claimed quadrature of the circle. At one point Hobbes generalizes from the geometrical dispute to a broader epistemological claim:

  "Of arts, some are demonstrable, others indemonstrable; and demonstrable are those the construction of the subject whereof is in the power of the artist himself, who in his demonstration does no more but deduce the consequences of his own operation. The reason whereof is this, that the science of every subject is derived from a precognition of the causes, generation, and construction of the same; and consequently, where the causes are known, there is place for demonstration, but not where the causes are to seek for. Geometry therefore is demonstrable, for the lines and figures from which we reason are drawn and described by ourselves; and civil philosophy is demonstrable, because we make the commonwealth ourselves. But because of natural bodies we know not the construction, but seek it from the effects, there lies no demonstration of what the causes be we seek for, but only of what they may be."

  Two things puzzle me, and I'd like help thinking them through rather than a mere paraphrase. First, Hobbes treats drawing a figure with rule and compass and founding a commonwealth by covenant as instances of the same kind of "making" for purposes of demonstrability, yet these look like quite different senses of construction. Is there a single, principled notion of construction doing the work in both cases, given the rest of his materialist, causal theory of definition and science? Second, the thesis sits awkwardly with the historical record: Hobbes's own quadrature was rejected by every competent geometer of his day, and his civil philosophy proved no less contested than anyone else's. If our making the subject matter is supposed to guarantee demonstrative certainty, why doesn't that show up as actual agreement in practice, and how might Hobbes have tried to block this objection using his own theoretical resources?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Source:** Thomas Hobbes, *Six Lessons to the Professors of the Mathematics* (1656).
      *   **Passage:** A specific quote distinguishing "demonstrable" vs. "indemonstrable" arts based on whether the artist constructs the subject matter (Geometry, Civil Philosophy) vs. seeking causes from effects (Natural Philosophy).
      *   **Task:** Help the user understand two specific puzzles, avoiding mere paraphrase.
      *   **Puzzle 1 (The Nature of Construction):** How can drawing a figure and founding a commonwealth be the *same kind* of "making" (construction) within Hobbes's materialist/causal framework? Is there a principled unity here?
      *   **Puzzle 2 (The Empirical Failure):** Hobbes claims this "making" guarantees demonstrability/certainty. Yet, his geometry was wrong, and his politics was contested. Why doesn't this guarantee yield actual agreement? How would Hobbes defend himself using his own theory?

  2.  **Deconstruct Puzzle 1: The Unity of Construction:**
      *   *Initial thought:* Drawing a circle is physical; making a state is social/political. They seem different.
      *   *Hobbes's Materialism:* Everything is body in motion. Thought is motion in the head. Words are marks/signs.
      *   *The Key Concept:* "Generation" or "Causal Definition." For Hobbes, to *know* something scientifically is to know how it is *generated*.
      *   *Geometry:* I don't just look at a circle; I define it by the motion that creates it (a point moving around a center). The definition *is* the recipe for construction.
      *   *Civil Philosophy:* The Commonwealth isn't a natural organism (like a bee hive). It is an artificial man. It is created by a specific motion/action: the Covenant (mutual transferring of rights).
      *   *The Link:* In both cases, the *essence* of the object is identical to the *procedure* of its creation known by the creator. I know the circle because I made the rules for it. I know the Sovereign's rights because I (conceptually) authored the transfer that created them.
      *   *Principled Notion:* It's about *a priori* knowledge of causes. If I stipulate the cause (the motion of the pen, the act of covenant), I know the effect necessarily. It's not about the physical labor; it's about the *volitional stipulation of causes*.
      *   *Refinement:* Need to emphasize that for Hobbes, "construction" isn't just physical crafting; it's the *conceptual generation* of the object through defined motion.

  3.  **Deconstruct Puzzle 2: The Gap between Theory and Practice:**
      *   *The Objection:* If it's demonstrable, why did Wallis beat Hobbes? Why do people disagree about the Sovereign?
      *   *Hobbes's Defense (Geometry):* Hobbes didn't think he was wrong. He thought the *standards* of the mathematicians were corrupted by "university nonsense" (algebra, symbols without referents). For Hobbes, true geometry is about *magnitudes*, not numbers. If you disagree, you aren't doing *his* kind of geometry. He shifts the goalposts: "Demonstrable" doesn't mean "everyone will agree immediately," it means "it *can* be demonstrated if you follow the right method (resolutive-compositive)." The error lies in the *reasoning of the critics*, not the method.
      *   *Hobbes's Defense (Civil Philosophy):* Why disagreement? Passions. Interest. In geometry, lines don't care if I'm angry. In politics, men's interests conflict. The *capacity* for demonstration exists (the logic holds), but the *application* is blocked by human irrationality/passion.
      *   *Theoretical Resource:* The distinction between *Scientia* (knowledge of consequences) and *Prudentia* (experience). Also, the idea that Civil Philosophy is demonstrable *in principle* (like geometry), but requires the right definitions. If people reject the definitions (e.g., about human nature or rights), they break the chain.
      *   *Crucial Nuance:* Hobbes distinguishes between the *truth* of the demonstration and the *acceptance* of it. The "making" guarantees the former, not the latter. Also, the "making" of the Commonwealth is a one-time foundational act (conceptual), whereas geometry is repeatable. But the *knowledge* of it comes from reconstructing that act in reason.

  4.  **Synthesize and Structure the Response:**
      *   **Introduction:** Acknowledge the depth of the passage. It's the core of Hobbes's "Galilean" ambition for philosophy.
      *   **Section 1: The Unity of Construction (Puzzle 1).**
          *   Focus on "Causal Definition" and "Generation."
          *   Explain that for Hobbes, to define is to describe the motion that creates the thing.
          *   Geometry: Point moving = Line.
          *   Politics: Individuals transferring right = Sovereign.
          *   The "Maker's Knowledge" argument: God knows nature because He made it; Man knows geometry/politics because he makes them (conceptually/contractually).
          *   Materialist link: Both are motions of bodies (pen/paper; humans in agreement).
      *   **Section 2: The Problem of Disagreement (Puzzle 2).**
          *   Address the Geometry failure: Hobbes's reaction was to attack the *method* of opponents (symbolic algebra vs. real magnitude). He claims *his* construction was right, theirs was corrupt. Demonstrability $\neq$ Universal Consensus (due to ignorance/error).
          *   Address the Politics failure: The "Impediment of Passion." Geometry is immune to interest; Politics is not. The *logic* is certain, but the *assent* is voluntary and often irrational.
          *   The "Ideal vs. Actual" distinction: The Commonwealth is an artificial construct we *ought* to recognize as our own making, even if historically messy.
      *   **Conclusion:** Summarize how these two points reveal Hobbes's radical rationalism. He isn't describing how things *are* empirically, but how they *must* be conceived to be known scientifically.

  5.  **Refine the Tone:**
      *   Avoid paraphrase (as requested).
      *   Be analytical and philosophical.
      *   Show familiarity with Hobbes's broader system (*De Corpore*, *Leviathan*, *Elements of Law*).
      *   Ensure the connection between materialism and the "construction" concept is clear.

  6.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I explain *why* natural philosophy is excluded? Yes, because we can't see the internal motion of nature, only effects.
      *   *Check:* Did I address the "materialist" aspect? Need to ensure I mention that covenants and lines are both "motions of bodies."
      *   *Check:* Is the distinction between "may be" (natural philosophy) and "are" (geometry/politics) clear? Yes, hypothetical vs. categorical causality.
      *   *Check:* On the second puzzle, make sure not to just say "Hobbes was arrogant." Explain the *theoretical* move he makes (blaming the reasoner/passions, not the method).

  7.  **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output based on these thoughts.)
answer: |-
  This passage is indeed the keystone of Hobbes's philosophical ambition. It is where he attempts to unify his physics, geometry, and politics under a single epistemological umbrella. To understand it, we must look past the surface difference between drawing a line and signing a contract, and instead look at what Hobbes thinks *science* (scientia) actually is.

  Here is a thinking-through of your two puzzles.

  ### 1. The Unity of Construction: From Compass to Covenant

  Your first puzzle asks how drawing a figure and founding a commonwealth can be the same kind of "making." On the surface, one is a technical manual act, the other a socio-linguistic performative act. However, within Hobbes's materialist and causal framework, they are unified by the concept of **generative definition**.

  For Hobbes, following the Galilean ideal of *resolutive-compositive* method, to "know" a thing scientifically is not to classify it, but to know its **cause**. Since matter is in motion, the cause of any object is the specific motion that generated it. Therefore, a true definition must be a recipe for construction.

  *   **In Geometry:** When I define a circle, I should not say "a round shape." I must say, "the figure described by a point moving around a fixed center at a constant distance." The definition *is* the instruction for the motion that creates the object. Because I stipulate the motion, I know necessarily what properties the resulting figure must have. I am not discovering a pre-existing Platonic form; I am tracking the consequences of a motion I initiated.
  *   **In Civil Philosophy:** The Commonwealth is not a natural growth (like a family or a hive). It is an "Artificial Man." How is it generated? By the motion of men's wills transferring their rights to a Sovereign. The "construction" here is the Covenant. Just as the geometer knows the properties of the circle because he dictated the motion that created it, the political philosopher knows the rights of the Sovereign because he understands the logical consequences of the act (the Covenant) that created the Sovereign.

  **The Principled Notion:**
  The unifying principle is **volitional causality**. In both cases, the "artist" (geometer or citizen) is the *author* of the causes.
  1.  **A Priori Causality:** In natural philosophy (physics), we see the effect (e.g., the motion of the planets) and have to guess the cause (gravity? vortices?). We are working backward. In geometry and politics, we start with the cause (the stroke of the pen; the words of the covenant) and deduce the effect.
  2.  **Materialist Consistency:** For Hobbes, thoughts and words are physical motions. The "construction" of a commonwealth is not mystical; it is a specific configuration of human bodies and vocal cords agreeing to be represented by one body. It is as physical as the compass drawing on paper, just more complex.
  3.  **Identity of Essence and Generation:** In both cases, the *essence* of the thing is identical to the *process* of its making. A circle *is* the trace of that specific motion; a Commonwealth *is* the product of that specific transfer of right.

  So, the "construction" is not merely physical crafting; it is the **stipulation of causes**. Because we stipulate the causes, we have "Maker's Knowledge." (Hobbes often implies a theological parallel: God knows nature because He made it; Man knows geometry and politics because, in those domains, Man is the God-like maker.)

  ### 2. The Gap Between Demonstrability and Agreement

  Your second puzzle is the stinging historical irony: Hobbes claims these fields are demonstrable, yet he was universally defeated in geometry and deeply contested in politics. If "making" guarantees certainty, why is there no consensus?

  To answer this using Hobbes's own resources, we must distinguish between the **objective capacity for demonstration** and the **subjective conditions for assent.**

  **Regarding Geometry (The Wallis Dispute):**
  Hobbes would not concede that his failure to agree with Wallis proves the indemonstrability of geometry. Instead, he would argue that the disagreement proves the corruption of the *professors*.
  *   **The Corruption of Method:** Hobbes believed the mathematicians of his day (like Wallis) had abandoned true geometry (magnitudes and bodies) for "symbols and algebra" (numbers and abstractions). For Hobbes, you cannot multiply a line by a line to get a number; that is nonsense.
  *   **The Defense:** He would argue that *true* geometry is demonstrable, but his critics were not practicing true geometry. They were playing with symbols. Therefore, their rejection of his quadrature was not a failure of the method, but a failure of *their* reasoning. For Hobbes, "demonstrable" means "capable of being derived from correct definitions of motion," not "capable of winning a vote among Oxford professors." He shifts the burden: the certainty is there if you look at the bodies and motions correctly; if you don't see it, you are blind to the material reality.

  **Regarding Civil Philosophy (The Political Contest):**
  Here, Hobbes has a more robust theoretical resource: **The Impediment of Passion.**
  *   **Interest vs. Truth:** In geometry, the lines and figures have no interest in the outcome. A triangle does not care if I prove its angles sum to 180 degrees. In civil philosophy, the "subject matter" (men) has a vested interest in the conclusion. If I demonstrate that absolute sovereignty is necessary for peace, a man who desires power has a *passionate incentive* to reject the demonstration.
  *   **Theoretical Resource:** Hobbes distinguishes between *Scientia* (knowledge of consequences) and *Prudentia* (experience). Civil philosophy is demonstrable *in principle* (like geometry) because we make the Commonwealth. However, the *application* of this science is obstructed by human irrationality.
  *   **The "Right Reason" Move:** Hobbes often implies that if men reasoned correctly from the definitions (human nature + covenant), they *would* agree. The fact that they disagree shows they are reasoning from passion or false principles (like "mixed government" or "divine right"), not from the constructive definition of the Commonwealth.
  *   **Ideal vs. Historical:** Hobbes is often describing the *logical construction* of a Commonwealth, not necessarily the messy historical origin of every existing state. We can demonstrate what a Commonwealth *must* be to function (because we construct the concept), even if actual historical commonwealths are flawed. The certainty lies in the *normative logic* of the construction, not in the empirical stability of every regime.

  **Synthesizing the Defense:**
  Hobbes would block your objection by arguing that **demonstrability does not entail universal psychological assent.**
  1.  **Error is possible:** Just because a proof exists doesn't mean everyone can follow it (due to ignorance or bad definitions).
  2.  **Will is fallible:** In politics, the will is clouded by passion. The "construction" guarantees that *if* you accept the premises (the covenant), the conclusions follow. It does not guarantee that men *will* accept the premises.

  ### Summary for Understanding
  To grasp this passage, view Hobbes not as an empiricist observing the world, but as a **rationalist engineer**.
  *   **On Construction:** He unifies geometry and politics because both are **engineering projects**. One engineers space; the other engineers social order. In both, the blueprint (definition) dictates the reality.
  *   **On Disagreement:** He views himself as the only one reading the blueprints correctly. The fact that others disagree is, to him, evidence of their incompetence (in math) or their corruption by passion (in politics), not evidence that the blueprint is flawed.

  The passage is less a description of how knowledge *actually* spreads among humans, and more a prescription for how knowledge *must* be built if it is to be certain. He is telling us: "Stop looking at nature for truth; you can't know it because you didn't make it. Look only at what you have made (figures and states), for there, and only there, can you be God-like in your certainty."
