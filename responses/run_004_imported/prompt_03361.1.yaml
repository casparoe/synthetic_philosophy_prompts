answer: |-
  You have nailed the vibe. Hobbes is absolutely the 17th-century ancestor of the "rationalist" project: take the messy, confusing world, strip it down to first principles, and derive the optimal system via logic. The *Leviathan* is basically an attempt to build a "civil science" that is as indisputable as a proof that the angles of a triangle sum to 180 degrees.

  However, there is a crucial correction to make regarding Hobbes's math credentials, and it actually helps answer your question about why this method hasn't stuck in political theory.

  ### 1. The Irony of the Circle
  Hobbes did **not** actually crack the quadrature of the circle. He became obsessed with this in his later years and published several claims that he had solved it, but he was famously, embarrassingly wrong. The mathematician John Wallis spent decades debunking Hobbes's proofs, and it became a major intellectual scandal.

  This is actually key to your point: **Hobbes's confidence in his geometric method outstripped his actual ability to execute it.** He believed that if you just defined your terms precisely enough, error would become impossible. But in politics (as in his geometry), he was smuggling controversial empirical claims into his "definitions."

  ### 2. Did people lose their nerve? (Spinoza didn't)
  People didn't exactly lose their nerve; the most rigorous of them doubled down. **Baruch Spinoza** is the big one here. His *Ethics* is literally titled *Ethics, Demonstrated in Geometrical Order*. It is structured with Definitions, Axioms, Propositions, Proofs, and Corollaries. He tried to do exactly what you're describing: deduce human emotion, ethics, and God from axioms like lines and planes.

  But Spinoza's *Ethics* is revered as a masterpiece of philosophy, not as a settled scientific proof. Nobody reads Spinoza and says, "Well, Proposition 5 is proven, so the debate is over." They read it and argue about whether the axioms hold water.

  ### 3. The Deeper Reason: Why Geometry Works and Ethics Doesn't
  There are three structural reasons why the "Euclidean Trick" works in math but fails in politics/ethics.

  **A. Stipulative vs. Contested Definitions**
  In geometry, a "point" is defined by the system. It has no reality outside the definitions. If you agree to Euclid's axioms, you *must* agree to the theorems.
  In politics, the "axioms" are essentially contested concepts. Hobbes starts with definitions of "passion," "power," and "fear." But these aren't logical stipulations; they are empirical claims about human psychology.
  *   **Math:** "A triangle is a three-sided polygon." (True by definition)
  *   **Hobbes:** "Man is driven by a perpetual and restless desire for power." (Debatable empirical claim disguised as a definition)
  If your axioms are empirical, your deduction is only as strong as your observation, and human observation is fallible.

  **B. The Is-Ought Gap (Hume's Guillotine)**
  Geometry deals with what *is* (relations of quantity and figure). Politics deals with what *ought* to be.
  David Hume later pointed out that you cannot logically derive an "ought" from an "is." You can deduce that "If you want security, you need a sovereign," but you cannot deduce "You *should* want security" purely from geometry. There is always a normative premise required at the start (e.g., "Death is bad," "Liberty is good"). In math, the premises are tautologies. In ethics, the premises are values. Values aren't true or false in the geometric sense; they are chosen.

  **C. Closed vs. Open Systems**
  Math is a closed system. All the variables are known because we invented them.
  Politics is an open, complex adaptive system. Humans have agency, they change their minds, and they react to the theory itself (reflexivity). If you publish a "geometric proof" of how the economy works, traders will change their behavior based on your proof, invalidating the axioms. You can't square the circle, but you can definitely break a political model by reading it.

  ### 4. The Modern Heirs (LessWrong & EA)
  You mentioned LessWrong, and you're right to see the lineage. The modern movement that comes closest to reviving the Hobbesian/Spinozist dream is **Effective Altruism (EA)** and the rationalist community.
  *   They attempt to quantify ethics (QALYs, utilitarian calculus).
  *   They try to derive moral obligations from logical consistency (e.g., arguments about AI alignment or existential risk).
  *   They share the belief that "fuzziness" is a failure of rigor.

  But even they run into the same wall Hobbes did: You can be perfectly rigorous in your deduction, but if your initial utility function is arbitrary, your conclusion is just a precise expression of a preference, not a geometric truth.

  ### Summary
  It's not that people lost their nerve; it's that **ontology fought back.**
  Hobbes thought political philosophy was like engineering: find the laws of motion, build the machine.
  But political philosophy is more like ecology: the parts have their own internal goals, they evolve, and they don't care about your axioms.

  Hobbes's failure to square the circle is the perfect metaphor for his political project. He was brilliant, rigorous, and utterly convinced that reality *must* conform to his logic. But reality doesn't care about your proofs. That said, the *attempt* is what makes *Leviathan* a thriller. Watching a guy try to force the chaos of human nature into a geometric proof is one of the most audacious moves in intellectual history.
