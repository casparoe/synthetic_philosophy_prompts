answer: |-
  This is a fantastic puzzle, and you have clearly done your homework. You have identified the precise fault line in the literature: is the Knobe effect a quirk of *moral psychology* bleeding into folk psychology, or is it a general feature of how we process *normative deviations*?

  You asked me to take a stand. I will argue that while the "normative" account (championed by Uttich, Lombrozo, and others) captures the *trigger* of the effect, it fails to explain its *structure* and *magnitude*. The evidence suggests that distinctively evaluative (moral) considerations are not merely a subset of norm violations that happen to work better; they are the constitutive engine of the effect. The normative account is descriptively accurate but explanatorily shallow. It tells us *when* we attribute intentionality, but it cannot tell us *why* the attribution sticks in the harm case and slides off in the help case without smuggling in moral evaluation.

  Here is the case for the Evaluative View.

  ### 1. The Asymmetry of the Help Case
  The strongest argument against the pure norm-violation view lies in the "Help" vignette itself. In the standard Help case, the Chairman approves a policy that increases profits and helps the environment. He expresses indifference.

  For the normative account to work, there must be a norm violation in the Help case comparable to the Harm case. In the Harm case, the norm violated is "Do not harm the environment." In the Help case, what norm is violated? Proponents of the normative view often suggest a norm of "status quo maintenance" or "profit maximization without distraction." But this is strained.

  Even if we grant that implementing *any* new policy violates a statistical or conventional norm of "doing what is usually done," the judgment remains: we say he did *not* help intentionally. If the mechanism were simply "Norm Violation → Inference of Mental State → Intentionality," then violating a norm to produce a good outcome should yield high intentionality ratings. It does not.

  The normative theorist might reply: "In the Help case, the agent is conforming to the *moral* norm, which outweighs the conventional norm." But this admission surrenders the game. It acknowledges that norms are weighted hierarchically, and the weight is determined by their *moral value*. If the hierarchy is determined by moral evaluation, then moral evaluation is doing the essential work, not the bare fact of norm violation. The normative account cannot explain why a moral norm trumps a conventional one in the calculation of intentionality without invoking the very evaluative properties it claims are unnecessary.

  ### 2. The Moral/Conventional Distinction and Authority Independence
  You mentioned the Uttich and Lombrozo paper regarding arbitrary company conventions. This is the strongest evidence for their side, but it crumbles under a specific distinction from developmental psychology: the difference between *moral* and *conventional* norms (associated with the work of Elliot Turiel).

  Moral norms are generally understood as **authority-independent** and **general in scope**. Conventional norms are **authority-dependent** and **local**.
  *   If the CEO says, "It's okay to hit your sister," the child knows it is still wrong (Moral).
  *   If the CEO says, "It's okay to wear pajamas to the meeting," the child knows it is now permissible (Conventional).

  In the Knobe effect, the asymmetry persists even when the authority figure (the Board, the CEO) explicitly permits the action. In the Harm case, even if the Board says, "We don't care about the environment, just make money," people still say the harm was intentional. They are tracking a norm that the Board *cannot* waive.

  In the arbitrary rule cases (like the product color), if the CEO says, "Ignore the color rule," the intentionality attribution drops significantly. The "norm violation" effect for conventional rules is fragile and dependent on authority. The effect for moral rules is robust. This suggests two different cognitive mechanisms are at play. The "norm" account lumps them together, but the data shows they behave differently. The robustness of the moral case suggests it is tapping into a deeper, evaluative competence regarding responsibility, whereas the conventional case is a superficial mimicry driven by confusion or the moralization of rule-following (i.e., "breaking a rule is disrespectful," which is itself a moral judgment).

  ### 3. Conceptual Contagion: It's Not Just "Intentional"
  If the Knobe effect were merely about inferring mental states from norm violations, it should be limited to concepts closely tied to planning and awareness. However, the effect bleeds into concepts that are seemingly metaphysical or epistemic.

  Studies show the effect extends to:
  *   **Knowing:** People are more likely to say the Chairman *knew* he would harm the environment than that he *knew* he would help it.
  *   **Deciding:** People say he *decided* to harm, but didn't *decide* to help.
  *   **Causation:** People are more likely to say he *caused* the harm than the help.
  *   **Freedom:** Some studies suggest people view the agent as acting more *freely* when doing bad things.

  The normative account struggles mightily here. Why would violating a color convention change whether an agent *knows* a side effect will occur? Knowledge is a relation between a mind and a fact. Whether that fact is "bad" shouldn't change the epistemic relation.

  The Evaluative account explains this easily: We are not analyzing the concepts in isolation. We are engaged in a holistic practice of **holding responsible**. When we blame someone, we need a "hook" to hang the blame on. We need them to have *known*, *decided*, *caused*, and *intended*. When we praise someone (or when the outcome is neutral), we are less motivated to construct this robust chain of agency. The moral evaluation drives the adjustment of all these other concepts to satisfy the demands of blame. A purely normative account cannot explain why breaking a rule changes the epistemic status of "knowing."

  ### 4. The "Deep Self" and the Nature of the Agent
  This brings us to Chandra Sripada's "Deep Self" model, which strengthens the Evaluative view. The core intuition is that we attribute intentionality when an outcome aligns with the agent's true values (their Deep Self).

  In the Harm case, the Chairman's indifference to environmental damage reveals a Deep Self that is greedy or callous. The harm *expresses* who he is.
  In the Help case, the help is incidental to his Deep Self (which is focused on profit). He would have done it even if it didn't help.

  The normative account treats the agent as a black box that processes rules. The Evaluative account treats the agent as a *person* with a character. When Uttich and Lombrozo use arbitrary rules (like the color of a product), they are arguably triggering a mini-evaluation of the agent's character: "This person is a rule-breaker" or "This person is non-compliant."

  However, the *strength* of the intentionality attribution correlates with the *moral significance* of the value revealed. Harming the environment reveals a morally bad character. Breaking a color rule reveals a merely quirky or insubordinate character. The fact that the intentionality judgment scales with the moral gravity of the character flaw suggests that moral evaluation is the metric being used. If it were just "norm violation," the severity of the norm shouldn't matter as much as the clarity of the violation. But it does matter. We are much less confident that the Chairman "intentionally" broke the color rule than that he "intentionally" harmed the environment.

  ### 5. The Parasitic Nature of Non-Moral Norms
  Finally, consider the strongest version of the opposing view: that *any* norm violation works. I argue that non-moral norm violations only produce the Knobe effect because they are **parasitic on moral norms**.

  Why do we care if the Chairman violates a company convention about product color? If the company is a lone island with no customers, no stakeholders, and no social contract, breaking the color rule likely produces *no* Knobe effect. We only care about the rule violation because we assume rules exist for a reason (efficiency, coordination, respect for authority). Violating them implies a disregard for the social fabric.

  That disregard is a moral failing (disrespect, unreliability). When you strip away the moral implications of the norm violation—when you make it truly morally neutral—the effect diminishes. There have been replications where "statistical norms" (e.g., "most people drink coffee") are used. If an agent does something statistically rare but morally neutral, the intentionality attribution is weak compared to the moral harm case.

  The normative view claims morality is just one type of norm. I claim that in the context of agency and responsibility, "norm" is a placeholder for "moral expectation." When we find a non-moral norm that triggers the effect, it is because we have implicitly moralized it.

  ### Conclusion
  The Uttich and Lombrozo account is elegant because it promises a unified theory of mindreading: we are all just looking for explanations of deviations. But it is too unified. It flattens the landscape of human judgment.

  The evidence suggests that our concept of intentional action is not a neutral tool we use to map behavior, which we *then* evaluate morally. Rather, the concept of intentional action is *built* out of our practices of praise and blame. We do not first determine if an act was intentional and then decide if the agent is blameworthy. We perceive the blameworthiness, and that perception structures our understanding of the intentionality.

  The fact that arbitrary norms can sometimes trigger the effect does not prove morality is irrelevant; it proves that our sensitivity to moral responsibility is so acute that it can be piggybacked onto conventional structures. But the engine driving the asymmetry—the reason we say "intentional" for harm and "unintentional" for help—is distinctively evaluative. Without the moral valence, the asymmetry collapses. Therefore, the Evaluative View is not just one option among many; it is the only one that accounts for the direction, magnitude, and conceptual spread of the phenomenon.
