answer: |-
  Your sister is absolutely onto something real. This is not just squeamishness; it is one of the central debates in modern bioethics. While the *mechanism* (selecting from existing embryos) is identical, the *moral logic* shifts significantly when you move from disease prevention to trait enhancement.

  For your novel, this tension is gold. It provides internal conflict for the characters and external conflict with society. Here is a breakdown of why her intuition is philosophically defensible, the specific arguments she is stumbling toward, and the scientific reality check that could add plot tension.

  ### 1. Therapy vs. Enhancement
  The most common ethical distinction is between **healing** and **improving**.
  *   **Disease Screening (Therapy):** The goal is to bring a child up to a "normal" baseline of functioning. You are preventing suffering. Most ethical frameworks agree that parents have a duty to prevent harm to their future children.
  *   **Cognitive Screening (Enhancement):** The goal is to push the child *above* the baseline. You are seeking advantage. This moves from a duty of care to a desire for optimization.

  **The Philosophical Hook:** If you select against Tay-Sachs disease, you are acting out of compassion. If you select for the 90th percentile of working memory, are you acting out of love, or are you acting out of ambition? The philosopher **Michael Sandel** argues that this shifts the parent-child relationship from one of "openness to the unbidden" (accepting the child as a gift) to one of "mastery and design" (treating the child as a product).

  ### 2. The "Right to an Open Future"
  This is a concept coined by philosopher Joel Feinberg. Children have a right to have their future options kept open until they are old enough to choose for themselves.
  *   **Disease:** Preventing a debilitating disease *expands* a child's future options (they can walk, think, live without pain).
  *   **Enhancement:** Selecting for a specific trait might subtly *close* options. If you select an embryo specifically for high cognitive potential, do you implicitly place an expectation on that child to be academic? Does it make it harder for them to be an artist, or to struggle, or to be average?

  **For the Novel:** Your sister might worry that by picking the "smart" embryo, she isn't just helping the child; she is writing a script for them that they didn't agree to.

  ### 3. The Expressivist Objection
  This argument suggests that the *act* of selection sends a message about the value of human life.
  *   **Disease:** Selecting against a lethal condition says, "We want to avoid suffering."
  *   **Traits:** Selecting for higher IQ says, "Some kinds of minds are more valuable than others."

  If this technology becomes normalized, what does it say about the value of people currently living with average or below-average cognitive scores? It risks turning human variation into a hierarchy of quality. Your sister might feel that by participating, she is validating a eugenic logic, even if her individual choice is harmless.

  ### 4. The Scientific Reality (Crucial for Plot Tension)
  For your story to feel grounded, you need to know the current scientific limitations.
  *   **Polygenic Risk Scores (PRS) are probabilistic, not deterministic.** Unlike single-gene disorders (like Cystic Fibrosis), traits like height and IQ are influenced by thousands of variants *plus* environment, nutrition, and luck.
  *   **The "Signal" is weak.** Currently, the predictive power of PRS for cognitive traits is low. An embryo in the 90th percentile might end up average; one in the 50th might be a genius.
  *   **Pleiotropy:** Genes often do multiple things. A genetic variant correlated with higher cognitive performance might also be correlated with higher anxiety, autism spectrum traits, or lower immune resilience.

  **Plot Point:** The clinic might be selling certainty where there is only probability. Your sister's nagging feeling could be validated if the "lower score" embryo turns out to be the healthier, happier child, or if the "higher score" comes with a hidden trade-off the algorithm didn't flag (e.g., mental health risks).

  ### 5. The Non-Identity Problem
  This is the counter-argument your husband character might use. Philosopher Derek Parfit argued that if you choose Embryo A over Embryo B, you haven't harmed Embryo B, because Embryo B never gets to exist. Therefore, as long as Embryo A has a life worth living, you've done nothing wrong.
  *   **The Husband's View:** "We aren't hurting anyone. We are just giving our child the best start possible. Why wouldn't we?"
  *   **The Sister's Counter:** "We aren't just choosing a child; we are choosing what *kind* of parents we are. Are we guardians or architects?"

  ### Summary for Your Plot
  Your sister is not being squeamish; she is identifying a shift from **negative eugenics** (removing suffering) to **positive eugenics** (engineering advantage).

  **Why this makes great fiction:**
  1.  **The Uncertainty:** The scores are just numbers. They are gambling with a human life based on a algorithm's guess.
  2.  **The Relationship:** If they pick the "smart" one, will they love the child less if they struggle in school? Will they love the "discarded" embryos less?
  3.  **The Societal Pressure:** If all their friends are doing this, does opting out feel like neglect?

  **Verdict:** Her intuition is philosophically robust. It touches on the commodification of human life, the limits of parental authority, and the definition of health. It is a defensible, serious ethical stance, not just a gut feeling.
