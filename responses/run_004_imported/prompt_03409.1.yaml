      *   *Refinement:* Make sure to mention that Lewis *does* care about how conventions start (precedent), so he's not *purely* static.

  7.  **Final Polish:** Ensure the distinction between "Convention as Pattern" vs. "Convention as Agreement" is clear. (Hume says it *is* a convention even if not an agreement in the promise sense).

