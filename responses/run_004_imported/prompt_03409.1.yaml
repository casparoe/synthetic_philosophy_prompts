      *   **Goal:** A detailed, philosophically rigorous answer that helps the user form a view for Thursday. Needs to bridge Hume, Lewis, and the evolutionary turn (Skyrms).

  2.  **Deconstruct Question 1: Normativity & The Label "Convention"**
      *   *Hume's Move:* Hume is fighting against Social Contract Theory (Hobbes, Locke). They say political obligation comes from *promises* (explicit consent). Hume says: No, promises themselves need a prior convention to be binding. So the foundation must be pre-promise.
      *   *The "Agreement" without Promise:* Hume uses "convention" (*conventio*) not in the legal/contractual sense, but in the sense of "coming together" or "convergence."
      *   *Normativity Source:* It's not moral normativity initially; it's *prudential* normativity grounded in interest. "I ought to row in time" means "If I don't, we crash/lose efficiency, and I suffer." The "ought" is hypothetical imperative territory.
      *   *The "Smuggling" Charge:* Is it smuggling? Maybe. But Hume's point is that the *moral* sentiment (justice) arises *from* the utility of the convention. The convention itself is sustained by interest. The normativity of *justice* is built on the stability of the convention.
      *   *Key Distinction:* Hume distinguishes between the *origin* (interest/convergence) and the *moralization* (sympathy/approval of what is useful). The passage cited is about the origin.
      *   *Connection to Lewis:* Lewis agrees. Conventions are solutions to coordination problems. The normativity is "rational obligation" (given you want to coordinate), not necessarily moral obligation (though it can become so).

  3.  **Deconstruct Question 2: Gradual/Evolutionary vs. Static/Rationalist**
      *   *Hume's Process:* "Gradually," "slow progression," "repeated experience." This is clearly proto-evolutionary. It's about learning, habit, and expectation formation over time.
      *   *Lewis's Apparatus:* Common Knowledge (CK) of preferences, rationality, and conformity. This looks like a snapshot of a fully rational agent's mind *at the time of action*.
      *   *The Tension:* How do you get CK gradually? CK is often modeled as an infinite hierarchy of beliefs. Hume's agents aren't calculating infinite hierarchies; they're learning from experience.
      *   *Resolution 1 (The "Endpoint" View):* Lewis is analyzing the *structure* of the equilibrium once established. Hume is explaining the *genesis*. Lewis admits conventions are learned (Chapter 2 of *Convention* discusses salience and precedent), but his *definition* is structural.
