      *   *Did Lewis Swap?* Lewis acknowledges the tension. He uses the rowing example to motivate the *logic* of coordination, not necessarily the *temporal history*. He wants to show that *if* people are rational and know each other to be so, they can sustain the convention. Hume wants to show *how* we get there without rational calculation.
      *   *Nuance:* Lewis actually relies heavily on *precedent* and *salience* (Schelling) to solve the "which equilibrium?" problem. This is where the "gradual" history comes back in. Past success makes an equilibrium salient. So Lewis isn't purely static; he needs history to select the equilibrium.

