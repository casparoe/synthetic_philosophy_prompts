answer: |-
  This is a fantastic crux to hit on. You've identified the exact friction point where 18th-century proto-game theory meets 20th-century analytic formalization, and where the evolutionary turn (Skyrms et al.) tries to weld them back together. Since you're presenting Thursday, I'll give you a structured way to parse this that should hold up under scrutiny from both the Humeans and the Lewisians in your group.

  Here is a breakdown of the two problems you raised, followed by a synthesis you can use for your presentation.

  ---

  ### 1. The Normativity Charge: Is Hume Smuggling?

  You ask: *Has Hume earned the normatively loaded bit ("convention," "agreement") or is he just describing a self-interested equilibrium?*

  **The Context is Anti-Contractarianism**
  To understand why Hume isn't just being sloppy with the word "convention," you have to remember who he is fighting. He is arguing against the Social Contract theorists (Hobbes, Locke, Pufendorf). They argue that political obligation and property rights rest on **promises** (explicit consent).
  Hume's devastating counter-move in this passage is: *Promises themselves presuppose conventions.* You can't have a binding promise unless there is already a social practice that gives uttering certain words normative force. Therefore, the foundation of society cannot be promises. It must be something pre-linguistic and pre-promissory.

  **"Convention" as Convergence, not Contract**
  When Hume says, "This may properly enough be call'd a convention... tho' without the interposition of a promise," he is stretching the semantic field of *conventio* (coming together). He is distinguishing between:
  1.  **Explicit Agreement:** "I promise to do X if you do Y." (Contractual)
  2.  **Tacit Convergence:** "I see you doing X, I do X, we both benefit." (Coordination)

  **The Source of the "Ought"**
  Is the normativity smuggled? No, but it is **layered**.
  *   **Layer 1 (Prudential):** The initial "ought" is purely hypothetical. *If* I want to cross the river efficiently, *I ought* to match your stroke. This is game-theoretic rationality. There is no moral obligation here yet, only instrumental rationality.
  *   **Layer 2 (Stability):** As Hume says, "repeated experience of the inconveniences of transgressing it" creates an expectation. The normativity here is the stability of the equilibrium. Deviating is irrational because it leads to a worse payoff (crashing the boat).
  *   **Layer 3 (Moral):** Later in the *Treatise* (and in the *Enquiry*), Hume explains how we move from Layer 1 to Layer 3. Through **sympathy**, we feel pleasure in what is useful to society. We begin to *approve* of those who follow the convention and *disapprove* of those who break it.

  **Verdict for your presentation:** Hume isn't smuggling moral normativity into a description of equilibrium. He is arguing that moral normativity (justice) **emerges from** the stability of prudential equilibria. The word "convention" is justified because there is a mutual adjustment of behavior based on mutual expectation, even without speech acts. It is an "agreement of actions," not an "agreement of words."

  ---

  ### 2. The Time Problem: Hume's Gradualism vs. Lewis's Static CK

  You ask: *Hume describes a gradual evolutionary process; Lewis describes a static Common Knowledge (CK) state. Did Lewis swap the phenomenon?*

  This is the sharper philosophical tension. Lewis's definition of convention (in the 1969 book) is notoriously demanding: it requires a hierarchy of reasons to believe that everyone conforms, expects everyone to conform, etc. (Common Knowledge). Hume's rowers don't calculate infinite hierarchies; they just get tired of crashing and fall into a rhythm.

  **Reading 1: Lewis as Structural Analysis (The "Endpoint" View)**
  The most charitable reading is that Lewis and Hume are describing different **temporal slices** of the same phenomenon.
  *   **Hume** is giving an *etiology*: How does a convention originate? (Gradual learning, trial and error, habit).
  *   **Lewis** is giving a *structural analysis*: What is the logical state of affairs *once the convention is established*?
  *   On this reading, Lewis's "Common Knowledge" is an idealization of Hume's "repeated experience." When Hume says experience "assures us still more, that the sense of interest has become common," he is describing the *acquisition* of the epistemic state that Lewis formalizes as CK. Lewis isn't denying the history; he is abstracting away from it to define the equilibrium conditions that make the convention stable.

  **Reading 2: The Salience Bridge (Where Lewis needs Hume)**
  However, Lewis isn't *purely* static. In Chapter 3 of *Convention*, Lewis leans heavily on Schelling's concept of **Salience** to solve the coordination problem (which equilibrium do we pick?).
  *   How does an equilibrium become salient? Usually through **precedent**.
  *   Where does precedent come from? **Past interactions.**
  *   So, Lewis actually *needs* a Humean history to explain why *this* specific equilibrium (rowing stroke A) is selected over *that* one (rowing stroke B).
  *   Lewis's CK condition explains why we *stay* in the equilibrium (it is self-enforcing given our beliefs). Hume's gradualism explains how we *got* the beliefs that make the equilibrium salient in the first place.

  **Verdict for your presentation:** Lewis didn't swap the phenomenon; he formalized the **attractor state** that Hume's evolutionary process converges upon. However, Lewis's reliance on "precedent" for salience admits that the CK state is historically dependent. You can argue that Lewis provides the *synchronic* logic of the convention, while Hume (and Skyrms later) provides the *diachronic* dynamics.

  ---

  ### 3. Bringing in Skyrms (The Evolutionary Bridge)

  Since your group is reading Skyrms, this is where you tie the knot. Skyrms (*The Evolution of the Social Contract*) explicitly addresses this Hume/Lewis tension.

  *   **Against Rationalism:** Skyrms agrees with Hume that we don't need hyper-rational agents calculating Common Knowledge. We need agents with simple learning rules (e.g., reinforcement learning, replicator dynamics).
  *   **The Convergence:** Skyrms shows mathematically that populations of simple learners **converge** on Lewisian coordination equilibria.
  *   **The Synthesis:** Hume was right about the *process* (gradual, evolutionary, no promise needed). Lewis was right about the *structure* (the end state is a coordination equilibrium sustained by mutual expectation).
  *   **Normativity:** Skyrms also helps with your first question. The "normativity" is the stability of the basin of attraction. To deviate is to be selected against (or in the rowing case, to lose utility).

  ---

  ### Suggested Thesis for Thursday

  If I were presenting this, I would frame the tension not as a contradiction but as a division of labor. Here is a draft thesis you can adapt:

  > "Hume and Lewis are not offering competing definitions of convention, but rather complementary accounts of its **dynamics** versus its **logic**.
  >
  > 1.  **On Normativity:** Hume is not smuggling moral obligation into a description of equilibrium. He is tracing the genealogy of obligation: Prudential interest creates the equilibrium; stability creates expectation; sympathy transforms that stability into moral sentiment. Lewis preserves this by grounding convention in *rational* obligation (preference satisfaction) rather than moral obligation.
  > 2.  **On Time:** Hume describes the *learning process* (diachronic); Lewis describes the *equilibrium conditions* (synchronic). Lewis's 'Common Knowledge' is the idealized epistemic state that results from Hume's 'repeated experience.'
  > 3.  **The Evolutionary Synthesis:** Modern evolutionary game theory (Skyrms) validates Hume's gradualism while confirming Lewis's structural analysis. We don't need rationalists calculating CK to get Lewisian conventions; we need Humean learners repeating interactions until they lock into a Lewisian equilibrium."

  ### One Potential Objection to Prepare For
  A sharp Lewisian might push back: *"Lewis requires Common Knowledge. Hume's agents only have 'confidence' based on habit. Habit isn't Knowledge. So Lewis's definition excludes Hume's rowers."*

  **Your Counter:** Lewis distinguishes between the *ideal definition* and the *application*. In *Convention*, Lewis acknowledges that "reason to believe" can substitute for strict knowledge, and that precedent (history) generates that reason. If Hume's rowers have "repeated experience," they have inductive reason to believe the other will continue. That satisfies the Lewisian condition for practical purposes, even if it lacks Cartesian certainty. Lewis is modeling the *rational reconstruction* of the rower's state, not necessarily their conscious phenomenology.

  ### Summary for your Notes
  *   **Hume's "Convention":** Tacit convergence of interest, distinct from promise/contract.
  *   **Normativity:** Starts prudential (interest), becomes moral (sympathy/approval). Not smuggling, but layering.
  *   **Time:** Hume = Genesis (Evolutionary); Lewis = Structure (Equilibrium).
  *   **CK vs. Habit:** CK is the idealized formalization of stable mutual expectation formed by habit.
  *   **Skyrms:** Proves Hume's process leads to Lewis's state.

  This should give you enough meat to lead the discussion without waving your hands. Good luck on Thursday!
