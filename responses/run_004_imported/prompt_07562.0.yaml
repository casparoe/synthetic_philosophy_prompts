      *   **Core Thesis to Defend:** Markovits's CRT fails to grant Huck full moral worth.
      *   **Reasoning:** Huck's motivating reason (friendship/attachment) does not *coincide in content* with the normative reason (Jim's humanity/rights).
      *   **The Dilemma:** Either loosen "content coincidence" until it collapses into Nomy Arpaly's responsiveness account, or admit Huck fails on Markovits's view.
      *   **Specific Objection to Address:** The "counterfactual robustness" reply (i.e., it's not about exact concepts, but about tracking the reason across scenarios).
      *   **Tone:** Academic, rigorous, argumentative, suitable for a high-level philosophy problem set or seminar prompt.

  2.  **Deconstruct Markovits's Position (Moral Worth):**
      *   *The Coincident Reasons Thesis:* An action has moral worth iff the agent's motivating reasons coincide with the normative reasons that justify the action.
      *   *The Motivation:* Save Kantian moral worth from the "abhorrent thought" (that helping only because you want to lacks worth) without falling into the "overdemandingness" of strict duty-motivation. It allows non-moral motives (like love) to have moral worth *if* they align with the right reasons.
      *   *The Huck Case:* Huck helps Jim. Normative reason: Jim is a person/Human Rights. Motivating reason: Jim is my friend/I care about him.
      *   *Markovits's Move:* She wants to say Huck *does* have moral worth. She argues that the reasons *do* coincide because the friendship is grounded in Jim's humanity, or that the content is sufficiently overlapping.

  3.  **Develop the Counter-Argument (The "Content Gap" Critique):**
      *   *Premise 1:* Normative Reason (NR) = Jim's status as a person/rights-bearer (universal, deontic).
      *   *Premise 2:* Huck's Motivating Reason (MR) = Jim's particular identity as my friend/my emotional attachment (particular, affective).
      *   *Claim:* These do not coincide in *content*. "You are my friend" $\neq$ "You are a person."
      *   *Implication:* If CRT requires content coincidence, Huck fails.

  4.  **Construct the Dilemma:**
      *   *Horn 1 (Strict Content):* If Markovits insists on conceptual/content overlap, Huck fails. His thought process never invokes personhood. He explicitly rejects the idea that helping slaves is "right" (conscience vs. heart).
      *   *Horn 2 (Loose Content):* If Markovits says "friendship implies personhood, so it counts," she dilutes "coincidence." If *any* reason that tracks the right outcome counts, she's just saying "responsiveness to reasons matters," which is Arpaly's view (Unprincipled Virtue).
      *   *Collapse:* If it collapses into Arpaly, CRT loses its distinctiveness (the "coincidence" constraint becomes vacuous).

  5.  **Address the "Counterfactual Robustness" Reply:**
      *   *The Reply:* Markovits might say: "It's not that Huck thinks 'personhood' right now. It's that *if* Jim weren't a person, Huck wouldn't help. Or *if* Jim's rights were violated differently, Huck would still help. The motivation is robustly connected to the normative ground."
      *   *The Counter-Counter:* Huck is explicitly *unrobust* regarding the moral principle. He thinks he's doing wrong. If his "conscience" (societal morality) got louder, he might fold. More importantly, his motivation is *particularist*. If it were a different slave Huck didn't know, he wouldn't help. The normative reason (slavery is wrong) applies to *all* slaves. Huck's reason applies only to *Jim*. Therefore, the tracking is not robust enough to bridge the content gap. The scope of the motives differs.

  6.  **Drafting the Argument (Iterative refinement):**
      *   *Introduction:* Set up Markovits's ambition (saving non-duty motives).
      *   *The Core Tension:* Distinguish between *extensional* alignment (doing the right thing) and *intensional* alignment (content of reasons).
      *   *The Huck Specifics:* Huck's internal monologue is key. He believes helping is wicked. This severs the link to the normative reason (justice).
      *   *The Dilemma:* Formalize the Arpaly collapse vs. Huck exclusion.
      *   *The Robustness Objection:* Tackle the "tracking" defense. Focus on the *scope* mismatch (particular vs. universal).
      *   *Conclusion:* Markovits cannot have her cake (distinctive CRT) and eat it too (granting Huck worth).

  7.  **Refining the Tone:**
      *   Needs to sound like a prompt or a model answer for advanced undergrads/grads.
