      *   **The "Deducting" Mechanics:** It's not $100 - 1$. It's about which "proof" is stronger.
      *   **The "Soft Spot" Admission:** Be honest. Many philosophers think this *is* a weakness. It conflates the *probability of the event* with the *probability of the report*.
