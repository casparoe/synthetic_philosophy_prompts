      *   **Goal:** Explain how the "deducting" mechanic works consistent with Hume's definitions, or acknowledge if it's a known weakness (soft spot). The user wants to understand the *mechanics*, not just the slogan.

  2.  **Deconstruct Hume's Argument (Section X, Part I):**
      *   *Premise 1:* Belief should be proportioned to evidence.
      *   *Premise 2:* Evidence comes from experience (constant conjunction).
      *   *Definition:* "Proof" = Uniform experience (no counter-examples). "Probability" = Mixed experience.
