prompt: |-
  I'm taking a philosophy of math class this semester, and a friend and I also run a tiny philosophy podcast on the side. For the next episode we're interviewing the TA for our class, who's finishing up a dissertation on the philosophical status of the axiom of choice. She's basically a diehard defender of classical, choice-accepting math, thinks constructivist squeamishness about non-constructive existence proofs is kind of precious, and whenever someone pushes her on a weird consequence she just says something like "existence doesn't owe you a picture" and moves on. We covered Zorn's lemma in lecture a couple weeks ago (chains, upper bounds, maximal elements, all that), and even though I followed the proof fine, something about it still bugs me: it feels like it lets people smuggle in all the weirdness of the axiom of choice while seeming way more "structural" and innocent than choice itself, even though the two are provably equivalent.

  Could you draft me like 8-10 real interview questions for her? I definately don't want it to just be her restating the standard textbook line -- I want at least one question each on why Zorn's lemma feels so much safer to working mathematicians than invoking choice directly despite that equivalence, on whether Banach-Tarski-style paradoxes are genuine evidence against choice or just a question-begging intuition pump, and on the constructivist complaint that a proof with no witness hasn't actually shown you that the thing exists -- and for each, a follow-up that calls out the "existence doesn't owe you a picture" dodge (or whatever other slippery move she reaches for), so she can't just wave it away twice in a row. Maybe end with one question about what kind of result would actually make her doubt choice.
