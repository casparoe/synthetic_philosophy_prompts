answer: |-
  Here are 9 interview questions drafted for your podcast. They are designed to be probing and specific, avoiding standard textbook setups.

  I have structured the three main topics (Zorn's Lemma, Banach-Tarski, Constructivism) as **Question + Follow-up pairs**. The follow-ups are written to be deployed *if* she attempts to dismiss the concern using her standard "existence doesn't owe you a picture" line of reasoning. This gives you a tactical way to press her without being rude.

  ### Part 1: The "Structural Innocence" of Zorn's Lemma

  **1.** We covered Zorn's Lemma in class recently—chains, upper bounds, maximal elements. It feels structurally rich in a way the raw Axiom of Choice doesn't. My suspicion is that working mathematicians prefer Zorn's Lemma because it feels like a theorem about order structures rather than a "magic wand" for picking elements. Do you think Zorn's Lemma provides a kind of psychological camouflage that makes the non-constructive commitment of Choice feel more palatable?

  **2. (Follow-up if she says ZL is just a "better tool" or "more structural"):**
  But since Zorn's Lemma and the Axiom of Choice are provably equivalent, accepting one *is* accepting the other. If the preference for Zorn's Lemma is just about comfort, aren't we essentially admitting that the "structural" language is a placebo? If the magic is the same, does hiding it inside a chain condition actually justify the ontology, or does it just help us stop worrying about the fact that we're smuggling in the same weirdness?

  ### Part 2: Banach-Tarski and Physical Intuition

  **3.** A classic pushback against Choice is the Banach-Tarski paradox—doubling a sphere by rearranging pieces. You've argued before that this is just a counter-intuitive theorem, not a *reductio ad absurdum*. But volume is one of our most basic geometric intuitions. At what point does violating intuition stop being a "quirk" of infinite set theory and start looking like evidence that the axiom is describing a formal game rather than mathematical reality?

  **4. (Follow-up if she says "Math isn't physics" or "Intuition is unreliable"):**
  I want to press on that distinction. If the Axiom of Choice forces us to accept that "volume" behaves in a way that is physically impossible and conceptually incoherent, why is the axiom preserved and the intuition discarded? If "existence doesn't owe you a picture," does that mean we should also ignore it when the picture shows a sphere becoming two spheres? Or is there a line where the consequence is too high a price for the convenience of the axiom?

  ### Part 3: The Constructivist Complaint

  **5.** Constructivists argue that proving something exists without providing a method to find it is an empty claim—like saying "there is a key in this house" without telling me which room. You've described this worry as "precious." But if a proof guarantees an object is *there* but simultaneously guarantees we can *never identify it*, what work is the word "exists" actually doing? Is it just a synonym for "consistent"?

  **6. (Follow-up if she uses the "existence doesn't owe you a picture" line):**
  That's the line I wanted to pin down. If existence is completely decoupled from identifiability, doesn't that drain the concept of "existence" of its content? If I can prove an object exists but also prove that no witness can ever be constructed, haven't I essentially defined "existence" in a way that makes it impossible to verify or falsify? Isn't that less like math and more like theology?

  ### Part 4: Utility, Cost, and Doubt

  **7.** Let's talk about the cost of doing business. We know that *rejecting* the Axiom of Choice breaks a lot of standard analysis—Tychonoff's theorem, the Hahn-Banach theorem, etc. But is the argument for Choice purely pragmatic? If the only reason to keep it is that it makes the math easier for working analysts, does that reduce the axiom to a convenient fiction rather than a truth about sets?

  **8.** In your dissertation, you defend the classical view. But surely there's a difference between "Choice is useful" and "Choice is true." Do you view the Axiom of Choice as a discovery about the platonic universe of sets, or is it more of a legislative decision we make to keep the machinery of modern mathematics running smoothly?

  **9.** To close: I want to ask a falsification question. We usually think of axioms as starting points, but they aren't immune to revision (like how Naive Comprehension was revised after Russell's Paradox). What kind of result, consequence, or contradiction would actually make *you* doubt the Axiom of Choice? Is there any scenario where you would say, "Okay, this consequence is too weird; the axiom has to go"?
