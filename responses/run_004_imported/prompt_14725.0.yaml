answer: |-
  Here are ten interview questions designed for a graduate-level audience, structured to move from technical logical problems to broader metaethical implications.

  1.  **The Geach Embedding Problem**
      Let's begin with the classic Frege-Geach challenge, specifically as Geach posed it against ascriptivism. Consider the conditional: "If lying is wrong, then getting your little brother to lie is wrong." In a standalone assertion like "Lying is wrong," you argue the speaker expresses a con-attitude toward lying. But in the antecedent of this conditional, the speaker is plainly not performing an act of disapproving of lying. So, on your view, what exactly is expressed by the antecedent clause in isolation?

  2.  **Follow-up: The Structure of the Complex Attitude**
      I anticipate you'll say that asserting the whole conditional expresses a higher-order attitude—perhaps a disapproval of combining the attitude toward lying with the absence of an attitude toward getting one's brother to lie. But if the logical validity of *modus ponens* relies on the antecedent having the same content in both the conditional premise and the standalone premise, doesn't positing two different types of psychological states (a simple attitude vs. a complex commitment) fracture the explanation of validity? How do you bridge that gap without smuggling in propositional content?

  3.  **Unwin's Negation Problem**
      Moving from conditionals to negation: Mark Unwin argued that expressivism struggles to distinguish between negating a moral claim and merely failing to make it. If I say, "Lying is not wrong," I am contradicting the claim that lying is wrong. If I simply have no attitude toward lying, I am not contradicting anyone. How does your semantics distinguish the attitude expressed by "Lying is not wrong" from the mere absence of any attitude toward lying?

  4.  **Follow-up: Hyperplans and Truth-Conditional Disguise**
      You might reach for a Gibbard-style apparatus here, suggesting that "not wrong" corresponds to ruling out certain normative worlds or hyperplans. But if you define the content of moral judgments by their role in a system of consistency conditions across these "worlds," aren't you effectively reconstructing truth-conditional semantics in all but name? At what point does the "normative world" apparatus cease to be a model of planning and become a thinly veiled realist ontology?

  5.  **Generalization to Quantifiers and Disjunctions**
      Let's press on the generality of your solution. Even if you solve the problem for *modus ponens*, fixes tailored to conditionals don't obviously generalize to other logical operators. Consider a quantified claim like, "Everything the treasurer did was permissible." How does an expressivist analyze the logical form of this sentence? What attitude is being expressed toward an open sentence or a universal quantifier?

  6.  **Follow-up: Isomorphism with Propositional Logic**
      If your answer relies on mapping these moral sentences onto a logic of attitudes that is isomorphic to standard propositional logic, doesn't that raise a dilemma? Either the isomorphism is a brute coincidence, which is implausible, or there is a deeper structural reason why attitudes behave exactly like truth-apt propositions. If it's the latter, why shouldn't we just infer that the attitudes are tracking truth-apt properties after all?

  7.  **Moral Disagreement**
      Stepping back from formal logic to phenomenology: One motivation for realism is the intuitive force of moral disagreement. When I say "X is good" and you say "X is bad," it feels like we are contradicting each other, not just having clashing preferences. How does quasi-realism account for the *intuition* of contradiction without conceding that there is a single proposition that one of us is failing to believe?

  8.  **Follow-up: Consistency vs. Contradiction**
      If you argue that disagreement is merely a matter of inconsistent plans or attitudes rather than contradictory beliefs, does this reduce moral argument to a form of coercion or manipulation? If I can't show you that you are *mistaken* about a fact, but only that your plans are inconsistent with your other plans, have I preserved the normative force of moral reasoning, or have I reduced it to instrumental rationality?

  9.  **The Motivation for Quasi-Realism**
      Given the technical complexity required to answer the previous questions—reconstructing truth, logic, and facts within an expressivist framework—what is the remaining theoretical advantage? Why start with the premise that moral sentences express attitudes rather than describe facts, if you must spend the rest of your career earning back the right to talk as if they describe facts?

  10. **Creeping Minimalism**
      This leads to our final question about "creeping minimalism." You are willing to reclaim realist-sounding vocabulary: moral truths, moral knowledge, and even moral facts in a deflationary sense. If a realist accepts deflationary truth and you accept deflationary moral facts, state plainly: what would actually be lost—for you, or for the realist you oppose—if quasi-realism simply turned out to be realism wearing different clothes? Is there a substantive metaphysical difference left, or merely a difference in philosophical storytelling?
