prompt: |-
  I'm putting together a lecture for a seminar I'm co-teaching this term (something like "Mind, Machines, and the Limits of Proof," cross listed with Computer Science, which tells you how the enrollment negotiations went), and I want a sanity check before I say this in front of the CS students. I've been reading about the letter Godel sent von Neumann in 1956, where he raises the question of whether there could be a machine that decides, in a number of steps thats only linear or quadratic in the length of a formula, whether that formula has a proof of a given length. The way I've been framing it for my students is: Godel basically showed that if such a machine existed, mathematical genius would be over - a mathematician's insight would just reduce to a polynomial-time search that a computer could run equally well. And since nearly every complexity theorist alive today thinks P isn't equal to NP, don't we actually have pretty solid grounds - grounds Godel himself saw coming decades early - for saying mathematical creativity is provably safe from automation, full stop?

  A colleague from the CS side sat in on a practice run and told me afterward that I was "smuggling in three or four premises Godel never gave me," but had to run to a meeting before she could say which ones. I've turned it over for a couple of days now and I'm genuinely not seeing the gap myself - isn't "the creative part of math is exactly the part that can't be sped up from search-speed to verification-speed" basically just what P ≠ NP says? What do you think she's getting at?
