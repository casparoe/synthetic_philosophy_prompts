      *   **References:** Suggest key authors (Maudlin, Myrvold, Bell's "La Nouvelle Cuisine").

  7.  **Refine the Content (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say the user is *right* unequivocally. The philosophy of QM is contested. I must present the counter-arguments they will face.
