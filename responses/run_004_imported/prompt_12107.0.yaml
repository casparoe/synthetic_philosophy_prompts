prompt: |-
  Ok random request but it's for a novel I'm drafting -- one of my characters is a grad-student TA grading a stack of intro philosophy of religion papers on Hume, and I want the grading scene to feel true to life, not just "she frowned and wrote a B+ in red pen." So I need someone who actually knows this material to grade a sample answer properly, the way a genuinely careful (if slightly overworked) grader would.

  Here's the take-home question I wrote for her fictional class:

  "Explain Hume's argument for why testimony should almost never be sufficient to justify belief that a miracle occurred. Be sure to address both stages of the argument, and say explicitly whether Hume thinks it's ever possible in principle for testimony to establish a miracle, or whether his argument rules this out entirely."

  And here's the answer one of her students (lets say her name's Mara, for the book) turned in:

  "Hume's essay 'Of Miracles' argues that a rational person should almost never believe a miracle happened just because someone testified to it. The argument has two stages.

  In the first stage, Hume notes that our belief in a law of nature -- like water needing cold to freeze -- rests on completely uniform past experience, without a single exception. That gives it the highest degree of evidential support experience can provide, what he calls a 'proof.' A miracle is by definition a violation of such a law. So whenever someone reports a miracle, we're weighing the proof from all of uniform experience against the credibility of some testimony. Because a law of nature is defined by exceptionless experience, no testimony could ever, even in principle, be strong enough to tip the balance the other way -- the proof against the miracle is always stronger than any testimony for it, full stop. This is why Hume says a wise man proportions his belief to the evidence: the evidence is already maxed out against the miracle before any witness even opens their mouth.

  The second stage is more historical than logical. Hume argues that even setting the first argument aside, no testimony for a religious miracle has, as a matter of fact, ever come from witnesses reliable enough to trust. He gives a few reasons: there aren't enough witnesses of sufficient education and character to rule out either delusion or deceit; people have a natural passion for surprise and wonder that makes them sloppy about this particular kind of story; miracle reports mostly crop up among ignorant, barbarous peoples, or get inherited from them; and miracles from rival religions cancel each other out as evidence, since each is offered in support of a different, incompatible system.

  Hume also brings up an Indian prince who refuses to believe travellers' reports of ice, since nothing like that has ever happened in his own experience. Hume's point is that the prince isn't being unreasonable, just going on the best evidence available to him -- Hume actually grants a kind of principle of credulity here, where we default to trusting testimony unless we have some specific reason not to, and then argues that miracle-testimony always runs into one of those specific reasons. So even on that more generous standard, religious miracles still fail to clear the bar.

  Overall, Hume concludes that believing in a miracle on the basis of testimony is never rational, and that Christianity specifically can't be believed by any reasonable person without requiring a kind of miracle in that person's own understanding."

  Can you grade this the way a strict-but-fair grader would -- a letter grade, plus specific comments tied to actual claims in the answer (not just a vibe check), basically the kind of thing I could lift straight into the book as her red-pen marginalia. If it's easy, chuck in a little JSON rubric too (categories, points, a comment per category) -- that'd help keep the scene grounded in specifics instead of me just inventing generic "good job but needs more detail" notes.
reasoning: |-
  Here's a thinking process that leads to the suggested grading output:

  1.  **Analyze the Request:**
      *   **Goal:** Create a realistic grading scene for a novel.
      *   **Character:** Grad-student TA (overworked, careful, strict-but-fair).
      *   **Task:** Grade a sample student paper (Mara's) on Hume's "Of Miracles."
      *   **Input:** The prompt question and the student's answer.
      *   **Output Requirements:** Letter grade, specific marginalia/comments tied to actual claims (not generic), and a JSON rubric.
      *   **Tone:** Authentic academic grading (critical, precise, slightly weary but engaged).

  2.  **Analyze the Source Material (Hume's "Of Miracles"):**
      *   *Context:* Section X of *An Enquiry Concerning Human Understanding*.
      *   *The Argument:*
          *   **Part 1 (The A Priori/Principle Argument):** A miracle is a violation of a law of nature. Laws of nature are established by "firm and unalterable experience" (a "proof"). Testimony is also based on experience (our experience that testimony is usually reliable). We weigh the two experiences against each other. Since the experience *against* the miracle is uniform, the evidence *against* it is a "proof." Testimony can *never* amount to a "proof" unless the falsehood of the testimony would be *more* miraculous than the miracle itself.
          *   **Part 2 (The A Posteriori/Empirical Argument):** Even if Part 1 allows a theoretical possibility, in practice, no testimony for a miracle has ever met the necessary conditions (enough witnesses, education, integrity, nothing to gain, public nature, etc.).
          *   **The "Indian Prince":** This is often a point of confusion. Hume uses the Indian Prince story to illustrate *how* we weigh testimony against uniform experience. The Prince refuses to believe in ice. Hume says the Prince is reasonable *given his experience*, but Hume *also* says if the testimony were strong enough, the Prince *should* believe. This is crucial for the "in principle" part of the prompt.
          *   **The "In Principle" Question:** Does Hume rule it out *entirely*? Standard scholarly interpretation: No, not entirely in Part 1. He says it's *possible* in principle if the falsehood of the testimony is more miraculous than the event. But in Part 2, he argues it never happens in practice.
      *   *The Prompt's Specific Demand:* "Say explicitly whether Hume thinks it's ever possible in principle... or whether his argument rules this out entirely."

  3.  **Evaluate the Student Answer (Mara's Paper):**
      *   *Strengths:*
          *   Clear structure (Stage 1, Stage 2).
          *   Good grasp of the "proof" vs. "probability" distinction (though she simplifies it).
          *   Covers the four maxims of Part 2 (witnesses, passion for wonder, ignorant peoples, rival religions).
          *   Writing is clear and coherent.
      *   *Weaknesses/Errors:*
          *   **Crucial Error on Part 1:** She says, "no testimony could ever, even in principle, be strong enough to tip the balance the other way -- the proof against the miracle is always stronger than any testimony for it, full stop." **This is incorrect.** Hume explicitly says in Part 1 that there *is* a possibility: "No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact, which it endeavours to establish." Mara claims Hume rules it out "in principle" in Stage 1, but Hume leaves a tiny logical door open (even if he slams it shut in Stage 2).
          *   **The Indian Prince:** She interprets the Prince story as Hume granting a "principle of credulity" where we default to trusting testimony. This is a bit of a stretch/misreading. Hume uses the Prince to show that uniform experience outweighs testimony. He says the Prince is right to doubt *initially*, but if the testimony were strong enough (e.g., many credible witnesses), the Prince *ought* to believe. Mara's reading makes Hume sound more like Reid (Common Sense philosophy) than an empiricist skeptic.
          *   **The "In Principle" Prompt:** The prompt asked explicitly about this. Mara says "never rational... without requiring a kind of miracle in that person's own understanding." She conflates the practical impossibility with the theoretical impossibility. She gets the "never rational" conclusion right for *actual* cases, but misses the nuance of the *theoretical* threshold Hume sets.
          *   **Tone/Style:** It's a bit too confident on the "full stop" claim.

  4.  **Drafting the Grading Persona:**
      *   *Name:* Let's call the TA "Alex" or keep them anonymous.
      *   *Vibe:* Red pen, specific arrows, abbreviations (cf., viz., w/), maybe a sigh in the margins. Needs to show they know the text better than the student.
      *   *Grade:* It's a good paper but misses the core philosophical nuance on the "in principle" question. Probably a B+ or an A-. Given the "strict-but-fair" prompt, a B+ feels more realistic for a grad TA who spots the technical error on the "in principle" clause. Let's go with a **B+**. It acknowledges the good summary but penalizes the philosophical inaccuracy.

  5.  **Drafting the Marginalia:**
      *   Need to target the "full stop" claim in paragraph 2.
      *   Need to target the Indian Prince interpretation in paragraph 4.
      *   Need to praise the summary of Part 2 (Stage 2).
      *   Need to address the prompt's specific requirement about "in principle."

  6.  **Drafting the JSON Rubric:**
      *   Categories: Argument Accuracy, Prompt Adherence, Textual Evidence, Clarity/Style.
      *   Points: Weighted towards accuracy and prompt adherence.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Wait, if Mara says "no testimony could ever, even in principle... full stop," she directly contradicts Hume's famous quote about falsehood being more miraculous. This is a significant philosophical error. A strict TA might drop this to a B. But the rest of the essay is well-written. Let's settle on a **B+** (87/100) to show she's competent but missed the tricky bit.
      *   *Marginalia Style:* Use symbols like `?`, `!`, `cf. Enquiry X`. Make it look like quick notes written while reading.
      *   *Final Comment:* Needs to be constructive. "You summarized well, but you hardened Hume's skepticism too much in Part 1."

  8.  **Final Polish:**
      *   Ensure the JSON is valid.
      *   Make sure the "red pen" comments look distinct from the narrative text.
      *   Add a touch of "TA weariness" (e.g., "See me if you want to discuss the Prince example").

  9.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  Here is a grading packet designed to feel authentic to a philosophy TA's workflow. It includes the "red pen" marginalia (formatted as blockquotes for clarity), a final summary comment, and the JSON rubric data.

  ### The Grading Packet

  **Student:** Mara V.
  **Assignment:** Hume, *Enquiry* Section X ("Of Miracles")
  **Grader:** [TA Initials]
  **Grade:** **B+ (87/100)**

  ***

  #### Marginalia (Simulated Red Pen)

  > "Hume's essay 'Of Miracles' argues that a rational person should almost never believe a miracle happened just because someone testified to it. The argument has two stages."
  > *[Check mark]* Good clear intro.

  > "In the first stage, Hume notes that our belief in a law of nature -- like water needing cold to freeze -- rests on completely uniform past experience, without a single exception. That gives it the highest degree of evidential support experience can provide, what he calls a 'proof.'"
  > *[Circle "proof"]* Yes, distinct from "probability." Good distinction.

  > "Because a law of nature is defined by exceptionless experience, no testimony could ever, even in principle, be strong enough to tip the balance the other way -- the proof against the miracle is always stronger than any testimony for it, full stop."
  > *[Large question mark in margin]* **Wait.** This is too strong. Hume explicitly leaves a logical door open here: testimony *can* outweigh experience if the falsehood of the testimony would be *more* miraculous than the event itself. You've turned a probabilistic argument into an absolute impossibility. Check *Enquiry* ¶13.

  > "This is why Hume says a wise man proportions his belief to the evidence: the evidence is already maxed out against the miracle before any witness even opens their mouth."
  > *[Arrow pointing to previous comment]* This contradicts the "wise man" maxim if you claim the evidence is "maxed out" regardless of new testimony.

  > "The second stage is more historical than logical. Hume argues that even setting the first argument aside, no testimony for a religious miracle has, as a matter of fact, ever come from witnesses reliable enough to trust."
  > *[Underline "historical than logical"]* Better: *a posteriori* vs *a priori*. But yes, accurate distinction.

  > "He gives a few reasons: there aren't enough witnesses of sufficient education and character to rule out either delusion or deceit; people have a natural passion for surprise and wonder that makes them sloppy about this particular kind of story; miracle reports mostly crop up among ignorant, barbarous peoples, or get inherited from them; and miracles from rival religions cancel each other out as evidence, since each is offered in support of a different, incompatible system."
  > *[Star]* Excellent summary of the 4 maxims. This paragraph is solid.

  > "Hume also brings up an Indian prince who refuses to believe travellers' reports of ice, since nothing like that has ever happened in his own experience. Hume's point is that the prince isn't being unreasonable, just going on the best evidence available to him -- Hume actually grants a kind of principle of credulity here, where we default to trusting testimony unless we have some specific reason not to..."
  > *[Squiggly underline]* **Careful.** Hume isn't granting a Reid-style "principle of credulity." He's using the Prince to show that *uniform* experience outweighs testimony. He says the Prince is right to doubt *initially*, but implies if the witnesses were credible enough, the Prince *ought* to believe the ice exists. You're making Hume sound more charitable to testimony than he is.

  > "Overall, Hume concludes that believing in a miracle on the basis of testimony is never rational, and that Christianity specifically can't be believed by any reasonable person without requiring a kind of miracle in that person's own understanding."
  > *[Circle "never rational"]* Again, too absolute for Part 1. Rational belief is *possible* in principle, just not in practice (according to Hume). You answered the prompt's second half too definitively.

  ***

  #### Final Comments

  Mara, this is a very clearly written summary of Section X, and your grasp of the second stage (the empirical/historical maxims) is excellent. You clearly did the reading.

  However, you lost points on the philosophical nuance of the first stage. The prompt asked explicitly whether Hume rules out miracles *in principle*. You argued he does ("full stop"). But Hume's actual position is subtler: he argues that a "proof" against a miracle *usually* outweighs testimony, but he establishes a theoretical threshold where testimony *could* win (if the lie would be more miraculous than the event). By closing that door entirely in your first paragraph, you misrepresent the logic of the *a priori* argument, even if Hume slams that door shut later in the *a posteriori* section.

  Also, be careful attributing a "principle of credulity" to Hume. That's more Thomas Reid. Hume is a skeptic about testimony, not a default-truster.

  See me during office hours if you want to walk through the "Indian Prince" analogy—it's tricky, but important for the final exam.

  **Grade: B+**

  ***

  #### JSON Rubric Data

  ```json
  {
    "grading_rubric": {
      "course": "PHIL 201: Intro to Philosophy of Religion",
      "assignment": "Hume 'Of Miracles' Take-Home",
      "student_id": "Mara_V",
      "total_points": 100,
      "earned_points": 87,
      "letter_grade": "B+",
      "categories": [
        {
          "name": "Argument Accuracy",
          "weight": 40,
          "earned": 32,
          "comment": "Strong grasp of Part 2 maxims. Significant error in Part 1 regarding the 'in principle' possibility. Turned a probabilistic weigh-ing into an absolute impossibility."
        },
        {
          "name": "Prompt Adherence",
          "weight": 30,
          "earned": 25,
          "comment": "Addressed both stages, but answered the 'in principle' question incorrectly based on the textual evidence."
        },
        {
          "name": "Textual Evidence",
          "weight": 20,
          "earned": 18,
          "comment": "Good use of concepts (proof vs probability). Misinterpreted the Indian Prince analogy as a principle of credulity."
        },
        {
          "name": "Clarity & Style",
          "weight": 10,
          "earned": 10,
          "comment": "Writing is clear, organized, and professional. Easy to follow."
        }
      ],
      "grader_notes": "Student conflates Hume's practical conclusion with his theoretical premise. Common mistake. Watch for Reid-ian interpretations of testimony in future essays."
    }
  }
  ```

  ### Notes for the Author (Context on the Grading)

  1.  **The "In Principle" Error:** This is the most realistic "B+ vs A" differentiator. In philosophy, summarizing the *conclusion* correctly ("Hume thinks miracles are bogus") isn't enough; you have to get the *logic* right. Hume famously says: *"No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact, which it endeavours to establish."* Mara's claim that it's impossible "full stop" ignores this famous clause. A strict TA will catch this immediately.
  2.  **The Indian Prince:** This is a deep-cut nuance. Hume uses the Prince to show that experience governs belief. Mara interprets it as Hume saying "we should trust people unless we have a reason not to." Actually, Hume is saying "we should trust experience over people." Attributing a "principle of credulity" to Hume is a specific philosophical sin (confusing him with his contemporary rival Thomas Reid), which a grad TA would definitely circle.
  3.  **The Tone:** The comments are encouraging but precise. They use abbreviations (`cf.`, `viz.`) and reference specific paragraphs (`¶13`), which signals the grader knows the text intimately. The JSON rubric provides the bureaucratic backbone that makes the scene feel like modern university administration.
