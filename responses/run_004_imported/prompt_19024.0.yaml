prompt: |-
  I co-host a small philosophy-of-biology podcast and next month's guest is a structuralist biologist who's built her whole career defending the Gould-Lewontin spandrels critique against adaptationism -- properly hardcore about it. Her go-to move whenever someone hands her a concrete adaptationist story is to just say 'that's a just-so story' and move on without touching the specifics, and I don't want to let her get away with that for a whole hour. Draft me eight to ten interview questions that go beyond having her restate the critique: I want at least one on the fact that the San Marco mosaics actually sit in pendentives, not spandrels (i think? someone told me this once and I never confirmed it), and whether that's a harmless label or actually undercuts the metaphor's argumentative force; one that presses the Queller/Dennett-style complaint that the critique never cashed out into a rival methodology with its own risky predictions, so its no less unfalsifiable than what it's attacking; one on whether Gould & Vrba's 'exaptation' category quietly gives up the game, since co-opted spandrels seem to get fine-tuned by selection right after co-option anyway; and end with one that forces her to say what evidence would make her call some specific trait -- feathers, say -- a real adaptation instead of a byproduct. For each, note the dodge she'll probably reach for and give a follow-up that closes it off.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** Philosophy-of-biology podcast.
      *   **Guest:** Hardcore structuralist biologist, defender of Gould-Lewontin (1979) "Spandrels of San Marco" critique against adaptationism.
      *   **Guest's Tactic:** Dismisses adaptationist stories as "just-so stories" without engaging specifics.
      *   **Goal:** 8-10 interview questions that go beyond restating the critique. Need to press her on methodology, specific counter-arguments, and evidentiary standards.
      *   **Specific Requirements:**
          *   One question on the architectural accuracy of the "spandrel" metaphor (pendentives vs. spandrels).
          *   One question on the Queller/Dennett critique (lack of rival methodology/risky predictions).
          *   One question on Gould & Vrba's "exaptation" (does it concede to selectionism post-co-option?).
          *   One closing question on evidentiary standards for adaptations (e.g., feathers).
          *   For *each* question: Include the likely dodge and a follow-up to close it off.
      *   **Tone:** Professional, rigorous, philosophically informed, but conversational enough for a podcast.

  2.  **Deconstruct the Guest's Position & Weaknesses:**
      *   *Position:* Structural constraints, developmental pathways, and phylogenetic inertia explain more than selection. Adaptationism is a Panglossian paradigm.
      *   *Weakness 1 (The Metaphor):* The architectural analogy is famously flawed (Rose/Schmid). If the metaphor is wrong, does the logic hold?
      *   *Weakness 2 (Methodology):* Critique is negative. What's the positive research program? How do you test for structuralism?
      *   *Weakness 3 (Exaptation):* If a trait is co-opted, selection usually refines it. Does the origin matter more than the maintenance?
      *   *Weakness 4 (The "Just-So" Shield):* Using "just-so story" as a conversation stopper rather than a methodological critique.
      *   *Weakness 5 (Evidence):* What counts as proof? If she rejects adaptationist null hypotheses, what is her null hypothesis?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: The Architectural Fact-Check.* (Required)
          *   *Draft:* People say spandrels are actually pendentives. Does this matter?
          *   *Refinement:* Make it about the metaphor's force. If the architectural analogy is factually wrong, does it weaken the biological argument?
          *   *Dodge:* "It's just a metaphor."
          *   *Follow-up:* Metaphors structure thought. If the structure is wrong, does it mislead the biology?

      *   *Q2: The Methodological Void.* (Required - Queller/Dennett)
          *   *Draft:* Dennett says you don't have a method. What is your method?
          *   *Refinement:* Focus on "risky predictions." Adaptationism predicts optimization. What does structuralism predict that could be proven wrong?
          *   *Dodge:* "Biology is historical, not predictive."
          *   *Follow-up:* History leaves traces. Can't we test constraints vs. selection using comparative phylogenetics?

      *   *Q3: Exaptation and Selection.* (Required - Gould/Vrba)
          *   *Draft:* Doesn't exaptation just mean selection takes over later?
          *   *Refinement:* If a spandrel gets co-opted, selection refines it. Does the origin story matter if the current form is selected?
          *   *Dodge:* "Origin determines the constraint."
          *   *Follow-up:* But if 90% of the current complexity is due to secondary selection, isn't adaptationism still the primary explanatory tool for the *current* form?

      *   *Q4: The "Just-So" Stopper.* (Addressing the prompt's main complaint)
          *   *Draft:* Why do you just say just-so story?
          *   *Refinement:* Frame it as a burden of proof. When you dismiss a specific study as a just-so story, what specific methodological flaw are you pointing to?
          *   *Dodge:* "They didn't test alternatives."
          *   *Follow-up:* Okay, give me an example where they *did* test alternatives and you still rejected it. What was missing?

      *   *Q5: Developmental Constraints.*
          *   *Focus:* Positive case for structuralism.
          *   *Refinement:* Tetrapod limbs. Is this constraint or selection?
          *   *Dodge:* "It's both."
          *   *Follow-up:* How do we weigh them? Is there a ratio?

      *   *Q6: Optimality Modeling.*
          *   *Focus:* When does it work?
          *   *Refinement:* Eye optics. Even you must admit some things are optimized.
          *   *Dodge:* "Local optima."
          *   *Follow-up:* If local optima are everywhere, isn't adaptationism practically true even if philosophically flawed?

      *   *Q7: Phylogenetic Inertia.*
          *   *Focus:* History vs. Function.
          *   *Refinement:* Panda's thumb. Is it a kludge or a solution?
          *   *Dodge:* "It's a kludge."
          *   *Follow-up:* Does it work? If it works, does the kludginess matter for survival?

      *   *Q8: The Null Hypothesis.*
          *   *Focus:* Statistical framing.
          *   *Refinement:* Adaptationists use selection as the null. What is your null? Drift? Constraint?
          *   *Dodge:* "No null."
          *   *Follow-up:* Without a null, how do you falsify your own structuralist claims?

      *   *Q9: Evo-Devo Integration.*
          *   *Focus:* Modern context.
          *   *Refinement:* 1979 was pre-genomics. Does modern evo-deco save the spandrels paper or bury it?
          *   *Dodge:* "It vindicates Gould."
          *   *Follow-up:* Or does it show how constraints are themselves selected for evolvability?

      *   *Q10: The Feathers Question.* (Required - Closing)
          *   *Draft:* What evidence for feathers?
          *   *Refinement:* Force a concrete commitment. Feathers: Thermoregulation (byproduct) or Flight (adaptation)? What data changes your mind?
          *   *Dodge:* "It's complex."
          *   *Follow-up:* I need a binary. If we find fossil evidence of X, do you concede adaptation?

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Specific topics covered? Yes. Dodge/Follow-up for each? Yes.
      *   Tone check: Needs to be respectful but sharp. Avoid being antagonistic, but prevent vagueness.
