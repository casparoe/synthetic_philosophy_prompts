      *   *Section 3 (Evaluation):* Compare robustness. Yablo is elegant but metaphysically contentious (is mental really a determinable of physical?). Shoemaker is grounded in causal powers (physicalist friendly). However, both face the "Causal Inheritance/Exclusion" residue. If $P$ does all the work, $M$ looks like a shadow.
