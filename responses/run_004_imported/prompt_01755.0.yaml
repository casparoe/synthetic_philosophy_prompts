  2.  **Task 1: The Subset Account and Exclusion Immunity:**

      *   *Kim's Argument:* If $P$ causes $P^*$, and $M$ supervenes on $P$, does $M$ cause $P^*$? If $M$ and $P$ are distinct, we have overdetermination. If not, $M$ is epiphenomenal or identical to $P$.
      *   *Shoemaker's Move:* Properties are individuated by their causal powers. $M$ is realized by $P$ iff the causal powers of $M$ are a *subset* of the causal powers of $P$.
      *   *Why Immunity?* The exclusion argument assumes distinct, *competing* sufficient causes. If $M$'s powers are a subset of $P$'s, $M$ doesn't bring anything *new* to the table that $P$ doesn't already have. They aren't competing; they are nested. The effect ($E$) falls under the powers of $M$. Since $M$'s powers are part of $P$'s powers, $P$ brings about $E$ *in virtue of* the powers that constitute $M$.
      *   *Key Distinction:* It's not correlation (two things happening together). It's constitution/inclusion. $M$ isn't a *second* cause; it's the *causal profile* of $P$ restricted to a specific subset.
      *   *Addressing User's Worry:* Does this trivialize to identity? Shoemaker says no, because $P$ has *extra* powers $M$ doesn't have (multiple realizability). Does it leave exclusion? The claim is that exclusion applies to *distinct* sufficient causes. If $M \subset P$, they aren't distinct in the relevant causal sense regarding $E$.

  3.  **Task 2: Subset vs. Determinable/Determinate (Yablo):**

      *   *Yablo's View:* Mental properties are determinables of physical determinates (like Red is to Scarlet). Determinables don't compete with determinates. If Scarlet causes the pecking, Red doesn't *also* cause it competitively; Red is instantiated *by* Scarlet.
      *   *Friend's Claim:* They are the same move.
      *   *User's Claim:* They differ on formal constraints (co-instantiation, unique determinables).
      *   *Analysis:*
          *   *Similarities:* Both rely on a non-competitive metaphysical relation (inclusion/specification). Both aim to block exclusion by denying distinctness of causal claims.
          *   *Differences:*
              *   *Formal Constraints:* Determinables usually require that determinates under the same determinable are incompatible (can't be Scarlet and Crimson simultaneously in the same spot). Mental properties (functional roles) might be co-instantiated differently.
              *   *Multiple Realizability (MR):* Yablo's model fits MR well (Pain is determinable, C-fiber firing is determinate). But Shoemaker's subset is more granular (powers-based).
              *   *Metaphysical Ground:* Yablo is often seen as conceptual or metaphysical classification. Shoemaker is strictly causal/potentiality-based.
              *   *The "Gap":* Not every subset relation is a determinable relation. (e.g., "Being red and round" is a subset of "Being red", but not a determinate). Shoemaker's account is broader.
      *   *Verdict:* They are *analogous* strategies, but not notational variants. Shoemaker's is more technical regarding causal powers; Yablo's is more intuitive regarding property hierarchy. The user is right that they can come apart.

  4.  **Task 3: Evaluation (Which is more promising? Or do both fail?):**

      *   *The "Hard" Exclusion Objection:* Kim (and later proponents like Bennett, or reductionists) might argue that even if powers are subsets, the *instantiation* of the property is what does the causing. If $P$ is sufficient, why do we need $M$?
