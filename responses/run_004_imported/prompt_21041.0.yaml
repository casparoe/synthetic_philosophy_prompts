  *   **Specific Deduction:** You claim there are "no extra premises needed," but No-Trade theorems typically require assumptions about the **structure of the bet** (e.g., zero-sum) and **utility functions**.
  *   **Quote to cite:** *"...rather than a separate result needing its own assumptions... no extra premises needed beyond common priors and common knowledge that both sides want the trade."*
  *   **Reasoning:** Aumann (1976) is about probabilities of an event $E$. No-Trade (e.g., Milgrom-Stokey 1982) is about expected utility of acts. To link them, you must assume the bet is zero-sum and that willingness to trade implies differing expectations, which is an additional structural assumption beyond the 1976 premises.

