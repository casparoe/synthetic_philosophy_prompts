  *   **Specific Deduction:** You claim the mechanism is treating the posterior as evidence to "condition on," which is technically incorrect regarding the actual proof structure.
  *   **Quote to cite:** *"...lets each person treat the other's posterior as real evidence to condition on rather than noise, and that's what forces the two numbers to converge."*
