prompt: |-
  I'm a backend software engineer who has spent the past few months teaching myself Lean 4, after a brief and humbling detour through Coq, with the eventual goal of formally verifying a scheduling component we use at work. I have no formal background in philosophy, and only the mathematical logic I've picked up informally along the way, so a lot of the foundational material I keep running into is genuinely new to me. The axiom of choice is a good example: I understand the informal statement well enough -- given any collection of nonempty sets, you can select one element from each, even when there's no explicit rule for doing the selecting -- and I know it's independent of the rest of ZFC. What I don't have a good feel for is why it seems to matter so much, in practice, to people doing formal verification. A colleague recently suggested I just invoke `Classical.choice` to dispatch an annoying existence lemma, and it felt vaguely like cheating, which sent me down a rabbit hole. Along the way I discovered the claim that the axiom of choice actually implies the law of excluded middle once you're working in a constructive setting (I believe the relevant result is called Diaconescu's theorem), and I noticed that Coq and Agda seem to treat choice and classical logic as optional axioms you opt into, whereas Lean and Isabelle/HOL are built to be classical from the ground up.

  Could you lay out the most important implications of this whole axiom-of-choice controversy for someone in my position -- that is, for how I should think about the decision between working constructively and working classically when writing machine-checked proofs and formally verified code? I'm particularly interested in what is concretely gained or lost -- things like computational content, extractability, and canonicity, if those are even the right concepts -- when a development quietly depends on choice or excluded middle, and in whether the century-old philosophical dispute over the legitimacy of nonconstructive existence proofs should actually inform a practicing engineer's decision here, or whether that's really a separate, purely pragmatic question dressed up in old philosophical clothes. I'd rather you focus on a handful of the implications that matter most than try to be exhaustive.
