      *   *Fairness:* Ensure both sides get credit. Dave is arguing classical Teleology. Mara is arguing Naturalism/Anthropics.
      *   *Refining Point 5:* Make sure to explain *why* it's not a knockdown (the difference between ad hoc multiverse vs. theory-predicted multiverse).

