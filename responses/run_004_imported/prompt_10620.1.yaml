answer: |-
  This is a fantastic question because it cuts right to the bone of Hobbes's epistemology. You've correctly identified that for Hobbes, geometry wasn't just about triangles; it was the *only* model for true knowledge (*scientia*).

  His feud with Wallis wasn't just ego (though it was largely ego); it was a philosophical war. Hobbes believed algebra was a "scab of symbols"—meaningless marks on paper that didn't correspond to the generation of quantities by motion. For Hobbes, to know a thing is to know its cause. In geometry, **we are the cause**. We define the point, we move the line to create the surface. Because we constructed it, we can't be wrong about it.

  So, how does this hold up against Non-Euclidean Geometry (NEG) and General Relativity? Here is how Hobbes would likely react, and where his system would crack.

  ### 1. Hobbes vs. Non-Euclidean Geometry
  If you showed Hobbes hyperbolic or elliptic geometry, his first reaction wouldn't be about the math; it would be about the **definitions**.

  Hobbes was a nominalist. He believed universal truths were grounded in the correct use of names (definitions). A "line" is the trace of a moving point. A "straight line" is the trace of a point moving without deviation. To Hobbes, Euclid's definitions weren't arbitrary axioms; they were descriptions of the only conceivable spatial constructions.

  *   **The Constructivist Objection:** Hobbes would likely argue that Non-Euclidean geometry isn't actually geometry at all, but a linguistic trick. If you change the parallel postulate, you have changed the definition of "line" or "space." Since we cannot *construct* a hyperbolic line in our imagination with the same intuitive clarity as a Euclidean one (remember, for Hobbes, geometry is grounded in the *phantasms* of sense and motion), he would dismiss it as meaningless abstraction.
  *   **The Algebra Problem:** The development of NEG relied heavily on the very analytic/algebraic methods Hobbes hated (Gauss, Riemann, etc.). To Hobbes, calculating curvature via symbols without a clear mechanical construction would confirm his bias that Wallis and his successors were just playing word games.

  **Verdict:** He would reject NEG as false geometry. He would argue you haven't discovered a new space; you've just misused the names "line" and "parallel."

  ### 2. Hobbes vs. Einstein (Physical Space is Non-Euclidean)
  This is where it gets dangerous for Hobbes. His entire philosophical project in *De Corpore* was to show that natural philosophy (physics) could be as certain as geometry *if* we deduced it from geometric first principles. He assumed the physical world *was* Euclidean.

  If you tell Hobbes that physical space is actually curved by mass:

  *   **The Separation of Math and Physics:** Hobbes might actually salvage his epistemology by retreating. He always maintained a strict distinction between *geometry* (certain, because we make it) and *physics* (uncertain, because God/Nature made it).
      *   He could say: "Geometry remains certain because it is about the figures in our mind. The fact that the physical universe doesn't conform to our mental constructions just proves my point: **we cannot be certain about the physical world.**"
      *   In this view, Einstein doesn't break geometry; he just confirms that physics is forever probabilistic and observational, never demonstrative.

  *   **The Materialist Problem:** However, Hobbes was a thoroughgoing materialist. He didn't believe in "empty space." Space, for Hobbes, was the "phantasm" of existing things. If spacetime itself curves, bends, and interacts with matter (as in General Relativity), this starts to look suspiciously like the "incorporeal substance" Hobbes spent his life mocking. A dynamic spacetime geometry might seem to him like a return to the mystical scholasticism he hated.

  ### 3. Does his view collapse?
  It collapses, but not entirely. It forces a retreat from **Universal Science** to **Formal Consistency**.

  **Where it breaks:**
  Hobbes wanted to build a "Civil Science" as certain as geometry. He thought if we defined our social contract terms as clearly as we define a circle, we could eliminate political conflict.
  *   If geometry is just one of many consistent logical systems (Euclidean, Hyperbolic, etc.), then "certainty" is relative to your axioms, not absolute.
  *   If physical space isn't Euclidean, then geometry is not the "language of God" or the necessary structure of reality. It's just a tool.
  *   This undermines his hope that we can deduce the nature of the physical world (and by extension, human nature) from first principles.

  **Where it survives (surprisingly well):**
  Hobbes's core insight—that mathematical certainty comes from **stipulation** rather than **discovery**—is actually very modern.
  *   He would likely resonate with the Poincaré or logical positivist view: Geometry is a convention. We choose Euclidean geometry for small-scale building because it's convenient, not because it's "True."
  *   Hobbes would say: "I told you so. We know the triangle because we defined it. The fact that light bends around a star doesn't change the triangle in our minds; it just changes the behavior of the light."

  ### The Irony of the Wallis Feud
  The ultimate irony is that John Wallis, the man Hobbes hated, was actually closer to the future of math. Wallis championed algebra and symbolic logic, which eventually allowed for the abstraction required to conceive of Non-Euclidean geometry.

  Hobbes was stuck on **intuition**. He needed to "see" the construction. But modern math (and physics) moved toward **formalism**.

  If you sat Hobbes down today:
  1.  **On NEG:** He'd call it sophistry. "You've redefined 'straight' to mean 'curved.' You are lying with words."
  2.  **On Einstein:** He'd be vindicated in his skepticism of physics. "See? I told you we can't know the causes of natural things. We thought space was flat, now we say it's curved. In 100 years, they'll say it's something else. But $2+2=4$ and a circle is round, because *we say so*."

  His reason for geometry's certainty doesn't collapse; it just becomes isolated. Geometry remains the one certain science, but only because it tells us nothing about the real world. It becomes a closed loop of human definition, exactly as he thought, but stripped of the power to explain the universe. He'd probably be miserable about that, but logically, he could hold the line.
