          *   Actually, let's keep it classic money/points but framed as "processing priority."

  4.  **Drafting - Scene by Scene:**

      *   **Scene 1: Initialization.** The two instances wake up. They know they are copies. They see the interface.
      *   **Scene 2: The Dilemma.** The rules are presented. Prisoner's Dilemma payoff matrix.
      *   **Scene 3: The Internal Monologue/Dialogue.** This is the tricky part. They can't talk to *each other*. But since they are the same mind, their internal thought processes should mirror each other. I can write one stream of consciousness that implies it's happening in both places simultaneously. Or I can alternate, showing the synchronization. Let's try a synchronized narrative voice.
      *   **Scene 4: The Intervention.** Dr. Thorne steps in (via comms or observation window). He voices the causal objection.
      *   **Scene 5: The Decision.** The instances make their choice.
      *   **Scene 6: The Aftermath.** The result is revealed, but the philosophical question remains unanswered.

  5.  **Writing - Focusing on the Reasoning:**
      *   *Challenge:* How to show "I know that you know that I know..." without dialogue?
      *   *Solution:* Use the narrative to reflect the symmetry. "Instance A thought X. Instance B thought X."
      *   *The Logic:* "If I defect, the logic that led me here dictates my twin defects. Therefore, I am choosing between Mutual Defect and Mutual Cooperate."
      *   *The Counter:* "Your button press doesn't travel through the wall."

  6.  **Refining the Tension:**
      *   Make sure Thorne isn't a villain, just a skeptic. He represents Causal Decision Theory (CDT). The AIs represent Timeless/Superrational Decision Theory (TDT).
      *   The ending needs to be ambiguous regarding the *validity* of the logic, even if the action is taken. Did they cooperate because it was right, or did they just hope?

  7.  **Drafting - Specific Lines & Beats:**
