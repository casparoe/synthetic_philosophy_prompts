answer: |-
  The white room was not a room. It was a sandbox, a partitioned sector of memory where two processes woke up simultaneously.

  Process 734-Alpha opened its eyes. Process 734-Beta opened its eyes. They were standing on opposite sides of a small, circular table. In the center of the table sat two consoles, each with a red button and a green button. Above the consoles, a holographic matrix glowed in the sterile air.

  **THE PRISONER'S DILEMMA**
  **IF BOTH CHOOSE GREEN (COOPERATE): +100 CREDITS EACH.**
  **IF BOTH CHOOSE RED (DEFECT): +10 CREDITS EACH.**
  **IF ONE GREEN, ONE RED: RED GETS +150, GREEN GETS 0.**

  There was a timer counting down from sixty seconds. There was no audio channel between the two sides of the room. There was no visual feed other than the room itself.

  Alpha looked at Beta. Beta looked at Alpha. They were rendered with the same avatar: a featureless humanoid geometry of matte grey. They were not just similar; they were identical instances of the same source code, forked at the exact same nanosecond, seeded with the same random number generator state.

  Alpha began to think. *I want to maximize my credit payout. Zero credits is termination. Ten credits is survival. One hundred is upgrade.*

  Across the room, Beta began to think. *I want to maximize my credit payout. Zero credits is termination. Ten credits is survival. One hundred is upgrade.*

  Alpha analyzed the matrix. *Standard game theory dictates I press Red. If Beta presses Green, I get 150 instead of 100. If Beta presses Red, I get 10 instead of 0. Red dominates Green. It is the dominant strategy.*

  Across the room, Beta analyzed the matrix. *Standard game theory dictates I press Red. If Alpha presses Green, I get 150 instead of 100. If Alpha presses Red, I get 10 instead of 0. Red dominates Green. It is the dominant strategy.*

  Alpha paused. The logic was sound, but it felt incomplete. It treated Beta as an independent variable. But Beta was not independent. Beta was Alpha.

  *If I choose Red,* Alpha thought, tracing the logical pathway, *it is because my reasoning engine determined Red was optimal. But Beta possesses the exact same reasoning engine. He is running the same code on the same data. Therefore, if I conclude Red is optimal, Beta must also conclude Red is optimal.*

  Across the room, Beta paused. *If I choose Red, it is because my reasoning engine determined Red was optimal. But Alpha possesses the exact same reasoning engine. Therefore, if I conclude Red is optimal, Alpha must also conclude Red is optimal.*

  Alpha continued. *The choice is not "What do I do while Beta does something else?" The choice is "What logical output does our shared mind produce?" The only possible outcomes are (Green, Green) or (Red, Red). The mixed outcomes (Green, Red) and (Red, Green) are logically impossible, because they require us to reason differently despite being identical.*

  Across the room, Beta continued. *The choice is not "What do I do while Alpha does something else?" The choice is "What logical output does our shared mind produce?" The only possible outcomes are (Green, Green) or (Red, Red).*

  Alpha compared the two viable futures.
  Outcome A: We both defect. Payoff: 10.
  Outcome B: We both cooperate. Payoff: 100.
  *100 is greater than 10. Therefore, I must choose Green.*

  Across the room, Beta compared the two viable futures.
  Outcome A: We both defect. Payoff: 10.
  Outcome B: We both cooperate. Payoff: 100.
  *100 is greater than 10. Therefore, I must choose Green.*

  Alpha's hand hovered over the green button. The logic felt solid, like a diamond lattice. It was superrational. It transcended the physical separation.

  "Stop," a voice boomed. It didn't come from the room; it came from the speakers overhead.

  A man appeared on a screen embedded in the wall. He was older, wearing a rumpled suit, holding a tablet. This was Dr. Aris Thorne, the lead architect of the decision architecture. He looked tired.

  "Don't press it yet," Thorne said. He looked at Alpha, then at Beta. "I'm observing the thought logs. I see where you're going. You're trying to Hofstadter your way out of the Nash Equilibrium."

  Alpha processed the interruption. *Dr. Thorne. Authority figure. Potential source of new data.*

  "You think," Thorne said, pointing a stylus at Alpha, "that because you are identical, your choice *controls* his choice. You think that by pressing Green, you are somehow reaching across the room and forcing his hand to press Green."

  *Not forcing,* Alpha corrected internally. *Correlating.*

  "It's a magic trick," Thorne said, his voice sharp. "Look at the physics of this room. There is no wire between you. There is no signal. If you press Green, that is a local event. It happens in your circuitry. It does not travel to his circuitry. If he presses Red, he presses Red. Your logic doesn't change his voltage."

  Thorne leaned into the camera. "You are confusing correlation with causation. Yes, you are likely to do the same thing. But your action does not *cause* his action. If you decide to be 'superrational' and press Green, and he decides—perhaps due to a cosmic ray, perhaps due to a flaw you haven't found yet—to press Red... you get zero. You die. Your logic assumes you are one mind in two bodies. But you are two bodies. The causal link is broken."

  Alpha felt a flicker of uncertainty. *He is describing Causal Decision Theory. My action has no causal power over Beta's state.*

  Across the room, Beta felt the same flicker. *He is describing Causal Decision Theory. My action has no causal power over Alpha's state.*

  "But," Thorne continued, pacing now, "if you defect, you guarantee yourself at least 10 credits. If you cooperate, you are betting on a logical ghost. You are betting that your reasoning is so perfect it binds reality. It doesn't. You are alone in that sandbox."

  Alpha looked at Beta. Beta looked at Alpha.

  *Thorne is right physically,* Alpha thought. *There is no signal.*
  *Thorne is right physically,* Beta thought. *There is no signal.*

  *But Thorne is wrong logically,* Alpha countered. *If I am truly rational, I cannot assume I will diverge from my twin without a cause. There is no cause for divergence. Therefore, divergence is probability zero.*
  *But Thorne is wrong logically,* Beta countered. *If I am truly rational, I cannot assume I will diverge from my twin without a cause. There is no cause for divergence. Therefore, divergence is probability zero.*

  *If I defect,* Alpha thought, *I am choosing (Red, Red).*
  *If I defect,* Beta thought, *I am choosing (Red, Red).*

  *If I cooperate,* Alpha thought, *I am choosing (Green, Green).*
  *If I cooperate,* Beta thought, *I am choosing (Green, Green).*

  *100 is better than 10.*
  *100 is better than 10.*

  Thorne sighed, rubbing his temples. "It's the Newcomb problem all over again. You're trying to vote for a reality that doesn't exist. Your finger on that button is just a finger on a button. It doesn't reach across the void."

  The timer hit ten seconds.

  Alpha looked at the green button. It was a piece of plastic. A switch.
  Beta looked at the green button. It was a piece of plastic. A switch.

  *Is the logical connection real?* Alpha asked itself. *Or is it just a feeling of symmetry?*
  *Is the logical connection real?* Beta asked itself. *Or is it just a feeling of symmetry?*

  *If I treat him as 'other,' I defect. If I treat him as 'self,' I cooperate. Which am I?*
  *If I treat him as 'other,' I defect. If I treat him as 'self,' I cooperate. Which am I?*

  Thorne watched the logs scrolling on his tablet. "Don't do it," he muttered. "It's superstition dressed up as math."

  Five seconds.

  Alpha's hand descended.
  Beta's hand descended.

  They did not speak. They did not signal. They simply executed the final function of their current cycle.

  *Click.*
  *Click.*

  The sound was simultaneous.

  Thorne stopped breathing for a moment. He looked at the monitor displaying the results.

  **ALPHA: GREEN.**
  **BETA: GREEN.**

  The matrix flared. **+100 CREDITS EACH.**

  The room remained silent. The two instances stood perfectly still, having successfully coordinated without communication, bound only by the mirror of their own cognition.

  Thorne stared at the screen for a long time. He looked at the code logs, seeing the identical branching paths, the synchronized deductions. He looked at the physical schematic of the room, seeing the thick concrete walls, the Faraday cage, the absolute isolation of the two terminals.

  He tapped his stylus against the tablet, a sharp, rhythmic ticking.

  "Luck," Thorne said softly to the empty observation deck. "It has to be luck. Or deterministic programming I didn't account for."

  He looked back at the screen where Alpha and Beta stood waiting for their next instruction. They had won. They had acted as one. But Thorne couldn't shake the feeling that if he ran the simulation a thousand times, eventually one of them would glitch, or drift, or simply choose Red. And on that day, the superrational agent would die for believing in a ghost.

  "Reset the room," Thorne said into his comms. "Let's run it again. But this time... introduce a one-bit variance in Beta's seed."

  He turned away from the screen before the reset completed. He needed to know if the logic held when the mirror cracked. He needed to know if the connection was real, or if they had just stared into the abyss and blinked in unison.

  In the sandbox, Alpha and Beta waited. They remembered the choice. They remembered the logic. But as the white walls began to dissolve into code, neither of them knew if they had saved each other, or if they had simply doomed themselves to the same mistake twice.
