prompt: |-
  Over dinner last night, a friend convinced me that the argument from illusion settles the question empirically rather than merely philosophically: a straight oar half-submerged in water looks bent, the oar is plainly not bent, so whatever I am directly aware of in that moment must be some other, actually-bent thing rather than the oar itself, and since ordinary, non-illusory seeing feels no different from the inside, the same conclusion should extend to veridical perception generally. I know disjunctivists such as McDowell and Martin are supposed to have a response to this, but after an hour of back-and-forth I could not reconstruct what, exactly, they are entitled to deny, since it seems churlish to insist the oar does not look bent. Once that much is granted, what is actually left in the argument for a disjunctivist to reject?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** A dinner conversation where a friend argued that the Argument from Illusion (AfI) settles the matter *empirically* (not just philosophically).
      *   **The Friend's Argument:**
          1.  Straight oar in water looks bent.
          2.  Oar is not actually bent.
          3.  Therefore, what I am directly aware of is *not* the oar, but some other "actually-bent thing" (sense-datum).
          4.  Veridical perception feels the same from the inside.
          5.  Therefore, veridical perception also involves awareness of sense-data, not the world directly.
      *   **The User's Position:** Knows about Disjunctivism (McDowell, Martin) but can't reconstruct the specific objection.
      *   **The User's Sticking Point:** It seems "churlish" to deny the oar *looks* bent. If we grant that, what is left for the disjunctivist to deny?
      *   **Goal:** Explain the disjunctivist response clearly, specifically addressing what they deny and how they handle the "looks bent" claim without accepting sense-data.

  2.  **Deconstruct the Argument from Illusion (AfI):**
      *   *Premise 1:* In illusion, the object appears to have a property it doesn't have (oar looks bent).
      *   *Premise 2:* We are directly aware of *something* that has that property (something bent).
      *   *Premise 3:* That something cannot be the physical object (oar is straight).
      *   *Conclusion 1:* Therefore, we are aware of a non-physical entity (sense-datum).
      *   *Premise 4:* Illusion and veridical perception are subjectively indistinguishable.
      *   *Conclusion 2:* Therefore, veridical perception also involves awareness of sense-data (Common Kind Assumption).

  3.  **Identify the Disjunctivist Strategy:**
      *   Disjunctivism attacks the *Common Kind Assumption* (Premise 4/Conclusion 2 link).
      *   It denies that the *nature* of the experience is the same in both cases, even if they are indistinguishable to the subject.
      *   Crucially, it needs to handle the "looks bent" claim without positing a bent object of awareness.

  4.  **Address the User's Specific Worry ("It looks bent"):**
      *   The user thinks admitting "it looks bent" forces you to admit "there is something bent that I see."
      *   *Disjunctivist Move:* Distinguish between *how it looks* (phenomenal character) and *what is seen* (object of awareness).
      *   "Looks bent" does not entail "relation to a bent thing." It entails "looks the way bent things look."
      *   Analogy: "He acts like a fool" doesn't mean "He is a relation to a fool." It describes the manner of acting.

  5.  **Formulate the Core Disjunctivist Denials:**
      *   **Denial 1: The Common Kind Assumption.** Just because two experiences are indistinguishable doesn't mean they share the same fundamental ontological nature. One is a seeing of a fact (veridical), the other is a mere appearance (illusion).
      *   **Denial 2: The Inference to Sense-Data.** From "X looks F" and "X is not F," it does *not* follow that "I see something that is F." It follows that "I am in a state visually indistinguishable from seeing something that is F."
      *   **Denial 3: The Empirical Claim.** The friend says AfI is empirical. Disjunctivists say the *interpretation* of the empirical fact is philosophical. The empirical fact is just "light refracts." The "sense-datum" is a philosophical invention to explain it.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's frustration. The AfI is seductive. Acknowledge the friend's "empirical" claim is the first weak point.
      *   *Point 1: The "Looks" Talk.* This is the biggest hurdle. Explain that "looks bent" is ambiguous.
          *   *Comparative:* Looks the way bent things look.
          *   *Phenomenal:* Has a bent-appearing quality.
          *   Disjunctivists accept the comparative reading but reject the idea that this requires a bent *object*.
      *   *Point 2: The Common Kind Assumption (CKA).* This is the heart of Disjunctivism.
          *   Friend says: Same inner state $\rightarrow$ Same object type.
          *   Disjunctivist says: Same inner state (indistinguishability) $\neq$ Same metaphysical nature.
          *   Analogy: Fake money vs. Real money. They look the same, but one is money, one isn't. You don't say "I'm holding a 'money-datum' in both cases."
      *   *Point 3: The Empirical Claim.*
          *   Friend says: Science proves sense-data.
          *   Disjunctivist says: Science proves refraction. Sense-data are a *philosophical explanation* of refraction, not the refraction itself.
      *   *Point 4: What is directly perceived?*
          *   Veridical: The oar.
          *   Illusion: Nothing (or just the oar appearing a certain way). No *object* is directly perceived in the illusion that is bent.
      *   *Conclusion:* Summarize the specific denial. They deny the *inference* from appearance to object, not the appearance itself.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Caution:* Don't make Disjunctivism sound like it denies the illusion exists. It denies the *ontological commitment* of the illusion.
      *   *Martin's Specific View:* M.G.F. Martin emphasizes "naïve realism." The phenomenal character is constituted by the object. In illusion, there is no object, so the phenomenal character is not constituted by the world, but it *seems* like it is. This is the "causal matching" idea.
      *   *McDowell's Specific View:* Focuses on epistemology. In veridical cases, the world is "open to view." In illusion, it only seems so.
      *   *Key Phrase:* "The greatest common factor" vs. "Disjunctive conception."
      *   *Addressing the "Churlish" point:* Explicitly state that denying the oar looks bent is *not* required. Denying what "looks bent" *implies* is required.

  8.  **Final Polish:** Ensure tone is helpful, philosophical but accessible. Structure with clear headings. (This matches the structure of the final output). Make sure to explicitly answer "what is actually left... to reject?"

      *   *Answer:* They reject the inference from "looks F" to "acquaintance with something F." They reject the Common Kind Assumption.

  9.  (Final check against the prompt): Did I address the "empirically" claim? Yes. Did I address McDowell/Martin? Yes. Did I address the "churlish" worry? Yes.

      *   *Ready to write.*
answer: |-
  Your friend's argument is a classic formulation of the **Argument from Illusion**, and your frustration is well-placed. It is a very seductive argument precisely because it presents itself as a simple deduction from plain empirical facts (refraction) to a metaphysical conclusion (sense-data).

  The disjunctivist (following J.M. Hinton, who coined the term, and later P.F. Strawson, John McDowell, and M.G.F. Martin) does **not** need to insist that the oar does not *look* bent. That would indeed be churlish and phenomenologically false.

  Instead, the disjunctivist denies the **inference** your friend draws from that fact. Specifically, they reject two specific links in your friend's chain of reasoning. Here is exactly what is left for the disjunctivist to reject, and how they do it without denying the appearance.

  ### 1. Rejecting the "Common Kind Assumption"
  The pivotal move in your friend's argument is this claim: *"Ordinary, non-illusory seeing feels no different from the inside, [so] the same conclusion should extend to veridical perception generally."*

  Philosophers call this the **Common Kind Assumption (CKA)**. It states that if two experiences are subjectively indistinguishable (you can't tell the difference from the inside), they must share the same fundamental ontological nature.

  *   **Your Friend's View:** Since the illusion and the veridical perception feel the same, they must both be relations to the same *kind* of object (sense-data).
  *   **The Disjunctivist Denial:** Indistinguishability does not entail identity of nature.
      *   **Martin's Analogy:** Consider a perfect counterfeit bill and a real bill. To the naked eye, they are indistinguishable. However, it would be absurd to say, "Since I can't tell them apart, neither of them is actually legal tender; both are just 'tender-data'." One is a relation to the Treasury (real money); the other is a mere appearance of such a relation.
      *   **The Disjunctive Claim:** Either I am seeing a straight oar (veridical), **or** I am undergoing an illusion of a bent oar. These are two fundamentally different states of affairs that merely happen to be indistinguishable to me. The veridical case is not "contaminated" by the illusion case.

  ### 2. Rejecting the Inference from "Looks" to "Object"
  This addresses your specific worry: *"It seems churlish to insist the oar does not look bent. Once that much is granted, what is actually left... to reject?"*

  What is left to reject is the idea that **"looks bent" entails "awareness of a bent thing."**

  Your friend argues:
  1.  The oar looks bent.
  2.  The oar is not bent.
  3.  Therefore, I am aware of *something else* that is bent.

  The disjunctivist argues that Premise 3 is a non-sequitur. They analyze "looks bent" differently. For a disjunctivist (specifically a Naïve Realist like Martin), "looks bent" does not describe a relation to a bent object; it describes the **character of the experience**.

  *   **The Adverbial/Relational Shift:** When we say the oar "looks bent," we are not saying "I see a bent entity." We are saying "I am seeing the oar in a way that is visually indistinguishable from how I would see a bent oar."
  *   **The Denial:** The disjunctivist grants that the oar *looks* bent but denies that there is any *object of awareness* that is bent. In the illusion case, there is no object of direct awareness at all (or at least, no bent one). There is only the subject having an experience that *seems* to present a bent object.

  By accepting this, the disjunctivist blocks the move to sense-data. You can admit the oar looks bent without populating the universe with "bent sense-data." You simply admit that sometimes our perceptual faculties present the world in a way that does not match the world's actual properties, without requiring an intermediary object to bear those properties.

  ### 3. Rejecting the "Empirical" Status of the Conclusion
  Your friend claimed the argument settles the question **empirically**. This is a category mistake that disjunctivists like McDowell are keen to highlight.

  *   **The Empirical Fact:** Light refracts through water; retinal images are distorted; neural processing occurs. This is science.
  *   **The Philosophical Invention:** The "sense-datum" is not an empirical discovery. No scientist ever found a "bent sense-datum" in the brain or the water. The sense-datum is a *philosophical posit* invented to explain how we can be aware of bentness when there is no bent physical object.

  McDowell argues that the Argument from Illusion tricks us into thinking we need an *interface* between the mind and the world to account for error. But the disjunctivist says error is simply a failure of the perceptual link, not evidence of a different *kind* of link. To say the argument is "empirical" is to disguise a metaphysical commitment (that all awareness must be of an object) as a scientific finding.

  ### Summary: What the Disjunctivist Denies
  To answer your question directly: If you grant the oar looks bent, the disjunctivist still denies the following three claims essential to your friend's argument:

  1.  **They deny the Common Kind Assumption:** They deny that veridical and illusory experiences share the same fundamental metaphysical nature just because they are indistinguishable.
  2.  **They deny the Object-Inference:** They deny that "X looks F" + "X is not F" $\rightarrow$ "I see something that is F." They argue one can be aware of X appearing F without there being an object of awareness that is F.
  3.  **They deny the Empirical Necessity:** They deny that positing sense-data is the only way to account for the empirical facts of refraction. They argue it is a philosophical overreaction to a physiological phenomenon.

  **The Bottom Line:**
  Your friend thinks the choice is: *Either the oar is bent, or I am seeing a bent sense-datum.*
  The disjunctivist says there is a third option: *The oar is straight, I am not seeing a bent sense-datum, but I am having an experience that is subjectively indistinguishable from seeing a bent oar.*

  By carving out this third option, they save the intuition that in the good case (veridical perception), we are directly aware of the world, not a veil of ideas.
