answer: |-
  **MEMORANDUM**

  **TO:** Bereavement Care Clinical Policy Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Adoption of DSM-5-TR Prolonged Grief Disorder (PGD) Coding and Screening Protocols

  ### Executive Summary

  This memo recommends that the Health System **adopt** the DSM-5-TR diagnosis of Prolonged Grief Disorder (PGD) for clinical coding and intake screening, **conditional upon the implementation of a Guarded Implementation Protocol.**

  While the clinical necessity of PGD is clear—providing access to evidence-based treatment for approximately 10% of bereaved adults who suffer severe functional impairment—there are valid risks associated with psychiatric classification. Specifically, we must mitigate the risk that the diagnosis itself alters the patient's experience of grief, potentially encouraging a "sick role" identity rather than facilitating recovery.

  The recommended protocol balances immediate access to care with safeguards against over-medicalization. It includes delayed screening timelines, specific clinician training on diagnostic framing, and a mandatory six-month post-diagnosis review to monitor for iatrogenic effects.

  ### Clinical Context and Necessity

  Prior to the DSM-5-TR (2022) inclusion of PGD, clinicians faced a binary choice: code bereavement as "Unspecified Trauma- and Stressor-Related Disorder" or deny coding entirely. This created two problems:
  1.  **Access to Care:** Without a billable diagnosis, patients requiring specialized Complicated Grief Therapy (CGT) were often limited to short-term supportive counseling.
  2.  **Validation:** Patients suffering from debilitating yearning, identity disruption, and inability to function beyond 12 months post-loss were left without a clinical framework to understand their stagnation.

  Current data suggests roughly 1 in 10 bereaved adults meet criteria for clinically significant prolonged grief. For this population, PGD is not a theoretical construct but a description of acute suffering. Denying the diagnosis denies them protocol-driven treatment.

  ### The Classification Risk: "Diagnostic Feedback"

  However, adopting a new psychiatric category carries inherent risks beyond simple over-diagnosis. We must consider the phenomenon of **diagnostic feedback** (sometimes referred to in philosophy of science as the "looping effect").

  Unlike medical conditions such as a fractured bone, psychiatric categories are "interactive." When a patient learns they have PGD, that knowledge changes how they interpret their own emotions. There is a risk that patients may begin to monitor their grief against the DSM checklist, unconsciously performing the symptoms to align with the diagnosis. This can transform grief from a process one *undergoes* into a script one *follows*, potentially entrenching the very pathology we aim to treat.

  If we adopt PGD without addressing this feedback loop, we risk creating a self-fulfilling prophecy where the label sustains the disorder. Therefore, our adoption must be operationally designed to minimize this feedback.

  ### Operational Recommendations

  To approve the adoption of PGD while mitigating classification risks, the following three operational conditions must be met:

  #### 1. Screening Protocol: Time and Function Gates
  We will not implement universal screening for all bereaved patients. Screening will be gated by time and functional impairment to distinguish pathology from normal variation.
  *   **Time Gate:** Screening will only occur **after 12 months** post-loss for adults (6 months for children), strictly adhering to DSM-5-TR criteria. Early screening is prohibited to avoid pathologizing acute grief.
  *   **Functional Gate:** Before administering the *Prolonged Grief-13 (PG-13-R)* scale, clinicians must document specific functional impairment (e.g., inability to maintain employment, total social withdrawal, inability to care for dependents). High symptom scores without functional impairment do not warrant a PGD workup.
  *   **Tool:** Use the PG-13-R strictly as a severity monitor, not a diagnostic oracle. A positive screen triggers a clinical interview, not an automatic diagnosis.

  #### 2. Clinician Training: Diagnostic Framing
  How the diagnosis is introduced matters as much as the diagnosis itself. We will require a specialized training module for all bereavement counselors on **"Diagnostic Framing and Narrative."**
  *   **Avoid Identity Language:** Clinicians are prohibited from using identity-first language (e.g., "You are a PGD patient"). Language must be symptom-focused (e.g., "Your grief has become stuck," or "You are meeting criteria for a stress response related to loss").
  *   **The "Tool, Not Truth" Script:** Clinicians will be trained to explain the diagnosis as an administrative key to unlock treatment, not an ontological definition of the patient's soul.
      *   *Suggested Script:* "This diagnosis is a way for us to describe how heavy this burden has become and to authorize specific therapy to help you carry it. It does not mean your love for the deceased is disordered, but that the pain is preventing you from living."
  *   **Normalization:** Every diagnostic session must include a normalization component, explicitly validating that grief has no "correct" timeline, while distinguishing *intensity* and *impairment* from *duration*.

  #### 3. Monitoring the Loop: The Six-Month Review
  To address the risk that the diagnosis itself reinforces symptoms, we will build a feedback mechanism into the EHR.
  *   **Mandatory Re-evaluation:** Any patient diagnosed with PGD must undergo a formal re-evaluation at **six months post-diagnosis**, regardless of treatment status.
  *   **Metrics:** This review will track not only symptom reduction (PG-13-R scores) but also "Identity Integration." We will add a brief qualitative note requirement: *Does the patient view the diagnosis as helpful for recovery, or as a defining label?*
  *   **Audit:** The Committee will review aggregate data annually. If we see patients retaining the diagnosis indefinitely without symptom improvement, or if coding rates spike disproportionately relative to bereavement volume, we will pause the protocol to investigate potential diagnostic inflation.

  ### Conclusion and Vote Request

  The argument against PGD is not that the suffering is fake, but that the categorization might change the suffering. We can honor that insight without withholding care. By adopting PGD with these specific guardrails, we provide necessary treatment access to the 10% who are truly stuck, while protecting the remaining 90%—and the treated 10%—from the risks of medicalized identity.

  **Motion:** I move that the Committee adopts the DSM-5-TR Prolonged Grief Disorder coding and screening protocols, contingent upon the development of the "Guarded Implementation Protocol" (Time/Function Gates, Diagnostic Framing Training, and Six-Month Review) outlined above, to be drafted by the Clinical Standards subcommittee within 60 days.

  ***

  **Attachments:**
  *   *DSM-5-TR PGD Diagnostic Criteria Summary*
  *   *Draft: Clinician Scripting Guide for PGD Disclosure*
  *   *Summary of Insurance Reimbursement Changes for PGD (2023)*
