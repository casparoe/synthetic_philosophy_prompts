  2.  **Deconstruct the Scientific/Statistical Issue:**
      *   **Reference Classes:** This is the heart of the problem. Risk models work by placing an individual into a *reference class* (a group of similar people) and seeing what happened to that group.
      *   **Model A (Genetic/Marker):** Reference class = Women with similar genetic markers + family history. Risk = 14%.
      *   **Model B (Clinical/Gail Model-ish):** Reference class = Women of similar age + reproductive history. Risk = 22%.
      *   **The Conflict:** The models weigh different variables differently. One might capture biological susceptibility (genes), the other lifetime exposure (hormones, age, parity).
      *   **The Philosophical/Statistical Truth:** There is no single "true" probability for an individual. Probability is a property of the *model* and the *population*, not the individual. An individual either gets cancer or they don't (binary outcome). The probability is a measure of uncertainty based on available information.

  3.  **Evaluate the Medical Decision Context:**
      *   **Thresholds:** Preventive meds (like tamoxifen/raloxifene) usually have a risk threshold for recommendation (e.g., 5-year risk > 1.67% or 10-year > 3-5% depending on guidelines). Both 14% and 22% are *very* high compared to average population risk (which is usually around 2-3% for 10 years).
      *   **Actionability:** Both numbers likely trigger the same clinical conversation about prevention, but the *magnitude* of benefit might feel different to the patient.
