          *   *Analysis:* This refers to "False Positive Rate Balance" or "Equalized Odds." This is a well-documented phenomenon in risk assessment (e.g., ProPublica's COMPAS analysis). If base rates differ, calibration and equalized odds are mathematically incompatible. Dana correctly identifies a real harm (unnecessary detention) that falls unevenly.
          *   *Winner:* **Dana**. She correctly identifies a distinct and valid fairness metric that conflicts with calibration.

      *   **Move 3: Marcus's Counter (Just Recalibrate).**
