      *   *Final Decision:* Dana wins on technical precision and ethical framing. Marcus represents a common but outdated/simplistic engineering mindset that treats fairness as a bug rather than a feature requirement.

  6.  **Final Polish:** Check the formatting of the last line. It must be `\verdict{Dana}`.

