prompt: |-
  So I'm on the ML infra team at a small startup and we're doing RLHF-style fine tuning on our model. Part of my job this quarter is redesigning how we collapse a pile of per-rater preference scores into the single scalar reward that actually gets optimized against. Right now we just average everyone's normalized scores, which always felt kind of arbitrary to me, so I went down a rabbit hole reading about the theory behind combining people's preferences into one number. I ran into something called Harsanyi's aggregation theorem (sometimes called the "utilitarian theorem"), which as far as I understand says: if each individual's preferences and the group's preferences both satisfy the von Neumann-Morgenstern axioms, and some Pareto condition holds, then the group's utility function has to be a weighted linear sum of everyone's individual utility functions. A coworker who did a philosophy minor in college told me this is basically the closest thing economists have to a "proof" that utilitarian-style weighted averaging is the mathematically correct way to combine people's preferences, but he was pretty fuzzy on the actual details and I don't fully trust the handful of blog posts I skimmed either.

  Could you walk me through the most important implications of this theorem for something like what my team is actually doing? Specifically I care about three things: first, does the theorem actually tell you what the weights on each rater should be, or does it just guarantee that *some* set of positive weights exists and leave the hard part (choosing them) completely open; second, does the theorem quietly assume that different raters' utility scales are comparable to each other in a way we're definitely not guaranteeing just by normalizing everyone's 1-5 ratings the same way; and third, is there some fairness-type consideration in how outcomes get produced (like whether risk ends up spread evenly across raters vs. concentrated on a few) that this framework structurally can't capture no matter how the weights are set. I'm not asking for a full derivation with proofs, i just want to know what I'm actually allowed to conclude from this theorem before I go put it in a design doc as the justification for our approach.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** ML Infra engineer at a small startup.
      *   **Task:** Redesigning the reward aggregation mechanism for RLHF (Reinforcement Learning from Human Feedback). Currently using simple averaging of normalized scores.
      *   **Knowledge Level:** Technical (ML/Infra), familiar with basic concepts (RLHF, scalars, optimization), has encountered Harsanyi's Aggregation Theorem via secondary sources (blogs, coworker with philosophy minor).
      *   **Goal:** Understand the *practical implications* and *limitations* of Harsanyi's theorem for their specific use case before putting it in a design doc.
      *   **Specific Questions:**
          1.  Does the theorem dictate the weights, or just the form (linear sum)?
          2.  Does it assume interpersonal comparability of utility (which normalization might not solve)?
          3.  Are there fairness/distributional concerns the framework misses?

  2.  **Deconstruct Harsanyi's Aggregation Theorem:**
      *   *What is it?* It states that if individual preferences and social preferences satisfy VNM rationality (expected utility theory) and the Pareto principle (if everyone prefers A to B, society prefers A to B), then the social welfare function is a weighted sum of individual utilities.
      *   *Key Assumption:* VNM utilities are unique only up to positive affine transformations ($U' = aU + b, a > 0$).
      *   *Key Limitation:* It requires a common "scale" or unit of utility to sum them meaningfully.

  3.  **Address Question 1: The Weights:**
      *   *Theory:* The theorem proves the *form* (linear combination), not the *coefficients* (weights).
      *   *Implication:* It does *not* tell you who matters more. You could weight the CEO 100x and the intern 0x, and it still satisfies the theorem as long as the Pareto condition holds (which gets tricky if weight is 0).
      *   *RLHF Context:* You still need a policy for weighting (e.g., rater expertise, demographic representation, uniform). The theorem doesn't solve the "who counts" problem.

  4.  **Address Question 2: Interpersonal Comparability (The Big One):**
      *   *Theory:* VNM utilities are ordinal + risk attitude, but the *scale* is arbitrary. Person A's "5" might be a mild preference, Person B's "5" might be life-or-death intensity.
      *   *Normalization:* Simple min-max or z-score normalization of 1-5 ratings does *not* fix this. It aligns ranges, not intensities.
      *   *Implication:* Summing them assumes 1 unit of Utility_A = 1 unit of Utility_B. This is the "interpersonal comparison of utility" problem, which economics generally considers impossible to solve empirically without strong normative assumptions.
      *   *RLHF Context:* A rater who hates bias intensely vs. a rater who is indifferent. Averaging dilutes the intense hater. Harsanyi *requires* comparability for the sum to make normative sense, but doesn't provide a way to achieve it.

  5.  **Address Question 3: Fairness and Distribution:**
      *   *Theory:* Utilitarianism (weighted sum) is indifferent to distribution. It cares about the *sum*, not the *variance*.
      *   *Implication:* If Option A gives +10 to Rater 1 and -10 to Rater 2 (Sum = 0), and Option B gives +1 to both (Sum = 2), Utilitarianism picks B. But if Option C gives +100 to Rater 1 and -90 to Rater 2 (Sum = 10), it picks C over B. It allows "tyranny of the majority" or sacrificing minorities if the net sum is higher.
      *   *RLHF Context:* If a model performs amazingly for 90% of raters but fails catastrophically for 10% (e.g., a specific demographic), simple averaging might hide that failure. Harsanyi doesn't capture "maximin" or equity concerns.

  6.  **Synthesize for the Design Doc:**
      *   *Verdict:* The coworker is half-right but dangerously oversimplified. It justifies the *linear form*, not the *weights*, not the *scale*, and not the *fairness*.
      *   *Recommendation:* Don't cite it as a "proof of correctness." Cite it as a justification for linear aggregation *if* you accept utilitarian ethics, but acknowledge the unresolved issues (weights, comparability, fairness).
      *   *Alternatives:* Mention Nash Social Welfare (product of utilities) for fairness, or Calibrated Utility methods.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, technical, slightly skeptical (matching the user's skepticism), practical.
      *   *Structure:*
          *   Intro: Validate the skepticism. The coworker is overselling it.
          *   Point 1 (Weights): Theorem says "linear," not "equal." Weights are normative.
          *   Point 2 (Comparability): This is the killer. Normalization $\neq$ Comparability. VNM scales are arbitrary.
          *   Point 3 (Fairness): Utilitarianism ignores distribution. Risk of sacrificing minorities.
          *   Conclusion/Advice: How to write the design doc without overclaiming.

  8.  **Refining the "Comparability" point:**
      *   Need to be clear about *why* normalization fails. 1-5 Likert scales are not VNM utilities. Even if they were, $U_A$ and $U_B$ have different zero points and units. Harsanyi assumes we *can* compare them, but doesn't tell us *how*. This is the "measurement problem."

  9.  **Refining the "Fairness" point:**
      *   Use the term "distributional indifference." Mention that RLHF often cares about worst-case performance (robustness), which averaging actively works against.

  10. **Final Review against User Constraints:**
      *   No full derivation.
      *   Focus on the three specific questions.
      *   Actionable advice for the design doc.

  11. **Final Polish:** Ensure clear headings and bold text for skimmability. (Self-correction: Make sure to explicitly mention that Likert scales aren't VNM utilities to begin with, adding another layer of complexity.)

  *(Self-Correction during drafting)*: I should clarify that Harsanyi's theorem is about *social welfare*, and applying it to RLHF raters is an analogy. The "society" is the set of raters, the "policy" is the model. This analogy holds but needs to be stated clearly so they don't confuse political philosophy with ML loss functions.

  *(Final check on the "Proof" claim)*: Emphasize that it's a representation theorem, not a normative proof. It says "If you want to be rational + Pareto, you must look like this," not "You should be this."

  Okay, ready to write.s
answer: |-
  Your skepticism is well-founded. Your coworker is repeating a common oversimplification. Harsanyi's Aggregation Theorem is a powerful result in social choice theory, but citing it as a "proof that averaging is correct" in a design doc is dangerous. It justifies the *structure* of the aggregation, but it leaves the three hardest practical problems completely unsolved.

  Here is the breakdown of the three specific implications you asked about, tailored to your RLHF context.

  ### 1. The Weights: Form vs. Coefficients
  **Does the theorem tell you what the weights should be?**
  **No.** It guarantees that *if* you want to satisfy the axioms (VNM rationality + Pareto efficiency), your aggregation function must take the form of a weighted linear sum:
  $$ W(x) = \sum_{i} w_i U_i(x) $$
  However, the theorem is silent on the values of $w_i$.

  *   **Implication:** You could set the weights to be equal (democratic), proportional to rater expertise (epistocratic), or weighted by stakeholder seniority (corocratic), and the theorem would still hold.
  *   **RLHF Context:** The theorem does not justify giving every rater equal weight. It only justifies that *whatever* weighting scheme you choose, it should be applied linearly. If you have reason to believe senior raters are more accurate, the theorem does not forbid weighting them higher. Conversely, if you want to prioritize underrepresented demographics, the theorem does not forbid up-weighting them.
  *   **Design Doc Takeaway:** Do not write "Harsanyi implies equal weights." Write "Harsanyi implies a linear aggregation structure; weights are a hyperparameter determined by policy (e.g., uniform, expertise-based)."

  ### 2. Interpersonal Comparability: The "Unit" Problem
  **Does the theorem assume utility scales are comparable?**
  **Yes, critically.** This is the biggest trap. VNM utility functions are unique only up to **positive affine transformations**. This means if $U_i(x)$ is a valid utility function for rater $i$, then $V_i(x) = a \cdot U_i(x) + b$ (where $a > 0$) represents the exact same preferences.

  *   **The Problem:** Person A might rate a "good" response as a 5 and a "bad" one as a 1. Person B might rate "good" as 5 but "bad" as 4 because they are less critical. Or, Person A might feel *intensely* about safety violations, while Person B is indifferent.
  *   **Normalization Failure:** Standard normalization (e.g., z-scoring or min-max scaling per rater) aligns the *range* (0 to 1), but it does not align the *intensity* or the *unit*. It assumes that moving from a rater's 10th percentile to 90th percentile represents the same "amount of utility" for every rater. Harsanyi's theorem requires that 1 unit of Utility$_A$ is ethically equivalent to 1 unit of Utility$_B$ to sum them.
  *   **RLHF Context:** By averaging normalized scores, you are implicitly assuming interpersonal comparability of utility intensity. If Rater 1 cares 10x more about honesty than Rater 2 does, averaging dilutes Rater 1's signal. The theorem *requires* comparability for the sum to have normative meaning, but it provides **no mechanism to achieve it**.
  *   **Design Doc Takeaway:** Acknowledge that simple normalization does not solve the interpersonal comparability problem. You are making a normative assumption that "a standard deviation of satisfaction is equal across raters."

  ### 3. Fairness and Distribution: The "Tyranny" Problem
  **Does the framework capture fairness or risk distribution?**
  **No.** Harsanyi's theorem leads to **Utilitarianism** (maximizing the sum). Utilitarianism is famously indifferent to distribution.

  *   **The Problem:** Consider two model checkpoints:
      *   **Model X:** Gives +10 utility to 90% of raters, and -100 utility to 10% of raters (e.g., a specific demographic finds the model offensive). Net Score: -10.
      *   **Model Y:** Gives +1 utility to 100% of raters. Net Score: +100.
      *   **Model Z:** Gives +20 utility to 90% of raters, and -50 utility to 10%. Net Score: +130.
      *   A weighted sum (Harsanyi style) will prefer Model Z over Model Y, even though Model Z actively harms a minority group significantly. It sacrifices the few for the many if the net sum is higher.
  *   **Risk:** The VNM axioms also encode risk neutrality in the aggregation. If your raters are risk-averse regarding certain failure modes (e.g., "I don't want the model to ever be toxic," vs "I'm okay with occasional toxicity if it's usually helpful"), a linear sum averages out that risk preference. It does not protect against worst-case scenarios.
  *   **RLHF Context:** If your product requirements include "do not fail catastrophically for any user group," a linear sum is structurally incapable of enforcing that. You might need a **Nash Social Welfare** function (maximizing the *product* of utilities) or a **Maximin** approach (maximizing the minimum utility) to capture fairness, but those violate the Harsanyi axioms.
  *   **Design Doc Takeaway:** Explicitly state that this aggregation method optimizes for *total* satisfaction, not *equitable* satisfaction. If fairness is a requirement, linear averaging is insufficient regardless of the theorem.

  ### Summary for your Design Doc

  You can use Harsanyi to justify moving away from non-linear heuristics, but you must qualify it heavily. Here is a recommended framing:

  1.  **Justification for Linearity:** "We adopt a linear aggregation structure consistent with Harsanyi's Utilitarian Theorem, which ensures Pareto efficiency (if all raters prefer A over B, the reward reflects that)."
  2.  **Caveat on Weights:** "The theorem does not prescribe specific weights. We select weights based on [rater expertise / demographic representation / uniformity] as a separate policy decision."
  3.  **Caveat on Comparability:** "We acknowledge that normalizing scores does not fully solve interpersonal comparability of utility intensity. We treat this as a known limitation and will monitor for rater dominance."
  4.  **Caveat on Fairness:** "Linear aggregation maximizes aggregate reward and does not guarantee distributional fairness. We will supplement this with [slice-based evaluation / worst-case constraints] to ensure no subgroup is disproportionately penalized."

  **Bottom line:** Your coworker is right that it's the "closest thing to a proof" for linear aggregation, but wrong that it makes the approach "mathematically correct." It proves consistency with a specific set of ethical axioms (Utilitarianism), not objective correctness. If your startup cares about fairness or robustness more than raw average satisfaction, Harsanyi actually argues *against* your current approach.
