answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. Two philosophers, Alex (defending Michael Bratman's individualist framework) and Jordan (defending Margaret Gilbert's plural-subject theory), are debriefing after a cognitive science seminar on joint action.*

  **Jordan:** Let's stick to the fence. It's the cleanest case. We agree to paint it together. We buy the paint. We divide the panels. Halfway through, I see a better offer—double pay to help a neighbor move. I drop my brush and leave. You're left with half a fence and a can of drying paint.

  **Alex:** And you feel aggrieved. Naturally.

  **Jordan:** "Aggrieved" is too weak. I haven't just disappointed you. I've *wronged* you. You have a standing to rebuke me that you wouldn't have if I'd simply failed to show up to a crowd where no agreement was made. My walking off violates a right you have over my actions.

  **Alex:** That's the Gilbertian leap, isn't it? You're positing a normative glue that doesn't exist in the materials. Look at the ontology. There is you, there is me. There are our individual mental states. When we say "we intend to paint the fence," Bratman shows us how to cash that out without invoking a mystical group mind. I intend that we paint. You intend that we paint. Our sub-plans mesh—I paint the left, you paint the right. We know the other knows this. We're mutually responsive.

  **Jordan:** That describes the *structure* of our coordination, Alex. It doesn't explain the *bindingness*. In your model, what stops me from leaving?

  **Alex:** Prudence, mostly. If I leave, I frustrate your intention. I damage our future ability to cooperate. I might violate a specific promise if we made one. But if I simply change my mind? If the moving job is sufficiently better, and I compensate you for the paint...

  **Jordan:** Compensation is irrelevant to the wrong! If I owe you money, I can pay you back and the debt is gone. If I violate a joint commitment, paying you for the paint doesn't undo the fact that I treated our "we" as if it were just my "I." In your reductionist web, I can unilaterally rescind my intention. I just change my mind. In my view, a joint commitment cannot be rescinded unilaterally. It requires *us* to dissolve it. By leaving, you acted as if you were the sole authority on a commitment that belongs to both of us.

  **Alex:** But where does this authority come from? If you say "we committed," I have to ask: what happened in the heads of the individuals? Did we exchange promises? Did we signal reliance? If I intend that we J, and you intend that we J, and I know you're counting on me, then yes, leaving is rude. It's irrational because it undermines my own plan, since my plan includes your participation. But to say I've violated a *sui generis* obligation? That sounds like you're trying to get moral blood from individualist stones.

  **Jordan:** I'm not trying to get it from individualist stones. I'm saying the stones form a new object. When we establish a joint commitment, we become a "plural subject." The obligation isn't derived from the sum of our individual expectations. It's constitutive of the joint activity itself. Think about the phenomenology. When Sebanz and Knoblich study people carrying a table through a doorway, they aren't just studying two predictive engines syncing up. They are studying agents who feel *answerable* to each other. If I drop my end of the table, I don't just cause a crash; I betray a role.

  **Alex:** Careful. Sebanz and Knoblich are cognitive scientists, not moral philosophers. They're looking at predictive coding, shared representations, motor resonance. They can explain how I anticipate your lift without needing your "plural subject." My brain simulates your action. If you drop out, my prediction error spikes. That's the "crash." You're adding a layer of normative metaphysics that the data doesn't require.

  **Jordan:** But the data *presupposes* it. Why do I simulate your action? Because I'm committed to acting with you. If I were just observing you, I might simulate you to predict where you'll go, but I wouldn't adjust my own motor output to mesh with yours unless I was committed to the joint goal. The cognitive mechanism runs on the normative track.

  **Alex:** That's a category error. The mechanism runs on *rationality*. I adjust my motor output because I have an intention that *we* carry the table. If I stop intending that, the adjustment stops. In the fence case, if I leave for the moving job, I've updated my intention. Yes, you're annoyed. You relied on me. Bratman can account for that annoyance through the norm of consistency and the norm of reliance. If I know you're relying on me, I have a reason not to leave. But it's a defeasible reason. If the moving job is important enough, the reason is overridden.

  **Jordan:** And there it is. For you, the commitment is always hostage to individual rationality. For me, the commitment *constrains* individual rationality. That's the difference between "I'm sorry I let you down" and "You had no right to leave." In your world, I *did* have the right. I just exercised it poorly. In my world, I didn't have the right at all.

  **Alex:** But who grants the right? If we are sovereign individuals, how do you bind me? It seems like you need a social contract just to paint a fence.

  **Jordan:** Not a contract. A commitment. It happens the moment we express readiness to be jointly committed. It's the difference between walking side-by-side by accident and walking side-by-side *together*. If we're just walking near each other, and I turn left, you're fine. If we're walking *together*, and I turn left without signaling, I've broken the step. The fence is the same. We didn't just happen to be painting. We entered a state of "we-ness."

  **Alex:** "We-ness." I worry that's a placeholder for "I know that you know that I know." Let's go back to the science. If I'm a neuroscientist scanning your brain while we paint, I'm looking for inter-brain synchrony. I'm looking for how your motor cortex anticipates my brush stroke. I don't see a "plural subject" in the fMRI. I see two individual brains coupling.

  **Jordan:** And if you don't see the normative layer, you're missing why the coupling happens. You can describe the gears of a clock without mentioning "time," but then you can't explain why the clock matters. The cognitive science of joint action describes the *how*. My theory explains the *why* we are accountable when the *how* breaks down. If Bratman is right, and it's just interlocking individual intentions, then when I leave the fence, I'm essentially saying, "My intention has changed." You should update your model. But you don't just update your model. You feel *betrayed*.

  **Alex:** I can explain betrayal without a plural subject. Betrayal is the violation of a specific expectation grounded in a history of reliance. If we paint fences every summer, I build a policy of intending to paint with you. When you break that, you damage my agency. You make it harder for me to plan. That's a harm.

  **Jordan:** It's a harm, yes. But is it a *wrong*? If I trip and knock over your paint can, that's a harm. If I kick it over, that's a wrong. Your theory struggles to distinguish the fence-leaver from the tripper. Both cause harm. Only the leaver violates an obligation.

  **Alex:** The leaver violates the obligation of *consistency*. Rational agents ought to be consistent over time. If I intend that we J, I ought to play my part. But—and here is the rub—that obligation is to *myself* as a rational agent, primarily. It only becomes an obligation to *you* because your plans are entangled with mine. It's derivative.

  **Jordan:** Derivative obligations are too weak. They dissolve when the entanglement becomes costly for me. That's why your theory can't capture the force of "We promised." When we form a joint commitment, I give you a piece of my agency. I can't take it back without your permission. That's why the fence case stings. It's not that you changed your mind. It's that you acted as if the commitment was yours alone to discard.

  **Alex:** But Jordan, if I'm trapped in a joint commitment I no longer endorse, haven't I lost my autonomy? If I can't leave the fence even when the moving job is vital, haven't I become a slave to the "plural subject"?

  **Jordan:** You haven't lost autonomy; you've exercised it to create a constraint. That's what commitment *is*. It's the rational pre-commitment to future action. If you could just opt out whenever it suited you, it wasn't a commitment. It was a guess.

  **Alex:** I think the cognitive scientists would side with me on the mechanism. Sebanz and Knoblich talk about "shared task representations." They don't say "merged souls." They say my brain represents your goal as a condition for my own success. If your goal changes, my representation updates. The "wrong" is a social story we tell afterward to enforce stability. It's a useful fiction.

  **Jordan:** A useful fiction that structures human sociality! You can call it a fiction if you want, Alex, but try telling it to the person holding the other end of the table when you let go. They won't care about your interlocking sub-plans. They'll care that you didn't hold up your end of the *we*.

  **Alex:** And I'll tell them I'm sorry, I had to go, and here's fifty bucks for the paint. And if they're rational, they'll take the money and acknowledge that my reasons were sufficient.

  **Jordan:** And if they're human, they'll say, "You shouldn't have left me." That "should" is the data point you're missing.

  **Alex:** Or it's the data point you're over-interpreting.

  **Jordan:** *Sips coffee.* Well, the seminar starts again in ten minutes. Shall we go together?

  **Alex:** I intend to go. Do you intend to go?

  **Jordan:** I'm committed to us going. There's a difference.

  **Alex:** *Stands up.* As long as your sub-plans mesh with mine regarding the door width, I think we'll be fine.

  **Jordan:** Just don't drop your end.

  **Alex:** No promises.

  **Jordan:** Exactly. That's the problem.
