          *   Because for Spinoza, history *reveals* the laws of human nature. If it hasn't happened, it likely contradicts the *conatus* of the species.
          *   The "argument from nature" in TP XI is an argument from the *laws of the affects*, not just brute strength.
      *   **Conclusion:** To save Spinozist democracy for women, one must decouple right from power (returning to a normative standard) or radically revise the theory of affects. It's not just updating the biology textbook.

