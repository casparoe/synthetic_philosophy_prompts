      *   *Key Mechanism:* The intersection of *conatus* (striving), *affect* (passion), and *potentia* (power). The male-female relationship is uniquely governed by lust (*libido*), which creates a specific form of domination that precludes the mutual recognition required for the democratic pact *under Spinoza's specific definitions*.

  4.  **Drafting the Argument - Section by Section:**

