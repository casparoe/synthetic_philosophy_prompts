answer: |-
  To argue that Spinoza's exclusion of women is a structural consequence of his metaphysics of right, rather than a contingent empirical error, we must locate the argument within the specific ontology of power (*potentia*) that undergirds both the *Theological-Political Treatise* (TTP) and the *Political Treatise* (TP). The standard defense of Spinoza—that he merely lacked modern sociological data regarding gender—presumes that his political theory rests on a normative conception of personhood (e.g., rational agency) to which women clearly qualify. However, Spinoza's naturalism explicitly rejects normative foundations for right. For Spinoza, *jus* (right) is coextensive with *potentia* (power).

  If we take this identification seriously, the exclusion of women in *TP* XI is not an anomaly; it is the logical output of a system where political standing is determined by the capacity to maintain independence against the affects of others. To include women within Spinozist democracy without altering the empirical premises requires a revision of the metaphysics of right itself. The following argument outlines why this is the case.

  ### 1. The Identity of Right and Power
  The foundational axiom of Spinoza's political theory is stated in *TTP* Ch. 16 and reiterated in *TP* Ch. 2: "The natural right of every individual is coextensive with his power." In the state of nature, there is no sin, no justice, and no injustice; there is only the striving (*conatus*) of each thing to persevere in its being. A fish has a natural right to eat a smaller fish because it has the power to do so.

  In most social contract theories (Hobbes, Locke, Kant), the transition to civil society involves a recognition of moral status or rational capacity that exists *prior* to the calculation of power. For Spinoza, there is no such pre-political moral status. Sovereignty is not established by a normative claim to rule, but by the actual capacity to command obedience. As he writes in *TP* Ch. 2, "The sovereign's right is defined by his power."

  Consequently, political inequality in Spinoza's system is not necessarily a violation of principle; it is a reflection of an asymmetry in *potentia*. If one group lacks the power to assert its will against another, it lacks the *right* to do so. Therefore, the question of women's citizenship is not "Are women rational?" (a question of moral status), but "Do women possess the *potentia* to hold sovereignty independently of men?" If the answer is no, then under Spinoza's definition, they have no *jus* to citizenship. To argue they *should* have citizenship despite lacking the *potentia* is to argue against Spinoza's definition of right.

  ### 2. The Affective Structure of Sexual Difference
  The crux of the matter lies in *why* Spinoza believes women lack this *potentia*. In *TP* XI, Spinoza does not argue primarily from brute physical strength (which would indeed be an empirical vulnerability). He argues from the psychology of the affects, specifically *libido* (lust).

  Spinoza posits that the relationship between men and women is uniquely governed by sexual passion. He observes that men are typically led by lust to desire women, and women are led by the need for protection or emotional bonding to submit to men. He writes: "For we have seen that... men and women cannot rule together without injury to both... [because] men and women are necessarily led by sexual passion."

  In Spinoza's psychology (*Ethics* Pt. 3 & 4), passions are states where we are acted upon by external causes; they diminish our *potentia agendi* (power of acting). Rationality increases power; passion decreases it. Because the male-female dynamic is structurally prone to this specific form of mutual passion (lust and dependence), it creates a relation of domination that precedes the political contract.

  Here is the structural trap: For a citizen to transfer their right to the democratic collective, they must possess that right independently to begin with. They must be *sui juris* (of their own right). But if the natural affective dynamic between men and women places women under the *potentia* of men (via lust and dependence), women enter the social contract already in a state of domestic subjection. They have no independent right to transfer because their *conatus* is already entangled with and subordinate to the *conatus* of their husbands.

  This is not an empirical claim that *could* be easily corrected by noting that some women are strong or rational. It is a claim about the *laws of the affects* governing the species. For Spinoza, the fact that "no nation has ever been governed jointly by men and women" (*TP* XI) is not merely historical data; it is evidence of a law of human nature. In a naturalist system, what *never* happens reveals what *cannot* happen given the constitution of human affects. To claim women *could* rule jointly is to claim that the laws of human affect (specifically regarding sexuality and reproduction) are different than Spinoza's metaphysics dictates.

  ### 3. The Impossibility of the Democratic Pact
  Spinoza defends democracy in the *TTP* as the most natural regime because it minimizes the alienation of freedom. Citizens obey the sovereign, but the sovereign is the collective body of which they are a part. This requires a relationship of relative equality among citizens so that no single private will dominates the others.

  However, Spinoza's exclusion of women reveals a limit to this "naturalness." If the household is a site of natural domination (men over women via passion), then the "collective body" of the democracy is not composed of atomic, equal individuals. It is composed of male heads of households who represent the *potentia* of their dependents.

  If one were to insist on including women in the Spinozist democracy while retaining his metaphysics, one would have to demonstrate that women possess the *potentia* to resist the affective domination of men. But Spinoza's system suggests that as long as reproduction and sexuality are governed by passion (which they are, for Spinoza, by definition of the bodily affects), this asymmetry is permanent.

  To make women equal citizens, one cannot simply update the biology. One must argue that the *jus* of the citizen is *not* coextensive with their immediate *potentia* to resist domination. One would need to argue that there is a normative right to participation that exists *even if* one's power is currently compromised by affective dependence. But this is precisely the move Spinoza's naturalism forbids. Spinoza rejects transcendental norms. Right is immanent to power. If the power is unequal, the right is unequal.

  ### 4. The Necessity of Metaphysical Revision
  Therefore, the "empirical mistake" defense fails because it treats Spinoza's claim as a prediction about capability rather than a definition of ontology.
  *   **The Empirical View:** Spinoza thought women were weaker. He was wrong. If he knew they were equal, he would include them.
  *   **The Structural View:** Spinoza defined Right as Power. He analyzed the specific power dynamics of sexual reproduction and affect. He concluded the power is asymmetrical. Therefore, the Right is asymmetrical.

  To hold the first view is to smuggle a Kantian or Lockean premise into Spinoza: that there is a "personhood" distinct from "power" that grounds rights. To hold the second view is to accept Spinoza's naturalism on its own terms.

  If you wish to preserve Spinoza's argument for democracy while extending it to women, you cannot merely correct his sociology. You must decouple *jus* from *potentia*. You must argue that political right is grounded in something other than the capacity to enforce one's will (e.g., a normative claim to equality, or a recognition of vulnerability). But doing so fundamentally alters the engine of Spinoza's political theory. It removes the hard-nosed realism that allows him to critique utopianism in *TP* Ch. 1. It reintroduces the very "abstract moralizing" Spinoza sought to purge from political science.

  ### Conclusion for the Dissertation
  The rigorous conclusion is that Spinoza's misogyny is not a blind spot; it is a feature of his illumination. His naturalism about right exposes the extent to which democratic equality relies on the suppression of certain natural asymmetries (like those of sexual reproduction and affective dependence) that his system refuses to ignore.

  To defend a Spinozist democracy that includes women, you must argue that Spinoza's metaphysics of right is insufficient for feminist ends. You must propose a revision where *potentia* is not the sole measure of *jus*. This might involve reinterpreting *potentia* not as domination or independence, but as *relational power* (a move some contemporary feminist Spinozists attempt), but this requires acknowledging that such a move shifts the metaphysical ground of the *Political Treatise*. You cannot have Spinoza's definition of natural right and universal gender equality simultaneously; the latter requires a normative constraint on the former that Spinoza's system explicitly rejects.

  Thus, the exclusion of women is the price of Spinoza's consistency. To include them is not to recover the "true" Spinoza, but to transcend him.
