      *   **Point 1: The Ontology of Right (Right = Power).**
          *   Explain TTP/TP definition. Right isn't normative; it's descriptive of capacity.
          *   Implication: Inequality in power *just is* inequality in right.
          *   Contrast with Social Contract theorists (Locke/Kant) where right is based on moral status/reason. For Spinoza, if you can't enforce it, you don't have the right.
      *   **Point 2: The Psychology of the Sexes (Affects and *Conatus*).**
          *   Focus on TP XI. It's not just "men are stronger." It's about *libido*.
          *   Men are dominated by lust for women; women are dominated by the need for protection/emotion.
          *   This creates a *private* sovereignty of men over women that precedes the *public* sovereignty.
          *   Crucial Spinozist point: Passions diminish power of acting (*potentia agendi*). If the relationship is defined by mutual passion (lust/dependence) rather than reason, they cannot form a free pact.
      *   **Point 3: The Structural Problem of the "Transfer" of Right.**
          *   Democracy requires transferring right to the collective *without* alienating it to a master.
          *   If women are already under the *potentia* of men (due to the affective dynamic), they have no independent right to transfer. They are already "subjects" in the household.
