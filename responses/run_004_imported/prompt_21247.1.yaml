      *   **Core Question:** Is the Problem of Divine Hiddenness distinct from the Problem of Evil, or is it just a restatement of it?
      *   **Specific Comparison:** Compare J.L. Schellenberg's Argument from Divine Hiddenness (ADH) with William Rowe's Evidential Argument from Evil (EAE).
