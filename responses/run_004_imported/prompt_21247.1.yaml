          *   Schellenberg's "Inculpable Non-belief" is the key. It's about cognitive state, not emotional state.
      *   *Verdict:* Hiddenness is independent. It rests on a premise about what love requires (openness), not what goodness requires (prevention of harm).

  5.  **Drafting Section 3: Assessing Theistic Replies:**
      *   *Skeptical Theism (ST):* "We can't know God's reasons."
