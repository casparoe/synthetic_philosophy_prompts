      *   I need to make sure the feedback explains the "Computability vs. Complexity" distinction clearly.
      *   I need to correct the "Grover's solves NP-complete" myth.
      *   I need to explain the "Extended Church-Turing Thesis" (ECTT), which *is* about efficiency, and note that QC *does* challenge the ECTT, but not the original CTT. This is a crucial nuance for the article.

