answer: |-
  **Setting:** *The lobby of a mid-tier hotel hosting the annual Pacific APA. It is noisy, smelling of stale coffee and carpet cleaner. Mara is staring at the espresso machine. Theo approaches from behind, carrying a battered conference bag.*

  **Theo:** Mara? I thought that was you. I haven't seen you since the dissertation defense.

  **Mara:** Theo. Hey. Yeah, it's been a while.

  **Theo:** You look… different. Calmer. In a way that makes me nervous. Did you finally finish the book?

  **Mara:** *[Turns, offering a thin smile]* Finished the draft. But the calmness isn't from completion. It's from a project. I'm trying to stop resenting people.

  **Theo:** *[Blinks]* You're trying to stop… resenting people? Like, as a New Year's resolution?

  **Mara:** Like a philosophical commitment. I've been reading Pereboom. And Galen Strawson. The Basic Argument is just too strong, Theo. We don't choose our choices. So, when my colleague stole my data last year… I'm trying to view him objectively. Like a force of nature. A storm that damaged my roof.

  **Theo:** *[Shakes his head, stepping closer]* That's not a commitment, Mara. That's self-alienation. You're trying to opt out of the participant stance. Strawson's whole point is that you can't actually do that without ceasing to be a human being in a community. Resentment isn't a bug; it's a feature of caring about how others regard you.

  **Mara:** But caring doesn't make the attitude *true*. I can care deeply about a lottery ticket, but that doesn't mean I deserve to win. I'm just trying to align my reactions with the metaphysical truth.

  **Theo:** But look at the distinction Strawson draws. We already make exceptions. We don't resent the toddler who hits us, or the person in the throes of schizophrenia. We adopt the objective attitude there because they are *exempt*. But your colleague? He's an ordinary adult. To treat him like a storm is to deny his agency. It's dehumanizing.

  **Mara:** Is it dehumanizing to acknowledge he is part of the causal chain? Or is it dehumanizing to hold him responsible for genes and environments he didn't pick? You say I can't opt out, but I'm doing it right now. I feel the heat, and I'm talking myself down.

  **Theo:** You're suppressing it. There's a difference. And here's the thing: if you succeed, if you actually view him purely objectively, you lose the relationship. You can't have friendship without the possibility of resentment. So the question isn't whether determinism is true. It's whether you're willing to pay the price of isolation for a metaphysical purity that changes nothing in practice.

  **Mara:** It changes the *blame*, Theo. That's the point. If I stop resenting, I stop punishing. I stop thinking he *deserves* suffering.

  **Theo:** But "desert" is internal to the practice! You're asking for a view from nowhere. You want to justify resentment from outside the human community. But the only standard of "fairness" we have is generated *by* these attitudes. If the community says, "Given the facts, resentment is appropriate," then it is fair.

  **Mara:** *[Leans against the wall, voice sharpening]* That's the move I'm struggling with. You're saying that because we are built to react this way, the reaction is justified. But showing we *cannot help* having an attitude never shows that anyone is a *fair target* of it.

  **Theo:** *[Pauses, processing]* You're saying the psychological inevitability doesn't entail normative justification.

  **Mara:** Exactly. Even if Strawson is right that we *must* feel resentment to have relationships, that's a fact about our psychology. It doesn't prove the colleague *merits* the resentment. It just proves we're wired to inflict pain on each other when norms are violated. A tiger can't help eating a gazelle, but that doesn't make the gazelle "guilty."

  **Theo:** Okay, but the tiger analogy fails because the gazelle isn't a moral agent. Your colleague is. And you're part of the community. If you say, "This attitude is inevitable but unjustified," you're creating a gap between how we must live and what is "true." But if we *must* live this way, what work is "true" doing there? If "fairness" is a concept that only has grip inside the practice, and you're standing outside judging the practice… aren't you just using a word that has lost its meaning?

  **Mara:** I'm using it to point out a tragedy. That we are wired to hold people responsible in a universe where responsibility makes no ultimate sense. I'm not saying the word "fair" is meaningless. I'm saying our application of it is systematically erroneous. Like believing the sun goes around the earth. It looks that way. It's natural to think that way. But it's false.

  **Theo:** But the sun analogy is about description. Responsibility is prescriptive. It's about how we *relate*. If you adopt the objective stance toward your friends, you aren't seeing "the truth" more clearly. You're seeing *less*. You're missing the demand they make on you. You're treating them as objects, and in doing so, you make yourself an object.

  **Mara:** I'd rather be an object that sees clearly than a subject living in an illusion of desert. But here's my worry, Theo, and I need you to answer this: If you admit that we can't help but resent, but you also admit that determinism is true… aren't you just admitting that our moral practices are based on a necessary fiction?

  **Theo:** *[Takes a sip of his coffee, stalling]* I wouldn't call it a fiction. I'd call it a framework. Look, if I say, "Checkmate," that move is only valid inside the rules of chess. Does that make checkmate a fiction?

  **Mara:** No, but if I ask, "Why is the knight allowed to jump?" and you say, "Because those are the rules," that's fine for a game. But blame hurts people. It ruins lives. If the justification for ruining a life is "because our rules say so," and the rules themselves are contingent on a psychology we didn't choose… the normativity feels thin. It feels like might makes right. The strong feelings of the community make right.

  **Theo:** So you want a justification for blame that doesn't appeal to our nature or our community? Where would that come from?

  **Mara:** I don't know. Maybe there isn't one. Maybe that's the hard incompatibilist conclusion. Not that we should stop blaming—we can't—but that we should do it with guilt. With the acknowledgment that we are inflicting harm without ultimate justification.

  **Theo:** *[Frowns]* That sounds miserable. And honestly, disingenuous. If you truly believed there was no justification, you couldn't blame. You'd be paralyzed. The fact that you're still arguing with me, still feeling the sting of your colleague's betrayal, shows you haven't actually bought your own ticket to the objective stance.

  **Mara:** I said I'm *trying*, Theo. I didn't say I succeeded. The pull is immense. But the intellectual conviction is there. And if I'm right, then your Strawsonian comfort is just a cozy blanket over a void.

  **Theo:** And if I'm right, your "void" is a theoretical construct that dissolves the moment you actually love someone. Because when you love them, you won't be able to maintain that objective distance. And you'll realize the justification was in the love all along, not in the metaphysics.

  **Mara:** *[Looks at the espresso machine, which has finally finished her drink]* But if the love is determined too, Theo… then the justification is just another link in the chain.

  **Theo:** Then it's the only chain we have.

  **Mara:** *[Takes the coffee]* Maybe. Or maybe it's just a cage we decorate and call a home.

  **Theo:** *[Shoulders his bag]* Well. If you find a way out of the cage without leaving your humanity behind, let me know. I've got a panel on reactive attitudes in twenty minutes.

  **Mara:** I'll try to make it. I'll try to resent you if you're boring.

  **Theo:** *[Smiles, but it doesn't reach his eyes]* I'm counting on it.

  *[They stand for a moment in the noise of the lobby, neither moving to hug nor to walk away, before Mara turns toward the conference room and Theo heads for the exit.]*
