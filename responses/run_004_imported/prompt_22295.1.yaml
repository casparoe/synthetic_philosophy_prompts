answer: |-
  This is an excellent set of questions. You have identified the precise mechanical gears of Hume's argument that often get glossed over in summaries. The passage you quoted is Hume attempting to create a "calculus of belief," and your confusion stems from the fact that Hume is shifting between a strict definition of terms and a hypothetical scenario to test those terms.

  Here is a breakdown of the three specific sticking points you raised, based strictly on the logic of Section X, Part I.

  ### 1. The Subtraction Metaphor: What is being tallied?

  You are right to be suspicious of the "scale." Hume is not asking you to literally count the number of times dead men have stayed dead versus the number of times witnesses have lied. Those are indeed incommensurate categories.

  When Hume speaks of "numbers" and "deducting the smaller from the greater," he is translating **events** into **degrees of assurance**.

  *   **Tally A (The Law of Nature):** This is the sum total of your experience that the natural law holds (e.g., "dead men remain dead"). Because this experience is uniform (you have never seen an exception), it generates a maximum degree of assurance in your mind. Let's call this **100 units of assurance against the miracle.**
  *   **Tally B (The Testimony):** This is the sum total of your experience regarding the reliability of human testimony. You have experience that witnesses are usually honest, but also experience that they sometimes lie, err, or are deceived. This generates a degree of assurance *for* the miracle. Let's say, for the sake of the example, this generates **80 units of assurance for the miracle.**

  **What is subtracted from what?**
  Hume is arguing that these two assurances cannot coexist. You cannot be 100% sure dead men stay dead and simultaneously 80% sure this dead man rose. The mind must resolve the contradiction.

  Hume's model is that the evidence *against* the miracle (Tally A) and the evidence *for* the miracle (Tally B) clash. The "subtraction" is the psychological process of resolving that clash.
  *   100 units (Against) − 80 units (For) = **20 units of assurance remaining *against* the miracle.**

  The "common scale" is **probability** (or what Hume calls "assurance"). He is converting the *frequency* of past events into a *force* of present belief. The "smaller number" is the weaker degree of assurance, and it is subtracted from the stronger degree of assurance. The result is the net belief that remains.

  ### 2. "Proof Against Proof": Is this a contradiction?

  This is the most technically difficult part of the passage, and your intuition that it conflicts with his earlier definition is sharp.

  Earlier, Hume defines a "proof" as an argument from experience that is **uniform** (has no exceptions). By that strict definition, a proof should be absolute. If I have a proof that $2+2=4$, and you have a proof that $2+2=5$, one of us is not actually offering a proof; one of us is mistaken.

  So, how can there be "proof against proof"?

  Hume is employing a **hypothetical concession**. Notice the phrasing: *"suppose also, that the testimony considered apart and in itself, amounts to an entire proof."*

  He knows that in reality, testimony is *never* perfectly uniform (people lie, mistakes happen). However, he wants to show that **even if** we granted the most favorable possible scenario for the believer—even if we pretended the testimony was as flawless as the law of nature—it still wouldn't work.

  *   **Strict Definition:** A proof is uniform experience.
  *   **The Hypothetical:** Let's *pretend* the testimony is uniform experience (a proof).
  *   **The Conflict:** Now we have two "uniform experiences" contradicting each other. (1) Uniform experience that nature is stable. (2) Uniform experience that this witness tells the truth.

  When Hume says one proof suffers a "diminution of its force," he is describing the psychological impact of the contradiction. Even if Side A is technically the "stronger" proof, the mere existence of a competing "proof" (Side B) introduces doubt. Certainty requires the absence of opposing evidence. If there is *any* substantial evidence on the other side (even a hypothetical "proof"), the mind cannot rest in absolute certainty.

  So, it is not a contradiction in terms, but a **reductio ad absurdum**. He is saying: "Even if we treat testimony as a 'proof' (which it isn't), it would clash with the 'proof' of natural law, and the result would still be a reduction in certainty."

  ### 3. "Mutual Destruction": What survives the battle?

  You asked: *Does he mean both sides lose force and only a discounted remainder survives on the winning side, or that the losing side is wiped out entirely while the winner is left standing at full strength?*

  The text is explicit on this: **The winner survives with diminished force.**

  Hume writes: *"the superior can only operate on the mind by the force, which remains."*

  Think of it like two armies colliding.
  *   Army A (Natural Law) has 1,000 soldiers.
  *   Army B (Testimony) has 800 soldiers.
  *   They fight. Army A wins.
  *   But Army A does not walk away with 1,000 soldiers. They walk away with 200.

  In terms of belief:
  *   My belief that "gravity works" is usually at 100% strength.
  *   If a highly credible witness tells me they saw a man float, that testimony attacks my belief in gravity.
  *   Even if I decide the witness is wrong (Gravity wins), my belief in gravity is no longer at 100%. It has been shaken. It is now at 90% (or whatever the remainder is).

  This is what Hume means by "mutual destruction." The losing belief (that the miracle happened) is destroyed *as a belief*, but its *force* is used to damage the winning belief. The "authority" of the witnesses is destroyed (we decide not to believe them), but their "authority" was strong enough to dent the "authority" of our experience of natural law.

  ### Summary of the Mechanism

  To tie this back to the famous maxim you already understand:

  1.  **The Scale:** We convert past experiences into "units of assurance."
  2.  **The Proof:** We hypothetically grant that testimony *could* be a "proof" (uniform reliability), putting it on the same level as natural law.
  3.  **The Destruction:** When they clash, they cancel each other out unit-for-unit.
  4.  **The Result:** Because our experience of natural law is *actually* more uniform (more units) than our experience of testimony (fewer units), the "proof against the miracle" is always the superior number.
  5.  **The Maxim:** Therefore, for the miracle side to win (to leave a positive remainder *for* the miracle), the testimony would need to be so overwhelmingly strong that its "falsehood" would be an even bigger violation of experience than the miracle itself.

  Hume is essentially arguing that the "subtraction" will *always* result in a remainder against the miracle, because the "number" of uniform experiences supporting natural law is effectively infinite, whereas the "number" of experiences supporting perfect testimony is always finite and flawed. The "mutual destruction" ensures that even if you trust the witness, you must discount your certainty, and that discount is always enough to keep the miracle from reaching the threshold of belief.
