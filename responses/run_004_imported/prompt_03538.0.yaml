prompt: |-
  ok so in my IB philosophy class we've been doing an existentialism unit and today's discussion kind of turned into an argument. we read the bad faith section from Being and Nothingness (the waiter bit) plus some of Existentialism is a Humanism, and my friend Jake was arguing that since Sartre says existence precedes essence and there's no human nature to fall back on, we're basically "condemned to be free" -- which means stuff like facticity (being poor, disabled, whatever circumstances you were born into) doesn't actually limit you in any real way. like if someone doesn't "make it" despite their situation, thats really just them being in bad faith, using their circumstances as an excuse instead of owning their freedom to choose otherwise.

  i kind of went along with it in the moment bc it does sound like it follows from the whole radical freedom thing, but it's been bugging me since, bc Sartre was also super into marxism and anti-colonialism and stuff, and this reading feels like a weirdly convenient way to blame poor or disabled people for their own situation instead of blaming actual systemic stuff. so did me and jake just badly misread the bad faith/facticity thing, or is that seriously a real implication of his whole radical freedom argument? kinda need an actual answer before our socratic seminar on friday lol
