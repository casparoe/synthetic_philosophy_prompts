      *   *Verdict:* It's a pragmatic distinction, not a strictly logical one. It anticipates modern distinctions between *accuracy* and *utility*, or *fact* and *narrative*. It holds up if we accept that human happiness is a legitimate end that sometimes requires buffering raw reality. It fails if "error is always harmful" is taken as an absolute logical law.

