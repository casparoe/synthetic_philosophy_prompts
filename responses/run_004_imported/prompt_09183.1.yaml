answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee, Board of Directors
  **FROM:** [Your Name], Small Grants Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Allocation Recommendation: FY2024 Uncommitted Funds ($1.4M)

  **Recommendation**
  I recommend we allocate **$1,000,000 to the bednet-distribution charity** and **$400,000 to the corporate cage-free campaign**.

  This allocation is not derived from a claim that we have solved the mathematical problem of converting DALYs to suffering-years. Rather, it is an explicit acknowledgment that we cannot solve it. This memo outlines why a precise exchange rate is philosophically indefensible, why a 50/50 split is not a neutral alternative, and why a weighted portfolio best reflects our committee's moral uncertainty.

  **The Philosophical Impasse**
  The current deadlock stems from the Lionel Robbins objection: utility is ordinal, not cardinal. We can rank preferences within a subject, but we cannot objectively measure the intensity of preference *between* subjects (or species). When we compare a human DALY to a hen's suffering-year, we are not performing arithmetic; we are making a normative claim about the moral weight of a hen relative to a human. There is no empirical "true" exchange rate. The faction arguing that such comparisons are "value judgments wearing the costume of arithmetic" is technically correct. To claim otherwise is to smuggle in contested moral premises under the guise of cost-effectiveness analysis.

  However, the counter-argument is equally robust: inaction is not value-neutral. A 50/50 split is often proposed as a humble default when comparisons are impossible. But as the opposing faction noted, a 50/50 split implicitly asserts that the *marginal moral value* of the next dollar spent on bednets is identical to the next dollar spent on cage-free campaigns. Given the vast difference in cost-per-outcome metrics reported by the applicants, asserting equality of marginal impact is itself a massive, undefended value judgment. It privileges the *number* of interventions over the *weight* of the outcomes. There is no "comparison-free" option; there are only explicit comparisons and hidden ones.

  **The Framework: Moral Uncertainty, Not Moral Fact**
  Since we must allocate the funds, we should not pretend to know the moral truth. Instead, we should act under **moral uncertainty**. We should treat our allocation as a portfolio designed to hedge against the risk that our prevailing moral intuitions are wrong.

  1.  **The Human Welfare Prior:** We have higher epistemic confidence in the value of human welfare. Across nearly all plausible moral frameworks (secular, religious, utilitarian, deontological), averting human death and disease is a robust good. The bednet intervention is "morally robust."
  2.  **The Animal Welfare Hedge:** We possess non-zero credence in moral frameworks where sentient non-human animals hold significant moral weight. If the "moral weight" of a hen is even a fraction of a human's, the sheer scale of factory farming suggests the cage-free campaign could outperform the bednet charity in expected value. However, this relies on more contested premises regarding consciousness and moral status.

  **Rationale for the 71/29 Split**
  A 100% allocation to bednets would imply 100% confidence that animal suffering is morally negligible. A 50/50 split would imply we view the marginal utility of both interventions as equal, despite the metric disparities.

  The proposed **$1,000,000 / $400,000** split reflects a credence-weighted approach:
  *   **$1,000,000 (Bednets):** This majority share acknowledges that human welfare is the "safer bet." It respects the intuition that we have stronger obligations to conspecifics and higher confidence in the metrics surrounding human health. It satisfies the requirement to fund high-certainty interventions.
  *   **$400,000 (Cage-Free):** This substantial minority share acknowledges the possibility that our historical exclusion of animal suffering is a moral blind spot akin to past exclusions of certain human groups. It purchases "moral optionality." If the moral weight of hens is high, this $400k does disproportionate good. If it is low, we have still saved human lives with the majority of the fund.

  **Conclusion**
  We cannot measure the utility of a hen against a human. We can only decide how much risk we are willing to take that the hen matters less than we fear, or more than we hope.

  This allocation rejects the pretense of objective commensurability. It admits that the exchange rate is a value judgment. But it refuses to let the impossibility of perfect arithmetic paralyze our capacity to do good. By weighting the allocation rather than splitting it evenly or choosing a winner-take-all approach, we explicitly encode our uncertainty into the budget. We are not measuring utility; we are managing moral risk.

  I request the committee vote to approve this specific allocation.
