  6.  **Self-Correction/Nuance Check:**
      *   *Did Hume say miracles are impossible?* In Part 1, he argues from evidence. In Part 2, he gives practical reasons why testimony is always flawed. Some interpreters (like John Earman) argue Hume *does* slip into saying they are impossible by definition. I should acknowledge this tension but emphasize the standard epistemological reading.
      *   *Swinburne's specific argument:* He uses "C-inductive" and "P-inductive" arguments. Maybe too technical? Keep it to "cumulative probability."
