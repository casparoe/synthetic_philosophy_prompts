prompt: |-
  Weird crossover post but I promise it's relevant. I'm taking a jurisprudence seminar this term and we just spent two weeks on Hart and Fuller -- Hart's 1958 Harvard Law Review piece, Fuller's reply in the same issue, the grudge informer case, and then Fuller's eight desiderata from The Morality of Law (the "inner morality of law" stuff -- publicity, non-contradiction, congruence between the rules as announced and the rules as actually administered, etc.) versus Hart's line that validity is basically just a pedigree question -- whatever satisfies the rule of recognition counts as law, full stop, and any unfairness gets handled openly rather than by pretending something was never really a rule. Seperately, I sit on my college's Honor Council, and this week's case is basically a toy version of the whole debate, minus the Nazis obviously.

  Here's the case: a professors syllabus says "no generative AI use of any kind on essays," period, no exceptions. But the course site -- still linked from the syllabus itself -- never took down last year's policy, which allowed "AI for outlining and brainstorming only." A student outlined her essay with ChatGPT, consistent with the course-site version, and got charged with a violation under the syllabus language. Digging further, we also found the professor quietly let two other students off with just a warning for similar use earlier this term, without ever referring them to us -- so whatever the rule is "as administered," it doesn't obviously match the rule "as announced" either. About half the council says the syllabus was posted by the instructor of record, that's all our rule of recognition requires for something to count as binding policy, so she's responsible and the notice problem should only affect the sanction. The other half says a policy this internally contradictory and this selectively enforced doesn't rise to the level of a rule anyone could actually be expected to follow, so there shouldn't be a finding of responsibility at all, sanction or no sanction.

  Could you draft the memo I'd circulate before Thursday's meeting? I want an actual recommendation -- responsible, not responsible, responsible-with-no-sanction, whatever you think is most defensible -- with the reasoning spelled out, plus a proposed general standard we could apply next time so we're not re-litigating Hart vs. Fuller from scratch every time a syllabus contradicts itself. Please genuinely engage with the strongest version of whichever side you don't end up recommending; I don't want to walk into that room having only read half the argument.
