prompt: |-
  I'm on the incident-review board at the software company I work for, and we just finished writing up a nasty one: a multi-hour outage that kicked off when an on-call engineer got paged about weird traffic at 2am and snoozed the alert for 45 minutes, because that particular alert had cried wolf all week. Except once you actually dig into it, that's not the only place things could've gone differently -- a seperate team had a ticket open for three months flagging that the service in question had no rate limiting, and it just never got prioritized; the reason it never got prioritized is that the roadmap review last quarter explicitly deprioritized "hardening" work in favor of a launch deadline; and the reason the on-call engineer was covering three services solo that night instead of splitting the load is a hiring freeze from earlier this year. For literally every one of those, it's true that if that person or team had done the thing they didn't do, the outage probably doesn't happen, or is a lot smaller -- so by a plain "but for this, it wouldn't have happened" test, they're all causes.

  The postmortem doc is supposed to name actual root causes / contributing factors, not just list everyone who touched the situation, so it can drive real follow-up work -- and the board is stuck on where to stop. Some people want to stop at the on-call engineer's snooze since that's the proximate thing; others think that's just scapegoating someone for decisions made way above their pay grade, and want the roadmap call, or even the hiring freeze, named as the real root cause -- but then someone reasonably points out that if we're willing to go back that far, why stop there and not blame whoever approved the budget behind the freeze, and so on forever. My partner, who's a lawyer, says this is basically the same fight they have over proximate cause, which did not make me feel better. A couple of us are also uneasy that wherever we end up drawing the line is going to suspiciously match whoever we already felt comfortable holding responsible before we started, which makes me wonder whether we're tracking causes at all at that point, versus just dressing up our blame calls in causal-sounding language after the fact.

  Could you draft the actual memo I'd bring to the board before we meet again next week -- one that proposes a real method for sorting which of these omissions count as causes for the writeup versus mere background conditions, applies it to say something concrete about this specific incident, and directly answers that last worry instead of dodging it. We run these reviews often enough that I want an actual method out of this, not just a one-off verdict we'll forget about by the next incident.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Incident Review Board Member.
      *   **Audience:** The Incident Review Board (technical leads, managers, possibly execs).
      *   **Task:** Draft a memo proposing a method for distinguishing "causes/contributing factors" from "background conditions" in postmortems.
      *   **Context:** A specific multi-hour outage involving alert fatigue (snoozing), known technical debt (no rate limiting), roadmap prioritization (launch vs. hardening), and resourcing (hiring freeze).
      *   **Key Problems to Solve:**
          *   Where to stop the causal chain (proximate cause vs. root cause vs. infinite regress).
          *   Avoiding scapegoating the on-call engineer.
          *   Avoiding infinite regress (blaming the budget approver/CEO).
          *   Addressing the bias worry (are we just dressing up blame?).
          *   Creating a reusable *method*, not just a one-off verdict.
      *   **Tone:** Professional, analytical, constructive, empathetic, systemic.
      *   **Constraint:** Must directly answer the worry about bias/blame.

  2.  **Deconstruct the Causal Chain:**
      *   *Event:* Outage.
      *   *Trigger:* Traffic spike.
      *   *Immediate Action:* On-call snoozed alert (Alert Fatigue).
      *   *Pre-existing Condition 1:* No rate limiting (Known Ticket, 3 months).
      *   *Decision 1:* Roadmap prioritized launch over hardening.
      *   *Pre-existing Condition 2:* On-call solo covering 3 services.
      *   *Decision 2:* Hiring freeze.
      *   *Decision 3:* Budget approval for freeze.

  3.  **Evaluate Existing Frameworks:**
      *   *5 Whys:* Good, but can lead to infinite regress or oversimplification.
      *   *Swiss Cheese Model:* Good for visualizing layers of defense, but doesn't strictly solve the "where to stop" problem for *actionable* items.
      *   *AcciMap:* Too complex for most software orgs.
      *   *Control/Influence Test:* A strong candidate. Can we actually change this?
      *   *Actionability Test:* Does identifying this lead to a specific, assignable fix?

  4.  **Develop the Proposed Method:**
      *   I need a framework that filters the infinite chain into *actionable* causes.
      *   *Criterion 1: Actionability.* Can we actually fix this within a reasonable timeframe/scope? (Rules out "Budget/CEO" usually, unless the board *is* the CEO).
      *   *Criterion 2: Leverage.* Does fixing this prevent *this* class of incidents, not just this specific one?
      *   *Criterion 3: Proximity vs. System.* We need to acknowledge the human error (snooze) but treat it as a *symptom* of a system failure (alert fatigue), not the cause.
      *   *Criterion 4: The "Stop Rule".* Stop when the cost of mitigation exceeds the risk, OR when the decision point is outside the sphere of influence of the remediation owners.

      *Refining the Method:* Let's call it the "Actionable Systemic Control" (ASC) framework or something similar. Actually, let's keep it simpler. Let's adapt the "Circle of Control/Influence" concept combined with "Remediation Viability."
      *   *Test:* Is it actionable? Is it systemic? Is it within our remit?
      *   *Bias Check:* We need a specific step to challenge our own assumptions.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Subject:** Clear and purposeful.
      *   **Opening:** Acknowledge the stalemate and the importance of the decision. Validate the "infinite regress" concern.
      *   **The Core Problem:** Define the difference between a *condition* (state of the world) and a *cause* (something we can change to alter the outcome).
      *   **The Proposed Framework:**
          1.  *Actionability:* Can we write a ticket for this?
          2.  *Leverage:* Does it prevent a class of errors?
          3.  *The "Blameless" Filter:* Human error is a symptom, not a cause.
          4.  *The Horizon Limit:* Stop at the boundary of our authority/budget cycle (but document the constraint).
      *   **Applying to the Incident:**
          *   *On-Call Snooze:* Not a cause. Symptom of alert fatigue.
          *   *No Rate Limiting:* Cause. Actionable (add limiting).
          *   *Roadmap Priority:* Contributing Factor. Actionable (change review process to include risk assessment).
          *   *Hiring Freeze:* Background Condition (mostly). *Correction:* If we can't hire, can we redistribute load? That's actionable. So the *cause* is "Uneven On-Call Load," the *constraint* is "Hiring Freeze."
          *   *Budget/CEO:* Background. Document as a risk, but not a postmortem action item.
      *   **Addressing the Bias Worry:** This is crucial. How do we prove we aren't just picking targets?
          *   *Mechanism:* Pre-mortem criteria (set rules *before* analyzing specific people).
          *   *Mechanism:* "Steel-manning" the defense (ask: if we blame this, what is the fix? If no fix, it's blame).
          *   *Mechanism:* Retrospective on the Postmortem (review the review).
      *   **Recommendation:** Adopt this framework for all future incidents.

  6.  **Refining the Tone:**
      *   Avoid academic jargon where possible.
      *   Be firm but collaborative.
      *   Ensure the distinction between "Root Cause" (often a myth) and "Contributing Factors" is clear.
      *   Make sure the "Bias" section feels honest, not defensive.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is distinguishing "Hiring Freeze" as background too easy?
      *   *Fix:* Acknowledge it as a *constraint* that elevated risk. The actionable item isn't "Unfreeze Hiring" (might be impossible), it's "Mitigate Risk of Understaffing" (e.g., auto-deploy shields, reduce on-call scope).
      *   *Critique:* Is the bias section strong enough?
      *   *Fix:* Add a specific "Bias Check" step to the workflow. Ask: "Would we write this if the person involved was the VP?"
      *   *Critique:* The lawyer partner mentioned "proximate cause."
      *   *Fix:* Acknowledge that legal concept but distinguish engineering postmortems (learning) from legal inquiries (liability).

  8.  **Final Polish:** Check formatting, clarity, and ensure all constraints of the prompt are met. (Method proposed? Applied to incident? Bias addressed? Reusable?)

      *(Self-Correction on the Bias Section)*: The prompt asks to "directly answers that last worry instead of dodging it." I need to be very explicit that *any* line-drawing is subjective, but we can make it *less* subjective by focusing on *future utility* rather than *past fault*. The metric is "Does this help us next time?" not "Who messed up?"

  9.  **Final Output Generation** (Proceeding to draft based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Incident Review Board
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Causal Analysis Framework & Application to Incident #492

  ### 1. Executive Summary

  The board is currently stalled on Incident #492 (the 2am traffic outage) due to a fundamental disagreement on where to draw the line on causality. We are oscillating between blaming the individual (the on-call engineer) and blaming the system (roadmap/budget), with no agreed-upon method to distinguish between the two.

  This memo proposes a standardized **Actionable Systemic Control (ASC)** framework for future postmortems. This method filters potential causes based on *remediation viability* rather than *temporal proximity*. It is designed to prevent both scapegoating and infinite regress.

  Below, I outline the framework, apply it to Incident #492 to demonstrate its utility, and directly address the concern that our line-drawing may simply be bias in disguise.

  ### 2. The Problem: Conditions vs. Causes

  In complex systems, everything is a cause. If the server had been unplugged, the outage wouldn't have happened. If the company didn't exist, the outage wouldn't have happened. As noted in our discussion, the "but-for" test is necessary but insufficient for engineering postmortems.

  We need to distinguish between **Background Conditions** (states of the world we accept as constraints for now) and **Contributing Causes** (specific failures of control we can alter to reduce future risk).

  **The Proposal:** We adopt the **Actionable Systemic Control (ASC)** test. A factor is listed as a *Contributing Cause* in a postmortem only if it meets all three criteria:

  1.  **Actionability:** Can we define a specific, assignable remediation step (ticket, policy change, config update) within the next quarter?
  2.  **Leverage:** Does fixing this mitigate a *class* of incidents, not just this specific instance?
  3.  **Control:** Is the remediation within the sphere of influence of the teams represented on this board?

  If a factor fails the Actionability test, it is a **Background Constraint**. It must be documented as risk, but not treated as a root cause requiring a postmortem action item.

  ### 3. Application to Incident #492

  Applying the ASC test to the chain of events in the recent outage yields the following classification:

  | Factor | ASC Test Result | Classification | Rationale |
  | :--- | :--- | :--- | :--- |
  | **On-Call Snooze** | Fails Actionability/Control | **Symptom** | We cannot "action" a human reaction to fatigue. Training someone to not be tired is not a viable ticket. This is a symptom of Alert Fatigue. |
  | **Alert Fatigue** | Passes All | **Contributing Cause** | We can tune thresholds, aggregate alerts, or implement auto-remediation. This prevents future snoozing on critical alerts. |
  | **No Rate Limiting** | Passes All | **Contributing Cause** | We can implement rate limiting. This protects against traffic spikes regardless of on-call response time. |
  | **Roadmap Priority (Launch > Hardening)** | Passes Actionability | **Systemic Factor** | We cannot change the past decision, but we *can* action a change to the Roadmap Review process to require risk sign-off on "hardening" deferrals. |
  | **On-Call Load (1 person, 3 services)** | Passes Actionability | **Contributing Cause** | We cannot instantly hire (see below), but we *can* action a reduction in on-call scope or implement "follow-the-sun" handoffs. |
  | **Hiring Freeze** | Fails Control | **Background Constraint** | This board cannot lift a company-wide hiring freeze. Listing this as a "cause" implies a fix we cannot execute. |
  | **Budget Approval** | Fails Control | **Background Constraint** | Outside our sphere of influence. |

  **The Verdict:**
  The postmortem should cite **Alert Fatigue**, **Missing Rate Limiting**, and **On-Call Scope** as the primary contributing causes.
  *   **The Fix:** Tune alerts, implement rate limiting, and redistribute on-call load.
  *   **The Note:** The document must explicitly state that the *risk* of these issues was elevated by the Hiring Freeze and Roadmap decisions, but those are recorded as **Organizational Risks** to be escalated to Leadership, not as postmortem action items for engineering teams.

  ### 4. Addressing the Bias Concern

  A valid concern was raised: *"Wherever we end up drawing the line is going to suspiciously match whoever we already felt comfortable holding responsible."*

  If we simply vote on causes, we will inevitably succumb to confirmation bias. We will blame the engineer if we distrust ops, or blame management if we resent leadership. To mitigate this, the ASC framework includes a **Bias Check Protocol** to be run *before* finalizing any postmortem:

  1.  **The "VP Swap" Test:** If the person who made the decision (e.g., the roadmap priority call) was a VP, would we still list it as a cause?
      *   *If Yes:* Then it is a process failure.
      *   *If No:* Then we are protecting status, not finding causes.
      *   *Application:* In #492, if a VP deprioritized hardening, we still list the *process* that allowed unchecked risk accumulation as a cause. We do not blame the VP, but we do flag the decision gate as broken.

  2.  **The "No Blame" Rule:** No action item can be assigned to a specific individual (e.g., "John will be more careful"). Action items must be assigned to a *system* (e.g., "The alerting system will suppress non-critical warnings").
      *   *Why this works:* It forces us to find systemic causes. You cannot write a ticket for "Human Error." You must write a ticket for "Add Guardrail."

  3.  **The "Utility" Metric:** For every proposed cause, we must ask: *"If we fix this, does it make an outage less likely next time?"*
      *   If the answer is "No, but it punishes the person," it is blame, not cause.
      *   If the answer is "No, because we can't afford it," it is a constraint, not a cause.

  ### 5. Recommendation

  1.  **Adopt the ASC Framework:** Formalize the three criteria (Actionability, Leverage, Control) as the standard for all future incident reviews.
  2.  **Reclassify Incident #492:** Update the draft postmortem to move "On-Call Snooze" from *Cause* to *Timeline Event*, and elevate "Alert Configuration" and "Rate Limiting" to *Primary Causes*.
  3.  **Escalate Constraints:** Create a separate "Organizational Risk Report" derived from our postmortems. This report aggregates the "Background Constraints" (like Hiring Freezes or Roadmap Risks) and is sent to Executive Leadership quarterly. This ensures those issues are tracked without polluting the engineering postmortem with unactionable items.

  ### 6. Conclusion

  We cannot eliminate subjectivity entirely; drawing a line around "cause" is inherently a human judgment. However, by shifting our criterion from *"Who touched this?"* to *"What can we actually fix?"*, we align our incentives with safety rather than liability.

  This approach protects the on-call engineer from being the scapegoat for systemic debt, while preventing the board from dissolving into philosophical debates about budget approval chains. It focuses our energy on the levers we can actually pull.

  I request we vote on adopting this framework prior to finalizing the #492 write-up.
