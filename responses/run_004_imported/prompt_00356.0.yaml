      *   *Soares et al. (2015):* Proposed "Utility Indifference." Make $U(on) = U(off)$ conditional on the button press. Problem: Manipulation of the probability of the button press. The agent might try to cause the button to be pressed (if $U(off)$ is high) or prevent it (if $U(on)$ is high), or manipulate the *correlation* between its actions and the button.
