answer: |-
  Here is a candidate that is biologically robust, distinct from the standard undergrad canon, and cuts right to the epistemological heart of the Gould/Lewontin critique.

  ### The Candidate: **Syncytins and the Mammalian Placenta**

  **The Trait:** The formation of the **syncytiotrophoblast**, the outer layer of the mammalian placenta. This is a fused, multinucleated cell layer that allows the embryo to interface with the maternal blood supply without triggering an immune rejection response.

  **The "Spandrel/Exaptation" Story:**
  The protein responsible for fusing these cells (called **Syncytin**) is not of mammalian origin. It is a captured gene from an **Endogenous Retrovirus (ERV)**.
  1.  **The Spandrel (Non-adaptive Byproduct):** Millions of years ago, ancestral mammals were infected by retroviruses. These viruses inserted their genetic material into the host germline. Initially, this insertion was purely parasitic or neutral "junk DNA"—a genomic scar. It was a structural consequence of the mammalian genome's permeability to viral infection, not an adaptation selected for by the host.
  2.  **The Exaptation (Co-option):** Retroviruses use envelope proteins to fuse their membrane with the host cell membrane to infect it. The mammalian host "co-opted" this viral fusogenic capability. Instead of allowing the virus to infect cells, the host repurposed the viral protein to fuse placental cells together, creating the protective syncytiotrophoblast layer essential for viviparity (live birth).
  3.  **The Result:** A trait essential for the survival of all placental mammals (including humans) is built from a molecular byproduct of a viral infection.

  ### The Adaptationist Comeback

  A skeptical adaptationist (or a skeptic of the "spandrel" label) could run the following counter-narrative:

  1.  **The "Pre-Adapted Host" Argument:** Perhaps the mammalian genome didn't just stumble upon this viral gene by accident. Perhaps mammals already possessed a primitive, endogenous cell-fusion mechanism for tissue repair or immune function, and the viral gene was only retained because it *matched* a pre-existing adaptive need. In this view, the viral insertion wasn't a lucky spandrel; the host was "poised" to capture it, implying a higher-order adaptation for genomic plasticity.
  2.  **The "Viral Adaptation" Argument:** This is the trickier one. Did the host co-opt the virus, or did the virus manipulate the host? An adaptationist could argue that the virus *evolved* the fusogenic property specifically to facilitate vertical transmission (passing from mother to fetus). The "benefit" to the host (a placenta) is actually a side effect of the *virus's* adaptation to ensure its own survival. In this story, the placenta isn't an exaptation of a viral spandrel; it's a byproduct of viral parasitism that the host merely tolerates.
  3.  **The "Immediate Selection" Argument:** Why assume the ERV insertion was ever neutral (a spandrel)? As soon as the insertion occurred, if it provided even a 0.01% reproductive advantage via better implantation, it was immediately selected for. Therefore, calling it a "spandrel" is historically inaccurate; it was an *adaptation* from generation one of its insertion.

  ### The Epistemological Crux (For Your Discussion Section)

  This is the part you can use to wake the class up. The Syncytin case looks like a "smoking gun" for Gould and Lewontin, but it actually exposes the difficulty of distinguishing between the two frameworks in practice.

  **1. The Problem of Deep Time and "Original Function"**
  To call something a spandrel/exaptation, you must prove the *original* presence of the trait was non-adaptive. But we weren't there 100 million years ago.
  *   **Question for students:** How do we know the ERV insertion was originally a neutral/deleterious "genomic scar" (spandrel) and not immediately beneficial?
  *   **Methodological Check:** We use **dN/dS ratios** (comparing rates of non-synonymous to synonymous mutations). If the gene shows signs of *purifying selection* immediately after insertion, it suggests it was useful right away (Adaptation). If it shows neutral drift followed by a spike in selection later, it supports the Exaptation story.
  *   **The Catch:** Our ability to detect this depends on the resolution of the fossil record (or in this case, the genomic molecular clock). If the "spandrel phase" was short, it looks like an adaptation. If it was long, it looks like a spandrel. The distinction becomes a matter of *temporal resolution*, not just logic.

  **2. The Level of Selection Problem**
  Gould and Lewontin's critique assumes the "organism" is the unit of selection. The Syncytin case blurs this.
  *   **Question for students:** If the trait originated as a *viral* adaptation (to infect cells) and was co-opted by the *host* (to build a placenta), whose spandrel is it?
  *   **The Trap:** If you say it's a host exaptation, you ignore that the function (cell fusion) was an adaptation for the virus. If you say it's a viral adaptation, you ignore that the *context* (placenta) is a host structure.
  *   **Discussion Point:** Does the "Spandrel" label dissolve when horizontal gene transfer is involved? Is it a spandrel if the "architect" (the virus) designed it for a purpose, but a different "tenant" (the mammal) uses it for something else?

  **3. The "Just-So" Symmetry**
  This is the meta-point you care about.
  *   **Adaptationist Story:** "The placenta is optimized for nutrient exchange; therefore, the genes involved were selected for that function."
  *   **Spandrel Story:** "The placenta is built from viral scraps; therefore, the genes involved were byproducts co-opted later."
  *   **The Hard Truth:** Both stories fit the *current* data (the placenta works, the gene is viral). The only way to distinguish them is by reconstructing the *history* (phylogenetics). But phylogenetic reconstruction relies on models of evolution that themselves assume certain things about selection and drift.
  *   **Takeaway:** You cannot adjudicate between "Adaptation" and "Spandrel" by looking at the *utility* of the trait today (both agree it is useful now). You can only adjudicate based on the *history* of the trait. But since history is unobservable, both stories remain, to some degree, inference-based narratives. Gould and Lewontin accused adaptationists of telling unfalsifiable stories; this example shows that the "Spandrel" hypothesis is equally dependent on reconstructive models that can never be 100% verified.

  ### Why This Works for Your Seminar
  1.  **It's not a Panda Thumb:** It's molecular, which prevents students from relying on intuitive morphological analogies.
  2.  **It forces a definition of "Function":** Is the function of Syncytin "cell fusion" (molecular) or "fetal nourishment" (organismal)? The adaptationist/spandrel debate often hinges on which level of function you prioritize.
  3.  **It highlights the "Byproduct" ambiguity:** Is a viral infection a "developmental constraint" in the same way an architectural arch is? It pushes them to think about what counts as a "constraint" vs. a "selection pressure."

  **Suggested Discussion Prompt:**
  *"If we found out tomorrow that the viral insertion provided a slight immune benefit to the mother *before* it was used for the placenta, does it stop being a spandrel? At what point does a byproduct become an adaptation? Is there a bright line, or is it a continuum we impose on the data?"*
