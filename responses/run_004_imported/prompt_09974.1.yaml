          *   Choice 1: (A) 100% $1M vs (B) 10% $5M, 89% $1M, 1% $0. (Most pick A).
          *   Choice 2: (C) 11% $1M, 89% $0 vs (D) 10% $5M, 90% $0. (Most pick D).
          *   *Independence Violation:* If you strip the common 89% $1M from A and B, you get C and D (roughly). Wait, let's check the math.
          *   A: 1.0 $1M. B: 0.1 $5M + 0.89 $1M + 0.01 $0.
          *   Strip 0.89 $1M from both?
