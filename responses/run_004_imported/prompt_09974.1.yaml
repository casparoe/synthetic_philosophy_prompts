      *   Section 3: AI & Selection. (This is the weak point. Address Gradient Descent. Does GD find resolute choosers? Maybe, if the architecture supports it. But EU is mathematically simpler).
      *   Section 4: Novelty. (Philosophy: Old. AI Safety: Fresh. Position it as applying old philosophy to new tech).
      *   Conclusion: Go write it, but sharpen the AI section.

