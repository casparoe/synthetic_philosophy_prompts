          *   Actually, the standard transformation is:
              *   1A: 100% $1M
              *   1B: 10% $5M, 89% $1M, 1% $0
              *   2A: 11% $1M, 89% $0
              *   2B: 10% $5M, 90% $0
              *   Common consequence: 89% chance of $1M in 1A/1B vs 89% chance of $0 in 2A/2B.
              *   If you prefer 1A > 1B, you imply $U(1M) > 0.1 U(5M) + 0.89 U(1M) + 0.01 U(0)$.
              *   Subtract 0.89 U(1M): $0.11 U(1M) > 0.1 U(5M) + 0.01 U(0)$.
              *   In choice 2, preferring 2B > 2A implies $0.1 U(5M) + 0.9 U(0) > 0.11 U(1M) + 0.89 U(0)$.
              *   Subtract 0.89 U(0): $0.1 U(5M) + 0.01 U(0) > 0.11 U(1M)$.
