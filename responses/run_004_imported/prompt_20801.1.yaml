      *   *Global Optimality:* Proving something is the *absolute* best is often harder than just finding a local maximum. In infinite spaces, this can be undecidable.
      *   *Complexity:* If moral/metaphysical truths are NP-hard (or worse), the *Calculemus* ("Let us calculate") becomes impractical for finite beings.

  4.  **Drafting the Response - Section by Section:**

