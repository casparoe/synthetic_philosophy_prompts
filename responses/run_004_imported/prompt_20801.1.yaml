      *   **Core Question:** Does computational complexity (specifically the hardness of optimization vs. verification, and global optimality proofs) undermine Leibniz's *Calculus Ratiocinator* and his *Theodicy* (Best of All Possible Worlds)?
      *   **Sub-questions:**
