      *   *Key Concept to Highlight:* "Collinearity" or "Confounding Variables." The distinction between *predictive accuracy* on training data vs. *generalizability* to test data.

  6.  **Refining the Advice (Self-Correction during drafting):**
      *   *Initial thought:* Tell them to count words. *Correction:* No, that reinforces the wrong metric. Tell them to explicitly grade "density of argument."
      *   *Initial thought:* Suggest more supervision. *Correction:* User said that doesn't sit right. Focus on the *design* of the calibration, not the *frequency* of checking.
