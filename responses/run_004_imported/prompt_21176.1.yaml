prompt: |-
  I'm a PhD candidate on my university's research-misconduct inquiry panel — seated there because policy requires the panel to include someone of the respondent's own rank — and the respondent is a postdoc accused by his supervising PI of fabricating results in a co-authored paper. Partway through deliberations, we learned that the PI herself was found, twelve years ago at another institution, to have quietly excluded inconvenient outliers without disclosure — classified there as a "detrimental research practice" rather than misconduct, in a finding never made public. The panel has split: some members want to treat her history as disqualifying, invoking the equitable rule that a party with "unclean hands" forfeits standing to seek relief, and would pause the inquiry pending a ruling on whether she may bring the charge at all; others insist fabrication is either in the data or it isn't, that decade-old conduct elsewhere is beside the point, and that dwelling on it is a tu quoque our filing deadline cannot absorb. Draft the short memo I'll bring to next week's meeting: it should recommend concretely how the panel should treat the standing objection and how the inquiry itself should proceed, and it should give whichever side turns out to be wrong real reasons to engage with, rather than a wave of the hand.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** PhD candidate on a research-misconduct inquiry panel.
      *   **Context:** Panel includes someone of the respondent's rank (the candidate). Respondent is a postdoc accused by their PI of fabricating results.
      *   **Complication:** Mid-deliberation, it's revealed the PI had a prior finding (12 years ago, different institution) for "detrimental research practice" (undisclosed outlier exclusion), not formal misconduct. Finding was quiet/non-public.
      *   **Conflict:** Panel is split.
          *   *Side A:* "Unclean hands" doctrine applies. PI lacks standing. Pause inquiry pending ruling.
          *   *Side B:* Fabrication is factual. Past conduct is *tu quoque*. Deadline constraints prevent dwelling on it.
      *   **Task:** Draft a short memo for the next meeting.
      *   **Requirements:** Recommend concretely how to treat the standing objection and how to proceed. Give the "losing" side real reasons to engage (no hand-waving).
      *   **Tone:** Professional, objective, legally/procedurally sound, respectful of the candidate's junior status but assertive in reasoning.

  2.  **Determine the Core Issues:**
      *   **Jurisdiction/Scope:** Does the panel have the authority to adjudicate the *complainant's* history, or only the *respondent's* alleged misconduct?
      *   **Relevance:** Is the PI's past conduct relevant to *this* specific allegation of fabrication?
      *   **Procedure:** What do university policy and federal regulations (like ORI/PHS) say about "standing" in misconduct cases?
      *   **Fairness:** How to balance the need for truth with the risk of bias or procedural overreach.
      *   **Efficiency:** The deadline constraint mentioned by Side B.

  3.  **Evaluate the Arguments:**
      *   *Side A (Unclean Hands):* Equitable doctrine usually applies in civil litigation, not necessarily administrative inquiries. However, credibility is key. If the accuser has a history of data manipulation, their testimony might be less reliable. *Weakness:* "Detrimental practice" $\neq$ "Misconduct." Different institution. 12 years ago.
      *   *Side B (Tu Quoque/Factual):* Fabrication is objective. Either the data exists or it doesn't. The PI's past doesn't change the raw data. *Weakness:* Ignoring credibility issues entirely can lead to wrongful findings. Deadlines are real, but not at the expense of due process.

  4.  **Formulate a Recommendation:**
      *   *Standing:* The panel likely *cannot* dismiss the charge based on the PI's history. Misconduct inquiries are about protecting the integrity of the record, not resolving disputes between parties. The "victim" is the scientific record, not just the PI. Therefore, the PI doesn't need "clean hands" to report potential fraud.
      *   *Relevance:* The history is relevant *only* to credibility/weight of evidence, not admissibility/standing. It shouldn't stop the inquiry, but it should inform how the panel evaluates the PI's testimony.
      *   *Procedure:* Do not pause. Continue the inquiry. Document the history in the confidential file but limit its use to assessing the reliability of the accusation's origin, not the truth of the data itself.
      *   *Bridge:* Acknowledge Side A's concern (credibility matters) but validate Side B's constraint (scope and deadlines).

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the difficulty of the situation.
      *   **Recommendation 1: Standing/Admissibility:** Address the "unclean hands" argument. Explain why it doesn't apply legally/procedurally in this context (institutional interest > individual dispute).
      *   **Recommendation 2: Inquiry Process:** How to handle the info. Don't ignore it (Side A wins a point), but don't let it derail the timeline (Side B wins a point). Use it for credibility weighting.
      *   **Addressing Side A (The "Unclean Hands" proponents):** Validate their concern about fairness/credibility. Explain why pausing is risky (jurisdictional overreach).
      *   **Addressing Side B (The "Just the Facts" proponents):** Validate their concern about deadlines/objectivity. Explain why ignoring it completely is risky (appeals/reputational risk).
      *   **Conclusion:** Call to action.

  6.  **Refining the Tone:**
      *   As a PhD candidate, I need to sound respectful but competent. I shouldn't sound like I'm lecturing senior faculty, but I must show I've done the homework.
      *   Avoid legalese where possible, but use precise terms (e.g., "probative value," "institutional interest").
      *   Ensure the "real reasons" requirement is met. Don't just say "policy says no." Say "Policy says no *because*..."

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Unclean Hands" totally wrong?
      *   *Correction:* In administrative law, standing to report misconduct is usually broad. The institution has the duty to investigate. Framing it as the PI "bringing a charge" is slightly misleading; the PI *alleged* misconduct, the *University* investigates. This is a crucial distinction to make to Side A.
      *   *Critique:* Is the 12-year gap significant?
      *   *Correction:* Yes, it suggests rehabilitation or isolated incident. It reduces probative value.
      *   *Critique:* Is "Detrimental Research Practice" (DRP) the same as Misconduct?
      *   *Correction:* No. DRP is often a lower tier. This distinction is vital. It means she wasn't found to have committed *misconduct* previously.

  8.  **Final Polish:** Check word count (keep it short/memo style). Ensure the recommendation is actionable. (The resulting draft follows this structure.)

  9.  **Final check against constraints:**
      *   Short memo? Yes.
      *   Concrete recommendation? Yes.
      *   Give losing side real reasons? Yes.
      *   Tone appropriate for PhD candidate on panel? Yes.

  *(Self-Correction Note: Make sure to emphasize that the inquiry is about the *respondent's* actions, not the *complainant's* history, while acknowledging that the complainant's credibility is part of the evidence.)*

  10. **Final Output Generation** (Proceed to draft).
answer: |-
  **MEMORANDUM**

  **TO:** Research Misconduct Inquiry Panel
  **FROM:** [Your Name], PhD Candidate, Panel Member
  **DATE:** October 26, 2023
  **SUBJECT:** Procedural Recommendation Regarding Complainant History

  **Purpose**
  This memo addresses the procedural impasse regarding the supervising PI's prior research integrity finding (Institution B, 12 years ago). It recommends a path forward that preserves the inquiry's timeline while rigorously addressing concerns about credibility and fairness.

  **Recommendation**
  1.  **Reject the "Standing" Objection:** The panel should not pause to adjudicate the PI's standing to report misconduct. The "unclean hands" doctrine is a principle of equitable civil litigation, not administrative research integrity proceedings. Our mandate is to protect the institution's integrity and the scientific record, not to arbitrate a private dispute between the PI and the postdoc. The allegation belongs to the University, not the PI; therefore, her history does not disqualify the charge.
  2.  **Proceed with Inquiry, Limit Scope of Prior Finding:** We should continue the inquiry without interruption. However, the prior finding should be entered into the confidential administrative record. It is inadmissible for proving the *respondent's* guilt but admissible for assessing the *reliability* of the PI's testimony and the origin of the allegation.

  **Rationale for Side A (Proponents of "Unclean Hands")**
  Your concern is that a complainant with a history of data manipulation lacks the credibility to trigger a career-ending investigation. This is a valid concern regarding *weight*, not *admissibility*.
  *   **Why pausing is risky:** If we pause to rule on the PI's standing, we risk exceeding our jurisdiction. Federal regulations (e.g., 42 CFR § 93) and University policy focus on the *respondent's* actions. A ruling that a PI cannot report fraud could set a precedent that shields bad actors from reporting by senior staff with minor past infractions.
  *   **The substantive win:** By recording her history, we ensure that if this case proceeds to a full investigation, the adjudicators will know to scrutinize the PI's interpretation of the data with heightened skepticism. We preserve the issue for the stage where credibility is paramount, without halting the fact-finding process.

  **Rationale for Side B (Proponents of "Just the Facts")**
  Your concern is that fabrication is an objective falsification, independent of the accuser, and that we face hard deadlines.
  *   **Why ignoring it is risky:** Dismissing the history entirely as *tu quoque* exposes the final report to appeal. If the respondent learns we knew of the PI's history and deliberately excluded it, they can argue procedural bias.
  *   **The substantive win:** By categorizing the prior finding as a "credibility factor" rather than a "standing barrier," we avoid a time-consuming jurisdictional debate. We acknowledge the data exists, file it, and move on. This satisfies the deadline while insulating the panel from accusations of a cover-up.

  **Next Steps**
  I move we vote to table the standing objection as outside panel jurisdiction, document the PI's prior finding in the confidential administrative file solely for credibility assessment, and resume the scheduled review of the raw data immediately.

  Respectfully submitted,

  [Your Name]
