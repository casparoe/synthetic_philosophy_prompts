      *   *Skepticism:* Give Boyle his due. Orthodox mechanical philosophers existed. So heresy isn't a *sine qua non* for physics. But is it a *sine qua non* for *Newton's* physics?
      *   *The Core Argument:* Absolute Space. Leibniz attacked it as making God finite or unnecessary. Newton/Clarke defended it as God's attribute. If God isn't Trinity, but Supreme Lord, Space is His domain. This makes laws absolute, not relational.
      *   *The "Corruption" Parallel:* Cleaning the Bible = Cleaning Physics. Both seek an original, uncorrupted state.
      *   *Conclusion:* Verdict: Substantive Continuity.

  6.  **Review against Constraints:**
