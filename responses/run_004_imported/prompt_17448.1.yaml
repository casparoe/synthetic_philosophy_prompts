answer: |-
  You have done your homework. You are absolutely right that the standard "Kepler called astrology the foolish daughter of astronomy" soundbite is useless for understanding what he actually thought. That quote (from a letter to Herwart von Hohenburg) is often used to dismiss him as a skeptic, but in practice, he spent decades casting nativities and writing astrological treatises.

  To understand how the man who discovered elliptical orbits reconciled that with casting horoscopes, you have to understand that Kepler wasn't trying to preserve "magic." He was trying to build a **physics of influence** based on the only universal language he trusted: **Geometry.**

  Here is exactly where he drew the line, how he constructed the mechanism, and how he kept his mathematical integrity intact.

  ### 1. The Line: Geometry vs. Mythology
  Kepler's primary beef with traditional astrology (the Ptolemaic/Arabian tradition) was that it was arbitrary. It was full of "fictions."

  *   **The Zodiac Signs (Illegitimate):** To Kepler, the 12 signs (Aries, Taurus, etc.) were human inventions. They are based on constellations, which are just random groupings of stars at vastly different distances. Dividing the ecliptic into 12 equal slices of 30 degrees was a convenient calendar tool for humans, but it had no basis in physical reality. A planet being in "Taurus" meant nothing physically because "Taurus" doesn't exist as a physical object; it's a drawing in the sky.
  *   **The Aspects (Legitimate):** The angular relationships between planets (conjunction, sextile, square, trine, opposition) were different. To Kepler, these were not arbitrary. They corresponded to the **regular polyhedra** and constructible geometric figures (triangles, squares, hexagons) that could be inscribed within a circle.

  For Kepler, geometry was not just math; it was the mind of God. He believed the universe was structured according to harmonic geometric ratios (a theme from *Mysterium Cosmographicum* through to *Harmonices Mundi*). Therefore, when two planets form a 60° angle (sextile) or a 90° angle (square), they are creating a geometric shape that resonates with the fundamental structure of creation. That resonance was physical, not symbolic.

  ### 2. The Mechanism: Light and the *Anima Terrae*
  This is the part that usually gets left out, and it is the key to squaring his rigor with his beliefs. Kepler needed a causal mechanism. How does a planet 50 million miles away affect a person on Earth without violating physical laws?

  He proposed a two-step physical process involving **light** and the **Soul of the Earth**.

  **Step 1: Planetary Rays**
  Kepler believed planets emitted a kind of "species" or influence (often associated with light) that radiated outward. When two planets align in a specific geometric aspect, their rays interact. This interaction creates a specific "configuration" of force.

  **Step 2: The *Anima Terrae* (Soul of the Earth)**
  This is the critical link. Kepler did not view the Earth as a dead rock. He viewed it as a living organism with a soul (*anima terrae*).
  *   When the planetary rays hit the Earth in specific geometric patterns (aspects), the Earth's soul **perceives** them.
  *   The Earth's soul reacts to this perception physically. It shivers or stirs.
  *   This stirring causes the Earth to release vapors and exhalations from its interior.
  *   **Weather:** These vapors create weather patterns (rain, wind, heat).
  *   **Human Temperament:** Humans are not directly controlled by the planets. Instead, humans are affected by the *weather* and the *air quality* caused by the Earth's reaction to the planets.

  So, Kepler's astrology was actually **meteorological**. He shifted the causal chain from *Planets → Human Fate* (magic) to *Planets → Earth's Soul → Weather → Human Health/Disposition* (proto-physics).

  ### 3. *Tertius Interveniens*: The Third Man
  You mentioned this pamphlet (1610), and it is indeed the manifesto of his position. The title translates to "The Third Man Intervening."

  *   **Man 1:** The Skeptic who says astrology is total nonsense.
  *   **Man 2:** The Traditionalist who believes in zodiac signs, houses, and mythical influences without question.
  *   **Man 3 (Kepler):** He intervenes to say the Skeptic is wrong because there *is* a physical influence (geometry/light), but the Traditionalist is wrong because the *mechanism* is superstition.

  In *Tertius Interveniens*, he explicitly argues that the "predictions" of astrology often come true not because the stars control fate, but because the **human soul** has a natural instinct to recognize these harmonies. He suggests that when the heavens are in a "hard" aspect (like a square), the Earth's atmosphere becomes tense, and human souls, sensing this disharmony, are more prone to conflict. It is a resonant sympathy, not a deterministic command.

  ### 4. Squaring it with Mathematical Rigor
  How does a rigorous scientist believe in the "Soul of the Earth"? You have to look at his definition of science (Natural Philosophy) in the 17th century.

  1.  **Geometry as Truth:** For Kepler, if something is geometrically perfect, it *must* be real. Since the aspects are geometrically perfect, they *must* have an effect. To deny the effect would be to deny the power of geometry.
  2.  **Removing the Noise:** Kepler viewed his work as cleaning up astrology. By stripping away the zodiac signs, the houses, and the mythical rulerships, he thought he was making astrology *more* scientific, not less. He was trying to turn it into a branch of optics and harmonics.
  3.  **Theological Necessity:** Kepler was a devout Lutheran. He believed God created the universe with a specific order. If the planets moved in mathematically precise ways (which Kepler proved), it would be wasteful and illogical for God not to have a purpose for those movements. The "influence" was the purpose.

  ### 5. The Economic Reality (and Integrity)
  You noted he cast horoscopes for cash. This is true; his salary as Imperial Mathematician was perpetually in arrears, and he had to support his family. He cast horoscopes for Wallenstein and the Emperor Rudolf II.

  However, he didn't just tell patrons what they wanted to hear. He famously refused to predict specific political outcomes (like "will the Emperor win the battle?") because he believed the aspects only indicated *inclinations* and *weather*, not specific free-will events. He would write things like, "Mars is in a square aspect, so there will be conflict and heat," and let the patron interpret what that meant for their war. He maintained that the stars incline, they do not compel (*astra inclinant, sed non obligant*).

  ### Summary
  Kepler drew the line at **Causality**.
  *   **Zodiac Signs:** No causal mechanism. Arbitrary human labels. **Fake.**
  *   **Planetary Aspects:** Based on divine geometry. Interact via light rays. Perceived by the living Earth. **Real.**

  He squared this with his rigor by treating astrology not as a mystical art, but as a branch of **terrestrial physics**. He wasn't a "closet believer" in the old sense; he was a reformer trying to build a new, mechanistic astrology that fit within a Copernican, geometric universe. He failed, of course—Newton later removed the *Anima Terrae* and gravity doesn't care about zodiac angles—but for Kepler, it was the only logical conclusion of his own mathematics.
