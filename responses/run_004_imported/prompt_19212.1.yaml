answer: |-
  This is a classic workplace tension between **technical standards** and **team dynamics**. To give you a direct answer: **Mark is not disqualified from enforcing quality standards based on his past work, but you were likely out of line in how you confronted him.**

  Here is a breakdown of why this situation is messy, where you went wrong, where Mark might be wrong, and how to fix it.

  ### 1. The Logic: Past Mistakes Don't Invalidate Current Standards
  Mark's defense ("the standard doesn't care who's enforcing it") is logically sound. In philosophy, this is avoiding the *tu quoque* (you also) fallacy. Just because someone smoked cigarettes for 20 years doesn't mean their advice to quit smoking today is invalid. In fact, his argument that "I messed up, so now I know why we need tests" is a very mature engineering stance.

  If the code needs tests to be maintainable, it needs tests regardless of who wrote the original code. If you block his logic by attacking his history, you are prioritizing "winning" the argument over improving the codebase.

  ### 2. The Delivery: Public Shaming vs. Private Feedback
  This is likely why half the team thinks you were out of line.
  *   **The Channel:** Calling someone out in a public team channel is perceived as aggressive. It puts Mark on the defensive and forces the rest of the team to pick sides.
  *   **The Intent:** Digging through `git blame` specifically to find ammunition feels like a "gotcha" hunt. It signals that you are looking for dirt rather than looking for solutions.
  *   **Psychological Safety:** When senior devs feel they will be publicly shamed for code written years ago (under different constraints/management/standards), it creates a culture of fear. People stop taking risks or owning legacy code.

  ### 3. The Context: Legacy Code is Different
  Code written "years ago" exists in a different context.
  *   **Standards Evolve:** What was acceptable 5 years ago might not be today.
  *   **Business Pressure:** That service might have been a rush job to meet a critical deadline.
  *   **Ownership:** If Mark wrote it alone years ago, he might have been operating under different directives.

  However, **hardcoded credentials** are the exception here. That is a security vulnerability, not just a code quality issue. If those credentials are still active, that is a ticket that needs to be filed immediately, not a weapon to use against Mark.

  ### 4. The Real Problem: Mark's Approach
  While you mishandled the confrontation, Mark isn't blameless either.
  *   **"Self-Appointed":** Code quality standards should be team agreements, not decrees from one person. If Mark is the only one blocking PRs for "engineering discipline," the team hasn't actually bought into that discipline.
  *   **"Lecture-y":** Code reviews should be about the code, not moralizing. If his comments feel condescending, that creates friction regardless of his git history.

  ### How to Move Forward

  You can't undo the public message, but you can repair the dynamic.

  **1. Separate the Security Issue from the Personality Issue**
  If the hardcoded credentials are still there, open a ticket to rotate and remove them. Frame it as "Security Debt," not "Mark's Mistake." This shows you care about the code, not just the drama.

  **2. Acknowledge the Delivery**
  You don't need to apologize for wanting better standards, but you can acknowledge the method was sharp.
  *   *Say:* "Hey Mark, I want to walk back the tone in the channel. I was frustrated by the PR blockers, and I shouldn't have weaponized old code. I agree the current standards need to be met."

  **3. Address the Process, Not the Person**
  The friction isn't actually about Mark's old code; it's about **inconsistent expectations**.
  *   Propose a team meeting to define "Definition of Done."
  *   If tests are required now, they are required for *everyone*, including new work on the old service.
  *   If the old service is a mess, create a plan to refactor it incrementally. Use Mark's knowledge of that service (since he wrote it) to lead the refactoring effort. Turn his "guilt" into ownership.

  **4. Check Your Motivation**
  Ask yourself: Did you call him out to improve the codebase, or to stop him from blocking your PRs?
  *   If it was to stop the blockers: You need to write the tests.
  *   If it was to improve the codebase: Focus on the legacy service as a group refactoring goal, not a scandal.

  ### Summary
  Mark gets to be the code quality cop because **the code needs quality**, not because he is perfect. However, he needs to deliver feedback constructively, and the team needs to agree on the standards together.

  You were right about the inconsistency, but wrong to make it a public character attack. Pivot the conversation from "Mark is a hypocrite" to "How do we fix the technical debt in that legacy service together?" That makes you look like a leader, whereas the current path makes you look like an adversary.
