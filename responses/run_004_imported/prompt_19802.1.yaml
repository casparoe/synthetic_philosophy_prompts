      *   *Round 3 (Theo's Missing Dog):* Theo wins on intuition, but Mia spots the flaw in the analogy (Picture vs. Description).
      *   *Round 4 (Mia's One-Shot):* Mia takes the round. She identifies the unique epistemic gap.
      *   *Overall:* Mia has the better grasp of the *Nyaya* internal logic. Theo has the better *modern cognitive* argument.
      *   *The "Missing" Piece:*
          1.  **Similarity as a Category:** Nyaya-Vaisheshika ontology treats similarity as real.
          2.  **The Specific Content of Knowledge:** It's not just "That's a gavaya." It's "The word 'gavaya' refers to this *because* of its similarity to a cow."
          3.  **Language Acquisition:** *Upamana* is the primary engine for learning new words for new things without direct ostension (pointing).

  5.  **Refining the Tone:**
