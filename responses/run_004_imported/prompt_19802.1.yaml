          2.  Evaluate who has the better argument at each stage.
          3.  Identify if there's something important about *Upamana* that *both* are missing.
      *   **Tone:** Engaging, analytical, philosophical but accessible (since it's a student context).

  2.  **Deconstruct the Debate (Move-by-Move):**

      *   **Move 1: Theo's Opening Salvo (Reductionism)**
          *   *Claim:* *Upamana* is redundant. It's just Testimony (being told) + Perception (seeing) + Inference (matching).
          *   *Strength:* Parsimony (Ockham's Razor). Don't multiply entities without necessity. It fits a naturalistic cognitive model.
          *   *Weakness:* Might oversimplify the specific cognitive leap involved in name-object association based on similarity.
