answer: |-
  The neon sign of the bar buzzed, a low-frequency hum competing with the clatter of glasses. Arthur nursed a whiskey, neat. Leo was scrolling through his phone, the blue light washing over his face.

  "You didn't stay for the second act," Arthur said. It wasn't a question.

  Leo looked up, pocketing the phone. "I saw the livestream of the opening. Then I read the *Times*, the *Guardian*, and Sarah's Substack. I know what happened. The protagonist folds. The lighting shifts to amber. It's a metaphor for capitulation."

  "You know the plot," Arthur corrected. "You don't know the play."

  "I know it's good. Five stars across the board. That's data, Arthur."

  "It's not data. It's testimony." Arthur swirled the ice in his glass. "There's a difference. If you told me the bridge outside is structurally sound because an engineer told you, I'd drive over it. I don't need to calculate the load-bearing stress myself. But art isn't a bridge. You can't outsource the aesthetic judgment."

  "Why not?" Leo leaned in. "That's the Acquaintance Principle, right? You have to see it to judge it. But that assumes aesthetic value is some magical quality that only transmits through the retina. If I trust your taste, and you say the acting is nuanced, why is my belief that 'the acting is nuanced' less justified than my belief that 'it's raining in Lisbon' when my sister tells me?"

  "Because 'raining' is a fact," Arthur said. "It obtains independently of you. Aesthetic value isn't out there like rain. It's a relation between the work and the viewer. When you accept my verdict without the experience, you aren't holding an aesthetic belief. You're holding a sociological one. You believe *I believe* it's good. That's not criticism, Leo. That's gossip."

  "So what's the alternative?" Leo signaled for another drink. "There are four hundred productions in London this season. No one human can see them all. If we stick to your purist model, criticism becomes a boutique luxury. Only the people with infinite time get to have opinions. My job isn't to be the sole witness; it's to be a synthesizer. I aggregate the testimony of trusted witnesses to map the landscape."

  "But you lose the *reasons*," Arthur pressed. "In science, I can accept your conclusion without replicating the experiment. But in art, the 'conclusion' is worthless without the 'experiment.' If I tell you a painting is beautiful because of the tension between the blue and the red, and you haven't seen the blue and the red, you don't understand the judgment. You're just nodding at a word."

  "I understand the argument," Leo countered. "I read the reviews. I know *why* you think it's good. I can discuss the merits of the direction, the pacing, the text. I'm not blindly following. I'm using testimony as a shortcut to the reasons."

  "A shortcut that bypasses the only thing that matters," Arthur said. "The point of criticism isn't to inform people what to consume. It's to teach them *how* to see. If you tell an audience a play is profound without them feeling the weight of it, you're lying to them. You're asking them to value something they haven't encountered. It's morally hollow, too. You wouldn't say a man is virtuous just because three people told you he is. You need to see the action."

  "Maybe," Leo said. "But we accept moral testimony all the time. We teach children not to steal before they understand the philosophical underpinnings of property rights. We rely on ethical experts in bioethics. Why is aesthetic expertise different? Maybe some people are just better at seeing. If I acknowledge you're a better viewer than me, isn't it rational to defer to your verdict?"

  Arthur shook his head. "Because aesthetic judgment demands autonomy. Kant was clear on this. To judge beauty, you must feel the pleasure yourself. If you say 'this is beautiful' because Arthur said so, you aren't making a judgment of taste. You're making a logical inference. And logically, you might be right. But aesthetically, you're empty."

  "Empty for whom?" Leo asked, his voice sharpening. "For me? Or for the reader? If I write a piece that helps a thousand people decide how to spend their limited leisure time, based on the consolidated expertise of a dozen critics who *did* sit through the torture, have I failed? Or have I just acknowledged that attention is the scarce resource, not access?"

  "You've turned art into a commodity report," Arthur said softly. "You're treating the play like a restaurant rating. 'Good value, nice ambiance.' But the value of art is in the encounter. By skipping the encounter, you're confirming the very thing the art is fighting against. The alienation. The idea that we can experience life second-hand."

  "And you're romanticizing the burden," Leo shot back. "You think suffering through three hours of bad theater makes your judgment purer. It doesn't. It just makes you tired. Look, I'm not saying I don't need *someone* to see it. I'm saying I don't need to be *me* who sees it. Knowledge is communal. Why should aesthetic knowledge be the one thing we insist on isolating in the individual skull?"

  "Because," Arthur finished his whiskey, "if you don't feel it, you can't defend it when the wind changes. When the consensus shifts in five years, and everyone says this play was actually derivative trash, you'll have no ground to stand on. You'll just check the new reviews. I'll have the memory of the experience. I'll know why it worked or why it failed. Testimony gives you the verdict, Leo. It doesn't give you the grounds. And without the grounds, you're not a critic. You're just a mirror."

  Leo sat back, the neon reflecting in his eyes. "Maybe," he said quietly. "But mirrors show people what's in front of them. Sometimes that's enough."

  "Sometimes," Arthur conceded, signaling for the check. "But it's not enough for us."
