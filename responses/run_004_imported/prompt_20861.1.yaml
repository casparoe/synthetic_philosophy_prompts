answer: |-
  Good evening. For those who don't know me, I make my living writing about replication crises in psychology and the regulation of machine learning. Essentially, I get paid to explain why things we thought were true might not be, and why new technologies might be dangerous. So, when Priya and Marcus asked me to speak about love, I told them I was professionally trained to be skeptical of it.

  They insisted. They asked me to anchor this toast in Bertrand Russell's 1929 book, *Marriage and Morals*.

  Now, for the family members who haven't read early twentieth-century philosophy: please don't worry. There is a caricature of Russell as the prophet of "free love," a man whose chaotic personal life contradicted his words. And for the philosophers in the room: I promise I am not going to flatten him into a hypocrisy joke.

  The real argument of *Marriage and Morals* is not a license for indulgence. It is a plea for clarity. Russell argued that much of what we call "jealousy" isn't a brute instinct, but a social artifact—inflated by property law, anxieties about paternity, and inherited religious guilt. He believed that if you strip away those historical accretions, you find the actual core of marriage: a durable, honest partnership, organized around the serious work of building a life and raising children well.

  He believed that reasonable people could achieve equanimity. And here is where the story gets human. Russell's second marriage, to Dora, began as a good-faith experiment in exactly this kind of openness. It ended in pain. Russell found he could not extend to Dora's relationship with another man the philosophical calm he had demanded in his book. He discovered that knowing *why* you feel jealousy doesn't necessarily stop you from *feeling* it.

  Why bring this up at a wedding? Why not just talk about how lovely the couple looks?

  Because Priya and Marcus are historians. They know that ideas are easy and lives are hard. They know that Russell wasn't wrong to value honesty, even if he struggled to practice it perfectly. And they know that a "conventional" marriage isn't a retreat from those ideas. It is a commitment to the hardest part of them.

  Russell's failure teaches us that marriage is not a state of grace you enter once the vows are said. It is a practice. It is the daily choice to prioritize the partnership over the ego, and honesty over comfort. It is acknowledging that jealousy, anxiety, and difficulty will come—not because you are doing it wrong, but because you are human. The goal isn't to be Bertrand Russell, the philosopher who solved emotions with logic. The goal is to be Priya and Marcus, two people who know exactly how complicated the history is, and who are choosing to do the work anyway.

  They are not building a marriage on the assumption that they will never feel fear or possessiveness. They are building it on the promise that when those feelings arise, they will meet them with the same rigor they apply to their archives: with honesty, with context, and with a commitment to the truth of the partnership above all else.

  In a world where so many of our institutions are fragile, where so much of what we read is algorithmic noise, there is something radical about committing to a durable, honest partnership. It is a bet on the long term. It is a bet that you can look at another person, really see them, flaws and history included, and say: *I will stay.*

  Priya and Marcus, you have studied the thinkers who tried to map the territory of human connection. You know the maps are imperfect. But tonight, you aren't signing a theory. You are signing up for the practice. May your marriage be less like a philosophical treatise, and more like a good life: messy sometimes, difficult often, but anchored in a honesty that survives the weather.

  To Priya and Marcus.
