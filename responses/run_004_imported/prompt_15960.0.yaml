      *   **Kalai-Smorodinsky (KS) Solution:** Connects the disagreement point to the ideal point (utopia point) and finds the intersection with the Pareto frontier. Key axiom: Monotonicity. If the feasible set expands in a way that benefits one player (increases their ideal point) without hurting the other's ideal point, that player shouldn't end up worse off.

