answer: |-
  The Nash Bargaining Solution (NBS) dominates the textbooks because it is elegant, unique, and mathematically tractable. But in the messy reality of wage bargaining—where the surplus is not a fixed stone but a living, breathing entity that expands and contracts based on productivity, market shocks, and strike threats—the Nash solution is descriptively flawed and normatively weak.

  The Kalai–Smorodinsky (KS) solution is not a mathematical footnote. It is the superior model for dynamic negotiations. The reason lies in the axiom swap: **Monotonicity captures the reality of leverage; Independence of Irrelevant Alternatives (IIA) ignores it.**

  Here is the case for why KS is the realistic and defensible choice for wage bargaining, specifically because the bargaining set is a moving target.

  ### 1. IIA Fails When "Irrelevant" Options Signal Power
  Nash's IIA axiom states that if you remove outcomes from the feasible set that were not going to be chosen anyway, the solution should not change. Mathematically, this ensures consistency. Behaviorally, in a negotiation, this is absurd.

  In wage bargaining, the *existence* of an option, even if it isn't selected, signals bargaining power. Imagine a union negotiating a wage. The "feasible set" includes a scenario where the company goes bankrupt and pays zero, and a scenario where the company makes record profits and pays a massive bonus.
  *   **Under Nash:** If we remove the "record profit" option from the mathematical set (because it's deemed "irrelevant" to the final agreement point), the solution remains the same.
  *   **Under Reality:** The mere *possibility* of record profits changes the union's leverage. It changes their threat point. It changes what they consider "fair."

  When the bargaining set is a moving target, the *shape* of the frontier matters. If the frontier expands outward (the company becomes more profitable), IIA suggests that as long as the local slope at the solution doesn't change, the outcome shouldn't change. This implies that a worker's share is independent of the company's *potential* to pay. KS rejects this. KS says: "If your best-case scenario improves, your settlement should improve." That is the definition of bargaining power.

  ### 2. Monotonicity Matches the Psychology of "Fair Share"
  The KS solution is built on the axiom of **Individual Monotonicity**: If the feasible set expands in a way that increases one player's maximum possible payoff (their ideal point) without reducing the other's, that player should not end up with a worse outcome.

  In wage bargaining, this aligns perfectly with the normative concept of **gain-sharing**.
  *   **The Scenario:** A technological breakthrough increases the firm's productivity. The "ideal point" for management (maximum possible profit) shifts upward. The "ideal point" for labor (maximum possible wage before profits hit zero) also shifts upward.
  *   **The Nash Failure:** Because NBS maximizes the *product* of utilities, it is sensitive to the curvature of the utility frontier. Depending on risk aversion parameters, a productivity boom could theoretically result in a settlement where the absolute wage stays static while profits surge, simply because the marginal utility of money diminishes.
  *   **The KS Success:** KS solves for the point where both parties make **equal proportional concessions** from their ideal points. If the company's ideal profit grows by 20%, and the union's ideal wage grows by 20%, the KS solution ensures the final agreement reflects that proportional expansion.

  This is how real humans negotiate. Unions don't argue using marginal utility products; they argue using ratios. *"You made 10% more this year; we want a 10% share of that gain."* KS formalizes this intuition. Nash formalizes a geometric property that has no rhetorical equivalent in the bargaining room.

  ### 3. Handling the "Moving Target" Surplus
  You specifically mentioned the size of the pie shifting mid-talks. This is the death knell for IIA.

  NBS assumes a static feasible set $S$. In long-term wage negotiations, $S$ is a function of time, $S(t)$. If a strike looms, $S$ shrinks. If a new contract is signed with a client, $S$ expands.
  *   **Nash Instability:** Because NBS depends on the tangency of a hyperbola to the frontier, small changes in the *shape* of the frontier (even far away from the solution) can cause discontinuous jumps in the NBS outcome. In a dynamic environment, this makes the "solution" volatile and unpredictable.
  *   **KS Stability:** KS depends primarily on the **Ideal Point** and the **Disagreement Point**. In a dynamic negotiation, these two points are the anchors. The Ideal Point is the "best case" (max profit/max wage); the Disagreement Point is the "strike/bankruptcy" scenario.
      *   It is much easier for negotiators to track the movement of the Ideal and Disagreement points than to recalculate the curvature of the entire utility frontier every time market conditions shift.
      *   KS offers a **focal point** that moves smoothly as the pie grows or shrinks. It provides a stable rule for dividing a variable surplus: *"We always split the distance between disaster and utopia 50/50 (or whatever the ratio)."*

  ### 4. Normative Defensibility: Equal Sacrifice
  Finally, KS is more normatively defensible in a labor context because it embodies the principle of **equal relative sacrifice**.

  Nash implies that the party with more to lose (higher risk aversion) concedes more. In a labor context, this often punishes the worker. If the worker is more risk-averse than the corporation (which is usually true), Nash dictates the worker should accept a lower wage to avoid the risk of a strike.

  KS dictates that both parties should concede the same *percentage* of their potential gain.
  *   If Management's ideal is \$10M profit and they settle at \$6M, they conceded 40%.
  *   If Labor's ideal is \$50/hr and they settle at \$30/hr, they conceded 40%.

  This is a far more robust definition of fairness in a political economy context. It prevents the "rich get richer" dynamic inherent in Nash where the less risk-averse party (usually capital) captures the surplus generated by the more risk-averse party (usually labor). When the surplus shifts, Monotonicity ensures that the party whose potential improved actually sees that improvement reflected in the deal.

  ### The Verdict
  The Nash Bargaining Solution is a model for splitting a fixed pie between two mathematicians. The Kalai–Smorodinsky solution is a model for splitting a growing pie between two adversaries.

  In wage bargaining, the "irrelevant alternatives" are never irrelevant—they represent the leverage of what *could* happen. By swapping IIA for Monotonicity, KS acknowledges that **potential is power.** If the bargaining set is a moving target, you need a solution that tracks the target's movement (the ideal points), not one that fixates on the local curvature of the frontier. KS is not just a mathematical alternative; it is the only model that respects the dynamic nature of leverage and the normative demand for proportional gain-sharing.
