answer: |-
  First, take a deep breath. What you are feeling has a name, and it is incredibly common among first responders, medics, and anyone who works in crisis triage. It's called **moral residue** (sometimes referred to as moral distress).

  Your partner isn't wrong about the outcome, but she is missing the point of your internal conflict. She is looking at the *result* (everyone lived), while you are grappling with the *principle* (how we decide who matters).

  To answer your question directly: **Your hesitation is not just overthinking, but the reasoning you used was not ethically "wrong."** You are caught in the tension between two valid moral frameworks, and feeling that tension is actually a sign that you are going to be a good responder.

  Here is a breakdown of what is happening in your head, why that "something" feels off, and how to carry it.

  ### 1. The Math vs. The Moral
  The decision you made is based on **Utilitarianism**. In emergency management, this is the gold standard: *Do the greatest good for the greatest number.* When resources are scarce (one boat), you allocate them where they save the most lives. It is cold, it is mathematical, and it is necessary. If you don't have a rule like that, you freeze, and then everyone dies.

  However, the unease you feel comes from a **Deontological** or **Rights-Based** perspective. This view holds that every individual has infinite, intrinsic worth. From this angle, the single man in the truck has just as much right to life as any one of the five people on the roof. By choosing the five, you didn't just "save more people"; you effectively decided that the one man's claim to survival was lesser.

  That "something" you can't put your finger on is the **commodification of human life.** It feels wrong to treat people like integers in an equation (5 > 1) because people aren't numbers. They are fathers, sons, friends, people with futures. Reducing them to a headcount feels like a violation of their individual dignity, even if it was the only practical choice.

  ### 2. Why Your Hesitation is Healthy
  If you *didn't* feel bothered by this, I would be worried.

  There is a condition called **compassion fatigue** or moral injury that happens when responders stop feeling the weight of these choices. If you can easily say, "It was just math, the guy didn't matter," you are building a wall around your empathy to protect yourself. That wall is useful in the moment, but if it stays up forever, you stop being human.

  Your hesitation proves that you still see the individuals, not just the stats. That is a good thing. It means you haven't become desensitized. The discomfort is the tax you pay for caring enough to do the job.

  ### 3. The "Triage Protocol" Shield
  You mentioned wondering if "five lives instead of one" is a good enough reason on its own. In the world of emergency response, **yes, it is.**

  Protocols exist specifically so you don't have to solve moral philosophy problems while waist-deep in floodwater. The protocol says: *Maximize survivorship.* This removes the burden of personal bias from your shoulders. You didn't choose the family because they looked nicer, or wealthier, or more "deserving." You chose them because the math of scarcity demanded it.

  The "problem" with the reasoning isn't in the logic; it's in the emotional aftermath. The logic holds up. The heart takes longer to catch up.

  ### 4. How to Process This
  You cannot "solve" this feeling, but you can manage it so it doesn't turn into burnout.

  *   **Talk to your crew:** You said there were other crews busy, but surely the crew in the boat, or the dispatchers, or the team leaders faced this same reality. Ask them. "Did anyone else struggle with the 5-vs-1 call?" You will likely find you aren't the only one. Shared burden is lighter.
  *   **Reframe the Narrative:** Instead of "I chose the five over the one," try "I used the resources I had to prevent the maximum amount of tragedy." You didn't abandon the man; you were physically incapable of reaching him. Acknowledge the limitation of your power. You are not a god; you are a responder with one boat.
  *   **Accept the Residue:** Don't try to talk yourself out of the feeling. Acknowledge it. "This feels bad because it *is* bad that we live in a world where we have to make this choice." Sitting with the discomfort is healthier than trying to rationalize it away completely.
  *   **Watch for the Slippery Slope:** The only time this reasoning becomes dangerous is if you start applying it outside of immediate triage. (e.g., "This neighborhood floods more often, so we shouldn't invest in protecting that one house.") Keep the "5 > 1" rule locked in the emergency window.

  ### Summary
  Your partner is right that you made the correct *operational* decision. But you are also right that the *moral* weight of that decision is heavy.

  You are experiencing the collision between the **necessity of action** and the **sanctity of life.** That collision hurts. It's supposed to hurt. It means you're doing the job with your conscience intact.

  Welcome to the team. It's a heavy load, but you're carrying it exactly the way you should.
