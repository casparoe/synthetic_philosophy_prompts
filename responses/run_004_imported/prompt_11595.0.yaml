      *   *Correction:* Yes, emphasize that for McTaggart, time *is* change. If $t_1$ is just a static coordinate, it's not time. If it's time, it must change (be future, then present, then past).
      *   *Check:* Is the distinction between Presentism and Moving Spotlight clear regarding the regress?
