          *   *The Status of the Constraint:* Simplicity Prior (contingent, empirical) vs. Principle of Charity (necessary, normative).
          *   *The "Bias" Loophole:* IRL allows for "human is irrational" (bias). Davidson limits how much irrationality is permissible before agency dissolves.
          *   *Goal:* IRL wants to *extract* $R$ for alignment. Davidson wants to *make sense* of the agent.
      *   *Specific Reference:* Mention the "No Free Lunch" theorem explicitly. Connect "Charity" to "Regularity Priors".
