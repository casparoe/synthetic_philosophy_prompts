  6.  **Final Polish:** Check tone. Ensure it sounds like advice for a journalist understanding the nuance, not just a philosophy exam answer. Highlight that this is the "Numbers Problem" in ethics.

      *(Self-Correction during drafting)*: In Step 6, Marcus makes a distinction between "impersonal value" and "individual claims." This is a very strong philosophical move (Parfit-style). However, in SAR, the *coordinator's* duty is usually impersonal (public good). I should note that Marcus wins the *philosophical* point, but Dana wins the *contextual* point. I will frame the verdict carefully.

      *Overlooked factors:* One big one is the *ex ante* agreement. Do hikers sign waivers acknowledging triage? Also, the "certain death" stipulation removes uncertainty, which is rare. I should mention that.

  7.  **Final Review against constraints:**
      *   Go through 6 moves in order? Yes.
