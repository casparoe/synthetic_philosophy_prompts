answer: |-
  It is a privilege to engage with someone who has spent a career staring into the very eyes that launched a thousand philosophical ships. Your reference to Lettvin, Maturana, McCulloch, and Pitts ("What the Frog's Eye Tells the Frog's Brain," 1959) is apt; that paper is the empirical bedrock upon which much of teleosemantics was built. Yet, as you have intuited, the bridge from the neuroethology of the *bug-detector* to the philosophy of *content* is far less stable than the early teleosemanticists (like Millikan and Papineau) hoped.

  You are correct to identify the core issue as a variant of the distinction Elliott Sober drew between *selection for* a trait and *selection of* a trait. In the philosophy of biology, this distinguishes between the property that caused the reproductive success and properties that merely correlated with it. In teleosemantics, this becomes the problem of **descriptive indeterminacy**.

  Here is the argument for why this indeterminacy is in-principle irremovable by biological facts alone, why Karen Neander's refinements do not solve it, and why teleosemantics ultimately relies on the very interpretive stance it seeks to naturalize.

  ### 1. The Underdetermination of Selection History by Description

  The central promise of teleosemantics is that content is fixed by the *etiological function* of a mechanism. The frog's retinal ganglion cells represent *fly* because the mechanism was selected for catching flies.

  However, evolutionary selection is a causal process, not a semantic one. Selection operates on phenotypic effects on reproductive fitness. As you noted, any single selective event (or aggregate of events) is compatible with multiple true descriptions of the target property.
  *   Description A: "Small, dark, moving convexity."
  *   Description B: "Musca domestica (or equivalent)."
  *   Description C: "Source of protein/calories."
  *   Description D: "Thing that triggers this specific neural firing pattern."

  In the actual evolutionary history of the anuran, these descriptions were co-extensive. Whenever A was present, B and C were present. Therefore, the causal history of the trait is equally well described as "selection for detecting A," "selection for detecting B," or "selection for detecting C."

  There is no biological "tag" attached to the DNA or the fossil record that says, "The content is B, not A." The history is a sequence of causal transactions. To extract *content* from that history, one must choose a level of abstraction at which to describe the causal transaction. Since biology provides the causation but not the description, the choice of description is external to the biology.

  ### 2. The Failure of Neander's "Causal Role" Refinement

  Karen Neander, in *A Mark of the Mental* and related works, attempts to tighten the screws on this problem. She argues that we must look at the **specific causal contribution** that explains the trait's proliferation. She suggests that the content is fixed by the specific condition that figured in the *explanation* of why the trait was selected.

  Neander would argue: The cells were not selected for detecting "dark spots" (too broad, includes BBs) nor merely "nutrition" (too broad, includes non-moving food), but specifically for the condition that typically caused the successful strike *in the environment of evolution*.

  However, this refinement fails to escape the indeterminacy for two reasons:

  **A. The Granularity Problem:**
  Even within the "specific causal contribution," there is no biological fact that dictates the *grain* of the description. Did the mechanism contribute to fitness by isolating *flies*, or by isolating *prey-items-of-size-X*? In the frog's evolutionary niche, these might have been 99% co-extensive. If the selective pressure was "energy acquisition," then "nutrition" is the most direct causal explanation. If the selective pressure was "avoidance of wasted energy on false strikes," then "fly-specific motion" is the explanation.
  Biology tells us the trait increased fitness. It does not tell us *which description of the fitness condition* is the semantic content. To pick "fly" over "nutritious object" is to impose a taxonomy (entomological vs. nutritional) that exists for *us*, not for the selection process.

  **B. The Aspectuality Gap:**
  Representation has aspectuality (Frege's *Sinn*): a representation presents its object under a specific aspect. Causation does not. A causal chain links a fly to a neuron. It does not link the fly *as a fly* to the neuron. It links the fly *as a physical cause*.
  Neander's appeal to the "explanation" of selection smuggles in an explainer. An explanation is a linguistic or conceptual construct. To say "The trait was selected *because* it detected flies" is a statement made by a biologist. The evolutionary process itself only "knows" that organisms with this detector left more offspring. The move from "left more offspring" to "represents flies" requires an interpreter to categorize the offspring-boosting cause as a "fly."

  ### 3. Normal Conditions and the Statistical Blur

  Teleosemantics relies heavily on the notion of "Normal Conditions" (Millikan) or the "Environment of Evolutionary Adaptedness." The idea is that content is what the mechanism correlates with *under Normal Conditions*.

  But as a neuroethologist, you know that nature is messy. "Normal conditions" are a statistical idealization. In the actual history of the frog lineage, there was variation. Some ancestors ate beetles that looked like flies. Some ate BB-like stones by accident. Some ate nutritious non-moving slugs.
  If we look closely at the fine structure of the sensory mechanism (as you suggested), we find tuning curves, not binary switches. The ganglion cells respond to a *range* of stimuli.
  *   If the content is determined by the *optimal* stimulus, we face the problem that "optimal" is defined by the experimenter's curve-fitting.
  *   If the content is determined by the *historical* stimulus, we face the problem that the historical stimulus was a heterogeneous set.

  To declare the content "Fly" is to draw a boundary around a cluster of causal stimuli that nature itself left fuzzy. There is no biological fact that marks the boundary where "fly" ends and "fly-lookalike" begins in the evolutionary record. That boundary is drawn by the theorist seeking to attribute content.

  ### 4. The Covert Reliance on the Interpreter

  This leads to the conclusion you suspect: Teleosemantics cannot deliver determinate content without covertly relying on an interpreter's choice.

  To assign the content "fly" rather than "dark moving thing," the teleosemanticist must assume that the *relevant* level of description for the selection story is the ecological/object level, rather than the physical/phenomenal level or the nutritional level.
  *   Why is "fly" the content and not "protein"? Because we are interested in the frog's *behavior toward objects*, not its metabolic state.
  *   Why is "fly" the content and not "retinal shadow"? Because we are interested in the frog's *relation to the world*, not its retina.

  These interests are *ours*. They are the interests of intentional interpreters (to use Dennett's term). We treat the frog as an agent with goals (eating flies). We then project those goals back into the selection history to fix the content.

  If we strip away the interpreter—if we look at the biology raw—we see only:
  1.  A mechanism $M$.
  2.  A set of causal antecedents $C$ (which includes flies, BBs, shadows, etc.).
  3.  A set of consequences $E$ (survival, reproduction).

  The statement "$M$ represents $Fly$" is a mapping we impose on the relation between $M$ and a subset of $C$. The biology does not privilege that subset. The "Disjunction Problem" is not a puzzle to be solved by more biology; it is a symptom of the category error of trying to derive semantic norms (truth conditions) from causal norms (fitness conditions).

  ### Conclusion

  Your dissatisfaction is well-founded. The move from "selection for detecting flies" to "the content is fly" requires a step that biology cannot validate. It requires selecting one description of the selective cause over indefinitely many others that are equally true of the causal history.

  Neander's attempt to anchor this in the specific explanatory role of the trait fails because "explanation" is relative to the interests of the explainer. The evolutionary process selects for *success*, not for *truth*, and certainly not for *true descriptions under a specific aspect*.

  Therefore, teleosemantics does not naturalize intentionality; it merely relocates it. It hides the interpreter's choice inside the description of the evolutionary history. The indeterminacy you perceive is not a gap in our knowledge of the frog's history; it is a fundamental feature of trying to read semantic specificity from causal generality. The "fact of the matter" you are looking for does not exist in the genome or the fossil record, because it is not a biological fact—it is a semantic one.
