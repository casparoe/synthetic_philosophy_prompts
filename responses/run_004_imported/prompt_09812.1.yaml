      *   **The Task:** Argue *for* the user's position. Specifically, argue that residual indeterminacy *cannot* be removed by further biological facts (including Neander's etiological/functional approach). Argue that teleosemantics fails to deliver determinate content without covert reliance on an interpreter's choice.
