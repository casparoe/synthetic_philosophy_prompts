      *   **Point 2: Critique of Neander's "Causal Role" Refinement.** Neander argues we look at the specific causal contribution. Counter: The causal contribution is also describable at multiple levels (physiological, ecological, behavioral). Why is the ecological description ("fly") privileged over the physiological one ("retinal shadow") or the nutritional one ("protein")? The biology doesn't say.
      *   **Point 3: The Problem of "Normal Conditions."** Teleosemantics relies on "Normal Conditions" (conditions under which the trait was selected). But these conditions are statistical and variable. Did the frog evolve to detect *flies* specifically, or *things like flies*? The boundary is fuzzy in nature, sharp only in language.
      *   **Point 4: The Interpreter's Shadow.** To pick one description over another, we (the philosophers/biologists) impose a granularity. We choose the level that makes sense *to us* as intentional interpreters. This smuggles in the very intentionality teleosemantics was supposed to naturalize.
