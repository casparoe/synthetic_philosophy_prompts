      *   **The Disjunction Problem (Fodor):** How does a representation mean $X$ and not $X$ or $Y$? (e.g., Fly vs. Fly-or-BB).
      *   **The User's Specific Twist:** It's not just the standard disjunction problem; it's the *description problem* within the selection history itself. Is the selected function "detecting flies," "detecting food," or "detecting small dark moving things"?
      *   **Neander's Approach:** Karen Neander (and Millikan) try to solve this by looking at the *Normal Conditions* and the specific causal contribution of the trait to fitness. Neander emphasizes the specific causal role in the explanation of survival/reproduction.
      *   **The Argument to Construct:** I need to show that even Neander's refinements fail because evolutionary history is underdetermined with respect to *description*. Selection acts on phenotypes, but "phenotype" is describable at multiple levels of abstraction. There is no "fact of the matter" in the DNA or the history that picks out *one* level of description as the "true" content.

  3.  **Outline the Argument:**
