  7.  **Drafting - Iteration 3 (Refining the Metaphysics and Emotion):**
      *   *Opening:* Start with the suddenness.
      *   *The View:* Describe the "block" not as ice, but as a library or a landscape.
      *   *The Cruelty of Presentism:* This is the key insight. If only the present exists, her childhood, her laughs, are *gone*. If eternalism is true, they are *there*.
      *   *The Comfort:* We don't need to pretend she's here. We just need to remember she *is*.
      *   *Closing:* A specific memory fixed in time.

  8.  **Polishing the Language (incorporating the prompt's constraints):**
      *   Avoid "spirit," "soul," "heaven," "watching."
      *   Use "real," "exists," "located," "moment."
      *   Make sure the philosophers nod along and the family understands the sentiment even if they don't know the terminology.
