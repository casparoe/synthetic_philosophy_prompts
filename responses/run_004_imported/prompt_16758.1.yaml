  2.  **Determine the Core Message:**
      *   The core tension is between the *feeling* of loss (which feels like annihilation) and the *truth* of her philosophy (which says nothing is lost).
      *   The comfort comes not from her continuing to exist *now* (in a presentist sense), but from the fact that her existence *then* (and always) is immutable and real.
