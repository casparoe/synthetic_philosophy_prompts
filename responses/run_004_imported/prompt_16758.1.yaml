answer: |-
  Friends, colleagues, family.

  Ten days ago, the world changed for those of us who loved [Advisor's Name]. For the rest of the universe, of course, it did not. And in that discrepancy—between the catastrophe we feel and the indifference of the cosmos—lies the very philosophical terrain she spent her life mapping.

  I was [Advisor's Name]'s student. My work is in moral psychology, far from the metaphysics of time. But I learned from her that how we understand time is not an abstract game; it is how we learn to live with loss.

  [Advisor's Name] was an eternalist. She believed in the block universe. She did not believe that the present moment is uniquely real, or that the past has slipped into non-existence. She held that the past, the present, and the future are all equally real. They are all *there*. The sense we have that time "flows," that the present slides along a timeline erasing the past and illuminating the future, was to her a feature of human consciousness, not a feature of reality.

  I know that for many of you, this sounds cold. It sounds like a way of saying she is gone, just located at a different coordinate. But I want to suggest that she found profound warmth in this view. And I think there is comfort in it for us, if we can bear to look at it as unflinchingly as she did.

  She often said that presentism—the view that only the *now* is real—is actually the crueler metaphysics. On that view, every moment of her life, every laugh shared at this kitchen table, every argument won in a seminar room, is annihilated the instant it ceases to be present. If presentism is true, then the [Advisor's Name] who held you when you were crying, or who graded your papers at 2:00 AM, has literally ceased to exist. They have been wiped out of reality.

  She refused to accept that. She refused to believe that the good parts of her life were vulnerable to erasure.

  On her view, nothing that was ever real stops being real just because it is no longer *now*. The moment she was born is real. The moment she first fell in love is real. The moment she sat with me, impatient and brilliant, and told me my argument was sloppy but promising—that moment is not gone. It does not vanish because our consciousness has moved on. It is fixed. It is permanent. It is part of the structure of the universe.

  She would not want me to tell you that she is "watching over us." She is not. She would not want me to say she is "still with us in spirit." She is not. To say those things would be to pretend that she is somehow still participating in the present moment, and she spent her career arguing that such a picture is a confusion.

  But she would want me to tell you that she *is*.

  She exists, eternally, at the coordinates where she lived. The reality of her kindness, her rigor, her impatience, and her love is not dependent on our current memory of it. It is not dependent on the present tense. It is written into the block.

  In a strange way, this means we do not have to carry the burden of keeping her alive through our grief. We do not have to fight against the erosion of time. We cannot erase her, because nothing that happened can be erased. The conversations we had are not fading memories; they are permanent facts.

  I will miss her presence. I will miss the sound of her voice in the hallway. But I take solace in the thought that she offered us: that death is not an annihilation of what was, but merely a boundary of where we are.

  She is not here. But she is not gone. She is exactly where she was, and she is real, forever.

  Thank you.
