      *   **The Philosophical Core (The "Hard" Part):** Explain her view simply. Avoid "A-series/B-series" labels if possible, or use them very sparingly. Focus on the *implication* of the view.
      *   **The Specific Argument (Presentism vs. Eternalism):** Integrate the prompt's specific point about presentism being the crueler view. This needs to land gently but firmly.
      *   **The Personal Connection:** How did this view shape her as a mentor/person? (Unflinching honesty, valuing reality).
      *   **The Closing:** A farewell that aligns with the metaphysics. Not "gone," but "located elsewhere in the block."

  4.  **Navigating the Tone:**
      *   *Risk:* Sounding too academic/cold.
      *   *Mitigation:* Use emotional language to describe the *relief* of the theory. Connect the metaphysics to the feeling of grief.
      *   *Risk:* Sounding too abstract for the family.
      *   *Mitigation:* Use concrete imagery (laughter, arguments, coffee).
      *   *Risk:* Offending the philosophers.
      *   *Mitigation:* Ensure the metaphysics is accurate. No "she lives on in our hearts" (which implies a presentist creation of reality). Instead, "she is real where she was."

  5.  **Drafting - Iteration 1 (Mental Outline):**
