prompt: |-
  Been down a rabbit hole on constructive math lately — started messing with Lean at work because of all the AI-solves-math-olympiads news, then fell down a wikipedia hole reading about intuitionism. I keep getting stuck on why intuitionists get so bothered by "non-constructive" existence proofs. Classic example: you prove some irrational number raised to an irrational power is rational by case-splitting on whether sqrt(2)^sqrt(2) is itself rational or irrational — either way you win, but the proof never actually tells you which case holds. A classical mathematician shrugs and says the proof's fine either way; an intuitionist apparently can't accept that.

  Can you write me a dialogue between a committed classical mathematician and a committed intuitionist hashing this example out? Don't let either side be a pushover — the classical mathematician needs a real answer to "you haven't actually built the object," and the intuitionist needs to answer the "isn't this just handicapping yourself for no reason" objection. If it fits naturally I'd also love for them to get into whether something like Goldbach's conjecture is already true or false even though no ones proved it either way yet.
