answer: |-
  This is an exceptionally sharp reading of *Principia Ethica*. You have identified a tension that has troubled commentators since the book's publication: the relationship between Moore's **Method of Isolation** (used to determine intrinsic value) and his **Principle of Organic Unities** (used to determine how value aggregates).

  Your suspicion that Moore is deploying two distinct notions of "isolation" is correct, and it is the key to unlocking whether he is inconsistent. However, the verdict on whether his practice survives scrutiny is more nuanced. Moore is logically consistent in his *axiology* (theory of value), but his procedure is phenomenologically vulnerable.

  Here is a reconstruction of Moore's methodology across these sections, followed by a verdict on the consistency of his procedure.

  ### 1. Reconstructing the Methodology

  To understand the apparent contradiction, we must distinguish between the *target* of the isolation test in Chapter III versus Chapter VI.

  **A. The Chapter III Isolation (External Isolation)**
  In Chapter III, Moore establishes the definition of "intrinsic value." The method of isolation here is **ontological and contextual**.
  *   **The Question:** "If this thing existed *alone* in the universe, would it be good?"
  *   **The Goal:** To distinguish intrinsic value from instrumental value or contextual value.
  *   **The Target:** Entire states of affairs or objects (e.g., a beautiful world vs. an ugly world).
  *   **The Logic:** If $X$ is good in isolation, it is intrinsically good. If $X$ is only good when accompanied by $Y$, its value might be instrumental or dependent.

  **B. The Chapter VI Isolation (Internal/Constituent Isolation)**
  In Chapter VI, Moore has already established *that* certain complex states (like aesthetic appreciation) are intrinsically good. Now he wants to know *where* the value lies within that complex state.
  *   **The Question:** "If this *constituent* of the complex state existed without the *other constituents*, would it retain the same value?"
  *   **The Goal:** To demonstrate the **Principle of Organic Unities**.
  *   **The Target:** Psychological constituents (e.g., cognition vs. emotion).
  *   **The Logic:** If Part $A$ (cognition) has value $x$, and Part $B$ (emotion) has value $y$, but the Whole ($A+B$) has value $z$, where $z \neq x + y$, then the Whole is an Organic Unity.

  **C. The Specific Warning in §112**
  You note that Moore warns against neglecting organic unities. Let's look closely at the specific error he defines:
  > "This error is committed, when it is supposed, that, if one part of a whole has no intrinsic value, the value of the whole must reside entirely in the other parts."

  Moore is warning against the **Fallacy of Misattribution**. He is *not* warning against analyzing the parts. He is warning against assuming that if the Emotion is worthless, the Value must be located entirely in the Cognition.

  ### 2. Addressing the Apparent Inconsistency

  Your puzzle rests on the idea that by isolating the emotion in §114 to show it has little value, Moore is violating the spirit of the organic unities principle.

  **Is he committing the error warned against in §112?**
  No. In §114, Moore argues:
  1.  Emotion in isolation $\approx$ No Value.
  2.  Cognition in isolation $\approx$ Little Value.
  3.  Emotion + Cognition (Aesthetic Appreciation) = High Value.
  4.  **Conclusion:** The value resides in the **whole**, not in the remaining part (cognition).

  This is perfectly consistent with the warning in §112. He explicitly *refuses* to say the value resides entirely in the cognition. Instead, he uses the low value of the isolated parts to prove that the value of the whole is **emergent**.

  **Is he using two distinct notions of isolation?**
  Yes, and this is where your hypothesis is strongest.
  1.  **Isolation for Intrinsic Goodness:** Used to validate the *Whole* (Aesthetic Appreciation) against the rest of the universe.
  2.  **Isolation for Organic Structure:** Used to validate the *Internal Relation* of the Whole's parts.

  Moore assumes that a state of consciousness can be an "Organic Unity" (axiologically inseparable regarding value) even if its constituents are "Conceptually Isolable" (psychologically distinguishable). For Moore, "Organic Unity" does not mean the parts cannot exist apart; it means the **value is not additive**.

  ### 3. The Verdict: Does the Practice Survive Scrutiny?

  While Moore escapes the charge of *formal inconsistency*, his methodology faces a significant *substantive* challenge regarding the coherence of the "isolated parts."

  **The Strength: Logical Consistency**
  Moore is logically safe. He maintains a strict separation between:
  *   **Existence:** Can the part exist without the whole? (Moore says yes: one can have bare emotion or bare cognition).
  *   **Value:** Does the part retain the whole's value? (Moore says no).

  By maintaining this distinction, he avoids contradicting himself. He can consistently claim that parts are isolable *existentially* (for the sake of the thought experiment) but not *axiologically* (for the sake of value calculation).

  **The Weakness: Phenomenological Plausibility**
  The scrutiny Moore fails is not logical, but phenomenological. His method relies on the conceivability of the isolated constituents.
  *   **In §114:** He asks us to consider "emotion... existing by itself." But can emotion exist without *some* cognitive content? Can one feel "admiration" without admiring *something*? If the emotion is essentially intentional (directed at an object), then "isolating" the emotion from the cognition of the object may result in a conceptual nullity.
  *   **In §122:** He separates admiration of mental qualities from the "bodily expression." He argues the bodily expression adds value to the mental admiration. But if the "admiration of the person" is inherently tied to their embodied existence, isolating the "mental qualities" creates an abstraction that doesn't truly exist.

  If the "isolated part" is a philosophical fiction (i.e., it cannot actually exist even in imagination without the other part), then the **Method of Isolation** yields false data. If you test the value of a non-existent abstraction, the result (zero value) tells you nothing about the value of the real constituent within the unity.

  **The "Two Notions" Defense and its Limit**
  Your suggestion that he uses two notions of isolation saves him from contradiction, but it exposes a rift in his metaphysics.
  *   If the **Chapter III Isolation** requires the thing to be a "substantial existence" (a world, a state of consciousness),
  *   But the **Chapter VI Isolation** treats constituents as "abstractable fragments"...
  *   Then Moore is applying a test designed for *substances* to *aspects*.

  Later philosophers (particularly the Phenomenologists and later Wittgensteinians) would argue that Moore is carving nature at the wrong joints. By treating consciousness as a bundle of separable atoms (cognition + emotion) that can be weighed separately, he misses that the *meaning* of the emotion is constituted by the cognition.

  ### Conclusion

  You have correctly identified that Moore is operating with **two distinct methodological applications of isolation**:
  1.  **Macro-Isolation:** To determine *what* is good (Worlds/States).
  2.  **Micro-Isolation:** To determine *how* it is good (Summative vs. Organic).

  **Is there a genuine inconsistency?**
  **No.** Moore does not violate his own warning in §112. He uses the isolation of parts specifically to *demonstrate* the organic unity, not to deny it. He concludes that the value lies in the *combination*, not in the surviving part.

  **Does his practice survive scrutiny?**
  **Only conditionally.** It survives logical scrutiny but falters on phenomenological grounds. His method assumes that psychological constituents (emotion, cognition) are sufficiently independent to be valued in isolation. If one rejects this atomistic view of consciousness (as many 20th-century philosophers did), then Moore's "Micro-Isolation" tests are testing phantoms, and his conclusions about organic unities, while likely true, are not proven by his method.

  In short: Moore is innocent of the charge of self-contradiction, but guilty of the charge of **question-begging abstraction**. He assumes the parts can be isolated to prove they shouldn't be valued in isolation.
