prompt: |-
  I'm the student rep on my college's Academic Integrity Board and we've got a genuinely hard case up for a vote this Thursday. A sophomore copied several paragraphs almost word-for-word from a friend's old paper for the same class - the copying itself isn't in dispute. But she has a documented dissociative disorder and a letter from her psychiatrist saying she was mid-episode the week she wrote it, and she says she barely remembers drafting it, like she must've had the friend's doc open "for reference" and lost track of whose words were whose. Some board members want to treat this like the usual "panicked under deadline stress" cases we see every term - a mitigating factor, sanction gets reduced but the finding still stands. Others think that's the wrong bucket entirely: if we actually believe the medical story, this wasn't her doing the thing for a bad reason, its more like something that just happened through her, so "mitigation" kind of misses the point. Our bylaws only give us two options, "responsible w/ sanction" or "dismissed" - nothing in between. Could you draft the memo I'll circulate before the vote? It needs an actual recommendation with a timeline, and it has to seriously engage with the strongest version of whichever side it doesn't pick. (we literally just read the Strawson piece on resentment and blame for my moral psych seminar and can't stop thinking about it re: this case, if that's useful.)
