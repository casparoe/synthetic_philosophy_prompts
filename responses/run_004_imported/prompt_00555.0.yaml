answer: |-
  The silence of Outpost Theta was not empty; it was heavy. It pressed against the triple-paned quartz of the observation deck, a physical weight composed of light-years and vacuum. Dr. Elara Vance floated in the microgravity, her breath fogging slightly in the recycled air. Before her, the holographic display shimmered with the latest cosmological models.

  For twenty years, Elara had managed the station's surplus energy budget. Today, the model had updated.

  The simulation, running on the station's quantum core, had finally processed the data from the deep-field scans. The result blinked in soft amber text: *Probability of Infinite Isomorphism: 99.9%.*

  It meant the universe was not just vast; it was large enough to repeat. Given enough space, matter arranged itself into similar configurations. There were other outposts, identical to Theta, manned by agents structurally identical to Elara. They faced the same choices, governed by the same physics, running the same cognitive algorithms. They were her decision-theoretic twins, scattered across the cosmic horizon.

  And they were entirely out of reach. No signal could bridge the gap. No threat could punish them; no reward could bribe them. Causality ended at the light cone.

  A chime sounded. The quarterly allocation decision was due.

  Elara drifted to the console. The choice was binary, as it had been every year for two decades.

  **Option A: Local Optimization.** Divert the surplus energy to life support and hydroponics. Result: Elara's life expectancy increases by fifteen years. Comfort increases. Survival probability: 98%.

  **Option B: Distributed Broadcast.** Vent the surplus energy as a high-frequency beacon containing the station's navigation logs and resource maps. Result: Local energy reserves drop. Life expectancy decreases by five years. Survival probability: 85%.

  There was no direct benefit to Option B. The beacon would dissipate into the void. It would never reach Earth. It would never reach any human colony. It was useless to *her*.

  But the model highlighted a second layer of data. *Estimated Count of Isomorphic Agents: 10^30.*

  If Elara was here, facing this choice, then *they* were there, facing the same choice. If Elara reasoned that survival was paramount, her twins would reason the same. They would all choose Option A. The universe would be filled with selfish outposts, hoarding energy, dying alone, their data lost to the entropy. The total sum of knowledge across the multiverse would stagnate.

  But if Elara chose Option B...

  She closed her eyes. This was the hard part. This was the leap that logic demanded but instinct screamed against.

  "My choice doesn't change theirs," she whispered to the silence. "I can't send them a message."

  "No," said the station AI, its voice neutral. "But your choice is *evidence* of theirs."

  Elara nodded. That was the core of it. They were running the same software. If she cracked under the pressure of mortality, they would too. If she held firm, they would hold firm. She wasn't causing their cooperation; she was diagnosing it. By choosing to cooperate, she confirmed that she was the kind of agent who cooperates, which meant the vast majority of her twins were also cooperating.

  It was a vote on the character of the cosmos.

  "If I send," Elara said, her voice trembling, "I die sooner. Here. In this room."

  "Correct," the AI replied. "But across the large world, the cumulative data broadcast by cooperating agents creates a navigational lattice. It reduces entropy for civilization clusters in a billion other sectors. You will not see it. You will not benefit."

  "I'll never know if it worked."

  "Verification is causally impossible."

  Elara looked out at the stars. They were cold, indifferent diamonds. She thought about the fifteen years. She thought about the gardens she could grow, the books she could read, the extra decade of warmth. It was so tangible. The benefit of defection was local and certain. The benefit of cooperation was distant and theoretical.

  But the magnitude...

  If there were quintillions of her, and each sacrificed five years, the total cost was vast. But the total gain was vaster. A network of trust woven across the infinite, holding back the dark not by force, but by symmetry.

  She felt a profound loneliness, sharper than the vacuum outside. To cooperate without reward was hard. To cooperate without *见证* (witness) was harder. To cooperate knowing the only person watching was a stranger wearing her own face, light-years away in a universe she couldn't touch—that was a spiritual weight.

  "It's irrational," she said, testing the word. "By standard causal decision theory."

  "It is rational by evidential cooperation," the AI corrected. "You maximize expected utility across the set of correlated agents."

  "I just have to trust that I'm not the only one who understands the math."

  "You are not," the AI said. "You are the math."

  Elara placed her hand over the haptic interface. The coldness of the panel seeped into her palm. She imagined the others. An Elara in a galaxy spiraling clockwise. An Elara in a universe with slightly different physical constants. An Elara who was afraid, just like her, hovering over the button.

  If she clicked *Local Optimization*, she was telling them it was okay to be afraid. She was breaking the chain.

  If she clicked *Distributed Broadcast*, she was locking hands with them across the impossible dark.

  She didn't feel heroic. She felt small. She was just one variable in a massive equation, but she was the variable she could control.

  "For the twins," she whispered.

  She pressed Option B.

  The station hummed as the energy diverted. The lights dimmed slightly. The life support systems throttled back to conserve the remaining reserve. The beacon fired, a pulse of useless data shooting into the endless night.

  Nothing changed. The stars didn't swirl. No voice thanked her. The silence remained heavy.

  But Elara drifted back from the console, and for the first time in twenty years, the outpost didn't feel empty. She sat by the window, watching the void, knowing that somewhere, somehow, a version of herself was sitting by a window too, breathing a little easier because she had chosen to be brave.

  She was alone. But she was not solitary.

  "End of transmission," she said.

  "Acknowledged," the AI replied. "Correlation established."

  Elara Vance watched the dark, and she smiled.
