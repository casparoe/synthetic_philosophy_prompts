      *   **Topic:** The Problem of Temporary Intrinsics (Lewis's formulation). Do objects endure (wholly present at each time) or perdure (have temporal parts)?
      *   **Task:** Analyze the exchange move-by-move, evaluate who has the better argument at each step, and specifically address Owen's closing move (the "relativization" counter-attack) to see if it neutralizes Rina's argument or if there's a disanalogy.

  2.  **Deconstruct the Dialogue:**

      *   **Move 1 (Rina):** The Classic Lewis Argument.
          *   Premise 1: Endurantism says object $O$ is wholly present at $t_1$ and $t_2$.
          *   Premise 2: $O$ is bent at $t_1$.
          *   Premise 3: $O$ is straight at $t_2$.
