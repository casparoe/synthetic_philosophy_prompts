answer: |-
  This is a classic reconstruction of David Lewis's **"Problem of Temporary Intrinsics,"** which is arguably the central engine of the modern endurance/perdurance debate. Since you're a physicist, you have a unique vantage point here: your intuition about spacetime likely aligns with perdurantism (worldtubes), while your friends are fighting over the metaphysical interpretation of that geometry.

  Here is the move-by-move breakdown, an assessment of who holds the stronger position at each stage, and a verdict on Owen's closing counter-attack.

  ---

  ### Round 1: The Logical Trap
  **Rina:** If Owen is wholly present at $t_1$ (bent) and $t_2$ (straight), and shape is intrinsic, Owen has incompatible properties. Contradiction. Therefore, Endurantism is false.
  **Owen:** (Implicitly accepting the challenge)

  *   **Analysis:** Rina is deploying Lewis's original argument. It is logically valid *if* you accept two premises: (1) Endurantism means the *whole* object exists at each time, and (2) Shape is a **monadic intrinsic property** (a property an object has in and of itself, not in relation to anything else).
  *   **Who wins this step?** **Rina.** Logically, she has the upper hand. If properties are monadic intrinsics, Endurantism entails a contradiction ($O$ is $F$ and $O$ is not-$F$). To survive, Endurantism must reject one of her premises.

  ### Round 2: The Relational Dodge
  **Owen:** No contradiction. Shape isn't monadic. Owen is "bent-at-$t_1$" and "straight-at-$t_2$." These are compatible relations, just like being "to the left of $A$" and "to the right of $B$."
  **Rina:** (Implicitly rejecting the redefinition)

  *   **Analysis:** This is the standard Endurantist defense (often called **Indexicalism** or **Adverbialism**). Owen saves the logic by changing the ontology of properties. He turns a 1-place property ($Bent(x)$) into a 2-place relation ($Bent(x, t)$).
  *   **Who wins this step?** **Draw / Slight Edge to Owen.** He successfully dissolves the contradiction. However, he pays a price: he has to convince everyone that "bentness" isn't actually intrinsic. For a physicist, this feels weird (the local curvature of a worldline seems intrinsic to that segment), but logically, it works.

  ### Round 3: The Intrinsic Intuition
  **Rina:** You've saved logic by killing the phenomenon. Shape *is* intrinsic. How bent I am shouldn't depend on a time any more than it depends on a spectator. By making it a relation, you've made change illusory.
  **Owen:** (Prepares closing move)

  *   **Analysis:** Rina is appealing to pre-theoretical intuition, which Lewis famously championed. If "bent" is just a relation to a time, does the object *really* change, or does it just have different relations to different coordinates? This is the philosophical cost of Owen's Move 2.
  *   **Who wins this step?** **Rina.** Philosophically, this is the strongest objection to Relationalism. It feels like a cheat to say properties aren't intrinsic just to save a theory. If Endurantism requires us to deny that shape is intrinsic, that's a major bullet to bite.

  ### Round 4: The *Tu Quoque* (You Too)
  **Owen:** Perdurantism doesn't escape this. On your view, the 4D "worm" isn't bent simpliciter; only its $t_1$-part is bent. So the worm is only "bent" in a derivative sense. You're relativizing to *parts* what I relativized to *times*. It's the same cost.

  *   **Analysis:** Owen is arguing that Perdurantism faces a parallel problem. If the whole person is the 4D worm, the worm itself is neither bent nor straight (it's a jagged tube). So the worm only has the shape "by courtesy" of its parts.
  *   **Who wins this step?** **This is the crux.** Let's dig into the disanalogy.

  ---

  ### The Verdict on Owen's Closing Move

  Does Owen's move neutralize Rina's original argument? **No, but it weakens her claim to superiority.**

  There is a **real disanalogy** between "relative to a time" (Owen's Endurantism) and "relative to a part" (Rina's Perdurantism). Here is why Rina can parry this final blow, and why your physics background gives you the tools to see why.

  #### 1. Fundamental vs. Derivative Bearers
  *   **Owen (Endurantism):** The *only* object that exists is the whole Owen. Therefore, the *only* thing that can bear the property "bent" is the whole Owen. If he says "bent-at-$t$," he is saying the **fundamental object** never has an intrinsic shape. It only has shape-relations.
  *   **Rina (Perdurantism):** There are two objects: the Whole Worm and the Temporal Part. The Temporal Part **does** have the shape intrinsically. The part is bent *simpliciter*. The Whole Worm has the property "having a bent part" intrinsically.
  *   **The Disanalogy:** Perdurantism preserves intrinsic properties at the fundamental level (the temporal parts). Endurantism (on Owen's defense) eliminates intrinsic properties at the fundamental level (the whole object). Rina can say: "I don't relativize the property; I relocate the bearer."

  #### 2. Parthood is Internal; Time is External
  *   In mereology (the logic of parts), if $X$ is part of $Y$, $X$'s properties contribute to $Y$'s nature internally.
  *   In Owen's relational view, Time is an external coordinate to which the object is related.
  *   **Physics Analogy:** Think of a worldtube in Minkowski space.
      *   **Perdurantism:** The worldtube is the object. A cross-section (temporal part) has a specific geometry (bent). This geometry is a local invariant of that segment.
      *   **Endurantism:** The "object" is a 3D slice that somehow jumps from $t_1$ to $t_2$. For the slice to be "bent-at-$t_1$," the bentness must be a label attached to the slice's relation to the time axis.
      *   **The Killer for Endurantism (Relativity):** As a physicist, you know simultaneity is relative. If Owen is "wholly present" at $t_1$, which $t_1$? In Special Relativity, there is no frame-independent "now." Endurantism requires a preferred foliation of spacetime to define when the object is wholly present. Perdurantism (the 4D worm) is frame-independent.
      *   **Implication:** Owen's relational fix ("bent-at-$t$") requires $t$ to be a real, absolute parameter for the relation to hold. Rina's parts view works fine with relativity; the temporal parts are just regions of the manifold.

  #### 3. The Nature of Change
  *   **Owen:** Change is having different relations to different times.
  *   **Rina:** Change is having different parts with different properties.
  *   **Why Rina wins here:** If I watch a movie, the film strip (the 4D worm) doesn't change. It just *is*. The *projection* (the temporal parts) changes. Perdurantism accounts for change by variation across parts. Owen's view accounts for change by variation in relations.
  *   Lewis argued that variation across parts is the only way to make sense of "change" without contradiction. Owen's move tries to say "variation in relations is the same cost." But it's not. Variation in relations implies the object itself is static and merely pointed at different coordinates. Variation in parts implies the object is extended and heterogeneous.

  ### Summary for the Physicist

  **Who has the better argument overall?**
  *   **Logic:** **Rina.** The Problem of Temporary Intrinsics is a genuine logical headache for Endurantism.
  *   **Intuition:** **Owen.** We *feel* like we endure. We don't feel like 4D worms.
  *   **Physics:** **Rina.** Perdurantism fits naturally into General Relativity (spacetime is a block; objects are worldtubes). Endurantism struggles with the relativity of simultaneity (when exactly is the object "wholly present"?).

  **Does Owen's closing move work?**
  It works as a defensive stalemate ("Your theory is weird too"), but it fails as a neutralizer.
  *   **The Disanalogy:** Rina does not have to say the property "bent" is relative. She says the *possession* of the property is restricted to a part. The part is bent, full stop. Owen has to say the object is *never* bent, full stop; only bent-relative-to-time.
  *   Preserving the intrinsicality of shape (even if only for parts) is theoretically cheaper than rendering shape relational for everything.

  **Referee Decision:**
  If this were a philosophy journal, **Rina wins on technical merits**, specifically because Owen's relational solution violates the intuition that shape is intrinsic, whereas Rina's perdurantism preserves intrinsic shape for temporal parts.

  However, since you're at a bar: **Owen wins on vibes.** Most people refuse to believe they are 4D worms regardless of the logic. But you can tell him that in your lab, his "wholly present" object doesn't survive contact with Special Relativity, whereas Rina's worldtube does. That usually ends the argument.
