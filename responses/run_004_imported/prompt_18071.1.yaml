          *   *Assessment:* This is David Lewis's famous "Problem of Temporary Intrinsics." It's a very strong argument *if* you accept Premise 4 (that shape is a monadic intrinsic).

      *   **Move 2 (Owen):** Relationalism (Adverbialism/Indexicalism).
          *   Counter: Deny Premise 4. Shape isn't monadic. It's a relation to a time. $O$ is bent-at-$t_1$ and straight-at-$t_2$.
