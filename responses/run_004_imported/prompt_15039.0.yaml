prompt: |-
  So next week I'm interviewing a theoretical neuroscientist for a piece on the free energy principle — she's built her whole career on the claim that it explains not just perception but basically all of life and self-organization. Shes sharp and has fielded every softball question a hundred times, so I need questions that actually go somewhere, not "what is the free energy principle" 101 stuff. Can you draft 7-8 interview questions, each with a follow-up keyed to whatever answer she'll probably give? I want at least one pushing on the "it's unfalsifiable/tautological" charge (she usually deflects with "it's a principle, not a hypothesis, like least action" — the follow-up needs to catch that move), one on the dark room problem and whether active inference actually solves it or just bakes the answer into the priors after the fact, and one calling out the slide between the modest predictive-processing story about perception and the much grander claim that literally any system with a Markov blanket is minimizing free energy.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Interviewee:** A theoretical neuroscientist specializing in the Free Energy Principle (FEP).
      *   **Topic:** FEP, Active Inference, Life, Self-organization.
      *   **Constraint:** She's sharp, experienced, and has heard standard questions before. No "FEP 101."
      *   **Deliverable:** 7-8 interview questions, each with a specific follow-up based on her likely response.
      *   **Key Themes to Cover:**
          *   Falsifiability/Tautology charge (specifically countering the "it's a principle like least action" defense).
          *   The Dark Room Problem (does Active Inference solve it or just hide it in priors?).
          *   The Scope Slide (modest perception vs. universal law for any Markov blanket).
      *   **Tone:** Professional, probing, insightful, not antagonistic but rigorous.

  2.  **Deconstruct the Key Themes & Anticipate Responses:**

      *   *Theme 1: Falsifiability/Tautology.*
          *   *Her likely defense:* "It's a mathematical necessity, like the principle of least action. You don't falsify the principle; you falsify specific generative models derived from it."
          *   *The Counter:* Least action works because we can measure the path and the Lagrangian independently. In FEP, the "path" (behavior) and the "Lagrangian" (variational free energy) are often defined in terms of each other. If *everything* minimizes free energy by definition of existing, what observation would count against it?
          *   *Goal:* Pin down the empirical risk.

      *   *Theme 2: The Dark Room Problem.*
          *   *The Problem:* If the goal is to minimize prediction error, why not sit in a dark, silent room forever (zero sensory input = zero error)?
          *   *Her likely defense:* "Organisms have priors that expect homeostasis/vitality. A dark room violates those priors."
          *   *The Counter:* Isn't that just restating the observation (organisms seek food/light) as a mathematical prior? Does FEP *explain* why those priors exist, or just accommodate them?
          *   *Goal:* Distinguish between explaining behavior and parameterizing it.

      *   *Theme 3: The Scope Slide (Perception vs. Universal Law).*
          *   *The Problem:* Predictive processing (PP) is a plausible theory of cortex. FEP claims *any* system with a Markov blanket (cells, bacteria, economies) does this.
          *   *Her likely defense:* "It's a scale-free law. The math holds regardless of substrate."
          *   *The Counter:* Does the explanatory power dilute as the scope widens? If a bacterium and a human brain are doing the "same" thing mathematically, do we lose the specific mechanisms that matter for neuroscience?
          *   *Goal:* Challenge the utility of the universal claim for specific neuroscience.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Drafting Q1 (Scope/Universality):* Start with the ambition.
          *   *Q:* You claim FEP applies to cells and brains alike.
          *   *Follow-up:* Does this make neuroscience redundant?
          *   *Refinement:* Make it about the "slide" mentioned in the prompt. Focus on the transition from specific neural mechanisms to abstract Markov blankets.

      *   *Drafting Q2 (Falsifiability):* Tackle the "Least Action" defense.
          *   *Q:* Critics say it's unfalsifiable. You say it's like least action.
          *   *Follow-up:* Least action has measurable quantities. What is the independent measure of free energy in a brain?
          *   *Refinement:* Focus on the *risk*. What data would make you abandon it?

      *   *Drafting Q3 (Dark Room):* The classic problem.
          *   *Q:* Why don't we sit in dark rooms?
          *   *Follow-up:* Isn't that just baking the answer into priors?
          *   *Refinement:* Focus on the *origin* of the priors. Evolution? If so, isn't natural selection the real explanation, not FEP?

      *   *Drafting Q4 (Normative vs. Descriptive):* Is it how brains *do* work or how they *should* work?
          *   *Q:* Is FEP normative?
          *   *Follow-up:* If brains deviate, is it noise or a failure of the theory?
          *   *Refinement:* Connect to psychopathology. If schizophrenia is "bad inference," does FEP offer a specific fix or just a description?

      *   *Drafting Q5 (The "As If" Critique):* Do neurons actually calculate gradients?
          *   *Q:* Does the brain do calculus?
          *   *Follow-up:* If it's just "as if," is it a model or a mechanism?
          *   *Refinement:* Push on the implementation level. Marr's levels.

      *   *Drafting Q6 (Agency/Control):* Who sets the priors?
          *   *Q:* Where do priors come from?
          *   *Follow-up:* If evolution sets them, is the agent actually minimizing free energy, or is selection?
          *   *Refinement:* This overlaps with Dark Room but focuses on *agency*. Let's make this about *preference*.

      *   *Drafting Q7 (Progress/Alternatives):* What has FEP actually *discovered* that other frameworks haven't?
          *   *Q:* What's a specific discovery?
          *   *Follow-up:* Could RL have found that?
          *   *Refinement:* Demand a concrete empirical win, not a simulation.

      *   *Drafting Q8 (Future/Endgame):* Where is this going?
          *   *Q:* What's the next step?
          *   *Follow-up:* What if the data doesn't match?
          *   *Refinement:* Bring it back to the "Principle" status.

  4.  **Review and Refine against Constraints:**
      *   *Check:* Are there 7-8 questions? Yes.
      *   *Check:* Are there follow-ups keyed to likely answers? Yes.
      *   *Check:* Is the "Least Action" defense addressed? Yes (Q2).
      *   *Check:* Is the "Dark Room" addressed? Yes (Q3).
      *   *Check:* Is the "Scope Slide" addressed? Yes (Q1).
      *   *Check:* Is the tone right? It needs to be respectful but piercing. Avoid "gotcha" phrasing, focus on conceptual clarity.

      *(Self-Correction during drafting)*: Make sure the follow-ups aren't just "But why?" They need to anticipate her specific rhetorical move (e.g., "It's a principle not a model") and challenge the *implication* of that move.

      *Refining Q2 (Falsifiability):* Her move: "It's like Least Action." My counter: "Least Action predicts *which* path among possibilities. FEP says existence *is* the path. How do we distinguish?"
      *Refining Q3 (Dark Room):* Her move: "Priors expect vitality." My counter: "Then FEP describes the constraint, but Evolution explains the cause. Why credit FEP?"
      *Refining Q1 (Scope):* Her move: "Universality is a strength." My counter: "Does it wash out the biological details we need for medicine?"

  5.  **Final Polish:** Organize logically. Start with scope, move to mechanics, then falsifiability, then specific problems (Dark Room), then empirical track record, then future. Ensure the "Interviewer Notes" explain *why* the question is asked.

  6.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are 8 interview questions designed to bypass the standard PR script. They are structured to anticipate her standard defenses (the "Least Action" analogy, the "Priors" defense, the "Markov Blanket" universality) and press for empirical specificity.

  ### 1. The Scope Slide (Universality vs. Mechanism)
  **Question:** "There is a tension in the literature between the Free Energy Principle (FEP) as a theory of *neural* computation and FEP as a universal law for any system with a Markov blanket—from bacteria to economies. When you argue for universality, do you worry that you are trading explanatory depth for breadth? If a bacterium and a human cortex are minimizing free energy in the same mathematical sense, does the concept become too abstract to tell us anything specific about *neuroscience*?"

  **Likely Answer:** She will likely argue that universality is a strength, not a bug. She'll say that finding a scale-free law allows us to translate findings across levels of analysis (cells to systems) and that the *implementation* differs, but the *principle* is invariant.

  **Follow-up:** "If the principle is invariant but the implementation is entirely distinct, what work is the principle actually doing for the neuroscientist? If I'm trying to treat schizophrenia or build a neural net, and you tell me 'it's all minimizing free energy,' but I still need to know the specific synaptic weights and neurotransmitters to make progress, hasn't the universal claim become a metaphor rather than a mechanism?"

  ### 2. The "Least Action" Defense (Falsifiability)
  **Question:** "Critics often charge that FEP is unfalsifiable because any behavior can be retrofitted as free energy minimization. Your standard defense is to compare it to the Principle of Least Action in physics—that it's a mathematical necessity, not a testable hypothesis. But in physics, Least Action predicts *which* path a particle takes among many possibilities. In FEP, if a system exists, it is *by definition* minimizing free energy. What specific empirical observation would count as evidence *against* the Free Energy Principle?"

  **Likely Answer:** She will likely reiterate that you don't falsify the principle, you falsify specific *generative models* derived from it. She may say, "If we observe a system maintaining its integrity without minimizing variational free energy, I would be concerned," but will argue such a system cannot exist by definition.

  **Follow-up:** "But that circles back to the definition. If the only way to observe a system is by defining its boundaries (its Markov blanket), and maintaining those boundaries is what defines minimization, aren't you protecting the theory from risk? If I can't point to a possible world where a living system exists but *doesn't* minimize free energy, isn't the 'Least Action' analogy masking a tautology?"

  ### 3. The Dark Room Problem (Priors vs. Explanation)
  **Question:** "Let's talk about the Dark Room problem. If the goal is to minimize prediction error, the optimal strategy for an organism should be to seek out a dark, silent room where sensory input is constant and predictable. You've argued that Active Inference solves this because organisms have priors that expect 'vitality' or homeostasis, which a dark room violates. But doesn't this just bake the solution into the priors after the fact?"

  **Likely Answer:** She will argue that the priors are not arbitrary; they are evolved to reflect the statistical structure of the environment necessary for survival. The "Dark Room" is a philosophical toy; real agents have deep temporal priors about staying alive.

  **Follow-up:** "If those priors are the result of natural selection, isn't natural selection the actual explanation for why we avoid dark rooms, and FEP is just the mathematical language describing the constraint? In other words, does FEP explain *why* we have the priors we do, or does it just provide a calculus for how we execute them?"

  ### 4. The "As If" Critique (Implementation)
  **Question:** "Geoffrey Hinton and others have pointed out that while backpropagation works in AI, it's biologically implausible. Similarly, critics argue that while brains might behave *as if* they are calculating variational derivatives, there is no known biological mechanism for neurons to perform the specific calculus required by FEP. Are you committed to the idea that the brain is literally performing this math, or is FEP just a useful 'as if' description?"

  **Likely Answer:** She will likely take the middle ground: "Neurons don't need to know calculus, just as a ball doesn't know calculus to follow a trajectory. It's about the dynamics settling into the solution."

  **Follow-up:** "But a ball follows a trajectory due to known forces (gravity, friction). If we can't identify the neural equivalent of those forces—the specific circuit motifs that perform the gradient descent—does FEP remain a theory of *biology*, or does it become a theory of *behavioral description*? At what point do we demand a wiring diagram?"

  ### 5. Normative vs. Descriptive (Psychopathology)
  **Question:** "FEP is often framed as a normative theory: it describes how a system *ought* to function to maintain its integrity. This has led to applications in psychiatry, where conditions like schizophrenia are framed as 'imprecise priors' or 'failed inference.' If FEP is a law of life, however, shouldn't *all* states, including psychosis, be viewed as successful minimization of free energy relative to some prior? How do you distinguish between a system minimizing free energy 'correctly' versus one that is 'broken'?"

  **Likely Answer:** She will likely explain that in pathology, the *model* is maladaptive. The system is minimizing free energy, but its generative model is mismatched to the environment, leading to poor long-term outcomes (failure to survive/thrive).

  **Follow-up:** "If the system is successfully minimizing free energy but still failing to survive or function socially, doesn't that suggest free energy minimization isn't the ultimate metric of health? If I can minimize free energy perfectly while hallucinating and starving, isn't the metric divorced from the biological reality of fitness?"

  ### 6. The Origin of Preferences (Active Inference vs. Reinforcement Learning)
  **Question:** "Active Inference is often contrasted with Reinforcement Learning (RL). In RL, you have an explicit reward function. In Active Inference, rewards are replaced by 'preferences' encoded in priors. But where do these preferences come from? If they aren't learned through reward signals, and they aren't hard-coded genetically for every scenario, what is the mechanism that updates the priors to reflect value?"

  **Likely Answer:** She will argue that preferences are learned through the same inference process, by minimizing free energy over time. The system learns what states are 'good' because they are expected states.

  **Follow-up:** "But that seems to conflate 'expected' with 'good.' A drug addict might expect and seek a state of intoxication. If FEP says they are just following their priors, does the framework lose the ability to critique the preference? If the math treats a healthy homeostatic prior and an addictive prior identically, does FEP have a theory of *value*, or just a theory of *consistency*?"

  ### 7. Empirical Track Record (Discovery vs. Redescription)
  **Question:** "Let's look at the track record. There are many papers modeling existing data with FEP. But can you point to a specific, novel empirical prediction made by FEP that was subsequently confirmed, which would *not* have been predicted by standard predictive processing or Bayesian brain hypotheses without the full Free Energy machinery?"

  **Likely Answer:** She may cite specific studies (e.g., specific eye-tracking patterns, pupillometry, or neural connectivity dynamics) where the *Active Inference* model fit better than a standard RL or Bayesian model.

  **Follow-up:** "In those cases, was the win due to the Free Energy Principle itself, or due to the specific architecture of the model you built? If I can build a simpler Bayesian model that gets the same result without invoking the full thermodynamic weight of FEP, isn't Occam's Razor a threat here?"

  ### 8. The Endgame (Unification or Hegemony?)
  **Question:** "You've built a career on the claim that FEP unifies life, mind, and action. If you are right, and FEP is indeed the 'Principle of Least Action' for biology, what happens to the rest of neuroscience? Does the field eventually dissolve into applied mathematics, or do you see a future where FEP is just one tool among many?"

  **Likely Answer:** She will likely say it provides a common language, a "unifying framework" that doesn't replace details but organizes them.

  **Follow-up:** "History suggests that when a field gets a 'Unified Theory,' it often becomes dogmatic. If a young neuroscientist comes to you with data that doesn't fit the Markov Blanket assumption, will they be encouraged to publish it, or told they haven't defined their boundaries correctly? How do you protect the field from becoming a self-sealing ecosystem?"
