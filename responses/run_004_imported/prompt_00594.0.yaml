answer: |-
  **Setting:** *A quiet corner of the faculty lounge, late afternoon. Two coffee cups sit untouched between Elena (a defender of the Reformed Conditional Analysis) and Marcus (a Dispositional Essentialist).*

  **Elena:** You know, looking back at my time in the lab, we never worried about whether solubility was "real" in the way you metaphysicians mean. We cared about the molecular lattice, the bond energies. If we could predict the behavior under stimulus, the property was characterized. That's why I stick with Lewis. The Reformed Conditional Analysis (RCA) gives us the prediction without the metaphysical baggage.

  **Marcus:** But your characterization was always incomplete, Elena. You described the *categorical basis*—the lattice, the bonds—but you treated the disposition itself as a mere shadow of the conditional. That works until the conditional comes apart from the property. Martin's finkish cases severed that link, and Lewis patched it. I grant you that. But Johnston's masking cases? Bird's antidotes? Those aren't patches; they're fatal wounds.

  **Elena:** Let's be precise. Lewis's RCA handles Martin's finkish wire beautifully. The wire is dead, but a device makes it live *if* touched. The Simple Conditional Analysis (SCA) falsely implies the wire is conductive. Lewis adds the clause: the causal basis must *persist* through the stimulus. In the fink case, the basis (conductivity) doesn't exist until the touch, so the conditional antecedent fails. The analysis holds.

  **Marcus:** I agree Lewis saved SCA from the Fink. But masking is the inverse problem, and it's stickier. Consider a fragile glass vial wrapped in perfect shock-absorbing packaging. It retains its intrinsic molecular structure—the causal basis of fragility. If you strike it, it does *not* break. The conditional "If struck, it would break" is false. Therefore, under SCA or standard RCA, the glass is not fragile. But it *is* fragile. The disposition is intrinsic; the packaging is extrinsic. The mask blocks the manifestation without removing the power.

  **Elena:** So you argue that because an extrinsic interferer prevents the manifestation, the conditional analysis fails to capture the intrinsic property. But Lewis can accommodate this. We refine the *stimulus* description. We don't say "If struck," we say "If struck *in the absence of interfering masks*."

  **Marcus:** And there you slide into circularity. How do you define "interfering masks" without already knowing what the disposition is? A mask is something that prevents the manifestation of *that specific disposition*. You're defining the disposition by the conditions under which it manifests, but you're defining those conditions by the disposition itself. It's a closed loop. You haven't analyzed the concept; you've just hidden the primitive notion inside a "ceteris paribus" clause.

  **Elena:** It's not circular if we ground the "interference" in causal laws. We know what breaks glass via physics. We can specify the conditions physically. But let's turn the table. You propose Dispositional Essentialism. You say fragility is a primitive, irreducible power. When I ask, "What does it *mean* for the glass to be fragile?" you say, "It possesses a power to break." Isn't that just Molière's dormitive virtue? You're relabeling the mystery, not solving it.

  **Marcus:** It's not a relabeling; it's an ontological commitment. You want to reduce the power to a conditional. I'm saying the conditional is true *because* of the power. The power is the truthmaker. In the masked case, the glass still possesses the power. The packaging doesn't negate the power; it prevents the power from *exercising* itself. The causal basis is there, directed toward the manifestation, but the path is blocked.

  **Elena:** "Directed toward." That's the language that worries me. As a scientist, if I tell you a wire conducts electricity, I mean electrons move under a potential difference. If you tell me it has a "power directed toward conduction," you've added a modal vector that does no work. In the antidote case—say, a poison neutralized by a co-administered chemical—you claim the poison retains its "power to kill" even if the victim survives. But if the causal chain is broken by the antidote, where is this power? It's causally inert.

  **Marcus:** It's not inert. It's engaged in a struggle. The antidote has a competing power. The poison's power is real; it's just overpowered or neutralized. If you deny the power exists because the manifestation didn't occur, you make the property dependent on the outcome. That makes causation contingent. I need the disposition to explain *why* the poison kills in the absence of the antidote. You say, "Because if taken, it would kill." I ask, "Why?" You say, "Because of its categorical basis." I ask, "Why does that basis necessitate death?" You have no answer but brute regularity. I say: because the basis *is* a power.

  **Elena:** But your "power" is epistemically inaccessible. I can measure the bond energy. I can measure the toxicity threshold. I cannot measure the "directedness." If your primitive powers don't add predictive value over the categorical basis plus the conditional, Occam's Razor cuts them away. And here's the rub: if the power is primitive, how do you distinguish a genuine disposition from a mere correlation? If I say this coin has a "power to land heads," and I treat it as a primitive property, I've ruined science.

  **Marcus:** We distinguish them by their place in the causal network. A coin landing heads isn't a manifestation of an intrinsic power of the coin; it's a probabilistic outcome of mechanics. Fragility isn't probabilistic in the same way; it's grounded in the essence of the material. But look, Elena, your RCA forces you to say the packed glass *isn't* fragile. That contradicts scientific practice. A materials scientist knows the glass is fragile even in the box. They handle it *as* fragile. Your analysis tells them they are mistaken about the property because the conditional is false.

  **Elena:** No, the scientist knows the *basis* is present. They know that *were the packaging removed*, the conditional would hold. My analysis can handle this by indexing the disposition to the basis. "x is fragile" means "x has a basis B such that, if x were struck and B persisted and no masks intervened, x would break."

  **Marcus:** "And no masks intervened." You're back to the circularity. To list the masks, you need to know what they mask. You need the concept of the disposition to identify the interferers. You cannot analyze the disposition in terms of conditionals if the conditionals require the disposition to be understood first. The primitive power view avoids this. The power is what it is. Masks are just other powers interacting with it. The analysis stops at the power, yes, but that's where explanation begins, not where it ends.

  **Elena:** But if the explanation begins there, it never leaves the metaphysical station. You're asking us to accept a fundamental modal feature of the universe that transcends the Humean mosaic of events. I'm asking you to accept that our talk of dispositions is a useful way of summarizing counterfactual dependencies grounded in categorical properties. The "failure" in the masking case is just a failure of the *summary*, not the property. We can refine the summary.

  **Marcus:** You can refine the summary until it's as complex as the world itself, but you'll never capture the *necessitation*. The glass breaks *because* it is fragile. Not because "If struck, it breaks" is true. The conditional is a symptom, not the disease. By refusing to acknowledge the power, you render the connection between basis and manifestation mysterious. Why does *this* lattice structure *necessitate* breaking? On your view, it just does. On mine, it does because the structure *is* a power-for-breaking.

  **Elena:** And on my view, saying it "is a power" adds nothing to "it necessitates breaking." You've turned a verb into a noun and pretended you've found a thing. I'd rather live with a complex conditional analysis that requires careful specification of stimuli than populate the world with invisible, primitive vectors of causality that look suspiciously like the dispositions they're meant to analyze.

  **Marcus:** And I'd rather populate the world with real causal agents than reduce causation to a logical relation between events that might not happen. The packed glass is fragile. The poison is poisonous. The conditional fails, but the property remains. That gap is where the power lives.

  **Elena:** Then we're at an impasse. You see a gap that requires a metaphysical bridge. I see a gap that requires a more precise semantic map.

  **Marcus:** Precisely. You want to map the territory. I'm telling you the territory has elevation.

  **Elena:** *Sips cold coffee.* Well, at least we agree the glass in the box should be handled with care.

  **Marcus:** *Smiles.* Whether because it has a power to break, or because the conditional probability of breakage rises sharply upon removal of the mask.

  **Elena:** I'll drink to that. But I'm still not buying the powers.

  **Marcus:** And I'm still not buying the conditionals.

  *They clink cups, the disagreement hanging in the air, as solid as the glass they discuss.*
