answer: |-
  The city of Ostra did not rest on land, but on stilts driven into the black rock of the sea floor. It was a place of pulleys, tides, and strict weights. To live in Ostra was to be measured. And no one measured more heavily than Kaelen, the Harbor Warden.

  Kaelen was not merely a man; he was the Seal. When he stamped a manifest, the grain entered the silos. When he raised the red flag, the ships burned. His identity was not his own; it was a vessel poured full of the city's need for order. He had no friends in Ostra, only counterparts. He had no family, only the Chain of Command.

  Until the *Iron Wake* docked at Pier Four.

  The ship was commanded by Torin, Kaelen's elder brother. They had not spoken in ten years, not since Kaelen took the Seal and Torin took to the open water. Torin believed the sea was wild; Kaelen believed the wild must be caged.

  The breach was discovered at dawn. A junior inspector found false bulkheads in the *Wake's* hold. Behind them lay casks of blister-oil, a volatile substance strictly banned within the harbor limits. A leak, a spark, and Ostra's wooden docks would become a pyre visible for a hundred miles. The law was absolute: smuggling blister-oil warranted the burning of the vessel and the drowning of the captain.

  Kaelen stood in the high tower, the Seal heavy on his chest. Below, the fog clung to the water. Torin was brought up the spiral stairs, guarded by two wardens with pikes. He looked older, salted by wind, but his eyes were the same dark stone as Kaelen's.

  "You know what you carried," Kaelen said. His voice was flat, the voice of the Tower, not the brother.

  "I know what I had to do," Torin replied. He did not bow. "The crew was starving, Kaelen. The trade routes were closed. The oil was the only currency the southern lords would take."

  "The oil risks ten thousand lives," Kaelen said. "The law does not weigh hunger against fire. It simply weighs the fire."

  "Then weigh it," Torin said. He stepped forward, the pikes crossing over his chest. The guards looked at Kaelen, waiting for the nod. The nod that would send Torin to the drowning cage.

  This was the fault line. Kaelen felt the crack run through the floorboards, up through the soles of his boots.

  In the philosophy of the old texts, a man is a knot of relationships. To the city, Kaelen was the Warden. To Torin, he was the younger brother. These were not hats he could swap; they were skins. If he favored the brother, he rotted the foundation of the city that fed the brother. If he favored the Warden, he severed the blood that gave him life.

  If Kaelen used the Seal to pardon Torin, he made the Law a lie. He would be saying that the safety of Ostra was negotiable for kin. The next smuggler would die, but the next rich merchant would live. The role of Warden would cease to exist, becoming merely a mask for nepotism.

  But if Kaelen signed the death warrant, he became a monster of flesh, even if he was a saint of office. He would be a brother who kills.

  Torin watched him. "Do it. Be the Warden."

  Kaelen looked at the Seal. It was iron, cold and unyielding. It represented the impartial eye. It demanded that Torin die to prove the Law was real.

  Kaelen reached for the ink. He dipped the quill. He wrote the condemnation on the parchment. *The vessel is to be burned. The captain is to be confined.*

  He stamped the Seal. The sound was like a bone breaking.

  Torin flinched, just once. The guards moved to take him.

  "Wait," Kaelen said.

  The guards froze.

  Kaelen unclasped the heavy iron chain from his neck. He lifted the Seal over his head. For a moment, he held the weight of the city in his hands. It was the sum of his authority, his purpose, his public self. Without it, he was just a man in a grey tunic.

  He placed the Seal on the desk. It sat there, heavy and silent.

  "The Warden has issued his judgment," Kaelen said softly. "The law is satisfied. The criminal is condemned."

  He stepped out from behind the desk. He walked around it, standing on the open floor of the tower, no longer behind the barrier of office.

  "But the Warden is no longer here."

  Torin's eyes widened. "Kaelen?"

  "I cannot stop the arrest," Kaelen said, looking at the guards. "The warrant is signed. The Law is in motion. If I countermand it now, I corrupt the office I just held. So I will not countermand it."

  He looked at his brother. "I am resigning my commission. Effective immediately. I am no longer the Harbor Warden. I am Kaelen of the *Wake*."

  "You can't," one of the guards stammered. "The Council..."

  "The Council will find a new Warden," Kaelen said. "Tell them the previous one died in this tower. Tell them whatever you like. My duty to the city ends when I walk out that door. My duty to my blood begins."

  He drew a knife from his belt—not a weapon of office, but a simple sailor's blade. He cut the cords binding Torin's wrists.

  The guards hesitated. They looked at the Seal on the desk, then at Kaelen. To attack a former Warden was treason. To obey a former Warden was mutiny. They were paralyzed by the vacuum of authority. Kaelen had not broken the law; he had vacated the seat that enforced it. The Law remained pure on the desk, but the hand that wielded it had let go.

  "Come," Kaelen said to Torin.

  "The ship—" Torin started.

  "Let them burn the ship. It belongs to the Warden's judgment. We belong to the tide."

  They moved past the guards. No pikes lowered. The structural bind had been severed not by bending the rule, but by stepping out of the geometry entirely. Kaelen had allowed the State to be right, and then he had left the State to be with the man.

  They descended the spiral stairs, the stone cool against their palms. The air below smelled of salt and tar, the smell of freedom and exile.

  When they reached the docks, the alarm bells began to ring. The resignation would be discovered soon. The new Warden would hunt them. Ostra had no place for men who stood outside the roles assigned to them.

  Torin looked at the small skiff Kaelen had pointed to. "You gave up everything. The tower. The honor. Your life."

  Kaelen pushed the skiff into the black water. He looked back at the city of stilts and stone, the rigid geometry of the docks where every plank had its place. He thought of the Seal sitting on the desk, cold and perfect. It was a heavy thing to wear. It had chafed his neck for years.

  He stepped into the boat and took the oars.

  "It was not my life," Kaelen said, meeting his brother's gaze. "It was a role I was playing. Like a worn-out sandal."

  He rowed them out into the mist, away from the measured weights and the strict tides. Behind them, the city stood rigid and just, holding its order intact. Ahead of them lay the open sea, chaotic and unmeasured, where a man was defined only by the person sitting opposite him in the boat.

  Kaelen rowed. He did not look back at the tower. He was no longer the Scale. He was just the brother, and for the first time in ten years, the weight was light.
