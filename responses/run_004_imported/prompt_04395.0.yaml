  3.  **Evaluate the "Principled Distinction" vs. "Rationalization":**
      *   *Argument for Principled:* It's consistent with his broader metaphysics (Platonism). He applied the same rigor to astrology as astronomy. He was willing to alienate traditional astrologers (who relied on Ptolemy/Arabic traditions). He admitted uncertainty and probabilistic nature (weather analogy).
      *   *Argument for Rationalization:* He needed money (Imperial Mathematician pay was sporadic). He couldn't fully abandon the cultural framework. The *anima telluris* is ad hoc (unfalsifiable). He still made predictions that were often vague or wrong.
      *   *Synthesis:* It's likely both. It's a sincere metaphysical commitment *that also* allowed him to continue a lucrative practice. But calling it *just* a rationalization dismisses the coherence of his Platonic worldview.

