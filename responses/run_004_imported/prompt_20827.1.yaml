      *   *Conclusion:* Summarize. It's a theorem about the consistency of Bayesianism, not a manual for resolving arguments at a dinner party.

  6.  **Refining the Tone:**
      *   Ensure I don't talk down. Use terms like "sigma-algebra," "conditional expectation," "martingale."
