answer: |-
  It is a pleasure to address a colleague who appreciates the elegance of a tight proof but remains suspicious of its physical—or in this case, epistemic—ontological commitments. Your intuition is sharp: the feeling that the theorem derives a substantive conclusion "for free" is not merely a symptom of unfamiliarity with epistemic logic. It tracks a genuine tension between the mathematical machinery and the phenomenology of disagreement.

  To answer your questions directly: The "work" is indeed being done by the definition of common knowledge (CK), which acts as a tremendously powerful information-pooling constraint. Philosophically, the theorem is best read as a *consistency check* on Bayesian rationality rather than a descriptive account of human discourse. Finally, your suspicion regarding the Common Prior Assumption (CPA) is well-founded; it carries the vast majority of the normative weight, and distinguishing priors from information is formally impossible without extra-theoretic assumptions.

  Here is the breakdown of the machinery and the philosophy.

  ### 1. Why Common Knowledge of the Number Suffices

  Your unease stems from the distinction between *evidence* (the signal) and *posterior* (the number). In a lab, if you and I measure different spin values, comparing the final numbers doesn't help; we must compare the apparatus calibration and raw data. Aumann's theorem suggests that if we merely announce our credences and *know that we know* them ad infinitum, the numbers must converge.

  Why? The key lies in the properties of the **meet** of the partitions.

  Let $\Omega$ be the state space. Agent $i$ has a partition $\Pi_i$ of $\Omega$. Their information at state $\omega$ is the cell $\Pi_i(\omega)$.
  Let $p_i(\omega) = P(E \mid \Pi_i(\omega))$ be agent $i$'s posterior probability for event $E$ at state $\omega$.
  The **meet** of the partitions, denoted $\Pi_1 \wedge \Pi_2$, is the finest common coarsening of $\Pi_1$ and $\Pi_2$. Intuitively, a cell in the meet represents the set of states that are indistinguishable to *both* agents given their combined information structures.

  **The Crucial Lemma:** If a random variable $X$ (in this case, the posterior probability $p_i$) is common knowledge at $\omega$, then $X$ is constant on the cell of the meet containing $\omega$.

  *Proof Sketch:* If $p_1$ is CK, then $p_1$ is measurable with respect to the meet. (If I know it, and you know that I know it, etc., the value cannot vary within any set of states we cannot distinguish between us).
  Since $p_i(\omega)$ is defined as the conditional expectation $E[\mathbb{1}_E \mid \Pi_i]$, and on the meet cell $M$, $\Pi_i$ is a refinement of $M$, the law of iterated expectations applies.
  Specifically, if $p_1$ and $p_2$ are both CK, they are both constant on $M$. Let these constants be $q_1$ and $q_2$.
  However, both $q_1$ and $q_2$ must equal the conditional probability of $E$ given the meet cell $M$ itself (because the posterior is an average over the partition cell, and the meet cell is a union of partition cells weighted by the prior).
  Therefore, $q_1 = P(E \mid M) = q_2$.

  **Addressing the "Free Lunch":**
  You asked why they don't need to learn the *evidence*. The answer is that under the Common Prior Assumption, the posterior *is* a sufficient statistic for the evidence *relative to the event E*.

  By making the posteriors Common Knowledge, you are not just sharing a number; you are effectively asserting that "within the set of worlds we cannot rule out jointly, my probability is fixed." Because you share a prior, the only reason our probabilities would differ is if our partitions cut the state space differently. But if the *values* of those cuts are common knowledge, the "meet" forces us to acknowledge a coarser grain of reality where our specific private cuts average out to the same value.

  It feels like a free lunch because CK is an infinitely strong condition. To say "I know your posterior" is weak. To say "I know that you know that I know..." implies that there is no state within our joint reach where you would have held a different posterior. This effectively simulates the pooling of information without the transmission of bits. It is less like two physicists comparing lab notebooks and more like two thermodynamic systems reaching equilibrium: if they are in contact (CK) and follow the same statistics (CPA), they must settle at the same temperature (Posterior), regardless of their specific microstates (Private Signals).

  ### 2. Philosophical Weight: Modest Fact or Substantive Constraint?

  Is this a deep truth about rationality or a triviality about an impossible state? The consensus among formal epistemologists leans heavily toward the latter, with a normative caveat.

  **The Descriptive View (Modest):**
  Common Knowledge of posteriors is vanishingly rare in the real world. For $p_1$ to be CK, I must not only know your number, but I must know that you aren't lying, that you aren't miscalculating, that you know I know, etc. In real discourse, communication is noisy, trust is imperfect, and computational limits exist. Therefore, the theorem does not explain why real people disagree; it simply delineates a boundary condition that real people almost never satisfy. It is a "no-go" theorem for a specific, idealized epistemic configuration.

  **The Normative View (Substantive):**
  However, the theorem connects to **Dutch Book arguments**. If we have a common prior, common knowledge of posteriors, yet different posteriors, we are susceptible to a sure-loss bet (a Dutch Book). We would both agree to a bet where I pay you if $E$ occurs and you pay me if not, based on our differing probabilities, and the math guarantees one of us loses money in every state in the meet cell.
  Thus, the theorem establishes that *persistent disagreement without betting* is irrational. If we disagree, we should bet. If we refuse to bet, we implicitly acknowledge that our posteriors are not truly common knowledge (perhaps I suspect your priors are different, or I think you are irrational).

  So, it is best read as a **consistency constraint**: You cannot claim to be a Bayesian, share a worldview (prior), fully understand each other's conclusions (CK), and yet disagree. One of those premises must go.

  ### 3. The Common Prior Assumption: The Heavy Lifter

  This brings us to your second, and perhaps more profound, question. How much work is the CPA doing?

  **The Identification Problem:**
  You asked if there is a principled, non-circular way to distinguish two people with different priors from two people with different information.
  **The short answer is No.**
  Formally, any difference in posterior beliefs can be modeled as:
  1.  Same Prior, Different Information (Likelihoods).
  2.  Same Information, Different Priors.
  3.  Some combination of both.

  Without access to the "true" data generating process or a metaphysical account of where priors come from, the distinction is underdetermined. If I believe the coin is biased (2/3 Heads) and you believe it is fair (1/2 Heads), I can model you as having a uniform prior but seeing different tosses than me, or as having seen the same tosses but starting with a dogmatic prior.

  **The Philosophical Burden:**
  Popular summaries often credit "Rationality" and "Common Knowledge" for the agreement result. This is misleading. The engine of the theorem is the **Common Prior**.
  If priors differ, the theorem collapses immediately. Agents can have CK of posteriors and disagree perfectly rationally.
  The defense of CPA usually rests on **Harsanyi's Doctrine**: rational agents with the same life experiences (same source of information) should have the same priors. Differences in belief should be traceable to differences in information, not "genetic" differences in reasoning.

  However, many philosophers (e.g., David Christensen, Adam Elga) argue that CPA is too strong. It rules out the possibility of "reasonable" fundamental disagreements about how to weigh evidence. If CPA is false, Aumann's theorem loses its bite as a constraint on disagreement. It becomes a tautology: "If two agents treat probability the same way and know each other's conclusions, they will have the same conclusions."

  **Your Physicist's Intuition:**
  In physics, we often assume that observers are interchangeable (permutation invariance). CPA is the epistemic version of this. It assumes that "you" and "I" are just labels for information-processing locations, not fundamentally different probabilistic entities.
  If you reject this—if you think rational agents can legitimately start with different "theories of the world" (priors) even before seeing data—then Aumann's theorem tells you nothing about real disagreement. It only tells you about the consistency of agents who already agree on the fundamental laws of probability and the weight of evidence.

  ### Summary

  1.  **The Mechanism:** Common Knowledge of posteriors suffices because CK forces the posteriors to be constant on the "meet" of the information partitions. Given a Common Prior, the conditional expectation on the meet cell must be unique. The "number" suffices because, under Bayesianism, the posterior *is* the sufficient statistic for the evidence regarding that event.
  2.  **The "Free Lunch":** It is not free; the price is the Common Knowledge condition, which is an infinitely strong informational constraint that effectively pools private information without transmitting it.
  3.  **Philosophical Status:** It is a modest descriptive fact (CK rarely holds) but a substantive normative constraint (disagreement + no betting = irrationality).
  4.  **The Common Prior:** This assumption does the heavy lifting. There is no empirical way to distinguish different priors from different information. The theorem's force depends entirely on accepting Harsanyi's Doctrine that rational agents *should* share priors. If you view priors as subjective starting points that can legitimately differ, the theorem's applicability to real-world disagreement evaporates.

  You are right to feel that the popular reception of the theorem often glosses over the fragility of the Common Prior Assumption. The theorem is less a proof that disagreement is impossible, and more a proof that **Bayesianism + Common Priors + Common Knowledge** is a tightly sealed system that leaves no room for it. Breaking the seal requires rejecting one of those three, and for real human disagreement, the Common Prior is the most likely candidate to fail.
