      *   *The "Truths of Fact" Distinction:* This is the key. Leibniz *already* admitted that contingent truths require infinite analysis. Complexity theory just quantifies *how* infinite or difficult that analysis is.
      *   *God's Perspective:* For God, calculation is instantaneous. Complexity is a limitation of finite creatures, not a flaw in the universe's structure.
      *   *The Goal of the Characteristica:* Was it meant to solve *everything* instantly? Or to reduce error and clarify thinking? Leibniz was pragmatic. He wanted to reduce disputes to calculation *where possible*.
      *   *Combinatorial Explosion:* Leibniz actually studied combinatorics (*Dissertatio de Arte Combinatoria*). He knew things get big fast. He hoped for shortcuts (heuristics), not brute force.
      *   *Undecidability:* This is harder. Gödel/Turing hit harder at the "complete formal system" idea. Leibniz believed in a consistent rational order. He might argue undecidability applies to formal systems, but reality (God's mind) is consistent.

  5.  **Drafting the Argument (Iterative Process):**

