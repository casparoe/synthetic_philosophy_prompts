      *   *Complexity:* P vs NP shows some things are computable but intractable (exponential time).
      *   *Implication:* Even if truth is formalizable, *finding* it might be physically impossible for finite beings.

  4.  **Synthesize: Leibniz vs. Complexity Theory:**
