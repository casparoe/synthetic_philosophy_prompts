          *   *Crucial Point:* The picture itself doesn't have an internal logical structure that *must* match the world to be meaningful. It's a tool for communication. If it misrepresents, it's usually a moral or empirical failure, not a logical impossibility. It's about *accuracy* of translation.

  3.  **Analyze Wittgenstein's *Tractatus* Picture Theory:**
      *   *Nature:* Logic, metaphysics, language limits.
      *   *Mechanism:* A proposition ($p$) is a picture of a state of affairs ($S$).
      *   *Relation to Reality:* Isomorphism. The elements of the proposition correspond to objects in the world. The *arrangement* of elements in the proposition corresponds to the *arrangement* of objects in the state of affairs. This is "logical form."
      *   *Misrepresentation:* How does a proposition picture falsely?
