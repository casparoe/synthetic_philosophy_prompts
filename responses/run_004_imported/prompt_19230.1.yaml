          *   If the arrangement in the picture does not match the arrangement in the world, the picture is *false*, but it is still a picture.
          *   *Crucial Point:* You cannot depict a logical impossibility (nonsense). You can only depict a possible state of affairs that happens not to obtain. Falsehood is a mismatch of configuration, not a failure of the picturing relationship itself.

