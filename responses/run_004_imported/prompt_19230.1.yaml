          *   Wittgenstein: Logical, abstract, structural. The sign does *not* need to resemble the object (a musical note isn't a sound, a word isn't a thing). It needs structural identity.
      *   *Tension:* Neurath is part of the Vienna Circle (Logical Positivism), which claimed inspiration from Wittgenstein. However, Neurath was physicalist and anti-metaphysical. Wittgenstein's *Tractatus* has mystical/ineffable elements. Neurath wanted to *change* society through visual data; Wittgenstein wanted to *show* the limits of language to stop philosophical confusion.

