      *   *Neurath:* Misrepresentation is a failure of *correspondence* based on convention. If I draw 5 men icons to represent 10,000 people (when the key says 1 icon = 1,000), I have lied. The picture is "false" because it violates the agreed-upon code or the underlying data. It is an external check (data vs. chart).
