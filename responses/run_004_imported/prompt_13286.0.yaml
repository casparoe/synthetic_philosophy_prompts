answer: |-
  This is a fantastic question. You have put your finger on exactly why the history of ideas matters: the same word ("supererogation") is doing very different work in a 16th-century confessional document than it is in a 20th-century analytic philosophy paper.

  As a chemist, you might appreciate this analogy: In theology, the "stoichiometry" of salvation is being debated. In secular ethics, we are debating the taxonomy of action. When the Anglican divines wrote Article XIV, they were attacking a specific economic model of the universe. When J.O. Urmson wrote "Saints and Heroes" (1958), he was trying to save Utilitarianism from being too demanding.

  Here is a walk-through of the theological argument in Article XIV, followed by an analysis of whether it has any traction against the secular philosophical concept.

  ### Part 1: Exegesis of Article XIV

  To understand why the Article calls supererogation "arrogant and impious," you have to understand the **Economy of Merit** that the Reformers were rejecting.

  **1. The Catholic Target: The Treasury of Merit**
  In late Medieval Catholic theology (as understood by the Reformers), God's law was viewed as a set of commandments that a believer was bound to obey. However, the Church taught that there were "Counsels of Perfection" (e.g., vows of poverty, chastity, obedience) that were not commanded of everyone. If a monk took these vows, he was doing *more* than the minimum required for salvation.
  Crucially, this created a surplus. This surplus merit went into a "Treasury of Merit" (administered by the Church), which could be dispensed to others (indulgences) to reduce their temporal punishment for sin.

  **2. The Reformers' Objection: The Balance Sheet**
  The Reformers (Luther, Calvin, and the Anglican divines) argued that this economic model was fundamentally broken for two reasons, which map directly to the "arrogancy" and "impiety" charges in the Article.

  *   **Why it is Arrogant (The Anthropological Claim):**
      The Article argues that humans are incapable of generating a surplus. Reformation theology posits "Total Depravity" (not that we are as bad as possible, but that sin affects every part of us). Therefore, even our best works are tainted.
      If you claim to have done *more* than your duty, you are claiming to have perfectly fulfilled your baseline duty *plus* extra. The Article asserts this is a lie. To claim you have paid God everything you owe *and* have credit left over is like a debtor telling the bank, "I've paid off my mortgage, and here's a million dollars for your personal vacation fund." Given the infinite gap between Creator and creature, the debtor never has surplus capital. Claiming you do is delusional arrogance.

  *   **Why it is Impious (The Theological Claim):**
      This is the heavier charge. Impiety is an offense against God's nature. If you can generate surplus merit, you make God your debtor. You shift the basis of salvation from *Grace* (God giving you what you don't deserve) to *Justice* (God paying you what you earned).
      This undermines the sufficiency of Christ. The Reformers argued Christ's merit is the *only* surplus that exists. For a human to claim they have their own surplus is to suggest Christ's sacrifice was insufficient to cover the debt, or that the human can add to the divine account. It treats God as a transactional partner rather than a sovereign Lord.

  **3. The "Unprofitable Servants" Clincher (Luke 17:10)**
  You guessed correctly on the source. In Luke 17:7–10, Jesus tells a parable about a master and a servant. The servant comes in from plowing or tending sheep. The master does not say, "Come sit and eat." He says, "Prepare my supper."
  Jesus concludes: *"So likewise ye, when ye shall have done all those things which are commanded you, say, We are unprofitable servants: we have done that which was our duty to do."*

  In the Greek, "unprofitable" (*achreioi*) literally means "without use" or "without surplus value."
  *   **The Logic:** Duty is maximal. If you do 100% of what is commanded, you have not created value *for God*; you have merely met the baseline of existence. You haven't given God a gift; you've just returned what was already His.
  *   **The Conclusion:** There is no mathematical room for "over and above." If the Commandment is "Love the Lord your God with all your heart, soul, and mind," you cannot love Him with *more* than "all." Therefore, supererogation is conceptually impossible in the vertical (human-God) relationship.

  ### Part 2: Does this have "Bite" against Secular Ethics?

  Now to your core question. Does this 16th-century theological grenade damage the modern philosophical project of Urmson, Wolf, and the Stanford Encyclopedia?

  The short answer is: **No, not directly.** But it does highlight a structural weakness in secular moral theory that Wolf herself exploits.

  Here is why the theological argument doesn't transfer cleanly, and where the echoes remain.

  **1. The Premise Mismatch (Grace vs. Autonomy)**
  The Article XIV argument relies entirely on a specific metaphysics:
  *   There is a Lawgiver.
  *   The Law is perfect and infinite.
  *   The Agent is inherently deficient (sinful).
  *   The Currency is Merit/Salvation.

  Secular moral philosophy (mostly) operates without these.
  *   In Utilitarianism (Urmson's context), duty is defined by *maximizing good*. Technically, Utilitarianism has no room for supererogation either (you are always obligated to do the most good). Urmson *invented* the modern category of supererogation specifically to carve out a space where you *don't* have to maximize, so that common morality makes sense.
  *   In Kantian ethics, duty is categorical. Doing "extra" isn't meritorious; it's just part of the moral law.
  *   In secular virtue ethics, there is no "bank" to store merit. Praise is social, not soteriological.

  Because the secularist doesn't believe they are "saving" themselves or "indebting" God, the charge of "impiety" vanishes. The charge of "arrogance" becomes merely a psychological observation (don't be a show-off), not an ontological claim.

  **2. The Definition of "Duty" (Maximal vs. Minimal)**
  This is where the rubber meets the road.
  *   **The Reformation View:** Duty is maximal (Perfect Love). We fail at it. Grace covers the failure. Therefore, no act is "extra" because we never hit the ceiling.
  *   **The Secular View (Urmson/Wolf):** Duty is minimal (The " Moral Minimum"). We can hit the ceiling. Anything above that line is supererogatory.

  The theological argument bites only if you accept the Reformation definition of duty. If you tell a secular ethicist, "Your duty is to love your neighbor as yourself perfectly," they will reply, "That is too demanding to be a binding obligation."
  In fact, Susan Wolf's "Moral Saints" paper is essentially an argument *against* the Reformation view of duty, secularized. She argues that if we define moral duty as "maximizing moral goodness," we end up with people who have no personality, no hobbies, and no life. She wants to protect the "non-moral" virtues.
  The Reformers wanted to protect *Grace*.
  Wolf wants to protect *Personal Integrity*.
  They arrive at similar conclusions (don't try to be a "saint" via works/obligation) for opposite reasons.

  **3. The "Credit" Problem**
  There is one area where the theological argument retains philosophical bite: **The motivation of moral credit.**
  Article XIV argues that claiming supererogation corrupts the motive. If I jump on a grenade to "bank merit," I am not actually being good; I am being a spiritual capitalist.
  In secular ethics, we worry about this too. If I do a supererogatory act *to be praised*, does it lose its moral worth?
  *   **Kant:** Yes. Duty must be done for duty's sake.
  *   **Virtue Ethics:** Maybe not. Praise reinforces virtue.
  *   **The Reformation:** It's worse than worthless; it's idolatrous.

  The theological argument reminds secular philosophers that categorizing an act as "supererogatory" might subtly encourage a transactional view of morality ("I'll do this nice extra thing, so I'm a Good Person"). It suggests that the *category itself* might incentivize the arrogance the Article warns against.

  ### Summary for your Book Club

  If I were synthesizing this for your group, I would frame it this way:

  1.  **The Theological Argument:** Supererogation is impossible because the debt to God is infinite. Claiming a surplus is a category error (arrogance) and a challenge to Christ's sufficiency (impiety). The "unprofitable servant" quote establishes that perfect obedience is merely the baseline, not a creditable excess.
  2.  **The Secular Counter:** We are not indebted to a Creator. We are autonomous agents negotiating social obligations. We need the category of supererogation to distinguish between what we can *blame* people for not doing (duty) and what we merely *praise* them for doing (saintliness).
  3.  **The Intersection:** The Reformation argument fails against secular ethics because it relies on premises (sin, grace, divine debt) that secularists reject. *However*, it raises a persistent challenge: **Where do we draw the line of duty?**
      *   If the line is too low, we allow moral laziness.
      *   If the line is too high (the Reformation/Wolf "Saint" problem), we make morality impossible or unbearable.

  The Anglican Article is not a logical refutation of Urmson; it is a competing metaphysical framework. But it serves as a powerful historical reminder that the distinction between "duty" and "extra" is not a neutral observation of reality—it is a theological and philosophical construct that depends entirely on who you think you owe, and how much.

  **One final nuance for the Minister in your group:**
  The Presbyterian/Reformed tradition actually *does* keep a form of supererogation, but redefines it. In the Westminster Confession, good works done by believers are "accepted in Christ," not because they are perfect, but because God imputes Christ's righteousness to the actor. So, the "surplus" exists, but it belongs to Jesus, not the human. The human is still an "unprofitable servant," but the Master treats them as a son anyway. That might be a fun distinction to tease out with him!
