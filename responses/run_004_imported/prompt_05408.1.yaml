      *   **Constraint 3:** Do *not* use Swampman/Duplicates (no history vs. identical structure).
      *   **Goal:** Invent an *original*, biologically realistic example where the two theories yield *different verdicts* (either on *what* the function is or *if* it has one).
      *   **Task:** Walk through the analysis from both sides, pinpoint the divergence, and provide an editorial judgment on whether this is a genuinely new angle or just the "heart-and-noise" case in disguise.

  2.  **Deconstruct the Theories:**
      *   **Etiological (Selected Effects - SE):** Function = What the trait was *selected for* in the evolutionary past. If it wasn't selected for, it has no function (even if useful now). If it was selected for $X$, $X$ is the function (even if it now does $Y$ better).
      *   **Causal-Role (Systemic - CR):** Function = What the trait *currently contributes* to the capacity of the containing system. History doesn't matter. Current utility matters.

  3.  **Brainstorming Scenarios for Divergence:**
      *   *Scenario A: Exaptation/Spandrel.* A trait evolves for reason $X$, but now does $Y$. SE says function is $X$. CR says function is $Y$ (if $Y$ contributes to system capacity).
          *   *Classic Example:* Feathers (insulation -> flight). *Constraint Check:* Is this too common? Maybe.
          *   *Idea:* A metabolic byproduct that becomes useful.
      *   *Scenario B: Recent Environmental Shift.* A trait was selected for environment $E1$, but now in $E2$ it does something else useful. SE says function relates to $E1$. CR says function relates to $E2$.
      *   *Scenario C: Vestigial Traits.* SE says function is lost (no longer selected for). CR says it might still have a minor role.
          *   *Problem:* Often vestigial traits do nothing. Need one that does *something*.
      *   *Scenario D: Pathological/Maladaptive Traits.* SE says no function (selected against). CR might say it contributes to a system capacity (e.g., fever).
          *   *Problem:* Fever is often cited.
      *   *Scenario E: Symbiosis/Microbiome.* A trait in the host that benefits the bacteria, or vice versa.
      *   *Scenario F: Behavioral Traits.* Mating dances that attract predators but also stimulate ovulation.

  4.  **Developing a Specific, Novel Example:**
      *   *Idea:* Let's look at **plant root exudates** in the context of **invasive species** or **rapid adaptation**.
      *   *Refinement:* Let's try a specific physiological mechanism in a specific animal.
      *   *Candidate:* The **spleen in diving mammals** (seals/whales). It stores red blood cells.
