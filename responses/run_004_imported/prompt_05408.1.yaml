      *   **Problem:** This is the "Exaptation" case again (Feathers). SE says "Plague Resistance," CR says "HIV Resistance." It's Function X vs. Function Y.
      *   *I need the "No Function" vs. "Function" divergence without Swampman.*
      *   *The "First Mutant" case is the strongest candidate for this.*
      *   Let's create a specific, realistic biological scenario around **Antibiotic Resistance Plasmids**.
