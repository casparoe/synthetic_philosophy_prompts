answer: |-
  Here is a candidate example designed to bypass the usual suspects (hearts, swampmen, and moth wings) while driving a wedge between the two theories.

  ### The Case of the "Day-One" Beta-Lactamase

  **The Organism:** *Staphylococcus aureus* (a common bacterium).
  **The Trait:** A novel variant of the beta-lactamase enzyme.
  **The Context:** A hospital ward introduces a new, synthetic antibiotic ("Drug X") that no existing bacterial strain can degrade. In a specific patient, a spontaneous point mutation occurs in a single bacterium's plasmid DNA. This mutation alters the shape of the beta-lactamase enzyme just enough that it can now hydrolyze (break down) Drug X. This is a *de novo* mutation; it has never existed in this lineage before. The bacterium survives the treatment and divides once.

  Here is how the two camps analyze the function of this enzyme variant.

  #### 1. The Etiological (Selected Effects) Verdict
  **Verdict:** The trait **has no function** (regarding Drug X resistance).

  **The Reasoning:** For etiological theorists like Karen Neander or Ruth Millikan, a "proper function" is a historical property. A trait's function is the effect for which it was *selected* in the past. Selection requires a feedback loop: the trait must have contributed to the reproduction of ancestors, causing the trait to be present in descendants.

  In this specific case, this is the *first* instance of the mutation. There is no history of selection for Drug X resistance because Drug X is new, and the mutation is new. The enzyme's ability to degrade Drug X is, etymologically speaking, a "happy accident" or a mere causal capacity. It does not become a function until the bacterium's descendants proliferate *because* of this trait, establishing a lineage selected for that specific effect. Until the lineage is established, the trait is functionless regarding the antibiotic, even if it saves the host cell's life.

  #### 2. The Causal-Role (Systemic) Verdict
  **Verdict:** The trait **has a function**.

  **The Reasoning:** For causal-role theorists following Robert Cummins, function is about current contribution to a containing system's capacity. We analyze the bacterium as a complex system. We ask: "What does this part (the enzyme) do that contributes to the capacity of the whole (the bacterium's survival/replication)?"

  The enzyme degrades Drug X. This degradation contributes directly to the bacterium's capacity to survive in its current environment. The history of the enzyme is irrelevant; the fact that it was a random mutation five minutes ago does not change the fact that it is currently playing a specific causal role in the maintenance of the organism. Therefore, its function is Drug X resistance.

  #### 3. The Point of Divergence
  The split here is not about *which* effect is the function (as in the heart's pumping vs. thumping). Both sides agree the enzyme degrades the drug and that this helps the bacterium.

  The split is about **the temporal onset of functionhood.**
  *   **Etiological:** Function is a **normative status** earned over time. You must be "chosen" by history to have a function. A new trait is functionally neutral until selection acts on it.
  *   **Causal-Role:** Function is a **descriptive status** of current organization. If it works, it has a function.

  ### Editorial Judgment: Is This New, or Just the Heart in a Lab Coat?

  Your source—the philosopher who suspects every new example is just the heart-and-noise case wearing a costume—is **half-right, but misses a crucial nuance.**

  **Where the source is right:**
  At the deepest metaphysical level, this *is* the same dispute. The heart case asks: "Why is pumping a function but thumping isn't, when both are causal effects?" The answer from the Etiological camp is: "Because pumping was selected, thumping wasn't." The Bacteria Case asks: "Why is degrading the drug not a function yet?" The Etiological answer is: "Because it hasn't been selected yet." Both examples ultimately hinge on the same axiom: **Selection history is necessary for function.** If you reject that axiom, you are a Causal-Role theorist; if you accept it, you are an Etiological theorist. In that sense, no example can ever "solve" the debate, because the debate is about the axiom, not the illustration.

  **Where the source is wrong (and why you should use this example):**
  The Heart example obscures a specific tension that the Bacteria example exposes: **The Problem of Novelty.**

  In the Heart case, the trait is old and stable. The disagreement is about filtering *multiple effects* of an established trait. In the Bacteria case, the disagreement is about the *birth* of a function. This highlights a practical vulnerability in Etiological theory that the Heart example hides: **The Lag Problem.**

  Etiological theory implies that when a completely new, life-saving adaptation arises, it is technically "functionless" until the second generation. For a magazine feature, this is a compelling narrative hook. It forces the Etiological theorist to admit that, strictly speaking, evolutionary innovation begins as functionless noise. It makes the abstract debate about "normativity" concrete: *When exactly does a useful accident become a biological purpose?*

  **Recommendation:**
  Use the **"Day-One Mutant"** example. It satisfies your constraints (no heart, no camouflage, no Swampman), it is biologically realistic (antibiotic resistance is a high-stakes, familiar context), and it shifts the focus from "distinguishing effects" to "timing the onset of function."

  It proves your source's suspicion that the *underlying logic* is the same, but it demonstrates that the *consequences* of that logic change dramatically when we look at rapid evolution rather than stable organs. It shows that the Etiological view isn't just about categorizing parts; it's about denying functional status to the cutting edge of evolution until history catches up. That is a much richer story for a feature than one more explanation of why hearts don't sing.
