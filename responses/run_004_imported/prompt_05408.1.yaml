      *   **The Example:** The "First Mutant" Beta-Lactamase in *S. aureus*.
      *   **The Setup:** A hospital setting, new drug, spontaneous mutation.
      *   **Etiological Analysis:** Focus on the lack of selection history. "Proper function" requires a lineage of reinforcement.
      *   **Causal-Role Analysis:** Focus on current systemic contribution. The enzyme *does* the work.
      *   **The Divergence:** Existence of function vs. Non-existence.
      *   **Editorial Judgment:** Is this new?
          *   *Honest Assessment:* It is technically distinct from the Heart (which distinguishes *which* effect is the function). This distinguishes *whether* it is a function.
          *   *However:* It leans heavily on the "Normativity" debate which is core to the Heart case (why is pumping normative but thumping isn't?).
          *   *Verdict:* It's a fresh *application*, but philosophically, it might still be the same underlying disagreement about whether "function" implies "success over time" or "current utility." I should be honest with the user. It's a "New Dress" but perhaps a better tailored one. It exposes the *temporal* lag in SE theory that the Heart example obscures.

  6.  **Refining the Example for Maximum Impact:**
      *   Make sure the bacterium survives. If it dies immediately, CR might say "it didn't contribute."
      *   So, the bacterium survives the dose.
      *   SE says: "It survived, but the trait isn't a function yet because the *lineage* hasn't been selected." (Neander is strict about this).
      *   CR says: "It survived because of the trait. The trait functioned."
      *   This highlights the **Individual vs. Lineage** tension. SE is inherently population-level. CR is often system/individual level.
      *   This is a genuine point of divergence that the Heart example (which focuses on effects within an individual) glosses over.

  7.  **Final Polish:**
