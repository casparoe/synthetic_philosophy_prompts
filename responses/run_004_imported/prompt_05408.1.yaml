          *   *SE:* Function is metabolizing $A$ (history). Metabolizing $B$ is accidental benefit.
          *   *CR:* Function is metabolizing $B$ (current contribution to survival in current environment).
          *   *Critique:* This is the "exaptation" case. Is it distinct enough from feathers?
      *   *Candidate:* **A behavioral trait in a changing climate.**
