      *   *SE:* Function = Water conservation (history). UV shielding is a fortuitous side effect.
      *   *CR:* Function = UV shielding (current critical contribution to organismal capacity/survival). Water conservation is negligible now.
      *   *Critique:* This works. It avoids the heart, camouflage (it's internal crystals), and Swampman. It relies on an environmental shift changing the *current* utility vs. the *past* selection pressure.

      *   *Wait, is UV shielding "camouflage"?* No, it's physiological protection.
      *   *Is it too close to "feathers"?* Feathers are the classic exaptation case. I need to ensure the divergence is sharp. In the feather case, SE says "insulation," CR says "flight" (or vice versa depending on timeline).
      *   *Let's sharpen the "No Function" vs. "Has Function" divergence.* This is more dramatic than "Function X vs. Function Y".
      *   *How to get "No Function" (SE) vs. "Has Function" (CR)?*
