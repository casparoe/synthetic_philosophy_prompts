      *   **Specific Moment:** Generation 31,500. The mutation *just* happened. The bacterium consumes citrate.
      *   **SE:** Has the trait been selected *yet*? If it's the *very first* individual, there is no history of selection. SE says: **No Function** (or at least, the function is not yet established). It is a mere capacity.
      *   **CR:** The trait contributes to the capacity of the bacterium to survive in citrate-rich media. **Has Function.**
      *   **Divergence:** SE says "Not yet a function." CR says "Function exists immediately upon systemic contribution."
      *   **Is this Swampman?** No. It has a lineage. It just hasn't undergone *selection* for this specific trait yet. It's a "New Trait" case.
      *   **Is this Heart/Noise?** No. It's not about distinguishing effects. It's about the *temporal onset* of function.
      *   **Philosophical Weight:** This hits the "Normativity" vs. "Descriptivity" split. SE implies function is a normative status earned over time. CR implies function is a descriptive status of current organization.

      *   *Let's flesh this out.*
