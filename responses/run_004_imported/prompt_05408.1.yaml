      *   *I need to break the structural identity.* How?
      *   The Heart case relies on **one trait, two effects, one selected.**
      *   To be different, I need **one trait, one effect, disagreement on history.**
      *   Or **disagreement on whether 'history' is required at all.**
      *   Let's try a **Recent Mutation** case that isn't Swampman.
