      *   **CR (Cummins):** The cellulose production contributes to the capacity of the colony (once formed) or the cell (access to oxygen) to survive. It has a function immediately.
      *   **Wait, CR usually applies to systems.** Does a single cell count? Yes, containing system = the cell.
      *   **Refinement:** Let's make it a **physiological trait in a multicellular organism** to avoid "is a bacterium a system" debates.
      *   **Organism:** **A human with a novel genetic resistance.**
      *   **Trait:** **CCR5-delta32 mutation (HIV resistance).**
      *   **Scenario:** Before the HIV epidemic (or in a hypothetical future virus scenario).
