          *   *Trait:* Shivering thermogenesis before flight.
          *   *History:* Evolved to warm up in cold mornings.
          *   *Current Situation:* Climate change has made mornings warm, but a new fungal pathogen attacks at specific temperatures. Shivering raises body temp *above* the fungal tolerance threshold.
          *   *SE:* Function = Warming for flight muscle efficiency (history). The antifungal effect is a lucky side effect.
          *   *CR:* Function = Immune defense (current contribution to survival).
