answer: |-
  This is a classic debate in formal epistemology. Your friend is articulating what is known as the **"Pragmatic Objection"** to Dutch Book Arguments (DBAs), and your intuition that there is a deeper, non-pragmatic point is correct.

  Here is how you can arm yourself for the rematch, broken down into the two parts you asked for.

  ---

  ### Part 1: Saving the Synchronic Argument (Coherence)

  Your friend's objection is: *"Rationality is about believing the truth, not protecting your wallet. If I don't bet, I don't lose money. Therefore, incoherent credences aren't irrational, just potentially costly."*

  To counter this, you need to move from a **Pragmatic Dutch Book** (you lose money) to a **Depragmatized Dutch Book** (your judgments are logically inconsistent).

  **1. Credences *are* Betting Prices**
  The first step is to establish that having a credence of $X$ in proposition $A$ *just means* that you judge a ticket paying \$1 if $A$ is true (and \$0 if false) to be fair at price $\$X$. This is the Ramsey-de Finetti thesis.
  *   If you say $P(A) = 0.6$, you are saying, "I value this ticket at 60 cents."
  *   If you say $P(\neg A) = 0.6$, you are saying, "I value this ticket at 60 cents."

  **2. The Inconsistency is in Valuation, Not Loss**
  If you hold both those credences, you value the pair of tickets at \$1.20. But logically, one of them *must* pay out \$1 and the other \$0. Together, they are a guaranteed \$1 payout.
  *   **The Friend's View:** "So what? I won't buy them."
  *   **The Counter:** It doesn't matter if you buy them. The irrationality is that you **value a guaranteed \$1 as being worth \$1.20.**

  This is not about a bookie tricking you; it is about you holding two simultaneous valuation judgments that cannot both be true. It is akin to looking at a single object and judging it to be 1 meter long, while simultaneously judging it to be 1.2 meters long. Even if you never use a ruler, your *judgments* are inconsistent.

  **3. The "Depragmatized" Argument (David Christensen)**
  Philosopher David Christensen formalized this. He argues that the money is just a heuristic device to make the inconsistency visible. The core defect is **incoherent preference.**
  *   If your credences are incoherent, you prefer a sure loss to a possible gain *by your own lights*.
  *   If you refuse to bet, you are essentially admitting that your betting prices (credences) do not reflect your actual valuation. But if your credences don't reflect your valuations, what do they represent?

  **The Takeaway for your Friend:**
  Tell him: "The Dutch Book doesn't prove you're gullible; it proves your system of valuation is logically broken. If $P(A) + P(\neg A) > 1$, you are mathematically committed to the claim that a whole is less than the sum of its parts. That's a logical error, not a financial risk."

  ---

  ### Part 2: Why the Diachronic Argument (Conditionalization) is Weaker

  You and your friend are right to feel that the argument for updating by Conditionalization (changing your beliefs over time) is shakier than the argument for coherence (beliefs at one time).

  **The Setup:**
  *   **Synchronic:** At time $t$, $P(A) + P(\neg A)$ must equal 1.
  *   **Diachronic:** At time $t_1$, you have credence $P_1$. At $t_2$, you learn evidence $E$. Your new credence $P_2$ should equal your old conditional credence $P_1(H|E)$.

  **The Diachronic Dutch Book (Lewis 1999):**
  A bookie can make a series of bets with you at $t_1$ and $t_2$ that guarantee you a loss if you update in a way that violates conditionalization.

  **Here are the four main reasons philosophers think this argument is weaker:**

  #### 1. The "Evidence Certainty" Assumption
  The synchronic argument works for any propositions. The diachronic argument for strict Conditionalization only works if you learn evidence $E$ with **100% certainty**.
  *   In real life, we rarely get certain evidence. (e.g., "It looks like it's raining" vs. "It is raining").
  *   If evidence is uncertain, you should use **Jeffrey Conditionalization**, not strict Conditionalization. The standard Dutch Book argument doesn't apply cleanly there, making the norm less universal.

  #### 2. The Bookie's Epistemic Advantage
  In a synchronic Dutch Book, the bookie just needs to know your current credences. In a **Dynamic Dutch Book** (diachronic), the bookie needs to know:
  1.  Your current credences.
  2.  **Your updating rule in advance.**
  3.  **Exactly what evidence you will receive.**

  If the bookie doesn't know what evidence you're going to get, they can't set up the second half of the trap. This makes the "sure loss" dependent on the bookie having knowledge that is often unavailable in the real world. It makes the irrationality seem more like a vulnerability to a specific kind of omniscient predator, rather than an internal logical flaw.

  #### 3. The Reflection Principle and Self-Trust (Van Fraassen)
  This is the biggest philosophical hurdle. The diachronic argument assumes you should trust your future self's rationality.
  *   **Bas van Fraassen** argued that you are not required to align your current beliefs with your expected future beliefs if you think your future self might be compromised.
  *   *Example:* I know that after three glasses of wine, I will become incredibly confident that I can drive home safely. My current self ($P_1$) should not update to match my drunk future self ($P_2$).
  *   If I violate conditionalization because I anticipate my future self will be biased, am I irrational? The Dutch Book says "Yes, you're exploitable." Intuition says "No, you're being prudent."
  *   Synchronic coherence doesn't have this problem; there is no time gap for your brain to degrade.

  #### 4. Rule vs. State
  *   **Synchronic Coherence** is a constraint on a **state**. If you violate it, you are currently in a contradictory state.
  *   **Conditionalization** is a constraint on a **process**. It dictates how you must move from state A to state B.
  *   Critics argue that there might be legitimate reasons to change your mind that aren't captured by conditionalization (e.g., conceptual change, realizing a hypothesis was ill-formed). Punishing these changes with a Dutch Book seems to stifle legitimate belief revision.

  ### Summary for the Argument

  **On Coherence (Synchronic):**
  Tell your friend the "Depragmatized" view. The money is irrelevant. The issue is that incoherent credences entail valuing a guaranteed \$1 payoff as something other than \$1. That is a logical contradiction in valuation, regardless of whether a bookie exists.

  **On Conditionalization (Diachronic):**
  Agree with him that it's weaker. The synchronic argument exposes a **logical contradiction** in your current mind. The diachronic argument exposes a **strategic vulnerability** over time that relies on strong assumptions (certain evidence, bookie knowledge of your rule, and total trust in your future rationality). You can be incoherent and be wrong *now*; you can violate conditionalization and arguably be being *cautious* about your future self.

  **Recommended Reading (if you want to dive deeper):**
  *   **For Coherence:** David Christensen, *"Depragmatized Dutch Book Arguments"* (1991).
  *   **For Conditionalization:** David Lewis, *"Why Conditionalize?"* (1999) vs. Bas van Fraassen, *"Belief and the Will"* (1984).
