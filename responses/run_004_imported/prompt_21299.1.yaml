prompt: |-
  I had a long, kinda ridiculous argument with my friend last night about Dutch book arguments that never really got resolved. His position: sure, if your credences don't add up right, some genius bookie could in principle build a set of bets that cleans you out, but nobody's actually going to show up with that exact book, and you could just refuse to bet in the first place -- so how does 'you'd lose money in a scenario that will never happen' show your beliefs are irrational, rather than just risky if acted on? I said there's supposed to be a way to make the point stick without any actual bookie or money involved, just from the fact that you're committed to inconsistent judgments about which bets count as fair, but I couldn't actually spell that out when he pushed back. Seperately, we both kind of agreed that even if the argument for having coherent credences at a single time is solid, the parallel argument for updating by conditionalization over time is on shakier ground -- but neither of us could say why. Two things I'd love your help with: is there a version of the Dutch book argument for coherence that doesn't just reduce to 'you're exploitable if you're unlucky,' and why exactly do people think the diachronic argument (for conditionalization) is weaker than the synchronic one (for coherence)?
