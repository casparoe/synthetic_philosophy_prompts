  First, a quick structural note: In the actual historical "Grudge Informer" cases (and the Hart-Fuller debate), this specific argument—that the old statute was null and void *ab initio*—is typically the **Prosecution's** tool to secure a conviction. The **Defense** usually argues the Positivist position ("It was on the books, my client followed the law, you cannot punish him retroactively").

  If your **Defense Attorney** is making the Natural Law argument, they are essentially arguing that their client is a common murderer rather than an official acting under color of law (which might be a strategy to reduce the charge, or perhaps your character is trying to expose the regime's hypocrisy). However, assuming you want the **strongest version of the argument to secure a conviction** (which is where the philosophical weight lies), I have drafted this as the **Special Prosecutor's** closing argument. If this is indeed your Defense Attorney, they are effectively arguing for their client's guilt on moral grounds to avoid a legal precedent that saves the regime's architects—a fascinating character choice, but philosophically, this is the sword, not the shield.

  Here is the argument. It is designed to be Hart-proof by focusing on the *internal* requirements of law, not just external morality, and by reframing "retroactivity" as "restoration."

  ***

  **The Argument**

  " The Defense asks you to look at the statute book of the previous regime and see a rule. They point to the ink, the seal, the date of enactment. They tell you that because the words were written down and enforced by men with guns, they possessed the force of law. They tell you that to say otherwise is to lie about the past. They tell you that if we punish the accused now for following those words, we are engaging in retroactive justice.

  "They are asking you to confuse a command with a law.

  "A command is a threat. 'Do this, or we will hurt you.' A regime of terror is very good at commands. It can print them, bind them in leather, and force judges to sign them. But a law is something more. Law, by its very nature, aspires to be a bridge between human conduct and rules. It requires a certain inner morality. It must be general, not targeted. It must be public, not secret. It must not demand the impossible. And crucially, it must not be a vehicle for one human being to devour another without recourse.

  "The statute under which the accused reported his neighbor did not aspire to justice. It did not aspire to order. It aspired to terror. It was designed not to govern, but to isolate. It turned the citizenry into a cage where every neighbor was a potential executioner. When a statute is used not to regulate conduct but to sanction murder disguised as procedure, it ceases to strive for the very end that gives law its name.

  "Gustav Radbruch, a jurist who lived through the collapse of a tyranny much like our own, told us that when the conflict between positive statute and justice reaches an 'intolerable level,' the statute must yield. It does not merely become 'bad law.' It surrenders its legal character entirely. It becomes, in the words of Fuller, a perversion of law.

  "Now, the Defense cries 'Retroactivity!' They say, 'You are punishing him today for something that was allowed yesterday.' They say we should be honest and pass a new law to catch him. But that is the trap. If we pass a new law to punish him, we admit that the old regime's statutes *were* valid law, merely immoral ones. We admit that the state had the right to execute his neighbor, and we are just changing our minds about the informer.

  "We are not changing our minds. We are recognizing a reality that was true then, even if we were too afraid to speak it. The protection the accused thinks he hid behind was an illusion. It was a shield made of paper that dissolved the moment it was used to spill innocent blood.

  "To declare that statute void now is not to reach back into the past and change it. It is to refuse to let the past reach forward and poison us. It is to say that the continuity of law was not broken by our revolution, but by the tyranny that preceded us. We are not the ones interrupting the legal order. We are the ones restoring the timeline that was interrupted.

  "Hart warned us that calling evil 'non-law' is a form of dishonesty. I submit to you that the greater dishonesty is to look at a murder warrant, stamped by a dictator, and call it 'Law' simply because it was efficient. If we do that, if we validate the statutes of the terror simply because they were 'on the books,' we are not upholding the Rule of Law. We are upholding the Rule of Rules. And a system that cannot distinguish between a judgment and a death warrant does not deserve the name of a legal system.

  "The accused did not follow the law. There was no law to follow. He followed an order. And for that order, he is answerable not to the statute book of a dead regime, but to the conscience of a living one."

  ***

  ### Why this works (and how to handle the counter)

  This speech avoids the strawman by making three specific moves that address Hart's critiques directly:

  1.  **It shifts from "Morality" to "Legality" (The Fuller Move):**
      *   *Weak Argument:* "The law was evil, so it wasn't law." (Hart crushes this: "Who decides what's evil?")
      *   *Strong Argument:* "The statute failed the *internal* criteria of law (generality, non-contradiction, aspiration to justice)." This argues that the old regime didn't just make *bad* laws, it failed to produce *law* at all. It was a system of commands. This makes the argument jurisprudential, not just emotional.

  2.  **It reframes Retroactivity as Restoration (The Continuity Move):**
      *   Hart's strongest point is that declaring the old law void *now* is secretly retroactive punishment.
      *   This speech counters by arguing that the *tyranny* broke the legal continuity, not the new court. By voiding the statute, the court isn't changing the past; it's refusing to let the "interruption" of tyranny become part of the legal record. It claims the new regime is the *true* successor to the pre-tyranny rule of law, skipping over the "illegal" regime in between.

  3.  **It addresses the "Honesty" Objection:**
      *   Hart argued it would be more honest to pass a retroactive law and admit the unfairness.
      *   The speech argues that doing so validates the old regime's authority. To admit the old law was "valid but evil" contaminates the new system. It argues that "honesty" requires naming the nature of the beast: it wasn't law, it was violence.

  ### The Prosecutor's Weakness (For your Prosecutor to exploit)

  If you want the Prosecutor (or Defense, depending on your setup) to have a strong rebuttal that doesn't sound like a strawman, they should attack the **Danger of Judicial Overreach**.

  **The Hartian Counter-Argument:**
  " Counsel speaks beautifully of justice. But who gives *them* the power to decide which statutes were 'intolerably unjust'? Today, they void a statute that allowed executing a man for a joke. We all agree that is good. But tomorrow, what if they decide a property law is 'intolerably unjust' and void it? By blurring the line between 'law' and 'good law,' they give judges the power to strike down any rule they dislike.
  Hart was right: It is better to be honest. Yes, we should punish this man. But we should pass a new law, openly, admitting that we are punishing him for an act that was technically legal at the time. We should own the retroactivity. By pretending the old law was never valid, this court is engaging in a metaphysical sleight of hand that undermines the certainty of *all* law. They are asking you to trust not in the code, but in the conscience of the judge. And that is the first step toward the very tyranny we claim to reject."

  This creates the tension you want: **Justice for the Victim** (Radbruch) vs. **Certainty for the Future** (Hart). Both sides have a point, and neither is easily dismissed.
