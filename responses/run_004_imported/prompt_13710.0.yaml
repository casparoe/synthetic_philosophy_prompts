      *   *Check:* Did I represent Dennett accurately? Yes, focus on *Real Patterns* (1991) and the Intentional Stance.
      *   *Check:* Is the distinction clear? Hard Realism = "It's in the weights." Dennett = "It's in the prediction."
      *   *Critique:* Make sure not to dismiss the user's skepticism. It's valid. The "messy geometric blob" is a good description of high-dimensional space.
      *   *Refinement:* Emphasize that Dennett allows features to be real *even if* polysemantic, as long as they track behavior. But acknowledge that for *control*, we need more.

