      *   McClennen (1990): Resolute choice is proposed to save rationality, but acknowledges the cost.
      *   The consensus is: You can't have Transitivity, Separability, and Dynamic Consistency all together if you allow cycles. If you keep cycles and use sophistication, you lose Separability. Thus, the "irrationality" isn't gone; it's moved to the dynamic norm. The student says "only naivety is [irrational]." This implies the dynamic norms are fine and the cycles are fine. That's the error.
