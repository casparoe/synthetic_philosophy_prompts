      *   **Point 4: The Hierarchy of Languages.** Leibniz's notion of reflection and higher-order reasoning anticipates Tarski/Gödel. The mind can step outside the system. This fits his view of the Monad's capacity for reflection (reasoning about reasoning).
      *   **Conclusion:** GIT hurts Leibniz's *project* (completeness of human logic) but saves his *metaphysics* (mind is not a machine). He would reject the idea that the mind *is* a formal system, aligning with Lucas-Penrose, but ground it in monadology, not just arithmetic.

