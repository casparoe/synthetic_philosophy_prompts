      *   *Linguistic Context:* In the 18th century, "realize" meant both "to make real" (from *réaliser*) and "to convert into money/profit" (commercial usage). The psychological sense ("become aware") is less dominant then but present in the concept of "awakening."
      *   *Smith's Usage:* Smith says "realize this golden dream."
