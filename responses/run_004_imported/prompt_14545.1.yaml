      *   *Conclusion:* Therefore, Thomson's Lamp is solved the same way. The state at $t=2$ is determined by the limit of the process.
      *   *The Conflict:* Philosophers say the state at $t=2$ is undefined/indeterminate.

  3.  **Identify the Core Philosophical/Mathematical Distinction:**
      *   **Zeno (Achilles):** We are asking about *position* in space. Position is a continuous function of time. If $x(t)$ is continuous, $\lim_{t \to 2} x(t)$ equals $x(2)$. The limit *defines* the endpoint.
      *   **Thomson's Lamp:** We are asking about the *state* of a discrete switch (On/Off). The state function $S(t)$ is discontinuous at every flip.
