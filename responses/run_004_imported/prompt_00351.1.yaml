  so I've read a bunch of LW posts over the years and it feels like MWI just gets treated as the obviously correct answer once you understand decoherence, and Bohmian mechanics barely gets a mention except as a punching bag. make the strongest case you can for why a good Bayesian should actually assign more credence to pilot-wave theory than the typical rationalist consensus does. don't just lean on "it's deterministic and avoids collapse," actually engage with why the standard dismissals (nonlocality being "worse" than MWI's ontology, no clean relativistic extension yet, the guiding equation feeling ad hoc) are weaker objections than people give them credit for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

