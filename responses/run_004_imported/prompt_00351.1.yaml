      *   *The "Ad Hoc" Charge:* Is the guiding equation really more ad hoc than the branching structure of MWI?
      *   *Relativity:* It's a work in progress, not a impossibility proof. MWI has its own QFT issues (basis problem).
      *   *Bayesian Update:* If MWI's derivation of the Born Rule is circular or shaky, that should lower its posterior.

