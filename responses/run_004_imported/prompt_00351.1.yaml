answer: |-
  This is a sophisticated request that cuts to the heart of how the rationalist community applies Bayesian epistemology to physics. The LessWrong consensus (heavily influenced by Eliezer Yudkowsky's *The Quantum Physics Sequence*) treats Many-Worlds (MWI) as the "default" because it allegedly requires the fewest additional postulates beyond the Schrödinger equation. Bohmian Mechanics (BM) is often dismissed as "MWI plus useless extra variables" or "nonlocal magic."

  However, a rigorous Bayesian analysis requires examining priors, likelihoods, and the specific evidential weight of "solving" the measurement problem. Here is the case for why a good Bayesian should assign significantly higher credence to Pilot-Wave theory than the typical rationalist consensus allows, by engaging directly with the standard objections.

  ### 1. The Born Rule Problem: MWI's Likelihood Penalty
  The strongest Bayesian argument for BM is not that it is deterministic, but that **MWI has not satisfactorily solved the problem of probability.**

  In a Bayesian framework, a theory must account for the data. The data includes not just interference patterns, but the *statistical frequencies* of outcomes (the Born Rule: $P = |\psi|^2$).
  *   **BM:** Postulates the "Quantum Equilibrium Hypothesis." If the initial distribution of particles matches $|\psi|^2$, the guiding equation ensures they stay that way (equivariance). It takes the probability measure as a boundary condition.
  *   **MWI:** Must *derive* probability from a deterministic wavefunction where everything happens. If all outcomes occur, what does it mean to say one is "more probable"?

  The LW consensus often leans on the Deutsch-Wallace decision-theory derivation. However, many philosophers of physics (e.g., Kent, Price) argue this is circular or conflates *caring measures* with *frequencies*. If you are a Bayesian, you need to know why you should bet at 2:1 odds if both outcomes definitely happen.

  **The Bayesian Update:** If you assign a non-zero probability to the claim that "MWI's derivation of the Born Rule is circular or incomplete," MWI's posterior probability drops significantly. BM, by contrast, takes the Born Rule as an initial condition (similar to how thermodynamics takes the Past Hypothesis). While not a "derivation," it is a clear mapping to empirical data. A Bayesian should penalize MWI for the ambiguity of its likelihood function regarding probability.

  ### 2. Ontology: 3D Space vs. High-Dimensional Hilbert Space
  The standard LW objection to BM is "ontological bloat": *Why add particles if the wave is enough?*
  But this ignores the ontological cost of MWI.

  *   **MWI Ontology:** The fundamental reality is a wavefunction living in **Configuration Space** (3N dimensions for N particles). Our experience of 3D space is an emergent phenomenon resulting from decoherence and the structure of the Hamiltonian.
  *   **BM Ontology:** The fundamental reality is a wavefunction in Configuration Space **plus** a configuration of particles in **3D Space**.

  **The Argument:** Our prior probability that "reality is fundamentally 3-dimensional" should be high. MWI requires a massive update away from this intuition, arguing that 3D space is a derivative "map" rather than "territory." BM preserves the 3D territory.
  Furthermore, MWI requires an ontology of "worlds." While MWI proponents say "worlds aren't fundamental, only the wave is," the *experience* of being in a specific branch requires an account of why *this* branch is the one "I" am in. BM solves the "indexical problem" (why am I here?) by pointing to the actual particle configuration.

  **The Bayesian Update:** MWI saves equations but bloats the dimensionality of reality. BM saves the dimensionality of reality but adds variables. A Bayesian should not treat "equation count" as the sole prior for simplicity. If you weight "spatial intelligibility" heavily in your prior, BM wins.

  ### 3. Nonlocality: "Honest" vs. "Hidden"
  The most common dismissal of BM is that it is explicitly nonlocal, violating the spirit of Special Relativity. The consensus holds that MWI is "local" because the wavefunction evolves locally.

  **The Counter-Argument:** Bell's Theorem proves that *any* theory reproducing QM predictions must abandon either Locality or Realism (single outcomes).
  *   **BM** abandons Locality to keep Realism.
  *   **MWI** abandons Realism (single outcomes) to keep Locality.

  However, MWI's "locality" is semantic. In MWI, a measurement here instantly affects the *global* branching structure. There is no signal, but the ontology of the "world" changes nonlocally.
  More importantly, BM's nonlocality is **signaling-free**. It respects the *no-communication theorem*. You cannot use Bohmian nonlocality to send a message faster than light. Therefore, it does not violate the *causal* structure of relativity, only the *geometric* intuition.

  **The Bayesian Update:** Since nature *must* be nonlocal in some sense (per Bell), the objection "BM is nonlocal" is not a discriminator unless MWI is truly local. If MWI's locality relies on denying unique outcomes, it is trading one metaphysical cost for another. A Bayesian should view BM's "honest nonlocality" as a feature, not a bug: it makes the causal dependencies explicit rather than hiding them in the branching structure.

  ### 4. The "Ad Hoc" Guiding Equation
  Critics claim the guiding equation ($\dot{Q} = \frac{\hbar}{m} \text{Im} \frac{\nabla \psi}{\psi}$) is tacked on.

  **The Counter-Argument:** The guiding equation is not arbitrary; it is the **simplest first-order differential equation** that satisfies **equivariance**. If you demand that the particle velocity depends on the wavefunction and preserves the $|\psi|^2$ distribution over time, the guiding equation is essentially unique.
  Compare this to MWI's "branching." When does a branch split? Decoherence is a gradient, not a binary switch. MWI lacks a precise criterion for "world count." BM has precise particle trajectories.

  **The Bayesian Update:** "Ad hoc" implies there are many other options that were rejected. In BM, there aren't. It is the unique solution to the constraint of reproducing QM statistics with definite trajectories. MWI's "branching" is far more vague. A Bayesian should penalize vagueness in ontology.

  ### 5. Relativistic Extension: Research Program vs. Dead End
  It is true: BM does not have a universally accepted, clean relativistic QFT formulation comparable to standard QFT. MWI proponents treat this as a fatal flaw.

  **The Counter-Argument:** This is a **technical hurdle**, not a **principled impossibility**.
  *   There *are* Bohmian QFT models (e.g., Bell-type QFT, Dirac sea models). They are complex, but they exist.
  *   MWI also struggles with QFT. Defining "branches" in a relativistic context where particle number is not conserved is notoriously difficult. What is the basis in which the world splits in QFT?

  **The Bayesian Update:** In Bayesian terms, we must distinguish between $P(\text{Theory is False} | \text{No QFT})$ and $P(\text{Theory is Incomplete} | \text{No QFT})$.
  The LW consensus treats the lack of Bohmian QFT as evidence of falsehood. A more charitable prior views it as evidence of incomplete research funding/attention. Since BM is empirically equivalent to standard QM in the non-relativistic limit, and no experiment has ruled it out in the relativistic limit, the lack of a *pretty* equation should not drive the probability to near-zero. It should merely cap it below standard QFT until resolved.

  ### 6. The "Surreal Trajectories" Objection
  Briefly, critics note that in some interference experiments, Bohmian trajectories look "weird" (e.g., a particle goes through one slit but is guided by the other, sometimes appearing to bounce off empty space).
  **Rebuttal:** These trajectories are only "surreal" if you assume you can measure them without disturbing the wavefunction. You can't. The trajectories are hidden variables. They are not meant to be observed directly; they are meant to explain the observation of the *final* position. This is not a falsification; it is a feature of hidden variable theories.

  ### Summary: The Bayesian Case for Rebalancing
  The typical rationalist assigns MWI ~80-90% credence and BM ~1-5%. A recalibrated Bayesian view might look more like MWI 50%, BM 30%, Other 20%.

  **Why the shift?**
  1.  **Measurement Problem:** BM solves it definitively (definite outcomes). MWI solves it FAPP (For All Practical Purposes) but struggles with the ontology of probability.
  2.  **Ontological Priority:** BM keeps 3D space fundamental; MWI relegates it to emergent. Priors should favor 3D space.
  3.  **Nonlocality:** Bell kills local realism anyway. BM's nonlocality is causally benign (no signaling).
  4.  **Vagueness:** MWI's "worlds" are vague; BM's particles are precise.
  5.  **Research Bias:** The lack of Bohmian QFT is partly due to sociological suppression of the interpretation, not just inherent difficulty.

  **Conclusion:**
  You don't have to believe BM is *true* to recognize that the LW consensus dismisses it too quickly. The arguments against BM are often "aesthetic" (it feels nonlocal, it feels ad hoc) rather than "evidential." Since BM and MWI are empirically equivalent in the non-relativistic domain, the choice comes down to priors on ontology and probability. If you value **definite outcomes** and **3D realism** highly, and you are skeptical of **derivations of probability in deterministic multiverses**, BM is not a fringe crackpot theory; it is a robust, competitive hypothesis that deserves a double-digit credence assignment.
