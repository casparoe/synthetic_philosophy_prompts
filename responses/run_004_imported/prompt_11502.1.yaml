prompt: |-
  I joined my hospital's ethics committee as a family representative shortly after my sister, who has bipolar I disorder, was hospitalized on our psychiatric unit during a manic episode. Two years earlier, while she was stable, she had worked with her psychiatrist to sign an advance directive instructing staff to disregard any refusal of medication or hospitalization she made while manic, and to proceed with treatment anyway. When the crisis came, she technically passed a bedside capacity evaluation, despite being, as our family later agreed, grandiose and barely sleeping for days, and she coherently and insistently demanded release. The on-call psychiatrist chose to honor the advance directive over her objections, and the committee is now split down the middle: some members call this straightforward paternalism, since an articulate, present refusal that survives a capacity evaluation should never be overridden by an earlier document, while others argue that honoring the refusal would have betrayed the very autonomy the directive was written to protect. Our written policy says only that such directives are to be given "significant weight," with no guidance on what to do when they conflict with an apparently competent contemporaneous refusal. Please draft the short memo I will bring to next week's meeting, recommending concrete criteria and a decision procedure (including who adjudicates and on what timeline), and engaging seriously with the strongest objection: that deferring to the directive treats her past self as more authoritative than the person who was actually in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Family Representative on the Hospital Ethics Committee.
      *   **Context:** Sister with Bipolar I was hospitalized during a manic episode. She had an advance directive (Ulysses Contract) signed 2 years prior while stable, instructing staff to ignore refusals during mania. During the crisis, she passed a *bedside capacity evaluation* but was clearly manic (grandiose, sleep-deprived). She demanded release. The psychiatrist honored the directive over her contemporaneous refusal.
      *   **Conflict:** The Committee is split. One side says overriding a passed capacity eval is paternalistic/illegal. The other says ignoring the directive betrays prior autonomy (Ulysses Contract).
      *   **Policy Gap:** Current policy says directives get "significant weight" but offers no guidance on conflicts with contemporaneous refusal.
      *   **Task:** Draft a short memo for the next meeting.
      *   **Requirements:** Recommend concrete criteria, a decision procedure (who adjudicates, timeline), and engage seriously with the strongest objection (past self vs. present self authority).

  2.  **Determine the Ethical & Legal Landscape:**
      *   *Ulysses Contracts:* These are psychiatric advance directives (PADs) where a patient pre-authorizes treatment during future incapacity, even if they object at the time.
      *   *Capacity vs. Competence:* Capacity is decision-specific and fluctuating. A "bedside capacity evaluation" during mania is notoriously tricky. Grandiosity and lack of sleep can impair judgment even if speech is coherent.
      *   *Autonomy:* There are two competing views of autonomy here:
          *   *Current Autonomy:* The right of the person in the room to decide *now*.
          *   *Precedent Autonomy:* The right of the person when stable to dictate care for when they are ill (Dworkin's distinction between critical interests and experiential interests).
      *   *The "Strongest Objection":* The argument that the "past self" shouldn't tyrannize the "present self," especially if the present self appears capable of arguing their case.

  3.  **Drafting Strategy - The Memo:**
      *   **Tone:** Professional, objective, empathetic, yet decisive. As a family rep, I have personal stake but must speak to policy.
      *   **Structure:**
          1.  Header (To, From, Date, Subject).
          2.  Purpose/Context.
          3.  Ethical Analysis (addressing the split).
          4.  Engagement with the Objection (Past vs. Present Self).
          5.  Recommendations (Criteria & Procedure).
          6.  Conclusion.
      *   **Key Recommendations:**
          *   Need a higher bar for "capacity" in the context of known mania + PAD.
          *   Need a rapid review process (not just the treating psychiatrist).
          *   Need to define "Significant Weight."

  4.  **Developing the Content - Section by Section:**

      *   *Header:* Standard memo format.
      *   *Introduction:* Acknowledge the recent case and the policy gap. State the goal: clarity for future cases.
      *   *Ethical Framework:* Acknowledge the tension. It's not just Paternalism vs. Autonomy; it's *Competing Autonomies*.
      *   *Addressing the Objection:* This is crucial. I need to validate the concern that honoring the directive feels like silencing the patient.
          *   *Counter-argument:* Mania distorts the "self." The "present self" in mania is often not the "true self" the patient identified with when stable. However, we must ensure the *current* refusal isn't actually a reasoned change of mind (which is rare in acute mania but possible).
          *   *Solution:* The capacity evaluation needs to be more robust than a standard bedside check when a PAD exists.
      *   *Concrete Criteria:* When can we override?
          1.  Valid PAD exists.
          2.  Clinical evidence of the specific condition covered (mania).
          3.  Capacity assessment must account for the specific impairment (not just "can you repeat the risks?" but "do you believe you are manic?").
      *   *Decision Procedure:*
          *   Who? Not just the on-call psych. Needs a second opinion or Ethics consult *stat*.
          *   Timeline? Immediate (within hours), because liberty is at stake.
      *   *Policy Language:* Change "significant weight" to a presumption of validity *unless* specific criteria are met.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Am I being too biased as a sister?
      *   *Fix:* Keep the language focused on *policy* and *principles*, not just my sister's specific outcome. Use the case as the catalyst, not the sole focus.
      *   *Critique:* Is the capacity eval point legally sound?
      *   *Fix:* Acknowledge that legal standards vary, but ethically, a capacity eval during mania must assess insight into the illness, not just arithmetic and orientation.
      *   *Critique:* The prompt asks to engage the "Past Self vs. Present Self" objection seriously.
      *   *Fix:* Dedicate a specific section to this. Don't dismiss it. Acknowledge that people change their minds. But distinguish between *evolution of values* and *distortion of pathology*.

  6.  **Final Polish:**
      *   Ensure the tone is collaborative.
      *   Check that all constraints of the prompt are met (criteria, procedure, timeline, adjudicator, objection).
      *   Keep it "short" (as requested).

  7.  **Final Review against Prompt:**
      *   Memo format? Yes.
      *   Concrete criteria? Yes.
      *   Decision procedure (who/timeline)? Yes.
      *   Engage strongest objection? Yes.
      *   Context: Family rep, sister's case, policy gap. Yes.

  *(Self-Correction Note)*: I need to be careful not to give legal advice. This is an ethics memo. I should frame recommendations around ethical best practices that align with legal risk management.

  *(Refining the "Capacity" point)*: The prompt says she *passed* a bedside capacity eval. This is the crux. The memo must argue that standard capacity tools are insufficient for PAD overrides in psychiatry. The criteria must require a *specific* assessment of insight into the manic state, not general capacity.

  *(Refining the Adjudicator)*: The on-call psych is conflicted (treating team). An independent reviewer or a rapid ethics review is better. Let's suggest a "Rapid Ethics Review" or a second independent psychiatric opinion. Given the timeline (crisis), a second independent psych opinion is more feasible than a full committee meeting.

