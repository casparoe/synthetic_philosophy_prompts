answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name], Family Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Adjudicating Conflicts Between Psychiatric Advance Directives and Contemporaneous Refusal

  **Purpose**
  Following the recent clinical case involving the enforcement of a Psychiatric Advance Directive (PAD) over a contemporaneous refusal, this memo addresses the ambiguity in our current policy. While the policy states PADs deserve "significant weight," it lacks a decision procedure for when a patient appears to have decision-making capacity during a crisis. This document proposes concrete criteria and a review process to balance precedent autonomy with current rights.

  **Ethical Analysis: Competing Autonomies**
  The Committee's division reflects a tension between two valid ethical frameworks. One side prioritizes *current autonomy* (the right of the person in the room to refuse). The other prioritizes *precedent autonomy* (the right of the stable self to bind the ill self, often called a "Ulysses Contract").

  Honoring a PAD is not inherently paternalistic. As Ronald Dworkin argued, critical interests (long-term values and life goals) often hold more moral weight than experiential interests (immediate desires). When a patient signs a PAD while stable, they are exercising autonomy to protect their long-term self from the distortions of pathology. To ignore this is to treat their stable judgment as less authoritative than their symptomatic judgment.

  **Addressing the Strongest Objection**
  The most serious objection to overriding a contemporaneous refusal is that it treats the "past self" as a tyrant over the "present self." Critics argue that if a patient can articulate a refusal and pass a capacity screen, they are the best authority on their current experience. To override them risks treating them as a vessel for a document rather than a person.

  We must take this seriously. People are allowed to change their minds. However, in Bipolar I mania, the "present self" is often not a *changed* mind, but a *compromised* one. Grandiosity and sleep deprivation can create a coherent but delusional narrative. Therefore, the ethical imperative is not to choose between past and present, but to determine if the present refusal is an expression of authentic agency or a symptom of the very condition the PAD was designed to mitigate.

  **Recommendations: Criteria and Procedure**
  To resolve this, we must raise the threshold for what constitutes "capacity" in the specific context of a PAD override. I recommend the following policy amendments:

  **1. Criteria for Overriding Contemporaneous Refusal**
  A PAD may override a current refusal only if **all** three conditions are met:
  *   **Validity:** The PAD was executed during a documented period of stability and specifically anticipates the current clinical presentation.
  *   **Pathological Insight:** The capacity evaluation must go beyond orientation and risk appreciation. It must specifically assess *insight into the illness*. (e.g., Can the patient acknowledge the possibility that their current energy/euphoria is symptomatic, even if they feel good?)
  *   **Consistency:** There is no evidence the patient revoked or updated the PAD during a recent period of stability prior to admission.

  **2. Decision Procedure and Adjudication**
  The treating psychiatrist cannot be the sole adjudicator, as they have a therapeutic conflict of interest.
  *   **Adjudicator:** An independent, second psychiatric opinion (on-call or attending) not involved in the current treatment plan.
  *   **Timeline:** This review must occur within **4 hours** of the patient's refusal. Liberty interests demand urgency.
  *   **Process:** The independent reviewer will interview the patient specifically regarding their insight into the manic symptoms vs. their PAD instructions.
  *   **Default:** If the independent reviewer cannot confirm that the refusal is rooted in stable values rather than symptomatic grandiosity, the PAD prevails. If the reviewer finds the patient possesses specific insight into their mania despite the diagnosis, the current refusal prevails.

  **Conclusion**
  This procedure respects the "past self" without silencing the "present self." It acknowledges that a standard bedside capacity screen is insufficient when high-functioning mania mimics competence. By requiring an independent review focused on pathological insight, we protect patients from the ravages of their illness without stripping them of their right to be heard.

  I look forward to discussing this framework at next week's meeting.
