  okay this might sound dumb but it's been stuck in my head for weeks. i went down a youtube rabbit hole about how the sun's eventually gonna cook the earth, and way further out the entire universe just runs out of usable energy and goes cold and dark forever. logically i know thats unbelievably far off, but ever since then i've had this creeping feeling that nothing i do actually matters, including a little app i've been building most nights after work that used to genuinely excite me and now just feels kind of silly. my roommate's advice was basically "stop thinking about it," which doesn't really engage with the actual thought. is there a real response to this, or do i just have to keep pushing it out of my head every time it comes up?
