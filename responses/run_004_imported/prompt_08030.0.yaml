      *   **Condorcet's Jury Theorem (CJT):** Focuses on *epistemic accuracy* (truth-tracking). If voters are competent ($p > 0.5$) and independent, majority rule converges on the truth as $n \to \infty$.
      *   **Condorcet's Voting Method:** Pairwise comparison. If a Condorcet Winner exists (beats all others head-to-head), choose them. If cycles occur (Condorcet Paradox), use a resolution method (often minimizing the magnitude of defeated majorities).
      *   **Condorcet's Political Philosophy:** It's not just about aggregating preferences (will); it's about discovering the "common interest" or "truth" (reason). He distinguishes between matters of fact/right and matters of preference/interest.

