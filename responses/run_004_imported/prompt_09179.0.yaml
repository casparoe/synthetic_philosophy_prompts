      *   *Scene 2: The Preparation.* She is installing the Surrogate Goal. This needs to be a medical/psychological procedure. She chooses the "Blue Vase" (or something abstract). Let's go with a specific, arbitrary string of code or a digital artifact. Let's call it "Object 88."
