      *   *The Cost:* When Kira needs her later, Elara hesitates. The number sequence feels just as important. The hierarchy of love is flattened.

  7.  **Writing - Focusing on Sensory Details and Internal State:**
      *   Avoid jargon like "Newcomb's Problem" or "Timeless Decision Theory." Use in-world terms: "The Handshake," "The Mirror," "The Anchor."
      *   Focus on the feeling of the neural rewrite. It should feel like scarring.
      *   The ending needs to be quiet and devastating.

  8.  **Self-Correction during Drafting:**
      *   *Critique:* Is the threat clear enough?
