      *   **The Friend's Stance:** "A promise is a promise, you don't get to back out just because something better came along."
      *   **The User's Intuition:** Breaking the promise wouldn't really hurt anyone (friend can find someone else easily), but the friend's statement feels morally weighty.
      *   **The Context:** The user is currently in an ethics seminar covering "promising."
      *   **The Goal:** The user wants to understand *why* the obligation might still hold even if harm is minimal, and whether the friend is right. They need ethical frameworks to analyze this.

