answer: |-
  This is a fantastic dilemma to bring to an ethics seminar because it cuts right to the heart of what a promise *is*. It feels intuitive that "no harm, no foul," but your friend's reaction (and your own nagging feeling) suggests that morality isn't just about immediate consequences.

  Since you are covering promising in your seminar, let's break this down using a few major ethical frameworks. This should help you articulate *why* the obligation feels like it holds, even if the logistical harm is low.

  ### 1. The Deontological View (Kant & The Nature of Promising)
  Immanuel Kant would likely side with your friend. For a deontologist, the morality of an action isn't determined by the outcome (getting paid vs. unpaid), but by whether the action adheres to a moral duty or rule.

  *   **The Categorical Imperative:** Kant asks you to act only according to rules that you could will to become universal laws. Ask yourself: *Could I will a world where everyone breaks promises whenever something slightly better comes along?*
  *   **The Institution of Promising:** If the answer is no, then the act is wrong. If everyone treated promises as optional based on convenience, the very concept of "promising" would collapse. No one would ever rely on a promise again.
  *   **Why harm doesn't matter here:** In this view, the wrong isn't the *harm* caused to the friend; the wrong is the **violation of the duty** you created when you made the promise. By making a promise, you voluntarily created an obligation. To break it is to contradict your own will at the time of promising.

  ### 2. Rule Utilitarianism (Beyond "No Harm")
  You are currently thinking like an *Act Utilitarian*: "In this specific act, breaking the promise creates more happiness (I get paid) and less pain (friend finds someone else) than keeping it."

  However, a *Rule Utilitarian* looks at the long-term consequences of the *rule* being followed.
  *   **Trust Capital:** Even if your friend isn't logistically stuck, the *trust* between you is damaged. Trust is a social utility. If you break this promise, you signal that your word is contingent on your options.
  *   **Reputation:** Ethics is also about your standing in your academic community. If word gets out that you bail on commitments for better offers, professors (even the one offering the paid spot) may hesitate to rely on you in the future.
  *   **The "Slippery Slope":** If you normalize breaking promises for "upgrades" now, you train yourself to do it later in life when the stakes are higher.

  ### 3. T.M. Scanlon and the Principle of Fidelity
  Since you are in a seminar, you might appreciate T.M. Scanlon's contractualist account of promising (from *What We Owe to Each Other*).
  *   Scanlon argues that when you promise, you invite someone to rely on you. You create an expectation.
  *   The wrong in breaking a promise is not necessarily the material loss, but the **betrayal of the assurance you gave.** You manipulated your friend's planning by securing her reliance on you, and then removing that support.
  *   Even if she finds a replacement, you wasted her time and emotional energy that she spent relying on you versus looking for others earlier. That *is* a harm, just not a logistical one.

  ### 4. Virtue Ethics (Who are you becoming?)
  Aristotle wouldn't ask "What should I do?" but "What would a virtuous person do?"
  *   **Integrity:** Integrity is about wholeness; your actions align with your words.
  *   **Loyalty:** This is a friend, not a client. Virtue ethics places high value on special obligations to friends.
  *   **Prudence:** However, virtue ethics also values prudence. Is the unpaid position detrimental to your future? A virtuous person also cares for their own flourishing.
  *   **The Conflict:** The tension here is between **Fidelity** (keeping your word) and **Prudence/Ambition** (securing your career). A virtuous person tries to balance these, but usually, fidelity is the baseline requirement for maintaining relationships.

  ### 5. Why "No Harm" is a Red Herring
  You mentioned: *"No one's really getting hurt if I switch."*
  In ethics, we have to broaden the definition of harm.
  1.  **Opportunity Cost:** Your friend relied on you, so she likely stopped looking or turned down other candidates. Even if she finds someone now, she has lost time and certainty.
  2.  **Relational Harm:** She feels undervalued. She asked for help when she had nothing lined up (just like you), and now you are leaving her for a "better" option. That hurts the friendship.
  3.  **Systemic Harm:** As mentioned in the Deontology section, every time a promise is broken for convenience, the social fabric of trust weakens slightly.

  ### So, is she right?
  **Ethically, she has a very strong case.** The obligation holds because the obligation comes from the *act of promising itself*, not the *consequences of breaking it.*

  **However,** ethics is also about negotiation and mitigation. You are in a tough spot because the paid position is significant for your career. Here is how you might think about a resolution that respects the ethical weight:

  1.  **Acknowledge the Breach:** Don't argue that "no harm is done." Admit that you are breaking a commitment and that her frustration is valid. Validate her "promise is a promise" stance.
  2.  **Mitigate the Harm:** If you decide you must take the paid position (which is a legitimate self-interest), you have an obligation to make the transition as painless as possible.
      *   Offer to train the replacement.
      *   Offer to do some of the work remotely or on weekends.
      *   Help her find the replacement actively.
  3.  **The "Escape Clause" Check:** Did you discuss what would happen if another opportunity arose? If not, the default assumption in close friendships is usually loyalty over optimization.

  ### For your Seminar
  If you bring this up in class, focus on the **Principle of Fidelity**. The key question to pose to your class is:
  *"Does the moral force of a promise derive from the harm prevented by keeping it, or from the obligation created by the speech act itself?"*

  Your intuition that the obligation holds even without harm suggests you lean toward Deontology or Contractualism. Your friend's reaction confirms that in human relationships, **reliability is often valued higher than efficiency.**

  **Summary:** She is right that the obligation holds, because promises are designed specifically to bind us *against* our future changing interests. That is their entire function. If we only kept promises when it was still convenient, they wouldn't be promises; they would be predictions.
