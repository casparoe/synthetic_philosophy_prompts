          *   *Standard View:* CC = Impossible to conceive (Logical/Teleological impossibility). CW = Possible to conceive, impossible to will (Rational volition).
          *   *Friend's View (Degree):* It's all about how bad the consequences are for the agent.
          *   *User's View (Structure):* It's about the *type* of failure.
          *   *Kant's Text:* Kant distinguishes *rigorously* strict duties (perfect) from meritorious duties (imperfect). The failure in CC destroys the *institution* or *natural purpose* required for the action. The failure in CW creates a conflict within the will's own necessary ends (happiness/development).
          *   *Verdict:* The User is closer to Kant's intent, but the Friend isn't entirely wrong about the underlying mechanism (teleological self-undermining). However, the *normative upshot* is structurally different (prohibition vs. obligation to adopt an end).

      *   **Issue 2: The Logical Objection & Korsgaard.**
          *   *The Objection:* If I universalize "I will lie when it benefits me," does it logically entail "No one believes promises"? Not strictly logically (A doesn't entail not-A). It entails a *causal* or *institutional* collapse.
          *   *Logical Contradiction Interpretation:* Tries to find a formal logical inconsistency (e.g., "I promise" implies "I intend to keep," but maxim implies "I intend to break"). This is often seen as weak because the agent can just say "I'm making an exception."
          *   *Korsgaard's "Practical Contradiction":* It's not about logical consistency of propositions, but about the *efficacy of the purpose*. If everyone acts on maxim M, purpose P becomes impossible to achieve. Therefore, willing M universally undermines the very reason for willing M.
          *   *Why it helps:* It handles the "minority lying" objection by focusing on the *universalization* condition. If *everyone* did it, the institution vanishes. The objection ("what if only a minority...") misses the point of the Categorical Imperative (CI) test, which demands *universal* lawhood, not general lawhood.

      *   **Issue 3: The Four Examples.**
