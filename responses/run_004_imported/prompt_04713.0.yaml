      *   *Korsgaard's Specific Contribution:* She shifts focus from "state of affairs" to "agent's purpose." The contradiction is: I will X. Universalizing X makes X impossible. Therefore I will X and not-X (effectively).

  5.  **Final Polish:** Check tone (academic but accessible), ensure all parts of the prompt are answered, and verify Kantian terminology (maxim, universal law, perfect/imperfect duty). (Self-check: Did I explain *why* talents/help are CW? Yes, because a rational agent *necessarily* wills the means to their ends, and talents/help are necessary means for indeterminate future ends.)

