  \ the accused (makes conviction harder). If $p > 0.5$, it makes conviction harder\
  \ but more reliable. Given the risk of false positives on AI, a higher threshold\
  \ is a safety valve. Recommendation: **Support the 5/7 threshold.**\n    *   *Procedural\
  \ Changes:* Need to address Independence and Competence.\n        *   *Independence:*\
  \ Deliberation *after* private voting? Separate training cohorts? Blind review of\
  \ writing before seeing AI score?\n        *   *Competence:* Better training on\
  \ AI limitations (especially ESL). Expert consultation.\n\n4.  **Drafting - Section\
  \ by Section:**\n\n    *   **Header:** Standard Memo format.\n    *   **Opening:**\
  \ State the purpose. Acknowledge the proposal's intent (reducing error).\n    *\
  \   **Theoretical Framework (The \"Philosophy\" Bit):** Explain CJT simply. \"Wisdom\
  \ of Crowds\" works *only if* two conditions are met: Individual Competence and\
  \ Independence.\n    *   **Application to Honor Council:**\n        *   *Competence:*\
  \ AI cases are hard. Training might make us over-confident ($p$ could be $< 0.5$).\n\
  \        *   *Independence:* Same training + deliberation = correlated errors.\n\
  \    *   **The Risk:** If conditions aren't met, bigger panels = more confident\
  \ mistakes.\n    *   **Recommendations:**\n        1.  **Panel Size:** Approve expansion\
  \ to 7 *only if* paired with independence measures.\n        2.  **Voting Threshold:**\
  \ Approve the 5/7 supermajority. This acts as a buffer against the $p < 0.5$ risk.\n\
  \        3.  **Procedural Reforms (Crucial):**\n            *   *Sequential Voting:*\
  \ Vote *before* deliberation to ensure independence.\n            *   *Training\
  \ Update:* Specific module on AI fallibility/ESL patterns.\n            *   *Evidence\
  \ Order:* Review writing *before* seeing the AI score (to prevent anchoring).\n\
