  \ (no correlation in errors).\n    *   *Conclusion:* As $n$ (voters) increases,\
  \ probability of correct majority decision approaches 1.\n    *   *The Risk:* If\
  \ $p < 0.5$ (worse than random), increasing $n$ makes error approach 1. If independence\
  \ is violated (common bias), the benefit of increasing $n$ diminishes rapidly or\
  \ disappears.\n    *   *Application:* AI detection cases are \"hard cases.\" If\
  \ training biases everyone to trust the score, $p$ might drop below 0.5 for these\
