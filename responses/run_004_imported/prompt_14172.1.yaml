  \ (training, voting recording, etc.) if the recommendation depends on them.\n  \
  \      *   Tone: Professional, persuasive, accessible to non-philosophers but rigorous.\n\
  \n2.  **Deconstruct the Condorcet Jury Theorem (CJT) in this Context:**\n    * \
  \  *Premise 1 (Competence):* Each voter must have $p > 0.5$ probability of choosing\
