  \ is clear).\n\n    *(Self-Correction on CJT nuance)*: Technically, CJT assumes\
  \ binary choices (Guilty/Not Guilty). Honor councils often have sanctions, but the\
  \ finding is binary. I will stick to the binary finding for the theorem's application.\n\
  \    *(Self-Correction on Independence)*: Deliberation *destroys* independence.\
  \ This is a key point. If they talk before voting, they aren't independent voters\
  \ anymore; they are a groupthink unit. The memo must emphasize *private initial\
  \ voting*.\n\n8.  **Finalizing the Memo Structure:**\n    *   To/From/Subject.\n\
  \    *   Executive Summary.\n    *   The Epistemic Case (CJT simplified).\n    *\
  \   Application to AI Cases.\n    *   Specific Recommendations (Size, Threshold,\
