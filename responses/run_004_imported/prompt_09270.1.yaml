  Here is a draft for the eulogy. I have tried to balance the technical nuance with emotional resonance, honoring Ray's passion without presenting his interpretation as undisputed scientific fact. I've also included a nod to the irony of the situation, which I think Ray would have appreciated.

  ***

  **Eulogy for Uncle Ray**

  Good morning. For those who don't know me, I'm [Your Name], Ray's nephew/niece.

  When we think about Uncle Ray, most of us think about the holidays. Specifically, we think about the Thanksgiving table, about three cups of coffee in, when Ray would lean forward with that familiar glint in his eye. He'd pull out a napkin, or maybe a crust of bread, and he'd say, "Okay, just listen to this one thing."

  For the last thirty years, that "one thing" was Gödel's Incompleteness Theorem.

  Now, I know what some of you are thinking. You're thinking about the complex math, or the times you tried to escape to the kitchen for more pie while Ray was explaining formal systems. But I want to talk about what that math *meant* to him. Because it wasn't really about the numbers. It was about us.

  In the 90s, Ray read a book by Roger Penrose that changed his life. The basic idea was this: In any logical system, like a computer program, there are truths that exist which the system itself cannot prove. But a human being? A human being can look at that system and *see* that the truth is real.

  Ray believed this was the smoking gun. He believed it proved that there is something in the human mind—something in *us*—that is more than just gears turning, more than just code executing. He believed it proved we aren't machines.

  He knew this was a big claim. He knew it was controversial. We have family here today with degrees in computer science who spent the last decade lovingly pointing out the holes in that theory over mashed potatoes. [Cousin's Name], I know Ray treasured those debates. He didn't want a room full of people nodding along; he wanted people who would push back. He wanted the friction of ideas. Because to Ray, the fact that we could argue about it—that we could care about it—was proof of the very thing he was describing.

  It is not lost on me, and I think it would not have been lost on Ray, that I am standing here reading words assisted by a computer program to tell you about a man who believed computers could never truly think. I like to think Ray would have found that hilarious. He would have analyzed it. He would have asked, "Does this tool understand what it's writing? Or does it just know which words go together?"

  And that question—that insistence on asking what makes us different—is his real legacy.

  Ray wasn't trying to win a math prize. He was trying to protect a sense of wonder. He was stubbornly, beautifully insisting that human consciousness is mysterious and special. He wanted us to believe that there are things we can know that can't be calculated.

  And honestly? Looking around this room, I think he was right about the important stuff.

  You cannot use a formula to prove why we are all here today. You cannot run an algorithm to calculate how much we miss him. There is no logical system in the world that can derive the value of a life, or the weight of grief, or the strength of love. These are truths that we just *see*. They are outside the rulebook.

  Ray spent his life looking for the unprovable truths in mathematics. But in doing so, he reminded us to cherish the unprovable truths in our lives.

  So, Uncle Ray, I hope you've found the answer. I hope you've found the statement that is true, but can't be proved. And I hope you're already at the next table, cornering someone with a napkin and a crust of bread, telling them why they are more than just a machine.

  We love you. We'll miss you. And we'll keep asking the questions.
