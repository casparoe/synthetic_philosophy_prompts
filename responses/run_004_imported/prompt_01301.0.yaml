answer: |-
  Your teammate is right about the mechanism, but you are right to be suspicious of the application. The Condorcet Jury Theorem (CJT) is not a "wisdom of crowds" law; it is a convergence theorem with strict boundary conditions. When those conditions are violated, the theorem doesn't just fail to apply—it actively predicts **catastrophic failure**.

  If we sit Condorcet down with a laptop, he wouldn't see vindication. He would see a massive violation of the axioms required for his proof to hold. Here is the reasoning through the math and the institutional design.

  ### 1. The Math of the Failure Modes

  The CJT states that for a binary decision, if $n$ voters vote independently with individual competence $p$ (probability of being correct), the probability of the majority being correct ($P_n$) approaches 1 as $n \to \infty$, **if and only if** $p > 0.5$.

  There are two specific mathematical failure modes relevant to your observation:

  **A. The Competence Collapse ($p < 0.5$)**
  If the average voter is more likely to be wrong than right ($p < 0.5$), the theorem dictates that as you add more voters, the probability of the majority being correct approaches **0**.
  *   **Math:** If $p = 0.4$, a single voter is 40% accurate. A majority of 1,000 voters will be nearly 100% *incorrect*.
  *   **Internet Reality:** On complex topics (geopolitics, virology, economics), the "average" social media user often lacks domain expertise. If misinformation is more engaging than truth, the incentive structure selects for $p < 0.5$. Scaling this system doesn't find truth; it amplifies error with high confidence.

  **B. The Independence Violation (Correlation $\rho > 0$)**
  CJT assumes votes are independent Bernoulli trials. In reality, votes are correlated. If voters share a common bias or copy each other, the "effective $n$" shrinks.
  *   **Math:** If correlation $\rho$ exists between voters, the variance of the mean does not decrease as $1/n$. It decreases as $1/n + (n-1)\rho/n$. As $n \to \infty$, the error does not vanish; it converges to $\rho$.
  *   **Internet Reality:** Algorithmic feeds create common information environments. If everyone sees the same top tweet, they are not independent samplers; they are replicating a single signal. You might have 10,000 upvotes, but if they all stem from the same algorithmic prompt, your effective $n$ might be 1.

  ### 2. LLM Self-Consistency: The Only Valid Use Case?

  Your workplace usage of self-consistency is actually the closest modern analog to a valid CJT application, but it still has caveats.

  *   **Competence ($p$):** For reasoning tasks (math, code, logic), modern LLMs often have $p > 0.5$. For creative writing or hallucination-prone facts, $p$ is harder to define.
  *   **Independence:** This is the weak link. Sampling the *same* model with temperature $> 0$ generates conditionally independent samples, but they share the same weights. Systemic biases in the training data create a "common cause" error.
  *   **Verdict:** Self-consistency works because it averages out *stochastic* decoding errors, not *systemic* knowledge errors. If the model doesn't know the fact (systemic error), sampling 100 times won't help. Condorcet would approve of this as a method to reduce noise, but warn that it cannot fix bias.

  ### 3. Social Platforms: Structural Violation

  Reddit, X/Twitter, and Facebook violate both axioms structurally.

  *   **Violation of Independence:** Upvotes are visible *before* you vote. This creates information cascades. A user is not voting on the content's merit ($p$); they are voting on the content's prior social proof. This creates positive feedback loops where early noise locks in the "majority" view before independent sampling can occur.
  *   **Violation of Competence:** Engagement algorithms optimize for time-on-site, not accuracy. Emotionally charged misinformation often outperforms nuanced truth. If the system rewards engagement, and engagement correlates with outrage rather than accuracy, the system selects for $p < 0.5$ on controversial topics.
  *   **The Result:** Condorcet would identify this as a system designed to converge on **falsehood**. With high correlation (echo chambers) and potentially sub-50% competence (misinformation), increasing the crowd size makes the verdict *worse*, not better.

  ### 4. Prediction Markets: The Partial Exception

  Prediction markets (like Polymarket or Manifold) are the only internet-scale mechanism that partially respects CJT.

  *   **Competence:** Financial incentives align $p > 0.5$. If you are consistently wrong, you go bankrupt and exit the pool (survivorship bias raises average $p$).
  *   **Independence:** Traders profit from *disagreement*. If the crowd is wrong, there is money to be made by betting against them. This incentivizes independent analysis rather than herding.
  *   **Verdict:** Condorcet would view this as a functional institution. It uses incentives to enforce competence and independence.

  ### 5. Condorcet's Judgment

  Marie Jean Antoine Nicolas de Caritat, Marquis de Condorcet, was not a naive populist. He was a rationalist who believed in **public education** as a prerequisite for democracy. He argued that for the Jury Theorem to work, the "jurors" (citizens) must be educated enough to ensure $p > 0.5$.

  He also designed voting systems (the Condorcet method) to handle preferences, understanding that simple majorities have flaws.

  If you showed him the modern internet:

  1.  **On Education ($p$):** He would argue we have failed to raise $p$. We have increased *access to information* but decreased *competence in verification*. He would say that without a baseline of epistemic competence, the crowd is just a mob.
  2.  **On Institutions (Independence):** He would view algorithmic feeds as a corruption of the "secret ballot." By exposing users to the votes of others before they cast their own (likes/retweets visible upfront), platforms destroy the independence required for the math to hold.
  3.  **On Bots:** He would view coordinated inauthentic behavior as a direct attack on the $n$ count. If 10,000 votes come from one bot herder, $n=1$, not $10,000$.

  ### Conclusion

  Condorcet would not say his theorem is vindicated. He would say **his theorem is being used as a marketing lie.**

  The "Wisdom of the Crowd" is sold as a universal property of aggregation. Condorcet would correct you: It is a conditional property of *structured* aggregation.
  *   **LLM Self-Consistency:** Valid for reducing variance, invalid for fixing bias.
  *   **Prediction Markets:** Valid, because incentives enforce the axioms.
  *   **Social Media:** Invalid. It creates high correlation ($\rho \to 1$) and often selects for low competence ($p < 0.5$).

  Mathematically, a crowd where $p < 0.5$ and $\rho > 0$ is not wise; it is a **confidence machine for falsehoods**. Condorcet, the mathematician, would recognize that we have built systems that exploit the *name* of his theorem while engineering the exact conditions that guarantee its failure.
