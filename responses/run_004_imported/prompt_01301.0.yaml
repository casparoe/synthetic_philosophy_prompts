prompt: |-
  So at work we've been using 'self-consistency' with our LLM calls -- sample the model a bunch of times and go with whatever answer comes up most -- and a teammate mentioned this is basically just the Condorcet Jury Theorem in disguise. Now I can't unsee it everywhere: reddit upvotes, x/twitter community notes, prediction markets, all claiming to be 'wisdom of the crowd' machines. But the theorem only actually works if each voter is independent AND more likely than not to be right on thier own -- break either assumption and more voters makes the group verdict worse, not better. Condorcet himself was a total Enlightenment optimist, big on progress, public education, and using probability to design better institutions. If you sat him down today and showed him how these crowd platforms actually behave -- bots and algorithmic feeds wrecking independence, misinformation dragging average competence below 50/50 on plenty of topics -- do you think he'd see his theorem vindicated at internet scale, or would he say we've built machines that trade on the theorem's name while violating everything it requires? Actually reason through the math/assumptions, don't just give me vibes.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Core Observation:** The user notes that "self-consistency" in LLMs (sampling multiple times, taking the majority vote) is analogous to the Condorcet Jury Theorem (CJT).
      *   **Extension:** The user extends this analogy to social platforms (Reddit, Twitter/X, Prediction Markets) claiming "wisdom of the crowd."
      *   **Critical Constraint:** The user correctly identifies the two crucial assumptions of CJT:
          1.  Independence of voters.
          2.  Individual competence ($p > 0.5$).
      *   **The Question:** If Condorcet (the historical figure, an Enlightenment optimist focused on probability and institutions) saw today's internet platforms (bots, algorithms, misinformation), would he see his theorem vindicated or violated?
      *   **Requirement:** "Actually reason through the math/assumptions, don't just give me vibes."

  2.  **Analyze the Condorcet Jury Theorem (CJT):**
      *   *Setup:* $n$ voters, binary choice (True/False, A/B).
      *   *Assumption 1 (Competence):* Each voter has probability $p$ of choosing the correct option. Crucially, $p > 0.5$.
      *   *Assumption 2 (Independence):* Voters decide independently (no correlation in errors).
      *   *Result:* As $n \to \infty$, the probability of the majority being correct approaches 1.
      *   *The Flip Side:* If $p < 0.5$, as $n \to \infty$, the probability of the majority being correct approaches 0 (the crowd becomes confidently wrong). If voters are correlated (violating independence), the effective $n$ decreases, limiting the convergence.

  3.  **Analyze the Modern Context (LLMs & Social Media):**
      *   **LLM Self-Consistency:**
          *   *Competence:* Depends on the model and task. For reasoning tasks, $p$ might be $> 0.5$. For hallucination-prone tasks, maybe not.
          *   *Independence:* Sampling with temperature $> 0$ introduces stochasticity, but it's the *same* model weights. Are samples independent? Not truly. They are conditionally independent given the weights, but systemic biases in the weights create correlation.
      *   **Social Media (Reddit/Twitter):**
          *   *Competence:* Is the average user $p > 0.5$ on complex topics? Often no. Misinformation spreads easily.
          *   *Independence:* Algorithmic feeds create echo chambers. Upvotes are visible *before* voting (herding). Bots coordinate. Independence is severely violated.
      *   **Prediction Markets:**
          *   *Competence:* Incentivized accuracy. Often $p > 0.5$ because money is on the line.
          *   *Independence:* Traders react to price (which aggregates info), leading to some correlation, but generally robust.

  4.  **Evaluate Condorcet's Perspective (Historical & Mathematical):**
      *   Condorcet was a mathematician (probability) and a political philosopher (democracy, education).
      *   He believed education raises $p$.
      *   He believed institutions should ensure independence (secret ballots, deliberation structures).
      *   *The Verdict:* He would likely be horrified by the violation of assumptions.

  5.  **Drafting the Argument (Step-by-Step):**

      *   **Introduction:** Acknowledge the teammate's insight. It *is* CJT. Validate the user's skepticism about the assumptions.
      *   **The Math of Failure (The "Why"):**
          *   Explain the $p < 0.5$ catastrophe. If the crowd is biased/wrong, scaling makes it worse exponentially.
          *   Explain the Correlation ($\rho$) problem. If voters copy each other, effective $N$ shrinks.
      *   **Application to LLMs:**
          *   Why self-consistency works (usually): $p$ is high enough, temperature adds *some* independence.
          *   Where it fails: Systemic model bias (weights are shared).
      *   **Application to Social Media:**
          *   Independence violation: Feeds, visible counts, bots.
          *   Competence violation: Incentive structures favor engagement over truth ($p$ drops).
          *   Result: $p < 0.5$ + High Correlation = Confidence in Falsehoods.
      *   **Application to Prediction Markets:**
          *   The outlier that actually works closer to CJT because incentives align $p > 0.5$ and money forces some independence (arbitrage).
      *   **Condorcet's Judgment:**
          *   He wasn't a naive "crowds are always right" guy. He was a "crowds are right *if* educated and structured" guy.
          *   He would view social media as a violation of his institutional design.
      *   **Conclusion:** The theorem isn't vindicated; it's being weaponized as a marketing slogan while the math is ignored.

  6.  **Refining the Math (Self-Correction/Nuance):**
      *   *Correction:* Make sure to distinguish between *statistical independence* and *causal independence*. In LLMs, samples are i.i.d. *given the model*, but the model itself is a source of common cause error.
      *   *Nuance:* On social media, herding behavior means later voters condition on earlier voters. This is Bayesian updating gone wrong if the early signal is noisy.
      *   *Condorcet's specific view:* He advocated for *deliberative* democracy, not just raw aggregation. He knew raw aggregation fails without competence.

  7.  **Final Polish:**
      *   Tone: Analytical, rigorous, slightly historical/philosophical.
      *   Check constraints: Did I reason through the math? Yes. Did I avoid vibes? Yes.
      *   Key takeaway: The "Wisdom of Crowds" is a special case, not a universal law.

  8.  *(Self-Correction during drafting)*: I need to make sure I don't just bash social media. I need to explicitly link it back to the $p$ and $\rho$ variables in the theorem.
      *   *Social Media:* $p \approx 0.5$ or $<0.5$ (misinfo), $\rho \to 1$ (algorithms).
      *   *LLMs:* $p > 0.5$ (usually), $\rho$ is moderate (same weights).
      *   *Prediction Markets:* $p > 0.5$ (incentives), $\rho$ is low (divergent beliefs).

  9.  **Final Structure:**
      1.  The Math (The Theorem & The Failure Modes).
      2.  LLM Self-Consistency (The closest valid application).
      3.  Social Media (The structural violation).
      4.  Prediction Markets (The partial exception).
