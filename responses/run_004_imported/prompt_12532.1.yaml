      *   Distinguish between *epistemic justification* (philosophy) and *operational performance* (statistics).
      *   Highlight that $p(\sigma) \propto 1$ is *not* invariant under scale transformations, whereas $p(\sigma) \propto 1/\sigma$ is. Even if you think choosing invariance is arbitrary, choosing a prior that changes drastically if you measure in meters vs. kilometers is practically undesirable.
      *   Mention that "computational convenience" is a red herring in 2024.

  7.  **Finalizing the Recommendation:**
      *   Do not recommend the flat prior ($p(\sigma) \propto 1$). It is notoriously bad for scale parameters.
      *   Recommend Jeffreys ($p(\sigma) \propto 1/\sigma$) *or* a Weakly Informative Prior (e.g., Half-Student-t).
