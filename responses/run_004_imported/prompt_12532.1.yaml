      *   Computational Reality: Convenience isn't a factor anymore.
      *   Better Alternative: Weakly informative priors (Gelman's recommendation).
      *   Conclusion: Don't use flat; use Jeffreys or Weakly Informative.

  10. (Final Polish): Ensure I explicitly address the TA's argument about Jaynes. The TA says choosing symmetries is arbitrary. I should counter that choosing *units* is arbitrary, so we want a prior that doesn't care about units. That makes the symmetry choice pragmatic, not metaphysical.

  11. *Wait, one nuance:* The user asks "Which convenient prior would you recommend... given that the usual 'objective' alternative apparently has no defensible advantage." I need to challenge the premise that it has no *defensible advantage*. It has pragmatic advantages even if not metaphysical ones.

      *   *Plan:*
