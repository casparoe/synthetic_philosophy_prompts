answer: |-
  Ramsey would have looked at Lewis's triviality proof and declared it a vindication of his own original intuition, not a crisis for the theory of conditionals. He would have firmly joined Adams and Edgington: indicative conditionals are not truth-apt propositions.

  The key lies in how Ramsey operationalizes belief in "Facts and Propositions" versus how he treats conditionals in "General Propositions and Causality." For Ramsey, a proposition is a map against which we bet; its truth is simply the success of that map. But he explicitly distinguishes conditionals from this category. He writes that "If $p$, $q$" is not a molecular fact waiting to be true or false, but a "variable of hypothetical partial belief." The Ramsey Test is a procedure for *updating* credence, not for identifying a truth-maker.

  Lewis's proof relies on the assumption that a conditional is a proposition $A \rightarrow C$ that can be an object of belief with a standard probability $P(A \rightarrow C)$. Ramsey would argue this reifies a process into a state. On his betting account, to assess "If $p$, $q$" is to agree to a bet that is called off if $p$ is false. There is no payout condition when $p$ is false, meaning there is no truth value in that world. If there is no truth value, there is no proposition in the strict sense required for Lewis's algebra to bite.

  Ramsey's redundancy theory of truth supports this. To say "It is true that $p$" is just to assert $p$. But to say "It is true that if $p$, $q$" is not to assert a fact about the world independent of our epistemic stance; it is to endorse a policy of inference. Lewis showed that you cannot squeeze that policy into a truth-functional box without breaking probability theory. Ramsey, the pragmatist who cared about how concepts function in inquiry, would conclude that the box was the error. He wouldn't try to save the truth conditions; he'd say Lewis mathematically proved that conditionals aren't in the business of describing facts at all.
