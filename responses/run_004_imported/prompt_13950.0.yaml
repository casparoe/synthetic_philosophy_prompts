      *   He looks back up at the live feed. It looks guilty again.
      *   Why? Is the live feed different? Or is *he* different?
      *   The ending needs to leave the reader questioning the reliability of the sensory input itself.

  8.  **Refining the Philosophy:**
      *   Make sure Elias explicitly questions whether his eyes are lying or if his brain is editing.
      *   Use the term "penetration" or allude to the module concept without being too academic.
      *   The feedback loop: The more he looks, the worse it looks.

  9.  **Final Polish:**
