answer: |-
  **The Parallax**

  The control booth was soundproofed, a black box suspended above the rehearsal floor. Elias sat in the dark, the only light coming from the mixing board and the thick glass pane that looked down on the stage.

  Down there, the air was hazy with dust motes caught in the work lights. Mara was dancing with Julian. They were working on the *pas de deux* for the fall premiere, a piece about possession and release. Elias was the lighting director; he knew every cue, every shadow, every inch of the stage. He knew that when Julian lifted Mara, his hands were supposed to grip her ribcage, thumbs flat, professional, impersonal.

  Elias watched the lift.

  To his eyes, Julian's thumbs were not flat. They were curved. They were pressing into the fabric of her leotard, sinking into the skin beneath. The distance between their faces, which the choreography dictated should be eighteen inches, looked like six. It wasn't just a guess; the space itself seemed to have collapsed. The air between them had been sucked out, leaving a vacuum that pulled their bodies together.

  Elias blinked. He knew he was tired. He knew he had been drinking too much coffee and not enough water. He knew that three weeks ago, he had found a text on Mara's phone from Julian that was too warm, too late at night. *Cognitive noise,* he told himself. *Top-down interference.*

  He reached for the console and hit the record button on the isolated camera feed. "Let's run it again," he said into the talkback mic. His voice sounded flat in his own ears.

  Down on the floor, Mara nodded. Julian wiped his forehead. They reset.

  The lift happened again. Elias leaned forward, his nose almost touching the glass. This time, the distortion was worse. It wasn't just the distance. It was the color. The spotlight on Julian's hand seemed to bleed into Mara's skin, a bruise of light that lingered after the hand moved away. The trajectory of the lift looked slower, heavier, laden with an intention that wasn't in the notes.

  Elias felt the heat rise in his chest, a physical pressure behind his eyes. And as the heat rose, the visual field warped further. The stage floor seemed to tilt toward them, like the ridge trail on that hike in the Alps, gravity pooling around the couple. It was a feedback loop: the jealousy tightened his chest, and the tightened chest squeezed the visual data. He wasn't interpreting the scene as intimate; the intimacy was being rendered directly onto his retina.

  "Cut," Elias said.

  He pulled up the playback on the monitor to his left. This was the objective feed. The camera was high-angle, wide-lens, calibrated for spatial accuracy. He watched the recording of the lift he had just seen live.

  On the screen, the distance was correct. Eighteen inches. Maybe twenty. Julian's thumbs were flat. The light was clean white, not bleeding. There was no vacuum, no tilt, no lingering bruise of color. It looked like mechanics. It looked like work.

  Elias stared at the screen. His heart was still hammering against his ribs, the physiological residue of the fear. He looked from the monitor to the glass, then back to the monitor.

  The monitor showed a world of modules: light hitting sensors, data processed, image displayed. A Fodoran encapsulation. The world was stable; the bias was in him.

  But then he looked back through the glass.

  Mara was laughing at something Julian said. She touched his arm.

  On the monitor, the touch was a tap. A percussive beat. *Contact. Release.*
  Through the glass, the touch was a stroke. Her fingers hooked into his sleeve. The fabric stretched. The contact lasted three seconds longer than the audio waveform suggested.

  Elias put his hand on the fader to kill the lights. He had to stop it. If he kept watching, the geometry of the room might fail entirely. If he kept watching, the glass might dissolve, and the distance would become zero.

  But he didn't cut the lights. He sat there, paralyzed by the epistemological vertigo. If the monitor was right, he was broken. His mind was painting over reality, and he could never trust his eyes again. But if the glass was right—if the penetration was real—then the world itself was malleable. His jealousy wasn't just a reaction; it was a force. It was reaching out and touching them, curving the space, bending the light.

  "Mara," he said into the mic. He didn't mean to speak.

  She looked up, squinting into the dark booth. "Yeah, Eli?"

  "Where are his hands?" Elias asked. His voice cracked.

  Mara looked down at her own ribcage, then at Julian's hands, which were currently resting at his sides. She looked back up, confused. "They're at his sides, Eli. We're on break."

  Elias looked at Julian's hands. Through the glass, they were still hovering near her waist, ghostly afterimages burning in the negative space. He looked at the monitor. Empty air.

  "Right," Elias said. "Break."

  He killed the work lights. The stage plunged into darkness, but the afterimage remained. He sat in the black booth, the monitor glowing with the objective truth, while his eyes continued to see the crime. He realized then that it didn't matter which was real. The perception had already changed the behavior. He would light the scene differently now. He would cast shadows where there should be light. He would hide them from the audience, not because they were guilty, but because *he* saw them that way.

  The jealousy hadn't just shown him a different world. It had ensured he would have to live in it.
