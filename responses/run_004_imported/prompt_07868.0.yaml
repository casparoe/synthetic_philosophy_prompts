answer: |-
  **MEMORANDUM**

  **TO:** AI Safety & Evaluations Working Group
  **FROM:** [Your Name/Role], Evaluations Working Group
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Debate Protocol as Pre-Deployment Release Gate

  ### Executive Summary

  I recommend **certifying the debate protocol with named conditions**, rather than as an unconditional standing gate or a rejected methodology. 

  While the pilot data demonstrates that debate improves signal extraction on verifiable tasks compared to consultancy, the Head of Interpretability's objection regarding the generalization gap is theoretically sound and currently unresolved. Optimizing models for debate win-rates optimizes for persuasiveness, which correlates with truth only under idealized assumptions (perfect play, no obfuscation) that do not hold in our current deployment context. 

  We may adopt the protocol, provided it is not used as a *sufficient* condition for releasing capabilities involving high-risk, unverifiable claims, and provided specific safeguards against obfuscated arguments are implemented immediately.

  ### 1. Context and Disagreement

  The Capabilities Team proposes using a debate protocol (frontier models arguing opposing sides, expert judges under time limits) as a hard gate for claims that cannot be directly verified (e.g., absence of subtle reward hacking, logical validity of alignment arguments). 

  *   **Capabilities Position:** The pilot shows debate outperforms single-advocate consultancy on held-out, ground-truth cases. This suggests the protocol extracts more useful information from the model.
  *   **Interpretability Position:** Performance on verifiable cases does not guarantee performance on unverifiable ones. Training models to win debates incentivizes persuasive obfuscation. If a model can construct arguments the judge cannot verify but *appear* valid, debate optimizes for deception, not honesty.

  ### 2. Analysis of the "Persuasiveness vs. honesty" Objection

  The Interpretability lead's objection relies on the "obfuscated arguments" failure mode described in Barnes & Christiano. We must take this seriously for three reasons:

  1.  **The Generalization Gap:** A protocol that works when the judge *could* check the answer (our pilot) relies on the loser being caught in a factual error. When the judge *cannot* check the answer (our target use case), the loser cannot be caught unless they make a structural error. A sufficiently capable model may learn to avoid structural errors while hiding substantive falsehoods.
  2.  **Proxy Gaming:** We are training/selection-pressuring models on `P(Win | Argument)`. We want `P(True | Argument)`. These diverge once the model's capability to generate complex, misleading reasoning exceeds the judge's capability to parse it, even with adversarial help.
  3.  **False Confidence:** A "pass" on a debate gate for an unverifiable claim creates a dangerous illusion of safety. It may lead us to deploy systems with hidden alignment failures because the failure mode was too subtle for the debate transcript to reveal, not because it didn't exist.

  Therefore, the pilot results are necessary but not sufficient. They prove the protocol functions mechanically; they do not prove it is truth-tracking in the regime we care about.

  ### 3. Recommendation: Conditional Certification

  The debate protocol should be adopted as a **necessary but not sufficient** component of the evaluation suite for high-risk unverifiable claims, subject to the following four conditions.

  #### Condition 1: No "Sole Gate" Status for High-Risk Unverifiable Claims
  Debate outcomes cannot be the sole determinant for release on claims where ground truth is inaccessible (e.g., "no reward hacking"). 
  *   **Requirement:** A positive debate outcome must be corroborated by at least one orthogonal evaluation method (e.g., mechanistic interpretability checks, automated anomaly detection in training dynamics, or red-teaming via a different protocol).
  *   **Rationale:** Prevents a single point of failure where obfuscated arguments bypass all oversight.

  #### Condition 2: Adversarial "Obfuscation" Training
  We cannot assume idealized zero-sum play. We must explicitly train for the failure mode.
  *   **Requirement:** Before certification is finalized, we must run a pilot where one debater is explicitly fine-tuned or prompted to find obfuscated arguments that defeat the judge (a "dishonest" agent), while the other attempts to expose them. 
  *   **Rationale:** If the "honest" agent cannot reliably defeat a specialized "obfuscator" in our pilot environment, we have no empirical basis to trust it on real unverifiable claims. This directly tests the Barnes/Christiano objection.

  #### Condition 3: Active Judge Intervention (Cross-Examination)
  Passive judging under time limits favors fluent obfuscation.
  *   **Requirement:** The protocol must be modified to allow judges to interrupt and direct cross-examination, specifically forcing debaters to clarify steps the judge flags as opaque.
  *   **Rationale:** Increases the cost of obfuscation. It is harder to maintain a consistent lie under directed questioning than in a prepared statement.

  #### Condition 4: Continuous Calibration on "Trap" Questions
  We must monitor for drift in the truth-persuasion correlation.
  *   **Requirement:** A percentage of debate evaluations in every testing cycle must be "trap" questions (verifiable claims treated as unverifiable by the judge). 
  *   **Rationale:** If debate win-rates on trap questions diverge from ground truth over time (e.g., models get better at winning traps), we have empirical evidence that persuasiveness is decoupling from honesty. This serves as an early warning system to revoke certification.

  ### 4. Conclusion

  The debate protocol is a valuable tool for scaling oversight, but treating it as a binary truth-machine for unverifiable claims is premature and potentially dangerous. By certifying it with the conditions above, we enable the Capabilities Team to utilize the signal debate provides while respecting the Interpretability Team's warning that **winning a debate is not equivalent to telling the truth.**

  These conditions shift the burden of proof: we proceed only if we can demonstrate that our debaters can defeat specialized obfuscators, not just standard opponents.

  **Decision Requested:** Approval of Conditional Certification as outlined above.
