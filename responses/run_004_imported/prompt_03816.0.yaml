      *   *Anti-SPI (let's call him Marcus):* Focus on the *implementation*. Which SPI? There are many. Picking one is a bargaining problem itself. Also, the "default" isn't neutral; it's determined by capabilities. If I'm stronger, I don't want an SPI that neutralizes my advantage. And crucially: can we actually bind ourselves? In the real world, commitments are leaky.

  3.  **Drafting - Scene Setting:**
