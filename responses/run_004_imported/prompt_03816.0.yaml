          *   *Anti-SPI:* It's sleight of hand; the "SPI selection problem" re-imports the bargaining fight; "safety" is relative to biased threat points; verification is impossible outside of idealized program equilibrium.
      *   **Tone:** High-level intellectual engagement, no talking past each other, no tidy concession/compromise at the end.
