  5.  **Refining the Arguments (incorporating specific Oesterheld/Conitzer concepts):**
      *   *Surrogate Goals:* Instead of fighting over territory, fight over a surrogate variable that correlates but costs less.
      *   *Program Equilibrium:* The ideal case where code is visible. Marcus needs to punch holes in applying this to opaque neural nets or human institutions.
      *   *Weak Pareto:* Elena needs to emphasize that *everyone* gains relative to the Nash equilibrium of the original game.
      *   *Bargaining Problem:* Marcus needs to insist that choosing *which* Pareto improvement is itself a bargaining problem (the " bargaining over the SPI" issue).

  6.  **Writing - Iteration 1 (Mental Check):**
      *   *Critique:* Is Marcus too cynical? Is Elena too naive?
      *   *Fix:* Make Elena acknowledge the selection problem but argue it's *easier* than the original problem. Make Marcus acknowledge the math holds but the sociology fails.
      *   *Specific Terminology:* Use "threat point," "surrogate goal," "program equilibrium," "commitment device," "ordinal equivalence."

  7.  **Writing - Iteration 2 (Focusing on the "Relocating the Problem" critique):**
