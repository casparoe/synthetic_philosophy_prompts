      *   **Elena's Final Point:** The rhetoric is intentional. It's *Ecce Homo* ("Behold the Man"). It's a display of a specific type of human being. It's not a manual for everyone.
      *   **Marcus's Closing:** I still think it's dangerous, but I see the distinction. It's a performative contradiction that reveals his method.
