answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct honor of standing here today to celebrate Priya and Tom.

  Now, most couples have a "meet cute." Maybe it was spilling coffee, or meeting at a bar. Priya and Tom's meet cute was a disagreement over the ontological status of the word "We."

  That's right. They are both philosophers of action. And for the last six years, they have been having the exact same argument. Priya defends Margaret Gilbert's view that when two people commit, they form a "plural subject"—a new entity that is greater than the sum of its parts. Tom defends Michael Bratman's view that shared intention is just two individuals meshing their personal sub-plans together.

  In plain English: Priya believes marriage makes you *one*. Tom believes marriage makes you *two people who are really good at coordinating.*

  And while Table 4 is currently taking bets on who wins this argument, I'm here to tell you that looking at them tonight, the result is already in. But first, we have to address the elephant in the room regarding the vows we just heard.

  Because this isn't just academic for them. It's legal. And normative.

  See, under Tom's Bratmanian view, these vows are binding because their individual intentions currently align. They mesh. But if Tom's sub-plans change—say, he decides he wants to move to Antarctica to study penguins, and Priya does not—technically, the shared intention dissolves.

  But under Priya's Gilbertian view, these vows create a joint commitment that cannot be unilaterally rescinded. You cannot just *decide* to stop being married. You have to renegotiate the constitution of the "We."

  So, I have one question for the Groom. Tom, if you wake up tomorrow and decide you don't want to do the dishes... Bratman says you can just update your plan. But Gilbert says you are ontologically forbidden from opting out without Priya's consent.

  Tom's Grandma, this basically means Priya has him on a technicality: He is literally not allowed to quit. And for the postdocs at Table 4... well, let's just say Priya holds the normative power of rescission. Tom, my friend, you are stuck.

  But here is the truth, and why neither of them has to lose this argument tonight.

  A marriage cannot survive on just one of these theories.

  If you are only Bratman—if you are only "meshing sub-plans"—then what happens when the plans don't mesh? What happens when one of you loses a job, or gets sick, or when the coordination fails? If the bond is only as strong as the current alignment of your individual goals, it's fragile.

  But if you are only Gilbert—if you are only a "plural subject" with no room for individual agency—you lose the people inside the marriage. You become a machine.

  The magic of Priya and Tom is that they live in the tension.

  When things are going well, they are Bratmanians. They coordinate. They respect each other's individual sub-plans. They let each other be "I"s.

  But when things get hard—when the plans *don't* mesh, when life gets in the way—they become Gilbertians. They rely on the joint commitment. They rely on the fact that they are a "We" that cannot simply walk away. They rely on the binding force of the promise itself, not just the convenience of the arrangement.

  Priya, you give them the strength to stay. Tom, you give them the flexibility to grow.

  So, Priya and Tom: May your sub-plans mesh beautifully for the next fifty years. But may your joint commitment be strong enough to hold you together when they don't. May you be two individuals who choose each other every day, and one united force that nothing can break.

  Please raise your glasses. To the Plural Subject! To the Mesh! To Priya and Tom!
