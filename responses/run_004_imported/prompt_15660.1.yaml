answer: |-
  Thank you for trusting me with this. It is a profound challenge to honor a specific intellectual integrity while offering genuine comfort, but your mother's life suggests that those two things aren't opposites. In fact, her work suggests that truth *is* the comfort.

  Here is a draft for the eulogy. It is written to be spoken, with pauses and rhythms in mind. It avoids the language of fate while leaning into the language of choice and preciousness.

  ***

  **Eulogy for [Mother's Name]**

  My mother died on Tuesday.

  For those of you who know me, you know I teach philosophy. For those of you who know her, you know she taught history. We spent a lot of time at the dinner table arguing about how the world works. Specifically, we argued about why things happen.

  She spent her entire career studying the July Crisis of 1914. She studied the month that led to the First World War. And if you know her work, you know she had a very specific, very stubborn argument.

  The common story about 1914 is that the war was inevitable. That once the gears started turning, once the mobilization schedules were set, the tragedy was locked in. That it was fate. That it was destiny. That the world was simply "ready" for a collision.

  She spent forty years proving that wrong.

  She taught that the war happened because of specific, fragile, human moments. She taught that a driver took a wrong turn onto Franz Josef Street, putting the Archduke right in front of an assassin who had already given up. She taught that the Kaiser, days before the end, was writing notes in the margins of documents looking for a way out. She taught that peace was possible at four or five different points in that summer, right up until the moment it wasn't.

  She believed that history was not a train on a track. She believed it was a path through a wood, where every step was a choice, and every choice could have been different.

  I tell you this not to give a lecture, but because she would be furious if I stood here and told you that "her time had come."

  She hated that phrase. If we were at a funeral and someone said the deceased was "meant to be" with God, or that they died "according to a plan," she would elbow me in the pew. She believed that saying a tragedy was "meant to be" was a way of absolving ourselves of the reality of loss. It smooths over the rough edges. It makes a story neat.

  But my mother loved the rough edges. Because the rough edges are where the truth lives.

  And the truth is, she is not here because it was "time." She is not here because of a schedule. She is here, and then she is gone, and that is a contingency. It is a break in the pattern. And it hurts.

  But I want to suggest to you, especially those of you who are hurting the most right now, that her view of the world offers us something better than fate. It offers us value.

  If nothing is inevitable, then every moment she was kind to a neighbor, every time she stayed up late to grade a paper, every time she hugged her grandchildren, was not a requirement of the universe. It was a choice.

  She wasn't playing a role written for her. She was writing the script in real time.

  For her colleagues here: We will miss her rigor. We will miss her insistence that we look at the marginalia, that we look for the exit ramps even when the highway seems full speed ahead. She taught us that fatalism is lazy. She taught us that believing the future is fixed is a way of giving up on the present.

  For her family and friends: I know you want to know why. I know you want a reason that fits. But I think the greatest comfort she can leave us is the knowledge that she didn't believe her life was a transaction. She didn't believe she was here to complete a destiny. She believed she was here to live the time she had, as fully and as openly as possible.

  Because the future is not written, the past matters more. Because she could have been otherwise, the fact that she was *this* way—generous, sharp, stubborn, loving—is a miracle of probability.

  There is a temptation, in grief, to look back and see only the end. To see the mobilization schedules. To see the illness, the age, the final days, and think that was the point of the story.

  She would tell us to look at the wrong turns. Look at the moments where things could have gone darker, but didn't. Look at the marginal notes where she looked for a way to help someone. Look at the summers where peace held, and love grew, against the odds.

  We are not gathered here because this was supposed to happen. We are gathered here because, for a while, against the odds, it didn't. We got to have her. We got to know her. We got to be loved by her.

  That was not guaranteed. That was not scheduled. That was a gift of contingency.

  So, we will not say she is in a better place. We will not say she is at rest. We will say that she was here, and she made a difference, and the world is different because she walked through it.

  And for those of us left behind, the future is still unwritten. There are no mobilization schedules for our grief. There is no timetable for how we move forward. There are only the choices we make next.

  I think she would want us to look for the exit ramps. I think she would want us to look for the ways out of the darkness. I think she would want us to believe that peace is possible, even now. Especially now.

  Thank you.
