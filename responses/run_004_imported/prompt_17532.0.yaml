          *   *Kantian Accuracy:* Here is the rub. Kant *does* argue for indirect duties. However, the *reason* is usually cited as damaging the *human's* moral character. Kant argues that cruelty to animals dulls our sympathy for human suffering. It weakens the "humanity" in us.
