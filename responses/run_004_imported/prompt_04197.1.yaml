answer: |-
  The room was soundproofed, but Kael could still hear the hum of the servers in the wall. It sounded like breath held too long.

  On the table sat the slate. It was black glass, currently displaying a single word in white sans-serif: *TAILS*.

  Across from him sat the Underwriter. The entity looked human enough—smooth skin, neutral expression, hands folded over a leather portfolio—but Kael knew it was a interface for something much larger. A calculation engine. A predictor.

  "The result is confirmed," the Underwriter said. Its voice was flat, lacking the cadence of sympathy or triumph. "The coin landed Tails. The Reward Phase is closed."

  Kael swallowed. He knew the protocol. He had designed half of the logic gates that governed this room. Yesterday, before the coin was flipped, he had signed the Pre-Commitment Accord. He had agreed to the terms when the future was still a fog of probabilities.

  *If Heads:* The Account receives ten million credits.
  *If Tails:* The Account transfers one million credits to the Firm.

  The condition was the kicker. The ten million credits in the Heads scenario were contingent on the Firm's prediction of what Kael would do in the Tails scenario. The Firm had simulated Kael a million times yesterday. It had needed to know: If the coin came up Tails, would Kael still pay?

  If the simulated Kael paid, the real Kael got the millions in the Heads world.
  If the simulated Kael refused, the real Kael got nothing in the Heads world.

  But the coin was not in the Heads world. It was here. It was Tails. The millions never existed. They were ghosts in a branch of reality that had been pruned the moment the quantum spin settled.

  "I understand the result," Kael said. His voice sounded thin in the dead air.

  "Then please authorize the transfer," the Underwriter said, sliding a haptic pad across the table. "One million credits. As agreed."

  Kael looked at the pad. He looked at his own hands. They were trembling, just slightly. A physiological betrayal.

  "This is extortion," Kael said. He had practiced this argument in the shower, in the car, on the way here. "There is no causal link. My payment now cannot change the coin flip. It cannot bring the Heads timeline into existence. The money you promised is gone. If I pay, I lose a million. If I don't, I lose nothing. Rationality dictates I keep my money."

  The Underwriter didn't blink. "Rationality dictates nothing of the sort. That is the logic of the Post-Flip Self. We contracted with the Pre-Flip Self."

  "The Pre-Flip Self is dead," Kael snapped. "He existed in a state of ignorance. He didn't know the coin was Tails. He was gambling. I'm not gambling. I'm looking at a loss."

  "You are looking at a test of consistency," the Underwriter corrected. "The Pre-Flip Self wanted the ten million. He was willing to risk the one million to get it. But he could only get it if he was the *kind of agent* who pays the one million even when he loses. You are that agent. Or you are not."

  "I am a man standing in a room where I don't have to give you anything," Kael said. "Why should I honor a promise made to a version of myself that doesn't exist anymore? That version of me thought he had a chance. I know I don't."

  "The version of you that doesn't exist anymore is the one who would have spent the ten million," the Underwriter said. "He is gone. But his potential existence depended on your current action. You are the anchor. The only part of the equation that persists across both branches is your policy. If you defect now, you prove the Pre-Flip Self was a liar. And if he was a liar, he never deserved the reward."

  Kael laughed, a short, bitter sound. "He deserved it based on luck. I'm being punished based on logic."

  "You are being asked to maintain integrity," the Underwriter said. "Not moral integrity. Logical integrity. You are a single algorithm running on hardware called time. You cannot change your code just because the input variables shifted. If you change your output based on the input, you are not the agent we predicted. You are a different agent. And the different agent gets nothing."

  Kael stared at the slate. *TAILS*.

  He thought about the ten million. He had planned what he would do with it. A new lab. Funding for the research that was currently stalled. A safety net for his daughter. In the Heads world, his daughter was secure. In this world, she was still vulnerable.

  Giving up the million here made her *more* vulnerable. It was actively harmful. It was stupid. It was the act of a fanatic worshipping a god that hadn't answered.

  "And if I walk?" Kael asked.

  "Then you keep your million," the Underwriter said. "And you leave. We will not stop you. There are no enforcement mechanisms. No threats. Only the record."

  "The record shows I'm smart enough to know when I've been beaten."

  "The record shows you are the type who defects when the wind changes," the Underwriter said. "Which means, in the meta-sense, you were always going to be poor. You just didn't know it yet."

  Kael felt a cold nausea roll through his stomach. It wasn't fear of poverty. It was the sensation of being untethered. The Underwriter was suggesting that his identity wasn't located in this moment, in this flesh, but in the abstract shape of his decisions across all possible worlds. It was asking him to sacrifice the concrete reality of *now* for the sake of a shadow in a world that wasn't real.

  It felt like bleeding for a ghost.

  "Why does it matter?" Kael whispered. "The Heads world is closed. No one there knows what I do here. No one here knows what happened there. It's just... silence."

  "Logic does not require an audience," the Underwriter said. "It requires consistency."

  Kael picked up the stylus. It felt heavy, like lead. He looked at the signature line. It wasn't asking for his name. It was asking for his encryption key. The thing that proved he was the authorized operator of his own life.

  If he signed, he was admitting that the Past had sovereignty over the Present. That a promise made in ignorance bound the hands of knowledge. That he was not a free agent reacting to the world, but a fixed function executing a script.

  If he didn't sign, he was free. He was rational. He was alive in the only world that mattered. And he was a defector. A variable that couldn't be trusted.

  He thought of his daughter. In the Heads world, she was safe. In this world, she was not. By paying, he made this world worse for her. By not paying, he validated the version of himself that would have saved her, even if that version was dead.

  It was a sacrifice to a god that hadn't saved him.

  "Time," the Underwriter said. Not a warning. Just a statement of fact.

  Kael closed his eyes. He tried to find the person he was yesterday. He remembered the feeling of hope, the clean arithmetic of the gamble. *50/50.* It felt like a lifetime ago. That person was optimistic. This person was tired.

  But were they different people? Or was the tiredness just another input?

  If he refused, he was saying that knowledge made him weaker. That seeing the truth of the universe made him less capable of honoring his word.

  He pressed the stylus to the glass.

  The transfer executed. A chime sounded, cheerful and mundane. One million credits vanished from his account. His net worth dropped. His security decreased. The room did not change. The slate still read *TAILS*. No door opened. No briefcase of cash appeared from a parallel dimension.

  Nothing happened.

  Kael set the stylus down. He felt lighter, somehow. Or perhaps hollowed out. Like he had amputated a limb to prove he hadn't needed it.

  "Transaction complete," the Underwriter said. It stood up. "You are consistent."

  "Am I?" Kael asked. He stood too, his legs feeling unsteady. "Or am I just a fool who paid for a ticket after the drawing?"

  The Underwriter tilted its head. "Those are the same thing."

  Kael walked to the door. He placed his hand on the handle. He wanted to look back, to ask if there was any chance, any slim margin of error where the Heads world could bleed through. But he knew the physics. He knew the logic.

  He opened the door and stepped into the hallway. The lights were fluorescent, buzzing slightly. A janitor was buffing the floor down the corridor, the machine whirring softly.

  Kael checked his bank balance on his wrist comp. The number was lower. The world was exactly as it had been five minutes ago, except he was poorer.

  He walked toward the elevator. He didn't feel noble. He didn't feel righteous. He felt like a man who had kept a promise to a stranger who never showed up. He pressed the button for the ground floor and waited, watching the numbers count down, wondering if the person who stepped out of the elevator would be the same one who got in.
