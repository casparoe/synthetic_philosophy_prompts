      *   *Stoics (Marcus Aurelius, Epictetus):* Acceptance based on *cosmic rationality (Logos)*. Fate is rational and good. We have a duty to align our will with Nature. There is a fixed self (the ruling faculty) that must choose virtue. *Amor fati* is loving the fate because it is rational/necessary.
