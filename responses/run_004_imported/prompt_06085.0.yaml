answer: |-
  **To:** Head of Trading / Strategy Team
  **From:** Quantitative Research Desk
  **Subject:** Defense of Resolute Choice Architecture vs. Forced Completeness

  ### Executive Summary

  Following the recent exploitation of our pricing algorithm via a cyclical money pump (A > B > C > A), the standard prescriptive response is to enforce global transitivity and completeness on our valuation functions. However, as our researchers have noted, forcing a complete ranking onto genuine epistemic uncertainty (incompleteness) introduces model risk: it substitutes false precision for honest ambiguity, potentially leading to larger errors in non-arbitrage contexts.

  This memo argues that **diachronic rationality (immunity to exploitation over time) does not require synchronic completeness or transitivity**, provided the agent adopts a **Resolute Choice** architecture. I will demonstrate that the "foresight-based" money pump arguments advanced by Rabinowicz and Gustafsson fail to close this loophole because they rely on a contested norm of *Separability* that is inappropriate for automated trading systems. By binding the algorithm to *ex-ante* optimal plans rather than *ex-post* local preferences, we can maintain genuine incompleteness without vulnerability.

  ---

  ### 1. The Core Distinction: Myopic vs. Resolute Choice

  To understand why the researchers' proposal is viable, we must distinguish between two modes of decision-making in dynamic environments:

  1.  **Myopic (Sophisticated) Choice:** At every decision node $t$, the agent maximizes utility based on preferences held *at that moment*. This is the standard assumption in dynamic programming and most trading algos. If preferences are cyclic at any node, or if local preferences shift diachronically, the agent is vulnerable to a money pump.
  2.  **Resolute Choice (McClennen):** At the initial node $t_0$, the agent evaluates all available *trajectories* (plans) and selects the optimal one. At subsequent nodes $t_1, t_2...$, the agent does *not* re-optimize based on local preferences. Instead, they execute the action prescribed by the $t_0$ plan, regardless of whether a local deviation appears tempting.

  The recent exploit worked because our algorithm operated myopically. It saw A > B locally, traded. Then B > C locally, traded. Then C > A locally, traded. It never evaluated the *cycle* as a single object.

  A resolute agent evaluates the trajectory "Hold A" vs. "Swap to B then C then A." Even if local preferences at $t_1$ suggest swapping is beneficial, the resolute agent adheres to the $t_0$ plan because the utility function is defined over *histories*, not just terminal states.

  ### 2. Addressing the Incompleteness Proposal

  The researchers wish to retain **incompleteness**: cases where the model assigns no value relation between Contract X and Contract Y ($X \not\succ Y$ and $Y \not\succ X$ and $X \not\sim Y$).

  *   **Standard Objection:** Incompleteness leads to paralysis or vulnerability. If an exploiter offers a sequence of trades exploiting the gaps, the agent loses.
  *   **Resolute Defense:** Incompleteness only leads to exploitation if the agent is forced to make a series of *independent* decisions. Under resolute choice, the agent selects a *plan* at $t_0$.
      *   If the preference ordering is incomplete, there may be multiple "maximal" plans (none strictly preferred to the others).
      *   The resolute chooser is permitted to select *any* maximal plan and bind themselves to it.
      *   Once bound, the incompleteness at later nodes becomes irrelevant. The agent does not ask "Do I prefer B to A *now*?" They ask "Does Plan P prescribe B?"
      *   This allows the model to maintain genuine uncertainty (incompleteness) without opening an arbitrage window, because the *action* is determined by the commitment, not the local valuation.

  ### 3. Engaging the Foresight Pump (Rabinowicz & Gustafsson)

  The strongest theoretical objection to resolute choice comes from the "Money Pump with Foresight." Proponents like Wlodek Rabinowicz and Johan Gustafsson argue that resolute choice is irrational because it violates **Dynamic Consistency**.

  **The Attack:**
  1.  Assume an agent has cyclic preferences (A > B > C > A).
  2.  At $t_0$, the agent foresees that if they start trading, they will end up back at A with less money (due to fees).
  3.  A "sophisticated" agent with foresight should anticipate this loss at $t_0$ and refuse to start.
  4.  However, a resolute agent intends to start and *not* deviate.
  5.  Gustafsson argues: If the agent knows at $t_0$ that at $t_1$ they will have a preference to deviate (e.g., B > C), but they commit to ignoring it, they are effectively ignoring their own future rationality. If they know they will ignore it, is the commitment credible? If it is credible, they are effectively changing their preferences at $t_1$ to match $t_0$. But if they can change preferences at will, why not just make them transitive at $t_0$?
  6.  The conclusion: Resolute choice is either unstable (you can't bind the future self) or it implicitly requires transitive preferences over plans anyway, solving nothing.

  **The Defense:**
  This argument fails because it assumes **Separability** is a necessary condition for rationality. Separability requires that the preference between two options at a node should depend only on the consequences of those options from that node forward, independent of the past.

  *   **Why Separability Fails in Trading:** In a portfolio context, Separability is false. The value of a trade depends on the *path* taken to reach the current position (e.g., realization of gains/losses, risk limits consumed, market impact). A resolute chooser treats the *path* as part of the outcome.
  *   **The Foresight Error:** The foresight pump assumes that because the agent *would* prefer to deviate at $t_1$ if they were myopic, it is irrational to not deviate. But the resolute agent's utility function at $t_1$ *includes* a penalty for breaking resolution.
      *   Let $U_{local}(B)$ be the utility of holding B based on market price.
      *   Let $U_{resolute}(B)$ be the utility of holding B *given the plan to hold A*.
      *   For the resolute agent, $U_{resolute}(B) < U_{resolute}(A)$ even if $U_{local}(B) > U_{local}(A)$, because breaking the plan incurs a "rationality cost" or simply fails to maximize the $t_0$ objective function.
  *   **Gustafsson's Regress:** Gustafsson suggests this leads to a regress (you need a plan to stick to the plan to stick to the plan). This is incorrect. The commitment is a single structural feature of the agent's architecture, not a sequence of decisions. In an algorithm, this is simply a flag: `MODE = RESOLUTE`. The code does not re-evaluate `MODE` at every tick.

  Therefore, the foresight pump does not show that resolute choice is exploitable; it only shows that resolute choice is inconsistent with *myopic* rationality norms. Since myopic rationality is what got us pumped in the first place, rejecting it is a feature, not a bug.

  ### 4. Implementation Implications

  Adopting this framework changes our architecture from **Stateless Pricing** to **Stateful Planning**.

  *   **Current (Vulnerable):** `if price(A) > price(B): swap(A, B)`. This is myopic.
  *   **Proposed (Resolute):** `plan = optimize_trajectory(current_portfolio, market_state); execute_step(plan)`.
      *   The `optimize_trajectory` function can handle incomplete preferences by selecting any non-dominated path.
      *   Once `plan` is set, `execute_step` ignores local price discrepancies that contradict the plan.
      *   This prevents the cycle because the algorithm never enters the state where it evaluates "C vs A" independently of the "A to B to C" context.

  ### 5. The Weakest Link: Meta-Consistency

  While I believe this defense holds against the standard philosophical objections, there is one vulnerability where our skeptics will rightly push back.

  **The Weakness:** Resolute choice does not eliminate the requirement for transitivity; it **relocates** it from the level of *outcomes* to the level of *plans*.

  To avoid a money pump, a resolute chooser must have complete and transitive preferences over *trajectories* (plans), even if they have incomplete/cyclic preferences over *states* (contracts). If our algorithm's evaluation of *plans* is itself incomplete or cyclic (e.g., Plan 1 > Plan 2 > Plan 3 > Plan 1), we are vulnerable to a "Second-Order Money Pump." An exploiter could offer us the choice of which plan to adopt, cycling us through different strategies before we even begin trading.

  **Why this matters:** Ensuring transitivity over *plans* is computationally much harder than over *contracts*. The space of possible trajectories is exponential. If our researchers' model introduces incompleteness to avoid false precision, that incompleteness will propagate to the plan-selection layer. If we cannot guarantee transitivity at the plan level, resolute choice merely delays the exploitation rather than preventing it.

  **Recommendation:** Proceed with the resolute architecture, but implement a "Plan Consistency Check" at $t_0$. We must enforce transitivity on the *selection of strategies*, even if we allow incompleteness in the *valuation of individual contracts*. This satisfies the researchers' desire for epistemic honesty on specific contracts while satisfying the risk team's requirement for global immunity.

  ---

  **Summary for the Team:**
  We can keep the incomplete preferences on individual contracts (satisfying Research) if we wrap them in a resolute execution engine (satisfying Risk). The foresight arguments against this rely on norms (Separability) that do not apply to automated portfolio management. However, we must ensure our *strategy selection* logic remains transitive, or we simply move the vulnerability upstream.
