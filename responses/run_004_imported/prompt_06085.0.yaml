      *   Flag weakest link? Yes.
      *   Tone: Professional, analytical, suitable for a quant team.

  7.  **Final Polish:** Ensure the distinction between "incompleteness" (no view) and "cyclicity" (A>B>C>A) is clear, as the prompt conflates them slightly but implies both are at issue. The researchers want to keep incompleteness; the pump exploited cyclicity. Resolute choice handles cyclicity by binding; it handles incompleteness by arbitrary selection within the plan.

