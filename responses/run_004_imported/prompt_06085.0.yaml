      *   My argument is that resolution protects against exploitation without completeness.
      *   The weak link is: **Resolute choice shifts the burden of consistency from outcomes to plans.** To avoid a money pump on outcomes, your preferences over *plans* must be complete and transitive. If your meta-preferences over strategies are themselves incomplete or cyclic, you are still vulnerable, just at a higher order. This doesn't solve the foundational problem; it relocates it.

  6.  **Review against Constraints:**
