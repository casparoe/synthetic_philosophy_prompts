  *(Self-Correction on the Nash Bargaining point)*: I need to be careful not to get the math wrong. Nash Bargaining maximizes $(u_1 - d_1)(u_2 - d_2)$. If utilities are linear in money, it maximizes the product of monetary gains. Maximizing product $\equiv$ Maximizing Sum of Logs. This aligns with Geometric Mean. I'll have Alex make this link explicitly.

