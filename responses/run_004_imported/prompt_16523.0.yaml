answer: |-
  **Title:** The Phantom Mean
  **Characters:**
  *   **ALEX:** Advocates for the Kelly Criterion and geometric growth.
  *   **BEN:** Advocates for pure Expected Value (EV) maximization.

  **Setting:** A seminar table, littered with coffee cups and printouts. A stack of chips sits between them. They are simulating a sequence of 100 coin flips (60% heads, 1:1 payout).

  ***

  **BEN:** (Shoving a large pile of chips forward) All in.

  **ALEX:** (Carefully separating a small fraction) Twenty percent. You know the math, Ben. Edge is 20%. Kelly says bet 20%.

  **BEN:** Kelly assumes I care about the *geometric* mean. I don't. I care about the *expected value*. Every flip has a positive expectation of 80% return on the stake. If I bet everything, my expected wealth after ten rounds is astronomical compared to your piddling 20%. Why are you throttling your own upside?

  **ALEX:** Because that "astronomical expected wealth" is a phantom. It's driven by one outlier timeline where you flip heads a hundred times in a row. In almost every other timeline—the ones actual people inhabit—you hit a tails eventually. One tails, and you're at zero. Game over.

  **BEN:** But I'm not *actually* going to go broke in the expectation calculation. The arithmetic average of all possible worlds is what matters for rationality. If you maximize the arithmetic mean, you maximize the resources available to the universe. You're smuggling in a utility function. You're saying, "I have log utility of wealth," and pretending it's an objective fact about rationality. It's not. It's just risk aversion.

  **ALEX:** It's not risk aversion. It's ergodicity.

  **BEN:** Here we go.

  **ALEX:** No, listen. You're treating this process as ergodic. You think the average across parallel universes (the ensemble average) is the same as the average through time in one universe (the time average). But this process is non-ergodic. Wealth multiplication is path-dependent. If you lose 50%, you need a 100% gain just to get back to even. The arithmetic mean ignores the sequence. The geometric mean respects it. I'm not maximizing log utility because I'm scared of risk; I'm maximizing the time-average growth rate because that's the only growth rate I will actually experience.

  **BEN:** Okay, but that only holds if the game is infinite. If we stop after five rounds, my EV strategy dominates. By insisting on the "long run," you're imposing an arbitrary horizon. And honestly, even if we play forever, why is *survival* the goal? Maybe the rational move is to burn bright and die. If the goal is to maximize end-state wealth *expectation*, betting full bankroll is the unique solution. You're privileging "staying in the game" as a terminal value without justifying it.

  **ALEX:** Staying in the game isn't a value; it's a precondition for agency. If you hit zero, you can't bet. You can't eat. You can't influence the world. Probability 1 of ruin converges very fast when you bet over-Kelly. But look, this goes beyond betting. It's about how we aggregate value period.

  **BEN:** How so?

  **ALEX:** Think about the Nash Bargaining Solution. When two agents bargain, the rational solution maximizes the *product* of their utility gains. Maximizing a product is mathematically isomorphic to maximizing the sum of logs. It's geometric rationality again. It suggests that rational cooperation, like rational betting over time, requires balancing proportions, not just summing totals. The geometry of rationality is multiplicative, not additive.

  **BEN:** That's a huge leap. Nash bargaining relies on specific axioms about independence of irrelevant alternatives and symmetry. Just because the math looks like logs doesn't mean the *ontology* is geometric. You're trying to turn a specific solution concept in game theory into a grand unified theory of reason. Maybe Nash is just describing how risk-averse agents compromise, not how the universe works.

  **ALEX:** Or maybe risk aversion is just the shadow cast by geometric rationality in a linear world. We think we're "averse" because we're intuitively sensing the non-ergodicity. We know, deep down, that losing everything removes us from the ensemble.

  **BEN:** I think you're conflating "rational for a human who needs to eat" with "rational simpliciter." If I were an immortal algorithm with no utility decay, I'd bet 100%. Your "geometric rationality" is just physics imposing constraints on biology. It's not decision theory; it's biology.

  **ALEX:** But we *are* biological entities existing in time. Decision theory for gods might be arithmetic. Decision theory for us has to be geometric. If your theory requires you to be immortal to work, it's not a theory for decision-makers.

  **BEN:** (Pauses, looking at his stack of chips) So you're saying the Kelly Criterion isn't a strategy; it's an acknowledgment of mortality.

  **ALEX:** I'm saying it's an acknowledgment of time.

  **BEN:** (Shrugs) I still think the EV is higher.

  **ALEX:** (Smiles faintly) In the worlds where you don't exist, sure.

  **BEN:** Deal the first card.

  ***

  **[End of Dialogue]**
