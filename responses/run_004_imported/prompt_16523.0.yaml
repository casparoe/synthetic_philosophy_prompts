      *   *Argument:* Ben: "Arithmetic mean grows faster." Alex: "Arithmetic mean is a phantom."
      *   *Ergodicity:* Alex needs to explain that ensemble average $\neq$ time average in non-ergodic processes.
      *   *Generalization:* Alex brings in the idea that cooperation/bargaining is also geometric. Ben thinks that's a stretch.
      *   *Ending:* They agree to disagree, but acknowledge the tension.

  6.  **Final Polish:** Check against constraints.
      *   Kelly fraction mentioned? Yes (20%).
      *   EV objection (smuggling utility)? Yes.
      *   Ergodicity/Time-average? Yes.
