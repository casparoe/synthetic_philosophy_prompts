prompt: |-
  I started on my company's interpretability team about two months ago and it's already caused a small war in our Slack -- half the team talks about the "features" our sparse autoencoders pull out of the model like we've discovered actual organelles inside it, and the other half thinks thats basically astrology done with linear algebra. For the internal podcast thing a coworker and I run, we've got one of the loudest realists on the team coming on next week, and her go-to move whenever anyone pushes back is always some version of "a feature is real if it earns its keep" -- which somehow ends every argument without answering it. Can you draft 8 or 9 interview questions that make that line harder to use each time, instead of just letting her restate the pitch? I want at least one on why this particular sparse decomposition of the activations should count as the real one and not some other, equally sparse, equally predictive decomposition; one on the gap between a direction being decodable and it actually being used causally downstream (theres that Othello-GPT case, where -- if I'm remembering right -- the board representation only came out linear once someone changed the basis, which feels relevant); one on superposition and polysemanticity more generally; and a last one that pins down what result would actually get her to stop calling these things real. Add a follow-up to each, keyed to whatever answer she's most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** The user works on an interpretability team at an AI company. There's internal conflict: "Realists" (SAE features are like biological organelles) vs. "Skeptics" (SAE features are astrology/linear algebra artifacts).
      *   **Task:** Draft 8-9 interview questions for an internal podcast.
      *   **Guest:** A "loud realist" who uses the phrase "a feature is real if it earns its keep" to shut down arguments.
      *   **Goal:** Make that specific defensive line harder to use. Force specificity. Avoid letting her restate the pitch.
      *   **Required Topics:**
          1.  Uniqueness of decomposition (why *this* sparse decomposition?).
          2.  Decodability vs. Causal Usage (Othello-GPT reference).
          3.  Superposition and Polysemanticity.
          4.  Falsification conditions (what would make her stop calling them real?).
      *   **Format:** 8-9 questions, each with a specific follow-up keyed to her likely evasive answer.

  2.  **Deconstruct the Guest's Defense ("Earns its keep"):**
      *   *Meaning:* Pragmatic utility. If a feature helps predict, intervene, or explain, it's "real."
      *   *Weakness:* It's circular. Utility $\neq$ Ontology. A map is useful, but the borders aren't physically real. Ptolemaic epicycles "earned their keep" for centuries but weren't "real" mechanisms.
      *   *Strategy:* Push on the difference between *instrumental value* and *ontological status*. Push on *uniqueness* (many maps work). Push on *causality* (correlation vs. mechanism).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: Uniqueness of Decomposition.*
          *   *Draft 1:* Why is this SAE the right one?
          *   *Critique:* Too easy to say "because it works."
          *   *Refinement:* Focus on the mathematical non-uniqueness. Rotational invariance.
          *   *Final Q1:* Focus on the "rotation problem." If I rotate the basis, can I find another sparse set?
          *   *Follow-up:* If she says "but this one is sparsest," ask about the regularization penalty's arbitrariness.

      *   *Topic 2: Decodability vs. Causality (Othello-GPT).*
          *   *Draft 1:* Is decoding enough? Remember Othello?
          *   *Critique:* A bit leading.
          *   *Refinement:* Distinguish between reading a state and the model using that state.
          *   *Final Q2:* Contrast linear probes with causal interventions. If we can read it, does the model *use* it?
          *   *Follow-up:* If she says "interventions work," ask about the specificity of the intervention (does it break other things?).

      *   *Topic 3: Superposition/Polysemanticity.*
          *   *Draft 1:* What about polysemanticity?
          *   *Critique:* Too broad.
          *   *Refinement:* Focus on the "feature split." When one neuron does two things, is that one feature or two?
          *   *Final Q3:* How do we define the boundary of a feature when concepts overlap?
          *   *Follow-up:* If she says "we just train harder," ask about the theoretical limit of disentanglement.

      *   *Topic 4: Falsification.*
          *   *Draft 1:* What would change your mind?
          *   *Critique:* Classic, but she might dodge.
          *   *Refinement:* Make it concrete. A specific experiment.
          *   *Final Q4:* What specific empirical result would make you say "these aren't real features"?
          *   *Follow-up:* If she says "nothing, it's pragmatic," press on the word "real."

      *   *Topic 5: The "Earns its Keep" Phrase.*
          *   *Draft 1:* What do you mean by earns its keep?
          *   *Critique:* She'll just define it again.
          *   *Refinement:* Compare to Ptolemaic astronomy.
          *   *Final Q5:* Use the epicycle analogy. Useful but wrong.
          *   *Follow-up:* If she says "models aren't physics," ask what the ontology of a model *is* then.

      *   *Topic 6: Human Alignment vs. Model Reality.*
          *   *Draft 1:* Are features human concepts?
          *   *Critique:* Standard.
          *   *Refinement:* Are we finding *model* features or projecting *human* labels?
          *   *Final Q6:* The labeling problem. Is the "realness" in the vector or our English label?
          *   *Follow-up:* If she says "we validate with top activations," ask about the selection bias in looking at top activations.

      *   *Topic 7: Downstream Impact.*
          *   *Draft 1:* Do features matter downstream?
          *   *Critique:* Vague.
          *   *Refinement:* If we ablate a feature, does the logit change predictably?
          *   *Final Q7:* Connection to output logits. Is the feature a cause or a side effect?
          *   *Follow-up:* If she says "correlation is enough," push back on the "organelle" analogy (organelles have functions).

      *   *Topic 8: Scaling and Stability.*
          *   *Draft 1:* Do features stay the same in bigger models?
          *   *Critique:* Good stability check.
          *   *Refinement:* Feature matching across checkpoints.
          *   *Final Q8:* Stability across training runs. If it's real, should it be reproducible?
          *   *Follow-up:* If she says "no, initialization matters," ask how we distinguish signal from noise.

      *   *Topic 9: The "Organelle" Analogy (Closing).*
          *   *Draft 1:* Do you still stand by the organelle comment?
          *   *Critique:* Confrontational but necessary.
          *   *Refinement:* Biology has ground truth. We don't.
          *   *Final Q9:* The ground truth gap. Biology has DNA/physics. We have weights.
          *   *Follow-up:* If she says "weights are ground truth," ask about the basis invariance of the function.

  4.  **Review and Refine:**
      *   Check constraints: 8-9 questions? Yes. Follow-ups included? Yes. Specific topics covered (decomposition, causality, superposition, falsification)? Yes.
      *   Tone: Professional but sharp. Designed for an internal podcast (so jargon is okay, but needs to cut through the buzz).
      *   *Self-Correction on Q1:* Make sure it explicitly addresses the "equally sparse, equally predictive" constraint from the prompt.
      *   *Self-Correction on Q2:* Ensure Othello-GPT is referenced or the concept of basis dependence is clear.
      *   *Self-Correction on Follow-ups:* Ensure they specifically block the "earns its keep" retreat.

  5.  **Final Polish:** Check the flow. Start with math foundations, move to causality, then ontology, end with falsification. (The order in the thought process above was a bit mixed, I will organize them logically for the final output).

      *   *Order:*
          1.  Decomposition Uniqueness (Math foundation).
          2.  Basis Dependence (Othello/Decodability).
          3.  Causality vs. Correlation.
          4.  Superposition/Polysemanticity boundaries.
          5.  Human Labels vs. Vectors.
          6.  "Earns its Keep" (The Epicycle analogy).
          7.  Stability/Reproducibility.
          8.  Downstream Mechanism.
          9.  Falsification (The closer).

      *   *Refining Follow-ups:* Make sure they explicitly call out the "earns its keep" dodge. E.g., "That describes utility, not reality."

  6.  **Final Output Generation** (Proceeding to generate response based on these refined thoughts).
answer: |-
  Here are 9 interview questions designed to corner the "pragmatic realist" position without being hostile. They are structured to progressively narrow the definition of "real" until the "earns its keep" defense becomes insufficient.

  Each question includes a "Trap" analysis (why she might dodge) and a specific Follow-Up designed to block that dodge.

  ### 1. The Uniqueness Problem
  **Question:** "Mathematically, there are infinite ways to decompose a vector space into sparse components. If I hand you a different dictionary that is equally sparse and reconstructs the activations with the same fidelity, but the individual features look different, why is *our* SAE decomposition the 'true' ontology and the other one just noise?"

  *   **The Trap:** She will argue that *this* SAE generalizes better or is easier to interpret.
  *   **Follow-Up:** "Generalization and interpretability are metrics of human utility, not mathematical uniqueness. If the 'truth' depends on which L1 penalty we happened to tune, aren't we just describing the properties of our optimizer rather than the properties of the model?"

  ### 2. Decodability vs. Causal Usage (The Othello Point)
  **Question:** "In the Othello-GPT case, a linear probe could decode the board state, but the model didn't actually seem to use that basis until it was forced to. How do you distinguish between a feature that is *readable* to us versus a feature that is *causally active* in the model's own computation?"

  *   **The Trap:** She will claim that if we can intervene on it, it's causal.
  *   **Follow-Up:** "Interventions often break the manifold the model operates on. If abating a feature changes the output, does that prove the feature was a distinct mechanism, or just that you poked a sensitive part of a entangled system? Where's the line between cutting a wire and smashing a circuit board?"

  ### 3. The "Earns Its Keep" Definition
  **Question:** "Your go-to line is that 'a feature is real if it earns its keep.' In the 16th century, epicycles earned their keep—they predicted planetary motion perfectly. Was an epicycle a real physical object?"

  *   **The Trap:** She will say, "Models aren't physics, they're functions."
  *   **Follow-Up:** "If we aren't doing physics, why use biological analogies like 'organelles'? Organelles have independent causal mechanisms. If 'earning its keep' just means 'predictive utility,' aren't we describing a useful map, not the territory?"

  ### 4. Polysemanticity and Boundaries
  **Question:** "We know neurons are polysemantic, and SAEs try to untangle that. But when an SAE splits one neuron into two features, or merges two concepts into one direction, what determines the ground truth boundary? Is 'dog' one feature, or is it a linear combination of 'fur,' 'bark,' and 'pet'?"

  *   **The Trap:** She will say, "We look at the top activations to label them."
  *   **Follow-Up:** "That's a human labeling step, not a discovery step. If the boundary of the feature depends on a human looking at top activations and deciding 'this looks like one concept,' isn't the 'reality' of the feature partially constructed by the observer?"

  ### 5. Basis Invariance
  **Question:** "Neural networks are functionally invariant to rotations of their internal weights, but SAEs break that invariance by imposing a specific basis. If the model's behavior doesn't change when the basis rotates, but our 'features' do, in what sense are the features intrinsic to the model?"

  *   **The Trap:** She will argue that the *training process* selects a specific basis naturally.
  *   **Follow-Up:** "The training process selects a basis that minimizes loss, not one that maximizes interpretability. Are we discovering the model's preferred basis, or are we imposing an interpretability prior and calling the result 'discovery'?"

  ### 6. Downstream Mechanism
  **Question:** "Let's talk about the downstream side. If a feature fires in layer 5, does it propagate as a distinct signal to layer 6, or does it immediately re-mix into superposition? If it re-mixes instantly, can we really call it a stable 'unit' of computation?"

  *   **The Trap:** She will say, "It doesn't need to be stable to be real, just influential."
  *   **Follow-Up:** "An impulse is influential, but it's not an organelle. If the feature doesn't persist as a distinct direction across at least a few layers, aren't we just naming transient states of a fluid dynamic system?"

  ### 7. Reproducibility Across Runs
  **Question:** "If these features are real structural components, I'd expect them to be robust. If you train the same architecture on the same data with a different random seed, do you get the exact same feature dictionary? If not, how much of the feature is the model, and how much is the noise?"

  *   **The Trap:** She will say, "There's high feature matching across runs."
  *   **Follow-Up:** "High matching on the *easy* features, sure. But on the thousands of mid-sparsity features where the 'organelle' claim is most contentious, the matching drops. Are we only calling the reproducible ones 'real' and ignoring the rest, or is the instability telling us something about the ontology?"

  ### 8. The Labeling Gap
  **Question:** "We assign English labels to these vectors. But the model operates in vector space, not English. When we say a feature is 'real,' are we saying the *direction* is real, or are we saying our *English label* for that direction is correct?"

  *   **The Trap:** She will say, "We validate the labels with synthetic examples."
  *   **Follow-Up:** "Synthetic examples are generated by us, based on our hypotheses. That's a closed loop. If the model has a concept that doesn't map to human language at all, would our SAE methodology even be capable of identifying it as 'real,' or would we discard it as noise?"

  ### 9. The Falsification Condition (The Closer)
  **Question:** "I want to end on this: What specific empirical result would make you stop calling these features 'real'? If tomorrow someone proved that a different, non-sparse decomposition was more causally faithful, would you retire the 'organelle' analogy?"

  *   **The Trap:** She will say, "I'm a pragmatist, I don't care about 'real,' I care about what works."
  *   **Follow-Up:** "But you *do* use the word 'real,' and you use it to justify resource allocation and research direction. If the claim is purely pragmatic, we should stop using ontological language. If the claim is ontological, there must be a way to be wrong. Which is it?"
