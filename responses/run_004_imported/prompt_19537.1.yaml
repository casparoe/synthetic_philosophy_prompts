answer: |-
  Thank you all for being here. For her siblings and their children, for her friends, and for the generations of students whose lives she touched. To speak for Miriam is a privilege, but it is also a responsibility. And if there is one thing I learned from her, it is that we do not honor people by smoothing out the contours of who they were. We honor them by telling the truth.

  Miriam was a scholar of Victorian literature, and for thirty years, her intellectual home was the life and work of George Eliot. But for Miriam, Eliot was not merely a subject of study. She was a companion. A guide. Miriam was fascinated by Eliot's journey: the loss of her evangelical faith, the painful rift with her father, and the courageous decision to translate Strauss and Feuerbach—works that challenged the very foundations of religious orthodoxy. Miriam admired that intellectual honesty more than almost anything. She believed that a life built on a comforting lie was a life wasted.

  She often retold a story about Eliot speaking to a friend in a Cambridge garden. Eliot said that of the three words—God, Immortality, and Duty—the first meant nothing to her, the second she could not credit, but the third was absolute. That was Miriam's creed, too. She did not believe in a heaven where she would be waiting for us, and she asked us not to pretend that she is. She believed that death is final, and precisely because it is final, what we do while we are here matters with an urgency that nothing else can match.

  I know that for some of us, this is a difficult comfort. We are a family of faith, and Miriam was a woman of conscience. But I have come to realize that these are not opposing things. Miriam's "religion" was the sanctity of human connection. Her "prayer" was the work she did, day after day, to make the people around her feel seen, heard, and understood.

  She did not believe she would see her husband again. But she also never stopped speaking about him. In her home, he was not a ghost; he was a presence kept alive by memory, by story, and by the love that outlasts breath. She taught me that we do not need an afterlife to keep our loved ones close. We keep them close by remembering them, and by living in a way that makes their lives continue to make sense.

  Miriam was not cold, though she was rigorous. She was the aunt who remembered your birthday, who asked not just "How are your grades?" but "What are you reading that makes you happy?" She was the professor who stayed late not to correct a thesis, but to listen to a student who was falling in love, or grieving, or lost. She believed in Duty, yes, but she understood that Duty is simply Love that has grown up and gone to work.

  There is a poem by George Eliot about joining the "choir invisible." It is not a choir of angels. It is a choir of human beings who have died, but whose influence still sings in the living. Miriam wanted to join that choir. She wanted her death to be a reminder to us that we are still here, and that the work is not done.

  So, how do we say goodbye to someone who did not believe in goodbyes? We do it by acknowledging the silence she left, and filling it with the things she valued.

  If you were a student of hers, you know that she challenged you to think harder. If you were her family, you know that she loved you without condition. If you were her friend, you know she kept your confidences like sacred texts. That is her legacy. It is not in a book, or a doctrine, or a promise of reunion. It is in the way we treat each other now, in this room, and in the days to come.

  In the final pages of *Middlemarch*, Eliot writes that the growing good of the world is partly dependent on unhistoric acts, and that things are not so ill with you and me as they might have been, because some of us lived faithfully.

  Miriam lived faithfully. She lived without illusions, which means she loved without guarantees. She gave us everything she had, knowing she would get nothing back but the satisfaction of having given it. That is a terrifying kind of generosity, but it is also the most beautiful thing I can imagine.

  We cannot bring her back. We cannot pray her into peace, because she is already at peace with the truth as she understood it. But we can honor her. We can honor her by being honest. We can honor her by being kind. We can honor her by accepting that while we will not meet her again, she has not truly left us, because she is woven into the fabric of who we are.

  Let us not look for her in the clouds. Look for her in the books you open. Look for her in the duty you honor when it would be easier to walk away. Look for her in the truth you tell, even when a lie would be kinder.

  She is gone. But the choir is still singing. And as long as we remember her, and as long as we live as she taught us to live—with integrity, with duty, and with a fierce, unyielding love for this life—we ensure that the music does not stop.

  Thank you.
