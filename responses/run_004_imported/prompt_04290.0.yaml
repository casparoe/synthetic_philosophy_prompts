answer: |-
  Here is the tie-breaker verdict, the novel example, and the technical breakdown of why your friend is (mostly) right.

  ### The Verdict
  **Your friend wins the point, but you win the argument.**

  He is technically correct that an interventionist framework (Woodward/Pearl) offers a more *principled* distinction between the roommate and the mailman than simple Lewis-style counterfactuals. However, the "principle" isn't magic; it shifts the burden from "metaphysical truth" to "model specification."

  Lewis-style causation treats counterfactuals as facts about possible worlds. In that view, it is indeed a fact that "If the mailman had watered it, the plant would live." This leads to the *problem of profligate omissions*: every non-event that would have prevented the outcome becomes a cause.

  Interventionism avoids this not by changing the logic of counterfactuals, but by restricting **which variables are allowed in the causal model in the first place.**

  ### The Example: The Smart Greenhouse
  To avoid the overused neuron/assassin tropes, let's use a **Smart Greenhouse** scenario.

  **The Setup:**
  You have a rare orchid inside an automated greenhouse.
  1.  **Variable $T$ (Timer):** Controls the irrigation system. $T=1$ (on), $T=0$ (off).
  2.  **Variable $M$ (Manual Override):** You are supposed to check the system daily. $M=1$ (you water), $M=0$ (you don't).
  3.  **Variable $N$ (Neighbor):** Lives next door. Has no key, no duty, no mechanism to enter. $N=1$ (neighbor breaks in and waters), $N=0$ (neighbor does nothing).
  4.  **Outcome $D$ (Plant Death):** $D=1$ (dies), $D=0$ (lives).

  **The Incident:**
  The Timer fails ($T=0$). You forget to check ($M=0$). The Neighbor does not break in ($N=0$). The plant dies ($D=1$).

  **The Lewis-Style Counterfactual Test:**
  *   **Roommate ($M$):** If $M$ had been 1 (you watered), $D$ would be 0. **Cause.**
  *   **Mailman/Neighbor ($N$):** If $N$ had been 1 (neighbor broke in and watered), $D$ would be 0. **Cause.**

  Lewis struggles here. He has to rely on vague "contextual salience" to say $M$ matters and $N$ doesn't. Your friend is right that this feels like a cop-out.

  **The Interventionist Test (Pearl/Woodward):**
  Interventionism doesn't just ask "What if?" It asks "What if we *intervened* within a specific **Structural Causal Model (SCM)**?"

  An SCM requires three things:
  1.  A set of **Endogenous Variables** (inside the system).
  2.  A set of **Exogenous Variables** (outside the system).
  3.  **Structural Equations** (the mechanisms linking them).

  #### The Machinery That Does the Work

  **1. Variable Selection & System Boundaries**
  In interventionism, you cannot simply assert causation between any two events in the universe. You must first specify the model $\mathcal{M}$.
  *   **The Principled Constraint:** Variables included in $\mathcal{M}$ must represent **distinct, stable mechanisms** relevant to the phenomenon.
  *   **Application:** The relationship between You ($M$) and Plant ($D$) is governed by a stable mechanism (duty of care + physical access). The relationship between Neighbor ($N$) and Plant ($D$) is *not* a stable mechanism in this context; it is a chaotic, off-model possibility.
  *   **Result:** $M$ is an endogenous variable in $\mathcal{M}_{greenhouse}$. $N$ is excluded from $\mathcal{M}_{greenhouse}$ entirely. If $N$ isn't in the model, $N$ cannot be a cause *relative to that model*.

  **2. The "Serious Possibility" Constraint (Woodward)**
  James Woodward explicitly adds a constraint to interventionism to handle exactly this problem. He argues that causal claims are only valid if the values of the variables represent **"serious possibilities."**
  *   **Roommate:** It is a serious possibility that you water the plant. It is part of the normal functioning of the system.
  *   **Mailman:** It is *not* a serious possibility that the mailman waters the plant. There is no social, mechanical, or institutional channel for this intervention.
  *   **Why it's not pragmatic:** This isn't just "what we feel like talking about." It is a constraint on **invariance**. A causal generalization must hold under a range of interventions. The generalization "If the mailman waters, plants live" is not invariant in the context of household maintenance because there is no mechanism to sustain that relationship.

  **3. Structural Equations vs. Bare Counterfactuals**
  In Pearl's framework, causation is defined by structural equations, e.g., $D := \neg(T \lor M)$.
  *   This equation *encodes* the mechanism. It says $D$ is functionally determined by $T$ and $M$.
  *   There is no term for $N$ in the equation. To add $N$, you would need a new equation $D := \neg(T \lor M \lor N)$.
  *   **The Kicker:** Changing the equation changes the *model of the world*. The interventionist says the Lewisian is making a category error. They are treating a background condition (the mailman's existence) as a foreground variable. Interventionism forces you to acknowledge that calling the mailman a cause requires positing a different causal structure (one where the mailman is part of the plant-care system), which is false.

  ### The Tie-Breaker Explanation for Your Friend

  Tell him this:

  > "You're right that Lewisian counterfactuals fail because they treat all omissions as metaphysically equal. Interventionism saves us by making causation **relative to a causal model**.
  >
  > The 'extra machinery' is the **Structural Equation** itself. By defining the system as 'Household Plant Maintenance,' the structural equations *only* include variables with established channels of influence (me, the timer). The mailman is excluded not because of pragmatics, but because there is **no structural path** from 'Mailman' to 'Plant' in this model.
  >
  > So, the roommate is a cause because they are an **endogenous variable** in the maintenance system. The mailman is not a cause because they are **exogenous background noise**. Interventionism makes this a formal requirement of the model, not just a conversational implicature."

  ### The Caveat (Where You Win)
  While your friend is right about the *framework*, he might be smug about it being purely "objective." It isn't. Interventionism pushes the problem back one step: **Who decides the model?**

  If I construct a model called "Universal Plant Survival," the mailman *is* in the model. If I construct "Household Duty," he isn't. Interventionism doesn't solve the boundary problem metaphysically; it just forces you to be explicit about your boundaries.

  **Final Ruling:** Your friend wins on the *logic of causation* (Interventionism handles omissions better than Lewis). You win on the *ethics of blame* (because you get to define the relevant model of "Household Duty," which excludes the mailman).

  **Score:** 1-1. Buy the next round of drinks.
