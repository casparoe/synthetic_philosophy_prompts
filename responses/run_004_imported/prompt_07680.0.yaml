answer: |-
  **Setting:** *Outside the seminar room, coffee in hand. The whiteboard inside still has "Information in Living Systems" scrawled across it.*

  **Alex:** Look, Maynard Smith's point stands: the genetic code is arbitrary. There's no physicochemical necessity that UUU codes for Phenylalanine. It could have been otherwise. But because the translation machinery was shaped by selection specifically to respond to that mapping, it's not just causation. It's semantics. The ribosome *interprets* the sequence.

  **Jordan:** But "arbitrariness" just means contingent causation. Plenty of causal relations are contingent without being informational. The specific gradient of morphogens in the cytoplasm is also contingent and selected-for, yet you don't call that a code. Why is DNA the only thing carrying "semantic content"?

  **Alex:** Because of the reading mechanism. Temperature affects development, sure, but the cell doesn't have a machinery evolved to *decode* temperature values into specific protein sequences. The tRNA synthetases are literally designed to treat the nucleotide sequence as a symbol for an amino acid. That distinction—between a causal push and a decoded instruction—is real.

  **Jordan:** That's the parity thesis problem. The "machinery" includes the cytoplasmic environment, the membrane, the chaperone proteins. Without them, the DNA is inert. If information is what makes a difference to the outcome, the cytoplasm makes just as much of a difference. Singling out DNA as the "instruction" and the rest as "background" is unprincipled.

  **Alex:** It's not unprincipled; it's about causal specificity. If you vary the DNA sequence, you get a specific, combinatorial change in the protein sequence. If you vary the temperature, you get a general breakdown or speed-up. DNA controls *which* trait is constructed; the environment controls *whether* it gets constructed. That specificity is the hallmark of information.

  **Jordan:** But cytoplasmic factors control splicing, localization, and methylation. They determine *which* protein isoform is made from the same DNA. So they also control "which" trait. You're privileging DNA because it's the replicator, not because it's the only information carrier. You're conflating inheritance with development.

  **Alex:** Fair, but inheritance matters for the semantic claim. The code is stable across generations precisely because it's arbitrary. If it were just chemistry, it would drift with physical conditions. The fact that the mapping is maintained despite being physically arbitrary suggests it's functioning as a convention. A convention requires a user, and evolution naturalizes the user via teleosemantics.

  **Jordan:** Teleosemantics doesn't save you. Selection shaped the response to cytoplasmic factors too. The membrane is "selected to respond" to external signals. By your logic, the environment is semantically communicating with the cell. That stretches "semantics" until it snaps. It's all just differential retention of stable systems.

  **Alex:** Not quite. The environment isn't produced by the organism to carry a message. DNA is an internal replicator that stores specifications independently of the immediate causal context. It allows for decoupling—planning a structure without building it yet. That storage capacity is what makes it a code rather than just a trigger.

  **Jordan:** But the "storage" is only active within the developmental system. Strip away the cell, and the DNA is just a long molecule resisting hydrolysis. The "code" isn't in the molecule; it's in the relationship between the molecule and the system. Calling it "literal" semantics implies the meaning is intrinsic to the DNA, which it isn't.

  **Alex:** Meaning isn't intrinsic to words either; it's intrinsic to the language system. DNA is the language. The arbitrariness plus the selected function of the translation system creates a genuine semantic relation, distinct from ordinary causation. It's literal because the biological function *is* information processing.

  **Jordan:** But "information processing" is the metaphor you're trying to justify. If you define information as "arbitrary mapping selected for interpretation," you've built the conclusion into the premise. Sarkar's point is that once you unpack the biochemistry, the "code" disappears into a cascade of structural affinities. The arbitrariness is just a frozen accident, not a semantic convention.

  **Alex:** A frozen accident that is functionally maintained. Money is arbitrary too—paper has no intrinsic value—but it literally carries economic value because of the system sustaining it. DNA literally carries biological instructions because selection sustains the mapping. The history makes the metaphor literal.

  **Jordan:** Money requires a community of minds to assign value. Cells don't have minds. You're smuggling intentionality into biochemistry because it's a useful heuristic for molecular biologists. It's a powerful metaphor, Alex, but ontologically, it's just chemistry all the way down.

  **Alex:** If the heuristic tracks a real functional distinction—between specific symbolic control and general causal enablement—then it's not *just* a metaphor. It's a functional kind. Denying that makes it harder to explain why mutations in the code change the organism differently than mutations in the metabolic rate.

  **Jordan:** They change the organism differently because they intervene at different causal nodes. You don't need "semantic content" to explain that. You just need causal networks. Adding "information" doesn't add explanatory power; it just adds a layer of intentional language that invites confusion about where the meaning actually lives.

  **Alex:** But it adds predictive power. If I treat DNA as a code, I can predict the effect of sequence changes without knowing the full chemistry of the folding. The code abstraction works because the biology actually isolates that layer of control.

  **Jordan:** It works because engineers designed the experiments to isolate that layer. We treat DNA as the code because we're trying to engineer organisms. In nature, there's no layer isolation. The parity thesis holds: development is a system property. DNA is a privileged cause for *us*, not for the cell.

  **Alex:** I think we agree it's privileged for us. I'm just saying that privilege tracks a real biological function—symbolic storage—that emerged via selection. It's literal biology, not just literal language.

  **Jordan:** Then we're arguing about the word "literal." As long as you admit the "meaning" vanishes without the developmental context, I'll admit the code talk is useful. But I won't call it semantics.

  **Alex:** And I won't call it mere causation. Let's grab another coffee before the next session.

  **Jordan:** Deal. But I'm paying, since apparently, money is only metaphorically valuable.

  **Alex:** Ha. Very funny.
