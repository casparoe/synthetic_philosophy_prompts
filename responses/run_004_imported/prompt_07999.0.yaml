          *   ...
          *   At depth 0: Both defect.
      *   *Verification:* Yes, this is exactly backward induction. The "poisoned base case" analogy is correct.
      *   *Nuance:* It's not just "poisoning." It's that the simulation is *counterfactual* reasoning about execution traces. If the base case is Defect, the step above it sees a Defect, so it Defects to maximize payoff (in PD). There is no mechanism to *create* cooperation from nothing.
      *   *Key Distinction:* Simulation is causal/empirical. It asks "What *will* happen?" Löb is logical/self-referential. It asks "What is *provable*?"

  3.  **Analyze Part (b): Löbian Cooperation (FairBot):**
