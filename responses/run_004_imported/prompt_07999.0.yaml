      *   *Correction:* In the actual MIRI papers (e.g., "Robust Cooperation in the Prisoner's Dilemma"), FairBot is often formalized within a logic where we reason about the *outcome*, assuming the proof search is bounded by some huge number or we are reasoning in a theory that proves the halting.
      *   *Actually, the key is:* We are reasoning *about* the programs in PA. We prove that $FB(FB) = C$. The programs themselves might not be computable in the strict sense if they search unbounded proofs, but the *logical analysis* holds.
      *   *Better framing:* Focus on the *logical structure* rather than the runtime. The user asked about the mechanism in the proof.
