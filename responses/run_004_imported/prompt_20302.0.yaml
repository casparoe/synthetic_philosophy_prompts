  *Revised Title:* **The Clockwork Oath** (Hints at mechanism vs. vow).
  *Actually, let's go with something more atmospheric:* **The Last Watchman of the Meridian.**

  *Wait, one more thought:* To really hit the "free will vs. training" ambiguity, the character should feel *pleasure* in the constraint. That's key to the Sovereign Individual. He isn't suffering under the duty; he revels in his capacity to hold it.

