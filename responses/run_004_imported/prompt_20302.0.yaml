  **The Station at High Pass**

  The logbook was open to the date, the ink still wet from the previous entry. Elias did not check the clock on the wall; he checked the pulse in his wrist, counting the seconds until the hand on the dial aligned with the notch he had filed into the brass bezel himself, thirty years ago.

  At precisely 08:00, he turned the valve. Steam hissed, a controlled exhalation from the throat of the mountain. The pressure gauge held steady.

  He felt the familiar swell in his chest. It was not relief, for there had been no anxiety. It was not pride, exactly, for there was no one to witness it. It was a quiet, dense sensation of continuity. *I am the one who said this would happen,* the feeling whispered. *And it happened.*

  The bell rang.

  Elias did not startle. Startling was a failure of anticipation. He closed the logbook, smoothed the cover, and walked to the heavy iron door of the station. He opened it before the second ring could finish.

  A woman stood in the snow. She wore the grey fatigues of the New Directorate, but they were ill-fitting, scavenged. Her face was chapped, her eyes bright with the feverish urgency of the lowlands. Elias recognized her. Mara. She had been his assistant once, before the roads were cut, before the silence fell.

  "You're still here," she said. It wasn't a question.

  "The station is manned," Elias said.

  "By who? The Empire is gone, Elias. The Emperor is in exile. The Directorate owns the mountain now." She stepped inside, brushing snow from her shoulders. She looked around the pristine room, the polished brass, the stacked logs. "They sent me to tell you to stand down. There's no one upstream to regulate. The reservoirs are dry."

  "The reservoirs are irrelevant," Elias said. He returned to his desk and sat. "The schedule requires the valve turn at 08:00 and 20:00."

  Mara laughed, a sharp, brittle sound. "Schedule? Whose schedule? The Ministry of Infrastructure was dissolved six months ago. I saw the burning papers in the square myself. You are keeping a promise to a ghost."

  Elias picked up his pen. He hovered it over the next line in the book. *08:05. Visitor. Status: Irrelevant.*

  "I made the promise," Elias said.

  "To whom?"

  "To myself."

  Mara walked closer, leaning on the desk. She smelled of smoke and unwashed wool. "Don't give me the catechism. We all know how they made you. Thirty years of drills. Punishments. Rewards. They broke you down until the only thing that fit was this uniform, this routine. You think this is freedom? You're a dog waiting for a master who died in his sleep."

  Elias looked at her. He felt no anger. Anger would have implied she had the power to disturb his equilibrium. He felt a mild curiosity, the way a surgeon might feel looking at a scar.

  "You speak of the training," Elias said. "You remember the winters? The cold rations? The beatings when the log was late?"

  "I remember running," Mara said. "I remember realizing that the rules were just men writing on paper. I realized I could stop. And I did. I'm alive, Elias. I'm free."

  "You are reactive," Elias corrected gently. "The wind blows, and you move. The Empire falls, and you change your coat. You call that freedom? To be so dependent on the external world for your direction?"

  He stood up. He was not a large man, but he occupied the space with a peculiar density. He moved to the window and looked out over the frozen valley. Below, the world was in chaos. Fires smoked on the horizon. The old laws were ash.

  "I could leave," Elias said.

  "Then do it."

  "I could turn the valve and let the pipes burst. I could burn this logbook."

  "Then do it."

  Elias turned back to her. His expression was serene. "If I did that, it would be because the situation commanded it. The collapse of the Empire would have dictated my action. I would be reacting to history." He tapped his chest. "I act from the memory of my own will. I promised that this station would function. The promise is not to the Empire. The Empire was merely the occasion for the promise."

  Mara stared at him. "That's madness. It's solipsism. You're trapped in a loop of your own making."

  "Is a circle a cage, or is it a wheel?" Elias asked. "It depends on whether you are inside it, or whether you are turning it."

  He walked to the stove and added a log. The fire caught instantly; he had prepared the kindling an hour ago.

  "Come, Mara. Stay. The rations are sufficient. The bed is warm. You can rest your... freedom."

  "I can't stay in a tomb," she said. She backed toward the door. "You think you're the master here. But look at you. You can't even imagine doing anything else. If I told you to walk out that door right now, could you?"

  Elias paused. He considered the command. He visualized himself walking out. He visualized the snow, the walk down the mountain, the uncertainty, the new laws, the new masters. He felt no fear. But he felt no desire. The image was flat, grey. It lacked weight.

  "I could," Elias said. "But I will not."

  "Because you *can't*," she insisted. "They bred the 'no' into you. They domesticated you until the leash was inside your skin. You feel proud of it because it's the only feeling they let you keep. That isn't a conscience, Elias. That's a twitch."

  She opened the door. The wind howled, smelling of ice and decay.

  "Come with me," she said, one last time. "Break the log. Just once. Tear a page out. Prove it's your hand."

  Elias looked at the logbook. The black leather, the gold leaf, the straight lines of his handwriting. A record of thirty years of unbroken causality. *I said, therefore it was.*

  If he tore the page, would it be an act of will? Or would it be an act of obedience to her challenge? If he stayed, was it an act of will? Or an act of obedience to his conditioning?

  The distinction seemed to exist only in the language, not in the blood. The sensation in his chest was the same: the heavy, golden anchor of identity.

  "The valve turns at 20:00," Elias said.

  Mara shook her head. She looked at him with a mixture of pity and awe, as one might look at a statue that has learned to speak. "You're the only free man I know," she said, "and you're the only slave."

  She stepped out into the snow and closed the door.

  Elias listened to her footsteps fade. He waited until the silence returned, absolute and total. He checked his wrist. 08:45.

  He opened the logbook. He dipped the pen. He wrote: *08:45. Visitor departed. Station operational.*

  He blotted the ink. He did not feel the weight of the chain, nor the lightness of the wing. He felt only the pressure of the pen against the paper, and the certainty that tomorrow, at 08:00, his hand would turn the valve again.

  He sat back and watched the steam rise from the valley, a white pillar holding up the grey sky, holding it up for no one, held up by nothing but the word he had given.
