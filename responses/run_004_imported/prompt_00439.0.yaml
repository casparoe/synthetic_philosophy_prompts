      *   *Clarification on "Not True":* In Strong Kleene, $T(L)$ is gap. $\sim T(L)$ is gap. So $L \leftrightarrow \sim T(L)$ works (both sides gap).
      *   *The Revenge Sentence:* $R \leftrightarrow \neg T(R)$ (where $\neg$ is exclusion). If $R$ is gap, $\neg T(R)$ is True. So $R$ is True. Contradiction.
      *   *Kripke's Move:* "I don't have $\neg$ in my language. I only have $\sim$."
      *   *The "Hoodie" comment:* The user is sharp. Kripke *does* require a metalanguage to describe the extension/anti-extension vs. the gap. The difference is Tarski bans self-reference; Kripke allows self-reference but bans certain *predicates* about truth status.

