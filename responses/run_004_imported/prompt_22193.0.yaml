      *   Show the calculation: $P(Correlation) \times Benefit_{Alien} \times Count_{Aliens} > Cost_{Local}$.
      *   Highlight the EDT vs. CDT tension. CDT says "My action doesn't change them." ECL says "My action is evidence of theirs."

  6.  **Writing - First Pass (Mental or Scratchpad):**
