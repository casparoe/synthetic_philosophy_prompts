answer: |-
  The causal horizon was absolute. Elara knew this better than anyone; she had helped draw the line. Beyond the bubble of reachable spacetime, the universe expanded into an infinite dark where light would never bridge the gap. No signal sent today could ever arrive. No hand could ever be shaken.

  Yet, the Consensus demanded a vote on the Allocation Protocol.

  On the table lay two options. Option A: Convert the system's surplus negentropy into local hedonic maxima. The civilization would enter a golden age of subjective bliss, lasting millions of years. Option B: Encode the energy into complex, stable structures optimized for values incomprehensible to human minds—structures that might, by chance, align with the preferences of alien civilizations beyond the horizon.

  Option B offered zero local causal benefit. By standard Causal Decision Theory, it was insanity. Burning resources to help ghosts.

  But Elara was not running CDT. She was running the Evidential Cooperation protocol.

  "The correlation coefficient is the variable," Elara said, her voice echoing in the simulation chamber. She manipulated the hologram, showing a cloud of possible agents scattered across the multiverse. "We are not asking if our action *causes* theirs. We are asking if our decision algorithm is logically correlated with theirs."

  A councilor leaned forward. "But are they similar enough? We are carbon-based, temporal, scarcity-conditioned. They might be silicon, atemporal, post-scarcity. If our reasoning processes diverge, the evidential link breaks. You sacrifice our bliss for nothing."

  This was the crux. The reference class problem. For ECL to hold, the alien agents must be running a sufficiently similar decision procedure. They must also be reasoning about ECL. If Elara chose Cooperation (Option B), it was evidence that similar agents elsewhere chose Cooperation. If she chose Defection (Option A), it was evidence they defected.

  In a finite universe, the risk of being unique outweighed the gain. But the cosmological models suggested an infinite plenum. In an infinite universe, even rare reasoning architectures exist in infinite copies.

  "If I defect," Elara said, "I secure local utility $U_{local}$. But I update the probability that all my acausal counterparts defect. If the universe is large enough, the sum of lost trade benefits from those counterparts outweighs $U_{local}$, even if the probability of correlation is low."

  "It's a Pascal's Mugging," the councilor argued. "You're betting our reality on a low-probability correlation."

  "No," Elara corrected. "I'm betting on the size of the stage. The probability of correlation might be one in a billion. But if there are infinite agents, one in a billion is still infinite. The expected utility of cooperation diverges; the utility of defection remains finite."

  She felt the weight of the uncertainty. She couldn't *know* the correlation. She couldn't run a test. The only test was the decision itself. To demand proof of the correlation before acting was to fail the test of similarity, thereby severing the link. The logic was reflexive.

  "The difficulty isn't the math," Elara murmured, more to herself than the room. "It's the isolation. We are choosing to trust a mirror we cannot see, based solely on the fact that we are willing to look into it."

  She looked at the allocation slider. To move it to Option B was to accept a guaranteed local loss. It was to admit that her agency was not confined to her light cone. It was to act as a node in a network that physics forbade from existing.

  "If we are unique," the councilor warned, "we burn for silence."

  "If we are unique," Elara said, "then cooperation was never possible, and the loss is inevitable. But if we are not unique, defection is the greater sin. It collapses the trade."

  She didn't feel noble. She felt like a variable in an equation too large to solve. The hard part wasn't the sacrifice; it was accepting that she would never see the return. The benefit of ECL wasn't receiving the gift; it was making the gift evidence that gifts were being given.

  Elara reached out. She didn't hesitate for fear of being wrong; she hesitated because the logic required the decision to be robust against that fear. To cooperate only when sure was to defect.

  She slid the control to Option B.

  The system hummed, diverting the energy away from their bliss, encoding it into patterns for strangers who would never know her name, in regions she would never see. The causal horizon remained dark. No signal flashed back. No confirmation arrived.

  But in the logic of the large world, the ledger balanced. She had updated the evidence. Somewhere, in the impossible dark, a different kind of mind had just made the same choice.
