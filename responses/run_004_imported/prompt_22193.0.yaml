      *   **Decision Theory:** Evidential Decision Theory (EDT) vs. Causal Decision Theory (CDT). ECL relies on EDT-like reasoning across acausal boundaries.
      *   **The Trade-off:** I sacrifice local utility to help values I don't share, because evidence suggests my counterparts elsewhere are sacrificing to help values I *do* share.
      *   **The Tension:** How similar are they? Is the correlation strong enough? What if I'm unique?

  3.  **Brainstorming the Plot:**
      *   *Setting:* A civilization facing a resource allocation decision. Maybe a Dyson sphere or a computronium cloud.
      *   *Conflict:* Use resources for local values (e.g., hedonic maximization) vs. alien values (e.g., complexity, art, something incomprehensible).
      *   *Character:* A decision architect or ethicist. Let's call her Elara.
      *   *The Decision:* To commit resources to a "Void Signal" or a "Universal Pact" that benefits unknown others at local cost.
      *   *The Twist/Resolution:* The realization that the act of committing is itself the proof of the correlation, not the receipt of benefit. The story needs to end on the *act* of cooperation based on the evidential link, acknowledging the uncertainty.

  4.  **Drafting - Section by Section:**

