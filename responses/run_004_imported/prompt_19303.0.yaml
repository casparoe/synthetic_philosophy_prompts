      *   **The Economic Orthodoxy (Samuelson):** Explain the EUT defense. Utility is subjective. The "long run" is a misleading concept if you go broke in the short run.
      *   **The Crux of the Dispute:** Is risk aversion a preference or a physical constraint? Peters says constraint (ergodicity breaking). Samuelson says preference.
      *   **The Verdict:** I need to commit. I will argue that for *multiplicative dynamics with absorption barriers (ruin)*, the time average is the only observable reality. Therefore, maximizing it is objectively rational for any agent wishing to persist. This isn't a utility function; it's a viability condition.
      *   **Qualification:** This doesn't kill EUT. It restricts its domain. EUT works for additive shocks or one-offs. But for "investment" (compounding), Peters wins.
      *   **Conclusion:** Summarize. Bring it back to the physicist's view. The economy is a dynamical system, not just a preference mapping.

