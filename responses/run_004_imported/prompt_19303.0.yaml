answer: |-
  # The Ergodicity Imperative: Why Time Trumps Ensemble in Multiplicative Dynamics

  **Introduction: The Coin Flip That Broke Economics**

  You know the setup better than most. A agent is offered a repeated gamble: flip a fair coin. Heads, wealth multiplies by 1.5; tails, wealth multiplies by 0.5. The arithmetic expected value of the multiplicative factor is $0.5(1.5) + 0.5(0.5) = 1.0$. To a classical economist maximizing expected wealth ($E[W]$), this is a neutral proposition; the agent should be indifferent. To a statistician looking at the trajectory, it is a trap. The geometric mean is $\sqrt{1.5 \times 0.5} = \sqrt{0.75} \approx 0.866$. Over time, the wealth of almost every individual trajectory decays to zero, even as the ensemble average remains constant.

  This simple example lies at the heart of the dispute between "Ergodicity Economics" (championed by Ole Peters) and the standard Expected Utility Theory (EUT) defended by Paul Samuelson for decades. The question you pose is whether this divergence mandates a shift in the definition of rationality itself. Is maximizing geometric growth (log-wealth) the objectively correct standard for this class of problems, or merely one utility function among many?

  As a physicist, you recognize the terminology immediately: this is a dispute about ergodicity. The core claim of Peters is that economics has mistakenly optimized ensemble averages (expectations over parallel universes) for processes that are non-ergodic (where time averages differ from ensemble averages). Samuelson's counter is that rationality is defined by consistent preferences, not physical dynamics; if an agent prefers the gamble, they are rational, even if they go broke.

  I will argue for a definite, qualified verdict: **In the domain of repeated multiplicative processes with an absorption barrier (ruin), geometric rationality is objectively correct, and expected-wealth maximization is physically incoherent.** This is not merely a matter of utility preference. It is a constraint imposed by the topology of time. However, this does not universally displace EUT; it restricts EUT's validity to additive or one-off contexts where the agent's existence is not contingent on the outcome. For the specific class of problems governing sustainable wealth accumulation, Peters is right: risk aversion is not a psychological quirk, but an ergodicity requirement.

  **The Physics of the Dispute: Ensemble vs. Time**

  In statistical mechanics, we distinguish between the microcanonical ensemble (all possible states at fixed energy) and the time evolution of a single system. If a system is ergodic, the time average of an observable equals its ensemble average. If it is non-ergodic, they diverge.

  Standard neoclassical economics implicitly assumes ergodicity. It treats the "expected value" as the relevant metric for decision-making. In the coin-flip example, the ensemble average wealth grows (or stays flat, in the neutral case), implying that if you could replicate yourself a million times, the average wealth of your clones would be stable. But you are not an ensemble. You are a single trajectory moving through time.

  Peters' contribution is to formalize the observation that wealth dynamics are typically multiplicative ($W_{t+1} = W_t \cdot x_t$). In multiplicative processes, the logarithm of wealth is additive ($\ln W_{t+1} = \ln W_t + \ln x_t$). By the Law of Large Numbers, the time average of the growth rate converges to the expected value of the log-return:
  $$ \bar{g} = \lim_{T \to \infty} \frac{1}{T} \ln \left( \frac{W_T}{W_0} \right) = E[\ln(1 + r)] $$
  Maximizing the time-average growth rate is mathematically equivalent to maximizing expected log-wealth (the Kelly criterion). Peters argues that because the time average is the only one physically accessible to a single agent, maximizing it is the only definition of rationality that respects the physical structure of the problem. To maximize linear expected wealth is to optimize for a parallel universe you will never inhabit.

  **The Samuelson Objection: Preferences and Finitude**

  Samuelson's critique, refined over decades, attacks the normative leap from "is" to "ought." He conceded that the time average converges to the geometric mean, but he rejected the idea that this dictates rational choice. His arguments rest on two pillars:

  1.  **Utility is Subjective:** Rationality is defined by adherence to axioms (completeness, transitivity, independence), not by specific outcomes. If an agent derives utility from the *possibility* of a massive upside, even with a high probability of ruin, EUT accommodates this via a convex utility function. To say they *must* maximize log-wealth is to impose a specific utility function ($U(W) = \ln W$) and call it "objective."
  2.  **The "Long Run" is a Fallacy:** Keynes famously noted, "In the long run we are all dead." Samuelson emphasized that convergence theorems apply asymptotically. In finite time, there is a non-zero probability that the multiplicative gambler outperforms the conservative one. If an agent has a finite horizon or a specific liability, the asymptotic growth rate may be irrelevant.

  Samuelson's position is that Peters confuses a *dynamic property* of wealth with a *normative property* of agents. The fact that you go broke doesn't mean it was irrational to take the bet; it means you had a different risk tolerance.

  **The Verdict: Viability as a Precondition for Rationality**

  To resolve this, we must look closer at the boundary conditions of the economic agent. Samuelson's defense holds only if the agent can survive the "ruin" state to enjoy their utility function. In physics terms, Samuelson assumes the phase space is unbounded or reflective. In economics, the zero-wealth boundary is an **absorption barrier**.

  Once wealth hits zero, the trajectory ends. The agent cannot flip coins, cannot trade, and cannot realize future expected values. This introduces a non-linearity that breaks the symmetry of Samuelson's argument.

  Here is the commitment: **Maximizing expected linear wealth in a multiplicative environment with an absorption barrier is objectively irrational because it maximizes the probability of exiting the domain where utility can be experienced.**

  This is not a preference; it is a viability constraint. Consider the distinction between *risk* (uncertainty with known probabilities) and *ruin* (absorption). EUT handles risk well. It handles ruin poorly because it allows trade-offs between probability of ruin and magnitude of gain. But if ruin is terminal, the magnitude of gain post-ruin is zero.

  Therefore, for the class of problems defined by:
  1.  **Repeated exposure** (the gamble is not one-off),
  2.  **Multiplicative dynamics** (returns scale with current wealth),
  3.  **Absorption barriers** (bankruptcy/death is possible),

  Geometric rationality (maximizing time-average growth) is the objectively correct standard. It is not that $U(W) = \ln W$ is the only valid utility function. It is that for any utility function $U(W)$ defined on wealth, if the strategy leads to absorption at $W=0$ with probability 1, the expected utility over time is minimized (or nullified).

  Peters is correct that "risk aversion" in this context is misnamed. It is not an aversion to volatility; it is an aversion to non-ergodicity. An agent who maximizes linear expected wealth in this domain is effectively betting on the ensemble average. But since the agent cannot access the ensemble, they are betting on a fiction.

  **Why This Does Not Kill Expected Utility Theory**

  My verdict is definite but qualified. Geometric rationality does not displace EUT universally; it subsumes it within the domain of persistent, multiplicative agency.

  In additive contexts (e.g., a fixed salary bonus independent of current wealth), the process is ergodic. The time average equals the ensemble average. Here, maximizing expected linear value is objectively correct. Similarly, in one-off gambles where the absorption barrier is not reachable, EUT holds. An agent might rationally take a 99% chance of ruin for a 1% chance of saving a life, because the utility of the life saved outweighs the future stream of wealth.

  However, the "investment" problem—the core of capital allocation—is inherently multiplicative and repeated. In this specific, crucial domain, the Samuelson defense collapses. To argue that an agent can rationally choose a strategy that guarantees ruin in the time limit simply because the ensemble average looks good is to detach economics from the physical reality of the agent. It treats the economy as a static mapping of preferences rather than a dynamical system.

  **Conclusion: The Physicist's View**

  You spent your career studying systems where the microscopic dynamics dictate the macroscopic constraints. In statistical mechanics, we do not say a gas molecule "prefers" to maximize entropy; we say the dynamics make it overwhelmingly probable. Ergodicity economics applies this rigor to wealth.

  The dispute resolves when we acknowledge that **rationality requires existence.** An optimization criterion that leads to the termination of the optimizer is self-defeating. In multiplicative systems with ruin, the ensemble average is a mathematical artifact, while the time average is the physical reality.

  Therefore, I defend the verdict that **geometric rationality is the objectively correct standard for repeated multiplicative decisions where survival is a prerequisite for future choice.** This is not a retreat to "it depends on your utility function." It is an assertion that the utility function is constrained by the dynamics of the system. If your utility function requires you to ignore the difference between time and ensemble averages in a non-ergodic world, your utility function is physically inadmissible for a persisting agent.

  Peters does not merely offer a new utility function; he identifies a coordinate error in standard economics. We have been optimizing over space (ensemble) when we live in time. For the physicist, the choice is clear: you cannot eat an ensemble average. You must live on your trajectory. And on that trajectory, the geometric mean is the only law that matters.
