      *   **The Physicist's Angle:** The user knows that in stat mech, ergodicity is a property of the *system*, not the observer. If a system is non-ergodic, ensemble methods fail to predict time behavior. The question is: Is wealth accumulation a non-ergodic process that *demands* a specific optimization criterion?

