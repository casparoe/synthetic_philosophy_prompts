      *   **The Parrot Case:** Gangesha rejects it as *pramana*. Why? No knowledge in the speaker, no intent to communicate. It's *shabdabhasa*.
      *   **Prabhakara Counter:** Speaker psychology doesn't matter; if the sentence generates true cognition in the hearer, it's *pramana*.
      *   **Gangesha's Conditions for Sentence Meaning (*Sakti*):**
