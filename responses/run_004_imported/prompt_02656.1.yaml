      *   **Specific Constraint:** Reconstruct the verdict based on Gangesha's actual apparatus (*akanksha, yogyata, sannidhi, tatparya*, the role of the *apta*, the "localist" interpretation by Das) rather than superficial analogies. Identify pressure points in Gangesha's theory.

  2.  **Deconstruct the Philosophical Framework (Nyaya/Gangesha):**
