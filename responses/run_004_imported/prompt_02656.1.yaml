      *   **The *Apta* Problem:** An LLM is not a person (*purusha*). It cannot be "trustworthy" in the moral/epistemic sense because it has no beliefs.
      *   **The *Tatparya* Problem:** *Tatparya* is crucial for Gangesha to disambiguate meaning. Can an LLM have *tatparya*? It has a "goal" (next token prediction), but not a communicative intent to convey truth.

