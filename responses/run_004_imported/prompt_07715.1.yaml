      *   **Newman Objection:** If you only claim to know structure (relations), any set of objects of the right cardinality can satisfy that structure via some arbitrary relation. So, claiming "we know the structure" is trivial unless you specify *which* relations are natural/physical.
      *   **The Tension:** ESR thinks OSR avoids Newman by denying the gap between structure and nature. OSR thinks ESR succumbs to Newman because they keep the gap (agnosticism about relata). But the user (and the ESR character in this prompt) suspects OSR just moves the problem: if the world *is* structure, what makes *that* structure the physical one and not a trivial mathematical isomorph?
