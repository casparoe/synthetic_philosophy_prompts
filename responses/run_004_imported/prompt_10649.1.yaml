          *   *Smith's Meaning:* It's ironic. A shopkeeper wouldn't buy an estate to keep a customer (costs exceed gains). It *looks* like a shopkeeper's project (gaining customers), but actual shopkeepers (merchants) know better. It is fit for a government *influenced* by shopkeepers (merchants) who capture the benefits while the public pays the costs (defense/admin).
