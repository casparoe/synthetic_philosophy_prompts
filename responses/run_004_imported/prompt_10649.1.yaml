          *   *Assessment:* This is a very strong summary of Smith's core economic argument in Part 2 of Book IV, Ch. vii ("Of the Disadvantages of those extraordinary Restraints upon the Importation of Goods of almost all Kinds from such of our American Colonies as are designated by the Name of Plantations").
      *   **Part (b): "Nation of shopkeepers".**
