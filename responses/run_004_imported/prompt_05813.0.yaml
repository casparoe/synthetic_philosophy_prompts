answer: |-
  Here are 10 questions designed to move the discussion beyond the standard handout material, including the specific thematic requirements you requested. Each includes a follow-up keyed to a likely response.

  **1. The Pragmatic Objection (Riding)**
  "We all accept the pragmatic truth that if I ride a white horse, I am riding a horse. The traditionalist says this proves 'white horse is horse.' You argue Gongsun Long offers genuine logical insight. How does your reading *defuse* the riding objection rather than just *redescribing* it? If the logic holds, why does the pragmatics seem to contradict it so violently?"
  *   **Follow-up:** "If you say they operate on different levels (semantic vs. pragmatic), doesn't that concede that his logic is useless for actual communication? If a logic cannot track successful action, in what sense is it 'valid'?"

  **2. The Linguistic Turn (Hansen/Mass Nouns)**
  "Much of the modern defense of the *Bai Ma Lun* leans, implicitly or explicitly, on Chad Hansen's mass-noun hypothesis—that classical Chinese nouns function like 'water' rather than count nouns. Does your defense rely on this? If so, does that vindicate Gongsun Long's *logic*, or does it just relocate the puzzle from metaphysics into linguistics?"
  *   **Follow-up:** "If it's merely a feature of mass-noun grammar that allows 'white horse not horse,' isn't the insight trivial? How do you get from 'grammar allows this' to 'this is a profound logical truth'?"

  **3. The Copula Problem (Identity vs. Membership)**
  "We want to cash out the 'is' in 'white horse is not horse.' In modern terms, we'd ask if this is identity or class-membership. But Gongsun Long didn't have predicate logic. How do you reconstruct his operator without smuggling in Frege or Russell? What is the native semantic category he is actually manipulating?"
  *   **Follow-up:** "If you say it's about *ming* (naming) rather than predication, does that mean 'white horse' and 'horse' are competing names for the same object, rather than one being a subset of the other? How does that avoid contradiction?"

  **4. The Semantics of *Fei* (非)**
  "Related to the copula: the character *fei* is often translated as 'is not,' but it can also mean 'wrong' or 'exclude.' If we read *bai ma fei ma* as 'white horse excludes horse' rather than 'is not identical to,' does your logical insight survive? Or does the argument collapse into a mere claim about semantic range?"
  *   **Follow-up:** "If it's about exclusion, isn't Xunzi right that this is just sophistry? How does 'exclusion' yield the ontological weight you seem to attribute to the dialogue?"

  **5. The Mohist Counter-Canon**
  "The later Mohist Canons explicitly argue against the School of Names, stating 'a white horse is a horse' is a valid inference of kind (*lei*). If your reading is correct, are the Mohists simply making a logical error, or are they and Gongsun Long playing different games? If the latter, what is Gongsun Long's game that the Mohists refuse to play?"
  *   **Follow-up:** "If the Mohists represent the 'common sense' logic of the time, does defending Gongsun Long require us to view the Mohists as philosophically inferior, or just differently motivated?"

  **6. Ontological Commitment (Platonism?)**
  "Some interpreters see Gongsun Long as a Chinese Platonist, positing abstract universals ('whiteness', 'horseness') that exist independently. Does your reading commit him to this kind of realism? If 'white horse' is distinct from 'horse,' where does the 'white horse' entity reside?"
  *   **Follow-up:** "If you deny he's a Platonist, what is the status of the 'white horse' if it isn't a universal and isn't just a physical particular? Is it a linguistic construct?"

  **7. Intensionality (The 'Seeking' Argument)**
  "Gongsun Long argues that if you seek a horse, a yellow one suffices; if you seek a white horse, it does not. This looks like an early grasp of intensional contexts. Do you read this as a logical point about reference failure, or a psychological point about desire? How much theory of mind are you attributing to him?"
  *   **Follow-up:** "If it's about reference, does he have a concept of 'sense' vs. 'reference'? If not, how does he distinguish the object sought from the description used?"

  **8. Normative vs. Descriptive**
  "Is the *Bai Ma Lun* describing how language *does* work, or prescribing how it *ought* to work for the sake of political order (Rectification of Names)? If it's prescriptive, does that undermine its status as 'logical insight' and make it a political tool?"
  *   **Follow-up:** "If it is political, why use such abstruse logic? Wouldn't a simpler rule be more effective for governance? What does the complexity add to the political project?"

  **9. The Cost of Interpretation**
  "Every interpretation pays a price. If we accept your defense of Gongsun Long as a logical realist, what do we have to stop him from saying? Are there any claims in the text you have to treat as mistaken or inconsistent to make your reading work?"
  *   **Follow-up:** "If you say 'none,' are you risking making him sound *too* modern? Where is the point where his thought remains genuinely alien to us?"

  **10. The Contemporary Stumper**
  "Finally, let's strip away our modern apparatus. If you were a sharp critic at the time—say, a Mohist logician or an early Confucian—with none of our semantic theories, what single argument could you have raised that would have actually stumped Gongsun Long? What is the internal weakness in his system that doesn't require 20th-century logic to expose?"
  *   **Follow-up:** "If nothing could stump him in his own context, does that suggest his system is hermetically sealed and therefore philosophically inert? How does his logic engage with the world if it's immune to contemporary critique?"
