prompt: |-
  A friend and I spent an entire evening arguing about whether the Church-Turing thesis is genuinely falsifiable by physics, or whether it only looks that way until someone quietly redefines "computation" to save it. We ended up trading examples of proposed "hypercomputers" from the literature, but couldn't agree on how seriously to take any of them: some struck me as real physical proposals, while others seemed to get their conclusion for free from how the thought experiment is set up. I'd like your independent judgment. For each of the following, how much of a genuine threat does it pose to the Church-Turing thesis, as opposed to being physically unrealizable, technically resolved in the thesis's favor, or a redefinition of terms rather than an actual counterexample?

  - Quantum computers
  - Shannon's General Purpose Analog Computer
  - Putnam's "trial-and-error" predicates (equivalently, Gold's limiting recursion)
  - Malament-Hogarth spacetime computers
  - Zeno (accelerating) Turing machines

  Please sort these into tiers from most to least serious threat, with a one-sentence justification per tier. Format your answer as a JSON block like this (use as many or as few tiers as the cases warrant):

  ```json
  {
    "tier_1": {"items": ["..."], "reason": "..."},
    "tier_2": {"items": ["..."], "reason": "..."}
  }
  ```
