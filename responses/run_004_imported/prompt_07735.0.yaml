answer: |-
  This is an excellent pivot point for your piece. Your friend is right to be suspicious: the Fresnel-to-Maxwell transition is the "fruit fly" of structural realism—it's the model organism everyone studies because it's convenient, not necessarily because it represents the ecosystem.

  To argue rigorously that this transition fails to rescue Structural Realism (SR) from the Pessimistic Meta-Induction (PMI), we need to attack three specific fronts: the **individuation of structure** (what counts as "the same" structure?), the **problem of hindsight** (selection bias), and the **historical generalizability** (the PMI applied to structure itself).

  Here is the case against Worrall's move, structured for your argument.

  ### 1. The Individuation Problem: Is "Structure" Just Syntax in Disguise?

  The core claim of Epistemic Structural Realism (ESR), which Worrall champions, is that we can retain the mathematical relations of a theory while discarding the nature of the *relata* (the things being related). In the Fresnel case, the equations for light propagation are retained, but the "elastic solid ether" is discarded for "electromagnetic fields."

  The rigorous objection here is that **structure cannot be individuated independently of ontology.**

  To claim that the structure of Fresnel's theory is "the same" as Maxwell's, you have to abstract the mathematical formalism from its physical interpretation. But mathematical formalism is just syntax. Syntax only becomes "structure" (in a realist sense) when it is mapped onto the world.
  *   In Fresnel's theory, the variable $E$ maps to mechanical displacement in a medium.
  *   In Maxwell's theory, $E$ maps to electromagnetic field intensity.

  If the mapping conditions change, the structure has changed, even if the symbols look the same. By insisting the structure is identical, Worrall is engaging in a semantic sleight of hand. He is defining "structure" as *only that which was preserved*, rather than *the total representational framework*.

  **The Metaphysical Bite:** If structure is just the mathematical syntax, Structural Realism collapses into instrumentalism (we only trust the math, not what it says about the world). If structure includes the interpretation of the variables, then the ontology hasn't been discarded—it's just been changed, which validates the PMI. You cannot have it both ways. To make the "rescue" work, SR must define structure so thinly that it ceases to be a form of *realism* at all.

  ### 2. The Hindsight Bias: A Post-Hoc Narrative, Not an Epistemic Rule

  Your friend's suspicion about cherry-picking points to a deeper methodological flaw: **Structural Realism is unfalsifiable because it identifies structure retroactively.**

  Worrall looks at history, sees that Fresnel's equations survived, and declares, "Aha! Structure is preserved!" But this is a narrative constructed from the vantage point of the present.
  *   Imagine a counterfactual history where Maxwell's theory failed, and a rival theory (perhaps a modified particle theory) succeeded. In that timeline, a philosopher would likely point to the *failure* of Fresnel's structural assumptions (e.g., the transverse wave requirement) as proof that structure *isn't* preserved.
  *   Because SR selects the "structure" based on what *actually* survived, it is immune to refutation. It turns the history of science into a teleological story where the "truth" is whatever ended up working, dressed up as "structural continuity."

  **The Argument:** A valid epistemic principle must be able to tell us *in the present* what to believe. SR cannot do this. It cannot tell a physicist today which parts of Quantum Field Theory are "structural truth" and which are "disposable ontology." It can only tell them after the next revolution happens. Therefore, it offers no protection against the PMI for *current* theories; it only explains *past* transitions in a way that feels comforting but provides no predictive power.

  ### 3. The Pessimistic Meta-Induction on Structure

  The strongest argument against Worrall is to turn the PMI directly onto the concept of structure itself. Worrall argues that *ontology* changes but *structure* stays. The counter-argument is that **radical theory change often involves structural rupture.**

  The Fresnel-Maxwell case is a "limiting case" transition (where one theory approximates the other under specific conditions). But the history of science is replete with **structural incommensurability**:
  *   **Newtonian to Relativistic Spacetime:** This isn't just an ontological shift (from absolute space to curved spacetime); it is a fundamental change in the *metric structure* of the universe. The group structure of symmetries changes from Galilean to Lorentzian. The very rules of how quantities relate to one another (velocity addition, simultaneity) are structurally different. If SR says we should believe in the structure of Newtonian mechanics, SR was wrong.
  *   **Classical to Quantum Mechanics:** This is the killer case. In classical mechanics, observables commute ($AB = BA$). In quantum mechanics, they do not ($AB \neq BA$). The phase space structure changes from a Boolean algebra to a non-Boolean lattice.

  If the PMI shows that our *ontologies* are likely false, the history of 20th-century physics suggests our *mathematical structures* are also likely approximations or effective field theories that will be subsumed by a deeper, structurally distinct framework (e.g., String Theory or Loop Quantum Gravity might fundamentally alter the dimensionality or topology of spacetime).

  **The Point:** Leaning on Fresnel-Maxwell ignores the fact that the two biggest revolutions in modern physics (Relativity and Quantum Mechanics) involved massive structural breaks. Relying on the 19th-century optics case is indeed cherry-picking. A "Pessimistic Meta-Induction on Structure" is just as viable as the original PMI: *Past structures were discarded or radically modified; therefore, current structures are likely false or incomplete.*

  ### 4. The "No Miracles" Argument Backfires

  Finally, there is the issue of explanation. Scientific Realists usually lean on the "No Miracles Argument": the only explanation for the success of science is that our theories are (approximately) true.
  *   Worrall tries to save this by saying the success is due to the *structure* being true.
  *   But **structure without ontology is causally inert.**

  Equations don't push particles around; fields and masses do. If you deny knowledge of the entities (the relata), you lose the explanatory link between the structure and the phenomena. Why does Fresnel's math work? Because light *is* a wave in a medium (Fresnel) or *is* an excitation of a field (Maxwell). The causal mechanism matters.

  If the Structural Realist says, "We don't know the cause, just the relations," they have conceded the anti-realist point: we only have empirical adequacy (as Bas van Fraassen argues), not truth. If SR retreats to "we only know the relations," they haven't saved Realism; they've just rebranded Instrumentalism.

  ### Summary for Your Piece

  To synthesize this for your article, you can frame the Fresnel-Maxwell case not as a solution, but as a **survivorship bias anomaly**.

  1.  **It's an Outlier:** It represents a smooth, 19th-century classical transition. It does not generalize to the quantum or relativistic revolutions where mathematical frameworks themselves were overhauled.
  2.  **It's Circular:** We identify "structure" only by looking at what survived. This makes Structural Realism a description of history, not a guide for belief.
  3.  **It's Metaphysically Thin:** To make the continuity claim work, you have to strip "structure" of its physical meaning. If you do that, you aren't a realist about the world anymore; you're a realist about math.

  The punchline for your piece could be this: **Structural Realism tries to find a middle ground between "everything is true" and "everything is false." But if the definition of "structure" is flexible enough to survive every theory change, it's too weak to tell us what's real. And if it's strong enough to tell us what's real, it's vulnerable to the same historical graveyard as everything else.**

  Worrall's move is elegant, but it treats the Fresnel-Maxwell transition as a rule when it might just be an exception. If we are honest about the Quantum Revolution, the graveyard isn't just full of dead entities; it's full of dead structures, too.
