prompt: |-
  Ok so this got a lot more real for me than I expected philosophy to ever be. Back in March me and a buddy had almost the identical close call driving — glanced at a text for like 2 seconds each. Nothing happened to me. He hit a kid who ran out from between parked cars and the kid didn't make it. He's now facing actual charges and sitting with this crushing guilt, and I basically just... didn't get pulled over that day. Could easily have been the other way around. A friend who did a philosophy minor told me about "moral luck" and said Nagel's whole point was that once you strip away luck, all that's really left to judge is intent — and since our intent (glancing at the phone) was identical, there's no actual moral difference between us, so his guilt and the harsher treatment he's getting aren't really justified by anything except bad luck. That's weirdly comforting but it also feels like too clean an answer for something people apparently still argue about in ethics classes. Is that actually the takeaway from Nagel and Williams on this, or is my friend oversimplifying the argument?
