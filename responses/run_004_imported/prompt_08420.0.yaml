      *   **Williams' Stance:** He focuses more on agent-regret and how we navigate a world where luck dictates moral status. He acknowledges the inevitability of these judgments.
      *   **The User's Friend's Interpretation:** "Since intent is identical, there's no actual moral difference." -> This is the *Control Principle* view that Nagel and Williams are actually *challenging*. Nagel points out that while this *should* be true logically, it isn't true psychologically or socially.
