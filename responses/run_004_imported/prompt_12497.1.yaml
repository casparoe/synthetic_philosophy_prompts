answer: |-
  Good morning.

  For forty years, my office was a dome on a mountain in Chile, and my objects of study were galaxies receding at fractions of the speed of light. I built instruments sensitive enough to count photons that had traveled billions of years to die on my CCDs. But I never touched a galaxy. I never moved a star. I never tweaked the initial conditions of the universe to see if the Cosmic Microwave Background would come out differently.

  I mention this because I am the token scientist in this room, but I am also the token person who knows what it feels like to be told that causation requires a "handle."

  I have spent my retirement reading Jim Woodward and David Lewis. I did this because I wanted to understand what I had actually been doing when I claimed to have found a cause. And I keep snagging on a specific friction. Woodward's interventionism feels like a theory built with a chemistry bench in mind. It thrives where there are knobs to turn, where variables can be isolated, where the experimenter is a god in a small, local world.

  But for the astronomers, the paleontologists, and the historical linguists in this room, the relevant intervention is not just difficult; it is metaphysically closed. I cannot intervene on the mass of a progenitor star. A paleontologist cannot intervene on the asteroid impact at Chicxulub. A historical linguist cannot intervene on the Great Vowel Shift.

  So, we retreat to the hypothetical. We say, "If the mass *had* been different, the supernova *would* have been different." But the moment the intervention becomes purely hypothetical, I lose the grip on what distinguishes Woodward from Lewis.

  Lewis tells us causation is counterfactual dependence: if $C$ had not occurred, $E$ would not have occurred. Woodward tells us causation is invariance under intervention: if we change $C$ via an ideal intervention, $E$ changes.

  To the philosopher, these are distinct architectures. To the observational cosmologist, they look like the same view through different filters. If the intervention is physically impossible, if it exists only in the space of models and equations, isn't it just a counterfactual in graph-theoretic dress? When I run a simulation of structure formation, varying the dark matter density parameter, am I performing an intervention, or am I exploring a counterfactual world? The math is identical. The epistemic access is identical.

  I want to state the difficulty fairly to both sides of this room.

  To the philosophers: I know the reply. Woodward does not require interventions to be *humanly* possible, only *logically* or *physically* definable. The point is not the act of meddling, but the structure of dependence. Interventionism saves causation from the vagueness of "similarity between possible worlds." It forces us to specify *which* path we are cutting, *which* variable we are holding fixed. It gives us a grammar for mechanisms. Without this, we drown in spurious correlations. We need the discipline of the "lever," even if the lever is imaginary, to stop us from confusing the barometer with the storm.

  To the scientists: I know your frustration. You do not wait for a philosopher to validate your causal claims. You know the asteroid killed the dinosaurs not because you can re-run the Cretaceous, but because you have the iridium layer, the shocked quartz, the crater, and the models of climate collapse that hang together. You rely on "natural experiments" and consilience. If a theory of causation tells you that your work is second-rate because you cannot manipulate the past, that theory is useless to you.

  So, here is my honest position, for what it is worth from a retired observer.

  I suspect Woodward's hypothetical interventions do quietly concede Lewis's point, but only if we care about *metaphysics*. If we are asking "What is causation *really*?", then an impossible intervention is indistinguishable from a counterfactual. The lever is a fiction in both cases.

  But if we are asking "How do we *find* causes?", Woodward wins, even in the historical sciences. Why? Because the language of intervention forces us to build modular models. It forces the paleontologist to ask: "Can I vary the impact velocity independently of the impactor size in my simulation?" It forces the linguist to ask: "Does this sound change propagate independently of social structure?"

  Lewis gives us a logic of what *might have been*. Woodward gives us a blueprint for *modeling*. The value of interventionism isn't that we can pull the lever; it's that it tells us how to construct the machine so that we know which lever *would* have mattered.

  However, this leaves us with a gap. In the lab, the intervention tests the model. In the historical sciences, the model tests the *evidence*. We cannot check our causal claims against a manipulated reality. We check them against the surviving traces of a singular history.

  This brings me to the question I want to leave with this room. It is not a question about who is right. It is a question about the texture of knowledge.

  In the experimental sciences, causal knowledge is often *productive*: knowing the cause allows you to make the effect. In the historical sciences, causal knowledge is *reconstructive*: knowing the cause allows you to explain the trace.

  My question is this: **Does the impossibility of actual intervention change the *status* of the causal claim, or only the *method* of its verification?**

  If I say "Gravity caused the star to collapse," and I can never turn gravity off, is that statement less "causal" than "Turning the valve caused the pressure to drop"? Or is it the same relation, merely accessed through a different epistemic door?

  If it is the same relation, then philosophy needs to explain why the "manipulability" criterion doesn't demote the historical sciences to a lesser form of understanding. If it is a different relation, then we need to admit that "causation" might be a family resemblance term, where the astronomer and the chemist are using the same word for tools that look alike but cut differently.

  I spent my life watching light from the past. I never touched the source. But I am convinced I knew the causes. I invite you to spend this workshop telling me whether I was right, and if so, what kind of rightness that was.

  Thank you.
