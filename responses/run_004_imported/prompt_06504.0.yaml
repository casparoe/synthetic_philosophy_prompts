answer: |-
  **MEMORANDUM**

  **TO:** Committee on Student Leaves and Academic Continuity
  **FROM:** Graduate Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Extended Bereavement Accommodations

  **Recommendation**
  I recommend the committee adopt Option C: the creation of a distinct "Extended Bereavement Leave" category requiring verification of death (e.g., obituary or death certificate) but *no* clinical diagnosis. This leave should grant up to four weeks of excused absence with tuition adjustment and re-enrollment protections, matching existing medical leave standards. This policy should take effect immediately for the current semester and apply retroactively to students currently on informal leave for bereavement.

  **Philosophical Justification**
  This recommendation rests on a specific position regarding the ontology of grief. While the DSM-5-TR classifies Prolonged Grief Disorder (PGD), we must distinguish between clinical utility and conceptual truth. Adopting Option A (requiring PGD certification) implicitly endorses a Naturalist account of disease, akin to Boorse's Biostatistical Theory, suggesting that intense, long-term grief is a "species-atypical failure" of psychological mechanisms designed for survival.

  I argue this is incorrect. Grief, even when prolonged and incapacitating, is often a normative response to a catastrophic environmental change (loss), not necessarily an internal mechanical dysfunction. Following Wakefield's "Harmful Dysfunction" analysis, while prolonged grief is certainly *harmful*, labeling it a *dysfunction* risks pathologizing the depth of human attachment. If we require a diagnosis for accommodation, we assert that a student is only deserving of support if their grief is "broken." A Normativist or Welfare-based approach (à la Nordenfelt) is more appropriate here: the university's obligation is to restore the student's ability to achieve vital goals (academic continuity) when welfare is compromised by life events, regardless of whether that compromise stems from internal pathology or external tragedy. We should support the *harm*, not adjudicate the *dysfunction*.

  **The Case for Diagnosis (Option A)**
  I acknowledge the strength of the argument for requiring a PGD diagnosis. This position prioritizes administrative consistency and fraud prevention. By aligning bereavement with existing medical leave protocols, the committee utilizes established verification mechanisms that objectively demonstrate incapacity. This protects the institution from abuse where students might seek extended leave for non-impairing reasons under the guise of grief. Furthermore, for students whose grief *has* developed into comorbid depression or trauma, a clinical pathway ensures they are referred to treatment, not just time off. It treats the student as a patient needing care, which is a valid ethical framework for a university health service.

  **Why Option C Prevails**
  However, the medical pathway creates a barrier to care that is ethically untenable. Requiring a psychiatric label forces students to internalize a disorder identity to access basic academic continuity. It disproportionately harms students from backgrounds with limited access to mental healthcare or cultural frameworks that view grief spiritually rather than medically. The verification of death is a sufficient administrative threshold; the university is not equipped to determine when grief becomes "pathological," nor should it be.

  **Implementation**
  To implement Option C, we will draft a policy addendum defining "Immediate Family" consistent with the existing five-day policy, while allowing petitions for extended kin or chosen family. Verification requires documentation of death, not medical status. For students currently navigating this informally, the retroactive application ensures we do not penalize those who suffered under the previous policy gap during this transition.

  We must decide whether we are a community that supports members in crisis or a bureaucracy that certifies pathology. I urge we choose the former.
