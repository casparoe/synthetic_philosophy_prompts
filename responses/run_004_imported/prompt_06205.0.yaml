          *   Calibration means: Inside the "High Risk" bucket, the % of actual reoffenders is the same for both groups.
          *   FPR means: Of the people who *didn't* reoffend, how many ended up in the "High Risk" bucket?
          *   The Conflict: Because Group A has way more reoffenders overall, to keep the "High Risk" bucket calibrated (same % reoffenders), Group A needs *more* people in the High Risk bucket generally. This pulls in more non-reoffenders from Group A. Group B has fewer reoffenders, so to keep the ratio the same, their High Risk bucket must be smaller. This leaves most of their non-reoffenders in the Low Risk bucket.
          *   Result: Group A's non-reoffenders are more likely to be in the High Risk bucket (Higher FPR) than Group B's non-reoffenders.

      *   *Attempt 3 (Refining for "Gut Level"):* Let's use a concrete example with numbers that are easy to follow.
          *   Group A: 100 people, 50 reoffend (50% base rate).
          *   Group B: 100 people, 10 reoffend (10% base rate).
          *   Tool says "High Risk" = 50% chance of reoffending (Calibration).
          *   For Group A: To get a 50% success rate in the High Risk bucket, we need equal reoffenders and non-reoffenders in that bucket. Say we put 20 reoffenders and 20 non-reoffenders in High Risk. (20/40 = 50%).
          *   For Group B: To get a 50% success rate in the High Risk bucket, we need equal reoffenders and non-reoffenders. But they only have 10 reoffenders total! Let's say we put all 10 in High Risk. Then we can only put 10 non-reoffenders in there to keep the 50% ratio.
          *   Now check FPR:
              *   Group A Non-reoffenders: 50 total. 20 in High Risk. FPR = 20/50 = 40%.
