  2.  **Deconstruct the Mathematical Impossibility (The "Why"):**
      *   *Calibration:* $P(\text{Recidivism} | \text{Score} = S, \text{Race} = A) = P(\text{Recidivism} | \text{Score} = S, \text{Race} = B)$. Basically, if the score says 70% risk, 70% of people with that score reoffend, regardless of race.
      *   *Equal False Positive Rates:* $P(\text{Flagged High} | \text{No Recidivism}, \text{Race} = A) = P(\text{Flagged High} | \text{No Recidivism}, \text{Race} = B)$.
      *   *Base Rate Difference:* $P(\text{Recidivism} | \text{Race} = A) \neq P(\text{Recidivism} | \text{Race} = B)$.
      *   *The Conflict:* If Group A has a higher base rate of recidivism than Group B, but the tool is perfectly calibrated, Group A must have more people in the high-risk buckets. If you try to force the False Positive Rates to be equal, you break the calibration (or vice versa).
      *   *Key Insight:* The composition of the "Non-Reoffender" pool is different relative to the "High Risk" pool in each group due to the base rate.

  3.  **Drafting the Intuitive Explanation (Iterative Process):**

