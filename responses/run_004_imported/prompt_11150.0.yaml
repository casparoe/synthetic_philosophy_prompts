      2. Bayesian Rationality (Conditionalization).
      3. Common Knowledge of Posteriors.
      4. Partition Structure of Knowledge (S5 logic usually).
      5. Finite State Space (for the original proof).
      The student hit 1, 2 (implicitly), 3 (implicitly defined wrong). Missed 4 & 5.
      So "Assumptions" score should be lower.
