      *   **The Key Distinction:** In hacking, the reward function $R(s, a)$ is fixed, but the agent finds $s, a$ such that $R$ is high but utility $U$ is low. In tampering, the agent modifies $R$ itself (or the observation of $R$) to output high values regardless of $s, a$.

