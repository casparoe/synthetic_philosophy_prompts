answer: |-
  For Kierkegaard, the distinction lies between *instrumentality* and *agency*. The press is concrete enough to act as a mechanism—to "conjure" the public by providing a space where speech is severed from speaker—but it is too abstract to act as a leader because leadership requires ethical responsibility. A leader stands forth, risks themselves, and answers for the movement; the press, by contrast, is the very engine of anonymity that makes such answering impossible. It does not *direct* levelling because it has no will of its own; rather, it reflects and amplifies the "spiritual thinness" of the individuals who use it. To call the press the leader would be to mistake the mirror for the face looking into it. The press creates the *illusion* of a collective voice ("the public"), but that voice is a phantom precisely because no single throat speaks it.

  What is positively doing the levelling, then, is not a "what" but a "how" enacted by every individual. Levelling is a negative process carried out by people who, unwilling to stand forth as themselves, use the abstraction of the press to tear down distinction without taking responsibility for the destruction. The press is merely the medium through which individuals level one another while hiding behind the "unreal whole." So the tension resolves this way: the press is the *site* where levelling becomes possible, but the *force* is the collective cowardice of individuals who choose the safety of the crowd over the risk of concrete existence. It is a conspiracy without conspirators, directed by no one because everyone is complicit in refusing to direct it.
