answer: |-
  Here are ten questions tailored for the Q&A, designed to press the speaker on the specific vulnerabilities of an unrestricted Reflection Principle while anticipating her standard defensive maneuvers.

  ### 1. The Dutch Book and Epistemic Irrationality
  "The diachronic Dutch Book argument shows that violating Reflection makes an agent *exploitable* for a sure loss. However, critics like David Christensen have argued that pragmatic exploitability does not necessarily entail *epistemic* irrationality, particularly if the agent knows the loss is inevitable due to future cognitive decline. If I accept a Dutch Book now because I have certain evidence that my future self will be irrational, isn't that the *rational* response to my evidence? Why does avoiding pragmatic loss trump maximizing expected accuracy based on my current information?"

  *   **Follow-up:** If she insists that vulnerability to a Dutch Book is *constitutive* of irrationality, ask: "Does this commit you to the view that an agent who correctly predicts their own cognitive breakdown is thereby irrational for planning around it? That seems to conflate bad luck with bad reasoning."

  ### 2. The Drugged Agent and the "Knowledge" Condition
  "Consider a case where I have law-like certainty: 'Ingesting substance S sets credence in proposition P to 0.9 via a direct causal mechanism.' I ingest S. I now know with certainty that my future credence will be 0.9. Your view suggests I should set my current credence to 0.9. But I know S makes me delusional. I anticipate you will say I don't 'know' the future credence in the relevant *epistemic* sense. But if 'knowing future credence' effectively means 'knowing future credence formed via rational processes,' doesn't Reflection become a tautology: 'Conditional on my future self being rational, I should trust them'?"

  *   **Follow-up:** If she denies it is tautological, ask: "Can you specify the condition on 'knowledge' required for the antecedent without simply stipulating 'rationality'? If not, how does the principle offer independent normative guidance?"

  ### 3. Sleeping Beauty and Memory Loss
  "Memory loss in the Sleeping Beauty problem seems structurally distinct from drugging. The agent remains perfectly rational but loses self-locating information. Standard Reflection fails here because the agent knows her future credence will shift due to forgetting. Does your unrestricted principle force the 'Thirder' position by treating the future self as an expert despite the memory loss, or do you exclude memory loss cases from the antecedent? If the latter, what principled distinction separates memory loss from the drugging cases you dismiss?"

  *   **Follow-up:** If she says it forces Thirderism, ask: "Is Reflection doing the normative work here, or is it merely mirroring the updating rule you've already accepted? If it's the latter, isn't Reflection derivative rather than foundational?"

  ### 4. The Principal Principle Analogy
  "You draw an analogy between Reflection and Lewis's Principal Principle, treating one's future self as an epistemic expert. But we defer to experts because they possess *more* or *better* evidence. In Reflection cases, the future self often has the *same* evidence (minus forgetting) or corrupted evidence. If the analogy holds, does it imply we should only defer when the future self has strictly more evidence? If not, what grounds the 'expertise' if not information gain?"

  *   **Follow-up:** If she claims "temporal perspective" grants unique expertise, ask: "Why does temporal proximity confer epistemic privilege when the evidence base is static or degraded? Isn't that merely asserting the conclusion?"

  ### 5. Genuine Counterexamples vs. Intuitions
  "What would count as a genuine counterexample to your view? Is it sufficient to produce a case where following Reflection leads to demonstrably lower accuracy, or must the counterexample demonstrate a formal inconsistency within the probability calculus? If it's the latter, isn't the principle insulated from substantive epistemic critique?"

  *   **Follow-up:** If she says "only formal inconsistency counts," ask: "Does this render the principle epistemically inert? A rule can be formally consistent but truth-conducive in the wrong direction."

  ### 6. Accuracy-Dominance Arguments
  "Recent accuracy-first epistemology (e.g., Briggs and Pettigrew) derives Reflection principles from accuracy-dominance arguments. However, these derivations typically require restricting Reflection to cases of expected evidence gain. Does your unrestricted version lead to accuracy-domination in cases of expected evidence loss or corruption? If so, why should we prioritize Reflection over accuracy?"

  *   **Follow-up:** If she replies that accuracy isn't the sole goal, ask: "If not accuracy, what is the telos of belief that always favors tracking future credence, even when that future state is known to be less accurate?"

  ### 7. Essential Indexicals
  "How does your view handle essential indexicals? If I know my future credence in 'It is now 2pm' will be 1 at 2pm, Reflection seems to require I believe it's 2pm now. Do you restrict Reflection to non-indexical propositions, and if so, doesn't that severely limit the principle's scope? If not, how do you avoid the absurdity of believing the future time is the present time?"

  *   **Follow-up:** If she restricts the principle to non-indexicals, ask: "How do we cleanly separate indexical from non-indexical content in self-locating beliefs? Many propositions we care about have both components."

  ### 8. Conflict with Conciliationism
  "If I currently regard a peer as an epistemic equal, but I know my future self will disagree with them, does Reflection require me to defer to my future self over my current peer? This seems to privilege temporal proximity over epistemic parity. Is that a feature or a bug of your system?"

  *   **Follow-up:** If she says it is a feature, ask: "Why does time confer epistemic privilege? If my future self is just 'me later,' why is that status more weighty than 'another person with equal evidence'?"

  ### 9. The "No True Scotsman" Worry
  "You dissolve counterexamples by tightening the 'knowledge' condition in the antecedent. At what point does this strategy render the principle unfalsifiable? If every case where Reflection gives the 'wrong' answer is defined as a case where the antecedent wasn't met, are we left with any normative guidance for non-ideal agents?"

  *   **Follow-up:** If she claims it guides *ideal* agents, ask: "Why should non-ideal agents like us care about a principle that only applies to agents who never face the very problems (drugging, forgetting) we are trying to solve?"

  ### 10. Normative Source: Constitutive or Instrumental?
  "Is Reflection a constitutive norm of belief (you can't believe without it) or an instrumental norm (you should follow it to achieve a goal)? If constitutive, how do we explain apparent violations by sane agents? If instrumental, what is the goal that always favors tracking future credence, even when the future self is compromised?"

  *   **Follow-up:** If she argues it is instrumental, ask: "Can you conceive of a scenario where the goal (e.g., truth) is better served by *ignoring* future credence? If yes, the principle isn't unrestricted. If no, why not?"
