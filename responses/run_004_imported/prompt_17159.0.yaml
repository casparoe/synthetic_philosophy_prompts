      3.  The Attack on Physical Closure (Body-Body interaction is unintelligible).
      4.  Continuous Creation (The metaphysical undercutting of diachronic causation).
      5.  Conclusion: Kim identifies the vacuum of causal power in the mental, but Malebranche argues the vacuum is universal among creatures.

      *(Self-Correction during drafting)*: Make sure not to conflate epiphenomenalism and occasionalism. Epiphenomenalism: Mental is inert, Physical is active. Occasionalism: Both are inert, God is active. This distinction is crucial.

