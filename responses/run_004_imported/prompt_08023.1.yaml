answer: |-
  Friends, family, [Bride] and [Groom].

  Thank you for welcoming me into this space. To stand here is an honor I don't take lightly, mostly because I know better than most how heavy words can be.

  We are gathered to witness a promise. And because I am a student of philosophy, and because I know [Bride] as well as I do, I have spent a lot of time thinking about what happens when we say "I will."

  There is a common idea that a wedding vow is a prediction. It is a statement that says, "I feel so much love right now, and I am so certain of this feeling, that I can guarantee how I will feel ten, twenty, fifty years from now." If that is what a promise is, then it is a lie. None of us can predict the weather of our own hearts that far in advance. Life is too long, and people change too much.

  If we treated today as merely a renewal of that kind of promise—a promise based on the intensity of the present moment—we would be ignoring the wisdom that comes with time. We would be pretending that certainty is the same thing as commitment.

  So, I want to propose something different to you all, and especially to the two of you.

  A vow does not bind you because it predicts the future. It binds you because it limits it.

  When you make a promise today, you are not describing your feelings. You are voluntarily giving up a piece of your future freedom. You are saying, "Even if I change, even if the world changes, I am choosing to bind myself to this person."

  The first time [Bride] stood before a community to make this kind of vow, she was twenty-three. There is a beautiful kind of certainty that comes with youth. It is a certainty that assumes the path will remain straight because the view from the starting line is clear. That promise was not false. It was made with a whole heart. But it was a promise made on the assumption that love is a force that sustains itself.

  We know now that love is not just a force; it is a practice. And a practice requires a structure.

  This is why this promise can hold in a way that is different, and perhaps stronger, than before. This vow is not based on the hope that you will never want to leave. It is based on the agreement that when the desire to leave arises—as it may, in moments of frustration or fatigue—you have already agreed to stay.

  The binding power of this promise does not come from the magic of the words. It comes from the cost. A promise is only valuable if it costs you something to keep it. If you only stay when it is easy, you aren't keeping a vow; you're just following a feeling. But when you stay when it is hard, when you choose the constraint you placed on yourself today over the temporary freedom of tomorrow, that is when the promise becomes real.

  [Bride] and [Groom], you are not promising that you will be the same people you are today. You are promising that you will build a container strong enough to hold the people you will become.

  And this is where you, the family and friends in this room, come in. A promise like this is too heavy to carry alone. You are not just an audience; you are the witnesses who hold the memory of this commitment when the two of them might forget it. You are the community that makes this convention more than just words. When they struggle, you will remind them of the structure they built today.

  So, [Bride] and [Groom], I ask you now not to speak from your hopes, but from your will.

  [Groom], do you choose to take [Bride] as your partner, not because you are certain the road will be easy, but because you are willing to be bound to her through the difficulty? Do you accept the limitation of your own future freedom, in exchange for the shared life you build together?

  [Bride], do you choose to take [Groom] as your partner, knowing that love is a discipline as much as a feeling? Do you agree to honor the constraint of this vow, even when the certainty of the morning has faded by the evening?

  If you are ready to make that kind of promise, please face each other and speak your vows.

  *[Vows are exchanged]*

  By the power of your own will, and in the presence of these witnesses, you have built a new structure. It is not made of glass, but of iron. It is not a prediction of happiness, but a commitment to meaning.

  You may kiss.
