prompt: |-
  For my philosophy of history seminar we've been stuck for like two weeks on Hempel's covering-law model versus the narrativist critique of it (Dray, Gallie, Mink, Danto, that whole crew), and I feel like I can restate everyone's position on command but still don't have a great gut feeling for what's actually at stake between them. Like, sure, nobody thinks historians literally write out their laws the way Hempel's "explanation sketch" idea implies they secretly must — but I can't picture an actual case where the two approaches would cash out differently, rather than just being two different registers for saying the same thing.

  Could you make up a concrete example for me? Not one of the textbook cases (currency collapsing because the money supply expanded, bridges failing from metal fatigue, etc) — those always feel kind of rigged in Hempel's favor. Pick a single historical event (a real one, or a realistic invented one, either's fine) and sketch two explanations of it side-by-side: one that's a genuine covering-law explanation, actually leaning on some general law or law-like generalization to do the explanatory work, and one that's a proper narrative explanation in something like Gallie's or Mink's sense — explaining by "following the story"/colligating events under a theme, rather than subsuming the event under a law. Then, this is the part I keep getting tripped up on: say something about why the narrative explanation isn't secretly just a sloppier, half-stated version of the covering-law one. Our prof keeps insisting there's a principled difference, not just a difference in rigor, but everytime I try to press a narrative explanation to be more explicit about its "laws" it just seems to turn into the covering-law version, so idk where the real disagreement is even supposed to live.
