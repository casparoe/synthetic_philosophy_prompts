      *   **Requirements:** 8-10 questions total.
      *   **Specific Mandatory Topics:**
          1.  Löbian obstacle (theorem-proving agents, trust, paradox).
          2.  "Trade" vs. "Correlated Decision-Making" (semantics/ontology).
          3.  Updateless Decision Theory (UDT) vs. CDT/EDT (commitment binding).
          4.  Coordination/Splitting gains (how to agree on terms without communication).
          5.  Acausal Blackmail (evil twin, filtering good vs. bad).
      *   **Format:** For each question, include a "probable dodge" and a "follow-up to close it off."

  2.  **Deconstruct the Topics & Brainstorm Questions:**

      *   *Topic 1: Löbian Obstacle.* This is technical. It's about two agents trying to prove the other will cooperate. If Agent A proves B cooperates, A cooperates. But if the proof systems are too strong, they run into Gödelian issues or infinite regress.
          *   *Idea:* Ask about the specific mechanism of trust without communication.
          *   *Dodge:* "We use modal logic / provability logic."
          *   *Follow-up:* "Doesn't that require identical source code or logical strength?"

      *   *Topic 2: Trade vs. Correlation.* Is it really trade? Or just two things happening to align because they reason similarly?
          *   *Idea:* Challenge the normative force. Why call it a *deal*?
          *   *Dodge:* "It functions like trade; value is exchanged."
          *   *Follow-up:* "If I can't renege, is it a deal or just physics?"

      *   *Topic 3: UDT vs. CDT/EDT.* CDT (Causal) ignores the correlation. EDT (Evidential) gets Newcomb'd. UDT (Updateless) commits before observing.
          *   *Idea:* Why is UDT necessary? What breaks in CDT?
          *   *Dodge:* "CDT fails in Newcomb problems."
          *   *Follow-up:* "But UDT requires a prior over logical facts. How do you specify that without arbitrariness?"

      *   *Topic 4: Coordination/Splitting.* The Bargaining Problem. Nash Bargaining Solution? Without communication, how do we pick the focal point?
          *   *Idea:* If there are multiple equilibria, how do we pick one?
          *   *Dodge:* "Schelling points."
          *   *Follow-up:* "What if our Schelling points differ due to cultural/architectural bias?"

      *   *Topic 5: Acausal Blackmail.* If I can be influenced by distant agents, can they threaten me?
          *   *Idea:* How to distinguish trade from blackmail?
          *   *Dodge:* "Don't negotiate with terrorists / precommit not to respond."
          *   *Follow-up:* "How do you precommit against a simulator who knows your precommitment?"

      *   *Filling the remaining 3-5 questions:* Need to broaden the scope while staying technical.
          *   *Idea 6:* Simulation Hypothesis. Does this rely on us being simulated?
