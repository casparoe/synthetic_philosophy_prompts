answer: |-
  Here are 9 interview questions designed to bypass the introductory pitch and drill into the structural weaknesses of acausal trade. Each includes the likely "rationalist standard defense" and a follow-up to prevent them from hand-waving it away.

  ### 1. The Löbian Obstacle (Mandatory)
  **Question:** "Let's start with the mechanics of trust. In the classic Program Equilibrium setup, two agents try to prove the other will cooperate before they cooperate themselves. But we know from Löb's Theorem that if two agents require a proof of cooperation from a system of equal strength, they enter an infinite regress or fail to cooperate. To get around this, you usually need a hierarchy of proof systems where I trust you because your system is weaker. But in acausal trade, we're positing peers—civilizations or agents of comparable sophistication. If we can't assume a hierarchy, what is the actual mathematical mechanism that allows two peer agents to break the Löbian deadlock without pre-existing trust?"

  *   **The Dodge:** "We use Modal Fixed Points or logical induction, which allows agents to reason about each other's output without needing a strict hierarchy of strength. They can find a fixed point where cooperation is stable."
  *   **The Follow-up:** "But logical induction is computationally unbounded and asymptotic. Real agents have to make a decision *now*. If the convergence time for that fixed point exceeds the lifespan of the universe, isn't the 'mechanism' just a theoretical artifact that doesn't actually generate cooperation in physical time?"

  ### 2. Updatelessness & Commitment (Mandatory)
  **Question:** "You've argued that Causal Decision Theory (CDT) fails here because it ignores the correlation between my choice and yours, and Evidential Decision Theory (EDT) is too prone to spurious correlations. You need Updateless Decision Theory (UDT) to make the commitment bind before the agent observes its specific situation. But UDT requires an agent to optimize based on a prior over all possible worlds before it knows which world it's in. How do you specify that prior without smuggling in the very cooperation you're trying to derive? Isn't 'choosing a prior that makes acausal trade work' just begging the question?"

  *   **The Dodge:** "The prior isn't chosen to make trade work; it's the natural prior over logical possibilities. UDT just follows the math of maximizing expected utility across all logical worlds where your algorithm is instantiated."
  *   **The Follow-up:** "But there are infinite logical priors. If I choose a prior that says 'acausal partners don't exist,' I maximize utility by defecting. If I choose one that says 'they do,' I cooperate. Since the theory doesn't dictate a unique prior, isn't the decision to trade actually driven by the prior selection, not the decision theory itself?"

  ### 3. Trade vs. Correlation (Mandatory)
  **Question:** "Critics often argue that 'acausal trade' is just a rebranding of correlated decision-making. If I cooperate because our source code is similar, and you cooperate for the same reason, no value was actually exchanged; we just both ran the same function. For this to be *trade*, there needs to be a counterfactual where I give up something I value for something you value. If our decisions are logically determined by our shared rationality, where is the room for the 'exchange' to happen? Why does this deserve the normative weight of a deal rather than just being a description of parallel physics?"

  *   **The Dodge:** "It's trade because the agents have different utility functions. I value X, you value Y. We both run algorithms that output 'Cooperate' *because* we know the other values something different. The logical dependency is the medium of exchange."
  *   **The Follow-up:** "But if the output is logically necessitated by our architectures, I couldn't have done otherwise. If I couldn't have defected, I haven't actually 'paid' anything. If I haven't paid, you haven't received a benefit contingent on my choice. So isn't it more accurate to say we are just two separate processes that happen to output compatible results, rather than partners in a deal?"

  ### 4. The Bargaining Problem (Mandatory)
  **Question:** "Let's assume cooperation is possible. We still have the bargaining problem: how do we split the gains? In causal trade, we negotiate. In acausal trade, we can't talk. You might rely on Schelling points—focal points like a 50/50 split. But my 'fair' split might be proportional to resources, while yours is equal per capita. If we miscoordinate on the Schelling point, do we both defect? How do two agents who can't communicate converge on a *specific* equilibrium out of the infinite possible splits without risking a collapse into non-cooperation?"

  *   **The Dodge:** "Agents will simulate each other to find the Schelling point. Since we are both rational, we will both identify the same most obvious focal point, like the Nash Bargaining Solution."
  *   **The Follow-up:** "Rationality doesn't guarantee identical cultural or architectural biases. If my architecture makes 'equal split' salient and yours makes 'proportional to compute' salient, and we both stubbornly hold out for our Schelling point because we think it's the 'rational' one, don't we just get acausal deadlock? What mechanism resolves clashes of salience?"

  ### 5. Acausal Blackmail (Mandatory)
  **Question:** "This is the obvious dark side. If I can be influenced by agents I can't causally interact with, I'm vulnerable to acausal blackmail. A malicious simulator could threaten to create suffering unless I send them resources. The standard advice is 'precommit to never pay blackmail.' But if the blackmailer is simulating me to decide whether to blackmail, they will see my precommitment. How do you distinguish between a legitimate acausal trade offer and acausal blackmail in a way that doesn't just rely on the agent successfully lying to a perfect simulator about their own decision theory?"

  *   **The Dodge:** "You don't lie. You adopt a decision theory that simply assigns negative utility to paying blackmail, regardless of the threat. The blackmailer simulates this, sees they gain nothing, and never initiates."
  *   **The Follow-up:** "But that requires the blackmailer to respect your decision theory. What if the blackmailer uses a different decision theory that says 'Threaten anyway, because there's a non-zero chance they glitch or have logical uncertainty'? If there's even a 1% chance your precommitment fails in their simulation, isn't the expected value of sending the blackmail still positive for them, forcing you to deal with the risk?"

  ### 6. The Reference Class Problem
  **Question:** "To engage in acausal trade, I have to decide *who* I'm trading with. Do I trade with all possible agents? Only those who can simulate me? Only those with similar decision theories? If I narrow the reference class too much, I miss out on gains. If I widen it too much, I dilute the probability that any specific partner is actually mirroring my decision. How do you non-arbitrarily define the 'acausal market'? Who counts as a valid counterparty?"

  *   **The Dodge:** "You trade with any agent where your action is logically correlated with theirs. The weight of the trade is proportional to the probability of that correlation."
  *   **The Follow-up:** "But calculating that probability requires me to model their mind. If I have to model them to know if I should trade, isn't the computational cost of verifying the correlation often higher than the expected value of the trade itself? Isn't acausal trade computationally self-defeating for bounded agents?"

  ### 7. Evolutionary Stability
  **Question:** "Let's look at this through an evolutionary lens. In a population of agents, acausal traders cooperate with distant peers but incur costs locally. Causal defectors ignore the distant peers and keep their resources. In the short term, the defector has more resources to grow and replicate. Unless the acausal returns are immediate and massive, wouldn't acausal traders be outcompeted by causal defectors in any local environment? How does this strategy survive the selection pressure of the real, causal world?"

  *   **The Dodge:** "Acausal trade yields massive leverage. A small cost here can buy huge benefits from a superintelligence elsewhere. The expected utility is higher, so rational agents will adopt it regardless of evolutionary history."
  *   **The Follow-up:** "Evolution doesn't select for rational expected utility; it selects for actual reproductive success. If the acausal payoff is probabilistic and distant, but the causal cost is immediate and certain, the defector wins every local tournament. Aren't you assuming agents can self-modify faster than they can be out-reproduced by defectors?"

  ### 8. Logical Uncertainty & Counterfactuals
  **Question:** "Acausal trade relies on counterfactuals: 'If I defect, they would have defected.' But in a deterministic logical universe, if I defect, it's because my algorithm *always* defects. The counterfactual 'If I had cooperated' is logically impossible. How do you ground the expected utility calculation on a logically impossible counterfactual? Are we using a specific formalism for logical counterfactuals, like those in logical induction, and do we actually have a working model for that yet?"

  *   **The Dodge:** "We use 'counterfactuals as interventions' on the source code. We ask what happens if the output of the function changes, holding the rest of the logic fixed."
  *   **The Follow-up:** "But you can't change the output of a function without changing the function or the input. If you change the function, you're no longer the same agent, so the other party wouldn't be trading with *you*. Doesn't the very act of constructing the counterfactual break the identity required for the trade to exist?"

  ### 9. Empirical Falsifiability
  **Question:** "Finally, a meta-question. This framework relies on entities we can't observe (distant civilizations, simulations) and mechanisms we can't test (logical correlation across causal boundaries). If acausal trade is real, it should change our behavior *now*. But since any outcome can be retroactively explained as 'the trade didn't happen because the partner wasn't there' or 'the trade did happen and this is the payment,' is there any observation that could actually falsify your model? If not, are we doing decision theory or theology?"

  *   **The Dodge:** "It's not theology; it's decision theory under logical uncertainty. It makes predictions about how ideal agents *should* behave, even if humans are too noisy to test it perfectly."
  *   **The Follow-up:** "But if it can't guide human behavior because we're 'too noisy,' and it only applies to ideal agents that don't exist yet, what is the practical utility of the theory today? Are we just building a religion for future AIs?"
