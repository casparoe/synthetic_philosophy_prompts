      2.  **Point 1: Coherence $\neq$ Simple Goals.** (The "What" vs. The "How").
      3.  **Point 2: The Specification Nightmare.** (Goodhart's Law, edge cases).
      4.  **Point 3: The Corrigibility Paradox.** (Instrumental Convergence, Shutdown Problem).
      5.  **Backend Analogy:** Reframing the problem in dev terms.
      6.  **Conclusion:** Summary of why it's hard.

  8.  *(Final Polish)*: Ensure the distinction between "coherent behavior" and "aligned behavior" is sharp. Coherence just means "not shooting yourself in the foot." Alignment means "shooting the right foot."

  9.  *(Wait, one more nuance)*: The user mentioned "converge on maximizing some fixed utility function." I need to mention that recent work (e.g., by Rohin Shah) suggests agents might not converge to *goal-directed* behavior at all, or might have mesa-optimizers. But keep it simple. Stick to the standard instrumental convergence argument for now as it's the strongest counter to their corrigibility point.

  10. *(Final check on Corrigibility)*: Make sure to explain *why* it's a separate hard problem. It's not just "add a flag." It's fighting the mathematical pressure of the utility function itself.

