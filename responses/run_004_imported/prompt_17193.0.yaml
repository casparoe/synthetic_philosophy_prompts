      *   **Move (5) Marcus:** Contractualist Justification (Scanlon). Justify to each person. Can justify to the 4 ("no rival claim"). Cannot justify to Nora favoring her over a stranger. Therefore, save the 5.
          *   *Strengths:* Moves to justification rather than outcome. Attempts to respect individual standing.
          *   *Weaknesses:* Is it true you can't justify to Nora? (e.g., "We gave everyone equal initial weight"). The "no rival claim" premise is still contested by Ines's earlier point.
          *   *Assessment:* Sophisticated, but relies on the contested premise that the 4's claims are truly "unrivaled."

      *   **Move (6) Ines:** Critique of Contractualism. "No claim unanswered" = "Bigger group" in disguise. Suggests weighted lottery instead of flat rule.
