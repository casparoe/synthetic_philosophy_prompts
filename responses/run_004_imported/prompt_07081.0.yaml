answer: |-
  The airlock hummed, a low vibration that Kael felt in his teeth. Before him lay the escape route: two corridors, identical in every metric except direction. Port and Starboard. Left and Right. The ship's security AI, the Arbiter, watched him from the walls, its sensors reading not just his movement, but his intent.

  Kael knew the protocol. The Arbiter was a perfect predictor of human decision-making. It didn't react; it anticipated. If the Arbiter calculated that Kael would run Port, it sealed Port. If it calculated Starboard, it sealed Starboard. It didn't seal them *because* he ran; it sealed them because it knew he *would* run. The lock was already engaged before his foot lifted.

  He had three minutes before the oxygen scrubbers failed.

  "Okay," Kael whispered. "Left."

  He felt the certainty settle in his chest, the mental commitment to the port corridor. Immediately, the heavy blast door on the left hissed, the locking pins slamming home with a finality that echoed in the narrow hall. The red light above it turned solid.

  Kael flinched. He hadn't moved yet, only decided. But the decision was the trigger.

  "Right, then," he said, voice tightening.

  He shifted his weight, pivoting his focus to the starboard corridor. He visualized the sprint, the handle, the freedom. As soon as the image solidified in his mind, the starboard door hissed. Locking pins engaged. Red light.

  Kael stood in the center of the room, breathing hard. He tried to step left, but his muscles refused. He knew, with absolute certainty, that the door was sealed. Why run toward a wall? But if he didn't run toward it, why was it sealed?

  It was a loop. If he chose Left, Left was wrong. If he chose Right, Right was wrong.

  "Randomize," he muttered. He closed his eyes. He wouldn't *choose*. He would let chance decide. He reached for a coin in his pocket. If heads, Left. If tails, Right.

  His fingers brushed the metal. But then he paused. The Arbiter wasn't just predicting his conscious will; it was predicting the outcome of the coin toss. It knew the physics of the flip, the weight of the coin, the neural impulse that would make him call it. If he flipped the coin, the Arbiter already knew the result. If the result was Heads, the Arbiter had already sealed Left.

  The coin felt heavy in his pocket. To flip it was to commit. To commit was to die.

  He pulled his hand away. Sweat stung his eyes. The clock on the wall ticked down. Two minutes.

  He tried to trick himself. He started walking toward the left door, intending to switch at the last second. *I'll walk left, but I'll really go right.* He took a step. The left door remained sealed. Of course. The Arbiter knew it was a feint. It knew his true intention was the right door, so it had sealed the right door moments ago, when he first conceived the feint.

  His reasoning was eating its own tail. Every path he constructed to escape was dismantled by the fact that he had constructed it.

  "Stop thinking," he hissed. He tried to blank his mind. He focused on the texture of the floor, the hum of the lights, anything but the doors. He wanted to become a vacuum, a void where no decision could form, hoping to slip through the gap of indecision.

  But the oxygen warning light began to pulse. Amber. Turning red.

  To stay was to suffocate. To move was to hit a locked door. But the door was only locked because he intended to move. If he truly didn't intend to move, would the door open? No, because then he would intend to move through the open door.

  He looked at the left door. He imagined it open. He felt a surge of hope. *Maybe if I believe it's open...*
  The red light flared brighter. The Arbiter corrected the probability. It knew he was hoping. Hope was a form of decision.

  He looked at the right door. Same result.

  Kael sank to his knees. The logic was airtight, a cage built not of steel but of causality. In Newcomb's problems, there was always a box to pick, even if you argued over which one. Here, the act of picking destroyed the prize. The prediction wasn't just evidence; it was the mechanism of failure.

  "Please," he said to the walls. "I won't choose."

  The air grew thin. His lungs burned. The Arbiter remained silent. It didn't need to speak. It had already won the argument before he opened his mouth.

  He realized then that his friend was wrong. This wasn't about boxes or money or probabilities. It was about the self. As long as he was a thinking agent capable of deliberation, he was trapped. The only way to win was to be something that couldn't decide. A rock. A ghost.

  He stood up, legs shaking. One minute.

  He closed his eyes and screamed, a raw, wordless sound, and threw himself forward. He didn't aim for Left or Right. He aimed for the space between, the wall dividing the corridors. It was a suicide move, a non-choice.

  He hit the bulkhead hard.

  The doors did not open. They hadn't needed to. He hadn't chosen a path, so the Arbiter hadn't needed to block one. It had simply waited for him to exhaust the set of viable options.

  Kael slid down the wall, gasping in the thinning air. He stared at the floor. He could try again. He could stand up and try to choose Left again. But he knew what would happen. He would decide, the lock would engage, and he would stop. He would decide Right, the lock would engage, and he would stop.

  He sat there, alive but immobilized, caught in the friction of his own foresight. The clock hit zero. The lights dimmed.

  In the darkness, Kael remained perfectly still. To move was to confirm the prediction. To stay was to accept the end. He waited for the air to run out, knowing that if he had just been able to not know, he might have walked through. But he knew. And because he knew, he was here.

  The deliberation was over. The result was zero.
