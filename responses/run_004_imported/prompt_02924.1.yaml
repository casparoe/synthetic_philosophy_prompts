answer: |-
  **Setting:** *A shaded veranda in Mithilā, circa 11th century. The air is thick with humidity and the scent of sandalwood. Two scholars sit on woven grass mats. On the left, **Nyāyaraksita**, a Naiyāyika, clutching a palm-leaf manuscript of the *Nyāyasūtra*. On the right, **Pramāṇavādin**, a Buddhist logician in the lineage of Dharmakīrti, resting his hands on a copy of the *Pramāṇavārttika*.*

  **Nyāyaraksita:** You reduce everything to fire and smoke, Venerable One. Even the word of a teacher. You claim *śabda* (testimony) is merely a species of *anumāna* (inference). That when I hear a trustworthy man say, "There is a mango tree beyond the hill," I do not learn this from his words, but infer it. His statement is merely the *liṅga* (mark), like smoke, and the mango tree is the *sādhya* (probandum), like fire.

  **Pramāṇavādin:** Is it not so, Learned One? Consider the mechanics. To accept his statement, you must first know he is trustworthy. You observe that he is competent, that he is not a deceiver, and that he intends to speak the truth. These are the premises. From the presence of his reliable assertion, you infer the existence of the state of affairs he describes. Where is the independent *pramāṇa* here? It is inference through and through. The speaker is the sign; the fact is the thing signified.

  **Nyāyaraksita:** But consider the *experience* of understanding. When a child cries out, "Fire!", I do not pause to construct a syllogism. I do not think, "This child is generally reliable; therefore, fire exists." I leap immediately to the object. The cognition arises from the *connection of words* (*śabda-samsarga*), not from a mediating mark. If testimony were inference, there would be a temporal gap, a deliberation. There is none. The meaning flashes forth instantly (*pratibhā*).

  **Pramāṇavādin:** Ah, the appeal to phenomenology. But tell me, when you see smoke on a distant mountain, do you consciously recite, "Where there is smoke, there is fire"? No. The cognition of fire is immediate, yet you admit it is inference. Why? Because the *vyāpti* (pervasion) between smoke and fire has been internalized through prior observation. It operates swiftly, below the threshold of discursive thought. Similarly, the connection between "reliable speech" and "truth" has been internalized since infancy. The speed of the cognition does not negate its inferential structure.

  **Nyāyaraksita:** A clever move, but it fails to account for the structure of sentence meaning itself. In inference, the relation is between two distinct entities: smoke and fire. In testimony, the relation is between words that mutually qualify one another. For a sentence to yield knowledge, we require four conditions that have no parallel in inference: *ākāṅkṣā* (syntactic expectancy), *yogyatā* (semantic compatibility), *sannidhi* (temporal proximity), and *tātparya* (speaker's intention).

  Take *ākāṅkṣā*. If I say "cow," you wait. The word expects a verb. If I say "eats," you ask "what eats?" In inference, smoke does not "expect" fire in a syntactic sense. Smoke simply exists. Words demand completion; signs simply point. How can you reduce a structure of mutual expectancy to a unidirectional mark?

  **Pramāṇavādin:** You mistake the conditions for validity with the nature of the knowledge source. *Ākāṅkṣā* and *yogyatā* are merely filters to ensure the *liṅga* is genuine. If a man says, "He wets him with fire," you reject it due to *ayogyatā* (incompatibility). Why? Because you know fire does not wet. This is not different from seeing wet smoke and realizing it cannot be the sign of a dry fire. You are checking the sign against your background knowledge of causal powers.

  As for *tātparya* (intention), this is the crux. We infer the fact from the statement *only because* we infer the statement from the intention. The process is: I hear words → I infer the speaker intends to convey X → I infer the speaker is reliable → I infer X is the case. It is a chain of inferences, yes, but a chain nonetheless. To posit a separate *pramāṇa* just because the chain is short is ontological extravagance.

  **Nyāyaraksita:** Extravagance lies in forcing a square peg into a round hole! Let us press on the reliability itself. Your reduction hinges on establishing a *vyāpti* between "this speaker's assertion" and "the truth of the assertion." How is this *vyāpti* established? By repeated observation (*bhūyo-darśana*). I must have seen this speaker speak truly many times before.

  But consider this: I meet a stranger on the road. I have no history with him. He tells me, "The bridge ahead is broken." I turn back. I have not established a *vyāpti* with this man. I have no inductive base. If *śabda* were *anumāna*, I should be epistemically paralyzed until I verified his track record. Yet, I accept his word immediately. Why? Because *śabda* carries its own validity (*svataḥ prāmāṇya*) unless defeated by contradiction. We are hardwired to accept testimony as primary, not as a derivative conclusion.

  **Pramāṇavādin:** Now you touch the pragmatic heart of the matter. You say you accept the stranger without prior induction. I say you rely on a *general* induction regarding human speech. You have observed that, generally, humans speak to communicate what they take to be true, unless there are specific signs of deception (trembling voice, shifty eyes, known motive to lie).

  In the case of the stranger, you perform a *quick inference*: "This is a human utterance; there are no signs of deception; therefore, it is likely true." It is a probabilistic inference based on the default reliability of the species, not the individual. If the stranger turned out to be a joker, you would say you were misled. In inference, if the smoke is artificial fog, you are misled. The structure holds. You do not need a new *pramāṇa* to explain error; you simply explain it as a faulty sign.

  **Nyāyaraksita:** But the default status differs! In inference, the burden of proof is on the prover. I must prove the smoke is real smoke. In testimony, the burden of proof is on the doubter. If I tell you, "The King is coming," you accept it unless you have reason to doubt.

  Furthermore, consider the Vedas. Or, set aside theology if you wish, consider the testimony of experts in fields we cannot verify. A layman hears a doctor say, "This poison kills." The layman cannot infer the causal mechanism. He has no access to the *vyāpti* between poison and death. He accepts it solely on the word of the expert. If he must infer it, he must first infer the doctor's reliability. But to verify the doctor's reliability, he must verify the doctor's past claims about poison. But he cannot verify those without knowing about poison! It is circular. The only way out is to admit that the word of the expert *itself* generates the knowledge, without prior independent verification of the fact.

  **Pramāṇavādin:** You trap yourself in a circle of your own making. The layman does not need to verify the *fact* of the poison to verify the *reliability* of the doctor. He verifies the doctor through social markers: the degree on the wall, the endorsement of other doctors, the lack of patients dying in the waiting room. These are perceptible signs (*dṛṣṭa-liṅga*).

  You Nyāyayikas want *śabda* to be a magical window to reality, untouched by the machinery of causality. But words are sounds. They are produced by vocal cords and intention. They are effects. To know the cause (the fact) from the effect (the word) is the very definition of inference.

  And let us go deeper. What do words actually convey? You believe they convey positive universals (*sāmānya*) and relations in the external world. I say words function by *apoha*—exclusion. When I say "cow," I do not convey a real universal "cowness." I merely exclude "non-cows." This is a conceptual construction (*kalpanā*). Inference is also conceptual construction. Perception is the only *pramāṇa* that touches the unique particular (*svalakṣaṇa*). Since testimony deals with concepts and exclusions, it aligns perfectly with inference, which also deals with concepts. Both are removed from the raw real. Why grant testimony a higher status than inference when both are equally removed from the particular?

  **Nyāyaraksita:** Because inference moves from one known fact to another unknown fact. Testimony moves from *understanding* to *fact*. When I hear "cow," I grasp the meaning directly. I do not exclude non-cows consciously.

  But here is my final challenge to your reduction: The *novelty* of testimony. Inference can only reveal what is already connected in nature. If I know smoke and fire are connected, inference tells me about *this* fire. But testimony can reveal connections I could never infer. If a traveler returns from a distant land and says, "In that land, the grass is blue," I understand it. I could never infer this. There is no *vyāpti* between "distant land" and "blue grass."

  If testimony were inference, I could not understand a proposition that lies outside my web of causal inferences. Yet I can. I can understand "There is a mountain of gold" even if I have never seen gold mountains and have no reason to infer them. The words convey the *possibility* and the *content* directly. Inference is bound by the laws of nature known to the observer; testimony is bound only by the imagination of the speaker. This freedom shows that *śabda* operates on a different plane—it conveys *tātparya* (intended meaning), not just causal signs.

  **Pramāṇavādin:** You confuse the *content* of the knowledge with the *means* of acquiring it. Just because the content is novel does not mean the psychological process is not inferential.

  If the traveler says "blue grass," you accept it via inference: "This traveler is reliable; he says blue grass; therefore, blue grass." If you have no prior concept of blue grass, you form a new conceptual exclusion: "grass that is not non-blue."

  But I grant you this: The *range* of testimony is wider than inference. That is why language is so powerful. But power does not imply ontological distinctness. A lever lifts more than a hand, but both are mechanics.

  You cling to *śabda* as independent because you fear that if it becomes inference, the authority of the Vedas collapses. If the Veda is just inference, it can be challenged by counter-inference. You need it to be *apauruṣeya* (impersonal) and self-validating. I strip it of that armor. I say: Testimony is valid only insofar as the speaker is reliable. If the speaker is fallible, the inference is weak. This keeps you honest. It forces you to check the signs. Your *svataḥ prāmāṇya* makes you gullible; my reduction makes you critical.

  **Nyāyaraksita:** And my view makes society possible! If every utterance required a verification of the speaker's reliability before understanding, communication would halt. We trust first, verify later. That trust is not a conclusion; it is a precondition of learning. You treat the hearer as a logician constantly weighing evidence. I treat the hearer as a learner receiving a gift of knowledge.

  You reduce the word to smoke. I say the word is a vessel. Smoke tells you what is already there. A vessel brings you something from afar.

  **Pramāṇavādin:** And if the vessel is leaky? Then you must inspect the vessel. And how do you inspect it? By inference. We are back at the start.

  **Nyāyaraksita:** Then we are back at the start. You see a mechanism of signs; I see a flow of meaning.

  **Pramāṇavādin:** You see a flow; I see the current that drives it.

  *(Both scholars fall silent. The sun dips lower, casting long shadows across their manuscripts. Neither has yielded, for the gap between them is not merely logical, but metaphysical: one sees a world of real relations waiting to be named, the other sees a world of causal flux navigated by useful fictions.)*
