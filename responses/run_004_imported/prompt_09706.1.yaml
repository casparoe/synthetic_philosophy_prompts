prompt: |-
  I have been rereading David Lewis's Convention, the book that gave the first rigorous philosophical treatment of common knowledge — a notion that gets invoked casually, and often loosely, in rationalist writing on social norms and coordination. On Lewis's actual analysis, a convention is an equilibrium solution to a recurring coordination problem, sustained not by agreement or enforcement but by common knowledge that everyone conforms, expects others to conform, and prefers to conform given that others do — and it remains arbitrary, since some other regularity could have served just as well. Please describe the most important implications of this account for the unwritten norms that structure the forums and communities I follow (steelmanning, charitable interpretation, 'epistemic status' disclaimers, norms against ad hominem). In particular, what does Lewis's framework imply about how such conventions arise without a founding agreement, and about when we should expect them to erode — say, as a community scales up quickly, absorbs newcomers who lack the relevant common knowledge, or attracts participants who never shared the underlying preference to conform?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Source Material:** David Lewis's *Convention: A Philosophical Study* (1969).
      *   **Key Concept:** Convention as a coordination equilibrium sustained by common knowledge (of conformity, expectations, and preferences), which is arbitrary (alternative regularities could have worked).
      *   **Target Application:** Unwritten norms in rationalist/epistemic online communities (steelmanning, charitable interpretation, epistemic status disclaimers, norms against ad hominem).
      *   **Specific Questions:**
          1.  How do these conventions arise without founding agreement?
          2.  When/why do they erode (scaling, newcomers, preference misalignment)?
      *   **Tone:** Philosophical rigor applied to practical social dynamics (matching the user's engagement with Lewis).

  2.  **Deconstruct Lewis's Account of Convention:**
      *   *Coordination Problem:* A situation where agents have a common interest in coordinating their actions (e.g., driving on the right vs. left).
      *   *Equilibrium:* A set of actions where no one benefits from deviating unilaterally.
      *   *Arbitrariness:* There is at least one other possible equilibrium that would have worked just as well (e.g., driving on the left).
      *   *Common Knowledge:* Everyone conforms, everyone expects everyone to conform, everyone prefers to conform *given* that others conform. This recursive knowledge is crucial.
      *   *Precedence/Salience:* How do we pick one equilibrium over the other? Past success (precedence) or natural prominence (salience).

  3.  **Apply to Online Community Norms (The "Target"):**
      *   *Norms:* Steelmanning, charity, epistemic status, no ad hominem.
      *   *Are they Conventions?*
          *   *Coordination Problem:* Yes. Communication breaks down without shared rules of engagement. Everyone benefits from high-signal discourse.
          *   *Equilibrium:* If everyone steelmans, I benefit from steelmanning. If everyone attacks ad hominem, I might benefit from attacking ad hominem (defensively or offensively).
          *   *Arbitrariness:* Could we have chosen different norms? Yes. Maybe "strict literalism" instead of "charity." Maybe "no disclaimers" instead of "epistemic status." The specific form matters less than the *shared* form.
          *   *Common Knowledge:* Crucial. I must know that you know that I know we are steelmanning.

  4.  **Address Question 1: Emergence without Founding Agreement:**
      *   Lewis explicitly rejects the idea of a social contract or explicit promise.
      *   *Mechanism:* Precedence and Salience.
      *   *Application:* Early adopters (founders) model behavior. It works (solves the coordination problem of "how to talk without fighting"). Success creates precedent. Newcomers see the precedent, infer the expectation, and conform to coordinate.
      *   *Key Lewisian term:* "Salience." The behavior stands out as the obvious solution because it's what worked before.

  5.  **Address Question 2: Erosion and Stability:**
      *   *Scaling/Newcomers:* Common knowledge is fragile. It requires a recursive chain ("I know that you know..."). If new users don't know the norm, the chain breaks. If I don't know if *you* know the norm, I might defect (e.g., stop steelmanning because I expect you to attack me).
      *   *Preference Misalignment:* Lewis requires a *conditional preference* to conform. If a group enters that *prefers* conflict (trolls, political polarizers), the equilibrium collapses. It's no longer a coordination problem; it becomes a Prisoner's Dilemma or zero-sum game.
      *   *Ambiguity of Arbitrariness:* If the norm feels "natural" rather than "arbitrary," people fight harder when it changes. But if it's recognized as arbitrary, switching costs are lower *if* coordination can be re-established.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the depth of the prompt. Validate the Lewisian framework. State the thesis: These norms are fragile coordination equilibria, not moral imperatives.
      *   *Section 1: The Nature of the Norms as Conventions.*
          *   Define them as coordination equilibria.
          *   Highlight *Arbitrariness*. Steelmanning isn't "true," it's useful *if everyone does it*.
          *   Highlight *Common Knowledge*. It's not enough to be nice; we must know we are all trying to be nice.
      *   *Section 2: Emergence (No Social Contract).*
          *   Lewis vs. Hobbes/Rousseau. No promise needed.
          *   Role of *Precedence*. The first successful threads set the path.
          *   Role of *Salience*. Certain behaviors stand out as solutions to noise.
      *   *Section 3: Erosion and Fragility.*
          *   *The Common Knowledge Breakdown:* Scaling dilutes the "everyone knows" factor. Heterogeneity of knowledge.
          *   *Preference Shift:* The conditional preference ("I prefer to be charitable *if* you are") is key. If new users prefer dominance/engagement-bait, the equilibrium fails.
          *   *The "Bad" Equilibrium:* Ad hominem is also an equilibrium. Once the good one slips, the bad one is stable too.
      *   *Section 4: Strategic Implications.*
          *   Don't moralize (it's not morality, it's coordination).
          *   Signal common knowledge explicitly (meta-posts, FAQs).
          *   Manage salience for newcomers.
      *   *Conclusion:* Summarize. The norms are tools for coordination, vulnerable to information asymmetry and preference divergence.

  7.  **Refining the Lewisian Nuance:**
      *   *Correction:* Make sure not to confuse "common knowledge" with "mutual knowledge." Lewis is strict about the recursion.
      *   *Correction:* Emphasize the *conditional preference*. This is often overlooked. I don't prefer to steelman in a vacuum; I prefer it *given that you do*.
      *   *Correction:* Ensure the distinction between a convention and a moral rule is clear. Lewis's point is that conventions are *arbitrary*. If we all agreed to shout insults as a signal of "I am engaging seriously," that could theoretically be a convention (though unlikely due to external costs). The point is the *coordination*, not the content.

  8.  **Final Polish:** Check tone. Ensure it sounds like it respects the user's familiarity with the text. Use Lewisian terminology (equilibrium, arbitrary, precedence, salience, conditional preference).

      *(Self-Correction during drafting)*: I initially thought about mentioning game theory broadly. I need to pull it back to *Lewis specifically*. Lewis was reacting against Wittgenstein and Quine. He wanted to ground meaning and social order in rational choice + common knowledge. I should keep the focus on the *epistemic* state of the community members regarding the norms.

      *Specific focus on "Epistemic Status" disclaimers:* This is a perfect example of a Lewisian convention. It's arbitrary (we could use colors, or tags, or nothing). It only works if everyone knows what "Provisional" means and expects others to treat it that way.

      *Specific focus on "Steelmanning":* This is a coordination equilibrium. If I steelman and you strawman, I lose. If we both strawman, we fight. If we both steelman, we learn.

      *Erosion:* The "Common Knowledge" aspect is the most vulnerable to scaling. In a small group, I see you conforming. In a large group, I rely on heuristics. If the heuristics fail, the common knowledge degrades to mere mutual knowledge or ignorance, leading to defection.

  9.  **Final Review against Prompt:**
      *   Describe implications for unwritten norms? Yes.
      *   How they arise without agreement? Yes (Precedence/Salience).
      *   When they erode (scaling, newcomers, preferences)? Yes (Common knowledge breakdown, preference mismatch).

      *Ready to write.*
answer: |-
  David Lewis's *Convention* provides a remarkably sharp lens for analyzing the unwritten norms of epistemic communities (like the rationalist sphere, LessWrong, or specific academic subfields). By treating norms like steelmanning, charitable interpretation, and epistemic disclaimers not as moral imperatives but as **coordination equilibria**, Lewis's framework shifts the diagnostic focus from "Are people being good?" to "Do people share the necessary knowledge and preferences to sustain this equilibrium?"

  Here are the most important implications of Lewis's account for the norms you follow, specifically regarding their emergence and their fragility.

  ### 1. The Norms as Arbitrary Coordination Equilibria
  The most immediate implication of Lewis's account is that **these norms are arbitrary.** This does not mean they are random or worthless, but that their specific content is not dictated by logic or morality alone.

  *   **The Equilibrium:** Steelmanning is a coordination equilibrium. If everyone else steelmans, you prefer to steelman (because your arguments will be engaged with seriously). If everyone else strawmans, you may prefer to strawman (to defend yourself against misrepresentation). Both "Universal Steelmanning" and "Universal Strawmanning" are stable equilibria.
  *   **The Arbitrariness:** We could have coordinated on a different set of signals. Instead of "Epistemic Status: Speculation," we could have used a color-coded system, or a specific prefix, or nothing at all provided we all intuitively understood the tone. The value lies in the *commonality* of the signal, not the signal itself.
  *   **Implication:** When community members treat these norms as moral truths ("It is *wrong* to ad hominem") rather than coordination conventions ("We *coordinate* on no ad hominem to maximize signal"), they misunderstand the mechanism of enforcement. Moralizing adds friction; recognizing arbitrariness allows for easier recalibration if the convention ceases to serve its function.

  ### 2. Emergence Without Founding Agreement
  Lewis explicitly argues against the idea that conventions require a promise, a contract, or a founding meeting. This explains how high-trust norms can emerge in decentralized forums without a central authority.

  *   **Precedence and Salience:** Conventions arise through **precedence**. In the early days of a community, a few influential users (founders or early adopters) model a behavior (e.g., editing posts to note updates). This behavior solves a recurring coordination problem (how to handle changing information without confusing readers). Because it worked, it becomes **salient**.
  *   **Inference, not Instruction:** Newcomers do not need to be told the rule. They observe the regularity. They infer that others expect the regularity to continue. They conform because they prefer to conform *given that others do*.
  *   **Implication:** You cannot "legislate" a convention into existence by writing a FAQ. A FAQ is merely a description. The convention only exists when users conform *because* they expect others to conform. If you have to force the norm via moderation, it is not yet a Lewisian convention; it is a law. True conventions are self-enforcing because deviation is individually costly (you lose the benefit of coordination).

  ### 3. The Fragility of Common Knowledge
  The core engine of a Lewisian convention is **common knowledge**. It is not enough that everyone conforms (mutual knowledge). It must be that:
  1.  Everyone conforms.
  2.  Everyone expects everyone to conform.
  3.  Everyone knows that everyone knows this.
  4.  (And so on, recursively).

  This recursive structure is the primary point of failure when a community scales.

  *   **Scaling and Dilution:** In a small forum, I see your post history; I know you know the norms. In a scaled community, I interact with strangers. I no longer have direct evidence that *they* know the norms. The common knowledge degrades into uncertainty. If I am unsure whether you know the norm against ad hominem, I may preemptively attack to defend myself, triggering a cascade of defection.
  *   **The "Newcomer" Problem:** Newcomers lack the "precedence" data. If they enter a space where the common knowledge is not made explicit (via salient signals like pinned posts, automated prompts, or highly visible meta-discussion), they cannot infer the equilibrium. They act on the norms of their previous communities (e.g., Twitter or Reddit), which may be different equilibria.
  *   **Implication:** To preserve conventions during scaling, the community must artificially reconstruct common knowledge. This explains the utility of "Epistemic Status" tags or "Read the FAQ" prompts. These are not just rules; they are **common knowledge generators**. They publicly signal, "I know the norm, and I know that you see that I know the norm."

  ### 4. Preference Alignment and the "Conditional Preference"
  Lewis defines a convention as sustained by a **conditional preference**: I prefer to conform *on the condition that* others conform. This is the critical vulnerability regarding participant composition.

  *   **Preference Mismatch:** Lewis's framework assumes a coordination problem (we all want to coordinate). However, if a community attracts participants who prefer *conflict* (trolls, ideologues seeking dominance rather than truth), the game structure changes. It is no longer a coordination problem; it becomes a Prisoner's Dilemma or a zero-sum game.
  *   **The Collapse:** If a significant minority prefers to defect (e.g., they gain status by aggressive debating rather than charitable interpretation), the conditional preference of the cooperators breaks. I no longer prefer to steelman *given that you attack me*. The equilibrium collapses.
  *   **Implication:** You cannot sustain a convention merely by hoping for the best. You must manage the **preference distribution** of the community. This justifies strict moderation or cultural gating not as "censorship" but as "equilibrium maintenance." If the proportion of agents who prefer the coordination equilibrium drops below a critical threshold, the convention will phase-shift to a lower-trust equilibrium (e.g., universal cynicism).

  ### 5. Erosion and Phase Shifts
  Lewis notes that conventions are stable but not immutable. They erode when the common knowledge is disrupted or when the payoff structure changes.

  *   **The "Bad" Equilibrium:** A community norm against ad hominem is stable, but so is a norm *of* ad hominem. Once the "good" convention erodes (due to scaling or preference mismatch), the community does not become chaotic; it settles into the "bad" equilibrium. Hostility becomes the new convention. Everyone attacks because everyone expects to be attacked.
  *   **Re-coordination Costs:** Because conventions are arbitrary, switching back is hard. It requires a coordinated shift in expectations. This explains why "culture wars" in online communities are so difficult to resolve. It requires a critical mass of users to simultaneously signal a return to the old equilibrium, re-establishing the common knowledge that "we are doing charity again."
  *   **Implication:** When norms erode, appealing to the *content* of the norm ("Please be nice") is less effective than appealing to the *coordination* ("We are losing the benefit of our shared language"). Restoring a convention requires making the expectation of conformity salient again.

  ### Summary of Strategic Implications
  If you view your community's norms through Lewis's framework, your strategy for maintaining them changes:

  1.  **Don't Moralize, Coordinate:** Frame norms as tools for mutual benefit, not moral virtues. "We steelman so we can learn," not "Steelmanning is righteous."
  2.  **Make Common Knowledge Explicit:** In a scaled environment, you cannot rely on osmosis. Use meta-posts, tags, and public signaling to ensure everyone knows that everyone knows the rules.
  3.  **Guard the Preference Pool:** Recognize that the convention relies on a majority sharing the conditional preference to conform. Filter for users who value the coordination benefit (truth-seeking) over those who value defection (status-seeking).
  4.  **Expect Arbitrariness:** Be willing to update the *form* of the convention (e.g., changing how disclaimers work) if it stops serving the coordination function, provided the *fact* of coordination is maintained.

  Lewis teaches us that these norms are not fragile flowers that need protection from the elements; they are sturdy structures that rely on a specific architecture of belief. When the architecture of **common knowledge** cracks, the structure falls, regardless of how "right" the norms are.
