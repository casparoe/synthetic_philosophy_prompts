      *(Self-Correction on IIT technicality)*: I need to be careful. IIT 3.0/4.0 emphasizes the *spatiotemporal grain*. The "unfolding" argument is a classic objection. The IIT response is usually that the unfolded system is a *different* physical substrate with different causal powers *at the relevant timescale*. I need to make sure Elena articulates *why* the timescale matters intrinsically.

