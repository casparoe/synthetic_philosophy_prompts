prompt: |-
  I'm taking a seminar on early modern political philosophy, and next week's guest speaker is a Spinoza scholar who argues that his political theory is more thoroughly democratic than the surviving text of the Tractatus Politicus suggests. Her claim is that, since political right tracks power for Spinoza, and nothing in the Ethics grounds an inequality of rational power between the sexes, the argument for excluding women from citizenship in the treatise's final chapter -- offered only shortly before the manuscript breaks off unfinished -- is a lapse rather than where his own system leads. Draft eight to ten interview questions that go beyond having her restate this thesis: I want at least one on whether "right equals power" can underwrite any normative preference for democracy at all, rather than just describing whatever distribution of power happens to hold; one on what licenses reading an incomplete argument as an inconsistency rather than as the theory's actual, unwelcome conclusion; and one comparing the brief, confident praise of democracy in the Theological-Political Treatise with the far more cautious, restrictive treatment in the Tractatus Politicus. For each, add a short follow-up keyed to the answer she's most likely to give.
