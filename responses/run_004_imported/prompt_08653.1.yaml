      *   **Heterogeneous Priors (Agree to disagree):**
          *   *Argument:* Agents don't start with the same prior beliefs.
          *   *Weight:* High theoretically, but controversial. If priors are too heterogeneous, anything goes. But realistically, people just interpret data differently due to models/experience. It's a big driver of speculative volume.
          *   *Tier:* A. It's essential for speculative trade among professionals who aren't just hedging.

      *   **Grossman-Stiglitz (Costly Information):**
          *   *Argument:* Prices can't be fully informative because then no one would acquire information.
          *   *Weight:* Medium-High. It explains *why* information acquisition happens, but doesn't fully solve the no-trade theorem on its own without noise traders to hide behind. It's more about the equilibrium level of information than the existence of trade per se.
          *   *Tier:* B. It's a condition for information gathering, but needs noise to allow trade.

