          *   *Tier:* S or A. Let's put it in S because without noise/behavioral bias, liquidity traders alone might not sustain *speculative* volume at observed levels. Actually, liquidity hedging is the *reason* trade happens, but noise/overconfidence is why *speculative* volume happens. The prompt asks about "market volume" generally. Liquidity hedging is fundamental. Noise/behavior is fundamental to the *excess* volume. Let's group them or rank them high.
