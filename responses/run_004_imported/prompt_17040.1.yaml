          *   Focus on *coordination costs* and *information security*.
          *   Bayesian translation: The prior $P(H)$ is penalized based on the number of conspirators ($N$) and duration ($T$).
          *   Keeley's contribution: CTs often treat "errant data" (noise) as signal, which breaks standard likelihood evaluation.
      *   **Section 2: The Steelman of Particularism (The Content-Neutral View).**
          *   Not "JFK was definitely a conspiracy."
          *   Focus on *historical reality*: Conspiracies happen (Watergate, Tuskegee, MKUltra).
          *   Bayesian translation: The label "conspiracy theory" conveys zero information about $P(H)$. Only specific parameters ($N, T, Motivation$) matter.
          *   Pigden's contribution: Calling it a "conspiracy theory" is a rhetorical move to dismiss, not an epistemic categorization.
      *   **Section 3: The Bayesian Synthesis (Resolving the Crux).**
