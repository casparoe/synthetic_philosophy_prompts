answer: |-
  You have correctly identified that the internet debate has flattened a genuine philosophical dispute into a caricature. You are also right about Keeley: reading the 1999 paper ("Of Conspiracy Theories") reveals he isn't arguing that conspiracies *never* happen, but rather that the *mode of reasoning* typical of conspiracy theories is epistemically unwarranted. Pigden's critique is that this mode of reasoning isn't unique to conspiracy theories; it's found in standard historical inquiry too.

  To resolve this without the "vibes," we need to move to the Bayesian framework you requested. The core disagreement is about **how to set the Prior Probability $P(H)$** and **how to evaluate the Likelihood Ratio $P(E|H) / P(E|\neg H)$**.

  Here is the steelman of both positions, cashed out in Bayesian terms, followed by a resolution on whether a "generic prior discount" is principled or prejudicial.

  ---

  ### 1. The Steelman Generalist Position (The Structural/Complexity View)

  **The Claim:** The class of hypotheses labeled "conspiracy theories" shares structural features that inherently lower their prior probability and corrupt the likelihood evaluation.

  **The Bayesian Cash-Out:**
  The Generalist does not argue $P(\text{Conspiracy}) = 0$. They argue that hypotheses falling into the cultural category of "Conspiracy Theory" typically possess specific structural parameters that mathematically depress $P(H)$.

  *   **The Conjunctive Penalty:** A conspiracy hypothesis usually requires a long chain of conjunctive events to be true.
      *   $H_{conspiracy} = (\text{Motive}) \land (\text{Coordination}) \land (\text{Execution}) \land (\text{Secrecy})$.
      *   In probability theory, $P(A \land B) \leq P(A)$. As you add necessary conditions (especially "Secrecy over time"), the prior probability drops multiplicatively.
      *   Official narratives often rely on *disjunctive* or chaotic explanations (e.g., "incompetence OR bad luck OR individual rogue action"). $P(A \lor B) \geq P(A)$.
      *   **Generalist Heuristic:** Because "Conspiracy Theories" generally posit high-$N$ (number of conspirators) and high-$T$ (time duration) coordination, they incur a massive **Complexity Penalty** on the prior $P(H)$.

  *   **The Likelihood Corruption (Keeley's Point):** Keeley argues that conspiracy theories treat "errant data" (missing evidence, contradictions) as confirmation (e.g., "The lack of evidence proves how well they covered it up").
      *   In Bayesian terms, this makes the hypothesis unfalsifiable. If $P(E|H) \approx 1$ for *all* evidence $E$ (both presence and absence), then the Likelihood Ratio approaches 1.
      *   If the Likelihood Ratio is 1, the Posterior $P(H|E)$ never updates away from the Prior.
      *   **Generalist Heuristic:** If a hypothesis is structured to swallow disconfirming evidence, it is immune to Bayesian updating. Therefore, it is rational to assign it a near-zero prior to prevent wasting computational resources on a hypothesis that cannot be tested.

  **Summary:** The Generalist says, "We discount the class 'Conspiracy Theory' not because conspiracies are impossible, but because this class correlates with high conjunctive complexity and unfalsifiable evidence-handling."

  ### 2. The Steelman Particularist Position (The Content-Neutral View)

  **The Claim:** There is no epistemic distinction between a "conspiracy hypothesis" and any other historical hypothesis. The label "conspiracy theory" is a pejorative social tag, not an epistemic category.

  **The Bayesian Cash-Out:**
  The Particularist argues that the Prior $P(H)$ must be derived *solely* from the specific mechanics of the event, not the classification of the hypothesis.

  *   **Base Rate Neglect:** We know conspiracies happen. Watergate, Iran-Contra, the Tuskegee Syphilis Study, MKUltra.
      *   Therefore, the Base Rate of "Successful Conspiracies" is non-zero.
      *   To assign a generic discount to the class "Conspiracy Theory" is to ignore the Base Rate of actual historical conspiracies in favor of a stereotype.
      *   **Particularist Rule:** $P(H)$ should be calculated based on specific parameters: $N$ (number of people), $M$ (motive strength), and $C$ (counter-intelligence capability). If $N$ is small and $M$ is high (e.g., "Three guys planned 9/11"), the prior should be high, regardless of whether the media calls it a "conspiracy theory."

  *   **Symmetry of Evidence:** Pigden argues that "official stories" often rely on the same epistemic moves as conspiracy theories (trusting authorities, ignoring anomalies).
      *   If we penalize $H_{conspiracy}$ for relying on "secret knowledge," we must penalize $H_{official}$ for relying on "trusted testimony."
      *   **Particularist Rule:** The Likelihood Ratio must be evaluated on the evidence $E$ itself, not on the *source* of the claim. If the physical evidence points to a second gunman, $P(H_{conspiracy}|E)$ rises, regardless of the "conspiracy" label.

  **Summary:** The Particularist says, "The label 'Conspiracy Theory' conveys zero information about $P(H)$. Only the specific causal mechanics matter. Discounting based on the label is prejudice masquerading as skepticism."

  ---

  ### 3. Resolution: Is a Generic Prior Discount Principled?

  You asked if there is a principled way to justify a generic prior discount without it collapsing into prejudice.

  **The Answer:** Yes, but only if you distinguish between a **Conspiracy Hypothesis** and a **Conspiracy Theory**.

  This is the equivocation that causes the ACX comment threads to explode.
  1.  **Conspiracy Hypothesis:** A claim that a specific event was caused by secret coordination (e.g., "Watergate was a conspiracy").
  2.  **Conspiracy Theory:** A sociological phenomenon involving a community of belief that exhibits specific epistemic vices (e.g., "The Truther movement").

  **The Principled Discount (The Synthesis):**
  You are justified in applying a prior discount **not to the content (the conspiracy), but to the process (the theory generation).**

  Here is how you cash that out Bayesianly without being prejudiced:

  #### A. The "Selection Effect" Prior
  When someone presents a claim as a "Conspiracy Theory" in the modern cultural sense, they are usually selecting from a distribution of hypotheses that have *already survived* a filter of motivated reasoning.
  *   **Hypothesis Space:** Imagine all possible historical explanations for an event.
  *   **Selection Bias:** "Conspiracy Theories" are the subset of hypotheses that have been amplified by communities that reward belief despite low evidence.
  *   **The Adjustment:** If you know a hypothesis comes from a community that treats "lack of evidence" as "evidence of cover-up" (Keeley's errant data), you must downgrade the reliability of the *testimony* presenting the evidence.
  *   **Bayesian Update:** This doesn't lower $P(H)$ directly; it lowers the weight of the evidence $E$ provided by the proponents. If the source of $E$ is known to interpret $\neg E$ as $E$, then $P(E|\text{Source})$ is unreliable. You must discount the Likelihood Ratio provided by that source.

  #### B. The Coordination Cost Function
  You can justify a lower prior for "Conspiracy Hypotheses" *relative to* "Incompetence Hypotheses" using **Hanlon's Razor as a Complexity Penalty.**
  *   **Scenario:** A government program fails catastrophically.
  *   **H1 (Conspiracy):** 50 people coordinated to sabotage it and kept quiet for 5 years.
  *   **H2 (Incompetence):** 50 people made independent errors, or the system was flawed.
  *   **Math:** H1 requires $P(\text{Coordination}) \times P(\text{Secrecy})$. H2 requires only $P(\text{Error})$.
  *   Since $P(\text{Secrecy})$ decreases exponentially with $N$ (number of people), H1 will almost always have a lower prior than H2 *for large N*.
  *   **Principle:** It is principled to discount hypotheses that require high-fidelity coordination among many actors, *because coordination is physically harder than chaos.* This isn't prejudice against conspiracies; it's a penalty for complexity.

  ### 4. Which Position is More Defensible?

  **Particularism is epistemologically correct; Generalism is heuristically useful.**

  *   **Particularism wins on Truth:** If you want to find the actual truth about JFK or Watergate, you must be a Particularist. You cannot dismiss the hypothesis *a priori*. You must look at the ballistics, the documents, and the witness testimony. If the evidence is strong, the "conspiracy" label is irrelevant. Pigden is right: dismissing a claim *because* it is a conspiracy theory is an ad hominem fallacy against the hypothesis type.
  *   **Generalism wins on Error Management:** In a world of limited cognitive bandwidth, we cannot investigate every claim Particularistically. We need heuristics. Keeley is right that the *social phenomenon* of "Conspiracy Theories" correlates strongly with unfalsifiability and motivated reasoning.
      *   If a hypothesis is presented with the *rhetorical structure* of a Conspiracy Theory (secret knowledge, malevolent intent, errant data as proof), it is rational to assign it a low prior **until** it provides standard evidence.
      *   This is not prejudice; it is **Model Comparison.** You are comparing the "Historical Inquiry Model" vs. the "Conspiracy Theory Model." The latter has a track record of producing false positives.

  ### The Verdict

  To answer your specific crux: **Yes, there is a principled way to justify a generic prior discount, provided you define the discount correctly.**

  Do not discount the claim because it posits a **conspiracy**.
  Discount the claim because it posits **high-complexity coordination** AND is being promoted via **epistemically unreliable mechanisms** (errant data, unfalsifiability).

  **The Bayesian Rule of Thumb:**
  1.  **Calculate the Base Prior** based on coordination costs ($N$ agents, $T$ time). If $N > 20$ and $T > 1$ year, apply a steep complexity penalty. (This handles the "hard part" of conspiracies).
  2.  **Evaluate the Evidence Source.** If the evidence is presented with "Conspiracy Theory" rhetoric (e.g., "They don't want you to know"), downgrade the reliability of the testimony. (This handles Keeley's "unwarrantedness").
  3.  **Remain Particularist on Physical Evidence.** If there is hard physical evidence (ballistics, financial records), the "Conspiracy Theory" label vanishes. It becomes just a "Theory."

  **Conclusion:** The Generalists are right that "Conspiracy Theories" (as a social category) are usually false. The Particularists are right that "Conspiracy Hypotheses" (as a causal category) are sometimes true. The confusion arises because we use the same phrase for both.

  If your friends round down to zero because of the *label*, they are being prejudiced (violating Particularism).
  If they refuse to penalize the *complexity* of the claim, they are being naive (violating Generalism).

  The defensible position is **Particularism regarding the evidence, Generalism regarding the epistemic process.** Judge the ballistics on their own merits, but heavily discount the testimony of anyone who claims the lack of ballistics proves the conspiracy.
