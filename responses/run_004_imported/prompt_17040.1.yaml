          *   Generalism is correct about *heuristics* (the label correlates with structural improbability).
          *   The "Principled Discount" is actually a **Complexity Penalty** + **Motivated Reasoning Adjustment**.
          *   Final advice: Don't discount the *claim*, discount the *process* that generated the claim.

  7.  **Review and Refine:**
