          *   **The "Conjunctive Penalty":** A conspiracy requires $A \land B \land C \dots$ (Coordination + Secrecy + Competence). Official stories often require $A \lor B$ (Incompetence OR Chaos). Conjunctive probabilities are always lower.
      *   **Section 4: Conclusion/Verdict.**
