answer: |-
  This is a classic collision between **idealized Bayesian epistemology** and **bounded human rationality**, wrapped in a very specific social dynamic that I recognize well from those circles.

  Your friend is technically correct about the axioms of probability theory, but he is likely wrong about what constitutes a "rationality failure" for a human being in your context. More importantly, he may be making a category error about what your markets were actually measuring.

  Here is the breakdown of who is right, why the "Logical Omniscience" problem matters here, and the principled distinction you're looking for.

  ### 1. The Logical Omniscience Problem
  Your friend is citing a standard tenet of formal Bayesianism: if proposition $A$ is logically equivalent to proposition $B$, then a rational agent must assign $P(A) = P(B)$. If you don't, you are "incoherent," and a Dutch Book (a set of bets guaranteeing your loss) can be constructed against you.

  However, this requirement assumes **Logical Omniscience**. It assumes the agent instantly knows all logical consequences of their beliefs. No human satisfies this. If we did, we wouldn't need to do math; we would just look at a complex equation and know the answer immediately.

  In the literature on bounded rationality (e.g., work by Daniel Kahneman, Herbert Simon, or rationalist-adjacent writers like Scott Alexander), it is widely accepted that **computational cost is a valid constraint.**
  *   **Ex-ante (before the write-up):** You did not know the puzzles were isomorphic. Calculating that isomorphism required non-trivial work. Assigning different probabilities based on heuristic "flavor" (framing effects) was a rational use of limited computational resources. You were pricing based on *perceived difficulty*, which is the relevant variable for "will the group solve this?"
  *   **Ex-post (after the write-up):** Once the isomorphism was demonstrated, the computational cost dropped to zero. At *that* point, maintaining the split would be a rationality failure.

  **Verdict:** You did not make an epistemic mistake *at the time*. You made a calculation that was expensive to perform. Your friend is holding you to a standard that applies to gods, not people.

  ### 2. The Category Error: Logic vs. Psychology
  There is a deeper flaw in your friend's argument that goes beyond bounded rationality. Look closely at what the markets were resolving:
  *   **Market A:** "The group solves the Knight/Knave puzzle."
  *   **Market B:** "The group solves the Monk/Ash puzzle."

  Your friend argues these are the same event because the *logic* of the puzzles is identical. **They are not the same event.** The event is **human performance**, not logical truth.

  Human cognition is susceptible to **framing effects**. It is an empirical fact that people solve isomorphic problems at different rates depending on how they are framed.
  *   The "Monk/Ash" story might trigger spatial or visual intuition.
  *   The "Knight/Knave" story might trigger verbal or adversarial processing.

  Even if the underlying logic is identical, the *cognitive load* required for your specific friend group to access that logic might differ. Therefore, an 80% probability for one and a 35% for the other could be **empirically accurate**, even if they are **logically isomorphic**.

  If your friend had taken the other side of that bet (betting that the probabilities should converge), he might have actually *lost* play money, because the group might have genuinely found one easier than the other due to psychological framing. By claiming a "guaranteed" loss for you, he is assuming the group are perfect logic engines. They aren't; they're humans reading puzzle books.

  ### 3. The Principled Distinction
  You asked for a principled way to distinguish "epistemic mistake" from "haven't finished the math." Here is the framework:

  **A. Accessibility of the Computation**
  *   **Unfinished Math:** The logical equivalence requires non-trivial derivation that was not immediately available to you. The "distance" between your current state and the truth is computationally costly.
  *   **Epistemic Mistake:** The logical equivalence was trivial or already known, and you ignored it due to bias, laziness, or emotional attachment.
  *   *In your case:* The equivalence was hidden until the "sharpest guy" worked it out on paper. This classifies as "Unfinished Math."

  **B. Update Policy**
  *   **Rational Bounded Agent:** "I priced them differently because I didn't see the link. Now that I see the link, I will update my model to treat them as correlated, though I still allow for framing effects."
  *   **Irrational Agent:** "I know they are the same now, but I'm sticking with my 80/35 split because I don't want to admit I was wrong."
  *   *In your case:* As long as you update now, your prior was fine.

  **C. The Object of Prediction**
  *   **Logical Truth:** If the market was "Is statement X true?", then $P(A)$ must equal $P(B)$ if $A \iff B$.
  *   **Human Behavior:** If the market is "Will humans solve X?", then $P(A)$ can $\neq P(B)$ even if $A \iff B$, because human brains are not logic gates.
  *   *In your case:* You were predicting human behavior. Your friend treated it as a market on logical truth.

  ### 4. How to Handle the Friend
  Your friend is exhibiting a common pathology in rationalist communities: **Mistaking the Map for the Territory.** He is prioritizing internal coherence (the map) over external accuracy (the territory).

  *   **Coherence** (having probabilities that don't contradict each other) is useful because it prevents you from being Dutch Booked.
  *   **Calibration** (having probabilities that match reality) is useful because it lets you predict the future.

  Sometimes, pursuing perfect coherence *costs* calibration. If you spend 10 hours proving two puzzles are isomorphic to align your probabilities, but that time cost prevents you from gathering more data on your friends' solving habits, you have become more coherent but less accurate.

  **The Takeaway:**
  Tell him this: *"You are right that a logically omniscient agent would have priced them identically. But I am not logically omniscient, and neither is our friend group. I was pricing cognitive friction, not logical depth. The fact that you had to write out a proof to show they were the same proves that the cognitive friction was real. If the equivalence wasn't obvious, the difficulty wasn't identical."*

  You didn't fail a rationality test. You successfully modeled the fact that your friends find "Monk" puzzles easier than "Knight" puzzles, even if a mathematician knows they are the same. That's not a bug; it's a feature of modeling humans.

  **Summary:**
  1.  **He is theoretically right, practically wrong.** Standard Bayes requires logical omniscience; humans don't have it.
  2.  **The markets measured psychology, not logic.** Framing effects justify different probabilities for isomorphic problems when the resolver is a human brain.
  3.  **The distinction is computational cost.** If the equivalence wasn't obvious, the split was a valid reflection of uncertainty, not a coherence failure.
  4.  **Don't let him Dutch Book you.** But also, acknowledge that now that you *know*, you should treat them as highly correlated in the future. That's the only update required.
