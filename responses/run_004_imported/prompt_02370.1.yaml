      *   *Wait, check the market definition again:* "make Manifold-style play-money markets out of... 'the group gets the right answer'".
      *   *Friend's Claim:* "guaranteed to loose me money... just from the gap between my 80 and my 35."
      *   *How?* If I bet YES on Monks (80%) and NO on Knights (65% implied), do I lose?
          *   If the puzzles are logically identical, the group either solves both or neither (assuming perfect logic).
          *   If they solve both: Monks YES wins, Knights NO loses.
          *   If they solve neither: Monks YES loses, Knights NO wins.
          *   This isn't a Dutch Book in the strict sense (guaranteed loss regardless of outcome). It's an arbitrage *if* the outcomes are perfectly correlated.
