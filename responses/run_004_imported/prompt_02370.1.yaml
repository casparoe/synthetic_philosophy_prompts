              *   Solve Neither: He wins Monks No, loses Knights Yes.
          *   Actually, if the probabilities sum to > 100% across mutually exclusive outcomes, it's a Dutch Book. Here the outcomes are the *same event* described differently.
          *   If Event A = Event B, and P(A) = 0.8, P(B) = 0.35.
          *   I should buy A (at 0.8) and sell B (at 0.35)? No, I should buy the underpriced and sell the overpriced.
          *   Buy B at 0.35, Sell A at 0.8.
          *   If A happens (and thus B happens): Buy B wins, Sell A loses.
