answer: |-
  To argue against Dummett's quarantine thesis is not to claim that the *Begriffsschrift* logically entails the expulsion of Jews, nor is it to suggest that Frege's logical insights are false because his moral character was flawed. That would be a genetic fallacy Dummett rightly avoids. Rather, the argument for continuity rests on a structural isomorphism between Frege's *method of justification* in logic and his *method of justification* in politics. The claim is that the philosophical architecture Frege constructed to secure the objectivity of truth against the threat of psychologism relies on exclusionary mechanisms that, when transposed from the epistemological register to the political register, reproduce the authoritarianism of the 1924 diary.

  The continuity lies in three specific doctrinal moves: the ontological demotion of the subjective, the horror of contingency, and the normative stratification of access.

  ### 1. The Ontological Demotion of the Subjective (*Vorstellung* vs. *Gedanke*)

  In "Der Gedanke," Frege's primary adversary is not error, but *privacy*. He distinguishes sharply between a *Gedanke* (thought), which is objective and communicable, and a *Vorstellung* (idea/mental image), which is private, owned by a specific consciousness, and incommunicable. Frege argues that if thoughts were *Vorstellungen*, logic would collapse into psychology; my truth would not be yours. To save logic, Frege must evict the thinking subject from the content of thought. The subject becomes a mere vessel, a "grasper" of thoughts that exist independently of them.

  In the 1924 diary, we see this same ontological demotion applied to the citizen. Frege treats the democratic voter not as a constituent of the state's authority, but as a bearer of private, subjective interests (*Vorstellungen* in the political sense). The "will of the people" is, for Frege, merely an aggregation of private psychological states—mutable, irrational, and particular. Just as the *Gedanke* cannot be grounded in the mental life of the logician, the *State* (which Frege views as an objective, enduring entity) cannot be grounded in the mental life of the electorate.

  The continuity here is the **delegitimization of the subjective standpoint as a source of normativity**. In logic, the fact that a thinker *feels* a proposition is true is irrelevant to its truth. In politics, the fact that a citizen *wills* a law is irrelevant to its legitimacy. Dummett treats this as a category error (logic is one thing, politics another), but for Frege, both are domains of *law* (logical law and civil law). If the justification for logical law requires stripping authority from the individual mind, it creates a philosophical habit of mind that seeks to strip authority from the individual will in the political sphere. The "objective" State, like the "objective" Thought, must stand over and against the subject, not emerge from it.

  ### 2. The Horror of Contingency and the Threat of Relativism

  In the preface to the *Grundlagen*, Frege's attack on psychologism is driven by a specific fear: relativism. He writes that if logic were based on human psychology, "we would have to ask what would happen if the constitution of human intellect were to change." If logic depends on us, it is contingent. Frege's Platonism is a fortress built to protect necessity from the threat of biological or historical accident.

  The diary entries reveal that Frege's political authoritarianism is driven by the exact same horror of contingency. He views universal suffrage and parliamentary debate as mechanisms that make law contingent on the shifting moods, demographics, and "alien" influences of the moment. He writes of the need to protect the German *Volk* from being "diluted" or swayed by interests that do not align with its "true" nature.

  The doctrinal link is the **rejection of procedural legitimacy in favor of substantive truth**. In a democratic framework, a law is legitimate because of the procedure by which it was enacted (the vote). In Frege's logic, a proposition is true not because it is agreed upon, but because it corresponds to the objective structure of the third realm. Frege's politics rejects the procedural legitimacy of democracy for the same reason he rejects the procedural legitimacy of consensus in logic: both allow truth/authority to be held hostage to the "contingent mental constitution" of the majority.

  If one accepts Frege's argument that logical laws cannot be voted on or altered by human convention without ceasing to be logical laws, one is philosophically primed to accept that political laws should not be voted on or altered by human convention if they are to be *true* laws of the State. The diary's proposal to restrict suffrage is not merely prejudice; it is an attempt to insulate political authority from the "psychologistic" contamination of the ballot box, mirroring the insulation of logic from the contamination of empirical psychology.

  ### 3. The Normative Stratification of Access (Competence and Exclusion)

  This is the most critical point of continuity. Frege's anti-psychologism is not egalitarian. While thoughts are objective, they are not equally accessible to all. In "Der Gedanke," Frege notes that thoughts are graspable only by a "properly functioning mind." There is a normative standard of rationality. Those who cannot grasp the thought (due to error, confusion, or incapacity) are excluded from the realm of logical agency. They are not makers of truth; they are failed graspers of it.

  In the diary, Frege explicitly translates this epistemic hierarchy into a political hierarchy. He argues for a property qualification for voting and for the exclusion of Jews from political rights. His justification is not merely racial animus in a vacuum; it is framed as a question of *capacity* and *allegiance to the objective whole*. He views certain groups as incapable of grasping the "true" interests of the German state, just as the psychologist is incapable of grasping the true nature of the thought.

  The doctrine doing the work here is the **conflation of exclusion with purification**. For Frege, logic is purified by excluding the psychological. The State, analogously, must be purified by excluding the "alien" (which he codes as psychological/particularistic). The argument is that if truth is objective, then access to the governance of truth (or the state that embodies it) must be restricted to those capable of recognizing it.

  Dummett wants to say that Frege's logical exclusion (of the psychological) is benign, while his political exclusion (of Jews) is malignant. But structurally, they rely on the same mechanism: the identification of a "foreign body" that threatens the integrity of the system. In logic, the foreign body is the *Vorstellung*; in politics, it is the Jew (whom Frege characterizes as rootless, internationalist, and thus incapable of allegiance to the objective national entity). The philosophical move that allows Frege to say "The mental image is not part of the Thought" is the same move that allows him to say "The Jewish citizen is not part of the *Volk*." Both are moves to excise the particular to save the universal.

  ### Conclusion

  Dummett's quarantine fails because it assumes that Frege's logic is a neutral tool that happens to be held by a bigot. The stronger claim is that Frege's logic is *constituted* by a specific stance toward the subject—one of deep suspicion, requiring the subject's removal from the seat of authority to preserve the purity of the law.

  The continuity is not that Frege applied his logic to politics, but that he applied a single **meta-philosophical commitment** to both domains: that objectivity requires the suppression of the subjective, that necessity requires the elimination of contingency, and that purity requires the exclusion of the alien. The 1924 diary is not a lapse in Frege's rationality; it is the political shadow cast by his epistemology. To embrace Frege's anti-psychologism is to embrace a worldview where the "objective" is always purchased at the price of the "human," and where the protection of truth is indistinguishable from the policing of access. We cannot have the "Third Realm" without accepting the logic of exclusion that builds its borders.
