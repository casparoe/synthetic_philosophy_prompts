answer: |-
  This is an exceptionally sharp reading of Hobbes. You have identified the structural spine of his entire philosophical system. The short answer is: **yes, these commitments are deeply connected.** They are not merely adjacent doctrines; the materialist ontology is the *condition of possibility* for his specific claim about geometric certainty, and that same epistemological model is the explicit blueprint for his political philosophy.

  To understand why Hobbes dug his heels in against Wallis (and why he thought he could replicate geometric certainty in politics), we have to look at his theory of **knowledge as causal generation.**

  ### 1. Materialism as the Ground of Geometric Certainty

  You noted that Hobbes treated a point as a body of disregarded size and a line as a thin body. Standard histories of mathematics often treat this as a quaint error or a failure to grasp abstraction. However, in the context of Hobbes's system (*De Corpore*), this is a necessary ontological move.

  For Hobbes, **to know something is to know its cause.** We cannot have "science" (certain knowledge) of things whose causes we do not control or understand.
  *   **The Problem with Abstraction:** If a geometric point were a truly dimensionless, incorporeal abstraction (as in Platonism or later analytic geometry), how do we interact with it? For a materialist, knowledge begins with sense, which is motion imparted by external bodies to our internal organs. An incorporeal point cannot move or be moved. It falls outside the causal chain.
  *   **The Constructivist Solution:** Hobbes argues we have certainty in geometry specifically because **we generate the objects.** We do not discover a circle in nature; we define it by the motion of a compass (or the mind conceiving that motion). Because we stipulate the generation (the cause), we can be certain of the properties (the effect).

  Here is where the materialism does the work: For the "generation" to be real, it must be a **motion of a body.** If the line being drawn were not a body (even a conceptualized one), it could not be generated by motion. Therefore, redefining points and lines as "bodily" is what allows geometry to remain a science of *causes*. If he accepted Wallis's more abstract, algebraic, or infinitesimal approach, he would be admitting that valid reasoning can occur outside the realm of body and motion. That would collapse his entire materialist ontology.

  So, the stubbornness against Wallis was not just ego; it was a defense of the idea that **valid reasoning must track physical (or quasi-physical) generation.** Wallis represented a shift toward symbolic algebra and infinitesimals, which Hobbes viewed as "mystical" because they manipulated symbols without clear reference to generable bodies.

  ### 2. The Bridge to Political Philosophy

  Does this same reasoning explain his ambition for politics? Absolutely. Hobbes explicitly models his political science on this geometric-constructivist method.

  In *De Cive* and *Leviathan*, Hobbes is not trying to describe how states *have* historically arisen (that would be prudence or history, not science). He is trying to demonstrate how a state *must* be constructed to achieve a specific end (peace), just as a geometer demonstrates how a square must be constructed to have equal sides.

  The analogy works like this:

  | **Geometry** | **Political Philosophy** |
  | :--- | :--- |
  | **Object:** Figures (Circles, Squares) | **Object:** The Commonwealth (Leviathan) |
  | **Constituent:** Points and Lines (Bodies in motion) | **Constituent:** Human Beings (Bodies in motion) |
  | **Motion:** Simple local motion | **Motion:** Passions/Appetites (Internal motion) |
  | **Method:** We define/generate the figure | **Method:** We define/generate the Covenant |
  | **Certainty:** Derived from knowing the cause (construction) | **Certainty:** Derived from knowing the cause (human nature + contract) |

  **The Materialist Link:**
  For this analogy to hold, human beings must be compatible with geometric objects. If humans had immortal souls or free will in a libertarian sense (uncaused motion), they could not be part of a deterministic science. But because Hobbes defines humans as **complex bodies in motion**, driven by appetites and aversions (which are themselves internal motions), they become susceptible to the same kind of causal analysis as geometric figures.

  When Hobbes claims he can bring certainty to politics, he means that if we accept his definitions of human nature (the "elements") and the mechanism of the Social Contract (the "construction"), the conclusions (the obligations to the Sovereign) follow as necessarily as the properties of a triangle. We have certainty because, like the geometer, **we are the makers of the object.** The Sovereign's authority is not discovered in nature; it is *constructed* by the agreement of the subjects.

  ### 3. Why the Dispute with Wallis Matters for Politics

  This brings us back to the Wallis dispute. If Hobbes had conceded to Wallis, he would have implicitly accepted that mathematical truth can exist independently of material generation.

  If mathematical truth can be independent of material generation, then **political truth might also be independent of human construction.** This would open the door to the very ideas Hobbes fought against:
  *   That authority comes from God directly (Divine Right), not from the "construction" of the people.
  *   That there are abstract moral truths (Incorporeal Substances) that bind the Sovereign, rather than the Sovereign defining justice by fiat.

  By insisting that geometry is about bodies and generation, Hobbes protects the idea that **authority is artificial and constructed.** Just as a circle has no properties until it is generated by a motion, a Commonwealth has no justice or authority until it is generated by the Covenant.

  ### 4. Where the Analogy Strains

  While the *logic* is connected, you might ask if the *execution* holds. Most philosophers argue that Hobbes's political geometry fails where his actual geometry failed.

  1.  **Complexity of Motion:** In geometry, the "bodies" (points/lines) are passive and simple. In politics, the "bodies" (humans) have their own internal centers of motion (passions) that resist the construction. Hobbes tries to account for this with his laws of nature, but the "friction" is much higher than in Euclid.
  2.  **The Definition Problem:** In geometry, Hobbes controls the definitions. In politics, he cannot force people to accept his definition of "human nature." If his premises about human psychology are wrong, the geometric certainty of the conclusion collapses.
  3.  **The Wallis Verdict:** History sided with Wallis. Mathematics moved toward the abstract and the infinitesimal (calculus). By extension, political philosophy largely moved away from Hobbes's rigid deductive materialism toward empiricism (Locke) or idealism (Hegel/Kant).

  ### Summary

  Your intuition is correct. Hobbes's materialism is not a separate quirk; it is the engine of his epistemology.
  1.  **Materialism** ensures that all objects of knowledge are bodies in motion.
  2.  **Geometry** is certain because we physically/mentally **generate** these bodies, giving us knowledge of their cause.
  3.  **Politics** can be certain because the State is an **Artificial Man**, constructed by us via covenant, making its properties deducible from its construction.

  His refusal to concede to Wallis was a refusal to allow "incorporeal substance" back into the temple of science. If he allowed dimensionless points, he risked allowing incorporeal souls or divine rights to undermine the absolute, constructed authority of the Leviathan. The stubbornness was philosophical consistency, even if the mathematics was wrong.
