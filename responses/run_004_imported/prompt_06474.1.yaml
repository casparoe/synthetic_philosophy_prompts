answer: |-
  **Title:** The Rational Fool and the Infinite Scroll: Why Revealed Preference Fails as a Theory of the Self

  **Introduction**

  It is a specific kind of modern humiliation to have your self-concept dismantled by a screen time report. You identify as a reader; the data identifies you as a scroller. When you brought this dissonance to your partner, she reached for the standard tool of neoclassical economics: Revealed Preference Theory (RPT). Her argument was sharp and technically sound within her discipline: *You chose Instagram. Therefore, you preferred Instagram. To say otherwise is cheap talk.*

  This verdict feels brutal because it collapses the distance between who you are and what you do. It suggests that your regret is meaningless, and your identity as a "reader" is a lie.

  However, while your partner is correct about how economists *model* choice, she is incorrect about what choice *means* for human welfare. Revealed Preference Theory was never designed to handle akrasia, addiction, or the engineering of attention. It is a theory of consistency, not a theory of the soul.

  To settle this, we must look under the hood of the theory itself. We need to understand why Paul Samuelson built it, why Amartya Sen tried to dismantle it, and why modern behavioral economics has largely conceded that "what you choose" and "what is good for you" can come violently apart.

  **The Samuelson Move: Purging Psychology from Economics**

  To understand why your partner argues the way she does, you have to understand the enemy Paul Samuelson was fighting in 1938. Before Samuelson, economics was bogged down in "cardinal utility." Economists tried to measure satisfaction in hypothetical units (utils), assuming people were hedonic calculators maximizing pleasure. This was unobservable and unscientific.

  Samuelson's *Foundations of Economic Analysis* proposed a behaviorist revolution. He argued that economics should not care about what happens inside the "black box" of the mind. It should only care about input (prices/income) and output (choice).

  This gave us the Weak Axiom of Revealed Preference (WARP). Simply put: If you choose Bundle A when Bundle B is available and affordable, you have revealed a preference for A over B. If you later choose B when A is available, you are not "complex"; you are *inconsistent*. For the model to work, the agent must be transitive and stable.

  The power of RPT is that it makes economics predictive. If we assume you are consistent, we can draw demand curves. But notice what was sacrificed to buy this predictive power: **Psychological realism.** Samuelson didn't claim RPT was a true description of human happiness. He claimed it was a useful assumption for predicting market behavior. Your partner is treating a modeling assumption as an ontological truth. She is confusing the map for the territory.

  **The Rational Fool: Sen's Critique**

  The most devastating critique of RPT comes from Nobel laureate Amartya Sen, specifically in his 1977 paper *Rational Fools*. Sen argued that RPT creates a "social moron"—an agent who has no ability to commit to values that contradict their immediate impulses.

  Sen distinguished between *sympathy* (where my welfare depends on yours) and *commitment* (where I choose something that lowers my immediate utility because it aligns with a principle). If a person votes in a rainstorm, RPT says they "preferred" voting to staying dry. But if you ask them, they might say, "I hated standing in the rain, but I had a duty to vote."

  RPT has no room for duty, identity, or commitment. It flattens all motivation into a single dimension of "choice." When you say "I am a reader," you are expressing a commitment to a certain kind of self. When you scroll Instagram, you are succumbing to a local impulse. RPT sees two choices and says, "You like scrolling more." Sen would say, "You are a complex agent capable of violating your own preferences for the sake of a higher-order value."

  By ignoring this, RPT cannot distinguish between a choice made out of genuine desire and a choice made out of weakness. It renders the concept of "regret" impossible, because if you chose it, you must have wanted it. This is obviously absurd in the face of addiction.

  **The Time Problem: Hyperbolic Discounting and the Divided Self**

  This brings us to the specific mechanism of your Instagram problem. Standard RPT assumes a single, stable agent existing through time. But behavioral economics (specifically the work on hyperbolic discounting) shows that we are effectively multiple agents: the "Planning Self" (who wants to read) and the "Impulsive Self" (who wants to scroll).

  The Planning Self sets preferences for the long term. The Impulsive Self hijacks the controls in the short term. When the Impulsive Self clicks the icon, it reveals a preference *for that moment*, but it violates the preference of the Planning Self *for the day*.

  Your partner's argument assumes a unified utility function. But addiction and algorithmic manipulation are designed specifically to exploit the gap between these selves. Instagram engineers do not care about your "revealed preference" in the economic sense; they care about hijacking your dopamine system to override your higher-order preferences.

  If a theory of preference cannot distinguish between a choice made in full autonomy and a choice made under the influence of a variable-ratio reinforcement schedule (a slot machine in your pocket), it is useless for assessing welfare. It treats the heroin addict's choice to use as identical to the gourmet's choice to eat. Technically, both are choices. Morally and psychologically, they are not.

  **Decision Utility vs. Experienced Utility**

  Finally, we must address the distinction made by Daniel Kahneman between *Decision Utility* (the weight assigned to an option at the moment of choice) and *Experienced Utility* (the actual pleasure or pain derived from the outcome).

  RPT only measures Decision Utility. It assumes that if you choose it, you will enjoy it. But the "wrecked" feeling you described is evidence that your Decision Utility (clicking the app) and your Experienced Utility (feeling empty afterward) have diverged.

  Neuroeconomics shows that the brain systems responsible for *wanting* (dopaminergic prediction error) are distinct from the systems responsible for *liking* (opioid hedonic hotspots). You can "want" to scroll (high decision utility) while "liking" it very little (low experienced utility). RPT conflates wanting and liking. If you are using RPT to determine what makes you happy, you are using a ruler to measure temperature. It is the wrong instrument.

  **The Verdict**

  So, who wins the argument?

  Your partner is right that Revealed Preference is the bedrock of **positive economics**. If she wants to predict how you will respond to a price change in Instagram ads, RPT is the tool. It prevents us from making excuses for inconsistent behavior. It forces us to admit that, in the moment of choice, the scroll won.

  But she is wrong that RPT is a valid theory of **normative welfare**. It cannot tell us what is *good* for you, only what you *did*.

  **The Verdict:** Revealed Preference Theory is **fine as a modeling device for market behavior, but hopeless as a theory of human well-being.**

  It is not "cheap talk" to say you value reading more than scrolling. That statement is a report on your *meta-preferences*—your preferences about your preferences. It is the Planning Self speaking. The Screen Time report is a record of the Impulsive Self's victories.

  The fact that these two data points conflict does not mean you are a hypocrite. It means you are a human being living in an environment engineered to exploit the gap between choice and welfare. RPT was built in 1938 to model the purchase of wheat and steel. It was not built to model a human mind fighting a supercomputer designed to break its will.

  Tell your partner this: She is applying a theory of *consistency* to a problem of *conflict*. You aren't violating WARP; you are living through a civil war between your higher and lower selves. The Screen Time report didn't reveal your utility function; it revealed your vulnerability. And acknowledging that is the first step to fixing it, not the last.
