answer: |-
  Your friend from the writing group is right. This is not just a random trivia point; it is one of the most famous questions in the history of philosophy and neuroscience.

  It is called **Molyneux's Problem**.

  Proposed by William Molyneux to John Locke in 1688, the exact question was: If a man born blind learns to distinguish a cube from a sphere by touch, and then suddenly gains sight, can he distinguish them by sight alone *before* touching them?

  For centuries, philosophers argued about it. But in the last 15 years, science has finally given us an answer thanks to medical advancements (like Project Prakash in India) that restore sight to children and adults born with dense cataracts.

  **The verdict:** **No, she would not know immediately.**

  Here is the breakdown of why, and how you can use this to make your scene infinitely more powerful.

  ### The Science: Why "Obviously Yes" is Wrong
  Your gut instinct is that an object is an object, regardless of the sense used. But vision is not just a camera recording data; it is a language the brain has to learn to speak.

  1.  **Cross-Modal Mapping:** Elena has a rich library of "tactile data" (sharp, smooth, corner, curve) and now she has a new library of "visual data" (shadows, highlights, color gradients, edges). Her brain has no dictionary to translate between them yet. She knows what a cube *feels* like, but she has no idea what a cube *looks* like.
  2.  **Depth Perception:** Sighted people perceive 3D shape through subtle cues: shadows, binocular disparity (the difference between what each eye sees), and micro-movements of the head. A newly sighted person often perceives the world as flat, like a painting. A cube might look like a hexagon or a collection of trapezoids until she moves her head.
  3.  **Sensory Overload:** In case studies (such as the famous case of Virat Singh or Mike May), patients describe the initial experience of sight as overwhelming and confusing. Light is painful; edges are blurry; distinguishing an object from the background is difficult.

  ### How to Write the Scene
  If you write her looking at the objects and instantly saying, "That's the cube," it will feel like magic to readers who know the science, and it misses a massive opportunity for emotional depth.

  Here is how to write it so it feels true to life:

  #### 1. Describe the Visuals as Abstract, Not Concrete
  Don't describe the objects as "a cube" and "a ball." Describe them as Elena perceives them.
  *   **The Ball:** A patch of light with a darkening edge. A circle that doesn't look round, but looks like a flat disc with a shadow.
  *   **The Cube:** Confusing angles. Sharp contrasts where the light hits the facets. It might look like several separate shapes rather than one object.
  *   **The Environment:** The table might not look like a surface she can put things on; it might look like a vertical wall of color until she touches it.

  #### 2. The Struggle is the Story
  The drama of this scene isn't *what* the objects are; it's the disconnect between her internal knowledge and her external perception.
  *   **Hesitation:** She should hesitate. She might guess wrong.
  *   **Frustration:** She knows she *should* know. This is infuriating for a competent adult character.
  *   **The Workaround:** Sighted people unconsciously move their heads to gauge depth. Elena won't know to do this. Maybe the person testing her has to prompt her: "Move your head, Elena. Look at the shadows."

  #### 3. The "Aha" Moment (Delayed Gratification)
  You don't have to leave her unable to see forever. The learning curve is actually very steep. Once the brain makes the first connection, it happens fast.
  *   **The Bridge:** She might reach out (breaking the "no touching" rule) to tap the object. The moment her finger feels the corner *while* her eye sees the sharp shadow, the connection snaps into place.
  *   **The Realization:** The magic isn't seeing the cube; it's the moment the brain realizes *that patch of light = that sharp feeling.*

  ### Example Drafting Concept
  > The doctor placed them on the white table. "Tell me," he said. "Which is the sphere?"
  >
  > Elena stared. The world was a bombardment of glare. There were no objects, only intrusions of color. To her left, a patch of brownish shadow with a soft, darkening rim. To her right, a jagged interruption of light, harsh angles cutting into the white.
  >
  > She knew the weight of them. She knew the grain of the wood. But this? This was a painting. Flat. Silent.
  >
  > "I don't know," she whispered. The shame burned hotter than the light. "They're both just... shapes."
  >
  > "Look at the shadows, Elena."
  >
  > She leaned in. The jagged one had hard lines where the light broke. The other... as she shifted her head, the dark rim on the brown patch shifted too. It curved. It wasn't a flat circle. It was turning.
  >
  > Her hand twitched, desperate to reach out, to confirm. She clenched it instead.
  >
  > "The one on the left," she said, her voice trembling. "It's the ball. Because the shadow... it bends."
  >
  > She was guessing. But for the first time, it was a visual guess.

  ### Why This is Better for Your Book
  1.  **Respect:** It respects the reality of disability and medical science, which adds weight to your world-building.
  2.  **Tension:** Instant success is boring. Struggle creates tension.
  3.  **Theme:** It reinforces the theme that perception is learned, not just given. It highlights that Elena is entering a new culture (the sighted world) where she is, initially, illiterate.

  ### Resources for Research
  If you want to dig deeper into the sensory experience, look into:
  *   **Project Prakash:** A real-world scientific study that tested Molyneux's Problem on children.
  *   **"An Anthropologist on Mars" by Oliver Sacks:** Specifically the chapter "To See and Not See," which details the case of Virat Singh.
  *   **"Touching the Rock" by John Hull:** A profound memoir by a theologian who went blind later in life, offering the reverse perspective (how the visual world fades).

  **Summary:** Your friend is right. Use the confusion. It makes Elena's journey more human, more difficult, and ultimately more triumphant when she *does* learn to bridge the gap.
