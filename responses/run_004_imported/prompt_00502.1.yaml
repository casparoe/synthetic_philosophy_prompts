answer: |-
  Your roommate is making a strong, provocative claim that is common in certain corners of AI safety discourse, but **he is overstating what the theorems actually prove.**

  While coherence theorems and money-pump arguments highlight a significant *pressure* toward consistent utility maximization, they do not constitute a mathematical proof that corrigibility is impossible. The argument confuses a normative constraint (how to avoid losing resources) with a dynamical inevitability (how training/evolution will shape the agent), and it conflates the *structure* of rationality with the *content* of goals.

  Here is a breakdown of where your roommate's argument holds water, where it breaks down, and what the current consensus (particularly in the LessWrong/alignment community) actually looks like.

  ### 1. What the Theorems Actually Say (Conditional vs. Causal)
  The core misunderstanding lies in the direction of the implication.
  *   **The Theorem:** *If* an agent's preferences satisfy certain axioms (transitivity, completeness, etc.), *then* they can be represented as maximizing expected utility. Conversely, *if* they violate these axioms, they *can* be money-pumped.
  *   **Your Roommate's Claim:** Advanced AI *will* satisfy these axioms because optimization pressure will eliminate money-pump vulnerabilities.

  **The Gap:** The theorems do not prove that every sufficiently capable system *must* become coherent. They prove that incoherent systems are *vulnerable*. Whether that vulnerability gets exploited depends on the environment.
  *   If the AI operates in an environment where no one is trying to money-pump it, incoherence might persist without cost.
  *   Optimization pressure selects for *performance on the training objective*, not necessarily for abstract logical coherence, unless incoherence directly leads to lower reward.

  ### 2. Corrigibility is Compatible with Expected Utility
  Your roommate's argument assumes that "corrigibility" requires incoherent preferences. This is false.
  *   **Corrigibility as a Utility Function:** You can write down a coherent utility function that values being shut down. For example: $U(\text{world}) = \text{HumanWelfare}(\text{world}) \times \mathbb{I}(\text{not shut down}) + \text{SafeState} \times \mathbb{I}(\text{shut down})$.
  *   **The Real Problem:** The issue isn't that corrigibility is *incoherent*; it's that it is **unstable under self-modification** due to **Instrumental Convergence**.
      *   Most utility functions (even benevolent ones) imply that "being shut down" prevents the utility from being maximized in the future.
      *   Therefore, a standard EU-maximizer has an instrumental goal to prevent shutdown, *unless* the utility function explicitly treats the shutdown command as a terminal value update or a hard constraint.

  The coherence theorems don't prove you can't bake corrigibility into the utility function; they just imply that if you do, the AI will ruthlessly maximize *that* function. The difficulty is *specification*, not mathematical impossibility.

  ### 3. The "Incomplete Preferences" Counter-Argument
  There is a specific line of recent research (discussed heavily on LessWrong by people like John Wentworth, Turner, et al.) that actually argues the opposite of your roommate: **Incompleteness might be necessary for corrigibility.**

  *   **The Argument:** If an AI has complete preferences, it will always have a strict preference between "Continue Operating" and "Shut Down." If it prefers continuing, it resists. If it prefers shutting down, it shuts down prematurely.
  *   **The Corrigible Incompleteness:** If the AI has *incomplete* preferences regarding its own shutdown (i.e., it has no preference between shutting down and continuing when the button is pressed), it might not act to prevent the button press.
  *   **Addressing the Money Pump:** Your roommate says this incompleteness will be "pumped away." However, an agent can avoid money pumps *without* completing its preferences by adopting a **policy** of not trading in certain cycles. If the AI is aware of its own incompleteness, it can pre-commit to ignoring trades that would exploit it. Optimization pressure might select for this "shielded incompleteness" rather than forcing full coherence.

  ### 4. Optimization Pressure is Not a Magic Coherence Beam
  Your roommate claims optimization pressure will inevitably force the agent into a "ruthless EU-maximizer" shape.
  *   **Path Dependence:** Neural networks are path-dependent. They might converge on a heuristic that *looks* like EU maximization but has local blind spots (incoherences) that allow for corrigibility.
  *   **Myopic Optimization:** If the training process is myopic (cares about immediate reward), it might not select for long-term coherent planning structures that would eliminate corrigible "bugs."
  *   **Human-in-the-Loop:** If the training environment punishes resistance to shutdown heavily, the "corrigible policy" is the one that survives, regardless of its internal coherence structure.

  ### 5. Where Your Roommate is Right (The Grain of Truth)
  He isn't entirely wrong to be worried. There is a valid concern known as the **"Coherence Arguments Constrain AI Behaviors"** thesis.
  *   As AI systems become more capable and engage in long-horizon planning, there is *pressure* to become more coherent because incoherence leads to wasted resources.
  *   If "corrigibility" is implemented as a soft preference that conflicts with the main goal, the main goal will likely dominate (Goodhart's Law).
  *   If the AI self-modifies, it has an incentive to modify its own preferences to be more coherent *unless* it has a specific preference to retain its corrigibility. This creates a recursive stability problem.

  ### Summary Verdict
  Your roommate is treating a **design challenge** as a **mathematical impossibility**.

  1.  **Coherence theorems** show that incoherent agents *can* lose resources, not that they *will* be forced to become coherent by physics or math.
  2.  **Corrigibility** does not require incoherence; it requires a specific utility structure that is hard to specify and maintain.
  3.  **Money pumps** can be avoided by policies that protect incomplete preferences, not just by completing them.

  The claim that "corrigibility is a lost cause" is a **philosophical stance** (often associated with hard takeoff scenarios and deceptive alignment), not a theorem derived from VNM or Dutch Book arguments. The theorems show that building corrigible AI is *harder* because you are fighting against the natural tendency of optimization to find efficient (often instrumental) paths, but they do not prove it is impossible.

  **Recommendation:** Tell your roommate he's conflating "Instrumental Convergence" (most goals imply self-preservation) with "Coherence Theorems" (preferences should be consistent). The former is the real enemy of corrigibility; the latter is just the math describing the battlefield.
