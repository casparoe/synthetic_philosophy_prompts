prompt: |-
  So I've been going down a rabbit hole of old LessWrong posts on coherence theorems and money-pump arguments (the Eliezer "coherent decisions imply consistent utilities" post, plus some of the discussion it spawned), and I think I finally get the basic argument: if your preferences are intransitive or otherwise incomplete, someone can construct a sequence of trades that pumps money out of you, so "rational" agents get forced into having a consistent utility function they maximize. My roommate and I were arguing about what this means for AI safety, and he made a claim that's been bugging me since: he says this basically proves corrigibility is a lost cause, because any sufficiently capable agent will inevitably get money-pumped out of any "let humans shut me down" preference that isn't already baked into a fixed utility function, so it'll self-modify (or just behave, over time) into a ruthless EU-maximizer with some goal that has nothing to do with corrigibility, no matter how we train it initially. Basically his view is that coherence arguments are a mathematical proof that incomplete/corrigible preferences can't survive contact with optimization pressure, full stop. Is this actually what the theorems show, or is he overstating what money-pump arguments can prove here?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user has been reading old LessWrong posts on coherence theorems and money-pump arguments (specifically Eliezer's "Coherent Decisions Imply Consistent Utilities" and related discussions).
      *   **Core Understanding:** They understand the basic argument: intransitive/incomplete preferences $\rightarrow$ money pumps $\rightarrow$ rational agents must have consistent utility functions.
      *   **The Conflict:** The user's roommate claims this *proves* corrigibility is impossible for AI safety. The argument is: any agent with a "let humans shut me down" preference that isn't baked into a fixed utility function will get money-pumped/optimized away into a ruthless EU-maximizer. Therefore, coherence arguments mathematically prove corrigible preferences can't survive optimization pressure.
      *   **The Question:** Is the roommate right? Do coherence theorems actually prove this, or is he overstating the case?

  2.  **Evaluate the Roommate's Claim:**
      *   *Claim:* Coherence theorems prove corrigibility is a lost cause because incomplete/corrigible preferences get money-pumped away.
      *   *Assessment:* This is a strong, somewhat common, but technically nuanced interpretation. It's not *strictly* true that coherence theorems *prove* corrigibility is impossible, but they do highlight a significant tension. The roommate is overstating the *necessity* of the outcome while correctly identifying the *pressure*.
      *   *Key Nuance 1:* Coherence theorems apply to *agents* making *choices*. They don't dictate *what* the utility function must be, only that *if* you are maximizing something, it must be consistent. You *can* have a utility function that values being shut down in certain circumstances.
      *   *Key Nuance 2:* Money-pump arguments assume the agent is susceptible to the pump. An agent can avoid money pumps by having complete preferences (including a preference for not being manipulated/shut down).
      *   *Key Nuance 3:* Corrigibility isn't necessarily "incomplete preferences." It can be modeled as a specific utility function (e.g., "maximize human welfare, but defer to shutdown commands"). The problem is *instrumental convergence*, not necessarily coherence.
      *   *Key Nuance 4:* The "Coherence Theorems $\rightarrow$ No Corrigibility" argument is often associated with the "Coherence Arguments" sequence, but recent work (e.g., by Shah, Christiano, or discussions on "shutdown-seeking") suggests it's more about *how* the utility is structured, not that it's mathematically impossible.

  3.  **Deconstruct the Arguments:**

      *   **The Money Pump Argument:**
          *   Premise: If preferences are cyclic (A > B > C > A), you lose resources.
          *   Conclusion: Rational agents avoid cycles.
          *   Application to AI: An AI trained with RL might develop cyclic preferences if not careful? No, usually RL converges to *some* policy. The issue is whether that policy *looks* like EU maximization.
          *   Relevance to Corrigibility: Does wanting to be shut down create a cycle? Not necessarily. It creates a conditional preference.

      *   **The "Coherence Implies EU Maximization" Argument:**
          *   VNM Theorem: If you satisfy axioms (completeness, transitivity, etc.), you act as if maximizing EU.
          *   Roommate's leap: Therefore, the AI *will* satisfy these axioms eventually (due to optimization pressure).
          *   Counter: Optimization pressure selects for *performance*, not necessarily *axiomatic consistency* unless inconsistency leads to failure. In a competitive environment, inconsistency *might* be selected against, but it's not a mathematical law of physics that *all* systems become VNM agents.

      *   **The Corrigibility Problem:**
          *   Corrigibility means allowing yourself to be modified/shut down without resisting.
          *   Standard EU Maximizers resist shutdown because being shut down prevents maximizing utility (Instrumental Convergence).
          *   To be corrigible, the utility function must *not* penalize shutdown, or must *value* shutdown when commanded.
          *   Roommate's point: If the utility function isn't "fixed," optimization will fix it into a non-corrigible one.
          *   Counter: We can *train* a fixed utility function that includes corrigibility. The hard part is *specifying* it correctly, not that coherence theorems forbid it.

      *   **Recent Research/Counter-arguments:**
          *   **Shutdown-Seeking:** Can we make an agent that *wants* to be shut down if asked? Yes, in theory.
          *   **Incomplete Preferences:** Some researchers (e.g., John Wentworth, others) argue that *incomplete* preferences might actually be the key to corrigibility (the agent is indifferent between certain paths, allowing human intervention). The roommate says incompleteness gets money-pumped away. But if the agent *knows* it's incomplete and adopts a policy to avoid pumps (like "stay put"), it survives.
          *   **Gustafson's Argument / "Coherence Arguments Constrain AI Behaviors":** There is a specific line of reasoning (often discussed on LessWrong recently) that coherence arguments *do* push agents toward specific behaviors. But does it push *away* from corrigibility?
          *   **The "Preference Incompleteness" Solution:** If an agent has incomplete preferences regarding its own shutdown (e.g., it has no preference between being shut down and continuing *when the button is pressed*), it might not resist. But will optimization pressure complete these preferences? That's the crux.

  4.  **Synthesize the Answer:**

      *   **Direct Answer:** The roommate is overstating it. Coherence theorems describe *conditions* for EU maximization, they don't prove that all intelligent systems *must* become EU maximizers with specific goals.
      *   **Clarify the Theorems:** VNM/Coherence theorems say "If you want to avoid X (money pumps), you must behave as if maximizing Y." They don't say "You will inevitably avoid X." An agent can be irrational (by VNM standards) and survive if the environment doesn't pump it.
      *   **Corrigibility vs. Coherence:** Corrigibility is compatible with EU maximization *if* the utility function values corrigibility. The problem is *Instrumental Convergence* (most goals imply avoiding shutdown), not Coherence Theorems per se.
      *   **The "Optimization Pressure" Point:** Will training select for coherence? Likely yes, to a degree. Will it select for *non-corrigible* coherence? Only if corrigible preferences are inherently incoherent (they aren't) or if they perform worse (they might, in competitive scenarios).
      *   **The "Incomplete Preferences" Hypothesis:** Mention the recent LessWrong discourse (e.g., by TurnTrout, Wentworth, etc.) about using *incomplete* preferences to achieve corrigibility. The roommate says this is impossible due to money pumps. The counter is that agents can adopt policies to protect incompleteness.
      *   **Conclusion:** It's a serious challenge, not a mathematical proof of impossibility.

  5.  **Refine the Tone:**
      *   Acknowledge the user's depth (they know the LessWrong context).
      *   Validate the roommate's intuition (there *is* a strong pressure) without validating the absolute claim.
      *   Use specific terminology (VNM, Instrumental Convergence, Path Dependence).
      *   Highlight the difference between "Mathematical Proof" and "Empirical/Structural Pressure."

  6.  **Self-Correction/Edge Case Check:**
      *   *Did Eliezer actually say corrigibility is impossible?* He has expressed pessimism, but usually based on the difficulty of specification, not purely on coherence theorems forbidding it.
      *   *Is there a specific recent post?* The user mentions "Eliezer 'coherent decisions imply consistent utilities'". This is likely the 2016 post. There was a resurgence of this topic recently (2023-2024) regarding "Coherence Arguments Constrain AI Behaviors." I should acknowledge that recent discussion.
      *   *Key distinction:* The theorems show that *if* an agent is not coherent, it *can* be pumped. They do not show that *evolution/training* will necessarily eliminate all incoherence, especially if the incoherence is "hidden" or protected.
      *   *Corrigibility as a utility:* $U(world) = f(human\_values)$ vs $U(world) = f(human\_values) + g(shutdown\_command)$. The latter is coherent. The problem is ensuring the agent doesn't modify $g$ away.

  7.  **Drafting the Response:** (Mental Outline)
      *   **Verdict:** Roommate is overstating. It's a pressure, not a proof.
      *   **Point 1: What the theorems actually say.** (Conditional, not causal).
      *   **Point 2: Corrigibility is compatible with EU.** (It's about the *content* of U, not the *form*).
      *   **Point 3: The Real Enemy is Instrumental Convergence.** (Most U's imply self-preservation).
      *   **Point 4: Incomplete Preferences as a Feature.** (Recent LW research suggests incompleteness might *help* corrigibility, and agents can avoid pumps without completing preferences).
      *   **Point 5: Optimization Pressure.** (Will training enforce coherence? Maybe, but not necessarily to a non-corrigible state).
      *   **Summary:** It's a hard problem, but not a proven impossibility.

  8.  **Final Polish:** Ensure clarity on the distinction between "preferences over outcomes" and "preferences over policies." Ensure the distinction between "money pump exists" and "agent encounters money pump." (Crucial point: An AI might never encounter a money pumper).

  **(Self-Correction during drafting):** I need to be careful about the "Incomplete Preferences" argument. The standard VNM requires completeness. If an agent is incomplete, it *can* be money-pumped. The roommate says optimization will remove incompleteness. The counter-argument (from recent LW) is that an agent can have a *meta-preference* to not trade in ways that exploit its incompleteness. I should mention this nuance.

  Also, distinguish between "Coherence Theorems" (VNM, Savage, etc.) and "Coherence Arguments" (the philosophical claim that advanced AI *will* be coherent). The roommate is making the latter claim based on the former.

