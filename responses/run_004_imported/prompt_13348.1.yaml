          *   *Salīm:* Distinguish between practical certainty (habit) and metaphysical necessity. We act *as if* fire burns, but we know *that* God burns through fire. Science studies God's habits (*sunan Allāh*).
      *   **Round 4: The "Why" of Regularity.**
          *   *Farīd:* Why *this* habit? Why not chaos? The regularity implies an internal principle (nature) ordained by the Giver of Forms.
