answer: |-
  **Setting:** *A quiet chamber in a madrasa, late afternoon. The light slants through a lattice screen, illuminating dust motes dancing in the air. Two scholars sit across a low table strewn with manuscripts. **Ismāʿīl**, a defender of the Imām al-Ghazālī's position, sips from a cup of tea. **Yaḥyā**, a defender of the Commentator Averroes (Ibn Rushd), traces a diagram of celestial spheres on a piece of parchment.*

  **Ismāʿīl:** You have been staring at that diagram for some time, Yaḥyā. Are you seeking the necessary connection between the ink and the paper? Or merely observing that, by God's habit, the ink stays where it is placed?

  **Yaḥyā:** (Smiling faintly) I am seeking the cause of your persistence in denying what is evident to any intellect that has not been clouded by excessive caution. We are discussing the Seventeenth Discussion, Ismāʿīl. The fire and the cotton. You claim that when fire touches cotton and the cotton burns, we observe only two events: contact and combustion. We do not observe a third thing called "causation."

  **Ismāʿīl:** Precisely. Open your eye of observation (*mushāhada*). Do you see the burning? Yes. Do you see the contact? Yes. Do you see a power flowing from the blackness of the coal into the whiteness of the fiber, compelling it to turn to ash? No. You see sequence. You see conjunction. To claim you see *necessitation* is to claim you see with the intellect what is not present to the senses, and then to mistake that mental abstraction for an external reality.

  **Yaḥyā:** But this is to confuse the *mode* of knowing with the *object* of known. When I see a man speak and hear sound, I do not need to see a "voice-power" flowing from his throat to know he is the agent of the sound. The intellect abstracts the relation from the sensation. If you deny that the fire possesses a nature (*ṭabʿ*) that necessitates burning, you render the fire passive. You make it merely the occasion for God's action.

  **Ismāʿīl:** I make it the instrument of God's action. There is a difference. But let us grant you your point for the sake of argument. Suppose we concede that the fire possesses an active power to burn. Does this secure your necessitarianism? It does not.

  **Yaḥyā:** How so?

  **Ismāʿīl:** Because an effect requires two sides: the agent and the recipient. Even if the fire is brimming with the power to burn, the cotton must possess the receptivity (*qābiliyya*) to be burned. Who creates that receptivity? Who sustains it? If God wills that Ibrāhīm (Abraham) be cast into the fire, God does not need to extinguish the fire's heat. He need only withhold the cotton's receptivity to combustion. The fire remains fire, possessing its nature, yet the burning does not occur. Thus, the connection is never necessary. It is always contingent upon the Will that sustains the receptivity of the patient.

  **Yaḥyā:** This is the move I expected. You retreat into the absolute power of the Agent to dissolve the integrity of the patient. But consider the cost, Ismāʿīl. If the cotton's receptivity is not grounded in its own nature—if it is merely a fresh creation of God at every instant—then knowledge of the world becomes impossible.

  **Ismāʿīl:** Impossible? We live, we eat, we avoid the fire. We know the world well enough.

  **Yaḥyā:** You know *practice*, not *science*. Science (*ʿilm*), in the demonstrative sense (*burhān*), requires knowing *why* something must be the case. If the connection between fire and burning is merely habitual (*ʿāda*), then induction is a guess. When I prescribe medicine to a patient, I rely on the nature of the herb necessitating a change in the humor. If that herb acts only because God happens to will it today as He willed it yesterday, I have no grounds to trust it tomorrow. The regularity you appeal to—God's habit—is, on your view, logically breakable at any instant without reason. Why then study physics? Why not merely study theology?

  **Ismāʿīl:** You assume that certainty requires metaphysical necessity. I say certainty resides in the reliability of the Promise and the Consistency of the Wise Agent. We study physics to understand God's *sunan*—His customary ways. That medicine works is certain, not because the herb compels the cure, but because the Giver of the Cure has promised consistency in His creation. The miracle of Ibrāhīm is not a violation of logic, but a suspension of habit to reveal the Agent behind the habit. If the habit were a necessary nature, the miracle would be impossible. If the miracle is possible, the habit cannot be a necessary nature.

  **Yaḥyā:** But this makes the miracle unintelligible! Listen to me closely. A miracle is defined as an interruption of the natural order. If there is no natural order—if there are no natures that necessitate effects—then there is nothing to interrupt. If fire does not burn by nature, then Ibrāhīm's survival is not a miracle; it is merely one more instance of God's arbitrary habit, no more remarkable than the fire burning the cotton the day before. For the miracle to stand out as a sign (*āya*), the background regularity must be grounded in something stable.

  **Ismāʿīl:** The stability is in the Will, not in the fire.

  **Yaḥyā:** Then the Will is capricious. And if the Will is capricious, the cosmos is not a cosmos; it is a sequence of disjointed atoms. Tell me, why *this* habit? Why does fire always burn cotton and never turn it to rosewater? If there is no nature in the fire that inclines it toward burning, and no nature in the cotton that inclines it toward ash, then God's choice to burn cotton is utterly without reference to the things themselves. It makes the creation passive puppets. It diminishes the perfection of God's work. A master craftsman makes a knife that cuts by virtue of its sharpness, not a knife that cuts only because the craftsman moves it manually every time it touches bread.

  **Ismāʿīl:** An evocative image. But the knife analogy fails because the knife is dead matter. We are speaking of a universe sustained at every moment by the Living. To attribute independent power to the fire is to associate partners with God in agency (*shirk fi al-fiʿl*). If the fire *must* burn by its own nature, then God *must* allow it to burn. He is bound by the natures He created. Is God bound?

  **Yaḥyā:** God is not bound externally. He binds Himself by His own wisdom. He creates natures as reflections of His own intellect. The necessity is not coercive upon God; it is consequential to His perfection. He wills a world that is intelligible. A world where secondary causes have real power is more perfect than a world where they are shadows. It shows the depth of His generosity—He grants agency even to His creatures. To deny the fire its burning is to stinginess toward the fire.

  **Ismāʿīl:** Generosity? Or distraction? If the fire burns by its own power, our attention turns to the fire. We say, "The fire burned me." We forget the One who empowered the fire. By stripping the fire of intrinsic power, every moment of burning becomes a reminder: "There is no power nor strength save in God." The world becomes a web of signs, not a machine of causes.

  **Yaḥyā:** And yet, if the world is only signs and not causes, how do you explain the specificity of the signs? You say God creates the burning at the moment of contact. Why does He create it *then*? Why not create the burning when the fire is a mile away?

  **Ismāʿīl:** Because that is His Habit.

  **Yaḥyā:** (Leaning forward) "Habit." You use this word as a shield. But a habit implies a disposition. If God has a disposition to create burning only at contact, then there is a *reason* for the contact. That reason lies in the relationship between the fire and the cotton. That relationship *is* the causal power. You cannot have the regularity of the habit without the ontology of the nature. You want to keep the predictability of the Aristotelian world while denying its architecture. It is like wanting a building to stand while denying it has foundations.

  **Ismāʿīl:** The foundation is the Will, Yaḥyā. The predictability is for our sake, so we may live and worship. But we must not mistake the map for the territory. We map the habits. The territory is the Volition. When you say "nature," you reify a habit and call it a godlet. When I say "habit," I acknowledge the regularity but point through it to the Agent.

  **Yaḥyā:** But if you point *through* it so aggressively that the thing itself vanishes, you have nothing left to point *with*. If the cotton has no nature, then when it burns, nothing has changed in the cotton except its accidents. But if the accidents change without a subject capable of receiving that change necessarily, then change itself is an illusion. It is replacement. One cotton is annihilated, another ash-colored cotton is created.

  **Ismāʿīl:** And what is wrong with that? Time is atomic. Moments are discrete. God creates the world anew at every instant. Continuity is a gift of memory and of Divine Consistency.

  **Yaḥyā:** Then science is memory, not knowledge. It is the recollection of what God did, not the understanding of what things *are*. I cannot accept that the Intellect, which God gave us, is designed to grasp natures that do not exist. It would make God a deceiver.

  **Ismāʿīl:** And I cannot accept that the Will, which is the essence of Divinity, is constrained by natures that exist independently of His immediate command. It would make God a prisoner of His own creation.

  *Silence falls between them. The dust motes continue to dance in the slant of light. It is impossible to tell if they move by their own nature or by a wind unseen.*

  **Yaḥyā:** So we stand at the precipice. I see a cosmos of intelligible beings, grounded in a Divine Intellect, where to know the thing is to know its power.

  **Ismāʿīl:** And I see a cosmos of immediate dependence, grounded in a Divine Will, where to know the thing is to know its poverty before God.

  **Yaḥyā:** (Closing the manuscript) We both seek to protect the Divine. You protect His Freedom. I protect His Wisdom.

  **Ismāʿīl:** Perhaps. But tell me, Yaḥyā. When you place your hand near the flame, do you hesitate?

  **Yaḥyā:** (Pauses) I withdraw it.

  **Ismāʿīl:** As do I. In that withdrawal, we are brothers. The dispute is only whether we withdraw from the fire, or from the Command that rides upon it.

  **Yaḥyā:** Then let us withdraw. The sun is setting, and the light changes. Even you must admit, the habit of the sun is reliable enough to mark the time for prayer.

  **Ismāʿīl:** (Smiling) Reliable enough. Praise be to the Turner of Hearts and Times.

  *They rise together, leaving the manuscripts on the table, where the ink remains dry, by habit, or by Will.*
