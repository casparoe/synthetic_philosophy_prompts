      *   *Nuance:* Ensure Averroes isn't painted as denying God's power. He believes God sustains the natures. The dispute is about *secondary causality*.
      *   *Nuance:* Ensure Ghazālī isn't painted as denying regularity. He affirms *ʿāda* (habit).

  5.  **Polishing the Dialogue:**
