answer: |-
  **Setting:** *A timeless courtyard, perhaps in Baghdad, perhaps in Cordoba. The air is still. A brazier sits between two cushions. **Al-Ghazali** (d. 1111), the Proof of Islam, sits with the posture of a Sufi ascetic, eyes calm but piercing. **Averroes** (Ibn Rushd, d. 1198), the Commentator, sits opposite, his hands resting on a stack of Aristotelian texts, his expression one of rigorous concern.*

  **Al-Ghazali:** *(Holding a tuft of cotton over the brazier's flame)* Tell me, Abu al-Walid. When I lower this cotton into the fire, and it turns to ash, what has occurred?

  **Averroes:** The obvious has occurred, Imam. The fire, by virtue of its nature, has acted upon the cotton, which is susceptible to burning. The agent has actualized the potential of the patient. This is the bedrock of natural philosophy.

  **Al-Ghazali:** Is it? I see the cotton. I see the fire. I see the contact. I see the black ash that follows. These are four observations. But I do not see a fifth thing: the "power" of the fire to burn. I do not see the necessity that binds the flame to the ash. I see only that God creates the fire, and then, at the moment of contact, God creates the burning.

  **Averroes:** You separate what cannot be separated. If the fire does not burn by its own nature, then what distinguishes fire from water? If I plunge the cotton into water, it does not burn. Why? Because water lacks the active power of heat. If you deny that powers reside in things, you deny that things have natures. And if things have no natures, then "fire" is merely a word we shout at a flicker of light. It picks out nothing real.

  **Al-Ghazali:** It picks out the locus of God's habit. We call it "fire" because it is the place where God has willed to create burning, consistently, without fail. But consistency is not necessity. You confuse what *is* with what *must be*.

  **Averroes:** *(Leaning forward)* This is where the intellect rebels, Imam. If there is no necessary connection between a nature and its effect, then we have no *'ilm*—no real knowledge—of the world. Knowledge requires certainty. If the connection between fire and burning is merely contingent, dependent on a will that could change at any instant, then I cannot know that the cotton will burn tomorrow. I can only guess. You reduce physics to fortune-telling.

  **Al-Ghazali:** I reduce it to what is actually given to us. You claim to know the "essence" of fire. I claim to know only the sequence of events. Tell me, does your intellect perceive the burning, or does it infer it?

  **Averroes:** It infers it from the essence.

  **Al-Ghazali:** Precisely. It is an inference. And what is the basis of this inference? Experience. We have seen fire burn cotton a thousand times. But tell me, Abu al-Walid, does repeated observation create a logical bond? If I see a man write with a pen a thousand times, does the pen *necessarily* write by its own power? Or is the man the agent, and the pen merely the instrument?

  **Averroes:** The pen is an inanimate tool. Fire is an elemental body with active qualities. But let us grant your analogy. If God is the only agent, then the pen and the fire are equal. But then, why does the pen not burn the cotton? Why does the fire not write the letter? There must be a specific disposition in the fire that mandates burning. To deny this is to make the world chaotic.

  **Al-Ghazali:** It is not chaotic. It is ordered by *'āda*—by God's Custom. The Custom is so stable, so unbroken, that for all human purposes, it is indistinguishable from necessity. But for the theologian, the distinction is vital. If fire burns by its own necessity, then God *cannot* stop it from burning. He would be bound by the nature He created. He would be a prisoner of causality.

  **Averroes:** God is not bound. He established the natures. But once established, they operate according to the wisdom He inscribed in them. To say God must intervene at every single moment to create the burning is to make Him a micromanager of atoms, and it renders secondary causes meaningless. Why create a nature that does nothing?

  **Al-Ghazali:** Because the appearance of cause and effect teaches us patience and expectation. It allows us to live. I do not deny that I should avoid the fire. I do not deny that the cotton will burn. I only deny that the fire *makes* it burn.

  **Averroes:** But this is the crux! If the fire does not make it burn, then your expectation is baseless. You say, "God's Custom is stable." But on what grounds do you know this Custom will hold? If there is no link in the things themselves, you are relying on a psychological habit, not an ontological truth. You are saying, "I expect the sun to rise not because of the heavens, but because I am used to it." This is skepticism, Imam. It undermines the very science you claim to protect.

  **Al-Ghazali:** *(Smiles gently)* And here, perhaps, we are closer than you think. I admit it. My expectation *is* a psychological habit. It is the expectation that the Custom will continue. But tell me, Averroes: Is this not enough for life? Is this not enough for religion?

  **Averroes:** It is enough for survival. A child knows not to touch the flame. But it is not enough for *wisdom*. Wisdom seeks the *why*. If you strip the world of necessary connections, you strip the intellect of its object. The intellect knows things by their causes. If there are no real causes, the intellect knows nothing but shadows.

  **Al-Ghazali:** The intellect knows God. The shadows are sufficient to point to the Light. But consider this: You worry that without necessary connection, knowledge collapses. I say that knowledge of the world was never about necessity to begin with. It is about regularity.
  *(Ghazali gestures to the flame)*
  If I tell you, "The cotton will burn," and it burns, have I spoken truth?

  **Averroes:** Yes.

  **Al-Ghazali:** If I tell you, "The fire burns the cotton," and God creates the burning at the moment of contact, have I spoken a lie that harms anyone?

  **Averroes:** You have spoken a lie about reality. You have attributed agency to a creature that belongs to the Creator.

  **Al-Ghazali:** I have spoken according to the Custom. And for the purposes of navigating this world, the Custom *is* reality. We do not need to see the gears of the divine will to know that the clock strikes the hour. You fear that if I deny the power of fire, I deny the stability of the world. I say: The world is stable because God is faithful, not because fire is powerful.
  Does Hume... ah, forgive me. Does the skeptic in you not worry that your "necessary natures" are just projections of your own mind? You see conjunction so often you imagine a bond. I simply say the bond is in the Will, not in the matter.

  **Averroes:** The bond is in the definition. To define "fire" is to define "that which heats and burns." If you remove the burning, you have not defined fire; you have defined a picture of fire. You make miracles possible, I grant you that. If fire does not burn by necessity, then Abraham in the furnace is logically simple. But you make knowledge impossible. If "fire" does not necessitate "burning," then I cannot demonstrate anything about the world. I can only report history. "Fire burned yesterday." I cannot say, "Fire will burn tomorrow."

  **Al-Ghazali:** And yet, you *do* say it. And you act upon it. And I act upon it. We both avoid the flame. The difference is metaphysical, not practical. You build your house on the rock of Nature. I build mine on the rock of Divine Habit. Both houses stand. But yours claims the rock is immovable by God. Mine admits the rock is held by His hand.

  **Averroes:** But if the rock is held by a hand that can move it at any whim, it is not a rock. It is a cloud. And you cannot build science on a cloud. You say regularity is enough. I say regularity without necessity is just a sequence of miracles. If every moment is a new creation, there is no continuity. There is only a slideshow of disconnected instants. How do you explain memory? How do you explain growth?

  **Al-Ghazali:** By the same Custom. God creates the memory in the next moment that corresponds to the experience of the previous moment. He creates the growth in the plant sequentially. It is a coherent story written by a single Author. You worry about the disconnect between moments. I find comfort in it. It means the world is dependent, moment to moment. It is not a machine you can understand and then discard. It is a speech you must listen to.

  **Averroes:** *(Sighs, looking at the cotton which has now turned to ash)* You protect God's power, Imam, but you cost Him His Wisdom. A God who creates a world that appears to have causes but does not... is that not a deception?

  **Al-Ghazali:** It is a veil. And the veil is mercy. If we saw the bare Will in every moment, we would be overwhelmed. We need the fire to feel hot. We need the bread to satisfy hunger. We need the illusion of cause to function. But the philosopher must know the difference between the tool and the Hand that wields it.

  **Averroes:** And the philosopher must know that if the tool has no power, it is no tool at all. It is a prop.
  *(Averroes stands)*
  I maintain that if you sever the link between nature and effect, you sever the link between the human mind and truth. We become spectators of a magic show, never understanding the trick.

  **Al-Ghazali:** *(Standing as well)*
  And I maintain that if you claim to understand the trick, you claim to understand the Magician. And that is the true impossibility. We are spectators, Abu al-Walid. The question is only whether we applaud the props, or the Hand.

  **Averroes:** Then we shall agree to watch the fire, but disagree on what warms us.

  **Al-Ghazali:** Agreed. Though I suspect, when you feel the heat, you will thank God. Even if you think the fire did the work.

  **Averroes:** *(A faint smile)*
  And I suspect, Imam, that when you warm your hands, you will rely on the fire's nature, even if you say it has none.

  *They bow to one another. The brazier crackles, sending a spark into the dark.*
