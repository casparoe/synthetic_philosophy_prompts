      *   Reframing: It's not about stripping away the "brother" role, but about distinguishing between "helping her" (which reporting might actually do in the long run) and "enabling her" (which silence does).

  5.  **Analyze the "Cowardice vs. Loyalty" Aspect:**
      *   Cowardice implies fear of personal repercussions. Is the user afraid of *their* life changing, or the *sister's*?
      *   Loyalty implies acting in the best interest of the other. Is silence in her best interest? (Addiction/behavioral patterns usually escalate).
      *   *Key Insight:* True loyalty might mean stopping her before she digs a deeper hole.

  6.  **Develop a Structured Response:**
