      *   *Section 2: The Nature of the Harm.* It's not victimless. Clients are losing money. Trust is being broken.
      *   *Section 3: The "Loyalty" Trap.* Is silence loyalty? Or is it enabling? Embezzlement is often behavioral (gambling, addiction, entitlement). It usually escalates. Stopping her now saves her from prison later.
