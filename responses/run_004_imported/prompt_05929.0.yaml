  2.  **Deconstruct the Ethical Frameworks:**
      *   **Universalism (Roommate's stance):** Morality applies equally to everyone. Favoritism is bias/tribalism.
      *   **Partiality/Special Obligations (User's intuition):** We *do* owe more to family. This is a recognized philosophical concept (Special Obligations).
      *   **Complicity:** By knowing and doing nothing, is the user an accessory?
      *   **Consequences:** What happens if she gets caught later? What happens if she stops? What happens to the clients?

  3.  **Address the "Family Exception" Question:**
      *   Is the roommate right? Not entirely. Philosophy generally acknowledges "special obligations" to family. We *do* owe our parents/siblings more than strangers (e.g., financial support, emotional care).
      *   *However*, do these obligations extend to *covering up crimes*? This is the crux. Most ethical frameworks say special obligations have limits, especially when harm to third parties is involved.
      *   *Conclusion:* It's not "tribalism with extra steps" to care more about family, but it *is* ethically problematic to let that care enable harm to others.

  4.  **Address the Therapist's Comment:**
