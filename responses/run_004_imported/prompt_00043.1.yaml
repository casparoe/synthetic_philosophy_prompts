answer: |-
  You have hit on a crucial distinction that often gets blurred in introductory discussions of social choice theory. You are absolutely right that **practically**, institutions (like courts or legislatures) often resolve the discursive dilemma by simply adopting a premise-based procedure. If a court decides to vote on the legal premises rather than the final verdict, the inconsistency disappears.

  However, List and Pettit (along with other theorists like Christian List, Philip Pettit, and Franz Dietrich) argue that this practical fix masks a deeper theoretical problem. They treat the discursive dilemma not merely as a procedural glitch, but as the motivating instance of a general **Impossibility Theorem for Judgment Aggregation**.

  Here is why the discursive dilemma is considered a genuine paradox analogous to Arrow's Theorem, rather than just a reason to prefer premise-based voting.

  ### 1. The Difference Between a "Problem" and an "Impossibility"
  Your intuition is that the dilemma presents a **choice**: *Do we want to vote on premises or conclusions?* If we pick one, the problem goes away.

  List and Pettit's argument is that this choice forces us to **violate a normative democratic principle**. The "paradox" is not that we get different results; it is that **no aggregation rule exists** that can satisfy a set of seemingly minimal democratic requirements across all possible logical agendas.

  If it were just a quirk, there would be a "perfect" procedure that handles the dilemma while respecting all democratic norms. List and Pettit proved there is no such procedure.

  ### 2. The Formal Impossibility Theorem
  To understand why "just pick premise-based" isn't a theoretical solution, we have to look at the conditions List and Pettit impose on any aggregation function. They argue that a desirable collective decision-making process should satisfy the following:

  1.  **Universal Domain:** The rule must accept any possible combination of individual judgments (provided individuals are logically consistent).
  2.  **Collective Rationality:** The collective output must be logically consistent and complete (no contradictions).
  3.  **Systematicity (or Independence):** The collective judgment on any given proposition should depend *only* on individual judgments on that proposition, and the rule should treat all propositions equally (neutrality).
  4.  **Anonymity (Non-dictatorship):** All individuals count equally; no single person dictates the outcome.

  **The Theorem:** For any agenda containing logically interconnected propositions (like $P, Q, P \land Q \to R$), **no aggregation function can satisfy all four conditions simultaneously.**

  ### 3. Why "Premise-Based Voting" Is Not a Neutral Fix
  You suggested we should "pick premise-based voting and move on." In the context of the theorem, adopting premise-based voting is not a neutral solution; it is a **sacrifice of Systematicity**.

  *   **Violating Neutrality:** Premise-based voting treats premises differently from conclusions. It privileges certain propositions as "inputs" and others as "derived outputs."
  *   **The Agenda-Setter Problem:** Who decides which propositions are premises and which are conclusions? In a democratic setting, the power to structure the agenda is the power to determine the outcome. If the majority wants $R$ but the logic dictates $\neg R$ based on the premises, premise-based voting overrides the majority will on $R$.
  *   **Responsiveness:** By locking in the premises, you make the collective judgment unresponsive to direct shifts in opinion on the conclusion.

  Therefore, "solving" the dilemma by adopting premise-based voting admits that **we cannot have a procedure that is both fully responsive to individual judgments on every proposition AND logically consistent.** We have to sacrifice one to save the other. That trade-off is the heart of the paradox.

  ### 4. The Analogy to Arrow's Theorem
  The reason List and Pettit treat this as analogous to Arrow's Impossibility Theorem is that both reveal structural limits on the concept of a "collective will."

  *   **Arrow (Preferences):** You cannot aggregate individual *orderings* of preferences into a collective ordering that is Transitive, Pareto-efficient, and Independent of Irrelevant Alternatives without a Dictator.
  *   **List & Pettit (Judgments):** You cannot aggregate individual *truth-values* on propositions into a collective set of judgments that is Consistent, Universal, and Systematic without a Dictator (or violating systematicity).

  In both cases, the "paradox" is that **rationality** (consistency/transitivity) and **responsiveness** (democracy/universal domain) are mathematically incompatible under specific conditions.

  If Arrow's theorem were just a "quirk," we would say, "Oh, Borda count fails sometimes, let's use Plurality." But we don't say that; we say Arrow proved that *all* voting systems have flaws. Similarly, the Discursive Dilemma proves that *all* judgment aggregation procedures must violate at least one democratic norm when logic is involved.

  ### 5. The "Group Agent" Implication
  The deeper philosophical reason List and Pettit emphasize this paradox is their interest in **Group Agency**.

  If a group (a court, a parliament, a corporation) is to be treated as a moral agent, it must be able to form intentions and judgments.
  *   If it votes conclusion-based, it risks being **irrational** (holding contradictory beliefs).
  *   If it votes premise-based, it risks being **undemocratic** (ignoring the majority view on specific issues to maintain consistency).

  The dilemma shows that forming a "collective mind" is not just a matter of counting votes. It requires an institutional structure that constrains how inputs are processed. The paradox reveals that **consistency comes at the cost of responsiveness.**

  ### Summary
  You are correct that in practice, we resolve the dilemma by choosing a procedure (usually premise-based). However, List and Pettit treat it as a genuine paradox because:

  1.  **It Generalizes:** It is not unique to the $P, Q, R$ example; it applies to any interconnected logical agenda.
  2.  **It Implies Impossibility:** There is no "perfect" rule. Every rule fails at least one democratic condition (usually Systematicity or Collective Rationality).
  3.  **It Reveals a Trade-off:** It demonstrates a fundamental tension between **logical coherence** and **majoritarian responsiveness**.

  "Choosing premise-based voting" is not solving the paradox; it is **choosing which horn of the dilemma to accept.** You are choosing Consistency over Direct Responsiveness. The paradox lies in the fact that you *must* choose; you cannot have both.
