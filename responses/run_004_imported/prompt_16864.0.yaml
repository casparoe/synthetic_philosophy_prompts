answer: |-
  Here are eight interview questions drafted for your podcast. They are designed to leverage your background in population genetics while pressing the philosophical specifics of her genic selectionist position.

  **1. The "Change of Coordinates" Metaphor**
  You often defend genic selectionism by arguing that attributing selection to organisms or groups is merely a "change of coordinates, not a change of ontology." In physics, changing coordinates doesn't change the forces at play, but it also doesn't render the new coordinate system causally inert. If the mathematical formalism allows us to partition variance equally well at multiple levels, on what grounds do you assert that the *genic* coordinate is the only one tracking genuine causality, rather than simply being the most granular ledger?

  **2. The Price Equation and Partitions**
  This leads directly to the Price Equation. We know the equation allows for multiple, mathematically equivalent partitions of total selection—some isolating a group component, others collapsing everything into the individual or genic level. If the total change in frequency is invariant across these partitions, why does the ability to model the process exclusively at the genic level entail that the group-level term in a different partition is ontologically empty? Doesn't the utility of the group partition in predicting evolutionary trajectories suggest the group term is capturing something real about the causal structure, not just algebraic noise?

  **3. Follow-up to Q2 (Anticipating the "Accounting vs. Causation" Defense)**
  *I expect you to reply that the Price Equation is an accounting tool, and that causal priority belongs to the level where replication is most faithful.*
  If causal priority tracks replication fidelity, how do you handle cases where the fidelity of the "gene" is entirely dependent on the stability of the higher-level structure? If the gene cannot replicate *except* as part of a cohesive group package, doesn't that make the group a necessary condition for the causal process, thereby granting it ontological standing in the selection event?

  **4. Sober's Distinction and Screening-Off**
  Let's turn to Elliott Sober's distinction between selection *of* a unit and selection *for* a trait, and the associated screening-off arguments. Sober suggests that if a group-level property screens off individual properties from fitness outcomes, the group is a genuine unit of selection. In cases of emergent group defense—where survival depends on the ratio of castes rather than individual genotypes—the group trait seems to screen off the genic contribution. Why is this insufficient to establish the group as a causal unit in its own right?

  **5. Follow-up to Q4 (Anticipating the "Supervenience" Defense)**
  *I expect you to argue that group properties supervene on genic properties, so the genes are the ultimate screeners.*
  But supervenience alone doesn't eliminate higher-level causation in other sciences; we don't say economic inflation is causally inert just because it supervenes on individual transactions. If we accept autonomous causal standing in economics or psychology based on functional organization, why does evolutionary theory require a reduction to the lowest common denominator to establish causality? Is this a biological necessity or a metaphysical preference?

  **6. MLS2 and Group Reproduction**
  I want to press on Samir Okasha's distinction between MLS1 and MLS2. In MLS2 scenarios, like eusocial colonies that reproduce by budding, the *vehicle* of reproduction is the colony itself, not the individual insects. The parent is a colony; the offspring is a colony. If the reproduction event—the very engine of natural selection—is occurring at the group level, how can you maintain that the gene is the sole unit of selection without redefining "gene" so broadly that it loses its specific molecular meaning?

  **7. Follow-up to Q6 (Anticipating the "Vehicle vs. Replicator" Defense)**
  *I expect you to distinguish the replicator (gene) from the vehicle (colony), arguing the colony is just a machine built by genes to propagate themselves.*
  But if the "design rules" for building that machine are stored in the interaction network of the colony rather than linearly in the DNA of a single individual, isn't the selection acting on the network architecture? If the heritable variation resides in the colony structure, doesn't that make the colony the functional replicator, regardless of where the molecular substrate sits?

  **8. The Threshold for Autonomous Causal Standing**
  To close, I'd like to ask about the conditions for changing your view. You hold that change in gene frequency is the only genuine causal process underlying evolution. What specific finding—whether empirical data from a system like the major transitions in individuality, or a new conceptual framework regarding causality—would count for you as evidence that a level above the gene has autonomous causal standing? Is there any possible world, consistent with the laws of genetics, where you would concede the ontology to the group?
