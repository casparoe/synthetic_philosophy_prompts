      *   **Guest Persona:** Philosopher defending *genic selectionism* (Dawkins/Haig/Williams style, likely leaning towards Godfrey-Smith or similar contemporary defenses). Key claim: Gene frequency change is the *only* genuine causal process; other levels are just "changes of coordinates" (mathematical equivalence, not ontological difference).
      *   **Task:** Draft 7-8 interview questions.
      *   **Constraints:**
          *   Press on the "change of coordinates" deflection (don't let her off easy).
          *   Must include at least one question on each of three specific topics:
              1.  Price Equation (multiple equivalent partitions).
