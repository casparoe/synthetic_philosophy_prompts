              3.  MLS2 / Group-level reproduction (Okasha's distinction, eusocial budding).
          *   Each of these three needs a specific follow-up question keyed to her likely answer.
          *   Close with a question about what evidence *would* change her mind (autonomous causal standing).
          *   Tone: Professional, rigorous, respectful but challenging (peer-to-peer).

  2.  **Deconstruct the Guest's Position (Genic Selectionism):**
      *   *Core Claim:* Genes are the only replicators/units of selection.
      *   *Defense:* Mathematical equivalence (Price Equation). If you can model it at the gene level, higher levels are heuristic tools, not ontological realities.
      *   *Weaknesses/Pressure Points:* Causal adequacy vs. mathematical description. Does "accounting for variance" equal "causing change"? What about cases where the *structure* of reproduction happens at a higher level (MLS2)?

  3.  **Drafting - Section by Section:**

