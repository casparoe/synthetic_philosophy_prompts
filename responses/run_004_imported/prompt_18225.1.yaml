  okay so we've been reading Leviathan in my philosophy elective and hobbes has this whole argument about how in the state of nature people can never really trust each other to keep a deal, since theres no one around to enforce it - his line is basically that "covenants, without the sword, are but words, and of no strength to secure a man at all," which is why he thinks you need an all-powerful sovereign. but this weekend i went down a rabbit hole reading about a game theory idea called program equilibrium, where instead of just picking cooperate or defect, you submit a program that actually gets to read the other players source code before it does anything, so you can basically verify ahead of time that they'll hold up their end of the deal (like a prisoners dilemma where you can prove you'll cooperate if they will, no trust required). it seems like on paper that solves the exact commitment problem hobbes was so worried about, without needing any leviathan at all. what do you think hobbes would actually say if someone explained this to him, would he admit it solves his problem or would he find a way to poke holes in it and still insist you need a sovereign anyway? give me like 4-5 concrete reasons for whichever side he'd land on, and actually tie them back to stuff from the text instead of just generic hobbes vibes.
