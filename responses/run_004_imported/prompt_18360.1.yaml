      *   *The Shift:* Around 1851-1852, Douglass broke with Garrison. He published *The North Star* independently. His speech "The Meaning of the Fourth of July for the Negro" (1852) is pivotal, but his legal argument is fleshed out in *My Bondage and My Freedom* (1855) and later speeches.
      *   *The Argument:* Douglass didn't just "hope" it was anti-slavery. He developed a specific hermeneutic (method of interpretation).
