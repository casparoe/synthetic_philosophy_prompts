answer: |-
  You win the argument, but your friend isn't entirely wrong about the history. The nuance lies in the difference between **historical intent** and **legal interpretation**.

  Your friend is correct that the *early* Douglass (pre-1851) agreed with William Lloyd Garrison that the Constitution was a "covenant with death." They believed that because the Framers compromised with slavery to get the Southern states to join, the document was structurally pro-slavery. Historically, they have a point: many Framers were slaveholders, and clauses like the Three-Fifths Compromise and the Fugitive Slave Clause protected the institution.

  However, you are correct that the *later* Douglass wasn't just being a "wishful idealist." When he broke with Garrison in 1851, he didn't just switch sides out of hope; he developed a sophisticated legal and philosophical argument that anticipated modern constitutional theory. He moved from viewing the Constitution as a **contract between states** (which would honor the intent of the signers) to viewing it as a **law for the people** (which must be judged by its text and principles).

  Here is the breakdown of Douglass's reasoning for the switch, and why it holds up as a serious legal argument.

  ### 1. The Text vs. The Intent (The Core Argument)
  This is the strongest point in your favor. Douglass argued that once a constitution is ratified, it belongs to the people, not the men who wrote it. Therefore, its meaning is found in the **words on the page**, not in the secret intentions or private letters of the Framers.

  *   **The Argument:** Douglass pointed out that the word "slavery" never appears in the Constitution. The document never explicitly sanctions property in man. It uses euphemisms like "other Persons," "such Persons," and "Service or Labor."
  *   **The Rule of Interpretation:** Douglass adopted a rule of legal construction that said: *If a document can be read in two ways, one consistent with liberty and one consistent with slavery, you are morally and legally obligated to read it the way that preserves liberty.*
  *   **Why it matters:** He argued that because the text never explicitly legalizes slavery, slavery exists only in violation of the Constitution's actual rules, sustained only by local state laws and federal corruption.

  ### 2. The Preamble as the "Key"
  Douglass argued that you cannot interpret specific clauses without understanding the stated purpose of the document. He pointed to the Preamble:
  > "We the People of the United States, in Order to... secure the Blessings of Liberty to ourselves and our Posterity..."

  *   **The Argument:** If the stated goal of the Constitution is to secure liberty, then no clause within it can be legitimately interpreted to destroy liberty. To interpret the Fugitive Slave Clause as mandating the return of *human beings* (rather than indentured servants, which the text implies) contradicts the Preamble's core mission.
  *   **The Shift:** This moved Douglass from thinking the Constitution *protected* slavery to thinking the Constitution *outlawed* slavery, but was being misinterpreted by a pro-slavery judiciary (like the Supreme Court in the *Dred Scott* decision).

  ### 3. Re-interpreting the "Pro-Slavery" Clauses
  Douglass didn't ignore the ugly clauses; he re-contextualized them.

  *   **The Three-Fifths Clause:** The Garrisonians saw this as dehumanizing blacks. Douglass later argued it was actually a **penalty on slave states**. By counting slaves as only 3/5ths of a person for representation, the Constitution reduced the South's political power in Congress compared to if they were counted as whole people. Douglass argued this was a disincentive to hold slaves, not a boost.
  *   **The Fugitive Slave Clause:** Douglass argued this applied to indentured servants and free people who had contracted labor, not chattel slaves. Since the Constitution never defines "slave," the federal government had no authority to enforce slave codes.
  *   **Article IV, Section 4:** This clause guarantees every state a "Republican Form of Government." Douglass argued that a state founded on slavery is not a Republic; therefore, the Federal Government had the constitutional duty to intervene and abolish slavery in the states to guarantee that republican form.

  ### 4. The Strategic Necessity (Why he switched)
  There was also a pragmatic reason for the switch, which adds weight to its "maturity."

  As long as Douglass believed the Constitution was pro-slavery (the Garrisonian view), the logical political stance was **disunion**. If the government is evil, you shouldn't vote, hold office, or participate. You should dissolve the Union.

  Douglass realized this was a dead end for Black Americans. If they abandoned the political system, they left it entirely in the hands of slaveholders. By arguing the Constitution was anti-slavery, he unlocked the ability to:
  1.  Vote (in the North).
  2.  Form political parties (like the Liberty Party or Republicans).
  3.  Demand the Federal Government use its war powers to end slavery.

  This wasn't naive hope; it was a strategy for power. It allowed him to support Lincoln and push for the 13th, 14th, and 15th Amendments as *fulfillments* of the Constitution, rather than replacements for it.

  ### 5. Influence of Lysander Spooner
  Douglass didn't come up with this legal theory in a vacuum. He was heavily influenced by the legal theorist Lysander Spooner, who published *The Unconstitutionality of Slavery* in 1845. Spooner argued that because English common law (which the U.S. inherited) did not recognize property in man, the Constitution could not be read to support it without explicit language. Douglass adopted this legal rigor, proving he wasn't just "wishing" the text meant something else; he was applying a specific hermeneutic (method of interpretation).

  ### The Verdict on Your Argument
  Your friend is arguing from **Originalism** (what the Framers intended). By that metric, she is right: many Framers intended to protect slavery.

  You are arguing from **Textualism/Living Constitutionalism** (what the words say and how they apply to principles of justice). By that metric, you are right: Douglass constructed a viable legal argument that the text, properly read, was a "Glorious Liberty Document."

  **Douglass's own summary of his shift:**
  > "I therefore deny that the Constitution guarantees the right to hold property in man... I say that the Constitution... is a glorious liberty document. Read its preamble, consider its purposes. Is slavery among them? Is it at the gateway? or is it in the temple? It is neither."

  **Conclusion:**
  Douglass wasn't being naive. He was making a profound point about democracy: **A founding document is not a historical artifact; it is a tool for the living.** He realized that if you accept the "Original Intent" of the Framers regarding slavery, you are bound to their sins forever. If you accept the "Textual Principles" of Liberty, you have a legal mechanism to fix those sins.

  His later position is widely regarded by historians and legal scholars as the more mature, politically effective, and philosophically robust stance. It allowed him to fight *within* the system to destroy the system of slavery, which ultimately worked.
