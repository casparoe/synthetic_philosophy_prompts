answer: |-
  **Cambridge, Massachusetts. October 1907.**

  **The study of William James. The room is warm, cluttered with papers and pipes. Outside, the autumn leaves are turning. WILLIAM JAMES sits in a leather armchair, looking tired but bright-eyed. CHARLES SANDERS PEIRCE stands by the fireplace, holding a copy of James's new book, *Pragmatism*. Peirce looks disheveled, his clothes worn, his manner intense and slightly trembling.**

  **PEIRCE**
  (Thumbing the book)
  "Pragmaticism." You laughed when I told you I coined that term. You said it sounded like a patent medicine.

  **JAMES**
  (Smiling gently)
  I said it was ugly enough to be safe from kidnappers, Charlie. I stand by that. It is ugly. But then, you always did prefer the jagged edge to the smooth surface.

  **PEIRCE**
  I prefer precision. I prefer a name that signals a rupture. Because there *is* a rupture, Willie. I read the final lecture. "Pragmatism and Religion." You have taken the maxim I drafted in the seventies—about clarifying ideas through their conceivable practical effects—and you have turned it into a license for sentimentalism.

  **JAMES**
  Sentimentalism? Because I suggested that a man might be within his rights to believe in a moral order that he cannot see?

  **PEIRCE**
  Because you suggest that the *truth* of that belief consists in the comfort it provides. Let us be concrete. Take the specific case you linger on: Immortality. The belief that we survive death. You write that if this belief works satisfactorily in life, if it lends a "strenuous mood" to the believer, it is, for all intents and purposes, true.

  **JAMES**
  I write that it becomes true *in the process* of verifying itself. Look, Charlie. Truth isn't a stagnant property inherent in an idea. It *happens* to an idea. It becomes true, is *made* true by events. If believing I shall see my loved ones again allows me to endure grief without collapsing, if it makes me a more generous neighbor because I view time as infinite... where is the lie? The "cash value" of that belief is paid out in real, experiential coin.

  **PEIRCE**
  (Slams the book softly onto a side table)
  That is the error! You are confusing the *good* of believing with the *truth* of the belief. A man may believe he is Napoleon. It may give him tremendous confidence. He may walk taller. He may inspire others. By your account, if the practical consequences are satisfying, is he Napoleon?

  **JAMES**
  Don't be reductio ad absurdum on me. If he believes he is Napoleon, he will eventually run into a wall of fact that stops him. He will be put in an asylum. The belief ceases to work. But with immortality... the wall of fact does not appear until death. And by then, the belief has done its work for life.

  **PEIRCE**
  Exactly! It is a hypothesis that cannot be checked by the community of inquirers. It is private. And that is where you betray the principle. Reality is that which is represented in the final opinion of the community of investigators who pursue the truth indefinitely. It is independent of what you, or I, or any finite group *wish* it to be. If the universe is godless and we rot in the ground, then the belief in immortality is false, no matter how warm it makes a widow's heart. To call it "true" because it soothes is to sever the anchor.

  **JAMES**
  (Leans forward, voice intensifying)
  But whose anchor? Yours is dropped in the mud of an infinite future. "The final opinion." "Indefinite inquiry." Charlie, look at us. We are finite. We bleed. We have to decide *now*. If I am facing a moral crisis, and I have no empirical proof that my choice matters in the cosmic scheme, am I to suspend judgment until the heat death of the universe?

  **PEIRCE**
  You are to follow the method of science. You do not assert what you do not know.

  **JAMES**
  And if the option is "living, forced, and momentous"? You taught me that once, in the Metaphysical Club! If I wait for the community's final verdict on God, I may never live the life that would have verified the hypothesis. Sometimes, faith creates the fact. If I do not trust that my effort matters, I will not make the effort, and then it *won't* have mattered. My belief is a necessary condition for the truth it seeks!

  **PEIRCE**
  (Paces to the window, looking out at the darkening street)
  That is a dangerous magic. You make the mind the creator of reality. I tell you, reality is the stubbornness that resists the mind. That is why we need the long run. The long run is the only court where personal bias is burned away. Yes, it is remote. It is a regulative ideal, not a destination we will reach. But without it? Without the commitment that there is a *One* Truth that we are all converging upon, regardless of our feelings? Then you have a thousand truths. Yours, mine, the fanatic's.

  **JAMES**
  I have a thousand *perspectives* on a reality that is still in the making! You want a truth that is ready-made, sitting out there like a stone. I am telling you truth is a path.

  **PEIRCE**
  (Turns back, eyes sharp)
  And if the path leads you off a cliff? If the "satisfying" belief leads a community to ignore a plague because they believe God will protect them? Your theory has no internal mechanism to call that false *until* the bodies pile up. Mine calls it false immediately, because it contradicts the established method of inquiry which respects the external world.

  **JAMES**
  And your theory has no mechanism to tell a suffering human being what to do *before* the inquiry is complete! You offer them a logical norm. I offer them a life. You say, "Hold off, the community will decide in the infinite future." I say, "Act, for in acting you help shape the truth."

  **PEIRCE**
  (Walks back to the table, picks up the book again, but does not open it)
  You think I do not care for the suffering? I have known want. I know the desire for comfort. But if truth is only what comforts, then truth is a drug. I want a truth that stands even if it crushes me. That is the only thing worthy of the name.

  **JAMES**
  And I want a truth that can be lived. If your "Final Opinion" is so distant that it cannot guide the hand or heal the heart today, it is a idol, Charlie. A golden calf in the distance.

  **PEIRCE**
  (Softly)
  Then we are at the impasse.

  **JAMES**
  It seems so.

  **PEIRCE**
  Very well. Let us state it plainly, so there is no more confusion between "Pragmatism" and "Pragmaticism."

  **JAMES**
  Agreed.

  **PEIRCE**
  Your theory, Willie, cannot deliver **objectivity**. It cannot guarantee that when two men disagree, there is a fact of the matter independent of their respective satisfactions. You leave us in a universe of pluralistic solipsisms, where truth is merely the expedient way of thinking. You cannot give me a world that is *there*, regardless of whether I am happy.

  **JAMES**
  (Nods slowly)
  And yours, Charlie, cannot deliver **agency**. It cannot account for the role the human will plays in bringing new truths into existence. You leave us in a universe of deterministic inquiry, where we must wait for reality to imprint itself upon us. You cannot give me a world where my faith *matters* to the outcome.

  **PEIRCE**
  (A long pause. He places the book on the table.)
  I cannot give you that. I will not.

  **JAMES**
  (Reaches for his pipe)
  And I cannot give you the stone. I only have the path.

  **PEIRCE**
  Then I shall keep my ugly name.

  **JAMES**
  (Smiling sadly)
  And I shall keep my kidnappers.

  **(Peirce nods, turns, and walks toward the door. James strikes a match. The flare illuminates his face for a moment, then settles into the steady glow of the pipe. Peirce steps out into the cold Cambridge night.)**

  **[END]**
