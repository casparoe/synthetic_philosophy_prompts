      *   *Nuance:* Augustine is a deontologist regarding lying (never lie). Yudkowsky is a consequentialist regarding information (minimize harm/leak). This explains the divergence. Augustine won't lie to say "No" when the answer is "Yes." So he needs a way to not say "Yes" without implying "Yes."

