          *   *Selection Bias:* As the user noted, only someone hiding someone would say this. An innocent bystander would say "I have no idea." So the statement itself incriminates the speaker as an accomplice, even if it doesn't reveal the location.
      *   *Verdict:* It trades *location* secrecy for *complicity* secrecy. It saves the fugitive's specific location but sacrifices the protector's deniability.

