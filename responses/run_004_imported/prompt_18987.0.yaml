          *   *Real Options:* Frame engineering bets as options, which aligns better with EV than Kelly.
      *   **Alternative Frameworks:** Suggest established product/engineering prioritization frameworks that already account for risk/compounding (e.g., RICE with risk adjustments, Cost of Delay, Real Options).

