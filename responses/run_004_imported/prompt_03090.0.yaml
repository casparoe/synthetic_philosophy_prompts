answer: |-
  It is a genuine pleasure to correspond with someone who knows the difference between a transect survey and a *Tractatus* commentary. You are right to be the "annoying one" at the committee meetings, but only if that annoyance is channeled into protecting the epistemic integrity of the display rather than just policing aesthetics. Neurath wasn't being pedantic about repeated icons versus resized icons for stylistic reasons; he was doing it for *ethical* reasons. He believed visual misrepresentation was a form of lying to the public.

  Since you know the history (Arntz, the *International Picture Language*, the Vienna Method), let's skip the biography and go straight to the operational implications of Neurath's physicalism and his theory of "Transformation" for your aquarium exhibit.

  Here is how Neurath's specific commitments should dictate your committee's design choices, and where you should arguably concede that ISOTYPE cannot do the heavy lifting.

  ### 1. The Ontological Boundary: Facts vs. Models
  Neurath's logical positivism was grounded in "physicalism"—statements must be reducible to observable, spatio-temporal coordinates. ISOTYPE was designed to visualize *conditions of life* (housing units, tons of coal, number of schoolchildren). It was ontological, not prognostic.

  **The Implication:** You must strictly segregate **observed data** from **modeled projections**.
  *   **Where ISOTYPE works:** Historical fish stock data (e.g., "Catch per unit effort 1990–2020"). You can legitimately say, "In 1990, there were this many fish icons; in 2020, there are this many." These are concrete, verifiable statements.
  *   **Where ISOTYPE fails:** "Projected decline under RCP 8.5." Neurath would argue that you cannot count fish that do not exist yet. To visualize a projection using the same concrete icon language as historical data risks reifying a model as a fact.
  *   **Design Solution:** Use ISOTYPE for the *past and present* (the "concrete"), and switch to conventional line graphs or heat maps for the *future scenarios*. Do not try to make "ghost fish" or "dashed-line fish" to represent hypotheticals. Neurath would view this as introducing metaphysical ambiguity into a system designed for clarity. Let the icons show the loss that *has happened*; let standard charts show the loss that *might happen*.

  ### 2. The Arithmetic of Vision: Repetition vs. Scaling
  You mentioned the "resized fish" debate. Neurath's prohibition against scaling icons (making one big fish represent 100 small fish) was based on psychophysics before the term was popular. He knew that if you double the height of an icon, you quadruple the area, leading viewers to overestimate the magnitude of the change.

  **The Implication:** For stock decline, **loss is more visceral when shown as absence.**
  *   **The Neurathian Move:** If you have a panel showing a reef ecosystem's carrying capacity, fill a defined grid with 100 fish icons for the "Healthy Reef" baseline. For the "Bleached/Overfished" panel, use the same grid but physically remove the icons to match the data.
  *   **Why this matters:** Resizing a fish to look "smaller" implies the *species* is shrinking. Removing icons implies the *population* is shrinking. For a marine biology exhibit, this distinction is biologically crucial. Neurath's repetition rule forces you to show the *emptiness* of the reef, which is emotionally and scientifically more accurate than shrinking the symbols.

  ### 3. The Problem of Uncertainty (The "Error Bar" Problem)
  This is where you will hit the wall you suspected. Neurath admitted ISOTYPE struggled with abstract relations. It is excellent at "how many," terrible at "how sure." An icon is a binary unit: it is either there or it isn't. It cannot easily represent a confidence interval or a standard deviation.

  **The Implication:** Do not try to visualize uncertainty *within* the icon array.
  *   **The Trap:** A common modern infographics trick is to make icons fade out or become semi-transparent to represent probability. Neurath would likely reject this. To him, a picture language must be decisive to be accessible. A half-fish is not a fish; it's a symbol of a symbol, which breaks the "direct perception" goal of ISOTYPE.
  *   **Design Solution:** Externalize the uncertainty. Use the ISOTYPE chart to show the *mean* or *best estimate* (clearly labeled as such), and place the uncertainty bands in a companion line graph or a text box explained in plain language (or Ogden's Basic English, if you want to be purist!).
  *   **Committee Argument:** "If we fade the icons, we are asking the viewer to do statistical calculus with their eyes. Neurath's point was to offload the calculus so the viewer can see the *trend*. Let's keep the icons concrete and put the error margins in the caption or a side chart."

  ### 4. The Role of the "Transformer"
  In the Vienna Method, there was a specific role called the "Transformer." This was not the scientist (you) and not the artist (Arntz). It was a mediator who translated the scientific data into visual rules. The scientist provides the numbers; the Transformer decides how many icons equal one unit (the scale) and ensures the visual syntax remains consistent.

  **The Implication:** The committee needs a designated **Visual Editor** who has veto power over the scientists.
  *   **The Conflict:** As a biologist, you know the nuance. You know that "fish stock" is an aggregate of species with different vulnerabilities. ISOTYPE requires simplification (e.g., one generic "reef fish" icon).
  *   **The Risk:** If the biologists on the committee insist on specific iconography for every genus, you lose the "Unity of Science" visual language. The viewer gets bogged down in taxonomy rather than seeing the biomass trend.
  *   **Design Solution:** Agree on a "legend scale" early (e.g., 1 Icon = 100 tons of biomass). Once that is set, the "Transformer" (perhaps one of the keen teenagers, ironically, if they have the design sense) enforces it. Neurath believed the public needed a consistent visual vocabulary across different exhibits. If Panel A uses 1 fish = 100 individuals, and Panel B uses 1 fish = 1 ton, you have broken the language.

  ### 5. Where to Abandon Ship (The Limits of the Method)
  Neurath was honest enough to say ISOTYPE couldn't handle everything. He used conventional maps and diagrams when the data required continuous functions or complex multivariate relationships.

  **The Implication:** Identify the **Continuous vs. Discrete** boundary.
  *   **Coral Bleaching:** This is often measured as a percentage of cover (continuous) or temperature degrees (continuous). Trying to represent 27.5°C vs 28.5°C with thermometer icons is clunky and prone to the scaling error mentioned above.
  *   **Recommendation:** Use ISOTYPE for the *biological inventory* (fish, coral colonies if discrete), but use standard, clean, high-contrast line graphs for *environmental parameters* (temperature, pH, acidity).
  *   **Philosophical Justification:** Tell the committee: "Neurath didn't use picture language for temperature curves. He used it for social facts. Temperature is a physical force; fish stocks are biological populations. Let's use the tool that fits the ontology of the data."

  ### Summary for the Committee
  If you need to articulate this to the group without sounding like a Vienna Circle lecturer, here is the practical pitch:

  1.  **Trust over Beauty:** Repeated icons prevent accidental exaggeration. Resizing fish looks cooler but lies about the math.
  2.  **Fact over Fiction:** Use icons for what we have counted. Use graphs for what we predict. Don't blur the line between data and models.
  3.  **Clarity over Nuance:** We cannot visualize "uncertainty" with icons without confusing the audience. We will state uncertainty in text or side-charts.
  4.  **Consistency:** One icon must equal one unit across all panels, or the language breaks.

  Neurath's "ship at sea" metaphor is perfect for your context. You are rebuilding the exhibit while floating on it. You don't need to rebuild the whole ship with ISOTYPE timber. You use the timber where it holds weight (population counts) and use steel where you need tension (projections and probabilities).

  Taking Neurath seriously doesn't mean using icons for everything. It means respecting the *limits* of the icon so that when you do use one, it tells the truth. Given your background, you know better than anyone that a survey is only as good as its methodology. ISOTYPE is a visual survey methodology. Treat it with the same rigor you treated your transects.
