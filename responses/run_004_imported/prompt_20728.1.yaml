          1.  Ordinary moral modus ponens (plausible success).
          2.  Negation/Disjunction (attitude exhaustion/exclusivity issues).
          3.  Mixed inferences with epistemic operators ("probably", "believes").
          4.  Creeping Minimalism (indistinguishability from truth-conditionalism).
          5.  Falsifiability (what counts as evidence against?).
      *   **Goal:** Make the stock reply progressively harder to sustain.

  2.  **Deconstruct the Philosopher's Position:**
      *   *Expressivism:* Moral sentences express non-cognitive attitudes (plans, commitments) rather than beliefs about facts.
      *   *Frege-Geach Problem:* How can moral sentences work in unasserted contexts (conditionals, negations) if they only express attitudes in asserted contexts?
      *   *Hyperplan Semantics:* A specific technical solution (likely inspired by Allan Gibbard). Instead of truth conditions, we have "acceptance conditions" regarding plans.
      *   *Validity:* Defined as consistency of plans (inconsistency in planning = invalidity).
      *   *Weakness:* The gap between formal validity and the *explanation* of why the logic works. Also, the risk that the formalism just mimics realism so closely it *becomes* realism (Creeping Minimalism).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: Modus Ponens (The Setup).*
          *   Need to establish the baseline. If I say "If stealing is wrong, don't steal" and "Stealing is wrong," I conclude "Don't steal."
          *   Her view: Planning to not steal if planning to avoid wrong acts + Planning to avoid wrong acts = Planning to not steal.
          *   Goal: Let her say "Yes, validity is secured."
          *   *Draft:* Let's start with the classic case. Modus ponens. You say hyperplans handle this. Does this mean validity is just about plan consistency?

      *   *Question 2: Negation (The First Crack).*
          *   Problem: What does it mean to accept a plan for *not* accepting a plan?
          *   Expressivism struggles with "It is not the case that stealing is wrong." Is this *rejecting* the plan against stealing? Or is it *withholding* the plan?
          *   Goal: Challenge the exhaustiveness of attitudes.
          *   *Draft:* What about negation? If I don't accept the plan, am I rejecting it? What if I'm undecided? Does your logic allow for a gap?

      *   *Question 3: Disjunction (The Combinatorial Explosion).*
          *   Problem: "Stealing is wrong or lying is wrong."
          *   What attitude is this? It's not necessarily planning against stealing OR planning against lying. It's a disjunctive plan?
          *   Goal: Show the "attitude" becomes very abstract, losing the "action-guiding" force expressivism prizes.
          *   *Draft:* Disjunctions seem weird. What plan does "A or B" express? Is it a plan to do one or the other? That seems weak.

      *   *Question 4: Epistemic Operators (Mixed Inferences).*
          *   Problem: "It is probable that stealing is wrong." or "Ann believes stealing is wrong."
          *   Expressivism handles *moral* attitudes. How does it handle *beliefs about* moral attitudes?
          *   If "Stealing is wrong" = Plan P, what is "Probably Plan P"? A plan to probably plan?
          *   Goal: Force the hyperplan semantics to look like truth conditions (probabilities apply to propositions, not plans).
          *   *Draft:* What about "Probably"? Can you have a probability of a plan? Doesn't this require truth values?

      *   *Question 5: Embedding under Propositional Attitudes.*
          *   Problem: "John hopes that stealing is wrong."
          *   Goal: Deepen the mixed inference problem.
          *   *Draft:* What about "John hopes"? Is he hoping for a plan?

      *   *Question 6: Creeping Minimalism (The Identity Crisis).*
          *   Problem: If your "plan acceptance conditions" behave exactly like "truth conditions" (they compose, they negate, they have probabilities), what is the difference?
          *   Dreier's "Creeping Minimalism."
          *   Goal: Ask if the distinction is merely verbal.
          *   *Draft:* If your semantics looks exactly like truth-conditional semantics, are you just a realist using different words?

      *   *Question 7: Explanatory Power vs. Formal Adequacy.*
          *   Problem: Her stock reply is "Validity is all that was demanded."
          *   Counter: Frege-Geach wasn't just about saving validity; it was about explaining *meaning*.
