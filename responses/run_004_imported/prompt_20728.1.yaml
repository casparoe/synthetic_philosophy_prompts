      *   *Question 8: Falsifiability (The Kill Shot).*
          *   Problem: If every objection is met with "my formalism handles it," how can she be wrong?
          *   Goal: Ask for truth conditions of her own theory (ironically).
          *   *Draft:* What would prove you wrong? If your system can model anything, is it empirical?

