answer: |-
  1.  **The Baseline Case:** Let's begin with the standard case where your hyperplan semantics seems most at home. In a simple moral *modus ponens*—"If stealing is wrong, don't steal; stealing is wrong; therefore, don't steal"—you argue that validity is preserved because the plan accepted in the conclusion is contained in the plans accepted in the premises. If I understand correctly, your claim is that so long as the agent's planning state is consistent, the inference holds. Is it fair to say that for these atomic cases, you take the preservation of plan-consistency to be a sufficient proxy for logical validity?

  2.  **The Problem of Negation:** Moving slightly deeper, consider the negation of a moral claim: "Stealing is not wrong." On a truth-conditional view, this flips a truth value. On your view, it must flip an attitude. But human attitudes aren't strictly binary; I can fail to accept a plan without actively rejecting it—I might simply be undecided. Does your semantics force a false dichotomy where an agent must either accept the plan or accept the negation of the plan, and if so, doesn't that misdescribe the phenomenology of moral uncertainty?

  3.  **Disjunction and Attitude Complexity:** This tension seems to sharpen with disjunctions, such as "Either stealing is wrong or lying is wrong." What specific plan is expressed here? It cannot be a plan to avoid stealing, nor a plan to avoid lying. If the attitude expressed is something like "accepting a plan to avoid whichever act turns out to be in the forbidden set," does the concept of a "plan" remain action-guiding in the way expressivism requires, or does it become so abstract that it loses its distinctive non-cognitive character?

  4.  **Epistemic Operators:** Let's introduce an epistemic operator: "It is probably the case that stealing is wrong." Probabilities are standardly applied to propositions with truth values. If moral sentences express plans, what does it mean to assign a probability to a plan? Are you suggesting I can have a "partial plan," or does your semantics implicitly require that the object of the probability is a proposition *about* my plans, rather than the plan itself?

  5.  **Propositional Attitudes:** The pressure increases with embeddings under propositional attitudes, such as "Ann believes that stealing is wrong." If "stealing is wrong" expresses a plan, does Ann believe a plan? Or does she believe *that she has* a plan? If it's the latter, aren't we sliding back into a cognitive state about a psychological fact, which looks suspiciously like the moral realism you aim to reject?

  6.  **Creeping Minimalism:** This brings us to the worry Jack Dreier called "creeping minimalism." If your hyperplan semantics successfully handles negation, disjunction, and epistemic embedding by assigning "acceptance conditions" that compose exactly like truth conditions, what substantive difference remains between your view and an error-theoretic realism? If the formal machinery is indistinguishable, is the claim that you are an "expressivist" merely a verbal difference rather than a metaphysical one?

  7.  **Validity vs. Explanation:** You've mentioned in previous talks that securing validity is "all the Frege-Geach problem ever demanded." But many critics argue the problem was never just about saving the *validity* of inferences, but about explaining the *meaning* of the sentences in unasserted contexts. If your solution secures validity by making moral sentences function formally like propositions, have you solved the problem by abandoning the core expressivist insight that moral language is fundamentally different from descriptive language?

  8.  **Falsifiability:** Finally, if your response to every embedding puzzle is that the hyperplan machinery can be extended to secure validity, and if validity is the sole criterion for success, what would actually count as evidence against your solution? Is there any logical phenomenon or linguistic data that your semantics could *not* accommodate, or has the theory been structured in a way that makes it immune to refutation?
