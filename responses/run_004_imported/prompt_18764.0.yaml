answer: |-
  This is a sophisticated objection that cuts to the heart of contemporary metaethics. You have correctly identified the crux of Sharon Street's defense of her constructivist view: she attempts to drive a wedge between moral beliefs and logical/mathematical beliefs by arguing that the latter enjoy a "tracking" relationship between fitness and truth that the former lack.

  To argue rigorously that this asymmetry fails, we must demonstrate that the evolutionary mechanism operates identically in both domains: it selects for *behavioral success*, not *representational accuracy*. If the Evolutionary Debunking Argument (EDA) relies on the premise that evolution is indifferent to mind-independent truth, that indifference applies universally to all domains involving causally inert abstracta.

  Here is the argument that accepting the EDA against moral realism logically commits one to skepticism regarding basic arithmetic and logic.

  ### 1. The Causal Inertness Parallel (The Benacerraf-Field Challenge)

  The foundational premise of the EDA is that moral facts (on the realist view) are causally inert. They exist outside the natural order and cannot physically interact with our brains to cause beliefs. Therefore, if we have true moral beliefs, it is a coincidence that our evolutionary history aligned with them.

  However, this is precisely the **Benacerraf-Field challenge** regarding mathematical Platonism. If mathematical objects (numbers, sets, logical relations) are mind-independent, abstract, and non-spatiotemporal, they are also causally inert. A number cannot push a neuron.

  Street attempts to bypass this by arguing that while we can't interact with numbers, our beliefs about numbers interact with the physical world (e.g., counting predators). But this conflates the *application* of math with the *truth-maker* of math.
  *   **Moral Realism:** The fact "suffering is bad" causes nothing. Evolution selects for the *belief* "suffering is bad" because it promotes cooperation.
  *   **Math Realism:** The fact "2 > 1" causes nothing. Evolution selects for the *belief* "2 > 1" because it promotes evasion.

  In both cases, the causal story of the belief's origin terminates in survival value, not in the abstract fact itself. If the causal inertness of moral facts generates a skeptical gap, the causal inertness of mathematical objects generates the exact same gap. To claim evolution "tracks" mathematical truth is to imbue natural selection with a sensitivity to abstract relations that it demonstrably lacks. Selection pressures are physical; abstract truths are not. There is no mechanism by which physical pressure can "grasp" abstract truth, whether moral or mathematical.

  ### 2. The Contingency of the Adaptive Link

  Street's core asymmetry claim is that in mathematics, true beliefs are necessarily more adaptive than false ones, whereas in morality, false beliefs could be just as adaptive. She argues you *must* believe $2+2=4$ to successfully navigate a world with two predators.

  This claim relies on a conflation of **instrumental reliability** and **representational accuracy**. Evolution selects for cognitive mechanisms that produce survival-conducive *behavior*, not necessarily true *propositions*. It is entirely possible to construct a cognitive system that produces false mathematical beliefs that are nonetheless fitness-enhancing.

  Consider the "Systematic Error" hypothesis:
  *   Imagine an ancestor who perceives predators not as discrete integers but as a "threat mass."
  *   Suppose this ancestor operates on the heuristic: "If threat mass is high, run."
  *   Suppose this ancestor, when asked to articulate the belief, says, "There are three predators," when there are actually two.
  *   **Result:** The ancestor survives. The behavior is adaptive. The mathematical belief is false.

  Evolution does not select for the proposition "2 > 1"; it selects for the fear response associated with visual stimuli. The fact that our current cognitive architecture maps those stimuli onto the *true* proposition "2 > 1" is a contingent feature of our specific neurology, not a necessary feature of survival. We could have evolved to be "mathematical fictionalists" who act *as if* numbers exist without believing they do, or we could have evolved with systematically false arithmetic that nonetheless yielded correct survival decisions (e.g., always overestimating counts to be safe).

  If the alignment between "fitness-enhancing math beliefs" and "true math beliefs" is contingent rather than necessary, then the EDA applies. The realist must explain why evolution didn't select for the false-but-useful arithmetic. If they cannot explain this for morality (where "kin loyalty is good" might be false but useful), they cannot explain it for arithmetic.

  ### 3. The Global Reliability of Cognitive Faculties

  The EDA is often framed as a "local" challenge to morality, but it is actually a "global" challenge to any cognitive faculty shaped by evolution. We do not have a "moral module" and a "math module" that evolved independently. We have general reasoning faculties (pattern recognition, causal inference, spatial reasoning) that are applied to both domains.

  If the EDA proves that our moral faculties are unreliable because they were shaped for fitness rather than truth, it proves that our *general reasoning faculties* are unreliable for the same reason.
  *   **Premise 1:** Evolution selects for cognitive traits that enhance reproductive fitness.
  *   **Premise 2:** Reproductive fitness does not require beliefs to match mind-independent reality (abstract or otherwise).
  *   **Premise 3:** Our mathematical and logical beliefs are produced by the same cognitive faculties shaped by evolution.
  *   **Conclusion:** Our mathematical and logical beliefs are not justified as tracking mind-independent reality.

  To resist this, the realist must argue that logic and math are somehow "immune" to the distorting effects of fitness pressures. But logic and math are processed by the same brains that process moral intuitions. If the brain is a "fitness engine" rather than a "truth engine," it is a fitness engine across the board. To exempt logic is to engage in special pleading.

  ### 4. The Circularity of the "Third Factor" Defense

  Street and other realists often employ a "Third Factor" explanation to save mathematics. They argue: "Survival requires successful action; successful action requires true beliefs about the world; therefore, evolution selects for true beliefs."

  This argument is viciously circular when applied to the EDA.
  1.  To argue that evolution selects for *true* logical beliefs, you must assume that *true* logical beliefs are required for survival.
  2.  But how do you know true logical beliefs are required for survival? You know this by using logic to analyze the environment.
  3.  But the EDA challenges the reliability of that very logic.

  You are using the faculty in question (logic) to prove the reliability of the faculty in question, based on premises derived from that faculty. This is epistemically circular.

  The same move is available to the moral realist. A moral realist can say: "Survival requires cooperation; cooperation requires true moral beliefs (e.g., that reciprocity is good); therefore, evolution selects for true moral beliefs." If Street rejects this moral "Third Factor" argument as insufficient to bridge the gap between fitness and truth, she must, by parity of reasoning, reject the mathematical "Third Factor" argument. If the link between "cooperation" and "moral truth" is too tenuous to save morality, the link between "predator avoidance" and "mathematical truth" is equally tenuous in the context of evolutionary causation.

  ### 5. Conclusion: The Dilemma

  The asymmetry Street proposes rests on the intuition that math is "objective" in a way morality is not. But the EDA does not target the *content* of the beliefs; it targets the *genealogy* of the beliefs.

  If the genealogy of our moral beliefs is explained entirely by fitness pressures indifferent to moral truth, then our confidence in moral realism is undermined. But the genealogy of our logical and mathematical beliefs is *also* explained entirely by fitness pressures indifferent to logical truth. Evolution does not "know" the Law of Non-Contradiction; it only knows that organisms who don't walk off cliffs survive.

  Therefore, you are correct: **The Evolutionary Debunking Argument is a double-edged sword.**
  *   **Option A:** Accept the EDA against morality. This forces you to accept skepticism about the mind-independent truth of logic and arithmetic (perhaps adopting a fictionalist or pragmatist view of math).
  *   **Option B:** Reject the EDA against logic and arithmetic (maintaining that evolution *does* track abstract truth). If you do this, you must allow that evolution *could* track abstract moral truth as well, thereby defanging the EDA against moral realism.

  Street attempts to have it both ways: using the EDA to kill moral realism while shielding logic from the same blast. Rigorous analysis shows the shielding fails. The causal mechanism of natural selection is blind to abstract truth *as such*. If that blindness debunks morality, it debunks everything that relies on abstract reasoning. To save logic, one must admit that evolution can track truth, and in doing so, one opens the door to saving morality.
