      *   **Specific Focus:** Sharon Street's response. She claims an asymmetry: in math/logic, truth and fitness track each other; in morality, they don't.
      *   **Task:** Argue *rigorously* that Street's proposed asymmetry *does not hold up*. I need to defend the position that accepting EDA against moral realism commits one to skepticism about basic arithmetic and logic.
      *   **Constraint:** I must argue *for* the user's friend's intuition (and against Street's distinction), even if philosophical consensus might be mixed. The prompt asks me to "Please argue... that this proposed asymmetry does not actually hold up."

  2.  **Deconstruct Sharon Street's Position:**
      *   Street is a constructivist/anti-realist. She uses the EDA to undermine realism.
      *   Her distinction:
          *   *Math/Logic:* If you believe $2+2=4$, you act successfully (e.g., avoid two predators). If you believe $2+2=5$, you might get eaten. Therefore, evolutionary pressure selects for *true* mathematical beliefs because true mathematical beliefs are practically useful. There is a "tracking" relation.
          *   *Morality:* If you believe "kill kin = bad," you protect your genes. If you believe "kill kin = good," you might kill your kin and lose genes. But the *truth* of the moral claim (whether "kill kin = bad" is mind-independently true) is irrelevant to the survival benefit. The belief is useful regardless of its truth value. Therefore, no tracking.

  3.  **Brainstorming Counter-Arguments (Attacking the Asymmetry):**
      *   *Goal:* Show that the relationship between fitness and truth in math/logic is just as indirect or coincidental as in morality.
      *   *Argument 1: The "Third Factor" or "Pre-established Harmony" problem applies to both.* In math, evolution selects for *survival-enhancing* beliefs, not *true* beliefs. It just so happens that true arithmetic beliefs are often survival-enhancing. But this is still a coincidence from the perspective of the mechanism. Evolution doesn't "care" about truth.
      *   *Argument 2: The Scope of "Basic" Arithmetic.* Evolution selects for small number cognition (subitizing), not Peano axioms. We have no evolutionary reason to trust beliefs about large primes or transfinite sets. If the EDA undermines the *foundation* (the cognitive mechanism), it undermines the whole structure.
      *   *Argument 3: The "Usefulness" vs. "Truth" Conflation.* Street argues usefulness implies truth in math. But a false belief can be useful. (e.g., Newtonian physics is false but useful for building bridges; maybe "2+2=4" is a useful heuristic but not metaphysically true in a Platonist sense).
      *   *Argument 4: The Causal Connection.* In moral realism, moral facts are causally inert. In mathematical Platonism, mathematical objects are also causally inert. If the objection to morality is that we can't causally interact with moral facts, the same applies to mathematical objects. If evolution explains moral beliefs without moral facts, it explains math beliefs without mathematical objects (nominalism/psychologism).
      *   *Argument 5: The "Off-Track" Possibility.* Could evolution have selected for *false* math beliefs that were useful? Yes. Maybe perceiving 2 predators as 3 triggers more adrenaline and saves you. The link between truth and fitness is contingent, not necessary.

  4.  **Developing the Rigorous Argument (Structuring the Essay):**
      *   **Introduction:** Acknowledge the strength of the EDA and Street's specific "tracking" defense. State the thesis: The asymmetry is illusory because the causal mechanism of evolution is insensitive to abstract truth in *both* domains.
      *   **Point 1: The Causal Inertness of Abstract Objects.** Both moral facts (for realists) and mathematical objects (for Platonists) are non-natural and causally inert. Evolution operates in the causal, physical realm. If evolution can't "see" moral facts, it can't "see" numbers.
      *   **Point 2: The Contingency of Fitness-Truth Alignment.** Street claims true math beliefs are necessarily fitness-enhancing. Challenge this. False math beliefs could be fitness-enhancing (e.g., overcounting predators). The alignment is contingent on the environment, just like morality.
      *   **Point 3: The Generality of the Cognitive Mechanism.** We don't have a "math module" and a "moral module" selected separately for truth. We have general reasoning faculties. If the EDA casts doubt on the reliability of faculties shaped for fitness rather than truth, it casts doubt on the whole faculty, not just the moral output.
      *   **Point 4: The "Third Factor" Reply cuts both ways.** Realists argue there's a third factor (e.g., survival requires cooperation, cooperation requires truth). But this requires assuming the truth of the beliefs to explain the selection, which is circular. This circularity applies to math too.
      *   **Conclusion:** If one accepts the EDA premise (evolution is indifferent to abstract truth), one must accept the skeptical conclusion for all abstract domains. To save math, one must save morality, or abandon the EDA premise.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Check:* Am I being too aggressive on Platonism? Not all math realists are Platonists. *Correction:* Focus on the version of realism that posits mind-independent truths, as that's the target of the EDA.
      *   *Check:* Street's specific argument is about the *content* of the beliefs. She says the content of basic math *is* about survival-relevant things. *Counter:* Basic math content is about abstract relations, not predators. The *application* is survival-relevant. The *truth* is not.
      *   *Key Distinction:* Distinguish between *instrumental reliability* (getting what you want) and *representational accuracy* (matching mind-independent reality). Evolution selects for the former. Realism requires the latter. This gap exists in both math and morality.

