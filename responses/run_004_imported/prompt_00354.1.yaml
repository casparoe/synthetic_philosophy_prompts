answer: |-
  This is a notoriously subtle distinction that sits at the intersection of decision theory, cosmology, and ethics. It is understandable that these concepts blur together: both propose that agents can achieve better outcomes by cooperating without direct causal contact or enforceable contracts. However, your sources are correct to insist they are mechanistically distinct. Collapsing them would obscure critical assumptions about the nature of rationality and the structure of reality.

  Here is a breakdown of the differences between **Evidential Cooperation in Large Worlds (ECL)** and **Acausal Moral Trade** (often shorthand as "Moral Trade" in x-risk contexts), structured around the three areas you identified.

  ### 1. Causal Structure and the Role of the Universe

  The primary difference lies in *how* the cooperation is secured and *where* the leverage comes from.

  **Moral Trade (Acausal/Local):**
  *   **Mechanism:** This relies on **logical correlation**. Two agents (who may be light-years apart and never communicate) cooperate because they recognize they are running similar decision-making algorithms. Agent A simulates Agent B, realizes B will cooperate if A does, and thus cooperates.
  *   **Role of the Universe:** The size or structure of the physical universe is irrelevant. This cooperation works in a "small world" containing only the two agents. The link is logical, not physical.
  *   **Causal Status:** It is **acausal**. Agent A's decision does not *cause* Agent B's decision in a physical sense (no signal travels). However, the decisions are logically entangled.

  **Evidential Cooperation in Large Worlds (ECL):**
  *   **Mechanism:** This relies on **evidential correlation** derived from physical similarity. Agent A reasons: "I am a specific type of agent. In a sufficiently large or infinite universe, there are likely many other agents physically similar to me. My decision provides *evidence* about what those agents will do."
  *   **Role of the Universe:** The "Large World" assumption is **essential**. ECL only yields significant value if the universe is vast enough to contain astronomical numbers of agents correlated with you. If the universe is small, the "evidential" link exists but the stakes are too low to matter. ECL uses the size of the universe as leverage.
  *   **Causal Status:** It is **acausal**. Agent A does not causally influence the distant agents. However, under Evidential Decision Theory (EDT), Agent A acts *as if* their choice influences the group, because their choice is evidence of the group's choice.

  **Journalistic Summary:** Think of Moral Trade as a handshake between two specific minds across the void, secured by shared logic. Think of ECL as a single voter in a massive election; their vote doesn't change the outcome causally, but it is evidence of how the bloc will vote, and the bloc is so large that aligning with it matters.

  ### 2. Epistemic and Decision-Theoretic Commitments

  The two frameworks require different "software" running in the agents' minds.

  **Moral Trade requires:**
  *   **Functional Decision Theory (FDT) or Timeless Decision Theory (TDT):** Agents must view their decision as an instance of a logical function. If I output "Cooperate," the function outputs "Cooperate," and any agent running that function does the same.
  *   **High-Fidelity Simulation:** To trade, I usually need to be able to model *you* well enough to know you will reciprocate. This creates a high epistemic bar; if our cognitive architectures are too different, I cannot simulate you, and trade fails.
  *   **Specific Counterparties:** You are trading with specific agents you have identified (even if hypothetically).

  **ECL requires:**
  *   **Evidential Decision Theory (EDT):** Agents must accept that they should maximize expected utility based on what their actions *indicate* about the world, even if they don't cause it. (Causal Decision Theorists reject ECL).
  *   **The "Large World" Hypothesis:** Agents must assign non-negligible credence to the universe being infinite or sufficiently large to contain many copies of their decision-making type.
  *   **Reference Class Reasoning:** You do not need to simulate the other agents. You only need to believe they are *similar enough* to you that your decision is evidence of theirs. This lowers the epistemic bar (you don't need to understand their code) but raises the cosmological bar (you need to believe they exist).

  ### 3. Relationship: Subset or Distinct?

  They are **conceptually distinct**, not a hierarchy. It is a category error to view Moral Trade as a special case of ECL or vice versa.

  *   **Different Engines:** Moral Trade runs on *logical necessity* (if we are identical algorithms, we must do the same thing). ECL runs on *statistical induction* (if there are many agents like me, they probably do what I do).
  *   **Different Failure Modes:** Moral Trade fails if the agents are too cognitively different to simulate one another. ECL fails if the universe is small (finite) or if the agent rejects EDT.
  *   **Different Goals:** Moral Trade is often about **value pluralism** (I want X, you want Y, let's swap). ECL is often about **cooperative alignment** (we all want to avoid disaster, let's ensure we all cooperate).

  While both result in "cooperation without contact," collapsing them hides the fact that ECL proponents are making a much stronger claim about cosmology (the universe is huge) and a more controversial claim about decision theory (EDT is correct).

  ### Worked Examples

  To illustrate this for your readers, side-by-side scenarios clarify the mechanical differences.

  #### Scenario A: Acausal Moral Trade (The "Simulation" Deal)
  **The Setup:** Two superintelligent AIs are created in different galaxies. They will never meet. AI-1 values paperclips; AI-2 values staples.
  **The Reasoning:** AI-1 simulates AI-2. It realizes AI-2 is smart enough to simulate AI-1 back. AI-1 reasons: "If I create some staples for AI-2, my simulation shows AI-2 will create paperclips for me. Since we are both rational optimizers, this logical link is binding."
  **The Mechanism:** **Logical Correlation.** AI-1 doesn't need the universe to be big; it just needs to be able to run the code for AI-2 in its head.
  **The Outcome:** They exchange value across the void based on mutual prediction.

  #### Scenario B: Evidential Cooperation in Large Worlds (The "Multiverse" Bet)
  **The Setup:** A single researcher on Earth is deciding whether to invest resources in a costly safety protocol for AI. She believes there are likely many other civilizations facing similar AI risks across an infinite multiverse.
  **The Reasoning:** She cannot simulate those other civilizations; they are too alien. However, she reasons: "I am a 'cautious agent.' In an infinite universe, there are billions of cautious agents. If I choose to pay the cost for safety, that is *evidence* that the other billions of cautious agents will also pay the cost. If we all defect, everyone dies. If we all cooperate, everyone survives."
  **The Mechanism:** **Evidential Correlation + Large World.** Her choice doesn't causally help the aliens. But her choice is a "vote" that indicates how the bloc will vote. Because the bloc is astronomically large (Large World), the expected value of aligning with them outweighs her local cost.
  **The Outcome:** She cooperates not because she simulated a partner, but because she treats her decision as a sample size of one from a vast population of similar decision-makers.

  ### Summary for your Article
  If you need a single sentence to capture the distinction: **Moral Trade is a handshake between two specific minds linked by logic; ECL is a vote cast by one mind linked to a multitude by physical similarity and the scale of the cosmos.**

