      *   **Move (3) Naomi:** Children are different. General parenting knowledge $\neq$ specific child knowledge. Uncertainty is still deep.
          *   *Analysis:* This pushes the definition of TE. If *any* specific difference counts, does it dilute the concept? Paul focuses on the *capacity* to parent and the *value* of the relationship, not just the child's temperament.
