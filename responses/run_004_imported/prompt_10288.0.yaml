      *   *Leibniz's Argument:* God is perfect (omnipotent, omniscient, omnibenevolent). A perfect being must choose the best option. Therefore, this world is the best.
      *   *Lewis's Metaphysics:* All worlds exist. No choice is made. There is no selector.
      *   *The Conflict:* If all worlds exist, there is no selection process. If there is no selection, there is no optimization. If there is no optimization, the "Best of All Possible Worlds" claim collapses.
