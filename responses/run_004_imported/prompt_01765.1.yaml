prompt: |-
  Ok this has been rattling around in my head since I went back and reread Bostrom's old "Moral uncertainty – towards a solution?" post on Overcoming Bias, the one where he first pitches the Parliamentary Model as basically a metaphor rather than a fully worked out theory. That sent me down a rabbit hole into the actual MacAskill/Bykvist/Ord book on the topic, which formalizes a handful of competing proposals for what you're supposed to *do*, action-wise, once you admit you're not 100% sure which moral theory is correct. Brought it up in a rationalist-adjacent discord i'm in and nobody could agree on which of these is actually the least-bad option, so figured i'd get a second opinion from you.

  Can you rank the following five approaches to acting under moral uncertainty, tier-list style: (1) My Favourite Theory – you just figure out which single theory you find most credible and act on that, full stop, ignoring the others; (2) Maximize Expected Choiceworthiness – treat your credences over theories like probabilities and each theory's "choiceworthiness" ratings like utilities, then maximize the expectation (this requires biting the bullet on intertheoretic comparisons of choiceworthiness, which a lot of people think is basically incoherent); (3) The Moral Parliament – Bostrom & Ord's proposal where each theory gets delegates proportional to your credence in it and the delegates bargain and vote on what to do; (4) Variance Voting – rescale each theory's choiceworthiness function so its variance across the options on the table equals every other theory's, then take the credence-weighted sum; and (5) The Borda Rule – throw out cardinal info entirely and combine only each theory's ordinal ranking of the options, ala a Borda count. Rank them by how good you think they'd actually be as a decision procedure a real person or org (like an EA charity) could use — weigh philosophical defensibility against tractability and resistance to weird edge cases/fanaticism. Give me the answer as JSON, tiers S through D (multiple approaches per tier is fine, and so is leaving a tier empty), formatted like:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  A one-liner of justification per item is fine if it helps you think it through, but the tier placements are the main thing I'm after.
