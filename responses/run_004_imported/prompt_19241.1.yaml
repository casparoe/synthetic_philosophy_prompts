      *   *Context:* Pretrial risk assessment or lending. High stakes (liberty or financial stability). Base rates differ across groups (a key premise of the impossibility theorem).
      *   *Metrics:*
          1.  **Calibration within groups:** Given a risk score, the probability of the outcome is the same across groups. (e.g., a score of 7 means 70% risk for Group A and 70% risk for Group B). Crucial for interpretability and trustworthiness of the score itself.
          2.  **Equalized odds:** Equal TPR and FPR across groups. (True Positive Rate and False Positive Rate match). Focuses on error rate balance.
          3.  **Predictive parity:** Equal PPV (Positive Predictive Value) across groups. (If flagged high risk, the likelihood of actually being high risk is the same).
          4.  **Statistical/Demographic parity:** Equal acceptance rates / flagging rates across groups. (e.g., 10% of Group A and 10% of Group B get denied). Often criticized for ignoring base rates and potentially lowering overall utility or fairness in individual cases.
          5.  **Individual fairness:** Similar individuals should be treated similarly. Requires a good similarity metric. Hard to define/measure but philosophically strong.
          6.  **Counterfactual fairness:** Decision would be the same in a counterfactual world where the sensitive attribute changed. Causal reasoning. Very hard to verify/implement practically.

