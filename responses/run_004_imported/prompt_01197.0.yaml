answer: |-
  Here is a draft argument structured for a dissertation chapter. It articulates the "Grain Objection" against Yablo's proportionality constraint, focusing on the lack of a principled basis for effect individuation and the resulting charge of question-begging.

  ***

  ### Title: The Grain of the Effect: Why Proportionality Fails to Resolve Exclusion

  **1. Introduction: The Proportionality Strategy**
  Stephen Yablo's intervention in the causal exclusion debate attempts to dissolve the conflict between mental and physical causation by reconfiguring the relationship between mental properties ($M$) and their physical realizers ($P$). Against Jaegwon Kim's claim that $P$ excludes $M$ because $P$ is causally sufficient for the effect ($E$), Yablo argues that $M$ and $P$ stand in a determinable/determinate relation. Utilizing a proportionality constraint on causation, Yablo contends that a cause must be commensurate with its effect: it must be specific enough to ensure the effect occurs, but not so specific that it includes irrelevant details. In the famous case of Sophie the pigeon, 'red' is the proportionate cause of the peck, whereas 'scarlet' is too specific (overdetermining), as Sophie would have pecked at any shade of red. Consequently, $M$ (the determinable) can be the true cause even if $P$ (the determinate) is present, ostensibly blocking Kim's exclusion argument.

  However, this solution rests on a precarious assumption regarding the individuation of the effect. I argue here that Yablo's proportionality constraint fails to rescue mental causation because it provides no principled, non-question-begging method for fixing the grain of description at which the effect is individuated. When the effect is individuated at the fine grain required by physical causal closure, the physical realizer regains its status as the proportionate cause, and the mental property is excluded as too general.

  **2. The Relativity of Proportionality**
  The core vulnerability in Yablo's account is that proportionality is not an intrinsic relation between a cause and the world; it is a relation between a cause *description* and an effect *description*. Whether a property counts as "proportionate" depends entirely on how we carve up the effect $E$.

  Yablo's model relies on two counterfactual conditions for a cause $C$ to be proportionate to $E$:
  1.  **Requirement:** If $C$ had not occurred, $E$ would not have occurred.
  2.  **Sufficiency:** If $C$ had occurred, $E$ would have occurred.

  In the Sophie case, 'scarlet' fails sufficiency because 'scarlet' implies 'not-crimson', yet Sophie would have pecked at crimson. 'Red' succeeds because it covers the relevant range of shades. However, this evaluation holds only if $E$ is described coarsely as "pecking." If we alter the description of $E$, the proportionality status of $M$ and $P$ inverts.

  **3. The Fine-Grained Physical Effect**
  The exclusion problem arises within a framework of physical causal closure, which dictates that every physical event has a sufficient physical cause. This framework implies an ontology where the "real" effects are physical events individuated by their precise spatiotemporal boundaries and microphysical properties.

  Consider the fine-grained description of Sophie's peck: not merely "pecking," but "the contraction of muscle fibers $x, y, z$ at time $t$ with force $f$ resulting from retinal stimulation $r$." Let us call this $E_{fine}$. At this level of granularity, the mental property 'red' ($M$) fails the sufficiency condition. $M$ is compatible with a wide range of physical realizers ($P_1, P_2, P_3...$ corresponding to different shades of red). However, different shades of red involve different wavelengths, resulting in slightly different retinal stimulations, which in turn necessitate slightly different neural firings to produce the motor output.

  If the specific shade had been crimson rather than scarlet, the specific motor output $E_{fine}$ would not have occurred; a *slightly different* motor output ($E_{fine}^*$) would have occurred instead. Therefore, relative to $E_{fine}$, the determinable $M$ is *too general*. It does not guarantee *this specific* physical effect. Conversely, the physical realizer $P$ (scarlet stimulation) is perfectly proportionate to $E_{fine}$ (specific motor output). $P$ is required for $E_{fine}$ (given the actual laws) and sufficient for $E_{fine}$. Thus, at the grain of description mandated by the physics underlying causal closure, the exclusion argument holds: $P$ excludes $M$.

  **4. The Problem of Principled Grain-Fixing**
  To salvage his position, Yablo must argue that we are justified in individuating the effect coarsely ($E_{coarse}$) rather than finely ($E_{fine}$). He might suggest that $E_{coarse}$ is the "relevant" effect for agency or explanation. However, this move invites a devastating charge of circularity.

  Why is "pecking" the metaphysically privileged effect rather than "specific muscle contraction"? If the criterion for selecting $E_{coarse}$ is that it is the level at which mental properties appear to be causally efficacious, then the proportionality constraint is not solving the exclusion problem; it is merely assuming the conclusion. The argument would run as follows:
  1.  Mental causation is real.
  2.  Therefore, we must individuate effects at a grain where mental properties are proportionate.
  3.  Therefore, mental properties are proportionate causes.

  This is question-begging. The exclusion problem challenges premise (1). Yablo cannot use the *desire* to save mental causation as the *principle* for individuating effects. There is no independent metaphysical fact of the matter that dictates "pecking" is the true effect while "muscle contraction" is merely a constituent. In a physicalist ontology, the fine-grained physical event is ontologically fundamental. To assert that the coarse-grained event is the "real" effect requires a justification that does not presuppose the causal efficacy of the supervenient properties.

  **5. Explanation vs. Causation**
  Proponents of Yablo often retreat to a pragmatic defense: while $P$ may be the cause at the fine grain, $M$ provides the better *explanation*. However, the exclusion problem is ontological, not explanatory. Kim's argument is not that we cannot *explain* behavior using mental terms, but that mental properties lack causal *powers* distinct from their physical bases.

  If proportionality is merely a constraint on explanatory relevance, it concedes the exclusion point regarding ontological causation. If proportionality is intended as a constraint on ontological causation, it fails because ontology is not sensitive to our pragmatic interests in description. The physical world operates at the fine grain. If $M$ does not map onto the fine-grained causal relations that govern the physical world, $M$ is causally inert, regardless of how useful it is for describing the situation. Yablo's solution blurs the distinction between causal *selection* (choosing which cause to talk about) and causal *production* (the metaphysical mechanism of influence). The exclusion problem targets production.

  **6. Conclusion**
  Yablo's determinable/determinate solution offers a compelling linguistic model for how we talk about causes, but it fails as a metaphysical solution to the exclusion problem. The proportionality constraint is relative to the individuation of the effect. Since the physical realizer $P$ is always proportionate to the fine-grained physical effect $E_{fine}$—and the mental property $M$ is invariably too general for $E_{fine}$—the exclusion argument re-emerges at the fundamental level. Without a principled, non-circular criterion for fixing the grain of the effect at the coarse level, Yablo's account cannot demonstrate that mental properties possess causal powers that are not already exhausted by their physical realizers. Consequently, the proportionality constraint cannot, by itself, rescue mental causation from exclusion.

  ***

  ### Notes for Integration into Your Chapter

  *   **Dialectical Position:** This argument positions you against "compatibilist" solutions (like List & Menzies, who develop Yablo's view). It strengthens your dissertation by showing you have considered the most sophisticated non-reductive physicalist responses and found them wanting on metaphysical grounds.
  *   **Key Distinction:** Emphasize the **Ontological vs. Explanatory** distinction (Section 5). This is often the weak point in Yablo-style defenses. If they admit proportionality is about explanation, they lose the ontological battle. If they claim it's ontological, they face the Grain Objection.
  *   **Potential Counter-Response:** Be prepared for a Yablo-defender to argue that "effects" are inherently context-sensitive events, not just physical micro-states. You can preempt this by arguing that *causal closure* is defined over physical states, so if mental causation doesn't work at the level of physical states, it violates closure.
  *   **Citations:** When drafting the full text, ensure you reference **List and Menzies (2009)** "Non-Reductive Physicalism and the Limits of the Exclusion Principle," as they formalize Yablo's view, and **Zhong (2014)** or **Baumgartner (2013)** for criticisms regarding proportionality and interventionism.
