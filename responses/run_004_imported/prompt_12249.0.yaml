answer: |-
  The theater smelled of dust and old velvet, a dry, sweet scent that Elias associated with holding his breath. He was in the fourth row, center aisle. He had read the synopsis on the train ride over. He knew that by nine o'clock, the protagonist, a merchant named Thomas, would be dead on the floorboards, and the actor playing him, a man named Garris whom Elias had seen smiling at the box office, would stand up and wipe the fake blood from his chin.

  Elias was ready to cry. He had come for it. He wanted the heavy, hollow feeling in his chest that meant he was connected to something larger than his own Tuesday night.

  The play was nearing its end. The lighting had narrowed to a single, harsh pool of white around Thomas and his brother. They were shouting. The dialogue was sharp, jagged things thrown across the stage. Elias sat with his hands clasped loosely in his lap, his shoulders dropped, his throat already tight. He was practicing the surrender. He was waiting for the moment his guard would drop and the tears would come.

  Then came the struggle.

  It was scripted. Thomas was to be shoved, to stumble backward, and to fall against a wooden table before sliding to the floor. The actor playing the brother grabbed Thomas by the lapels. There was a shove.

  Thomas went back. He hit the table. There was a sound.

  It was a dull, wet thud, heavier than the previous times Elias had seen the rehearsal of this movement in his mind. It sounded like a sack of flour dropped from a waist, but with a sharp crack underneath it. Thomas hit the floor. He did not slide. He landed and stayed.

  The brother actor stood over him. He was supposed to deliver a monologue. He opened his mouth, but no sound came out. He looked down at Thomas.

  In the fourth row, Elias's left hand unclasped from his right. It moved to the velvet armrest. His fingers dug in.

  Thomas on the floor did not move. His chest was rising, shallow and quick, but his left leg was twisted at an angle that the lighting director's blue gel made look like a jagged shadow. A line of red began to seep from Thomas's hairline, near the temple. It was brighter than the stage blood they had used in the first act. It moved faster.

  Elias's thighs tensed. The muscles coiled, ready to spring. He calculated the distance. Four rows. The aisle was clear. He could be on the stage in six seconds. He could shout. He could ask if anyone had a phone.

  He did not stand.

  His body felt like it was filled with wet sand. The command to rise had been sent from his brain, but it had dissolved somewhere in his spine. He looked to his left. A woman in a green sweater was leaning forward, her hand over her mouth. She did not move. He looked to his right. A man in a suit was perfectly still, his eyes fixed on the stage.

  On stage, the brother actor took a half-step back. He looked out into the darkness of the house. For a second, the mask of the character slipped. His eyes were wide, searching for a cue, or perhaps for permission. The silence in the theater stretched. It wasn't the respectful silence of an audience captivated by drama. It was the brittle silence of a room waiting for a glass to finish cracking.

  Elias felt a hot prickle behind his eyes. The tears were coming. But they felt different now. They weren't the warm, cathartic tears he had planned for. These were cold. They sat on his lower lids, heavy and threatening to spill, but his face remained slack. He was crying, but his body was in a crouch.

  *He's hurt,* a voice in Elias's head said. It was a plain statement.
  *It's the script,* another voice answered. *The blood is part of it.*
  *The leg,* the first voice said. *Look at the leg.*

  Elias looked at the leg. It twitched. A spasm.

  Elias's breath hitched in his throat, a small, audible gasp. He clamped his mouth shut. He was aware of his own heartbeat in his ears, a rhythmic thudding that seemed to sync with the shallow rise of the actor's chest.

  Why am I sitting? Elias thought. The question wasn't philosophical. It was mechanical. If I believe he is hurt, I stand. If I believe he is acting, I sit. I am sitting. Therefore, I believe he is acting. But I am crying. Therefore, I believe he is hurt.

  The brother actor on stage swallowed. Elias saw the bob of his Adam's apple. Then, the actor spoke. He delivered the next line of the monologue. His voice cracked. It wasn't the crack of a character overcome with emotion; it was the crack of a voice unused to speaking while terrified.

  *"You brought this on yourself, Thomas."*

  The line hung in the air, accusatory and thin.

  On the floor, Thomas's hand moved. It clawed at the wood. It wasn't the graceful, choreographed clawing of a dying man. It was a grab for purchase. A reflex.

  Elias's fingers tightened on the armrest until his knuckles turned white. The urge to move surged again, violent and physical. His hips lifted an inch off the seat.

  Then, Thomas stopped moving. He lay still.

  The brother actor finished the monologue. He stepped back into the shadows, as directed. The lights began to fade, slowly, turning the red blood on the floor into black, and the twisted leg into a shapeless lump.

  Elias sank back into his seat. The air rushed out of his lungs in a long shudder. He wiped his eyes with the back of his hand. His hand was dry. The tears had not fallen. They had receded, absorbed back into the heat of his face.

  The lights came up for the curtain call.

  The company filed out. The brother actor was smiling, but it was a tight smile, his eyes darting to the side. Thomas came out last. He was walking. He walked with a slight limp, favoring the right leg, but he was walking. He held a handkerchief to his temple. He bowed. The audience applauded.

  Elias clapped. His hands met with a dull slap. He watched Thomas's face. The actor was looking at the floor, not the audience. He smiled, but he didn't look up.

  When the lights went up fully, the spell didn't break. Usually, this was the moment the magic dissolved. The lights revealed the peeling paint on the walls, the cheap fabric of the costumes, the humanity of the performers. Elias usually felt a gentle return to the world, a gratitude for the illusion.

  Tonight, he felt stranded.

  He stood up with the rest of the crowd. His legs felt stiff, as if he had been sitting for hours, not ninety minutes. He moved into the aisle. He passed the woman in the green sweater.

  "Did you see that?" she whispered to her companion.
  "Stunt work, probably," the companion said. "Looked realistic, though."
  "Too realistic."

  Elias walked faster. He needed air. He pushed through the double doors into the lobby. It was bright and sterile, smelling of floor wax and popcorn. People were milling about, heading for the exits or the bar.

  He stopped near a pillar. He leaned against it. He felt a strange hollowness in his stomach, a nausea that had nothing to do with food.

  He thought about the tears that hadn't fallen. He thought about the six seconds it would have taken to reach the stage. He thought about the weight of his own body, how heavy it had been, how impossible it had felt to lift it.

  If he had stood up, he would have looked foolish. He knew that. If he had run to the stage and the actor had simply been performing a new, gritty interpretation of the death scene, the ushers would have escorted Elias out. He would have been the man who couldn't tell the difference. He would have been the irrational one.

  But if he hadn't stood up, and the actor was actually injured...

  Elias looked at his hands. They were trembling, just slightly. A fine vibration in the fingers.

  A group of teenagers laughed near the exit, talking about the lighting design. Elias watched them. He tried to summon the feeling from the fourth row. The tightness in the throat. The coiled muscles. He tried to categorize it. Was it pity? Was it fear? Was it grief?

  It felt like grief. It felt exactly like the grief he had felt when his father died, the same physical weight on the sternum, the same inability to draw a full breath. But when his father died, he had moved. He had made calls. He had packed bags. He had done things.

  Here, he had done nothing. He had been a vessel for the emotion without the agency that usually accompanied it.

  He walked out into the night. The air was cool. He stood on the sidewalk for a moment, watching the traffic pass. A car honked. A siren wailed in the distance, real and urgent.

  Elias touched his cheek. It was damp.

  He hadn't noticed the tears finally falling. They were cold on his skin. He wiped them away, but they kept coming, silent and steady. He didn't sob. He didn't reach for a tissue. He just stood on the corner, crying, while the city moved around him, indifferent and solid.

  He didn't know if he was crying for Thomas the merchant, or Garris the actor, or for himself, sitting still while the world burned. He didn't know if the distinction mattered. He only knew that the tears were real, and the stillness was real, and he couldn't remember how to tell them apart.
