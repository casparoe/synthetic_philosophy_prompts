  *(Self-Correction Note)*: I need to be careful with the term "Right." In Spinoza, Natural Right = Power. Civil Right = Laws of the state. The tension is whether women have the Natural Right (Power) to claim Civil Right. Spinoza says no. Julian says yes (metaphysically). Sara says no (empirically/historically).

