      *   *Hierarchy of Arts:* Architecture (lowest grades, gravity/cohesion) -> Landscape/Gardening -> Animal Painting/Sculpture (human form) -> Poetry/Tragedy (highest grades, human action/suffering).
      *   *Music's Exception:* Music bypasses the Ideas. It is a *direct* copy of the Will itself. It doesn't represent shadows (Ideas); it represents the thing-in-itself (metaphysically speaking, within the aesthetic context).
