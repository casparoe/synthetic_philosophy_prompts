      *   *Part 1: The General Theory (The Ladder of Ideas).* Explain the mechanism: Will $\rightarrow$ Suffering $\rightarrow$ Art $\rightarrow$ Will-less Contemplation $\rightarrow$ Platonic Ideas. Mention the hierarchy (Architecture to Tragedy).
      *   *Part 2: The Music Exception.* Explain *why* music is different. It doesn't copy phenomena; it copies the Will. Use Schopenhauer's analogy (World = Body, Music = Soul). Mention the bass notes = lowest grades, melody = highest effort of the will.
      *   *Part 3: Addressing the Inconsistency.*
