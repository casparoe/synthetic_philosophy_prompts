answer: |-
  This is a remarkably sharp diagnosis of the situation. Your cohort's instinct to map *svataḥ-prāmāṇya* (intrinsic validity) onto Internalism and *parataḥ-prāmāṇya* (extrinsic validity) onto Externalism is the standard "first-pass" heuristic in comparative epistemology, but as you've noticed, it collapses under the weight of the actual textual mechanics. The mismatch arises because the Western internalism/externalism debate is primarily about *justification conditions* (what makes a belief warranted?), whereas the Nyāya-Mīmāṃsā debate is primarily about *ascertainment conditions* (how do we know a cognition is veridical?) within a framework where truth and justification are often extensionally equivalent in the definition of *pramā* (veridical cognition).

  Below is a walkthrough of the debate mechanics and a critical analysis of the Internalism/Externalism analogy, structured to help you draft a nuanced paper section.

  ---

  ### 1. The Mīmāṃsā Position: *Svataḥ Prāmāṇya* (Intrinsic Validity)

  To understand the Nyāya rejection, you must first distinguish the two components of the Mīmāṃsā claim, often conflated in secondary literature. Following Kumārila Bhaṭṭa, *svataḥ prāmāṇya* involves two theses:
  1.  **Ontological/Causal:** The validity of a cognition arises from the very same causes that produce the cognition itself (*utpatti*).
  2.  **Epistemic:** The validity of a cognition is known (ascertained) intrinsically, without requiring a second cognition (*jñāpti*).

  **The Regress Argument (*Anavasthā*):**
  The primary argument for *svataḥ prāmāṇya* is a defensive move against infinite regress. If every cognition $C_1$ required a second cognition $C_2$ to validate its truth, then $C_2$ would require $C_3$, *ad infinitum*. We would never arrive at a settled cognition, and practical life (*vyavahāra*) would be impossible. Therefore, the validity of the initial cognition must be self-given.

  **The Phenomenological Claim:**
  Mīmāṃsakas argue that cognitions present themselves as true. When you see a pot, the cognition "This is a pot" carries a phenomenological force of veridicality. Invalidity (*aprāmāṇya*), they argue, is extrinsic (*parataḥ*). We only discover a cognition was false when we encounter a *bādhaka* (defeater)—e.g., moving closer and seeing it's a stump, not a man. Validity is the default; invalidity is the exception discovered later.

  **Scholarly Flag:** There is a dispute between the Bhāṭṭa (Kumārila) and Prābhākara schools here. Prabhākara denies the possibility of error entirely (the *akhyāti* theory), arguing that we never actually cognize "silver" in the shell; we cognize "this-ness" and recall "silver-ness" separately, failing to distinguish the memory from the perception. Kumārila admits error but maintains validity is intrinsic. For your paper, stick to Kumārila if you want the stronger epistemic claim, as Prabhākara's view dissolves the problem by denying the data (error).

  ### 2. The Nyāya Position: *Parataḥ Prāmāṇya* (Extrinsic Validity)

  The Naiyāyikas (especially Gaṅgeśa in the *Tattvacintāmaṇi*) reject both Mīmāṃsā theses. They argue validity is extrinsic in both origin and ascertainment.

  **The Argument from Error:**
  Nyāya turns the Mīmāṃsā phenomenology on its head. In an illusion (e.g., mistaking a shell for silver), the cognition *also* presents itself as true. The phenomenological "feel" of veridicality is identical in both veridical and non-veridical cases. Since the intrinsic character of the cognition does not distinguish truth from falsehood, validity cannot be intrinsic. It must depend on something external to the cognition itself—namely, the actual relation to the object.

  **The Role of *Anuvyavasāya* (Reflective Awareness):**
  This is where your cohort's Externalism mapping gets messy. Nyāya does not say we are blindly reliable. They posit a second-order cognition called *anuvyavasāya* (e.g., "I have a cognition of silver").
  *   **First-order (*vyavasāya*):** "This is silver."
  *   **Second-order (*anuvyavasāya*):** "I know that this is silver."

  For Nyāya, the *prāmāṇya* (validity) is not known in the first-order cognition. It is known through the *anuvyavasāya*, which is triggered by the *successful practical activity* (*pravṛtti-sāmarthya*) resulting from the first cognition.

  **The Mechanics of *Pravṛtti-Sāmarthya* (Successful Activity):**
  Nyāya offers a causal-pragmatic test.
  1.  I cognize water.
  2.  I act to reach for it (*pravṛtti*).
  3.  The action succeeds; I drink and my thirst is quenched (*sāmarthya* / *samvāda*).
  4.  This success generates a second-order awareness that the original cognition was valid.

  If I reach for a mirage and hit sand, the failure of the activity generates the awareness that the original cognition was invalid. Thus, validity is extrinsic because it depends on (a) the causal fit between cognition and object, and (b) the subsequent verification through action.

  **Scholarly Flag:** There is debate regarding the status of *anuvyavasāya*. Is it a distinct perception (*mānasa-pratyakṣa*) or an inference? Gaṅgeśa treats it as a form of perception, but later Navya-Nyāya logicians refine this. Furthermore, some scholars (like B.K. Matilal) argue that for Nyāya, truth is *discovered* extrinsically, but the *warrant* might still be internal to the *pramāṇa* process. Be careful not to conflate "truth" (*yāthārthya*) with "validity" (*prāmāṇya*), though Nyāya often treats them as co-extensive.

  ### 3. Deconstructing the Internalism/Externalism Analogy

  Your intuition that the mapping "falls apart" is correct. Here is the precise breakdown for your paper.

  #### Where the Analogy Holds (Superficially)
  *   **Nyāya as Externalist:** Nyāya locates the determining factor of validity outside the subjective awareness of the cognizer (in the causal link to the object and the success of action). This resonates with Process Reliabilism (Goldman), where justification depends on the reliability of the cognitive process, not the agent's access to that reliability.
  *   **Mīmāṃsā as Internalist:** Mīmāṃsā locates the certainty of validity within the experience of the cognition itself. If it seems true, it is provisionally treated as true. This resonates with Phenomenal Conservatism (Huemer) or classical Access Internalism.

  #### Where the Analogy Breaks Down (Structurally)

  **1. Truth vs. Justification:**
  In post-Gettier Western epistemology, Internalism/Externalism is a debate about *justification* (warrant), distinct from truth. You can have internal justification for a false belief.
  In the Nyāya-Mīmāṃsā debate, *prāmāṇya* implies *truth*. A *pramā* is defined as a veridical cognition. The debate is not "What makes this belief warranted?" but "How do we *ascertain* that this cognition corresponds to reality?"
  *   *Implication:* Nyāya is not arguing that we lack internal justification; they are arguing that *truth-ascertainment* requires external verification. This makes Nyāya closer to a **Truth-First Externalism** or even a form of **Disjunctivism** (veridical and non-veridical cases are fundamentally different kinds of states, distinguishable only by their external relations) than standard Reliabilism.

  **2. The Role of Reflection (*Anuvyavasāya*):**
  Standard Externalism (e.g., Simple Reliabilism) does not require the agent to *know* that the process is reliable. A chicken sexer knows the chick's gender without knowing *how* they know.
  Nyāya, however, insists on *anuvyavasāya*. We must have a *second cognition* that grasps the validity of the first. This requirement for higher-order awareness introduces an **Internalist constraint on Externalist validity**. We must internally access the *result* of the external causal chain (the successful action) to certify the knowledge.
  *   *Paper Tip:* Characterize Nyāya not as pure Externalism, but as **Externalism about Truth Conditions + Internalism about Ascertainment**.

  **3. Deontology vs. Teleology:**
  Western Internalism is often deontological (epistemic duty, blamelessness). Mīmāṃsā *svataḥ prāmāṇya* is not about duty; it is about the **ontological nature of cognition**. Cognitions are like lamps: they illuminate objects and themselves simultaneously. It is a metaphysical claim about the luminosity of consciousness, not a normative claim about epistemic responsibility. Mapping "Internalism" onto this imports Western normative baggage that the Mīmāṃsakas do not carry.

  ### 4. Suggested Framing for Your Paper

  If you are using this in a paper section, avoid saying "Nyāya is externalist." Instead, try a formulation like this:

  > "While contemporary comparativists often map the *svataḥ/parataḥ* debate onto the internalism/externalism distinction, this analogy obscures the specific mechanics of *prāmāṇya*. Unlike Western internalism, which focuses on access to justifying reasons, the Mīmāṃsā claim of *svataḥ prāmāṇya* is a phenomenological thesis about the self-presenting nature of veridicality. Conversely, Nyāya's *parataḥ prāmāṇya* is not a brute reliabilism. By requiring *anuvyavasāya* (reflective awareness) grounded in *pravṛtti-sāmarthya* (successful practical activity), Nyāya posits a hybrid account: truth conditions are external (causal correspondence), but the *ascertainment* of truth requires an internal, second-order cognition of that causal success. Thus, the debate is less about justification and more about the epistemology of error and the conditions for meta-cognitive certainty."

  ### 5. Contested Points & Citations to Watch

  *   **Matilal vs. Mohanty:** B.K. Matilal (*Epistemic Logic in the Nyāya Tradition*) strongly pushes the Externalist reading of Nyāya. J.N. Mohanty (*Classical Indian Philosophy*) is more nuanced, emphasizing the phenomenological aspects. If you cite Matilal, acknowledge that his reading is influential but sometimes over-modernizes the categories.
  *   **The Status of *Samvāda*:** Is *samvāda* (correspondence/agreement) a definition of truth or a test for validity? Some scholars argue Nyāya uses *pravṛtti-sāmarthya* (success) as the *test*, while *yāthārthya* (correspondence) is the *definition*. Confusing these leads to misreading Nyāya as Pragmatist (which Gaṅgeśa is not).
  *   **Intrinsic Invalidity:** Does Nyāya hold invalidity is intrinsic? No, Nyāya says *both* validity and invalidity are extrinsic. Mīmāṃsā says Validity is Intrinsic, Invalidity is Extrinsic. This asymmetry is key. Mīmāṃsā is optimistic about default trust; Nyāya is critical/fallibilist.

  ### Summary of the "Mismatch"
  Your cohort is treating *prāmāṇya* as "Justification."
  *   If *Prāmāṇya* = Justification: Mīmāṃsā = Internalist (I have access to it immediately). Nyāya = Externalist (I need to check the world).
  *   If *Prāmāṇya* = Truth + Ascertainment: Mīmāṃsā = Dogmatic Realism (Truth is given). Nyāya = Critical Realism (Truth is verified).

  The Nyāya requirement for *anuvyavasāya* means they are not reliabilists in the Goldman sense; they require the agent to cognitively grasp the reliability via the success of action. This makes their view closer to a **Virtue Epistemology** (Sosa/Greco) where the competence is demonstrated in successful performance, which is then reflectively accessible.

  **Recommendation:** Use the Internalism/Externalism labels only heuristically, immediately qualifying them with the distinction between *conditions for truth* (external in Nyāya) and *conditions for knowing truth* (involving internal reflection in Nyāya). This preserves the sophistication of your analysis and avoids the "different clothes" reductionism.
