  3.  **Deconstruct the Debate:**
      *   **Genic Selectionism (Dawkins/Dennett):** Genes are the only *replicators*. Vehicles (organisms/groups) are temporary. Selection is fundamentally about differential gene survival. "Group selection" is often just kin selection in disguise or mathematically convertible to gene selection.
      *   **Multilevel Selection (Sober/Wilson):** Selection acts simultaneously at multiple levels (gene, cell, organism, group). Group traits can have causal efficacy. The *process* of group selection (variance between groups) is real, even if mathematically equivalent to gene models.
