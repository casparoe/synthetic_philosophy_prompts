      *   *Criterion 2: Emergent Traits.* If the trait selected *only* exists at the group level (e.g., sex ratio, colony structure), individual-level talk becomes contorted.
      *   *Criterion 3: Heuristic Value.* Does thinking in MLS terms generate new hypotheses or experiments that genic thinking misses? (e.g., trait-group models).
      *   *The "Kin Selection" overlap:* Hamilton's rule ($rb > c$) is mathematically equivalent to MLS conditions. The difference is whether you focus on *relatedness* (genic/kin) or *group structure/variance* (MLS).

