      *   **Verdict:** Based on this, the respondent is Responsible.
      *   **Objection Handling:** Address the "Majority on Conclusion" objection (CBP). Acknowledge it protects against minority coalitions, but argue that in a rule-bound adjudication, fidelity to the criteria outweighs simple outcome majoritarianism.
      *   **Next Steps:** Formalize the finding, notify the student, amend bylaws/procedures to specify PBP explicitly for future clarity.
      *   **Timeline:** Immediate notification, meeting Thursday to ratify, written report by Friday.

  5.  **Refining the Tone:**
      *   Needs to be respectful but firm on the theory.
      *   Avoid condescension (I am a student adviser, they are faculty).
