      This strengthens the PBP argument. The "Not Responsible" majority is not a coherent coalition; it's a cyclical majority. Ruling "Not Responsible" validates a coalition that doesn't agree on *why* the student is innocent. Ruling "Responsible" validates a majority on each specific factual claim.

