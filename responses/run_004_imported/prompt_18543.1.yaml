      *   *Wait, actually:* To make the memo realistic, I should probably choose the one that is *easier to migrate to* or *more secure*. Let's go with **Doubling** as the standard, but acknowledge the Backslash camp's validity.
      *   *Actually, looking at the Lewis angle:* If conventions are about expectation, we need to change the expectation. The memo must explain *why* this vote changes the expectation.

  4.  **Drafting the Memo - Section by Section:**

