      *   *Governance Reality:* In software, especially with security implications, waiting for organic convergence is dangerous. The "coordination problem" is currently stuck in a bad equilibrium (two equilibria actually, causing collision).
      *   *Synthesis:* A vote *can* work, but only if it acts as a "focal point" (Schelling point) to shift expectations. It's not about authority forcing behavior, but about authority signaling a new equilibrium that everyone can coordinate around to avoid the security risk. The memo needs to acknowledge this nuance.

