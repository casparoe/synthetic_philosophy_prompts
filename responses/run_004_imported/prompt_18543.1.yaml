answer: |-
  **TO:** Technical Steering Committee
  **FROM:** [Your Name/Seat]
  **DATE:** October 26, 2023
  **SUBJECT:** DECISION MEMO: Resolution of Delimiter Escaping Incompatibility (TSC-2023-09)

  ### 1. Executive Summary

  For three years, our ecosystem has operated under two incompatible escaping conventions: **Backslash** (`\{{`) and **Doubling** (`{{{{`). This 50/50 split has created a coordination failure where plugin interoperability is broken and, critically, silent mixing of conventions creates injection vulnerabilities.

  This memo recommends **mandating Delimiter Doubling as the single canonical standard**, with a 12-month deprecation period for Backslash syntax.

  This decision is not merely technical; it is a governance intervention to resolve a stalled coordination game. While philosophical precedent (Lewis, 1969) suggests conventions cannot be decreed by authority, they *can* be shifted when the current equilibrium becomes costly. By voting, we do not "force" a convention; we establish a **Schelling Point**—a public signal that allows all actors to coordinate on a single solution simultaneously.

  ### 2. The Technical Crisis

  The current status quo is unsustainable.
  *   **Security:** When a template using Backslash escaping includes a plugin using Doubling (or vice versa), the engine fails to escape the literal delimiter. In user-generated content scenarios, this allows template injection attacks (SSTI).
  *   **Fragmentation:** New contributors cannot know which convention to use without inspecting the specific plugin version matrix.
  *   **Deadlock:** Organic convergence has failed. Both camps are roughly equal in size, and both are internally consistent. Neither will switch voluntarily without a guarantee that the *other* side will also switch.

  ### 3. The Decision: Mandate Delimiter Doubling

  The Committee shall standardize on **Delimiter Doubling** (e.g., `{{{{ name }}}` renders as `{{ name }}`).

  **Why Doubling over Backslash?**
  1.  **Data Integrity:** Backslashes are significant data in many backend contexts (Windows paths, Regex, JSON). Requiring users to double-escape backslashes to render a delimiter adds cognitive load and bug surface area.
  2.  **Visibility:** `{{{{` is visually distinct in debug logs and source code. `\{{` can be easily obscured or consumed by string parsers upstream of the template engine.
  3.  **Ecosystem Alignment:** Major peers (Jinja2, Twig) utilize doubling, reducing onboarding friction for developers moving between frameworks.

  ### 4. The Lewisian Constraint: Can We Vote This Into Existence?

  We must be candid about the limits of this vote. David Lewis argued that conventions are sustained by *precedent* and *mutual expectation*, not authority. If we vote for Doubling but the community expects Backslash, the vote is paper. A convention exists only when I follow it because I expect *you* to follow it.

  However, we are not trying to create a convention from scratch; we are resolving a **coordination failure**. Currently, authors do not know what to expect. This uncertainty is more costly than the cost of migration.

  **Why Top-Down Standardization Works Here:**
  The Committee's vote serves as a **public signal**. It changes the "common knowledge" of the ecosystem. By announcing a hard deadline, we assure the Doubling camp that the Backslash camp *must* move, and vice versa. The authority of the TSC does not force the convention; it guarantees the coordination required to make the new convention self-perpetuating.

  If we do not act, the "convention" will eventually be decided by security exploits, which is a far harsher regulator than this Committee.

  ### 5. Migration Timeline

  To minimize friction and respect the investment of the Backslash camp, we will implement a phased deprecation.

  *   **Phase 1 (Months 0-6): Dual Support with Warnings.**
      *   Engine accepts both syntaxes.
      *   Linter flags Backslash usage with `WARN_ESCAPING_DEPRECATED`.
      *   CI/CD integration available to scan repos for Backslash usage.
  *   **Phase 2 (Months 6-12): Strict Mode Default.**
      *   New projects default to "Strict Doubling Only."
      *   Existing projects must explicitly enable `LEGACY_BACKSLASH_SUPPORT` in config.
      *   Documentation removes all Backslash references.
  *   **Phase 3 (Month 12+): Hard Removal.**
      *   Backslash escaping throws a compile-time error.
      *   `LEGACY_BACKSLASH_SUPPORT` flag removed.

  ### 6. Acceptance Strategy for the Backslash Camp

  The Backslash proponents argue their method is more intuitive and standard in general programming. To gain their acceptance, we must acknowledge the validity of their intuition while emphasizing the specific constraints of *templating*.

  **Reasons for Acceptance:**
  1.  **Security Guarantees:** The primary mandate of the TSC is user safety. The split convention is a known vulnerability vector. Unifying eliminates this class of exploit.
  2.  **Automated Migration:** We will fund a grant (from the Open Collective) to build an official `codemod` tool that automatically converts Backslash syntax to Doubling with 99% accuracy. No author should have to migrate manually.
  3.  **Future-Proofing:** As the engine integrates deeper with JSON-heavy APIs and Windows-based CI pipelines, Backslash escaping introduces recursive complexity that Doubling avoids. We are saving them from technical debt, not imposing it.

  ### 7. Recommendation

  I move that the Committee adopt **Delimiter Doubling** as the sole canonical escaping convention, effective immediately for documentation, with the deprecation timeline outlined above.

  We must acknowledge that this vote is not a magic wand. It will only work if we pair the mandate with the tooling (codemods) and the signal (clear deadlines) that allows the community to shift expectations in unison. We are not dictating behavior; we are solving the coordination problem that organic evolution could not.

  **Action Required:** Vote on this memo prior to next week's steering call.

  ---
  *Attachments: Security Audit Report (TSC-SEC-2023-04), Codemod Specification Draft.*
