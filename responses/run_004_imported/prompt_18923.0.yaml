      *   **Reference Class Problem (RCP):** The problem that an individual event belongs to *many* classes, each with different frequencies. There is no algorithmic way to choose *the* correct class. It's not about ignoring data; it's about ambiguity in defining the data set.
      *   **Reichenbach's Solution:** "Narrowest reference class for which reliable statistics exist."
