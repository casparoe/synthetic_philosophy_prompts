answer: |-
  Here is a run of nine questions designed to corner the "no single bet" defense, ordered to start with theoretical foundations and progressively tighten the constraints on her argument. Each includes a follow-up tailored to the standard evasion you'd expect from the ergodicity economics camp.

  ### 1. The Bernoulli Accusation
  "Let's start with the foundational claim. You argue that Expected Utility Theory (EUT) has been solving the wrong problem for 300 years by averaging over parallel universes (ensemble averages) rather than averaging over time (time averages). If EUT is using the wrong arithmetic, why did it work well enough to build the modern financial system? Are you saying economists got lucky, or that the systems they built implicitly corrected for the error without realizing it?"

  *   **Follow-up:** "If you say they got lucky or that markets enforce it, doesn't that suggest the *environment* selects for Kelly-like behavior regardless of the agent's internal utility function? If so, isn't your theory a description of market survival rather than a normative theory of individual rational choice?"

  ### 2. Kelly vs. Ergodicity (The "New Work" Question)
  "I want to press on the novelty here. Kelly's 1956 paper already established that maximizing geometric growth maximizes long-term wealth. Critics say 'Ergodicity Economics' is just Kelly's log-wealth result wearing a fancier physics costume. Is there actually new mathematical work happening here, or are you just rebranding the logarithmic utility function as a 'time average' to make it look like an objective physical property rather than a subjective preference?"

  *   **Follow-up:** "You'll likely say EUT smuggled in the wrong average without admitting it. But if the mathematical output of log-utility and time-average maximization are identical, what practical decision changes? If I'm a regulator or an investor, do I actually *do* anything differently under your framework than I would under standard EUT with a log utility assumption?"

  ### 3. The "No Single Bet" Assertion
  "Your go-to defense against edge cases is that 'there is no such thing as a single bet'—that every decision is a step in a lifetime sequence. But surely there's a limit to that. If I'm offered a bet that could wipe me out completely, but has a positive time-average growth rate over 10,000 iterations, your math says take it. But if I can't survive the first iteration to get to the 10,000th, doesn't the 'sequence' argument collapse? How do you handle absorbing states without smuggling 'ruin aversion' back in as a separate axiom?"

  *   **Follow-up:** "If you argue that ruin is just a boundary condition of the time average, aren't you admitting that the *structure* of the bet matters more than the *growth rate*? And if the structure matters, haven't we just reinvented risk constraints that EUT already handles via utility curvature, just with more jargon?"

  ### 4. The Reference Class Problem (Samuelson's Objection)
  "Paul Samuelson argued that being growth-optimal 'almost surely in the long run' doesn't tell you what to do with the ten bets sitting in front of you right now. This leads to the reference class problem: What exactly constitutes 'the sequence' I'm optimizing? Is it my total net worth? Just this trading account? Or only the bets uncorrelated with my human capital? If I can't objectively define the 'sequence,' isn't the time average just as subjective as the utility function you're trying to replace?"

  *   **Follow-up:** "If you say 'it's your total investable wealth,' how do you account for siloed risks? If I bet my house on a coin flip, I can't average that loss out with my 401(k) gains. If your theory requires me to treat all wealth as one fungible pool to make the math work, isn't that a violation of how humans actually experience risk and mental accounting?"

  ### 5. The Fractional Kelly Concession
  "Practitioners who actually live by this—Thorp, Buffett, professional gamblers—almost never use full Kelly. They use half-Kelly or quarter-Kelly. They explicitly de-lever below the growth-optimal point. If maximizing the time-average growth rate is the *correct* definition of rationality, why do the experts consistently choose a sub-optimal growth path? Is this just estimation error, or is it a quiet concession that pure growth maximization ignores something vital about the utility of stability?"

  *   **Follow-up:** "If you say it's just to account for parameter error or miscalculation, doesn't that imply the *objective function* itself needs a robustness term? If I have to sacrifice growth to ensure I don't deviate from the path, isn't that functionally equivalent to having a risk-aversion parameter in a utility function, which brings us right back to where we started?"

  ### 6. Non-Wealth Domains (The Generalizability Test)
  "Let's move outside finance. I want a single concrete example, outside of compounding wealth, where this 'geometric' style of reasoning gives a different and clearly correct answer than plain expected-value reasoning. Does this apply to health decisions? Relationships? Career choices? If Kelly is a general theory of rational choice, show me a non-monetary scenario where maximizing the geometric mean saves you from a trap that the arithmetic mean walks right into."

  *   **Follow-up:** "If you reach for evolutionary fitness or population dynamics, isn't that a category error? Individuals don't optimize for species survival. If I take a risk that kills me but benefits my genetic line, I don't care about that geometric average. How do you reconcile the time-average of the *gene* with the time-average of the *agent*?"

  ### 7. The Finite Horizon Problem
  "You lean heavily on the 'long run.' But humans have finite horizons. I'm not going to be making bets forever. If I'm 85 years old, or if I'm saving for a specific payout date in five years, the 'infinite sequence' assumption is false. In a finite game, the ensemble average might actually be the relevant metric because I won't be around to experience the convergence of the time average. Does your theory break down when the player has an expiration date?"

  *   **Follow-up:** "If you argue that 'wealth transfers to heirs' extends the sequence, doesn't that dilute the agency? I might not care about the growth rate of my estate after I'm dead. If the 'sequence' extends beyond my conscious experience, whose utility are we actually maximizing?"

  ### 8. Consumption vs. Accumulation
  "Kelly maximizes wealth, but humans maximize consumption or wellbeing. Wealth is just a tool. There are times when the growth-optimal strategy requires reinvesting everything, deferring consumption to compound the base. But a rational agent might prefer to eat today rather than be richer tomorrow. Does ergodicity economics have a theory of consumption, or is it strictly a theory of capital accumulation that assumes you never want to spend the money?"

  *   **Follow-up:** "If you say 'wealth funds consumption,' you're ignoring the timing mismatch. If the optimal growth path requires me to be poor for ten years before I get rich, but I starve in year three, the time average didn't help me. Do you need to add a discount rate to your time-average calculation, and if so, doesn't that look suspiciously like the discount rates used in standard EUT?"

  ### 9. The "One-Off" Trap
  "Here's the final challenge. Imagine a one-off, non-repeatable decision with high stakes—say, accepting a medical treatment with a 90% chance of curing you and a 10% chance of immediate death. There is no sequence. There is no compounding. There is only this bet. Your framework says 'there is no single bet,' but biologically, there is. In this specific instance, does the ensemble average (90% survival) trump the time average (which is undefined or zero if you die)? If you admit the ensemble average wins here, haven't you conceded that your theory is only valid for repeatable financial risks, not general rational choice?"

  *   **Follow-up:** "If you insist on framing this as a sequence of 'life decisions,' aren't you stretching the definition of 'repeatable' until it loses meaning? If the cost of error is irreversible, does the physics of the situation not dictate that the ensemble probability is the only one that matters for the decision at hand, regardless of the long-run math?"
