prompt: |-
  I cover science and ideas for a living, and on the side I run a little podcast where I get researchers to defend positions that sound nuts until you actually hear the argument. Next week's guest is a physicist-turned-economist who has basically built her career on the claim that Kelly betting isn't just a nice trick for card counters -- it's close to the correct general theory of rational choice under uncertainty, and that standard expected utility theory has been quietly using the wrong kind of average since Bernoulli. I fell down this rabbit hole a few months ago after a friend who trades options tried to explain half-Kelly position sizing to me over beers, and I havent stopped reading about ensemble averages vs time averages since. Her go-to move whenever someone raises an awkward case is some version of 'there's no such thing as a single bet' -- meaning whatever decision is in front of you is really just one step in your lifetime sequence of bets, so the time-average, growth-optimal framing wins by default. I want a run of questions that makes that move progressively harder for her to lean on.

  Could you draft me eight or nine interview questions along those lines, each one with a follow-up already built in for the answer she's most likely to give, not just a flat list? I definitly want one that presses on whether the ensemble/time-average reframing (the 'ergodicity economics' stuff) is actually doing new work, or whether it's just Kelly's 1956 log-wealth result wearing a fancier costume, with the follow-up ready for when she says utility theory smuggled in the wrong average without admitting it. I want one built around the classic Samuelson-style objection: that being growth-optimal 'almost surely, in the long run' doesn't obviously tell you what to do about the one bet, or ten bets, sitting in front of you right now, with a follow-up pushing on how you even pick the reference class of 'the sequence' that's supposedly being compounded -- your whole net worth, this one trading account, or only the bets that are uncorrelated with your job and your house. I want one on why real Kelly bettors, Thorp and that whole crowd, use half- or quarter-Kelly instead of full Kelly in practice, and whether that's a quiet concession that pure growth-rate maximization can't be the entire story of what makes a bet size rational. And I want a last one where I ask her for a single concrete example, outside of compounding wealth, where this 'geometric' style of reasoning -- geometric expectation, Nash-bargaining-type solutions, whatever she wants to reach for -- gives a different and clearly correct answer than plain expected-value reasoning, so she can't just retreat to the one setting where everybody already agrees Kelly is right. Round out the rest of the list with whatever else you think a sharp interviewer should be asking her.
