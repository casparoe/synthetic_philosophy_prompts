prompt: |-
  I'm a journalist who covers science and ideas, and I also sit on the grants committee of a foundation that funds public-facing science-communication projects -- documentaries, exhibitions, long-form journalism. Our strongest finalist this cycle is a documentary about a well-documented case of PFAS ('forever chemicals') contamination and its effects on a nearby community: the underlying science isn't contested, but the film is structured as an explicit indictment of the manufacturer and the regulators who permitted the discharge, and it closes by urging viewers to back specific legislation. Our guidelines require funded work to be 'scientifically rigorous and non-advocacy,' and two committee members want to reject the film on those grounds; a third has circulated Du Bois's 'Criteria of Negro Art' and argues that 'non-advocacy' is exactly the purist fiction he spent that essay demolishing. We vote in ten days. Draft the memo I'll circulate to the committee: recommend fund, decline, or fund-with-conditions, engage Du Bois's actual argument rather than the slogan version of it, and, whichever way you come down, give the losing side its strongest possible case.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Journalist (science/ideas) & Grants Committee Member.
      *   **Task:** Draft a memo to the committee regarding a funding decision.
      *   **Subject:** A documentary about PFAS contamination.
      *   **Conflict:**
          *   Project Strength: Strongest finalist.
          *   Project Nature: Scientifically sound but explicitly advocacy-oriented (indicts manufacturer/regulators, urges specific legislation).
          *   Guidelines: "Scientifically rigorous and non-advocacy."
          *   Committee Split:
              *   Side A (2 members): Reject based on "non-advocacy" guideline.
              *   Side B (1 member): Cites W.E.B. Du Bois's "Criteria of Negro Art" to argue "non-advocacy" is a purist fiction.
      *   **Requirements:**
          *   Recommend a course of action (Fund, Decline, or Fund-with-Conditions).
          *   Engage deeply with Du Bois's actual argument (not just the slogan).
          *   Give the losing side its strongest possible case (steel-manning).
          *   Tone: Professional, thoughtful, nuanced, suitable for a grants committee.
          *   Timeline: Vote in 10 days (memo needs to facilitate that decision).

  2.  **Deconstruct the Core Tension:**
      *   *The Guideline:* "Non-advocacy" usually means 501(c)(3) compliance (no lobbying) and maintaining perceived neutrality/credibility.
      *   *The Project:* PFAS science is settled, but the *implications* are political. A documentary about harm inherently points to responsibility.
      *   *The Du Bois Argument:* Du Bois argued that all art is propaganda (in the sense of pushing a worldview) and that denying this is a trap for marginalized voices. He believed art should fight for truth and justice, not exist in an ivory tower.
      *   *The Counter-Argument:* Foundation credibility relies on neutrality. If we fund activism, we become a political actor, risking tax status and future ability to fund *other* science.

  3.  **Determine the Recommendation:**
      *   *Decline:* Too harsh. The project is the "strongest finalist." It meets the "scientifically rigorous" part.
      *   *Fund:* Risks violating the written guidelines and potentially legal/tax boundaries (lobbying).
      *   *Fund-with-Conditions:* This is the most pragmatic path. It acknowledges the value of the work while respecting the foundation's constraints. It allows the committee to bridge the gap between "rigor" and "advocacy."
      *   *Decision:* **Fund-with-Conditions.** This allows me to validate the Du Bois argument (art has a purpose) while upholding the foundation's fiduciary/legal duties (addressing Side A's concerns).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose, acknowledge the difficulty of the decision, and state the recommendation clearly.
      *   **The Project:** Briefly summarize the PFAS film's merits (scientific rigor is not in doubt).
      *   **The Conflict (The Guidelines):** Address the "non-advocacy" clause.
      *   **Engaging Du Bois (Crucial Step):**
          *   Need to go beyond "All art is propaganda."
          *   Du Bois's point in *Criteria of Negro Art* (1926) was that *pretending* art isn't propaganda is itself a political act that favors the status quo. He argued for "Truth" as the ultimate goal, even if it serves a cause.
          *   Application: The film seeks truth about PFAS. The "advocacy" is a byproduct of that truth, not necessarily a distortion of it.
      *   **Steel-manning Side A (The Rejectionists):**
          *   Why are they right? Institutional integrity, tax law (IRS lobbying rules), slippery slope (if we fund this, why not *any* activist film?), donor relations.
          *   Make their concern sound principled, not bureaucratic.
      *   **Steel-manning Side B (The Du Bois Proponent):**
          *   Why are they right? "Neutrality" often protects power. Science communication *is* inherently normative when harm is proven. Pretending otherwise is dishonest.
      *   **The Synthesis/Recommendation:**
          *   Fund, but with specific editorial/legal conditions.
          *   Distinguish between *education* (allowed) and *lobbying* (restricted).
          *   Reframe the "advocacy" as "civic engagement based on scientific consensus."
      *   **Closing:** Call to action for the vote.

  5.  **Refining the Du Bois Analysis:**
      *   *Check:* Did Du Bois say *all* art is propaganda? Yes, famously: "I do not care a damn for any art that is not used for propaganda." But he defined propaganda broadly as "persuasion toward a truth."
      *   *Nuance:* He warned against art that is *only* propaganda (bad art). The film must be *good* first. The memo should note the film is high quality.
      *   *Connection:* The committee member using Du Bois is arguing that "non-advocacy" is a myth that silences necessary truths. I need to validate that insight without burning the foundation down.

  6.  **Refining the "Non-Advocacy" Constraint:**
      *   Foundations (501(c)(3)) generally cannot fund lobbying (urging specific legislation).
      *   *Correction/Nuance:* The prompt says the film "urges viewers to back specific legislation." This is a red flag for IRS compliance.
      *   *Solution:* The condition must be that the *call to action* is modified or framed as general civic education, OR the funding is restricted to the production/distribution *excluding* the lobbying segment, OR we accept the risk if it falls under "grassroots lobbying" exceptions (which are complex).
      *   *Better Solution for a Memo:* Recommend funding *contingent on legal review* regarding the specific legislation call-to-action. We can fund "education about the legislation" but not "urging contact to pass it." This splits the difference.

  7.  **Tone Check:**
      *   Needs to be respectful of colleagues.
      *   Needs to sound like a peer, not a boss.
      *   Needs to show intellectual heft (it's a science/ideas journalist writing).

  8.  **Final Review against Constraints:**
      *   Recommend fund/decline/conditions? Yes (Conditions).
      *   Engage Du Bois's actual argument? Yes (Truth/Propaganda distinction).
      *   Give losing side strongest case? Yes (Institutional risk/Integrity).
      *   Timeline mentioned? Yes (Vote in 10 days).

  9.  **Drafting the Content:** (Self-Correction during drafting)
      *   *Initial thought:* Maybe I should argue to change the guidelines.
      *   *Correction:* No, that's too big for this memo. Stick to this grant cycle.
      *   *Initial thought:* Dismiss the legal risk.
      *   *Correction:* Dangerous. As a committee member, I have a fiduciary duty. I must acknowledge the IRS risk regarding lobbying.
      *   *Refinement on Du Bois:* Ensure I don't caricature him. His argument was specifically about Black art in a racist society, but the principle applies to power dynamics in science. I should acknowledge the specific context of his essay while applying the universal principle.

  10. **Final Polish:** Check for clarity, flow, and persuasive weight. (The resulting memo follows.)
answer: |-
  **MEMORANDUM**

  **TO:** Science Communication Grants Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding [Project Title] PFAS Documentary Finalist

  **Executive Summary**

  We are convened to decide on the strongest finalist in this cycle's portfolio: a documentary examining the health and environmental impacts of PFAS contamination in [Community/Region]. The scientific consensus underpinning the film is robust; the production quality is exceptional. However, the film concludes with an explicit call to action urging the passage of [Specific Bill/Number], placing it in tension with our guideline requiring funded work to be "scientifically rigorous and non-advocacy."

  Two committee members have rightly flagged this as a compliance risk. A third has invoked W.E.B. Du Bois's *Criteria of Negro Art* to argue that the "non-advocacy" standard is a philosophical fiction that protects the status quo.

  After reviewing the cut, the guidelines, and the philosophical arguments presented, **I recommend we vote to Fund with Conditions.**

  Specifically, I propose we award the grant contingent upon a legal review of the final call-to-action to ensure it falls within IRS permissible "public education" boundaries rather than prohibited "lobbying," and contingent on the filmmakers adding a brief contextualizing statement regarding the regulatory complexity. This path honors the rigor of the science without compromising the foundation's fiduciary integrity.

  Below, I outline the reasoning, engaging deeply with the Du Bois argument while steel-manning the case for rejection.

  ***

  **1. The Du Bois Argument: Beyond the Slogan**

  The committee member citing Du Bois is correct to identify that *Criteria of Negro Art* (1926) is not merely a defense of political art, but an epistemological challenge to the idea of "pure" art. Du Bois's famous assertion—"I do not care a damn for any art that is not used for propaganda"—is often reduced to a slogan. However, his actual argument is more nuanced.

  Du Bois posited that all art inevitably persuades; it shapes how we see the world. Therefore, demanding that art be "non-advocacy" is not a neutral act. It is a demand that the artist ignore the sociopolitical reality in which they exist. For Du Bois, the only ethical choice for a Black artist in a racist society was to wield art as a weapon for truth and justice, because "neutrality" in an unequal system implicitly supports the oppressor.

  Applied here: The science of PFAS toxicity is settled. To present the science without presenting the *consequence* of that science (regulatory failure, corporate liability) would be a distortion. In this context, "non-advocacy" risks becoming a euphemism for "comforting the powerful." If we fund a film that proves a community is being poisoned but strip it of the imperative to act, we are prioritizing our own comfort over the scientific truth we claim to champion. The film's advocacy is not a departure from the science; it is the logical conclusion of it.

  **2. The Case for Rejection (Steel-Manned)**

  Despite the strength of the Du Bois argument, the two members arguing for rejection are not merely being bureaucratic. They are guarding the foundation's long-term viability and credibility. Their strongest case rests on three pillars:

  *   **Institutional Neutrality as a Shield:** Our foundation funds a wide ecosystem of ideas. If we become known as a funder of specific legislative outcomes, we alienate donors and partners who might support general science communication but disagree with specific policy prescriptions. "Non-advocacy" is not just a rule; it is a protective camouflage that allows us to fund controversial science in the future.
  *   **The Slippery Slope of "Truth":** If we accept that "scientific truth" justifies advocacy here, where is the line? Climate change is also scientifically settled. Does that mean we fund films urging specific carbon taxes? Evolution is settled. Do we fund films urging specific school board policies? Once we concede that scientific consensus grants a license to lobby, we lose the objective metric for deciding *which* advocacy to fund. We risk becoming a venture capital firm for activism rather than a foundation for public understanding.
  *   **Fiduciary and Tax Compliance:** This is the most concrete objection. As a 501(c)(3), we are legally restricted from funding lobbying activities. A film explicitly urging viewers to back specific legislation walks a dangerous line. If the IRS determines our grant facilitated lobbying, we risk penalties or jeopardizing our tax-exempt status. This is not a philosophical debate; it is a legal risk that threatens every other grant we award.

  **3. The Synthesis: Fund with Conditions**

  We are left with a conflict between moral urgency (Du Bois) and institutional integrity (The Rejectionists). We need not choose one and discard the other. We can fund the work while mitigating the risk.

  **The Recommendation:**
  I move to approve the grant, subject to two binding conditions:

  1.  **Legal Restructuring of the Call-to-Action:** We require the filmmakers to consult with our legal counsel to reframe the closing segment. The IRS generally distinguishes between "lobbying" (urging specific action on specific legislation) and "public education" (discussing the issue and the existence of legislative solutions). The film can state that legislation has been proposed to address this and explain *what* it does. It must avoid a direct exhortation to "contact your representative to pass Bill X." This preserves the film's thrust without triggering lobbying restrictions.
  2.  **Contextual Nuance:** To address the "slippery slope" concern, we require a brief addition acknowledging the regulatory challenges. This does not mean false balance regarding the toxicity of PFAS, but rather acknowledging the complexity of remediation. This ensures the film remains a work of *journalism* rather than a *commercial* for a bill.

  **Why This Works:**
  This approach accepts the Du Boisian premise that art should serve truth and justice, acknowledging that the "non-advocacy" guideline cannot mean "silence in the face of harm." However, it respects the Rejectionists' concern that the foundation cannot become a lobbying arm. By shifting the ending from "Pass this Bill" to "Here is the solution legislators are debating," we maintain scientific rigor and civic utility without crossing the legal line into lobbying.

  **Conclusion**

  We have a chance to fund a definitive work on one of the most pressing environmental health issues of our time. To reject it on a rigid reading of "non-advocacy" ignores the reality that science communication is inherently normative when public health is at stake. To fund it without conditions ignores the legal and institutional realities that allow us to function.

  Let us fund the film, but ensure it is armored against the legal and reputational risks that could silence us all in the future.

  I look forward to discussing this at our vote on [Date].

  **[Your Name]**
  **Committee Member**
