      *   **Move (3) Nina:** The "Causal Isolation" rebuttal. My vote doesn't *cause* others to vote. "What if everyone..." is irrelevant to *my* decision.
          *   *Analysis:* This is the core of Causal Decision Theory (CDT). Unless there's a mechanism where my voting forces you to vote, my decision is causally isolated.
