      *   *Philosopher:* "Meaning requires a causal link to the world. You trained it on text, not reality."
      *   *Philosopher:* "Triangulation. You need two people and a world. The AI is just echoing the triangle, not standing in it."
      *   *Philosopher:* "Swampman. Swampman had no past. Your bot has a past of words, not a past of things."
      *   *Philosopher:* "Truth. To mean 'snow is white', you need to know under what conditions it would be false. Does your bot care if it's false? No."

