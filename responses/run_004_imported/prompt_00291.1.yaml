  7.  *(Mental Sandbox)*: Imagine Marcus arguing that if the surrogate is "burn 1 unit of compute," and the threat is "I will simulate you suffering," the agent compares 1 unit compute vs. suffering. If the surrogate is truly low stakes, the agent shouldn't pay. If the agent pays, the surrogate *became* high stakes. Elena needs to argue that the *policy* of paying is what prevents the threat from being instantiated in the first place. It's about ex-ante vs. ex-post rationality.

