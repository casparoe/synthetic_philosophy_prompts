      *   *Check:* Concrete cases? *Adjustment:* Ensure the "Paperclip vs. Staple" or "Compute Resource" examples are specific. Let's use a "Compute Allocation" surrogate vs. "Human Welfare" terminal goal.

  6.  **Final Polish:**
