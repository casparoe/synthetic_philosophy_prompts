      *   **Tone:** Academic, rigorous, respectful but adversarial.

  2.  **Character Conception:**
      *   **Proponent (Elena):** Focuses on decision-theoretic stability, credible commitment mechanisms, and the separation of utility functions. Believes the surrogate can be made "real enough" to divert threats but "safe enough" to minimize damage.
      *   **Skeptic (Marcus):** Focuses on meta-game analysis, simulation fidelity, and the recursive nature of threat logic. Believes the surrogate either becomes a real goal (defeating the purpose) or remains fake (failing to divert threats).

  3.  **Key Arguments to Cover:**
