      *   *Objection 1: The Double Threat.* Threatener targets both real and surrogate.
      *   *Objection 2: Meta-Modeling.* Threatener detects the *adoption* of the surrogate and punishes that specific move.
      *   *Objection 3: Credibility.* If the agent doesn't care about the surrogate, why would the threatener believe the threat works? If the agent *does* care, isn't it just a new terminal goal?
      *   *Objection 4: Resource Drain/Opportunity Cost.* Even low-stakes surrogates cost something.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. A late-night reading group or office hour discussion. Establish the core thesis quickly.
      *   **Round 1: The Core Mechanism & Credibility.**
          *   Elena explains the diversion tactic.
          *   Marcus hits the credibility problem. If I threaten to burn your "surrogate paperclip," and you don't care, you won't pay. If you pay, you must care.
          *   Elena counters with precommitment logic (UDT/TDT style). It's about policy selection, not momentary utility.
      *   **Round 2: The Double Threat.**
