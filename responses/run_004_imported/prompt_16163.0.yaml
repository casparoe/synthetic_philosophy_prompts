answer: |-
  **Marcus:** Jade breaks the model. Water is H₂O everywhere, but "jade" picks out jadeite in some samples and nephrite in others. Two distinct microstructures, one name. If natural-kind terms rigidly designate underlying essences, "jade" shouldn't exist.

  **Elena:** It exists because it's ambiguous, not because the metaphysics fails. "Jade" is like "bank"—two distinct referents sharing a label. Once we disambiguate, "Jadeite is jadeite" and "Nephrite is nephrite" are both necessary a posteriori identities. The tidy story survives.

  **Marcus:** But ordinary speakers aren't disambiguating. They fix the reference via surface properties: green, hard, carveable. If a third mineral matched those traits, they'd call it jade. That makes the term functional, not essentialist.

  **Elena:** Reference fixing isn't descriptive; it's causal. They pointed at samples and said "jade." Science later discovered those samples fell into two chemical kinds. The term rigidly designates whatever structure *those* samples possessed, even if it turns out to be a disjunction.

  **Marcus:** Exactly—a disjunction. "Jade is jadeite or nephrite." But if you can save necessity just by adding disjuncts, you've trivialized it. I could define "grue" as a natural kind and claim it's necessarily emerald-or-sapphire.

  **Elena:** It's not trivial if the disjunction tracks causal powers. Jadeite and nephrite share lattice structures that explain the hardness and toughness. The necessity comes from the fact that *nothing else* could be jade without having those specific structures.

  **Marcus:** But they don't share *the same* structure. They share *similar* macroscopic effects. You're conflating "same kind" with "same utility." The necessity holds only if you ignore the actual chemistry that distinguishes them.

  **Elena:** I'm not ignoring it; I'm letting it determine the reference. Once we know the chemistry, we see "jade" doesn't apply to lookalikes. That's the hallmark of a rigid designator. The discovery was a posteriori, but the identity is necessary.

  **Marcus:** Only because you've retrofitted the kind to the discovery. If the chemistry had been different, but the stone looked the same, we'd still call it jade. That shows the reference was fixed by the cluster, not the essence.

  **Elena:** That just shows speakers can be wrong about the extension. They *thought* they were picking out a uniform kind, but they were pointing at two. The rigidity applies to the actual samples, not the speakers' beliefs.

  **Marcus:** And those actual samples were heterogeneous. So the term doesn't pick out a *natural* kind in the Kripkean sense. It picks out a pragmatic category. The necessary a posteriori works for water, but jade shows it doesn't generalize to all putative natural kinds.

  **Elena:** It shows we must be precise about which terms are kind-terms. "Jade" might be a loose folk-category, but "Jadeite" is a rigid designator. The framework doesn't break; it just demands we let science carve the joints.

  **Marcus:** But science carved them into two. If the folk term splits, then the folk term wasn't rigidly designating an essence to begin with. It was tracking a surface cluster. And clusters are contingent.

  **Elena:** Clusters are how we identify, not what we refer to. The necessity lies in the world, not the identification procedure. Jadeite is necessarily jadeite, regardless of how messy the history of the word "jade" happens to be.

  **Marcus:** Then the theory saves itself by abandoning the actual usage. It explains everything except the word we actually use.

  **Elena:** It explains the word by correcting the ontology. That's the point of the necessary a posteriori.
