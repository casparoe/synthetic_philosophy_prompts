answer: |-
  You have spotted something that most introductory summaries gloss over, and your intuition is spot-on: **the argumentative engines driving these two dialogues are fundamentally different.**

  While standard histories of Chinese philosophy often lump the School of Names (*Ming Jia*) together as "sophists" who enjoyed linguistic paradoxes for the sake of winning debates (similar to the Greek Sophists), your close reading reveals a shift in gear between the *White Horse* and *Hard and White* dialogues.

  To answer your specific worry about imposing Western categories: You aren't just forcing a "logic vs. metaphysics" filing cabinet onto the text. While Gongsun Long's overarching project was likely about *Zheng Ming* (Rectifying Names)—ensuring that language matches reality correctly—the *method* he uses to get there shifts significantly between the two texts. One is primarily semantic (about how words map to groups); the other is primarily epistemological and ontological (about how we perceive properties and whether those properties exist independently).

  Here is the side-by-side walkthrough of the argumentative work, followed by a verdict on which one holds up as serious philosophy today.

  ---

  ### Side-by-Side: The Argumentative Machinery

  #### 1. *White Horse Dialogue* (Bai Ma Lun)
  **The Claim:** "A white horse is not a horse."
  **The Engine:** Semantics and Extension (Classification).

  *   **The Move:** Gongsun Long distinguishes between the *name* of a form and the *name* of a color.
  *   **The Logic:**
      1.  "Horse" is a name that designates a shape/form.
      2.  "White" is a name that designates a color.
      3.  "White horse" is a compound name designating shape + color.
      4.  **The Crucial Test (Extension):** If you ask for a "horse," a yellow or black horse will satisfy the request. If you ask for a "white horse," a yellow or black horse will *not* satisfy the request.
      5.  **Conclusion:** Since the set of things that satisfy "horse" is different from the set of things that satisfy "white horse," the terms are not identical. Therefore, a white horse is not a horse.
  *   **What's doing the work:** This is an argument about **reference and identity**. It relies on the principle of the indiscernibility of identicals (if $A = B$, they must be interchangeable in all contexts). Gongsun Long shows they aren't interchangeable. He is arguing that compound concepts restrict extension.

  #### 2. *Hard and White Dialogue* (Jian Bai Lun)
  **The Claim:** "Hard, white, stone: two." (Not three).
  **The Engine:** Epistemology (Sensory Modalities) and Metaphysics (Universals).

  *   **The Move:** Gongsun Long separates the qualities from the object and from each other based on sensory limitations.
  *   **The Logic:**
      1.  **Epistemological Premise:** You see the whiteness with your eyes, but your eyes cannot feel the hardness. You feel the hardness with your hand, but your hand cannot see the whiteness.
      2.  **Inference:** Since the senses do not apprehend both qualities simultaneously or through the same channel, the qualities are epistemologically distinct.
      3.  **Metaphysical Leap (Self-Hiding / *Zicang*):** When you are not looking at the stone, the "whiteness" does not cease to exist; it "hides itself." The same for "hardness."
      4.  **Conclusion:** "Hardness" and "Whiteness" are independent universals that can attach to a stone, but they are not *of* the stone essentially. Therefore, in the proposition "Hard White Stone," you really only have two independent entities (Hardness, Whiteness) temporarily coinciding, not one unified object.
  *   **What's doing the work:** This is an argument about **perception and ontology**. It argues that because our access to properties is fragmented, the properties themselves might be ontologically independent. It moves from "I can't sense them together" to "They don't exist together essentially."

  ---

  ### The Verdict: Which one holds up today?

  If we strip away the historical context and ask which argument survives as a **serious philosophical contribution** rather than a clever verbal trick, the answer is:

  **The *Hard and White* Dialogue.**

  Here is why.

  #### Why *White Horse* feels like a trick today
  The *White Horse* argument is logically valid but pragmatically misleading. In modern terms, Gongsun Long is exploiting the difference between **class inclusion** and **identity**.
  *   Of course, the concept "White Horse" is not identical to the concept "Horse." (One is a subset of the other).
  *   However, in natural language, "is" usually implies class membership ("A white horse *is a* horse"), not strict identity ("A white horse *is identical to* the concept Horse").

  Today, a logician would say Gongsun Long is committing a category mistake or an equivocation on the word "is." It's a useful lesson in precision (don't confuse subsets with sets), but it doesn't tell us anything deep about the nature of reality. It's a semantic puzzle, akin to saying "A bachelor is not a man" because the definition of bachelor includes "unmarried," which restricts the set of men. It's clever, but it doesn't open new philosophical doors.

  #### Why *Hard and White* is surprisingly modern
  The *Hard and White* dialogue anticipates problems that Western philosophy wouldn't grapple with seriously for another two millennia. It holds up because it tackles three enduring philosophical issues:

  **1. The Problem of Universals:**
  When Gongsun Long argues that "whiteness" can "self-hide" and exist without the stone, he is arguing for a form of **Platonic Realism**. He is suggesting that properties (universals) exist independently of the particular objects that instantiate them. This is a core debate in metaphysics that is still active today (e.g., in the debate between Nominalists and Realists).

  **2. Sense-Data and Qualia:**
  His argument that the eye sees white but not hard, and the hand feels hard but not white, is a proto-empiricist argument about **sense-data**. It anticipates the British Empiricists (like Locke or Russell) who argued that we don't perceive "objects" directly; we perceive bundles of sensory data (color, texture) that our mind constructs into an object. Gongsun Long is essentially arguing for a **Bundle Theory** of objects before Hume ever wrote a word.

  **3. The Fragmentation of Perception:**
  The argument highlights the limits of human epistemology. We never experience the "whole" object; we only experience slices of it through specific sensory channels. This resonates with modern phenomenology and cognitive science, which acknowledge that our brain synthesizes disparate sensory inputs into a unified perception. Gongsun Long is questioning whether that unity is real or just a cognitive convenience.

  ### The "Western Filing Cabinet" Check
  You asked if you were imposing Western categories. You *are* using Western terms (epistemology, metaphysics), but you aren't distorting the text. In fact, you are rescuing Gongsun Long from the "sophist" label.

  In the Warring States period, the distinction between "language," "knowledge," and "reality" wasn't as compartmentalized as it is in a modern university. For Gongsun Long, fixing Names (*Ming*) *was* fixing Reality.
  *   In *White Horse*, he fixes Names by showing they have different extensions.
  *   In *Hard and White*, he fixes Reality by showing that the referents of those Names (Hardness, Whiteness) are ontologically distinct.

  So, while he might have seen them as one project (Rectifying Names), your distinction that the *mechanisms* differ is correct. The first is a linguistic correction; the second is a metaphysical claim.

  ### Conclusion
  The *White Horse* dialogue is a brilliant piece of **logical semantics**, but it functions mostly as a paradox to shock the listener into paying attention to definitions.

  The *Hard and White* dialogue is a serious piece of **metaphysics**. It argues that the world is composed of independent properties that we perceive through limited sensory windows, and that objects are merely temporary gatherings of these properties. That is not a trick; that is a genuine ontological hypothesis that rivals Bundle Theory or Trope Theory in contemporary metaphysics.

  If you want to cite Gongsun Long as a philosopher who was "ahead of his time" rather than just a "debater," point to the stone, not the horse. The stone argument asks, "What is the status of a property when no one is perceiving it?" That is still a hard question. The horse argument just asks, "Can we define our terms precisely?" We solved that with set theory.
