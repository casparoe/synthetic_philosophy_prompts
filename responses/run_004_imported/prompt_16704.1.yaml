  *(Self-Correction Note)*: Wait, I need to be careful not to validate Alex's logic *too* much if the premises are shaky. Alex says "There's no fifth option." Priya says "There is (outsider/error)." This is the crux. I need to make sure the analysis reflects that Alex is *conditionally* right, while Priya is *pragmatically* right.

