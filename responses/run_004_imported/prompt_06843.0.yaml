      *   *The "Lapse" accusation:* It's not a lapse. It's a consistent application of *actual* vs. *potential* utility.
      *   *Dramatic Potential:* The scene could involve an interlocutor raising the user's exact point (the population argument was common then). Bentham's rebuttal is the key.

