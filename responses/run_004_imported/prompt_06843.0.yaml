answer: |-
  This is a sophisticated question that touches on a debate in moral philosophy that didn't fully crystallize until the 20th century (specifically in the work of Derek Parfit on "population ethics"). However, regarding Bentham specifically: **you have identified a tension that Bentham himself anticipated and resolved.** His tolerance for what he called "irregularities" of sex was not a lapse from his principles, but a rigorous application of them.

  For the purposes of your novel, you can stage this scene with confidence that Bentham had answers to exactly this objection. Here is how his calculus actually handles the "procreation vs. pleasure" dilemma, broken down into the arguments you can put in his mouth.

  ### 1. The "Greatest Number" Refers to Existing Sentience
  The most common misunderstanding of the phrase "the greatest happiness of the greatest number" is that it implies we should maximize the *number* of people. Bentham did not hold a "Total View" of utilitarianism (where adding more happy people always increases the good). He held a view focused on **existing sentient beings.**

  To Bentham, a potential person has no interests. They cannot feel pleasure, and they cannot feel pain. Therefore, the "lost happiness" of a child never conceived is not a negative value in the calculus. It is a zero.
  *   **For the scene:** If a character argues that non-procreative sex deprives the world of future happiness, Bentham would reply that it also deprives the world of future *pain*. Since the unborn do not exist to suffer the deprivation, there is no victim. The calculus only counts the pleasure and pain of those actually involved.

  ### 2. The Certainty of Pain vs. The Speculation of Gain
  Bentham's argument for decriminalization (found in his unpublished essays like *Offences Against One's Self*) relies heavily on the **certainty** of consequences.
  *   **The Pain:** The pain caused by criminalization is certain, severe, and extensive. It includes imprisonment, execution, public shame, and the constant threat of blackmail (which Bentham noted was a rampant side-effect of criminalization).
  *   **The Gain:** The "gain" of procreation is speculative. A single sexual act does not guarantee a child. Furthermore, a child's life is not guaranteed to be a net positive in utility; life contains suffering.
  *   **For the scene:** Bentham would weigh the *certain* agony of a man hanged or pilloried against the *hypothetical* utility of a child who might or might not be born, and who might or might not be happy. The certain pain of the law vastly outweighs the speculative utility of population growth.

  ### 3. The Empirical Claim: It Is Not a Zero-Sum Game
  In Bentham's time, the common moral argument against sodomy was indeed that it reduced the population (a mercantilist view common in the 18th century). Bentham dismissed this on empirical grounds.
  *   He argued that engaging in same-sex acts does not preclude a man from marrying and procreating. He viewed sexual drive as not necessarily finite in a way that makes one act cancel out the other.
  *   He also noted that population was not in short supply in England; the "mischief" of a slightly slower population growth rate was negligible compared to the "mischief" of state-sponsored torture.
  *   **For the scene:** Bentham can point out that a man who enjoys "irregularities" is not thereby rendered incapable of fathering children. To assume he would otherwise be busy procreating is a fantasy.

  ### 4. The "Harm Principle" Predecessor
  Bentham's utilitarianism is deeply tied to the idea that law should only prevent harm to others.
  *   Private consensual acts produce pleasure for the participants and no pain to anyone else (excluding the "antipathy" of observers, which Bentham explicitly dismissed as an illegitimate ground for legislation).
  *   If the state intervenes, the state *creates* pain where there was none.
  *   **For the scene:** This is the core of his radicalism. He would argue that the "pain" felt by society is merely prejudice ("the principle of sympathy and antipathy"), not actual harm. To legislate based on prejudice is to violate the calculus.

  ### How to Stage the Scene
  To make this dramatically compelling without turning it into a lecture, you might have an interlocutor (perhaps a more conventional friend, a publisher, or a rival) raise the exact point you raised. It was a common argument of the time.

  **The Interlocutor:** "But Jeremy, if nature intends the act for propagation, and you sever that link, do you not steal from the future? Every child not born is a universe of happiness lost. How does your sum account for that?"

  **Bentham's Rebuttal (in character):**
  He shouldn't sound like a modern philosopher, but like a man obsessed with precision and the reality of suffering.
  *   *On the Unborn:* "You count the happiness of ghosts. I count the suffering of the living. The child that is not, does not weep. The man in the cell, he weeps."
  *   *On the Law:* "The law is a blunt instrument. It strikes with certainty. It brings pain that is real, blood that is real, terror that is real. Against this, you weigh a phantom population. I will not balance a certain agony against a possible joy."
  *   *On the "Lapse":* "It is no lapse. It is consistency. If we must maximize happiness, we must first stop manufacturing misery. The law manufactures misery. Therefore, the law is the error."

  ### Historical Note for Accuracy
  It is crucial for your novel's integrity to note that **Bentham never published these views.** He wrote extensively on the topic (in *Offences Against One's Self* and other fragments) but kept them private, often writing in code or Greek, fearing that public knowledge of these views would discredit his entire philosophical project and the penal reforms he cared about.

  This adds a layer of tragedy and tension to your scene. He *knows* the calculus is clear, but he knows the *public utility* of his reputation might require him to stay silent. He is trapped between the truth of his principle and the practical utility of his public standing.

  **Verdict:** Your intuition identifies a classic objection to utilitarianism, but Bentham has a consistent internal defense against it. He does not count potential people as moral patients, and he prioritizes the relief of actual suffering over the creation of potential happiness. His stance is consistent, not a lapse.
