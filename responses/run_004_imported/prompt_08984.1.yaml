  quick one for you — I'm writing a mathematician character who keeps insisting she "believes" the Collatz conjecture even though nobody's proved it, and I want her reasoning on the page to sound legit instead of just hand-wavy gut feeling. I stumbled on this idea of "logical induction," some framework for putting probabilities on unproven math statements, but the actual details went over my head. Can you break down the most important implications of logical induction for how rational it is to be confident in something like Collatz, given its basically just backed by mountains of computation and no actual proof? trying to get her internal monologue right without dumbing it down too much, thanks!
