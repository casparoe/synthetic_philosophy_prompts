answer: |-
  Two game theorists, Eli and Claire, are playing the centipede game at a coffee shop. The pot starts at ten dollars. Every time a player passes, the pot doubles, but either player can take the whole pot and end the game.

  Eli passes. The pot becomes twenty dollars.
  Claire immediately takes the twenty dollars.

  Eli: "Hey! I passed so we could get to the hundred-dollar round!"

  Claire: "You can't do that."

  Eli: "I just did."

  Claire: "No, *rationally* you couldn't. Backward induction says you take the money at node one. By passing, you violated common knowledge of rationality."

  Eli: "I was being nice."

  Claire: "Nice isn't a strategy, it's a glitch. If you're rational, you defect. If you defect, I can predict you. But you passed, which means you're either irrational or you don't know the rules. If you're irrational, I don't know what you'll do next. You might burn the money. You might pass forever. My model just tried to update on an event with prior probability zero."

  Eli: "So your brain crashed?"

  Claire: "Essentially. I got a divide-by-zero error on your character. I'm not betting against a singularity. I took the money before the universe corrected itself."
