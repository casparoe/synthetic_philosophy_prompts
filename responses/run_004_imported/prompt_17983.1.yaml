answer: |-
  You are right, and your friend is relying on a very narrow, short-sighted definition of "rational."

  This is a classic scenario often discussed in game theory and ethics. Your friend is arguing from the perspective of a **"one-shot game"** (you will never interact with this person again), whereas you are arguing from the perspective of a **social contract** (how society functions and how you view yourself).

  Here is the tiebreaker breakdown on why your friend's logic is flawed and why paying is actually the more rational move.

  ### 1. The Legal Reality (It's not a gift)
  Your friend suggests there are no consequences, but that is legally incorrect. A verbal agreement for services rendered is a binding contract.
  *   **Theft of Services:** By agreeing to pay $300 and then refusing to do so after receiving the service, you have effectively committed theft.
  *   **Unjust Enrichment:** In civil court, the doctrine of unjust enrichment prevents someone from benefiting at another's expense without compensation.
  *   **Evidence:** He has your license plate number. He knows your car's make, model, and likely your destination. If he wanted to pursue it (or report you for fraud), he has enough information to find you. It might be unlikely he *will*, but saying there is "no way to make you pay" is factually wrong.

  ### 2. The Psychological Cost (Integrity has value)
  Your friend is calculating rationality only in dollars ($300 gain). He is ignoring the internal cost.
  *   **Self-Concept:** Most people derive utility from seeing themselves as "good people." Breaking a promise, especially to someone who explicitly said, "I'm doing this because I trust you," creates cognitive dissonance. You have to live with the knowledge that you exploited someone's kindness.
  *   **The "Slippery Slope":** Rationality involves long-term behavioral patterns. If you condition yourself to break promises when it's inconvenient, you erode your own integrity. That makes you more likely to cut corners in other areas of life, which can lead to worse outcomes later.

  ### 3. The "World You Want to Live In" Argument
  This is the Kantian argument. If your friend's logic were universalized (i.e., *everyone* did what your friend suggests), the system would collapse.
  *   **The Ecosystem of Help:** If everyone stranded on the road stiffed the Good Samaritans, Good Samaritans would stop stopping.
  *   **Rational Self-Interest:** You, too, will eventually be in a position where you need help and have no way to pay immediately. By paying this guy, you are contributing to a world where people help each other. By stiffing him, you are contributing to a world where people drive past stranded motorists. It is rational to want to live in the former world.

  ### 4. The Risk Assessment is Flawed
  Your friend claims there is "no reputation on the line." In the digital age, this is rarely true.
  *   **Small World Theory:** You might run into him again. He might know someone you know.
  *   **Surveillance:** Between dashcams, traffic cameras, and ATM cameras, the idea that this interaction is truly anonymous is an illusion.
  *   **The Cost of Paranoia:** If you don't pay, you now have to wonder, "Is that him?" every time you see a pickup truck. That is a mental burden that isn't worth $300.

  ### The Verdict
  Your friend is confusing **opportunism** with **rationality**.

  *   **Opportunism:** Taking advantage of a immediate situation for gain without regard for rules or future consequences.
  *   **Rationality:** Making the choice that maximizes your well-being over the long term, considering legal risk, psychological peace, and social stability.

  **The Tiebreaker:**
  You should pay the $300. Not just because it's "nice," but because your friend's calculation ignores the legal risk, the psychological cost of being a person who breaks promises, and the long-term benefit of maintaining a society where people help each other.

  Tell your friend: **"If I don't pay, I'm not a smart operator; I'm just a thief who got lucky. And I don't want to be that guy."**
