      *   **Actor 2 (Truck Driver):** Stops, hesitant, agrees based on trust ("you seem like someone who'd actually pay me back"), tows you.
      *   **Outcome:** Safe in town, money available.
      *   **Conflict:** Friend says don't pay (rational/selfish argument). You say pay (moral argument).
      *   **Question:** Is the friend right that ditching is the *rational* move, or is something missing?

  2.  **Evaluate the "Friend's Argument" (Rational Choice Theory/Egoism):**
      *   *Premise:* The transaction is complete. The service is rendered.
      *   *Constraint:* No legal contract (verbal agreement might be hard to enforce), no immediate coercion, no reputation damage (strangers, unlikely to meet again).
      *   *Conclusion:* Keeping the $300 maximizes immediate personal utility.
      *   *Flaw:* This is a very narrow definition of "rational." It ignores long-term psychological costs, societal implications, and the definition of rationality that includes personal integrity.

  3.  **Evaluate the "User's Argument" (Moral/Ethical):**
      *   *Premise:* A promise was made. Trust was given.
      *   *Constraint:* Moral obligation, sense of fairness.
      *   *Conclusion:* Paying is the "right" thing to do.
      *   *Strength:* Aligns with social contract theory, virtue ethics, and most legal frameworks (unjust enrichment).

  4.  **Identify the Missing Pieces (Why the friend is wrong about "Rationality"):**
      *   **Legal Reality:** A verbal contract *is* a contract. Promissory estoppel. Unjust enrichment. It's technically theft of services.
      *   **Psychological Cost:** Guilt, cognitive dissonance, self-image. "I am the kind of person who breaks promises."
      *   **Societal/Generalizable Rationality:** If everyone did this, the system collapses. No one helps stranded motorists anymore. This is the "Kantian Categorical Imperative."
      *   **Risk Assessment:** License plate was likely seen. Description known. In the digital age, "never see him again" isn't guaranteed (cameras, witnesses, small world theory).
      *   **Definition of Rationality:** True rationality includes maintaining one's own integrity and mental peace, not just immediate cash flow.

