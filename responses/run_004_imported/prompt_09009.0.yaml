      *   *Section 3: Where they diverge.* Competition vs. Solitude. Explicit rules vs. Implicit norms.
      *   *Section 4: Synthesis/Utility.* When is the auction a good model? (Price wars, litigation). When is it bad? (R&D, personal habits).
      *   *Conclusion:* The auction is a specific *subset* of escalation (competitive), not the whole phenomenon. It's a metaphor that works well for the *feeling* but poorly for the *cause* in non-competitive contexts.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say the Dollar Auction is *purely* rational. It's rational *within the trap*, but entering it is irrational. Same with escalation.
