      *Scenario 2 (High Stakes for Subject, Low Standards for Speaker):*
      *   Alice is feeding it to her deathly allergic child. (High Stakes).
      *   Speaker is a friend chatting casually at a party. "Does she know if it's safe?" (Low Standards).
      *   *Verdict:* Encroachment says "She doesn't know" (stakes high). Contextualism says "She knows" (standards low). **Disagreement!**

      *Refining the Scenarios:*
