answer: |-
  You have hit on one of the most frustrating things about reading introductory epistemology. You are absolutely right: the famous "Bank Cases" (originally from Keith DeRose) are often criticized for exactly this reason. In the standard telling, when the stakes go up for the subject (the bank closes tomorrow vs. in two weeks), the *conversation* usually shifts to a serious tone, which raises the conversational standards too. It creates a "perfect storm" where both theories predict the same result ("She doesn't know"), making it hard to see the theoretical machinery underneath.

  To see the daylight between them, we need to **orthogonalize the variables**. We need to hold the evidence constant, then vary the **Subject's Stakes** (Encroachment's trigger) and the **Attributor's Context** (Contextualism's trigger) independently.

  Here is a scenario using **Gluten-Free Flour** (no banks involved).

  ### The Setup (Constant Evidence)
  **Subject:** Sarah.
  **Proposition:** "This bag of flour is gluten-free."
  **Evidence:** Sarah bought a bag labeled "Certified Gluten-Free" at a standard grocery store. She has not sent it to a lab for chemical analysis.
  *(Note: In the real world, mislabeling is rare but possible.)*

  ---

  ### Scenario 1: Low Stakes for Subject / High Standards for Speaker
  **The Situation:** Sarah is baking cookies for herself. She has no gluten intolerance. If the label is wrong and there is gluten, she eats a cookie and gets a mild stomach ache. (Low Stakes).

  **The Conversation:** Sarah's friend, Mark, is a lawyer preparing a class-action lawsuit against the flour company for mislabeling. Mark is talking to his paralegal.
  **Mark:** "We need to prove they are selling mislabeled products. Look at Sarah. She bought this bag. Does she *know* it's gluten-free?"
  **Paralegal:** "Well, she only checked the label."
  **Mark:** "Exactly. In a court of law, checking a label isn't enough to rule out manufacturing error. We can't claim she *knows* it without a lab test."

  **The Verdict:**
  *   **Pragmatic Encroachment:** Focuses on **Sarah**. For her, being wrong costs nothing significant. Her evidence (the label) is sufficient for her practical situation.
      *   *Verdict:* **TRUE** ("Sarah knows").
  *   **Contextualism:** Focuses on **Mark (the Speaker)**. In his conversation, the possibility of error (mislabeling) is highly salient. The standards for "knowledge" have been raised to legal/liability levels.
      *   *Verdict:* **FALSE** ("Sarah does not know").

  **Daylight:** Encroachment says she knows; Contextualism says she doesn't.

  ---

  ### Scenario 2: High Stakes for Subject / Low Standards for Speaker
  **The Situation:** Sarah is baking a cake for her daughter, who has a severe, life-threatening Celiac allergy. If the label is wrong, her daughter goes to the ER. (High Stakes).

  **The Conversation:** Sarah's husband, Dave, is chatting casually with a neighbor at a BBQ. They are watching Sarah bake in the distance.
  **Dave:** "Sarah is using that blue bag. Does she *know* that's gluten-free?"
  **Neighbor:** "Yeah, she knows. She bought the one with the big label."
  *(Note: In this conversation, no one is thinking about lawsuits, lab tests, or death. It's casual chit-chat. Error possibilities are not salient.)*

  **The Verdict:**
  *   **Pragmatic Encroachment:** Focuses on **Sarah**. For her, being wrong is catastrophic. Her evidence (the label) is *not* sufficient for life-or-death stakes; she should have tested it or bought from a dedicated facility.
      *   *Verdict:* **FALSE** ("Sarah does not know").
  *   **Contextualism:** Focuses on **Dave (the Speaker)**. In his conversation, the standards are low. The possibility of a mislabeled bag is not being discussed or highlighted. For casual purposes, a label counts as knowledge.
      *   *Verdict:* **TRUE** ("Sarah knows").

  **Daylight:** Contextualism says she knows; Encroachment says she doesn't.

  ---

  ### Why this matters
  In the standard Bank Case, the stakes go up, and the conversation usually gets serious. Both theories say "No Knowledge." It looks like they agree.

  In these flour cases, you can see they are actually making claims about **different things**:
  1.  **Contextualism** claims knowledge is a property of the **sentence/conversation**. The word "knows" changes meaning like "tall" or "flat." (Tall for a jockey vs. tall for a basketball player).
  2.  **Encroachment** claims knowledge is a property of the **agent's belief**, but that belief's status depends on practical rationality. You can't separate "what you know" from "what you need to do."

  ### The "Invariantist" Spoiler
  Just to complete the map: A **Strict Invariantist** would look at both scenarios and say, "You're both crazy. Sarah has the same evidence in all four cases. Either that evidence is enough for knowledge, or it isn't. Stakes and conversations don't change truth."

  But if you want to see Contextualism and Encroachment fight each other specifically, the **Flour Cases** above force them to give opposite answers. Encroachment cares about Sarah's stomach/hospital; Contextualism cares about Mark's lawsuit/Dave's BBQ chat.

  Does that separate them clearly enough for your rabbit hole?
