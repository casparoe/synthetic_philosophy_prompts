      *Refining the "Constitutional" analogy:* Constitutions have amendment clauses. The user's instruction lacked one. The "drift" is like a natural disaster making the law impossible to execute. It's not changing the law; it's acknowledging the terrain changed.

      *Refining the "Inside Test":* The most powerful test for a scientist is: "Does this correction move the result toward my preferred hypothesis, or away from it?" If it moves it *away*, it's likely honest. If *toward*, it's suspect. But even better: "Is the calibration evidence independent of the experimental outcome?"

