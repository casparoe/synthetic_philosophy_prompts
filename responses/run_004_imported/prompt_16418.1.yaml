answer: |-
  **The Unity Field**

  The ventilator was a lie.

  I knew this intellectually, of course. We all did. But after the Ontological Correction, knowing wasn't enough; I could *see* the lie.

  Where the machine sat beside the bed, my eyes didn't find a single boundary. There was no "ventilator." There were only billions of simples—plastic-wise, metal-wise, circuit-wise—hovering in a loose, causal agreement. They shimmered like heat haze, a cloud of disconnected points pretending to be a whole. If I focused, I could see the gaps between the screw and the casing, not as physical space, but as ontological voids. There was nothing holding them together but physics.

  Then I looked at the patient.

  Elara was seven years old. She was burning.

  Unlike the machine, Elara was a singularity. Her simples weren't just arranged life-wise; they were *caught* in the event of living. To my corrected vision, she glowed with a tight, impossible unity. She was one thing. A true composite. The only kind of object that actually existed in this universe, according to van Inwagen's law.

  "Pressure dropping," said the nurse. She hadn't undergone the Correction. To her, the ventilator was a solid, reliable block of plastic. To me, it was a swarm of dust motes failing to coordinate.

  "Manual bag," I said. My voice sounded thin. In this room, there were only three real objects: me, Elara, and the nurse. The bed, the lights, the walls—they were all fictions. Arrangements. Convenient stories we told the simples to keep them from scattering.

  I grabbed the resuscitation bag.

  This was the hard part. The bag was dead matter. It had no unity. When my fingers closed around it, I didn't feel the resistance of a single object pushing back. I felt the distinct, separate pressure of billions of individual simples pressing against the simples of my skin. It was like trying to hold onto a handful of sand that refused to be a handful.

  "Come on," I whispered. I squeezed.

  The air moved. The simples arranged air-wise flowed into the simples arranged lung-wise. But the causality felt fragile. I was a real thing trying to manipulate a ghost. Every time I squeezed, I expected the bag to dissolve, for the plastics to forget their arrangement and drift apart like smoke.

  Elara's unity flickered.

  That's what death looked like, post-Correction. It wasn't a fading light; it was a loosening. The tight knot of her existence began to unravel. The boundary that made her *Elara* and not just *particles arranged Elara-wise* started to fray. If she died, she would cease to be an object. She would become just another lie, like the ventilator.

  "I can't get a seal," I said. My hands were shaking. The ontological dissonance was making me nauseous. How could I save a True Object with a Fake Tool? It felt like a category error. Like trying to sweep up dust with a thought.

  "Stop thinking about it," the nurse snapped. She grabbed my wrist. Her grip was real. She was an organism. Her touch anchored me. "The machine doesn't need to exist for the air to move. Just pump the bag."

  She was right. Van Inwagen never said artifacts couldn't cause things. They just weren't *things* themselves. The simples arranged lever-wise could still move the simples arranged valve-wise. But knowing that didn't stop the vertigo.

  I looked down at the bag. I forced my brain to ignore the shimmering scatter. I imposed the fiction upon it. *This is a tool,* I thought. *This is one thing.*

  I squeezed.

  The simples cooperated. Air rushed. Elara's chest rose. For a second, the fraying edges of her unity snapped back tight. She was whole again.

  I kept pumping. Squeeze. Release. Squeeze. Release.

  I was a living object, trapped in a universe of dead dust, pretending the dust was solid so I could keep the only real thing in the room from becoming dust too. It was the loneliest work in the world. But as long as her unity held, as long as she remained One, the lie of the machine didn't matter.

  "Stabilizing," the nurse said.

  I looked at my hands. They were glowing, faintly. Real.
  I looked at the bag. It was still just a swarm.

  "Get me a new one," I said, dropping the fake onto the fake table. "This arrangement is tired."
