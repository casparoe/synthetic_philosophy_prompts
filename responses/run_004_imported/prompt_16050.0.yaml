answer: |-
  This is one of the deepest conceptual hurdles in the Logical Induction paper, and your intuition is correctly pinging on the tension between Tarski's undefinability and the paper's claims. You have identified the exact spot where the magic happens: the shift from **semantic truth** to **economic equilibrium**.

  Here is the gears-level intuition for why the self-reference machinery doesn't blow up, and why "resistance to exploitation" is sufficient to enforce coherence.

  ### 1. Truth vs. Betting Odds (The Category Shift)

  The first key is to recognize that Logical Induction sidesteps Tarski not by solving the Liar Paradox, but by refusing to answer the question the Liar Paradox asks.

  Tarski's theorem forbids a consistent **truth predicate** within a language. It says you cannot have a function $True(\phi)$ that outputs "True" or "False" such that $True(\ulcorner \phi \urcorner) \iff \phi$. If you try to construct a Liar sentence $L \iff \neg True(\ulcorner L \urcorner)$, the system explodes.

  Logical Induction does not provide a truth predicate. It provides a **price sequence**. A price of $0.5$ does not mean "True" or "False"; it means "The market is currently indifferent."

  When you construct a self-referential sentence like $S$: *"The price of $S$ on day $n$ will be less than $0.5$,"* you are not creating a logical contradiction. You are creating a **feedback loop**.
  *   If the price is $0.1$, the sentence is effectively "True" (the condition is met). Shares pay out $\$1$. Traders see cheap shares that pay $\$1$ and buy. Price goes up.
  *   If the price is $0.9$, the sentence is "False" (the condition is not met). Shares pay $\$0$. Traders see expensive shares that pay $\$0$ and sell. Price goes down.

  In a binary truth system, this is a paradox. In a continuous pricing system, this is a **thermostat**. The pressure from traders pushes the price toward the one point where the buying pressure equals the selling pressure.

  ### 2. The Daily Fixed Point (Resolving the Circularity)

  Your hunch about "day by day" computation is half the story. The other half is how the price for *today* is actually set.

  You might worry: *"To set the price for today, I need to know the truth of the sentence. But the sentence talks about the price I'm trying to set. Isn't that circular?"*

  The market resolves this circularity **economically**, not logically. Here is the mechanism:
  1.  Traders do not submit single bets (e.g., "I buy 10 shares"). They submit **demand functions** (e.g., "At price $p$, I want to hold $f(p)$ shares").
  2.  The market mechanism looks at the aggregate demand of all traders.
  3.  It searches for a price $p$ where the total net demand is zero (Market Clearing).

  For the self-referential sentence $S$ ("Price of $S < 0.5$"), a rational trader's demand function looks like a step or slope: *Buy if $p < 0.5$, Sell if $p > 0.5$.*
  At exactly $p = 0.5$, the trader's demand is zero. They don't want to buy, and they don't want to sell.

  The market finds this fixed point ($0.5$) and sets the price there.
  *   **Does the sentence have a truth value?** In the metalanguage, yes. At $p=0.5$, the statement "$p < 0.5$" is false.
  *   **Does the market know it's false?** No. The market just knows that at $0.5$, no trader is willing to bet against it.
  *   **Does a trader make money?** If the price stays at $0.5$, the share always pays $\$0$ (because the sentence is false). But the trader never bought any shares (demand was zero at equilibrium). So the trader makes $\$0$ profit.

  The paradox is defused because the market settles at the **point of zero exploitation**. The Liar sentence doesn't crash the system; it just becomes a financial instrument that nobody trades, priced at $0.5$.

  ### 3. Why "No Exploitation" Implies Coherence

  This addresses your second question: *Why does mere resistance to exploitation force self-referential coherence?*

  In standard probability theory, we enforce coherence (e.g., $P(A) + P(\neg A) = 1$) by axiom. In Logical Induction, coherence is an **emergent property of survival**.

  Imagine the market sets incoherent prices. For example, suppose it prices $A$ at $0.6$, $\neg A$ at $0.6$, and the self-referential sentence $S$ ("Price of $A < 0.5$") at $0.9$.
  *   **Arbitrage:** A trader can buy $A$ and $\neg A$ for $\$1.20$ total. One of them must pay $\$1$. The trader loses $\$0.20$ guaranteed. Wait, that's not exploitation.
  *   **Dutch Book:** A trader can sell $A$ and sell $\neg A$. They collect $\$1.20$. They must pay out $\$1.00$ (since exactly one is true). They make a risk-free profit of $\$0.20$.
  *   **Self-Ref Exploitation:** If the market prices $S$ at $0.9$, it is asserting high confidence that "Price of $A < 0.5$". But the Price of $A$ is $0.6$. The statement is false. A trader can sell $S$ at $0.9$, knowing it will pay $\$0$. Risk-free profit.

  If the market allows these prices, a computable trader can execute these strategies every single day. Their wealth grows linearly (or exponentially, if they reinvest).
  The definition of a Logical Inductor requires that **no** polynomial-time trader can drive their wealth to infinity.
  Therefore, if the market prices are incoherent, they are exploitable. If they are exploitable, the market is not a Logical Inductor.
  Thus, **any** Logical Inductor must, by definition, converge toward coherence. It doesn't need to "know" logic; it just needs to stop losing money to traders who do.

  ### 4. The "Aha": Logic as a Market Equilibrium

  The fundamental insight is that **logical consistency is isomorphic to market efficiency** in this construction.

  *   **Tarski's Wall:** You cannot define truth self-referentially because truth is binary and static. A binary switch cannot settle in the middle of a feedback loop.
  *   **Logical Induction's Loophole:** Prices are continuous and dynamic. A feedback loop doesn't require a binary state; it requires an **equilibrium**.

  The self-reference machinery works because the "truth" of the self-referential sentence is not determined by a proof, but by the **fixed point of the traders' beliefs**.
  *   If traders believe the price will be low, they buy, making the price high (falsifying the sentence).
  *   If traders believe the price will be high, they sell, making the price low (verifying the sentence).
  *   The only stable state is where traders are uncertain (price $0.5$), demand is zero, and no wealth is transferred.

  The system doesn't "solve" the Liar Paradox. It **prices** the Liar Paradox. It assigns it a value of $0.5$ and treats it as irreducible uncertainty. Since no computable trader can predict the outcome of a fair coin flip better than chance, no trader can extract unbounded wealth from it.

  ### Summary

  1.  **Prices $\neq$ Truth:** The market assigns credences (0 to 1), not boolean values. This turns logical cliffs into economic slopes.
  2.  **Daily Clearing:** Circular dependencies are resolved daily by finding a price where net trader demand is zero. Paradoxical sentences settle at prices where traders stop betting (usually 0.5).
  3.  **Evolutionary Pressure:** Coherence isn't hardcoded; it's selected for. Incoherent prices print free money. Traders take the money. The only prices that survive long-term are coherent ones.

  The "self-reference machinery" is just the Diagonal Lemma giving the traders a mirror to look into. The market mechanism ensures that when they look in the mirror, they don't see a contradiction; they see a price where they decide not to trade.
