answer: |-
  This is a fantastic pedagogical hurdle to clear. You are absolutely right that the axiomatic tension is often glossed over in political philosophy seminars, even though it's the mathematical engine driving the normative disagreement.

  Here is the breakdown you need for the board, followed by the verdict on Gauthier.

  ### Part 1: The IIA vs. Monotonicity Tension

  The core conflict is between **local** vs. **global** information.

  *   **Nash (IIA):** The solution depends only on the shape of the feasible frontier *at the solution point*. It asks: "At the margin, how much does Player 1 have to give up to get a bit more for Player 2?" It ignores how good things *could* have been if the frontier were shaped differently elsewhere.
  *   **Kalai-Smorodinsky (Monotonicity):** The solution depends on the *ideal points* (the maximum possible utility for each player). It asks: "What fraction of their maximum potential is each player realizing?" It ignores the curvature of the frontier between the solution and the ideal points.

  #### The Concrete Example for the Board
  To show them diverging, you need a **non-linear (strictly convex) feasible set**. On a linear frontier, Nash and KS usually coincide, which is why students get confused.

  **Setup:**
  *   **Disagreement Point ($d$):** $(0,0)$.
  *   **Feasible Set ($S$):** Bounded by the curve $y = 10 - \frac{x^2}{10}$ (for $x,y \geq 0$).
      *   *Note:* This is a convex set (bowed inward toward the origin).
  *   **Ideal Points:**
      *   If Player 1 takes everything ($y=0$), $x_{max} = 10$.
      *   If Player 2 takes everything ($x=0$), $y_{max} = 10$.

  **Round 1: The Initial Bargain**
  *   **Kalai-Smorodinsky (KS):** Equalizes relative gains. Since ideal points are symmetric (10, 10), KS demands $x = y$.
      *   Solve $x = 10 - x^2/10 \rightarrow x \approx \mathbf{6.18}$.
      *   **KS Outcome:** $(6.18, 6.18)$.
  *   **Nash:** Maximizes the product $xy = x(10 - x^2/10)$.
      *   Take derivative, set to 0: $10 - 3x^2/10 = 0 \rightarrow x = \sqrt{100/3} \approx \mathbf{5.77}$.
      *   **Nash Outcome:** $(5.77, 6.66)$.
      *   *Observation:* Nash favors Player 2 here because of the curvature (risk attitudes embedded in the utility shape). KS ignores the curvature and splits the "potential" equally.

  **Round 2: The "Irrelevant" Change (The IIA Test)**
  Now, imagine we restrict Player 1's maximum potential, but **do not touch the area where the agreement was reached.**
  *   **New Constraint:** $x \leq 8$.
  *   **New Ideal Points:** $x_{max} = 8$, $y_{max} = 10$.
  *   **Feasibility:** The previous Nash outcome $(5.77, 6.66)$ is still feasible (since $5.77 < 8$). The local slope of the curve at that point hasn't changed.

  **The Divergence:**
  *   **Nash (Respects IIA):** Since the local trade-off rate at $(5.77, 6.66)$ hasn't changed, and the point is still feasible, **Nash stays at $(5.77, 6.66)$.** It treats the reduction of P1's *maximum possible* gain as "irrelevant" because P1 wasn't going to get that maximum anyway.
  *   **KS (Violates IIA, Respects Monotonicity):** KS looks at the ratio of ideal points. The ratio shifted from 10:10 to 8:10. Player 1's "claim" on the surplus has weakened globally.
      *   KS now looks for the intersection of $y = \frac{10}{8}x$ and the curve.
      *   **New KS Outcome:** Approx $(5.5, 6.9)$.
      *   *Result:* Player 1 gets **less** than before, even though the options removed were ones they weren't using.

  **The Intuitive Pitch to Students:**
  > "Nash says bargaining power is determined by the **marginal trade-off** right here at the deal. If I cap your maximum potential way over there, but it doesn't change the cost of cooperation right here, your deal shouldn't change.
  >
  > "Kalai-Smorodinsky says bargaining power is determined by your **best alternative**. If I cap your maximum potential, I have weakened your standing in the partnership, even if we weren't aiming for that maximum. You should accept a smaller share because your 'potential' shrank."

  ---

  ### Part 2: Gauthier and Minimax Relative Concession

  **The Verdict:** Your half-memory is **correct**.

  In the standard two-person bargaining case, Gauthier's **Minimax Relative Concession (MRC)** principle is extensionally equivalent to the **Kalai-Smorodinsky** solution.

  **The Math:**
  *   **Relative Concession** for player $i$ is defined as: $\frac{u_i^{max} - u_i}{u_i^{max} - u_i^{disagreement}}$.
  *   This is simply $1 - (\text{Relative Gain})$.
  *   Minimizing the *maximum* relative concession is mathematically identical to Maximizing the *minimum* relative gain.
  *   On the Pareto frontier, the unique point that maximizes the minimum relative gain is the point where relative gains are equalized. That is the definition of the Kalai-Smorodinsky solution.

  **What This Commits Gauthier To:**
  This is the critical philosophical payoff for your seminar. By endorsing MRC (and thus KS), Gauthier is making a deliberate choice in the axiom wars:

  1.  **Rejection of IIA as a Moral Requirement:** Gauthier explicitly argues that the Nash solution is flawed because it is sensitive to the *curvature* of the utility frontier. In von Neumann-Morgenstern utility, curvature represents **risk aversion**.
      *   Under Nash, a more risk-averse player gets a smaller share (because they are willing to settle for less to avoid the disagreement point).
      *   Gauthier finds this morally repugnant. He argues justice should not reward or punish agents for their psychological risk attitudes or their "threat advantage."
      *   To eliminate sensitivity to curvature, you must ignore the local shape of the frontier. This forces you to drop IIA.

  2.  **Fairness Trumps "Standard" Rationality:** In decision theory, IIA is often defended as a consistency requirement for *rational choice*. By adopting MRC/KS, Gauthier is arguing that in the *moral* context (the initial agreement), a different consistency condition applies: **Solidarity/Monotonicity**.
      *   He is effectively arguing that it is *irrational* to agree to a principle where your share drops because the other person's potential increased (or vice versa).
      *   He bets that **Monotonicity** is the deeper constraint on a just division of cooperative surplus.

  3.  **The "Strain of Commitment":** Gauthier's derivation isn't axiomatic; it's deliberative. He argues MRC is the outcome rational agents would choose because it minimizes the "strain of commitment." Everyone concedes the same *proportion* of their potential.
      *   If you use Nash, one party might be conceding 90% of their potential while the other concedes 10% (depending on curvature), even if the utility product is maximized. Gauthier thinks this is unstable.
      *   This aligns perfectly with KS/Monotonicity: it ensures the *burden* of cooperation is distributed proportionally to what each had to give up.

  **Teaching Tip:**
  If you want to sharpen the point for the class: Gauthier is trying to save Contractarianism from the objection that "might makes right" (or "risk-aversion makes right"). The Nash solution allows threat advantage and risk attitudes to determine the split. Gauthier uses MRC (and implicitly KS) to **neutralize** those factors. He sacrifices the technical rationality axiom (IIA) to secure a moral axiom (Equal Relative Concession).

  So, when your students' eyes glaze over at "Monotonicity," tell them: *"This is the axiom Gauthier needs to ensure that justice doesn't depend on how risk-averse you are."* That usually wakes them up.
