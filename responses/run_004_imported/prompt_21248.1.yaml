          *   *Point B: The Definition of "Human".* The TT compares machine to human. If "human" includes ESP, the target moves. Turing wants to test if machines can do what humans do *computationally*.
          *   *Point C: The "Hack" vs. The "Mind".* ESP allows bypassing cognitive processing. The TT is supposed to measure cognitive processing. If you can bypass it, the test fails to measure the intended construct (construct validity).
      *   **Conclusion:** Summarize. Turing's move saves the test from a specific confound but highlights that the TT is a test of *specifically human-like computational performance*, not a universal test of "mind."

