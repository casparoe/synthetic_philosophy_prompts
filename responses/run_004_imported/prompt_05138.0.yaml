answer: |-
  The hum of the server farm was the only sound in Dr. Aris Thorne's office, a low-frequency vibration that felt less like noise and more like the pressure of a deep ocean. On the main display, the Ostra trade logs scrolled in endless columns of green glyphs. For seven years, Station Alpha had recorded every transaction, every movement of resources, and every refusal made by the Ostra collective in the valley below.

  There were no words. No facial expressions. No physiological telemetry. There was only the binary of action: taken or left.

  A knock at the door shattered the rhythm. Ambassador Vance entered without waiting, holding a datapad like a weapon.

  "The Secretary-General needs the welfare certification by 0800, Aris," Vance said, his voice tight. "The treaty hinges on it. We need to confirm that the proposed energy allocation maximizes Ostra utility."

  Thorne didn't turn from the screen. "I can't certify that, Elena."

  "You've run the Afriat tests. You told me last week the data satisfies GARP. The Generalized Axiom of Revealed Preference. That means they're rational."

  "It means their choices are *consistent*," Thorne corrected, finally swiveling his chair. "It means there exists *a* utility function that rationalizes their past behavior. It does not tell us *which* one. And it certainly doesn't tell us what happens when we introduce a bundle they've never seen before."

  Vance stepped closer, slamming the datapad onto the desk. "They trade lithium for water. They refuse copper when silica is available. We map the indifference curves, we find the peak, we send the resources. It's engineering, Aris. Stop making it metaphysics."

  "It is metaphysics," Thorne said softly. "Because you're asking me to certify what they *want*, not just what they *chose*."

  He tapped a key, and the screen shifted to a specific sequence from three years prior. "Look at Unit 734. During the sulfur drought, this unit had access to a filtration tablet. It chose not to consume it. Instead, it moved the tablet to a juvenile unit and entered a dormant state."

  Vance glanced at the log. "Altruism. High social utility. We account for that. We weight their individual utilities into a collective function."

  "Or," Thorne said, "Unit 734 followed a rule: *'Never consume when the brood is hungry.'* In the revealed preference framework, that rule is indistinguishable from a preference for dormancy over survival. If I model it as a preference, then giving them more filtration tablets makes them 'better off.' But if it's a principle—a commitment device—then flooding them with tablets might violate the condition of their agency. They might reject the aid not because they don't value life, but because accepting it breaks the rule that gives their choices meaning."

  Vance sighed, rubbing her temples. "Sen's 'Rational Fool' argument. I read the briefings. You think they're mindless maximizers?"

  "I think the data makes them mindless maximizers," Thorne said. "Because that's all the data allows us to see. Amartya Sen warned us. If you define rationality solely by the consistency of choices, you strip the agent of any interior life. You turn them into a black box that merely sorts inputs. But a treaty isn't an input. It's a relationship. It assumes we know what 'better off' means for them."

  Thorne stood and walked to the window. Below, in the twilight of the alien valley, small lights moved. The Ostra.

  "Here is the problem, Elena. Afriat's Theorem guarantees that for any finite set of choices, there are infinitely many utility functions that fit the data perfectly. They all predict the past exactly. But they diverge on the future." Thorne turned back. "The treaty proposes a new bundle: high-energy plasma in exchange for mining rights. The Ostra have never encountered plasma. They have never traded mining rights."

  "So we extrapolate," Vance said.

  "Extrapolate using *which* function?" Thorne asked. "I can construct a utility function where the Ostra value plasma above all else, fitting all seven years of data. I can construct another, equally valid function, where plasma is toxic to their utility structure, also fitting all seven years of data. Both are mathematically perfect. Both are empirically equivalent based on the records. But one leads to a treaty that thrives, and the other leads to a catastrophe."

  Vance stared at him. "You're saying the math is broken."

  "The math is flawless. It's the ontology that's empty. We have mapped the shadow, but we are signing a contract with the object casting it. We don't know if the object is a man, a tree, or a stone. We only know the shape of the shadow."

  Vance picked up the datapad, her thumb hovering over the authorization code. "If I don't sign, the mining consortium pulls out. The station loses funding. We get recalled. The Ostra get left alone with the corporations that won't bother with utility functions at all."

  Thorne felt the weight of the argument. It was the classic critique made flesh. The revealed preference tradition was designed to purge economics of "unobservable" psychological states to make it scientific. But in doing so, it had rendered the economist mute on the very question that mattered most: *What is good for the agent?*

  "I can certify consistency," Thorne said. "I can swear that if they accept the plasma, they won't violate their own past logic. But I cannot certify that they will be *happy*. I cannot certify *welfare*. Those words require a theory of mind we do not have."

  "Welfare is defined by choice," Vance recited, a line from the standard textbook. "If they choose it, it is welfare."

  "That's the tautology," Thorne snapped. "If a man chooses to walk off a cliff because he believes he can fly, revealed preference says he preferred flying to living. It doesn't say he was wrong. It doesn't say he was deluded. It just says he maximized his utility function. If we treat the Ostra that way, we aren't treating them as persons. We're treating them as mirrors."

  The silence stretched between them, filled only by the server hum. Vance looked at the authorization field, then at the scrolling logs of the silent aliens below. She realized, for the first time, that the "rationality" they had praised for years was a cage. By insisting that the Ostra were nothing more than their choices, they had made it impossible to care for them as anything more.

  "If I sign," Vance said quietly, "I am lying."

  "You are modeling," Thorne corrected. "There is a difference. Modeling admits error. Certification admits only truth."

  Vance looked at the red stamp icon. To sign was to assert that the gap between choice and desire did not exist. To sign was to claim that the map was the territory.

  She tapped the screen. The icon didn't change color.

  "I'm not signing the welfare certification," she said.

  "Then the treaty dies."

  "No," Vance said, her voice hardening. "I'm signing a behavioral compatibility agreement. We state clearly: *'Based on historical choice data, the proposed allocation is consistent with past Ostra behavior patterns.'* We don't say it makes them better off. We don't say they want it. We say it fits the pattern."

  Thorne exhaled, a breath he felt he'd been holding for seven years. "That's honest. But the corporations won't like it. It leaves liability open. If the plasma harms them, we can't claim we optimized their utility."

  "Good," Vance said. "Then we'll have to watch them. We'll have to learn what they actually feel, not just what they pick. We'll have to treat them like agents, not functions."

  She handed the datapad back to Thorne. "Rewrite the header. Remove the word 'Welfare.' Replace it with 'Consistency.'"

  Thorne took the pad. The cursor blinked in the empty field. He typed the new title. It was a smaller claim, a humbler science. It acknowledged that the data was a cage of their own making, and that the truth of the Ostra lay outside the bars, in the dark, unrecorded space between the choices.

  "Done," Thorne said.

  Vance nodded, turning to the door. "Let's hope consistency is enough to keep the peace."

  "It has to be," Thorne said, looking back at the screen, where Unit 734's log entry still glowed. "Because it's all we have."

  He watched the green glyphs scroll. They were perfect. They were consistent. They were utterly silent. And for the first time, Thorne understood that the silence wasn't in the data. It was in the theory that claimed the data was enough.
