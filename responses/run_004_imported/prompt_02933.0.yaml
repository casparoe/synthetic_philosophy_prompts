          *   Symbol: $A \boxright B$ (If A *had* been the case, B *would have* been the case).
          *   Semantics: Truth-conditional. True at world $w$ if in the closest $A$-worlds to $w$, $B$ is true.
          *   Status: Propositions. They express truth-apt content.
      *   **Lewis (1976) - Indicatives & Probability:**
          *   Symbol: $A \to B$ (If A, then B). Usually interpreted as indicative conditionals in this context (Stalnaker's Hypothesis).
          *   Thesis: The Equation ($P(A \to B) = P(B|A)$).
          *   Result: Triviality. If the Equation holds for all $P$, the algebra of propositions is trivial.
          *   Lewis's Conclusion: Conditionals do *not* express propositions. They are not truth-apt in the standard sense. (Adopted Adams' Thesis/Supposition Theory).
      *   **The Crucial Distinction:** Indicative vs. Counterfactual.
          *   1976 is primarily about *indicative* conditionals and the link to conditional *probability*.
          *   1973 is about *counterfactual* conditionals and *truth conditions* via worlds.
      *   **Does the Triviality Result apply to Counterfactuals?**
          *   Lewis argues counterfactuals *do* have truth conditions (1973).
