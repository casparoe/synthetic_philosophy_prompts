answer: |-
  This is an excellent question. It cuts to the heart of one of the most famous debates in 20th-century philosophy of language and logic. You have identified a tension that many students (and professional philosophers) grapple with when first encountering Lewis's work.

  The short answer is: **No, Lewis is not refuting himself.** The apparent contradiction dissolves once you distinguish between the two different *types* of conditionals Lewis is discussing and the specific constraints he places on them.

  Here is a breakdown of where your reasoning is going astray and how Lewis keeps his theories consistent.

  ### 1. The Crucial Distinction: Indicative vs. Counterfactual
  The most important factor here is that Lewis is talking about two different linguistic constructions in these two works.

  *   **1973 (*Counterfactuals*):** Lewis is analyzing **subjunctive** or **counterfactual** conditionals (e.g., "If kangaroos had no tails, they would topple over"). In this book, he argues these **do** express propositions. They have truth conditions determined by similarity relations between possible worlds.
  *   **1976 ("Probabilities of Conditionals..."):** Lewis is primarily analyzing **indicative** conditionals (e.g., "If Oswald didn't shoot Kennedy, someone else did"). In this paper, he argues these **do not** express propositions.

  Lewis's triviality result (1976) is specifically an attack on the idea that *indicative* conditionals express propositions that satisfy **Stalnaker's Hypothesis** (also known as "The Equation"):
  $$P(A \to B) = P(B|A)$$
  Lewis proves that if you assume indicatives express propositions *and* satisfy this equation for all reasonable credence functions, you trivialize the probability space. His solution is to deny that indicatives express propositions at all (adopting Ernest Adams' view that they are unassertible but have assertability conditions).

  He does **not** apply this conclusion to the counterfactuals from his 1973 book.

  ### 2. Why the Triviality Result Doesn't Touch 1973
  You asked: *"Isn't the closest-worlds analysis just another way of fixing a conditional's truth value using the same sort of information that a conditional probability captures?"*

  This is the intuitive leap that causes the confusion. While both possible-worlds semantics and conditional probability deal with uncertainty and alternatives, Lewis argues they function differently.

  For Lewis's 1973 counterfactuals ($A \boxright B$) to be refuted by his 1976 triviality result, two things would have to be true:
  1.  Counterfactuals would have to express propositions (True, according to 1973).
  2.  The probability of that proposition would have to equal the conditional probability $P(B|A)$ for all credence functions (False, according to Lewis).

  Lewis explicitly denies the second point for counterfactuals. He does not believe that $P(A \boxright B) = P(B|A)$.

  **Why not?**
  In the 1973 semantics, a counterfactual is true if $B$ holds in the *closest* $A$-worlds.
  *   Imagine a fair coin that is not tossed.
  *   **Indicative/Conditional Prob:** $P(\text{Heads} | \text{Tossed}) = 0.5$.
  *   **Counterfactual:** "If the coin had been tossed, it would have landed Heads."
  *   **Lewis's Semantics:** To evaluate this, we look at the closest worlds where the coin is tossed. If the world is deterministic, in the closest worlds the coin lands either Heads or Tails, but not both. If the closest worlds are Heads-worlds, the counterfactual is True. If they are Tails-worlds, it is False.
  *   **The Mismatch:** Your credence that the counterfactual is *true* might be 0 or 1 (depending on which close world you think is actual), while your conditional probability is 0.5.

  Because Lewis does not commit counterfactuals to "The Equation," the triviality proof does not apply to them. He can maintain that counterfactuals are truth-apt propositions (1973) without running into the triviality problem, precisely because their probabilities do not track conditional probabilities in the strict way indicatives do.

  ### 3. Lewis's Unified View
  Lewis's overall position is actually quite consistent, though it requires accepting a dualism about conditionals:

  1.  **Counterfactuals (Subjunctives):** These are robust, truth-conditional propositions. They are about the structure of reality and similarity between worlds. We can assign them probabilities, but those probabilities are *not* simply $P(B|A)$. Therefore, they escape the triviality result.
  2.  **Indicatives:** These are not truth-conditional propositions. They are devices for supposing. We assess them by conditional probability ($P(B|A)$), which is why they satisfy "The Equation." But because they satisfy the Equation, the triviality result proves they cannot be propositions.

  So, Lewis isn't refuting his 1973 theory with his 1976 theory. Rather, he is using the 1976 theory to draw a boundary line: **"Conditionals that behave like conditional probabilities (indicatives) cannot be propositions. Conditionals that are propositions (counterfactuals) do not behave like conditional probabilities."**

  ### 4. Where Your Reasoning Went Wrong
  Your reasoning went wrong in assuming that the "information" used in possible-worlds semantics is the *same* as the information captured by conditional probability.

  *   **Conditional Probability ($P(B|A)$):** This is a ratio of measures within a single probability space. It is sensitive to your current evidence and credences.
  *   **Closest-Worlds Semantics:** This relies on a fixed (or contextually fixed) similarity ordering of worlds. It is objective in a way that credences are not.

  Lewis argues that these come apart. If you try to force them together (as Stalnaker tried for indicatives), you get triviality. Lewis's solution was to let them come apart: keep the worlds for counterfactuals, keep the probabilities for indicatives, and deny that they are the same semantic animal.

  ### Summary for Your Seminar
  If you bring this up in seminar, you can frame it like this:
  > "I initially worried that Lewis's 1976 triviality results undermined his 1973 truth-conditional account of counterfactuals. However, I now see that Lewis avoids this by distinguishing indicatives from counterfactuals. He accepts that counterfactuals express propositions (1973) but denies that their probability equals conditional probability. He accepts that indicatives align with conditional probability (1976) but denies that they express propositions. The triviality result only applies if you try to have both truth conditions and the Equation for the same class of conditionals."

  This shows you understand the technical constraint (The Equation) and how Lewis navigates around it by splitting the category of conditionals.
