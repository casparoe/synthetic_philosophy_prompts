  The phone screen glowed between them on the sticky table, the betting app open to the point spread. The $50 bill was pinned under a coaster, weighted down by the gravity of the argument. On the TV above the bar, the teams were warming up, the noise of the crowd swelling every time a player made a cut.

  **Elias:** "Put the phone down, Sarah. Just for a second. Look at the bill."

  **Sarah:** "I'm looking at the line. It's moved half a point since I told you about the ankle. The market is already twitching."

  **Elias:** "Exactly. It's twitching. Which means someone else knows, or suspects. But you're trying to bet *me*. That's the problem. You're invoking Hayek to justify the line's efficiency, but then you're asking me to step outside the market to bet against it with you."

  **Sarah:** "I'm not betting against the market. I'm betting *with* my information against the market's current ignorance. You're just the counterparty because the app limits stakes on prop bets. This is liquidity, Elias. I have alpha. You have cash. We trade."

  **Elias:** "No. If this were pure liquidity, you wouldn't care who took the other side. But you care. You want *me* to take the Over. Which means you've assessed my information set, compared it to yours, and decided yours is superior. That's fine. But I know you've done that assessment. So if I take the bet, I'm agreeing to play a game where I already know I'm at an informational disadvantage."

  **Sarah:** "That's just risk. That's life."

  **Elias:** "It's Milgrom and Stokey. It's the No-Trade Theorem. If we're both rational, and we know we're both rational, and we share a prior—like, we both watch the same games, read the same reports—then the mere fact that you're offering me this bet should scare me off. Your willingness to bet is a signal. It tells me, 'I know something you don't.' If I update on that signal, the bet disappears. If I don't update, I'm irrational. Either way, the bet shouldn't happen."

  **Sarah:** (She takes a sip of her beer, eyes never leaving the screen.) "Okay. Theory nerd. I love the theorem. I do. But it assumes we're identical Bayesian machines. We're not. I have a cousin in the training room. You don't. That's not a difference in rationality; that's a difference in access. Hayek's whole point is that knowledge is dispersed. The price doesn't know about the ankle yet. I do. If I don't bet, that information never gets into the price. The line stays wrong."

  **Elias:** "Then bet the house. Don't bet me. If you bet the house, you're injecting your private info into the global pool. You're making the market more efficient. If you bet me, you're just transferring money from my pocket to yours based on a secret. That's not price discovery. That's rent-seeking off my friendship."

  **Sarah:** "It's fifty dollars. The house limits me to twenty on this prop. You're the only way I can get full exposure on my conviction. And look, if you were truly worried about the No-Trade theorem, you'd realize that *refusing* the bet is also a signal. If you fold immediately, you're telling me you think my info is garbage. So now *I* have to update on *your* skepticism."

  **Elias:** "But I'm not skeptical about the ankle. I believe you."

  **Sarah:** "Then why won't you shake?"

  **Elias:** "Because if I believe you, I should also bet the Under! If your info is good, the Over is a bad bet. So why would I take the Over? If I take the Over, I'm lying about what I believe. If I take the Under, we're not betting against each other."

  **Sarah:** (She finally looks up, tapping the phone.) "There it is. You updated."

  **Elias:** "Of course I updated. You're not a liar. But that kills the trade. The theorem holds. We can't bet each other because our posteriors have converged."

  **Sarah:** "They haven't converged on *probability*. They've converged on *direction*. I think there's a 70% chance the center sits. You probably think it's 60% now. That spread is enough for a wager. I'm more confident. I'm willing to risk more utility for the win. You're less confident, so you take the other side for a smaller risk. That's risk tolerance, not just information."

  **Elias:** "Is it? Or is it just that I know you're about to drain my wallet, and I'm trying to be polite about it?"

  **Sarah:** "No. It's that you're treating the bet like a zero-sum war. It's not. It's a mechanism to test conviction. If I'm wrong, I pay you fifty bucks for the privilege of being humbled. If I'm right, you pay me for ignoring the signal. The 'cost' of the bet is the price of me sharing the info with you."

  **Elias:** (He leans back, looking at the $50.) "So the bet isn't about the game. It's a fee for the tip."

  **Sarah:** "Exactly. Hayek says prices communicate information. This wager *is* the price. You're paying me to validate my source. If I lose, the info was bad, and you get paid. If I win, the info was good, and I get paid. The money follows the truth."

  **Elias:** "But the No-Trade theorem says that if we *know* the money follows the truth, and we *know* you have the truth, the trade unravels. I shouldn't pay for a tip I already trust. I should just act on it."

  **Sarah:** "Then act on it."

  **Elias:** "How?"

  **Sarah:** (She slides the phone across the table.) "Don't bet me. Bet the app. Take the Under. I'll take the Under. Let's both bet the market."

  **Elias:** "Then who takes the Over?"

  **Sarah:** "Some guy in Jersey who thinks the injury report is fake. Some algorithm that hasn't adjusted yet. That's the noise trader. That's the liquidity. *That's* who we should be betting. Not each other."

  **Elias:** (He looks at the phone, then at the bill.) "So the private bet is the inefficiency."

  **Sarah:** "The private bet is us hoarding the alpha. If we both bet the market, we force the line to move faster. We make the price more honest. That's my Hayekian duty."

  **Elias:** "And it satisfies the No-Trade constraint. We aren't exploiting asymmetric info between us. We're pooling our info to exploit the market."

  **Sarah:** "Exactly. We stop being adversaries and start being a syndicate."

  **Elias:** (He pushes the $50 bill back toward her.) "I'm not taking the Over. I can't. If I believe your cousin, taking the Over is burning money. But I'm not betting the Under on the app either."

  **Sarah:** "Why not? You just said you updated."

  **Elias:** "Because if I bet the Under, I'm acting on insider info. I'm not a risk-bearing investor; I'm a leak. You're the one with the source. You place the bet. I'll watch."

  **Sarah:** "So you're folding."

  **Elias:** "I'm respecting the theorem. The only rational trade is between informed capital and uninformed liquidity. I'm not uninformed anymore. You told me. So now I'm informed. If I bet, I'm complicit. If I don't bet, I'm just a friend."

  **Sarah:** (She smiles, picking up the phone.) "Fine. But you're boring. The market needs you to be the noise."

  **Elias:** "The market has enough noise. It doesn't need me to be it for my friend."

  **Sarah:** "Okay. But if this center plays the first quarter, you're buying the next round. That's not a bet. That's a social contract."

  **Elias:** "Deal."

  **Sarah:** (She taps the screen twice, confirming the wager.) "Done. Fifty on the Under. The line just ticked down again. We're moving the market, Elias."

  **Elias:** "You're moving the market. I'm just watching the price."

  **Sarah:** "Same thing. You updated. The price updated. The system worked."

  **Elias:** "The system worked because we *didn't* bet each other."

  **Sarah:** (She raises her glass.) "To the No-Trade Theorem."

  **Elias:** (Clinks his glass against hers.) "To efficient markets."

  They sat back as the kickoff neared. The $50 bill stayed under the coaster, useless now. They hadn't shaken on a wager, but the argument had settled the only way it could: by realizing that if they both truly believed the logic, the money belonged on the book, not on the table. The bet hadn't happened, but the information had still traded.
