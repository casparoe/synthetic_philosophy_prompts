answer: |-
  You are absolutely right to sense that Lewis and Woodward are cousins. They both reject regularity theories (Humean "constant conjunction") in favor of a counterfactual backbone: *causation is about what would have happened if things had been different.*

  However, the rivalry is real, and it comes down to **how** they evaluate that counterfactual. Lewis evaluates it by comparing **whole possible worlds** using a similarity metric. Woodward evaluates it by performing **surgical operations on structural equations** (a causal graph).

  The divergence happens when the "surgery" required to test the cause conflicts with the "similarity" required to evaluate the world. The classic case where Lewis (1973) fails and Woodward succeeds is **Late Preemption**.

  ### The Scenario: Suzy, Billy, and the Bottle

  **The Setup:**
  Suzy and Billy are both expert rock throwers. They spot a bottle on a wall. They both throw their rocks at the same time. Suzy's rock is slightly faster.
  1.  Suzy's rock hits the bottle first ($H_s = 1$).
  2.  The bottle shatters immediately ($E = 1$).
  3.  Billy's rock ($H_b$) passes through the empty space where the bottle used to be a split second later.

  **The Crucial Detail:**
  If Suzy had *not* thrown (or had missed), Billy's rock would have hit the bottle and shattered it. Billy is a "redundant backup."

  **The Variables:**
  *   $S$: Suzy throws (1 or 0)
  *   $B$: Billy throws (1 or 0)
  *   $H_s$: Suzy's rock hits (1 or 0)
  *   $H_b$: Billy's rock hits (1 or 0)
  *   $E$: Bottle shatters (1 or 0)

  **The Structure:**
  *   $S \to H_s \to E$
  *   $B \to H_b \to E$
  *   **Preemption Mechanism:** $H_s$ prevents $H_b$. (If Suzy's rock hits, Billy's rock cannot hit the bottle).

  ---

  ### Verdict 1: David Lewis (1973)
  **Verdict: Suzy did NOT cause the shattering.**

  **The Analysis:**
  Lewis's 1973 account defines causation as **counterfactual dependence** (or a chain of such dependence). To check if $S$ caused $E$, we ask: *"In the closest possible world where Suzy does not throw ($S=0$), does the bottle fail to shatter ($E=0$)?"*

  1.  We look for the closest world where $S=0$.
  2.  Lewis's similarity metric demands we hold the **past** fixed as much as possible. Billy's decision to throw ($B=1$) is in the past (or independent). So in this closest world, $B=1$.
  3.  Since $S=0$, Suzy's rock doesn't hit ($H_s=0$).
  4.  Because $H_s=0$, the preemption mechanism is lifted. Billy's rock is no longer blocked.
  5.  Therefore, $H_b=1$.
  6.  Therefore, $E=1$ (The bottle still shatters).

  Since $E$ is 1 in the actual world and 1 in the closest counterfactual world, there is **no counterfactual dependence**. Lewis's 1973 "ancestral" fix (looking for a chain of intermediate events) also fails here, because at *every* intermediate moment between the throw and the shatter, Billy's rock is poised to take over if Suzy's fails. There is no point where the outcome depends on Suzy.

  **Lewis '73 Conclusion:** Suzy's throw was not a cause. (Billy's wasn't either). The shattering was overdetermined/preempted, so neither counts.

  ---

  ### Verdict 2: James Woodward (Interventionism)
  **Verdict: Suzy DID cause the shattering.**

  **The Analysis:**
  Woodward defines causation via **interventions** ($do$-operator) on a causal model. Crucially, Woodward allows us to test for causation **along a specific path** while holding "off-path" variables fixed at their **actual values**.

  We want to test the path $S \to H_s \to E$.
  1.  We perform an intervention: $do(S=0)$.
  2.  **The Key Move:** We hold the off-path variable $H_b$ (Billy's hit) fixed at its **actual value**, which is 0 (because in reality, Billy's rock missed/didn't hit).
  3.  We ask: *"If we intervene to set $S=0$, while keeping $H_b=0$ (as it actually was), what happens to $E$?"*
  4.  If $S=0$ and $H_b=0$, then $E=0$.
  5.  In the actual world ($S=1, H_b=0$), $E=1$.

  Because changing $S$ changes $E$ *along this path* (when we hold the backup process fixed at its actual inactive state), $S$ is a **contributing cause** of $E$.

  **Woodward Conclusion:** Suzy caused the shattering.

  ---

  ### What is doing the work in the disagreement?

  It is not backtracking (both theories forbid backtracking counterfactuals). It is **Modularity vs. Holism.**

  1.  **Lewis (Holism):** Lewis compares *whole worlds*. He cannot "hold fixed" the fact that Billy's rock missed without making the world "dissimilar." In the closest world where Suzy doesn't throw, the laws of nature and the setup dictate that Billy's rock *must* hit. To keep $H_b=0$ in the counterfactual world would require a second miracle (Billy's rock vanishing mid-air), which makes the world too distant to count. Lewis is trapped by the **inevitability of the backup** in the counterfactual scenario.
  2.  **Woodward (Modularity):** Woodward compares *structural equations*. The causal graph represents the mechanism. The equation for $E$ is something like $E = \max(H_s, H_b)$. The equation for $H_b$ is $H_b = B \cdot (1 - H_s)$.
      Woodward's interventionism allows us to "cut" the arrow into $S$ without triggering the downstream consequences that would normally activate the backup. We are testing the **capacity** of the mechanism, not the historical necessity of the outcome. We can mathematically "freeze" $H_b$ at 0 to see if the $S \to E$ link is active, even if physically, in a timeline without $S$, $H_b$ would have become 1.

  ### Which verdict is intuitively correct?

  **Woodward wins.**

  **Why it's not a cop-out:**
  It's not just "Woodward matched my intuition." The intuition that Suzy is the cause is grounded in **explanation** and **responsibility**.
  *   **Explanation:** If someone asks "Why did the bottle shatter *at t=1* rather than *t=1.5*?", the answer is "Because Suzy hit it." Billy's rock explains why it would have shattered *later*, but Suzy explains the actual event. Lewis '73 renders the actual timing inexplicable (since neither throw is a cause).
  *   **Responsibility:** If we blame someone for the broken bottle, we blame Suzy. We don't blame Billy (he didn't actually hit it). If Lewis '73 is right and neither caused it, we have a "causal gap" where an effect exists without a cause.

  **The Philosophical Upshot:**
  Lewis '73 treats causation as a relation between **events** across **worlds**. Woodward treats causation as a property of **mechanisms** within a **model**.
  The Late Preemption case shows that "what would have happened" (Lewis) is sometimes the wrong question for causation. The right question is "what did this specific process do?" (Woodward). Woodward's "surgical" intervention allows us to isolate the actual process from the counterfactual noise, which Lewis's similarity metric blurs together.

  *(Note: Lewis realized this problem. In later papers (1986, 2000), he abandoned the simple 1973 account for "Quasi-Dependence" and "Influence" theories specifically to handle preemption. But those revisions move his theory closer to Woodward's structuralism, admitting that simple counterfactual dependence isn't enough.)*
