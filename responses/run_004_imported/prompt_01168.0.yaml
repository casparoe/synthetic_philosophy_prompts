answer: |-
  This is a subtle but crucial distinction. You are asking the husband to move beyond the *tu quoque* fallacy (which attacks the accuser's standing) and instead argue that the wife's actions have fundamentally altered the **moral ontology** of the marriage.

  He isn't saying, "You can't speak." He is saying, "Your own actions prove that the rule you claim I broke does not actually exist between us." He is arguing that her infidelity didn't just make her a hypocrite; it dissolved the exclusivity contract, rendering his subsequent actions consistent with the *actual* (rather than professed) state of their union.

  Here are a few ways to phrase this, depending on the husband's voice and the temperature of the scene.

  ### Option 1: The Cold Logic (Contractual)
  This approach treats the marriage as a set of operating conditions. He argues that her conduct amended the contract before he ever acted.

  > "Don't you see? You're angry because you think I broke a vow. But you broke it first. And when you did, you didn't just violate the marriage—you changed it. You showed me that fidelity isn't the price of admission here. So I didn't betray you. I just followed the precedent you set. There was no rule left for me to break."

  ### Option 2: The Psychological Mirror (Intimate/Resentful)
  This approach focuses on the idea that her blame is a form of self-loathing projected onto him. He argues that the "wrongness" is in her reaction, not his action.

  > "You're not mad that I cheated. You're mad that I'm holding up a mirror. If what I did was truly unforgivable, you wouldn't have done it yourself. Your own guilt is the only thing giving my actions weight. Without that, it's just... life. You're trying to blame me for a crime you already proved doesn't exist."

  ### Option 3: The Philosophical Dissolution (Quiet/Devastating)
  This is the closest to your specific philosophical constraint. It argues that blame requires a moral high ground that her actions have eroded, not just for her, but for the situation itself.

  > "Blame requires a boundary. It requires a line that one person stays behind and the other crosses. But you crossed it. So the line is gone. You can't accuse me of trespassing on ground you've already claimed is open territory. I haven't done anything wrong, because 'wrong' implies I violated something you still believed in. And clearly, you don't."

  ### Option 4: The Short/Punchy (Dialogue Heavy)
  If the scene is fast-paced, you might need something sharper that implies the longer philosophical argument.

  > "You don't get to call it betrayal. Not after what you did. That word requires innocence on one side, and we lost that a long time ago. I didn't break us. You did. I just acknowledged how it actually works."

  ### Why these work for your goal
  To ensure these land the way you want, keep the following direction in mind for the actor/character:

  1.  **Avoid Defensiveness:** If he sounds defensive, he sounds guilty. He should sound calm, almost analytical. He isn't apologizing; he is correcting a factual error in her assessment.
  2.  **Focus on the "Rule," not the "Right":** He shouldn't argue about his *right* to cheat. He should argue about the *non-existence* of the rule against it.
  3.  **The "We" vs. "I":** Notice how some options shift the blame to "Us" or "The Marriage." He is arguing that the *system* is corrupt, so no individual act within the system can be judged as uniquely sinful.

  **A Note on the Philosophy:**
  In ethics, this is often called the **"Argument from Consistency"** or a variation on **Implicit Consent**. The logic is: *By engaging in the act yourself, you demonstrated that you do not value the norm. Therefore, the norm is void. Therefore, violating the norm is not a moral injury.*

  While logically contentious (two wrongs don't usually make a right), in the context of a marriage, it is emotionally potent: **Betrayal requires trust.** If she cheated, she proved she didn't trust him enough to be faithful, nor did she value his trust. Therefore, the specific trust required to be "betrayed" was already incinerated. He isn't arguing he is *good*; he is arguing that the concept of *bad* no longer applies to them.
