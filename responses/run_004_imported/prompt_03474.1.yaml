answer: |-
  You have hit on one of the most sophisticated objections in modern metaethics. Your intuition is sharp: this is known as the **Evolutionary Debunking Argument (EDA)**, and the specific counter-argument you just invented (applying it to math) is a standard reply used by philosophers like David Enoch and Erik Wielenberg.

  You want a verdict, not a survey. So here it is:

  **The Verdict:** There **is** a genuine, principled difference between the two cases. The evolutionary argument succeeds in undermining objective morality in a way that it does *not* undermine mathematics. The video guy was right to single out morality, but likely for deeper reasons than he explained.

  Here is the breakdown of why the logic holds for one but breaks for the other.

  ### 1. The Strongest Form of the Argument (Morality)
  To see where the difference lies, we have to be precise about what the Evolutionary Debunking Argument actually claims. It isn't just "we evolved this, so it's fake." It's about the **relationship between the truth and the survival benefit.**

  *   **Premise 1:** Evolution selects for traits that increase reproductive fitness (survival), not for traits that track objective truth.
  *   **Premise 2:** Our moral beliefs (e.g., "care for your children," "don't kill tribe members") clearly increase reproductive fitness.
  *   **Premise 3 (The Kicker):** These moral beliefs would have been selected for *even if they were false.*
      *   *Example:* Imagine a tribe that believed "killing your neighbors is morally good." They might fight more, die out, and lose. A tribe that believed "killing is wrong" cooperates, survives, and wins.
      *   *Crucial Point:* Evolution selected for the *belief* that killing is wrong because that belief creates cooperation. It did not select for the belief because killing is *objectively* wrong in the fabric of the universe. The "objective wrongness" is doing no work in the explanation.
  *   **Conclusion:** We have no reason to think our moral beliefs track objective moral truths. They just track survival.

  ### 2. Applying the Logic to Math
  Now, let's run your exact same logic on mathematics, as you suggested.

  *   **Premise 1:** Evolution selects for fitness, not truth.
  *   **Premise 2:** Basic math/logic (e.g., "2 lions + 2 lions = 4 lions") increases fitness.
  *   **Premise 3:** Would these math beliefs have been selected for *even if they were false?*
      *   *Example:* If a human thought "2 lions + 2 lions = 1 lion," they might not run away, get eaten, and lose.
      *   *Crucial Point:* Here is where the analogy breaks. In math, the belief is useful *because* it is true. The physical world behaves mathematically. If 2+2 actually equaled 5 in our universe, believing it equals 4 would get you killed.
  *   **Conclusion:** Evolution *did* track the truth here, because the truth is causally connected to survival.

  ### 3. The Principled Difference: "Explanatory Relevance"
  This is the technical reason why the verdict goes in favor of math but against morality. It comes down to **Explanatory Relevance.**

  **In Mathematics:**
  The truth of the mathematical statement explains *why* it is useful.
  *   *Why* did believing "there are 5 wolves" help me survive? Because there *were* 5 wolves. The fact of the matter (the truth) caused the survival benefit. There is a direct link between the objective reality and the evolutionary pressure. Evolution "tracked" the truth.

  **In Morality:**
  The truth of the moral statement does *not* explain why it is useful.
  *   *Why* did believing "murder is wrong" help me survive? Not because murder is objectively wrong in the universe. It helped because believing it stopped me from murdering, which kept my tribe from killing me.
  *   I could have survived just as well if I believed "murder is wrong" even if, in objective reality, murder was morally neutral. The *belief* does the work, not the *truth*.
  *   Because the "objective truth" of morality is unnecessary to explain why we have the belief, we have no reason to trust that the belief matches the truth.

  ### 4. Why This Matters (The "Third Factor" Problem)
  Philosophers call this the "Third Factor" explanation.
  *   **Math:** Evolution and Math Truth are correlated because **Physical Reality** is the third factor. Physics obeys math, and evolution happens in physics. So Evolution -> Physics -> Math Truth. The chain is unbroken.
  *   **Morality:** What is the third factor? Evolution and Moral Truth would need to be correlated by something else. But moral truths (like "suffering is bad") don't seem to be laws of physics. You can have a universe with physics and evolution where suffering exists but isn't "wrong." There is no bridge connecting "survival of the fittest" to "objective goodness."

  ### 5. The Final Verdict
  You asked if anyone using the evolution argument against morality has to "bite the bullet" on math too.

  **No.** They do not.

  The reasoning is not identical.
  *   **Mathematics** is descriptive of the physical world. Since evolution happens in the physical world, evolution inevitably selects for accurate descriptions of that world (at least regarding medium-sized objects and logic).
  *   **Morality** is prescriptive (it tells you what to *do*, not what *is*). Evolution selects for behaviors that work. It does not select for behaviors that align with cosmic moral laws, because cosmic moral laws (unlike physical laws) do not impact whether a rock falls or a lion bites.

  **The Bottom Line:**
  The video guy was right. Evolution undermines the claim that morality is an **objective feature of the universe** (Moral Realism). It suggests morality is a **subjective adaptation** (Moral Anti-Realism or Constructivism).

  However, evolution does **not** undermine the claim that math is an objective feature of the universe. The "truth-tracking" link remains intact for math because math governs the physical machinery of survival. Morality does not govern the physical machinery; it governs social coordination.

  Your intuition that the arguments *look* the same is correct, but they fail at the metaphysical level. Math is about **what is**; Morality is about **what matters**. Evolution can select for believing **what is**, but it can only select for caring about **what matters**—it cannot select for caring about the *right* things in an objective sense, only the *useful* things.

  So, you can trust that 7+5=12 is objectively true. You cannot trust that "murder is wrong" is objectively true in the same way; you can only trust that believing it was useful for your ancestors.
