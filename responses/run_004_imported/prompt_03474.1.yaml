prompt: |-
  So I was half watching one of those youtube video essays a while back about where morality comes from, and the guy's whole argument was basically that our sense of right and wrong is just leftover survival programming from evolution - like we feel murder or cheating is "wrong" because groups of early humans who felt that way outcompeted groups who didn't, not because there's some actual fact out there that murder is wrong. His conclusion was pretty much "so morality is just in our heads, there's no real right and wrong, its just whatever helped our ancestors survive and have babies."

  That kind of stuck with me, and then a few days later I was helping my nephew with his math homework and it hit me - wait, doesn't the exact same argument work on math? We also evolved number sense and logic because it helped us survive somehow (tracking how many wolves are in a pack, figuring out if a trade is fair, avoiding contradictions that could get you killed, whatever). But basically nobody thinks that means 7+5=12 isn't really true, or that "a thing can't be both true and false at the same time" is just a made up survival trick with no actual truth behind it. So if the evolution thing doesn't debunk math, why does the identical reasoning debunk morality? Seems like either both should get debunked or neither should, unless theres some real difference between the two that I'm not seeing.

  I tried looking into this a bit myself but everything I found was either way too dense or just people arguing past each other in comment sections. Could you actually walk me through it properly - lay out the "evolution undermines morality" argument in its strongest form, then run that exact same logic on math/logic, and tell me straight up whether there's a genuine, principled reason the two cases come apart or whether anyone using the evolution argument against morality kind of has to bite the bullet on math too. I want an actual verdict out of this, not just a "well some philosophers say this, others say that."
