answer: |-
  You are right to feel that Armstrong's solution is dialectically unstable. While Armstrong's "non-relational tie" is the standard move for immanent realists, your intuition captures a classic and devastating objection: **primitivism is not explanation.** By stipulating that instantiation is a *sui generis* category that does not generate a regress, Armstrong attempts to dissolve the problem by fiat rather than by solving the structural difficulty Bradley identified.

  Here is an argument for your side of the dispute, structured to show that Armstrong's tie is either an empty label or it covertly relies on the very mechanisms (Fregean unsaturatedness or Russellian relating) that Armstrong explicitly rejects.

  ### 1. The Functional Contradiction of the "Non-Relational Tie"
  Armstrong's core move is to categorize instantiation not as a universal relation, but as a fundamental "tie." He argues that because it is not a relation, it does not have the same arity or ontological status as the terms it connects, and therefore does not require a further relation to connect *it* to the terms.

  However, consider the **functional role** of this tie. Its job is to bind a particular ($a$) and a universal ($F$) into a state of affairs ($a$'s being $F$).
  *   If the tie successfully binds them, it establishes a connection between distinct ontological categories.
  *   If it establishes a connection, it has **adicity** (it takes arguments).
  *   If it has adicity and connects terms, it is functionally indistinguishable from a relation.

  By calling it "non-relational," Armstrong is making a linguistic stipulation, not an ontological discovery. If the tie performs the work of a relation, Bradley's question returns: **In virtue of what does this tie connect?** If the answer is "in virtue of its nature," we must ask what that nature is. If that nature involves "connecting," we are back to square one. To say "it connects because it is a tie" is tautological. It explains unity by asserting unity.

  ### 2. The Dilemma of Unity: Frege or Russell?
  You argued that any account of how the tie achieves unity must collapse into either Frege's "unsaturatedness" or Russell's "actually relating." This is a powerful dilemma. Let's trace the horns.

  **Horn A: The Fregean Move (Structural Asymmetry)**
  For a particular and a universal to unite without an infinite chain of connectors, one of the relata must *demand* the other. This is Frege's insight: concepts are "unsaturated" (ungesättigt). They have gaps that particulars fill. If universals are inherently gap-like, no external "tie" is needed; the universal reaches out to the particular by its very nature.
  *   **Armstrong's Problem:** Armstrong is a realist about universals. He views them as repeatable entities that are fully "saturated" constituents of reality. He explicitly rejects Frege's view because he thinks it turns universals into incomplete beings.
  *   **The Critique:** If Armstrong rejects unsaturatedness, he removes the structural reason *why* $a$ and $F$ should unite. If $a$ is a complete particular and $F$ is a complete universal, they are two self-contained ontological atoms. To stick them together, you need glue. If Armstrong says the "tie" is the glue, but denies the glue needs gluing, he is ignoring the structural symmetry that creates the regress. Without Fregean asymmetry, the tie is an external addition to two independent things, which is precisely the setup for Bradley's Regress.

  **Horn B: The Russellian Move (The "Relating" Relation)**
  Russell attempted to solve this by distinguishing between a relation as a *term* (sitting in a list) and a relation as *relating* (actually doing the work). He argued that in a fact, the relation "actually relates."
  *   **Armstrong's Problem:** Armstrong effectively adopts this but calls it a "tie." He says instantiation doesn't sit alongside $a$ and $F$; it binds them.
  *   **The Critique:** Bradley's regress is specifically an attack on this move. Bradley asks: **What is the difference between a relation that relates and a relation that does not?** If the relation is an entity, it should be the same entity regardless of whether it is currently relating. If Armstrong says the "tie" is a different *kind* of entity that *always* relates, he hasn't explained *how* it relates; he has just defined it as "that which relates." This is the "dormitive virtue" objection. Saying "opium makes you sleep because it has a dormitive virtue" explains nothing. Saying "$a$ and $F$ unite because of an instantiating tie" explains nothing unless you explain how the tie avoids being just another term in the list.

  ### 3. The "State of Affairs" Dodge
  Armstrong often shifts the ground by claiming the **State of Affairs** is the primary existent, not the particular or the universal. He argues that $a$ and $F$ are abstractions from the state of affairs $a$'s being $F$. Therefore, the unity is primitive.

  This is where your charge of "relabeling" hits hardest.
  *   If the State of Affairs is primitive, then the unity of the fact is a brute fact.
  *   But Bradley's Regress is not a request for empirical data; it is a challenge to **intelligibility**. It asks: *How is unity possible?*
  *   To answer "Unity is possible because states of affairs exist" is circular. It asserts the existence of unified things to explain unity. It treats the *explanandum* (unity) as the *explanans* (the state of affairs).

  If Armstrong admits that the tie is unintelligible but necessary (a brute fact), he concedes your point: he hasn't solved the regress; he has merely stopped it by refusing to ask further questions. But if he claims it *is* intelligible, he owes an account of the mechanism of unity. Since he denies Fregean gaps and offers no mechanism for Russellian relating other than stipulation, he has no account.

  ### 4. Conclusion: The Regress is Merely Renamed
  Your friend defends Armstrong by saying the regress stops because the tie is not a further relation. You should reply that **ontological categories do not grant magical powers.**

  1.  **If the tie unifies:** It performs a function. Functions require mechanisms. If the mechanism is "it just does," that is mysticism, not metaphysics.
  2.  **If the tie relies on the nature of the terms:** Then Armstrong must accept Frege's unsaturatedness (which he rejects).
  3.  **If the tie relies on its own nature:** Then Armstrong must accept Russell's "actually relating" distinction (which Bradley showed is unintelligible without further explanation).

  By calling instantiation a "non-relational tie," Armstrong is attempting to have his cake and eat it too. He wants the binding power of a relation without the ontological cost of a relation. But you cannot get unity for free. Either the unity comes from the internal structure of the constituents (Frege), or it comes from a dynamic act of combining (Russell), or it remains a mystery. Armstrong chooses "mystery" and labels it "fundamental tie."

  Therefore, you are correct: Armstrong has not solved Bradley's Regress. He has merely given the first link in the chain a new name ("tie" instead of "relation") and stipulated that this link is sticky while all others are not. Without an account of *why* it is sticky, the regress looms just as large as before.
