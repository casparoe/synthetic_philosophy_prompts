      *   **Key Texts:** Du Bois's "Criteria of Negro Art" (1926) and Locke's "Art or Propaganda?" (1928).
      *   **Specific Focus:** Move beyond quoting thesis statements. Engage with the *pushback*. Use a concrete example: the backlash to Claude McKay's *Home to Harlem* (1928).
      *   **Tone/Style:** A dialogue. Real back-and-forth. No clear winner. Avoid strawmanning Locke (he wasn't just "art for art's sake," he cared about racial dignity and long-term perception).
      *   **Context:** A Harlem Renaissance class discussion.

  2.  **Character Voices & Positions:**
      *   **W.E.B. Du Bois:** Urgent, political, sociological. Believes art *must* serve the cause of racial uplift because the stakes (lynching, disenfranchisement) are too high. Sees beauty as a weapon for truth. Worried that "negative" portrayals feed white prejudice.
      *   **Alain Locke:** Aesthetic, philosophical, curatorial. Believes propaganda stifles true artistic expression. If art is forced to serve a message, it becomes didactic and loses its universal power. Worried that policing black art creates a "talented tenth" censorship that ignores the reality of black life.
      *   **The Conflict Point:** *Home to Harlem*. Du Bois famously called it "nauseating" and felt it set the race back. Locke defended the right of the artist to depict life as it is, even the gritty parts.

  3.  **Drafting - Section by Section:**

      *   **Setting the Scene:** Needs to feel intimate but intellectual. Maybe Locke's office at Howard or a quiet corner of a NYC salon. Let's go with 1928, New York. A private meeting after a public disagreement.
      *   **Opening:** Start *in media res*. Acknowledge the tension. Du Bois brings up *Home to Harlem*.
      *   **Round 1: The Book.** Du Bois attacks the book for reinforcing stereotypes. Locke defends the honesty of the depiction.
      *   **Round 2: The Definition of Propaganda.** Du Bois clarifies his "All art is propaganda" line. It's not about lying; it's about purpose. Locke counters that purpose kills spontaneity and truth.
      *   **Round 3: The Audience.** Du Bois worries about the *white* gaze (how this looks to racists). Locke worries about the *black* internal freedom (censoring ourselves for white approval).
      *   **Round 4: The Future.** Du Bois wants justice *now*. Locke wants culture that lasts *forever*.
      *   **Ending:** No resolution. A respectful disagreement. They need each other, but they differ on method.

  4.  **Refining the Arguments (incorporating specific texts):**
      *   *Du Bois:* "I stand in utter shamelessness and say that whatever art I have for writing has been used always for propaganda for gaining the right of black folk to love and enjoy." (Criteria) -> Needs to be woven in naturally.
      *   *Locke:* "Propaganda... becomes a poison." (Art or Propaganda?) -> He distinguishes between *expression* and *instruction*.
      *   *McKay:* Du Bois called *Home to Harlem* "filth." Locke saw it as a necessary venting of the "primitive" energy (though Locke's view on primitivism is complex, let's focus on his defense of artistic freedom).

