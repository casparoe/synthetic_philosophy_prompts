      *   *Critique:* Is Du Bois sounding too censorious?
      *   *Fix:* Show his pain. He's tired of fighting. He sees art as a tool for survival, not just a luxury.

  6.  **Writing the Dialogue (incorporating sensory details and rhythm):**
      *   Use period-appropriate language (without being caricatured).
      *   Ensure they interrupt each other or finish thoughts.
      *   Highlight the emotional weight. This isn't just theory; it's about their people.

  7.  **Review against Constraints:**
      *   Did I use *Home to Harlem*? Yes.
      *   Is Locke strawmanned? No, his argument is about the *long-term* cost of propaganda art.
      *   Is Du Bois nuanced? Yes, his propaganda is about *truth* and *justice*, not just lies.
