answer: |-
  **Setting:** *New York City, late 1928. The study of Alain Locke. The room is filled with African sculptures, modernist paintings, and stacks of manuscripts. W.E.B. Du Bois sits in a leather armchair, holding a copy of Claude McKay's* Home to Harlem *loosely in one hand. Locke is pouring tea.*

  **Du Bois:** You look at me as if I'm burning the furniture, Alain. I'm simply holding a book.

  **Locke:** You're holding it like it's a indictment, W.E. And given what you wrote in the *Crisis* last month, I suppose it is. "Nauseating," I believe, was the word.

  **Du Bois:** It was the honest word. After the war, after the summer of 1919, when men died to make the world safe for democracy... to have this? This reveling in the gutters? McKay depicts us as hedonists, drifters, ruled by instinct. I know the white reader. I know the Southern editor. They will take this not as a novel, but as evidence. "See? They cannot govern themselves. They are only this."

  **Locke:** And there it is. The shadow. You aren't critiquing the prose, W.E. You're critiquing the potential utility of the prose for our enemies.

  **Du Bois:** I am critiquing the responsibility of the artist! I wrote in *Criteria* that I do not care a damn for any art that is not used for propaganda. I stand by it. The time is too urgent. When a man is lynched, he does not need a sonnet about the beauty of the rope. He needs the rope cut. Art is the axe. If McKay is sharpening the rope, he is not an artist, he is a traitor.

  **Locke:** *Sets the teapot down with a sharp clink.* That is a dangerous simplification. You say "all art is propaganda." I say that the moment you demand art *be* propaganda, you kill the art. You turn the artist into a clerk for the NAACP.

  **Du Bois:** A clerk?

  **Locke:** A clerk of racial uplift. Listen to me. Propaganda is didactic. It seeks to persuade. Art seeks to express. If McKay feels the pulse of the Harlem streets—the sweat, the sex, the weariness—and he writes that, he is telling the truth. If you tell him, "No, Claude, paint only the doctors and the lawyers, paint only the dignified," you are asking him to lie. And a lie, no matter how dignified, is weak art. Weak art does not last.

  **Du Bois:** Truth? You call that truth? It is a slice of life, yes, but it is not the *whole* life. To present the underbelly without the spine is distortion. It is feeding the caricature. I am not asking for lies, Alain. I am asking for perspective. Why must the "freedom" of the Negro artist always mean the freedom to depict our degradation? Where is the propaganda for our humanity?

  **Locke:** Because that is what you are missing! You think propaganda for humanity means showing we are just like white people. Polite, bourgeois, assimilated. That is not humanity; that is mimicry. Real art comes from the folk, from the soil, from the raw energy. Even the messy parts. If we censor ourselves to appease the white gaze—to make sure the *New York Times* doesn't frown—we are still slaves. We are just trading the whip for the review column.

  **Du Bois:** *Leans forward, voice tightening.* Do not speak to me of slavery. I have fought longer than you have lived. I know the cost. You speak of "folk energy" as if it is an abstract concept. I see the cost in legislation. I see it in the denial of school funds. If *Home to Harlem* makes it harder for a black child in Georgia to get a textbook, then McKay's "folk energy" is a luxury we cannot afford. Beauty is not a toy, Alain. It is a weapon. And you are asking us to dull the blade in the name of... what? Aesthetic purity?

  **Locke:** In the name of integrity! If the blade is dull, it cuts nothing. Look at the history of white art. Do they censor their Dostoevskys because the characters are miserable? Do they ban their Zolas because they depict prostitutes? No. They are granted the universality of the human condition. Suffering, sin, joy. But when the Negro artist touches sin, it becomes "racial propaganda." When he touches joy, it becomes "primitive exoticism."

  **Du Bois:** Because we do not have the luxury of universality yet! We are judged as a race, not as individuals. That is the reality of the world we live in, not the world you want to live in.

  **Locke:** And that is exactly why we must create art that transcends this moment. If we write only for the political battle of 1928, what will be left in 1950? Propaganda dates. It rots. It is tied to the immediate crisis. True art survives because it speaks to the human spirit, not the voting booth. I worry, W.E., that your "Criteria" creates a new tyranny. The Talented Tenth becomes the Censorial Tenth. Policing our own.

  **Du Bois:** *Stands up, pacing.* It is not tyranny to ask for solidarity. When the house is on fire, you do not worry about the aesthetic arrangement of the furniture. You worry about getting everyone out. You accuse me of caring only about the white gaze. I accuse you of ignoring it. You want to build a museum of Negro art while the neighborhood burns.

  **Locke:** I want to build a foundation so that when the fire is out, we have something to stand on that isn't ash. You say art is an axe. Fine. But an axe used only for chopping down enemies eventually loses its edge. It becomes a club. McKay's book... it angers you because it shows a freedom you don't recognize. A freedom from *your* respectability.

  **Du Bois:** Respectability is armor!

  **Locke:** And sometimes it is a cage. There is a difference between propaganda and persuasion. Propaganda says, "Believe this because it helps the cause." Art says, "Feel this because it is true." If the truth is ugly, it must be shown. If we only show the beautiful, we admit that our ugliness is shameful. And that... that is the real propaganda. The idea that we must be perfect to be free.

  **Du Bois:** *Stops pacing. Looks at Locke.* So we let them think we are beasts, so long as the prose is lyrical?

  **Locke:** No. We let them see we are men. Beasts do not write novels about their beastliness. Men do. The very act of McKay writing this, with skill and power, proves the humanity you are worried he's undermining.

  **Du Bois:** *Sits back down, slowly.* You place a great deal of faith in the reader's nuance.

  **Locke:** I place a great deal of faith in the artist's vision. If you dictate the vision, you lose the artist. You might gain a pamphleteer, but you lose the voice that will speak to the future.

  **Du Bois:** And I fear that if we lose the present, there is no future. *He taps the book.* I cannot endorse this. It hurts the cause.

  **Locke:** And I cannot censor it. It hurts the culture.

  **Du Bois:** *A long silence.* We are at an impasse, Alain.

  **Locke:** *Pours tea into Du Bois's cup.* Perhaps. Or perhaps we are the two lungs of the same body. You breathe in the political reality; I breathe out the cultural possibility. If we stop one, the body dies.

  **Du Bois:** *Takes the tea.* I still think McKay is wrong.

  **Locke:** And I still think you are too afraid of the dark.

  **Du Bois:** *A faint, tired smile.* I have seen too much of it to pretend it isn't there.

  **Locke:** And I have seen too much beauty to let it be defined only by the darkness.

  *They sit in silence, the book resting on the table between them, neither moving to open it nor to put it away.*
