answer: |-
  You are absolutely right to be suspicious. Wikipedia (and even some intro logic classes) often blur these together because they almost always show up in the same conversation, but **they are categorically different things.**

  Here is the blunt distinction:

  *   **Paraconsistent Logic** is a **tool** (a formal system).
  *   **Dialetheism** is a **thesis** (a philosophical claim about reality/truth).

  Here is the breakdown of how they interact, whether one forces the other, and what actually makes dialetheism weird.

  ---

  ### 1. Paraconsistent Logic: The Fireproof Room
  Paraconsistent logic is defined by what it *rejects*. In classical logic, we have a rule called **Explosion** (or *ex contradictione quodlibet*). It says:
  $$A, \neg A \vdash B$$
  *(If you accept a contradiction, you can prove literally anything.)*

  If you believe "It is raining" and "It is not raining," classical logic says you are committed to believing "The Moon is made of cheese." This makes any theory with a contradiction **trivial** (useless).

  **Paraconsistent logic is simply a system where the Explosion rule is disabled.** It is a logic that allows you to contain a contradiction without your entire belief system collapsing into nonsense.

  *   **Is it a claim about truth?** No.
  *   **Is it a claim about the world?** No.
  *   **What is it?** It's damage control. It's a fireproof room.

  ### 2. Dialetheism: The Claim That There Is Fire
  Dialetheism is the philosophical view that **there are true contradictions.**
  A dialetheist looks at the Liar Sentence (*"This sentence is false"*) and says: "It's not a mistake, it's not undefined, it's not a category error. It is **both true and false**."

  *   **Is it a claim about truth?** Yes. It claims the predicate "is true" applies to some contradictions.
  *   **Is it a claim about the world?** Yes (metaphysically). It claims reality or truth itself is inconsistent in certain places.
  *   **What is it?** It's the claim that there is actually a fire burning inside the room.

  ---

  ### 3. The "Force" Questions
  You asked the exact right questions to separate them.

  **Q: Does accepting true contradictions (Dialetheism) force you into using a paraconsistent logic?**
  **A: YES.**
  If you are a dialetheist, you believe there is at least one true contradiction ($A \land \neg A$). If you used classical logic, that single contradiction would trigger Explosion, meaning you would have to believe *everything* is true (Trivialism). Since dialetheists don't believe everything is true (they don't believe $2+2=5$), they **must** reject the Explosion rule. Therefore, a dialetheist *must* be a paraconsistentist.

  **Q: Does using a paraconsistent logic force you to be a dialetheist?**
  **A: NO.**
  This is the part your teacher probably glossed over. You can use paraconsistent logic as a pragmatic tool without believing contradictions are *true*.
  *   **Example:** Imagine a legal database. One law says "All vehicles are banned." Another says "Emergency vehicles are exempt." An AI lawyer using classical logic would crash when asked about an ambulance. An AI using **paraconsistent logic** can handle the inconsistency without crashing.
  *   **The Catch:** The programmer doesn't believe the law is *actually* a true contradiction in reality. They believe the *database* is messy. They are using the fireproof room just in case, not because they believe there is fire.

  This view is sometimes called **"Weak Paraconsistency"** or **"Instrumentalism."** You tolerate contradictions in your *theories* or *data*, but you don't think the *world* is contradictory.

  ---

  ### 4. So, what is actually distinctive about Dialetheism?
  If paraconsistent logic is just the math that makes dialetheism possible, what makes dialetheism the "weird" philosophical cousin?

  **1. It rejects the "Error Theory" of paradoxes.**
  Most philosophers look at the Liar Paradox and say, "Human language is flawed," or "This sentence has no truth value," or "We need to fix our definitions." They think the contradiction is a sign of human error.
  The dialetheist (like Graham Priest, the big name here) says: **"No, the reasoning is valid, the premises are true, so the conclusion must be true."** They take the paradox at face value. That is a massive metaphysical commitment.

  **2. It changes the goal of logic.**
  *   **Classical/Paraconsistent (Non-Dialetheic):** The goal of logic is to preserve truth and avoid falsehood. Contradictions are signs that we failed.
  *   **Dialetheic:** The goal of logic is to track truth, even if truth happens to be inconsistent in some spots. Contradictions are sometimes features, not bugs.

  **3. It's ontologically expensive.**
  Using paraconsistent logic costs you nothing but some classical theorems (like Disjunctive Syllogism in some systems). Being a dialetheist costs you your intuitive grasp of reality. You have to explain how a door can be truly "open" and truly "not open" at the same time, in the same respect, without it just being a semantic trick.

  ### Summary Table

  | Feature | Paraconsistent Logic | Dialetheism |
  | :--- | :--- | :--- |
  | **Category** | Formal System / Tool | Philosophical Thesis / Belief |
  | **Core Claim** | Contradictions don't imply *everything*. | Some contradictions are *true*. |
  | **Commitment** | Mathematical / Structural | Metaphysical / Ontological |
  | **Relationship** | Can exist without Dialetheism. | Cannot exist without Paraconsistent Logic. |
  | **Analogy** | Building a fireproof room. | Believing there is a fire inside. |

  ### The Bottom Line
  Your logic teacher was vague because it's easy to conflate them. But here is the hard line:

  **Paraconsistent logic is the engine; dialetheism is the driver who claims the road is actually a loop.** You can have the engine without the driver (using the logic to manage inconsistent data), but the driver cannot drive without the engine (you can't have true contradictions without a logic that tolerates them).

  Dialetheism is special because it is the only position that looks at a paradox, shrugs, and says, "Well, I guess reality is just inconsistent there," rather than trying to fix the paradox.
