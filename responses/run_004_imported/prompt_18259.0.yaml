  2.  **Deconstruct the Doomsday Argument (DA):**
      *   *Core Claim:* Knowing your birth rank ($n$) among all humans ($N$) allows you to update the probability distribution of $N$. If $n$ is relatively small, large $N$ becomes less likely.
      *   *Bayesian Form:* $P(N|n) \propto P(n|N)P(N)$. Usually assumes $P(n|N) = 1/N$ (principle of indifference within the class).
      *   *Key Objections:* Reference class, SSA vs. SIA, Gott's frequentist approach, metaphysics of the future, selection effects.

