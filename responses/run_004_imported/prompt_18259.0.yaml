      *   *Wait, I need to make sure the follow-ups are "keyed to the answer she is most likely to give".* Defenders of DA usually stick to SSA, argue the reference class is "observers like us," and bite the bullet on the Presumptuous Philosopher or modify SIA. I need to anticipate the "Standard Defense."

      *   *Standard Defense Anticipation:*
