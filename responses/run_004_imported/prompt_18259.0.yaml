answer: |-
  Here is a draft of ten questions tailored to your background and the specific constraints of the interview. They are designed to move past the introductory analogies and press on the structural and metaphysical commitments required to sustain the argument.

  ### 1. The Prior Distribution over $N$
  "In the Bayesian formulation, the posterior probability for the total number of humans $N$ depends critically on the prior $P(N)$. In cosmology, we often struggle with measure problems where the choice of a scale-invariant prior versus a flat prior changes the physical predictions entirely. If you adopt a scale-invariant prior ($1/N$), the Doomsday Argument seems to vanish because the likelihood function cancels the prior. If you adopt a flat prior, the argument is strongest. Given that we have no empirical data on the distribution of civilization lifespans across the universe to justify one over the other, aren't you essentially smuggling your conclusion into the choice of the prior?"

  *   **Follow-up:** "She will likely reply that the prior represents our state of ignorance before considering birth rank, and that a scale-invariant prior is inappropriate for bounded quantities. Press her on this: If we treat the duration of a species as a physical parameter akin to a stellar lifetime, we usually model those with specific distribution functions derived from physical constraints. What is the physical constraint that justifies a prior that allows the Doomsday update to gain traction, other than the desire to make the argument work?"

  ### 2. The Reference Class Problem
  "The argument hinges on the assumption that I am a random sample from the class of 'all humans.' But 'human' is a biological category, whereas the sampling seems to be epistemic. If I include Neanderthals, the rank shifts. If I include future post-humans or digital uploads who possess continuity of consciousness but different substrate, the rank shifts drastically. On what objective basis do you define the reference class? Is it 'biological Homo sapiens,' 'entities capable of understanding this argument,' or 'all conscious observer-moments'? And if it is the latter, does the argument not imply we should expect to be short-lived conscious moments rather than long-lived ones?"

  *   **Follow-up:** "She will likely argue for the 'narrowest reference class of observers who share your specific information.' Challenge this: If the class is defined by the information I possess, doesn't that make the class unique to me? If I am the only observer with my exact information, my rank is 1 of 1, and the argument collapses. How do you prevent the reference class from shrinking to singularity without arbitrarily excluding observers who are epistemically identical to us?"

  ### 3. SSA vs. SIA
  "To derive the Doomsday conclusion, one must accept the Self-Sampling Assumption (SSA)—that you should reason as if randomly selected from the set of existing observers. The rival Self-Indication Assumption (SIA) suggests you should weight hypotheses by the number of observers they contain, which effectively cancels the Doomsday update. You must take a stand: Do you reject SIA outright? If so, are you willing to accept the implication that we can know something about the size of the universe purely from the fact of our existence, independent of observation?"

  *   **Follow-up:** "She will likely reject SIA because it leads to the 'Presumptuous Philosopher' problem (inferring a huge universe without looking). Ask her: Is it not more presumptuous to think that your birth rank can constrain the future longevity of the species than to think that a larger universe is more likely to contain you? Why is the metaphysical cost of SSA lower than the metaphysical cost of SIA?"

  ### 4. The Presumptuous Philosopher
  "Following up on that: Nick Bostrom's 'Presumptuous Philosopher' thought experiment suggests that SIA allows us to rule out physical theories that predict fewer observers, purely a priori. You reject this. But does SSA not lead to a 'Solipsistic Philosopher' problem? If I reason that I am a random sample from all observers, and I find myself in a small population, do I not license the inference that other, larger populations of observers are unlikely to exist *now*, effectively pruning the tree of contemporary civilizations without telescopic data?"

  *   **Follow-up:** "She will likely distinguish between future observers (which DA targets) and contemporary observers (which are causally disconnected). Press her: The mathematics of SSA doesn't inherently distinguish between temporal and spatial separation. If the sampling is from the set of 'all observers,' why does the light-cone structure of relativity protect contemporary aliens from the Doomsday logic while it does not protect future humans?"

  ### 5. Gott's $\Delta t$ Argument
  "J. Richard Gott's version of this argument relies on frequentist confidence intervals applied to durations (like the Berlin Wall), whereas the Carter-Leslie version is a Bayesian update on counts. Gott claims his method requires no priors. Do you view these as identical arguments? If not, where do they diverge? Specifically, Gott's argument applies to anything with a beginning and an end, whereas your argument seems specific to observers. Is the observer element essential, or is it merely a vehicle for the statistics?"

  *   **Follow-up:** "She will likely say the observer element is essential because only observers can condition on their own existence. Ask her: If the statistics hold for the Berlin Wall, why shouldn't they hold for the human species as a physical phenomenon regardless of observation? If you admit the statistical regularity holds for non-observers, aren't you admitting the 'anthropic' component is superfluous and the argument is just a claim about the stability of durations?"

  ### 6. The Metaphysics of the Future Population
  "In stellar population modeling, the initial mass function is fixed at the birth of the cluster. But the total number of humans $N$ is not a fixed parameter waiting to be discovered; it is a variable determined by contingent choices, fertility rates, and existential risks that have not yet occurred. By treating $N$ as a fixed value in a probability distribution, are you not implicitly committing to a block universe where the future already exists? If the future is open, what does it mean to sample from a set that does not yet exist?"

  *   **Follow-up:** "She will likely argue that we treat $N$ as fixed for the purpose of the probability space, similar to how we treat the outcome of a coin toss before looking. Counter with: A coin toss outcome is determined by initial conditions. $N$ is determined by free agents who have not yet acted. If your argument is valid, does it not imply a form of fatalism where our attempts to extend the species are statistically constrained by the fact that we are here now?"

  ### 7. Observer-Moments vs. Observers
  "Elga and others have suggested we should sample from 'observer-moments' rather than 'observers.' If I live to be 100, I contribute twice as many moments as someone who dies at 50. If the Doomsday Argument holds, should I not update toward a future where human lifespans are short, simply because that maximizes the number of observer-moments for a given population? Does your formulation weight by duration, and if not, why do we ignore the temporal extent of the observer in the sampling?"

  *   **Follow-up:** "She will likely say that birth rank is the robust metric, not duration. Ask her: But if the 'self' is a process extended in time, why is the 'birth' event the privileged sampling point? If I am a temporal slice, my 'rank' among all temporal slices might be very different than my rank among all births. Does shifting the ontology from 'person' to 'person-moment' salvage the argument or destroy it?"

  ### 8. Conflict with Demographic Models
  "As a scientist, I am used to Bayesian updates overriding naive priors when new data arrives. However, we have detailed demographic models projecting population growth and decline based on economic and sociological data. If the Doomsday Argument implies a high probability of extinction within a few centuries, but demographic models suggest a stable population for a millennium, which probability distribution wins? Can a purely indexical fact (my birth rank) override empirical data about fertility and mortality?"

  *   **Follow-up:** "She will likely say the Doomsday Argument acts as a prior shift that the demographic models must incorporate. Press her: If the demographic models are based on causal mechanisms (resource limits, contraception) and the Doomsday Argument is based on indexical selection, are you claiming that indexical facts have causal power? Or are you claiming that our causal models are missing a variable that correlates with birth rank?"

  ### 9. The Dieks/No-Update Objection
  "Dennis Dieks has argued that the probability of *being* me is proportional to the total number of observers. If there are more humans, the probability of any specific individual existing is lower. He claims this factor exactly cancels the likelihood ratio from the birth rank, resulting in no update at all. You obviously reject this. But isn't Dieks simply applying the Principle of Indifference to the 'creation' of observers rather than the 'sampling' of them? Why is your sampling assumption more fundamental than his existence assumption?"

  *   **Follow-up:** "She will likely argue that Dieks confuses the probability of the hypothesis with the probability of the evidence. Ask her: But if the 'evidence' includes my existence, and my existence is more likely in a world with more people, isn't that relevant data? If you strip out the probability of existence to make the argument work, aren't you engaging in data selection to preserve the conclusion?"

  ### 10. Falsifiability and Action (Closing Question)
  "Finally, let's step back from the formalism. Short of finding a mathematical error in the derivation, what would you accept as evidence that the argument is simply *wrong* rather than merely unsettling? Is there any empirical observation that could falsify the Doomsday Argument? And practically: if the argument is sound, does it prescribe any specific action? Should we fund existential risk mitigation differently, or does the argument imply that such mitigation is futile because the probability update is independent of our causal interventions?"

  *   **Follow-up:** "She will likely say it's a prior shift that encourages caution but doesn't dictate specific policies. Push for the end: If it doesn't change our behavior, and it cannot be falsified by empirical data (since it overrides empirical data), in what sense is it a scientific or even a philosophical claim rather than a cognitive bias we have decided to formalize? At what point do we decide that a probability argument that contradicts all causal models is the one that should be discarded?"
