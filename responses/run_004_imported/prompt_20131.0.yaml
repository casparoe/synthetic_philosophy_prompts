prompt: |-
  I spent my working life doing condensed matter physics, and now that I'm retired I've finally got time to read all the philosophy I always meant to get around to. Lately I've been stuck on Jaegwon Kim's causal exclusion argument against non-reductive physicalism (from *Mind in a Physical World*), and it's scratching an itch that's been there since my old "downward causation" arguments with colleagues about emergence, except done with way more rigor than we ever managed. The short version, as I understand it: if the physical domain is causally closed (every physical effect that has a cause has a sufficient physical cause), and we're not going to accept that mental and physical causes are routinely, systematically overdetermining the very same effects, then a mental property that's merely realized by, but not identical to, some physical property seems to get squeezed out of any causal work entirely - unless you just bite the bullet and reduce it to the physical after all.

  The move I can't stop poking at is Stephen Yablo's reply, where he argues the mental stands to the physical the way a determinable stands to its determinate - the classic example being "red" versus some specific shade of red - and that the "proportionate" cause of an effect (he's got this pigeon-trained-to-peck-at-red-things example) is normally the determinable rather than the finer-grained determinate, so mental and physical properties were never really rivals for causal credit in the first place, any more than being red and being that particular shade are rivals. I ran this by an old colleague from my department (definately not a philosopher) and he balked immediately, on the grounds that red-and-its-shades is a tidy, single-dimension conceptual relationship, while a given mental state is supposed to be realizable by all sorts of heterogeneous physical stuff with nothing obviously in common - so calling that a "determinable/determinate" pair looked to him like question-begging with nicer terminology.

  I'd like you to actually build that objection (or a better one, if you've got one) into a proper, rigorous argument that Yablo's proportionality move does NOT succeed in rescuing mental causation from Kim's exclusion argument - i.e., that even granting him the determinable/determinate framing, the mental property remains just as causally excluded by its physical realizer as it was before. Please don't just gesture at the multiple-realizability worry as a slogan and call it done; anticipate how Yablo, or someone defending him, would push back, and take the argument as far as it'll actually go.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired condensed matter physicist. Deeply familiar with concepts like emergence, downward causation, and physical causal closure. Has read Jaegwon Kim (*Mind in a Physical World*) and Stephen Yablo. Understands the technical stakes (exclusion argument, overdetermination, non-reductive physicalism).
      *   **The Problem:** The user is intrigued by Yablo's determinable/determinate solution to Kim's exclusion problem but has a colleague who objects based on multiple realizability (MR). The user wants a *rigorous* argument showing why Yablo's move fails, specifically addressing the MR objection and anticipating Yablo's counter-moves.
      *   **Constraint:** Do not just sloganize "multiple realizability." Build a proper, rigorous argument. Anticipate defenses. Go as far as the argument will go.
      *   **Tone:** Professional, rigorous, respectful of the user's background (physics), philosophically precise.

  2.  **Deconstruct the Philosophical Landscape:**
      *   **Kim's Exclusion Argument:**
          1.  Physical Causal Closure (PCC): Every physical event has a sufficient physical cause.
          2.  No Systematic Overdetermination: Mental and physical causes don't routinely overdetermine effects.
          3.  Distinctness: Mental properties $\neq$ Physical properties (Non-reductive physicalism).
          4.  Conclusion: Mental properties are epiphenomenal (causally inert).
      *   **Yablo's Proportionality/Determinable Solution:**
          *   Analogy: Mental ($M$) is to Physical ($P$) as Determinable ($D_{able}$, e.g., Red) is to Determinate ($D_{ate}$, e.g., Scarlet).
          *   Claim: $D_{able}$ and $D_{ate}$ are not competitors. If $D_{ate}$ causes $E$, $D_{able}$ can also cause $E$ without overdetermination because $D_{able}$ is *proportionate* to $E$ (specifically, if $D_{ate}$ is too specific).
          *   Goal: Save mental causation without reduction.
      *   **The Core Objection (Multiple Realizability):**
          *   Red/Scarlet is a *genus-species* or *logical* relation within a single domain (color space).
          *   Mental/Physical is a *functional-structural* relation across heterogeneous domains (neural, silicon, alien goo).
          *   If $M$ is multiply realizable, is it really a *determinable* of $P$? Or is it a functional kind that $P$ *realizes*?
          *   If it's realization, not determination, does proportionality hold?

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Step 1: Formalize Yablo's Position.** Need to define "Proportionality" and the Determinable/Determinate relation clearly.
          *   $c$ causes $e$ only if $c$ is proportionate to $e$.
          *   Proportionality requires: (i) Contingency (if $c$ hadn't occurred, $e$ wouldn't have), (ii) Adequacy (if $c$ had occurred, $e$ would have), (iii) Requirement (no part of $c$ is irrelevant), (iv) Sufficiency (no more is needed).
          *   Yablo claims $M$ is proportionate where $P$ is too specific.

      *   **Step 2: The "Heterogeneity" Objection (The Physicist's Colleague's Point).**
          *   In color space, Scarlet *entails* Red. It's a logical/conceptual containment.
          *   In NRP (Non-Reductive Physicalism), $P$ *realizes* $M$. Does $P$ entail $M$? Yes, by supervenience.
          *   *But*, the relation between $P_1$ (human neural state) and $P_2$ (alien silicon state) realizing the same $M$ is not a determinate/determinable relation *between them*. They are disjunctive.
          *   Yablo needs $M$ to be a genuine property, not a disjunction. If $M$ is a disjunction of heterogeneous $P$'s, does it have causal powers?

      *   **Step 3: The "Common Nature" Problem (The Rigorous Push).**
          *   For $D_{able}$ to be causally efficacious, it must pick out a *natural kind* or a causally relevant similarity.
          *   Redness works because all shades of red reflect light in a specific range. There is a physical similarity.
          *   Do all realizers of Pain share a physical similarity? No. That's the point of MR.
          *   If they share *no* physical similarity, what is the "determinable" property *made of*? It looks like a functional role.
          *   If it's a functional role, is it a property *of the substrate* or a higher-order property?
          *   Kim's old objection: Second-order properties (functional roles) borrow their causal powers from their first-order realizers.

      *   **Step 4: Anticipating Yablo's Defense.**
          *   Yablo might say: "I don't need physical similarity. I need counterfactual dependence."
          *   If $M$ hadn't occurred (no pain), the behavior wouldn't have occurred.
          *   Defense: This relies on the truth of the counterfactuals. But if $M$ is MR, the closest world where $M$ is absent might involve a different physical realizer.
          *   This leads to the "Disjunction Problem." If $M = P_1 \lor P_2 \lor P_3...$, then saying $M$ caused $E$ is just saying $(P_1 \lor P_2...) $ caused $E$. But causation is usually singular. Disjunctive properties are notoriously causally inert (Armstrong's objection).

      *   **Step 5: The "Exclusion" Re-emerges.**
          *   Even if we grant $M$ is a determinable, $P$ is still the *truthmaker* for $M$.
          *   If $P$ is sufficient for $E$, and $M$ supervenes on $P$, $M$'s causal claim is derivative.
          *   Yablo tries to break the "competition" model. But if $P$ does all the work physically, $M$ is just a description of $P$.
          *   If $M$ is just a description, is it ontologically robust enough to satisfy the Non-Reductive Physicalist? Or is it just Reductive Physicalism in disguise (labeling)?

  4.  **Refining the Argument for a Physicist:**
      *   Use analogies from physics (phase transitions, effective field theories) to make the point resonate.
      *   Focus on the *ontological status* of the determinable.
      *   Structure it as a formal reductio or a dilemma.

  5.  **Developing the "Disjunctive Property" Attack:**
      *   This is the strongest philosophical counter to Yablo in this context.
      *   If $M$ is MR, the extension of $M$ is a disjunction of physically disparate states.
      *   Determinables (like Color) have unified extensions (wavelengths).
      *   If $M$ is disjunctive, it fails the "natural kind" test required for causal powers in a physicalist world.
      *   Yablo's proportionality relies on $M$ being a *unitary* cause. If $M$ is gerrymandered (disjunctive), it can't be proportionate.

  6.  **Developing the "Supervenience vs. Determination" Attack:**
      *   Determinable/Determinate is a logical/semantic relation (Scarlet *is* Red).
      *   Realization is a metaphysical/nomic relation (Neural state *nomologically necessitates* Pain).
      *   Yablo conflates these. If $M$ supervenes on $P$, $P$ fixes $M$. If $P$ causes $E$, $M$'s connection to $E$ is parasitic.
      *   Proportionality doesn't fix parasitism.

  7.  **Final Polish:**
      *   Ensure the tone is collegial.
      *   Check that Kim's specific exclusion premises are addressed.
      *   Make sure the conclusion is clear: Yablo saves the *language* of mental causation but not the *ontology* required by Non-Reductive Physicalism.

  8.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Focus heavily on counterfactuals.
      *   *Correction:* Physicists might find counterfactual semantics (Lewis/Stalnaker) less intuitive than structural/causal closure arguments. Stick to the ontological status of properties and causal closure.
      *   *Check:* Did I address the colleague's specific point? Yes, the "single-dimension" vs. "heterogeneous" point is the crux of the Disjunction Problem.
      *   *Check:* Did I anticipate Yablo's pushback? Yes, Yablo would deny $M$ is a disjunction. I need to argue why MR *forces* it to be disjunctive if physicalism is true.

  9.  **Final Structure:**
      *   Introduction: Acknowledge the depth of the problem.
      *   Section 1: Reconstructing Yablo's Proportionality (The Setup).
      *   Section 2: The Heterogeneity Objection (The Colleague's Intuition Formalized).
      *   Section 3: The Disjunction Problem (Why MR breaks the Determinable model).
      *   Section 4: The Parasitism Objection (Why Proportionality doesn't stop Exclusion).
      *   Section 5: Conclusion (The Dilemma for NRP).

  (Proceed to generate response based on this structure.)
answer: |-
  This is a superb problem to wrestle with, especially coming from a background in condensed matter. You know better than most that "effective" descriptions (like temperature or pressure) are incredibly useful, but the question of whether they have *ontological* causal power distinct from the microdynamics is exactly where the rubber meets the road. Kim knows this, and Yablo knows Kim knows this.

  Your colleague's intuition—that the Red/Scarlet relation is structurally different from the Mental/Physical relation—is the correct place to dig. It is not merely a worry about "heterogeneity"; it is a worry about **property unity**.

  Below, I will construct a rigorous argument demonstrating why Yablo's proportionality constraint fails to rescue non-reductive physicalism (NRP) from Kim's exclusion argument. I will structure this as a dilemma that targets the ontological status of the "determinable" mental property under the constraint of Multiple Realizability (MR).

  ---

  ### The Argument: The Disjunction and Parasitism Dilemma

  To show that Yablo's move fails, we must demonstrate that the Mental/Physical relation cannot satisfy the conditions required for Yablo's determinable/determinate solution without collapsing into either Reductionism or Epiphenomenalism.

  #### 1. Reconstructing Yablo's Proportionality Constraint
  Yablo's core insight is that causation requires **proportionality**. A cause $C$ is proportionate to effect $E$ if:
  1.  **Contingency:** If $C$ had not occurred, $E$ would not have.
  2.  **Adequacy:** If $C$ had occurred, $E$ would have.
  3.  **Requirement:** $C$ contains no irrelevant parts (it isn't too specific).
  4.  **Sufficiency:** $C$ is enough for $E$ (it isn't too general).

  **Yablo's Claim:** In the case of the pigeon pecking at a red target, "Red" is proportionate, while "Scarlet" is too specific (the pigeon would have pecked at crimson too). Therefore, "Red" causes the peck, and "Scarlet" does not compete with it; they are not rivals.
  **Application to Mind:** The mental property $M$ (e.g., Pain) is the determinable. The physical property $P$ (e.g., C-fiber firing) is the determinate. $P$ is too specific to be the proportionate cause of the behavior $B$. $M$ is just right. Thus, $M$ causes $B$, and $P$ is merely the realization. Exclusion is avoided because $M$ and $P$ are not competitors.

  #### 2. The Heterogeneity Objection (Formalized)
  Your colleague's objection is that "Red" and "Scarlet" share a **unified qualitative space**. All shades of red are physically similar (specific wavelengths). The relation is logical/conceptual containment.

  However, in NRP, $M$ is **Multiply Realizable**. $M$ can be realized by $P_1$ (human neurons), $P_2$ (silicon chips), $P_3$ (alien goo).
  *   **Premise 1 (Physicalism):** All causal work in the physical world is done by physical properties operating under physical laws.
  *   **Premise 2 (MR):** The physical realizers $\{P_1, P_2, P_3...\}$ of a single mental type $M$ share no significant physical similarity (they are heterogeneous).
  *   **Premise 3 (Determinable Unity):** For a determinable property $D$ to have causal powers distinct from its determinates, $D$ must pick out a **natural kind** or a unified causal basis. (A gerrymandered disjunction cannot be a cause).

  **The Problem:** If $P_1, P_2, P_3$ are physically heterogeneous, what unifies them as $M$?
  *   **Option A:** They share a higher-order functional role $F$.
  *   **Option B:** They are simply a disjunction $P_1 \lor P_2 \lor P_3$.

  If **Option B**, $M$ is a disjunctive property. As Armstrong and Kim have argued, disjunctive properties are causally inert. You cannot say "The disjunction caused the effect" when in any given instance, only one disjunct was present and did the work. If $M$ is just a disjunction, Yablo's determinable relation collapses. "Red" is not a disjunction of wavelengths; it is a range. $M$, under MR, looks exactly like a disjunction of physically unrelated states.

  If **Option A**, $M$ is a functional property. But now we face the **Second-Order Property Objection**.

  #### 3. The Second-Order Property Trap
  Let's assume Yablo pushes back: *"M is not a disjunction; it is a functional property (the role), and P is the filler. The role is the determinable."*

  Here is where the exclusion argument re-enters through the back door.
  1.  **Functional Definition:** $M$ is defined as "the property that plays causal role $R$."
  2.  **Realization:** $P$ plays causal role $R$ in this instance.
  3.  **Causal Powers:** The causal powers of $M$ are defined *exhaustively* by the powers of whatever fills $R$.
  4.  **Exclusion:** If $P$ fills $R$, then $P$ possesses the causal powers. $M$ is merely the property of *having a property that has those powers*.

  **The Critique:** Yablo treats $M$ and $P$ as if they are two properties on the same ontological footing (like Red and Scarlet) competing for causal credit. But if $M$ is a functional determinable, its causal powers are **borrowed**.
  *   Scarlet causes the peck *in virtue of* its reflectance properties.
  *   Red causes the peck *in virtue of* being a range of reflectance properties.
  *   Pain causes the withdrawal *in virtue of*... what? If physicalism is true, it must be *in virtue of* the physical properties of the realizer.

  If $M$'s causal powers are entirely derivative of $P$'s causal powers, then $M$ is not an independent cause. It is a **shadow**. Yablo's proportionality argument requires $M$ to be a *genuine* cause that is *better* than $P$. But if $M$ is just a functional abstraction over $P$, it cannot be "better" in an ontological sense; it can only be more *descriptively convenient*.

  **The Physicist's Analogy:** Consider "Temperature" ($T$) and "Mean Kinetic Energy" ($KE$).
  *   $T$ is multiply realizable (gas, solid, plasma).
  *   Does $T$ cause the pressure increase, or does $KE$?
  *   In a reductionist view, $T$ *just is* $KE$ (in a gas).
  *   In an NRP view, $T$ is a functional role realized by $KE$.
  *   If you say "$T$ caused the pressure, not $KE$, because $T$ is proportionate," you are ignoring that $T$ has no mechanism to act *except* through $KE$. The causal closure of the microdynamics ($KE$) excludes the macro-property ($T$) unless $T$ is identical to $KE$. Yablo wants to say $T$ causes it *without* being identical to $KE$. But if $T$ isn't $KE$, what pushes the piston?

  #### 4. The Counterfactual Dependence Failure
  Yablo relies heavily on counterfactuals. He argues:
  *   (CF1) If $P$ had not occurred, $M$ might still have occurred (via $P_2$), and $E$ would still have occurred. Therefore $P$ is not necessary.
  *   (CF2) If $M$ had not occurred, $E$ would not have occurred. Therefore $M$ is necessary.

  **The Pushback:** This counterfactual analysis fails under the **Causal Closure of the Physical**.
  To evaluate (CF2) ("If $M$ had not occurred..."), we must look at the nearest possible world where $M$ is absent.
  *   Since $M$ supervenes on $P$, for $M$ to be absent, the physical base must be different.
  *   If we remove $P_1$ (the actual realizer), do we remove $M$? Not necessarily, if $P_2$ could have been there instead.
  *   But causation is a **singular** relation between events, not types. The event $m$ (instance of pain) is constituted by event $p$ (instance of C-fiber firing).
  *   You cannot hold $p$ fixed and remove $m$, because $m$ supervenes on $p$.
  *   Therefore, the counterfactual "If $m$ had not occurred..." entails "If $p$ had not occurred..." (in this specific token instance).
  *   If $p$ had not occurred, by Causal Closure, $e$ (the physical effect) would not have occurred (or would have been caused by a different physical chain).

  Yablo tries to drive a wedge between the token mental event and the token physical event. But if Physicalism is true, the token mental event **is** the token physical event (under a description), or it is ontologically dependent on it to the point where they cannot be separated in counterfactual space. If they cannot be separated, they are rivals. If they are rivals, Exclusion applies.

  #### 5. The "Determinate" Mismatch
  Finally, there is a category error in Yablo's mapping.
  *   **Red/Scarlet:** This is a **Genus/Species** relation. Scarlet *is a kind of* Red. The extension of Scarlet is a subset of Red.
  *   **Mental/Physical:** This is a **Role/Filler** relation. C-fiber firing is *not a kind of* Pain. It *realizes* Pain.

  This distinction is fatal for Yablo's solution.
  In the Red/Scarlet case, the determinate (Scarlet) **entails** the determinable (Red) by definition.
  In the Mental/Physical case, the physical realizer ($P$) entails the mental property ($M$) only via **contingent laws of nature** (psychophysical bridge laws), not by conceptual entailment.

  Why does this matter?
  Because Yablo's solution relies on the idea that $P$ is "too specific" to be the cause. But $P$ is only "too specific" relative to $M$ if $M$ is a genuine abstraction that captures the *causally relevant features*.
  If $M$ is MR, the "causally relevant features" are **functional**, not physical.
  But if the domain of causation is **physical** (as per Causal Closure), then only physical features are causally relevant.
  Therefore, $M$ (being functional/non-physical) picks out features that are *not* the ones doing the causal work in the physical domain.
  $P$ is not "too specific"; $P$ is the **only thing specific enough** to interact with other physical properties.

  Yablo treats the mental property as if it were a "coarse-grained physical property." But if NRP is true, mental properties are *not* physical properties. If they are not physical properties, and the physical domain is causally closed, they cannot intervene in the physical chain, regardless of whether they are "proportionate." Proportionality is a constraint on *selection* among causes, not a license to introduce *new* causes into a closed system.

  ### Conclusion: The Dilemma

  We can now summarize the argument against Yablo as a dilemma for the Non-Reductive Physicalist:

  1.  **Horn 1: Mental properties are disjunctive physical kinds.**
      If $M$ is just the disjunction of its realizers ($P_1 \lor P_2 \lor ...$), then $M$ is not a unified determinable property (like Red). It is a gerrymandered list. Disjunctive properties do not have causal powers. **Result: Epiphenomenalism.**

  2.  **Horn 2: Mental properties are functional second-order properties.**
      If $M$ is a functional role, its causal powers are borrowed from its first-order realizers ($P$). $P$ does the work; $M$ is just the description of the work being done. $M$ and $P$ are not determinable/determinate; they are role/filler. The filler ($P$) excludes the role ($M$) because the role has no independent mechanism. **Result: Reductionism (or "Causal Exclusion" remains).**

  **The Verdict:** Yablo's determinable/determinate model works for properties within a single ontological domain (like colors, shapes, or perhaps effective field theories within physics). It fails for Mind/Body because the Mind/Body relation in NRP is not a logical specification relation (Scarlet $\to$ Red); it is a contingent realization relation (Neurons $\to$ Pain).

  Because the physical domain is causally closed, the "filler" (Physical) is sufficient for the effect. The "role" (Mental) adds no new causal oomph. Calling the Role a "determinable" is a linguistic sleight of hand that masks the fact that the Role is ontologically parasitic on the Filler. Your colleague was right: the Red/Scarlet analogy assumes a unity of substance that Multiple Realizability explicitly denies.

  Yablo saves the *truth* of mental causal statements (e.g., "Pain caused the withdrawal") by redefining causation as a counterfactual relation between properties. But he does not save the *ontology* of mental causation. He shows that mental properties can be *cited* as causes, but not that they can *be* causes in a physical world where the physical realizer is already sufficient. For a physicist, the distinction is clear: Yablo has provided a useful effective theory, but he has not shown that the effective theory has independent causal power from the fundamental theory. Kim's exclusion argument stands: if the fundamental theory is complete, the effective theory is causally inert unless it is identical to the fundamental theory.

  Yablo avoids Reductionism only by accepting a form of causal pluralism that many physicalists find untenable: the idea that a higher-level property can be causally efficacious *without* its efficacy being reducible to the efficacy of its physical base. But if the efficacy isn't reducible, where does the energy come from? If it is reducible, then the mental property is just the physical property described differently, and Non-Reductive Physicalism collapses into Reductive Physicalism.

  Yablo's proportionality is elegant, but it is a solution to a semantic problem, not a metaphysical one. Kim's exclusion is a metaphysical problem.
