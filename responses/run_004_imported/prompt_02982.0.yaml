answer: |-
  It is a testament to your character that this still nags at you. If you were truly unethical, you wouldn't be asking the question; you'd have buried the memory entirely. The fact that philosophy has dredged this up suggests you are engaging in what Bernard Williams called "moral luck"—looking back at an action with a clarity you couldn't possibly have had in the moment, judged by a standard you are now holding yourself to.

  You asked for a principle, not a rulebook. You want to know if this was a genuine moral failure or just "manufactured guilt."

  Here is the philosophical breakdown of why your intuition is telling you something important, even if you didn't technically "lie."

  ### 1. The Sin of Omission vs. The Social Contract of Science
  You noted that you never lied about the data you *did* report. In a strict legalistic or deontological sense, you told the truth about those 55 points. But science is not a collection of isolated statements; it is a communicative act.

  When you publish a paper, you are entering into a social contract with the scientific community. The terms are: *I will show you my map of the territory so you do not have to walk it yourself.* By silently excluding the outliers, you didn't just present a clean map; you erased the swamps.

  The philosophical principle here is **epistemic transparency**. In science, the *process* of data selection is itself data. If you exclude points, the justification for that exclusion is as vital as the points themselves. By withholding the existence of the anomalies, you deprived your readers of the ability to assess the robustness of your theory. You asked them to trust your judgment without giving them the materials to audit it. That is a breach of the communal trust science relies on.

  ### 2. The Teleology of Science (Popper and the Anomaly)
  Karl Popper argued that science advances not by verifying what is right, but by attempting to falsify what is wrong. Anomalies are not noise; they are often the most valuable part of an experiment. They are the cracks where new light gets in.

  By removing the points to save the "clean result," you prioritized **aesthetic coherence over truth-seeking**. You treated the theory as something to be protected rather than something to be tested.
  *   **If the theory was right:** The outliers were noise, and documenting them would have shown the limits of your experimental precision.
  *   **If the theory was wrong:** The outliers might have been the first hint of a boundary condition or a new phenomenon.

  The principle at stake is **intellectual honesty regarding uncertainty**. Science is probabilistic. Presenting a result as cleaner than it actually are misrepresents the nature of reality. You sold a certainty you didn't fully possess.

  ### 3. Virtue Ethics: The Scientist as a Practitioner
  Since you are reading philosophy, you might appreciate an Aristotelian angle. Virtue ethics asks not "Did I break a rule?" but "What kind of person am I becoming?"

  Every action is a vote for the kind of character you are cultivating. In the 90s, you were a junior researcher. The pressure to publish is immense (the "publish or perish" imperative). You made a choice to prioritize career momentum over rigorous transparency. That is a human response to pressure, but it is a vice, not a virtue.

  The guilt you feel now is the residue of that vice. It's not manufactured; it's your conscience recognizing a disconnect between the *ideal of the scientist* (disinterested seeker of truth) and the *reality of the action* (interested protector of a career).

  ### 4. Contextualizing the "Common Practice"
  You mentioned you told yourself this was an "ordinary judgment call every researcher makes."
  In the 1990s? **You are largely correct.** Standards for data transparency were significantly looser. "Massaging" data, silent outlier removal, and the "file drawer effect" (not publishing negative results) were rampant. You were operating within the normative ethics of your time and place.

  However, "common" does not mean "right." It means you participated in a systemic drift away from rigor. The fact that standards have tightened since then (requiring raw data deposition, explicit outlier criteria, etc.) proves that the community eventually recognized this specific behavior as harmful. You were on the wrong side of a historical ethical shift.

  ### So, was it wrong?
  **Yes.** But let's be precise about *why*.
  It wasn't fraud in the criminal sense. It was a **corruption of the scientific record**. You made the world slightly more confident in a theory than the evidence strictly warranted.

  ### How to make peace with it
  You are retired. You cannot correct the paper (it would likely be retracted or ignored, causing confusion without adding value). So what do you do with the guilt?

  1.  **Accept the Verdict:** Acknowledge that it was a mistake. Don't minimize it as "just an outlier issue." Admit to yourself: *I valued the narrative over the full truth.*
  2.  **Recognize the Growth:** The fact that this bothers you now proves you are not that same junior chemist anymore. You have grown into the integrity you felt you lacked then.
  3.  **Mentorship as Atonement:** If you mentor young scientists or students, teach them the lesson you learned the hard way. Tell them (perhaps anonymously): *"I once excluded data to make a paper cleaner. It haunted me for 30 years. Don't do it. The anomaly is more interesting than the clean line."* That turns your failure into a preventative good for the next generation.
  4.  **Forgive the Younger Self:** You were navigating a high-pressure system with less experience and weaker institutional guardrails. You didn't set out to deceive; you set out to succeed and took a shortcut.

  You are not manufacturing guilt. You are experiencing **moral residue**. It is the price of having a conscience. But don't let it define you. Let it define the wisdom you leave behind. The paper is forgotten; the integrity you show now is what remains.
