  10. (Final check of the prompt requirements): "two versions of basically the same scenario." Okay, I will ensure the base scenario is identical.

      *Base Scenario:* Violating a "No Personal Calls" policy at work.
      *   *Version 1 (Hypocrisy):* Manager takes personal calls constantly. Manager yells at Employee for one personal call. Manager did not encourage the call.
      *   *Version 2 (Complicity):* Manager never takes personal calls. Manager tells Employee to call their sick kid because "I need you focused, just do it quickly." Manager then yells at Employee for taking a personal call.

      This works perfectly. One is about *consistency*, the other is about *causality/authority*.

