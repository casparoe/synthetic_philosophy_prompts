  9.  **Final Polish:** Ensure the distinction between "violating the norm generally" vs. "causing the specific violation" is sharp. (Self-Correction: Make sure the Complicity example doesn't accidentally look like hypocrisy. The blamer must uphold the rule for themselves.)

      *Refining the Complicity Example:* If I tell you to steal, and I don't steal, am I a hypocrite? No, I'm an instigator. If I then blame you for stealing, I lack standing because I'm responsible for the act, not because I broke the rule myself. This is the crux.

      *Let's use the "Speeding" example.* It's universal.
      *   *Hypocrisy:* I speed all the time. You speed once. I pull you over (as a cop or passenger) and yell. I didn't make you speed.
      *   *Complicity:* I never speed. I am in the car with you. I say "Step on it, we're going to be late, I'll take responsibility." You speed. I then yell at you for speeding. I didn't speed (you drove), but I caused it.

