      *   **Why they overlap:** Often complicit people are also hypocrites (corrupt systems). But logically they are distinct.
      *   **Philosophical Backing:** Mention names like Bell, Fritz, or Wallace if appropriate (though keep it accessible). The concept is "Standing."
