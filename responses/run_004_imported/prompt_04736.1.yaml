answer: |-
  You have hit on a genuinely sophisticated distinction in moral philosophy that often gets glossed over in everyday arguments. You are absolutely right: **Hypocrisy** and **Complicity** are distinct mechanisms for losing the "standing to blame," even though they often travel together.

  In the literature (think philosophers like R. Jay Wallace, Macalester Bell, or Kyle Fritz), this is often discussed under the umbrella of "Standing." The core intuition is that to blame someone, you need a certain moral authority. You can lose that authority in different ways.

  Here is the breakdown of the difference, followed by the "minimal pair" of examples you asked for.

  ### The Conceptual Difference

  1.  **Hypocrisy (The Consistency Problem):**
      *   **The Claim:** "You violated Norm X."
      *   **The Defense:** "You violate Norm X all the time."
      *   **Why Standing is Lost:** It renders the blame **insincere**. It suggests you don't actually care about the norm itself; you just care about wielding power or making yourself look better. It attacks the *blamer's relationship to the rule*.
  2.  **Complicity (The Causality Problem):**
      *   **The Claim:** "You violated Norm X."
      *   **The Defense:** "You made me violate Norm X."
      *   **Why Standing is Lost:** It renders the blame **unfair**. It suggests the responsibility for the specific act is shared, so singling out the blamee is unjust. It attacks the *blamer's relationship to the specific act*.

  ### The Minimal Pair: "The Safety Protocol"

  To see how these work independently, let's use a workplace safety scenario.
  **The Norm:** "Everyone must wear safety goggles in the lab."
  **The Wrongdoing:** An employee (Alex) is caught not wearing goggles.
  **The Blamer:** The Lab Manager (Jordan).

  #### Version 1: Pure Hypocrisy (No Complicity)
  *   **The Setup:** Jordan strictly enforces the goggle rule for everyone else. However, Jordan *never* wears goggles themselves. They walk around the lab bare-eyed every day.
  *   **The Incident:** Alex forgets their goggles for five minutes while grabbing a beaker. Jordan did not tell Alex to take them off; Jordan did not distract Alex; Jordan provided all the necessary equipment.
  *   **The Blame:** Jordan screams at Alex for violating safety protocols.
  *   **Analysis:** Jordan has **no causal role** in Alex's mistake. Jordan's hands are clean regarding the *specific event*. However, Jordan lacks standing because they do not uphold the standard they are invoking. The complaint against Jordan is: *"Who are you to judge me when you don't follow this rule either?"*

  #### Version 2: Pure Complicity (No Hypocrisy)
  *   **The Setup:** Jordan is a stickler for the rules. Jordan *always* wears goggles. In fact, Jordan is known for being the most safety-conscious person in the building.
  *   **The Incident:** A crisis occurs. A machine is jamming. Jordan needs Alex to fix it immediately to prevent a costly shutdown. Jordan knows the goggles slow Alex down. Jordan explicitly says to Alex, **"Skip the goggles this one time, just fix it fast, I won't report it."** Alex trusts Jordan, skips the goggles, and is caught by a sensor.
  *   **The Blame:** Jordan screams at Alex for violating safety protocols.
  *   **Analysis:** Jordan is **not a hypocrite**. Jordan follows the rule religiously. Jordan genuinely believes in the norm. However, Jordan lacks standing because they *authorized* the violation. The complaint against Jordan is: *"You told me to do this. You share responsibility for this specific act."*

  ### Why This Distinction Matters for Your Argument

  If you use this with your friend, the key is to point out that the *remedy* for each situation is different.

  *   **If the problem is Hypocrisy:** The blamer can regain standing by **changing their own behavior**. If the Manager in Version 1 starts wearing goggles tomorrow, their standing to blame Alex is restored (retroactively, maybe not, but prospectively, yes).
  *   **If the problem is Complicity:** The blamer cannot regain standing by changing their behavior. The Manager in Version 2 could wear goggles for the next ten years, but they still lack the standing to blame Alex for *that specific incident* because they were an accomplice to it. They need to **acknowledge their shared responsibility**, not just follow the rules.

  ### Why They Get Mushed Together

  You noted that real-life examples usually have both. This is because **corrupt systems produce both.**

  If a Manager is willing to tell an employee to break the rules (Complicity), they usually don't respect the rules themselves (Hypocrisy). It is rare to find a "Principled Instigator" (Version 2 above) because usually, if you are willing to manipulate someone into breaking a rule, you view the rule as optional for yourself, too.

  However, logically, they are separate.
  *   **Hypocrisy** says: "The rule doesn't bind you, so it shouldn't bind me."
  *   **Complicity** says: "The rule binds us both, but you pulled my trigger."

  ### How to Deploy This

  When your friend tries to blame you, ask them to locate their standing.

  1.  **If they accuse you of hypocrisy:** Ask them, "Did you contribute to me doing this? Or are you just saying you've done it too?" If it's the latter, you can argue that their past behavior doesn't change the truth of your current wrong (even if it makes them annoying).
  2.  **If you want to challenge their standing:** Check for complicity. "Did you create the conditions where this was the only option? Did you encourage this?" If yes, they lose standing even if they are a saint in every other way.

  **The "Gotcha" Line:**
  > "You're conflating *consistency* with *causality*. You can be a hypocrite without causing my mistake, and you can cause my mistake without being a hypocrite. Which one are you? Because if you helped set this up, your perfect track record doesn't give you the right to blame me."

  This distinction shows you aren't just dodging blame; you're analyzing the *structure* of the blame itself. That usually shuts down a shouting match pretty quickly.
