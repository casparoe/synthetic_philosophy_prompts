answer: |-
  This is a classic philosophical deadlock because you and Theo are actually arguing past each other. You are arguing about **moral authority**, while Theo is arguing about **logical truth**.

  Theo is technically correct that pointing out hypocrisy is a *tu quoque* fallacy *if the goal is to prove the accusation false.* If a murderer accuses you of murder, it is still true that you committed murder. The accuser's guilt doesn't change the facts of your case.

  However, you are correct that morality isn't just a spreadsheet of facts; it is a social practice involving accountability, trust, and authority. In moral philosophy, this is known as the **Standing to Blame**.

  Here is the case for your position, structured to dismantle Theo's "distraction" argument and answer the "reformed hypocrite" question.

  ### 1. The Distinction: Truth vs. Standing
  To win this argument, you have to grant Theo his premise immediately. Do not fight him on whether the politician's jet usage was bad.

  **The Concession:** "Theo, you are right. If a hypocrite accuses me of theft, I am still a thief. The moral status of the *act* is independent of the *accuser*."

  **The Pivot:** "But blame is not just a statement of fact. It is a **speech act** that demands accountability. When I blame you, I am not just saying 'X happened.' I am saying 'I have the authority to demand you answer for X.'"

  **The Argument:** Hypocrisy voids the *authority*, not the *fact*.
  Think of it like a legal court. If a judge is currently robbing banks, the defendant is still guilty if *they* robbed a bank. But the judge has lost the *standing* to preside over the case. We would recuse them. Why? Not because the defendant is innocent, but because the *process* of justice requires the arbiter to be subject to the same laws they are enforcing.

  When a hypocrite blames someone, they are implicitly claiming a moral hierarchy: "I am up here judging you down there." Hypocrisy reveals that hierarchy to be a lie. They are not "up here"; they are in the mud with you. Therefore, their attempt to blame is an act of aggression, not justice.

  ### 2. Why This Isn't a "Distraction" (Countering Theo)
  Theo argues that focusing on the hypocrite is a way of "switching the subject." You need to explain why it is actually **keeping the subject on the integrity of the moral norm itself.**

  If we allow hypocrites to blame without consequence, we turn morality into a weapon rather than a shared commitment.
  *   **The Corruption of Norms:** If the person enforcing the rule openly violates it, the rule ceases to be a shared value and becomes a tool of power. It signals: "This rule is not for *us* (the powerful/accusers); it is for *you* (the accused)."
  *   **The Demand for Reciprocity:** Moral community relies on reciprocity. I submit to your blame because I know you submit to mine. If you exempt yourself, you break the social contract of accountability.
  *   **Why it matters:** Calling out hypocrisy isn't ignoring the bad act; it's protecting the *system of blame* from becoming tyranny. If we don't care about standing, the most ruthless people (who don't care about rules) get to control the moral narrative over the conscientious people (who try to follow rules).

  So, it is not a distraction. It is a check on moral authoritarianism.

  ### 3. The "Reformed Hypocrite" Problem (The Jet Scenario)
  This is the crux of your second question. Theo asks: *"So if the guy sold his jet last week he's suddenly allowed to complain about jets?"*

  Your intuition is likely that there is a difference between a current hypocrite and a reformed one, but "selling the jet" feels like a technicality. You need to pin down *why* it feels like a technicality.

  **The Key Distinction: Cessation vs. Repudiation**
  Losing standing isn't about the *action* alone; it's about the **attitude toward the norm.**

  *   **The Unrepentant Hypocrite:** This person says, "You shouldn't fly private (because it's bad), but I will (because I'm special/exempt)." They claim an exemption from the norm they are enforcing. This destroys standing immediately.
  *   **The "Sold the Jet" Hypocrite:** Merely selling the jet doesn't fix it. If they sell the jet because fuel prices went up, but still think flying private is fine for "important people," they still lack standing. They haven't accepted the moral norm; they just changed their logistics.
  *   **The Reformed Accuser:** Standing is restored only when they **repudiate their past behavior.** They must say, "I used to fly private. I was wrong to do so. I have stopped, and I acknowledge I violated the very norm I am now asking you to follow."

  **The Answer to Theo's Gotcha:**
  Tell Theo: "Selling the jet doesn't automatically restore standing. **Acknowledging that they shouldn't have been flying it in the first place restores standing.**"

  If the politician says, "I'm taking a commercial flight now, so listen to me about climate," they are still a hypocrite if they don't admit their past flights were wrong. They are just a hypocrite who is currently compliant.
  But if they say, "I have contributed to this problem in the past, I regret it, and I am trying to align my actions with my words," they regain standing. Why? Because they have re-entered the moral community as an equal. They are no longer claiming exemption; they are admitting fallibility.

  ### 4. What "Losing Standing" Actually Amounts To
  You asked to pin down what this actually *does*. It's vague to say "they lose standing." Here is the operational definition:

  **1. The Right to Resentment:**
  When a person with standing blames you, you owe them an apology or an explanation. When a person *without* standing (a hypocrite) blames you, you do not owe them apology. You owe them nothing but a correction of the record. You can rightfully say, "Fix your own house before you come to mine."

  **2. The Shift in Burden:**
  If a non-hypocrite blames you, the burden is on *you* to justify your action.
  If a hypocrite blames you, the burden shifts to *them* to explain why their accusation shouldn't be dismissed as projection.

  **3. The Social Sanction:**
  We are socially permitted to ignore, dismiss, or sanction the *blamer* without denying the truth of the *blame*. We can say: "The politician is right that private jets are bad for the climate. But we will not let *him* lead the charge on climate policy until he addresses his own record."

  ### Summary for Your Next Talk with Theo
  Here is how you can summarize this to him without getting bogged down:

  > "Theo, I agree with you that hypocrisy doesn't make the climate damage from a jet any less real. That's a fact. But blame isn't just stating facts; it's a demand for accountability.
  >
  > You only have the right to demand accountability from others if you submit to it yourself. A hypocrite claims an exemption from the rules they enforce. That turns morality into a weapon for the powerful.
  >
  > So, hypocrisy doesn't make the *act* okay, but it does strip the *accuser* of the authority to judge. And regarding your jet question: Selling the jet doesn't fix it. Admitting they were wrong to fly it in the first place fixes it. Until they do that, they aren't moral leaders; they're just criminals arresting other criminals."

  **The Verdict:**
  Theo wins on **Logic** (The act is still wrong).
  You win on **Ethics** (The accuser has no right to speak).

  In human relationships and politics, Ethics usually trumps Logic. We don't live in a truth-table; we live in a community of accountability. That is why hypocrisy matters.
