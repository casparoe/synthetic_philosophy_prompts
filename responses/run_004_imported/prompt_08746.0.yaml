answer: |-
  Here is the argument, committed and without hedging: **Expected Utility Theory (EUT) is mathematically ill-posed for any agent with an unbounded utility function.** The Pasadena Game is not a quirky edge case; it is a proof of concept for a structural failure inherent to unbounded utility. If you want to maintain that rational agents maximize expected utility, you must accept bounded utility as a necessary axiom, not a pragmatic patch.

  ### 1. The Mathematical Necessity of Absolute Convergence

  The core function of EUT is to map lotteries to real numbers (utilities) such that an agent can rank them. This requires the expectation operator $E[U] = \sum p_i u_i$ to yield a unique, well-defined real number.

  In standard measure-theoretic probability, the expectation of a random variable is well-defined if and only if the integral (or sum) is **absolutely convergent**. That is, $\sum |p_i u_i| < \infty$. If a sum is only *conditionally* convergent (like the alternating harmonic series in the Pasadena Game), its value depends on the order of summation.

  In the context of decision theory, "order of summation" corresponds to how the agent partitions or indexes the state space. There is no metaphysical privilege to indexing coin flips by natural numbers $1, 2, 3...$ versus any other bijection. If the value of a lottery changes based on how you describe or index the outcomes, the preference relation is not over the *lotteries themselves*, but over the *descriptions* of the lotteries. This violates the extensionality requirement of rational choice. An agent cannot maximize a value that does not exist independently of the calculation method.

  **The Thesis:** Any unbounded utility function allows for the construction of a Pasadena-style lottery.
  If utility $U$ is unbounded, there exists a sequence of outcomes with utilities $u_n$ such that $|u_n| \to \infty$. We can always construct a probability distribution $p_n$ (decaying sufficiently fast to sum to 1, but slowly enough relative to $u_n$) such that $\sum p_n u_n$ is conditionally convergent.

  You noted that risk aversion (concavity) doesn't solve this. You are correct. A function like $U(x) = \log(x)$ is strictly concave but unbounded. I can still construct a Pasadena game where the payoffs are denominated directly in *utils*, not dollars. If your utility function can return arbitrarily large numbers, I can find a probability distribution that makes the expected sum oscillate or diverge based on rearrangement.

  Therefore, **unbounded utility entails the existence of lotteries with undefined expected utility.** If EUT claims to be a complete decision rule, it fails for any agent with unbounded utility. Bounded utility, conversely, guarantees absolute convergence. If $|U| < M$, then $\sum |p_i u_i| < M \sum p_i = M$. The expectation is always robust, order-independent, and well-defined.

  ### 2. Generalizing Beyond Nover & Hájek

  It is tempting to treat the Pasadena Game as a specific counterexample involving the $2^n/n$ payoff structure. This misses the forest for the trees. The lesson of Pasadena is not about harmonic series; it is about the **tail behavior** of unbounded functions.

  Consider the "St. Petersburg Paradox." The standard solution is diminishing marginal utility of money. But as you noted, if we denominate in utility, St. Petersburg becomes a problem of infinite expectation ($\infty$). Pasadena is strictly worse than St. Petersburg. St. Petersburg gives you $+\infty$ (which some decision theories, like extended real numbers, can handle). Pasadena gives you *undefined*.

  For any unbounded utility function, I can construct a "Generalized Pasadena Game." I simply select a sequence of outcomes where the utility grows fast enough to outpace the probability decay in absolute magnitude, but I assign alternating signs (or partition the state space into positive and negative utility regions) such that the positive and negative components both diverge individually ($\sum p_i u_i^+ = \infty$ and $\sum p_i u_i^- = \infty$).

  When both the positive and negative parts of the expectation diverge, the total expectation is undefined ($\infty - \infty$). By tweaking the probabilities or the indexing, I can make the agent prefer Lottery A to Lottery B, or B to A, or be indifferent, without changing the underlying physical outcomes, merely by regrouping the terms.

  This vulnerability is universal for unbounded utility. It does not depend on the specific functional form. It depends only on the fact that the range of $U$ is not a compact set. If the range is unbounded, the tails can be made "heavy" enough to break the expectation operator.

  ### 3. Addressing the "Satiation" Objection

  The standard objection to bounded utility is the **Repugnant Conclusion of Satiation**: If utility is bounded by $M$, then there exists some outcome $X$ such that improving $X$ yields negligible utility gain. For example, an agent might be indifferent between saving $10^{100}$ lives and $10^{100} + 1$ lives, or even between saving $10^{100}$ lives and a slightly higher probability of saving $10^{100}$ lives. This violates the intuition that "more good is always better."

  I argue this objection prioritizes intuitive aesthetics over logical coherence. You have two choices:

  1.  **Accept Bounded Utility:** You admit that at the extreme margins, your preference discrimination becomes numerically negligible. You cannot distinguish between "infinite bliss" and "infinite bliss plus a cookie."
  2.  **Accept Unbounded Utility:** You admit that your decision procedure is mathematically incoherent. You cannot assign a value to the Pasadena Game. You are vulnerable to money pumps based on how outcomes are indexed. You are vulnerable to Pascal's Mugging because the ratio of Utility to Probability can always exceed any finite threshold.

  The cost of Option 1 is counter-intuitive preferences at scales no human (or AI) will ever practically encounter. The cost of Option 2 is a broken decision theory that fails to yield an action in principle.

  Furthermore, the "indifference" at the bound is not a bug; it is a feature of coherence. If you claim to care *non-negligibly* more about $10^{100} + 1$ lives than $10^{100}$ lives, you are implicitly claiming that the utility function has no upper bound. If it has no upper bound, I can construct a Pasadena lottery that renders your preferences undefined.

  **The Trade-off:** Is it worse to be indifferent between two astronomically good outcomes, or to have no consistent preference between a guaranteed moderate outcome and a Pasadena gamble? The latter is paralyzing. A rational agent must be able to act. If unbounded utility leads to undefined expectations, it leads to paralysis. Bounded utility ensures actionability.

  ### 4. Why This Supersedes Pascal's Mugging

  Pascal's Mugging is often dismissed as a problem of "improbably low priors." People argue that Solomonoff induction or complexity priors will assign such low probability to the mugger's claim that the expected value remains finite.

  The Pasadena Game bypasses this defense. The probabilities in the Pasadena Game are not infinitesimal; they are standard dyadic probabilities ($1/2, 1/4, 1/8...$). These are physically realizable (e.g., coin flips). The problem is not that the probabilities are too small; it is that the utility growth interacts with the probability decay to create conditional convergence.

  Therefore, you cannot solve Pasadena with better priors. You cannot solve it with risk aversion (concavity). You cannot solve it with causal decision theory (the causal structure is clear). The *only* variable left to constrain is the range of the utility function.

  ### Conclusion

  The Pasadena Game demonstrates that **unbounded utility is incompatible with the existence of a well-defined expectation operator.**

  If you claim to be an Expected Utility Maximizer, you are mathematically committed to bounded utility. To deny this is to claim that you maximize a quantity that, for a non-negligible set of possible lotteries, does not exist. The "satiation" at the upper bound is a small price to pay for the guarantee that your decision theory will actually output a decision.

  Boundedness is not a heuristic to avoid muggers. It is the boundary condition required to keep the mathematics of rationality from eating itself.
