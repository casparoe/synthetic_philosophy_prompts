answer: |-
  Here are nine questions designed to navigate around the introductory tautology objections and press the panelist on the deeper structural and historical tensions in the Popperian position. They are ordered to build momentum, starting with technical definitions and moving toward the broader implications of her stance.

  ### 1. The Propensity Interpretation
  "Let's grant for a moment that the classical 'survival of the survivors' definition is circular. Many philosophers of biology, following Mills and Beatty, argue that the **propensity interpretation of fitness** solves this by defining fitness as a probabilistic disposition to survive and reproduce, measurable *independently* of actual outcomes (e.g., via physiological traits or engineering models). If fitness is a testable propensity rather than a retrospective count, doesn't that render selection claims falsifiable in principle? If a high-propensity organism fails to reproduce due to chance, the theory predicts that *trend*, not the specific outcome."

  *   **Follow-up:** "If you reply that propensities are still unobservable theoretical constructs, I'd ask: How is that different from dispositional properties in physics, like fragility or charge, which Popper readily accepted as scientific?"

  ### 2. Popper's 1978 Recantation
  "In 1974, Popper famously called Darwinism a 'metaphysical research programme.' However, in his 1978 paper *'Natural Selection and the Emergence of Mind,'* he softened this, stating he had 'changed my mind about the testability and logical status of the theory of natural selection.' He conceded it *could* be formulated as a testable theory, though he worried it often wasn't. When you defend the 'metaphysical' label today, are you arguing that Popper's recantation was merely face-saving, or are you claiming that biologists still fail to meet the burden of testability he outlined in '78?"

  *   **Follow-up:** "If you say it's the latter (that biologists still fail the burden), can you point to a specific selectionist hypothesis that was genuinely rejected by data, rather than just modified?"

  ### 3. Evolutionary Epistemology
  "Popper's own evolutionary epistemology treats the growth of scientific knowledge as a selection process: conjectures are mutations, and refutations are the selective environment. If the logic of 'conjectures and refutations' in science is structurally isomorphic to 'variation and selection' in biology, how can the former be the paradigm of empirical science while the latter is metaphysical? If selection is the *mechanism* by which we identify truth in science, doesn't calling selection itself 'unfalsifiable' undermine the naturalistic basis of your own epistemology?"

  *   **Follow-up:** "If you argue this is just an analogy and not an identity, I'd press: Doesn't the utility of the analogy depend on the two processes sharing the same causal logic? If the biological logic is metaphysical, how does it ground an empirical epistemology?"

  ### 4. The Newtonian Analogy (Zero-Force Laws)
  "Philosophers like Elliott Sober have argued that natural selection functions like a 'zero-force law' in Newtonian physics. Just as we can detect a force by observing a deviation from inertia, can't we detect selection by observing deviations from Hardy-Weinberg equilibrium or neutral drift? If we can mathematically model the 'null hypothesis' of no selection, doesn't observing a significant deviation constitute a test of the selection hypothesis?"

  *   **Follow-up:** "A common dodge here is to say that we can't identify the *specific* force without knowing the initial conditions. But isn't that true of gravity too? We infer gravity from the motion, not independently of it. Why is biology held to a stricter standard than physics?"

  ### 5. Experimental Evolution
  "Consider long-term experimental evolution, like Richard Lenski's *E. coli* project. Researchers predicted the evolution of citrate metabolism based on selection pressures and population genetics models, and it occurred. This wasn't a post-hoc explanation; it was a novel prediction derived from selectionist principles. If a 'metaphysical research programme' cannot make risky predictions, how do you categorize this success? Is it just luck, or does it suggest the core theory is doing empirical work?"

  *   **Follow-up:** "If you categorize this as 'microevolution' and distinct from 'Darwinism' proper, where exactly do you draw the line where selection becomes testable? Is it a matter of timescale or taxonomy?"

  ### 6. The Lakatosian "Hard Core"
  "You describe selection as a 'research programme,' which sounds Lakatosian. In Lakatos's view, the 'hard core' of a programme is protected from refutation, but the 'protective belt' is testable. If we accept this, aren't you admitting that while the *universal principle* of selection might be irrefutable, the *specific applications* are empirical? If so, why insist on labeling the whole enterprise metaphysical rather than acknowledging it as a highly successful empirical theory with a robust core?"

  *   **Follow-up:** "If you insist the core *must* be testable to be scientific, does that not render Newton's Law of Inertia metaphysical as well, since it describes an ideal state never actually observed?"

  ### 7. Causal Specificity and "Screening Off"
  "One criticism of the Popperian view is that it treats selection as a global summary rather than a causal mechanism. But modern biology often 'screens off' variables to isolate specific selective pressures (e.g., controlling for drift, mutation, and migration to isolate predation pressure). If we can experimentally manipulate the environment and observe a corresponding change in allele frequency, haven't we established a causal link that is falsifiable? What exactly is missing from that chain to satisfy Popper's criterion?"

  *   **Follow-up:** "If you argue that we can't measure all environmental variables, aren't you demanding a level of closure that is impossible in any historical science, including geology or cosmology?"

  ### 8. The "Universal Darwinism" Trap
  "Many Popperians worry that if selection is testable, it becomes 'Universal Darwinism,' applied to everything from memes to molecules, diluting its meaning. But isn't the risk of over-extension a pragmatic problem, not a logical one? Just because a theory *can* be misapplied metaphysically doesn't mean the theory *itself* is metaphysical. Why let the potential for misuse by adaptationists dictate the logical status of the theory?"

  *   **Follow-up:** "If the problem is just 'bad biology' (pan-adaptationism), shouldn't we be criticizing the biologists rather than downgrading the logical status of the theory itself?"

  ### 9. The Relevance of Demarcation
  "Finally, a contextual question. Popper's demarcation criterion was designed in the 1930s to protect science from Marxism and Psychoanalysis, which he saw as unfalsifiable dogmas. In 2024, evolutionary biology is not struggling for legitimacy against dogma; it is the foundational framework of the life sciences. Does maintaining the 'metaphysical' label still serve a critical function, or does it now act as an obstacle to understanding how biology actually generates knowledge? What work is the label doing for you today?"

  *   **Follow-up:** "If you say it keeps biologists honest, I'd ask: Is there evidence that biologists who view selection as empirical are less rigorous than those who view it as a heuristic? It seems the practice of biology has advanced regardless of this philosophical distinction."
