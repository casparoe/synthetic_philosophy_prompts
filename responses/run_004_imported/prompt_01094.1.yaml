      *   *Check Carroll's actual position:* Carroll emphasizes "xerographic distribution" or self-locating uncertainty. He argues we should assign probability 1 to being an OO *conditional* on the theory being acceptable.
      *   *Refining the "Come Apart" case:* It's hard to make Page accept a BB theory. Page's point is precisely that $P(Data|BB)$ is tiny. To make them come apart, I need a case where $P(Data|BB)$ is *not* tiny, but the cognitive instability remains.
