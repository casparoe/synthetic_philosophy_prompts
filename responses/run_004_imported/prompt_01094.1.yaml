      *   **Section 1: The Core Disagreement (Empirical vs. Epistemic).**
          *   Page: It's about $P(Data|Theory)$. BB theories predict noise; we see order. Theory loses.
          *   Carroll: It's about the validity of the inference. If Theory implies "Inference is invalid," Theory is self-defeating.
