answer: |-
  This is a sophisticated observation that cuts to the heart of the methodological tensions within modern textualism. You have identified what some scholars call the "Manning Paradox": if public-choice theory undermines the premise of a coherent legislative purpose required for the absurdity doctrine, it should similarly undermine the premise of coherent legislative design required for structural and semantic canons.

  Below is an argument supporting your position: that a textualist who accepts Manning's public-choice critique of the absurdity doctrine but continues to rely robustly on *ejusdem generis*, *noscitur a sociis*, and the whole-act rule is maintaining an unstable methodological inconsistency.

  ### I. Manning's Core Premise: The Statute as Bargain, Not Purpose

  To understand why Manning's reasoning generalizes, we must first isolate the engine of his critique. In *The Absurdity Doctrine* (2003), Manning argues that the traditional absurdity doctrine relies on a "fiction of legislative intent." The doctrine asks judges to determine what results the legislature "could not have intended."

  Manning contends that under a public-choice understanding of legislation, this question is incoherent. Legislatures are not unitary actors with a single mind. Statutes are often the product of logrolling, path-dependent compromises, and strategic ambiguity. Different coalitions may support different provisions for different reasons. Therefore, there is no singular "legislative intent" regarding the *purpose* of the statute against which a result can be measured as "absurd." To apply the absurdity doctrine is to impose a judicially constructed coherence onto a process that was likely incoherent by design.

  ### II. Generalizing the Critique to Structural and Semantic Canons

  If we accept Manning's public-choice premise—that statutes are contingent bargains rather than expressions of coherent purpose—then the structural and semantic canons you list suffer from the exact same defect as the absurdity doctrine. They all rely on the assumption of a "rational drafter" acting with a unified design.

  **1. *Ejusdem Generis* and *Noscitur a Sociis***
  These canons operate on the assumption that a list of items shares a common "genus" or thematic thread. When your judge uses *ejusdem generis* to narrow a catch-all phrase ("or any other similar device"), he is assuming that the drafters compiled the list according to a coherent classificatory scheme.

  However, on the public-choice picture, statutory lists are often the result of lobbying and logrolling. Item A might be there because of Industry Group 1; Item B because of Industry Group 2; and the catch-all because of a compromise between the House and Senate. There may be no "common genus" other than "things we could get votes for." By applying *ejusdem generis*, the judge is effectively rewriting the bargain to make it more logically tidy than the political process allowed. He is imputing a coherent design to a process that likely produced a heterogeneous collection of mandates.

  **2. The Whole-Act Rule and Presumption of Consistent Usage**
  These canons presume that the statute is a unified whole, where terms used in one section illuminate terms in another, and where the legislature does not contradict itself. This presumes a level of coordination and oversight that public-choice theory suggests is rare.

  In reality, different subsections may be drafted by different committees, at different times, with different compromises. A term might be used broadly in Section 1 to satisfy one coalition and narrowly in Section 5 to satisfy another. To assume "consistent usage" is to assume a level of centralized drafting control that contradicts the decentralized, bargaining reality of the legislative process. If the absurdity doctrine is forbidden because we cannot assume the legislature intended a coherent *outcome*, the whole-act rule should be suspect because we cannot assume the legislature produced a coherent *text*.

  ### III. The "Linguistic Convention" Rejoinder and Its Failure

  Your co-clerk's defense is the standard textualist rebuttal: These canons are not inquiries into *intent*; they are rules of *language*. They reflect how reasonable speakers use words. *Ejusdem generis* is simply a description of how English works when a list is followed by a generalizer. Therefore, public-choice theory about legislative *purpose* is irrelevant; we are just interpreting the *words*.

  This argument is strong, but it fails to withstand Manning's specific public-choice critique for two reasons.

  **1. Statutes Are Not Ordinary Speech Acts**
  Linguistic conventions apply to speakers who are trying to communicate meaning efficiently to a listener. But as Manning and other public-choice theorists note, legislation is often strategic communication designed to *obscure* meaning or to *expand* the coalition by allowing contradictory interpretations.

  When a legislature drafts a statute, it is not a single "reasonable speaker." It is a multi-member body where ambiguity is often a feature, not a bug. To apply a linguistic canon like *ejusdem generis* is to treat the legislature as a normal speaker adhering to Gricean maxims of conversation. But if the legislature intentionally violated those maxims to secure a vote (e.g., by leaving the scope of "similar device" ambiguous so both sides could claim victory), applying the canon overrides the actual political deal. It privileges a judicial assumption of linguistic order over the political reality of strategic disorder.

  **2. Canons as Proxy for Intent**
  Despite the claim that canons are purely linguistic, in practice, they function as intent-surrogates. When a judge applies *ejusdem generis* to narrow a catch-all, the justification is rarely just "that's how English works." The underlying normative force is: "The legislature *would not have* listed these specific items unless they meant to constrain the general term."

  This is an inference about the drafter's mindset. It assumes the drafter *cared* about logical consistency and classification. If, as Manning argues, we cannot assume the legislature cared about logical consistency enough to avoid an "absurd" result, why can we assume they cared enough to adhere to the logical constraints of *ejusdem generis*? If the legislature is capable of passing "absurd" bargains because the pressure to pass *something* outweighs the pressure to be logical, they are equally capable of passing "illogical" lists for the same reason.

  ### IV. The Inconsistency Charge

  Here lies the inconsistency in your judge's methodology (and that of many "New Textualists"):

  1.  **Rejection of Legislative History:** The judge excludes the House committee report because it speaks to "drafters' aims." This is consistent with Manning's view that we cannot rely on unenacted intentions.
  2.  **Rejection of Absurdity:** The judge would likely limit the absurdity doctrine because, per Manning, we cannot know what the legislature "intended" to avoid.
  3.  **Acceptance of Structural Canons:** Yet, the judge uses *ejusdem generis* and the whole-act rule.

  If the reason for (1) and (2) is that the legislature is a "they" not an "it"—a fragmented body without a singular mind or coherent purpose—then (3) is unjustified. Structural canons impose a singular mind and coherent purpose onto the text. They assume the statute is a puzzle where every piece fits perfectly. Public-choice theory says the statute is a mosaic where the pieces might not match.

  By using the canons to fix the scope of the catch-all while ignoring the committee report that explains it, the judge is preferring a *judicially constructed fiction of coherence* (the canons) over the *historical reality of the bargain* (the report). Manning's logic suggests that if we are skeptical of intent-based inquiries because of the public-choice reality, we must be equally skeptical of canons that rely on that same reality to function.

  ### Conclusion

  Your co-clerk is right that textualists *describe* these canons as linguistic conventions. But you are right to sense that this description masks their operation. In practice, they are tools of normalization. They smooth over the jagged edges of political compromise.

  If Manning is correct that the public-choice reality of legislation deprives us of the "coherent purpose" needed to invoke the absurdity doctrine, that same reality deprives us of the "coherent design" needed to invoke *ejusdem generis* or the whole-act rule. To accept Manning's critique of the former while retaining the latter is to accept the public-choice diagnosis only when it limits judicial power (by killing the absurdity doctrine) but to ignore it when it expands judicial power (by allowing judges to narrow statutes via canons). A truly consistent textualist, following Manning's logic to its conclusion, would have to treat these structural canons not as binding rules of construction, but as weak presumptions that yield easily to evidence of the statutory bargain—even if that evidence comes from the very legislative history your judge has deemed inadmissible.
