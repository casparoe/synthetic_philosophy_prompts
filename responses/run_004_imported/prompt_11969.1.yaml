answer: |-
  **Setting:** *A quiet corner of the hotel lounge, post-conference. The hum of the ice machine is the only background noise. Elena (Naturalist) is nursing a sparkling water; Marcus (Normativist) is loosening his tie.*

  **Elena:** You looked ready to throw your coffee at the panelist who called menopause a "hormonal deficiency disorder."

  **Marcus:** Tempting. But it's the same logic they're applying to aging, Elena. If you call senescence a "treatable condition," you unlock the R&D funding. If you call it "life," you get palliative care.

  **Elena:** And if you call everything a disease, you break the concept of disease. I'm sticking with Boorse. The Biostatistical Theory is the only thing keeping medicine from becoming metaphysics.

  **Marcus:** Boorse is convenient, I'll give you that. But it's circular. You say health is "species-typical functional efficiency." Fine. But aging is the systematic loss of that efficiency.

  **Elena:** It's not a loss if it's part of the design. Boorse's key move is the *reference class*. You don't judge an 80-year-old's arterial elasticity against a 25-year-old's. You judge it against other 80-year-olds. If the average 80-year-old has stiff arteries, then stiff arteries are statistically normal for that class. Therefore, not a disease.

  **Marcus:** There it is. The reference class. That's where you're smuggling in the value judgment.

  **Elena:** How is selecting a demographic a value judgment? It's statistics.

  **Marcus:** Because *why* do we slice the reference class by age? Why not slice it by "optimal genetic potential"? When you decide that an 80-year-old *should* be compared to other 80-year-olds, you've already decided that decline is inevitable and acceptable. You're building the acceptance of death into the definition of health.

  **Elena:** I'm not building in acceptance; I'm acknowledging biological reality. Evolution selects for reproduction, not immortality. Antagonistic pleiotropy means genes that help us early on hurt us later. That's the species-typical design. If a process is universal to the species—like aging—it cannot, by definition, be a deviation from the species design. A universal feature isn't a bug.

  **Marcus:** But "universal" doesn't mean "good." Blindness was universal before cataract surgery. Was it not a disease then?

  **Elena:** Cataracts are a pathology *within* an age class. If 10% of 80-year-olds have clear lenses and 90% have cataracts, the cataracts are a deviation. But if 90% of 80-year-olds have arterial stiffness, that's the baseline function for that stage of life. Boorse protects us from pathologizing normal development. Puberty isn't a disease, even though it disrupts homeostasis. Menopause isn't a disease. Aging isn't a disease. They're phases.

  **Marcus:** But that assumes the phase itself isn't the problem. Look at the value judgment on the other side. We value survival. We value the absence of pain. Aging systematically undermines both. When a physician says, "It's not disease, it's just age," they are making a normative claim that *this level of suffering is acceptable.*

  **Elena:** They're making a triage claim. If aging is a disease, then *everyone* is sick from birth. We are all infected with a terminal condition called "time." That dilutes the concept of disease so much it becomes useless for insurance, for triage, for prioritizing acute suffering over chronic decline.

  **Marcus:** Or, it reframes the priority. If aging is the root cause of the cancer, the heart failure, the neurodegeneration... then treating aging is the most efficient way to reduce acute suffering. Your reference class creates a self-fulfilling prophecy. You compare the 80-year-old to the 80-year-old norm, you find they are "healthy," and you stop researching how to make their arteries look like the 25-year-old's.

  **Elena:** Because making an 80-year-old's arteries look like a 25-year-old's might require rewriting the human genome. That's not medicine; that's enhancement. Boorse draws a line between *restoring* normal function and *exceeding* it.

  **Marcus:** "Normal" is the contested term! Who decided that "normal" for an 80-year-old includes frailty? Is that a biological fact, or is it a cultural surrender? The Normativist view says you can't separate the biology from the goal. If the goal of medicine is to alleviate suffering, and aging causes suffering, then aging falls under the medical mandate. The reference class should be "healthy human," not "healthy 80-year-old."

  **Elena:** But there is no "healthy human" in the abstract. There are only humans in time. If you judge an 80-year-old against a 25-year-old standard, you classify the entire elderly population as diseased. That's not liberation, Marcus. That's ageism disguised as optimism. It says their current state is inherently wrong.

  **Marcus:** It says their current state is *modifiable*. Look, I'm not saying Boorse is stupid. I know why you need the reference class. Without it, you can't distinguish a broken leg from a growing pain. But aging is unique. It's a universal pathology. It's the one "design feature" that destroys all other functions.

  **Elena:** It's not a pathology if it's the consequence of the system working as intended. The car rusts. Not because the car is diseased, but because it's made of metal and exposed to oxygen. You can coat it in gold, sure. But don't tell me the rust was a manufacturing defect.

  **Marcus:** Unless you're in the business of selling gold plating. And if the rust kills the driver, maybe it *was* a defect. The moment we have the technology to slow the rust, calling it "natural" becomes a moral choice, not a biological one. Your reference class freezes the status quo.

  **Elena:** And your definition dissolves the boundary between therapy and enhancement. If aging is a disease, then death is the ultimate symptom. And if death is a symptom, medicine has failed every time a patient dies. That makes every death a medical failure.

  **Marcus:** *(Pauses, swirling his drink)* Okay. That's the reductio ad absurdum I expect. But isn't it better to aim for the ideal and miss, than to codify the decline as "health" and stop aiming?

  **Elena:** It's better to have a definition that allows us to agree on what we're fighting. I can fight heart disease within the 80-year-old class. You want to fight the class itself.

  **Marcus:** Because the class is the enemy.

  **Elena:** Then we aren't arguing about biology anymore. We're arguing about whether we want to be human, or something else.

  **Marcus:** *(Smiles faintly)* And there's the value judgment you claimed wasn't there.

  **Elena:** *(Sighs)* Touché. Another round?

  **Marcus:** Please. Before my reference class gets too tired to function.
