answer: |-
  You are right to be skeptical that this is merely "mathematical theater." The Pasadena Paradox (PP) is often presented with a flourish about the Riemann rearrangement theorem that obscures the actual decision-theoretic injury. The math is the mechanism, but the wound is to the structural integrity of Expected Value (EV) theory itself.

  Here is the intuition on why "undefined" is a deeper crisis than "infinite," and why appealing to the "natural order" fails to save the theory.

  ### 1. Why "Undefined" is worse than "Infinite"

  The St. Petersburg Paradox (SPP) breaks the *application* of EV theory to the real world; the Pasadena Paradox breaks the *arithmetic* of EV theory.

  **The Comparability Problem**
  In SPP, the expected value is $+\infty$. While no human has infinite money, $+\infty$ is still a value within the extended real number line. It allows for ranking. If I offer you Game A (Standard St. Petersburg) and Game B (St. Petersburg where the payout is $3^n$ instead of $2^n$), EV theory can tell you that Game B is better than Game A (or at least, that both are infinitely valuable, which allows for tie-breaking rules or dominance arguments). It gives a verdict, even if that verdict is "pay everything."

  In PP, the expected value is not a number in the extended reals; it is *undefined*. This creates a problem of **incomparability**. If I offer you two different Pasadena-style games, EV theory cannot rank them. It cannot tell you if they are equal, or if one is better. It simply falls silent. A decision theory that renders distinct options incomparable is paralyzed. "Infinite" is an extreme recommendation; "Undefined" is a refusal to recommend anything at all.

  **The Dominance Violation**
  This is the strongest technical argument. Consider the "Altadena" game, a variant proposed alongside Pasadena. The Altadena game pays exactly $1$ unit more than the Pasadena game in every single possible outcome (for every $n$, Payout$_{Altadena}(n) = \text{Payout}_{Pasadena}(n) + 1$).

  By the **Principle of Weak Dominance**, a rational agent must prefer the Altadena game to the Pasadena game, because it pays strictly more in every state of the world.
  *   In SPP, if Game A dominates Game B, and both are infinite, we can usually appeal to the limit of partial sums or stochastic dominance to preserve the intuition that A $\ge$ B.
  *   In PP, since the EV of Pasadena is undefined and the EV of Altadena is undefined (it's the same conditionally convergent series shifted by a divergent harmonic series), standard EV theory has no machinery to assert that Altadena > Pasadena. The arithmetic of expectation ($E[A] - E[B] = E[A-B]$) fails because you cannot subtract undefined from undefined.

  So, PP shows that EV theory can fail to recognize that *more money is better than less money* when the sums are conditionally convergent. That is a much deeper indictment than saying "people won't pay millions for a lottery ticket."

  **The Fragility of the Value**
  With SPP, the value is robustly infinite. If you change the probability slightly, or group the outcomes differently, it stays infinite. With PP, the "value" is fragile. It depends entirely on the grouping of terms. This means the value is not a property of the *gamble*, but a property of the *description* of the gamble. If a decision theory assigns value based on how you write down the math rather than the physical stakes, it has lost its claim to objectivity.

  ### 2. Why we cannot privilege the "Natural Ordering"

  Your second intuition is the most common reaction: "The coin flips happen in time ($n=1, 2, 3...$). Why not just define the expectation as the limit of the partial sums in that order?"

  The problem is that this smuggles in an assumption that violates the foundational logic of probability spaces.

  **Outcomes vs. Processes**
  In decision theory, a gamble is defined over a **sample space of outcomes**, not a temporal process of calculation. When you buy the ticket, you are buying a claim on a random variable $X$. The variable $X$ maps states of the world ($\omega$) to payoffs.
  The state of the world is "Heads first appeared on toss $n$."
  Crucially, **you do not experience the sequence of tails.** You do not wait through toss 1, then toss 2, then toss 3. You wait for the game to conclude, and then you are told "$n=17$."

  Because the player experiences the *result* ($n$) rather than the *process* (the sequence of flips), the index $n$ is merely a label for the outcome. In measure-theoretic probability, the expectation is an integral over a measure space. Integrals are defined to be independent of the enumeration of the points (provided the integral is absolutely convergent).

  If you insist on summing in the order $n=1, 2, 3...$, you are asserting that the *label* of the outcome determines its contribution to the value. But labels are arbitrary.

  **Description Invariance**
  Suppose I describe the same game to you differently. Instead of indexing by "toss number $n$," I index the outcomes by a different bijection from the natural numbers.
  *   **Description A:** Outcomes are ordered by toss number $1, 2, 3, 4, 5, 6...$
      *   Series: $1 - 1/2 + 1/3 - 1/4 + 1/5 - 1/6...$ (Converges to $\ln 2$)
  *   **Description B:** I group the outcomes as "One positive term, two negative terms." I relabel the sample space so the first outcome is $n=1$, the second is $n=2$, the third is $n=4$, the fourth is $n=3$... essentially reordering the sample space indices to match the rearrangement $1 - 1/2 - 1/4 + 1/3 - 1/6 - 1/8...$
      *   Series: Converges to $\frac{1}{2} \ln 2$.

  Physically, these are the **exact same gamble**. The coin, the payouts, and the probabilities are identical. The only difference is the order in which I wrote the terms on the chalkboard.
  If you privilege the "natural" ordering of Description A, you are saying that the value of the gamble depends on how the mathematician chooses to index the sample space. This violates **Description Invariance**: rational value should not depend on the arbitrary labeling of states.

  **The "Time" Illusion**
  The "temporal order" argument only works if the agent receives the payouts sequentially *during* the flipping process. But in the Pasadena setup, the payout is contingent on the *first* heads. The payout is received once, at the end. The "time" of the flips is epistemic (when we discover the result), not ontological (when the value is accrued). Since the value accrues only at the end, there is no temporal justification for summing in index order.

  ### Summary Intuition

  The St. Petersburg Paradox tells us that **linear utility of money** is unrealistic. We solve it by saying utility is bounded or logarithmic.

  The Pasadena Paradox tells us that **linear expectation itself** is unstable. Even if you fix the utility function, if the probabilities and payouts create a conditionally convergent series, the expectation operator ceases to be a well-defined function from gambles to real numbers. It becomes a function from *descriptions of gambles* to real numbers.

  For a decision theorist, "Infinite EV" is a bug in the model of human value. "Undefined EV" is a bug in the logic of rational choice itself. The latter suggests that Expected Value Maximization is not just practically limited, but mathematically incoherent for a wide class of well-defined problems, forcing us to look for non-linear aggregation rules or to reject the idea that all gambles are comparable.
