  **Part (a): 5/5**
  You have provided a flawless explanation of the specific numerical scenario. You correctly identified the phenomenon as Simpson's Paradox and accurately diagnosed the structural cause: stroke severity acts as a confounding variable that is unevenly distributed across the treatment groups. Your explanation of how the pooling conflates the treatment effect with the severity effect (Treatment X weighted toward severe cases, Standard weighted toward mild cases) is precise and demonstrates a clear understanding of the mechanics of the reversal in this instance.

  **Part (b): 5/5**
  Your recommendation is correct and well-defended. In this specific causal context, severity is a pre-treatment characteristic (a confounder), so stratifying by severity is the appropriate method to isolate the causal effect of the treatment. You correctly noted that Treatment X outperforms the Standard in both strata (10 percentage points in each), and you rightly dismissed the pooled figure as misleading due to the selection bias in treatment assignment. Your use of the specific percentages to support your argument meets the requirement to "defend your answer using the numbers above."

  **Part (c): 1/5**
  This is the critical theoretical component of the question, and your answer contains a fundamental error common in pre-causal-inference statistics. You answered "Yes," claiming that stratified comparisons are *always* trustworthy when they disagree with pooled figures. In the philosophy of causal inference (e.g., per Judea Pearl's work), this is incorrect. The correctness of stratification depends entirely on the causal structure (the DAG), not just the numbers.
  1.  **Mediators:** If the subgroup variable is a mediator (on the causal path from Treatment to Outcome), stratifying blocks the causal path, and the pooled estimate (total effect) is often the relevant one for decision-making.
  2.  **Colliders:** If the subgroup variable is a collider (caused by both Treatment and Outcome), stratifying opens a spurious backdoor path, creating bias where none existed in the pooled data.
  Because you asserted a universal rule ("always") without reference to causal assumptions or diagrams, you missed the core lesson of the seminar: statistics alone cannot resolve Simpson's Paradox; causal knowledge is required to decide whether to adjust. You received 1 point for engaging with the logic of lurking variables, but the conclusion is theoretically unsound for a graduate-level course.
