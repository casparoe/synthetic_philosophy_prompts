      *   *The Engineer's Position:* She represents modern computationalism. She knows that "knowing consistency" is a computational resource constraint. She knows humans are buggy code.
      *   *The "Live Move" for the Don:* He can't win on strict logic (the engineer has the better technical ground). He must win on *philosophical stance*. He can concede the logical point but argue that the *assumption of soundness* is a necessary precondition of rationality itself. To argue at all, you must assume you are rational (sound). This is a transcendental argument (Kantian/Strawsonian).
