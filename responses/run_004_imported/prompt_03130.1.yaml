      *   *The Dialectic:* The Lucasian says "I see $G(F)$ is true." The Critic says "Only if you know $F$ is consistent. How do you know that?" If the Lucasian says "I just see it," they are claiming an infallibility about consistency that $G2$ suggests is impossible for any formal system (including potentially the mind).

