      *   *The Core:* Gödel's First Incompleteness Theorem ($G1$). For any consistent formal system $F$ capable of arithmetic, there is a sentence $G(F)$ that says "I am not provable in $F$".
      *   *The Logic:*
          1.  If $F$ is consistent, $G(F)$ is true (because it says it's unprovable, and if it were provable, $F$ would be inconsistent).
          2.  $F$ cannot prove $G(F)$.
          3.  Humans can *see* that $G(F)$ is true.
          4.  Therefore, humans can do something $F$ cannot do.
          5.  Therefore, the human mind is not equivalent to $F$.
