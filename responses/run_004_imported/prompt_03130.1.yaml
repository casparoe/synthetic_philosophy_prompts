      *   *The Shift:* Penrose realized the consistency objection was strong. He shifted from "Consistency" to "Soundness".
      *   *Soundness:* A system is sound if everything it proves is *true*. (Stronger than consistency; a system can be consistent but prove false things if it has false axioms. Soundness implies consistency.)
      *   *The Argument:*
          1.  Assume for reductio that my reasoning is encapsulated by a knowably sound formal system $F$.
          2.  If I know $F$ is sound, I know $F$ is consistent.
