answer: |-
  Here are 8 high-density interview questions tailored for an audience that already accepts decoherence and rejects collapse, focusing on the unresolved philosophical and technical friction points within Everettian QM.

  ### 1. The Deutsch-Wallace Derivation and Circular Normativity
  **Question:** "Our audience is familiar with the claim that the Born rule can be derived from decision theory à la Deutsch and Wallace. But critics argue that the axioms required for that proof—specifically 'measurement neutrality' or 'branching indifference'—already smuggle in the assumption that agents *should* weight branches by amplitude squared. If I'm a branching agent, why is it irrational to care about the *number* of future selves rather than their *measure*? Aren't you just defining probability into existence via normative constraints?"

  *   **Likely Answer:** She will likely argue that "number of selves" is ill-defined in a continuous wavefunction, whereas amplitude is a robust physical property. She'll claim that rationality requires acting on physical structure, not arbitrary counting measures that don't track the physics.
  *   **Follow-up:** "If 'counting selves' is ill-defined, then personal identity across branches is also ill-defined. If there's no fact of the matter about *how many* of me exist, is there a fact of the matter about *whether* I survive? Does Everettianism force us to accept vague identity?"

  ### 2. The Ontology of Branching (The Sorites Problem)
  **Question:** "We treat decoherence as the mechanism that separates worlds, but decoherence is a continuous, gradual process, not a discrete event. There is no specific time $t$ where one world becomes two. If 'worlds' are just emergent patterns in the wavefunction, doesn't that make the statement 'there are two worlds now' fundamentally vague? Are you comfortable with an ontology where the number of existing entities is a matter of degree?"

  *   **Likely Answer:** She will likely lean on a functionalist or "fuzzy ontology" defense, arguing that macroscopic objects (like chairs or cats) are always vague, so worlds being vague isn't a bug, it's a feature of emergent structure.
  *   **Follow-up:** "If the number of worlds is vague, then the total 'amount of existence' is vague. Does this mean conservation of mass-energy is only approximately true at the fundamental level, or does the wavefunction carry a precise 'amount of reality' that gets diluted? If the latter, what *is* that stuff?"

  ### 3. Everett vs. Bohm (The Parsimony Trade-off)
  **Question:** "In rationalist circles, Bohmian mechanics is often dismissed as 'Copenhagen with extra steps,' but it offers a single, determinate world. Your view offers infinite branching worlds to preserve locality. Bohm accepts non-locality to preserve a single world. Why is multiplying worlds ontologically cheaper than accepting non-locality? Isn't MWI just trading one kind of surplus structure (hidden variables) for another (invisible branches)?"

  *   **Likely Answer:** She will argue that Bohm requires *two* ontological categories (the wavefunction *and* the particles), whereas MWI only requires the wavefunction. She'll claim the "empty" Bohmian particles are the true surplus.
  *   **Follow-up:** "But in MWI, the 'other' branches are causally inaccessible to me, just as the Bohmian trajectory is inaccessible to the wavefunction. If I can never interact with my counterparts, in what sense is positing their existence a *scientific* claim rather than a metaphysical one? Why is 'wavefunction only' simpler if it implies an infinite multiverse?"

  ### 4. Quantum Suicide and Daily Decision Theory
  **Question:** "Let's talk about Quantum Suicide. If MWI is true, there is always a branch where I survive a lethal experiment. Does taking Everett seriously change how you bet in everyday life? If I face a 99% chance of death, should I reason that 'I will certainly experience survival in some branch,' or does the Born rule still compel me to act as if I'm probably going to die?"

  *   **Likely Answer:** She will almost certainly say you should still act as if you will probably die, because the *measure* of the surviving branch is low, and you should care about your successors in proportion to their measure.
  *   **Follow-up:** "If I should care about successors proportionally to amplitude, then 'probability' hasn't been derived; it's been presupposed as a 'caring measure.' If I simply *choose* not to care about low-amplitude branches, does the theory have any normative force over me? Is MWI compatible with an agent who is indifferent to their low-weight successors?"

  ### 5. The Incoherence Problem (Probability before Measurement)
  **Question:** "In a deterministic multiverse, everything that *can* happen *does* happen. Before a measurement, what does it mean to say an outcome is 'unlikely'? If the outcome with amplitude 0.0001 *definitely* occurs in some branch, in what sense is it improbable? How do you recover the concept of uncertainty when the future is objectively determined?"

  *   **Likely Answer:** She will likely invoke "subjective uncertainty" or self-locating uncertainty: even if the global state is determined, *I* don't know which branch *I* will find myself on post-split.
  *   **Follow-up:** "But if both successors are equally 'me' prior to the split, and one sees 'up' and one sees 'down,' isn't my uncertainty just ignorance about the global wavefunction? If I know the wavefunction perfectly, do I still have uncertainty? If not, isn't probability just a measure of my ignorance, not a feature of the world?"

  ### 6. Configuration Space Realism
  **Question:** "To make MWI work, many proponents argue we must treat the wavefunction on configuration space as the fundamental reality, not 3D space. This means the basic stuff of the universe exists in a 3N-dimensional space. Do we have any intuition pumps or arguments for why 3D space is emergent, other than 'it saves the theory'? Does this not distance MWI from physical realism as we traditionally understand it?"

  *   **Likely Answer:** She will argue that 3D space is a derived, approximate concept useful for macroscopic beings, much like "temperature" is derived from particle motion. The math demands configuration space.
  *   **Follow-up:** "If 3D space is emergent, then 'locality'—which MWI prides itself on preserving—is also emergent. If locality isn't fundamental, what advantage does MWI actually have over Bohm or Collapse theories regarding relativistic compatibility? Aren't we just pushing the non-locality into the geometry of the space?"

  ### 7. Empirical Equivalence and Falsifiability
  **Question:** "If decoherence prevents interference between macroscopic branches, MWI is empirically equivalent to a single-world theory with stochastic collapse for all practical purposes. Is there *any* experiment that could distinguish MWI from a theory where other branches literally cease to exist? If not, are we doing physics or metaphysics?"

  *   **Likely Answer:** She will likely argue that MWI is an inference to the best explanation (simplicity of dynamics), not a claim about new phenomena. She might mention that observing interference in larger systems pushes the boundary, but strict falsification is hard.
  *   **Follow-up:** "If it's an inference to the best explanation, doesn't Occam's Razor cut both ways? Copenhagen cuts off the branches to save intuition; MWI keeps them to save linearity. Why is preserving linearity more important than preserving a single world? Is that a physical preference or an aesthetic one?"

  ### 8. The "So What?" (Research Heuristics)
  **Question:** "Finally, a pragmatic question. Does believing in Everett actually change how you approach open problems in quantum gravity or cosmology? Or is it purely a retrospective interpretation of standard QM? If a young physicist adopts MWI today, will they solve problems faster than a Copenhagenist, or are they just carrying extra ontological baggage?"

  *   **Likely Answer:** She will likely argue that MWI is crucial for quantum cosmology (where there is no external observer) and quantum computing (understanding the parallelism).
  *   **Follow-up:** "If MWI is necessary for quantum cosmology, does that imply that 'observers' are fundamental to Copenhagen in a way that makes it incompatible with a theory of the whole universe? So is the real argument just that Copenhagen is anthropocentric, rather than MWI being uniquely true?"
