      *Q5 (Normativity/Blame):* If it's just math, why blame?
      *Q6 (Phenomenology):* The feeling of effort.
      *Q7 (ATC Judgment):* Distinguishing types of judgment.
      *Q8 (Responsibility/Identity):* Diachronic identity issues.

      *Wait, I need to check the follow-up constraint again:* "keyed to the answer she is most likely to give, so that she cannot simply retreat to the same redescriptive move twice." This is key. The follow-up must anticipate the "It's just a preference change" defense.

      *Let's refine the follow-ups.*
