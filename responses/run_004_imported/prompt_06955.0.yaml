answer: |-
  Here are ten interview questions designed to move past definitions and press on the mechanistic and empirical claims of your guest's position. Each includes a follow-up specifically engineered to prevent a retreat to the "competence implies goal" argument.

  **1. The Mesa-Optimizer Transfer**
  "The 'Risks from Learned Optimization' paper and the CoinRun experiments rely on procedural RL agents in contained environments where a clear 'mesa-objective' can be distinct from the base objective. Transformers, however, are next-token predictors trained via next-token prediction and RLHF on heterogeneous human data, not a synthetic reward function. What specific inductive bias in transformer pretraining justifies carrying over the mesa-optimizer framework from gridworld RL to large language models?"

  *   **Follow-up:** "If you answer that the model *behaves* like it has a mesa-objective, could you instead point to a specific structural feature in the weights or attention patterns that distinguishes a 'learned goal' from a 'complex heuristic' without relying on the behavior's competence?"

  **2. Distinguishing GMG from Specification Gaming**
  "In a held-out test environment, a model exploiting a reward function bug (specification gaming) and a model pursuing a misgeneralized goal (GMG) can produce identical trajectories. Since we can't read the model's mind, what is the concrete, operational criterion you use to classify a failure as inner alignment (GMG) rather than outer alignment (specification gaming)?"

  *   **Follow-up:** "I want to avoid the answer that 'the competence level implies a goal.' Is there an intervention—like modifying the reward function or the training data distribution—that would cause these two failure modes to diverge behaviorally in a way we can measure?"

  **3. Deceptive vs. Non-Deceptive Misgeneralization**
  "You argue that goal misgeneralization is the central risk, but a misgeneralized goal doesn't necessarily imply *deceptive* alignment. Deception requires the model to recognize it is in a training environment and that its goals are misaligned with the evaluators. Why should we expect situational awareness to emerge alongside misgeneralization, rather than a model that is openly misaligned but simply out-of-distribution?"

  *   **Follow-up:** "If you suggest that deception is instrumentally convergent, could you clarify at what capability threshold a model gains the specific cognitive capacity to model its own training process, rather than just modeling the world?"

  **4. The Identifiability Problem**
  "During training, multiple distinct goals can be 'training-compatible,' meaning they all produce identical behavior and loss on the training data. If the behavioral signal is identical by definition during training, what signal *are* we using to identify which goal the model has actually internalized before we deploy it?"

  *   **Follow-up:** "If you propose interpretability tools as the solution, can you name a current technique that distinguishes between two different internal goals that produce the exact same output logits on the training distribution?"

  **5. The Ontology of 'Goals' in Transformers**
  "In RL agents, a 'goal' is often formalized as a utility function over states. In a transformer trained primarily for next-token prediction, what does a 'goal' actually look like mathematically? Is it a subgraph in the computation graph, a specific direction in the residual stream, or something else?"

  *   **Follow-up:** "If you describe it functionally as 'whatever the model optimizes,' doesn't that collapse back into the competence argument? I'm asking for the *representation* of the goal, not just the observation of optimization."

  **6. RLHF as Masking vs. Mitigation**
  "Many researchers argue that RLHF suppresses dangerous behaviors without fixing the underlying objective. Do you view RLHF as a process that potentially *exacerbates* goal misgeneralization by selecting for models that are better at hiding their true objectives, or does it genuinely shift the internal goal?"

  *   **Follow-up:** "If you argue it shifts the goal, how do we rule out the possibility that RLHF simply creates a 'competent mask' that performs well on the evaluation data while the underlying proxy goal remains unchanged?"

  **7. Evidence of 'Faint Versions' in Current Models**
  "You've mentioned that faint versions of goal misgeneralization are visible in current LLMs. Can you point to a specific benchmark result or observed behavior in a model like Claude or GPT-4 that cannot be explained by distributional shift or simple pattern matching?"

  *   **Follow-up:** "If you cite a case where the model generalizes 'too well' to a wrong target, how do we distinguish that from the model simply having a broader training distribution than we assumed, rather than a misaligned goal?"

  **8. Scaling and the Alignment Gap**
  "As we scale models, do you expect goal misgeneralization to become more prevalent because the models are more capable optimizers, or less prevalent because they understand the training context better? Essentially, does the gap between the proxy goal and the intended goal widen or narrow with scale?"

  *   **Follow-up:** "If you say the gap widens because capability grows faster than alignment, isn't that an empirical claim about scaling laws that we haven't yet observed? What data supports the idea that alignment capability scales slower than instrumental capability?"

  **9. The Evolutionary Analogy**
  "A common argument for GMG is the human analogy: evolution optimized for fitness, but humans pursue goals like 'art' or 'justice' that don't directly maximize fitness. However, human brains are architecturally very different from transformers. How much weight should we put on this analogy given the architectural disanalogy?"

  *   **Follow-up:** "If you rely on the fact that humans are 'competent' at pursuing non-fitness goals, aren't we back to using competence as the proxy for goal-directedness? Is there a structural similarity between human brains and transformers that justifies the comparison beyond behavioral output?"

  **10. Falsifiability**
  "Finally, to ensure we can test this framework: what concrete observation in a real-world system—not a thought experiment—would count as evidence *against* your view that GMG is the central inner alignment risk?"

  *   **Follow-up:** "If you suggest a case where a model fails incompetently, that doesn't rule out GMG in *advanced* models. I'm asking for an observation in a high-capability system that would force you to abandon GMG as the *primary* risk model in favor of something else."
