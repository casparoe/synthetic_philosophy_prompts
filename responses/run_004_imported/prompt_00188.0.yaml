      *   **Define the Theorems (Briefly):**
          *   *May (1952):* 2 options. Simple Majority is the *only* rule that is Anonymous (equal voters), Neutral (equal options), and Positively Responsive (more support = win).
          *   *Arrow (1951):* 3+ options. No ranking system can satisfy UD, PE, IIA, ND *and* produce a transitive ordering.

      *   **Addressing the "Gap" (The Core Mechanism):**
          *   *Transitivity:* This is the big one. With 2 options (A, B), if A > B, there's no C to create a cycle (A > B > C > A). Transitivity is automatically satisfied for binary choices.
          *   *IIA (Independence of Irrelevant Alternatives):* With 2 options, there *are* no irrelevant alternatives. IIA becomes trivial/vacuous. With 3+ options, IIA restricts how we handle the third option, creating the conflict.
          *   *Output:* May produces a *winner* (social choice function). Arrow produces a *ranking* (social welfare function). Ranking is harder than picking a winner.

      *   **Mapping the Conditions (The "Why"):**
          *   May's *Anonymity/Neutrality* $\approx$ Arrow's *Non-Dictatorship/Fairness*.
          *   May's *Positive Responsiveness* $\approx$ Arrow's *Pareto/Monotonicity*.
