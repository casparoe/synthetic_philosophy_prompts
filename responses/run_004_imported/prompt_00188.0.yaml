      *   *May's Theorem:* $n = 2$ alternatives. Conditions: Anonymity, Neutrality, Positive Responsiveness. Result: Simple Majority Rule is the *unique* rule satisfying these.
      *   *The "Gap":* Why does $n=2$ work and $n=3$ fail?
      *   *Key Insight:* The conditions aren't exactly the same, but they map onto each other. The crucial friction in Arrow is IIA + Transitivity with 3+ options. With 2 options, transitivity is trivial.
      *   *Connection:* May's theorem shows that for $n=2$, the "democratic" ideals are consistent. Arrow shows that for $n=3$, adding the requirement of a *transitive ranking* (not just a winner) creates the impossibility.

  3.  **Drafting the Explanation - Step-by-Step:**

