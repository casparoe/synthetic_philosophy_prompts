answer: |-
  **Setting:** *The 11:15 PM platform at King's Cross. Rain is hammering the glass roof. The departure board has been stuck on "DELAYED" for forty minutes. Two figures lean against a tiled pillar, holding lukewarm coffees. They have just come from the reading group.*

  **Characters:**
  *   **ELIAS:** Pro-Pritchard. Believes hinges are a sui generis propositional attitude (warrantless entitlements).
  *   **MARA:** Pro-Moyal-Sharrock. Believes hinges are non-propositional, enacted certainties (grammatical rules).

  ***

  **ELIAS:** You know, when you said during the discussion that "I have two hands" isn't a claim, I actually felt physically itchy. It's grammatically indicative. It takes a truth value. If I say it, I'm committing to its truth. That's just how the language works.

  **MARA:** And that's exactly why Moore lost. He treated a grammatical rule as if it were a move *within* the game. He stood up and said, "Here is one hand," as if he were offering evidence. But you don't evidence the rules of evidence, Elias. You don't prove the chessboard exists by moving a pawn.

  **ELIAS:** But if it's not a commitment, if it's not something I *hold*, then how does it stop the skeptic? The skeptic asks, "Do you know the world exists?" If your answer is, "I don't know it, I just ride it like a bike," you've conceded the epistemic point. You've said, "I have no knowledge claim here." Pritchard's whole point is that we *can* claim it. We are entitled to it. It's a commitment, just an arational one. It's the foundation of the common ground.

  **MARA:** "Common ground." There it is. You Stalnakerians always want to put everything into a set of propositions. A context set. But hinges aren't in the common ground. They are the *pressure* that keeps the ground solid. If you treat "The world exists" as a proposition in the common ground, you imply it could be removed from the common ground. You imply it's negotiable.

  **ELIAS:** It *is* negotiable! That's the river-bed. Wittgenstein says the bed shifts. Hard propositions become fluid, fluid ones harden. If hinges are just "how we act," how does that happen? Actions don't argue with each other. Propositions do. If the river-bed shifts, it's because the community's *commitments* have changed. We stopped being committed to "The sun orbits the earth." That was a hinge once. Now it's not. That sounds like a change in doxastic attitude.

  **MARA:** It's not a change in attitude; it's a change in grammar. When "The sun orbits the earth" was a hinge, it wasn't an empirical discovery waiting to be falsified. It was the framework through which observation happened. When it shifted, we didn't just update our beliefs. We changed what counted as a belief. You're trying to keep the logic of justification intact even where justification has run out.

  **ELIAS:** But if justification has run out, why isn't it blind faith? That's my worry. If I say, "I am entitled to believe the world didn't pop into existence five minutes ago," and you say, "No, you just *act* as if it didn't," you make the certainty look biological. Instinctual. But Wittgenstein talks about *mistakes*. You can be wrong about a hinge.

  **MARA:** You can be wrong about an *empirical* proposition. If you treat a hinge as empirical, *that* is the mistake. That's what Moore did.

  **ELIAS:** Okay, let's test that. The King. Section 92. Wittgenstein asks: if a king were raised from birth to believe the world began with him, would we say he's mad? Or just different?

  **MARA:** And?

  **ELIAS:** And you guys always dodge this. If hinges are just "what we do," then the King is just doing something different. His form of life is different. He acts as if the world began with him. Maybe he never plans for the future, maybe he treats history as myth. If hinges are non-propositional enactments, he's just playing a different game. Why call him mad?

  **MARA:** Because he can't play *our* game. He can't communicate with us. If he truly treats the world as beginning with him, he lacks the temporal framework required for language learning. He's not "different" in the way a French speaker is different from an English speaker. He's unintelligible.

  **ELIAS:** "Unintelligible." That's a normative judgment. You're saying he *ought* to share our hinges. That implies the hinges have a normative force stronger than mere habit. It implies there's a right way to hinge. Pritchard captures this: the King is violating an epistemic norm. He lacks entitlement.

  **MARA:** He lacks *coherence* with us. Not entitlement. "Entitlement" suggests there's a court of reason he could appeal to, where he'd be found guilty. But there is no court. There's just the clash.

  **ELIAS:** So you're saying if the King's community grew large enough, if enough people acted like the world began with them, they'd be right?

  **MARA:** I'm saying "right" and "wrong" don't apply at the level of the hinge. They apply *inside* the system. If their system holds together, if they can build houses and predict rain and raise children, their hinges are working.

  **ELIAS:** *[He turns sharply, coffee sloshing.]* There it is. The bullet. You're admitting it's relativism. If the King's hinges work for him, skepticism isn't defeated; it's just ignored. You haven't answered the skeptic, you've just changed the subject to "what works." Pritchard wants to say the King is *irrational*. Not just different. Irrational. Because there are objective constraints on what can function as a hinge.

  **MARA:** And you want to say the King is irrational because he violates a rule. But where does the rule come from? If it's not from our practice, it's from God or Logic with a capital L. Wittgenstein killed that.

  **ELIAS:** It comes from the nature of belief! You can't believe *p* without taking *p* to be true. If the King believes "The world began with me," but acts in ways that imply a past he denies, he's contradictory.

  **MARA:** But what if he doesn't act that way? What if his "belief" is entirely consistent within his form of life? Look, Elias, you're terrified that if hinges aren't propositional commitments, they lose their grip. You think if I say "it's just action," I make it soft. But action is harder than thought. You can doubt a proposition with your mind while your hands keep turning the doorknob. You can't doubt the doorknob with your hands.

  **ELIAS:** But the skeptic isn't attacking my hands. He's attacking my *claims*. He asks, "Do you *know*?" If I say, "Knowledge doesn't apply here," I've let him win the linguistic battle. I've ceded the territory of "truth."

  **MARA:** No. You've shown him that "knowledge" is a tool, not a mirror. When Moore said "I know I have a hand," he tried to use the tool on the hand that holds the tool. It doesn't fit.

  **ELIAS:** Okay. Fine. Let's go back to the river-bed. You say it shifts without reasons. Tectonically. But look at history. We stopped burning witches. That was a hinge: "Witchcraft is a causal mechanism." It became soft. We replaced it with germ theory. That happened because of *reasons*. Evidence. Argument.

  **MARA:** It happened because the *utility* of the witch-hinge collapsed. It stopped doing work. It wasn't that we found a counter-example to witchcraft. You can't find a counter-example to a framework. It was that the whole form of life became too costly, too painful, too incoherent with other things we were doing. It wasn't a rational revision. It was a mutation.

  **ELIAS:** That's a bullet I can't bite. If the shift from "witches exist" to "witches don't exist" isn't rational, if it's just a "mutation," then science isn't progress. It's just change. I need hinges to be stable enough that we can say we *learned* something. Pritchard's "conservatism" allows for that. We are entitled to our hinges until there is a specific defeater.

  **MARA:** And where does the defeater come from? If the defeater is empirical, it presupposes other hinges. You're in a circle.

  **ELIAS:** It's not a vicious circle. It's a spiral. We trust the hinges to investigate the world, and sometimes the world pushes back so hard the hinges crack. That requires the hinges to be propositional. They have to be the *kind of thing* that can crack under pressure. A habit doesn't crack. A belief cracks.

  **MARA:** A habit breaks. A way of living becomes impossible. Think about the King again. You want to say he's irrational. I say he's isolated. But here's my question for you: If the King is irrational, can you prove it to him?

  **ELIAS:** ...Not necessarily. He might be beyond reason.

  **MARA:** Exactly. So calling him "irrational" is just a way of saying "I can't talk to him." It's a boundary marker. It's not a description of his mental state. You're smuggling in a view from nowhere. You think you're standing outside both systems judging the King. But you're standing in *your* system.

  **ELIAS:** *[Silence. The train announcement crackles, then dies.]* So what? We're trapped?

  **MARA:** We're grounded. There's a difference.

  **ELIAS:** If we're grounded only in *our* practice, then the skeptic wins globally. He can say, "Sure, within your game, you're right. But is the game true?"

  **MARA:** And that question is nonsense. That's the Wittgensteinian stop. "Is the game true?" isn't a move.

  **ELIAS:** But it feels like a move. It feels like the only move that matters. That's why I stick with Pritchard. I want to be able to say the skeptic is *wrong*, not just silent. I want to say his request for justification is illegitimate, not meaningless. There's a normative difference.

  **MARA:** And I want to say the skeptic is *idle*. He's an engine idling. But Elias... if you make hinges propositional, if you make them commitments... you make them vulnerable.

  **ELIAS:** How?

  **MARA:** If "The world exists" is a commitment, even an arational one, I can ask: "Why do you hold it?" You say "Entitlement." I say "Why are you entitled?" You say "Because it's a hinge." I say "Who says?" You're back to the King. You're back to "Because we do."

  **ELIAS:** *[He looks at the departure board. Still "DELAYED".]* So you think my view collapses into yours eventually?

  **MARA:** I think your view is a theoretical overlay on top of what I'm describing. You're trying to formalize the river-bed. I'm just pointing at the water.

  **ELIAS:** But without the formalization, you can't explain why we feel compelled to answer the skeptic. You can't explain the *normativity* of logic. If hinges are just what we do, then if we started doing contradictions, would they become hinges?

  **MARA:** *[She pauses. This is the spot.]* If a community could live by contradiction... yes. But we can't imagine what that looks like. Which proves it's not a theoretical limit. It's a human one.

  **ELIAS:** That's the bullet. You're admitting logic is contingent on human biology.

  **MARA:** I'm admitting logic is part of the natural history of human beings. Yes.

  **ELIAS:** *[He laughs, a short, sharp sound.]* Okay. You bit it. Logic is contingent.

  **MARA:** Is that worse than saying logic is a magical realm we access via "entitlement"?

  **ELIAS:** It makes truth fragile.

  **MARA:** It makes truth honest.

  **ELIAS:** *[The board flickers. "ON TIME".]* Well. The train isn't delayed anymore.

  **MARA:** Looks like the river-bed shifted.

  **ELIAS:** Don't start. But... look. If I concede that the King isn't "irrational" in a cosmic sense, but only relative to our form of life... do I lose the ability to call him mad?

  **MARA:** You lose the ability to call him mad from a God's-eye view. You keep the ability to lock him up because he can't cross the street safely.

  **ELIAS:** Pragmatism.

  **MARA:** Enactivism.

  **ELIAS:** *[He steps toward the train door as it opens.]* I still think Moore was right about the hand.

  **MARA:** And I still think he was holding it wrong.

  **ELIAS:** See you at the next reading group.

  **MARA:** Bring Section 60.

  **ELIAS:** Bring Section 61.

  *[They board the train, neither convinced, but the space between them feels slightly less like a gap in logic and more like a difference in stride.]*
