  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** The St. Petersburg Paradox and its modern extensions/implications for Expected Utility Theory (EUT).
      *   **Constraints:**
          *   Do *not* rely on the standard "diminishing marginal utility of money" solution (Bernoulli's fix).
          *   Acknowledge Menger's critique (unbounded utility functions can be beaten by super-exponential payoffs).
          *   Acknowledge the Pasadena Game (Nover & Hájek) and conditional convergence issues.
          *   Acknowledge the Ergodicity Economics critique (Ole Peters, time averages vs. ensemble averages).
          *   **Crucial Requirement:** Commit to a real verdict. No "smart people disagree" hedging. Weigh the positions and take a stand.
      *   **Tone:** Analytical, philosophical, rigorous, engaging (suitable for a piece about decision theory).

  2.  **Deconstruct the Arguments:**

      *   *The Classical Paradox:* Infinite expected value ($\sum \frac{1}{2^n} 2^n = \infty$), but people pay little to play.
      *   *Bernoulli's Fix:* Log utility. Finite expected utility.
      *   *Menger's Counter:* If utility is unbounded, construct a game with payoffs $u^{-1}(2^n)$. Expected utility is infinite again. Therefore, utility *must* be bounded.
      *   *Pasadena Game:* Payoffs alternate signs and grow such that the series is conditionally convergent. The expectation depends on the order of summation. This attacks the definition of expectation itself, not just utility.
      *   *Ergodicity/Peters:* EUT assumes parallel universes (ensemble average). Real life is sequential (time average). For multiplicative dynamics, time average $\neq$ ensemble average. The paradox dissolves if you look at growth rates over time.

  3.  **Evaluate the "Verdict" Options:**

      *   *Option A: Bounded Utility Saves EUT.* (Menger's view).
          *   *Pros:* Mathematically consistent within the EUT framework.
          *   *Cons:* Philosophically unpalatable. Is there really a maximum amount of good a world can contain? It feels like a patch, not a solution. It restricts the domain of rationality arbitrarily.
      *   *Option B: EUT is Broken.* (Pasadena view).
          *   *Pros:* Highlights fundamental mathematical instability in infinite sums.
          *   *Cons:* Most real-world decisions aren't Pasadena games. It might be a pathology of infinity rather than a flaw in finite decision making.
      *   *Option C: Ergodicity is the Real Fix.* (Peters' view).
          *   *Pros:* Physically grounded. Matches how wealth actually evolves. Solves the paradox without bounding utility *per se*, but by changing the objective function (growth rate vs. expectation).
          *   *Cons:* Requires shifting the paradigm from "rationality as consistency" to "rationality as survival/growth." Doesn't solve one-shot decisions easily.

  4.  **Formulate the Thesis:**
      *   The prompt asks: Does it show we need bounded utility, or does it break EUT as a normative theory?
      *   *My Stance:* The paradox (especially with Menger and Pasadena) demonstrates that Expected Utility Theory is not a fundamental law of rationality, but rather a specific tool valid only under specific conditions (finite stakes, ensemble repeatability). The Ergodicity critique is the most profound because it changes the *ontology* of the problem. However, the Pasadena game suggests that even with ergodicity, infinite expectations are mathematically treacherous.
      *   *Refined Stance:* The St. Petersburg paradox, when pushed to its logical limits (Menger/Pasadena), *does* break Expected Utility Theory as a *universal* normative theory. It forces us to abandon the idea that "rationality = maximizing mathematical expectation." Bounded utility is a desperate patch. Ergodicity is the better physical description, but the deeper lesson is that infinity in decision theory is a category error. Rationality is about finite, temporal navigation, not infinite summation.
      *   *Decision:* I will argue that EUT fails as a *universal* normative theory. Bounded utility is an ad hoc constraint that saves the math but kills the intuition. Ergodicity offers a better descriptive model, but the Pasadena game shows the mathematical core of expectation is flawed for unbounded scenarios. The verdict: EUT is a local approximation, not a global law.

  5.  **Drafting - Section by Section:**

      *   **Introduction:** Hook with the coin flip. State the standard Bernoulli fix. Immediately dismiss it via Menger. Set up the stakes: Is EUT dead or just injured?
      *   **The Menger Hammer:** Explain why bounded utility is the only mathematical fix within EUT. Explain why it's philosophically costly (capping the value of existence).
      *   **The Pasadena Problem:** Introduce Nover & Hájek. Show that it's not just about "infinite good" but about the instability of the sum itself. This attacks the *definition* of expectation, not just the utility function.
      *   **The Ergodic Turn:** Introduce Ole Peters. Ensemble vs. Time. This shifts the ground from "what is rational" to "what is physical."
      *   **The Verdict:** Synthesize. Bounded utility is a band-aid. Ergodicity is a paradigm shift. Pasadena is a mathematical warning.
      *   **Conclusion:** Final commitment. EUT is not the normative king. It's a tool for finite, repeatable contexts. In the face of true uncertainty and infinity, it collapses.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I avoid the "diminishing marginal utility" trap? Yes, by emphasizing Menger's critique of it.
      *   *Check:* Did I commit? I need to make sure the conclusion isn't wishy-washy. I will explicitly state that EUT is *incomplete* and *context-dependent*, not universally normative.
      *   *Nuance:* I should acknowledge that for *finite* games, EUT works fine. The break happens at the limit. But since the paradox relies on the limit, the theory's failure at the limit reveals a structural weakness.
      *   *Tone Check:* Ensure it sounds like an essay, not a textbook summary. Use strong transitions.

  7.  **Final Polish:** Check the flow of the Pasadena explanation (conditional convergence is tricky to explain simply). Ensure the Ergodicity section distinguishes between additive and multiplicative dynamics clearly. (Decided to focus on the conceptual shift rather than heavy math).

      *(Self-Correction on the Verdict)*: If I say EUT is "broken," I need to be careful. It works for finite cases. The prompt asks if it breaks EUT as a *normative theory of rational choice*. If a normative theory fails in edge cases that are logically possible (even if physically impossible), does it fail? Yes, because normative theories claim universality. I will argue it fails as a *universal* normative theory.

  8.  **Finalizing the Title:** Something punchy. "The Infinity Trap," "Expectation's Collapse," "Beyond the Paradox." Let's go with "The Collapse of Expectation."

      *(Wait, one more thought on Ergodicity)*: Peters argues that for multiplicative wealth, the time average is the geometric mean, which corresponds to Log Utility. Does this just bring us back to Bernoulli? Yes, but for a *different reason*. Bernoulli said "people feel log utility." Peters says "wealth grows log-optimally." This is a crucial distinction. I must highlight that Peters derives the log, he doesn't assume it. This strengthens the Ergodic argument over the Bernoulli one.

      *(Wait, one more thought on Pasadena)*: The Pasadena game shows that Expected Value might not even *exist*. If the expectation is undefined, EUT cannot guide action. This is a stronger blow than just "infinite value."

      *Okay, ready to write.*
answer: |-
  # The Collapse of Expectation: Why St. Petersburg Breaks Rational Choice

  The St. Petersburg paradox is usually taught as a historical curiosity, a puzzle solved by Daniel Bernoulli in 1738 with the introduction of diminishing marginal utility. The story goes that while the expected monetary value of the game is infinite, the expected *utility* is finite because an extra dollar means less to a millionaire than to a pauper. This tidy resolution allows economics students to move on to supply and demand.

  But the tidy resolution is wrong.

  If we take the paradox seriously, pushing it through the gauntlet of modern decision theory, it ceases to be a curiosity and becomes a wrecking ball. Karl Menger showed in 1934 that Bernoulli's fix is mathematically fragile. More recently, the "Pasadena game" has demonstrated that expected values can be undefined even when payoffs are finite. Simultaneously, the ergodicity economics movement led by Ole Peters has argued that the very concept of "expectation" is physically misaligned with how time works.

  When we weigh these extensions, a clear verdict emerges. The St. Petersburg paradox does not merely suggest we need to bound our utility functions; it demonstrates that Expected Utility Theory (EUT) cannot stand as a universal normative theory of rational choice. It is a local heuristic that collapses under the weight of infinity, forcing us to choose between a philosophically repugnant cap on value or a paradigm shift toward time and growth.

  ### The Menger Hammer

  To understand why the standard solution fails, we must look at Menger's critique. Bernoulli proposed that utility grows logarithmically with wealth ($U(w) = \ln w$). Since the St. Petersburg payoffs grow exponentially ($2^n$) and the probability shrinks exponentially ($1/2^n$), the log utility dampens the payoff enough to make the sum converge.

  Menger pointed out a fatal loophole: EUT requires that preferences be consistent. If you accept that utility is unbounded—meaning there is no limit to how good a outcome can be—then for any utility function $U$, I can construct a "Super St. Petersburg" game. I simply set the monetary prize at stage $n$ to be whatever amount yields utility $2^n$. The probabilities remain $1/2^n$. The expected utility becomes $\sum \frac{1}{2^n} 2^n = \infty$.

  Menger's conclusion was stark: to save EUT, utility *must* be bounded. There must be a maximum possible amount of "goodness" the universe can contain.

  This is a high price to pay. Bounded utility implies that there is some sum of money (or some state of the world) so valuable that improving upon it is impossible. It suggests that saving a billion lives is not significantly better than saving a million, provided you are already above a certain threshold of moral satisfaction. Most ethicists and rational agents find this intuitively repulsive. We want to say that a world with more happiness is better than one with less, full stop. To save the math of EUT, Menger forces us to truncate our ethics. If the only way to preserve a theory of rationality is to deny that better outcomes can always exist, the theory is likely the problem, not the intuition.

  ### The Pasadena Instability

  If Menger shows that EUT requires a cap on value, the Pasadena game (proposed by Nover and Hájek in 2004) shows that EUT can break even without infinite payoffs.

  In the Pasadena game, the payoffs alternate in sign and grow in magnitude such that the series of expected values is *conditionally convergent*. In standard calculus, a conditionally convergent series sums to a specific value only if you add the terms in a specific order. By the Riemann rearrangement theorem, you can reorder the terms of such a series to sum to any number you like: positive infinity, negative infinity, or zero.

  This creates a nightmare for normative theory. In the St. Petersburg paradox, the expectation is infinite. In the Pasadena game, the expectation is *undefined*. It depends on how you count the possibilities. But rational choice theory assumes that a gamble has a definite value that an agent should maximize. If the value of a gamble depends on the arbitrary ordering of states in a sample space—an ordering that has no physical counterpart in the coin flip itself—then "maximizing expected utility" is not a coherent instruction. It is like telling someone to "maximize the number 5."

  The Pasadena game suggests that the problem isn't just unbounded utility; it is the reliance on infinite sums themselves. EUT treats probability as a static measure over a set of possible worlds (an ensemble). But when those worlds involve infinite tails, the measure becomes unstable.

  ### The Ergodic Turn

  While Menger and Nover & Hájek attack the mathematical structure of EUT from within, Ole Peters and the ergodicity economists attack the physical interpretation.

  Standard EUT calculates an "ensemble average": it imagines infinite parallel universes where the coin flip happens simultaneously, averages the results, and tells you that is the value of the game. But no human lives in an ensemble of parallel universes. We live in one universe, sequentially, through time.

  Peters argues that for many economic decisions, particularly those involving reinvestment (multiplicative dynamics), the time average (what happens to one person playing repeatedly over time) does not equal the ensemble average (what happens to many people playing once). In the St. Petersburg context, if you bet a fraction of your bankroll repeatedly, the ensemble average says you should bet everything because the expected return is infinite. The time average, however, shows that your wealth will almost surely converge to zero due to volatility drag.

  This is a profound shift. It suggests that the St. Petersburg paradox isn't a puzzle about human psychology (why are we risk-averse?) but a puzzle about physics (why do we think parallel universes determine value?). Under the ergodic framework, you don't need to assume bounded utility or diminishing marginal returns as a psychological axiom. The logarithmic growth rate emerges naturally from the mathematics of time and compounding.

  However, ergodicity economics is not a panacea for the paradox. It solves the problem for *repeated* play. But the St. Petersburg paradox is often posed as a one-off decision. If I offer you a single ticket to the game, the time-average growth rate is irrelevant because there is no time to average over. In the one-shot case, the ergodic argument loses its bite, leaving us back with the problem of how to value a single instance of an infinite expectation.

  ### The Verdict

  So, where does this leave us? We have three options:
  1.  **Accept Menger:** Adopt bounded utility functions.
  2.  **Accept Pasadena:** Admit that expected values are often undefined.
  3.  **Accept Ergodicity:** Replace expectation with time-average growth.

  Option 1 saves the theory by castrating it. Bounded utility is an *ad hoc* constraint designed solely to make the sums converge. It lacks independent justification and contradicts our moral and rational intuition that more good is always better than less. It treats the symptom (infinite sums) rather than the disease (the applicability of expectation).

  Option 3 is the most physically grounded but is limited in scope. It explains why we shouldn't play the game repeatedly, but it struggles to provide a normative rule for unique, non-repeatable events where time-averaging is impossible.

  Option 2, bolstered by the insights of Option 3, leads to the only honest conclusion: **Expected Utility Theory is not a universal normative theory of rational choice.**

  The St. Petersburg paradox, extended by Menger and Pasadena, reveals that "maximizing expectation" is a category error when applied to unbounded domains. Expectation is a statistical tool valid for finite, well-behaved distributions in repeatable contexts. It is not a law of logic. When we encounter scenarios with infinite tails or conditionally convergent series, the concept of "expected value" ceases to map onto reality.

  To call EUT "broken" is perhaps too strong; it works perfectly well for finite games, which comprise 99.9% of human decision-making. But a *normative theory of rationality* claims to tell us how we *ought* to reason, universally. If the theory yields nonsense (infinite value) or instability (Pasadena rearrangements) in logically possible scenarios, it fails as a universal norm.

  The paradox teaches us that rationality is not about calculating infinite sums across possible worlds. It is about navigating a finite, temporal existence. The "fix" is not to bound utility artificially, but to recognize that expectation is a local approximation. In the face of true uncertainty and unbounded potential, the rational agent does not maximize a mathematical phantom; they optimize for survival and growth in time.

  Therefore, the St. Petersburg paradox does not just show we need bounded utility. It shows that Expected Utility Theory is a sub-branch of decision theory, valid only under specific constraints of finitude and repeatability. As a grand theory of rational choice, it is dead. We must replace the worship of expectation with a physics of time.
