prompt: |-
  I'm a phil of mind PhD student doing a clinical ethics practicum, so I've got a non-voting seat on my teaching hospital's ethics committee this term. Thursday's case: a patient with locked-in syndrome (brainstem stroke, fully cognitively intact) communicates entirely through an external eye-gaze speech device she's used daily for three years -- by now she barely composes sentences on it consciously, she just looks and it says what she means, and it's also how she consents to her own treatment decisions. Hospital finance wants to reclassify the device's software support contract as routine 'durable medical equipment' upkeep, which can be downgraded for budget reasons with 30 days' notice and no ethics review -- same bucket as wheelchair repairs. Our charter says anything that could 'fundamentally affect a patient's decision-making capacity or means of expression' needs committee review first, but doesn't say who decides which bucket a case falls into. One attending, whose weirdly well-read in Clark and Chalmers, argues the device meets basically every criterion they give for something counting as literally part of a person's cognitive system -- so this isn't equipment triage, it's closer to proposing to partially silence her mind. Others think that proves way too much (glasses and insulin pumps would qualify too) and that hospital policy can't hinge on unresolved philosophy of mind. Can you draft the short opinion memo I'll circulate before the meeting? It needs a concrete recommendation with a timeline, and it has to actually engage the 'it's just equipment' side instead of waving it away.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Philosophy of Mind PhD student, Clinical Ethics Practicum, Non-voting seat on Hospital Ethics Committee (HEC).
      *   **Task:** Draft a short opinion memo to circulate before the Thursday meeting.
      *   **Case:** Patient with Locked-In Syndrome (LIS) uses an eye-gaze speech device (3 years daily use, seamless integration). Hospital Finance wants to reclassify software support as routine Durable Medical Equipment (DME) upkeep (downgradable with 30 days' notice, no ethics review).
      *   **Conflict:** Hospital Charter requires review for anything affecting "decision-making capacity or means of expression." Finance says it's DME. One Attending (Clark & Chalmers fan) says it's part of her cognitive system (extended mind). Others say that's too philosophical/policy-unworkable (slippery slope to glasses/insulin).
      *   **Requirements:** Concrete recommendation with timeline, engage the "it's just equipment" argument seriously (not just wave it away), professional tone suitable for an ethics committee.

  2.  **Determine the Goal & Tone:**
      *   **Goal:** Persuade the committee to trigger an ethics review *before* any downgrade happens, without getting bogged down in metaphysical debates about the "extended mind."
      *   **Tone:** Professional, pragmatic, ethically rigorous, bridge-building (between philosophy and policy).
      *   **Audience:** Clinicians, administrators, legal counsel, other ethicists. Some are philosophically savvy, some are pragmatic bureaucrats.
      *   **Key Constraint:** The user is a *student* with a *non-voting seat*. The memo needs to be advisory, respectful of hierarchy, but intellectually robust.

  3.  **Deconstruct the Arguments:**
      *   **Finance/Admin:** Efficiency, budget, precedent. If this is "part of the mind," where does it stop? (Glasses? Insulin?) Policy needs clear lines.
      *   **Attending (Extended Mind):** Clark & Chalmers (Extended Cognition). The device is functionally integrated. Removing support is silencing.
      *   **Ethics/Charter:** "Means of expression" and "decision-making capacity."
      *   **My Position (The Draft):** We don't need to settle the metaphysics of the Extended Mind thesis to know this triggers the Charter. We need a functional/clinical threshold, not a metaphysical one. The *consequence* of failure is the key differentiator from glasses/insulin.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Recommendation:** Get straight to the point. Recommend a formal ethics review *before* reclassification.
      *   **The Ethical Stakes:** Why does this matter? Autonomy, voice, capacity.
      *   **Addressing the "Equipment" Counter-Argument:** This is crucial. I need to show why glasses/insulin are different without dismissing the Admin concern.
          *   *Differentiation:* Redundancy and Integration. Glasses break, you get spares. Insulin has protocols. This device is her *only* voice. The integration depth (3 years, subconscious use) makes the risk of disruption catastrophic compared to other DME.
      *   **Addressing the "Extended Mind" Argument:** Acknowledge it but pivot to policy. We don't need to agree she *is* the device, only that the device is *necessary* for her agency.
      *   **The Charter:** Interpret "means of expression."
      *   **Recommendation/Timeline:** Specific steps. Pause reclassification. Convene review. Decision deadline.
      *   **Conclusion:** Reiterate the pragmatic value.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is citing Clark & Chalmers too academic?
      *   *Fix:* Mention it to validate the Attending, but frame it as "functional integration" rather than "ontological status." Keep it clinical.
      *   *Critique:* Is the student overstepping?
      *   *Fix:* Use language like "For consideration," "Recommend," "In my capacity as practicum student." Ensure the recommendation aligns with the Charter, not personal philosophy.
      *   *Critique:* How to handle the "glasses" objection specifically?
      *   *Fix:* Focus on *singular reliance* and *communication specificity*. Glasses correct vision generally; this device constructs specific propositional content for consent.

  6.  **Final Polish:**
      *   Check word count (keep it "short").
      *   Ensure the timeline is realistic (Thursday meeting is coming up).
      *   Make sure the "Concrete Recommendation" is bold and clear.

  7.  **Final Review against constraints:**
      *   Engage "it's just equipment"? Yes (via the redundancy/functional loss argument).
      *   Concrete recommendation/timeline? Yes.
      *   Tone appropriate for PhD student/HEC? Yes.

  **(Self-Correction Note):** I need to make sure I don't sound like I'm teaching the committee philosophy. I need to sound like I'm using philosophy to solve a policy ambiguity. The distinction is between *metaphysical constitution* (is it part of her mind?) and *functional necessity* (can she exercise agency without it?). The Charter cares about the latter.

  8.  **Drafting the Content:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name], PhD Candidate & Ethics Practicum Student
  **DATE:** October 23, 2023
  **SUBJECT:** Pre-Meeting Opinion: Reclassification of Eye-Gaze Communication Support (Patient [Initials])

  **Recommendation**
  I recommend the Committee vote to **pause the reclassification** of Patient [Initials]'s eye-gaze software support contract pending a formal, expedited ethics review. This review should be scheduled within 7 days, with a determination required before the 30-day financial notice period expires.

  **Rationale**
  The core ethical question is not whether the device is metaphysically "part of the patient," but whether downgrading support creates an unacceptable risk to the Charter-mandated protections for *decision-making capacity* and *means of expression*.

  **1. Engaging the "Routine Equipment" Argument**
  Administration's concern is precedent: if we classify this as protected expression, do we also protect glasses, insulin pumps, or wheelchairs under the Charter? This is a valid policy constraint. However, this case differs from standard Durable Medical Equipment (DME) on two functional grounds:

  *   **Singular Reliance & Redundancy:** Unlike glasses (which have spares) or insulin (which has backup protocols), this device is the patient's *sole* channel for complex propositional communication. A disruption in software support does not merely impair a bodily function; it creates a bottleneck for *consent itself*.
  *   **Integration Depth:** The clinical record indicates three years of daily, seamless use where sentence composition has become pre-reflective. While we need not settle philosophical debates about the "extended mind" to make policy, we must acknowledge the clinical reality: interrupting this interface is functionally indistinguishable from inducing a temporary aphasia.

  The "Equipment" classification holds when alternative means of expression exist or when the risk of disruption is manageable. Here, neither is true.

  **2. The Charter Threshold**
  Our Charter requires review for anything affecting a "means of expression." We do not need to agree that the device *is* her mind to agree that it is the *necessary condition* for her mind to be heard.
  *   **Risk:** Downgrading support increases the likelihood of latency, error, or system failure.
  *   **Impact:** Any increase in communication friction directly degrades the validity of informed consent.

  **3. Proposed Path Forward**
  We can respect budgetary constraints without bypassing ethical oversight.
  *   **Step 1:** Committee votes to flag this specific contract as "Critical Communication Infrastructure" rather than general DME.
  *   **Step 2:** Ethics review convenes next week to assess if the proposed "downgrade" introduces material risk to consent validity.
  *   **Step 3:** If the review finds the risk negligible, Finance may proceed. If the risk is significant, the hospital must absorb the cost or find alternative funding.

  **Conclusion**
  Treating this as routine triage assumes the patient's voice is robust to interference. The clinical evidence suggests otherwise. An expedited review honors the Charter, respects the Administration's need for clear categorization, and ensures we do not inadvertently silence a patient under the guise of equipment maintenance.

  I look forward to discussing this Thursday.
