      *   *The Case:* "Bank Case" style scenario (Keith DeRose, Jeremy Fantl, Matthew McGrath, etc.).
      *   *Naomi's Position:* Aligns with **Contextualism** (the standards for "knows" shift based on the context of the *attributor*) OR **Pragmatic Encroachment** (the subject's practical stakes affect whether they know). Given her focus on the deposit amount, it sounds like Pragmatic Encroachment (Stanley) or high-standards Contextualism.
