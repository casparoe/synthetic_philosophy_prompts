answer: |-
  Here are 10 questions designed to progressively tighten the pressure on the "reformed" counterfactual analysis, specifically targeting the "retention of intrinsic basis" clause.

  **1. The Finkish Motivation**
  **Question:** Let's start with the classic motivation for your view. The simple counterfactual analysis fails because of "finks"—cases where a disposition vanishes right before the stimulus triggers. Your reform requires that the object *retain* the intrinsic basis of the disposition through the stimulus. Does this clause successfully block the electro-fink, where the wiring is removed the moment the wire is touched?
  **Likely Reply:** Yes. In the fink case, the counterfactual "if touched, it would conduct" is false because the basis (the wiring) is removed *before* the conduction happens. By stipulating that the basis must survive the stimulus, we correctly predict the disposition is absent.
  **Follow-up:** So the truth of the disposition ascription now depends on the *persistence* of the microstructure during the counterfactual scenario. But doesn't that mean we have to know the outcome of the counterfactual scenario to know if the basis persists? If the fink removes the basis *because* the stimulus occurs, how do we evaluate the basis's retention without already knowing the fink's behavior?

  **2. The "In Virtue Of" Clause**
  **Question:** You've added that the manifestation must occur *in virtue of* that retained basis. Consider a case where the basis is retained, but a separate mechanism causes the manifestation. If I have a fragile glass, and I strike it, but a hidden god ensures it shatters via magic rather than the glass structure, does your analysis count the glass as fragile?
  **Likely Reply:** No, because the shattering didn't happen *in virtue of* the intrinsic basis. The causal chain must run through the retained structure.
  **Follow-up:** This seems to turn the analysis into a causal claim rather than a purely counterfactual one. If you need a specific causal pathway, aren't you essentially defining dispositions in terms of causal powers, making the counterfactual analysis secondary? Why keep the counterfactual framework at all if the heavy lifting is done by the causal clause?

  **3. Circularity of the Basis (Required)**
  **Question:** I want to press on the term "intrinsic basis." To avoid circularity, we need to be able to identify the basis independently of the disposition itself. If I ask, "What is the basis of fragility?" and you say, "The microstructure that makes it break when struck," haven't you defined the basis in terms of the manifestation? How do you identify the basis without smuggling the disposition back in?
  **Likely Reply:** We identify bases via categorical properties—bonding strengths, molecular lattices, physical arrangements. These are describable without referencing the disposition.
  **Follow-up:** But why *those* properties? We only select that specific molecular lattice as the relevant basis because we already know it leads to breaking. If the "relevant basis" is selected based on its ability to produce the manifestation, isn't the clause "retains the same basis" just a fancy way of saying "retains the ability to manifest"? If so, the analysis looks circular: it breaks if struck because it retains the ability to break if struck.

  **4. Masks vs. Lost Dispositions (Required)**
  **Question:** Let's distinguish a masked disposition from a lost one. Imagine a soluble pill coated in an impermeable shell (a mask) versus a pill made of insoluble plastic (no disposition). In both cases, if immersed, it doesn't dissolve. How can your analysis tell these apart without simply stipulating that one "retains the basis" and the other doesn't?
  **Likely Reply:** We look at the intrinsic properties. The coated pill retains the soluble sugar core; the plastic pill does not. The counterfactual holds for the sugar core if the shell were removed.
  **Follow-up:** But that requires a *further* counterfactual: "If the mask were removed, it would dissolve." Now you're analyzing a disposition by appealing to a counterfactual about a counterfactual. If the mask is intrinsic—say, a chemical inhibitor mixed into the poison itself (Bird's antidote case)—how do you distinguish the inhibitor from the basis without just asserting which part is the "real" basis?

  **5. The Antidote Case**
  **Question:** Speaking of Bird's poison case: A poison has a disposition to kill, but an antidote neutralizes it. On your view, does the poison retain the basis of lethality when the antidote is present?
  **Likely Reply:** It retains the chemical structure, but the antidote interferes with the causal pathway. So the basis is there, but the "in virtue of" condition fails because the pathway is blocked.
  **Follow-up:** So you have to distinguish between the *basis* and the *causal pathway*. But if the antidote chemically binds to the poison, changing its molecular shape, hasn't the basis changed? If you say the basis is "the same" despite the binding, aren't you just gerrymandering the definition of "same basis" to save the theory from the counterexample?

  **6. Determinate Basis for Ordinary Dispositions (Required)**
  **Question:** Let's zoom out to ordinary objects. You mention molecular lattices, but consider "fragility." A glass, a thin ice sheet, and a dried clay pot are all fragile. They share no single microstructural basis. Is there a determinate "same basis" that survives the stimulus across these diverse cases?
  **Likely Reply:** The basis is disjunctive. It's "lattice-structure-A OR ice-crystal-B OR clay-arrangement-C." As long as the specific disjunct is retained, the disposition holds.
  **Follow-up:** If the basis is a massive, open-ended disjunction of every possible way to be fragile, doesn't the clause "retains the same basis" become vacuous? Any object that breaks has *some* microstructure. If "retaining the basis" just means "retaining whatever microstructure it happened to have," then anything that breaks when struck satisfies the condition trivially. How do you rule out irrelevant microstructures without referencing the breaking?

  **7. The Intrinsic Constraint**
  **Question:** Your analysis specifies an *intrinsic* basis. But many dispositions seem to depend on extrinsic factors. A key has the disposition to open a lock, but that depends on the lock's tumblers, not just the key's shape. Do you deny these are real dispositions, or must you stretch "intrinsic" to include relational properties?
  **Likely Reply:** We can treat those as relational dispositions, or analyze the basis as the key's shape *relative* to the lock. But for standard dispositions like fragility, the basis is intrinsic.
  **Follow-up:** If you allow relational bases for some dispositions, why forbid them for others? If I say a glass is fragile *relative to* a hammer-strike, but not *relative to* a pillow-strike, haven't I made the disposition extrinsic? If you allow extrinsic bases, doesn't the fink return? An electro-fink is just an extrinsic mechanism that changes the intrinsic properties.

  **8. Temporal Duration of Retention**
  **Question:** How long must the basis be retained? Must it survive the *onset* of the stimulus, the *duration* of the stimulus, or the *moment of manifestation*? In slow-acting poisons, the basis changes chemically over time before the death occurs.
  **Likely Reply:** It must be retained long enough to initiate the causal process that leads to manifestation.
  **Follow-up:** "Long enough" seems to be doing a lot of work. If the basis changes mid-process but the effect still occurs, was it the *same* basis? If you say "yes, the relevant part remained," you're again selecting which parts are relevant based on the outcome. This looks like you're tracing the cause backward from the effect, rather than predicting the effect from the cause.

  **9. Theoretical Complexity**
  **Question:** Every time a counterexample arises—finks, masks, antidotes, mimics—you add a clause: "retain basis," "in virtue of," "no interferers." At what point does the complexity of the analysis outweigh the benefit? Why not just accept that dispositions are primitive causal powers?
  **Likely Reply:** Because we want to reduce dispositions to categorical properties and conditionals. Primitive powers are metaphysically spooky.
  **Follow-up:** But if your reduction requires a ceteris paribus clause for every possible interferer, plus a causal pathway clause, plus a basis retention clause, is it still a reduction? Or is it just a translation of "has a power" into "has a property that acts like a power unless it doesn't"?

  **10. The Falsifiability Condition (Required)**
  **Question:** Finally, let's talk about what would actually falsify your view. We've discussed finks and masks, but you have a patch for those. What would a genuine counterexample look like? What scenario would force you to admit the reformed analysis is false?
  **Likely Reply:** A case where an object retains the exact intrinsic basis, the stimulus is applied, no masks or finks are present, and yet the manifestation fails to occur without any explanation.
  **Follow-up:** But if the manifestation fails, wouldn't you simply infer there *must* have been a hidden mask or a subtle change in the basis? If the theory explains away every failure by positing an undetected interferer or a basis-shift, isn't the view immunized against falsification? If "retains the same basis" just means "retains whatever is sufficient for the effect," then the analysis is true by definition, not by discovery.
