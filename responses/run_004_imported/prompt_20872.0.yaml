prompt: |-
  So I keep running into "Good's theorem" in decision theory contexts on LW and in ACX comment threads, usually deployed as this settled, almost trivial fact: a Bayesian expected-utility maximizer should never expect free information to make you worse off, i.e. the expected value of information is always >= 0 (this is the I.J. Good result, from the 60s I think). I get the rough shape of the proof -- something about the "best you can do given your current credences" value function being convex in those credences, so averaging over the different posteriors you might end up with can only push expected value up relative to your prior, Jensen's-inequality style -- but I don't actually have a gut-level feel for why that's the right way to formalize "ignorance isn't bliss." I can imagine a possible world where that convexity fact just happens to be true of the math without capturing anything deep about rationality, and I honestly can't tell if that's the world we're in.

  What's actually bugging me more is that I keep running into the opposite intuition treated as equally obvious in nearby corners of the same communities. There's Bostrom's stuff on infohazards, there's Hirshleifer's old point that letting peoples individual risk get resolved before insurance contracts can be written can wreck the whole market and leave everyone worse off even though the information itself is free and accurate, and there's general game-theory folklore about setups (bargaining, some zero-sum games) where being visibly better-informed makes you worse off because of how it changes what everyone else does. None of these feel like they're just "well sure, but that information wasn't actually free" -- they feel like they're genuinely denying the substance of Good's theorem rather than falling outside some scope condition it never claimed to cover. Could you actually walk me through why Good's theorem is true in a way that makes it feel obviously true and not just algebraically true, and then use that same walkthrough to pin down exactly which premise each of those cases is quietly dropping? I'd like to come away with an actual sense of where the boundary is, not just a pile of "gotcha" examples.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Deconstruct the User's Query:**
      *   **Core Subject:** Good's Theorem (Value of Information, VoI).
      *   **User's Current Understanding:** Knows the rough proof (convexity of value function, Jensen's inequality), but lacks a "gut-level feel." Suspects it might just be a mathematical artifact.
      *   **The Conflict:** Encounters counter-intuitions in the same communities (LessWrong, ACX) regarding Infohazards (Bostrom), Insurance/Market effects (Hirshleifer), and Game Theory (bargaining/zero-sum).
      *   **The Goal:**
          1.  Explain *why* Good's Theorem is true intuitively (not just algebraically).
          2.  Analyze the counter-examples (Infohazards, Hirshleifer, Game Theory) to identify exactly which premise they violate.
          3.  Define the boundary clearly so the user knows when the theorem applies and when it doesn't.

  2.  **Part 1: Intuitive Explanation of Good's Theorem:**
      *   *The Math:* $E[\max_a E[U(a)|E]] \ge \max_a E[U(a)|\text{prior}]$.
      *   *The Intuition:* It's about *options*. Information doesn't force you to change your action; it gives you the *option* to change your action.
      *   *Analogy:* Buying a lottery ticket vs. knowing the numbers beforehand. Or better: A menu. If you order blind, you pick the average best. If you see the daily special (info), you can stick with your usual or switch. You never *have* to switch to something worse. You only switch if it's better.
      *   *Key Concept:* "The Right to Ignore." You are an expected utility maximizer. If the new information suggests an action with lower expected utility than your current plan, you just ignore the information and stick with the current plan. Therefore, the new expected utility is at least as high as the old one.
      *   *Convexity:* The value function is the upper envelope of linear functions (one for each action). Upper envelopes are convex. Expectation is linear. $E[\text{convex}] \ge \text{convex}(E)$.

  3.  **Part 2: Analyzing the Counter-Examples (The "Gotchas"):**
      *   *Constraint:* I need to show *which specific assumption* of Good's Theorem breaks in each case.
      *   *Good's Theorem Assumptions:*
          1.  **Single Agent:** You are the only decision maker affected by the info (or others' actions are fixed/independent).
          2.  **Instrumental Value Only:** Information is only valuable for changing *your* actions to match the world. It has no intrinsic disutility.
          3.  **Costless:** The information is free (given in the prompt, but worth noting).
          4.  **Action Flexibility:** You can choose *any* action after receiving the info.
          5.  **Fixed Utility Function:** Learning the info doesn't change what you want (your values), only what you believe.

      *   *Case 1: Infohazards (Bostrom/Psychological Harm).*
          *   *Scenario:* Learning a truth causes depression/suicide (e.g., "you have a terminal disease" or "simulation hypothesis").
          *   *Violation:* **Fixed Utility Function / Instrumental Value Only.** Good's theorem assumes utility depends on (Action, World State). It usually assumes learning the state doesn't *directly* enter the utility function negatively. If $U$ depends on *Belief* directly (e.g., happiness depends on ignorance), then information has intrinsic disutility.
          *   *Refinement:* It's not that the *decision* is worse, it's that the *state of knowing* is painful. Good's theorem calculates value of information for *decision making*, not value of information for *well-being* if knowledge itself hurts.

      *   *Case 2: Hirshleifer Effect (Insurance/Markets).*
          *   *Scenario:* Intermediate information arrives before insurance contracts are signed. Risk is resolved. Insurance market collapses. Everyone worse off ex-ante.
          *   *Violation:* **Single Agent / Fixed Opportunity Set.** Good's theorem assumes *you* decide. Hirshleifer is about *multiple agents* and *trade*. The "action" available to you (buying insurance) depends on what *others* are willing to do. Others' willingness depends on their info. If info becomes public, the set of available trades changes.
          *   *Key:* It's not that *having* the info hurts you individually (if you alone knew, you'd win). It's that *everyone* having the info destroys the mechanism (insurance) that allowed risk pooling. Good's theorem is individual; Hirshleifer is equilibrium/market.

      *   *Case 3: Game Theory (Bargaining/Zero-Sum).*
          *   *Scenario:* You get info, opponent sees you have info (or gets it too), opponent changes strategy to exploit you or demand more.
          *   *Violation:* **Single Agent / Fixed Environment.** Good's theorem assumes the environment (including other agents' strategies) is fixed conditional on the world state. In game theory, other agents react to *your* information state.
          *   *Nuance:* If the info is private and the game is fixed, Good holds. If the info is public, or if your *capacity* to process info signals strength/weakness, the game changes. Specifically, in bargaining, knowing your BATNA precisely might make you less flexible, or knowing the opponent's bottom line might make you greedy and cause deal breakdown.
          *   *Strict Violation:* Usually, this falls under "Information changes the game structure/opponent strategy," which violates the "fixed environment" assumption of the standard decision-theoretic proof.

  4.  **Part 3: Synthesizing the Boundary:**
      *   Create a checklist.
      *   **Good's Theorem applies when:**
          1.  You are the only decision-maker (or others are nature).
          2.  Knowledge itself doesn't hurt (only wrong actions hurt).
          3.  The set of available actions doesn't shrink because you know something.
          4.  Others don't change behavior based on your knowledge.
      *   **Good's Theorem fails when:**
          1.  Knowledge is painful (Infohazards).
          2.  Knowledge destroys trade opportunities (Hirshleifer).
          3.  Knowledge signals weakness/strength to adversaries (Game Theory).

  5.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Respectful, analytical, matching the user's sophistication (LW/ACX audience).
      *   *Structure:*
          1.  The Gut Check (Option Value).
          2.  The Formal Boundary (The 4 Assumptions).
          3.  The Counter-Examples (Mapping violations).
          4.  Conclusion (Reconciliation).
      *   *Self-Correction on Hirshleifer:* Make sure to distinguish between "value to the individual" vs "ex-ante welfare." Good's theorem is about ex-ante expected utility of the individual decision maker. Hirshleifer shows that *public* info can reduce ex-ante welfare because it changes the *feasible set* of contracts. This is a "change in available actions" violation.
      *   *Self-Correction on Infohazards:* Distinguish between "terminal value depends on belief" vs "instrumental value." Good's theorem assumes $U(outcome)$. If $U(outcome, belief)$, it breaks.
      *   *Self-Correction on Game Theory:* Emphasize that Good's theorem is *Decision Theory*, not *Game Theory*. Decision Theory = Nature moves. Game Theory = Agents move. If other agents react to your info, it's Game Theory.

  6.  **Final Polish:** Ensure the "Option Value" analogy is crisp. (The "Free Option" metaphor is usually the best intuitive hook). Ensure the distinction between "Information as a tool" vs "Information as a commodity/state" is clear.

  **(Self-Correction during drafting):** I need to be careful with the Hirshleifer point. Hirshleifer's result is often about *public* information. If information is *private*, Good's theorem usually holds for the holder (they have an edge). If it's public, the market adjusts. The user mentioned "letting people's individual risk get resolved." This implies the information becomes known before contracting. This changes the *feasible set of actions* (insurance contracts). Good's theorem assumes the action set $A$ is fixed. If $A(info) \subset A(no\_info)$, the theorem breaks.

  Let's refine the "Game Theory" point. In zero-sum games, if *you* get info and the *opponent* doesn't, Good's theorem holds (you can't do worse). If *both* get info, or if the opponent knows *you* have info, the equilibrium shifts. The user's prompt mentions "being visibly better-informed makes you worse off." This is the key. It's not the info, it's the *visibility* of the info. That changes the opponent's move. Good's theorem assumes opponent moves are fixed functions of state, not functions of *your knowledge*.

  Okay, ready to write.
answer: |-
  This is a fantastic question. You have correctly identified that Good's Theorem is often treated as a "universal law of rationality" in certain circles, while simultaneously being contradicted by "universal laws of strategy" in the very same circles.

  The resolution isn't that one side is wrong. It's that Good's Theorem is a theorem of **Single-Agent Decision Theory**, whereas almost all the counter-examples you listed are phenomena of **Multi-Agent Game Theory** or **Utility Function Structure**.

  Here is the walkthrough you asked for: first, the gut-level intuition for why Good's Theorem is true, and second, the precise surgical strike on which assumption breaks in each of your counter-examples.

  ---

  ### Part 1: The Gut-Level Intuition (Why Good's Theorem is True)

  You mentioned the convexity proof. That is the *algebraic* reason. The *intuitive* reason is **Option Value.**

  Good's Theorem relies on a specific model of how an agent uses information:
  1.  You have a set of actions available to you.
  2.  You currently have a "Best Plan" based on your prior beliefs.
  3.  You are offered free information.
  4.  **Crucially:** After seeing the information, you are allowed to **stick with your old plan** if you want to.

  Think of information not as a command, but as a **free option to change your mind.**

  Imagine you are about to walk out the door. You think it's 50% likely to rain. Your "Best Plan" is to bring an umbrella (because getting wet is worse than carrying an umbrella).
  *   **Scenario A (No Info):** You bring the umbrella. Expected Utility = $X$.
  *   **Scenario B (Free Info):** You look out the window.
      *   *Case 1:* It's raining. You bring the umbrella. (Same as Scenario A).
      *   *Case 2:* It's sunny. You **leave the umbrella**. (Better than Scenario A, because you avoid the cost of carrying it).

  In Case 1, you break even. In Case 2, you gain. Since you never *have* to switch to a worse plan (you can always ignore the info and do what you were going to do anyway), the expected value cannot go down.

  **The "Ignorance is Bliss" Refutation:**
  In the standard Good's Theorem framework, "Bliss" is defined as **getting good outcomes in the world.** Ignorance only feels like bliss if:
  1.  You are forced to act on the information (violating the "option to ignore" rule).
  2.  The *state of knowing* itself causes pain (violating the "utility depends only on outcomes" rule).

  So, the gut check is: **Information gives you the option to align your actions with reality better than you could before. Since you control the actions, you can never be forced to align them worse.**

  ---

  ### Part 2: The Boundary Conditions (Where it Breaks)

  For Good's Theorem to hold, four specific premises must be true. If any one of them fails, the theorem fails. The counter-examples you cited each break a different premise.

  #### The Four Premises of Good's Theorem
  1.  **Single Agent:** You are the only decision-maker. (Nature is passive).
  2.  **Instrumental Value:** Information has no intrinsic value/disutility; it only matters insofar as it changes your actions.
  3.  **Fixed Action Set:** The menu of actions available to you does not shrink because you know something.
  4.  **Fixed Opponent Strategy:** Other agents' actions depend on the *State of the World*, not on *Your Knowledge State*.

  Let's apply this to your counter-examples.

  #### 1. Infohazards (Bostrom / Psychological Harm)
  *   **The Scenario:** You learn a truth (e.g., "The universe is meaningless" or "You have a painful terminal illness") that causes you depression, reducing your utility directly.
  *   **Which Premise Breaks?** **Premise 2 (Instrumental Value).**
  *   **The Analysis:** Good's Theorem assumes your Utility function looks like $U(\text{Action}, \text{World State})$. It assumes your beliefs do not enter the utility function directly.
      *   In Infohazard cases, your Utility function is actually $U(\text{Action}, \text{World State}, \text{Your Beliefs})$.
      *   If holding a true belief causes suffering (e.g., grief), then information has **intrinsic disutility**.
      *   Good's Theorem calculates the value of information for *steering the future*. It does not calculate the value of information for *experiencing the present*. If the experience of knowing is painful, the theorem doesn't apply.
  *   **Verdict:** This isn't a failure of rationality; it's a failure of the model's assumption about what constitutes "value."

  #### 2. The Hirshleifer Effect (Insurance & Markets)
  *   **The Scenario:** Before insurance contracts are signed, intermediate information arrives (e.g., a genetic test result). If the result is known, the high-risk people can't get insured (or pay huge premiums), and the low-risk people don't need insurance. The risk-pooling market collapses. Ex-ante, everyone is worse off than if the info had remained hidden.
  *   **Which Premise Breaks?** **Premise 3 (Fixed Action Set).**
  *   **The Analysis:** Good's Theorem assumes that whatever actions you could take before, you can still take after (plus potentially new ones).
      *   In the Hirshleifer effect, the "Action" is **signing an insurance contract**.
      *   This action is only available if *someone else* is willing to sign the other side.
      *   When information becomes public, the *feasible set of trades* shrinks. The action "Buy cheap insurance" literally ceases to exist as an option because the counterparty withdraws it.
      *   Good's Theorem says: "Given a fixed set of actions, info helps you pick the best one." Hirshleifer says: "Info can remove actions from the set entirely."
  *   **Verdict:** This is a market equilibrium effect. Good's Theorem is individual decision theory; it does not account for the fact that your "actions" might be other people's "offers," which vanish when info is revealed.

  #### 3. Game Theory (Bargaining / Zero-Sum / Visibility)
  *   **The Scenario:** You are bargaining. If you know your BATNA (Best Alternative to a Negotiated Agreement) precisely, you might become rigid and fail to make a deal. Or, if the opponent *knows* you have superior intelligence/info, they might refuse to trade or attack you preemptively.
  *   **Which Premise Breaks?** **Premise 1 & 4 (Single Agent / Fixed Opponent Strategy).**
  *   **The Analysis:** This is the most common confusion. Good's Theorem is **Decision Theory** (playing against Nature). These examples are **Game Theory** (playing against Agents).
      *   **Private Info:** If you get info and *no one else knows you have it*, Good's Theorem **holds**. You have an edge. You can't do worse.
      *   **Public Info / Visibility:** If the opponent knows *that you know*, their strategy changes.
      *   Good's Theorem assumes the environment is fixed. In game theory, the environment (the opponent) reacts to your epistemic state.
      *   *Example:* In a zero-sum game, if you learn the opponent's move, you win. But if the opponent knows you learned their move, they will change their move. If the information structure forces a change in the equilibrium (e.g., "The informed player is a threat"), the *value of the game* to you might drop.
      *   Specifically, in bargaining, information can reduce your **flexibility**. If you know exactly how much the other person is willing to pay, you might demand that exact amount, causing them to walk away. If you were ignorant, you might have demanded less, sealed the deal, and both gained. Here, ignorance allows for **Schelling points** or **focal points** that information destroys.
  *   **Verdict:** Good's Theorem assumes you are optimizing against a static probability distribution. In game theory, you are optimizing against another optimizer who is reacting to your optimization capabilities.

  ---

  ### Part 3: Synthesizing the Boundary

  You asked for a sense of where the boundary is. Here is the litmus test.

  **Good's Theorem applies if:**
  1.  **You are the only agent** making a choice (or others are fixed).
  2.  **Knowledge doesn't hurt** (you don't care about the truth itself, only the outcome).
  3.  **Options don't vanish** (knowing the truth doesn't make other people refuse to trade with you).
  4.  **Secrecy is irrelevant** (nobody else knows that you know).

  **Good's Theorem does NOT apply if:**
  1.  **Truth hurts** (Infohazards: $U$ depends on Belief).
  2.  **Trade vanishes** (Hirshleifer: $Action Set$ depends on Common Knowledge).
  3.  **Opponents react** (Game Theory: Opponent Strategy depends on Your Knowledge).

  ### Summary for your "Gut Feel"

  The reason Good's Theorem feels "algebraically true but intuitively shallow" is that it describes a **solipsistic universe**. It describes a lone agent optimizing against a passive nature.

  *   **Why it feels trivial:** Because in a solipsistic universe, of course more data helps. Why would data hurt?
  *   **Why the counter-examples feel deep:** Because we live in a **social universe**.
      *   Infohazards exist because our brains are wired to feel pain from truth (Social/Psychological constraint).
      *   Hirshleifer effects exist because our actions depend on trade (Economic constraint).
      *   Game Theory effects exist because our environment thinks back (Strategic constraint).

  When you see someone on LW invoke Good's Theorem to dismiss infohazards or strategic opacity, they are making a **category error**. They are applying a theorem of *Individual Decision Theory* to problems of *Multi-Agent Equilibrium* or *Psychological Utility*.

  Good's Theorem is correct within its domain. The "folklore" you encounter is correct within *its* domain. The conflict arises only when the domain boundaries are blurred.

  **The One-Sentence Takeaway:**
  Good's Theorem proves that information is a **tool** that cannot hurt the user; the counter-examples show that information is also a **commodity** and a **signal**, which can devalue markets or provoke adversaries.
