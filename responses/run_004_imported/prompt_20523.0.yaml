  **Move 1 (Mara): +1**
  This is the standard "sparse ontology" intuition (akin to process theories or early Moore). It correctly identifies that no positive event occurred, but it struggles to account for the obvious counterfactual dependence between the watering and the survival.

  **Move 2 (Dev): +2**
  Dev invokes the counterfactual theory of causation (Lewis-style) effectively here. The insulin analogy is robust; in both folk and philosophical contexts, withholding necessary conditions is often indistinguishable from positive intervention regarding the outcome.

  **Move 3 (Mara): +2**
  This is the canonical "problem of profligate omissions." Mara correctly identifies that a simple counterfactual account explodes causal attribution to include every non-preventer globally, which is a decisive *reductio* against Dev's unrestricted claim.

  **Move 4 (Dev): +1**
  Dev attempts to solve the proliferation problem via normative salience (Hart & Honoré's "causal selection"). It's a pragmatically strong move, but he presents it as solving the *metaphysical* problem rather than merely filtering causal *attribution*, leaving him vulnerable.

  **Move 5 (Mara): +2**
  Mara correctly diagnoses Dev's category error. She distinguishes between the metaphysics of causation and the pragmatics of blame/responsibility, noting that normative duties don't alter the underlying ontological structure of the event.

  **Move 6 (Dev): -1**
  This is dialectically weak because Mara already conceded in (5) that legal liability tracks practical concerns, not metaphysical facts. Dev appeals to legal authority to settle an ontological question after his opponent has bracketed law as non-metaphysical.

  ***

  **The Overlooked Option: Causal Pluralism / Production vs. Dependence**

  Both are assuming "causation" must pick out a single kind of relation. The debate dissolves if you distinguish **causal production** (physical processes/energy transfer, where Mara wins: no water flow = no process) from **causal dependence** (counterfactual patterns, where Dev wins: if she had watered, it would live).

  The literature often handles this by treating omission claims as *true* but not *causal relations* in the strict sense (e.g., Helen Beebee's view that they are true claims about what didn't happen, grounded in norms). Alternatively, a **contrastive account** (Schaffer) handles Move 3 neatly: Mara didn't cause the death relative to the contrast "she watered it," but she didn't cause it relative to "the Pope watered it." The "job" Dev mentions in (4) isn't creating causation ex nihilo; it's setting the relevant contrast class for the explanation. They aren't disagreeing about the world; they're disagreeing about whether "cause" refers to the physics or the explanation.
