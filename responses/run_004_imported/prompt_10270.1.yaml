answer: |-
  **Setting:** *A quiet bench in a university arboretum, late autumn. The leaves are down. ELIAS (70s, retired physicist) and SARAH (40s, political philosopher) are watching students walk by.*

  **Elias:** I've been turning that case over in my mind for a week. The nineteen-year-old. Let's call him Andrei. Conscripted by an aggressor state, told his country is under existential threat, knows that if he runs home his own officers will shoot him. He meets Jan, a professional soldier defending the invaded border. They fire. Jan dies.

  **Sarah:** And you find it difficult to say Andrei did wrong?

  **Elias:** I find it difficult to say he is morally distinct from Jan. In the moment, in the fog, they are functional equivalents. They are both instruments of their states. If we say Andrei is a moral agent in a way that makes his killing of Jan unjust, but Jan's killing of Andrei just, we are asking for a level of moral clarity that doesn't exist in the trench. Walzer's symmetry isn't a bug; it's a feature. It acknowledges the reality of war.

  **Sarah:** But it acknowledges the reality by distorting the morality. That's the revisionist core, Elias. If Andrei's state is the aggressor, Andrei is participating in an unjust project. Jan is defending innocent life. How can they be moral equals? If Andrei and Jan were two civilians in a street fight, and Andrei was trying to steal Jan's wallet while Jan defended himself, we wouldn't say they possess an equal right to kill one another.

  **Elias:** But they aren't civilians. That's the category error. They are combatants. They have put on a uniform. They have entered a sphere where the normal rules of self-defense are suspended and replaced by the laws of war. The symmetry is conventional, yes, but it tracks a moral reality specific to that sphere: that once the state has unleashed violence, the individual soldier is no longer the proper locus of judgment.

  **Sarah:** Why isn't he?

  **Elias:** Because he lacks the epistemic capacity to judge. You're asking a nineteen-year-old, raised on state propaganda, to adjudicate the *jus ad bellum*? To analyze treaty violations, historical grievances, UN resolutions? It's impossible. If the morality of his action depends on the justice of the war, and he cannot know the justice of the war, then he cannot know the morality of his action. That's a recipe for paralysis or, worse, universal guilt.

  **Sarah:** I grant the epistemic limitation. McMahan grants it. Non-culpable ignorance is a powerful excusing condition. But you are conflating *blameworthiness* with *liability*. This is where the traditional view collapses under scrutiny.

  **Elias:** Explain the distinction in this context.

  **Sarah:** Andrei may not be *blameworthy*. He is ignorant of the true nature of the war, and he is under duress regarding his own execution. We can excuse him. We might not punish him if he were captured. But being excused is not the same as being *justified*. A justified act is one that is morally permissible, even right. An excused act is one that is wrong, but for which the agent is not fully responsible.

  **Elias:** So Andrei is doing wrong, but we cut him slack?

  **Sarah:** Precisely. But here is the collision: Jan is *justified*. He is defending innocent life against an unjust threat. Andrei is merely *excused*. He poses an unjust threat, even if he isn't fully culpable for it. Because Andrei is posing an unjust threat, he is *liable* to be killed by Jan to stop that threat. Jan is not liable to be killed by Andrei. Therefore, they are not moral equals. The legal symmetry Walzer defends masks a deep moral asymmetry.

  **Elias:** This is the part that keeps me up. "Liable." You're saying Andrei is liable to be killed. But if he is excused—if his ignorance and duress are genuine—on what grounds is he liable? If I am forced at gunpoint to swing a wrecking ball at your house, I am a threat, yes. But am I morally responsible for the threat enough that you can kill me to stop it? Or should you try to disable the ball?

  **Sarah:** In war, "disabling the ball" usually means killing the human holding the lever. The question is one of competing rights. Jan has a right to life. Andrei, by participating in the invasion, even coerced, has compromised his own right not to be killed insofar as it conflicts with Jan's survival. Andrei's right is diminished because he is the agent of the threat, even if a reluctant one. Jan's right is intact.

  **Elias:** But this makes the laws of war unworkable. You see that, don't you? If we adopt this view, we tell every soldier on the aggressor side: "You are morally liable to be killed, even if you follow every rule of engagement." And we tell the defender: "You are justified in killing them, but they are not justified in killing you."

  **Sarah:** That is the truth of the matter. Why should policy dictate morality?

  **Elias:** Because morality in war isn't just about the dyad of Andrei and Jan. It's about the system. If Andrei believes he is morally liable to be killed regardless of his conduct, what incentive does he have to follow *jus in bello*? Why shouldn't he use chemical weapons? Why shouldn't he target civilians? If he is already a "murderer" in your revisionist framework simply for being on the wrong side, he has no moral capital left to lose. The symmetry of combatant status is what allows us to hold soldiers accountable for war crimes. If you strip the aggressor soldier of moral standing, you strip him of the ability to violate the rules.

  **Sarah:** That's a pragmatic argument, Elias. It says we should teach a falsehood to preserve order.

  **Elias:** It says we should recognize that war is a collective activity. The responsibility lies with the leaders, the politicians, the generals. The soldier is a tool. If we moralize the tool, we let the hand that wields it off the hook. By treating Andrei and Jan as equals, we isolate the violence. We say, "Fight each other, but do not torture, do not target civilians." If you introduce moral asymmetry, you turn the war into a crusade. Jan sees Andrei not as a combatant, but as a criminal. Criminals are treated more harshly. Surrender becomes more dangerous.

  **Sarah:** But the "crusade" mentality already exists. And currently, the traditional view lets aggressor states off the hook too easily. It allows them to say, "Our boys were just following the rules of war, so their hands are clean." Revisionism says: No. If the war is unjust, the killing is unjust. The leaders are responsible, yes, but the bullet still comes from the soldier's rifle. We cannot sever the link between the act of killing and the justification for it.

  **Elias:** I'm not severing the link. I'm relocating it. But let's press your point on liability. You said Andrei's liability is based on his being an unjust threat. But you also admitted he is excused due to duress and ignorance. McMahan argues that excusing conditions reduce liability. So Andrei is *less* liable than a volunteer Nazi, say.

  **Sarah:** Correct.

  **Elias:** And Jan is a professional defender. He chose this job. He accepted the risk.

  **Sarah:** He accepted the risk of being killed, not the liability of being killed unjustly.

  **Elias:** But if Andrei's liability is reduced by his coercion, does Jan still have the right to kill him? If Andrei is only partially liable, and Jan is fully protected, is the killing permissible?

  **Sarah:** Yes. Because Jan's right to life outweighs Andrei's diminished right not to be killed. Even a partially liable threat can be stopped if the harm they threaten is death.

  **Elias:** Here is where I get stuck. If Andrei is only partially liable, and we acknowledge his duress... imagine the scales. Jan defends his sovereignty and life. Andrei defends his life from his own officers *and* his country from what he believes is aggression. If we strip away the state propaganda and look at the raw moral weight: Andrei is killing to avoid execution. Jan is killing to stop invasion.
  If you tell me that Jan is *justified* and Andrei is merely *excused*, you are making a metaphysical claim about the objective justice of the war. But in the fog of war, that objective justice is inaccessible.

  **Sarah:** Inaccessibility doesn't negate existence.

  **Elias:** But morality must guide action. If a moral theory tells an agent, "You must determine X before you act, but X is impossible to determine," that theory is broken. The traditionalist view says: "You cannot determine X. So, assume symmetry. Follow the rules of engagement. If the war is unjust, blame the leaders." It protects the soldier's conscience so he can remain a human being capable of restraint.
  Your view tells Andrei: "You are objectively in the wrong, even if you don't know it." That is a heavy burden. And it tells Jan: "He is in the wrong." That makes Jan a judge, jury, and executioner.

  **Sarah:** Jan isn't judging Andrei's soul. He is assessing the threat. The revisionist view doesn't require Jan to know the deep history. It requires him to know he is defending his home against an incursion. That is usually sufficient for *prima facie* justification.
  The real issue, Elias, is that you want the laws of war to be a self-contained system. You want *jus in bello* to be independent of *jus ad bellum*. I am saying it cannot be. Killing is only permissible if it serves a just cause. If the cause is unjust, the killing is, at base, a series of murders, however excusable the murderers might be.

  **Elias:** And if that's true, then peace is impossible. Because no state admits to aggression. Both sides will believe they are Jan. If we institutionalize your view, we institutionalize the certainty that the other side is morally illegitimate. We remove the possibility of seeing the enemy as a peer.
  Walzer's symmetry is a form of mercy. It says, "We recognize that you are trapped in this machine just as we are." It allows for reconciliation after the war. If we adopt the revisionist view, the war ends with one side vindicated and the other side culpable. That might be legally true at Nuremberg, but on the battlefield? It fuels total war.

  **Sarah:** But isn't it worse to build peace on a lie? To tell the victims of aggression that their killers were their moral equals? There is a dignity in the truth. Andrei is a tragic figure, yes. Coerced, ignorant. We can pity him. We can excuse him. But we cannot say he was doing the same thing as Jan. Jan was protecting rights. Andrei was violating them, however unwittingly.
  If we don't make that distinction, we lose the ability to condemn the aggression itself. We reduce war to a sport with rules, rather than a moral catastrophe.

  **Elias:** So we bottom out here: You prioritize the objective moral truth of the act, even if it's unknowable to the actors. I prioritize the functional morality of the institution, because that's what actually constrains violence.

  **Sarah:** I prioritize the rights of the individuals involved. Jan has a right not to be killed for an unjust cause. Andrei does not have a right to kill for one. The law should track that, even if it's messy.

  **Elias:** And I worry that if the law tracks that, the law breaks. And when the law breaks, Jan and Andrei both die in greater numbers, and with greater cruelty.
  I spent thirty-five years calculating yields and fallout. I know that when you introduce a variable the system can't process, the system fails. The soldier's mind cannot process the *jus ad bellum* in the moment of fire. So you treat it as a constant. Symmetry.
  You say that's a lie. I say it's a necessary fiction for survival.

  **Sarah:** And I say that necessary fictions have a way of becoming sufficient tragedies. If we stop asking whether the killing is justified, and only ask if the rules were followed, we make monsters of us all.

  *They sit in silence for a moment. A student walks by, kicking at a pile of leaves.*

  **Elias:** So, Andrei kills Jan.

  **Sarah:** Andrei commits an unjustified killing, though he may be excused.

  **Elias:** Jan kills Andrei.

  **Sarah:** Jan commits a justified act of defense.

  **Elias:** And the war goes on.

  **Sarah:** And the war goes on. But at least we know who was right.

  **Elias:** *(Sighs)* I'm not sure that knowledge helps the dead. But I suppose it matters to the living.

  **Sarah:** It has to. Or else we're just physics. Colliding masses.

  **Elias:** *(A faint smile)* I spent a lifetime hoping it was just physics. It's much harder to sleep if it isn't.
