answer: |-
  # The Mosaic and the Wavefunction: Why Entanglement Doesn't Kill Humeanism

  You have stumbled onto the single most significant tension in contemporary metaphysics of science. For decades, David Lewis's Humean package was the default "naturalist" position: the world is a vast mosaic of local matters of particular fact, and laws are merely the compressed summary of that mosaic (the Best System Account, or BSA). It is ontologically cheap, epistemically transparent, and avoids the mystical "governing" relation that plagues anti-Humean views.

  But you are right to worry about quantum entanglement. If the state of the world is non-separable—if the facts about the whole are not determined by the facts about the parts—then Lewis's specific ontology, **Humean Supervenience (HS)**, appears dead on arrival.

  However, there is a distinction to be made between Humean Supervenience (the claim that everything supervenes on local 3D/4D qualities) and Humeanism about Laws (the claim that laws are summaries, not governors). My verdict is this: **Entanglement kills Lewis's specific ontology of the mosaic, but it does not kill the Best System Account. In fact, when paired with a Bohmian or Flash ontology, the Humean account of laws emerges as the only viable option that respects both parsimony and the formalism of quantum mechanics.** Anti-Humeanism offers no better solution to non-locality and introduces modal magic that explains nothing.

  ### The Battlefield: Mosaic vs. Governing

  To see why the stakes are high, we must clarify the opposing camps.

  **The Humean (Lewis):** The universe is a "Humean Mosaic." At every spacetime point, there are intrinsic properties (mass, charge, field strength) that are what they are, independently of anything else. There is no "causal power" or "necessity" in the points themselves. Laws of nature are not entities; they are the axioms of the deductive system that best balances *simplicity* and *strength* in describing the mosaic. Laws supervene on the facts. If the facts were different, the laws would be different.

  **The Anti-Humean (Armstrong, Maudlin):** Laws are fundamental. For Armstrong, laws are relations of necessitation between universals ($N(F, G)$). For Maudlin, laws are primitive ontological entities that *govern* the behavior of matter. On these views, the laws explain the regularities, not vice versa. The mosaic is the way it is *because* the laws compel it to be so.

  The Humean advantage is parsimony. We don't need a "necessitation" relation that no one can define or detect. We just have the world, and we have our theories. The Anti-Humean advantage is intuition: it feels like gravity *makes* the apple fall, not that the apple falling is just part of a pattern we labeled "gravity."

  ### The Quantum Bomb: Non-Separability

  The threat to Humeanism comes from the structure of the quantum state. In classical mechanics, if you know the position and momentum of every particle, you know the state of the system. This is **separability**. It fits HS perfectly: the global state is just the sum of local states.

  In quantum mechanics, entangled systems violate this. Consider two particles in a singlet state. The joint wavefunction $\Psi$ cannot be factored into a state for particle A and a state for particle B. The physical reality of the pair contains information (correlations) that is not present in the physical reality of the parts taken individually.

  Lewis himself admitted this was the biggest threat to his view. If the fundamental state of the world is the wavefunction, and the wavefunction lives on a $3N$-dimensional configuration space rather than 3D space, then there are no "local qualities at spacetime points." The Mosaic dissolves. If HS is false, the Humean base for the Best System Account seems to vanish.

  ### The Anti-Humean Stall

  Before we rush to bury Humeanism, we must ask: Does Anti-Humeanism handle entanglement better?

  The answer is a resounding **no**.

  If you are an Armstrong-style necessitarian, you must explain what universals are being necessitated in an entangled pair. Is "spin" a universal? How does the necessitation relation $N$ account for non-local correlations without violating relativity? Armstrong's account was built on classical intuitions of properties residing in objects. It has no natural machinery for holism.

  Maudlin's primitivism fares no better. Saying "the law just primitively governs the entangled state" is effectively a "shut up and calculate" metaphysics. It posits a fundamental governing relation but offers no account of how that relation bridges spacelike separation. It accepts non-locality as a brute fact, but it adds the ontological cost of "governing" on top of it.

  Anti-Humeanism gains no traction on the technical problem of entanglement. It merely layers modal glue on top of a non-local structure it cannot explain any better than the Humean can.

  ### The Humean Counter-Attack: Reconfiguring the Mosaic

  The Humean response to entanglement is not to deny quantum mechanics, but to refine what counts as the "Mosaic." There are two viable lines of defense, and one of them secures the Humean victory.

  **1. The Wavefunction as Law (The Loewer-Albert Move)**
  This is the strongest position. We accept that the fundamental ontology is not the wavefunction itself. Instead, the Mosaic consists of **local beables**: particle positions (in Bohmian mechanics) or "flashes" of collapse (in GRW theory). These *are* local matters of particular fact in 3D space.

  The wavefunction $\Psi$ is then treated not as part of the Mosaic, but as part of the **Best System**. It is a mathematical device that summarizes the evolution of the particles/flashes with maximum simplicity and strength.

  This saves Humean Supervenience. The laws (including the Schrödinger equation and $\Psi$) supervene on the history of particle positions. Entanglement is not a spooky relation between distant particles; it is a feature of the *summary* (the law) required to predict the correlations in the mosaic. The non-separability is in the code, not the hardware.

  **2. Configuration Space Realism**
  A more radical move is to say the Mosaic *is* the wavefunction, but it lives on a high-dimensional configuration space. Points in configuration space are "local" in that space. This preserves HS technically but abandons the intuition that 3D space is fundamental. This is less attractive because it makes our 3D experience derivative, but it shows Humeanism is flexible.

  ### The Verdict: Humeanism Wins, But Lewis Was Slightly Wrong

  Here is the definitive take: **Entanglement refutes Lewis's specific claim that the Mosaic must consist of intrinsic properties in 3D/4D spacetime. It does not refute the Best System Account of laws.**

  The core insight of Humeanism is not "everything is local points." The core insight is **"modality is not fundamental."** There is no "must" in nature, only "is." Laws are human-scale compressions of world-scale data.

  When we face entanglement, the Anti-Humean says: "There is a primitive necessitation relation that binds these particles across space." This is an ontological expense with no explanatory return. It doesn't tell us *how* the necessitation travels; it just asserts that it does.

  The Humean (specifically the Bohmian-BSA Humean) says: "There is a history of particle configurations. The most efficient way to summarize that history involves a wavefunction on configuration space. The 'non-locality' is a feature of the summary, not a causal mechanism."

  This is the LW-brained answer. It treats laws as compression algorithms. An entangled state is just a highly compressed description of correlations that would be verbose to describe pairwise. The fact that the compression algorithm (the wavefunction) is non-separable does not mean the underlying data (the particle hits on a screen) violates the spirit of reductionism.

  **Why Anti-Humeanism Fails Here:**
  Anti-Humeanism relies on the intuition that laws "govern." But in QM, "governing" becomes incoherent. Does the law govern the collapse? The unitary evolution? The branching worlds? If laws are primitive entities, why do they look exactly like information-theoretic constraints? The Humean has a ready answer: because they *are* information-theoretic constraints.

  **The Final Judgment:**
  You should remain a Humean about laws, but you must cease to be a dogmatic Lewisian about the Mosaic.
  1.  **Reject Humean Supervenience** in its strict Lewisian form (intrinsic properties at spacetime points). Quantum holism is real.
  2.  **Retain the Best System Account.** Laws are still the axioms of the best summary of the world's history.
  3.  **Adopt a Primitive Ontology.** The "Mosaic" should be understood as a set of local beables (particles or flashes) in 3D space, with the wavefunction elevated to the status of law-like structure.

  Entanglement does not force us to accept "governing." It forces us to accept that the best compression of the universe is not separable. That is a fact about information, not a fact about modal glue. The Anti-Humean tries to solve an information problem with a metaphysical hammer. The Humean recognizes it as a coding problem.

  The rabbit hole ends here: The world is still just the world. The laws are still just the summary. The summary is just weirder than Lewis hoped. But it doesn't need magic to work.
