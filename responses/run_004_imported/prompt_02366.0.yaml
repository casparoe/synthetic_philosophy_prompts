      *   Need to address the "Reference Magnet" argument specifically (Lewis's solution to indeterminacy).
      *   *Counter-move:* Carnap would argue that "reference" itself is a notion internal to a semantic framework. To say reference is "fixed by the world" presupposes a framework where "world" and "reference" relate that way.

  7.  **Final Polish:**
      *   Ensure tone is academic and rigorous.
      *   Check that the prediction is definite (Carnap resists).
      *   Ensure the distinction between "practical" and "theoretical" external questions is clear.

      *(Self-Correction during drafting)*: I need to be careful not to just say "Carnap is a verificationist so he rejects it." That's too shallow. I need to explain *how* he would process the concept of naturalness. He wouldn't just ignore it; he would reinterpret it. He would likely align "naturalness" with "simplicity" or "inductive utility" (like Goodman). This makes it a pragmatic virtue, not a truth-maker for external questions.

      *(Another consideration)*: Sider anticipates this. He says naturalness is primitive and not reducible to pragmatics. Carnap's response would be that positing a primitive metaphysical property without empirical cash-value is exactly what "Empiricism, Semantics, and Ontology" warns against.

      *(Structure)*:
      1. Introduction: Thesis (Carnap resists).
      2. The Status of Naturalness: Metaphysical vs. Scientific.
      3. The Semantics of "Existence": Framework-relative vs. Magnet-fixed.
      4. The External Question Revisited: Practical adoption of Ontologese.
      5. Conclusion.

  8.  **Final Review against constraints:**
      *   Carefully argued? Yes.
      *   Definite prediction? Yes.
      *   Engage mechanics of Sider? Yes (joint-carving quantifiers, reference magnets).
      *   Not just general anti-metaphysics? Yes (focus on verification/internal-external).

