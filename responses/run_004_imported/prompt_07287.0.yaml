      *   *Test 3: The "So What?" Test.* If we resolve the definition, does the practical outcome change?
      *   *Test 4: The Context Check.* Are we arguing about *usage* (how we *should* use the word) or *reality* (how the world *is*)?

  4.  **Address the "Risks" Question (Stakes):**
