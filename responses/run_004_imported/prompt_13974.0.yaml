answer: |-
  The simulation didn't end with a bang, or even a whimper. It ended with a number.

  Dr. Aris Thorne sat in the haptic chair, the electrodes peeling away from his temples like dead skin. The screen in front of him was black, save for a single line of white text: *ENTROPY MAXIMUM. T + 10^100 YEARS.*

  He had spent forty years building the Temporal Lens. It wasn't a telescope; it was a calculator of consequence. It took the current trajectory of matter and energy and projected the observer's consciousness forward, not as a viewer, but as a participant. You didn't just see the heat death; you felt the cooling. You felt the stretching of light until it meant nothing. You felt the silence of a universe where no structure could hold a thought.

  Aris unbuckled the harness. His hands were shaking. Not from fear, exactly, but from a kind of vertigo that had no bottom.

  "Vitals are spiking, Doctor," said Elena. She was standing in the doorway, holding a tablet. She was his caretaker, his nurse, and for the last six months, the person who reminded him to eat. She was thirty, practical, and possessed a terrifying immunity to abstraction. "Heart rate is 110. Do you want to stop the protocol?"

  "No," Aris said. His voice sounded thin in the small, warm room. "Run it again."

  "You can't. The cooling cycle on the processor takes twelve hours. And frankly, Aris, you look like you've seen a ghost."

  "I saw the end of the ghost," he said. He stood up, his legs unsteady. He walked to the window. It was night. The city lights of Cambridge blurred against the glass. Above them, hidden by the glow, were the stars.

  Elena came up beside him. She didn't look up. She looked at him. "Was it worth it? The grant money, the sabbatical, the stress? You have three months, Aris. Maybe four. The chemo isn't working. You spent your 'maybe four' watching a computer screen turn black."

  "It wasn't a computer screen," Aris said. "It was the truth."

  "It was a model."

  "It was the destination."

  He turned away from the window and walked to his desk. There was a copy of *Foundations of Mathematics* lying there, dog-eared. Frank Ramsey. The boy genius. Dead at twenty-six. Aris was seventy-two, but he felt he was only now catching up to the boy's final confusion.

  "You're doing it again," Elena said softly. "You're leaving."

  "I'm right here."

  "No. You're up there." She pointed at the ceiling, at the sky. "You're out in the vacuum. You're not in this room with the nausea and the bills and the fact that your daughter is coming on Sunday and doesn't know how to talk to you."

  Aris picked up a coin from his desk. A British threepenny bit, old silver, a relic from his grandfather. He held it up to the window, blocking out the city lights.

  "Ramsey said," Aris began, and he heard the lecture creeping into his tone, the old habit of the podium, "that we draw the world to scale, and that is our mistake. We look at the stars, we see they are huge, and we feel small. We feel our loves are negligible because they happen on a rock in a void."

  "Ramsey also died at twenty-six," Elena cut in. "He didn't have to live with cancer. He didn't have to watch his own cells turn against him. It's easy to say size doesn't matter when you haven't been crushed by it."

  "He said we should draw the world in perspective, not to scale." Aris pressed the coin against the glass. "If you draw it in perspective, the stars are this size. Because they cannot think. They cannot love. They have no interiority. The only thing that has weight is the thing that can measure weight. Consciousness is the scale. Not meters. Not light years."

  "That is a beautiful sentence," Elena said. She walked over and took the coin from his hand. She put it back on the desk. It made a small, dull *clink*. "But right now, your consciousness is measuring pain. It's measuring fatigue. And in six months, your consciousness will be gone. And the stars will still be there. Burning. Uncaring. That's not perspective, Aris. That's cope. It's a rhetorical trick to keep you from screaming."

  Aris sat down heavily. The vertigo was back. The simulation had done something terrible to his sense of discounting.

  In economics, and in life, you discount the future. A dollar in a hundred years is worth less than a dollar today. A pain in a hundred years is negligible. Ramsey's argument relied on this. The heat death of the universe is so far away that its present value is zero. Therefore, don't let it trouble you.

  But the Temporal Lens had bypassed the discount rate. Aris had felt the cold of the end *now*. The future suffering of a dead universe had been imported into his present nervous system. The present value was not zero. It was crushing.

  "If I accept your view," Aris said, "then nothing matters. If the container dictates the value of the contents, then we are insects in a jar waiting to be shaken. The jar is big. We are small. Therefore, we are nothing."

  "I'm not saying you're nothing," Elena said. She pulled a chair over and sat facing him. Knee to knee. "I'm saying the jar is real. You can't think your way out of physics. You're dying. The universe is expanding. These are facts. Ramsey's 'perspective' is a story you tell yourself so you don't have to look at the facts."

  "Is love a fact?"

  "It's a chemical process."

  "Is pain a fact?"

  "Yes."

  "Then if I feel love," Aris said, tapping his chest, "and the star does not feel love, then I am larger than the star. In the only metric that exists. If I am the only thing that can assign value, then my assignment is the absolute. The star is a threepenny bit. I am the eye."

  Elena sighed. She looked tired. She reached out and touched his hand. Her skin was warm. It was a specific, localized warmth. It did not radiate like a sun; it conducted like a human.

  "Sunday," she said. "Your daughter. Sarah."

  "Yes."

  "She's bringing the kids."

  "I know."

  "They're going to want to go outside. They're going to want to look at the sky. They're going to ask you questions. 'What's that star?' 'How far away?' 'Will it die?'" Elena squeezed his hand. "If you tell them it's all just perspective, if you tell them the heat death doesn't matter, they're going to feel it. They're going to feel that you're minimizing their future. You're minimizing *their* death."

  Aris looked at her hand on his. He thought about the simulation. He thought about the silence of the final epoch. He tried to apply Ramsey's discount. *That is far away. This hand is here.*

  But he couldn't. The Lens had broken the mechanism. He knew, with a visceral certainty, that the silence was coming. It was inevitable. It was the true scale. And against that true scale, this hand, this room, this conversation, was statistically indistinguishable from zero.

  And yet.

  The warmth was undeniable.

  "I don't know what to tell them," Aris admitted.

  "Don't tell them about the heat death," Elena said. "Don't tell them about the discount rate. Tell them about the coin."

  She nodded at the threepenny bit on the desk.

  "Ramsey said the stars are the size of coins," she said. "Okay. Fine. But a coin buys something. It's currency. It's not just size. It's transaction."

  She stood up. "I'm going to get your medication. Don't try to run the simulation again. The processor will fuse."

  She left the room. The door clicked shut.

  Aris was alone. The hum of the server rack in the corner was the only sound. It was the sound of energy being converted to heat. Entropy, locally accelerated.

  He picked up the coin again. It was cold metal. He rubbed his thumb over the face of the king.

  He looked out the window. He tried to summon the image of the stars as threepenny bits. He tried to shrink them down, to force them into the perspective of the human observer. He tried to assert his consciousness as the dominant metric.

  * I am the scale. I am the measure. *

  But the darkness outside felt heavy. It felt like a weight pressing against the glass. The knowledge of the 10^100 years sat in his gut like a stone. He knew, objectively, that the universe did not need him to measure it for it to exist. It would exist without him. It would end without him. His assertion of dominance felt like a child shouting at the tide.

  *It is cope,* Dana would have said. *It is a smart man talking himself out of panic.*

  He closed his hand around the coin. He squeezed until the edges bit into his palm. Pain. Sharp, immediate, local.

  The pain was real. The coin was real. The stars were real.

  If the stars were bigger, why did the coin hurt more?

  If the future was longer, why did the present feel heavier?

  Aris opened his hand. The silver was dull in the lamplight. He thought about Sarah coming on Sunday. He thought about her children. They would be warm. They would ask questions. They would not know about the heat death. They would live in the perspective, not the scale.

  Was that a lie? Or was it the only truth that could be lived?

  He stood up and walked to the server rack. He placed his hand on the metal casing. It was vibrating. Warm. It was working toward its own end, burning energy to create the illusion of the future.

  Aris unplugged the machine.

  The hum died. The room went quiet. The stars outside remained, vast and indifferent. The coin remained, small and sharp.

  He put the coin in his pocket. He would give it to his grandson on Sunday. He would not tell him what it represented. He would not tell him about the scale of the universe. He would let the boy decide if it was heavy or light.

  Aris turned off the lamp. He sat in the dark, waiting for Elena to return with the pills. He waited in the silence, listening to the blood in his ears, which sounded, for all the world, like a universe expanding.
