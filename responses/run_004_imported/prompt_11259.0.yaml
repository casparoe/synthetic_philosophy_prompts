answer: |-
  This is a fantastic dispute because it cuts to the heart of why the Bikhchandani–Hirshleifer–Welch (BHW) model is so counterintuitive. Nora and Theo are essentially reenacting the tension between *individual rationality* and *collective efficiency*, which is the central engine of cascade theory.

  Here is a move-by-move breakdown of who has the better of the argument, where they are talking past each other, and the terminology you're looking for.

  ### Move 1: Individual Rationality
  **Nora:** Diners ignoring their private hints are being irrational (cognitive bias).
  **Theo:** Diners ignoring their private hints are being Bayesianly rational (public info outweighs private info).

  **Verdict: Theo is correct.**
  In the standard BHW setup, agents are modeled as perfect Bayesian updaters. Once a cascade begins, the public history (the choices of prior diners) contains enough statistical weight that *no* single private signal is strong enough to overturn it.
  *   **Why Nora is wrong:** She is equating "ignoring data" with "irrationality." But rationality is about weighting evidence correctly, not using all evidence equally. If the public signal is worth 10 units and your private hint is worth 1 unit, ignoring the 1 unit is the rational move.
  *   **Why Theo is right:** He correctly identifies that the agents are optimizing their individual probability of choosing the better restaurant. To do otherwise (follow a weak private hint against a strong public consensus) would actually be the cognitive bias (an overconfidence in one's own noisy signal).

  ### Move 2: Systemic Failure
  **Nora:** Even if individuals are rational, the pooling mechanism has failed (the group isn't finding the best restaurant).
  **Theo:** Agrees something goes wrong, but frames it as information loss/fragility rather than reasoning errors.

  **Verdict: Nora is right on the *outcome*, Theo is right on the *diagnosis*.**
  *   **Nora's Win:** She correctly identifies that the *social welfare* is suboptimal. The whole point of having a crowd is to aggregate dispersed information (the "Wisdom of Crowds"). In a cascade, the crowd stops aggregating. If the early diners got unlucky and started a cascade for the *wrong* restaurant, the group will lock into the wrong choice with high probability. That is a system failure.
  *   **Theo's Win:** He correctly identifies that this failure is not due to "bad reasoning." It is a structural feature of sequential decision-making with observable actions but hidden signals.
  *   **The Friction:** Nora treats "something went wrong" as an indictment of the agents' behavior. Theo treats it as an indictment of the *information structure*.

  ### Move 3: Information Loss and Labeling
  **Nora:** (Implied) This is a bias/error.
  **Theo:** Choices stop carrying private information; a crowd of 50 looks like 50 pieces of evidence but is really only 2 or 3.

  **Verdict: Theo is correct.**
  This is the defining technical insight of the BHW model. Once a cascade starts, actions become **uninformative**.
  *   If Diner 50 sees 49 people in Restaurant A, and chooses A regardless of their hint, their choice tells Diner 51 *nothing* about Diner 50's hint. Diner 51 learns nothing new.
  *   Therefore, the "weight" of the crowd is illusory. The group's belief freezes based on the first few diners, and the subsequent 47 diners add zero new information to the pool.
  *   Nora's insistence on calling this a "bias" obscures the real danger: the system becomes blind to new information.

  ### Where They Talk Past Each Other
  They are conflating **Individual Rationality** with **Collective Efficiency**.

  1.  **Definition of "Rational":** Nora is using a colloquial definition (doing what seems sensible to maximize group truth). Theo is using the game-theoretic definition (maximizing individual expected utility given available information). In cascade models, individually rational behavior *causes* collectively inefficient outcomes. This is an **Information Externality**: when a diner follows the crowd, they gain a small benefit for themselves but impose a cost on the group by hiding their private information. They don't get "paid" to reveal their hint, so they don't.
  2.  **Definition of "Error":** Nora thinks the error is in the *agents* (they are biased). Theo thinks the error is in the *inference* (an observer treating correlated actions as independent signals).
  3.  **The "Wrongness":** Nora feels that because the outcome is bad, the process must be flawed. Theo argues the process is logically sound, but the *equilibrium* is fragile. They are arguing about whether the glass is broken (Nora) or whether water just flows downhill (Theo).

  ### The Terminology: What is Theo's "Gap"?
  You asked for the standard name for the gap Theo describes: *"A crowd of fifty diners sitting in A looks like fifty pieces of evidence for A when it may really be two or three."*

  There isn't one single noun that captures exactly that gap, but there are three standard terms in the literature that, when combined, describe it precisely. If you want to sound like you've read the BHW paper, use these:

  1.  **Uninformative Actions:** This is the technical term for what the diners are producing. Once the cascade starts, actions become uninformative. They reveal no private signal.
  2.  **Informational Redundancy:** This describes the gap itself. The 50 choices are redundant; they are not independent samples.
  3.  **Cascade Fragility:** This is the specific term BHW use to describe the *consequence* of that gap. Because the cascade rests on only the first few signals (the "two or three" Theo mentions), it is **fragile**. A small shock (e.g., a public announcement, or just a few agents with higher-quality signals) can shatter the cascade and reverse the crowd's behavior instantly.

  **The Best Label:**
  If you need a single phrase for the *phenomenon* Theo is pointing at, it is **The Fragility of Informational Cascades**.

  However, if you are looking for the name of the *error* an observer makes when they see 50 people and assume 50 independent signals, that is often called **Naive Inference** or failing to account for **Correlated Actions**.

  **Summary for the Group:**
  *   **Theo** wins on the mechanics: The agents are rational, the actions are uninformative, and the system is fragile.
  *   **Nora** wins on the welfare: The information aggregation has failed, and the outcome is inefficient.
  *   **The Term:** The gap between apparent and actual evidence is the result of **Uninformative Actions** leading to **Cascade Fragility**.

  You can tell them they are both half-right: Theo describes the *math*, but Nora describes the *tragedy*. The tragedy of the informational cascade is that rational individuals inevitably break the wisdom of the crowd.
