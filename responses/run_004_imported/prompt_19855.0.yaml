      *   *Responsibility:* Distinguish between *Causal Responsibility* (did this lead to that?) and *Moral Responsibility* (should this person be punished/shamed?).
      *   *The "Why Her" aspect:* Explicitly mention "Role Expectation." She is the designated reminder. That makes her omission more salient than others.
