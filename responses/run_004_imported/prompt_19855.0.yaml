answer: |-
  This is a really heavy situation, and it makes complete sense that you're wrestling with the logic of it. You are dealing with two separate but tangled issues here: the **philosophical/logical question** of whether "doing nothing" can cause something, and the **family dynamics question** of why the blame is landing on one person.

  Here is a breakdown of what is actually happening, which might help you navigate the conversation with your family and your sister.

  ### 1. Can "not doing something" be a cause?
  Your sister is arguing from a common intuitive feeling: that a "cause" must be an active force (like pushing a domino). But in logic, medicine, and law, **omission is absolutely recognized as a cause.**

  *   **The Logic:** If Event B (hospitalization) happens because Event A (taking meds) did *not* happen, then the absence of Event A is a causal factor.
  *   **The Analogy:** If a security guard falls asleep and a burglary happens, the guard didn't "do" anything to let the burglars in. But their *failure to act* is considered a cause of the security breach.
  *   **The Medical Reality:** In healthcare, adherence is part of the treatment. If a support system (your sister) is part of the adherence plan, a break in that support is a causal factor in the medical outcome.

  So, logically? **Yes, her forgetting contributed to the outcome.** It isn't the *only* cause (more on that in a second), but it is incorrect to say it had no effect.

  ### 2. Why is the blame only on her?
  This is where the logic gets messy and the family dynamics take over. You and your mom also "did nothing," but you aren't being blamed. This comes down to **Role Expectation.**

  *   **Assigned Duty:** Your sister has the "job." In any system (a family, a company, a team), the person assigned the task bears the brunt of the responsibility when the task fails. If a goalie lets in a goal, we blame the goalie, not the striker who didn't run back to defend.
  *   **Salience:** Because she *usually* does it, her *not* doing it is noticeable. You and your mom not doing it is "normal," so it goes unnoticed.
  *   **Scapegoating:** When a family is scared (Dad being in the hospital is terrifying), they often look for a single source of control to make sense of the chaos. Blaming the sister creates a narrative: "Dad got sick because Sister forgot." This is comforting because it implies that if Sister just remembers next time, Dad will be safe. It ignores the scarier truth: **The system was too fragile.**

  ### 3. The "Single Point of Failure" Problem
  The hardest truth for your family to accept is that **this wasn't just your sister's failure; it was a system failure.**

  Relying on one person's memory for a critical heart medication is a "single point of failure." It is risky engineering, whether in a bridge or a family routine.
  *   **Dad's Agency:** Ultimately, your dad is an adult. While he may need reminders, the responsibility for his health primarily lies with him.
  *   **The Safety Net:** A robust system would have a pill organizer, an alarm on his phone, *and* a family reminder. By making your sister the *only* reminder, the family inadvertently set her up to be the sole barrier between Dad and the hospital.

  ### 4. How to handle this
  You are in a unique position to mediate because you see both sides.

  **To validate your sister (without validating denial):**
  You can tell her: *"You're right that you didn't actively hurt him, and it's unfair that everyone is acting like you broke something on purpose. But in a care routine, forgetting is the same as failing the task. However, it shouldn't be all on you."*

  **To validate the family (without validating scapegoating):**
  You can tell them: *"Yes, her reminder was part of the plan and it failed. But if one forgotten reminder lands Dad in the hospital, our plan was too weak. Blaming her doesn't fix the plan."*

  **Moving Forward:**
  The goal shouldn't be to decide who is "guilty." The goal should be to ensure it doesn't happen again. You might suggest:
  1.  **Removing the human element:** Get an automatic pill dispenser or a loud alarm clock for Dad.
  2.  **Shared rotation:** If reminders are needed, put it on a family calendar so the duty rotates.
  3.  **Reframing the narrative:** Remind everyone that Dad is okay now, and piling guilt on your sister increases stress, which actually makes *more* forgetfulness likely in the future.

  **Summary:**
  Your sister is wrong that "not doing something" can't cause an outcome; in care dynamics, it definitely can. But the family is wrong to treat this as *solely* her moral failing. It was a structural failure that happened to land on her watch. Acknowledging both truths might help lower the temperature.
