answer: |-
  There is a significant misconception in the premise of your question that is crucial to address before tackling the historical "why." If you base your piece on the idea that Aquinas explicitly endorsed private assassination of tyrants as "praiseworthy," your historical analysis will be on shaky ground.

  While Aquinas is often *claimed* by later proponents of tyrannicide, his actual position was far more cautious, nuanced, and restrictive than the "license for regicide" you describe.

  Here is a breakdown of what Aquinas actually argued, why the Church didn't promote regicide, and why medieval Europe didn't see a wave of Thomistic assassinations.

  ### 1. Correcting the Premise: What Aquinas Actually Said
  The passage you are likely thinking of is from *De Regno* (On Kingship), Book I, Chapter 6. It is true that Aquinas acknowledges that some tyrants have been killed. However, he does not issue a blanket permission for private individuals to do so.

  *   **Public vs. Private Authority:** Aquinas makes a critical distinction between public authority and private individuals. He argues that if a tyrant is imposed by a higher authority (like the Emperor or the Pope), that higher authority should remove him. If the right to appoint the king belongs to the people, the people (as a collective body) may depose him. He is extremely wary of **private individuals** taking it upon themselves to kill a ruler.
  *   **The Risk of Greater Evil:** In *De Regno*, Aquinas explicitly warns against assassination. He argues that killing a tyrant often leads to greater instability or a worse tyrant taking their place. He cites the example of Julius Caesar: after he was killed for aspiring to tyranny, a worse civil war ensued.
  *   **The "Praiseworthy" Quote:** Aquinas does mention that killing certain tyrants was "praised" by wise men of old (referencing classical antiquity and the Old Testament), but he frames this as a historical observation rather than a prescriptive theological command for Christians. In the *Summa Theologiae* (II-II, Q. 42, A. 2), he states that resisting a tyrant is not sedition *unless* it causes greater harm to the community than the tyranny itself.
  *   **Divine Intervention:** Ultimately, Aquinas concludes that if there is no human remedy for tyranny, the people must turn to God, not daggers. "For it is not to be presumed that there is no remedy... unless it be sought from God."

  **The Takeaway:** Aquinas provided a framework for *deposition* (removing legitimacy), not *assassination* (physical killing). He prioritized order and the common good over the removal of a specific individual if that removal caused chaos.

  ### 2. Why the Church Didn't Use This "License"
  Even if Aquinas had been more explicit, the institutional Church had strong reasons not to promote regicide:

  *   **The Sanctity of Order:** The medieval worldview prioritized hierarchy and order (The Great Chain of Being). Anarchy was considered a greater threat to salvation than tyranny. A bad king was seen as a punishment from God for the people's sins; killing him was interfering with Divine Providence.
  *   **The Fifth Commandment:** "Thou shalt not kill" was a hard barrier. Unless there was a clear, public declaration of war or a judicial sentence, killing a king was murder. The Church reserved the right to excommunicate kings (releasing subjects from their oaths of fealty), which was a political tool far safer and more effective than endorsing murder.
  *   **The "Two Swords" Doctrine:** The Church claimed spiritual authority; the King claimed temporal authority. While the Pope could depose a king (as Innocent III did with King John of England), endorsing physical assassination blurred the line and risked making the Church look like a political conspirator, undermining its spiritual moral authority.

  ### 3. Why There Weren't More Assassinations
  Beyond theology, there were practical and feudal reasons why "Thomistic reasoning" didn't lead to a spike in regicide:

  *   **Feudal Oaths:** Vassalage was a sacred contract. Breaking an oath to a liege lord was a spiritual crime (perjury) as well as a legal one. Even if a king was unjust, the immediate spiritual risk to the assassin's soul was certain, whereas the theological justification was debatable.
  *   **Succession Crises:** Killing a king rarely ended a tyranny; it usually started a civil war. Medieval succession laws were often murky. Assassinating a king invited rival claimants to fight over the body, causing more suffering for the "common good" than the tyranny did.
  *   **Interpretation was Key:** Who decides the king is a tyrant? If any disgruntled noble could claim the king was governing for "self rather than common good" to justify murder, the kingdom would collapse into warlordism. The threshold for "tyranny" was kept intentionally high (usually requiring heresy or direct attack on the Church) to prevent this.

  ### 4. Who *Did* Argue for Tyrannicide?
  If you are writing about religious justifications for killing dictators, Aquinas is the wrong anchor. You should look to later periods where the theory became more radical:

  *   **The Conciliarists (15th Century):** During the Great Schism, thinkers argued that a Pope could be deposed if he harmed the Church.
  *   **The Monarchomachs (16th Century):** Protestant and Catholic theorists during the Wars of Religion (like George Buchanan or the author of *Vindiciae contra Tyrannos*) argued much more explicitly for the right to resist and kill tyrannical rulers.
  *   **Juan de Mariana (1599):** A Spanish Jesuit who wrote *De Rege et Regis Institutione*. He is the one who actually got into trouble. He argued that a tyrant could be killed by a private citizen if no public remedy existed. His book was publicly burned by the Parliament of Paris after the assassination of Henry IV, precisely because it was seen as a "license for regicide."

  ### Summary for Your Piece
  The reason medieval Europe didn't see a wave of Thomistic assassinations is that **Aquinas didn't actually call for them.**

  He argued that unjust laws need not be obeyed, and that tyrants could be deposed by public authority, but he explicitly warned against private assassination due to the risk of greater evil. The Church preferred the tool of **excommunication** (which legally dissolved the bond between king and subject) over the tool of **assassination** (which was murder). The "radical license" you perceive is largely a later interpretation or a conflation with 16th-century Jesuit theory, not 13th-century Thomism.

  If you characterize Aquinas as endorsing regicide, historians will likely flag it as an error. A more compelling angle might be: *"Why did later revolutionaries claim Aquinas supported tyrannicide when his actual text warns against it?"* That tension reveals more about how political theology is weaponized than the theology itself.
