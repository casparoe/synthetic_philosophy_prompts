prompt: |-
  This has kind of taken over my brain lately: I'm Deaf (grew up signing, went to a Deaf school, basically my whole social life is Deaf), and I just found out from an audiologist that I actually qualify for a cochlear implant now, which wasnt true last time I looked into it a few years ago. My hearing brother keeps telling me to just treat this like any other big decision — make a pros and cons list, put rough numbers on stuff like job prospects and safety versus the surgery, cost, and recovery, and go with whatever wins. I actually tried that this week and it left me more lost, not less, because I have no idea how to weigh "maybe I get to hear music" against "maybe I stop feeling like myself, or like part of my community," especially since I don't even know what hearing would be like for me and can't exactly test it out first. Late-implanted Deaf adults seem to land all over the place on this, and a couple people in my Deaf group act like even considering it means something's wrong with being Deaf, which honestly isn't where I'm coming from. Is my brother right that I'm overthinking a pretty normal cost-benefit call, or is there something actually different about a decision like this — and if so, how am I even supposed to think it through?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Situation:**
      *   **User Identity:** Deaf adult (culturally Deaf, grew up signing, Deaf school, Deaf social circle).
      *   **The Trigger:** Recently qualified for a Cochlear Implant (CI), which wasn't an option before.
      *   **The Conflict:** Internal conflict about identity/community vs. potential benefits (music, safety, job).
      *   **External Pressure/Advice:** Hearing brother suggests a standard pros/cons list (utilitarian/cost-benefit analysis). Some Deaf peers suggest considering it is a betrayal of Deaf identity.
      *   **The Core Question:** Is my brother right (is this a normal cost-benefit decision?), or is this different? If it's different, how do I think it through?
      *   **Emotional State:** Anxious, "taken over my brain," feeling lost, pressured from both sides.

  2.  **Evaluate the Brother's Advice:**
      *   *Pros:* Logical, structured, practical for many life decisions (buying a house, changing jobs).
      *   *Cons:* Fails to capture the existential, identity-based, and sensory-unknown nature of this specific decision. You can't put a number on "feeling like myself." You can't accurately predict "hearing music" because neural plasticity varies wildly in late-implanted adults.
      *   *Verdict:* The brother means well, but his framework is insufficient for *this* specific decision. It's not *just* a medical/financial decision; it's an identity decision.

  3.  **Evaluate the Deaf Community Pressure:**
      *   *Pros:* Protects cultural identity, validates Deaf gain, warns against medical model oppression.
      *   *Cons:* Can be gatekeeping, shaming, and ignore individual autonomy. Suggests there's only one "right" way to be Deaf.
      *   *Verdict:* Valid concerns about community belonging, but shouldn't dictate personal medical choices.

  4.  **Determine the Nature of the Decision:**
      *   It is *not* a normal cost-benefit call. It involves:
          *   **Identity:** How I see myself and how others see me.
          *   **Uncertainty:** The outcome (hearing ability) is unpredictable.
          *   **Irreversibility:** Surgery destroys residual hearing (usually).
          *   **Community:** Potential shift in social dynamics.
          *   **Sensory Experience:** Unknown qualitative change.

  5.  **Formulate a Strategy for the User:**
      *   **Validate:** Acknowledge the weight of the decision. It *is* different. The brother is oversimplifying.
      *   **Reframe:** Move away from "Fixing vs. Betraying" to "Adding vs. Changing."
      *   **Actionable Steps:**
          *   Talk to *late-implanted* Deaf adults (specifically culturally Deaf ones, not just oral deaf).
          *   Explore the "Why Now?" (Is it burnout? Curiosity? External pressure?).
          *   Separate Identity from Technology (CI doesn't make you Hearing).
          *   Trial/Simulation (if possible, though limited).
          *   Give permission to wait or say no.
      *   **Tone:** Empathetic, respectful of Deaf culture, non-prescriptive (I am an AI, not a counselor or audiologist), validating.

  6.  **Drafting the Content (Iterative Process):**

      *   *Opening:* Validate the feeling. It's huge. The brother is wrong about it being "normal."
      *   *Addressing the Brother:* Explain *why* the pros/cons list fails here. (Qualitative vs. Quantitative).
      *   *Addressing the Community:* Acknowledge the tension. It's okay to be Deaf and curious about tech.
      *   *The "Unknown":* Address the fear of "what will it sound like?" (Robot voice, overwhelming noise).
      *   *Framework for Decision:*
          1.  **Motivation Check:** Internal vs. External.
          2.  **Identity Integration:** CI as a tool, not a cure.
          3.  **Community Navigation:** Finding the middle ground (bilingual/bimodal).
          4.  **The "No" Option:** It's okay to not do it.
      *   *Resources:* Suggest specific types of people to talk to (Deaf CI users).

  7.  **Refining the Tone (Cultural Sensitivity):**
      *   Use capital "D" Deaf where appropriate (cultural identity).
      *   Avoid medical model language like "suffering from hearing loss" or "restoring hearing." Use "access," "sound," "residual hearing."
      *   Acknowledge the history of oppression (oralism) without getting bogged down in it.
      *   Ensure the user feels supported regardless of the choice.

  8.  **Final Review against User Query:**
      *   Did I answer "Is my brother right?" Yes (No, not entirely).
      *   Did I answer "Is there something different?" Yes (Identity/Identity).
      *   Did I answer "How to think it through?" Yes (Provided framework).
      *   Did I acknowledge the Deaf community pressure? Yes.

  9.  **Final Polish:** (Self-Correction during drafting) *Make sure I don't sound like I'm pushing them toward the CI. The goal is clarity, not a specific outcome.* *Emphasize that residual hearing loss is permanent.* *Highlight that 'Deaf' is not a monolith.*

