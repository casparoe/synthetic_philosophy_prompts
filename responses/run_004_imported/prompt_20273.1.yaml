answer: |-
  This is a fantastic question. You have hit on exactly the right nerve: the tension between Lewis's metaphysics (Humean Supervenience) and his epistemology (the Principal Principle). Many people nod at the Principal Principle (PP) because it sounds like common sense, but you are correct that once you plug in Lewis's specific definition of "chance," the common sense breaks.

  You asked for the shape of the disagreement, not just a list of positions. The shape is this: **Lewis wanted a metaphysics without "secret powers" (Humeanism), but that metaphysics makes chance look backward at the whole history of the universe. The Principal Principle requires chance to look forward to guide belief. The "Big Bad Bug" is the collision between looking backward and looking forward.**

  Here is the walkthrough of the problem, the fix, and the alternatives.

  ---

  ### 1. Why Undermining is a Genuine Problem (The "Retroactive Law")

  To see why this isn't just a technicality, we have to look at what the Principal Principle (PP) demands versus what Humean Supervenience allows.

  **The Principal Principle (Simplified):**
  If you know the objective chance of event $A$ is $x$, your credence (degree of belief) in $A$ should be $x$.
  $$C(A \mid \text{Chance}(A) = x) = x$$
  Crucially, this assumes the information "Chance$(A) = x$" is *admissible*. That means it's information about the setup (the coin, the physics) that doesn't secretly tell you the outcome.

  **Lewis's Humean Chance:**
  For Lewis, there are no "propensities" or hidden powers in the coin. The chance is just a summary of the pattern of events in the **entire history of the world** (past, present, and future). The "Best System" is the set of equations that best balances simplicity and fit with the *total* mosaic of events.

  **The Collision:**
  Imagine a coin that, according to the Best System *right now*, has a 50% chance of heads.
  Now, imagine a possible future (call it $F$) where the coin lands heads 1,000 times in a row.
  *   **According to the PP:** Since the chance is 50%, the probability of $F$ occurring is small, but definitely greater than zero. You must assign it some credence.
  *   **According to Humeanism:** If $F$ *actually* occurs, then the total history of the world includes 1,000 heads. A Best System analysis of *that* total history would likely conclude the chance of heads was 100%, not 50%.

  Here is the contradiction:
  1.  If the chance is truly 50% now, then $F$ is possible (PP).
  2.  But if $F$ happens, then the chance *was not* 50% (Humeanism).
  3.  Therefore, the proposition "The chance is 50%" is logically incompatible with the proposition "$F$ occurs."

  If two propositions are incompatible, your credence in one given the other should be **zero**. But the PP says your credence should be **positive** (whatever the chance is).

  **The "Retroactive Law" Analogy:**
  Imagine a speed limit sign that says "50 mph." But the law says the speed limit is determined by a committee that meets *next year* to review the total traffic flow of the decade. If you drive 100 mph for a year, the committee might retroactively decide the speed limit was always 100 mph to make the data fit better.
  If you see the sign saying "50," the PP says: "Believe there's a small chance I can drive 100 mph without breaking the law."
  But Humeanism says: "If you *do* drive 100 mph, the sign was wrong all along."
  So, can you really defer to the sign? The sign's authority depends on you *not* doing the very thing the sign says is possible. That is the "Big Bad Bug." It makes the concept of chance self-undermining.

  ---

  ### 2. The New Principal Principle (NPP): Fix or Dodge?

  Lewis knew he couldn't abandon Humeanism (it was central to his metaphysics), so he had to abandon the original PP. He proposed the **New Principal Principle (NPP)** in his 1994 paper "Humean Supervenience Debugged."

  **What Changes?**
  The original PP told you to condition your credence on the chance claim alone: $C(A \mid \text{Chance}(A) = x)$.
  Lewis realized that for a Humean, the claim "Chance$(A) = x$" is *inadmissible* because, as we saw above, it contains hidden information about the future (specifically, that the future won't be an undermining future).

  The NPP says you should condition on the chance claim **plus the theory of chance ($T$)** that links histories to chance functions.
  $$C(A \mid \text{Chance}(A) = x \ \& \ T) = x$$

  **How This Solves the Logic:**
  By adding $T$, you are explicitly acknowledging the Humean rulebook. $T$ says: "The chance function is the one that best fits the total history."
  When you calculate your credence now, you aren't just saying "The chance is 50%." You are saying, "The chance is 50% *relative to the hypothesis that the future history will be one that makes 50% the best fit.*"
  This effectively filters out the undermining futures from the calculation. You defer to the chance function only insofar as it remains the best system.

  **Is it a Real Solution or a Dodge?**
  This is where philosophers split.

  *   **The Defense (It's a Solution):** Lewis argues this is just being precise. We never really meant to defer to chance *if* doing so would prove the chance wrong. The NPP captures the rational core of the PP without the logical contradiction. It saves Humeanism.
  *   **The Criticism (It's a Dodge):** Critics (like Michael Black and Carl Hoefer) argue this drains the PP of its normative force. The whole point of the PP was that chance *guides* belief. But if I have to check the "theory of chance" and verify that the future won't undermine the chance before I defer to it, I'm not really deferring to chance anymore; I'm deferring to my best guess about the total history of the universe.
      *   It makes chance **opaque**. Instead of "Chance is 50%, so I believe 50%," it becomes "Chance is 50%, provided the future doesn't look too weird, so I believe 50%."
      *   Some argue this concedes that Humean "chance" isn't real chance. It's just a summary statistic that we pretend to defer to.

  **Verdict:** It is a logically consistent fix, but it comes at the cost of intuition. It saves the metaphysics by complicating the epistemology.

  ---

  ### 3. Non-Humean Alternatives: Escaping the Mess?

  Your third question asks if a Non-Humean view (Primitivism or Propensity) avoids this. The short answer is **yes**, but it trades a logical bug for a metaphysical cost.

  **How They Avoid the Bug:**
  In a Propensity view (e.g., Karl Popper or Donald Gillies), chances are real, physical dispositions located in the **present**. The coin has a physical bias *now*.
  *   If the coin has a 50% propensity now, that is a fact about the current setup.
  *   If the future turns out to be 1,000 heads, that is just a rare streak. It does **not** change the fact that the propensity *was* 50% at the time of the toss.
  *   The future does not determine the present chance. Therefore, there are no "undermining futures." The proposition "Chance is 50%" is compatible with any future sequence, however unlikely.
  *   Consequently, the **Original Principal Principle works perfectly** for Non-Humeans. No need for the NPP fix.

  **The Cost (The "Point in its Favor"):**
  If Non-Humeans get to keep the intuitive PP, isn't that a win?
  *   **The Pro:** It preserves the link between chance and rational belief. It treats chance as a genuine guide for action, not a retrospective summary.
  *   **The Con (The Humean Retort):** Lewis would ask: "What *are* these propensities?"
      *   You can't see them. You can't measure them directly (you only measure outcomes).
      *   They seem to be "necessary connections" in nature, which Humeans reject as mystical.
      *   **The Access Problem:** If chances are independent of the actual frequencies, how do we ever know what they are? If a coin lands heads 1,000 times, a Humean says "The chance was probably 100%." A Propensity theorist says "The chance might still have been 50%; we just got unlucky." But if the chance can be 50% even if the frequency is 100%, how do we ever confirm the chance?

  **Is it a Genuine Advantage?**
  It depends on what you value more:
  1.  **Metaphysical Parsimony (Humeanism):** You want a world made only of events in space-time. You are willing to accept the complex NPP to avoid "spooky" propensities.
  2.  **Conceptual Clarity (Non-Humeanism):** You want chance to be the kind of thing that guides belief simply and directly. You are willing to accept "hidden powers" in nature to keep the Principal Principle clean.

  Many modern philosophers (like Carl Hoefer) try to find a middle ground: "Humean Objective Chance." They try to keep the Humean mosaic but define chance in a way that doesn't look at the *entire* future, just enough to avoid the bug. But this is technically difficult.

  ### Summary of the Disagreement

  You asked to understand the shape of the disagreement. Here it is:

  *   **The Humean (Lewis):** "I want a world without magic. Chance is just a pattern. Yes, that makes the link between chance and belief complicated (NPP), but better complicated belief than magic ontology."
  *   **The Non-Humean:** "I want chance to be real. If chance is just a pattern, it can't guide belief until the pattern is finished (the future is known). So chance must be a real power. Yes, that's metaphysically heavy, but it saves the rationality of induction."

  **The "Big Bad Bug" proves you cannot have it all.** You cannot have (1) a purely Humean metaphysics, (2) the original intuitive Principal Principle, and (3) the possibility of undermining futures. You must drop one.
  *   Lewis dropped (2). (He adopted the NPP).
  *   Non-Humeans drop (1). (They adopt propensities).
  *   Some (like Hoefer) try to drop (3). (They argue undermining futures aren't possible or relevant, though this is hard to sustain).

  Since you are teaching yourself out of curiosity, my advice is to side with whichever cost bothers you less: **Do you mind revising how you understand rational belief (NPP), or do you mind positing invisible physical powers (Propensity)?** That is the actual philosophical trade-off.
