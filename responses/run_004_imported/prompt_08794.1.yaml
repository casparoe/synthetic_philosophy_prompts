answer: |-
  **Mara:** Pull your collar up. The light has gone from gold to grey in the last ten minutes. It's dropping fast.

  **Elias:** It is. And I know it is. In fact, since I know it, I'm also in a position to know that I know it. The transparency is perfect, Mara. My access to my own mind doesn't lag behind the weather.

  **Mara:** That transparency is exactly what I'm worried about. Let's trace the last ten minutes. Call the moment we sat down $t_0$. You felt cold then?

  **Elias:** A little.

  **Mara:** And now, at $t_{10}$, you definitely feel cold. But imagine we break that time down into milliseconds. $t_1, t_2, t_3$... In any adjacent pair of moments, say $t_i$ and $t_{i+1}$, the temperature change is imperceptible. You couldn't tell them apart.

  **Elias:** Granted. Sensory discrimination has a threshold.

  **Mara:** So, if you know you feel cold at $t_i$, and $t_{i+1}$ is phenomenologically indistinguishable from $t_i$, you must also know you feel cold at $t_{i+1}$. If you didn't know it at the second moment, your knowledge would have vanished without you being able to notice the change.

  **Elias:** I see where you're going. You want to walk me down the sorites. If I know at $t_0$, and knowledge persists across indistinguishable moments, then I must know I'm cold right now even if I'm actually freezing, or conversely, I must have known I was warm back at $t_0$ when I wasn't. You're trying to break the link between knowing and being right.

  **Mara:** I'm trying to break the KK principle. If knowing $p$ guaranteed you were in a position to know you know $p$, then your epistemic state would have to be luminous. It would have to glow so brightly you couldn't miss it. But if the series of moments is long enough, and the steps small enough, you end up claiming knowledge in a case where you're clearly wrong. At some point, the cold is too slight to count as "feeling cold," yet your KK commitment forces you to say you know you feel it.

  **Elias:** But you're conflating the sensation with the epistemic state. Warmth is analog; it fades gradually. That's why the sorites works on the temperature. But knowledge isn't analog, Mara. It's digital. It's a switch. Either I have the justification and the truth, or I don't. There are no borderline cases of knowledge itself. I don't "sort of" know. So, your gradual cooling doesn't apply to the state of knowing. The switch just snaps off at the precise moment the proposition becomes false.

  **Mara:** Even if the switch is sharp, Elias, you still have to be able to see the switch. That's the margin-for-error principle. Knowledge requires safety. To know $p$, you couldn't easily have been wrong about $p$.

  **Elias:** I agree safety is necessary. But if the switch is sharp, there is a fact of the matter about where I stand.

  **Mara:** There is a fact, but *you* don't have access to it without error. Suppose the sharp boundary between "knowing you feel cold" and "not knowing" falls between $t_k$ and $t_{k+1}$. At $t_k$, you know. At $t_{k+1}$, you don't. But since $t_k$ and $t_{k+1}$ are indistinguishable to you, your evidence is the same in both cases.

  **Elias:** So you're saying my evidence is insufficient to locate the sharp boundary.

  **Mara:** I'm saying that if your evidence is the same in $t_k$ and $t_{k+1}$, you can't safely believe you know at $t_k$. Why? Because if you believe you know at $t_k$, you would also believe you know at $t_{k+1}$, given you can't tell them apart. But at $t_{k+1}$, by hypothesis, you *don't* know. So, in believing you know at $t_k$, you are relying on a cognitive mechanism that would also lead you to claim knowledge in a case where knowledge is absent.

  **Elias:** You're arguing that the reliability of the mechanism degrades near the boundary.

  **Mara:** I'm arguing that the margin for error is constitutive of knowledge. To know, your belief must not only be true, it must be safe from error in nearby possible worlds. The world where the temperature is a fraction higher—$t_{k+1}$—is a nearby world. In that world, you hold the same belief ("I know I'm cold"), but it's false. Because you can't discriminate $t_k$ from $t_{k+1}$, your belief at $t_k$ isn't safe. Therefore, you don't know at $t_k$.

  **Elias:** So you're imposing a buffer zone. You're saying that even if the truth conditions for knowledge are sharp, the *warrant* requires a cushion of safety that pushes the boundary of knowledge back from the boundary of truth.

  **Mara:** Exactly. And if that buffer zone exists, then there are cases where you know $p$, but you cannot know that you know $p$. Because to know that you know, you'd need to be safe from error about your own safety. You'd need a margin for error on top of your margin for error. Eventually, the cooling air eats up the buffer. You know you're cold, Elias, but the chill is too close to the threshold for you to know *that* you know.

  **Elias:** *(Shivering slightly)* That's a lonely conclusion. It suggests the mind isn't fully visible to itself.

  **Mara:** It suggests the mind is part of the world, subject to the same gradients as the air. *(She pulls her coat tighter.)* Do you know you're cold now?

  **Elias:** Yes.

  **Mara:** Do you know that you know?

  **Elias:** *(Pauses, listening to the silence of the park.)* I know I'm cold. Whether I know that I know... the margin feels a little too thin to call it.

  **Mara:** Then the KK principle is false. And the evening has proven it.

  **Elias:** Or perhaps it just proved we should have brought heavier coats. But... I concede the point on the margin. If I can't distinguish the safety from the risk, I can't claim the higher-order knowledge.

  **Mara:** Good. Now, do you know we should go inside?

  **Elias:** I know that. And I think, given the temperature differential between here and the café, I even know that I know that.

  **Mara:** *(Smiling.)* A large enough gap. Safe enough. Let's go.
