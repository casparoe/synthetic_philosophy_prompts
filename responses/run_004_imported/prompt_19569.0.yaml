      *   **Strategy 1: Phenomenological Interviewing.** Use the labels as starting points for thick description. Ask *what* constitutes the feeling (somatic, cognitive, situational).
      *   **Strategy 2: Triangulation.** Correlate labels with physiology (HRV, skin conductance), behavior, or situational context.
      *   **Strategy 3: Consensus Building.** Teach the labels to others. Can they learn to distinguish 'tense-restless' from 'tense-heavy' in *themselves* or even in *you* (via observation)?
      *   **Strategy 4: Grounded Theory Approach.** Treat the labels as emergent codes that need definition through constant comparison, not just introspective pointing.
      *   **Strategy 5: Idiographic vs. Nomothetic.** Frame it as an N=1 study first, but acknowledge the limitation. To generalize, you need translation.

