      *   *Decision:* I will recommend **rejecting the label "Pure Time Preference"** (to satisfy Objectors) but **adopting a ~1.5% "Epistemic & Institutional Decay Rate"** (to satisfy Quant Lead). This keeps the math but fixes the ethics. I will also explicitly separate the three components as requested.

