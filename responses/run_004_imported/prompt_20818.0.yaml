      *   *Pure Time Preference (PTP):* Ethically controversial in EA. Standard view (Longtermism) is $\delta = 0$. However, practical decision-making often requires $\delta > 0$ to avoid paralysis or counterintuitive results (e.g., investing everything for the far future).
      *   *Growth/Diminishing Marginal Utility (DMU):* Future people might be richer, so money helps less. This is a valid economic discount, distinct from PTP.
      *   *Existence/Probability:* The chance the world ends or the intervention fails. This is risk discounting, distinct from PTP.
      *   *The "Real" Problem:* If $\delta = 0$ and we accept non-zero probabilities of astronomical value (AI safety), expected value calculations get dominated by tiny probabilities of huge far-future payoffs. This leads to "cluelessness" or the conclusion that we should save every dollar for later (patient philanthropy). The Quant Lead wants to avoid this practical impasse.
      *   *The Stern-vs-Nordhaus Parallel:* Stern (low discount, urgent climate action now for future) vs. Nordhaus (higher discount, balance with present costs). Here, it's inverted: Low discount favors longtermism (AI safety), higher discount favors neartermism (bednets). Wait, actually, in climate, Stern says *save the future* (low discount rate = high value on future damages). In EA, low discount rate = high value on future lives = *more* AI safety funding. High discount rate = *less* AI safety funding relative to bednets. So the Quant Lead is arguing for Nordhaus (higher discount), the Objectors for Stern (lower/zero discount).
