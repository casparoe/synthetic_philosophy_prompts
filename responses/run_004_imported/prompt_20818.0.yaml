answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Discount Rate Methodology for Q4 Grant Cycle

  ### Executive Summary

  We need to finalize the discounting methodology for our internal cost-effectiveness models before the quarterly meeting. The current debate centers on whether to include a ~1.5% "Pure Time Preference" (PTP) term.

  **Recommendation:** I propose we **reject the label and ethical justification of "Pure Time Preference"** (satisfying the Sidgwick/Ramsey objection) but **adopt a ~1.5% "Epistemic & Institutional Horizon" discount** (satisfying the Quant Lead's operational concerns).

  This approach keeps the three discount components distinct, prevents our models from collapsing into "permanent deferral" paralysis, and remains ethically defensible within an EA framework. It acknowledges that while future lives may not matter *less*, our ability to reliably impact them decays over time due to uncertainty and institutional risk.

  ### 1. Context: The Three Components

  To avoid the blurring that plagued our previous guidance, we must treat these three discount factors as mathematically and ethically distinct. Our new guidance will explicitly separate them:

  1.  **Pure Time Preference ($\delta$):** A judgment on whether a life saved in 2100 is intrinsically less valuable than a life saved in 2024.
      *   *Ethical Standard:* EA consensus leans heavily toward $\delta = 0$ (Ramsey/Sidgwick). Discriminating based solely on temporal location is difficult to justify ethically.
  2.  **Growth / Diminishing Marginal Utility ($\eta \times g$):** A judgment on whether future beneficiaries will be richer (or poorer) than current ones, affecting how much welfare a dollar buys.
      *   *Economic Standard:* Standard practice. If we expect global wealth to increase, the marginal utility of cash transfers may decrease.
  3.  **Existence / Probability Discount ($p$):** The probability that the beneficiaries never come into existence (existential risk) or that the intervention fails to trigger the intended chain of causality.
      *   *Risk Standard:* Standard expected value calculation.

  **The Conflict:** Our Quant Lead argues for baking a flat 1.5% into Component 1. Our ethical objectors argue Component 1 must be zero.

  ### 2. The Core Tension: Ethics vs. Decision Theory

  The objectors are ethically correct: there is no rational basis for claiming a future person matters less simply because they exist later. If we set $\delta > 0$ on ethical grounds, we are enshrining a bias we claim to oppose.

  However, the Quant Lead's concern is not actually about *impatience*; it is about **decision-theoretic stability**. As the Stern-vs-Nordhaus analogy highlights, a hard zero on PTP, combined with non-zero probabilities of astronomical future value (AI safety/biosecurity), creates two failure modes:
  1.  **Permanent Deferral:** The model suggests we should invest all capital indefinitely rather than spend it now (the "patient philanthropy" trap).
  2.  **Cluelessness Dominance:** Grants with the most uncertain, far-flung payoffs dominate the portfolio simply because the time horizon is long enough to accumulate astronomical expected value, regardless of epistemic humility.

  If we adopt $\delta = 0$ without addressing this, our model ceases to be a tool for allocation and becomes an argument for indefinite hoarding or high-risk speculation.

  ### 3. Proposed Resolution: The "Epistemic & Institutional Horizon"

  I recommend we set the **Ethical Pure Time Preference to 0%**, but introduce a new operational parameter: **Epistemic & Institutional Decay (~1.5%).**

  **The Distinction:**
  *   **Old Proposal (PTP):** "A life in 2100 is worth 1.5% less per year than a life in 2024." (Ethically indefensible).
  *   **New Proposal (Decay):** "Our confidence in the causal link between our grant and a life in 2100 decays by 1.5% per year due to model uncertainty, institutional risk, and changing moral contexts." (Operationally necessary).

  This satisfies the Quant Lead because the math remains identical (we still discount far-future flows by ~1.5%/year), preventing the deferral trap. It satisfies the Objectors because we are not discounting the *value of the life*, but rather the **reliability of our intervention** and the **persistence of our agency**.

  This aligns with how we already handle "cluelessness." We are not saying the future doesn't matter; we are saying our map of the future gets foggy.

  ### 4. Updated Guidance Text

  I have drafted the following language for our evaluator handbook to replace the current Section 4.2:

  > **4.2 Intertemporal Comparison and Discounting**
  > Evaluators must calculate present value using three distinct factors. Do not conflate these into a single "discount rate."
  >
  > *   **A. Ethical Time Preference:** Set to **0%**. We assign equal moral weight to welfare regardless of when it occurs.
  > *   **B. Marginal Utility of Wealth:** Adjust based on projected economic growth in the beneficiary population. (Default: 1.0% adjustment for global health; variable for longtermist interventions).
  > *   **C. Epistemic & Institutional Horizon:** Apply a **1.5% annual decay factor** to expected value calculations for interventions with payoff horizons >10 years.
  >     *   *Justification:* This does not reflect a lower value on future lives. It reflects the decreasing probability that our current causal models remain valid, that our institutional memory persists, or that the intervention's effects are not overwritten by exogenous technological or political shifts.
  >     *   *Application:* This functions as a "hurdle rate" for long-termism. It prevents the portfolio from being dominated by low-probability, high-astronomical-value claims where our epistemic confidence is below a functional threshold.

  ### 5. Why This Works

  1.  **Prevents Deferral:** By applying the decay to the *intervention's* expected value rather than the *beneficiary's* worth, we justify spending now. We spend now because our ability to help *later* is less certain, not because *they* matter less.
  2.  **Maintains Integrity:** We can publicly state we do not discount future lives on principle, preserving our alignment with longtermist ethics.
  3.  **Operationalizes Humility:** It formalizes the intuition that a bednet's impact is more knowable than a biosecurity protocol's impact 50 years from now, without needing to claim the biosecurity impact is less *important*.

  ### 6. Next Steps

  At the quarterly meeting, I will move to adopt this tripartite framework.
  *   **For the Quant Lead:** You get the 1.5% term in the spreadsheet, ensuring our allocation logic doesn't break under longtermist weight.
  *   **For the Objectors:** You get an ethical framework that respects the Sidgwick/Ramsey critique and avoids explicit time-discrimination.

  This allows us to move past the Stern/Nordhaus stalemate. We are not setting a social discount rate for the universe; we are setting an operational confidence interval for a small foundation operating in an uncertain world.

  Please review the drafted handbook text above. If there are no major objections, I will finalize the document for voting on Tuesday.

  Best,

  [Your Name]
