          *   *Standard Textbook Example:*
              *   Feasible Set: A triangle or a curved region.
              *   Let's define the "Ideal Point" (Utopia Point).
              *   Player 1 max: 100 (if P2 gets 0).
              *   Player 2 max: 50 (if P1 gets 0).
              *   Disagreement: $(0,0)$.
              *   Feasible Frontier: Let's make it a curve where the "middle" isn't obvious.
              *   Let's use the function: $u_2 = 50 \cdot (1 - (u_1/100)^2)$. This is a quarter ellipse.
              *   Wait, if I use a curve, the math might get too heavy. Let's use a discrete set of options or a piecewise linear frontier.
