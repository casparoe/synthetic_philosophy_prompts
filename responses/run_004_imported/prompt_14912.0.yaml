          *   **Comparison:**
              *   KS gives You more (61.8 vs 57.7).
              *   NBS gives Ex more (33.3 vs 30.9).
              *   Why? Because Ex has a lower "Max Potential" (50 vs 100). NBS compensates the person with less potential upside to maximize the *product*. KS says "everyone gets the same % of their dream."

