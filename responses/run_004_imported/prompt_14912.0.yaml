      *   **The Intuition:**
          *   **Nash:** "Maximize the total value created." It acts like a utilitarian. If one person has a lower ceiling, Nash gives them a boost to balance the product. It favors the person with the *lower* maximum potential in this specific asymmetric setup.
          *   **Kalai-Smorodinsky:** "Equalize the satisfaction." It asks, "How close are you to your dream?" and makes sure you are both equally close. It favors the person with the *higher* maximum potential (You, in this example) because maintaining the ratio requires giving you more absolute units to match their percentage.
      *   **The "Feature" Causing Divergence:** Asymmetry in **Maximum Potential** combined with a **Non-Linear Trade-off**.
          *   If the trade-off was 1-for-1 (linear), they'd agree.
          *   If your maximums were equal, they'd agree.
