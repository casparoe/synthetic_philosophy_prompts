  **Move 1 (Dev):** This scores a 1 because it accurately captures the common-sense moral intuition that grounds most legal and social systems: bodily integrity is typically inviolable. However, it functions more as an assertion of the status quo than a philosophical argument, leaving it vulnerable to Sofia's subsequent theoretical challenge.

  **Move 2 (Sofia):** This also scores a 1 because it correctly applies consistent utilitarian logic (Singer's principle) to the case, exposing the arbitrariness of distinguishing between money and body. It loses points for treating a highly contested premise (that bodily risk is comparable to financial loss) as settled fact, which is the core of the disagreement rather than a solution to it.

  **Move 3 (Dev):** Dev earns a 1 here for successfully refining his position from intuition to a category distinction (property vs. bodily rights). This is a standard deontological move that strengthens his case, though it still relies on the audience accepting that bodily rights are categorically different without fully explaining why that difference halts the utilitarian calculus.

  **Move 4 (Sofia):** This scores a 2 because it lands a precise logical blow by identifying the Sorites-style vagueness in Dev's threshold argument. By pointing out that Singer's original case already includes bodily risk, she forces Dev into a corner where he must define a specific risk threshold, which is notoriously difficult to do without arbitrariness.

  **Move 5 (Dev):** This scores a 2 because it successfully shifts the debate from metaphysical definitions to the pragmatic consequences of moral language, directly invoking the "overdemandingness" objection central to Urmson's paradox. It highlights that defining the act as obligatory doesn't just change labels; it potentially undermines the social recognition that encourages such acts in the first place.

  **What They're Missing:**
  Both friends are treating morality as purely descriptive (what *is* the duty?) rather than functional (what does calling it a duty *do*?). They miss the possibility that the category of supererogation exists not because we can't calculate the risk, but because human moral psychology requires a zone of freedom to sustain high-cost altruism without triggering resentment or burnout. Additionally, neither addresses the systemic angle: framing this as an individual obligation (whether duty or supererogatory) ignores whether society should be organizing organ procurement institutionally rather than relying on private sacrifice.
