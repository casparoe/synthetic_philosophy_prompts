  6.  **Drafting the Response (Iterative Process):**

      *   *Opening:* Validate the friend's intuition. She is onto something real. It's not just discomfort.
      *   *Core Distinction:* Differentiate between *Distributive Justice* (who gets what) and *Procedural Justice* (how we decide).
      *   *The "Honesty" Argument:* Seniority pretends tenure = merit. Coin flip admits equality.
      *   *The "Signal" Argument:* What does this tell the staff about how the org works?
