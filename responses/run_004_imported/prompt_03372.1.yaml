answer: |-
  **Setting:** *The locutorio (parlor) of the Convent of San Jerónimo, Mexico City. Late afternoon, 1691. The grille separating the nun from the visitor is visible, but for the sake of this imagined conversation, we place them in the same room, a privilege of his rank and her reputation.*

  **Characters:**
  *   **Bishop Manuel Fernández de Santa Cruz:** Bishop of Puebla. A patron of letters, but a pastor first.
  *   **Sor Juana Inés de la Cruz:** Hieronymite nun. Poet, scholar, scientist.

  ***

  **Bishop Manuel:** You know, Sor Juana, when I put pen to paper as "Sor Filotea," I expected a reply. I did not expect a treatise that would be copied and read from here to Madrid. You have turned a private admonition into a public manifesto.

  **Sor Juana:** And you, My Lord Bishop, turned a private critique into a public trap. If you wished to counsel me, you had the office to do it as Manuel. By donning the habit of a nun to scold me, you made the critique itself a performance. I merely answered the performance in kind.

  **Bishop Manuel:** A fair strike. I concede the method was... indirect. But do not mistake the method for the message. This is not about my cowardice or your wit. It is about the sermon. You corrected Vieyra. A famous preacher, a saintly man, now in glory. And you did it publicly.

  **Sor Juana:** I corrected an error in logic. If Vieyra was in glory, he would thank me for clarifying the truth. If he was merely a man, he was still wrong. Since when does the hierarchy of the Church depend on the infallibility of its rhetoricians?

  **Bishop Manuel:** Since the Church is a body, and bodies require order. When you, a nun, publish a critique of a superior, you invert the order. But let us go deeper. You assume that because you *can* reason, you *must* reason about everything. That is the heart of my concern. It is not that you lack the capacity, Juana. God knows, you have more than most men I ordain. It is that you treat the intellect as an end in itself.

  **Sor Juana:** The intellect is a gift from God. To let it rust is to spit in the hand that gave it.

  **Bishop Manuel:** Is it? Or is it a test? Consider Boethius. Here was a man of immense learning, steeped in the subtleties of natural philosophy, of mathematics, of the stars. But what did he do when he faced the wall of his prison and the shadow of death? He turned away from the "curious" arts. He turned to the *Consolation*. He moved from the study of nature to the study of the soul. That is the progression of a saint. You are attempting to walk it backward.

  **Sor Juana:** You lean on the distinction between *curiosidad* and *studiousness*. You argue that studying the natural world is an illicit itch, a vanity, while studying morality is "useful." But who draws that line?

  **Bishop Manuel:** The Church draws it. *Curiosidad* is knowledge sought for the pride of knowing. *Studiousness* is knowledge sought for the salvation of the soul. If you spend three days calculating the trajectory of a comet, how does that help you love your neighbor? If you spend three days meditating on Christ's passion, you are closer to Heaven. One is a distraction; the other is sustenance.

  **Sor Juana:** That is a false dichotomy, My Lord. To study the comet *is* to study the Hand that threw it. But let us leave the heavens; they are distant. Let us go to the kitchen.

  **Bishop Manuel:** The kitchen?

  **Sor Juana:** Yes. You speak of "useful" knowledge. You imply that natural philosophy is abstract and vain. But I have learned more physics from watching a cook than I have from reading Aristotle. Take an egg. Why does the yolk and white coagulate and firm up when fried in hot oil, yet if you put that same egg into boiling syrup, it dissolves and falls apart?

  **Bishop Manuel:** Because... heat acts differently on different mixtures?

  **Sor Juana:** Precisely. But *why*? To understand that is to understand the material properties God imbued in matter. Is that not a truth? Is it not "useful" to understand the truth of His creation? If Aristotle had spent less time theorizing in the Lyceum and more time watching eggs fry in a pan, he might have spared us centuries of error. You call this *curiosidad*. I call it reading the book of the world. If God created the world, and He gave me eyes to see it and a mind to parse it, then ignoring the egg is the true vanity. It is saying, "God, your creation is not worth my attention, only my own salvation is."

  **Bishop Manuel:** You twist the point to make it sound pious. But look at the fruit of this "reading." You have a cell filled with four thousand books. You have astrolabes and maps. You write plays for the court. Where is the humility in that accumulation? Boethius shed his books to find God. You are building a fortress of them to keep Him out.

  **Sor Juana:** I am not building a fortress. I am building a lens. The danger you speak of—pride—is real. I grant you that. But pride is a condition of the heart, not the library. A man can pray the rosary with more pride than I feel when I measure the stars. If I study, it is because I am compelled. To stop would be to sin against the nature God gave me.

  **Bishop Manuel:** And there it is. "Compelled." You speak as if you have no choice. But you do. You are a bride of Christ. Your vow is obedience, not inquiry. When your inquiry leads you to correct a Vieyra, or to publish a defense that embarrasses your Bishop, your "compulsion" looks a great deal like willfulness.

  **Sor Juana:** Then the issue is not the knowledge. It is the voice.

  **Bishop Manuel:** It is the *public* voice. Paul says women should keep silent in the churches.

  **Sor Juana:** Paul also says many things in specific contexts. "Silence in the churches" refers to the pulpit. It refers to the authority to preach doctrine to the congregation during Mass. It does not refer to a nun in her cell writing a letter. It does not refer to theological debate in private correspondence. If "silence" meant absolute intellectual muteness, why did Teresa of Ávila write? Why did Catherine of Siena dictate letters to popes?

  **Bishop Manuel:** Because they were saints moved by direct revelation, not by logic chops. They spoke because God commanded them to. Do you claim God commanded you to critique Vieyra?

  **Sor Juana:** I claim God commanded me to seek the truth. If the truth contradicts Vieyra, I cannot hide it without lying to God.

  **Bishop Manuel:** You see? That is the danger. You place your own interpretation of "truth" above the peace of the Church. You say this isn't about women's capacity. I agree with you there. I know you can reason better than half my clergy. But capacity does not grant license. A soldier may have a sword, but if he draws it without orders, he is a mutineer, not a hero.

  **Sor Juana:** So I am to be a soldier who is forbidden to look at the battlefield? I am to study only what is handed to me?

  **Bishop Manuel:** You are to study what aids your vow. If your study of eggs or comets leads you to greater awe, keep it in your heart. Write it in a diary. But do not publish it. Do not enter the public square. The moment you seek the approval of the world—even the scholarly world—you feed the *curiosidad* you claim is pure. You become a performer.

  **Sor Juana:** And if I remain silent, and error spreads? If young women see me and think, "She stopped, so I must not start"? If I hide this light, am I not burying the talent? You worry for my soul, Manuel. I know you do. You think the world will damn me for pride. But I worry for the souls of those who are told their minds are traps. If I silence myself, I validate the lie that God gave women minds they are forbidden to use.

  **Bishop Manuel:** He gave you minds to know Him. Not to know everything. There is a wilderness of knowledge, Juana. Kircher, that Jesuit you admire—he went down into Vesuvius. He mapped the underground. He sought to know the secrets of the earth. Is that not a metaphor for your own path? You are descending into the crater. It is magnificent. It is brave. But it is also full of sulfur. It chokes the breath.

  **Sor Juana:** Then let me choke on the truth rather than suffocate in a comfortable lie.

  **Bishop Manuel:** (Pauses, looking at her with genuine sorrow) You make it sound so noble. But I have seen brilliant men break on that rock. They start seeking truth and end seeking fame. They start with the egg and end with the ego. I am not asking you to stop thinking. I am asking you to stop *needing* the world to know that you think.

  **Sor Juana:** And I am telling you that for a woman, the thinking *is* the existence. If I stop, I die.

  **Bishop Manuel:** Then we are at an impasse. You believe the sin is in the suppression of the gift. I believe the sin is in the exhibition of it. We agree on the capacity. We agree on the God who gave it. We disagree on who holds the leash.

  **Sor Juana:** It seems we do.

  **Bishop Manuel:** I cannot lift the censure on the publication, Juana. The order stands. You must renounce the "Filotea" reply.

  **Sor Juana:** I cannot renounce the arguments. I can only renounce the circulation.

  **Bishop Manuel:** (Stands) Then pray that is enough. For your sake. The crater is beautiful, Sor Juana. But the fumes rise.

  **Sor Juana:** And the view from the rim is the only way to see the whole mountain, My Lord.

  *(The Bishop bows slightly and exits. Sor Juana remains seated, looking at a small astrolabe on the table. She does not cover it.)*
