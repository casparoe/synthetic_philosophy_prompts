answer: |-
  **MEMORANDUM**

  **TO:** Forecasting Meetup Group
  **FROM:** The Organizing Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Ruling on Probability Coherence and Scoring

  Hi everyone,

  Thanks for the spirited discussion at last month's session. We want to address the debate regarding incoherent probabilities (forecasts where outcomes don't sum to 100%) and settle the rule before next month.

  We've heard both sides of the argument, and we think both Dave and Priya are pointing at something important.

  **The Case for Flexibility (Dave's Point)**
  Dave is right that this is a forecasting meetup, not a bookmaking shop. When you say you're "35% confident" in an outcome, you are expressing a internal state of uncertainty, not necessarily offering a tradable asset. If you have no intention of taking the other side of a bet, the immediate risk of a "Dutch Book" (a guaranteed loss via arbitrage) is theoretical rather than practical. Penalizing a forecaster with a zero score for a math error feels punitive for a group focused on learning and calibration.

  **The Case for Coherence (Priya's Point)**
  However, Priya is right that probability has a definition. If our leaderboard is to mean anything, we need a shared standard. Incoherent probabilities distort the Brier score. For example, summing to 115% allows a forecaster to be overconfident across the board without penalty, which breaks the calibration metrics we use to track improvement. If we allow probabilities to float, we can't compare scores fairly between members.

  **The Decision**
  To balance mathematical integrity with community spirit, we are implementing the following policy effective immediately:

  1.  **Probabilities must sum to 100%:** We are upholding the standard axiom of probability. This ensures our leaderboard remains comparable and meaningful.
  2.  **No "Automatic Zero":** We are rejecting the proposal to zero out a round for incoherence. We agree that this is too harsh for a casual meetup and discourages participation.
  3.  **Normalization Protocol:** If a submission does not sum to 100%, the organizers will linearly normalize the probabilities to sum to 100% before calculating the Brier score. (e.g., if you submit 35/40/40, we will adjust the relative weights to fit the 100% cap).

  This approach acknowledges Dave's intent (you aren't being disqualified or treated as irrational) while validating Priya's concern (the math must hold for the score to count).

  Thanks for helping us make the game better. See you next month.

  Best,

  The Organizing Committee
