answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name], and I have the distinct honor of being the child who grew up with a report card on the pantry door.

  If you've ever opened our fridge for a midnight snack, you've seen it. Ben Franklin's 13 Virtues. Temperance, Silence, Order, Resolution, and so on. A grid for every week, a black mark for every slip-up. For thirty years, that chart has been the family joke. We'd whisper, "Don't slam the cupboard, Dad's tracking *Order* this week."

  But here's the thing: This semester, I'm actually taking a seminar on Franklin's autobiography. I'm reading the source material. And I went in expecting to find a saint who inspired my dad. Instead, I found a messy, contradictory, brilliant man who admitted he never came close to perfection. And honestly? That makes this toast a lot easier. And it makes my dad a lot more lovable.

  For the half of the room who only knows Franklin from the hundred-dollar bill: Franklin proposed a project of "moral perfection." He listed 13 virtues he wanted to master. He focused on one per week. He kept a chart. Just like the one on our pantry.

  But in his own writings, Franklin confesses that the whole thing was kind of a struggle. He wanted to master "Order"—everything in its place, a time for everything. He wrote, famously, that this virtue gave him the most trouble. He said he was like a man trying to kill all the fleas on his dog; no matter how many he killed, more jumped on.

  And then there's "Humility." Franklin wrote that he conquered his pride, and then immediately noted how proud he was of his own humility. He was self-aware enough to know he was full of it.

  I looked at that chart on the pantry door this morning, and I realized something. My dad didn't put that chart up because he thought he was a sage. He put it up because he knew he wasn't.

  We all know the Dad myths. The dad who can fix anything, the dad who never gets lost, the dad whose garage is a showroom. And then there's my dad. Who loves you all deeply, but whose garage... well, let's just say if "Order" was the virtue of the week, the garage was the black mark that never went away.

  For a long time, I think we treated the chart as a measure of his success. But Franklin teaches us that the chart wasn't a scorecard. It was a compass.

  Franklin tells a story about a man who wanted to buy an axe. The grinder agreed to sharpen it, but only if the man would turn the wheel. The man turned, the grinder pressed the axe against the stone, and it made a loud, grinding noise. The man kept checking the axe. Finally, he said, "I think I'll take it as it is." The grinder asked, "Why? It's still speckled." And the man said, "Yes, but I think I like the speckles better than the grinding."

  Franklin called this the "Speckled Axe." He said that's how he lived. He wanted a perfect life, but the grinding of trying to be perfect was too hard. So he kept the speckles. He accepted that he would be a work in progress until the end.

  Dad, you're 60 today. You have the speckles. We see them. We see the garage. We see the times you lose your temper in traffic. We see the times you forget the anniversary or burn the toast.

  But we also see the turning of the wheel.

  That chart on the pantry door wasn't there to show us you were perfect. It was there to show us that you cared enough to try. It was there to teach us that virtue isn't about never falling down; it's about keeping a chart so you know where you stumbled, and you get up the next week and try again.

  Franklin wrote, "I never arrived at the perfection I had been so ambitious of obtaining, but fell far short of it." And yet, he became one of the most influential men in history. Not because he was flawless, but because he was relentless in his attempt to be better.

  That is the legacy on our pantry door. Not a record of sins, but a record of effort.

  So, I don't want to toast the man who mastered the 13 virtues. I want to toast the man who tracked them. The man who knows the garage is a mess but keeps sweeping anyway. The man who knows he's proud, but tries to be humble. The man who accepts the speckles.

  Dad, happy 60th. May your next decade be full of fewer black marks, a slightly cleaner garage, and the same beautiful, grinding effort to be a good man.

  To Dad.

  [Raise glass]
