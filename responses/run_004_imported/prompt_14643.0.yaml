          *   *Verdict:* Marco is right about the operational safety of relativity. However, he risks conflating "signalling" with "causation/influence." Just because you can't signal doesn't mean there isn't a non-local ontological connection (as Dana will argue).

      *   **Move 5 (Dana):** No-signalling bars messages, not physical influence. Bohmian mechanics is explicitly nonlocal yet obeys no-signalling. So "can't signal" $\neq$ "nothing nonlocal."
