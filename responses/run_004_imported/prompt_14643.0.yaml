          *   *Analysis:* Dana is pointing out the "collapse of the wavefunction" seems nonlocal regardless of interpretation. Even if there's no hidden variable, the *state* updates globally. This touches on the tension between "parameter independence" and "outcome independence."
          *   *Verdict:* Dana has a strong intuitive point. Even without hidden variables, the *correlation* is established instantly. Whether this counts as "physical influence" is the crux. She's challenging the idea that dropping realism makes the "spookiness" go away.

      *   **Move 4 (Marco):** No-signalling theorem rules out sending messages. Relativity is safe. Calling correlation "nonlocal causation" begs the question.
