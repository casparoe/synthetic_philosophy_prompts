      *   *Legal constraints:* Jurors are sworn to judge based on evidence. A "fixed increment" might violate that oath. Testimonial justice aligns *better* with the oath because it aims for accurate assessment, free from distortion.

  8.  **Final Polish:** Organize into clear sections (Diagnosis, The Proposed Remedy, Fricker's Actual Remedy, Institutional Context). Ensure the distinction between "prejudice" and "evidence" is clear. (The hesitation wasn't evidence of lying; it was evidence of trauma, which was misinterpreted due to prejudice).

