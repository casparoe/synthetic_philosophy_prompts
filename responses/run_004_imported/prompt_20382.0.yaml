answer: |-
  This is a profound narrative problem that maps neatly onto a classic metaphysical dispute. You are asking how a single subject of predication ("the protagonist") can sustain contradictory predicates ("is frail" and "is robust") without ceasing to be the same subject. In metaphysics, this is the **Problem of Temporary Intrinsics**, formulated most famously by David Lewis.

  Here is the comparison of the two dominant views on persistence, their specific responses to this problem, the costs they incur, and a committed verdict on which offers the more defensible framework for your purpose.

  ### 1. Perdurantism (Four-Dimensionalism)

  **The View:**
  Perdurantism holds that objects are extended in time just as they are in space. Your protagonist is not wholly present at any single moment; rather, they are a "spacetime worm" composed of temporal parts (stages). The infant is a temporal part; the octogenarian is a different temporal part. The "person" is the aggregate of all these parts.

  **The Reply to Temporary Intrinsics:**
  This view offers the most logically straightforward solution. Lewis argued that contradiction arises only if we say one thing *wholly* possesses incompatible properties. The perdurantist denies this.
  *   **Solution:** The protagonist *simpliciter* does not have the property of being "frail" or "robust." Rather, the *early temporal part* is robust, and the *late temporal part* is frail.
  *   **Result:** There is no contradiction. Just as a road can be straight in the north and curved in the south without being logically inconsistent, a person can be robust at $t_1$ and frail at $t_2$ because different parts bear the properties.

  **The Cost:**
  The cost is **phenomenological alienation**. This view contradicts our lived experience of selfhood. We do not feel like aggregates of time-slices; we feel like wholly present entities moving *through* time. For a novelist, this risks making the character feel fragmented. If the infant and the elder are merely parts of a whole, the emotional weight of "one life lived" is diluted into "a collection of moments." It solves the logic of identity at the expense of the *feeling* of identity.

  ### 2. Endurantism (Three-Dimensionalism)

  **The View:**
  Endurantism holds that objects are wholly present at every moment of their existence. The numerically identical protagonist exists at birth and at death. They do not have temporal parts; they endure through time.

  **The Reply to Temporary Intrinsics:**
  This view faces the brunt of Lewis's criticism. If the *whole* person is at $t_1$ and the *whole* person is at $t_2$, and they have incompatible properties, the Law of Non-Contradiction is threatened.
  *   **Strongest Reply (Adverbialism/Time-Indexing):** The endurantist argues that properties are not held absolutely, but are indexed to times. The protagonist does not possess "frailty" and "robustness" absolutely. They possess "frailty-at-$t_2$" and "robustness-at-$t_1$." These are not incompatible intrinsic properties; they are relations to times.
  *   **Refinement:** A sophisticated endurantist (like E.J. Lowe) argues that Lewis begs the question by assuming intrinsics *cannot* be time-indexed. They posit that instantiation is a triadic relation: Object, Property, Time. The object instantiates the property *at* the time. This preserves the "wholeness" of the object without contradiction.

  **The Cost:**
  The cost is **metaphysical friction**. By turning intrinsic properties (like shape or posture) into relations to times, endurantism risks emptying the concept of "intrinsic" of its meaning. If "being bent" is actually a relation to a time, is it really an intrinsic property of the object? Furthermore, this view struggles to reconcile with Special Relativity, which suggests there is no universal "now" to index these properties against. It preserves the *feeling* of selfhood but complicates the *logic* of property possession.

  ### The Verdict

  You asked for a commitment. Based on the specific constraints of the **Problem of Temporary Intrinsics**, **Perdurantism is the more defensible view.**

  Here is why: Lewis's argument exposes a genuine logical tension in Endurantism. To save the idea that an object is "wholly present," the Endurantist must modify the logic of predication (making intrinsics into relations or positing primitive instantiation). This is a significant theoretical maneuver that risks ad hocery. Perdurantism, by contrast, requires no modification of logic or property theory. It accepts the incompatibility of the properties and locates them in different constituents of the whole. It is ontologically more parsimonious regarding *logic*, even if it is ontologically more extravagant regarding *objects* (positing temporal parts).

  For a metaphysician, logical consistency trumps phenomenological comfort. Therefore, Perdurantism wins the philosophical dispute.

  ### Application to Your Novel

  However, you are not writing a metaphysics paper; you are writing a novel. While Perdurantism is philosophically superior regarding temporary intrinsics, **Endurantism is narratively superior regarding character.**

  Readers read to track a *subject*, not a *sum*. If you write from a strictly Perdurantist perspective, the novel risks becoming a genealogy of stages rather than a biography of a soul. The emotional resonance of your book depends on the reader believing that the frail elder *is* the robust infant, not merely connected to them.

  **My Recommendation:**
  Adopt the **Endurantist ontology for the narrative voice**, but use the **Perdurantist insight for the structure.**

  1.  **Narrative Voice (Endurantist):** Maintain the illusion of the "wholly present" self. Use memory, trauma, and recurring motifs to stitch the consciousness together. The reader must feel the *persistence* of the "I," even when the body changes. This validates the reader's emotional investment.
  2.  **Structural Arc (Perdurantist):** Acknowledge the incompatibility of the stages. Do not try to smooth over the changes so much that they feel fake. Let the infant and the elder feel like different people, and let the narrative treat them as distinct temporal phases of a larger whole. You can even use this tension thematically: let the character struggle with the feeling that they are no longer the person they were.

  In short: Philosophically, your character is a spacetime worm (Perdurantism). But phenomenologically—and therefore literarily—they are an enduring soul (Endurantism). Write the latter, but structure the former. This allows you to honor the metaphysical reality of change without sacrificing the human reality of continuity.
