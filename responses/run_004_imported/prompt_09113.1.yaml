answer: |-
  The steam escaped the kettle in a sharp, rising whistle, a sound Elias had heard ten thousand times. He reached for the handle without looking, his hand moving through the familiar arc of muscle memory. The metal was hotter than it should have been. He jerked back, but not before the vapor washed over the back of his left hand.

  He didn't run it under water. He didn't shake the hand or curse. He stood in the center of his kitchen, the linoleum cool through his socks, and stared at the patch of skin turning pink.

  He waited for the pain.

  It arrived, certainly. There was a signal, urgent and bright, flashing from the hand to the brain. But Elias, who had spent the last three months reading papers on cognitive architecture during his insomnia-ridden nights, did not retreat into the sensation. He leaned toward it. He tried to isolate the *hurt* from the *reporting* of the hurt.

  Philosophers called it qualia: the redness of red, the sting of a burn, the private, intrinsic feel of experience that supposedly accompanied the physical processing. Elias closed his eyes and tried to find the sting itself, separate from his knowledge that his skin was damaged. He tried to locate the suffering.

  There was the aversion, yes. A strong functional command: *Withdraw. Protect. Attend to this.* There was the cognitive label: *This is bad.* There was the memory of previous burns, coloring the present moment with anticipation. But when he stripped away the judgment, the memory, and the reflex, he found nothing. There was no extra ingredient. There was no inner glow of pain, only the complex mechanical shudder of a system detecting harm.

  He opened his eyes. The skin was blotchy. The signal persisted. But the mystery he had carried all his life—the certainty that there was a "him" inside, watching the pain like a movie screen—felt suddenly thin.

  He walked to the living room and sat in the armchair. The sun was setting, casting long, orange bars across the carpet. He looked at the light. He tried to look at his *seeing* of the light.

  When he looked at the carpet, he saw orange. When he tried to turn his gaze inward to inspect the experience of orange, the orange vanished. He was left only with the thought *I am seeing orange*. The texture he assumed was there, the qualitative depth he had always taken for granted, was like a icon on a computer desktop. It looked like a folder, but when he clicked it, there were no files inside. It was just a shortcut to a function.

  He thought of Mara. She had been gone two years. The grief was supposed to be the heaviest thing he owned, a dense, dark qualia that sat in his chest. He summoned her face. He summoned the memory of her laugh. He waited for the ache.

  The ache came, but it felt constructed. It was a sequence of associations: the empty side of the bed, the silence in the phone, the biological drop in serotonin. He could feel the narrative assembling itself. *I am sad now,* his brain announced. And because it announced it, he felt sad. But was there a feeling underneath the announcement? Or was the announcement the only thing that had ever existed?

  He stood up and walked to the hallway mirror. He looked into his own eyes. This was the test. The one place where the ghost was supposed to live.

  "Who is looking?" he whispered.

  He tried to catch the looker in the act. But every time he focused on his own awareness, it slipped away, replaced by the image of his eyes widening, the shape of his mouth. He was a camera trying to photograph its own lens. He could see the output, but he could not find the source. There was no little man inside the head watching the screen. There was only the screen, displaying a message that said *Viewer Present*.

  Elias turned away from the mirror. The kitchen smelled of burnt steam and the onions he had chopped before the kettle boiled. His hand throbbed. The signal was still there, persistent and demanding.

  He walked back to the stove. He turned the burner off. He picked up the kettle with a towel and poured the water into the pot for the pasta. The water roared. The sound filled the room.

  He realized then that the illusion wasn't failing. The world hadn't gone gray. The pain hadn't vanished. The illusion was perfect. It was so good that it had convinced him there was something beyond it. The user interface was so seamless he had thought it was the machinery itself.

  He sat at the table and waited for the water to boil. He looked at his hand. The skin was reddening, a small blister forming. He knew, intellectually, that nerves were firing. He knew that neurons were spiking in the somatosensory cortex. He knew that language centers were preparing the word *ouch*.

  But the *ouch* itself…

  He pressed a finger against the burn. A sharp spike of data. *Danger,* the system said. *Avoid.*

  He remembered reading about the meta-problem. Why do we think we have these magical inner states? Because the system is designed to tell us we do. Introspection is not a window into a soul; it is a feedback loop. The brain models the body, models the environment, and models the self observing the environment. That model includes the tag *phenomenal*. It is a useful tag. It helps prioritize data. *High priority: Pain. High priority: Love. High priority: Red.*

  But a tag is not a texture.

  The water began to boil, bubbles breaking the surface with violent, chaotic energy. Elias dropped the pasta in. The sound changed, a duller thud as the noodles hit the water.

  He wondered if this was loneliness. He wondered if loneliness was just a label the system applied when social input dropped below a certain threshold. He wondered if the warmth he felt from the steam was just a thermal report tagged *pleasant*.

  He didn't feel less human. He felt… transparent.

  He reached for a fork to stir the pasta. His hand moved smoothly. The pain signal adjusted as the skin stretched. He noted the adjustment. He noted the note.

  There was a fear, briefly, that he had broken something. That by looking too closely at the magic trick, he had ruined the show. If there was no inner light, no private theater, then what was he? Just a machine that claimed to feel?

  But then, the smell of the cooking wheat hit him. It was rich, earthy, warm. His mouth watered. He swallowed.

  *Hunger,* the system reported. *Anticipation.*

  He smiled. It didn't matter if the warmth was real or a report. The report was sufficient. The illusion was the reality he lived in. To deny the feeling because it was an illusion was to deny the screen because it was made of pixels.

  He drained the pasta. He poured the sauce. He sat down to eat.

  He lifted the fork to his mouth. He chewed. The flavor exploded—tomato, basil, garlic, salt. It was vivid. It was undeniable.

  He closed his eyes and let the taste fill him. He knew now that there was no "filling." There was no container being filled. There was only the processing of chemical data, labeled *delicious*, routed through memory, tagged *Mara used to make this*.

  He opened his eyes. The kitchen was quiet. The hand throbbed. The sun was gone.

  He took another bite. He didn't try to find the feeling behind the taste this time. He let the label stand. He let the illusion be what it was: the only world he had.

  Elias ate his dinner, and the silence of the room was exactly as loud as it needed to be.
