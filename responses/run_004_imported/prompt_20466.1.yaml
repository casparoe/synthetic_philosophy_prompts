answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I have the distinct privilege of having watched [Groom] and [Bride] fall in love inside a library carrel, which is exactly as romantic as it sounds.

  Now, looking around the room, I see a split. About half of you are economists. The other half are sane people who have lives outside of academia. I need to explain [Groom] and [Bride]'s relationship in a way that works for both groups.

  Their love story is built on a specific intellectual conflict. When they met in our PhD program, [Groom] built his dissertation on the famous claim by Lionel Robbins that interpersonal comparisons of utility are impossible. In plain English: [Groom] believes science cannot measure whether one person is happier than another. It's a value judgment, not a fact.

  [Bride], on the other hand, works in the tradition of Harsanyi and Sen. She believes that unless we can compare welfare across people, we can't say if society is getting better or worse. She believes we *must* find a way to measure it.

  For five years, she has spent conference Q&A sessions publicly dismantling his papers on exactly this point. If you think wedding planning was contentious, you should have seen the 2022 AEA meetings.

  This leads me to the fundamental tension of their marriage, which brings me to my one required joke.

  According to [Groom]'s own research, he cannot scientifically verify that [Bride] makes him happier than anyone else on earth. That is, strictly speaking, unscientific. However, according to [Bride]'s research, if he doesn't admit that she makes him happier than anyone else, his model of the household is misspecified and he will be in trouble.

  So, [Groom], for the sake of your tenure, I hope you're willing to make an unscientific value judgment today.

  But in all seriousness, I want to talk about why this disagreement makes them perfect for each other.

  To the non-economists in the room: "Utility" is just a fancy word for well-being, or happiness, or satisfaction. The question [Groom] and [Bride] argue about is actually the central question of any marriage.

  Can I truly know what you are feeling? Can I weigh your joy against my own? When I make a sacrifice for you, is it worth it?

  [Groom] is right to be humble. He knows that he can never fully inhabit [Bride]'s mind. He knows that assuming he knows what is best for her is arrogant. He respects the mystery of her inner life.

  But [Bride] is right to be bold. Because you cannot build a life together if you don't try to compare. You have to wake up every day and attempt the impossible task of measuring another person's welfare. You have to ask, "Did what I did make you happy?" and trust the answer. You have to care enough about the other person's welfare to try to rank it against your own.

  They are suited for each other because they both care deeply about the same problem: human welfare. They just approach it with different tools. He brings the rigor to ensure they don't make assumptions they can't back up; she brings the moral courage to ensure they don't hide behind technicalities when a decision needs to be made.

  They have been arguing productively since the day they met. That is the definition of a partnership. It isn't about agreeing on the model; it's about agreeing that the question matters.

  Robbins said comparing utility is a value judgment dressed up as science. Well, love is also a value judgment. It is not something science can settle. It is a choice you make, again and again, to prioritize another person's well-being even when the data is incomplete.

  [Groom] and [Bride], you have spent your careers debating whether we can compare our happiness. Today, you stop debating and start living the answer.

  Please raise your glasses. To [Groom] and [Bride]. May your life together be the one value judgment you never have to justify.
