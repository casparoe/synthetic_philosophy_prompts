      *   *The "Parochial" Charge:* If Rawls succeeds in showing maximin is the *only rational* choice in the OP, then risk-seekers are being *irrational* in that specific context, not just having a different preference. However, if the friend is right that it *is* just risk-aversion, then the user is right that it's parochial.

