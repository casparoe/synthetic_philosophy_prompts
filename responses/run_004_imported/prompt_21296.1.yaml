      *   *Veil of Ignorance (VoI):* No knowledge of one's place in society, talents, conception of the good, etc.
      *   *Maximin Rule:* Maximize the minimum position. Choose the arrangement where the worst-off outcome is better than the worst-off outcome in any other arrangement.
      *   *Difference Principle:* Social and economic inequalities are to be arranged so that they are to the greatest benefit of the least advantaged.
      *   *Rawls's Defense against "Risk-Aversion" Charge:* Rawls explicitly addresses this. He argues it's *not* standard risk-aversion in the economic sense. He claims the conditions of the OP make the maximin rule *rational*, not just psychologically cautious.
      *   *Key Conditions for Maximin (Rawls, Section 28):*
          1.  Ignorance of probabilities (no basis for calculation).
          2.  Conception of the Good: The guarantee of a minimum is paramount (lexical priority of liberty/basic needs).
          3.  Alternatives have unacceptable outcomes (the "catastrophe" is a life not worth living).

  3.  **Evaluate the Friend's Critique:**
      *   *Strengths:* It's the most common criticism of Rawls (Harsanyi is the big name here). Harsanyi argued rational agents would maximize *average* utility, not maximize the *minimum*. If you are willing to gamble, you might choose a society with higher average wealth but a destitute underclass, hoping you end up rich.
