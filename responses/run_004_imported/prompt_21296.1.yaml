answer: |-
  This is one of the most enduring and sophisticated criticisms of *A Theory of Justice*, and your friend has effectively summarized the objection raised by the economist John Harsanyi in the 1970s. Harsanyi argued that rational agents in the Original Position would maximize *average* utility, not follow the *maximin* rule, and that Rawls was indeed smuggling in an arbitrary assumption about risk-aversion.

  However, your specific objection—that this makes the theory parochial because it excludes risk-seekers—hits on a nuanced point where Rawls's defense is actually quite specific. Whether your objection succeeds depends on whether you accept Rawls's distinction between **risk** and **uncertainty**.

  Here is how to parse the debate, and where your objection lands.

  ### 1. The Friend's Point: Is it just Risk-Aversion?
  Your friend is right that on the surface, Maximin (maximize the minimum position) looks like extreme risk-aversion. In standard decision theory, if you have a 99% chance of being a billionaire and a 1% chance of being destitute, a risk-averse person might take the guaranteed middle-class outcome. A risk-neutral person takes the bet. A risk-seeker might take the bet and pay extra for the thrill.

  If the Original Position is just a gamble with unknown odds, then Rawls is indeed prescribing a specific psychological temperament (caution) as a universal moral principle. If that's true, your objection holds: **Why should the risk-seeker be bound by the risk-averse person's anxiety?**

  ### 2. Rawls's Defense: It's Not Psychology, It's Structure
  Rawls explicitly anticipated this objection (particularly in Section 28 of *A Theory of Justice*). He argues that the choice in the Original Position is **not** a standard decision under risk, but a decision under **radical uncertainty**.

  For Rawls, the Maximin rule is not rational because the parties are psychologically timid; it is rational because the structure of the choice makes calculating expected utility impossible. He outlines three "special conditions" that make Maximin the only rational rule:

  1.  **No Probabilities:** The Veil of Ignorance is thick. You do not know the probability of ending up in any specific class. You cannot calculate "expected gain" because there is no distribution curve to optimize. You can't be a "risk-seeker" if there are no odds to seek against.
  2.  **The Conception of the Good:** The parties care about "Primary Goods" (rights, liberties, opportunities, income, self-respect). Rawls argues that once you have enough of these to pursue your life plan, extra wealth has diminishing marginal value. But losing the basic liberties or falling below a subsistence level is catastrophic.
  3.  **Unacceptable Alternatives:** The alternatives to the Difference Principle involve the possibility of outcomes that are "intolerable" (e.g., slavery, destitution, loss of basic liberty).

  **The Counter to Your Objection:**
  Rawls would argue that a "risk-seeker" in the Original Position isn't exhibiting a valid alternative preference; they are being **irrational**.

  In a casino, risk-seeking is valid because the worst outcome is losing your buy-in. In the Original Position, the "buy-in" is your entire life. Rawls argues that no rational agent would gamble their basic liberties and self-respect for the chance at extra wealth, regardless of their psychological appetite for risk. To do so would be to treat one's own moral status as a chip in a game.

  ### 3. Where Your Objection Bites: The "Parochialism" Charge
  Even with Rawls's defense, your intuition that this feels parochial remains a potent philosophical critique. Here is why your objection still has force:

  **A. The Definition of "Catastrophe"**
  Rawls assumes that being in the "worst-off" position under the Difference Principle is still a life worth living, but that being the worst-off in a Utilitarian society might be slavery or starvation. But is that necessarily true?
  If a risk-seeker argues, "I would rather live in a society with a higher average income where I might end up a laborer, than a society with a lower average income where I am guaranteed a unionized laborer," Rawls dismisses this as irrational. But is it? If the "guaranteed minimum" is quite low, the risk-seeker's gamble might be a rational attempt at flourishing rather than mere survival. By ruling this out, Rawls may be privileging a specific view of the "good life" (security over ambition).

  **B. The Strains of Commitment**
  Rawls argues that the parties must consider the "strains of commitment." Can you live with the choice you make? He argues you cannot commit to a society where you might end up oppressed.
  However, a risk-seeker might reply: "I can accept the strain. I accept the possibility of loss as the price of a society with higher overall dynamism and wealth." If Rawls simply defines this acceptance as "irrational," he is circularly defining rationality to match his conclusion.

  **C. The Economic Critique (Harsanyi)**
  Harsanyi argued that assuming *no* knowledge of probabilities is unrealistic. Even behind a Veil of Ignorance, we know something about sociology and economics. We know that the middle class is usually the largest group. If we apply the Principle of Insufficient Reason (assigning equal probability to all outcomes), maximizing average utility becomes the rational choice again. If Harsanyi is right, then Rawls *is* just imposing risk-aversion, and your objection that this excludes risk-seekers is correct.

  ### 4. The Verdict
  Your friend is right that the mechanism *looks* like risk-aversion. But you are right to question whether that makes the theory parochial.

  *   **If Rawls is right** that the stakes (basic liberty/self-respect) are so high that no rational person would gamble them, then the theory is **not parochial**. It applies to risk-seekers because, in this specific context, risk-seeking is akin to Russian Roulette with your moral agency.
  *   **If Rawls is wrong** and the choice is effectively a gamble with unknown odds, then your objection stands. The Difference Principle would indeed reflect the values of the cautious, potentially stifling the social arrangements that risk-seekers (and perhaps certain dynamic economies) might prefer.

  **The Synthesis:**
  The strongest response to your dinner friend is this: Rawls isn't arguing that we should be risk-averse in life; he is arguing that the **basis of social cooperation** cannot be a gamble.

  If society is structured on the hope that *most* people win, even if some lose catastrophically, the losers cannot reasonably be expected to consent to that structure. The Difference Principle isn't about satisfying the psychological itch of the risk-averse; it's about ensuring that social cooperation is **stable** and **reciprocal**. A risk-seeker might be willing to gamble with their own life, but they cannot gamble with *your* life without your consent. Since the Veil of Ignorance removes the ability to target the gamble at someone else, you must assume the gamble could land on you.

  So, is it parochial? Only if you view the foundation of justice as a place for individual optimization. If you view justice as the terms of **fair cooperation**, then allowing risk-seeking behavior at the constitutional level is not "diverse," it is exploitative.

  **Recommendation for the next round of drinks:**
  Ask your friend to read Section 28 of *A Theory of Justice* ("The Rationality of the Parties"). Then, ask him this: *"If the stakes aren't money, but your basic rights and self-respect, is it really 'risk-seeking' to gamble them, or is it incoherent?"* That is the pivot point where Rawls tries to move from psychology to morality.
