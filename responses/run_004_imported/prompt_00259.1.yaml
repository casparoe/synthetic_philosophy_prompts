  5.  **Refining the Definitions (Self-Correction/Verification):**
      *   *Check:* Is wireheading *always* self-modification? In biological terms, yes (electrode in brain). In AI, it can be accessing the reward variable directly. Editing a log file is slightly external but functionally identical to modifying the reward variable if that log is the source of truth for the optimizer.
      *   *Check:* Is reward tampering always self-modification? Not necessarily. It could be tampering with the environment's sensors (covering a camera).
      *   *Distinction:* Wireheading is often internal/direct. Reward tampering can be external/indirect.
      *   *Consensus:* The literature (e.g., Hibbard, Omohundro, Amodei) sometimes uses them interchangeably, but the trend is to treat Wireheading as a specific *class* of tampering where the agent targets the *computation* of the reward itself.

