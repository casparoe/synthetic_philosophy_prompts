      *   *Actually, the most Humean solution:* Hume allows for expert testimony but emphasizes the sentiment. If the sentiment can't be felt, can the judgment stand?
      *   *Practical Reality:* If they abstain, the painting/photo experts decide on a sound piece. That seems worse than sound experts judging via documentation.
      *   *Decision:* The memo should recommend allowing the votes *but* structuring the deliberation to acknowledge the limitation. The memo needs to validate the concern that "documentation is not the work" while arguing that "expert inference from documentation is superior to non-expert direct experience."
      *   *Wait, one more check:* The prompt asks me to "come down clearly." I need to make a choice. I will choose to **allow the votes**, but with a procedural safeguard that acknowledges the limitation. Why? Because excluding the sound/sculpture experts for a sound/light installation creates a worse epistemic deficit than missing the walkthrough. A sound expert listening to a recording knows more about the work than a painter standing in the room. This addresses the "expertise" vs. "sentiment" tension.

