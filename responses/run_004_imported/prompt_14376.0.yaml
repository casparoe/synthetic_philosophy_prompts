      *   **Section 3: The Methodological Slip.** Contrast the rigor of *Methods* with the fragility of SPR evidence. Sidgwick accepted "cumulative weight" of anecdotes where he would demand logical proof in ethics. This is the confusion.
      *   **Conclusion:** Deliver the verdict. It was a tragic inconsistency.

  5.  **Refining the Argument (Self-Correction during drafting):**
