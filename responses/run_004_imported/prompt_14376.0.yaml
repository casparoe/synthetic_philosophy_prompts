  2.  **Deconstruct Sidgwick's Position (The Steelman):**
      *   *The Dualism of Practical Reason:* In *Methods*, Sidgwick concludes that Rational Egoism (pursuing one's own good) and Rational Benevolence/Utilitarianism (pursuing the universal good) are both rational but can conflict. There is no rational proof they coincide *in this life*.
      *   *The Theological Postulate:* To avoid practical despair (or the conclusion that morality is irrational), Sidgwick needs a "moral government of the universe." This implies sanctions (rewards/punishments) that align self-interest with duty. This usually requires immortality and a divine ruler.
      *   *The Loss of Faith:* Sidgwick lost orthodox Christian belief. He couldn't just *assume* the theological postulate on faith.
      *   *The Empirical Turn:* If the postulate is necessary for rational morality but faith is gone, can *evidence* fill the gap? Psychical research (survival of death, telepathy implying a non-material mind) offers empirical data points.
      *   *Methodological Consistency:* Sidgwick was an empiricist. He treated ethics scientifically. Why not treat the conditions of ethics (cosmology/metaphysics) scientifically too? The SPR used statistical methods (Census of Hallucinations), rigorous cross-examination, and skepticism. It wasn't occultism; it was early social science.

  3.  **Identify the Weaknesses/Critiques (The Argument Against):**
      *   *Category Error:* Ethics deals with *normative* reasons. Psychical research deals with *empirical* facts. Can an empirical fact (ghosts exist) solve a normative problem (why should I be moral)? Even if I survive death, why does that guarantee the *moral* structure of the afterlife? A demon could rule the afterlife.
      *   *The Probability Gap:* The evidence SPR gathered was probabilistic and weak (anecdotal, statistical noise). Sidgwick needed *certainty* (or near certainty) to resolve the dualism. Weak evidence of survival doesn't guarantee a *moral* universe.
      *   *Desperation vs. Rigor:* Sidgwick lowered his epistemic standards for SPR compared to his ethical analysis. In *Methods*, he is ruthlessly logical. In SPR, he chases faint signals. This suggests psychological need overrode methodological rigor.
      *   *The "God of the Gaps" Problem:* He is trying to prove a metaphysical necessity through contingent physical (or para-physical) evidence.
      *   *Testimony Issues:* Relying on testimony for metaphysical claims is notoriously unreliable. Sidgwick knew this in law and history, but seemed hopeful here.

  4.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic and provocative.
