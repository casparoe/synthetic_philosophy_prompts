answer: |-
  This is a fantastic question because it cuts to the heart of Newton's theological project, which is often misunderstood as merely "heterodox" when it was actually a rigorous, historical reconstruction of what he called "Primitive Christianity."

  You are absolutely correct that Newton wrote *An Historical Account of Two Notable Corruptions of Scripture* (sent to Locke in 1690) with the specific intent of dismantling the Trinitarian proof texts. And you are also correct that modern textual criticism has vindicated his philology completely.

  If Newton were transported to 2024, handed a Nestle-Aland Greek New Testament, and shown that the *Johannine Comma* is universally recognized as spurious by scholars, yet the Nicene Creed remains the standard of orthodoxy, **he would not view this as a failure of his premise. He would view it as the ultimate confirmation of his theory of the "Great Apostasy."**

  Here is how I reconstruct Newton's reasoning based on his manuscripts, his letters to Locke, and his broader historiography.

  ### 1. Vindication of the Forensic Method
  First, Newton would feel a profound sense of vindication regarding his *method*. Newton approached scripture like he approached nature: as a system of laws that could be deduced through observation and evidence. He believed that truth was unitary; if a doctrine was true, it would be consistent with the earliest manuscript evidence.

  Finding that modern scholars agree with his 17th-century private notes would confirm his belief that **truth is recoverable through rigorous inquiry.** He often complained that the Church relied on "authority" rather than "evidence." The fact that secular and religious textual critics alike now agree the Comma is an interpolation proves his core epistemological claim: *The documents do not lie, but the interpreters do.*

  ### 2. The "Corruption" Was Never Just Textual
  This is the crucial point. You ask if he would think the corruption runs deeper than he thought. Newton would argue **he always knew it ran deeper.**

  For Newton, the *Johannine Comma* was not the *cause* of Trinitarianism; it was a *symptom* of it. He viewed the doctrine of the Trinity not as an honest theological mistake, but as a political usurpation engineered by the Bishop of Rome and solidified at the Council of Nicaea (325 AD). He viewed Athanasius not as a saint, but as a Machiavellian operator who imposed Greek metaphysical categories onto the simple message of Jesus.

  If the Comma is removed but Trinitarianism remains, Newton would say: *"Of course it remains. You have removed the brick, but the foundation of Athanasian power is still intact."*

  He believed the corruption was institutional and creedal, not just textual. The Church had bound conscience to the *Creed*, not just the *Text*. Therefore, the survival of Trinitarianism without the Comma proves his point that the doctrine is sustained by **ecclesiastical authority and tradition**, not by scriptural warrant. To Newton, the fact that churches accept Comma-free Bibles but still recite the Nicene Creed is evidence that they worship the Church's authority more than God's Word.

  ### 3. The Rationality of God
  Newton's theology was deeply rationalist. He believed that God is a God of order, not confusion. One of his main objections to the Trinity was that it required believing in a logical contradiction (three are one) which he saw as an affront to human reason, which God gave us.

  The *Comma* was useful to Trinitarians because it made the doctrine explicit. Without it, the doctrine becomes implicit, mysterious, and reliant on "paradox."

  Newton would argue that the persistence of the doctrine without the text exposes the **irrationality of the dogma.** He would likely say: *"Now that the plain text is gone, you are forced to ask men to believe a mystery that cannot be read. This proves it is a doctrine of men, not of God."*

  He would see the modern reliance on "systematic theology" over "plain scripture" as the continuation of the Gnostic corruption he fought against. The fact that the doctrine survives without its "smoking gun" verse proves to him that the doctrine is a self-sustaining ideological system, immune to evidence.

  ### 4. Prophecy and the "Man of Sin"
  We cannot forget that Newton was a serious student of prophecy (Daniel and Revelation). He identified the "Man of Sin" and the "Whore of Babylon" not with a specific person, but with the corrupt Trinitarian Church hierarchy that usurped the worship due to God the Father alone.

  In his eschatological timeline, the "Great Apostasy" was a long winter that would precede the final restoration of true religion. He did not expect the Apostasy to collapse immediately upon the discovery of truth. He expected the "false church" to dig in.

  Seeing that the removal of the Comma hasn't toppled the Trinitarian establishment would fit perfectly into his prophetic schema. It shows that the "spiritual tyranny" is resilient. He would likely argue that we are still in the period of waiting, and that textual criticism is just one tool in the slow work of clearing the rubble before the true Temple can be rebuilt.

  ### 5. Would He Be Disappointed?
  Perhaps, but not in his theory. He might be disappointed in the *courage* of modern Christians.

  Newton privately refused to take Anglican orders because he couldn't in good conscience subscribe to the Thirty-Nine Articles (which affirmed Trinitarianism). He lived a double life to keep his Lucasian Chair. He assumed that once the evidence was clear, honest men would follow it.

  Seeing modern pastors and scholars who *know* the Comma is fake (because they use the critical texts) but *preach* the Trinity anyway (because they hold to the Creed) would confirm his darkest view of the clergy: **that they are custodians of a system, not seekers of truth.**

  ### Summary of Newton's Likely Reaction
  He would not say, "My premise was wrong; doctrine doesn't track text."
  He would say, **"My premise was right; true doctrine tracks text. Therefore, since this doctrine does not track text, it is not true doctrine. The fact that it persists proves it is upheld by the 'Mystery of Iniquity' (institutional power) rather than the Spirit of Truth."**

  The outcome you describe is the exact scenario Newton anticipated in his *Observations upon the Prophecies of Daniel and the Apocalypse of St. John*. He expected the truth to be recovered slowly, and for the corrupt system to resist even when exposed. The survival of Trinitarianism post-Comma wouldn't undercut his argument; it would be his Exhibit A for the spiritual corruption of the post-Nicene Church.

  He would likely conclude that the job is only half done: we have cleaned the text, but we have not yet cleaned the Creed. And for Newton, until the Creed is scrapped for a rational, monotheistic confession based solely on the purified text, the Reformation is incomplete.
