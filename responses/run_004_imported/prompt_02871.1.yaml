      *   *Nuance on Drinking Age:* He might appreciate the restriction but criticize the lack of gradual habituation and the "forbidden fruit" aspect that leads to bingeing.
      *   *Key Concept:* *Paideia* (Education). Drinking in *Laws* is education. US drinking is often anti-education.
