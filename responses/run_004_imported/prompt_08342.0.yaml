      *   *Premise 3: The Empiricism of Prophecy.* Newton believed he *verified* Daniel's accuracy regarding the Seleucids/Ptolemies. He saw the fit as too perfect to be coincidence. He would interpret the "ex eventu" argument as a failure of imagination regarding God's power.
      *   *The "Priestcraft" Angle:* Newton blamed Athanasians for corrupting the NT. Who would he blame for Daniel? The "Maccabean" theorists would be accused of undermining Providence to suit materialist/naturalist ends (similar to how he viewed Hobbes or Spinoza).

  6.  **Drafting the Response (Iterative refinement):**
