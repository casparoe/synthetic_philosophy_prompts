      *   **Topic:** ECL (based on Oesterheld's multiverse-wide superrationality). Core idea: In a large/infinite universe, cooperate with causally disconnected agents who have correlated decision procedures because your action is *evidence* of theirs.
      *   **Problem:** Existing writeups often dodge hard implications (infinite arithmetic, reference classes) by saying "that's a problem for everyone in large worlds, not just ECL."
      *   **Goal:** 8-10 interview questions that *don't* let that dodge work.
