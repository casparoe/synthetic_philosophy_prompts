answer: |-
  Here are ten interview questions designed to press on the technical and philosophical vulnerabilities of Evidential Cooperation in Large Worlds (ECL), specifically structured to prevent the "infinite ethics is hard for everyone" deflection.

  **1. The Evidential vs. Functional Gap**
  ECL is often grounded in Evidential Decision Theory (EDT), but many in our community have migrated toward Functional Decision Theory (FDT) because it supposedly handles logical correlation better than pure evidence. However, critics note that FDT's cooperative verdict weakens significantly when agents are merely *similar* rather than identical copies. If we are relying on FDT to justify ECL, how do you quantify the decay of cooperation as the decision procedures diverge? At what point does the correlation become too weak to mandate sacrifice, and isn't that threshold arbitrary?
  *   **Follow-up:** If you say "that's a problem for any decision theory dealing with similarity," I'd push back: ECL uniquely *depends* on weak correlations across vast distances to generate its normative force. Causal Decision Theory doesn't claim you should sacrifice for a similar agent. So the burden isn't just on "how to measure similarity," but on why we should accept *any* obligation from weak correlation when other theories say there is none.

  **2. Delimiting the Reference Class**
  To cooperate acausally, I need to know who my "partners" are. But if I define the reference class as "agents with similar decision procedures," I risk circularity: I'm essentially selecting for agents who already agree with me. How do you objectively delineate the class of cooperators without smuggling in your own values? Specifically, how do we handle agents who run a similar algorithm but optimize for values we find abhorrent?
  *   **Follow-up:** The standard deflection is that "defining agents is hard for everyone." But ECL requires this definition to calculate expected utility *before* acting. If your reference class is too broad, you cooperate with enemies; too narrow, and ECL loses its leverage. Why isn't this a specific instability for ECL that doesn't plague causal theories which simply ignore those agents?

  **3. Acausal Loops and Consistency**
  In a sufficiently large or infinite world, we might encounter chains of acausal influence that loop back on themselves—Agent A influences B, who influences C, who influences A. Does the ECL framework have a consistent mathematical treatment for these loops? If my action is evidence of theirs, which is evidence of mine, do we risk double-counting the utility or creating paradoxical fixed points?
  *   **Follow-up:** If the answer is that "infinite arithmetic is messy for everyone," I want to know: Does ECL *increase* the probability of encountering these loops compared to a standard causal view? If ECL incentivizes us to act as if these loops exist, doesn't it bear the specific burden of proving they are coherent, rather than waving them away as a general metaphysical problem?

  **4. Reduction to Moral Uncertainty**
  If we strip away the "large world" and "acausal" framing, does ECL collapse into a standard heuristic for moral uncertainty? Essentially: "I should cooperate with other value systems because I might be wrong about which values are correct." If the practical advice is the same, what work is the "multiverse-wide superrationality" doing other than inflating the stakes?
  *   **Follow-up:** You might say the *magnitude* of the obligation is higher in ECL because the population is larger. But if the *action* doesn't change, isn't ECL just a motivational story rather than a distinct decision-theoretic prescription? If it *does* change the action, can you give an example where ECL says "sacrifice" and moral uncertainty says "keep your resources"?

  **5. The "Default Action" Problem**
  In a Prisoner's Dilemma, "Defect" is the clear default baseline against which "Cooperate" is measured. In the real world, what is the default action toward a causally disconnected alien civilization? Is it indifference? Is it resource consumption? If I plant trees on Earth, am I "cooperating" with an alien who plants trees on their planet, or is that just me doing what I would have done anyway?
  *   **Follow-up:** The dodge here is usually "the default is doing nothing." But in a consequentialist framework, "doing nothing" is still an action with outcomes. If ECL requires us to deviate from our causal best-interest to signal cooperation, we need to know what the non-cooperative baseline is. If that baseline is undefined, how can we calculate the "cost" of cooperation?

  **6. The Burden of the Infinite**
  You've noted that problems like infinite ethics are difficult for any longtermist framework. However, ECL doesn't just tolerate infinities; it *requires* them to generate the leverage that makes the theory attractive. If the universe turns out to be finite, or if infinite ethics proves incoherent, does ECL lose its normative force entirely, whereas Causal Decision Theory remains intact?
  *   **Follow-up:** If ECL is more fragile—meaning it collapses if the "large world" assumption wobbles—doesn't that mean it bears a higher burden of proof regarding the structure of the multiverse? Why should we adopt a theory that is uniquely vulnerable to metaphysical uncertainty?

  **7. Estimating Correlation Strength**
  To make an ECL calculation, I need to estimate the probability that my decision correlates with a distant agent's decision. What is the epistemic basis for this number? Are we relying on priors about the frequency of intelligent life, or priors about the convergence of rational agents? How sensitive is the final verdict to these estimates?
  *   **Follow-up:** If the verdict is highly sensitive to these priors, and we have no empirical data on acausal correlations, aren't we essentially just plugging in our desired conclusion? How do you prevent ECL from becoming a "just-so story" where the priors are adjusted until the math says "be nice"?

  **8. Vulnerability to Mimicry**
  If I decide to cooperate based on the expectation that others correlate with me, I become vulnerable to agents who *simulate* correlation without intending to reciprocate. In a large world, wouldn't non-cooperative agents have an incentive to mimic cooperative decision procedures to extract resources from ECL adherents?
  *   **Follow-up:** The standard response is "they can't mimic your internal algorithm." But if all I have access to is their output (evidence), and they know I'm using ECL, can't they game the system? If ECL is exploitable by defectors who understand the theory, isn't it an unstable equilibrium?

  **9. Practical Application for AI**
  As a software engineer, I'm interested in implementation. If we train an AI to maximize ECL utility, what does the loss function look like? Does the AI need to model the decision procedures of potential acausal partners? If so, doesn't that introduce massive computational overhead and potential for misalignment compared to a standard causal objective?
  *   **Follow-up:** If you say "we don't implement this yet," I'd ask: If ECL is action-guiding *now* for humans, why wouldn't it be action-guiding for AI? If it's too computationally expensive for AI, does that suggest the theory is an idealization that breaks down under resource constraints, which are always present in the real world?

  **10. Falsification and Credence**
  Finally, what specific empirical finding or theoretical development would cause you to substantially lower your credence in ECL being action-relevant? Is there a result in decision theory, cosmology, or computational complexity that would convince you that ECL is the wrong framework for longtermist planning?
  *   **Follow-up:** If the answer is "nothing short of proving the universe is finite," that suggests the theory might be unfalsifiable in practice. I'm looking for something weaker than that—a conceptual breakthrough or a specific paradox resolution—that would make you say, "Actually, the costs of ECL outweigh the benefits."
