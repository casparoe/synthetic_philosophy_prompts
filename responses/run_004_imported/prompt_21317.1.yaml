answer: |-
  Here are 8 questions designed to corner the "God's Custom" dodge, tailored for a philosophy podcast context. They move from metaphysical coherence to epistemology, ethics, and finally falsifiability.

  ### 1. The Stability of Custom
  **Question:** You rely heavily on the idea that God acts according to a consistent "custom" (*'adah*) to explain why the world doesn't descend into chaos. But if there are no natures grounding that consistency, what guarantees the custom continues? Is God's custom a necessary feature of His will, or is it purely contingent? If it's contingent, isn't the stability of the universe just a massive, ongoing coincidence?

  **Follow-up (If he says "It's contingent but God is faithful"):**
  "If it's purely contingent, then at any moment *t2*, God could will differently than at *t1* without contradicting His nature. So when I say 'fire burns cotton,' I'm not making a claim about fire or cotton, but a prediction about God's future psychological states. Why call that 'natural philosophy' at all? Why isn't that just speculative theology disguised as physics?"

  ### 2. Human Responsibility and *Kasb*
  **Question:** Let's apply this to human action. If I raise my hand, you say God creates the motion, not me. The traditional Ash'ari move is *kasb* (acquisition)—I 'acquire' the act God creates. But if I have zero causal power over the motion itself, what work is the word 'acquisition' doing? How is this metaphysically different from a puppet who *feels* like they're moving their own limbs?

  **Follow-up (If he says "We intend the act, God creates it"):**
  "But on your view, God also creates the intention. If God creates the motion *and* the intention to move, and I contribute no causal power to either, in what sense am I the 'agent'? Are we just locating responsibility in a feeling of authorship that is itself causally inert?"

  ### 3. Averroes's Objection on Essences
  **Question:** Averroes argued that if you deny natures, you destroy the possibility of definition. If fire doesn't have the power to burn, 'burning' isn't part of the essence of fire—it's just an external event attached to it. If things have no essential powers, how can we know *what* things are? Doesn't this view make scientific definition impossible, reducing everything to a list of observed conjunctions?

  **Follow-up (If he says "We know things by their observable properties"):**
  "But without causal powers, properties are just a bundle of habits. If 'flammability' isn't a power but just a record of past customs, how do you distinguish between a thing's *essence* and its *accidents*? If God changed His custom tomorrow, would fire still be fire? If yes, essence is independent of custom; if no, essence is arbitrary."

  ### 4. The Humean Divergence
  **Question:** You start from a very Humean premise: we never observe 'necessary connection,' only constant conjunction. But Hume uses that skepticism to ground science in human utility and habit, whereas you use it to ground theology in Divine Power. Why does the lack of observable necessity point *upward* to God rather than *inward* to human psychology? What prevents this argument from sliding into Humean naturalism?

  **Follow-up (If he says "Hume denies God, I affirm Him"):**
  "That's a theological conclusion, not a metaphysical one. I'm asking about the inference. If the data is identical (we only see conjunction), what logical step forces us to posit a Divine Agent rather than just stopping at 'we don't know'? Isn't 'God's Custom' just a placeholder for the same ignorance Hume admitted?"

  ### 5. The Problem of Pain
  **Question:** If creatures have no causal power, then when a murderer strikes a victim, God is the direct creator of the wound and the pain, moment by moment. The murderer is just the occasion. Does this not make God the sole direct agent of every evil act? How is this distinct from saying God is the only sinner, and humans are just the props?

  **Follow-up (If he says "God permits it for a greater wisdom"):**
  "But 'permitting' implies allowing a secondary cause to act. You've denied secondary causes. So God isn't permitting the pain; He is fabricating it directly at the moment of the strike. How do you maintain God's goodness if He is the immediate efficient cause of the victim's suffering?"

  ### 6. The Intelligibility of Prayer
  **Question:** If natural law is just God's habit, and every event is a direct act of God, what is the function of prayer? If I pray for rain, am I asking God to break His custom? If He was already going to send rain, the prayer is superfluous; if He wasn't, does my prayer causally influence God? If so, don't *I* have causal power over God's will?

  **Follow-up (If he says "Prayer is part of the custom"):**
  "So God's custom includes 'answering prayers.' But that implies a conditional structure in reality: *If* prayer, *Then* rain. Who sustains that conditional link? If it's not a real causal connection, it's just another coincidence. Why should I trust that this specific coincidence (prayer/rain) is more reliable than any other?"

  ### 7. Scientific Prediction vs. Theological Hope
  **Question:** When a scientist launches a rocket, they rely on equations that assume stable natures (gravity, thrust, combustion). On your view, they are actually betting on God's consistency. If the rocket fails, was it bad math, or did God change His custom? Is there any practical difference between these two explanations for the scientist in the lab?

  **Follow-up (If he says "Science describes the custom, theology explains the source"):**
  "If science only describes the custom, it can never explain *why* a mechanism works, only *that* it worked before. But engineering requires knowing *why* to build new things. Doesn't occasionalism cripple innovation by telling engineers they aren't manipulating powers, but merely guessing at habits?"

  ### 8. The Falsifiability Clincher
  **Question:** Finally, let's talk about evidence. You say the world looks the way it does because of God's custom. What observation, in principle, could count as evidence *against* your theory? If fire burned cotton today but turned it to gold tomorrow, you'd say 'God changed His custom.' If it burns cotton consistently, you say 'God keeps His custom.' Is there any state of affairs that would falsify occasionalism?

  **Follow-up (If he says "No, it's a metaphysical framework"):**
  "Then we aren't debating an explanation of the world; we're debating a lens through which to view it. If no empirical evidence can touch the view, isn't it immune to reason as well? If you accept that, are you asking us to adopt this view on faith alone, rather than philosophical merit?"
