      *   **Core Thesis:** No creature has causal power; God is the only true agent; natural law is God's "custom" (*'adah*).
      *   **Guest's Tactic:** Dodges predictability questions by appealing to "God's custom."
      *   **Task:** Draft 8 questions to make that dodge harder.
      *   **Specific Requirements:**
          1.  At least one on human responsibility (the *kasb* move).
          2.  At least one on the parallel/divergence with Hume.
          3.  At least one on Averroes's objection regarding essences/natures.
          4.  Each question needs a follow-up keyed to the likely answer.
          5.  End with a question about falsifiability (what observation counts as evidence against the view?).
      *   **Tone:** Academic but accessible (podcast format), rigorous, progressively tightening the screws.

  2.  **Deconstruct the Guest's Position (Ghazalian Occasionalism):**
      *   *Metaphysics:* Contingency of the world. No necessary connection between cause and effect.
      *   *Epistemology:* We observe conjunction, not causation. Certainty comes from revelation or immediate intuition, not inference from nature.
      *   *Theology:* God's omnipotence and freedom. If nature had independent power, it would limit God.
      *   *The "Custom" Dodge:* Why does fire always burn cotton? Because God wills it to happen that way habitually, not because fire has the power to burn.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The "Custom" Definition.* Start by pinning down what "custom" actually means. Is it arbitrary?
          *   *Follow-up:* If he says it's stable, ask *why* stability matters if there's no underlying nature.

      *   *Question 2: Human Responsibility (Kasb).* This is a required element. Occasionalism risks making humans puppets. Al-Ash'ari developed *kasb* (acquisition) to save responsibility.
          *   *Follow-up:* If he says we "acquire" the act, ask what work "acquisition" is doing if we don't cause the motion.

      *   *Question 3: Essences/Natures (Averroes).* This is a required element. Averroes argued that denying natures makes knowledge impossible.
