      *   *Question 5: The Problem of Evil/Pain.* If God directly causes every event, He directly causes pain.
          *   *Follow-up:* If he says it's for a greater good, ask why the *mechanism* of pain needs to be directly willed moment-to-moment rather than built into a nature.

      *   *Question 6: Prayer and Intervention.* If everything is God's direct act, what does prayer do?
          *   *Follow-up:* If he says prayer changes God's will, ask if that means God's "custom" is fickle.

      *   *Question 7: Scientific Practice.* How does a scientist work under this view?
          *   *Follow-up:* If he says science just describes custom, ask why we trust predictions about *new* contexts (e.g., space travel).

      *   *Question 8: Falsifiability.* This is a required element (end question).
          *   *Follow-up:* If he says nothing could falsify it, admit it's a metaphysical commitment, not an empirical one.

  4.  **Refining and Polishing (Making them "PhD Level" but Podcast Friendly):**
