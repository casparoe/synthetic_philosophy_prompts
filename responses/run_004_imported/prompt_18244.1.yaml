answer: |-
  The whiteboard still smelled of dry-erase solvent. The numbers from three weeks ago remained, circled in red: **$p = 0.60$, $b = 1.0$, $f_{Kelly} = 0.20$**.

  Elena stood with the marker capped, her arms crossed. Marcus was leaning against the desk, arms uncrossed, holding a coffee that had gone cold. I sat in the corner, pretending to review code, knowing I was the audience for a play that had been running since before I was hired.

  "You're treating the utility function as a discovery, Elena," Marcus said, tapping the board where she'd written $E[\ln(W)]$. "It's an assumption. You say 'geometric rationality' like it's a law of physics. It's not. It's a specific preference for logarithmic growth. If I prefer a linear utility of wealth because I have quarterly bonuses to hit, full Kelly is irrational for *me*."

  Elena pushed off the wall. "That's the standard neoclassical dodge. You're assuming wealth is additive. It isn't. I don't have parallel universes where I can average out the outcomes. I have one timeline. My wealth evolves multiplicatively along a single path. If you maximize the ensemble average—the expectation across hypothetical parallel selves—you invite ruin on the single path that actually exists."

  "Ruin is a boundary condition, not a dynamic law," Marcus countered. "I'm not betting the farm. I'm sizing positions. And you're talking about the limit as $N \to \infty$. We don't have infinity. We have a fiscal year. We have investors who redeem if we draw down fifteen percent in a month. The 'long run' is a fairy tale we tell to justify volatility we can't explain to the board."

  "The long run isn't about infinity, Marcus. It's about the order of operations," Elena said, stepping to the board and drawing a single jagged line moving right. "Look. If you bet more than Kelly, your expected wealth might go up, but your median wealth goes to zero. The ensemble average is skewed by one lucky path in a million that hits heads forever. But *you* won't be that path. You'll be the typical path. And on the typical path, over-betting shrinks the geometric mean. That's not a preference. That's arithmetic."

  Marcus walked to the board and drew a second line, shorter, ending abruptly. "Arithmetic doesn't account for being fired. You say log utility emerges from the dynamics. I say you're conflating the growth rate of the capital with the utility of the agent. Log utility implies constant relative risk aversion of one. It implies I care as much about losing 10% of a million as I do about losing 10% of a billion. Do you? Really?"

  "I care about not going to zero," Elena said. "And I care about maximizing the rate at which I escape zero. If you use a utility function less curved than log—say, square root—you are implicitly betting more than Kelly. You are accepting a lower geometric growth rate for higher variance. Why? What is the objective? If the goal is to maximize terminal wealth over a long horizon, Kelly is the unique solution. If you deviate, you are admitting you care about something other than wealth."

  "I care about the *path* of the wealth," Marcus snapped. "Utility isn't just about the final number. It's about the consumption stream, the career stability, the ability to sleep. Kelly maximizes the final number, but it guarantees a 50% drawdown at some point. With a 60% win rate and 20% sizing, the volatility of the log-wealth is massive. You're arguing that because the system is non-ergodic, I must adopt log utility. I'm arguing that because the system is non-ergodic, I need to survive the journey, not just optimize the destination."

  Elena uncapped the marker and wrote **ERGODIC** in capital letters. "This is exactly the point. In a non-ergodic system, the time average does not equal the ensemble average. Expected Utility Theory maximizes the ensemble average. It asks, 'What is the average outcome if a million people make this bet once?' But you are one person making a bet a million times. The average of the million people is irrelevant to you. The time average is all that exists. And the time average is maximized *only* by the Kelly criterion. To say 'I prefer a different utility' is to say 'I prefer a lower time-average growth rate.' Why would you prefer that?"

  "Because the time average assumes I can reinvest forever without friction," Marcus said, pointing at the 0.20. "Twenty percent of equity. On a signal that might decay. On a desk that might lose its liquidity provider. You're optimizing for a frictionless vacuum. If I half-Kelly, I sacrifice maybe 25% of the growth rate, but I reduce the variance by half. That's not 'sub-optimal.' That's a hedge against model error. That's a hedge against *you* being wrong about the 60%."

  Elena paused. The marker hovered. "If you're uncertain about the edge, you should shrink the size. That's parameter uncertainty, not utility preference. Don't hide behind risk aversion if your real concern is that my alpha estimate is noisy. But if the edge *is* 60%, and you bet half-Kelly, you are objectively leaving growth on the table. You are paying an insurance premium against a risk that doesn't exist in the math."

  "The risk exists in the reality!" Marcus slammed his hand on the desk. "The risk that the firm closes. The risk that I get fired. The risk that the market structure changes. Log utility assumes the game continues indefinitely. It doesn't. If the game stops at a random time $T$, and $T$ is correlated with drawdowns—which it is, because investors pull capital when we lose—then maximizing geometric growth is not optimal. It's suicide."

  Elena turned back to the board, drawing a horizontal line across the jagged path. "So you're saying the stopping condition is endogenous. Fine. But if you size smaller to avoid the stopping condition, you admit that the constraint is the drawdown, not the utility. So state that. Don't say 'Kelly assumes log utility.' Say 'Kelly assumes no intermediate constraints.' But don't call it a preference. It's a constraint."

  "It *is* a preference," Marcus insisted, softening his tone but not his stance. "Because I choose to impose the constraint. I prefer a smoother equity curve. I prefer to keep my job. That is a utility function. It just isn't defined on terminal wealth alone. It's defined on the minimum wealth experienced along the path. Log utility ignores the dips. I don't."

  "Log utility doesn't ignore the dips," Elena said, her voice quiet but sharp. "It accounts for them perfectly. A 50% loss requires a 100% gain to recover. Log utility penalizes the loss exactly enough to prevent you from taking risks that make recovery impossible. If you care about the minimum wealth, you should know that full Kelly minimizes the time to reach any high watermark. It gets you away from the ruin barrier fastest. Anything less than Kelly increases the probability of hitting a low watermark before a high one."

  "That's only true if the edge is constant," Marcus said. "And if you have infinite capital divisibility. We trade in lots. We have transaction costs. We have slippage. The 'geometric rationality' argument is beautiful in continuous time. In discrete time with frictions, it's a razor's edge. I'd rather stand back from the edge."

  "Standing back is a choice," Elena said, capping the marker with a definitive click. "But don't dress it up as rationality. It's caution. It's fear. Call it what it is. But don't tell me I'm smuggling in log utility. The math of compounding *demands* it. If you want to maximize the size of the pie eventually, you cut it this way. If you want to eat a slice today and ensure you have a plate tomorrow, that's a different problem. But that's not about what's rational for the capital. It's about what's rational for the career."

  Marcus picked up his cold coffee. "And who manages the capital? People with careers. The capital doesn't make the decisions. We do. If the agent's utility function isn't log-wealth, then Kelly isn't optimal. And since no human actually has log-wealth utility—nobody is truly indifferent between a 50/50 bet to double or halve their net worth—Kelly is a benchmark, not a mandate."

  Elena wiped the board clean, erasing the word **ERGODIC** first. "Then admit you're not trying to grow the book. You're trying to manage your own anxiety. I'm fine with that. But don't claim the math is on your side. The math says 20%. You're saying 5%. That's a tax you're levying on the investors for your peace of mind."

  "It's a fee for keeping the lights on," Marcus said, turning to leave. "And for making sure we're here to trade the next signal when your 60% edge inevitably regresses to 55%."

  He walked out. Elena stared at the blank space where the numbers had been. She didn't erase the 0.20 she'd written in the corner. I watched her calculate the expected drawdown of a 5% position in her head, saw her frown, and knew the argument would resume tomorrow.
