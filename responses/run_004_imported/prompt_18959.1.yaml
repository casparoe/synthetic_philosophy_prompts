      *   Lewis says: If you treat the Conditional Ticket as a standard ticket with a fixed payout structure, the math forces the red and blue balls to be unrelated.
      *   Why? Because the value of the ticket changes *too smoothly* with your information. A standard ticket has a fixed value structure. A conditional's value is purely relational.

      *Let's try a better analogy: The Shape-Shifter.*
      *   Propositions are like statues. They sit there. You walk around them (gain info), seeing different angles, but the statue doesn't change.
