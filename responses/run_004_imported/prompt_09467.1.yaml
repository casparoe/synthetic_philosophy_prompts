  Thank you all for being here.

  For those who don't know me, I'm [Your Name]. I write about science and philosophy for a living. I spend most of my days analyzing why smart people look at the same world and see different truths. So, standing here to talk about my father—a man who saw the world very clearly, often more clearly than I did—feels like a strange assignment. But he asked me to do this. And there is a specific thing he needed me to say.

  My dad was an artilleryman in Vietnam. 1968 to 1969. He carried the weight of those years until the end. But he didn't carry the weight in the way you might expect.

  He wasn't a man who believed in flags or slogans. He stopped believing that Vietnam was a righteous cause decades ago. He knew that wars are started by old men in rooms far away from the mud. But he was haunted by a different question. It wasn't about whether the war was right. It was about whether the fighting made him wrong.

  He was terrified of the idea that serving in an unjust war made a soldier a criminal. He read a lot about this in his later years. He found comfort in an idea that says: a soldier is not a murderer simply because his country sent him to the wrong place. He believed that if you follow the rules of war, if you distinguish between combatant and civilian, if you do the job in front of you without malice—you remain a human being.

  And here is the part that mattered most to him: He believed that applied to the man on the other side of the hill, too.

  He told me once that the NVA soldier who put shrapnel in his leg wasn't a monster. He was a guy with a rifle, following orders, trying to survive, just like him. To my dad, thinking otherwise was the same mistake wearing two different faces. If he was a murderer for being there, so was the other guy. And if the other guy was just a soldier doing his duty, then so was he.

  He needed that symmetry to live with himself. He needed to know that he could look in the mirror without seeing a killer, even if the cause was lost.

  I know there are people smarter than me who argue about this. I know there are debates about whether morality allows for that kind of equality. My cousin is here, who serves our country today, and she knows those debates better than I do. We can argue about the justice of causes until the end of time. But we cannot argue about the cost.

  My dad's philosophy wasn't a legal brief. It was a lifeline. It was the only way he could reconcile the man he was before the war with the man he became after. He refused to hate the enemy, because he knew that hate would have turned him into something he wasn't. He chose to see the soldier across the field as a reflection of himself. Not to justify the war, but to salvage the men who fought it.

  To his army buddies here today: He remembered you. He remembered the noise, the heat, and the brotherhood. He didn't need the war to be noble to know that the bond you shared was real.

  To my cousin, and to all who serve: He honored your choice to wear the uniform, even while he questioned the hands that signed the orders. He wanted you to know that your worth isn't determined by the politics of the moment, but by the integrity you hold onto when the shooting starts.

  My dad died two weeks ago. He left behind a lot of books, a lot of memories, and a leg that ached when it rained. But he left without the guilt he was so afraid of. He made his peace with the ghost in the tall grass a long time ago.

  He taught me that we are responsible for our own actions, even when we are part of a machine we didn't build. He followed the rules. He protected his conscience. And he granted that same grace to the men who tried to kill him.

  That was his victory. Not in the war, but over it.

  Rest easy, Dad. You're home.
