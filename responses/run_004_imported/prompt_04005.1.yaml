      *   *Kavka's Toxin Puzzle:* An eccentric billionaire offers you $1 million if you *intend* to drink a harmless but painful toxin tomorrow. You don't have to drink it, just intend to. But if you get the money, why drink it? If you know you won't drink it, can you intend to?
