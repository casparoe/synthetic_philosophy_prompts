  8.  **Final Polish:** Ensure the distinction between "General Will" (Rousseau) and "Truth/Conscience" (Weil) is the pivot point. This explains *why* Weil is more radical on parties but less totalitarian on civil society. (Wait, if she allows civil society, is she less totalitarian? Yes, Rousseau's "no factions" is arguably more intrusive on daily life than Weil's "no parties." I need to nuance the "radical" claim. Weil is more radical on *political structure*, but potentially more liberal on *civil society*. I will argue she is more radical regarding the *nature* of political organization.)

