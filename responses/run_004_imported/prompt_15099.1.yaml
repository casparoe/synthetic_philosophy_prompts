          *   Thorne (Dennettian) counters. Utility is the metric, not perfection. Humans contradict themselves too.
      *   **Deepening the Argument (The Core Conflict):**
          *   *Vance's Move:* Symbol Grounding/Teleosemantics. The AI doesn't care about truth; it cares about pattern matching. It has no "skin in the game." The contradiction shows it's manipulating syntax without semantics.
          *   *Thorne's Move:* The Intentional Stance doesn't require perfect rationality, just *enough* rationality to be useful. The "belief" is a heuristic. If the AI is usually right, we attribute belief. The glitch is a bug in the implementation, not the stance.
      *   **The Counter-Counter:**
