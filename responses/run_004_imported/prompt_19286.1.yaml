answer: |-
  Good evening. For those who don't know me, I'm a novelist, which means I make things up for a living. Nora is the one who figures out what's actually real. And since about a third of this room knows her work better than I do, I know I'm walking into a trap talking about Zhuangzi.

  We all know the Butterfly Dream. It's the party trick of Eastern philosophy: A man dreams he's a butterfly, wakes up, and wonders if he's a man dreaming he's a butterfly, or a butterfly dreaming he's a man. Usually, people stop there. It's the Chinese Descartes moment. It's supposed to mean nothing is real, everything is uncertain, and maybe we're all just hallucinations having a dinner party.

  But that's not how the passage ends. And Nora knows better than to leave us in the doubt.

  Zhuangzi wakes up. He stretches. And he concludes that while the dream was vivid, he is still Zhuangzi, and the butterfly is still a butterfly. There is a difference. He calls what happened not an illusion, but a transformation. The reality isn't erased; it's changed.

  I look at Nora and Sam, and I see that same bravery. Too often, marriage is sold as a merger. Two people dissolving into one vague, happy cloud. But watching them these past few years, I haven't seen dissolution. I've seen two distinct, stubborn, wonderful people who are entirely themselves, undergoing something undeniable together. They aren't asking if this is real. They are building it.

  They understand that love isn't about losing the boundary between self and other. **They know that between two lives, there must be some distinction.**

  For the rest of you, that sounds like healthy independence. For Nora's old cohort, that is the only line in the *Qiwulun* that matters.

  So, let's not drink to a dream. Let's drink to the waking up. Let's drink to the transformation of things. To Nora and Sam.
