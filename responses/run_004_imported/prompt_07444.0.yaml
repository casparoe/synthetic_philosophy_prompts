      *   Timeframe? Yes (12-month pilot).
      *   Looping vs. Goodhart? Yes.
      *   Clinician buy-in? Yes (acknowledges treatment efficacy).

  9.  *(Self-Correction on Hacking)*: I need to make sure I don't misrepresent Hacking for the user. Hacking's point is that classifying people changes how they understand themselves, which changes the class. It's not just "labels are bad." It's "labels interact." I will weave this into the "Risk Analysis" section.

  10. **Final Polish:** Ensure the voice is professional, empathetic, and authoritative. (Proceed to generate output).

  *(Wait, one last check on the "Intake" detail)*: The prompt says "intake and follow-up screeners for bereaved family members." In hospice, "intake" for family bereavement often happens *before* the patient dies (pre-bereavement) or immediately after. PGD cannot be diagnosed until 12 months post-death. Screening for PGD at intake is clinically premature. This is a huge leverage point. I will emphasize this.

