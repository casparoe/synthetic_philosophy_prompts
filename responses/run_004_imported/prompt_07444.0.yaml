answer: |-
  **MEMORANDUM**

  **TO:** Clinical Policy Committee
  **FROM:** [Your Name], Data & Outcomes
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Universal PGD Screening Protocol

  ### Executive Summary

  This memo addresses the proposal to integrate a universal Prolonged Grief Disorder (PGD) screener into all bereaved family member intakes and follow-ups. While the clinical intent—to reduce stigma and expedite access to evidence-based treatment—is sound, implementing a *universal* screener at *intake* presents significant clinical and ethical risks.

  **Recommendation:** I recommend we **do not adopt the universal intake screener as currently proposed.** Instead, I propose a **12-month pilot of a targeted, delayed-screening protocol.** Under this modification, PGD-specific screening would occur only at the 6-month and 12-month bereavement check-ins, restricted to families flagged via initial risk assessment, and preceded by psychoeducation that explicitly decouples "normal grief" from "pathological grief."

  This approach preserves the goal of early intervention while mitigating the risk that our measurement tools inadvertently shape the very symptoms we aim to treat.

  ### Background and Clinical Intent

  The addition of Prolonged Grief Disorder to the DSM-5-TR (2022) provides a validated framework for identifying severe, impairing grief persisting beyond 12 months. The bereavement team's proposal is driven by two valid premises:
  1.  **Treatment Efficacy:** Therapies like Complicated Grief Treatment (CGT) have strong trial evidence.
  2.  **Triage Efficiency:** Waiting for crises to surface ad-hoc delays care for those who need it most.

  We agree that silence should not be mistaken for resilience. However, the proposed mechanism (universal intake screening) conflicts with the diagnostic criteria (12-month duration) and introduces a specific psychological risk distinct from standard data concerns.

  ### Risk Analysis: Looping Effects vs. Goodhart's Law

  In our previous discussions, concerns were raised that "creating a checkbox creates the condition." It is vital to distinguish this from Goodhart's Law, as the mitigation strategies differ.

  *   **Goodhart's Law** applies when a measure becomes a target. (e.g., If we reward counselors for low PGD scores, they might under-report symptoms). This is strategic gaming of incentives.
  *   **Looping Effects (Ian Hacking):** This applies to "interactive kinds"—classifications of people that interact with the people classified. When we label a human experience, people become aware of the label and may unconsciously alter their self-narrative to align with it.

  **The Specific Risk:**
  If we introduce a PGD screener at *intake* (often pre-bereavement or immediately post-death), we introduce a "deadline" narrative into the mourning process. A family member told at Month 1 that "grief becoming a disorder at Month 12 is a risk" may begin monitoring their healing against that clock. This surveillance anxiety can inhibit natural adaptation, potentially *prolonging* the grief we aim to measure.

  In short: Goodhart's Law suggests our *data* might get corrupted. Looping Effects suggest our *patients' experiences* might get altered. We are not just measuring grief; we are intervening in it by naming it.

  ### Clinical Validity and Timing

  There is also a strict clinical discrepancy in the current proposal. DSM-5-TR criteria for PGD require symptoms to persist for **12 months post-loss**.
  *   **Intake Screening:** Screening for a 12-month condition at intake (Day 0) is clinically invalid. It cannot detect PGD; it can only detect *risk factors* for PGD.
  *   **Conflation:** Labeling acute grief risk as "PGD screening" risks medicalizing normal, acute bereavement. This validates the looping concern: we risk teaching families that their current, normal pain is a precursor to pathology.

  ### Proposed Protocol: The "Delayed-Targeted" Pilot

  To balance the need for triage with the risk of looping effects, I propose the following modifications for a 12-month pilot period (November 2023 – November 2024).

  **1. Timing Shift (The "12-Month Rule")**
  *   **Action:** Remove PGD-specific screening from the initial intake form.
  *   **Replacement:** Intake will focus on *risk factors* (e.g., suddenness of death, prior mental health history, dependency levels) using a standard risk assessment.
  *   **Screening Window:** The actual PGD screener (e.g., PG-13-Revised) is administered only at the **6-month** and **12-month** follow-up contacts.
  *   **Rationale:** This aligns with the diagnostic timeline. It allows acute grief to run its natural course without the shadow of a "disorder" classification hanging over the initial months.

  **2. Targeted vs. Universal**
  *   **Action:** Administer the PGD screener universally at 12 months, but *targeted* at 6 months.
  *   **Criteria:** At 6 months, only those flagged as "High Risk" during intake receive the PGD screener. All others receive a general well-being check.
  *   **Rationale:** Reduces the "surveillance" footprint on low-risk families, minimizing the looping effect where low-risk individuals begin searching for symptoms that aren't there.

  **3. Framing and Psychoeducation (The Safeguard)**
  *   **Action:** Prior to any screening, counselors must provide a brief script normalizing grief variability.
  *   **Script Concept:** "Grief changes shape over time. We ask these questions not to label your pain as 'wrong,' but to see if you have the support you need right now. There is no 'correct' timeline for mourning."
  *   **Rationale:** This directly counters the looping effect by decoupling the *screening* from the *judgment*. It frames the tool as a resource gateway, not a diagnostic verdict.

  **4. Review Timeline**
  *   **Action:** Committee to review data on **November 1, 2024**.
  *   **Metrics:** We will compare PGD identification rates and treatment uptake against the previous year's ad-hoc data. Crucially, we will also track *declination rates* and counselor qualitative feedback on family reactions to the screening.
  *   **Decision:** Based on this review, we will vote to make the protocol permanent, adjust it, or scrap it.

  ### Conclusion

  The clinicians on this committee are correct that PGD is real and that suffering should not be ignored. However, in hospice work, *how* we offer help is as important as *that* we offer it.

  By moving from a universal intake screener to a delayed, targeted pilot, we acknowledge the reality of Prolonged Grief Disorder without imposing its timeline on the bereaved before they have had time to grieve. We avoid the trap of manufacturing pathology through surveillance while maintaining a robust safety net for those who need clinical intervention.

  I request we vote to adopt this **Modified Pilot Protocol** effective immediately.

  ***

  ### Appendix: Note on "Looping Effects" for Discussion
  *For the purpose of Thursday's discussion, if the distinction between Looping Effects and Goodhart's Law arises:*

  *   **Goodhart's Law** is about **incentives**. (Example: If we pay counselors based on low PGD scores, they will stop coding PGD).
  *   **Looping Effects** are about **identity**. (Example: If we tell a mourner there is a "12-month deadline" for normal grief, they may feel broken at Month 13, and that feeling of being "broken" becomes a barrier to healing, making the diagnosis come true *because* we named it).

  *We are trying to avoid the latter, not just the former.*
