answer: |-
  **Setting:** *A university coffee shop, late afternoon. Two graduate students, Alex (defending Moore) and Jordan (defending a sophisticated Hedonism), are surrounded by dog-eared copies of* Principia Ethica. *The rest of the seminar group has dispersed, but these two are still at it.*

  **Jordan:** Look, I'm willing to grant Moore that "good" is indefinable. I'll even grant that he's identified a naturalistic fallacy in Mill. But this "Two Worlds" argument in Section 50? It's a parlor trick. Moore asks us to imagine a world of exquisite beauty and a world of utter filth, stipulating that no conscious being ever perceives either. He says the beautiful one is *better*. My claim is simple: You cannot perform that thought experiment without cheating.

  **Alex:** Cheating how? The stipulation is clear. *Ex hypothesi*, no human or spirit ever sees them.

  **Jordan:** The stipulation is verbal, not phenomenological. When I try to picture the "beautiful world," I am picturing it. *I* am the observer. My mind is filling the void. So when Moore asks, "Which is better?" and I feel a pull toward the beautiful one, that pull isn't coming from some ghostly value floating in the unobserved cosmos. It's coming from *my* pleasure in contemplating the image. The intuition is real, but the diagnosis is wrong. It's tracking my enjoyment, not the world's intrinsic worth.

  **Alex:** That's the psychological genesis of the belief, not the justification for it. Just because I use my consciousness to access the thought experiment doesn't mean the value I'm detecting resides *in* my consciousness. Look, if I use a telescope to look at two distant stars, one blue and one red, the fact that I'm using my eyes to see them doesn't mean the color is in my eyes.

  **Jordan:** Bad analogy. With the stars, I can verify the color independently. I can send a probe. With Moore's worlds, the *only* access is the imagination. Moore is asking you to strip away all relation to consciousness, but value is essentially relational. "Better" is a comparative term. Better *for* what? Better *for* whom? If you remove the "for," you're left with a predicate that dangles in the void. You're smuggling in a "God's eye view" where value is a physical property like mass, which Moore explicitly denies it is.

  **Alex:** He denies it's a *natural* property, not that it's real. But let's grant your point for a second. Let's say the intuition is contaminated by our act of imagining. Moore has a counter-move for that. He'd say: Even if *we* get pleasure from imagining it, we can distinguish between the pleasure of the imagination and the value of the object imagined. Ask yourself: If you knew for a fact that the beautiful world would *never* be imagined by anyone, not even you in the future, would it still be preferable that it exist rather than the heap of filth?

  **Jordan:** And half the class said "No." Because if it makes no difference to experience, it makes no difference, period. But here is where I want to press you on Moore's own text. You're defending the value of the unobserved object. But turn the page. Moore introduces "Organic Unities." He argues that the *consciousness* of a beautiful object is a greater good than the sum of the value of the object plus the value of the consciousness taken separately.

  **Alex:** Right. The whole is not equal to the sum of its parts.

  **Jordan:** Exactly. So, if the *combination* of object-plus-consciousness is the primary locus of value, why is Moore so desperate to prove the object has value *without* the consciousness? It feels like he wants it both ways. He uses the "Two Worlds" argument to batter the Hedonist and prove beauty matters independently. But then, when he talks about the highest goods—like personal affection or aesthetic appreciation—he admits the real value is in the *organic unity* of the mind grasping the object. If the unconscious world has value, fine. But if the *real* goods require consciousness, hasn't the Hedonist won the practical war? Consciousness is still the necessary vessel.

  **Alex:** Not necessarily. Think about the structure of the Organic Unity. Moore says the value of the whole is not proportional to the sum of the parts. But that implies the parts *contribute* to the whole. If the beautiful object had zero value in itself—if it were value-neutral—then adding consciousness to it wouldn't create an organic unity of *beauty*; it would just be consciousness of a neutral thing. The direction of the value comes from the object.

  **Jordan:** But if the object's value is zero without consciousness, as my camp argues, then the "unity" is doing all the heavy lifting. Moore is trying to have his cake and eat it too. He wants to say the heap of filth is objectively worse than the garden, even unobserved. But then he says the *best* things are states of mind. It's inconsistent. If consciousness is the sine qua non of the highest goods, why fight so hard for the value of the unconscious? It looks like he's clinging to the "Two Worlds" argument just to avoid the label of Hedonist, even though his own theory of Organic Unities concedes that value blooms only where mind meets world.

  **Alex:** It's not inconsistent; it's foundational. Moore needs the object to have *some* intrinsic value to explain why the consciousness of it is *good* rather than *bad*. Consider the opposite: The consciousness of the heap of filth. That is a bad organic unity. Why? Because the object is ugly. If the object's value was entirely dependent on the consciousness, then the consciousness of filth could be just as good as the consciousness of beauty, provided the mind was pleased. But Moore says no. The nature of the object constrains the value of the whole. Therefore, the object must carry some axiological weight independently, otherwise, you can't distinguish a virtuous appreciation from a deluded one.

  **Jordan:** Okay, that's strong. I'll grant that the *nature* of the object matters for the *quality* of the experience. But does "mattering for the quality" equal "intrinsic value"? I can say a poison pill has properties that make it deadly, without saying the pill has the intrinsic value of "deadliness" sitting inside it waiting to be found. The deadliness is in the interaction.
  Here's my trap for you, Alex. Moore lists the two greatest goods: the pleasures of human intercourse and the enjoyment of beautiful objects. Both involve *consciousness*. Personal affection, he says, is one of the greatest things. But affection requires mutual consciousness. You can't have affection for a rock. So, in the very chapter where he proves value exists without consciousness, he defines the *ideal* using things that require consciousness. Doesn't that suggest the "Two Worlds" argument is just a negative point against Hedonism, but not a positive account of where value actually lives?

  **Alex:** It's a negative point against *strict* Hedonism, yes, but it establishes the ontology of value. Think of it like mathematics. Does the truth of a complex equation exist before a mathematician thinks it? Moore would say yes. The "Two Worlds" argument establishes that value is part of the fabric of reality, not just a projection of sentience.
  Now, regarding the Ideal: Yes, the *greatest* goods require consciousness. Moore never denied that. He denied that *only* consciousness matters. The reason personal affection is a great organic unity is precisely because it involves two valuable things: the consciousness of the persons *and* the reality of their affection. If the persons were illusions, the value would drop. If the affection was fake, the value would drop. The "Two Worlds" argument secures the reality of the object pole. Without it, your Hedonism collapses into solipsism. If only experience matters, then a machine feeding you experiences of friendship is equal to actual friendship. Moore says no. The object must be real.

  **Jordan:** But Moore stipulates the worlds are *unobserved*. In the case of friendship, the object is observed. You're conflating "reality of the object" with "value of the unobserved object." I can agree that real friendship is better than simulated friendship without agreeing that a beautiful canyon has value if no one ever sees it.
  Let's push the "Smuggled Observer" one last time. You said the justification isn't the psychology. But Moore relies entirely on intuition. He offers no proof. He says, "If we reflect clearly, we must admit..." But if my reflection tells me that "good" is a word that only applies to welfare, to *someone's* sake, then my intuition blocks his. Why is his intuition the default? Why is "Better" a property of states of affairs, rather than a relation between states of affairs and subjects?

  **Alex:** Because if "good" is relational, you get an infinite regress. If X is good, you ask "Good for whom?" If you say "For Y," you have to ask "Is Y's enjoyment good?" If you say "Yes, because it's good for Y," you're looping. If you say "Yes, because it feels good," you've defined good as pleasure, committing the Naturalistic Fallacy. Moore stops the regress by saying some things are just *good*, full stop. The beautiful world is better, not *for* anyone, but *simpliciter*.
  Your objection about the smuggled observer assumes that because we are subjects, we can only value subjectively. But Moore is asking us to use our reason to grasp a non-natural property. It's like asking a blind man to imagine color. He might say, "I can't, so it doesn't exist." But the failure of imagination isn't a failure of the property.

  **Jordan:** But the blind man can verify color through other means. We have no other means to verify value except our moral sensibility. If that sensibility is evolved to track social welfare and experience—which evolutionary psychology suggests it is—then Moore's "non-natural property" is a ghost.
  Here's where I meet you on Organic Unities, though. If I concede that the *whole* (mind + object) has value that isn't just the sum of parts, I admit that the object contributes something. But I still maintain that contribution is zero unless the circuit is closed by a mind. A battery has potential energy, but it's not doing work until it's in a circuit. Moore wants to say the battery has "work-value" sitting on the shelf. I say it has potential, but "value" is the work.
  So, in your "Two Worlds," the beautiful world has *potential* for value. The ugly world has *potential* for disvalue. But until a mind lands there, the ledger is blank. Moore insists the ledger is already written.

  **Alex:** And I insist that if the ledger is blank until a mind lands there, then you can't explain why it's better to land in the beautiful one. You'd have to say the mind *creates* the value upon arrival. But Moore says the mind *recognizes* it. If the mind creates it, then aesthetic education is just conditioning. If the mind recognizes it, then beauty is a guide to the good.
  Moore's point in Section 50 isn't just about the unobserved worlds. It's about the direction of fit. Hedonism says the world must fit the mind (produce pleasure). Moore says the mind must fit the world (admire what is worthy). The "Two Worlds" argument forces you to admit that worthiness is there before the admiration starts.

  **Jordan:** I can accept that worthiness is there as a *disposition*. But disposition to do what? To cause pleasure. If it couldn't cause pleasure or pain in anyone, ever, the disposition is empty.
  But... I will concede this: If Moore's Organic Unities hold, then my Hedonism is too simple. I can't just sum up pleasures. The *context* of the pleasure matters. The pleasure taken in a real beauty is better than the pleasure taken in a delusion. So, the object's reality matters.
  However, I won't concede the "unobserved" point. If the disposition is never actualized, it's morally inert. Moore wants to say it's morally *active* even then. That's where he loses me. He's turned "Good" into a Platonic Form that glows in the dark.

  **Alex:** Maybe it does glow in the dark. That's the point of Non-Naturalism. It's not part of the causal spatio-temporal order. It doesn't have to "do" anything to be valuable. It just *is*. And if you admit that the beautiful world is better even unobserved, you've admitted that experience isn't the sole container of value. You've cracked the Hedonist shell.

  **Jordan:** I admit nothing of the sort. I admit that *I*, observing the thought experiment, prefer the beautiful world. But I maintain that preference is rooted in my nature as a feeling being. Moore asks me to imagine I'm not a feeling being, but to make the judgment, I have to use my feeling nature. It's a performative contradiction.

  **Alex:** Then we're at an impasse. You think the intuition is a trick of the imagination. I think the imagination is the telescope revealing the truth.

  **Jordan:** Then let's hope the next chapter on "Duty" is clearer. Though if "Good" is non-natural, I have no idea how we're supposed to calculate it.

  **Alex:** Moore would say we don't calculate it. We just look.

  **Jordan:** *Looking* at an unobserved world?

  **Alex:** Looking with the mind's eye.

  **Jordan:** Which brings us right back to the smuggled observer.

  **Alex:** *[Laughs]* Touché. Coffee?

  **Jordan:** Coffee. Even if its value is only instrumental.
