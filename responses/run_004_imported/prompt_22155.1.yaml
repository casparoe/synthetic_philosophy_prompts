      *Middle:*
      Older brother runs the regress. "I didn't choose my parents."
      Younger brother: "So I should just fix you?"
      Older brother: "Exactly. Fix or manage. Don't hate."
      Younger brother: "That's the objective attitude. You want me to treat you like a patient."

      *The Twist:*
