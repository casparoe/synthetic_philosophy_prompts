answer: |-
  "You think saying it was inevitable makes it lighter?"

  "I'm saying it's just physics. Cause and effect. You look at me like I made a choice to be the kind of guy who burns bridges. But I didn't choose the brain that got me here."

  "So what? You're just a billiard ball?"

  "I'm saying I'm not *causa sui*. I didn't create myself. To be truly responsible for what I did at twenty-five, I'd have to be responsible for the way I was at twenty-five. And to be responsible for that, I'd have to be responsible for the way I was at fifteen. And so on. Back to when I was nothing. You can't build yourself out of nothing, Dave. So the blame stops nowhere because it starts nowhere."

  "That's a neat trick. So when you stole from Mum, that was just... gravity?"

  "When I stole from Mum, I did what I did because of how I was. And I was how I was because of genes and houses and schools and things I didn't pick. If you knew everything about my history, every synapse, every trauma, you wouldn't blame me. You'd pity me. It's like heaven and hell. If you knew why someone ended up in hell, really knew the chain of causes, you wouldn't say they deserved it. You'd just see the mechanics."

  "So I'm supposed to what? Adopt the objective attitude? Treat you like a patient to be managed instead of a brother who lied?"

  "Exactly. Manage the situation. Don't waste energy on hate. Hate implies I could have been otherwise. I couldn't."

  "You want me to look at you and see a broken appliance. That's what you're asking. You want me to step out of the relationship because the relationship requires holding you accountable."

  "The relationship requires a fantasy. That we're all little prime movers. We aren't."

  "It's not a fantasy, it's how we live. You don't actually live like that. If I spilled coffee on you on purpose, you wouldn't run a regress on my childhood. You'd be pissed. You'd feel something. That feeling isn't a mistake. It's the price of admission."

  "That feeling is a habit. It's primitive."

  "It's human. You're talking about opting out. P.F. Strawson called it the objective attitude. You treat people as objects when they're incapacitated, or dangerous, or children. You're asking me to treat you like you're incapacitated. Like you're sick. Is that better? That you're sick?"

  "I'm saying I'm not guilty. Guilt requires a freedom I don't have."

  "Freedom isn't the point. Participation is. When you hurt her, you entered into a dynamic with her. Resentment isn't a metaphysical claim about your soul, it's a response to the quality of your will. You showed indifference. I feel resentment. That's not me failing to understand determinism, that's me caring about her."

  "You care about a story. The story where you're the good son and I'm the bad one because I 'chose' it. It keeps you safe. If I'm just broken, then you're not safe. Because you're made of the same stuff."

  "Don't turn this into protection for me. This is absolution for you. You read this somewhere? Inside?"

  "Philosophy books. Yeah."

  "Who?"

  "Galen Strawson. The Basic Argument."

  "Jesus. You know who Galen Strawson is?"

  "Some philosopher. Why?"

  "He's P.F. Strawson's son. The guy you're quoting to justify why you don't owe anyone anything? You're quoting the son who spent his career proving the father wrong."

  "I didn't know that."

  "Of course you didn't. Because you're not looking for truth, you're looking for a shield. The father argued that we don't need this ultimate freedom you're obsessed with. We just need each other. We need the reactive attitudes. The son says unless you're God, you can't be responsible. You're sitting at our dead mother's table using a family feud to win a family argument."

  "It's not a feud. It's logic. If the father was wrong, he was wrong. Doesn't matter who he was."

  "It matters when the logic is just a way to say you don't have to feel bad. You want me to take the objective attitude? Fine. Objectively, you're a risk. Objectively, you're unstable. So I manage you. I don't talk to you. I don't let you near anyone I love. That's the objective stance. It's not peaceful. It's cold."

  "That's not what I want."

  "That's what you argued for. You said blame doesn't make sense. So I won't blame you. I'll just mitigate the damage. Is that what you came here for? To be managed?"

  "I came here to say I'm sorry."

  "You can't. According to Galen, you couldn't have done otherwise. So 'sorry' is just noise. It's just more physics."

  "I feel it."

  "Feelings aren't responsibility. You said so. You said you didn't choose the brain that feels them."

  "I'm trying to tell you I'm stuck."

  "We're all stuck. That's why we hold on to each other. You let go of the blame, you let go of the person. You want to be free of responsibility? You are. You're free of me. But don't ask me to believe your freedom makes you innocent."

  "It makes me real."

  "No. It makes you alone."
