      Younger brother: "His dad was P.F. Strawson. You know that?"
      Older brother: "Yeah."
      Younger brother: "So you're quoting the son to tell me the father was wrong?"
      Older brother: "The son proved the father was hopeful."

      *Ending:*
      Stalemate. The pain remains regardless of the theory.

  5.  **Polishing:**
      *   Remove stage directions.
      *   Ensure the rhythm feels like an argument (short sentences, interruptions).
      *   Check the philosophical accuracy one last time. Galen: Ultimate responsibility impossible. P.F.: Responsibility practices don't require ultimate responsibility.
      *   Make sure the emotional stakes (Mum, prison) stay present.

  6.  **Final Review against constraints:**
      *   No stage directions? Yes.
      *   Length? Looks about right for a page/page-and-a-half.
