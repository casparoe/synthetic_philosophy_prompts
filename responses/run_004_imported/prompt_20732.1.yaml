prompt: |-
  Ok so I've fallen down a rabbit hole of old Overcoming Bias/LW posts on quantum immortality and I don't think anyone's actually nailed the argument shut, so I want your take. Write an essay that actually takes a side on whether the "quantum suicide" wager (the Tegmark gun version, not just vague branching talk) is rational, assuming many-worlds is literally true. Don't just retreat into "well it depends which interpretation of QM you like" -- get into the anthropics: does the argument survive once your explicit about whether "you" get distributed across branches via something like SSA vs SIA, and does Born-rule weighting even cash out as a subjective probability of waking up in a branch, or is that a category error once every branch is equally real? Also people love to gesture at Parfit's fission cases to say low-amplitude survival isn't "really" survival in the sense we care about -- actually engage with that comparison instead of just name-dropping it. End with a real verdict: would you pull the trigger, and which premise in the standard "you'll never experience your own death" argument is the one that actually breaks, if any of them do.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** Quantum Immortality / Quantum Suicide (Tegmark gun version).
      *   **Assumption:** Many-Worlds Interpretation (MWI) is *literally true*. (No hedging on "if QM is true").
      *   **Task:** Write an essay taking a *side* on whether the wager is rational.
      *   **Key Requirements:**
          *   Engage with anthropics (SSA vs. SIA).
          *   Address Born-rule weighting (is it subjective probability or a category error?).
          *   Engage with Parfit's fission cases (does amplitude matter for "survival"?).
          *   End with a real verdict (Would *I* pull the trigger? Which premise breaks?).
          *   Tone: Analytical, decisive, avoiding "it depends" cop-outs.

  2.  **Deconstruct the Argument:**
      *   *The Setup:* A quantum randomizer triggers a gun. 50/50 chance of firing (or some amplitude split).
      *   *The MWI Claim:* In one branch, you die. In the other, you live.
      *   *The Immortality Claim:* You only experience branches where you exist. Therefore, you subjectively experience survival forever.
      *   *The Wager:* If MWI is true, you should accept the bet because the only future "you" that exists to collect the winnings is the one that survived.

  3.  **Identify the Core Tension:**
      *   The tension lies between *ontological existence* (all branches exist) and *subjective anticipation* (what should I expect to see?).
      *   If all branches exist, why do I care about the Born rule? If I'm just "me," and "me" splits, do I become both?
      *   If I become both, do I care about the *measure* of the branches?

  4.  **Anthropics (SSA vs. SIA):**
      *   *SSA (Self-Sampling Assumption):* Reason as if you are a random observer from your reference class. In MWI, if branches have different measures (weights), does SSA pick randomly from *branches* or *observer-moments weighted by amplitude*?
      *   *SIA (Self-Indication Assumption):* Reason as if you are more likely to exist in worlds with more observers. In MWI, this often aligns with Born weights if we treat amplitude-squared as "number of observers."
      *   *Crucial Point:* Standard Quantum Suicide arguments often ignore measure. They assume "I exist in branch A" and "I exist in branch B" are equiprobable for *me*. But MWI says Branch A has measure 0.9999 and Branch B has measure 0.0001. Does "I" care?

  5.  **Parfit's Fission:**
      *   Parfit argues identity isn't what matters; *Relation R* (psychological connectedness) is.
      *   In fission, if I split into Lefty and Righty, both are equally "me."
      *   *Application to QS:* If I split into Dead-Me (non-existent) and Live-Me, Live-Me is continuous with Pre-Me.
      *   *The Twist:* What if the split is into Live-Me (High Amplitude) and Live-Me (Low Amplitude)? Parfit suggests identity is binary, but *degree of survival* might matter. If amplitude correlates with the "strength" of existence or the likelihood of *this* specific stream of consciousness, low-amplitude survival might be "thinner."
      *   *Counter:* But Dead-Me has *zero* continuity. So survival is still guaranteed *somewhere*.
      *   *Rebuttal:* The "Pre-Me" cares about the *distribution* of outcomes. If 99% of the measure dies, is it rational to ignore that?

  6.  **Born Rule & Subjective Probability:**
      *   Decision Theory (Deutsch-Wallace): Rational agents in MWI should act *as if* the Born rule gives probabilities.
      *   Why? Because if you don't, you make decisions that lose utility across the multiverse measure.
      *   If I accept the Quantum Suicide bet, I gain \$1M in the live branch (measure 0.5) and lose my life in the dead branch (measure 0.5).
      *   Even if "Dead-Me" doesn't experience death, "Pre-Me" has preferences over the multiverse state. Pre-Me prefers a multiverse where his family isn't grieving, even if *he* doesn't experience the grief.
      *   *The Break:* The QS argument conflates *first-person anticipation* with *third-person preference*.

  7.  **Formulating the Verdict:**
      *   *Side:* The wager is **irrational**.
      *   *Why:* The "Immortality" claim relies on a solipsistic definition of utility. It assumes the only thing that matters is "what do I see next?" But rational agents care about the external world and the measure of branches where their values are fulfilled.
      *   *Premise that breaks:* The premise that "Subjective anticipation is the only relevant metric for decision theory." Or, "Death is only bad because of the experience of dying." (It's also bad because of the cessation of agency and impact on others).
      *   *Measure Matters:* Low amplitude branches are not just "other places"; they are *less real* in a decision-theoretic sense. If the gun is 99.99% likely to fire (by amplitude), betting on survival is betting against the grain of reality.

  8.  **Drafting - Section by Section:**
      *   **Intro:** Acknowledge the rabbit hole. State the thesis: QS is a category error in decision theory, even if MWI is true.
      *   **The Setup:** Define the Tegmark gun and the MWI assumption.
      *   **Anthropics & Measure:** Tackle SSA/SIA. Argue that SIA + Born Rule = You should expect to find yourself in high-measure branches. Ignoring measure is ignoring the "density" of yous.
      *   **Parfit & Fission:** Engage deeply. Fission shows identity isn't unique, but it doesn't show measure doesn't matter. If 1000 copies of you are created and 999 die, you shouldn't act like survival is certain.
      *   **Decision Theory:** The Deutsch-Wallace theorem. Rationality requires maximizing expected utility across the wavefunction, not just conditioning on survival.
      *   **The Verdict:** No, I wouldn't pull the trigger. The breaking premise is the conflation of *conditional probability of experience* with *unconditional value of the outcome*.

  9.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Am I just saying "death is bad for others"?
      *   *Fix:* Need to make sure it's bad for *me* (Pre-Me). Pre-Me's utility function extends over the whole wavefunction. If 50% of the measure of my future self dies, I have lost 50% of my future utility, even if the other 50% is happy.
      *   *Critique:* What about the "I won't experience death" point?
      *   *Fix:* Acknowledge it. Yes, Post-Me (Live) won't experience death. But Pre-Me cares about Post-Me (Dead)'s non-existence. It's a preference violation.
      *   *Parfit Nuance:* Parfit says survival is what matters. But if survival is split, does the *weight* of the split matter? Yes, because it correlates with the stability/reality of the branch.

  10. **Final Polish:** Ensure tone is sharp, philosophical but grounded. Avoid "on the one hand." Take the stand. (The prompt demands a side).

      *Decision:* I will argue that the wager is **irrational**. The flaw is in the decision theory, specifically the treatment of measure as irrelevant to subjective anticipation.

      *Key Premise to Attack:* "You should only care about branches where you exist to observe the outcome." (The Conditionalization Error).

      *Parfit Integration:* Use Parfit to show that while identity isn't binary, *degree of connectedness* (mapped to amplitude) *is* what we should care about.

      *Anthropics:* SIA is the better fit for MWI, and SIA respects the Born rule.

      *Conclusion:* Don't pull the trigger.

  11. **Final Review against constraints:**
      *   Take a side? Yes (Irrational).
      *   Assume MWI true? Yes.
      *   Anthropics (SSA/SIA)? Yes.
      *   Born rule weighting? Yes.
      *   Parfit engagement? Yes.
      *   Real verdict? Yes.

      *(Self-Correction on Parfit)*: Be careful not to misrepresent Parfit. Parfit argues identity isn't what matters, *Relation R* is. In QS, Relation R holds in the live branch. But does it hold *more* in the high-amplitude branch? Standard Parfit doesn't say "degree of existence," but decision theory in MWI (Wallace) adds the measure component. I need to synthesize them: Parfit opens the door to caring about successors; MWI decision theory tells us to weight them by amplitude.

      *(Refining the "Death" aspect)*: The QS argument says "You never experience death." True. But "You" (the pre-branch agent) experience the *loss* of the branch. The utility function is defined over the multiverse, not just the subjective stream.

      Let's write.
answer: |-
  # The Measure of Survival: Why the Quantum Suicide Wager Fails

  The quantum suicide thought experiment is the most seductive trap in modern metaphysics. It promises a loophole in mortality based on the literal truth of the Many-Worlds Interpretation (MWI) of quantum mechanics. The setup is brutal and simple: you stand before a "quantum gun" triggered by a quantum event (e.g., spin up/down). In one branch, the gun fires and you die instantly. In the other, it clicks harmlessly. The argument for "quantum immortality" posits that since you cannot subjectively experience a branch in which you are dead, you should expect with certainty to hear the *click*. Therefore, if MWI is true, you are immortal, and you should rationally accept any bet that pays out in the survival branch, because that is the only branch where "you" exist to collect.

  This argument is compelling because it exploits a tension between ontology (what exists) and epistemology (what we experience). However, it collapses under scrutiny of anthropic reasoning, decision theory, and a rigorous application of Parfitian identity. Assuming MWI is literally true, the quantum suicide wager is **irrational**. You should not pull the trigger. The argument fails not because MWI is false, but because it relies on a solipsistic error in decision theory: it conflates *conditional subjective anticipation* with *unconditional rational preference*.

  ### The Anthropics of Amplitude: SSA, SIA, and the Born Rule

  To evaluate the wager, we must determine how a rational agent should locate themselves within the wavefunction. This is an anthropic problem. We have two primary candidates: the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA).

  SSA suggests you should reason as if you are a random observer from your reference class. In a naive branching scenario, if there are two branches (Live and Dead), SSA might suggest a 50/50 credence. This fuels the quantum suicide intuition: "There is a version of me that lives, so I will be that version." But this ignores the **Born rule**. In MWI, branches are not created equal; they have different measures (amplitudes squared). A branch where the gun fires might have a measure of 0.99, while the survival branch has 0.01.

  If we treat the Born rule as merely an objective frequency of branches, the suicide argument claims subjective probability should ignore it. "I'm either dead or alive; I won't experience dead; so I'm alive." This is a category error. SIA, which weights hypotheses by the number of observers (or observer-moments) they contain, aligns much better with MWI decision theory. In the context of the wavefunction, "number of observers" maps to **measure**.

  If you accept SIA + Born Rule, you must acknowledge that you are more likely to find yourself in a high-measure branch. Why? Because "you" are not a point-particle of consciousness hopping between worlds; "you" are a structure in the wavefunction. The "amount" of you in the survival branch is proportional to the amplitude. To ignore the Born rule is to claim that a faint, low-amplitude echo of your consciousness is just as likely to be *your current perspective* as the loud, high-amplitude version. While ontologically both exist, epistemically, you should bet on being the high-measure version. If the gun is set to fire with 99% amplitude, betting on survival is betting against the weight of reality itself.

  ### Parfit's Fission and the Weight of Existence

  Proponents of quantum suicide often gesture at Derek Parfit's reductionist view of identity to seal the deal. Parfit argued in *Reasons and Persons* that personal identity is not what matters; what matters is *Relation R* (psychological connectedness and continuity). In a fission case (where one person splits into two successors), Parfit argues survival is not binary. You survive as both.

  The quantum suicide advocate says: "See? In the death branch, Relation R is broken. In the life branch, it holds. Therefore, you survive."

  This engages with Parfit but misses his deeper implication regarding *degree*. Parfit admits that while identity isn't what matters, the *degree* of connectedness can matter. In MWI, amplitude provides a natural metric for this degree. Consider a modified fission case: A machine creates 1,000 copies of you. 999 are immediately destroyed; 1 survives. Are you guaranteed to be the survivor?

  If you say "yes," you are accepting the quantum suicide logic. But this leads to absurdity. If you step into a teleporter that creates 1,000,000 copies on Mars and destroys the Earth original, are you "immortal" because one copy survives a glitch? No. The pre-fission agent has a preference structure that cares about the *set* of successors.

  Parfit's insight actually undermines quantum suicide. If what matters is psychological continuity, we must ask: how much does it matter? If the wavefunction amplitude represents the "strength" or "reality" of that continuity, then low-amplitude survival is *less* survival than high-amplitude survival. It is not that the low-amplitude you is "fake," but that the pre-branch agent's utility is distributed across the measure. To sacrifice 0.99 measure of your future for a payoff in 0.01 measure is to destroy 99% of what matters to you, even if the remaining 1% is happy. Parfit teaches us to care about our successors; MWI decision theory teaches us to weight them by amplitude.

  ### The Decision-Theoretic Break: Conditionalization vs. Preference

  The fatal flaw in the quantum suicide wager is a mistake in decision theory, specifically identified by David Deutsch and David Wallace. They derived that a rational agent in an MWI universe should maximize **expected utility across the multiverse**, weighted by the Born rule.

  The quantum suicide argument relies on **conditionalization on survival**. It says: *Given that I am observing the outcome, I must be alive.* This is true. But decision making happens *before* the observation. Pre-branch "You" must choose an action based on the value of the *entire* resulting multiverse state.

  Let $U$ be your utility function.
  Option A (Don't Pull): $U(\text{Life}) = 100$.
  Option B (Pull): $0.5 \times U(\text{Death}) + 0.5 \times U(\text{Life} + \$1M)$.

  The suicide argument claims $U(\text{Death})$ is irrelevant because you don't experience it. It treats the utility of the dead branch as 0 or undefined *for the agent*. But this is solipsistic. Pre-branch You cares about your family, your projects, and the cessation of your agency. The fact that Post-branch Live-You doesn't *feel* sad about Dead-You's non-existence is irrelevant to Pre-branch You's valuation.

  Pre-branch You is a parent to the future multiverse. If you pull the trigger, you kill half your children (the branches where you die). The fact that the other half inherit your estate doesn't justify the murder of the first half, especially when *you* (the decision maker) encompass the whole.

  The premise that breaks is: **"Rationality requires maximizing utility only in branches where one retains subjective consciousness."**
  This is false. Rationality requires maximizing utility across all branches one causally influences. Death is a negative utility outcome for the pre-branch agent, regardless of whether the post-branch agent experiences it. The "immortality" is only from the perspective of the survivor, not the decider. Since you are currently the decider, the wager is a loss.

  ### The Verdict

  Would I pull the trigger? **No.**

  The quantum suicide argument is a sophisticated confusion of the *indexical* ("What will I see?") with the *normative* ("What should I do?").

  1.  **Anthropically:** I should expect to find myself in a high-measure branch (SIA + Born Rule). Betting on low-measure survival is betting against my own likelihood of existence.
  2.  **Metaphysically:** Parfitian fission shows that survival is not binary. Sacrificing high-measure futures for low-measure survival is a net loss in "Relation R" density.
  3.  **Decision-Theoretically:** My utility function is defined over the wavefunction, not just my subjective stream. The branch where I die contains real losses (grief, unfinished projects, cessation of agency) that matter to my current self.

  The quantum suicide wager only works if you are a solipsist who values nothing but the continuity of your own immediate qualia. If you care about the world, your loved ones, or the measure of your existence, the gun is just a gun. The branches where you die are real, they are weighted, and they count against the bet. The "immortality" promised is a hollow victory for a ghost in a branch that barely exists, purchased at the cost of the self that actually matters.
