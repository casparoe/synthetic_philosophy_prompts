answer: |-
  You have hit on exactly the right tension. Your intuition is spot-on: grouping Gongsun Long and Hui Shi under the single banner of the "School of Names" (*Mingjia*) is largely a retrospective convenience of Han Dynasty historiographers (like Sima Tan) rather than a reflection of a coherent, unified movement during the Warring States period. They were less "colleagues in the same department" and more "rival combatants in the same arena."

  However, saying they are incompatible misses the deeper dialectical relationship they share. They are two sides of the same coin, reacting to the same crisis of language, but prescribing opposite treatments.

  Here is the comparison you asked for, followed by a defense of the stronger position.

  ### 1. The Unified Project: The Crisis of *Ming* and *Shi*
  Both philosophers are operating within the same problematic: the relationship between *Ming* (names/terms) and *Shi* (actualities/reality). The prevailing Confucian view (*Zhengming* or "Rectification of Names") assumed that if you just used the right traditional labels, social and cosmic order would follow.

  Both Gongsun Long and Hui Shi agree that **naive common sense is wrong about how language maps onto the world.** Where they diverge is on *why* it is wrong.

  *   **Gongsun Long (The Hyper-Realist):** He believes common sense is too sloppy. We lump things together that are ontologically distinct. His project is **analytic and atomistic**. He wants to sharpen the knife of language until it cuts reality at its true joints. For him, "White Horse is not Horse" is a claim about set theory and essence: the concept *Horse* denotes shape; *White* denotes color. The compound *White Horse* denotes a specific intersection. To say "White Horse is Horse" is a category error akin to saying "A subset is identical to the set."
  *   **Hui Shi (The Holist/Relativist):** He believes common sense is too rigid. We draw boundaries where there are none. His project is **synthetic and process-oriented**. He wants to show that distinctions are perspectival, not absolute. When he says "The sun at noon is the sun setting," he isn't denying astronomy; he is arguing that "noon" and "sunset" are arbitrary markers on a continuous temporal flow. For Hui Shi, reality is a continuum (*Dao*), and language is a grid we lay over it. The grid is useful, but it isn't the territory.

  So, to answer your first question: **Yes, there is a unifying project.** It is the investigation of the limits of linguistic categorization. Gongsun Long argues the limits are in our *precision* (we need more distinctions); Hui Shi argues the limits are in our *reification* (we need fewer distinctions).

  ### 2. Is the "School" Label a Historical Accident?
  Mostly, yes. In their own time, they were known as *Bianzhe* (the Disputers). They traveled from court to court debating each other and the Mohists.

  *   **Gongsun Long** was often allied with political conservatism (using logic to uphold strict hierarchical distinctions).
  *   **Hui Shi** was a minister in the state of Wei and a close friend of Zhuangzi (the Daoist). His philosophy naturally bleeds into Daoist metaphysics.

  Grouping them as the "School of Names" is like grouping Wittgenstein and Derrida together because they both wrote about language. It's useful for a syllabus, but it papers over the fact that one is trying to build a logical calculus and the other is trying to deconstruct the very possibility of a calculus.

  ### 3. The Verdict: Who is Philosophically Stronger?
  If I have to back one as the philosophically stronger position—specifically given your entry point via logic and semantics—I have to throw my weight behind **Gongsun Long**.

  Here is the defense, along with the necessary caveats.

  #### Why Gongsun Long Wins on Semantics and Logic
  Gongsun Long is the ancestor of analytic philosophy in China. His arguments, particularly in *White Horse* and *Hard and White*, are reconstructible into valid logical forms that anticipate issues in Western philosophy by two millennia.

  1.  **Theory of Reference:** Gongsun Long distinguishes between the *name* (the label), the *object* (the particular), and the *universal* (the attribute). When he argues that "Hardness" is not found in the stone but is an independent universal that "manifests" in the stone, he is articulating a theory of **abstract objects** or **universals** that rivals Plato or Frege. He recognizes that "hardness" exists as a concept even when nothing hard is being touched. This is a sophisticated realist semantics.
  2.  **Compositionality:** His argument that "White Horse" $\neq$ "Horse" is a rigorous claim about semantic composition. He is arguing that adding a modifier changes the extension of the term. If you ask for a "horse," a yellow or black one will do. If you ask for a "white horse," a black one will not. Therefore, the conditions of satisfaction are different, and the terms cannot be identical. This is logically sound, even if pragmatically annoying.
  3.  **Resilience:** Hui Shi's paradoxes often rely on equivocation or shifting frames of reference without explicitly stating the shift. For example, "I set off for Yue today and arrived yesterday" plays on the relativity of time and perspective, but it can be dismissed as a rhetorical trick if one demands a fixed coordinate system. Gongsun Long's arguments hold up even when you pin down the definitions. He forces you to accept his ontology to defeat him.

  #### Where Hui Shi Wins (and why I'm still picking Gongsun)
  Hui Shi is the stronger **metaphysician** and **ethicist**.
  *   **Metaphysics:** Modern physics (relativity, quantum continuity) aligns better with Hui Shi's "Heaven and Earth are one body" than Gongsun Long's rigid property dualism. Hui Shi understands vagueness and the Sorites paradox better.
  *   **Ethics:** Hui Shi's monism leads to *Jian Ai* (impartial care). If all things are one, loving yourself and loving a stranger are ontologically similar. Gongsun Long's rigid distinctions can easily be used to justify rigid social hierarchies (which, historically, it was).

  **However,** as a philosopher of *language* (which is your hook), Gongsun Long is superior because he offers a **constructive theory**. Hui Shi offers a **critique**.
  *   Hui Shi tells you: "Language is a trap; reality is fluid." (This is a dead end for logic; it leads to silence or mysticism, as Zhuangzi suggested).
  *   Gongsun Long tells you: "Language is a tool; here is how to calibrate it so it doesn't lie to you."

  Gongsun Long attempts to solve the problem of how predicates attach to subjects. Hui Shi dissolves the problem by denying the stability of subjects. In a debate about semantics, the person who builds a working model (Gongsun) beats the person who argues the model is impossible (Hui Shi), if only because the former allows for further discourse.

  ### Summary
  You are right to feel they are pulling in opposite directions.
  *   **Gongsun Long** says: "The map is too blurry; we need higher resolution."
  *   **Hui Shi** says: "The territory is fluid; no map can ever be accurate."

  If you are studying logic, **back Gongsun Long**. He treats language as a formal system that can be analyzed, corrected, and refined. He respects the law of non-contradiction enough to try to work within it. Hui Shi is more profound regarding the human condition, but Gongsun Long is the more rigorous logician. He forces you to think harder about what you mean when you say "is."

  **Recommendation for your rabbit hole:**
  If you want to see where Gongsun Long's rigor leads, look into the **Mohist Canons** (*Mo Jing*). The Mohists were the contemporaries who actually tried to formalize the logic Gongsun Long was playing with, creating definitions for "same," "different," "cause," and "necessary." They are the closest thing Classical China produced to a formal logic textbook, and they often argue *against* Gongsun Long while using his tools. That might be your next logical step.
