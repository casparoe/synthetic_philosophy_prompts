answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Sister's Name]'s sibling.

  Looking around this room, I realize we have a unique demographic split. On one side, we have the family, who are here because they love us and want open bar. On the other side, we have [Sister's Name]'s game theory cohort and [Groom's Name]'s distributed systems team, who are here because they suspect there might be a Nash Equilibrium in the buffet line.

  I'm giving this toast because [Sister's Name] asked me to talk about what makes a marriage work. And since she's spent the last five years studying epistemic game theory, and [Groom's Name] spends his days ensuring computer networks agree on reality, I couldn't just talk about "love" or "compromise." I had to talk about information.

  Specifically, I want to talk about the difference between *mutual knowledge* and *common knowledge*.

  Now, for my Grandma and the rest of the family: stick with me, because this is actually the romantic part.

  *Mutual knowledge* is when I know something, and you know something. For example, [Sister's Name] and [Groom's Name] know they love each other. They've known that for a long time. They could have stayed home tonight, ordered takeout, and whispered it to each other in their living room. That would be mutual knowledge.

  But that's not what we're doing here.

  *Common knowledge* is infinitely deeper. It's not just that I know X, and you know X. It's that I know that you know X, and you know that I know that you know X, and I know that you know that I know that you know X… all the way up the infinite tower.

  Why does this matter? Because without that infinite tower, coordination is impossible.

  There's a classic problem in [Groom's Name]'s field called the "Coordinated Attack Problem." Imagine two generals on opposite hills planning to attack a valley at dawn. If one attacks alone, they lose. If both attack, they win. They send messengers to agree on the time. But messengers can get lost.
  General A sends a note: "Attack at dawn?"
  General B gets it and sends back: "Yes."
  But General B thinks: "What if my 'Yes' got lost? If A doesn't get my confirmation, he won't attack, so I shouldn't either."
  So he sends another note: "Did you get my Yes?"
  And on and on. Without a public, undeniable signal, they can never be *sure* enough to move together.

  [Sister's Name] actually studies this. She's been reading Michael Chwe's book *Rational Ritual*, which argues that this is exactly why we have weddings.

  If [Sister's Name] and [Groom's Name] just loved each other privately, that's mutual knowledge. But life is hard. There will be days when one of you doubts, or feels uncertain, or wonders, "Do they still know that I know they love me?"

  That is why we are here.

  By standing up in front of *us*—their parents, their friends, their colleagues, their Grandma—and saying vows out loud, you aren't just telling each other you're committed. You are creating a public event that transforms that commitment into common knowledge.

  Because now, not only do you know you're married. I know you're married. And [Groom's Name] knows that I know. And [Sister's Name] knows that [Groom's Name] knows that I know. We are all witnesses. We are the network that confirms the message got through. We close the loop.

  When the hard days come—and they will—you won't just have your private promise to lean on. You'll have the knowledge that everyone in this room knows you made a promise. That structural shift changes everything. It turns two individuals into a coordinated team. It solves the equilibrium problem.

  So, [Sister's Name] and [Groom's Name], my wish for you is that your love remains a constant in your private lives. But my hope is that you never forget the power of this room. We are your witnesses. We are your common knowledge. We are the ones who will remind you, when the signal gets noisy, that you stood here today and chose each other, publicly and forever.

  Please raise your glasses. To the bride and groom: May your signals always be clear, your coordination be perfect, and your knowledge always be common.

  To [Sister's Name] and [Groom's Name]!
