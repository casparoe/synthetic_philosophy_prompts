answer: |-
  **Setting:** *A stone bench in the garden of the Institute for Advanced Study. Autumn leaves scatter the path. Two philosophers, ELARA and SILAS, sit with copies of a preprint by a retired physicist, Dr. Aris, resting on their laps.*

  **Elara:** Aris is right, you know. After forty years of physics, he has a nose for structural integrity. And this structure is rotten. You cannot have Strong Pareto, Finite Anonymity, and Completeness without summoning ghosts.

  **Silas:** *Ghosts?* You mean the Axiom of Choice? Elara, we use Choice in analysis, in topology, in probability. Why does ethics get to be the discipline that demands only what we can build with our bare hands?

  **Elara:** Because ethics is about *justification*, Silas. If I tell a policy maker that Future A is better than Future B, I must be able to point to the generations that make it so. The Overtaking Criterion allows me to do that. I can show that, after some time $T$, the cumulative welfare of A permanently exceeds B. It's transparent. It satisfies Pareto. It respects Anonymity.

  **Silas:** And it leaves you mute half the time.

  **Elara:** It leaves me honest.

  **Silas:** It leaves you paralyzed. Suppose we have two infinite streams. Stream A has higher welfare in every even generation; Stream B in every odd generation. The partial sums oscillate forever. The Overtaking Criterion says they are incomparable. So what do we do? Flip a coin?

  **Elara:** We acknowledge that our ethical framework cannot rank them. That is a substantive moral claim. It says that without a convergence in welfare, there is no "better." To force a ranking is to pretend a distinction exists where there is none.

  **Silas:** But the distinction *does* exist. That is the point Aris is nagging you about. The impossibility theorem proves a complete ordering *exists* if you allow an ultrafilter. The math guarantees it. There is a fact of the matter about whether the set of "good" generations in A is "large enough" compared to B.

  **Elara:** "Large enough" according to *which* ultrafilter? That is the heart of the arbitrariness. You rely on a free ultrafilter on the natural numbers. These objects cannot be constructed. You cannot write one down. You cannot describe its properties beyond the axioms. If you and I both use Ultrafilter Ethics, we might use different ultrafilters. You would say A is better; I would say B is better. Neither of us could explain *why* to the other, because the tool we are using is inherently ineffable.

  **Silas:** That is an epistemic limitation, not an ontological one. Just because I cannot explicitly construct the ultrafilter doesn't mean the ordering it produces is arbitrary. It is fixed by the mathematical structure of the universe of sets.

  **Elara:** In ethics, epistemic accessibility *is* ontology. If you cannot specify the reason for a judgment, you do not have a judgment; you have an intuition dressed in set theory. You are purchasing Completeness at the price of intelligibility. You're saying, "Future A is better," and when asked "Why?", your only answer is, "Because the void says so."

  **Silas:** And your answer is, "I don't know." Which is worse? Ethical arbitrariness or ethical silence?

  **Elara:** Silence is defensible. Arbitrariness is tyranny. If I say "I don't know," I invite further inquiry. I invite a refinement of the criteria. If I say "A is better" based on a non-constructive existence proof, I shut down debate. I am claiming authority I cannot demonstrate.

  **Silas:** But consider the cost of your silence. If we are incomparable, we cannot apply standard decision theory. We cannot maximize. We cannot even say one path is permissible and another forbidden if they are incomparable. You render the concept of "optimal policy" meaningless in an infinite context.

  **Elara:** Perhaps "optimal policy" *is* meaningless in an infinite context. That might be the lesson Aris wants us to learn. The universe might be too vast for our scalar valuations to close. The Overtaking Criterion respects the magnitude of the problem. It says: we can judge when there is a clear trend, when one future catches up and passes the other. But when the futures weave around each other eternally? To rank them is to impose a finite mind on an infinite reality.

  **Silas:** That sounds poetic, but it's cowardly. You are retreating to the finite because the infinite frightens you. The ultrafilter extension is the only way to treat the infinite stream as a single object. It assigns a generalized limit to the utility stream. It respects Strong Pareto and Finite Anonymity, yes, but it also gives us a social welfare *function*, not just a partial ordering.

  **Elara:** A function that is invariant under finite permutations but sensitive to the "tail" in a way you cannot specify. Here is my strongest objection, Silas, and I want you to answer it directly. The existence of the free ultrafilter depends on the Axiom of Choice. In some models of set theory, one ultrafilter exists; in others, a different one. There is no unique ultrafilter. So, when you say "Future A is better," you are implicitly saying "Future A is better relative to *an* ultrafilter." But which one? If the moral truth depends on a choice principle that is independent of ZF set theory, then moral truth is contingent on foundational axioms.

  **Silas:** *Pauses, looking at the leaves.* That is a heavy charge. But consider your position. You accept Finite Anonymity. You agree that swapping the welfare of generation 1 and generation 1,000,000 shouldn't change the value. But the Overtaking Criterion is sensitive to the *order* of the partial sums.

  **Elara:** It's sensitive to the *timing* of the welfare.

  **Silas:** Is timing morally relevant in an infinite horizon? If the total sum is infinite in both cases, why does it matter if A leads B for the first million years?

  **Elara:** Because people live in time. Generation 1 is not Generation 1,000,000. Finite Anonymity is a strong assumption itself. But even granting it, the Overtaking Criterion is the most we can say *constructively*.

  **Silas:** Let's turn your "arbitrariness" charge back on you. You claim my ultrafilter is arbitrary because it is non-constructive. But your incomparability is also a choice. You are choosing to leave pairs of streams unranked. Why is that not arbitrary? Why is "silence" the default? Perhaps the default should be "comparison," and the burden is on you to show why two streams are truly indistinguishable.

  **Elara:** Because silence is the absence of a claim. Arbitrariness is a false claim. When I say "incomparable," I am not saying "I pick neither." I am saying "the relation does not hold." When you say "A > B" via an ultrafilter, you are asserting a relation that you cannot verify, cannot describe, and cannot defend against a colleague using a different ultrafilter. You are simulating precision.

  **Silas:** I am preserving the logic of choice. If we face a decision between A and B, we *must* choose. We cannot choose "incomparable." The world forces a complete ordering on us by forcing a singular timeline. We will live in *one* future.

  **Elara:** We will live in one future, yes. But that doesn't mean our *ethics* must be able to rank every possible pair of counterfactuals. We can choose A over B because A satisfies a necessary condition B does not, without claiming A is globally superior in a complete ordering.

  **Silas:** That fragments ethics into a bag of heuristics.

  **Elara:** Better a bag of honest heuristics than a monolith of black-box dogma. Tell me, Silas: If the Axiom of Choice were false, would your moral ordering cease to exist?

  **Silas:** *Sighs.* In a model without Choice, there might be no free ultrafilters. So, no complete ordering satisfying those axioms.

  **Elara:** So your moral truth depends on the consistency of ZFC.

  **Silas:** And your moral truth depends on the intuition that only constructive proofs yield moral knowledge. That is also a philosophical commitment, Elara. You are privileging the "knowable" over the "true." I am privileging the "true" over the "knowable."

  **Elara:** In ethics, if it isn't knowable, it isn't actionable. And if it isn't actionable, it isn't ethical.

  **Silas:** But if it isn't true, it isn't objective. And if it isn't objective, it isn't ethical.

  *They sit in silence for a moment. The wind rustles the preprint pages.*

  **Elara:** Aris worries that we are trying to solve a physics problem with philosophy. He says infinite utility streams are like singularities.

  **Silas:** Perhaps. But we still have to navigate the spacetime around them.

  **Elara:** Then let us navigate with maps that show where the terrain is unknown, rather than filling in the blanks with ink that vanishes under scrutiny.

  **Silas:** And I will navigate with a compass that points North, even if I cannot explain the magnetism. I would rather be directionally complete and mystified than directionless and clear.

  **Elara:** *Smiles faintly.* Then we are at an impasse. You value the closure of the system. I value the transparency of the steps.

  **Silas:** It seems the impossibility theorem didn't tell us how to order the streams. It told us what kind of philosophers we are.

  **Elara:** Constructivist or Platonist.

  **Silas:** Humble or Bold.

  **Elara:** Or perhaps... Honest versus Decisive.

  **Silas:** *Closes the preprint.* I suppose the infinite is large enough for both of us to be wrong.

  **Elara:** *Stands up.* At least on that, we are comparable.

  *Elara walks back toward the institute. Silas remains on the bench, staring at the sequence of fallen leaves, wondering if they form a stream that can be summed.*
