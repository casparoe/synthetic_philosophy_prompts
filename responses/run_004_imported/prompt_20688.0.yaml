      *   Ensure the ending isn't a synthesis ("It's a collaboration") but a functional acceptance of convention despite the lack of inherent truth.

  8.  **Drafting - Focus on Voice:**
      *   Keep it tight, literary. Focus on the physicality of the paper, the ink, the voice at the podium.
      *   Make the logic feel like emotional/intellectual stress, not a lecture.

