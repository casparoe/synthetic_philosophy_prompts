      *   **Core Logic:** The four positions: (1) It is, (2) It is not, (3) It is both, (4) It is neither.
      *   **Subject:** A protagonist reconstructing/translating her grandmother Vera's unfinished poems. The finished work is shortlisted as "Vera's last poems." A dispute arises over attribution.
      *   **Constraint 1 (Crucial):** Do *not* state the philosophy. No naming Nāgārjuna, Buddhism, emptiness, tetralemma, etc. No exposition explaining the logic. The logic must be enacted through plot and reasoning.
      *   **Constraint 2 (Crucial):** Do not settle on a fifth position (synthesis/compromise). All four corners must be shown as unworkable regarding *inherent* existence (svabhāva), yet the conventional designation must function anyway.
      *   **Constraint 3 (Tone/Style):** Literary magazine style. No "Eastern wisdom" tropes (incense, monks, etc.). Domestic/ordinary situation.
      *   **Length:** 1,200–1,800 words.

  2.  **Deconstruct the *Catuṣkoṭi* in this Context:**
      *   *Thesis:* The poem is Vera's. (Inherent existence of authorship).
      *   *Antithesis:* The poem is not Vera's. (Inherent existence of non-authorship).
      *   *Both:* The poem is both Vera's and not Vera's. (Contradiction inherent in the object).
      *   *Neither:* The poem is neither Vera's nor not Vera's. (Negation of the conceptual framework itself).
      *   *Resolution:* Conventional truth (samvrti-satya) functions without ultimate truth (paramartha-satya). The prize happens, the name goes on the stone, but the "truth" of authorship remains empty.

  3.  **Character & Setting:**
      *   **Protagonist:** Elena. Translator/Granddaughter.
      *   **Grandmother:** Vera. Deceased poet. Language mostly lost.
