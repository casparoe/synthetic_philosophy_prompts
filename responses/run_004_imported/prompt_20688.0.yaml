      *   *Neither:* The concept of "ownership of a poem" dissolves when the language is dead.
      *   *Conclusion:* The name "Vera" is used because it's useful, not because it's True.

  6.  **Writing - Step-by-Step:**

      *   *Opening:* The dispute. Thorne challenging the submission. Establish Corner 1 (Elena's conviction) and Corner 2 (Thorne's critique).
