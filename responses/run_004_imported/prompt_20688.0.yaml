answer: |-
  The email from Dr. Aris Thorne arrived on a Tuesday, subject line: *Query Regarding Submission 404.*

  Thorne was the senior philologist on the prize committee. He wrote that he had reviewed the linguistic reconstruction of Vera's *Late Fragments*. He noted that approximately forty percent of the text consisted of graphite rather than ink. He noted that the language Vera spoke had no living native speakers. He asked, politely but with the precision of a scalpel, who exactly had written the poem.

  Elena sat in her kitchen, the laptop screen glowing against the morning grey. She looked at her hands. They were the hands that had held the pen for the graphite lines. They were also the hands that had inherited the box of damp, coffee-stained notebooks.

  She typed a reply. *The voice is Vera's. I only filled the silence.*

  She hit send, knowing it was the first corner of a box she couldn't escape. *It is hers.*

  ***

  The hearing was held in a conference room that smelled of dry erase markers and stale coffee. Thorne sat opposite her, flanked by two other committee members. He had printed the manuscript. He slid a page across the table.

  "Stanza four," Thorne said. "The original fragment is three words. *'Winter bird waits.'* Your translation is fourteen lines. You describe the frost on the window. You describe the bird's hunger. Vera's fragment does not contain frost. It does not contain hunger."

  "It contains the implication," Elena said. "In her dialect, 'waits' implies the duration of the cold. To translate it literally would be to lie."

  "So you wrote the lie to tell the truth?" Thorne leaned forward. "If I write a sentence you dictate, Elena, who is the author? If I fill in the gaps of your diary after you die, is it your life? The poem exists on the page. The ink on the bottom half is yours. The syntax is yours. The metaphor is yours. To say this is Vera's poem is to say a restoration of a ruin is the original building."

  Elena felt the ground shift. *It is not hers.*

  If the poem were inherently Vera's, it would exist independent of Elena's mind. It would survive without the bridge of grammar Elena had built. But without Elena, the fragments were just noise. Three words on a rotting page meant nothing without the context Elena had supplied from memory, from family lore, from her own imagination. If the poem depended on Elena to exist, how could it belong to Vera?

  "We cannot award a prize to a ghost," Thorne said. "And we cannot award it to a forgery."

  ***

  They proposed a compromise. It came in a letter from the committee chair. They would list the work as *Vera (reconstructed by Elena)*. They would split the prize money. They would call it a collaboration across time.

  Elena took the letter to her study. She laid out the notebooks. The ink was brown, fading to rust. The paper was brittle. She picked up a pencil.

  She tried to read the compromise. *Both.*

  If it were both, there would be a line where Vera ended and Elena began. She looked at stanza seven. Vera had written *'hand opens.'* Elena had written *'the palm reveals the coin it never held.'*

  Where was the seam? Was the image of the coin in Vera's mind when she wrote 'opens'? Or was it in Elena's mind when she guessed? If it was in Vera's mind, it was unmanifest, potential, not yet a poem. If it was in Elena's mind, it was invention, not translation.

  To say it was both was to say the poem was two things occupying the same space. But a poem is a single unit of meaning. If you split the authorship, you split the voice. A voice cannot be two people speaking at once. If they accepted the compromise, they were admitting the poem was a hybrid creature, a chimera that belonged to neither category fully. It wasn't Vera's last poem; it was Elena's first poem wearing Vera's clothes.

  The compromise didn't solve the ownership; it just doubled the confusion. It assumed there were two solid selves, Vera and Elena, meeting in the text. But Elena had changed while translating. She had thought Vera's thoughts for ten years. Vera was dead, living only in Elena's head. The boundary was porous. The "both" collapsed because the "two" couldn't be found.

  She put the letter in the drawer.

  ***

  The night before the ceremony, Elena couldn't sleep. She walked to the desk and opened the manuscript.

  *It is hers.* No, because she wrote the words.
  *It is not hers.* No, because she couldn't have written them without the fragments.
  *It is both.* No, because the distinction dissolves under scrutiny.

  She looked at the title page. *Late Fragments by Vera.*

  What was "Vera"? A body that was now dust. A voice that was silent. A language that no one spoke but Elena, and even then, only approximately. What was "poem"? Ink on paper. Arrangements of sound.

  If she burned the manuscript, would the poem die? If she memorized it and burned the paper, would it live? If Vera had never written the fragments, but Elena had dreamed them exactly as they were, would it be the same poem?

  The question "Whose poem is this?" assumed there was a "this" to be owned. It assumed the poem was a object with a permanent core, a *svabhāva*, that could be traced back to a source like a fingerprint.

  But there was no core. There was only the dependency. The poem depended on the fragments. The fragments depended on the paper. The paper depended on the tree. The meaning depended on Elena. The meaning depended on the committee. The meaning depended on the audience tomorrow night.

  There was no single point where the poem originated. It arose from a network of conditions. To ask if it was Vera's was like asking if the fire belonged to the match or the oxygen. The fire wasn't the match. It wasn't the oxygen. It wasn't both. It wasn't neither. It was just fire, burning because the conditions were met.

  The categorization was the trap. The struggle wasn't about honesty; it was about the desire to find a solid ground where there was only flux.

  She closed the manuscript. The logic circled back on itself, consuming its own tail. There was no answer to Thorne's question because the question presumed a reality that wasn't there.

  ***

  The hall was full. The lights were hot. Elena stood at the podium. The award was for "Posthumous Achievement in Letters."

  Thorne sat in the front row. He had a pen ready, perhaps to take notes, perhaps to mark a discrepancy.

  Elena looked at the program. *Vera.* Just the name.

  She could have corrected them. She could have said, *This is a reconstruction. This is a collaboration. This is a fabrication.* But those words carried the same weight of false precision. They all tried to pin the butterfly to the board.

  The poem was empty of inherent authorship. It was empty of inherent meaning. It was empty of inherent existence. It was a convention, a label used for convenience, like calling a collection of wheels and steel a "car." The car runs not because "car-ness" exists inside the metal, but because the parts are assembled in a way that allows movement.

  The attribution was a tool. It allowed the audience to hear the voice. It allowed the prize to honor the lineage. It allowed the grief to have a shape. To demand ultimate truth from the program was to break the tool.

  She adjusted the microphone.

  "These are the last poems of Vera," she said.

  Her voice did not shake. She did not feel she was lying. She did not feel she was telling the Truth. She felt she was participating in a function.

  She began to read.

  *"Winter bird waits..."*

  The words hung in the air. They were Vera's words. They were Elena's words. They were neither. They were sounds that caused a sensation in the room. A woman in the third row wiped her eye. A man in the back nodded.

  The logic of ownership had vanished, leaving only the work.

  When she finished, the applause started. It was polite, then warm, then loud. Thorne clapped. He stood up. He looked at her, and for a moment, the challenge was gone from his face. He wasn't looking for the source anymore. He was just listening to the sound.

  Later, they would print the book. The cover would say *Vera*. The copyright page would have the fine print about reconstruction. People would buy it. They would read it in beds, on trains, in parks. They would feel the grief in the lines. They would tell their friends, *You have to read Vera.*

  They would cut the name into the gravestone next spring. Elena would pay for the stone. The stonemason would carve the letters V-E-R-A. The rain would hit the stone. The moss would grow on the north side.

  The name would function. It would point to the grave. It would point to the book. It would organize the memory. It would do all the work a name is supposed to do, without needing to be ultimately true.

  Elena left the podium. She walked past Thorne. He didn't stop her. He didn't ask about the graphite. He just handed her a glass of water.

  "Thank you," he said.

  "For what?" she asked.

  "For the reading," he said.

  She took the water. It was cold. It wet her throat. It quenched the thirst. It didn't matter where the water came from, or who owned the glass. It only mattered that it worked.

  She walked out into the night. The air was cold. A bird waited on a wire above the street. It didn't sing. It just sat there, balanced on the thin black line, holding its position against the wind, neither falling nor flying, simply remaining until the conditions changed.
