          *   *Nuance on Tech:* Distinguish between "capital" (money) and "means of production" (infrastructure). Tech owns the infrastructure of public discourse.
          *   *Scientific Analogy:* Use physics analogies where appropriate (phase transitions, entropy, control systems) to resonate with the user's background.

