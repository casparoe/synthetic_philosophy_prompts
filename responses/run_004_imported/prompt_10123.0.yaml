      *   **Gödel's Stance:** Explain *why* Gödel looked for new axioms. He was a realist/Platonist. He thought ZFC was an incomplete description of the "set-theoretic universe," not the final word.
      *   **The Nature of Axioms:** Axioms aren't just arbitrary rules (like chess); they are supposed to be self-evident truths about collections. If we find a new self-evident truth, it extends the system.
