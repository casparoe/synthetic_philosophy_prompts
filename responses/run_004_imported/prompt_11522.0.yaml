answer: |-
  You have grasped the technical mechanics of the debate perfectly: **Self-Sampling Assumption (SSA)** drives the Doomsday Argument (DA), and **Self-Indication Assumption (SIA)** counteracts it. If you accept SIA as epistemically mandatory, the Doomsday Argument indeed loses its bite.

  However, the reason experts like Bostrom (and the broader community of anthropic reasoners) do not consider the matter "dissolved" is not because they are unaware of SIA. It is because **SIA comes with its own set of paradoxes and counterintuitive implications that many find strictly worse than the Doomsday Argument itself.**

  The field hasn't been slow to catch up; rather, it has recognized that adopting SIA to kill the Doomsday Argument is trading one bullet for another that is arguably harder to bite. Here is why the debate remains live.

  ### 1. The Presumptuous Philosopher
  The most famous objection to SIA is the "Presumptuous Philosopher" thought experiment (also from Bostrom's *Anthropic Bias*).

  Imagine two competing theories of physics, $T_1$ and $T_2$, which are equally likely based on all non-anthropic empirical data.
  *   $T_1$ predicts a universe with 1 trillion observers.
  *   $T_2$ predicts a universe with 1 trillion trillion observers.

  Under SIA, you must weight hypotheses by the number of observers they contain. Therefore, you should be $1,000,000,000,000$ times more confident in $T_2$ than $T_1$, **solely because you exist.**

  This implies that armchair reasoning about your own existence can overturn empirical physics. A philosopher could tell a cosmologist, "Your theory is wrong, not because of telescope data, but because it predicts fewer people." Most epistemologists and scientists find this level of a priori presumptuousness unacceptable. It grants observation selection effects too much power over empirical theory choice.

  Bostrom and others treat the DA as a live problem because they are trying to find a framework that avoids *both* the Doomsday conclusion (via SSA) *and* the Presumptuous Philosopher conclusion (via SIA). So far, no framework achieves this without significant costs.

  ### 2. The Reference Class Problem
  Both SSA and SIA rely on defining a "reference class" of observers.
  *   **SSA:** "Reason as if you are a random sample from the reference class."
  *   **SIA:** "Weight hypotheses by the number of observers in the reference class."

  But what counts as an observer? Humans? Mammals? Conscious agents? Brain emulations? Potential observers?
  If you define the reference class narrowly (e.g., "humans born after 1950"), the DA disappears under SSA. If you define it broadly (e.g., "all conscious beings"), the DA returns. SIA inherits this ambiguity. If SIA weights by "observers," does a simple thermostat count? If not, why?

  The lack of a principled way to define the reference class means that neither SSA nor SIA provides a clean, objective "dissolution." The result depends heavily on arbitrary boundary-drawing.

  ### 3. Bostrom's Actual Position
  It is a common misconception that Bostrom endorses the Doomsday Argument as a prediction of extinction. He does not. He presents it as a **paradox of confirmation theory.**

  In *Anthropic Bias*, Bostrom explores SIA thoroughly and ultimately rejects it as a general principle, largely due to the Presumptuous Philosopher problem. He leans toward a version of SSA (specifically, the "Self-Sampling Assumption" with a carefully constrained reference class) because he views the implications of SIA as more damaging to scientific reasoning than the implications of the DA.

  However, he acknowledges that SSA feels intuitively wrong in other cases (like the Adam and Eve problems, where SSA implies you can psychically influence conception rates). His later work suggests the problem might require a shift in how we understand probability itself, rather than just picking SSA or SIA.

  ### 4. The LessWrong / Decision-Theoretic Turn
  Since you mentioned LessWrong, you might be familiar with **Updateless Decision Theory (UDT)** or **Anthropic Decision Theory (ADT)**.

  Proponents of this view (like Wei Dai or Stuart Armstrong) argue that the SSA/SIA debate is a category error. They suggest we shouldn't ask "What is the probability I exist?" but rather "What policy should an agent optimize?"
  *   In some formulations of UDT, the distinction between SSA and SIA collapses into a question of what utility function you are maximizing.
  *   However, even here, there is no consensus. Different decision theories yield different results on anthropic problems (e.g., the Sleeping Beauty problem).

  While this approach "dissolves" the anxiety of the Doomsday Argument for some, it replaces it with complex debates about normative decision theory that are far from settled.

  ### 5. Full Non-indexical Conditioning (FNC)
  There is a third major contender: **Full Non-indexical Conditioning**, proposed by Radford Neal. FNA suggests you should conditionalize on all your evidence, including the fact that *someone* with your exact memories exists, without using indexical terms like "I."

  FNC often yields results similar to SIA (canceling the DA) but attempts to ground it in standard Bayesianism without the "presumptuous" priors. However, FNC has its own technical difficulties regarding how to handle identical observers and infinite universes. It has not achieved consensus as the "correct" solution.

  ### Summary
  The reason the Doomsday Argument is still treated as a live problem is not because experts haven't heard of SIA. It is because:

  1.  **SIA creates the Presumptuous Philosopher problem**, which allows armchair reasoning to override empirical science.
  2.  **SSA creates the Doomsday/Adam & Eve problems**, which imply implausible constraints on the future or psychic-like causal powers.
  3.  **Both suffer from the Reference Class Problem.**
  4.  **Decision-theoretic approaches** shift the goalposts but haven't produced a unified consensus.

  The field is essentially stuck in a "trilemma." You can accept SSA (and worry about Doom), accept SIA (and become a Presumptuous Philosopher), or reject both and struggle to formulate a coherent alternative. Until a framework emerges that avoids all these bullets, the Doomsday Argument remains a vital test case for theories of observation selection, rather than a dissolved confusion.

  You are right that SIA cancels the DA update. But in the eyes of most specialists, the price of that cancellation is too high to pay.
