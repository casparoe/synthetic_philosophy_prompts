          *   Key Assumption: Betting quotients reflect degrees of belief *and* the agent is compelled to accept bets at those quotients.

      *   **Money Pump Argument (MPA):**
          *   Target: Preferences (orderings).
          *   Violation: Transitivity (A > B > C > A).
          *   Mechanism: Sequential trades offered (A for B+epsilon, B for C+epsilon, C for A+epsilon).
