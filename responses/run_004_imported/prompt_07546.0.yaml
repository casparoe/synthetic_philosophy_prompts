  **Reasoning for the Hardest Calls**

  The toughest trade-off is between **Equalized Odds (S)** and **Calibration (A)**. In pretrial contexts, the primary ethical harm is the deprivation of liberty via false positives (detaining someone who wouldn't reoffend). Equalized Odds ensures that error rates (both false positives and false negatives) are distributed equally across groups, preventing one group from bearing a disproportionate burden of wrongful detention. Calibration is ranked second because, while essential for the tool's interpretability (a risk score of "7" should mean the same thing regardless of race), a calibrated tool that produces disparate false positive rates still violates liberty interests unevenly.

  **Statistical/Demographic Parity (D)** is ranked lowest because it mandates equal outcome rates regardless of underlying risk. In a risk-assessment context, enforcing equal detention rates could require detaining low-risk individuals from one group while releasing high-risk individuals from another, which undermines both public safety and individual justice. **Predictive Parity (C)** is also lower priority because it is heavily dependent on base rates; enforcing it often requires accepting disparate false positive rates, which circles back to the liberty violation problem.
