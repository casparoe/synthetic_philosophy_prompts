          *   Sartre: Ontological structure (Being-for-itself). Consciousness is translucent (transparent to itself). There is no unconscious. Bad faith is a *unified* act of consciousness lying to itself. It requires knowing the truth to hide it, but knowing it *in the mode of not-knowing*. It's not two parts; it's one consciousness adopting a specific attitude.
