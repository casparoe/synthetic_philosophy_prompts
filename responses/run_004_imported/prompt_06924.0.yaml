answer: |-
  **MEMORANDUM**

  **TO:** Small-Grants Committee, [University Name] Effective Altruism Club
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Proposal [ID/Name] & Adoption of Epistemic Standards Policy

  ### 1. Executive Summary

  This memo addresses the proposal requesting the full semester budget ($4,000) for external AI alignment research. The proposal relies on a high-variance expected value (EV) calculation: a low probability of success (1/200,000) multiplied by an extremely high impact ($10^{16}$ lives).

  While the raw EV calculation appears to dominate other proposals, **I recommend the committee vote to REJECT this proposal as submitted.**

  Funding this request would violate core principles of portfolio diversification and epistemic hygiene. Furthermore, approving this pitch sets a precedent that exposes the committee to adverse selection (Pascal's Mugging) in future cycles. Instead, I propose we adopt a **High-Variance Grant Protocol** to evaluate similar claims in the future, ensuring we remain open to high-impact opportunities without compromising our fiduciary duty to the club's mission.

  ### 2. The Expected Value Argument

  We must engage directly with the argument presented by the proponent: *If we are true expected value maximizers, we must fund the option with the highest numerical EV, regardless of how counterintuitive the probability seems.*

  On the surface, the math holds:
  $$EV = (1/200,000) \times (10^{16} \text{ lives}) \gg \text{GiveWell Top Charities}$$

  However, this calculation fails under scrutiny for three specific reasons: **Input Robustness**, **Concentration Risk**, and **Incentive Compatibility**.

  ### 3. Analysis of Decision-Theoretic Risks

  #### A. Input Robustness & Reference Class Forecasting
  The EV calculation collapses if the probability estimate is not robust. The proponent's estimate (1/200,000) is not derived from a track record, peer review, or independent verification. It is a subjective prior.

  In the absence of data, we must use **Reference Class Forecasting**. The reference class is "unverified research claims by non-experts without publication history." The base rate for this class yielding existential risk reduction is effectively zero. To accept the proponent's specific probability estimate over the base rate requires evidence we do not have. As discussed in our seminar regarding Pascal's Mugging, when probability estimates are ungrounded, the "Shut Up and Multiply" heuristic becomes a vulnerability rather than a tool. We cannot multiply by a number that is epistemically fragile.

  #### B. Concentration Risk (Portfolio Theory)
  Even if we grant the high EV, allocating 100% of our semester budget to a single binary bet is irrational portfolio management.
  *   **Diversification:** A small-grants fund functions as a portfolio. We maximize impact by funding a mix of robust, high-probability interventions (e.g., donation matching, community building) and speculative, high-variance projects.
  *   **Ruins Problem:** If this bet fails (99.9995% chance), our club's capacity to fund *any* other effective intervention for the semester is reduced to zero. We lose the option value to fund future, potentially more vetted, high-impact opportunities.

  #### C. Incentive Compatibility & Adverse Selection
  If we fund this proposal, we signal that the committee rewards **asserted magnitude** over **verified evidence**.
  *   **The Mugging Dynamic:** This invites future proposals that inflate impact claims to astronomical levels to bypass scrutiny.
  *   **Screening:** By rejecting this, we establish that claims of extreme impact require commensurate evidence (e.g., preliminary results, expert endorsement). This filters out "muggers" while leaving the door open for legitimate researchers who can provide verification.

  ### 4. Proposed Policy: High-Variance Grant Protocol

  To address the concern that we might be rejecting a genuine black swan opportunity, I propose we adopt the following standing principle for future cycles:

  **The Epistemic Threshold Principle:**
  *Proposals claiming impact significantly exceeding the portfolio average (e.g., >100x) must meet a higher burden of proof regarding the probability estimate.*

  **Requirements for High-Variance Claims:**
  1.  **Independent Verification:** Probability estimates must be endorsed by a third party with relevant domain expertise.
  2.  **Milestone-Based Funding:** Large sums cannot be disbursed upfront. Funding must be tranche-based, released only upon verification of specific technical milestones.
  3.  **Cap on Concentration:** No single speculative grant may exceed [X]% of the total semester budget (recommended: 20%) without a supermajority vote.

  ### 5. Recommendation & Next Steps

  **Motion:** Reject Proposal [ID] as submitted.

  **Rationale:** The proposal fails to meet the minimum epistemic standards required for high-variance claims. The probability estimate is ungrounded, and the request violates portfolio diversification principles by demanding 100% of available capital.

  **Optional Amendment (Compromise):**
  If the committee wishes to acknowledge the non-zero possibility of value without risking the full budget, I move we offer a **Verification Micro-Grant of $200**.
  *   **Condition:** Funds are released *only* to cover costs associated with obtaining an independent review of the research (e.g., paying an expert to audit the claim).
  *   **Outcome:** If the review is positive, the committee will consider a larger grant in the next cycle under the new High-Variance Protocol. If negative, the project is declined.

  This approach allows us to say we did not ignore the EV entirely, but it refuses to be mugged. It purchases information rather than buying a lottery ticket.

  ### 6. Conclusion

  Rejecting this proposal is not an abandonment of expected value reasoning; it is an application of **bounded rationality**. We are not ideal agents who can process arbitrary probability claims without cost. We are a committee stewarding limited resources. By prioritizing epistemic rigor and portfolio resilience, we ensure we remain effective funders in the long term, rather than becoming victims of the first persuasive argument that utilizes large numbers.

  I request we vote on the rejection (with the optional micro-grant amendment) at Thursday's meeting.

  ***

  **Attachments:**
  *   *Summary of Reference Class Data for Unverified AI Research*
  *   *Draft Text for High-Variance Grant Protocol*
