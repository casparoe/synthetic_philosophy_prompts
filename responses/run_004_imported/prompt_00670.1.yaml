  11. *Refining the "Grid" example:* A power grid is designed to be robust *against* failure. That means it is designed to be partitionable. If a line goes down, the rest stays up. This implies low integration by design. High $\Phi$ systems *cannot* be partitioned without loss. This is a strong point to emphasize.

