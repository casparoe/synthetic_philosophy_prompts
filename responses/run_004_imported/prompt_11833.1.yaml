answer: |-
  An Avicennan philosopher and al-Ghazālī are walking past a bakery when the philosopher remarks, "Smell that bread? The fire necessitates the baking. It is the nature of the flame to cook."

  Al-Ghazālī replies, "The fire does not cook. God creates the baking concurrent with the contact of the flame, out of sheer habit (*ʿāda*)."

  The philosopher scoffs, "That is semantic hair-splitting. In practice, the result is the same. The fire *will* bake the bread."

  "Not *will*," corrects al-Ghazālī. "*Usually does*."

  "What is the practical difference?" asks the philosopher. "If I put the dough in the oven, will it not come out baked?"

  "It will," says al-Ghazālī. "But if you believe the fire *necessitates* the baking, you are trusting a created thing with power it does not possess. If I believe God creates the baking out of habit, I am merely grateful He has not chosen to revoke the policy."

  The philosopher laughs. "Revoke the policy? You speak as if the laws of nature are an insurance contract that can lapse!"

  Al-Ghazālī smiles. "In a manner of speaking, they are. The only difference is that when your fire fails to burn the cotton, you blame the dampness. I simply assume the Divine Habit is currently under review."
