      *   **The Friend's Argument:** The exact cutoff for vague predicates (like "tall") exists but is unknown. Better evidence (empirical study correlating height with usage by competent speakers) could theoretically find this boundary, similar to how physicists pin down constants.
      *   **The User's Question:** Why hasn't anyone run such a study? Is it an unfilled empirical gap, or is there a deeper philosophical reason why such a study couldn't settle the question *even in principle*?

  2.  **Initial Assessment & Fact-Checking:**
      *   *Epistemicism:* The view that vague predicates have sharp boundaries, but we cannot know where they are (semantic ignorance). Williamson is the main proponent.
      *   *The Friend's Claim:* The friend claims the boundary is *empirically discoverable* via usage studies.
      *   *Williamson's Actual View:* This is a crucial point. Williamson *does not* think the boundary is discoverable via empirical usage studies. He argues the boundary is determined by semantic facts + usage, but usage *underdetermines* the meaning. The sharp boundary is a result of the stability conditions of language use, not a statistical average of usage. In fact, Williamson argues the boundary is *in principle* unknowable (margin for error principles).
      *   *Empirical Studies:* Have people done studies on vague predicates? Yes, experimental philosophy and psycholinguistics have done this (e.g., sorites series experiments).
