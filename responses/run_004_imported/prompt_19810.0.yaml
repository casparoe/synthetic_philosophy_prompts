answer: |-
  This is a fascinating philosophical pivot, and your curiosity about the empirical side is well-placed. However, there is a significant twist in the story you've been told: **your friend's argument actually misrepresents Timothy Williamson's epistemicism.**

  While your friend convinced you that the boundary is *in principle* discoverable through better data (like a physical constant), Williamson's central thesis is that the boundary is *in principle unknowable*.

  To answer your specific question: It is not an unfilled gap in the literature. Such studies have been run, and there are deep philosophical reasons why they cannot settle the question of where the sharp boundary lies. Here is the breakdown of why that study wouldn't work, even in principle.

  ### 1. The Empirical Literature Already Exists
  Contrary to the impression that no one has tried this, experimental philosophers and psycholinguists have been running variations of this study for decades. These are often called **Sorites experiments** or studies on **fuzzy concepts**.

  Researchers present participants with a series of stimuli (e.g., patches of color ranging from red to orange, or heights ranging from 5'5" to 6'5") and ask them to apply a predicate ("Is this red?" "Is this tall?").

  **The Results:**
  *   **No Sharp Cutoff:** The data almost never shows a sharp line where 100% of speakers say "no" and then suddenly 100% say "yes."
  *   **The Penumbra:** Instead, you get a sigmoid curve. There is a range where 50% of speakers say "tall" and 50% say "not tall."
  *   **Intra-speaker Inconsistency:** If you ask the *same* competent speaker the same question about the *same* height on different days (or even minutes apart), their judgment often flips in the borderline region.

  If the boundary were like a physical constant hidden in usage data, we would expect measurement error to decrease as sample size increases. Instead, the "noise" in the middle range appears to be a feature of the concept itself, not a bug in our measurement.

  ### 2. Usage Statistics $\neq$ Semantic Truth Conditions
  Your friend's analogy to physics is the weak link in the argument. In physics, the gravitational constant exists independently of our measurement of it. In language, the meaning of "tall" is constituted by how we use it.

  However, epistemicism (even Williamson's version) distinguishes between **usage** and **meaning**.
  *   **Usage:** What speakers actually say (the data your friend wants to collect).
  *   **Meaning:** The semantic content that determines truth conditions.

  Williamson argues that usage *constrains* meaning but does not *determine* it uniquely. There are many possible sharp boundaries compatible with all the actual usage data we could possibly collect. The fact that 51% of speakers call 180cm "tall" does not make it *true* that 180cm is tall, nor does it make 179.9cm *false*.

  Finding the statistical median of usage tells you about sociology or psychology, not about the semantic boundary required by epistemicism.

  ### 3. Williamson's "Margin for Error" Principle
  This is the most critical point regarding your friend's claim. Williamson does not argue that the boundary is unknown merely because we lack data. He argues it is unknowable because of the nature of knowledge itself.

  Williamson proposes a **Margin for Error Principle**. For you to *know* that a man of height $h$ is tall, your belief must be safe from error. That means in all nearby possible worlds where you form the same belief, it must be true.
  *   Because the meaning of "tall" is slightly plastic (it could have shifted slightly without us noticing), a man who is *just barely* tall in the actual world might not be tall in a very similar possible world where the meaning shifted a micron.
  *   Therefore, you cannot *know* you are at the boundary. If you claimed to know "179.9cm is not tall, but 180cm is tall," your belief would not be safe, because in a nearby world where the meaning shifted slightly, 180cm would not be tall.

  Consequently, even if you ran the perfect study, Williamson would say you still haven't found the boundary; you've only found where our *confidence* breaks down. The boundary exists, but knowledge of it is structurally impossible for beings like us.

  ### 4. Competence vs. Performance
  Your friend suggested studying "competent English speakers." In linguistics and philosophy, there is a distinction between **competence** (the idealized knowledge of the language) and **performance** (what people actually say, subject to distraction, fatigue, context, etc.).

  Epistemicism posits a boundary in the realm of *competence*. Empirical studies can only measure *performance*.
  *   If a study finds a cutoff at 180cm, the epistemicist can always reply: "The speakers were influenced by context, pragmatics, or hesitation. The *semantic* boundary is still sharp, but your instruments are measuring the wrong thing."
  *   Because the theory posits that the boundary is hidden from the speakers themselves (they are semantically ignorant), asking them where the boundary is (or observing their behavior) is guaranteed to be inconclusive.

  ### Summary
  Your friend sold you on a version of epistemicism that is actually more optimistic than the one Williamson defends.
  *   **Friend's Claim:** The boundary is empirical and discoverable (like a constant).
  *   **Williamson's Claim:** The boundary is metaphysical and unknowable (due to margin-for-error principles).

  The reason nobody has settled the question with a study is not that nobody has tried. It is because **vagueness is not an empirical problem; it is a semantic and epistemological one.** A study can tell you how people *use* the word, but it cannot tell you where the word *cuts reality*, especially if the theory insists that the cut is invisible to the users.

  If you want to remain an epistemicist, you have to accept the harder pill: the boundary exists, but no amount of data will ever let you find it. If you think data *could* find it, you might actually be drifting toward a form of **contextualism** or **psychological realism**, rather than strict Williamsonian epistemicism.
