answer: |-
  This is a fantastic case study, and you are right to flag the tension. Your friend is invoking the **Value of Information (VoI)** theorem, but she is misapplying it because she is ignoring the boundary conditions of the decision model she's citing.

  As a TA, you can actually use this to teach a crucial distinction in JDM: the difference between the **instrumental value** of information (does it change my action?) and the **hedonic/consumption value** of information (how does it feel to know?).

  Here is the principled breakdown of why her "rational" argument is theoretically unsound in this specific context, and why her "bad feeling" is actually the more rational signal.

  ### 1. The VoI Theorem Requires an Open Action Space
  The standard decision-theoretic proof that "free information is never harmful" relies on the assumption that the agent can condition their **action** on the information received.

  Mathematically, $E[U|Info] \geq E[U|No Info]$ holds because, upon receiving information $I$, the agent chooses $A_{optimal}(I)$. If $I$ suggests the original plan was best, they stick with it. If $I$ suggests a switch, they switch. The option to switch is the source of the value.

  In your friend's case, the action space is **closed**. She cannot switch jobs. The contract is signed; she has moved.
  *   **Instrumental Value:** Zero. The information cannot alter the material outcome of the current decision.
  *   **The Consequence:** Once the instrumental value is zero, the only remaining value is the **intrinsic utility of the belief state itself.**

  ### 2. Utility Functions Include Psychological States
  Standard rational choice theory often assumes utility is a function of world states ($W$) and actions ($A$). But in behavioral econ and cog sci, we know utility is also a function of **beliefs** ($B$) and **counterfactual comparisons**.

  If her utility function looks like this:
  $$U = \text{Salary} + \text{Job Satisfaction} - \text{Regret}$$

  Then the information has a non-zero probability of drastically increasing the **Regret** term without changing the Salary or Job Satisfaction terms.
  *   **Scenario A (She asks):** She learns she was the top choice and could have had \$10k more. Result: Same job, same salary, *higher regret*. Utility decreases.
  *   **Scenario B (She asks):** She learns she was the 5th choice and they wouldn't have matched. Result: Same job, same salary, *ego bruised/validation*. Utility stays roughly same or slightly increases.

  Because the downside (increased regret/rumination) is psychologically potent and the upside (curiosity satisfied) is transient, the **Expected Hedonic Utility** of the information is likely negative.

  ### 3. Rational Information Avoidance
  There is a robust literature on **Information Avoidance** (e.g., Golman & Loewenstein, 2016) that directly contradicts your friend's premise. It is perfectly rational for a Bayesian agent to reject free information if that information is expected to decrease utility through non-instrumental channels.

  People avoid information for three main reasons:
  1.  **Instrumental:** It won't change the decision (applies here).
  2.  **Self-Signaling:** It might reveal something negative about oneself (e.g., "I'm not as valuable as I thought" or "I made a stupid mistake").
  3.  **Affective:** It will simply make me feel bad (anticipatory regret).

  Your friend's "bad feeling in the stomach" is likely her System 1 correctly performing a hedonic forecast. She intuitively understands that **closure** has value. By not knowing, she preserves the narrative that "I made the right choice." By knowing, she risks introducing a "ghost life" (the job she didn't take) that haunts the one she did.

  ### 4. The "Future Market" Caveat (The Only Counter-Argument)
  The only way her VoI argument holds water is if she expands the time horizon. If she views this not as "learning about *this* decision" but as "calibrating my priors for the *next* job market cycle," then the information has instrumental value for $T+1$.
  *   Knowing she was the top choice at School B updates her prior on her market value.
  *   This could help her negotiate better in 3 years.

  However, she explicitly stated, "None of this changes anything going forward." If we take her at her word that this info is purely about the past decision, the VoI argument collapses.

  ### 5. Pedagogical Takeaway (For your TAing)
  This is a perfect example to distinguish between **Ontological Rationality** and **Ecological Rationality**.
  *   **Ontological (The Math):** If $Action$ is fixed, $VoI = 0$ (instrumentally).
  *   **Ecological (The Human):** Humans run on narratives. Introducing counterfactuals into a settled narrative is a known happiness-killer (see: *The Paradox of Choice*, Schwartz; or work on **Upward Counterfactuals** by Roese).

  ### The Verdict
  She is borrowing the *vibe* of rationality to justify curiosity, but she is violating the *mechanics* of rationality.

  A truly rational agent maximizes expected utility. If her utility function includes "freedom from rumination" and "satisfaction with chosen path" (which it clearly does, given her hesitation), then **avoiding the information is the rational choice.**

  The "bad feeling" isn't irrational anxiety; it's an accurate prediction of **cognitive dissonance**. She has already engaged in **post-decision dissonance reduction** (convincing herself Job A is great). Asking the friend at Job B threatens to reopen that dissonance.

  **Recommendation:** Tell her that in JDM terms, she is describing **Rational Ignorance**. Since the cost of the information (psychological distress/regret) outweighs the benefit (satisfying curiosity with no actionable output), the rational move is to preserve the ignorance. She shouldn't ask.
