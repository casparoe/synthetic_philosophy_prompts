answer: |-
  **Setting:** *A quiet conference room at the Veritas Foundation. On the table lies a single file folder containing the terms of a high-stakes investment opportunity. Two board members sit across from each other.*

  **Characters:**
  *   **Elena (Geometric Rationality):** Argues from the perspective of ergodicity economics and time-average growth.
  *   **Marcus (Orthodox Expected Utility):** Argues from the perspective of von Neumann-Morgenstern utility theory and axiomatic rationality.

  ***

  **Marcus:** The numbers are straightforward, Elena. We put up the entire endowment. Eighty percent chance, we quadruple it. Twenty percent chance, we lose everything. If we quadruple, we fund the Hadron Biology project. If we don't, the window closes forever. The expected value of the endowment is 3.2 times its current size. To decline is to throw away 2.2 times our capital in expectation.

  **Elena:** The ensemble average is 3.2. The time average is negative infinity. You're averaging across parallel universes, Marcus. In the universe where we actually live—the one moving forward in time—there is a twenty percent chance that *this* foundation ceases to exist. If we lose, there is no reinvestment. There is no future. The geometric growth rate of this strategy is dominated by the ruin term. $\ln(0)$ is not a number we can recover from.

  **Marcus:** But this isn't a repeated gamble for a gambler trying to maximize bankroll over an infinite horizon. This is a one-off decision for a specific mission. Expected Utility Theory handles this perfectly. We simply assign a utility to the outcomes. If the utility of funding Hadron Biology is high enough, we take the bet. You're assuming our utility function *must* be logarithmic in wealth. Why?

  **Elena:** Because log-wealth isn't a preference; it's a physical constraint of compounding processes. You say this is a "one-off," but the foundation is not. The endowment is meant to persist. If we adopt a policy of taking bets with non-zero ruin probabilities whenever the ensemble expectation is positive, we will go bankrupt almost surely over the lifetime of the institution. Ergodicity economics shows that maximizing ensemble expectation in non-ergodic environments is a recipe for extinction. We are arguing about what rationality *is*, not just what we prefer.

  **Marcus:** I concede that if we planned to take *this specific bet* every day, ruin would be imminent. But we won't. We take this risk once to achieve a specific threshold. Orthodox theory doesn't demand risk neutrality; it demands consistency. If the Board decides that the value of Hadron Biology outweighs the risk of dissolution, that is encoded in our utility function. We can choose a utility function that is flat up to the current endowment, then spikes massively at the quadrupled amount. That's not arbitrary; it reflects our mandate.

  **Elena:** That spike is where the magic trick happens. You're smuggling the long-run argument in through the back door of "preferences." You say the utility spikes because the mission is vital. But if you blow up the endowment, you can't fund *future* vital missions. You're treating the foundation as if it dies after this vote regardless of the outcome. But if we survive, we compound. If we treat every "vital mission" as a justification for a 20% ruin risk, we won't be here for the second vital mission. The time-average perspective forces you to account for the fact that we are a persistent entity in time, not a disembodied chooser of states.

  **Marcus:** And I reply that "persistent entity" is an abstraction. The people, the researchers, the specific opportunity—they are here *now*. Samuelson skewered the "long-run" argument decades ago. He pointed out that "in the long run we are all dead" isn't just a quip; it's a mathematical objection. An agent who maximizes geometric growth might survive forever but achieve nothing, while an agent who takes calculated risks might achieve the goal and then stop. Why does the *potential* for future reinvestment outweigh the *certainty* of missing this specific opportunity if we play it safe?

  **Elena:** Samuelson's critique assumed the agent cares only about the terminal wealth distribution. But if the process is multiplicative, the terminal wealth *is* determined by the path. If you hit zero, the path stops. You ask why potential reinvestment matters? Because the foundation's power is its permanence. If we accept your logic, we must accept that for any positive expected value, no matter how small the probability of success, we should bet the farm if the payoff is high enough. A one-in-a-million chance to save the world becomes a mandate to bankrupt ourselves today. That isn't rationality; it's fanaticism.

  **Marcus:** That's a straw man. Expected Utility doesn't mandate risk neutrality. I can be risk-averse. I can say, "I value the endowment, and I value the project, but I value survival more." That would lead me to reject the bet. But that decision comes from *my* utility function, not from a law of physics about time averages. You're trying to derive an "ought" from an "is." You say log-utility is "physical." I say it's just one specific shape of risk aversion. If the Board decides the Hadron project is worth a 20% risk of death, EUT respects that. Ergodicity economics says they are *wrong*, mathematically wrong, regardless of their goals. That's overreach.

  **Elena:** It's not overreach if the goals are inconsistent with the dynamics. If your goal is to exist next year, and you choose a strategy with a negative time-average growth rate, you have a contradiction between your goal and your method. Here's the hard question for you: You admit EUT can reject the bet if the utility function is concave enough. But what makes *that* concavity non-arbitrary? Why is it rational to be risk-averse here? In your framework, it's just a taste, like preferring chocolate to vanilla. In mine, it's because the world is non-ergodic. The risk aversion is derived from the structure of the gamble, not the psyche of the bettor.

  **Marcus:** It's non-arbitrary because it reflects the marginal value of resources to our mission. The first million saves lives. The billionth million is less critical. That's diminishing marginal utility. It's grounded in the reality of what the money *does*, not just how it grows. But here is my counter: You say Kelly betting is rational because it maximizes time-average growth. But Kelly betting forbids this bet entirely. $\ln(0)$ is undefined. You cannot bet any fraction that risks total ruin. So, on your view, we *must* walk away. We must let the Hadron opportunity die.

  **Elena:** Yes. Because if we take the bet and lose, the growth rate is $-\infty$. We are erased.

  **Marcus:** But suppose we modify the bet. 20% chance of losing 99%, not 100%. Now log-utility allows a bet. But the foundation is effectively dead anyway; we can't fund the project. Your metric focuses on the mathematical continuity of the wealth trajectory, but ignores the *threshold* nature of our actual goals. We need 4x or nothing. A strategy that keeps us at 1x is a failure just as surely as 0x, just slower. EUT allows us to model the threshold. You treat wealth as a smooth fluid; we treat it as a key that opens specific doors.

  **Elena:** I concede the threshold point is serious. If 1x is functionally equivalent to 0x for the mission, then the "ruin" is actually falling short of 4x. However, the ergodic argument still applies to the *institution*. If we treat the endowment as a tool for the mission, we must ensure the tool persists. If we adopt a policy of "threshold or bust," we signal to future donors that we are gamblers. That increases our cost of capital, changing the dynamics of future bets. The time-average view captures the feedback loop between our strategy and our environment. EUT treats the bet as isolated.

  **Marcus:** I'll concede that isolation is a simplification. EUT *should* account for reputational risk in the utility function. But you still haven't answered the Samuelson point. You keep appealing to "almost sure" long-run dominance. But we don't have the long run. We have *this* decade. If we play the "safe" geometric growth strategy, we might grow at 5% a year and miss every breakthrough. If we take this risk, we might vanish, or we might change the world. Why is the "survival" objective lexically prior to the "impact" objective?

  **Elena:** Because impact requires an agent to deliver it. You can't change the world if you don't exist. The "almost sure" argument matters because it highlights that ensemble expectation is a fiction for a single trajectory. You say we don't have the long run. I say the long run is the only thing that's real. The ensemble average is a cloud of ghosts. The time average is the path we walk. If the path leads off a cliff, it doesn't matter how bright the view is from the edge.

  **Marcus:** But we aren't walking the path blindly. We know the odds. 80% is not a cliff; it's a steep hill. Look, let's meet halfway. Your critique exposes that standard EUT applications often implicitly assume risk neutrality or ignore the compounding nature of endowments. That's a valid criticism of *practice*. But your claim that EUT is *theoretically* incapable of handling this is false. I can write a utility function that rejects the bet. I can write one that accepts it. The work is in justifying the function.

  **Elena:** And my claim is that the justification for the rejecting function is *easier* and more robust when you use ergodicity. You have to argue about subjective preferences. I just have to point to the math of compounding. However... I will concede this: If the Foundation's mandate is explicitly "Maximize chance of Hadron Biology regardless of institutional survival," then your framework is the honest one. My framework assumes the goal is "Persist and do good." If the Board votes that Hadron is worth the institution's life, ergodicity economics cannot overrule them. It can only say, "You will not be here tomorrow."

  **Marcus:** And I will concede that if the Board intends to remain a perpetual entity, adopting a policy of positive-ensemble-expectation bets with ruin risk is inconsistent with that perpetuity. In that specific case, your time-average constraint acts as a necessary bound on our utility function. We cannot claim to be perpetual while betting like mayflies.

  **Elena:** So we agree on the dynamics. We disagree on the mandate.

  **Marcus:** Precisely. You see the mandate as survival-first. I see it as impact-first, with survival as an instrumental constraint.

  **Elena:** Then the vote comes down to whether we believe we can achieve impact without survival.

  **Marcus:** Or whether survival without impact is worth the cost.

  **Elena:** *[Closes the folder]* Then we should poll the Board. But I will insist that the ballot include the probability of institutional ruin, not just the expected return.

  **Marcus:** Agreed. Transparency about the time-average trajectory is something EUT should always welcome. It informs the utility assignment.

  **Elena:** Then I won't object to the vote. But I will record my dissent based on the growth rate.

  **Marcus:** And I will record my support based on the mission value. Let's see which rationality the Board prefers.
