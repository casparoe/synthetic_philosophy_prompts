  This is a formidable project. The received view—championed by Alexander Bird, Stephen Mumford, and others—is that while Lewis (1997) successfully neutralizes Martin's finks by requiring the retention of the causal basis $B$, he leaves the door open for masking (antidotes) because the basis $B$ remains intact while the manifestation $M$ is prevented by an extrinsic factor.

  To argue that Lewis's analysis survives this objection without resorting to an ad hoc *ceteris paribus* clause, you must demonstrate that the machinery Lewis *already* provides—specifically the semantics of "$x$-complete cause" combined with his commitment to the **intrinsicness of dispositions**—does the work that critics claim requires additional stipulation.

  Here is a rigorous pressure-test of your position, structured to help you fortify your paper against the strongest version of Bird's objection.

  ### 1. The Strongest Form of Bird's Objection
  To defeat the objection, we must first steelman it. Bird's argument is not merely that antidotes exist; it is that they exploit a gap in Lewis's counterfactual semantics.

  *   **The Setup:** Object $x$ has intrinsic basis $B$ for disposition $D$ (to manifest $M$ in response to $S$). An antidote $A$ is present in the environment.
  *   **The Mechanism:** $S$ occurs. $x$ retains $B$ (the molecular structure of the poison is unchanged). $A$ interacts with the process initiated by $S+B$ to prevent $M$.
  *   **The Logical Trap:** Lewis's analysis states: $x$ is disposed to $M$ iff $x$ has $B$ such that if $x$ were $S$-ed and retained $B$, $S$ and $B$ would be an $x$-complete cause of $M$.
  *   **Bird's Claim:** In the antidote world, the antecedent ($S$ + retain $B$) is true. The consequent ($S$ and $B$ cause $M$) is false (because $M$ does not occur). Therefore, the conditional is false. Therefore, $x$ lacks the disposition. But intuitively, the poison is still poisonous. Thus, Lewis's analysis is extensionally inadequate.

  Bird's strongest point is that Lewis's "retention of $B$" clause solves finks (where $B$ is lost) but fails masks (where $B$ is kept but neutralized). He argues that adding a "no interference" clause would be an unprincipled *ceteris paribus* amendment.

  ### 2. The Defense: "$x$-Complete Cause" as a Technical Operator
  Your core argument should be that Bird misinterprets the semantic weight of the phrase **"$x$-complete cause."** It is not merely a verbose way of saying "sufficient cause." It is a technical restriction on the *causal architecture* required for the truth of the conditional.

  #### A. Intrinsic Completeness vs. World Sufficiency
  Lewis defines an $x$-complete cause as a cause that, together with the laws of nature and the **intrinsic properties of $x$**, suffices for the effect. The qualifier "$x$-complete" explicitly brackets out extrinsic factors.
  *   **Bird's Assumption:** He evaluates the counterfactual in the "antidote world," treating the antidote as a fixed background condition. In this world, $S+B$ are not sufficient for $M$.
  *   **The Lewisian Rebuttal:** The analysis does not ask if $S+B$ are sufficient *in the actual world context*. It asks if $S+B$ constitute a causal unit that is complete *relative to $x$*.
  *   **The Argument:** If an antidote prevents $M$, it demonstrates that $S+B$ are not *world-sufficient*. However, it does not demonstrate that they are not *$x$-complete*. An $x$-complete cause is one that requires no *intrinsic* supplementation from $x$ to produce $M$. The antidote is, by definition, extrinsic. Therefore, the presence of the antidote does not negate the status of $S+B$ as an $x$-complete cause; it merely overrides the manifestation of that cause.
  *   **Why this isn't *Ceteris Paribus*:** You are not adding a clause that says "and nothing interferes." You are arguing that the definition of "$x$-complete" *already entails* that extrinsic interferers are not part of the sufficiency condition being tested. The truth condition is about the *causal power of $x$*, not the *causal outcome of the world*.

  #### B. The Semantics of the Counterfactual and Intrinsicness
  Lewis is committed to the view that dispositions are **intrinsic properties**. This metaphysical commitment must drive the semantics of the counterfactual in his analysis.
  *   **The Similarity Metric:** When evaluating a counterfactual about an *intrinsic* property of $x$ (like a disposition), the similarity metric should prioritize worlds where $x$'s intrinsic nature is the primary determinant of the outcome.
  *   **Screening Off Extrinsic Noise:** If we hold the presence of an extrinsic antidote fixed in the counterfactual evaluation, we are effectively testing the disposition of the *system* ($x$ + antidote), not the disposition of $x$.
  *   **The Argument:** Because Lewis's analysis is an analysis of $x$'s disposition (an intrinsic property), the nearest possible world where "$x$ is $S$-ed and retains $B$" is a world where extrinsic interferers (like antidotes) are **not held fixed**, unless they are causally linked to $S$ or $B$.
  *   **Addressing the "Past Fixity" Objection:** Bird might argue that if the antidote was administered *before* $S$, it is part of the past and must be held fixed in standard Lewisian semantics.
      *   *Your Counter:* The antecedent of the disposition conditional is not a standard historical counterfactual; it is a **test conditional**. In the context of analyzing dispositions, the "nearest world" is the nearest world where the *test conditions* for the disposition are met. A valid test for an intrinsic disposition requires the absence of extrinsic masks. Therefore, the semantics of the disposition analysis implicitly select for worlds where the "testing environment" is standard (i.e., free of masks), not worlds where the actual history is perfectly preserved. This follows from the *purpose* of the analysis (defining intrinsic power), not an ad hoc clause.

  ### 3. Distinguishing "Causal Basis" from "Structural Base"
  Bird argues that the causal basis $B$ is retained because the molecular structure remains intact. You can pressure-test this by refining what Lewis means by "causal basis."
  *   **Functional vs. Structural:** For Lewis, $B$ is not just a structural property; it is the property *in virtue of which* the causal power holds.
  *   **The Neutralization Argument:** If an antidote binds to the poison's molecules, it may leave the *structure* intact, but it alters the *causal role* of that structure. If the structure is chemically bound by the antidote, it is no longer free to play the causal role required for $M$.
  *   **Lewisian Move:** One could argue that if the antidote neutralizes the causal efficacy of $B$, then $x$ has not truly "retained $B$" *as a causal basis*. It has retained the *vehicle* of $B$, but not the *causal power* of $B$. Since Lewis's clause requires retaining $B$ *for long enough to cause $M$*, and the antidote prevents $B$ from causing $M$ by neutralizing its causal role, one could argue the antecedent "retains $B$" is technically false in the relevant causal sense.
  *   **Caution:** This is risky, as Bird explicitly distinguishes structural retention from causal efficacy to avoid this move. Use this only as a secondary line of defense. The primary defense should remain on the "$x$-complete cause" semantics.

  ### 4. Synthesizing the Argument for Your Paper
  To make this stick in print, structure your argument as follows:

  1.  **Reclaim "$x$-Complete":** Argue that the received view treats "$x$-complete cause" as synonymous with "sufficient cause in the actual context." Show that Lewis's text implies it means "sufficient in virtue of $x$'s intrinsic nature."
  2.  **The Intrinsicness Constraint:** Leverage Lewis's commitment to intrinsic dispositions. Argue that holding extrinsic antidotes fixed in the counterfactual evaluation violates the metaphysical constraints of the analysis. The counterfactual is not about "what would happen in this exact environment," but "what $x$ is capable of."
  3.  **Defusing the *Ceteris Paribus* Charge:** Explicitly argue that this is not a *ceteris paribus* clause. A *ceteris paribus* clause says "all else being equal." Your argument is that "all else" (extrinsic antidotes) is *not relevant* to the truth conditions of an intrinsic disposition analysis. The exclusion of antidotes is principled because it derives from the definition of "$x$-complete" and the metaphysics of intrinsic properties.
  4.  **Addressing Bird Directly:** Acknowledge Bird's point that $B$ is structurally retained. Concede that $M$ does not occur. But insist that the conditional's consequent is not "$M$ occurs," but "$S$ and $B$ are an $x$-complete cause." Argue that they *are* an $x$-complete cause (intrinsically sufficient), even if the effect is preempted extrinsically. The failure of $M$ is a failure of the *environment*, not a failure of the *causal completeness of $S+B$ relative to $x$*.

  ### 5. Potential Weak Points to Fortify
  *   **The Factivity of Causation:** Critics will say "If $M$ doesn't happen, $S+B$ didn't cause it."
      *   *Defense:* Lewis's analysis uses the counterfactual "would be." It posits a causal relation that *would obtain* in the test world. If the test world (properly selected for intrinsic testing) excludes the antidote, the causation obtains.
  *   **The Stimulus Specification:** Bird might argue the stimulus $S$ includes the context (e.g., "ingestion in the presence of antidote").
      *   *Defense:* If $S$ is specified that narrowly, the disposition is indeed different (e.g., "poisonous-unless-antidote"). But the *general* disposition "poisonous" implies a standard stimulus "ingestion." The analysis holds for the general disposition because the standard stimulus does not include extrinsic masks.

  ### Conclusion for Your Draft
  Your position is defensible if you shift the debate from **outcomes** (did $M$ happen?) to **causal architecture** (did $S+B$ possess intrinsic sufficiency?). Lewis's "$x$-complete cause" is the tool that allows this shift. By arguing that the presence of an antidote does not negate the *$x$-completeness* of the cause (only its *world-sufficiency*), and that the counterfactual semantics for intrinsic properties screen off extrinsic interferers, you can argue that Lewis's analysis survives without unprincipled amendments.

  This approach respects Lewis's system while challenging the interpretation that has dominated the literature since Bird. It is a strong, textually grounded position.
