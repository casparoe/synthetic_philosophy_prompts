          *   *Decision:* 6.5 or 7/10. I will suggest 7/10 to be generous on the strong conceptual work, but highlight the critical error. Actually, for a TA sanity check, accuracy matters. If they get the institutional structure wrong, they missed half the prompt. Let's go with **7/10**. It acknowledges the strong theoretical grasp while penalizing the factual error on the *Philosophy of Right*'s specific constitutional arrangement.

