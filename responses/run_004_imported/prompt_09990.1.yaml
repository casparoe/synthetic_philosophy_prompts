      },
      {
        "category": "Authority: Who Decides",
        "points_earned": 0,
        "points_possible": 2,
        "notes": "Incorrect. Authority lies with the Monarch, not the Estates."
      },
      {
        "category": "Authority: Reasoning",
        "points_earned": 1,
        "points_possible": 2,
        "notes": "Partial credit. Correctly notes war requires singular decision vs deliberation, but misapplies this to the Estates rather than the Crown."
      }
    ],
    "ta_note": "Watch out for the Estates vs. Monarch distinction. This is a common mix-up since the Estates handle the funding, but the Crown handles the decision."
  }
  ```

  ### TA-to-TA Note
  Hang in there with the Hegel seminar. *Philosophy of Right* is dense, and this student actually did better than most on the "why war" section. The Monarch/Estates distinction is tricky because Hegel gives the Estates power over the *budget* for war, but not the *decision* of war. If they conflate funding with deciding, they miss the whole point of the Crown's "dot on the i" function.

  Hope this saves you some time!
