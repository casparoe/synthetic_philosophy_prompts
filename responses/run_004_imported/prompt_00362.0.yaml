      *   *Is there "Meaning as Use"?* LLMs produce tokens that function *like* meaningful language in many contexts (coding, chatting, translating). They follow rules.
      *   *Is there a "Form of Life"?* This is the sticking point. Do LLMs participate in the human form of life? Do they have needs, pains, goals, social stakes?
      *   *Is there "Understanding"?* For Wittgenstein, understanding is shown by how one goes on. If an LLM writes code that compiles and solves the problem, it *looks* like understanding. But does it have the *context*?

