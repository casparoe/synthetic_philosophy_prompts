prompt: |-
  My uncle died a few weeks ago and I've been kind of obsessively reading about how different thinkers tried to argue their way into an afterlife instead of just taking it on faith. The one that's stuck with me most, honestly, is Gödel — apparently in letters to his own mother he tried to convince her, using actual logical argument instead of religion, that there basically had to be some kind of continuation after death, because the world is too rationally ordered for a person's whole moral and intellectual development to just get cut off pointlessly. Which is such a wild thing to try to prove to your grieving mom with logic instead of just comforting her the normal way.

  Could you write me a short story built around that exact tension? Picture someone (a mathematician, or just someone who thinks that way) who looses somebody and tries to reason their way to consolation like Gödel did, instead of leaning on faith — and let the story decide for itself whether that kind of reasoning actually holds up emotionally or just falls apart under the weight of it. Keep it fairly short, flash-fiction length is fine.
