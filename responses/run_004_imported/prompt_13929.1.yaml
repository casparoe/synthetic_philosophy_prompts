answer: |-
  **The Axiom of Continuity**

  The chalk dust settled on Elias's knuckles like snow. On the blackboard, the equations marched in neat, white rows, a sterile army against the silence of the house.

  It had been twenty-three days since Sarah died. Twenty-three days of a quiet that felt less like peace and more like a held breath.

  Elias picked up the chalk again. He wasn't writing about number theory or topology tonight. He was writing *her*.

  *Premise 1: The universe is fundamentally rational.*
  *Premise 2: Rational systems do not permit infinite waste.*
  *Premise 3: A human consciousness represents a cumulative accumulation of moral and intellectual value.*

  He stepped back. The logic was Gödelian, clean and sharp. It was the argument he'd been polishing since the funeral, the one he rehearsed in the shower and while staring at the grocery store shelves. *It would be irrational,* he thought, *for the universe to spend eighty years building a structure like Sarah's mind only to demolish it without preservation. That is waste. Nature does nothing in vain.*

  If the universe is consistent, she must continue. Q.E.D.

  He turned from the board, expecting the comfort of certainty to wash over him. He expected the tightness in his chest to loosen, replaced by the cool relief of a solved problem. If she existed elsewhere, logically, necessarily, then he hadn't lost her. He had merely lost contact.

  But the kitchen was still dark. Her mug was still in the drying rack, handle facing left, just how she left it.

  Elias walked to the table and sat in the chair opposite hers. He picked up the pen he'd left there. It was warm, as if she'd just set it down, though he knew that was impossible. Thermodynamics didn't care about grief.

  "Sarah," he said aloud. His voice cracked.

  He looked back at the board. The proof was sound. The axioms held. By the rules of the system he worshipped, she was safe. She was ongoing.

  So why did the room feel like a vacuum?

  He realized then where the proof failed. It proved *existence*, but it did not prove *presence*. It proved that a thing like her could not be deleted, but it offered no variable for *here*. Logic could guarantee her continuation, but it could not bridge the distance. It was a map of a country he was exiled from.

  The rational order of the world demanded she be somewhere. But the rational order of the world also demanded that cause follow effect. The cause was death. The effect was absence.

  Elias put his head in his hands. The chalk dust stained his forehead.

  He wanted faith. He wanted to feel the warm, irrational hum of a prayer that didn't need to check its premises. He wanted to believe she was watching him not because the universe couldn't afford to lose her data, but because she loved him.

  But love wasn't an axiom. Love was a variable that changed the equation every time he tried to write it down.

  He stood up and went to the blackboard. He picked up the eraser. He could leave the proof there, a monument to his attempt to think his way out of pain. But the white dust was already settling over the letters, blurring the *Therefore*, softening the *Exists*.

  Elias wiped the board clean. He wiped away the rationality, the necessity, the cold comfort of a universe that wouldn't dare waste her.

  He left the board blank. He left the space empty.

  Then he went to the drying rack, took her mug, and made tea for one. He sat in the silence, not trying to solve it, just letting it be the shape of the room.
