answer: |-
  Good evening. For those of you who don't know me, I'm the younger sibling. I'm also, as my sister reminded me when she asked me to speak, the only other philosopher in the family. When she gave me this job, she gave me one instruction: "Do not resolve the Special Composition Question in the toast."

  For the relatives: for four years, these two have been arguing about when parts make a whole. My sister is a universalist. She believes that if you have any objects whatsoever, they compose a further object. There is a table here. There is a distinct object made of the table and the wine glass. There is an object made of the table, the wine glass, and the moon.

  My fiancé-to-be is a restrictionist. He follows Peter van Inwagen. He believes composition only happens when particles are caught up in a life. Strictly speaking, there are no tables, no cars, and certainly no wedding cakes. There are only particles arranged table-wise, car-wise, and cake-wise.

  This isn't just academic for them. At their engagement dinner, he raised a glass "to the simples arranged fiancée-wise." She says that was the moment she knew.

  Now, I'm currently taking a seminar in metaontology, where we study arguments about whether arguments like theirs are even real. We read Eli Hirsch, who argues that disputes like this are merely verbal. Both sides agree on all the physical facts; they just speak different "languages" of existence. Then we read Ted Sider, who replies that some languages carve nature at its joints better than others, meaning one of them might actually be wrong about reality.

  I stand before you not to adjudicate that debate. I am not persuaded by Hirsch, nor by Sider. But standing here, looking at the two of them, I realize that the metaontology of marriage is far more important than the mereology of wedding cakes.

  Because marriage, in a sense, is a voluntary commitment to a specific quantifier.

  If my sister is right, they have always composed a single object. But if my fiancé is right, they are distinct entities, coordinated in a specific pattern. And perhaps that is the secret. Whether "us" is a fundamental feature of the universe or a conceptual framework we impose on the world, the work is the same.

  Hirsch might say their love is just a matter of linguistic convention. Sider might say it only matters if it carves reality at the joints. But I think the truth is simpler. Marriage is the decision to stop asking whether the composite object *exists*, and start acting as if it *matters*.

  It is the promise that, regardless of whether "we" is metaphysically substantive or merely a useful way of speaking, you will treat the plurality as a unity. You will quantify over each other. You will count each other as existing, necessarily and eternally.

  So, to the universalist: May you always find a whole in the parts.
  To the restrictionist: May you always find a life in the simples.
  And to both of you: May your dispute remain unresolved, because it is the friction that generates the heat, and the question that keeps the conversation going.

  Please raise your glasses.

  To the bride and groom. Whether you are one object or many, whether your union carves nature at its joints or merely carves the cake: May you continue to compose a life together that is undeniable to everyone in this room.

  To the simples arranged marriage-wise.
