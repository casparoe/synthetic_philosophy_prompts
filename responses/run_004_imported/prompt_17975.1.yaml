answer: |-
  The rubber chicken sat untouched between them, cooling on the cheap white china. Renata swirled the cash-bar Cabernet, watching the legs run down the glass. Fifteen years, and the silence between them felt less like absence and more like a loaded premise.

  "You still think you can save Frege with intensions," Renata said, not looking up. "I heard the paper in *Mind* last year. Two dimensions?"

  Iain loosened his tie. "Someone has to explain why 'Hesperus is Phosphorus' feels informative if semantic content is just a rigid tag. You reduce language to a causal chain, Renata. You ignore the cognitive grip."

  "Cognitive grip isn't semantics. It's psychology." She finally met his eyes. "Let's run the Gödel case. Again. Suppose Schmidt proved the incompleteness theorem, Gödel stole it, and the name 'Gödel' was passed down via baptism to the thief. Who does 'Gödel' refer to?"

  "The man," Iain said. "The thief."

  "Exactly. But the description 'the prover of incompleteness' picks out Schmidt. So the name isn't synonymous with the description. Reference isn't fixed by associated beliefs." She took a sip. "Descriptivism is dead, Iain. You're just performing an autopsy on the corpse."

  "I'm not saying reference is fixed by description in the actual world," Iain countered, leaning in. "I'm saying there are two ways to evaluate content. Look at the Gödel case across worlds. On the secondary intension—the counterfactual dimension—you're right. 'Gödel' rigidly designates the thief. In a world where Schmidt did the work, 'Gödel' still picks up the thief. But consider the world *as actual*. If we're epistemically situated in a world where Schmidt did the work, 'Gödel' picks out Schmidt. That's the primary intension."

  Renata set her glass down hard. "So you're smuggling 'actually' into the description. 'The actual prover.' Kripke tore that apart. It makes the truth contingent on the actual world, but it doesn't save the Fregean sense. You're just conceding the rigid designation point while pretending you haven't."

  "I'm not conceding anything. I'm distinguishing metaphysical necessity from epistemic necessity." Iain's voice dropped, matching the hum of the banquet hall. "You say 'Water is H2O' is necessary a posteriori. I say it's necessary only on the secondary intension. On the primary intension, it's contingent. There's an epistemic possibility where the clear liquid in the lakes is XYZ. You can't capture that possibility with rigid designators alone. You erase the epistemic space where we actually live and think."

  "Epistemic space isn't semantic value," Renata insisted. "You're conflating how we identify a referent with what the referent is. The causal chain fixes the object. The rest is just heuristic."

  "And yet," Iain said, "we fought about this. Not about causal chains. About what we meant when we said 'us.' If names are just rigid tags, then 'Renata loves Iain' expresses the same proposition as 'Renata loves Renata's ex-fiancé,' provided I'm the guy. But you know that's not what it meant. The mode of presentation mattered."

  Renata flinched, just barely. "That's propositional attitude contexts. Opacity doesn't prove two-dimensionalism. It proves belief isn't transparent."

  "It proves that cognitive significance is real," Iain said. "And if it's real, it belongs in the semantics. You want a world where reference is clean but meaning is empty. I'll take the mess where meaning actually connects to how we understand the world."

  "Meaning doesn't require metaphysical confusion," she said, picking up her fork again.

  "Nor does metaphysics require ignoring how we think."

  The waiter arrived to clear the plates, forcing a pause in the logic. They both sat back, the argument hanging unresolved like the engagement had, neither willing to concede the ground that kept them apart.
