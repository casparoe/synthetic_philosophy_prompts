      *   **Annas's Defense:** Virtue is an *ideal* (like expertise). Most people aren't virtuous; they are learners. The fact that seminary students failed doesn't disprove virtue; it just shows they aren't *phronimoi* yet. VE doesn't claim ordinary people act consistently.
      *   **Sreenivasan's Defense:** Psychologists define "trait" too strictly (high cross-situational consistency). Ordinary trait attribution allows for variability based on relevant situational factors. If the situation changes the *reasons* for acting, consistency isn't expected. The psychologists are committing "errors about errors."
      *   **User's Synthesis:** Annas says "Those people weren't virtuous." Sreenivasan says "You're measuring virtue wrong." Together = "No matter what the data says, VE wins." -> Unfalsifiability charge.

  3.  **Evaluate the Thesis (Unfalsifiability Charge):**
      *   *Is it fair?* It's a strong, common critique, but needs nuance. Unfalsifiability is a serious charge (Popperian). If VE says "Virtue exists but only in unicorns" (Annas) AND "You can't measure it anyway" (Sreenivasan), it risks becoming a metaphysical claim detached from psychology.
      *   *Potential Weakness:* Annas's claim isn't just "rare," it's "developmental." It predicts a *trajectory*. Sreenivasan's claim isn't "anything goes," it's about *relevant* vs. *irrelevant* situational variables.
