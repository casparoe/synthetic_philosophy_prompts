answer: |-
  This is a fascinating angle for a feature, and you have correctly identified a tension between how moral philosophers talk about hypocrisy and how logic textbooks categorize it. However, there is a crucial misunderstanding in your reading of the "standing to blame" literature that, if corrected, will actually make your article more nuanced and philosophically robust.

  The short answer to your question is that logic textbooks and moral philosophers are answering two different questions. Logic textbooks ask, **"Is the proposition true?"** The standing-to-blame literature asks, **"Does this person have the authority to enforce this norm?"**

  Here is the breakdown of why *tu quoque* remains a fallacy in logic, even if hypocrisy undermines moral standing in ethics, and where your interpretation of the literature needs a slight adjustment.

  ### 1. The Crucial Correction: Standing Does Not Negate Truth
  You wrote: *"the hypocrisy does more than make the accuser look bad — it actually negates the truth of the accusation itself, since a claim like 'it's wrong to fly a private jet to a climate summit' can only be true when the person asserting it meets some threshold of consistency."*

  This is the pivot point. The literature by G.A. Cohen ("Casting the First Stone"), R. Jay Wallace ("Hypocrisy, Moral Address, and the Equal Standing of Persons"), and later scholars like Macalester Bell and Christopher Fritz **does not argue that hypocrisy makes the moral claim false.**

  If a climate activist flies a private jet, they are indeed a hypocrite. According to Wallace and Cohen, their hypocrisy may strip them of the **standing** to blame others for flying private jets. However, it does not change the fact that flying private jets contributes disproportionately to climate change. The normative truth ("private jets are harmful/wrong") remains intact; the hypocrite simply loses the **moral authority** to hold others accountable for it.

  Think of it like a legal analogy: If a corrupt judge presides over a murder trial, the defendant can argue the judge lacks the *standing* to sentence them due to bias or corruption. But the defendant cannot argue that murder is therefore *legal*. The law remains true; the judge's authority is compromised.

  ### 2. Why Logic Textbooks Call It a Fallacy
  Logic and critical thinking textbooks focus on **propositional truth** and **valid inference**. In formal logic, the truth value of a statement ($P$) is independent of the speaker ($S$).

  *   **Proposition:** "Action X is morally wrong."
  *   **Speaker:** Person A (who also does Action X).

  If Person A says "Action X is wrong," and Person B replies, "But you do Action X," Person B has not addressed the truth of the proposition. They have attacked the speaker. In a truth-functional system, this is irrelevant. A liar can tell the truth; a hypocrite can be right. Therefore, logically, pointing out hypocrisy is a deflection from the truth claim, which is why it is classified as *ad hominem tu quoque*.

  Textbooks teach this to prevent people from dismissing valid scientific or moral claims simply because the messenger is flawed. If we accepted *tu quoque* as valid, a smoker could never successfully warn a child about the dangers of smoking, and the dangers of smoking would remain uncommunicated.

  ### 3. Why Philosophers Say Hypocrisy Matters
  The "standing to blame" literature operates in **normative ethics**, not formal logic. It treats blame not as a statement of fact, but as a **social relationship**.

  R. Jay Wallace's central argument is that blame is a form of moral address that presupposes equality. When I blame you, I am invoking a shared standard that binds us both. If I violate that standard myself, I am effectively claiming a privileged position: "This rule binds you, but not me." This violates the condition of equal moral standing.

  Therefore, when you point out hypocrisy, you aren't proving the moral claim false (logic); you are protesting the **unfairness of the accountability relationship** (ethics). You are saying, "You do not have the right to hold me to this standard while exempting yourself."

  ### 4. How to Frame This in Your Feature
  This distinction is actually more compelling for your story than the idea that hypocrisy makes moral claims false. If you argue that hypocrisy negates the *truth* of climate science or fiscal responsibility, your piece could be vulnerable to the charge of relativism.

  Instead, consider framing the tension this way:

  *   **The Logical Reality:** The hypocrite is often *right* about the issue. The deficit is bad; the carbon emissions are dangerous. The *tu quoque* response doesn't solve the problem.
  *   **The Ethical Reality:** The hypocrite is *wrong* to demand sacrifice from others without sharing the burden. Their lack of standing erodes trust, social cohesion, and the legitimacy of the norm itself.

  The "scandal" of hypocrisy isn't that it makes the accuser's facts wrong; it's that it breaks the social contract required for moral community. As G.A. Cohen suggested, when we cast the first stone, we implicitly claim a moral purity that, if absent, makes the act of stoning an assertion of power rather than justice.

  ### Summary for Your Article
  You can explain to your readers that logic textbooks are right to call *tu quoque* a fallacy **if the goal is determining truth.** But the philosophers are right to say hypocrisy matters **if the goal is maintaining moral community.**

  The "look who's talking" defense is logically weak but morally potent. It doesn't prove the accuser is wrong about the world; it proves the accuser is wrong about their relationship to the accused. This explains why the public reacts so viscerally to hypocrisy: we aren't debating the policy; we are rejecting the authority of the hypocrite to lead.

  This nuance allows you to validate the philosophical literature without contradicting the basic principles of logic, giving your feature a sophisticated grounding that avoids the trap of suggesting "nothing matters if the messenger is flawed."
