      *   **Key Objection 1: The Strategy Problem (Bookie's Information).** The bookie needs to know the agent's updating rule *and* the possible evidence partition. In synchronic, the bookie just needs current probabilities.
      *   **Key Objection 2: Commitment and Flexibility.** Synchronic bets are accepted at $t_0$. Diachronic bets require a commitment at $t_0$ to bet at $t_1$. Can the agent revoke this? If yes, no Dutch Book. If no, is it rational to bind future selves?
      *   **Key Objection 3: The "Sure Loss" Status.** Synchronic loss is categorical. Diachronic loss is often conditional on evidence occurring. (Though Lewis-style arguments try to fix this).
      *   **Key Objection 4: Alternative Norms.** Probability axioms are hard to dodge. Conditionalization has rivals (Jeffrey, etc.) that might also avoid Dutch Books under slightly different betting interpretations.
      *   **Key Objection 5: Epistemic vs. Pragmatic.** The "Why care?" question. Losing money is bad, but does it prove epistemic irrationality? This applies to both, but the diachronic link is more tenuous because memory/identity issues arise.
      *   **Conclusion:** Summarize. The logic is the same, but the *metaphysics of time and agency* required for the diachronic case introduces friction.

