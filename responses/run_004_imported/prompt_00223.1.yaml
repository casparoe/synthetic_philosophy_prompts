      *   **Commitment vs. Disposition:** Synchronic bets are accepted now. Diachronic bets involve a commitment to accept future bets. Can the agent change their mind? If they can, the book fails. If they can't, is it rational to bind oneself?
      *   **The "Sure Loss" Condition:** In synchronic, the loss is guaranteed *now*. In diachronic, the loss is guaranteed *conditional on certain evidence arriving*. What if that evidence doesn't arrive?
      *   **Alternative Updating Rules:** Jeffrey Conditionalization, imaging, etc. Maybe conditionalization isn't the *only* way to avoid a Dutch Book if we tweak the betting setup.
      *   **Reflection Principle:** Related to diachronic coherence. Van Fraassen's work.
