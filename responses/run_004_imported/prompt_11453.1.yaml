      *   **Move 2: Naomi's Reply (Kripke's Intuition/De Re Modality).**
          *   *Argument:* CT guts the emotional/philosophical point. We care about *our* possibilities, not someone else's. If it's not *me*, my regret is misplaced. This is Kripke's objection to Lewis.
          *   *Analysis:* This is an intuitive/modal argument. Kripke argues we talk about *what could have happened to Nixon*, not a counterpart. It attacks the *utility* of CT, not just the logic.
          *   *Verdict:* Naomi wins on phenomenological/intuitive grounds. Farid's view makes regret irrational (why regret what happens to someone else?).
