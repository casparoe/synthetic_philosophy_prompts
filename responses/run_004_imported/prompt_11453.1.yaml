          *   *Argument:* Branches diverge at different points (college, childhood, pre-birth). CT relies on resemblance. Who decides resemblance? If it's narrative interest, then possibility is subjective, not factual.
          *   *Analysis:* This is the "Problem of Vagueness" or "Arbitrariness" objection to CT. Lewis handles this by saying counterpart relations are context-dependent, but Naomi argues this makes *possibility* context-dependent (which seems wrong).
          *   *Verdict:* This is a genuine problem for CT. Lewis admits context dependence, but critics say modal facts shouldn't depend on conversational context.
