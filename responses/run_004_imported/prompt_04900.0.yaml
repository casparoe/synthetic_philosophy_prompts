      *   *Blackstone's Context:* He was writing for practitioners. In English common law tradition, courts didn't typically strike down Acts of Parliament for violating natural law (Parliamentary Sovereignty was emerging). So, the "no validity" claim is likely theological/moral, not jurisprudential in the modern sense.
      *   *Compatibility:* The sentences *are* compatible if "validity" means "moral bindingness" rather than "systemic recognition."
