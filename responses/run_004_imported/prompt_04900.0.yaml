answer: |-
  This is an excellent question, and you have spotted exactly the ambiguity that has fueled centuries of jurisprudential debate. You are right to be suspicious of the standard positivist caricature of Blackstone. Treating that passage as a straightforward commitment to *lex iniusta non est lex* (in the strong, nullity sense) is often more revealing of the positivist project (Bentham, Austin, and later Hart) than of Blackstone's actual intent.

  Here is a breakdown to help you structure this section of your dissertation, tackling the Blackstone exegesis first, then moving to how Hart and Fuller diverge in their responses to that tradition.

  ### 1. Decoding Blackstone: Strong Nullity or Weak Obligation?

  You asked if the two sentences are compatible. They are, but only if you recognize that Blackstone is using "validity" in a pre-modern, theological sense, not a Kelsenian or Hartian "systemic validity" sense.

  **The Contextual Reading:**
  Blackstone was writing in the mid-18th century, during the ascendancy of Parliamentary Sovereignty. In English constitutional practice, the courts did *not* have the power to strike down Acts of Parliament for contravening natural law. If Blackstone were committing to the **Strong Thesis** (that a judge must treat a contrary statute as a legal nullity), he would be describing a power English judges did not possess.

  **The "Obligation" Reading (Weak Thesis):**
  Most modern legal historians (e.g., Wilfrid Prest, David Lieberman) suggest Blackstone is making a claim about **moral bindingness**, not legal identification.
  *   **Sentence 1 & 2:** "No human laws are of any validity..." → Read this as: "No human laws create a *moral obligation to obey*..."
  *   **Sentence 3:** "...such of them as are valid derive all their force..." → Read this as: "Those laws that *do* command obedience get that authority from their alignment with reason/God."

  **The Verdict for your Chapter:**
  Blackstone is likely conflating *legal validity* (is this a rule of the system?) with *moral validity* (ought I obey this?). He isn't offering a "validity test" for judges to void statutes; he is offering a theological account of why subjects should feel bound by law.
  *   **Why this matters:** The Positivists (Bentham/Austin) *needed* to read Blackstone as holding the **Strong Thesis** to set him up as a strawman. They argued: "If Blackstone is right, we can't criticize bad laws as 'law,' we just have to say they aren't law. That's confused."
  *   **Your Move:** Acknowledge that while Blackstone's text *allows* a strong reading, the historical context suggests a weak reading. However, emphasize that **for the purposes of the Hart-Fuller debate, Blackstone functions as the symbol of the Strong Thesis.** Hart and Fuller are reacting to the *tradition* of natural law that Blackstone represents, whether or not their reading of him is historically perfect.

  ### 2. Hart's Defusal (1958 Harvard Law Review)

  In "Positivism and the Separation of Law and Morals," Hart tackles this head-on, specifically in the context of the post-war "grudge informer" cases and the Radbruch formula (which revived the *lex iniusta* idea).

  **Hart's Strategy:**
  Hart argues that the Blackstone/Aquinas formula ("It's not law") is a "confusion of tongues" that hides the real moral problem.

  1.  **Separation of Existence and Merit:** Hart insists we must distinguish between "This is a valid legal rule" and "This rule is morally wicked."
  2.  **The Danger of the Strong Thesis:** If we say an unjust law is "not law," we deprive ourselves of the vocabulary to say: "This *is* law, but it is so wicked that we must refuse to obey it."
      *   For Hart, the Blackstone move is intellectually dishonest. It suggests that if a law is unjust, it magically ceases to exist as a social fact. But it *does* exist (courts enforce it, police wield it).
      *   By calling it "not law," natural lawyers pretend the conflict between law and morality doesn't exist. Hart wants to force us to confront the conflict: "Here is a legal rule. It is valid. But it is morally intolerable."
  3.  **Defusing Blackstone:** Hart doesn't deny that law *often* overlaps with morality. He denies that moral merit is a *condition of legal validity*. He would read Blackstone's "validity" claim as a category error. For Hart, a statute contrary to natural law is still a **legal validity** (it passes the rule of recognition), even if it lacks **moral validity**.

  **Dissertation Tip:** Frame Hart's critique as a defense of **moral clarity**. He thinks the natural law tradition (Blackstone) obscures the sacrifice involved in disobeying the law. If it's "not law," disobeying isn't a sacrifice; it's just ignoring a nullity. Hart wants to preserve the gravity of civil disobedience.

  ### 3. Fuller's Response (The Inner Morality of Law)

  Fuller agrees with the natural law intuition (that there is a connection) but thinks Hart (and Blackstone) locate it in the wrong place.

  **Fuller's Strategy:**
  Fuller rejects Blackstone's **Substantive Natural Law** (law must match God's/Reason's external moral content) in favor of a **Procedural Natural Law** (law must meet internal criteria of craftsmanship).

  1.  **Handling the Blackstone Passage:** Fuller would likely say Blackstone is right that there is a threshold where "law" breaks down, but wrong about *why*.
      *   Blackstone says: Law breaks down if the *content* is unjust (contrary to God/Nature).
      *   Fuller says: Law breaks down if the *process* fails (secret, retroactive, impossible to follow rules).
  2.  **The "Not Law" Move:** Fuller actually *reclaims* the *lex iniusta* intuition but gives it a sociological/functional twist. If a regime rules by terror and arbitrary decree, it isn't just "bad law"; it fails to be a legal *system* because it cannot guide conduct.
  3.  **Vs. Hart:** Hart says a wicked legal system is still a legal system (separability). Fuller says a sufficiently wicked system (one that violates the 8 desiderata) ceases to be law because it fails the functional definition of law.

  **Dissertation Tip:** Position Fuller as trying to save the Blackstone intuition without the theological baggage. Fuller agrees with Blackstone that "validity" (in the sense of fidelity/obligation) depends on morality, but he shifts the morality from **external ends** (Justice/God) to **internal means** (Procedural Integrity).

  ### 4. Taxonomy for Your Chapter

  To get your taxonomy straight, I recommend structuring the argument around three conceptions of "Validity" in that Blackstone quote:

  1.  **Blackstone's Theological Validity:**
      *   *Source:* Divine Reason.
      *   *Test:* Conformity with substantive justice.
      *   *Consequence:* Unjust laws lack moral bindingness (and perhaps legal force, though this is ambiguous).
  2.  **Hart's Systemic Validity:**
      *   *Source:* Rule of Recognition (Social Fact).
      *   *Test:* Pedigree/Source-based (was it enacted by Parliament?).
      *   *Consequence:* Unjust laws are still laws. To say otherwise is a confusion that hinders moral criticism.
  3.  **Fuller's Functional Validity:**
      *   *Source:* The purposive enterprise of subjecting conduct to rules.
      *   *Test:* The 8 Desiderata (Procedural morality).
      *   *Consequence:* A system that is sufficiently unjust (procedurally) fails to be law because it cannot function as law.

  ### Summary Advice for the Draft

  *   **Don't get bogged down in proving what Blackstone "really" meant.** Acknowledge the ambiguity. State clearly: *"Whether Blackstone intended a strong nullity thesis or a weak obligation thesis, he was read by the positivist tradition as asserting the former. It is this construction of natural law that Hart and Fuller engage."*
  *   **Highlight the divergence:** Hart rejects the Blackstone formula to protect moral criticism. Fuller modifies the Blackstone formula to protect the integrity of the legal enterprise.
  *   **The "Compatibility" Question:** Explicitly state that Blackstone's sentences are compatible only if "validity" is read as "moral authority." If read as "systemic membership," they contradict the reality of 18th-century English constitutionalism. Hart exploits this contradiction; Fuller tries to resolve it by redefining the nature of the system.

  This approach shows you understand the history, the textual nuance, and the philosophical stakes, which is exactly what a dissertation committee wants to see. Good luck with the chapter!
