answer: |-
  **Title:** The Hollow Calculus: Why Harsanyi's Theorem Does Not Vindicate Utilitarianism

  **Introduction**

  Within effective altruism and welfare economics, John Harsanyi's 1955 aggregation theorem is frequently cited as the closest thing moral philosophy has to a physics proof. The claim is seductive: if individuals and society both act rationally under uncertainty (satisfying the von Neumann–Morgenstern axioms) and society respects a Pareto condition (if everyone prefers $A$ to $B$, society prefers $A$ to $B$), then social welfare must be a weighted sum of individual utilities. For proponents, this transforms utilitarianism from a contentious ethical intuition into a logical necessity derived from rationality and consensus.

  However, this interpretation conflates mathematical consistency with normative justification. While Harsanyi's theorem is mathematically valid, it fails to bridge the gap between formal preference aggregation and substantive moral value. By examining two decisive critiques—Amartya Sen and John Weymark's challenge regarding interpersonal comparability, and Peter Diamond's objection regarding equity and fairness—it becomes clear that the theorem does not vindicate utilitarianism. Instead, it merely formalizes the internal consistency of a specific, controversial ethical framework. The theorem offers a *conditional* derivation: *if* one accepts specific, debatable premises about measurement and fairness, *then* utilitarianism follows. Without independent justification for those premises, the theorem is normatively inert.

  **The Measurement Gap: Sen and Weymark**

  The first and most fundamental crack in Harsanyi's armor concerns the nature of the "utility" being aggregated. Harsanyi's theorem relies on von Neumann–Morgenstern (VNM) utility functions. In decision theory, VNM utility is an ordinal index of preferences over lotteries, unique only up to positive affine transformations ($U' = aU + b$, where $a > 0$). This means an individual's utility function captures their risk attitudes and ranking of outcomes, but it possesses no natural zero point and no natural unit of measurement.

  Classical utilitarianism, however, requires *cardinal, interpersonally comparable* welfare. To sum utilities ($\sum U_i$), one must be able to say that one unit of utility for Person A is equivalent to one unit for Person B. Harsanyi's theorem produces a social welfare function of the form $W = \sum a_i U_i$, but because each $U_i$ can be rescaled arbitrarily without changing the individual's preferences, the weights $a_i$ are equally arbitrary. As Sen and later Weymark demonstrated, without an independent constraint fixing the zero points and units across individuals, the theorem allows for *any* distribution of weights. One could mathematically satisfy Harsanyi's conditions while effectively prioritizing one individual's preferences over all others, simply by rescaling their utility function.

  Harsanyi attempted to resolve this by assuming "cardinal unit comparability," but this is an assumption, not a result of the theorem. Consequently, the Sen/Weymark critique reveals that Harsanyi has not derived utilitarianism from rationality; he has derived it from rationality *plus* a specific, unproven assumption about the measurability of welfare. The theorem tells us how to aggregate *if* we can compare, but it provides no mechanism for making those comparisons. It mistakes the *index* of choice (VNM utility) for the *substance* of well-being (welfare).

  **The Equity Gap: Diamond's Ex Ante/Ex Post Objection**

  If the Sen/Weymark critique attacks the *inputs* of the theorem, Peter Diamond's 1967 objection attacks the *process*. Diamond highlights a conflict between Harsanyi's reliance on the *ex ante* Pareto principle and our moral intuitions about fairness.

  Consider a standard Diamond case: a single indivisible life-saving drug and two patients who would benefit equally. Society has three options: give the drug to Patient 1, give it to Patient 2, or flip a fair coin. Assume both patients are risk-neutral regarding the outcome but value fairness. Both patients prefer the coin flip to a deterministic allocation that excludes them, as it gives each a 50% chance of survival. Under Harsanyi's *ex ante* Pareto condition, since both individuals prefer the lottery, society must prefer the lottery.

  However, Harsanyi's utilitarian calculus evaluates the lottery based on expected utility. If the patients are risk-neutral regarding survival, the expected utility of the lottery is identical to a deterministic allocation (0.5 × Life + 0.5 × Death = 0.5 × Life). For a Harsanyi utilitarian, the coin flip has no more value than arbitrarily handing the drug to Patient 1, provided the *ex ante* expectations are managed.

  Diamond argues this is morally inadequate. The value of the coin flip lies in *ex post* equity—treating the patients as equals in the face of scarcity—not merely in the satisfaction of *ex ante* preferences. By insisting that social welfare is strictly the sum of individual expected utilities, Harsanyi's theorem axiomatically rules out fairness as an independent moral value. It forces us to view equity solely through the lens of individual risk preferences. If we believe that fairness matters even when it does not increase expected utility (or if we believe *ex ante* Pareto should be constrained by *ex post* rights), Harsanyi's framework is not a vindication of morality, but a restriction of it. It privileges a specific conception of efficiency over equity by mathematical fiat.

  **Verdict: Structural Validity, Normative Silence**

  We must now render a verdict on the claim that Harsanyi's theorem offers a near-mathematical vindication of utilitarianism. The verdict is negative. The theorem does not vindicate utilitarianism; it vindicates *linearity*.

  Harsanyi proves that if you accept VNM rationality, the *ex ante* Pareto principle, and interpersonal comparability, your social welfare function must be linear. But utilitarianism is not merely the claim that social welfare is linear; it is the claim that the *inputs* to that linearity are comparable units of well-being and that *no other values* (like fairness or rights) enter the equation. The theorem is silent on the former and hostile to the latter.

  To treat Harsanyi's result as a foundation for utilitarianism is to commit a category error. It confuses a representation theorem (which describes the structure of consistent preferences) with a normative derivation (which justifies why those preferences should govern). The theorem shows that utilitarianism is *coherent* with rational choice theory, not that it is *required* by it. It shifts the burden of proof rather than discharging it. The heavy lifting is done not by the math, but by the ethical premises required to make the math applicable to morality.

  **Closing the Gap**

  For Harsanyi's theorem to genuinely support utilitarianism, two substantial additions are required, neither of which can be derived from the theorem itself.

  First, we require an independent **theory of interpersonal comparison**. We must establish a metric for welfare that is distinct from revealed preference under risk. This might involve objective list theories, neuroscientific measures of hedonic tone, or a robust philosophical defense of "empathetic preferences" that goes beyond Harsanyi's veil of ignorance. Without fixing the units and zeros of individual utility functions externally, the aggregation remains mathematically arbitrary.

  Second, we require a **defense of the Ex Ante Pareto Principle over Ex Post Equity**. To answer Diamond, utilitarians must argue either that fairness has no intrinsic value apart from its contribution to expected utility, or that *ex ante* preferences should always trump *ex post* distributional concerns. This is a substantive ethical claim, not a mathematical one. It requires arguing that a fair lottery is only valuable insofar as it satisfies a preference for risk, not because it respects the equal moral status of the participants.

  **Conclusion**

  Effective altruists and economists are correct that Harsanyi's theorem is a powerful tool for clarifying the structure of social choice. However, invoking it as a "vindication" of utilitarianism is rhetorically excessive and philosophically imprecise. The theorem demonstrates that utilitarianism is the price of admission for a specific combination of rationality, welfarism, and Pareto efficiency. It does not prove that the price is worth paying. Until the gaps of measurement and equity are closed by independent ethical argument, Harsanyi's aggregation remains a consistent formalization of utilitarianism, but not a justification for it.
