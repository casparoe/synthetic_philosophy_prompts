answer: |-
  You have put your finger on one of the most persistent and fascinating problems in contemporary meta-ethics. Philosophers call it the **Puzzle of Moral Testimony**. Your intuition from the dinner table is shared by many ethicists: there seems to be a "normative asymmetry" between factual and moral deference.

  It is rational to believe the earth is round because a physicist told you so. It seems somehow *less* rational (or at least less morally worthy) to believe euthanasia is permissible because a philosopher told you so. As you noted, standard examples (meat, abortion) are often too charged to isolate the variable.

  Here is a pair of scenarios constructed to be as structurally identical as possible, using an obscure context to minimize pre-existing bias.

  ### The Scenarios: The Archival Steward

  Imagine you are a junior steward at a highly specialized, private historical archive. The archive holds sensitive materials from defunct political regimes. You lack the clearance and the specialized training to interpret the raw data yourself. However, you trust the Archive Director implicitly; she has decades of experience, has never misled you, and has access to the full metadata and provenance records that you cannot see.

  **Case A: The Factual Verdict (Provenance)**
  A box of documents arrives from a specific region during a specific decade. The question is: *Did these documents originate from the Ministry of Interior, or the Ministry of Culture?*
  This is a matter of historical fact, but determining it requires analyzing obscure watermarking techniques and chemical composition of ink that you do not know how to assess. You ask the Director. She examines the data and tells you, "These documents originated from the Ministry of Interior."
  You have no independent access to the evidence. You believe they are from the Ministry of Interior solely because she told you so. You then catalogue them accordingly.

  **Case B: The Moral Verdict (Restitution)**
  A box of documents is confirmed to have been stolen from a specific persecuted community during that same regime. The question is: *Ought we to return these documents to the community's descendants, or retain them for public research?*
  This is a matter of moral weight. It involves balancing the community's right to privacy and restitution against the public's right to historical truth. There is no formula for this; it requires a judgment call on what is *fair* and *just* in this specific context. You ask the Director. She examines the context and tells you, "It is the right thing to do to return these documents."
  You have no independent access to the moral reasons (you haven't weighed the harms and benefits yourself). You believe returning them is the *right thing to do* solely because she told you so. You then proceed to return them.

  ***

  ### The Intuition Check

  In **Case A**, your behavior is unremarkable. You are a competent professional relying on expert testimony to establish a fact you cannot verify. If challenged, saying "The Director confirmed the provenance" is a complete justification.

  In **Case B**, something feels thin. Even if you do the right action (returning the documents), you seem to be missing something essential to the moral act. If challenged, saying "The Director said it was the right thing" feels like an abdication of your role as a moral agent. You have acted correctly, but you haven't quite *owned* the decision.

  ### What is Generating the Discomfort?

  Philosophers generally divide the explanations for this discomfort into three camps. Since you asked for my take on what is "doing the work" here, I will synthesize the strongest arguments from the literature.

  **1. The Autonomy Account (You must make up your own mind)**
  This view suggests that morality is essentially about self-governance. To be a moral agent is to legislate for oneself. When you defer on a fact (Case A), you are updating your map of the world. When you defer on a moral verdict (Case B), you are handing over your compass.
  *   **The Diagnosis:** Moral worth requires that the action springs from *your* judgment. If you act rightly only because you were told to, you are acting like a well-programmed robot, not a virtuous person. The discomfort comes from the sense that you have surrendered your moral autonomy.

  **2. The Understanding Account (You must grasp the reasons)**
  This is perhaps the most compelling explanation. In the factual case, knowing *that* the documents are from the Interior Ministry is often enough. In the moral case, knowing *that* an action is right is insufficient; you need to know *why*.
  *   **The Diagnosis:** Moral action requires sensitivity to reasons. If the Director says "Return it," but you don't understand *why* (e.g., "because the harm of exposure outweighs the historical value"), you cannot respond if the situation changes slightly. If the Director isn't there tomorrow, you are helpless. The discomfort arises because moral deference leaves you without the *understanding* necessary to navigate future moral landscapes. You have the verdict, but not the wisdom.

  **3. The Motivation Account (You must care for the right reasons)**
  This view focuses on your emotional state. When you defer on a fact, your motivation is "truth." When you defer on a moral verdict, your motivation is often "obedience" or "trust," rather than moral concern.
  *   **The Diagnosis:** To act morally, you should be motivated by the welfare of those affected (the persecuted community), not by your regard for the Director. In Case B, your immediate reason for acting is "The Director said so." This crowds out the moral motivation (compassion, justice). The action is right, but your *motive* is second-rate.

  ### My Synthesis

  I believe the **Understanding Account** is doing the heaviest lifting in your dinner dilemma.

  In the factual case, the "truth" is external to you. Whether the documents are from the Interior Ministry is true regardless of whether you understand the ink chemistry. Your belief tracks the world.

  In the moral case, the "rightness" is partly constituted by your engagement with the reasons. Morality isn't just a set of correct outputs (like a math problem); it is a practice of reasoning about value. When your friend said, "I haven't worked through the arguments... I just decided to report him because my manager said so," they treated the moral verdict like a math answer.

  The discomfort you felt is the recognition that **moral knowledge is not just propositional (knowing *that*), it is practical (knowing *how*).** By outsourcing the verdict, your friend secured the correct action, but they bypassed the process that turns an action into a *virtue*. They got the right result, but they didn't grow as a moral agent in the process.

  In short: We trust experts to tell us what is *true*. But we expect moral agents to figure out for themselves what is *good*.
