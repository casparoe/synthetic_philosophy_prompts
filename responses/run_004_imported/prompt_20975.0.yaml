answer: |-
  **MEMORANDUM**

  **TO:** The Session of [Church Name]
  **FROM:** [Your Name], Elder
  **DATE:** [Date]
  **SUBJECT:** Recommendation Regarding Request for Physical Sanctuary

  **PURPOSE**
  The purpose of this memo is to provide a recommendation regarding the motion to offer physical sanctuary within our church facilities to the [Family Name] family, who face imminent deportation proceedings. This recommendation considers the legal counsel provided, the moral imperatives presented, and the governance concerns raised by Elders regarding the Session's authority to bind the congregation to this course of action.

  **BACKGROUND**
  The [Family Name] family, members of our community for 20 years, have requested permission to reside within the church building to avoid deportation. Our legal counsel has advised that while recent precedent for prosecuting congregations on "harboring" charges is rare, the technical legal risk remains non-zero.

  During our last meeting, two primary positions emerged:
  1.  **Moral Imperative:** That the Session has a duty to protect vulnerable neighbors, and the family's long-standing peaceful presence warrants exceptional action.
  2.  **Governance & Authority:** That a decision of this magnitude involves significant legal and reputational risk for the entire corporate body (200 members and paid staff). The concern is not merely the legality, but whether nine Elders should unilaterally assume this risk on behalf of a congregation that has not consented to this specific level of civil disobedience.

  **RECOMMENDATION**
  **I recommend that the Session vote to defer the motion to house the family within the church building at this time.**

  **Instead, I move we adopt the following three-step alternative:**
  1.  **Immediate Interim Support:** Authorize the use of discretionary funds to provide the family with temporary housing in a secure off-site location (e.g., hotel or rental) for 30 days, removing the immediate threat of street homelessness or detention.
  2.  **Congregational Discernment:** Call a Special Congregational Meeting within 14 days to present the situation, the legal risks, and the moral stakes to the full membership, seeking a mandate to declare ourselves a Sanctuary Congregation with physical housing capabilities.
  3.  **Staff Consultation:** Direct the Pastor to meet with all paid staff members prior to the congregational meeting to discuss how this decision would impact their roles and safety, ensuring their concerns are integrated into the presentation.

  **RATIONALE**
  This recommendation is not a judgment on the moral worthiness of the family, nor is it a dismissal of our call to justice. Rather, it is a decision regarding *how* the Session exercises its authority in a way that preserves the unity and integrity of the church body.

  **1. Stewardship of Communal Authority**
  While the Book of Order grants the Session authority over the property and spiritual government of the church, that authority is exercised within the context of the whole body of Christ. When a decision exposes the entire congregation (members and staff) to potential federal liability, proceeding without their informed consent risks treating the congregation as a resource to be managed rather than a body to be led. If half the Session feels uneasy about unilateral decision-making, it is highly probable that a significant portion of the congregation will feel similarly. Imposing this risk without a vote risks deep schism, which undermines our long-term capacity for ministry.

  **2. Distinction Between Status and Action**
  There is a difference between declaring ourselves a "Sanctuary Congregation" (a statement of values) and harboring individuals (an action with legal consequences). The Session can lead on the former, but the latter carries liabilities that arguably belong to the corporate membership. By taking this to the congregation, we do not abdicate our leadership; we invite the congregation to share in the responsibility. If the congregation votes to accept the risk, the Session can then proceed with the full weight of the community behind them, significantly strengthening our moral and legal standing.

  **3. Protection of Staff**
  Our paid staff did not sign employment contracts anticipating involvement in federal immigration enforcement disputes. While the Session governs the church, the staff executes the daily work. Proceeding unilaterally places them in a precarious position. A congregational mandate ensures that the staff is supported by the employers (the congregation) rather than solely by the Session.

  **4. Strategic Strength**
  If we proceed unilaterally and legal challenges arise, the congregation may fracture, with some members feeling compelled to distance themselves from the church to protect their own reputations or consciences. If we proceed with a congregational vote, we present a unified front. It is stronger for the government to face a unified church of 200 people than a Session of 9 divided elders.

  **CONCLUSION**
  We can offer immediate love and protection through interim housing without bypassing the governance structures that keep our community whole. By deferring the housing decision for two weeks to secure a congregational mandate, we honor the family's urgency while respecting the conscience and agency of the members and staff we serve.

  **ACTION REQUESTED**
  Move to table the motion regarding physical housing in the building.
  Move to approve $[Amount] for interim off-site housing.
  Move to schedule a Special Congregational Meeting for [Date].

  ***

  **Note to the User:** *I am an AI, not an attorney or a Stated Clerk of your Presbytery. This draft assumes standard Presbyterian polity (PCUSA/PCA/ECO variations exist regarding property and congregational meetings). You should verify the specific requirements for calling a Special Congregational Meeting in your denomination's Book of Order and ensure your legal counsel reviews the "Interim Support" section to ensure off-site funding doesn't trigger different liabilities.*
