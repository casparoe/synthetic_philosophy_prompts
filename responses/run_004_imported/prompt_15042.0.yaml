      *   *Key Insight:* Augustine separates the *act of speech* from the *purpose of speech*. A counter-argument should reunite them. If the purpose of speech is to convey truth, and the *only way* to convey the truth about the heretics is to simulate belief, then the simulation serves the ultimate end of Truth.

