  If she pushes back, your justification is that the student answered the *biology* perfectly (which you know best) but smoothed over the *philosophy* (which is the course focus). They treated Popper's recantation as a simple "I was wrong, it's science now," whereas the philosophical literature treats it as a more complex shift regarding metaphysical research programmes versus testable models. The deduction reflects that lack of critical engagement with the "whether" part of question (b).
