answer: |-
  This is a sophisticated objection that cuts to the heart of utilitarian political theory. Your friend is articulating what is often called the "tyranny of the majority" problem within hedonistic calculus: if utility is just the sum of pleasures minus pains, and "disgust" is a genuine pain felt by the majority, why shouldn't the state alleviate that pain by suppressing the source of the disgust, even if the source harms no one?

  Bentham's passage from *Offences Against One's Self* offers a two-pronged rebuttal. He is not simply sidestepping the issue; he is arguing that counting antipathy as a *ground for legal punishment* violates the deeper utilitarian goal of security and leads to redundant cruelty.

  Here is a reconstruction of the argument in the passage, followed by an evaluation of whether it blocks your friend's worry.

  ### 1. Reconstructing Bentham's Argument

  In the quoted text, Bentham advances two distinct lines of reasoning that work together.

  **Prong A: The Argument from Consistency (The Slippery Slope)**
  *   **Premise 1:** If "mere antipathy" (disgust without direct harm) is accepted as a sufficient ground for legal punishment, then any group disliked by a majority becomes liable to punishment.
  *   **Premise 2:** Historically, this principle has been used to justify atrocities (burning heretics, Moors, Jews) based solely on religious or cultural antipathy.
  *   **Premise 3:** We (Bentham's liberal Protestant audience) agree that burning Moors or Jews is wrong.
  *   **Conclusion:** Therefore, we must reject "mere antipathy" as a sufficient ground for punishment. To accept it for paederasty while rejecting it for heresy is inconsistent.

  **Prong B: The Argument from Redundancy (The Natural Sanction)**
  *   **Observation:** Antipathy is not a passive feeling; it actively inflicts pain on its object through social stigma, ostracization, and contempt ("a very galling punishment").
  *   **Mechanism:** This social punishment occurs naturally ("without having recourse to the political magistrate") and scales with the intensity of the public's disgust.
  *   **Conclusion:** Adding *legal* punishment on top of this existing *social* punishment is gratuitous. The offender is already suffering in proportion to the public's antipathy. State intervention merely adds more pain without creating new utility.

  ### 2. Exclusion vs. "Pricing In"

  You ask whether Bentham means to **exclude** antipathy-based pain from the calculus or whether he thinks it is already **priced in**. The answer is a nuanced combination of both, but it leans heavily toward a specific restriction on *what counts as a valid input for legislation*.

  **He does not deny the pain is real.**
  Bentham acknowledges that the antipathy of the majority is a real sensation and that the stigma felt by the minority is a "galling punishment." He is not an idealist who pretends disgust doesn't hurt.

  **He excludes it as a *justification* for state action.**
  Bentham's move here is to distinguish between *pain that exists* and *pain that the state ought to relieve by punishing others*.
  *   **The Friend's View:** The majority's disgust is a pain $P_{majority}$. The state should minimize $P_{majority}$ by suppressing the act.
  *   **Bentham's View:** Satisfying $P_{majority}$ through legal punishment creates a new, larger pain $P_{legal}$ for the minority, plus a systemic pain $P_{insecurity}$ for everyone (since anyone could become a target of antipathy).

  **He argues the pain is already "priced in" via the Natural Sanction.**
  This is the second prong. Because society already punishes the "offender" through stigma, the utility of *deterrence* is already being achieved. Legal punishment is therefore "dead weight"—it adds suffering without adding deterrence. In economic terms, the market of social opinion has already priced the behavior; government regulation is a redundant tax that creates deadweight loss.

  ### 3. Does This Block Your Friend's Worry?

  Does this successfully refute the claim that a consistent hedonistic utilitarian must count the disgust? **Yes, but only if we accept Bentham's broader theory of "Security."**

  If your friend is arguing from the standpoint of a narrow **Act Utilitarianism** (calculate the pain of disgust vs. the pain of punishment in this specific instance), Bentham's argument might seem like a sidestep. A strict act-utilitarian could reply: *"But Bentham, in this specific case, the pain of 10,000 people feeling disgusted might actually outweigh the pain of one paederast being jailed. Why not jail him?"*

  However, Bentham is arguing from a **Rule/Institutional Utilitarian** perspective, specifically regarding the **Principle of Security**.

  **The "Security" Rebuttal**
  Bentham's deeper answer (found in *An Introduction to the Principles of Morals and Legislation*) is that the pain of **insecurity** is one of the greatest possible disutilities.
  *   If the law punishes based on antipathy, no citizen has security. My liberty depends on the fluctuating sensitivities of my neighbors.
  *   The anxiety produced by living in a society where you can be punished for merely being "odious" creates a massive aggregate pain across the whole population.
  *   Therefore, excluding antipathy as a ground for punishment maximizes utility in the long run by preserving **security**, even if it means tolerating the short-term pain of "disgust" felt by the majority.

  **The "Mischief" Rebuttal**
  Bentham also defines "offences" by their **mischief** (harm). In *Offences Against One's Self*, he argues that private consensual acts produce no *primary mischief* (no direct victim).
  *   For Bentham, the "pain" of disgust is a **sympathetic pain** (pain felt by a spectator), not a **self-regarding pain** (pain felt by a victim).
  *   Bentham generally argues that sympathetic pains should not underwrite criminal law because they are unbounded and subjective. If they did, as he says in the text, "a Protestant... could [not] with consistency condemn the Spaniards for burning Moors."

  ### Conclusion

  Bentham is not sidestepping the calculus; he is refining the inputs.

  1.  **Against Exclusion:** He admits the pain of antipathy is real.
  2.  **Against Aggregation:** He argues that satisfying this pain through law creates greater pains (redundant punishment + loss of security).
  3.  **The Verdict:** Your friend is correct that a *naive* hedonistic calculus might favor suppression. But Bentham's *sophisticated* calculus accounts for the long-term utility of legal consistency and personal security.

  The passage you quoted relies on the **redundancy argument** (social stigma is punishment enough) and the **consistency argument** (antipathy is a tyrannical standard). Together, they suggest that counting majority disgust as a valid reason for state punishment is a category error that ultimately decreases total utility by destroying the security necessary for happiness.

  So, you can tell your friend: Bentham doesn't ignore the pain of disgust; he argues that the pain of **living under a law that caters to disgust** is far greater.
