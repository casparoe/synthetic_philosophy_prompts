      *   **Decision Theories (CDT vs. TDT/EDT):**
          *   CDT (Causal): Don't pay. The past is fixed.
          *   TDT (Timeless)/EDT (Evidential): Pay. Your decision now is evidence of your algorithm/disposition. If you decide "don't pay," you imply that *anyone* in your position shouldn't pay, which means R. was foolish to help.
          *   *Crucial Point:* You want to live in a world where people help desperate friends. Paying sustains that norm.
      *   **The "Rational Irrationality" Angle:**
          *   It's rational to cultivate dispositions that constrain your future self.
          *   If you break this promise, you weaken your own internal commitment mechanism for future promises (even to yourself or new people).
      *   **Moral/Philosophical Synthesis:**
          *   It's not just about R. It's about *you*.
