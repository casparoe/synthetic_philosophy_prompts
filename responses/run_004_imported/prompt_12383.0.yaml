      *   *Section 3: Which fits better?* Argue for Non-Doxastic. Cite §204 (acting), §155 (groundless), §609 (end of explanations). Emphasize the shift from "knowing" to "acting."
      *   *Section 4: The Relativism Bonus.* Explain the "Riverbed" metaphor. Distinguish between local hinges (culture-specific) and universal hinges (human nature). Explain why this isn't necessarily dangerous relativism (it's about intelligibility, not truth claims).
