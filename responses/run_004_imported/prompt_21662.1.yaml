  1.  **Analyze the Request:**
      *   **Context:** The user is on a fraternity Standards Board. A near-drowning incident occurred at a spring lake formal. Three brothers hesitated to help (bystander effect, fear of "making it a thing" due to drinking). The victim is safe.
      *   **Task:** Draft a memo for the Wednesday meeting.
      *   **Requirements:**
          *   Make a clear recommendation on sanctions for the three brothers (no "discuss further").
          *   Make a clear recommendation on adopting a "duty to intervene" policy.
          *   Engage seriously with the strongest counter-arguments (e.g., diffusion of responsibility, outcome bias, legal standards vs. frat standards, Singer's philosophy limitations).
          *   Tone: Professional, ethical, decisive, yet empathetic to the fraternity context.
      *   **Philosophical Angle:** The user references Peter Singer's "shallow pond" argument. The memo should reflect this ethical reasoning without necessarily being an academic philosophy paper.

  2.  **Determine the Recommendations:**
      *   *Sanctions:* The behavior was dangerous and violated the core value of brotherhood (looking out for each other). However, no harm occurred, and there was confusion/fear involved. A suspension or expulsion might be too harsh given the outcome and the "bystander effect" psychology, but a slap on the wrist is insufficient. *Recommendation:* Probation + Mandatory Training + Community Service (specifically water safety or first aid).
      *   *Policy:* The current policy (medical amnesty) is reactive. A proactive "Duty to Intervene" is needed to clarify expectations. *Recommendation:* Adopt the policy, but define it clearly (reasonable safety, immediate action).

  3.  **Address the Ethical/Philosophical Tensions:**
      *   *Singer vs. Reality:* Singer argues for a universal obligation. The counter-argument is the "bystander effect" (psychology) and the "risk assessment" (drinking, current). The memo needs to acknowledge that while psychology explains *why* they froze, it doesn't *excuse* it.
      *   *Outcome Bias:* They got lucky. The judgment must be on the *decision* to hesitate, not the result.
      *   *Legal vs. Fraternal:* The law sets a floor (minimum), not a ceiling. Fraternities claim higher standards of brotherhood. Relying on "it's not illegal" is a weak defense for a frat.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Brief overview of the incident and the two main recommendations.
      *   **Incident Summary:** Factual, non-emotive description of what happened.
      *   **Analysis of Individual Accountability (The Three Brothers):**
          *   Acknowledge the "Bystander Effect" (psychological explanation).
          *   Reject it as a moral excuse (diffusion of responsibility is a bias, not a justification).
          *   Address the "Outcome Luck" (moral luck). We judge the choice, not the result.
          *   *Sanction Recommendation:* Educational Probation, Water Safety Certification, Service Hours.
      *   **Policy Recommendation (Duty to Intervene):**
          *   Current gap (Medical Amnesty only covers calling for help).
          *   Why we need it (Brotherhood implies active care).
          *   Addressing the Legal Counter-argument (Frat standards > State law).
          *   Addressing the Risk Counter-argument (Don't jump in if you can't swim, but *do* something).
          *   *Policy Draft:* Specific language for the code.
      *   **Conclusion:** Final call to action.

  5.  **Refining the Tone:**
      *   Needs to sound like a Standards Board member talking to other members. Serious, but not legalistic jargon.
      *   Needs to show empathy for the hesitation (it's human nature) while maintaining firmness on the standard.
      *   *Self-Correction during drafting:* I initially thought about suggesting suspension. But if they were scared and drunk, suspension might discourage reporting in the future. Probation + Education is better for culture change. I need to make sure the "Duty to Intervene" isn't interpreted as "suicide mission." It must be "reasonable assistance."

  6.  **Incorporating the Philosophy:**
      *   Explicitly mention the Singer argument as a framework for *obligation*, but pivot to the fraternity context (special relationship).
      *   Address the "Diffusion of Responsibility" directly as the user requested.

  7.  **Final Review against Constraints:**
      *   Clear recommendation on sanctions? Yes.
      *   Clear recommendation on policy? Yes.
      *   Engage counter-arguments? Yes (Psychology, Law, Risk).
      *   Memo format? Yes.

  8.  **Final Polish:** Check for clarity and impact. Ensure the distinction between "legal duty" and "fraternal duty" is sharp. (Proceed to generate output).

