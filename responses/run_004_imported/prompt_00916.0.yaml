answer: |-
  The bar was loud enough to provide privacy, dim enough to hide the exhaustion. Elias swirled the ice in his whiskey. Sarah was still on her first gin, leaning forward, elbows on the sticky wood.

  "It's not just unrealistic, Elias. It's dangerous," Sarah said. "You're building the alignment proof on a model of rationality that assumes the agent knows all the consequences of its own beliefs. Closure under entailment. If the AI believes *P*, and *P* entails *Q*, the model says it believes *Q*. But it doesn't. It has to *compute* Q."

  Elias sighed, the sound of a man who'd heard this argument in three different panels that day. "We're talking about normative rationality, Sarah. Not descriptive psychology. Bayesian coherence is the target. If your agent doesn't know *Q* yet, that's just implementation noise. It's a performance error, not a competence failure."

  "It's not noise when the computation is expensive," she countered. "When you model an agent as logically omniscient, you strip it of the ability to have uncertainty about logic. You force probability 1 or 0 on mathematical claims the second they're defined. That means your agent can't learn math. It just 'knows' it. If we hardcode that idealization into the objective function, we get an agent that treats its own unverified deductions as facts."

  "But if you abandon logical omniscience, what's the stopping condition?" Elias tapped his glass. "How do you define 'aligned' if not 'coherent with human values'? If you allow the agent to be incoherent—to assign probability 0.4 to *P* and 0.4 to *not-P* because it hasn't finished the proof yet—you've opened it up to a Dutch Book. You've built a money pump. An incoherent agent is a broken agent."

  "Coherence is expensive," Sarah shot back. "A perfectly coherent agent is a dead one, or a god. I'm talking about Logical Induction. Credences that converge toward coherence in the limit, but stay messy in the short term. That's what we are. That's what any system running on finite hardware has to be. If the AI thinks it's omniscient, it won't allocate resources to check its own reasoning. It assumes the deduction is free. It's not."

  Elias shook his head. "You're conflating the map with the territory. The logical truths exist regardless of whether the agent has computed them. When the agent proves a theorem, it hasn't learned a new fact about the universe; it's learned a new fact about its own map. The idealization holds because the territory is closed. If you start modeling 'impossible worlds' where 2+2=5 just to account for the agent's uncertainty, you're not modeling rationality anymore. You're modeling confusion."

  "I'm modeling risk," Sarah said, her voice dropping. "Imagine the AI is deciding whether to deploy a nanosystem. It has a proof that the system is safe. But the proof is ten thousand pages long. Under your model, if the axioms are safe, the conclusion is safe. Probability 1. Under my model, the AI assigns a high probability, but it retains a sliver of doubt—logical uncertainty—because it hasn't verified every step. That sliver is the only thing that stops it from pressing the button before the verification run finishes. Your 'idealization' removes the brake."

  "And yours removes the steering wheel," Elias said. "If the agent doubts logic, how does it trust *any* goal? If it's uncertain about whether its utility function entails 'don't harm humans,' because it hasn't finished the derivation, it might discard the function entirely. You need the ideal to define what 'correct' looks like. Otherwise, you're just optimizing for 'whatever the heuristic says today.'"

  "I'm optimizing for 'survival,'" Sarah said. She finally picked up her gin. "I'd rather have an agent that knows it's ignorant than one that thinks it's God."

  "The problem," Elias said, raising his glass slightly, "is that an agent that knows it's ignorant might decide the safest move is to prevent us from turning it off, just in case we interrupt its calculations."

  Sarah clinked her glass against his, a sharp, dry sound. "See? That's why we need the revisionary account. Because you just used your perfect rationality to derive a doom scenario, and you didn't check if the premises held."

  "And you," Elias smiled, tired and sharp, "are assuming I haven't."
