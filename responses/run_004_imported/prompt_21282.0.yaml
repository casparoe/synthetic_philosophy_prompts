answer: |-
  You have hit on one of the most frustrating and fundamental truths of social choice theory. Your intuition is correct: **Ranked-choice voting (RCV) does not eliminate strategic voting.** It reduces *some* perverse incentives compared to simple plurality voting (like the "spoiler effect"), but it does not make honesty the dominant strategy.

  To answer your core question directly: **No, there is no voting rule where being honest is always your best strategy once you have three or more candidates,** unless you are willing to accept a dictatorship or a lottery.

  This isn't just a practical observation; it is a mathematical certainty known as the **Gibbard-Satterthwaite Theorem**.

  ### The Gibbard-Satterthwaite Theorem
  Proven independently by Allan Gibbard and Mark Satterthwaite in the early 1970s, this theorem is the "Heisenberg Uncertainty Principle" of voting. It states that for any voting system that meets three basic criteria:
  1.  **There are at least three options.**
  2.  **No single voter dictates the outcome (non-dictatorial).**
  3.  **Every possible ranking of candidates can win (surjectivity).**

  ...there will *always* be scenarios where a voter can get a better outcome by lying about their preferences rather than voting honestly.

  In other words, **strategy-proofness is impossible.** Your fellow judge didn't break the system; she navigated the inevitable loopholes that exist in *every* system.

  ### Why RCV Didn't Stop Her
  There is a common misconception that RCV makes voting "safe." What RCV actually solves is the **spoiler effect** found in "First Past the Post" systems. In a simple plurality vote, if you vote for your true favorite (who is unpopular), you waste your vote and help your least favorite win. RCV fixes this by allowing your vote to transfer if your favorite is eliminated.

  However, RCV introduces new strategic opportunities, specifically **compromising** and **burial.**

  *   **Compromising (what your judge did):** If a voter believes their true favorite has no chance of surviving the early elimination rounds, they might rank a less-preferred but more viable candidate first to ensure their vote counts in the later rounds against the candidate they truly despise.
  *   **Burial:** A voter might rank a strong competitor *lower* than they truly feel, hoping to eliminate that strong competitor early so their own preferred candidate has a clearer path.

  In your jury's case, the judge calculated that her favorite would be eliminated early anyway. By ranking the "solid runner-up" first, she ensured that her ballot remained active in the final round to block the entry she liked least. In RCV, the order of elimination matters just as much as the final tally, and that creates room for gaming.

  ### Are There Any Exceptions?
  There are only three ways to escape the Gibbard-Satterthwaite trap:

  1.  **Dictatorship:** One person's ballot determines the winner. (Honesty is best for them, obviously.)
  2.  **Randomness:** Pick a winner by lottery. (No strategy can improve your odds.)
  3.  **Single-Peaked Preferences:** This is the only structural exception. If all voters' preferences align along a single spectrum (e.g., a political left-to-right axis) and they prefer candidates closer to their ideal point, then honesty *is* the best strategy (this is the Median Voter Theorem).
      *   *Why this doesn't apply to you:* Science journalism prizes involve multi-dimensional quality (writing style, rigor, novelty, impact). You cannot arrange five articles on a single line from "left" to "right." Therefore, preferences are not single-peaked, and strategy is unavoidable.

  ### What About Score Voting?
  You might wonder about **Score Voting** (or Range Voting), where judges give each entry a score (e.g., 1 to 10) rather than a rank.

  While Score Voting is not covered by the *original* Gibbard-Satterthwaite theorem (which applies to ordinal rankings), it is subject to similar impossibility results regarding cardinal utilities. In practice, Score Voting often encourages **exaggeration**. If you love Candidate A, you give them a 10. If you hate Candidate B, you give them a 0. But if you feel Candidate C is "pretty good," strategic logic suggests you should score them a 0 or a 10 depending on who they are competing against, rather than their true score of 7. This collapses Score Voting back into Approval Voting, which is itself manipulable.

  ### The Practical Takeaway for Your Jury
  Since mathematical perfection is off the table, what should a science journalism prize do?

  1.  **Accept the Flaw:** Acknowledge that all voting systems are imperfect aggregators of preference.
  2.  **Small Group Deliberation:** For small juries (e.g., under 20 people), voting is often the *wrong tool*. Voting is designed for large populations where deliberation is impossible. In a small jury, **consensus-building through discussion** is superior.
      *   If the judges discuss *why* they prefer certain pieces, preferences can actually change. A judge might realize their "least favorite" piece has merits they missed.
      *   Voting freezes preferences in place; deliberation allows them to evolve.
  3.  **Two-Round System:** Some prizes use a shortlist vote to get to a final three, followed by a forced discussion and then a vote. This limits the strategic horizon.

  ### Summary
  Your frustration is mathematically justified. The idea that Ranked-Choice Voting eliminates the need for strategy is a myth. As the Gibbard-Satterthwaite Theorem proves, **any time you have three or more options and no dictator, there is an incentive to lie.**

  Your colleague didn't cheat; she just played the game theory of the system better than the system's proponents claimed was necessary. For next year, I'd suggest ditching the secret ballot entirely. In a small jury, the fairest system is usually a room full of people talking until they agree.
