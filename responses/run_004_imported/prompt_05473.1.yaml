answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I'm [Father's Name]'s daughter.

  It's an honor to stand here. This basement has been a constant in my life for as long as I can remember. Thirty years of meetings, thirty years of coffee, and thirty years of my father showing up. Tonight is about marking twenty of those years without a drink.

  Usually, at moments like this, family members talk about how proud they are of the strength it took to get here. And I am proud. But my father has taught me that strength isn't always about how hard you fight to stand; sometimes, it's about how humbly you kneel to remember where you started.

  We all know the story of the last drink. It ended with a car that didn't stop where it was supposed to. It ended with damage. It ended with a realization that the next time might not just be about parked cars.

  But there's another part of that story my father doesn't always tell in the meetings, though he's told me. He knows that the line between a story like his and a tragedy is terrifyingly thin. He has spoken, quietly, about a man he sat next to in these very chairs during those early, desperate days. A man who was just as sick, just as lost, and who also drove home one night when he shouldn't have.

  That man didn't hit a parked car. He hit a person. And he isn't here to receive a chip tonight.

  My father knows this. He carries it. He has said more than once that he doesn't know why he's the one still walking around. He knows that luck played a hand in where his bottom was. But if there is luck involved in how he got here, there is no luck involved in what he's done since.

  Because the car stopped twenty years ago. But the work started the next day.

  He knows that surviving the accident wasn't the redemption. The redemption is in the twenty years of showing up. It's in the amends made, the apologies offered without expecting forgiveness, and the quiet service done in this basement when no one is keeping score. He treats every day of this sobriety not as a trophy he won, but as a debt he gets to pay forward.

  To the newcomers here: I know you're looking for guarantees. I can't give you those. But I can tell you what I've seen. I've seen a man who knows how close the edge was, and who chooses, every single morning, to walk further away from it. He doesn't stay sober because he thinks he's better than the man who isn't here. He stays sober because he knows he isn't.

  Dad, I love you. I love the father you are, and I love the man you've become in this room. Thank you for staying. Thank you for being honest about the cost. And thank you for proving that while we can't control every turn of the wheel, we are responsible for where we park the car.

  Happy anniversary.
