  ***

  ### Overall Comments

  **Grade: B- (75%)**

  This is a competent answer that demonstrates you have done the reading and grasped the historical case study very well (Part a is excellent). However, the grade is limited by a significant philosophical misunderstanding in Part (b). You argue that Hacking believes MPD is "essentially a role" patients "learned to perform." Hacking's crucial nuance is that while the *category* is constructed, the *pain and behavior* are not therefore fake or voluntary; he resists the "debunking" style of constructionism. If you come to office hours, we should discuss the difference between "constructing a kind" and "claiming the kind is an illusion." Your objection in Part (c) is strong, but be careful not to conflate Hacking's specific definition of "indifferent" with general taxonomic revisionism.
