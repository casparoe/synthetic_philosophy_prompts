  5.  **Refining the "Dutch Book" Nuance:**
      *   Standard Dutch Book theorems say: If your probabilities aren't coherent, a bookie can make money. Coherence implies logical omniscience.
      *   Logical Induction says: If your probabilities aren't *computationally* coherent (exploitable by poly-time traders), you fail the criterion.
