      *Wait, another nuance:* Priya says "trader profits if it correctly predicts that the market's current price... is wrong." Technically traders hold portfolios. If the price moves in their direction, they gain value. "Predicts price is wrong" is a good colloquial summary of "arbitrage." I'll mark that as acceptable simplification.

