      *   The Verdict: Flawless vs. Fallible.
      *   Story Advice: How to write the character's moment of choice.

  7.  **Final Review against constraints:** The user's housemate says there's no settled answer. I need to acknowledge that while *academia* debates it, *logic* demands a specific path for a rational agent seeking survival. I will take the stance of **Evidential/Functional supremacy over Causal** in this specific instance, effectively arguing that CDT is the tool that is broken, not the world.

