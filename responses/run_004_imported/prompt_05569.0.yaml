answer: |-
  The conference bar was nearly empty, save for a few stragglers nursing warm beers and the hum of the ice machine. Cara and Tom sat at a high-top table, their name tags slightly peeling. Cara had argued for a Lewisian modal realism with counterpart theory in the afternoon session; Tom had defended a Kripkean essentialism with transworld identity.

  "I still think you're asking Humphrey to care about a stranger," Tom said, swirling his whiskey. "That's the heart of it. When Humphrey sighs and says, 'I could have won,' he isn't thinking, 'A guy who looks like me won in a disconnected universe.' He's thinking about *himself*."

  Cara took a sip of her wine. "We've been here since the Q&A, Tom. Kripke's objection is powerful rhetorically, but metaphysically? It's circular. You're assuming that for 'Humphrey could have won' to be about Humphrey, Humphrey must literally exist in that other scenario. But that's exactly what counterpart theory denies. Lewis's point is that you can't use the pre-theoretic intuition of 'aboutness' to refute the theory that analyzes 'aboutness'."

  "I know the move," Tom said. "Lewis says I'm begging the question. He claims that once we analyze de re modality properly, we see that 'aboutness' is just a matter of counterpart relations. But here's where your afternoon opponent—and my friend from the seminar—pushed back. It's not just about question-begging. It's about the distinction between truth-conditions and content."

  Cara raised an eyebrow. "Go on."

  "Grant Lewis the truth-conditions," Tom said, leaning in. "Grant that the sentence 'Humphrey could have won' is true if and only if a counterpart wins in another world. Fine. You've saved the truth-value. But you haven't saved the *content*. When I have a modal attitude—hope, regret, fear—the object of that attitude is me. If counterpart theory is true, the object of Humphrey's regret is some other guy's victory. Lewis's rejoinder shows at most that truth-conditions and content can come apart. It doesn't show that his account gets the content right. It shows he's changing the subject."

  Cara nodded slowly. "That's a stronger objection than Kripke's original formulation. You're saying CT is a revisionary semantics, not an explication of ordinary language."

  "Exactly. And revision comes at a cost. If I tell you, 'I could have been a pianist,' and you reply, 'No, but a counterpart of you is,' you've corrected my metaphysics, but you've ignored my phenomenology. The 'I' in that sentence refers to the subject of experience. If that subject doesn't exist in the world where the piano is played, then *I* didn't play the piano. Someone else did."

  "Okay," Cara said, setting her glass down. "I accept that distinction. You're willing to grant CT the extension—the set of worlds where the sentence is true—but you deny it captures the intension, the proposition expressed. But now let's talk about the price of your view. You want to keep the 'I' fixed across worlds. You want transworld identity. But how do you handle accidental intrinsics?"

  Tom sighed. "I knew you'd pivot here."

  "It's the strongest argument Lewis has," Cara said. "Take Humphrey. In world $W_1$, he is sitting. In world $W_2$, he is standing. If Humphrey is numerically identical across both worlds—if it is literally one and the same object wholly present in both—then Humphrey is both sitting and standing. That's a contradiction. Intrinsic properties are incompatible."

  "The standard move," Tom said. "Relativization. Humphrey doesn't have the property *sitting* simpliciter. He has the property *sitting-at-$W_1$* and *standing-at-$W_2$*. Just as we handle temporary intrinsics in time. I sit at $t_1$, I stand at $t_2$. I don't change my ontology to temporal parts to solve that; I index the properties to times. Why can't I index them to worlds?"

  "Because time and modality aren't analogous in that way," Cara countered. "When we relativize to time, we preserve the intrinsicality of the shape relative to the moment. But if you relativize to worlds, you turn intrinsic properties into relations. *Sitting* is a monadic property. It's about how your body is arranged. *Sitting-at-$W_1$* is a relation between you and a world. If you do that, you lose intrinsic properties altogether. Everything becomes extrinsic. Humphrey's shape depends on which world he's related to. That destroys the very notion of an intrinsic nature."

  Tom tapped the table. "Is that worse than what you do? On your view, Humphrey in $W_1$ and Humphrey-in-$W_2$ (the counterpart) are two different things. They don't share a nature. They just resemble each other. You save intrinsicality by multiplying entities. I save identity by relationalizing properties. Which is the cheaper bullet?"

  "That's the question, isn't it?" Cara mused. "Lewis thinks relativizing intrinsics is metaphysically disastrous. If shape is a relation to a world, then nothing has a shape in itself. It only has a shape relative to a context. That makes the physical world dependent on the modal framework. It puts the cart before the horse."

  "But look at the alternative," Tom said. "On your view, modal claims about *me* are never really about *me*. They are about my surrogates. If I say, 'I might have been taller,' on your view, that is false. *I* am exactly as tall as I am in every world I exist in (which is just one). It's just that a taller counterpart exists. So, strictly speaking, I have no modal properties of my own. I am modally inert. All the modal action happens in the counterparts. That seems to me a much higher cost than saying properties are indexed. I'd rather say 'sitting' is a relation to a world than say 'I' never refers to me in modal contexts."

  Cara paused. "You're framing it as a choice between the metaphysics of properties and the semantics of reference."

  "Basically. Your argument from accidental intrinsics works if you assume that intrinsicality is non-negotiable. But for me, transworld identity is non-negotiable because it's required for coherent de re attitude ascriptions. If I can't be the object of my own counterfactual hopes, then the whole discourse of regret and possibility is an illusion."

  "But is it an illusion, or just a confusion?" Cara asked. "Lewis would say our ordinary language is loose. We say 'I could have won' because we identify closely with our counterparts. The relation is so tight that we speak as if it's identity. But metaphysically, it's not. You're privileging the folk semantics over the ontological structure. I'm privileging the ontological structure and explaining away the folk semantics."

  "And I'm saying the ontological structure must accommodate the folk semantics, or it's not an account of *our* modality," Tom replied. "If your theory tells me that my deepest regrets are about strangers, your theory has failed to capture the phenomenon, even if it captures the truth-conditions."

  They sat in silence for a moment, the ice machine humming again.

  "So," Cara said finally. "We're at an impasse. My argument from accidental intrinsics shows that your view requires a radical revision of property theory—making all intrinsics relational. Your argument from Humphrey shows that my view requires a radical revision of semantic content—making all de re claims about counterparts."

  "Right," Tom said. "And neither of us thinks our revision is 'cheaper.' To me, losing the self in modal space is unthinkable. To you, losing intrinsic properties is unthinkable."

  "It suggests," Cara said, signaling the bartender for the check, "that the dispute isn't about which theory is true in a vacuum. It's about which theoretical virtue you're willing to sacrifice. Do you value the coherence of intrinsic predication more, or the directness of modal reference?"

  "Or," Tom added, standing up, "it suggests that 'possibility' might be doing two different jobs in our theories. For you, it's a quantifier over concrete realities. For me, it's a way of describing the potentialities of a single subject. We're not even solving the same puzzle."

  "Same puzzle," Cara said, grabbing her bag. "Different priority rankings on the constraints."

  "Next year?" Tom asked.

  "Next year," Cara agreed. "But bring a better answer on the intrinsics. Relativization feels like a dodge."

  "And you bring a better account of why I should care about my counterpart's victory," Tom said. "Because right now, it still feels like you're telling Humphrey to cheer for a twin."

  They walked out into the cool night air, neither convinced, but both clear on exactly where the deadlock lay. The Humphrey objection hadn't killed counterpart theory, but the argument from intrinsics hadn't killed transworld identity either. They were simply two different ways of paying for the same intuition: that things could have been otherwise.
