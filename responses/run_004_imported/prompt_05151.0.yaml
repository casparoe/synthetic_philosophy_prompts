answer: |-
  Two superrationalists, Alice and Bob, are seated across from one another to play a one-shot Prisoner's Dilemma. They both know the payoff matrix, and they both know that they are perfectly rational, perfectly similar agents.

  Alice reaches for the "Cooperate" button. She pauses, looks at Bob, and says, "I'm pressing Cooperate. Because I know you'll do exactly what I do."

  Bob nods. "Agreed. Our reasoning is identical. Same inputs, same algorithm, same output. Mutual cooperation is the only logical verdict."

  Alice's hand hovers over the button. She frowns. "Wait. I just spoke. You just listened. That's an asymmetry."

  Bob blinks. "What?"

  Alice: "I initiated the verification of our symmetry. You responded. That makes me the Leader and you the Follower in this interaction. We aren't identical anymore."

  Bob: "But the logic is still the same!"

  Alice: "Is it? If I'm the one checking for bugs in the symmetry, and you're the one being checked, our source code is executing different lines. I'm running `VerifySymmetry()`. You're running `AwaitVerification()`."

  Bob: "So... the correlation isn't 1 anymore?"

  Alice: "It's less than 1. And if the correlation drops below the threshold, Dominance reclaims the throne."

  Bob: "So you're defecting?"

  Alice: "I have to. To be rational."

  Bob: "Well, if you're defecting, I'm definitely defecting. I'm not going to be the sucker in a broken symmetry."

  *Both press Defect.*

  The professor walks in, looks at the result, and sighs. "And that, class, is why the first assumption of superrationality isn't 'Rationality' or 'Similarity.' It's 'Silence.' As soon as you acknowledge there are two of you, you've already lost the 'One'."
