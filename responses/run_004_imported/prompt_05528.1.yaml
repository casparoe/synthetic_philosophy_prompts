answer: |-
  The silence of the Oort Cloud was supposed to be empty. That was the point of Mission 88: map the void where nothing should be. But the *Theseus* was not alone.

  Commander Vance stared at the main viewport. Hanging in the absolute dark, three thousand kilometers ahead, was a ship. It was gray, scarred, and bore the distinct, jagged burn mark on the port engine cowling that Vance had earned three weeks ago during a micrometeoroid skiff.

  "It's us," Vance said. Her voice was flat, the kind of flat that comes from holding back panic.

  "It looks like us," corrected Dr. Aris, sitting at the sensor console. He was the mission theorist, a man who thought in topologies while Vance thought in trajectories. "Sensors confirm identical mass, identical thermal output, identical radiation leakage. Even the atomic decay rates on the hull plating match down to the microsecond."

  "Then it's a mirror," Vance said, her hand hovering over the thruster controls. "Or a trick. If it's a physical object, there are two of us. If there are two of us, we have a collision course to calculate."

  "There is no collision course, Commander," Aris said softly. "Because there is no 'two'."

  Vance spun her chair. "Look at the damn screen, Aris. One *Theseus* here. One *Theseus* there. That is the definition of two."

  "Is it?" Aris turned to face her. "Leibniz would say if they share every property, they are the same substance. Black would say you can have two identical spheres in a void and they are still distinct because they occupy different places. But Black assumed the void was flat. He assumed space is a grid."

  "I don't care about the grid. I care about fuel. We have enough to get back to Earth orbit if we turn now. If we have to maneuver around *that*," she pointed at the burn-marked twin, "we might not make it."

  "If you maneuver," Aris said, "you prove my point. Or you prove yours. That's the stake."

  Vance frowned. "Explain."

  "Imagine the universe isn't a flat sheet," Aris said, leaning forward, his eyes bright with a terrifying curiosity. "Imagine it's a cylinder. Or a sphere. If you walk far enough in a straight line, you come back to where you started. In a closed universe, 'forward' eventually becomes 'behind'."

  "You think that ship is our own ass?"

  "I think," Aris said, "that there is only one *Theseus* in this sector. But space curves back on itself so tightly that light from our stern has traveled around the cosmos and hit our sensors from the front. We are looking at our own tail."

  Vance laughed, a sharp, brittle sound. "If that were true, the light lag would be immense. That ship is three thousand klicks out. Light takes ten milliseconds to cross that. To loop the whole universe in ten milliseconds? The curvature would crush us."

  "Not if the mass is distributed differently. Not if we're in a pocket. A bubble of folded geometry." Aris tapped his console. "We can't measure the curvature directly. The sensors just see an object with our mass. The data is identical whether it is a twin in flat space or a reflection in curved space. The math works both ways. It's not a physics problem, Vance. It's an ontology problem. Are there two things, or one thing counted twice?"

  Vance turned back to the viewport. The other *Theseus* hung there. Motionless. Just like them. "If I fire the starboard thrusters," she said, "and that ship stays still, it's a twin. It has its own command crew making its own decisions."

  "Or," Aris countered, "if you fire starboard, and the ship rotates to port relative to us, it's because *we* rotated. If it's the same ship, our frame of reference is the only frame of reference. You can't move relative to yourself."

  "So if I thrust, and it doesn't thrust back instantly, we die?"

  "If you thrust, and it *does* thrust back instantly, without light lag, then we are the same object."

  Vance gripped the yoke. The stakes were no longer just fuel. If Aris was right, they were trapped in a cosmic hall of mirrors. There was no Earth to go back to, because 'back' was just 'forward' extended. They were the only matter in existence, looping forever. If Vance was right, there was another crew out there. Another Vance. And if they were on a collision course, one of them had to yield.

  "Open a channel," Vance ordered.

  "Open to who?" Aris asked. "Us?"

  "Open it."

  Static filled the bridge. Then, through the speakers, a voice cut through. It was Vance's voice.

  *"Open a channel."*

  It wasn't a recording. It was simultaneous.

  Vance went pale. "Delay?"

  "Zero," Aris whispered. "No light speed delay. You spoke, and the ship spoke. It wasn't a transmission. It was a vibration in the same hull."

  "That's impossible."

  "It's Max Black's spheres," Aris said, his voice trembling now. "Black said you could have two identical spheres. But he forgot to specify the space they sit in. If the space connects them, they aren't two spheres. They're one sphere touching itself."

  Vance stared at the twin *Theseus*. It felt like looking into a mirror that had depth. She felt a sudden, violent nausea. If Aris was right, her friend in the co-pilot seat didn't exist as a separate entity from the person in the other ship's co-pilot seat. They were one consciousness stretched across a loop.

  "Okay," Vance said, her hand tightening on the yoke. "Assume you're right. One ship. Curved space. If we sit still, we stay in the loop. If we accelerate..."

  "We break the symmetry," Aris said.

  "Explain."

  "Right now, the system is static. Perfect symmetry. The force of gravity, the expansion, the curvature, it's all balanced. We are looking at ourselves because the light path is stable. If we apply thrust, we add energy to the system. We change the mass distribution. We change the curvature."

  "And the other ship?"

  "There is no other ship. So *the* ship changes. But here's the bind, Commander. If we thrust forward, we are chasing our own tail. We might close the gap. Or, by adding energy, we might expand the loop. We might push the image further away."

  Vance looked at the fuel gauge. Critical. "We can't sit here. We have to move."

  "If you move," Aris said, "you are deciding the nature of reality. If you thrust and the other ship moves away, you confirm there are two distinct objects obeying Newton's laws in flat space. You confirm Black. If you thrust and the image distorts, or stays fixed relative to us despite the acceleration, you confirm Hacking. You confirm the topology."

  "And if we collide?"

  "Then we were never two to begin with. You can't collide with yourself unless you fold space until it breaks."

  Vance made her choice. She couldn't live in a puzzle. She needed a universe where cause and effect were linear, where 'here' was not 'there'. She needed there to be two ships, because if there was only one, they were truly alone in a way that made her skin crawl. The loneliness of a closed universe was absolute.

  "Bringing starboard thrusters to ten percent," Vance announced.

  "Vance, wait," Aris warned. "If we break the symmetry, we might collapse the manifold."

  "We need to know if we're coming home or driving in circles."

  She pushed the yoke. The *Theseus* shuddered. The G-force pressed her into the seat.

  On the screen, the other *Theseus* shuddered.

  But it didn't move away.

  As the *Theseus* accelerated starboard, the image on the viewport accelerated *with* them. The distance remained exactly three thousand kilometers. The burn mark on the engine stayed in the exact same pixel coordinate.

  Vance cut the thrusters. The ship stopped. The image stopped.

  "It didn't change position," Vance whispered. "Relative to us, it didn't move."

  "Because 'us' and 'it' are the same coordinate," Aris said. He didn't sound triumphant. He sounded defeated. "We are in a closed loop. The universe is a ring. We are the only thing in it."

  Vance stared at the twin. It stared back. She raised her hand. The twin raised its hand. There was no lag. There was no separation. The three thousand kilometers of empty space between them was a lie. It was the same space, folded over.

  "So we're stuck," Vance said.

  "No," Aris said. "We're not stuck. We're continuous."

  "That's a poetic way of saying we're dead."

  "It means," Aris said, turning to look at her, really look at her, "that we don't need to go back to Earth. Earth is behind us. It's also in front of us. If we keep going forward, we'll find it. We just have to trust that the line curves."

  Vance looked at the fuel gauge again. They had enough to go forward. They didn't have enough to turn around, because 'around' was a concept that didn't apply here.

  She put her hand back on the yoke. She had to commit. If she accepted Aris's view, she had to trust the curve. If she accepted her own view, she had to assume the other ship was an obstacle and try to ram it to clear the path.

  If she rammed it, and it was herself, she would die.
  If she didn't ram it, and it was a twin, they might drift forever.

  But the thruster test had answered the question. The image had moved *with* her. Two independent objects would have shifted parallax. One object viewing itself would not.

  Black was wrong. There were not two spheres. There was one sphere, and the space was lying to them.

  "Setting course to forward," Vance said. "Full burn."

  "Commander?" Aris asked. "If we accelerate, the loop might tighten. The image might get closer."

  "Then we'll meet ourselves," Vance said. "And maybe when we touch, the circuit closes. Maybe the universe snaps open."

  "Or we crash into our own stern and vaporize."

  Vance looked at the twin one last time. She saw the fear in the other commander's eyes. It was her own fear. She realized then that the argument wasn't about metaphysics. It was about whether she was willing to accept that she was the only thing that existed.

  "Engage," she said.

  The engines roared. The *Theseus* surged forward. The twin surged forward. The distance remained constant. They were chasing the horizon of a world that had no edge.

  Vance watched the burn mark on the other engine. It wasn't a scar on a neighbor. It was a scar on herself, seen from a distance. She wasn't navigating a void; she was navigating her own back.

  "Are we moving?" Aris asked, his voice tight.

  "Space is moving," Vance corrected. "We're just staying still inside it."

  She pushed the throttle to maximum. The stars didn't streak past. They swirled. The geometry of the viewport warped. The twin *Theseus* began to grow larger, not because they were closing the distance, but because the space between the 'front' and the 'back' was compressing.

  "It's working," Aris breathed. "The mass energy is flattening the curve."

  "Or we're about to impact," Vance said.

  The twin filled the screen. The details were perfect. She could see the individual rivets. She could see her own face in the cockpit of the other ship.

  Vance didn't flinch. She didn't brake. To brake would be to admit there was something to avoid. To admit there was an 'other'.

  She committed. She accepted the single sphere.

  The *Theseus* flew into the mouth of the *Theseus*.

  There was no sound. No explosion.

  There was a sensation of passing through a membrane, like diving into water. The viewport went white, then clear.

  The twin was gone.

  The stars were no longer swirling. They were static. And ahead, small but distinct, was a blue marble hanging in the dark.

  Earth.

  Vance let out a breath she didn't know she'd been holding. Her hands were shaking.

  "Did we..." Aris started, checking the sensors. "The mass readings. The duplicate signature is gone."

  "Because there's only one of us now," Vance said.

  "Or," Aris said, looking at the navigation computer, "because we finally completed the loop. We came up behind ourselves and merged."

  Vance looked at the rear camera. Nothing but empty space. No twin. No burn mark. Just the smooth hull of the *Theseus*.

  "Does it matter?" Vance asked.

  Aris looked at the Earth, then at the empty void behind them. "Black would say yes. Hacking would say no. The physics is the same. The outcome is the same."

  "But I know," Vance said, watching the blue planet grow larger. "When I looked at that ship, I saw a stranger. Now I don't. The universe decided."

  "The universe didn't decide," Aris said quietly. "You did. You chose to fly into the mirror instead of shooting it."

  Vance didn't answer. She guided the ship toward home. She knew, with a cold certainty that would stay with her for the rest of her life, that Aris was right. The space had been curved. There had never been two ships.

  But as she looked at her reflection in the dark glass of the console, she wondered if the person looking back was the one who had made the choice, or the one who had survived it. In a closed loop, cause and effect are neighbors. She couldn't tell which was which.

  She engaged the landing sequence. The debate was over. The ontology was settled. They were one. And that was the loneliest thing she had ever known.
