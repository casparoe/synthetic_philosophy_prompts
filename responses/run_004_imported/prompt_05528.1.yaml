      *   *Conflict:* Fuel critical. Encounter with *Aethelgard-II*.
      *   *Key Moment:* The laser test.
      *   *Resolution:* They realize space is closed. They are looking at their own tail. But they have to decide whether to thrust. Thrusting breaks the symmetry.

      *(Self-Correction during drafting)*: If they thrust, they change their state. If it's one ship, thrusting changes the ship's state globally. If it's two, it changes one relative to the other.
      Let's make the ending about the *act of naming*. By naming it "The Other," they create the second sphere. But the physical reality is one.
      Actually, the prompt asks to commit. I'll commit to the Hacking view (One ship, curved space) because it's the more scientifically robust resolution to Black's thought experiment in modern physics (General Relativity allows closed timelike/spatial curves).
      *Wait, one nuance:* Hacking's point is that Black *assumes* Euclidean space. If the space is Riemannian (curved), the "two spheres" are just one sphere seen twice.
      *Story Arc:* Vance wants to shoot/avoid. Aris wants to merge/understand. They perform a test that proves curvature. They realize they are alone. The tragedy is that knowing they are alone doesn't stop the loneliness of seeing the "other."

      *Wait, let's make it more active.* They need to pass through the point of symmetry. If they pass through, do they swap places?
