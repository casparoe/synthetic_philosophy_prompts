prompt: |-
  Write an essay on the special composition question that focuses specifically on the dispute between "nihilist" answers (nothing composes anything; only simples exist) and "universalist" answers (any collection of objects composes a further object) as responses to the challenge of finding a non-arbitrary, general answer to the SCQ. Engage with van Inwagen's argument that ordinary restricted-composition views inevitably draw arbitrary lines, and consider whether this really forces us toward one of the extreme answers rather than some vague or contextualist alternative. Reach and defend a verdict on which type of answer is most plausible, and justify why the costs of your preferred view (e.g., denying tables and chairs exist, or accepting gratuitous "trout-turkeys") are more acceptable than the alternatives.
