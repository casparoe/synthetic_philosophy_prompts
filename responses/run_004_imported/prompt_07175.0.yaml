answer: |-
  You have stumbled onto one of the most fascinating and contentious corners of rationalist philosophy, and your housemate is absolutely right about the physics—but you might be relieved to hear that **your worry about ECL collapsing is based on a slight misunderstanding of what "Large Worlds" means.**

  The short answer is: **No, the argument does not strictly depend on the Many-Worlds Interpretation (MWI) of quantum mechanics.** If MWI turns out to be false, ECL (Evidential Cooperation in Large Worlds) survives, though its scope might shrink depending on the cosmology.

  Here is the breakdown of why the argument is more robust than it first appears, and what "Large Worlds" actually refers to in this context.

  ### 1. "Large Worlds" $\neq$ Just "Quantum Branching"
  When Caspar Oesterheld and colleagues shifted terminology from "Multiverse-wide Cooperation" (MWC) to "Evidential Cooperation in Large Worlds" (ECL), they did so intentionally to broaden the scope.

  In this context, a "Large World" is any cosmological model where the universe is sufficiently vast (spatially or temporally) that there exist other agents whose decisions are **logically correlated** with yours, even if you cannot causally interact with them.

  There are three main ways to get a "Large World," and MWI is only one of them:

  *   **The Quantum Multiverse (MWI):** As you described, reality branches. There are counterparts of you in other branches.
  *   **The Spatial Multiverse (Eternal Inflation/Infinite Space):** If the universe is spatially infinite (which current data on cosmic flatness is consistent with), then by the laws of probability, there are regions of space identical to our observable universe. There could be literal physical duplicates of you billions of light-years away. This relies on standard cosmology, not necessarily MWI.
  *   **The Simulation Hypothesis:** If advanced civilizations run many ancestor simulations, there are many "instances" of your civilization running on different substrates.

  If MWI is false (e.g., if Copenhagen or Objective Collapse is true), the **Spatial Multiverse** and **Simulation** arguments still stand. As long as the universe is big enough to contain agents who are reasoning similarly to you in similar situations, the ECL logic applies.

  ### 2. The Engine is Decision Theory, Not Physics
  The real heavy lifter in this argument isn't the physics; it's the **decision theory**.

  *   **Causal Decision Theory (CDT):** Says you should only care about outcomes you can *cause*. Since you can't send a signal to a duplicate in another galaxy or branch, CDT says their actions are independent of yours. ECL collapses under CDT.
  *   **Evidential Decision Theory (EDT) / Functional Decision Theory (FDT):** Says you should choose the action that provides the best *evidence* about the outcome. If your decision is the output of a specific algorithm (your brain/reasoning), and another agent is running a similar algorithm, your choice is *evidence* of their choice.

  The ECL argument says: *"I am running a 'cooperate' algorithm. If the universe is large, there are many other agents running similar algorithms. If I switch to 'defect', that is evidence that they will also switch to 'defect'. Therefore, I should cooperate to ensure the correlated agents do too."*

  This logical correlation holds even in a single-world, non-branching universe, provided there are other agents similar enough to you. The "Large World" aspect just scales up the stakes: instead of correlating with a few humans on Earth, you might correlate with $10^{100}$ agents across the cosmos.

  ### 3. Logical Correlation vs. Physical Causation
  Your housemate's objection assumes the link between you and the "aliens" is a physical causal link dependent on quantum branching. But ECL proponents argue the link is **logical**.

  Think of it like this: If you and a friend both solve the math problem $2+2$ without talking to each other, you will both write down $4$. Your answers correlate not because you signaled each other, but because you both accessed the same logical truth.

  ECL proponents argue that decision-making is similar. If you and a distant counterpart are both rational agents trying to maximize value, you are both "accessing" the same optimal strategy.
  *   If MWI is true, the correlation is reinforced by the branching structure.
  *   If MWI is false but space is infinite, the correlation exists because identical physical configurations yield identical decisions.
  *   If space is finite but the Simulation Hypothesis is true, the correlation exists because the same code is running in multiple instances.

  ### 4. So, Does It Collapse if the Universe is "Small"?
  This is the only place your housemate's skepticism really bites.

  If it turns out that:
  1.  MWI is false, **AND**
  2.  The universe is spatially finite (no distant duplicates), **AND**
  3.  We are not in simulations...

  ...then we live in a "Small World." In a Small World, there are no non-causally-connected counterparts. In that specific scenario, **yes, the "Multiverse-wide" scale of ECL collapses.** You would only be able to cooperate with people you can causally interact with (humans on Earth).

  However, note that a weaker version of the argument still applies even in a Small World. This is essentially **Hofstadter's Superrationality** applied to Earth. If you believe your reasoning correlates with other rational humans, EDT/FDT still suggests you should cooperate in Prisoner's Dilemma-style situations (like voting, or climate action) more than CDT would suggest. ECL just takes that intuition and applies it to the cosmological scale.

  ### 5. Why You Shouldn't Be Too Deflated
  It is easy to feel like the ground has fallen out when a foundational premise (MWI) is contested. But in the context of ECL:

  1.  **It's not all-or-nothing:** The argument is robust across multiple "Large World" hypotheses (Inflation, Simulations, MWI). You only need *one* of them to be true for the stakes to be huge.
  2.  **The probability weight:** Even if you assign MWI a low probability (say, 20%), if the potential value at stake is infinite (or astronomically large), the expected value calculation can still dominate your decision-making. This is similar to Pascal's Wager logic, but applied to decision theory rather than theology.
  3.  **The "Common Sense" overlap:** Even without ECL, most effective altruists argue for cooperation and altruism based on *causal* impacts on Earth. ECL is an *additional* reason to be cooperative, not the *only* reason. If ECL fails, you haven't lost the reason to be a good person; you've just lost the "magic" reason that your actions are influencing aliens in other galaxies.

  ### Summary
  You are understanding the "pitch" correctly, but you are over-indexing on the Quantum Many-Worlds Interpretation as the *only* mechanism.

  *   **"Large Worlds"** means any cosmology where duplicates or logical counterparts exist (Infinite Space, Simulations, OR MWI).
  *   **The Argument** relies on Evidential/Functional Decision Theory, which treats logical correlation as actionable, not just physical causation.
  *   **If MWI is false:** The argument survives if the universe is spatially infinite or if we are in simulations.
  *   **If the Universe is "Small" (Finite, No Sims, No MWI):** Then the *cosmological* scale of ECL collapses, but the core logic of superrational cooperation among humans remains.

  Your housemate is right to keep you grounded in settled physics, but the ECL rabbit hole is deeper than just one interpretation of quantum mechanics. It's a bet on the size of reality and the nature of rationality, not just the nature of wave functions.

  **Recommended Reading if you want to dig deeper:**
  *   Look for the paper *"Evidential Cooperation in Large Worlds"* by Oesterheld, Conitzer, et al. (2022). It explicitly addresses the "Large World" definition beyond just MWI.
  *   Check out the **Functional Decision Theory** papers by Yudkowsky and Soares. They decouple the logic from the specific physics of branching.
