prompt: |-
  I cover cognitive science for a living, and I've got a podcast interview next week with a researcher who's built her whole career defending Friston's free energy principle -- she genuinely thinks it's not just a theory of the brain but a theory of life itself. I dont want to just let her repeat the "brain as prediction machine" elevator pitch, so can you draft me seven or eight interview questions that actually push on the hard parts? I need at least one on the dark room problem (if minimizing prediction error is the whole game, why isn't every organism just holed up somewhere dark and unchanging, and whether "epistemic value" in expected free energy is a genuine fix for that or just a term invented to patch the hole), one on the recurring charge that the whole framework is unfalsifiable -- that it can retrodict literally any behavior after the fact so it never actually rules anything out, and one on scope: is this really a claim about brains, or about any self-organizing system with a Markov blanket (a cell, a hurricane, a thermostat), and if it's the latter, why that shouldn't make us suspicious it's explaining too much to explain anything. For each of those three, give me a sharp follow-up keyed to whatever answer she's most likely to give first.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **User:** Cognitive science journalist/podcaster.
      *   **Guest:** Researcher defending Karl Friston's Free Energy Principle (FEP) / Active Inference. Believes it's a theory of life itself, not just the brain.
      *   **Goal:** Avoid surface-level "brain as prediction machine" talking points. Push on hard philosophical and scientific criticisms.
      *   **Requirements:** 7-8 questions total.
      *   **Mandatory Topics:**
          1.  The Dark Room Problem (and whether "epistemic value" is a patch).
          2.  Falsifiability (retrodicting anything).
          3.  Scope/Universality (Markov blankets, thermostats vs. brains, explaining too much).
      *   **Specific Constraint:** For the three mandatory topics, provide a sharp follow-up question keyed to the likely defensive answer.

  2.  **Deconstruct the Free Energy Principle (FEP) & Active Inference:**
      *   *Core Claim:* Systems that persist (live) must minimize variational free energy (surprise/prediction error).
      *   *Mechanism:* Perception updates the model; Action changes the world to match the model.
      *   *Critique 1 (Dark Room):* If I minimize surprise, I should hide in a dark, silent room where nothing unexpected happens. *Counter:* Agents have priors about seeking novelty/information (epistemic value).
      *   *Critique 2 (Falsifiability):* It's a "principle" not a mechanism. It describes *what* must happen for a system to exist, not necessarily *how*. Critics say it's tautological (things that exist, exist).
      *   *Critique 3 (Scope):* If a thermostat minimizes free energy, does it have a "mind"? If everything is an inference engine, does the term lose meaning?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (Scope/Universality):* Start broad. The "Theory of Everything" claim.
          *   *Draft:* You say this applies to cells and hurricanes. Isn't that too broad?
          *   *Refinement:* Make it sharper. Focus on the "Markov Blanket" distinction. If a thermostat has one, is it inferring?
          *   *Follow-up:* If she says "it's about boundaries," ask about the *utility* of that description.

      *   *Question 2 (Falsifiability):* The "just-so story" critique.
          *   *Draft:* Critics say you can explain anything after the fact.
          *   *Refinement:* Frame it as "retrodictive power vs. predictive power."
          *   *Follow-up:* If she says "we make specific predictions," ask for a concrete example where FEP predicted something *other* theories couldn't.

      *   *Question 3 (Dark Room):* The classic objection.
          *   *Draft:* Why don't we sit in dark rooms? Is epistemic value a patch?
          *   *Refinement:* Focus on the *origin* of the priors. Where does the drive for information come from if the goal is minimizing error?
          *   *Follow-up:* If she says "it's hardwired," ask about evolution. Does FEP explain evolution or just assume it?

      *   *Question 4 (Neural Implementation):* Move from philosophy to biology. How does the brain actually do the math?
          *   *Draft:* The math is hard. How do neurons do it?
          *   *Refinement:* Variational calculus is computationally expensive. Is "neural message passing" realistic or just a metaphor?

      *   *Question 5 (Normativity vs. Descriptivity):* Is this how brains *do* work, or how they *should* work?
          *   *Draft:* Is this normative?
          *   *Refinement:* Distinguish between a mathematical bound and a biological mechanism. Are we describing the engine or the ideal physics of the engine?

      *   *Question 6 (The "Self" and Agency):* FEP redefines agency.
          *   *Draft:* What does this mean for free will?
          *   *Refinement:* If action is just sampling data to confirm priors, where does genuine novelty or creativity fit in? Are we just confirmation machines?

      *   *Question 7 (Progress/Alternatives):* What has this actually bought us?
          *   *Draft:* What have you discovered?
          *   *Refinement:* Compare to standard reinforcement learning or predictive processing without the FEP umbrella. What specific clinical or technological breakthrough relies *essentially* on the Free Energy Principle?

      *   *Question 8 (The "Life" Claim):* Return to the big claim.
          *   *Draft:* Is it a theory of life?
          *   *Refinement:* If FEP is the law of life, what counts as a violation? Can a system *not* minimize free energy and still live?

  4.  **Selecting and Polishing the Top 7-8:**
      *   I need to ensure the three mandatory ones (Dark Room, Falsifiability, Scope) are prominent and have the required follow-ups.
      *   I'll structure the list to flow logically: Scope -> Falsifiability -> Dark Room -> Implementation -> Utility -> Alternatives -> Future.

      *   *Refining the Mandatory Follow-ups:*
          *   *Scope:* If she says "It's about mathematical necessity," ask "Does mathematical necessity equal biological mechanism?"
          *   *Falsifiability:* If she says "It constrains the hypothesis space," ask "Show me the constraint that ruled out a competing model."
          *   *Dark Room:* If she says "Priors encode curiosity," ask "Who wrote the priors? Doesn't that just push the problem back to evolution?"

  5.  **Final Review against Constraints:**
      *   7-8 questions? Yes.
      *   Dark Room included? Yes.
      *   Falsifiability included? Yes.
      *   Scope/Markov Blanket included? Yes.
      *   Sharp follow-ups for those three? Yes.
      *   Tone: Professional, knowledgeable, challenging but fair (journalistic).

  6.  **Final Polish:** Check the wording to ensure it sounds like a spoken interview script, not an academic exam. Use phrases like "Let's press on..." or "The skeptic in the room would say..."

      *(Self-Correction during drafting)*: Make sure I don't sound *too* hostile. The goal is to get good content, not to debunk her live. The questions should invite elaboration while cornering the vagueness.

      *Let's finalize the list.*
      1. Scope (Markov Blankets)
      2. Falsifiability (Tautology)
      3. Dark Room (Epistemic Value)
      4. Neural Plausibility (The Math)
      5. Normative vs. Descriptive (Ought vs. Is)
      6. Comparative Utility (vs. RL)
      7. Evolution (Where do priors come from?)
      8. The "Theory of Life" claim (What would disprove it?)

      *Wait, I need to make sure the follow-ups are specific to the likely answer.*
      *   Scope Likely Answer: "It's a formal definition of existence." -> Follow-up: "Does formal definition help us treat schizophrenia?"
      *   Falsifiability Likely Answer: "It generates specific hypotheses." -> Follow-up: "Give me one that failed."
      *   Dark Room Likely Answer: "Agents have priors for information gain." -> Follow-up: "Is that an axiom or a derivation?"

      *Okay, ready to write.*
answer: |-
  Here are eight interview questions designed to move past the elevator pitch and engage with the substantive philosophical and scientific criticisms of the Free Energy Principle (FEP). The three mandatory topics are highlighted with their specific follow-ups.

  ### 1. The Scope Trap (Markov Blankets)
  "You've argued that the FEP applies to any self-organizing system that maintains a Markov blanket—whether that's a human brain, a single cell, or even a hurricane. But if the same mathematical principle describes a thermostat regulating temperature and a human seeking meaning, doesn't the concept of 'inference' become so diluted it loses its explanatory power? If everything is inferring, are we actually saying anything specific about cognition, or just describing the physics of boundaries?"

  ### 2. The Falsifiability Charge
  "A recurring criticism from computational neuroscientists outside the FEP camp is that the principle is unfalsifiable. They argue that because any persistent system *must* minimize free energy to exist, you can retrodict any behavior after the fact by assuming the system had a prior that matched that behavior. It becomes a 'just-so' story. How do you move from a tautology about existence to a falsifiable model of specific neural mechanisms?"

  **Follow-up (if she argues FEP generates specific testable hypotheses):**
  "Can you name a specific, high-profile finding in neuroscience that was predicted by the Free Energy Principle *before* the data was collected, which a standard reinforcement learning or Bayesian model would have explicitly ruled out? I'm looking for a case where FEP didn't just fit the data, but constrained the hypothesis space enough to be proven right and a competitor wrong."

  ### 3. The Dark Room Problem
  "Let's talk about the 'Dark Room' problem. If the brain's primary imperative is to minimize prediction error (or surprise), the optimal strategy for any organism should be to sit in a dark, silent room where nothing unexpected ever happens. Obviously, we don't do that. You've introduced 'epistemic value' into expected free energy to solve this—essentially baking a drive for information into the math. Is this a genuine derivation from the principle, or is it a patch term invented specifically to plug that hole?"

  **Follow-up (if she argues that priors for information gain are naturally selected/derived):**
  "If those priors for information gain are selected by evolution, doesn't that mean the FEP isn't the fundamental law driving behavior, but rather evolution is? In other words, doesn't this admit that FEP describes the *constraints* on a living system, but not the *motives*? If the 'drive' comes from evolutionary history and not the math itself, isn't the math just a container for the real biology?"

  ### 4. Neural Plausibility (The Math Problem)
  "Variational calculus is computationally expensive. When you propose that neurons are passing messages to minimize variational free energy, are you suggesting the brain is literally performing these specific mathematical operations, or is this a functional metaphor? If it's literal, how do you account for the metabolic cost of that computation compared to simpler heuristic models?"

  ### 5. Normative vs. Descriptive
  "There is a tension in your work between the FEP as a normative theory (how a system *ought* to behave to survive) and a descriptive one (how the brain *actually* behaves). When we see pathological behavior—schizophrenia, addiction, severe anxiety—is the FEP useful because it tells us where the calculation breaks down, or does it just describe those states as 'optimal for a broken model'? If a psychotic delusion minimizes free energy for the patient, is it technically 'successful' inference under your framework?"

  ### 6. Comparison to Reinforcement Learning
  "Reinforcement Learning (RL) has driven the current revolution in AI. RL posits a reward signal; FEP posits error minimization. Practically speaking, what can Active Inference do that Deep RL cannot? If the outcome is the same—an agent navigating a world to achieve a goal—why should we bet on the Free Energy architecture as the future of AI or robotics?"

  ### 7. The Origin of Priors
  "We keep talking about 'priors'—the brain's expectations about the world. In your framework, where do these priors come from? Are they genetically encoded, or learned? If they are learned, what initializes the system before learning begins? If they are encoded, how does the FEP account for the vast flexibility of human culture and individual experience without becoming infinitely malleable?"

  ### 8. The "Theory of Life" Claim
  "You've stated this isn't just a theory of the brain, but a theory of life itself. For a principle to be a law of nature, there must be a condition under which it could be violated. Describe a hypothetical biological system that is alive, self-organizing, and maintains a boundary, but *does not* minimize free energy. If you can't describe one, are we discussing a scientific theory, or a definition of what it means to exist?"
