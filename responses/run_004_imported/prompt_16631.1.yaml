answer: |-
  This is a fantastic collision of fields. It makes perfect sense that your MARL work feels like a direct implementation of Lewis: you are literally simulating a population of agents converging on a coordination equilibrium through repeated interaction, without explicit design of the signal semantics. The fact that different seeds yield different stable languages is the textbook definition of Lewisian arbitrariness.

  However, your reading group has stumbled onto one of the most persistent debates in social ontology. The question is whether the *phenomenology* of norms (the "ought," the blame, the resentment) is a fundamental feature of the social world or merely a psychological gloss on top of game-theoretic stability.

  Here is the verdict: **Lewis (and his evolutionary descendant Skyrms) successfully explains *conventions*, but fails to explain *social norms*.** The "normative residue" identified by Gilbert and Bicchieri is not a non-load-bearing add-on; it is the functional mechanism that allows norms to survive in environments where simple equilibrium selection is insufficient. Lewis gives you the *structure* of agreement, but Gilbert gives you the *authority* of obligation. Without the latter, you have coordination, but you do not have normativity.

  Here is the reasoning, broken down by the strength of the reductionist case, the failure point of that case, and the implications for your work.

  ### 1. The Case for Lewis/Skyrms: Parsimony and Emergence
  The strongest argument for the Lewisian account is its ontological parsimony. It requires no mysterious social entities, no "group minds," and no irreducible normative facts. It relies solely on individual rationality (Lewis) or causal reinforcement dynamics (Skyrms).

  For your specific domain (referential games), Lewis is undeniably correct.
  *   **Arbitrariness:** In your RL setup, there is no intrinsic reason why signal `A` maps to object `X`. It is arbitrary.
  *   **Conditional Preference:** The receiver prefers to interpret `A` as `X` *if and only if* the sender expects the receiver to do so.
  *   **Equilibrium:** The system settles into a Nash Equilibrium where no agent benefits from unilaterally changing their policy.

  Skyrms improves on Lewis by removing the heavy cognitive burden of "common knowledge." Your agents don't need to model the other agent's model of the other agent ad infinitum. They just need policy gradients that converge. This makes the Lewis-Skyrms framework empirically adequate for explaining *signaling systems*. It explains how a regularity *emerges* and *persists*.

  If social norms were nothing more than signaling conventions (e.g., "which side of the road to drive on"), the Lewisian account would be a total victory. The "ought" would just be a heuristic: "I *ought* to drive on the right because I expect you to, and crashing is bad." The feeling of obligation is just the internalized prediction of negative utility.

  ### 2. The Failure Point: Blame and the Prisoner's Dilemma
  The Lewisian account collapses when we move from **Coordination Games** (Referential Games) to **Cooperation Problems** (Prisoner's Dilemmas/Stag Hunts), which is where most substantive *social norms* live.

  **The Problem of Deviation:**
  In your MARL referential game, if an agent deviates from the convention, the other agent experiences a drop in reward. The "punishment" is intrinsic to the task failure. The receiver guesses wrong, the episode ends, loss is backpropagated.
  In human social norms, if someone deviates (e.g., cuts in line, lies, free-rides), the reaction is not just "oh, coordination failed." The reaction is *blame*.

  Gilbert's critique hinges on this: Blame implies a **right to demand**.
  *   **Lewisian View:** If you deviate, I am disappointed because our coordination failed. I might try to signal you to change.
  *   **Gilbertian View:** If you deviate, I am *aggrieved*. I feel entitled to rebuke you, and you owe me an apology.

  Lewis tries to reduce this to "I prefer you to conform because it helps me." But this doesn't capture the *interpersonal authority*. In a pure equilibrium model, I have no standing to demand you change your policy unless it affects my reward. But in normativity, I have standing to demand you change your policy *even if* your deviation doesn't directly harm me (e.g., norms of purity, or norms where the violation is secret).

  **The Stability Problem:**
  More critically, Bicchieri points out that equilibrium alone is often unstable in the face of temptation.
  In a Lewisian convention, conforming is a best response *given* others conform. But in many social norms, conforming is *costly*.
  *   *Lewis:* I follow the norm because I expect you to, and it's in my interest.
  *   *Reality:* I follow the norm even when it is *not* in my immediate interest, because I believe you *expect* me to (normative expectation) and I fear social sanction.

  If the "ought" were just a prediction of equilibrium (as Lewis suggests), norms would dissolve the moment deviation became locally profitable. But norms often persist *precisely* to prevent locally profitable deviation. The "ought" feeling is the cognitive mechanism that overrides the immediate reward signal to maintain the long-term social equilibrium. Therefore, the "ought" is load-bearing. It is the psychological glue that holds the equilibrium together when the math says it should break.

  ### 3. The Verdict: Normativity as a Functional Technology
  Here is the hard landing: **The "normative residue" is real.**

  Lewis provides a perfect description of *conventions* (arbitrary coordination equilibria). But he fails to explain *norms* because he cannot derive the *authority to blame* from mere mutual expectation.
  *   **Lewis/Skyrms:** Explain the *pattern* of behavior (the "is").
  *   **Gilbert/Bicchieri:** Explain the *governance* of behavior (the "ought").

  You cannot get an "ought" from an "is," even a game-theoretic "is." The feeling of obligation is not a bug; it is a feature. It is a specific cognitive adaptation that allows humans to solve cooperation problems that pure self-interest (or simple RL reward maximization) cannot.

  If Lewis were right, a population of self-interested agents (like yours) should develop norms identical to human norms if the payoff structures are the same. They don't. They develop *strategies*. They develop *conventions*. But they do not develop *obligations*. They do not punish deviators at a cost to themselves (altruistic punishment) unless explicitly rewarded for it by the environment. Humans do this spontaneously.

  Therefore, the Gilbertian "Joint Commitment" (or Bicchieri's "Normative Expectations") is not a mystical add-on. It is a necessary theoretical posit to explain why human norms are robust in ways that simple equilibrium conventions are not. The "ought" is the mechanism that transforms a fragile equilibrium into a robust institution.

  ### 4. Implications for Your MARL Work
  Since you work in emergent communication, this distinction matters for how you frame your research and where you take it next.

  1.  **You are currently modeling Lewis, not Norms.** Your referential games are generating Lewisian conventions. Do not call them "norms" or "languages" in the human sense without qualification. They are signaling equilibria. They lack the normative force (blame/obligation) that characterizes human language use (e.g., lying is not just suboptimal, it is *wrong*).
  2.  **To model Norms, you need more than Reward.** If you want your agents to exhibit genuine social normativity (e.g., punishing a defector even when it costs them reward), you cannot rely solely on self-play reward maximization. You need to architect a mechanism for **Joint Commitment**.
      *   *Idea:* Can you create a "commitment" signal during initialization that, if broken, triggers a specific penalty module unrelated to the task reward?
      *   *Idea:* Can you model "normative expectations" where agents lose utility not just when coordination fails, but when they violate a predicted expectation of another agent, even if the task succeeds?
  3.  **The "Ought" is a Regularizer.** Think of the normative feeling as a regularization term in the loss function that prevents overfitting to local rewards. It stabilizes the policy against adversarial deviation.

  ### Summary
  Lewis won the battle for **conventions** (signaling systems, traffic sides), and your RL agents prove it. But he lost the war for **norms** (moral obligations, social rules). The "ought"-feeling is not a shadow cast by equilibrium; it is the engine that sustains cooperation when equilibrium is insufficient.

  Gilbert and Bicchieri are right: there is a normative residue. It is the difference between a system that *happens* to coordinate and a community that *holds* itself to account. Your agents do the former. To get the latter, you need to build the "right to blame" into the architecture, not just wait for it to emerge from the reward signal.
