      *   **Reason 2: The Normative Constraint (The "Pessimist" View).** Even if we grant subjectivism, there's a widespread intuition that it's *improper* to hold aesthetic beliefs on testimony. You shouldn't say "This is beautiful" if you haven't seen it, even if you trust the source. This suggests something unique about aesthetic engagement beyond just fact-transmission.
      *   **Reason 3: The Action-Guiding Nature.** Aesthetic judgments often guide action (go see the movie, buy the print). Testimony might guide the action, but does it justify the *valuation*?
