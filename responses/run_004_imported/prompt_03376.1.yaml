      *   *Better Shift:* Let's look at the "Reference Class" objection to SSA. SSA requires a reference class. If the class is too narrow, Doomsday vanishes. If too broad, it's absurd. Elena usually defends a specific class (e.g., "humans"). Julian attacks the arbitrariness.
      *   *The Turn:* Julian pushes on *why* the reference class is restricted. Elena admits it's to save the future. Julian points out that SIA handles the "why I exist" question better, *unless*... unless we talk about *indistinguishable* observers.
      *   *Actually, let's go deeper into the "Presumptuous" bullet.* Julian should admit SIA *does* allow armchair cosmology, but argues that's a feature, not a bug. Elena should counter that it violates the principle of empirical checkability.
