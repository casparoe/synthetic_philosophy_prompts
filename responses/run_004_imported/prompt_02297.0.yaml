answer: |-
  This is one of the classic showdowns in analytic aesthetics. You and your friend are reenacting a debate that defined the field in the 1960s. Your friend is channeling **Alfred Lessing** (specifically his 1965 paper *"Art and Authenticity"*), and your hazy memory is spot-on: **Nelson Goodman** dismantled that view in his 1968 book *Languages of Art*.

  Here is the breakdown of the battle, the specific arguments, and an evaluation of who wins.

  ---

  ### 1. The Friend's Position: Alfred Lessing
  **The Core Claim:** Aesthetic value resides entirely in the perceptible qualities of the object *right now*.

  Lessing argues that if a forgery (Van Meegeren) is perceptually indistinguishable from the original (Vermeer), then they are **aesthetically identical**. To claim otherwise is "aesthetic snobbery."

  *   **The Argument:** Art is about the experience of the object. If the object provides the same visual experience, it provides the same aesthetic value.
  *   **The Status of Forgery:** Lessing agrees forgery is wrong, but he insists it is a **moral, legal, or economic wrong**, not an aesthetic one. The forgery is a lie about its history (provenance), but the lie doesn't change the paint on the canvas.
  *   **The Intuition:** If you were blindfolded, then shown the painting, and had a transcendent experience, does it matter if you later find out it was painted last Tuesday? Lessing says: No. The experience you had was real. To devalue the experience based on external facts is to fetishize the artist's biography over the art itself.

  ### 2. Your Position: Nelson Goodman
  **The Core Claim:** Authenticity is constitutive of the aesthetic experience in "autographic" arts.

  Goodman's argument is subtler and weirder than "history matters." It hinges on his distinction between two types of art:
  *   **Allographic Arts:** Arts where the work is defined by a notation or score (e.g., music, dance, literature). If you play a perfect copy of a Beethoven score, it *is* Beethoven. The history of who physically moved the bow doesn't matter.
  *   **Autographic Arts:** Arts where the history of production is essential to the work's identity (e.g., painting, sculpture). There is no "score" for a painting. The work is the specific physical object created by the artist's hand.

  **Goodman's Counter-Argument to Lessing:**
  Goodman admits that at Time $T_1$, a perfect forgery might look identical to the original. However, he argues that knowing a work is a forgery changes the **category** to which we assign the work, and this changes how we perceive it.

  1.  **The Training of Perception:** Goodman argues that the knowledge that a work *might* be a forgery changes how we look at it. It makes us look *harder*. Even if we can't see a difference *now*, the knowledge that there is a difference (because one was made by Vermeer and one by Van Meegeren) means we are looking for different things.
  2.  **Future Perception:** This is the point you remembered. Goodman argues that aesthetic judgment isn't just about the snapshot of perception right now; it's about the **capacity to distinguish**. If we know one is a fake, we treat the visual features differently. We might look at a brushstroke in the Vermeer as a bold innovation, and the *identical* brushstroke in the Van Meegeren as a calculated imitation. The physical mark is the same, but its **aesthetic function** is different.
  3.  **The "Difference that Makes a Difference":** For Goodman, if there is a difference in origin, there *must* be a perceptual difference eventually, even if our current instruments or eyes can't detect it yet. The belief that they are identical is just a limitation of our current scrutiny. Therefore, treating them as aesthetically identical is premature and incorrect.

  **In short:** For Lessing, the art is the *image*. For Goodman, the art is the *image-plus-its-history-of-production*.

  ---

  ### 3. The Showdown: Who Survives Objections?

  To decide who wins, we have to throw their best punches.

  #### Objection to Lessing (The "Achievement" Problem)
  Lessing's view collapses the distinction between **discovery** and **replication**.
  *   **The Argument:** When we value a Vermeer, we aren't just valifying the pattern of light on a retina; we are valuing the *artistic achievement* of solving a visual problem for the first time. Van Meegeren didn't solve the problem; he copied the solution.
  *   **Why it hurts Lessing:** If Lessing is right, then a perfect AI generation of a "new Vermeer" today would be aesthetically equal to the actual Vermeer. Most people feel a deep intuition that this is false. The "genius" is part of the aesthetic package. Lessing has to call this intuition "snobbery," which feels like he is defining away a core part of how we experience art.

  #### Objection to Goodman (The "Psychological" Problem)
  Goodman's view risks making aesthetics entirely dependent on **belief** rather than **object**.
  *   **The Argument:** If a forgery is perfect, and I am told it is real, I have a profound aesthetic experience. If I am later told it is fake, Goodman says my aesthetic experience *should* change (and does). But did the *art* change? Or did my *psychology* just change?
  *   **Why it hurts Goodman:** It suggests that aesthetic value isn't in the painting, but in our knowledge about the painting. If a museum mislabels a Van Meegeren as a Vermeer for 50 years, was the art "greater" during those 50 years? Goodman has to say "Yes, the aesthetic experience was different," which sounds suspiciously like the aesthetic value is subjective based on information, not inherent in the work.

  ### The Verdict: Goodman Wins (But with a Caveat)

  In the history of philosophy, **Goodman is generally considered to have won this debate.** Here is why:

  **1. The Category Mistake:**
  Goodman successfully identifies that Lessing is treating painting like music (Allographic). In music, a perfect performance is the work. In painting, the history of production is part of the work's identity. Because painting is **autographic**, the "lineage" of the object is a perceptual feature in the same way the color is. We perceive the brushstroke *as* "Vermeer's struggle" or *as* "Van Meegeren's calculation." That "as" is an aesthetic property.

  **2. The Van Meegeren Proof:**
  The Van Meegeren case actually proves Goodman right.
  *   **Phase 1 (Believed Real):** Critics praised the "spiritual depth" and "quiet piety" of Van Meegeren's *Supper at Emmaus*. They saw the visual features as evidence of Vermeer's soul.
  *   **Phase 2 (Known Fake):** Once Van Meegeren confessed, critics didn't just say, "Oh, it's still beautiful." They said the painting looked "flaccid," "clichéd," and "hollow."
  *   **The Goodman Explanation:** The paint didn't change. The *categorization* changed. Because it was re-categorized as a forgery, the viewers looked at the same brushstrokes and perceived them differently (as imitative rather than expressive). This validates Goodman's claim that knowledge of origin alters perception itself, not just our opinion of it.

  **3. The "Future Perception" Knockout:**
  Goodman's strongest point is that "indiscernibility" is temporary. Just because we can't tell the difference *today* doesn't mean there isn't a difference to be found. Aesthetic judgment requires us to acknowledge that the object has a history that is potentially readable. To ignore that history (as Lessing suggests) is to look at the art improperly.

  ### How to Push Back on Your Friend

  You can tell your friend this:

  > "Lessing thinks aesthetic value is like the taste of a wine—purely sensory. But Goodman shows that aesthetic value is more like a conversation. If I tell you a joke, and you laugh, but then I tell you I stole the joke from a comedian who died yesterday, your experience of the joke changes. The words didn't change, but the **weight** of the words changed.
  >
  > With Van Meegeren, when we thought it was Vermeer, we looked at the painting as a **discovery**. When we found out it was Van Meegeren, we looked at it as a **solution to a puzzle**. Those are two different aesthetic experiences. Goodman's point is that knowing the history isn't snobbery; it's part of learning how to see the painting correctly. If you can't tell the difference yet, that's a failure of your perception, not proof that there is no difference."

  **Summary:** Lessing is right that the *physical object* hasn't changed. But Goodman is right that the *aesthetic object* (the thing we actually experience) includes the history of its making. In autographic arts like painting, you cannot separate the "what" from the "how" and "who."
