  8.  **Self-Correction during drafting:** I initially thought about focusing heavily on the *Provincial Letters*. But this is the *Pensées*. Keep it focused on anthropology and epistemology. The key is the *incapacity* of reason. Also, ensure I don't solve the mystery for the author, but give them the tools to let the characters solve it.

  9.  **Final Review against constraints:**
      *   Did I walk through sentence by sentence? Yes.
