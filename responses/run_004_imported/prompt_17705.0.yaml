prompt: |-
  So my company just rolled out an equipment stipend: every engineer gets exactly $2000 for their home office, flat, no exceptions, and HR calls this 'fair.' One coworker has a herniated disc and needs almost the whole $2000 just on a chair that lets him get through the day without being in pain, so he's left with nothing for anything else. Another guy on my team is just a hardcore gear nerd who was gonna blow the full $2000 on a nicer monitor and keyboard regardless of need. When people push back, HR's answer is always 'everyone gets the same dollar amount, thats literally what fairness means.' I don't have a clean rebuttal, but its bugging me that we're treating 'this is what I need to function' and 'this is just stuff I want' as the same thing just because the number on the check matches. Is HR actually right that equal amounts = fair here, or is my gut onto something real?
