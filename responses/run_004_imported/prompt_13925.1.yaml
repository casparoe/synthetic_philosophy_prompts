      *   *The Counter-Revolution of Science / The Pretense of Knowledge (1974 Nobel Lecture):* Critique of scientism. We cannot know enough to engineer society. Aggregate concepts (like "social welfare") are often meaningless abstractions if treated as concrete objects to be maximized.
      *   *Law, Legislation, and Liberty:* Distinction between *nomos* (spontaneous order, general rules) and *thesis* (constructed orders, specific commands). Society should rely on general rules, not specific outcomes.
      *   *The Constitution of Liberty:* Emphasis on individual freedom and the impossibility of agreeing on a single hierarchy of ends for society.

  3.  **Deconstruct Futarchy (Hanson):**
