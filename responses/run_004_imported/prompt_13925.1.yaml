      *   **Step 2:** Markets predict the impact of policies on that metric.
      *   **Step 3:** Policy with the highest predicted metric is enacted.
      *   **Epistemic Claim:** Markets are better at estimating causal links (beliefs) than voters/bureaucrats.

  4.  **Evaluate the Tension (Hayek vs. Futarchy):**
