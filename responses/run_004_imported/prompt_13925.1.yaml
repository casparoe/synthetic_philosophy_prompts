          *   *Argument 2: The Pretense of Knowledge.* Quantifying values assumes we know what matters. Values are subjective and local.
          *   *Argument 3: Rule of Law vs. Specific Commands.* Futarchy creates a mechanism to optimize specific outcomes. Hayek prefers general rules of just conduct (*nomos*) that allow individuals to pursue their *own* ends.
      *   *Nuance/Counter-point:* Would Hayek accept *some* metrics? Maybe GDP as a rough heuristic? No, he'd likely warn against reifying it.
