      *   *The Allure (Why it looks like Hayek):* The market as a discovery procedure for *beliefs* (policy efficacy). This aligns with *The Use of Knowledge in Society*.
      *   *The Fatal Flaw (Why Hayek would reject it):* The definition of the welfare metric.
