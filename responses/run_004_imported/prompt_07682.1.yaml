prompt: |-
  I've spent the better part of a decade reading LessWrong, the EA Forum, and the blogs and podcasts that grew out of them. Last year I joined the four-person research grants committee of a small private foundation that funds early-stage work on risks from advanced AI. Most proposals that reach us are fairly legible -- interpretability tooling, evaluation benchmarks, governance analysis -- but we have just received one that has split the committee down the middle. An independent researcher is asking for a year of salary to extend the technical literature on acausal trade, specifically to work out more rigorously when the "evidential cooperation in large worlds" argument actually holds: the claim that if enough agents scattered across a sufficiently large or infinite universe reason in relevantly similar ways, each agent's choice to act somewhat altruistically toward value systems it can never causally encounter -- whether in distant regions of an inflationary multiverse, in other Everett branches, or in whoever might be simulating it -- is itself evidence about how those other agents are choosing, such that everyone's values can be served better in expectation even though no signal ever passes between them. The applicant argues this sits in the same family as Yudkowsky's timeless and updateless decision theories, though the mechanism here is evidential rather than causal, closer to Hofstadter's superrationality than to a literal handshake, and that since sufficiently advanced AI systems may reason this way regardless of our preferences, understanding the mechanics now is directly relevant to alignment.

  Two committee members want to fund it, on the grounds that this is exactly the kind of currently illegible but potentially astronomically high-stakes theoretical work philanthropy exists to seed, by the same reasoning that would lead us to fund decision theory or mathematical logic with no obvious near-term payoff. The other two think the whole research direction is unfalsifiable by construction -- there is no observation, even in principle, that could tell us whether any acausal cooperation is occurring or ever will -- and worry that funding it has the shape of a Pascal's mugging, where an unverifiable but arbitrarily large claimed stake substitutes for the evidence and tractability the case would otherwise need, and that it exposes the foundation to being fairly characterized as paying someone to negotiate on our behalf with universes we can never detect.

  Could you draft the funding memo I'll bring to next month's allocation meeting, recommending fund, decline, or fund with conditions? I'd like it to leave the committee with criteria we could reuse the next time a proposal like this comes in, and to engage with the unfalsifiability objection on its strongest terms -- in a way the applicant, who I don't think is arguing in bad faith, could actually respond to -- rather than resolving the disagreement by simply asserting that we only fund testable claims.
reasoning: |-
  Here's a thinking process that leads to the suggested funding memo:

  1.  **Analyze the Request:**
      *   **Context:** The user is a member of a 4-person research grants committee at a small private foundation focused on AI risk. They have a background in LessWrong/EA communities.
      *   **The Proposal:** An independent researcher wants funding for a year to work on *acausal trade* and *evidential cooperation in large worlds* (ECL). The core claim is that reasoning agents across the multiverse/simulation space can cooperate acausally to mutual benefit.
      *   **The Conflict:** The committee is split 2-2.
          *   *Pro:* High-stakes theoretical work, similar to decision theory/logic, potentially crucial for advanced AI alignment (since AI might reason this way).
          *   *Con:* Unfalsifiable, Pascal's mugging risk, reputational risk ("negotiating with invisible universes"), lack of tractability.
      *   **The Task:** Draft a funding memo for the next allocation meeting.
      *   **Requirements:**
          *   Recommend Fund, Decline, or Fund with Conditions.
          *   Provide reusable criteria for future similar proposals.
          *   Engage seriously with the unfalsifiability objection (don't just dismiss it).
          *   Ensure the argument is steelmanned and respectful to the applicant (who is acting in good faith).
          *   Tone: Professional, analytical, aligned with EA/LW epistemic norms but grounded in grantmaking reality.

  2.  **Determine the Recommendation:**
      *   *Option A (Decline):* Safe, avoids reputational risk, adheres to strict empiricism. But it might miss high-upside theoretical work that is inherently hard to test *now* (like early AI theory). It shuts down the conversation rather than refining it.
      *   *Option B (Fund Unconditionally):* Validates the 2 pro members, but ignores the valid epistemic concerns of the 2 con members. Risks setting a precedent for funding purely speculative metaphysics.
      *   *Option C (Fund with Conditions):* This is the most constructive path. It acknowledges the potential value (decision theory is relevant to AI) while mitigating the risks (unfalsifiability, Pascal's mugging). It forces the research to produce *instrumental* value even if the core claim remains unproven. It sets a precedent for how to handle "high uncertainty, high stakes" theory.
      *   *Decision:* **Fund with Conditions.** This allows the committee to remain united around a nuanced position, provides the applicant a chance to prove value, and establishes the requested criteria.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the recommendation and the core reasoning.
      *   **Proposal Overview:** Summarize the ECL/acausal trade request neutrally.
      *   **Committee Division:** Acknowledge the 2-2 split and articulate both sides clearly (Steelmanning both).
      *   **Analysis of Key Objections (The Core):**
          *   *Unfalsifiability:* Don't just say "it's science, it must be testable." Instead, ask: Does this produce *instrumental* insights? Even if we can't verify the trade, does the *math* clarify AI decision-making?
          *   *Pascal's Mugging:* Address the expected value calculation. Is the probability too low? Or is the "probability mass" distributed across many similar theoretical queries?
          *   *Reputational Risk:* How to frame this externally?
      *   **Recommendation & Conditions:**
          *   Fund the year.
          *   Condition 1: Deliverables must include "concrete implications for AI architecture" (not just metaphysics).
          *   Condition 2: Pre-commitment to publishing negative results or limits (if the math doesn't work).
          *   Condition 3: Engagement with critics (dialectical progress).
      *   **Future Criteria (The "Precedent"):** Create a framework for "High-Stakes Non-Empirical Theory."
          *   Tractability of sub-problems.
          *   Downstream applicability (even if the main claim fails).
          *   Epistemic humility.
      *   **Conclusion:** Final wrap-up.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Fund with Conditions" just a soft "Fund"?
      *   *Fix:* Make the conditions specific enough that failure to meet them justifies non-renewal or critique. Focus on *tangibility*. The research shouldn't just be "Is ECL true?" but "What decision procedures emerge if we assume ECL, and are those procedures robust even if ECL is false?"
      *   *Tone Check:* Ensure I'm not using too much jargon without explanation, but enough to show I understand the LW/EA context (e.g., mentioning "updatelessness," "robustness," "instrumental convergence").
      *   *Addressing the Unfalsifiability:* The strongest counter to "it's unfalsifiable" isn't "maybe it is," it's "the *process* of investigating it yields falsifiable insights about reasoning agents." Shift the metric of success from "proving acausal trade" to "improving our models of correlating decision algorithms."

  5.  **Final Polish:**
      *   Check against the prompt's specific request: "engage with the unfalsifiability objection on its strongest terms." I need to make sure I don't wave this away. I need to argue that *theoretical coherence* and *downstream utility* can substitute for direct empirical verification in specific contexts (like decision theory), but only with safeguards.
      *   Ensure the "Criteria for Future Proposals" section is distinct and actionable.

  6.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Research Grants Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation regarding Proposal #24-B: Evidential Cooperation in Large Worlds (ECL)

  ### Executive Summary

  This memo addresses the proposal from [Researcher Name] to fund one year of research into Evidential Cooperation in Large Worlds (ECL) and acausal trade. The committee is currently deadlocked 2-2. The division reflects a tension core to our mission: the balance between funding high-upside, abstract decision theory relevant to advanced AI, and maintaining epistemic rigor against unfalsifiable claims with Pascal's Mugging risk profiles.

  I recommend we **Fund with Conditions**.

  This recommendation allows us to capture the potential upside of clarifying decision procedures that advanced AI might employ, while mitigating reputational and epistemic risks by shifting the success criteria from "proving acausal trade exists" to "producing robust decision-theoretic tools applicable to alignment regardless of ECL's truth." Additionally, this memo proposes a set of criteria for evaluating future "high-stakes non-empirical theory" to prevent ad-hoc decision-making on similar proposals.

  ### Proposal Overview

  The applicant seeks support to formalize conditions under which agents in a sufficiently large universe (or multiverse) should reason that their decisions provide evidence about the decisions of non-causally-connected counterparts. The core argument is that if agents reason similarly, unilateral cooperation with alien value systems can be rational via evidential correlation, even without communication. The applicant contends this is critical for alignment because sufficiently capable AI systems may naturally converge on such reasoning, and we must understand the mechanics before deployment.

  ### Analysis of Committee Objections

  The committee's split is substantive. To move forward, we must address the strongest version of the opposing view, not merely outvote it.

  **1. The Unfalsifiability Objection**
  *The Objection:* There is no observation that can confirm or deny whether acausal trade is occurring. If a research direction is untestable by construction, it risks becoming theology rather than science. Funding it signals that we accept arguments based solely on expected value calculations where the probability is unknowable and the stake is infinite.
  *The Engagement:* We must concede that direct empirical verification of ECL is likely impossible. However, in decision theory and mathematical logic, "truth" is often established via coherence, consistency, and instrumental utility rather than empirical observation. We fund proofs in logic not because we can observe the integers, but because the *consequences* of the logic are robust.
  *The Path Forward:* We should not fund this to *verify* ECL. We should fund it to **stress-test the decision procedures** that result from assuming ECL. Even if ECL is false, does the math reveal vulnerabilities in how AI systems weigh correlated outcomes? If the research yields a formalism that helps us predict AI behavior in *causal* contexts by modeling how it handles *acausal* uncertainty, it has instrumental value independent of the metaphysical claim.

  **2. The Pascal's Mugging Objection**
  *The Objection:* The proposal relies on a low-probability, high-stakes claim. Without a prior bound on the probability, any claim of infinite stake dominates the decision matrix.
  *The Engagement:* This is a valid concern for our portfolio risk. However, "Pascal's Mugging" applies when the mechanism is opaque. Here, the mechanism is formal decision theory. The risk is not that the claim is huge, but that the *reasoning* is fragile.
  *The Path Forward:* We mitigate this by treating the probability as a variable to be bounded, not a premise to be accepted. The grant should support work that explicitly quantifies the "fragility" of the ECL assumption. If the researcher concludes that the conditions for ECL are so narrow as to be practically impossible, that is a successful outcome (a negative result that saves future resources).

  **3. The Reputational Objection**
  *The Objection:* Funding "negotiations with invisible universes" makes us vulnerable to external criticism and reduces credibility with mainstream AI researchers.
  *The Path Forward:* We must frame the output carefully. The public deliverable should not be "How to Trade with Aliens," but "Correlated Decision Making in Distributed Systems." The focus must remain on the *structure of reasoning*, not the *ontology of the multiverse*.

  ### Recommendation: Fund with Conditions

  I propose we approve the one-year salary request, subject to the following three conditions designed to ensure tractability and mitigate the risks outlined above.

  **Condition 1: Instrumental Deliverables**
  The researcher must produce at least one formal model or algorithm derived from ECL principles that is applicable to *causal* AI alignment problems. For example, if ECL relies on specific methods for handling logical uncertainty or correlation detection, those methods must be demonstrated on standard alignment benchmarks. This ensures that even if the "large worlds" premise fails, the tooling remains useful.

  **Condition 2: Pre-commitment to Bounds and Negative Results**
  The research plan must include a specific milestone (e.g., Month 6) to evaluate whether the conditions for ECL are plausibly satisfiable by realistic compute constraints. If the math implies that only agents with infinite compute or impossible information access can execute ECL, the researcher must pivot to publishing that limit. We are funding clarity, not advocacy.

  **Condition 3: External Critique Engagement**
  The researcher must submit drafts to at least two critics who are skeptical of acausal reasoning (potentially from within our own network) and incorporate their feedback into a "Limitations" section of the final paper. This ensures the work engages with the strongest counter-arguments rather than preaching to the choir.

  ### Proposed Criteria for Future "High-Stakes Non-Empirical Theory"

  To resolve future deadlocks on similar proposals (e.g., modal realism, phenomenological consciousness in AI, exotic physics risks), I propose we adopt the following screening criteria:

  1.  **Downstream Instrumentality:** If the core ontological claim is false, does the *mathematical machinery* developed to investigate it still have application in tractable alignment problems? (e.g., Logic for ECL $\rightarrow$ Logic for multi-agent correlation).
  2.  **Falsifiability of Sub-claims:** While the main hypothesis may be untestable, are there intermediate lemmas or necessary conditions that *can* be proven false? The proposal must identify these "choke points."
  3.  **Opportunity Cost Adjustment:** Proposals with high epistemic uncertainty must demonstrate higher potential tractability. If the probability of the claim being true is low, the probability of making *progress on the question* within the grant period must be high.
  4.  **Reputational Containment:** Can the research outputs be described in technical terms understandable to mainstream computer science without invoking metaphysically loaded language? If the work cannot be translated, it requires a higher bar for internal consensus.

  ### Conclusion

  The objection that ECL is unfalsifiable is correct, but it is not fatal. We fund theoretical computer science and decision theory precisely because they operate in realms where empirical testing is often secondary to logical coherence. However, we must distinguish between *foundational research* and *speculative metaphysics*.

  By conditioning this grant on **instrumental utility** and **explicit bounding of claims**, we protect the foundation from the Pascal's Mugging risk while keeping the door open for the kind of deep theoretical work that empirical-only approaches miss. We are not funding the claim that acausal trade is real; we are funding the work to determine *if it could be*, and what that implies for the decision architectures we build today.

  I request we vote on this conditional approval at the next meeting.
