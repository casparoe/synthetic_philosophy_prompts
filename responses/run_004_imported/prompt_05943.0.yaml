      *   Actually, the M-S theorem is slightly more subtle. It's about *ex-ante* efficiency. If we start at a Pareto optimal allocation (which common priors + rationality implies), no mutually beneficial trade exists.
      *   *Simpler Intuition:* The "Winner's Curse" on steroids. If everyone is rational, the only person willing to take the other side of your bet is someone who knows more than you. Therefore, taking the bet is a loser's game.

      *Let's structure the example around the "Winner's Curse" logic, as it's more visceral.*

      *   *Wait, one nuance:* The prompt asks about "Common Knowledge that a trade is being offered." This refers to the iterative updating. I need to make sure I explain *why* the updating doesn't stop until the spread vanishes.
