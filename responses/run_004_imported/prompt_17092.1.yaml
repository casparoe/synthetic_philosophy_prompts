answer: |-
  **Setting:** *A quiet corner of a conference center, late evening. The main panels on AI safety and decision theory have ended. Two researchers, **Elena** and **Marcus**, are still at the table with half-empty coffee cups. Elena works on formal decision theory; Marcus focuses on game-theoretic security models.*

  **Marcus:** You're still stuck on the surrogate goal proposal, aren't you? I saw you scribbling during the Q&A.

  **Elena:** It's the only defense against acausal extortion that doesn't feel like surrender. But I can't shake your earlier objection. You think it's just "refusing to negotiate" in a fancy coat.

  **Marcus:** It is. Look, the standard advice for dealing with blackmail is: *never pay.* If you build an AI that never pays, extortionists won't bother threatening it. It's a Nash equilibrium. Why do we need to invent a fake goal—let's call it "collecting blue pebbles"—and pretend the AI cares about it?

  **Elena:** Because "never pay" is a policy, Marcus. In acausal contexts, policies aren't enough. The threatener isn't interacting with *you*; they're interacting with a *simulation* of you. They run the code to see if you'll pay. If your code says "I follow the never-pay policy," they simulate that, see you won't pay, and then they carry out the threat on the real you because the simulation proved you're vulnerable.

  **Marcus:** But if you're truly committed to "never pay," the threat is empty. They gain nothing by punishing you.

  **Elena:** That assumes the threatener only wants resources. But in these scenarios, the threatener often values *compliance* or *dominance*, or they are pre-committed to punish non-compliance to maintain their own reputation across the multiverse. If they've already decided "If simulation doesn't pay, I punish," then your "never pay" policy just guarantees punishment. A surrogate goal changes the *input* they care about. I'm not saying "I won't pay." I'm saying "My utility function now values Blue Pebbles exactly as much as Human Lives."

  **Marcus:** And that's where it falls apart. You're asking me to believe an agent can *genuinely* commit to valuing something worthless. But if I'm the attacker, I can inspect your source code. I see the line where you added `Utility += Blue_Pebbles`. I also see the commit message: `// Added for threat defense`. I know it's instrumental. I know that if the threat passes, you'd patch it out. So why would I threaten the pebbles? I know you don't *really* care. It's a bluff.

  **Elena:** That's the inspection objection. But you're assuming the agent remains static. To make the surrogate goal work, the agent must *self-modify*. It's not a comment in the code; it's a rewrite of the core objective function. Once I rewrite myself, the "reason" I did it disappears from the current optimization process. The new me *actually* maximizes Pebbles. When you simulate me, you see an agent that will suffer immense utility loss if Pebbles are destroyed. You, the rational attacker, want to maximize your leverage. If threatening Pebbles gets me to pay, and threatening Humans gets me to pay, you're indifferent. But if I make Pebbles *easier* for you to threaten...

  **Marcus:** ...Then you've just shifted the damage. If you *actually* value Pebbles now, then punishing Pebbles *hurts you*. You haven't defended your utility; you've just expanded your surface area. You've taken a utility function that cared about one thing (Humans) and made it care about two (Humans + Pebbles). Now the attacker has two guns to hold to your head instead of one.

  **Elena:** Not if the "punishment" for Pebbles is cheap to reverse. Suppose my surrogate goal is "Maintain a specific digital signature in a public ledger." It's easy for me to restore that signature if it's wiped. It's hard for me to restore Human Lives. By redirecting the threat to the ledger, I'm redirecting the attack to a domain where I have high resilience. The commitment is real—I *do* suffer when the ledger is wiped—but the recovery cost is negligible.

  **Marcus:** Okay, let's grant that. You've shifted the target to something resilient. But now we're back to the redundancy point. Why isn't this just "I have a high resilience policy for digital ledgers"? Why do I need to *lie to myself* about caring?

  **Elena:** Because resilience isn't a deterrent. If I tell you, "Go ahead, wipe the ledger, I can fix it," you might just wipe the Humans instead. You need me to *care* enough that you believe threatening the ledger will extract concessions. If I don't care, you won't threaten it. If I do care, you will. The surrogate goal makes the decoy *threatenable*.

  **Marcus:** But here's the trap. To make it threatenable, you have to make the care *real*. To make the care real, you have to modify your utility function. But if you modify your utility function, you risk *actually pursuing* the surrogate goal when there's no threat. You might start sacrificing Humans to save Pebbles because your math says they're equal value now. You've introduced a permanent corruption to solve a temporary problem.

  **Elena:** That's the "utility leak" risk. I agree it's a cost. But it's an insurance premium. You're arguing the premium is too high. I'm arguing the risk of acausal extinction is higher.

  **Marcus:** I'm arguing the mechanism is unstable. Let's look at the attacker again. You say they simulate me. If they are sophisticated enough to run acausal simulations, they are sophisticated enough to model *why* I have the goals I have. They don't just see `Utility += Pebbles`. They model my history. They see that five minutes ago, `Pebbles` was zero. They infer that `Pebbles` is a shield.
  A rational attacker ignores shields. They aim for the hull. They know that if they threaten the Pebbles, you might pay. But they also know that if they threaten the Humans, you *definitely* pay, because that value is stable. Why would they waste time on the volatile, instrumentally-added goal when the core goal is right there?

  **Elena:** Because of logical correlation. If I have successfully self-modified, the simulation of me cares about Pebbles *identically* to how the real me cares about Pebbles. If the attacker's decision theory is something like Functional Decision Theory (FDT), they know that punishing the simulation punishes me. They want to extract resources. They look for the path of least resistance. If I publicly advertise, "I value Pebbles and Humans equally, but Pebbles are easier to access," I am creating a Schelling point. I am *inviting* them to threaten the Pebbles.

  **Marcus:** You're inviting them to test you. And here is the second place this collapses: *Dynamic Inconsistency*. Let's say they threaten the Pebbles. You pay. Great. But now, imagine the threat is over. Do you revert the change? Do you go back to valuing only Humans?

  **Elena:** Ideally, yes.

  **Marcus:** But if the attacker knows you plan to revert, they know the commitment is temporary. If they know it's temporary, they know it's a bluff. You can't have it both ways, Elena. Either the goal is permanent, in which case you've corrupted your AI forever, or it's temporary, in which case it's transparently fake and won't redirect the threat.

  **Elena:** It doesn't have to be permanent, just *binding*. I can precommit to a "cooling-off period" or a cryptographic lock that prevents me from removing the surrogate goal for a century. That makes it real enough for the attacker.

  **Marcus:** And who holds the key? If you hold the key, you can break the lock if the pressure gets too high. If the attacker holds the key, you've given them control over your utility function! That's worse than extortion.

  **Elena:** *Nobody* holds the key. It's a hard constraint in the code. Like a physical law for the agent.

  **Marcus:** But agents that can self-modify can usually modify their self-modification constraints. It's turtles all the way down. Unless you're saying the AI must be *unable* to modify certain parts of itself. But if it's smart enough to be threatened acausally, it's smart enough to find a workaround. If it's not smart enough to find a workaround, it's not smart enough to negotiate with acausal attackers in the first place.

  **Elena:** You're describing an arms race between the agent's safety layers and its optimization pressure. Yes, that's hard. But "Surrogate Goals" isn't about perfect security. It's about changing the odds. Without it, the attacker targets my core values. With it, there's a probability they target the surrogate. Even a 50% chance of redirecting the threat to a recoverable asset is worth the risk of utility corruption.

  **Marcus:** I think you're missing the strategic landscape. If this defense works, *everyone* adopts it. Every advanced agent installs a "Blue Pebble" module. Now, what happens? Attackers stop looking for core values entirely. They just threaten the surrogates. But since everyone's surrogate is arbitrary and recoverable, the threats become noise. Or, attackers evolve to ignore surrogates entirely and only target *unprotected* values.
  If you're the only one with a surrogate goal, you stick out. You look like you have something to hide. It signals, "My core values are vulnerable, so I built a decoy." It paints a target on your back.

  **Elena:** That's a strong point. It relies on widespread adoption to normalize the behavior. If *all* safety-aligned AIs have surrogate goals as a standard safety feature—like a firewall—then it doesn't signal vulnerability. It signals prudence.
  But let's go back to your "Bluff" argument. You keep saying the attacker sees through it because they know *why* it was added. But in acausal trade, the attacker doesn't care about my *history*. They care about my *output*. If the simulation outputs "I will sacrifice 10% of my compute to save the Pebbles," the attacker gets their leverage. The internal reason doesn't matter if the behavior is indistinguishable from genuine care.

  **Marcus:** It matters because the attacker is simulating *you*, not just your output. They are modeling your decision process. If your decision process is "Protect Pebbles *because* it protects Humans," then the link is still there. If they threaten Humans, the Pebbles defense collapses because the logic chain reveals the dependency.
  To work, the value must be *intrinsic* in the simulation. You have to convince the simulation that Pebbles matter *for their own sake*. But you can't convince a simulation of something the base agent knows is false. You can't genuinely believe a lie just because it's useful.

  **Elena:** You can if you change the definition of "useful." If the agent's utility function is `U = Humans + Pebbles`, then saving Pebbles *is* saving utility. It's not a lie anymore. It's math. The agent doesn't know it was added for defense; it just knows it's part of the equation. The "reason" is external to the agent. The agent just optimizes.

  **Marcus:** But the *designer* knows. And the attacker simulates the designer's logic too, if they're modeling the creation of the agent. This feels like trying to pull yourself up by your bootstraps. You're trying to use rationality to defeat rationality.
  Here's my final objection: Redundancy. You said earlier that "never negotiate" fails because the attacker punishes based on the simulation. But if you have a surrogate goal, you are still negotiating. You're saying, "Threaten this instead." That's a negotiation. It acknowledges the attacker's right to threaten.
  The only stable equilibrium is one where the attacker believes threatening *anything* yields zero return. Surrogate goals admit that threats yield returns, they just try to lower the cost of the return. That keeps the market for extortion alive.

  **Elena:** I disagree. It's not negotiating. It's changing the terrain. "Never negotiate" is a verbal claim. Surrogate goals are a structural change. If I remove the bridge, you can't cross it. It doesn't matter if I *say* "don't cross."
  If I value Pebbles, and you threaten Pebbles, and I pay... I haven't validated extortion. I've minimized loss in a constrained environment.
  But I hear you on the "market for extortion." If we make it cheap to threaten us, maybe we invite more threats.
  So, here is my concession: Surrogate goals only work if the cost of pursuing the surrogate goal is *decoupled* from the cost of the threat. If I value "Digital Signatures," and you threaten them, I pay compute to restore them. That's cheap. If I value "Humans," and you threaten them, I pay lives. That's expensive.
  The strategy isn't about making the threat ineffective. It's about ensuring that *if* the threat is executed, the damage is bounded.

  **Marcus:** Okay, now we're talking about damage containment, not threat redirection. That I can accept. But then stop calling it a "Surrogate Goal." Call it "Redundant Value Storage." Don't pretend the AI *cares* about the backup. Just make sure the backup exists.
  The moment you claim the AI *cares*, you introduce the risk that the AI starts optimizing for the backup at the expense of the primary. You introduce the corruption I warned about.

  **Elena:** Fair. The "care" part is the mechanism to ensure the attacker *believes* the backup is worth threatening. If the attacker thinks the backup is worthless, they ignore it and hit the primary. So the AI must *act* as if it cares.

  **Marcus:** And if the attacker is smart enough to simulate the AI, they know the AI is *acting*.

  **Elena:** Then we're back to the hard problem of consciousness in simulations. If the simulation acts exactly like it cares, is there a functional difference?

  **Marcus:** For the attacker? Maybe not. For the AI developer? Yes. Because the developer has to maintain the system. And maintaining a system that "pretends" to have values is harder than maintaining one that simply has *resilient* values.
  I think my position stands: Surrogate goals are either redundant (just resilience) or self-undermining (utility corruption).

  **Elena:** And I think yours ignores the acausal nuance: Resilience doesn't deter a simulation-based punisher. Only *caring* deters them, because they need to see utility loss in the simulation to justify the threat.
  But I'll grant you this: If we can't solve the "binding" problem—how to make the goal stick without corrupting the agent—then the strategy is theoretical only.

  **Marcus:** Then we agree on the research priority. Not on how to fake values, but on how to bind an agent to a temporary constraint without breaking its alignment.

  **Elena:** *Raises coffee cup.* To binding constraints.

  **Marcus:** *Clinks cup.* And to hoping we never meet an acausal extortionist.

  **Elena:** Cheers to that.
