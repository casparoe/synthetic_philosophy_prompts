prompt: |-
  So this is a weirdly specific thing that happened to me, but bear with me. Back in September I made a bet with my younger sister to force myself to finish revising a dissertation chapter: I told her I'd Venmo her $600 if I hadn't sent my advisor the new draft by a certain Friday, and to make it "count" she made me say out loud, on a recorded voice memo, that I intended to pay up if I flaked. She's about to finish her own philosophy PhD and nearly fell over laughing, said I'd basically reinvented Kavka's toxin puzzle for myself, except with Venmo instead of a mind-reading billionaire.

  Turns out her whole dissertation is built around that exact puzzle and its relatives, so I went down a rabbit hole and read enough to follow along. She defends what she calls "resolute choice": the view that you genuinely can, and rationally should, form an intention to do the costly thing that'll be totally pointless by the time you'd have to actually do it (drink the toxin, actually pay up once hiding is an option), and that this is a real third mode of practical rationality alongside the standard "sophisticated" and "naive" responses, not just a fancy label for willpower. Her go-to move whenever someone corners her on this at a party is "that's not irrational, that's just what it takes to be the kind of person your future self, and other people, can actually trust" -- and then she changes the subject, which worked fine on me for years because I had no idea what she was talking about.

  Well, now I know what shes talking about, and I run a tiny philosophy podcast (like 200 listeners, recorded out of my closet) and I've finally talked her into coming on properly instead of just ranting at me over Thanksgiving. I don't want to hand her questions she can answer with the rehearsed version -- I want to actually push on the view. Could you draft me 8-10 interview questions, each with a short follow-up keyed to whatever answer she's most likely to give? I definitely want one that presses on whether "resolute choice" is doing any real work beyond Bratman's idea that stable intentions are just good policy for a planning agent (i.e. is she smuggling in the same answer under a fancier name), one that forces her to either bite or dodge the bullet on the nuclear-deterrence version of the puzzle (a country that's already been attacked gains nothing from actually retaliating -- does a resolute chooser launch anyway, since that's what made the deterrent credible in the first place?), and one that makes her diagnose my actual bet on the spot -- whether the recorded voice memo means I never really tested the puzzle at all, since I'd built in an external enforcement mechanism. End the list with a question about what would actually count as evidence that she's wrong and the sophisticated-choice people had it right all along.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** The user made a bet with their sister (a philosophy PhD candidate) based on Kavka's Toxin Puzzle. The sister defends "resolute choice" (McClennen/Gauthier style, likely) against "sophisticated choice" (standard decision theory).
      *   **Task:** Draft 8-10 interview questions for a philosophy podcast.
      *   **Requirements:**
          *   Each question needs a short follow-up keyed to her likely answer.
          *   Specific topics to cover:
              1.  Resolute Choice vs. Bratman's Planning Theory (is it just stable intentions?).
              2.  The Nuclear Deterrence/Bullet-Biting case (retaliation after attack).
              3.  Diagnosis of the user's specific bet (voice memo = external enforcement?).
              4.  Falsification conditions (what evidence would prove her wrong?).
          *   Tone: Engaging, pushing back, not handing her easy rehearsed answers.
          *   Audience: Small podcast (200 listeners), likely interested but not necessarily experts.

  2.  **Deconstruct the Philosophy:**
      *   **Kavka's Toxin Puzzle:** An eccentric billionaire offers $1M if you *intend* at midnight to drink a toxin tomorrow noon that makes you sick for a day. You get the money if you form the intention, regardless of whether you drink. But once you have the money, why drink? Standard decision theory (Sophisticated Choice) says you can't intend to do what you know you won't do.
      *   **Resolute Choice (McClennen/Gauthier):** You can bind your future self by reasoning at the earlier time. You stick to the plan *because* you made the plan, even if the immediate utility calculation changes. It's about being a certain kind of agent.
      *   **Sophisticated Choice:** You anticipate your future self's preferences. If future you won't drink, present you knows you can't intend to drink, so you don't get the money.
      *   **Bratman's Planning Theory:** Intentions are plan-states that resist reconsideration to facilitate coordination and stability. Is Resolute Choice just Bratman with extra steps?
      *   **Nuclear Deterrence:** Similar structure. Intend to retaliate to prevent attack. If attack happens, retaliation is costly and pointless. Do you retaliate?
      *   **User's Bet:** $600 if draft not sent. Voice memo recorded. Sister says this is Toxin Puzzle. User suspects voice memo acts as external enforcement (reputation cost/shame), changing the payoff structure.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Goal 1: Resolute Choice vs. Bratman.*
          *   Draft: Is this just Bratman?
          *   Refinement: Need to make it sharper. Bratman says intentions are resistant to reconsideration for *instrumental* reasons (planning agency). Resolute choice says you do it *because* it's rational to be resolute.
          *   Follow-up: If she says "Yes, it's Bratman," ask why call it a distinct mode of rationality. If "No," ask where the normativity comes from.

      *   *Goal 2: Nuclear Deterrence.*
          *   Draft: Would you nuke back if attacked?
          *   Refinement: Frame it as the "Monday Morning" problem. The attack happened. Deterrence failed. Why pull the trigger?
          *   Follow-up: If she says "Yes," call it monstrous/irrational. If "No," ask how deterrence was credible.

      *   *Goal 3: The User's Bet (Voice Memo).*
          *   Draft: Did the voice memo ruin the puzzle?
          *   Refinement: The voice memo creates a social/reputational cost. Kavka's puzzle requires the act to be *purely* costly with no side benefits. Does the memo turn it into a standard prudential calculation?
          *   Follow-up: If she says "No," ask about the magnitude of the shame vs. the $600.

      *   *Goal 4: Falsification.*
          *   Draft: How do we know you're wrong?
          *   Refinement: What empirical or theoretical outcome would make you concede to the Sophisticated Chooser?
          *   Follow-up: Push on whether "it works for me" is a valid defense.

      *   *Filling the gaps (need 8-10 questions).*
          *   Need an intro question to set the stage without letting her monologue.
          *   Need a question on the "Trust" argument (her party line).
          *   Need a question on the psychology vs. rationality distinction.
          *   Need a question on the "Self-Binding" aspect (Ulysses contract).
          *   Need a question on the definition of "Intention."

  4.  **Developing the Questions & Follow-ups (incorporating the constraints):**

      *   *Q1 (Intro/Setup):* Focus on the definition. Don't let her define it broadly.
      *   *Q2 (The Trust Argument):* Attack the "trust" justification. Is that moral or rational?
      *   *Q3 (Bratman):* The specific request about Planning Theory.
      *   *Q4 (Psychology vs. Rationality):* Is this just willpower?
      *   *Q5 (Nuclear Deterrence):* The specific request about biting the bullet.
      *   *Q6 (The User's Bet):* The specific request about the voice memo/enforcement.
      *   *Q7 (Intention Definition):* Can you intend what you know you won't do?
      *   *Q8 (Temporal Neutrality):* Why privilege the past self's decision?
      *   *Q9 (Falsification):* The specific request about evidence.
      *   *Q10 (Closing/Practical):* What does this mean for normal people?

  5.  **Refining Follow-ups:**
      *   Make sure they trap her. If she gives Answer A, push X. If Answer B, push Y.
      *   Ensure the tone is respectful but probing (podcast host style).

  6.  **Review against Constraints:**
      *   8-10 questions? Yes.
      *   Short follow-ups keyed to likely answers? Yes.
      *   Bratman question included? Yes.
      *   Nuclear question included? Yes.
      *   User's Bet question included? Yes.
      *   Falsification question included? Yes.
      *   Tone check: Needs to sound like a brother who did the reading but isn't afraid to poke holes.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the Bratman distinction is clear. Bratman is about *stability* for agency. Resolute Choice is about *rationality* of compliance.
      *   *Correction:* On the bet, ensure the distinction is between "internal rationality" and "external enforcement."
      *   *Correction:* Ensure the Nuclear question forces the "irrational action" dilemma.

  8.  **Final Output Generation** (Proceed to generate the response based on these thoughts).
answer: |-
  Here are 10 interview questions designed to push past the rehearsed "party version" of her view, complete with follow-ups keyed to the answers she's most likely to give.

  **1. The "Trust" Defense**
  "You tell people at parties that resolute choice isn't irrational, it's just what it takes to be a person others can trust. But trust seems like a moral or social virtue, whereas the Toxin Puzzle is supposed to be about *instrumental rationality*—getting the money. Are you secretly smuggling morality into decision theory, or is being 'trustworthy' actually a payoff in the utility function?"
  *   **Follow-up:** If she says it's a payoff: "Then it's not the Toxin Puzzle anymore, because drinking the toxin *does* have a benefit (maintaining trust). If she says it's not a payoff: "Then why should a purely rational agent care about being the kind of person who keeps pointless promises?"

  **2. The Bratman Objection**
  "Michael Bratman argues that stable intentions are good policy for a 'planning agent' simply because reconsidering everything all the time is inefficient. Is your 'resolute choice' actually distinct from Bratman's view, or is it just his planning theory with a fancier name? Where is the line between 'it's efficient to stick to plans' and 'it's rational to do things that no longer benefit you'?"
  *   **Follow-up:** If she says they're the same: "Then why defend it as a third mode of rationality rather than just standard planning theory?" If she says they're different: "Bratman avoids the irrationality charge by appealing to efficiency. What normative work is 'resolution' doing that 'efficiency' isn't?"

  **3. The Psychology vs. Rationality Distinction**
  "When I read about this, it sounds a lot like 'willpower.' Is resolute choice just a philosophical description of grit? If a sophisticated chooser lacks the willpower to drink the toxin, is that a cognitive failure or just a weakness of will?"
  *   **Follow-up:** If she says it's cognitive: "Can you train someone to be resolute, or are they just born with a different utility function?" If she says it's willpower: "Then this isn't a puzzle about decision theory, it's a puzzle about psychology, and standard rational choice theory is off the hook."

  **4. The Nuclear Deterrence Bullet**
  "Let's scale this up. A country adopts a resolute policy of nuclear retaliation to deter an attack. The attack happens anyway. Deterrence has failed. A sophisticated chooser says 'don't retaliate, it's pointless destruction.' Does a resolute chooser actually launch the nukes? Do you have to bite the bullet that mass retaliation is the *rational* move in that specific moment?"
  *   **Follow-up:** If she says "Yes, launch": "That seems monstrous. Are you willing to say rationality requires moral atrocity?" If she says "No, don't launch": "Then the policy wasn't credible to begin with, and the sophisticated chooser was right: you can't bind a future self to a suicidal act."

  **5. Diagnosing My Bet (The Voice Memo)**
  "Regarding my dissertation bet: I recorded a voice memo saying I'd pay if I failed. You called this the Toxin Puzzle. But doesn't that recording act as an external enforcement mechanism? Now paying you isn't 'pointless'—it avoids the shame of my own recorded voice calling me a liar. Did I actually test resolute choice, or did I just turn it into a standard prudential calculation?"
  *   **Follow-up:** If she says it's still resolute: "If I Venmo'd you anonymously with no one knowing, would you still say I was being resolute? Or does the social cost prove the sophisticated chooser right?" If she admits it changed the puzzle: "Then your dissertation example doesn't apply to real life, because we almost always have social enforcement."

  **6. The Definition of Intention**
  "Kavka's original puzzle hinges on the idea that you can't intend to do what you know you won't do. You argue you *can*. Are you redefining the word 'intention'? If I say 'I intend to drink' but I also know 'I will not drink,' aren't I just lying to myself, not forming a rational intention?"
  *   **Follow-up:** If she says it's a different kind of intention: "How do I distinguish that from self-deception in the moment?" If she says it's standard intention: "Then how do you overcome the knowledge that the act is sub-optimal at T2?"

  **7. Temporal Neutrality**
  "Standard rationality assumes temporal neutrality—my future self's pain matters just as much as my present self's gain. Resolute choice seems to privilege the *past* self's decision over the *present* self's reality. Why does the version of me from last Friday have authority over the version of me holding the toxin glass today?"
  *   **Follow-up:** If she says "Because he had the better information": "But in the Toxin Puzzle, he had all the information. He just had less temptation." If she says "Because agency requires continuity": "Why? Why isn't agency just a series of momentary optimal choices?"

  **8. The "Self-Binding" Loophole**
  "If resolute choice works, why would a resolute chooser ever use a Ulysses contract? If I can just *resolve* to not check social media, why do I need an app that blocks it? Does admitting that we need external locks prove that internal resolution is insufficient for rationality?"
  *   **Follow-up:** If she says "Locks are for weak resolvers": "Then resolute choice isn't a general theory of rationality, it's an elite skill." If she says "Locks are redundant": "Then why does everyone, including you, use commitment devices?"

  **9. The Falsification Condition**
  "I want to pin you down on this: What would count as evidence that you are wrong? Is there a scenario where the sophisticated chooser wins, the resolute chooser loses, and you would concede that 'resolution' was actually irrational? Or is this view unfalsifiable?"
  *   **Follow-up:** If she gives a theoretical condition: "Has that condition ever obtained in a real case?" If she says it's unfalsifiable: "Then aren't we just talking about a faith commitment to a certain self-image, not a philosophical argument?"

  **10. The Practical Upshot**
  "Finally, for my 200 listeners who aren't philosophers: If they accept your view, what do they actually *do* differently on Monday morning? Does believing in resolute choice make people happier, richer, or more successful, or does it just make them feel better about doing stubborn things?"
  *   **Follow-up:** If she says "More successful": "Do you have data, or is that a hypothesis?" If she says "Feel better": "Then we're back to psychology. Is the 'rationality' of resolute choice just a comforting story we tell ourselves?"
