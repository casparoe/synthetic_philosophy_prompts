  "If it works, it works."

  "That's why we didn't last. You wanted a belief that paid dividends. I wanted one that would survive the end of inquiry."

  "That's a high bar for a Tuesday."

  "It's the only bar that matters. Honestly, it's why I finally understood why Peirce renamed his philosophy 'Pragmaticism.'"

