answer: |-
  **Title:** The Logic of Failure: Why Formal Verisimilitude Must Be Abandoned to Save Scientific Realism

  **Introduction**

  The central anxiety of the scientific realist is the specter of the graveyard of theories. History shows us a succession of empirically successful frameworks—Newtonian mechanics, phlogiston chemistry, the caloric theory of heat—that were subsequently discarded as false. If realism is to be more than a faith heuristic, it must explain how science progresses through error. It must make sense of the intuition that Einsteinian physics is *closer to the truth* than Newtonian physics, even if both are, strictly speaking, false descriptions of the universe. Karl Popper recognized this as the fatal vulnerability of falsificationism and introduced the concept of *verisimilitude* (truthlikeness) to plug the hole. His aim was to provide a logical metric for cognitive progress that did not rely on the attainment of absolute truth.

  However, the technical apparatus Popper built to support this intuition has collapsed under the weight of formal scrutiny. The 1974 proofs by Pavel Tichý and David Miller demonstrated that Popper's definition renders comparisons between false theories impossible. Subsequent attempts to rebuild verisimilitude on similarity-theoretic foundations (notably by Ilkka Niiniluoto and Graham Oddie) have arguably traded this logical impossibility for a problem of language dependence that is equally debilitating. This essay argues that the realist must accept a hard verdict: the project of cashing out "approximate truth" in formal, logical terms is untenable. The Tichý/Miller result and the language dependence objection are not technical hiccups to be engineered away; they reveal a category error in treating theories as sets of sentences subject to logical inclusion. To save scientific realism, one must abandon the search for a formal metric of verisimilitude and ground the notion of progress instead in ontological continuity and structural retention. We can keep the realist's claim that later theories are approximately true, but we must cease trying to measure that approximation with a logical ruler.

  **The Collapse of the Content Account**

  Popper's definition of verisimilitude was elegant in its simplicity, relying on the distinction between a theory's *truth-content* (the set of its true consequences) and its *falsity-content* (the set of its false consequences). Popper proposed that theory $A$ has more verisimilitude than theory $B$ if and only if:
  1. The truth-content of $A$ exceeds that of $B$, and the falsity-content of $A$ does not exceed that of $B$; or
  2. The falsity-content of $B$ exceeds that of $A$, and the truth-content of $B$ does not exceed that of $A$.

  This was designed to allow a false theory to rank higher than another false theory, provided it yielded more true consequences without generating additional false ones. This was the mechanism by which Einstein could surpass Newton without Einstein needing to be "True" in the capital-T sense.

  The devastation wrought by Tichý and Miller lies in the logical relationships between content and truth values. They showed that if a theory $A$ is false, it entails at least one false statement. If we attempt to increase the truth-content of $A$ (to make it more verisimilar), we inevitably expand the set of logical consequences. In a classical logical framework, adding consequences to a false theory inevitably adds false consequences as well. Specifically, Tichý demonstrated that for any two false theories, the conditions Popper set out cannot be satisfied. If $A$ and $B$ are both false, $A$ cannot have more truth-content than $B$ without also having more falsity-content.

  The implication is stark: Popper's ordering only yields a verdict when at least one of the theories is *true*. But if we already knew one theory was true, we would not need a measure of verisimilitude to compare it to a false rival. The apparatus was built to compare falsehoods, yet it functions only when truth is already present. This is not a minor limitation; it is a total functional failure. It implies that within Popper's logicist framework, all false theories are incomparable regarding their closeness to the truth. Falsificationism, stripped of verisimilitude, returns to the view that theory change is merely a replacement of one error by another, with no guarantee of cognitive convergence.

  **The Similarity Turn and the Trap of Language Dependence**

  Recognizing this collapse, subsequent realists shifted the ground from logical content to semantic similarity. Niiniluoto and Oddie proposed defining verisimilitude in terms of the "distance" between the models of a theory and the actual state of the world (often conceptualized via possible worlds). On this view, a theory is more verisimilar if its description of the world resembles the actual world more closely than its rival does, typically measured by the number of shared properties or the metric distance in a state-space.

  This approach intuitively captures what Popper missed: Newton's laws are "close" to Einstein's in terms of output under certain conditions, suggesting a similarity in structure even if the ontological commitments differ. However, this solution relocates the difficulty rather than resolving it. The fatal objection here is the problem of language dependence, forcefully articulated by David Miller.

  Miller showed that measures of similarity are not invariant under logical translation. If we describe a physical state using a set of basic predicates (e.g., "hot," "rainy," "windy"), we can calculate a distance between a theory's claim and the truth. However, if we define new predicates via Boolean combinations of the old ones (e.g., "minnesotan" = hot and rainy OR cold and not rainy), the logical structure of the description changes. Miller demonstrated that a theory ranked as closer to the truth in one linguistic framework can be ranked as further from the truth in an equally valid, logically equivalent framework.

  Defenders of similarity accounts have attempted to mitigate this by appealing to "natural kinds" or privileged predicates—arguing that not all vocabularies are created equal, and we should measure similarity only against predicates that carve nature at its joints. But this move is philosophically costly. It essentially begs the question: to know which predicates are "natural," we already need to know what the truth is. If we need to know the truth to define the metric that tells us which theory is closest to the truth, the metric is heuristic at best and circular at worst. It renders verisimilitude dependent on a metaphysical assumption (that we have access to the correct ontology) that the concept was supposed to help us justify epistemically.

  **The Verdict: Abandon the Formal, Save the Realist**

  Faced with the Tichý/Miller proof and the language dependence objection, the philosopher of science is left with a choice. One can continue to tinker with the formal definitions, adding complexity to block the counterexamples, or one can accept that the failures are symptomatic of a deeper misconception. I argue for the latter. The realist must give up on cashing out "approximate truth" in formal terms.

  The root error of the verisimilitude program is the assumption that theories are primarily sets of sentences whose logical relations determine their epistemic value. This is a legacy of logical empiricism that even Popper could not fully escape. But scientific progress is not a matter of accumulating true sentences or minimizing false ones in a logical set. It is a matter of capturing causal structures and ontological commitments that allow for successful intervention and prediction.

  When we say Einstein is "closer to the truth" than Newton, we are not making a claim about the subset relations of their logical consequences. We are making a claim about *structural continuity*. We mean that the mathematical structure of Newtonian mechanics is a limiting case of the mathematical structure of General Relativity. We mean that the referents of Newton's terms (mass, force) were not empty, even if the descriptions were inaccurate. This suggests that the "approximate truth" of a theory is not a property measurable by a logical metric, but a historical and ontological relation of *retention*.

  Therefore, my verdict is that the formal project of verisimilitude should be retired. It cannot be fixed without importing assumptions that render it redundant. However, this does not require the retreat to the instrumentalism your advisor suggests. Laudan-style problem-solving effectiveness is indeed a safe harbor, but it is too modest. It explains why we *use* theories, but not why science seems to *converge*.

  Instead, the realist should ground progress in **Structural Realism** or **Entity Realism**. On this view, progress is evidenced not by a formal increase in truth-content, but by the preservation of mathematical structure and the successful reference to unobservable entities across theory change. When Newtonian mechanics was superseded, the equations didn't vanish; they were subsumed. When the caloric theory was rejected, the phenomena of heat transfer remained explained by a new ontology (kinetic energy) that preserved the structural relations of the old model.

  This approach bypasses the Tichý/Miller problem because it does not rely on comparing the truth-values of logical consequences. It bypasses the language dependence problem because structural relations (mathematical mappings) are invariant under linguistic redescription in a way that predicate-based similarity is not. A differential equation retains its structural properties regardless of whether we label the variables in English, German, or "grue"-ified logic.

  **Conclusion**

  The intuition that drives scientific realism—that science gets the world right, at least approximately—is robust. But the attempt to formalize this intuition into a logical metric of verisimilitude has failed. The Tichý/Miller result proves that Popper's content-based account is logically incoherent for the only cases that matter (comparing false theories). The similarity-based successors fail because they cannot secure a language-invariant standard of measurement without presupposing the truth they seek to approximate.

  Consequently, the dissertation chapter should not attempt to rescue the formal definition of verisimilitude. To do so would be to build on a foundation that has been proven to shift under the slightest logical pressure. Instead, the argument should pivot. Acknowledge the death of formal verisimilitude, but argue that this does not entail the death of approximate truth. By shifting the ground from *logical content* to *ontological structure*, the realist can maintain that later theories are closer to the truth without needing a formal calculus to prove it. We know Einstein is closer to the truth than Newton not because we have measured their logical distance from reality, but because we can show exactly how Newton's world is contained within Einstein's. That is a metaphysical insight, not a logical proof, and it is sufficient to sustain a robust scientific realism without the baggage of a broken formalism.
