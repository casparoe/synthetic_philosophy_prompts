  6.  **Addressing the "Reliabilist" Concern:**
      *   Nyāya is not pure process reliabilism. It requires the *right kind* of causal process. A lucky guess is true but not *pramā*. An LLM output is like a lucky guess (ontologically speaking, regarding truth-tracking) because the causal link to the fact is broken (no perception/inference in the speaker).
      *   So, asking if it's *śabda* isn't Western bias; it's a valid category check. But assuming "reliability = *pramāṇa*" *is* the bias. Nyāya requires "reliability + correct ontological grounding."

  7.  **Synthesizing the Response:**
