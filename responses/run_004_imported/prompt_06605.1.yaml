      *   *Option A (No Pramā):* This is the strict orthodoxy. If the causal chain lacks a conscious agent with veridical cognition, it's not *śabda*. The resulting cognition in the hearer might be true (*yathārtha*), but is it *pramā*? Nyāya requires a valid *karaṇa* (instrument). If the instrument is defective (not *āpta*), the cognition is *apramā* (even if coincidentally true, like a lucky guess).
