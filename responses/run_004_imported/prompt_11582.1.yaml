answer: |-
  **MEMORANDUM**

  **TO:** State Discount Rate Policy Panel
  **FROM:** [Your Name], Public Member
  **DATE:** October 24, 2024
  **SUBJECT:** Recommendation on Methodology for Long-Horizon Project Discounting

  ### 1. Executive Summary

  This memo proposes a formal methodology for calculating discount rates on state capital projects with horizons exceeding 50 years. Prompted by the proposed River City Storm-Surge Barrier, we face a choice between a rate that renders long-term resilience economically invisible (≈7%) and one that risks imposing unbounded fiscal obligations on the present (≈0%).

  I recommend the Panel adopt a **Declining Discount Rate (DDR) schedule** derived from a modified Ramsey growth model. This approach separates the **Pure Time Preference ($\delta$)** from the **Growth Adjustment ($\eta \times g$)**. Specifically, I propose setting the Pure Time Preference at **0.5%** and calibrating the Growth Adjustment to long-term per-capita consumption projections, resulting in an effective starting rate of approximately 2.0% for years 0–30, declining to 1.5% for years 70+.

  This methodology aligns with recent federal updates (OMB Circular A-4, 2023) while addressing the specific ethical and fiscal constraints of state-level infrastructure. It allows the resilient barrier design to be evaluated on its actual merits regarding intergenerational safety without committing the state to a static rate that ignores economic reality or ethical obligation.

  ### 2. Methodological Framework

  We must move beyond the selection of a single "blended" number. The discount rate ($r$) should be explicitly constructed using the Ramsey Rule formula:

  $$r = \delta + \eta \times g$$

  Where:
  *   $\delta$ (Delta) is the **Pure Rate of Time Preference**.
  *   $\eta$ (Eta) is the **Elasticity of Marginal Utility of Consumption**.
  *   $g$ is the projected **Growth Rate of Per-Capita Consumption**.

  This separation allows us to vote on the ethical parameter ($\delta$) independently from the economic parameter ($\eta \times g$).

  #### A. The Pure Time Preference Component ($\delta$)
  **Recommendation:** Set $\delta = 0.5\%$.

  **Justification:**
  The Chief Economist argues for a high rate based on opportunity cost, while the Moral Philosopher argues for $\delta = 0\%$ based on intergenerational equity. A rate of 0.5% strikes a defensible balance.
  *   **Ethical Parity:** A $\delta$ near zero acknowledges that a life or a unit of welfare in 2150 is not intrinsically worth less than one today simply due to temporal distance. This rejects the implication of a 7% rate, which effectively treats catastrophic losses in the 22nd century as rounding errors.
  *   **Existential Risk Buffer:** Setting $\delta$ at exactly 0% creates the risk of the "Tyranny of the Future," where the present is obligated to sacrifice essential welfare for marginal future gains ad infinitum. A 0.5% rate incorporates a small probability of societal discontinuity (extinction risk, systemic collapse) and prevents the model from demanding infinite present sacrifice for distant, uncertain benefits. It respects the future without enslaving the present.

  #### B. The Growth/Opportunity Cost Component ($\eta \times g$)
  **Recommendation:** Set $\eta = 1.0$ and $g$ based on the State Budget Office's 30-year per-capita consumption forecast, capped at 1.5%.

  **Justification:**
  This component addresses the Chief Economist's concern regarding capital scarcity and the standard of living.
  *   **Diminishing Marginal Utility:** If we expect future generations to be wealthier than we are (positive $g$), the marginal utility of an additional dollar to them is lower than it is to us. Discounting reflects this expected abundance, not a moral devaluation of their lives.
  *   **Opportunity Cost Proxy:** By tying $g$ to consumption growth rather than short-term market returns, we acknowledge that public capital projects displace private investment but recognize that for century-scale projects, the relevant comparison is long-term societal wealth, not the current bond yield.
  *   **The Cap:** Capping $g$ at 1.5% acknowledges the uncertainty of long-term growth projections and the possibility that environmental degradation (the very risk we are mitigating) could suppress future consumption.

  ### 3. Implementation: The Declining Schedule

  Because uncertainty regarding $g$ increases over time, a flat rate is inappropriate for century-long projects. Uncertainty about future growth rates generally lowers the certainty-equivalent discount rate over long horizons (Weitzman's logic). Therefore, the parameters above should generate the following **Effective Discount Rate Schedule**:

  | Time Horizon | Effective Discount Rate | Rationale |
  | :--- | :--- | :--- |
  | **0 – 30 Years** | **2.0%** | Aligns with current long-term social rate of time preference; reflects near-term capital constraints. |
  | **31 – 70 Years** | **1.75%** | Begins to account for increased uncertainty in growth projections ($g$). |
  | **71+ Years** | **1.5%** | Reflects the ethical floor ($\delta$) as growth assumptions become highly speculative; ensures tail-risk protection (e.g., 2150 flood risks). |

  *Note: This schedule renders the resilient storm-surge design cost-effective, as the benefits accrued between 2080–2160 are discounted at 1.5% rather than 7%.*

  ### 4. Addressing Counter-Arguments

  **The "Tyranny of the Future" Objection:**
  *Critique:* A low $\delta$ (0.5%) combined with a declining schedule could justify excessive present spending for trivial future gains, starving current social programs.
  *Response:* The Growth Adjustment ($\eta \times g$) prevents this. If future generations are significantly richer, the growth term ensures we do not over-invest at their expense. Furthermore, the 0.5% $\delta$ is non-zero; mathematically, this ensures that a chain of small future gains cannot justify *infinite* present sacrifice. The benefits must still be substantial in absolute terms to clear the hurdle.

  **The "Writing Off the Future" Objection:**
  *Critique:* Any positive discount rate devalues the lives of future citizens. A 7% rate implies a flood death in 2150 is worth less than 1% of a death today.
  *Response:* We reject the 7% rate for this horizon. 7% reflects the *private* opportunity cost of capital in a growing economy, not the *social* value of survival. By separating $\delta$ from growth, we clarify that we are not valuing future lives less; we are adjusting for the expectation that future societies will have more resources to manage risk. However, for existential risks (like catastrophic flooding), the declining schedule ensures that the "price" of protection does not vanish over time.

  ### 5. Review Cycle

  Economic conditions and ethical consensus shift. This methodology should not be static.
  **Recommendation:** The Panel shall review the parameters ($\delta$, $\eta$, and the $g$ cap) every **five years**, coinciding with the state's fiscal planning cycle. The Effective Discount Rate Schedule shall be updated accordingly. This prevents the "freezing" of rates that plagued the previous federal Circular A-4 regime.

  ### 6. Motion for Vote

  I move that the Panel adopt the following resolution:

  > **RESOLVED,** that for all state capital projects with an expected lifespan exceeding 50 years, the Discount Rate shall be calculated using a Declining Discount Rate schedule based on the Ramsey growth model parameters:
  > 1.  **Pure Time Preference ($\delta$):** Set at 0.5%.
  > 2.  **Growth Adjustment:** Based on projected per-capita consumption growth, capped at 1.5%.
  > 3.  **Schedule:** Resulting in an effective rate of 2.0% (Years 0–30), 1.75% (Years 31–70), and 1.5% (Years 71+).
  > 4.  **Review:** These parameters shall be reviewed and recalibrated every five years by this Panel.

  ### 7. Conclusion

  This methodology respects the Economist's demand for fiscal rigor by including a growth adjustment, and the Philosopher's demand for ethical consistency by minimizing pure time preference. It provides a actionable, votable framework that allows the River City Barrier to be judged on its capacity to protect citizens in 2150, rather than being dismissed by a metric designed for 10-year commercial loans.

  I urge the Panel to vote in favor of this motion.
