      *   **Core Conflict:** Does foresight (sophistication/resoluteness) rescue an agent with cyclic preferences from the charge of irrationality?
          *   *Side A (The Rescuers):* Foresight prevents exploitation. Therefore, cyclic preferences aren't inherently irrational; the requirement is diachronic consistency (avoiding exploitation), not synchronic transitivity.
          *   *Side B (The Traditionalists):* Foresight requires choosing against current preferences. This cost proves the intransitivity is the disease. It's a dodge, not a cure.
      *   **Format:** Dialogue between two strong interlocutors.
      *   **Tone:** Academic but heated, rigorous, no strawmanning, no easy resolution.
      *   **Specific Constraint:** If one points out a flaw (e.g., sophisticated chooser refuses a preferred trade), the other must answer directly, not deflect.

  2.  **Character Conception:**
