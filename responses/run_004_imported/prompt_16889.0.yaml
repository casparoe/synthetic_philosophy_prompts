  *   *Sophisticated:* Looks ahead. Sees that if I take trade 1, I will take trade 2, then trade 3. Result: X - $3\epsilon$. Since I prefer X to X - $3\epsilon$, I refuse trade 1.
  *   *Blake's Objection:* At the moment of trade 1, you prefer Y - $\epsilon$ to X. But you choose X. You are violating your current preference.
  *   *Alex's Defense:* Your current preference is myopic. Your rational preference is over *outcomes*, not *moves*.

  Okay, let's write it.

  8.  **Final Review against constraints:**
