      *(Self-Correction during drafting)*: I need to make sure I don't make Schopenhauer sound *too* pessimistic. He thought music was a release from the suffering of the Will. I should frame marriage as a place where the "striving" finds a home, not necessarily an end to striving, but a harmonious striving.

      *Revised Plan:* Focus on the *harmony* of the Wills. Two individual melodies finding a shared bass line.

