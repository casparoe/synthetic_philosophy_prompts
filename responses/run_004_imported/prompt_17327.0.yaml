      *   Needs to be concise (it's a memo for a meeting).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I use Arendt correctly?
      *   *Check:* Arendt argues factual truth is coercive (it is what it is), while opinion is free. Lying about facts destroys the common world. Policing opinion destroys freedom. So, punishing the lie is good; punishing the opinion is bad.
      *   *Critique:* Is the sanction realistic?
      *   *Check:* Disqualifying a frontrunner 2 days before an election causes chaos. A public correction is better for "truth."
      *   *Critique:* Did I answer the specific objection?
      *   *Check:* Yes, the objection is that vague lies are worse. The answer is that policing them is more dangerous to the process.

  7.  **Final Polish:** Check word count and clarity. Ensure the "Standard" is clearly defined for future use. (Make sure to explicitly mention the "recklessness" aspect since she admitted she didn't check).

