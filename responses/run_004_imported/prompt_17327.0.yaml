  *Interpretation:* In election ethics, "reckless disregard" is usually sufficient for "knowingly." If I claim X is true without checking, and X is easily checkable, I am treating the truth as irrelevant. Arendt would argue this is the "lying" attitude—treating facts as disposable. I will argue that *reckless dissemination* counts as a violation of the spirit of the rule, otherwise the rule is toothless. I need to make sure the memo argues this point clearly so the Board can vote for a violation.

