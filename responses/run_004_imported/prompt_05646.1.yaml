          *   *Nuance:* Aristotle distinguishes between earning from a *function* vs. earning from the *substance* of money. If the reward is for the *service* of validation, it might be natural (like a wage). If the reward is just for *holding* the money, it's *tokos*.
          *   *Problem:* In DeFi, the "service" is often abstract. The "labor" is automated. Aristotle might see the automation as removing the human virtue element, making it purely mechanical wealth generation.

      *   **Case C: Lending Protocols (Aave, Compound)**
