      *   *Scenario 3: Yield Farming (Liquidity).* This is facilitating exchange for profit. This is *kapēlikē* (retail trade). Unnatural, but less so than *tokos*. However, if the goal is infinite accumulation of tokens, it falls under unlimited *chrematistike*.
      *   *The "Sterility" of Money:* Aristotle's metaphysical point. Money is a measure. A measure doesn't grow. DeFi treats money as capital (productive asset). This is the fundamental clash.
