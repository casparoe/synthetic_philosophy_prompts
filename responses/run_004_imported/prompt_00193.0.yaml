      *   *Point 2: Apagogic Proof.* Cite the *Critique* (A789). Kant allows proof by contradiction in math because mathematical objects are "given" in intuition (unlike things-in-themselves). If $\neg P$ leads to a contradiction with the form of intuition, $P$ is true. This presupposes LEM.
      *   *Point 3: The Infinite.* Compare Kant's "potential infinite" (regulative idea vs. mathematical synthesis) with Brouwer's "unfinished." Kant sees the *rule* of synthesis as complete *a priori*. If the rule is fixed, the truth value is fixed, even if the synthesis is endless.
