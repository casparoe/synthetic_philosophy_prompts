  **Classical Utilitarianism:** This approach assumes a universal metric for pleasure and pain without providing calibration procedures, akin to using uncalibrated instruments.

  **Robbins's Ordinalism:** This argument declares interpersonal comparison scientifically meaningless, effectively prohibiting the measurement rather than attempting to ground it.

  **Kaldor-Hicks Test:** This tradition avoids direct comparison by relying on hypothetical compensation, sidestepping the need for a common utility scale entirely.

  **Arrow's Extended Sympathy:** This idea proposes grounding comparisons in preferences over identities, but it relies on strong assumptions about empathy and preference coherence.

  **Harsanyi's Aggregation Theorem:** This theorem derives a social welfare function formally, but it fixes inter-personal scaling through normative axioms rather than empirical discovery.

  **Rawls's Primary Goods:** This framework substitutes utility with an index of goods, shifting the measurement problem to the weighting of goods rather than solving comparability.

  **Sen's Capability Approach:** This approach relocates comparison to observable capabilities and functionings, offering the most robust normative framework for public reasoning about weights.
