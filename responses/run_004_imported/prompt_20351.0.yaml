  1.  **Analyze the User's Request:**
      *   **Premise:** George Berkeley (18th-century Irish philosopher/bishop) time-travels to modern Dublin and argues about cryptocurrency on a podcast.
      *   **Goal:** Write authentic dialogue/characterization, avoiding clichés (e.g., "if nobody perceives your Bitcoin does it even exist?").
      *   **User's Instinct:** Berkeley wrote about money being tokens/not needing gold/silver, so he might be pro-crypto.
      *   **Question:** Is this instinct right? Or would he hate it based on his actual economic views?

  2.  **Verify the User's Premise (Berkeley's Economic Views):**
