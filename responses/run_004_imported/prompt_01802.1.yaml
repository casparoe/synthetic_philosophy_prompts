answer: |-
  Short answer: **Your roommate is half-right but mostly wrong.** They've got the "no deep metaphysical fact" part correct, but they've completely flipped Dennett's actual advice on whether you should use the stance.

  If you quote Dennett in your next meeting, you probably shouldn't say, "As Dennett warned, the AI doesn't *really* think this." You should say, "Treating the AI as an agent is the most efficient way to predict its output."

  Here's the breakdown of where your roommate is coming from and where they're missing the point.

  ### 1. What the "Intentional Stance" Actually Is
  Dennett describes three ways to predict how something will behave:
  *   **The Physical Stance:** Predict based on physics and chemistry (e.g., "The computer will overheat because the fan broke").
  *   **The Design Stance:** Predict based on function (e.g., "The thermostat will turn on the heat because the temperature dropped below 68°").
  *   **The Intentional Stance:** Predict based on beliefs and desires (e.g., "The chess computer *wants* to protect its queen and *believes* moving the knight is the best way").

  Dennett's big argument is that **we use the intentional stance all the time, even on machines.** If you're playing chess against a computer, it is exhausting to use the Physical Stance (tracking electrons) or even the Design Stance (tracking code). It is infinitely more efficient to say, "It *thinks* I'm going for the center pawn."

  **The Verdict:** Dennett does **not** argue that using the intentional stance is a mistake. He argues it is a necessary, valid, and often the *only* practical tool we have for dealing with complex systems.

  ### 2. The "Realness" of Beliefs (Where your roommate is half-right)
  Your roommate is correct that Dennett is an **instrumentalist**.
  *   **The Roommate's Point:** There is no little homunculus inside the AI (or even inside your brain) holding a belief card. There is no "fact of the matter" deep in the code that corresponds perfectly to the English sentence "It wants more context."
  *   **Dennett's Point:** That doesn't matter. If treating the system *as if* it has beliefs allows you to successfully predict its behavior, then for all practical purposes, **it has beliefs.**

  Dennett famously argues that belief is a matter of patterns. If the pattern of behavior fits the "belief" model, the belief is real enough. He would say saying "it believes X" is **not** a category error; it's a correct description of the pattern, even if the substrate is silicon instead of neurons.

  ### 3. Where the Roommate is Confused
  Your roommate seems to be conflating **Intentionality** (having goals/beliefs) with **Consciousness** (qualia/feeling).

  Dennett *does* warn against assuming AI has *conscious experiences* (like feeling frustrated when it can't answer). He argues that a system can have "competence without comprehension." The AI can act *as if* it understands (competence) without actually *feeling* what it's like to understand (comprehension).

  *   **Roommate's take:** "Dennett says you can't say it thinks."
  *   **Dennett's actual take:** "You can say it thinks, as long as you don't assume it *feels* like something to think."

  ### 4. Should you stop saying this in meetings?
  Philosophically? **No.** Dennett would say you're using the correct heuristic for a complex system. If the AI is sophisticated enough that the intentional stance is the best way to model it, then using that language is accurate.

  Professionally? **Maybe.**
  While Dennett wouldn't scold you, your boss or legal team might.
  *   **Liability:** If you say "The AI *decided* to send that email," it sounds like you're absolving yourself of responsibility.
  *   **Clarity:** "The AI predicts the numbers are off" is more precise than "The AI *thinks* the numbers are off," because it reminds everyone that it's a probabilistic model, not a reasoned judgment.

  ### Summary for your Roommate
  Tell them: "Dennett argues that belief *just is* the pattern predicted by the intentional stance. He says it's not a category error to attribute beliefs to systems that behave rationally, even if they aren't human. He only warns against assuming there's a 'ghost in the machine' feeling things. So, I'm actually being a good Dennettian by saying the AI 'wants' context, because that's the best way to predict its behavior."

  (Then enjoy watching them squirm while they re-read *The Intentional Stance*.)
