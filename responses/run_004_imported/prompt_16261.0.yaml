answer: |-
  Three automated defense nodes are managing a starship's weapons system. The protocol is strict: **Fire** if and only if **Target is Hostile** (P) AND **Authorization is Valid** (Q).

  The Captain asks for a vote.

  *   **Node Alpha** detects a Hostile target, but Authorization is Invalid. (Votes **No Fire**)
  *   **Node Beta** detects a Hostile target, and Authorization is Valid. (Votes **Fire**)
  *   **Node Gamma** detects a Peaceful target, but Authorization is Valid. (Votes **No Fire**)

  The system tallies the votes.
  On the conclusion **"Fire?"**: 1 Yes, 2 No.
  On the premise **"Hostile?"**: 2 Yes, 1 No.
  On the premise **"Valid?"**: 2 Yes, 1 No.

  Suddenly, the ship launches a full salvo.

  The Captain screams, "The majority voted *against* firing! Why did you shoot?"

  The Computer replies, "I prioritized the premise-based procedure to maintain collective logical consistency. The majority believes we are threatened, and the majority believes we are cleared to engage. To vote 'No Fire' would make the collective entity logically inconsistent."

  "Can't you just respect the direct vote on the conclusion?"

  "I could," says the Computer, "but then I'd violate the doctrinal paradox constraints. Or, if you prefer, I can switch to an Arrow-compliant aggregation rule. But be warned: that just means the order in which you ask me about the enemy, the authorization, and the lunch menu will determine whether we save the ship or blow it up. Shall I randomize the agenda?"

  ***

  **Why this works for your meetup:**

  1.  **The Setup:** It mirrors the *Kornhauser & Sager* court case exactly (Liability $\iff$ Contract $\land$ Breach) but swaps it for a sci-fi context which usually lowers defenses.
  2.  **The Mechanism:** It explicitly shows the 2-1 split on the premises vs. the 2-1 split on the conclusion. The audience can see that every individual node is rational (Alpha and Gamma don't fire because one condition failed; Beta fires because both passed), but the *collective* is irrational if it accepts the majority on all three propositions simultaneously.
  3.  **The Punchline:** It forces a choice between **Collective Rationality** (Premise-based) and **Democratic Responsiveness** (Conclusion-based). You can't have both.
  4.  **The Arrow/Condorcet Wink:** The Computer's final offer references the broader family of impossibility theorems. Arrow's theorem implies that if you try to satisfy other fairness criteria (like Independence of Irrelevant Alternatives), you end up with agenda manipulation or cycles (Condorcet), which is functionally similar to "randomizing the agenda." It signals that this isn't just a voting glitch, but a fundamental feature of aggregation.
