prompt: |-
  So I've been down a rabbit hole lately on judgment aggregation stuff, started from an old Overcoming Bias or LessWrong thread on Arrow's theorem (can't remember which) that linked out to the List & Pettit "discursive dilemma" papers, and then further down into the older Kornhauser & Sager "doctrinal paradox" stuff. You know the setup: a three-judge panel has to rule on liability, which is legally defined as true iff both premise P (there was a valid contract) and premise Q (it was breached) are true. Each judge is individually consistent, but if you do majority voting premise-by-premise you can get a verdict that's the opposite of what you'd get majority-voting directly on the bottom line conclusion. I tried to explain this at a meetup last week and everyone's eyes just glazed over, so now I'm trying a different tack.

  Can you write me a joke about the discursive dilemma / judgment aggregation more generally? It doesn't have to be a knee-slapper, but the punchline should actually hinge on the real structure of the paradox (the premise-based vs. conclusion-based procedure split, or the fact that unanimous individual rationality doesn't guarantee collective consistency) rather then being some generic "committees are dumb" or "voting is broken" joke that could apply to literally any aggregation rule. Extra credit if it somehow winks at the family resemblance to Condorcet's paradox or Arrow's theorem, since that's the connection that got me into this in the first place.
