answer: |-
  This is an exceptionally sharp line of inquiry. You have correctly identified a fissure between the formal machinery of game theory and the normative claims often built upon it by epistemologists. Your suspicion is not confused; it is technically well-grounded and philosophically significant.

  Here is a candid assessment addressing your three specific points.

  ### 1. The Technical Point: Representation Sensitivity
  **Verdict: You are correct.**

  Your understanding of the relationship between belief hierarchies, type spaces, and the Common Prior Assumption (CPA) is accurate. The existence of a common prior is **not** a property solely of the belief hierarchies; it is a property of the type space structure used to represent those hierarchies.

  The definitive technical result here comes from **Heifetz and Samet (1998), "Topology-Free Typology of Beliefs"** (*Econometrica*). They demonstrate that the property "there exists a common prior" is not expressible in the infinitary language of belief hierarchies. In simpler terms: you cannot look at the infinite tower of beliefs (I believe that you believe that I believe...) and determine algorithmically whether a common prior exists. You need additional structural information about the underlying state space.

  Why does this happen?
  *   **Hierarchies are marginals:** A belief hierarchy essentially describes an agent's marginal beliefs over the state space and other agents' types.
  *   **Priors are joint measures:** A common prior is a single probability measure over the *entire* product space of states and types that yields those marginals.
  *   **Redundancy creates latitude:** In a "redundant" type space (where distinct types generate identical hierarchies), the sigma-algebra of events is finer than in the minimal (universal) space. You can have a probability measure that works for the coarser algebra (minimal space) but cannot be extended to the finer algebra (redundant space) without violating the "common" constraint or the consistency with the hierarchies. Conversely, sometimes expanding the space allows you to "hide" inconsistencies in the redundancy that would be exposed in a minimal space.

  Therefore, whether a profile of beliefs satisfies the CPA can indeed depend on the modeler's choice of type space, even if the agents' doxastic states (the hierarchies) remain fixed. This confirms your suspicion that CPA is not purely a constraint on *belief*, but partly a constraint on *model representation*.

  ### 2. Epistemic Implications: Does this undercut Aumann?
  **Verdict: Yes, it significantly weakens the standard epistemic reading, but defenders have a retreat.**

  If CPA is representation-sensitive, it cannot be a fundamental norm of *synchronic* rationality (i.e., a rule about what beliefs it is permissible to hold at a time $t$). Rationality constraints should presumably supervene on the agent's mental states (the hierarchies), not on the external modeler's choice of state-space granularity.

  **The Damage to the Epistemic Argument:**
  Philosophers (e.g., Christensen, Lackey, Elga) often use Aumann's theorem to argue that rational peers *must* converge. They treat CPA as a "no arbitrary bias" constraint. Your argument shows that "having a common prior" is not just "lacking bias"; it is accepting a specific structural description of the world that goes beyond the evidence of the belief hierarchies themselves. If two agents have identical hierarchies but are modeled in a redundant space where no CP exists, they are not necessarily "irrational" in a doxastic sense; they are simply in a model where the CP condition fails. This makes the "irrationality of disagreement" claim much harder to sustain.

  **The Potential Rescue (Harsanyi's Dogma):**
  Defenders of CPA (like Aumann himself) typically do not defend it as a synchronic consistency constraint. They defend it as a **causal/historical claim** (Harsanyi's "Dogma"). The argument is that agents start with the *same* prior at the beginning of time and diverge *only* due to private information.
  *   **The Counter:** Your point still bites here. If the CP is a claim about causal history, why should its *mathematical existence* depend on whether we model the agents using a redundant or minimal type space today? The causal history is a fact; the type space is a model. If the math says the prior exists in Model A but not Model B, yet both models capture the same beliefs, then the math is failing to capture the causal fact robustly.
  *   **Reformulation:** You asked if CPA can be reformulated directly in terms of hierarchies. The Heifetz-Samet result suggests **no**. If you want a "Common Prior" condition that is hierarchy-expressible, you have to weaken it significantly (e.g., to "Common Priors on finite projections"), which loses the strength required for Aumann's Agreement Theorem.

  ### 3. Literature Status: Is this Old News?
  **Verdict: Old news in Game Theory/Logic; Novel in Philosophy of Disagreement.**

  You need to be careful not to claim discovery of the technical result, but you can claim novelty in its *epistemological application*.

  **In Economics and Logic (The "Old News"):**
  *   **Heifetz & Samet (1998):** As mentioned, they established the non-expressibility of CP in the language of belief.
  *   **Gul (1998) vs. Aumann (1998):** In *Econometrica*, Faruk Gul argued that the CPA is empirically meaningless and extremely strong. Aumann defended it as a useful idealization. Your argument aligns closely with Gul's skepticism but provides a specific formal mechanism (redundancy/representation) that Gul alluded to but didn't fully formalize in that specific exchange.
  *   **Hellman (2013):** "The Common Prior Assumption in Perspective" (*Topoi*) provides a good survey of these criticisms.
  *   **Feinberg (2000):** Discusses the characterization of common priors and the role of the state space.

  **In Philosophy (The Opportunity):**
  *   The philosophical literature on the epistemology of disagreement (e.g., *The Epistemology of Disagreement: New Essays*, 2013; works by Kelly, Schoenfield, Titelbaum) largely treats the Bayesian framework as a black box. They typically assume that if agents are "Bayesian," the CPA is a debatable but coherent normative option.
  *   Very few philosophers engage with the **type-space literature** directly. They tend to rely on simplified "partition models" where the redundancy issue doesn't arise visibly.
  *   **Your Niche:** There is a genuine gap here. Philosophers argue about whether CPA is *normatively plausible*; you are arguing that it is *formally unstable* in a way that undermines its normative force. Translating the Heifetz-Samet/Gul critique into the language of epistemic rationality is a valuable contribution.

  ### Strategic Advice for the Paper

  1.  **Acknowledge the Precedents:** Cite Heifetz and Samet (1998) explicitly. Do not claim the technical result is new. Instead, frame your paper as exploring the *philosophical consequences* of this result for the epistemology of disagreement.
  2.  **Focus on Supervenience:** The strongest philosophical framing of your argument is about **supervenience**. Normative rationality should supervene on the agent's mental states (hierarchies). If the satisfaction of a rationality constraint (CPA) fails to supervene on those states (because it depends on the type-space representation), then CPA cannot be a fundamental rationality constraint.
  3.  **Distinguish "Idealization" from "Constraint":** Concede that CPA might be a useful *modeling idealization* for economists (where predictive success matters more than normative granularity) but argue it is a failed *epistemic norm* for philosophers (where the status of the believer matters).
  4.  **Watch out for the "Universal Space" Defense:** A defender might say, "We should just always use the universal type space; then the representation is unique."
      *   *Your Rebuttal:* The universal space is a mathematical construct, not necessarily a cognitive reality. Agents do not have types that correspond to the universal space; they have beliefs. If the universal space imposes structural constraints (like CPA) that smaller, behaviorally equivalent spaces do not, then the universal space is adding "structure" that isn't in the beliefs. Why should rationality be dictated by the largest possible mathematical model rather than the actual cognitive state?

  ### Summary
  Your central move is **sound**. It leverages a known but under-appreciated technical limitation of the Harsanyi/Aumann framework to undermine a popular philosophical conclusion. It is not confused. If you can clearly articulate the distinction between *doxastic states* (hierarchies) and *model structures* (type spaces) and show why rationality norms must attach to the former, you will have a strong paper. Just ensure you position it as a philosophical critique of a technical assumption, rather than a discovery of the technical assumption itself.
