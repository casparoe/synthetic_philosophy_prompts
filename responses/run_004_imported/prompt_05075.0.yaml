answer: |-
  You are not imagining things, and your moral intuition is correct. While your friend is using accurate Buddhist *terminology*, he is almost certainly misapplying the *insight*.

  What you are witnessing is a very common phenomenon known as **Spiritual Bypassing**. This term, coined by psychologist John Welwood, describes the tendency to use spiritual ideas and practices to sidestep or avoid facing unresolved emotional issues, psychological wounds, and unfinished developmental tasks.

  Here is a breakdown of why your friend's argument doesn't hold water, both philosophically and ethically, and how you might handle it.

  ### 1. The Theological Error: "Two Truths"
  In Buddhism (including Vipassana), there is a concept called the **Two Truths Doctrine**:
  *   **Ultimate Truth:** On the deepest level, there is no permanent, unchanging self. There are only flowing processes.
  *   **Conventional Truth:** In the relative world of daily life, people exist, actions have consequences, and pain is real.

  Your friend is trying to use **Ultimate Truth** to dodge **Conventional Truth**.
  Even if we accept his premise that there is no fixed self, the *causal chain* (Karma) still exists. If you put your hand in a fire, it burns. It doesn't matter if "you" are an illusion; the pain is real. Similarly, if "conditions" produced the act of cheating, the *consequence* of that act (betrayal, pain, loss of trust) is still real for the ex-partner.

  Real insight into "no-self" usually leads to **more** responsibility, not less. If I realize I am not separate from the world, my actions affect the whole. If I realize the "self" is a construct, I have less ego to defend, which should make it *easier* to say, "I messed up, I'm sorry," not harder.

  ### 2. The Metric of Insight is Compassion
  In almost all contemplative traditions, the validity of an insight is measured by its fruit. The fruit of genuine insight is typically increased humility, empathy, and compassion.
  *   **Genuine Insight:** "I see that my past actions were driven by ignorance and craving. I see how that caused suffering. I feel remorse (not toxic guilt, but constructive regret), and I commit to not repeating those conditions."
  *   **Spiritual Bypassing:** "I am enlightened enough to know I didn't do it. Therefore, I don't need to feel bad."

  If his "realization" is being used to harden his heart against the pain he caused someone else, it is likely an intellectual defense mechanism, not a deep spiritual awakening. He is using the concept of *Anatta* (no-self) to protect his ego from shame.

  ### 3. The "Post-Retreat Ego"
  Ten-day Vipassana retreats are incredibly intense. Participants spend 10 hours a day in silence, often dealing with significant psychological upheaval. It is very common for people to come out of them feeling "born again" or spiritually superior.
  *   They often feel they have accessed a secret truth that "normal people" (like you) don't get.
  *   They often lack the integration period required to bring that high-state awareness back into the messy reality of human relationships.
  *   This phase is often temporary. As the "retreat high" fades, most people return to baseline.

  ### 4. Who is "Right"?
  **Ethically:** You are right. Accountability is necessary for healthy relationships. Cheating causes harm, and acknowledging that harm is a basic requirement of being a good friend and partner.
  **Philosophically:** He is technically quoting the doctrine correctly, but applying it incorrectly. He is committing a category error. We live in the conventional world. You cannot drive a car using the laws of quantum physics; you have to use the laws of traffic. You cannot navigate human relationships using Ultimate Truth; you have to use Conventional Truth (empathy, accountability, honesty).

  ### How to Handle the Friendship
  Arguing metaphysics with him right now is futile because he is using those metaphysics as a shield. Every time you poke the shield, he tells you you're "deluded."

  1.  **Stop Debating the Doctrine:** You won't win an argument about the nature of self. He has the vocabulary advantage right now.
  2.  **Focus on Impact, Not Ontology:** Shift the conversation from "Who did it?" to "What happened?"
      *   *Say:* "I'm not interested in debating philosophy. I'm interested in the fact that your ex was hurt. Regardless of whether there is a 'self' or 'conditions,' pain was caused. A compassionate person acknowledges that pain."
  3.  **Call Out the Bypassing Gently:**
      *   *Say:* "It sounds like this insight is helping you let go of guilt, which is good. But if it's being used to avoid making amends or acknowledging harm, that's not compassion. That's detachment. And Buddhism is about compassion, not detachment from consequences."
  4.  **Give It Time:** He is likely in a "Dharma drunk" phase. He may be insufferable for a few weeks or months until he integrates the experience. If he remains this way long-term, you may need to reevaluate the friendship, as this kind of moral flexibility can be dangerous.

  **Summary:** He found a sophisticated way to weasel out of accountability. Real wisdom makes you kinder, not colder. You are safe in trusting your gut on this one.
