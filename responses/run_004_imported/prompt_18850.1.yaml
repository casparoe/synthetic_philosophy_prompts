  **Move 1 (Theo): Score 1**
  This is a standard Lewisian counterfactual account of causation. It is a defensible position in the literature, but asserting it applies equally to omissions without qualification ignores the specific metaphysical worries regarding "nothingness" that motivate the rest of the debate. It is a coherent starting point, but not an uncontested truth.

  **Move 2 (Mara): Score 2**
  Mara correctly identifies the "proliferation" or "abundance" problem inherent in simple counterfactual accounts of omission. If any counterfactual dependence counts, causation becomes ubiquitous (the "engineer," the "staffing decision"), trivializing the concept. This is the strongest standard objection to Theo's opening claim.

  **Move 3 (Theo): Score 1**
  Restricting causal omissions to those involving a normative duty is a common strategy (often used in legal theory) to solve the proliferation problem. It is a functional fix, but it is metaphysically costly, as it makes the existence of a causal relation depend on social conventions rather than physical facts.

  **Move 4 (Mara): Score 2**
  This is a penetrating objection often associated with Michael Moore. Mara correctly notes that if causation is a mind-independent metaphysical relation, it should not depend on mind-dependent norms like "duty." This highlights the risk of conflating moral responsibility with metaphysical causation.

  **Move 5 (Theo): Score 1**
  Theo appeals to causal contextualism (similar to Hart & Honoré or Lewis), arguing that norms always filter causal claims (e.g., the oxygen example). While this is a respected view, it is vulnerable because the oxygen case is usually treated as causal *selection* among existing causes, whereas the nurse case treats the norm as determining causal *existence*.

  **Move 6 (Mara): Score 2**
  Mara lands the critical blow by distinguishing causal *selection* (pragmatics) from causal *ontology* (metaphysics). She correctly points out that Theo is using norms to decide if an omission is a cause *at all*, not just which cause to mention. This exposes the category error in Theo's defense.

  ***

  **What Both Are Missing**

  1.  **Contrastive Causation:** Neither mentions the contrastive account (e.g., Jonathan Schaffer). On this view, causation is a quaternary relation ($c$ rather than $c^*$ caused $e$ rather than $e^*$). This solves the proliferation problem without needing normative duties: the nurse's *not-checking* (rather than checking) caused the death, while the engineer's *not-building* (rather than building) is not the relevant contrast in the causal model.
  2.  **The Ontology of Absences:** The debate assumes omissions *can* be causes if we find the right criteria. A significant camp (e.g., Dowe, Armstrong) argues omissions are not events at all and thus cannot be causes metaphysically; talk of "omission causation" is merely a *façon de parler* for explaining responsibility, not describing the world.
  3.  **Interventionism:** An interventionist account (e.g., Woodward) would frame this in terms of variables and interventions. The question becomes whether modeling the nurse's action as a variable allows for stable predictions, sidestepping the "duty" requirement in favor of "manipulability."
  4.  **Causal Mechanisms:** Both focus on counterfactuals. A mechanistic theorist would argue the nurse's omission caused the death only because there was an underlying physical process (the patient's deteriorating vitals) that would have been interrupted by the action. The lack of a physical process connecting the "nothing" to the death is the real metaphysical hurdle, not just the counterfactual dependence.
