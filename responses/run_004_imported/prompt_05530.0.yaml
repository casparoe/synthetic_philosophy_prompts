answer: |-
  This is an excellent focal point for a graduate seminar. The Oswald/Kennedy minimal pair is the *crux* of the modern debate on conditionals. It forces a choice between semantic uniformity and semantic dualism. Below is an analysis structured for your seminar, detailing the Stalnakerian obstacle, the pragmatic rescue, and a critical assessment of the Adams–Edgington alternative.

  ### 1. The Obstacle to Uniform Selection-Function Semantics

  To understand why this pair is problematic, we must first recall the core of the Stalnakerian project (stemming from *Inquiry*, 1984, and earlier papers). Stalnaker aims to provide a unified possible-worlds semantics for both indicative and subjunctive (counterfactual) conditionals.

  In this framework, a conditional $A > C$ is true at a world $w$ if and only if $C$ is true at the unique closest $A$-world to $w$, selected by a function $f(w, A)$.
  $$ [[A > C]]^w = 1 \text{ iff } C \text{ is true at } f(w, A) $$

  **The Problem:**
  If the semantics are uniform, the truth conditions for (1) and (2) should be identical, as they share the same antecedent ($A$: Oswald did not kill Kennedy) and consequent ($C$: someone else did).
  *   **World $w$ (Actual):** Oswald killed Kennedy; Kennedy is dead.
  *   **Selection:** The function $f(w, A)$ selects the world most similar to $w$ where Oswald did not kill Kennedy.

  If the selection function operates solely on similarity metrics (minimizing miracles, maximizing match of particular fact), it is unclear why the mood of the verb should alter the output of $f$.
  *   If $f$ selects a world where the assassination still happens (to preserve the fact that Kennedy died), (2) comes out **True**.
  *   If $f$ selects a world where the assassination does not happen (to preserve the causal isolation of Oswald), (1) comes out **False**.

  Since competent speakers judge (1) True and (2) False, a naive uniform semantics predicts the wrong truth values for at least one of them. This suggests that mood *does* affect truth conditions, threatening the project of a single, unified logic for conditionals.

  ### 2. The Stalnakerian Rescue: Context Sets and Presupposition

  Stalnaker does not abandon the uniform semantics. Instead, he locates the difference in **pragmatics**, specifically in the **context set**.

  The context set ($C$) is the set of worlds compatible with the presuppositions and common ground of the conversation. Stalnaker argues that indicative and counterfactual conditionals impose different presuppositions on the context set, which constrains the selection function.

  *   **Indicatives (Sentence 1):** The use of the indicative mood presupposes that the antecedent $A$ is **compatible** with the context set. In the actual conversation about history, it is an established fact that Kennedy was killed. Therefore, the context set contains only worlds where Kennedy was killed.
      *   When we evaluate (1), the selection function $f(w, A)$ must pick the closest $A$-world *within the context set*.
      *   Since all worlds in $C$ are worlds where Kennedy was killed, the closest world where Oswald didn't do it must be a world where *someone else* did.
      *   **Result:** (1) is True.

  *   **Counterfactuals (Sentence 2):** The use of the subjunctive mood typically presupposes that the antecedent $A$ is **false** (or at least incompatible with the current context set). To evaluate (2), we must accommodate a shift in the context set to include worlds where the "facts" of the actual world (like the death of Kennedy) are not held fixed as presuppositions.
      *   We expand the context set to allow for worlds where Kennedy might not have been killed.
      *   The selection function $f(w, A)$ now picks the closest $A$-world without the constraint that Kennedy died. Given the historical consensus that Oswald acted alone, the closest world where Oswald doesn't shoot is a world where no assassination occurs.
      *   **Result:** (2) is False.

  **The Stalnakerian Claim:** The semantic rule ($f(w, A)$) remains identical. The divergence in truth value arises because the *domain* over which the selection function operates is constrained differently by the pragmatic presuppositions associated with grammatical mood.

  ### 3. Assessment: Stalnaker vs. Adams–Edgington

  Does this maneuver succeed? Or does the Oswald pair vindicate the view that indicatives are fundamentally probabilistic (Adams 1965; Edgington 1995)?

  #### The Case for Stalnaker (The Unity Argument)
  Stalnaker's approach preserves **compositionality**. If indicatives and counterfactuals share a semantics, they can be embedded in larger logical structures (negations, disjunctions, conditionals of conditionals) without requiring a fragmented logic.
  *   **Strength:** It explains why we can validly infer "If $A$, then $C$" from "Not-$A$ or $C$" in some contexts, and why the logic of conditionals largely mirrors modal logic.
  *   **Weakness:** The pragmatic explanation feels like a patch. It requires us to believe that the mere change from *did* to *had done* triggers a massive shift in the common ground (from "Kennedy was killed" to "Kennedy might not have been killed"). While technically feasible, it attributes a heavy explanatory burden to pragmatics. It struggles to explain *why* the mood triggers this shift without simply stipulating it.

  #### The Case for Adams–Edgington (The Epistemic Argument)
  Ernest Adams argued that indicative conditionals do not express propositions and therefore have no truth conditions. Instead, they have **assertibility conditions** defined by conditional probability: $P(C|A)$. Dorothy Edgington extended this, arguing that indicatives express degrees of belief, while counterfactuals remain truth-conditional (modal).

  *   **Why the Pair Vindicates Them:** The Oswald pair aligns perfectly with this dualism.
      *   **(1) Indicative:** We assess this given our knowledge that Kennedy died. $P(\text{Someone else} | \text{Not Oswald} \land \text{Killed}) \approx 1$. It is highly assertible.
      *   **(2) Counterfactual:** We assess this by imagining a causal scenario where Oswald abstains. $P(\text{Someone else} | \text{Not Oswald})$ is low. It is not assertible.
      *   Adams–Edgington captures the intuition that (1) is an *epistemic* inference (deducing from known facts) while (2) is a *metaphysical/causal* speculation. Stalnaker tries to force both into the same modal box; Adams recognizes they are different cognitive tools.

  *   **The Fatal Flaw:** The **Embedding Problem**. If indicatives lack truth values, they cannot be negated, disjoined, or embedded in other conditionals. Yet, natural language allows this: *"If it is not the case that if Oswald didn't kill him, someone else did, then..."* Adams–Edgington requires complex, non-truth-conditional semantics to handle these embeddings (e.g., McGee's counterexamples to Modus Ponens), which many find theoretically costly.

  #### My Verdict

  The Oswald pair **does not definitively kill Stalnaker's project, but it exposes its explanatory limits.**

  Stalnaker's context-set maneuver is formally viable but pragmatically opaque. It saves the uniform semantics at the cost of making the connection between grammatical mood and context shift appear stipulative. It tells us *how* the truth values diverge, but not *why* the language encodes this divergence in mood rather than in explicit presuppositions.

  However, the Adams–Edgington view, while intuitively superior for the minimal pair, pays too high a price in logical expressiveness. Abandoning truth conditions for indicatives makes it difficult to account for the validity of arguments involving embedded conditionals, which are ubiquitous in natural language reasoning.

  **Conclusion for the Seminar:**
  The Oswald pair vindicates the **insight** of Adams–Edgington: that indicatives are fundamentally epistemic and counterfactuals are metaphysical. However, it does not vindicate their **formalism** (the abandonment of truth conditions).

  The most promising path forward lies not in pure Adams-style probabilism nor in rigid Stalnakerian uniformity, but in **contextualist truth-conditional views** (e.g., Khoo 2015; Mandelkern 2020). These views retain Stalnaker's truth conditions but allow the *modal base* to shift semantically based on mood, effectively hard-coding the Adams intuition into the semantics without abandoning truth values.

  For your seminar, I recommend framing the Oswald pair not as a refutation of Stalnaker, but as the catalyst that forced the field to recognize that the "context" in possible-worlds semantics is not merely a background set of facts, but a dynamic parameter sensitive to grammatical mood. Stalnaker was right to seek unity, but Adams was right that the unity cannot be superficial.
