      *   **Task 2:** Explain how a Stalnakerian attempts to resolve this by locating the difference in *context* (specifically, the set of live possibilities) rather than truth conditions.
      *   **Task 3:** Offer an assessment: Does the Stalnakerian maneuver succeed, or does it vindicate the Adams-Edgington view (probabilistic/assessability for indicatives vs. truth-conditional/modality for counterfactuals)?
      *   **Context:** Graduate seminar preparation (implies a need for technical precision, philosophical depth, and clear argumentation).

  2.  **Analyze the Oswald Pair:**
      *   (1) Indicative: *If Oswald did not kill Kennedy, someone else did.* (True, because Kennedy was killed, and if not Oswald, then logically someone else must have).
      *   (2) Counterfactual (Subjunctive): *If Oswald had not killed Kennedy, someone else would have.* (False, because the conspiracy theories aside, the prevailing historical view is that Oswald acted alone; if he hadn't, the assassination likely wouldn't have happened then/there).
      *   **The Problem:** They look semantically identical (If $A$, then $C$). If semantics determines truth conditions based on the same function $f(A, C)$, they should have the same truth value. They don't.

  3.  **Stalnaker's Project (Task 1 & 2):**
      *   **Goal:** A unified semantics (Ramsey-Stalnaker semantics). Both use a selection function $f(w, A)$ that picks the closest $A$-world to world $w$.
      *   **The Obstacle:** If the semantic content is the same, why the divergence in truth value?
      *   **Stalnaker's Solution (Context Set):** The difference isn't in the *semantic rule* but in the *context set* (the set of worlds compatible with the common ground of the conversation).
          *   For the **Indicative**: The context set includes only worlds where Kennedy was killed (since it's an established fact). The selection function picks the closest world where Oswald didn't kill him *within the context set*. Since Kennedy was killed in all context-set worlds, someone else must have done it in that closest world. -> True.
          *   For the **Counterfactual**: The context set is expanded or shifted to include worlds where Kennedy was *not* killed (presupposition failure or "accommodation"). We look at the closest world where Oswald didn't kill him, *without* the constraint that Kennedy was killed. In that world, no assassination occurs. -> False.
      *   **Key Mechanism:** Presupposition of the antecedent. Indicatives presuppose the antecedent is epistemically open (compatible with the context set). Counterfactuals presuppose the antecedent is false (or at least outside the current context set).

  4.  **Adams-Edgington View (Task 3 - The Alternative):**
      *   **Adams:** Indicatives don't have truth conditions. They have *assertibility conditions* based on conditional probability ($P(C|A)$).
      *   **Edgington:** Extends this. Indicatives express degrees of belief. Counterfactuals are different (modal/truth-conditional).
      *   **Why the pair supports them:** The intuitive difference in (1) and (2) mirrors the difference between logical deduction given a fact (1) vs. causal speculation (2). (1) is high probability because $P(\text{Someone else} | \text{Not Oswald} \land \text{Killed})$ is 1. (2) is low probability because $P(\text{Someone else} | \text{Not Oswald})$ is low.

  5.  **Assessment/Critique (Task 3 - My Analysis):**
      *   *Does Stalnaker succeed?* It's elegant but costly. It requires a pragmatic explanation for a semantic intuition. It struggles with embedded contexts (e.g., "If (1) is true, then..."). It relies heavily on the "context set" shifting, which can seem ad hoc.
      *   *Does Adams-Edgington vindicate?* It captures the intuition better but at the cost of logic. If indicatives lack truth values, they can't be embedded in complex propositions (negation, disjunction, conditionals). This is the "Frege-Geach" problem for probabilistic views.
      *   *Synthesis:* The Stalnakerian view preserves compositionality but strains pragmatics. The Adams view captures epistemic nuance but breaks logic. Recent work (e.g., Khoo, Mandelkern) tries to hybridize.
      *   *My Verdict:* The Stalnakerian move is theoretically conservative (keeps unified semantics) but pragmatically overburdened. The Adams view is intuitively right about usage but theoretically incomplete regarding embedding. However, for the specific purpose of the Oswald pair, Adams explains the *divergence* more naturally without needing context-shifts. But Stalnaker wins on systematicity. I should probably lean towards a nuanced critique: Stalnaker saves the semantics but makes the pragmatics do too much work; Adams captures the cognitive difference but sacrifices logical form.

