          *   *The Argument:* Autonomous vehicles (AVs) are tools or partners, not independent moral agents. The human remains in the loop (or on the loop).
          *   *Collaborative Agency:* Responsibility is distributed, not vanished. We can assign roles and duties. If the system fails, we look at design duty, maintenance duty, or supervision duty.
