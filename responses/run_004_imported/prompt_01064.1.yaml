answer: |-
  The cheap telescope was shivering slightly in the breeze, though the air was still. I folded the legs and leaned it against the picnic table. Above us, the Milky Way was a smear of spilled salt, bright enough to cast faint shadows on the hood of the car.

  "Give up?" Sarah asked. She was wrapped in a sleeping bag, holding a mug of tea that had gone cold twenty minutes ago.

  "It's just a tube of glass," I said, sinking back into the camping chair. "It doesn't show you anything your eyes can't see, just smaller."

  "Poetic. And avoidance." She took a sip anyway. "You've been quiet since we passed the county line. Still thinking about Ord?"

  "Can you blame me?" I gestured at the sky. "Look at all that real estate. For years I thought, *someone has to be home.* But then you read the numbers. The Sandberg paper. It just… clicks. We aren't missing the aliens. There aren't any aliens to miss."

  Sarah sighed, the kind of sound that comes from having a conversation for the third time. "The 'Dissolving' paper. Right. The one that says there's a fifty-percent chance we're alone in the galaxy so we can all sleep better at night."

  "That's not what it says."

  "It's what it *does*," she corrected. "It tells you the house is empty so you don't have to check the locks."

  "It's not comfort, it's statistics," I said, keeping my voice level. "We've been doing the Drake Equation wrong since the fifties. We take a guess for each term—how many stars, how many planets, how many get life—and we multiply the *best guesses*. When you do that, you get millions of civilizations. But that's fake precision. We don't know the numbers. We know ranges. Huge ranges."

  "I know the argument, Alex. Uncertainty cascades."

  "Exactly. If you admit that the chance of life starting on a planet could be one in a billion or one in a trillion, and you carry that uncertainty through the math instead of picking a winner… the probability distribution skews hard. The paper says there's up to a ninety-nine percent chance we're the only ones in the Milky Way. Even in the observable universe, it's a coin flip. The sky isn't dark because everyone died. It's dark because no one else lit the match."

  Sarah shifted, pulling the sleeping bag tighter. "Okay. Let's grant the math. Let's say their model is perfect. You're taking comfort in a conclusion that the model isn't actually designed to give you."

  "How do you figure?"

  "Because the model treats every step in the chain as independent," she said. "It treats the birth of life, the jump to complex cells, the invention of radio… it treats them like rolling dice on different tables. And it uses priors that allow for essentially zero probability. When you multiply a bunch of fractions where the floor is basically zero, you *get* zero. That's not a discovery about the universe; that's a property of the multiplication."

  "But the point is the floor *should* be zero," I countered. "We have one data point. Us. To pretend we know the odds of abiogenesis is arrogance. The paper is just being honest about our ignorance. And if you're honest about the ignorance, the default answer is solitude."

  "Solitude doesn't mean safety." She set the mug down on the ground. "This is where you lose me. You read that paper and you think, 'Oh, the Great Filter must be behind us.' If the odds of life are that low, then we've already won the lottery. We're safe."

  "Statistically, yes. If the bottleneck is the beginning, the road ahead is clear."

  "But the math doesn't tell you *where* the bottleneck is," she said sharply. "That's my problem. Imagine two worlds. In World A, life is incredibly hard to start, but once it does, it lasts forever. In World B, life starts easily everywhere, but every civilization blows itself up with nuclear weapons or AI within two hundred years."

  "Okay…"

  "In both worlds, the sky looks exactly the same," she said. "In both worlds, the product of the Drake equation is tiny. In both worlds, you run Sandberg's uncertainty model and you get the same result: 'High probability of solitude.' The math is identical. But in World A, we have a future. In World B, we're doomed."

  I paused. The wind rustled the dry grass. "So you're saying the paper is useless."

  "I'm saying it's silent on the only question that matters for existential risk," she said. "It tells us we are likely alone. It does *not* tell us why. And yet, I see people—smart people—citing it as evidence that we don't need to worry about AI or bio-engineering. They're taking the 'solitude' conclusion and smuggling in the 'safe' conclusion. They're assuming the filter is behind us because it's comforting, not because the statistics say so."

  I looked up at the smear of the galaxy. "But isn't there a Bayesian update here? If the model says it's overwhelmingly likely that the universe is empty, doesn't that weigh the scales toward the early filters? If the late filters were the problem, wouldn't we expect to see more ruins? More radio ghosts?"

  "We wouldn't see ruins if they destroyed themselves quickly enough," Sarah said. "And we wouldn't see radio ghosts if the window for using radio is short. Look, I agree with you that the old way of doing it—picking single numbers—was garbage. It created a false paradox. I'll give you that. But fixing the false paradox doesn't fix the real danger."

  She leaned forward, elbows on her knees. "Think about it like this. You're driving on a dark road. Your headlights only go ten feet. The Sandberg paper is like a passenger saying, 'Statistically, most cars never leave the driveway. So the fact that you haven't seen another car in ten miles probably just means cars rarely start.' And you're saying, 'Great, that means the road ahead is clear.'"

  "And you're saying?"

  "I'm saying, 'Or it means the cars that do leave the driveway crash at mile eleven.' The statistic about how rare cars are doesn't tell you if the road is safe. It just tells you you're lonely. Using loneliness to prove safety is a trick."

  I rubbed my face. She was right, technically. The paper calculates $N$, the number of civilizations. It doesn't calculate $L$, the lifespan, in isolation from the other variables. If $N$ is low, it could be because the probability of life ($f_l$) is low, or because the lifespan ($L$) is low. The uncertainty model swallows the distinction.

  "Okay," I said slowly. "I see the distinction. The paper dissolves the expectation of aliens. It doesn't dissolve the risk of extinction."

  "Exactly."

  "But," I added, "doesn't it shift the burden of proof? Before this paper, the default assumption was 'The universe is teeming, so where are they?' That implied a filter *must* exist ahead of us, because life clearly starts easily. Now, the default is 'Life might be incredibly rare.' If life is incredibly rare, isn't it more parsimonious to assume the hard steps are the biological ones we've already passed? Evolution is messy. AI risk is theoretical."

  "Parsimonious, yes. But is it prudent?" Sarah asked. "If you're wrong, the cost is infinity. If you assume the filter is behind us and it's actually ahead, we go extinct. If you assume the filter is ahead and it's actually behind, we waste money on safety protocols. I know which error I'd rather make."

  "So you think citing the paper is dangerous?"

  "I think citing it to *relieve* anxiety is dangerous," she said. "If you cite it to say, 'We need to work harder because we might be the only shot life has got,' that's one thing. That makes the solitude a responsibility. But usually, I hear it used as a sedative. 'Don't worry about the AI, the math says we're probably unique anyway, which implies we're special/stable.'"

  "That's a motivation problem, not a math problem," I said.

  "Motivation drives how we use the math." She looked up at the stars. "I guess what I'm saying is, I don't trust the independence assumption. Life isn't dice rolls on separate tables. If the universe is hostile to long-lived civilizations, that might be linked to why life is hard to start. Maybe the same physics that makes abiogenesis rare also makes stars unstable, or whatever. I don't know. But treating them as independent variables lets you wash your hands of the correlation."

  I nodded. "Fair. The model assumes the terms don't talk to each other. That's a simplification."

  "It's a huge one."

  We sat in silence for a while. The cold was seeping through the soles of my boots. The sky remained indifferent, vast and empty.

  "So," I said finally. "Where does that leave us? We agree the old Drake Equation was overconfident. We agree the new model shows solitude is likely. But we disagree on whether that solitude implies safety."

  "I think," Sarah said, "that we disagree on how to weigh uncertainty when the stakes are infinite. You see the huge uncertainty ranges and you think, 'This means we can't claim aliens exist.' I see the huge uncertainty ranges and I think, 'This means we can't claim we'll survive.'"

  "Because the uncertainty cuts both ways."

  "Right. The paper says there's a 53 to 99 percent chance we're alone in the galaxy. That leaves up to a 47 percent chance we aren't. If we aren't alone, and the sky is still dark, then the Filter is definitely ahead of us. That 47 percent tail risk is where all the bodies are buried."

  "And you think I'm ignoring the tail."

  "I think you're treating the median outcome as the certain outcome," she said. "The median says we're alone. But the survival of the species depends on the worst-case scenarios, not the median."

  I looked at the telescope again. A black tube pointing at nothing. "So, the math is right, but the conclusion is a policy decision."

  "The math is a map," Sarah said. "But you're using it to decide whether to wear a seatbelt. The map says 'Roads are mostly empty.' That doesn't mean you don't need the belt. It just means if you crash, no one will hear you."

  I laughed, a short, cold sound. "That's cheerful."

  "I'm here for the truth, not the cheer." She nudged my shoulder with hers. "But… I will concede one thing. If we are the only ones, that makes the 'waste money on safety' argument stronger, not weaker. If we're the only shot, we can't afford to blow it."

  "Okay. I can concede that too. If the filter is behind us, we're the inheritors. If it's ahead, we're the test subjects. Either way, we're the only ones we know of who can do anything about it."

  "See?" She smiled faintly. "We're alone either way. Might as well act like it matters."

  I looked back up. The stars didn't twinkle; they burned steady and cold. The emptiness felt heavier now, less like a shield and more like a weight. But it was a weight we were both holding.

  "Pass the tea?" I asked.

  "It's cold."

  "Doesn't matter. To the tail risk."

  She handed me the mug. "To the tail risk."
