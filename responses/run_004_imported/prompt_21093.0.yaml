answer: |-
  **Setting:** *A conference side-room. A table is set up with three distinct envelopes labeled **A**, **B**, and **C**. Inside are vouchers for different charitable causes. A "Bookie" (a grad student) stands by with a ledger and a jar of coins. **Elena** (pro-completeness) and **Marcus** (pro-incompleteness/resoluteness) stand on either side of the table, watching the setup.*

  **Elena:** Look at the state space, Marcus. It's simple. The agent starts with Envelope B. We know their preference relation is incomplete: they strictly prefer A to B ($A \succ B$), but they have genuine gaps between B and C, and C and A. They are incomparable ($B \perp C$, $C \perp A$).

  **Marcus:** I see the topology. But I don't see the pump yet. You're assuming the agent treats a gap as an invitation to swap.

  **Elena:** I'm assuming the agent is *rational*. If $B$ and $C$ are incomparable, a rational agent has no reason to reject a free swap from $B$ to $C$. It's not a loss. So, Step One: Bookie offers $C$ for $B$, free. The agent accepts. Now they hold $C$.

  **Marcus:** Fine. They hold $C$.

  **Elena:** Step Two: Bookie offers $A$ for $C$, minus one dollar. Now, here is the squeeze. The agent knows $A \succ B$. They started with $B$. They reason, "If I pay the dollar, I end up with $A$, which I definitely prefer to my starting point $B$." So they pay.

  **Marcus:** And there it is. The leak. They end up with $A$, minus a dollar. If they had just stayed at $B$, they would have $A$'s superior alternative for free? No, wait. If they stayed at $B$, they have $B$. If they swap to $A$ directly, they get $A$ for free.

  **Elena:** Exactly. If preferences were complete, the agent would know immediately that $A \succ C$ or $C \succ A$. If $A \succ C$, they'd take the trade. If $C \succ A$, they wouldn't have taken the first trade if they looked ahead. But because of the *gap*, they make locally rational moves that lead to a globally dominated outcome. They paid a dollar to get from $B$ to $A$, when $A$ was available for $B$ at par. The gap allowed the Bookie to insert a toll booth where no value was added.

  **Marcus:** You're describing a myopic agent, Elena. A child. You're building the pump by forbidding the agent from having a policy.

  **Elena:** I'm forbidding nothing. I'm testing the preference relation itself. The vNM axioms claim that if you are rational, your preferences *must* be complete. This demo is the proof by contradiction. If you have gaps, you leave yourself open to this sequence.

  **Marcus:** No. The demo proves that if you have gaps *and* you choose myopically, you get pumped. But rationality doesn't require myopia. It allows for **resoluteness**.

  **Elena:** *[Taps the table]* Define "resoluteness" without smuggling in a complete ordering.

  **Marcus:** It's a second-order constraint. The agent says, "I acknowledge $B \perp C$. I am not forced to swap. I will adopt a policy: *I do not trade across gaps unless there is a strict dominance.*" When the Bookie offers $C$ for $B$, the resolute agent says, "No. I stick with $B$." The pump never starts.

  **Elena:** But *why* do they stick with $B$? If $B$ and $C$ are truly incomparable, there is no reason to stay. Resoluteness is just a fancy word for "arbitrary tie-breaking." And if you break the tie arbitrarily, you've effectively completed the preference relation. You've silently added $B \succeq C$ to your axioms.

  **Marcus:** I haven't. A tie-breaker is a choice mechanism, not a valuation. Think of it like a physicist choosing a gauge. The physics doesn't change, but you need a convention to calculate the trajectory. My agent values $A$ over $B$. But regarding $B$ and $C$, the value is undefined. The *policy* is defined. Rationality applies to the choice function, not just the static preference ordering.

  **Elena:** That's a retreat from the standard model. If the choice function does the work, why keep the incomplete preferences at all? Occam's razor. If the agent acts *as if* $B \succeq C$ to avoid the pump, then for all functional purposes, $B \succeq C$. You're positing hidden structure—these "gaps"—that do no explanatory work because the resolute policy immediately fills them.

  **Marcus:** They do explanatory work! They prevent the agent from maximizing across incommensurable dimensions. Suppose $A$ is "Save 100 lives," $B$ is "Preserve this specific ecosystem," and $C$ is "Fund fundamental research." I can't say the ecosystem is "better" than the research. That's a category error. But I can have a policy: "Don't trade ecosystem for research just because a bookie offers it." That policy protects the integrity of the values without forcing a false comparison.

  **Elena:** Okay, let's look at the Bookie's ledger. *[She points to the grad student]* If I run this demo, and your agent is "resolute," they refuse the first trade. $B$ for $C$. Game over. No money lost.

  **Marcus:** Correct.

  **Elena:** But suppose I change the offer. I don't offer $C$ for $B$. I offer a lottery. A 51% chance of $C$ and 49% chance of $B$, for $B$ straight up. If the agent has incomplete preferences, they should be indifferent or unable to rank this. But if they refuse, they violate Continuity. If they accept, I can construct a different pump.

  **Marcus:** You're shifting the axioms. We're talking about Completeness, not Continuity.

  **Elena:** They're linked. The point is, your "resolute" agent is essentially hard-coding a path through the decision tree. But what if the Bookie offers the trades in a different order? Or what if the agent forgets their policy?

  **Marcus:** Rationality assumes the agent knows their own policy. That's the definition of an agent.

  **Elena:** Is it? In AI alignment, we worry about agents that *learn* preferences. If an AI has incomplete preferences, and it learns via reinforcement, it will update its policy to avoid negative reward. It will learn to accept the trade $B \to C$ if it realizes $C$ leads to higher reward later. It will effectively *complete* its preferences to minimize loss. The money pump isn't just a parlor trick; it's an evolutionary pressure. Any agent with gaps that gets money-pumped goes bankrupt. Any agent that survives will have completed its preferences.

  **Marcus:** That's an empirical claim, not a normative one. Just because evolution selects for maximizers doesn't mean maximizers are the only *rational* form. It just means they're the only ones that survive in *your* specific environment.

  **Elena:** But the environment includes Bookies. If you build an AI with incomplete preferences, and you deploy it in a world where other agents can make offers, it *will* be pumped unless it hardens into a maximizer. So, for alignment, we should just build the maximizer.

  **Marcus:** And that's the danger. If you force completeness on an AI that deals with human values, you force it to invent trade-offs that don't exist. You force it to decide how many lives are worth a specific ecosystem. A resolute agent with gaps can say, "I will not make that trade at any price." A maximizer *must* have a price.

  **Elena:** *[Pauses, looking at the envelopes]* So the demo... to settle this. What would it actually need to show?

  **Marcus:** It needs to show that a resolute agent *cannot* maintain the policy without contradiction. If I can write a script for the agent that says "If Gap, Hold Current," and it survives your Bookie indefinitely without violating transitivity or dominance, then Completeness is not required for rationality.

  **Elena:** And I say the script "If Gap, Hold Current" *is* a preference ordering. It's a lexicographic preference: 1. Avoid trading across gaps. 2. Maximize utility. You've just pushed the incompleteness up one meta-level. Eventually, at the top level, the preferences over *policies* must be complete.

  **Marcus:** Maybe. But that top level is about *rules*, not *outcomes*. That allows the outcome space to remain nuanced.

  **Elena:** Let's run the demo. But I want to add a twist. I want the Bookie to offer the agent a chance to *pre-commit* before the game starts. To bind themselves to "No Gap Trades."

  **Marcus:** Fine.

  **Elena:** If they pay for that pre-commitment, they've admitted their future self is irrational.

  **Marcus:** No, they've admitted their future self is *temporally situated*. Rationality is a trajectory through time, not a point evaluation.

  **Elena:** *[Nods to the grad student]* Start the run. Agent starts with $B$. Bookie offers $C$ for $B$, free.

  *[The grad student looks at a laptop screen simulating the agent. The cursor hovers.]*

  **Marcus:** Watch. It holds.

  **Elena:** It holds because you programmed it to hold. You didn't prove gaps are rational; you proved that *rules* can override preferences. But where do the rules come from? If the rules are arbitrary, the agent is irrational. If the rules are based on reasons, those reasons constitute a preference ranking.

  **Marcus:** The reason is "I refuse to compare incommensurables." That's not a ranking of $B$ vs $C$. It's a ranking of *types of deliberation*.

  **Elena:** And if I offer you a million dollars to swap $B$ for $C$?

  **Marcus:** Then dominance kicks in. The money dominates the gap.

  **Elena:** So there *is* a price.

  **Marcus:** No. There's a point where the money becomes the dominant dimension, collapsing the gap. But until then, the gap is real.

  **Elena:** *[Sighs]* You know, in physics, if your theory predicts a singularity, we usually assume the theory breaks down, not that the singularity is real. Incomplete preferences look like a singularity in the utility function.

  **Marcus:** And yet, humans live with singularities every day. We choose between careers, partners, moral duties without a common currency. If we want AI to align with *us*, maybe it should handle the singularities, not smooth them over with a fake currency.

  **Elena:** If the AI handles them by being resolute, it becomes rigid. Unoptimizable.

  **Marcus:** Or it becomes safe.

  *[The grad student looks up.]*

  **Grad Student:** Uh, the simulation is done. The agent held $B$. Bookie tried offering a lottery. Agent refused. Bookie offered a pre-commitment contract to ban gap-trades. Agent accepted it for free.

  **Elena:** Accepted for free?

  **Grad Student:** Yes. It valued the policy constraint higher than the option value of the trades.

  **Elena:** *[Turns to Marcus]* There. It valued the constraint. That's a utility function over policies. It's complete at the meta-level.

  **Marcus:** *[Smiles]* And incomplete at the object level. Which is exactly where we want it.

  **Elena:** We're going to disagree on what "rational" means until one of us gets money-pumped in the real market.

  **Marcus:** Or until one of us realizes that not everything worth having has a price.

  **Elena:** *[Picks up Envelope A]* I'll take A. I know what it's worth.

  **Marcus:** *[Picks up Envelope B]* And I'll keep B. I know what it's not.

  *[They stand there, the Bookie waiting for the next round, the jar of coins untouched.]*
