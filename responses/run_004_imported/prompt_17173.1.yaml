answer: |-
  1. **Topic: The Excuse/Exemption Distinction in Hard Cases**
     In *Freedom and Resentment*, P.F. Strawson distinguishes between *excuses* (which admit the demand but mitigate the blame) and *exemptions* (which suggest the agent isn't a suitable target of demands at all). But in cases of severe childhood deprivation or chronic addiction, the line seems to blur: the person is still technically a participant in interpersonal relationships, yet their capacity to respond to reasons is deeply compromised. If we can't clearly say whether we are modifying the demand or withdrawing it, does the Strawsonian framework lose its grip on whether resentment is actually appropriate in these borderline cases?

  2. **Follow-up to Q1 (Keyed to her likely defense of the distinction)**
     *Context: She will likely argue that the distinction holds because we can still hold the person accountable in some contexts while mitigating in others.*
     If the practice allows us to toggle between holding them accountable and exempting them depending on the context, doesn't that suggest the "responsibility" isn't a fact about the *agent*, but merely a reflection of our own fluctuating willingness to engage? If so, how do we answer the skeptic who says we are just manipulating the definition of responsibility to suit our emotional convenience?

  3. **Topic: Susan Wolf's Asymmetry Worry**
     Susan Wolf has argued that there is a deep asymmetry in how we treat determined agents: we seem ready to excuse bad conduct if it flows from a determined character, yet we hesitate to withhold credit for good conduct that flows from the same kind of determined character. As a Strawsonian, you ground responsibility in our reactive attitudes. But our attitudes *are* asymmetrical—we feel gratitude more easily than we relinquish resentment. Is your view forced to accept this asymmetry as a brute fact, even if it looks irrational from the outside?

  4. **Follow-up to Q2 (Keyed to her likely appeal to the value of the attitudes)**
     *Context: She will likely argue that positive and negative reactive attitudes serve different social functions, justifying the asymmetry.*
     But if the causal history of the "good" action and the "bad" action is identical—both fully determined by prior events—doesn't grounding the difference solely on the *function* of our attitudes risk making moral responsibility entirely instrumental? If it's just about what works for social cohesion, have we not abandoned the idea that the agent *deserves* the praise or blame in a non-consequentialist sense?

  5. **Topic: The Naturalistic Fallacy Charge (Pereboom/Galen Strawson)**
     Derk Pereboom and Galen Strawson have both pressed the charge that moving from "we cannot help but have reactive attitudes" to "these attitudes are justified" commits a naturalistic fallacy. They argue that describing the inescapability of our practices doesn't normatively validate them. How do you respond to the claim that Strawsonian naturalism simply describes a psychological compulsion and mistakenly labels it a moral justification?

  6. **Follow-up to Q3 (Keyed to her likely rejection of the Is/Ought gap in this context)**
     *Context: She will likely argue that responsibility is *constituted* by the practice, not inferred from it, so the Is/Ought gap doesn't apply.*
     If responsibility is constituted by the practice, does that mean any stable practice of holding responsible is automatically valid? If a community developed a stable, inescapable practice of resenting people for their height or skin color, would your view be forced to say that resentment is "warranted" within that form of life, or do you have resources to call that practice simply wrong?

  7. **Topic: Normative Criticism of Biased Practices**
     This leads directly to the worry about social justice. If moral responsibility is ultimately constituted by our actual reactive practices, it seems difficult to say a community is *mistaken* to resent people more harshly because of their race, poverty, or disability, provided that resentment is a stable part of their interpersonal life. How can a Strawsonian critique systemic biases in our blaming practices without appealing to a standard of responsibility outside of those very practices?

  8. **Follow-up to Q4 (Keyed to her likely appeal to internal norms of fairness)**
     *Context: She will likely argue that the practice itself contains internal norms of fairness and accuracy that allow for self-correction.*
     But if those internal norms of fairness are themselves products of the same biased society that generates the racist or classist resentment, aren't we just using one part of the biased practice to critique another part? Without an external, metaphysical anchor—like the libertarian free will my friend was defending—how do you guarantee that the "self-correction" doesn't just reinforce the status quo?
