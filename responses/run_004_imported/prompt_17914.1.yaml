          *   *Selected Toy Example:* The "Assassination of Lincoln" or a simpler "Missed Shot." Let's go with a simpler "Failed Attempt" scenario that mirrors the structure without the temporal weirdness. Actually, the "suicide" example or "missing the bus" is often good. Let's try a "Locked Door" scenario.
          *   *Better Toy Example:* **The Deterministic Sniper.** A sniper shoots at a target. He has the skill, the gun, the wind is calm. He *can* hit the target (ability). But he *misses*. So, relative to the fact that he missed, he *could not* have hit. This mirrors the Tim case perfectly without time travel. It isolates the "ability vs. outcome" tension.
      *   **The Mechanics of "Compossibility":** Explain that "Tim can kill Grandfather" = "There is a possible world where Tim kills Grandfather consistent with facts set A." "Tim cannot kill Grandfather" = "There is NO possible world where Tim kills Grandfather consistent with facts set B."
      *   **Why it's not a Contradiction:** $P$ is possible relative to $F_1$. $P$ is impossible relative to $F_2$. This is standard modal logic. $ \Diamond_{F1} P $ and $ \neg \Diamond_{F2} P $. No contradiction unless $F_1 = F_2$.
      *   **Addressing the Roommate's Intuition:** Why does the roommate feel Tim *must* be able to do it? Because they are fixing only *intrinsic* facts (muscle strength, gun mechanics). Why does Lewis say he *can't*? Because we must also fix *extrinsic* facts (Grandfather's survival).
      *   **The "Changing the Past" Illusion:** This is the metaphysical payload. If Tim kills Grandfather, he changes the past. Lewis says the past is unchangeable. Therefore, the facts of the past (Grandfather lived) are hard constraints.
      *   **Why this isn't just stipulation:** Because *all* ability claims involve fixing some facts and ignoring others. If I say "I can run a 4-minute mile," I am ignoring the fact that I am currently sitting down. If I fix "currently sitting," I cannot. The time travel case just forces us to acknowledge that "Grandfather survived" is a fact we *must* fix if we want to talk about the actual world.

