      *   **The Goal:** Explain the *mechanics* of Lewis's move on "can," specifically why it's not a flat contradiction to say Tim both can and cannot kill Grandfather. Needs to explain the role of "holding facts fixed" (compossibility) and why this carving is intuitive, not just stipulative. A toy example is welcome if it clarifies the logic.

  2.  **Deconstruct Lewis's Argument:**
      *   **The Paradox:** Time travel seems to allow changing the past. Changing the past implies a contradiction (Grandfather is dead and alive). Therefore, time travel is impossible.
      *   **Lewis's Move:** Time travel does *not* allow changing the past. It allows affecting the past, but not changing it (because the past already includes the traveler's presence).
      *   **The "Can" Claim:** Tim *can* kill Grandfather (relative to some facts) and Tim *cannot* kill Grandfather (relative to other facts). This is not a contradiction because "can" is context-sensitive (equivocal).
      *   **The Core Mechanism:** "Can" means "is compossible with." Compossible with *what*? That's the context.
      *   **The Layperson's Intuition:** "Can" implies physical ability + opportunity. Tim has those. So he "can."
      *   **Lewis's Rebuttal:** "Can" also implies logical consistency with the *actual* outcome. Since Grandfather *didn't* die, Tim "cannot."
      *   **The Crucial Insight:** The contradiction only arises if we demand "can" be evaluated against *all* facts simultaneously (including the future fact that Grandfather lived). But ability claims are never evaluated against *all* facts.

  3.  **Identify the Weak Point in the User's Understanding:**
      *   The user feels Lewis is "dissolving the paradox by stipulation." This suggests they see the ambiguity of "can" as a cheat code rather than a genuine feature of modal language.
      *   I need to show that *everyone* uses "can" this way in non-time-travel contexts. The time travel case just makes the context shift glaringly obvious.
      *   I need to make the "holding fixed" mechanism concrete.

  4.  **Drafting the Explanation - Step-by-Step:**

      *   **Acknowledge the PhD Status:** Don't talk down. Use precise terminology but focus on the *intuition*. Validate that the roommate's objection is the standard "fatalist" objection.
