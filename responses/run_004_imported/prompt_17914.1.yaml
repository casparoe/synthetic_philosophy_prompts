answer: |-
  This is not a dumb question. In fact, your roommate has stumbled onto the exact objection that keeps philosophers of time awake at night: the charge that Lewis is engaging in **verbal sleight-of-hand**. It feels like he's defining the problem away by saying " 'can' is ambiguous," rather than explaining how a physical agent with a gun fails to pull the trigger.

  Since you're in the PhD program, I'll skip the intro summary and go straight for the jugular of the modal mechanics. The reason Lewis's move feels like stipulation is that we often conflate **causal capacity** with **logical compossibility**. Lewis's resolution works only if you accept that *all* ability claims are context-sensitive claims about compossibility with a selected set of facts.

  Here is the mechanical walkthrough of why "Tim can and cannot kill Grandfather" is not a contradiction, using a toy example to isolate the logic from the temporal weirdness.

  ### 1. The Linguistic Mechanism: "Can" is Always Contextual

  Lewis's core claim is that "can" is an incomplete predicate. To say "X can do Y" is always shorthand for "X can do Y, **given a specific set of fixed facts F**."

  If you change the set $F$, the truth value of the ability claim can flip without contradiction. This is not special to time travel; it is how modal language works everywhere.

  **The Toy Example: The Missed Putt**
  Imagine a golfer, Alice, lining up a 3-foot putt.
  *   **Facts Set A (Intrinsic/Causal):** Alice has good eyesight, her hands aren't shaking, the green is flat, the club is straight.
  *   **Facts Set B (The Actual Outcome):** Alice *missed* the putt. (This is a hard fact of the actual world).

  Now, evaluate the claim: "Alice can sink this putt."
  *   Relative to **Set A**: True. There is a possible world consistent with Set A where the ball goes in. She has the causal capacity.
  *   Relative to **Set B**: False. There is *no* possible world consistent with Set B where the ball goes in, because Set B includes the fact that the ball *did not* go in.

  Is it a contradiction to say "Alice can sink the putt (relative to A) and Alice cannot sink the putt (relative to B)"? No. It's just modal relativization.

  **The Roommate's Intuition:** Your roommate is evaluating "can" relative to **Set A**. She is looking at causal capacity (gun works, finger works, aim is true).
  **Lewis's Intuition:** Lewis is evaluating "can" relative to **Set A + B**. He is looking at *all-in* compossibility, which includes the fact that Grandfather survived to have children.

  ### 2. Why This Isn't Just Stipulation (The Metaphysical Payload)

  The reason this feels like a cheat in the time travel case (but not the golf case) is that in the golf case, the "outcome fact" (Set B) happens *after* the ability is exercised. In time travel, the "outcome fact" (Grandfather's survival) is in the *past* relative to the action.

  This is where the metaphysics does the heavy lifting. Lewis is a **B-Theorist / Eternalist**. For Lewis, the past is not "gone"; it is just located elsewhere in the manifold, just as real as the present.

  *   **Standard View:** The past is fixed because it's gone. The future is open.
  *   **Lewis's View:** The past is fixed because it is **actual**. The future is also fixed (in the sense that there is a fact of the matter about what happens), but we don't know it yet.

  If Tim travels to 1921, 1921 is just as real as 2024. The fact "Grandfather is alive in 1922" is a hard constraint on reality, just like "The ball missed the hole."

  Therefore, when we ask "Can Tim kill Grandfather?", we are asking: **"Is there a possible world consistent with the actual laws and the actual facts where Tim kills Grandfather?"**

  Since the actual facts include "Grandfather was not killed," the answer is **No**.
  But since the actual facts *also* include "Tim has a loaded gun and motive," the answer (if we ignore the survival fact) is **Yes**.

  Lewis argues that when we are discussing the *paradox*, we are asking about the **all-in possibility**. We are asking if the *total scenario* is consistent. The paradox arises because we intuitively think:
  1.  Tim has the ability (Set A facts).
  2.  If you have the ability, you can do it (All-in).
  3.  Therefore, Tim can kill Grandfather.
  4.  But if he does, contradiction.

  Lewis cuts premise 2. Having the causal capacity (Set A) does not guarantee all-in possibility (Set A + B) if Set B contains a fact that contradicts the action.

  ### 3. Addressing the "Why Couldn't He?" Objection

  Your roommate asked: *"Ok but why couldn't he, if he's got the gun and a clear shot and the will to do it?"*

  This is the **Fatalist Objection**. It sounds like Lewis is saying "Some force will stop the gun from firing." Lewis explicitly denies this. There is no mysterious force. No jammed gun, no sudden slip.

  Here is the precise explanation to give your roommate:

  > "You are asking for a **causal explanation** for why the gun doesn't fire. But Lewis isn't offering a causal story; he's offering a **logical constraint**.
  >
  > Imagine you bet me $100 that I can't name a married bachelor. I say, 'I have the vocal cords, the language skills, and the breath to say the words "married bachelor." Why can't I?'
  >
  > The answer isn't that your throat will close up. The answer is that **success is defined in a way that excludes the outcome.**
  >
  > In the time travel case, 'Tim killing Grandfather' is like 'naming a married bachelor.' It's not that the gun jams. It's that the description of the world where Tim kills Grandfather is **not the actual world**.
  >
  > If Tim pulls the trigger, something *will* happen. He might slip. The gun might jam. Grandfather might duck. But whatever happens, it must be consistent with the fact that Grandfather survived. Lewis isn't saying Tim lacks the *power* to kill; he's saying the *opportunity* is logically excluded by the facts of history."

  ### 4. The "Compossibility" Work

  To internalize this, you need to see "compossibility" not as a magical shield, but as a **selection function for possible worlds**.

  When we evaluate ability claims, we look at a sphere of possible worlds around the actual world.
  *   **Roommate's Sphere:** Worlds where the intrinsic properties of Tim and the Gun are held fixed. In many of these worlds, Grandfather dies. (So, "He can.")
  *   **Lewis's Sphere:** Worlds where the intrinsic properties **AND** the historical facts of 1922 are held fixed. In *none* of these worlds does Grandfather die. (So, "He cannot.")

  The paradox dissolves because the contradiction only exists if you insist there is only **one** sphere of relevance for the word "can." Lewis shows that ordinary language shifts spheres constantly.

  **Example:**
  "I can speak French."
  *   **Context 1 (General Ability):** True. (Fixed facts: My brain state, education).
  *   **Context 2 (Right Now):** False. (Fixed facts: I am currently gagged).

  We don't say, "Wait, is it a contradiction that you can and cannot speak French?" We understand the context shifted. Lewis argues the Time Travel case is just an extreme version of the "Gagged Speaker" case. The "gag" is the logical consistency of the timeline.

  ### 5. Summary for Internalization

  To truly internalize this, stop thinking about it as "Time Travel prevents murder." Think of it as **"Actuality constrains Possibility."**

  1.  **The Contradiction:** The paradox claims: (1) Tim can kill GF, (2) Tim cannot kill GF.
  2.  **The Lewis Move:** (1) is true relative to *local* facts (gun, aim). (2) is true relative to *global* facts (GF's survival).
  3.  **The Non-Contradiction:** $Can_{local}(Kill)$ and $\neg Can_{global}(Kill)$ are compatible.
  4.  **The Metaphysics:** Because Lewis is an Eternalist, GF's survival is a "global fact" just as hard as "I am currently gagged."
  5.  **The Causal Story:** Nothing stops Tim locally. He pulls the trigger. But the *result* of that pull must be consistent with the global facts. So he misses, or the gun jams, or he kills someone else. The "cannot" is not a causal block; it is a **truth-condition block**.

  If you explain it to your roommate as **"You're asking about his capacity; Lewis is talking about the consistency of the story,"** you capture the distinction between the *capacity sense* of 'can' and the *all-in compossibility sense* of 'can'. Lewis argues that when we ask about the *possibility of time travel*, we are asking the all-in question.

  Does that help bridge the gap between the jargon and the intuition?
