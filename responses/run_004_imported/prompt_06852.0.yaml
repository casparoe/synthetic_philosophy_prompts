answer: |-
  **To:** Peace and Social Concerns Committee
  **From:** [Your Name]
  **Date:** [Date]
  **Subject:** Recommendation regarding CO support letter for Theo

  Friends,

  I know we're all feeling the weight of this decision going into Thursday. I've spent the last few days turning Theo's case over in my mind, reading over the notes from our last two discussions, and trying to listen to where the Spirit might be leading us in this tension. I'm writing this memo to offer a clear recommendation, but also to lay out the reasoning so we can discuss it openly without talking past one another.

  **The Situation**
  As we know, Theo is asking for a letter of support for Conscientious Objector status. He is sincere, thoughtful, and has done the hard work of discernment. However, he is not a traditional pacifist. He has stated clearly that he would fight to defend our soil if invaded, but he cannot participate in *this* specific overseas conflict because he believes it fails the test of justice.

  **The Split**
  Our committee is divided, and I believe both sides are holding onto important truths.

  *   **The Case for Declining (Side A):** Some of us feel that Conscientious Objection, historically and legally, is about opposing "war as such." If we support selective objection, we risk undermining the legal framework that protects COs. There is a practical fear here: if every soldier decides for themselves whether a war is just, military cohesion breaks down. Furthermore, as Quakers, our Peace Testimony has traditionally been against *all* war. Supporting a "pick and choose" stance feels like it might dilute that testimony.
  *   **The Case for Supporting (Side B):** Others of us feel that conscience doesn't work in absolutes. We all agree that history contains wars that were genuinely unjust. If a war is unjust, participating in it is a moral wrong. To tell Theo he must oppose *all* violence before he can oppose *this* violence feels like putting a bureaucratic hurdle in front of a moral imperative. It asks him to deny his love for his country in order to prove his love for peace.

  **Thinking Through the "Duty to Judge"**
  I borrowed a book on Just War theory, and it left me with the question the committee raised: *Is it the soldier's place to judge the war?*

  If we say "no," we are saying that morality stops at the edge of the uniform. But we live in a democracy where citizens are ultimately responsible for the actions of their government. We already accept that soldiers have a duty to refuse illegal orders (like harming civilians). Theo is arguing that an unjust war is, in essence, an illegal order on a massive scale. If we agree that some wars are truly unjust, then we must agree that a person of conscience needs a way to say "no" to that specific injustice, even if they aren't ready to say "no" to everything.

  **My Recommendation**
  After weighing this, **I recommend that we write the letter of support.**

  However, I suggest we write it with a specific focus that might help bridge the gap between the two halves of our committee.

  **Why Support?**
  Our primary role is not to act as the Draft Board. We are not deciding if he meets the legal code; we are testifying to the sincerity of his spiritual and moral journey. Theo has come to us because his conscience is binding him. As Quakers, we believe in the authority of the Inner Light. If Theo has discerned, in good faith, that this war violates his conscience, our job is to support his integrity, not to police the boundaries of his pacifism. To turn him away because his pacifism isn't "pure" enough feels like adding a burden to someone already carrying a heavy one.

  **Addressing the Concerns (The Condition)**
  To honor the concerns of those who feel this stretches the definition of CO too far, I propose we draft the letter with radical honesty.

  1.  **Do not claim he is a traditional pacifist.** We should not try to mold his words to fit the legal definition of "opposition to all war." If we do that, we are being dishonest, and the Draft Board will see through it.
  2.  **Testify to the depth of his discernment.** The letter should focus on how seriously he has taken the question. We can write that he has struggled deeply with the question of defense, that he is not taking the easy way out, and that his refusal is born of a deep moral conviction about *this* conflict, rather than a general aversion to service.
  3.  **Acknowledge the tension.** It is acceptable for the letter to acknowledge that his position is complex. We can state that while he does not fit the traditional mold of absolute non-participation, his objection is rooted in the same moral soil that our Peace Testimony grows from: the belief that human life is sacred and that we must not participate in evil.

  **Conclusion**
  If we write this letter, we must go in with our eyes open. The Draft Board may still reject Theo's application because selective objection is often not recognized in law. But our letter isn't just for the Board; it's for Theo. It tells him that his community stands with him in his struggle to do what is right, even when the "right" thing is complicated.

  We can support his conscience without necessarily endorsing every theological implication of it. We are supporting *him*, not a policy.

  I hope this gives us a solid starting point for Thursday. I'm ready to draft a version of the letter based on this approach if the committee agrees.

  In friendship,

  [Your Name]
