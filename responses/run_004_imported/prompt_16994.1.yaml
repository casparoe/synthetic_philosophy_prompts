answer: |-
  **Setting:** *A cluttered study, late evening. Two armchairs face each other across a low table strewn with papers, half-empty pipes, and coffee cups. C.S. (Peirce) sits rigidly, adjusting his spectacles. W.J. (James) leans forward, energetic, gesturing with a pen.*

  **C.S.:** You know, William, I had to coin a new word. "Pragmaticism." Ugly enough to be safe from kidnappers.

  **W.J.:** *(Chuckles)* I saw that. You treat your own child like a piece of property, Charles. You branded it so no one else could play with it. But tell me, does this new label change the machinery? Or is it just a new coat of paint on the same engine?

  **C.S.:** It changes the load-bearing walls. You took a logical maxim—a rule for clarifying hard words and concepts—and you turned it into a theory of truth. That was the error. The maxim is about meaning: conceive what effects your object might have, and your conception of those effects *is* your conception of the object. But then you went further. You said truth *is* the utility.

  **W.J.:** I said truth *happens* to an idea. It becomes true, is *made* true by events. Surely you see the difference between a static correspondence and a living verification? If a belief guides me successfully through the thicket of experience, if it saves me from frustration, if it connects me to reality without jamming the gears—what more do you want? That *is* the cash value.

  **C.S.:** I want to know what happens when the cash is counterfeit. Suppose I am a grieving father. I believe my dead son is happy in a better place. This belief comforts me. It stabilizes my emotions. It allows me to function socially. By your metric, this belief "works." It has positive cash value. Therefore, is it true?

  **W.J.:** You're truncating the timeline, Charles. "Works" doesn't mean "feels good tonight." It means works over the long run, and works in consistency with *all* other verified truths. If your belief in the afterlife leads you to ignore the physical realities of death, or if it clashes with your other scientific understandings of consciousness, it will eventually create friction. It will stop working. The lie is only "true" so long as it doesn't crash into a wider system of experience.

  **C.S.:** But who decides when it crashes? You? Me? The community? If truth is merely what is "expedient in the way of thinking," then truth is plastic. It bends to the shape of our needs. I fear you are opening the door to a subjectivism where the stubbornness of reality is lost.

  **W.J.:** And I fear you are locking the door and throwing away the key! You define truth as the "final opinion" upon which inquiry would settle if pushed to the limit. The ideal limit. But Charles, none of us will ever be there. It's a horizon we walk toward but never reach. For a living man, breathing and suffering *now*, your truth is useless. It's a theological absolute disguised as logic.

  **C.S.:** It is not theological. It is realistic.

  **W.J.:** Is it? Here is my charge against you, and I want you to answer it plainly. You say inquiry converges. You say we are "fated" to agree on the final opinion. But *why*? Why would inquiry converge unless there was something *outside* of inquiry pushing us all toward the same spot?

  **C.S.:** Precisely. There is.

  **W.J.:** Aha! So there *is* an independent reality. A "thing-in-itself."

  **C.S.:** Not a thing-in-itself in the Kantian sense. But there is a Secondness. A brute resistance. When I push against a door, the door pushes back. That resistance is reality. It is independent of what *I* think, though not independent of thought *in general*.

  **W.J.:** But if you admit that the convergence is caused by an independent reality constraining our opinions, then you've smuggled correspondence theory back in through the back door! Your "final opinion" is only the truth because it *matches* that independent reality. So why the charade? Why not just say, "Truth is the correspondence of belief to reality," instead of this elaborate dance about "fated opinions"?

  **C.S.:** Because correspondence is a empty metaphor unless you define *how* the mind hooks onto the world. "Matching" is a picture, not an argument. My definition tells you *how* we access that reality: through the method of science, through the community of inquirers correcting each other over centuries. Your definition accesses reality through individual satisfaction. That is the danger. If you make truth dependent on the individual's experience of "working," you lose the corrective power of the community.

  **W.J.:** But the community is made of individuals! You speak of "Science" with a capital S, as if it were a priestly caste. But scientists are men with passions. They have biases. They have "wills to believe." You think you can scrub the human element out of inquiry, but you can't. The decision to pursue *this* hypothesis and not *that* one is often driven by what we *hope* is true.

  **C.S.:** Hope is not a method.

  **W.J.:** Hope is a motive! And motives matter. If a belief in free will makes a man moral, and a belief in determinism makes him despondent and lazy, then the belief in free will has more "truth" in it, because it generates a better reality. You talk about beliefs paying rent in predictions. I say beliefs pay rent in *life*.

  **C.S.:** This is where we part ways. You are conflating the *good* with the *true*. They may overlap, but they are not identical. A belief can be beneficial and false. A belief can be true and disastrous. If the universe is cold and indifferent, believing it is warm and loving does not make it so, even if it helps you sleep. The "final opinion" will eventually strip away the comforting illusion because the illusion will fail to predict the next observation.

  **W.J.:** But how do you know the illusion will fail? If the illusion is unfalsifiable? If it sits comfortably alongside all other observations? You rely on the assumption that reality *wants* to be known, that it will eventually force itself upon us. That is a faith, Charles. No less than my faith that the universe is pluralistic and open to human contribution.

  **C.S.:** It is not faith. It is a necessary presupposition of logic. To argue against me is to assume that there is a correct answer to our dispute. If there is no final opinion, no state where our disagreement is resolved by the evidence, then arguing is pointless. You are using logic to argue against the telos of logic.

  **W.J.:** *(Leans back, smiling)* I am using logic to argue against the *tyranny* of logic. You want to freeze the world into a system. I want to keep it open. My worry is this: Your "Pragmaticism" ends up being a realism that takes a thousand years to verify. Mine is a humanism that works today. If I must choose between a truth that is dead until the end of time, and a truth that lives now, I choose the living one.

  **C.S.:** And I choose the one that remains true when you are dead. If your "living truth" depends on your specific needs, your specific culture, your specific psychology, then it dies with you. I am trying to save truth from the graveyard of history.

  **W.J.:** And I am trying to save it from the icebox of abstraction.

  *(Silence hangs between them. The fire crackles.)*

  **C.S.:** So. We agree that beliefs must have practical consequences.

  **W.J.:** We agree that reality resists us.

  **C.S.:** But you think that resistance is just one more element of the experience to be navigated.

  **W.J.:** And you think that resistance is the anchor that holds the whole ship.

  **C.S.:** I think without the anchor, you are drifting.

  **W.J.:** And I think without the wind, you are stuck.

  **C.S.:** *(Picks up his pen)* I shall keep the ugly word, then. "Pragmaticism." To mark the anchor.

  **W.J.:** *(Stands up, clapping C.S. on the shoulder)* And I shall keep "Pragmatism." For the wind. Just don't be surprised if the sailors prefer my name.

  **C.S.:** Let them sail. I am interested in where the ocean floor lies.

  **W.J.:** And I am interested in the sailing.

  *(They stand in the dim light, neither conceding, the gap between the anchor and the wind remaining unbridged.)*
