          *   *Pros:* Parsimonious (ontologically), avoids vagueness of composition, aligns well with fundamental physics (atoms/fields don't really "compose" macroscopic objects in a deep sense).
          *   *Cons:* Highly revisionary of common sense (no tables, no chairs, only simples arranged table-wise). Hard to account for conscious subjects (are we just simples?).
          *   *Verdict:* Very strong theoretically, costly intuitively. Often considered the main rival to Universalism.

      *   **Universalism (Unrestricted Composition):**
          *   *Pros:* Respects common sense existence claims (tables exist, *and* trouts-turkeys exist), avoids vagueness (composition never fails), elegant formal mereology.
          *   *Cons:* Ontologically profligate (commitment to bizarre objects like "trout-turkeys"), modal weirdness (necessity of composition).
          *   *Verdict:* Theoretically elegant, ontologically expensive. Usually tied with Nihilism as the two "extreme" but logically robust positions.

      *   **Van Inwagen's Organicism (Life):**
          *   *Pros:* Saves conscious subjects (we exist), avoids trout-turkeys.
          *   *Cons:* "Life" is vague (when does life begin/end?), seems arbitrary (why life and not cohesion?), leads to the "problem of the many" for organisms. Van Inwagen himself has expressed doubts about it over time.
