prompt: |-
  So there's this whole zoo of competing answers to van Inwagen's Special Composition Question ("under what conditions do some objects compose a further object?") and I want your actual take on which ones hold up, not just a textbook rundown of them. Can you rank the following by how philosophically defensible they are: universalism (unrestricted composition), mereological nihilism, van Inwagen's own organicism (the "Life" answer), Markosian's brutal composition, contact/fastening/cohesion-type restricted answers, and Hirsch-style quantifier variance answers that try to dissolve the question instead of answering it. Give it to me as a tier list, S = most defensible, F = basically indefensible, in a JSON block like:

  ```json
