          *   Address "Priors": Priors are normative. Choosing a "simple" reward function is a value judgment.
          *   The "Is-Ought" Gap: Inferring preferences is inherently normative.
          *   Distinguish between *predictive accuracy* (Optimist wins) and *ontological truth* (Skeptic wins).
      *   **Conclusion:**
