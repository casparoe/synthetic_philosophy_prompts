prompt: |-
  So i went down a bit of a rabbit hole reading Keynes's old essay "Economic Possibilities for our Grandchildren" -- the one where he predicts that by now we'd basically be working 15 hour weeks because we'd be so much richer. Obviously that didn't happen. What got me more interested tho is the stuff underneath that prediction: his split between "absolute" needs and "relative" needs (the second kind being about feeling ahead of other people, which he thought could never really be satisfied no matter how rich everyone got), and how he says once scarcity is solved the real problem becomes moral/psychological rather than economic -- we'd have to relearn how to just enjoy life instead of treating money-making as an end in itself. I also found out he ran with the Bloomsbury crowd and was big into G.E. Moore's philosophy, where the stuff that's actually good for its own sake is basically love, beauty, and knowledge, full stop.

  Given all that, what do you think Keynes would actually say if he saw the world today -- hustle culture, people on huge salaries still grinding 60+ hour weeks, ads and social media constantly manufacturing new "relative" wants, and now AI potentially about to automate a ton of jobs on top of all that. Would he say we just never did the moral growing up he thought was coming, would he point to something he didn't see coming (like status competition getting way more sophisticated and addictive than he imagined), or would he admit his whole framework was kind of naive? Also curious if he'd actually be into something like UBI as a step toward the world he wanted, or if he'd think that's missing the point. Don't just give me a generic "here's what an economist would think about AI" answer -- actually ground it in what the guy believed.
