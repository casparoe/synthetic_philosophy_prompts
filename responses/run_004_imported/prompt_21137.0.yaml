answer: |-
  ### 1. Pure vs. Mixed Dominance: Comparison and Example

  **The Difference**
  The procedure allowing elimination by **mixed strategies** is strictly more powerful than the one restricted to **pure strategies**.
  *   **Pure Strategy Dominance:** A strategy $s_i$ is eliminated only if there exists a single pure strategy $s'_i$ that yields a higher payoff against *every* possible strategy profile of the opponents.
  *   **Mixed Strategy Dominance:** A strategy $s_i$ is eliminated if there exists a probability distribution (mixture) over other strategies that yields a higher expected payoff against *every* opponent profile.

  Because the set of mixed strategies is the convex hull of pure strategies, a mixture can "average out" the weaknesses of individual pure strategies. Consequently, a strategy might not be dominated by any single pure strategy but can still be strictly dominated by a mix of them. Therefore, the set of strategies surviving Mixed IEDS is a subset (often a proper subset) of those surviving Pure IEDS.

  **Concrete Example**
  Consider a game where Player 1 chooses a row (T, M, B) and Player 2 chooses a column (L, R).

  | P1 \ P2 | L | R |
  | :--- | :---: | :---: |
  | **T** | 3, 0 | 0, 0 |
  | **M** | 0, 0 | 3, 0 |
  | **B** | 1, 0 | 1, 0 |

  *   **Pure IEDS:** Strategy **B** is not strictly dominated by **T** (because $1 > 0$ against R) nor by **M** (because $1 > 0$ against L). No strategies are eliminated.
  *   **Mixed IEDS:** Consider a mixed strategy $\sigma_1$ that plays **T** with probability 0.5 and **M** with probability 0.5.
      *   Against **L**: Expected payoff is $0.5(3) + 0.5(0) = 1.5$. Since $1.5 > 1$, the mix beats **B**.
      *   Against **R**: Expected payoff is $0.5(0) + 0.5(3) = 1.5$. Since $1.5 > 1$, the mix beats **B**.
      *   **Result:** **B** is strictly dominated by the mixed strategy and is eliminated.

  ---

  ### 2. Equivalence to Rationalizability

  The equivalence between Mixed IEDS and Rationalizability depends entirely on the number of players and the assumptions regarding beliefs.

  **The Two-Player Case**
  In two-player games, **Mixed IEDS is equivalent to Rationalizability.**
  This is established by **Pearce's Lemma** (1984), which proves that a strategy is strictly dominated by a mixed strategy if and only if it is **never a best response** to any belief about the opponent's strategy. Since Rationalizability is defined as the set of strategies that survive the iterated elimination of strategies that are never a best response, the two procedures yield the exact same set of surviving strategies.

  **The Multi-Player Case ($N > 2$)**
  In games with more than two players, the equivalence **does not necessarily hold**. It depends on whether a player's beliefs about different opponents are allowed to be **correlated**.

  *   **Correlated Beliefs (Equivalence Holds):**
      If players are allowed to hold correlated beliefs (believing opponents might coordinate their strategies), Mixed IEDS remains equivalent to Rationalizability. Strict dominance requires a strategy to be inferior against *all* pure strategy profiles of the opponents. Mathematically, this is equivalent to the strategy being inferior against *all* probability distributions over those profiles (including correlated ones). Thus, a strategy survives Mixed IEDS if and only if it is a best response to *some* correlated belief.

  *   **Independent Beliefs (Equivalence Fails):**
      Standard Rationalizability often assumes **independent beliefs** (players believe opponents choose strategies independently).
      *   **The Divergence:** The set of independent beliefs is a strict subset of all possible (correlated) beliefs. Consequently, it is harder for a strategy to be a "best response" under the independence constraint.
      *   **The Result:** Independent Rationalizability is a more demanding concept; it eliminates **more** strategies than Mixed IEDS. A strategy might survive Mixed IEDS (because it is a best response to a *correlated* belief) but be eliminated by Independent Rationalizability (because it is not a best response to any *independent* belief).

  **Conclusion:** Mixed IEDS is equivalent to Rationalizability **if and only if** correlated beliefs are permitted. If beliefs must be independent, Mixed IEDS yields a larger set of surviving strategies.
