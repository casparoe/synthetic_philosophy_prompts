          *   Scenario A: Flip 10 times. Count heads.
          *   Scenario B: Flip until 3 heads. Count total flips.
          *   Result: 10 flips, 3 heads.
          *   Calculation: In A, probability of $\ge 3$ heads is different from B, probability of $\le 10$ flips. The "more extreme" cases differ.
