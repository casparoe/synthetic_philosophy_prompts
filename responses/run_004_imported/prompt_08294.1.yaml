answer: |-
  This is one of the deepest and most consequential divides in the philosophy of statistics. Your professor is right to flag it: the "optional stopping" problem isn't just a technicality; it exposes a fundamental disagreement about what probability *is* and what scientific evidence *means*.

  Here is the mechanism behind why the two frameworks diverge, how the Likelihood Principle fits in, and why this specific mathematical feature fuels the replication crisis.

  ---

  ### 1. The Mechanism: Why Frequentism Cares About Intentions

  To understand why the frequentist p-value changes based on the stopping rule, you have to look at how a p-value is actually defined.

  A p-value is **not** the probability that the null hypothesis is true given the data.
  It is: **The probability of observing data *this extreme or more extreme* than what you observed, *assuming the null hypothesis is true*, given your *sampling procedure*.**

  $$p = P(T \ge t_{obs} \mid H_0, \text{Stopping Rule})$$

  The critical phrase is **"or more extreme."** To calculate this, the frequentist must construct a **sampling distribution**. This distribution represents all the possible datasets you *could have* generated under the null hypothesis using your specific experimental design.

  **The Coin Flip Example:**
  Imagine you are testing if a coin is fair ($H_0: \theta = 0.5$). You observe 10 flips resulting in 8 Heads and 2 Tails.

  *   **Scenario A (Fixed Sample Size):** You intended to flip the coin exactly 10 times, no matter what.
      *   *The Sample Space:* All sequences of 10 flips (HHHHHHHHHH, HHHHHHHHHT, etc.).
      *   *The "More Extreme" cases:* 9 Heads, 10 Heads.
      *   *The Math:* You calculate the binomial probability of getting 8, 9, or 10 heads out of 10.
      *   *Result:* $p \approx 0.054$ (Not significant at 0.05).

  *   **Scenario B (Optional Stopping):** You intended to flip the coin until you got 2 Tails, then stop.
      *   *The Sample Space:* All sequences ending in the 2nd Tail (HT, HHT, HHHT... HHHHHHHHTT).
      *   *The "More Extreme" cases:* Sequences where it took *more* flips to get the 2nd Tail (e.g., 9 Heads then 2 Tails).
      *   *The Math:* You calculate the negative binomial probability. The calculation weights the outcomes differently because the "universe of possibilities" has changed.
      *   *Result:* $p \approx 0.032$ (Significant at 0.05).

  **The Mechanism:** In Scenario A, the "unobserved data" that counts against you includes sequences with 9 or 10 heads. In Scenario B, the "unobserved data" includes sequences where you kept flipping longer. Because the **sampling distribution** changes based on your *intention* (the stopping rule), the tail area (the p-value) changes, even though the physical data (8H, 2T) is identical.

  Frequentist inference is about **controlling long-run error rates of the procedure**. If you change the procedure (the stopping rule), you change the error rate properties, so the inference must adjust to maintain the 5% false positive guarantee.

  ### 2. The Mechanism: Why Bayesianism Ignores Intentions

  Bayesian inference is governed by Bayes' Theorem:

  $$P(\theta \mid \text{Data}) \propto P(\text{Data} \mid \theta) \times P(\theta)$$

  *   **Posterior:** Belief in parameter $\theta$ after seeing data.
  *   **Prior:** Belief in $\theta$ before seeing data.
  *   **Likelihood:** $P(\text{Data} \mid \theta)$. This is the probability of the **observed data** given a specific parameter value.

  Notice what is missing: **There is no term for "Data I could have seen but didn't."**

  In the coin flip example above:
  *   The likelihood of observing the specific sequence `H H H H H H H H T T` given a bias $\theta$ is simply $\theta^8 (1-\theta)^2$.
  *   It does not matter if you *planned* to stop at 10 flips or *planned* to stop at 2 Tails. The probability of generating *this specific string of numbers* is mathematically identical in both cases.

  Because the stopping rule does not appear in the likelihood function (assuming the stopping rule is **non-informative**, meaning you didn't stop *because* you knew the parameter value), it cancels out of the equation. The posterior distribution depends only on the data you actually have and your prior.

  ### 3. The Likelihood Principle

  This brings us to the philosophical core your professor mentioned.

  **The Likelihood Principle (LP)** states:
  > All the evidence provided by the data about a parameter $\theta$ is contained in the likelihood function. If two experiments yield proportional likelihood functions, they provide the same evidence about $\theta$, regardless of the experimental design.

  *   **Bayesianism:** Obeys the Likelihood Principle. Since the posterior is derived directly from the likelihood (and prior), and the likelihood is identical for the same data regardless of stopping rule, the inference is identical.
  *   **Frequentism:** Violates the Likelihood Principle. As shown in the coin flip example, frequentist inference considers the "sample space" (unobserved data), which changes with the stopping rule. Therefore, two experiments with identical likelihoods yield different p-values.

  For a philosopher of science, this is massive. It implies that for a frequentist, **evidence is not just a property of the data and the world, but a property of the researcher's mind (their intentions).**

  ### 4. Why This Drives the Replication Crisis

  You asked why this isn't just generic "p-hacking is bad" talk. The distinction is crucial.

  Generic p-hacking implies researchers are doing something *wrong* (like cherry-picking variables). Optional stopping in a frequentist framework is often doing something that feels *right* (collecting more data until you are sure) but is mathematically *invalid* under NHST (Null Hypothesis Significance Testing).

  Here is how the mechanism fuels the crisis:

  **1. The Inflation of Type I Error**
  In a fixed-sample frequentist test, if $H_0$ is true, you have a 5% chance of $p < .05$.
  However, if you employ optional stopping (e.g., "I'll collect 20 subjects, check $p$, if $p > .05$ I'll collect 20 more..."), you are effectively performing multiple tests.
  *   **Mechanism:** Each "peek" at the data is a new opportunity to cross the significance threshold by chance.
  *   **Result:** Simulations show that if you peek after every subject and stop when $p < .05$, your actual false positive rate inflates from 5% to **~20% or higher**.
  *   **Crisis Link:** The literature becomes filled with "significant" findings that are actually statistical noise generated by the stopping rule, not real effects. When others try to replicate using a fixed sample size, the effect vanishes.

  **2. The Incentive Structure**
  Frequentist NHST creates a "cliff-edge" incentive. A p-value of 0.051 is a "failure"; 0.049 is a "publication."
  *   Because the frequentist framework *mathematically allows* the p-value to drop below 0.05 simply by changing the stopping rule (even with the same data), researchers are implicitly incentivized to be vague about their stopping rules.
  *   If a researcher writes "we collected data until we achieved stable results," a frequentist reviewer cannot calculate the correct p-value. They must assume a fixed sample size. This allows the inflated false positive rate to slip through peer review.

  **3. Bayesian Robustness (with caveats)**
  Bayesian methods are often touted as a solution here. Because the posterior updates continuously, you *can* monitor the data as it comes in.
  *   If the true effect is zero, the Bayes Factor will generally converge toward evidence for the null as $N \to \infty$.
  *   Optional stopping does not bias the posterior *estimate* (assuming non-informative stopping).
  *   **However:** This doesn't mean Bayesians can't hack. They can "prior hack" or stop when the Bayes Factor hits a threshold that favors their hypothesis, which can still bias the literature. But the *mathematical mechanism* of the error is different. The frequentist error is a guaranteed inflation of false positives due to the definition of the p-value itself.

  ### Summary for your Seminar

  *   **Frequentist Sensitivity:** Arises because p-values are calculated over the **sampling distribution** (all possible data), which is defined by the **stopping rule**. Changing the rule changes the "unobserved" data considered, changing the p-value.
  *   **Bayesian Insensitivity:** Arises because posteriors are calculated over the **likelihood** (observed data only). The stopping rule does not change the probability of the data that actually occurred.
  *   **Likelihood Principle:** The philosophical rule that says inference should depend only on observed data. Frequentism violates it; Bayesianism adheres to it.
  *   **Replication Crisis:** The frequentist violation of the Likelihood Principle creates a mathematical loophole where "collecting more data" (a scientifically virtuous act) artificially inflates false positive rates if not strictly pre-registered. This systematically pollutes the literature with noise that cannot be replicated.

  This issue suggests that the replication crisis isn't just about "bad scientists," but partly about using a statistical framework (Frequentist NHST) that is mathematically fragile when applied to the messy, iterative reality of how science is actually conducted.
