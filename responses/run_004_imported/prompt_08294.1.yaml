      *   **Core Problem:** The "optional stopping" problem.
      *   **Specific Observation:** Frequentist p-values change based on the stopping rule (even with identical data), while Bayesian posteriors do not.
      *   **Key Concept Mentioned:** The Likelihood Principle.
      *   **Broader Impact:** Why is this a driver of the replication crisis (beyond generic "p-hacking is bad")?
      *   **Goal:** Explain the *mechanism* behind the sensitivity/insensitivity and the philosophical/practical implications.

  2.  **Initial Brainstorming & Fact-Checking:**
      *   *Frequentist Sensitivity:* Yes, p-values depend on the sampling distribution of the test statistic under the null hypothesis. The sampling distribution depends on the *intention* (stopping rule). If I plan to flip 100 coins vs. flip until 10 heads, the space of possible outcomes changes, changing the probability of observing the data *or more extreme*.
      *   *Bayesian Insensitivity:* Yes, Bayes' Theorem updates prior beliefs using the likelihood of the *observed* data. $P(\theta|D) \propto P(D|\theta) \times P(\theta)$. The stopping rule doesn't appear in this equation *unless* the stopping rule itself conveys information about the parameter (informative stopping). For standard non-informative stopping, it drops out.
      *   *Likelihood Principle:* This is the philosophical core. It states that all evidence in the data is contained in the likelihood function. Frequentist methods violate this; Bayesian methods obey it.
      *   *Replication Crisis:* Optional stopping allows researchers to keep collecting data until significance is found, inflating Type I error rates massively in frequentist frameworks. In Bayesian frameworks, while you *can* do this, the evidence (Bayes Factor) converges to the truth eventually, though there are still debates about "Bayesian hacking."

  3.  **Structuring the Explanation:**
      *   **Introduction:** Acknowledge the depth of the question. It's a classic and crucial distinction.
      *   **The Mechanism (Frequentist):** Explain *why* p-values care about intentions. Use the "Sample Space" concept. The p-value is $P(Data \ge Observed | H_0, \text{Procedure})$. The procedure defines the sample space.
      *   **The Mechanism (Bayesian):** Explain *why* posteriors don't care. Use Bayes' Rule. Focus on the Likelihood Function.
      *   **The Likelihood Principle:** Define it clearly. Show how Frequentism violates it and Bayesianism adheres to it.
      *   **The Replication Crisis Connection:** Move beyond "cheating." Explain how the *incentive structure* of frequentist null hypothesis significance testing (NHST) interacts with optional stopping to produce false positives systematically.
