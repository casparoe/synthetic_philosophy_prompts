      *   The prompt asks about the SEP entry's distinction. I should stick close to that framing.
      *   *Decision:* I will argue that "Rational Irrationality" is a category error in the Hitchhiker case. It describes a *causal* workaround (the drug), whereas Hitchhiker is a *logical* problem. Therefore, the Resolute Choice framework (rationality applies to plans) is the only one that actually solves the puzzle without changing the subject.

