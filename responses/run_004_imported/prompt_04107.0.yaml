      *   **Reason 3: Normative Force.** If paying is "irrational" (Rational Irrationality view), then if you *fail* to pay, you haven't made a mistake, you've just succumbed to rationality. That undermines the whole point of the puzzle. The point is you *ought* to pay. "Ought implies can," but also "Ought implies rational."
