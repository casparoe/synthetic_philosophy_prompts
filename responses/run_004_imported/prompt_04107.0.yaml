answer: |-
  First off, do not apologize for the SEP rabbit hole. That is significantly more useful for your long-term intellectual survival than AP Bio, even if your teacher disagrees. You have stumbled onto one of the sharpest knives in decision theory.

  Here is the verdict: When philosophers argue that the rational thing to do in Parfit's Hitchhiker is to pay the driver, they are making the **Resolute Choice** move (or a close cousin like Timeless Decision Theory), *not* the Rational Irrationality move.

  The "Rational Irrationality" framework is a kludge that fails to solve the Hitchhiker case without smuggling in Resolute Choice anyway. Here is why you should throw the "Rational Irrationality" explanation out the window for this specific puzzle.

  ### 1. The Mechanism of Action: Breaking vs. Binding
  The "Rational Irrationality" move (like the drug in the robber example) relies on **causal incapacitation**. You take the drug to *destroy* your ability to respond to reasons. You become a force of nature. The robber leaves because negotiating with a madman is pointless.

  In Hitchhiker, you do not take a drug. You do not lobotomize yourself. You are sitting in the town, fully sane, fully capable of reasoning. If you pay the driver, you are doing so because you are *following a reason* (the reason being: "I made a plan to survive, and this is part of the plan").

  If you claim paying is "irrational" (as the Rational Irrationality view must), you are saying that a fully sane agent, acting on a conscious commitment, is behaving irrationally. That strips the word "rational" of its connection to agency. Resolute Choice correctly identifies that your agency extends over time. You aren't a new agent in the town; you are the same agent who made the deal in the desert. Resolute Choice says rationality binds that temporal sequence. Rational Irrationality says you have to *break* the sequence to win. Hitchhiker doesn't let you break the sequence; you have to live through it.

  ### 2. The Prediction Problem
  The driver in Hitchhiker is a perfect predictor of *your rationality*. He isn't looking for signs of brain damage. He is looking for signs of *trustworthiness*.

  If the solution were Rational Irrationality, the driver would have to predict: "This person is the kind of idiot who throws money away." But if you are merely an "idiot" (irrational), the driver can't trust you to pay *because* you might also be the kind of idiot who changes your mind. Irrationality is noisy.

  Resolute Choice posits that you are a specific *type of rational agent*: one who treats plans as binding. The driver predicts that you are a **Resolute Chooser**. He picks you up because he predicts you will reason: "I am the kind of agent who keeps plans, therefore I pay." That is a rational calculation under Resolute Choice. Under Rational Irrationality, it's a calculation that you've gone mad. But the puzzle stipulates you are a standard rational agent facing a dilemma. The solution must preserve your status as a rational agent.

  ### 3. The *Reductio ad Absurdum* of "Rational Irrationality"
  Here is the knockout punch. If you adopt the Rational Irrationality view, you admit that **once you are in the town, paying is irrational.**

  If paying is irrational, then if you *don't* pay, you have acted rationally (by definition of the theory). But if you don't pay, you die (because the driver wouldn't have picked you up). This leads to the absurd conclusion that **Standard Rationality recommends death.**

  Parfit's whole point in *Reasons and Persons* is that a theory of rationality that is self-defeating (i.e., following it makes you worse off) is a bad theory of rationality. The "Rational Irrationality" move accepts that the theory is self-defeating and just tells you to hack your brain to avoid it. The "Resolute Choice" move fixes the theory so it isn't self-defeating in the first place.

  Resolute Choice says: "Paying is rational *because* it is part of the optimal plan." This saves the principle that rationality should generally guide you to good outcomes. Rational Irrationality says: "Paying is irrational, but being crazy is smart." That is a surrender. It admits that Rationality cannot handle dynamic consistency, so we must opt out of Rationality to succeed.

  ### The Bottom Line
  "Rational Irrationality" is a workaround for agents stuck using Causal Decision Theory (CDT). It's what you do when you know your decision theory is broken but you can't fix it, so you take a drug instead.

  "Resolute Choice" is the fix. It argues that CDT is wrong because it treats time-slices of you as different agents. In Hitchhiker, you are one agent extended over time. Paying the driver is the only move that respects the integrity of that agent.

  So, when people say paying is rational, they are saying our definition of rationality was too narrow (myopic), not that we need to become irrational. Don't let the "Rational Irrationality" label fool you; it's a confession of defeat, whereas Resolute Choice is the actual victory condition. Stick with Resolute Choice.
