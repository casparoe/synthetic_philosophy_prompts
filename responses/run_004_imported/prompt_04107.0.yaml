      *   **Reason 1: The Mechanism.** Rational Irrationality requires *breaking* your agency (the drug). Resolute Choice requires *using* your agency to bind yourself to a plan. In Hitchhiker, you aren't broken; you're functioning perfectly. You pay because you decided to pay.
