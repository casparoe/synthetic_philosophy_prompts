answer: |-
  This is a fantastic question, and honestly, it's one of the most common misconceptions students (and even some economists!) have about the Allais Paradox. Your intuition is half-right, but the conclusion is where it breaks down.

  Here is the cleanest way to explain this to your grad students, broken down into the **Math**, the **Axiom**, and the **Implication**.

  ### 1. The Math: It's Not About One Choice, It's About the Pair
  Your explanation works for **Choice 1**, but it makes the wrong prediction for **Choice 2**.

  Recall the standard Allais setup:
  *   **Gamble 1A:** \$1M for sure.
  *   **Gamble 1B:** 89% \$1M, 10% \$5M, 1% \$0.
  *   **Gamble 2A:** 11% \$1M, 89% \$0.
  *   **Gamble 2B:** 10% \$5M, 90% \$0.

  **The Typical Pattern:** People choose **1A > 1B** (Certainty effect) AND **2B > 2A** (Risk seeking in losses/low prob).

  **The EUT Constraint:**
  Under Expected Utility Theory, utility is linear in probabilities. Let $u(0) = 0$.
  1.  **1A > 1B implies:**
      $$u(1M) > 0.89u(1M) + 0.10u(5M) + 0.01u(0)$$
      Subtract $0.89u(1M)$ from both sides:
      $$0.11u(1M) > 0.10u(5M)$$

  2.  **2B > 2A implies:**
      $$0.10u(5M) + 0.90u(0) > 0.11u(1M) + 0.89u(0)$$
      Since $u(0)=0$:
      $$0.10u(5M) > 0.11u(1M)$$

  **The Contradiction:**
  Look at the inequalities. Choice 1 requires $0.11u(1M) > 0.10u(5M)$. Choice 2 requires $0.10u(5M) > 0.11u(1M)$.
  **No function $u(\cdot)$ can satisfy both.** It doesn't matter how concave you make it. You cannot tune the parameters of EUT to fit this data.

  ### 2. The Axiom: Violation of Independence
  The deeper theoretical point is about the **Independence Axiom**.

  EUT posits that if you prefer Lottery $P$ over Lottery $Q$, you should still prefer $P$ over $Q$ even if both are mixed with a common Lottery $R$ with probability $\alpha$.
  $$P \succ Q \implies \alpha P + (1-\alpha)R \succ \alpha Q + (1-\alpha)R$$

  In the Allais paradox:
  *   **Gamble 2** is essentially **Gamble 1** with the "common consequence" removed.
  *   In Choice 1, there is an 89% chance of winning \$1M regardless of which option you pick.
  *   In Choice 2, there is an 89% chance of winning \$0 regardless of which option you pick.

  EUT says that 89% "common chunk" should be irrelevant. You should ignore it and compare the remaining 11%.
  *   **1A vs 1B:** Compare 11% chance of \$1M (in 1A) vs 10% \$5M + 1% \$0 (in 1B).
  *   **2A vs 2B:** Compare 11% chance of \$1M (in 2A) vs 10% \$5M + 1% \$0 (in 2B).

  They are the **same decision** mathematically. The fact that people switch preferences implies they care about the *context* of the probability (e.g., turning a 99% chance of wealth into 100% feels different than turning a 10% chance into 11%), not just the final wealth distribution.

  ### 3. The Implication: Why RDU and Prospect Theory?
  This is why economists invented Rank-Dependent Utility (RDU) and Prospect Theory (PT).

  *   **EUT:** $V = \sum p_i u(x_i)$
      *   Risk aversion comes **only** from the curvature of $u(\cdot)$.
      *   Probabilities are weighted linearly ($p$).
  *   **RDU/Prospect Theory:** $V = \sum w(p_i) v(x_i)$
      *   Allows for a **probability weighting function** $w(p)$.
      *   Typically, people overweight small probabilities and underweight moderate/large probabilities (inverse S-shape).
      *   Crucially, they overweight **certainty** ($p=1$).

  In the Allais paradox, the switch happens because the weighting function $w(p)$ is non-linear.
  *   In Choice 1, the drop from 100% to 89% is weighted heavily (the "Certainty Effect").
  *   In Choice 2, the drop from 11% to 10% is weighted lightly.

  ### The "Elevator Pitch" for Your Students
  > "Risk aversion (concave utility) explains why you might take the sure \$1M in the first choice. But if your utility function is concave enough to prefer the sure \$1M there, Expected Utility Theory *mathematically forces* you to prefer the safe option in the second choice as well.
  >
  > The Allais Paradox shows that people violate the **Independence Axiom**. We don't just evaluate outcomes; we evaluate probabilities non-linearly. We treat '100%' fundamentally differently than '99%', even though EUT says the difference is just 1%. New theories like Prospect Theory fix this by allowing the *weights* on probabilities to be non-linear, not just the utility of wealth."

  ### Teaching Tip
  If you want to drive it home, ask them: **"If concave utility explains Allais, can you write down a specific $u(w)$ that generates the typical Allais preference reversal?"**
  When they try to solve the system of inequalities I wrote in section 1, they will hit the contradiction immediately. It turns the abstract "axiom violation" into a concrete "no solution exists" problem.
