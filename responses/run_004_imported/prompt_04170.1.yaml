  6.  **Refining the "Why it matters" part:**
      *   Why do economists care? Because EUT is the baseline for asset pricing, insurance, contract theory, etc. If probabilities aren't linear, asset pricing models (CAPM, etc.) change. It's not just "people are irrational," it's "the functional form of how we aggregate risk is wrong."

  7.  **Final Polish:** Check for clarity. Ensure the distinction between *utility over outcomes* (concavity) and *weighting of probabilities* (linearity) is sharp. This is the core theoretical distinction.

