answer: |-
  **Title:** The Separateness of Propositions: Assessing Berker's Challenge to Accuracy-First Epistemology

  **Introduction**
  The "accuracy-first" program in formal epistemology, inaugurated by James Joyce (1998), aims to ground the norms of rational credence in a single fundamental value: accuracy. The core argument is a dominance theorem: if your credences violate the probability axioms, there is always an alternative set of probabilistic credences that is guaranteed to be more accurate (closer to the truth) at every possible world. Consequently, probabilism is rationally required because it minimizes inaccuracy. This project has been ambitious, attempting to derive updating rules, evidence norms, and even decision-theoretic principles from this single epistemic good.

  However, Selim Berker's (2013) critique, "Epistemic Consequentialism," threatens to undermine the normative foundation of this program. Berker argues that accuracy-first epistemology is structurally analogous to act-utilitarianism in ethics. Just as utilitarianism is accused of ignoring the "separateness of persons" (permitting the sacrifice of one individual's welfare for the aggregate good), accuracy-first epistemology ignores the "separateness of propositions." It allegedly permits sacrificing accuracy on one proposition to secure greater aggregate accuracy elsewhere, violating the intuition that rational belief is determined by evidence specific to that proposition, not by global utility maximization.

  **Reconstructing Berker's Argument**
  Berker's objection is not merely that accuracy-first epistemology yields the wrong results; it is that it offers the wrong *kind* of justification. He characterizes the view as a form of **epistemic consequentialism**. In standard consequentialism, the rightness of an act is determined by the goodness of its consequences. Berker argues that accuracy-firsters treat the rationality of a credence in proposition $P$ as determined by the contribution that credence makes to the overall accuracy of the agent's total belief state.

  The "separateness of propositions" objection arises when this aggregative structure licenses trade-offs. Consider a case where an agent has weak evidence for $P$ (warranting a credence of 0.4) but strong evidence for $Q$. Berker constructs scenarios where, due to the mathematical properties of certain scoring rules or logical connections, holding a credence of 0.4 in $P$ might lower the *total* expected accuracy of the system compared to holding 0.6, perhaps because the 0.6 credence interacts more favorably with the credence in $Q$ within the global scoring function.

  If accuracy-first epistemology mandates the 0.6 credence to maximize the global score, it violates a fundamental epistemic constraint: **Clifford's Principle**, roughly that one should only believe according to the evidence. For Berker, the intuition is that propositions are "separate" in the sense that the epistemic status of $P$ should depend *only* on the evidence for $P$. Allowing the accuracy status of $Q$ to influence the rational credence in $P$ treats propositions as mere vessels for accumulating value, rather than as distinct targets of inquiry. If the theory justifies believing $P$ because it helps the "team score" of the belief system, it has misunderstood the nature of epistemic justification.

  **The Accuracy-First Defense: Propriety and the Limits of the Analogy**
  Your officemate's reaction—that propositions lack interests and thus cannot be "wronged"—is indeed too quick. The problem isn't about hurting propositions' feelings; it's about the structure of reasons. However, accuracy-firsters have a more robust technical defense that strikes at the heart of Berker's analogy.

  The strongest response relies on the constraint of **strict propriety**. A scoring rule is strictly proper if, for any probabilistic credence function, the expected accuracy is maximized *only* by reporting that true credence. If I have a credence of 0.4 in $P$ based on my evidence, and I use a strictly proper scoring rule (like the Brier score), then shifting my credence to 0.6 *always* lowers my expected accuracy regarding $P$, regardless of what happens with $Q$.

  This blocks the trade-off Berker fears. In Act Utilitarianism, sacrificing Person A really does increase the aggregate welfare; the math works out to permit the sacrifice. In Accuracy-First Epistemology, sacrificing accuracy on $P$ to help $Q$ *does not* maximize expected accuracy if the scoring rule is proper and the credences are coherent. The "global" maximization of accuracy is achieved precisely by being locally faithful to the evidence for each proposition.

  Therefore, the analogy to utilitarianism breaks down. Utilitarianism aggregates distinct welfare functions that can conflict. Accuracy-first epistemology aggregates accuracy scores, but under the constraint of propriety, the local maximum (evidence-responsiveness) *is* the global maximum. There is no tension between the "separateness of propositions" and the "total accuracy" because the mathematics of proper scoring rules ensures they align. The accuracy-firster can argue they are not consequentialists about *belief formation* (trying to cause good outcomes) but rather evaluators of *belief states* (assessing which states are good). Since the "good state" is defined by local fidelity, the "trade-off" is a mirage created by improper scoring rules or incoherent starting points.

  **Verdict**
  Does Berker's objection sink the accuracy-first project? **No, but it forces a crucial retreat.**

  Berker is right that if accuracy-first epistemology is presented as a form of act-consequentialism for beliefs—where agents should deliberately manipulate credences to maximize a global score—the project is untenable. That version violates the evidence constraint and misunderstands the normative force of epistemic reasons.

  However, Berker does not refute the core mathematical result (Joyce's dominance argument) nor the claim that accuracy is the fundamental epistemic value. He refutes a specific *interpretation* of how that value generates norms. The accuracy-first program survives if it adopts a **rule-consequentialist** or **evaluative** stance: the norms (Probabilism, Conditionalization) are justified because they describe the credence functions that *would* maximize accuracy, not because agents should perform calculations to maximize accuracy in real-time.

  **The Verdict:** Berker's objection is a **philosophical victory but a technical stalemate.** It successfully kills the "naive consequentialist" rhetoric that often accompanies accuracy-first papers, forcing proponents to be more careful about distinguishing between the *justification of norms* (which can be global/consequentialist) and the *deliberative perspective of the agent* (which must be local/evidential). It does not, however, demonstrate that accuracy cannot be the fundamental epistemic good. You can safely continue your paper, provided you acknowledge that accuracy-first epistemology must be framed as an evaluative account of rational states, not a decision procedure for belief manipulation. Berker didn't sink the ship; he just forced it to dock and repair its leaky ethical analogy.
