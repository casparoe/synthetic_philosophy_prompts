answer: |-
  Your intuition is spot-on. That "nagging" feeling you have is the gap between **abstract mathematical existence** and **practical feasibility**.

  While the consultant is using real logical terminology ("proof by contradiction"), he is almost certainly pulling a fast one, or at best, oversimplifying reality to the point of deception.

  Here is the breakdown of why this logic is suspicious, how it works mathematically, and how you can use it in your story.

  ### 1. The Logic: "It can't NOT exist" vs. "It exists"
  In pure mathematics, you are correct: proving that "non-existence leads to a contradiction" is a valid way to prove existence. This is called a **non-constructive proof**. It tells you a solution is out there, but it doesn't tell you where it is or what it looks like.

  **However,** this only works if the premises of the proof match the reality of the problem.

  The consultant claims he proved existence by contradicting the "number of nurses on payroll." This implies his proof is based on **volume** (total hours available vs. total hours needed).
  *   **The Flaw:** Scheduling isn't just about volume; it's about **topology** (how the pieces fit together).
  *   **The Reality:** You can have enough total nurse-hours to cover a week (Volume), but still have no way to arrange them without violating the "no back-to-back nights" rule (Topology).

  **A Simple Counter-Example:**
  *   **Need:** 1 Nurse for Monday Night, 1 Nurse for Tuesday Night.
  *   **Have:** 1 Nurse on payroll.
  *   **Consultant's Math:** Total shifts needed = 2. Total shifts one nurse *could* work = 2. Therefore, a solution must exist because we have enough capacity.
  *   **The Constraint:** No back-to-back nights.
  *   **The Reality:** The single nurse cannot work both nights. The schedule is impossible, even though the "payroll numbers" say it should be possible.

  The consultant is proving you have enough **fuel** to drive across the country, but he's ignoring the fact that there is **no road**.

  ### 2. The Computational Problem (The "Weeks to Grind" Excuse)
  The consultant says finding the schedule is a "separate, much harder problem." This is partially true in computer science terms, but it's a red flag in this context.

  *   **Constraint Satisfaction Problems (CSP):** Nurse scheduling is a classic CSP. It is often **NP-Hard**. This means that as you add more rules (no back-to-backs, specific certifications, vacation requests, max hours per week), the time it takes to find a solution grows exponentially.
  *   **The "Weeks" Tell:** If software needs *weeks* to find a schedule, it usually means the problem is **over-constrained**. In the industry, if a solver runs that long without finding a solution, the practical answer is "No feasible solution exists within these constraints."
  *   **The Fast One:** By saying "It exists theoretically, but the computer can't find it," he is shifting the blame from the **staffing levels** (management's fault) to the **software's complexity** (a technical glitch). It buys him time and protects him from admitting the hospital is understaffed.

  ### 3. Is he lying?
  He is likely engaging in **technobabble deception**.

  He is using a true logical concept (non-constructive proof) to mask a false premise (that payroll volume equals schedule feasibility). He wants to tell management: *"Don't worry, the math says we have enough people."* He wants to tell the Head Nurse: *"Don't worry, the schedule exists, the computer is just slow."*

  This keeps him employed while the hospital burns out its staff trying to find a schedule that mathematically *might* exist but practically *doesn't*.

  ### 4. How to use this in your story
  This is a fantastic conflict because it pits **Administration (Abstract Numbers)** against **Frontline (Concrete Reality)**.

  *   **The Head Nurse's Counter:** She doesn't need to understand the math. She just needs to point out the "road" problem.
      *   *Dialogue Idea:* "You've proven we have enough bricks to build a house, Consultant. But you haven't proven they aren't all triangles. I need a roof, not a pile of sharp edges."
  *   **The Stakes:** If management believes the consultant, they won't hire more nurses. They will pressure the staff to find the "magic schedule" that doesn't exist. This leads to burnout, errors, and the core conflict of your story.
  *   **The Climax:** The Head Nurse might prove him wrong by finding a specific constraint he ignored (e.g., "You counted Jane in your payroll numbers, but she's on FMLA for three weeks," or "You assumed all nurses can work ICU, but only three are certified."). This collapses his "contradiction" proof instantly.

  ### Summary
  *   **Logically:** "It can't NOT exist" does equal "It exists."
  *   **Practically:** His proof is likely flawed because it counts *capacity* rather than *feasibility*.
  *   **Narratively:** He is definitely pulling a fast one. He is using abstract math to hide a concrete shortage.

  Your character is right to be suspicious. In operations research, **if you can't construct it, it doesn't exist.** A schedule that takes weeks to compute is functionally identical to a schedule that is impossible.
