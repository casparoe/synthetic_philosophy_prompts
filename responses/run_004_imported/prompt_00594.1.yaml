answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. The smell of stale coffee lingers. Elena (Conditional Analyst) and Marcus (Dispositional Essentialist) are finishing a seminar on metaphysical grounding.*

  **Elena:** You pressed hard on the Simple Conditional Analysis today, Marcus. But you seemed to glide right over Lewis's reform. We aren't stuck with the naive view that "fragile" just means "if struck, then breaks." We know better.

  **Marcus:** I know the Reformed Conditional Analysis (RCA) well, Elena. Lewis quantifies over the intrinsic causal basis. $x$ is disposed to $M$ if $x$ has some intrinsic property $B$, such that if $x$ were stimulated and $B$ persisted, $M$ would occur. It's a clever patch for Martin's finkish dead wire.

  **Elena:** Clever? It's necessary. In Martin's case, the wire is dead until touched. The touching triggers a device that makes it conductive. The naive analysis says the wire is disposed to conduct because if touched, it conducts. But intuitively, it isn't disposed *until* touched. Lewis saves us by requiring the basis $B$ to persist through the stimulus. In the fink case, the basis *doesn't* exist prior to the stimulus, so the conditional doesn't trigger falsely. The analysis holds.

  **Marcus:** I grant you the fink. Lewis handles the fink by ensuring the basis is intrinsic and persistent. But that victory is pyrrhic because it leaves the analysis wide open to masking. And here, the persistence of the basis is precisely what destroys your conditional.

  **Elena:** Masking is just interference. We handle interference with *ceteris paribus* clauses.

  **Marcus:** That's the retreat I expected. Let's be precise. Consider Johnston's fragile glass packed in styrofoam. The glass possesses the microstructural basis $B$—the silicon-oxygen bonds that make it brittle. That basis is intrinsic. It persists when I strike the package. Yet, the glass does not break.

  **Elena:** Because the styrofoam absorbs the impact. The stimulus isn't fully transmitted to the glass.

  **Marcus:** No, that's a confusion of stimulus definition. Let's sharpen it with Bird's antidote case, which bypasses your absorption objection. Imagine a poison. Its causal basis $B$ is its molecular structure, which interacts with human enzymes to cause death. Now, administer an antidote simultaneously. The antidote doesn't change the poison's structure. $B$ persists. The stimulus (ingestion) occurs. But the manifestation (death) does not.

  **Elena:** So, the antidote blocks the causal pathway.

  **Marcus:** Exactly. And here is the knife-twist for RCA. According to Lewis's formula: If the poison has basis $B$, and is ingested, and $B$ persists... then death *must* occur. But in the antidote case, $B$ persists, ingestion occurs, and death *fails* to occur. Therefore, according to your analysis, the poison was *not* disposed to kill. But that's absurd. It is lethal; it is just neutralized. The disposition is real, but the manifestation is blocked.

  **Elena:** I see the move. You're arguing that because the conditional fails in the presence of a mask, the conditional cannot *define* the disposition. But why can't I just add a clause? "If stimulated, and $B$ persists, and no maskers are present..."

  **Marcus:** Because the list of maskers is open-ended. For any conditional you write, I can conjure a new physical scenario that blocks the manifestation without altering the intrinsic basis. A magnetic field, a vacuum, a divine intervention, a quantum fluctuation. If you have to list every possible defeater to define the property, you haven't analyzed the property; you've just listed the conditions under which it *shows* itself. You're conflating the evidence for the disposition with the disposition itself.

  **Elena:** You're assuming the analysis must be a finite list of sufficient conditions. But science does this all the time. We define solubility via molecular bonding, acknowledging that saturation or temperature can mask it. We don't say the sugar isn't soluble just because the water is saturated. We say the *conditions* aren't right.

  **Marcus:** But that's my point! You appeal to the molecular bonding—the causal basis—to explain why it *would* dissolve if the mask were removed. You are relying on the *power* of the bonds to ground the counterfactual. The counterfactual depends on the power, not the other way around. If you strip away the primitive power, the conditional has no truth-maker. Why is it true that "if the styrofoam were removed, the glass would break"? Because the glass *is* fragile. The disposition explains the truth of the conditional, not vice versa.

  **Elena:** This is where I think your "Dispositional Essentialism" becomes metaphysically extravagant. You posit these primitive powers as irreducible properties. But tell me, Marcus: what work are they actually doing? When I ask a chemist why the glass breaks, she tells me about bond angles and stress propagation. She doesn't say, "Because it possesses the primitive power of fragility."

  **Marcus:** She doesn't need to. She's describing the *categorical base*, the microstructure. I'm talking about the *modal nature* of that property. The scientist tells you *how* it breaks. I'm telling you *why* the breaking is necessary given the structure.

  **Elena:** But if you say the power is primitive and unanalyzable, aren't you just relabeling the mystery? Molière's doctor said opium induces sleep because of its *dormitive virtue*. You say the glass breaks because of its *fragility power*. It sounds like you've turned the disposition into a little homunculus inside the object ensuring the manifestation happens.

  **Marcus:** That's the standard Rylean objection, but it misses the target. A *dormitive virtue* is an empty label because it adds nothing to the description. Dispositional Essentialism adds ontology. It says the universe is not just a mosaic of categorical facts waiting for laws to be imposed from outside. The properties *themselves* contribute to the laws. The bond angles *are* the fragility. The modality is built into the fabric of the property.

  **Elena:** But if the modality is built in, how do you account for the masking without making the power contingent? If the poison *essentially* has the power to kill, and it is ingested, how can it *not* kill without contradicting its essence?

  **Marcus:** Because powers are directed toward manifestations, they don't guarantee them in isolation. A key is essentially shaped to open a lock, but if the lock is jammed, the key doesn't open it. The key hasn't lost its shape. The power is real, but manifestation requires a cooperative context. Your conditional analysis tries to bake the cooperative context into the *definition* of the power. I say the power exists independently of the context; the context merely allows the power to flow into manifestation.

  **Elena:** So you're comfortable with a metaphysics where properties have "directedness" or intentionality built into them, without any mechanism to explain that directedness other than saying "it's essential."

  **Marcus:** I'm comfortable with a metaphysics that respects the intuition that dispositions are real causes. Your analysis makes dispositions supervene on conditionals. But conditionals are true *in virtue of* something. What makes it true that the wire would conduct if touched? The physical state of the wire. What makes it true that the glass would break if struck? The physical state of the glass. That physical state *is* a power. To analyze it away into a conditional is to cut the anchor.

  **Elena:** And to posit it as a primitive power is to anchor the ship to a rock we can't see. Look, I respect the intuition. As a materials scientist, I treated brittleness as real. But philosophically, I want to know how we verify it. We verify it through conditionals. We test the disposition by testing the conditional. If your primitive power diverges from the conditional—as it does in masking cases—then it becomes empirically idle.

  **Marcus:** It's not idle. It explains the *similarity* between the masked and unmasked case. Why do we treat the cushioned glass with the same care as the exposed glass? Because the power is present in both. Your analysis struggles to say the glass is fragile in the cushion without implying it should break. I can say it is fragile, the power is active, but the manifestation is inhibited. I save the intuition that the property is constant even when the behavior changes.

  **Elena:** But at the cost of making the property metaphysically opaque. You've saved the concept of disposition by making it unanalyzable. You've won the battle for the term "fragility" by surrendering the war for explanation.

  **Marcus:** And you've won the war for analysis by losing the thing itself. You have a perfect conditional map of a territory that doesn't exist. I'd rather have the territory, even if the map is just a label saying "Power Here."

  **Elena:** Then we are at an impasse. You see the conditional as a shadow of the power.

  **Marcus:** And you see the power as a projection of the conditional.

  **Elena:** Precisely. And until we agree on whether modality is in the world or in our descriptions of it, I don't see the wire connecting us.

  **Marcus:** No. But the tension is where the work is.

  *(They sit in silence for a moment, the disagreement hanging in the air, neither willing to concede the ground of their respective metaphysics.)*
