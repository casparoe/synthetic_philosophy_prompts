      *   **Case:** The "Grue" Prediction.
      *   **Setup:** Two Bayesians, same data (emeralds before 2050), different predictions (after 2050).
      *   **Mechanism:** Identical likelihoods, different priors on hypothesis complexity.
      *   **Anti-Redescription:** "Simplicity" is not an observable fact in the data stream; it's a meta-assumption. Knowing *why* you have the prior doesn't give you data to update the prior itself without circularity.
      *   **Conclusion:** Rationality = coherence, not unique starting point.

      *(Wait, check Aumann again)*: Aumann says if priors are *common*, they agree. It does not say priors *must* be common. The prompt asks for a case where the *violation* is the best explanation. Okay, I'm on solid ground.

      *(One more check on "Information")*: Could "Simplicity is good" be treated as information? If Agent A thinks "Simplicity is good" and Agent B thinks "Complexity is good," isn't that a factual disagreement about the universe?
