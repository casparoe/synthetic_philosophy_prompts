      *   **The Prior Difference:** Alice uses a language where "Green" is primitive. Bob uses a language where "Grue" is primitive. This isn't just vocabulary; it's the *hypothesis space weighting*. Alice assigns $P(H_{Green}) \gg P(H_{Grue})$. Bob assigns $P(H_{Grue}) \gg P(H_{Green})$.
