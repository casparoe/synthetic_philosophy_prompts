      *   *The Harsanyi Doctrine:* Standard Bayesian epistemology often assumes the "Common Prior Assumption" (CPA). If agents share a prior and update on the same data, they converge.
      *   *The Redescription Problem:* If Alice believes $X$ because of childhood trauma and Bob believes $\neg X$ because of a physics degree, isn't the "childhood trauma" just private information ($I_A$) and the "physics degree" just private information ($I_B$)? If they swap all $I$, they should agree.
      *   *The Goal:* I need a scenario where swapping all *factual* information doesn't resolve the disagreement because the *weighting* or *interpretation* of that information is fundamentally built into their prior probability distributions over hypotheses, not derived from the data itself.
      *   *Key Insight:* Priors aren't just "what I knew before." They are "how I map evidence to belief." If two agents have different *simplicity priors* (e.g., Solomonoff induction variants) or different *symmetry assumptions*, they might process the *same* infinite stream of data differently.

  3.  **Brainstorming Examples:**
