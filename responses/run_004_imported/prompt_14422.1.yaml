          *   *Refinement:* Make it concrete. Two AI agents.
      *   *Idea 2: Cosmological Constants.* Agent A thinks fine-tuning implies design. Agent B thinks it implies a multiverse.
          *   *Critique:* Usually argued as likelihood ratios, which can be absorbed into priors. But is there *new* info? If they know each other's arguments, have they shared all info? Maybe too messy.
      *   *Idea 3: Mathematical Intuition/AXioms.* Agent A accepts Axiom of Choice, Agent B rejects it.
          *   *Critique:* That's not empirical disagreement, that's definitional. Aumann applies to probabilistic beliefs about the world.
      *   *Idea 4: Universal Induction / Solomonoff Priors.* This is the strongest technical ground. Different universal Turing machines yield different (though asymptotically compatible) priors. But Aumann is about *persistent* disagreement. If they see enough data, Solomonoff priors converge. I need something where they *don't* converge or where the data is insufficient to swamp the prior.
      *   *Idea 5: The "Fundamental Symmetry" Case.*
          *   Scenario: A fundamental physical parameter $\theta$.
          *   Agent 1: Prior is Uniform(0, 1).
          *   Agent 2: Prior is Beta(0.1, 0.1) (bimodal at edges) or something that reflects a belief in "specialness."
          *   Wait, if they see data, likelihoods dominate. I need a case where data is scarce or ambiguous *by nature*.
      *   *Idea 6: The "One-Shot" Event.*
