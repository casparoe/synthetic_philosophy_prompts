  6.  **Developing the "Irreducible" Argument:**
      *   To show it's not information: Information must be truth-apt facts about the territory. Priors are maps. Two maps can have different scales or projections without one being "misinformed."
      *   To show rationality doesn't require common priors: If priors are underdetermined by logic (as Hume/Goodman argue), then rationality permits a range of priors.

