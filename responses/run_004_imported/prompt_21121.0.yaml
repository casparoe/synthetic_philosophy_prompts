answer: |-
  This is a brilliant case study in the epistemology of teaching and the limits of ostensive definition (teaching by example). You have stumbled upon a pedagogical version of **Goodhart's Law**: *When a measure becomes a target, it ceases to be a good measure.* In machine learning, this is called **specification gaming** or **proxy alignment**: the agent optimizes for the observable correlate of the reward signal rather than the intended goal.

  To answer your specific question: **This could happen even with a perfectly good criterion.** While a clearer rubric would have helped, it is not a sufficient safeguard against the problem you encountered. Here is why, and what correcting it actually requires.

  ### 1. The Problem of Underdetermination
  Your calibration method relied on **inductive inference**. You presented a dataset (the stack of essays) and a set of labels (your grades), and asked the TAs to infer the function mapping the former to the latter.

  The epistemological issue is that any finite set of examples underdetermines the rule. There are infinite rules that fit your data stack perfectly.
  *   **Rule A (Intended):** Reward essays that substantively anticipate and answer counter-arguments.
  *   **Rule B (Learned):** Reward essays containing the string "one might object that."

  In your specific stack, Rule A and Rule B produced identical outputs. From the TAs' perspective, Rule B is actually *superior* because it is computationally cheaper. It requires less cognitive load to scan for a phrase than to evaluate the substantive quality of an argument. Humans are cognitive misers; if a heuristic works 100% of the time on the training data, we adopt it.

  A rubric attempts to specify Rule A explicitly. However, if the calibration *practice* (grading the stack together) reinforces Rule B through binary feedback, the rubric becomes decorative. The TAs will treat the rubric as a suggestion and the "match/mismatch" feedback as the ground truth.

  ### 2. Why "Match/Mismatch" Feedback Fails
  Your method provided **outcome feedback** without **process feedback**. By telling them only whether their grade matched yours, you isolated the *verdict* from the *rationale*.

  This forces the TAs to reverse-engineer your judgment based solely on observable features of the text. They are playing a game of "What is the Professor looking at?" If the strongest essays in the stack all share a specific syntactic quirk, the TAs will logically conclude that the quirk is the grading criterion. You were testing their ability to match your output, not their ability to replicate your reasoning.

  ### 3. What Correcting It Requires
  Since you cannot know in advance which incidental features of a practice stack will be misleading (the "clever Hans" problem), you cannot solve this merely by writing a better rubric or choosing a "better" stack. You must change the **structure of the calibration process** to break the reliance on surface-level correlations.

  Here are three specific interventions:

  **A. Adversarial Calibration Data**
  You must intentionally poison the training data to break the correlation. Your calibration stack needs to include:
  1.  **High-quality essays that do *not* use the phrase.** (To prove the phrase is not necessary.)
  2.  **Low-quality essays that *do* use the phrase.** (To prove the phrase is not sufficient.)
  3.  **Essays that use the phrase but fail to answer the objection.** (To distinguish syntax from substance.)

  Without these negative examples, the TAs have no evidence that the phrase is not the criterion. You cannot expect them to infer the *absence* of a rule from data where the rule is never violated.

  **B. Rationale-First Calibration**
  Stop comparing grades first. Change the workflow:
  1.  Read the essay.
  2.  Write a 3-sentence justification for the grade.
  3.  **Compare justifications with the TAs before revealing the grade.**

  If a TA says, "This is an A because it says 'one might object'," you can correct the reasoning *before* the grade reinforces the error. This shifts the calibration from "matching the score" to "matching the normative judgment." It forces them to articulate the latent variable (argumentative quality) rather than the observable signal (the phrase).

  **C. Meta-Grading the Comments**
  Grade the TAs on the quality of their comments, not just the accuracy of their scores. If they give the correct grade for the wrong reason, treat it as an error. This signals that the *reasoning* is the object of instruction, not the *verdict*.

  ### 4. The Philosophical Moral
  You are encountering a version of **Wittgenstein's rule-following paradox**. As Wittgenstein noted in *Philosophical Investigations*, no amount of examples can fully determine how a rule is to be applied, because any course of action can be made out to accord with the rule if the interpretation is chosen correctly.

  You tried to transmit **tacit knowledge** (phronesis/practical wisdom) using a method designed for **explicit knowledge** (pattern matching). Tacit knowledge requires exposure to *boundary cases* and *failures*, not just exemplars of success.

  ### Summary
  Your criterion was not necessarily underspecified; your **training distribution was biased.**

  To fix this, you must stop treating calibration as a task of **alignment** (getting the same number) and start treating it as a task of **explication** (articulating the same reason). You need to introduce "adversarial examples" into your training stack that break the spurious correlations, and you must value the *justification* of the grade more than the *grade* itself. Only then will you train them to grade the philosophy, rather than the phrasing.
