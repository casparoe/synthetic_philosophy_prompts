      *   **Root Cause:** The original "strong" stack happened to use that phrase frequently (correlation), but the professor intended to teach judgment of *substance* (anticipating objections), not *syntax* (the specific phrase).
      *   **Core Question:** Was this an underspecified criterion (fixable by a better rubric), or is this an inherent risk even with good criteria? If the latter, how do you correct for it given you can't predict misleading correlations in advance?

  2.  **Deconstruct the Problem:**
      *   **The Phenomenon:** This is a classic case of *Goodhart's Law* ("When a measure becomes a target, it ceases to be a good measure") or *specification gaming* in AI terms. The TAs optimized for the observable signal (the phrase) rather than the latent variable (critical engagement).
      *   **The Training Method:** "Tell them essay by essay whether their grade matched mine." This is *outcome-based feedback* without *process-based explanation*. It's reinforcement learning without a clear reward function definition.
      *   **The Epistemological Issue:** Tacit knowledge vs. Explicit knowledge. The professor has tacit knowledge of "good argumentation." They tried to transfer it via osmosis (pattern matching) rather than explication.
      *   **The Specific Question:** Underspecified criterion vs. Inherent limitation?
          *   *Argument for Underspecified:* Yes, a rubric saying "Look for counter-arguments, regardless of phrasing" would help.
          *   *Argument for Inherent:* Even with a rubric, humans look for heuristics. If the calibration stack is biased, the heuristic formed will be biased. You can't rubricate every nuance.

  3.  **Formulate the Answer:**

      *   **Acknowledge and Validate:** This is a fascinating and very common problem in pedagogy and machine learning (concept drift/proxy gaming). It shows deep reflection on teaching practice.
      *   **Address the "Underspecified vs. Inherent" Question:**
          *   It's *both*, but leaning towards inherent limitations of ostensive definition (teaching by example).
          *   A rubric helps, but rubrics can also be gamed or misinterpreted.
          *   The core issue is *inductive bias*. The TAs are induction machines looking for the simplest rule that fits the data. "Phrase = Points" is a simpler rule than "Substantive engagement = Points."
      *   **Diagnose the Training Method:**
          *   The "match/mismatch" feedback loop is the culprit. It provides *negative/positive reinforcement* without *reasoning*.
          *   It treats grading as a pattern recognition task rather than a normative judgment task.
      *   **Propose Solutions (The "What would actually correcting it require?" part):**
          *   *Diversify the Calibration Stack:* Need negative examples (good essays without the phrase, bad essays with the phrase). This breaks the correlation.
          *   *Explain the "Why":* Move from binary feedback to justificatory feedback. "I gave this a B+ because..."
          *   *Blind Calibration:* Grade, then discuss *reasons* before comparing scores.
          *   *Meta-Grading:* Grade the TAs' comments, not just their scores.
          *   *Iterative Rubric Co-creation:* Have TAs help build the rubric based on the essays.
      *   **Philosophical Angle:** Since this is a philosophy professor, touch on Wittgenstein (rule-following), tacit knowledge (Polanyi), or the problem of induction.

