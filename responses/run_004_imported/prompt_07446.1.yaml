answer: |-
  **MEMORANDUM**

  **TO:** Pilot Programs Committee
  **FROM:** Graduate Fellow Seat
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Futarchy Pilot Proposal (Mental Health Crisis Response)

  ### Executive Summary

  This memo recommends **conditional approval** of the proposed decision market pilot regarding mental health crisis response expansion. While the mechanism offers a novel method for aggregating empirical expectations, the Community Representatives' objections regarding metric validity and non-monetary manipulation risks are substantively correct and cannot be dismissed via standard market-efficiency arguments.

  To proceed, the pilot must be modified from a binding futarchy model to a **constrained decision market with legislative ratification.** The conditions below specifically address the political nature of metric definition and the risk that actors may accept financial losses to secure policy outcomes.

  ### Analysis of Objections

  The Committee deadlock centers on two specific critiques of the Hansonian framework raised by the Community Representatives. As a matter of policy design, these critiques require structural mitigations rather than theoretical rebuttals.

  **1. The Metric as a Value Judgment**
  The proposal assumes we can "vote on values" by fixing a metric (*adverse outcomes per 1,000 calls*) and "bet on beliefs" regarding which policy moves that metric. The Community Representatives correctly note that operationalizing "adverse outcome" is itself a value judgment.
  *   *Risk:* If an involuntary hold counts as a "successful safety intervention" for one constituency but a "harmful civil rights violation" for another, the market is not measuring harm; it is measuring compliance with a specific ideological framework.
  *   *Implication:* A market cannot legitimize a metric that lacks prior democratic consensus. The metric definition cannot be a staff determination; it must be a deliberative output.

  **2. Non-Monetary Incentives and Manipulation**
  The standard defense against market manipulation is that liars lose money to truth-tellers. This assumes traders maximize only financial utility.
  *   *Risk:* Institutional actors (e.g., police unions, private healthcare contractors) may derive greater utility from a specific policy outcome (e.g., securing a contract, maintaining operational scope) than they lose in a subsidized prediction market. They can afford to "buy" the wrong policy by absorbing trading losses as a lobbying cost.
  *   *Implication:* Position limits and eligibility restrictions are necessary. We cannot rely on market arbitrage to police bad actors when their incentives are political, not financial.

  ### Recommendation: Approve with Conditions

  I recommend the Committee forward the pilot to the City Council with the following four mandatory conditions. These conditions shift the mechanism from a binding *futarchy* (where the market decides) to an evidentiary *decision market* (where the market informs a democratic decision).

  **Condition 1: Participatory Metric Definition (Pre-Market)**
  Before any trading opens, the definition of "Adverse Outcome" must be ratified by the City Council following a recommendation from a **Metric Working Group**.
  *   **Composition:** The Working Group must include the two Community Representatives, agency liaisons, and independent epidemiologists.
  *   **Requirement:** The metric must be disaggregated. We cannot trade on a single composite number. Markets must price distinct outcomes (e.g., *Rate of Physical Injury*, *Rate of Involuntary Detention*, *Rate of Repeat Calls*). This prevents the masking of trade-offs. The Council will weight these metrics based on community values *before* the market assesses the probability of achieving them.

  **Condition 2: Trader Eligibility and "Skin in the Game" Limits**
  To mitigate the risk of policy-driven manipulation:
  *   **Exclusion:** Any entity with a direct financial or contractual interest in the outcome (e.g., police unions, current or prospective vendors of crisis services) is prohibited from trading.
  *   **Subsidized Community Seats:** 50% of the market liquidity must be reserved for a randomized panel of city residents and credentialed clinicians, whose trading losses are fully subsidized by the city. This ensures the market price reflects community epistemology, not just speculative capital.
  *   **Position Caps:** No single trader (or coordinated group) may hold more than 5% of the outstanding shares on either side of the conditional market.

  **Condition 3: The "Legislative Override" Clause**
  The City Council shall not be legally bound to fund the market winner. Instead, the market result creates a **rebuttable presumption**.
  *   **Mechanism:** If the market identifies a clear winner (e.g., price differential >15% with high volume), the Council must vote on that recommendation. To deviate from the market's recommendation, the Council must pass a motion of override with a **two-thirds majority**.
  *   **Rationale:** This preserves the "horse-trading" reduction benefit (it is politically costly to ignore the data) while retaining democratic sovereignty if the market integrity is compromised or if the metric fails to capture emergent harms.

  **Condition 4: Independent Audit and Sunset**
  *   **Audit:** An independent third party (e.g., a university partner) must monitor trading patterns for collusion or anomalous positioning throughout the two-year pilot.
  *   **Sunset:** The commitment to use this mechanism expires automatically after this decision. Future use requires new Committee approval. This ensures we treat this as an experiment, not a precedent for all civic decision-making.

  ### Conclusion

  The Community Representatives are right: in high-stakes public policy, information aggregation cannot be decoupled from power dynamics. However, rejecting the pilot entirely forfeits an opportunity to ground this polarized debate in better data.

  By adopting these conditions, we test the utility of prediction markets for policy without ceding democratic authority to them. We acknowledge that while markets may be better at estimating *beliefs*, the definition of *values* and the final authorization of *force* must remain deliberative and democratic.

  **Action Required:** Vote to recommend **Approval with Conditions** to the Full Council.
