          *   *Cons:* Detached from *chreia* (need). No intrinsic use. "Mining" is wasteful labor without tangible product. Detached from the *Polis*.
          *   *Judgment:* A fetishized token of *chrematistike*, worse than fiat in terms of detachment from need, even if better on supply limits.
      *   **Section 4: Mining as Production.**
