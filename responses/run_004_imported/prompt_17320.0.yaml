      *   Insert specific citations (e.g., *Pol.* 1257a, *NE* 1133a).
      *   Add "Textual Basis" and "Informed Speculation" markers or a concluding methodology section. (Better to integrate the flags into the flow or have a specific section. The prompt asks to "flag which parts...". I will use explicit parentheticals or a dedicated methodology section at the end, but integrating it into the analysis is more readable. Let's use explicit "Textual Grounding" and "Extrapolation" notes within the sections).
