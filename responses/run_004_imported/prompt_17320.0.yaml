      *   **Section 2: Fiat Currency.**
          *   *Pros:* Fits *nomos* (state guarantee).
          *   *Cons:* Unlimited supply violates the "measure" function. Interest (*tokos*) is inherent to the banking system supporting it.
          *   *Judgment:* Institutionalized *chrematistike*.
      *   **Section 3: Bitcoin.**
