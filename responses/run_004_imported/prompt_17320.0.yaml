      *   *Correction on Bitcoin:* Is the cap "natural"? No, it's arbitrary (*nomos* coded). Natural limitation comes from the limit of human need, not a number.
      *   *Mining:* Compare to *Politics* I.8 on hunting/warfare. Some acquisition is natural (from nature), some from men. Mining consumes nature (energy) to make a convention. This is highly unnatural.
      *   *Polis Context:* Crucial point. Money exists for the *Polis*. Bitcoin is designed to bypass the *Polis*. This makes it illegitimate by Aristotelian definition.

  7.  **Drafting the Response (incorporating "Flagging"):**
