answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've had the privilege of being Priya's friend since our undergrad days, long before she became the person who politely corrects you at dinner parties if you say, "It just wasn't meant to be."

  Standing here, I knew I had a specific philosophical constraint. Usually, at a wedding, I'd say something like, "Looking at them, you know it was written in the stars." But given that Priya wrote her entire dissertation on Aristotle's *De Interpretatione*, saying their love was "written in the stars" is basically inviting her to fact-check my toast mid-sentence.

  For the family and Marcus's colleagues: Priya spent a decade studying a specific argument about a naval battle. Aristotle asked, "If I say 'there will be a sea battle tomorrow,' is that statement true right now?" If you say yes, then the battle is inevitable. Fate is real. Free will is an illusion. And Priya has spent ten years explaining why that's logically messy.

  For the logic cohort in the back: Yes, I know. I'm aware that a Peircean reading blocks the fatalist inference by denying the excluded middle for future contingents. I also know an Ockhamist would say the proposition has a truth value relative to the actual future history. But please, put down the beer steins; I'm not going to model branching time semantics on a napkin tonight.

  Here is the point that matters for all of us. If I say Priya and Marcus were "destined" to be together, I'm saying their choice didn't matter. I'm saying the past forced this future. And anyone who knows them knows that nothing about their relationship was forced. It was chosen. Again and again.

  Aristotle's insight wasn't that we can't know the future. It's that the future is *open*. It waits for us to make it true.

  So, I am not going to say, "It was always going to work out." That's fatalism.
  I am not going to say, "We'll see what happens." That's just anxiety.

  Instead, I want to say this: The proposition "Priya and Marcus will have a wonderful life together" does not derive its truth from the past. It derives its truth from *them*.

  Every morning they choose patience over annoyance. Every time they choose listening over being right. Every time they choose "we" over "me." They are not discovering a future that was already written; they are writing it. They are taking the open sea of tomorrow—with all its contingent storms and calm waters—and navigating it together.

  In logic, we talk about truth conditions. Well, the truth condition for a happy marriage isn't fate. It's commitment. It's the active, daily work of making the statement "We are happy" come true, even though it wasn't guaranteed yesterday.

  Priya, you've spent your career arguing that the future is not fixed. Marcus, you are the perfect partner for that world. You don't try to control the tide; you just hold the wheel together.

  So, if everyone could raise a glass.

  To Priya and Marcus. May your future remain gloriously open. May you never mistake necessity for contingency. And may you spend the rest of your lives proving, one day at a time, that the best truths are the ones we build together.

  To the happy couple!
