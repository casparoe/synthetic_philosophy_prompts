answer: |-
  **MEMORANDUM**

  **TO:** Justice [Name]
  **FROM:** [Your Name], Law Clerk
  **DATE:** October 26, 2023
  **RE:** *Doe v. Clinic et al.* – Recommendation on "Wrongful Life" Claim

  **I. QUESTION PRESENTED**

  Whether this Court should recognize a common-law cause of action for "wrongful life," wherein a child born with severe genetic impairments seeks damages for being born rather than not existing, specifically where the plaintiff relies on a philosophical "asymmetry" theory of harm to overcome the traditional objection that no comparison can be made between impaired life and non-existence.

  **II. BRIEF ANSWER**

  I recommend that the Court **affirm the lower court's dismissal** and decline to recognize the tort of "wrongful life."

  While the plaintiff's reliance on David Benatar's "asymmetry argument" offers a coherent philosophical framework for asserting that existence can be a harm, adopting it as a legal standard presents insurmountable difficulties in damages calculation, conflicts with the state's public policy presumption that life is preferable to non-life, and risks stigmatizing the disabled community. The existing tort of "wrongful birth" (brought by the parents) remains the appropriate vehicle for recovering the economic and emotional costs associated with the negligence.

  **III. FACTUAL BACKGROUND**

  Plaintiff, a minor represented by a guardian ad litem, was born with [Specific Disorder], a severe, degenerative genetic condition resulting in chronic pain and limited cognitive function. Plaintiff alleges that Defendant Clinician negligently performed or interpreted prenatal genetic testing, depriving Plaintiff's parents of information material to their decision to terminate the pregnancy.

  Plaintiff does not sue for the parents' costs (a "wrongful birth" claim, which is actionable in this state). Instead, Plaintiff sues on her own behalf for "wrongful life." She argues that but for the negligence, she would not exist. She contends that her current existence, characterized by suffering, is a legal injury compared to the alternative of non-existence. The trial court dismissed the claim, citing the impossibility of calculating damages without a baseline of non-existence.

  **IV. LEGAL ANALYSIS**

  **A. The Majority Rule: The "Comparison Problem"**
  The vast majority of jurisdictions (including New York in *Becker v. Schwartz* and New Jersey in *Procanik v. Cillo*) have rejected "wrongful life" claims while permitting "wrongful birth" claims for parents. The traditional rationale is metaphysical and practical: the law cannot weigh an impaired life against non-existence. To find for the plaintiff, a jury must declare that the plaintiff would have been better off never having been born. Courts generally view this as a determination they are ill-equipped to make, fearing it implies that the lives of disabled persons are legally cognizable injuries.

  **B. The Plaintiff's Theory: Benatar's Asymmetry**
  Plaintiff's brief attempts to solve the "comparison problem" by importing David Benatar's anti-natalist philosophical framework. The argument proceeds as follows:
  1.  **Presence of Pain:** The presence of suffering is bad for the sufferer.
  2.  **Absence of Pleasure:** The absence of well-being in a state of non-existence is *not bad* for anyone (because there is no one to be deprived).
  3.  **Conclusion:** Therefore, one does not need to compare "life" to "non-life" as two states of being. One only needs to acknowledge that the pain in the actual state is a genuine harm, while the "loss" of non-existence is not a harm to anyone. Thus, being brought into existence with severe suffering is a net harm without requiring a coherent comparison class.

  This is a sophisticated argument that has gained traction in bioethics circles but has never been adopted as a controlling legal theory by an American appellate court.

  **C. Reasons to Decline the Claim**
  Despite the logical consistency of the asymmetry argument within moral philosophy, there are four compelling reasons for this Court to reject it as a basis for tort liability:

  1.  **Judicial Administrability and Damages:** Even if we accept the asymmetry theory establishes *liability*, it provides no metric for *damages*. Tort law aims to make a plaintiff whole. If the baseline is non-existence, how does the Court calculate the value of "not being born"? If we limit damages to "special damages" (medical costs) incurred during the child's life, we risk double recovery (since parents can sue for these in a wrongful birth action). If we allow "general damages" for the pain of living, we require a jury to place a dollar value on the difference between being dead and being alive with a disability. This remains mathematically and legally incoherent regardless of the philosophical justification.

  2.  **Public Policy and the Presumption of Life:** The law operates on a fundamental presumption that life is a benefit, not a detriment. Adopting Benatar's asymmetry as a legal standard would require the state to officially endorse the view that, in certain conditions, non-existence is preferable to existence. While individuals may hold this view privately, codifying it creates a dangerous precedent. It suggests that the state recognizes a "right not to be born" that trumps the value of living with a disability.

  3.  **Impact on the Disabled Community:** Recognizing this claim sends a deleterious message to citizens living with disabilities: that the law views their lives as injuries compensable by money. This reinforces the very stigma the Americans with Disabilities Act and state civil rights laws seek to eradicate. It creates a legal distinction between "lives worth living" and "lives amounting to legal harm."

  4.  **Adequacy of Alternative Remedies:** The parents retain the right to sue for "wrongful birth." That cause of action allows recovery for the emotional distress of the parents and the extraordinary medical costs of raising the child. This provides a remedy for the negligence without requiring the Court to adjudicate the metaphysical value of the child's existence. The child's needs are met through the parents' recovery and existing social safety nets, without necessitating a theory that the child herself was injured by her birth.

  **D. Counter-Arguments for Recognition**
  Fairness requires acknowledging the arguments for recognition, primarily advanced by the minority view (e.g., *Curlender v. Bio-Science Laboratories*):
  *   **Consistency:** If the parents have a right to recover for the loss of the choice to terminate, logic suggests the child should recover for the loss of the choice to not exist. Denying the child's claim while allowing the parents' creates a legal fiction where the injury is real for the parents but nonexistent for the child.
  *   **Deterrence:** Recognizing the claim increases the financial liability of negligent providers, theoretically incentivizing higher standards of care in prenatal testing.
  *   **Compensation for Suffering:** In cases of extreme suffering where the child outlives the parents, a "wrongful birth" settlement may be exhausted, leaving the child without resources for their specific pain and suffering. A direct claim ensures funds remain with the victim.

  However, these policy goals can be achieved through robust "wrongful birth" damages and structured settlements without adopting the metaphysically fraught "wrongful life" theory.

  **V. RECOMMENDATION**

  I recommend the Court **affirm the dismissal of the child's claim.**

  While the Benatar asymmetry argument is philosophically intriguing, it is ill-suited for translation into a legal standard of care and damages. Adopting it would commit the Court to a theory of harm that devalues disabled life and creates an unadministrable damages framework.

  **Proposed Disposition:**
  1.  **Hold:** State common law does not recognize a cause of action for "wrongful life."
  2.  **Rationale:** The impossibility of calculating damages relative to non-existence; the public policy presumption favoring life; and the adequacy of "wrongful birth" actions to address the economic consequences of the negligence.
  3.  **Dicta:** Acknowledge the severity of the plaintiff's condition and the sympathy the Court holds. Note that if the law is to change to recognize such claims, it should come from the Legislature, which is better equipped to balance the ethical, medical, and social implications than the judiciary.

  **VI. PREPARATION FOR ORAL ARGUMENT**

  Counsel for the Plaintiff will likely press the "logical inconsistency" of allowing parents to sue but not the child. Be prepared to ask:
  *   "If we accept your theory of harm, how do you instruct a jury to calculate general damages? What is the dollar value of non-existence?"
  *   "Does adopting this theory require the Court to legally declare that some lives are not worth living?"

  Counsel for the Defense will likely emphasize the "slippery slope." Be prepared to ask:
  *   "Does rejecting this claim leave the child without recourse if the parents' recovery is exhausted or mismanaged?" (Answer: That is a matter for trust law or legislative intervention, not tort expansion).

  **Respectfully submitted,**

  [Your Name]
  Law Clerk
