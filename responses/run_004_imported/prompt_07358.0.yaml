answer: |-
  # The Growth Fallacy: Why Samuelson Was Right About Kelly

  The debate over the Kelly criterion is one of the most enduring friction points in decision theory. On one side stand the growth optimizers: John Kelly, Ed Thorp, and modern proponents of ergodicity economics like Ole Peters. They argue that maximizing the expected logarithm of wealth is not merely a preference for those with log-utility, but an objective mathematical necessity for any agent operating in a multiplicative, uncertain world over time. To deviate from Kelly is to invite ruin or suboptimal growth; to follow it is to align with the physics of compounding.

  On the other side stands Paul Samuelson, backed by Robert Merton and the orthodox expected utility (EU) establishment. Samuelson argued that the "long run" is a misleading abstraction, that probability-1 dominance over an infinite horizon is irrelevant to finite human lives, and that claiming Kelly is "objectively rational" is a fallacy that smuggles a specific utility function (log wealth) in under the guise of mathematical law.

  This essay takes a side: **Samuelson was right.** While the ergodicity critics correctly identify flaws in how standard finance models handle time and ruin, their leap to declaring Kelly-optimality as a universal standard of rationality is a category error. Rationality is about the coherence of preferences, not the maximization of a specific physical metric. Kelly is a powerful *constraint* on rational action, but it is not the *objective* of rational action.

  ### The Allure of Objective Growth

  To understand why the Kelly argument is so seductive, one must appreciate the strength of the ergodicity critique. Standard expected utility theory often relies on ensemble averages: it asks what would happen if you could play a gamble across a million parallel universes and average the results. But humans live in a single timeline. In multiplicative processes (like investing), where today's capital base determines tomorrow's betting capacity, the time average does not equal the ensemble average. The system is non-ergodic.

  The Kelly proponents argue that if you bet too aggressively (over-Kelly), volatility drags down your geometric mean return, eventually leading to ruin. If you bet too conservatively (under-Kelly), you grow slower than necessary. The Kelly fraction maximizes the almost-sure asymptotic growth rate. As Thorp and Peters emphasize, if you play long enough, a Kelly bettor will almost surely outperform any other strategy. This sounds like a law of physics: if you want to survive and grow in a stochastic environment, this is the way. It frames Kelly not as a preference, but as a survival requirement.

  ### Samuelson's Scalpel

  Samuelson's rebuttal cuts through this physicalist analogy with surgical precision. His argument rests on three pillars: finite horizons, the definition of utility, and the relationship between limits and expectations.

  First, the "long run" in which Kelly dominates is infinite. Samuelson noted that for any finite time horizon $T$, no matter how large, there is always a utility function for which a non-Kelly strategy yields higher expected utility. If an agent needs a specific sum of money for retirement in 30 years, or if they have a utility function that is more risk-averse than log-wealth (which is empirically true for most humans), the Kelly path may expose them to unacceptable drawdowns along the way. Probability-1 dominance at $T=\infty$ offers no comfort at $T=40$ if the path involved a 90% drawdown that caused psychological or financial ruin earlier.

  Second, and more fundamentally, Samuelson insisted that rationality is defined by the consistency of preferences (the von Neumann-Morgenstern axioms), not by the optimization of wealth. If an agent prefers a guaranteed \$1 million to a 50% chance at \$10 million, that is their utility. To tell them they are "irrational" for not betting Kelly is to tell them they are irrational for not having log-utility. It conflates *instrumental rationality* (how best to achieve a goal) with *normative rationality* (what goals one should have).

  Finally, Samuelson pointed out a mathematical subtlety that the Kelly crowd often glosses over: the limit of the expectation is not the expectation of the limit. Just because the probability of Kelly wealth exceeding other wealth goes to 1 as time goes to infinity does not mean the *expected utility* of Kelly wealth is higher. The "tail" of the distribution where Kelly loses might be small in probability but massive in utility impact for a non-log agent.

  ### The Verdict: Constraint vs. Commandment

  So, where does the truth lie? The ergodicity economists are correct that standard EU theory often ignores the physical reality of non-ergodic dynamics. You cannot average across parallel selves; you must survive in your own timeline. In this specific sense, Kelly identifies a **boundary condition** for rationality: in a repeated multiplicative game, betting above the Kelly criterion is indeed irrational because it reduces growth *and* increases risk of ruin. It is strictly dominated.

  However, the Kelly proponents overreach when they claim that maximizing growth is the *only* rational objective. This is where Samuelson wins the philosophical war. By declaring Kelly the universal standard, they are implicitly asserting that the only thing that matters is the asymptotic size of the bankroll. But wealth is not utility. Wealth is an input to utility.

  Consider an agent who derives utility from consumption smoothing. A full-Kelly strategy is notoriously volatile; it can involve 50% drawdowns that are mathematically recoverable but practically devastating for an agent who needs to eat or pay bills during the drawdown. For this agent, a "fractional Kelly" strategy (betting half the optimal fraction) sacrifices some long-run growth for stability. Is this irrational? Under the strict Kelly dogma, yes. Under Samuelson's framework, no—it is the optimal solution for an agent with higher risk aversion or consumption needs.

  To claim Kelly is "objectively rational" is to commit the naturalistic fallacy: deriving an *ought* from an *is*. The *is* is that wealth compounds multiplicatively and ruin is absorbing. The *ought* is that you should maximize geometric growth. But that *ought* only follows if you value geometric growth above all else. If you value sleep, stability, or legacy preservation more than maximal terminal wealth, Kelly is not your rational optimum.

  Samuelson's one-syllable paper mocked the idea that "much time" makes a bad bet good. He was highlighting that we do not live in the limit. We live in the transient. In the transient, the path matters as much as the destination. A strategy that maximizes the destination but makes the path unbearable (via volatility) is not rational for a human agent, even if it is rational for a pure wealth-accumulation algorithm.

  ### Conclusion

  The Kelly criterion is perhaps the most important tool in the quantitative investor's toolkit, and the ergodicity critique has rightly forced economists to take time-averages and ruin more seriously. It has exposed the fragility of ensemble-average thinking. But it has not dethroned Expected Utility Theory as the definition of rationality.

  Samuelson was right: there is no "geometric rationality" that supersedes individual preference. Kelly optimality is not a law of nature that dictates how we *should* value money; it is a mathematical fact about how money *grows*. Confusing the mechanics of growth with the ethics of choice is a dangerous error. Rationality remains the art of aligning actions with preferences, not the blind maximization of a growth rate. Kelly tells you the speed limit of the highway; Samuelson reminds you that you are allowed to drive slower if you prefer the view.
