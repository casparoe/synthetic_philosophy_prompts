answer: |-
  This is an excellent juncture in your doctoral work. You are correctly identifying that Harsanyi's Aggregation Theorem is one of the most formidable formal challenges to non-utilitarian theories of justice. It is not merely an intuition pump; it is a representation theorem. If you accept the premises, the conclusion follows deductively.

  However, your proposed conclusion—that this "settles" the dispute and renders Rawlsianism irrational or confused—is too strong. In the literature on social choice and political philosophy, Harsanyi's theorem is generally viewed not as a *reductio* of Rawlsianism, but as a precise delineation of the commitments required to accept utilitarianism. The Rawlsian reply is not to deny the math, but to deny that the axioms of the theorem map correctly onto the moral problem of justice.

  To pressure-test your presentation, here are the four strongest lines of objection a sophisticated Rawlsian (or a critic like Amartya Sen or John Weymark) would raise. None of these are "confusions" about rationality; they are substantive disagreements about the informational and moral structure of social choice.

  ### 1. The Interpersonal Comparability Problem (The Technical Gap)
  Your claim is that the math forces social welfare to be a *sum* of individual utilities. Technically, Harsanyi's theorem shows that the social welfare function $W$ must be a linear combination of individual vNM utilities $U_i$:
  $$ W = \sum_{i=1}^n a_i U_i + c $$
  However, vNM utility functions are unique only up to **positive affine transformations** (i.e., $U'_i = \alpha U_i + \beta$, where $\alpha > 0$).

  To interpret this sum as *classical utilitarianism* (where everyone counts for one), you must assume **Full Cardinal Unit Comparability**. You need to be able to fix the zero points and the units of measurement across different persons. The theorem itself does not guarantee this; it is an additional ethical assumption imported *outside* the formalism.

  *   **The Rawlsian Reply:** A Rawlsian can accept the theorem but argue that there is no empirical or metaphysical basis for fixing these interpersonal scales without begging the question. If we cannot non-arbitrarily compare the "size" of your utility unit to mine, the aggregation cannot proceed. Rawls argues that we should avoid relying on such controversial psychological magnitudes and instead focus on an index of **primary goods** (rights, liberties, opportunities, income), which are publicly observable and comparable.
  *   **Verdict:** This isn't a rejection of the math; it's a rejection of the *input*. If the inputs (interpersonally comparable utilities) are unavailable or morally suspect, the theorem doesn't get off the ground.

  ### 2. Risk vs. Uncertainty (The Veil of Ignorance)
  This is the most famous philosophical divergence. Harsanyi models the "Veil of Ignorance" as a situation of **risk**: the chooser knows the possible social positions and assigns an equal probability (Laplacean principle of insufficient reason) to occupying any of them. This justifies using Expected Utility Theory (vNM).

  Rawls explicitly models the Veil as a situation of **radical uncertainty**. The parties do not know the probabilities of ending up in any specific position.

  *   **The Rawlsian Reply:** When probabilities are unknown, the vNM axioms (specifically the Independence Axiom) do not apply. In decisions of high stakes with no possibility of reversal (like choosing the basic structure of society), it is not "irrational" to adopt the **Maximin** rule. Maximin is a decision rule for uncertainty, not risk.
  *   **Verdict:** Harsanyi and Rawls are solving different decision problems. Harsanyi solves for rational choice under *risk*; Rawls solves for rational choice under *uncertainty*. To say Rawls is "confused about rationality" is to assert without argument that the political choice situation *must* be modeled as risk. Rawls provides substantive arguments (the gravity of the stakes, the irrelevance of probabilistic calculation for constitutional essentials) for why it is not.

  ### 3. Welfarism and the Pareto Principle
  Your argument suggests that rejecting the Pareto principle is the only way out for a Rawlsian. You characterize this as "quietly rejecting" a plausible principle. However, rejecting Strong Pareto is a standard, defended move in non-welfarist justice theories.

  Harsanyi's theorem is **welfarist**: it assumes the only information relevant to social justice is individual utility information.
  *   **The Rawlsian Reply:** Justice is not about maximizing preference satisfaction. It is about fairness, rights, and the social bases of self-respect.
      *   **Adaptive Preferences:** If an oppressed group lowers their expectations to avoid disappointment (a la Sen/Elster), Pareto improvements might entrench injustice.
      *   **Malicious Preferences:** If my utility increases from your subjugation, a welfarist aggregation must count that. Rawlsians argue that justice *constrains* which preferences count, violating the neutrality required by the Pareto principle in the theorem.
  *   **Verdict:** Rejecting Pareto here isn't irrationality; it's the assertion that **the Right is prior to the Good**. If you believe there are deontological constraints on aggregation (e.g., rights that cannot be traded for aggregate utility), you *must* violate the conditions of Harsanyi's theorem. The theorem proves that *if* you are a welfarist, you must be a utilitarian. It does not prove you must be a welfarist.

  ### 4. The "Is-Ought" of Rationality
  Finally, there is a meta-ethical objection. Harsanyi's theorem derives a moral conclusion (utilitarianism) from premises about *instrumental rationality* (vNM axioms).

  *   **The Rawlsian Reply:** There is a category error between **prudential rationality** (what is good for me to choose) and **moral rationality** (what is just). Even if a single rational agent behind a veil would choose utilitarianism (which Rawls denies), that does not entail that society *ought* to maximize that function. The parties in Rawls's Original Position are *representatives* of free and equal citizens, not gamblers trying to maximize an expected payoff. Their goal is to secure conditions for their constituents to pursue their own conceptions of the good, not to maximize a aggregate metric.
  *   **Verdict:** This challenges the normative force of the theorem. It shows what a rational *self-interested* chooser would agree to under specific informational constraints. It does not necessarily define *justice*.

  ### Advice for Your Presentation

  If you present the argument as "Harsanyi proves Rawls wrong," you will likely face a tough Q&A from anyone familiar with the social choice literature (specifically the work of **Amartya Sen**, **John Weymark**, or **James Griffin**).

  Instead, I recommend framing your paper as follows:

  1.  **Acknowledge the Power:** Concede that Harsanyi successfully shows that Utilitarianism is the *unique* solution **given** Welfarism, Cardinal Unit Comparability, and Choice under Risk. This isolates the dispute beautifully.
  2.  **Shift the Burden:** Argue that the debate is no longer about the *aggregation procedure* (where Harsanyi wins), but about the **informational basis** and the **modeling of the choice situation** (where Rawls fights back).
  3.  **Refine the Conclusion:** Instead of "Rawlsians are irrational," argue: "Harsanyi demonstrates that Rawlsianism requires the rejection of Welfarism and Expected Utility Theory. This makes Rawlsianism more costly in terms of formal commitments, but not logically incoherent."
  4.  **Engage the Normalization Issue:** Explicitly mention that Harsanyi's theorem yields *weighted* utilitarianism ($\sum a_i U_i$). To get Bentham's equal weighting, you need an additional symmetry assumption. A Rawlsian can argue that there is no rational basis for that symmetry assumption without already presupposing a moral commitment to equality that undermines the "purely rational" derivation.

  ### Recommended Reading for Pressure-Testing
  To ensure you aren't caught off guard, look at these specific critiques:
  *   **Amartya Sen, "Utilitarianism and Welfarism" (1979):** The definitive critique of the informational basis of Harsanyi's theorem.
  *   **John Weymark, "Harsanyi's Social Aggregation Theorem" (1991):** Discusses the necessity of the Pareto axiom and differentiability.
  *   **David Gaus, "The Rational, the Reasonable, and Justification" (1995):** Distinguishes between the rational choice modeling and the moral justification.
  *   **John Rawls, "Kantian Constructivism in Moral Theory" (1980):** Specifically where he distinguishes his view from Harsanyi's regarding the interpretation of the Original Position.

  **Summary:** Harsanyi's theorem is a conditional proof: *If* justice is about satisfying preferences under risk with comparable utilities, *then* it is utilitarian. The Rawlsian survives by denying the antecedent, not the logic. Your presentation will be much stronger if you characterize the Rawlsian position as a deliberate, coherent rejection of the theorem's *scope* rather than a failure to understand its *proof*.
