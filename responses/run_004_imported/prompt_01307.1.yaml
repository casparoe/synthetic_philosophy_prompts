answer: |-
  This is a classic philosophical and economic debate, and while your friend's argument is logically consistent within a specific framework, it is not the final word on human agency. In fact, most modern behavioral economists and philosophers of action would side with your intuition: there *is* a defensible sense in which your choices can come apart from your true values.

  Here is the breakdown of why your friend's argument feels so compelling, where it falls short, and how you can defend the idea that you aren't just lying to yourself.

  ### 1. Your Friend's View: Revealed Preference Theory
  Your friend is articulating **Revealed Preference Theory**, a cornerstone of neoclassical economics associated with Paul Samuelson. In this framework, "preference" is not a mental state (a feeling or a belief); it is a technical definition derived entirely from behavior.

  *   **The Logic:** If you choose A over B when both are available, you have "revealed" a preference for A over B.
  *   **The Advantage:** It makes economics "scientific" by avoiding the need to measure unobservable mental states like "happiness" or "fulfillment."
  *   **The Cost:** It renders concepts like **regret, addiction, weakness of will (akrasia), and self-improvement** incoherent. If choice *defines* preference, you can never choose against your preference. Therefore, you can never be mistaken about what you want.

  As you noted, this leads to the absurd conclusion that a smoker who desperately wants to quit but lights up anyway "prefers" smoking at that moment in the exact same way they "prefer" breathing clean air. It flattens the landscape of human motivation into a single dimension.

  ### 2. The Counter-Argument: Time Inconsistency and Multiple Selves
  The flaw in your friend's argument is that it assumes you are a single, unified agent with a stable ordering of desires. In reality, you are a sequence of different "selves" over time.

  Behavioral economics uses the concept of **Hyperbolic Discounting** (or Time Inconsistency) to explain exactly your situation.
  *   **The "Planning Self" (Morning/Afternoon):** This self values long-term rewards (finishing the book, career satisfaction, pride). This self is willing to sacrifice short-term comfort for long-term gain.
  *   **The "Doing Self" (9:00 PM):** This self is tired, cognitively depleted, and heavily discounts the future. To this self, the immediate dopamine hit of scrolling is worth more than the abstract future benefit of writing.

  When you say, "I prefer writing," you are speaking for your Planning Self. When you scroll, you are obeying your Doing Self. Your friend argues that only the Doing Self counts because it controls the limbs. But if that were true, **commitment devices would not exist.**

  ### 3. The Website Blocker is the Smoking Gun
  Your defense regarding the website blocker is the strongest evidence against your friend's view.

  If preference were simply "whatever I choose in the moment," there would be no rational reason to install a blocker. Installing the blocker restricts your future freedom. Why would a rational agent restrict their own future choices? Only because they anticipate that their **future preferences will diverge from their current values.**

  By installing the blocker, your Planning Self is essentially saying: *"I know that at 9 PM, my 'revealed preference' will be to scroll. I value my writing more than that 9 PM preference, so I am overriding my future self's ability to choose."*

  Your friend dismissed this by saying installing the blocker was just a preference *at that moment*. But that ignores the *structure* of the choice. You didn't just choose to install software; you chose to **bind your future self.** This proves there is a hierarchy of desires, not just a flat list of momentary choices.

  ### 4. Second-Order Desires (The Philosophical Defense)
  The philosopher Harry Frankfurt provided the definitive argument against your friend's position with his concept of **Second-Order Desires**.

  *   **First-Order Desire:** "I want to scroll on my phone." (You share this with many animals.)
  *   **Second-Order Desire:** "I want to *want* to write." (This is uniquely human.)

  Frankfurt argued that your "will" is not defined by whichever impulse wins, but by which desire you **identify** with. You *identify* with the writer. You *disown* the scroller. When you scroll, you are acting against your "volition" (your reflective endorsement), even if you are following your immediate impulse.

  On this view, you are not lying when you say writing is your priority. You are reporting your **second-order volition**. The fact that your first-order impulses often win doesn't change your identity; it just means you are struggling with self-control.

  ### 5. Amartya Sen's Critique
  Even within economics, Nobel laureate Amartya Sen argued that "Choice = Preference" is a mistake. He distinguished between:
  1.  **Preference:** What I choose based on my immediate welfare.
  2.  **Commitment/Value:** What I choose because I believe it is right, even if it lowers my immediate welfare.

  Sen argued that if we define preference only by choice, we cannot explain why people vote (it takes time and has no individual impact), why they keep promises when no one is watching, or why they diet. These are acts of **commitment** where choice diverges from immediate self-interest to align with a higher value.

  ### The Verdict
  Your friend is "right" only if you accept a narrow, technical definition of preference designed for modeling market transactions, not human psychology.

  However, if you want to talk about **priorities, values, and life goals** (which you are), her definition is useless. It makes it impossible to distinguish between a fulfilled life and an addicted one, provided the addict is choosing the drug freely.

  **You are not mistaken about your priorities.** You are experiencing **intra-personal conflict.**
  *   **Your Priority:** Writing (endorsed by your reflective, planning self).
  *   **Your Habit:** Scrolling (driven by your impulsive, tired self).

  The fact that the habit is currently winning the war doesn't mean it's the general you support. The very fact that you feel frustration about it, and that you installed the blocker, proves that your "true" preference (your reflective valuation) is indeed the writing. Your friend is confusing **power** (what controls your hands) with **authority** (what governs your life).

  **Advice:** Don't abandon the goal. Acknowledge that your "9 PM Self" is a bad decision-maker and cannot be trusted. Rely less on willpower (which fails at night) and more on the kind of structural constraints (blockers, writing groups, morning schedules) that allow your Planning Self to protect your priorities from your Doing Self.
