          *   Single agent.
          *   The agent controls the action based on the info.
          *   The information is cost-free.
          *   The utility function is fixed and individual.
          *   *Crucially:* The game structure doesn't change based on the information acquisition itself (no strategic interaction).

  3.  **Evaluate the Insurance Context:**
