      *   **What is the "information"?** Genetic risk status (known to applicant, potentially known to insurer).
      *   **The Problem:** Adverse Selection vs. Information Asymmetry.

  4.  **Identify the Conflict (The "Wrinkle"):**
      *   Good's theorem applies to *one* agent optimizing their own utility.
      *   Insurance markets involve *equilibrium* outcomes between two parties with conflicting interests regarding risk pooling.
      *   **The "Wrinkle":** The theorem doesn't account for *market collapse* or *pooling equilibria*.
      *   **Scenario A (No Genetic Info):** High-risk and low-risk people pool together. Premiums are average. Low-risk subsidize high-risk. Everyone gets coverage (maybe).
      *   **Scenario B (Insurer Has Genetic Info):** Insurer price-discriminates. High-risk people face prohibitive premiums. They drop out. Market unravels (Akerlof's "Market for Lemons").
      *   **Scenario C (Applicant Has Info, Insurer Doesn't):** Adverse selection. High-risk buy more, low-risk buy less. Premiums rise. Low-risk exit. Market unravels.
