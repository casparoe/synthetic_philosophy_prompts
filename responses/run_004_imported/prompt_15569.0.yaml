answer: |-
  You have correctly identified I.J. Good's 1967 theorem, and your understanding of its mathematical claim is accurate: **for a single rational agent, the expected value of free, relevant information is always non-negative.** In a vacuum, a Bayesian decision-maker should never refuse such information.

  However, the economists and bioethicists you are encountering are not ignoring decision theory for political reasons. Rather, you have encountered a **category error** in applying the theorem. Good's theorem applies to *single-agent decision problems*, whereas insurance markets are *multi-agent strategic interactions* (game theory) involving equilibrium effects that Good's theorem does not account for.

  Here is the specific "wrinkle" that resolves the apparent contradiction.

  ### 1. Single-Agent vs. Multi-Agent Equilibrium
  Good's theorem assumes a solitary agent making a choice against "nature." The agent updates their priors, chooses an action, and receives a payoff. The environment does not react strategically to the agent's knowledge.

  In an insurance market, there are at least two strategic agents: the **insurer** and the **applicant**.
  *   **Good's Theorem View:** If the insurer gets genetic data, they can price risk more accurately. Their expected loss decreases; their utility increases.
  *   **Market Equilibrium View:** If the insurer prices based on genetic data, high-risk individuals face prohibitive premiums. They drop out of the market.

  This leads to the phenomenon known as **market unraveling** (famously described by George Akerlof in *The Market for Lemons* and applied to insurance by Rothschild and Stiglitz). If information allows insurers to perfectly segment risk, the "pool" necessary for insurance ceases to exist. Insurance works by pooling uncorrelated risks; if risk becomes certain (or highly predictable) for specific individuals, it is no longer insurable, it is a pre-existing condition.

  If the market unravels, the insurer may end up selling fewer policies or facing a pool consisting only of the highest risks who have nowhere else to go. Thus, even the insurer's expected utility might drop in equilibrium, despite the information being "free." Good's theorem cannot predict this because it does not model the *reaction* of the counterparty.

  ### 2. The Definition of "Efficiency"
  You noted that banning information makes contracts "less accurate, and therefore less efficient." This relies on a specific definition of efficiency (actuarial accuracy). However, in welfare economics, efficiency is usually defined as **Pareto efficiency** (can we make someone better off without making anyone worse off?).

  *   **With Genetic Information:** Contracts are actuarially "fair" for each individual. Low-risk people pay less; high-risk people pay more. However, high-risk people may be priced out of coverage entirely. They are strictly worse off.
  *   **Without Genetic Information:** Contracts are actuarially "unfair" (low-risk subsidize high-risk). However, high-risk people retain access to coverage.

  If society (or the market participants) values **risk pooling** as a good in itself—because people are risk-averse and value security over actuarial fairness—then the "information ban" creates a **pooling equilibrium** that can be Pareto superior to the **separating equilibrium** caused by the genetic data.

  In this context, "ignorance" is a mechanism that enforces a subsidy from the lucky (low genetic risk) to the unlucky (high genetic risk). Removing that mechanism destroys the subsidy, which can lower total social welfare even if it increases actuarial precision.

  ### 3. Ex-Ante vs. Ex-Post Utility
  There is also a temporal wrinkle regarding *when* the utility is calculated.
  *   **Ex-Post (After testing):** If I know I have the gene, and the insurer knows, I am priced out. My utility is low.
  *   **Ex-Ante (Before testing):** Behind a "veil of ignorance" (before I know my genetic status), I do not know if I will be high-risk or low-risk. As a rational agent *ex-ante*, I might prefer a system where I am banned from using the test (or the insurer is banned from seeing it). Why? because it guarantees me affordable insurance regardless of the outcome.

  Economists like John Rawls (in philosophy) or Harsanyi (in economics) have argued that rational agents behind a veil of ignorance would choose rules that protect them against worst-case scenarios. Banning the use of genetic data protects the *ex-ante* utility of all potential applicants, even if it restricts the *ex-post* optimization of the insurer.

  ### 4. The "Rational Agent" is the Market, Not Just the Insurer
  Good's theorem proves that the **insurer** benefits from the information (in isolation). It does not prove that the **system** benefits.

  If the goal is to maximize the insurer's profit, Good's theorem holds (mostly), provided the market doesn't collapse. But if the goal is to maximize social welfare or ensure the viability of the insurance mechanism itself, the theorem is insufficient. The economists arguing for restrictions are prioritizing **systemic stability** over **individual informational advantage**.

  ### Summary
  You have not found a flaw in Good's theorem, but you have found the limit of its applicability.
  1.  **Good's Theorem:** Applies to **Decision Theory** (One agent vs. Nature).
  2.  **Insurance Debate:** Applies to **Game Theory** and **Welfare Economics** (Multiple agents, strategic interaction, equilibrium effects).

  The experts are not setting aside math for politics; they are applying a more complex branch of math (general equilibrium theory) that supersedes single-agent decision theory in this context. The "wrinkle" is that in a strategic market, more information can destroy the conditions required for the market to function, leaving everyone—including the information-holder—worse off.
