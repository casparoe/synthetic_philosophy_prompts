      *   In economics, "efficiency" usually means Pareto efficiency.
      *   If high-risk people become uninsurable, that is often considered a market failure (missing markets), not an efficiency gain, especially if society values insurance as a merit good or if risk aversion is high.
      *   Also, from a social welfare perspective, risk pooling *is* the efficiency mechanism. Perfect information destroys risk pooling.

  6.  **Synthesize the Argument:**
      *   **Acknowledge the Math:** Good's theorem is correct *within its domain* (single-agent decision theory).
