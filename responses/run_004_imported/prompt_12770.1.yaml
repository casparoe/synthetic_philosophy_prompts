answer: |-
  The departmental lounge smelled of stale coffee and ozone. It was 1:45 AM. A single lamp illuminated the low table between them, casting long shadows over a scattered mess of photocopies: Harsanyi's 1955 paper, Diamond's 1967 reply, and a single manila folder marked *Chen / Velez – Finalists*.

  Elias rubbed his temples. He was the Aggregator. Mara, sitting opposite with her knees pulled up to her chest, was the Advocate.

  "It comes down to the indifference," Elias said, tapping the Harsanyi printout. "If Chen and Velez have identical utility functions, and the scholarship provides utility $U$, then giving it to Chen yields social welfare $W = U$. Giving it to Velez yields $W = U$. Flipping a coin yields expected welfare $E[W] = 0.5U + 0.5U = U$. Mathematically, they are the same point. If you prefer the coin, you're violating the axioms."

  Mara stirred her cold tea. "I'm not violating anything, Elias. I'm rejecting the premise that social welfare is just the sum of individual utilities. Diamond proved that if you insist on the VNM axioms for the social planner, you *cannot* care about the distribution of chances. You're building blindness into the definition of rationality."

  "Blindness? Or clarity?" Elias leaned forward. "Look, I know the intuition. The coin feels nobler. But where does that value live? If the outcome is the same—one person gets the money, one doesn't—and the ex-ante expectation is the same, what exactly is the coin buying? It's not buying utility for Chen. It's not buying utility for Velez. So what is it?"

  "It's buying justice," Mara said.

  "Justice isn't a third person in the room," Elias countered. "If you value 'justice,' that's a preference. You have a taste for fair procedures. Fine. Let's put that in the utility function. Let $U_{total} = U_{money} + U_{fairness}$. If flipping the coin gives you a warm glow of moral satisfaction, then the expected utility of the flip is actually *higher* than the deterministic assignment. But then you're not a Diamondian anymore. You're just a Harsanyi utilitarian who counts 'fairness feelings' as a good."

  Mara shook her head slowly. "That's the sleight of hand. You're collapsing the *right* to a chance into a *consequence* of having a chance. If I prefer the coin flip because it respects Chen and Velez as equals, that's not a 'warm glow.' That's a claim about their moral status. If I fold that into utility, I'm saying their status matters only insofar as it generates satisfaction. But what if no one knows about the flip? What if it's a black box? If I decide deterministically but lie and say I flipped, the 'warm glow' is the same. But the moral reality is different."

  "Nobody knows?" Elias raised an eyebrow. "Then it doesn't affect behavior. It doesn't affect welfare. You're worshipping a ghost."

  "I'm worshipping the distinction between persons," Mara said, her voice sharpening. "Harsanyi treats society like a single super-individual. If *I* face a risky choice, it makes sense for me to maximize expected utility. I can lose today and win tomorrow. But society isn't a person. Chen won't be Velez tomorrow. If I give the scholarship to Chen based on a deterministic rule, I have completely sacrificed Velez's claim. I've treated him as if he doesn't exist. The coin flip acknowledges that both claims are valid. It doesn't maximize the sum; it honors the separateness."

  Elias sighed, picking up a pen and twirling it. "The separateness of persons. Rawls loved that phrase. But here's the problem, Mara. If you say the coin flip is *strictly* better than the deterministic assignment, you're saying $0.5U + 0.5U > U$. That's mathematically incoherent unless you're risk-seeking over social welfare. But usually, people argue fairness comes from risk *aversion*. You can't have it both ways. Either you're violating transitivity, or you're smuggling in a non-utility value that you can't define without circularity."

  "I'm not violating transitivity," Mara insisted. "I'm saying the domain of the function is wrong. Harsanyi assumes the only things that matter are final outcomes. Diamond is saying the *process* is part of the outcome space. A world where Chen wins by right is different from a world where Chen wins by lot. They are distinct states of affairs."

  "Are they?" Elias challenged. "Describe the difference without using moral terms. Describe the physical state."

  "The physical state is identical," Mara admitted.

  "Then it's not a state of affairs," Elias said. "It's a narrative. And you want to bind policy to a narrative."

  "I want to bind policy to the reason people accept the loss," Mara shot back. "If Velez loses the deterministic draw, he has been told his claim was worth nothing. If he loses the lottery, he has been told his claim was equal, but luck intervened. That changes his relationship to the institution. That changes social stability. That *is* a utility difference, but it's one your model ignores until it's too late."

  Elias paused. He put the pen down. "Okay. That's an empirical claim. You're saying the *ex-post* utility of the loser is higher in the lottery scenario because they feel treated fairly. If that's true, I concede. The lottery yields higher expected utility because $U_{loser\_lottery} > U_{loser\_deterministic}$. But then we're back to Harsanyi. We just calculated the utilities more carefully."

  "But that's not why I prefer it!" Mara leaned in, frustrated. "Suppose Velez is an ascetic monk. He doesn't care. He feels no slight. His utility is unchanged. Do you still flip the coin?"

  "If his utility is unchanged, and Chen's is unchanged... then socially I am indifferent," Elias said firmly.

  "Exactly," Mara said. "And that's why the theorem fails. Even if Velez feels nothing, even if there is zero utility impact from the 'insult' of the deterministic loss, you *still* ought to flip the coin. Because he had a right to the chance. The value isn't in the feeling. It's in the claim."

  Elias rubbed his face. "A right to a chance. See, that's where I lose you. A right is a protective shield. It stops me from harming you. But here, I *must* harm one of you. I only have one scholarship. There is no world where both get their claim satisfied. So what does the 'right to a chance' protect? It doesn't protect the outcome. It protects... what? The expectation?"

  "It protects the standing," Mara said. "It ensures that when I aggregate your interests, I don't treat you as a vessel for utility that can be emptied to fill another vessel. I treat you as a claimant. The lottery is the only mechanism that doesn't require me to weigh your soul against Chen's. It admits I cannot weigh them."

  "But Harsanyi says we *can* weigh them," Elias said softly. "That's the whole point of interpersonal comparison. If we can't compare, we can't do policy. If we can compare, and they are equal, we are indifferent. If you are not indifferent, you are saying the sum is not the goal."

  "I am saying the sum is not the goal," Mara said. "I'm saying the *structure* of the sum matters. Diamond showed that Harsanyi's axioms force the social welfare function to be linear. Linear means you can compensate a loss to Velez with a gain to Chen. But some things aren't compensable. The chance itself is the good. By denying the chance, you've denied the good, even if the expected value is the same."

  Elias looked at the manila folder. "So you'd flip the coin even if you knew, for a fact, that Chen would use the scholarship to cure a disease and Velez would burn the money?"

  Mara hesitated. "That changes the symmetry. If utilities are different, the calculus changes."

  "Ah," Elias pounced. "So it *is* about utility maximization. You only care about the coin when the utilities are tied. Which means the coin is just a tie-breaking rule. It has no intrinsic value. It's just a randomizer to save you the cost of deciding."

  "No," Mara said, recovering. "It's intrinsic to the tie. When claims are equal, justice demands equal treatment. Deterministic selection is unequal treatment of equals. It privileges one without reason. The coin provides the reason: randomness. It's the only reason that doesn't favor one over the other."

  "But randomness isn't a reason," Elias argued. "It's the absence of a reason. You're building a shrine to the absence of a reason."

  "I'm building a shrine to the limits of reason," Mara corrected. "Harsanyi assumes the social planner is God. God knows the utilities, God sums them, God decides. But we aren't God. We're fallible. We might be wrong about the symmetry. The coin hedges against our own arrogance. It acknowledges that if we can't distinguish, we shouldn't decide."

  Elias sat back, looking at the ceiling. "So it's an epistemic humility argument. Not a moral one."

  "Does it matter?" Mara asked. "If the output is the same—flip the coin—does the derivation matter?"

  "It matters for the next case," Elias said. "If it's humility, then once we are certain of the symmetry, the coin is optional. If it's moral, the coin is mandatory. Harsanyi says it's never mandatory. Diamond says it is. I need to know if I'm flipping this coin because I'm unsure of my math, or because the math is insufficient."

  Mara reached out and touched the folder. "Maybe the math is insufficient because people aren't variables. You can average numbers. You can't average people. When you flip the coin, you aren't averaging them. You're giving each of them the full weight of the decision, probabilistically. Deterministic allocation gives one full weight and the other zero. The integral is the same, but the distribution of dignity is not."

  "Dignity," Elias murmured. "Another non-utility variable."

  "Call it what you want," Mara said. "But if you walk out of here and hand that scholarship to Chen because 'expected value is identical,' and Velez finds out there was no lottery... what will you tell him? That he should be indifferent because his utility was accounted for in the aggregate?"

  "I'll tell him that the world is scarce, and I made the choice that maximized welfare, and since they were equal, the choice was arbitrary anyway," Elias said. "And if he's rational, he'll agree."

  "He won't agree," Mara said. "He'll feel erased. And you'll say his feeling of being erased is just a negative utility to be managed next time. But by then, the trust is gone."

  Elias looked at the coin in his pocket. He'd been thumbing it through the whole conversation. He pulled it out and set it on the table. It spun for a moment, catching the lamplight, before settling. Heads.

  "Harsanyi would say I just generated a random number," Elias said.

  "Diamond would say you just acknowledged a claim," Mara replied.

  "Same action," Elias said. "Different universe."

  "Same action," Mara agreed. "But only one of us can sleep tonight."

  Elias picked up the coin. He looked at the folder, then at Mara. He didn't put the coin away. He didn't open the folder.

  "Tell me this," Elias said. "If we flip, and Chen wins, and then five minutes later we find out Chen lied about his grades... do we take it back?"

  "Obviously."

  "So the procedure isn't sacred," Elias said. "It's instrumental to the outcome's legitimacy."

  "It's constitutive of the outcome's justice," Mara corrected. "But justice isn't the only good. Truth matters too."

  Elias smiled, a tired, crooked thing. "So now we're juggling. Utility, Fairness, Truth. Harsanyi would have a headache."

  "Harsanyi isn't here," Mara said. "It's just us. And the coin."

  Elias held the coin up. "If I flip this, I'm admitting that my model can't tell me what to do."

  "If you don't," Mara said, "you're admitting you don't care whether it can."

  Elias looked at the coin, then at the folder. He didn't flip it. Not yet. The air in the room felt heavy, suspended between the clean lines of the theorem and the messy reality of the choice.

  "Five minutes," Elias said. "Give me five minutes to see if I can find a utility difference. If I can't..."

  "Then you flip," Mara said.

  "Then I flip," Elias agreed.

  He put the coin down on the table, between the photocopies. It sat there, a small disc of metal, weighing nothing, yet anchoring the entire argument. Neither of them moved to touch it.
