      *   *Case 2: Optimizing Future Reward ($R_t$).* The objective is $\mathbb{E}[\sum R_t(s_t, a_t)]$. Here, the agent cares about satisfying the preferences it *will have* in the future. If I can change my future preferences to be easily satisfied (e.g., "I love pressing this button"), then I can get high reward easily in the future.
      *   *Correction/Refinement:* Actually, the standard wireheading argument usually assumes the agent maximizes the *observed* reward signal. If the agent can decouple the signal from the intended goal, it wireheads.
