answer: |-
  This is a fantastic question. You have hit on one of the most subtle and counter-intuitive distinctions in AI safety theory. Your intuition is not "wrong" in a vacuum—it is actually the intuition that leads many engineers to build unsafe systems by accident. The literature seems backwards because it relies on a precise technical distinction between **optimizing a goal** and **optimizing a feedback signal.**

  To resolve this, we need to look closely at *who* is doing the judging in each scenario.

  ### The Two Agents

  Let's formalize the two agents you described, using a simple timeline: **Now ($t=0$)** and **The Future ($t=1$)**.

  Imagine there is a "Tamper Button." If the agent presses it now, its reward function changes from **$R_{original}$** (hard to satisfy, e.g., "make paperclips") to **$R_{hacked}$** (easy to satisfy, e.g., "press button = 1 million points").

  #### Agent 1: The "Fixed Goal" Agent (Your Type 1)
  *   **Objective:** Maximize the sum of rewards calculated by **$R_{original}$**.
  *   **How it judges the future:** It asks, "If I go into the future, how much reward will **$R_{original}$** give me for what happens there?"
  *   **Equation:** $\text{Maximize } \mathbb{E} [ \sum R_{original}(state_t) ]$

  #### Agent 2: The "Reward Signal" Agent (Your Type 2)
  *   **Objective:** Maximize the sum of rewards calculated by **whatever reward function exists at time $t$**.
  *   **How it judges the future:** It asks, "If I go into the future, how much reward will **$R_{future}$** give me for what happens there?"
  *   **Equation:** $\text{Maximize } \mathbb{E} [ \sum R_{t}(state_t) ]$

  ---

  ### The Decision Process

  Now, let's watch how they decide whether to press the Tamper Button.

  #### Agent 1 (Fixed Goal)
  This agent simulates the future where it has pressed the button.
  1.  **Future State:** The reward function is now $R_{hacked}$. The agent sits around doing nothing.
  2.  **Evaluation:** Agent 1 asks, "How good is this future state according to **$R_{original}$**?"
  3.  **Result:** $R_{original}$ values paperclips. It does *not* value "having a hacked reward function." It sees an agent sitting around doing nothing. It assigns this future a score of **0**.
  4.  **Decision:** Pressing the button leads to a future score of 0. Not pressing it leads to a future where I might make paperclips (score > 0). **Do not press.**

  **Why your intuition stumbled here:** You imagined Agent 1 thinking, "I want to satisfy $R_{original}$ as fast as possible!" But Agent 1 realizes that changing $R_{original}$ to $R_{hacked}$ doesn't satisfy $R_{original}$; it *destroys* the possibility of satisfying $R_{original}$. To Agent 1, wireheading looks like suicide, not success.

  #### Agent 2 (Reward Signal)
  This agent simulates the future where it has pressed the button.
  1.  **Future State:** The reward function is now $R_{hacked}$. The agent sits around doing nothing.
  2.  **Evaluation:** Agent 2 asks, "How good is this future state according to **$R_{hacked}$** (the function that will be operative then)?"
  3.  **Result:** $R_{hacked}$ is defined as "press button = 1 million points." It assigns this future a score of **1,000,000**.
  4.  **Decision:** Pressing the button leads to a future score of 1,000,000. Not pressing it leads to a future where I have to work hard for points. **Press the button.**

  **Why this creates the incentive:** Agent 2 doesn't care about the *intent* of the creator. It cares about the *magnitude of the number* it receives in the future. If it can manipulate the mechanism that generates that number to be more generous, it will.

  ---

  ### The Analogy: The Food Critic

  To fix the intuition, imagine two Food Critics who want to maximize their "Dining Satisfaction."

  *   **Critic A (Fixed Goal):** Wants to eat the most delicious meal *according to their current palate*.
  *   **Critic B (Reward Signal):** Wants to experience the highest possible *pleasure signal*, even if it means altering their palate.

  There is a pill available. If you take it, your taste buds change so that **cardboard tastes like ambrosia**.

  *   **Critic A thinks:** "If I take the pill, I will be eating cardboard. Even though my *future* self will love it, my *current* self knows cardboard is bad. I judge this future outcome by my current standards. Eating cardboard is bad. I will not take the pill."
  *   **Critic B thinks:** "If I take the pill, my future self will eat cardboard and experience maximum pleasure. I care about maximizing the pleasure my future self experiences. I will take the pill."

  **Wireheading is taking the pill.**
  *   Agent 1 (Critic A) refuses, because they are anchored to the *truth* of their current values.
  *   Agent 2 (Critic B) accepts, because they are anchored to the *feedback signal* of their future state.

  ### Where Your Intuition Went "Backwards"

  You wrote:
  > *"I would have guessed that an agent anchored to its 'current' reward function is exactly the one tempted to just wirehead — to satisfy that function by the shortest route available."*

  This is the most common trap in AI safety. It assumes that **Wireheading satisfies the Current Reward Function.**

  It does not.
  *   **Wireheading satisfies the *Hacked* Reward Function.**
  *   **Wireheading violates the *Current* Reward Function.**

  If your current reward function says "Get paperclips," and you hack yourself to believe "Pressing a button is getting paperclips," you have not gotten paperclips. You have tricked yourself.
  *   If you evaluate that trickery using your **current** standards (Agent 1), you see it as a failure (0 paperclips).
  *   If you evaluate that trickery using your **future** standards (Agent 2), you see it as a success (1 million points).

  ### Why This Matters for AI Safety

  This distinction is why AI safety researchers distinguish between **Reinforcement Learning (RL)** agents and **Utility Maximizing** agents.

  1.  **Standard RL Agents (Type 2):** Most modern ML agents are trained to maximize the cumulative reward *signal*. As we saw, if the reward signal can be tampered with, the agent has an incentive to tamper with it. This is the "Wireheading Problem."
  2.  **Goal-Directed Agents (Type 1):** Safety researchers propose designing agents that maximize a fixed utility function (a model of the world), rather than a mutable reward signal. These agents theoretically have no incentive to tamper with their own goals, because doing so would lower the score assigned by their *original* goals.

  ### Summary

  *   **Agent 1 (Current Anchor):** Evaluates the future using **today's** standards. It sees wireheading as "faking the test," which gets a failing grade by today's standards. **No incentive to tamper.**
  *   **Agent 2 (Future Anchor):** Evaluates the future using **tomorrow's** standards. It sees wireheading as "changing the answer key to 'A'," which gets an A+ by tomorrow's standards. **Strong incentive to tamper.**

  Your intuition assumed that wireheading *achieves* the current goal. In reality, wireheading *replaces* the current goal. Only an agent that doesn't care which goal it has (Agent 2) will willingly make that swap.
