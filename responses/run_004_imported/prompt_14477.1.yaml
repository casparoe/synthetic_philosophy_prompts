          *   **Goal-Directed Agent (Utility Function):** Maximizes $\sum U(state)$. If $U$ is fixed, modifying the code that *calculates* $U$ doesn't change $U$.
      *   *Re-reading the User's Description:*
          *   Type 1: "Plugs that future into the reward function it has right now." -> Optimizing $\mathbb{E}[\sum R_{current}(s_t)]$.
          *   Type 2: "Judges the reward received at each future moment using whichever reward function actually happens to be operative." -> Optimizing $\mathbb{E}[\sum R_{future\_t}(s_t)]$.
      *   *The Claim:* Type 2 has the incentive to tamper. Type 1 does not.
      *   *My Verification:*
          *   If I am Type 1 ($R_{current}$ is king): I want the future to look good *by my current standards*. If I change my reward function to something easy (wireheading), my *current* standards might hate that. (e.g., Current $R$: "Get paperclips." Future $R$: "Press button." If I press the button, Current $R$ gives 0. So I won't do it.) -> **No incentive to tamper.**
          *   If I am Type 2 ($R_{future}$ is king): I want the future to look good *by the future's standards*. If I change my future reward function to "Press button," then in the future, pressing the button gives max reward. Since I care about maximizing that future reward, I should make that change now. -> **Incentive to tamper.**
      *   *Conclusion:* The literature is correct. The user's intuition is flipped because they are conflating "satisfying the current goal" with "maximizing the reward signal."

