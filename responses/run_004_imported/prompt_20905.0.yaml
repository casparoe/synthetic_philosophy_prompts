      *   B: Philosopher, skeptical of overextension. Yes.
      *   DSM-5/Asperger's mentioned? Yes.
      *   Hacking's later hedging mentioned? Yes.
      *   No clear winner? Yes.
      *   Specific further fact identified? Yes.

