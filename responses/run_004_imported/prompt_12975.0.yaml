answer: |-
  This is one of the most enduring disputes in the history of logic, and the fact that you and your friend are stuck on it is a testament to the text's deliberate density. You are both identifying real tensions in the passage, but I think the textual evidence you've cited leans more heavily in your direction than your friend admits.

  Here is a breakdown of why the scope distinction (your friend's point) is necessary but insufficient, and why the "cannot say determinately" language (your point) suggests Aristotle is indeed flirting with a restriction on bivalence, specifically to block the fatalist inference later sharpened by Diodorus.

  ### 1. The Friend's Scope Distinction: Necessary but Insufficient

  Your friend is correct that Aristotle explicitly makes the modal scope distinction. When Aristotle writes, *"it is necessary that there either will or will not be a sea-battle tomorrow, but it is not necessary that there should be one tomorrow,"* he is distinguishing:

  1.  **Necessity of the Disjunction (Composite):** $\square(p \lor \neg p)$
  2.  **Disjunction of Necessities (Divided):** $\square p \lor \square \neg p$

  Aristotle accepts (1) and rejects (2). This is the "divided/composite" distinction your friend mentioned. If the fatalist argument relied solely on the inference from "It is true that $p$" to "It is *necessarily* true that $p$," then this scope distinction would indeed dissolve the problem.

  **However,** the fatalist argument available to Aristotle (and later Diodorus) is more robust than that. It doesn't just argue from Truth to Necessity; it argues from **Truth to Fixity.**

  The fatalist claim is: If "There will be a sea battle" is *true now*, then the future event is *fixed now*. Even if it is not *logically necessary*, it is *causally inevitable*. If the statement is true now, nothing I do can make it false.

  If Aristotle only makes the scope distinction, he preserves contingency in a modal sense (it's not *necessary*), but he leaves the truth value fixed. If the statement is true now, the future is settled. To save genuine contingency (the idea that my deliberation *matters*), Aristotle needs to block the idea that the truth value is settled *now*.

  ### 2. The "Actually True" Problem: Why Scope Isn't Enough

  This is where your reading gains the upper hand. Look closely at this line from the Edghill translation you provided:

  > "One may indeed be more likely to be true than the other, but it **cannot yet be said to be actually true or actually false**."

  If your friend's reading were correct (that bivalence holds, but necessity doesn't), Aristotle should have written: *"It is true or false, but not necessarily so."*

  Instead, Aristotle adds the temporal qualifier **"yet"** (*oupō* in Greek) and the qualifier **"actually"** (or "definitely," *aphōrismenōs*).

  *   **The "Yet":** This implies a change in status. If the proposition were true now (contingently), it would simply *be* true. The suggestion that it will become true (or false) later implies that it lacks that status currently. In classical logic, truth values are timeless. If a proposition changes from "neither" to "true," it is not behaving according to classical bivalence.
  *   **The "Determinately":** Aristotle distinguishes between things that *are* (and thus make statements true) and things that are *potential*. For past and present events, the state of affairs is fixed, so the truth value is *determinate* (*aphōrismenōs*). For future contingents, the state of affairs is indefinite, so the truth value is indefinite.

  Your friend wants to read "cannot say determinately" as an **epistemic** claim (we don't *know* which is true). But the context is ontological. Aristotle is discussing "things that are not always existent." He is arguing that the *structure of reality* for future contingents is open. If reality is open, the statement describing it cannot have a determinate truth value.

  ### 3. Excluded Middle vs. Bivalence

  The key to reconciling the seemingly contradictory lines in the passage is distinguishing the **Law of Excluded Middle (LEM)** from the **Principle of Bivalence**.

  *   **LEM:** $(p \lor \neg p)$ is always true.
  *   **Bivalence:** For any $p$, either $p$ is true or $p$ is false.

  Look at the text again:
  1.  *"One of the two propositions in such instances must be true and the other false..."* (This affirms LEM for the disjunction).
  2.  *"...but we cannot say determinately that this one or that one is false."* (This restricts Bivalence for the individual disjuncts).

  Aristotle seems to be saying: The *disjunction* ("Battle or no battle") is necessarily true. However, neither *disjunct* ("Battle" / "No battle") possesses a truth value *yet*.

  If your friend insists on classical bivalence, they have to explain away the "cannot yet be said" line as mere rhetoric. But if you accept that Aristotle is distinguishing LEM from Bivalence, the text becomes consistent: The logical law holds (the disjunction is valid), but the semantic assignment of truth values is suspended for future singulars.

  ### 4. The Diodorean Connection and Fatalism

  You asked how this bears on the Diodorean Master Argument. This is the strongest evidence for your side.

  Diodorus Cronus, writing shortly after Aristotle, formulated the Master Argument to prove that only what is actual is possible. His premise relied on the idea that all propositions about the past and future are **either true or false**. If "There will be a sea battle" is true now, then it is impossible for it not to happen (because a true proposition about the future cannot become false without contradiction).

  Aristotle is writing *against* this kind of Megarian/Stoic fatalism.
  *   **If Aristotle accepts Bivalence (Friend's view):** He must argue that Truth does not imply Fixity. This is a hard sell. If it is *true* that I will sit tomorrow, how can I stand?
  *   **If Aristotle rejects Bivalence (Your view):** He blocks the fatalist at the premise. "There will be a sea battle" is not true. "There will not be a sea battle" is not true. Therefore, neither is fixed. My deliberation can tip the scale.

  Aristotle's maneuver is best read as a deliberate blocking of the inference from **Real Future** to **True Proposition**. He is willing to sacrifice the universal applicability of bivalence to save the phenomenon of human agency and contingency.

  ### Conclusion

  Your friend is right that the **modal scope distinction** is present and vital; Aristotle definitely wants to deny that future events are *necessary*.

  However, you are right that the **semantic claim** goes further. The phrase "cannot yet be said to be actually true" resists being absorbed into a mere scope point. It indicates that for Aristotle, truth is a property that arises from the *actualization* of states of affairs. Since future contingent states of affairs are not yet actualized (they are potential), the statements describing them do not yet possess the property of truth.

  Aristotle is not just saying "It's true, but not necessarily." He is saying "It is indefinite, and therefore not yet true." He restricts the Principle of Bivalence for future singulars to prevent the collapse of contingency into fatalism. Your reading is the one that takes the "yet" and "actually" seriously; your friend's reading has to treat them as loose talk. In a text as precise as the *Organon*, the precise wording usually wins.
