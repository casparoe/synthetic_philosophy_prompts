answer: |-
  The clinking of silver against crystal had finally subsided. At the head of the banquet hall, Arthur was wiping his eyes, surrounded by three generations of his students. At table four, Ilse swirled the dregs of her Pinot Noir, not looking at Teo.

  "He thinks we're being civil for his sake," Ilse said.

  "We are being civil," Teo replied, cutting a piece of lamb. "For thirty years, we've managed nothing else."

  "If you bring up the rabbit, I'm leaving."

  Teo smiled, a thin, familiar expression that used to mean *I have you cornered* and now just meant *I am tired*. "God, no. The rabbit died with the seventies. Even Quine stopped trotting it out for the undergraduates. But you still teach it, Ilse. I hear the lectures."

  "I teach it as a propaedeutic. To get them to the proxy function." She turned to him then. "That's where the argument lives. In *Ontological Relativity*. Not translation between languages, but reference within one. If I can map every object in your ontology to a surrogate via a proxy function—numbers to sets, say—and preserve all truth values of all sentences, then there is no fact of the matter about whether you mean *number* or *set*."

  "There's the slide," Teo said softly. "You say 'no fact of the matter.' I say 'no difference that makes a difference.'"

  "It makes a difference to ontology."

  "Does it?" Teo set his knife down. "Look, I'll concede the formal point. The logic holds. If you permute the universe, the sentences stay true. Quine proved that. But you're treating it like a discovery about the world, when it's just a feature of the notation. It's a change of coordinate systems. If I describe a field in Cartesian coordinates or polar coordinates, the physics doesn't change. Why is swapping 'rabbit' for 'rabbit-stage' or 'number' for 'set' any more unsettling than swapping *x* for *y*?"

  "Because in physics, the field is the invariant," Ilse said, leaning in. "In ontology, the objects *are* the variables. If the variables are interchangeable without loss, the objects aren't doing any work. Reference is inscrutable."

  "Or," Teo countered, "reference is robust, and your proxy functions are just philosophical parlor tricks. Here's the problem, Ilse. Even Quine backed off the strong claim. He admitted in *Pursuit of Truth* that the existence of two empirically equivalent but logically incompatible manuals of translation might just be a conjecture. He never produced one. Not for English, not for Jungle. If you can't show me two rival manuals that actually work, why should I believe the proxy function reveals a metaphysical void rather than a logical redundancy?"

  Ilse paused. She picked up her wine glass, watching the light catch the rim. "You're right about the manuals. That was always the weak flank. Chomsky tore it apart, and Quine knew it. He conceded that holophrastic indeterminacy—the idea that whole sentences could vary while stimulus meaning stays fixed—was unproven. I'll grant you that."

  Teo blinked, surprised. He hadn't expected the concession so quickly. "You'll grant it?"

  "It's a conjecture. Fine. But don't confuse the holophrastic thesis with the inscrutability of reference. They are distinct. The proxy argument doesn't depend on translating 'Gavagai' differently. It depends on the fact that reference is underdetermined by the truth conditions of the sentences containing the terms. Even if we agree on every sentence's truth value, I can still reinterpret your terms."

  "But to what end?" Teo pressed. "If all the evidence—every possible observation, every truth value—is held fixed, and the theory works perfectly under both interpretations, then the 'inscrutability' is invisible. It's undetectable. So I ask you again: what evidence would count against your claim? If nothing can falsify the idea that reference is inscrutable, isn't it just dogma?"

  "It's not dogma, it's a reductio," Ilse said, her voice sharpening. "You want evidence? The evidence is that you cannot point to a reference without using a term that itself needs interpreting. You're asking for a view from nowhere, Teo. You want to step outside language to check if language hooks onto the world. But you can't. You're always inside a theory."

  "I'm not asking for a view from nowhere. I'm asking for a reason to care." Teo leaned back, the fight draining out of his posture, replaced by a weary curiosity. "When we were twenty-five, writing that paper on semantic ascent... you thought this mattered because it freed us. If reference is relative, we aren't trapped by the 'real' structure of the world. But now? You sound like you're defending a prison."

  Ilse looked down at the tablecloth. The white linen was stained with wine. "It's not about freedom. It's about honesty. We tell students that words name things. That 'electron' names a particle. But if the proxy function works, 'electron' could name a collection of space-time points, or a number, and the science wouldn't change. To say there is a fact of the matter is to lie."

  "To say there is no fact of the matter is to give up," Teo said. "Look at Arthur."

  They both looked up the table. The old man was laughing, holding court, surrounded by his former students.

  "He introduced us because he thought we were solving the same problem," Teo said. "You think the problem is that we can't pin down reference. I think the problem is that we keep thinking 'reference' is a relation that needs pinning down like a butterfly. It's a capacity. It's what we *do*. When I say 'rabbit,' I'm not mapping a term to an object via a function. I'm participating in a form of life. Your proxy function shows that the mapping is arbitrary. I agree. But the *use* isn't."

  Ilse sighed. "The use is stable. The reference is not. That's the gap."

  "And in that gap," Teo said, "you see a void. I see room to breathe." He paused, then added, "I will concede one thing, though. The coordinate analogy isn't perfect. In physics, we usually prefer the coordinates that make the laws simplest. Maybe you're right that there's no 'simplest' ontology. Maybe the universe doesn't care if we count it in rabbits or rabbit-stages."

  "It doesn't," Ilse said.

  "But," Teo raised a finger, "that doesn't mean *we* don't care. We aren't the universe. We're the ones doing the counting. And for us, for the purpose of getting through the day, or grading papers, or loving someone... the fact of the matter is the one we agree on."

  Ilse looked at him, really looked at him, for the first time in years. The lines around his eyes were deeper. "So you're a pragmatist now? After all the noise about innate structures?"

  "I'm a father," Teo said. "And a pragmatist. When my daughter asks what that is, I point to the tree. I don't run a proxy function on 'tree.' If I did, I'd lose her."

  Ilse felt a tightness in her chest, a phantom pain of collaboration lost. "Quine would say you're confusing epistemology with ontology."

  "Quine isn't here," Teo said, glancing toward the head table where Arthur was raising a glass. "Arthur is. And he didn't spend forty years teaching because reference is inscrutable. He taught because he believed he could pass something real to us."

  The hall began to applaud. Ilse picked up her glass. She didn't toast, just held it.

  "I still think you're wrong," she said quietly. "About the fact of the matter."

  "I know," Teo said, clinking his glass against hers. "But you admit the manuals are just a conjecture."

  "A conjecture," Ilse agreed. "But the proxy function is a theorem."

  "Then let's agree to disagree on the theorem," Teo said. "And drink to the conjecture."

  Ilse smiled, a genuine, tired smile. "To the conjecture."
