      *   *Philosophical Reference:* Harry Frankfurt's "Freedom of the Will and the Concept of a Person" is perfect here (first-order vs. second-order desires). Also Aristotle on *akrasia*.
      *   *Relationship Angle:* The partner feels deprioritized. The user feels misunderstood. The solution isn't just philosophy; it's bridging that gap.

  7.  **Final Polish:**
