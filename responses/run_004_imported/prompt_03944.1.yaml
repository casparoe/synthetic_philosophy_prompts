      *   **The Crucial Distinction:** Distinguish between *valuation* and *execution*. The user values the talk, but lacks the *executive function* or *habit strength* to override the impulse.
      *   **Practical Implications:** How does this help the relationship? Move from "What do you really want?" to "What is blocking you?"
