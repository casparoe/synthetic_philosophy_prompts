answer: |-
  You are right to be annoyed. Your intuition is spot-on: the standard "LW move" (FDT/UDT) largely dissolves the *practical* loss (you don't get the money) by assuming away the *conceptual* barrier (how a mind can actually hold that intention).

  Kavka's puzzle is not primarily a decision-theoretic puzzle about utility maximization; it is a philosophy-of-action puzzle about the **constitutive norms of intention**. The standard rationalist response tends to treat the agent as a function that can output any policy, whereas Kavka is asking about the psychological architecture required to *inhabit* that policy.

  Here is the breakdown of why the "FDT says drink" answer feels unsatisfying, how the philosophical "zoo" actually carves up the problem, and where FDT fits (and doesn't fit) into that landscape.

  ### 1. Kavka's Actual Argument: The Bootstrapping Problem
  To see why FDT routes around the problem, we have to be precise about Kavka's impossibility claim. It relies on a specific view of intention, often called the **Simple View**:
  1.  To intend to $X$, you must believe you will $X$ (or at least not believe you won't).
  2.  To believe you will $X$, you must have evidence/reasons to think you will $X$.
  3.  At $t_1$ (intention time), you know that at $t_2$ (action time), the money is already in the bank (or not). The toxin is only painful.
  4.  Therefore, at $t_2$, a rational agent has zero reason to drink.
  5.  Therefore, at $t_1$, you know you won't drink at $t_2$.
  6.  Therefore, you cannot believe you will drink.
  7.  Therefore, you cannot intend to drink.

  Kavka's point is that you cannot **bootstrap** a reason to act into existence simply by wanting the reward for the intention. The intention requires a belief, and the belief requires a reason, and the reason is absent.

  The LW/FDT move essentially says: *"Step 4 is wrong because the policy 'Drink' is part of the causal/logical antecedent of getting the money."* But this assumes the agent *can* bind itself to that policy in a way that generates the necessary belief at $t_1$. If you are a human with standard cognitive architecture, Kavka argues you literally *can't* generate that belief.

  ### 2. The Philosophical Zoo: Gauthier vs. McClennen vs. Bratman
  You are correct that these are distinct moves, though they share a family resemblance (rejecting naive consequentialism at the moment of action).

  **David Gauthier (Constrained Maximization):**
  *   **The Move:** Gauthier argues that rationality applies to **dispositions**, not just individual acts. You should cultivate a disposition to keep commitments even when it's locally suboptimal.
  *   **The Mechanism:** Transparency. The billionaire pays you because he can *detect* your disposition. If you are a "straightforward maximizer" (who defects at $t_2$), you are detectable as such at $t_1$ and get nothing.
  *   **The Gap:** This solves the *payoff* problem but pushes the *intention* problem back a step. How do you cultivate a disposition to do something you know is irrational at the moment of execution? Gauthier assumes you can rewrite your own utility function.

  **Edward McClennen (Resolute Choice):**
  *   **The Move:** This attacks the **separability** of decision nodes. Standard decision theory assumes the agent at $t_2$ is a new decision-maker who re-optimizes based on current information. McClennen says a rational agent treats the plan formed at $t_1$ as binding at $t_2$.
  *   **The Mechanism:** You don't re-calculate at $t_2$. You execute the plan *because* it was the plan.
  *   **The Gap:** Kavka's rebuttal is essentially: "Okay, but how? What mental state constitutes 'resolute choice' that isn't just self-deception?" If I know drinking is pointless at $t_2$, how do I psychologically prevent myself from reconsidering? McClennen posits the *normativity* of resoluteness but doesn't fully explain the *psychology*.

  **Michael Bratman (Planning Theory of Intention):**
  *   **The Move:** This is the one that actually engages with Kavka's specific worry about the nature of intention. Bratman argues intentions are not just predictions or desires; they are **plan-states** that play a specific functional role in our cognitive architecture.
  *   **The Mechanism:** Intentions have **inertia** and **stability**. It is rational to maintain an intention without re-deliberating because deliberation is costly and coordination (with your future self) is valuable.
  *   **The Solution to Kavka:** Bratman argues that the *fact that you formed the intention at $t_1$* creates a new reason at $t_2$. The reason isn't the money (that's gone); the reason is **consistency with your own planning agency**. To abandon the intention without new information is a failure of rational planning.
  *   **Why it matters:** This provides the missing link for the belief requirement. At $t_1$, you can believe you will drink at $t_2$ not because drinking is intrinsically good, but because *you are the kind of agent whose intentions persist*.

  ### 3. Does FDT/UDT Actually Solve It?
  The "LW-ish move" is effectively a formalization of **McClennen's Resolute Choice** combined with **Gauthier's Disposition** argument, implemented on a computational substrate.

  **Where FDT Wins:**
  FDT dissolves the *decision-theoretic* paradox. It correctly identifies that the action at $t_2$ is logically subjunctively linked to the prediction at $t_1$. An FDT agent *does* get the money. It avoids the dynamic inconsistency that plagues CDT.

  **Where FDT Cheats (relative to Kavka):**
  FDT assumes the agent has access to its own source code. It treats "forming an intention" as "setting a variable."
  *   **For a Computer:** Kavka's puzzle is trivial. You write `if prediction == true: drink()`. You can "intend" because you can bind your future execution.
  *   **For a Human:** Kavka's puzzle is hard. You cannot simply set a variable. You have to navigate the phenomenology of belief and desire.

  When a rationalist says "Just be the kind of agent whose policy is to follow through," they are implicitly advocating for **Bratman-style self-cultivation**. They are saying: *"Train yourself (via habit, identity, or precommitment devices) such that your $t_2$ self does not view the action as optional."*

  However, if you take Kavka's constraint seriously—that you *know* at $t_1$ that you will have no reason at $t_2$—then FDT requires you to believe something that seems false: that you *will* have a reason at $t_2$ (the reason being "I decided to").

  ### 4. The Synthesis: How to Actually "Get" the Money
  If you want to move beyond "FDT says so" and actually solve the puzzle as a human agent, you have to combine the frameworks:

  1.  **FDT/UDT** tells you **which policy** is optimal (Intend + Drink).
  2.  **Bratman** tells you **how to make that policy psychologically possible**. You must adopt a norm where "past intention" counts as a "present reason."
  3.  **Gauthier** reminds you that this only works if the intention is **legible**. You can't just tell yourself you'll drink; you have to actually become the person who drinks.

  **The Verdict on Your Annoyance:**
  You are correct that "FDT says so" is a category error if applied directly to Kavka's specific question. Kavka asked: *"Is it possible to intend?"* FDT answers: *"It is profitable to act."*

  To bridge the gap, you need Bratman. You need to accept that **intentions are reason-giving**. If you accept that, then at $t_1$, you *can* sincerely believe you will drink at $t_2$, because you know your own intentions have inertia. You aren't predicting a magical change in preferences; you are predicting the stability of your own planning agency.

  So, the "Rationalist Solution" isn't just FDT. It's **FDT + a Bratmanian theory of mind**. Without the latter, you're just a CDT agent wishing you could bind yourself, unable to actually form the intention required to trigger the payout. The puzzle isn't solved until you explain how the human brain implements the FDT policy without self-deception. Bratman provides that mechanism.
