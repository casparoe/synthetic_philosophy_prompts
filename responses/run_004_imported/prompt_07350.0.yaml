answer: |-
  Forty years ago, I stood in a cryogenic hall at Fermilab, staring at a vacuum vessel that cost three million dollars. We had to decide whether to seal it and cool it down. If the interior surfaces were contaminated beyond a specific threshold, the experiment would fail. We had no way to measure that threshold without breaking the seal and starting over—a delay that would kill the project's funding.

  I had data on similar vessels. I had models of outgassing rates. I had the expert opinions of twelve senior colleagues. But I could not assign a probability to the proposition: *This specific vessel will hold.*

  To my colleagues, I said, "The risk is acceptable." I signed the logbook. We cooled it. It held. But to this day, I cannot justify that decision with a number. I acted, but I did not calculate. I suspect many of you in this room have signed logbooks like that.

  I mention this not to confess a sin, but to locate us. I am a physicist who has spent retirement trying to understand why that moment felt different from every other risk assessment I ever performed. I have come to realize that the divide in this room is not about mathematics. It is about what we owe each other when the numbers run out.

  For the next two days, you will hear the Ellsberg paradox debated as a question of rationality. For the benefit of my physicist colleagues, let me recall it simply.

  Urn One contains fifty red balls and fifty black balls. Urn Two contains one hundred red and black balls, but the ratio is unknown. You are asked to bet on drawing a red ball. Most people prefer to bet from Urn One. Then, you are asked to bet on drawing a black ball. Most people *still* prefer to bet from Urn One.

  Mathematically, this is inconsistent. If you think Urn Two is likely to have more red balls, you should bet on red. If you think it has more black, you should bet on black. To prefer Urn One in both cases implies you are treating the unknown ratio not as a probability distribution, but as a threat.

  To my fellow physical scientists: I ask you to listen to why the decision theorists in this room take this seriously. It is not because they believe you are bad at math. It is because they believe that *ambiguity is information.*

  When you look at Urn Two, you see a missing variable. You say, "Apply the Principle of Insufficient Reason. Assume a uniform prior. It is effectively fifty-fifty." You treat the ambiguity as a temporary ignorance that a better model would resolve.

  But the decision theorist sees Urn Two and asks: *Who filled the urn?* If Nature is the dealer, a prior might suffice. But if the urn represents a climate system, a financial market, or a geopolitical adversary, the mechanism generating the outcomes may change *because* you are betting. The theorists argue that aversion to ambiguity is not a cognitive bias to be corrected by better Bayesian updating. It is a rational defense against a world where the rules themselves might be unstable. They are protecting us from the arrogance of assuming we know the shape of the unknown.

  To my decision theorist colleagues: I ask you to listen to why the physicists in this room take *their* stance seriously. It is not because they are reductionists who love the comfort of a curve. It is because *action requires a measure.*

  When I stood before that vacuum vessel, I could not afford to treat the ambiguity as a distinct ontological category. I had to act. If I treat Urn Two as fundamentally different from Urn One, I paralyze the mechanism of choice. The physicist insists on assigning a probability, even a subjective one, because without a number, you cannot optimize resources. You cannot build a bridge. You cannot allocate a budget.

  The physicists argue that to refuse to assign a probability is to refuse to engage with the world. They believe that by forcing ambiguity into the language of risk, we make it manageable. They are protecting us from the paralysis of infinite caution.

  So, we have a stalemate. One side says, "To quantify the unquantifiable is a lie." The other says, "To refuse to quantify the unquantifiable is a dereliction of duty."

  This workshop is not designed to break that stalemate. I suspect the two keynotes will leave us exactly where we stand, only with sharper definitions. But I hope we can achieve something more useful than agreement.

  We often say we want "interdisciplinary goodwill." That is too soft. Goodwill is a sentiment; we need a structure.

  The truth is, deep uncertainty is the only place where ethics enters the equation. When probabilities are known, decision-making is calculation. When probabilities are unknown, decision-making is *judgment.*

  The physicists bring the discipline of calculation. They remind us that we must strive to reduce ambiguity wherever possible, to measure, to model, to turn Urn Two into Urn One through hard work. That is the scientific imperative.

  The decision theorists bring the discipline of judgment. They remind us that there are residues that calculation cannot touch, and that pretending otherwise is dangerous. That is the ethical imperative.

  If we leave here with nothing else, let us leave with this: The friction between your two views is not a bug in the system. It is a feature. It is the tension that keeps us honest.

  When the physicist says, "I have a probability," the decision theorist must be there to ask, "What assumptions are hidden in that prior?" And when the decision theorist says, "This is unknowable," the physicist must be there to ask, "What can we measure to make it less so?"

  We are not here to reconcile the urns. We are here to decide which urn we are willing to reach into when the lights go out, and to ensure that when we do, we understand exactly what we are risking.

  The vacuum vessel held. But I learned that the safety margin wasn't in the steel. It was in the humility of the team that built it. Let this workshop be that team.

  Thank you.
