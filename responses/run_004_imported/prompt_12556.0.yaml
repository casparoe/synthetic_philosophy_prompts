answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name], and I have the privilege of being in a reading group with [Partner A].

  For the last decade, I have watched [Partner A] and [Partner B] live out a very specific, very demanding idea. If you've spent Thanksgiving with them, you know the one. It's Peter Singer's argument about the drowning child. The idea is simple but brutal: If you saw a child drowning in a shallow pond, you'd ruin your shoes to save them. So, if you can save a life far away by sacrificing something of lesser value, you ought to do it. Distance doesn't matter. Proximity is a moral illusion.

  They have argued this with relatives, with skeptics, and occasionally with me. They believe that every stranger has a claim on them equal to the person standing at their feet. It is a rigorous, beautiful, and exhausting way to move through the world.

  And then, there is today.

  Because if you listen to the vows they are about to make, they sound like a betrayal of that entire philosophy. A wedding vow is essentially a contract of bias. It is a public promise to say: "Out of all the suffering people in the world, I am choosing to prioritize *this* one. I am putting their happiness, their security, and their needs above the stranger in the shallow pond."

  For the philosophers in the room, this is the tension between the ethics of the pond and the ethics of the vow. For everyone else: it's the question of whether you can love one person deeply without turning your back on the world.

  I know [Partner A] and [Partner B] have thought about this. They don't do anything without thinking about it. And I think the resolution lies in something the philosopher Bernard Williams once said. He argued that if a man saves his drowning wife, and justifies it by saying, "I calculated that saving my wife produces the best overall outcome," he has had "one thought too many."

  Sometimes, the right action doesn't come from a calculation. It comes from who you are. It comes from integrity.

  [Partner A] and [Partner B], you are not getting married to retreat from the world. You are getting married to build a headquarters.

  The demandingness objection to Singer's argument is that it asks human beings to be engines of benevolence without fuel. It ignores that we are fragile. We burn out. We get tired. The world is full of drowning children, and you cannot save them all if you are drowning yourself.

  This marriage is not a rejection of the pond. It is an agreement to be the life vest for one another. It is a recognition that to do the most good over a lifetime, you need a place where you are not required to calculate. You need a home where you are allowed to be partial, so that you can return to being impartial when you walk out the door.

  In effective altruism terms, we might call this a force multiplier. Two people, anchored by a commitment to each other, are more resilient, more creative, and more enduring than two isolated atoms drifting in the current. By promising to care for each other above all others, you are actually optimizing your capacity to care for others at all.

  So, to the guests who worry this marriage makes them less generous: don't. Look at them. They aren't building a fortress; they're building a base camp.

  And to [Partner A] and [Partner B]: May you always have the courage to save the stranger in the pond. But may you also have the wisdom to know that when you come out of the water, shivering and cold, there is one person who is obligated by love, not by math, to hand you the towel.

  Please raise your glasses. To the pond, to the vow, and to a lifetime of doing the most good, together.
