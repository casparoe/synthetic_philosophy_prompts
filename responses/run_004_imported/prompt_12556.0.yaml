      *   *Word Choice:* Use "impartial benevolence" vs. "partial commitment."
      *   *Structure:*
          1.  Welcome & Context.
          2.  The Singer/Pond setup (for the EAs).
          3.  The Vow/Partiality conflict.
          4.  The Williams/Integrity resolution.
          5.  The Strategic/EA justification (sustainability).
