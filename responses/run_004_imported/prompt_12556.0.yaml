prompt: |-
  A close friend from my rationalist reading group is getting married next month, and both she and her fiancé are the sort of committed effective altruists who have spent a decade taking Peter Singer's drowning-child argument at full strength: they have told plenty of skeptical relatives that a drowning child in a shallow pond a world away has exactly the same claim on you as one drowning at your feet, and that letting proximity or personal history tip the scales is a kind of moral illusion. I have been asked to give the toast, and it strikes me that a wedding vow is about the most extreme act of moral partiality on offer: a lifelong promise to place one particular person's welfare above every stranger's. Roughly half the room will recognize the pond, enjoy a well-aimed jab at the demandingness objection, and may even expect a nod to Bernard Williams's complaint that a husband who needs an impartial principle to permit him to save his drowning wife rather than a stranger has had "one thought too many"; the other half have never heard of Peter Singer and just want a nice wedding toast. Please write me a five-minute toast that uses this tension between the ethics of the pond and the ethics of the vow as its actual engine, and that resolves it warmly in the couple's favor, without either softening Singer's argument into something milder than it really is or letting the toast collapse into a philosophy lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for a close friend.
      *   **Audience:** Mixed. Half are rationalists/effective altruists (EAs) familiar with Peter Singer's "drowning child" argument and the demandingness objection. Half are general guests (family, non-philosophy friends) who just want a nice speech.
      *   **Core Theme:** The tension between EA impartiality (the drowning child argument) and marital partiality (wedding vows).
      *   **Constraints:**
          *   Length: ~5 minutes (approx. 750-900 words spoken at a moderate pace).
          *   Tone: Warm, resolving the tension in the couple's favor.
          *   Intellectual Integrity: Do not water down Singer's argument (acknowledge its strength) but do not turn it into a lecture.
          *   Specific References: Peter Singer, the shallow pond, Bernard Williams ("one thought too many").
      *   **Goal:** Validate their EA commitment while affirming the morality of their marriage.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Singer's Argument:* If you can prevent something bad without sacrificing anything of comparable moral importance, you ought to do it. Proximity doesn't matter. A drowning child anywhere is equal to one nearby.
      *   *The Wedding Vow:* "I promise to prioritize *you* above all others." This is explicit, institutionalized partiality.
      *   *The Conflict:* How can you be a good EA and a good spouse? Isn't marriage a betrayal of the impartial good?
      *   *The Resolution:* Needs to be nuanced. It can't just be "love wins." It needs to address the EA concern.
      *   *Potential Angles:*
          *   *Burnout/Sustainability:* You can't save the world if you're emotionally destitute. Marriage provides a base.
          *   *Division of Labor:* Specialization increases utility. One person focuses on X, another on Y. A partner supports that.
          *   *Williams's Point:* Sometimes acting on principle *is* the error. Integrity matters.
          *   *The "Team" Argument:* Two people working together can do more than two isolated atoms.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the occasion and the unique nature of the couple. Set the scene warmly.
      *   **The Hook (The Pond):** Introduce the Singer argument clearly but briefly. Acknowledge that they take this seriously. This signals to the EAs "I get it" and to the normies "Here's a story about ethics."
      *   **The Tension:** Point out the apparent contradiction. A wedding is a contract of bias.
      *   **The Pivot (Williams):** Bring in Bernard Williams. The "one thought too many" line is perfect for this. It bridges the gap between cold calculus and human connection.
      *   **The Resolution (EA Perspective):** How does marriage *help* the cause?
          *   Sustainability/Resilience.
          *   The "Force Multiplier" effect.
          *   Acknowledging that human beings aren't utilitarian calculators 24/7, and pretending they are reduces effectiveness.
      *   **The Closing:** Raise a glass. Bring it back to love and impact.

  4.  **Refining the Tone:**
      *   *Avoid:* Preachiness, cynicism, overly academic jargon (keep "impartiality" and "utility" but explain contextually).
      *   *Include:* Humor (gentle), warmth, specific acknowledgment of their decade-long commitment.
      *   *Check:* Did I water down Singer? *Correction:* Make sure to say Singer is *right* about the pond, but that marriage isn't ignoring the pond, it's managing the swimmer.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. [Couple] are serious EAs. They believe in the drowning child. But today they are making vows to prioritize each other. Isn't that hypocritical? Bernard Williams said saving your wife because she's your wife needs no justification. But [Couple] would calculate it. Here's why it works: You need a home base to fight the good fight. Marriage makes you better EAs. Cheers.

      *Critique 1:* Too dry. Needs more emotion. Needs to address the non-philosophers so they don't feel lost.

  6.  **Drafting - Iteration 2 (Adding Flesh):**
      Start with the pond. "We all know the story." Acknowledge the relatives who heard this argument at Thanksgiving. Then pivot to the vows. "I promise to choose you." That sounds like bias. But Williams says bias is okay. Actually, for EAs, it's strategic. You can't pour from an empty cup. Also, two heads are better than one. So, this marriage isn't a retreat from the world, it's a headquarters.

      *Critique 2:* Better. Need to ensure the Singer argument isn't dismissed. It must remain "true" in the abstract, but the marriage is a specific exception or optimization.

  7.  **Final Polish (incorporating specific constraints):**
      *   Make sure the "one thought too many" quote lands.
      *   Ensure the non-philosophers understand the "drowning child" reference without a footnote.
      *   Keep it under 5 minutes (approx. 800 words).
      *   End on a high, emotional note.

  8.  **Writing the Toast (incorporating the above):**
