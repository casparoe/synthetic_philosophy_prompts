answer: |-
  Welcome to the rabbit hole. It is a deep one, and your intuition is spot-on: this is one of the most famous friction points between Bayesian decision theory and Frequentist hypothesis testing.

  As an experimental biologist, you were trained in the Frequentist tradition (Neyman-Pearson), where the goal is to control long-run error rates (Type I/II errors). Good's Theorem comes from the Bayesian/Decision Theory tradition, where the goal is to maximize expected utility based on degrees of belief.

  The short answer is: **There is no logical tension between the two, provided you keep the frameworks separate.** The conflict arises only if you try to apply Bayesian logic to a Frequentist procedure (or vice versa) without adjusting the rules.

  Here is the breakdown of why they seem to clash, why they don't, and what it means for your understanding of science.

  ### 1. What Good's Theorem Actually Says
  I.J. Good's 1967 theorem is a result in decision theory. It states that for a rational agent (a Bayesian), the **expected utility** of making a decision *after* observing free evidence is always greater than or equal to the expected utility of making the decision *before* observing it.

  Key nuances often missed:
  *   **"In Expectation":** It doesn't mean every specific piece of data will help. You might run an experiment and get ambiguous noise. But *before* you run it, you cannot predict that the noise will hurt you. You expect, on average, to be closer to the truth or better able to act.
  *   **"Free" Information:** The theorem assumes the cost of gathering the information is zero. If the experiment costs money or time, that cost must be subtracted from the expected utility.
  *   **"Rational Bayesian":** It assumes you update your beliefs via Bayes' Rule and then act optimally on those new beliefs.

  ### 2. What "Optional Stopping" Warns Against
  In the Frequentist framework (what you used for decades), a p-value is calculated based on the **sampling distribution**. The sampling distribution depends on the **stopping rule**.

  *   **Fixed Sample Size:** "I will measure 100 mice, then calculate $p$." The math knows you looked once.
  *   **Optional Stopping:** "I will measure mice until $p < 0.05$." The math knows you looked many times.

  If you use the formula for a Fixed Sample Size test on data generated by an Optional Stopping rule, you violate the assumptions of the test. The "false positive rate" inflates because you have given yourself multiple chances to find a random fluctuation that looks significant.

  ### 3. The Resolution: Why They Don't Clash
  The tension dissolves when you realize they are answering different questions using different definitions of "evidence."

  #### A. The Likelihood Principle
  This is the philosophical heavyweight champion here. The Likelihood Principle states that all the evidence in the data relevant to a hypothesis is contained in the likelihood function.
  *   **Bayesians** generally accept the Likelihood Principle. To a Bayesian, the fact that you *stopped* collecting data doesn't change the probability that the hypothesis is true given the data you have. If the data looks like a signal, it's a signal, regardless of whether you planned to stop there or keep going.
  *   **Frequentists** reject the Likelihood Principle. To a Frequentist, the "evidence" includes the procedure used to generate the data. Two identical datasets can have different p-values if one came from a fixed design and the other from optional stopping.

  **So, Good's Theorem says:** "If you update your beliefs correctly (Bayes), looking at more data never hurts your decision-making expectation."
  **Optional Stopping says:** "If you use a p-value calculator that assumes a fixed sample size on data where you peeked, your error rate guarantees are broken."

  **The Conflict is Illusory:** Good's Theorem assumes you are updating beliefs. Optional Stopping warnings assume you are calculating error rates of a procedure. If you peek at data and update your Bayesian posterior, Good is right. If you peek at data and calculate a standard p-value without correction, the Frequentist warning is right.

  #### B. The Definition of "Worse Off"
  *   **Good:** "Worse off" means making a decision with lower expected utility based on your current beliefs.
  *   **Frequentist:** "Worse off" means publishing a false positive and polluting the literature, violating the $\alpha = 0.05$ contract.

  If you are a Bayesian, you don't care about the long-run false positive rate of your *method*; you care about the probability that *this specific hypothesis* is true. If you are a Frequentist, you don't claim to know the probability the hypothesis is true; you claim to know the error rate of your *method*.

  ### 4. Important Implications for You
  Since you are now looking at this philosophically, here are the three big takeaways:

  **1. "P-hacking" is a Frequentist Sin, not necessarily a Bayesian one.**
  If you collect data, check a Bayes Factor, and stop when the evidence is strong, you are not violating Bayesian coherence (provided your prior was honest). You *are* violating Frequentist error control. The "sin" of optional stopping is specifically about misleading people regarding the long-run performance of a test, not necessarily about misleading them regarding the specific evidence in hand (though bad priors can do that).

  **2. Information is rarely "Free."**
  Good's Theorem hinges on information being free. In biology, information is never free. It costs reagents, time, and animal lives. Furthermore, there is an "opportunity cost" of delay. A rational agent stops collecting data when the **marginal cost** of the next data point exceeds the **expected marginal gain** in utility. This aligns perfectly with standard experimental design: power analysis is essentially balancing the cost of sampling against the risk of error.

  **3. The Danger of "Bayesian P-hacking."**
  While Bayesians are theoretically immune to optional stopping *regarding the posterior*, they are not immune to **selection effects**. If you run 20 different Bayesian analyses on different subsets of your data and only report the one with the highest Bayes Factor, you are still misleading your audience. Good's Theorem applies to *one* decision process, not to a researcher shopping for results.

  ### Summary
  You aren't missing something; you are witnessing a paradigm clash.

  *   **Good's Theorem** tells you that **belief updating** benefits from more data.
  *   **Optional Stopping** tells you that **error-rate guarantees** break if you change the rules mid-stream.

  As a retired biologist, you can rest easy: your training to avoid peeking at p-values was correct for the Frequentist framework you were using. But philosophically, Good is also correct that a rational agent should never fear *truthful* information. The friction comes from trying to use Frequentist tools (p-values) to measure Bayesian concepts (belief), or expecting Bayesian tools to provide Frequentist guarantees (error rates).

  If you continue down the philosophy rabbit hole, look up the **Likelihood Principle** and the debate between **Birge (Frequentist)** and **Jeffreys (Bayesian)**. It's the historical root of the exact confusion you've just identified. Enjoy the retirement!
