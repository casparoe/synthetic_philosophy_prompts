          *   **KK Requirement?** Some formulations use KK to strengthen the claim (I know *that I know*, therefore I can dismiss evidence), but the core paradox usually hinges on *closure* and the *factivity of knowledge*, not necessarily KK. In fact, many discussions of Harman's paradox explicitly distinguish it from KK. Harman's point is often about *defeasibility* of knowledge. If knowledge is indefeasible, then once you know, no evidence can defeat it.
