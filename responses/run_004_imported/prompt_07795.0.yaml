answer: |-
  The fluorescent light above the bed hummed, a low-frequency vibration that seemed to rattle in the fillings of my teeth. Outside, the city was waking up, but in Room 304, time was measured only in the rhythmic rise and fall of my mother's chest and the intermittent beep of the cardiac monitor. Six weeks. Forty-two days since the heart stopped, since the blood stopped flowing, since the world went dark.

  Now, the neurologists used terms like *minimally conscious state*. It sounded precise, clinical, but it felt like a veil. She tracked faces sometimes. If I held up a red comb and moved it slowly, her eyes would catch it, dragging across the room like magnets. Yesterday, when I asked her to squeeze my hand, her fingers had curled around mine. A command followed by compliance. Or was it?

  I held her hand now, resting on the sterile white sheet. Her skin was cool, paper-thin. I watched her face, looking for the ghost in the machine.

  The door opened, and a nurse came in to turn her. It was a necessary violence. She had to be moved to prevent bedsores, to clear her lungs. As the nurse rolled her shoulders, adjusting the tubing snaking into her arm, my mother's heart rate spiked. The monitor chirped faster, a digital anxiety. Her brow furrowed, a deep crease appearing between her eyes, and her breath hitched in a jagged sob.

  "Sorry, love," the nurse murmured, efficient and gentle. "Just getting you comfortable."

  I watched the grimace fade as the settling ended. The heart rate slowed. But the image of that pain—the furrowed brow, the spike in vitals—lodged in my throat.

  Later, alone again, I opened my laptop. The glow illuminated the dust motes dancing in the air. I went back to the papers. *Higher-Order Thought theories.* David Rosenthal. I had been drowning in these texts for weeks, seeking shelter in philosophy because the medicine offered none.

  The medical scan last week showed activity in the anterior cingulate cortex. The doctor had pointed to the bright spots on the MRI. "Pain matrix activation," he'd said. "We treat based on this."

  But Rosenthal's voice echoed in my head, cold and logical. A state isn't consciously felt merely because the sensory circuitry is active. Nociception is not suffering. For my mother to *feel* the pain, there had to be a further, numerically distinct state representing herself as being in pain. A thought about the feeling. A higher-order monitor.

  I looked at her sleeping face. The scan proved the first-order state existed. The wiring was firing. But the diffuse cortical injury—the very thing that kept her from waking—was exactly the kind of damage liable to disrupt the monitoring capacity. The scanner showed the fire, but it couldn't tell me if anyone was home to feel the heat.

  "Mom?" I whispered.

  Her eyes opened. They were cloudy, unfocused, then drifted toward me. Tracking.

  "If you hurt," I said, my voice cracking, "I need to know."

  She blinked. Slow. Deliberate.

  I closed my eyes and tried to run the simulation. If the higher-order mechanism was intact, she was suffering right now, perhaps terrified, trapped in a body that wouldn't obey. But if the mechanism was severed, she was a biological robot. Inputs came in, motors reacted, but the lights were off. There was no one there to suffer. That was the hope I clung to: that the pain was merely mechanical, a signal running down a wire to a disconnected switch.

  But the theory offered another trap. I turned the page of the digital article. *Loose coupling.*

  The monitoring state and the state it monitors are only loosely coupled. They can misfire.

  I stared at her hand in mine. What if the monitor was broken in the other direction? What if it registered distress where there was none? A false positive. She could be lying there in perfect physiological peace, her body calm, while her damaged mind screamed that she was burning. Or worse, what if the monitor was generating the feeling of pain without any sensory input at all? A phantom agony created by a glitching system.

  Neither a positive nor a negative scan would settle this. The MRI showed the hardware, not the software's error logs.

  I leaned forward, resting my forehead against the mattress near her shoulder. "Are you thinking about thinking?" I asked softly. It was a absurd question. No one asks that. But it was the only question that mattered.

  Her fingers twitched. Not a squeeze. Just a spasm.

  I wanted to scream at the neurologists. I wanted them to tell me that the furrowed brow meant sadness, or that the heart rate spike meant fear. But they spoke in probabilities. *Likely.* *Consistent with.* *Suggestive of.*

  Philosophy promised clarity but delivered only a deeper abyss. If consciousness is a higher-order representation, then I am locked out. I can never see her higher-order states. I can only see the first-order effects—the grimace, the tear, the squeeze. I am inferring the existence of a ghost based on the movement of the machine.

  And the machine is broken.

  A shadow passed over her face. Was it a cloud of confusion? Or just a shift in the lighting from the hallway? Her breathing changed, becoming shallower.

  I thought about the loose coupling again. It meant that even if I could see into her mind, even if I could witness the higher-order thought, it might not match the reality of her body. She might think she is screaming when she is silent. She might think she is untouched when she is being turned. The connection between the world and the witness was frayed.

  "Mom," I said. "Squeeze my hand if you know who I are."

  I waited. The monitor beeped. *Beep. Beep. Beep.*

  Her hand remained still. Then, slowly, the fingers curled. Just barely. Enough to catch the skin of my thumb.

  A surge of hope washed over me, hot and immediate. She knows. She is there.

  Then the cold water followed. Was that a higher-order thought? *I am squeezing his hand.* Or was it a reflex arc? A stimulus-response loop bypassing the conscious monitor entirely? Rosenthal would say that without the thought *about* the squeezing, she didn't consciously will it. She was a puppet whose strings were being pulled by my voice.

  But if she was a puppet, why did it feel like a goodbye?

  I sat back in the chair. The sun was higher now, casting a sharp rectangle of light across the floor. The dust motes still danced. The uncertainty was a physical weight in the room, heavier than the ventilator, heavier than the bed.

  I couldn't turn off the machines. I couldn't wake her up. I couldn't even know if she wanted me to.

  If I assumed she was conscious, I had to assume she might be suffering, and every moment of her existence was a moral emergency. If I assumed she wasn't, I risked abandoning her to a solitude I couldn't comprehend. And if I assumed the monitor was misfiring, I was chasing a phantom pain that might not exist, or ignoring a real one that was hidden behind a broken lens.

  I reached out and smoothed her hair. It was dry, brittle.

  "I'm here," I said.

  Her eyes drifted closed. The heart rate slowed to a resting rhythm. The face smoothed out, erasing the earlier grimace.

  Was she sleeping? Was she gone? Was she waiting?

  I picked up the book on the bedside table, but I didn't open it. I just held it, watching the rise and fall of her chest. There was no answer in the room. There was only the hum of the light, the beep of the monitor, and the terrible, unbridgeable silence between her brain and mine. I watched her, waiting for a sign that meant something, knowing that even if it came, I would never know what it said.
