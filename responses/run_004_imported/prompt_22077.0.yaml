      *   *Critique of Julian:* If "better than" is vague, what about "equal to"? If it's indeterminate whether A > B and indeterminate whether B > A, does it follow A = B? Broome says yes, but then A+ should break the equality. Julian needs to say "equal to" is *also* vague. This gets messy. Nora's parity is cleaner structurally.
