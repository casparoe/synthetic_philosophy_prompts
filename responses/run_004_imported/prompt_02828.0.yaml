answer: |-
  You have stumbled onto one of the most famous and important paradoxes in financial economics. You aren't missing anything; you have correctly identified the tension between the **No-Trade Theorem** (Milgrom & Stokey, 1982) and the **Grossman-Stiglitz Paradox** (1980).

  The short answer is: **The No-Trade Theorem is mathematically correct but empirically false because its assumptions are too strong for the real world.**

  If the No-Trade Theorem held perfectly in reality, prediction markets (and stock markets) would not exist, or they would be completely frozen. The fact that they work tells us exactly which assumptions are breaking down.

  Here is the breakdown of why the theorem doesn't kill your bot, where the information comes from, and what you need to watch out for.

  ### 1. The Logic of the No-Trade Theorem
  Your understanding is correct. If two agents share a **common prior**, are **risk-neutral** (or have known risk preferences), and are **perfect Bayesians**, they cannot agree to a speculative bet.
  *   **The Logic:** If Alice offers to sell you a share at 60¢, you ask, "Why?" You realize Alice only sells if she thinks the probability is <60%. Her willingness to trade reveals her private signal. You update your belief downward. If you update enough, you no longer want to buy. If you still want to buy, Alice realizes *you* must have a strong signal, so she updates upward and no longer wants to sell.
  *   **The Result:** Trade unravels due to **adverse selection**.

  ### 2. Why Prediction Markets Work (The Assumptions That Break)
  For information to get into the price, someone must be willing to trade against informed agents. For informed agents to trade, they must expect a profit. For them to expect a profit, someone else must expect to lose (or trade for non-profit reasons).

  Here are the specific "escape hatches" that allow markets like Polymarket and Manifold to function:

  #### A. Noise Traders and Liquidity Traders (The Big One)
  The No-Trade Theorem assumes all traders are **informed speculators**. In reality, markets are full of:
  *   **Noise Traders:** People trading on hunches, vibes, or misinformation.
  *   **Liquidity Traders:** People who need to hedge an external risk (e.g., a farmer hedging crop prices, or a crypto holder hedging portfolio risk).
  *   **Entertainment Traders:** Especially on Manifold (play money) or Polymarket (small stakes), people derive utility from the *act* of betting, not just the P&L.

  **Why this matters:** An informed trader can profit off a noise trader without the noise trader realizing they are being exploited. The informed trader doesn't need to worry that the noise trader has a "better signal," because the noise trader doesn't have a signal at all. This provides the **profit incentive** necessary to gather information in the first place.

  #### B. Different Priors
  The theorem requires a **Common Prior**. It assumes that before receiving private info, Alice and Bob view the world exactly the same way.
  *   **Reality:** People have different mental models. You might think "Trump wins if the economy is bad," and I might think "Trump wins if the economy is good." We can look at the same data and update differently.
  *   **The Bet:** We aren't betting on who has better *data*; we are betting on whose *model* is right. This is often called "agreeing to disagree," which Aumann's theorem says is impossible, but only if priors are common.

  #### C. Common Knowledge of Rationality
  The theorem assumes it is **common knowledge** that both parties are rational Bayesians.
  *   **Reality:** In an order book (like Polymarket), you don't know who you are trading against. You see an order, but you don't know if it's a sophisticated bot, a whale hedging, or a retail user betting on a meme.
  *   **The Break:** Because you don't know the *type* of the counterparty, you can't fully infer their private signal just from their willingness to trade. You assign a probability that they are a "noise trader." This stops the infinite recursion of "I know that you know that I know..."

  #### D. Costly Information (Grossman-Stiglitz)
  This is the direct answer to your question: *"Where does the info in the price even come from?"*
  *   Grossman and Stiglitz argued that if prices were perfectly informative, no one would bother paying to gather information (since they couldn't profit from it). But if no one gathers info, prices aren't informative.
  *   **Resolution:** Markets must be **inefficient enough** to compensate traders for the cost of acquiring information. The "noise" in the market (from noise traders) creates a spread wide enough for informed traders to make a profit.

  ### 3. Implications for Your Bot
  Since you are building a bot for Manifold/Polymarket, you are operating in an environment where the No-Trade Theorem assumptions are heavily violated. That's good for you, but it creates specific risks.

  **1. The "Winner's Curse" is still real.**
  Even if the theorem doesn't hold perfectly, adverse selection is the #1 killer of market-making bots.
  *   **Scenario:** You post a bid at 50¢. Someone instantly hits it.
  *   **Inference:** Why did they hit it? Probably because they know something you don't.
  *   **Bot Strategy:** Your bot needs to adjust its quotes based on flow. If you get hit repeatedly on one side, assume the market knows something and shift your price *before* the public news drops.

  **2. Identify the "Noise".**
  Your edge comes from distinguishing between informed flow and noise flow.
  *   **Manifold:** High noise. People bet for fun, for community status, or to troll. There is a lot of "dumb money."
  *   **Polymarket:** Lower noise, higher stakes. More likely to encounter informed hedgers or insiders.
  *   **Bot Strategy:** On Manifold, you can be more aggressive mean-reverting. On Polymarket, you need tighter risk controls against informed flow.

  **3. Priors Matter.**
  Don't assume the market prior is "correct."
  *   Many prediction markets suffer from **favorite-longshot bias** (people overbet longshots).
  *   Your bot can exploit this by having a different prior model than the aggregate market (e.g., assuming the market overweights recent news).

  ### Summary
  The No-Trade Theorem isn't "wrong," it's just a **baseline for perfect efficiency**. It describes a world where information is free and everyone is a perfect logic machine.

  *   **The Contradiction:** Resolved by the existence of **noise traders** and **different priors**.
  *   **The Info Source:** Prices become informative because informed traders exploit noise traders. The profit from noise traders subsidizes the cost of information gathering.
  *   **Your Bot:** Exists in the gap between the theorem and reality. Your job is to be the "informed trader" relative to the noise, while avoiding being the "sucker" relative to better-informed traders.

  If you want to read more on this specific tension, look up the **Grossman-Stiglitz Paradox** (1980). It is literally the paper written to answer the exact question you just asked.
