      *   *Conclusion-based (Verdict voting):* Prioritizes the democratic will of the group regarding the outcome. Respects individual judgment on the final stakes. Risks inconsistent reasoning (e.g., finding someone liable without agreeing on *why*).
      *   Legal context: Courts often lean premise-based (judges write opinions justifying facts). Juries often lean conclusion-based (general verdicts).
