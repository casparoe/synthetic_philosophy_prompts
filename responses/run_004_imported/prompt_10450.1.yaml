      *   **Point 3: The Disjunction Problem.** If the brain can't distinguish real vats from simulated vats, the concept is disjunctive. The thought becomes "I am in a real-or-simulated vat," which doesn't validate the skeptical hypothesis (which posits a *real* vat).
