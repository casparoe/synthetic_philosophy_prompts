      *   *Argument 2: The Division of Linguistic Labor.* Do I really have a direct causal hook to "vat"? Or do I rely on the community? If the community is also simulated (or if I'm isolated), does the link break?
      *   *Argument 3: Functional Role/Use Theory.* Meaning isn't just history; it's current use. If my use of "vat" is now governed by simulation rules, the reference shifts.
      *   *Argument 4: The Disjunction Problem.* Does "vat" refer to (Real Vats OR Simulated Vat-Images)? If the disjunction includes the simulation, the thought "I am in a real vat" might be false or indeterminate.
