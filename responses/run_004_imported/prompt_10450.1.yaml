prompt: |-
  So Putnam's brain-in-a-vat argument says a lifelong BIV can't even formulate the thought 'I am a brain in a vat,' because its word 'vat' just refers to whatever's upstream in the simulation, not real vats — so the sentence undermines itself. People usually say this only works on brains vatted from birth: if you lived a normal 30 years and got vatted yesterday, your words are already causally hooked up to real trees and real vats, so you can coherently (and maybe truly) think 'I'm a BIV now.' I want you to argue against that escape hatch though - make the case that even a recently-envatted brain can't use it's own semantics to coherently entertain the skeptical hypothesis about itself. Don't just summarize the standard back-and-forth, actually push the argument, using whatever machinery from causal/use theories of reference you need.
