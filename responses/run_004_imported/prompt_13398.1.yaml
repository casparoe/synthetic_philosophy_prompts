answer: |-
  First, take a deep breath. You are not failing at this; you are experiencing a classic instance of **paradigm incommensurability**. You are essentially trying to write a document in two mutually unintelligible dialects of "Linguist" while being graded by native speakers of each.

  To answer your core question directly: **No, there is no rational way to adjudicate between these frameworks within the scope of a dissertation.** This is not a problem you can solve with better logic or smarter phrasing. This is a Kuhnian paradigm clash. Generative grammar and Usage-Based Linguistics (UBL) make different ontological claims about what language *is*.

  However, **you are not stuck faking diplomacy.** There is a third path: **Explicit Methodological Agnosticism.**

  Here is a strategic roadmap for surviving this lit review without losing your mind or your committee.

  ### 1. Abandon the Quest for "Neutral" Language
  There is no theory-neutral language in linguistics. As you've discovered, even "grammar" and "generate" are loaded.
  *   **Ray hears:** "Grammar generates" $\rightarrow$ "There is a computational system deriving structures."
  *   **Ana hears:** "Grammar generates" $\rightarrow$ "You are ignoring cognitive reality and usage patterns."
  *   **Ray hears:** "Construction" $\rightarrow$ "You are memorizing redundancy instead of projecting from rules."
  *   **Ana hears:** "Construction" $\rightarrow$ "Form-meaning pairings are the basic unit."

  **The Fix:** Stop trying to find magic words that mean nothing to both of them. Instead, **define your terms operationally in a preamble.**
  Write a subsection in Chapter 1 or the intro to the Lit Review titled *"Terminological Conventions."* Explicitly state:
  > "In this dissertation, the term 'construction' is used descriptively to refer to [X pattern], without commitment to the ontological status of constructions as proposed in Construction Grammar. Similarly, 'generate' is used in the loose sense of 'predicts the occurrence of,' not necessarily implying a derivational engine."

  This signals to Ray that you aren't going full Construction Grammar, and to Ana that you aren't ignoring the form-meaning pairing. It frames the terminology as *tools for your analysis*, not declarations of faith.

  ### 2. Shift from "Adjudication" to "Mapping"
  Your lit review does not need to decide who is right. It needs to show that **you know where the bodies are buried.**
  Instead of writing paragraphs that try to synthesize the two (which leads to the contradictions you're facing), structure the review by **phenomenon**, and then explicitly contrast the theoretical treatments.

  *   **Bad (Synthesis attempt):** "Researchers have studied how children acquire passives, looking at both input frequency and innate constraints." (Ray thinks this is mush; Ana thinks this is a lie).
  *   **Good (Mapping):** "Approaches to passive acquisition diverge on the locus of explanation. Generative accounts (e.g., X, Y) posit that the abstraction of the passive category is constrained by... Conversely, Usage-Based accounts (e.g., A, B) argue that the category emerges from..."

  This allows you to be "neutral" by being **descriptive about the theories** rather than **prescriptive about the data.** You are reporting on the state of the field, not solving the field's biggest debate.

  ### 3. The "Scope Limitation" Clause
  This is your most important shield. You need a paragraph that explicitly limits the scope of your dissertation's theoretical ambitions.
  > "While the debate between nativist and emergentist accounts of grammatical categories is central to the field, this dissertation does not aim to resolve this ontological question. Rather, it takes [Phenomenon Z] as its empirical core and evaluates how well existing models account for the specific patterns observed in [Your Data]."

  This gives Ray permission to ignore the UBG stuff (it's just "background") and gives Ana permission to ignore the Generative stuff (it's just "formalism"). It makes your dissertation about **the data**, which is the only thing they might actually agree on.

  ### 4. Committee Management (The Political Game)
  You cannot manage this via email drafts alone. You need to manage their expectations verbally.

  *   **Talk to Ray:** "Ray, I know Ana looks for frequency effects. I want to make sure my lit review acknowledges that work so she doesn't block me, without committing to it as my primary framework. Is it okay if I frame her preferred literature as 'descriptive generalizations' that my formal account needs to cover?" (This feeds his view that UBG is descriptive/pre-theoretical while getting his buy-in to cite them).
  *   **Talk to Ana:** "Ana, I know Ray requires a formal backbone. I need to cite the generative literature to satisfy the committee structure, but I want to ensure I'm not presenting their assumptions as facts. Can I frame their models as 'hypotheses about competence' that we can test against usage data?" (This feeds her view that Gen is just a hypothesis while getting her buy-in to cite them).

  You are essentially asking each of them for permission to appease the other. Most advisors, even old-school ones, understand the politics of the committee and will cut you slack if you ask explicitly.

  ### 5. Is it "Faking Diplomacy"?
  You asked if you're just faking it until you graduate.
  *   **Cynical view:** Yes.
  *   **Professional view:** No. You are practicing **scholarly precision.**

  A mature scholar knows that frameworks are lenses, not truths. By refusing to pick a side, you are actually demonstrating a higher level of theoretical sophistication than blindly adhering to one dogma. You are acknowledging that the field is unresolved.

  **The Rational Adjudication:**
  If you *must* adjudicate, do it on **empirical coverage**, not theoretical elegance.
  *   "Generative models predict X, but fail to account for Y frequency effect."
  *   "Usage-Based models account for Y, but struggle to explain Z rapid generalization."
  *   "My data shows both Y and Z. Therefore, a complete account must integrate insights from both, regardless of the ontological implications."

  This forces them to argue with your *data*, not your *bibliography*.

  ### Summary Checklist for Your Draft:
  1.  **Kill the "Neutral" Voice:** Use "According to Framework X..." constantly. Make the attribution heavy.
  2.  **Define Terms:** Put a "Note on Terminology" box or section in the intro.
  3.  **Limit Scope:** Explicitly state you are not solving the Nature vs. Nurture debate.
  4.  **Focus on Data:** Make the phenomenon you are studying the protagonist of the chapter, not the theories.
  5.  **Verbal Check-ins:** Get verbal permission from Ray and Ana to cite the "enemy" for the sake of completeness.

  You are not writing the final word on linguistic theory. You are writing a document that proves you are capable of entering the profession. The profession requires navigating exactly this kind of theoretical pluralism. If you can write a lit review that acknowledges this rift without falling into it, you're actually demonstrating you're ready to be a colleague, not just a student.

  Good luck. Keep your head down, focus on the data, and let them fight the war while you document the battlefield.
