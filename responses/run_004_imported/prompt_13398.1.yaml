  7.  **Key Insight:** The user asks if there is a "rational way to adjudicate." The honest answer is "No, not within the scope of a dissertation." The *real* task is writing a dissertation that satisfies the institutional requirements despite the theoretical rift. The lit review needs to show *awareness* of the rift, not *resolution* of it.

