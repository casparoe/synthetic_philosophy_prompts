  5.  **Drafting the Advice (Iterative Process):**

      *   *Validation:* Acknowledge that this is a known, difficult problem. It's not just the user's failure. There is no "neutral" language.
      *   *Reframing:* The lit review isn't about finding the Truth; it's about situating *your* work.
      *   *Tactical Moves:*
          1.  **Own the Terminology:** Don't try to find magic words. Define *your* usage explicitly. "In this dissertation, I use 'construction' to mean..."
          2.  **Focus on the Empirical Core:** What data are *you* analyzing? Make the data the star, not the theories.
          3.  **The "Two-Column" Approach:** Explicitly structure the review to show *how* each framework handles the phenomena. "Generative approaches treat X as... Usage-based approaches treat X as..." This validates both without endorsing one.
          4.  **Manage the Advisors:** This is crucial. Don't just send drafts. Talk to them. "Ray, Ana flagged this. How do you suggest I phrase this to acknowledge her point without adopting her ontology?" Play the mediator role *with their permission*.
