      *   *The "Tiling Agents" Problem:* If Agent A wants to create Agent B, and A wants to be *certain* that B will pursue A's goals, A needs to prove B is safe. But if B is as smart as A (or smarter), A runs into Gödelian limits proving B's consistency.
