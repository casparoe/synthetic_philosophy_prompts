answer: |-
  You have put your finger on something crucial, and your hesitation to use terms like "confirmation bias" is well-founded. Those terms describe errors in *processing* information, but your friend's shift is an error (or at least a divergence) in *selecting* the machinery of judgment itself.

  You are describing a clash of **epistemic frameworks**, not a disagreement over facts. When two people argue about radiocarbon dating, they are usually arguing within a shared framework that accepts chemistry as a valid arbiter of truth. When your friend accepts the chemistry but rejects the *institution* that administered the test, they have moved the goalposts from "what is true?" to "who is allowed to tell us what is true?"

  Here is a breakdown of what is likely going on, drawing on philosophy of science and social epistemology, followed by thoughts on whether progress is possible.

  ### 1. The Diagnosis: Hinge Propositions and Echo Chambers

  **Wittgenstein's "Hinges"**
  The philosopher Ludwig Wittgenstein, in *On Certainty*, addressed exactly this problem. He argued that all rational argument rests on "hinge propositions"—assumptions that are not themselves proven but upon which the door of inquiry swings. For you, "peer review generally filters out error" is a hinge. For your friend, "large institutions protect their own power structures" is a hinge.

  You cannot argue someone out of a hinge proposition using evidence, because they will simply reject the evidence based on the hinge. When you say, "But the stratigraphy shows...", he hears, "The institution says..." To him, your evidence is circular because it relies on the very authority he doubts. You are right that you also have unargued starting points. The difference is that your hinges are *communal and self-correcting* (science), while his are *individual and static* (intuition/suspicion). But you cannot prove that superiority from the inside of the argument.

  **The Software Engineer's Epistemology**
  Your friend's background is relevant. Software engineering often cultivates a specific epistemic virtue: **first-principles reasoning** and **distrust of legacy systems.** In code, if something doesn't work, it doesn't matter who wrote it; the logic is either sound or it isn't. "Permissionless" verification is the ideal.
  Archaeology, by contrast, is deeply interpretive, slow, and reliant on institutional authority (museums, universities). To a certain tech mindset, mainstream archaeology looks like "legacy code"—bloated, bureaucratic, and resistant to refactoring. His belief in a pre-Ice Age civilization isn't just a fantasy; it's a "refactor" of history that appeals to his intuition of how systems *should* work (transparent, visible in satellite imagery) versus how they *do* work (opaque, buried in academic papers).

  **Echo Chambers vs. Epistemic Bubbles**
  Philosopher C. Thi Nguyen makes a vital distinction here.
  *   **Epistemic Bubbles:** You haven't heard the other side. (Solution: Show them the evidence.)
  *   **Echo Chambers:** You have heard the other side, but you have been taught to actively distrust the sources. (Solution: Much harder.)
  Your friend is in an echo chamber. He knows the radiocarbon dates; he just believes the labs are compromised. This explains why "confirmation bias" feels wrong. Bias implies he's ignoring data. He's not; he's disqualifying the *source* of the data.

  ### 2. Is Progress Possible?

  If the disagreement is about the rules of the game rather than the score, you cannot win by playing harder. However, that doesn't mean the conversation is hopeless. It just means the goal shifts from **conversion** to **calibration**.

  **A. Don't Argue the Conclusion; Argue the Cost**
  Since you cannot prove his hinges are wrong without using your own hinges, focus on the *consequences* of his epistemology.
  *   *The "Universal Skepticism" Test:* If institutional consensus is insufficient evidence for archaeology, is it sufficient for medicine? Climate science? The safety of the bridge he drives over?
  *   *The Scale of Conspiracy:* To maintain his view, he must believe not just that archaeologists are wrong, but that geologists, physicists (who date the ice cores), and historians across dozens of countries and competing universities are all complicit. Ask him: "What would it take for you to believe the mainstream view? How many people would have to be *not* lying?" If the answer is "nothing would change my mind," he has admitted it is a belief, not a hypothesis.

  **B. Find a Shared Hinge**
  Is there *any* domain where he trusts institutional expertise? Likely, yes. He probably trusts that the microchip in his phone works, despite not knowing how to manufacture it. He trusts that the plane he flies in was certified by a regulatory body.
  Try to bridge from there. "We agree that we trust engineers on planes because they have a feedback loop—planes crash if they're wrong. Archaeology has a similar feedback loop, just slower. When they guess where to dig based on theory, they either find things or they don't."
  This doesn't prove him wrong, but it highlights that his skepticism is selective.

  **C. The "Intuition" Trap**
  He privileges his "intuitive sense of what looks too sophisticated." This is the weakest link. Intuition is pattern recognition based on past experience. He has experience in software, not in 10,000-year-old stone tools.
  You might ask: "What is the data set for your intuition? You know what modern engineering looks like. Do you know what 5,000 years of diverse human masonry looks like?" This challenges the *validity* of his chosen tool (intuition) without attacking the *institution*.

  ### 3. How to Write About It

  For your article, this situation is a gift, provided you avoid the trap of writing a "debunking" piece. The story isn't "Crazy Friend vs. Rational Science." The story is **"The Crisis of Epistemic Trust."**

  *   **The Hook:** Use your own confusion. The fact that you, a science writer, found standard rebuttals useless is the most honest entry point.
  *   **The Theme:** Explore why smart people are leaving shared epistemic frameworks. It's not about stupidity; it's about a loss of faith in the "priesthood" of expertise. Your friend is a symptom of a wider cultural moment where "doing your own research" (Google/YouTube) is valued over "trusting the consensus."
  *   **The Nuance:** Acknowledge that institutions *have* suppressed things in the past. Science is not infallible. Validating his *distrust* (in the abstract) while challenging his *specific conclusion* makes you a more credible narrator.
  *   **The Resolution:** You may not resolve the friendship's disagreement. But you can model what it looks like to disagree without dehumanizing. You can show that the gap between you isn't intelligence, but *where you place your trust*.

  ### Summary
  What is going on is a **foundational disagreement about authority.** Your friend has adopted a "sovereign individual" epistemology (I verify it myself) in a domain that requires "distributed trust" (we verify it together over generations).

  There is no principled way to *force* him to accept your hinges. But there is a principled way to expose the fragility of his: by asking him to apply his skepticism universally, and by asking him to account for the reliability of his own intuition compared to the collective machinery he rejects.

  If you write this, write it as an investigation into trust, not truth. Truth is what you're fighting over; trust is the ground you're standing on. And right now, you two are standing on different planets.
