answer: |-
  Here are ten questions designed for the Q&A session. They are structured to preempt the "incredulous stare" defense by framing objections in terms of *theoretical cost*, *explanatory failure*, or *internal coherence* rather than mere intuitive implausibility. Each includes the anticipated Lewisian reply and a follow-up designed to close the escape route.

  ### 1. The Parsimony Distinction (Required Topic)
  **Question:** You defend the ontological extravagance of modal realism by distinguishing between *qualitative* parsimony (types of entities) and *quantitative* parsimony (tokens of entities), arguing you only violate the latter. Is this distinction doing genuine philosophical work in your system, or does it function as a movable boundary that is redrawn whenever the charge of extravagance becomes too pressing?

  *   **Anticipated Reply:** She will likely argue that ideology (the vocabulary needed to describe the theory) remains lean, even if ontology expands, and that quantitative multiplication of the same kind is theoretically cheap.
  *   **Follow-up:** "If ideology is the true measure of cost, does your analysis of the actuality operator and the counterpart relation not significantly bloat your *ideology* compared to an ersatzer who treats worlds as abstract sets? At what point does ideological complexity outweigh quantitative ontology?"

  ### 2. The Principle of Recombination & Alien Properties (Required Topic)
  **Question:** The Principle of Recombination is meant to secure a genuine plenitude of worlds, including those with fundamentally alien natural properties that do not exist in our universe. How can you quantify over or recombine properties that are, by definition, beyond our conceptual grasp without smuggling in the very modal notions you aim to reduce, or resting on bare stipulation?

  *   **Anticipated Reply:** She will likely claim Recombination is a methodological postulate required for the system to work, not an empirical claim, and that we can refer to alien properties via their structural roles.
  *   **Follow-up:** "If it is a postulate rather than a derived truth, does that not render Genuine Modal Realism an axiomatized formal system rather than a metaphysical discovery about concrete reality? And if we refer to them only by structural role, have we really captured *alien* properties, or just placeholders for them?"

  ### 3. Kripke's *De Re* Objection (Required Topic)
  **Question:** Saul Kripke argued that counterpart theory changes the subject of ordinary *de re* claims: when we say 'Humphrey could have won,' we care about *Humphrey*, not a spatiotemporally isolated counterpart. If your theory requires us to revise the truth conditions of our ordinary modal discourse to make it true, are you explaining our modal concepts or replacing them?

  *   **Anticipated Reply:** She will likely argue that philosophical analysis often revises ordinary concepts to achieve precision (conceptual engineering) and that the counterpart relation preserves enough similarity to satisfy our interests.
  *   **Follow-up:** "But if the truth of 'Humphrey could have won' depends on a relation that is context-dependent and not transitive, do we not lose the ability to make sense of essential properties? If Humphrey's essence varies depending on which counterpart relation we select, haven't we lost the objectivity of *de re* modality?"

  ### 4. The Indexicality of 'Actual'
  **Question:** You analyze 'actual' as an indexical term, similar to 'here' or 'now,' meaning every inhabitant of every world is actual to themselves. Why should we accept an analysis that strips 'actual' of its privileged ontological status, given that our entire epistemic and practical lives treat actuality as a unique, non-relational property?

  *   **Anticipated Reply:** She will likely argue that the indexical analysis is the only way to maintain the contingency of the world without positing a mystical "actuality" property that singles out one world.
  *   **Follow-up:** "However, if 'actual' is merely indexical, then the statement 'I am actual' is trivially true for every possible being. Does this not fail to capture the profound asymmetry we perceive between what *is* the case and what *merely could have been* the case, an asymmetry that drives scientific and historical inquiry?"

  ### 5. Epistemic Access and Causal Isolation
  **Question:** If possible worlds are causally isolated from our own, by what mechanism do we have epistemic access to them? If we cannot observe them, how do we justify claims about their specific contents beyond what is logically consistent?

  *   **Anticipated Reply:** She will likely appeal to inference to the best explanation: we posit them because they systematize our modal talk, similar to how we posit electrons.
  *   **Follow-up:** "But electrons have causal effects on our instruments. If modal realism posits entities that are definitionally incapable of interacting with us, isn't the analogy to scientific realism broken? How do you distinguish this from a form of sophisticated storytelling?"

  ### 6. Explanatory Scope vs. Ersatzism
  **Question:** Proponents of 'ersatz' modal realism (abstract possible worlds) claim they can secure the same logical and semantic benefits without the concrete ontological cost. What specific explanatory work can Genuine Modal Realism do that an abstractist theory cannot?

  *   **Anticipated Reply:** She will likely argue that abstract worlds cannot genuinely represent *de re* possibilities without invoking primitive modal notions, whereas concrete worlds reduce modality to existence.
  *   **Follow-up:** "If the advantage is reduction, but your reduction relies on the Principle of Recombination—which itself seems to rely on a prior understanding of 'possibility'—haven't you simply pushed the modal primitive back one step rather than eliminating it?"

  ### 7. The Spatiotemporal Relation
  **Question:** Worlds are defined as maximal sums of spatiotemporally related entities. But what defines the spatiotemporal relation itself? If it is a natural relation, how do we know it doesn't hold between entities in different 'worlds,' thereby collapsing them into one?

  *   **Anticipated Reply:** She will likely state that spatiotemporal relatedness is a primitive, internal relation that simply does not hold across worlds, by definition.
  *   **Follow-up:** "If it is a primitive that simply fails to hold across worlds, isn't the isolation of worlds a brute fact? And if the isolation is brute, doesn't that weaken the claim that your system is more systematic or less mysterious than the primitivism it seeks to replace?"

  ### 8. Ethical and Practical Significance
  **Question:** If every possible way a world could be is a way some world *is*, does this not diminish the normative significance of our choices? If a version of me succeeds in every possible scenario where success is possible, what weight does my actual effort carry?

  *   **Anticipated Reply:** She will likely argue that *you* are only located in this world, so your efforts only affect this world; the successes of counterparts are not *your* successes.
  *   **Follow-up:** "But if all those counterparts are equally real and equally 'you' in terms of qualitative identity, why should I care more about the welfare of the 'me' in this indexical location than the 'me' in another? Doesn't this fragment the self in a way that undermines rational self-interest?"

  ### 9. The Trade-Off of Theoretical Virtues
  **Question:** You often argue that we should trade ontological parsimony for systematicity and logical utility. Is there any threshold of ontological cost that would outweigh these benefits? If not, isn't the theory immune to criticism by design?

  *   **Anticipated Reply:** She will likely say that the cost is only high if one accepts pre-theoretical intuitions as data, which she rejects.
  *   **Follow-up:** "But if we cannot appeal to pre-theoretical intuitions about what exists, what anchors the theory to reality rather than logical consistency? If a theory is logically consistent but describes a reality utterly unrecognizable to human cognition, in what sense is it a metaphysics of *our* world?"

  ### 10. Falsification Conditions (Required Closing)
  **Question:** To close, I'd like to ask about the limits of the view. Setting aside logical contradiction, what substantive metaphysical evidence or argument would you accept as evidence *against* Genuine Modal Realism? What would have to be true about modality or ontology for you to abandon the view?

  *   **Anticipated Reply:** She will likely say she would abandon it if a rival theory could match its systematicity without the ontological cost, or if it were shown to be internally inconsistent.
  *   **Follow-up:** "So the view is not vulnerable to the nature of reality itself, but only to the existence of a better theoretical competitor? Does this not suggest that Modal Realism is a methodological stance rather than a truth-apt claim about the furniture of the universe?"
