      *   The user's intuition that "no tallying method will actually fix this" points directly to **Arrow's Impossibility Theorem**.
      *   The specific phenomenon where the agenda setter controls the outcome is known as **Cycling** or **Agenda Manipulation** in social choice theory.
      *   The point count method used is a **Borda Count**, which is known to violate the Condorcet Criterion (as seen here).

  3.  **Formulate the Answer:**
      *   **Validate the User:** Confirm their intuition is correct. This isn't a bug; it's a feature of collective choice theory.
      *   **Explain the Math (Simply):**
