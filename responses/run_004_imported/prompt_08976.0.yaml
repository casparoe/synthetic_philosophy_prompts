          *   Name the Theorem: Arrow's Impossibility Theorem.
          *   Explain what it means: No ranked voting system can satisfy a specific set of "fairness" criteria (non-dictatorship, Pareto efficiency, independence of irrelevant alternatives) when there are 3+ options.
      *   **Address the Co-founder's Plan:** Building a tool won't solve the mathematical impossibility. It might obfuscate it, but not fix it.
