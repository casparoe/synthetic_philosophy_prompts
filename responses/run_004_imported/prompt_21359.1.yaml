answer: |-
  Here is the argument you're looking for.

  The standard historiography treats Newton's heterodoxy as a private quirk that sits awkwardly beside the *Principia*. The claim here is the opposite: Newton's Arianism—specifically his obsession with **Divine Dominion** over Divine Essence—is the metaphysical prerequisite for Absolute Space. Without this specific heresy, the architecture of Newtonian physics collapses into Leibnizian relationism.

  ### 1. The Theological Pivot: Dominion vs. Essence
  Orthodox Trinitarianism (and the Scholastic tradition following Aquinas) defines God primarily through *Essence*. God is *Actus Purus*, the Necessary Being, the uncaused Cause. In this framework, space and time are contingent features of creation. God relates to them logically, not spatially. To say God is "in" space is a category error; He sustains space by an act of will, but He is not metrically present.

  Newton rejects this. In the *General Scholium*, he explicitly redefines divinity not as "Eternal, Infinite, Omniscient" (attributes of essence) but as **"Pantokrator"** (Almighty Ruler). He writes: *"God is a relative word and has a respect to servants."*

  This is the Arian/Socinian fingerprint. For Newton, the Father is not just the logical ground of being; He is the Sovereign King. A King without a Kingdom is a contradiction. A Sovereign without a domain He immediately inhabits and rules is a absentee landlord. For Newton, God's divinity is constituted by His **actual rule over actual things**.

  ### 2. Space as the Locus of Dominion
  This is where the physics becomes theology. If God's divinity depends on His Dominion, He must be **ontologically present** to every point of creation to rule it. He cannot rule remotely through secondary causes alone (which would imply a delegation of sovereignty Newton found theologically suspect).

  Therefore, Absolute Space is not merely a coordinate system for inertia; it is the **substantive arena of God's Kingship**.
  *   **In the *Opticks*:** When Newton calls space the "sensorium of God," critics (then and now) recoil, thinking he makes God material. But for Newton, this is the only way to preserve Dominion. A sensorium is the seat of immediate perception and control. If space were merely relational (a set of distances between objects), God would only be present where objects *are*. If objects moved, God's presence would shift.
  *   **The Load-Bearing Heresy:** Absolute Space exists eternally and immutably *because* God is eternally and immutably Sovereign. Space is the "emanative effect" of God's existence. It is the extension of His Will. Without a real, absolute container, God's Dominion is fragmented and relative.

  ### 3. The Leibnizian Foil
  The Leibniz-Clarke correspondence is usually read as Relational vs. Absolute Space. Read theologically, it is **Rationalism vs. Voluntarist Kingship**.

  Leibniz attacks Newton's space as a "chimerical" absolute that limits God. He argues that if space is God's sensorium, God is finite and extended. Leibniz's God is a Geometer; He creates the best of all possible worlds through rational selection. Space is just the order of co-existences.

  Clarke (channeling Newton) retorts that denying absolute space denies God's omnipresence. But look deeper: Leibniz cannot accept Absolute Space because his Trinitarian/Scholastic metaphysics allows for **Mediation**. The Logos mediates creation. God can be transcendent *and* immanent through the Son.

  Newton's Arianism strips this away. The Son is a vice-regent, a creature, not co-eternal. The Father stands alone against the Void. There is no co-equal Logos to bridge the gap between Transcendence and Creation. **Absolute Space is the bridge.** It is the only thing eternal besides the Father. If you remove Absolute Space, Newton's God is isolated in transcendence, unable to exert the direct Dominion that defines His divinity. Leibniz could afford relational space because his God had a Trinity to manage the metaphysics of presence. Newton did not.

  ### 4. The Trinitarian Counterfactual
  Could an orthodox Trinitarian Newton have written the *Principia*? **No.**

  An orthodox Newton would have viewed the universe as a mediated creation. The laws of motion could be sustained by the Logos relationally. Space could be phenomenal, an order of relations, because God's presence is guaranteed by Essence, not metric extension.

  Newton's physics requires a universe that is a **direct projection of Will**. Gravity acting at a distance without a mechanical medium is already a theological statement: it is God's direct hand moving matter without touching it. Absolute Space is the stage for this direct action.
  *   **Trinitarian Metaphysics:** God -> Logos -> Creation (Space is relational/contingent).
  *   **Newtonian Metaphysics:** God (Pantokrator) -> Absolute Space (Emanation) -> Matter (Passive).

  ### Conclusion
  Newton's heresy is not a sidebar; it is the keystone. His Arian obsession with the Father's exclusive Dominion required a metaphysics where God is immediately, substantially present to every point of the universe at all times. Absolute Space is that presence.

  Leibniz saw this clearly when he accused Newton of making space a "divine attribute." He was right, but he missed *why*. Newton made space a divine attribute because without it, his God ceases to be the Sovereign Lord and becomes merely the First Cause. The *Principia* is not just a description of how bodies move; it is a description of how God rules. And a King rules in Absolute Space.
