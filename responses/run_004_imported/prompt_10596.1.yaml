answer: |-
  This is one of the trickiest distinctions in Nagel's essay because, as you noticed, both types feel like "things outside your control." The key to separating them is to ask: **Is the luck about the *test* (the situation), or is the luck about the *tester* (your personality)?**

  Here is a specific scenario designed to isolate these two variables so you can see exactly where the line is drawn.

  ### The Scenario: "The Confidential File"

  **The Character:** Morgan, an administrative assistant.
  **The Action:** Morgan reads a confidential file they were not supposed to see.

  #### 1. The Constitutive Luck (The Internal Makeup)
  **What it is:** This is the "stuff about you" that you didn't choose—your temperament, inclinations, and psychological predispositions.
  **In this scenario:** Morgan has a naturally high level of **curiosity and low impulse control**. When Morgan sees something forbidden, they feel a genuine, almost physical itch to look at it. They didn't choose to be born with this temperament; it is just who they are.
  *   **The Constitutive Verdict:** If we judge Morgan based *only* on constitutive luck, we say: "Morgan is blameworthy because they are the *kind of person* who gives in to curiosity. A person with a more disciplined constitution would have walked away."
  *   **The Luck:** Morgan was unlucky to be born with a weak will regarding curiosity.

  #### 2. The Circumstantial Luck (The External Situation)
  **What it is:** This is the "stuff about the world" that you didn't choose—the specific problems, opportunities, or temptations placed in front of you.
  **In this scenario:** Morgan's boss accidentally left the confidential file **face-up on the printer** in a empty room. If the boss had put it in a folder, or if Morgan had been assigned to a different shift where the printer wasn't used, the temptation would not exist.
  *   **The Circumstantial Verdict:** If we judge Morgan based *only* on circumstantial luck, we say: "Morgan is blameworthy only because they were *placed in a situation* where the file was visible. If the file had been locked away, Morgan would be innocent."
  *   **The Luck:** Morgan was unlucky to be in the room at the exact moment the file was exposed.

  ---

  ### How the Verdicts "Pull Apart"

  Here is how you separate them when your teacher blurs them. You have to run a **Counterfactual Test** (imagining what would happen if you changed one variable but kept the other the same).

  #### Test A: Isolating Circumstantial Luck
  *Keep Morgan's personality the same, change the situation.*
  *   **Scenario 1:** The file is left out. Morgan reads it. (Verdict: Guilty).
  *   **Scenario 2:** The file is locked in a safe. Morgan walks past it. (Verdict: Innocent).
  *   **The Separation:** Morgan's **Constitution** (curiosity) did not change between Scenario 1 and 2. They are the exact same person with the exact same internal flaws. Yet, their moral status changes from "Guilty" to "Innocent."
  *   **Conclusion:** The difference in verdict is purely **Circumstantial Luck**. This shows that our judgment of Morgan depends on the *environment*, not just the *self*.

  #### Test B: Isolating Constitutive Luck
  *Keep the situation the same, change Morgan's personality.*
  *   **Scenario 1:** Morgan (Curious) sees the file and reads it. (Verdict: Guilty).
  *   **Scenario 2:** Jordan (Naturally Discreet) sees the file and walks away. (Verdict: Innocent).
  *   **The Separation:** The **Circumstance** (the file on the printer) is identical in both cases. The "test" was the same. Yet, the verdict changes.
  *   **Conclusion:** The difference in verdict is purely **Constitutive Luck**. This shows that our judgment depends on the *internal makeup*, which Jordan and Morgan did not choose.

  ### Why This Matters for Nagel

  Your teacher likely blurred them because in the real world, they happen simultaneously. But Nagel wants you to see that **both** undermine moral responsibility, just from different angles.

  *   **Circumstantial Luck** undermines blame by saying: "You're only 'good' because you never got caught in a bad situation." (The Saint who never faces temptation isn't truly virtuous).
  *   **Constitutive Luck** undermines blame by saying: "You're only 'bad' because you were born with a temperament that makes doing the right thing harder for you than for others." (The sinner who was born with a weak will had less control than the saint born with a strong will).

  **The "Pull Apart" Summary:**
  If you want to know if it's **Circumstantial**, ask: *"Would this person be judged differently if the **world** looked different?"*
  If you want to know if it's **Constitutive**, ask: *"Would this person be judged differently if **they** were built different?"*

  In the "Confidential File" scenario, Morgan is trapped by both: they didn't choose to be nosy (Constitutive), and they didn't choose to walk into that room at that time (Circumstantial). Nagel's point is that once you see both factors, it becomes very hard to say Morgan is truly *responsible* in a deep moral sense.
