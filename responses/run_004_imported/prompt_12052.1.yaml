      *   *Middle:* "But if you stayed in this room, you learned quickly..." (Precision). The work. The "inert facts" joke. "I could list the 38 years, the 4,000 students... but those are just inert facts."
      *   *End:* "So what happens after the precision?" (Generalization). The freedom. The speaker's career. The legacy. The toast.

