      *   **Constraint 4 (Length):** About 5 minutes read aloud (roughly 600-750 words at a moderate pace).
      *   **Goal:** Honor Doyle, acknowledge his impact (specifically on the speaker's career path), and avoid being a dry list of achievements.

  2.  **Deconstruct the Structure (Whitehead's Rhythm):**
      *   **Stage 1: Romance.** This is the hook. Emotional, vivid, sensory. No hard data. It's about the *feeling* of being in Doyle's class. The spark.
      *   **Stage 2: Precision.** This is the grind. The details, the discipline, the hard work. Acknowledging the rigor. This is where the "inert ideas" joke fits best, as a pivot away from dryness.
      *   **Stage 3: Generalization.** This is the synthesis. What does it all mean? How did it change us? The legacy. The open-ended future.

  3.  **Drafting - Stage 1: Romance (The Hook):**
      *   *Idea:* Start with a specific memory. Not a grade, but a moment.
      *   *Sensory details:* The smell of old books, the sound of his voice, a specific question he asked.
      *   *Tone:* Warm, nostalgic, slightly mysterious.
