      *   *Idea:* A group stranded on a coast/island needing to move heavy objects or coordinate fishing.
      *   *Refinement:* Let's go with a signaling system for a dangerous or difficult task. Maybe hauling a boat up the beach before a storm, or coordinating a net pull. Let's choose *hauling a beached whale* or *moving a large log for shelter*. Actually, let's go with something recurring: *The Tide Watch*. No, that's individual.
      *   *Better Idea:* *The Water Carry.* A group needs to move water from a source to a camp. It requires a line. How do they signal "lift," "drop," "stop"?
      *   *Best Idea:* *The Night Watch/Warning System.* A group stranded on a rocky outcrop. They need to warn each other of slipping or danger in the dark.
      *   *Actually, let's look at the prompt's suggestion:* "This is how we make group decisions." That's abstract. "This is how we greet." That's classic.
      *   *Decision:* Let's focus on a *greeting/acknowledgment* ritual that evolves from a practical necessity. It bridges the gap between utility and symbolism.
      *   *Setting:* A group of survivors on a bleak, windy coast. Let's say 12 people.
      *   *The Problem:* It's loud. Wind and waves make speech hard. They need to know someone is approaching without startling them (safety) and without wasting energy shouting.

  3.  **Drafting - Scene by Scene:**

      *   **Scene 1: Chaos/Noise.** Establish the environment. Loud wind. People startling each other. Tension. The need for coordination.
      *   **Scene 2: The First Accident/Incident.** Someone gets hurt or drops something because they were startled. This creates the pressure for a solution.
      *   **Scene 3: The Accidental Signal.** Someone does something unintentional that works. A specific sound, a visual cue.
      *   **Scene 4: Repetition/Imitation.** Others notice it worked. They copy it.
      *   **Scene 5: Codification.** It becomes expected. Deviation causes confusion.
      *   **Scene 6: The New Normal.** Months later. The signal is now a greeting, stripped of original utility but kept for social cohesion.

  4.  **Developing the Narrative Arc:**
      *   *Characters:* Needs a focal point. Let's follow Elias, an observer type.
      *   *The Signal:* Stomping twice? Whistling? Tapping a tool? Let's go with *tapping a metal pole against a rock*. It cuts through the wind noise.
      *   *Evolution:*
          1.  Elias does it to check his footing.
          2.  Sarah hears it, knows he's there, doesn't turn around aggressively.
          3.  Sarah does it back.
          4.  It becomes "I am here."
          5.  It becomes "I am friendly."

  5.  **Writing - Focusing on the "Fuzzy" Process:**
      *   Avoid dialogue like "Let's make a rule."
      *   Use internal monologue and observation.
      *   Highlight the *awkwardness* of the early attempts.
      *   Show the *relief* when coordination works.

  6.  **Drafting - Section by Section (Mental Outline):**
