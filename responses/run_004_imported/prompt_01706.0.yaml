answer: |-
  The wind on Skerry Rock didn't blow; it scoured. It was a constant, physical weight, a grey curtain that erased the horizon and turned the world into a claustrophobic circle of ten paces.

  There were fourteen of us. We had washed up over the course of three days after the *Kestrel* broke apart on the reefs. We were a mismatched collection: cooks, engineers, a teacher, a student. We had no leader. In the first week, there had been shouting matches over rationing and shelter, but the wind ate our voices. Arguments required energy we couldn't spare. So, we fell into a sullen silence, moving like ghosts around the central fire pit, which we huddled behind to block the gale.

  The problem was the blind approach. The camp was nestled in a hollow of volcanic rock. If you walked up from the beach, you were invisible until you crested the ridge, ten feet away. In the howling gale, you couldn't hear footsteps.

  Three days in, it happened. Marcus, the engineer, was crouched by the water casks, tightening a lid. Sarah, the teacher, came up from the ridge. She didn't see him. He didn't hear her. She startled him; he jerked back, slamming his hand into the rock. He didn't break a bone, but the pain made him roar, and he shoved her. She fell into the mud.

  There was no apology, just a hard, terrified stare. We were all living on raw nerves. The accident wasn't malice; it was a coordination failure. We needed a way to say *I am here* without shouting ourselves hoarse.

  The first attempt came from David, the student. He tried whistling. He stood on the ridge and blew two sharp notes. But the wind snatched the sound and shredded it. By the time it reached the camp, it was just a breathy sigh. Marcus looked up, squinted, and went back to work. Whistling was dead on arrival.

  The convention didn't start with a meeting. It started with a limp.

  Elias, the oldest of us, had hurt his ankle during the wreck. He had fashioned a crude crutch from a piece of driftwood and a shard of iron piping he'd salvaged. On the fourth morning, Elias came up from the beach. The wind was particularly vicious, driving sleet horizontally.

  As he climbed the ridge, his crutch slipped on the wet basalt. To steady himself, he slammed the iron pipe down hard against the rock.

  *CLANG.*

  The sound was sharp, metallic, and low-frequency. It cut through the wind like a knife.

  In the camp, Marcus looked up. He saw Elias. He didn't tense up. He didn't reach for the knife on his belt. He just nodded and went back to mending the tarp.

  Two hours later, Elias needed to go back down to the beach. He stood up, tested his weight, and as he stepped toward the ridge, he consciously tapped the pipe against a stone near the fire.

  *CLANG.*

  Marcus looked up. Elias pointed down. Marcus waved him off.

  It was a solution, but it wasn't a rule yet. It was just a trick Elias used.

  The shift happened the next day. Sarah needed to fetch more driftwood. She didn't have a crutch. She didn't have iron. She stood at the ridge, hesitating. She looked at Elias, who was sitting by the fire. She looked at the rocks. She picked up two stones.

  She struck them together. *Clink. Clink.*

  It wasn't as loud as the iron, but the rhythm was the same. Two beats. A pause.

  Marcus looked up. He didn't glare. He didn't ask what she was doing. He simply acknowledged the pattern. The specific material didn't matter; the *interruption* of the wind's noise mattered.

  This is where the fuzziness began. If Sarah had clapped once, would it have worked? Maybe. But she copied Elias's rhythm. She didn't ask him permission. She just observed that his method resulted in safety, and she mimicked the structure of it.

  By the end of the week, it was spreading. But it was messy. Some people did one tap. Some did three. When David came up from the beach and tapped four times rapidly, Marcus didn't look up. He assumed it was just noise. David had to wait, awkward and exposed in the wind, until he realized his signal hadn't registered. He tried again. Two taps. *CLANG. CLANG.*

  Marcus looked up immediately.

  David adjusted. He didn't announce, "We are using two taps." He just learned that two taps worked and four didn't. He converged on the group's behavior to solve his own problem of being ignored.

  The critical moment of crystallization came on day ten. A new dynamic emerged. It wasn't just about safety anymore; it was about status and acknowledgment.

  I was sitting near the fire when Jen, the cook, returned from checking the fish traps. She was tired. She crested the ridge and struck her knife against her pot.

  *CLANG. CLANG.*

  But she didn't stop there. She waited for a response.

  In the beginning, the signal was unilateral: *I am arriving.* Now, Jen was expecting a handshake. She stood there, silhouetted against the grey sky, waiting.

  Marcus, busy with a rope, paused. He realized the silence was stretching too long. It felt rude. It felt like a rejection. He picked up a wrench and tapped it against the anchor point.

  *CLANG. CLANG.*

  Jen nodded and walked down to the fire.

  That was the moment the convention locked in. It had mutated from a warning signal into a greeting. The utility remained—you still didn't want to startle anyone—but the social weight had doubled. To not answer the knock was now an act of aggression. To not knock was an act of stealth, implying you had bad intentions.

  We never voted on this. We never discussed it. If you asked us on day fifteen what the rule was, we couldn't have articulated it. But if you violated it, you felt it.

  I remember day twenty. A storm had battered us for forty-eight hours. We were exhausted, huddled in the cave. The wind died down for an hour, a rare, eerie silence.

  A stranger washed up. He wasn't from the *Kestrel*. He was from a smaller boat that had capsized miles away, drifting on a hatch cover. He was delirious. He stumbled up the ridge, seeing the smoke, seeing the movement.

  He walked straight into the camp without a sound.

  Four of us stood up instantly. Hands went to tools. The air turned icy. It wasn't that we thought he was an enemy; it was that he had broken the grammar of our world. By not signaling, he had placed himself outside the circle of coordination. He was a variable we couldn't track.

  Elias was the first to move. He didn't raise his crutch. He tapped it gently on the ground. *Clang. Clang.*

  The stranger froze, confused. He looked at the iron, then at Elias. He didn't understand the code.

  Elias tapped again, slower. *Clang... Clang.*

  The stranger looked at the rock in his hand. He understood. He tapped the rock against the ground.

  *Clang. Clang.*

  The tension evaporated. We helped him sit. We gave him water.

  That night, lying on my mat, I thought about how fragile that moment had been. If Elias had shouted, the stranger might have panicked. If the stranger had run, we might have chased him. We had built a bridge out of sound and rhythm, a tiny island of order in the chaos of the wind.

  Months later, when the rescue ship finally appeared on the horizon, the convention was so deep it felt biological. We were packing our meager belongings. People were moving in and out of the cave, carrying loads.

  *Clang. Clang.*
  *Clang. Clang.*

  It was automatic. You didn't think about it. You just did it.

  On the boat, heading back to the mainland, I sat next to Sarah. The engine hummed, a steady, loud drone. We were safe. We were going home. We didn't need to worry about startling each other. There were walls, doors, civilized noises.

  I stood up to go get coffee from the crew. I walked past her. I didn't tap anything. I didn't make a sound.

  She didn't look up.

  I felt a sudden, sharp pang of isolation. I realized then that the convention hadn't just been about safety. It had been about recognition. It was a way of saying, *I exist, and I acknowledge that you exist.*

  I stopped. I picked up my metal cup. I tapped it twice against the railing of the ship.

  *Cling. Cling.*

  Sarah looked up. She smiled, a tired, genuine smile. She picked up her water bottle and tapped it against her knee.

  *Cling. Cling.*

  We weren't on Skerry Rock anymore. The wind was gone. The danger was gone. But the fabric we had woven in the dark was still there, holding us together. It was strange to think that if Marcus hadn't slammed his hand that first day, or if Elias's crutch had been wood instead of iron, we might be clapping, or whistling, or stomping. It could have been anything.

  But it was this. And because it was this, it was ours.
