answer: |-
  The cursor blinked against the black terminal window. A single pulse, sixty times a minute, keeping time with the clock on the wall.

  Dr. Aris Thorne sat in the blue wash of her monitors, her fingers hovering over the enter key. On the screen was the output of the Model. It was her life's work, really: a predictive heuristic for systemic stability. She had built it to anticipate structural failures in power grids, but six months ago, she had begun feeding it personal variables. Sleep patterns, tone analysis from voice mails, expenditure logs, biometric data from the wearable on her left wrist.

  She had fed it *them*.

  The output was a probability vector. **94.8% chance of dissolution within four months.**

  It wasn't a guess. It was physics. It was the inevitable heat death of a closed system. The data showed the cooling curve, the entropy increasing, the energy required to maintain the bond exceeding the energy generated by it. It was rigorous. It was undeniable. It was true.

  Aris closed her eyes. She could feel the headache blooming behind her orbitals, a tight band of pressure.

  If she accepted this truth, the machinery of her life would shift. She would have to initiate the containment protocols. She would have to have the Conversation. She would have to pack boxes, divide assets, and prepare for the vacuum. Reason demanded she act on the data. To ignore a 94% failure rate in the grid would be negligence. In a marriage, it was supposedly wisdom.

  But Aris knew something about the architecture of joy that the Model did not.

  She opened her desk drawer. Inside, beneath a stack of grant proposals, lay a leather-bound notebook. She pulled it out. It wasn't a lab journal. It was a draft of a monograph she would never publish, titled *On the Necessity of Error*.

  She flipped to a page dog-eared at the corner. Her handwriting was sharp, angular.

  *Reason is a scalpel. It dissects the frog to understand the jump, but in the cutting, it kills the motion. Happiness is not a state of accuracy. It is a state of momentum. To feel the passion, one must believe in the permanence of the fuel. If we analyze the combustion while it burns, we suffocate the fire.*

  She read the words. They were her own, but they felt like they belonged to a ghost. A woman from the eighteenth century who translated Newton by candlelight and died pursuing a passion that reason told her was dangerous.

  Aris looked back at the screen. **94.8%**.

  If she acknowledged this number, she became an observer of the collapse. The moment she measured it, she collapsed the wave function. The relationship would become a problem to be solved, not a life to be lived. The anxiety of the ticking clock would poison every dinner, every touch. The truth would become a self-fulfilling prophecy, not because it was fate, but because *knowing* changes the chemistry.

  She needed the illusion. Not because she was weak, but because she was an engineer. She knew that some machines required friction to run. She knew that a certain amount of structural stress was necessary to hold the arch together.

  Her husband, Julian, stirred in the other room. She heard the creak of the floorboards, the soft shuffle of socks on wood.

  Aris's hand moved. She didn't hit *Enter* to save the log. She didn't hit *Delete* to erase the sin. She highlighted the file, selected *Corrupt Data*, and moved it to the archive folder labeled *System Errors - Discard*.

  She was lying to the machine. She was lying to herself. She was choosing the error.

  "Working late?"

  Julian stood in the doorway. He was wearing the old grey t-shirt she loved, the one with the hole in the collar. He looked soft, warm, un-analyzed. He didn't know he was a variable in a decay equation. He thought he was a husband coming to fetch his wife to bed.

  Aris felt the cold logic of the screen still radiating against her face. She knew, with scientific certainty, that this moment was transient. She knew the entropy was winning. She knew that in four months, this doorway might be empty.

  But right now, the light from the monitor was the only thing illuminating the room, and if she turned it off, she would be in the dark. If she kept it on, she could see him.

  "Just cleaning up some noise," Aris said. Her voice was steady. She minimized the window. The desktop background was a photo of them from last summer, blurred by motion, out of focus. Imperfect.

  "Come to bed," Julian said. He didn't ask about the work. He held out a hand.

  Aris looked at his hand. She calculated the warmth, the grip strength, the probability that this gesture would be repeated tomorrow. The math said *unlikely*. The math said *prepare for loss*.

  But the *Discourse* said otherwise. *The machine of happiness requires that we do not look at the gears while they turn.*

  She stood up. She let the chair roll back, hiding the screen. She walked to him and took his hand. She let herself believe, with a willful, violent suspension of disbelief, that the vector was infinite. That the heat would not dissipate. That the 94.8% was a glitch in the sensor, not a law of the universe.

  "Okay," she said. "I'm coming."

  She followed him into the dark hallway. She left the monitor on behind them, a small, glowing eye staring at the back of her head, watching her choose the lie. She didn't turn around. To look back would be to invite the reason in. To keep walking was to protect the machine.

  As they reached the bedroom, Julian kissed her forehead. It was a reflex, habitual and sweet.

  Aris closed her eyes. She didn't analyze the pressure of his lips. She didn't measure the duration. She simply let the sensation wash over her, a wave she refused to quantify. She let the illusion hold. She let it be heavy and solid and real.

  For tonight, the physics could wait. The universe could expand and cool and die tomorrow. Tonight, she would be warm.
