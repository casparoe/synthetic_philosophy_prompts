      *   *Correction:* Don't tell them what to do. Give them the tools to decide.
      *   *Nuance:* Acknowledge that quitting isn't always an option (visas, family, economy). The "Complicity" argument preys on this vulnerability. I need to dismantle that gently.
      *   *Engineering Ethics:* Bring in the ACM Code of Ethics. It's relevant to backend engineers. "Avoid harm," "Be honest."

  8.  **Final Polish:**
