answer: |-
  The steel beams of the Aethelgard Tower groaned softly in the wind, a sound only Kiera seemed to hear. She stood in the site office, the load-bearing calculation sheet trembling in her hand. She had missed a variance factor. Not enough to bring the structure down tomorrow, but enough to violate code within five years. In her firm, such an error wasn't a mistake; it was a termination clause.

  Vance, the senior architect, sat across the desk. He was two years from retirement, his reputation carved into the skyline of the city. He took the sheet, scanned the numbers, and looked at her. He could sign off on a corrective retrofit—a bureaucratic workaround that would mask the error permanently. It would save Kiera's career. But if the retrofit ever failed or was audited, the signature would trace back to him. His pension, his legacy, would vanish.

  "Why should I burn?" Vance asked, his voice flat.

  Kiera didn't offer excuses. She didn't cry. She simply placed her pen on the desk, aligning it perfectly with the edge of the blotter. "Because the building matters more than the signature," she said. "And because if you save me, I won't let you carry the weight alone when the time comes."

  Vance watched her hands. They were steady. Most juniors, when caught, became chaotic—shifting blame, bargaining, promising everything they couldn't deliver. Kiera's stillness signaled something else: a disposition toward resolution over self-preservation. She wasn't promising to pay; she was showing him she was the *kind of agent* who pays. Vance picked up his pen. He signed the retrofit. He saved her.

  Five years later.

  Kiera sat in the same office, now hers. The Aethelgard Tower stood tall behind her window, profitable and stable. The retrofit had held perfectly. There was no structural risk. However, the firm was undergoing a voluntary compliance audit. The retrofit paperwork was flagged. If Kiera authorized a specific, costly maintenance fund from her current project's budget, the audit trail would be sealed as "proactive improvement." If she didn't, the trail remained open as "corrective action," which would trigger an investigation into Vance's original signature.

  Authorizing the fund would wipe out her team's annual bonus. It would stall her promotion. Causally, the building was safe either way. Vance was already retired; his pension was locked unless fraud was proven. Kiera was safe; the error was technically hers now, but unprovable without the investigation. She could keep the bonus, keep the promotion, and let the audit run its course. Vance would likely be cleared eventually, but the stress would cost him his peace. Or, she could pay the cost now, for a benefit she had already received half a decade ago.

  Her CFO sat across from her, the tablet glowing with the budget projection. "It's optional, Kiera," he said, tapping the screen. "Legally, we don't need to fund the maintenance. The structure is sound. Why burn the budget?"

  Kiera looked at the pen on her desk. It was aligned perfectly with the edge. She remembered the feeling of the air leaving the room five years ago, the certainty of her own ending, and the hand that had reached out not because she begged, but because she was recognizable.

  "Process the transfer," she said.

  "You're tanking your quarter for a ghost," the CFO warned. "Vance isn't here to see it. No one knows."

  "I know," Kiera said, signing the authorization. The bonus vanished. The promotion would wait. The causal link to her own survival was severed; she was already safe. She was acting against her current narrow interest solely because she was fulfilling the disposition that made her survival possible in the first place.

  Kiera's choice vindicates a dispositional picture of rationality, where it is rational to cultivate traits that commit you to future cooperation even when immediate defection is profitable. Plain "do what's best for you right now" reasoning fails because it cannot account for the value of being the kind of person others can trust to act against their own immediate interest.
