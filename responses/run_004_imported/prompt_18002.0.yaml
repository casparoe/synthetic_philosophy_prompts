      *   **Core Debate:** Simon Saunders' "Weak Discernibility" (rescuing PII via irreflexive relations) vs. Katherine Hawley's "Circularity Objection" (weak discernibility presupposes numerical diversity).
      *   **Format:** A dialogue between two philosophers *inside* Black's universe (standing between the two iron spheres).
      *   **Requirements:**
