      *   *Is the user right about Frankfurt?* Yes, Frankfurt's 1969 paper "Alternate Possibilities and Moral Responsibility" is the standard bearer for attacking PAP.
      *   *Is the comparison valid?* Superficially, yes. Both involve an agent who does $X$, wants to do $X$, but could not have done not-$X$ due to an external constraint they were unaware of.
      *   *Is there a difference?* Yes, a significant one regarding *moral responsibility* vs. *freedom of action*.

  3.  **Deconstruct the Difference (The Core Philosophical Nuance):**
      *   **Locke's Focus:** Locke is primarily talking about *liberty* (freedom of action), not necessarily *moral responsibility* in the deep sense Frankfurt targets. Locke distinguishes between "voluntary" (acting according to one's will) and "free" (having the power to act or not act). In the locked room case, the action is voluntary, but the agent is not *free* to leave. Locke's point is often about the definition of liberty, not necessarily absolving or assigning blame in a moral sense.
      *   **Frankfurt's Focus:** Frankfurt is specifically targeting *Moral Responsibility*. The PAP formulation is: "A person is morally responsible for what he has done only if he could have done otherwise." Frankfurt wants to show you can be *blameworthy/praiseworthy* even if you couldn't have done otherwise.
      *   **The "Flicker" Strategy/Objection:** This is the technical bit. In Locke's case, the constraint is physical (locked door). In Frankfurt's case, the constraint is counterfactual (the chip).
