      *   *Wait, let's refine:* The main philosophical distinction usually drawn is about the *source* of the action.
      *   **Locke:** The man stays. He is not *free* to leave, but his staying is *voluntary*. Locke uses this to define "liberty" as a power to act or forbear. He concludes the man is not at liberty (because he can't leave), but his action is voluntary. He doesn't explicitly jump to "Therefore, he is morally responsible for staying."
      *   **Frankfurt:** Jones shoots. He is responsible. The point is to sever the link between *Responsibility* and *Alternative Possibilities*.
      *   **Why Frankfurt is the "Big Deal":**
          1.  **Target:** Frankfurt targets the *Principle of Alternative Possibilities (PAP)* regarding *Moral Responsibility* specifically. Locke targets the definition of *Liberty/Freedom*.
          2.  **Counterfactual Interveners:** Frankfurt introduces the *mechanism* of the counterfactual intervener (Black/Chip). This allows for a specific debate about "flickers of freedom" and the *actual sequence* vs. *alternative sequences*. Locke's case is a simple physical constraint.
          3.  **The "Could Have Done Otherwise" Nuance:** In Locke's case, the man literally cannot leave. In Frankfurt's case, the intuition is that Jones is the *source* of the action in the actual sequence, whereas in Locke's, the lock is the reason he *can't* leave, but his will is the reason he *stays*. Actually, both are similar there.
          4.  **Historical Context:** Compatibilism vs. Incompatibilism. Frankfurt was attacking a specific mid-20th-century consensus (often associated with Strawson or others) that PAP was the bedrock of responsibility. Locke was writing before the modern Free Will/Determinism debate fully crystallized in its current analytic form.

