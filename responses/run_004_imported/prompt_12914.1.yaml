      *   **The "A Priori" Defense:** How to keep it *a priori*? Focus on the nature of finite rational beings. We aren't gods. We have needs. To will a world where needs are ignored is to will against our own nature.
      *   **Concede the Difficulty:** Be honest. Many scholars think Kant *does* slip here. It's a known tension. Don't pretend it's perfectly solved if it isn't. But offer the strongest charitable reading first.
