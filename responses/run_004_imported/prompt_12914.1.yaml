  2.  **Deconstruct the Philosophical Issue:**
      *   **The Core Tension:** This is one of the most famous and enduring objections to Kant's ethics. It's often called the "Free Rider" problem or the problem of "Prudential Rationality vs. Moral Rationality."
      *   **Kant's Distinction:** Kant distinguishes between *Contradiction in Conception* (CC) and *Contradiction in the Will* (CW).
          *   CC (Perfect Duties): The maxim becomes impossible in a world where everyone does it (e.g., false promises destroy the institution of promising).
          *   CW (Imperfect Duties): The maxim is conceivable, but a rational agent *cannot will it* without contradicting their own nature as a rational being who has ends.
      *   **The User's Objection:** The reasoning for CW looks like: "I want X (help), so I must will Y (helping others) to get X." This looks hypothetical ("If I want help, I should help"). Kant hates hypothetical imperatives for moral duty.
      *   **The Defense (Standard Kantian Scholarship):**
          *   It's not about *my specific* future needs. It's about the *rational necessity of having ends*.
          *   A rational will necessarily wills the means to its ends.
          *   If I will a world where *no one* helps *anyone*, I am willing a world where the pursuit of *any* end (including my own) is made unnecessarily difficult or impossible when I lack capacity.
          *   It's not "I might need help" (empirical/contingent). It's "As a finite rational being, I necessarily have needs I cannot meet alone." (A priori/structural).
