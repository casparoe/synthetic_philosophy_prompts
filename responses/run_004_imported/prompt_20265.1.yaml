prompt: |-
  I spent almost 40 years as a chemist before I retired, and these days I run a little philosophy podcast out of my study with an old labmate. Next week's guest actually defends Al-Ghazali's occasionalism as basically correct, not just a neat medieval curiousity -- she thinks fire doesn't really burn cotton, God does, every single time -- so can you draft me 7 or 8 interview questions that don't just let her restate that? I want one that pins down which of Ghazali's own two options in the Tahafut she actually holds (strict occasionalism, where God re-does the burning at every instant, vs. the version where God just built a suspendable disposition into the cotton itself), one built around Averroes' old complaint that denying real causal connections wrecks the possibility of genuine knowledge of nature and how a modern occasionalist gets around that without giving up on science entirely, one that makes her actually distinguish her view from Hume's constant-conjunction story since people online seem to flatten those two together constantly, and one on what's left of human free will and responsibility if God's doing all the causal work, mine included. For each, throw in a quick follow-up tuned to whatever dodge she's most likely to reach for.
