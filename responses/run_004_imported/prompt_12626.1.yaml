answer: |-
  **Clara (CDT):** Look, the coin is on the table. It's tails. Omega isn't holding the $10,000; that money existed only in a branch of reality that didn't happen. If I hand over $100, I am causally guaranteeing a loss of $100. There is no mechanism by which my action now puts money in my pocket. Why would I burn cash for a ghost?

  **Uma (UDT):** Because you aren't just deciding for this moment; you're deciding for the algorithm that generated you. Omega didn't predict what you'd do *after* seeing tails. Omega predicted what you'd do *before* the flip. If your decision procedure outputs "pay" when it sees tails, Omega puts $10,000 in the heads world. If it outputs "refuse," you get nothing. You're currently in the tails branch, yes, but your refusal confirms you're the type of agent who gets nothing in the heads branch.

  **Clara:** That's a motte-and-bailey switch. You're talking about *ex ante* expected value, which is fine for choosing a strategy beforehand. But I'm *ex post*. I have new information. Rationality demands I condition on all available evidence. The evidence is "Coin = Tails." Given that evidence, the $10,000 probability is zero. Paying doesn't change the prediction; the prediction is already written in stone. You're asking me to sacrifice actual utility for a counterfactual that is causally disconnected from me.

  **Uma:** It's not causally disconnected; it's logically connected. You're treating the prediction as a historical event like a rock falling. It's not. It's a computation of *you*. When you decide whether to pay, you aren't just moving matter in the tails world; you're determining the output of the function `Agent(Scenario)`. Omega ran that function with the input "Heads." You are running it with the input "Tails." If you change the output now based on the input, you break the logical consistency that allowed you to win the $10,000. You're trying to have the benefit of the precommitment without the cost.

  **Clara:** I'm not trying to have anything; I'm trying to not lose money. You keep saying "logical consistency," but logic doesn't pay rent. Causality pays rent. If I shoot a gun, a bullet flies. If I give Omega $100, I have $100 less. Where is the bullet for Omega? There isn't one. The transaction is closed. You're arguing that I should act as if I have leverage over the past because Omega is a "perfect predictor." But even if Omega is perfect, my action now doesn't travel back in time to change his mind. He's already gone.

  **Uma:** He doesn't need to change his mind. He already did the math. The math says: `If Agent(Tails) == Pay, then Reward(Heads) = $10k`. You are currently executing `Agent(Tails)`. If you execute `Refuse`, you make the antecedent false. You aren't changing the past; you're making the statement "Omega predicted I would pay" false. And since Omega is perfect, that statement *was* true only if you actually pay. You're trying to update on the coin flip, but the coin flip is irrelevant to the logical dependency between your policy and the reward.

  **Clara:** Irrelevant? The coin flip determines which world I inhabit! I don't live in the expected value; I live in the actual outcome. If I follow your logic, I should pay a blackmailer who tells me, "I predicted you'd pay, so I didn't burn the photos." If I don't pay, the photos are already burned or not. Paying doesn't un-burn them. In this mugging case, the $10,000 is already "burned." It's not there. Why should I honor a contract with a counterfactual version of myself? He got the $10,000. Let him pay the $100.

  **Uma:** Because it's the *same* contract. It's the same agent. If you say "Let counterfactual-me pay," then counterfactual-me says "Let actual-me pay." Then nobody pays, and nobody gets the $10,000. You're fragmenting yourself into different temporal slices to dodge the cost. But Omega doesn't see slices; Omega sees the whole program. If you want to be an agent that wins in this universe, you have to be an agent that honors the policy even when the specific instance feels unfair. You're willing to be the kind of agent who loses $10,000 in the heads world just to save $100 in this one? That's a terrible bet *ex ante*, and you knew it.

  **Clara:** I knew it *ex ante*, which is why I would have precommitted if I could have signed a binding contract. But I can't. I'm just a brain in a skull. My brain is wired to maximize utility given current states. To override that now requires a magical belief that my choice influences a closed causal loop. It doesn't. It just makes me a sucker in the actual world. I'd rather be a CDT agent who loses this specific game than a UDT agent who systematically throws away money whenever the causal link is severed. At least I know I'm not hallucinating leverage.

  **Uma:** You're not hallucinating leverage; you're ignoring the source of the leverage. The leverage comes from Omega's existence, not your temporal location. If you walk away, you've proven you're not the kind of agent Omega rewards. You're walking away with -$0 instead of -$100, sure. But you're walking away with the identity of a loser. In a universe full of Newcomb-like problems—and there are many, anytime prediction exists—the CDT agent is systematically exploited. You're proud of being the person who keeps their $100 but misses every $10,000 opportunity because they refuse to trust their own prior reasoning.

  **Clara:** I trust my reasoning. My reasoning says: look at the world as it is. The world is Tails. The $10,000 is a fantasy. I'm not "missing" it; it never existed for me. You're the one chasing ghosts. You're willing to lose real money to satisfy an abstract consistency constraint. I'll keep my $100, thank you. I'd rather be rich in the actual world than "optimal" in a multiverse I can't access.

  **Uma:** And I'll pay the $100. Because I'd rather be the kind of agent who gets $10,000 in the worlds where I'm lucky, and pays $100 in the worlds where I'm not. You're optimizing for the single instance. I'm optimizing for the agent. Go ahead, keep your hundred. I'll take the policy that prints money.
