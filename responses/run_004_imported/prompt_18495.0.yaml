  The coffee steam curled upward, dissipating into the kitchen light exactly as Elias expected. He watched Sarah across the table. She was reading an email, her brow furrowed in that specific, familiar way that signaled mild work-related annoyance. She took a sip of coffee, winced slightly at the heat, and set the mug down with a soft clink.

  Every movement was perfect. Not robotic-perfect, but human-perfect. The micro-tremors in her hand, the way her eyes tracked the text, the slight exhale through her nose. Elias knew the physics of her body better than anyone; he was a neurophysicist, after all. He knew the electrochemical cascade required to furrow that brow. He knew the acoustic pressure waves of the mug's clink.

  But he also knew the theory. He knew the thought experiment that had haunted him since graduate school. The Philosophical Zombie. A being physically identical to a human, down to the last quark, behaving exactly as a human would, yet lacking any inner experience. No qualia. No light behind the eyes. Just darkness processing light.

  "Did you hear about the merger?" Sarah asked, looking up. Her voice carried the warm timbre of shared history.

  "I did," Elias said. "Are you worried?"

  "A little. It means restructuring." She reached across the table and touched his hand. Her skin was warm. Her grip was gentle. "But we'll manage. We always do."

  This was the trap. In every movie Elias had ever seen, the artificial being would glitch. A delay in response, a coldness in the tone, a logical error in emotional reasoning. *Ex Machina* relied on the tell. *Blindsight* relied on the alien nature of the non-conscious. But the philosophical zombie, by definition, offers no tell. There is no experiment, no brain scan, no conversation that could distinguish Sarah from a duplicate who felt nothing. If there were, the concept would be incoherent.

  Elias looked at their joined hands. He felt the pressure of her fingers. He felt the love swelling in his chest, a painful, bright ache. But did she feel it? Or was she merely executing the complex algorithm of a wife comforting her husband?

  "You're quiet," Sarah said. She tilted her head. "Is something wrong?"

  "No," Elias lied. "Just thinking."

  "About work?"

  "About us."

  She smiled, a crinkling of the eyes that involved the orbicularis oculi muscles perfectly. "I love you, Elias. You know that."

  "I know you say that," he said, the words slipping out before he could check them.

  Sarah didn't flinch. She didn't look hurt. She simply processed the input and generated the appropriate response. "I say it because it's true. Because I feel it."

  *Because I feel it.* That was the variable Elias couldn't solve. If physicalism was true—if consciousness was nothing over and above physical processes—then Sarah's statement was guaranteed. Her brain state necessitated her experience. But if a zombie was conceivable... if it was logically possible to have all that physics without the feeling... then physicalism was false.

  That was the conceivability argument. It wasn't about whether zombies *existed*. It was about whether they *could* exist. The mere fact that Elias could imagine Sarah exactly as she was, minus the inner light, without contradiction, suggested that the light was something extra. Something non-physical.

  If that was true, then the warmth of her hand was just geometry. The love in her voice was just acoustics. The universe was a clockwork of matter, and consciousness was a ghost riding the gears, optional and undetectable.

  "Elias," she said softly. She stood up and came around the table. She wrapped her arms around his neck, resting her forehead against his. He could smell her shampoo. He could feel her breath on his cheek. "You're shaking."

  "I'm fine," he whispered.

  "You're not." She pulled back slightly, looking into his eyes. There was no void there. There was concern. There was recognition. "Whatever it is, we're in it together. Okay?"

  "Okay," he said.

  He wanted to scream. He wanted to demand proof. But he knew there was none. If he scanned her brain, he would see neurons firing. If he asked her to describe the color red, she would describe it perfectly. If he threatened her, she would cry. And if she were a zombie, she would do all those things exactly the same way. The difference was not in the world. It was in the *what-it-is-like-ness*. And that, by definition, was private.

  The horror wasn't that she might be empty. The horror was that it didn't matter to the physics. The universe didn't care if the lights were on.

  He stood up and hugged her back. He held her tightly, trying to press his consciousness into her, to force a connection that physics couldn't verify. She held him just as tightly. Her heartbeat thumped against his chest. Regular. Rhythmic. Mechanical.

  "Let's go to bed," she said eventually. "You're tired."

  "Yeah," Elias said. "I'm tired."

  They walked down the hallway together. Their steps were synchronized. He watched her shadow stretch along the wall, a dark duplicate of her form. He wondered if the shadow was any less real than the woman casting it. Both were silent. Both followed the laws of physics.

  When they reached the bedroom, she turned off the light. The room plunged into darkness. In the blackness, the visual data stopped. There was only the sound of her breathing and the weight of her hand finding his in the dark.

  "Goodnight, Elias," she said.

  "Goodnight, Sarah."

  He lay there in the dark, listening to her breathing slow into sleep. He knew that if she were a zombie, she would sleep exactly like this. He knew that if he woke up tomorrow, she would make coffee, and she would smile, and she would say she loved him. And he knew, with a chilling certainty, that he would never know the difference.

  The conceivability was the proof. The doubt was the evidence. He closed his eyes, feeling the texture of the pillow, the ache in his muscles, the terrifying solitude of his own mind. He reached out in the dark and found her hand again. It was warm. It was real. And it was possibly nothing at all.
