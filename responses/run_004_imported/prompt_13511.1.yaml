prompt: |-
  Random one from grading medieval pol phil papers today. I keep telling students that Aquinas's line on tyrannicide is basically 'never take matters into your own hands -- deposing a ruler is for the public authority, and a private citizen who kills a tyrant is just committing sedition dressed up as justice' (mostly drawing on On Kingship). But it occured to me while marking: if legitimate authority for Aquinas is grounded in ruling for the common good, doesn't his own logic undercut that blanket ban -- a tyrant who rules purely for himself has already forfeited the very authority that would make killing him 'sedition' in the first place, no? Is that an actual tension in his view, or am I oversimplifying something he's more careful about?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is grading medieval political philosophy papers (specifically on Aquinas).
      *   **Current Teaching:** They teach that Aquinas opposes private tyrannicide (drawing on *De Regno/On Kingship*), arguing that deposition is for public authority, not private individuals (who commit sedition).
      *   **The Insight/Challenge:** The user notices a potential logical tension: If authority is grounded in the common good, a tyrant (who rules for self-interest) forfeits authority. If they have no authority, isn't killing them *not* sedition?
      *   **The Question:** Is this an actual tension in Aquinas's view, or is the user oversimplifying?

  2.  **Initial Knowledge Retrieval & Verification:**
      *   *Text:* *De Regno* (On Kingship), *Summa Theologiae* (ST II-II, Q. 42, Q. 64).
      *   *Aquinas's Position on Tyrannicide:* It's nuanced. He generally discourages private action but allows for public action.
      *   *The "Forfeiture" Argument:* This sounds more like John of Salisbury (*Policraticus*) or later Monarchomachs. Aquinas is more cautious.
      *   *Sedition:* Sedition is opposed to the unity of the multitude. If the tyrant breaks the unity, is resisting him sedition? Aquinas says the tyrant is the seditious one, but resisting him privately can cause *more* disorder.
      *   *Key Distinction:* Private vs. Public authority.
      *   *Key Distinction:* Deposition vs. Assassination.

  3.  **Evaluate the Tension:**
      *   The user's intuition is sharp. It *is* a tension that later thinkers exploited.
      *   However, Aquinas prioritizes *order* and the *avoidance of greater evil*.
      *   Aquinas argues that even if the tyrant lacks moral legitimacy, the *office* retains a certain structural legitimacy to prevent anarchy.
      *   Private killing risks creating a cycle of violence or installing a worse tyrant.
      *   So, the "forfeiture" of authority doesn't automatically grant a license to *anyone* to kill. It transfers the right of judgment to the *community* or a superior authority.

  4.  **Drafting the Response - Structure:**
      *   **Validation:** Acknowledge the insight. It's a good catch, and students often spot this.
      *   **Clarify Aquinas's Text:** Distinguish between *De Regno* and *Summa Theologiae*.
      *   **Address the "Forfeiture" Logic:** Explain why Aquinas doesn't go full John of Salisbury. The focus is on *consequences* and *jurisdiction*, not just metaphysical status.
      *   **The "Public Authority" Nuance:** It's not just "never." It's "not privately." Who constitutes public authority? (The community, a superior lord).
      *   **The Sedition Point:** Clarify Aquinas's definition of sedition. The tyrant is the seditious one, but private resistance can *become* seditious if it fractures the peace further.
      *   **Conclusion:** It's not a logical contradiction in his system, but a prioritization of order over abstract justice in the absence of procedural recourse.

  5.  **Refining the Content (Self-Correction/Deep Dive):**
      *   *Wait, does Aquinas explicitly say the tyrant forfeits authority?* In *De Regno*, he says the tyrant creates a situation where there is no longer a "public" thing. But he warns against private assassination.
      *   *ST II-II, Q. 42, Art. 2:* Sedition is a mortal sin. But resisting a tyrant isn't always sedition.
      *   *ST II-II, Q. 64, Art. 3:* Killing sinners (including tyrants?) is for public authority, not private.
      *   *The Crucial Point:* Aquinas distinguishes between the *source* of authority (God/Common Good) and the *exercise* of jurisdiction. A tyrant abuses jurisdiction. But a private citizen lacks the *commission* to execute judgment.
      *   *Analogy:* A corrupt judge is still a judge until removed by the court system, not by a vigilante.
      *   *Historical Context:* Aquinas is writing in a context of instability. Anarchy is a bigger threat than bad kings.
      *   *Later Developments:* Mention that the School of Salamanca (Suárez, Vitoria) and Jesuits pushed the "forfeiture" logic further. Aquinas plants the seed but doesn't let it bloom fully.

  6.  **Finalizing the Tone:**
      *   Academic but conversational (colleague-to-colleague).
      *   Encouraging (it's a good teaching moment).
      *   Precise (cite specific questions/articles if possible).

  7.  **Constructing the Argument:**
      *   **Yes, it's a tension:** You aren't crazy.
      *   **But it's a prioritized tension:** Aquinas prioritizes the *preservation of the polity* over the *punishment of the tyrant*.
      *   **The Mechanism:** Authority isn't just a moral status; it's a functional office. Private individuals lack the *function* of execution.
      *   **The "Public" Loophole:** Aquinas leaves room for public deposition (by the people or a superior).
      *   **Teaching Tip:** Use this to show the shift from Medieval to Early Modern resistance theory.

  8.  **Review against constraints:** No specific constraints other than answering the question accurately.

  9.  **Final Polish:** Ensure the distinction between *De Regno* (incomplete, potentially edited by Ptolemy of Lucca) and *Summa* is noted, as authorship of *De Regno* Book II is sometimes disputed (though usually attributed to Aquinas in broad strokes, Ptolemy's influence is noted). *Correction:* Better to stick to the consensus view that *De Regno* I is Aquinas, II is Ptolemy, but the tyrannicide section is usually in I. Actually, the specific "private vs public" distinction is clearest in *De Regno* I.6. Let's focus on the logic rather than textual criticism unless necessary. *Decision:* Keep it focused on the philosophical logic to avoid bogging down in authorship debates, but acknowledge the texts.

      *Wait, one nuance:* In *De Regno* I.6, Aquinas says if there is a right to depose, it belongs to the *multitude* (public), not a private individual. This supports the user's teaching but also supports the user's doubt (if the multitude acts, the tyrant has lost authority).
      *Key resolution:* The tyrant loses *moral* authority but retains *de facto* position until removed *procedurally*. Private killing bypasses procedure.

