answer: |-
  You are not oversimplifying, and you have hit on one of the most fertile tensions in medieval political thought. Your students would be lucky to have this nuance unpacked for them.

  You are correct that Aquinas generally teaches that private tyrannicide is illicit (specifically in *De Regno* I.6 and *Summa Theologiae* II-II, q. 42, a. 2 & q. 64, a. 3). However, your intuition about the "forfeiture of authority" is exactly where later resistance theorists (the Monarchomachs, the Jesuits of the School of Salamanca, and eventually Locke) pick up the thread Aquinas leaves dangling.

  Here is how you can resolve the tension without throwing out your current grading rubric, while acknowledging the logical pressure point you've identified.

  ### 1. The Distinction Between Moral Legitimacy and Juridical Office
  Aquinas distinguishes between the *end* of authority (the common good) and the *exercise* of jurisdiction.
  *   **Your logic:** If the tyrant violates the end (common good), he loses the authority. Therefore, killing him is not killing a ruler.
  *   **Aquinas's counter-logic:** While the tyrant loses *moral* legitimacy, he retains the *de facto* office until removed by a competent judge. For Aquinas, the power to execute judgment (capital punishment) belongs strictly to the public authority (*Summa* II-II, q. 64, a. 3). A private citizen lacks the "commission" to judge and execute, regardless of the target's guilt.

  To Aquinas, allowing private judgment on the legitimacy of the ruler invites a greater evil: anarchy. If every citizen becomes the judge of whether the king is a tyrant, the political order dissolves into civil war. Thus, the "sedition" charge against the private tyrannicide isn't because the tyrant is protected by God, but because the *private act* disrupts the order necessary for any common good to exist.

  ### 2. The Definition of Sedition
  This is the crux of your grading point. In *ST* II-II, q. 42, a. 2, Aquinas asks whether sedition is always a mortal sin. He argues that resisting a tyrant is **not** sedition *if* it is done by public authority.
  *   **The Tyrant is the Seditious One:** Aquinas explicitly states that the tyrant is the one guilty of sedition because he fosters discord to maintain power.
  *   **The Private Resister:** However, if a private individual kills the tyrant, Aquinas worries this act *becomes* seditious in its *consequences*, even if not in its intent. It risks fracturing the multitude further (e.g., the tyrant's faction retaliates, or a worse ruler takes over).

  So, your instruction to students holds: For Aquinas, the private killer commits sedition not necessarily because the tyrant is "legitimate," but because the *method* undermines the unity of the multitude.

  ### 3. The "Public Authority" Loophole
  You are right that Aquinas's logic undercuts the *blanket* ban, but he relocates the permission rather than removing it.
  *   In *De Regno* I.6, Aquinas says that if a king becomes a tyrant, it is not for a private individual to seize the opportunity to kill him, **but it is for the public authority to depose him.**
  *   He even suggests that if there is a superior authority (like the Emperor over a king), they can judge him. If there is no superior, he hints that the *multitude* itself retains a residual right to depose the ruler if the tyranny is intolerable.

  This is where your insight shines: **If the multitude can depose him, then authority does indeed reside ultimately in the community, not the person of the king.** Aquinas stops short of saying the community can *execute* him privately, but he admits they can *remove* him publicly.

  ### 4. Why Aquinas Pulls the Punches
  Why doesn't he follow the "forfeiture" logic to its conclusion (like John of Salisbury did in the *Policraticus*, which was much more pro-tyrannicide)?
  *   **Historical Context:** Aquinas is writing in a period of intense instability. The fear of assassination plots (like the death of Peter of Castile, which happened later but reflects the vibe) was real.
  *   **Theological Prudence:** Aquinas is wary of zealotry. He fears that "tyrannicide" will become a cover for personal vendettas or factional violence. He prioritizes the *preservation of the regime* over the *justice of punishing the tyrant*.

  ### Teaching Suggestion
  You can frame this for your students as the difference between **Metaphysical Legitimacy** and **Procedural Legitimacy**.
  *   **Metaphysically:** You are right. The tyrant, by ruling for self-interest, voids the contract of the common good.
  *   **Procedurally:** Aquinas argues that voiding that contract does not grant a license to vigilantes. The "sword of justice" must remain sheathed in the public hand, even if the public hand is slow to move.

  **Verdict:** You aren't oversimplifying; you've identified the exact fracture line where Medieval political theory cracks open into Early Modern resistance theory. Aquinas plants the seed of popular sovereignty (authority is for the common good) but refuses to let it bloom into a right of revolution for individuals.

  If a student makes your argument in a paper, that's an A. It shows they understand that for Aquinas, political authority is functional, not magical—but that order is a prerequisite for function.
