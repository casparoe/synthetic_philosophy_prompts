answer: |-
  The rain needled against Elias's umbrella, a cold, wet tax on the mere idea of participation. His shoes were already damp. He stopped ten feet from the school gym entrance, the yellow sign flapping in the wind.

  *Turn back,* the cold logic whispered. *Look at the line. Look at the city.*

  He ran the numbers in his head, the same way he had for the last four cycles. One vote against three million. The odds of a tie were less than the odds of being struck by lightning while winning the lottery. Causally, his ballot was dust. It would change nothing. The cost of dry socks and an extra hour of sleep objectively outweighed the statistical zero of his impact. It was irrational to be standing here.

  He shifted his weight, ready to pivot toward the bus stop.

  But then he saw the other person under the awning, shaking out a umbrella. A woman, looking tired, checking her watch. She was hesitating too.

  Elias realized he wasn't just one agent in a vacuum. He was a node in a vast, invisible network of people who reasoned exactly like him. People who weighed costs, who doubted, who ran the same mental algorithms about efficacy and duty. They were all running the same code on different hardware.

  If he turned back now, it wasn't just Elias staying home. It was every person who thought like Elias. The ones who needed the logical bridge to cross the gap between apathy and action. If his calculation said "stay," theirs might too. The error would propagate.

  His vote wasn't a single drop; it was a signal to the cluster. It was proof that the calculation could resolve to "go."

  He wasn't breaking a tie. He was synchronizing a block.

  Elias stepped forward, pushing open the gym door. The air inside smelled of floor wax and old basketballs. He took his pen, found the booth, and filled the oval. It wasn't about the ink. It was about keeping the pattern intact.
