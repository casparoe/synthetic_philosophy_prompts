      *   *FDT/EDT thought:* But I'm not alone. There are others thinking this exact thought. If I turn back, they might too. We are running the same code.
      *   *Resolution:* Stepping forward becomes an act of synchronizing with the "others like me."

  6.  **Writing - Attempt 1 (Mental Outline):**
      Alex walks in the rain. Thinks about staying home. Calculates the odds. Realizes it's negligible. Then thinks about all the people who think like him. If he stops, they stop. It's a linked chain. He votes.

  7.  **Refining - Showing not Telling:**
