  2.  **Deconstruct the Decision Theories:**
      *   **CDT (Causal Decision Theory):** My vote causes the outcome only if I break a tie. Probability is near zero. Cost > Benefit. Don't vote.
      *   **EDT/FDT (Evidential/Functional Decision Theory):** My vote is evidence of what similar agents will do. If I vote, others like me (who reason similarly) are likely to vote. Therefore, my decision influences the *cluster* of votes, not just the single ballot. Benefit > Cost. Vote.

  3.  **Brainstorming Imagery & Metaphor:**
      *   Need to avoid terms like "CDT," "EDT," "FDT," "superrationality," "expected utility."
      *   Instead, use metaphors of mirrors, echoes, algorithms, synchronization, threads, patterns.
      *   Setting: Walking to the polls. Rain? Cold? Something that emphasizes the *cost* of voting.
      *   Character: Someone analytical, maybe a bit detached, trying to justify the effort.

  4.  **Drafting - Scene Setting:**
      *   Character: Alex.
      *   Setting: Rainy morning, walking to a school gym polling station.
      *   Conflict: The cold/rain (cost) vs. the impact (benefit).

  5.  **Drafting - Internal Monologue (The Core):**
