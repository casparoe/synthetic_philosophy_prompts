answer: |-
  This is a really profound question that touches on law, ethics, and psychology. You are wrestling with the gap between **legal liability** (who has to pay) and **moral responsibility** (who shares the blame).

  Your boss is speaking from a legal risk-management perspective. You are speaking from a moral and logical perspective. **Both of you are right, but you are talking about two different things.**

  Here is a breakdown of why this feels so unresolved, and where the truth likely lies.

  ### 1. The Legal Perspective (Why your boss says you're "fine")
  *Disclaimer: I am an AI, not an attorney. This is general information, not legal advice.*

  In most jurisdictions, liability for injuries in a commercial building comes down to **"Duty of Care."** To be sued successfully for negligence, four things usually need to be proven:
  1.  **Duty:** You had a legal obligation to keep the area safe.
  2.  **Breach:** You failed to meet that obligation.
  3.  **Causation:** Your failure directly caused the injury.
  4.  **Damages:** The person was actually hurt.

  **The Building Owner vs. The Tenants:**
  Typically, the **building owner/manager** holds the "Duty of Care" for common areas like shared stairwells, lobbies, and hallways. They are the ones who collect CAM (Common Area Maintenance) fees and hire the janitorial/maintenance staff.
  *   **The Tenants:** Unless your specific lease agreement says "Tenant is responsible for inspecting and reporting hazards in common areas," you generally do not have a legal duty to maintain the stairwell.
  *   **The Act vs. Omission:** In law, you are rarely liable for an *omission* (not doing something) unless you had a pre-existing *duty* to act. Since the light wasn't yours, and you didn't break it, your boss is legally correct that your company likely didn't create the hazard.

  **So, legally:** The lawsuit will almost certainly target the **building management/owner**, not the four companies using the stairs. Your boss is likely right that your company won't be successfully sued.

  ### 2. The Moral & Logical Perspective (Why you feel uneasy)
  Your intuition is hitting on a philosophical concept called **The Problem of Many Hands.**

  This occurs when a negative outcome happens because a large group of people all failed to act, making it difficult to pin the blame on any single individual. You are asking: *"If everyone's inaction adds up to a danger, isn't the inaction itself an action?"*

  **Ethically, yes.**
  *   **Causation by Omission:** If you see a bridge is out and you don't tell anyone, and someone drives off it, you feel responsible. You didn't break the bridge, but your silence allowed the tragedy to occur.
  *   **The Bystander Effect:** This is a psychological phenomenon where individuals are less likely to offer help to a victim when other people are present. In your office, every company thought, *"Surely the company on the 3rd floor noticed,"* or *"The building manager should know."* Everyone assumed someone else had more authority or responsibility.

  Your boss is using a legal technicality to absolve moral discomfort. He is saying, "We followed the rules of liability." You are saying, "We failed the test of basic human safety." Both statements can be true at the same time.

  ### 3. Why the Boss's Logic Feels Like a Cop-Out
  It feels like a cop-out because it ignores **foreseeability.**

  In safety management, if a hazard is obvious (a burnt-out light in a high-traffic stairwell) and it is easy to fix (a phone call), there is a **moral duty** to report it, even if there isn't a strict *legal* duty.

  By saying "We didn't do anything," your boss is defining "doing something" only as *creating* the hazard. But in a shared community (like an office building), "doing something" should also include *maintaining* the environment. When he separates your company from the building's safety, he is engaging in **moral disengagement.** He is drawing a circle around your company and saying, "Nothing outside this circle is our problem," even when the outside circle impacts people entering your office.

  ### 4. Who is actually to blame?
  If we are looking for where the responsibility actually landed:
  1.  **Primary Responsibility:** The **Building Manager/Owner.** It is their job to inspect common areas. They cannot rely on tenants to be their eyes and ears.
  2.  **Secondary Responsibility:** The **Collective Tenants.** While you might not be *liable*, the culture of the building failed. When four companies see a hazard and four companies stay silent, the "safety culture" of that building is broken.
  3.  **The Delivery Company:** Depending on the circumstances, the delivery company might also share some responsibility if their driver was rushing or not using a flashlight, though a dark stairwell is a strong counter-argument to this.

  ### 5. What should you take from this?
  You don't need to lose sleep over the lawsuit; your boss is likely right that your company won't be the one paying for it. However, your unease is a valuable signal.

  *   **Don't internalize the guilt:** You were not the building manager. You did not break the light. The legal system is designed exactly for this scenario so that tenants don't get sued for burnt-out bulbs.
  *   **Do change the behavior:** Use this as a catalyst. You can say to your boss or office manager: *"I know we aren't liable, but this is a PR nightmare and a human tragedy. Can we implement a policy where, if anyone sees a hazard in a common area, they forward it to building management immediately? It protects everyone."*
  *   **Recognize the Bystander Effect:** Now that you know how easy it is for four companies to ignore a danger, you know that *you* are the one who has to break the cycle next time. If you see something, report it. Don't assume "someone else's job."

  **Summary:** Your boss is legally pragmatic, but morally narrow. You are legally safe, but morally aware. The law says you aren't responsible; your conscience says you share a slice of the collective failure. Listen to your conscience for future actions, but trust the law regarding the current lawsuit.

  ***

  *Note: Since a serious injury occurred, if you are genuinely worried about your company's exposure, the best advice is to ensure your boss has actually notified your company's insurance carrier. They will determine liability, not you.*
