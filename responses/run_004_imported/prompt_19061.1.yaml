  I brought this up with a friend of mine who took a couple logic classes in college, and he said "that's not really what the paradox is about," but he couldn't explain exactly why, so now I'm just more confused. Is this really as big a deal for questions about AI and the limits of knowledge as it sounds like to me, or is there something I'm getting wrong about what the proof actually shows?
