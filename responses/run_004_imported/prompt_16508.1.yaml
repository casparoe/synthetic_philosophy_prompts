prompt: |-
  Kind of a niche one but ive been down a rabbit hole on Anscombe's old pamphlet 'Mr Truman's Degree' (the one she wrote protesting Oxford giving Truman an honorary degree). Her whole case that Hiroshima and Nagasaki were flat out murder rests on double effect: the dead civilians weren't foreseen collateral from hitting a military target, they *were* the means -- thats how you terrorize a government into surrendering -- so no amount of 'it saved more lives than an invasion would've cost' arithmetic gets Truman off the hook.

  Except this is basically just the classic terror-bomber vs strategic-bomber case from the double effect literature, and the standard gripe with that case is that 'intended as means' vs 'merely foreseen side effect' is suspiciously easy to fudge through redescription -- you can describe the bomb's aim as 'destroy Japan's capacity and will to keep fighting' just as easily -- foreseen civilian deaths as a mere byproduct -- which is the same exact move that lets a 'legit' strategic bombing of a munitions factory or a naval blockade count as permissible.

  Please argue that this redescription/closeness problem actually sinks Anscombe's argument on its own terms: that anyone who accepts double effect generally has no principled way to stop the Truman case being redescribed into the 'permissible' bucket, so her murder charge either has to condemn a bunch of otherwise-sanctioned WW2 bombing and blockade tactics too, or it quietly needs some extra premise beyond intention-vs-foresight thats doing the real work. try to actually stay inside her framework rather than just falling back on 'consequentialism is true anyway, so who cares'.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the User's Request:**
      *   **Topic:** G.E.M. Anscombe's pamphlet *Mr. Truman's Degree* and her application of the Doctrine of Double Effect (DDE) to the atomic bombings of Hiroshima and Nagasaki.
      *   **Anscombe's Core Claim:** Truman is guilty of murder because the death of civilians was intended as a *means* to victory (terror/coercion), not merely foreseen as a *side effect*. Therefore, consequentialist arithmetic (saving lives via avoiding invasion) is irrelevant.
      *   **User's Observation:** This mirrors the "terror bomber vs. strategic bomber" distinction in DDE literature. The standard critique is the "redescription problem" (or "closeness problem"): one can redescribe the intention of the atomic bombings to match permissible strategic bombing (e.g., "destroying war-making capacity/will" where civilian death is a side effect).
      *   **Task:** Argue that this redescription/closeness problem *sinks Anscombe's argument on its own terms*.
      *   **Constraint:** Stay *inside* her framework (DDE/Natural Law tradition). Do not resort to "consequentialism is true anyway."
      *   **Goal:** Show that without extra premises, DDE cannot distinguish Truman's case from permissible WW2 tactics (blockades, area bombing of industrial centers), forcing Anscombe into inconsistency or admitting a hidden premise.

  2.  **Deconstruct Anscombe's Position:**
      *   She relies on the distinction between *intended means* and *foreseen side effects*.
      *   For her, killing the innocent is intrinsically evil (*malum in se*).
      *   If the death is the *means*, it's intended. If it's a *side effect*, it might be permissible (under proportionality, etc.).
      *   She claims Truman intended the deaths to terrorize the Japanese government.

  3.  **Identify the Weak Point (The Redescription/Closeness Problem):**
      *   How do we determine what is "intended"? It's not just psychological; it's teleological (what is the act *described as*?).
      *   If I bomb a munitions factory, I know workers die. Anscombe says this is permissible if I intend "destroy munitions" and foresee "workers die."
      *   If I bomb Hiroshima, I know civilians die. Anscombe says this is murder because I intend "civilians die to cause surrender."
      *   *The Problem:* Why can't I describe the Hiroshima act as "destroying the city's industrial/communication capacity to cause surrender," where "civilians die" is a foreseen side effect?
      *   Hiroshima *was* a military headquarters and had industrial value. Nagasaki was a major port.
      *   If the *physical act* is dropping a bomb that destroys infrastructure and people, the description of the *intention* is flexible.

  4.  **Develop the Argument (Step-by-Step):**

      *   **Step 1: The DDE's Dependence on Act Description.**
          *   DDE doesn't work on raw physical movements; it works on *intentional actions*.
          *   Intentional actions are defined by the agent's description of what they are doing ("Why are you doing that?").
          *   Anscombe needs to prove Truman's action *must* be described as "killing civilians" rather than "destroying a military target."

      *   **Step 2: The Strategic Bombing Parallel.**
          *   Anscombe actually opposed area bombing of German cities too (she was consistent there). But many DDE proponents accept bombing factories.
          *   In a factory bombing, the explosion destroys the machine (intended) and the worker next to it (foreseen).
          *   In Hiroshima, the explosion destroys the HQ (intended) and the civilian next to it (foreseen).
          *   Where is the metaphysical difference? The scale? DDE isn't supposed to be utilitarian (numbers don't change the *kind* of act).
          *   The "Will to Fight" argument: Anscombe says targeting the *will* via terror makes the death intended. But strategic bombing also targets the *will* (morale) and capacity. If I bomb a steel mill to stop production *and* dampen morale, are the deaths intended?

      *   **Step 3: The "Closeness" or "Redescription" Challenge.**
          *   If the criterion is "Did the death contribute to the goal?", then factory worker deaths contribute (less labor). Anscombe would have to condemn all bombing of inhabited industrial zones.
          *   If the criterion is "Was the death the *mechanism* of success?", terror bombing uses death as the mechanism. But if Hiroshima is described as "decapitating command and control," the death is a side effect of the decapitation.
          *   Truman could say: "I am destroying the city's capacity to function." The deaths are inevitable, but not the *lever* pulled.
          *   Anscombe needs a rule to block this redescription. DDE alone doesn't provide it. It relies on the agent's honesty or a specific interpretation of "means."

      *   **Step 4: The Blockade Analogy.**
          *   Starvation blockades were standard WW2 tactics (even by Allies).
          *   Blockading Japan caused massive civilian starvation/death.
          *   Was this murder? The death was foreseen, but the *means* was stopping goods.
          *   But stopping goods *causes* death to pressure surrender. This is structurally identical to the atomic bomb if described as "stopping the city's function."
          *   If Anscombe condemns Truman but accepts blockades (or standard naval warfare), she needs a distinction DDE doesn't give. If she condemns blockades too, her "murder" charge loses its specific bite against Truman and becomes a general pacifist critique of total war, which requires more than just DDE (it requires a rejection of 'total war' logic that DDE usually tries to accommodate).

      *   **Step 5: The Hidden Premise.**
          *   To make the stick, Anscombe implicitly relies on a premise about *immunity* or *directness* that isn't purely about intention.
          *   Perhaps: "Killing civilians *en masse* is always intended because it's the only salient feature." But that's consequentialist (scale matters).
          *   Perhaps: "Terror is a specific psychological category." But psychological states are opaque.
          *   Conclusion: The DDE machinery jams here. To get the result "Truman = Murderer," you need a premise like "Civilian immunity trumps military necessity in this specific way" or "Area destruction is inherently intentional killing." But that's not DDE; that's a specific rule of engagement *added* to DDE.

  5.  **Refining the Tone:**
      *   Respectful of Anscombe (she's a heavyweight).
      *   Analytical, not dismissive.
      *   Strictly internal critique (immanent critique).
      *   Avoid "Consequentialism saves the day."
      *   Focus on the *metaphysics of action* (Anscombe's own specialty in *Intention*).

  6.  **Drafting the Argument (Mental Outline):**
      *   *Intro:* Acknowledge Anscombe's consistency and the power of the DDE argument. State the thesis: The "redescription problem" renders the distinction between Truman and a 'legitimate' strategic bomber metaphysically unstable within DDE.
      *   *Point 1: The Description of the Act.* DDE hinges on *under what description* the act is intended. Truman can describe it as "destroying a military headquarters city."
      *   *Point 2: The Mechanism of Coercion.* Anscombe says death was the *means* of coercion. But in strategic bombing, economic collapse (causing death) is also the means of coercion. The line blurs.
      *   *Point 3: The Blockade Comparison.* Blockades kill civilians to coerce surrender. DDE usually permits this (foreseen). If Hiroshima is different, why? If not, DDE condemns standard naval warfare too.
      *   *Point 4: The Need for Extra Premises.* To stop the redescription, Anscombe needs a rule like "You cannot target cities." But that's not DDE; that's a specific prohibition. DDE is too flexible to do the heavy lifting alone.
      *   *Conclusion:* Anscombe's argument works rhetorically but fails technically within DDE unless she smuggles in a non-DDE premise about the nature of 'city destruction.'

  7.  **Self-Correction/Nuance Check:**
      *   *Did Anscombe accept factory bombing?* She was very strict. She opposed the bombing of Hamburg/Dresden vehemently. She might actually be willing to bite the bullet and condemn *all* area bombing.
      *   *Counter:* Even if she condemns all area bombing, the *atomic* bomb is distinct because it's a single weapon vs. a raid. Does that matter? No, DDE doesn't care about delivery method.
      *   *Key distinction:* The "Terror" aspect. Anscombe argues the *point* was the psychological impact of the carnage.
      *   *Rebuttal:* But how do we prove that psychologically vs. "destroying the infrastructure that houses the people"? The physical outcome is the same. The "Closeness Problem" (Quinn, Foot, etc.) suggests that when the bad effect is so closely causally linked to the good effect, the distinction collapses.
      *   *Focus:* Stick to the *redescription* aspect as requested. How Truman's intention can be linguistically/logically framed to fit the permissible DDE mold.

  8.  **Final Polish:** Ensure the terminology is precise (intention vs. foresight, means vs. side effect, act description). Make sure the conclusion highlights that DDE becomes indeterminate here.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "it's hard to tell." I need to argue that *within the logic of DDE*, there is no *principled* way to stop the redescription. It's not an epistemic problem (we don't know his mind); it's a conceptual problem (the concepts overlap).

  9.  **Finalizing the Argument Structure:**
      1.  **The DDE hinge:** Act description determines moral species.
      2.  **The Redescription:** Truman's act can be described as "destroying military capacity" just like a factory raid.
      3.  **The Coercion Link:** Anscombe claims death *is* the coercion. But starvation (blockade) also uses death-threat as coercion. DDE permits blockade.
      4.  **The Indeterminacy:** Without an external rule (e.g., "cities are immune"), DDE cannot distinguish the cases.
      5.  **Conclusion:** Anscombe's verdict relies on a hidden premise, not DDE alone.

