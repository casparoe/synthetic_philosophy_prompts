answer: |-
  This is a sharp observation. You have put your finger on the exact metaphysical friction point that has plagued the Doctrine of Double Effect (DDE) since its modern revival. Anscombe's *Mr. Truman's Degree* is a rhetorically powerful piece of moral polemic, but when you subject it to the rigorous analytic scrutiny she herself applied to action theory in *Intention*, the argument begins to fray.

  To argue that the redescription problem sinks her case on its own terms, we have to show that the DDE machinery lacks the resolution to distinguish Truman's act from acts DDE proponents typically deem permissible (like strategic bombing of industrial nodes or naval blockades). If the DDE cannot metaphysically distinguish the "intended means" from the "foreseen side effect" in this specific case without smuggling in external premises, then the charge of "murder" is not a product of the DDE, but of a hidden intuition that the DDE is merely dressing up.

  Here is the argument that the redescription/closeness problem renders Anscombe's application of DDE indeterminate in the Truman case.

  ### 1. The Dependence on Act Description
  Anscombe's own philosophy of action teaches us that "intention" is not a hidden mental ghost accompanying a physical movement; it is found in the description under which the action is intentional. An action is only intentional *under a description*. Therefore, the moral species of the act (murder vs. permissible warfare) depends entirely on which description is the *true* description of what the agent is doing.

  Anscombe insists the true description is: "Killing civilians to terrorize the government."
  Truman (and a DDE defender) could offer the description: "Destroying a military headquarters and industrial center to eliminate command capacity, foreseeing civilian casualties."

  The DDE itself provides no internal metric for adjudicating between these two descriptions. It relies on the agent's honesty or a "reasonable person" standard. But in the case of a city-sized target like Hiroshima, which housed the Second General Army Headquarters and was a key logistical node, the "military target" description is factually grounded, not just a pretext.

  If the DDE permits bombing a munitions factory knowing workers will die (because the *intention* is "destroy munitions"), it must permit bombing a city containing military HQs knowing civilians will die (because the *intention* is "destroy HQs"). To say otherwise requires a principle that says "cities are not munitions factories," which is a rule of engagement, not a principle of double effect. The DDE analyzes the *structure of intention*, not the *classification of targets*. If the structure is identical (explode bomb -> destroy target + kill people), the redescription holds.

  ### 2. The "Mechanism of Coercion" Problem
  Anscombe's strongest move is to claim that in terror bombing, the deaths are not just a side effect, but the *mechanism* by which surrender is achieved. The government surrenders *because* the civilians are dead. Therefore, the deaths are intended as a means.

  However, this collapses when compared to other DDE-sanctioned warfare tactics, specifically **naval blockades**.
  During WWII, the Allied blockade of Japan and Germany was intended to coerce surrender by strangling the war economy. It was fully foreseen that this would cause mass civilian starvation and death. In fact, the *pressure* on the government to surrender comes precisely from the suffering and death of the populace (which threatens revolution or collapse).

  If we apply Anscombe's logic to the blockade:
  *   **Goal:** Surrender.
  *   **Means:** Strangle supply lines.
  *   **Effect:** Civilians starve and die.
  *   **Mechanism of Coercion:** The government surrenders because the civilian population is dying/starving.

  If the "mechanism of coercion" test makes Truman a murderer, it makes the architects of the blockade murderers too. Most DDE proponents (including traditional Just War theorists) have historically permitted blockades, classifying the civilian starvation as a foreseen, albeit tragic, side effect of the intended act "stopping goods."

  If Anscombe accepts the blockade as permissible, she must explain why the atomic bomb is metaphysically different regarding intention. Both use the *threat of civilian destruction/death* to leverage government capitulation. If she condemns the blockade too, she is no longer arguing from DDE alone; she is arguing for a near-pacifist rejection of total war economics that goes far beyond the intention/foresight distinction. The DDE is supposed to allow *some* collateral damage in pursuit of a just end; if the "coercive pressure" generated by that damage counts as "intending the damage," then DDE permits almost nothing in modern war.

  ### 3. The Closeness Problem and Causal Inseparability
  The philosophical "closeness problem" (articulated later by philosophers like Philippa Foot and Warren Quinn, but latent in Anscombe's time) notes that when a bad effect is causally inseparable from the good effect, distinguishing them as "means" vs. "side effect" becomes arbitrary.

  In Hiroshima, the blast wave destroys the military HQ *by* destroying the city around it. You cannot destroy the HQ without destroying the civilians.
  In a factory raid, the blast wave destroys the machines *by* destroying the building the workers are in.

  Anscombe wants to say that in the factory case, the worker's death is causally downstream from the machine's destruction (or parallel to it), whereas in Hiroshima, the civilian death is upstream of the surrender (it causes the surrender).

  But consider the "Strategic Bomber" who bombs a rail yard to stop troop movements.
  *   **Intention:** Stop troops.
  *   **Means:** Destroy rails.
  *   **Side Effect:** Civilians near rails die.
  *   **Coercive Element:** The enemy surrenders because their logistics (and morale) are broken.

  If the enemy surrenders because their logistics are broken, and the logistics are broken *because* the infrastructure (and the people running it) are destroyed, the civilian death is functionally part of the coercive lever. To claim Truman is different requires drawing a line between "breaking the will via infrastructure destruction" and "breaking the will via population destruction."

  But in a "total war" context (which WWII was), the population *is* the infrastructure. The DDE lacks the conceptual tools to distinguish "destroying the people who make the war" from "destroying the war-making capacity." Any attempt to do so relies on a normative premise about *who* is immune, not a logical premise about *intention*.

  ### 4. The Hidden Premise: Immunity vs. Intention
  This leads to the fatal flaw in Anscombe's pamphlet. To make the DDE stick against Truman, she implicitly relies on a premise she does not state: **"Civilian centers are immune from direct attack."**

  If you hold that premise, then obviously dropping a bomb on a city is intending to attack an immune object, and the death is intended. But that premise is not derived from the DDE. The DDE is a formal structure for analyzing action; it does not generate content about what constitutes a legitimate target.

  *   **DDE:** "Do not intend evil."
  *   **Anscombe's Hidden Premise:** "Destroying a city with one bomb is intending evil (because cities are civilian)."
  *   **Counter:** "Destroying a factory with one bomb is intending good (because factories are military)."

  If the Hiroshima city center is 40% military/industrial (as US strategic bombing survey claimed), why does the description "destroy city" trump "destroy military capacity"?
  Anscombe assumes the description "killing civilians" is the salient one. But a DDE formalist could argue the salient description is "eliminating a command node."

  Without an independent rule of immunity (e.g., "You may never target an area where civilians > 50%"), the DDE cannot prevent the redescription. If Anscombe adds that rule, she admits that DDE isn't doing the work; the rule of immunity is. And if she adds that rule, she must apply it to the firebombing of Tokyo (which she did oppose) but also to the blockade (which is harder to oppose under DDE).

  ### 5. Conclusion: The Indeterminacy of the Charge
  Anscombe's charge that Truman is a murderer rests on the claim that his intention was *essentially* homicidal. But the redescription problem shows that "intention" is not a psychological fact we can access, but a logical description we assign.

  If we assign the description "removal of military command capacity," the civilian deaths become foreseen side effects, fitting the permissible DDE mold (assuming proportionality, which is a separate debate).
  If we assign the description "terrorizing the population," the deaths become intended means, fitting the murder mold.

  The DDE provides no internal algorithm to select the correct description when the physical act achieves both simultaneously and inseparably. Therefore, Anscombe's argument cannot rest on DDE alone. It rests on a prior moral conviction that *this specific act* falls under the description of "killing civilians."

  But if that conviction is based on the *nature of the act* (dropping a nuke on a city) rather than the *structure of the intention*, she has abandoned the formalism of DDE for a kind of act-deontology. She is effectively saying, "This act is so destructive to civilians that the intention *must* be malicious." But that is a consequentialist or probabilistic judgment (looking at the outcome to determine the intent), which violates the deontological spirit of DDE.

  Thus, on her own terms, the argument fails. Either:
  1.  **DDE is too flexible:** It allows Truman to redescribe his act as permissible strategic bombing, just like the factory raider.
  2.  **DDE is too strict:** It condemns the factory raider and the blockader too, making the "Truman is a murderer" charge unremarkable (he's just one among many murderers), and requiring a broader critique of modern warfare than DDE provides.
  3.  **The argument is circular:** It assumes Truman is a murderer to fix the description of his intention, rather than using the description of his intention to prove he is a murderer.

  To save the "murder" charge, Anscombe needs a premise about **civilian immunity** that is stronger than the intention/foresight distinction. But once she introduces that, the Doctrine of Double Effect is no longer the heavy lifter; it's just the packaging. The redescription problem shows that DDE alone cannot sustain the weight of the accusation.
