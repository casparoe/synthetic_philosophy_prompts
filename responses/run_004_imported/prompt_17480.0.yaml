answer: |-
  You have put your finger on exactly the nerve that most philosophers of art press when discussing *What Is Art?*. Your intuition is spot-on: this is widely regarded as the most vulnerable point in Tolstoy's argument, and it is absolutely a standard objection in the literature. You are not missing a hidden key that solves it; rather, you have identified the tension between Tolstoy's desire for an objective criterion and his reliance on a psychological/moral state that seems accessible only through the very effect it is meant to explain.

  However, since you are preparing for a grad seminar, it is worth fleshing out both why this is considered a flaw *and* how a charitable reading of Tolstoy might try to defend it. This will give your students a richer discussion than simply "Tolstoy was circular."

  Here is a breakdown of the problem, the potential defenses, and how you might frame it for your class.

  ### 1. The Circularity Objection (The "Diagnostic" Problem)
  As you noted, Tolstoy rejects "beauty" because it is subjective and class-bound. He proposes "infection" as an empirical, almost physiological test: does it move me? But when he introduces the three conditions (individuality, clearness, sincerity), he complicates the empiricism.

  *   **The Problem:** If I ask, "Why did this work infect me?" Tolstoy says, "Because the artist was sincere." If I ask, "How do you know the artist was sincere?" Tolstoy implies, "Because the work infected you."
  *   **The Epistemic Gap:** We do not have access to Tolstoy's psyche while he is writing *Anna Karenina*. We infer his sincerity from the text. If "sincerity" is the *cause* of infection, but infection is the only *evidence* of sincerity, the criterion loses its normative bite. It becomes a tautology: "Good art is what infects us; it infects us because it is sincere; we know it is sincere because it infects us."

  Scholars like Monroe Beardsley and George Dickie (later, in his institutional critique) have hammered on this. It turns the evaluation of art into a guess about the artist's biography rather than an analysis of the work.

  ### 2. Is There a Defense? (The "Phenomenological" and "Moral" Moves)
  To play devil's advocate for Tolstoy (which is always good for a seminar), there are two ways he might try to escape the circle.

  **A. Sincerity as Perceptible Quality (Phenomenology)**
  Tolstoy often writes as if sincerity is not a hidden mental state but a *perceptible quality of the work itself*. He treats it almost like a texture. When an artist is faking it, Tolstoy argues, there is a kind of friction, affectation, or "over-writing" that the audience senses immediately.
  *   **The Argument:** Sincerity isn't a ghost in the machine; it is the *lack of resistance* in the transmission. When the feeling flows without the obstruction of technical showmanship or social posturing, we perceive that as sincerity.
  *   **Teaching Angle:** Ask your students: "Can you hear a lie in a voice?" We often claim we can detect insincerity directly without needing a lie detector test. Tolstoy is claiming art works the same way. The "infection" is the feeling; the "sincerity" is the lack of barrier to that feeling.

  **B. Sincerity as Alignment with "Religious Consciousness"**
  This is the part of *What Is Art?* that often gets short shrung in analytic aesthetics but is crucial for Tolstoy. He isn't just talking about "being honest." He is talking about alignment with the **religious perception of the age** (for him, universal Christian brotherhood).
  *   **The Argument:** For Tolstoy, a feeling cannot be truly "sincere" if it is morally false. An artist cannot sincerely transmit a feeling of aristocratic honor in 1890, because history has moved past that moral stage. Therefore, sincerity is not purely subjective; it is tethered to an objective moral teleology.
  *   **The Escape from Circularity:** We judge sincerity not just by how much we cry, but by whether the feeling promotes human unity. If a work infects me with hatred for a specific group, Tolstoy would eventually classify that as "bad art" or "counterfeit," regardless of the intensity, because it violates the religious consciousness of the time.
  *   **The Cost:** This saves him from circularity but at the cost of making his theory deeply moralistic and historically contingent. It stops being a theory of *aesthetics* and becomes a theory of *propaganda* (in the neutral sense of propagation).

  ### 3. Scholarly Consensus
  You asked if people have flagged this before. Yes, extensively.
  *   **Analytic Aesthetics:** Mid-20th-century aestheticians (Beardsley, Dickie, Levinson) generally treat the sincerity condition as the point where Tolstoy's theory collapses into psychological speculation. Dickie, in particular, uses this to pivot toward the Institutional Theory: since we can't check the artist's soul, we check the context in which the art is presented.
  *   **Expression Theory:** Tolstoy is the grandfather of Expression Theory (later Collingwood). Collingwood tries to fix this by distinguishing "art proper" (expressing emotion to understand it) from "amusement art" (arousing emotion). Collingwood admits the difficulty of verifying expression but argues it is a distinction in the *activity*, not just the effect.
  *   **Russian Formalism:** Interestingly, the Russian Formalists (Shklovsky, etc.) reacted *against* Tolstoy precisely here. They argued that art is about *technique* and "defamiliarization," not the transmission of the artist's soul. They saw Tolstoy's sincerity requirement as a distraction from how the text actually works.

  ### 4. Suggestions for the Seminar
  Since you are teaching this next week, here are three moves you could make to turn this "soft spot" into a productive discussion:

  1.  **The "Kitsch" Test:** Ask students to consider Kitsch. A melodramatic Hallmark movie might be very "infectious" (people cry). Is it sincere? Tolstoy would likely say no, because the feeling is simulated/clichéd (violating condition 1: individuality). But how do we distinguish "individual feeling" from "clichéd feeling" without appealing to taste? This highlights the difficulty of the sincerity/individuality criteria.
  2.  **The "Forged Diary" Thought Experiment:** Imagine we find a diary entry that moves us profoundly. We classify it as great art. Then we find out it was a fiction written by a cynical novelist who felt nothing while writing it. Does it cease to be art for Tolstoy?
      *   If **Yes**: Then art status depends on a historical fact we can't perceive (supporting your circularity critique).
      *   If **No**: Then sincerity doesn't matter, and infection is all that matters (undermining his three conditions).
  3.  **Compare to Performance:** Tolstoy's theory works best for performance (music, acting) where the "presence" of the artist feels immediate. It works worst for literature, where the author is absent. Ask your students if "sincerity" functions differently in a live blues concert vs. a novel.

  ### Summary for your prep
  You are right to be nagged by this. It is the classic weak point of the text.
  *   **Verdict:** It is effectively circular *if* treated as a purely aesthetic theory.
  *   **Nuance:** It is less circular *if* treated as a moral/religious theory where "sincerity" means "alignment with moral truth," which is supposedly objective for Tolstoy.
  *   **Pedagogy:** Don't hide the flaw. Use it to show why 20th-century philosophy of art moved away from psychological/expression theories toward institutional or historical definitions.

  If you frame it as "Tolstoy tries to solve the subjectivity of taste by anchoring it in the psychology of the artist, but in doing so, creates a new epistemic problem," you will have given your students a perfect bridge to the rest of the semester (Danto, Dickie, etc.).

  Good luck with the seminar. It's a great text to teach precisely because it fails so interestingly.
