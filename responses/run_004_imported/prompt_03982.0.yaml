prompt: |-
  I am putting together a graduate seminar on formal epistemology, and this week's session pairs I. J. Good's 1967 paper, "On the Principle of Total Evidence," with some applied readings on disclosure policy. As I understand the theorem Good proves there, for a Bayesian agent facing a fixed decision problem, the expected utility of consulting a piece of cost-free evidence before acting can never be lower than the expected utility of acting without it: free information, properly used, is never harmful in expectation. This looks to me like a strikingly clean, decision-theoretic vindication of transparency norms quite generally. Mandatory disclosure requirements in finance, pre-registration of clinical trials, and "sunshine" rules for regulatory rule-making all look like straightforward instances of exactly the free-information-before-a-decision structure that Good's proof covers, so it would seem to follow that any resistance to such requirements must ultimately rest on something other than the effects of information as such — protecting incumbents, say, or paternalism about people's capacity to cope with bad news — rather than any genuine decision-theoretic cost of the disclosure itself.

  What has been nagging at me is that actual policy does not behave as though this were settled. The 2008 Genetic Information Nondiscrimination Act bars American health insurers and employers from requiring or using an applicant's genetic test results, and the British insurance industry has operated for more than two decades under a voluntary arrangement with government — originally a moratorium, since 2018 the Code on Genetic Testing and Insurance — under which insurers do not ask most applicants to disclose existing predictive genetic test results. In neither case is the restriction presented as a regrettable compromise against an otherwise desirable free flow of information; keeping the information out of the underwriting decision is treated as the whole point of the policy. Before I present Good's theorem to my students as grounding a general presumption toward maximal disclosure, I would like a precise answer: is there a genuine decision-theoretic rationale for restrictions like these, and if so, exactly which premise of Good's argument fails to carry over from the case of a single, lone decision-maker to a setting like insurance underwriting? I would rather have the precise mechanism than a gesture toward "incentives are complicated."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Graduate seminar on formal epistemology.
      *   **Topic:** Pairing I. J. Good's "On the Principle of Total Evidence" (1967) with applied readings on disclosure policy.
      *   **User's Understanding:** Good's theorem states that for a Bayesian agent, cost-free evidence always has non-negative expected utility. Therefore, transparency/disclosure norms (finance, clinical trials, regulation) seem vindicated. Resistance to disclosure must be non-epistemic (incumbent protection, paternalism).
      *   **The Puzzle:** Real-world policy often *restricts* information flow (e.g., GINA 2008, UK Code on Genetic Testing and Insurance). These aren't treated as compromises but as positive goods.
      *   **The Question:** Is there a genuine *decision-theoretic* rationale for these restrictions? Which premise of Good's argument fails when moving from a single agent to insurance underwriting?
      *   **Constraint:** Wants a "precise mechanism," not just "incentives are complicated."

  2.  **Deconstruct Good's Theorem:**
      *   **Core Claim:** $EU(\text{act with info}) \ge EU(\text{act without info})$ given cost-free evidence.
      *   **Assumptions:**
          1.  **Single Agent:** One decision-maker maximizing their own expected utility.
          2.  **Fixed Decision Problem:** The set of acts and states is fixed.
          3.  **Cost-free:** Acquiring the evidence doesn't subtract from utility directly.
          4.  **Common Priors/Updating:** The agent updates via Conditionalization.
          5.  **No Externalities/Strategic Interaction:** The act doesn't change the state of the world in a way that feedback loops into the utility function of *other* agents who are also optimizing.
          6.  **Value of Information is Personal:** The utility function is defined over outcomes for *that* agent.

  3.  **Analyze the Insurance Case (Genetic Testing):**
      *   **Agents:** Insurer and Applicant.
      *   **Interaction:** Strategic (Game Theoretic), not just Decision Theoretic.
      *   **Information Asymmetry:** One party knows more than the other.
      *   **Goal:** Insurer wants to price risk accurately (avoid adverse selection). Applicant wants cheap coverage (especially if high risk).
      *   **Policy:** Ban on using genetic info.
      *   **Why ban it?** If insurers use it, high-risk people pay high premiums (or are denied). If they can't use it, premiums are pooled.
      *   **Decision-Theoretic Conflict:** Good's theorem applies to the *Insurer* in isolation. For the insurer, more info *is* better for pricing. So why the ban?
      *   **The Catch:** The ban isn't for the *Insurer's* benefit in a vacuum. It's for the *System's* stability or the *Applicant's* welfare, or to prevent market collapse (Adverse Selection).

  4.  **Identify the Failing Premise:**
      *   Good's theorem assumes the **decision problem is fixed** and the **utility function is static**.
      *   In insurance, information changes the **available acts** for the *other* party (the applicant).
      *   Specifically, it triggers **Adverse Selection** (Akerlof's "Market for Lemons").
      *   If the Insurer gets info (Good's theorem says this is good for the Insurer), the High-Risk Applicant reacts (buys more insurance or drops out if priced out).
      *   If the reaction is strong enough, the market unravels.
      *   *Crucial Point:* Good's theorem is about *individual* rationality in a *static* environment. Insurance is a *multi-agent* environment with *endogenous* states (the pool composition changes based on the information policy).
      *   *Another Angle:* **Privacy as a Public Good.** The value of the information isn't just about accuracy; it's about the *incentive to generate* the information. If testing leads to uninsurability, people won't test. If people don't test, medical progress stalls. This is a dynamic incentive effect.
      *   *Another Angle:* **Ex-Ante vs. Ex-Post.** Good's theorem is usually ex-post or ex-ante for the *agent*. But policy is often about ex-ante welfare behind a veil of ignorance.

  5.  **Synthesize the "Precise Mechanism":**
      *   The core failure is the move from **Single-Agent Decision Theory** to **Multi-Agent Game Theory/Market Equilibrium**.
      *   Good's theorem holds for the Insurer *ceteris paribus*. But *ceteris paribus* does not hold.
      *   **Mechanism 1: Adverse Selection (Market Unraveling).** Information allows segmentation. Segmentation drives high-risk premiums up. High-risk individuals drop out. Pool shrinks. Average risk rises. Premiums rise further. Market collapses. Total social utility drops, even if Insurer's local utility (profit per policy) might initially rise.
      *   **Mechanism 2: Ex-Ante Welfare (Veil of Ignorance).** Good's theorem evaluates value of info for an agent with a *current* prior. Policy is often evaluated from an *ex-ante* position (before knowing your risk type). From behind the veil, risk pooling (ignoring info) maximizes expected utility for risk-averse agents. Using info destroys insurance (which is about pooling independent risks).
      *   **Mechanism 3: Instrumental Value of Ignorance (Incentives).** If knowing $X$ causes harm $Y$, agents may avoid learning $X$. If learning $X$ is socially valuable (health), banning the use of $X$ in context $Z$ (insurance) preserves the incentive to learn $X$. This is a "value of ignorance" argument, but it relies on the *consequences* of the information use, not the information itself. Good's theorem assumes cost-free evidence. Here, the *use* of evidence imposes a cost (uninsurability) that feedbacks into the decision to acquire evidence.

  6.  **Drafting the Response:**
      *   **Acknowledge the sophistication:** Validate the user's reading of Good. It *is* a powerful theorem for single agents.
      *   **Direct Answer:** The premise that fails is the **Single-Agent/Partial Equilibrium Assumption**. Good's theorem assumes the state space and utility function are fixed and independent of the information acquisition policy. In insurance, information changes the *strategic landscape* and the *availability of insurance itself*.
      *   **Elaborate on Mechanism 1: Adverse Selection/Market Unraveling.** Explain how information leads to segmentation, which destroys risk pooling. Insurance *requires* ignorance of specific risk to function as insurance (vs. pre-paid maintenance).
      *   **Elaborate on Mechanism 2: Ex-Ante vs. Ex-Post Utility.** Good's theorem is about maximizing utility given current beliefs. Policy is often about maximizing utility *before* types are known. Risk-averse agents prefer pooling (ignoring info) ex-ante.
      *   **Elaborate on Mechanism 3: The Cost of Evidence isn't Zero.** Good assumes cost-free evidence. In the genetic case, the "cost" isn't the test price, it's the *consequence* of the test result becoming known to a third party who can harm you. This makes the evidence "costly" in a decision-theoretic sense, violating Good's condition.
      *   **Refine the "Decision-Theoretic" aspect:** Ensure I don't just say "economics." Frame it in terms of utility functions and state spaces.
      *   **Key Distinction:** Good's theorem is about the *value of information for a decision*. Policy restrictions are about the *value of information for a system* or the *disvalue of the consequences of information possession*.
      *   **Specific Reference:** Mention Hirschleifer (1971) "The Private and Social Value of Information and the Reward to Inventive Activity." This is the classic paper showing information can have negative social value by destroying risk-sharing opportunities. This is exactly what the user needs.

  7.  **Review and Refine:**
      *   *Check:* Did I answer "which premise fails"? Yes, the assumption that the utility of outcomes is independent of the information distribution among agents (no externalities/strategic interaction).
      *   *Check:* Is it precise? Yes, focusing on risk-sharing and Hirschleifer's effect.
      *   *Check:* Is it suitable for a grad seminar? Yes, needs to be rigorous.
      *   *Self-Correction:* Make sure not to conflate "cost of acquiring" with "cost of possession." Good's theorem allows cost of acquisition. It assumes the *use* of info is beneficial. The counter-argument is that the *use* of info changes the available contracts (risk pooling disappears).
      *   *Refinement:* The most precise decision-theoretic failure is that **Information can destroy the very goods (risk pools) that generate utility.** Good assumes the acts available are fixed. In insurance, the act "buy insurance at pooled rate" ceases to exist if information is disclosed.

  8.  **Final Polish:** Structure the answer clearly:
      1.  Validate Good's Theorem application.
      2.  Identify the specific failing premise (Single Agent / Fixed Act Set).
      3.  Introduce the Hirschleifer Effect (Information destroys risk-sharing).
      4.  Explain the Ex-Ante/Ex-Post distinction.
      5.  Discuss the "Cost of Evidence" re-interpretation (anticipatory utility/stigma).
      6.  Conclusion for the seminar.

