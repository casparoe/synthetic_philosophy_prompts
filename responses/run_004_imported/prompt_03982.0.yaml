answer: |-
  You have identified a genuine and profound tension between single-agent decision theory and multi-agent institutional design. Your reading of I. J. Good is correct: for a lone Bayesian agent with a fixed utility function and a fixed set of available acts, cost-free evidence always has non-negative expected value.

  However, the policy restrictions you cite (GINA, the UK Code) are not violations of Good's theorem; they are responses to the fact that **the premises of Good's theorem do not hold in strategic, risk-sharing environments.**

  To give you the precise mechanism you need for your seminar: The premise that fails is the assumption that **the set of available acts and the utility of outcomes are independent of the information structure.** In insurance markets, information is not merely an input for a fixed decision problem; it is a parameter that determines *which decision problems exist at all*.

  Here are the three specific decision-theoretic mechanisms that justify restricting information, any of which would serve as a rigorous counterpoint to a naive application of Good's Principle of Total Evidence.

  ### 1. The Hirschleifer Effect: Information Destroys Risk-Sharing
  The most direct decision-theoretic rebuttal comes from Jack Hirshleifer's 1971 paper, *"The Private and Social Value of Information and the Reward to Inventive Activity."* Hirshleifer demonstrates that while information always has positive *private* value to the holder (consistent with Good), it can have negative *social* value.

  *   **Good's Premise:** The utility of an outcome depends only on the state of the world and the act chosen.
  *   **Insurance Reality:** The utility of an outcome depends on the *distribution* of risk across agents.

  Insurance is fundamentally a technology for converting a risky prospect into a certain one via pooling. This pooling is only possible if there is **informational symmetry regarding risk types** (i.e., everyone is treated as average risk).
  *   **With Information:** If genetic data is disclosed, the insurer segments the pool. High-risk individuals face high premiums; low-risk individuals face low premiums.
  *   **The Decision-Theoretic Cost:** For a risk-averse agent, the expected utility of a certain loss (the pooled premium) is higher than the expected utility of a risky loss (the actuarially fair premium for their specific type, plus the risk of being high-type).
  *   **The Mechanism:** Information moves agents from an *ex-ante* position (behind a veil of ignorance regarding their genetic status) to an *ex-post* position. Good's theorem evaluates information from the *ex-post* perspective of the agent holding the prior. But policy is often evaluated from the *ex-ante* perspective. From behind the veil, rational agents maximize expected utility by **committing to ignore information** to preserve the risk-pooling act. If the information is revealed, the act "purchase pooled insurance" ceases to be available. Thus, the information changes the feasible set of acts, violating Good's fixed-act assumption.

  ### 2. Market Unraveling (Akerlof/Adverse Selection)
  This is the dynamic version of the Hirshleifer effect. Good's theorem assumes a fixed decision problem. In insurance, the decision problem is endogenous to the information policy.

  *   **Good's Premise:** Acquiring evidence does not alter the state of the world or the behavior of other agents.
  *   **Insurance Reality:** Acquiring evidence alters the behavior of the counterparty (the applicant).

  If insurers are permitted to use genetic data:
  1.  High-risk individuals are priced out or denied.
  2.  The remaining pool consists of higher-average-risk individuals (those who know they are healthy or haven't tested).
  3.  Premiums rise to cover the new average.
  4.  Moderately healthy individuals drop out.
  5.  **Equilibrium:** The market can unravel to the point where no insurance is offered at all.

  In this scenario, the expected utility of the information for the *system* is negative because the information destroys the market itself. For the individual agent, the "act" of buying insurance disappears. Good's theorem compares $EU(\text{act with info})$ vs. $EU(\text{act without info})$. If "act without info" = "buy insurance" and "act with info" = "no insurance available," the theorem's condition that the act set is fixed is violated. The information has a **negative option value** on the existence of the market.

  ### 3. The Cost of Evidence is Not Zero (Anticipatory Utility)
  Good's theorem explicitly conditions on the evidence being **cost-free**. In the genetic testing context, the cost is not the price of the test, but the **disutility of possession**.

  *   **Good's Premise:** $Cost(Evidence) = 0$.
  *   **Insurance Reality:** $Cost(Evidence) > 0$ because possession triggers a penalty.

  If an agent knows that acquiring evidence $E$ will allow a third party (the insurer) to adjust their terms to the agent's detriment, then $E$ is not cost-free. It carries a **strategic cost**.
  *   Formally, let $U(A, S, I)$ be utility given Act $A$, State $S$, and Information Distribution $I$.
  *   Good assumes $U$ is independent of $I$.
  *   In insurance, $U$ is a function of $I$. If $I$ includes "Insurer knows Agent's Risk," then $U$ decreases for the Agent (via higher premiums) even if $A$ and $S$ remain constant.
  *   Therefore, the agent faces a decision problem where acquiring information has a negative expected utility component derived from the *reaction* of the other player. This is not a violation of Good's theorem; it is a satisfaction of the condition that the theorem does not apply when evidence is costly. The "cost" here is the loss of privacy, which is instrumentally valuable.

  ### Summary for Your Seminar
  You can present Good's theorem as the **Single-Agent Baseline**. It holds perfectly for a lone navigator checking a map.

  The insurance cases are **Multi-Agent Equilibrium Problems**. The precise premise that fails is **Non-Interference**: Good assumes the value of information is intrinsic to the decision accuracy. In insurance, the value of information is extrinsic to the decision accuracy because it alters the **risk-sharing topology**.

  **The precise mechanism:**
  Mandatory non-disclosure is a **pre-commitment strategy** to maintain a cooperative equilibrium (risk pooling) that yields higher *ex-ante* expected utility for all parties than the non-cooperative equilibrium (risk segmentation) that results from applying the Principle of Total Evidence.

  **Recommended Reading to pair with Good:**
  *   **Jack Hirshleifer (1971), "The Private and Social Value of Information..."** (This is the canonical economic proof that information can reduce social welfare).
  *   **George Akerlof (1970), "The Market for Lemons"** (For the unraveling mechanism).
  *   **Richard Posner (1981), "The Economics of Privacy"** (Discusses the right to conceal information as a way to prevent value-destroying discrimination).

  This framing allows you to uphold Good's theorem as mathematically sound while showing its domain of applicability is strictly limited to non-strategic, fixed-act environments.
