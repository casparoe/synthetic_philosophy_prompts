answer: |-
  This is a fantastic observation, and you have hit on a tension that philosophers of religion wrestle with quite a bit. You are right that Mother Teresa's letters provide a visceral, documented case of divine silence that feels much more potent than abstract thought experiments about hypothetical non-believers.

  However, to answer your specific question: **Technically, Mother Teresa is not the kind of case Schellenberg's argument is designed to address, though her situation does support a broader, expanded version of the hiddenness problem.**

  Here is the breakdown of why her case is distinct philosophically, why your intuition is still valuable, and how it fits into the wider debate.

  ### 1. The Technical Distinction: Belief vs. Experience
  Schellenberg's Argument from Divine Hiddenness is specifically an argument about **propositional belief**.
  *   **Schellenberg's Claim:** A perfectly loving God would ensure that any person capable of a relationship with Him, who is not actively resisting Him, would believe *that He exists*.
  *   **The Target:** The argument targets **non-belief** (atheism or agnosticism). The "evidence against God" is the existence of people who literally do not think God is there.

  **Mother Teresa's Case:**
  *   Mother Teresa never stopped believing that God existed. She never ceased praying, never left the Church, and never denied God's reality.
  *   What she lacked was **experiential presence** or **spiritual consolation**. She felt abandoned, but she did not become a "non-resistant non-believer" in the Schellenbergian sense; she was a "resistant-less believer experiencing desolation."

  **Why this matters:**
  Theistic responses to hiddenness often differ depending on whether you are talking about *belief* or *feeling*.
  *   **For Non-Belief:** It is hard for a theist to argue that God *must* remain hidden from an atheist for their own good, because you cannot have a relationship with someone you don't know exists.
  *   **For Spiritual Dryness:** Theists have a robust theological framework for this (e.g., St. John of the Cross's "Dark Night of the Soul"). They can argue that God might withdraw *feelings* of presence to mature the believer's faith, to test their will, or to allow them to identify with the suffering of the poor (solidarity). These explanations work for Mother Teresa but don't work for an atheist who literally doesn't know God is there.

  ### 2. Where You Are Right: The "Non-Resistance" Criterion
  You are absolutely correct that Mother Teresa demolishes one of the most common informal objections to hiddenness: **"The non-believer just wasn't trying hard enough."**

  Schellenberg anticipates this by defining "non-resistant," but critics often argue that *anyone* who doesn't believe must be secretly resistant (sin, pride, willful ignorance). Mother Teresa proves that **extreme devotion does not guarantee divine intimacy.**
  *   If a saint of her caliber, working 24/7 for the poor, praying constantly, and utterly devoted, could experience 50 years of silence, then the idea that "God hides only from those who aren't looking" becomes much harder to defend.
  *   Her case shows that divine silence is not necessarily correlated with human resistance. This strengthens the *intuition* behind hiddenness: silence happens even to the best of us.

  ### 3. Expanded Hiddenness Arguments
  While Schellenberg's specific argument focuses on belief, other philosophers have argued that **experiential hiddenness** is also evidence against a loving God.
  *   **The Argument:** If God is loving, He wouldn't just want us to know He exists; He would want us to *feel* loved and supported. Prolonged, agonizing feelings of abandonment (like Teresa's) are incompatible with a personal, loving parent-figure.
  *   **The Counter:** Theists often reply that feelings are unreliable and that faith is a virtue precisely when feelings are absent. They argue God loved Teresa *through* the silence, even if she couldn't feel it.

  In this expanded context, Mother Teresa is indeed a " Exhibit A." She is the strongest real-world example of **Experiential Divine Hiddenness.**

  ### 4. Why Philosophers Stick to the Abstract
  You asked why philosophers usually reach for hypothetical non-believers rather than real cases like Teresa. There are two main reasons:
  1.  **Privacy of Mental States:** With a hypothetical case, we can stipulate "This person is genuinely non-resistant." With a real person (even Teresa), a skeptic could argue, "We don't know her inner heart; maybe she had hidden pride." (Though in Teresa's case, this seems weak).
  2.  **The Belief Barrier:** As mentioned above, if the person believes, the logical force of Schellenberg's argument dissolves. Schellenberg needs a person who *cannot* believe despite trying. Teresa *did* believe. To use her for Schellenberg's argument, you would have to argue that her belief was somehow deficient because it lacked experiential backing, which is a theological claim, not just a philosophical one.

  ### Conclusion
  You aren't missing something about the argument; you are noticing its limitations.

  *   **Is she a Schellenberg case?** No, strictly speaking. She was a believer, and Schellenberg's argument relies on the existence of reasonable *non-believers*.
  *   **Is her case evidence against a loving God?** Many philosophers would say **yes**, but it supports a slightly different argument: The Argument from **Spiritual Abandonment**.
  *   **Is it stronger than the thought experiments?** Existentially and rhetorically, **yes**. It grounds the problem in documented reality rather than hypotheticals. It shows that divine silence is not a function of human failure.

  For your class, a great nuance to bring up would be this: **Mother Teresa's letters show that the "non-resistance" condition is possible (she was non-resistant), but they also show that belief can persist without experience.** This forces the debate to shift from "Why don't they believe?" to "Why does God allow believers to feel abandoned?" which is a harder problem for theists to solve, but logically distinct from Schellenberg's original formulation.
