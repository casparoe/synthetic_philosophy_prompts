      *   **Perdurantism vs. Endurantism:** Define them clearly. Perdurantism = objects extend through time like space (worm view). Endurantism = objects are wholly present at each moment.
      *   **The Physics Connection:** Special Relativity (SR) favors the "Block Universe." SR makes simultaneity relative. This creates tension for Endurantism (how can I be *wholly* present at $t_1$ and $t_2$ if $t_1$ and $t_2$ are frame-dependent?). However, saying Endurantism is *refuted* is too strong. It's *dispreferred* by some, but not dead.
      *   **Personal Identity:** This is the crux. Perdurantism applies to *objects*. Does it apply to *persons* in a way that breaks moral responsibility?
          *   *The "Person-Stage" View:* David Lewis and others argue persons are space-time worms.
          *   *Responsibility:* How does a later stage hold an earlier stage responsible? Through psychological connectedness/continuity (Parfit style, though Parfit is reductionist, not strictly perdurantist in the Lewis sense).
          *   *The "That wasn't me" defense:* In perdurantism, the 17-year-old stage and the 80-year-old stage are *parts* of the same whole. Saying "that wasn't me" is false. It *was* a part of the same space-time worm. The correct perdurantist line is "That was an earlier temporal part of me."
