      *   **Core Question:** Are Gott's Copernican Principle method and the Carter-Leslie/Bostrom Doomsday Argument (DA) structurally the same or different? Why does reference class matter so much in DA but seem irrelevant in Gott's version? Is there a principled reason to prefer SSA over SIA, or is it just picking your poison (Doom vs. Presumptuous Philosopher)?
      *   **Tone:** Intellectual, respectful, peer-to-peer (scientist to scientist/philosopher), avoiding condescension, acknowledging their expertise while bridging the gap to philosophy.
