      *   **Doomsday Argument (Carter/Leslie/Bostrom - SSA):** Based on *rank* within a population of observers. "I am not special in birth order."
      *   **The Tension:** Gott's argument feels robust (Broadway shows, Berlin Wall). DA feels controversial (human extinction).
      *   **SSA vs. SIA:** SSA says "assume you are a random observer from the actual set." SIA says "weight worlds by how many observers they contain."
      *   **The Conflict:** SSA $\rightarrow$ Doom Soon. SIA $\rightarrow$ Presumptuous Philosopher (favoring huge universes).

  3.  **Address Question 1: Gott vs. DA (Structural Similarity/Difference):**
      *   *Similarity:* Both rely on "indexical uncertainty" (where am I in the sequence?). Both use a Copernican mediocrity principle.
      *   *Difference:* Gott treats the *duration* as the random variable. DA treats the *total population* as the random variable.
      *   *Crucial Distinction:* Gott's method is frequentist/empirical regarding *processes*. If you apply it to 100 Broadway shows, 50% will be past their midpoint. It validates over an ensemble of *completed* processes.
      *   *DA's Problem:* We only have *one* human history. We can't check the ensemble. The "reference class" defines the ensemble. If the class is "humans," $N$ is total humans. If "observer moments," $N$ is different.
      *   *Intuition:* Gott is about *time* within a process. DA is about *identity* within a set of souls/minds. Gott asks "When did I show up?" DA asks "Who am I?"
      *   *Verdict:* They are cousins, not twins. Gott's is about temporal sampling of events. DA is about observer sampling of worlds. The reference class matters in DA because it defines *what counts as an observer*, which changes the probability space. In Gott's case, the "process" is usually well-defined (a show, a wall). In DA, "humanity" is fuzzy.

  4.  **Address Question 2: SSA vs. SIA (Principled Grounds?):**
      *   *SSA (Self-Sampling Assumption):* "I am a random sample from the observers that *exist*."
          *   *Pros:* Handles the "Sleeping Beauty" (halfer) intuition, avoids the Presumptuous Philosopher.
          *   *Cons:* Leads to Doomsday. Implies "Adam and Eve" anomalies (psychic powers via birth order).
      *   *SIA (Self-Indication Assumption):* "I should think I am more likely to exist in a world with more observers."
          *   *Pros:* Cancels Doomsday.
          *   *Cons:* Presumptuous Philosopher (believing in infinite universe just because I exist).
      *   *The "Principled" Choice:* There isn't a consensus. It's often framed as a choice of priors.
      *   *Intuitive Frame:* It's about how you treat existence. Is existence data?
          *   SSA: Existence is a precondition. (I exist, now where am I?)
          *   SIA: Existence is evidence. (I exist, therefore a world where I exist is more likely, especially if it makes *many* mes).
      *   *The "Pick Your Poison" aspect:* Yes, largely. But some (like Bostrom later) moved toward "SSA + SIA" hybrids or specific restrictions on reference classes to mitigate extremes.
      *   *Astrophysicist Angle:* Think of it like selection effects in survey data. SSA is like correcting for Malmquist bias in a fixed sample. SIA is like saying the survey volume itself is probabilistic based on source density.

  5.  **Synthesize and Structure the Response:**
