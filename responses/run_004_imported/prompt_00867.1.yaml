      *   Reference class role? (Answer: Critical in DA because it defines the ensemble of minds, less so in Gott where time is continuous).
      *   Principled ground SSA vs SIA? (Answer: Mostly pragmatic/axiomatic, depends on how you treat existence as evidence).

