  **Justifications**

  **Move 1 (Elena): 2.** Elena correctly applies the core tenet of Neander's etiological account. On the Selected Effects (SE) view, a trait's proper function is the effect that explains its *current* presence in the population. Since UV protection no longer contributes to fitness or maintenance in the new habitat, it ceases to be the proper function, while mate attraction, which is currently maintaining the gene, becomes the proper function.

  **Move 2 (Marcus): -1.** Marcus misinterprets how etiological theories weigh historical data. SE theory does not aggregate selection pressure by duration; it identifies the specific historical episode that causally explains the existence of the *current* trait tokens. While the 190,000-year history explains the gene's *origin*, the 10,000-year history explains its *persistence*. Claiming duration dictates function contradicts the explanatory logic of the theory.

  **Move 3 (Elena): 2.** Elena correctly identifies the *reductio* in Marcus's reasoning. If historical duration outweighed current explanatory relevance, functions could never change even after selection pressures reversed, rendering the theory unable to account for exaptation or functional shift. Her appeal to "explanatory work now" accurately reflects the standard etiological defense against the "time-slice" objection.

  **Move 4 (Marcus): 0.** This move is mixed. Marcus is correct that Cummins' Causal Role (CR) theory dissolves the binary conflict by allowing multiple functions relative to different systemic capacities. However, his claim that SE theory relies on an "unprincipled" cutoff is a contentious critique rather than a settled fact; etiological theorists argue the cutoff is principled by causal explanatory relevance. He gains points for the CR analysis but loses them for mischaracterizing the SE constraint.

  **Move 5 (Elena): 2.** Elena lands the standard and decisive objection to CR theory: it lacks normativity. By labeling all contributing capacities as "functions," CR theory describes what a trait *does* but fails to distinguish proper function from mere side effect or malfunction. It therefore fails to answer the normative question ("what is it *for*?") that motivates the search for a theory of biological function in the first place.

  **Missing Considerations**

  Between them, Elena and Marcus are missing a explicit discussion on the **ambiguity of the target concept**. They are arguing as if there is a single definition of "function" to be won, when the dispute often stems from differing aims: SE theories aim to capture the *normative* sense of function (distinguishing function from malfunction), while CR theories aim to capture the *explanatory* sense used in physiological mechanisms. A more productive synthesis might acknowledge that the pigment has a *current proper function* (attraction, per Neander) and a *vestigial causal capacity* (protection, per Cummins), without forcing one theory to obliterate the insights of the other. Additionally, they overlook the possibility of **dual proper functions** if the gene's maintenance is overdetermined, though the stipulation that protection is "irrelevant to fitness" rules this out in this specific case.
