answer: |-
  **Setting:** *The graduate lounge, late evening. The whiteboard is covered in half-erased diagrams of Bradley's Regress. Two empty coffee cups sit between ELENA (Neo-Fregean) and MARCUS (Act-Theorist).*

  **Elena:** You keep circling back to the idea that Frege's solution is a "myth," Marcus. But if you discard unsaturatedness, what stops the proposition from collapsing into a mere list? If I say "Socrates is wise," and you strip away the special status of the concept *wise*, I'm left with two objects: Socrates and Wisdom. And a list of two objects doesn't assert anything. It just sits there. Bradley's point was precisely that a relation, if treated as a constituent, is just another term requiring a further relation to bind it to the terms. Frege's genius was seeing that the predicate *isn't* a term.

  **Marcus:** I grant you that a list lacks unity. But I deny that "unsaturatedness" explains how we get from the list to the unity. It labels the problem; it doesn't solve it. My worry is the one Frege himself stumbled into with the "Concept Horse." As soon as you try to theorize about the concept *wise*—as you are doing right now, treating it as a constituent with a special ontological status—you turn it into an object. You reify the gap. You say, "The concept has a hole in it." But a hole in what? If it's an entity, it's complete. If it's incomplete, it isn't an entity you can list as a constituent.

  **Elena:** That's the standard objection, but it relies on a category mistake. When I say the concept is unsaturated, I am not describing a physical object with a missing piece. I am marking a logical type distinction. In a function $f(x)$, the function is not an object that sits next to $x$. It is the rule of transformation. To demand that the function be an object *before* it takes an argument is to demand that syntax exist prior to grammar. The "Concept Horse" paradox arises only if you insist on naming the concept in a subject position without shifting categories. I can talk about the concept *wise* by referring to "the concept *wise*," acknowledging that I've shifted it into an object-role for the sake of discourse. That doesn't negate its predicative role in the proposition itself.

  **Marcus:** But that's just it, Elena. In the proposition itself, where is this "predicative role" happening? If the proposition is a mind-independent abstract object, as you Neo-Fregeans tend to hold, then the constituents must be combined *there*, in the abstract realm. If the concept is essentially unsaturated, it *needs* an object to complete it. But until it is completed, it doesn't exist as a determinate constituent. So, how do you get the combination started? It seems you need a prior unity to bring the object and the concept together so the concept can do its saturating work. You haven't halted the regress; you've just hidden the binding relation inside the metaphor of "saturation."

  **Elena:** I haven't hidden it; I've dissolved it. There is no "binding relation" because binding implies two independent things being tied together. The object and the concept are not independent in that way. The concept is essentially a mapping *onto* objects. The unity is internal to the logical form. If you accept that there are fundamentally different kinds of entities—objects and functions—then the regress doesn't start. Bradley assumes all constituents are of the same logical type, which is why he needs a further relation to glue them. I'm denying that premise.

  **Marcus:** Okay, let's grant the type distinction for a moment. Even if there are functions and objects, *we* are the ones formulating the proposition. And this is where Hanks and Soames press the advantage. The unity of the proposition isn't found in the abstract constituents; it's found in the act of predication. When I judge that Socrates is wise, I am not assembling abstract objects. I am *predicating* wisdom of Socrates. The unity is the unity of my cognitive act. It's something I *do*.

  **Elena:** And there is where you invite Bradley back in, Marcus. You think moving to the mind saves you, but it doesn't. Let's analyze this "act of predication." What are the constituents of the act? There is you, the agent. There is Socrates, the object of thought. And there is the property, wisdom, which you are attributing. Now, what binds *you* to *Socrates* and *Wisdom* in this act? If the act is a complex involving an agent and a content, we need a relation to bind the agent to the content. Is that relation part of the act? If so, what binds the relation to the agent? You haven't escaped the regress; you've just relocated it from the abstract realm to the psychology of the agent. You've traded the "Concept Horse" for the "Agent Regress."

  **Marcus:** That assumes the act is a composite entity made of agent-plus-content-plus-relation. But that's a mereological model of action, and it's wrong. An act of predication is primitive. It's not a sum of parts. When I predicate, I am not standing in a relation to a property; I am exercising a cognitive capacity *toward* an object. The unity is the unity of consciousness, which is not itself a composite that needs gluing. To ask "what binds the agent to the act" is like asking "what binds the dancer to the dance?" The dancer *is* dancing. The predication is a fundamental mode of engagement with the world, not a structure built out of smaller pieces.

  **Elena:** "Primitive" is a convenient word for "inexplicable." If the act is primitive, then false propositions become difficult. If I predicate wisdom of Socrates, and Socrates is not wise, I have performed an act. But what is the content of that act? If the content is just the act type, then the false proposition exists as a type of act. But then, what distinguishes the act of predicating wisdom of Socrates from the act of predicating wisdom of Plato? It seems you still need the constituents—Socrates and Wisdom—to individuate the act types. And if those constituents are just objects, we are back to the list problem. If they are unsaturated, you've smuggled Frege back in.

  **Marcus:** Not necessarily. The act type is individuated by the properties and objects involved, yes. But their contribution to the proposition is determined by the *role* they play in the act, not by their intrinsic ontological nature. Socrates contributes himself as the target. Wisdom contributes itself as the property to be predicated. The "proposition" is just the type of act where an agent predicates a property of an object. The unity is guaranteed because an act type is defined by its structure of performance. You can't have a "predication" without something being predicated of something. The structure is built into the definition of the act, not imposed by a magical unsaturated glue.

  **Elena:** But who defines the act? If it's a cognitive act, it seems subjective. If it's an abstract type of act, it's back in the Platonic realm. If it's the latter, we return to my original point: how does this abstract type unify its constituents without a relation? If it's the former, you risk psychologism. But let's dig deeper into your "primitive act." You say the agent isn't related to the content; the agent *enacts* the content. But for me to enact a predication, I must grasp the property and the object. That grasping is a relation. If I grasp Socrates and I grasp Wisdom, what unifies those two grasps into a single judgment? If I just grasp them side-by-side, I have a list in my mind. To judge, I must combine them. That combining is the act. But is the combining itself a further mental particular? If so, what combines the combining with the grasping?

  **Marcus:** You're insisting on parsing the act into temporal or mereological stages. "First I grasp Socrates, then I grasp Wisdom, then I combine them." That's not how cognition works. The predication is holistic. But I see your point. You want to know what makes the act *one* thing rather than a heap of mental events. Here is where I think we hit the bedrock. For me, the unity of the proposition is derivative of the unity of the agent's intentional state. The intentional state is not a composite; it's a fundamental relation to the world. If you demand an explanation for the unity of intentionality itself, I don't think there is one. It's the precondition of explanation. But look at your position, Elena. You claim unsaturatedness stops the regress. But can you *explain* unsaturatedness without using spatial metaphors that imply a need for completion?

  **Elena:** I can explain it logically. A function maps arguments to values. The function is not the value, nor the argument. It is the mapping. The "incompleteness" is just the fact that a function without an argument yields no value. There is no mystery there, mathematically. The mystery only arises if you insist that the function must be an *object* to be real.

  **Marcus:** But in the proposition, the function *is* a constituent. If the proposition is the primary bearer of truth, and the proposition contains the function, then the function is a constituent of a truth-bearer. If it is essentially incomplete, how can it be part of a completed truth-bearer? It seems you need the completion *prior* to the proposition existing, but the completion *is* the proposition. It's circular. The proposition is the saturation of the concept by the object, but the concept can only be saturated if the proposition already exists to hold them together.

  **Elena:** That's a temporal objection to a logical relation. The proposition doesn't "come into existence" when the concept is saturated. The proposition *is* the saturated entity. The concept is an abstraction *from* the proposition. We analyze the proposition into concept and object, but ontologically, the proposition is prior.

  **Marcus:** Ah! So the proposition is a primitive unity, and concepts/objects are abstractions?

  **Elena:** In a sense, yes. The thought is a whole.

  **Marcus:** Then we agree more than I thought. Because I say the act is the primitive unity, and the constituents are abstractions from the act. You say the Proposition is the primitive unity, and constituents are abstractions. The difference is that you posit a mysterious "unsaturated" entity to explain the structure of that unity, whereas I posit the agent's activity. My worry is that your "unsaturated entity" is an ontological free lunch. You get unity by fiat, by declaring one entity "hungry." I get unity by pointing to something that actually happens: predication.

  **Elena:** But your "happening" is contingent. I exist, you exist. But the proposition "Socrates is wise" is true or false regardless of whether anyone predicates it. If unity depends on your act, then before you acted, there was no unified proposition to be true. That makes truth mind-dependent.

  **Marcus:** Not mind-dependent, but act-dependent. The *type* of act exists as a possibility even if no one tokenizes it. Just as the move "Knight to F3" exists in chess even if no one plays it. The proposition is a type of cognitive act. Its truth conditions are determined by the world, not by me. But its *unity* is determined by the structure of the act type.

  **Elena:** So you ground the unity of the abstract in the structure of a possible action. I ground it in the logical type of the constituents. Here is where I think we can isolate the condition for success. For my view to work, I must show that "unsaturatedness" is not a metaphor for a need, but a rigorous logical category that prevents the regress from generating. I need to prove that a function is not a "thing" that needs a "relation" to an argument.

  **Marcus:** And for my view to work, I must show that the "act type" is not a composite of agent-plus-content. I need to prove that intentional predication is a fundamental, non-composite universal. If the act type is just a complex of agent, property, and object, Bradley wins against me too.

  **Elena:** Exactly. So the real debate isn't about concepts versus acts. It's about whether structure is *ontological* or *operational*. If structure is ontological, I need unsaturated entities. If structure is operational, you need primitive acts.

  **Marcus:** And the shared enemy is the "list" model. We both agree that a proposition isn't a bag of marbles. The question is: is the glue in the marbles (your unsaturated concepts), or is the glue in the hand that holds them (my acts)?

  **Elena:** Or, perhaps more precisely: Is the glue in the marbles, or is the "holding" not a relation at all, but a mode of being?

  **Marcus:** Right. If I can show that predication is a mode of being of the agent, not a relation between agent and world, I stop the regress. If you can show that a concept is a mode of being of an object, not a relation between concept and object, you stop the regress.

  **Elena:** Then our task for the chapter is clear. We shouldn't ask "Which theory is right?" We should ask: "Is it more plausible that logical structure inheres in abstract constituents, or that it inheres in cognitive operations?" And we must demand that neither side smuggles in a hidden relation to do the binding.

  **Marcus:** Agreed. No magical glue, whether ontological or psychological. If either of us relies on a "binding" that isn't explained by the nature of the relata or the act itself, Bradley wins.

  **Elena:** Cheers to that. Though I suspect Bradley is still laughing at us both from the absolute.

  **Marcus:** Let him laugh. At least we're no longer just listing his arguments.
