      *   **Act-Theorist (AT):** Let's call him *Marcus*. He follows Hanks/Soames. He thinks propositions are types of acts. He needs to argue that agency solves the binding problem without mysterious entities. He needs to press the "Concept Horse" point (making the unsaturated into an object kills it).

  3.  **Drafting - Section by Section:**

