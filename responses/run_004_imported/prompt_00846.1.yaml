      *   *Section 1 (The Insurgents):* Focus on Nowak's math background. They viewed IFT as a "special case." Focus on the claim that IFT restricts analysis.
      *   *Section 2 (The Establishment):* Focus on the "accounting" argument. It's a lens, not a mechanism. Focus on the sheer weight of consensus (Dawkins, Field, etc.).
      *   *Section 3 (The Verdict):* This needs to be the strongest part.
          *   Point 1: Mathematical equivalence means you can't say one is "true" and the other "false."
          *   Point 2: Utility trumps raw generality in science.
          *   Point 3: The prediction record favors IFT.
          *   *Conclusion:* The attack failed. IFT stands.

  6.  **Review against Constraints:**
      *   Did I name Nowak and Tarnita? Yes.
