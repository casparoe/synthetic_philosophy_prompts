  7.  **Final Polish:** Check tone. Ensure it sounds authoritative but accessible. Make sure the distinction between "mechanism" and "accounting method" is clear, as that's the crux of the misunderstanding. (Self-correction: Ensure I mention that Wilson moved toward group selection, which is the controversial part).

