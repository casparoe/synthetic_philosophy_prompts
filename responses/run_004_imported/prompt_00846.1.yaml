  Hey — I'm poking around for a piece revisiting that big dust-up in evolutionary biology from 2010, when E.O. Wilson and two mathematicians (Nowak and Tarnita, I think) published a Nature paper arguing that inclusive fitness / kin selection theory — the standard math since Hamilton in the 60s for why animals help their relatives — was basically unnecessary and should be dropped for ordinary natural-selection/group-level models instead. Something like 150 biologists signed an angry joint rebuttle defending kin selection, and Wilsons camp never really backed down. I've read a bunch of summaries since and still can't tell who actually had the better of it. Could you write me an essay laying out the strongest version of each side's case and then actually commit to a verdict on whether the attack on inclusive fitness theory was justified — no "both sides had good points" cop-out, I need something I can actually put in the piece.
