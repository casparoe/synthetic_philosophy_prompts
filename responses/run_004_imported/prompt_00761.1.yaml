answer: |-
  **Elias:** It comes down to the Control Principle. It's the only thing that keeps morality from being a lottery. If Driver A and Driver B both drink six beers, both decide to drive, both speed through the same intersection at 2:00 AM… their moral culpability is identical.

  **Sarah:** But one is in prison and the other is watching cartoons on his couch.

  **Elias:** Exactly. And that's the injustice. We're punishing Driver B for a gust of wind, a timing glitch, a kid stepping off a curb one second earlier. Those are external variables. If blame tracks moral worth, and moral worth resides in the will, then the outcome is irrelevant. We're treating Driver B like a monster and Driver A like a jerk, but they made the exact same choice.

  **Sarah:** They didn't make the same choice. They made the same *initial* choice. But the act of drunk driving isn't a snapshot; it's a sequence. It doesn't end when you turn the key. It ends when you stop the car.

  **Elias:** That's just semantics.

  **Sarah:** No, it's ontology. You're saying the moral act is "deciding to drive drunk." I'm saying the moral act is "driving drunk." Driver B didn't just decide; he completed the trajectory of his negligence. He turned a probability into a certainty.

  **Elias:** But he didn't *control* the certainty. That's the whole point of moral luck. If I try to kill you and the gun jams, I'm a murderer in my heart. If it fires, I'm a murderer in the eyes of the law. Why does the jamming of the gun change my soul?

  **Sarah:** Because morality isn't just about your soul, Elias. It's about the world you inhabit with other people. When Driver B hits that kid, he enters a new relationship with reality. He has to live with a death he caused. Driver A doesn't. That difference isn't just "luck" in the sense of a prize drawing. It's a fundamental difference in what they have *done*.

  **Elias:** They did the same thing! They drove recklessly.

  **Sarah:** No. One drove recklessly. The other drove recklessly *and killed a child.* You can't strip the "and killed a child" away and say the action is the same. That's like saying a punch to the face is the same action whether it breaks a nose or misses. The impact is part of the act.

  **Elias:** The impact is part of the *physics*, not the *ethics*. If we base blame on outcomes, we're admitting that morality is subject to chance. That's terrifying. It means my goodness depends on the universe cooperating. I want to be judged on what I can govern. My intentions. My risks. Driver B feels guilt, sure, but that's just survivor's guilt. It's an emotional reaction, not a moral metric.

  **Sarah:** It's not just guilt. It's what Bernard Williams called "agent-regret." It's distinct from what a bystander feels. A bystander feels sad for the kid. Driver B feels a specific, crushing weight that he *did* this. And that feeling is tracking something real.

  **Elias:** It's tracking trauma, not truth.

  **Sarah:** It's tracking the fact that his agency extended into the world and broke something irreplaceable. You want to isolate the will in a vacuum. But agency *is* the capacity to change the world. If Driver B changed the world by ending a life, and Driver A didn't, their agency operated differently.

  **Elias:** But not by their design! That's the "luck" part.

  **Sarah:** Maybe. But look at it this way: If Driver A finds out what Driver B did, does he say, "Well, we're equally guilty"? Or does he feel a sickening relief that *he* didn't cross that line?

  **Elias:** He should feel relief that the kid is alive. But morally? If he's honest, he knows he's just as dangerous.

  **Sarah:** He's just as *dangerous*, yes. But he isn't as *harmful*. And harm matters. If morality is only about the internal state of the agent, then why do we care about other people at all? We care because our actions land on them. When Driver B's action lands on a kid, the moral weight increases because the violation is complete.

  **Elias:** So you're saying the kid's body is what adds the sin?

  **Sarah:** I'm saying the violation of the kid's rights is what completes the wrong. Driver A violated the *risk* of harm. Driver B violated the *reality* of safety. Those are different moral objects.

  **Elias:** But you can't control the reality of safety! You can only control your adherence to the risk. If you punish based on outcome, you're essentially saying God exists and he's punishing Driver B for bad fortune.

  **Sarah:** I'm not talking about punishment from on high. I'm talking about the human response. We treat Driver B differently because the community has been wounded. Driver A's community is intact. Driver B's community has a hole in it. The blame isn't just a scorecard of intentions; it's a repair mechanism for the breach.

  **Elias:** That's utilitarianism. That's "we need a scapegoat to heal the tribe." It's not justice. Justice demands consistency. If you lock up Driver B for twenty years and let Driver A go with a fine, you are explicitly stating that luck determines righteousness. I can't accept a moral system where I'm a villain because a butterfly flapped its wings.

  **Sarah:** And I can't accept a moral system where I can destroy a life and say, "Well, my internal math is the same as the guy who didn't." The outcome changes the agent, Elias. Driver B is now a killer. Driver A is just a drunk. Those aren't just labels we slap on them. They're descriptions of what they've become.

  **Elias:** They became different things only because the universe handed them different cards.

  **Sarah:** Then maybe the universe is part of the moral equation. Maybe we aren't as sealed off from chance as you want us to be.

  **Elias:** If that's true, then free will is a joke.

  **Sarah:** Or maybe blame is more than just a judgment of will. Maybe it's an acknowledgment of what was lost.

  **Elias:** *[Silence for a beat]* I still think it's unfair to judge the man by the bullet's path.

  **Sarah:** And I think it's hollow to judge the shot without looking at where it landed.

  **Elias:** We're not going to agree.

  **Sarah:** No. But Driver B isn't going to sleep tonight either way.

  **Elias:** Neither should Driver A. That's the only fairness we have left.

  **Sarah:** Maybe. But only one of them has to live with the blood on the hood.
