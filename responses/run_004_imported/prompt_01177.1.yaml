answer: |-
  This is not only a legitimate worry; it is **the** central objection that Accuracy-First Epistemology (AFE) is designed to answer. If you are drafting a quals paper, grappling with this shows you are engaging with the core machinery of the view rather than just the slogan.

  You have correctly identified the tension between **verisimilitude** (getting closer to the truth) and **risk management** (avoiding massive error). If the only goal is accuracy, and 1.0 in a truth is more accurate than 0.6 in a truth, why not go for 1.0 every time?

  Here is the breakdown of why the literature doesn't collapse into "extremization," how the math solves it, and where your suspicion about "something else doing the work" actually hits a nerve that is still debated.

  ### 1. The Distinction: Actual vs. Expected Accuracy
  The short answer to your worry is that AFE does not normatively require you to maximize **actual** accuracy (which is inaccessible to you at the time of belief formation); it requires you to maximize **expected** accuracy (relative to your current credences).

  *   **Actual Accuracy:** If $P$ is true, $c(P)=1$ is indeed more accurate than $c(P)=0.6$.
  *   **Expected Accuracy:** If you assign $c(P)=0.6$, you are acknowledging a 40% chance that $P$ is false. If you bump your credence to 1.0 to chase the higher accuracy *if* $P$ is true, you expose yourself to a massive accuracy penalty *if* $P$ is false.

  Under the scoring rules used in AFE (like the Brier Score or Log Score), the penalty for being confident and wrong outweighs the bonus for being confident and right, unless your evidence warrants that confidence. Therefore, the credence that maximizes *expected* accuracy is usually the one that matches your evidence (e.g., 0.6), not the extreme one (1.0).

  ### 2. The Technical Mechanism: Strict Propriety
  The mathematical engine that prevents the "go extreme" collapse is the requirement that the inaccuracy measure be a **strictly proper scoring rule**.

  A scoring rule $\mathfrak{I}$ is strictly proper if, for any credence function $c$, the expected inaccuracy is minimized uniquely when you report $c$ itself.
  *   If you genuinely think the probability is 0.6, reporting 0.6 minimizes your expected inaccuracy.
  *   Reporting 0.9 or 1.0 increases your *expected* inaccuracy, even though it would yield a better *actual* score if the proposition turns out true.

  **For your paper:** You can argue that the "go extreme" objection assumes an **improper** scoring rule (one where the expected value is always minimized at the extremes). Joyce (1998) and Pettigrew (2016) argue that improper scoring rules are illegitimate measures of *epistemic* utility because they incentivize self-deception (i.e., they tell you to adopt a credence different from what you take to be supported by evidence).

  ### 3. Is "Accuracy" Just Along for the Ride?
  Your suspicion that *"the real normative work is being done by something other than accuracy"* is a sophisticated critique that appears in the literature (e.g., from critics like Schwitzgebel or in discussions regarding the "choice of scoring rule").

  Here is the nuance you need for your quals paper:

  **The Defense of AFE:**
  Proponents argue accuracy *is* doing the work, but only because **strict propriety is a constraint on what counts as a measure of accuracy.** They argue that a measure of accuracy that incentivizes you to lie about your confidence (by moving to extremes without evidence) is not a genuine measure of *epistemic* accuracy. It conflates accuracy with luck. Therefore, choosing a proper scoring rule isn't sneaking in a different norm; it's defining accuracy correctly.

  **The Critic's Counter (Your Worry):**
  However, critics argue that the justification for *why* we use strictly proper scoring rules often relies on pragmatic or decision-theoretic arguments (e.g., "you shouldn't accept a sure loss in a bet"). If the defense of the scoring rule relies on decision theory, then Accuracy-First Epistemology might secretly be **Decision-Theory-First**.
  *   *Reference:* This touches on the "Pragmatic Vindication" of probabilism. If Joyce needs pragmatic arguments to justify the Brier score, is the view still purely epistemic?

  ### 4. The "Opinionation" Objection
  There is a sub-debate here that is very relevant to your worry. Even with proper scoring rules, some argue AFT *still* pushes too hard toward extremization.
  *   **Log Score vs. Brier Score:** The Log Score penalizes error much more severely than the Brier Score. Depending on which scoring rule you choose, the theory might recommend being *more* or *less* extreme given the same evidence.
  *   **The Problem:** If the normative recommendation (how confident to be) changes based on which mathematical measure of "accuracy" we pick, then "accuracy" is too vague to do the normative work alone. We need a separate argument for why the Brier score is the *true* measure of accuracy rather than the Log score.
  *   *Key Paper:* Levinstein (2012), "Leitgeb and Pettigrew on Accuracy and Updating."

  ### 5. How to Frame This in Your Paper
  You can turn this worry into a strength of your paper by structuring the section like this:

  1.  **State the Worry:** The "Extremization Objection." If truth is the goal, why hedge?
  2.  **The Standard Reply:** The Actual vs. Expected Accuracy distinction mediated by Strict Propriety. (Cite Joyce 1998, Pettigrew 2016).
  3.  **The Critical Turn:** Address your suspicion. Does the requirement of Strict Propriety sneak in a norm of "honesty" or "evidence-responsiveness" that is distinct from accuracy?
      *   *Option A:* Argue that propriety is constitutive of epistemic accuracy (it filters out measures that reward luck).
      *   *Option B:* Concede that AFE relies on a normative choice of scoring rule that isn't itself derived from accuracy, suggesting a hybrid view.
  4.  **Conclusion:** The "go extreme" objection fails technically (due to propriety), but it reveals that AFE relies on a specific, contested conception of accuracy that is risk-sensitive.

  ### Summary for your drafting
  You aren't missing anything obvious. You have identified the **Risk vs. Reward** tension inherent in the view.
  *   **Why they don't say "go extreme":** Because they maximize *expected* accuracy using *proper* scoring rules.
  *   **Is your worry legit?** Yes. The choice of a proper scoring rule is a normative constraint that prevents the theory from collapsing into dogmatism. Whether that constraint is "purely epistemic" or smuggles in pragmatic norms is an open philosophical question perfect for a quals paper.

  **Key Citations to check:**
  *   Joyce, J. M. (1998). "A Nonpragmatic Vindication of Probabilism." (The foundational argument for propriety).
  *   Pettigrew, R. (2016). *Accuracy and the Laws of Credence.* (Book length treatment, specifically addresses scoring rule choice).
  *   Levinstein, B. (2012). "Leitgeb and Pettigrew on Accuracy and Updating." (Discusses how different scoring rules yield different norms).
  *   Caie, M. (2013). "Rational Probabilistic Incoherence." (Discusses cases where maximizing expected accuracy leads to weird results).

  This is a strong angle. It shows you understand the math but are critically evaluating the philosophical implications of that math.
