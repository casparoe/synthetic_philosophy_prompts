prompt: |-
  I'm a novelist who somehow ended up chairing the judging panel for a small first-novel prize -- five judges, six books on the shortlist, and a rule where everyone ranks all six and we add up the points, lowest total wins. After last year's ceremony, two judges got convinced the runner-up only lost because a judge who couldn't stand that author ranked the book dead last just to sink it, and now they want to switch to an instant-runoff style vote instead, since it 'can't be gamed.' A third judge just wants to keep doing what we've always done. I need to send the panel a short memo before we meet next Tuesday recomending what we actually do this year -- keep the points system, switch to runoff, or something else -- with reasons the others could actually argue with, and without pretending whichever system we pick will make the gaming problem go away, because I have a feeling it won't. Can you draft that memo for me?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Novelist chairing a judging panel for a small first-novel prize.
      *   **Context:** 5 judges, 6 shortlisted books. Current system: Borda count (rank all, sum points, lowest wins).
      *   **Problem:** Last year, suspicion that one judge "tanked" a book by ranking it last to ensure it lost (strategic voting).
      *   **Conflict:** Two judges want Instant Runoff Voting (IRV) claiming it "can't be gamed." One judge wants to keep the status quo.
      *   **Task:** Draft a short memo to the panel before the next meeting.
      *   **Goal:** Recommend a course of action (keep, switch, or alternative) with arguable reasons.
      *   **Constraint:** Do *not* pretend gaming will disappear (acknowledge reality).
      *   **Tone:** Professional, honest, pragmatic, slightly literary (since it's a novelist chairing), but clear.

  2.  **Evaluate the Voting Systems:**
      *   **Current System (Borda Count):** Rank 1-6, sum points.
          *   *Pros:* Considers overall consensus. A book everyone likes at #2 might beat a book half love and half hate.
          *   *Cons:* Vulnerable to "bullet voting" or tanking (ranking a rival #6 artificially).
      *   **Proposed System (Instant Runoff Voting / Alternative Vote):** Eliminate lowest first-choice votes, redistribute until majority.
          *   *Pros:* Ensures winner has majority support. Harder to tank a specific book *directly* (since you only rank #1 initially).
          *   *Cons:* Vulnerable to "push-over" strategy (ranking a weak opponent higher to eliminate a strong one). Can eliminate a broadly popular compromise candidate early if they lack passionate #1s. *Crucially:* It *can* be gamed. The claim "can't be gamed" is false (Arrow's Impossibility Theorem vibes).
      *   **Alternative (Condorcet / Pairwise):** Compare every book against every other book.
          *   *Pros:* Finds the candidate who beats everyone else head-to-head. Harder to game.
          *   *Cons:* Complex to explain/count manually.
      *   **Alternative (Modified Borda / Drop High & Low):** Drop the highest and lowest rank for each book before summing.
          *   *Pros:* Mitigates the "tanking" strategy without changing the fundamental logic. Simple to implement.
          *   *Cons:* Reduces the weight of strong opinions (both positive and negative).

  3.  **Determine the Recommendation:**
      *   The user wants to acknowledge that *no* system is immune to gaming.
      *   The two judges are wrong about IRV being ungameable.
      *   The status quo has a known vulnerability (tanking).
      *   *Best Compromise:* A Modified Borda Count (drop the high and low rank for each title). This directly addresses last year's specific grievance (one judge tanking a book) without adopting a system (IRV) that has its own weird pathologies and false promises. It keeps the spirit of the original system (consensus building) but adds a guardrail.
      *   *Alternative:* Stick with Borda but have a conversation about ethics. (Too weak).
      *   *Alternative:* Switch to IRV. (Validates the false claim that it can't be gamed).
      *   *Decision:* Recommend the Modified Borda (Olympic style scoring). It's the most honest fix for the specific complaint.

  4.  **Drafting the Memo - Section by Section:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the tension. Validate the concern about last year.
      *   **The Hard Truth:** Address the "can't be gamed" claim gently but firmly. No voting system is perfect (cite Gibbard-Satterthwaite theorem implicitly or explicitly).
      *   **Analysis of Options:**
          *   *Status Quo:* Good for consensus, bad for saboteurs.
          *   *IRV:* Good for majority, but can punish compromise candidates and *can* be strategic.
          *   *Proposed Solution:* Modified Borda (drop high/low).
      *   **Reasoning:** It mitigates the specific "tanking" issue without overhauling the process. It acknowledges human nature.
      *   **Call to Action:** Let's discuss this Tuesday.

  5.  **Refining the Tone:**
      *   Needs to sound like a novelist (clear, persuasive, nuanced) but also a chair (decisive, organized).
      *   Avoid jargon where possible, or explain it simply.
      *   Ensure the "gaming" admission is front and center.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I say IRV *can't* be gamed? *Correction:* Make sure to explicitly say it *can*.
      *   *Check:* Is the recommendation clear? *Correction:* Yes, propose the "drop the extremes" method.
      *   *Check:* Is it short? *Correction:* Keep it under 500 words if possible.
      *   *Check:* Did I address the third judge? *Correction:* Acknowledge their desire for continuity by keeping the *spirit* of the points system.

  7.  **Final Polish:** (Reviewing the drafted memo against the prompt requirements).
      *   *Requirement:* "without pretending whichever system we pick will make the gaming problem go away." -> *Included.*
      *   *Requirement:* "reasons the others could actually argue with." -> *Included (mathematical reality vs. perception).*
      *   *Requirement:* "short memo." -> *Kept concise.*

  8.  **Final Output Generation** (Proceed to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** The Judging Panel
  **FROM:** [Your Name], Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Voting Procedure for This Year's Prize

  Colleagues,

  Following last year's ceremony, there are valid concerns regarding our voting method. Specifically, the suspicion that a single judge can disproportionately influence the outcome by strategically ranking a contender last. Two of you have proposed switching to Instant Runoff Voting (IRV) on the grounds that it prevents this. One of you prefers our existing points system.

  Before we meet Tuesday, I want to be clear about what is—and isn't—possible.

  The hard truth is that no voting system is immune to strategic manipulation. This isn't cynicism; it's mathematics (specifically the Gibbard-Satterthwaite theorem). IRV is robust, but it is not ungameable. It can encourage "push-over" strategies (ranking a weak opponent higher to eliminate a strong one) and often penalizes consensus picks in favor of polarizing favorites. If we switch to IRV promising an end to gaming, we are promising something the system cannot deliver.

  However, keeping the status quo ignores the specific vulnerability we encountered: the "bullet vote" or "tanking" strategy, where a judge uses a last-place rank as a weapon rather than an honest assessment.

  **Recommendation**

  I propose we retain the ranked points system (Borda count) but modify the scoring to **drop the highest and lowest rank for each book** before tallying the total.

  **Why this works:**
  1.  **It neutralizes the tank:** If one judge ranks a book 6th solely to sink it, that score is discarded. The same applies to a judge ranking their favorite 1st regardless of merit.
  2.  **It preserves consensus:** Unlike IRV, which can eliminate a broadly liked book early because it lacks passionate #1 votes, this system still rewards books that place highly across the board.
  3.  **It honors continuity:** We keep the system we understand, simply adding a guardrail against outliers.

  This does not remove human bias. If three of us conspire to tank a book, the system will still break. But it protects us from a single outlier dictating the result.

  Please come Tuesday prepared to discuss this modification. If the panel feels strongly about IRV, we can adopt it, but let us do so with the understanding that we are trading one set of flaws for another, not solving for perfection.

  See you then.

  [Your Name]
