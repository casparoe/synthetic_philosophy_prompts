answer: |-
  Here are eight interview questions designed to probe the coherence and implications of the Taurekian view, including the four specific topics you requested. Each includes a follow-up based on the philosophical defense she is most likely to offer.

  **1. The Threshold of Scale**
  "Taurek's original paper focuses on small numbers, like saving one person versus five. But if we scale this up, does your commitment to non-aggregation hold indefinitely? If you could save one person or one million, and all other variables are equal, does the 'coin flip' view still apply, or is there a threshold where the sheer magnitude of loss forces the numbers to count?"
  *   **Follow-up:** *If she bites the bullet and says a coin flip is still fair even at one million:* "If morality can mandate a 50% chance of allowing a million preventable deaths when you could have stopped it, does that suggest your theory separates moral 'rightness' from the actual outcome of suffering in a way that makes the concept of 'helping' unintelligible?"

  **2. The Weighted Lottery Objection**
  "You argue that fairness requires giving each *group* an equal chance, effectively giving the single person a 50% chance and each of the five a 10% chance. But many critics argue that if moral claims reside in individuals, fairness requires giving each *individual* an equal chance. Why isn't the truly fair solution a weighted lottery—six tickets in a hat, five for the group, one for the stranger—rather than a 50/50 split between the clusters?"
  *   **Follow-up:** *If she argues that the five don't form a collective entity with a combined claim:* "But by treating the five as a single unit for the purpose of the coin flip, aren't you implicitly granting them a collective status anyway? If they are just five distinct individuals, why does their physical proximity allow their claims to be bundled against the one?"

  **3. Scanlon's Tie-Breaker**
  "T.M. Scanlon attempted to split the difference, arguing we don't need to aggregate welfare to save the five. He suggests we can acknowledge the one person's claim is equal to any of the five, but still save the larger group based on a principle the single person couldn't 'reasonably reject.' How do you resist the idea that this breaks the tie without resorting to the illegitimate summing of welfare you oppose?"
  *   **Follow-up:** *If she claims Scanlon is smuggling aggregation in through the back door:* "Could you pinpoint exactly where the smuggling occurs? Is it the idea that 'more people' is a valid reason for rejection, or is it the assumption that the single person has a duty to accept a principle that sacrifices them for the greater number?"

  **4. Scope Insensitivity vs. Moral Truth**
  "Listeners from the Effective Altruist community will recognize your view as the philosophical target of 'scope insensitivity' training—the idea that humans are cognitively biased to ignore large numbers. How do you distinguish your normative conclusion (that numbers *shouldn't* count) from the psychological observation that humans *struggle* to process large numbers? Isn't there a risk this is just a philosophically dressed-up version of a cognitive bug?"
  *   **Follow-up:** *If she argues that cognitive bias is irrelevant to normative truth:* "Granted, an 'is' doesn't make an 'ought.' But if the only intuition supporting non-aggregation comes from a cognitive mechanism known to fail at scale, what independent evidence do we have that this intuition is tracking moral truth rather than just mental limitation?"

  **5. The Metaphysics of Loss**
  "Your argument rests heavily on the claim that there is no 'super-losing' when five die versus one; loss is only experienced individually. But surely the world contains more grief, more orphaned children, and more economic ruin when five die. When you say the numbers don't count, are you saying these downstream effects don't matter, or that they are morally irrelevant to the immediate decision of who to save?"
  *   **Follow-up:** *If she concedes downstream effects matter but maintains the immediate choice is non-aggregative:* "If the downstream effects are morally relevant, doesn't that reintroduce aggregation through consequences? How do you cleanly separate the immediate act of saving from the predictable ripple effects of who survives?"

  **6. Institutional Triage**
  "Taurek's argument is often framed around an individual bystander making a choice. But how does this translate to institutional policy? Should a hospital triage protocol during a disaster assign equal probability to saving a ward of five patients versus a single patient in another room, or does the role of 'institution' create a duty to maximize lives saved that a private individual doesn't have?"
  *   **Follow-up:** *If she argues that institutions should also follow non-aggregation:* "If a public health agency adopted this policy and it became known that they flipped coins rather than maximizing survival rates, wouldn't that violate the public's trust that the state acts to minimize aggregate harm?"

  **7. Agent-Relative Permissions**
  "Is your view that saving the one over the five is *obligatory*, or merely *permissible*? In other words, if I save the five, have I done something wrong, or have I just exercised a supererogatory act of maximizing good that I wasn't strictly required to perform?"
  *   **Follow-up:** *If she says saving the five is permissible but not required:* "If it's permissible to save the five, on what grounds do you criticize the utilitarian for doing so? If both actions are permissible, does the debate reduce to a mere difference in personal preference rather than a conflict of moral duties?"

  **8. Obligations to the Lost**
  "Suppose I follow your advice, flip a coin, and unfortunately, the side of the five comes up losers. They die. Do I owe anything to the estates or families of the five that I wouldn't owe if I had saved them? If the decision procedure was fair, does the outcome carry any moral residue or requirement for compensation?"
  *   **Follow-up:** *If she says there is no extra moral residue because the procedure was fair:* "This implies that the fairness of the process completely washes away the tragedy of the outcome. But if we accept that, does it mean we should feel no more regret over a million deaths than one, provided the decision procedure was identical?"
