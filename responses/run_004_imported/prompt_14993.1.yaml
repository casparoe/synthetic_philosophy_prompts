      *   *Refining the "Missing" section:* Make sure to mention the "Existence Requirement" explicitly. Also, mention the distinction between *dying* and *being dead*, though they touched on it, they didn't explore the *process* vs. *state* distinction deeply enough regarding the *subject*.
