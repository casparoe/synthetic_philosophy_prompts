      *   If A decides to cooperate, B would also cooperate.
      *   Therefore, the choice isn't "I cooperate while they defect" vs "I defect while they cooperate." The choice is "We both cooperate" vs "We both defect."
      *   Since "Both Cooperate" yields a higher utility than "Both Defect," a rational agent chooses cooperation.
