prompt: |-
  Had a long back-and-forth with my friend Priya last night over drinks that's still bugging me. She's a data scientist at a fintech startup and they just shipped a model that scores loan applicants for default risk. She was pretty pleased with it because when she checked the numbers afterward, people who got, say, a 20% risk score actually defaulted about 20% of the time whether they were in Group A or Group B — so the score "means the same thing" no matter what group your in, and she kept insisting that's basically what fairness has to mean here. I pushed back because Group A still gets rejected way more often for reasons that turn out to be wrong (people who would've actually paid the loan back fine), while for Group B the mistakes mostly run the other way — people who default anyway still sail through. She said sure, but that's just because more of Group A had rockier credit histories walking in, and if she forced those error rates to match across groups the scores would stop tracking real risk and the model gets worse for basically everyone. We went in circles for like an hour, each of us sure the other's notion of "fair" was missing something obvious, and neither of us could actually explain why you can't just have both properties at once.

  I've got this nagging feeling there's something more fundamental going on than "just build a better model" — like maybe once the two groups don't start out identical on the relevant numbers, you genuinely can't have it both ways no matter how good the model is. Could you walk me through what's actually happening in a case like this? I want to know whether one of us was simply wrong, why these two ways of thinking about a "fair" score pull apart the way they did, and what you think a company in Priya's position should actually do given that it apparently can't satisfy everyone's intuition about fairness at the same time.
