      *   *Check:* Did I address the specific texts? *Correction:* Mention *De Fundamentis* (critique of rules), *Tertius* (defense of aspects), *Harmonices* (geometric basis).
      *   *Check:* Is the sympathetic reply strong enough? *Correction:* Make sure to emphasize that for Kepler, geometry *is* physics/metaphysics. The counter must show why that doesn't solve the *causal* problem.

  8.  **Final Polish:** Organize into clear sections for the user to adapt into their paper. (Introduction, The Argument, The Sympathetic Objection, The Rejoinder, Conclusion).

  *(Self-Correction Note)*: I need to make sure I don't just say "the soul is magic." I need to frame it as "the soul is a theoretical postulate that lacks the independent physical demonstration Kepler demanded of the traditionalists." The traditionalists said "Mars is hot." Kepler says "The Earth Soul perceives the Square." Both are unobserved mechanisms posited to explain correlations.

  9.  **Finalizing the Output Structure:**
      *   Title suggestion.
      *   Abstract/Thesis Statement.
      *   Argument Body (3 points).
      *   The Sympathetic Objection (Constructibility).
      *   The Rejoinder (Ontology vs. Causality).
      *   Concluding thought on Demarcation.

