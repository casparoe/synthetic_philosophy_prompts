answer: |-
  Here is a draft argument structured for a philosophy of science or history of science paper. It is designed to be inserted into your workshopping materials, adhering to your constraints regarding anachronism and textual fidelity.

  ***

  ### Title Suggestion
  **The Geometry of Belief: Internal Inconsistency in Kepler's Demarcation of Reformed Astrology**

  ### Thesis Statement
  While Johannes Kepler ostensibly distinguishes his "reformed" astrology from the "vulgar" tradition by demanding physical causality and rejecting arbitrary conventions, this demarcation is not principled. By Kepler's own epistemic standards—specifically his demand for independent physical mechanisms and his rejection of unverified correspondences—his own theoretical apparatus (the *anima terrae* and the causal efficacy of pure geometry) relies on the same dogmatic postulates he attributes to his predecessors.

  ### The Argument

  **1. The Problem of the "Physical" Mechanism**
  In *De Fundamentis Astrologiae Certioribus*, Kepler's primary critique of traditional astrology is its lack of a *causa efficiens*. He mocks the idea that a distant planet can rule a specific house or possess a "dignity" in a sign without a physical medium of transmission. He insists that astrology must be grounded in optics and physics (light rays striking the Earth).

  However, Kepler's solution merely displaces the mystery rather than resolving it. To explain *how* geometric angles translate into meteorological or temperamental effects, Kepler posits the *anima terrae* (the soul of the Earth). This faculty perceives the harmonic aspects of the planets and instinctively reacts, much like a human soul reacting to music.
  *   **The Inconsistency:** For the traditional astrologer, "Martial influence" is a postulate required to save the phenomena of war and heat. For Kepler, the "Earth Soul" is a postulate required to save the phenomena of harmonic resonance. Neither mechanism is independently observable. Kepler demands the traditionalists demonstrate *how* Saturn causes cold, yet he offers no independent evidence for the Earth's soul other than the fact that astrological correlations (presumably) exist. He violates his own demand for a demonstrated physical mechanism by substituting a metaphysical faculty (*anima*) for a physical force.

  **2. The Arbitrariness of Signification**
  Kepler argues that the traditional zodiacal signs and planetary rulerships are culturally contingent and arbitrary (e.g., why is Aries associated with the head?). He replaces these with aspects derived from regular polygons, claiming these are universal and archetypal.
  *   **The Inconsistency:** While the *angles* may be geometrically necessary, the *effects* assigned to them remain empirical assertions without deduction. Why does a square aspect (90°) induce tension or discord, while a trine (120°) induces harmony? Kepler appeals to the "knowability" of the figures, but there is no logical derivation from "constructible by compass" to "causes rain" or "inclines toward choleric temperament."
  *   Kepler accuses the ancients of asserting correspondences without proof. Yet, the link between *geometric form* and *terrestrial effect* in Kepler's system is equally asserted. He has replaced a biological/cultural convention (the signs) with a geometric convention (the aspects), but the leap from geometry to physics remains an act of faith, not demonstration.

  **3. Immunity to Disconfirmation**
  Kepler criticizes the vulgar astrologers for ignoring failed predictions or blaming them on minor technical errors while keeping the core system intact.
  *   **The Inconsistency:** In *Tertius Interveniens*, Kepler handles disconfirmation similarly. When predictions based on aspects fail, he attributes the error to the complexity of the "ray" interactions, the interference of human free will, or the impurity of the traditional data used to test them. By restricting astrology to "inclinations" rather than "compulsions" (weather and temperament rather than specific fate), he renders his theory immune to strict falsification in the same way the traditionalists did. If the Earth Soul fails to resonate, it is not because the theory is wrong, but because the "instrument" (the atmosphere/human body) is disordered. This mirrors the traditional defense that the stars incline but do not compel.

  ### The Strongest Sympathetic Reply (The Constructibility Criterion)

  A sympathetic Keplerian scholar would argue that the objection above misunderstands Kepler's ontology. For Kepler, following Proclus and Pythagoras, geometry is not merely a human convention or a descriptive tool; it is the archetypal structure of Creation existing in the mind of God prior to the physical world.
  *   **The Defense:** The traditional houses and dignities are indeed arbitrary because they depend on the accidental horizon of the observer or cultural naming conventions. In contrast, the regular polygons are *ontologically prior* to the physical universe. Therefore, the constructibility criterion is not an arbitrary filter; it is a discovery of the only configurations that possess real being. The Earth Soul does not "guess" at these influences; it resonates with them because both the Soul and the Aspects share the same ontological root (Divine Geometry). Thus, Kepler *does* provide a mechanism: the identity of form between the archetype and the perceiver.

  ### The Rejoinder

  While this defense secures the *ontological* status of the aspects, it fails to secure the *causal* demarcation Kepler claims.
  1.  **Ontology $\neq$ Causality:** Even if we grant Kepler's Neoplatonic premise that regular polygons are "more real" than zodiacal signs, it does not follow that they possess *efficient causal power* over weather. One can accept Kepler's geometry while rejecting the claim that geometry moves air masses. The traditionalists could equally claim that "Mars" is an archetypal force; Kepler rejects this not because it lacks archetypal status, but because it lacks physical contact. Yet the *anima terrae* interacts with geometry not via contact, but via "perception."
  2.  **The Gap Remains:** The constructive criterion explains *which* angles are valid, but it does not explain *why* valid angles cause effects. The traditionalist says "Mars signifies War." Kepler says "The Square signifies Discord." Both are translating a symbolic system into physical prediction. Kepler's system is more mathematically elegant, but by his own demand for "certioribus fundamentis" (more certain foundations), elegance is not causality. He has refined the *syntax* of astrology without proving the *semantics*.

  ### Conclusion for the Chapter

  Kepler's reformed astrology represents a shift in *dogma*, not in *method*. He successfully identifies the weaknesses of the Ptolemaic-Arabic tradition regarding physical mechanism and arbitrariness. However, his solution is to posit a new metaphysical entity (the Earth Soul) and a new set of unproven causal links (geometric efficacy) that are insulated from refutation in precisely the ways he criticizes. The demarcation line he draws is therefore internal to his own Neoplatonic commitments rather than principled according to the empirical and physical standards he explicitly champions. He did not solve the problem of astrological demarcation; he relocated it from the realm of tradition to the realm of harmonic metaphysics.
