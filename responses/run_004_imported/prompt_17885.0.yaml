      *   *Counterfactuals:* We allow ourselves to backtrack or undo *facts* we know to be true. We look for the closest world where the antecedent is true, even if it contradicts our current knowledge. Since we can imagine a world where Oswald didn't shoot *and* Kennedy lived (because we are undoing the fact of the death), the consequent "someone else did" doesn't follow.
