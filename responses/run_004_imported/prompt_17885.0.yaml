answer: |-
  This is a fantastic problem to have, and your housemate is right to point you toward Stalnaker. For a novelist, the unified view is vastly superior to the dual-logic view, not just because it's more elegant, but because it treats reasoning as a *continuous human capacity* rather than a switch that flips between "guessing" and "metaphysics."

  If you want to defend the logic of your book on the Stalnakerian view, here is the strongest possible case. It rests on one central claim: **The difference between indicative and counterfactual conditionals is not in the *engine* (the semantics), but in the *fuel* (the context set).**

  ### 1. The Single Engine: The Selection Function

  To make the unified case, we first have to agree on what the engine does. In the Stalnaker framework, *all* conditionals work via a **selection function**.

  When you say "If A, then B," your brain performs a specific operation:
  1.  Take the actual world (or the world as you currently understand it).
  2.  Make the minimal necessary change to make **A** true.
  3.  Check to see if **B** is true in that modified world.

  That's it. That is the single logical mechanism. It applies to "If it rains, the grass gets wet" and "If I had studied, I would have passed." The operator is invariant.

  So, why do the Oswald sentences feel different? If the engine is the same, why does one feel true and the other false?

  ### 2. The Fuel: Contextual Restriction

  The unified theory argues that the grammatical mood (indicative vs. subjunctive/counterfactual) acts as a signal to the listener about **which worlds are available to be selected.**

  This is where you defeat the Adams/Edgington objection. They say indicatives are about *credence* (epistemic) and counterfactuals are about *causality* (metaphysical). The Stalnakerian reply is: **No, both are about metaphysical worlds, but we are looking at different neighborhoods.**

  #### The Indicative Case: "If Oswald didn't kill Kennedy..."
  When speakers use the indicative mood, they are signaling that the antecedent is **compatible with their current knowledge**.
  *   **The Context Set:** We are restricting our search to worlds that match everything we *know* to be true about the actual world.
  *   **The Known Fact:** We know Kennedy died. That is fixed in our context set.
  *   **The Operation:** We look for the closest world where "Oswald didn't kill Kennedy" is true.
  *   **The Constraint:** Because we must stay within the "known facts" neighborhood, we cannot pick a world where Kennedy lives. We *must* pick a world where Kennedy dies (because that's a known fact), but Oswald didn't do it.
  *   **The Result:** In that closest world, **someone else killed him.**
  *   **Truth Value:** True.

  #### The Counterfactual Case: "If Oswald hadn't killed Kennedy..."
  When speakers use the counterfactual mood, they are signaling that the antecedent is **presupposed false** or incompatible with current knowledge. This triggers a *relaxation* of the context set.
  *   **The Context Set:** We are allowed to step outside the "known facts" neighborhood. We are explicitly allowed to undo facts we know to be true in order to test the antecedent.
  *   **The Known Fact:** We know Kennedy died, but the counterfactual mood tells us to *suspend* that fact for the sake of the argument.
  *   **The Operation:** We look for the closest world where "Oswald didn't kill Kennedy" is true.
  *   **The Constraint:** Since we are allowed to undo the death, the "minimal change" required to make "Oswald didn't shoot" true does *not* require us to add a second shooter. The minimal change is simply: Oswald doesn't shoot, Kennedy lives. Adding a conspiracy (a second shooter) is a bigger, more complex change to the fabric of reality than just letting the President survive.
  *   **The Result:** In that closest world, **Kennedy lives.**
  *   **Truth Value:** False (because the consequent "someone else did" is not true in that world).

  ### 3. Solving the "Knock-Down" Objection

  The objection is usually: *"How can the same logic yield different truth values for the same antecedent?"*

  The answer is: **Because the antecedent isn't the same.**

  In the indicative, the antecedent is "Oswald didn't kill Kennedy [and Kennedy is still dead]."
  In the counterfactual, the antecedent is "Oswald didn't kill Kennedy [and we allow history to diverge from there]."

  The grammatical mood acts as a **temporal and epistemic pointer**.
  *   **Indicatives** point *forward* from the present state of knowledge. They hold the past and present fixed.
  *   **Counterfactuals** point *backward* to a branch point. They allow the past to be rewritten to accommodate the antecedent.

  This is not "two logics." This is **one search algorithm with a variable search radius.** The indicative has a tight radius (must match known facts). The counterfactual has a wide radius (can violate known facts to test causal dependencies).

  ### 4. Why This Is Better for Your Novel

  This unified view gives you a powerful tool for your branching timelines. If you adopt the dual-logic view (Adams/Edgington), your characters in the "Death Timeline" are playing a different mental game than your characters in the "Life Timeline." One is doing probability math; the other is doing metaphysics.

  But if you adopt the Stalnakerian unified view, **all your characters are doing the same thing:** searching for the closest possible world. The tragedy and the drama come from the fact that **they are restricted to different Context Sets.**

  #### Application to the "Death Timeline" (Indicative Reasoning)
  Characters here know the Senator is dead. Their "Context Set" is locked.
  *   *Logic:* "If the sniper missed, there was a backup."
  *   *Why:* They cannot search a world where the Senator lives. That is outside their context set. To make "sniper missed" true, they *must* add "backup fired."
  *   *Vibe:* Conspiracy, determinism, fatalism. The logic forces them to find hidden causes because the effect (death) is fixed.

  #### Application to the "Life Timeline" (Counterfactual Reasoning)
  Characters here (assuming they know about the branch) can look back at the "Death Timeline" as a counterfactual.
  *   *Logic:* "If the sniper had hit, the Senator would be dead."
  *   *Why:* They can suspend the fact of his survival. The minimal change to "sniper hit" results in "Senator dead." No backup needed.
  *   *Vibe:* Contingency, luck, fragility. The logic allows them to see how easily things could have been otherwise.

  #### The "Branch Point" Moment
  The moment of the split is the moment the **Context Set fractures**.
  Up until the shot, everyone shares the same Context Set. After the shot, the universe literally enforces the Stalnakerian distinction.
  *   Group A is stuck in the Indicative trap (Effect is fixed, so Cause must be adjusted).
  *   Group B is living in the Counterfactual reality (Cause is adjusted, so Effect is allowed to change).

  ### 5. Defending the View (The "Parsimony" Argument)

  If you need to defend this in an author's note or just to yourself, lean on **Cognitive Parsimony**.

  The dual-logic view requires human beings to possess two distinct cognitive modules for "if...then." One module calculates probability (indicative), and another module calculates similarity between metaphysical worlds (counterfactual). This is biologically and psychologically implausible.

  The unified view suggests we have **one** cognitive module for hypothetical reasoning. It simulates a world where the antecedent is true. The *only* difference is whether we are allowed to break our existing memories to do so.
  *   **Indicative:** "Simulate this, but don't delete my memory of the outcome."
  *   **Counterfactual:** "Simulate this, and you have permission to delete my memory of the outcome."

  This makes the Oswald pair not a paradox, but a feature. It shows that **truth is sensitive to what we are holding fixed.**

  ### Summary for Your Draft

  The logic connecting your two timelines is **The Principle of Minimal Divergence.**

  1.  **Single Mechanism:** All reasoning is a search for the "closest world" where the condition is met.
  2.  **The Variable:** The "distance" metric changes based on what facts are held sacred.
  3.  **The Conflict:** The "Death Timeline" characters are forced to hold the *Death* sacred. To make their conditions true, they must distort the *Cause* (conspiracies, backups).
  4.  **The Resolution:** The "Life Timeline" characters hold the *Cause* sacred (the shot missed). To make their conditions true, they distort the *Effect* (the Senator lives).

  Your housemate's friend Stalnaker was right. You don't need two logics. You just need one logic, and a story about what different people are unwilling to let go of. In one timeline, they can't let go of the body. In the other, they can't let go of the bullet. That's not just logic; that's theme.
