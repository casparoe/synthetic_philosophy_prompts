prompt: |-
  I've been working through David Lewis's papers on objective chance for a graduate reading group on the metaphysics of probability, and I keep getting stuck on the problem he dubs the "Big Bad Bug" in "Humean Supervenience Debugged." I follow the basic shape of the difficulty and of Lewis's own fix, but I'm not convinced the fix earns its keep, and I'd like to see the skeptical case made out rigorously rather than piece it together myself from secondary summaries.

  Here is the setup as I understand it. The Principal Principle says that your credence in a proposition A, conditional on learning that the objective chance of A is x together with any admissible evidence, should equal x, where admissible evidence is roughly evidence whose bearing on A runs entirely through its bearing on the chance of A (historical information up to the relevant time counts; "crystal ball" information about how things actually turn out does not). Lewis was also committed to Humean supervenience about chance: chances at a time must supervene on the pattern of occurrent, non-modal fact spread across the whole of history, including everything that happens afterward, since the true chances are whatever "best system" analysis delivers when fitted to the entire actual course of events, past and future. This has the awkward consequence that a chance hypothesis can assign positive chance to its own undermining: if a coin has an objective chance of one-half of landing heads on each of a long series of independent tosses, there is some small but positive chance, according to that very hypothesis, that the coin lands heads on every single toss in the series—a run that would make a quite different, and much less flattering, hypothesis the best system, and so would make the original hypothesis false. Lewis argued that this is not merely an uncomfortable coincidence but a genuine formal inconsistency in the original Principal Principle, and he responded by adopting the "New Principle," which he credits to Ned Hall and Michael Thau: instead of conditionalizing on the proposition that some target proposition has chance x, you conditionalize on a proposition that specifies the entire chance function of the world, and the value you defer to is that function's chance of A conditional on your admissible evidence, rather than its bare unconditional chance of A.

  Please argue for the position that this fix is philosophically inadequate: that whatever it does to restore formal consistency, the New Principle fails to preserve the rationale that made deference to chance compelling in the first place, so that the Big Bad Bug is best read as a real cost of combining Humean supervenience with any recognizable norm of chance-credence deference, rather than as a puzzle that has actually been laid to rest.
reasoning: |-
  Here's a thinking process that leads to the argument against the adequacy of Lewis's "New Principle":

  1.  **Deconstruct the Request:**
      *   **Topic:** David Lewis's "Big Bad Bug" and his solution (the "New Principle") in the context of Humean Supervenience (HS) and the Principal Principle (PP).
      *   **Task:** Argue *against* the adequacy of the New Principle (NP). Specifically, argue that while NP might solve the formal inconsistency, it fails to preserve the *rationale* for chance-credence deference. The Big Bad Bug should be seen as a real cost of HS, not a solved puzzle.
      *   **Audience:** Graduate reading group on metaphysics of probability. The tone needs to be rigorous, philosophically precise, and familiar with the literature (Lewis, Hall, Thau, Hoefer, etc.).
      *   **Key Constraint:** Do not just summarize; make the *skeptical case* rigorously.

  2.  **Analyze the Core Conflict:**
      *   **Humean Supervenience (HS):** Chances supervene on the total history of categorical facts (the "Humean Mosaic"). The "Best System" analysis (BSA) determines chances.
      *   **The Bug:** Because the BSA looks at the *whole* history, future events determine present chances. Therefore, a present chance hypothesis ($T$) entails that certain future histories are *impossible* (because if they occurred, $T$ wouldn't be the best system). But $T$ itself assigns a non-zero chance to those futures.
      *   **Principal Principle (PP):** $Cr(A | Ch(A)=x \& E) = x$.
      *   **The Contradiction:** If $F$ is an "undermining future" (a future that makes $T$ false), then $Ch_T(F) > 0$ (by $T$'s own lights). But $Cr(F | T) = 0$ (because $T$ entails $\neg F$). PP says they should match. They don't. Contradiction.
      *   **The Fix (New Principle - NP):** $Cr(A | T \& E) = Ch_T(A | T)$. Instead of deferring to the unconditional chance $Ch_T(A)$, defer to the chance of $A$ *given that $T$ is the true chance theory*.
      *   **The Goal:** Show why NP is philosophically unsatisfying/inadequate despite fixing the math.

  3.  **Brainstorming Arguments Against the New Principle:**
      *   *Argument 1: Loss of Explanatory Power.* The PP was motivated by the idea that chance *guides* belief. If chance is just a summary of facts (HS), why should it guide belief? Lewis used PP to explain *why* we care about chances. NP makes the connection circular or trivial.
      *   *Argument 2: The "Undermining" intuition remains.* Even if the math works, the metaphysics is weird. How can the present chance depend on the future? NP acknowledges this but doesn't resolve the metaphysical tension; it just patches the normative rule.
      *   *Argument 3: Admissibility becomes opaque.* In PP, admissibility was tricky but manageable. In NP, the conditioning proposition is the whole theory $T$. Is $T$ admissible? Lewis says yes, but why?
      *   *Argument 4: The "Ratio Analysis" problem.* $Ch_T(A | T)$ requires a ratio analysis of conditional chance. If $Ch_T(T) < 1$, we are conditioning on a proposition that the chance function itself says might be false. This feels like bootstrapping.
      *   *Argument 5: Disconnect from Frequentism/Best System.* The BSA generates chances based on the *actual* history. But rational agents don't know the actual future. NP asks agents to conditionalize on the chance function being true, but the chance function is defined by the future. This creates an epistemic gap.
      *   *Argument 6 (The Strongest): The Rationale of Deference.* The PP was supposed to capture the *authority* of chance. "If you know the chance, you should align your credence." NP changes this to "If you know the chance theory, align your credence with what that theory says *assuming it is true*." This weakens the normative force. It turns chance from a guide into a hypothesis to be tested, but one we must treat as certain to use.

  4.  **Structuring the Argument:**
      *   **Introduction:** Acknowledge Lewis's achievement (saving HS from formal contradiction) but state the thesis: NP saves the letter of the law but kills the spirit. It severs the link between the metaphysics of chance and the epistemology of credence.
      *   **Point 1: The Erosion of the "Guide" Intuition.** The PP was meant to show chance as a *normative guide*. NP turns it into a trivial conditionalization. It loses the "why."
      *   **Point 2: The Circularity of Conditional Chance.** To calculate $Ch_T(A | T)$, we need a theory of conditional chance. If chances are Humean, conditional chances are just ratios of unconditional chances. But $Ch_T(T)$ is problematic. This leads to technical awkwardness that masks the metaphysical problem.
      *   **Point 3: The Epistemic Access Problem.** Agents don't know $T$. They infer $T$ from data. But $T$ depends on the future. NP requires us to reason *as if* we know $T$, but the justification for believing $T$ is undermined by the very logic of HS (since the future might undermine $T$).
      *   **Point 4: The "Cost" Argument.** The Bug isn't a bug; it's a feature of HS. Trying to fix it with NP hides the true cost: HS cannot support a robust norm of deference. We should accept the cost or reject HS, not patch the norm.
      *   **Conclusion:** Summarize. The NP is a technical patch that leaves the philosophical wound open.

  5.  **Refining the Arguments (Self-Correction/Nuance):**
      *   *Check:* Did Lewis address conditional chance? Yes, he assumed the ratio analysis holds.
      *   *Critique:* If $Ch_T(T) < 1$, then $Ch_T(A|T) = Ch_T(A \& T) / Ch_T(T)$. But if $T$ is the chance theory, $Ch_T(T)$ isn't well-defined in the object language usually. Lewis treats $T$ as a proposition about the world.
      *   *Key Insight:* The most potent criticism comes from the idea that the *authority* of chance is diminished. Under PP, Chance speaks, and Credence listens. Under NP, Credence asks, "What would Chance say if Chance were true?" This introduces a layer of hypothesis that weakens the direct normative link.
      *   *Reference:* Need to mention Hoefer ("Humean Objective Chance") or Ismael ("The Open Universe") as they develop this critique. Ismael's "Generalized Principal Principle" is relevant context, but focus on the critique of NP.
      *   *Focus:* Keep it focused on *why NP fails to preserve the rationale*. The rationale is that chance is *sui generis* or at least authoritative. HS makes chance derivative. NP tries to bridge them but fails to make chance *action-guiding* in the robust sense Lewis wanted.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Set the stage. HS + PP = Contradiction. NP fixes contradiction. Thesis: NP fails philosophically.
      *   *Section 1: The Normative Force.* PP was an analysis of the concept of chance. NP makes it a derived rule. It loses the conceptual priority.
      *   *Section 2: The Metaphysical/Epistemic Mismatch.* HS makes chance posterior to the mosaic. Rationality requires acting on present evidence. NP asks us to conditionalize on a global fact ($T$) that is epistemically inaccessible in the required way.
      *   *Section 3: The Trivialization Worry.* If $Ch_T(A|T)$ is just the probability of $A$ in the world where $T$ holds, and $T$ is defined by the mosaic, are we just deferring to our best guess of the mosaic? If so, why call it "chance"?
      *   *Section 4: Conclusion.* The Bug reveals HS is incompatible with robust objective chance. NP is a band-aid.

  7.  **Final Polish:** Ensure the tone is appropriate for a graduate reading group (technical but argumentative). Use terms like "undermining futures," "ratio analysis," "normative authority," "epistemic access." Make sure to explicitly address the prompt's request to argue that the Bug is a *real cost*.

      *(Self-Correction during drafting)*: I need to be careful not to just say "HS is bad." I need to say "NP doesn't save HS's compatibility with a *recognizable norm of deference*." The prompt asks to argue that the fix is inadequate *because* it fails to preserve the rationale.

      *Key argument to emphasize:* The "Why Defer?" question. Lewis originally thought PP *explained* why we defer. With NP, the explanation is lost. We defer because... the math works out? That's not a philosophical rationale.

  8.  **Final Review against Prompt:**
      *   Argue for position that fix is inadequate? Yes.
      *   Argue it fails to preserve rationale? Yes.
      *   Argue Big Bad Bug is a real cost? Yes.
      *   Rigorous skeptical case? Yes.

      (Proceed to generate response based on these points.)
answer: |-
  The following is a rigorous argument designed for a graduate-level metaphysics reading group. It contends that while Lewis's New Principle (NP) resolves the formal inconsistency of the Big Bad Bug, it does so at the unacceptable cost of severing the normative link between chance and credence that motivated the Principal Principle (PP) in the first place.

  ***

  ### The Hollow Victory: Why the New Principle Fails to Save Humean Chance

  David Lewis's adoption of the New Principle (NP) in "Humean Supervenience Debugged" is widely acknowledged as a technical success. It mathematically inoculates Humean Supervenience (HS) against the formal contradiction generated by undermining futures. However, for the metaphysician of probability, a solution that saves the consistency of the system by gutting the philosophical rationale of its central norm is no solution at all.

  The Principal Principle was never intended merely as a consistency constraint; it was an analysis of the *concept* of objective chance. It was meant to capture why chance is *authoritative* for rational belief. The skeptical case against the NP is that while it restores consistency, it renders chance epistemically inert in the way Lewis originally required. It transforms chance from a guide for belief into a hypothesis about the world that we must treat as certain to use, thereby obscuring the very metaphysical tension the Big Bad Bug exposed.

  Here is the case that the New Principle is philosophically inadequate and that the Big Bad Bug should be read as a fatal cost of combining HS with robust objective chance.

  #### 1. The Erosion of Normative Authority
  The original Principal Principle (PP) posited a direct normative link: if you know the chance of $A$ is $x$, your credence in $A$ ought to be $x$. This captured the intuition that chance has a sui generis authority over rational belief. Lewis hoped to use the PP to explain *why* we care about chances: because they are the "uncontrollable guides" to truth.

  The New Principle modifies this to:
  $$Cr(A | T \& E) = Ch_T(A | T)$$
  where $T$ is the proposition specifying the entire true chance function.

  This shift fundamentally alters the normative landscape. Under the PP, chance commands credence directly. Under the NP, credence defers to chance *conditionally on the truth of the chance theory itself*. This introduces a layer of hypothetical reasoning that weakens the authority of chance. We are no longer told to align our beliefs with the chances; we are told to align our beliefs with what the chances *would be* if the current chance hypothesis were true.

  This is a crucial degradation. The rationale for deference is that chance tracks something about the world's propensity or structure that is relevant to truth. But if $T$ is a Humean summary of the total mosaic (including the future), then $T$ is not a "guide" in any robust sense; it is a retrospective summary. The NP asks us to conditionalize on $T$, but since $T$ entails facts about the future that are currently unknown, the agent cannot actually occupy the epistemic position required by the principle without engaging in crystal-ball gazing. The NP preserves the *equation*, but it loses the *explanation* of why a rational agent should care about $Ch_T$ in the first place. The "guide" has become a mirror.

  #### 2. The Problem of Conditional Chance and the Ratio Analysis
  To make the NP work, Lewis relies on the standard ratio analysis of conditional chance: $Ch_T(A | T) = Ch_T(A \& T) / Ch_T(T)$. This creates a severe metaphysical and formal awkwardness that masks the underlying problem rather than solving it.

  In a Humean framework, $T$ is the proposition that a specific systematization of the mosaic is the "Best System." Since the Best System depends on the entire mosaic, $T$ entails specific facts about the future. Consequently, for any undermining future $F$, $T$ entails $\neg F$. Thus, $Ch_T(T)$ is problematic. If $T$ is the true chance theory, does it assign a chance to its own truth?

  If $Ch_T(T) < 1$, then the chance function admits the possibility that it is *not* the true chance function. But if $T$ is false, then $Ch_T$ is not the true chance function. The NP requires us to conditionalize on $T$, effectively treating $T$ as certain for the sake of the calculation, while the chance function itself (via the ratio analysis) acknowledges $T$ might be false.

  This creates a disconnect between the metaphysics and the epistemology. The NP works mathematically only if we treat $T$ as an admissible proposition that can be plugged into the chance function. But on HS, $T$ is a global proposition about the supervenience base. To conditionalize on $T$ is to conditionalize on the entire history of the world. This makes the NP trivially true for an omniscient agent but practically useless for a finite agent. A norm of rationality that requires an agent to conditionalize on the entire future history of the universe to determine present credence is not a norm of *chance* deference; it is a norm of logical omniscience disguised as probabilistic guidance.

  #### 3. The Epistemic Access Gap
  The most damning objection to the NP is that it widens the gap between the evidence available to an agent and the chance facts they are supposed to defer to.

  Under the PP, the worry was already present: how do we know the chances? Lewis's answer was inductive: we observe frequencies and infer the Best System. But the Big Bad Bug showed that this inference is always precarious because future frequencies could undermine the present chance assignment.

  The NP attempts to patch this by saying, "Ignore the undermining possibility; just calculate what the chance would be if the theory held." But this ignores the *reason* the undermining possibility matters. It matters because on HS, the chance *is nothing over and above* the pattern of events. If the pattern of events changes (via an undermining future), the chance *changes*.

  Therefore, when the NP tells us to use $Ch_T(A | T)$, it is asking us to use a number derived from a theory that admits its own potential falsity. For the Humean, chance is not a stable property of the present moment; it is a fluid label applied to the total history. The NP asks agents to treat this fluid label as a fixed parameter for conditionalization. This severs the link between the *ontology* of chance (which is posterior to the mosaic) and the *epistemology* of chance (which must be prior to the future mosaic).

  If the rationale for deference is that chance summarizes our evidence about the world's structure, the NP fails because it asks us to defer to a summary that includes evidence we do not have (the future). If the rationale is that chance is a primitive guide, HS denies that. The NP tries to have it both ways: it keeps the Humean ontology (where chance depends on the future) but demands a non-Humean epistemology (where we can treat chance as a fixed present guide).

  #### 4. The Bug as a Feature, Not a Bug
  Finally, we must consider the dialectical cost. Lewis introduced the PP to show that Humean Supervenience could accommodate objective chance. The Big Bad Bug showed that HS and PP are inconsistent. The NP shows that HS and a *modified* PP are consistent.

  However, the skeptical position is that the inconsistency was not a mistake; it was a revelation. The Bug demonstrates that a metaphysics where chances supervene on the total history of categorical facts is incompatible with a norm of deference that treats chances as present-moment guides for action.

  By adopting the NP, Lewis effectively concedes that Humean chances cannot play the role of "objective chance" in the traditional sense. They cannot be the $x$ in $Cr(A | Ch(A)=x) = x$. They can only be the $x$ in a complex conditional equation that no finite agent can actually instantiate.

  If we accept the NP, we must admit that "Humean Chance" is not the same concept as the "Chance" in the Principal Principle. We have saved the term "chance" for the Humean mosaic, but we have lost the *function* of chance. The Big Bad Bug is therefore best read not as a puzzle to be solved, but as a *reductio* of the compatibility of HS and robust objective chance. The NP papers over the crack, but the foundation remains unstable. It tells us that we can mathematically define a deference rule that doesn't explode, but it does not tell us why a rational agent, situated in the present, should care about a "chance" that is metaphysically determined by a future they cannot know and which might render that very chance false.

  #### Conclusion
  The New Principle is a technical patch that restores formal consistency at the price of philosophical substance. It preserves the letter of the chance-credence connection while violating its spirit. It requires agents to conditionalize on global, epistemically inaccessible truths, and it relies on a conditional chance analysis that obscures the metaphysical dependence of chance on the future.

  For the Humean, the Big Bad Bug should remain a bug. It signals that if you want chances to be authoritative guides for belief (as the PP demands), they cannot be mere summaries of the total history (as HS demands). Lewis's fix saves Humean Supervenience, but it does so by sacrificing the very notion of objective chance that made Supervenience worth debugging in the first place. The rational response is not to adopt the NP, but to recognize that HS cannot support a norm of deference robust enough to merit the name "objective probability."
