answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], the Maid of Honor and [Bride's Name]'s younger sister.

  When [Bride's Name] asked me to give this speech, she gave me a set of constraints that I can only describe as philosophically rigorous. She told me: "No clichés. No 'love needs no explanation.' No 'written in the stars.' And absolutely no suggesting that marriage is a magical spiritual union that transcends earthly contracts."

  Basically, she asked me to give a wedding speech without saying anything that usually makes a wedding speech work. Which, as it turns out, is exactly what she's spent the last two years writing her dissertation about.

  For the family members currently wondering if you accidentally wandered into a thesis defense: don't worry. But for the handful of philosophers from [Bride's University] in the back: yes, I know the literature.

  [Bride's Name] has spent years arguing against a philosopher named T.M. Scanlon. Scanlon argues that a promise binds you because breaking it manipulates someone's expectations. It's about individual morality. [Bride's Name], however, argues something much closer to David Hume. She argues that promises only have weight because we all agree to a shared social practice. The words "I promise" aren't magic on their own; they work because there is a massive, historical institution behind them ready to hold you accountable.

  She has a favorite joke about this. She says that, logically speaking, a wedding is the single **most convention-laden promise** a person can make.

  She's not wrong. Think about it. If you just wanted to tell your partner you'd stay with them, you could do that over breakfast. But no. We have an officiant. We have legal paperwork filed with the state. We have rings—circular symbols of infinity that we buy from a multi-billion dollar industry. We have vows recited in front of witnesses who are legally empowered to testify against you if you renege. We have centuries of ritual sitting behind us like a structural load-bearing wall.

  According to [Bride's Name], the reason this promise is so heavy isn't because of a feeling in your hearts. It's because of the paperwork.

  And honestly? I think she's right.

  Because feelings are notoriously unreliable. I know [Groom's Name] loves [Bride's Name] today. I know [Bride's Name] loves [Groom's Name] today. But we all know that people change. Days get harder. Life gets complicated. If marriage were just about your current expectations of each other, it would be fragile. It would be up to you two to constantly renegotiate the terms every time you had a bad week.

  But that's not what we're doing here.

  By standing up here, in front of all of us, with an officiant and a license and a specific script you have to follow, you are opting into a convention that is bigger than you are. You are invoking a social machine designed to keep you together even when the "expectations" part gets fuzzy.

  To the philosophers in the room: You might say that Principle F is too thin to explain the weight of these vows. You'd be right. Because the weight doesn't come from the expectation of fidelity. The weight comes from the fact that everyone in this room is now a witness to the convention. We are the social practice. We are the ones who will remind you, gently or aggressively, that you invoked this specific, heavy, historical institution.

  And to everyone else: This is why [Bride's Name] loves [Groom's Name]. Not because he completes her, or because destiny led them here. But because he looked at the most complex, bureaucratic, historically burdened, convention-laden promise available to human beings... and he said, "Yes. Let's do that one. Let's bind ourselves to all of this."

  [Bride's Name], you argued for years that the binding work is done by the existence of a shared practice. Well, look around. This is the practice. We are the shared practice. We are the convention. And we are here to make sure you keep your word.

  So, if everyone could please raise a glass.

  To [Bride's Name] and [Groom's Name]. May your love be not just a feeling, but a fact. May you find comfort in the constraints, and strength in the structure. And may you always remember that you are making the most convention-laden promise of your lives—and that is exactly why it will last.

  To the couple!
