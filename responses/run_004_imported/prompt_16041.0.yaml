answer: |-
  This is a profound and painful situation, and your friend has pointed you toward one of the most difficult but relevant passages in 20th-century philosophy. Wittgenstein's *On Certainty* was written in the last 18 months of his life, and it is specifically concerned with the problem you are facing: **What happens when knowledge claims crash against a world-picture that does not recognize the rules of evidence you are using?**

  To answer your specific questions: Wittgenstein is arguing that the shift from reasoning to persuasion is a difference in **kind**, not degree. Furthermore, his use of "combat" does not commit him to a radical relativism where "anything goes," but rather to a **perspectival realism** where judgment is possible but not neutral.

  Here is a breakdown of the claim he is making, how it applies to your brother, and where the limits of his relativism lie.

  ### 1. Reasons vs. Persuasion: A Difference in Kind

  You asked whether reasoning that runs out of premises simply shades into persuasion (degree), or if they are fundamentally different activities (kind). For Wittgenstein, it is a **difference in kind**.

  In our normal language-games, "giving a reason" implies a shared logical space. If I say, "It will rain because the barometer is dropping," I am relying on a shared hinge that *barometers predict weather* and *sensory data is reliable*. Within that system, my reason is valid.

  However, hinge propositions (e.g., "The earth has existed for many years," "Physical objects don't vanish when unobserved," "Government officials generally follow the law") are not things we *know*; they are the scaffolding that allows us to know things. They are not tested; they are the *means* of testing.

  When you argue with your brother, you are offering evidence (reasons) that presupposes a hinge (e.g., "Mainstream journalism is a valid arbiter of truth"). He is operating on a different hinge (e.g., "Mainstream journalism is a tool of the conspiracy").

  *   **Reasoning** operates *within* a system of hinges.
  *   **Persuasion** operates *on* the system of hinges itself.

  When Wittgenstein writes, *"At the end of reasons comes persuasion,"* he does not mean that reasons gradually weaken until they become persuasion. He means that the **activity of reasoning ceases entirely**, and a different activity begins.

  Think of it like this: If you are playing Chess and your opponent moves a Rook diagonally, you cannot checkmate them using the rules of Chess. You have to stop playing Chess and say, "We aren't playing the same game." The missionary converting the native (§612) is not proving the native wrong via logic; the missionary is introducing a new form of life, a new way of acting. It is a causal, psychological, or sociological shift, not a logical one.

  **The Claim:** You cannot logic someone out of a position they didn't logic themselves into. If the disagreement is about the *hinges*, you are no longer debating facts; you are competing for the adoption of a different form of life. That is persuasion, training, or influence—not argumentation.

  ### 2. "Combat" and the Charge of Relativism

  You asked if the language of "combat" implies that no one can judge either side right or wrong (radical relativism). This is the most common misunderstanding of *On Certainty*.

  Wittgenstein is **not** saying that the Oracle King and the Physicist are equally right. He is not saying truth is relative. He is saying that **justification is local.**

  *   **Radical Relativism:** "Your truth is true for you, my truth is true for me, and there is no way to compare them."
  *   **Wittgenstein's View:** "Our system is our system. We judge them by our lights, they judge us by theirs. There is no neutral 'God's eye' view from which to adjudicate, but that doesn't mean we stop judging."

  When he writes, *"each man declares the other a fool and a heretic"* (§611), he is describing what actually happens, not prescribing tolerance. He is acknowledging that when hinges clash, we do not shrug and say, "Well, that's his truth." We call them a heretic. We "combat" them.

  The "combat" is real. We are entitled to defend our hinges. If someone believes they can fly by jumping off a roof, we do not say, "That is their reality." We restrain them. We judge their hinges by the standard of *our* successful action in the world.

  However, the "narrower point" you sensed is this: **We must recognize the status of our own victory.** If we "win" the combat and convert the brother, we should not pretend we won via superior logic or evidence. We won via persuasion, influence, or a shift in trust. We cannot claim the moral high ground of "I followed the evidence and he didn't," because the evidence only counts *after* you accept the hinge.

  **The Claim:** Wittgenstein allows you to judge your brother's beliefs as false (from within your system), but he forbids you from claiming that your judgment is based on a neutral rationality that he is simply too stupid to see. The conflict is not between Rationality and Irrationality; it is between World-Picture A and World-Picture B.

  ### 3. What This Means for You and Your Brother

  Understanding this distinction changes the practical approach to your situation in three specific ways:

  **A. Stop Offering Evidence**
  If Wittgenstein is right, every piece of evidence you offer is being filtered through a hinge that neutralizes it. If you show him a fact-check, his hinge ("Fact-checkers are part of the conspiracy") absorbs the evidence and uses it to reinforce the belief. Continuing to offer reasons is not just futile; it is a category error. You are trying to use a key on a lock that isn't there.

  **B. Recognize the "Missionary" Dynamic**
  Wittgenstein's reference to missionaries is crucial. Missionaries rarely convert through syllogisms. They convert through relationship, example, emotional resonance, and sometimes social pressure. If you want to influence your brother, you have to move from the realm of *epistemology* (what is true?) to the realm of *ethics and relationship* (who are we to each other?).
  *   *Ineffective:* "Here is a article proving that event didn't happen."
  *   *Wittgensteinian:* "I love you, and this belief isolates you from the people who care about you. It makes me afraid for you."
  This is not an argument; it is an appeal to a different hinge (e.g., "Family bonds matter more than political truth").

  **C. Accept the Tragedy of "Combat"**
  Wittgenstein's tone in these sections is somber. He recognizes that when hinges clash, there is often no peaceful resolution. One side usually has to yield, but not because they were "out-argued."
  You may have to accept that you cannot "save" him intellectually. You can only remain a stable presence in his life, hoping that life experiences (which often strike at hinges harder than arguments do) will cause a shift.

  ### Summary of the Claim

  Wittgenstein is claiming that **rationality is a system-bound activity.**

  1.  **Kind, not Degree:** Reasoning and persuasion are different categories. Reasoning works *inside* a framework; persuasion works *on* the framework. When you run out of shared premises, you haven't just run out of ammo; you've run out of the ground to stand on to fire the ammo.
  2.  **Judgment without Neutrality:** We are allowed to call the other side "wrong" (§611), but we must admit we are doing so from within our own "riverbed" of assumptions. There is no view from nowhere.
  3.  **The Nature of the Conflict:** The conflict is inevitable ("combat"), but recognizing it as a clash of hinges prevents the arrogance of thinking you are the sole bearer of Reason. It humbles the "rational" party just as it critiques the "conspiratorial" party.

  For your situation: You are not failing to communicate because you are unclear or he is unintelligent. You are failing because you are speaking different grammatical languages. The path forward is not better arguments, but a shift in strategy toward the relational and the persuasive, while accepting that you cannot force a reconciliation of premises through logic alone.
