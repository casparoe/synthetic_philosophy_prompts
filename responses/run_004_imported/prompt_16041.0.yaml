      *   *The "Right/Wrong" Judgment:* We *do* judge. We call them fools/heretics (§611). We don't just shrug. But our judgment isn't based on a neutral, God's-eye view. It's based on *our* hinges.
      *   *Combat:* "Combat" implies conflict, not necessarily violence, but a struggle for alignment. It acknowledges that we *will* try to change them, but we must recognize *how* we are doing it (not via pure logic, but via influence/conversion).
