      *   **Key Constraint 1 (Marcus's Wish):** Do not let the funeral be where "Bayesians finally won." Do not turn the eulogy into a defense of significance testing.
      *   **Key Constraint 2 (Tone):** Faithful to Marcus's nuanced position (pro-preregistration/sample size, anti-Bayesian *narrative* hijacking), warm, specific, accessible to non-statisticians.
      *   **Key Constraint 3 (Speaker's Arc):** Acknowledge the speaker's own late-in-life philosophical reckoning regarding the tools they used for decades.

  2.  **Determine the Core Theme:**
