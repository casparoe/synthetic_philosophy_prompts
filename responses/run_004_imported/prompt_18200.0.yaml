answer: |-
  Good morning. For those of you who don't know me, I'm [Name]. For thirty years, I ran a cell-biology lab. For thirty years, Marcus was my closest friend. And for thirty years, he was my statistical conscience.

  When Marcus asked me to speak today, he gave me two specific instructions. First, he said, "Do not let this funeral become the occasion on which the Bayesians finally win." And second, he said, "Do not turn my eulogy into a defense of significance testing."

  For the family members here who might be wondering if you've accidentally walked into a conference session: I promise you, we are going to talk about Marcus, not just his math. But to know Marcus was to know that for him, math was not just calculation. It was a moral framework. It was about how we tell the truth when the world is uncertain.

  I spent thirty-five years publishing papers that relied on Marcus's world. I generated p-values by the thousands. I treated them like magic coins that, when flipped correctly, bought me permission to speak the truth. For most of my career, I didn't ask what the coins were made of. I just trusted the man who minted them.

  It wasn't until I retired, when I joined a philosophy-of-science reading group on a whim, that I realized how much I had taken on faith. We spent a whole term arguing about frequentist versus Bayesian inference. And as I read, I kept hearing Marcus's voice. Not just his arguments, but his tone.

  Marcus was a Neyman-Pearson man to his marrow. He believed in the discipline of the long run. He believed that if you want to control error, you need strict rules, and you need to stick to them even when they don't give you the answer you want. But his irritation in the last fifteen years wasn't really about the math. It was about the story.

  He watched the biomedical and social sciences undergo a crisis of confidence. He saw the push for preregistration, for registered reports, for larger sample sizes. He championed all of those things. He thought they were good, rigorous, frequentist practices. But he grew furious when he went to conferences and heard these fixes described as a vindication of Bayesian philosophy.

  "They kept the arithmetic and stole the credit," he would tell me over dinner.

  To Marcus, this wasn't just academic turf warfare. It was about honesty. He believed that if you use a tool, you should admit what tool it is. He worried that by dressing up old rigor in new philosophical clothing, we were teaching young scientists to value the *appearance* of insight over the *discipline* of measurement.

  I know there are people in this room who debated him on this for years. I know there are former students here who took a different path. Marcus told me once about two of his doctoral students who became committed Bayesians. He said neither relationship ever entirely recovered, and he regretted that far more than he ever let on. He was stubborn, yes. But his stubbornness came from a fear that if we loosened our grip on objectivity, even a little, we would lose our ability to distinguish signal from noise. He loved those students. He just loved the truth more, and he was terrified that they were loving the comfort of the answer more than the rigor of the question.

  I tell you this not to reopen those wounds, but to honor the depth of his care. Marcus didn't fight about statistics because he liked arguing. He fought because he believed that how we measure the world determines how we heal it. When I was running my lab, Marcus was the one who would call me at 7:00 PM and ask, "Are you sure that effect is real, or are you just tired?" He was the brake pedal on my ambition.

  In retirement, as I've come to understand the philosophy behind the tools I used for decades, I've realized that Marcus was right about the most important thing: it doesn't matter which school of thought you belong to if you lack intellectual integrity. Whether you update your priors or control your error rates, the goal is the same. It is to be humble before the data.

  Marcus knew the debate wasn't settled. He knew he might be wrong. But he believed that the fight itself—the friction between different ways of thinking—was necessary. It kept us honest. So, in accordance with his wishes, I am not going to declare a winner today. The Bayesians have not won, but neither has the null hypothesis. The only thing that remains significant is the integrity with which he held his views.

  To his family: You knew him as the man who checked the locks twice, who balanced the checkbook, who remembered every birthday. That was the same man. He applied the same rigor to his friendships that he applied to his models. He didn't offer comfort lightly; he offered it honestly. When Marcus told you he was proud of you, you knew he had run the numbers, and you knew the result was robust.

  I am going to miss him. I am going to miss the way he would squint at a graph as if it were a suspicious stranger. I am going to miss the way he could silence a room not by raising his voice, but by asking a single, precise question that revealed we had all been speaking vaguely.

  Marcus spent his life trying to quantify uncertainty. He taught me that while we can measure error, we cannot measure worth. He taught me that a friend is not a variable to be controlled, but a constant to be relied upon.

  So, Marcus, I will not claim victory for your side. I will not defend your tests. I will simply say that you were right to demand we take our methods seriously, because our methods shape our truth. And you were right to demand we take our friendships seriously, because they shape our lives.

  Rest in peace, my friend. The sample size is small, just the ones you left behind, but the confidence interval on how much we loved you is as wide as the sky.

  Thank you.
