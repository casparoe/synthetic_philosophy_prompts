      *   *Solution:* Focus on the *attitude* toward uncertainty. Frequentist = Long run, strict rules, error control. Bayesian = Updating belief, priors. Marcus liked the rules because they kept you honest. He hated that people claimed the *ethics* of honesty belonged only to the Bayesians.
