      *   **The Professional Marcus:** Describe his rigor without getting bogged down in jargon. Use the "Neyman-Pearson" detail but explain it through *character* (stubbornness, integrity) rather than math. Mention his irritation with the "Bayesian credit stealing" but frame it as him caring about *honesty* in attribution, not just math wars.
      *   **The Personal Marcus:** Connect the professional rigor to personal kindness. He was hard on ideas but soft on people (mostly). Mention the students (delicately).
      *   **The Speaker's Reflection:** The cell biologist's journey. Using the tools without understanding the philosophy. Marcus as the "conscience." The reading group realization.
      *   **The Resolution (Marcus's Wish):** Address the "Bayesians won" comment. Reframe the debate. It's not about who wins, it's about the *search* for truth.
