      *   *What was his metaphysical commitment?* He was an anarchist-communist. He believed in the ethical implications of natural law. If nature is cooperative, human society *should* be cooperative. He was fighting Social Darwinism (Spencer/Huxley) which justified laissez-faire capitalism/imperialism.
      *   *What was his level of analysis?* He focused on the *species* or *community* level. He observed flocks, herds, villages. He didn't have the concept of the gene.

  3.  **Deconstruct the Modern Counter-Argument:**
