answer: |-
  You are right to feel that these concepts are often blurred in effective altruist discourse. They both import market mechanics into ethics, but they operate on fundamentally different ontological levels. One is a proposal for social coordination; the other is a metaphor for individual cognition.

  Here is the breakdown of the distinction, followed by the verdict you requested.

  ### The Comparison: Interpersonal vs. Intrapersonal

  **1. Toby Ord's Moral Trade**
  *   **The Agents:** Distinct biological persons with divergent moral axioms.
  *   **What is Traded:** Behavioral compliance. I constrain my actions in a domain I care less about to purchase your constraint in a domain I care more about.
  *   **The Economic Analogy:** This is standard Ricardian comparative advantage applied to utility functions. The analogy holds up robustly because the prerequisites for trade actually exist: separate agents, separate preference orderings, and the ability to enforce agreements through reputation or contract.
  *   **The Goal:** Pareto improvement. Both agents increase the expected moral value of the world *according to their own specific moral metrics* without either having to convince the other to change their mind.

  **2. The Parliamentary Model (Bostrom/Lockhart)**
  *   **The Agents:** Hypothetical "delegates" representing moral theories *within a single mind*.
  *   **What is Traded:** Decision-making authority (or "choice-worthiness points"). A Utilitarian delegate might concede on a minor deontological constraint now in exchange for the Deontological delegate supporting a high-impact utilitarian intervention later.
  *   **The Economic Analogy:** This is vote-trading (logrolling) within a legislature. The analogy strains significantly because the "agents" are not real. They are projections of a single agent's uncertainty. There is no mechanism to enforce the trade other than the individual's own pre-commitment, which they can theoretically override at any moment since they embody all the delegates.
  *   **The Goal:** Maximizing *expected choice-worthiness* under moral uncertainty. It attempts to solve the problem of how to act when you are 60% sure Theory A is right and 40% sure Theory B is right, without simply ignoring the 40%.

  ### Where the Analogies Strain

  The economic metaphor works for **Moral Trade** because the friction is real. If I break our moral trade deal, you can punish me socially or refuse future cooperation. The "market" has teeth.

  The metaphor breaks for the **Parliamentary Model** because the friction is imaginary. If I am the Utilitarian delegate and the Deontological delegate, who is stopping me from reneging on the deal? For the trade to work, the "majority credence" must voluntarily bind itself to the "minority credence." But since there is no external enforcer, this requires the agent to treat their own uncertainty as if it were a conflict between hostile nations, rather than a calculation within a single brain. It reifies abstract credences into agents with veto power they do not actually possess.

  ### The Verdict

  **Toby Ord's Moral Trade is the more defensible normative idea.**

  Here is the justification you can quote:

  > "Moral Trade succeeds where the Parliamentary Model fails because it relies on actual game-theoretic incentives between distinct agents rather than a metaphorical reification of internal uncertainty. The Parliamentary model asks a single mind to pretend it is many, requiring a pre-commitment mechanism that does not exist inside a skull; there is no enforcement cost for the 'majority credence' to ignore the 'minority delegate' when the pressure is on. Moral Trade, by contrast, leverages existing social enforcement and divergent preferences to generate genuine gains from cooperation without requiring us to solve metaethics or pretend our doubts are people. It is a practical mechanism for coordination, whereas the Parliamentary model is merely a heuristic for calculation that collapses under scrutiny into standard expected value maximization."

  **Why this verdict holds:**
  The Parliamentary Model is ultimately just a fancy way of describing *Expected Choice-Worthiness* maximization. If you believe Theory A is 60% likely, you should generally act according to Theory A, perhaps weighted by the intensity of the stakes. The "trading" language adds narrative flavor but no normative force. You cannot truly "betray" a moral theory you hold credence in; you can only miscalculate its weight.

  Moral Trade, however, describes a real phenomenon. It allows for moral progress (in terms of outcomes) without requiring moral consensus. It works even if moral realism is false. It works even if the Parliamentary Model is incoherent. It is a robust social technology, whereas the Parliamentary Model is a cognitive simile that breaks when you ask who is holding the whip.
