answer: |-
  This is a fantastic application of the Hart-Devlin debate. You've correctly identified that the Online Safety Act's (OSA) "legal but harmful" (LBH) provision was essentially a 21st-century test case for Legal Moralism, but with a bureaucratic twist that neither man quite anticipated.

  If we drag Hart and Devlin out of the 1950s and seat them in front of the UK Parliament's Digital, Culture, Media and Sport Committee during the OSA debates, they wouldn't just rehash the Wolfenden Report. They would clash over the *mechanism* of enforcement and the *nature* of the "public."

  Here is how their specific arguments would likely translate to the LBH saga.

  ### 1. Devlin: The Disintegration Thesis in a Fragmented Sphere

  Devlin's core argument in *The Enforcement of Morals* was that society is not just a political structure but a community of ideas held together by a shared moral bond. If that bond weakens, society disintegrates.

  **On the "Legal but Harmful" Category:**
  Devlin would likely be **sympathetic to the LBH concept**, perhaps more so than Hart, but he would have a major caveat regarding *who* defines the harm.

  *   **The Disintegration Argument:** Devlin would argue that the internet accelerates disintegration not because of specific acts, but because it fragments the "shared morality." In the 1950s, deviance was private; online, deviance is algorithmic and communal. For Devlin, the LBH category is a necessary firewall. If the state acknowledges that certain content is "corrosive to society" (even if not criminal), it has a duty to intervene. To do otherwise would be to admit that the state is indifferent to the moral bonds holding the nation together.
  *   **The "Disgust Test" Problem:** You asked if his disgust test functions online. This is where Devlin hits a wall. His test relied on the "Man on the Clapham Omnibus"—a hypothetical ordinary person in a relatively homogeneous society.
      *   *Devlin's Adaptation:* He might argue that online "outrage" is a poor proxy for genuine moral disgust because it is manufactured and polarized. However, he would likely argue that the *silent majority's* unease about the *environment* of the internet constitutes the "intolerance and indignation" he spoke of.
      *   *The Caveat:* Devlin believed the law should reflect the moral judgments of the ordinary person, not a committee of experts. He might actually critique the OSA for handing the definition of "harmful" to Ofcom (regulators) and tech companies rather than leaving it to the jury system or clear parliamentary statute. If the "ordinary person" doesn't know what is banned until a platform removes it, Devlin might argue the moral law isn't being clearly proclaimed, which weakens its educative function.

  **Verdict:** Devlin supports the *intent* (protecting the moral fabric) but worries the *method* (technocratic regulation) dilutes the moral clarity needed to prevent disintegration.

  ### 2. Hart: The Empiricist and the "Shadow Law"

  Hart's critique in *Law, Liberty, and Morality* was twofold: first, that Devlin provided no empirical evidence that moral deviation causes societal collapse; second, that enforcing morality for its own sake violates individual liberty.

  **On the "Legal but Harmful" Category:**
  Hart would likely **oppose the LBH provision more fiercely than actual criminalization.**

  *   **The Disintegration Rebuttal:** Hart would double down on his empirical challenge. He would point to the last 60 years: we have legalized homosexuality, divorce, and abortion, and society has not disintegrated. He would argue that the "corrosiveness" of online speech is speculative. Without concrete evidence that specific "legal but harmful" content causes tangible societal collapse (not just individual hurt feelings), the state has no warrant to intervene.
  *   **The "Shadow Law" Critique:** This is Hart's strongest point regarding the OSA. Hart was a legal positivist; he cared deeply about the clarity of rules. The LBH category created a scenario where content wasn't *illegal* (you wouldn't be prosecuted for posting it), but it was *regulated out of existence* via economic coercion on platforms.
      *   Hart would argue this creates a "shadow law." It bypasses the strictures of criminal law (burden of proof, parliamentary scrutiny) while achieving the same censorious result. For Hart, this is the worst of both worlds: it restricts liberty without the procedural protections of the criminal law, and it enforces morality without the justification of preventing harm.
  *   **The Definition of Harm:** Hart adhered to a modified Millian Harm Principle. He would argue that "harm" must be tangible and assignable. "Corrosiveness to society" is too vague. If the content doesn't incite violence or defraud, it falls within the realm of individual moral choice. Hart would argue that allowing adults to access "harmful" but legal content is part of the price of a free society, and that "protecting" them from it is paternalism, not moral enforcement.

  **Verdict:** Hart sees LBH as an insidious bureaucratic expansion of Legal Moralism that lacks empirical justification and undermines the rule of law by creating vague, privately enforced restrictions.

  ### 3. The Crucial Divergence: Private Platforms as Public Moralists

  The twist in the OSA saga is that the government didn't ban the speech directly; they mandated *platforms* to suppress it.

  *   **Devlin's View:** Devlin might actually find this pragmatic. In *The Enforcement of Morals*, he acknowledged that the law cannot catch every immorality. If using private companies as "moral gatekeepers" preserves the shared moral environment without clogging the criminal courts, he might accept it as a modern necessity. He viewed society as an organic whole; if the "organs" (platforms) need to be regulated to keep the "body" (society) healthy, so be it.
  *   **Hart's View:** Hart would view this as a violation of the separation of powers and liberty. By forcing private companies to enforce vague moral standards, the state is outsourcing censorship. Hart would argue this chills speech more effectively than criminal law because platforms will over-censor to avoid fines. He would insist that if the state wants to ban something, it must make it illegal and face the democratic consequences. Hiding behind "terms of service" to enforce moral norms is, for Hart, intellectually dishonest and dangerous to liberty.

  ### 4. Does Hart's "No Evidence" Line Hold Up?

  You asked if Hart's argument that "societies absorb moral shifts without collapsing" still holds.

  *   **The Hartian Defense:** Empirically, Hart is still right. The UK has become vastly more morally permissive since 1957 regarding sex, gender, and family structure. The state has not collapsed.
  *   **The Devlin Counter-Update:** A modern Devlin wouldn't argue about *sexual* morality; he would argue about *epistemic* morality. He might contend that the internet doesn't just allow different morals; it destroys the *possibility* of a shared reality. If society requires a "community of ideas," and the internet fragments reality into algorithmic silos, then the "disintegration" Devlin feared is finally happening—not because people are gay or divorced, but because they no longer inhabit the same moral universe.
      *   *However,* Hart would retort that using the law to force a "shared reality" is totalitarian. The solution to fragmented morality is more speech and education, not state-mandated suppression of "harmful" ideas.

  ### Summary of the Debate

  If they were testifying on the LBH clause:

  *   **Devlin** would say: "The internet threatens the invisible bonds of society. If the ordinary person feels disgust at the lawlessness of the digital sphere, the state is entitled to use regulation to restore order. The LBH clause is a recognition that liberty cannot extend to self-destruction of the social fabric."
  *   **Hart** would say: "Where is the evidence that this specific content destroys society? You are enforcing a moral preference without proof of harm. Furthermore, by making platforms police 'legal' speech, you are creating a vague, unaccountable system of censorship that violates the principle that citizens should know clearly what the law forbids."

  **The Irony:** The UK government ultimately dropped the LBH duty for adults precisely because of Hart-like arguments (vagueness, threat to free speech, lack of clear definition of harm). They kept it for children, which shifts the debate to Paternalism (which Hart accepted) rather than Legal Moralism (which Hart rejected).

  In the end, the OSA saga proves Hart's warning: once you allow the state to legislate against "harm" that isn't criminal, the definition of harm inevitably expands to include "things that offend the moral sensibilities of the regulators." Devlin would call that necessary maintenance; Hart would call it the road to tyranny. Given the backlash that killed the LBH clause, the modern liberal democracy seems to have sided with Hart, at least for now.
