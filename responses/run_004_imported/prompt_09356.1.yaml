      *   *Mechanism:* Two AIs argue, human judge picks the winner.
      *   *Assumptions:*
          *   Judge is *weaker* than debaters (this is the point; otherwise, we wouldn't need debate).
          *   Incentive structure: Reward for *winning* the judge's approval, not necessarily truth (though truth is hoped to be the winning strategy).
          *   Constraints: Limited turns, specific rules.
