prompt: |-
  ok this is gonna sound super in the weeds but I've been chewing on it since my medieval islamic phil seminar and want an outside take before I commit to anything in my own paper. In the causality discussion of the Tahafut (the 17th, on natural science), Ghazali uses the cotton-and-fire case to argue theres no necessary connection between what we call a cause and its effect -- fire doesn't burn cotton, God just habitually creates the burning right after creating fire-touching-cotton, and since its logically possible for him to do otherwise (that's what makes miracles possible), the link is custom ('ada) rather than necessity. Averroes's reply in Tahafut al-Tahafut is basically that this move destroys the possibility of any real knowledge of nature, scientific or everyday, since you can't infer anything from anything if things don't have stable natures that necessitate their effects.

  Write me an essay that actually commits to an answer instead of just narrating both sides. It needs to settle two things: (1) does occasionalism survive Averroes's objection as a genuinely distinct, coherent position, or does it collapse into Humean skepticism about necessary connection with "God" bolted on as a label that's doing no real explanatory work -- i.e. could you strike every reference to God from Ghazali's account and be left with something extensionally identical to Hume on causation? and (2) doesn't Ghazali's own need for 'ada to be reliable enough to ground everyday expectation, and even science, smuggle back in exactly the kind of secondary causal power he's denying exists? Give me an actual verdict -- "occasionalism survives, but only as X" is fine, "no, because Y" is fine, just commit to something specific and defend it instead of hedging.
