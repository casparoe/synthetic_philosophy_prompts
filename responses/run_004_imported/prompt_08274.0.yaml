answer: |-
  Your physicist intuition is spot on. The standard "more is better" takeaway from the Condorcet Jury Theorem (CJT) relies on a hidden assumption: **homogeneous competence** (i.e., every voter has the same probability $p$ of being correct).

  When you introduce heterogeneous competence (different $p_i$ for each voter), the theorem does not guarantee that the majority vote is superior to the single most competent individual, especially in small groups. In fact, adding low-competence voters acts exactly like adding high-noise measurements to a precise signal: it degrades the signal-to-noise ratio.

  Here is the concrete 3-juror example you requested, with the numbers worked out explicitly.

  ### The Setup

  Let us define three independent jurors ($J_1, J_2, J_3$) voting on a binary truth (True/False). Let $p_i$ be the probability that Juror $i$ votes correctly.

  *   **Juror 1 (The Expert):** $p_1 = 0.90$
  *   **Juror 2 (The Sloppy):** $p_2 = 0.55$
  *   **Juror 3 (The Sloppy):** $p_3 = 0.55$

  **Constraints Check:**
  1.  **Independence:** We assume their errors are uncorrelated (we multiply probabilities).
  2.  **Better than Chance:** All $p_i > 0.50$.

  ### Scenario A: Rely on the Best Juror Alone

  If we ignore $J_2$ and $J_3$ and simply adopt $J_1$'s verdict, our probability of correctness is simply $p_1$.

  $$ P(\text{Correct}_{\text{single}}) = 0.90 $$

  ### Scenario B: Unweighted Majority Vote

  For the majority to be correct, at least two jurors must be correct. Since the jurors are independent, we sum the probabilities of all mutually exclusive winning combinations.

  There are four ways the majority wins:
  1.  **All three correct:** $J_1, J_2, J_3$
  2.  **Expert + Sloppy 1 correct:** $J_1, J_2$ (and $J_3$ wrong)
  3.  **Expert + Sloppy 2 correct:** $J_1, J_3$ (and $J_2$ wrong)
  4.  **Both Sloppies correct:** $J_2, J_3$ (and $J_1$ wrong)

  Let's calculate the probability for each case:

  1.  **All three correct:**
      $$ 0.90 \times 0.55 \times 0.55 = 0.27225 $$

  2.  **$J_1, J_2$ correct; $J_3$ wrong:**
      $$ 0.90 \times 0.55 \times (1 - 0.55) = 0.90 \times 0.55 \times 0.45 = 0.22275 $$

  3.  **$J_1, J_3$ correct; $J_2$ wrong:**
      $$ 0.90 \times (1 - 0.55) \times 0.55 = 0.90 \times 0.45 \times 0.55 = 0.22275 $$

  4.  **$J_2, J_3$ correct; $J_1$ wrong:**
      $$ (1 - 0.90) \times 0.55 \times 0.55 = 0.10 \times 0.3025 = 0.03025 $$

  **Total Probability of Majority Correct:**
  $$ P(\text{Correct}_{\text{majority}}) = 0.27225 + 0.22275 + 0.22275 + 0.03025 $$
  $$ P(\text{Correct}_{\text{majority}}) = \mathbf{0.748} $$

  ### The Comparison

  *   **Best Individual Accuracy:** $90.0\%$
  *   **Majority Vote Accuracy:** $74.8\%$

  By adding two independent voters who are individually better than chance, we have **reduced** the collective accuracy by over 15 percentage points.

  ### Why This Happens (The Error Analysis)

  As a physicist, you'll recognize this as a weighting problem. The majority vote weights the Expert's signal ($p=0.9$) equally with the Sloppy voters' noise ($p=0.55$).

  The system fails specifically when the Expert is right, but the two Sloppy voters *both* happen to be wrong. In that case, the majority overrides the truth.

  *   **Probability Expert is Right, but Outvoted:**
      $$ 0.90 \times (1-0.55) \times (1-0.55) = 0.90 \times 0.45 \times 0.45 = \mathbf{0.18225} $$
      *(You lose the Expert's correct verdict 18.2% of the time.)*

  *   **Probability Expert is Wrong, but Saved by Majority:**
      $$ (1-0.90) \times 0.55 \times 0.55 = 0.10 \times 0.3025 = \mathbf{0.03025} $$
      *(The sloppy voters correct the Expert only 3.0% of the time.)*

  **Net Effect:** You lose 18.2% of the Expert's reliability to gain back only 3.0%. The "noise" from the sloppy voters correlates against the "signal" of the expert often enough to drag down the total reliability.

  ### Conclusion

  Your skepticism is mathematically justified. The Condorcet Jury Theorem holds strictly only when competencies are identical. In heterogeneous groups (like a lab with varying equipment precision), an unweighted average is suboptimal. To maximize accuracy, you would need a **weighted voting scheme**, analogous to weighting measurements by inverse variance ($1/\sigma^2$). In this specific case, the optimal weight for $J_2$ and $J_3$ would effectively be zero.
