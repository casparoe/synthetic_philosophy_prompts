answer: |-
  Carl Menger would judge Bitcoin to be money.

  To be precise: he would recognize it as a valid instantiation of the economic category "money," provided it sustains the specific dynamic properties he identified as essential. He would arrive at this conclusion not by ignoring the lack of prior non-monetary use, but by prioritizing his core mechanism—the evolutionary selection for saleableness—over the specific material substrate of the good. While Ludwig von Mises later introduced the Regression Theorem to anchor money's value in commodity history, Menger's original 1892 account is fundamentally about the *process* by which a good becomes the common medium of exchange. On Menger's terms, Bitcoin is not a "conventional token" in the Searlean sense; it is a crystalline structure of liquidity formed through the exact decentralized gravitational pull Menger described.

  Here is the detailed working of that judgment, followed by what it implies for your metaphysical question.

  ### 1. Menger's Mechanism: Saleableness as an Order Parameter

  To understand why Menger would accept Bitcoin, we must look closely at his criteria for "saleableness" (or marketability). For Menger, money is not defined by state decree or social contract, but by its position in a hierarchy of liquidity. In a barter economy, agents face a "double coincidence of wants" problem. To solve this, they begin to trade their goods not for what they immediately consume, but for goods that are more *saleable*—goods they believe they can offload easily in the future.

  Menger identifies specific dimensions of saleableness that act as selection pressures on goods. A good becomes money if it maximizes these variables:

  1.  **Extent of Demand:** How many people want it?
  2.  **Spatial Limits:** How widely is it accepted geographically?
  3.  **Temporal Limits:** How stable is the demand over time?
  4.  **Divisibility:** Can it be broken into smaller units without loss of value?
  5.  **Transportability:** Is it easy to move?
  6.  **Durability:** Does it degrade over time?
  7.  **Cognizability:** Is it easy to verify authenticity?

  In your terms, these are the boundary conditions and interaction rules that determine the phase transition. In 1871, the goods that naturally optimized these variables were physical commodities (cattle, salt, metals). They had the requisite durability and divisibility, and crucially, they had non-monetary demand which anchored the "Extent of Demand."

  However, Menger's theory is functional, not ontological. He does not argue that money *must* be a metal; he argues that money is *whatever good* wins the competition for saleableness. The "trick" of emergence is that individuals, seeking only to minimize their own transaction costs (local optimization), collectively select a single medium (global order).

  ### 2. The Bitcoin Judgment

  If you placed Bitcoin before Menger, he would analyze it against his seven criteria.

  *   **Divisibility:** Bitcoin is perfectly divisible (to 8 decimal places), superior to gold or cattle.
  *   **Transportability:** It is information; it moves at the speed of light, vastly superior to physical commodities.
  *   **Durability:** As long as the network exists, the ledger is immutable. It does not rust or rot.
  *   **Cognizability:** Cryptographic verification removes the need for trust in the counterparty's assaying skills.
  *   **Extent/Spatial/Temporal Demand:** This is the variable. In 2010, demand was low. Today, it is global and persistent.

  Menger would observe that Bitcoin has undergone the exact evolutionary process he described. Early adopters did not accept Bitcoin because a state commanded it (Searle's status function), nor because they intended to create a global currency (collective intentionality). They accepted it because, within their specific niche, it was the most "saleable" asset available for settling transactions or storing value relative to the alternatives (fiat currency subject to inflation, or difficult-to-move gold).

  The "saleableness" of Bitcoin is not decreed; it is discovered. It emerged because enough local agents realized that holding Bitcoin reduced their friction in future exchanges. This is the Mengerian mechanism in pure form: the macroscopic order (a global monetary network) arising from microscopic interactions (individual trades) without a designer.

  ### 3. Addressing the Regression Theorem (The Mises Complication)

  This is the critical pivot. You rightly note Mises' Regression Theorem: money must have a price history rooted in non-monetary use. Gold was jewelry before it was money; Bitcoin was never anything but a potential medium of exchange. Mises argued that without that initial non-monetary anchor, there is no objective basis for the money's value today—it would be circular.

  However, you asked for **Menger's** judgment, not Mises'. Menger died before the Regression Theorem was formulated. Menger's account is descriptive and evolutionary; Mises' is praxeological and defensive (aimed at explaining why fiat money can't expand infinitely without breaking).

  Menger's focus was on the *emergence of the medium of exchange function*. He argued that the value of money is derived from its utility as a medium of exchange. While he assumed this utility would attach to a commodity, his logic does not strictly forbid the utility from attaching to a purely informational good, *provided* the network effect is strong enough to sustain the "saleableness."

  For Menger, the "value" of money is its liquidity. If a good is universally accepted because everyone believes everyone else will accept it, it has achieved the highest degree of saleableness. The "prior non-monetary use" was, in Menger's historical context, simply the mechanism that jump-started the demand. But if the demand can be jump-started by other means (e.g., cryptographic scarcity + ideological alignment + speculative liquidity), and if it sustains the *function* of reducing transaction costs, Menger's definition is satisfied.

  Menger would likely view the Regression Theorem as a specific historical observation about commodity money, not a universal law of the *concept* of money. He would argue that Bitcoin has established its own "regression": its value today is based on its saleability yesterday, which was based on its saleability the day before, tracing back to its genesis block. The "use" is the settlement assurance. To Menger, that counts as a use-value sufficient to anchor the emergence.

  Therefore, **Menger would commit:** Bitcoin qualifies as money because it is the unintended result of individuals selecting the most saleable good available to them, satisfying all functional criteria of saleableness better than historical commodities. The lack of prior non-monetary use is a novelty of the substrate, not a failure of the mechanism.

  ### 4. The Metaphysical Implication: Natural Kind or Social Kind?

  This judgment forces a resolution to your wider question: Is money a natural kind (like a crystal) or a social kind (like a border)?

  If Menger accepts Bitcoin, it strongly suggests that money is a **Natural Kind of Social Phenomenon**, or more precisely, an **Emergent Functional Kind**.

  Here is why this distinction matters for your physics background:

  **Against Searle (Social Kind):**
  John Searle argues that money exists only because of "collective intentionality"—we agree to treat paper as value. This is akin to saying a border exists because we drew a line on a map. If we stop believing, it vanishes instantly. If money were purely a Searlean social kind, Bitcoin should not exist. No central authority imposed it; no treaty recognized it. It has no "status function" declared by a sovereign. Yet, it functions as money. This falsifies the strong Searlean claim that money *requires* institutional declaration.

  **For Menger (Natural Kind):**
  Your intuition about condensed matter is the stronger model here. Money behaves like a phase of matter.
  *   **The Particles:** Economic agents.
  *   **The Interaction:** Trade/Exchange.
  *   **The Constraint:** Transaction costs (friction).
  *   **The Phase:** Money.

  Just as water molecules spontaneously arrange into a hexagonal lattice (ice) when temperature drops below a threshold, economic agents spontaneously arrange around a common medium (money) when transaction friction exceeds a threshold. The "lattice" of money is not designed; it is the lowest-energy state of the trading system.

  Bitcoin confirms this. It is a "crystal" growing in a digital solution. Its structure is determined by the code (the laws of physics for that system) and the market pressure (thermodynamics). It does not require a king to declare it ice; it requires only that the conditions for crystallization (demand for saleability) are met.

  **The Synthesis:**
  Money is not a "brute fact" of nature like a rock (which exists without humans), nor is it a "social fact" like a marriage license (which exists only by declaration). It is an **emergent property of a complex adaptive system**.

  In physics, we do not ask if a vortex is "real" or "constructed." It is a real structure that emerges from fluid dynamics. You cannot touch a vortex without touching the water, but the vortex has properties (rotation, stability) that the water molecules do not. Similarly, money is a structure that emerges from human interaction. It has properties (liquidity, purchasing power) that individual agents do not possess.

  **Conclusion:**
  Menger would tell you that Bitcoin vindicates the view that money is a **natural emergent order**. It demonstrates that the "moneyness" of an object is not inherent in its physical substance (gold vs. paper vs. bits), nor is it solely dependent on collective belief (Searle). Instead, "moneyness" is a **dynamic state** that a good enters when it minimizes the transaction costs of a network.

  Bitcoin is the ultimate proof of Menger's thesis: you can strip away the state, the commodity history, and the physical substance, and if the dynamics of saleableness are present, the "crystal" of money will still form. It suggests that money is as much a law of nature (specifically, the nature of information and exchange) as it is a social convention. It is a phase transition in human cooperation.
