answer: |-
  This is a fantastic detail for a novel. Russell's *Marriage and Morals* was indeed a lightning rod in that specific period (published 1929, prosecuted for obscenity in the US in 1930), and having a character who grasps the *mechanics* of his argument rather than just the slogan makes her intellectually formidable.

  The difficulty you are having is understandable. Russell is compressing a sociological, psychological, and historical argument into a single paragraph. He is moving from **observation** (the wife/mistress dynamic) to **psychological motivation** (egoism) to **historical consequence** (subjection).

  Here is the breakdown of the logic chain, followed by a suggestion for how your character might voice it.

  ### 1. The Logic Chain

  **Step 1: The Thesis (Jealousy is not primarily instinctive)**
  Russell starts by challenging the assumption that jealousy is a raw, biological emotion like hunger or fear. If it were purely instinctive, it would correlate directly with sexual passion or emotional attachment.

  **Step 2: The Evidence (The Wife/Mistress Paradox)**
  This is the pivot point that confused you. Russell uses the wife/mistress example to *prove* Step 1.
  *   **The Assumption:** If jealousy were instinctive/emotional, the man would be most jealous regarding the woman he loves most (the mistress).
  *   **The Reality:** He is most jealous regarding the woman he is tied to legally/dynastically (the wife).
  *   **The Deduction:** Therefore, the jealousy regarding the wife is not driven by the "instinct" of love, but by something external to emotion. It is driven by **interest**.

  **Step 3: The Motivation (The Ego and Descent)**
  Why does he have an "interest" in the wife's fidelity if he doesn't love her? Russell explains this with the "ego" sentence. This is not a rhetorical flourish; it is the psychological engine of the argument.
  *   In a patriarchal system, children are not just children; they are property and extensions of the father's self ("continuation of a man's ego").
  *   The father's love for the child is "egoism"—he loves the child because the child is *his*.
  *   Therefore, the wife is not guarded because she is loved, but because she is the **vessel of the ego**.

  **Step 4: The Risk (Falsification of Descent)**
  If the child is not legitimate, the man's egoism is misplaced. He is "tricked." He invests resources, name, and affection into a stranger's genetic line. This is an economic and psychological loss.

  **Step 5: The Conclusion (The "Hence")**
  This is the hardest step. How does the *discovery* of fatherhood lead to *subjection*?
  *   **The Biological Asymmetry:** A mother always knows the child is hers. A father never knows for certain unless he controls the mother.
  *   **The Necessity of Control:** Once men realized their biological role (the "discovery of fatherhood"), they realized that to secure their "ego" (their lineage/property), they had to guarantee the wife's sexual exclusivity.
  *   **The Method:** The only way to guarantee exclusivity in an era before DNA testing is to restrict the woman's freedom. She must be physically confined (the harem, the home) and mentally conditioned (virtue, modesty) to ensure she does not stray.
  *   **The Result:** The subjection of women is not a natural state; it is a security measure implemented by men to protect their paternal certainty.

  ### 2. How to Paraphrase This in Character

  Your character needs to sound like she has absorbed Russell's rationalist, slightly cold, analytical style. She shouldn't sound like she's reciting a textbook, but rather dismantling the sister-in-law's moralizing with a sharper, harder truth.

  The sister-in-law is arguing for the "sanctity of the home" (a moral/spiritual argument). Your character should counter with a "property/psychology" argument (a materialist argument).

  **Key Russellian notes for the voice:**
  *   Avoid emotional language; use structural language (e.g., "mechanism," "security," "investment").
  *   Treat "virtue" not as a spiritual good, but as a method of policing.
  *   Treat "jealousy" not as a passion, but as a guard dog for property.

  **Drafting the Scene Beat:**

  > "You speak of the sanctity of the home as if it were a temple," she said, tapping the cover of Russell's book. "But Bertrand puts it rather more plainly. He asks us to look at the jealous husband. If jealousy were truly a matter of the heart, a man would guard his mistress more fiercely than his wife, for he is often devoted to the one and merely tired of the other. Yet he does not. He guards the wife."
  >
  > "Because he honours his vows," the sister-in-law interjected.
  >
  > "Because he honours his ego. Russell argues that for a man, a legitimate child is a extension of his own self—a piece of his own immortality. If that child is not his, he is being tricked into lavishing care on a stranger. The jealousy isn't about love, Elsie. It's about the fear of falsified descent. And that is why women were subdued. Not for their own protection, but because once men understood fatherhood, they realized the only way to secure their own lineage was to lock us away. The 'virtue' you prize is simply the lock on the cage."

  ### 3. Why this works for your purpose

  1.  **It captures the Wife/Mistress logic:** It explicitly states that the discrepancy in jealousy proves it isn't about love ("If jealousy were truly a matter of the heart...").
  2.  **It clarifies the Ego:** It translates "continuation of ego" into "extension of his own self/immortality," which makes the psychological stake clear.
  3.  **It justifies the "Hence":** It connects the need for certainty ("secure their own lineage") directly to the method ("lock us away").
  4.  **It fits the 1930s Bloomsbury vibe:** It is provocative, slightly shocking to the conservative ear, and treats marriage as a social construct rather than a divine ordinance.

  This allows your character to show she understands that Russell isn't just saying "jealousy is bad," but rather "jealousy is a structural tool of patriarchy." That is the specific grain of the argument you were looking for.
