answer: |-
  The relationship between the propensity interpretation of probability and the broader concept of objective single-case chance is best understood as that of a specific metaphysical implementation to a general ontological category. While all propensity theories are theories of objective single-case chance, not all theories of objective single-case chance are propensity theories.

  The central philosophical question is whether the propensity interpretation's appeal to **dispositional properties** and **causal structures** is a necessary feature of objective chance, or whether it adds substantive ontological commitments that other single-case accounts (specifically **chance primitivism**) avoid. By applying **Humphreys' Paradox**, we can demonstrate that the propensity interpretation incurs a unique metaphysical cost: it struggles to reconcile the asymmetry of causation with the symmetry of the probability calculus. Broader single-case accounts that sever the link between chance and causation can evade this paradox, suggesting that propensity theory is indeed a substantively heavier commitment than single-case chance requires.

  ### 1. Objective Single-Case Chance: The Minimal Commitment

  To understand the difference, we must first define the genus: **Objective Single-Case Chance**.

  This view holds that probabilities are real, mind-independent features of individual events (tokens), not merely frequencies of event types or degrees of belief. For example, the claim "The chance of *this* specific radium atom decaying in the next hour is 0.5" is true or false regardless of whether the atom actually decays, regardless of how many other atoms exist, and regardless of what anyone believes.

  The **minimal commitment** of this view is ontological realism about chance values. It requires that:
  1.  Chances attach to singular occurrences.
  2.  Chances constrain rational credence (via the Principal Principle).
  3.  Chances are distinct from actual frequencies (a coin can have a chance of 0.5 even if it lands heads 100 times in a row).

  Crucially, the "minimal" single-case account does not specify *what grounds* these chances. It treats chance as a fundamental magnitude, analogous to mass or charge. This view is often called **Chance Primitivism**. For the primitivist, chance is a brute fact of the world that does not require analysis in terms of dispositions, tendencies, or causal powers.

  ### 2. Propensity Theory: The Dispositional Addition

  The **Propensity Interpretation**, most famously associated with Karl Popper, is a specific strategy for "cashing out" single-case chance. It argues that chance values are not brute; they are grounded in the **dispositional properties** of the physical setup.

  On this view, a probability is a **propensity**: a real, physical tendency inherent in a specific set of conditions to produce a certain outcome. If a coin has a single-case chance of 0.5, it is because the coin-tossing setup possesses a symmetric disposition to produce heads or tails.

  This adds **substantive commitments** beyond minimal single-case chance:
  1.  **Dispositional Ontology:** It requires the existence of irreducible dispositions or powers in nature.
  2.  **Causal Generativity:** It links chance to causation. Propensities are typically viewed as causal tendencies that *produce* outcomes. The probability is a measure of the causal strength of the setup.
  3.  **Explanatory Direction:** It posits that chances explain frequencies (stable long-run frequencies occur *because* of the underlying propensity), rather than chances being defined by frequencies.

  Therefore, propensity theory is not merely "one way" of describing single-case chance; it is a theory that enriches single-case chance with a specific causal-dispositional metaphysics. The question is whether this enrichment is a feature or a bug.

  ### 3. Humphreys' Paradox as a Stress Test

  **Humphreys' Paradox** (1985) provides the sharpest tool for distinguishing these views. The paradox argues that propensities cannot be probabilities because they possess incompatible structural properties regarding time and inversion.

  **The Argument:**
  1.  **Probabilities are Invertible:** The mathematical calculus of probability (specifically Bayes' Theorem) allows for inversion. If $P(A|B)$ is defined, then $P(B|A)$ is mathematically derivable. The relationship is formally symmetric.
  2.  **Propensities are Causal/Asymmetric:** Propensities are physical dispositions to *produce* outcomes. Causation is temporally asymmetric: causes precede effects. A setup has a propensity to produce an outcome, but an outcome does not have a propensity to produce its past causes.
  3.  **The Conflict:** If propensities *are* probabilities, then $P(\text{Effect}|\text{Cause})$ and $P(\text{Cause}|\text{Effect})$ should both represent propensities. However, while the setup may have a propensity to yield an effect, the effect cannot have a propensity to yield the setup (backward causation is generally rejected).
  4.  **Conclusion:** Therefore, propensities do not obey the probability calculus (specifically the rule of inversion). If they don't obey the calculus, they aren't probabilities.

  ### 4. Sharpening the Comparison via the Paradox

  Applying Humphreys' Paradox reveals the substantive cost of the propensity interpretation compared to broader single-case accounts.

  #### The Propensity Theorist's Dilemma
  For the propensity theorist, the paradox is devastating because their definition of chance relies on the causal/dispositional link. To save the theory, they must either:
  *   **Deny the Probability Calculus:** Claim that propensities follow a different mathematical logic than standard probability. This undermines the utility of probability theory in physics.
  *   **Deny the Causal Link:** Claim that propensities aren't truly causal. But this strips the theory of its main motivation (explaining *why* chances exist).
  *   **Accept Backward Propensities:** Claim that effects have propensities to produce causes. This is metaphysically extravagant and scientifically unsupported.

  Popper himself struggled with this, eventually suggesting that conditional propensities might not be invertible. But this admission concedes that propensities are not standard probabilities.

  #### The Chance Primitivist's Escape
  Consider the **Chance Primitivist** (the broader single-case account). This theorist agrees that there are objective single-case chances, but **denies that chances are causal dispositions.**

  For the primitivist:
  *   Chance is a fundamental physical magnitude.
  *   While chances often align with causal directions (the chance of decay follows the existence of the atom), the *mathematical nature* of chance is not tied to causal production.
  *   $P(\text{Cause}|\text{Effect})$ is a valid single-case chance value, even if it does not represent a "backward disposition." It represents the objective likelihood of the cause given the effect, grounded perhaps in the laws of nature, without requiring a physical "tendency" flowing backward in time.

  Because the primitivist severs the identity **Chance = Disposition**, Humphreys' Paradox does not apply. They can maintain that single-case chances obey the standard probability calculus (including Bayes' Theorem) without committing to backward causation or dispositional asymmetry. For them, the invertibility of probability is a formal feature of the magnitude "chance," not a claim about causal powers.

  ### 5. Conclusion: Substantive Commitments Confirmed

  The comparison demonstrates that propensity theory is not merely a neutral explication of single-case chance; it is a metaphysically loaded subset of it.

  1.  **Single-Case Chance** requires only that probabilities are real, token-level features of the world.
  2.  **Propensity Theory** adds the commitment that these features are **dispositional powers** linked to **causal production**.

  Humphreys' Paradox proves that this additional commitment is costly. By identifying chance with causal disposition, the propensity theorist creates a conflict between the metaphysics of causation (asymmetric) and the mathematics of probability (symmetric). The broader single-case account (Primitivism) avoids this conflict by treating chance as a brute magnitude that supervenes on the physical state without necessarily *being* a causal power.

  Therefore, propensity theory adds substantive commitments that other single-case accounts avoid. While propensity theory offers an intuitively appealing picture of "tendencies" generating outcomes, Humphreys' Paradox suggests that this appeal comes at the price of mathematical coherence. A theorist who wants objective single-case chances without the paradox is better served by a primitivist account that accepts chances as real but refuses to reduce them to causal dispositions.
