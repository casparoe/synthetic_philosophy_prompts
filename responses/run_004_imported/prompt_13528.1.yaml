      *   **Key Context:** The parents delayed conception for 3 years due to money and climate anxiety. The mother feels guilt that she "made Elena wait" or "took three years from her."
      *   **Philosophical Core:** Derek Parfit's Non-Identity Problem.
          *   *Argument:* If they had conceived earlier, it would have been a different sperm/egg combination, hence a different child. Therefore, Elena cannot claim she was harmed by the delay, because without the delay, *she* wouldn't exist.
          *   *Caveat:* The speaker acknowledges this doesn't solve the *moral* question of whether it was right to base the decision on fear, but it does dissolve the specific guilt about "harming Elena."
      *   **Tone:** Warm, spoken aloud, not overly clever/academic, 2-3 minutes.
