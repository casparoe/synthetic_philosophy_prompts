  The kitchen light hummed, a low-voltage buzz that seemed to vibrate in the space between the bottle on the table and Leo's hand hovering above it. Three weeks. That was the number Mireille kept running in her head. Twenty-one days of neural rewiring, undone in twenty-one seconds.

  She didn't reach for the bottle. She pulled out the chair opposite him and sat, folding her hands on the Formica.

  "Leo, listen to me. You're telling yourself you're weak. You're telling yourself there's a 'you' that wants sobriety and a 'you' that wants this," she nodded at the whiskey, "and the second one is bullying the first. That's the story your brain is writing to make sense of the chemistry. But it's wrong. There is no bullying. There is no weakness."

  Leo's jaw tightened. "Don't do this, Mir. Don't turn me into a spreadsheet. I know what I'm doing. I know I shouldn't."

  "That's exactly what I'm talking about," Mireille said, her voice low, steady. "You think 'I know I shouldn't' is a stable fact. It's not. It's a valuation. And valuations change based on temporal proximity. You're experiencing hyperbolic discounting. It's not a moral failure; it's a mathematical certainty given your current reward sensitivity."

  "So I'm not choosing?" Leo snapped. "It's just math?"

  "You are choosing. You are always maximizing utility. That's the point. There is no *akrasia*, Leo. There is only preference reversal over time. Three weeks ago, Future-Leo's health was worth more than Present-Leo's relief. The discount rate was low. But as you get closer to the stimulus, the curve spikes. The value of the drink *right now* inflates violently. The value of the health *later* collapses. At this exact second, given your internal discount function, drinking *is* the rational choice. You are maximizing your present utility perfectly."

  "That's insane," Leo said, his hand trembling slightly. "If it's rational, why does it feel like I'm betraying myself? Davidson talked about this. He said weakness of will is acting against your own all-out judgment. I am judging, right now, unconditionally, that sobriety is better. I'm not saying 'sobriety is better if I don't drink.' I'm saying 'Sobriety is best.' Period. And I'm drinking anyway. That's the contradiction. That's the mystery your curves don't explain."

  Mireille leaned forward. "Davidson assumes the judgment is a static object you carry in your pocket. It's not. It's a state of neural activation that decays. When you say you judge sobriety best 'unconditionally,' you're reporting on a judgment made by a past self at a different point on the time horizon. You're quoting yourself."

  She tapped the table. "At the millisecond of action, you cannot hold two contradictory valuations. If you lift that glass, it is because, in that precise moment, the neural weight of 'relief' has exceeded the neural weight of 'health.' Your 'all-out judgment' is just a verbal report that hasn't caught up with your reward system. Davidson wants to save the idea of a unified self that can be inconsistent. I'm telling you the self isn't unified. It's a sequence of temporal slices. The Leo of three weeks ago made a plan for the Leo of tonight. But the Leo of tonight has different data. He has stress. He has craving. He has a steep discount curve. To say you're violating your judgment is to pretend the Leo from three weeks ago is still driving the car. He's not. You are. And you're driving based on the terrain in front of you, not the map he drew."

  Leo looked down at the bottle. "Okay. Fine. Maybe the judgment shifts. But what about the promise? I made a resolution. Holton wrote about this. He said weakness of will isn't about judgment at all. It's about failing to stick to a resolution even when you haven't changed your mind. I can still think sobriety is best, and still fail to maintain the intention to pursue it. That's a failure of will, not a change in preference. Your discount curve explains why I want the drink more. It doesn't explain why I couldn't just... hold the line."

  "Holton is closer," Mireille admitted. "But he still reifies 'will' as a distinct faculty. A muscle. Like you're supposed to just 'hold' the resolution. But what is a resolution, Leo? Economically, it's a pre-commitment device. It's an attempt to bind your future self to a course of action. It's a contract."

  She paused, letting the word hang.

  "When you break a resolution, you aren't failing a moral duty. You're renegotiating a contract under duress. The 'cost' of maintaining the resolution—the cognitive load, the emotional strain, the craving—has risen above the discounted value of the payoff. Holton calls it a failure to retain the intention. I call it a liquidity crisis. You don't have the cognitive capital to service the debt of that resolution right now."

  Leo let out a short, bitter laugh. "So I'm bankrupt. Great. That makes me feel so much better about pouring a drink."

  "No," Mireille said sharply. "It means you're looking at the wrong variable. If *akrasia* is real, if it's some ghostly weakness in your soul, then the solution is to exorcise it. To try harder. To be 'stronger.' And we know how that ends. You try harder, you fail, you shame yourself, the shame increases the discount rate, and you drink more to numb the shame."

  She reached out, finally, and placed her hand over his. She didn't push the bottle away. She just anchored him.

  "But if I'm right, if there is no weakness, only a discount function... then this isn't a character flaw. It's a design error. You are a machine designed for short-term survival in a scarcity environment, trying to operate in a long-term abundance environment. The curve is steep because your brain is screaming that you need this to survive *now*. The mystery isn't why you're drinking. The mystery is why you thought you could out-negotiate a biological imperative with a verbal resolution."

  Leo looked at her, his eyes wet. "So what do I do? If I'm just maximizing, why stop?"

  "Because you can change the constraints," Mireille said. "You can't change the curve in this moment. The craving is too high. The discount rate is locked. But you don't have to accept the parameters of the choice. Davidson thinks you have to align your action with your judgment. Holton thinks you have to align your action with your resolution. I'm telling you to align your environment with your biology."

  She gestured to the bottle.

  "If you drink, you aren't weak. You're predictable. You're a human animal responding to a stimulus with a high immediate yield. But the Leo of tomorrow morning? He's going to have a flatter discount curve. He's going to value the future more. So you don't fight the Leo of tonight. You let him step away. You put the bottle down, not because you've suddenly judged it 'bad'—you won't believe that until the morning—but because you're outsourcing the decision to a self that isn't currently hijacked."

  She squeezed his hand.

  "There is no war inside you, Leo. There's just a timeline. Don't let the self that's drowning make decisions for the self that's learning to swim. Put it down. Not because it's wrong. But because the terms of the deal are rigged."

  Leo stared at the amber liquid. The hum of the light seemed to fade. He didn't look like a man conquering a demon. He looked like a man calculating a variable. Slowly, the tension in his shoulder dropped. He pulled his hand from hers, capped the bottle, and set it on the far counter, out of immediate reach.

  "Rigged," he whispered.

  "Predictable," Mireille corrected softly. "And if it's predictable, we can plan for it."
