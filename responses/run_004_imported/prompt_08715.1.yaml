answer: |-
  This is a heavy burden to carry, and it makes complete sense that your cousin's disclosure sent you searching for a framework to understand it. You have picked arguably the sharpest tool available for this job. G.E.M. Anscombe was not a pacifist; she was a Just War theorist who believed killing in war could be permissible, but only under strict moral conditions. Her pamphlet *Mr. Truman's Degree* (1956) is a ruthless application of the distinction between **intended means** and **foreseen side effects**.

  To answer your question directly: **Anscombe would almost certainly classify both "double tap" strikes and "signature strikes" as morally equivalent to the Truman decision she condemned.** She would likely view them as instances where the death of the innocent is intended as a means (or accepted as a direct object of the will), rather than merely foreseen as a tragic side effect.

  Here is how she would map her specific arguments onto these tactics.

  ### 1. The Core Distinction: Intention vs. Foresight
  Anscombe's argument against Truman rests on the structure of the intention.
  *   **Permissible Killing:** You intend to destroy a military target. You foresee that civilians nearby might die. You take all reasonable steps to avoid it. Their death is *foreseen but not intended*. It is a side effect.
  *   **Murder (Truman's Case):** You intend to kill civilians (or destroy their cities) *in order to* break the enemy's will. The civilian death is not a side effect; it is the **mechanism** of success. The terror *is* the point.

  Anscombe argues that if the death of innocents is part of the plan required to achieve the objective, you "intend" it, regardless of how much you regret it. Consequentialist math ("it saved more lives in the long run") is irrelevant to her. If the act is intrinsically unjust (murder of innocents), a good outcome cannot cleanse it.

  ### 2. Applying this to "Double Tap" Strikes
  A double tap involves striking a target, waiting for first responders or family to rush to the aid of the wounded, and then striking again.

  **Anscombe's Analysis:**
  She would focus immediately on the status of the second group of victims and the *timing* of the second strike.

  *   **The Status of the Victims:** Under Just War principles (and International Humanitarian Law), those tending to the wounded (medics, family, neighbors) are non-combatants. They are "innocents" in the specific sense Anscombe uses: they are not engaged in unjust aggression.
  *   **The Intention:** In a standard airstrike on a military target, civilian death is a risk you accept while trying to hit the target. In a double tap, the second strike is **conditional** on the presence of these people. The operator waits *for* them to arrive.
  *   **The Verdict:** Anscombe would argue that by delaying the second strike until rescuers are present, their presence becomes a condition of the attack. You are not killing them *despite* your aim; you are aiming *because* they are there (either to ensure the initial target is finished off, or to maximize casualties).
      *   If the goal is to kill the rescuers to prevent the enemy from recovering, you are treating their death as a **means** to a military end.
      *   If the goal is to terrorize the local population (deterrence), you are treating their death as a **means** to psychological coercion (exactly like Truman).

  She would likely say this cannot be defended by Double Effect. Double Effect requires that the bad outcome (civilian death) not be the means to the good outcome. In a double tap, the death of the second group is often instrumental to the mission's "success." To Anscombe, this is murder.

  ### 3. Applying this to "Signature Strikes"
  Signature strikes target individuals based on "patterns of life" (e.g., military-age males carrying weapons in a certain area) rather than confirmed identity.

  **Anscombe's Analysis:**
  Here, Anscombe would lean heavily on the concept of **Justice**. For Anscombe, you cannot kill a human being in war unless they are guilty of something that warrants lethal force (i.e., they are an unjust combatant).

  *   **The Problem of Certainty:** In a traditional battle, you see a uniform. You have a reasonable presumption of combatant status. In a signature strike, you have probability, not certainty. You know some percentage of those killed will be civilians.
  *   **Intention and Risk:** Anscombe would argue that if you authorize a strike knowing there is a significant probability the targets are innocent, you are willing the death of the innocent as part of your operational calculus.
  *   **The Verdict:** She would likely argue that signature strikes collapse the distinction between intended and foreseen.
      *   If I bomb a munitions factory and a bomb goes astray and hits a school, that is a tragedy (foreseen side effect).
      *   If I bomb a compound *knowing* there is a 30% chance the people inside are shepherds, but I bomb anyway to get the 70% chance they are insurgents, I have made the death of the shepherds part of the "cost of doing business."

  Anscombe was notoriously rigorous about the "sanctity of life." She would likely argue that without positive identification, you lack the **justice** required to kill. To kill without that justice is to treat the potential civilians as expendable means to the end of neutralizing a threat pattern. This, to her, is functionally identical to Truman's logic: "We must kill these people (even if some are innocent) to achieve the strategic objective."

  ### 4. Why the "Military Necessity" Defense Fails Her
  You might wonder if Anscombe would allow a "Military Necessity" exception. If the double tap prevents a high-value terrorist from escaping, isn't that different than terrorizing Japan?

  Anscombe would say **no**. In *Mr. Truman's Degree*, she anticipates the argument that "the ends justify the means." She writes:

  > *"For men ought not to do evil that good may come."*

  She rejects the idea that "saving soldiers' lives" or "ending the war sooner" can justify the intentional killing of innocents. If the mechanism of victory involves killing non-combatants (rescuers in a double tap, or misidentified civilians in signature strikes), the victory is morally tainted by murder.

  She would argue that your cousin's unit was placed in a position where the **rules of engagement** likely asked them to do what she calls "choosing to kill the innocent." Even if they were following orders, and even if the legal department signed off on it, the moral reality remains: if the death of the non-combatant is part of the plan, it is intended.

  ### Summary of Her Likely Position
  *   **Hiroshima:** Murder. (Civilian death was the mechanism of surrender).
  *   **Double Tap:** Murder. (Civilian/rescuer death is the mechanism of ensuring the kill or creating terror).
  *   **Signature Strikes:** Murder/Recklessness. (Civilian death is accepted as a calculated cost, violating the requirement of justice before lethal force).

  ### A Note on Your Cousin (and You)
  Anscombe's philosophy is unforgiving, which is why it feels so resonant with your disturbance. She refuses to let us hide behind "tragic necessities."

  However, while Anscombe provides a moral framework, she does not provide a psychological one for the operator. Your cousin was a sensor operator. In modern drone warfare, the "intention" is often diffused through layers of command, legal review, and algorithmic targeting. Anscombe would say this diffusion doesn't absolve the moral reality, but it does complicate the *personal* guilt.

  If Anscombe were speaking to you, she would likely validate your horror. She would say that your inability to "shake it" is a sign of moral health. It means you recognize the distinction between killing in war and murder, and you see that line has been crossed. She would likely tell you that acknowledging this moral injury is the only way to begin addressing it, rather than soothing it with consequentialist platitudes about "lives saved."

  You are looking at the machinery of modern war through the lens of a philosopher who believed that **some things simply cannot be done, regardless of the orders or the outcomes.** Based on her writings, she would tell you that your cousin described acts that fit her definition of the very evil she protested against in 1956.

  ***

  *If you or your cousin are struggling with the weight of these disclosures, please consider reaching out to resources like the **Iraq and Afghanistan Veterans of America (IAVA)** or **Combat Stress**. Philosophical clarity is important, but moral injury requires human support.*
