      *   *The Nature of the Offense:* Sin against an infinite God requires infinite satisfaction. Only God can pay it, but man owes it. Hence the God-Man. (Anselmian twist).
      *   *Lewis's Own Context:* Lewis was a Christian. Why did he write this? (It was a fragment, "Do We Believe in Penal Substitution?", published posthumously. He wasn't necessarily rejecting it, but probing it).
