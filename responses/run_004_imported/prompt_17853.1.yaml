  5.  **Structuring the Essay:**
      *   **Title:** Needs to be punchy and philosophical.
      *   **Introduction:** Set the scene (Lewis's paper, the Marcus/User debate), state the thesis (Lewis identifies a real tension, but fails to prove incoherence because he assumes a strictly individualistic retributivism that PSA explicitly rejects via representation).
      *   **Section 1: The Lewis/Marcus Case (The Fungibility Gap).** Explain the debt vs. punishment distinction clearly. The whipping boy analogy.
      *   **Section 2: The "Cosmic Ledger" Trap.** Address the user's specific counter-argument and why Marcus was right to swat it down (makes justice arbitrary).
      *   **Section 3: Saving PSA - The Representation Move.** This is the key. Shift from "stranger substitution" to "corporate headship." Legal representation isn't a category error; it's a different legal framework.
      *   **Section 4: The Victim-Judge Identity.** God isn't just a neutral judge; He is the offended party. This changes the rules of pardon/substitution.
