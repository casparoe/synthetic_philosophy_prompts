  6.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Acknowledge Lewis's paper ("Do We Believe in Penal Substitution?"). It's short, unfinished. Marcus is channeling Lewis well.
      *   *The Distinction:* Debt = transferable obligation. Punishment = personal liability. Lewis is right about *human criminal law*. But is divine justice human criminal law?
      *   *The User's Ledger:* Marcus killed this one. If suffering is just a commodity, justice is sadistic. Need to avoid this.
      *   *The Strongest Defense:* **Covenantal Representation.** In law, a guarantor *can* pay a debt. In war, a surrender by the General counts for the soldiers. PSA relies on Christ as the "Last Adam." If humanity is a corporate entity, the Head suffering counts for the Body. This answers the "whipping boy" critique—the Prince *is* the Whipping Boy in a metaphysical sense (Incarnation/Union).
      *   *The Victim Factor:* In human law, I can't punish you for my assault on Bob. But if Bob is the Judge *and* the Victim, Bob can accept restitution from Charlie.
      *   *Verdict:* Lewis wins on *intuition* (it feels wrong), but loses on *logic* (it's not contradictory if you accept the premises of representation). However, the essay needs to *commit*. I will argue that Lewis identifies a fatal flaw in *popular* formulations (which often mix metaphors sloppily), but *technical* Reformed formulations (union with Christ) survive. Actually, to be more decisive: I will argue that Lewis is right that *pure* penal substitution is incoherent, but PSA is never offered as *pure* penal substitution; it's always hybridized with satisfaction/representation. Therefore, Marcus is right that the *popular* version is broken, but the *theological* version survives by changing the subject slightly.
      *   *Wait, I need to pick a side.* Let's go with: **Lewis is right about the concept of punishment, but wrong that PSA relies solely on that concept.** PSA is actually a hybrid of Satisfaction (Anselm) and Representation. If treated as pure criminal punishment, it fails. If treated as covenantal satisfaction, it holds. I will conclude that Marcus is mostly right about the *logic of punishment*, but the doctrine survives by shifting to the *logic of covenant*.
      *   *Refining the Verdict:* I want to be bold. Lewis's argument is decisive *against* a specific caricature of PSA. But against the robust doctrine (Union with Christ), it fails. I will argue that the doctrine is coherent *only if* it abandons the strict criminal law analogy Lewis attacks. So, Lewis wins the battle (the analogy is broken), but the doctrine survives the war (by changing the analogy).
      *   *Actually, the prompt asks: Does Lewis's distinction succeed in showing PSA is conceptually incoherent?* I should answer Yes or No.
      *   *Decision:* I will argue **No.** Lewis's distinction holds for *human criminal justice*, but fails to account for *divine covenantal representation*. The incoherence is only apparent if one assumes divine justice must mirror modern secular criminal law.

  7.  **Polishing the Argument:**
