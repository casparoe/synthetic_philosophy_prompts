answer: |-
  Here are 10 interview questions designed to push past the textbook summary of Kant's animal ethics, including the specific topics you requested. Each includes a "Likely Response & Follow-up" section to help you pivot based on his answer.

  ### 1. The "Old Dog" Tension
  **Question:** In the *Lectures on Ethics*, Kant says we shouldn't shoot a dog once it has served us faithfully and can no longer work, because it would be like dismissing a servant without a pension. He uses language that sounds remarkably like the dog is *owed* a reward for services rendered. If the duty is truly only to ourselves, why does the dog's past service create a specific obligation regarding *that specific dog*, rather than just a general duty to be a grateful person?

  *   **Likely Response:** He will likely say the obligation is to uphold the *virtue of gratitude* within oneself, and the dog is just the occasion for exercising that virtue.
  *   **Follow-up:** "But if the virtue is internal, couldn't I cultivate gratitude by thanking the dog and then putting him down painlessly? Why does the *preservation of the dog's life* specifically seem to be the requirement if the dog has no moral standing to claim that life?"

  ### 2. The Marginal Cases Problem
  **Question:** Kant grounds direct moral status in rational autonomy. But human infants and adults with severe cognitive disabilities don't possess rational agency in the present tense. Kantians often argue they are protected because they belong to the *species* of rational beings or have the *potential* for rationality. Isn't this moving the goalposts? If the moral shield is "rationality," why does "species membership" get to act as a proxy when the actual criterion is missing?

  *   **Likely Response:** He may argue that we treat them as ends-in-themselves because they are capable of being objects of *moral love* or that harming them violates the humanity in our own persons.
  *   **Follow-up:** "If we can grant direct protection to a non-rational human based on 'humanity,' why can't we grant protection to a highly social, emotional non-human animal based on their capacity for suffering? What is the morally relevant difference between a severely disabled human and a pig, other than DNA?"

  ### 3. The Korsgaard Challenge
  **Question:** Christine Korsgaard argues in *Fellow Creatures* that she isn't revising Kant but completing him. She argues that if we are ends-in-ourselves because things can be *good or bad* for us, then animals, for whom things can also be good or bad, must have moral standing too. She claims the 'indirect duty' view is a dodge. Do you think she is misreading the *Groundwork*, or is she right that Kant's own premises about 'natural goods' inadvertently grant animals direct status?

  *   **Likely Response:** He will likely say Korsgaard conflates "natural goodness" (well-being) with "moral goodness" (autonomy), and that only the latter generates duties.
  *   **Follow-up:** "But if I can violate an animal's natural good (cause pain), and that act dulls my moral sensibility, doesn't the animal's natural good become the *condition* for my moral duty? If their suffering is the trigger for my vice, aren't they a direct part of the moral equation?"

  ### 4. Defining "Wanton" Cruelty
  **Question:** Kant condemns "wanton" cruelty but permits using animals for human ends. In a modern context, where factory farming and animal testing are systemic and regulated, very little cruelty is 'wanton' in the sense of being gratuitous or angry; it's instrumental. If I torture a dog for fun, that's wanton. But if I confine a pig for food, that's instrumental. Does the Kantian view effectively give a moral free pass to *any* suffering, no matter how severe, as long as there is a human benefit attached to it?

  *   **Likely Response:** He will likely argue that "necessity" limits the instrumental use, and that causing unnecessary suffering is still wanton.
  *   **Follow-up:** "Who defines necessity? If I enjoy the taste of meat, is that a 'necessary' human end? If the threshold for overriding animal suffering is just 'human preference,' doesn't the prohibition on wanton cruelty become almost empty?"

  ### 5. The Empirical Claim of Character Hardening
  **Question:** The core of the indirect duty view is empirical: cruelty to animals makes us cruel to humans. But psychological research on the link between animal abuse and human violence is mixed; some abusers never harm humans, and some violent people loved their pets. If the empirical link is weaker than Kant thought, does the duty weaken? If I could prove I could torture animals without it affecting my behavior toward humans, would Kant have to say the act is permissible?

  *   **Likely Response:** He might argue that Kant isn't making a psychological prediction but a claim about the *structure* of moral sentiment—that dulling sympathy is inherently degrading regardless of outward consequences.
  *   **Follow-up:** "If it's about degrading our own moral sentiment, doesn't that imply the animal is the *medium* through which we degrade ourselves? That still feels like the animal is playing a direct role in the moral transaction, not just a passive object like a stone."

  ### 6. Animal Agency vs. Thinghood
  **Question:** Kant classifies animals as "things" because they lack rational autonomy. But phenomenologically, animals display agency: they choose, they resist, they form preferences, they cooperate. A dog can refuse a command. By categorizing them as mere 'means,' is Kant ignoring a form of *non-rational agency* that deserves moral respect, even if it isn't moral *autonomy*?

  *   **Likely Response:** He will distinguish between "technical agency" (pursuing ends) and "practical agency" (choosing ends based on moral law), arguing only the latter commands respect.
  *   **Follow-up:** "But suffering happens at the level of technical agency. If I frustrate an animal's pursuit of its ends, it suffers. Why does the *type* of agency matter for the *experience* of harm? If I smash a robot, nothing matters. If I smash a dog, it matters. Why?"

  ### 7. Legal Rights vs. Moral Duties
  **Question:** Modern animal welfare laws often treat animals as rights-holders or protected subjects, implying direct duties. If the Kantian view is correct—that animals are property and we owe them nothing directly—are our current animal cruelty laws based on a moral fiction? Should we be rewriting legislation to reflect that these laws are actually for *human* protection, not animal protection?

  *   **Likely Response:** He may say the law can operate on useful fictions and that the legal outcome (protecting animals) is what matters, not the philosophical justification.
  *   **Follow-up:** "But if the justification is 'for humans,' couldn't we repeal the laws if we found a way to protect humans without protecting animals? Doesn't grounding the law in indirect duty make animal protection contingent and revocable in a way that direct duty does not?"

  ### 8. Love Without Obligation
  **Question:** Kant suggests we can love animals but not owe them duties. But isn't love inherently constraining? If I love my dog, I feel I *ought* to feed him, not just because it makes me a nice person, but because *he* needs it. Is it psychologically coherent to have a relationship of 'love' with a being you simultaneously classify as a 'thing' you have no obligations to?

  *   **Likely Response:** He might argue that moral obligation is distinct from emotional inclination, and we can feel inclined to care for them without a categorical duty *to them*.
  *   **Follow-up:** "But when I fail to care for them, I feel guilt *toward the animal*, not just disappointment in my own character. If the phenomenology of our moral experience feels like a direct duty, why prioritize the metaphysical theory over the lived experience?"

  ### 9. The Rationality Threshold
  **Question:** Rationality doesn't seem to be a binary on/off switch; it looks like a spectrum. Humans have varying degrees of rational capacity, and some animals show rudimentary reasoning. Kant draws a hard line: you are either a person or a thing. Why is moral status binary when the capacity underpinning it (rationality) is clearly a gradient? Doesn't a cliff-edge model invite arbitrary exclusion?

  *   **Likely Response:** He will argue that moral law requires a threshold of freedom that cannot be partial; you are either free to legislate moral law or you are determined by nature.
  *   **Follow-up:** "Even if moral *legislation* is binary, why must moral *consideration* be? Can't I have a duty not to cause pain to a being that is 'partially' rational, even if I don't owe them full citizenship in the Kingdom of Ends?"

  ### 10. Dietary Implications
  **Question:** Kant himself ate meat and didn't advocate for vegetarianism. But if cruelty to animals dulls our sympathy, and modern factory farming involves immense suffering hidden from view, does a consistent Kantian today *have* to be vegetarian? Not because the animal has a right to life, but because participating in that system corrupts the human character more than 18th-century farming did?

  *   **Likely Response:** He might say it depends on whether one can consume meat without endorsing the cruelty, or if vegetarianism is a necessary condition for maintaining moral sensitivity today.
  *   **Follow-up:** "If the answer is 'yes, a modern Kantian should be veg,' doesn't that admit that the *animal's suffering* is the morally weighty factor? If the suffering is weighty enough to dictate our diet, have we not already granted them a form of direct moral significance?"
