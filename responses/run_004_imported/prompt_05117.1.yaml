      *   **The "Endorsement" Claim:** Address this directly. Peirce did *not* sign off on James's theory of truth. Cite the "Pragmaticism" distinction (1905).
      *   **Core Doctrinal Differences:** Break down the specific philosophical divergences.
          *   Metaphysics: Scholastic Realism (Peirce) vs. Nominalism/Humanism (James).
          *   The Nature of Truth: Convergent Limit (Peirce) vs. Verification Process/Utility (James).
          *   The Subject: Community of Inquirers (Peirce) vs. Individual Experience (James).
