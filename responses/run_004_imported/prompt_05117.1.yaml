      *   *The "Final Opinion" vs. "Working":* Peirce's truth is regulative/ideal. It might never be reached, but it directs inquiry. James's truth is cash-value *now*. "The true is only the expedient in our way of thinking."
      *   *Community vs. Individual:* Peirce is anti-solipsistic. Science is a social project. James is more existential/individual (though not strictly solipsistic).
