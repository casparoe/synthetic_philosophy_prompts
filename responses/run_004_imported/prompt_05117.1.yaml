      *   *The "Peirce Signed Off" Myth:* This is the weakest link in the student's argument. Peirce's 1905 Monist papers ("What Pragmatism Is") are the smoking gun. He explicitly distances himself. Use the term "Pragmaticism."
      *   *Meaning vs. Truth:* The student says James moved from meaning to truth. Peirce actually had a theory of truth (in 1878 and later), but it wasn't *just* the maxim applied.
