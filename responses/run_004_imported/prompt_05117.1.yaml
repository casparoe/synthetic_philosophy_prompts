answer: |-
  Your hunch is correct: the student has identified a genuine historical and conceptual continuity, but she has flattened a substantive philosophical divergence into a mere difference in tone. While it is true that James *took* himself to be extending Peirce's maxim, it is demonstrably false that Peirce "signed off" on James's theory of truth. In fact, Peirce spent the last decade of his life trying to disentangle his doctrine from James's.

  The student's reading is a sophisticated one (common among grad students who spot the genetic link), but it collapses under the weight of Peirce's metaphysical commitments. Here is a breakdown of where the doctrinal daylight actually is, how to address the "endorsement" claim, and how to frame this for your seminar without dismissing the student's insight.

  ### 1. The "Endorsement" Claim (The Easy Refutation)
  The student's claim that Peirce endorsed James's extension is historically untenable.
  *   **The Name Change:** In 1905 (two years before James's *Pragmatism* lectures were published, but as James's popularization was gaining steam), Peirce explicitly renamed his doctrine **"Pragmaticism."** He wrote in *The Monist* that the name was "ugly enough to be safe from kidnappers."
  *   **The Critique:** In those same 1905 papers ("What Pragmatism Is" and "Issues of Pragmaticism"), Peirce critiques the "nominalistic" turn James gave the maxim. He argues that James focused too much on particular, individual experiences and utilities, whereas Peirce's maxim was about general, conceivable habits of action.
  *   **The Quote:** Peirce famously wrote that James's version allowed for the truth of religious hypotheses based on their emotional comfort, which Peirce felt violated the logical rigor of the maxim. He referred to the popular pragmatists (James and Schiller) as producing a "brood of bastard pragmatisms."

  **Seminar Point:** You can tell the student: "You are right that James thought he was being a loyal Peircean. But Peirce explicitly disowned the offspring."

  ### 2. The Metaphysical Cut: Scholastic Realism vs. Nominalism
  This is the deepest philosophical divergence, and it drives the difference in their theories of truth.
  *   **Peirce (Scholastic Realist):** Peirce believed in the reality of *generals* (laws, habits, potentials). For Peirce, truth is not just what we agree on; it is what corresponds to a reality that exists independently of what you or I think *at any finite time*. The "final opinion" is fated because reality *constrains* inquiry. There is a "Secondness" (brute fact) that resists our will.
  *   **James (Humanist/Nominalist leanings):** James is less committed to reality as a constraint independent of human experience. In Lecture VI, he says truth "happens to an idea. It *becomes* true, is *made* true by events." For James, the "cash value" is often tied to the satisfaction of the individual believer's needs (including religious needs).
  *   **Where it bites:** For Peirce, a proposition can be true even if no one currently finds it "useful" or "expedient," provided it aligns with the ultimate limit of inquiry. For James, if an idea ceases to "work" or lead us through experience, its truth status is mutable. Peirce's truth is **convergent**; James's truth is **plastic**.

  ### 3. The Temporal Structure: Limit vs. Process
  *   **Peirce (The Ideal Limit):** In "How to Make Our Ideas Clear" (1878), Peirce defines truth as the opinion "fated to be ultimately agreed to by all who investigate." Note the subjunctive mood: *fated to be*. This is a **regulative ideal**. It functions to keep inquiry going. It acknowledges that we might never reach it, but it exists as a destination.
  *   **James (The Present Verification):** In Lecture VI, James focuses on the *process* of verification. "The true is only the expedient in our way of thinking." While James does talk about agreement with reality, his emphasis is on the *current* ability of an idea to carry us from one part of experience to another without contradiction.
  *   **The Conflict:** The student claims these are the same insight. But Peirce's theory is designed to save objectivity (science will converge regardless of individual bias), whereas James's theory is designed to save vitality (truth must matter to lived life). Peirce worries James makes truth too subjective; James worries Peirce makes truth too abstract/dead.

  ### 4. The Subject: Community vs. Individual
  *   **Peirce:** The agent of truth is the **community of inquirers** indefinite. No single individual can ascertain truth. This is why Peirce's pragmatism is inherently scientific and social.
  *   **James:** While James acknowledges social verification, the locus of "working" is often the **individual experience**. Does this belief satisfy *me*? Does it help *me* navigate *my* world? This opens the door (which James walked through) for religious faith to be "true" for the believer even if it lacks scientific verification. Peirce would reject this as a confusion of sentiment with truth.

  ### 5. Pedagogical Strategy: How to "Set Her Straight"
  You don't want to crush her; she has correctly identified that James *intended* to extend Peirce. The teaching moment is to show that **filiation does not guarantee identity.**

  **Suggested Framing for Class:**
  1.  **Validate the Continuity:** Start by acknowledging she is right that James viewed himself as operationalizing Peirce's maxim. The vocabulary (*cash value*, *practical upshot*) is undeniably shared.
  2.  **Introduce the 1905 Break:** Bring in Peirce's later distinction between Pragmatism (James) and Pragmaticism (Peirce). Ask the class: *Why would Peirce feel the need to coin a new word if they were saying the same thing?*
  3.  **The Diamond Example:** Go back to Peirce's 1878 text. Recall the diamond example (a diamond is hard even if it is never tested, because hardness is a conditional prediction about what *would* happen). Contrast this with James's notion that truth is *made* in the process. Ask: *If truth is made by working, was the proposition about the diamond's hardness true before we tested it?* Peirce says yes (Realism); James's wording suggests it becomes fully true only through the verification process.
  4.  **The Role of Reality:** Ask the student: *For Peirce, does reality constrain the final opinion, or does the final opinion constitute reality?* (Peirce: Reality constrains). *For James, does truth track reality, or does it track satisfaction?* (James: It tracks satisfaction/leading, which is his version of reality, but it's a softer version).

  ### Summary for Your Prep
  The student is confusing **methodological continuity** with **metaphysical identity**.
  *   **Method:** Both use the pragmatic maxim to clear up metaphysical nonsense. (Student is right).
  *   **Metaphysics:** Peirce is a realist who believes in an external constraint on inquiry; James is a humanist who believes truth is a property of ideas that prove useful. (Student is wrong).
  *   **Endorsement:** Peirce explicitly rejected James's theory of truth. (Student is factually incorrect).

  **Recommended Reading to Assign/Reference:**
  If your anthology includes it, Peirce's **"What Pragmatism Is" (1905)** is the smoking gun. If not, citing his letter to William James (1909) where he expresses his frustration with James's interpretation can be very clarifying. Peirce wrote to James: *"I am not satisfied with the way you have handled my pragmatism... you seem to make it a matter of individual caprice."*

  You aren't overcomplicating it. The "standard move" of contrasting them exists because Peirce insisted upon it. The student has found the root; you need to show her where the branches diverge.
