      *   *Are the theories of truth the same?* No. Peirce's is convergent realist (truth is the ideal limit of inquiry). James's is more instrumentalist/process-oriented (truth happens to an idea, it becomes true).
      *   *Is the student totally off?* Not entirely. There *is* a continuity. James *thought* he was extending Peirce. Peirce acknowledged the root but hated the fruit. The student is right about the *genetic* link but wrong about the *doctrinal identity* and Peirce's *endorsement*.
      *   *Key Distinctions:* Realism vs. Nominalism, Community vs. Individual, Future Limit vs. Present Utility, Static (in a sense) vs. Plastic.

  3.  **Structure the Response:**
