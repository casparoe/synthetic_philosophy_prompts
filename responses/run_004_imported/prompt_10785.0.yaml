answer: |-
  **Lincoln's Inn, London. November 1780.**

  The dining room was too warm, the air thick with the scent of roasted goose and beeswax. The servants had withdrawn ten minutes prior, leaving only the decanter of port and the heavy silence between the two men.

  Sir William Blackstone sat at the head of the table, his fingers steepled over a stack of papers. They were not his *Commentaries*. They were thinner, handwritten, bound in plain calf. Jeremy Bentham sat opposite, his posture rigid, eyes darting from the papers to Blackstone's face.

  "You write with a clarity that betrays you, Mr. Bentham," Blackstone said softly. He did not look up. "Even in draft. Even when arguing for the abolition of the gallows for... *this*."

  "It is a calculation, Sir William. Not a plea." Bentham reached for his wine, but his hand hovered. "If the manuscript was leaked, it was not by me."

  "Leaked? It was found in a coffee house. Discussing the 'harmlessness' of the Italian Vice." Blackstone finally looked up. His expression was not one of anger, but of profound disappointment. "You argue that because no third party bleeds, the law has no jurisdiction. That because two men agree in the dark, the state must blind itself."

  "I argue that the law is a tool for the maximization of happiness," Bentham said, his voice tight. "Pain and pleasure are the sovereign masters. Show me the pain. Show me the victim. If the act is consensual, secret, and involves no coercion, where is the mischief?"

  Blackstone tapped the paper. "The mischief is in the unraveling. You treat the Law as a mere accountant, Jeremy. Tallying scrapes and bruises. But the Common Law is not a ledger. It is a teacher."

  "A teacher of superstition," Bentham snapped. "You codify prejudice and call it Divine Order."

  "I codify the wisdom of centuries!" Blackstone's voice rose, then checked itself. He poured wine into Bentham's glass, forcing him to acknowledge the gesture. "Listen to me. The law does not exist solely to protect the body. It exists to protect the *order*. The family. The continuity of the species. When you permit a violation of natural law, you do not merely indulge a whim. You signal that the fundamental architecture of creation is negotiable."

  "Architecture?" Bentham leaned forward, the candlelight catching the sharp angles of his face. "You speak of 'Natural Law' as if it were a physical object. It is a fiction, William. A ghost. I deal in realities. The reality is that a man hangs at Tyburn for this. His neck is stretched. His family is starved. That is measurable pain. That is tangible mischief. The act itself? It produces pleasure for the participants and harm to no one. Your 'architecture' demands blood. My calculus demands life."

  Blackstone took a slow sip of port. "You assume the pleasure is the only metric. But society is held together by shared restraint. If we tell the populace that the deepest taboos are merely matters of private taste, what barrier remains? Why not incest? Why not bigamy? If 'consent' is the only god, then the sacred bonds of marriage become mere contracts, dissolvable at whim."

  "Because those acts *do* produce harm," Bentham countered, ticking points off on his fingers. "Incest confuses lineage and breeds weakness. Bigamy breaks contracts and defrauds wives. But this? Two men in a room? It is a victimless crime. To punish it is not justice. It is cruelty for cruelty's sake."

  "It is not victimless," Blackstone insisted. "The victim is the Commonwealth. The moral fabric is a tangible thing, Bentham. You cannot see it, but you feel it when it tears. When the law ceases to condemn vice, it ceases to encourage virtue. And a state without virtue is a state of beasts. Do you truly believe you can separate legality from morality?"

  "I believe I can separate *superstition* from legislation," Bentham said. "You say the fabric tears. I say the fabric is a noose. Consider the blackmail, William. The fear. The lives lived in terror of discovery. The law creates a market for extortion. It drives men into shadows where they are vulnerable. Repeal the statute, and the power of the blackmailer vanishes. The harm is not in the act. The harm is in *your* prohibition."

  Blackstone set his glass down with a sharp clink. "That is a utilitarian trap. You argue that because the punishment is severe, the crime should not exist. By that logic, if we punish theft with death, we should simply legalize theft to save the thieves. No. The severity of the punishment reflects the severity of the offense against God's order."

  "God's order?" Bentham's voice dropped to a hiss. "Or the order of bishops and judges who profit from the status quo? You wrote that the law is the perfection of reason. But where is the reason in hanging a man for a private impulse that alters no property, breaks no contract, and spills no blood?"

  "The reason," Blackstone said, leaning in, his eyes hard, "is that men are not islands. You are a bachelor, Jeremy. You live in your papers. You do not see how the household is the microcosm of the State. If the father is not master of his passions, he cannot be master of his house. If he cannot master his house, he cannot be a citizen. This vice is a declaration of war on the future. It is a choice against generation. A society that chooses against its own continuation is a society committing suicide."

  Bentham sat back, exhaling slowly. He looked at the manuscript, then at Blackstone. "That is a theological argument, Sir William. Dressed in legal robes. You claim the State has a right to enforce procreation?"

  "I claim the State has a duty to ensure its own survival," Blackstone corrected. "And to uphold the Divine Law which grants it authority. If you strip the law of its moral foundation, you reduce it to force. And if it is only force, why should anyone obey it when the sword is sheathed?"

  "Because it is useful," Bentham said. "Because it protects them. Not because it saves their souls."

  "But men do not live by utility alone," Blackstone said, his tone softening, almost pitying. "They live by meaning. By the sense that they are part of a chain, linking the dead to the unborn. You ask me to look at this act and see only two bodies. I look at it and see a broken link in the chain. You ask me to ignore it because it is private. I tell you that nothing which corrupts the citizen is truly private."

  Bentham picked up his quill, twirling it nervously. "So we hang men to preserve a metaphor. A 'chain'."

  "We hang men," Blackstone said, reclaiming the papers and sliding them back across the table, "to preserve the distinction between man and beast. Between Law and License."

  Bentham pushed the papers away. "Then the Law is a tyrant. And I will spend every day of my life proving it."

  "And in doing so," Blackstone stood, buttoning his coat, "you risk the very necks you seek to spare. Burn these drafts, Jeremy. For your own utility. The pain of the fire is less than the pain of the rope."

  Blackstone turned to the door. He paused, hand on the latch, without looking back.

  "You say 'no one is harmed'," Blackstone said quietly. "But you forget that the law itself is harmed when it asks us to ignore what our conscience knows to be abomination. You cannot calculate the weight of a soul, Mr. Bentham. Your scales are too small."

  The door opened and closed. Bentham sat alone in the warmth of the room, the manuscript before him, the candle sputtering in the draft. He looked at the quill, then at the fire. He did not move to burn the papers. He dipped the nib in ink and wrote a single word in the margin: *Why?*
