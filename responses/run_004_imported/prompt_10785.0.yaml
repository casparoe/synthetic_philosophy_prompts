  2.  **Historical & Philosophical Grounding:**
      *   *Bentham:* Obsessed with "the greatest happiness of the greatest number." Hated "fictions" (like Natural Rights). Believed punishment must be justified by preventing harm. If no harm, no crime. He did indeed write extensively on "paederasty" (his term) in private manuscripts (e.g., *Offences Against One's Self*), arguing against the death penalty for it.
      *   *Blackstone:* Author of *Commentaries on the Laws of England*. Believed English Common Law reflected divine/natural law. Saw "crimes against nature" as offenses against God and the order of creation, not just individuals. The law is a teacher of morality, not just a preventer of harm.
      *   *Setting:* Likely 1770s or 1780s. Lincolns Inn or a gentleman's club. Port wine, candlelight, tension.
      *   *Terminology:* They wouldn't say "gay" or "homosexual." Terms like "the Italian vice," "unnatural acts," "sodomy," "paederasty." Bentham might use clinical or euphemistic language.

