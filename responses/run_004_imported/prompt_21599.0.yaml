      *   Juror A's hesitation is philosophically and legally sound.
      *   Assigning precise numbers to legal evidence is often considered a category error (the "conjunction paradox," "reference class problem," etc.).
      *   The legal standard is "Beyond a Reasonable Doubt" (BARD), not "Preponderance of the Evidence" (50%+), and certainly not a specific numeric probability like 95%.

  3.  **Key Concepts to Explore:**
