  A Nyāya logician corners Nāgārjuna after a debate.

  **Logician:** "I have you trapped. You claim all views are empty of intrinsic nature (*svabhāva*). I ask you: Does your own thesis exist?"

  **Nāgārjuna:** "No."

  **Logician:** "Does it not exist?"

  **Nāgārjuna:** "No."

  **Logician:** "Both exist and not exist?"

  **Nāgārjuna:** "No."

  **Logician:** "Neither exists nor not exists?"

  **Nāgārjuna:** "No."

  **Logician:** "Aha! You have rejected the *catuṣkoṭi* on your own statement. So your thesis is nothing. If it is nothing, it cannot refute my position. You lose."

  **Nāgārjuna:** "If I had a thesis, I would be at fault. Since I have no thesis, I am not at fault. My words are like a magic illusion used to dispel another magic illusion."

  **Logician:** "But if your words are illusory, they have no power! You're saying 'Everything is empty,' but if *that* statement is empty, it's not true!"

  **Nāgārjuna:** "You are reifying emptiness. Emptiness itself is empty (*śūnyatā-śūnyatā*). It is not a position. It is a medicine."

  **Logician:** "Fine. I've taken the medicine. I am now cured of views. So I am enlightened."

  **Nāgārjuna:** "For whom there is a view of emptiness, them I call incurable. You are now sick with 'Emptiness.' You need a stronger dose."

  **Logician:** "What is the stronger dose?"

  **Nāgārjuna:** "The emptiness of your cure."

  **Logician:** "This is absurd! If everything is empty, nothing functions. You can't debate, I can't listen, and I certainly don't have to pay you the honorarium you requested."

  **Nāgārjuna:** "Precisely."

  **Logician:** "So I keep my money?"

  **Nāgārjuna:** "No. Because emptiness is empty, dependent origination is possible. Because dependent origination is possible, the convention of payment functions. If the money had intrinsic nature, it could never change hands. If you had intrinsic nature, you could never be generous."

  **Logician:** "So... I have to pay?"

  **Nāgārjuna:** "There is no payer, no payee, and no money. But please hand over the coins before the convention dissolves."

  **Logician:** "Is this transaction ultimately real?"

  **Nāgārjuna:** "It is not true, not false, not both, and not neither."

  **Logician:** "Then why do it?"

  **Nāgārjuna:** "So I can buy lunch. And even the lunch is empty."

  **Logician:** "Then you won't get full!"

  **Nāgārjuna:** "Exactly. That is the only way I can eat forever."
