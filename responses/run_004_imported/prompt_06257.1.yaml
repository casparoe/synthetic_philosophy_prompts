prompt: |-
  So in my phil of language seminar we just wrapped up like three weeks on vagueness, and this week it was the big showdown between epistemicism and supervaluationism as responses to the sorites paradox. My professor is clearly team Williamson (she keeps bringing up his margin-for-error stuff to explain why we can't actually know where the sharp cutoff for "bald" or "heap" is, even though one exists), but a couple people in my discussion section are diehard supervaluationists, citing Fine's original paper and then Keefe's book to back it up, and keep saying the whole appeal of the view is that you don't need a sharp boundary anywhere, just truth-value gaps for borderline cases and "supertruth" for stuff that's true under every precisification.

  Here's what's bugging me though: doesn't the higher-order vagueness objection basically show that supervaluationism smuggles the sharp boundary back in anyway, just one level up? Like, is it vague whether something counts as a borderline case, and if the answer is yes, don't you need a whole other apparatus of admissible-precisifications-of-the-precisifications (and so on up), and if the answer is no, haven't you just posited a sharp fact about where borderline cases begin, which is exactly the kind of thing supervaluationism was suppose to avoid in the first place? Can you write me an actual comparison of the two views that takes this problem seriously instead of just repeating the intro-textbook summary of each? I want it to end on an actual verdict re: which view has the more defensible overall package once higher-order vagueness gets factored in, not some wishy-washy "both have costs" non-answer -- my professor keeps saying almost nobody in the literature actually commits to a clean answer here, so I kinda want to see what commiting to one would even look like.
