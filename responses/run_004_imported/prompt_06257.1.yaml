answer: |-
  This is one of the sharpest objections in the literature, and you are right to zero in on it. The Higher-Order Vagueness (HOV) problem is widely considered the fatal wound for standard Supervaluationism, even if introductory texts often gloss over it to keep the peace between the camps.

  Your intuition is correct: Supervaluationism attempts to solve the Sorites by eliminating sharp boundaries, but in doing so, it typically generates a sharp boundary between the "supertrue" and the "indeterminate." If you try to vague-ify *that* boundary, you need a meta-semantics for your precisifications, which either regresses infinitely or collapses back into a sharp boundary at the meta-level.

  Since you asked for a committed verdict rather than a diplomatic summary, I am going to take a stance. While Epistemicism is metaphysically revisionary (it claims the world/logic is sharper than we think), Supervaluationism is semantically incoherent when pressed on HOV. Therefore, **Epistemicism offers the more defensible overall package.**

  Here is the breakdown of why the HOV objection tips the scales decisively, followed by the verdict.

  ### 1. The Supervaluationist Trap: The Boundary of Admissibility

  To understand why Supervaluationism fails on HOV, we have to look at the mechanism of "admissible precisifications."

  **The First-Order Claim:**
  Supervaluationism says a sentence $S$ is supertrue iff $S$ is true on all *admissible* precisifications of the language. A borderline case is one that is true on some admissible precisifications and false on others. This is supposed to model the intuition that there is "no fact of the matter."

  **The HOV Objection:**
  As you noted, this creates a new boundary. Let $P$ be the set of admissible precisifications. For the theory to work, a precisification must either be *in* $P$ or *out* of $P$.
  *   **Option A (Sharp Admissibility):** There is a sharp cut-off between admissible and inadmissible precisifications. If so, there is a sharp fact about which sentences are supertrue and which are indeterminate. You haven't eliminated sharp boundaries; you've just moved them from the object language (e.g., "is bald") to the meta-language (e.g., "is an admissible precisification"). This contradicts the core motivation of the view, which is to respect the intuition that vagueness is pervasive.
  *   **Option B (Vague Admissibility):** The boundary of $P$ is itself vague. But now you need a semantics for *that* vagueness. Do we precisify the precisifications? If you iterate the supervaluationist machinery (supervaluationism over precisifications), you generate a hierarchy of "definitely" operators ($D, DD, DDD...$).

  **The Keefe/Fine Response and Its Failure:**
  Defenders like Keefe argue we should accept this hierarchy. They claim it is vague where the borderline cases begin, so we need a hierarchy of truth predicates.
  *   **The Cost:** This fragments the concept of truth. It implies that for any order $n$, there is a sharp boundary between $D^n$ and $\neg D^{n+1}$. As Timothy Williamson argues, this is psychologically and semantically implausible. We don't experience vagueness as a discrete ladder of "definitely" operators; we experience it as a smooth gradient. By forcing a hierarchy to avoid a sharp boundary, Supervaluationism posits *infinite* sharp boundaries (one between each level of the hierarchy) rather than one. It multiplies the sharp boundaries it sought to eliminate.

  Furthermore, Supervaluationism breaks classical logic to maintain this structure. It invalidates basic inference rules like Conditional Proof and Reductio ad Absurdum when "Definitely" is involved. A theory of vagueness that requires us to abandon classical logic *and* fails to actually eliminate sharp boundaries (hiding them in the meta-language) is paying too high a price.

  ### 2. The Epistemicist Advantage: Consistency Over Intuition

  Williamson's Epistemicism is often mocked for its conclusion (that there is a specific number of grains that makes a heap), but its internal machinery is robust against HOV.

  **The Mechanism:**
  Williamson argues that vagueness is a form of ignorance. The sharp boundary exists, but we cannot know it. Why? Because of the **Margin for Error Principle**. To know a proposition $p$, your belief must be safe (it couldn't easily be false). In borderline areas, if you believe "this is a heap," you could easily be wrong because a micro-change in the grains makes it not a heap, and you can't discriminate that micro-change. Therefore, you cannot know the cutoff.

  **Handling HOV:**
  Epistemicism handles HOV by biting the bullet consistently.
  *   Is there a sharp boundary between "bald" and "not bald"? **Yes.**
  *   Is there a sharp boundary between "definitely bald" and "not definitely bald"? **Yes.**
  *   Is there a sharp boundary between "knowably bald" and "not knowably bald"? **Yes.**

  Williamson argues that the intuition that there *shouldn't* be sharp boundaries is a cognitive illusion caused by our inability to detect the boundaries.

  **Why This Wins on HOV:**
  Epistemicism preserves classical logic (bivalence holds, no truth-value gaps). It provides a unified explanation for all orders of vagueness: every order involves a sharp boundary that is epistemically inaccessible. It does not need to posit a hierarchy of "definitely" operators with different semantic rules; "Definitely $p$" is just "It is knowable that $p$" (or similar epistemic modal).

  The cost is metaphysical: you must accept that the world (or the semantics of our language) is precise in a way that outstrips our cognitive access. But this is a cost in *intuition*, not in *logic*.

  ### 3. The Verdict

  Here is the commitment you asked for:

  **Epistemicism is the superior theory.**

  The reason is not that Epistemicism feels better (it doesn't; it's deeply counterintuitive). The reason is that **Supervaluationism fails to solve the problem it sets for itself.**

  1.  **The Promise:** Supervaluationism promises a world without sharp boundaries.
  2.  **The Reality:** To make the semantics work, it must posit a sharp boundary between admissible and inadmissible precisifications.
  3.  **The HOV Collapse:** When challenged on this, it either admits the sharp boundary (breaking its promise) or iterates the semantics, creating a hierarchy that implies sharp boundaries at every level of the hierarchy (breaking its promise even more thoroughly).
  4.  **The Logical Tax:** In exchange for this failure, Supervaluationism forces us to abandon classical logic (bivalence, conditional proof).

  Epistemicism, by contrast, keeps classical logic intact. It admits sharp boundaries exist (matching the logical requirement) and explains our inability to locate them via a robust epistemological theory (margin for error).

  In philosophy of language, **logical coherence trumps pre-theoretic intuition.** The intuition that "there is no sharp cutoff" is strong, but if maintaining that intuition requires a semantic theory that is either incoherent (due to HOV) or logically revisionary (breaking classical inference), the intuition must be discarded.

  Your professor is right to lean Williamson. The Supervaluationist attempt to have it both ways (no sharp boundaries + classical logic) is the real "wishy-washy" move. Epistemicism is the only view that respects the severity of the HOV objection by accepting that if logic is sharp, reality (or at least semantic value) must be too. The Supervaluationist tries to hide the sharpness in the meta-language, but as you correctly identified, that is just smuggling it back in.

  **Final Call:** Commit to Epistemicism. Accept the sharp cutoff. Accept that we are ignorant of it. It is the only view that survives the Higher-Order Vagueness regress without collapsing into logical incoherence.
