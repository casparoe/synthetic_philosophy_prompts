              *   *Correction:* This is slightly off. In the *Metaphysics of Morals* (Doctrine of Virtue), duties regarding animals are found in **§17** (Duties to Oneself as an Animal Being) and **§18** (Duties Regarding Animals). They are *not* in an "Amphiboly" section. The "Amphiboly of Moral Concepts of Reflection" is a specific section in the *Critique of Practical Reason* (or sometimes associated with the *Critique of Pure Reason* regarding phenomena/noumena), but in the *Metaphysics of Morals*, the structure is Duties to Oneself vs. Duties to Others. Duties regarding animals are indeed appended to Duties to Oneself, but calling it the "Amphiboly" section is a terminological error. It's likely the user is conflating the *structure* (indirect duty) with a specific Kantian term from a different work.
          *   *"To" vs. "Regarding":* This is accurate. Kant uses *gegen* (towards/regarding) rather than *zu* (to).
          *   *Old-Dog Passage:* This refers to Kant's *Lectures on Ethics* (Collins or Mrongovius transcripts). The example of shooting a faithful old dog is a standard citation. The interpretation (blunting fellow-feeling) is accurate.

