answer: |-
  Here is the strongest possible case for your position. It focuses on the gap between *asymptotic mathematical guarantees* and *finite physical inference*, arguing that the Invariance Theorem provides a false sense of security regarding objectivity.

  ***

  ### The Case Against Objectivity: Why Kolmogorov Complexity Fails to Ground Occam's Razor

  Your friend is relying on a Platonic ideal of inference that ignores the physical and epistemic constraints of actual reasoning. While the Invariance Theorem is mathematically sound, it is epistemically toothless for any finite agent in a finite universe. Here is why Kolmogorov complexity (KC) fails to rescue Occam's Razor from arbitrariness in practice.

  #### 1. The "Rigged Machine" Problem: The Constant is Unbounded
  The Invariance Theorem states that for any two Universal Turing Machines (UTMs) $U_1$ and $U_2$, the difference in complexity for a string $x$ is bounded by a constant $c$:
  $$|K_{U_1}(x) - K_{U_2}(x)| \leq c$$
  Your friend argues that $c$ becomes negligible for complex strings. This ignores the magnitude of $c$. The constant $c$ represents the length of the compiler or emulator needed to translate one machine's language into the other's. Crucially, **$c$ is uncomputable and unbounded.**

  I can construct a UTM, let's call it $U_{\text{biased}}$, that has a specific, highly complex hypothesis hard-wired into its instruction set as a single primitive operation. For example, I can wire $U_{\text{biased}}$ such that the bitstring `0` outputs the entire Standard Model of Physics plus a specific, false prediction about dark matter.
  *   Relative to a standard UTM ($U_{\text{std}}$), this theory is massive (high KC).
  *   Relative to $U_{\text{biased}}$, this theory is trivial (KC = 1).

  The Invariance Theorem admits this is possible; it only says the difference is *constant*. But if that constant is $10^{100}$ bits, it is not negligible. It is insurmountable. If the "true" theory of the universe is complex relative to my chosen UTM, but I am using a UTM rigged to favor a false theory, I will require $10^{100}$ bits of evidence to correct my prior. Since no finite dataset can overcome an arbitrarily large bias, the choice of UTM dictates the conclusion for any realistic amount of data.

  #### 2. Asymptotics vs. The Heat Death of the Universe
  Your friend leans on Solomonoff's Convergence Theorem, which guarantees that the posterior probability of the true hypothesis converges to 1 as evidence $n \to \infty$. This is a limit theorem. It tells us what happens at infinity, but says nothing about the *rate of convergence*.

  In physics and statistics, a guarantee that holds only at the limit is useless if the convergence time exceeds the lifespan of the system.
  *   **The Physical Bound:** The observable universe contains a finite amount of information (bounded by the Bekenstein limit, roughly $10^{122}$ bits).
  *   **The Epistemic Consequence:** If the additive constant $c$ between my UTM and the "true" UTM requires more than $10^{122}$ bits of evidence to swamp the prior bias, Solomonoff induction will *never* converge to the truth within our universe.

  Therefore, claiming that the dependence on the reference machine "washes out" is physically false. For any finite agent, the prior (and thus the UTM choice) dominates the posterior. The "objectivity" exists only in a mathematical realm inaccessible to physical observers.

  #### 3. The Circularity of "Natural" Turing Machines
  Proponents of KC often implicitly assume there is a "natural" UTM (e.g., a simple Turing machine, or a standard programming language like Python) that reflects true simplicity. This is circular reasoning.

  Why is a Turing machine "natural"? Because it aligns with *human* intuitions about logic and computation. Why is Python "simple"? Because it was designed by humans to be readable by humans.
  *   If we choose a UTM that aligns with human intuition, KC simply formalizes human prejudice. It tells us which theories *we* find simple, not which theories *are* simple in an objective sense.
  *   If we choose a UTM at random, we get arbitrary results (as per the "Rigged Machine" argument).

  There is no "View from Nowhere" UTM. Choosing a reference machine is exactly analogous to Goodman's "Grue" problem in philosophy. "Green" is simple in English; "Grue" is simple in Grue-lish. KC does not solve the New Riddle of Induction; it merely translates it into the language of computation. It shifts the arbitrariness from "choice of predicate" to "choice of Turing Machine," but the arbitrariness remains.

  #### 4. Uncomputability Prevents Verification
  Even if we grant that a "correct" UTM exists, we cannot identify it. Kolmogorov complexity is uncomputable. We cannot calculate the exact KC of a hypothesis, nor can we calculate the constant $c$ between two machines.

  This creates a fatal epistemic blind spot: **We never know if our data is "complex enough" to have swamped the constant.**
  *   Your friend argues that for "complex enough" hypotheses, the UTM choice doesn't matter.
  *   But since KC is uncomputable, we cannot determine if our current hypothesis is in the regime where the Invariance Theorem applies.
  *   We might be dealing with a hypothesis that is short in the "true" metric but long in our "human" metric, and we would have no way of knowing.

  Without the ability to measure the complexity or the bias constant, the Invariance Theorem offers no practical guidance. It is a guarantee we can never verify we have met.

  ### Conclusion
  The Invariance Theorem proves that Kolmogorov complexity is **machine-independent up to an additive constant.** It does *not* prove that it is **machine-independent in absolute terms.**

  For Occam's Razor to be objectively rescued, "simplicity" must be a property of the world, not a property of the relationship between the world and our description language. Because the additive constant can be arbitrarily large, because convergence is not guaranteed within physical limits, and because there is no non-circular way to select a "natural" UTM, Kolmogorov complexity fails to provide an objective foundation for induction.

  It provides a rigorous framework for **consistency** (if we agree on a machine, we agree on simplicity), but it cannot provide **objectivity** (that this machine is the one true ruler of simplicity). In the finite regime where science actually happens, the choice of the reference machine remains a subjective prior, and Occam's Razor remains a pragmatic heuristic rather than a logical necessity.
