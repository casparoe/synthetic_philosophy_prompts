      *   Phil 1 (Classical DB)? Yes.
      *   Phil 2 (Package/Sequential objection)? Yes.
      *   Core Question (Relocation of irrationality)? Yes.
      *   No tidy resolution? Yes.
      *   Specific debts identified at the end? Yes.

  *(Self-Correction during final polish)*: Make sure the distinction between *actual* loss and *potential* loss is sharp. Alex needs to defend the idea that *vulnerability* is the defect, not the *actualization*. Blair needs to press on whether vulnerability without actualization is just a metaphor for logical inconsistency.

