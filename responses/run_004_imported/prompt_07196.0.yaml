      *   *Decision:* I will argue that Strawson is fundamentally right, but not because he proves the skeptic wrong on metaphysical grounds. He is right because the skeptic's demand is *practically* empty. The "justice" of blame isn't a metaphysical property; it's a feature of the relationship. To ask for more is to ask for a god's-eye view that has no purchase on human life. I will lean towards the view that Strawson successfully dissolves the problem rather than solving it, and that this dissolution is sufficient.

