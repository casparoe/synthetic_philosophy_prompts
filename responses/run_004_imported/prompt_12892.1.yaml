answer: |-
  This is precisely the right tension to foreground in a graduate seminar. If you present Hume as having a settled, monolithic doctrine, your students will dismantle it in twenty minutes. If you present the text as genuinely torn between an epistemic limitation and an ontological conclusion, you open the door to the entire contemporary debate.

  Here is how I would break down the two issues you raised, keeping the metaphysical weight front and center.

  ### 1. The Two Definitions: Equivalence or Divergence?

  You are right to suspect they are not strictly equivalent. If they were, Hume wouldn't need to offer the second as a substitute for a "defective" first.

  **The Divergence:**
  Definition 1 (D1) describes a **regularity in the world** (constant conjunction). It is objective, third-person, and extensional. Definition 2 (D2) describes a **determination in the mind** (customary transition). It is subjective, first-person, and intensional.

  If the world contained constant conjunctions but no minds (or minds incapable of habituation), D1 would be satisfied, but D2 would not. Conversely, if a mind were hallucinating constant conjunctions where none existed, D2 might be satisfied (the mind is determined), but D1 would not. They track different things.

  **Which tells us what a cause *really* is?**
  This is where the metaphysical weight lands. For Hume, the question "what is a cause really?" presupposes we can access the "real essence" of causation independent of our impressions. Hume's core argument is that we cannot. Therefore, the "reality" of a cause is exhausted by the sum of our impressions of it.

  *   **D1** captures the *observable conditions* under which we attribute causation.
  *   **D2** captures the *semantic content* of the idea of causation (specifically, the element of necessity).

  Hume argues that D1 is "defective" not because it fails to describe the world, but because it fails to capture the *idea of necessity* that is integral to our concept of cause. Since he has already argued that necessity is a feeling of determination (in the mind), D2 is actually the more complete definition of the *concept* of cause.

  **Pedagogical Pivot:**
  For your seminar, the crucial point is that Hume is **collapsing the ontology into the epistemology**. He isn't saying "D1 is the real cause, and D2 is how we find it." He is saying "D2 reveals that the 'necessity' component of causation is a projection. Therefore, a complete definition of cause must include the projector."

  This sets up the Lewisian Humean perfectly: Lewis takes D1 (the mosaic of events) as the fundamental ontology and treats the "law" (the necessity) as a supervenient feature of our best systematization (a cognitive act akin to Hume's mental determination).

  ### 2. Projectivism vs. Skeptical Realism (The "New Hume" Debate)

  This is the harder interpretive knot, and your passage is the battleground.

  **The Textual Evidence:**
  The "New Hume" (Skeptical Realist) reading relies on distinguishing between *conceivability* and *existence*. They argue Hume says: "We cannot *form an idea* of necessity in objects," but leaves open: "Nevertheless, necessity might *exist* in objects."

  However, look closely at the line you quoted: *"Necessity, then, is something, that exists in the mind, **not in objects**."*

  This is an ontological claim, not merely an epistemic one. He does not say "We cannot know if it exists in objects." He says it exists *here*, and *not there*. Later he writes: *"‘Tis here [in the soul] that the real power of causes is plac'd."* If the *real* power is in the soul, there is no *real* power left over for the objects.

  **The Metaphysical Weight:**
  If you adopt the **Standard (Projectivist) Reading**: Hume is denying the truth-maker for necessary connections exists in the world. The world is just one damned thing after another. This makes him the direct ancestor of Lewis. Laws are not "in" the world; they are descriptions we impose on the world.

  If you adopt the **New Hume (Skeptical Realist) Reading**: Hume is denying our *access* to the truth-maker, not the truth-maker itself. This makes him a precursor to Kant (noumena) or even contemporary dispositionalists who argue laws are real but obscure.

  **Recommendation for the Seminar:**
  While the "New Hume" reading has sophisticated defenders (like Galen Strawson or Edward Craig), **this specific passage from the *Treatise* is hostile to it.** The *Enquiry* is softer and allows for more agnosticism; the *Treatise* is more aggressive in its projectivism.

  For a seminar on **Laws of Nature**, the Standard Reading is more generative. Why? Because the contemporary split (Lewis vs. Armstrong/Tooley/Dispositionalists) is predicated on the question: *Are there necessary connections in nature?*
  *   **Lewis** says: No (following the Standard Hume).
  *   **Anti-Humeans** say: Yes (rejecting Hume).

  If you teach the "New Hume" reading, you risk blunting the conflict. You might end up with students thinking, "Well, maybe Hume thought laws were real but unknowable, so the Anti-Humeans are actually agreeing with him." That muddies the water. The Anti-Humean project is largely a reaction against the *denial* of objective modality, not just the denial of knowledge of modality.

  **The Nuanced Position:**
  You can acknowledge the "New Hume" possibility without letting it dominate. Hume's *argument* is epistemic (we have no impression of power), but his *conclusion* is ontological (therefore, power is in the mind). The "New Hume" critique attacks the move from argument to conclusion.
  *   **Teaching Strategy:** Ask your students: "Does Hume's lack of an impression of necessity logically entail the non-existence of necessity in objects? Or does it only entail our ignorance of it?"
      *   If they say the former, they are Humeans/Lewisians.
      *   If they say the latter, they are opening the door for Anti-Humeanism (Armstrong, etc.) to posit irreducible laws that we grasp via inference to the best explanation, even without a direct sensory impression.

  ### Summary for the Board

  1.  **On the Definitions:** They are not equivalent. D1 is the external trigger; D2 is the internal constitution of the *idea*. Hume privileges D2 because it accounts for the "necessity" component, which he has relocated to the mind. This anticipates the Humean view that laws are systematizations (mental acts) rather than worldly relations.
  2.  **On the Metaphysics:** In this text, Hume is a Projectivist, not a Skeptical Realist. He asserts necessity is *in the mind, not objects*. This makes him the progenitor of the "no necessary connections" doctrine. However, the *basis* of his claim is epistemic (the Copy Principle). This is the weak point Anti-Humeans attack: they argue we can posit necessary connections as theoretical entities (universals, dispositions) even without a sensory impression, thereby rejecting Hume's move from "we can't sense it" to "it isn't there."

  This framing preserves the historical lineage to Lewis while giving your Anti-Humean students the precise lever (the epistemic/ontological gap) they need to pry open the argument.
