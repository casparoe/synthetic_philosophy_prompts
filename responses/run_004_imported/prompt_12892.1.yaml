      *   *Definition 2 (D2):* "An object precedent and contiguous to another, and so united with it, that the idea of the one determines the mind to form the idea of the other..." (Psychological determination).
      *   *The Tension:* D1 looks objective/regularity-based. D2 looks subjective/projectivist.
