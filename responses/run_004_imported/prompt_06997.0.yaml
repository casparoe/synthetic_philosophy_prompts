      *   *Comparison:* HOT separates the *awareness* from the *state*. SRT fuses them. Targetless HOT is structurally impossible in strict SRT because the awareness is intrinsic to the state. But SRT has its own issues (complexity of a single state representing itself).

  5.  **Synthesize the Arguments:**

