      *   *Structural Realism (Worrall):* Is there mathematical/structural continuity?
      *   *Selective Realism (Psillos/Kitcher):* Can we isolate "working posits" from "idle posits"? Is there referential continuity?

      *   **1. Phlogiston Theory:**
          *   *Idea:* Combustion releases phlogiston.
          *   *Successor:* Oxygen theory (Lavoisier).
          *   *Realist Defense:* Hard. Phlogiston is essentially "negative oxygen" or just non-existent. Some argue structural continuity in terms of chemical affinity or mass balance, but the central posit (phlogiston) refers to nothing. It's often cited as a hard case. However, some argue the *process* descriptions had value.
          *   *Threat Level:* High. It's a classic "reference failure" case.

      *   **2. Caloric Theory:**
          *   *Idea:* Heat is a fluid.
          *   *Successor:* Thermodynamics/Kinetic Theory.
          *   *Realist Defense:* Moderate. The *equations* (Fourier's heat equation) survived perfectly. Structural realism loves this. However, the ontology (fluid) is gone. Selective realism can say the math was the working posit.
          *   *Threat Level:* Medium-Low (Structural realist paradise).

      *   **3. Optical (Luminiferous) Ether:**
          *   *Idea:* Medium for light waves.
          *   *Successor:* Special Relativity/EM fields.
          *   *Realist Defense:* Worrall's *prime example*. Fresnel's equations survived. The structure of the wave theory remained, even if the medium didn't.
          *   *Threat Level:* Low (Structural realist stronghold).

      *   **4. Electromagnetic Ether:**
          *   *Idea:* Medium for EM fields (Maxwell/Lorentz).
          *   *Successor:* Field theory (no medium).
          *   *Realist Defense:* Similar to optical ether. The field equations survived; the mechanical properties of the ether were discarded.
          *   *Threat Level:* Low.

      *   **5. Crystalline Spheres:**
          *   *Idea:* Physical spheres carrying planets.
          *   *Successor:* Kepler/Newton (gravity/orbits in void).
          *   *Realist Defense:* Very Hard. There is no structural continuity in the mechanism. The spheres were ontological commitments that were completely eliminated, not just modified. No math survives that relies on the *spheres* specifically (though orbital paths do).
          *   *Threat Level:* Very High. It's a pure ontological elimination.

      *   **6. Humoral Theory:**
          *   *Idea:* Health depends on balance of 4 fluids.
          *   *Successor:* Germ theory/Cellular pathology.
          *   *Realist Defense:* Very Hard. No structural continuity. The posits (blood, phlegm, etc. as causal agents of specific diseases) are largely idle or wrong in that context. It's a pre-scientific framework that was replaced, not refined.
          *   *Threat Level:* Very High.

      *   **7. Vital Force Theory:**
          *   *Idea:* Life requires a non-physical force.
          *   *Successor:* Biochemistry/Molecular biology.
          *   *Realist Defense:* Extremely Hard. The central posit is explicitly non-physical/supernatural. Successor theory explains the phenomena via standard physics/chemistry. This is a case of elimination, not approximation.
