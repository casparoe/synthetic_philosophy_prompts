  {
    "S": ["Vital Force Theory"],
    "A": ["Humoral Theory", "Crystalline Spheres"],
    "B": ["Theory of Circular Inertia", "Phlogiston Theory"],
    "C": ["Effluvial Theory of Static Electricity", "Caloric Theory"],
    "D": ["Optical (Luminiferous) Ether", "Electromagnetic Ether"]
  }

  **Vital Force Theory:** This poses the greatest threat because its central posit is explicitly non-physical, requiring total eliminativism rather than approximation by successor biochemistry.

  **Humoral Theory:** Like vitalism, this framework offers no structural or referential continuity with modern pathology, representing a complete causal dead-end.

  **Crystalline Spheres:** The mechanical ontology of physical spheres was entirely eliminated with no mathematical remnant, leaving only the kinematic descriptions of planetary paths.

  **Theory of Circular Inertia:** This represents a failure of fundamental dynamical laws rather than just ontology, suggesting even core principles of motion can be wholly false.

  **Phlogiston Theory:** While chemically productive, the central term fails to refer (or refers inversely to oxygen), making the "divide et impera" move difficult to apply without significant revision.

  **Effluvial Theory of Static Electricity:** Although the "stream of matter" concept loosely anticipates electrons, the mechanism is vague enough that claiming robust referential continuity is challenging.

  **Caloric Theory:** The ontology (heat fluid) is false, but the mathematical structure (Fourier's equations) was preserved perfectly, making it a strong case for structural realism.

  **Optical (Luminiferous) Ether:** This is the structural realist's paradigmatic success story, where Fresnel's equations survived intact despite the discard of the medium itself.

  **Electromagnetic Ether:** Similar to the optical ether, the field equations survived the transition to relativity, leaving the ether posit as a harmless, detachable scaffolding.
