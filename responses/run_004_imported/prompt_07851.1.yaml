answer: |-
  Your intuition is well-founded. In the philosophical literature, this is often called the **"problem of true disjunctions without true disjuncts,"** and it is widely considered the Achilles' heel of supervaluationism. While your friend is correct that supervaluationism technically preserves the Law of Excluded Middle ($p \lor \neg p$), you are right to suspect that it does so by hollowing out the meaning of "truth" to the point where the preservation is merely verbal.

  Here is a sharper articulation of your objection, structured to help you argue that supervaluationism pays a price for saving Excluded Middle that is just as high as the price of abandoning it.

  ### 1. The Severing of Truth-Conditions
  The most direct objection is that supervaluationism severs the fundamental semantic link between a compound sentence and its parts. In our ordinary concept of truth, the truth of a disjunction is **grounded** in the truth of its disjuncts. If I say, "It is raining or it is snowing," and you ask me, "Why is that statement true?" I must point to the rain or I must point to the snow.

  Supervaluationism breaks this link. It asserts that "There will be a sea battle or there will not" is true, not because the future is settled on a battle, and not because the future is settled on no battle, but because of the **structure of the logical space**.

  **The Argument:**
  If truth is meant to represent how the world is, a true statement must be made true by some fact.
  *   **Classical View:** The fact that makes ($p \lor \neg p$) true is either the fact that $p$ or the fact that $\neg p$.
  *   **Supervaluationist View:** The "fact" that makes ($p \lor \neg p$) true is the absence of a gap in the set of all histories.

  This renders the truth of the disjunction **metaphysically idle**. It is true, but nothing in the world makes it true. You have saved the *sentence* from being false, but only by detaching it from reality. This is arguably more damaging to the concept of truth than admitting bivalence failure, because it allows for "truth" without "truthmakers."

  ### 2. The Failure of the T-Schema
  Our ordinary concept of truth is governed by the T-Schema: *"P" is true if and only if P.*
  Supervaluationism forces us to reject this schema for future contingents.

  Consider the sentence: *"It is true that there will be a sea battle or there will not be one."*
  *   According to supervaluationism, this sentence is **True** (because it holds on all histories).
  *   However, according to supervaluationism, it is **not true** that there will be a sea battle, and it is **not true** that there will not be one.

  This leads to a paradoxical sounding claim: **"The disjunction is true, but neither disjunct is true."**
  In ordinary language, this is a contradiction. If you say, "It is true that (A or B)," you are committed to "It is true that A OR it is true that B." Supervaluationism redefines "true" as "super-true" to avoid this, but in doing so, it creates a gap between the truth predicate ("It is true that...") and the actual assertion. If the truth predicate doesn't distribute over disjunction, it no longer functions as the transparent device for endorsement that we use in everyday reasoning.

  ### 3. The Relocation of Mystery (Restating the Puzzle)
  Your friend claims supervaluationism *solves* Aristotle's puzzle. You should argue that it merely **relocates the mystery**.

  *   **Aristotle's Original Puzzle:** How can a statement about the future be true now if the future is not settled? (Threatens Bivalence).
  *   **Supervaluationist "Solution":** We say the disjunction is true even though neither side is.
  *   **The New Puzzle:** How can a disjunction be true if neither side is true?

  The supervaluationist has not explained *how* truth applies to the future; they have simply shifted the anomaly from the atomic sentences to the logical connectives. They have preserved the *syntax* of classical logic (the rules of inference) but abandoned the *semantics* of classical logic (the meaning of the connectives).

  If the meaning of "OR" is defined by its truth table, and the truth table says $T \lor F = T$, $F \lor T = T$, and $T \lor T = T$, but never $Indeterminate \lor Indeterminate = True$, then supervaluationism is using the word "OR" in a non-standard way. They are arguing that $p \lor \neg p$ is a tautology, but if the truth of the tautology implies nothing about the truth of $p$, have they really preserved the Law of Excluded Middle, or just the string of symbols?

  ### 4. The Epistemic/Pragmatic Cost
  Finally, argue from the perspective of assertion. If your friend says, "It is true that either there will be a battle or there won't," what are they communicating?
  *   **Classically:** They are communicating that reality is constrained such that one of these options obtains.
  *   **Supervaluationistically:** They are communicating that our current language/logic doesn't rule out either option.

  If you accept their statement as "true," are you entitled to infer anything? No. You cannot infer that the battle is determined, nor that it is undetermined. The "truth" of the statement carries no informational weight. A concept of truth that allows a statement to be "true" while conveying no information about which state of affairs obtains is a concept of truth that has been drained of its utility.

  ### Summary for your Argument
  To summarize your position to your friend:

  > "Supervaluationism saves the Law of Excluded Middle only by sacrificing the **disjunction property**. It allows us to say '$p \lor \neg p$' is true while denying that '$p$' is true and denying that '$\neg p$' is true.
  >
  > But in our ordinary concept of truth, the truth of a disjunction is *nothing over and above* the truth of its parts. By decoupling the truth of the whole from the truth of the parts, supervaluationism preserves the *letter* of classical logic while violating its *spirit*. It solves the problem of future contingents only by making 'truth' a property of logical systems rather than a property of statements about the world. That is not a resolution; it is a technical restatement of the same mystery."

  This framing validates your feeling that it is a "dodge." It shows that the cost of saving Excluded Middle is breaking the connection between truth and reality, which is arguably the more important feature of truth to preserve.
