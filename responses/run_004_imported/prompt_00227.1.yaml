prompt: |-
  hey so i'm sketching out a character for my next book - a guy who's basically built his entire identity around his curated instagram persona, like the "authentic self" he presents online is more real to him than whatever's left offline. been rereading some Sartre for inspiration and now i cant stop wondering - what would he actually make of influencer culture and algorithim-driven self-branding? like is staging your "authentic life" for followers just bad faith on steroids, or does the whole framework kind of break down once theres an audience and a feed involved that he never couldve imagined? curious what you think his take would be.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Character Concept:** A man whose identity is built around a curated Instagram persona. The online "authentic self" feels more real to him than his offline existence.
      *   **Philosophical Lens:** Jean-Paul Sartre (Existentialism, Bad Faith, The Look, Being-for-Others).
      *   **Core Question:** What would Sartre make of influencer culture/algorithm-driven self-branding? Is it "bad faith on steroids," or does the framework break down in this new context?
      *   **Goal:** Provide insight to help the user flesh out their character and understand the philosophical implications.

  2.  **Deconstruct Sartrean Concepts relevant to the prompt:**
      *   **Bad Faith (*Mauvaise Foi*):** Lying to oneself to escape the anguish of freedom. Pretending to be a fixed "thing" (en-soi) rather than a free consciousness (pour-soi).
      *   **The Look (*Le Regard*):** Being seen by another turns me into an object. I lose my subjectivity and become defined by their judgment.
      *   **Being-for-Others (*Être-pour-autrui*):** My existence is partly defined by how others perceive me.
      *   **Authenticity:** Owning your freedom and responsibility, accepting that you have no fixed essence.
      *   **Facticity vs. Transcendence:** Facticity is what you *are* (past, body, situation); Transcendence is what you *can become* (future, projects). Bad faith often involves over-emphasizing one to deny the other.

  3.  **Apply Sartre to Influencer Culture:**
      *   *Is it Bad Faith?* Yes, highly. The influencer treats themselves as a brand (a fixed object/product) rather than a free subject. They deny their freedom to change by locking themselves into a persona.
      *   *The Look:* Instagram is "The Look" institutionalized and quantified. It's not just one person looking; it's thousands/millions. The "Feed" is the ultimate objectifying gaze.
      *   *Authenticity:* The character claims "authenticity," but for Sartre, claiming to *be* "authentic" is often the deepest form of bad faith (trying to make "authenticity" an essence).
      *   *The Algorithm:* This adds a non-human "Other." It's a system that demands consistency. It reinforces the "object" status.

  4.  **Synthesize the "Sartrean Take":**
      *   *Initial thought:* Sartre would hate it. It's pure objectification.
      *   *Nuance:* But Sartre acknowledges we *need* the Other to have a self. The problem is *surrendering* to the Other completely.
      *   *The Character's Conflict:* He feels more real online because that's where he is fully objectified (defined). Offline, he faces the void of freedom, which is terrifying. Online, he *is* something (a profile, a brand).
      *   *The "Breakdown" Question:* Does the framework break down? Not really. Sartre's concepts are surprisingly robust here. The medium changes, but the ontological structure (Subject vs. Object) remains. If anything, social media amplifies the mechanisms Sartre described.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the idea. It's a perfect fit for Sartre.
      *   *Point 1: Bad Faith on Steroids.* Explain how turning oneself into a "Brand" is treating consciousness as a thing. The character is fleeing freedom.
      *   *Point 2: The Look (Le Regard).* Instagram is the Hell of "The Look." The metrics (likes/comments) are the judgment. He is living entirely in "Being-for-Others."
      *   *Point 3: The Paradox of "Authenticity".* This is crucial. Sartre would say claiming to perform authenticity is the ultimate lie. It's playing a role of "The Authentic Guy."
      *   *Point 4: The Algorithm as the "Other".* It's not just people; it's the system demanding consistency.
      *   *Character Implications:* How does this feel for him? Anguish when offline. Relief when posting. The "Real" is where he feels dead/undefined.
      *   *Conclusion:* Sartre wouldn't say the framework breaks down; he'd say it's the perfect trap.

  6.  **Refining the Tone:**
      *   Keep it conversational but intellectually rigorous.
      *   Use Sartrean terminology correctly but explain it clearly.
      *   Focus on how this helps the *writing* (character motivation, internal conflict).

  7.  **Self-Correction/Edge Case Consideration:**
      *   *Did Sartre anticipate this?* No, but his analysis of theater/acting applies well. The influencer is an actor who never leaves the stage.
      *   *Is there any redemption?* Sartre believes we can always choose authenticity. The character's arc could be realizing the profile is a cage.
      *   *Wait, does the framework break down?* The user asked this specifically. I should address it. Does the *scale* change the *nature*? Sartre might argue the *intensity* changes, but the ontological status is the same. However, the *mediation* (screen vs. face-to-face) creates a buffer that makes the bad faith easier to sustain.

  8.  **Final Polish:** Organize into clear sections. Add a specific "Character Note" for each philosophical point to make it actionable for the writer. (This matches the "sketching out a character" goal).

      *(Self-Correction during drafting)*: Make sure to emphasize *Being and Nothingness*. The "Nothingness" is the offline void he's running from. The "Being" is the solidified profile.

  9.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  This is a fantastic premise. Honestly, if Sartre were alive today, he wouldn't just be tweeting about influencer culture; he'd be writing a 400-page treatise on it titled *Being and Wi-Fi*.

  Your intuition is spot on: Sartre would likely view this not as a breakdown of his framework, but as the **ultimate actualization of Bad Faith.**

  Here is how a Sartrean analysis breaks down for your character, and how you can use it to deepen his psychology.

  ### 1. The Brand as "Facticity" (Bad Faith on Steroids)
  For Sartre, **Bad Faith** (*mauvaise foi*) is lying to yourself to escape the terror of your own freedom. Human consciousness (*pour-soi*) is fluid, undefined, and constantly becoming. This is terrifying. To cope, we often pretend we are fixed objects (*en-soi*), like a chair or a rock, with a defined purpose.

  *   **The Sartrean Take:** Your character is turning himself into a product. By curating a "brand," he is attempting to give himself an **essence**. He is saying, "I am not a free, chaotic consciousness; I am *The Traveler*, *The Minimalist*, *The Thought Leader*."
  *   **The Character Conflict:** He feels "more real" online because the profile is solid. It has stats, a bio, a grid. It *exists*. Offline, he is just a guy sitting in a room with nothing to define him. The anguish of having to decide who to be every morning is unbearable; the algorithm decides for him.
  *   **Writing Tip:** Show his relief when he posts. The moment the photo is up, he "exists." When the phone is off, he feels like he's dissolving into nothingness.

  ### 2. "The Look" (*Le Regard*) Quantified
  Sartre's concept of **The Look** is central to *Being and Nothingness*. When another person looks at me, I am no longer the subject of my world; I become an *object* in theirs. I am defined by their judgment. This is usually shameful or anxiety-inducing ("Hell is other people").

  *   **The Sartrean Take:** Instagram is **The Look institutionalized.** It isn't just one person judging him; it is thousands. But here's the twist: He *craves* this objectification. He wants to be an object. He wants to be consumed.
  *   **The Algorithm as the Ultimate Other:** The algorithm is a non-human "Other" that demands consistency. If he deviates from his persona, the algorithm punishes him (low reach). This reinforces the Bad Faith. He cannot be free; he must be what the Feed demands.
  *   **Writing Tip:** Describe the notification sound not as a connection, but as a gavel striking. A like isn't affection; it's a confirmation of his existence. Silence (no engagement) feels like death/non-existence.

  ### 3. The Paradox of "Performed Authenticity"
  This is the juiciest part for your book. Influencers constantly sell "authenticity" ("No filter," "Real talk," "Just me").

  *   **The Sartrean Take:** Sartre would argue that **claiming to be authentic is the deepest form of Bad Faith.** Why? Because you are treating "Authenticity" as a role you play.
  *   **The Waiter Analogy:** Sartre uses the example of a café waiter who moves a little *too* precisely, acting the part of "The Waiter." Your character is acting the part of "The Authentic Human." He is staging spontaneity. He is scripting vulnerability.
  *   **The Character's Delusion:** He believes the online version is "more real" because it is *intentional*. Offline life is messy and accidental. Online life is crafted. To him, craft = truth. To Sartre, craft = imprisonment.
  *   **Writing Tip:** Have him catch himself staging a "candid" moment. He shouldn't feel guilty; he should feel *satisfied* that he captured the "truth" of the moment, even though he fabricated it. That cognitive dissonance is gold.

  ### 4. Does the Framework Break Down?
  You asked if the framework breaks down because of the scale/medium. Sartre would say **no.**

  In fact, social media removes the "resistance" of the physical world. In face-to-face interaction, the Other can talk back, challenge you, or look away. On Instagram, the "Other" is abstracted into data.
  *   **The Feedback Loop:** He isn't interacting with people; he's interacting with a mirror that talks back. This allows him to sustain the Bad Faith much longer than a 1940s Parisian could. He never has to face the "shock" of the real Other because the comments section is usually an echo chamber or a metric.
  *   **Being-for-Others:** Sartre says we exist "for others." Your character has taken this literally. He has no "Being-for-Itself" (internal existence); he is 100% "Being-for-Others." If the server went down, he would cease to exist ontologically.

  ### 5. Potential Character Arc (The Sartrean Rescue)
  If you want to move the character through a philosophical arc, Sartre offers a path: **Authenticity.**

  *   **The Awakening:** Authenticity isn't about posting "real" photos. It's about recognizing your **Radical Freedom**. It's admitting, "I am not this brand. I am the consciousness creating this brand, and I can stop at any moment."
  *   **The Anguish:** This realization should be terrifying for him. If he isn't the Influencer, who is he? The void opens up.
  *   **The Climax:** A moment where he chooses to act against the brand. Not to create a *new* brand (that's just more bad faith), but to act without an audience. To do something that cannot be photographed. To reclaim his subjectivity.

  ### Summary for your Sketch:
  *   **His Truth:** He believes the image is the reality. The flesh is just the machinery that produces the image.
  *   **His Fear:** Irrelevance. Not being seen. Being "nothing."
  *   **His Trap:** He is a slave to the freedom he thinks he has. He chooses the cage because the cage gives him shape.
  *   **Sartre's Verdict:** He is living in a hell of his own making, but he holds the key. He just has to be willing to stop being a "Someone" and accept being "No One" for a while.

  This setup gives you a character who isn't just "vain," but ontologically desperate. He's not trying to be famous; he's trying to *be*. That's a much more tragic and compelling figure.
