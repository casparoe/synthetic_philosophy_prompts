  8.  **Final Polish:**
      *   Check the geophysics context (ensure terms like slab-pull are used correctly in context).
      *   Ensure the Kuhn interpretation is solid (Kuhn didn't say "anything goes," he said communication breaks down during transition).
      *   Make sure the conditions are enforceable.

