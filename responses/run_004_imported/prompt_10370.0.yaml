              *   *The Difference:* Boltzmann's later view often implied we are a local fluctuation in a high-entropy whole (leading to Boltzmann Brain problems). The PH posits a global low-entropy boundary condition at the Big Bang. The student needs to distinguish between "statistical tendency + fluctuation" (Boltzmann) vs. "statistical tendency + specific low-entropy boundary condition" (PH).
