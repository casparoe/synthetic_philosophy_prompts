              *   Loschmidt: Time-reversal invariance of microdynamics implies that for every entropy-increasing trajectory, there is a valid entropy-decreasing one (velocity reversal). The H-theorem claims monotonic decrease of H (increase of S), but dynamics allow increase of H.
