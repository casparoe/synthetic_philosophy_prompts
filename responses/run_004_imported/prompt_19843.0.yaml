answer: |-
  This is an exceptionally sharp reading of the *White Horse Dialogue* (*Bai Ma Lun*), especially given your background. You have independently identified a distinction that occupies a significant chunk of modern scholarship on the School of Names (*Ming Jia*).

  To answer your questions directly: Your reconstruction is defensible, your suspicion about the "two arguments" is supported by nuanced scholarship (though often missed in summaries), and there are indeed ways to articulate the logical strength of the second argument without importing anachronistic set theory.

  Here is a breakdown of your three points.

  ### 1. Is the "Seeking a Horse" argument defensible, or does it beg the question?

  Your intuition is correct: the "seeking a horse" argument is logically stronger than the "shape/color" argument, and it does not necessarily beg the question in the way the first one does.

  The first argument (naming shape vs. naming color) relies on a metaphysical claim about the constituents of reality (shape and color are distinct categories, therefore names for them must be distinct). This is where the charge of equivocation is strongest. Gongsun Long is treating "White Horse" as a compound concept and "Horse" as a simple concept, then arguing that because the concepts differ, the reference differs.

  The second argument (the "seeking" passage) operates on **substitutability**. The logic runs roughly like this:
  1.  If Term A and Term B were identical in meaning/reference, they should be interchangeable in a request without changing the outcome.
  2.  If I ask for a "horse," a yellow horse satisfies the request.
  3.  If I ask for a "white horse," a yellow horse does *not* satisfy the request.
  4.  Therefore, the term "horse" and the term "white horse" are not interchangeable.
  5.  Therefore, "White Horse" is not "Horse."

  This is not begging the question; it is an appeal to **pragmatic satisfaction conditions**. It demonstrates that the *criteria for application* differ.

  However, there is still a gap, which is where the standard critique retains some bite. Gongsun Long moves from "The *terms* are not interchangeable" to "A white horse *is not* a horse."
  *   **Modern Logic:** We would say the *intensions* (meanings) are different, but the *extension* (the set of objects) of "white horse" is a subset of "horse."
  *   **Gongsun Long:** He treats the difference in intension as sufficient to deny the "is" relationship entirely.

  So, you are right that he isn't equivocating on "is" in this specific passage in the same sloppy way he might be in the first. He is arguing that because the *conditions for naming* differ, the *name* "White Horse" cannot be the name "Horse." It is a stronger argument because it appeals to observable usage (what satisfies a request) rather than abstract metaphysics (shape vs. color).

  ### 2. Is collapsing the three moves into two a novel insight?

  You are re-deriving a distinction that is well-respected in specialized scholarship, though often lost in general summaries.

  *   **The Standard Summary:** As you noted, introductory texts often flatten the dialogue into a single "fallacy of composition" or "equivocation on 'is'." This is pedagogical shorthand.
  *   **The Scholarly View:** Sinologists and philosophers of Chinese logic (notably **A.C. Graham** in *Later Mohist Logic, Ethics and Science* and **Chad Hansen** in *A Daoist Theory of Chinese Thought*) distinguish these moves.
      *   Graham treats the dialogue as a series of distinct logical puzzles regarding the relationship between names (*ming*) and actualities (*shi*).
      *   Hansen argues that Gongsun Long is operating with a "mass noun" ontology (like "water" or "gold") rather than a count-noun ontology (like "horse"). On this reading, "White Horse" is a different "stuff" than "Horse."

  Your grouping of Move 2 (Seeking) and Move 3 (Determinacy) is particularly astute. Move 3 ("Horse" leaves color open; "White Horse" fixes it) is essentially the theoretical explanation for the pragmatic observation in Move 2.
  *   **Move 2:** Empirical evidence (yellow horses satisfy one request, not the other).
  *   **Move 3:** Theoretical explanation (one term is determinate, the other is indeterminate).

  Treating them as a single argumentative unit (the "Determinacy/Extension" argument) versus the "Shape/Color" argument is a very clean way to parse the text. You aren't discovering something no one has ever said, but you are arriving at a sophisticated reading that contradicts the "single sophism" summary found in many generalist accounts.

  ### 3. How to articulate this without modern set theory?

  You asked how to explain why the second argument is stronger without using words like "subset," "member," or "extension," which Gongsun Long did not have. The key is to use the vocabulary of **Names (*Ming*)** and **Kinds (*Lei*)**.

  **A. Focus on "Criteria" rather than "Sets"**
  Instead of saying "The set of white horses is a subset of horses," frame it as:
  > "The name 'Horse' relies on a criterion of shape. The name 'White Horse' relies on a criterion of shape *plus* color. Because the criteria for applying the name are different, the names are not identical."

  This respects Gongsun Long's focus on language. He is not making a claim about biology (is this animal a horse?); he is making a claim about linguistics (does this label apply to that label?).

  **B. The Mohist Concept of *Lei* (Kind)**
  The later Mohists (Gongsun Long's interlocutors/critics) developed the concept of *Lei* (kind/category). They would argue that two things can be different *names* but belong to the same *kind*.
  To articulate the strength of Move 2 without set theory, you can say:
  > "The 'Seeking' argument demonstrates a difference in **selection criteria**. If I select by the standard of 'Horse,' I accept yellow. If I select by the standard of 'White Horse,' I reject yellow. Therefore, the standards are distinct. Gongsun Long's error is not in seeing the standards are distinct, but in concluding that distinct standards preclude one thing from being a **instance** of the other."

  **C. Intension vs. Extension (in period-appropriate terms)**
  You can describe the difference using the Chinese philosophical distinction between *Shi* (Actuality/Thing) and *Ming* (Name).
  *   **Move 1 (Weak):** Argues that because the *Ming* are constructed differently (Shape + Color vs. Shape), the *Shi* must be different. This is a leap.
  *   **Move 2 (Strong):** Argues that because the *Ming* function differently in practice (satisfying different requests), the *Ming* are not identical. This is observationally true.

  The second argument is stronger because it stays within the realm of *Ming* (how names function) without making a dubious leap to *Shi* (the metaphysical status of the animal). It proves "The name 'White Horse' is not the name 'Horse'" (which is trivially true) rather than trying to prove "The animal is not the animal."

  ### Summary

  You have correctly identified that the *White Horse Dialogue* is not a monolithic block of sophistry.
  1.  **Your reconstruction is defensible:** The "Seeking" argument relies on substitutability failure, which is a valid logical test for non-identity of *terms*, even if it doesn't prove non-identity of *objects*.
  2.  **Your structural analysis aligns with expert scholarship:** Distinguishing the "Compound Name" argument from the "Pragmatic/Determinacy" argument is a standard move in serious sinology, even if pop-philosophy summaries miss it.
  3.  **Avoiding Anachronism:** Frame the strength of the second argument in terms of **naming criteria** and **pragmatic function** rather than set membership. Gongsun Long is arguing that because we *use* the words differently, the words *are* different. That is a much harder claim to refute than his metaphysical claims about shape and color.

  You have done the work of a careful philosopher here: you took a text that is often dismissed as a parlor trick and found the internal structure that makes it a serious, if flawed, inquiry into the relationship between language and reality. Keep following that thread; it leads directly into the Mohist Canons, which are even more fascinating.
