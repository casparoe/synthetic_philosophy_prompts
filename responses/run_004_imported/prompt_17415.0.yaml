answer: |-
  You have hit on a absolutely crucial distinction, and as a scientist, your instinct to look for the *n*-value and the control group is spot on.

  The short answer is: **There is no data.** There was no pond, there was no child, and there was no sample size.

  Peter Singer's "Drowning Child" is a **thought experiment**, not an empirical study. In philosophy, this is often called an "intuition pump" (a term popularized by Daniel Dennett). Its purpose isn't to describe how humans *actually* behave (descriptive), but to isolate a specific moral intuition to argue how we *ought* to behave (normative).

  However, since you are looking for the empirical reality behind the philosophy, there is actually a rich body of psychological research that tests the *premises* of Singer's argument. Here is the breakdown of the science behind the philosophy.

  ### 1. The Philosophical Purpose (Why there is no data)
  Singer's goal in *Famine, Affluence, and Morality* (1972) was to challenge the distinction between "duty" and "charity."
  *   **The Argument:** If you believe it is wrong to let a child drown because you don't want to ruin your shoes, you must logically believe it is wrong to let a child starve (via inaction) because you don't want to reduce your disposable income.
  *   **The Method:** He doesn't need to know if people *actually* walk past the pond. He is asking: *"If you saw this, would you agree you have a moral obligation to stop?"* He is betting that almost 100% of people will say "Yes."
  *   **The Gap:** Singer is aware that people fail to act. His argument is that this failure is a moral failing, not evidence that the obligation doesn't exist.

  ### 2. The Empirical Data (What actually happens in emergencies)
  While no one can ethically stage a real drowning child experiment, social psychologists have run thousands of staged emergency studies since the 1960s. Here is the data you are looking for regarding "costly helping."

  **The Subway Samaritan Study (Piliavin et al., 1969)**
  This is the closest real-world equivalent to Singer's pond.
  *   **Setup:** Confederates collapsed on a New York subway train. Some appeared ill (carrying a cane), others appeared drunk (smelling of alcohol).
  *   **Cost:** Helping required effort and potential social awkwardness (ruining the "social suit," if not the literal one).
  *   **Results:** Contrary to the cynical view, people helped **95% of the time** in the "cane" condition. Even in the "drunk" condition, help was offered **50% of the time**.
  *   **Relevance:** This suggests humans *are* wired to help, even at a cost, provided the victim is seen as "deserving."

  **The Bystander Effect (Darley & Latané, 1968)**
  *   **Setup:** Participants heard a seizure over an intercom.
  *   **Variable:** Whether they thought they were the only one who could help, or if others were present.
  *   **Results:** When participants thought they were alone, **85%** sought help. When they thought four others were present, only **31%** sought help.
  *   **Relevance:** Singer's scenario usually implies you are the *only* one there ("You are walking alone..."). In solitary conditions, helping rates are very high.

  **The "Identifiable Victim" Effect (Small & Loewenstein, 2003)**
  *   **Data:** People donate significantly more to a single, named individual (the drowning child) than to statistical masses (the starving millions).
  *   **Relevance:** This supports Singer's worry. We feel the obligation to the pond child, but our psychology fails to scale that obligation to the abstract concept of "famine relief."

  ### 3. Replication and Validity
  You mentioned the replication crisis in psychology. That is a valid concern.
  *   **Bystander Effect:** Recent meta-analyses (e.g., Phil Manning et al., 2022) suggest the effect is robust but smaller than originally thought. People still help often, but the presence of others dilutes responsibility.
  *   **Altruism:** The general consensus is that "costly signaling" or genuine altruism is a replicable human trait, but it is highly situational. Time pressure, ambiguity of the situation, and perceived cost (ruining clothes vs. saving a life) all shift the percentages.

  ### 4. The "Is-Ought" Problem
  As a biologist, you are trained to look at *what is*. Singer is arguing about *what ought to be*.
  *   **David Hume's Guillotine:** You cannot derive an "ought" from an "is." Even if data showed that 99% of people walked past the drowning child, Singer would argue they are still *morally wrong* to do so.
  *   **Evolutionary Biology View:** From your background, you might view the hesitation to help as an evolutionary trade-off (risk to self vs. kin selection). Singer's philosophy is essentially asking us to override our evolutionary programming with rational utilitarianism.

  ### Summary for the Biologist
  *   **Sample Size:** 0 (It is a hypothetical scenario).
  *   **Replication:** N/A for the specific scenario, but highly replicated in analogous emergency intervention studies.
  *   **Validity:** The *psychological prediction* (that people feel an obligation to help in immediate, solitary emergencies) is supported by data. The *philosophical claim* (that this obligation extends globally to distant strangers) is a normative argument, not a testable hypothesis.

  If you want to read more on the empirical side of this, look up **Paul Bloom's *Against Empathy*** (which critiques the "drowning child" intuition from a cognitive science perspective) or **Joshua Greene's *Moral Tribes*** (which uses fMRI data to analyze why we feel differently about the pond vs. famine).

  You aren't missing the data; the data doesn't exist because the question isn't scientific, it's ethical. But your skepticism is the exact bridge needed between the two fields.
