      *   **Core Question:** Is the distinction between "satisficing" (Simon) and "optimizing under constraints" (Stigler/Friedman/OFT modelers) substantive or merely a modeling convenience? Does Simon's distinction between *substantive* and *procedural* rationality successfully block the "redescription argument" (that any satisficing rule can be modeled as optimal given the right cost function), or does it just push the optimization problem up a level (meta-optimization)?
