      4.  Intervention in Occasionalism (Testing the Habit).
      5.  Counterfactuals (Divine Omnipotence).
      6.  LLMs vs. Humans (Agency within the Habit).
      7.  Conclusion.

  8.  (Reviewing against constraints): "Please actually engage with the structure of his specific arguments." -> Need to mention *qudra* (power), *ada* (habit), and the distinction between *logical* necessity and *temporal* conjunction.

