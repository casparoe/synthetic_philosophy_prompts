      *Wait, one nuance:* In Move 6, Nadia says passion is the "ideological form alienation takes." This is slightly more Frankfurt School/Boltanski than strict 1844 Manuscripts, but consistent with the tradition. I should note that.
      *In Move 1:* 0.25% equity. Does this make him a capitalist? Technically he owns a fraction of the means of production. But 0.25% of a startup is usually illiquid and doesn't grant control. Marxists would call this a "sweetener" to increase the intensity of labor, effectively lowering the cost of labor power relative to output.

