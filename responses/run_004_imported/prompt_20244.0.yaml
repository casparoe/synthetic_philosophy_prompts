answer: |-
  This is a classic stalemate in the philosophy of science, specifically centering on what Clark Glymour christened the "Problem of Old Evidence" in 1980. Given your background in experimental physics, you'll likely appreciate that this isn't just semantic quibbling; it strikes at whether our formal tools for "rational belief" actually map onto how we validate models against data.

  Here is the move-by-move breakdown, followed by the deeper issue both of them are circling but haven't quite nailed.

  ### Move 1: Mara's Opening (The Formal Problem)
  **The Claim:** If $P(E) = 1$ (the evidence is certain), then Bayes' Theorem dictates $P(T|E) = P(T)$. Therefore, old evidence cannot confirm a new theory. Since historians agree Mercury *did* confirm GR, Bayesianism is flawed.
  **The Verdict:** **Mara wins on formal grounds.**
  She is mathematically correct regarding standard subjective Bayesianism. In the Kolmogorov axioms that underpin standard Bayesian epistemology, if a proposition is known to be true, its probability is 1. Conditioning on a certainty yields no change in probability for any hypothesis. If the goal of the formalism is to model the *change* in credence (diachronic updating), she has successfully shown the math breaks for historical cases like Mercury. Dov cannot deny the arithmetic here.

  ### Move 2: Dov's First Counter (The Entailment Fix)
  **The Claim:** We aren't updating on $E$ (Mercury precesses); we are updating on the logical proposition $(T \to E)$ (GR entails Mercury's precession). Since the derivation was new, $P(T \to E)$ was $< 1$ before Einstein finished the math.
  **The Verdict:** **Dov wins on psychological plausibility.**
  Dov correctly identifies what *felt* new to the scientists in 1915. It wasn't the data; it was the structural connection between the new field equations and the data. This aligns with scientific practice: the "eureka" moment is often realizing your model *can* account for existing data without tuning parameters. However, while this describes the *psychology* of discovery accurately, it creates a formal tension that Mara is about to exploit.

  ### Move 3: Mara's Second Counter (Logical Omniscience)
  **The Claim:** Standard Bayesian agents are logically omniscient. If $T$ entails $E$, a standard Bayesian agent *must* assign probability 1 to that entailment immediately. To say $P(T \to E) < 1$ requires abandoning the standard axioms.
  **The Verdict:** **Mara wins on technical definition.**
  This is the crux of the philosophical technicality. Standard Bayesianism is a theory of *ideal* rationality, which includes knowing all logical consequences of one's beliefs. By allowing uncertainty about logical entailments, Dov is indeed proposing a modified system (often called "Bayesianism with limited logical omniscience" or "Garber-style updating"). Mara is right that this isn't a fix *within* the textbook framework; it is a revision of the framework itself.

  ### Move 4: Dov's Final Rebuttal (Idealization vs. Reality)
  **The Claim:** Logical omniscience is an unrealistic idealization. A confirmation theory that assumes it is useless for real science. Relaxing it is "honest repair."
  **The Verdict:** **Dov wins on pragmatic utility.**
  Mara is defending the purity of the formal system; Dov is defending its utility as a model of science. Since the discussion group is about how science *works*, Dov has the stronger pragmatic hand. A normative theory of confirmation that forbids scientists from gaining confidence in a theory because they already knew the data is arguably too idealized to be useful. However, Mara could counter that "usefulness" doesn't excuse formal inconsistency, but in a discussion about scientific practice, Dov's appeal to realism lands better.

  ---

  ### The Missing Piece: What Both Are Overlooking

  While Mara and Dov are fighting over whether to break the rules of Bayesianism to fit the history, they are both accepting a premise that many modern philosophers of science (and working physicists) reject.

  **They are both treating confirmation as purely *diachronic* (belief updating over time) rather than *synchronic* (structural support at a time).**

  Here is the deeper issue:

  **1. The Counterfactual Account of Support**
  The most robust solution to the Problem of Old Evidence (championed by philosophers like Colin Howson) doesn't require breaking logical omniscience or updating on entailments. Instead, it asks a counterfactual question: *"What would my credence in Theory T be if I did not know Evidence E?"*

  Even if $P(E) = 1$ in reality, we can assess the support $E$ gives $T$ by calculating the probability of $T$ in a hypothetical state where $E$ is removed from our knowledge base. If $P_{counterfactual}(T | \neg E)$ is significantly lower than our actual $P(T)$, then $E$ supports $T$, regardless of when $E$ was discovered.

  This appeals to your physics background: it's similar to checking a model's robustness. We ask, "If we didn't know the answer key, would this theory have predicted it?" That structural relationship exists timelessly, independent of when the human beings learned the facts. Mara and Dov are stuck arguing about the *timeline* of belief, missing that confirmation is often about the *logical fit* regardless of timeline.

  **2. The Comparative Nature of Confirmation (Likelihood Ratios)**
  Secondly, both are focusing on the absolute probability of GR ($P(T)$). In experimental physics, you rarely care about the absolute probability of a single model in a vacuum; you care about **model comparison**.

  The confirmation of GR didn't come just from $P(T|E)$ increasing. It came from the **Likelihood Ratio**:
  $$ \frac{P(E | T_{GR})}{P(E | T_{Newton})} $$

  *   $P(E | T_{GR})$ is essentially 1 (it falls out of the equations naturally).
  *   $P(E | T_{Newton})$ is effectively 0 (unless you add ad hoc hypotheses like the planet Vulcan, which lowers the prior of the Newtonian package due to complexity penalties).

  Even if $E$ is old ($P(E)=1$), the *ratio* of how well the two theories accommodate $E$ changes the relative odds between the theories. Mara and Dov are arguing about how GR gets a boost, but they are ignoring that the bigger story is Newton getting a penalty. The "confirmation" is actually a shift in the **posterior odds ratio** between competing hypotheses, not just the absolute credence in one.

  ### Summary for the Group
  If you want to stir the pot next week:
  1.  Tell **Mara** she's right that standard Bayesianism breaks here, but wrong that it matters if we switch to a **counterfactual measure of support**.
  2.  Tell **Dov** he's right that scientists aren't logically omniscient, but he doesn't need to break the probability axioms to fix it; he just needs to stop looking at absolute credence and start looking at **Likelihood Ratios** between rivals.
  3.  The "Problem of Old Evidence" dissolves if you stop asking "When did we learn this?" and start asking "How uniquely does this theory fit the data compared to its rivals?"

  Given your 35 years in physics, you might frame it this way: *Confirmation isn't about updating a diary of beliefs; it's about weighing the structural integrity of competing models against the data, regardless of when the data was collected.*
