      The student *answers* the "how" by invoking moral necessity, but then *undermines* the "contingent" part of the prompt in the final clause. They essentially say "It's contingent, but actually it isn't really." That's a contradiction. 3/7 might be more accurate. I'll stick with 4/7 because the "moral necessity" keyword is the heavy lifter there, and the ending is a bit of a flourish that goes too far, but shows they are thinking about the implication. I'll note the Spinoza risk in the comment.

      Okay, final plan:
