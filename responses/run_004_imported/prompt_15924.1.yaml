      *Wait, one more check on the Dutch Book description.*
      *   Student: "bookie offers you a bet now, plus a second bet later that's conditional on what your credence turns out to be".
      *   Van Fraassen's argument: At $t_0$, Bookie sells a bet on $A$. At $t_1$, if $P_1(A) = x$, Bookie sells a bet against $A$ (or vice versa) based on the discrepancy between $P_0(A | P_1(A)=x)$ and $x$.
