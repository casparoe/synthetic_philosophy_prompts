answer: |-
  Your intuition is sharp, and you aren't missing the obvious: on the surface, the Bem/Wagenmakers clash looks like a knockout victory for Bayesian statistics. It is the canonical case study used in many methods classes to illustrate the limitations of $p$-values.

  However, your friend isn't being difficult or cagey; she is pointing out a crucial nuance that often gets glossed over in introductory discussions. **Switching to Bayesian analysis is not a silver bullet for the replication crisis.**

  Here is the breakdown of why the Bem case doesn't settle the debate, why your friend is right about priors, and why changing the math doesn't fix the culture of science.

  ### 1. The "Priors" Problem (Why your friend is right)
  In frequentist statistics (standard $p$-values), the calculation assumes the null hypothesis is true and asks: *How unlikely is this data?* It does not care how plausible the hypothesis is beforehand.

  In Bayesian statistics, you calculate a Bayes Factor (BF), which compares the likelihood of the data under the null hypothesis vs. the alternative hypothesis. But to do this, **you must specify a prior distribution.** You have to mathematically define what you expect the effect size to look like before you see the data.

  *   **Wagenmakers' Argument:** He used a "default prior" that assumed large effects were unlikely. Because precognition is theoretically impossible (or at least highly implausible based on current physics), the prior probability of the hypothesis being true was very low. Therefore, even with "significant" data, the posterior probability didn't move much. The evidence remained weak.
  *   **Bem's Counter-Argument:** Bem and his supporters argued that Wagenmakers' prior was too skeptical. They argued that if you use a different, "wider" prior (one that allows for the possibility of smaller or more variable effects), the Bayes Factor actually *does* show evidence for precognition.

  **The Takeaway:** Two competent statisticians can look at the exact same data, use Bayesian methods, and come to opposite conclusions simply by choosing different **priors**. This introduces a degree of subjectivity that $p$-values don't have (though $p$-values have other subjectivities). If Bayes Factors depend on priors, and priors are debatable, then Bayes Factors aren't an objective "truth machine."

  ### 2. You Can "Bayes-Hack" Too
  A major driver of the replication crisis is **$p$-hacking** (collecting more data until $p < .05$, trying different variables until one works, etc.).

  Many people assume Bayesian statistics are immune to this because they don't rely on arbitrary cutoffs like .05. However, researchers can engage in **"BF-hacking."**
  *   You can try different priors until you get a Bayes Factor that supports your hypothesis.
  *   You can engage in "optional stopping" (checking the data as you go and stopping when the BF looks good). While Bayesian methods are more robust to optional stopping than frequentist methods, they are not immune if the stopping rule is motivated by the results.

  If the incentive is "publish positive results," researchers will find a way to get positive results, regardless of whether they are using $p$-values or Bayes Factors.

  ### 3. The Replication Crisis Isn't Just a Math Problem
  The replication crisis (power pose, ego depletion, etc.) wasn't caused solely by the use of $p$-values. It was caused by a combination of factors that changing the statistic doesn't fix:
  *   **Publication Bias:** Journals prefer positive results. This exists regardless of the math used.
  *   **Low Power:** Small sample sizes lead to noisy data. Bayesian analysis on a tiny, noisy sample will just give you a Bayes Factor that says "Insensitive Data" (i.e., we don't know). It doesn't magically create truth from thin air.
  *   **HARKing:** Hypothesizing After Results are Known. If you run an experiment, find a weird pattern, and then write the paper as if you predicted that pattern, you are misleading readers. A Bayes Factor calculated on a post-hoc hypothesis is just as misleading as a $p$-value.
  *   **Measurement Validity:** If you are measuring "ego depletion" with a task that doesn't actually measure ego depletion, your statistics (frequentist or Bayesian) are analyzing garbage.

  ### 4. The "Extraordinary Claims" Aspect
  The reason the Bem case feels like a slam dunk for Bayes is that **precognition is impossible.**
  In this specific instance, the Bayesian approach successfully encoded scientific skepticism (via the prior) to say, "This data isn't strong enough to overturn physics."

  However, most of the replication crisis isn't about impossible claims like telepathy. It's about plausible claims like "power posing makes you feel confident" or "priming makes you walk slower." For these plausible hypotheses, setting the prior is much harder. If we set the priors too skeptically for normal psychology research, we might miss real effects (Type II errors). If we set them too loosely, we accept false positives.

  ### 5. What is the Actual Solution?
  Your friend's hesitation reflects the current consensus among methodologists. The solution isn't "Swap $p$-values for Bayes." The solution is **Open Science practices**:
  *   **Preregistration:** You declare your hypothesis and analysis plan *before* collecting data. This stops $p$-hacking and HARKing, regardless of which statistic you use.
  *   **Larger Samples:** Increasing power reduces noise.
  *   **Transparency:** Sharing data and code so others can check the work.
  *   **Replication:** Actually repeating studies to see if they hold up.

  Many statisticians now advocate for a **"Both/And" approach**. Report $p$-values (because they are standard and easy to interpret for error rates) *and* Bayes Factors (to quantify evidence strength) *and* effect sizes with confidence intervals (to show magnitude).

  ### Summary
  You aren't wrong that the Bem case highlights a major flaw in dichotomous $p$-value thinking ($<.05$ = truth). Wagenmakers showed that "statistical significance" does not equal "evidence."

  But your friend is right that **Bayesian statistics are not a get-out-of-jail-free card.** They shift the burden of assumption from the significance threshold to the prior distribution. If we had required Bayes Factors in 2010, we likely still would have had a replication crisis, because the crisis was driven more by **researcher incentives and flexibility** than by the specific formula used to calculate significance.

  The fix isn't better math; it's better science practices.
