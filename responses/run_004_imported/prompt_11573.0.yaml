      *   *The Problem:* If I don't water my plant, it dies. (Intuitive cause). But if *you* don't water my plant, it also dies (counterfactually). If the rain doesn't come, it dies. If the sun doesn't explode, it dies (maybe?). The naive view makes everything that *could* have prevented the effect a cause.
      *   *Goal:* Create a scenario where the intuitive omission is clear, but the "noise" of other potential preventers is also vivid and plausible enough to show the over-generation problem.

