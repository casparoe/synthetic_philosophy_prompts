          *   *Omission:* Supervisor (Elias) gets distracted by a call, skips verification. Pin was loose. Sub implodes at depth.
          *   *Process:* Elias did nothing. No physical process from "not checking" to "implosion."
          *   *Counterfactual Glut:* If Elias checked -> Safe. If the Engineer designed a sensor -> Safe. If the Manufacturer didn't make a loose pin -> Safe. If the Coast Guard forbade the dive -> Safe. If the Supervisor's wife hadn't called -> Safe.
          *   *Why this works:* It's distinct from plants/lifeguards. It involves a specific human omission amidst a chain of potential preventative omissions.

  4.  **Drafting the Scenario:**
      *   Need to ensure the "Process" failure is clear (no energy/momentum from the omission).
