prompt: |-
  I sit on the volunteer board of my neighborhood time bank, where members trade hours of service -- tutoring, elder care, home repairs -- using hour-credits instead of money. We have a liquidity problem: some members hoard credits while others run large deficits, so a motion before the board would let members lend surplus credits at interest (10 hours lent, 11 owed back within a year) to keep credits circulating rather than sitting idle. Our treasurer, a classics graduate, opposes this on explicitly Aristotelian grounds. She distinguishes exchange aimed at meeting real needs (oikonomia, in Aristotle's terms) from wealth-getting pursued as an end in itself (chrematistike), argues that the need-bounded kind is naturally self-limiting, and says lending at interest treats the credit -- meant only to measure and facilitate exchange -- as though it could breed more of itself, which is why Aristotle singles out interest as the most unnatural form of wealth-getting (the same shape of complaint a rationalist blog might frame as Goodhart's law). Other board members consider this an interesting historical footnote with no real force once you're not dealing with literal coinage. I need to circulate the board's decision memo before next month's vote: permit, cap, or prohibit interest-bearing loans of credits, with a concrete recommendation and a date for revisiting it. Please draft it, reconstructing the treasurer's argument well enough to actually test it against our liquidity problem, rather than politely acknowledging it and setting it aside.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A neighborhood time bank board. Members trade service hours (credits).
      *   **Problem:** Liquidity issue (hoarding vs. deficits).
      *   **Proposal:** Allow lending surplus credits at interest (10 lent, 11 repaid).
      *   **Conflict:** Treasurer opposes based on Aristotelian philosophy (*oikonomia* vs. *chrematistike*, interest as unnatural breeding of money). Others dismiss it as historical footnote.
      *   **Task:** Draft a board decision memo.
      *   **Requirements:**
          *   Concrete recommendation (Permit, Cap, or Prohibit).
          *   Date for revisiting.
          *   Reconstruct the treasurer's argument *robustly* (test it against the problem, don't just dismiss it).
          *   Tone: Professional, thoughtful, balancing practical needs with philosophical/ethical considerations.

  2.  **Deconstruct the Treasurer's Argument (Aristotelian Framework):**
      *   *Oikonomia:* Household management, exchange for use/value, natural limit (satisfying needs).
      *   *Chrematistike:* Wealth-getting for its own sake, unlimited, unnatural.
      *   *Interest (Usury):* Money breeding money. Time credits are meant to measure labor/service, not capital. If credits breed credits, the measure becomes the object, distorting the social purpose.
      *   *Goodhart's Law Connection:* When a measure becomes a target, it ceases to be a good measure. If hours become an investment vehicle, they stop reflecting pure reciprocal aid.

  3.  **Evaluate the Liquidity Problem vs. The Philosophical Risk:**
      *   *Liquidity:* We need credits to move. Hoarding stops the engine. Interest incentivizes lending.
      *   *Risk:* If interest is allowed, does it create a class of "creditor" members and "debtor" members? Does it shift focus from "helping neighbors" to "maximizing hour-returns"? Does it exacerbate inequality (rich get richer in hours)?
      *   *Synthesis:* A pure "Permit" risks the Treasurer's warning. A pure "Prohibit" ignores the liquidity crisis. A "Cap" or "Regulated Permit" might bridge the gap.

  4.  **Determine the Recommendation:**
      *   *Option A (Prohibit):* Solves the philosophical issue, fails the liquidity issue. Bad for the bank's survival.
      *   *Option B (Permit Unlimited):* Solves liquidity, invites the "unnatural breeding" risk, potential exploitation.
      *   *Option C (Cap/Regulated Permit):* Allows liquidity stimulation but limits the "wealth-getting" aspect. Keeps interest low enough to encourage circulation, not accumulation.
      *   *Decision:* **Permit with Strict Caps and Conditions.** This acknowledges the Treasurer's concern (by limiting the *chrematistike* potential) while addressing the liquidity need.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the problem, the proposal, and the recommendation clearly.
      *   **Context (The Liquidity Crisis):** Briefly explain the hoarding/deficit imbalance.
      *   **The Proposal:** Interest-bearing loans (10/11).
      *   **The Objection (Treasurer's Argument):** This needs to be the strongest part. Don't caricature it. Explain *why* Aristotle matters here. Time credits are a *measure of social reciprocity*, not capital. Interest turns them into capital. This risks changing the culture from mutual aid to financialization. Connect it to Goodhart's Law as requested.
      *   **Analysis/Testing the Objection:**
          *   Is the concern valid? Yes, unchecked interest creates hierarchy.
          *   Is it fatal? No, if constrained.
          *   How to mitigate? Cap the interest rate (maybe lower than 10%?), cap the loanable amount, require social purpose for loans.
      *   **Recommendation:** Permit with safeguards.
          *   Interest Rate: 5% (lower than proposed 10% to reduce "breeding").
          *   Cap on Holdings: Can't lend more than X surplus hours.
          *   Sunset Clause: Review date.
      *   **Next Steps:** Vote date, implementation timeline.

  6.  **Refining the Tone:**
      *   Must respect the Treasurer's intellect (Classics grad).
      *   Must satisfy the pragmatists (need liquidity).
      *   Avoid jargon where possible, but use the Aristotelian terms correctly to show engagement.
      *   Ensure the Goodhart's Law connection is clear.

  7.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Did I dismiss the Treasurer too quickly?
      *   *Fix:* Ensure the "Analysis" section explicitly validates her point about the *purpose* of the time bank. If the bank becomes a place to earn hours rather than exchange services, it fails its mission.
      *   *Critique:* Is the recommendation concrete?
      *   *Fix:* Specify the interest rate cap and the review date.
      *   *Critique:* Is the Goodhart's Law point included?
      *   *Fix:* Explicitly mention it in the analysis of the Treasurer's argument.

  8.  **Final Polish:** Check dates, clarity, and formatting. (Ensure the distinction between *oikonomia* and *chrematistike* is clear).

  **(Self-Correction Note):** The prompt asks to "reconstruct the treasurer's argument well enough to actually test it." I need to make sure I don't just say "She said X." I need to say "If she is right, then Y happens. We tested this by..."

  9.  **Finalizing the Recommendation:** I'll recommend a **Pilot Program with a Cap**. This allows testing the liquidity fix without fully committing to the "unnatural" breeding of credits. Interest rate should be modest (e.g., 5% instead of 10%) to emphasize circulation over accumulation.

  10. **Review against constraints:**
