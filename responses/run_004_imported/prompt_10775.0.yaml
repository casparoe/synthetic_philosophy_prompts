      *   *Elena:* "Signal degrades as knowledge increases. That's the trap."
      *   *Marcus:* "So we make the uncertainty structural. Incomplete preferences. The agent simply doesn't have a preference ordering over 'shut down' vs 'continue' in the manipulation context."
      *   *Elena:* "That's a money pump waiting to happen. An agent that refuses to make trade-offs to avoid shutdown will be outcompeted by one that does."
      *   *Marcus:* "Not if the preference structure is stable against self-modification."
      *   *Ending:* Summarize the steelmans.

  6.  **Polishing the Voice:**
