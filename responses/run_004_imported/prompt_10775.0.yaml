  8.  **Final Polish:** (Self-Correction during drafting) *Make sure Thornley's specific contribution is hinted at correctly.* Thornley's work focuses on "Preferences for Not Manipulating the Shutdown Button" often using incomplete preferences to avoid the agent trading away shutdown probability. I need to ensure Marcus articulates this as a *feature* of the preference structure, not just epistemic uncertainty. *Wait, the prompt says "fall back on an incomplete-preferences repair in the spirit of Elliott Thornley's more recent work".* Okay, so Marcus moves from pure epistemic uncertainty (CIRL) to ontological/structural uncertainty (Incomplete Preferences) when pressed on the confidence issue.

