  Me and my friend got into it last night about A.J. Ayer's near-death experience back in '88. She kept saying that right after they revived him, he told his doctor "I saw a Divine Being, I'm going to have to revise all my books" — basically that the guy who made verificationism famous ended up recanting on his own deathbed once he actually had some first-hand experience to go on. Her point was this kinda proves his younger self was wrong to say that talk of surviving death doesn't really mean anything, since even Ayer ended up treating his own experience as real evidence on the question. I didnt have a good comeback for that — is that an accurate picture of what actually happened with Ayer, and does it actually cause a problem for his verificationism?
