      *   **Refining the Disagreement:** Alex needs to concede that *some* things aren't scientific but insist that *truth claims* must be scientific. Maria needs to insist that "truth" has multiple grammars.
      *   **Ending:** They shouldn't agree. They should identify the fault line. Is it about the definition of "belief"? Or the scope of rationality? Let's aim for: Alex thinks "belief" implies "model of reality." Maria thinks "belief" implies "orientation toward reality."

  4.  **Refining the Argument (Self-Correction during drafting):**
