answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the privilege of being [Father's Name]'s child.

  Forty-one years. That is the number we are celebrating tonight. Forty-one years at the stamping plant. For those of us who didn't work alongside him, it's hard to truly measure what that means. It's roughly ten thousand mornings of waking up before dawn. It's the noise, the repetition, the physical toll, and the quiet pride of a job that needs to be done.

  In preparing for tonight, I found myself thinking about an essay written in 1930 by the economist John Maynard Keynes. He made a bold prediction. He guessed that within a hundred years—meaning, right around now—society would advance enough to solve what he called "the economic problem." He believed we would become efficient enough that our grandchildren wouldn't need to work nearly as hard as we do to survive.

  But Keynes had a worry. He wondered if, after generations of being bred to labor, ordinary people would know what to do with their freedom. He feared that when the work stopped, we might feel lost without it.

  Dad, you are the test case for that theory.

  Keynes assumed that work was just a burden we endure to live. But watching you for forty-one years, I learned that for you, work was never just about the paycheck. It was about showing up. It was about reliability. It was about building a floor for this family so we could stand on it. You solved the economic problem for us, so we wouldn't have to worry about it the way you did.

  Now, the machines at the plant will keep stamping, but you won't be there to hear them. And I know Keynes's worry is unfounded when it comes to you. You aren't going to be lost in this leisure. You've spent a lifetime cultivating the things that actually make life worth living: your garden, your friends, this family, and the quiet mornings that used to belong to the shift schedule, but now belong to you.

  Keynes thought the challenge of retirement was finding something to do. But looking at you, I realize the challenge wasn't the activity. It was earning the right to choose. And you have earned that, a thousand times over.

  So, to the brother-in-law at the table who knows the theory: Keynes was right about the timeline, but he was wrong about the man. And to Dad: May your next chapter be defined not by what you have to produce, but by who you get to be.

  To Dad.
