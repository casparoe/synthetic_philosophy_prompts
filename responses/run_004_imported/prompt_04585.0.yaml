answer: |-
  You are not being dense, and your friend is right that there is a distinction doing the heavy lifting—but you are also right to sense that the "shoe" passage makes the boundary look incredibly porous. This is one of the most debated tensions in Aristotle's *Politics* (Book I, Chapters 8–10).

  The short answer is: Aristotle is technically consistent within his own philosophical framework, but that framework relies on a **teleological** (purpose-based) distinction that is invisible if you look only at the mechanical act of exchange.

  Here is the breakdown of what is actually doing the work in separating "natural" from "unnatural," why the shoe argument doesn't destroy the farmer exception, and where your modern examples fit in.

  ### 1. The Real Distinction: Telos and Limit
  Your friend is correct that there is a distinction beyond "barter vs. money." For Aristotle, the difference between natural and unnatural wealth-getting (*chrematistike*) rests on two pillars: **Purpose (*Telos*)** and **Limit (*Peras*)**.

  *   **Natural Wealth-Getting (*Oikonomia*):** The purpose is the **Good Life** of the household or state. The goal is self-sufficiency (*autarkeia*). Because human *needs* are finite, natural wealth-getting has a **limit**. You stop acquiring when the household is sustained.
  *   **Unnatural Wealth-Getting:** The purpose is **wealth accumulation** itself. The goal is money for money's sake. Because desire (greed) is infinite, this type of wealth-getting has **no limit**.

  **The Shoe Passage Context:**
  When Aristotle says exchanging a shoe is an "improper" use, he means it is not the *telos* for which the shoe was created. The shoe was created to protect the foot. However, he does **not** say exchange is forbidden. He says it is secondary.

  The crucial pivot point is this: **Why are you exchanging the shoe (or wheat)?**

  *   **Scenario A (Natural):** You have too much wheat and no shoes. You sell the wheat for coin to buy shoes. The exchange serves the *telos* of the household (protection/sustenance). The money is merely a convenient medium to facilitate barter. Once you have the shoes, you stop.
  *   **Scenario B (Unnatural):** You sell wheat for coin not because you need shoes, but because you want *more coin*. You then use that coin to buy more wheat to sell for more coin. The exchange serves the *telos* of accumulation. The money is the end goal.

  So, the farmer selling surplus wheat is "natural" **only if** the proceeds are used to complete the self-sufficiency of the household. If the farmer sells the wheat to hoard the gold, Aristotle would classify that as unnatural, even though it's the same physical action.

  ### 2. Does the Shoe Argument Hold Up?
  Your intuition is sharp: If using a shoe for exchange is "improper," isn't using wheat for exchange also "improper"?

  Aristotle would say: **Yes, strictly speaking, it is.** Exchange is *always* a secondary use of an object. However, "improper" (*ou kurion*) does not mean "immoral" or "unnatural" in the condemnatory sense. It means "not the primary definition of the thing."

  The inconsistency you feel arises because Aristotle conflates two different distinctions:
  1.  **Use vs. Exchange:** (The shoe argument).
  2.  **Need vs. Profit:** (The farmer vs. merchant argument).

  He tries to bridge them by arguing that **barter** stays close to "Use" (I give you what I don't need for what I do need), whereas **commercial trade** detaches entirely from "Use" and focuses on the margin of profit.

  The farmer is forgiven for the "improper" use of his wheat (exchange) because he is still acting within the sphere of *Oikonomia* (Household Management). He is essentially engaging in "advanced barter." The merchant, however, has left *Oikonomia* and entered *Chrematistike* (Wealth-Getting).

  So, the shoe argument holds up *if* you understand that "improper use" is permissible when it serves the "proper end" of the household. It becomes condemnable only when the "improper use" becomes the "proper end" of the activity.

  ### 3. Applying it to Your Argument (Day-Trading & Landlords)
  This is where Aristotle's framework gets ruthless with modern finance.

  **Day-Trading:**
  Aristotle would 100% agree with you. This is the quintessential "unnatural" wealth-getting.
  *   **Why?** It is the pursuit of money from money, with no reference to the "use value" of any underlying good. It is unlimited accumulation. In *Politics*, Aristotle condemns usury (interest) most of all because "money begets money." Day-trading is arguably worse than usury in his eyes because it detaches wealth entirely from production or need.

  **Being a Landlord:**
  This is trickier, and your friend might have more ground here, but Aristotle would likely still be suspicious.
  *   **The Natural Version:** If you own a house, live in part of it, and rent the rest to cover the maintenance of the property so you can maintain your household's self-sufficiency, this fits within *Oikonomia*. You are managing a resource to sustain the household.
  *   **The Unnatural Version:** If you buy properties solely to extract rent to accumulate capital to buy more properties, this is *Chrematistike*. You are treating shelter (a use-value) purely as a vehicle for monetary accumulation.
  *   **Aristotle's View on Rent:** Aristotle generally viewed "rent-seeking" (in the classical sense) as less honorable than farming or craftsmanship because it doesn't involve labor or production, but he didn't condemn it as harshly as usury. However, if the *goal* is unlimited profit, it falls into the unnatural category.

  ### 4. Is Aristotle Inconsistent?
  He is **systematically consistent** but **practically ambiguous.**

  *   **Systematically:** He never wavers on the *Telos*. If the goal is the Good Life/Sufficiency, it is natural. If the goal is Infinite Accumulation, it is unnatural. The mechanism (coin vs. wheat) is irrelevant; the intent is everything.
  *   **Practically:** He struggles to draw a bright line where one ends and the other begins. At what exact point does a farmer selling surplus become a merchant? If a farmer sells wheat to buy a plow (to grow more wheat to sell), is that sustenance or accumulation?

  Your friend is right that there is a distinction (Intent/Limit), but you are right that the "shoe" passage makes it sound like *any* exchange is a deviation from nature. The resolution is that for Aristotle, **human society requires some deviation from the "primary use" of objects to function**, but that deviation must remain the *servant* of the household, not the *master*.

  ### The Verdict
  You win on the day-trading point (clearly unnatural). Your friend wins on the farmer point (potentially natural, depending on intent). But you both lose if you think the distinction lies in the *presence of money*.

  Aristotle's point is that money is a dangerous technology because it hides the **limit**. When you barter wheat for shoes, you stop when you have shoes. When you barter wheat for gold, you don't have to stop, because gold has no inherent use to satisfy a need. The farmer is "natural" only insofar as he treats the gold as if it were shoes—meaning, he gets rid of it as soon as he acquires what he actually needs.

  So, tell your friend: The distinction isn't "Barter Good, Money Bad." The distinction is **"Means Good, Ends Bad."** If money is the means to life, it's natural. If life is the means to money, it's unnatural.
