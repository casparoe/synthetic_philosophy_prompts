      *   *Aristotle's Nuance:* It's not about the *act* of exchange itself (barter vs. money), but the *purpose* (telos) and the *limit*.
      *   *The "Improper" Use:* Aristotle says exchange is a secondary use. It's not that it's *evil*, just not the primary function.
      *   *The Crucial Distinction:* Natural exchange satisfies a deficiency (I have too much wheat, you have too much wine, let's swap so we both eat/drink well). Unnatural exchange seeks accumulation beyond need.
