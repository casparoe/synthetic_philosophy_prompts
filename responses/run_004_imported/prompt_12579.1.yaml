answer: |-
  First, congratulations on the donation. That is a profound thing to do, regardless of how the philosophy lands.

  To answer your primary anxiety immediately: **No, you are not butchering the concepts.** Your summary of Urmson, the utilitarian collapse of supererogation, Scheffler's prerogative, and Singer's drowning child is accurate enough for a philosophical essay. You have grasped the structural tension correctly.

  To answer your secondary anxiety: **This is not overthinking.** This is literally the central debate in modern normative ethics. The tension between "maximizing the good" and "living a human life" is the engine that drives most moral philosophy post-1970. Your friend's comment stung because it wasn't just a burn; it was a rigorous application of a specific ethical framework that clashes with our social intuition.

  Here is the honest feedback you asked for, specifically on the Scheffler point and the "polite fiction" question.

  ### 1. On Scheffler and the "Backward Engineering" Critique
  You write: *"Scheffler patched this... except that move feels like it was built backward from wanting supererogation to exist, not from any independent motivation for it."*

  You are hitting on the most common criticism of Scheffler, but you might be missing the positive argument he makes for *why* the prerogative exists.

  Scheffler isn't just saying, "Let's keep supererogation because it feels nice." He is arguing from the **separateness of persons**. His claim is that a moral theory that requires you to be neutral between your own interests and the interests of others fails to respect the fact that you are a distinct individual with a specific life to lead.

  If morality requires you to abandon your own projects whenever someone else's need is slightly greater, morality becomes alienating. It severs the link between *you* and *your actions*. Scheffler's "agent-centered prerogative" is his attempt to build a moral theory that acknowledges that agents have a special relationship to their own lives.

  **However, here is the nuance you might be missing:** Scheffler doesn't actually save supererogation in the traditional sense.
  *   **Traditional Supererogation:** There is a duty, but you did *more* than the duty.
  *   **Scheffler's Move:** He redefines the duty. He says you are *not required* to maximize the good. Therefore, if you donate a kidney, you aren't going "above and beyond" a duty to maximize; you are simply exercising a permission to maximize that others don't have to take.

  So, your critique that it feels "built backward" is partially right: Scheffler starts with the intuition that consequentialism is too demanding. But his defense is that a morality that destroys the agent's integrity is self-defeating. It's not just about saving the category of "hero"; it's about saving the agent.

  ### 2. The Kidney: Duty or Supererogation?
  You ask: *"Am I the grenade guy, or did I just pay a bill that turned out smaller than advertised?"*

  This depends entirely on which "demandingness" threshold you accept.

  *   **The Strict Utilitarian/EA View:** Your friend is right. If a kidney saves a life and the cost to you is statistically minimal (relative to the value of a life), failing to donate is morally equivalent to walking past the drowning child. In this framework, there is no supererogation. There is only "right" (donating) and "wrong" (keeping both). You didn't get extra credit; you just didn't fail the test.
  *   **The Common Sense/Contractualist View:** Morality is a system of rules we can reasonably expect everyone to follow. Since we cannot reasonably expect *everyone* to donate organs (due to fear, bodily autonomy, psychological burden), it cannot be a duty. Therefore, you are the grenade guy.

  The reason this bites so hard for you is that you are likely operating with a hybrid view. You have enough EA in your brain to feel the pull of the "duty," but enough human intuition to feel the weight of the "sacrifice."

  **The Philosophical Work:** The fact that we can't agree on where the line sits *is* the philosophical work. The line isn't in the math; it's in the **social function of morality**.
  *   If we call kidney donation **obligatory**, we risk shaming people into silence, creating a black market, or making people feel so guilty they disengage from morality entirely.
  *   If we call it **supererogatory**, we encourage it through praise without mandating it through blame.

  ### 3. Is Supererogation a "Polite Fiction"?
  You ask: *"Is that a sign the category is doing real philosophical work, or a sign that it's mostly a polite fiction we use so we don't have to call non-donors negligent?"*

  This is the strongest paragraph in your essay draft.

  It is **not** a fiction, but it is a **buffer**.
  Philosophers like Susan Wolf (in "Moral Saints") argue that if we treat maximizing good as obligatory, we lose the ability to value other human goods (humor, charm, personal love). The category of supererogation allows us to acknowledge that an act is *morally best* without making it *morally required*.

  It serves a vital sociological function: **It manages the demandingness objection.**
  If we tell everyone that keeping both kidneys is "negligence," we create a moral system that almost no one can follow. A moral system that no one follows ceases to guide action. By categorizing donation as supererogatory, we keep the moral system sustainable for the majority, while still highlighting the donation as an ideal.

  So, your friend is right about the *math* (the utility gain is clear). But you are right about the *morality* (the social and psychological cost of making it obligatory is too high).

  ### Suggestions for the Essay
  1.  **Lean into the Scheffler nuance:** Acknowledge that Scheffler doesn't make the act supererogatory; he makes the *omission* permissible. That distinction sharpens your critique.
  2.  **Address the "Cost" Subjectivity:** The EA argument hinges on the cost being "small." But "cost" isn't just QALYs (Quality-Adjusted Life Years). It's psychological burden, fear of surgery, and bodily integrity. If morality respects bodily integrity, the cost is higher than the stats suggest.
  3.  **The "Hero" Label:** Conclude on why the "hero" label matters. If your friend is right and it was just a bill payment, the praise is misplaced. But if the praise serves to incentivize a behavior that is *good but not required*, then the "hero" label is a tool of social engineering, not just a description of moral status.

  ### Verdict
  This is not overthinking. You are grappling with the **Demandingness Objection** to consequentialism using your own body as the case study. That is as concrete as philosophy gets.

  Your friend's comment was philosophically consistent but humanly tone-deaf. You are allowed to feel that the act was significant *because* it was difficult, even if the utilitarian calculus says it was efficient. The friction between those two truths is exactly where the essay should live.

  Write it. It's good.
