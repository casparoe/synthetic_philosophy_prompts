answer: |-
  "Metamagical Themas," Maya said, adjusting her backpack strap. "It was the column on the Prisoner's Dilemma. But you're stuck on the clone example."

  Leo kicked a stone along the sidewalk. "Because the clone example is the only one where the math holds water. If I'm playing against a literal copy of myself, sure. My decision *is* their decision. But we aren't copies, Maya. I had coffee this morning; you didn't. My serotonin levels are different. Where is the link?"

  "The link isn't causal, it's logical," Maya said. "Think about Newcomb's problem. If the predictor is only ninety percent accurate, you still one-box. The expected utility shifts. It doesn't require omniscience, just high correlation."

  "Newcomb involves a predictor looking at you," Leo countered. "Here, you're claiming a sideways link between two separate brains. You're talking about subjunctive dependence—like Functional Decision Theory says. But that requires we're running the same algorithm. We aren't. I'm a slightly fine-tuned version of 'human rationality,' and so are you, but the weights are different."

  "So it's a matter of degree," Maya said. "If we're ninety percent similar in our reasoning structures, then there's a ninety percent chance our decisions correlate. If I cooperate, it's evidence that you cooperate. That's enough to tip the expected value away from defection."

  "Evidence?" Leo stopped walking. "That's the leap. In a one-shot dilemma, my choice cannot causally influence yours. If I defect, I get the better payoff regardless of what you do, unless you're magically forced to match me. You're saying my reasoning *forces* yours?"

  "No, I'm saying my reasoning *predicts* yours because we're both optimizing for the same truth," Maya said. "If 'cooperate' is the rational answer, we both find it. If 'defect' is the rational answer, we both find that. To defect is to assert that 'defect' is the correct solution. But if it's the correct solution, you'll find it too. You can't hope to be the one exception who finds the right answer while I find the wrong one, if we're reasoning identically."

  "But we aren't reasoning identically!" Leo threw his hands up. "That's the whole point. Where's the cutoff? If I'm sleep-deprived and you're not, does superrationality vanish? If I'm a utilitarian and you're a Kantian? You need a shared algorithm for this subjunctive dependence to work. Without exact identity, you're just hoping for a coincidence."

  "It's not a coincidence, it's convergence," Maya insisted. "Two calculators don't need to be manufactured in the same factory to agree that two plus two equals four. They just need to be functioning calculators."

  "Math is deterministic," Leo said. "Morality isn't. And even in math, if one calculator has a stuck key, it fails. How do you know I don't have a stuck key? How do you know *you* don't? Once you admit we aren't identical, you admit the possibility of divergence. And if divergence is possible, the symmetry breaks. If I defect, maybe you cooperate. If that 'maybe' exists, standard dominance reasoning takes over. I defect."

  "So you're saying unless we're perfect twins, we revert to standard Nash equilibrium?" Maya asked. "That seems fragile. It implies cooperation is impossible for anyone who isn't a clone. That defeats the whole purpose of rationality."

  "It implies cooperation requires trust or contracts, not magic logic," Leo said. "You want the logic to do the work of a social bond. But logic alone doesn't bind us unless we're the same entity. And we're not."

  "We're similar enough," Maya said, starting to walk again. "Close enough that betting on divergence is betting against yourself."

  "Similar enough is not a number," Leo called after her. "And without a number, you're just guessing."

  "Maybe," she said. "But I'd rather guess we're aligned than assume we're strangers."

  Leo watched her go, unsure if she'd answered him or just restated the faith.
