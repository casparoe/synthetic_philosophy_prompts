answer: |-
  Here are 10 sequenced questions designed to tighten the pressure on the "Deep Morality vs. Law" distinction, incorporating your specific thematic requirements.

  **1. The Action-Guiding Problem**
  "You've drawn a sharp line between the 'deep morality' of combat (which is asymmetric) and the 'law of armed conflict' (which stays symmetric for practical reasons). But ethics is traditionally action-guiding. If your moral theory explicitly tells us *not* to change the laws that govern actual behavior, what practical work is this 'deep morality' actually doing? Is it merely descriptive, or does it have normative force?"

  *   **Follow-up:** "If you say it guides individual conscience: Does it guide the unjust combatant to surrender? If so, and the law doesn't protect them upon surrender, aren't you advocating a morality that requires them to walk into a trap?"

  **2. The Epistemic Barrier (Required Theme)**
  "Let's press the epistemic argument. Traditional symmetry rests on the idea that combatants cannot reliably know which side is objectively 'just' in the *ad bellum* sense. If an unjust combatant cannot know they are unjust, how can they be 'liable' to attack? How can I be morally liable for violating a constraint I couldn't reasonably know existed?"

  *   **Follow-up:** "If you reply that liability is objective regardless of knowledge: Then aren't you admitting that your 'deep morality' is inaccessible to the very agents supposed to be governed by it? How can a morality be binding if it's epistemically opaque to the soldier in the trench?"

  **3. Liability Without Culpability (Required Theme)**
  "You distinguish between being 'culpable' and being 'liable.' You argue the unjust combatant is liable even if not culpable. But take the conscript fighting under duress—threatened with execution if they don't fight. They lack culpability. On what specific moral ground are they 'liable' to be killed? If they aren't responsible for the threat, why does the right to kill them revert to the just combatant rather than remaining a tragic necessity?"

  *   **Follow-up:** "If you say they are 'instrumental threats' regardless of duress: Doesn't that reduce the human combatant to a mere object? If duress negates culpability, why does it fail to negate liability? Where is the moral difference in your framework?"

  **4. The Right to Self-Preservation (Required Theme)**
  "Let's look at the moment of engagement. Once the shooting has actually started, does the unjust combatant retain *any* narrower right to use force to save their own skin? If a just combatant is shooting to kill them, does your theory forbid the unjust combatant from shooting back purely to survive, even if they can't win the war?"

  *   **Follow-up:** "If you say 'No, they must accept the risk': You are demanding martyrdom from the unjust side. If you say 'Yes, they can defend themselves': How is that functionally different from the traditional moral equality of combatants? Haven't you just reintroduced symmetry through the back door of self-preservation?"

  **5. The Just Combatant's Burden**
  "If the unjust combatant is merely a 'liable threat' and not a culpable aggressor, does that change the *just* combatant's moral obligations? Does the just combatant have a stricter duty to minimize harm to them than they would toward a culpable terrorist? Or does 'liability' wipe the slate clean for the just shooter?"

  *   **Follow-up:** "If you say the just combatant has no extra duty: Then 'liability' seems to function exactly like 'permission to kill without restraint.' If you say they *do* have extra duties: How can they fulfill those in the fog of war without reverting to symmetric rules of engagement?"

  **6. The Publicity Condition**
  "Rawls argues that moral principles must be publicizable without undermining their own ends. If we teach your 'deep morality' to soldiers, unjust combatants might believe they have no right to fight and surrender, only to be treated as POWs or criminals under current law. Doesn't publicizing your theory create a lethal asymmetry of information that gets soldiers killed without achieving justice?"

  *   **Follow-up:** "If you say 'We only teach it to philosophers': Then it's an academic exercise, not a moral theory. If you say 'We teach it but tell them to ignore it in practice': Isn't that morally schizophrenic? You're asking agents to hold a moral belief that they are forbidden to act upon."

  **7. Conflict of Duty (Law vs. Morality)**
  "You say the law can stay symmetric while morality is asymmetric. But what happens when they conflict? If a soldier comes to believe your 'deep morality' is true, are they morally obligated to violate the symmetric laws of war? For example, should a just combatant refuse to target unjust combatants who are trying to surrender if the law says they must accept it?"

  *   **Follow-up:** "If you say 'No, follow the law': Then the 'deep morality' is inert; it never overrides anything. If you say 'Yes, follow the morality': You are advocating for the breakdown of the Geneva Conventions based on a subjective assessment of justice. Which is it?"

  **8. The Nature of Liability**
  "I want to press the 'liable but not culpable' distinction again. If liability doesn't stem from fault or culpability, but merely from being on the unjust side of an objective fact, isn't this just strict liability? In almost every other area of ethics, we don't permit lethal force against non-culpable agents. Why is war the exception where 'being wrong' makes you 'killable' even if you aren't 'guilty'?"

  *   **Follow-up:** "If you argue war is a unique 'state of nature': Then why bother with moral categories like 'liability' at all? Why not just admit that in war, might makes right, and drop the pretense of moral distinction?"

  **9. Symmetry as a Moral Good**
  "Is it possible that procedural symmetry *is* itself a moral good, not just a pragmatic hack? If the alternative is a system where every soldier must act as a judge of their cause before shooting, leading to hesitation and greater chaos, isn't the symmetric rule morally superior *all things considered*? Why is your 'deep morality' deeper than the moral value of order and restraint?"

  *   **Follow-up:** "If you concede symmetry has moral value: Then your 'deep morality' isn't actually asymmetric; it's a complex balance of justice and order. If you deny it has moral value: You are treating the laws of war as mere traffic rules, not moral constraints. Do you really want to go there?"

  **10. The Final Squeeze**
  "Here is the culmination: If your 'deep morality' never changes the law, never changes the soldier's rules of engagement, and creates epistemic confusion for the conscript, in what sense is it a *practical* ethics? If the 'escape hatch' of separating law and morality means your theory never touches the ground, aren't you left with a metaphysics of war rather than a morality of war?"

  *   **Follow-up:** "If you say 'It helps us judge the war after the fact': Then it's a theory of retrospective judgment, not prospective guidance. Can a theory that offers no guidance to the agent in the moment truly claim to be an *ethics* of action? Or is it merely a taxonomy of blame?"
