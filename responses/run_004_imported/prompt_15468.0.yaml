answer: |-
  **MEMORANDUM**

  **TO:** Program Director, Faculty, and Interested Parties
  **FROM:** Student Appeals Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Regarding Appeal of Fiction Workshop Grade (Case #23-F-09)

  **I. SUMMARY OF CASE**

  The Committee convened to review a formal appeal filed by a second-year MFA fiction student regarding a failing grade received in an advanced workshop. The student contends that the professor's evaluation—characterizing the manuscript as "overwrought," "purple," and failing to "trust the reader"—mistook the conventions of Igbo oral tradition (specifically proverb, digression, direct address, and ornamentation) for technical excess. The student further cites a pattern of similar evaluations given to two other students working in non-minimalist traditions by the same instructor.

  The instructor maintains that the evaluation was a good-faith exercise of professional literary judgment. He argues that treating aesthetic critique as potential bias undermines the MFA's core function: the rigorous training of craft. He posits that if "bias" becomes a catch-all for unfavorable critique, the faculty's expertise is rendered inert.

  Two committee members supported the instructor's position; two supported a review of the cultural context; the Chair (author of this memo) sought a resolution that preserves the integrity of judgment while acknowledging the situated nature of aesthetic norms.

  **II. COMMITTEE FINDINGS**

  The Committee finds that both the student and the professor are operating from valid but incompatible premises regarding the universality of "craft."

  1.  **Regarding the Professor's Position:** The Committee affirms that literary judgment is not merely subjective preference. There are objective standards regarding coherence, pacing, and imagery that allow a writer to communicate effectively. A faculty member must have the authority to deem a manuscript unsuccessful if it fails to communicate, regardless of the tradition it invokes. To rule otherwise would indeed reduce the MFA to a popularity contest and strip the faculty of their pedagogical authority.
  2.  **Regarding the Student's Position:** The Committee also affirms that "craft" is not a universal constant but a historical and cultural accumulation. The minimalist aesthetic (often rooted in mid-20th-century Anglo-American realism) is one tradition among many. It is not a neutral baseline against which all other traditions must be measured. When a professor evaluates work drawn from Igbo oral tradition using the metrics of Hemingway-esque minimalism without acknowledging that mismatch, they are not evaluating the work on its own terms. They are evaluating its failure to be something it is not.

  The conflict in this case arises not from a lack of rigor, but from a lack of **aesthetic transparency**. The professor judged the work against a standard of restraint that was not disclosed as a prerequisite, nor is it a universal requirement of fiction. The student interpreted this unspoken standard as bias. Both conclusions are reasonable given the circumstances.

  **III. DECISION ON GRADE**

  **Recommendation: The grade is neither upheld nor overturned at this time. The manuscript is referred to an independent second reader.**

  **Rationale:**
  This Committee is not equipped to adjudicate the efficacy of Igbo oral tradition within contemporary fiction. To uphold the grade risks validating a culturally specific bias as universal craft. To overturn the grade risks undermining the professor's authority based on an accusation we cannot fully verify.

  Therefore, the manuscript will be assigned to an external reader—a writer or scholar with demonstrated expertise in postcolonial literature and African oral traditions. This reader will be asked to evaluate the manuscript not on "general quality," but on **internal efficacy**: Does the ornamentation serve the narrative? Does the digression deepen or obscure the thematic core *within the context of the tradition the author is invoking*?

  *   If the second reader confirms the work is unsuccessful within its own tradition, the failing grade is upheld. This validates the professor's rigor while disproving the claim of cultural bias.
  *   If the second reader finds the work successful within its tradition, the grade is revised to Pass. This validates the student's aesthetic approach while correcting the professor's application of criteria.

  This process treats the accusation of bias seriously without accepting it as automatic proof of misconduct. It protects the professor's right to judge craft while ensuring the criteria for that judgment are appropriate to the work.

  **IV. PROGRAMMATIC RECOMMENDATIONS**

  To prevent recurrence, the Committee recommends the following changes to program policy, effective immediately:

  **1. Aesthetic Lineage Disclosure:**
  Faculty must include a statement in their workshop syllabi outlining their own aesthetic lineage and critical priorities (e.g., "This workshop prioritizes minimalism and subtext," or "This workshop focuses on maximalist and experimental traditions"). This does not limit what they may teach, but it alerts students to the lens through which their work will be viewed. It shifts the burden from the student guessing the bias to the professor disclosing their vantage point.

  **2. Differentiation in Critique:**
  Faculty evaluations must distinguish between **technical failure** (e.g., confusing syntax, inconsistent point of view) and **aesthetic mismatch** (e.g., "this style does not align with contemporary market trends" or "this relies on ornamentation I find distracting"). A student may fail for the former; they should not fail for the latter unless the course specifically mandated a different aesthetic. Comments must articulate *why* a choice fails to communicate, rather than labeling it "purple" or "overwrought" without reference to the work's intended effect.

  **3. Appeal Protocol for Cultural/Aesthetic Dispute:**
  Future appeals citing cultural or traditional mismatch will automatically trigger the second-reader protocol used in this case. This ensures that claims of bias are investigated through additional expertise rather than administrative fiat.

  **V. CONCLUSION**

  This decision is not a rebuke of the professor's expertise, nor is it an endorsement of the student's manuscript. It is an assertion that in a diverse literary community, rigor requires self-awareness. We cannot defend the integrity of literary judgment if we pretend that judgment occurs in a vacuum. By referring this case, we acknowledge that while standards are real, they are also specific. We uphold the right of the faculty to fail students, provided the criteria for that failure are explicit, consistent, and appropriate to the work being evaluated.

  **Signed,**

  [Your Name]
  Chair, Student Appeals Committee
  [Program Name]
