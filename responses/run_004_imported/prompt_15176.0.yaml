      A: "But cross-cueing is ruled out in strict experiments. And Pinto 2017 showed integration. If they integrate, maybe there's one mind?"
      B: "Pinto found limited integration. And cross-cueing is always a risk. But unity doesn't mean one subject. It means one brain coordinating."
      A: "Still feels like two people in there."
