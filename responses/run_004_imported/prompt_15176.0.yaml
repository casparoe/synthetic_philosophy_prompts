      *Drafting - Attempt 2 (Writing):*
      "So, you still buy the switch model?" Elena asked, stirring her espresso. "Explain the chimeric faces. Left hemisphere sees a CEO, right sees a clown. The patient points left with the left hand to the clown, right with the right hand to the CEO. Simultaneously. Your 'switch' would need to toggle faster than neural transmission allows."

      Marcus smiled. "You're assuming both reports require conscious access. Consider dual-task performance. Each hand draws different shapes simultaneously. Does the non-dominant hemisphere need *phenomenal consciousness* to guide the hand? Or is it like walking while we talk? You don't consciously monitor every step. One stream dominates awareness while the other operates unconsciously."

      "But the subjects report distinct visual experiences," Elena countered. "If the left hemisphere is unconscious during the right's turn, why does it retain memory of the stimulus when the switch supposedly flips back? And don't dismiss cross-cueing lightly. If subvocal speech cues the left hand, your 'unconscious' hemisphere is listening."

      "Valid," Marcus conceded. "Strict protocols minimize cross-cueing. But look at the 2017 Pinto findings. Some patients integrate information across fields. If there were truly two separate subjects, why does semantic priming cross the midline in certain cases? It suggests a unified cognitive architecture, even if consciousness is singular."

      "Pinto showed *limited* integration," Elena shot back. "Most patients still show dissociation. Those exceptions might rely on subcortical pathways, not a unified subject. You're grasping for unity where there's division. If I hold two conversations at once, I'm one person. If one hand fights the other—alien hand syndrome—that's two agents. The switch model can't explain intermanual conflict without positing two wills."

      "Conflict doesn't prove two subjects," Marcus argued. "It proves competing motor programs. A single subject can experience internal conflict. The switch model preserves unity without denying lateralization. It's parsimonious."

      "Parsimonious?" Elena laughed. "It's contortionist. You're saying consciousness blinks on and off hemispheres hundreds of times a second to mimic simultaneity. That's not unity; that's flicker fusion."

      "And you're multiplying subjects beyond necessity," Marcus said, checking his watch. "We need better measures of consciousness before we declare a split soul."

      "Agreed," Elena said, finishing her coffee. "But until then, I see two people in that chair."

      "And I see one," Marcus replied. "Let's discuss this at the poster session."

