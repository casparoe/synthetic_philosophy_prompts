      *   *Key Philosophical Concepts:*
          *   **Principle of Sufficient Reason (PSR):** Nothing is without a reason. Wasted potential lacks a reason.
          *   **Teleology:** The world has a purpose.
          *   **Theodicy:** Justifying the "evil" of wasted life.
      *   *Comparison with Ontological Proof:*
          *   Ontological = Static, Definitional, Modal.
          *   Afterlife = Dynamic, Teleological, Ethical.
          *   Common Root = Rationalism (Reality conforms to Reason).
      *   *Gödel's Specific Flavor:* Mention his Platonism. Concepts exist independently. The "concept" of a human isn't finished at death.
      *   *Conclusion:* Summarize. It's not a proof for skeptics, but a consistency check for believers in rational order.

  7.  **Refining the Tone:**
