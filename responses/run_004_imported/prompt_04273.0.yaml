prompt: |-
  ok so for english class we had to read this excerpt from locke's 'some thoughts concerning education' where hes talking about how you shouldn't bribe kids with candy or toys for behaving, bc it just teaches them to love the wrong things, and that you should use esteem and shame instead to actually motivate them. my little sister's elementary school does basically the opposite of what he wants, they use this app called classdojo where the teacher hands out points for good behavior and the kids trade them in for prizes at the end of the week. what would locke actually say about something like that specifically? like not just "ooh scary technology" but his actual reasoning for why that setup would mess kids up (or would he secretly be fine with it for some reason im not seeing?)
reasoning: |-
