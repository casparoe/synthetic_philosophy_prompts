          *   *Critique:* Too simple.
          *   *Draft 2:* In normal trade, contracts enforce things. Here, there's no enforcement. How do you guarantee they simulate you correctly and follow through?
          *   *Refinement:* Focus on the "logical correlation" aspect. If I change my mind, does their simulation change?
