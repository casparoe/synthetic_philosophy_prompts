          *   *Refinement:* Frame it as the "logical mirror." If cooperation is incentivized by logical correlation, isn't capitulation to threats also incentivized?
          *   *Likely Answer:* "We need to pre-commit to not responding to blackmail."
          *   *Follow-up:* "How do you distinguish a legitimate trade offer from a blackmail threat before you've already committed?"

