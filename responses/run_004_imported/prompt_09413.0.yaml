      *   *Is the distinction between "uncertainty about reward" and "uncertainty about whether shutdown is good" clear?* Need to make sure I explain that the agent infers the value of shutdown *from* the human's action, based on reward uncertainty.
      *   *Make sure to mention MIRI's specific concerns.* They focus on structural guarantees, not just incentive compatibility under ideal assumptions.

