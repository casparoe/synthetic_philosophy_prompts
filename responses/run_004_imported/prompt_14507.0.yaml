      *   Strengthen the stakes. Why does it matter? Money? Protection? Let's go with protection. If it's one species, the common end dilutes the protection for the rare end. If it's two, the hybrid zone is a legal nightmare.
      *   Make the ring concrete. The "Obsidian Caldera." The "Ash Skink."

  8.  **Final Polish:**
