      *   The ending should feel heavy. The pen hovering over the checkbox.

  5.  **Writing - Focus on Voice and Imagery:**
      *   *Voice:* Clinical but weary. Scientific precision clashing with ontological uncertainty.
      *   *Imagery:* The gradient of color on the lizards. The circle on the map. The red tape.
      *   *Key moment:* Watching two lizards from opposite ends of the ring refuse to mate, while their neighbors elsewhere would have accepted them.

