answer: |-
  The smell of the collection room was always the same: formaldehyde, dust, and the sweet, dry scent of old paper labels. Elias Vane sat at the metal table, the glow of the desk lamp cutting a circle into the gloom. Before him lay twelve glass jars, arranged in a semicircle like jurors waiting for a verdict.

  Inside each jar, suspended in ethanol, was a salamander. They were *Caudata circumdata*, the Valley Ring Salamander. From left to right, the specimens changed. The first was pale cream with faint speckling. The next was slightly darker, the speckles merging into stripes. By the middle, the stripes were bold black against orange. By the end of the row, the orange had faded to yellow, and the black had softened to brown.

  And then there was the thirteenth jar, sitting outside the arc. It looked like the first one, but not quite. Cream, yes, but with a different head shape. Broader. Aggressive.

  Elias rubbed his eyes. The deadline for the Federal Conservation Listing was 8:00 AM. If he listed *C. circumdata* as a single species, the entire ring around the Kuro Valley would receive protection. That meant halting logging on the western ridge, stopping the mining operation on the eastern slope, and freezing development all the way around the basin. The economic pushback would be immense.

  If he listed them as two species—the Northern Cream and the Southern Cream, meeting at the valley floor—only the endangered Southern population would get full protection. The Northern ones were plentiful. But where they met, here in the valley bottom, they coexisted without interbreeding. They ignored each other. Yet, if you walked ten miles north, the Northern Cream bred freely with the Orange-Stripes. Walk ten miles south, the Southern Cream bred freely with the Yellow-Browns. Follow the chain around the mountain, and the Orange-Stripes eventually became the Yellow-Browns.

  Nature had drawn a circle. The law required a line.

  His phone buzzed on the table. A text from his department head: *Agency rep is asking for the draft taxonomy. Can we lock it in tonight?*

  Elias didn't reply. He picked up the first jar and the last jar, holding them up to the light. Genetically, they were distinct enough to be considered separate species by standard barcoding thresholds. Behaviorally, they were incompatible. He had watched them in the terrariums yesterday. The male from Jar 1 approached the female from Jar 13 with the usual courtship shuffle. She had bitten him. Hard. No gene flow. Reproductive isolation was complete.

  By the textbook definition, they were two species.

  But then he looked at the middle jars. Jar 6. The Orange-Stripe. It could breed with Jar 5. Jar 5 could breed with Jar 4. All the way down to Jar 1. And Jar 6 could breed with Jar 7, all the way up to Jar 13. The genetic material flowed around the valley like water in a pipe, a continuous stream of DNA. If Jar 1 and Jar 6 are the same species, and Jar 6 and Jar 13 are the same species, then Jar 1 and Jar 13 must be the same species.

  Except they weren't.

  Elias put the jars down. The glass clinked, a sharp sound in the quiet room. He pulled up the map on his laptop. A red line traced the elevation contour around the Kuro Valley. Pins marked the collection sites. It was a perfect loop, broken only by the sheer cliffs of the valley floor where the two ends touched.

  He opened the listing form. Field 4: *Taxonomic Unit.*

  If he wrote *Caudata circumdata*, he saved the whole ring. He saved the connectivity. He acknowledged the continuum. But he also gave protection to the abundant Northern populations that didn't need it, guaranteeing a lawsuit from the logging consortium that would tie up the protection in courts for a decade. During that decade, the Southern population—the rare one, the one being crushed by development—would go extinct.

  If he wrote *Caudata borealis* and *Caudata australis*, he split them. The logging company would accept it; they could keep cutting on the north ridge. The Southern population gets immediate protection. But legally, the hybrid zone—the place where the two ends met—became a nightmare. Were the hybrids protected? If a Northern male wandered south and mating failed, was it a behavioral barrier or a geographic one? If the climate shifted and the ring broke, did the species cease to exist?

  He was being asked to carve a joint where there was only muscle.

  Elias stood up and walked to the window. Outside, the campus was dark. Somewhere out there, beyond the city, the valley slept. The salamanders didn't know they were a paradox. They just lived where they lived. They bred where they could. The contradiction existed only because humans needed to name things to own them, to protect them, to manage them. The concept of "species" was a net thrown over a river; it caught some water, but the water flowed through regardless.

  He thought about his dissertation, ten years ago. He had wanted to find the boundary. He had spent three summers hiking the ridge, taking blood samples, measuring limb lengths, recording mating calls. He had hoped to find the break point where one species became another. A clear line. A cliff in the data.

  Instead, he found a slope.

  He returned to the desk and picked up his pen. The form required a binary choice. *Single Taxonomic Unit* or *Multiple Taxonomic Units*. There was no box for *It Depends on Where You Stand*.

  He looked at Jar 1 and Jar 13 again. They sat side by side now. They looked different. They acted different. If he ignored the middle jars, the choice was easy. They were different. But he couldn't ignore the middle. The middle was the history. The middle was the proof that they were the same blood, stretched thin over miles and generations.

  To protect the salamanders, he had to lie about them.

  If he called them one species, the law would protect the connection, but the economic backlash might destroy the funding needed to enforce it. If he called them two, the law would save the rare end, but it would legally sever the evolutionary process that created them. It would treat the ring as a static thing, when it was a dynamic event.

  The clock on the wall ticked. 11:45 PM.

  He opened a new document. He began to type the justification. He wrote about the reproductive isolation at the contact zone. He wrote about the genetic divergence. He cited the Biological Species Concept. Then he stopped. He deleted the citation.

  He typed about the ecological connectivity. He wrote about the risk of fragmentation. He cited the Endangered Species Act's mandate to preserve ecosystems, not just names.

  He hovered over the keyboard. The cursor blinked in the box for *Taxonomic Status*.

  He imagined the logging company's lawyers. They would seize on any inconsistency. If he claimed they were one species, they would point to the lack of interbreeding at the valley floor. If he claimed they were two, conservationists would point to the genetic continuity around the ridge. There was no safe position. There was only the position that offered the best chance of survival for the creatures in the jars.

  Elias looked at the specimens. The ethanol had turned slightly yellow over the years. These individuals were dead, but their kin were out there, moving through the leaf litter, oblivious to the boundaries drawn on maps.

  He realized that the species problem wasn't a puzzle to be solved. It was a tension to be managed. It was the friction between the way the world was and the way humans needed the world to be.

  He took a breath. He didn't check the box for *Single* or *Multiple*. Instead, he typed a designation code used for distinct population segments, a loophole that allowed protection without a full species classification. It was messy. It was unconventional. It would invite scrutiny. It would require him to defend every word in court.

  But it kept the ring intact. It acknowledged the difference without denying the connection.

  Elias hit *Save*. The file name blinked: *Circumdata_Listing_Draft_v12*.

  He closed the laptop. He didn't feel like he had found the truth. He felt like he had negotiated a treaty with a reality that didn't care about treaties. He picked up Jar 1 and Jar 13 and placed them back on the shelf, side by side. They remained distinct. They remained connected. And tomorrow, the law would pretend that made sense.

  Elias turned off the lamp. In the darkness, the jars disappeared, but he knew they were still there, waiting for the light to define them again.
