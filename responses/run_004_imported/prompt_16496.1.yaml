answer: |-
  This is a fantastic question. You've hit on one of those subtle pivot points in game theory where the math stays clean, but the philosophical underpinnings shift beneath your feet. Your intuition is spot-on: moving from pure-strategy domination to mixed-strategy domination *does* import a heavier assumption about rationality.

  Since you're an engineer, I'm going to skip the philosophical jargon and give you the **portfolio intuition**, the **geometric picture**, and then the **system architecture view** of why the player count matters.

  ### 1. The Portfolio Intuition: Why $M$ is "Inefficient"

  In your example:
  *   $T = (4, 0)$
  *   $M = (1, 1)$
  *   $B = (0, 4)$

  You noted that $M$ feels "safe." In pure strategies, $M$ guarantees a 1. $T$ and $B$ are volatile; they could give you 0. So, eliminating $M$ feels like eliminating safety.

  **The Shift:** When we allow mixed strategies, we are no longer treating strategies as discrete "moves." We are treating them as **assets in a portfolio**.

  Imagine $T$ and $B$ are two stocks.
  *   Stock $T$ pays \$4 in Market Condition L, \$0 in Condition R.
  *   Stock $B$ pays \$0 in Market Condition L, \$4 in Condition R.
  *   Asset $M$ is a bond that pays \$1 regardless of the market.

  If you are forced to hold only one asset, $M$ looks attractive because it has low variance. But if you are allowed to hold a **portfolio** (a mixed strategy), you can buy 50% of $T$ and 50% of $B$.
  *   In Condition L: You get $0.5 \times 4 + 0.5 \times 0 = \$2$.
  *   In Condition R: You get $0.5 \times 0 + 0.5 \times 4 = \$2$.

  Suddenly, your "diversified portfolio" of risky assets yields \$2 in *every* scenario, which strictly beats the "safe" bond yielding \$1.

  **The Conceptual Takeaway:**
  Pure-strategy domination asks: "Is there a single better tool?"
  Mixed-strategy domination asks: "Is this tool **efficient** given I can build a composite tool?"

  $M$ isn't eliminated because it's "risky"; it's eliminated because it's **redundant**. It lies strictly inside the performance envelope created by $T$ and $B$. In optimization terms, $M$ is not on the **Pareto frontier** of achievable payoffs. If your agent is an expected-utility maximizer (which is the standard assumption in RL and auctions), it *must* prefer the portfolio $(0.5T, 0.5B)$ over $M$. Keeping $M$ would be like keeping cash in a vault yielding 0% when you have a risk-free arbitrage yielding 2%.

  ### 2. The Geometric Picture: The Convex Hull

  If you like visual debugging, imagine a 2D graph.
  *   **X-axis:** Payoff if Column plays L.
  *   **Y-axis:** Payoff if Column plays R.

  Plot your strategies as points:
  *   Point $T$ is at $(4, 0)$.
  *   Point $B$ is at $(0, 4)$.
  *   Point $M$ is at $(1, 1)$.

  Now, draw a line connecting $T$ and $B$. This line represents every possible mixed strategy between $T$ and $B$. The midpoint is $(2, 2)$.

  **The Rule:** A pure strategy is undominated (by mixed strategies) if and only if it is a **vertex of the convex hull** of all strategy points.
  *   $T$ and $B$ are vertices (corners).
  *   $M$ is strictly *inside* the triangle formed by the origin, $T$, and $B$ (or just below the line segment $TB$).

  Because $M$ is "under the tent" formed by $T$ and $B$, there is always a combination of $T$ and $B$ that sits "higher" (more payoff) than $M$. The geometric intuition is that mixed strategies "fill in the space" between pure strategies. If a pure strategy is buried inside that filled space, it's mathematically obsolete.

  ### 3. The Assumption Check: You Were Right

  You suspected that mixed-strategy domination imports a bigger assumption. **You are correct.**

  *   **Pure Strategy Domination:** Only requires **ordinal preferences**. (I prefer 4 to 1). It doesn't matter how much I prefer it, just that I do.
  *   **Mixed Strategy Domination:** Requires **Expected Utility Theory (von Neumann-Morgenstern)**. It assumes you value a 50% chance of 4 and 50% chance of 0 as *exactly* the average (2).

  If a player is "risk-averse" in a non-linear way (e.g., they value the certainty of 1 much more than the gamble of 2), then $M$ is *not* dominated for them. But standard game theory (and most multi-agent RL) assumes risk-neutrality over the payoff scale. In your work with auctions, this is usually fine because agents are optimizing for long-run average revenue/profit, where the Law of Large Numbers makes the Expected Value the only metric that matters.

  ### 4. Rationalizability and the "Common Knowledge" Link

  Now, let's tackle the second part of your bug: **Rationalizability** and why player count ($N$) matters.

  **What is Rationalizability?**
  It's the set of strategies a player can use if:
  1.  They are rational.
  2.  They believe opponents are rational.
  3.  They believe opponents believe *they* are rational.
  4.  ...and so on, infinitely.

  **The 2-Player Magic:**
  In a 2-player game, **Iterated Elimination of Dominated Strategies (IEDS)** and **Rationalizability** result in the exact same set of surviving strategies.
  *   *Why?* In 2-player, my uncertainty is just about *you*. If a strategy is not dominated, there exists *some* belief about your move that makes my strategy a best response.
  *   If I know you are rational, I know you won't play dominated strategies. So I update my belief to only include your undominated strategies. This might make *my* previously safe strategies now dominated. We iterate.
  *   In 2-player land, "Not Dominated" $\iff$ "Best Response to Some Belief." The math aligns perfectly.

  **The 3-Player Break:**
  When you add a third player, the equivalence breaks. Rationalizability becomes a **stricter** subset than IEDS. Some strategies survive IEDS but are not rationalizable.

  **The Intuition: Correlation of Beliefs.**
  *   **In 2-Player:** My belief is a probability distribution over *your* strategies. There's no structure to it.
  *   **In 3-Player:** My belief is a probability distribution over **Player 2 AND Player 3's joint strategies**.

  Here is the wrinkle: Standard rationalizability usually assumes **independent beliefs**. I assume P2 and P3 choose their strategies independently of each other (unless they have a explicit communication channel).
  However, **IEDS doesn't care about independence.** It just asks, "Is there *any* mix of my strategies that beats this one, regardless of what P2 and P3 do?"

  **The Scenario:**
  Imagine a strategy $S$ for Player 1.
  *   $S$ is only a good idea if P2 and P3 **correlate** their actions (e.g., if P2 plays Left, P3 plays Left).
  *   If P2 and P3 act independently, $S$ is terrible.
  *   **IEDS:** Since there *exists* a scenario (P2/P3 correlate) where $S$ works, $S$ is not dominated. It survives IEDS.
  *   **Rationalizability:** If we assume P2 and P3 are independent rational agents without a coordination mechanism, I cannot rationally believe they will correlate. Therefore, $S$ is not a best response to any *reasonable* belief. $S$ gets eliminated by rationalizability.

  **Engineering Analogy:**
  Think of IEDS as a **static code analyzer**. It checks if a block of code is unreachable under *any* possible input combination.
  Think of Rationalizability as a **runtime constraint checker**. It checks if a block of code is reachable given the *actual protocol* of how the other services interact.
  In a 2-service system, "any input" and "protocol inputs" are the same. In a 3-service system, the services might have constraints on how they interact with each other that the static analyzer (IEDS) doesn't see, but the runtime logic (Rationalizability) does.

  ### 5. Why This Matters for Your Work (Auctions & RL)

  You mentioned you work on auctions and multi-agent RL. Here is the practical translation:

  1.  **Action Space Reduction:** In your RL agents, you can safely prune actions that are mixed-strategy dominated. Your example $M$ is dead weight. The policy gradient will eventually learn to play the $T/B$ mix, but pruning $M$ upfront speeds up convergence and reduces variance.
  2.  **Mechanism Design:** If you are designing an auction, you want truth-telling to be a dominant strategy. If you only check pure strategies, you might think your mechanism is safe. But if bidders can randomize (bid shading strategies), you need to check mixed domination to ensure stability.
  3.  **The $N$-Player Warning:** If you are simulating a market with many agents, be careful assuming that "surviving strategies" (IEDS) are the only ones you'll see. In complex multi-agent environments, agents might learn correlated behaviors (implicit collusion) that make "dominated" strategies viable in practice, even if theory says they shouldn't be. This is often where sim-to-real gaps come from in MARL.

  ### Summary
  *   **Mixed Domination:** It's not about safety; it's about **efficiency**. $M$ is dominated because a portfolio of $T$ and $B$ creates a "super-strategy" that outperforms $M$ in every state. Geometrically, $M$ is inside the convex hull of the others.
  *   **Assumption:** Yes, it assumes Expected Utility (risk neutrality over the payoff scale).
  *   **Rationalizability:** In 2-player games, it's identical to IEDS. In $N$-player games, Rationalizability is stricter because it accounts for the **independence of opponents' beliefs**, whereas IEDS allows for worst-case correlation among opponents.

  You didn't miss anything; you just spotted the seam where the abstract math meets the assumptions about how agents model uncertainty. That's exactly where the interesting engineering problems live.
