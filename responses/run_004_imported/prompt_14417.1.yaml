answer: |-
  **A Postscript to the Refutation of Time**

  I have been told that in the present century, a man of science named Carlo Rovelli has undertaken a task not unlike my own in that old essay, now faded and yellowed by the years: the refutation of time. I confess I approached his volume, *The Order of Time*, with a certain trepidation. To argue against time is to argue against the very substance of our experience, a task that has consumed metaphysicians from Zeno to McTaggart, usually with the result that they are ignored by the common run of humanity, who continue to age and die regardless of the validity of their syllogisms.

  My own argument, if I recall it correctly, rested upon two pillars: the idealism of Berkeley, which denies matter independent of perception, and the skepticism of Hume, which denies a self independent of perceptions. If there is no material world to endure, and no spiritual self to persist, then the connection between one moment and the next dissolves. We are left with a shower of discrete presents, self-sufficient and unconnected. Time, I concluded, is a trick of memory and language. Yet, I ended in a paradox: logically, time may not exist; tragically, we cannot help but feel it flowing through us like a river.

  Now, this Italian physicist proposes a different geometry. He suggests that at the fundamental level of the universe, the variable $t$—time—does not appear. It is not merely hidden; it is absent. He claims that what we perceive as the flow of time is a consequence of entropy, of thermodynamics, and of our own "coarse-grained" vision. We see the world blurred, he says, and from that blurring, time emerges. He calls this "thermal time."

  At first glance, this seems a vindication of my own youthful speculations. If time is a product of our "blurred" perspective, is it not, in effect, a product of the mind? If the universe in itself is a timeless network of events, and time only arises when an observer interacts with it through ignorance, then Rovelli is smuggling idealism into the laboratory. He is saying that time is not *out there*, but *in here*, in the relationship between the observer and the system. This pleases me. It suggests that the physicists, in their quest for the ultimate furniture of the cosmos, have stumbled upon the ancient truth that the world is not separable from the witness.

  However, I must press further. In my refutation, I sought to eliminate the *substance* of the world along with the time. I argued that to remove time is to remove the stage upon which things persist. Rovelli, it seems to me, is more timid. He removes the time, but he keeps the stage. He speaks of "the universe," of "quantum fields," of "entropy." These are new names for the old idol of Matter. He posits a reality that is robust, mind-independent, and real, which merely *appears* to have time because we are clumsy observers.

  Here lies the divergence. For the idealist, there is no "clumsy observer" distinct from the "reality observed." There is only the perception. Rovelli retains a dualism: there is the Fine Truth (timeless quantum gravity) and the Blurred Experience (thermodynamic time). He believes the Fine Truth is the *real* one. But on what grounds? If time is illusory, then the "before" and "after" required to define a thermodynamic gradient are also illusory. Entropy requires a direction. If there is no time, in what sense does entropy increase? He says it increases relative to a state. But a state implies a configuration *in* a system. If the system is timeless, it simply *is*. To say it "has" entropy is to sneak time back in through the window of language.

  I suspect Rovelli wishes to have his cake and eat it. He wants the mystical comfort of a timeless eternity—the *sub specie aeternitatis* of the philosophers—while retaining the solid ground of scientific realism. He wants to tell us that the world is real, even if time is not. But a world without time is not a world; it is a static jewel, a crystal of events. To say that we "move" through this crystal, or that our ignorance "creates" the flow, is to invoke a ghost. Who is the "we" that is blurred? If the self is also a coarse-grained approximation, as Hume would have it and as Rovelli hints, then who is there to be ignorant?

  And yet, I find a strange poetry in his "thermal time." To say that time is heat, that it is the friction of our ignorance rubbing against the infinite... this is a metaphor worthy of the poets. It aligns with my suspicion that time is a feeling, a sensation of wear, of decay. Rovelli gives us a physics of decay without a metaphysics of permanence. He tells us that we are not swept by a river, but that we are the heat generated by the water's resistance.

  But does this comfort us? In my essay, I admitted that even if I proved time did not exist, I continued to feel the ache of waiting, the horror of the future, the loss of the past. Rovelli explains *why* we feel this—because we are macroscopic beings bound by entropy—but he does not refute the *feeling*. He validates the prison while telling us the bars are made of statistics.

  Perhaps he is right, and I was wrong to think the refutation could be total. Perhaps one can excise time from the equations while leaving the suffering intact. But I remain suspicious of his "universe." It smells of the Absolute, of that vast, cold Substance that Spinoza worshipped and Berkeley rightly dismantled. Rovelli has killed the Father (Time) but kept the Estate (The Universe). I, in my younger arrogance, tried to burn the Estate down to prove the Father was a ghost.

  In the end, we arrive at the same shore. Whether time is a trick of the mind or a trick of thermodynamics, the evening comes. The book closes. The physicist puts down his chalk, and I put down my pen. We are both tired. Rovelli says this tiredness is entropy. I say it is the weight of the unreal. It matters little to the bones. I am still made of time, even if he insists I am made of heat. The river still carries us, even if he claims the water is still and only our eyes are moving. To know that the river is an illusion does not keep us from drowning.

  Buenos Aires, 1984 (or perhaps merely a date we agree upon for convenience).
