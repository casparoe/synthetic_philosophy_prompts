      *   This is a classic example of the **Doctrinal Paradox** (or Discursive Dilemma) in social choice theory and legal philosophy.
      *   *Scenario:* A group needs to decide on a conclusion ($C$) that depends on two premises ($P_1$ and $P_2$), where $C = P_1 \land P_2$.
      *   *Outcome-based voting:* Vote directly on $C$. (Majority says Yes).
