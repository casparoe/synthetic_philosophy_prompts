answer: |-
  You are not bad at writing rules. In fact, you have stumbled directly into one of the most famous and difficult problems in the history of Artificial Intelligence and the Philosophy of Mind.

  What you are experiencing has a name: **The Frame Problem.**

  Your intuition is spot-on: this is exactly what your philosophy of mind class is touching on. The struggle you are having with your smart home is a microcosm of the struggle researchers faced in the 1960s and 70s when they tried to build human-like intelligence using symbolic logic.

  Here is the breakdown of why this is happening, why your roommate is better at it than your code, and whether there is a fix.

  ### 1. The Frame Problem: Why Rules Don't Converge
  In the 1960s, AI researchers realized that if you tell a robot to "pick up the battery," it needs to know that picking up the battery doesn't also change the color of the walls, the location of the moon, or the fact that there is a bomb on the same wagon as the battery.

  The **Frame Problem** is the challenge of determining which facts remain unchanged (stay in the "frame") and which change when an action is performed. In a closed system (like chess), this is easy. In the open world (like an apartment), it is theoretically impossible to list every exception.

  *   **Your Rule:** "Lock the door when I leave."
  *   **The Frame:** You assume the "leaving" context implies "I am not coming back in 2 minutes."
  *   **The Violation:** You step out to grab a pizza delivery.
  *   **The Patch:** "Lock door when I leave AND phone GPS is >100m away."
  *   **New Violation:** You leave your phone inside on the charger.
  *   **New Patch:** "Lock door when I leave AND phone is away OR no motion for 10 mins."
  *   **New Violation:** You are home, sitting perfectly still watching a movie.

  You are trying to use **explicit symbolic logic** to model a **fuzzy, contextual reality**. No matter how many exceptions you add, you cannot enumerate the infinite nuances of real life. The system doesn't converge because the world is open-ended, but your logic system is closed.

  ### 2. The Roommate: Embodied Cognition & Common Sense
  Your roommate handles "keep an eye on the place" effortlessly because she isn't running a script. She is using what philosophers and cognitive scientists call **common sense reasoning** or **embodied cognition**.

  *   **Intent vs. Syntax:** You are coding syntax (`IF motion = 0 THEN lights = off`). Your roommate understands intent (`Make sure the apartment doesn't burn down or get robbed`).
  *   **Relevance:** She intuitively knows what is *relevant* without being told. If she hears a smoke alarm, she knows that matters. If she hears a car drive by outside, she knows that doesn't matter. She doesn't need a rule that says `IF car_sound THEN ignore`.
  *   **Background Coping:** Philosopher **Hubert Dreyfus** argued that human intelligence isn't about manipulating mental symbols; it's about being immersed in a world. We know how to act based on our physical presence and social understanding. Your smart home hub has no body, no social understanding, and no intuition.

  In your philosophy class, this connects to the critique of **GOFAI (Good Old-Fashioned AI)**. GOFAI assumed intelligence was just processing symbols according to rules. Your smart home is GOFAI. Your roommate is a human. The fact that she succeeds where your code fails is evidence that human minds do not function like rule-based computer programs.

  ### 3. Is There a Fix?
  There is no perfect fix, because current consumer smart-home tech is fundamentally limited to the rule-based architecture that causes the Frame Problem. However, you can change your strategy to mitigate it.

  **A. Shift from Automation to Assistance (Human-in-the-Loop)**
  Stop trying to make the house act autonomously. Instead, make it notify *you* so you can use your human common sense.
  *   *Bad:* "Lock door automatically when I leave."
  *   *Good:* "Send notification to phone: 'Door unlocked and no motion detected. Lock it?'"
  *   *Why:* This offloads the Frame Problem to your brain, which is actually equipped to solve it.

  **B. Use "Scenes" Instead of Triggers**
  Instead of `IF/THEN` rules, create high-level state buttons.
  *   Create an "Away" button on your phone. When you leave, you tap "Away." This arms locks, turns off lights, and sets the thermostat.
  *   When you return, you tap "Home."
  *   *Why:* This acknowledges that *you* know the context better than the sensors do. You are defining the "frame" manually.

  **C. Probabilistic vs. Deterministic**
  Some newer systems use Machine Learning (like the Nest Thermostat used to) to learn patterns rather than follow rules. They guess what you want based on probability.
  *   *Pros:* Handles edge cases better.
  *   *Cons:* You lose control and don't know *why* it did something (the "Black Box" problem).

  ### 4. What This Means for Your Class
  You have a goldmine for your philosophy essays here. You are living through the **Symbol Grounding Problem** and the **Frame Problem**.

  *   **Daniel Dennett** wrote extensively on the Frame Problem. He noted that humans have a "relevance realization" mechanism that computers lack. We instantly know what matters.
  *   **John Haugeland** discussed how human intelligence is "existential"—it cares about the outcome. Your smart home doesn't care if you freeze or get robbed; it only cares if the boolean variable is `true` or `false`.

  ### Summary
  You aren't bad at coding. You are fighting a battle that stumped the greatest AI researchers of the 20th century. You are trying to force a rigid, logical structure onto a fluid, contextual world.

  **The Fix:** Admit defeat on full automation. Use your smart home to give you *superpowers* (remote locking, notifications, voice control), but don't ask it to make *decisions*. Keep the "mind" of the house in your head, where the Frame Problem is already solved.
