prompt: |-
  I cover science and ideas for a living, but on the side I sit on the grievance panel for our freelancers' union, and we've got a case this week thats trickier than it looks. A freelancer pitched a detailed, well-sourced story on a de-extinction startup to an editor, got a vague "we'll pass for now," and four months later the outlet ran a near-identical piece in-house, with no payment or credit to her. She's calling it idea theft; the editor says ideas aren't property, only the writing is, which is true as a matter of copyright law but feels like a dodge. The panel votes next week: uphold the grievance and settle on some remedy (payment? a byline? something else?), or dismiss it outright. Can you draft the memo I'll bring, with an actual recommendation and reasoning, that takes seriously why swiping someone's idea feels like a genuine wrong even though an idea isn't the kind of thing you can fence off the way a house or a manuscript is?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Science/Ideas Journalist & Freelancer Union Grievance Panel Member.
      *   **Task:** Draft a memo for the grievance panel regarding a specific case.
      *   **The Case:** A freelancer pitched a detailed, well-sourced story on a de-extinction startup. Editor said "pass." Four months later, the outlet ran a near-identical piece in-house (staff writer?), no payment/credit to the freelancer.
      *   **The Conflict:** Freelancer claims "idea theft." Editor claims "ideas aren't property" (legally true under copyright).
      *   **The Goal:** A memo with a specific recommendation (uphold/dismiss + remedy) and reasoning that bridges the gap between legal technicality (copyright doesn't protect ideas) and ethical/professional norms (swiping ideas feels wrong).
      *   **Tone:** Professional, persuasive, nuanced, empathetic to the freelancer but grounded in industry reality.

  2.  **Deconstruct the Ethical/Legal Tension:**
      *   *Legal Reality:* Copyright protects expression, not ideas. You can't copyright the concept of "de-extinction startup."
      *   *Professional Reality:* Journalism relies on trust and pitch etiquette. A detailed pitch often contains reporting, angles, sources, and structure. If the pitch is "well-sourced," it's more than just a concept; it's a blueprint.
      *   *The "Dodge":* The editor is hiding behind copyright law to avoid ethical responsibility.
      *   *The Harm:* Economic loss (freelancer didn't get paid), reputational loss (no byline), and chilling effect (freelancers stop pitching detailed ideas).

  3.  **Determine the Recommendation:**
      *   *Dismiss?* No. That validates bad faith behavior and hurts union members.
      *   *Uphold?* Yes.
      *   *Remedy?* Full kill fee or full payment? Since the story ran, full payment is fairer. A byline is tricky if a staff writer wrote it, but a "reported by" credit or correction note might work. Let's aim for full payment + credit where possible.
      *   *Reasoning:* Focus on *misappropriation of labor* and *breach of implied contract/good faith*, rather than strict copyright infringement.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the issue and the recommendation.
      *   **Statement of Facts:** Neutrally summarize what happened (Pitch -> Pass -> Publication).
      *   **The Core Question:** Frame the tension (Legal vs. Ethical).
      *   **Analysis/Reasoning:** This is the meat.
          *   Acknowledge the copyright law (don't pretend ideas are property).
          *   Reframe the issue: It's not about owning the *idea*, it's about appropriating the *labor* embedded in the pitch.
          *   The "Detailed Pitch" argument: A pitch with sources and structure is preliminary reporting.
          *   The "Good Faith" argument: The editorial relationship relies on trust. Using a pitch after rejecting it violates that trust.
          *   Precedent/Industry Standards: Mention SPJ, NUJ, or general freelance norms.
      *   **Recommendation:** Specific remedy (Payment + Credit).
      *   **Conclusion:** Final wrap-up on why this matters for the union.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe argue they stole the "structure."
      *   *Correction:* Structure is still close to copyright. Better to argue they stole the *reporting value* of the pitch. The freelancer did the legwork to find the angle and sources. The outlet saved money by using that legwork without paying.
      *   *Tone Check:* Ensure I don't sound like I'm giving legal advice. This is a union grievance, not a court. We enforce *contracts and norms*, not just federal law.
      *   *Key Phrase:* "Misappropriation of professional labor" instead of "Idea theft."

  6.  **Polishing the Language:**
      *   Use union/journalism terminology (kill fee, byline, misappropriation, good faith).
      *   Make it sound like it comes from a colleague who understands the craft ("We know that a pitch is often...")
      *   Ensure the distinction between "idea" and "reporting" is clear.

  7.  **Final Review against User Prompt:**
