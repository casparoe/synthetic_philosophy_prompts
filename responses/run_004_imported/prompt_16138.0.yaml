answer: |-
  **MEMORANDUM**

  **TO:** Freelancer Union Grievance Panel
  **FROM:** [Your Name], Panel Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation regarding Grievance Case #24-09 (Pitch Misappropriation)

  ### I. Executive Summary

  This memo concerns a grievance filed by a member freelancer against [Outlet Name]. The member submitted a detailed, sourced pitch regarding a de-extinction startup. The editor rejected the pitch ("we'll pass for now"). Four months later, the outlet published a story with near-identical scope, sources, and angle, produced in-house, with no compensation or credit offered to the member.

  The outlet's defense rests on copyright law: ideas are not property. While legally accurate, this defense ignores the professional norms and labor economics that govern freelance journalism.

  **Recommendation:** I recommend the panel **UPHOLD** the grievance. We should seek a remedy of **full standard payment** for the piece and a **negotiated credit** (e.g., "Additional Reporting" or a correction note).

  ### II. Statement of Facts

  1.  **The Pitch:** Member submitted a 400-word pitch including a specific narrative angle, three confirmed sources, and a breakdown of the scientific controversy.
  2.  **The Rejection:** Editor replied within two weeks stating the outlet would not commission the piece.
  3.  **The Publication:** Four months later, the outlet published a 1,200-word piece on the same startup, utilizing two of the three sources named in the pitch and following the same narrative arc.
  4.  **The Defense:** The editor contends that because the member did not write the final article, and because the "idea" of covering the startup is not copyrightable, no compensation is owed.

  ### III. Analysis: Beyond Copyright Law

  The editor's defense relies on a strict interpretation of the Copyright Act, which indeed protects *expression* but not *ideas*. If we were a court of law, the member might have a difficult time. However, this panel is not a court of law; we are a body tasked with enforcing **professional ethics, fair dealing, and the implied contract of good faith** between freelancers and editors.

  To dismiss this grievance based solely on copyright law is to accept a category error. We are not adjudicating intellectual property ownership; we are adjudicating **labor misappropriation.**

  **A. The Pitch as Preliminary Reporting**
  In science journalism, a "detailed, well-sourced pitch" is not merely an abstract idea. It is the result of preliminary labor. To identify a specific de-extinction startup, verify its claims, and secure source availability requires time and expertise. When a freelancer provides this in a pitch, they are providing value *before* the contract is signed. By utilizing the specific reporting legwork (sources, angle, structure) after rejecting the pitch, the outlet has consumed the value of that labor without paying for it.

  **B. The Breach of Good Faith**
  The freelance ecosystem relies on an implied covenant of good faith. When an editor says "we'll pass," the professional understanding is "we are not interested in pursuing this *at this time*." It is not an invitation to harvest the pitch for internal use. To reject a pitch and then assign it internally is a breach of trust that chills the willingness of freelancers to submit detailed proposals. It incentivizes outlets to use pitches as free R&D for staff writers.

  **C. The "Idea" vs. The "Blueprint"**
  The editor argues they stole only the "idea." This is a dodge. They did not steal the concept of de-extinction; they stole the specific *blueprint* for how to cover this specific company. If a contractor submits a blueprint for a house and the client says "no thanks," then builds that exact house using a different construction crew, the contractor is owed for the design work, even if they didn't lay the bricks.

  ### IV. Recommendation and Remedy

  I recommend the panel vote to **UPHOLD** the grievance. Dismissing this case sets a precedent that outlets may harvest freelance pitches for internal production without consequence, effectively devaluing the pitching process.

  **Proposed Remedy:**

  1.  **Compensation:** The outlet should pay the member the **full standard rate** for a story of that length and complexity.
      *   *Reasoning:* The outlet derived the full economic value of the story from the member's initial reporting and conceptualization. A "kill fee" is insufficient because the story *ran* and generated value for the outlet.
  2.  **Credit:** The outlet should append a note to the digital version of the story (e.g., "Initial reporting contributed by [Member Name]") or issue a correction acknowledging the source of the assignment.
      *   *Reasoning:* While a full byline may be contractually complex if a staff writer filed the copy, transparency is required to restore the member's reputational standing.
  3.  **Policy Change:** We should request the outlet adopt a written policy regarding pitch usage, specifically stating that rejected pitches will not be assigned internally for a period of no less than six months without compensation.

  ### V. Conclusion

  We must acknowledge that while an idea cannot be fenced like a house, the *labor* required to generate a viable story idea is real work. Copyright law is a floor, not a ceiling, for professional conduct.

  If we accept the editor's argument, we validate a practice where freelancers are expected to do the initial reporting risk for free, only to be bypassed if the story proves viable. This undermines the economic viability of freelance science journalism. Upholding this grievance signals that the union recognizes the value of the pitch not just as a request for work, but as a deliverable of professional labor in itself.

  I look forward to discussing this at the voting session.

  ***

  **Note to User:** *I am an AI, not an attorney or a union representative. This draft is for internal deliberation purposes and should be reviewed against your specific union bylaws, collective bargaining agreements (if any), and local labor laws before submission.*
