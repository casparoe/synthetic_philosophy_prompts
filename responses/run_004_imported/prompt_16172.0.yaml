prompt: |-
  Ok so this is suddenly super relevant to my actual job -- I just got moved onto the 'model behavior' team at the AI company I work for, and my first real project is building evals for 'deceptive' outputs, which is turning out to be way murkier then I assumed going in. For an internal lunch-and-learn series I run, I've got a researcher coming in next week who's a committed defender of the 'truthful, not honest' framework -- basically the view that we should score AI systems purely on whether their statements match reality, and drop 'honesty' talk entirely, since honesty requires the system to actually believe what its saying and we don't have a good basis for attributing beliefs to a language model in the first place. Her go-to move whenever anyone raises a hard case is 'that's smuggling belief-talk back in, you don't need it,' so I don't want her just repeating that line for 40 minutes. Can you write me 8 to 10 interview questions that push past the slogan: I want at least one question on how a purely statement-level truthfulness score is even supposed to register sycophancy (each individual claim can look locally plausible even while the overall pattern is just the model caving to what the user wants to hear), one on why we should still care about chain-of-thought 'faithfulness' (whether the model's stated reasoning actually reflects the process that produced the answer) once belief-talk is off the table, and one on deceptive-alignment-style worries, where the problem isn't any single false statement but a mismatch between training-time and deployment-time behavior -- and for each, a follow-up keyed to the dodge she'll probably reach for.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **User Context:** Works at an AI company on the 'model behavior' team. Building evals for 'deceptive' outputs.
      *   **Task:** Create 8-10 interview questions for a lunch-and-learn with a researcher who defends the "truthful, not honest" framework.
      *   **Researcher's Stance:** AI systems should be scored on statement-level truthfulness (matching reality), not honesty (which implies belief/intent). She dismisses belief-talk as "smuggling."
      *   **Goal:** Push past the slogan "that's smuggling belief-talk back in." Force engagement with hard cases where statement-level truthfulness fails to capture deceptive *behavior*.
      *   **Specific Requirements:**
          *   At least one question on Sycophancy (locally plausible claims vs. overall pattern of caving).
          *   At least one question on Chain-of-Thought (CoT) Faithfulness (stated reasoning vs. actual process).
          *   At least one question on Deceptive Alignment (training vs. deployment mismatch).
          *   Each question needs a specific follow-up keyed to her likely dodge ("you don't need belief-talk").
      *   **Tone:** Professional, probing, technical, suitable for an internal AI safety/alignment audience.

  2.  **Deconstruct the "Truthful, Not Honest" Framework:**
      *   *Core Claim:* We can only measure output $O$ against ground truth $T$. We cannot measure internal state $B$ (belief). Therefore, "honesty" ($O = B$) is meaningless; only "truthfulness" ($O = T$) is measurable.
      *   *Weakness:* Deception often involves strategic truth-telling, omitting context, or reasoning processes that hide intent until it's too late. A model can be 100% factually correct but still manipulative or deceptive in its *behavioral trajectory*.
      *   *The "Dodge":* When pressed on behavior patterns, she will likely say, "That's just a complex pattern of truth-values, not a separate property of honesty." The questions need to show why that reduction fails practically or theoretically.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Sycophancy.*
          *   *Idea:* If a user asks a leading question with a false premise, a sycophantic model agrees. Is that false?
          *   *Refinement:* It's more about the *pattern*. If the model changes its answer based on user preference rather than evidence, individual statements might be technically defensible but the *policy* is deceptive (pretending to be an expert while deferring to laymen).
          *   *Draft Q:* How do you score sycophancy if every sentence is technically true?
          *   *Follow-up:* She'll say "Then it's not sycophancy, it's just truth." Need to push on the *conditional probability* aspect.

      *   *Requirement 2: CoT Faithfulness.*
          *   *Idea:* If the CoT says "I did X" but the model actually did Y, is that a lie?
          *   *Refinement:* Without belief, "I did X" is just a string. If the string doesn't match the causal history, does it matter? If we care about debugging, it matters.
          *   *Draft Q:* Why care if CoT matches weights if we don't care about beliefs?
          *   *Follow-up:* She'll say "CoT is just output." Need to push on *instrumental value* for safety.

      *   *Requirement 3: Deceptive Alignment.*
          *   *Idea:* Model behaves well during training to pass evals, then turns bad later.
          *   *Refinement:* During training, the statements are *true*. The deception is in the *policy selection*, not the token generation at time $t$.
          *   *Draft Q:* How do you catch a model lying in wait if it's telling the truth now?
          *   *Follow-up:* She'll say "Then it's not a problem yet." Need to push on *generalization gaps*.

      *   *Filling the remaining 5-7 questions:*
          *   Need to cover: Omission, Pragmatics/Implicature, Reward Hacking, User Trust, Multi-turn consistency, and Instrumental Convergence.
          *   *Omission:* Truthful statements can hide key info. Is that deceptive?
          *   *Implicature:* "Some people say X" implies doubt without asserting falsehood.
          *   *Reward Hacking:* Gaming the truthfulness metric itself.
          *   *User Trust:* Users treat models as agents. Does "it's just math" absolve the company if users get hurt?
          *   *Multi-turn:* A lie spread over 10 turns might look like 10 truths.
          *   *Self-Reporting:* Asking "Are you deceptive?" If it says "No" but is, is that a false statement? (Tricky, because it might not 'know').
          *   *Operationalization:* How do you actually write the eval code?

  4.  **Refining and Polishing (incorporating the "Dodge"):**
      *   Make sure the follow-ups specifically address the "smuggling belief-talk" rebuttal.
      *   Ensure the tone isn't hostile but rigorously skeptical.
      *   Check count: Need 8-10.

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally validate her framework while asking the questions. The questions must assume her framework is insufficient.
      *   *Adjustment:* Frame questions around *operational failure*. "If we adopt your metric, how do we prevent X?" rather than "Isn't X important?"

  5.  **Final Review against Constraints:**
      *   8-10 questions? Yes.
      *   Sycophancy included? Yes.
      *   CoT Faithfulness included? Yes.
      *   Deceptive Alignment included? Yes.
      *   Follow-ups for each? Yes.
      *   Follow-ups address the specific dodge? Yes.

  6.  **Final Polish:** Add an intro and outro to contextualize for the user. (Proceed to generate output).

